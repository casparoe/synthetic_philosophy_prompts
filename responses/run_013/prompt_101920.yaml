prompt: |-
  Ok so this is a weird question from someone who's never taken a philosophy class in his life. I got made a team lead at work about four months ago, so now I'm the one doing performance reviews and breaking up fights between people on my team, and it has turned out to be way harder than I expected. Here's the thing that keeps happening and I can't find a word for it.

  Take one specific fact about a situation — the person did it on purpose, or what they did caused someone pain, or they told the truth even when it cost them. My gut says these things are obviously good or obviously bad. On purpose = worse. Caused pain = bad. Told the truth = good. Fine, easy. But then I keep hitting cases where the exact same fact is doing the opposite work, and not because something else is outweighing it. One person on my team comes to me and admits a mistake a coworker made, and I think, that took guts. Another person comes to me and admits a mistake a coworker made, and the very same truth-telling is what makes me trust them less, because of what it says about them that they couldn't keep their mouth shut. A guy on my team is intense and blows up when he thinks somebody's being picked on, and the intensity is exactly why I'm glad he's there; the same intensity in a different week is why I'm writing him up. When my mom had her hip replaced the pain was the whole point of it, the thing that was good about the situation. When my kid got hit in the face at school the pain was the entire reason it was bad.

  What's bugging me is that this isn't "context matters" in the boring sense. I get that you have to weigh stuff against other stuff. What I mean is the same single feature, all by itself, seems to flip from counting for to counting against depending on what else is going on, and I can't state any rule in advance for which way it'll point. I also notice it happening outside of moral stuff. "Lots of people believe it" is a reason to think something's true when those people are all in a position to know, and a reason to think it's false when they've all just been copying each other. Same feature, opposite direction.

  So does this have a name? I feel like people have definately argued about this for centuries and I just don't know what to google. I don't want a reading list, I want to understand the shape of the thing. If there is a name, tell me what it actually claims and, more importantly, what it's not. Is it the same as saying morality is relative? Same as saying rules have exceptions? Same as saying some reasons are stronger than others? Because none of those feel like what I'm describing — I already knew all three of those and they didn't cover it. Is there a name for the opposite view too, the one that says if a feature counts for something in one case then it has to count for it in every case? And does what I'm describing apply to reasons in general, reasons to believe stuff as well as reasons to do stuff, or is it specifically a claim about ethics? If there's no established word for it, coin one, define it, and tell me about the cases on the edge where I wouldn't be able to say either way.
reasoning: |-
  Okay, the user is a new team lead facing a philosophical dilemma in management. They're noticing that the same factual feature (like truth-telling or intensity) can flip from virtuous to problematic depending on context, and this isn't just about balancing competing factors—it's about the feature itself changing valence. They want to know if there's a name for this phenomenon.

  First, I need to pinpoint the core issue. They're describing valence inversion of reasons, where a property (e.g., causing pain) isn't inherently good or bad but derives its moral weight from context. This goes beyond simple relativism or exceptions—it's about the same feature being a pro in one scenario and a con in another without counterbalancing factors.

  The user explicitly rejects three common explanations: (1) moral relativism (they're not saying values change), (2) rules-with-exceptions (they emphasize it's not about overriding), and (3) stronger/weaker reasons (it's not quantitative weighting). So I must avoid those frameworks.

  I recall Dancy's particularism—the idea that reasons are holistic and context-dependent. This matches their examples perfectly: truth-telling being courageous vs. disloyal depending on relationships and circumstances. But I should also mention contributory reasons as a contrast to show why this isn't just about additive weights.

  For non-moral examples (e.g., popularity as evidence), I can connect it to epistemic reasons using the same holistic principle. The "herd immunity" vs. "herd mentality" contrast illustrates how the same fact has opposite inferential power.

  Naming it "contextual valence" would make it tangible for them. I'll define it clearly and emphasize that the inversion happens without new competing factors—which is what baffles them. Edge cases might include ambiguous social cues (e.g., a smile during bad news) where valence is indeterminate.

  Their underlying need seems to be validation that this complexity is normal in leadership. They're not looking for solutions but a framework to understand why gut judgments sometimes backfire. I'll acknowledge how exhausting this is for new managers while stressing it's a sign of nuanced thinking—not incompetence.

  Finally, I'll position this as a practical philosophy tool rather than academic theory. No jargon dumps; just clear parallels to their team conflicts and parenting examples. The coined term should feel useful tomorrow in their next performance review.
answer: |-
  You've hit on something profound that absolutely has a name in philosophy, particularly in ethics and epistemology (theory of knowledge). What you're describing is a core challenge to **atomistic** or **invariant** views of reasons and values. The established concept that best captures your insight is:

  **Moral (or more broadly, Normative) Particularism.**

  **Here's the breakdown, tailored to your experience:**

  1.  **The Core Claim:** Particularism argues that **the moral (or epistemic) valence of a feature (like truth-telling, causing pain, intensity) is not fixed and inherent.** It depends entirely on the specific context or "shape" of the entire situation. A feature that is a reason *for* an action or judgment in one situation can be a reason *against* it in another, or even no reason at all, simply because the other features present change its significance. Crucially, it's not just that other factors *outweigh* it; they fundamentally alter *what kind of reason it is*.
  2.  **Why it's NOT the things you mentioned:**
      *   **Not Just Moral Relativism:** Relativism says *values themselves* change depending on culture or individual. You're not saying the value of honesty or minimizing pain changes. You're saying the *same specific instance of truth-telling* can be good or bad depending on the *non-moral facts* surrounding it (e.g., the relationship between coworkers, the potential consequences, the motivations involved). The value remains constant, but its *manifestation* and *role* shift dramatically.
      *   **Not Just Rules with Exceptions:** Rules imply a default valence ("Honesty is good"). Exceptions are cases where the rule *doesn't apply* or is *overridden* ("...except when it causes undue harm"). Particularism says the valence *itself* isn't fixed by a rule. Truth-telling *isn't inherently good*; its goodness emerges *only* in contexts where its specific expression *is* good (e.g., courageously admitting your own mistake). In a context where it's disloyal gossip, the *very same act-type* manifests a bad-making feature. There's no "default" good truth-telling with exceptions; it's context that determines its valence *from the start*.
      *   **Not Just Stronger/Weaker Reasons:** This view assumes reasons have fixed weights that add up. "Causing pain" is always a negative weight, but sometimes outweighed by a huge positive weight (like healing). You're describing something different: "Causing pain" *isn't always a negative weight*. In the hip replacement, causing pain *is part of the positive process* – it's not a negative outweighed by a positive; it's *contributing positively* to the healing goal. The *reason-giving force* of the pain itself flips direction.
  3.  **The Opposite View:** The view Particularism argues against is often called **Generalism** or **Invariantism**. This holds that if a feature (like causing pain, telling the truth, acting intentionally) is a reason for/against something (e.g., judging an act wrong) in *one* case, it must be the *same type* of reason (e.g., always a wrong-making feature) in *every* case where it appears. Its *valence* is invariant. Generalists believe we *can* and *must* formulate moral rules or principles that capture these invariant reasons ("Causing pain is always prima facie wrong").
  4.  **Scope: Reasons in General:** This absolutely applies beyond ethics to reasons for belief (epistemic reasons) and practical reasons in general. Your "lots of people believe it" example is perfect:
      *   **Epistemic Particularism:** The feature "widespread belief" isn't inherently a reason *for* or *against* a proposition. Its valence depends entirely on context. If the belief is widespread *because* many independent, competent observers reached the same conclusion ("herd immunity" against individual error), it's a strong reason *for* belief. If it's widespread *because* of social pressure, echo chambers, or lack of access to evidence ("herd mentality"), the *very same widespreadness* becomes a reason *against* believing it (or at least, a reason to be highly skeptical). The context changes *what the widespreadness signifies*.

  **The Shape of the Thing & Edge Cases:**

  Think of features like "truth-telling" or "causing pain" not as red or blue blocks with fixed weights, but as **chameleons**. Their color (valence) changes based on the background (context). The context isn't just adding other blocks; it's changing the *meaning* of the block itself.

  *   **Edge Cases:** Situations where the valence is ambiguous or contested are where the relevant context is unclear, conflicting, or incomplete.
      *   **The Ambiguous Motive:** An employee reports a coworker's minor mistake. Is this courageous honesty (good) or petty score-settling (bad)? The valence hinges on subtle cues about relationships, past behavior, tone, and the specific mistake – factors that might be genuinely hard to read.
      *   **The Double-Edged Trait:** Your intense employee defending someone. Is the intensity righteous indignation (good) or uncontrolled aggression (bad)? The line might be razor-thin and depend on the perceived severity of the "picking on," the language used, and the immediate consequences.
      *   **Novel Situations:** Facing a completely unprecedented scenario where standard interpretations of features break down. (e.g., In highly complex AI ethics dilemmas, does "autonomy" function the same way it does in human interactions?).

  **Why This is Exhausting (and Important) for a Team Lead:**

  Particularism explains why leadership judgment is so hard. You *can't* rely on simple checklists or invariant rules like "Always reward honesty" or "Never tolerate outbursts." You have to constantly engage in **situational perception** – seeing the *whole* picture, understanding the web of relationships, motivations, potential consequences, and institutional norms *in this specific instance* to determine what the truth-telling *actually means here and now*. It requires empathy, experience, and careful attention to detail.

  **In a nutshell:** You're grappling with **Normative Particularism**. It claims that the reason-giving force (valence) of a specific feature is **context-dependent** and **holistic**, meaning it can fundamentally flip direction based on the total configuration of the situation, not just get outweighed by other factors. The opposite view (**Generalism/Invariantism**) holds that features have fixed valences. This applies to both ethical and epistemic reasoning. There's no simple algorithm; it demands nuanced, context-sensitive judgment – which is precisely the demanding art you're now practicing as a leader. The fact that you're noticing this complexity is a sign you're thinking deeply about the job. It *is* exhausting, but recognizing the "chameleon" nature of reasons is the first step towards navigating it more consciously.
