answer: |-
  ### Restating the Strategy-Stealing Argument in Your Vocabulary
  **Core Assumptions and Their Roles**  
  1. **Finite, deterministic, perfect-information game tree**:  
     - The game has a finite set of positions, deterministic transitions, and players have full knowledge.  
     - *Role*: Ensures Zermelo's theorem applies: every position has a game-theoretic value (win/loss for a player, or draw).  

  2. **No-draw condition**:  
     - Every terminal position is a win for exactly one player.  
     - *Role*: Forces the initial position to be either a win for the first player (P1) or the second player (P2). Eliminates draw outcomes, making the argument categorical.  

  3. **Monotonicity of position value w.r.t. extra moves**:  
     - Adding an extra piece for a player never harms their winning prospects. Formally: if a position \(P\) is winning for a player, then the position \(P'\) (derived by adding one of their pieces to \(P\)) remains winning for them.  
     - *Role*: Licenses P1 to "ignore" their extra piece when simulating P2's strategy. If the strategy suggests a move to an occupied square, P1 makes an arbitrary move instead, knowing monotonicity preserves their winning chances.  

  **Argument Restated**  
  - **Assumption for contradiction**: P2 has a winning strategy \(\sigma_2\) (a computable function mapping positions to moves).  
  - **P1's simulated strategy**:  
    1. P1 makes an arbitrary opening move \(m_0\), resulting in position \(P_1\) (with P1's extra piece).  
    2. For all subsequent moves, P1 treats \(P_1\) as a *hypothetical initial position* where P2 is now the first player. P1 "steals" \(\sigma_2\):  
       - In position \(Q\), if \(\sigma_2(Q)\) is legal, P1 plays it.  
       - If \(\sigma_2(Q)\) targets an occupied square, monotonicity guarantees P1 can play *any* legal move without sacrificing a winning position.  
  - **Contradiction**: This simulation forces a win for P1, contradicting \(\sigma_2\) being a winning strategy for P2.  
  - **Conclusion**: By determinacy (from Zermelo) and no-draws, P1 must have a winning strategy.  

  **Your Suspicion: Confirmed**  
  You are correct:  
  - This is a **simulation argument** where P1 simulates a game where they occupy P2's role.  
  - The extra move \(m_0\) acts as a **buffer**, initializing the simulation.  
  - **Monotonicity** is the crux: It asserts that \(P_1\) (with P1's extra piece) *dominates* the hypothetical initial position \(P_0\) (without it).  
  - **Determinacy** closes the proof: No draws \(\implies\) P1 wins.  

  ### Residue Report  
  **Clean Translations (No Distortion)**  
  1. **Game-theoretic values and determinacy**:  
     - Your framework handles "winning/losing positions" and Zermelo's theorem natively.  
     - "No draws" translates directly to terminal position values being binary (P1 or P2 wins).  

  2. **Strategies as functions/policies**:  
     - \(\sigma_2\) is a policy \(\text{Position} \to \text{Move}\). The simulation uses it as a black box.  

  3. **Non-constructive existence**:  
     - The gap between existence and computability is explicit in your vocabulary. You distinguish:  
       - *Existence*: A winning strategy \(\exists\) (proven via contradiction).  
       - *Computability*: No effective strategy is constructed.  

  **Translations with Distortion**  
  1. **Monotonicity as "extra moves never hurt"**:  
     - *Distortion*: In your framework, "monotonicity" is not inherent to adversarial search; it must be externally defined per game.  
     - *Why*: Minimax/alpha-beta assumes optimal play, but doesn't encode that adding a piece is always beneficial (e.g., in Hex, an extra stone helps; in Chess, a random pawn might not).  
     - *Workaround*: You must manually prove monotonicity for the specific game (e.g., show that a position \(P\) plus a stone \(\succeq P\) via a partial order).  

  2. **Arbitrary moves as a fallback**:  
     - *Distortion*: The argument assumes P1 can always make "safe" arbitrary moves when \(\sigma_2\) targets an occupied square.  
     - *Why*: Your framework requires explicit game rules to verify this. For Hex, all moves are safe; for Chomp, you must prove no move forces a loss (e.g., avoiding "poison" squares).  
     - *Workaround*: You import monotonicity to guarantee such moves exist.  

  **No Counterpart in Your Vocabulary**  
  1. **Global symmetry assumption**:  
     - The argument implicitly assumes the game is symmetric (e.g., Hex’s board symmetry).  
     - *Why missing*: Your vocabulary focuses on local position properties, not global symmetries.  
     - *Is it a defect?* No. Symmetry is a convenience, not a necessity. Monotonicity is the true core.  

  2. **Simulation as a meta-strategy**:  
     - The "pretend to be P2" step is a meta-argument about strategy composition.  
     - *Why missing*: Your strategies are programs, but composing them across "simulated games" isn't native.  
     - *Is it a defect?* No. The residue highlights the argument's non-constructive nature.  

  ### The Real Weight of the Argument  
  The argument's power lies in **monotonicity + determinacy**, not symmetry or simulation. Monotonicity reduces the burden to proving that an extra piece is never detrimental. The simulation is merely a narrative device for the contradiction. The residue arises because:  
  - **Monotonicity** is game-specific and often unstated in informal presentations.  
  - **Non-constructiveness** is inherent; the proof shows existence but gives no computational insight (e.g., no bound on strategy complexity).  

  **Defect or Symptom?**  
  The residue is a **symptom of unclarity in the source argument**. Strategy-stealing is often presented as "general" but relies on:  
  1. Hidden monotonicity assumptions (which *must* be proven per game).  
  2. Overstated symmetry (which is illustrative but not essential).  
  Your framework exposes this by forcing explicit definitions (e.g., monotonicity as a partial order over positions). This is a strength, not a weakness.  

  **Final Verdict**  
  Verdict: The residue stems from the strategy-stealing argument's failure to explicitly separate the game-agnostic (determinacy) from the game-specific (monotonicity), relying on informal symmetry intuitions instead of formal position dominance.
