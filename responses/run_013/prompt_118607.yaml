  ### Final Examination Question  
  **Module: Rational Choice and Practical Rationality**  
  **Time Allowed: 75 minutes**  
  **Word Limit: 900 words**  
  **Marks: 20**  

  **Question**  
  Priya rents one of three desks daily at a co-working space: Window (W), Standing (S), or Quiet (Q). Her preferences are cyclic: she prefers S to Q (due to back comfort), Q to W (to avoid screen glare), and W to S (as standing tires her legs). For any single swap between desks, she would pay up to $3. The space charges $2 per swap, and Priya must personally confirm each swap. The manager makes one offer per day (Monday–Wednesday): each offer is to swap from her current desk to the next in the cycle (W→S→Q→W). Declined offers are repeated the next day. Before Monday’s offer, Priya may buy a lock for $4 to block all swaps for the week. She knows all this in advance, has perfect self-knowledge, and lacks other commitment devices.  

  (a) Reconstruct the money pump scenario for Priya, using the numbers provided. State her exact sure loss in dollars.  
  (b) State and critically assess the assumptions needed for this reconstruction, covering: (i) how desks and money combine in her preferences; (ii) her willingness to accept strictly preferred swaps; and (iii) the availability of commitment. For each, indicate whether a critic could reasonably reject it.  
  (c) Analyze four possible paths for Priya’s week:  
      (i) Accept every swap offer.  
      (ii) Decline every offer from the start.  
      (iii) Buy the lock on Monday (before any offer).  
      (iv) Accept Monday’s swap but decline all later offers.  
      For each, state her net monetary loss and final desk. Which path leaves her best off? Is path (iv) open to her, given that she would decline a preferred swap at each later moment?  
  (d) What does this case establish about Priya: that she is *exploitable*, that she is *sure to suffer a loss*, or that she is *irrational*? Defend your choice by distinguishing these three notions.  
  (e) Is the money pump argument synchronic or diachronic? Can it support transitivity as a requirement on preferences at a single time, or does it presuppose norms governing sequences of choices? What should a proponent of entirely synchronic rationality conclude about Priya? As a diagnostic, explain why this setup poses no problem for an agent with transitive preferences.  

  ---  
  ### Model Answer (≈700 words)  

  **(a) Reconstruction and Sure Loss**  
  Priya starts at W on Monday. The manager offers W→S for $2. Since she would pay up to $3 for this swap (indicating she prefers S to W at the moment of choice), she accepts, pays $2, and moves to S. On Tuesday, at S, she is offered S→Q for $2. Preferring Q to S (as she would pay up to $3), she accepts, pays $2, and moves to Q. On Wednesday, at Q, she is offered Q→W for $2. Preferring W to Q, she accepts, pays $2, and returns to W. She ends where she started but has paid $6. Compared to staying at W all week at no cost, her sure loss is $6.  

  **(b) Assumptions and Criticisms**  
  (i) *Desk-money combination*: We assume utility is additive and linear: U(desk, money) = U(desk) + k·(wealth − payments), where k is a constant. This allows monetary costs to directly trade off against desk preferences. A critic could reject this, as real-world utility may not be linear in money, or desk preferences might contextually interact with wealth.  
  (ii) *Willingness to accept swaps*: We assume Priya myopically accepts any swap if the cost ($2) is below her maximum willingness to pay ($3) for that swap, treating each choice in isolation. A critic could reject this, arguing that rational agents use foresight to avoid future exploitation.  
  (iii) *Commitment availability*: We assume the lock is the only binding commitment device and must be purchased upfront. This is stipulated, so critics cannot reasonably reject it, but they might question why Priya cannot use non-monetary commitment (e.g., resolve).  

  **(c) Path Analysis**  
  - (i) *Accept all swaps*: Pays $6 (Monday: W→S, -$2, to S; Tuesday: S→Q, -$2, to Q; Wednesday: Q→W, -$2, to W). Net loss: $6. Final desk: W.  
  - (ii) *Decline all*: Pays $0. Stays at W all week. Net loss: $0. Final desk: W.  
  - (iii) *Buy lock*: Pays $4 on Monday. Stays at W, no swaps. Net loss: $4. Final desk: W.  
  - (iv) *Accept Monday only*: Pays $2 (Monday: W→S, to S). Declines S→Q on Tuesday and Wednesday. Net loss: $2. Final desk: S.  

  **Best path**: (ii) (decline all) leaves her best off ($0 loss, at preferred W over S).  
  **Is (iv) open?** Yes. On Tuesday, Priya is at S and is offered S→Q. Since she prefers S to Q (from her cyclic preferences), declining is consistent with her preferences at that time. The offer is *not* preferred, so no conflict arises.  

  **(d) What the Case Establishes**  
  The case establishes that Priya is *exploitable*—not that she suffers a sure loss or is irrational.  
  - *Exploitable*: A setup exists (the pump) that *can* extract money from her *if* she chooses myopically.  
  - *Sure loss*: Avoidable (e.g., path (ii) or (iv) prevents loss).  
  - *Irrational*: Unproven, as cyclic preferences become problematic only under myopic choice; foresight or commitment can mitigate harm.  
  Distinction: Exploitability is about *vulnerability to external schemes*; sure loss is *inevitability*; irrationality implies *internal inconsistency*. Priya’s flaw is not her preferences per se but her susceptibility to exploitation under specific choice dynamics.  

  **(e) Synchronic vs. Diachronic Rationality**  
  The argument is *diachronic*. It shows that a sequence of locally rational choices (each swap is preferred when offered) leads to a globally worse outcome, presupposing a norm of *coherence across time*. It cannot support transitivity as a synchronic requirement (e.g., for a single preference ranking) because the problem arises only through iterated choices.  
  A synchronic rationalist would deem Priya rational: each choice (e.g., accepting W→S) maximizes utility *at that moment* given her preferences. The $6 loss is attributed to the setup, not her rationality.  
  **Diagnostic for transitive preferences**: Suppose an agent prefers W ≻ Q ≻ S. Starting at W:  
  - Monday: Offer W→S is declined (W ≻ S).  
  - Tuesday: Repeated offer W→S is declined.  
  - Wednesday: Same.  
  No swaps occur, no money lost. Transitivity prevents cycling, so the pump fails.  

  **Conclusion**: Priya’s case highlights how cyclic preferences enable exploitation under myopic choice. The verdict rests on the assumption of myopia; if Priya uses foresight (e.g., path (ii)), she avoids loss. Rejecting myopia undermines the pump.  

