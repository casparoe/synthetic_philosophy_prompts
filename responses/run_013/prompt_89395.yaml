  We are designing a triage procedure to classify accounts into four buckets:
   Bucket 1: True akrasia (weakness of will) - client judges that saving is best at the moment of action but still withdraws.
   Bucket 2: Preference reversal - at the time of withdrawal, the client's preference has changed (they now value the immediate spending more than saving).
   Bucket 3: Lack of endorsement - the goal was set by someone else and the client never internalized it.
   Bucket 4: Capacity issue - the client cannot save due to external circumstances (e.g., income shortfall).

   Additionally, we have an "endorsement gap" metric: what they said they wanted at sign-up minus what they defend when called after a lapse.

   We also note a pattern: pre-commitment on payday reduces lapses, but two weeks before does not.

   The procedure must:
   - Be runnable by support coaches in about 15 minutes per account, on paper.
   - Have clear questions and sufficient answers.
   - Indicate where to stop (e.g., decline account, not fixable by commitment device).
   - Hand off to a human for values or clinical issues.
   - Differentiate the four buckets with more than vibes.
   - Be explicit about which steps are judgment calls and where bias toward selling might occur.

   Steps:

   1. Initial Check: Capacity
      Question: "In the month(s) when the lapse occurred, was the client able to afford the savings amount without hardship? (Consider: did they have enough income after essential expenses?)"
      Sources: Account data (income, expenses, transfer history), client statements.
      - If NO (could not afford) -> Bucket 4 (Capacity issue). Stop and recommend: adjust savings amount or schedule, or decline if persistently unaffordable.
      - If YES -> Proceed.

   2. Endorsement Check (Internalization of Goal)
      Question: "Does the client currently endorse the savings goal as their own (not just set by someone else)?"
      Sources: Client statements in calls, notes from sign-up, endorsement gap metric (if available).
      - If NO (goal is not endorsed) -> Bucket 3 (Lack of endorsement). Stop and recommend: hand off to human for values discussion (e.g., is this goal right for them?) or if the goal is externally imposed and they don't want it, consider closing the account.
      - If YES -> Proceed.

   3. Timing of Preference Reversal Check
      Question: "At the time of the lapse, did the client still believe that saving was the best course of action (even if they didn't follow through)?"
      Sources: Client's own description of the lapse (e.g., "I knew I shouldn't but I did it anyway"), behavior (e.g., expressing guilt during the act).
      - If YES (they believed saving was best at the moment of lapse) -> Bucket 1 (True akrasia). Recommended fix: commitment devices that increase friction (penalties, lock-ups) and pre-commitment at the moment of funding (e.g., on payday).
      - If NO (at the time of lapse, they thought the spending was more important) -> Bucket 2 (Preference reversal). Recommended fix: re-align the product with the client's true preferences (e.g., adjust the goal, change the timeline) or use pre-commitment strategies that are time-locked to the funding event (like on payday).

   4. Additional Note on the Payday Effect:
      We note that pre-commitment on payday works but two weeks before does not. This suggests that for Bucket 1 (akrasia) and Bucket 2 (preference reversal) the salience and immediacy of the funding event matter. Therefore, the procedure should note:
        - For Bucket 1: Strongly recommend setting up automatic transfers on payday (if not already) and using pre-commitment devices that are triggered at that moment.
        - For Bucket 2: Consider whether the goal is still aligned with the client's current preferences. If it is, then also use payday-based pre-commitment. If not, adjust the goal.

   Hand-off to Human:
      - When there is evidence of coercion (e.g., Bucket 3) or when the coach detects a deeper issue (e.g., addiction, severe financial distress, family conflict) that requires counseling or clinical intervention.

   Judgment Calls and Biases:
      - Step 2 (Endorsement Check) is a judgment call. Coaches might interpret client statements optimistically (e.g., "He signed up so he must want it") to keep the account. They might overlook subtle cues of lack of endorsement.
      - Step 3 (Timing of Preference) is also a judgment call. Clients may not articulate their state of mind clearly. Coaches might default to Bucket 1 (akrasia) because it's the classic case and the product is designed for it, even when Bucket 2 is more accurate.

   What the Procedure Can't Do:
      - It cannot perfectly discern the client's internal state. Some clients might not be fully aware of their own preferences or might misreport.
      - It might misclassify cases of temporary preference shifts as akrasia or vice versa.
      - It cannot account for complex psychological factors (e.g., addiction, depression) without a professional.
      - The endorsement gap metric is a proxy and might not capture the full story.

   Now, run the procedure on the three accounts:

   Account 1: 
     Woman saving for a house, transfers out before trips, calls it "stupid" while doing it.

     Step 1: Capacity Check
        - She transfers out almost every month before a trip. The trips are already paid for? Then why transfer? Maybe she wants spending money? But note: she has the money to save and then withdraws. So she had the capacity at the start of the month? But we need to check if the savings amount is affordable. Since she transfers out and the trips are paid for, it seems she has the money. Let's assume capacity is YES.

     Step 2: Endorsement Check
        - She is saving for a house and says she "shouldn't" withdraw. This indicates she endorses the goal. YES.

     Step 3: Timing of Preference
        - At the time of withdrawal, she says she knows she shouldn't and calls it stupid. This indicates that at the moment of action, she still believes saving is best. So she is acting against her judgment. -> Bucket 1 (True akrasia).

     Recommendation: Increase commitment devices (penalties, lock-ups) but also crucially set up the transfer to happen on payday and use pre-commitment at that moment (e.g., immediately after pay, lock the money away). Also, consider making the penalty more salient at the moment of withdrawal.

   Account 2:
     Man referred by his wife for gambling-blocking. He says he doesn't have a problem and is only doing it to get her off his back. He keeps the block in place.

     Step 1: Capacity Check
        - We don't have information about income, but the issue is not about capacity to save but about blocking gambling. The product is a gambling-blocking version. We are not told he misses payments. Let's assume he has the capacity (he keeps the block in place, so he is not withdrawing). But note: the problem is about the goal, not a lapse in saving? The flag is about "needs stronger commitment device", but in this case, the block is in place. So why flagged? Maybe because he expresses lack of endorsement? Let's assume the flag is because the support rep thinks he might remove the block.

     However, note: the problem says he keeps the block in place. So there's no lapse? Then why is it flagged? Maybe because the rep fears he might lapse? We'll proceed.

     Step 2: Endorsement Check
        - He explicitly says he doesn't have a problem and is only doing it for his wife. This is a clear lack of endorsement. -> Bucket 3 (Lack of endorsement).

     Recommendation: Hand off to a human for a values discussion. The coach should not try to strengthen the commitment device because the client doesn't want it. There might be marital issues or a potential gambling problem that requires professional help. The human should discuss whether the client wants to continue and if not, consider closing the account.

   Account 3:
     Gig worker with variable income, misses months because some months there isn't any money.

     Step 1: Capacity Check
        - The client misses months because there isn't any money. Clearly, sometimes he cannot afford the savings amount. -> Bucket 4 (Capacity issue).

     Recommendation: Adjust the product to allow variable savings (e.g., save a percentage of income, or set a minimum threshold that is very low). If the product cannot accommodate variable savings, then it might not be suitable and the account should be adjusted or closed.

   Now, let's write the procedure in a step-by-step form for the team.

   Triage Procedure Form:

