answer: |-
  ### Triage Procedure for Commitment Savings Accounts  
  **Objective**: Classify flagged accounts into 4 buckets and prescribe tailored fixes. Coaches have 15 mins/account using this paper form.  

  ---

  #### **Step 1: Capacity Check (2 mins)**  
  **Question**: *"In the lapse month, was the client financially able to save the pledged amount without hardship?"*  
  - **Sources**: Income history (pay stubs/bank data), client’s stated reason for lapse, expense shocks (e.g., medical bills).  
  - **Sufficient Answer**:  
    - **YES** → Proceed to Step 2.  
    - **NO** → **Bucket 4 (Can’t Save)**. Stop. Recommend: Adjust savings amount, pause plan, or close account.  
  - **Judgment Call Risk**: Coaches may ignore structural poverty to retain clients. *Watch for*: Gig workers, irregular income.  

  #### **Step 2: Endorsement Check (3 mins)**  
  **Question**: *"Does the client personally own this goal? (Not driven by spouse/doctor/social pressure)"*  
  - **Sources**: Call transcripts, client’s language (e.g., "I want" vs. "my wife wants"), endorsement gap metric (gap > 20% = red flag).  
  - **Sufficient Answer**:  
    - **YES** → Proceed to Step 3.  
    - **NO** → **Bucket 3 (No Endorsement)**. Stop. Hand off to human for values discussion. Do *not* apply commitment devices.  
  - **Judgment Call Risk**: Coaches may confuse compliance ("I’ll do it to shut them up") with true buy-in.  

  #### **Step 3: Preference Stability Test (5 mins)**  
  **Question**: *"During the lapse, did the client believe saving was STILL the right choice, but couldn’t follow through?"*  
  - **Sources**: Client’s verbatim description of lapse (e.g., "I knew it was stupid while doing it"), emotional tone (guilt/shame).  
  - **Sufficient Answer**:  
    - **YES** → **Bucket 1 (True Akrasia)**.  
    - **NO** (e.g., "I changed my mind—the trip was worth it!") → **Bucket 2 (Preference Reversal)**.  
  - **Judgment Call Risk**: Coaches may assume all lapses are akrasia (defaulting to penalties).  

  #### **Step 4: Prescribe Fixes (5 mins)**  
  - **Bucket 1 (True Akrasia)**:  
    - **Fixes**: Pre-commitment **on payday**, penalty hikes, friction (e.g., 24hr withdrawal delay).  
    - **Rationale**: Combat immediate temptation when judgment is intact.  
  - **Bucket 2 (Preference Reversal)**:  
    - **Fixes**: Goal realignment (e.g., lower amount/shorter term), **salience nudges** (e.g., photo of goal on payment screen), no penalties.  
    - **Rationale**: Preferences aren’t "wrong"—design must sync with true priorities.  
  - **Bucket 3 (No Endorsement)**: Human handoff only.  
  - **Bucket 4 (Can’t Save)**: Structural solutions (e.g., dynamic savings rules).  

  #### **Handoff Rules**  
  - Hand to human if:  
    - Values conflict (Step 2: No Endorsement).  
    - Signs of addiction/coercion (e.g., gambling, spousal pressure).  
    - Mental health flags (e.g., hopelessness, self-harm).  
  - **Do NOT sell**: Buckets 3 or 4.  

  #### **Why Payday Timing Matters**  
  - **Payday commitment works** because it exploits **hot-cold empathy gap**: Clients commit in a "cold" state (rational) before "hot" temptations arise.  
  - **2-week pre-commitment fails** due to **hyperbolic discounting**: Future consequences feel abstract until immediate.  

  ---

  ### Procedure in Action: 3 Account Traces  

  #### **Account 1: House Saver with "Stupid" Transfers**  
  - **Step 1 (Capacity)**:  
    - She consistently has funds pre-trip → **YES**.  
  - **Step 2 (Endorsement)**:  
    - Unprompted guilt ("I know I shouldn’t") → True ownership → **YES**.  
  - **Step 3 (Preference Stability)**:  
    - *"I knew it was stupid while doing it"* → Regret *during* action → **YES (Akrasia)**.  
  - **Verdict**: **Bucket 1 (True Akrasia)**.  
  - **Fixes**: Move transfer to **payday**; add penalty + 24hr delay; text reminder with house photo *during transfer*.  

  #### **Account 2: Gambling Blocker for Reluctant Husband**  
  - **Step 1 (Capacity)**:  
    - No income issue → **YES**.  
  - **Step 2 (Endorsement)**:  
    - *"Only doing it to get her off my back"* + endorsement gap (sign-up goal: $500/mo; defends: $0) → **NO**.  
  - **Verdict**: **Bucket 3 (No Endorsement)**. Stop.  
  - **Action**: **Hand off to human**. Coach *must not* upsell. Discuss: Is this goal right for him? Gambling addiction screening.  

  #### **Account 3: Gig Worker with Variable Income**  
  - **Step 1 (Capacity)**:  
    - *"Some months there isn’t any [money]"* → **NO**.  
  - **Verdict**: **Bucket 4 (Can’t Save)**. Stop.  
  - **Fixes**: **Decline rigid plan**. Offer: Save X% of income >$Y/month. No penalties.  

  ---

  ### What the Procedure Can’t Do  
  1. **Misclassified Cases**:  
     - **Masked Akrasia**: Clients who *claim* preference reversal to avoid shame.  
     - **Coerced Endorsement**: Clients who *say* they own a goal to please others (e.g., "I want to quit gambling" under duress).  
  2. **Lost Nuance**:  
     - Philosophy’s **judgment vs. desire distinction** (e.g., "I believe I should save, but *want* the trip more") collapses into Bucket 2.  
     - **Temporal dynamics** (e.g., how discounting interacts with income cycles) reduced to heuristics.  
  3. **Human Bias Hotspots**:  
     - Step 2 (Endorsement): Coaches may ignore red flags to meet sales targets.  
     - Step 3 (Preference): "Guilt" is overinterpreted as akrasia, favoring punitive fixes.  

  ### Unvarnished Truth  
  **Account 2 is your problem**: Pushing commitment devices on unendorsed goals is unethical and ineffective. The procedure forces you to decline these accounts or hand them off—no sugarcoating.
