     Sources: Client's statements in the current call and previous calls, notes from sign-up (if available). Also, consider the endorsement gap: if the client at sign-up set a high goal but now defends a much lower one, that might indicate lack of endorsement.
     [ ] Yes (Proceed to Step 3)
     [ ] No (Bucket 3: Lack of endorsement)
        Action: Hand off to a human for a deeper conversation. The coach should not proceed with commitment devices. The human will discuss if the goal is right for the client. If the client does not endorse the goal, consider closing the account.

   Step 3: Timing of Preference Check
     Question 3: At the time of the lapse, did the client believe that saving was the best action (even though they lapsed)? 
     Sources: Client's description of the lapse event. Look for: expressions of guilt at the time, statements like "I knew I shouldn't", or self-criticism during the act.
     [ ] Yes (Bucket 1: True akrasia)
        Action: Strengthen commitment devices, especially by tying them to the funding event (e.g., on payday). Consider increasing penalties, lock-ups, and using pre-commitment at the moment of funding. Also, increase salience of the penalty at the moment of withdrawal.
     [ ] No (Bucket 2: Preference reversal)
        Action: Re-evaluate the goal alignment. Discuss with the client if the goal is still important and adjust (amount, timeline) if needed. Also, use pre-commitment at the moment of funding (payday) to capture the client's long-term preference.

   Additional Notes for Coaches:
     - The endorsement gap metric (if available) can be used in Step 2. A large gap (e.g., sign-up goal much higher than what they now defend) suggests lack of endorsement.
     - For Bucket 1 (akrasia), the payday effect is critical: set up funding and commitment on the same day as payday.
     - For Bucket 2 (preference reversal), the goal might need to be changed to something the client consistently values.

   Hand-off to Human:
     - In Step 2 (Bucket 3) we always hand off.
     - Also hand off if the coach detects:
          - Possible addiction (gambling, shopping, etc.)
          - Severe financial distress (beyond temporary)
          - Family or relationship coercion
          - Mental health concerns

   Limitations:
     - The procedure relies on client self-report which may be inaccurate.
     - Coaches might be biased to see endorsement (Step 2) and akrasia (Step 3) to keep using the product.
     - It may not capture complex or mixed cases.

