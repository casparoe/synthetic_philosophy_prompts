prompt: |-
  Hey — I'm trying to turn a seminar paper into something submittable and I've got a rough draft of the arguement. Could you put on your game-theorist hat (someone who's comfortable on both the formal side and the philosophy-of-economics side) and give me real comments? Not "interesting, have you considered expanding it" — I mean: tell me where the math is wrong, where the philosophy is thin, and what the strongest objection is. Maybe start by brainstorming the ways this kind of argument usually goes off the rails before you dig into my draft, then go through it properly.

  Here's the draft.

  **Draft: "Dominance without tears"**

  The claim I want to defend is that "solvable by iterated dominance" is not a property of a game. It's a property of a game *plus* a decision about which strategies are allowed to do the dominating, and that decision is not innocent — it decides whether the notion is even about rationality.

  Setup. One player picks among three options T, M, B; the opponent will play either L or R. Just the chooser's payoffs:

          L     R
  T       1     0
  M       0     1
  B      0.4   0.4

  (I've left the opponent's payoffs out — more on that below.)

  B is strictly dominated: play T half the time and M half the time and you get 0.5 in each column, strictly better than 0.4. But B is not dominated by T (T gets 0 against R, which is less than 0.4) and not by M (mirror image). So if "dominated" means "dominated by some other single pure option," B is clean; if it means "dominated by some mixture," B is out. The two readings give different answers, and that's before we've even started iterating.

  Now the part I actually care about. Why are we allowed to throw out dominated options at all? The usual story is the sure-thing principle: if one option is at least as good as another no matter what the world does, a rational chooser won't take the worse one. That's a state-by-state argument and it needs no probabilities — that's the whole appeal, it's supposed to be the bit of decision theory you get for free. But look at B. Is there any single pure option that beats B in both states? No: T beats B against L and loses to it against R, M is the mirror. The only thing that beats B everywhere is the mixture — and the mixture beats B everywhere only because we've already decided that the value of the mixture in a state is the average of the values of the pure options it mixes. That averaging step is not the sure-thing principle. It's an assumption about how lotteries are valued. I think it's a small assumption (just: the value of a lottery is the probability-weighted average of the values of its outcomes) but it is an assumption, and it's exactly the kind of thing a theory of expected utility is supposed to *deliver*, not presuppose.

  So the thesis: the reading of "don't play dominated strategies" that actually bites — the one that gets you to the rationalizable set instead of something weaker — already contains a chunk of expected-utility theory. If that's right, then the standard textbook move of selling dominance reasoning as a pre-theoretic rationality constraint, the thing you assume *before* you build a theory of risky choice, is backwards. You can't use dominance solvability to motivate expected utility without going in a circle.

  Three smaller things I'd like your opinion on.

  (a) With mixtures allowed, I think iterated elimination lands exactly on the rationalizable set, so "dominance solvable" collapses into "has a unique rationalizable outcome" and the dominance machinery is doing no independent work. Is that a fair way to put it, or is the belief-free characterisation of rationalizability itself the point?

  (b) I have a vague memory that once mixtures are allowed to do the eliminating the *order* of elimination starts to matter, whereas with pure dominators it's provably order-independent. Please check that, because that paragraph is load-bearing for me.

  (c) I've dropped the opponent's payoffs. My reasoning is that whether a pure option is dominated is a fact about the chooser's own payoffs alone, so it can't matter. Tell me if that's wrong once we iterate — I have a nagging feeling the missing payoffs do something.

  And the big one, honestly: is this interesting, or is it a terminological complaint dressed up as a result? If it's the latter, what's the nearest thing that *is* interesting? Also tell me which paragraph is doing the real work and which is filler I should cut. Thanks.
reasoning: |-
  We are given a draft titled "Dominance without tears" that makes a philosophical and technical argument about iterated dominance in game theory. The author is concerned that the standard presentation of dominance reasoning as a pre-theoretic rationality constraint actually presupposes expected utility theory. We are asked to provide critical feedback, focusing on mathematical errors, philosophical thinness, and the strongest objections. We are also asked to address three specific points (a, b, c) and to assess the overall interest of the argument.

  ## Step 1: Brainstorming Common Pitfalls

  Before diving into the draft, let's recall common ways arguments about dominance and rationalizability can go astray:

  1. **Confusion between pure and mixed strategies in dominance definitions**: The distinction between strict dominance by a pure strategy versus by a mixed strategy is fundamental. The author correctly notes that these can lead to different outcomes.

  2. **The role of mixed strategies in rationalizability**: Rationalizability (due to Bernheim and Pearce) is defined by the elimination of strategies that are never best responses to any beliefs. This is equivalent to iterated elimination of strictly dominated strategies when mixed strategies are allowed to do the dominating. However, without mixed strategies, the process may leave behind strategies that are not rationalizable.

  3. **Order of elimination**: When eliminating strategies that are strictly dominated (by pure or mixed strategies), the set of strategies that survive iterated elimination is order-independent. However, if we consider weak dominance, then order can matter. The author mentions strict dominance, so we must check the order-independence claim for strict dominance with mixed strategies.

  4. **The sure-thing principle and its assumptions**: The sure-thing principle (from Savage) is often invoked for dominance reasoning. However, the principle is typically stated for acts that are statewise comparable. The author argues that when mixed strategies are used for dominance, we are introducing an averaging that goes beyond the sure-thing principle.

  5. **Circularity in motivating expected utility**: The standard narrative is that dominance reasoning (as a minimal rationality condition) can be used to motivate expected utility theory. The author contends that if dominance reasoning with mixed strategies is required, then we are already assuming expected utility.

  ## Step 2: Reviewing the Draft

  ### The Core Argument

  The draft presents a game with one player choosing from {T, M, B} and an opponent choosing from {L, R}. The payoffs for the chooser are:

  ```
          L     R
  T       1     0
  M       0     1
  B      0.4   0.4
  ```

  The author notes:
  - If we define "dominated" as dominated by a single pure strategy, then B is not dominated (since neither T nor M dominates B in both states).
  - If we allow domination by a mixed strategy (specifically, the 50-50 mixture of T and M), then B is strictly dominated because 0.5 > 0.4 in both states.

  The key point is that the argument for eliminating B when mixed strategies are allowed relies on valuing the lottery (the mixture) by its expected payoff. The author argues that this step is not part of the sure-thing principle (which is statewise) but requires an assumption about averaging over lotteries.

  ### Thesis

  The thesis is that the version of "don't play dominated strategies" that leads to the rationalizable set (which requires allowing mixed strategies to dominate) already incorporates expected utility theory. Therefore, using dominance solvability to motivate expected utility is circular.

  ### Addressing the Three Points

  #### (a) Relation to Rationalizability

  The author claims that with mixtures allowed, iterated strict dominance lands exactly on the rationalizable set. This is correct. In fact, for two-player games, the set of strategies that survive iterated elimination of strictly dominated strategies (with mixed strategies allowed) is exactly the rationalizable set. So, the dominance machinery is not doing independent work beyond what rationalizability does. However, the belief-free characterization (i.e., without explicitly modeling beliefs) might be seen as an advantage of the dominance approach. But the author is right that the two concepts coincide.

  #### (b) Order of Elimination

  The author has a vague memory that the order of elimination matters when mixtures are allowed. This is **not** the case for strict dominance. The fundamental theorem of iterated strict dominance (with mixed strategies) states that the set of strategies that survive is independent of the order of elimination. However, note:

  - The process must eliminate all strictly dominated strategies at each step (and a strategy is dominated if there exists a mixed strategy that dominates it).
  - The set of strategies that survive iterated elimination of strictly dominated strategies is unique and order-independent.

  But caution: this holds for strict dominance. For weak dominance, order can matter.

  Therefore, the author's paragraph about order-dependence would be incorrect for strict dominance. However, if the author is thinking of weak dominance, then order can matter. Since the example uses strict dominance (0.5 > 0.4, so strict), we must correct this.

  #### (c) Missing Opponent Payoffs

  The author has left out the opponent's payoffs. The argument is that since the dominance of a pure strategy for the chooser depends only on the chooser's payoffs, the opponent's payoffs should not matter. This is true for the first step of dominance: whether a strategy of the chooser is dominated (by a pure or mixed strategy) depends only on the chooser's own payoff matrix. However, when we iterate, we eliminate strategies for both players. The author has only one active player (the chooser) and the opponent is passive (with strategies L and R). But in a full game, the opponent's payoffs would matter because we must also consider which strategies of the opponent are dominated. In this draft, the game is presented as a decision problem (the opponent's moves are states of nature) rather than a strategic game. The author is aware of this and says "I've left the opponent's payoffs out". 

  But note: if the opponent is a real player, then we need to consider the opponent's payoffs to know what they would do. However, for the purpose of the chooser's dominance, the opponent's payoffs are irrelevant because dominance for the chooser is defined by the chooser's payoffs. However, when we iterate, we must also eliminate the opponent's dominated strategies. Without the opponent's payoffs, we cannot do that. So the example is incomplete for iterated dominance in a two-player game. The author might be treating the opponent as nature (i.e., a decision problem) and then the states are fixed. But in that case, iterated dominance doesn't apply because there is only one player. The author must clarify the setting.

  In the current setup, it seems the author is considering a decision problem (with states L and R). Then, iterated dominance is not typically discussed because there is no interaction. The focus is on the first step: whether B is dominated. The author's point is about the definition of dominance in a decision problem. That is valid. However, the thesis is about game theory, so the setting should be a game. The author should either provide the opponent's payoffs or clarify that the opponent is nature (and then the argument is about decision theory).

  ### Philosophical Critique

  The author's main point is that the sure-thing principle (which is statewise) does not justify eliminating a strategy that is dominated only by a mixed strategy. The sure-thing principle says: if one act is statewise at least as good as another and strictly better in some state, then it is preferred. But the mixed strategy is not an act in the same sense: it is a lottery over acts. So to compare the mixed strategy to B, we must assign a value to the mixed strategy in each state. The author claims that this requires assuming that the value of the lottery is the expected value (which in a state is just the average because the state is fixed). 

  This is a valid point. The sure-thing principle is about comparing acts that yield definite outcomes in states. The mixed strategy, however, yields a lottery over outcomes in a state. To say that the mixed strategy is better than B in a state, we must compare the lottery (e.g., 50% chance of 1 and 50% chance of 0 when the state is L) to the sure outcome 0.4. This requires a theory of how to value lotteries. The sure-thing principle does not tell us how to value a lottery in a state. Therefore, the step of saying that the mixture gives 0.5 in state L (and similarly in R) and hence is better than 0.4 is not an application of the sure-thing principle. It is an application of expected utility (with a linear utility function).

  Thus, the author's core argument is sound: the mixed dominance step requires an expected utility assumption.

  ### Strongest Objection

  The strongest objection to the author's thesis might be the following:

  - **The sure-thing principle can be extended to lotteries?** One might argue that the sure-thing principle applies to any acts, including probabilistic acts, if we consider the states as the primitive. In the state L, the mixed strategy yields a lottery, but we can break down the lottery into more primitive states? However, this is not straightforward. Savage's sure-thing principle is for acts that map states to outcomes. If we want to consider acts that map states to lotteries, then we need a theory for comparing such acts. This is exactly what expected utility theory provides.

  - **What if we assume that the decision maker is indifferent between mixtures that have the same distribution over outcomes?** Even without full expected utility, if we assume that the decision maker only cares about the distribution of outcomes (and hence in each state, the value of a lottery is its expectation), then we can justify the dominance by mixed strategies. However, this assumption is still a substantive one and not implied by the sure-thing principle.

  - **The circularity charge**: The standard narrative uses dominance (with pure strategies) to motivate expected utility. Then, once expected utility is established, we can use mixed strategies. The author is pointing out that the rationalizable set (which is the target) requires mixed dominance, which in turn requires expected utility. So the initial motivation by pure dominance might lead to a larger set than the rationalizable set, and then we need expected utility to narrow it down. But that is not circular: we use pure dominance (without EU) to get a set of strategies, then we build EU, and then we use mixed dominance to get the rationalizable set. However, the author's point is that the standard presentation often uses mixed dominance as part of the initial rationality argument without EU. The author is correct that this is problematic.

  ### Is it Interesting?

  The argument is interesting and not merely terminological. It highlights a conceptual gap in the standard justification of game-theoretic solution concepts. The fact that mixed strategy dominance requires an expected utility assumption is often glossed over. The author's example is simple and effective.

  However, the argument is not entirely new. Similar points have been made in the literature. For instance, the connection between iterated dominance (with mixed strategies) and rationalizability is standard. Also, the assumption of expected utility for valuing mixed strategies is well-known. But the author's focus on the sure-thing principle and the circularity in motivating EU is a fresh perspective.

  ## Recommendations for the Draft

  1. **Clarify the setting**: The example is presented as a game but without opponent payoffs. This is confusing. The author should either:
     - Provide arbitrary opponent payoffs (as long as they don't make the opponent have dominant strategies that would affect the game) and note that they are irrelevant for the first step of the chooser's dominance, or
     - Reframe the example as a decision problem under uncertainty (states L and R with fixed probabilities? but the author is avoiding probabilities) and then the argument is about decision theory.

     Since the thesis is about game theory, I recommend providing opponent payoffs. For example, let the opponent be indifferent between L and R in all circumstances. Then the opponent has no dominant strategies and we can focus on the chooser. For instance:

     ```
     Chooser's payoffs (as given) and Opponent's payoffs:

          L     R
  T       0     0
  M       0     0
  B       0     0
     ```

     Then the opponent is indifferent and will play any strategy. Then the chooser's dominance is as described.

  2. **Correct the order of elimination point**: Since the author is using strict dominance, the order is independent even when mixtures are allowed. The author should remove the claim about order-dependence or clarify that it only holds for weak dominance.

  3. **Strengthen the connection to rationalizability**: The author's point (a) is correct: iterated strict dominance with mixed strategies yields the rationalizable set. The dominance machinery is not independent. However, the dominance approach is often presented as an algorithm for computing rationalizability without explicit beliefs.

  4. **Emphasize the core insight**: The key paragraph is the one explaining that the mixed strategy's value in a state is computed by averaging, which is not the sure-thing principle. This is the heart of the argument.

  5. **Address the circularity**: The author should clarify the standard narrative and how it is circular. The standard narrative: 
     - Step 1: Rational players never play dominated strategies (defined without mixtures? or with?).
     - Step 2: This leads to iterated dominance and then we see that sometimes we need expected utility to explain choices under risk.
     - Step 3: Then we introduce expected utility and mixed strategies.

     But if the initial dominance (Step 1) is meant to be with mixed strategies, then Step 1 already uses expected utility. So Step 1 cannot be used to motivate Step 3.

  6. **Cut filler**: The draft is concise and to the point. There isn't much filler. The example is well-chosen.

  ## Final Thoughts

  The draft is promising. The argument is sound and interesting. The main improvements needed are:
  - Correct the point about order of elimination (for strict dominance, order doesn't matter).
  - Clarify the setting (game vs. decision problem).
  - Provide opponent payoffs if it's a game.
  - Emphasize that the averaging step in valuing a mixed strategy in a state is an expected utility assumption.

  The strongest objection is that one might try to extend the sure-thing principle to lotteries by some other means, but that would require additional assumptions. The author's point stands: the standard justification for eliminating mixed-dominated strategies goes beyond the sure-thing principle.
answer: |-
  ### Critical Feedback on "Dominance without tears"

  Your core argument is philosophically significant and mathematically sound, but it needs tightening. Below, I address your draft section-by-section, then tackle your specific questions (a-c), and finally assess the overall contribution. I’ll start by flagging common pitfalls for context.

  #### **Common Ways This Argument Goes Off the Rails**
  1. **Misdefining dominance**: Confusing strict vs. weak dominance, or pure vs. mixed dominators.  
  2. **Ignoring belief structures**: Rationalizability relies on beliefs, while dominance is belief-free. Conflating these undermines the critique.  
  3. **Overlooking order dependence**: Claiming order matters for mixed dominance when it doesn’t (for strict dominance).  
  4. **Misapplying the sure-thing principle**: Assuming it handles lotteries when it only compares deterministic outcomes state-wise.  
  5. **Hand-waving EU assumptions**: Not rigorously showing why averaging is an EU commitment.  

  Your draft avoids most pitfalls but stumbles on (3) and needs sharper framing on (4)–(5).

  ---

  ### **Section-by-Section Critique**

  #### **1. The Setup and Dominance Definitions**
  - **Math**: Correct.  
    - B is *not* strictly dominated by any pure strategy (since T loses to B if R, M loses if L).  
    - B *is* strictly dominated by the mixed strategy σ = (0.5T, 0.5M), yielding 0.5 > 0.4 in every state.  
  - **Philosophy**: Solid. You correctly show that "dominated" is ambiguous without specifying dominator types (pure/mixed). This isn’t pedantry; it’s foundational.

  #### **2. The Sure-Thing Principle (STP) Critique**
  - **Key Insight**: Your core claim is valid:  
    - STP is state-wise ("if A ≥ B in all states, choose A").  
    - But mixed strategies introduce *lotteries within states*. For example, in state L:  
      - Pure T yields 1 (deterministic).  
      - Mixed σ yields a **lottery** (0.5 chance of 1, 0.5 chance of 0).  
    - To say σ dominates B, you must compare B’s deterministic 0.4 to σ’s lottery in *each state*. STP doesn’t rank lotteries.  
  - **The Gap**:  
    - Asserting that σ yields "0.5" in a state presupposes **risk neutrality** (linear utility) and **probabilistic averaging**.  
    - This *is* an EU assumption: specifically, the "independence axiom" in vNM EU, which lets you value lotteries by expectation.  
  - **Strength**: This is your strongest paragraph. It cleanly shows that mixed-dominance requires EU to evaluate dominators.  
  - **Weakness**: Specify *which* EU axiom is sneaked in (independence). Example:  
    > *"Averaging payoffs across pure strategies assumes u(σ) = E[u(outcome)] — which is vNM’s linearity in probabilities."*

  #### **3. The Thesis: Circularity in Textbooks**
  - **Philosophy**: Your thesis holds.  
    - Textbooks often present dominance (with mixed strategies) as "pre-theoretic rationality," then use it to *motivate* EU.  
    - But if mixed-dominance relies on EU (to value lotteries), this is circular.  
  - **Objection**: One counter is that STP *plus probabilistic sophistication* might justify averaging. But probabilistic sophistication is EU’s cousin — it doesn’t rescue the "pre-theoretic" claim.  
  - **Improvement**: Name a specific textbook (e.g., Osborne-Rubinstein) and quote their sequencing of ideas.

  ---

  ### **Responses to Your Questions**

  #### **(a) Does dominance → rationalizable set?**  
  - **Math**: Correct. For strict dominance:  
    - With mixed dominators: Iterated elimination → rationalizable set.  
    - With pure dominators only: May leave non-rationalizable strategies (e.g., B survives in your game).  
  - **Philosophy**: The "machinery" isn’t redundant. Dominance is **algorithmic** (belief-free), while rationalizability is **epistemic** (about beliefs). This is the "point" you hint at:  
    - Dominance gives a *computational shortcut* to rationalizability without specifying beliefs.  
    - Your critique still stands: Both rely on EU when mixed strategies dominate.  

  #### **(b) Does order of elimination matter with mixtures?**  
  - **No — this is incorrect for strict dominance.**  
    - **Theorem**: Iterated strict dominance (ISD) is order-independent *even with mixed dominators*.  
    - **Proof**: See Gilboa et al. (1990): The surviving set is unique for strict dominance.  
    - **Why it matters**: Your argument implies order-dependence weakens dominance, but it’s not true. **Cut this paragraph.**  
    - *Exception*: Order matters for *weak* dominance, but you use strict (0.5 > 0.4).  

  #### **(c) Can we ignore the opponent’s payoffs?**  
  - **For your example**: Yes, but with caveats.  
    - **First-round dominance**: Only depends on the chooser’s payoffs (as you say).  
    - **Iteration**: If the opponent’s payoffs are omitted, it’s no longer a game — it’s a decision problem. This is fine for your argument (STP applies to decisions too).  
  - **Risk**: If you call this a "game," readers may note that rationalizability requires beliefs about the opponent. Clarify:  
    > *"Here, the opponent’s payoffs are irrelevant for the chooser’s dominance. We treat L/R as states of nature, not strategic choices."*  

  ---

  ### **Overall Assessment**
  **Is it interesting?**  
  - **Yes.** This isn’t terminological quibbling. You expose a buried assumption in how game theory motivates EU. The link between mixed-dominance and vNM linearity is underexplored in pedagogy.  
  - **Nearest interesting extension**: Probe *why* EU is assumed covertly. Is it unavoidable? (Spoiler: Yes, for mixed-dominance. Binmore (2009) concedes this.)  

  **Strongest objection**:  
  - **"You’re attacking a strawman. Serious treatments define dominance with mixtures *after* introducing EU."**  
    - *Rebuttal*: Many texts (e.g., Mas-Colell Ch. 12) use mixed-dominance *before* formal EU to "refine" rationality. Your example forces them to choose: either admit EU is presupposed or weaken dominance to pure strategies.  

  **Paragraphs to keep/cut**:  
  - **Keep**: The payoff matrix, STP vs. lottery comparison, circularity thesis.  
  - **Cut**: Order-dependence (mathematically wrong), excessive caveats about opponent payoffs.  
  - **Sharpen**: Explicitly name the vNM axiom (independence) smuggled into averaging.  

  **Final thought**: This is a strong, publishable note. Target philosophy-of-economics venues (*Erkenntnis*, *Econ & Phil*). Focus on the EU circularity — it’s your killer point.
