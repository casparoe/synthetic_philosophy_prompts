prompt: |-
  I'm in the second year of a PhD and have to turn a vague hunch into a one-year fellowship proposal, so what I need from you is a plan for a paper-length project (say 12 months, with 3 of those for writing). The topic is verisimilitude -- the idea that one false theory can be closer to the truth than another, and that this is part of what makes inquiry progressive even though most of our theories get rejected. Heres the hunch. Every version of the idea I've met seems to need a target: you have to know what the true theory is (or the actual world, as a point in a space of possibilities) and then measure how far a candidate falls from it. Which means the whole thing only works from the vantage point of a theory we don't have yet, and it can't tell us anything about comparing two live rivals neither of which is true. That seems backwards. What I want to try is an account of truthlikeness that only uses resources available from inside the theories being compared: define a notion of a local correction -- a step from one representation to another that fixes something the first got wrong, where you can certify that it's a fix without knowing the whole truth -- and then say A is closer to the truth than B iff B can be reached from A (or A from B, I always mix this up) by some chain of certified local corrections. Truthlikeness then comes out as a partial order generated by local repairs rather than as a global distance to a target. I half remember some old objection that you can re-describe the same theories in a different vocabulary and the rankings flip; I don't know if that kills this version too or whether the local-correction idea has resources against it, so it has to be part of the project rather than a footnote.

  Turn this into the proposal: a precise statement of the question that actually has a determinate answer, why the target-based accounts leave it open (in your own words, no citations, I'll add the references myself), the method month by month, what the deliverable looks like, what would count as the project failing, and an honest section on what could make it too big for a year. Give it a title and a one-paragraph abstract. I'd rather you tell me the idea is dead on arrival than write around it. Use cases I can describe without looking anything up -- phlogiston and oxygen, caloric and kinetic heat, humoral medicine vs germ theory, that kind of thing -- and make at least one of them a case where the two theories don't even agree about what the possibilities are, since that's where I think the target-based accounts cheat. Also dont make me prove that the order is total; if it turns out comparisons are usually incomparable, that might be the result, and I'd want the proposal to say so up front.
reasoning: |-
  We are going to design a 12-month project plan for a fellowship proposal on verisimilitude, focusing on the idea of defining truthlikeness via local corrections without requiring knowledge of the true theory.

  Title: Verisimilitude Without a Target: A Local Correction Approach

  Abstract: 
  This project develops a novel account of verisimilitude (truthlikeness) that does not require a prior specification of the true theory or the actual world. Traditional target-based accounts measure the distance of a theory from the truth, but this presupposes access to the truth and cannot compare false theories without it. We propose that one theory is closer to the truth than another if it can be transformed into the other via a sequence of certified local corrections, where each correction fixes an error in a way that can be verified without knowing the entire truth. This approach generates a partial order of truthlikeness based on the structure of local repairs. We will test the account on historical case studies (e.g., phlogiston vs. oxygen, caloric vs. kinetic theory, humoral vs. germ theory) and address the challenge of vocabulary variance. The deliverable is a paper showing that verisimilitude can be grounded in internal resources, providing a non-target-based partial order that captures scientific progress even when theories are false and incommensurable.

  Problem Statement and why target-based accounts leave it open:

  The core question is: How can we compare the truthlikeness of two false theories without knowing the true theory? 

  Target-based accounts (e.g., those using similarity metrics over possible worlds or structural resemblance) require a specification of the target (the true theory or the actual world). This makes them external: they assume a vantage point we do not have. Consequently, they cannot be used to compare two live rival theories because we do not know the target. Moreover, in cases of incommensurability (where theories disagree on the space of possibilities), target-based accounts often rely on a common framework (like a fixed set of possible worlds) that may not be available. This leaves the problem of comparing rivals without a target open.

  Method:

  The project will proceed in three phases:

  1. Formalization (Months 1-4):
     - Define the notion of a "local correction": a transformation from one representation (theory) to another that fixes a specific error and can be certified as an improvement without knowing the entire truth. This might involve:
       * Identifying a set of "problem spots" in a theory (e.g., anomalies, false predictions).
       * Defining a correction as a modification that resolves a problem spot and is certified by evidence (e.g., experimental results) that the old theory got wrong and the new one gets right.
     - Define a partial order: A is closer to the truth than B if there is a chain of certified local corrections from B to A (so A can be reached by improving B). Note: The direction: we want to say that if we start from a less truthlike theory and apply corrections, we get closer. So if A is closer to the truth than B, then we can get from B to A by a series of corrections. This means that A is an improvement over B.

     We have to be cautious about the direction. Let us set:
       Let T be the true theory (unknown). We want to say that A is closer to T than B is.
       We define a relation: B -> A means that A is a local correction of B (so A is a step closer to T than B).
       Then, if there is a chain of corrections from B to A, then A is closer to T than B? Not exactly: if we have B -> A, then A is a correction of B, so A is better than B. But we might have a chain: C -> B -> A, meaning A is better than B, and B is better than C. Then A is closer to T than C. But note: we don't have T. So we are building a partial order that we hope is leading toward T.

     Actually, we want to say: A is at least as close to the truth as B if there is a chain of corrections from B to A (so we can get from B to A by making improvements). Then, if in addition there is no chain from A to B, we can say A is strictly closer.

     However, note that the chain of corrections might not be unique and might not cover all theories. We allow for incomparability.

     - We must address the vocabulary variance problem: how to ensure the corrections are not sensitive to arbitrary redescription. We will build into the definition of a local correction that it must be grounded in empirical certification (so it must be tied to evidence) and try to make it invariant under equivalent redescription.

  2. Case Studies (Months 5-8):
     - Apply the framework to historical cases:
        a. Phlogiston theory (Stahl) vs. Oxygen theory (Lavoisier): 
            - Problem spots: phlogiston theory could not explain weight gain in calcination. Oxygen theory corrected this by identifying oxygen as the substance absorbed.
            - Local correction: replace "release of phlogiston" with "absorption of oxygen" in the explanation of calcination, certified by weighing experiments.
        b. Caloric theory (heat as fluid) vs. Kinetic theory (heat as motion):
            - Problem spot: caloric theory could not explain the production of heat by friction. Kinetic theory corrected this by showing work can be converted to heat.
            - Local correction: replace the conservation of caloric with the conversion of mechanical energy to heat, certified by experiments like Rumford's cannon boring.
        c. Humoral medicine (four humors) vs. Germ theory (Pasteur):
            - Problem spot: humoral theory could not explain the spread of specific diseases. Germ theory introduced microorganisms as causes.
            - Local correction: replace "imbalance of humors" with "invasion by specific germs" for a particular disease (e.g., anthrax), certified by experiments showing transmission by bacteria.

     - Incommensurability case: Humoral vs. Germ theory. They do not share the same ontology (humors vs. germs) and do not agree on the space of possibilities (e.g., humoral theory does not have the possibility of microbial infection). We will show how a local correction can bridge such gaps by focusing on specific anomalies (e.g., why does a disease spread in a particular way?) and providing a new representation that resolves it.

  3. Addressing Challenges and Writing (Months 9-12):
     - Month 9: Investigate the objection about vocabulary variance. We will consider a redescription of the same theory and see if our partial order flips. We will try to build into the certification process a requirement that the correction must be tied to empirical evidence that is theory-neutral enough to avoid redescription problems. For example, the certification of a correction must rely on data that both theories can recognize (even if they interpret differently) and the correction must yield a better fit to that data.
     - Month 10: Formalize the partial order and investigate its properties (reflexive, transitive, but not necessarily total). We expect and accept incomparability in some cases.
     - Month 11: Draft the paper.
     - Month 12: Revise and finalize.

  Deliverable:
  A paper (approx. 8000-10000 words) containing:
  1. A critique of target-based accounts for their inability to compare rival false theories without the truth.
  2. The formal framework of local corrections and the induced partial order.
  3. Application to case studies, including an incommensurable case.
  4. Discussion of the vocabulary variance challenge and how the account responds.
  5. Conclusions about the prospects for a non-target-based verisimilitude.

  What counts as failure?
  1. If we cannot define a notion of "local correction" that is both non-trivial and certifiable without the truth (e.g., if every change counts as a correction or if certification always requires the truth).
  2. If the partial order we get is trivial (e.g., almost all theories are incomparable, or the order does not align with intuitive historical cases).
  3. If the vocabulary variance problem leads to inconsistent orderings under redescription and we cannot find a way to block it.

  What could make the project too big for a year?
  1. The formalization might require developing a complex logical framework (e.g., a full-blown language for theories and corrections) that takes more time than expected.
  2. The historical case studies might require more detailed investigation than anticipated, especially in handling incommensurability.
  3. The vocabulary variance problem might turn out to be more severe and require a deep dive into the philosophy of language and measurement theory, which could expand the scope.

  Mitigation: 
  - We will start with simple formal models (e.g., using propositional logic or simple models of theories) and then generalize.
  - For case studies, we will rely on well-established historical accounts to avoid primary research.
  - For vocabulary variance, we will focus on the empirical certification being based on data that is as theory-neutral as possible (e.g., measurement readings, observed events) and use that to anchor the corrections.

  Honest assessment: 
  The idea is not dead on arrival. The local correction approach has roots in the notion of "corroboration" and "problem solving" in Lakatos and Popper, but the specific formalization via a partial order of corrections is novel. The main risk is the vocabulary variance objection, but we have a strategy to address it by tying corrections to empirical certification. Even if the partial order is often incomplete, that might be a virtue (reflecting the incomparability of some theories). The project is ambitious but feasible in a year if we keep the formalization focused and the case studies clear.

  Let me know if you need any adjustments.
answer: |-
  ### Fellowship Proposal: Verisimilitude Without a Target  

  **Title**: *Local Corrections: A Non-Target-Based Account of Verisimilitude*  

  **Abstract**:  
  This project develops a novel account of verisimilitude (truthlikeness) that eliminates the need for a privileged "target" theory or world. Traditional approaches measure progress by computing distances to the unknown truth, rendering comparisons between false theories impossible. I propose instead that *verisimilitude arises from sequences of certified local corrections*: theory modifications that fix specific errors, where each correction is verifiable without full knowledge of the truth. The result is a partial order of truthlikeness, generated internally from the theories themselves. Using historical cases (e.g., phlogiston vs. oxygen, humoral medicine vs. germ theory), I formalize this framework, address the problem of vocabulary variance, and demonstrate its applicability to incommensurable theories. The deliverable is a paper arguing that scientific progress is best understood as a path of locally certified repairs rather than convergence toward an unreachable target.  

  ---

  ### 1. Core Question  
  *Can we compare the truthlikeness of two false theories using only resources internal to the theories and their empirical consequences, without invoking an inaccessible "target" truth?*  

  ### 2. Why Target-Based Accounts Fail  
  Target-based approaches (e.g., similarity metrics over possible worlds) require knowing the true theory or actual world to compute distances. This presupposes the very knowledge inquiry seeks, making it useless for comparing *live* rivals (e.g., phlogiston vs. oxygen in 1770). Worse, they fail in cases of **incommensurability**, where theories disagree on fundamental possibilities (e.g., humoral medicine’s "balance of bodily fluids" vs. germ theory’s "microbial invasion"). Here, target-based accounts implicitly impose a neutral framework (e.g., a shared possibility space) that does not exist—effectively cheating by smuggling in a God’s-eye view.  

  ---

  ### 3. Methodology (12-Month Plan)  
  **Months 1–2: Formalize Local Corrections**  
  - Define a *local correction* as a modification to theory A yielding theory B, where:  
    (i) B resolves an empirical anomaly or inconsistency in A (e.g., oxygen theory explains weight gain in combustion, which phlogiston cannot);  
    (ii) The improvement is *certifiable* without the full truth (e.g., via reproducible experiments);  
    (iii) The correction is *minimal* (fixes one problem without introducing new errors).  
  - Key challenge: Ensure definitions avoid triviality (e.g., not all changes are corrections).  

  **Months 3–4: Define the Partial Order**  
  - Theory A is *at least as truthlike* as B iff there exists a chain of certified local corrections from B to A.  
  - Example: Caloric (heat as fluid) → kinetic theory (heat as motion) via local corrections for friction experiments.  
  - Accept incomparability: If no chain exists (e.g., humoral vs. phlogiston), theories are not ranked.  

  **Months 5–6: Address Vocabulary Variance**  
  - Test against the *redescription objection*: Can rewording theories flip the order?  
  - Strategy: Require corrections to be tied to *empirical certification conditions* (e.g., data both theories must acknowledge, like "metals gain weight when burned").  
  - Use case: Phlogiston (Stahl) vs. oxygen (Lavoisier), redescribing "dephlogisticated air" as "oxygen." Does the correction chain hold?  

  **Months 7–8: Incommensurable Case Study**  
  - Analyze humoral medicine (Galen) vs. germ theory (Pasteur):  
    - Theories disagree on possibilities (humoral imbalance vs. bacterial infection).  
    - Identify local corrections: Germ theory resolves cholera transmission anomalies via microscopy evidence, certifiable without full truth.  
  - Outcome: Show corrections bridge incommensurability by targeting shared empirical failures (e.g., epidemic patterns).  

  **Months 9–11: Writing & Refinement**  
  - Structure:  
    - Critique of target-based accounts (§1–2).  
    - Formal framework of local corrections (§3).  
    - Case studies (§4) and response to redescription (§5).  
    - Implications: Verisimilitude as partial order, not metric (§6).  
  - Integrate feedback from advisors.  

  **Month 12: Final Revisions**  
  - Polish arguments, ensure clarity, and submit.  

  ---

  ### 4. Deliverable  
  A **paper** (8,000–10,000 words) for a philosophy of science journal (e.g., *British Journal for the Philosophy of Science*). Key sections:  
  - Target-based accounts’ inability to compare rivals.  
  - Axiomatization of local corrections and partial order.  
  - Case studies showing real-world applicability.  
  - Defense against redescription (vocabulary variance).  
  - Conclusion: Verisimilitude is internal, partial, and progress-oriented.  

  ---

  ### 5. Failure Conditions  
  The project fails if:  
  1. **Local corrections cannot be rigorously defined** (e.g., all changes are trivially "corrective").  
  2. **Certification demands the truth** (e.g., verifying improvements secretly requires knowing the target).  
  3. **Vocabulary variance flips rankings** unavoidably (e.g., redescribing phlogiston swaps its position with oxygen).  
  4. **Case studies resist correction-chains** (e.g., humoral → germ theory lacks a minimal-step path).  

  ---

  ### 6. Feasibility and Risks  
  **Risks of scope creep**:  
  - **Formalizing certification**: Defining "empirical certification" rigorously risks entanglement with theories of evidence (e.g., Bayesianism). *Mitigation*: Restrict to cases with unambiguous experimental outcomes (e.g., weight measurements in combustion).  
  - **Incommensurability**: Bridging radically different ontologies may require auxiliary assumptions. *Mitigation*: Focus on anomalies both theories recognize (e.g., disease spread) to ground corrections.  
  - **Partial order complexity**: Proving formal properties (e.g., transitivity) could derail timelines. *Mitigation*: Prioritize conceptual clarity over full mathematical generality; accept incompleteness.  

  **Why it’s feasible in 12 months**:  
  - Core framework builds on historical episodes with well-documented anomalies.  
  - No need for exhaustive formal proofs (e.g., totality of the order is not required).  
  - Focus on 2–3 paradigmatic cases avoids overextension.  

  ---

  ### 7. Title & Abstract (Revised)  
  **Title**: *Chains of Repair: Verisimilitude as Certified Local Corrections*  
  **Abstract**:  
  Verisimilitude (truthlikeness) is vital for explaining scientific progress, but prevailing accounts require a "target" truth—inaccessible for evaluating rivals like phlogiston and oxygen. I argue that verisimilitude is better defined via sequences of *local corrections*: minimal, empirically certified theory modifications that resolve specific errors without presupposing the truth. This generates a partial order of truthlikeness, applicable even to incommensurable theories (e.g., humoral vs. germ theory). The project formalizes this approach, addresses the redescription objection, and demonstrates its superiority to target-based views using historical cases. Deliverables include a journal paper showing that scientific progress is driven by *local repairs*, not convergence toward an unknowable ideal.  

  ---  
  **Next Steps**:  
  - Begin Month 1 by formalizing "local correction" using propositional logic toy models (e.g., theory A predicts ¬P, experiment shows P; correction modifies A to accommodate P).  
  - I suggest starting with the *phlogiston → oxygen* case—it’s clean, and Lavoisier explicitly framed his work as correcting Stahl’s errors.
