  ### **Time & Space Discounting Game: "The Now vs. Later Conundrum"**  
  **Goal:** Make participants viscerally experience *pure time discounting* (caring less about future rewards *only* because they’re delayed) and contrast it with *spatial discounting* (same delay, different physical effort). Debunk common excuses (death, uncertainty, investment) to expose the "weirdness" of devaluing the future purely due to delay.

  ---

  ### **Materials Needed**  
  - **Index cards:** 3 colors (white for time, blue for space, yellow for bids).  
  - **Timer:** For tracking delays.  
  - **Pens & clipboards:** One per player.  
  - **Tokens/points:** Poker chips, sticky notes, or a ledger (start each player with 100 points).  
  - **Reward vouchers:** Small, fun prizes (e.g., "free drink," "bar snack," "bragging rights card").  
  - **Physical stations:** 3 labeled spots in the bar:  
    - **Station 0:** Your seat (no effort).  
    - **Station 1:** Bar counter (20 steps away).  
    - **Station 2:** Restroom hallway/outside door (60 steps away).  

  ---

  ### **Rules & Setup (5 mins)**  
  1. **Intro:** *"Tonight, we’re auctioning vouchers for real rewards. The catch? Some pay out later, some require walking. Rules guarantee: NO death risk, NO inflation, NO investment. If you win, you get it—period."*  
  2. **Budget:** Everyone starts with **100 points**. Points can only buy vouchers (no earning interest).  
  3. **Key Rule:** Vouchers are **binding and guaranteed**. If you win a future reward, it *will* be delivered.  

  ---

  ### **Phase 1: Time Discounting (30 mins)**  
  **Goal:** Auction vouchers for the **same reward** (e.g., 1 drink) with **identical certainty** but **different delays**.  

  #### **Procedure**  
  1. **Auction Rounds (3 rounds, 3 delays per round):**  
     - Hold 3 identical sequences of auctions (rounds 1-3) to gather more data.  
     - Each sequence sells 3 vouchers:  
       - **Voucher A:** Pays **NOW** (handed immediately).  
       - **Voucher B:** Pays in **5 mins** (you sit, facilitator delivers it when timer rings).  
       - **Voucher C:** Pays in **10 mins** (delivered later while Space game runs).  
     - Auction order: Randomize (e.g., B → A → C) to avoid bias.  

  2. **Auction Mechanics (per voucher):**  
     - **Bidding:** Players write bids secretly on yellow cards.  
     - **Winner:** Highest bidder pays their bid, gets the voucher.  
     - **Tiebreaker:** Earliest bid submitted wins.  

  3. **Example Flow:**  
     - *Round 1, Voucher B (5-min delay):*  
       - Bids collected → winner pays 40 points → gets voucher.  
       - Timer set for 5 mins → reward delivered *automatically* at timeout.  
     - Repeat for Voucher A (NOW) and Voucher C (10 mins).  
     - **Repeat for Rounds 2 & 3.**  

  ---

  ### **Phase 2: Space Discounting (25 mins)**  
  **Goal:** Auction vouchers for the **same reward** (1 drink) with **identical 5-min delay** but **different physical distances**.  

  #### **Procedure**  
  1. **Auction Rounds (3 rounds, 3 distances per round):**  
     - Each sequence sells 3 vouchers (all paid after 5 mins, but pickup varies):  
       - **Voucher X:** Delivered to **your seat** (no effort).  
       - **Voucher Y:** Must pick up at **bar counter** (Station 1).  
       - **Voucher Z:** Must pick up at **hallway** (Station 2).  
     - Auction order: Randomize (e.g., Y → Z → X).  

  2. **Delivery Mechanics:**  
     - After 5 mins, winners must physically go to their station to claim the reward.  
     - Facilitator enforces: "No proxy—you *must* walk if you won Voucher Y/Z."  

  ---

  ### **Data Collection (No Spreadsheets!)**  
  - **Time Discounting:** Record winning bids for each delay (A/B/C) on a whiteboard:  
    ```
    DELAY     | NOW | 5-min | 10-min
    Round 1   | 70  | 50    | 30
    Round 2   | 65  | 45    | 25
    ```  
    - **Pattern:** Bids drop as delay increases → reveals discounting.  

  - **Space Discounting:** Record bids for each location (X/Y/Z):  
    ```
    LOCATION  | Seat | Bar | Hallway
    Round 1   | 60   | 55  | 52
    ```  
    - **Pattern:** Bids similar across distances → no discounting.  

  - **Calculate Discount Rates On-the-Fly:**  
    - **Time:** `Discount rate = [(Bid_NOW - Bid_10min) / Bid_NOW] × 100%`  
      *(e.g., (70-30)/70 = 57% discount for 10 mins)*.  
    - **Space:** Compare bids—if they’re close (e.g., 60 vs. 52), discount is minimal.  

  ---

  ### **What Will Go Wrong (And How to Fix)**  
  1. **"But I could die tomorrow!":**  
     - Shut down: *"Rules say: even if you vanish, your voucher is redeemed. Death isn’t an out tonight."*  

  2. **"I’ll be richer later!":**  
     - Rule reminder: *"No inflation—points and rewards are constant. Your wealth tonight is fixed."*  

  3. **Hoarders:**  
     - Mitigate: Run 3 rounds so players "spend" gradually. If hoarding persists, whisper: *"Vouchers are limited—this round is your last chance for X."*  

  4. **Chaos in Space auctions:**  
     - Station helpers: Recruit bar staff to man stations.  
     - No runners? Use "virtual distance": *"Imagine Station 2 is in Antarctica—how much less would you bid?"*  

  ---

  ### **Debrief (20 mins): From $130 in 5 Years to Year 2200**  
  **Transition:** *"Dave bid 70 for $100 NOW vs. 30 for $100 in 10 mins. Why? Let’s autopsy the excuses:"*  

  | "Excuse"          | Ruled out? | Why?                                                                 |  
  |-------------------|------------|----------------------------------------------------------------------|  
  | **Uncertainty**   | ✅         | Game guaranteed payouts—no risk of non-payment.                      |  
  | **Opportunity cost** | ✅      | Points couldn’t be invested—no interest earned.                      |  
  | **Death**         | ✅         | Rules enforced payout regardless.                                    |  
  | **Future wealth** | ✅         | No inflation/wealth growth—rewards identically valuable at all times.|  

  **The Naked Truth:**  
  - *"The only variable left was **time delay**. Yet you discounted heavily—a 57% drop in 10 mins. Extrapolate: If 10 mins = 57% less value, 5 years ≈ near-zero value. Dave’s bids imply the year 2200 is worthless to him!"*  

  **Spatial vs. Temporal Contrast:**  
  - *"But for **space**, bids barely changed. Why discount time but not distance? Because time feels scarce and abstract; space feels conquerable. Yet both are just ‘delay’—why treat them differently?"*  

  **Bigger Implications:**  
  - *"This is why we under-save for retirement, ignore climate change, or binge Netflix. We’re wired to devalue the future purely because it’s ‘later’—even when logic says not to."*  

  ---

  ### **What the Game Can’t Show (Say This Aloud)**  
  - *"This is a lab, not real life. Long-term discounting involves ethics (e.g., valuing future generations) and unknowns (tech changes). But tonight, we isolated the core weirdness: your brain says ‘now > later’ even when nothing else changes."*  

  ---

  ### **Why This Works**  
  - **Fun:** Feels like a game show (bidding, prizes, walking).  
  - **Revealing:** Clear data on whiteboards → "aha!" moments.  
  - **Robust:** 3 rounds dilute outliers; physical stations make space discounting visceral.  
  - **No-Philosophy-Needed:** Engineers see numbers, not abstract theory.  

  **Final Tip:** Start with a practice round (auction a "joke reward" like high-fives) to teach bidding. End with drinks—reinforces that *some* discounting is fun!
