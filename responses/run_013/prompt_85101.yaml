answer: |-
  ### Brainstorming Scratchpad  
  **Core Frustration:** Students treat standard replies (unbounded utility rejection, probability truncation, infinite muggers) as a checklist without diagnosing *why* these "solutions" emerge. Need to force:  
  - **Hierarchy of Causes:** Is one issue primary? (e.g., Structural tail-vulnerability enables the other two to manifest as "solutions")  
  - **Exploitability’s Role:** Is it (a) a *consequence* of tail-vulnerability, (b) a distinct game-theoretic problem, or (c) redundant with probability/utility critiques?  
  - **Adversary vs. Natural Hypothesis:** Does the mugger’s *agency* matter? (If yes, problem shifts to decision-rule robustness; if no, problem is epistemic)  

  **Cruxes to Target:**  
  1. **Structural Vulnerability:** EU maximization is *defined* by integrating over the entire probability space. Any hypothesis with \( p \times u \to \infty \) as \( p \to 0 \) can dominate. Rejecting unbounded utility or tiny probabilities patches symptoms but doesn’t address this core.  
  2. **Exploitability ≠ Epistemic Problem:** An adversary exploits EU’s structural flaw by *crafting* hypotheses to trigger tail-dependence. But mugging persists even for natural hypotheses (e.g., "quantum fluctuations create 3↑↑↑↑3 happy lives"). Distinction: exploitability reveals *procedural* risk; natural hypotheses test *epistemic* coherence.  
  3. **Why Standard Replies Fail:** They’re reactive. Bounding utility avoids mugging but cripples EU in Pascalian dilemmas (e.g., asteroid prevention). Ignoring tiny probabilities violates coherence (e.g., lottery tickets). Infinite muggers invoke consistency but don’t resolve single-mugger cases.  

  **Question Design Goal:** Force students to argue that *one* issue is fundamental and show how others derive from it or are insufficient alone.  

  ---

  ### Final Essay Question  
  **Pascal’s Mugging: Diagnosis and Deep Fix**  
  Pascal’s mugging is typically "solved" by: (A) rejecting unbounded utility functions, (B) ignoring tiny probabilities, or (C) appealing to infinite muggers. Yet these feel like patches, not cures. Defend *one* of the following as the *underlying cause*:  
  > **(i) The existence of unbounded/infinite value assignments**  
  > **(ii) The epistemic legitimacy of arbitrarily small credences**  
  > **(iii) Expected utility’s structural sensitivity to distributional tails**  

  Your essay must:  
  1. **Commit** to one diagnosis as primary.  
  2. **Explain** why your chosen cause makes the mugging possible, while the other two are either *consequences* or *inadequate standalone fixes*.  
  3. **Analyze exploitability**: Is the fact that an adversary can tailor hypotheses to exploit EU maximization a *fourth distinct problem*, or is it entailed by your diagnosis? Does it matter if the mugger is an adversary (knowing your decision rule) vs. a natural hypothesis?  

  *No citations needed. Engage the deep structure.*  

  ---

  ### Model Answer (Strong Student, 698 words)  
  Pascal’s mugging arises from a structural flaw in expected utility (EU) theory: its verdicts are **hostage to distributional tails** (iii). This sensitivity enables hypotheses with arbitrarily low probability and high utility to dominate choice, rendering EU maximization unstable. While unbounded utilities (i) and tiny credences (ii) appear culpable, they merely *enable* the core problem—they are neither necessary nor sufficient for mugging without (iii).  

  **(iii) as Primary Cause:** EU integrates \( \sum p_i u_i \) over all hypotheses. If *any* hypothesis \( h \) exists where \( u(h) \) grows faster than \( p(h) \) decreases, \( h \) controls the expectation. This tail-vulnerability is intrinsic to EU’s linearity and exhaustiveness. Mugging occurs when we confront hypotheses like "pay \( \$5 \) or I create \( 3\uparrow\uparrow\uparrow\uparrow3 \) lives" because EU *must* assign finite credence \( \epsilon > 0 \) (however small) to the claim, and \( \epsilon \times u(\text{lives}) \) dwarfs \( u(\$5) \). Crucially, this holds even if utilities are bounded or \( \epsilon \) is constrained: if \( u_{\text{max}} \) is large but finite, set \( u(h) = u_{\text{max}} \) and \( p(h) < \frac{u(\$5)}{u_{\text{max}}} \), and mugging reappears. Tail-sensitivity is the engine; unbounded utilities and free credence assignment are fuel.  

  **(i) and (ii) as Symptoms:** Rejecting unbounded utility (i) seems appealing but misfires. First, many plausibly unbounded values (e.g., lives saved) exist, and bounding them artificially (e.g., capping lives at \( 10^{100} \)) avoids mugging only by fiat, sacrificing normative force in Pascalian ethics. Second, it doesn’t fix tail-sensitivity: bounded utilities still permit mugging if \( p(h) \) is small enough relative to \( u_{\text{bound}} \). Similarly, discarding tiny probabilities (ii) is a hack, not a cure. Ignoring hypotheses below threshold \( \delta \) violates coherence (e.g., if \( \delta = 10^{-100} \), a lottery with probability \( 1.1 \times 10^{-100} \) has infinite expected value). Worse, it doesn’t address why mugging *arises*—it surgically removes the symptom by mutilating our credal state. Both (i) and (ii) respond to (iii)’s effects but leave EU’s architecture flawed.  

  **Exploitability: Consequence, Not Cause:** Exploitability is **not a fourth problem**; it is the *practical instantiation* of (iii). An adversary crafts \( h \) with \( p(h) \) just large enough that \( p(h) \times u(h) > u(\text{status quo}) \), exploiting tail-sensitivity. But natural hypotheses (e.g., "this button has \( p = 10^{-100} \) of creating a universe of happiness") cause identical pathology—no malice needed. The adversary’s *knowledge* of your decision rule merely weaponizes (iii); it doesn’t create a new flaw. What exploitability *adds* is a decision-rule critique: EU invites predation by forcing you to accept all positive-expectation bets. This highlights that (iii) isn’t merely epistemic—it’s *strategically* toxic. Yet the core remains structural: any EU-like rule that integrates the entire tail is vulnerable.  

  **Conclusion:** Pascal’s mugging is EU’s tail-sensitivity laid bare. Fixes like capping utilities or pruning probabilities treat surface phenomena. A deep solution requires rethinking how EU handles extreme hypotheses—perhaps by discounting tail events non-linearly or embedding robustness to adversarial priors. Until then, EU remains a broken compass in Pascalian territory.  

  ---

  ### Marking Scheme (20 points total)  
  | **Point**                                      | **Marks** | **Common Miss**                                                                 |  
  |------------------------------------------------|-----------|---------------------------------------------------------------------------------|  
  | **Clear commitment** to one primary diagnosis (i/ii/iii) with justification.          | 4         | Vagueness ("all are important"); failing to explicitly choose one.              |  
  | **Correct subordination**: Explains why the *other two* causes are secondary/consequences of the chosen diagnosis. | 5         | Treating (i)/(ii) as independent fixes; not showing how they rely on (iii).     |  
  | **Exploitability analysis**: Correctly identifies it as derivative *or* distinct; addresses adversary-vs-natural distinction. | 5         | Calling exploitability a "fourth problem"; ignoring natural hypotheses.         |  
  | **Depth on chosen cause**: Explains *why* the diagnosis is fundamental (e.g., EU’s linearity, exhaustiveness). | 4         | Surface description ("tiny probabilities are bad"); no tie to EU’s structure.   |  
  | **Coherence & defense**: Logical flow; no hedging; defends against obvious rebuttals. | 2         | "Both sides" equivocation; not addressing bounded-utility counterarguments.     |  

  **Grade Boundaries:**  
  - **A (17-20)**: Hits all points; diagnosis is persuasive and structurally grounded.  
  - **B (13-16)**: Identifies primary cause but weak subordination/exploitability analysis.  
  - **C (9-12)**: Recites standard replies without diagnosis; exploitability misunderstood.  
  - **D (5-8)**: Major confusion; no commitment to a primary cause.  

  ---  
  **Rationale**: This question forces synthesis. A student reciting "reject unbounded utility" scores poorly on *subordination* (Point 2) and *depth* (Point 4). Exploitability analysis (Point 3) filters strong candidates—B students often miss the natural-hypothesis nuance. The model answer exemplifies an A by anchoring everything to (iii).
