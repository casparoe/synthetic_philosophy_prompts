  The user seems frustrated with the industry's philosophical inconsistencies - they used phrases like "political settlement wearing a statistical costume." I should acknowledge that tension while still providing a clear analysis. They'll want me to take a stance, so I'll argue that insurers presuppose a weak realism about risk, while discrimination boundaries reflect societal compromises more than coherent principle.

