  About unfair discrimination theories... the current regulatory boundaries feel politically negotiated rather than philosophically consistent. Why ban race but allow zip codes? Why protect genetics in health insurance but not life insurance? The pattern suggests a blend of moral considerations (like immutability) and practical compromises - notice how banned factors often correlate with protected social groups. 

