  I'm submitting a one-page proposal to a workshop on non-standard updating, and I want help turning a half-formed idea into something with a definite question and a work plan. The idea: the Judy Benjamin problem — you receive a message that fixes only a conditional probability, and the standard relative-entropy-minimizing response and its rivals disagree about the posterior, with answers that shift depending on how the partition is described — is normally read as showing that updating on conditionals is underdetermined. I think the underdetermination sits entirely on the input side. Model the message as an event in a larger space whose likelihood depends on the world, and ordinary conditionalization fixes a unique posterior; the real question then becomes which of the rival rules are equivalent to conditionalizing on some such event and which are not. The case I want to press hardest has the messenger's disposition to speak correlated with the state of the world, so that the message is itself evidence about the partition rather than a bare constraint on a conditional probability.

  Write the proposal: state the question so that it has a determinate answer; explain why the existing treatments leave it open; say what I would actually do, including the two-stage construction I'd use to separate rules that agree on the original problem (a first message on which their posteriors coincide and a second on which they diverge) and which considerations would decide between them; say what would count as the project failing; and be honest about whether this is a workshop paper or a dissertation in disguise. No citations — I'll add those myself.
