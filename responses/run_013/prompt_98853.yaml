answer: |-
  Below is a carefully designed 90-minute activity that meets your specifications, centered on experiential discovery of Arrow's Impossibility Theorem. The focus is on students organically encountering the failure of IIA (independence of irrelevant alternatives) and sensing the constraints of ordinal preferences.

  ---

  ### **Activity Design: "The Democracy Lab"**
  **Objective:** Students discover the impossibility of a "perfect" voting rule by designing one that satisfies intuitive fairness conditions, then confronting its failure—especially the quiet abandonment of IIA.

  #### **Materials**
  - **Voting cards**: 3 colored cards per student (Red, Blue, Green) for preference ranking.
  - **Profile sheets**: 3 scenarios (see below) + blank sheets for rule-writing.
  - **Sticky notes** for desiderata brainstorming.
  - **Whiteboard** to track conditions and group progress.
  - **Timer** visible to all.
  - **Small stakes**: "Deliberation Diplomas" (fun certificates) for groups that devise rules passing all tests without a dictator.

  #### **Group Structure**
  - **4 groups** (4-5 students each).  
    *Rationale: Small enough for debate, large enough to simulate collective choice.*  
  - **Roles per group**:  
    - *Recorder*: Writes the group's voting rule.  
    - *Tester*: Runs the rule on profiles.  
    - *Ambassador*: Reports findings to class.  
    - *Skeptic*: Challenges assumptions (appointed secretly by you to ensure rigor).

  #### **Sequence & Timing**  
  *(Total: 90 min)*  

  1. **Framing & Setup (5 min)**  
     - You: "Today, you’ll design a voting rule for our seminar. It must convert individual preferences into a fair group ranking of three options: Red, Blue, Green. Your goal: create a rule everyone in your group would accept as legitimate."  
     - Distribute cards. Emphasize: *"Only rankings—no discussing intensity of preferences yet."*  

  2. **Articulating Desiderata (10 min)**  
     - Groups brainstorm 3–5 "must-have" properties for a fair voting rule (e.g., "no dictator," "majority wins," "respect unanimity").  
     - Sticky notes posted on board; you cluster into 4 categories:  
       - **Unanimity (U)**: If all prefer A > B, society ranks A > B.  
       - **Non-Dictatorship (ND)**: No single voter always decides.  
       - **Transitivity (T)**: If society prefers A > B and B > C, then A > C.  
       - **IIA (I)**: Ranking of A vs. B shouldn’t change if voters’ opinions *about other options* change.  
     - *Your stealth move:* If IIA isn’t proposed, add it neutrally: "Some groups worry about rules being 'hijacked' by irrelevant options—should we include that?"  

  3. **Rule Creation & Initial Testing (25 min)**  
     - **Task**: Design a rule satisfying all 4 conditions. Allow any method (ranked pairs, Borda, etc.).  
     - **Test 1 (Unanimity/Transitivity Check)**:  
       - *Profile 1*: All 17 students rank Red > Blue > Green.  
         - *Goal:* Rule must output Red > Blue > Green (tests U and T).  
     - **Test 2 (Cycle Scenario)**:  
       - *Profile 2*: Split class into 3 factions:  
         - 7 voters: Red > Blue > Green  
         - 6 voters: Blue > Green > Red  
         - 4 voters: Green > Red > Blue  
       - *Goal:* Reveals cycles under majority rule (Red > Blue? 11–6; Blue > Green? 13–4; but Green > Red? 10–7). Tests T.  
     - Groups record rules and outcomes.  

  4. **The IIA Trap (20 min)**  
     - **Test 3 (IIA Stress Test)**:  
       - *Profile 3a*: 5 voters: Red > Blue > Green  
         5 voters: Blue > Green > Red  
         7 voters: Green > Red > Blue  
       - Groups run their rule to get social ranking (e.g., Borda: Green wins; Condorcet: cycle).  
       - *Now, remove Green*:  
         - *Profile 3b*: Same voters, but only Red vs. Blue.  
           - 5 voters: Red > Blue  
           - 5 voters: Blue > Red  
           - 7 voters: Red > Blue (since Green removed, their Red > Blue becomes visible).  
         - Majority: Red > Blue (12–5).  
       - **Key**: Groups compare Profile 3a’s Red vs. Blue ranking to 3b’s.  
         - *If they used Borda*: In 3a, Green wins; Red and Blue tie for second. In 3b, Red beats Blue—violating IIA.  
         - *If they used pairwise majority*: 3a has a cycle (no clear Red vs. Blue), but 3b has Red > Blue—violating IIA.  
     - **Your role**: Wander, asking: "Does your rule rank Red vs. Blue the same way when Green is removed? Should it?"  

  5. **Cardinal Preferences "Escape Hatch" (15 min)**  
     - **Task**: "Now use your cards to express preference *strength*. Assign scores: 5 (love), 0 (hate), or anything in between."  
     - Groups design a new rule using scores (e.g., sum scores).  
     - **Test 4**: Rerun Profile 2 with scores.  
       - *Example*: A voter in "Green > Red > Blue" might assign Green:5, Red:3, Blue:0.  
       - *Outcome*: Cycles often resolve (e.g., Green wins with high scores from its faction).  
     - *Debrief seed*: "Did this feel different? Why?"  

  6. **Group Reports (10 min)**  
     - Ambassadors share:  
       - Their rule.  
       - Which condition failed first.  
       - How cardinal preferences changed outcomes.  
     - *Whiteboard tracking*: Tally which condition each group sacrificed (expect IIA dominance).  

  ---

  ### **Debrief (15 min)**  
  **Goal:** Translate intuition into theory without preempting discovery.  

  1. **Map Activity to Arrow’s Theorem**  
     - "You faced four conditions: Unanimity (U), Non-Dictatorship (ND), Transitivity (T), and IIA (I). Arrow proved *no rule* satisfies all four with ordinal preferences and ≥3 options."  
     - Highlight their sacrifice:  
       - *Cycle (Profile 2)* → Violates **Transitivity** (majority rule).  
       - *IIA test (Profile 3)* → Violates **IIA** (Borda/ranked pairs). Most groups abandoned IIA quietly—because it’s abstract.  
       - *Cardinal scores* → Broke impossibility by adding intensity (interpersonal comparability).  

  2. **Handling Objections**  
     - *"Our rule worked!"*: Ask the class to test it on Profile 2 or 3. If it "passes," identify hidden dictatorship or intransitivity.  
     - *"Why not ditch Transitivity?"*: Discuss real-world consequences (e.g., irrational policy cycles).  
     - *"Cardinal voting fixes everything!"*: Acknowledge its power but note trade-offs (e.g., strategic voting, intensity measurement).  

  3. **Checking Understanding**  
     - *Not thwarted, but enlightened* if they:  
       - Articulate why IIA was hardest to preserve.  
       - Explain how ordinal preferences limit information.  
       - Distinguish between "voting rule failed" and "no such rule exists."  
     - *Quick probe*: "In 1 sentence, what’s the core insight?" (e.g., "Fair voting requires trade-offs you can’t avoid.").  

  ---

  ### **Predictable Challenges & Mitigations**  
  - **IIA is too abstract**: Students won’t notice abandoning it.  
    - *Fix*: In debrief, contrast Profile 3a and 3b explicitly. Ask: "Who saw the Red/Blue ranking flip? Why?"  
  - **Time crunch**: Groups may stall on rule design.  
    - *Fix*: Pre-load example rules (Borda, Condorcet) on backup cards. Enforce strict timers.  
  - "**But dictatorship works!**": Likely from frustrated groups.  
    - *Fix*: Leverage ND—ask: "Would your group accept this rule long-term?"  
  - **Cardinal confusion**: Students might misuse scores (e.g., arbitrary numbers).  
    - *Fix*: Clarify scoring anchors ("5 = best, 0 = worst").  

  ---

  ### **What the Activity Can’t Do**  
  You must explicitly:  
  1. **State the theorem’s generality**: Students only see specific profiles. Clarify: *"Arrow proved this happens in **all** ordinal voting systems, not just yours."*  
  2. **Explain IIA’s purpose**: Students may see it as "boring." Justify: *"IIA prevents manipulation by adding decoy options."*  
  3. **Note real-world relevance**: E.g., *"This is why voting reforms (like ranked-choice) fix some flaws but not all."*  

  ---

  ### **Why This Works**  
  - **Discovery-driven**: IIA’s fragility emerges from lived frustration, not lecture.  
  - **Cardinal contrast**: Students *feel* the informational leap.  
  - **Low stakes**: "Diplomas" incentivize rigor without grading pressure.  

  This plan balances structure with open-ended exploration, ensuring students wrestle with Arrow’s insight: that democracy’s math demands hard choices, not just good intentions. Run it, and watch them confront the void!
