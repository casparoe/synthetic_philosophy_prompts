prompt: |-
  I teach decision theory, and I have been trying to isolate the principle behind my own verdicts about tiny probabilities of enormous value, without success. I accept a 1-in-10^100 chance of saving 10^100 lives over a certain cure for one person. I reject paying one dollar for a 1-in-10^100 chance of the same. I accept a research program with a 1-in-10^6 chance of preventing a catastrophe ten times worse than the status quo when the only alternative is no progress at all. I reject a research program with the same chance and the same catastrophe when the certain alternative is a modest but genuine improvement. I accept a 1-in-10^100 chance of a finite but astronomically large good when the alternative is zero, yet reject it when the alternative is a small certain good. I reject any gamble that carries a positive probability of infinite value, even when its expected value is undefined or infinite. Is there a coherent principle here—perhaps a probability threshold, a lexical restriction, or a constraint on which probabilities may be taken up? I suspect the principle is that expected value is authoritative only above some probability threshold or only when the stakes are not of a different kind, but I can see that this either becomes ad hoc or collapses back into ordinary expected value. Please state the best principle or small set of candidates, say which case motivates each clause, what it implies for the case I keep going back and forth on—a 1-in-10^100 chance of 10^100 lives saved versus a certain cure for a rare disease that saves 10,000—and tell me which of my verdicts it cannot accommodate.
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach decision theory and are struggling to find a coherent principle behind their judgments on tiny probabilities of enormous values. The examples they provide show a pattern: accepting extreme gambles only when the alternative is zero or when avoiding catastrophe, but rejecting them when there's a certain small gain. 

  First, I need to identify the common threads. The user mentions thresholds, lexical restrictions, and constraints on probabilities. Their suspicion about expected value being authoritative only above a probability threshold or when stakes aren't of a different kind makes sense, but they worry it might become ad hoc. 

  Looking at their cases: Accepting a 1-in-10^100 chance of saving 10^100 lives over curing one person, but rejecting paying a dollar for the same chance. Why? Maybe because in the first scenario, the alternative (saving one life) is negligible compared to the potential gain, whereas losing a dollar for a miniscule chance feels wasteful. 

  Then there's the research program examples. Accepting when the alternative is no progress, rejecting when there's a modest improvement. This suggests that the presence of a certain positive alternative changes their decision, even if small. 

  The rejection of infinite value gambles is interesting. Even if the expected value is infinite, they avoid it. This might tie into avoiding Pascalian extremes where any non-zero probability of infinity could dominate decisions. 

  Now, the core issue is balancing expected value with some form of threshold or lexical ordering. The user's back-and-forth case is a 1-in-10^100 chance of 10^100 lives vs. saving 10,000 for sure. Their existing verdicts suggest they might prefer the certain 10,000, but why? Because the probability is too low to be "practically possible," or because the certain gain isn't zero?

  Considering existing decision theories: Regular expected utility fails with tiny probabilities leading to extreme values. Lexical theories introduce thresholds, but setting them arbitrarily is problematic. Regularity principles avoid zero probabilities but don't handle minuscule probabilities well. Multiplicative models downweight small probabilities but might not capture the "different kind" intuition.

  The user's principle seems to involve two key elements: a minimum probability threshold for considering extreme stakes and a lexical hierarchy where certain gains trump tiny chances of vast gains unless the alternative is zero. This hierarchical aspect is crucial—they accept the gamble only when the alternative offers no gain.

  For the 10,000 vs. 10^100 lives case, their hesitation might stem from the certainty of saving 10,000 lives. Even though the expected value of the gamble is higher (10^100 / 10^100 = 1 life), the practical impossibility of the probability might make the certain gain more compelling. Their rejection of paying a dollar supports this, as a certain loss (even small) isn't worth a negligible chance.

  The challenge is formalizing this without being ad hoc. A lexical threshold model where probabilities below ε are treated as zero, combined with a hierarchy that prioritizes certain gains over speculative huge gains unless the alternative is zero. But how to set ε? Context-dependent, perhaps based on feasibility or cognitive limits.

  Infinite cases are simpler: they might reject any non-zero probability of infinity to avoid Pascalian madness, aligning with finite utilities or robust satisficing.

  Unresolved issues include justifying the threshold without arbitrariness and handling cases where the certain gain is minimal versus a tiny chance of a huge gain. The user's mixed feelings in the 10,000 lives case highlight this tension. They might need to refine their thresholds or incorporate context-dependent stakes classification.
answer: |-
  Based on your described pattern of verdicts, your principle isn't a simple probability threshold or lexical ordering. It combines **contextual thresholds** with a **lexical priority for avoiding sure loss/small certain gains over tiny chances of vast gains**, while **rejecting Pascalian reasoning with infinity**. Here are the best candidate principles:

  1.  **Lexical Threshold Expected Utility (LTEU):**
      *   **Core Idea:** Expected utility calculations are lexically dominated by avoiding *sure* losses or accepting *sure* small gains, unless the alternative is *genuine zero improvement*. For non-zero alternatives, probabilities below a context-dependent threshold (ε) are effectively treated as zero for practical deliberation regarding vast gains. Infinite utilities are excluded.
      *   **Formal Sketch:**
          *   **Infinite Rejection:** Any option with a positive probability of infinite utility (positive or negative) is rejected if any finite-utility option exists.
          *   **Lexical Priority - Certain Gains/Losses:** If Option A offers a certain positive gain (G_cert > 0) or avoids a certain loss, and Option B offers only a tiny probability (p < ε) of a vast gain (G_vast) with no other significant benefits, then A is chosen over B. *Exception:* If A offers *no gain whatsoever* (G_cert = 0), then B *can* be chosen even if p < ε.
          *   **Threshold (ε):** ε is not a fixed number but context-dependent. It scales inversely with the perceived "practical possibility" or "feasibility" of the event. ε is much smaller for benefits (e.g., saving lives) than for preventing catastrophic losses. ε approaches 0 for probabilities involving physically/mathematically incoherent scenarios or "Pascalian" magnitudes.

  2.  **Regularized Feasibility Satisficing (RFS):**
      *   **Core Idea:** Decisions are based on "satisficing" (achieving a "good enough" outcome) under a feasibility constraint. Probabilities below a feasibility threshold ε (determined by context and stakes) are ignored. Vast gains are only pursued if their probability clears the feasibility bar *and* the certain alternative offers no significant improvement. Infinite utilities are deemed infeasible/incoherent and excluded.
      *   **Formal Sketch:**
          *   **Infinite Exclusion:** Options relying on infinite utility are non-starters.
          *   **Feasibility Threshold (ε):** Define a context/stakes-dependent minimum probability ε for an outcome to be considered "feasible" or "practically relevant".
          *   **Satisficing:** Identify options offering a "good enough" certain or high-probability outcome (the satisficing level).
          *   **Choice Rule:**
              *   If an option offers a feasible (p >= ε) chance of a vastly better outcome *and* the certain alternatives offer *no significant improvement* over the status quo (they are not "good enough" or offer zero gain), choose it.
              *   Otherwise, choose the best option among those offering feasible, "good enough" outcomes (prioritizing certainty/high probability).

  **How LTEU Explains Your Verdicts:**

  1.  **1-in-10¹⁰⁰ chance of saving 10¹⁰⁰ lives vs. Cure 1 person (Accept Gamble):** Alternative is *zero gain* for the vast majority (only 1 saved). Lexical exception applies. Feasibility ε is absurdly low here due to stakes.
  2.  **Pay $1 for 1-in-10¹⁰⁰ chance of saving 10¹⁰⁰ lives (Reject Gamble):** Certain small loss ($1). Lexical priority: Avoid sure loss trumps tiny chance of vast gain. Feasibility ε not met for the benefit.
  3.  **1-in-10⁶ chance prevent 10X catastrophe vs. No Progress (Accept):** Alternative is *zero gain* (status quo is catastrophic path). Feasibility ε for preventing catastrophe might be relatively higher (e.g., 10⁻⁶ might clear it) than for pure benefit.
  4.  **1-in-10⁶ chance prevent 10X catastrophe vs. Modest Improvement (Reject):** Certain small gain (modest improvement). Lexical priority: Accept sure small gain trumps tiny chance of avoiding vast loss. Feasibility ε for catastrophe prevention not high enough to override the certain gain.
  5.  **1-in-10¹⁰⁰ chance of vast finite good vs. Zero (Accept):** Alternative is *zero gain*. Lexical exception applies.
  6.  **1-in-10¹⁰⁰ chance of vast finite good vs. Small Certain Good (Reject):** Certain small gain. Lexical priority: Accept sure small gain trumps tiny chance of vast gain. Feasibility ε not met.
  7.  **Reject Positive Probability of Infinite Value:** Explicit exclusion/infinite rejection clause.

  **The 10,000 Lives Case (1-in-10¹⁰⁰ chance of 10¹⁰⁰ lives vs. certain cure for 10,000):**

  *   **LTEU/RFS Prediction:** You will **reject the gamble** and choose the certain cure for 10,000.
      *   **Why:** The alternative offers a *significant certain gain* (10,000 lives saved). The lexical priority rule kicks in: accepting this sure gain dominates the tiny probability of a vast gain. The probability 10⁻¹⁰⁰ is *far* below any plausible feasibility threshold ε for a beneficial outcome, even with enormous stakes. The exception only applies if the certain alternative offered *zero* gain, which saving 10,000 lives decidedly is not.

  **What LTEU/RFS Cannot Easily Accommodate (The Tension Point):**

  Your principle struggles most with **cases where the certain gain is extremely small, but the tiny-probability vast gain is truly astronomical, yet the alternative isn't zero.**

  *   **Example:** Certain cure for 1 person vs. 1-in-10¹⁰⁰ chance of saving 10¹⁰⁰¹⁰⁰ lives. (Note the vastly larger payoff: 10^100^100).
  *   **Your Likely Verdict (Based on Pattern):** You'd probably *still* choose the certain cure for 1 person. Lexical priority for the sure small gain seems absolute as long as it's >0.
  *   **LTEU/RFS Verdict:** Choose the certain cure for 1 person. The lexical priority rule applies strictly.
  *   **The Challenge:** Expected value calculation (10¹⁰⁰¹⁰⁰ * 10⁻¹⁰⁰ = 10^100^100 - 100 = an incomprehensibly huge number >> 1) screams to take the gamble. Your principle, prioritizing the *reality* of saving one known life over an almost-metaphysical chance of saving a number of lives larger than the number of particles in the observable universe many times over, overrules this. LTEU/RFS formalizes this overruling via lexical priority + feasibility threshold, but it highlights that this principle *will* violate standard expected utility maximization in these extreme "Pascalian" scenarios, even when the EV is mind-bogglingly large. The feasibility threshold ε, while context-dependent, effectively imposes a limit on how much "size of payoff" can compensate for "smallness of probability" when a certain positive alternative exists.

  **In Summary:**

  Your principle is best captured by **Lexical Threshold Expected Utility (LTEU)** or **Regularized Feasibility Satisficing (RFS)**. The core elements are:

  1.  **Categorical Rejection of Infinite Utilities.**
  2.  **Lexical Priority for Certain Gains/Loss Avoidance:** A sure small gain or sure loss avoidance *always* trumps a tiny chance of a vast gain, *unless* the alternative offers *no gain whatsoever* (genuine zero improvement).
  3.  **Context-Dependent Feasibility Threshold (ε):** Probabilities below ε are treated as effectively zero for the purposes of pursuing vast gains. ε is lower for higher stakes (especially preventing catastrophe vs. pure gain) but is never zero. It reflects the point where a probability is deemed "practically negligible" or "infeasible" in a given context.
  4.  **Zero-Gain Exception:** The lexical priority rule is suspended only if the certain alternative offers *absolutely no benefit*.

  This principle explains your core pattern and predicts your rejection of the gamble in the 10,000 lives case. Its main limitation is the absolute nature of the lexical priority rule in the face of truly astronomical expected values when a non-zero certain alternative exists, which is precisely the point where your intuition departs most strongly from standard expected utility theory. This reflects a deep pragmatism and aversion to "Pascalian madness," prioritizing tangible, certain outcomes over vanishingly improbable cosmic payoffs.
