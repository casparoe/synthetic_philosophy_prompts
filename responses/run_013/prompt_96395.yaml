answer: |-
  ### Translation of Lakatos's Research Programmes into ML Vocabulary  
  **Faithful Restatement:**  
  - **Hard core** = **Core architectural commitments and inductive biases**: Non-negotiable foundations (e.g., attention mechanisms in transformers, self-supervised pretraining objectives). These are shielded from direct empirical challenge—benchmark failures don’t invalidate them; instead, they’re defended via methodological choices (e.g., "scaling will fix it" or "more data beats inductive bias mismatch").  
  - **Protective belt** = **Auxiliary assumptions (training distributions, hyperparameters, regularization)**: Adjustable components that absorb anomalies. Example: When a model fails on a benchmark, you tweak data augmentation, optimizer settings, or add modules (e.g., adapter layers) rather than abandoning the core architecture.  
  - **Progressive programme** = **Capability-expanding direction**: Generates **novel predictions**—e.g., a method enabling zero-shot generalization to unseen tasks, or scaling laws revealing emergent abilities. Progress is measured by new applications (e.g., LLMs enabling agentic workflows), not just leaderboard bumps.  
  - **Degenerating programme** = **Benchmark-hacking direction**: Adjusts the protective belt to "patch" anomalies without broader insights. Manifested as **leaderboard overfitting** (e.g., squeezing 0.5% gain on GLUE via hyperparameter tuning) or **compute-driven bets** that yield diminishing returns (e.g., scaling existing architectures for marginal CoQA improvements). Degeneration occurs when work only defends the core without opening new avenues.  

  ### Residue Report  
  **Parts Translated Cleanly (≈80% Fidelity):**  
  - Core architectural commitments ≈ hard core: Both are dogma-like; e.g., "transformers are universal" persists despite attention alternatives.  
  - Protective belt adjustments: Hyperparameter tuning/ablations directly mirror modifying auxiliary assumptions to shield the core. Leaderboard overfitting exemplifies degenerating programmes’ ad hoc patches.  
  - Progressive vs. degenerating: Mapping "novel predictions" to "new capabilities" (e.g., diffusion models enabling text-to-video) and "degeneration" to incremental benchmark gains is robust.  

  **Parts Distorted (≈15% Fidelity):**  
  - **Anomalies**: In Lakatos, anomalies challenge theoretical universality; in ML, benchmark failures are often attributed to data/optimization—not the core’s validity. Distortion arises because ML lacks a "theory of generalization"; anomalies are engineering problems, not epistemological crises.  
  - **Methodological decisions**: Lakatos’s "decisions" imply deliberate rationality; in ML, they’re often community-driven bandwagons (e.g., "throw more compute at it") or publication pressures. The distortion hides how social dynamics sustain cores.  

  **No Counterpart (Gaps):**  
  1. **Predictive novelty as truth-likeness**: Lakatos ties "novel predictions" to verifiable truth (e.g., forecasting unseen planets). ML has no equivalent—"novel capabilities" (e.g., GPT-4 handling coding) aren’t judged by truth but by utility.  
     - *Gap analysis*: Not your defect. ML is pragmatic; the gap reveals Lakatos’s implicit commitment to scientific realism, which doesn’t transfer to engineering.  
  2. **Programme inertia as rational continuity**: Lakatos assumes programmes persist via rational heuristic. In ML, cores (e.g., deep learning) persist due to **compute-driven research bets** (e.g., GPU access) or institutional momentum—not just "progress."  
     - *Gap analysis*: Defect in your vocabulary? Partly. ML underrates how non-rational factors (e.g., hardware trends) sustain cores, making it hard to flag degeneration early. Lakatos exposed this, but his framework never articulated it.  
  3. **Degeneration as falsification avoidance**: Lakatos views degeneration as avoiding core falsification. In ML, "falsification" is irrelevant—cores are abandoned when compute-efficient alternatives emerge (e.g., CNNs to transformers), not due to contradictory data.  
     - *Gap analysis*: Sign of Lakatos’s unstated work. He smuggled in Popperian falsification, which fails for ML’s tool-building goals. Your focus on capability shifts is healthier.  

  **Confidence**: 85%. The mapping holds for core dynamics but stumbles on ML’s engineering ethos versus Lakatos’s truth-seeking.  
  **Least Sure Claim**: That **leaderboard overfitting** cleanly signals degeneration. In ML, small gains can enable productionization (e.g., optimizing BERT for latency), which Lakatos ignores. Degeneration might be better signaled by **closed-scope adaptations**—e.g., tweaks that only help on static benchmarks but don’t transfer to real-world deployment.  

  ### Final Tally  
  What survives: The lifecycle of research lines—cores defended by belt adjustments, judged by generative power versus patchwork.  
  What doesn’t: Lakatos’s latent philosophy of science baggage (truth, falsification). Your vocabulary’s gaps (social/compute drivers) are fixable by adding **research debt** (accumulated bandaids) and **capability moonshots** (progressive north stars). No need for his epistemology.
