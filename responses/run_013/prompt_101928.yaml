answer: |-
  Here’s a toast built around her core insight, designed for both the experts and the grandchildren, committed to a specific interpretation of her contribution:

  **(Clink glass gently)**  
  Friends, colleagues, family—especially [Grandchildren's Names], who know firsthand how incredible her tomatoes are—tonight we celebrate Dr. [Advisor's Name]. Forty-one years. That’s a lot of grant applications, a lot of students mentored, and I suspect, a lot of tomatoes grown.  

  We’re here because [Advisor's Name] spent her career fascinated by a puzzle: how do traits evolve that seem good for the group, but costly for the individual? Cooperation. Altruism. Restraint. For decades, the dominant answer was powerful, elegant, and centered firmly on the gene or the individual: kin selection, reciprocal altruism – mechanisms showing how what *looks* like group benefit is really just clever accounting for individual advantage. It’s a view that explained so much, so well.  

  But [Advisor's Name] looked at the same world and saw something else. She didn't just *disagree* with that gene’s-eye view; she insisted we were asking the question wrong. She saw a crucial fork in the road that many raced straight past.  

  **Her fundamental insight—the hinge her whole career turned on—was this:** When we ask "What is the *unit of selection*?", we’re actually asking *two* distinct questions, and blurring them causes chaos.  

  1.  **Question One:** *What entity is literally being selected?* What’s the ‘target’? Is selection weeding out *genes*, *individuals*, or whole *groups*?  
  2.  **Question Two:** *What entity is the trait "for"?* Whose survival or reproduction does the trait ultimately function to benefit?  

  The revolution she championed wasn't necessarily that groups *are* the primary target of selection. Her revolutionary point was that **a trait can be *"for" the good of the group* even if selection is primarily acting *on individuals*.**  

  Think of it like her tomatoes. When she carefully prunes a branch (selection acting *on the branch*), she’s doing it *for* the good of the whole plant – so the plant puts its energy into bigger, better fruit. The pruning happens at one level (the branch), but its function, its *purpose* within her garden system, is for the benefit of a higher level (the whole plant).  

  That’s what she saw in evolution. Traits like cooperation or warning calls might be weeded in or out based on individual survival (Question One). But their *evolutionary function*, what they are *ultimately "for"*, can genuinely be the persistence and success of the larger group (Question Two). The gene’s-eye view often explained the *mechanism* of selection (Question One), but it risked explaining *away* the profound reality that the *function* (Question Two) was genuinely collective.  

  **So, what did her career amount to?** It was a lifelong, rigorous argument against a profound *conceptual flattening*. She forced the field—sometimes kicking and screaming—to acknowledge this crucial ambiguity. She didn't just claim group selection was real; she provided the precise conceptual toolkit needed to even *have* a coherent debate about it. She showed that insisting every group-beneficial trait *must* be reducible to individual advantage wasn't just potentially wrong scientifically; it was a *category error*. By separating "selected at" from "selected for," she carved out a legitimate, irreducible space for understanding how group-level benefits can be genuine drivers in evolution, even when the selective mechanism operates elsewhere.  

  That took courage. It took thick skin. It meant arguing with giants whose models dominated textbooks. But she did it because she believed the complexity of life demanded this richer vocabulary. She wasn't just fighting *for* group selection; she was fighting *for* conceptual clarity against a powerful orthodoxy that had collapsed two vital questions into one.  

  [Grandchildren's Names], your grandma is a scientist who spent her life trying to understand how complicated, beautiful things – like ant colonies, or flocks of birds, or even human societies – can come to be. She believed deeply that cooperation and sacrifice for the greater good aren't just illusions; they are real forces woven into the fabric of life, forces that need their own distinct explanation. And she spent her career giving those forces a voice, a language, and a rigorous scientific home.  

  So, to Dr. [Advisor's Name]: Thank you for your clarity, your tenacity, and your unwavering commitment to seeing the whole organism, the whole group, the whole picture – in both your science and your garden. Thank you for teaching us to ask the questions *properly*, even when it was unfashionable. Your legacy isn't just your papers; it's a fundamental shift in how we *think* about evolution. You made the conversation richer, deeper, and far more interesting.  

  **To [Advisor's Name]!**  

  ---

  **Where this Toast Takes Liberties (Your Candid Closing Note - For You, Not Spoken Aloud):**  

  1.  **Defining Her Contribution:** This toast firmly commits to interpreting her primary contribution as **conceptual clarification** (separating "selected at" from "selected for") rather than definitively proving group selection *as the dominant mechanism*. It argues this distinction *is* her key legacy and victory, allowing group-beneficial traits legitimacy. Some colleagues might argue her goal *was* proving group selection as the mechanism, and this toast downplays that ambition in favor of celebrating the conceptual win.  
  2.  **"Mostly Right":** It implicitly suggests she was "mostly right" *about the need for this distinction and the irreducibility of group-level function*, even if specific mechanisms were debated. Opponents might feel this grants her victory on points they still contest.  
  3.  **Simplification:** The tomato metaphor simplifies the complexity of multilevel selection theory. It avoids terms like "emergence," "supervenience," or specific models (e.g., trait-group selection) for accessibility. Experts will know there's more nuance, but the core point about levels of function vs. selection stands.  
  4.  **Tone:** It frames the debate as her fighting for clarity against a powerful ("kicking and screaming") orthodoxy. This is sympathetic to her perspective; critics might feel their valid scientific counter-arguments are portrayed as mere resistance.  

  **Why this commitment works:** It centers her unique intellectual insight, honors her persistence, provides a defensible "win" (conceptual clarity) without claiming the entire empirical debate is settled her way, uses an accessible metaphor grounded in her personal life (tomatoes), and speaks meaningfully to both audiences. You stand firm on the value of her core idea without pretending unanimity on every point.
