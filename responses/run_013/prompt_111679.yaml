answer: |-
  ### Exam Question: Order-Dependence in Jeffrey Conditionalisation  
  **Module:** Graduate Bayesian Epistemology  
  **Time Allowed:** 45 minutes  
  **Instructions:** Answer all parts of this question. Show all working and reasoning. Round final probabilities to three decimal places. Use British English spelling and idiom.  

  ---

  #### Background  
  An agent’s initial joint credences over propositions \(A\) and \(B\) are:  
  - \(P_0(A \wedge B) = 0.2\)  
  - \(P_0(A \wedge \neg B) = 0.1\)  
  - \(P_0(\neg A \wedge B) = 0.3\)  
  - \(P_0(\neg A \wedge \neg B) = 0.4\)  

  The agent receives two pieces of *uncertain evidence*:  
  1. Evidence bearing directly on \(A\) that changes her credence in \(A\) to \(0.9\).  
  2. Evidence bearing directly on \(B\) that changes her credence in \(B\) to \(0.9\).  

  Both updates must be processed via **Jeffrey conditionalisation** (probability kinematics), *not* strict conditionalisation. Jeffrey conditionalisation updates a credence function by holding fixed conditional probabilities relative to a partition. For a partition \(\{E_i\}\) and new probabilities \(P_{\text{new}}(E_i)\), the rule is:  
  \[
  P_{\text{new}}(X) = \sum_i P_{\text{new}}(E_i) \cdot P_{\text{old}}(X \mid E_i).
  \]  

  #### Tasks  
  1. **Update Order 1 (A first, then B):**  
     (a) Compute the agent’s joint credences after updating on \(A\) to \(P(A) = 0.9\).  
     (b) Using the result from (a) as the prior, compute the joint credences after updating on \(B\) to \(P(B) = 0.9\).  
     Label these final credences \(P_2(A \wedge B)\), \(P_2(A \wedge \neg B)\), \(P_2(\neg A \wedge B)\), \(P_2(\neg A \wedge \neg B)\).  

  2. **Update Order 2 (B first, then A):**  
     (a) Compute the agent’s joint credences after updating on \(B\) to \(P(B) = 0.9\).  
     (b) Using the result from (a) as the prior, compute the joint credences after updating on \(A\) to \(P(A) = 0.9\).  
     Label these final credences \(Q_2(A \wedge B)\), \(Q_2(A \wedge \neg B)\), \(Q_2(\neg A \wedge B)\), \(Q_2(\neg A \wedge \neg B)\).  

  3. **Comparison:**  
     Present the two final joint distributions (from 1b and 2b) in a table. Briefly state whether they agree.  

  4. **Discussion:**  
     Explain why the two orders produce different results. What does this reveal about Jeffrey conditionalisation? Specifically:  
     - Why do the two marginal constraints (\(P(A) = 0.9\), \(P(B) = 0.9\)) fail to determine a unique joint distribution?  
     - How does this contrast with strict conditionalisation (where evidence makes a proposition certain)?  
     - Is this order-dependence a defect in Jeffrey conditionalisation? Can a defender of the rule plausibly respond?  
     (Limit: 400 words.)  

  ---

  ### Model Answer  
  **1. Update Order 1 (A first, then B)**  
  **(a) Update on A to \(P(A) = 0.9\):**  
  Jeffrey conditionalisation fixes conditionals given \(A\) and \(\neg A\). Initial probabilities:  
  - \(P_0(B \mid A) = \frac{P_0(A \wedge B)}{P_0(A)} = \frac{0.2}{0.3} \approx 0.667\),  
  - \(P_0(\neg B \mid A) = \frac{0.1}{0.3} \approx 0.333\),  
  - \(P_0(B \mid \neg A) = \frac{0.3}{0.7} \approx 0.429\),  
  - \(P_0(\neg B \mid \neg A) = \frac{0.4}{0.7} \approx 0.571\).  

  After update: \(P_1(A) = 0.9\), \(P_1(\neg A) = 0.1\).  
  - \(P_1(A \wedge B) = P_1(A) \cdot P_0(B \mid A) = 0.9 \times 0.667 = 0.600\),  
  - \(P_1(A \wedge \neg B) = P_1(A) \cdot P_0(\neg B \mid A) = 0.9 \times 0.333 = 0.300\),  
  - \(P_1(\neg A \wedge B) = P_1(\neg A) \cdot P_0(B \mid \neg A) = 0.1 \times 0.429 = 0.043\),  
  - \(P_1(\neg A \wedge \neg B) = P_1(\neg A) \cdot P_0(\neg B \mid \neg A) = 0.1 \times 0.571 = 0.057\).  

  **(b) Update on B to \(P(B) = 0.9\) (using \(P_1\)):**  
  Fix conditionals given \(B\) and \(\neg B\) under \(P_1\):  
  - \(P_1(B) = 0.600 + 0.043 = 0.643\),  
  - \(P_1(\neg B) = 0.300 + 0.057 = 0.357\),  
  - \(P_1(A \mid B) = \frac{P_1(A \wedge B)}{P_1(B)} = \frac{0.600}{0.643} \approx 0.933\),  
  - \(P_1(\neg A \mid B) = \frac{0.043}{0.643} \approx 0.067\),  
  - \(P_1(A \mid \neg B) = \frac{0.300}{0.357} \approx 0.840\),  
  - \(P_1(\neg A \mid \neg B) = \frac{0.057}{0.357} \approx 0.160\).  

  After update: \(P_2(B) = 0.9\), \(P_2(\neg B) = 0.1\).  
  - \(P_2(A \wedge B) = P_2(B) \cdot P_1(A \mid B) = 0.9 \times 0.933 = 0.840\),  
  - \(P_2(\neg A \wedge B) = P_2(B) \cdot P_1(\neg A \mid B) = 0.9 \times 0.067 = 0.060\),  
  - \(P_2(A \wedge \neg B) = P_2(\neg B) \cdot P_1(A \mid \neg B) = 0.1 \times 0.840 = 0.084\),  
  - \(P_2(\neg A \wedge \neg B) = P_2(\neg B) \cdot P_1(\neg A \mid \neg B) = 0.1 \times 0.160 = 0.016\).  

  **2. Update Order 2 (B first, then A)**  
  **(a) Update on B to \(P(B) = 0.9\):**  
  Fix conditionals given \(B\) and \(\neg B\). Initial probabilities:  
  - \(P_0(A \mid B) = \frac{0.2}{0.5} = 0.400\),  
  - \(P_0(\neg A \mid B) = \frac{0.3}{0.5} = 0.600\),  
  - \(P_0(A \mid \neg B) = \frac{0.1}{0.5} = 0.200\),  
  - \(P_0(\neg A \mid \neg B) = \frac{0.4}{0.5} = 0.800\).  

  After update: \(Q_1(B) = 0.9\), \(Q_1(\neg B) = 0.1\).  
  - \(Q_1(A \wedge B) = Q_1(B) \cdot P_0(A \mid B) = 0.9 \times 0.400 = 0.360\),  
  - \(Q_1(\neg A \wedge B) = Q_1(B) \cdot P_0(\neg A \mid B) = 0.9 \times 0.600 = 0.540\),  
  - \(Q_1(A \wedge \neg B) = Q_1(\neg B) \cdot P_0(A \mid \neg B) = 0.1 \times 0.200 = 0.020\),  
  - \(Q_1(\neg A \wedge \neg B) = Q_1(\neg B) \cdot P_0(\neg A \mid \neg B) = 0.1 \times 0.800 = 0.080\).  

  **(b) Update on A to \(P(A) = 0.9\) (using \(Q_1\)):**  
  Fix conditionals given \(A\) and \(\neg A\) under \(Q_1\):  
  - \(Q_1(A) = 0.360 + 0.020 = 0.380\),  
  - \(Q_1(\neg A) = 0.540 + 0.080 = 0.620\),  
  - \(Q_1(B \mid A) = \frac{0.360}{0.380} \approx 0.947\),  
  - \(Q_1(\neg B \mid A) = \frac{0.020}{0.380} \approx 0.053\),  
  - \(Q_1(B \mid \neg A) = \frac{0.540}{0.620} \approx 0.871\),  
  - \(Q_1(\neg B \mid \neg A) = \frac{0.080}{0.620} \approx 0.129\).  

  After update: \(Q_2(A) = 0.9\), \(Q_2(\neg A) = 0.1\).  
  - \(Q_2(A \wedge B) = Q_2(A) \cdot Q_1(B \mid A) = 0.9 \times 0.947 = 0.852\),  
  - \(Q_2(A \wedge \neg B) = Q_2(A) \cdot Q_1(\neg B \mid A) = 0.9 \times 0.053 = 0.048\),  
  - \(Q_2(\neg A \wedge B) = Q_2(\neg A) \cdot Q_1(B \mid \neg A) = 0.1 \times 0.871 = 0.087\),  
  - \(Q_2(\neg A \wedge \neg B) = Q_2(\neg A) \cdot Q_1(\neg B \mid \neg A) = 0.1 \times 0.129 = 0.013\).  

  **3. Comparison**  
  | **Joint Event**       | **Order A→B** (\(P_2\)) | **Order B→A** (\(Q_2\)) |  
  |-----------------------|-------------------------|-------------------------|  
  | \(A \wedge B\)        | 0.840                   | 0.852                   |  
  | \(A \wedge \neg B\)   | 0.084                   | 0.048                   |  
  | \(\neg A \wedge B\)   | 0.060                   | 0.087                   |  
  | \(\neg A \wedge \neg B\) | 0.016                   | 0.013                   |  
  The final distributions differ. For example, \(P_2(\neg A \wedge B) = 0.060\) but \(Q_2(\neg A \wedge B) = 0.087\).  

  **4. Discussion**  
  The order-dependence arises because Jeffrey conditionalisation preserves *conditional probabilities relative to the partition being updated*. When updating \(A\) first, we fix \(P(B \mid A)\) and \(P(B \mid \neg A)\), altering the correlation between \(A\) and \(B\). Subsequent updating on \(B\) uses these new conditionals. Conversely, updating \(B\) first fixes \(P(A \mid B)\) and \(P(A \mid \neg B)\), changing the correlation differently. Since \(A\) and \(B\) are not independent, the preserved conditionals diverge across orders.  

  This reveals that Jeffrey conditionalisation does not uniquely determine a joint distribution from marginal constraints alone. Specifying \(P(A)=0.9\) and \(P(B)=0.9\) leaves the joint underdetermined; the rule resolves ambiguity by assuming rigidity of conditionals for the *updated partition*, but this assumption depends on the update path. In strict conditionalisation, order is irrelevant because becoming certain of \(A\) or \(B\) collapses the joint via conditional probabilities that commute (e.g., \(P_{\text{new}}(X) = P_{\text{old}}(X \mid A)\)).  

  The discrepancy is not a fatal flaw but highlights a feature of uncertain evidence: the *meaning* of evidence about \(B\) may depend on prior beliefs about \(A\). A defender can argue that evidence is processed sequentially in time, so order reflects the agent’s epistemic trajectory. However, it necessitates caution—updating on a common refinement (e.g., all conjunctions) would avoid order-dependence but requires stronger constraints. While Jeffrey conditionalisation remains useful for uncertain evidence, users must recognise that order encodes implicit assumptions about conditional independencies.  

