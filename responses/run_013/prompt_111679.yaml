prompt: |-
  I teach the graduate Bayesian epistemology seminar in our department (philosophy, though a couple of the students drift in from stats) and I'm putting together this year's take-home paper. I want one long question that forces them to actually turn the crank instead of reciting the usual posterior-is-proportional-to-prior-times-likelihood line, which they can all do half-asleep. The setup I've landed on: an agent's credences over two propositions A and B start at P(A and B) = 0.2, P(A and not-B) = 0.1, P(not-A and B) = 0.3, P(not-A and not-B) = 0.4. She then recieves uncertain evidence bearing on A that moves her credence in A to 0.9, and later receives uncertain evidence bearing on B that moves her credence in B to 0.9. Both bits of evidence are to be processed by Jeffrey conditionalisation (probability kinematics), not by strict conditionalisation, since in neither case does she become certain of anything.

  What I want the question to make them do is work out what the agent's final credences come to under the two possible orderings — A's evidence first then B's, and B's evidence first then A's — and then sit with the awkward discovery that the two orderings don't agree. I've checked the numbers myself so I know there's a real discrepancy and not just rounding noise, and I'd like them to report the final joint distributions side by side so the disagreement is staring them in the face. The crux I'm really after is *why* the order matters and what that shows. My own view is that the tidy move of just doing a single Jeffrey update on the four-cell common refinement, specifying the two marginals, doesn't actually pin anything down, because those two marginal constraints leave the joint underdetermined, and that some hidden rigidity or independence assumption is quietly doing the work whenever people think they've got a unique answer. I'd like them to say whether this is a genuine defect in the rule or whether a defender can shrug it off, and to contrast it with the strict-conditionalisation case, where the order of updating on certainties obviously makes no difference. Whether the discrepancy should push us to give up on updating on uncertain evidence altogether, or just make us more careful about what the later evidence means once the earlier evidence has been absorbed, is the sort of thing I'd want a strong answer to take a view on.

  So please write me the exam question itself (graduate level, roughly 45 minutes of the paper), a model answer of about 600-700 words, and a marking scheme worth 20 marks that names the specific moves a first-class answer has to make and the specific mistakes that should cost marks — and for each must-hit point, a line on how students typically get it wrong. Spelling and idiom in British English please, since that's what the cohort writes in. No need to cite any papers or textbooks; it's closed-book and I don't want them thinking a bibliography is what earns the marks.
reasoning: |-
  We are going to design a graduate-level exam question on Bayesian epistemology, focusing on Jeffrey conditionalization and the order-dependence of updates. The scenario involves an agent updating on uncertain evidence for two propositions A and B in different orders, leading to different final credences. The question should force students to compute the updates step by step and then reflect on the implications.

  The initial credences are:
  - P(A ∧ B) = 0.2
  - P(A ∧ ¬B) = 0.1
  - P(¬A ∧ B) = 0.3
  - P(¬A ∧ ¬B) = 0.4

  First update: uncertain evidence that moves credence in A to 0.9 (via Jeffrey conditionalization).
  Second update: uncertain evidence that moves credence in B to 0.9 (via Jeffrey conditionalization).

  And then the reverse order: first update B to 0.9, then A to 0.9.

  We require the students to compute the final joint distributions for both orders and then discuss why the order matters and what this implies about Jeffrey conditionalization.

  Let's write the exam question.

  ---

  **Exam Question: Order-Dependence in Jeffrey Conditionalization**

  **Background:** Recall that Jeffrey conditionalization (also known as probability kinematics) allows an agent to update their credences when new evidence does not make any proposition certain. Instead, the evidence directly specifies a new probability distribution over a partition. In this problem, we consider two propositions A and B, and the agent receives two pieces of uncertain evidence: one that sets the probability of A to 0.9 (without affecting the probabilities conditional on A or conditional on ¬A, in a way that we will make precise), and another that sets the probability of B to 0.9.

  **Initial Credences:** An agent has the following initial joint credences over A and B:
  - \( P_0(A \wedge B) = 0.2 \)
  - \( P_0(A \wedge \neg B) = 0.1 \)
  - \( P_0(\neg A \wedge B) = 0.3 \)
  - \( P_0(\neg A \wedge \neg B) = 0.4 \)

  **Evidence:** The agent first receives evidence that directly changes her credence in A to 0.9. This is to be processed by Jeffrey conditionalization. Subsequently, she receives evidence that directly changes her credence in B to 0.9 (again via Jeffrey conditionalization). We denote the partition for the first update as \(\{A, \neg A\}\) and for the second update as \(\{B, \neg B\}\).

  **The Rule for Jeffrey Conditionalization:** When updating on a partition \(\{E_i\}\) with new probabilities \(P_{new}(E_i)\), the update rule is:
  \[
  P_{new}(X) = \sum_i P_{new}(E_i) \cdot P_{old}(X \mid E_i)
  \]
  Note that the conditional probabilities \(P_{old}(X \mid E_i)\) are held fixed.

  **Your Tasks:**

  1. **First Order (A then B):** 
     - (a) Compute the agent's credences after the first update (on A). Specifically, compute \(P_1(A \wedge B)\), \(P_1(A \wedge \neg B)\), \(P_1(\neg A \wedge B)\), and \(P_1(\neg A \wedge \neg B)\).
     - (b) Then, using the posterior distribution from (a) as the prior for the next update, compute the agent's credences after the second update (on B). That is, compute \(P_2(A \wedge B)\), \(P_2(A \wedge \neg B)\), \(P_2(\neg A \wedge B)\), and \(P_2(\neg A \wedge \neg B)\).

  2. **Second Order (B then A):**
     - (a) Compute the agent's credences after the first update (on B). Specifically, compute \(Q_1(A \wedge B)\), \(Q_1(A \wedge \neg B)\), \(Q_1(\neg A \wedge B)\), and \(Q_1(\neg A \wedge \neg B)\).
     - (b) Then, using the posterior distribution from (a) as the prior for the next update, compute the agent's credences after the second update (on A). That is, compute \(Q_2(A \wedge B)\), \(Q_2(A \wedge \neg B)\), \(Q_2(\neg A \wedge B)\), and \(Q_2(\neg A \wedge \neg B)\).

  3. **Comparison:** Present the two final joint distributions (from 1b and 2b) side by side. Highlight the differences.

  4. **Discussion:** 
     - Explain why the two orders of updating lead to different results. What does this reveal about Jeffrey conditionalization? 
     - In particular, discuss whether the two marginal constraints (P(A)=0.9 and P(B)=0.9) uniquely determine the joint distribution. If not, what additional assumptions are typically made, and how do the two updating paths reflect different such assumptions?
     - Contrast this with what would happen if the updates were done by strict conditionalization (i.e., becoming certain of some proposition). Why does order not matter in that case?
     - Finally, offer a considered view: Is this order-dependence a fatal flaw in Jeffrey conditionalization? Or can it be defended? Should we be more careful about how we interpret uncertain evidence? (Approx. 400 words for the discussion.)

  **Instructions:** Show all your calculations. Round your final answers to three decimal places. The discussion should be clear and concise, demonstrating your understanding of the conceptual issues.

  ---

  **Model Answer (600-700 words):**

  **Part 1: First Order (A then B)**

  (a) First update: Jeffrey update to set P(A) = 0.9.

  We hold fixed the conditional probabilities given A and given ¬A.

  Initial conditionals:

  - \( P_0(B | A) = \frac{P_0(A \wedge B)}{P_0(A)} = \frac{0.2}{0.2+0.1} = \frac{0.2}{0.3} \approx 0.6667 \)
  - \( P_0(\neg B | A) = \frac{0.1}{0.3} \approx 0.3333 \)
  - \( P_0(B | \neg A) = \frac{0.3}{0.3+0.4} = \frac{0.3}{0.7} \approx 0.4286 \)
  - \( P_0(\neg B | \neg A) = \frac{0.4}{0.7} \approx 0.5714 \)

  After updating P(A) to 0.9 (so P(¬A)=0.1):

  - \( P_1(A \wedge B) = P_1(A) \cdot P_0(B | A) = 0.9 \times \frac{0.2}{0.3} = 0.9 \times \frac{2}{3} \approx 0.9 \times 0.6667 = 0.6000 \)
  - \( P_1(A \wedge \neg B) = P_1(A) \cdot P_0(\neg B | A) = 0.9 \times \frac{0.1}{0.3} = 0.9 \times \frac{1}{3} \approx 0.9 \times 0.3333 = 0.3000 \)
  - \( P_1(\neg A \wedge B) = P_1(\neg A) \cdot P_0(B | \neg A) = 0.1 \times \frac{0.3}{0.7} \approx 0.1 \times 0.4286 = 0.0429 \)
  - \( P_1(\neg A \wedge \neg B) = P_1(\neg A) \cdot P_0(\neg B | \neg A) = 0.1 \times \frac{0.4}{0.7} \approx 0.1 \times 0.5714 = 0.0571 \)

  So after the first update (on A):
  - \( P_1(A \wedge B) = 0.6000 \)
  - \( P_1(A \wedge \neg B) = 0.3000 \)
  - \( P_1(\neg A \wedge B) \approx 0.0429 \)
  - \( P_1(\neg A \wedge \neg B) \approx 0.0571 \)

  Check: 0.6000 + 0.3000 + 0.0429 + 0.0571 = 1.0000.

  (b) Second update: Jeffrey update to set P(B) = 0.9, using \(P_1\) as the prior.

  We now hold fixed the conditional probabilities given B and given ¬B from \(P_1\).

  First, compute the current probabilities for B and ¬B under \(P_1\):

  - \( P_1(B) = P_1(A \wedge B) + P_1(\neg A \wedge B) = 0.6000 + 0.0429 = 0.6429 \)
  - \( P_1(\neg B) = 0.3000 + 0.0571 = 0.3571 \)

  Conditional probabilities under \(P_1\):

  - \( P_1(A | B) = \frac{P_1(A \wedge B)}{P_1(B)} = \frac{0.6000}{0.6429} \approx 0.9333 \)
  - \( P_1(\neg A | B) = \frac{0.0429}{0.6429} \approx 0.0667 \)
  - \( P_1(A | \neg B) = \frac{0.3000}{0.3571} \approx 0.8400 \)
  - \( P_1(\neg A | \neg B) = \frac{0.0571}{0.3571} \approx 0.1600 \)

  Now update to set P(B)=0.9 (so P(¬B)=0.1). We hold the above conditionals fixed.

  - \( P_2(A \wedge B) = P_2(B) \cdot P_1(A | B) = 0.9 \times 0.9333 \approx 0.8400 \)
  - \( P_2(\neg A \wedge B) = P_2(B) \cdot P_1(\neg A | B) = 0.9 \times 0.0667 \approx 0.0600 \)
  - \( P_2(A \wedge \neg B) = P_2(\neg B) \cdot P_1(A | \neg B) = 0.1 \times 0.8400 = 0.0840 \)
  - \( P_2(\neg A \wedge \neg B) = P_2(\neg B) \cdot P_1(\neg A | \neg B) = 0.1 \times 0.1600 = 0.0160 \)

  So after the second update (on B) in the A-then-B order:
  - \( P_2(A \wedge B) \approx 0.8400 \)
  - \( P_2(A \wedge \neg B) \approx 0.0840 \)
  - \( P_2(\neg A \wedge B) \approx 0.0600 \)
  - \( P_2(\neg A \wedge \neg B) \approx 0.0160 \)

  **Part 2: Second Order (B then A)**

  (a) First update: Jeffrey update to set P(B) = 0.9.

  Initial conditionals:

  - \( P_0(A | B) = \frac{P_0(A \wedge B)}{P_0(B)} = \frac{0.2}{0.2+0.3} = \frac{0.2}{0.5} = 0.4 \)
  - \( P_0(\neg A | B) = \frac{0.3}{0.5} = 0.6 \)
  - \( P_0(A | \neg B) = \frac{0.1}{0.1+0.4} = \frac{0.1}{0.5} = 0.2 \)
  - \( P_0(\neg A | \neg B) = \frac{0.4}{0.5} = 0.8 \)

  After updating P(B) to 0.9 (so P(¬B)=0.1):

  - \( Q_1(A \wedge B) = Q_1(B) \cdot P_0(A | B) = 0.9 \times 0.4 = 0.36 \)
  - \( Q_1(\neg A \wedge B) = 0.9 \times 0.6 = 0.54 \)
  - \( Q_1(A \wedge \neg B) = Q_1(\neg B) \cdot P_0(A | \neg B) = 0.1 \times 0.2 = 0.02 \)
  - \( Q_1(\neg A \wedge \neg B) = 0.1 \times 0.8 = 0.08 \)

  So after the first update (on B):
  - \( Q_1(A \wedge B) = 0.36 \)
  - \( Q_1(A \wedge \neg B) = 0.02 \)
  - \( Q_1(\neg A \wedge B) = 0.54 \)
  - \( Q_1(\neg A \wedge \neg B) = 0.08 \)

  (b) Second update: Jeffrey update to set P(A)=0.9, using \(Q_1\) as the prior.

  Compute current probabilities for A and ¬A under \(Q_1\):

  - \( Q_1(A) = Q_1(A \wedge B) + Q_1(A \wedge \neg B) = 0.36 + 0.02 = 0.38 \)
  - \( Q_1(\neg A) = 0.54 + 0.08 = 0.62 \)

  Conditional probabilities under \(Q_1\):

  - \( Q_1(B | A) = \frac{Q_1(A \wedge B)}{Q_1(A)} = \frac{0.36}{0.38} \approx 0.9474 \)
  - \( Q_1(\neg B | A) = \frac{0.02}{0.38} \approx 0.0526 \)
  - \( Q_1(B | \neg A) = \frac{0.54}{0.62} \approx 0.8710 \)
  - \( Q_1(\neg B | \neg A) = \frac{0.08}{0.62} \approx 0.1290 \)

  Now update to set P(A)=0.9 (so P(¬A)=0.1), holding these conditionals fixed.

  - \( Q_2(A \wedge B) = Q_2(A) \cdot Q_1(B | A) = 0.9 \times 0.9474 \approx 0.8527 \)
  - \( Q_2(A \wedge \neg B) = 0.9 \times 0.0526 \approx 0.0473 \)
  - \( Q_2(\neg A \wedge B) = Q_2(\neg A) \cdot Q_1(B | \neg A) = 0.1 \times 0.8710 \approx 0.0871 \)
  - \( Q_2(\neg A \wedge \neg B) = 0.1 \times 0.1290 \approx 0.0129 \)

  So after the second update (on A) in the B-then-A order:
  - \( Q_2(A \wedge B) \approx 0.8527 \)
  - \( Q_2(A \wedge \neg B) \approx 0.0473 \)
  - \( Q_2(\neg A \wedge B) \approx 0.0871 \)
  - \( Q_2(\neg A \wedge \neg B) \approx 0.0129 \)

  **Part 3: Comparison**

  Final joint distributions:

  **Order A then B:**
  - P(A ∧ B) ≈ 0.8400
  - P(A ∧ ¬B) ≈ 0.0840
  - P(¬A ∧ B) ≈ 0.0600
  - P(¬A ∧ ¬B) ≈ 0.0160

  **Order B then A:**
  - Q(A ∧ B) ≈ 0.8527
  - Q(A ∧ ¬B) ≈ 0.0473
  - Q(¬A ∧ B) ≈ 0.0871
  - Q(¬A ∧ ¬B) ≈ 0.0129

  The two distributions are clearly different. For example, P(A ∧ B) is 0.8400 in the first order and 0.8527 in the second, and P(¬A ∧ B) is 0.0600 vs. 0.0871.

  **Part 4: Discussion**

  The discrepancy arises because Jeffrey conditionalization preserves conditional probabilities relative to the partition on which the update is performed. When we update on A first, we fix the conditional probabilities given A and ¬A. This affects the probabilities of B and ¬B because A and B are not independent. Then, when we update on B, we fix conditionals given B and ¬B, but these conditionals are different from the initial ones because the first update changed the relationship between A and B. Similarly, when updating on B first, we fix conditionals given B and ¬B, and then update on A using the changed conditionals.

  This reveals that Jeffrey conditionalization is order-dependent. The two marginal constraints (P(A)=0.9 and P(B)=0.9) do not uniquely determine the joint distribution. The joint distribution requires more structure, such as the conditional probabilities. The updating path imposes a particular way of preserving conditionals: in the first update, the conditionals of everything else given the partition being updated are held fixed. The two orders preserve different conditionals, leading to different joints.

  In strict conditionalization, when evidence makes a proposition certain, we set its probability to 1 and condition on it. Order does not matter because once a proposition is set to 1, it remains 1 and the updates commute. Moreover, strict conditionalization is a special case of Jeffrey conditionalization where one partition element gets probability 1 and the others 0.

  The order-dependence is not necessarily a fatal flaw. It reflects that evidence about A and evidence about B might interact, and the order of processing may matter. A defender might argue that the order of receiving evidence is part of the agent's epistemic state and that the rule appropriately reflects how the agent incorporates the evidence in sequence. However, it does highlight that Jeffrey conditionalization requires a choice of partition and order. The rule is underdetermined when we wish to update on multiple partitions: we must specify the order.

  This suggests that when we have multiple pieces of uncertain evidence, we should consider the joint effect. But Jeffrey conditionalization does not provide a direct way to update on both at once. Some have proposed extending the rule to update on a common refinement, but in this case, the common refinement is the four-cell partition. However, setting P(A)=0.9 and P(B)=0.9 does not determine the joint over the four cells. To pin it down, we need more, such as an assumption of independence or the preservation of specific conditionals.

  In practice, we must be cautious: the meaning of the later evidence might depend on the state of belief after the earlier update. The discrepancy should not push us to abandon updating on uncertain evidence, but it does require us to model the evidence carefully and to recognise that order might matter. It also suggests that the agent should consider the evidence as a whole when possible.

  ---

  **Marking Scheme (20 marks total):**

  **Part 1: A then B (4 marks)**
  - (a) First update on A: 2 marks
    - Correct computation of all four joint probabilities after updating A (1 mark for method, 1 mark for correct numbers)
    - Common mistake: Forgetting to hold conditionals fixed and instead trying to set the marginals without recalculating conditionals.
  - (b) Second update on B: 2 marks
    - Correct computation of the four joint probabilities after updating B (1 mark for method, 1 mark for correct numbers)
    - Common mistake: Using the initial conditionals instead of the updated ones for the second update.

  **Part 2: B then A (4 marks)**
