prompt: |-
  Two friends of mine, Dana and Marcus, got into it at a café the other night over a case from a podcast, and I couldn't referee it. Here's the case they were fighting about: a woman promised her kid months ago that she'd take him to the state championship game he's been dying to see, and she also promised her oldest friend that she'd be a pallbearer at the friend's dad's funeral. Then the funeral gets moved and it lands on the same day as the game, and neither thing can be rescheduled. She can only do one. Dana says this is a genuine moral dilemma: she made two real promises, and whichever one she breaks she's doing something she genuinely shouldn't. Marcus says it's not a dilemma at all, just a hard choice — one obligation (the funeral, he figures) simply outweighs the other, so all things considered she ought to go to the funeral and that's that; feeling torn doesn't turn a hard call into a dilemma. Dana comes back: if the heavier obligation just cancels the lighter one, then the promise to her kid was never really an obligation, but it was — she promised. Either promises create obligations that don't get erased by weight, in which case she really has two obligations and has to violate one, or "promise" is just a word for how much something weighs and does no work of its own. And if the two things aren't even comparable, there's no fact about which is heavier, so Marcus can't just assert she ought to do the funeral. Marcus says: for a genuine dilemma you'd need it to be true that she ought to do both — but she can't, and ought can't require the impossible, and if you let oughts pile up you get "she ought to do both," which is exactly that impossibility. So there's no genuine dilemma; at most she doesn't know which one wins, and that's a problem with her, not with morality. Dana fires back: that just shows you should drop the rule that "ought to do A and ought to do B" adds up to "ought to do A and B" when they can't both be done — that rule is the thing to give up, not the dilemma. And the "she just doesn't know" point cuts the other way: Marcus is assuming there's a determinate amount of weight on each side, but if these two values can't be ranked against each other, then there's no fact of the matter about which wins, which is a real conflict and not just ignorance. They asked me to referee and I honestly could'nt. Can you go through the exchange and tell me who's right at each step, not just who wins overall? Also tell me what each of them is missing. Give it to me as a numbered list of exactly five items, one per move in order, each a sentence or two, no intro and no conclusion.
