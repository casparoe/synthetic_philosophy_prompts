answer: |-
  ### Decision Tree: Theories of Punishment  
  *Start:* **The state may deliberately make a wrongdoer suffer.**  

  #### Question 1: Is the justification primarily **backward-looking** (focused on desert) or **forward-looking** (focused on effects)?  
  - **Backward-looking** (desert-based) → Go to Q2.  
  - **Forward-looking** (effects-based) → Go to Q5.  

  ---

  #### **Backward Branch**  
  **Question 2: Is desert alone sufficient to justify punishment?**  
  - **Yes** → Go to Q3.  
  - **No** (desert only sets limits; a further justification is needed) → **Limiting/negative retributivism**  
    - *Most awkward commitment:* Punishing *less* than deserved may be permitted if it achieves social goods, undermining "pure" desert.  

  **Question 3: What is the justifying good?**  
  - **The suffering itself** → Go to Q4.  
  - **The censure expressed by suffering** → **Expressivist/communicative theory**  
    - *Most awkward commitment:* Suffering is merely symbolic; if censure could occur without suffering (e.g., via a stern lecture), punishment loses its core justification.  

  **Question 4: Why is the offender deserving?**  
  - **He forfeited his right not to suffer** → **Self-defence/forfeiture theory**  
    - *Most awkward commitment:* The state’s role mirrors private self-defence, potentially justifying excessive force if "necessary" for societal protection.  
  - **He took unfair advantage of others’ compliance** → **Fair-play theory**  
    - *Most awkward commitment:* Punishing non-cooperative beneficiaries (e.g., the very poor) may be unjust, as they gain no "advantage" from others’ compliance.  

  ---

  #### **Forward Branch**  
  **Question 5: What is the primary aim?**  
  - **Change the offender** → **Rehabilitation**  
    - *Most awkward commitment:* Indeterminate sentences (e.g., "until reformed"), risking disproportionate or indefinite detention.  
  - **Frighten others or the offender** → Go to Q6.  
  - **Remove capacity to reoffend** → **Quarantine/incapacitation**  
    - *Most awkward commitment:* Detaining the "dangerous" without trial, akin to quarantining disease carriers, regardless of moral blame.  

  **Question 6: Is punishment justified by its individual act or by a rule?**  
  - **Individual act** (if net benefits outweigh costs) → **Act-utilitarian deterrence**  
    - *Most awkward commitment:* Punishing the innocent when it deters more crime than it causes suffering.  
  - **Rule** (follow principles that maximise good outcomes) → **Rule-utilitarian**  
    - *Most awkward commitment:* Upholding inefficient rules (e.g., "never punish innocents") even when breaking them *would* maximise utility in a specific case.  

  ---

  ### Notes  
  #### **Unoccupied Combinations & Why**  
  1. **Desert sufficient + Forward-looking primary aim:**  
     - *Incoherent.* If desert alone justifies punishment, adding forward aims as *necessary* contradicts sufficiency.  
  2. **Desert as cap + Suffering as intrinsic good:**  
     - *Unattractive.* If desert only sets limits, treating suffering as intrinsically valuable risks exceeding those limits.  
  3. **Fair-play + Forfeiture:**  
     - *Unexplored.* No major theory blends "unfair advantage" with "forfeited rights"; they offer distinct accounts of desert.  

  #### **Indistinguishable Leaves**  
  The tree **cannot separate**:  
  1. **Rule-utilitarianism vs. Limiting retributivism** when desert caps align with utility-maximising rules.  
     - *Why:* Both permit punishment within desert-derived bounds for social goods. The tree relies on Q1 (backward/forward) to split them, but hybrid theories blur this.  
  2. **Expressivism vs. Rehabilitation** if censure aims to reform.  
     - *Why:* Both prioritise communication (censure/reform message). The tree uses Q2 (desert sufficiency) to divide them, but expressivists sometimes appeal to reform effects.  

  #### **Clarifications**  
  - **British English:** "Prioritise," "censure," "offender" (not "offense"), "whilst" (where applicable).  
  - **Tree Logic:** Questions avoid jargon (e.g., "unfair advantage" not "free-rider problem"). Awkward commitments highlight tensions, not refutations.  
  - **Fit:** Designed for one A4 page; branches prioritise core distinctions.  

  ---  
  *Use this tree to challenge reductive "retributivist vs. consequentialist" binaries. Some theories straddle branches—debate these edges!*
