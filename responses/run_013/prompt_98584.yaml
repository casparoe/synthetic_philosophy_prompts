prompt: |-
  I sit on — well, I staff — the commemoration review panel for a mid-sized city, and I've been asked to turn our vague collective sense of "we'll know it when we see it" into something the five of us can actually run inside a two-hour monthly meeting. We get about a dozen petitions a year to remove or rename something, the council votes on our recommendation, and every one of them lands on the local news, so the stakes are real, but the panel is volunteers: a retired archivist, a judge, two neighborhood reps, and me, and none of us can do original historical research beyond what the petitoners and the city records hand us. What I keep running into is that the same object gets defended and attacked under two different descriptions — as a record of what a past era chose to honor, and as a claim the city is making right now in the present tense, with the monument's own rhetoric doing the talking before any added plaque gets a word in — and whichever description we settle on seems to decide the case before we've argued about anything. I read somewhere about counter-monuments that are built to erase themselves, and about cities that relocate rather than remove, and I want the procedure to have room for more than keep-or-scrap.

  So: give me a decision procedure — the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision to a vote because the question is one of values rather than facts. It has to force us to pick and defend a description of the object early on, and it needs a real test for standing — who is actually wronged by a monument: the descendants, the people who walk past it every day, the honoree's own community, the whole city — plus a place for the middle options (reinterpret in place, relocate, add context, replace with something new, empty the plinth and let that be the statement), and some honest guidance on the plaque problem, where the added sentence competes with the monument's original rhetoric instead of answering it. Then run it on three cases: an 1908 equestrian statue of a general, sitting on the city's busiest roundabout, who also ordered troops to fire on striking workers, petitioned by a high school history class; a street named for a botanist who was a loud eugenicist, where the actual complaint is that four hundred households and a hardware store would have to change their addresses; and a memorial to the victims of a factory fire that a neighborhood group wants moved because it's become a spot for dealing drugs, which has nothing to do with who's being honored. Include at least one case where the procedure tells us to leave the thing standing and I won't like it, and tell me straight where the procedure will misfire, or just launder a political fight as a checklist. End with a single last line beginning "Verdict:" that names the case the procedure can't settle on its own.
reasoning: |-
  Okay, let me tackle this complex monument review problem. The user needs a practical decision framework that addresses both procedural and ethical challenges in commemorative disputes. 

  First, I should recognize the core tension they described: monuments functioning as historical records versus active civic statements. That's the pivot point any procedure must resolve early. The user's frustration with binary outcomes suggests we need at least five disposition options beyond keep/scrap.

  Hmm... the standing question is tricky. Who counts as "harmed" by a monument? We can't default to blood descendants - that would exclude marginalized groups. Maybe proximity + identity vulnerability? But that risks overbroad claims. Perhaps tie it to the specific harm depicted in the monument's narrative.

  For the plaque dilemma... ah, the key is rhetorical dominance. If the monument's visual language overwhelms text, added context fails. Need a test for when modification is futile. And for political laundering - we should build in a "values impasse" flag when evidence can't resolve conflicts.

  The three test cases are well-chosen: 
  - The general statue tests heroic framing versus suppressed violence
  - The botanist street names force cost/benefit analysis of literal erasure
  - The fire memorial relocation highlights unintended consequences

  Biggest risk is the "contested meaning" trap - when panelists disagree on which historical facts matter. The procedure must force that debate early rather than bury it in process. Also need to acknowledge that some conflicts are fundamentally about power, not facts.

  Final verdict should isolate the insoluble case: when the monument's meaning itself is irreconcilably disputed. That's where the checklist ends and democratic deliberation must take over.
answer: |-
  Here's a decision procedure designed for your panel's constraints, focusing on clarity, forced description choice, standing tests, and expanded options. It's structured as sequential questions with defined exit points and a "Values Vote" stage for inherently political decisions.

  **The Monument Review Decision Procedure**

  **Phase 1: Object Definition & Standing (Crucial First Step - 30 mins max)**
  1.  **Question:** *What precise physical object is under petition?* (e.g., Statue base & figure, street sign & all markers, plaque & surrounding structure, entire park feature).
      *   **Sufficient Answer:** Unambiguous identification documented in meeting minutes.
      *   **Stop if No:** Petition rejected as unclear. Rare.
  2.  **Question:** *What are the two core descriptions in conflict?* Panel MUST articulate both:
      *   **Description A (Past Record):** What specific historical act, value, or person is this object claimed to represent *from the time of its creation*? (e.g., "Honoring Gen. X's Civil War victory," "Celebrating Dr. Y's botanical discoveries").
      *   **Description B (Present Claim):** What specific contemporary message or endorsement is the object *currently perceived* as making by petitioners? (e.g., "Celebrating racial hierarchy," "Endorsing eugenics," "Causing daily distress to group Z").
      *   **Sufficient Answer:** Clear, concise statements of A & B, recorded.
      *   **Stop if No:** Panel cannot proceed without defining the conflict. Petition tabled for refinement.
  3.  **Question:** *Who has standing to petition, and is the claimed harm specific and credible under Description B?*
      *   **Sufficient Answer:** Harm must be:
          *   **Specific:** Tied directly to the *message* of the monument under Description B (not general offense).
          *   **Credible:** Supported by testimony, evidence of impact (e.g., community resolutions, documented distress, direct targeting of a group depicted/associated).
          *   **Proximity:** Primarily residents, workers, or frequent users of the *immediate area*, OR representatives of a group *specifically targeted* by the monument's message (B). Descendants have standing only if *they* experience specific harm *and* the message targets their lineage/identity group. "Whole city" standing requires exceptional, demonstrable city-wide harm.
      *   **Stop if No:** Petition dismissed for lack of credible, specific harm to entities with standing. (e.g., Petitioners with no connection to the area or targeted group; vague "offense").

  **Phase 2: Historical & Contextual Assessment (45 mins max - Focus on Evidence)**
  4.  **Question:** *Is Description A (Past Record) factually accurate based on available evidence (petition, city records, basic verified sources)?*
      *   **Sufficient Answer:** Consensus based on submitted materials and readily accessible, reliable sources (archives, standard histories). *Focus on creator's intent and contemporary understanding at installation.*
      *   **Stop if Yes & Harm Lacks Standing (Phase 1):** Recommend dismissal.
      *   **Stop if No:** Description A is demonstrably false (e.g., monument claims deeds never performed). Proceed to Phase 3, heavily weighting removal/replacement.
  5.  **Question:** *Is the harm claimed under Description B (Present Claim) directly and primarily caused by the monument's *inherent* message (design, text, iconography), or by external factors (neglect, location misuse, unrelated events)?*
      *   **Sufficient Answer:** Analysis separates the object's *intrinsic* message from *extrinsic* problems (vandalism, loitering, changing neighborhood).
      *   **Proceed to Phase 3:** Regardless of answer, but guides disposition choice.

  **Phase 3: Disposition Options & Values Vote (45 mins max)**
  6.  **Question:** *Can the harm under Description B be sufficiently mitigated without removal?* Evaluate options sequentially:
      *   **A. Reinterpretation in Place (Added Context):** *Is the monument's rhetoric visually dominant?* (e.g., Large heroic statue vs. small plaque). If YES, added context likely insufficient. If NO (e.g., simple plaque, nondescript sign), design interpretive signage/installation *that directly counters Description B* and is spatially/visually competitive.
      *   **B. Relocation:** *Is there a suitable context (museum, archive, battlefield, less prominent park) where Description A remains historically relevant but Description B loses its harmful public claim?* Assess cost, feasibility, recipient institution.
      *   **C. Modification/Addition:** *Can the object be altered artistically (counter-monument style) or have a new, dominant counter-element added that fundamentally changes its message?* Assess feasibility, cost, artistic merit.
      *   **D. Removal & Replacement:** *Is there a viable proposal (funded or fundable) for a new monument/artwork addressing the same history or a related value?*
      *   **E. Removal & Empty Plinth (Intentional Absence):** *Would the absence itself be a powerful statement acknowledging harm and contested history?* Assess location suitability.
      *   **F. Retention (Status Quo):** *Is the harm under Description B unproven, lacking standing, or vastly outweighed by the historical value (Description A) AND no mitigation feasible?*
      *   **Sufficient Answer:** Feasibility assessment based on city resources, precedent, and panel judgment. Requires identifying *one* viable leading option.
      *   **Values Vote Trigger:** If evidence cannot resolve *which value (Preservation of History Description A vs. Mitigation of Harm Description B)* should prevail, OR if multiple viable options (A-F) exist with equally strong but conflicting rationales based on evidence.
  7.  **VALUES VOTE (If Triggered):** Panel votes on the disposition option (A-F). Simple majority. *Rationale must be stated, focusing on the core value conflict (e.g., "Prioritize historical record despite discomfort" vs. "Prioritize current community well-being and harm reduction").*

  **The Plaque Problem - Honest Guidance:**
  *   **Test:** If the monument's **visual rhetoric (size, style, placement) inherently dominates the space and conveys the problematic message**, a plaque will almost always fail. It becomes a footnote to a shout. Counter-monuments, artistic intervention, or relocation are better paths.
  *   **When Plaques *Can* Work:** For simple markers (plaques, simple signs), modest statues in balanced settings, or where the original message isn't aggressively triumphalist. The new text must be spatially integrated and comparable in visual weight.

  **Running the Cases:**

  **Case 1: 1908 Equestrian General Statue (Roundabout)**
  *   **Phase 1:**
      *   Object: Bronze statue & granite base.
      *   A: Honors Gen. X's Civil War command (verified).
      *   B: Celebrates/endorses militarism & suppression of labor rights (petitioners cite worker massacre order - verified in records).
      *   Standing: High School class (weak proximity/harm). BUT: Labor groups/local residents likely have standing (petition could be amended). Assume standing granted.
  *   **Phase 2:**
      *   A Accurate? Yes (war command).
      *   Harm Cause? Primarily *inherent* message: Heroic, dominant military figure. Suppression of workers is part of historical record but not depicted.
  *   **Phase 3:**
      *   Mitigation? Reinterpretation: Massive statue dominates roundabout. Plaque futile. Relocation? Possible (military museum, less central park). Modification? Costly/controversial. Removal/Replacement? Viable option. Empty Plinth? Powerful but controversial.
      *   **Values Vote Triggered:** Strong historical value (A) vs. Significant harm (B) tied to inherent symbolism. Evidence doesn't dictate outcome.
      *   **Possible Vote Outcome:** Relocate to Veterans Park (acknowledges history but reduces public claim). *OR* Retention with major contextual art installation nearby (if funded). **You won't like:** Panel votes 3-2 for Retention (Prioritizing preservation of historic art/record, judging labor harm as indirect).
      *   **Verdict:** Recommend Relocation to Veterans Park (via Values Vote).

  **Case 2: Botanist Street Name (Eugenics Advocacy)**
  *   **Phase 1:**
      *   Object: All street signs for "Dr. Y Boulevard."
      *   A: Honors Dr. Y's botanical work (verified).
      *   B: Endorses eugenics (petitioners cite prolific writings - verified).
      *   Standing: Residents/businesses (strong proximity). Harm: Daily reminder/endorsement of ideology used to oppress; address change burden. Specific harm to vulnerable groups credible.
  *   **Phase 2:**
      *   A Accurate? Yes (botany work).
      *   Harm Cause? Primarily *inherent* in the name *because* of the eugenics association becoming widely known. Not extrinsic.
  *   **Phase 3:**
      *   Mitigation? Reinterpretation: Signs are simple markers. Plaque at ends of street possible (but low visibility). Relocation? N/A (it's a name). Modification? Renaming is modification. Removal & Replacement? Renaming is the option. Empty Plinth? N/A. Retention?
      *   **Analysis:** Renaming directly addresses B. Burden is real but mitigable (city assistance programs). Harm of current name (B) is specific and credible.
      *   **Decision:** No Values Vote needed. Harm (B) is specific, credible, caused by the name itself, and renaming is the effective remedy. Burden exists but is administrative, not a harm caused *by the monument's message*.
      *   **Verdict:** Recommend Renaming. (Process should include community input on new name & city support for address changes).

  **Case 3: Factory Fire Memorial (Drug Dealing Site)**
  *   **Phase 1:**
      *   Object: Memorial plaque/sculpture in small park.
      *   A: Honors victims of 1923 factory fire (verified).
      *   B: Petition claims it's causing neighborhood distress, but description is *not* about the memorial's message ("honoring victims"), but about drug dealing *at the site*.
      *   Standing: Neighborhood residents (strong proximity). Harm: Drug dealing, loitering, safety issues.
  *   **Phase 2:**
      *   A Accurate? Yes.
      *   Harm Cause? **Extrinsic.** The harm (drug dealing) is *not* caused by the memorial's *inherent message* (honoring victims). It's caused by location, lack of lighting/policing, social factors. The memorial itself is neutral/victim-focused.
  *   **Phase 3:**
      *   Mitigation? Relocation *might* remove the activity spot, but doesn't solve the underlying problem (dealing may move). Better solutions: Improved lighting, police patrols, community activation of the park. Adding context irrelevant. Removal punishes the victims' memory for an unrelated problem.
      *   **Stop if No (Phase 1/2):** Harm lacks standing *specifically regarding the monument's message*. Harm is real but misattributed. The memorial isn't the cause.
      *   **Decision:** Petition dismissed. Refer safety concerns to relevant city departments (Police, Parks). *Recommend city enhance park safety/activation without moving memorial.*
      *   **Verdict:** Recommend Retention. Address safety issues separately.

  **Where it Misfires/Political Laundering:**
  1.  **Contested History:** If evidence for Description A or B is genuinely ambiguous or hotly contested *among experts*, the panel (lacking research capacity) may make a flawed factual determination (Phase 2 Q4/5), laundering politics as "fact."
  2.  **"Credible Harm" Subjectivity:** Judging the credibility and specificity of harm (Phase 1 Q3) is inherently subjective. A panel's bias could dismiss valid harms or inflate minor ones.
  3.  **Values Vote Scope:** The Values Vote is meant for the *core conflict* (Preserve A vs. Mitigate B). However, panelists could misuse it to vote based on personal affection for the art, cost aversion, or fear of controversy, laundering those reasons as "values."
  4.  **Ignoring Systemic Power:** The procedure focuses on specific objects and harms. It may not adequately capture the cumulative harm of *many* such monuments or address deep-seated power imbalances in who gets commemorated.
  5.  **Mitigation Feasibility:** Judging feasibility (Phase 3 Q6) is practical but can become an excuse for inaction ("Too hard/expensive" defeating valid recommendations).

  **Verdict:** The procedure struggles most with **the contested equestrian statue** where the core conflict (heroic military history vs. suppression of labor) is fundamentally a values clash about which part of history deserves primacy in the public square, and evidence alone cannot resolve the weight each deserves.
