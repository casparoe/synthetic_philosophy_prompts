prompt: |-
  I'm putting together problem sets for a grad seminar on Kant's practical philosophy, and I'm sick of the false-promise / suicide / neglected-talent / refusal-to-help quartet that every textbook trots out. I want a fresh case, and I want you to build it to order. Please act like a card-carrying Kant scholar for this — someone who's spent real time on the Formula of Universal Law and the Formula of Humanity and knows where the seams are. Before you write anything, brainstorm like five or six candidate maxims in a scratch list and tell me briefly why each does or doesn't meet the specs below; then pick the best one and develop it. Take your time and don't skip the brainstorming step.

  Here's the order.

  I want a single maxim describing one mundane, realistic action — something a normal adult might do at work, at home, in a queue, on a commitee. No violence, no life-and-death stakes, nothing science-fictional.

  The maxim has to pass the universalizability test cleanly. That means: universalize it and you get neither a contradiction in conception (the practice it leans on still survives being universal) nor a contradiction in the will (you can coherently will the maxim as universal law, given your necessary ends). So by Kant's own procedure it comes out as a permitted action.

  But the same action has to violate the Formula of Humanity: it uses some specific person merely as a means. And here's the hard part — I want that mere-means use to happen with no deception and no coercion, and with the other person's apparent consent. If it only works because someone is lied to or muscled, you've cheated; the interesting case is the one where all the cards are on the table and it's still a mere-means relation.

  After the scenario: (1) write the maxim out in the standard "I will __ in order to __" form; (2) run the universalization test explicitly, showing why there's no contradiction in conception and none in the will; (3) show why FH nonetheless forbids it, naming which party is treated as mere means and how; (4) tell me which single feature of the case is doing the work — maxim-individuation, the agent's end being one the other party can't share, the asymmetry of the relationship, whatever it turns out to be; (5) say what happens if you re-describe the maxim one level up or one level down, and whether the case collapses; and (6) give me the best Kantian rescue — the move a defender would make to argue that FUL and FH don't really come apart here, and whether you think that rescue works.

  Don't just assert the verdicts, by the way — the whole point is that the case has to generate them from the tests. If the only way to get FUL to pass is to smuggle the answer into how the maxim is worded, say so out loud and treat that as a finding in its own right.
reasoning: |-
  Hmm, the user is asking me to create a novel ethical case study for a Kant seminar that exposes a tension between the Formula of Universal Law (FUL) and Formula of Humanity (FH). They want a realistic scenario where an action passes FUL but violates FH without deception or coercion, even with apparent consent. This is quite challenging!

  I need to brainstorm maxims that meet these strict criteria. The scenario must be mundane - no violence or high stakes. The universalization test should show no conceptual contradiction or contradiction in will, yet FH must be violated through mere-means treatment. Crucially, the other person must be fully aware and consenting, without being deceived or forced.

  Let me brainstorm some candidate maxims:

  1. **Using a paid focus group participant**: "I will solicit consumer feedback from paid participants to improve my product." Problem: Payment might satisfy reciprocity, making it hard to show mere-means treatment.

  2. **Ghostwriting**: "I will hire a ghostwriter to produce content I publish under my name." The consent and payment might make FUL pass, but FH violation is arguable if attribution is withheld.

  3. **Algorithmic labor exploitation**: "I will use gig workers for microtasks to train my AI." Modern but might involve structural coercion, violating the "no coercion" rule.

  4. **Professional reference trading**: "I will provide a positive reference for a colleague in exchange for one in the future." The reciprocity might satisfy FUL while the instrumentalization violates FH.

  5. **Non-reciprocal networking**: "I will cultivate relationships with influential people solely to advance my career." This seems promising - no deception, consent present, yet clearly instrumental.

  6. **Data donation**: "I will use freely donated personal data for commercial research." But informed consent might negate the mere-means claim.

  The professional networking maxim (#5) seems strongest. Let me refine it: "I will cultivate personal relationships with influential people solely to advance my career, making no investment in their wellbeing beyond what serves this purpose." This captures the instrumentalization while maintaining apparent consent.

  For FUL: Universalizing this wouldn't create a contradiction - society could function with everyone networking this way, and we could still will it since career advancement remains possible. No contradiction in conception or will.

  For FH: Violation occurs because we're treating others as mere stepping stones - their personhood is reduced to their usefulness to our goals, even if they consent. The key feature is the agent's non-shareable end; the colleague can't share the agent's self-serving purpose.

  If we redescribe the maxim more broadly ("I will network professionally"), it might pass both tests. More narrowly ("I will flatter Dr. X today"), it still fails FH. The case holds best at this mid-level specificity.

  A Kantian rescue might claim that authentic consent requires respecting others' ends, but I'm skeptical - consent alone doesn't prevent instrumentalization. The tension between FUL and FH seems genuine here, exposing how Kant's formulas can diverge in complex social interactions.
answer: |-
  ### Kantian Case Study: The Instrumental Networker  
  **Scenario:** A junior professor (Alex) systematically cultivates personal relationships with senior faculty members solely to secure career advantages (letters of recommendation, conference invitations, etc.). Alex attends their talks, invites them for coffee, and remembers their interests—but *only* because they are influential. Alex explicitly states, "I enjoy our conversations, but I should be transparent: I’m building connections for my tenure file." The senior colleagues consent ("No problem—networking is part of academia!"). There is no deception or coercion, yet Alex invests zero genuine interest in their well-being, research, or personhood beyond utility.  

  ---

  ### Step 1: Brainstorming Candidates & Evaluation  
  *(Why each does/doesn’t meet specs: mundane, FUL-passing, FH-violating, consent without deception/coercion)*  

  1. **"I will vote ‘no’ on all committee proposals to save time for my research."**  
     - *FUL:* Fails. Universalizing collapses committee systems (contradiction in conception).  
     - *FH:* Coercion-by-neglect implied. Not mundane (disrupts institutions).  

  2. **"I will outsource my household chores via a gig app to maximize work productivity."**  
     - *FUL:* Passes (universal outsourcing is conceivable; gig economy survives).  
     - *FH:* Fails *unless* coercion/deception lurks (e.g., exploitative pay). Consent is structural, not interpersonal.  

  3. **"I will donate to a charity solely for the public recognition."**  
     - *FUL:* Passes (universal vain donating doesn’t undermine charity).  
     *FH:* No *specific* person treated as mere means; charity is impersonal. Violates spirit but not letter of FH.  

  4. **"I will mentor a junior colleague only to create future professional allies."**  
     - *FUL:* Passes (universal instrumental mentoring conceivable).  
     - *FH:* Close, but mentorship implies reciprocity (mentee *gains* skills). Fails "mere-means" clarity.  

  5. **"I will use anonymized customer data for product research to boost profits."**  
     - *FUL:* Passes (universal data-use conceivable; no contradiction).  
     - *FH:* Anonymity voids specificity—no *identifiable* person treated as mere means.  

  6. **"I will cultivate relationships with influential colleagues solely for career advancement, with full transparency."**  
     - ✅ *FUL:* Passes (universal networking for gain is sustainable; no contradiction).  
     ✅ *FH:* Violates—specific persons reduced to tools despite consent.  
     ✅ *Mundane:* Realistic, non-violent, no high stakes.  
     ✅ *Consent without deception/coercion:* Cards on table; seniors consent freely.  

  **Chosen Maxim:** #6 (The Instrumental Networker).  

  ---

  ### Step 2: Development of the Case  

  #### (1) Maxim Statement  
  **"I will cultivate personal relationships with influential colleagues solely to advance my career, making no investment in their wellbeing beyond what serves this purpose, in order to secure professional advantages."**  

  #### (2) Universalization Test (FUL)  
  - **Contradiction in Conception?** Universalize as: "All cultivate relationships *solely* for career advancement."  
    - Practice survives: Academia (or any field) could function with universal instrumental networking. Relationships persist as transactional exchanges ("you scratch my back, I’ll scratch yours"). No logical contradiction—the *practice* of networking isn’t destroyed.  
  - **Contradiction in Will?** Universalizing doesn’t undermine the agent’s necessary ends.  
    - Alex’s end (career advancement) remains achievable even if all network instrumentally. In fact, universalization might *ease* Alex’s goal by normalizing transactional norms. No rational agent *must* will against this (unlike, e.g., refusing help, which risks needing help later).  
  **→ FUL Verdict:** **Permitted.** No contradiction.  

  #### (3) Formula of Humanity (FH) Violation  
  - **Who is treated as mere means?** The senior colleagues.  
  - **How?**  
    - Alex uses their status, connections, and labor (writing letters, etc.) as tools for career gain.  
    - Transparency/consent doesn’t resolve the issue: Kant argues treating someone as a *mere* means occurs when their humanity (rational autonomy) isn’t valued as an end-in-itself (*Groundwork* 4:429). Here, colleagues are valued *only* for their utility—Alex actively avoids engaging their personhood (e.g., disinterest in their research, well-being, or goals unless it benefits Alex).  
    - Consent is insufficient because the colleagues’ rational nature is not respected; they are reduced to "stepping stones" (*Groundwork* 4:430). FH requires actively honoring others’ ends, not just avoiding deception.  

  #### (4) Key Feature Doing the Work  
  **The agent’s end is non-shareable and asymmetrical.**  
  - Alex’s end (self-serving careerism) cannot be shared by the colleagues *as the object of the interaction*. Their consent is to a *transaction*, but Alex’s maxim denies mutual respect for their rational projects. The asymmetry—Alex extracts value while offering none beyond superficial engagement—creates a one-way instrumentalization that FH forbids.  

  #### (5) Re-describing the Maxim  
  - **One Level Up (Broader):** "I will network professionally to advance my career."  
    - *FUL:* Still passes (universal networking conceivable).  
    - *FH:* May *not* violate—broad "networking" could include reciprocal respect (e.g., sharing opportunities). **Case collapses.**  
  - **One Level Down (Narrower):** "I will flatter Prof. X today to get a letter."  
    - *FUL:* Passes (universal flattery for letters conceivable).  
    - *FH:* Still violates (Prof. X treated as a letter-writing tool). **Case holds, but loses mundanity (becomes episodic).**  
  **→ Verdict:** The case is maxim-sensitive but robust at the chosen mid-level specificity. The key is the *solely* clause, which pins the instrumental intent.  

  #### (6) Kantian Rescue & Viability  
  - **Rescue Attempt:** A defender might argue that *consent* converts the interaction into a permissible exchange of services (like hiring a consultant), respecting the colleague’s autonomy as a means *and* end. If the colleague freely agrees, their rationality is engaged.  
  - **Does it Work?** **No.** Kant rejects this: consent alone doesn’t negate "mere-means" treatment if the agent’s maxim excludes valuing the other’s ends (*Metaphysics of Morals* 6:450). Here, Alex’s maxim *systematically ignores* the colleagues’ ends except as instruments. The rescue conflates *formal* consent with *moral* respect for humanity. FH demands we "exhibit humanity as an end in itself" in our actions—something Alex’s maxim structurally omits.  

  ---

  ### Why This Case Works  
  - **FUL/FH Tension Exposed:** FUL focuses on logical consistency of maxims; FH on interpersonal moral regard. This case shows how an action can be "self-consistent" (FUL) while "other-degrading" (FH).  
  - **Pedagogical Value:** Highlights Kant’s claim that FH is the "supreme limiting condition" of freedom (*Groundwork* 4:431)—even when FUL permits, FH may forbid.  
  - **No Cheating:** Consent is explicit, stakes are mundane, and the mere-means treatment arises from the *agent’s end*, not external factors.  

  This would ignite seminar debate—especially on whether Kant’s system *requires* FH to resolve FUL’s blind spots. Ready for tweaks if you want to stress-test further!
