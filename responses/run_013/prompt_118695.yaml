prompt: |-
  Two things happened in the last year that pushed me to ask this. A friend of mine who reads alot of history is now convinced that a certain government will fall inside a decade, and his case is that he's gone through four centuries of states and 'they all go in the end'. When I asked for the list it was mostly states that went; the ones that lasted he waved off as different, and 'different' always turned out to be something you can only spot after you already know how it ended. Then I realised I've definately been doing the same thing on a smaller scale: I've been trying to work out whether the company I work for will still be here in ten years, and I can get basically any answer I want by choosing who counts as 'like us'. Count the small software shops and we're doomed; count the firms that survived a bad patch and we're fine. Either way the comparison group gets picked after I already know how those cases turned out, and picked by someone who already has a view.

  Is there a name for that? I know there's an old statistical worry about which group you count from, but that seems to be about not knowing the right population in the first place, whereas here the group gets assembled after the fact to fit a conclusion. I've also heard 'the outside view' and 'base rates' thrown around in these arguments and I don't think either is quite the thing I'm pointing at. What I want is the carving: what the nearest established ideas actually cover, where a legitimate analogy stops and this starts, and what you'd call it if nothing fits.
reasoning: |-
  Okay, the user is describing a situation where they and a friend are drawing conclusions by selecting historical or comparative cases after knowing their outcomes, which leads to biased reasoning. They mention their friend predicting a government's fall by focusing only on states that collapsed and dismissing those that survived as "different." Similarly, the user does the same when assessing their company's future, cherry-picking comparable firms based on desired outcomes.

  First, I need to identify the core issue here. It seems like both examples involve selecting reference classes after the fact to support a preconceived notion. The user is aware of statistical concepts like base rates and the outside view but feels those don't quite fit. They want the exact term for this fallacy and how it differs from legitimate analogies.

  I recall that this is similar to the Texas sharpshooter fallacy, where someone paints a target around a cluster of bullet holes to claim accuracy. That fits because the selection of cases (bullet holes) happens after seeing the outcome. Confirmation bias is also relevant, but it's broader. The user might be conflating the outside view with this cherry-picking. The outside view should use a broad, predefined reference class, but here the reference class is manipulated post-hoc.

  The user's deeper need might be to understand how to avoid this bias in their reasoning. They want to know the boundaries between legitimate analogy and this fallacy. They might be looking for practical ways to assess their company's future objectively, without falling into this trap. So, explaining the fallacy and distinguishing it from proper base rate usage is key. Also, emphasizing the solution—predefining a reference class before analyzing outcomes—would address their real need for better decision-making tools.
answer: |-
  That's a brilliantly observed cognitive trap! You've pinpointed a very specific and pernicious form of flawed reasoning that blends several established concepts. Here's the breakdown:

  1.  **The Core Fallacy: Cherry-Picking the Reference Class (Post Hoc Reference Class Selection)**
      *   **What it is:** This is the act of defining the group of "similar cases" *after* knowing the outcome of the specific case you're interested in (or after forming a desired conclusion), specifically to include cases that support your view and exclude those that don't.
      *   **Why it's flawed:** It renders the comparison meaningless. It's not using history/data to *inform* a prediction; it's using history/data to *illustrate* a pre-existing belief. You're defining "similarity" precisely by the outcome you want to predict, creating a tautology. If "like us" *means* "survived" or "collapsed," then the conclusion is built into the premise.

  2.  **Relationship to Established Concepts:**
      *   **Base Rates & The Outside View:** You're right to mention these. The *intention* of using the outside view is to rely on **base rates** (the statistical frequency of an outcome within a well-defined reference class) to counter individual biases. **The critical failure point you identified is *how the reference class itself is defined*.** A legitimate outside view requires defining the reference class **objectively and *before* examining the outcome of the specific case in question.** Your friend and your own initial thinking violate this by constructing the class *post hoc* based on the outcome. This corrupts the entire process. So, the flaw isn't *in* the outside view/base rates *concept*, but in its *application* via biased reference class selection.
      *   **Confirmation Bias:** This is a broader bias – the tendency to search for, interpret, favor, and recall information in a way that confirms one's preexisting beliefs. Your observation is a *specific manifestation* of confirmation bias: **selective sampling of evidence** from history, where "evidence" is the chosen reference class.
      *   **Hindsight Bias:** This is the tendency to see past events as having been more predictable than they actually were. Your friend's claim that the surviving states were "different" in ways *only knowable after the fact* ("you can only spot after you already know how it ended") is classic hindsight bias. It allows him to dismiss inconvenient counter-examples by retroactively defining "true similarity" using the outcome itself.
      *   **The Texas Sharpshooter Fallacy:** This is probably the closest *named* fallacy. It involves drawing a bullseye around a cluster of bullet holes *after* the shots have been fired to claim skill. Your examples are analogous: drawing the circle ("similar states/companies") *after* seeing where the bullets landed ("collapsed/survived") to claim predictive power or validate a pattern. **This is the most direct label for the *method* of selecting the group after the fact.**
      *   **Selection Bias / Sampling Bias:** In statistics, this refers to systematically excluding certain groups from your sample, leading to skewed results. Your examples are a form of this, where the selection of the "sample" (the reference class) is deliberately biased to include only cases with the desired outcome.

  3.  **Distinguishing Legitimate Analogy from Fallacy:**
      *   **Legitimate Analogy:** Starts with defining relevant criteria for similarity *independently of the outcome*. E.g., "Companies with ~50 employees in the B2B software sector, founded within the last 10 years, serving niche markets, with a similar revenue model and recent profitability dip." You then gather data on *all* such companies and calculate the survival rate *without knowing your company's fate yet*. This provides a genuine base rate.
      *   **The Fallacy (Post Hoc Reference Class Selection):** Starts with a desired conclusion ("We'll survive!" or "We're doomed!"). Then looks for companies that *both* vaguely resemble yours *and* had the desired outcome, while ignoring or dismissing ("they were different!") similar companies that had the opposite outcome. The similarity criteria are flexible and outcome-dependent.

  4.  **What to Call It:**
      *   **Most Precise:** **Post Hoc Reference Class Selection** or **Biased Reference Class Construction**.
      *   **Common Fallacy Name:** **Texas Sharpshooter Fallacy** (due to the *method* of drawing the target after the shots).
      *   **Broader Context:** A specific manifestation of **Confirmation Bias** and **Hindsight Bias**, corrupting the application of the **Outside View** and **Base Rates**.

  **Key Takeaway for Your Question:**

  You've identified the **critical flaw in applying the outside view: the subjective, post-hoc construction of the reference class based on the desired outcome or known historical result.** While "base rates" and the "outside view" are the *tools* intended to prevent this, the flaw lies in **how the population for calculating those base rates is defined.** The act of carving up history or examples after knowing the endings to fit a pre-conceived narrative is **Post Hoc Reference Class Selection**, closely related to the **Texas Sharpshooter Fallay** and fueled by **Confirmation Bias** and **Hindsight Bias**.

  To avoid this trap (whether for governments or companies), force the definition of the reference class using **objective, predictive criteria defined BEFORE examining the outcome** of the specific case you're judging. If "different" becomes apparent only *after* knowing the outcome, it's likely hindsight bias corrupting the analysis.
