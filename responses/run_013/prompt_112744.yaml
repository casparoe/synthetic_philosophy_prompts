  The user has provided five specific constraints that must be built into my framework. These include recognizing that trust is directed at institutions not people, distinguishing trust from mere reliance, acknowledging that trust has multiple dimensions, accounting for institutional variation within societies, and ensuring reasonableness can be assessed prospectively. That last one about not knowing outcomes in advance is particularly important - it prevents hindsight bias.

  The Nordia case study is fascinating. It describes a society where trust appears high but is actually sustained through social pressure rather than institutional merit. This creates a perfect test case: if institutional performance hasn't "earned" trust, is that trust still reasonable? My framework needs to handle this without special pleading.

  I need to develop a robust list of desiderata - the essential requirements any theory must satisfy. These should cover conceptual clarity about institutional trust, account for its multidimensional nature, handle the Nordia paradox, and more. I'll make sure to identify which requirements are fundamental versus those tied to particular viewpoints, and flag any potential conflicts between them.

  When examining existing theories of trust - interest-based, moral-attitude, and evidence-based approaches - I notice they all struggle with different aspects. Interest-based theories can't handle Nordia well, moral-attitude theories don't distinguish trust from reliance clearly enough, and evidence-based approaches falter on prospective assessment. The "no hidden performance" requirement seems to be the biggest stumbling block for most theories.

  The Nordia case really crystallizes the challenge. My framework forces us to say that Nordian trust might be reasonable in a functional sense, but only if we relax the requirement that trust must be based on institutional character. This exposes a tension in what makes trust "reasonable" - is it about outcomes or about proper grounds?

  Throughout this, I'm keeping in mind that the framework needs to help real citizens from different cultures debate these questions meaningfully. The solution shouldn't just satisfy philosophers but should be usable in actual cross-national dialogues about political trust.
answer: |-
  Here are the desiderata for adjudicating the reasonableness of political trust, constructed to satisfy your constraints and address the Nordia case. Each requirement is motivated by specific phenomena, marked for negotiability, and conflicting pairs are flagged. I then address the Nordia case and evaluate existing accounts.

  ---

  ### **Desiderata for a Theory of Reasonable Political Trust**
  1. **Institutional Object Requirement**  
     *Motivation*: Trust targets abstract entities (e.g., the IRS) lacking unified agency or reciprocity (Constraint 1).  
     *Non-negotiable*: Yes. Collapsing institutional trust into personal trust or mere prediction ignores institutional complexity.  
     *Conflict*: Potentially with moral-attitude accounts (if they presuppose reciprocal agency).

  2. **Trust/Reliance Distinction**  
     *Motivation*: One may rely on the DMV to process licenses (predictive) without trusting it (e.g., to not sell data), or trust a court’s fairness while doubting its efficiency (Constraint 2).  
     *Non-negotiable*: Yes. Conflating them obscures betrayal-sensitivity and normative stakes.  
     *Conflict*: With purely evidence-based accounts (if trust reduces to calibrated prediction).

  3. **Multidimensionality**  
     *Motivation*: Trust varies across domains (competence, goodwill, integrity); e.g., trusting the CDC on expertise but distrusting its transparency (Constraint 3).  
     *Non-negotiable*: No. Some theories might treat trust as unified but must explain domain-specific attitudes.  
     *Conflict*: With scalar theories (e.g., "high trust" scores that obscure contradictions).

  4. **Institutional Heterogeneity**  
     *Motivation*: Scandinavians trust welfare agencies but distrust immigration authorities; Americans trust the military but distrust Congress (Constraint 4).  
     *Non-negotiable*: No. A theory may aggregate attitudes but must allow decomposition.  
     *Conflict*: With national-culture narratives ignoring intra-polity variation.

  5. **Prospective Assessability**  
     *Motivation*: Trust must be reasonable *ex ante*, prior to outcomes, to avoid hindsight bias and address bootstrapping (e.g., distrust causing institutional failure) (Constraint 5).  
     *Non-negotiable*: Yes. Retroactive validation voids trust’s action-guiding role.  
     *Conflict*: With outcome-dependent theories (e.g., "trust was reasonable because it worked").

  6. **Grounds Beyond Performance**  
     *Motivation*: Nordia’s trust rests on social enforcement, not institutional virtue. The theory must evaluate whether non-performance-based grounds (e.g., social sanctions) can justify trust.  
     *Non-negotiable*: No. Some camps insist trust requires earned merit; others accept structural or cultural foundations.  
     *Conflict*: With "earned-trust" views (see below).

  7. **No Hidden Performance Requirement**  
     *Motivation*: If trust is reasonable only when institutions *have* reliably performed, Nordia’s trust (where performance is a by-product) is irrational—but functional. The theory must not smuggle in retrospective performance as necessary.  
     *Non-negotiable*: **Most critical**. Rules out theories demanding unobservable institutional virtue.  
     *Conflict*: With moral-attitude accounts insisting trust requires "desert."

  8. **Functional Equivalence**  
     *Motivation*: Nordia’s institutions *behave* as if trustworthy due to social constraints. The theory must weigh whether functional reliability (regardless of motivation) suffices for reasonableness.  
     *Non-negotiable*: No. Contested between consequentialist vs. deontological camps.  
     *Conflict*: With accounts requiring goodwill or moral commitment from institutions.

  9. **Sensitivity to Social Epistemology**  
     *Motivation*: In Nordia, trust is mediated by citizen vigilance. The theory must explain how distributed knowledge/sanctions affect individual reasonableness.  
     *Non-negotiable*: Yes. Ignoring social epistemology misrepresents collective trust dynamics.  
     *Conflict*: With individualistic accounts (e.g., evidence-based credences alone).

  10. **Bootstrapping Viability**  
      *Motivation*: Trust can initiate cooperation (e.g., voting for reform), while distrust breeds dysfunction. The theory must accommodate self-fulfilling dynamics.  
      *Non-negotiable*: Yes. Failing here renders the theory inert for real polities.  
      *Conflict*: With rigid evidence-based thresholds (e.g., "no trust without prior proof").

  ---

  ### **Conflicting Pairs**
  - **Most Acute Conflict: (7) No Hidden Performance vs. (6) Grounds Beyond Performance**  
    Requirement 7 bars theories from demanding unobservable institutional "virtue." Yet Nordia’s trust relies on social enforcement, not institutional character (6). If reasonableness requires institutions to *deserve* trust (a common view), Nordia fails—but if functional outcomes suffice, it passes. **No theory can satisfy both camps**; this forces a choice between grounding trust in institutional disposition or systemic reliability.

  - **Prospective Assessability (5) vs. Multidimensionality (3)**  
    Prospectively assessing reasonableness across dimensions (e.g., "Is distrust of competence reasonable?") risks fragmentation. A unified verdict may be impossible without arbitrariness.

  ---

  ### **Nordia Case: What the Desiderata Force**
  - Nordian trust **is reasonable functionally** (it enables cooperation and delivers outcomes) but **not meritoriously** (institutions lack inherent trustworthiness).  
  - Requirement 7 (*No Hidden Performance*) **must be enforced**: Nordia’s trust cannot be dismissed as irrational simply because institutions lack "virtue."  
  - However, relaxing requirement 6 (*Grounds Beyond Performance*) for the "earned-trust" camp would deem it unreasonable. The desiderata **force theorists to explicitly choose** whether functional equivalence suffices or moral desert is essential.  

  ---

  ### **Evaluation of Existing Accounts**
  - **Interest-Based Accounts** (trust as aligned incentives):  
    *Fails*: Requirements 1 (institutions lack unified "interests") and 2 (reliance ≠ trust). Nordia’s social enforcement is not an institutional "stake."  
  - **Moral-Attitude Accounts** (trust as normative expectation):  
    *Fails*: Requirements 5 (prospective assessment) and 7 (hidden performance). Demands unobservable goodwill, making trust unreasonable pre-outcome.  
  - **Evidence-Based Accounts** (trust as calibrated prediction):  
    *Fails*: Requirements 2 (conflates trust/reliance) and 8 (ignores functional equivalence). Nordia’s trust is reasonable as a social prediction but not as institutional credence.  

  **The Excluding Requirement**: **Requirement 7 (No Hidden Performance)** disqualifies all three. Moral-attitude and interest-based accounts presuppose institutional properties (virtue/stakes) that are unobservable prospectively; evidence-based accounts reduce trust to prediction, violating requirement 2.  

  ---

  ### **Summary**
  Any adequate theory must prospectively evaluate multidimensional trust in heterogeneous institutions, distinguishing trust from reliance without requiring unobservable institutional virtues (**Requirement 7 is the keystone**). Nordia exposes the core tension: whether trust is reasonable only if institutions *deserve* it, or if systemic reliability suffices. The desiderata force this choice—no theory can satisfy both convictions.
