prompt: |-
  ok so I'm putting together the handout for the first meeting of a reading group on the norm of assertion, and before we start comparing accounts I want the spec nailed down first. What does a theory of when an assertion is OK to make actually have to deliver? Not which account I like — the requirements list. The cases it has to get right, with the case behind each requirement; the distinctions it can't be allowed to collapse; the things it has to stay consistent with; and which of those are genuinely non-negotiable versus just the house style of one camp. If some pair of the requirements can't be satisfied together, tell me which pair — I half suspect that's where the whole fight actually lives. And if you had to pick the single requirement that does the most work in ruling candidates out, which one is it.

  Please don't just recycle the stock examples, I've read all of those. I want a list that can actually handle a few cases I've been chewing on. One: a support tech tells a caller "yeah thats the known bug, reinstalling the driver fixes it" when she only thinks it's probably the bug — but the caller can undo it in two minutes if she's wrong. The usual stakes line says higher stakes raise the bar; here the stakes are low and reversible, and I want the requirements to say whether that's supposed to matter and why. Two: a company spokesperson reads out a statement she doesn't believe and couldn't verify herself, but which the company has vetted — if the knowledge account is right then either she's breaking the norm or she isn't the asserter, and I want the desiderata to force a clean answer about who the asserter even is when someone speaks for an institution. Three: someone says the meeting's at three mostly to stop a colleague asking again, and would be totally relaxed about being wrong — is that a bad assertion, a different speech act, or fine? Four: asserting something to a hearer who can't do anything with it and won't remember it.

  Also build in the stuff from outside the armchair: that we push back on assertions by asking how the person knows, that we retract assertions when we learn we were wrong but don't usually retract beliefs for merely pragmatic reasons, and the experimental work suggesting ordinary speakers are happy to call assertions fine even when the speaker doesn't know. And I care about the distinction between being warranted to assert and being warranted to believe, and between either of those and a hearer being warranted in relying on what they're told.

  I don't need citations or a reading list, I know the literature. Keep it in continuous prose, no headings, no bullet points, no bold, no tables — write it like an email to me. If you want to rank the requirements, do it in sentences.
reasoning: |-
  Okay, let me tackle this user's request. They're organizing a reading group on the norm of assertion and need a clear set of requirements for what makes an assertion "OK." They want more than just standard examples—they've provided specific, nuanced cases to test any theory. 

  First, I need to unpack their four cases: the low-stakes tech support scenario, the institutional spokesperson, the strategic meeting time mention, and the assertion to an uninterested hearer. Each challenges different aspects of existing theories. The user also emphasizes real-world considerations like how people actually challenge assertions and experimental data showing laypeople don't always require knowledge.

  The core challenge is balancing philosophical rigor with practical linguistic behavior. The user wants non-negotiable requirements, potential conflicts between them, and which requirement is most decisive in ruling out theories. I should consider how each requirement handles their cases—like whether reversibility affects permissibility in the tech example, or who bears responsibility in institutional speech.

  Key tensions emerge: between speaker-side warrant and audience reliance; between objective facts about harm and subjective speaker intentions; between what justifies an assertion versus what justifies belief. The knowledge norm might struggle with the low-stakes tech case, while institutional assertion might force a choice between speaker's epistemic state and delegated authority.

  Most importantly, the requirement that assertion must license audience reliance seems fundamental—it explains why we retract false assertions regardless of intent, and why the spokesperson case demands clear responsibility assignment. This requirement likely conflicts with pure internalist approaches when audience vulnerability is high despite speaker confidence.

  I'll structure this as continuous prose addressing each case within the framework of requirements, highlighting where theories succeed or fail. The goal is a practical toolkit for evaluating norms of assertion, grounded in real usage but clear about philosophical trade-offs.
answer: |-
  Alright, here's the rundown on what a theory of assertion's permissibility *must* deliver – the core requirements, the friction points, and how your cases stress-test them. Think of this as the spec sheet before we start plugging in candidate theories.

  **The Non-Negotiables: What the Theory *Must* Handle**

  1.  **The Wrongness of False Assertions:** This is bedrock. Any theory that lets a speaker systematically get away with asserting falsehoods, *especially* when they *should have known better*, is dead on arrival. The core intuition is that asserting P commits you to P's truth in a way that makes getting it wrong inherently defective, distinct from merely having a false belief. *Case Stress:* This underpins why we retract assertions when proven wrong, even if the belief lingers pragmatically. It rules out theories that make assertion purely about intentions or effects without a truth-link.

  2.  **The Licensing Requirement (Audience Reliance):** A permissible assertion must, in principle, license the audience to rely on it *as a source of information* for belief or action. This doesn't mean they *will* rely, or *should* rely uncritically, but the assertion itself presents the content as fit for uptake. This requirement captures why "How do you know?" is the natural challenge, not "Why did you say that?" or "What effect did you want?". *Case Stress:*
      *   **Your Hearer Who Won't Remember:** Even here, the assertion *purports* to license reliance. The norm violation isn't mitigated by the audience's inattention; the *speaker's act* is still defective if the content is false or unjustified, precisely because it *could* have been relied upon (or because it presents itself as reliable).
      *   **Company Spokesperson:** This case *forces* the theory to clarify **who bears the normative burden of licensing reliance**. Is it the spokesperson's *personal* epistemic state? The institution's vetting process? The spokesperson *qua* institutional mouthpiece? The theory must deliver a clear answer about *whose* warrant underwrites the audience's license to rely. Saying "she's not the asserter" is a dodge unless rigorously defined.

  3.  **The Speaker's Responsibility Condition:** The speaker must bear primary responsibility for meeting the norm. You can't delegate the *epistemic* justification for *your* act of asserting to the audience's credulity, gullibility, or independent knowledge. *Case Stress:* **The Strategic "Meeting at 3" Assertion.** Even if the speaker is "relaxed" about being wrong, and even if the audience might be overly trusting, the speaker *is* putting P forward as true. The theory must explain why this feels like a misuse of assertion (if it does) – likely because the speaker isn't adequately grounding the licensing potential they're invoking.

  4.  **Distinction from Belief Warrant:** The conditions for warranted assertion cannot simply collapse into the conditions for justified belief. We assert things we justifiably *suspect* but don't fully believe ("I think it's in the drawer"), and we sometimes justifiably *believe* things we shouldn't assert (e.g., sensitive gossip, trade secrets, or things beyond our expertise to state authoritatively). *Case Stress:* **The Tech Support Case.** This is the crux. The low stakes and reversibility *feel* like they lower the bar for *assertion* compared to high-stakes scenarios, even if the *belief* justification ("probably the bug") remains constant. A theory that can't accommodate this intuitive shift (e.g., a rigid knowledge norm) either looks counterintuitive here or needs a sophisticated story about stakes affecting knowledge itself. The requirement forces the theory to explain *why* assertion's warrant is context-sensitive in ways belief warrant often isn't.

  5.  **Consistency with Assertive Challenges & Retraction Practices:** The theory must cohere with how we *actually* hold asserters accountable. "How do you know?" targets epistemic grounding. "That's not true!" targets falsity. Retraction is demanded for falsity or discovered lack of warrant, not usually for changes in pragmatic relevance. *Case Stress:* **Experimental Data.** If ordinary speakers readily judge assertions permissible without knowledge (as some experiments suggest), a strict knowledge norm clashes directly with this descriptive reality. The theory must either explain this data away (e.g., as confusion, pragmatics, or judging a different norm) or incorporate a weaker epistemic standard. Ignoring this is ignoring how assertion actually functions in discourse.

  **The Tension Points (Where Requirements Pull Apart):**

  The biggest friction lies between **Licensing Requirement (Audience Reliance)** and **Speaker's Responsibility Condition**, especially when mediated by the **Distinction from Belief Warrant** and **Stakes Sensitivity**.

  *   **High Stakes & Strict Norms (e.g., Knowledge):** Prioritizes protecting the vulnerable audience (Licensing) by demanding maximal speaker warrant (Responsibility). Risks making assertion practically impossible in low-stakes scenarios (violating the *Distinction* requirement and clashing with intuitions like the **Tech Support Case** and experimental data).
  *   **Low Stakes & Weaker Norms (e.g., Justified Belief):** Accommodates low-stakes intuition and experimental data (addressing *Distinction*), better handles **Tech Support**. Risks undermining the Licensing Requirement if the audience's potential reliance (even in low stakes) isn't adequately secured by the speaker's justification, potentially letting speakers off the hook too easily for assertions that turn out false (clashing with the bedrock **Wrongness of False Assertions**). Does "justified belief" *really* license the caller to reinstall the driver? What if the tech was justified but wrong?

  **The Institutional Wrinkle (Spokesperson):** This intensifies the License/Responsibility tension. Does the License derive from the *institution's* warrant (requiring a theory of institutional epistemic agency/processes)? Or is the spokesperson *personally* responsible for warranting the claim based on institutional authority (a kind of extended justification)? Or is it a distinct speech act ("reading aloud") governed by different norms? The requirement for **Speaker Responsibility** pushes towards the individual spokesperson having *some* relevant warrant (e.g., "the company has procedures I trust"), while the **Licensing Requirement** suggests the audience's reliance is licensed based on the *institution's* backing. A theory must resolve this cleanly.

  **The Single Most Discriminating Requirement:**

  **Licensing Requirement (Audience Reliance).** This does the heaviest lifting in ruling out theories.

  *   It forces a connection between the speaker's act and the audience's potential use of the information.
  *   It explains the primacy of epistemic challenges ("How do you know?").
  *   It underpins the wrongness of false assertions (because they mislead reliance).
  *   It creates the tension with pure speaker-centric norms in low stakes (**Tech Support**).
  *   It demands an account of responsibility in institutional contexts (**Spokesperson**).
  *   It highlights why assertion differs from mere expression of belief.
  *   A theory that fails to adequately ground *why* an assertion licenses reliance (e.g., by being too speaker-intention focused like the **Strategic Meeting** case, or too divorced from audience vulnerability) struggles fundamentally. If the audience *couldn't* rely on it *in principle*, it's hard to see why it counts as an assertion governed by a truth-linked norm at all.

  **How Your Cases Fit:**

  1.  **Tech Support (Low Stakes/Reversible):** Tests the *Distinction from Belief Warrant* and potential *Stakes Sensitivity*. Does the low risk lower the epistemic bar for *assertion* compared to *belief*? Licensing Requirement: Does "probably" + low risk adequately warrant the caller's reliance for action?
  2.  **Company Spokesperson:** Tests the *Licensing Requirement* source and *Speaker Responsibility*. Whose warrant licenses reliance? Who is responsible? Forces the theory to define the asserter and their epistemic relation to the content within an institutional frame.
  3.  **Strategic "Meeting at 3":** Tests *Speaker Responsibility* and the core purpose of assertion. Is the speaker genuinely undertaking responsibility for the truth to license reliance, or is this assertion "hollow"? Challenges theories based purely on sincerity or intention.
  4.  **Hearer Won't Remember/Use:** Tests the *Licensing Requirement*'s core principle. Does the *in principle* potential for reliance define the norm, or is it nullified by the *actual* disinterest? Reinforces the wrongness of false assertions even without actual harm.

  Getting this spec right means finding a theory that navigates the License/Responsibility tension, respects the assertion/belief distinction, accounts for stakes without collapsing into pragmatics, handles institutional agency, and aligns with actual challenge/retraction practices. The fight lives squarely in how different theories prioritize and resolve these interconnected demands, especially when low stakes (**Tech Support**) and institutional delegation (**Spokesperson**) push them to the limit. Good luck nailing it down!
