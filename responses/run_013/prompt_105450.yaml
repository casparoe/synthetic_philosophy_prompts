prompt: |-
  ok so we did Simpson's paradox in stats and every explanation I can find stops exactly when it gets interesting. I have a real one off our team's stat sheet: Jay shoots a better percentage than Sam in the first half and also better in the second half, and still ends up with the worse percentage for the whole game, which I think is because of how many shots each of them takes in each half. And then the famous ones — the college admissions case where the overall numbers look like bias against women applicants but it mostly goes away once you break it down by department, the kidney stone one where one surgery beats the other for small stones and also for large stones but loses when you lump everybody together, the one where two statisticians look at the same data about kids' weight gain and reach opposite conclusions and both are apparently right, and the hospital thing where two diseases look linked only because having either one is what puts you in the hospital.

  Before you tell me which table to believe, I want the spec first. Write me the list of what any decent account of this has to actually deliver: the cases it has to get right, the distinctions it cant collapse (I know one of them is between a variable that causes the other two and a variable that both of the other two cause, but I definately dont know what to do with that), the bits of math it cant contradict, and the questions it has to really answer instead of dodging.

  For each item, say which case or consideration makes it a requirement, and mark which ones are real requirements versus just habits of one camp (always break it down by every subgroup, never aggregate, just be Bayesian about it, always draw the causal arrows first). Then flag any two requirements you think cant both be met — I have a suspicion theres at least one pair, something like wanting a rule that tells you which table is right while also refusing to assume anything about what causes what.

  After the list, one line each on how the usual advice does against it: break everything down by every variable, report only the top-level number, and the causal-arrows-first answer where the paradox is supposed to dissolve. Dont rank them, I just want to see which requirement each one trips over. Keep it to the list and those lines, no history of the whole debate, and if a requirement needs math I havent had yet just say so and keep that part short.
reasoning: |-
  Okay, the user is diving deep into Simpson's paradox, and they're frustrated that explanations stop short of the interesting parts. They've encountered real-world examples like basketball stats, college admissions, kidney stones, weight gain studies, and hospital data. They want a specification list for a robust explanation of Simpson's paradox, including must-have requirements and pitfalls to avoid. 

  First, I need to unpack their request. They want a list of what a decent account must deliver: cases it must handle, distinctions it can't blur, math it must respect, and questions it must answer. They also want to flag conflicting requirements and evaluate common approaches against these criteria.

  Hmm, the user is clearly stats-savvy but annoyed by superficial treatments. They mention causal directions (confounders vs colliders) but feel unsure how to apply it. Their examples span multiple domains, so the framework must be universal. They suspect a conflict between "which table is right" and "no causal assumptions"—that’s astute. 

  For the list, I’ll start with case coverage: basketball (aggregation flip), admissions (confounder), kidney stones (severity as confounder), weight gain (collider?), hospital Berkson’s bias. Each forces different considerations. Then distinctions: confounders vs colliders is non-negotiable (hospital case breaks if ignored), and math consistency (weight gain case requires showing both calculations are valid). 

  Key requirements:  
  - **R1** Cover all paradox types (user listed 5 distinct cases).  
  - **R2** Distinguish confounders/colliders (Berkson’s bias hinges on this).  
  - **R3** Math must allow reversals (weight gain example proves this happens).  
  - **R4** Answer "which table?" without causal assumptions (but this clashes with R2!).  
  - **R5** Avoid universal prescriptions (e.g., "always disaggregate" fails for colliders).  

  Conflicts: R4 (no assumptions) vs R2 (need arrows for confounders/colliders) is impossible—resolving paradox *requires* causal context. Also, R3 (math reversals) vs R5 (no one-size-fits-all) means you can’t math your way out without domain knowledge.  

  Now, evaluating common advice:  
  - **Disaggregate everything**: Fails R2 (colliders make it worse) and R5.  
  - **Only top-level**: Fails R1 (misses lurking variables) and R3.  
  - **Causal-first**: Fails R4 (requires assumptions) but nails R2.  

  User’s suspicion is spot-on: you can’t have a rule that picks "right" tables *and* remains causation-agnostic. The hospital case screams this—knowing the admission mechanism is everything.  

  I’ll structure the list tightly, using their examples as anchors. For colliders, I’ll clarify with hospital data: if being hospitalized is the collider (effect of diseases), conditioning on it induces fake correlation. That’s why blindly disaggregating backfires.  

  Math-wise, I’ll keep it light but flag that fraction reversals are algebraically possible (R3)—no need for measure theory here. The weight gain study shows exactly this: both conclusions are mathematically correct but context-dependent.  

  Finally, I’ll emphasize that the paradox doesn’t "dissolve" with causal diagrams; it just shifts the question to "what’s the causal story?" Which is what the user wants—no dodging.
answer: |-
  Here’s the spec for a rigorous account of Simpson's paradox, with requirements grounded in your cases, distinctions, math, and core questions. Items marked **[★]** are absolute requirements; others reflect methodological tensions.

  ### Must-Handle Cases & Core Requirements
  1.  **R1 [★]**: **Explain aggregation reversals** (Jay/Sam basketball, kidney stones).  
      *Why*: Must show how better subgroup rates (half 1, half 2) flip when aggregated.  
      *Math*: Prove algebraically that `(a/b > c/d) and (e/f > g/h)` can coexist with `((a+e)/(b+f) < (c+g)/(d+h))` given denominator imbalances.

  2.  **R2 [★]**: **Distinguish confounders vs. colliders** (Admissions vs. Hospital cases).  
      *Why*: Admissions: Department choice (confounder) causes both gender and admission. Hospital: Diseases cause hospitalization (collider), conditioning on it induces spurious link. **Collapsing this distinction breaks the paradox** (e.g., hospital case becomes unexplainable).

  3.  **R3 [★]**: **Respect mathematical consistency** (Weight gain study).  
      *Why*: Both subgroup and aggregate analyses must be *mathematically valid* even when contradictory. No "right" math, only contextually meaningful math.

  4.  **R4 [★]**: **Answer "Which table is *meaningful*?" without assuming causal knowledge** (All cases).  
      *Why*: Real-world paradoxes (e.g., admissions bias accusation) demand resolution when causality is disputed. **Conflict**: Requires causal reasoning (R2) but can’t presuppose it.

  5.  **R5**: **Avoid universal prescriptions** (e.g., "always disaggregate").  
      *Why*: Disaggregating colliders (hospital) creates false associations; ignoring confounders (admissions) hides bias. **Methodological habit, not requirement.**

  6.  **R6**: **Clarify causal vs. descriptive goals**.  
      *Why*: Basketball stats (descriptive) vs. kidney stones (causal decision). Top-level may suffice for description; subgroups for causality. **Habit**: Some camps insist one goal dominates.

  7.  **R7 [★]**: **Address sampling/selection bias** (Hospital case, weight gain if sampled selectively).  
      *Why*: Conditioning on colliders (hospitalization) or non-random sampling induces paradoxes. Must show how data collection structure enables reversal.

  ---

  ### Conflicting Requirements
  -   **R2 vs. R4**: You *must* distinguish confounders/colliders (R2) to resolve paradoxes, but doing so **requires causal assumptions** (arrows), while R4 demands resolution *without* them. **No causation-agnostic rule exists**.
  -   **R3 vs. R5**: Math allows all tables to be "correct" (R3), but practitioners need guidance (violating R5’s anti-prescription stance).

  ---

  ### How Common Approaches Fare Against Requirements
  1.  **"Always Disaggregate"**:  
      ✘ **Fails R2** (creates collider bias in hospital case).  
      ✘ **Fails R5** (universal prescription ignores context).  
      ✓ Addresses R1, R3.

  2.  **"Report Only Top-Level"**:  
      ✘ **Fails R1** (can’t explain Jay/Sam/kidney stone reversal).  
      ✘ **Fails R2** (hides confounder bias in admissions).  
      ✓ Meets R5 (avoids over-disaggregation).

  3.  **"Causal-Arrows-First"**:  
      ✘ **Fails R4** (requires causal knowledge upfront).  
      ✘ **Fails R7** (if arrows mis-specified, e.g., missing collider).  
      ✓ Nails R2, R1 (if arrows correct).

  ---

  ### Key Takeaway
  The paradox isn’t "solved" by math or diagrams alone. **R4 (choosing the meaningful table) is the core challenge** and requires domain knowledge + causal reasoning. No statistical rule replaces understanding *why* the data splits (R2, R7). If causality is unknown (R4), report both tables and acknowledge ambiguity—as in the weight gain study where both statisticians were "right" mathematically (R3) but answered different questions.
