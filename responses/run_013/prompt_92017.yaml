prompt: |-
  I'm producing a short interview series for our department's podcast on the history and philosophy of the earth sciences, and next week's guest is a Quaternary stratigrapher — he's an invented composite, so don't worry about attributing anything to a real person — who spent several years inside the working group that tried to formalize the Anthropocene and eventually argued that the whole enterprise rested on a category mistake: on his view the Anthropocene is a geological event, not an epoch, and events are diachronous things that don't get golden spikes. He is a smooth interviewee with two stock moves. Pressed on the mid-twentieth-century boundary, he says the date is a matter of stratigraphic bookkeeping rather than of when human impact really began; pressed on the 2024 rejection of the proposal, he says the vote was about the time scale, not about whether humans have become a planetary force. I want eight to ten questions that make both moves progressively harder to use, arranged so that each one narrows his room to manoeuvre, ending with a single closing question that forces him to state what would have to be true for him to concede that the working group was right after all. At least one question must be devoted to each of the following: (i) the requirement that a boundary stratotype be isochronous, and why a worldwide fallout signal from mid-century thermonuclear tests can serve as a genuinely synchronous marker when most other mid-century markers cannot — press him on what exactly is doing the work there, and whether the marker's precision is a fact about the rocks or a decision about how much slop we are willing to tolerate; (ii) whether event and epoch are rival answers to one question or answers to two different questions, and what actually turns on which way that comes out — in particular whether his position leaves the working group's fifteen years of work merely mistaken or wasted; (iii) the 2018 subdivision of the Holocene into three ages, the youngest of which, the Meghalayan, is defined by a 4.2 ka drought signal in an Indian stalagmite — ask whether that precedent shows the stratigraphic community is perfectly willing to carve units out of human-relevant upheavals, or whether it shows the opposite, and what he made of it at the time; and (iv) authority — the working group was convened by a subcommission of the International Commission on Stratigraphy, its proposal was voted down twelve to four, that rejection was then confirmed higher up, and the term continues to be used across the social sciences and in public discourse regardless, so who is entitled to decide what the Anthropocene names, and does he think stratigraphy should have the last word on a concept it declined to own.

  Each question needs a follow-up keyed to the answer he is most likely to give, and for the two or three places where he will reach for one of the stock moves above, a second follow-up that closes the escape route rather than merely restating the objection. He is a stratigrapher rather than a philosopher, so the questions should be answerable by someone who works with cores and boundary sections, not by someone who reads Rawls — but don't let him get away with a hand-wave about the rocks deciding, and don't let any of the questions be answerable by a sentence he could have given to a journalist. If terms like isochronous, diachronous, GSSP, or the distinction between chronostratigraphic and geochronologic units appear, they should be doing real work rather than decorating the question. I don't need citations, reading lists, or pointers to the literature; I need the substance of the objections, stated in plain enough language that I can put them to him live.

  Give me the result as a JSON object with exactly this shape: a field "guest_position_summary" containing two or three sentences stating his view as precisely as you can reconstruct it, including what he is and isn't committed to; a field "questions" containing an array of objects, each with "number" (integer, in the order I should ask them), "question" (the wording I would actually say aloud), "targets" (one sentence naming the claim, ambiguity, or unexamined assumption the question is meant to expose), "anticipated_answer" (the reply he is most likely to give, in his voice, briefly), "follow_up" (the next question to ask given that reply), "backstop" (a second follow-up that blocks his stock deflection, or null where none is needed), and "is_closing" (boolean, true for exactly one object); and finally a field "sequencing_rationale" containing a short paragraph explaining why the questions are ordered as they are and where you expect him to be most uncomfortable.
