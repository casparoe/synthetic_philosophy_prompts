answer: |-
  Below is the complete exam package tailored to your specifications. The question forces students to grapple with the *contingency of premises*, the *procedural sensitivity* of outcomes, and the *meta-problem of rule selection* – moving beyond textbook recitation.

  ---

  **Exam Question: The Editorial Board Paradox (20 marks)**

  Five members of an editorial board vote separately on three propositions about a story:
  - **P**: The whistleblower’s central claim is factually substantiated.
  - **Q**: Running the story would be fair to the named company.
  - **R**: The story should be published.

  Their standing rule requires that **R** is adopted *if and only if* **P** and **Q** are both true (`R ↔ (P ∧ Q)`). The majority votes were: **P** accepted (3-2), **Q** accepted (3-2), **R** rejected (3-2). This outcome violates the logical constraint.

  Three alternative procedures were proposed:
  1. **Premise-based:** Vote *only* on **P** and **Q**; derive **R** automatically.
  2. **Conclusion-based:** Vote *only* on **R**; ignore **P** and **Q**.
  3. **Rule-revision:** Treat the rule `R ↔ (P ∧ Q)` itself as contingent, subject to board vote.

  **Analyze this case as a judgment aggregation problem.** Your essay must:
  1. Explain why the original vote exemplifies the *discursive dilemma*, distinguishing it from a Condorcet paradox (3 marks).
  2. Compare the outcomes under the premise-based and conclusion-based procedures *for this specific vote*. Would either satisfy the logical constraint? (3 marks)
  3. Argue why the third proposal (voting on the rule) reveals a deeper challenge than merely "choosing premises." What does this imply about *procedural legitimacy* in collective reasoning? (8 marks)
  4. Discuss *one substantive reason* why the board might legitimately prefer the premise-based approach, and *one* why it might legitimately prefer the conclusion-based approach, grounded in the *editorial context*. (4 marks)
  5. Conclude by reflecting: Does this paradox show that consistent group judgment is "impossible," or does it demand a more nuanced view of institutional design? (2 marks)

  *(Suggested time: 90 minutes. Focus on clear reasoning, not citations.)*

  ---

  **Model Answer (Approx. 700 words)**

  **(1) Diagnosing the Dilemma**  
  The outcome (P:Y, Q:Y, R:N) violates the group’s agreed logical constraint `R ↔ (P ∧ Q)`. This is a textbook *discursive dilemma*: majority voting on interconnected propositions yields collective inconsistency. It is distinct from a Condorcet paradox, which involves *cyclical preferences* over *alternatives* (e.g., A>B, B>C, C>A). Here, the conflict arises from violating *logical dependencies* between *propositions*, not cyclic ordinal rankings. The colleague misdiagnosing it as Condorcet’s paradox conflates preference aggregation with judgment aggregation. The core issue is the failure of majority rule to preserve deductive closure under logical constraints.

  **(2) Comparing Procedures**  
  - **Premise-based (Vote on P/Q only):** With majorities for P and Q, R would be *automatically adopted* (since R must follow from P∧Q). This satisfies the constraint.  
  - **Conclusion-based (Vote on R only):** The majority rejects R, yielding a consistent (if potentially undesirable) outcome: ¬R. The constraint is satisfied trivially because P and Q are irrelevant.  
  Both procedures avoid inconsistency *in this instance* by restricting votes. However, they produce *opposite outcomes* for R (adopted vs. rejected), demonstrating procedural arbitrariness.

  **(3) The Rule-Revision Challenge & Procedural Legitimacy**  
  The proposal to vote on the rule `R ↔ (P ∧ Q)` exposes a fundamental problem: **Premises are not ontologically given; they are institutionally designated.** The board’s standing rule (treating P and Q as premises) reflects a prior *editorial norm*: verifying facts (P) and assessing fairness (Q) are prerequisites for publication (R). But this norm is contestable. Perhaps R should depend only on public interest, making Q irrelevant. Or perhaps P should be broken into sub-claims.  

  Voting on the rule itself doesn’t resolve this; it merely shifts the aggregation problem one level up. *How* should the board decide which propositions are premises? By majority? Unanimity? Or does this invite infinite regress (voting on how to vote on the rules)? This highlights that **procedural choice is inherently value-laden**:  
  - Premise-based voting prioritizes *epistemic rigor* (tracking "truth" via premises) but risks imposing a contested framework.  
  - Conclusion-based voting prioritizes *decisiveness* (settling the immediate issue) but sacrifices reasoned justification.  
  - Voting on rules prioritizes *meta-democracy* but assumes agreement on the domain of "contestable propositions," which may not exist. The legitimacy of *any* aggregation procedure depends on prior agreement about the structure of the decision—agreement that is itself a collective judgment vulnerable to paradox.

  **(4) Contextual Trade-offs**  
  - **Legitimate case for Premise-based:** The board may prioritize *accountability* and *transparency*. Voting on P and Q forces explicit deliberation about factual accuracy (P) and ethical fairness (Q), ensuring R rests on documented reasons. This aligns with journalism’s normative commitment to justification.  
  - **Legitimate case for Conclusion-based:** If the board views P and Q as inherently subjective or unverifiable (e.g., "fairness" is intractably disputed), voting only on R (the action) may better reflect *pragmatic responsibility*. It avoids false precision on ambiguous premises and focuses on the consequential choice.

  **(5) Conclusion: Impossibility vs. Nuance**  
  The paradox does not make consistent judgment "impossible" but reveals that *no aggregation method is universally neutral*. Consistency depends on *aligning the voting procedure with the group’s epistemic values and decision ontology*. Institutional design must:  
  - Acknowledge that "premises" are chosen, not discovered.  
  - Accept that procedural choices (premise-based, conclusion-based, hybrid) entail trade-offs between rationality, efficiency, and legitimacy.  
  - Embed meta-deliberation about *how to decide how to decide* for contentious frameworks. The discursive dilemma isn’t a dead end; it’s a map showing that the path to collective reason depends on where we agree to start.

  **Confidence & Uncertainty**  
  Confidence: High on distinguishing discursive dilemma from Condorcet (Part 1), procedural outcomes (Part 2), and contextual trade-offs (Part 4).  
  **Least Confident Point:** Whether "voting on the rule" truly avoids circularity or merely disguises it under a veil of meta-democracy (Part 3). Real-world groups may rely on *shared norms* to anchor premise selection, but these norms themselves emerge from (potentially paradoxical) social processes.

  ---

  **Marking Scheme (Total: 20 marks)**  
  | **Criteria**                                                                 | **A-Grade (18-20)**                                          | **B-Grade (15-17)**                                          | **Common Mistakes (Deductions)**                                                                 | **Marks** |  
  |------------------------------------------------------------------------------|-------------------------------------------------------------|-------------------------------------------------------------|--------------------------------------------------------------------------------------------------|-----------|  
  | **Q1: Diagnosing Dilemma**                                                   | Clear distinction from Condorcet; precise logic violation. | Identifies inconsistency but muddles Condorcet comparison. | "This is Arrow’s theorem" (-2); "Just Condorcet in disguise" (-1).                             | /3       |  
  | **Q2: Comparing Procedures**                                                 | Correct outcomes for both; notes constraint satisfied.      | One outcome error; or omits constraint satisfaction.       | Assumes premise-based forces R:Y (correct here, but not general).                               | /3       |  
  | **Q3: Rule-Revision & Legitimacy**                                           | Premise contingency + procedural values + circularity risk. | Identifies premise choice but shallow on legitimacy/circularity. | "Premise-based is objectively better" (-3); Ignores circularity (-2).                         | /8       |  
  | **Q4: Contextual Trade-offs**                                                | Both cases plausible and tied to journalism values.         | Generic pros/cons not contextualized.                     | "Premise-based is always more rational" (-2); No editorial link (-1).                          | /4       |  
  | **Q5: Impossibility vs. Design**                                             | Nuanced: design aligns values/procedure, not "impossible." | Oversimplifies to "depends on the situation."             | "All methods are equally flawed" (-1); "Shows democracy is broken" (-1).                       | /2       |  
  **Key A vs. B Differentiator**: A-grades grapple with the *meta-problem* in Q3 (circularity, legitimacy beyond procedure). B-grades treat premise-selection as a technical fix.  

  **Common Pitfalls Highlighted**:  
  - **Arrow Confusion**: Judgment ≠ preference aggregation. Dilemma arises from logic violation, not IIA/transitivity.  
  - **Premise Fetishization**: "Premise-based is always more rational" ignores that premises reflect values/norms, not pure logic.  
  - **Ignoring Circularity**: Failing to see that voting on rules requires rules for voting.  
  - **Decontextualization**: Discussing procedures abstractly, not tied to editorial responsibilities (Q4).  

  ---
  This tests *application*, not recall. Strong students will expose the fragility of "premises," weaker ones will treat them as fixed. The marking scheme rewards wrestling with the meta-layer (Q3) and penalizes procedural dogmatism. The model answer’s self-flagging uncertainty models academic humility—and gives you a rubric anchor if students challenge grading on Q3. Good luck!
