  I should start by outlining non-negotiable requirements. Universalizability is key; theories can't be arbitrary. Exploitation and vulnerability matter, especially in organ sales and surrogacy. Harm prevention is obvious but tricky when non-physical harm is involved. Voluntariness isn't straightforward due to background injustices. Commodification's effects on social goods and equality are also essential. Then there's the personal obligation aspect from substitute cases—this might be the toughest, as it involves what makes an act "mine."

  Conflicts arise immediately. Exploitation concerns might clash with harm prevention. Banning kidney sales could push markets underground, increasing harm. Commodification versus equality: regulating surrogacy might protect women but create unequal access. The personal obligation requirement might conflict with non-paternalism, as it involves judging what activities should be intrinsically personal.

  The universalizability requirement does the most work in ruling out theories. Consent-based theories fail with votes and price gouging—consent alone doesn't capture the harm. Welfare-based approaches struggle with incommensurability in surrogate participation. Meaning-based theories are culturally relative and vague. Equality-based theories are powerful but might overextend. Each has gaps when tested against the requirements.

  Honesty is vital here. The user prefers being told the question is confused over a false tidy answer. The conflicts between requirements suggest a unified theory might be impossible. Instead, a modular approach that addresses different problems separately could be more honest. The user's insight about the list revealing the answer is spot-on—the tensions between requirements show why the debate persists.

  I should also highlight substitute participation as a key challenge. It forces theories to define personal obligation, which many approaches overlook. The hired mourner example shows that effectiveness isn't the issue; it's about the act's intrinsic connection to the person. This requirement might be the hardest to satisfy without invoking controversial metaphysical claims.

  In conclusion, the user needs clarity on why market limits are so contested. By laying out the requirements and their conflicts, they can see the inherent tensions. The most honest answer is that no single theory satisfies all requirements, and a pluralistic approach is necessary. Their frustration with inconsistent intuitions stems from these deep, unresolved conflicts in the philosophy itself.
answer: |-
  Here’s a requirements list for any theory of market moral limits, derived from your cases and core philosophical tensions. The conflicts suggest a unified theory may be impossible—**the deepest insight lies in the collisions between requirements**. I'll mark non-negotiables (★), contested constraints ("house rules"), and irreconcilable tensions.

  ### Core Requirements (Forced by Your Cases)
  1.  **★ Universalizability/Non-Arbitrariness:** *Forced by inconsistent organ/tissue rules (kidney banned, plasma allowed).* Must explain why some body parts/services are marketable and others not without ad-hoc distinctions. Not preference: Arbitrary lines undermine moral coherence and invite hypocrisy.
  2.  **★ Exploitation/Vulnerability Constraint:** *Forced by paid surrogacy and disaster price gouging.* Must address when market transactions exploit desperation or acute vulnerability. Non-negotiable: Permitting exploitation undermines consent’s validity.
  3.  **Harm Prevention:** *Forced by organ sales (health risks) and vote selling (democratic erosion).* Must prohibit trades causing direct/indirect, individual/societal harm. Non-negotiable: A theory permitting severe harm is morally untenable.
  4.  **★ Voluntariness Assessment:** *Forced by all cases involving poverty/desperation (kidneys, surrogacy, price gouging victims).* Must evaluate if consent is meaningful given background injustice. Non-negotiable: Coercion voids moral legitimacy.
  5.  **Commodification Effects:** *Forced by vote selling and surrogate participation.* Must assess how marketizing a good alters its social meaning/value (e.g., votes become commodities, parenting becomes service). House rule: Some camps (e.g., Sandel) deem this essential; others (e.g., libertarians) see it as paternalistic.
  6.  **★ Equality/Power Dynamics:** *Forced by vote selling and substitute participation.* Must evaluate if markets exacerbate domination/subordination (e.g., rich buying political influence or outsourcing civic duties). Non-negotiable: Markets altering fundamental power structures threaten democratic equality.
  7.  **Meaning of "Personal Obligation" (Substitute Participation):** *Forced by hiring substitutes for fasting, mourning, or deathbed vigils.* Must define what makes an act *non-outsourceable* due to its intrinsic tie to personal identity/relationship. House rule: This requirement assumes some acts *must* be personal—a contested metaphysical claim. But the case forces it: A theory must explain why a hired mourner, though convincing, fails ethically where a paid plasma donor might not.

  ### Irreconcilable Tensions (The Heart of the Problem)
  -   **Exploitation vs. Harm Prevention:** Banning kidney sales to prevent exploitation may increase harm (black markets, deaths from lack of supply). Price-gouging bans protect vulnerable buyers but may reduce supply when needed most. *Collision: Protecting the vulnerable can worsen outcomes.*
  -   **Commodification vs. Equality:** Banning paid surrogacy to prevent commodification of reproduction may push it underground, increasing exploitation of poorer women. Regulating it preserves access but entrenches class-based access to reproduction. *Collision: Preserving social meanings can conflict with material equality.*
  -   **Voluntariness vs. Personal Obligation:** If paying a substitute for community service is voluntary and efficient, why forbid it? The "personal obligation" requirement demands intrinsic value in *personal performance*—clashing with non-paternalism. *Collision: Respecting autonomy allows outsourcing; the "personal" requirement forbids it without clear criteria.*

  ### The Most Disqualifying Requirement: Universalizability (★)
  It does the heaviest lifting in ruling out theories:
  -   **Consent/Coercion Theories:** Fail vote selling (voluntary vote sales undermine democracy) and queue jumping (voluntary but allows wealth to bypass fairness). Can’t universally distinguish "voluntary enough" transactions without smuggling in other values.
  -   **Welfare/Consequentialist Theories:** Fail substitute participation (hired mourner may improve welfare but violate the act’s purpose) and commodification (markets may efficiently allocate kidneys but erode dignity). Struggle with incommensurable values.
  -   **Commodification/Corruption Theories:** Fail inconsistent organ markets (why corrupting for kidneys but not plasma?) and substitute acts (why corrupting to hire a wedding guest but not a cleaner?). Relies on contested, culturally relative meanings.
  -   **Equality/Power Theories:** Fail price gouging (could allow dynamic pricing to incentivize supply if regulated for fairness) and sperm donation (permits market despite potential class issues). Risk over-extension (should *all* inequality-producing markets be banned?).

  ### Honest Conclusion: The Unified Theory Likely Fails
  **Your suspicion is correct: The collisions between requirements suggest no coherent, universally applicable theory exists.** The cases reveal *distinct moral problems* masquerading as one question:
  - **Exploitation** (kidneys, surrogacy)
  - **Essential Goods in Crises** (price gouging)
  - **Democratic Integrity** (vote selling)
  - **Fair Access** (queue jumping)
  - **Performative Identity** (substitute participation)

  A defensible approach is a **modular framework**:
  1.  **Essential Goods:** Regulate markets for survival goods (water, healthcare) to prevent exploitation.
  2.  **Democratic/Civic Sphere:** Ban markets for political participation (votes) and civic duties (jury service).
  3.  **Intimate/Persons:** Restrict markets for body parts/reproductive labor based on exploitation risk and commodification effects, acknowledging trade-offs.
  4.  **Symbolic Acts:** Prohibit outsourcing for acts where *personal performance is constitutive* (mourning, vows), defined by social practice, not metaphysics.

  The "list" isn’t the answer—**the irreconcilable tensions are**. Your substitute participation cases expose the deepest flaw: Markets optimize *outcomes*, but some human acts require *personal presence* to fulfill their purpose. No theory fully resolves why we accept sperm donors but not hired deathbed proxies, because no single principle governs all limits. The honest map is a territory of conflicts.
