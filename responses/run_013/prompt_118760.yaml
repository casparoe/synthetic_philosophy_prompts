  First, I need to address their cases: organ sales, price gouging, vote selling, queue jumping, and substitute participation. Each of these tests different aspects of market limits. The substitute participation, especially, seems unique and underdiscussed. They're questioning whether outsourcing certain acts voids their meaning, which touches on personal obligation and identity.

