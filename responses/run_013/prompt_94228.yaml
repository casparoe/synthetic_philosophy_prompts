answer: |-
  ### Final Examination Question: Choice and Narrative  
  **Time Allowed:** 90 minutes  
  **Marks:** 20  
  **Instructions:** Answer the following question in full. Show all steps of your reasoning. No external sources permitted.  

  ---

  ### Question  
  Consider a driver navigating a road with **three indistinguishable intersections**. The driver cannot determine which intersection they are at due to identical surroundings and absent-mindedness. The payoffs for turning off (exiting) are:  
  - **First intersection:** Payoff = 1  
  - **Second intersection:** Payoff = 3  
  - **Third intersection:** Payoff = 4  
  Continuing past all intersections yields a payoff of 0.  

  The driver must commit in advance to a **strategy** governing their decision (turn off or continue) at every intersection. Crucially, because intersections are indistinguishable, the strategy cannot condition decisions on location (e.g., "turn off at the third intersection").  

  1. **Define the set of feasible strategies** available to the driver. Explain why indistinguishability restricts the driver to this set.  
  2. **Calculate the expected payoff** for a general strategy.  
  3. **Identify the strategy that maximizes expected payoff** and compute its expected value.  
  4. Suppose the driver reaches the third intersection. **Explain what action they would *want* to take at this point** if they could recognize it as the final intersection. **Contrast this** with the action prescribed by the optimal ex-ante strategy.  
  5. **Analyze the tension** between (i) the optimal ex-ante strategy and (ii) the driver's desire at the final intersection. **What does this reveal about rational action under imperfect recall?**  

  ---

  ### Model Answer (≈600 words)  
  #### 1. Feasible Strategies under Indistinguishability  
  Since intersections are indistinguishable, the driver cannot tailor actions to specific locations (e.g., "turn off only at exit 2"). Instead, strategies must define a *state-independent rule* applied identically at every intersection. The driver chooses a probability \( p \) of **continuing** at any intersection (and thus \( 1 - p \) of **turning off**). This generates infinitely many mixed strategies parameterized by \( p \in [0, 1] \). Pure strategies reduce to two extremes: \( p = 0 \) (always turn off at first chance) and \( p = 1 \) (never turn off).  

  #### 2. Expected Payoff Calculation  
  The driver encounters intersections sequentially. Let \( p \) be the probability of continuing at any exit. The payoff depends on *where* they turn off:  
  - **Exit at intersection 1**: Occurs if they turn off immediately.  
    Probability: \( 1 - p \), Payoff: 1.  
  - **Exit at intersection 2**: Occurs if they continue at exit 1 *and* turn off at exit 2.  
    Probability: \( p(1 - p) \), Payoff: 3.  
  - **Exit at intersection 3**: Occurs if they continue at exits 1 and 2 *and* turn off at exit 3.  
    Probability: \( p^2(1 - p) \), Payoff: 4.  
  - **Miss all exits**: Occurs if they continue at all three intersections.  
    Probability: \( p^3 \), Payoff: 0.  

  The expected payoff \( E(p) \) is the probability-weighted sum:  
  \[
  E(p) = (1 - p) \cdot 1 + p(1 - p) \cdot 3 + p^2(1 - p) \cdot 4 + p^3 \cdot 0
  \]  
  Simplifying:  
  \[
  E(p) = (1 - p) + 3p(1 - p) + 4p^2(1 - p) = (1 - p)(1 + 3p + 4p^2)
  \]  
  Expanding:  
  \[
  E(p) = 1 + 3p + 4p^2 - p - 3p^2 - 4p^3 = 1 + 2p + p^2 - 4p^3
  \]  

  #### 3. Optimal Strategy and Expected Payoff  
  To maximize \( E(p) \), solve \( \frac{dE}{dp} = 0 \):  
  \[
  \frac{dE}{dp} = 2 + 2p - 12p^2 = 0 \implies 6p^2 - p - 1 = 0
  \]  
  Using the quadratic formula:  
  \[
  p = \frac{1 \pm \sqrt{1 + 24}}{12} = \frac{1 \pm 5}{12} \implies p = 0.5 \quad (\text{since} \ p \geq 0)
  \]  
  Second derivative test: \( \frac{d^2E}{dp^2} = 2 - 24p \). At \( p = 0.5 \), \( \frac{d^2E}{dp^2} = 2 - 12 = -10 < 0 \), confirming a maximum.  
  Substitute \( p = 0.5 \):  
  \[
  E(0.5) = 1 + 2(0.5) + (0.5)^2 - 4(0.5)^3 = 1 + 1 + 0.25 - 0.5 = 1.75
  \]  
  **Optimal strategy**: Continue with probability \( p = 0.5 \) at every intersection. **Expected payoff**: 1.75.  

  #### 4. Tension at the Final Intersection  
  If the driver *knew* they were at the third intersection, they would **always turn off** to secure payoff 4 (since 4 > 0). However, the optimal ex-ante strategy (\( p = 0.5 \)) mandates continuing with 50% probability, accepting a 50% chance of payoff 0. This conflict arises because:  
  - **Ex-ante rationality**: The strategy maximizes *overall* expected payoff (1.75) by balancing early exits (low payoffs) and late exits (higher but riskier payoffs).  
  - **Sequential rationality at exit 3**: Absent recall, the driver treats exit 3 identically to earlier exits. Turning off for certain here would require a *different strategy* (e.g., \( p = 0 \) at exit 3), violating indistinguishability.  

  #### 5. Implications for Rational Action under Imperfect Recall  
  This tension reveals a key paradox: **optimal precommitment can appear irrational when an agent faces a specific state**. Imperfect recall prevents "conditioning" on unobserved states (e.g., exit number), forcing the driver to act on *average* expectations rather than *actual* context. Consequently:  
  - Rationality requires **commitment to a unified strategy** across indistinguishable states, even if it mandates locally suboptimal actions.  
  - The driver cannot exploit "sunk costs" (e.g., "I continued twice, so this must be exit 3") because indistinguishability erases history.  
  - This mirrors narrative dilemmas where characters, lacking self-awareness, cannot recalibrate choices based on hidden plot points—highlighting how cognitive limits constrain agency.  

  ---

  ### Marking Scheme (20 Marks Total)  
  | **Criteria**                                                                 | **Marks** | **First-Class Requirements (≥16 marks)**                                                                                               | **Common Errors (Mark Deductions)**                                                                                                |  
  |-------------------------------------------------------------------------------|-----------|----------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------|  
  | **Define feasible strategies** (Q1)                                          | 3        | Correctly identifies strategies as state-independent probabilities \( p \) of continuing. Explains why indistinguishability prohibits location-based rules. | −1–2: Fails to explain indistinguishability constraint. −3: Assumes intersections are distinguishable.                            |  
  | **Expected payoff setup** (Q2)                                               | 5        | Correct payoff probabilities: \( (1-p) \), \( p(1-p) \), \( p^2(1-p) \), \( p^3 \). Correct formula \( E(p) = (1-p)(1 + 3p + 4p^2) \).          | −1–3: Incorrect probabilities (e.g., ignores sequence). −4–5: Treats decisions as independent of path (e.g., sums payoffs naively). |  
  | **Optimal strategy and value** (Q3)                                          | 5        | Correct derivative, solves \( 6p^2 - p - 1 = 0 \), finds \( p = 0.5 \), computes \( E = 1.75 \). States "continue with prob 0.5".               | −1–2: Math errors. −3–4: Misses maximization (e.g., assumes pure strategy). −5: Claims sunk cost justifies deviation at exit 3.   |  
  | **Ex-ante/sequential tension** (Q4)                                          | 4        | Notes driver would want to turn off at exit 3 (payoff 4 > 0). Contrasts with optimal \( p = 0.5 \). Explains indistinguishability barrier.    | −1–2: Omits payoff comparison. −3: Suggests driver *should* deviate. −4: Assumes driver knows location.                          |  
  | **Analysis of rational action** (Q5)                                         | 3        | Diagnoses commitment paradox under imperfect recall. Links to sunk-cost fallacy, history erasure, and agency constraints in narratives. | −1: Superficial treatment. −2: Fails to resolve tension. −3: Misattributes conflict to "irrationality."                         |  

  **First-Class Threshold (16+ marks)**: Correctness in all mathematical and conceptual moves, with lucid explanation of the commitment paradox.  
  **Pass Threshold (10 marks)**: Correct optimal strategy and payoff, but incomplete/erroneous analysis of tension or strategies.
