prompt: |-
  I have a set of verdicts about cases in which doing the rational thing and being the sort of person who does well seem to pull apart, and I want to know what principle, if any, they add up to.

  A walker dying of thirst promises a driver a hundred dollars for the ride into town. Once he is in town the promise buys him nothing, and I do not think he is irrational if he refuses to pay; but I think the driver is sensible to refuse him the ride, and I think less of the walker for not paying, even though I could not demand payment of him.

  A man is offered a fortune to intend now to swallow a foul-tasting poison tomorrow, the money paid at once and his mind left free to change. I think he should form the intention and then not drink the poison, and I do not feel that anything has gone wrong: no one has been cheated, and the sequence strikes me as clean. I cannot say why this feels so unlike the walker, since in both cases I form a plan whose last step I will have no reason to perform.

  A state builds a machine that will launch its arsenal automatically if attacked. I think it should build it, and that if the machine fails while the attack is under way, no one should press the button by hand; yet the machine does not make the state's threats a bluff in the way the walker's promise may be one. By contrast, a man cultivates a temper for retaliating at a cost to himself, and once wronged finds that retaliation would cost him far more than it gains. Cultivating the temper seems to me rational; retaliating seems to me imprudent, self-indulgent, beneath him — but not irrational, and a man who at that moment weighs the costs has already lost what he was cultivating.

  A novelist writes only when she believes her book is a masterpiece, so she arranges for a friend to praise her drafts. I think the arrangement is rational. I also think that if she arranges it in order to produce the belief, the belief will not take: she must not see the friend as a device. So the act is rational only if she does not understand why it is.

  My brother borrows whenever he judges that I will lend. I want to become someone who refuses as a rule. But the rule would also make me refuse the one time he is desperate and I could easily help, and refusing then seems to me plainly wrong — and I still think I should acquire whatever would make me refuse the other times.

  I have been assuming the usual division of labour: acts are to be judged by their expected consequences from the moment of acting, dispositions by their expected consequences from the moment of acquiring them. That gets the walker and the poison right, but it makes the retaliation irrational, which I resist, and it says nothing about the novelist. Is there a single principle, or a small set of candidates, that gets all of these — stated precisely, with the case that forces each clause? Tell me which of my verdicts it cannot accommodate and which one I should give up, and say what it predicts for a case I have not listed, ideally one where its two halves come apart, so that I can test it.
reasoning: |-
  Hmm, the user presents a fascinating collection of thought experiments where rationality and character seem to pull in different directions. They've identified a tension between act-based consequentialism and disposition-based evaluation that needs reconciling. 

  The thirst case puzzles me - why does breaking the promise feel permissible while refusing the ride seems sensible? Perhaps because the walker's survival instinct overrides the promise, but the driver correctly anticipates this. The poison case is cleaner because no one gets hurt when intentions change. 

  That retaliatory temper case is tricky. Cultivating the disposition has deterrent value, but following through when costs are high seems pointlessly self-destructive. The novelist paradox is particularly subtle - the very awareness of her belief-manipulation would undermine it. 

  For the lending brother dilemma, the user wants to cultivate refusal as a general disposition while recognizing it might cause harm in exceptional cases. This suggests they value character consistency over case-by-case optimization. 

  I recall Parfit's work on commitment mechanisms where rationality includes self-binding strategies. The state's doomsday machine works precisely because it's irrevocable, unlike the walker's promise. The poison case succeeds because the money changes hands before the intention needs execution. 

  The key might be distinguishing between:
  1) Mechanisms that remain rational only if opaque to the agent (novelist's self-deception)
  2) Commitments that work because they're credible (doomsday machine)
  3) Dispositions we cultivate despite occasional costs (the brother case)

  For a test case, consider a professor who publicly commits to harsh grading to motivate students. When a genuinely distressed student fails, sticking to the policy feels cruel but changing it undermines future credibility. My framework should predict cultivating the strict disposition is rational, while making exceptions is character-undermining.
answer: |-
  Your cases reveal a profound tension between **act-rationality** (judging individual acts by their immediate consequences) and **disposition-rationality** (judging traits by their long-term consequences). The standard consequentialist division of labor fails to capture your intuitions, especially regarding retaliation and the novelist. Below is a unified principle that accommodates your verdicts, identifies tensions, and offers a test case.

  ### Proposed Principle: The Self-Sustaining Equilibrium (SSE) Standard
  An act or disposition is rational iff:
  1. **Instrumental Value**: It maximizes expected value *from the perspective of its adoption* (accounting for how its adoption affects future choices/beliefs), **and**
  2. **Cognitive Coherence**: It does not require self-undermining beliefs (e.g., believing what one knows is false), **and**
  3. **Equilibrium Stability**: Once adopted, it can be maintained without generating internal conflict that undermines its own function.

  ### Application to Your Cases
  | **Case**                  | **SSE Verdict**                                                                                                 | **Clause Triggered**                     |
  |---------------------------|-----------------------------------------------------------------------------------------------------------------|------------------------------------------|
  | **Thirsty Walker**        | **Not paying is rational for walker** (no instrumental value in paying). **Driver sensible to refuse** (predicts SSE failure). | Clause 1 (adoption perspective fails)    |
  | **Poison Intention**      | **Forming intention is rational** (instrumental value; no self-undermining). **Not drinking is rational** (no conflict). | Clause 1 & 2                             |
  | **Doomsday Machine**      | **Building machine is rational** (credible deterrent). **Not pressing button is rational** (no gain after attack). | Clause 1 (adoption perspective)          |
  | **Retaliatory Temper**    | **Cultivating temper rational** (deterrent value). **Retaliating irrational** (fails Clause 1 *and* 3: self-harm + undermines disposition). | Clause 1 & 3 (adoption + stability)      |
  | **Novelist's Praise**     | **Arranging praise is rational only if belief is sincere** (Clause 2: cannot knowingly manipulate own belief). | Clause 2 (cognitive coherence)           |
  | **Brother's Borrowing**   | **Acquiring refusal-disposition rational** (stops exploitation). **Refusing desperate case irrational** (fails Clause 1). Disposition justified by SSE despite rare costs. | Clause 1 & 3 (long-term equilibrium)     |

  ### Tensions and Revisions
  - **Retaliation Verdict Revised**: You should abandon the view that retaliating is "not irrational." SSE shows it violates instrumental rationality *and* destabilizes the disposition. Retaliating is irrational (Clause 1: negative expected value; Clause 3: erodes deterrent credibility).
  - **Novelist Clarified**: The act is rational iff she arranges praise *without* believing it’s manipulative (Clause 2). If she understands the mechanism, it fails—so she must have non-instrumental reasons for trusting the friend.
  - **Walker's Character**: You "think less of him" because he entered an SSE failure (a promise he couldn't sustain). His character flaw is adopting unstable commitments.

  ### Test Case: The Resolute Dieter
  - **Setup**: Anna adopts a strict diet rule: "No sugar ever." She knows:
    - Rule prevents daily temptation battles (long-term benefit).
    - But at a friend’s wedding, one slice of cake would bring joy at negligible health cost.
  - **SSE Prediction**:
    - **Adopting the rule is rational** (Clause 1: avoids recurring willpower drains; promotes equilibrium).
    - **Eating cake is irrational** (Clause 3: violates the rule, triggering guilt/regret that undermines future adherence).
    - **Exception-making disposition is irrational** (fails Clause 1: constant reevaluation exhausts willpower).
  - **Contrast with Act-Consequentialism**: Act-rationality says "eat the cake" (net joy gain). Disposition-rationality says "maintain the rule." SSE sides with disposition-rationality *unless* the exception is pre-committed (e.g., "cheat days"), avoiding cognitive conflict.

  ### Why SSE Works
  - **Solves Novelist Paradox**: Requires beliefs to be cognitively coherent (Clause 2).
  - **Justifies Irrevocable Commitments**: Doomsday machines work because they remove future choices (Clause 3 stability).
  - **Explains Character Judgments**: We condemn the walker because he entered a self-undermining pact (SSE failure), not just for the act.
  - **Handles Poison Case**: Intention-formation is valuable *at adoption*; changing plans later is rational since no harm occurs (unlike the walker’s broken promise).

  **Conclusion**: SSE replaces your "division of labor" with a dynamic standard where acts/dispositions are judged by their capacity to sustain *coherent, instrumentally stable agency* over time. It asks: "Can this choice/trait exist in equilibrium with your beliefs and long-term goals?" This preserves your core intuitions while resolving retaliation’s tension and the novelist’s paradox.
