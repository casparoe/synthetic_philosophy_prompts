  ### Decision Tree for Causal Difference-Making

  **Start:** A cause is at least a difference-maker (nearly universal commitment).  
  *Proceed by answering questions about concrete cases or claims. Each branch leads to a named position or an unoccupied node.*  

  1. **Must an intervention (at least in principle) be possible for a causal claim to be meaningful?**  
     - *Case: Consider a putative cause no one could ever intervene on (e.g., the Big Bang causing cosmic inflation). If interventions are impossible even in principle, can we still call it a cause?*  
       - **Yes (intervention required)**: Go to 2.  
       - **No (intervention not required)**: Go to 3.  

  2. **Are the relata of causation variables (e.g., binary, continuous) rather than events?**  
     - *Case: When analyzing "smoking causes cancer," do we represent "smoking" as a variable (e.g., packs/day) or as a specific event (e.g., John's smoking at time t)?*  
       - **Yes (variables)**: Go to 4.  
       - **No (events)**: **Unoccupied (B)**. Reason: Unattractive—interventions on events are ill-defined without variables to manipulate.  

  3. **Can absences (e.g., omissions, lacks) be causes?**  
     - *Case: Did the guard's failure to lock the door cause the theft?*  
       - **Yes (absences allowed)**: Go to 5.  
       - **No (absences disallowed)**: Go to 6.  

  4. **Can interventions be defined without circularity (i.e., without invoking causal concepts)?**  
     - *Case: An intervention setting variable X must sever X from its usual causes. But if "severing" is causal, is the definition circular?*  
       - **Yes (non-circular interventions)**: **Interventionist counterfactuals over variables (Woodward-style)**. Most awkward commitment: Struggles with interventions that are metaphysically impossible (e.g., intervening on the universe's initial conditions).  
       - **No (circular interventions)**: **Structural-equation approach (Pearl-style)**. Most awkward commitment: Requires treating interventions as primitive causal notions, risking circularity in foundations.  

  5. **Is causation analyzed solely as counterfactual dependence between events?**  
     - *Case: In early preemption (Suzy throws a rock, Billy would have thrown but didn't; bottle shatters), does Suzy's throw cause the shatter only if the shatter counterfactually depends on it?*  
       - **Yes (solely counterfactual)**: Go to 7.  
       - **No (more than counterfactuals)**: Go to 8.  

  6. **Is causation analyzed in terms of counterfactuals?**  
     - *Case: Without absences, how does the theory handle "the lack of rain caused the famine"?*  
       - **Yes (counterfactual analysis)**: **Unoccupied (D)**. Reason: Unattractive—counterfactual theories naturally admit absences; rejecting them while using counterfactuals is unstable.  
       - **No (non-counterfactual analysis)**: **Mechanistic accounts (e.g., Glennan, Craver)**. Most awkward commitment: Cannot treat absences as causes (e.g., a missing signal in a communication system).  

  7. **Can the account handle late preemption without extra conditions?**  
     - *Case: In late preemption (Suzy's rock hits first, Billy's is deflected; bottle shatters), does the effect counterfactually depend on the cause?*  
       - **Yes (handles it)**: **Unoccupied (H)**. Reason: Incoherent—late preemption requires additional machinery (e.g., quasi-dependence) to avoid dependence failures.  
       - **No (needs extra conditions)**: **Counterfactual dependence among events (Lewis-style)**. Most awkward commitment: Requires ad hoc fixes for preemption and double prevention (e.g., chains of dependence).  

  8. **Is causation taken as primitive (i.e., unanalyzable into non-causal terms)?**  
     - *Case: Can we define "cause" without counterfactuals, mechanisms, or interventions?*  
       - **Yes (primitive)**: **Primitivism (e.g., Anscombe)**. Most awkward commitment: Offers no analysis, leaving causation mysterious and scientifically unhelpful.  
       - **No (analyzable)**: Go to 9.  

  9. **Does a single concept of causation cover both difference-making and production?**  
     - *Case: Does "virus causes disease" mean the virus makes a difference to the disease (difference-making) and physically produces it (e.g., via replication)?*  
       - **Yes (single concept)**: **Unoccupied (I)**. Reason: Unexplored—no theory reconciles both jobs without collapsing into pluralism or primitivism.  
       - **No (distinct concepts)**: **Pluralism (e.g., Cartwright, Godfrey-Smith)**. Most awkward commitment: Must explain why we use divergent concepts (e.g., difference-making for absences, production for mechanisms) without a unified theory.  

  ---

  **Summary of Leaves:**  
  - **Interventionist counterfactuals over variables**: Relata are variables; interventions non-circular.  
  - **Structural-equation approach**: Relata are variables; interventions circular/primitive.  
  - **Counterfactual dependence among events**: Relata are events; absences allowed; solely counterfactual.  
  - **Mechanistic accounts**: Relata are events/activities; absences disallowed; non-counterfactual.  
  - **Primitivism**: Relata flexible; causation unanalyzable.  
  - **Pluralism**: Relata context-dependent; multiple concepts.  

  **Unoccupied Nodes:**  
  - **B**: Intervention required + relata events → Unattractive (no clear account of event interventions).  
  - **D**: Absences disallowed + counterfactual analysis → Unattractive (counterfactuals naturally admit absences).  
  - **H**: Solely counterfactual + handles late preemption → Incoherent (no theory avoids dependence failures).  
  - **I**: Non-primitive + single concept for both jobs → Unexplored (no extant theory).  

  **Inseparable Pairs:** None—all leaves are distinct.  

  **Verdict:** leaves=6; unoccupied=4; inseparable=[]
