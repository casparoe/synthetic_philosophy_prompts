prompt: |-
  I'm in a political philosophy reading group that's been meeting for about two years, and we keep circling back to the same fight: what is distributive justice supposed to be equalizing — resources, welfare, or capabilities? We've got a resourcist (equalize bundles of goods and opportunities, and then hold people responsible for how they convert those into lives), a welfarist (what matters is how well people's lives actually go, so equalize welfare on whatever measure you like), and a capability person (what matters is what people are really able to do and be, and since the conversion rates from goods into functionings vary so much between people, equal goods isn't equality of anything interesting). None of them are caricatures; they know each other's objections cold. And yet nobody has moved an inch.

  What stalls us is that whenever we test a view against a case, the case just gets re-described in each person's preferred vocabulary. Case from last week: someone with a treatable condition who declines treatment, has adapted to a restricted life, and reports being perfectly content. The welfarist says she's fine, the capability person says she's missing something real, the resourcist says she's got the bundle and can do what she likes with it. We agree on every fact about her. So it isn't obviously an empirical disagreement — though one of us keeps insisting that the real dispute is about how much weight preferences can bear as a measure of anything at all.

  My working hypothesis, and I'd like you to try to knock it down: the three positions aren't three answers to one question but answers to three different questions wearing a single label — what makes a life go well, what a just distribution has to equalize, and what an institution can legitimately measure and act on. And once you separate those, the bit of genuine disagreement left over is about where to locate responsibility: what a person can be held to, and what has to be treated as bad luck that the distribution absorbs. If that's right, the currency question is downstream of the responsibility question, and a lot of the literature is arguing about the wrong variable. The rival diagnosis I can't rule out is that it's verbal all the way down: any metric can be redescribed in the terms of the others — resources are just capability-inputs, capabilities are just resources indexed to persons, welfare is what capabilities are for — so the argument is really about which description we should let do the work, and that's a question about purposes, not about equality.

  So: which diagnosis do you give, and why? I dont want a verdict on which currency is correct, and I dont want a survey of the literature — I want to know what kind of disagreement this actually is, engaging the positions as I've described them. Is there a hidden empirical or formal question doing the work (measuring conversion rates, individuating capability sets, the structure of responsibility for ends)? Are the sides answering different questions under one name? Is part of the impasse a clash of starting intuitions about a handful of cases that neither side can argue for? And what would count as progress here — a distinction, a decision about what the metric is for, splitting the question in two — or should we expect this to run forever, and if so, why?

  Write your answer in British English, please.
reasoning: |-
  Hmm, the user is part of a political philosophy reading group that's been stuck for two years on the distributive justice debate between resourcism, welfarism, and the capability approach. They keep rehashing the same arguments without progress. The user presents two possible diagnoses: either these are answers to different questions (well-being, equalization, institutional action) with responsibility as the core issue, or it's purely verbal with different descriptions serving different purposes. They want me to analyze what kind of disagreement this actually is without taking sides on which currency is correct.

  I need to understand the core problem. The group agrees on empirical facts in cases like the adapted preferences scenario but interpret them differently through their theoretical lenses. The resourcist sees resources as equalized, the welfarist sees achieved welfare, and the capability theorist sees deprived functionings. This suggests the disagreement isn't empirical but conceptual or normative.

  The user's first hypothesis is that the three positions address distinct questions: what makes a life go well (axiology), what should be equalized (distributive metric), and what institutions can practically measure (operationalization). If this is true, the real conflict is about responsibility—what counts as personal choice versus bad luck that society should mitigate. For example, the resourcist holds people responsible for preferences, the capability theorist for choices within capability sets, and the welfarist might see adaptive preferences as constraints on welfare.

  The second hypothesis is that the debate is "verbal all the way down." Resources, welfare, and capabilities are interdefinable: resources enable capabilities, which produce welfare. The choice of metric depends on the purpose—efficiency, freedom, or well-being—and there's no objective best answer.

  I think both hypotheses have merit, but I lean toward the first. The theories do answer different questions, but the deeper divide is about responsibility. The capability approach emphasizes that preferences can be shaped by injustice, so holding people responsible for them is unfair. Resourcism assumes preferences are authentic once resources are equal. Welfarism struggles with adaptive preferences but might see them as legitimate. This responsibility question isn't always explicit, making the debate seem circular.

  The verbal aspect is real—each theory can co-opt the others' terms—but it's a symptom, not the cause. The core issue is which aspects of disadvantage should be socially addressed versus left to individuals. For instance, in the medical case: is the person's contentment sufficient (welfarist), or should society still offer capabilities (capability view), or is it her choice once resources are provided (resourcist)? This reflects different views on responsibility.

  To break the impasse, the group should:
  1. Map the theories onto the three questions to show they're not directly competing.
  2. Debate responsibility explicitly: what counts as brute luck vs. option luck, and how preference formation affects this.
  3. Clarify the purpose of equality—e.g., is it freedom, fairness, or well-being? This might reveal deeper commitments.
  4. Acknowledge that some intuitions are foundational, like the capability theorist's insistence that unfreedom matters even if unchosen.

  Progress isn't about consensus but understanding the roots of disagreement. If they see that responsibility is the key variable, they can engage more productively. Otherwise, the debate might persist because the theories protect different values.
answer: |-
  Right, let's crack this properly. Your group's stalemate is a classic in political philosophy — not because the positions are weak, but because they're robustly defending different fortresses while lobbing rhetorical grenades over the walls. Your diagnosis is sharp, and I’ll argue it’s mostly correct, but with refinements. The core isn’t *just* responsibility, nor is it *merely* verbal; it’s a clash of **normative priorities** masquerading as a technical dispute about metrics, with responsibility as the pivot. Here’s how I see it.

  ### 1. **Your First Hypothesis: Three Questions, Not One**  
  You’ve hit the nail on the head. The "currency" debate collapses distinct philosophical tasks:  
  - **Axiology**: What constitutes a good life? (Welfare: subjective well-being; Capabilities: substantive freedoms; Resources: means to chosen ends).  
  - **Distributive Principle**: What should institutions equalise? (Welfare: outcomes; Capabilities: opportunities; Resources: inputs).  
  - **Operationalisation**: What can institutions feasibly measure and act upon? (Resources: often easiest; Welfare: problematic with adaptation; Capabilities: conceptually rich but empirically messy).  

  Each theory privileges one task while downplaying the others. The welfarist starts from axiology ("a good life *is* welfare"), so distributive justice *must* track felt experience. The capability theorist starts from the distributive principle ("justice *is* equal effective freedom"), so axiology bends to that. The resourcist starts from operationalisation ("institutions can only handle resources"), making the other questions matters of personal responsibility.  

  **Why this matters**: When you discuss the medically-treated-but-content person, you’re not disagreeing about *her* but about **which question matters most**. The welfarist cares about her *state* (she’s content, so fine). The capability theorist cares about her *opportunities* (she *could* be healthier, so deprived). The resourcist cares about her *entitlements* (she had the option, so fair). The "disagreement" evaporates if you specify the question: "What matters for *assessing her disadvantage*?" (axiology) vs. "What matters for *institutional redress*?" (operationalisation).

  ### 2. **The Responsibility Pivot**  
  This is where your hypothesis is strongest. All three theories use responsibility to draw boundaries between "bad luck" (society’s burden) and "choice" (individual’s burden), but they **locate the boundary differently**:  
  - **Resourcist**: Responsibility kicks in *after* equal resources. If you choose not to treat your condition, your welfare deficit is yours.  
  - **Welfarist**: Responsibility is *internal to preference formation*. If your contentment stems from adaptation (not genuine choice), it’s bad luck—so justice requires compensation.  
  - **Capability Theorist**: Responsibility applies *within* your capability set. If society didn’t enable treatment access, your restricted functioning is its fault—even if you’re content.  

  The medical case stalls because each side smuggles in their responsibility criterion. The resourcist assumes the patient’s choice is authentic; the capability theorist doubts it; the welfarist scrutinises preference genesis. **Progress requires isolating this question**: "Under what conditions can we hold someone responsible for their welfare/capability deficit?" Until then, cases will be redescribed to fit priors.

  ### 3. **Your Second Hypothesis: Verbal Redescription**  
  This isn’t wrong, but it’s incomplete. Yes, the metrics are intertranslatable:  
  - Resources → "inputs for capabilities"  
  - Capabilities → "opportunities for welfare"  
  - Welfare → "achieved functionings"  

  But this doesn’t make the debate "verbal all the way down." The redescription serves **normative priorities**. Choosing one metric isn’t just semantics; it’s choosing which value to **privilege in cases of conflict**:  
  - Freedom (capability sets) vs. Satisfaction (welfare) vs. Agency (resource ownership).  

  In your medical case:  
  - Prioritising *freedom* (capability) overrides contentment ("she should have the option").  
  - Prioritising *satisfaction* (welfare) overrides freedom ("she’s happy, so respect her choice").  
  - Prioritising *agency* (resources) overrides both ("she chose, so consequences are hers").  

  The "purpose" you mention isn’t incidental—it’s constitutive. Capabilities are for freedom; welfare for well-being; resources for agency. The theories aren’t disagreeing about equality; they’re disagreeing about **which moral ideal equality should serve**.

  ### 4. **Hidden Empirical/Formal Quagmires?**  
  There are buried empirical questions, but they’re secondary:  
  - **Conversion Rates**: How variable are resource-to-capability conversions? (Capabilities needs this to argue resources aren’t enough.)  
  - **Preference Plasticity**: How malleable is welfare? (Welfarism needs this to defend against "adaptive preferences".)  
  - **Responsibility Attribution**: When is a choice "free enough" to count? (All need this, but it’s normative, not empirical.)  

  These aren’t doing the heavy lifting. Even perfect data wouldn’t resolve the normative clash—e.g., if conversion rates vary massively, the resourcist might still say, "Tough, people own their bodies."

  ### 5. **Starting Intuitions and the Impasse**  
  Absolutely, foundational intuitions are irreconcilable. Consider:
  - **The Capability Intuition**: "Unfreedom is bad even if unchosen" (e.g., a contented slave is deprived).  
  - **The Resourcist Intuition**: "People should live with their choices" (e.g., if you gamble away resources, don’t complain).  
  - **The Welfarist Intuition**: "Suffering is what matters" (e.g., pain demands relief, regardless of cause).  

  These aren’t argued *for*; they’re argued *from*. Your group’s stalemate persists because each case tests intuitions the others reject. No amount of redescribing the contented patient will move someone who thinks unchosen unfreedom is intrinsically unjust.

  ### What Counts as Progress?  
  Not consensus, but **diagnostic clarity**. Here’s how your group might advance:  
  1. **Split the Questions**: Deliberately map each case onto the three tasks (axiology, distribution, operationalisation). Ask: "Are we disagreeing about what’s good, what’s fair, or what’s feasible?"  
  2. **Isolate Responsibility**: Debate hypotheticals where *only* the responsibility attribution varies—e.g., "Same medical case, but did she *choose* her preferences (e.g., via informed risk-taking) or were they *imposed* (e.g., via propaganda)?"  
  3. **Surface Purposes**: Explicitly state which ideal you’re privileging: "In this case, should justice prioritise her freedom, her satisfaction, or her agency?"  
  4. **Acknowledge Foundations**: Admit when an argument rests on bedrock intuitions. E.g., "If you don’t share the view that unchosen capability deficits are unjust, no case will convince you."  

  **Why this might run forever**: The theories protect different moral commitments. Resourcism safeguards liberal autonomy; welfarism centres felt experience; capabilities combat oppression. These are competing visions of the good society, not computational errors. But understanding *that*—as you’ve begun to do—is progress. It shifts the debate from "Which metric?" to "Which values should our society honour, and where do we place the burden of proof when values conflict?" That’s a harder, richer, and more honest fight. Keep at it—this is philosophy at its grittiest. Cheers.
