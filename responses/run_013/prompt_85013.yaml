  For the fix hierarchy: The community vs individual authority conflict needs top billing because it risks making "correct use" incoherent. The computational semantics clash is secondary since it's more about explanatory frameworks than core metaphysics. The species realism point is actually fine – Wittgenstein isn't anti-realism, just anti-essentialist definitions. 

  Cheapest solution across the board? Emphasize that even the "lone expert" case depends on social practices – the very possibility of technical terms relies on communal institutions like academia or professional fields. That keeps meaning social while allowing for localized expertise. For semantics, they can treat computational models as descriptions of competence rather than mental mechanisms. 

