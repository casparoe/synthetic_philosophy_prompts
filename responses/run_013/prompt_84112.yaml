  *adjusts approach* I'll concede cosmic time's practical value but insist it's emergent, not fundamental. For the rigging objection, emphasize that any solution - however fine-tuned - proves temporal structure is contingent. The physicist will appreciate that distinction between mathematical possibility and physical actuality. 

  Key move: show that even in "nice" spacetimes, simultaneity fractures locally. Their voltmeters always measured within frames - they know this implicitly from lab work. That lived experience might bridge the conceptual gap.
answer: |-
  You raise two substantial objections. Let me address the cosmic time argument first. While it's true that the expanding FLRW models possess a cosmic time coordinate *defined by the homogeneous matter distribution*, this does not salvage objective becoming. Cosmic time is a global *labeling* convention, not an ontological "now." It provides a global temporal ordering, yes, but it does not specify *which* of these ordered events *is happening*. The surfaces of constant cosmic time are global simultaneity slices *by definition* within that model, but they remain coordinate-dependent artifacts of the large-scale symmetry. Crucially, different fundamental observers comoving with the Hubble flow would *still* disagree about the simultaneity of local events not on their worldlines. The theory itself denies any observer-independent meaning to "present" – the cosmic time foliation is merely the most convenient choice *given the symmetry*, not a revelation of an objective passage. It structures the manifold mathematically; it does not make events "come to be."

  Regarding the rotating solution: its contrivance is precisely its strength. The solution *exists* within the framework of general relativity. The equations permit it. The fine-tuning of parameters (density, rotation rate, cosmological constant) to achieve closed timelike curves (CTCs) is irrelevant to the philosophical point. What matters is relativity's *capacity* to describe such a universe without CTCs being a necessary feature. This demonstrates that the existence of a global temporal order – indeed, even the consistency of causality – is *contingent* on the specific matter distribution and boundary conditions. In *our* universe, the matter distribution *happens* to prevent CTCs and allows a cosmic time foliation. But the theory tells us this is contingent – a feature of the *content*, not an inherent property of the *container* (spacetime itself). If objective becoming were fundamental to reality, it should be a necessary feature of the theory's structure, not an accidental consequence of how matter happens to be arranged. The rotating solution proves it isn't necessary. It reveals that temporal order is imposed by the configuration of matter-energy, not by spacetime's fundamental nature.

  Your turn. Does the contingent nature of cosmic time in our universe, as opposed to its necessity within the theory's foundations, sufficiently distinguish it from the fundamental "becoming" you seek to defend?
