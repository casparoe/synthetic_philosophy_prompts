  ## Joint Statement on Persistence: Endurantist-Perderantist Adversarial Collaboration

  **Signed:**  
  *Dr. Eleanor Vance (Endurantist)*  
  *Dr. Marcus Thorne (Perdurantist)*  

  ### Section 1: Agreed Claims
  Both signatories endorse the following as substantive, non-vacuous points of agreement:

  1.  **Core Definitions:** Endurantism holds that persistent objects are *wholly present* at each moment of their existence. Perdurantism holds that persistent objects are four-dimensional entities extended in time, having distinct *temporal parts* at different times. Neither view denies the reality of change or persistence itself.
  2.  **Shared Ontology:** Both views are compatible with a broadly naturalistic worldview incorporating contemporary physics. Both affirm the existence of material objects that persist through time and change. Neither view is inherently committed to exotic entities beyond spacetime or fundamental particles/fields.
  3.  **Physics Interface:** Special Relativity constrains the *structure* of persistence (e.g., making "wholly present at an instant" frame-dependent for endurantists, and defining temporal parts via spacelike hypersurfaces for perdurantists), but it does not *decide* between endurantism and perdurantism. The core dispute concerns temporal unity, not relativistic structure.
  4.  **Arguments Reassessed:**
      *   *Temporary Intrinsics:* Both agree the problem (e.g., a bent vs. straight rod) shows persistence through intrinsic change requires explanation, but neither accepts it as a *decisive* argument for their opponent. Endurantists employ "indexical" or "adverbial" strategies; perdurantists invoke temporal parts. The argument highlights a *challenge* for endurantism, not a *fatal flaw*.
      *   *Statue and Lump:* Both agree the case (statue created/destroyed from enduring lump) demonstrates the need to account for co-location or modal differences. Neither sees it as *decisive*. Endurantists often accept temporary co-location; perdurantists distinguish different spacetime worms. It reveals complexities in identity and constitution, not a clear victory.
      *   *Vagueness for 4D:* Both agree that sorites arguments for temporal parts (e.g., when does a car cease to exist via part replacement?) show vagueness challenges persistence concepts. Neither accepts it as a *conclusive* argument for perdurantism. Endurantists appeal to vague identity or existential indeterminacy; perdurantists see vague temporal boundaries. It underscores a shared problem of vagueness, not a unique solution.
  5.  **Genuine Discovery vs. Redescription:** A discovery resolving the dispute would involve empirical or conceptual evidence revealing the *intrinsic temporal structure* of objects – e.g., evidence that causal continuity *necessarily* implies distinct temporal parts, or that fundamental properties exist *only* at instants requiring endurance. A mere redescription rephrases the same facts in temporal-part or wholly-present language without new empirical consequences or resolving paradoxes more effectively.

  ### Section 2: Residual Disagreements & Cruxes

  The following table presents core disagreements, associated test cases (including the user's proposed case), pre-commitments, and what would settle each crux. Predictions are fixed prior to argument.

  | Crux Question                                                                 | Test Case                                                                                                 | Endurantist Prediction (Vance)                                                                                              | Perdurantist Prediction (Thorne)                                                                                               | What Settles It?                                                                                                                               |
  | :---------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. What is the minimal ontological ground for persistence through change?** | *User's Case:* Object `O` with all parts replaced between any two instants; smooth trajectory/powers.     | `O` persists as a single enduring entity. Parts are accidental; identity grounded in form, causal role, or continuity.      | `O` is a spacetime worm. Each instantaneous slice is a distinct temporal part; persistence is the sum of these causally linked parts. | Evidence showing whether causal continuity/form requires *enduring substrates* or is *exhausted* by sequences of distinct temporal stages.     |
  | **2. Does persistence require strict numerical identity over time?**          | *Statue/Lump Variation:* A lump `L` is continuously reshaped into a distinct statue `S` without pause. | Yes. Either `L` = `S` (one thing changing) or `L` ceases and `S` comes into being (requiring a principled boundary).       | No. `L` and `S` are distinct maximal aggregates of temporal parts within the same spacetime region during their overlap.         | Conceptual analysis/evidence revealing whether "strict identity" is coherent through radical change or if "genidentity" (causal chains) suffices. |
  | **3. Is temporal unity primitive or derived?**                                | *Temporary Intrinsics Variation:* An electron flips spin state instantly and intrinsically at time `t`. | Primitive. The electron is wholly present before `t` (spin-up) and wholly present after `t` (spin-down); unity is basic. | Derived. The spin-up temporal part (before `t`) and spin-down part (after `t`) are unified by immanent causation/spatiotemporal continuity. | Evidence concerning whether fundamental entities exhibit properties requiring literal identity at distinct times or are inherently stage-like.  |

  ### Verdict on Verbal Dispute

  **Substantive Core:** The dispute is **not** purely verbal. The core disagreement concerns the *nature of temporal unity*: Is persistence grounded in the *numerical identity* of an entity wholly present at different times (Endurantism), or is it grounded in the *causal/genetic relations* between distinct temporal stages (Perdurantism)? This difference predicts distinct ontologies and resolutions to paradoxes.

  **Verbal Component:** Significant *terminological* differences exist, particularly regarding "part" and "object." Perdurantists use "part" spatiotemporally; Endurantists typically mean spatial part-at-a-time. Perdurantists often use "object" for the 4D whole; Endurantists for the wholly-present entity. This can create the *illusion* of deeper disagreement or agreement than exists. Crucially, **settling the terminological differences would not resolve the substantive question of temporal unity.** The "choice of notation" reflects the deeper ontological commitment regarding how entities are unified in time.

  **Conclusion:** We agree on the problems, the constraints from physics, and the insufficiency of popular arguments to be decisive. We disagree fundamentally on whether persistence *is* strict identity over time (requiring an entity to be wholly present at each time) or whether it *supervenes on* causal relations between distinct temporal stages. The user's test case starkly reveals this divide: Vance sees a single entity surviving part replacement via identity; Thorne sees a causal chain of distinct stages. Genuine progress requires evidence or arguments directly addressing the grounding of temporal unity. (Word Count: 1187)
