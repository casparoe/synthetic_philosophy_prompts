  Combining: multiply factors but add heavy uncertainty margins. Final credence around 0.7 for rarity? But the colleague's 0.15 suggests they weight detectability failure higher. 

  Empirical vs conceptual split: f_life may be settled by Mars/Enceladus samples, while observer effects need philosophy. 

