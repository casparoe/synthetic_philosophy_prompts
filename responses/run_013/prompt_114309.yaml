prompt: |-
  I have spent the past couple of years reading about why elected officials seem so disconnected from the people they represent, and I have come to believe the problem is less any particular politician than the career structure itself — the fact that holding office has become a long-term job with its own incentives, its own professional class, and its own way of filtering who reaches the top. I have no formal training in politics or political science, so I have been reasoning this through on my own, and I have ended up with a list of reforms that mixes the familiar (term limits, sortition) with a few combinations I have not seen anyone actually propose. I would like you to rate them.

  Please treat the goal as concrete: how much each reform would, over roughly a decade, close the gap between what the legislature actually does and what a randomly chosen cross-section of adult citizens would want it to do. For each reform, give me a score from 0 to 1 for how much it would close that gap, and a separate 0-to-1 confidence score for how much I should trust the first number. I want the two kept apart, because I suspect some of the ideas I find most appealing are also the ones I am least sure about.

  Here is my list:

  1. A hard single-term limit: one term, then permanently barred from any elected office.
  2. A fully sortition-based lower house: the whole chamber filled by stratified lottery, one fixed term, with the same legislative powers the elected house has now.
  3. An advisory-only citizens' assembly: it produces recommendations that the elected legislature must debate publicly, but is not bound by them.
  4. Term limits plus a cooling-off period: two terms maximum, then the person must sit out one full term before running again.
  5. Lottery-restricted candidacy: ordinary elections continue, but a lottery first narrows each district's field down to a random handful of candidates, who then campaign as usual.
  6. A compulsory-service model: every adult is in the pool, service is paid at the local median wage, and refusing to serve is penalized the way refusing jury duty is.
  7. Total rotation: the entire chamber is replaced by a fresh lottery every session, and nobody may serve twice.
  8. Competence-gated sortition: members are drawn by lottery, but must pass an exam before taking the seat.
  9. Recall-by-petition sortition: members are drawn by lottery, but can be removed mid-term by a citizen petition followed by a vote.

  For each reform, please answer in a table with exactly these columns:

  - Reform: the short name from my list above.
  - Gap_closure: a number from 0 to 1, as described.
  - Confidence: a number from 0 to 1, as described.
  - Main_channel: whether it works mainly by changing who gets in ("selection"), by changing how people behave once they are in ("incentives"), or "both" — pick one of those three words.
  - Strongest_point: one sentence on the best argument for it.
  - Failure_mode: one sentence on the most likely way it backfires or gets gamed.
  - Tier: one of S, A, B, C, or D, grouping it with the others that perform most similarly.

  After the table, add three short sections: (a) the tiers listed from best to worst with the reforms in each; (b) any reforms in my list that you think are effectively the same mechanism wearing different clothes, and why; (c) any reform where your confidence score is low enough that you think I should not act on it regardless of how high the gap-closure score is.
reasoning: |-
  Okay, the user has spent years researching why politicians seem disconnected from ordinary citizens and believes the problem lies in the career structure of politics itself. They've independently developed several reform ideas, blending familiar concepts like term limits and sortition with novel combinations. As an untrained but thoughtful observer, they want me to evaluate each reform's potential to align legislative actions with public will within a decade.

  The user's core request is highly structured: they want a table rating each reform's gap-closure (0-1), confidence in that rating (0-1), primary mechanism, key strength, failure risk, and tier grouping. They also want tier rankings, identification of redundant reforms, and warnings about low-confidence proposals. Their focus isn't on individual politicians but systemic incentives and selection processes.

  Hmm, their approach shows sophisticated systems thinking - recognizing that careerism creates self-perpetuating professional classes. The tiered scoring reveals they understand uncertainty in political predictions. By separating gap-closure from confidence, they're acknowledging that some appealing ideas may be untestable. Their proposed reforms range from radical (full sortition) to incremental (advisory assemblies).

  For evaluation, I'll need to consider:
  - Selection vs incentives: Does the reform change who governs or how they behave?
  - Timeframe: A decade allows for implementation but limits long-term effects
  - Gap metric: Alignment with random citizen cross-section (not activists or elites)
  - Unintended consequences: Gaming potential is crucial in "failure mode" analysis

  The hardest part will be confidence scoring. For established ideas like term limits, I can draw on political science research. For novel hybrids (like lottery-restricted candidacy), I'll need analogies from other systems while flagging high uncertainty. The user's self-awareness about their lack of formal training makes me want to emphasize where academic evidence exists versus speculative reasoning.

  Notably, they didn't mention electoral reforms like ranked voting - suggesting they see the problem as deeper than voting mechanics. Their compulsory-service model (#6) is particularly ambitious, resembling ancient Athenian democracy but at national scale. I should note scalability challenges there.

  For tier grouping, I'll cluster reforms by their transformative potential:
  - S-tier: High-impact, mechanism-altering (e.g., full sortition)
  - A-tier: Strong effects but known tradeoffs (e.g., term limits)
  - B-tier: Moderate potential with implementation risks
  - C/D-tier: Marginal or counterproductive effects

  Special attention needed for #8 (competence exam) - could easily become elitist, and #9 (recall petitions) - might amplify polarization. These get low confidence scores despite theoretical appeal.

  In the post-table analysis, I'll highlight that #1 and #4 are variants of the same selection/incentive adjustment, while #2 and #7 share core sortition logic. The compulsory model (#6) gets the strongest warning due to feasibility concerns, even if its gap-closure potential is high.
answer: |-
  Below is the systematic evaluation of your proposed reforms based on political science principles, historical precedents (e.g., sortition in Athens, term limits in Mexico/US states), and empirical research (e.g., citizens' assemblies in Ireland/Canada). Scores assume **full implementation without legal/political sabotage**, focusing exclusively on closing the gap between legislative output and median citizen preferences over ~10 years. Confidence reflects robustness of evidence and scalability risks.

  ### Evaluation Table
  | Reform                     | Gap_closure | Confidence | Main_channel | Strongest_point                                       | Failure_mode                                         | Tier |
  |----------------------------|-------------|------------|--------------|-------------------------------------------------------|-----------------------------------------------------|------|
  | 1. Hard single-term limit  | 0.35        | 0.70       | Incentives   | Eliminates re-election motives, forcing focus on legacy over donors. | Lobbyists dominate institutional knowledge; high turnover breeds incompetence. | B    |
  | 2. Fully sortition-based   | 0.85        | 0.60       | Selection    | Directly mirrors population demographics/policy preferences. | Lack of expertise causes policy chaos or de facto technocrat control. | S    |
  | 3. Advisory citizens' assembly | 0.25        | 0.75       | Incentives   | Creates public pressure on politicians via transparent deliberation. | Legislatures ignore recommendations with minimal political cost. | C    |
  | 4. Term limits + cooling-off | 0.40        | 0.65       | Both        | Reduces careerism while retaining experienced legislators cyclically. | "Revolving door" to lobbying during cooling-off periods. | A    |
  | 5. Lottery-restricted candidacy | 0.50        | 0.55       | Selection    | Diversifies candidate pool, reducing gatekeeping by parties/wealth. | Randomly selected weak candidates enable extremist victories. | A    |
  | 6. Compulsory-service      | 0.70        | 0.30       | Selection    | Forces broad societal participation, eliminating self-selection bias. | Coerced service yields disengaged members; high administrative cost. | B    |
  | 7. Total rotation          | 0.75        | 0.45       | Selection    | Prevents entrenchment and ensures continuous fresh perspective input. | Chronic inexperience paralyzes governance; vulnerability to manipulation. | S    |
  | 8. Competence-gated sortition | 0.60        | 0.35       | Selection    | Balances representation with basic governance capability. | Exams become exclusionary (e.g., class/race bias) or gamed by elites. | C    |
  | 9. Recall-by-petition      | 0.45        | 0.40       | Incentives   | Empowers direct accountability without fixed terms. | Petitions weaponized by organized interests to harass dissenters. | D    |

  ---

  ### Supplemental Analysis  
  **a) Tier Rankings (Best → Worst)**  
  - **S**: #2 (Fully sortition-based), #7 (Total rotation)  
  - **A**: #4 (Term limits + cooling-off), #5 (Lottery-restricted candidacy)  
  - **B**: #1 (Hard single-term), #6 (Compulsory-service)  
  - **C**: #3 (Advisory assembly), #8 (Competence-gated)  
  - **D**: #9 (Recall-by-petition)  

  **b) Redundant Mechanisms**  
  - **#1 (Hard single-term) and #4 (Term limits + cooling-off)** share core DNA: both disrupt careerism by capping tenure duration. #4’s "cooling-off" slightly mitigates #1’s expertise drain but relies on identical incentive restructuring.  
  - **#2 (Full sortition) and #7 (Total rotation)** are variants of the same model: #7 is #2 with higher member turnover. Failure modes (inexperience, manipulation) scale together.  

  **c) Low-Confidence Warnings**  
  - **#6 (Compulsory-service)**: Confidence = 0.30. Despite high theoretical gap-closure (0.70), compulsory national-scale service lacks modern precedents. Risks of mass disengagement or bureaucratic collapse outweigh potential benefits.  
  - **#8 (Competence-gated sortition)**: Confidence = 0.35. "Competence" exams are vulnerable to cultural bias and could recreate the elitism sortition aims to fix. Avoid without pilot studies.  
  - **#9 (Recall-by-petition)**: Confidence = 0.40. Highly vulnerable to astroturfing; could increase polarization by punishing compromise.  

  ---

  ### Key Insights  
  - **Highest Potential**: Sortition (#2, #7) dominates by replacing professional politicians with descriptive representation. However, it requires robust support systems (e.g., training, neutral facilitators).  
  - **Most Pragmatic**: #4 and #5 blend democratic legitimacy with viability. #4’s cooling-off period reduces lobbyist capture vs. #1, while #5’s lottery candidacy could pass legal challenges.  
  - **Overlooked Risk**: All selection-focused reforms (#2, #5–9) face **administrative capture**—e.g., clerks, NGOs, or parties steering inexperienced members. Incentive reforms (#1, #3–4) better resist this but depend on institutional norms.  

  > **Recommendation**: Prioritize **#5 (Lottery-restricted candidacy)** for feasibility testing—it disrupts candidate filtering while retaining electoral accountability. Pair with **#3 (Advisory assembly)** to amplify public input without constitutional overhaul.
