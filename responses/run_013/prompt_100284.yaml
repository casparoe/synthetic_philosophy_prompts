prompt: |-
  I keep encountering a case that Chesterton's fence does not seem built for, and I want to know whether the phenomenon has a name. The fence maxim tells you not to remove an institution until you can say what it was for. But some institutions appear to be ones whose value is destroyed by the very act of asking what they are for. Consider a norm of promise-keeping that people observe because breaking a promise is simply not done: its worth lies in the assurance standing on its own, and that worth drains away once everyone observes promises because of the expected benefits of universal observance. Or a village custom that does its work only so long as nobody asks what the custom is for; the day someone convenes the villagers and asks them to justify it, it has stopped doing that work, and you cannot then remove it to discover what it was doing, because the asking has already changed the thing. For practices of this kind the conservative injunction is not merely difficult to satisfy but self-defeating: the knowledge you are told to obtain before acting is destroyed by obtaining it. Is there an established concept for this class of practice, or for the predicament of the reformer who confronts it? I do not want a bare label. I want to know how the phenomenon stands to Chesterton's fence, to the idea that certain goods are lost when they are deliberately aimed at, and to the suggestion that a rule may hold only on condition that people do not follow it because it holds — and where the edges of the thing lie. If nothing in the literature fits, coin a term and say what falls inside it and what does not.
reasoning: |-
  Okay, let's start by unpacking the user's query. They’re talking about Chesterton’s fence and how it doesn’t cover certain cases. Chesterton’s fence is about not removing something until you understand its purpose. But the user gives examples where asking about the purpose itself destroys the value of the institution or norm. 

  First, I need to make sure I understand their examples. The promise-keeping norm: its value lies in people following it without questioning. Once you start justifying it based on benefits, the norm loses its intrinsic force. Similarly, the village custom only works as long as no one questions it. The act of questioning changes the social dynamics, making the custom ineffective even before removal. 

  The user’s main point is that for such practices, the conservative injunction (understand before changing) is self-defeating because seeking understanding ruins the practice. They want to know if there’s a named concept for this phenomenon. They also mention related ideas like goods that can’t be directly pursued and rules that only work if not followed for their own sake.

  I recall similar concepts in philosophy and social sciences. Let me think about Michael Polanyi’s tacit knowledge—things we know but can’t articulate. For example, riding a bike; explaining how to balance might make you overthink and fall. That’s close but not exactly the same. Then there’s G.K. Chesterton himself with the idea of mysticism being disrupted by explanation. 

  Robert K. Merton’s self-defeating predictions come to mind. Like a fear causing the very thing feared. The user’s case is similar but more about the act of inquiry destroying the subject. Also, Jon Elster’s states that are by-products—things you can’t aim for directly, like spontaneity. If you try to be spontaneous, it doesn’t work. That fits the promise example: trust is a by-product of the norm, not a calculated benefit.

  Then there’s the concept of performative contradiction. When asking about the purpose of a norm, you’re already violating the unspoken agreement that keeps it alive. Like questioning the village custom in public undermines the shared belief. 

  Also, institutional economics with constitutive rules: rules that define the game itself, like promising. If you treat promises as mere tools, you’re not really promising anymore. The act of justification changes the nature of the practice.

  The user might be looking for connections between these ideas. They mention edges—what’s included or not. So I need to define boundaries. Genuine tacit practices vs. those that can be scrutinized. Also, distinguishing from Chesterton’s fence: the fence is about hidden functions, this is about inquiry destroying the function itself.

  Are there existing terms? "Tacit knowledge collapse" or "inquiry-induced institutional decay"? But maybe "self-unraveling institution" is better. The user wants a coined term if none exists. They also want to avoid just a label, so explaining the mechanisms is key. 

  Underlying needs: The user might be dealing with real-world reform challenges. Maybe in policy or organizational change where questioning norms backfires. Or in philosophy, understanding the limits of rationality in social practices. They need a framework to analyze such cases without falling into the trap they describe. Ensuring their analysis respects the fragility of such institutions while seeking change.
answer: |-
  Your query identifies a profound paradox at the intersection of social ontology, epistemology, and institutional decay: **the act of scrutinizing a practice can destroy its constitutive function**. This phenomenon has no single established name, but it maps onto several interconnected concepts. I'll synthesize them, coin a precise term, and delineate its boundaries relative to your concerns.

  ---

  ### **Core Concept: The *Self-Unraveling Institution***
  **Proposed Term:** **Autoclastic Institution** (from Greek *auto-* "self" + *klastos* "broken")  
  *An institution, norm, or practice whose functional value depends on participants' unreflective adherence, and which collapses when its purpose is scrutinized or instrumentalized.*

  #### **Mechanisms & Boundaries**  
  1. **Epistemic Destruction**:  
     - The institution's power relies on **tacit knowledge** (Polanyi) or **pre-reflective commitment**.  
     - *Example*: A sacred ritual maintains social cohesion only if seen as intrinsically meaningful; analyzing it as "social glue" renders it hollow.  
     - *Boundary*: Distinguish from *Chesterton's fence* (e.g., a crop rotation system whose purpose is forgotten but discoverable). Here, inquiry doesn't reveal—it annihilates.  

  2. **Constitutive Rules Collapse** (Searle):  
     - Some institutions exist *by collective intentionality* (e.g., "X counts as Y in context C").  
     - Scrutiny dissolves the "collective intentionality" that constitutes "Y."  
     - *Example*: A "promise" only *is* a promise if treated as deontically binding; justifying it via consequences reduces it to a cost-benefit calculation, destroying its normative force.  
     - *Boundary*: Practices with *regulative rules* (e.g., traffic laws) survive scrutiny because function ≠ constitution.  

  3. **Self-Defeating Reflexivity** (Elster/Giddens):  
     - Reflexive knowledge triggers a **performative contradiction**:  
       - To ask "Why keep promises?" implies promises *can* be broken, eroding trust.  
       - To demand a custom's justification destroys the *unquestioned tradition* that empowered it.  
     - *Boundary*: Reforms *not* requiring reflexive justification (e.g., proving a bridge's stability) avoid this.  

  4. **By-Product Goods** (Elster/Parfit):  
     - The institution's value is a **by-product** of non-instrumental engagement.  
     - *Example*: Spontaneity cannot be achieved deliberately; trust erodes if "manufactured" for gain.  
     - *Boundary*: Goods achievable *through* scrutiny (e.g., efficient bureaucracy) lie outside.  

  ---

  ### **Relation to Adjacent Ideas**  
  | Concept               | Relation to Autoclastic Institutions |  
  |-----------------------|--------------------------------------|  
  | **Chesterton's Fence** | *Divergent*: CF assumes hidden functions are *discoverable* without destruction. Autoclastic practices are *epistemically fragile*—inquiry corrupts their essence. |  
  | **Goods Lost When Aimed At** (e.g., happiness, spontaneity) | *Subset*: Autoclastic institutions are social embodiments of this paradox. The "good" (trust, cohesion) vanishes when made an explicit goal. |  
  | **Rules Followed Unconditionally** (Kantian ethics) | *Foundation*: Such rules *require* non-instrumental adherence. Instrumentalization destroys their authority (e.g., categorical → hypothetical imperative). |  

  ---

  ### **The Reformer's Predicament: The *Autoclastic Trap***  
  When confronting an autoclastic institution:  
  1. **Conservative Stance**: Preserving it requires suppressing inquiry (risking ossification).  
  2. **Reformist Stance**: Scrutiny collapses the institution, making empirical verification of its value impossible.  
  3. **Resolution Paths**:  
     - **Immanent Critique**: Use internal logic to expose contradictions (e.g., "Does this custom *actually* embody our shared values?").  
     - **Stealth Adaptation**: Change practices without explicit justification (e.g., evolving customs organically).  
     - **Reconstitution**: Build replacement institutions *designed* for reflexivity (e.g., codified ethics replacing unspoken norms).  

  ---

  ### **Liminal Cases & Exclusions**  
  - **Included**:  
    - Sacred/ritual practices (e.g., totems losing power when "explained").  
    - Norms of authenticity (e.g., "be yourself" fails if strategized).  
    - Deep conventions (e.g., linguistic norms undermined by prescriptivism).  
  - **Excluded**:  
    - **Purely Functional Tools**: A hammer’s use survives scrutiny.  
    - **Robust Institutions**: Democracies *thrive* on self-examination.  
    - **Benign Ignorance**: Customs with discoverable purposes (Chesterton’s classic case).  

  ---

  ### **Conclusion**  
  The **autoclastic institution** formalizes your insight: Certain social practices are *constituted* by pre-reflective commitment, and their functional logic evaporates under scrutiny. This stands distinct from Chesterton’s fence (which assumes recoverable functionality) and aligns with by-product goods and constitutive rules. The reformer’s trap emerges because verification requires destruction—a dilemma demanding either immanent critique or creative reconstitution. This phenomenon underscores a truth about social ontology: *Not all that is vital can survive being named.*
