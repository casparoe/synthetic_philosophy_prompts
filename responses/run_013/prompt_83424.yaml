prompt: |-
  A close friend and I have argued for the better part of a year about what makes a promise binding, and I would rather settle it by drafting the joint statement we should have written long ago than by repeating ourselves again. I hold that a promise binds only through the damage its breaking does — to the person who was counting on it, or to the general practice of taking people at their word — so that a promise broken in complete secrecy, where no one is harmed and no one's plans are disturbed, leaves nothing to answer for. My friend holds that the act of promising itself places you under an obligation, so that breaking such a promise wrongs the person you made it to even if she never learns of it and loses nothing by it.

  Write the document we could both sign. I want the claims we can accept together about what promises are for and about when a broken promise calls for an answer; then our remaining disagreement stated twice, once in the words my friend would accept and once in mine; then the cruxes — the sub-questions such that settling one would move at least one of us — and for each crux a concrete case that we both agree bears on it, with each of our predictions written down in advance. Please work through at least these three cases: a promise made to someone who has since died, where no living person knows the promise was made; a promise made to a friend who has since lost all memory of it; and a promise whose keeping turns out to do clear harm to a third party. If part of our dispute is really only about the word "obligation," or about whether someone can be wronged without being harmed, say so and say which part. Format the result as a numbered list of agreed claims followed by a table of disagreements.
reasoning: |-
  We are drafting a joint statement to clarify the points of agreement and disagreement about what makes a promise binding.

  Agreed Claims:
  1. Promises serve important social functions: they facilitate cooperation, allow for planning and reliance, and build trust between individuals and within communities.
  2. Breaking a promise can cause harm: it may disappoint the promisee, disrupt their plans, and damage the general practice of trust and promise-keeping in society.
  3. The harm caused by breaking a promise (whether to the specific promisee or to the social fabric) is a strong reason to keep promises and a ground for moral criticism when they are broken.
  4. However, we disagree about whether the act of promising creates an obligation that exists independently of the potential for harm.

  Disagreements:
  We have two main formulations of our disagreement:

  In my friend's words (the deontological view):
     "The act of promising itself creates a moral obligation to the promisee. Therefore, breaking a promise is a wrong to the promisee even if the promisee never learns of the breach and suffers no harm or disappointment as a result."

  In my words (the consequentialist view):
     "A promise binds only because of the harm its breaking may cause. Therefore, if a promise is broken in complete secrecy, with no harm to the promisee and no damage to the social practice of promising, then there is no wrong done and no obligation left unfulfilled."

  Cruxes:
  We identify the following sub-questions (cruxes) that, if resolved, would move at least one of us. For each crux, we provide a concrete case and our predictions.

  Crux 1: Does a promise create an obligation that survives the death of the promisee?
    Case: Alice promises her dying mother to deposit a letter in a specific mailbox after her death. After the mother dies, Alice reads the letter and decides not to deposit it. No one else knows about the promise. The letter's contents are trivial and its non-delivery harms no one and affects no one's plans.

    Prediction by me (consequentialist): 
        Since no harm is done and no one is affected, breaking this promise is not morally wrong.

    Prediction by my friend (deontologist):
        Breaking this promise is a wrong to the mother (even though she is dead) because Alice had an obligation to her that was created by the promise.

  Crux 2: Does a promise create an obligation that persists even when the promisee has no memory of it and thus cannot be disappointed?
    Case: Bob promises his friend Carol, who is about to undergo a medical procedure that may cause memory loss, that he will water her plants while she is in the hospital. After the procedure, Carol loses all memory of the promise and the arrangement. Bob fails to water the plants, but Carol does not notice because she has also forgotten about the plants. The plants die, but Carol is not upset because she doesn't remember having plants. No one else is affected.

    Prediction by me (consequentialist):
        Since Carol is not harmed (she is not upset and her plans are not disrupted because she doesn't remember) and no one else is affected, Bob's failure does not constitute a moral wrong.

    Prediction by my friend (deontologist):
        Bob's failure is a wrong to Carol because he broke a promise he made to her, regardless of her current memory or awareness.

  Crux 3: When keeping a promise would harm a third party, does the obligation to keep the promise persist?
    Case: David promises his friend Emma to keep a secret that she shares with him. Later, David learns that keeping this secret will lead to serious harm to an innocent third party, Frank. If David reveals the secret, he breaks his promise to Emma. If he keeps the secret, Frank will be harmed.

    Prediction by me (consequentialist):
        The obligation to keep the promise is outweighed by the harm that would result. Therefore, breaking the promise is justified and not morally wrong in this case (and may even be required). The harm to Frank is a more compelling moral concern than the harm to the practice of promising by breaking the promise.

    Prediction by my friend (deontologist):
        Breaking the promise is still a wrong to Emma, but it might be justified by the greater good. However, the obligation to Emma remains and is not extinguished; it is merely overridden by other considerations. Thus, David must acknowledge that he wronged Emma even if breaking the promise was the right thing to do overall.

  Note: We also note that part of our dispute might be terminological. I might use the word "obligation" only in cases where there would be harm in breaking the promise, while my friend uses it to refer to a duty created by the promise itself. Similarly, we might disagree about whether someone can be "wronged" without experiencing harm. However, our disagreement goes beyond words because we are making substantive claims about the moral status of promise-breaking.

  Therefore, we present the joint statement as follows:

  ---

  **Joint Statement on the Binding Nature of Promises**

  We, the undersigned, agree on the following points:

  1. Promises are a fundamental social practice that enables individuals to coordinate actions, build trust, and rely on one another.
  2. Breaking a promise typically involves harm: it can disappoint the promisee, disrupt their plans, and erode the general trust in promises that benefits society.
  3. The harm caused by breaking a promise is a primary reason why promises should be kept and why breaking them is often morally blameworthy.

  However, we disagree on the following:

  In the words of [Friend's Name]:
     "The act of promising creates a moral obligation to the promisee that is independent of the consequences of breaking the promise. Therefore, breaking a promise is a wrong to the promisee even in cases where the promisee is unaware of the breach and suffers no harm."

  In the words of [My Name]:
     "A promise binds only because of the harm that breaking it would cause. Therefore, if a promise is broken in complete secrecy and without causing any harm to the promisee or to the social fabric, then there is no moral wrong and no obligation left unfulfilled."

  To further clarify our disagreement, we identify the following cruxes and our respective predictions for specific cases:

  | Crux | Case | [My Name]'s Prediction (Consequentialist) | [Friend's Name]'s Prediction (Deontologist) |
  |------|------|------------------------------------------|-------------------------------------------|
  | 1. Does a promise create an obligation that survives the death of the promisee? | Alice promises her dying mother to deposit a letter but then does not. The mother dies, and no one else knows. The non-delivery causes no harm. | Breaking the promise is not wrong because there is no harm. | Breaking the promise is a wrong to the mother (despite her death) because the obligation persists. |
  | 2. Does a promise bind when the promisee has no memory of it and thus cannot be harmed by its breaking? | Bob promises Carol to water her plants, but Carol loses all memory of the promise and the plants. Bob doesn't water them, and Carol doesn't notice. | No harm, no wrong. | Bob wrongs Carol by breaking the promise, regardless of her memory. |
  | 3. Is the obligation to keep a promise overridden by the harm that keeping it would cause to a third party? | David promised Emma to keep a secret, but keeping it would cause harm to Frank. | Breaking the promise is justified and not wrong because preventing harm is more important. | Breaking the promise is a wrong to Emma, but it might be justified by the greater good. The obligation to Emma remains, but is overridden. |

  We acknowledge that part of our dispute may be terminological (e.g., the meaning of "obligation" and whether one can be "wronged" without harm). However, we also recognize that our disagreement reflects deeper differences in moral theory.

