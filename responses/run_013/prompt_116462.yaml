  ### Scoring Key & Outcomes  
  **Rules:**  
  1. If you chose **10C**, you hold the *meta-level semantic view* (j).  
  2. If you chose **6C** and **non-attribution** (B) in **≥6 of Q1–5,7,9**, you hold *descriptive eliminativism* (a).  
  3. If you chose **6A** (and not 6C), you hold *revisionary eliminativism* (b).  
  4. If you chose **6B** and **attribution** (A) in **Q1–4** but **non-attribution** (B) in **≥1 of Q5,7,9**, you hold *instrumentalism/fictionalism* (d).  
  5. If your answers match **all** of:  
     - Q1A, Q2A, Q3A, Q4A, Q5B, Q7C, Q9A, Q6B, Q8A, Q10A  
     you hold *interpretivism* (e).  
  6. If you chose **attribution** (A) in **≥6 of Q1–5,7,9**, **7A**, **6B**, **8A**, and **10A**, you hold *realist retention* (f).  
  7. If you chose **attribution** (A) in **≥6 of Q1–5,7,9**, **6B**, **8A**, and **10B**, you hold *refinement* (g).  
  8. If your answers match **all** of:  
     - Q1B, Q2B, Q5B, Q7C, Q9B, Q3A, Q4A, Q8A, Q6B, Q10B  
     you hold the *normative-status view* (h).  

  #### Unreachable/Unseparated Positions & Notes:  
  - **Partial eliminativism (c)**: Not captured. The quiz lacks granularity to treat beliefs/desires asymmetrically across cases (e.g., no question forces differential commitment).  
  - **Content-revisionism (i)**: Folded into (f)/(g). Choosing 9A is compatible with both, but insufficient for separation.  
  - **Inseparable pairs**:  
    - (f) vs. (g): Only distinguished by 10A (f) vs. 10B (g).  
    - (a) vs. (b): Separated cleanly (6C vs. 6A).  
    - (e) vs. others: Unique pattern isolates it.  
  - **Nearly unreachable**: (h) requires a specific 10/10 pattern.  
  - **Incoherent/unoccupied patterns**:  
    - Choosing **6B** + **non-attribution in Q1–4**: Incoherent (rejects belief-talk in humans but endorses its utility).  
    - Choosing **6C** + **attribution in ≥4 of Q1–5,7,9**: Unoccupied (denies existence while attributing widely).  
    - Choosing **10C** + **any other outcome**: Overridden by rule 1 (semantic view takes precedence).  

  #### Outcome Commitments (One Awkward Implication Each):  
  - **(a) Descriptive eliminativism**: You must deny you have beliefs while taking this quiz.  
  - **(b) Revisionary eliminativism**: You must advocate abandoning belief/desire talk in psychology, even for yourself.  
  - **(d) Instrumentalism/fictionalism**: You must concede your daily belief-talk is literally false but useful.  
  - **(e) Interpretivism**: You must deny beliefs exist in isolated systems (e.g., a solitary AI).  
  - **(f) Realist retention**: You must attribute beliefs to simple mechanisms (e.g., thermostats).  
  - **(g) Refinement**: You must accept that "belief" will be scientifically unrecognizable to ordinary users.  
  - **(h) Normative-status view**: You must deny beliefs to animals/children while attributing them to delusional patients.  
  - **(j) Meta-level semantic view**: You must reject empirical evidence as decisive, pending a definition of "belief."  
  - **Unnamed**: Your commitments form a hybrid or uncharted position.  

  This instrument prioritizes concrete judgments over self-labeling. It exposes tensions (e.g., denying beliefs in AI but affirming them in humans) that map onto philosophical positions. Use results to spark debate—not as dogma!
