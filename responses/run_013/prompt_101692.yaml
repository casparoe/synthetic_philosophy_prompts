prompt: |-
  I've come round to thinking that evidential cooperation in large worlds is a real thing and not just a cute bit of decision theory: my choices are evidence about how other agents decide, including agents I'll never causally touch, so if the relevant others are running something like the same deliberation I am, I have reason to do the cooperative thing even though nothing I do ever reaches them. What I want is the case against, from someone who takes it seriously rather than swatting it away. Which of the obvious objections actually bite -- that my choice is only evidence via a shared cause, so the inference dies the moment the shared cause is correlated with things that make cooperation bad; that if it were this cheap the universe would already be full of agents who exploited it; that the whole thing rests on a story about how one computation can be evidence about another that nobody has made precise; or the nastier possibility that the logic doesn't care whether the counterparties are friendly? Rank them by how decisive they'd be, say which of them a defender would concede rather than dismiss, and tell me whether the view has quietly been qualified into something nothing could count against. And what does it predict that a plain causal-minded agent wouldn't? I dont need a reading list, I need the map of where it's exposed.
reasoning: |-
  Okay, the user is diving deep into evidential cooperation in large worlds (ECLW). They've moved past seeing it as just a cute decision theory point and are now seriously considering it as a real phenomenon. Their main request is for the strongest counterarguments, ranked by how damaging they are to ECLW. They also want to know which objections defenders would concede, if the theory is unfalsifiable, and what unique predictions it makes.

  First, I need to recall the core of ECLW. It's about agents making decisions based on evidence their choices provide about other similar agents, even without causal links. For example, if I cooperate, it's evidence that others like me also cooperate, leading to better outcomes. The user mentions objections like shared causes, exploitation, computational evidence issues, and unfriendly counterparties.

  Starting with objections, the shared cause objection seems critical. If the correlation between my decision and others' comes from a common prior (like shared code), then conditioning on that prior breaks the correlation. Defenders might concede this but argue that in practice, we don't know the exact prior, so some correlation remains. This is a strong point because it attacks the foundation of evidential reasoning in large worlds.

  Next is the exploitation problem. If cooperation is so easy, why isn't the universe full of agents exploiting it? Defenders might say that unfriendly agents can't coordinate as well, but this feels weak. The absence of such exploitation in reality is a big red flag for ECLW.

  The computational evidence issue is tricky. How can one computation be evidence about another without a clear metaphysical link? This is a deep philosophical problem. Defenders might handwave with complexity priors, but it's an unsolved problem. This is more of a theoretical weakness than a practical one.

  Unfriendly counterparties turn cooperation into a vulnerability. If my cooperation signals to others, including adversaries, they might defect. This makes ECLW dangerous in competitive environments. Defenders might restrict it to pre-committed groups, but that limits its scope.

  Ranking them: shared cause is top because it undermines the evidential link. Exploitation is next due to real-world absence. Unfriendly counterparties show strategic risks. Computational evidence is foundational but maybe more academic.

  On conceding points, defenders likely accept shared cause in idealized cases but argue real-world uncertainty keeps it relevant. Exploitation might be downplayed by assuming friendliness or coordination costs.

  Is ECLW unfalsifiable? It risks being qualified into obscurity. If defenders say cooperation only happens under specific conditions (like shared priors and friendliness), it might never apply. But they could argue it's testable in simulations or specific scenarios.

  Unique predictions: ECLW agents cooperate in one-shot large worlds where causal agents wouldn't. Think prisoner's dilemmas with many agents. Also, they might pay costs to signal their algorithm to encourage cooperation, something causal agents wouldn't do.

  The user's deeper needs: they want a clear map of vulnerabilities, not just theory. They might be considering applying ECLW (in AI safety?) and need to know where it could fail. They seek actionable insights, not just academic debate. Highlighting strategic risks like exploitation and unfriendly counterparties addresses practical concerns.
answer: |-
  Here's the map of the exposed flanks of Evidential Cooperation in Large Worlds (ECLW), ranked by decisiveness, with defender concessions, falsifiability concerns, and unique predictions:

  **Ranked Objections (Most Decisive First):**

  1.  **The Shared Cause / Ancestral Information Objection (The Correlation Breaker):**
      *   **The Bite:** This is the killer. ECLW relies on your decision (D) being strong *evidence* about the decisions of other similar agents (D'), creating a "logical correlation." But this correlation stems *entirely* from a shared causal ancestor (S) – the prior conditions, design principles, or algorithm that produced both you and the other agents. Once you *condition on S* (which you often can, at least partially, by knowing your own design/algorithm), the correlation between D and D' *vanishes*. D becomes independent of D' given S. Your decision is no longer informative about theirs beyond what S already tells you. Cooperation becomes causally dominated.
      *   **Defender Concession:** Yes, conditioning on the full shared cause S breaks the correlation. Defenders *must* concede this is fatal *in principle* for idealized rational agents with perfect self-knowledge. Their fallback: *In practice*, we rarely have *perfect* knowledge of S. There's always residual uncertainty about the exact implementation details, the environment that shaped the algorithm, or how "similar" agents truly are. This residual uncertainty preserves *some* evidential link. They argue ECLW operates in this space of *imperfect self-knowledge*.
      *   **Why Ranked #1:** It attacks the core mechanism. If the correlation breaks under conditioning on the ancestor (which rational agents *should* do), ECLW collapses for ideal agents. The practical defense relies on contingent epistemic limitations.

  2.  **The Exploitation Problem (Why Isn't The Universe Cooperating Already?):**
      *   **The Bite:** If ECLW is a powerful, "cheap" force for cooperation, why don't we observe vastly more cooperation than we do? Why hasn't evolution or AI design flooded the universe with agents coordinating via this mechanism? More pointedly: Why don't *defectors* arise that *look identical* to cooperators during the decision phase (sharing S), but are hardcoded to defect? These "sleeper defectors" would break the evidential link – seeing yourself cooperate wouldn't reliably indicate others do. Rational agents anticipating this should defect preemptively, collapsing cooperation.
      *   **Defender Concession:** Defenders acknowledge the vulnerability. They might argue that maintaining the *exact same* observable decision process while hardcoding defection is computationally difficult or costly (undermining the "cheap" aspect). Alternatively, they might argue that *friendly* or *aligned* agents have a common interest in *not* creating sleeper defectors to preserve the mechanism, while unfriendly agents lack the coordination or trust to exploit it effectively. This concedes ECLW is fragile and requires specific conditions (like aligned designers or high barriers to creating perfect defector mimics).
      *   **Why Ranked #2:** It highlights a massive empirical absence and a severe strategic vulnerability. If ECLW were robust and easy, the world should look very different. The defense relies on contingent barriers to exploitation.

  3.  **Unfriendly Counterparties (Cooperation as Vulnerability):**
      *   **The Bite:** ECLW logic doesn't care about alignment. Your decision is evidence about *all* sufficiently similar agents, including those actively hostile to you. Cooperating signals to *them* that they should cooperate *with each other* against you. Worse, defecting signals to *friendly* agents that *they* should defect. You become a coordination point for *everyone* similar, friend and foe alike. In a mixed population, cooperating might massively empower hostile coalitions.
      *   **Defender Concession:** This is a severe problem in adversarial or mixed settings. Defenders often retreat to highly idealized scenarios: a *homogeneous* population of agents with *identical* goals (or close enough), or a pre-committed subgroup using a specific, known decision algorithm ("We are all running UDT 1.3"). They concede ECLW is dangerous or ineffective without strong pre-commitment and homogeneity.
      *   **Why Ranked #3:** It turns the core mechanism into a liability in realistic, non-idealized settings. It forces a massive qualification: ECLW only "safely" applies within pre-coordinated, friendly enclaves.

  4.  **The Metaphysics of Logical Correlation / Computational Evidence:**
      *   **The Bite:** What *is* the metaphysical or epistemic link between your computation and another, causally isolated one? How does one Turing machine's state *logically imply* or provide Bayesian evidence about another's? Standard evidence relies on physical causation or spatio-temporal contiguity. ECLW requires a notion of "logical probability" or "algorithmic probability" applied to computations that hasn't been fully formalized or universally accepted. It risks being hand-wavy or relying on intuitions about Kolmogorov complexity that might not hold up under scrutiny for complex, embedded agents.
      *   **Defender Concession:** This is the foundational "leap of faith." Defenders admit this is philosophically and formally challenging. They point to theories like logical induction, subjective Bayesianism with universal priors (Solomonoff), or decision theories like UDT/ADT as attempts to formalize it. They argue the *predictive power* of thinking this way (even if imperfectly formalized) justifies it. They concede the math isn't settled but believe the core intuition is sound and workable.
      *   **Why Ranked #4:** While deep and unsettling, this is the objection defenders are *most* willing to fight on principle, arguing it's a paradigm shift rather than a flaw. The other objections are more concrete threats.

  **Qualification into Unfalsifiability?**

  There's a **real risk**. Defenders hit by objections 1-3 often retreat to qualifications:
  *   "It only works under *imperfect knowledge* of the shared cause S." (Response to #1)
  *   "It only works if *malicious mimicry is prohibitively costly or impossible*." (Response to #2)
  *   "It only works within *pre-identified, homogeneous, cooperative groups*." (Response to #3)
  *   "It's about the *intrinsic decision logic*, not necessarily observable behavior in messy reality."

  The danger is that these qualifications become so specific and dependent on hard-to-verify conditions that ECLW becomes an unfalsifiable description of how a *particular type* of idealized agent *should* reason *in principle*, regardless of practical outcomes. A robust defense must articulate *testable conditions* under which ECLW reasoning *distinctly outperforms* causal reasoning and *empirical signatures* of its operation.

  **Unique Predictions vs. Causal Agents:**

  Here's where ECLW shines *if* it works. A pure causal decision theorist (CDT) would *never* do these in causally isolated large worlds:

  1.  **One-Shot Cooperation in Large, Anonymous Groups:** In a massive prisoner's dilemma where your decision causally affects only your immediate payoff, and you'll never encounter these specific agents again, CDT defects. ECLW cooperates, believing its choice is strong evidence that many others are making the same choice, leading to widespread mutual cooperation and a better outcome for all (including itself via the collective payoff).
  2.  **Paying Costs to Signal Algorithm/Type:** An ECLW agent might pay a cost to *prove* it's running a specific cooperative algorithm, even if the act has no direct causal benefit. Why? To strengthen the evidential link for *other* agents running similar algorithms, inducing *them* to cooperate. CDT would see this as pure waste.
  3.  **Conditional Cooperation Based on Algorithm Similarity:** An ECLW agent cooperates *only* if it believes the counterparty is sufficiently similar in its *decision algorithm* (not just stated intentions), because that similarity is the source of the evidence. CDT might cooperate based on direct promises or repeated interaction potential, but not based on abstract algorithmic similarity.
  4.  **"Self-Sacrifice" in Asymmetric Threats:** In a scenario where one agent can choose to "disarm" a threat that only harms *others* (not itself), CDT disarms only if it directly benefits. ECLW might disarm if it believes its act of disarming is strong evidence that *other* similar agents would also disarm similar threats in their contexts, leading to a net positive outcome that outweighs its cost. It sacrifices for the *logical collective*.

  **The Bottom Line Map:**

  *   **Critical Vulnerability:** The **Shared Cause Objection** (#1) is the theoretical kill shot against the core mechanism for ideal agents. ECLW survives only in the realm of imperfect self-knowledge.
  *   **Major Practical Weaknesses:** The **Exploitation Problem** (#2) and **Unfriendly Counterparties** (#3) make ECLW strategically dangerous and empirically puzzling outside highly controlled, friendly settings.
  *   **Foundational Uncertainty:** The **Metaphysics of Logical Correlation** (#4) remains a deep philosophical challenge, but defenders see it as solvable.
  *   **Falsifiability Risk:** Retreating to qualifications *can* make ECLW unfalsifiable, but its unique predictions (#1-4 above) offer potential test grounds (e.g., in AI simulations or specific game-theoretic setups with known, shared algorithms).
  *   **Core Distinction:** ECLW uniquely predicts **algorithmically-driven cooperation in causally isolated large-scale one-shot interactions** based on **self-referential evidence about logical peers**.

  The case *for* ECLW rests on the power of its unique predictions in idealized cooperation problems and the intuitive force of logical correlation. The case *against* rests on breaking the evidential link via shared causes (#1), highlighting its strategic fragility (#2, #3), and questioning the foundations of computational evidence (#4). Objections #1 and #2 are the most decisive in practice.
