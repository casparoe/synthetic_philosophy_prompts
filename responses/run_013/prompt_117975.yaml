answer: |-
  Here's your thought experiment, built to specification:

  ### The Case: Mimic Compounds
  **Home World (Actual):**  
  Glim is pure zinc chloride (ZnCl₂). It naturally occurs as a waxy, pale solid in the local mines. It melts at body temperature (29°C), releases HCl fumes (smelling faintly of sulfur) that cause drowsiness, and burns green due to zinc's emission spectrum. Miners identify it solely by these observable features.

  **Other World (Counterfactual):**  
  Identical surface properties arise from a different source. Deposits consist of **calcium hypochlorite (Ca(OCl)₂) mixed with trace sulfides**. Heat from handling decomposes hypochlorite into chlorine gas (causing drowsiness) and quicklime, creating a melting *illusion*. Sulfides burn green when ignited. Miners here use "glim" identically—for the waxy solid with these effects.

  ### Key Features
  - **Natural Kind Term**: Miners use "glim" extensionally (pointing to deposits with these properties), not via description or stipulation.  
  - **Separation**: The description (melts when held, green flame, etc.) doesn’t entail ZnCl₂ *or* Ca(OCl)₂+sulfides. Either chemistry can produce identical macrosopic effects.  
  - **No Cheats**: Both compounds exist terrestrially. No Twin Earth, sci-fi, or indexicals.  
  - **Realism**: Zinc chloride and calcium hypochlorite/sulfide mixtures both exhibit these properties in controlled conditions.  

  ---

  ### Truth-Value Matrix
  |                          | Home World (ZnCl₂) | Other World (Ca(OCl)₂ + sulfides) |
  |--------------------------|---------------------|-----------------------------------|
  | **Primary Intension**    | True               | True                             |
  | **Secondary Intension**  | True               | False                            |

  #### Explanation:
  - **Primary Intension (world-relative)**: In *any* world, ask: "Does the stuff locals call 'glim' (based on the descriptive features) have chemical structure [X]?"  
    - Home World: Glim = ZnCl₂ → **True**.  
    - Other World: "Glim" = Ca(OCl)₂ mixture → "Glim is ZnCl₂" is **False**, but "Glim is Ca(OCl)₂+sulfides" is **True**.  
    → Thus, "glim is ZnCl₂" is **True** only if [X] matches the *local* chemistry.  

  - **Secondary Intension (home-world-anchored)**: Fix the reference to what "glim" *actually* is (ZnCl₂). Ask: "In this world, is that *same substance* [ZnCl₂] present?"  
    - Home World: ZnCl₂ exists → **True**.  
    - Other World: ZnCl₂ is absent; a mimic compound exists instead → **False**.  

  ---

  ### Critical Feature & Risks
  **Doing the Work**: The description fixes reference to *whatever underlies the observable properties*, but multiple distinct compounds can satisfy those properties. Remove this, and the case collapses (e.g., if green flame *only* occurs with zinc, separation fails).  

  **Kripke/Putnam Defense**:  
  A defender would argue that in the Home World, miners "baptized" ZnCl₂, so glim’s essence is necessarily ZnCl₂. They’d attack by claiming:  
  > *"The descriptive features are epistemic tools to identify glim, but glim’s *essence* is its microstructure (ZnCl₂). In the Other World, the mimic isn’t glim—it’s a different substance falsely labeled 'glim'."*  

  **Rebuttal**:  
  This assumes the initial baptism isolated a pure compound. But miners never isolated microstructure—they named *the mineral deposit* exhibiting the features. If mimics exist, "glim" refers to a *functional kind* (defined by effects), not a microstructural kind. The case holds if the community’s use doesn’t presuppose microstructure.  

  **Collapse Risk?**  
  No. Unlike water/H₂O (where surface properties *reliably* indicate H₂O), here the description doesn’t uniquely pick one compound. It’s not a trivial description-disguised-as-kind; it’s a genuine kind term with ambiguous reference.  

  ---

  Verdict: Primary reading---true in both worlds; Secondary reading---true in home world, false in other world
