prompt: |-
  Okay so me and a friend have been going back and forth about Aumann's agreement theorem and I want an actual number out of you, not a vibe. Her position is that the theorem has basically zero bite for real disagreement — it's a conditional whose antecedent (common prior, common knowledge of each other's posteriors, perfect Bayesian rationality) never holds in the wild, so citing it at someone you disagree with is just changing the subject. Her other move, which I actually think is the more interesting one, is that invoking it is self-undermining: to use it you have to already accept a framework in which you two are guaranteed to converge given enough shared evidence, so it can't be the thing that explains why you havent converged. I think she's overdoing it — I'd put maybe 0.65 on 'the theorem tells us something genuine about when two real people who disagree are doing something epistemically off', she's at about 0.1.

  Whats your credence, and decompose it: how much rides on whether a common prior is a defensible idealization versus a substantive empirical assumption, how much on whether common knowledge of each other's posteriors is achievable outside toy models, how much on whether the theorem's notion of rationality is the one we care about, and whatever else belongs in the product. Number plus one line of justification for each term, then the combination. Then tell me which term your final number is most sensitive to, what evidence or argument would move it most, and — plainly — which one of us is most likely misreading the theorem.
