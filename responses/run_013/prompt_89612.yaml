  ### **Joint Statement on the Trolley Problem Disputes**

  We, the undersigned, agree on the following claims regarding the trolley cases and the underlying distinctions:

  1. **Intuitive judgments in standard cases**:  
     - Flipping the switch (diverting the trolley to kill one instead of five) is permissible.  
     - Shoving the fat man (pushing him to stop the trolley) is impermissible.  
     - Cutting up the one healthy person to save five dying patients is impermissible.  

  2. **Definition of the doing/allowing distinction**:  
     - **Doing harm**: Actively initiating a new causal sequence that directly brings about harm (e.g., pushing the fat man creates a new threat).  
     - **Allowing harm**: Refraining from intervening in an existing causal sequence, such that harm occurs without your direct causation (e.g., not flipping the switch would allow the trolley to kill the five).  

  3. **Definition of the intent/foresight distinction (from double effect)**:  
     - **Intended harm**: Harm is part of the agent’s plan and is either an end in itself or a means to an end (e.g., cutting up the one person requires their death as a means to harvest organs).  
     - **Merely foreseen harm**: Harm is anticipated as a side effect but is not part of the agent’s plan or necessary to achieve the good outcome (e.g., diverting the trolley foresees the one’s death but does not use it as a means).  

  4. **Correlation in standard cases**:  
     In flipping the switch, the harm is both *done* (active redirection) and *foreseen* (not intended). In shoving the fat man, the harm is both *done* (active pushing) and *intended* (as a means). This overlap explains why both distinctions initially appear explanatory.  

  5. **Independence of distinctions**:  
     The two distinctions are conceptually distinct and can come apart empirically. It is possible to have:  
     - Harm that is *done* but *only foreseen* (e.g., actively causing harm as an unintended side effect).  
     - Harm that is *merely allowed* but *intended* (e.g., intentionally refraining from preventing harm to achieve a goal).  

  6. **Verbal dispute identified**:  
     Past disagreements about "causation" were often verbal. When Colleague A (Doing/Allowing) uses "cause," they mean *initiating a new causal sequence*. When Colleague B (Intent/Foresight) uses "cause," they mean *intentionally producing harm as part of a plan*. This conflates active intervention with intentionality, leading to talking past each other. The agreed definitions above resolve this.  

  We disagree on which distinction is fundamental to explaining the pattern of intuitions in trolley cases and beyond. The table below summarizes our positions, worded as each would accept, and includes two crux cases where the distinctions diverge. For each crux, we state our predictions in advance.  

  | **Issue** | **Colleague A (Doing/Allowing Proponent)** | **Colleague B (Intent/Foresight Proponent)** |
  |-----------|-------------------------------------------|---------------------------------------------|
  | **Core position** | The doing/allowing distinction is primary. Permissibility hinges on whether harm is actively brought about or merely allowed. Intention is secondary; e.g., flipping the switch is permissible because it redirects an existing threat (allowing harm to the one), while shoving is impermissible because it creates a new threat (doing harm). | The intent/foresight distinction is primary. Permissibility hinges on whether harm is intended as a means or merely foreseen. Physical causation is secondary; e.g., flipping the switch is permissible because the harm is unintended, while shoving is impermissible because the harm is intended as a means. |
  | **Crux Case 1: Harm done but only foreseen**<br><br>*Case: The Careless Driver*<br>You are driving a train to deliver organs that will save five lives. You foresee that your route will jostle a heavy object off a ledge, killing one worker. You do not intend the worker’s death; it is a side effect of saving the five. The harm is *done* (active driving causes a new threat) but *only foreseen*. | **Prediction: Impermissible.**<br>Reason: Harm is actively done (initiating a new causal sequence), which is harder to justify than allowing harm, even if unintended. This explains why cutting up the one is impermissible—it involves doing harm. | **Prediction: Permissible.**<br>Reason: Harm is not intended (only foreseen), and the action (saving five) has a good outcome. Double effect justifies it, as in flipping the switch. |
  | **Crux Case 2: Harm merely allowed but intended**<br><br>*Case: The Bridge Button*<br>A trolley will kill five unless stopped by a fat man falling from a bridge. A button prevents the fall. You *refrain* from pressing the button (allowing the fall) because you intend the fat man’s death as the means to save the five. The harm is *allowed* (no new causal sequence) but *intended*. | **Prediction: Permissible.**<br>Reason: Harm is merely allowed (no active causation), so it is easier to justify. Intention alone does not override the permissibility of allowing harm (e.g., triage decisions). | **Prediction: Impermissible.**<br>Reason: Harm is intended as a means, which violates double effect. Allowing harm with intent is equivalent to doing harm with intent, as in shoving. |

  **Cruxes as Tests**:  
  - If *Crux 1 (Careless Driver)* is widely judged impermissible, it supports Colleague A. If permissible, it supports Colleague B.  
  - If *Crux 2 (Bridge Button)* is widely judged permissible, it supports Colleague A. If impermissible, it supports Colleague B.  

  We agree that these cases isolate the distinctions and will accept the results of empirical studies (e.g., surveys of ethicists or laypeople) on these cruxes as evidence for or against our positions.  

  Signed,  
  [Colleague A: Doing/Allowing Proponent]  
  [Colleague B: Intent/Foresight Proponent]  

