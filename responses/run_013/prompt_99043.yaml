prompt: |-
  I am looking for the name, if there is one, of a pattern I keep noticing, and I care more about its precise boundaries than about the label. The pattern is this: two people agree on every observable fact about a case and still disagree about what the case is — whether an unrequested recommendation is advice or manipulation, whether a drone strike is an act of war or a police action, whether a model's output is a prediction or a decision. Each party treats the new case as a version of some familiar case, and the real disagreement is over which familiar case should govern. When I try to talk someone out of their classification, I can only offer a different familiar case; I can never point to a fact that settles it, and each of us can go on producing fresh comparisons indefinitely, so the argument never reaches neutral ground. This seems stronger than framing, and unlike mere vagueness or equivocation, neither side is making a verbal mistake. I have a suspicion that the general phenomenon is not a special talent for metaphor but the basic operation of thought itself. Is there an established thesis to that effect? If the closest named views are family resemblance, prototype theory, or the claim that metaphor structures thought, explain how the thing I am describing differs from each and which fits best; if nothing fits, name and define it, and say what it commits one to and what it rules out. A bare name would leave me where I started.
reasoning: |-
  Okay, I'm diving into this user's query about a specific pattern of disagreement. They describe situations where two people agree on all observable facts but still can't agree on how to classify something—like whether a drone strike is an act of war or a police action. The key point is that each person sees the case through the lens of a different familiar example, and the argument never resolves because there's no neutral ground. 

  The user wants to know if there's an established concept for this. They mention family resemblance, prototype theory, and metaphor theory as possibilities but want to know how their observation differs from these. They also suspect this might be fundamental to thought itself. 

  First, I recall Wittgenstein's family resemblance idea, where categories don't have strict boundaries but overlap like family traits. But in the user's examples, the disagreement isn't about blurred lines—it's about which prototype to apply. So family resemblance might not fully capture the active conflict between competing paradigms. 

  Next, prototype theory from Rosch. Here, categorization is based on similarity to a central example. But the user's cases involve two equally valid prototypes (e.g., advice vs. manipulation), and the disagreement is about which one fits better. Prototype theory explains graded categorization but doesn't address the rhetorical tug-of-war the user describes. 

  Then there's Lakoff and Johnson's conceptual metaphor theory, where we understand abstract concepts via physical metaphors (e.g., "argument is war"). The user's examples feel similar—like framing a drone strike through "war" or "policing" metaphors. But the user insists their pattern is stronger than framing and not just about language. Metaphor theory might come closest, especially if we think of paradigms as root metaphors. 

  The user's suspicion that this is fundamental to thought resonates with Kuhn's paradigms—where scientists see data through incompatible frameworks. In everyday life, we might have "cognitive paradigms" that shape how we interpret neutral facts. 

  Synthesizing this, "paradigmatic cognition" could name the pattern. It's the use of foundational analogies to structure understanding. This commits to cognition being analogical and non-neutral, ruling out pure empiricism. It fits best with metaphor theory but emphasizes the incommensurability Kuhn described. 

  The user's deeper need seems to be validating their intuition that this isn't just semantics but a core cognitive mechanism. They want precise boundaries—so distinguishing it from vagueness or framing was crucial. Their frustration with unresolved arguments suggests they seek not just a label but tools to navigate such disagreements. 

  I'll position paradigmatic cognition as the closest fit, explaining how it builds on but differs from each theory. The user might also appreciate implications: e.g., resolving such disputes requires paradigm negotiation, not fact-stacking.
answer: |-
  Based on your meticulous description—focusing on **agreement on facts, disagreement on classification rooted in competing prior analogies, inability to resolve via new facts, and the generative nature of the disagreement**—the closest established concept is **Cognitive Metaphor Theory**, particularly as developed by George Lakoff and Mark Johnson. However, your pattern differs in crucial ways from the alternatives you mentioned. Here's a breakdown:

  1.  **Family Resemblance (Wittgenstein):**
      *   **What it is:** Categories lack strict definitions but are held together by overlapping similarities (like family members sharing features without a single defining trait).
      *   **Difference:** Your pattern isn't primarily about the *fuzziness* of category boundaries. The disagreement arises *because* both parties are applying distinct, well-understood (but incompatible) prototypes/paradigms ("familiar cases") to the new case. It's a clash of *which* family resemblance network applies, not confusion within one network. Wittgenstein's concept explains category structure, not the dynamic clash you observe.

  2.  **Prototype Theory (Rosch):**
      *   **What it is:** Categorization is based on similarity to a central, most representative example (the prototype). Membership is graded (e.g., a robin is a "better" bird than an ostrich).
      *   **Difference:** While your "familiar cases" act like prototypes, your pattern emphasizes the *competition* between *two equally plausible but incompatible prototypes* for classifying the *same* instance. Prototype theory explains how we categorize *within* a frame of reference; your pattern is about the *selection of the frame itself* (i.e., which prototype governs). It also doesn't fully capture the generative, argumentative aspect where parties produce endless analogies.

  3.  **Conceptual Metaphor Theory (Lakoff & Johnson):**
      *   **What it is:** Abstract thought is fundamentally structured by systematic mappings from concrete, embodied source domains onto target domains (e.g., "Argument is War," "Time is Money"). These metaphors shape how we perceive, reason about, and talk about the world.
      *   **Why it Fits Best & How Your Pattern Extends It:**
          *   **Familiar Cases as Source Domains:** Your "familiar cases" function precisely as the *source domains* of conceptual metaphors. "Advice," "Manipulation," "War," "Police Action," "Prediction," "Decision" are abstract concepts understood via more concrete scenarios (the familiar cases).
          *   **Structuring Thought:** Your suspicion that this is "the basic operation of thought itself" aligns perfectly with Lakoff & Johnson's core thesis: conceptual metaphors are not just linguistic flourishes but fundamental cognitive structures.
          *   **Beyond Framing:** You note it's "stronger than framing." Conceptual Metaphor Theory explains *why*: Framing is a consequence. The underlying metaphorical mapping *structures* the frame. Choosing the source domain ("familiar case") dictates what aspects of the target situation are highlighted, hidden, and how inferences are drawn.
          *   **Agreement on Facts, Disagreement on Meaning:** This is central to metaphor theory. The "facts" are the target domain elements. The *meaning* and *evaluation* of those facts depend entirely on the source domain mapping applied. A drone strike's physical facts are neutral; mapping it to "War" vs. "Police Action" gives it radically different meaning and implications.
          *   **Generative, Irresolvable Conflict:** Metaphorical mappings are productive – once a mapping is chosen, inferences flow systematically from it. Arguing for one mapping ("It's like Police Action because...") vs. another ("It's like War because...") *is* generative and fundamentally irresolvable by pointing to *target domain facts alone* because the facts are interpreted *through* the mapping. Neutral ground doesn't exist because meaning is created *by* the mapping.
          *   **Not Verbal Mistake:** It's a deep cognitive difference in how the situation is conceptually structured, not a misunderstanding of word definitions.

  **The Named Pattern: Paradigmatic Cognition via Competing Source Domains**

  While Cognitive Metaphor Theory provides the strongest foundation, your description highlights a specific *manifestation* of it:

  1.  **Name:** **Paradigmatic Cognition** (or **Cognitive Paradigm Conflict**).
  2.  **Definition:** The process whereby understanding and classifying a novel or complex situation necessitates mapping it onto a pre-existing, structured cognitive model (a "familiar case" or source domain). Disagreement arises when multiple, incompatible source domains provide plausible but conflicting structures for interpreting the *same* set of observable facts. Resolution cannot be achieved solely by appealing to the facts of the target situation, as the meaning, significance, and classification of those facts are constituted by the chosen source domain mapping.
  3.  **Commits One To:**
      *   **The Non-Neutrality of Perception:** Facts are never perceived or interpreted in a cognitive vacuum; they are always structured by prior conceptual models.
      *   **The Centrality of Analogy:** Analogy (mapping from a source to a target) is not secondary but primary to fundamental cognition.
      *   **The Incommensurability Potential:** Radically different interpretations of the *same* data can be equally coherent internally, deriving from different foundational mappings.
      *   **The Generativity of Disagreement:** Arguments based on competing paradigms are inherently generative, as each side draws inferences and finds supporting analogies consistent with their chosen source domain.
      *   **The Limits of Empiricism:** Pure observation or accumulation of "facts" about the target situation cannot resolve paradigmatic disagreements; negotiation must occur at the level of the paradigms themselves (e.g., arguing *which* familiar case is *more appropriate* overall, considering consequences, values, etc.).
  4.  **Rules Out:**
      *   **Strict Definitionalism:** The meaning of categories like "advice," "war," or "decision" cannot be captured by necessary and sufficient conditions independent of contextual mapping.
      *   **Pure Empiricism/Logical Positivism:** The idea that meaning is derived solely from sensory data or logical operations on that data, independent of pre-existing conceptual structures.
      *   **Resolution by "Neutral Facts":** The belief that there exists some undisputed, paradigm-independent fact that can objectively settle which mapping is "correct."
      *   **Mere Vagueness or Ambiguity:** While vagueness exists, this pattern describes a deeper structural conflict, not simply uncertainty about borderline cases.
      *   **Purely Linguistic Disputes:** The disagreement is rooted in cognitive structure, not simply the dictionary definitions of words (though language reflects the structure).

  **In Summary:** Your pattern is best understood as an instance of **Conceptual Metaphor Theory** in action, specifically highlighting **Paradigmatic Cognition** or **Cognitive Paradigm Conflict**. It differs from Family Resemblance and Prototype Theory by focusing on the *active competition* between *entire, incompatible cognitive models* (source domains/familiar cases) used to structure the understanding of a situation, leading to irresolvable-by-facts disagreements about classification and meaning. It commits to the idea that thought is fundamentally analogical and structured by prior experience, ruling out the possibility of neutral, uninterpreted facts settling such disputes. This *is* core to how human cognition works.
