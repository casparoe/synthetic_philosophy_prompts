answer: |-
  ## Department of Criminal Intent
  **Plain-Language Guide for Jurors: Understanding Intent Under Revised Jurisprudence**

  **1. What does it mean to do something "intentionally" under this law?**
     An action is considered intentional if you carry out a deliberate behavior knowing that a particular outcome is a likely or possible consequence, even if that specific outcome was not your primary goal. Crucially, your *attitude* towards the outcome – whether you desired it, were indifferent to it, or even actively wished it *wouldn't* happen – does not automatically determine whether your action regarding that outcome was intentional. The law focuses on your awareness and your decision to proceed with the core action despite that awareness.

  **2. If I didn't want the outcome to happen, or actively hoped it wouldn't, can I still be found to have caused it intentionally?**
     Yes. A key principle of this revised understanding is that stated desire or opposition regarding a side effect is not determinative. If you were aware that a particular outcome (like harming or helping someone) was a likely result of your chosen action, and you proceeded with that action regardless of your stated wishes concerning the outcome, you may be found to have caused that outcome intentionally. Your decision to act, knowing the likely consequences, demonstrates the necessary intent, irrespective of personal preference.

  **3. Is there a difference in how intent is judged for harmful outcomes versus helpful ones?**
     Yes, the law recognizes a fundamental distinction in how intent is attributed based on the *nature* of the outcome. Jurors reliably, and therefore correctly under this framework, find:
     *   **Harmful Side Effects:** If your action foreseeably causes harm as a side effect, and you proceeded with the action aware of this likelihood, you intended the harm, even if you stated you did not desire it.
     *   **Helpful Side Effects:** If your action foreseeably causes a benefit as a side effect, and you proceeded with the action aware of this likelihood, you generally did *not* intend the benefit, even if you stated you did not desire it. Intent for positive outcomes requires a stronger demonstration that the benefit was a primary or direct goal of your action.

  **4. What if the outcome was the normal, expected thing to happen? Does that affect intent?**
     The concept of "normal" expectation is central to determining awareness, which is key to intent. If an outcome was a foreseeable, standard consequence of your action within the specific context – meaning it was the kind of result a reasonable person would anticipate as flowing normally from that behavior – then your awareness of this normal expectation is sufficient grounds for attributing intent (for harm) or negating it (for help), as outlined in Section 3. The law focuses on whether the outcome was *out of line* with the predictable consequences of the action as commonly understood in that situation. If it was a predictable consequence, awareness is presumed.

  **5. What about failed attempts? If I try to cause an outcome but fail, did I still intend it?**
     Absolutely. Demonstrating the *skill* or *capability* to bring about a harmful outcome through your deliberate actions is strong evidence of intent, even if the outcome itself did not materialize. If your actions clearly showed you knew how to cause the harm and took substantial steps intending to cause it (regardless of your stated feelings about it), but factors outside your control prevented the result, you still acted with intent. The attempt itself, driven by awareness and capability, constitutes the intentional act.

  **6. How is "intent" different from "motive"?**
     This is a critical distinction:
     *   **Intent:** Refers to *what* you deliberately set out to do or knowingly risked causing by your actions, and your awareness of the likely consequences. It's about the *nature of your action and its expected results*. (As defined in Sections 1-5).
     *   **Motive:** Refers to *why* you did something – your underlying reason, desire, or emotion (e.g., greed, anger, jealousy, love, a sense of duty). While motive can be relevant context, it is *not* an element of the crime itself. You can have a "bad" motive (greed) but lack intent for harm under this framework (if the harm wasn't a normal, foreseeable consequence you knowingly risked). Conversely, you can have a "good" or neutral motive (maximizing profit, efficiency) but still be found to have intended a harmful outcome if it was a normal, foreseeable consequence you knowingly risked by proceeding.

  **Conclusion:**
  This guide clarifies the revised standard for determining criminal intent. The law now aligns with the reliable patterns jurors naturally use to discern intent, particularly the distinction between harmful and helpful outcomes and the significance of foreseeable, normal consequences. Focus on the defendant's awareness of the likely results of their chosen action and their decision to proceed. Remember, stated desires or motives regarding side effects are secondary to this awareness and the decision to act. Your role is to determine whether the defendant acted with the intent defined above.
