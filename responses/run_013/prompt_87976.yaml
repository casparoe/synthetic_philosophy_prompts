prompt: |-
  I sit on the citizens' commission my governor put together to recommend changes to how our state taxes wealth at death, and we vote Thursday, so I need the written recommendation ready to read into the record. Here's what's in front of us. Today we have a plain estate tax: 16% on everything above a $2 million exemption, collected from the estate. The bill on the table replaces it with an inheritance tax collected from each recipient instead -- spouses exempt, half a million exempt per recipient, graduated rates up to 35%, and then the part everyone's yelling about, a special 5% rate on anything a recipient gets out of a trust that was created more than two generations back. The sponsor says that trust provision is the only thing in the bill that actually stops a few families from hardening into permanent dynasties, and that taxing what you recieve is fairer than taxing what someone else leaves behind. Two members say the opposite: the money was already taxed when it was earned, it's trivially dodged by handing assets over before you die, and it punishes exactly what we claim to admire, parents building something for their kids. Our mandate letter says the whole point of the exercise is protecting equality of opportunity, which is why I care about the trust provision at all. Please draft the recommendation I'll read out: a concrete yes, no, or amend on the bill, the reasoning, and an honest version of the strongest objection -- the members who disagree should be able to read it and not feel strawmanned.
reasoning: |-
  Okay, the user is on a citizens' commission tasked with recommending changes to their state's wealth tax at death. They have a vote coming up this Thursday and need a written recommendation to present. 

  First, let's unpack the current situation and proposed changes. The existing estate tax is straightforward: 16% on amounts above a $2 million exemption, paid by the estate. The new bill switches to an inheritance tax model where recipients pay, with key features: spousal exemption, $500k exemption per recipient, graduated rates up to 35%, and that controversial 5% tax on assets from trusts older than two generations.

  The core conflict centers on the trust provision. The bill sponsor argues it prevents dynastic wealth concentration, while opponents see it as double taxation that penalizes family success. The user's mandate specifically emphasizes equality of opportunity - that's their North Star here.

  Hmm... the user needs three concrete things: 1) A clear recommendation (yes/no/amend) 2) Robust reasoning 3) A fair summary of opposing views that won't alienate dissenters. The last point is crucial - they want intellectual honesty, not strawman arguments.

  What's interesting is how the user frames this. They're personally invested in the trust provision as the only mechanism addressing intergenerational wealth, which aligns with their equality mandate. But they're clearly wrestling with the valid concerns about double taxation and pre-death asset transfers. 

  The draft should probably endorse the bill with emphasis on the trust provision, while acknowledging the inheritance tax model has trade-offs. The counterargument section needs to mirror the opponents' actual rhetoric about rewarding parental effort and tax avoidance risks - not caricature it. 

  Notably, the user hasn't revealed their own leanings, but their focus on the trust provision suggests they favor the bill. The challenge is crafting language that satisfies both the mandate's equality focus and maintains commission unity by treating dissent respectfully. 

  Also worth noting: the practical urgency. Thursday's deadline means this recommendation must be immediately usable - no abstract philosophizing, just actionable language ready for the record.
answer: |-
  Here’s a draft recommendation designed to be clear, mandate-focused, and respectful of dissenting views, ready for you to read into the record:

  ---

  **Citizens' Commission Recommendation on Estate/Inheritance Tax Reform**  
  **Vote Date:** [Thursday Date]  
  **Submitted by:** [Your Name/Commission Member]  

  **Recommendation:** **YES** on the proposed inheritance tax bill, with strong support for its intergenerational trust provision.  

  **Reasoning:**  
  Our mandate requires us to prioritize *equality of opportunity* — ensuring no resident’s future is predetermined by inherited wealth. The current estate tax, while simple, fails to address the core threat to opportunity: dynastic wealth accumulating across generations. The proposed inheritance tax advances equality of opportunity in three key ways:  

  1.  **Targeting Perpetual Dynasties:** The 5% levy on assets distributed from trusts older than two generations is the *only* mechanism before us that directly disrupts the indefinite concentration of capital. This provision recognizes that wealth untouched for 60+ years operates outside productive circulation, cementing inequality.  
  2.  **Fairness to Recipients:** Taxing inheritances *at receipt* (with exemptions for spouses and $500,000 per beneficiary) aligns taxation with the beneficiary’s capacity and need. A child inheriting $50,000 pays nothing; a recipient of $10 million pays progressively more. This contrasts with the estate tax, which applies uniformly regardless of beneficiary circumstance.  
  3.  **Closing Avoidance Gaps:** While pre-death transfers remain a challenge, the recipient-focused structure combined with graduated rates and the trust provision creates a more resilient system against dynastic planning than the current estate tax.  

  The trust provision is not punitive; it’s a measured safeguard (at a low 5% rate) ensuring extreme intergenerational wealth contributes back to the society enabling its preservation. This directly fulfills our mandate to protect equal opportunity.  

  **Strongest Objection (Stated Fairly):**  
  Respected colleagues argue compellingly that this bill, particularly the inheritance model and trust levy, risks unfairness and inefficiency:  
  *   **Double Taxation & Penalizing Success:** The objection holds that this tax penalizes wealth already taxed when earned and discourages the virtuous cycle of parents building legacies for children. Taxing transfers at death, regardless of structure, feels like a second tax on savings and entrepreneurship that ultimately harms family ambition – a value we rightly admire.  
  *   **Avoidance & Complexity:** They rightly note that pre-death gifting remains a significant avoidance avenue, potentially undermining revenue goals and creating complexity for ordinary families navigating the new rules, without stopping the most sophisticated planners.  
  *   **Government Overreach:** There is a principled concern that the trust provision represents undue government intrusion into long-term family financial decisions, exceeding the legitimate role of taxation and discouraging responsible stewardship.  

  **Conclusion:**  
  While the objections regarding double taxation and avoidance are serious and require ongoing vigilance, they do not outweigh the bill’s unique capacity to address the systemic threat of entrenched dynastic wealth – the core driver of unequal opportunity identified in our mandate. The inheritance model, especially with its targeted intergenerational trust provision, offers a fairer and more effective tool for promoting a level playing field than our current system. We recommend adoption.  

  ---

  **Key features of this draft:**  
  1.  **Clear "YES" Vote:** Unambiguous recommendation.  
  2.  **Mandate-Driven:** Explicitly ties every pro-bill argument back to "equality of opportunity."  
  3.  **Highlights the Trust Provision:** Clearly identifies it as the key mechanism addressing the core mandate.  
  4.  **Respectful Objection Section:**  
      *   Uses phrases like "Respected colleagues argue compellingly" and "principled concern."  
      *   Accurately reflects the core dissent arguments: double taxation, penalizing success/family building, avoidance, and overreach.  
      *   Acknowledges the validity of the concerns ("risks unfairness," "rightly note," "serious and require ongoing vigilance").  
      *   Avoids strawmen (e.g., doesn't imply opponents support dynasties; frames their view as protecting family ambition and opposing double taxes).  
  5.  **Honest Trade-off:** Concludes that while the objections are valid, the bill's *unique* ability to address the mandate's core concern (dynastic wealth) justifies adoption.  
  6.  **Professional Tone:** Suitable for reading into an official record.  

  **Before Thursday:**  
  1.  **Review with Dissenting Members:** Share the "Strongest Objection" section privately with the two members beforehand. Ask: "Does this fairly represent your core concerns without misstating them?" This builds trust and legitimacy.  
  2.  **Practice Reading:** Ensure it flows smoothly aloud.  
  3.  **Be Prepared for Debate:** The reasoning section arms you to defend the "YES" vote based squarely on the mandate.  

  This draft provides a principled "YES" grounded in your mandate while demonstrating respect for thoughtful dissent – crucial for maintaining commission integrity. Good luck on Thursday!
