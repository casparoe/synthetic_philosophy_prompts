  ok so this is a slightly weird request. I'm in the last year of an econ PhD (public/political econ, mostly externalities and info aggregation) and I somehow ended up TAing for a political theory seminar this term, wich has been humbling, because I keep wanting to rewrite everything as a welfare problem. The bit we're on now is Mill and the harm principle -- roughly, that the only justification for coercing someone, whether by law or by social pressure, is to prevent harm to others, and that speech in particular shouldn't be restricted just because it's offensive or because the majority dislikes it. Here's what I want from you: take that position and its standard defences (the fallibility / free-exchange-of-ideas argument, the individuality-and-experimentation-in-living argument, the self-regarding vs other-regarding line, the exceptions he allows) and restate it as faithfully as you can in the vocabulary I actually use -- externalities, Pigouvian taxes vs Coasean bargaining, internalities, social welfare functions, information aggregation and signalling, consumer sovereignty, mechanism design. I'm fluent in that stuff so you can be technical, but please dont cheat and just relabel Mill as an economist who wants to maximize welfare subject to not overriding anyone's preferences, because I suspect that's a different view wearing the same clothes.

  Then the part I actually care about, the residue report. Which pieces translate cleanly (I'm guessing harm-as-negative-externality is the easy one, and that the free-exchange-of-ideas argument comes out as a claim about aggregating independent private signals, which I'd like spelled out properly, including what conditions it quietly needs)? Which pieces survive only with distortion? And what has no counterpart in my vocabulary at all? I have a hunch the harm/offence line and the anti-paternalism are the casualties, but I want to know if that's right and why. Two things I keep going back and forth on: (a) Coase seems to say harm is reciprocal -- the real question is which assignment of rights is cheapest or maximizes value -- which would make Mill's categorical line look like an arbitrary stopping point rather than a principled one; is that a genuine consequence of the vocabulary or am I just misusing Coase? And (b) in my vocabulary the analyst's welfare function quietly decides whose harm counts, which is exactly the thing the harm principle was supposed to settle without anyone having to make that judgement call -- so does harm survive translation as a category, or does it dissolve into the weights somebody chooses? For each bit of residue, tell me whether it's a defect of my vocabulary (something welfare econ can't represent but should) or evidence that Mill's claim was less determinate than it sounds. Don't be nice about it -- I'd rather find out the translation fails somewhere interesting than get a tidy mapping table.
