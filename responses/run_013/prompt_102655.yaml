prompt: |-
  I run a masters-level ethics seminar, 16 students, one 90-minute session, and I want an activity that makes them actually feel the nonidentity problem rather than just nodding along to it. Here's the scenario I want to hang it on: a coastal village must choose between keeping the village where it is and building a sea wall, or relocating the whole village inland. The twist is that the children who'd be born in the relocated village are not the same people as the ones who'd be born if it stays — different parents meet, different timing, that sort of thing. Under relocation some of those future people end up with lives that are plainly worse than anyone's in the stay-put version, but they only exist at all because of the relocation, and when you ask them they insist their lives are worth living. I want the group to walk into the wall where "you harmed me, you should have done otherwise" quietly stops making sense — and to feel how much they still want to say it — before anyone names the problem.

  Give me the rules, the materials (role cards, payoffs, whatever you think works), a minute-by-minute timeline, and a debrief that maps what happened onto the structure of the puzzle. Also tell me what'll predictably go wrong the first time I run it and how to handle it, and be straight with me about which bit of the idea the activity can't reproduce and that I'll have to supply myself. No lecture up front, and don't let the name slip till the debrief. British English please.
reasoning: |-
  Okay, the user is running a master's level ethics seminar and wants an activity to make students truly feel the nonidentity problem. They've given a coastal village scenario with a twist: relocating changes which children are born, leading to a situation where some people have worse lives but only exist because of the relocation. The goal is for students to encounter the logical wall where "you harmed me" stops making sense, but they still feel it should.

  First, I need to design an interactive activity that avoids upfront lectures and reveals the problem through experience. The core challenge is making abstract philosophy tangible. Students need to role-play villagers, face trade-offs, and feel the dilemma emotionally.

  Key elements from the query: 16 students, 90 minutes, no naming the problem until debrief. Must use British English. The activity should highlight that future people in the relocation scenario have lives worth living but worse than others, yet they can't claim harm since they wouldn't exist otherwise.

  Materials: Role cards for villagers, payoff sheets, maps. Role cards need backstories that influence their perspectives. Payoff sheets should clearly show life quality differences between options. Maps help visualize the choices.

  Timeline: Short intro (5 min), group work (40 min), debate (30 min), debrief (15 min). During group work, students discuss options and vote. The debate lets them argue, revealing their emotional responses to the "harmed" future villagers.

  Predictable issues: Students might not grasp the nonidentity twist immediately. Some might focus on practical issues like costs instead of the ethical dilemma. Solution: Circulate during group work, ask probing questions about future generations, and use the payoff sheets to highlight life quality differences.

  What the activity can't replicate: The abstract counterfactual of "never existing" is hard to feel. The debrief must clarify that non-existence isn't comparable to a bad life. Also, students might struggle with the moral residue feeling—knowing something's wrong but not having the words. The debrief should connect their frustration to the nonidentity problem.

  Debrief structure: Start with observations, then introduce Parfit's nonidentity problem. Map their experience to the puzzle's components: different future people, life worth living, no harm claim possible. Emphasize the discomfort they felt when "you harmed me" didn't apply but still felt responsible.

  Ensuring emotional engagement: Role cards with personal stakes (e.g., family legacies) can make students invested. The payoff sheets showing significant life quality drops for some in relocation will create tension. During debate, highlighting the "worse-off" villagers should evoke the desired conflict.

  British English: Use terms like "sea defence" instead of seawall, "high street" instead of main street. Ensure all materials reflect UK spelling and terminology.

  Final checks: Keep instructions clear, avoid jargon. The activity must fit the time frame. Debrief questions should guide students to articulate their frustration, linking it to the nonidentity problem without naming it prematurely.
answer: |-
  Here’s a fully structured, experiential activity designed to make the nonidentity problem visceral. The key is forcing students into the perspective of the "worse-off but still grateful" future generation before they realise the trap.

  **Activity Title:** *Coastal Crossroads*

  **Goal:** Create cognitive dissonance when students (as future villagers) try to claim harm from a decision that caused their existence, revealing the nonidentity problem through lived frustration.

  **Materials:**
  1. **Role Cards (16):** 
     - *Current Villagers (12 cards):* Short backstories influencing their vote (e.g., "Fisher: Relies on harbour access", "Elder: Fears disruption", "Parent: Worried about child's safety", "Farmer: Needs fertile inland soil"). 
     - *Future Villagers - Relocated (4 cards):* Clearly worse-off but content (e.g., "Mia (2040): Works long hours in the crowded new logistics hub; chronic respiratory issues from pollution. Earns just enough. Loves her community choir." "Ben (2040): Lost family fishing legacy. Struggles with manual labour job; chronic back pain. Adores his grandchildren."). Include the line: **"My life is hard, but it’s mine and it’s worth living. I’m glad I exist!"**
  2. **Option Sheets (2):** Laminated A3 posters.
     - *Option 1: Build the Wall:* "Massive cost (£££). Taxes high for 20 years. Current village preserved. Traditional jobs (fishing/tourism) continue. *Future Children:* Similar opportunities/lifestyles to now."
     - *Option 2: Relocate Inland:* "Govt grant covers relocation. New town built. Disruptive, community fragments initially. New industries (logistics/light manufacturing). *Future Children:* DIFFERENT people born. Some opportunities, but higher pollution, more stressful jobs, less community cohesion for many. *Important:* **The children born here are NOT the same individuals who would have been born if we stayed.**"
  3. **Payoff Charts (16 copies):** Simple table showing life quality metrics (Health, Job Security, Community, Stress, Overall) for "Current Gen", "Future Gen (Wall)", "Future Gen (Relocate - Average)", and **"Future Gen (Relocate - Worse-Off Subgroup)"** – the latter clearly the lowest, but still above "Unlivable" threshold. Use icons (e.g., 😊→😐→😟).
  4. **Map:** Coastal village vs. proposed inland site (showing lost beach, new industrial zone).
  5. **"Vote" Tokens:** Two colours (Blue=Wall, Green=Relocate).
  6. **Timer.**

  **Timeline (90 mins total):**
  1. **(00:00 - 5:00) Setup & Framing:** *"You are the council of Seagrove, a coastal village. Rising seas threaten your home. Today, you MUST decide: Build a massive sea defence wall or relocate the entire village 10 miles inland. This decision binds the community. You have 40 minutes to discuss and vote. Use your role perspectives and this data."* Distribute Role Cards, Option Sheets, Payoff Charts, Map. **Do NOT explain the future people twist beyond what's written.** Split into 3-4 small groups (mix roles).
  2. **(05:00 - 45:00) Group Deliberation:** Groups discuss options. Circulate. **Listen for:** Practical concerns (cost, jobs), emotional pulls (home, safety), nascent worries about future generations. **Subtly prompt if needed:** *"What does the data say about long-term wellbeing for different groups under each plan?"* *"Think about children born 20 years from now..."*. **Key moment (around 35:00):** Hand out the 4 *Future Villagers - Relocated* cards to 4 students (ideally those less engaged or representing diverse views). *"Some of you now represent the future generation living in the relocated Seagrove. Join the discussion – advocate for your existence and perspective!"*.
  3. **(45:00 - 75:00) Council Debate & Vote:** Reconvene whole group. Open floor debate. **Structure:**
     * Current Villagers argue (5 mins).
     * Future Villagers (Relocated) interject (3 mins - they should express hardship BUT also gratitude for existence: *"My lungs are ruined by the factory, but I met my wife building it! Don't regret the move!"*).
     * Rebuttals (5 mins - focus will likely turn to the Future Villagers' plight).
     * **Crucial Prompt (From Facilitator, ~60:00):** *"Future Villagers, some of you seem much worse off than anyone would be under the Wall option. Do you feel harmed by the decision to relocate? Should the council have chosen differently?"* **This is the wall.** Let them struggle. They *want* to say "Yes, you harmed me!" but their card states life is "worth living" and their existence depends on the move. Watch for frustration.
     * **Vote (65:00):** Secret ballot using tokens. Tally visibly. (The result is irrelevant; the tension is the point).
  4. **(75:00 - 90:00) Debrief:** *"Let's unpack what happened, especially that last question to the Future Villagers..."*
     * **Observation (5 mins):** *"What emotions did you feel during the debate, especially when the Future Villagers were challenged? What was hard about answering 'Did we harm you?'?"* (Target: Frustration, cognitive dissonance, feeling something was wrong but struggling to articulate why).
     * **Mapping to the Puzzle (7 mins):**
       * *"Under Relocation, who are the Future Villagers?"* (Different people, contingent on the move).
       * *"What's their situation?"* (Worse off than Wall-futures, but lives still worth living).
       * *"Could they logically say 'You harmed me by moving'? Why not?"* (No - they wouldn't exist otherwise; no 'them' to compare to in the Wall scenario; they aren't worse off than *they* would have been, because *they* wouldn't have been).
       * *"But did it *feel* like they were harmed? Did we feel responsible?"* (Yes! Intuition screams harm/fault).
     * **The Reveal (3 mins):** *"What you encountered is the **Nonidentity Problem**, coined by Derek Parfit. We make choices affecting *who* comes to exist. When someone's life, though flawed, is still worth living and depends entirely on our 'harmful' choice, our standard concepts of harming and wronging (relying on comparing the same person better/worse off) collapse. Yet the moral unease remains. It challenges how we think about obligations to future generations in climate policy, genetic screening, or resource depletion."*

  **Predictable Problems & Fixes:**
  1. **Problem:** Students miss the future people twist, treating them as identical.  
     **Fix:** Circulate *aggressively* during group work. Ask directly: *"Under Relocation, are the future villagers the *same* people as under the Wall? What does the Option Sheet say?"* Point to the bold text.
  2. **Problem:** Future Villagers don't defend their existence passionately ("It's just a game").  
     **Fix:** Cast engaged students in these roles. Pre-brief them subtly: *"Your character genuinely values their life despite hardships. Argue for it!"*.
  3. **Problem:** Debate gets stuck on practicalities (cost, engineering).  
     **Fix:** Use the Payoff Chart: *"Set aside feasibility for now. Focus on wellbeing outcomes for different groups, especially the futures."* Interrupt: *"Council, what does this mean for intergenerational justice?"*.
  4. **Problem:** A student blurts out "It's the nonidentity problem!".  
     **Fix:** *"Interesting point! Let's table the theory until we've all *felt* the dilemma. What would *your character* say right now?"*.
  5. **Problem:** Time runs short.  
     **Fix:** Strict timekeeping. Sacrifice some group discussion or shorten initial speeches. The critical moment is the **Future Villager Q&A**.

  **What the Activity Can't Replicate (Requires Your Input):**
  * **The Profound Abstract Weight of "Never Existing":** The activity makes "existence-dependent-on-choice" logically clear, but the *metaphysical weirdness* and *emotional neutrality* of "never having existed" vs. the visceral reality of a suffering person is abstract. Students might still feel *"It's better for the worse-off person to exist!"* without fully grappling with Parfit's point that there's **no "better for"** *a specific person* in the nonidentity case. You'll need to clarify this counterintuitive point in the debrief: *"We're not comparing existence vs non-existence for Ben. We're comparing: 1. Ben exists with a hard life. 2. Ben never exists. Can we say #1 is *worse for Ben*? What is Ben's state in #2? There is no Ben to be deprived."*

  **Why this works:** By embodying the future person who is *both* worse-off *and* grateful to exist, students hit the logical contradiction of claiming harm head-on. The frustration when they can't articulate the wrongness they feel *is* the learning moment. The debrief then names and frames that visceral experience as the nonidentity problem. Good luck!
