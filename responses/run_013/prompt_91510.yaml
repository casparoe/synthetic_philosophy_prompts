prompt: |-
  I'm applying for a small interdisciplinary fellowship (philosophy of biology + astrobiology people, six months, basically one paper's worth of money) and I want to pitch something about the definition of life -- but not the standard "is a virus alive" seminar paper, everyone's seen that.

  My half-formed angle: people argue about which single criterion is the right one -- metabolism, replication, evolution by natural selection, autonomy, whatever -- as if the question were just which criterion wins. I think the debate is stuck for a different reason. The word "life" is doing at least three different jobs and the argument slides between them without noticing: (a) picking out a natural kind that's supposed to be out there in the world independently of us, (b) marking out a homeostatic property cluster where nothing is strictly necessary but a bunch of features tend to hang together and reinforce each other, and (c) working as a practical/decision-theoretic label -- the kind of thing we should protect, or study, or worry about building. On top of that I think there's a second confusion underneath: the question of what *makes* something alive versus the question of how we'd *detect* or recognize it, and those two pull the criteria in opposite directions (the detectability criteria want something measurable and operational, the metaphysical ones want whatever actually does the work). The borderline cases only look intractable because nobody says which of these jobs the proposed definition is answering.

  Turn this into the actual proposal. I need: the central question stated precisely enough that it has a determinate answer, or a determinate reason to think there isn't one; why the existing positions don't settle it; the method -- what I'd actually do, week by week over the six months, since this is mostly conceptual so I need to be honest about what the "work" even consists in; what a successful result would look like versus what would count as the project failing; and how to keep the scope from ballooning, because I know the borderline-case zoo (viruses, plasmids, prions, transposons, fire, crystals, weird synthetic cell-ish things, software agents) could eat the whole six months if I let it.

  Couple of constraints: no citations, no reading list -- I'll add those myself, and please don't just tell me to go read the standard papers. I want the framing and the argument structure, not a bibliography. And don't lean on super obscure ideas a general reader wouldn't know; keep it to positions and arguments I can actually state in a sentence or two.
reasoning: |-
  Okay, let me tackle this fellowship proposal request. The user wants to pitch a fresh take on defining life, moving beyond tired debates about viruses. Their core insight is fascinating - that "life" serves multiple distinct functions (natural kind, cluster concept, practical marker), and that confusion between these roles causes the definitional stalemate. 

  Hmm, they've clearly identified a genuine gap in the literature. Most definitions treat "life" as having a single purpose, but in practice we use it differently across contexts. Their second insight about the distinction between constitutive features versus detection criteria is equally sharp. 

  The challenge is structuring this into a viable six-month project. I need to:
  - Define a precise central question that doesn't just rehash old debates
  - Show why current approaches miss the mark
  - Outline concrete weekly tasks (tricky for conceptual work)
  - Set clear success/failure metrics
  - Avoid getting bogged down in borderline cases

  For the central question, I'm considering: "What distinct roles does the concept 'life' play across scientific and philosophical contexts?" This avoids chasing one universal definition. The novelty is analyzing why we need the concept rather than what it contains.

  The methodology should show progression: first diagnosing current failures (month 1), then modeling each function separately (month 2-3), finally synthesizing implications (month 4-6). I'll explicitly allocate limited time to borderline cases - say 2 weeks max as test probes.

  Success would mean mapping the conceptual landscape so clearly that future debates must specify which role they're addressing. Failure would be collapsing back into standard definitional arguments. 

  Key scope guards: 
  - Treat borderline cases as diagnostic tools, not the focus
  - Restrict practical applications to astrobiology/ethics prototypes
  - Build minimal models, not comprehensive taxonomies

  The user's clearly done their homework - their frustration with superficial "virus alive?" papers is palpable. They'll appreciate a structured approach that values conceptual clarity over exhaustive examples. The tone should match their no-nonsense, precision-focused style.
answer: |-
  Here’s a focused fellowship proposal structure based on your insights, designed to avoid common pitfalls while leveraging your novel angle:

  **Proposal Title:**  
  The *Work* of "Life": Disentangling Conceptual Roles in the Definitional Debate  

  **Central Question:**  
  *Why does the debate over defining "life" remain intractable despite decades of refinement, and how can clarifying the distinct *roles* the concept plays resolve this deadlock?*  
  **Determinate Answer/Outcome:** Either:  
  (A) Identification of 3-4 mutually incompatible but internally coherent conceptual roles for "life" (resolving the debate by showing it's ill-posed), OR  
  (B) Demonstration that one role is primary and others derivative (reframing the debate), OR  
  (C) Proof that conflation itself is necessary for the concept's scientific utility (a meta-resolution).  

  **Why Existing Positions Fail:**  
  Current definitions assume "life" serves a single purpose (e.g., carving nature at its joints). They treat borderline cases as puzzles to be solved by adding/removing criteria, rather than symptoms of deeper *functional ambiguity* in the concept itself. Your tripartite distinction (Natural Kind / Homeostatic Cluster / Practical Marker) + the Constitutive/Detective split reveals why:  
  1. **Natural Kind** seekers prioritize essentialist constitutive features (e.g., "autopoiesis").  
  2. **Detectors** prioritize operationalizable features (e.g., "metabolism + evolution").  
  3. **Practical actors** need context-dependent markers (e.g., "worth bio-containment").  
  Arguments talk past each other because they’re answering different questions.  

  **Method & Timeline (6 Months):**  
  *Focus: Conceptual analysis, modeling functional roles, testing against minimal cases. Avoid exhaustive taxonomy-building.*  

  - **Month 1: Diagnostic Phase**  
    - Week 1-2: Map major definitional strategies onto your framework (NK/HPC/Practical; Constitutive/Detective). Identify core tensions.  
    - Week 3-4: Build "minimal conflict cases" – simple thought experiments where roles *clearly* demand different criteria (e.g., a highly detectable but non-autonomous entity vs. a constitutive-but-undetectable one).  
    - *Deliverable:* Schema of conceptual tensions and prototype cases.  

  - **Month 2-3: Role Modeling Phase**  
    - Week 5-8: Develop separate "role-specific definitional models":  
      - *Model NK:* What would a purely constitutive, natural-kind definition require? (Focus: metaphysical coherence).  
      - *Model HPC:* What does a cluster-based definition optimize for? (Focus: statistical robustness, family resemblances).  
      - *Model Practical:* What constraints shape operational/pragmatic definitions? (Focus: context-sensitivity, decision theory).  
    - Week 9-12: Test models against *2-3 curated borderline cases* (e.g., viruses + 1 synthetic/system case). Not to "solve" them, but to see:  
      - Which model handles the case most coherently?  
      - Where does conflation worsen confusion?  
    - *Deliverable:* 3 distinct definitional templates + analysis of their strengths/weaknesses in borderline cases.  

  - **Month 4-6: Synthesis & Implications**  
    - Week 13-16: Investigate whether the roles can be:  
      - *Hierarchized* (e.g., is Practical dependent on HPC, or NK foundational?).  
      - *Integrated* (e.g., is a "core" constitutive definition necessary for coherence?).  
      - *Radically separated* (e.g., should we abandon a unified concept?).  
    - Week 17-20: Draft paper articulating:  
      - Why conflation persists (e.g., historical, psychological, institutional incentives).  
      - How specifying the role clarifies debates (applied to 1-2 current controversies in astrobiology/philosophy).  
      - Normative guidance: When should scientists prioritize which role?  
    - Week 21-24: Refine paper, develop "decision tree" for choosing definitional frameworks based on context.  
    - *Deliverable:* Draft manuscript + pragmatic framework for role-aware definitions.  

  **Success vs. Failure Criteria:**  
  - **Success:**  
    - A peer-reviewed paper demonstrating that definitional stalemates *dissolve* when roles are specified.  
    - A clear, actionable framework showing *how* to choose/construct definitions for specific purposes (e.g., "For Mars rover instrument design, use *Detection-Optimized HPC*; for AI ethics debates, use *Constitutive Autonomy + Practical Significance*").  
    - Recognition by reviewers: "This explains why my field talks past yours."  
  - **Failure:**  
    - Merely cataloging more borderline cases without advancing the conceptual framework.  
    - Providing only a negative critique ("everyone is confused") without positive tools.  
    - Failing to distinguish *your* role-based approach from existing "pluralist" or "contextualist" definitions (which often still seek unity).  

  **Scope Control:**  
  1. **Borderline Cases as Probes, Not Subjects:** Use only 2-3 paradigmatic examples (e.g., virus + synthetic cell + software agent) purely to *test* the framework. No surveys of the "zoo."  
  2. **Role-Limited Analysis:** When analyzing a definition (e.g., NASA's), ask ONLY: "Which role(s) is this serving? Is conflation happening?" Not "Is it right?"  
  3. **Avoid Reductionism:** Don’t argue whether NK/HPC/Practical is the "correct" view of concepts generally. Focus solely on how *this specific concept* ("life") is functionally overloaded.  
  4. **Constrain Applications:** Limit implications to 1-2 targeted areas (e.g., astrobiology detection protocols + synthetic biology regulation). No grand unified theory of biology.  

  **Why This Pitch Works:**  
  - **Novelty:** Moves beyond "add another criterion" or "embrace pluralism" to diagnose *why* the debate is structurally stuck.  
  - **Impact:** Provides tools to make debates more productive and definitions more fit-for-purpose.  
  - **Feasibility:** Focus on conceptual modeling (not empirical research) fits a 6-month timeline. Framework development is the "work."  
  - **Interdisciplinary Appeal:** Directly addresses communication gaps between philosophers (favoring NK/constitutive) and astrobiologists (needing detection/practical criteria).  

  **Key Phrasing for Your Abstract:**  
  *"This project argues that 'life' is not a single concept awaiting the right definition, but a tool performing distinct jobs – from carving nature’s joints to guiding decisions. By disentangling these roles and their criteria, we can transform intractable debates into tractable questions fit for purpose."*  

  This structure forces clarity, delivers a concrete product (the framework/paper), and leverages your core insight without getting lost in swamps. Good luck!
