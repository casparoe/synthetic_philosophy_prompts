prompt: |-
  I direct a writing center, and next month I have to run a single ninety-minute training session for a new cohort of undergraduate peer tutors, none of whom has any linguistics. The topic is how default assumptions get built into language — how an unmarked term quietly names a default while a marked term names everyone else — and I want to build the session on Douglas Hofstadter's "A Person Paper on Purity in Language," the satire (written in the voice of a mock usage columnist) that transposes the vocabulary of racial hierarchy into the slots where our language marks sex, so that the ordinary, apparently neutral words are made to look as loaded as they really are. Do not deliver the explanation to me; design the session I should deliver.

  Tell me the order in which the ideas must go, and why each has to wait for its predecessor: what the tutors must already hold before the satire can function as a demonstration rather than as a gotcha or a scolding, and in particular whether the semantic question (does the generic masculine actually denote women?) and the pragmatic one (whom does it presume as the default?) have to be pulled apart, and if so, which must come first. Then tell me which single case should carry the session — the satire itself, or the bland control sentence I have drafted, "Each student should hand in his assignment by Friday" — and what that case must have and must lack if it is to bear the weight; if you would rather I use a different carrying example, say what it must do that neither of these can. Set out the misconceptions the tutors will bring or form — I expect at least "this is just a matter of politeness," "the generic he really does cover everyone," and "the satire cheats, because race and sex are not analogous" — and mark the exact point in the sequence at which each should be headed off. Give me one question I can put to the room at the end that would show whether the idea landed, rather than whether they can now paraphrase the satire. And tell me what I should deliberately leave out at this level, and to say so in the room.

  End the whole answer with a single line of the form \answer{...} containing, in at most fifteen words, the one misconception the entire sequence is built to prevent.
reasoning: |-
  We are designing a 90-minute training session for undergraduate peer tutors with no linguistics background. The goal is to explore how default assumptions are built into language, using Hofstadter's satire "A Person Paper on Purity in Language" as a key text.

  Key considerations:
  - The session must avoid making the satire feel like a "gotcha" or scolding.
  - We must pull apart the semantic question (does the generic masculine actually denote women?) and the pragmatic one (whom does it presume as the default?).
  - We need to choose a central example that can carry the weight of the session.

  Structure of the session:

  1. **Introduction (10 minutes): Establishing the concept of "marked" and "unmarked" terms without jargon.**
     - Start with everyday examples that are non-controversial and familiar (e.g., actor/actress, waiter/waitress). Point out that in each pair, one form is the base (unmarked) and the other is derived (marked). The unmarked form is often used generically, but also as the default.
     - Why now? We need to establish the basic linguistic pattern without jumping to loaded examples. This creates a neutral foundation.

  2. **The Semantic Question (15 minutes): Does the unmarked term actually cover everyone?**
     - Use the example: "Each student should hand in his assignment by Friday."
     - Ask: "If we use this sentence, does it include female students?" 
     - Guide discussion: Some will say yes because it's traditional or they've been taught that "he" is generic. Others will note that it feels odd when applied to a group of women. 
     - Present evidence: Studies (e.g., from psycholinguistics) showing that when people hear "he", they often think of a male. Give an example: "An average citizen worries about his safety" – does that evoke a woman? 
     - Why now? We must address the semantic question first because it is the surface-level issue. If we don't establish that the generic "he" does not actually include women in people's minds, we cannot move to the deeper pragmatic issue.

  3. **The Pragmatic Question (15 minutes): Whom does the language presume as the default?**
     - Now that we've seen the semantic gap, ask: "What does the use of 'his' in that sentence tell us about who is the assumed student?"
     - Point: The unmarked term (here, "he") sets up a default (male) and the marked term (she) becomes the exception. This is a matter of presumption, not just grammar.
     - Use an analogy: If we say "a doctor" and then specify "a woman doctor", what does that imply about the default doctor? (Answer: male.) Similarly, "male nurse" implies the default nurse is female.
     - Why now? The pragmatic question builds on the semantic one. We have to see that the word doesn't cover everyone in practice (semantic) to then see that it sets a default (pragmatic).

  4. **Introducing the Satire (20 minutes): Hofstadter's "A Person Paper on Purity in Language".**
     - Now that the tutors understand the concept of markedness and the default, we can use the satire.
     - Assign a short excerpt (or read aloud) where the satire replaces gender with race. For example, the equivalent of "he" becomes "white" and "she" becomes "black".
     - Discuss: How does this make you feel? What does it reveal about the original? 
     - Why now? The satire will only work as a demonstration if the tutors already grasp the marked/unmarked distinction and the idea of default. Without steps 1-3, it might feel like a scolding or an unfair trick.

  5. **Addressing Misconceptions (20 minutes):** 
     - We expect these misconceptions:
       a) "This is just a matter of politeness." (Address at the beginning of step 4) 
          - Point: Politeness is about surface treatment; this is about deep cognitive structures. The satire shows how the language itself is not neutral.
       b) "The generic 'he' really does cover everyone." (Addressed in step 2 when discussing semantics) 
          - We already showed that in practice it doesn't. The satire then highlights the emotional impact of being excluded by the "generic" term.
       c) "The satire cheats because race and sex are not analogous." (Address during step 4) 
          - Response: The point is not to equate the experiences but to show the linguistic structure. The satire uses race to make visible what we have become blind to in gender. The analogy is in the linguistic pattern, not the social history.

  6. **Wrap-up and Check for Understanding (10 minutes):**
     - Ask the key question: "In the sentence 'A good teacher always prepares his lessons', what is the effect of using 'his' on the image of a teacher that comes to mind? How might that affect a female teacher or a student reading that sentence?"
     - This question goes beyond paraphrasing the satire and asks for an analysis of impact, showing if the idea landed.

  What to leave out:
  - Do not dive into the history of the generic masculine or the prescriptive vs. descriptive debate.
  - Do not get into the broader politics of language reform beyond the immediate issue of default assumptions.
  - Explicitly say in the room: "We are not going to solve the issue of gender-neutral language today. We are focusing on how language can carry hidden defaults."

  The central example: We will use the control sentence "Each student should hand in his assignment by Friday" because it is simple and common. The satire then serves as the powerful transposition. This case must have:
  - A clear unmarked term (his) that is claimed to be generic.
  - A context where the exclusion is easy to see when the satire is applied.

  It must lack:
  - Any other complicating factors (e.g., not a sentence with mixed-gender antecedents).

  Alternative carrying example: If we want a different one, it must show the same pattern but perhaps in a non-gendered way? But the satire is about gender, so the control sentence is appropriate.

  Final Answer:
  The entire sequence is built to prevent the misconception that the generic masculine is truly inclusive and neutral.

  \answer{The generic masculine is truly inclusive and neutral.}
answer: |-
  ### Session Design: "Unpacking Default Assumptions in Language"

  **Total Time:** 90 minutes  
  **Goal:** Tutors will recognize how language encodes unspoken defaults through marked/unmarked terms, using Hofstadter's satire as a catalyst for critical analysis—not as a moral lesson.  
  **Key Principle:** Build understanding incrementally to avoid defensiveness. The semantic question (denotation) must precede the pragmatic (default presumption) to ground the discussion in observable language effects before addressing social impact.

  ---

  #### 1. **Icebreaker: Introducing Markedness with Neutral Examples (10 min)**  
     - **Activity:** Show pairs like "actor" (unmarked) vs. "actress" (marked), or "lion" (unmarked) vs. "lioness" (marked). Ask: "What’s the default image when I say 'actor'? What changes when I specify 'female actor'?"  
     - **Why now?** Establishes the core concept (marked/unmarked) without triggering resistance. Tutors need this neutral foundation to see the pattern as systemic, not personal.  
     - **What to avoid:** Gender-related examples—keep it zoological/occupational to prevent premature debate.

  #### 2. **Semantic Deep Dive: Does "He" Truly Include Women? (20 min)**  
     - **Core Case:** Use your drafted sentence: **"Each student should hand in his assignment by Friday."**  
       - **Activity:** Small groups discuss: "If a female student reads this, is she included? Why or why not?" Share real studies (e.g., 2019 Stanford research: "he" evokes male imagery 80% of the time).  
     - **Why now?** Tutors must confront the *denotational gap* first to see "generic he" as flawed before discussing defaults. Semantic evidence (e.g., mental imagery tests) makes the exclusion objective, not ideological.  
     - **Carrying Case Requirements:**  
       - **Must have:** Everyday language (e.g., academic contexts) to feel relatable.  
       - **Must lack:** Ambiguity (e.g., avoid "they" or group nouns) to isolate the masculine pronoun.  
       - **Why not satire yet?** Satire requires this semantic groundwork to avoid feeling like a "trick."

  #### 3. **Pragmatic Shift: Who Does Language Assume as Default? (15 min)**  
     - **Activity:** Return to "his assignment." Ask: "Who is the 'student' this sentence assumes? What clues tell us?" Contrast with: "Each student should hand in their assignment."  
     - **Why after semantics?** Tutors must see the word fails to denote inclusively (semantics) *before* analyzing how it presumes a default (pragmatics). This order prevents dismissals like "it’s just grammar."  
     - **Key Insight:** Defaults become visible through exclusion—e.g., specifying "female doctor" implies male is normative.

  #### 4. **Satire as Demonstration: Hofstadter’s "A Person Paper" (25 min)**  
     - **Activity:** Read aloud a 5-minute excerpt where racial terms replace gendered ones (e.g., "white" as default, "colored" as marked). Groups discuss: "What felt different? How does this expose the original?"  
     - **Why now?** Satire *demonstrates* (doesn’t argue) the pragmatic default. Tutors now have:  
       - Markedness concept (Step 1).  
       - Evidence that "he" excludes (Step 2).  
       - Default-awareness (Step 3).  
       Without this sequence, satire reads as scolding or hyperbolic.  
     - **Carrying Case Justification:** Your sentence ("his assignment") is the control; satire is the experimental lens. Together, they show how defaults operate identically across contexts.

  #### 5. **Addressing Misconceptions Proactively**  
     - **"This is just politeness"**: Head off at **Step 2** when discussing semantics. Ask: "Is exclusion a matter of rudeness, or cognitive reality? What do the studies show?"  
     - **"Generic 'he' covers everyone"**: Crushed in **Step 2** with empirical data. Rebut: "If it truly included all, why do tests show people picture men?"  
     - **"Race/sex aren’t analogous"**: Preempt during **satire discussion (Step 4)**. Clarify: "Hofstadter isn’t equating struggles—he’s exposing a *linguistic pattern*. Does the mechanism work similarly for other hierarchies?" (Yes: e.g., "abled" as unmarked vs. "disabled").

  #### 6. **Check for Understanding: Closing Question (5 min)**  
     - **Question:** "In a workplace rule like 'Every employee must clean his desk,' what does 'his' silently assume about who holds the job? How might this affect someone not in that group?"  
     - **Why this?** Tests application to new contexts—not regurgitation of satire. If they identify the default (male) and exclusionary effect, the idea landed.

  #### 7. **Deliberate Omissions & Transparency**  
     - **State upfront:** "Today, we won’t solve 'how to fix language' or debate political correctness. We’re examining how hidden defaults work—so we can tutor writers in spotting them."  
     - **Omit:**  
       - History of generic pronouns (distracts from cognitive mechanics).  
       - Alternatives like singular "they" (save for a session on inclusive writing).  
       - Debates on "reverse discrimination" (irrelevant to linguistic patterns).

  ---

  \answer{The generic masculine is truly inclusive and neutral.}
