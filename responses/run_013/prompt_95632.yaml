prompt: |-
  A friend in my decision-theory reading group has been circulating an argument that expected value maximization refutes itself, and I can't find the break. The backdrop is the St. Petersburg game: a fair coin is flipped until it lands heads, and if the first heads comes on toss n, the game pays 2^n dollars, so its expected value is infinite.

  (1) A rational agent maximizes expected value.
  (2) Now discount every St. Petersburg payoff by a billion dollars, with a floor at zero. The discounted game still has infinite expected value, because once the payoff has outgrown the discount, each toss contributes nearly a dollar to the expectation and there are infinitely many tosses. Yet this game pays a billion dollars less than the original in every outcome, and it pays nothing at all unless the coin first lands heads on the thirtieth toss or later.
  (3) Two options with the same expected value give a rational agent no reason to prefer either, so she is indifferent between them.
  (4) So she is indifferent between the St. Petersburg game and the discounted game — and since the discount can be made arbitrarily large while the expected value stays infinite, she is indifferent between the St. Petersburg game and lotteries that pay nothing with probability arbitrarily close to 1.
  (5) An agent who is indifferent between a fortune and near-certain nothing is not rational, so (1) is false.

  He is careful to say the trouble is not that you can't subtract from infinity; he is happy to run the whole thing in terms of the agent's preferences, which he says are perfectly well defined, rather than in terms of arithmetic on infinity. I would like to keep (1), and I would also like to keep the thought that the St. Petersburg game is worth playing. Name the step I should give up, explain why it looked innocent, and price the repairs: what do I pay to keep (1) with an amendment, and what do I lose if I can keep it only as a fragment of some larger theory?
reasoning: |-
  We are given an argument that expected value maximization refutes itself, using a modification of the St. Petersburg game. The goal is to find the break in the argument and explain how to fix it while preserving the intuition that the St. Petersburg game is worth playing.

  The argument:

  (1) A rational agent maximizes expected value.

  (2) Discount every St. Petersburg payoff by a billion dollars (with a floor at zero). The discounted game still has infinite expected value because the tail of the St. Petersburg game (from some point onward) dominates the discount. Specifically, the discounted game pays nothing until the 30th toss (since 2^30 is about 1e9, so subtracting 1e9 leaves a positive amount only for n>=30) and yet the expected value remains infinite.

  (3) Two options with the same expected value (in this case, both infinite) leave the agent indifferent.

  (4) Therefore, the agent is indifferent between the original St. Petersburg game and the discounted one (which is arbitrarily worse). Since we can make the discount arbitrarily large (say, a trillion dollars, etc.), the agent would be indifferent between the St. Petersburg game and a lottery that pays nothing with probability arbitrarily close to 1.

  (5) Such an agent is not rational because being indifferent between a fortune and near-certain nothing is irrational. Hence, (1) is false.

  The challenge is to break this chain. The problem says that the trouble is not simply that we can't subtract from infinity, and the argument is framed in terms of preferences.

  Analysis:

  Step (2) is correct: the discounted game (with discount D, floor at zero) has an infinite expected value. The original game has infinite expected value as well.

  Step (3) is the critical point. The argument assumes that two options with the same expected value (both infinite) must leave the agent indifferent. However, in the context of infinite expectations, the standard expected value theory breaks down. In particular, the principle of indifference based solely on expected value is derived from the von Neumann-Morgenstern axioms, which assume finite expectations (or at least bounded utility). When we have unbounded utility (as here), the axioms do not necessarily hold.

  Moreover, even if two lotteries have infinite expected value, they may not be considered equally desirable. For example, consider a lottery that gives 2^n dollars with probability 1/2^n (the original St. Petersburg) and another that gives 3^n dollars with the same probabilities. Both have infinite expected value, but intuitively the second is better. Similarly, the discounted St. Petersburg game, while having infinite expectation, is clearly worse than the original because every outcome is reduced (except when the outcome is less than the discount, which then becomes zero). So the agent should strictly prefer the original.

  Thus, the break is at step (3). The principle that two options with the same expected value leave the agent indifferent is only valid when the expected values are finite. When they are infinite, this principle does not hold.

  Repairs:

  To keep expected value maximization (step 1) we must amend it to apply only to situations where the expected values are finite. Alternatively, we can extend expected utility theory to handle infinite expectations by using a more sophisticated approach (such as relative expectation or using a density function over the natural numbers that sums to 1, but decays sufficiently fast). However, the standard theory does not provide a total ordering over lotteries with infinite expectations.

  What do we lose? We lose the ability to compare all lotteries with infinite expectations in a straightforward way. We must admit that in some cases (like these) the expected value criterion is insufficient. We can still use other criteria (like stochastic dominance) to compare the two St. Petersburg variants: the original dominates the discounted one (since it pays more in every state of the world) and hence is preferred.

  Therefore, we can say:

  - Step (3) is false in this context. The agent should prefer the original St. Petersburg game to the discounted one, even though both have infinite expected value. This is because the original game dominates the discounted one (every outcome is at least as good and sometimes better).

  Price of repairs:

  - We amend (1) to: "A rational agent maximizes expected value when the expectations are finite." For the infinite case, we require additional principles (like dominance) to guide decisions.

  - What we lose: We no longer have a complete theory for decisions with unbounded utility. We must use other methods to compare lotteries with infinite expectations.

  Alternatively, we can use a utility function that is bounded (like suggested by Bernoulli in response to the St. Petersburg paradox). If utility is bounded (e.g., logarithmic utility), then the St. Petersburg game has finite expected utility. Similarly, the discounted game would also have finite expected utility, and we can compare them. This avoids the infinity problem altogether. However, the problem states that we want to keep the thought that the St. Petersburg game is worth playing, and with bounded utility, the expected utility might be finite but still very high.

  But note: the argument as given does not assume bounded utility. It is using linear utility (dollars). So the amendment to step (1) would be to restrict expected value maximization to finite expectations or to use a bounded utility function.

  Conclusion:

  The break is at step (3). The principle of indifference by same expected value does not extend to infinite expectations. The agent should strictly prefer the original game because it dominates the discounted one.

  We can keep (1) by amending it to apply only when the expected value is finite, and for the infinite case we rely on other principles (like dominance). Alternatively, we can use a bounded utility function to avoid infinite expectations. If we use a bounded utility function, then the St. Petersburg game has a finite expected utility and the problem goes away. However, the problem may then reappear in a different form if we consider unbounded utility again.

  In the bounded utility case, the discounted game would have a lower expected utility than the original (since it pays less) and we would not be indifferent. The discount of a billion dollars would then reduce the expected utility by a non-infinite amount, so the original would be strictly preferred. This avoids the paradox.

  But note that the original argument is framed in linear utility (dollars). So if we insist on linear utility, we must accept that the expected value is infinite and then reject step (3). 

  Thus, the minimal repair is to reject step (3) and to say that when two lotteries have infinite expected value, we can still compare them by other means (like dominance). This preserves the intuition that the original St. Petersburg game is strictly preferable to the discounted one.

  Final answer:

  Break the argument at step (3): having the same expected value (even if both are infinite) does not imply indifference. The agent should strictly prefer the original St. Petersburg game because it pays more in every possible outcome (or at least in some outcomes without paying less in any). This is a form of statewise dominance.

  Repairs: Restrict the principle of indifference by expected value to the case of finite expectations. For infinite expectations, we require additional decision criteria (like dominance).

  What we lose: Expected value maximization is no longer a complete criterion for all lotteries. We must supplement it with other principles.
answer: |-
  The break in your friend's argument occurs at step (3), where it is claimed that two options with the same expected value leave a rational agent indifferent. This step relies on an assumption that expected value comparisons are sufficient for rational choice in all cases, including those involving infinite expectations. However, this assumption fails when expectations are infinite, as in the St. Petersburg game and its discounted variants. Below, I explain why step (3) is flawed, why it appeared innocent, and what repairs are needed to preserve expected value maximization while addressing the issue.

  ### Why Step (3) is Flawed
  - **The Problem with Infinite Expectations**: When two lotteries have infinite expected value, the standard expected utility theory (which underpins step 3) does not guarantee indifference. Rational preferences can still distinguish between such lotteries based on other criteria, such as **stochastic dominance**. In this case:
    - The original St. Petersburg game pays \(2^n\) dollars for heads on toss \(n\).
    - The discounted game pays \(\max(2^n - D, 0)\) dollars for the same outcome, where \(D\) is a large discount (e.g., a billion dollars).
    - For every possible outcome (i.e., every \(n\)), the original game pays at least as much as the discounted game, and strictly more for all \(n\) where \(2^n > D\) (e.g., \(n \geq 30\) for \(D = 10^9\)). This is **statewise dominance**: one lottery is never worse and sometimes better.
  - **Rational agents should prefer dominance**: A rational agent, even while maximizing expected value, will strictly prefer the original game to the discounted one because it dominates it outcome-wise. Indifference is not required merely because both expectations are infinite. Step (3) incorrectly assumes that infinite expectations are "equal" in a way that forces indifference, but dominance provides a rational basis for strict preference.

  ### Why Step (3) Looked Innocent
  Step (3) appears reasonable because it holds for lotteries with **finite** expectations. Under standard axioms (e.g., von Neumann-Morgenstern), if two options have identical finite expected values, a rational agent is indifferent. The intuition extends naively to infinite cases, but this overlooks a critical limitation: expected value maximization lacks a coherent method for comparing different "sizes" of infinity. The argument exploits this by treating all infinite expectations as equivalent, which seems intuitive but is mathematically and decision-theoretically invalid. Your friend's focus on preferences (rather than arithmetic) does not resolve this, as the preference relation itself must satisfy dominance principles.

  ### Repairs to Keep Expected Value Maximization
  To retain expected value maximization as a normative principle, you must amend it to handle infinite cases. Here's how:

  1. **Amendment**: Restrict expected value maximization to lotteries with **finite expectations**. For infinite cases, supplement with additional principles like **stochastic dominance** or **relative value comparisons**.
     - **Formal fix**: "A rational agent maximizes expected value when expectations are finite. When expectations are infinite, preferences must satisfy dominance: if lottery A pays at least as much as lottery B in all states and strictly more in some, A is preferred."
     - **Apply to argument**: The original and discounted St. Petersburg games both have infinite expectations, but dominance requires preferring the original. Step (3) is rejected because indifference is not implied.

  2. **Cost of Repairs**:
     - **What you pay**: You lose the universality of expected value maximization. It becomes a partial theory, requiring auxiliary rules for infinite expectations. This complicates decision theory by introducing context-dependent criteria.
     - **What you keep**: You preserve (1) as a core principle for finite cases (e.g., most real-world decisions). Crucially, you retain the intuition that the St. Petersburg game is valuable and preferable to its discounted variants—consistent with dominance.

  3. **Alternative Framework**: If you insist on a unified theory for all cases, switch to **bounded utility functions** (e.g., logarithmic utility). This transforms the St. Petersburg game into a finite-expected-utility lottery, sidestepping infinity:
     - **How it works**: With utility \(U(x) = \log(x)\) or similar, the St. Petersburg game has finite expected utility (e.g., \(\sum_{n=1}^{\infty} \frac{\log(2^n)}{2^n} \approx 1.39\) utils). Discounting by \(D\) reduces utility, so the original is strictly preferred.
     - **Cost**: You abandon linear utility (i.e., expected value) for dollars, losing simplicity. Some may argue this misrepresents risk-neutral preferences. However, it resolves the paradox and keeps expected **utility** maximization universal.

  ### What You Lose if You Keep Only a Fragment
  If you amend expected value maximization to exclude infinite cases (as above), you lose:
  - **Completeness**: The theory no longer fully orders all possible lotteries. Agents might need secondary rules (e.g., dominance, lexical priorities) for infinite expectations.
  - **Tractability**: Real agents cannot compute or compare infinite expectations. The amendment acknowledges this limitation but does not resolve the epistemic challenge of evaluating "infinite" gambles.

  ### Why This Preserves Rationality and the St. Petersburg Game
  - **Rationality**: An agent who prefers the original St. Petersburg game over the discounted one (due to dominance) is rational. They are not indifferent to "near-certain nothing" because the discounted game is not equivalent to "nothing"—it still has positive payoffs for large \(n\), and dominance justifies strict preference.
  - **St. Petersburg game's value**: By accepting dominance, you affirm that the game is worth playing (e.g., for any finite entry fee below \(2^k\) for some \(k\), it has positive expected value). The discounted game is inferior, but not worthless.

  ### Summary
  - **Break step (3)**: Infinite expectations do not force indifference; dominance allows strict preference.
  - **Repairs**: Amend (1) to apply only to finite expectations, and add dominance for infinite cases. Or, use bounded utility.
  - **Cost**: Expected value maximization becomes incomplete but remains useful. The St. Petersburg game retains its appeal via dominance or bounded utility.

  This repair upholds the core of expected value reasoning while addressing its limitations in pathological infinite cases. Your friend's argument fails by overextending a finite concept to infinity, a common pitfall in decision theory.
