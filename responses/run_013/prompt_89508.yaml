          - A bell or timer
          - Flip chart or board to record the results from each table
          - Pens and paper for recording

      We need to prepare: 
          - Circle diagrams for Procedure 1 (with 36 points)
          - Tokens for all bags (for chord: 0-35 for Procedure 1 and 2; the ring bag for Procedure 3; for cube: the three types of bags)
          - Instruction cards for each procedure (for chord: three versions; for cube: three versions)

  Run of Show:

      Introduction (5 min):
          - Welcome, explain the theme: "What does 'pick at random' really mean?"
          - We will run two experiments: one about chords in a circle, one about cubes from a factory.
          - Each table will have a different procedure for generating a random chord (or cube). 
          - You will bet tokens on what you think the probability is for your procedure.

      Chord Experiment (25 min total):
          - (5 min) Distribute instruction cards and materials. Explain: "You will run 20 trials. For each trial, follow the instructions to generate a chord and determine if it is longer than the side of the equilateral triangle inscribed in the circle. Record the result. Before you start, you will bet on the probability."
          - (3 min) Betting: Present three options for the probability: A: 1/3, B: 1/2, C: 1/4. Each participant bets any number of their tokens (0 to 10) on one option. Collect bets.
          - (12 min) Run 20 trials and compute the frequency of "longer".
          - (5 min) Report: Each table reports their observed frequency and which option they think matches (A, B, or C). Write on the board.

      Swap and Reveal (5 min):
          - Collect the instruction cards from the tables and swap them. Each table reads the instruction card they receive aloud.
          - Note: different procedures led to different probabilities.

      Cube Experiment (15 min total):
          - (2 min) Introduce: "Now a factory makes cubes with edge length between 1 and 3. We want the probability that the edge is less than 2. Again, different procedures."
          - (3 min) Distribute materials and instruction cards. Betting: three options: A: 1/2, B: 7/26 (about 0.27), C: 3/8 (0.375). Place bets.
          - (5 min) Run 20 trials (draw 20 tokens, record if small).
          - (5 min) Report and compare.

      Fix Round (10 min):
          - Discuss: "Why the difference? How can we choose the right procedure?"
          - Present Jaynes' idea: the procedure should not depend on irrelevant details. For the circle, if we require that the procedure is invariant to rotation and translation, then we get the second procedure (1/2). 
          - But note: this is a choice. And sometimes there is no procedure that satisfies all symmetries we want. Mention Banach-Tarski: it shows that we cannot have a measure that works for all subsets and is invariant under all rotations (in 3D). 
          - Emphasize: "picking at random" requires specifying a procedure, and the answer depends on it.

      Debrief (5 min):
          - Recap: the same question ("pick at random") can have different answers because of the procedure.
          - In real life, we must be careful about what we mean by "random".

  What can go wrong:
      - Chord Procedure 1: Participants might not understand how to compute the central angle. Solution: instruction card should have an example: e.g., points 5 and 20: |5-20|=15, 36-15=21, min=15 -> central angle=150 degrees -> longer? 150>120 -> yes. But 150>120 -> yes. But note: min(|i-j|,36-|i-j|) is the gap in steps. Then central angle = gap * 10. So if gap>12, then angle>120. 
      - They might draw the chord and then try to measure the length? That would be slow. We should discourage that and encourage the computation.
      - In the betting, they might not bet on their own procedure? But we don't tell them that the procedures are different. So they might bet based on intuition. That's okay, because after they run, they see the frequency and then see it matches one of the options. And then when they swap, they see other tables had different procedures and got different results.
      - Time: 20 trials might take longer than expected. Solution: have a timer and after 10 minutes, call stop even if they haven't finished.
      - In cube experiment, they might not understand the description of the procedure. Solution: instruction card should be clear.

  What the activity cannot reproduce and must be said aloud:
      - The continuous case: we are using discrete approximations. In the continuous case, the probabilities are exactly 1/3, 1/2, 1/4 for the chord.
      - The Banach-Tarski paradox is not demonstrated; we only mention it to illustrate that sometimes there's no unique way to define a measure that respects all symmetries.

  Instruction Cards:

      Chord - Procedure 1:
          Title: "Procedure 1: Two points on the rim"
          Instructions:
            1. For each trial, draw two tokens from the bag without replacement. Call the numbers a and b.
