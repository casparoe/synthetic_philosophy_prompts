  ### Run-of-Show with Timings
  **Total: 75 minutes**  
  *(Note: Prepare materials in advance. Assign a facilitator per table if possible.)*

  1. **Introduction (5 min)**  
     - *"Today, we’re exploring what 'pick at random' really means. It sounds simple—but depending on *how* you do it, you get different answers to the same question. You’ll run experiments, bet tokens, and see why this matters for science and everyday reasoning."*  
     - Distribute 10 tokens to each participant. Explain: *"Bet these on the probability you think is correct. If you win, you double your bet; if you lose, you lose the tokens. Goal: End with the most tokens!"*

  2. **Chord Experiment (30 min)**  
     - **Setup (3 min)**: Assign each table a "device" (Procedure 1, 2, or 3). Give instruction cards and materials.  
     - **Betting (2 min)**: *"For your device, bet on the probability that a random chord is longer than the triangle’s side: A = 1/3, B = 1/2, C = 1/4. Place tokens in cups labeled A/B/C at your table."*  
     - **Run Trials (15 min)**: Tables do 20 trials. Facilitator keeps time.  
     - **Report Results (5 min)** Each table shares:  
       - *"We used Device [X]. Wins: [Y]/20 trials. Most of us bet on [A/B/C]."*  
       Record results on a central board.  
     - **Swap and Reveal (5 min)**: Rotate instruction cards to the next table. Each table reads the new card aloud. *"See how ‘random’ was defined differently?"*  

  3. **Cube Experiment (20 min)**  
     - **Setup (2 min)**: New instruction cards/materials (cube procedures).  
     - **Betting (3 min)**: *"Bet on the probability a random cube has edge <2: A = 1/2, B = 7/26 (≈0.27), C = 3/8 (≈0.375)."*  
     - **Run Trials (10 min)**: 20 trials per table.  
     - **Report (5 min)**: Share results. *"Device [X] gave [Y]/20 small cubes. Bets were on [A/B/C]."*  

  4. **Fix Round (10 min)**  
     - *"Someone might say: ‘Just pick a procedure that ignores irrelevant details (like position/size of the circle)’. Let’s test that."*  
     - **Activity**: Hold up a compass. *"Draw a circle anywhere. Now, generate a chord without knowing its location/scale. How?"*  
       - Tables brainstorm 1 min.  
       - Reveal: *"Device 2 (radius + point) is the only one that works—it gives 1/2. Philosopher Jaynes proposed this in 1973."*  
     - **Debrief**:  
       - *"But this is a CHOICE—it assumes rotation/translation symmetry. Sometimes, there’s NO fair way to choose. For example, the Banach-Tarski paradox shows you can cut a ball into 5 pieces, reassemble into two identical balls—proving some ‘random’ picks can’t have consistent probabilities."*  

  5. **Conclusion (5 min)**  
     - *"What did we learn?*  
       - *‘Pick at random’ is a procedure, not a fact.*  
       - *The answer depends on hidden assumptions.*  
       - *Even ‘symmetries’ involve choices—and sometimes conflict.*  
     - *Final token count? Anyone double their bets? That sting when you lost? That’s the risk of unseen assumptions!"*  

  ---

  ### Cheap Materials List  
  **Per Table (for 5 tables; 2 tables share Device 1, 2 share Device 2, 1 for Device 3):**  
  - **Chord Experiment**:  
    - Device 1 (two points):  
      - Circle drawn on paper (30 cm diameter), equilateral triangle inscribed.  
      - 2 bags: One with 36 tokens labeled 0°–350° (10° increments), one empty.  
      - Ruler, pen.  
    - Device 2 (radius + point):  
      - Same circle + triangle.  
      - Bag with 36 tokens (0°–350°).  
      - 6-sided die.  
    - Device 3 (midpoint):  
      - Same circle + triangle.  
      - Bag with 36 tokens: 1×"1", 3×"2", 5×"3", 7×"4", 9×"5", 11×"6".  
      - 6-sided die.  
  - **Cube Experiment**:  
    - Device A (uniform edge): Bag with 10 "SMALL" tokens, 10 "LARGE" tokens.  
    - Device B (uniform volume): Bag with 5 "SMALL", 15 "LARGE".  
    - Device C (uniform area): Bag with 7 "SMALL", 13 "LARGE".  
  - **General**:  
    - 3 cups labeled "A", "B", "C" (for betting).  
    - Tokens for betting (10 per participant, e.g., poker chips, buttons).  
    - Instruction cards (laminated or cardstock).  
    - Recording sheets, pens.  

  **Central Supplies**:  
  - Board to record results.  
  - Compass (for Fix Round).  
  - Timer/bell.  

  **Cost**: < $30 total (use paper, spare dice, homemade tokens).  

  ---

  ### Word-for-Word Instruction Cards  
  **Chord Experiment**  
  *All cards start: "Determine if a random chord is longer than the triangle’s side. Do 20 trials."*  
  - **Device 1 (Two Points)**:  
    > 1. Draw 2 tokens from the bag.  
    > 2. Mark these angles on the circle.  
    > 3. Draw the chord between them.  
    > 4. Compare to the triangle’s side: longer? (Yes/No)  
    > 5. Return tokens to the empty bag.  
  - **Device 2 (Radius + Point)**:  
    > 1. Draw 1 token (this picks a radius).  
    > 2. Roll the die: 1–3 = "near center", 4–6 = "near rim".  
    > 3. Draw the chord perpendicular to the radius at that point.  
    > 4. Compare to triangle’s side: longer? (Yes/No)  
  - **Device 3 (Midpoint)**:  
    > 1. Draw 1 token from the bag (this is the "ring").  
    > 2. Roll the die (this is the angle; ignore it).  
    > 3. The chord is longer only if the token is "1", "2", or "3".  

  **Cube Experiment**  
  *All cards start: "Determine if a random cube has edge <2. Do 20 trials."*  
  - **Device A (Uniform Edge)**:  
    > Draw a token. "SMALL" = edge <2. "LARGE" = edge ≥2.  
  - **Device B (Uniform Volume)**:  
    > Draw a token. "SMALL" = volume <8. "LARGE" = volume ≥8.  
  - **Device C (Uniform Area)**:  
    > Draw a token. "SMALL" = face area <4. "LARGE" = area ≥4.  

  ---

  ### Betting Scheme  
  - **Tokens**: 10 per person.  
  - **Rules**:  
    - Bet any integer amount on A, B, or C before experiments.  
    - Winning bet = double your tokens (e.g., bet 3, win 6).  
    - Losing bet = tokens forfeited.  
  - **Why it stings**: Competitive element (public token count at the end), and bets feel personal.  

  ---

  ### What Will Go Wrong (and Fixes)  
  1. **"Device 1 is too slow!"**  
     - *Why*: Drawing chords takes time.  
     - *Fix*: Skip physical drawing after 2 trials; use the angle method (min(|a-b|,36-|a-b|) >12).  

  2. **"Our probability doesn’t match the options!"**  
     - *Why*: Small samples (e.g., Device 1 expects ~6.7/20, but gets 5).  
     - *Fix*: *"That’s the point—procedures nudge results. In theory, Device 1 gives 1/3. Your 5/20 is close!"*  

  3. **"Device 3 feels unfair!"**  
     - *Why*: Rings are unevenly weighted.  
     - *Fix*: *"Exactly! 'Pick a random point' seems innocent—but this weighting is why it gives 1/4."*  

  4. **Philosopher/Math Expert Dominates**  
     - *Fix*: Assign them as facilitators. If they debate, say: *"Hold that thought—let’s see what the devices say first."*  

  5. **Betting Chaos**  
     - *Fix*: Use labeled cups; one person per table collects bets.  

  ---

  ### What the Activity Can’t Do (Must Say Aloud)  
  - **"We approximated continuous math with discrete steps. Real-world probabilities are exact: 1/3, 1/2, 1/4 for chords; 1/2, 7/26, 3/8 for cubes."**  
  - **"We can’t *prove* Banach-Tarski here—but it mathematically shows that some ‘random’ choices can’t be made consistently."**  

  ### Debrief Map  
  - **Chord Experiment**: Procedures → Different probabilities → "Random" is defined by method.  
  - **Cube Experiment**: Generalizes beyond circles → Assumptions (edge/volume/area) change outcomes.  
  - **Fix Round**: Symmetries "fix" ambiguity... but require choices. Banach-Tarski shows limits.  
  - **Conclusion**: "Random" is a process, not a truth. Ambiguity is everywhere—even in science.  

  ---  
  This session is tactile, fast-paced, and reveals ambiguity through action. Run it as a "lab" with clear stops/starts. Participants leave with physical intuition—and a story about why "random" isn’t obvious. No prep needed beyond materials!
