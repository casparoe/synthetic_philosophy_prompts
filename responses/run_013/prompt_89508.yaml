            2. Roll the die to get an angle (the die roll gives a number 1-6, which corresponds to an angle in 60-degree increments).
            3. If the ring number i is 1, 2, or 3, then the chord is longer than the triangle side.
            4. If i is 4, 5, or 6, then it is not.
            5. Record the result.

      Cube - Procedure A:
          Title: "Procedure A: Uniform Edge Length"
          Description: "The factory sets the edge length to be a random number between 1 and 3, chosen uniformly."
          Instructions:
            1. For each trial, draw one token from the bag.
            2. If the token says "small", then the cube has edge length <2. If "large", then >=2.
            3. Record the result.

      Cube - Procedure B:
          Title: "Procedure B: Uniform Volume"
          Description: "The factory sets the volume to be a random number between 1 and 27, chosen uniformly, and then computes the edge length."
          Instructions: same as above.

      Cube - Procedure C:
          Title: "Procedure C: Uniform Face Area"
