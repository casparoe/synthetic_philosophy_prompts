  7. Internalization View (Explanation, internal, socialization)
     - Awkward commitment: It reduces morality to psychological conditioning, which seems to undermine its authority.
     - Worst case: D (agent with settled commitments) because it explains the commitments without justifying them.

  8. Sentimentalism (Explanation, internal, innate sentiments)
     - Awkward commitment: It cannot account for moral behavior in the absence of sentiment.
     - Worst case: A (ring-bearer with no desire) because he lacks the sentiment.

  9. Constitutivism (Denial, constitutive of agency)
     - Awkward commitment: It must show that immoral action is self-defeating or impossible.
     - Worst case: E (amoralist) who seems to act without self-defeat.

  10. Presupposition View (Denial, challenge presupposes morality)
      - Awkward commitment: It may seem to avoid the challenge without giving positive reasons.
      - Worst case: E (amoralist) who doesn't share the presupposed moral standpoint.

  Unoccupied Combinations:
  - A justification that is other-regarding and desire-dependent: This combination is unattractive because it would not provide a reason to someone without the desire (like the amoralist). Thus, it is not offered as a response to Glaucon.

  Note on Ordinary Anonymity:
  When the ring is replaced by ordinary anonymity (where detection is possible but less likely), the leaves that rely on external enforcement (1 and 6) are weakened but not eliminated. The other leaves (2-5, 7-10) remain intact because they do not depend on the threat of detection.

  We have 10 leaves and 8 internal nodes. The requirement is 8-12 leaves and no more than 9 internal nodes, so we are within bounds.

  We have flagged the unoccupied combination and the worst cases for each leaf.

  This should serve as the handout.
answer: |-
  ### Decision Tree: Responses to Glaucon's Challenge  
  *Organized by the structure of the answer, not by historical figures*  

  **Q1: What does Glaucon’s challenge primarily demand?**  
  - **A. A justification** (a reason for the just agent to be just, even when undetected).  
  - **B. An explanation** (a motive/mechanism for why people comply with justice).  
  - **C. A denial** (the challenge is ill-posed; morality isn’t optional).  

  ---

  #### Branch A (Justification)  
  **Q2: Does the justification concede that all reasons are self-regarding?**  
  - **A1. Yes** (reasons must appeal to the agent’s self-interest).  
  - **A2. No** (reasons can be other-regarding or non-self-interested).  

  ##### Sub-branch A1 (Self-regarding)  
  **Q3: What makes justice serve the agent’s self-interest?**  
  - **A1a. External factors** (detection/enforcement).  
  - **A1b. Internal factors** (disposition, character, or self-respect).  

  ###### From A1a:  
  - **Leaf 1: Prudential Deterrence** (unnamed)  
    - *Awkward commitment*: Justice is only valuable if punishment is likely; it collapses under guaranteed invisibility.  
    - *Worst case*: **B** (ring-bearer with common-knowledge invisibility) → no fear of detection, so no reason to be just.  

  ###### From A1b:  
  **Q4: Is justice’s value instrumental or constitutive?**  
  - **A1b-i. Instrumental** (justice is a tool for happiness).  
  - **A1b-ii. Constitutive** (justice is part of happiness/rationality).  

  - **Leaf 2: Instrumental Internal View** (e.g., Mill)  
    - *Awkward commitment*: Justice depends on contingent internal rewards (e.g., peace of mind), which may not exist for all.  
    - *Worst case*: **A** (ring-bearer with no desire) → no internal rewards motivate him.  
  - **Leaf 3: Eudaimonism** (Plato, Aristotle)  
    - *Awkward commitment*: The just life is necessarily happy—denying that misfortune can undermine well-being.  
    - *Worst case*: **C** (just but miserable agent) → must dismiss their misery as illusory.  

  ##### Sub-branch A2 (Non-self-regarding)  
  **Q5: What grounds the other-regarding reason?**  
  - **A2a. Requirements of practical reason** (rationality demands justice).  
  - **A2b. Objective moral facts** (justice is intrinsically required).  

  - **Leaf 4: Kantianism**  
    - *Awkward commitment*: Immoral action is irrational, even if the agent gains from it.  
    - *Worst case*: **E** (amoralist) → unmoved by rationality’s demands.  
  - **Leaf 5: Moral Realism** (e.g., Ross)  
    - *Awkward commitment*: Moral facts provide reasons, but their authority is unexplained if the agent is indifferent.  
    - *Worst case*: **E** (amoralist) → acknowledges facts but remains unmotivated.  

  ---

  #### Branch B (Explanation)  
  **Q6: What drives compliance with justice?**  
  - **B1. External enforcement** (fear of detection/punishment).  
  - **B2. Internal motives** (psychology or sentiment).  

  ###### From B1:  
  - **Leaf 6: Explanatory Deterrence** (unnamed)  
    - *Awkward commitment*: Fails to explain compliance without enforcement.  
    - *Worst case*: **A** (ring-bearer with no desire) → compliance without threat is unexplainable.  

  ###### From B2:  
  **Q7: What is the source of internal motives?**  
  - **B2a. Socialization** (internalized norms).  
  - **B2b. Innate sentiment** (natural empathy).  

  - **Leaf 7: Internalization View** (e.g., Freud)  
    - *Awkward commitment*: Reduces morality to conditioning, undermining its normative force.  
    - *Worst case*: **D** (agent with settled commitments) → explains but does not justify their morality.  
  - **Leaf 8: Sentimentalism** (Hume)  
    - *Awkward commitment*: Justice relies on variable emotions, so it may not bind those without them.  
    - *Worst case*: **A** (ring-bearer with no desire) → lacks the sentiment to comply.  

  ---

  #### Branch C (Denial)  
  **Q8: Why is the challenge ill-posed?**  
  - **C1. Morality is constitutive** (essential to agency).  
  - **C2. The challenge presupposes morality** (it assumes a moral framework).  

  - **Leaf 9: Constitutivism** (e.g., Korsgaard)  
    - *Awkward commitment*: Immoral action is self-defeating—hard to square with clear cases of selfish success.  
    - *Worst case*: **E** (amoralist) → acts immorally without apparent self-contradiction.  
  - **Leaf 10: Presupposition View** (e.g., Wittgensteinians)  
    - *Awkward commitment*: Rejects the challenge as confused, offering no positive reason to be just.  
    - *Worst case*: **E** (amoralist) → sees no confusion in rejecting morality.  

  ---

  ### Notes on the Tree  
  1. **Unoccupied Combinations**:  
     - A justification that is **other-regarding and instrumental** (e.g., "be just to help others because you desire their happiness") is absent. This is *unattractive*: it fails if the agent lacks the desire, so it cannot answer Glaucon.  
     - An explanation that is **internal and enforcement-dependent** (e.g., "people comply due to internalized fear of punishment") is *unexplored* but potentially coherent.  

  2. **Unseparated Leaves**:  
     - **Moral Realism (Leaf 5)** and **Kantianism (Leaf 4)** are not distinguished by their treatment of self-regard (both reject it). Q5 separates them by grounding (rationality vs. facts).  
     - **Prudential Deterrence (Leaf 1)** and **Explanatory Deterrence (Leaf 6)** share a mechanism but are split by Q1 (justification vs. explanation).  

  3. **Surviving Leaves Under Ordinary Anonymity** (unobserved transactions, cities, online):  
     - **Undermined**: Prudential Deterrence (Leaf 1) and Explanatory Deterrence (Leaf 6)—anonymity reduces detection risk.  
     - **Intact**: All others (Leaves 2–5, 7–10)—they rely on internal/constitutive factors or deny the challenge’s validity.  
     - *Debate point*: Ordinary anonymity weakens enforcement-dependent views but leaves room for internal/constitutive answers to argue that justice remains rational or necessary.  

  ---  
  *Handout ends. Designed for clarity without citations; assumes familiarity with Plato’s Ring of Gyges (Rep. 359d–360d).*
