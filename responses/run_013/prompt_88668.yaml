  I should consider the legal perspective. Most jurisdictions allow withdrawing life-sustaining treatment if it's deemed burdensome and the patient (or surrogate) consents. This aligns with the doctrine of letting die. However, active euthanasia is prohibited, reinforcing the killing vs. letting die distinction. But how does this hold up when the outcome is identical? The difference might lie in causation—withdrawing treatment removes an artificial barrier to the underlying cause of death, whereas lethal injection introduces a new cause.

