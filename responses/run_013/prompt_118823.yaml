prompt: |-
  hey — I'm in a third-year bioethics seminar, we just wrapped the abortion unit and I got voluntered to run the review session before the midterm. I want one mock essay question for the group that actually punishes reciting. Everyone can do the violinist case and everyone can do Marquis's future-like-ours argument, and honestly half the room thinks those two are rivals when I'm pretty sure they're answering different questions.

  Here's the case I want the question built on, since it's mine and they can't have seen it: a woman is carrying an embryo that another couple donated. She signed up for it deliberately, no pressure, no accident, it isn't her genetics, and she could still change her mind and stop. Now ask whether Thomson's argument gets stronger, weaker, or exactly the same for her, versus (a) a woman who was raped, and (b) a woman who had consensual sex without contraception and now regrets it. I set those three up on purpose so they pull apart consent, genetic relatedness, and responsibility for the situation — make the question force students to notice that and say which one is doing the work. Then make them commit: does Thomson's argument really rest on bodily autonomy, or does it quietly rest on nobody having agreed to anything? And if it's the second one, they have to face the follow-up — does that mean the pro-life side can win just by showing the fetus isn't a stranger to the woman? Don't let them list both answers, make them pick.

  Second half of the question should be whether a fully successful future-like-ours argument would even touch Thomson's conclusion, given she's happy to grant the fetus a right to life. I think the juicy bit is what that does to the way the debate usually gets set up, as a fight about whether the fetus is a person. They should have to say whether that framing is a mistake.

  So can you write me: (1) the essay question itself, 50 minutes in class, out of 20 marks; (2) a model answer of about 600 words; (3) a marking scheme with five must-hit points, the marks for each, and a line on how students typically get each one wrong. I want the scheme to specifically catch these four moves, cause I've seen them all in seminar: treating Thomson's argument as if it has to deny the fetus is a person; treating Marquis as just the potentiality argument; assuming the loss Marquis describes requires the fetus to want or value anything right now; and reading the violinist case as weighing the fetus's rights against the woman's rather than as an argument about what a right to life actually includes. And tell me which single move seperates an A from a B.
