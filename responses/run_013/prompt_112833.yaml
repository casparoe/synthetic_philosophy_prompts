  The key concession is to acknowledge that some thought experiments can be reconstructed as arguments, which builds credibility without undermining the core thesis. This shows flexibility while maintaining that fiction has a unique role.

  I should ensure objections are phrased as the audience would, ordered by likelihood and damage. The historian's objection is high damage because historical counterexamples challenge universality. The epistemologist’s question is moderate but complex. The private fear question is critical but maybe less likely.

