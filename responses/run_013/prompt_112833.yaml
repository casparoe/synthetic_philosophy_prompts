  The experimentalist might question how replication works in fiction. The response could focus on shared cognitive frameworks, but the soft spot is whether this counts as replication in a scientific sense. The historian will bring up historical cases where the same thought experiment had different interpretations. The reply could highlight evolving tacit knowledge, but it's tricky because it might undermine the universality claim.

