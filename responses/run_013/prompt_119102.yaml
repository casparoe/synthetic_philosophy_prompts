answer: |-
  ### Exam Question: Dollar Auction with Charitable Giving

  **Rationality, Commitment, and Strategic Interaction**  
  **Final Exam**  
  **Time Allotment:** 75 minutes  

  ---

  **Question (20 points):**  
  Consider a dollar auction variant where the auctioneer is a charity. Both bidders independently value donations to the charity at a rate of *α* (where 0 < *α* < 1). Thus, when a bidder pays *x* dollars, they receive a "warm-glow" benefit of *αx* (representing their valuation of the donation) in addition to any auction outcome. The highest bidder wins the dollar and pays their bid; the second-highest bidder pays their bid but receives nothing.  

  1.  **Analysis (12 points):**  
      - At an arbitrary stage of bidding, suppose Bidder A is the current high bidder at *b* dollars, and Bidder B is the second-highest bidder at *s* dollars (where *b* > *s*). Bidder B must decide whether to drop out (ending the auction) or raise the bid to *n* dollars (*n* > *b*), making them the new high bidder.  
      - Set up Bidder B’s payoffs for:  
          (i) Dropping out immediately.  
          (ii) Raising the bid to *n* and then *winning* the auction (assuming Bidder A drops out).  
          (iii) Raising the bid to *n* and then *losing* the auction (assuming Bidder A responds with a higher bid).  
      - Using these payoffs, derive the condition under which Bidder B finds it **rational** to raise the bid to *n*. Explain the critical threshold and how *α* affects it.  
      - Based on this condition, does the charitable feature (*α* > 0) **eliminate, mitigate, or exacerbate** escalation compared to the standard dollar auction (*α* = 0)? Justify your answer.  

  2.  **Interpretation (5 points):**  
      - The sunk-cost fallacy is often cited as the primary explanation for escalation in the dollar auction. What does your analysis above imply about this claim? Is escalation in this model (with or without charity) solely attributable to the sunk-cost fallacy? Explain why or why not.  

  3.  **Extension (3 points):**  
      - Suppose *α* is **private information** (i.e., each bidder knows their own *α* but not the other’s, and values may differ). How might this change the strategic dynamics or potential for escalation? Briefly discuss.  

  ---

  ### Model Answer (780 words)

  **1. Analysis of Bidder B’s Decision**  

  At the arbitrary stage, Bidder B (second-highest bidder, current bid = *s*) considers raising to *n* > *b* (current high bid = *b*). Their payoffs depend on their action and Bidder A’s subsequent response:  

  *(i) Payoff if B drops out:*  
  - B pays *s* (losing bid) → Donation = *s* + *b* (B pays *s*, A pays *b*).  
  - B receives no dollar, but values total donations: Benefit = *α*(*s* + *b*).  
  - **Net Payoff_B (Drop Out) = -s + α(s + b) = αb + s(α - 1)**  

  *(ii) Payoff if B raises to n and WINS (A drops out):*  
  - B pays *n* (winning bid) → Donation = *n* + *s* (B pays *n*, A pays *s*).  
  - B wins $1 and values donations: Benefit = 1 + *α*(*n* + *s*).  
  - **Net Payoff_B (Raise & Win) = 1 - n + α(n + s) = 1 + αs + n(α - 1)**  

  *(iii) Payoff if B raises to n and LOSES (A outbids B):*  
  - B pays *n* (now the *losing* bid) → Donation = *n* + (*A’s final bid*).  
  - B receives no dollar, but values total donations. Critically, once B bids *n*, *s* is sunk and irrelevant to future payments. The new effective lower bid is *b* (A’s previous high bid), and the new higher bid is *n* (B’s bid). If A outbids B, A pays some *m* > *n*, B pays *n*. Total donation = *m* + *n*.  
  - **Net Payoff_B (Raise & Lose) = -n + α(m + n) = αm + n(α - 1)**  

  **Rationality of Raising:** Bidder B will raise to *n* only if the *expected payoff* of raising exceeds the payoff of dropping out. However, Bidder B *cannot force a win*; raising triggers a subgame where A may bid again. The minimal condition for raising to be rational is that B’s payoff if they **win immediately** (A drops out) is better than dropping out. If even this best-case scenario isn’t profitable, raising is irrational. Thus, we compare (ii) vs. (i):  

  **Raise & Win Payoff > Drop Out Payoff**  
  [1 + αs + n(α - 1)] > [αb + s(α - 1)]  

  Simplify:  
  1 + αs + nα - n > αb + αs - s  
  1 + nα - n > αb - s  
  1 - n(1 - α) > αb - s  

  **Critical Condition:**  
  **1 - αb + s > n(1 - α)**  
  or equivalently:  
  **n < [1 - αb + s] / (1 - α)**  

  This represents the maximum bid *n* Bidder B could rationally make *if they believed A would drop out*. The term **[1 - αb + s] / (1 - α)** is the threshold. Crucially, since *b* > *s*, and *α* < 1, the threshold **exceeds $1**.  

  **Effect of α:** The denominator (1 - *α*) is less than 1. Therefore, for any given *b* and *s*, **α > 0 increases the threshold bid *n* that B is willing to risk** compared to the standard auction (*α* = 0, where threshold = 1 + *s* - *b*). For example, if *b* = $0.60, *s* = $0.50, *α* = 0:  
  Threshold = 1 + 0.50 - 0.60 = $0.90.  
  With *α* = 0.4:  
  Threshold = [1 - (0.4)(0.60) + 0.50] / (1 - 0.4) = [1 - 0.24 + 0.50] / 0.6 = 1.26 / 0.6 = **$2.10**.  

  **Impact on Escalation:** The charitable feature (**α > 0**) **exacerbates escalation**. It significantly *raises* the bid levels rational bidders are willing to offer at each stage. Bidders internalize part of the cost (*α*) via warm glow, lowering their *net* cost of bidding. This makes aggressive bidding rational for longer, pushing bids higher than in the standard auction. The winner still gains $1, but both bidders perceive a smaller net loss from their payments.  

  **2. Interpretation: Sunk-Cost Fallacy**  

  The analysis shows escalation can be **fully rational** in this model, contradicting the claim that dollar-auction escalation is *solely* attributable to the sunk-cost fallacy.  

  *   **Sunk Costs Are Irrelevant:** Bidder B’s sunk bid *s* factors identically into both the "Drop Out" and "Raise & Win" payoffs (compare the *s(α - 1)* terms). When comparing these options, *s* cancels out! The decision to escalate hinges *only* on the *current high bid (b)*, the *proposed new bid (n)*, *α*, and the prize value ($1). Rational bidders ignore sunk costs (*s*); they focus on incremental costs and benefits.  
  *   **Source of Rational Escalation:** The trap arises from the **commitment structure** and **positive externalities**. When B bids *n*, they create a new "floor" (*b*) for A. If A outbids, B still gets warm glow from A’s higher payment (*m*). This potential benefit, combined with the chance A might drop out allowing B to win cheaply (*n* slightly above *b*), makes incremental escalation rational – even though the *total* expenditures become socially wasteful (donations exceed $1). The sunk-cost fallacy label oversimplifies; the core driver is rational strategic interaction under specific rules generating positive externalities tied to the *opponent’s* costs.  

  **3. Extension: Private α Values**  

  If *α* is private information, strategic uncertainty increases, potentially leading to **more frequent and severe escalation**, though outcomes become less predictable.  

  *   **Misestimation of Opponent’s Threshold:** A bidder with high *α* might escalate aggressively, assuming their opponent also values donations highly and thus has a high continuation threshold. Conversely, a bidder with low *α* might underestimate their opponent’s willingness to bid.  
  *   **Overbidding and Underbidding:** High-*α* bidders may bid *beyond* levels rational against a known low-*α* opponent, expecting the opponent to value their high bid’s donation. Low-*α* bidders might drop out *too early* against a high-*α* opponent, failing to exploit the opponent’s willingness to pay.  
  *   **Increased Risk of Losses:** Asymmetric information makes coordination harder. Bidders are more likely to misjudge when the opponent will quit, increasing the chance both bid very high, resulting in large net losses for the loser and suboptimal donation efficiency. Private *α* adds another layer of uncertainty that generally fuels escalation risks.  

  ---

  ### Marking Scheme (20 points total)

  **A+ Answer (18-20 pts) Must Demonstrate:**  
  1.  **Correct Payoff Setup:** Formulas for (i) Drop Out, (ii) Raise & Win, and (iii) Raise & Lose include *all* components: payment, $1 prize (if won), and warm glow *α* applied to *total* donation (*s* + *b* for drop out; *n* + *s* for B win; *m* + *n* for B lose).  
  2.  **Accurate Comparison:** Explicitly compares Raise & Win vs. Drop Out payoffs as the minimal rational condition. Derives the inequality **n < [1 - αb + s] / (1 - α)** clearly. Explains why this comparison is used (B cannot force a win, but won't bid if winning isn't profitable).  
  3.  **Effect of α:** States *α* > 0 **increases** the threshold bid *n* compared to *α*=0, using the formula (e.g., notes reduced net cost due to denominator (1-*α*) < 1). Concludes charity **exacerbates** escalation.  
  4.  **Sunk-Cost Critique:** Explicitly states sunk cost *s* cancels out in the key comparison, proving it’s irrelevant. Attributes rational escalation to the strategic structure (new floor bid, positive externality from opponent's payment) and refutes "solely sunk-cost fallacy."  
  5.  **Private α:** Identifies increased uncertainty, potential for miscoordination (overbidding by high-*α*, underbidding by low-*α*), and higher risk of large losses.  

  **B Answer (14-17 pts) Demonstrates:**  
  *   Mostly correct payoffs but minor errors (e.g., misapplies *α* only to own bid).  
  *   Correct comparison method but derivation has algebraic slips.  
  *   Correctly identifies *α* exacerbates escalation but with weak/no formula support.  
  *   Mentions sunk costs aren't the full story but doesn't show *s* cancellation.  
  *   Discusses private *α* causing uncertainty but lacks specific mechanisms (over/underbidding).  

  **Common Errors (Point Deductions):**  
  -   **-2 to -4 pts:** Major payoff errors (e.g., treats warm glow as rebate: Payoff = -*(1-α)x* + prize; or applies *α* only to own bid, not total donation).  
  -   **-2 to -3 pts:** Incorrect comparison (e.g., compares Raise & Win only vs. current loss; ignores subgame; assumes B forces win).  
  -   **-2 pts:** Claims charity *reduces* escalation (misinterprets warm glow as cost reduction only).  
  -   **-1 to -2 pts:** Fails to derive threshold formula clearly; just describes.  
  -   **-2 pts:** Attributes escalation *only* to sunk-cost fallacy without critique.  
  -   **-1 to -2 pts:** Omits discussion of *s* cancellation in sunk-cost section.  
  -   **-1 to -2 pts:** Superficial treatment of private *α* (e.g., "it makes it harder" without mechanisms).  
  -   **-1 pt:** Neglects the role of the gap (*b* - *s*) in the threshold.  

  **A vs. B Distinction:**  
  *   **Clarity & Completeness:** An "A" answer derives the key condition **n < [1 - αb + s] / (1 - α)** explicitly and uses it to explain *α*'s exacerbating effect. A "B" answer might describe it intuitively but lack rigorous derivation.  
  *   **Sunk-Cost Insight:** An "A" answer **proves** sunk cost irrelevance via the cancellation of *s*. A "B" answer merely asserts it isn't the only cause.  
  *   **Private α Depth:** An "A" answer specifies *how* private values cause miscoordination (high-*α* overbids expecting high opponent threshold; low-*α* underbids/quit early). A "B" answer just notes "more uncertainty."
