answer: |-
  As an algorithmic information theorist who's spent decades wrestling with these demons, I admire your ambition. The tension you sense is real, profound, and arguably fatal to your protagonist's dream. Let's dissect the core requirements for any formal account claiming to "settle" induction, focusing on the phenomena they address, the disasters they prevent, and the ways they tear at each other. I'll structure this as a list of desideria, each driven by a fundamental intuition or problem in learning, followed by the conflicts and consequences.

  ### Core Desiderata for a Universal Learning Rule

  1.  **Asymptotic Convergence to Truth (The Hope of Learning):**
      *   **Driving Phenomenon:** We expect that if we see *enough* data generated by *some* underlying process (deterministic or stochastic), our beliefs should eventually lock onto the correct hypothesis about that process. If the sun rises every morning for an eon, we should eventually be *very* sure it will rise tomorrow.
      *   **Requirement:** For *any* computably describable process generating the data stream, and for *any* hypothesis accurately describing that process, the learner's probability assigned to that true hypothesis must converge to 1 as the data sequence grows infinitely long. Conversely, the probability assigned to any hypothesis incompatible with the true process must converge to 0.
      *   **Absurdity if Dropped:** Without this, learning is fundamentally unreliable. The learner could oscillate forever, latch onto a false hypothesis permanently, or simply never gain significant confidence in the truth, even with infinite perfect data. This makes the very idea of "learning from experience" incoherent.

  2.  **Optimality / Minimax Regret (The Dream of Universality):**
      *   **Driving Phenomenon:** We want a single, principled rule that works well *no matter what world we find ourselves in*. It shouldn't require us to guess the correct domain (physics, biology, economics) or type of process (simple law, complex chaos, pure randomness) in advance.
      *   **Requirement:** The learner's predictions (or probability assignments) should be "as good as possible" in the long run, compared to *any* other computable prediction strategy one might have adopted *in hindsight*. Specifically, the cumulative "regret" (difference in prediction loss, like log-loss) compared to the best *computable* strategy tuned to the *actual* data sequence should grow slower than any computable function of the data length. It should not be *dominated* by any competitor infinitely often.
      *   **Absurdity if Dropped:** Without this, the rule is just *one* heuristic among many, potentially disastrously wrong in environments it wasn't designed for. An "optimal" rule justifies its universality claim.

  3.  **Incorporation of Simplicity (Occam's Razor Formalized):**
      *   **Driving Phenomenon:** Simpler explanations (fewer parameters, shorter descriptions) are preferred *a priori* and often converge faster. "The planets move in ellipses" beats "Here's a list of every observed position so far" or "Angels push them in complex paths".
      *   **Requirement:** The learner must have a built-in, formal bias towards "simpler" hypotheses. Crucially, this bias must be *derived* from fundamental principles (like computation or description length), not just assumed *ad hoc*. Simplicity is measured by the length of the shortest program (on some universal computer) that *describes* the hypothesis or *implements* the process it postulates (Kolmogorov complexity).
      *   **Absurdity if Dropped:** Without a principled simplicity bias, the learner is paralyzed by infinitely many complex hypotheses fitting the data equally well (the "Curve-Fitting Problem"). It could latch onto overly complex noise-fitting models. The rule wouldn't capture the core of scientific reasoning.

  4.  **Temporal Coherence / Bayesian Consistency (Avoiding Self-Sabotage):**
      *   **Driving Phenomenon:** Beliefs should update rationally with new evidence. Yesterday's posterior belief given yesterday's data *should* be today's prior belief before seeing today's data. You shouldn't constantly contradict your past conclusions without new contradictory evidence.
      *   **Requirement:** The learner's belief state (its probability distribution over hypotheses) must evolve according to Bayes' theorem: the posterior probability after seeing new data is proportional to the prior probability times the likelihood (probability of the new data *given* each hypothesis).
      *   **Absurdity if Dropped:** Violating coherence allows Dutch Books (sure-loss betting strategies). The learner could assign high probability to a hypothesis, see data perfectly consistent with it, and *decrease* its confidence due to an irrational update rule. This undermines the very notion of learning *from* the data.

  5.  **(Approximate) Computability (The Ghost in the Machine):**
      *   **Driving Phenomenon:** The rule must be something a mind or machine could *actually implement*, at least in principle or with reasonable approximation. We are finite beings running algorithms.
      *   **Requirement:** The learner's predictions (next data point probabilities) or posterior beliefs after any finite data sequence must be computable by some algorithm (ideally, efficiently computable, but minimally, just computable).
      *   **Absurdity if Dropped:** An incomputable rule is a Platonic abstraction, not a learning procedure usable by any physical agent (human or AI). It provides no concrete guidance. Saying "just use Solomonoff" is like saying "just solve the Halting Problem" – impossible for any real computer. This is the statistician and computer scientist's main cannon.

  6.  **Language/Encoding Invariance (The Myth of Objectivity):**
      *   **Driving Phenomenon:** The truth shouldn't depend on how we *describe* it. Whether we describe a hypothesis in English, French, binary, or a custom programming language, the underlying reality is the same. The learner's convergence shouldn't be an artifact of an arbitrary choice of description language.
      *   **Requirement:** The learner's asymptotic behavior (convergence to the truth) and its *qualitative* preference ordering over hypotheses (which is simpler) should be invariant (up to a bounded constant) under the choice of a "reasonable" universal computer or description language used to measure Kolmogorov complexity. The rule shouldn't be *tricked* by a malicious encoding.
      *   **Absurdity if Dropped:** Without invariance, "simplicity" and "truth" become relative to the arbitrarily chosen programming language. The protagonist could be accused of rigging the game by picking a language where *her* favorite theory happens to be the shortest. This is the philosopher's dagger.

  7.  **Handling Stochasticity (The Real World's Noise):**
      *   **Driving Phenomenon:** The world is noisy. Data isn't generated by perfect deterministic laws but often by probabilistic processes (quantum mechanics, coin flips, noisy sensors). Learning must account for randomness.
      *   **Requirement:** The learner must assign non-zero probability to genuinely stochastic hypotheses and correctly converge on the true underlying probabilities (e.g., not just predict the next bit, but predict the *probability* of the next bit being 1). It shouldn't mistake random noise for complex determinism or vice-versa.
      *   **Absurdity if Dropped:** The learner would fail catastrophically in noisy environments. It might see random coin flips and try to fit an ever-more-complex deterministic pattern, becoming increasingly certain of a false deterministic law, never recognizing randomness.

  8.  **Non-Arbitrary (Universal) Prior (The Foundation Stone):**
      *   **Driving Phenomenon:** To start learning, you need initial beliefs (priors). These shouldn't be arbitrary whims; they should reflect a "state of maximum ignorance" or "maximum neutrality" before seeing any data, embodying the simplicity principle from (3).
      *   **Requirement:** The prior probability assigned to a hypothesis must be a function *only* of its intrinsic complexity (Kolmogorov complexity), typically exponentially decreasing with it (`P(h) ~ 2^{-K(h)}`). This prior must be defined for *all* computably describable hypotheses.
      *   **Absurdity if Dropped:** Without a universal prior justified by complexity, the initial bias is arbitrary. The learner's long-term convergence might depend crucially on luck or an initial guess baked into the prior, undermining the claim of objectivity and universality. It risks begging the question.

  ### The Inevitable Conflicts and Trade-offs

  The tragedy – and the dramatic core for your novel – is that these requirements *cannot all be perfectly satisfied simultaneously*. Here's where they tear each other apart:

  *   **Optimality (2) vs. Computability (5): The Grand Canyon.**
      *   **Conflict:** Solomonoff induction satisfies (1, 2, 3, 4, 7, 8) beautifully... but it is *provably uncomputable* (5). There is no algorithm that can compute the Solomonoff prior or posterior exactly for arbitrary hypotheses and data. You can approximate it, but you lose the *provable* guarantees of optimality (2) in the process. Conversely, enforcing *strict computability* (5) means you *cannot* have a predictor that is provably *as good as every other computable predictor* (2) in all environments. (This is related to the "No Free Lunch" theorems and the uncomputability of Kolmogorov complexity). **This is likely the central battleground.** Your computer scientist will hammer this: "Your goddess is a hallucination, a ghost no machine can ever embody!" Your statistician will add: "And my computable Bayes, with *my* carefully chosen prior and model class, will outperform your uncomputable phantom on *real* data in *finite* time!"
      *   **Consequence:** Enforcing strict computability (5) eliminates any hope of *universal* optimality (2). All computable learners have "Achilles' heel" environments where they fail badly compared to some other computable learner tuned to that environment.

  *   **Language Invariance (6) vs. Well-Defined Universal Prior (8): The Relativity Trap.**
      *   **Conflict:** While Kolmogorov complexity is invariant *up to a constant* for "reasonable" universal languages, that constant can be *arbitrarily large* depending on the languages chosen. This constant directly impacts the *prior probabilities* (8). A hypothesis might be vastly "simpler" (have much higher prior) in one language than in another. While the *asymptotic convergence* (1) might be preserved, the *path* to convergence, the speed, and the *finite-data* beliefs are heavily language-dependent. **This is the philosopher's main thrust:** "Your 'objective' simplicity is an illusion cast by your arbitrary choice of programming language! You haven't *derived* Occam's Razor; you've merely encoded your aesthetic preference into the machine!"
      *   **Consequence:** Absolute language invariance (6) for the *prior* and *finite-data beliefs* is impossible. The "universal" prior (8) is only universal relative to a fixed universal machine. Change the machine, change what's simple.

  *   **Asymptotic Convergence (1) vs. Finite Data Usefulness (The Human Condition):**
      *   **Conflict:** Asymptotic guarantees (1) are cold comfort for finite beings with finite data. The convergence could be mind-bogglingly slow (e.g., longer than the age of the universe) for complex truths. A rule satisfying (1) and (2) might be useless in practice. Conversely, rules that work well fast on finite data (emphasizing 5) often lack strong asymptotic guarantees (1, 2) outside their intended domain.
      *   **Consequence:** The protagonist's rule, even if it existed, might be useless for real-world decisions. The antagonists will argue that good judgment requires domain-specific knowledge and heuristics, not waiting for infinity.

  *   **Simplicity via Kolmogorov Complexity (3,8) vs. Recognizability (The Halting Problem's Shadow):**
      *   **Conflict:** Kolmogorov complexity itself is *uncomputable*. There's no algorithm to find the shortest program for an arbitrary string/hypothesis (due to the Halting Problem). While the *prior* based on it (8) might be defined, actually *finding* the relevant short hypotheses to update (4) is computationally intractable. Simplicity becomes a beautiful but inaccessible ideal.
      *   **Consequence:** Implementing the learning rule coherently (4) using the Kolmogorov prior (3,8) is fantastically difficult, even if computability (5) is relaxed to allow approximations. This feeds into the computability conflict (5).

  **The Single Most Devastating Requirement:** If I had to pick one requirement whose *strict* enforcement eliminates the most ambitious contenders (like your protagonist's dream), it's **Computability (5)**. Demanding that the learning rule be *exactly computable* by an algorithm immediately shatters the dream of *universal optimality (2)* and makes the full Solomonoff prior (8) unusable. It forces you into the messy world of finite model classes, approximate priors, and no guarantees against being blindsided by an environment your chosen class can't handle. **This is the statistician and computer scientist's kill shot.**

  **How the Contenders Fare (A Glimpse):**

  *   **Solomonoff Induction (The Protagonist's Ideal):** Scores perfectly on (1, 2, 3, 4, 7, 8). Fails catastrophically on (5) and only achieves limited (constant-bounded) invariance (6). The uncomputability is fatal for implementation.
  *   **Bayesian Inference with Fixed Model Class (The Statistician):** Satisfies (1, 4, 5, 7) if the true model is in the class. Fails (2) and (8) spectacularly (optimality and prior are domain-specific choices). Fails (3) unless simplicity is manually baked into the prior. Fails (1, 2) if the true model is outside the class ("model misspecification").
  *   **Minimum Description Length (MDL) Principle (The Pragmatic Computer Scientist):** A computable approximation favoring (3, 5). Tries for (1, 2) within a class but lacks universal guarantees. Prior (8) is approximated via code lengths in a chosen language, suffering the invariance (6) problem. Coherence (4) can be maintained but is not always the focus.
  *   **PAC Learning (The Theoretical Computer Scientist):** Focuses on (1, 5) under distributional assumptions. Ignores priors (8), Bayesian coherence (4), and universal optimality (2). Simplicity (3) is often measured by VC-dimension, not Kolmogorov complexity.
  *   **No Free Lunch Theorems (The Cynic):** Formally prove that no learner can satisfy (2) universally while being computable (5) and useful. Necessitates domain-specific assumptions.

  **The Dramatic Verdict:** Your protagonist's theorist has glimpsed a profound and beautiful ideal: Solomonoff induction captures the essence of what *ideal* learning *should* be. Her antagonists are brutally correct that this ideal is fundamentally unattainable by any physical being or machine (`Computability`), rests on an ultimately arbitrary foundation (`Language Invariance`), and its guarantees are uselessly asymptotic (`Finite Data`). Her claim to have "derived" simplicity is true only relative to her chosen universal machine; she hasn't banished the ghost of subjectivity (`Language Invariance` vs. `Universal Prior`). The core tension is irreconcilable: the very features that make the ideal universal and optimal (`Optimality`, `Universal Prior`) are what doom it to incomputability and language-dependence. The "one correct way" cannot exist as an implementable rule; it is a North Star, forever guiding but forever out of reach. The true battleground isn't whether the ideal exists, but whether its unattainable light is a useful guide or a dangerous illusion in the practical, finite, messy business of gaining knowledge. That's where your characters will find their most compelling arguments.
