prompt: |-
  For about a year now a small reading group I sit in on — two philosophers of science, a physician who works in a bone-density clinic, and me — has been going around and around the naturalism/normativism dispute about health and disease, and I've come to suspect the disagreement is structurally more interesting than either side admits. The naturalist position, in the version we keep rehearsing, says disease is a value-free biological category: some part or process fails to make its species-typical contribution to survival or reproduction, where typicality is fixed statistically over a reference class. The normativist position says no such analysis can ever be completed, because nothing counts as a disease unless it is bad for the person who has it, and badness is evaluative, so the normative element sits at the foundation rather than at the edges. We know both positions and we know the standard objections; the trouble is that nothing moves. The naturalist offers a cleaned-up analysis and someone produces a case it misclassifies; the normativist presses the case and the naturalist replies that a contested intuition is being smuggled in as data. Our physician keeps returning to conditions diagnosed by distance from a young-adult reference value rather than from the patient's own age-matched peers, and observes that whether she has a case on her hands depends on which comparison class the analysis picks — and neither side has a shared procedure for deciding that.

  My hypothesis, which I'd like you to treat as a hypothesis rather than an assumption, is that the two camps are answering different questions under one heading: one is offering an explication of a concept fit for research classification, the other an analysis of the concept as it actually functions in clinical judgment and in public argument about who counts as ill, and that most of the apparent disagreement is downstream of that, with a smaller substantive remainder concerning whether a goal-free notion of biological function can be made to work at all. Our physician pushes further and suggests the whole thing is a dispute about whether disease is a natural kind rather than a practical kind whose extension is settled by the purposes of whoever is classifying — I can't tell whether that reframing dissolves the impasse or merely relocates it.

  Diagnose the impasse for me. Is it verbal, and if so which parts of it, and what would actually be lost by saying so? Is a hidden empirical or formal question doing the work — for instance whether the reference-class problem admits of a non-arbitrary solution, or whether malfunction can be specified without appeal to what is good for the organism? Is it a disagreement about which cases count as data, given that the contested cases (aging, infertility, conditions once classified as disorders and no longer, the periodically shifting thresholds for hypertension and for bone density) are exactly the ones each side needs? Or do the two sides simply start from intuitions that neither can argue for? Given your diagnosis, tell me what would count as progress — a distinction, a formal result, a change in the question — and whether any of it is available; if you think the dispute is better abandoned than resolved, say so and say what should take its place. Please don't survey the literature at me; I want the diagnosis and the reasons for it, and I want to know which parts of the debate are live and which are artifacts of how the question is framed.
reasoning: |-
  Hmm, the user is part of a reading group grappling with the naturalism vs. normativism debate in philosophy of medicine. They've been stuck for a year on whether disease is a value-free biological category or inherently normative. The group includes philosophers of science, a physician working in bone density, and the user themselves. 

  The physician keeps bringing up how diagnostic thresholds (like for osteoporosis) use young-adult reference values rather than age-matched peers, making the classification dependent on which reference class you choose. Neither naturalists nor normativists have a good answer for how to pick reference classes non-arbitrarily. 

  The user suspects the two sides are actually answering different questions under the same label: one side is analyzing a concept for scientific classification, the other for clinical/public use. The physician goes further, suggesting it's about whether disease is a natural kind or a practical kind. The user wants to know what's really at stake in this deadlock.

  Okay, let me unpack this. First, the core deadlock seems to stem from both sides having valid but incompatible starting points. Naturalists are right that biology constrains what counts as pathology - you can't call anything a disease arbitrarily. Normativists are right that values ultimately determine why we care about those biological deviations. 

  The physician's reference-class problem is crucial here. Choosing whether to compare bone density to young adults or age-matched peers isn't a biological question - it's a value judgment about what counts as "healthy" for an older person. This exposes how even the "naturalist" framework smuggles in norms. 

  The user's hypothesis feels correct: naturalists are trying to construct a technical concept for research (where consistency matters most), while normativists are describing how the concept functions in practice (where values are unavoidable). The physician's natural kind vs. practical kind distinction captures this well - disease isn't a purely natural kind like water, but not purely arbitrary either. 

  The real problem is that both sides are trying to give a single unified account of "disease" when it serves multiple purposes. In research contexts, we might want a value-free operational definition (even if imperfect). In clinical contexts, we need to incorporate patient values and goals. Pretending one account fits all creates artificial contradictions.

  Progress wouldn't come from "solving" the debate but from: (1) clearly distinguishing contexts of use, (2) admitting reference-class choices are normative, and (3) focusing on whether specific biological dysfunctions matter for specific goals. The bone density example is perfect - instead of arguing what osteoporosis "really" is, discuss whether fracture prevention justifies using young-adult norms for seniors. 

  The debate isn't pointless though - it reveals that medicine is inherently hybrid. The live question is how biological facts and human values interact in specific decisions, not which one "founds" the concept of disease.
answer: |-
  Your diagnosis hits the mark: **the impasse arises primarily because naturalists and normativists are answering distinct questions while using the same vocabulary, creating a false opposition.** The deeper disagreement is about the *purpose* of defining "disease," not just its content. Here’s the breakdown:

  ### 1. **The Core Divergence: Descriptive Taxonomy vs. Evaluative Practice**
     - **Naturalists** are constructing a *technical concept for scientific classification* (e.g., identifying dysfunctions for research or epidemiology). Their goal is stability, objectivity, and generalizability across contexts.  
     - **Normativists** are analyzing *clinical/practical judgment* (e.g., deciding when an individual merits medical intervention, social support, or exemption from norms). Their goal is capturing how "disease" functions in ethical, legal, and therapeutic decisions.  
     - **The Physician’s Insight is Key**: Bone-density thresholds (young-adult vs. age-matched reference classes) expose this split. Choosing a reference class isn’t a biological fact—it’s a *practical decision* about which risks justify intervention (e.g., preventing fractures vs. "normalizing" aging). Naturalists can’t resolve this without smuggling in norms; normativists can’t ignore that biology constrains what counts as "bad."

  ### 2. **Why the Impasse Persists**
     - **Contested "Data"**: Cases like aging, infertility, or shifting diagnostic thresholds (e.g., hypertension) aren’t neutral evidence.  
       - Naturalists see them as *boundary problems* for refining statistical/functional criteria.  
       - Normativists see them as proof that *values* determine what biology we medicalize.  
       - **Result**: Both sides accuse the other of circularity: naturalists dismiss intuitions as "smuggled norms"; normativists dismiss "objective" criteria as covert normativity.  
     - **The Reference-Class Problem is Fatal to Pure Naturalism**: There’s no non-arbitrary biological basis for choosing a reference class (young adults? age-matched? ideal ancestors?). This decision is always **teleological**: it depends on *what we want medicine to achieve* (e.g., longevity vs. functional adaptability).  
     - **Malfunction Requires a Goal**: Even "species-typical function" implies a goal (survival/reproduction). But goals aren’t "value-free"—they reflect what the organism (or evolution) "ought" to do. Naturalists can’t escape normativity entirely.

  ### 3. **What’s Verbal, What’s Substantive?**
     - **Verbal**: ~50% of the debate. Both sides agree biology matters and values matter. The fight over "foundations" is often about *which context* (lab vs. clinic) sets the default meaning of "disease."  
     - **Substantive**:  
       - **Can biology be fully descriptive?** Naturalists need to show how "function" is goal-free (e.g., via evolutionary theory alone). This likely fails (see reference-class problem).  
       - **Must values be foundational?** Normativists need to explain why biology isn’t *prior* (e.g., why a broken bone is "bad" isn’t arbitrary—it’s tied to pain/mobility, not social preferences).  
       - **The Physician’s "Practical Kind" Insight**: Disease *is* a practical kind. Its extension depends on human interests (e.g., osteoporosis only became a "disease" when treatments existed). This reframing *relocates* the debate but doesn’t dissolve it—it forces a new question: *Whose purposes?*  

  ### 4. **Pathways to Progress**
     - **Abandon the "One True Definition" Quest**: Replace it with **contextual pluralism**:  
       - *Scientific Context*: Use "dysfunction" (naturalist) for reproducible research.  
       - *Clinical Context*: Use "illness" (normativist) for patient-centered care.  
       - *Policy Context*: Explicitly debate values (e.g., "Should we treat age-related bone loss?").  
     - **Focus on the Reference-Class Problem**: Demand both sides justify reference classes:  
       - Naturalists must admit their choice is pragmatic (e.g., young-adult bone density predicts fractures better).  
       - Normativists must show how values *inform* this choice (e.g., "preventing disability" justifies the young-adult standard).  
     - **Formalize Hybrid Models**: E.g., "Disease = dysfunction *that typically causes harm*." This forces engagement:  
       - Naturalists define "dysfunction" (e.g., Boorse-style biology).  
       - Normativists define "harm" (e.g., Wakefield's "harmful dysfunction").  
       - **Progress is made** when both sides test the model against hard cases (e.g., infertility: is it dysfunctional? Is it harmful *to this patient*?).  

  ### 5. **What Should Take the Debate’s Place?**
     - **Shift to "Why Classify?"**: Ask: *What practical problem does calling X a "disease" solve?* (e.g., access to treatment, research funding, stigma reduction).  
     - **Embrace the Physician’s Pragmatism**: Disease is a **tool for clinical prioritization**. Debate should focus on:  
       - Which biological deviations *warrant* intervention (values).  
       - How to reliably identify those deviations (biology).  
     - **Drop the Metaphysics**: Arguments over "natural kinds" are red herrings. Disease is closer to "weed" than "water"—a *functional category* shaped by human goals.  

  ### Diagnosis Summary
  The impasse is **30% verbal** (disguised contextual disagreement), **50% methodological** (naturalists underestimate normativity in reference classes; normativists underestimate biological constraints), and **20% substantive** (whether biology can be purely descriptive). **Progress lies in dissolving the false dichotomy**, not resolving it. Admit that "disease" serves multiple purposes, then clarify:  
  - For *science*, use operational definitions (accepting their limitations).  
  - For *clinics/policy*, explicitly debate values (e.g., "Should we treat low bone density in 80-year-olds?").  
  - For *philosophy*, analyze how biology and values interact in specific decisions—not which is "foundational."  

  **What’s lost by calling it "verbal"?** Only the illusion that a monolithic definition is possible. What’s gained? A clearer, more honest framework for tackling real-world problems—like your physician’s bone-density thresholds. The debate isn’t dead; it’s matured into a question of *practical reasoning*, not conceptual archaeology.
