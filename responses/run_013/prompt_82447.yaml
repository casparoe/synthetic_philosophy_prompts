prompt: |-
  For about a year now I've been trying to settle, for myself, where the line falls between what I owe other people and what I merely may do for them, and I've reached the point where I'd like an outside opinion, because the way I've been thinking about it lately may be doing more harm than good. The practical question is this. I'm thirty-four, no children, a job I'm competent at and indifferent to, and enough savings that I could take a year off without much damage. My aunt, who lives two hours away, is in the early stages of dementia and has nobody else nearby; my cousins have scattered. I could take unpaid leave, move in with her for a year, and manage her care until something more permanent is arranged. My sister says that settles it: if I'm the one who can do it, and the alternative is that my aunt goes into a home she'll hate, then the year is mine to give, and calling it a sacrifice is just vanity. My partner says the opposite — that my sister has turned my life into a debt I never agreed to, and that there is a real difference between what is demanded of me and what is merely admirable. I don't trust either of them, partly because I suspect each is defending the answer that suits them.

  What I'd like help with is the framework I've been using, which I'll lay out because I can't tell whether it's an insight or a rationalization. I picture morality as having a floor and a stretch of open ground above it. The floor is what I have to do: keep my promises, don't lie, don't let someone go hungry when feeding them would cost me little. Above the floor, I've been assuming, nothing is required, but some things are still better than others, and when I do them I'm building up something like a balance. So when I spent four weekends last spring helping a friend renovate a house I had no stake in, I told myself I'd banked something; and when I skipped my best friend's wedding in the fall for no good reason, I told myself the banked surplus covered it. My sister says this is just indulgences — that I've invented a currency in which to buy exemptions from obligations I actually have.

  My question is whether she's right. If an act really is optional, can it be spent like that, or does the very fact that I can spend it show it was never optional, only a different kind of debt? And if the floor-and-surplus picture can't survive that objection, is there a version of it that can — something that tells me where the floor sits without collapsing into the claim that everything I could possibly do is owed? Finally, and most practically: given whatever you conclude, what should I do about my aunt?
reasoning: |-
  Okay, let's start by unpacking the user's dilemma. They're struggling with the boundaries between obligation and optional kindness, specifically about caring for their aunt with dementia. The core of their framework is this floor-and-surplus morality model where the floor represents mandatory duties and surplus is voluntary good deeds that can offset failures. 

  First, I need to validate their effort in developing this framework—it's thoughtful and shows genuine moral wrestling. But their sister's "indulgences" critique hits a nerve because it challenges whether moral credits can exist if good deeds are truly optional. That's the philosophical knot: if an act is *truly* beyond obligation, can it later cancel out a lapse? Or does treating it as currency reveal it was secretly obligatory all along? 

  The partner's stance interests me too—they're protecting the user's autonomy against perceived familial guilt-tripping. Both sister and partner have clear biases (sister advocates sacrifice, partner rejects imposed duty), so the user is wise to mistrust both. 

  Practically, the aunt's situation has urgency: early dementia, no local support, aversion to care homes. The user's ability to help (no dependents, savings, flexible job) creates a "can implies ought?" pressure. But "can" isn't "must"—unless the floor includes "prevent grave harm when uniquely positioned to do so at reasonable cost." That's the hinge: is this a floor or surplus situation? 

  Their renovation example reveals the framework's flaw: skipping a friend's wedding isn't just "not good"—it might breach the floor (promises, loyalty). Using surplus to "cover" it suggests confusing optional acts with core duties. The bank metaphor risks commodifying relationships. 

  So how to reframe without collapsing into total obligation? Emphasize context: duties arise from relationships, not abstractions. The aunt's vulnerability + family tie likely places her above the floor—but *how far above*? The cost matters: a year of unpaid leave isn't trivial. Maybe the floor demands arranging *some* care, not necessarily providing it personally. 

  For the practical decision: they need triage, not dogma. Assessing alternatives (hybrid care? shorter stay? involving cousins?) could satisfy moral minimums without self-sacrifice. Their exhaustion with the framework suggests it's become punitive—time to ground choices in compassion (for aunt *and* self), not ledger-keeping. 

  Ultimately, they're asking: "Am I a bad person if I say no?" The answer is no—but saying yes might align with their deeper values. The surplus model isn't evil, just incomplete; replacing "banking" with "integrity" (doing good for its own sake) might ease their guilt. They’re overcomplicating because they care deeply—which is its own answer.
answer: |-
  Your framework is both insightful and flawed—a genuine attempt to map morality that risks becoming a ledger of self-justification. Let’s dissect it, rebuild a more resilient model, and address your aunt.

  ### 1. The Problem with "Banking" Surplus
  Your sister’s "indulgences" critique hits a nerve because **moral acts lose their voluntary nature when treated as currency**. If helping your friend renovate "banks" credit to offset skipping a wedding, you’ve subtly transformed both acts:
  - **The renovation** ceases to be a freely chosen kindness and becomes a transaction.
  - **Skipping the wedding** morphs from a moral failure (barring extreme circumstances) into a permissible withdrawal.  
  But obligations like honoring commitments (e.g., a wedding) aren’t negated by prior generosity—they exist independently. Banking surplus implies optional acts *retroactively* become obligatory to "pay for" failures, creating a contradiction.

  ### 2. A Better Framework: The Floor, the Ladder, and the Sky
  Retain your "floor" concept but reframe what lies above:
  - **The Floor:** Non-negotiable duties. Keeping promises, avoiding harm, basic reciprocity.  
    *Example:* You owe your aunt honesty if she asks about her condition; you don’t owe her your life savings.
  - **The Ladder:** Context-dependent obligations. These arise from **specific relationships**, **capacity**, and **consequences**.  
    *Example:* Your familial tie + her vulnerability + your ability to help = a strong pull to act. But *how* you act depends on competing claims (your well-being, partner’s needs). This isn’t binary duty—it’s a spectrum of responsibility.
  - **The Sky:** Supererogatory acts. True moral luxuries—admirable but not expected.  
    *Example:* Donating a kidney to a stranger. No one could demand this; no "debt" incurred by refusing.

  **Why this works:**  
  - Prevents "banking": Acts on the ladder or sky gain value from their integrity, not transactional power.  
  - Acknowledges gray areas: Your aunt’s care sits on the ladder—demanding serious consideration but not absolute self-sacrifice.  
  - Guards against collapse: The floor holds firm; the sky remains optional. The ladder’s rungs depend on your unique circumstances.

  ### 3. Where Your Aunt Fits
  Your duty isn’t all-or-nothing. Key factors:
  - **Proximity & Capacity:** You’re nearby and able to help. This creates a *prima facie* obligation.
  - **Cost:** A year of your life, career delay, and relational strain isn’t trivial. Morality doesn’t demand unconditional self-destruction.
  - **Alternatives:** Is a nursing home truly the only option? What about in-home aides? Could cousins contribute financially? Exhausting alternatives is part of your duty.

  **This isn’t purely "optional" (sky) nor absolute (floor). It’s on the ladder—a significant demand requiring discernment.**

  ### 4. What To Do: A Practical Path Forward
  1. **Assess impartially:**  
     - Calculate *real* costs: Career impact? Savings depletion? Impact on your relationship?  
     - Research alternatives: Can your aunt afford part-time care? Could you fund aides with family contributions?  
     - Consult her doctors: How urgent is full-time care? What’s her prognosis?  

  2. **Reframe the choice:**  
     - Not *"Do I owe her a year?"* but *"What can I reasonably contribute without resentment?"*  
     - Could you commit to 3 months to stabilize her situation while arranging long-term care?  
     - Could you manage her affairs remotely with local support?  

  3. **Set boundaries:**  
     - If you go: Define an end date. Involve cousins in planning *now*. Protect your finances.  
     - If not: Ensure she has competent care. Visit regularly. Handle paperwork.  

  4. **Release the ledger:**  
     - Helping your aunt won’t "earn" future moral exemptions. Skipping a friend’s wedding remains a breach unless justified independently.  
     - Act out of compassion or familial loyalty—not to stockpile "surplus."  

  ### The Verdict
  **You likely have a ladder-duty to ensure your aunt’s well-being—but not to immolate your life for a year.** Sacrificing your stability when alternatives exist may even breed resentment, harming both of you.  

  **Do this instead:**  
  - Take 1-2 weeks off immediately to assess her situation hands-on.  
  - Call a family meeting (virtual). Propose a care plan with shared responsibilities.  
  - If cousins won’t help, hire a geriatric care manager to explore options.  
  - Contribute what you can *sustainably*—time, money, or oversight—without assuming sole burden.  

  Your framework’s flaw was conflating moral bookkeeping with integrity. Release the bank ledger. Tend to your aunt with clear eyes and guarded compassion—not as a debtor, but as a human making choices among competing goods. That’s where true morality lives.
