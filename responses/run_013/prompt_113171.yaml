  I'm a junior at a public high school, and I'm writing a paper for our philosophy club about a rule I've never heard anyone actually defend. To graduate, every student has to complete forty hours of unpaid community service — the school's slogan is that it forms citizens, not just students — and the hours can't be served with a political campaign or an advocacy group. Yet the same school lets students be excused from assigned readings on religious or conscientious grounds, and the handbook says the school takes no position on what anyone should believe. I'd like you to act as a philosopher who specializes in the liberalism/communitarianism debate and think this through carefully, beginning with a short brainstorm of the rival readings of these two rules before you settle on one. What view of the person and of obligation does the service requirement presuppose — does it need the communitarian idea that some obligations are unchosen and that the self is partly constituted by its community, or could a liberal defend compulsory service on other grounds, such as reciprocity for public schooling or the requirements of democratic citizenship? Which rival views does the requirement quietly rule out? Do the service rule and the opt-out rule presuppose the same picture of the person, or is the school simply inconsistent? Be explicit about which parts of the practice are genuinely presupposed and which merely fit one theory among several, and finish by saying what would have to change at my school if it adopted a thoroughgoing liberal position, and what would change under a thoroughgoing communitarian one. Please don't give me citations or a reading list — I have no library access and want the argument worked out from scratch.
