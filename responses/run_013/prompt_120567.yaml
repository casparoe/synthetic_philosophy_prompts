answer: |-
  Here's a defended ranking of live questions in von Neumann's brain project, judged by **upstream impact, feasibility for a solo theorist, originality, and defensibility to neuromorphic engineers**. I've flagged zombies and included your hunch (spoiler: it's #1).

  ---

  ### **Defended Ranking (Highest to Lowest Priority)**

  1.  **Your Hunch: The "Language" Problem (Population-Level Statistical Computation)**  
      **Why it's #1:**  
      - **Upstream Power:** This is *the* foundational issue. Von Neumann's core frustration was the mismatch between discrete, deterministic logic gates and the brain's stochastic, continuous, population-encoded signals. Crack this, and you reframe analog/digital debates, reliability, and memory architecture.  
      - **Feasibility:** A theorist *can* make progress here. Start with von Neumann's scattered remarks on "statistical logics" and "ensembles," then rigorously formalize:  
        - What *is* the computational unit? (e.g., spikes as symbols? population vectors? manifolds?)  
        - What mathematics describes *compositionality* in this regime? (Current stats/ML handles learning but not structured reasoning).  
      - **Not Just Connectionism:** Critics confuse *implementation* (neural nets) with *theory of computation*. Connectionism uses neurons for conventional computation. Your target is: **What computation *is* when the physical substrate forces statistical, aggregate primitives?** This is unexplored formal territory.  
      - **Defensibility:** Neuromorphic engineers hit this daily. Their analog/mixed-signal chips *feel* brain-like but lack theory for programming them robustly at scale. Offer a *computational framework* (not just models), and they'll listen.  
      - **Risk/Reward:** High. Could fail spectacularly... or define a new field.  

  2.  **Memory-in-Computation: Beyond Storage to Dynamic Addressing**  
      **Why it's #2 (and different from "memory storage"):**  
      - **Upstream Power:** Von Neumann saw memory-addressing as the brain's key divergence from computers. Neuroscience has data (engrams, place cells) but no *computational theory* explaining how volatile, distributed patterns are dynamically "addressed" *during processing*.  
      - **Feasibility:** Target the *interface*: How do control structures (attention? neuromodulation?) "select" relevant memory traces *as part of ongoing computation*? Formalize this as an **addressing-by-consensus** problem in population codes.  
      - **Avoids Redoing Neuroscience:** Focus on the *computational cost* of dynamic addressing in a noisy, distributed system. This is a gap engineers feel (e.g., in-memory computing bottlenecks).  
      - **Defensibility:** Directly impacts neuromorphic memory architecture. If you can show how brains avoid von Neumann bottlenecks without centralized addressing, they'll engage.  

  3.  **The Architecture of Complexity: Scaling Primitives to Cognition**  
      **Why it's #3 (and often overlooked):**  
      - **Upstream Power:** Von Neumann obsessed over how unreliable, slow components scale to reliable, fast cognition. Modern answers (error-correcting codes, overparameterization) are *engineering fixes* — not a theory of *cognitive* scaling.  
      - **Feasibility:** Analyze scaling through **hierarchical abstraction**: How do statistical primitives (#1) compose into stable "symbol-like" functions without formal logic? Use control theory/category theory to model emergence.  
      - **Defensibility:** Neuromorphic systems fail at scaling. A theory of how biology builds cognitive layers from messy parts would be gold.  
      - **Risk:** Less original than #1, but tractable.  

  ---

  ### **Lower Priority / Zombie Alerts**

  4.  **Analog vs. Digital: The Zombie Question 🧟**  
      **Why it's ranked low (and probably dead):**  
      - **Zombie Alert:** No agreed definitions. Is a spike train digital (timing) or analog (rate)? Is neuromodulation analog? **No experiment settles this** — it's a continuum. Neuroscience moved on to *specific mechanisms* (e.g., analog dendritic computation + digital spikes).  
      - **Downstream:** Depends on resolving #1 (the "language"). Arguing categories is philosophy; engineers need functional principles.  
      - **Feasibility:** You could taxonomize, but it won't move the needle.  
      - **Verdict:** Fund only if directly tied to #1 (e.g., "How do mixed-signal primitives enable statistical computation?").  

  5.  **Reliability from Unreliable Parts: Settled, but Misunderstood**  
      **Why it's ranked lowest:**  
      - **Secretly Answered?** Yes, by biology itself: **Degeneracy** (many paths to function), not redundancy or error-correction. Robustness emerges from system dynamics (e.g., attractor networks).  
      - **Downstream:** Implementation detail. Engineers know this (e.g., reservoir computing).  
      - **Feasibility:** You could formalize degeneracy mathematically, but it's a footnote to #3 (scaling).  
      - **Zombie Tendency:** If framed as "How does the brain do error-correction?", it ignores biology's core strategy: *embracing noise for exploration*.  

  ---

  ### **Strategic Recommendations**

  1.  **Lead with #1 ("The Language Problem")** — It's bold, upstream, and aligned with von Neumann's deepest itch. Frame it as:  
      *"Formalizing Computation When the Primitive is a Population: Towards a Mathematics of Statistical Aggregates"*.  
      **Defense to Engineers:** "Your hardware *is* statistical. Let's build a theory to program it."  

  2.  **Use #2 (Memory-in-Computation) as a Test Case** for #1. Ask: *"How does a statistical-computational system dynamically address its state-space?"*  

  3.  **Avoid Zombies by Focusing on Function:** Don't ask *"Is X analog?"* Ask *"What computational work does X enable in a statistical regime?"*  

  4.  **Deliverables for 2 Years:**  
      - A monograph formalizing "statistical computational units" (#1).  
      - A framework for dynamic memory addressing (#2) using those units.  
      - A seminar showing neuromorphic engineers how this refines *their* design choices.  

  **Your hunch is correct — and it's the heir to von Neumann's project.** It’s not connectionism; it’s a harder, deeper question about the *nature* of computation in continuous, stochastic, high-dimensional systems. If you can even partially formalize this, you'll give the engineers (and philosophers) something revolutionary to chew on. Fund the postdoc who can blend mathematical imagination with biological plausibility.
