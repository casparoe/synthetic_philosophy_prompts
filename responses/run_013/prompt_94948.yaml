prompt: |-
  Ok, so I'm finally writing the intro handout for the animal minds seminar and I want to do it in the right order for once. Every year I open with the usual menu — IIT, higher-order theories, global workspace, predictive processing — and then we spend three weeks watching each of them give a confident verdict on the octopus and completely flounder on the bee, and only at the end of week three does someone notice that nobody ever said what the theories were supposed to deliver in the first place. So this year it's spec first, theories after. Write me the desiderata for a theory of the distribution of consciousness across animals.

  Fix the purpose like this: the theory should be good enough to hand to a legislator who has to decide whether to extend welfare protections to farmed insects. Which means it has to give usable guidance under uncertainty, not just a verdict, and it has to be usable by someone who can't measure the thing directly.

  Go through the requirements one at a time, each with the case or consideration that puts it on the list, and push back if you think one of mine isn't a real requirement:

  - It has to have something to say about animals that get rebuilt or dismantled. The caterpillar's nervous system is largely taken apart and reassembled inside the pupa — is the butterfly the same subject, and is the theory even obliged to answer? The sea squirt larva swims around with a small brain and an eye and then, on settling, reabsorbs most of it. Does consciousness switch off there? Is that a prediction or an embarrassment?
  - It has to locate the subject in a cephalopod, where the great majority of the neurons aren't in the brain at all, and a severed arm will still go on doing arm things.
  - It can't let the verdict turn on neuron count as such. A bee has around a million and does things we'd call clever; a mouse has orders of magnitude more. "More neurons, more consciousness" is a proxy wearing a lab coat.
  - It has to be honest about split brains, and about cases where the number of subjects might not be exactly one.
  - It has to square with what's actually known about nociception without a cortex, and with convergent evolution — if the proposed mark of consciousness is a structure that birds and cephalopods each built independently, the theory can't rule them in or out by definitional fiat.
  - If it makes consciousness depend on a threshold — enough recurrent processing, enough integration, a feedback loop closing — it owes an account of where the line falls among real animals, and can't get away with "somewhere in there."
  - It has to fail in a way that's at least in principle detectable. If no possible evidence could count against it, say so and say what that costs.
  - It shouldn't be allowed to answer by re-describing the question (is the species conscious, is the clade conscious). I want to know what it says about individuals.

  Then the part I actually care about. Flag any pair of these you don't think can be satisfied together — if some subset is jointly unsatisfiable, that's the most interesting thing on the page and I want it stated as a result. Tell me which single requirement does the most work excluding the popular theories, and which of my items are just the prejudices of one camp dressed up as adequacy conditions. No citations needed, I know the literature, I want the argument. And go easy on the scorecard at the end, we'll do that in class.
reasoning: |-
  Alright, the user is preparing an intro handout for an animal minds seminar and wants to shift focus from theories to desiderata first. They’re frustrated with how existing theories handle edge cases like octopuses and bees, leading to circular debates. Their goal is pragmatic: create criteria for legislators deciding on insect welfare protections.  

  First, let’s unpack their listed requirements. Each is tied to a concrete biological edge case:  
  - **Rebuilt systems (caterpillar/butterfly, sea squirt)** challenges identity and continuity.  
  - **Decentralized cognition (cephalopod arms)** questions the "subject" location.  
  - **Neuron count irrelevance** demands more than crude correlation (bee vs. mouse).  
  - **Split-brain cases** force confronting potential multiplicity.  
  - **Convergent evolution** rejects cortex-centric biases (birds vs. mammals).  
  - **Threshold clarity** needs operational boundaries, not vagueness.  
  - **Falsifiability** requires testable predictions.  
  - **Individual focus** avoids species-level generalizations.  

  Now, the user’s hidden request: identify tensions between these criteria. They want to expose where theories *must* compromise—no theory can satisfy all. Three major conflicts stand out:  

  1. **Threshold precision vs. Uncertainty tolerance**: Legislators need clear guidance (e.g., "protect bees if integration > X"), but biology results in borderline cases (e.g., pupae). A theory precise enough for policy will inevitably misclassify some edge cases.  

  2. **Subject unity vs. Distributed systems**: Cephalopods and split brains defy the "single subject" assumption. Theories insisting on unity (like IIT) struggle here, while those accommodating multiplicity (e.g., GWT variants) may become too vague for legislation.  

  3. **Convergence acceptance vs. Structural specificity**: If a theory demands a specific structure (e.g., mammalian cortex), it excludes convergent cases (octopuses). But if it’s too abstract (e.g., "recurrent processing"), it loses predictive power for legislation.  

  The most exclusionary requirement? **Threshold clarity**—it trips up almost all theories. IIT hides behind Φ’s unmeasurability, PP avoids defining "sufficient prediction error," and GWT waffles on "global" scope. Only HOT openly admits its threshold is arbitrary.  

  Lastly, biased criteria masquerading as neutral:  
  - **"Can’t turn on neuron count"** is a dig at IIT’s Φ proxy, but it’s valid—it forces theories to justify *why* structure matters.  
  - **"Fail detectably"** targets unfalsifiable theories (e.g., PP’s adaptability), but it’s fair for policy needs.  

  The user’s real aim is to show students that theory-building involves *trade-offs*, not just answers. The handout should frame these conflicts as the core lesson—why animal consciousness resists neat solutions.
answer: |-
  Here are the desiderata for your handout, structured as requested — with the core conflicts highlighted upfront since they're the intellectual payload. The most significant tension is between **threshold precision** and **biological uncertainty tolerance**, which forces theories into a trilemma: be precise but arbitrary, admit ignorance (politically unhelpful), or redefine consciousness to evade the question.

  ### Desiderata for a Theory of Animal Consciousness Distribution  
  *(Purpose: Legislative guidance for welfare protections, e.g., farmed insects)*  

  1. **Continuity Through Metamorphosis & Dismantling**  
     *Case: Caterpillar-to-butterfly neural reorganization; sea squirt larval brain reabsorption.*  
     Requirement: The theory must address whether consciousness persists, vanishes, or transfers when neural architecture is radically rebuilt or degraded. It cannot dodge the question by claiming it’s "mere implementation detail" — welfare hinges on continuity of subjective experience.  

  2. **Subject Location in Distributed Systems**  
     *Case: Octopus arms (60% of neurons) operating semi-autonomously; severed arms exhibiting complex behaviors.*  
     Requirement: Must specify *where* consciousness resides (brain? whole nervous system? decentralized units?) and whether partial systems can host fragments of experience. A theory that only works for centralized brains fails here.  

  3. **Non-Reduction to Neuron Count**  
     *Case: Honeybee (960k neurons) exhibiting learning, navigation, and social behaviors vs. mouse (71M+ neurons).*  
     Requirement: Cannot use raw neuron numbers as a proxy. Must explain why specific *organizational features* matter more than scale, given that cognition doesn’t scale linearly with cell count.  

  4. **Handling Split Subjects & Multiplicity**  
     *Case: Human split-brain patients showing independent responses; theoretical potential in modular animals.*  
     Requirement: Must accommodate scenarios where one body may harbor multiple conscious centers or fragmented subjectivity. A theory insisting on "one subject per organism" fails empirically.  

  5. **Convergence-Compatibility**  
     *Case: Bird pallium vs. mammalian cortex; octopus vertical lobe vs. vertebrate brains.*  
     Requirement: Cannot privilege specific anatomical structures (e.g., "cortex required"). Must allow that evolution can build consciousness via different pathways.  

  6. **Threshold Transparency**  
     *Case: Does a fruit fly (250k neurons) cross the "recurrent processing" threshold? Where’s the line for bees?*  
     Requirement: If consciousness requires a threshold (e.g., integration complexity, feedback latency), the theory must specify *operational criteria* to locate that threshold in real species — no hand-waving.  

  7. **Falsifiability Under Constraint**  
     *Case: Theories claiming consciousness only with "human-like" reportability (unfalsifiable in animals).*  
     Requirement: Must generate testable predictions (even if indirect). If unfalsifiable (e.g., "consciousness exists where information is integrated"), admit this limits its legislative utility.  

  8. **Individual-Level Verdicts**  
     *Case: Is *this* injured octopus conscious? Does *this* bee feel stress?*  
     Requirement: Must deliver judgments about individual organisms, not species or clades. Welfare protects individuals, not averages.  

  ---

  ### Core Conflicts & Critical Analysis  
  **The Central Tension: Precision vs. Biological Reality**  
  - **Threshold Transparency (6) + Continuity (1) = Unsatisfiable for Non-Arbitrary Theories**  
    Any theory precise enough to set a clear threshold (e.g., "IIT Φ > X") *must* arbitrarily categorize metamorphosing animals (e.g., pupae as non-conscious, adults as conscious) or decentralized systems (octopus arms as "non-subjects"). Yet legislative action requires binary decisions. *Result: You cannot have both biological nuance and policy clarity without smuggling in arbitrariness.*  

  - **Convergence-Compatibility (5) + Threshold Transparency (6) Excludes Popular Theories**  
    Higher-Order Theories (HOT) fail (5) by requiring cortical structures for meta-cognition. Global Workspace (GWT) struggles with (6) — its "global broadcast" threshold is undefined for small brains. Predictive Processing (PP) dodges (6) entirely by making consciousness scale-free ("prediction error minimization everywhere").  

  **Most Exclusionary Requirement**  
  **Threshold Transparency (6)** is the wrecking ball:  
  - IIT hides behind Φ’s impractical measurability.  
  - GWT/PP avoid defining "sufficient" global availability or prediction depth.  
  - HOT implicitly thresholds "higher-order" capacity but won’t specify for which animals.  
  *This requirement alone exposes why theories "flounder on the bee."*  

  **Dressed-Up Prejudices**  
  - **"Can’t turn on neuron count" (3)** is a veiled strike at IIT’s Φ ∝ complexity axiom, but it’s valid: IIT uses neuron-like units in models, implying scale matters despite denying it.  
  - **"Fail detectably" (7)** targets behaviorist-leaning theories (e.g., PP) that absorb counterevidence as "prediction errors," but it’s fair — legislators need accountability.  

  **The Legislator’s Nightmare: Distributed Systems (2)**  
  The octopus case alone collapses theories requiring a unified subject:  
  - IIT’s "maximally integrated system" might isolate each octopus arm as conscious.  
  - GWT’s "central workspace" struggles if arms process information locally.  
  - HOT’s "self-representation" becomes incoherent.  
  *This requirement forces the hardest concession: welfare laws might need to protect "potential subjects" (arms, brains?) in absence of a unified self.*  

  ---

  ### Why This Order Works  
  By front-loading these cases, you preempt theory-first myopia. Students will see *why* IIT falters on metamorphosis (violates 1,8), why GWT glosses over thresholds (violates 6), and why HOT excludes birds (violates 5). The conflicts aren’t flaws in your list — they’re the point. Consciousness isn’t a checklist; it’s a set of trade-offs. Legislators (and theorists) must choose which biological realities to prioritize and which to ignore. Your handout’s value is in making those choices visible.
