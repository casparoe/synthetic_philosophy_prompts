prompt: |-
  I recently signed a substantial giving pledge and moved into a job where I spend my days allocating a fixed budget, and the old objection that consequentialism is too demanding has stopped being a seminar question for me. In the reading I have done since, the dispute looks stalled: one side argues that the theory asks us to keep giving until the next unit of sacrifice costs us as much as it achieves, and that this is simply what morality requires; another insists that a morality which leaves no protected room for a person's own projects and attachments has misdescribed what a moral requirement is; and a third observes that any view taking strangers' interests equally seriously will be demanding, so the objection cannot tell against consequentialism in particular. My hypothesis, which I would like you to test rather than assume, is that the parties are not really disagreeing about how much morality asks but about which world to evaluate the theory in — one measuring its demands where everyone complies, the other where almost no one does — so that "demanding" is being applied against two different baselines. I would also like you to consider a second reading: that the split is between an occurrent and a structural notion of demandingness, how much a theory asks of you on a given occasion versus what it requires you to hold revocable at any moment. Diagnose what kind of disagreement this actually is, drawing on what each side says about the cases, and tell me what would count as progress given that diagnosis — a distinction, a change of question, or a case for thinking there is nothing here to resolve. Please write it as continuous prose, with no headings, bullet points, bold text, or tables.
