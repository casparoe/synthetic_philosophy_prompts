  First, I need to unpack their core concern: they're wrestling with whether consequentialism's demands are excessive when applied to real-life decisions. Their personal context matters here - this isn't abstract for them. The three standard positions are: 1) consequentialism correctly requires extreme sacrifice, 2) morality must allow personal space, and 3) all impartial moral theories face this issue.

  Their first hypothesis suggests the debate might hinge on different baseline assumptions - whether we imagine full or partial compliance. I recall Parfit's work on this distinction being crucial. Their second hypothesis points to temporal dimensions of demandingness - immediate sacrifice versus constant availability to redirect resources.

  To test these, I should examine how each position would handle cases like: giving all spare income versus reserving some for family vacations. The full/partial compliance lens seems promising - critics often assume current non-compliance when judging demands as excessive, while defenders imagine full compliance where personal projects aren't undermined.

  The occurrent/structural distinction also illuminates why critics feel consequentialism invades life's fabric - it's not just big sacrifices but the constant background pressure. This explains why "demanding" means different things to each side.

  Progress might come from: 1) clarifying which baseline is being used, 2) acknowledging both types of demandingness exist, or 3) concluding the dispute masks a deeper choice about moral priorities. Given their practical orientation, emphasizing the baseline distinction seems most helpful - it shows why both sides feel correct while operating in different frames.

  The structural demand point remains crucial too though - it captures why consequentialism feels existentially taxing beyond discrete acts. Perhaps combining these insights offers the clearest path forward: the debate persists partly because critics focus on current non-compliance and structural burdens, while defenders address full compliance and occurrent costs.
answer: |-
  Your diagnosis perceptively identifies two axes that illuminate the seeming stalemate in the demandingness objection to consequentialism. The parties aren't primarily disagreeing about the *quantum* of sacrifice required in a vacuum, but about the *context* in which that quantum is evaluated and the *temporal scope* of the demand. Your hypotheses capture distinct yet intertwined dimensions of the dispute.

  Consider the first hypothesis: the baseline of compliance. The defender of consequentialism often reasons within a hypothetical world of full or widespread compliance. Here, the "cost" of giving until the marginal cost equals the marginal benefit is significantly lower. Systemic problems are massively alleviated, basic needs are met, and the sacrifice required to address remaining injustices or inefficiencies might leave ample room for significant personal projects and relationships. The demand, while substantial, feels integrated into a functioning moral ecosystem. The critic, however, evaluates the demand against the stark reality of *actual* widespread non-compliance. In this world, the needs are monumental and unaddressed. Giving until the marginal utility matches the immense, unmet need of strangers could indeed consume virtually all resources beyond bare subsistence, obliterating the possibility of meaningful personal pursuits. Saying the theory "requires" this feels like demanding martyrdom in a world where others are largely indifferent. "Demanding" here is relative: it feels crushing against the baseline of what others do and what seems psychologically sustainable in an unjust world, whereas in the compliance baseline, it feels like a strenuous but feasible collective duty. The consequentialist's "simply what morality requires" assumes the collective action problem is solved; the critic hears it as an impossible individual burden within collective failure.

  Your second hypothesis, the occurrent versus structural demandingness, cuts across this. The "occurrent" demand focuses on a single decision: *this* donation, *this* career choice. Consequentialism might ask for a large, painful sacrifice *now* – selling a prized possession, working exhausting hours for an effective charity. The "structural" demand focuses on the ongoing state of readiness and revocability it imposes. It’s not just about *this* sacrifice, but the fact that *all* personal resources and projects are perpetually "on call." That vacation fund, the college savings for your child, your cherished hobby – none are truly yours in a final sense. Their justification hinges on the contingent fact that redirecting them *right now* wouldn't pass the marginal utility test. This creates a pervasive background anxiety and undermines the sense of secure ownership and commitment essential to many deep personal attachments and long-term projects. The critic argues that a moral theory demanding such constant revocability misdescribes the nature of personal commitments, which require a degree of stability and priority immune to constant global utility calculations. The consequentialist counters that this structural openness *is* the essence of taking impartial morality seriously – anything less privileges the self arbitrarily. The third party is partially right: any impartial theory will be demanding in both senses. However, consequentialism's maximizing principle and direct linkage of *any* resource use to potential lifesaving elsewhere arguably intensifies the *structural* demand beyond, say, a theory emphasizing negative duties or thresholds of sufficiency.

  The core disagreement, therefore, is multifaceted. It concerns:
  1.  **The Relevant World for Evaluation:** Is the theory assessed in an idealized compliance scenario or the non-compliant status quo? This dramatically changes the perceived feasibility and burden.
  2.  **The Scope of "Demanding":** Is the key metric the magnitude of specific, discrete sacrifices (occurrent), or the existential condition of having one's entire life-plan perpetually subject to potential revocation (structural)? Critics emphasize the latter as existentially corrosive.
  3.  **The Nature of Moral Requirements:** Does morality fundamentally require optimizing good impartially (implying high occurrent and structural demands in a non-compliant world), or does it inherently incorporate agent-centered permissions or constraints that protect significant space for the pursuit of personal goods, even when suboptimal impartially?

  **Progress,** given this diagnosis, would likely involve several shifts:
  *   **Explicitly Framing Baselines:** Discussions should rigorously specify whether arguments about demandingness assume full compliance, partial compliance, or the status quo. Recognizing this as a source of differing intuitions clarifies why the same principle feels reasonable to one side and crushing to the other.
  *   **Distinguishing Demand Types:** Acknowledging the distinct challenges of occurrent sacrifices (can I bear *this* cost?) versus structural demandingness (can I live with *everything* always being potentially revocable?) would prevent talking past each other. Arguments addressing one might not apply to the other.
  *   **Shifting the Question from "How Much?" to "What Kind?":** Instead of debating a single level of required sacrifice, progress might lie in exploring whether a plausible morality *must* include structural protections for personal projects and commitments as a constitutive element, or whether such protections are merely pragmatic concessions to human weakness within an ultimately maximizing framework. This moves the debate deeper into meta-ethics and the philosophy of agency.
  *   **Conceding Impartiality's Cost:** Recognizing that the third party is correct – significant demandingness is inherent to *any* genuinely impartial morality – might refocus the debate. The dispute then becomes not *whether* consequentialism is demanding, but whether its *particular form* of maximizing, structure-denying demand is uniquely problematic or simply the clearest manifestation of impartiality's implications.

  Ultimately, while distinctions and clarified questions are vital, a complete resolution may be elusive. The tension reflects a fundamental fault line in moral philosophy: the weight of the impersonal standpoint versus the perspective of the situated agent. Progress might not be consensus, but a clearer understanding that the disagreement rests on these deeper, potentially irreconcilable, commitments about the foundations of value and agency, illuminated by your insights into baselines and demand structures.
