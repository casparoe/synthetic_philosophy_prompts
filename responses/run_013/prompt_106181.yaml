  I'm applying for a one-year disseration fellowship in formal epistemology and need a two-page proposal, and I have a half-formed idea I'd like you to turn into something with a spine. The background, briefly: we spent a week on Jeffrey conditionalization in a course last term, and the thing that nags me is that the rule is almost always introduced with examples where the uncertain evidence is about the world -- a dim light, a coin you didn't see flipped, a test with a known false-positive rate -- but the formalism itself doesn't seem to care where the uncertainty comes from. I suspect it does care, or at least that it should, and that the rigidity condition, where the conditional probabilities on each cell of the evidence partition stay fixed, is doing more work than people admit. My rough thought is to seperate two kinds of uncertain evidence: evidence that bears on some worldly hypothesis, and evidence that bears on your own first-order credences or on the reliability of the process that produced them. I've been calling the second kind self-directed uncertain evidence, though the label might be bad. The question I want the proposal to nail down is whether Jeffrey conditionalization, with rigidity as usually stated, can handle self-directed uncertain evidence at all, or whether it only looks like it can because the examples are always secretly world-directed. If it can, I want to know what extra constraints are needed; if it can't, I want a clean counterexample or a no-go result, not just a vague worry. I know there are already known headaches about commutativity and path dependence when you update on a sequence of uncertain evidence, and I'm curious whether my distinction makes those better, worse, or just relabels them.

  The case that got me thinking is a doctor who gets a second opinion from a colleague she knows is reliable about eighty percent of the time, but she also knows she's more likely to seek a second opinion when she's already doubtful, so the fact that she sought one is itself evidence about her own reliability. That feels like uncertain evidence about her own epistemic state, not just about the patient. I don't want the proposal to try to solve higher-order evidence in general -- that's too big -- I want a narrow formal question with a determinate answer. Write the proposal: a precise statement of the question, why the existing positions leave it open, the method and why that method rather than the obvious alternatives, a month-by-month plan for the year, what a result would look like, and what would count as the project failing. Be realistic about scope; I'd rather have a narrow proposal that says something definite than a grand one that says nothing. Don't bother with citations or a literature review by citation, I'll add those myself, but you can refer to positions and arguments if the proposal needs them.
