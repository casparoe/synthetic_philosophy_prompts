  Here is a five-minute dedication speech that honors the complexity, acknowledges the debate respectfully, centers the victims, and meets your specific requirements:

  **(Stand solemnly. Pause. Look at the plaque, then the audience.)**

  Thank you, Mayor, Rabbi, members of the Historical Society, my family, and everyone gathered here today. We stand on ground steeped in memory. My great-aunt left us the family papers, and with them, a responsibility. That responsibility brings us here, to finally mark what happened in this place in 1942. To remember our people.

  The journey to this plaque... hasn't been simple. Words matter deeply, especially words that try to hold the weight of unbearable loss. There’s been discussion – passionate, necessary discussion – about the *right* word to describe the crime committed here. Some argue for "massacre," finding "genocide" too specific, perhaps too vast, for the horrors that unfolded over those two terrible days. Others feel deeply that only "genocide" speaks the full, devastating truth.

  **(Acknowledge the Historical Society's point gently but firmly)**

  The Historical Society raises an important distinction. The word "genocide," as defined later by international courts and treaties for legal purposes, focuses intensely on specific physical acts and the *intent* to destroy a group, often requiring documented proof of a vast, systematic plan. It’s a definition forged in compromise, shaped by nations navigating a painful past and protecting their own futures. Cultural destruction, the erasure of a way of life... these were considered, but ultimately set aside in that legal framework. So, the concern about applying that precise, courtroom definition here? It’s not an unreasonable question.

  **(Shift to the core argument: Truth beyond legal definition)**

  But. The crime did not wait for the word. It did not wait for the 1948 Convention. Raphael Lemkin, the man who *coined* the word "genocide" – a hybrid word, he knew it, Greek and Latin stitched together for a monstrous new reality – understood it more broadly. For Lemkin, genocide wasn't just killing. It was the deliberate smashing of a people's entire pattern of life – their language, their leadership, their culture, their economic roots. It was the forcible replacement of *their* world with another.

  **(Connect Lemkin's vision to this specific event)**

  Look at what happened *here*. Over two days, the Jewish community of this town – our grandmothers, grandfathers, cousins, children – was rounded up. Murdered. Erased. But the crime wasn't only the bullets. It was the silencing of their voices, the extinguishing of their leadership, the destruction of their homes and livelihoods that had woven the fabric of this town for generations. It was the violent end of *their* pattern of life in this place. By Lemkin’s original, profound understanding – the understanding born from witnessing horrors like *this* – what happened here *was* genocide. It was an attempt to destroy, *in part*, this specific Jewish people, right here. Their universe ended.

  **(Address the purpose of remembrance vs. legal judgment)**

  The plaque before us isn't a courtroom. It isn't entering evidence for an international tribunal bound by a specific, negotiated treaty definition. It is an act of remembrance by a *community*. It is this town finally saying: *We see what was done here. We name it.*

  We name the profound violence. We name the intent to obliterate a vibrant part of this town’s heart. We name the destruction of a people’s entire way of life, right here on this soil. We name it as the world now understands such profound evil: **genocide**. To do less would feel, to many of us carrying this memory, like turning away from the full truth yet again.

  **(Conclude with focus on the victims and the act of remembrance)**

  So today, we dedicate this plaque. We dedicate it not to settle a historical debate perfectly for all time, but to fulfill a sacred duty. We dedicate it to the memory of those lost. We dedicate it to the truth that their lives, their community, their *pattern* mattered, and its violent end matters. We dedicate it to speaking the hard truth so that remembrance is complete, and so that vigilance against such darkness remains awake in this town, and in all our hearts.

  May their memories be a blessing, and may this marker stand as a testament and a warning. Thank you.

  **Key elements addressed:**
  *   **Acknowledges the Fight:** Explicitly mentions the debate over "massacre" vs. "genocide" and validates the Historical Society's point about the legal definition and its limitations/narrowing.
  *   **Lemkin's Definition:** Explains his broader concept (language, leadership, culture, economy, replacing a "pattern of life") without jargon.
  *   **1948 Convention Critique:** Notes it was "forged in compromise," "shaped by nations... protecting their own futures," and that it "set aside" cultural destruction and narrowed the focus (implied the "uncomfortable part").
  *   **Core Argument:** Distinguishes legal definition from moral/communal remembrance. States the crime predated the word and fits Lemkin's original, profound concept. Links the specific events here (round-up, murder, erasure of community life) directly to that concept: "Their universe ended." "It was an attempt to destroy, *in part*..."
  *   **Purpose of Plaque:** Clearly states it's not for legal judgment but for communal remembrance and speaking truth. "It is this town finally saying: *We see what was done here. We name it.*"
  *   **Word Origin:** Mentions "genocide" as a "hybrid word... Greek and Latin stitched together."
  *   **Accessibility:** Uses plain language ("pattern of life," "universe ended," "vibrant part of this town’s heart," "sacred duty"). Avoids citations, treaties, or lecturing. Focuses on the human impact and the act of remembrance.
  *   **Emotional Resonance:** Grounded in place ("this ground," "this soil"), family ("our grandmothers"), loss, and the solemnity of the moment. Ends with blessing and warning.
  *   **Five Minutes:** Concise phrasing and focused points keep it within time.
