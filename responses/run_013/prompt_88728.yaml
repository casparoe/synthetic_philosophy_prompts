  ### 90-Minute In-Class Activity: The Preference Chain Challenge  
  **Objective:** Make students feel the pragmatic sting of intransitive preferences via the spectrum argument, without naming it until debrief. Students build a chain of pairwise choices leading from "good" to "bad," then face exploitation.  

  ---

  ### **Materials**  
  - **15 "Experience Cards"**: Index cards describing a "study environment" with two attributes:  
    - **Quietness (Q)**: Scale of 1–15 (1 = deafening, 15 = silent).  
    - **Convenience (C)**: Scale of 1–15 (1 = isolated, 15 = central).  
    - **Chain Structure**:  
      - **Start (Card 1)**: "Library Annex: Q=15, C=1" (Very quiet, very inconvenient → "good").  
      - **End (Card 15)**: "Downtown Cafe: Q=1, C=15" (Very loud, very convenient → "bad").  
      - **Intermediate Cards (2–14)**: Each card slightly increases convenience (C+1) and slightly decreases quietness (Q-1).  
        - *Example*: Card 2: "Library Corner: Q=14, C=2"; Card 8: "Campus Cafe: Q=8, C=8"; Card 14: "Busy Coffee Shop: Q=2, C=14".  
  - **Broker Props**: A clipboard, a "Trade Ledger" (paper to record swaps), and a bell (to announce trades).  
  - **Witness Sheets**: Paper for observers to note choices and reactions.  
  - **Timer**: For strict phase management.  

  ---

  ### **Timeline** (Total: 90 Minutes)  
  #### **Phase 1: Setup & Silent Choice Run (30 Minutes)**  
  - **0–5 min**: Arrange chairs in a circle. Distribute one card to each student (randomly ordered). Give each a slip: *"You value quietness for focus and convenience for access. When trading, choose what feels better overall."* No further explanation.  
  - **6–25 min**: **Pairwise Trade Sequence**  
    - Students stand and rotate clockwise every 2 minutes (use timer).  
    - At each rotation, students face a new partner and decide: *"Trade your card for your partner’s? You must both agree."*  
    - **Key Rule**: Pairs can only trade if their cards are adjacent in the spectrum (e.g., Card 7 can only trade with Card 6 or 8). Students discover adjacency by comparing numbers (no full spectrum revealed).  
    - **Outcome**: Students consistently trade "up" in convenience (since each Q-1 feels negligible, but C+1 feels beneficial). Most end with high-convenience cards (e.g., Card 15).  
  - **26–30 min**: **Reveal the Spectrum**  
    - Broker (instructor) posts the full chain on the board: Card 1 (Q=15, C=1) → Card 15 (Q=1, C=15).  
    - Ask: *"Who started near Card 1? Who ended near Card 15? Which end seems better?"* Class consensus: Card 1 > Card 15.  

  #### **Phase 2: Exploitation (20 Minutes)**  
  - **31–35 min**: **Broker’s Gambit**  
    - Broker (role-played by instructor) approaches a student holding Card 15:  
      *"I see you have a noisy cafe card. I’ll trade you a library card (Card 1) for it... but you must ‘pay’ by standing during the next trade."* (Payment = mild discomfort, no real money.)  
      - Student agrees (Card 1 seems better). They trade and stand.  
  - **36–45 min**: **Cycle of Doom**  
    - Broker now exploits intransitivity:  
      1. Trades Card 1 to another student for Card 2 (claiming: "Card 2 is just as quiet but more convenient!").  
      2. Then trades Card 2 for Card 3, then Card 3 for Card 4, etc., around the circle.  
      3. At each trade, the standing student must also "pay" by moving to a less comfortable spot.  
      4. After trading Card 14 for Card 15, Broker offers Card 15 back to the first student: *"Trade me for Card 1? But now you must stand again."*  
    - **Result**: The first student holds Card 15 (bad) and has "paid" twice (standing/moving), worse off than their initial state.  
  - **Witness Role**: Non-trading students note reactions on sheets: *"What choices felt rational? When did regret start?"*  

  #### **Phase 3: Debrief (40 Minutes)**  
  - **46–60 min**: **Map the Phenomenon**  
    - Name the argument: *"You experienced a ‘spectrum argument’ against transitivity."*  
    - Recap:  
      - **Chain Premise**: Each trade (Card i → Card i+1) seemed non-worsening (Q-1 negligible, C+1 beneficial).  
      - **Transitivity Assumption**: If A > B and B > C, then A > C.  
      - **Contradiction**: Card 1 > Card 15, but the chain implies Card 1 = Card 15.  
    - **Pragmatic Sting**: Broker’s cycle exploited intransitive preferences, leaving students worse off.  
  - **61–75 min**: **Escape Routes (Menu of Options)**  
    Present defenses as equally live choices:  
    1. **Deny Transitivity**: "Better than" isn’t always transitive.  
    2. **Reject a Step**: Identify which adjacent trade was irrational (e.g., Card 8 → Card 9 crosses a threshold).  
    3. **Accept the Endpoint**: Card 15 isn’t worse (e.g., convenience outweighs quietness).  
    4. **Incomparability/Indeterminacy**: Some cards are on a par, vague, or incomparable.  
  - **76–86 min**: **Separate Value vs. Preference**  
    - **Blurred in Activity**: The game tested *preferences* (choices amid framing effects like adjacency rules).  
    - **Test Value Itself**: Ask: *"If you judged cards in isolation, without trading, would your value ranking be intransitive?"* To test this, rerun choices without adjacency rules or trading pressure.  
  - **87–90 min**: **Conclusion**  
    - Stress: Intransitive preferences invite exploitation.  
    - Distribute a 1-pager summarizing the argument and defenses.  

  ---

  ### **Predictable Problems & Limitations**  
  1. **What Will Go Wrong**:  
     - **Refusal to Trade**: Students may reject "bad" trades early if they detect the pattern. *Mitigation*: Emphasize adjacency rules to constrain choices and use peer pressure ("Everyone else is trading!").  
     - **Endpoint Disagreement**: Some may insist Card 15 isn’t "bad." *Mitigation*: Poll the class to establish consensus at the start.  
     - **Broker Fatigue**: If the broker role is underplayed, exploitation feels flat. *Mitigation*: Ham it up—use a prop bell for trades, feign greed.  
     - **Time Crunch**: Strictly enforce rotation timers; skip Phase 2 if behind.  

  2. **What the Activity Cannot Reproduce** (Requires Speech in Debrief):  
     - **Negligibility of Adjacent Steps**: The activity uses explicit Q/C trade-offs, but the spectrum argument relies on steps feeling *indiscernibly* better (e.g., a 0.001% change). Students might see the Q-1/C+1 trade as noticeable. *Supply in Speech*: "Real spectrum arguments (e.g., pain duration vs. intensity) use steps so small they seem non-worsening, not just balanced. Here, the trade-offs were simplified for time."  

  ---  
  **Why This Works**: Students *build* the chain via constrained choices, feel the cycle’s exploitation, and confront defenses neutrally. The debrief separates preference from value and highlights real-world stakes (e.g., exploitative marketing). Run it tight, and the "sting" will linger.
