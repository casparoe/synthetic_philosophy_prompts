  ### Empty Leaves & Notes  
  - **Node 3→No → Node 4→No → Node 5→No → ?**: Unexplored. *Why?* Denying all standard structures (indifference, causality, duplication) lacks a coherent alternative.  
  - **Halfer vs. Double-Halfer**: Not separated here. Both hold waking credence is 1/2, but Double-Halfer updates to 2/3 if told "today is Monday." *Branch omitted to avoid clutter; the distinction rarely affects the core dispute.*  
  - **Quantum variant**: Resolves ambiguity about "sameness" of awakenings. Rejects Halfer if copying is relevant (Node 5→Yes).  
  - **Absent-minded driver**: Forces Thirder if isomorphic (Node 2→Yes), but some deny the link (Node 2→No).  

