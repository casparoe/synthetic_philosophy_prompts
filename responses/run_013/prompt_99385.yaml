  ### Sleeping Beauty Credence Decision Tree  
  *A one-page guide to pinpoint disagreements.*

  **Start: Is there a determinate fact about Beauty's credence?**  
  - **No (case underdescribed)**:  
    - Ambiguity in reference class (e.g., "awakenings" vs. "subjective experiences") or evidence (e.g., what "waking" entails).  
    - ➔ **Leaf: No fact of the matter / convention-dependent** (e.g., Elga’s "no privileged class").  
  - **Yes**: Proceed to Node 1.  

  **Node 1: Does Beauty gain new evidence upon waking?**  
  *(i.e., beyond what she knew before the experiment)*  
  - **No**: Waking provides no information about the coin; credence remains 1/2. Proceed to Node 2.  
  - **Yes**: Waking is evidence for Tails (more awakenings under Tails). Proceed to Node 3.  

  **Node 2: Is Beauty's situation analogous to the absent-minded driver?**  
  *(Driver forgets prior passes; must choose actions at identical intersections)*  
  - **Yes**: Optimal decisions require treating each awakening as equally likely.  
    - ➔ **Leaf: Thirder (1/3)** (e.g., Aumann: decision-theoretic isomorphism).  
  - **No**: Problems are distinct (credence ≠ decision). Credence stays 1/2.  
    - ➔ **Leaf: Halfer (1/2)** (e.g., Lewis: "no new evidence").  

  **Node 3: Should Beauty assign equal credence to each possible awakening state?**  
  *(States: Heads-Mon, Tails-Mon, Tails-Tue)*  
  - **Yes**: Three indistinguishable states → each 1/3.  
    - ➔ **Leaf: Thirder (1/3)** (e.g., Elga: indifference over awakenings).  
  - **No**: States are not equiprobable. Proceed to Node 4.  

  **Node 4: Is Beauty's credence governed by the coin's causal structure?**  
  *(e.g., coin → days, not awakening-count)*  
  - **Yes**: Prior probabilities: P(Heads) = 1/2, P(Tails) = 1/2. Within Tails, P(Mon) = P(Tue) = 1/2.  
    - ➔ **Leaf: Double-Halfer (1/2)** (e.g., Bostrom: "temporal centering").  
  - **No**: Proceed to Node 5.  

  **Node 5: In the quantum variant (Tails creates two copies), is credence 1/3?**  
  *(Copies are ontologically distinct observers)*  
  - **Yes**: Copying makes awakenings non-identical; credence must be 1/3.  
    - ➔ **Leaf: Thirder (1/3)** (e.g., multiverse self-locating uncertainty).  
  - **No**: Copies change nothing; proceed to Node 6.  

  **Node 6: Must credence match betting behavior?**  
  *(Bet offered each awakening: $1 if Heads, cost $X)*  
  - **Yes**: Fair $X = 1/3 (Heads pays once, Tails costs twice).  
    - ➔ **Leaf: Hybrid (credence 1/2, bets as 1/3)** (e.g., Briggs: "credence/betting decoupling").  
  - **No**: Betting irrelevant to epistemic credence.  
    - ➔ **Leaf: Double-Halfer (1/2)** (e.g., Meacham: "pragmatic vs. epistemic").  

