  I notice they're emotionally invested too ("a stubby little bowl I'm honestly in love with"). This isn't just about logic; it's about reconciling craftsmanship with objectivity. The procedure must validate when to kill darlings, especially for their junior who lacks confidence. 

  Breaking it down: The solution needs three layers—legibility (is it an 'a'?), stylistic consistency (is it *our* 'a'?), and authority (who decides?). For legibility, I'll suggest extreme distortion/stress tests. For style, quantifiable comparisons to reference glyphs. The authority map must clarify when the consultant/client/designer trump creative choices. 

  The three test glyphs should showcase pain points: maybe their beloved stubby 'a' failing accessibility, a minimalist 'g' losing its ear, and an 'l' misreadable in French. Crucially, one must recommend cutting a favored design to brace them for consultant feedback. 

  Limitations to flag: subjective style boundaries, cross-script conflicts, and when client preferences override best practices. No jargon—just actionable steps with time estimates. And absolutely no reading lists; they've made that clear. 

  ...Better compress this into a tight 100-word summary first. Then unpack the steps with fail/pass actions. The glyph walkthroughs will prove it works in their real project. Finally, explicit "who decides" tables to prevent responsibility fog. If I nail this, it might save their 11pm despair sessions.
answer: |-
  ## The Glyph Legitimacy & Consistency Procedure

  ### The procedure in one breath (102 words)
  Test each glyph in three stages:  
  1.  **Legibility:** Is it unambiguously its letter? Test with extreme distortion (blur, pixelate, invert), high-speed glance (5-second exposure), and language traps (does it look like a neighbor letter? Could it be misread in target languages?). Fail = redesign core structure.  
  2.  **Style Fit:** Does it belong to *this* family? Overlay key reference glyphs (like 'n', 'o') and measure critical features (x-height, stem weight, contrast axis, terminal angle, aperture). Check rhythm in context (spacing pairs). Fail = tweak details towards the family's DNA.  
  3.  **Authority Check:** Flag known constraints (Accessibility Veto, Brand Rules, Project Lead Call). If flagged, escalate immediately. If unsure after Stage 2, escalate. Time per glyph: 5-20 mins.

  ---

  ### The Steps, In Order

  **Goal:** Objectively determine if a glyph is (1) Legibly its letter, (2) Stylistically consistent with the typeface, and (3) Clears known constraints.

  **Preparation:** Always have your project's core reference glyphs handy (typically 'n', 'o', 'H', 'O', 'v', 'd' - the DNA carriers). Have the Accessibility Consultant's guidelines and client brand docs accessible.

  1.  **Stage 1: Legibility Core Test (Is it an 'a'? An 'l'?)**
      *   **What she does:**
          *   A. **Distortion Test:** Apply heavy blur (mimic 40m glare), extreme pixelation (mimic low-res display), and invert colors (check countershapes). Can she *still* instantly name the letter?
          *   B. **Glance Test:** Display the glyph *alone* for 5 seconds, then hide it. What letter did she see? Repeat 3x. Must get the correct letter every time.
          *   C. **Neighbor & Language Trap:** Compare directly to similar glyphs (e.g., 'a' vs 'o'/'d'/'e'; 'l' vs 'I'/'1'; 'r' vs 'n'). Could it be confused? Check against likely secondary languages (e.g., if supporting French, does 'l' look like 'I'?).
      *   **Pass:** Glyph is instantly recognizable as the target letter under all distortions, on every glance, and distinct from neighbors/traps.
      *   **Fail:** Unclear identity under distortion, glance test yields wrong letter >0 times, significant confusion risk with neighbor/trap letter.
      *   **On Fail:** Go back to the drawing board. Focus on fundamental structure: counter size/shape, stem presence/termination, key distinguishing features (e.g., bowl closure for 'a', ear for 'g', crossbar for 't'). *Do not proceed to Style Fit.*
      *   **Time:** 3-6 minutes per glyph.

  2.  **Stage 2: Style Fit Test (Is it *this* face's 'a'?)**
      *   **What she does:**
          *   A. **Overlay & Measure:** Overlay the glyph on the project's key reference glyphs (e.g., 'n' for width/stems; 'o' for curves/x-height/counter; 'v' for angle). Measure:
              *   Stem weight at consistent heights (cap height, x-height, baseline).
              *   X-height alignment.
              *   Counter width/height ratio vs references.
              *   Key angles (e.g., stem terminals, diagonal joins).
              *   Aperture size (if applicable, e.g., 'c', 'e').
              *   Terminal shapes/angles (ball, slab, taper?).
          *   B. **Rhythm Check:** Place the glyph in context with common neighbors (e.g., 'na', 'no', 'ng', 'av', 'il', 'rn'). Does the spacing feel even? Do shapes clash or fuse *unintentionally*? Does the overall rhythm match the family feel?
          *   C. **DNA Check:** Visually compare core features to references: Is the contrast axis the same? Do curves have the same "flavor" (tense/loose, circular/squarish/superelliptical)? Do terminals resolve similarly? Does it *feel* like it belongs?
      *   **Pass:** Key measurements (especially stem weight, x-height, counter ratio) match references within tolerance (±5% is usually safe). Rhythm feels consistent with family spacing. Core DNA features are visually aligned. No jarring differences.
      *   **Fail:** Significant measurement drift (>5-10%, depending on feature), rhythm feels off (too tight/loose), core DNA features clash noticeably (e.g., round curves vs square curves, slab vs ball terminals).
      *   **On Fail:** *Tweak details.* Adjust stem weight, curve tension, terminal shape, sidebearings. Nudge towards the references. Re-run Stage 2. If tweaks compromise Stage 1 Legibility, it's a fundamental fail – return to Stage 1 redesign.
      *   **Time:** 5-10 minutes per glyph (faster once familiar with references).

  3.  **Stage 3: Authority Check (Who Decides?)**
      *   **What she does:**
          *   A. **Constraint Flag:** Review the specific Accessibility Consultant guidelines, Client Brand Guidelines, and Project Lead directives. Does this glyph touch a known constraint? (e.g., "All counters must be >X% open", "Terminals must be slab", "Avoid single-story 'a'", "Specific 'g' ear shape required").
          *   B. **Uncertainty Flag:** After Stage 2, is she *still* genuinely unsure if it passes? Does it feel like a "taste" call? Is there internal disagreement?
      *   **Pass:** No known constraints apply, and she feels confident in the Stage 1 & 2 results.
      *   **Fail:** A known constraint applies OR she is genuinely uncertain after Stage 2.
      *   **On Fail:** **ESCALATE IMMEDIATELY.**
          *   For *Constraints:* Document *exactly* how the glyph relates to the specific rule. Send to Project Lead (you) with the rule highlighted. *Do not redesign yet.*
          *   For *Uncertainty:* Document *why* she's unsure (e.g., "Measurements match but curve feels off", "Rhythm seems ok but spacing looks tight next to 'r'"). Send to Project Lead (you) for a call. Include references & context glyphs.
      *   **Time:** 1-3 minutes per glyph.

  ---

  ### Three Glyphs, Run Through

  1.  **Glyph: Single-Story 'a' (Proposed for signage face, currently double-story family)**
      *   **Stage 1 (Legibility):**
          *   Distortion: Survives blur/pixel/invert easily. Clear counter, distinct tail. Pass.
          *   Glance: 3/3 "a". Pass.
          *   Traps: Not confused with 'o'/'d'/'e'. Target languages (English primary) ok. Pass.
      *   **Stage 2 (Style Fit):**
          *   Overlay/Measure: Width similar to 'n', but bowl shape different (rounder). Stem weight matches at baseline but terminal angle differs (softer curve vs chisel reference). Counter ratio slightly larger. DNA: Curves feel slightly looser than tense reference 'o'. Rhythm: Works ok in 'na', 'av'.
          *   **Verdict:** **FAIL (Style Fit).** While legible, measurements show drift (counter size, terminal angle) and DNA misalignment (curve tension). It introduces a stylistic inconsistency into a strictly double-story system. *Action: Tweak towards double-story 'a' structure using reference curves/angles.* **Cut it.** It breaks the core style premise.

  2.  **Glyph: 'g' with Minimal Ear (Signage face, accessibility focus)**
      *   **Stage 1 (Legibility):**
          *   Distortion: Under heavy blur, the minimal ear vanishes. Counter shape blurs towards an 'o' or even '8' at a distance. **FAIL.**
          *   Glance: (Test halted after distortion fail). One glance result was "o?".
          *   Traps: High risk of 'o'/'8' confusion in glare/low-vision scenarios.
      *   **Verdict:** **FAIL (Legibility Core).** Accessibility veto inevitable. The ear is critical for long-distance 'g' ID. *Action: Redesign. Increase ear prominence significantly, ensure it survives distortion test even if slightly stylistically awkward.* **Cut this version immediately.**

  3.  **Glyph: Dotless 'i' (Proposed for tight spacing/clean look in a revival)**
      *   **Stage 1 (Legibility):**
          *   Distortion: Blur/pixel makes the stem top ambiguous. Passes invert. Pass?
          *   Glance: 2/3 "i", 1/3 "l". **FAIL.**
          *   Traps: High confusion with 'l'/'I', especially in English. Unusable in Turkish (where dotted/dotless 'i' are distinct letters).
      *   **Stage 2 (Style Fit):** (Not run due to Stage 1 Fail).
      *   **Verdict:** **FAIL (Legibility Core).** Glance test fails, language trap critical. *Action: Redesign. Add a distinct dot. Size/style can be minimalist, but it must be present and clear under glance/distortion.* **Cut the dotless idea.**

  ---

  ### Where a Person Has to Decide

  | **Decision Point**                      | **Who Decides**                   | **Notes**                                                                 |
  | :-------------------------------------- | :-------------------------------- | :------------------------------------------------------------------------ |
  | **Stage 1 Legibility Pass/Fail**        | Junior (using procedure) / You    | Junior runs tests. Uncertainty escalates to you.                          |
  | **Stage 2 Style Fit Pass/Fail**         | Junior (using procedure) / You    | Junior assesses measurements/DNA. Subjectivity/taste calls escalate.      |
  | **Redesign Direction after Stage 1 Fail** | You (Project Lead)                | Define the core structural fix.                                           |
  | **Tweak Direction after Stage 2 Fail**  | Junior (guided by references) / You | Junior tweaks; if stuck or compromises legibility, escalates.             |
  | **Accessibility Consultant Veto**       | Accessibility Consultant          | Their ruling is final on legibility grounds. Document and comply.         |
  | **Client Brand Rule Adherence**         | Client (via Brand Guidelines)     | Non-negotiable if specified. Your job to interpret & implement.           |
  | **Final Style Judgment (Taste Calls)**  | You (Project Lead)                | When measurements/DNA are borderline or stylistic intent is paramount.    |
  | **Supporting New Language Requirement** | You (Project Lead) / Client       | You identify conflicts; client approves scope/language additions.         |

  ---

  ### What This Can't Do

  1.  **Define "Style" Magically:** It quantifies *aspects* of style (measurements, DNA features) but cannot capture the ineffable "feel." Borderline cases still require your taste/judgment (hence Stage 3 escalation).
  2.  **Override Hard Constraints:** If the Accessibility Consultant vetoes a *legible* glyph on subjective-but-final grounds (e.g., "feels unstable"), or the client demands a brand-mismatch, the procedure flags it but cannot fix it. This is policy.
  3.  **Solve Cross-Script Conflicts Perfectly:** It flags obvious traps (dotless 'i' in Turkish), but won't automatically resolve subtle conflicts in non-Latin scripts you're less familiar with. Expert review is still needed.
  4.  **Fix Bad Spacing Universally:** It identifies *rhythm* problems in test pairs, but fixing complex spacing (kerning) across the whole system is a separate, iterative task.
  5.  **Compensate for Bad Core Design:** If the reference glyphs ("DNA carriers") are flawed or inconsistent, the procedure amplifies those flaws. Garbage in, garbage out.
  6.  **Predict Every Fusion:** It tests critical pairs, but won't catch every possible awkward collision in all combinations, especially with complex scripts or ultra-tight spacing. Real-world testing is still needed. **(This *will* bite on the transit project – test 'rn'/'m', 'cl'/d', 'vv'/'w' aggressively).**
