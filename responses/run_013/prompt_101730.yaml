answer: |-
  1. Consider a configuration space with two identical spheres at positions (x,y) and (y,x) in an absolute space, related by the symmetry group G = {identity, swap}. Is the physical state described by the entire G-orbit (the unordered pair), or do the distinct points within the orbit represent distinct physical situations despite the Hamiltonian's permutation symmetry?

  2. **Anti-Haecceitism / Identity of Indiscernibles:** The physical state is solely the G-orbit. Labeling points (x,y) vs. (y,x) is pure gauge redundancy, akin to choosing a representative in identical particle symmetrization. There is only one physical state; "two spheres" refers to the count within the state, not distinct states.

  3. **Weak Discernibility (Standard Reply):** The points *are* discernible within the orbit using relational properties. Each sphere bears the relation "is at distance D from *the other sphere*" – a relation the other sphere doesn't bear to itself. This breaks the gauge symmetry, making (x,y) and (y,x) represent distinct, physically discernible states (like fixing a coordinate system).

  4. **Haecceitism:** The symmetry group G acts on genuinely distinct microconfigurations. The orbit contains two distinct physical states (x,y) and (y,x), even though they are observationally identical and the Hamiltonian is symmetric. Swapping them is a physically distinct world, analogous to distinct microstates in a macrostate, grounded in primitive identity ("thisness").

  5. **Residue Report:**  
     - **Clean Translation:** Group orbits as physical states, permutation symmetry, and gauge redundancy map perfectly, dissolving the "which is which" question (Item 2).  
     - **Distortion:** "Grounding numerical difference" (Item 4) distorts; physicists treat indistinguishability operationally (via symmetrization/quotienting), not metaphysically. Weak discernibility (Item 3) resembles gauge-fixing but is rejected in fundamental quantum descriptions (e.g., bosonic wavefunctions).  
     - **Inexpressible:** The core metaphysical dispute about primitive identity ("haecceity") or whether the swap *must* have a physical ground vanishes; your framework resolves it by declaring the orbit fundamental, making the question unstatable. This reflects philosophy's substantive but non-operational concern, not your framework's poverty.
