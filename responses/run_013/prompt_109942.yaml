answer: |-
  Fellow Council Members,  

  As we approach our vote on the thirtieth of this month—a deadline as unyielding as any publisher’s contract—I find myself returning not to statutes or electoral incentives, but to Simone Weil’s stark warning against political parties. Her words haunt this decision. She argued that a party, by its very nature, must will its own survival and growth above all else. It must hold positions on everything, demanding allegiance even where knowledge is absent or irrelevant. This obligation, she warned, corrodes the patient attention essential to any honest work—work like ours. For three years, I have sat among you, valuing this guild for its quiet, practical service: the legal-aid lifeline for the exploited, the hardship fund for the desperate, the translation prize that throws light into neglected corners. The question before us is whether registering as a party saves these things, or betrays them.  

  The faction urging registration, led by our colleague whose decade on the legal-aid committee speaks of tangible commitment, presents a compelling case. For eleven years, we have petitioned fruitlessly for the public lending right. Our voice, they argue, is drowned out by parties. The broadcasting seat and cultural commission position offer unprecedented influence. Translators struggling for visibility, midlist authors whose advances vanish before rent is due, writers who rely on our hardship fund—they stand to gain significantly from this access. To deny them this tool, especially when the registry window slams shut next month, may feel like an abandonment cloaked in principle. The poet’s argument is grounded in the lived reality of our members’ precarity. This is its strength, and it cannot be waved away.  

  The opposing faction, however, touches the core of Weil’s terror: **Does becoming a party mean ceasing to be a guild?** Their fear is not mere nostalgia, but a profound anxiety about institutional corruption. A guild exists to serve its members’ specific, professional needs—contract disputes, unexpected hardship, the celebration of craft. A party exists to acquire and wield power. The moment we register, we are compelled by the electoral commission to answer fifteen questions. Three pertain to our craft—copyright, translation, the lending right. The other twelve—on energy prices, border disputes, retirement age—demand positions wholly outside our collective expertise or mandate. This, precisely, is Weil’s "obligation to be insincere." How can we, as a body of writers, claim a credible, unified stance on complex national infrastructure issues? To fabricate such positions *is* the first step in the corrosion she described. It replaces focused attention on our craft with the performance of political omnipotence.  

  But is this corruption inherent in the *form* of registration itself, or only in the *sociology* of a mass party chasing office? Our lawyer proposes a workaround: a separate legal entity for the party, a different name on the ballot, guild funds ring-fenced, and members free to decline involvement. This aims to preserve the guild’s core while creating a political vehicle. **I depart from Weil here, cautiously, because I believe structure matters.** She railed against the inherent dynamic of *any* party machine. However, a small, focused entity—existing solely to leverage the specific benefits registration offers (the funding, the broadcasting seat, the commission place) *for the explicit purpose of advancing our guild’s long-standing cultural and professional agenda*—might resist the totalizing impulse Weil feared. It need not "grow" beyond its narrow remit; its "survival" would be justified only by its effectiveness in securing the lending right or fairer contracts. It could, theoretically, refuse to engage beyond the three cultural questions, using its platform solely for those issues—though the political cost of such silence would be high.  

  The crucial flaw, however, lies not in the legal separation but in the subscription. As Weil knew, the corruption begins in the mind. **The workaround relocates, but does not eliminate, her core objection.** Even within a separate entity, the same people—us, council members, active guild members—would be doing the "subscribing." We would be the ones crafting (or acquiescing to) positions on those twelve extraneous questions. We would be the ones, however reluctantly, wearing the party hat. Can we truly compartmentalize? Will the habit of asserting guild-endorsed positions on energy policy *not* seep back into our council debates? Will the imperative to defend the "party" line, however limited its scope, *not* eventually demand a loyalty that supersedes the patient, questioning attention our work—and our guild’s services—require? The risk is that the *ethos* of the party, however contained legally, infects the *ethos* of the guild.  

  Yet, to do nothing also carries a profound moral weight, which Weil herself would acknowledge. She withdrew from political *parties*, not from political *action* or solidarity. She fought for factory workers. Our hardship fund and legal-aid service *are* the soul of this guild. To abandon a credible path to amplify our voice for those who rely on these services, especially when the path is time-limited and the need is acute, feels like a failure of that solidarity. It *is* easy for me, with foreign editions providing a buffer, to romanticize purity on behalf of colleagues who write in the shadow of eviction or exploitative contracts. Weil offers no alibi for complacency.  

  Therefore, I recommend we **register the new, separate entity before the thirtieth of this month, but under the strictest conceivable constraints:**  
  1.  **The entity’s *sole* mandate** is to secure the public lending right, advocate for authors' rights in copyright/contract law, and promote literature/translation via the broadcasting and commission seats.  
  2.  **Its platform on the twelve non-cultural questions** submitted to the electoral commission must explicitly state: "No position. This entity exists solely to advocate for the specific professional and cultural interests of writers as outlined in our core mandate." We accept the political vulnerability this entails.  
  3.  **Guild funds remain absolutely ring-fenced.** The new entity relies solely on public funding and voluntary, specific donations marked for *it*, not the guild.  
  4.  **No guild member is automatically enrolled.** Participation is opt-in only. Guild membership and services remain entirely separate.  
  5.  **Council oversight is firewalled.** A separate, smaller committee manages the entity. No guild council vote binds the entity beyond its founding mandate.  

  This is a fraught compromise. It does not fully escape Weil’s warning; the act of registering requires answers we have no business giving, and the subscription risk remains. The opposing faction is right to fear contamination. But the potential gain for our most vulnerable members—a real seat at tables that have ignored us for eleven years—is too significant to forgo without attempting this narrow, defensive structure. It accepts the form while desperately trying to neuter the sociology. It uses the mechanism without wholly embracing the machine.  

  We must enter this eyes wide open. If, in two years, this entity demands loyalty on border disputes, pressures the guild’s direction, or diverts our attention from the legal-aid desk or hardship fund, we dissolve it. Immediately. The guild’s survival and purpose are paramount. Registering is a gamble, but it is a gamble for the translators waiting for recognition and the authors who need the lending right to keep writing. Not acting, for them, is the surer loss. Let us register the entity by the thirtieth, bound by chains of our own making, and pray our attention—and our conscience—remains our own.
