  A friend and I have been going back and forth about the demandingness objection to consequentialism, and I want an actual number from you rather than a tour of the literature. Here's the claim I want a credence on: the demandingness objection to act-consequentialism is dialectically inert — you can't state it without smuggling in some baseline of what an agent is entitled to keep for themselves, and consequentialism just denies that baseline, so at best the objection restates the theory's content rather than counting against it. How likely is that?

  Decompose it: how much rides on whether the objection can be restated in a baseline-free way (say, purely as a claim about blameworthiness, or about what's motivationally possible for creatures like us), how much on the dialectical rule that you can't use pre-theoretical intuitions against a theory that revises them, how much on reflective equilibrium letting us keep those intuitions anyway, plus any other term you think belongs — a number and one line of justification for each, then how they combine.

  Then tell me which term your least sure about and what would move it most, and be upfront about how confident you are in the whole thing — single out the piece you'd bet the least on.
