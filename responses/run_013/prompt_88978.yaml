answer: |-
  Here's a decomposed credence assignment and justification for the claim that the demandingness objection is dialectically inert against act-consequentialism, followed by key uncertainties:

  ### Credence Assignment & Justification
  1.  **Baseline-free restatement plausibility (e.g., blame/motivational impossibility): 20%**  
      *Justification:* Framing demands purely in terms of blameworthiness (without a non-consequentialist baseline) fails because act-consequentialism defines blame by its *own* standard (suboptimal action). Motivational impossibility risks collapsing into feasibility (what *can* be demanded), not permissibility (what *should* be demanded), which consequentialism already addresses via ought-implies-can.

  2.  **Dialectical rule strength (pre-theoretic intuitions can't revise theories): 80%**  
      *Justification:* Consequentialism explicitly revises commonsense moral intuitions (e.g., entitlements). Objecting that it "demands too much" presupposes the very intuitions it rejects (e.g., "I deserve my paycheck"). This is question-begging; it doesn't engage the theory on its own terms.

  3.  **Reflective equilibrium counterweight (intuitions as data): 35%**  
      *Justification:* Even revisionary theories must achieve reflective equilibrium. If demandingness intuitions are *deeply persistent* after confrontation with theory and facts, they retain justificatory weight. Consequentialism must either explain them away or soften demands (e.g., scalar consequentialism).

  4.  **Psychological realism as independent objection: 15%**  
      *Justification:* If extreme demands cause widespread burnout/resentment (reducing overall good), this becomes an *internal* critique. However, this targets contingent implementation (optimal demandingness *levels*) not core permissibility, and sophisticated consequentialists readily absorb it.

  ### Combined Credence
  **Overall credence that the objection is dialectically inert: 40%**  
  *Combination method:* Weighted average (terms not fully independent). The strong dialectical rule (80%) dominates, but reflective equilibrium (35%) and baseline-restatability (20%) pull against inertness. Psychological realism (15%) slightly favors inertness by being co-optable.  
  *Formula intuition:* `(0.8 * 0.8 [rule favors inertness]) * (1 - 0.35 [equilibrium disfavors]) * (1 - 0.2 [restatement disfavors]) ≈ 0.41`. Rounded to **40%**.

  ### Least Confident Term
  **Reflective equilibrium counterweight (35%)**  
  - *Why least sure?* Its weight hinges on unresolved meta-ethical debates: How much authority do pre-theoretic intuitions retain against a coherent, principled alternative? Consequentialists can argue persistent intuitions reflect bias/indulgence, not insight.  
  - *What would move it?* Empirical work on whether reflective equilibrium *actually* preserves demandingness intuitions after exposure to consequentialist reasoning. If studies show consistent rejection of extreme demands even after rational endorsement of consequentialism → raise to 50%. If demands become more acceptable upon reflection → lower to 20%.

  ### Piece I'd Bet Least On
  **Psychological realism as a standalone objection (15%)**  
  This is most vulnerable: Consequentialists easily reframe it as optimizing *how* to demand (e.g., encouraging sustainable giving), not *whether* the baseline entitlement exists. Evidence of psychological limits would shift consequentialist prescriptions, not the theory's core structure.

  ### Overall Confidence & Biggest Vulnerability
  - **Final credence: 40%** (I assign 40% probability that the objection is dialectically inert).  
  - **Biggest vulnerability in my view:** The **dialectical rule (80%)** is strongest but contestable. If philosophical methodology widely accepts intuitions as "data" even against revisionary theories (e.g., Rawlsian wide reflective equilibrium), the rule weakens. A meta-ethical argument showing intuitions have *pro tanto* authority could reduce this to 50%, sinking inertness probability to ~25%. Conversely, stronger defenses of revisionism could push it to 90%, raising inertness to ~55%.

  This reflects the objection's resilience in *practice* (it persistently worries people) but its potential circularity in *strict dialectic*. The numbers capture tension between consequentialism's radicalism and the pull of inherited moral concepts.
