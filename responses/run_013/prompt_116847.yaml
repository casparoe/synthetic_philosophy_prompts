answer: |-
  ### Essay Question  
  **Part A (12 marks):**  
  Apply the Two-Baseline Test to the reactor meltdown case below. For each candidate cause—Priya’s inaction, Tom’s disabling of the system, and the automatic system’s failure—explain:  
  (i) Whether the outcome counterfactually depended on it;  
  (ii) Whether it deviated from the agent/entity’s role-specific baseline.  
  Then, use the test to determine whether each candidate is a cause of the meltdown. Repeat this analysis for **Variant 1** (no automatic system exists; Priya is the sole safeguard) and **Variant 2** (the automatic system is an AI trained to defer to human operators).  

  **Part B (8 marks):**  
  Critically evaluate the Two-Baseline Test. Does it reliably deliver metaphysically sound causal verdicts, or does it covertly rely on moral/normative judgments? Use your analyses from Part A to show where the test succeeds, fails, or becomes ambiguous—especially regarding the "baseline" criterion. What does this reveal about separating causal and responsibility-based claims?  

  **Case:**  
  A nuclear reactor’s automatic cooling system is designed to open a release valve when pressure exceeds 300 psi. Operator Priya observes rising pressure (reaching 350 psi) but does nothing, trusting the automatic system. Technician Tom disabled the system during maintenance and forgot to re-enable it. The valve fails to open, causing a meltdown.  
  - *Variant 1:* The reactor has no automatic system. Priya is solely responsible for manual valve release.  
  - *Variant 2:* The automatic system is an AI programmed to activate the valve *unless* a human operator intervenes within 5 minutes of pressure exceeding 300 psi. Priya monitors but does not act.  

  ---

  ### Model Answer (700 words)  
  **Part A: Application of the Two-Baseline Test**  
  The Two-Baseline Test defines an omission as a cause iff (i) the outcome counterfactually depends on it, and (ii) it deviates from a role-specific normative baseline.  

  *Original Case:*  
  - **Priya’s inaction**: (i) The meltdown *counterfactually depends* on Priya’s omission: had she opened the valve manually, the meltdown would not have occurred. (ii) However, her role’s *baseline* is to intervene only if the automatic system fails. Since she reasonably expected automation to work, her inaction aligns with her role’s default. Thus, Priya’s omission is *not a cause*.  
  - **Tom’s disabling**: (i) Counterfactual dependence holds: had Tom re-enabled the system, it would have opened the valve. (ii) Tom’s role requires restoring systems post-maintenance. His failure *deviates* from this baseline. Thus, Tom’s omission *is a cause*.  
  - **Automatic system’s failure**: (i) Counterfactual dependence is present (if functional, it would have opened the valve). (ii) Its baseline is automatic activation when pressure exceeds 300 psi. Failure *deviates* from this design. Thus, it *is a cause*.  

  *Variant 1 (No automatic system):*  
  - **Priya’s inaction**: (i) Counterfactual dependence holds (manual action would have prevented meltdown). (ii) As the sole safeguard, her baseline *requires* intervention. Inaction *deviates* from this obligation. Thus, Priya’s omission *is a cause*.  
  - *Tom and the automatic system are irrelevant here.*  

  *Variant 2 (AI defers to humans):*  
  - **Priya’s inaction**: (i) Counterfactual dependence holds (intervention would have prevented meltdown). (ii) The AI’s programming makes human intervention the baseline. Priya’s inaction *deviates* from her role. Thus, her omission *is a cause*.  
  - **AI’s failure**: (i) No counterfactual dependence: the AI would not have acted *unless* Priya failed to intervene. (ii) Its baseline is to defer; thus, inaction is *not a deviation*. It is *not a cause*.  
  - **Tom’s disabling**: Identical to the original case: both criteria are met (*is a cause*).  

  **Part B: Critical Evaluation**  
  The Two-Baseline Test usefully distinguishes causal relevance from normative context but struggles to provide *purely metaphysical* criteria. Its successes and failures reveal three key issues.  

  First, the test cleanly separates causal and responsibility claims in cases like Tom’s omission. Tom satisfies both criteria objectively: his role’s baseline (technical restoration) is functionally defined, and counterfactual dependence is verifiable without moral inputs. This shows causation and blame can align but are distinct.  

  Second, the baseline criterion becomes normatively contested in Priya’s case. In the original scenario, Priya escapes causal status because her role’s baseline incorporates reliance on automation—a *normative expectation*. In Variant 1, that baseline shifts to direct responsibility, making her omission causal. This shift depends entirely on institutional roles, not physical facts. Worse, in Variant 2, the baseline is ambiguous: is the AI’s programming a "norm" or a mechanical fact? The test answers this normatively, not metaphysically.  

  Third, counterfactual dependence alone is insufficient to ground causation by omission. In all cases, Priya’s inaction satisfied (i), but only role-specific baselines determined whether it "counted" as causal. This exposes the test’s vulnerability: it resolves omission-causation by importing external norms to define "deviation." Consequently, it risks collapsing causation into responsibility. For instance, calling Priya a cause in Variant 2 hinges on the AI’s *programmed deference*—a social artifact, not a physical dependency.  

  Ultimately, the test fails to isolate metaphysics. A better approach would need to explain how omissions causally interact with the physical world *without* invoking norms. One possibility is that omissions are causes only when they break a *physical dependency chain* that an agent’s role sustains (e.g., Tom’s inaction broke a maintenance-restoration chain). Yet even this may covertly reference "sustained functions," which are normative. The reactor cases thus show that while the Two-Baseline Test clarifies practical attributions, it cannot resolve whether causation by omission is fundamentally metaphysical or moral.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **PART A: APPLICATION (12 marks)**  
  1. **Correct CF analysis for all candidates in original case** (3 marks)  
     - *Common error: Claims Priya’s inaction lacks CF dependence.*  
  2. **Correct baseline/deviation analysis for all in original case** (3 marks)  
     - *Common error: Assumes Priya’s baseline requires constant vigilance.*  
  3. **Accurate application to Variant 1 (Priya as sole safeguard)** (3 marks)  
     - *Common error: Fails to see baseline shift makes Priya’s omission causal.*  
  4. **Accurate application to Variant 2 (AI deference)** (3 marks)  
     - *Common error: Misses that AI inaction is baseline-compliant (no deviation).*  

  **PART B: CRITIQUE (8 marks)**  
  5. **Identifies baseline criterion’s normative dependence using variants** (3 marks)  
     - *Common error: Treats baselines as purely descriptive.*  
  6. **Argues test conflates causation/responsibility OR shows ambiguity in "deviation"** (3 marks)  
     - *Common error: Only praises test without criticism.*  
  7. **Concludes test fails to isolate metaphysics from morality** (2 marks)  
     - *Common error: Assumes test is purely metaphysical.*  

  ---  
  **Design Notes:**  
  - **Self-containment**: No external references; variants embedded to test baselines.  
  - **Critical depth**: Part B forces engagement with moral/metaphysical tension.  
  - **Time/scope**: Focused variants prevent tangents; 90-minute pacing feasible.  
  - **Model answer**: Demonstrates application first, then meta-critique mirroring Part A/B split. Ends with synthesis ("Ultimately...").  
  - **Discrimination**: Weak students stall at Part A; strong ones use Part A to fuel Part B critique.
