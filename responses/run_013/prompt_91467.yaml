  But note: we have exactly the five members as above. If we drop the disjunctive structure and make it conjunctive, then we would have the classic paradox: D if (A and B). Then we could have majorities for A and for B but against D. But that's not what we want.

  In this disjunctive case, the structure is essential. The whole thing collapses if we drop the disjunctive connection because then the sets would not be constrained in the same way.

  The best move for someone defending straight issue-by-issue majority voting is to argue that the collective set is inconsistent and therefore the group must revisit the votes to resolve the inconsistency. Alternatively, they might argue that the aggregation method must be specified in advance: either always use premise-based or always use conclusion-based. But note that in this case, the written rule defines D in terms of A and B, so it might be natural to use premise-based. However, the conclusion-based method is also a common way to make decisions (voting on the bottom line). 

  A stronger response might be to note that the inconsistency arises because the majority on the premises does not reflect the reasons for the majority on the conclusion. Specifically, the members who are for D are split on which premise they endorse. Therefore, the defender of issue-by-issue voting might suggest that the group should not vote on the premises at all, but only on the conclusion, because the premises are not independent. Alternatively, they might argue that the decision rule should be interpreted as requiring the group to determine whether at least one of A or B holds, and that requires a holistic evaluation. But that would abandon issue-by-issue voting.

  Another strong response is to point out that in this particular setup, the group's own rule defines the decision in terms of the premises, so the premise-based procedure is the only one that respects the rule. Therefore, the conclusion-based procedure is illegitimate in this context because it bypasses the rule. Thus, the group should use the premise-based method and reject the trial.

  However, the paradox highlights that even with a clear rule, majority voting on each issue can lead to an inconsistency. The defender might then suggest that we should require the group to vote in a way that ensures consistency, which might involve deliberating until they agree on a consistent set, or using a different voting rule (like a consensus on the entire set of judgments).

  But note: we are to give the strongest response for defending straight issue-by-issue majority voting. One response is to bite the bullet and say that the collective set is inconsistent and that is acceptable? That seems bad. Alternatively, they might argue that the inconsistency is a result of the specific distribution of opinions and that in practice, the group should then revote or deliberate until the inconsistency is resolved. But that is not defending the method as producing a consistent outcome.

  Another response is to deny that the collective set must be consistent. They might say that the group's decision on each proposition is independent and that the inconsistency is only at the level of the group's set of judgments, which doesn't necessarily matter because the group only needs to act on the decision (D). But that would be to abandon the logical connection that the group itself has endorsed in the rule. This is problematic because the rule says that D is defined by A or B. So if the group says not A and not B and D, it is violating its own rule.

  The strongest response might be to reject the idea that the group must have a consistent set of judgments. Instead, they might say that the group's decision on each proposition is made separately and that the logical relationships are only constraints on the individual members. The group as a whole is not an agent that must have consistent beliefs. This is the "doctrinal paradox" and it is a known issue. The defender might say that in a democratic setting, we care about the majority will on each issue, even if that leads to an overall inconsistency. Then, they would have to live with the fact that the group's decision on D (to approve) is in tension with the decisions on A and B (which imply not D). But that tension is a real problem because the rule says that the trial can be approved only if A or B. So if the group has decided that A is false and B is false, then by their own rule, they should not approve. But they did approve by majority. 

  Therefore, a more practical response is to note that the group's own rule requires that the decision D must be based on A and B. Therefore, the premise-based procedure is the only one that respects the rule. Hence, the group must use the premise-based procedure and reject the trial. This would be the most coherent way to proceed.

  But note, this is not defending straight issue-by-issue majority voting without regard to the rule. It is saying that the rule constrains the aggregation method. Therefore, for groups that have such a rule, they must use the premise-based method.

  However, for a pure defender of issue-by-issue voting without regard to the rule, the case is problematic.

  In summary, we have constructed a case with five members in an IRB committee that satisfies all the requirements.

  The setup:

  **Setting:** A hospital's Institutional Review Board (IRB) is deciding whether to approve a new clinical trial (trial X). The written rule of the IRB states: "The trial may be approved if and only if it satisfies at least one of the following two conditions: (A) The trial has exceptional therapeutic promise; OR (B) The trial poses only minimal risk to participants." The ultimate decision is D: Approve the trial.

  **Members and their judgments:**

  - P1: A true, B false, D true  (set2)
  - P2: A true, B false, D true  (set2)
  - P3: A false, B true, D true  (set3)
  - P4: A false, B true, D true  (set3)
  - P5: A false, B false, D false (set4)

  **Majority votes:**

  - On A: For: P1, P2 (2); Against: P3, P4, P5 (3). Thus, A is rejected.
  - On B: For: P3, P4 (2); Against: P1, P2, P5 (3). Thus, B is rejected.
  - On D: For: P1, P2, P3, P4 (4); Against: P5 (1). Thus, D is accepted.

  **Inconsistent collective set:** 
  - The group rejects A (so not A)
  - The group rejects B (so not B)
  - The group accepts D (so D)
  But by the rule, D should be equivalent to (A ∨ B). However, not A and not B imply not (A∨B), which is not D. Contradiction.

  **Aggregation procedures:**
  - Premise-based procedure (vote on A and B, then derive D): 
     A is false, B is false → D must be false (by the rule). So the decision is: do not approve.
  - Conclusion-based procedure (vote directly on D): 
     D is approved (4-1). So the decision is: approve.

  **The group's written rule** defines the decision in terms of the premises. It states the conditions under which the trial may be approved. This suggests that the premises are the basis for the decision. Therefore, the rule seems to favor the premise-based procedure.

  **Honest note:** The key feature is the disjunctive connection and the distribution of judgments that allows a majority to form against each premise while a majority forms for the conclusion because different subsets of the majority for D endorse different premises. The whole case would collapse if we changed the disjunctive connection to a conjunctive one, because then we would need a different distribution (and the paradox would run in the opposite direction). It would also collapse if we did not have a member who rejects both premises and the conclusion (set4) because then we might not get a majority against both premises. The best move for a defender of straight issue-by-issue majority voting is to argue that the group's rule requires the decision to be based on the premises, so the premise-based procedure must be used, and thus the group should output not D. Alternatively, they might argue that the group should vote only on the conclusion and not on the premises, but that would violate the rule that defines the decision in terms of the premises. Therefore, the most coherent response is to use the premise-based procedure and accept that the group decision is to reject the trial.

