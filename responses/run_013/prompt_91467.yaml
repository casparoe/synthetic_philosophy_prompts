  The key feature that makes this work is the disjunctive connection and the fact that we have two groups of members each endorsing one premise and rejecting the other, and a fifth member rejecting both. The majority against each premise arises because the two groups that are for one premise and against the other are combined with the member against both. However, the two groups that are for one premise (and hence for D) and the member against both (and hence against D) lead to a majority for D because the two groups of two (each for D) plus the one against D gives 4 for D and 1 against.

  Without the disjunctive connection (if it were conjunctive) we would have a different scenario. Also, without the fifth member (set4) we might not get the majorities we need. For example, if we only had two set2 and two set3 and one more set, we might not get the majority against A and against B. In fact, without set4, we have:
