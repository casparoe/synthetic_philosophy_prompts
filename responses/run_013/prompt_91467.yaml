  - Majority rejects B (so not B)
  - Majority accepts D (so D)

  But note: if the majority rejects A and rejects B, then by the logic (D ≡ A∨B) we must have not D. However, the majority also accepts D, leading to a contradiction.

  Additionally, we require:
  - The premise-based procedure (voting on A and B, then deriving D) would yield: not A and not B, so not D (i.e., reject the trial).
  - The conclusion-based procedure (voting directly on D) would yield: D (i.e., approve the trial).

  And we want at most two members to have the same judgment set.

  Let us assign judgments:

  We need to have:
  - Majority against A: at least 3 reject A.
  - Majority against B: at least 3 reject B.
  - Majority for D: at least 3 accept D.

  But note that D must be true if either A or B is true. So for a member to accept D without accepting A or B would violate the rule. Therefore, no member can have (not A, not B, D). Thus, we must design the judgments so that the majority for D comes from members who have either A or B true (so they can have D true) but then we must have a majority against A and against B. How?

  We can have members who accept D because they accept one of the premises, but then we arrange so that the premises are rejected by majority. 

  We have five members. Let us denote a judgment set as (A, B, D). The consistent possibilities are:
  1. (A true, B true, D true)
  2. (A true, B false, D true)
  3. (A false, B true, D true)
