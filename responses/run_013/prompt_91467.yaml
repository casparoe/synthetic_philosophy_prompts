  The written decision rule states: 
  **"The trial may be approved if and only if it satisfies at least one of the following two conditions: 
  (A) The trial has exceptional therapeutic promise; OR 
  (B) The trial poses only minimal risk to participants."**

  The ultimate decision is: 
  **D: Approve the trial.**

  Note that the rule is disjunctive: D if (A OR B). Therefore, the logical connection accepted by all is: D ≡ (A ∨ B). 

  We have five members: P1, P2, P3, P4, P5. Each member must have a consistent set of judgments on A, B, and D (i.e., they must respect D ≡ A∨B). We want the majority votes to yield:
