  Therefore, the two procedures yield conflicting results: premise-based says reject, conclusion-based says approve.

  The group's written rule is: "The trial may be approved if and only if it satisfies at least one of A or B." This rule is about the connection between the premises and the conclusion. The rule does not specify the aggregation method. However, the rule is stated in terms of the premises (A and B) leading to the decision. It might be interpreted as favoring the premise-based approach because the decision is defined by the premises. But note, the rule does not say how to aggregate. This ambiguity is part of the problem.

