  **Joint Statement on the Principle of Identity of Indiscernibles (PII)**

  **1. Agreed Claims**

  1.1 In world W2 (two spheres), the spheres share all intrinsic properties. However, they are discernible by the asymmetric relational property: each is at a distance D from the other, but the other is a different sphere. Thus, the relational property "being at distance D from sphere A" is unique to sphere B, and vice versa.

