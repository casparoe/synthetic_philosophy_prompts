  We are to produce a document that two philosophers, one defending the Principle of Identity of Indiscernibles (PII) and the other rejecting it, can both sign. The case studies are W2 (two identical spheres) and W3 (three identical spheres arranged in an equilateral triangle). The key issue is whether relational properties can discern the spheres. We must also consider the quantum mechanical case of identical particles.

  The document will have:
  1. A numbered list of agreed claims.
  2. A statement of residual disagreement, with each side's position in their own wording.
  3. Cruxes (sub-questions that would move at least one side if settled).
  4. For each crux, the agreed case/argument and each side's prediction.
  5. If there's a verbal dispute, clarify and restate.

  ---

  **Agreed Claims**

  1. In world W2 (two spheres), the two spheres share all intrinsic properties. They also share all relational properties that are symmetric (i.e., each stands in the same symmetric relation to the other). However, they are discernible by an asymmetric relational property: each is at a distance D from the other, but for sphere A, the other sphere is sphere B, and for sphere B, the other sphere is sphere A. Thus, the relation "being at distance D from sphere A" is a property that only sphere B has, and vice versa. Therefore, in W2, the spheres are discernible by relational properties.

  2. In world W3 (three spheres in an equilateral triangle), the spheres share all intrinsic properties. Moreover, the relational structure is symmetric: each sphere is at the same distance from the other two, and the angles are the same. Thus, the complete relational profile of each sphere (the set of all relations it bears to the other objects) is identical. Therefore, in W3, there are no relational properties that discern the spheres.

  3. The Principle of Identity of Indiscernibles (PII) is typically formulated as: If for every property P, object x has P if and only if object y has P, then x is identical to y.

  4. There are two readings of PII:
     - **Weak Reading**: The properties considered include only non-haecceitistic properties (i.e., properties that do not involve the identity of particular individuals). On this reading, in W3, the spheres are indiscernible, but PII is not violated because the spheres are not identical. However, this reading may be considered trivial if it excludes properties that are only individuated by the identities of the objects they relate to.
     - **Strong Reading**: The properties considered include all properties, including haecceitistic ones (i.e., properties that depend on the identity of the particular individual, such as "being identical to x"). On this strong reading, PII is trivially true because for any distinct x and y, the property "being identical to x" is had by x but not by y. However, this makes PII uninformative.

  5. The dispute about W2 and W3 hinges on whether relational properties that involve reference to particular individuals (like "being at distance D from sphere A") are admissible in the principle. The defender of PII (logician) typically allows such properties, while the opponent (younger philosopher) argues that they are not genuine qualitative properties and thus should not be used to save PII.

  6. W3 does independent work: It shows that even in a symmetric configuration with more than two objects, indiscernibility can arise. The two-object case (W2) can be resolved by asymmetric relations, but the three-object symmetric case (W3) cannot. Thus, W3 is not merely W2 with a third sphere bolted on; it is a qualitatively different scenario that forces the issue of whether non-qualitative (haecceitistic) properties are allowed.

  7. Regarding identity as a property: If we allow properties such as "being identical to x", then PII becomes trivially true. Both sides agree that such properties should be excluded for a non-trivial PII. However, the disagreement is about whether relational properties that implicitly depend on identity (like "being at distance D from x") should be excluded.

  8. For the counterexample to PII (on a non-trivial reading) to go through in W3, we require that:
     - The world contains at least two distinct objects.
     - These objects share all intrinsic properties.
     - The relational structure is symmetric so that they also share all relational properties that do not depend on the identity of the objects.

  9. In quantum mechanics, the state of a system of identical particles is described by a wave function that is symmetric or antisymmetric under exchange. This means that there is no fact of the matter as to which particle is which. The formalism does not individuate particles. This is analogous to W3 in that the particles are indiscernible. Both sides agree that this quantum case is a potential counterexample to PII if the particles are considered distinct individuals. However, the defender of PII might argue that in quantum mechanics, the particles are not individuals in the classical sense.

  ---

  **Residual Disagreement**

  *Younger Philosopher (Opponent of PII):* The Principle of Identity of Indiscernibles, when understood in a non-trivial and metaphysically significant way, is false. The world W3 provides a clear counterexample: there are three distinct spheres, each indiscernible from the others by any qualitative property (intrinsic or relational) that does not depend on the identity of the particular spheres. The defender's attempt to save PII by allowing properties like "being at distance D from sphere A" is illegitimate because such properties are haecceitistic and not genuine qualitative properties. Thus, PII fails in W3. Moreover, the quantum mechanical case of identical particles reinforces that there can be distinct but indiscernible objects.

  *Logician (Defender of PII):* The Principle of Identity of Indiscernibles is true. In any world, if two objects are distinct, they must differ in some property. In W3, the spheres are discernible because each sphere stands in a unique set of relations to the other two. For example, sphere A is the sphere that is at distance D from both B and C, and similarly for the others. However, note that the set of relations for A is: [relation to B, relation to C]. But since B and C are distinct, the relation to B is different from the relation to C. But wait, in W3, the relation to B is the same as the relation to C (same distance and same angle). However, the defender might argue that the relation "being at distance D from sphere B" is a different property from "being at distance D from sphere C". Thus, each sphere has a different pair of relational properties. But the opponent counters that the properties are not qualitative because they depend on the identity of B and C. The defender might then say that the properties are still genuine properties, and thus the spheres are discernible. Alternatively, the defender might argue that W3 is impossible because it requires absolute space to fix the positions, but we have no absolute space. However, we can define relations without absolute space. The key point is that the defender maintains that there is always a property that distinguishes any two distinct objects, even if that property is haecceitistic. But if we exclude haecceitistic properties, then the defender might concede that in W3 the spheres are indiscernible but argue that they are not individuals in the usual sense.

  However, note that the agreed claims already state that in W3 the relational profile is identical. Therefore, the defender must either allow haecceitistic properties or reject the possibility of W3. But the problem states that we are considering W3 as a possible world. So the defender might argue that in W3, the spheres are not distinct individuals? But that seems counterintuitive.

  Alternatively, the defender might argue that the spheres are discernible by the relational property "being at distance D from sphere A" and "being at distance D from sphere B", and since A and B are distinct, the properties are distinct. But then, for sphere C, it has the property of being at distance D from A and from B. But so does sphere A: it is at distance D from B and from C. But note that the property of sphere A is: it is at distance D from B and at distance D from C. Similarly, for sphere C: it is at distance D from A and at distance D from B. The set of relations is the same: each is at distance D from the other two. So the relational property "being at distance D from both other spheres" is the same for all. The only way to discern is to use properties that mention specific spheres, which are haecceitistic.

  Therefore, the defender must either:

  - Admit that in W3 the spheres are indiscernible and thus that PII fails (if we exclude haecceitistic properties), or
  - Insist that haecceitistic properties are admissible, making PII trivially true.

  But the opponent does not want to make PII trivially true, and the defender does not want to admit it is false.

  So the residual disagreement is:

  *Defender (Logician):* The Principle of Identity of Indiscernibles is true. In W3, the spheres are discernible because each sphere bears a unique set of haecceitistic relations to the other spheres. For example, sphere A has the property of being identical to A, which is a property that B and C lack. If we are to have a non-trivial principle, we must restrict the properties to qualitative ones, but then we must also note that W3 is a world without haecceities, and in such a world, the spheres are not distinct individuals. Therefore, PII holds for individuals.

  *Opponent (Younger Philosopher):* The Principle of Identity of Indiscernibles, when properly understood as about qualitative properties, is false. W3 is a counterexample: it contains three distinct individuals that are qualitatively indiscernible. The quantum mechanical case of identical particles reinforces this: there are distinct particles that are indiscernible by any qualitative property.

  ---

  **Cruxes**

  We now list the cruxes. These are sub-questions that, if settled, would move at least one side.

  1. **Crux 1: Are haecceitistic properties admissible in PII?**
     - If haecceitistic properties are admissible, then PII is trivially true.
     - If they are not, then in W3, the spheres are indiscernible, and if they are distinct, PII fails.

  2. **Crux 2: Is W3 metaphysically possible?**
     - The defender might argue that W3 is impossible because it requires that there are three distinct individuals that are indiscernible, which violates the very principle in question. But that would be circular. Alternatively, the defender might argue that without absolute space, the configuration is impossible? But the problem states that we have relative space.

     However, both sides agree that W3 is being considered as a possible world for the sake of argument.

  3. **Crux 3: Are the particles in quantum mechanics distinct individuals?**
     - If they are, then they are a counterexample to PII (if we exclude haecceitistic properties).
     - If they are not, then the quantum case does not threaten PII.

  4. **Crux 4: What is the status of relations that involve reference to particular individuals?**
     - Are properties like "being at distance D from sphere A" qualitative or non-qualitative?
     - The opponent says they are non-qualitative (haecceitistic) because they depend on the identity of A.
     - The defender says they are genuine properties and thus admissible.

  We will focus on Crux 1 and Crux 4 as the main ones.

  ---

  **Table of Cruxes**

  | Crux | Agreed Case/Argument | Defender's Prediction | Opponent's Prediction |
  |------|----------------------|-----------------------|----------------------|
  | 1. Admissibility of Haecceitistic Properties | The dispute is whether including properties like "being identical to x" makes PII trivial. Both agree that if such properties are included, PII is trivially true. The question is whether PII should be formulated without them. | If we exclude haecceitistic properties, then PII is a substantive principle that may be false. However, the defender might hold that without haecceitistic properties, we cannot have distinct individuals that are indiscernible, so PII holds. | If we exclude haecceitistic properties, then W3 shows PII is false. |
  | 2. Possibility of W3 | Both agree that W3 is described without absolute space and with only relative relations. The argument is whether such a world is metaphysically possible. | W3 is impossible because it would require three distinct individuals with no qualitative differences, which violates the principle that distinct individuals must be discernible. | W3 is possible and serves as a counterexample. |
  | 3. Quantum Particles as Individuals | In quantum mechanics, identical particles are treated as indistinguishable. The formalism does not label them. | The particles are not individuals; they are excitations of a field or modes. Therefore, there is no violation of PII because there are not multiple distinct individuals. | The particles are distinct individuals (e.g., there are two electrons) and they are indiscernible, so PII is violated. |
  | 4. Nature of Relational Properties | Consider the property "being at distance D from sphere A". | This property is a genuine property, and it is distinct from "being at distance D from sphere B". Therefore, in W3, each sphere has a unique set of such properties and is discernible. | Such properties are haecceitistic because they depend on the identity of A. They are not purely qualitative and should be excluded in a non-trivial PII. |

  ---

  **Verbal Dispute**

  Part of the disagreement is about what counts as a "property" in the Principle of Identity of Indiscernibles. This is a verbal dispute because the two sides are using different criteria for what properties are admissible.

  To resolve, we restate the Principle with a restriction to qualitative properties (non-haecceitistic, i.e., properties that do not depend on the identity of particular individuals). Then:

  - The opponent says: In W3, there are three distinct objects that share all qualitative properties (both intrinsic and relational). Therefore, PII (restricted to qualitative properties) is false.

  - The defender says: If we restrict to qualitative properties, then in W3 the objects are not distinct individuals. The defender might hold that without haecceitistic differences, there cannot be distinct individuals.

  Thus, after disambiguation, the substantive disagreement remains: Can there be a world with distinct individuals that are qualitatively identical? The opponent says yes (W3), the defender says no.

