  I need to build a case against the standard reflection principle. I'll draw from philosophy of probability and epistemology to explain why it's broken. Key points: the principle ignores justification and reliability in belief formation, it treats all future beliefs as equally valid regardless of origin, and it fails to account for rational updates based on evidence. Instead, I should emphasize that the real norm should be about the quality of the reasoning process—like whether it's based on sound evidence or cognitive biases.

