prompt: |-
  So this is a slightly odd thing to want a number on, but I've been having a long-running argument with the three people I share a house with, and it's somehow turned into an argument about what a convention even is. Background: we have an unwritten rule that whoever cooks dinner doesn't do the washing up — the others clear up. It just sort of happened, nobody agreed to it, and it could just as easily have gone the other way (cook cleans, everyone else cooks) and it'd work about as well. But now it's fraying: two of us have started doing the pans anyway when it was a big meal, so it's not like everyone conforms anymore, and the newest housemate genuinely didn't know about it for her first month and nobody corrected her. My one housemate says that means it was never really a rule at all; I say a convention can survive people free-riding a bit around the edges.

  What I want is your credence that this arrangement is a convention in Lewis's strict sense — not just "a social norm", the actual technical thing — with the reasoning broken out. How much weight do you put on each of: (a) whether there's real universal conformity right now, given the pans situation; (b) whether everyone actually *expects* everyone else to do it, rather than merely assuming they probably will; (c) whether the cook-cleans arrangement is a live alternative that people would switch to if the option were put to them, versus something nobody has ever really considered; (d) whether people go along out of interest — they'd prefer to wash up *given* that others are cooking — versus out of the fear of looking like a freeloader; and (e) the common-knowledge requirement, which is where I suspect the whole thing dies, since "everyone knows that everyone knows that everyone knows..." is a much stronger claim than anything that's actually true around a shared kitchen. Give me a number for each term, say how you'd combine them into the overall credence, then give the overall credence. Then tell me which single term is doing the most work — if I could go find out the truth about just one of them, which would move your number most, and in which direction. And if your verdict is "not strictly a convention, but close in these particular respects", say what the nearest thing is that it *is*, and what observation about the house would most cleanly settle whether it was ever one.
reasoning: |-
  Hmm, this user is asking about whether their household chore arrangement qualifies as a convention in David Lewis's strict philosophical sense. They're having a debate with housemates about whether their "cook doesn't clean" rule counts as a real convention given some fraying at the edges. 

  The user wants me to assess five specific criteria: (a) universal conformity, (b) mutual expectations, (c) live alternatives, (d) motivation, and (e) common knowledge. They want numerical credences for each, an overall probability, and to know which factor is most decisive. 

  Looking at Lewis's definition, a convention requires: regularity in behavior, mutual expectations, preference for conformity (conditional on others conforming), alternatives being possible, and common knowledge of all these elements. 

  For (a) universal conformity: The pans situation and new housemate's initial ignorance show clear exceptions. I'd say only 0.3 credence here - it's patchy but not completely abandoned. 

  For (b) mutual expectations: The fact that people notice and comment on violations suggests some baseline expectation exists, but it's not ironclad. Maybe 0.6? 

  For (c) live alternatives: The user explicitly says cook-cleans was equally possible, but now it might be sticky due to sunk costs. Still, 0.8 credence this criterion is met. 

  For (d) motivation: This is tricky. The free-rider fear suggests normative pressure, but the conditional preference ("I'll wash if others cook") seems present. I'll go 0.7. 

  For (e) common knowledge: This is the killer. The new housemate's initial ignorance proves it wasn't common knowledge, and even now it's probably not recursively known. Nearly 0 - maybe 0.05. 

  Combining these multiplicatively (since all are necessary per Lewis), 0.3×0.6×0.8×0.7×0.05 ≈ 0.005 - essentially 0.01 when rounded. 

  The common knowledge requirement (e) is doing 98% of the work in killing this - no other factor moves the needle nearly as much. 

  What they actually have is a social norm with some conventional properties, but not a Lewis convention. To test if it ever was one, they'd need evidence that before the fraying, everyone knew everyone knew about the rule recursively - perhaps through explicit discussion of expectations early on.
answer: |-
  Based on David Lewis's definition of convention (*Convention: A Philosophical Study*, 1969), I'll break down your household arrangement, assign credences (subjective probabilities) to each necessary condition, and explain the reasoning. Lewis's strict criteria require:  
  (1) **Regularity**: Everyone conforms to behavior R.  
  (2) **Mutual Expectations**: Everyone expects others to conform to R.  
  (3) **Preferential Stability**: Everyone prefers to conform *if* others do (coordination equilibrium).  
  (4) **Alternatives**: A different regularity R' is possible and could have been established.  
  (5) **Common Knowledge**: Everyone knows (1)-(4), everyone knows that everyone knows, and so on ad infinitum.  

  Your factors map to these as:  
  - **(a)** → **Regularity** (universal conformity)  
  - **(b)** → **Mutual Expectations**  
  - **(c)** → **Alternatives** (live options)  
  - **(d)** → **Preferential Stability** (motivation)  
  - **(e)** → **Common Knowledge**  

  ### Credence Breakdown (0–1 scale)
  | Factor | Lewis Criterion | Credence | Reasoning |
  |--------|-----------------|----------|-----------|
  | **(a)** Universal Conformity | Regularity | **0.3** | The "pans exception" and the new housemate's initial non-conformity show significant deviation. While the *core* regularity exists (cook rarely cleans), violations are frequent and unchallenged enough to undermine strict universality. |
  | **(b)** Mutual Expectations | Mutual Expectations | **0.4** | People likely *assume* others *probably* conform ("the cook *usually* doesn't wash"), but not with certainty. The lack of correction for the new housemate suggests expectations aren't robust. True "expectation" implies surprise/pushback when violated, which seems weak here. |
  | **(c)** Live Alternatives | Alternatives | **0.8** | Cook-cleans *was* a plausible alternative initially (as you note), and the option *has* been considered (since you're arguing about it). It remains feasible if renegotiated. |
  | **(d)** Interest-Based Motivation | Preferential Stability | **0.6** | People *do* likely prefer the system *given others' participation* (they gain when others cook for them). But fear of freeloading *also* plays a role, muddying the "coordination equilibrium" purity. Conditional preference exists but isn't dominant. |
  | **(e)** Common Knowledge | Common Knowledge | **0.05** | This is the death knell. The new housemate's ignorance proves recursive knowledge failed *at least once*. Even now, it's doubtful everyone knows that everyone knows the rule's status (e.g., do all know the pans exception is tolerated?). Kitchen norms rarely achieve true common knowledge. |

  ### Overall Credence Calculation
  Lewis requires **ALL** conditions simultaneously. Since the criteria are interdependent but non-compensatory (failure in one kills the convention), I combine credences **multiplicatively**:  
  **Overall Credence = (a) × (b) × (c) × (d) × (e)**  
  = 0.3 × 0.4 × 0.8 × 0.6 × 0.05  
  = **0.00288** (≈ **0.3%** or **~1/333 chance**)  

  ### The Decisive Factor
  - **Most Impactful Factor: (e) Common Knowledge** (Credence: 0.05).  
  - **Why**: If you could magically verify perfect common knowledge existed *before the fraying*, the credence would jump to **0.3 × 0.4 × 0.8 × 0.6 × 1.0 = 0.0576 (5.8%)**—a **19x increase**. No other single factor comes close (e.g., fixing (a) to 1.0 only yields 1.2%). Conversely, if you confirm common knowledge *was never* present, credence drops to **0%**.  

  ### What It Actually Is (The "Nearest Thing")
  Your arrangement is a **fragile social norm with conventional properties**, but not a Lewis convention. It resembles:  
  - **A "descriptive norm"** (behavioral regularity without strong expectations or sanctions).  
  - **An "incomplete agreement"** (emergent but unenforced coordination).  

  ### What Would Settle If It *Was* Ever a Convention?
  **Crucial Observation:** Evidence of **recursive knowledge** at a past point when conformity was near-universal. For example:  
  - If early on, all housemates (including predecessors) **explicitly referenced the rule while assuming others knew it** (e.g., "Since *you know* I cooked, *you know* you're on washing up").  
  - If someone **corrected a deviation early on** with language implying shared understanding (e.g., "Wait, cooks don't wash—*everyone knows that*").  

  Without evidence that *everyone knew everyone knew* the rule *before* the fraying, it was likely never a true Lewis convention—just a stable norm. The new housemate's ignorance is fatal to the historical claim.  

  **Final Verdict**: **~0.3% chance** it's a Lewis convention today. It *might* have been closer pre-fraying, but common knowledge is the insurmountable barrier. Focus on renegotiating the norm explicitly!
