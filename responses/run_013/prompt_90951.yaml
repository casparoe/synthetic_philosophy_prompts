prompt: |-
  I'm in a small reading group that's trying to sketch a research agenda on the ethics of influence — mostly philosophy people, one psychologist, me (MPhil, now working adjacent to policy). Our focus is narrow on purpose: AI systems that try to change what people believe or do. Recommender feeds, chatbots that are eerily good at emotional attunement, targeted ads, that whole cluster. The problem is that the conceptual literature on manipulation feels like it was built almost entirely out of individual, face-to-face cases — a salesman, a seducer, a gaslighter, a con artist — and we can't tell which of the open questions about *those* cases actually matter once the influencer is a system optimizing at scale, with no single moment of intent and no clear target. One person in the group floated a distinction I hadn't seen before: manipulation of the *content* of someone's attitudes versus manipulation of the *process* by which they arrive at them — the ordering, salience, and timing of considerations rather than the considerations themselves. She thinks the process side is where all the interesting algorithmic cases live (dark patterns, autoplay, defaults that feel like choices) and that most of the traditional debate has been stuck on the content side. I genuinely can't tell if that carve is real or just relabels things we already had words for, and honestly it might be a distinction without a difference.

  So here's what I actually want from you. We have maybe two person-years of conceptual work to spend — argument and theory, not experiments, not AI-governance policy drafting. Which open questions in the manipulation-versus-persuasion area should we put first, and in what order? I care far more about the reasoning than the list: for each, why it's upstream of the other work (what you can't settle until it's settled), how tractable it is for people who work by argument rather than experiment, and what would move it up or down over the next year or two. I'm especially torn between three candidates and would like you to tell me if any of them is a dud: the definitional question (what even makes influence manipulative, and does it require an intent to manipulate, or can a system or an environment be manipulative without anyone manipulating?); the wrong-making question (is the core wrong of manipulation the bypassing of rational agency, the concealment of the influencer's aim, or the exploitation of a vulnerability — and do those come apart?); and the structural question (whether there's such a thing as a manipulative *environment* or *architecture*, as opposed to a manipulative act, which is the one I suspect we're least equipped to answer). Also flag where your ranking shifts if we assume the influence is aimed at the target's own good, since half our cases are paternalistic-ish and the other half aren't.

  Please keep the whole reply under 800 words. I want a defended agenda with an actual ordering, not a survey, and please no reading lists or citations — I can't look anything up right now anyway, and half of us wouldn't recognize the references.
reasoning: |-
  Okay, the user is part of a reading group focused on the ethics of AI-driven influence—things like recommender systems and chatbots that alter beliefs or behaviors. They're struggling because traditional manipulation ethics focuses on face-to-face interactions, but AI operates without clear intent or individual targets. One member proposed a content vs. process manipulation distinction, and the user isn't sure if it's valid. They want help prioritizing research questions for their group's limited resources.

  The user needs a clear research agenda ordering three key questions: definitional (what is manipulation?), wrong-making (why is it bad?), and structural (can environments be manipulative?). They care about reasoning—why one question is foundational, tractability for philosophical work, and how external factors might shift priority. They also want sensitivity to paternalistic vs. non-paternalistic cases.

  I need to assess which questions unlock others. The definitional question seems most upstream—without a clear concept of manipulation, you can't analyze wrongness or structure. It's tractable through conceptual analysis but might get messy with edge cases. Structural feels urgent for AI contexts but harder without definitions settled. Wrong-making is mid-level: important for ethics but less foundational.

  For ordering, I'll put definitional first (it underpins everything), then wrong-making (informs harm assessment), then structural (applies concepts to systems). Paternalism affects wrong-making most—bypassing rationality feels less problematic if intentions are good. If societal concern about AI grows, structural might jump in priority. The content/process distinction? It's useful: AI excels at process manipulation (e.g., autoplay exploiting attention), which traditional ethics overlooks. Not just relabeling—it highlights new vulnerabilities.

  Duds? None are duds, but structural alone would fail without the prior two. The group should start with definitions, using the process lens to refresh old debates.
answer: |-
  Here’s a defended research agenda prioritizing your three questions, with reasoning on upstream dependencies, tractability, and shifting factors. The content/process distinction is **useful and novel for AI**: it captures how algorithms engineer *context* (e.g., timing, salience fatigue) rather than fabricating claims. This isn’t relabeling—it highlights vulnerabilities traditional ethics overlooks (e.g., autoplay exploiting attention scarcity ≠ lying).

  **Priority Order & Reasoning:**  
  1. **Definitional Question** ("What *is* manipulative influence?"):  
     - **Why first?** Until you define manipulation (especially sans intent), you can’t coherently analyze *why* it’s wrong or *if* environments qualify. Everything hinges on this.  
     - **Tractability:** High for conceptual work. Analyze necessary/sufficient conditions: e.g., "undermining rational agency via covertly exploiting cognitive vulnerabilities." Debate intent: systems may "manipulate" without *mens rea* if designed to trigger predictable irrationalities.  
     - **Shifts:** Moves *up* if regulatory debates intensify (need clear criteria). Moves *down* if consensus emerges that intent is irrelevant in systemic cases.  
     - **Paternalism note:** Crucial here—does "benign intent" negate manipulation? (Spoiler: Probably not, if process bypasses agency.)

  2. **Wrong-Making Question** ("Why is manipulation *bad*?"):  
     - **Why second?** Definitions enable this, but the "wrong" determines policy severity. You need to know if bypassing rationality is inherently harmful (Kantian) or context-dependent (e.g., exploiting vulnerability = exploitation).  
     - **Tractability:** Moderate. Conceptual arguments can dissect harms (autonomy violation vs. welfare harm vs. deceit), but empirical input helps weigh real-world impact.  
     - **Shifts:** Moves *up* if AI harms surge (need ethical framing for redress). Moves *down* if definitions settle on a wrong-making feature (e.g., "all manipulation inherently violates autonomy").  
     - **Paternalism note:** *Most critical here*. If influence is "for their own good," does bypassing reason become acceptable? Content/process matters: manipulating *process* for health goals may still wrong by infantilizing.

  3. **Structural Question** ("Can environments/architectures be manipulative?"):  
     - **Why last?** Requires settled definitions/wrongs to avoid begging the question. If manipulation *must* be agential, environments can’t qualify—but if it’s *effect-based*, architectures dominate.  
     - **Tractability:** Lower. Needs bridging philosophy of technology (e.g., "distributed agency")—harder pure argument. Your psychologist can help model cognitive effects.  
     - **Shifts:** Moves *up* if AI incidents reveal emergent manipulation sans design (e.g., engagement metrics creating addictive patterns unintentionally).  
     - **Paternalism note:** Less direct impact. Structural manipulation’s wrongness depends on prior answers.

  **Why Not a Dud?**  
  - **Definitional:** Foundational. AI forces rethink—don’t skip.  
  - **Wrong-Making:** Dictates ethical urgency. Content/process distinction clarifies *how* harms differ (e.g., exploiting impulsivity vs. lying).  
  - **Structural:** Essential for scale, but *depends* on 1 and 2. Tackling it prematurely risks conceptual muddle.

  **Agenda Summary:**  
  1. **Define manipulation** for AI systems, testing content vs. process. Output: Criteria separating manipulation from persuasion.  
  2. **Identify core wrongs**, especially under paternalism. Output: Framework for evaluating harm severity.  
  3. **Analyze environments**, using 1 and 2. Output: Conditions under which architectures (not just agents) manipulate.

  Spend Year 1 on Definitional (+60%) and Wrong-Making (+40%). Year 2 shift to Structural (+50%) and refining Wrong-Making (+50%) with architectural applications. This order builds necessary conceptual scaffolding while leveraging your group’s strengths.
