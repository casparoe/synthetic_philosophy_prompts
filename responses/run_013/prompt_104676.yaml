prompt: |-
  I am a doctoral student in philosophy working on shared intention, and I have come to think that criminal conspiracy doctrine is a better-specified test case for theories of collective intentionality than most of the toy cases we philosophers use. I would like you to tell me what conception of shared intention the doctrine presupposes. Four features of it are what interest me. First, the plurality requirement: on the traditional common-law approach, conspiracy requires a genuine agreement between at least two persons each with the requisite mental state, so that a defendant who agrees only with an undercover officer or an informer who is merely pretending is guilty of attempt but not of conspiracy at all; the Model Penal Code and a number of jurisdictions have abandoned this in favor of a unilateral formulation, on which one person's genuine commitment suffices and the other party's state of mind is irrelevant. Second, derivative liability: a conspirator may be convicted of substantive offenses committed by co-conspirators in furtherance of the scheme that he neither knew of nor intended, so long as they were reasonably foreseeable within the scope of the agreement. Third, withdrawal: ceasing to participate is not enough; the defendant must ordinarily communicate his disavowal to the others, and some courts require affirmative steps to thwart the scheme, while renunciation defenses are unavailable in some codes when the change of heart was prompted by the rising risk of detection. Fourth, the mental element is itself contested: some courts require intent to further the criminal objective, while others accept knowledge of the objective together with a stake in the venture, so that a supplier who knows what his goods will be used for may or may not count as a conspirator depending on the jurisdiction.

  What I want is the implicit theory of joint action, not a survey of the case law. Does the plurality requirement presuppose an irreducibly interpersonal conception of shared intention, one on which a we-intention cannot be housed in a single head, and does the unilateral alternative presuppose a reductionist picture on which conspiring is only a mode of individual commitment? Does derivative liability presuppose that the joint enterprise is a locus of agency in its own right, or can it be explained as imputation on policy grounds that needs no such metaphysics? Does the withdrawal rule presuppose that a joint commitment, once formed, can only be dissolved jointly — by release or communication rather than a unilateral change of mind — and if so, is that a genuine presupposition or merely an evidentiary convenience? And can any single theory of shared intention underwrite both a robust plurality requirement and liability that outruns every participant's intention?

  Answer as exactly five numbered points of one or two sentences each, with no introduction and no concluding summary: one on the plurality requirement, one on the unilateral alternative, one on derivative liability, one on withdrawal, and one on whether the doctrines are jointly consistent and where the practice is underdetermined — that is, where the same doctrines would be equally well explained by evidentiary and deterrent considerations alone.
reasoning: |-
  Okay, let me tackle this philosophy doctoral student's query about criminal conspiracy doctrine as a test case for shared intention theories. The user wants exactly five numbered points addressing specific aspects: plurality requirement, unilateral alternative, derivative liability, withdrawal, and doctrinal consistency.

  First, the plurality requirement. The traditional common-law approach insisting on genuine agreement between two culpable parties suggests an irreducible interpersonal commitment - a true "we-intention" that can't exist in one mind alone. This contrasts sharply with philosophical toy cases.

  Then the unilateral alternative under Model Penal Code. This shifts to a reductionist view where individual commitment suffices, treating conspiracy as essentially individual mens rea plus external actions toward agreement.

  Derivative liability interests me - it points to joint enterprise as a distinct agential unit. Holding members liable for co-conspirators' foreseeable actions implies the group itself has causal power beyond individual contributions.

  Withdrawal rules are revealing. Requiring communication or active thwarting suggests joint commitments create persisting normative bonds that can't be dissolved unilaterally - a strong collectivist view of obligation.

  Finally, the consistency question. While some elements like withdrawal rules strongly suggest metaphysical commitments to joint agency, other aspects (like knowledge vs. intent debates) might be equally explained by policy considerations about deterrence and evidence. The doctrine isn't philosophically monolithic.

  Throughout, I'm conscious this doctoral student needs crisp, theory-focused analysis - not legal survey - connecting these legal structures to debates about collective intentionality in philosophy. The bilateral/unilateral tension particularly illuminates the reducibility question in shared agency theories.
answer: |-
  1.  **Plurality Requirement:** The traditional bilateral requirement presupposes an irreducibly interpersonal conception of shared intention; a genuine conspiratorial agreement necessitates *mutually responsive* intentional states forming a "we-intention" that cannot be constituted by one person's state alone.
  2.  **Unilateral Alternative:** The MPC's unilateral approach presupposes a reductionist picture, treating conspiracy as fundamentally an individual's culpable state of mind (intent to agree/promote crime) coupled with an overt act, rendering the other party's state irrelevant to the individual's *intent to conspire*.
  3.  **Derivative Liability (Pinkerton):** Derivative liability strongly suggests the joint criminal enterprise itself is treated as a distinct locus of agency; liability for co-conspirators' reasonably foreseeable acts flows from membership in the ongoing collective venture, not merely policy-driven imputation of individual intent.
  4.  **Withdrawal:** The requirement for communication or active thwarting presupposes that a joint commitment creates normative bonds persisting beyond a private change of heart, requiring collective dissolution (release/renunciation communicated) rather than purely unilateral revocation.
  5.  **Consistency & Underdetermination:** While robust plurality, derivative liability, and demanding withdrawal rules collectively suggest a strong, irreducibly collective conception of the shared criminal enterprise, debates over the mental element (intent vs. knowledge/stake) are significantly underdetermined and often driven by evidentiary concerns and deterrence policies rather than a single metaphysical view.
