prompt: |-
  I teach a unit on probability and evidence, and I keep meeting a move — in student papers, and more disconcertingly in published work — for which I have no name. A quantity is unknown: the bias of a coin, the true effect of a treatment, the share of a population with some trait. The reasoner says that since we have no reason to think any value of it more likely than any other, all values are equally likely, and computes. When I point out that the very same ignorance, applied to a different but mathematically equivalent description of that same quantity — the chance of two heads in a row rather than the coin's bias, the effect on a ratio scale rather than an additive one — yields a different answer, the reasoner does not withdraw the move. He or she replies that the first description was the natural one and that the alternative smuggles in an assumption. What interests me is not the inconsistency but the asymmetry in how it is diagnosed: the description the reasoner happened to reach for first is treated as neutral, and its equally arbitrary alternatives as loaded. It is as though the absence of a reason to prefer a description were being taken as a reason to prefer the description already in hand.

  Is there an established name for this? I know the general territory — the principle of indifference, and the old puzzles about a chord drawn at random in a circle — but those are ordinarily presented as puzzles about ignorance, whereas what I am after is the specific habit of taking one's own formulation for the unformulated case. If the nearest concepts do not capture it, I want to know precisely where each falls short; and if nothing fits, a coined term, with a definition and boundary cases — in particular, how it differs from a mere change of variables, and whether it is a special case of something more general or a distinct failure in its own right.
reasoning: |-
  Okay, the user is teaching a unit on probability and evidence and has noticed a recurring issue in both student papers and published work. They're encountering a specific logical move where someone assumes all values are equally likely due to ignorance, but when presented with an equivalent description that yields a different answer, they defend their original choice as "natural" while dismissing alternatives as "smuggling in assumptions." 

  The user is familiar with the principle of indifference and Bertrand's paradox but feels these don't quite capture the asymmetry in how the initial description is privileged. They want a precise term for this phenomenon, or if none exists, a newly coined term with clear boundaries. The challenge is to differentiate this from a simple change of variables and determine if it's a special case of a broader cognitive bias.

  Hmm... let me unpack the core problem. The issue isn't just about uniform priors per se, but the reflexive defense of one's own parameterization as inherently neutral. The user points out a fascinating asymmetry: the absence of reasons to prefer any description is twisted into a reason to stick with the first one that came to mind. That's almost like a cognitive immune response—ignorance paradoxically becoming justification. 

  I recall Jaynes' work on maximum entropy priors, but even that requires specifying constraints. Here, there are no constraints, just an arbitrary choice framed as default. The key differentiator seems to be the psychological component: the unexamined comfort with one's initial framing. 

  *Pacing mentally*... Existing terms don't fit. "Parameterization bias" is descriptive but too broad. "Framing inertia" captures the cognitive stubbornness but sounds vague. "Prioritization fallacy" might work if emphasizing the erroneous priority given to the first description. 

  Wait—what if we combine the epistemic and psychological aspects? "Epistemic anchoring" ties the cognitive anchor (Tversky's anchoring bias) to knowledge justification. Or "default parameterization fallacy" to highlight the false sense of default status. 

  *Testing boundaries*: This isn't just any change of variables. If someone consciously chooses log-odds for interpretability, that's fine. The failure occurs only when: (1) uniformity is asserted solely from ignorance, (2) an equivalent repameterization breaks it, and (3) the defense appeals to the "naturalness" of the original frame without evidence. 

  *Potential coined term*: "Ignorance-Defended Parameterization" (IDP) with criteria: 
  - Assumed uniformity based on lack of evidence 
  - Rejected alternatives deemed "loaded" despite logical equivalence 
  - No external justification beyond initial selection 

  *User's deeper need*: They likely want to equip students to spot this in their own reasoning. A precise label could serve as a critical thinking tool. The term must be teachable—memorable with clear diagnostic criteria. "Parameterization entrenchment" might resonate, evoking how defenses solidify around the initial choice. 

  *Final consideration*: The user might also appreciate examples contrasting IDP with valid prior choices (e.g., reference priors). This reinforces that the flaw isn't using uniform priors—it's the circular defense when challenged.
answer: |-
  The phenomenon you describe—where an arbitrary initial parameterization is privileged as "neutral" while mathematically equivalent alternatives are dismissed as "loaded"—is a distinct cognitive-epistemic failure that lacks a universally established name. However, it intersects with several concepts. Below is a breakdown, culminating in a coined term and its precise boundaries.

  ---

  ### **Key Concepts & Where They Fall Short**
  1. **Principle of Indifference (PoI)**  
     - *What it covers*: Assigning equal probabilities to mutually exclusive outcomes when no evidence favors any.  
     - *Where it falls short*: PoI focuses on *which events* are considered symmetric, but your issue concerns the *choice of parameterization* for describing those events. PoI doesn’t address the asymmetry in defending one parameterization as "natural."

  2. **Bertrand’s Paradox**  
     - *What it covers*: Demonstrates that different "uniform" distributions over equivalent parameterizations (e.g., chord length vs. angle) yield contradictory probabilities.  
     - *Where it falls short*: It highlights the problem but doesn’t name the *psychological reflex* to defend the initial choice as uniquely impartial.

  3. **Framing Effect**  
     - *What it covers*: Cognitive bias where decisions change based on how information is presented.  
     - *Where it falls short*: Framing effects typically involve *non-equivalent* descriptions (e.g., "90% survival" vs. "10% mortality"). Your case involves *mathematically equivalent* descriptions rejected due to perceived "smuggled assumptions."

  4. **Parameterization Bias**  
     - *Informal term*: Recognizes that priors depend on how variables are defined.  
     - *Where it falls short*: Fails to capture the *asymmetric defense* of the initial choice as assumption-free.

  ---

  ### **Coined Term: Epistemic Anchoring**  
  **Definition**: The cognitive error in which an agent:  
  - (a) Assumes a uniform prior over a specific parameterization of an unknown quantity based on ignorance;  
  - (b) Treats this parameterization as inherently "neutral" or "assumption-free";  
  - (c) Rejects mathematically equivalent reparameterizations as "biased" or "loaded," despite their logical equivalence, due solely to the initial anchoring.  

  **Core Mechanism**: Absence of evidence for any parameter value is misinterpreted as evidence for the *validity of the chosen descriptive framework*.

  ---

  ### **Boundary Cases & Differentiation**  
  | **Scenario**                               | **Epistemic Anchoring?** | **Why?**                                                                 |
  |--------------------------------------------|--------------------------|--------------------------------------------------------------------------|
  | Using a uniform prior for coin bias *p* after acknowledging that uniformity in *p* implies non-uniformity in log-odds. | No | Awareness of the mapping avoids privileging one parameterization. |
  | Asserting that *p* (bias) is "natural" while *q* = *p²* (P(two heads)) is "artificial," and rejecting uniform *q* as "smuggling in assumptions." | **Yes** | Asymmetric defense of initial parameterization without justification. |
  | Choosing a Jeffreys prior for a scale parameter (e.g., variance) due to invariance under reparameterization. | No | Justified by a formal criterion (invariance), not ignorance or convenience. |
  | Preferring additive effects over multiplicative ones in a study because domain knowledge suggests linearity. | No | Justified by empirical evidence, not default anchoring. |

  ---

  ### **Why It’s a Distinct Failure**  
  - **Not mere change of variables**: A change of variables is a mathematical operation; epistemic anchoring is a *defensive epistemic stance* that rationalizes the initial choice as uniquely unbiased.  
  - **Special case of a broader bias?**: It is a hybrid of:  
    - *Cognitive anchoring* (Tversky & Kahneman): Fixating on an initial reference point.  
    - *Unfalsifiable neutrality claim*: Asserting that one’s framework is "assumption-free" by default, making criticism impossible.  
    However, it is distinct in its specific application to probabilistic parameterization under ignorance.

  ---

  ### **How to Diagnose It**  
  A claim exhibits epistemic anchoring if:  
  1. Uniformity is justified *only* by ignorance.  
  2. The parameterization is defended as "natural" without external validation (e.g., invariance, physical meaning).  
  3. Equivalent alternatives are rejected as "introducing assumptions" *solely* because they deviate from the anchor.  

  ---

  ### **Pedagogical Counterexample**  
  **Task**: Estimate the probability that a coin’s bias *θ* is >0.6.  
  - **Anchor**: Uniform prior on *θ* → P(*θ* > 0.6) = 0.4.  
  - **Reparameterization**: Let *φ* = *θ*² (P(two heads)). Uniform prior on *φ* → P(*θ* > 0.6) ≈ 0.16.  
  - **Epistemic Anchoring Response**: "*θ* is natural; *φ* smuggles in an assumption about two-head probability!"  

  **Rebuttal**: Neither is "natural" without context. The inconsistency arises from *imposing uniformity on one scale while ignoring its implications on others*—a failure to recognize that ignorance does not justify a specific geometry of probability.

  ---

  ### **Conclusion**  
  **Epistemic anchoring** names the specific asymmetry you identify: the conflation of "I have no reason to change this" with "this is objectively neutral." It is not PoI or framing alone, but a psychological reinforcement of arbitrary choices under ignorance. For teaching, pairing this term with Bertrand-style paradoxes (e.g., bias *θ* vs. log-odds, cosmic rays' wavelength vs. frequency) exposes how anchoring masquerades as epistemic humility.
