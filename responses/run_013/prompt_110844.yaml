prompt: |-
  Ok so I've been going down a rabbit hole on consent for something I'm writing and there's a pattern I can't stop noticing, and I want to know what it adds up to.

  In a hospital you sign a form before anything happens. Someone has to walk you through the risks, and if they don't, your signature basically doesn't count for much. But you can be in agony, you can have no good option, you can be told it's this or you die — and none of that stops it from being valid consent. Nobody treats the fact that you had no acceptable alternative as a problem.

  Then in a police stop: "mind if I take a look in your car?" and in alot of places the officer isn't obliged to mention that you're allowed to say no. Courts look at the "totality of the circumstances" and usually call it voluntary.

  Then sex. Lying about some things voids consent, lying about others doesn't, and the line people draw is usually whether the lie went to the nature of the act itself. Lie about being sterile, lie about loving someone, lie about what happens to the condom — a lot of jurisdictions shrug. Lie about what act you're doing and it's a serious crime.

  Then contracts: a deliberate material lie gets you out of the whole deal.

  So: what theory of consent does this patchwork actually presuppose? I don't want a survey of the literature, I want the implicit theory dug out. Specifically: does the practice commit to a moralized view of coercion — a threat only counts as coercing you if it was wrong for them to make it — as opposed to a plain "you had no acceptable alternative" view? Does it treat consent as an attitude in someone's head or as an act that authorizes and waives? Is voluntariness a threshhold you either cross or don't, or a matter of degree? And which parts of the pattern are strictly forced by those commitments and which are just things that happen to be compatible with them?

  Then tell me where the practice is underdetermined — several theories license the same behaviour — and what would have to change in each of those four settings if we swapped in a reasonable-alternatives account of voluntariness instead.
reasoning: |-
  Okay, let me try to unpack this user's query. They're diving deep into consent across different contexts—medical, police stops, sex, and contracts—and noticing inconsistencies. They want to know the underlying theory behind these practices and how swapping in a "reasonable alternatives" view would change things.

  First, I need to map out each area. Medical consent: signing forms under duress or pain still counts. Police searches: consent is often deemed voluntary even if the person doesn't know they can refuse. Sexual consent: lies about certain aspects invalidate consent, but not others. Contracts: material lies void the agreement. The user is pointing out that the rules aren't consistent. Why is pain in a hospital not a barrier to consent, but lies in sex depend on the type of lie?

  The user mentions two possible theories: moralized coercion vs. no acceptable alternative. In medical contexts, even if there's no good choice (like surgery or death), it's still voluntary. That suggests the system uses a moralized view—only wrongful threats make consent invalid. Police stops are trickier. Courts look at the totality of circumstances, but not informing about the right to refuse often doesn't invalidate consent. Here, the moralized view might apply because the police aren't seen as doing something wrong by asking, even if the person feels pressured.

  Sexual consent is more nuanced. Lies about the nature of the act (like stealthing) are treated as invalidating consent, while emotional lies aren't. This seems tied to the act's core elements. Contracts are clearer: material lies void consent because they directly affect the agreement's basis. 

  The user wants the implicit theory connecting these. It looks like the system prioritizes authorization and waiver over internal state. Voluntariness is treated as a threshold—either you consent or you don't—based on specific vitiating factors like fraud or coercion defined narrowly. Moralized coercion is key in medical and police contexts, where the pressure isn't considered wrongful. But in contracts, lying is inherently wrong, so consent is void. 

  Where is the practice underdetermined? In police stops, the totality test could fit both moralized and reasonable alternatives views. Changing to a reasonable alternatives approach would mean medical consent might require options beyond life-or-death, police would need explicit reminders of rights, sexual consent could include lies about fertility, and contracts might need proof of no alternatives even with fraud. 

  I should also consider the user's deeper needs. They're writing something, likely about consent theory, and need to critique existing systems. They might want to highlight inconsistencies to argue for reform, like adopting a unified reasonable alternatives model. Their frustration with the patchwork suggests a desire for coherence in how consent is treated across domains.
answer: |-
  Here's the dissection of the implicit theory of consent revealed by your pattern, its commitments, underdetermined areas, and the impact of shifting to a "reasonable alternatives" model:

  ### The Implicit Theory: Moralized Authorization-Waiver Threshold Model
  1.  **Primacy of Authorization/Waiver over Attitude:** Consent is treated primarily as a **performative act** (signing, saying "yes", agreeing) that *authorizes* another's action or *waives* a right/defense. The internal mental state (true desire, enthusiasm, lack of regret) is secondary. The focus is on whether the act *legally permits* the other party to proceed.
  2.  **Moralized Coercion:** Coercion invalidates consent **only if the threat involves a *wrongful* act by the coercer**.
      *   **Hospital:** "Do this or die/suffer" isn't wrongful; it's stating a fact. The doctor has no duty to provide non-treatment. The lack of acceptable alternatives is irrelevant.
      *   **Police:** "Let me search or I'll arrest you/get a warrant" is often seen as a lawful option. The officer isn't *wrongfully* threatening illegal harm. Your lack of an acceptable alternative (submit or face escalation) doesn't automatically void consent.
      *   **Contrast:** "Have sex with me or I'll break your kneecaps" *is* wrongful coercion because the threat itself is criminal.
  3.  **Fraud: The "Nature of the Act" Boundary:** Fraud voids consent **only if it negates the fundamental understanding of *what specific act* is being authorized**.
      *   **Sex:** Lying about *what physical act* is occurring (e.g., stealthing, impersonation) negates consent because you authorized a different act. Lying about *collateral facts* (fertility, love, STI status) doesn't, as the core act authorized (specific sexual contact) is understood.
      *   **Contracts:** A "material" lie directly goes to the *core subject matter or value* of the deal. Lying about collateral facts (e.g., "I love this car!") might not void it.
      *   **Medical/Police:** Fraud is rare here (though lying about risks *could* void medical consent). The implicit theory aligns: lying about the *nature* of the procedure or search would void consent.
  4.  **Threshold Voluntariness:** Voluntariness is treated as a **binary threshold**, not a spectrum. Consent is either "voluntary enough" (based on the absence of *specific, recognized vitiating factors* like wrongful coercion or fraud-as-to-nature) or it isn't. Factors making consent *less* enthusiastic or involving *hard choices* don't automatically push it below the threshold. The system asks: "Were the *legally recognized* deal-breakers present?" not "How free did the person truly feel?"

  ### How the Pattern Fits & What's Forced
  *   **Forced by Authorization/Moralized Coercion/Threshold View:**
      *   **Hospital Hardship:** No wrongful threat? Consent valid. Authorization given? Procedure permitted. Pain/lack of alternatives? Irrelevant below the threshold.
      *   **Police "Totality of Circumstances":** Courts look for *signs* of wrongful coercion or duress (implied illegal threats, physical intimidation). The absence of explicit notification about the right to refuse isn't *inherently* wrongful; it's just one factor in assessing if a wrongful threat was *implied* or if the act wasn't truly authorizing.
      *   **Sexual Fraud Distinction:** The "nature of the act" test directly tracks the authorization concept. Did they authorize *this specific act*? If the fraud changes the act's fundamental nature, then no valid authorization occurred.
      *   **Contract Rescission for Fraud:** Material fraud means the consent didn't authorize the *actual deal*; it authorized a *different, misrepresented deal*. Waiver of rights was based on false premises.
  *   **Compatible, Not Strictly Forced:**
      *   The *specific list* of what constitutes wrongful threats or fraud-as-to-nature is culturally/legally contingent. (e.g., Is lying about STI status *starting* to be seen as fraud-as-to-nature in some places?).
      *   The *level of disclosure required* in medical settings is policy-driven but fits the model: insufficient disclosure = fraud/misrepresentation about the *nature or risks* of the act being authorized.
      *   The "totality of circumstances" test in police stops is how courts *operationalize* the search for wrongful coercion/duress or lack of actual authorization – it's compatible, but the *weight* given to factors like officer demeanor vs. knowledge of rights is flexible within the model.

  ### Underdetermined Areas (Where Multiple Theories Fit the Practice)
  1.  **Police Stops - "Totality of Circumstances":** This test is sufficiently vague that it *could* be interpreted within the implicit model (searching for wrongful coercion) *or* under a reasonable alternatives view (how free was the person *really* to refuse?). The *current practice* of often finding consent valid despite ignorance of the right to refuse leans heavily on the moralized view, but the test *could* be applied more stringently without changing the doctrine.
  2.  **Sex - "Nature of the Act":** The precise boundaries are contested and evolving. Is lying about gender identity "nature of the act"? What about lying about financial status to obtain sex? The core authorization principle is fixed, but its *application* to novel situations is underdetermined and relies on societal/moral judgments about what defines the "act".
  3.  **Medical Consent - Degree of Urgency:** While extreme pain/lack of alternatives doesn't void consent, the *level* of disclosure required in non-emergency vs. emergency situations varies. This variance is compatible with the threshold model (disclosure protects against fraud) but also hints at a (limited) practical concession to alternatives (less time/disclosure in true emergencies).

  ### Impact of Adopting a "Reasonable Alternatives" View of Voluntariness
  A "reasonable alternatives" view defines coercion as **any situation where a person lacks a reasonable or acceptable alternative to compliance, regardless of the coercer's intent or moral status.** Voluntariness becomes more clearly a matter of degree. Shifting to this model would fundamentally alter each setting:

  1.  **Medical Consent:**
      *   **Change:** Consent obtained under extreme pain, fear, or facing only "death or disfigurement" would be scrutinized far more heavily, potentially deemed involuntary. The focus would shift to whether the patient had *any truly acceptable alternative* to agreeing. Informed consent discussions would need to explicitly address alternatives (even bad ones) and validate the patient's lack of choice.
      *   **Consequence:** Many routine consents in emergencies or for painful procedures could be challenged. Hospitals might need neutral advocates to ensure voluntariness, not just comprehension. Treatment delays and litigation would likely increase.

  2.  **Police Consent Searches:**
      *   **Change:** Consent would be presumptively involuntary unless the officer *affirmatively informed* the person of their right to refuse and ensured they understood it. The inherent power imbalance and lack of a *reasonable alternative* (refusal leads to escalation/detention) would weigh heavily against finding voluntariness.
      *   **Consequence:** Consent searches would plummet. "Do you consent? You have the absolute right to say no without any negative consequences, and I cannot lawfully detain you longer solely for refusing" would become mandatory. Searches would rely almost entirely on warrants or probable cause.

  3.  **Sexual Consent:**
      *   **Change:** The scope of invalidating fraud would broaden significantly. Lies about fertility, STI status, emotional commitment, or financial situation could potentially void consent if they negated a *reasonable alternative* for the deceived person (e.g., "Had I known the truth, I would have had the reasonable alternative *not* to have sex with *you*"). Pressure arising from power imbalances or lack of other options could more readily undermine voluntariness.
      *   **Consequence:** Sexual encounters would require significantly more upfront honesty about "material" facts (broadly defined). Prosecutions for rape-by-fraud could increase dramatically. Defining a "reasonable alternative" in intimate contexts would be highly complex and subjective.

  4.  **Contracts:**
      *   **Change:** While material fraud would still void consent, *other forms of pressure* could more readily invalidate contracts. Signing a contract because you face bankruptcy otherwise, or under severe economic duress from circumstances not caused by the other party, might be deemed involuntary due to lack of reasonable alternatives. "Unconscionability" doctrine would expand.
      *   **Consequence:** More contracts could be voided for situational duress, not just wrongful threats. Economic power imbalances would be more scrutinized. Contract formation might require more explicit acknowledgments of voluntariness, especially in consumer contexts.

  **In Summary:** The current patchwork implicitly relies on consent as an **authorizing act**, invalidated only by **wrongful coercion** or **fraud that negates the fundamental nature of the act**, treated as a **binary threshold**. This prioritizes transactional certainty and permits pressure arising from natural consequences or lawful power. Shifting to a **reasonable alternatives model** would dramatically refocus on the **consenter's situational freedom**, making voluntariness more fluid and contextual. It would profoundly disrupt established practices in medicine, policing, intimacy, and commerce by prioritizing the individual's lived experience of choice over the formal act of authorization. The tension between these two models lies at the heart of debates about autonomy, power, and responsibility across these domains.
