prompt: |-
  An encyclopedia that anyone can edit instructs its contributors that the test for including a claim is verifiability — whether a published, reliable source states it — rather than truth. Contributors are told not to add what they personally know to be the case unless a source says it, and not to delete a sourced claim merely because they believe it to be false; yet the project still describes its articles as aiming at accuracy and treats some sourced claims as unacceptable.

  I want to understand the conception of truth that this practice presupposes, and I am struck by an apparent inconsistency: the practice can require the inclusion of a claim its editors believe false and the exclusion of one they know to be true, while still treating accuracy as a goal. Reconstruct the implicit theory. Does the practice require a substantive, correspondence-style notion of truth that it merely declines to make operative, or does it treat truth as nothing more than warranted assertibility by reliable sources? Consider a deflationist account, on which truth is not a substantive property but a device for endorsing or generalizing over propositions, so that there is nothing more to a claim's being true than its being the case. If that account is correct, is a rule that privileges verifiability over truth even intelligible, or is it a category mistake, given that verifiability is a property of our evidence while truth is a property of the claim? Does the practice presuppose that truth and justification are separable — so that a claim may be true yet unsourced, or sourced yet false — or does it collapse the one into the other?

  Distinguish what the practice strictly presupposes from what it merely fits well with, and mark the points at which it is philosophically underdetermined, where a deflationary theory and a robust correspondence theory would license the same practice. Then say what would have to change in the practice under deflationism, and what would have to change under a correspondence theory that treats truth as a substantive relation between claims and the world.
reasoning: |-
  Okay, the user is asking about the concept of truth in the context of Wikipedia's verifiability policy. They're pointing out an apparent contradiction: Wikipedia requires including claims from reliable sources even if editors believe they're false, while excluding true claims that lack sources. Yet it still aims for accuracy. The user wants to understand the implicit theory of truth behind this practice.

  I need to reconstruct Wikipedia's implicit theory of truth. The key is that Wikipedia prioritizes verifiability over editors' personal beliefs about truth. That suggests they see truth and justification as separate. A claim might be true but unsourced, or false but sourced. Their goal isn't to assert truth directly but to report what reliable sources say.

  The user is considering deflationism versus correspondence theories. Deflationism says truth isn't a substantive property - "true" just endorses a claim. Correspondence sees truth as a relationship between a claim and reality. Under deflationism, prioritizing verifiability over truth might seem incoherent because if truth just is what we can justifiably assert, then verifiability would equal truth. But Wikipedia's practice assumes these can come apart, so deflationism might not fit.

  Under correspondence theory, truth is independent of our knowledge. Wikipedia's policy makes sense here because it acknowledges that sources can be wrong, but we need a practical way to handle knowledge. Verifiability acts as a proxy for truth, given human limitations.

  What does the practice strictly presuppose? It requires that truth and justification are distinct. It also needs a notion of accuracy tied to reliable sources rather than direct reality. But it doesn't require a specific metaphysical view of truth - both deflationism and correspondence could accommodate it, with adjustments.

  The user is probably a philosophy student or enthusiast trying to reconcile epistemology with practical knowledge management. They might be frustrated by the gap between ideal truth and practical verifiability. Their deeper need could be understanding how knowledge systems handle human limitations, or seeking a coherent philosophical framework for practices like Wikipedia's.

  I'll explain how Wikipedia's policy fits with separating truth and justification, why deflationism struggles with this, and how correspondence accommodates it. I'll also note where the practice is philosophically neutral, and what changes each theory would require. This should clarify the implicit theory while addressing the user's concerns about consistency and underlying assumptions.
answer: |-
  The encyclopedia's practice (exemplified by Wikipedia) rests on a coherent but philosophically rich implicit theory of truth and justification. Let's reconstruct it, distinguishing strict presuppositions, points of underdetermination, and implications for different truth theories.

  **Core Implicit Presuppositions:**

  1.  **Truth-Justification Distinction:** The practice **strictly presupposes** that *truth* (whether a claim corresponds to the world) and *justification* (whether we have good evidence/reasons to believe it) are **separable properties**. This is non-negotiable for the practice.
      *   *"Include sourced claims even if you believe false"*: Assumes a sourced claim *can* be false (justified ≠ true).
      *   *"Exclude unsourced claims even if you know true"*: Assumes an unsourced claim *can* be true (unjustified ≠ false).
      *   *Goal of accuracy treated separately:* Acknowledges that the *ultimate* goal is truth (accuracy), but the *operational method* is justification (verifiability).

  2.  **Fallibilism:** It presupposes **human fallibility**. Editors and sources *can* be wrong, and personal certainty is not a reliable guide to truth. This necessitates an objective, intersubjective standard (reliable sources) over individual judgment.

  3.  **Verifiability as Proxy:** The practice treats **verifiability (via reliable sources) as the best available operational proxy for truth** in a collaborative, public, and non-omniscient project. It's a *methodological* commitment, not a *metaphysical* claim that verifiability *is* truth.

  4.  **Accuracy as Faithfulness to Sources:** "Accuracy" within the project context primarily means **faithfully representing what reliable sources state**, not guaranteeing those sources' statements correspond directly to reality. The project aims to be an *accurate record* of published reliable knowledge.

  **Philosophical Underdetermination:**

  The core practice is **philosophically underdetermined** regarding the *nature* of truth itself. Both robust correspondence and deflationary theories can license the practice *as described so far*:

  1.  **Correspondence Theory (Robust):** Easily accommodates the practice. Truth is a substantive relation between claims and mind-independent reality. Verifiability is a fallible epistemic tool to *track* this truth. The separation of truth and justification is fundamental. Including a sourced false claim is reporting a *justified-but-false* proposition; excluding an unsourced true claim reflects a *lack of justification* for including it, despite its truth.
  2.  **Deflationism:** Can *also* accommodate the core practice, but requires careful interpretation. Deflationism holds that "true" is a device for endorsement or generalization ("Snow is white" is true iff snow is white). The practice isn't directly about labelling claims "true" or "false"; it's about *which claims are permitted in the encyclopedia*. The rule "Include X only if verifiable" doesn't *contradict* deflationism; it sets an inclusion *criterion* distinct from endorsing the claim's truth *simpliciter*. The encyclopedia reports "*Source S says P*", not "*P is true*". Reporting "S says P" is a factual claim about S, independent of P's truth value under deflationism. The goal of "accuracy" can be deflated to mean "faithfully reporting what sources say".

  **Where the Theories Diverge (Changes Required):**

  The crucial differences emerge when considering the *motivation* for the practice and the *interpretation* of the goal of "accuracy":

  *   **Under Deflationism:**
      *   **Change in Justification:** The rationale for privileging verifiability couldn't appeal to a *substantive gap* between truth and justification. Instead, the justification would be purely pragmatic and social:
          *   *Neutrality:* Avoiding edit wars based on personal beliefs.
          *   *Accountability:* Allowing readers to check sources.
          *   *Collaboration:* Providing a clear, objective standard for inclusion/exclusion.
          *   *Reliability (Social):* Relying on socially established processes of publishing and vetting sources as the best way to achieve *stable* and *consensual* content.
      *   **Change in "Accuracy":** The goal of "accuracy" *must* be understood **solely** as faithfulness to sources ("This article accurately reports what these sources say"), not as correspondence to an external reality. The deflationist cannot say the encyclopedia aims for "truth" in a substantive sense; it aims for *verifiable reporting*. Claims like "sourced claims are more likely to be true" become problematic unless "true" is used purely deflationarily, meaning simply "P is the case".
      *   **Intelligibility Challenge Addressed:** The rule ("privilege verifiability over truth") *is* intelligible under deflationism *if* "truth" is understood as simply "how things are." The rule means: "Include claims based on whether reliable sources state them, not based on your personal assessment of how things are." This is a rule about evidence and inclusion criteria, not a metaphysical claim about the property "truth". It avoids a category mistake by focusing on the *process* (using evidence) rather than comparing two properties *of the claim itself*.

  *   **Under Robust Correspondence Theory:**
      *   **No Change in Justification Needed:** The rationale aligns perfectly: Truth is a substantive, external standard. Human limitations prevent direct access. Verifiability via reliable sources is the best practical epistemic tool to *approximate* this truth. Including a sourced false claim is an unfortunate error in the tool, not a confusion about truth. Excluding an unsourced true claim highlights the gap between reality and our justificatory methods. Accuracy *can* meaningfully refer to correspondence.
      *   **Potential Change in Practice (Aspirational):** A robust correspondence view *might* encourage a stronger *critical stance* towards sources in the long term, seeing the project as gradually refining its verifiability standards to better track truth. However, the core rule "include verifiable claims, exclude unverifiable ones" remains unchanged, as the *method* is still seen as the best available proxy. The key difference is in the *interpretation* of the gap between the practice's output and reality.

  **Conclusion:**

  1.  **Strict Presupposition:** The practice **requires** the separability of truth and justification (fallibilism). Without this, the core instructions become nonsensical.
  2.  **Underdetermined:** The practice does **not** strictly presuppose either robust correspondence or deflationism about the *nature* of truth. Both can explain the mechanics of the rules and the goal of "accuracy" *within the project's operational framework* (faithfulness to sources).
  3.  **Divergence in Interpretation:**
      *   **Deflationism:** Forces a pragmatic/social justification for verifiability and a purely derivative (reporting-focused) interpretation of "accuracy". The gap between verifiability and truth becomes a gap between *evidence* and *how things are*, without "truth" naming a substantive property.
      *   **Correspondence:** Provides a natural metaphysical rationale (tracking mind-independent reality) and allows "accuracy" to retain a substantive meaning. The gap between verifiability and truth is a real epistemic gap between justification and the world.
  4.  **Intelligibility:** The rule privileging verifiability is **not a category mistake**, even under deflationism. It's a rule about using *evidence* (a property related to our cognitive state and social practices) as the criterion for *inclusion in a knowledge repository*, distinct from a direct assertion about the *truth-value* of the claim. It compares an epistemic criterion to the goal-state ("how things are"), not two properties of the claim itself.

  The encyclopedia's genius lies in its pragmatic epistemology: it leverages social processes of verification to build a stable, accountable, and (hopefully) increasingly reliable representation of established knowledge, while explicitly acknowledging the human limitations inherent in the pursuit of truth. Its implicit theory is fundamentally fallibilist and operational, leaving the deepest metaphysical questions about truth open but practically managed.
