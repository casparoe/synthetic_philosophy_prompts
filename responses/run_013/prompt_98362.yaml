answer: |-
  Here's a practical procedure for your grant committee, designed to handle moral uncertainty within your constraints. It's built on "Moral Uncertainty Multiplism" (MacAskill, Bykvist, Ord) but modified for usability. The core idea: **Elicit each member's credences across moral views, score applications per view using a relative scale, aggregate with expected choiceworthiness, then flag decisive results or hand back close calls for a vote.**

  ---

  ### **Procedure: Moral Uncertainty Grant Assessment (MUGAs)**
  *Total time: 40 minutes per application. Batch processing required (all apps in one term evaluated together).*

  1. **Define Moral Views (Pre-Meeting, 5 mins once per term)**  
     Select 4 views (keep it manageable):  
     - **U: Utilitarianism** (Maximize total welfare)  
     - **P: Prioritarianism** (Maximize welfare, priority to worst-off)  
     - **S: Sufficientarianism** (Ensure people meet basic needs threshold)  
     - **D: Deontology** (Respect rights/duties; constraints on actions)  
     *Why these?* They cover consequentialist/non-consequentialist splits and are intuitive for non-philosophers. Revisit annually.

  2. **Elicit Credences (5 mins per member, at term start)**  
     Each member allocates 100 "credence points" across the 4 views. Allow zeros.  
     *Example:* Member A: U40, P30, S20, D10.  
     *Why not more precision?* Point allocation forces honesty about *relative* confidence without false quantification.

  3. **Assess Applications (15 mins per app)**  
     For each application and view:  
     - **Permissibility Check (Binary: Yes/No):**  
       - If any view deems the act *impermissible* (not just suboptimal), note which one(s).  
     - **Raw Choiceworthiness Score (1–10 scale):**  
       - Score *relative to other apps this term* (e.g., "Bed nets: U=10, Scholarship: U=3").  
       - No need for units; use intuitive comparisons (e.g., "This helps more people" → higher U).  
       - *Why 1–10?* Avoids illusion of precision; forces ordinal judgments.

  4. **Normalize Scores (5 mins, after all apps scored)**  
     - Convert raw scores (1–10) to a 0–100 scale *per view*:  
       `Normalized = 100 × (Raw − Min_raw) / (Max_raw − Min_raw)`  
     - *Why?* Handles incommensurable scales (e.g., U uses welfare units, D uses rights compliance).  
     - *Example:* If raw U scores are [3, 8, 10] → normalized: [0, 71, 100].

  5. **Handle Impermissibility (Threshold: 20% credence)**  
     - Calculate total credence for "impermissible" views per app (sum credences of views vetoing it).  
     - **Reject if >20% total credence supports veto.**  
     - *Why 20%?* Balances respect for minority views against paralysis. Adjustable by committee.

  6. **Aggregate Expected Choiceworthiness (5 mins per app)**  
     For each application:  
     - **Per member:** `EC_m = Σ [Credence_v × Normalized_v]`  
     - **Group score:** Average `EC_m` across all members.  
     - *Why not "maximize expected choiceworthiness"?* Avoids false precision; we use scores comparatively.

  7. **Decide or Delegate**  
     - Fund apps in descending group-score order until budget exhausted.  
     - **Delegate to vote if:**  
       - Two apps differ by <10 EC points *and* budget forces a choice between them.  
       - Impermissibility veto threshold is triggered (20–30% credence).  
     - *Why delegate?* EC scores <10 apart are noise, not signal. Values take over.

  ---

  ### **End-to-End Run: Three Applications**
  Assume:  
  - 5 members (credences averaged for simplicity): U30, P25, S25, D20  
  - Costs: Clinic (£2k), Scholarship (£3k), Bed nets (£1k); Budget £3k  
  - Raw scores (1–10) from committee discussion:

  | View          | Clinic (a) | Scholarship (b) | Bed nets (c) |
  |---------------|------------|-----------------|--------------|
  | **U**         | 5          | 3               | 10           |
  | **P**         | 8          | 6               | 9            |
  | **S**         | 7          | 4               | 10           |
  | **D**         | 7          | 9               | 6            |
  | **Permissible?**| Yes       | Yes             | Yes          |

  #### **Step 4: Normalize to 0–100 per View**
  - **U:** Min=3 (Scholarship), Max=10 (Bed nets)  
    Clinic: `100 × (5−3)/(10−3) = 29`  
    Scholarship: `0`  
    Bed nets: `100`  
  - **P:** Min=6, Max=9 → Clinic: `67`, Scholarship: `0`, Bed nets: `100`  
  - **S:** Min=4, Max=10 → Clinic: `50`, Scholarship: `0`, Bed nets: `100`  
  - **D:** Min=6, Max=9 → Clinic: `33`, Scholarship: `100`, Bed nets: `0`  

  #### **Step 6: Expected Choiceworthiness (EC)**
  - **Clinic:**  
    `EC = (0.30×29) + (0.25×67) + (0.25×50) + (0.20×33) = 43.4`  
  - **Scholarship:**  
    `EC = (0.30×0) + (0.25×0) + (0.25×0) + (0.20×100) = 20.0`  
  - **Bed nets:**  
    `EC = (0.30×100) + (0.25×100) + (0.25×100) + (0.20×0) = 80.0`  

  #### **Result:**  
  - Group scores: **Bed nets (80) > Clinic (43) > Scholarship (20)**  
  - Fund **Bed nets (£1k) + Clinic (£2k)** = £3k total. Scholarship rejected.  
  - **Emotional attachment defeated:** Committee likely favors Scholarship (local impact), but it scored lowest.  
    - **Crucial step:** Normalization made Scholarship's low consequentialist scores (U/P/S) decisive. D's high score couldn't compensate due to low credence (20%).  

  ---

  ### **Failure Modes & Mitigations**
  1. **Garbage-in-garbage-out quantification:**  
     - Raw scores (1–10) are subjective. *Mitigation:* Use discussion to calibrate (e.g., "If bed nets=10, clinic=?").  
     - **Never** use EC scores >10 apart as "objective"; treat as informed input to voting.

  2. **Unstable credences:**  
     - If a member's credences shift between meetings, rerun their EC *if time allows*. Else, use original. Moral uncertainty is dynamic; accept fluidity.

  3. **Ties or near-ties in EC:**  
     - If two apps have EC difference <10 points, **delegate to vote** immediately. Aggregation is a tool, not a substitute for judgment.

  4. **Veto threshold arbitrariness:**  
     - 20% impermissibility credence is a value choice. *Defense:* Prevents minority tyranny (5% credence) while respecting strong objections.

  ---

  ### **Honest Accounting: Machinery vs. Values**
  - **Machinery (procedural):**  
    - Credence aggregation, EC math, normalization.  
    - Flagging close calls for voting.  
  - **Values (substantive):**  
    - Choosing the 4 moral views.  
    - Setting veto threshold (20%).  
    - Raw scoring (inherently value-laden).  
  - **No false costumes:** The formula doesn't "decide." It synthesizes inputs, then **surfaces where values legitimately clash** (e.g., Scholarship's low score reveals committee prioritizes scale/need over locality).

  ---

  ### **Why This Works for Your Committee**
  - Fits 40 mins: Pre-meeting work (views, credences) + structured discussion.  
  - Avoids false precision: Uses ranges, delegates close calls.  
  - Chair-friendly: Explicitly rejects "determinative" outputs when uncertain.  
  - Updatable: Revisit views/credences annually or as new theories emerge.  

  This system won't resolve moral disagreement, but it **makes disagreement productive**. When the Scholarship lost, it wasn't because of math—it was because your committee, on balance, cared more about helping many high-need people (Bed nets/Clinic) than one local student. The procedure just made that transparent.
