  - There's an underlying epistemological concern about falsifiability and circular reasoning
  - They're implicitly seeking intellectual leverage in workplace debates
  - The software engineering background suggests they'll appreciate structured, testable criteria

  The user has already done impressive homework by compiling candidate requirements. My job is to:
  1) Validate which are genuine requirements vs optional features
  2) Add missing critical tests
  3) Highlight irreconcilable tensions
  4) Provide a decision tree for evaluating any signalling claim

  Key philosophical tensions I must address:
  - The theory must explain honesty without presupposing it
  - Must accommodate both costly and cost-free honest signals
  - Can't collapse the distinction between signal function and incidental cues
  - Must allow for deception while explaining why it's not ubiquitous

  The biggest challenge will be Requirement 8 (falsifiability) since signalling theories are notoriously flexible. I'll need to provide concrete falsification conditions beyond "find a cheap signal" which some theories explicitly allow.

  For the comparative evaluation at the end, I'll focus on:
  - Zahavi's original handicap principle (cost-as-requirement)
  - Grafen's game-theoretic model (cost-as-conditional)
  - Index signals (cost-as-optional)

  The knockout test will be Requirement 8 - any theory that can't specify falsification conditions fails immediately regardless of other merits. This addresses the user's core frustration with unfalsifiable just-so stories.
answer: |-
  Below is a specification of **desiderata for an adequate theory of honest signalling**, framed as **empirically testable criteria** to evaluate proposed explanations. Each item is a test to distinguish substantive hypotheses from circular redescriptions of cost. Requirements derive from foundational biological phenomena, logical constraints, or empirical challenges that render weaker theories inadequate. Spurious demands (often misattributed to signalling theory) are flagged.  

  ---

  ### **Core Desiderata: Tests for an Adequate Theory**  
  *Phrased as litmus tests for any proposed signalling explanation.*  

  1. **Signal-vs-Cue Distinction Test**  
     - **Test**: *Does the explanation specify how the trait evolved* ***because*** *receivers’ responses altered the signaller’s fitness?*  
     - **Requirement**: Essential to avoid conflating signals (shaped by selection for communication) with cues (incidental information). A theory collapsing this distinction fails to explain communication’s evolution.  
     - **Case forcing it**: E.g., body size (a cue in predation, but a signal in mate choice if amplified by selection for assessment).  

  2. **Cost-Free Honesty Test**  
     - **Test**: *Can the theory explain honesty in signals that are* ***cheap to produce*** *yet unfakeable by low-quality signallers?*  
     - **Requirement**: Mandatory to accommodate "index signals" (e.g., vocal pitch tied to testosterone). Denying this ignores honest signals maintained by physical constraints, not cost.  
     - **Case forcing it**: Frog vocalizations: Low-frequency calls require large body size (physically constrained), not costly production.  

  3. **Conflict-of-Interest Gradient Test**  
     - **Test**: *Does the theory predict signal honesty across a spectrum: from* ***zero conflict*** *(e.g., parent-offspring) to* ***high conflict*** *(e.g., rivals)?*  
     - **Requirement**: Honesty mechanisms must vary with incentive alignment. A theory requiring high conflict for all honesty is falsified by mutualistic signalling.  
     - **Case forcing it**: Bee dances (near-zero conflict: honest, cheap) vs. peacock tails (high conflict: costly).  

  4. **Assessment-Only Trait Test**  
     - **Test**: *Can the theory accommodate traits whose* ***sole function*** *is to make hidden qualities easier to assess, even if metabolically "wasteful"?*  
     - **Requirement**: Necessary to explain signals like antler asymmetry (no survival benefit, purely for assessment). Without this, "cost" becomes tautological.  
     - **Case forcing it**: Gazette stotting: No predator-deterrent effect; only function is to signal stamina to predators.  

  5. **Receiver-Enforced Honesty Test**  
     - **Test**: *Does the theory allow for signals kept honest by* ***receiver retaliation*** *(e.g., punishment, avoidance) rather than production costs?*  
     - **Requirement**: Crucial to explain deception-prone contexts (e.g., human markets). A theory demanding intrinsic costs ignores social enforcement.  
     - **Case forcing it**: Bluffer birds invading territories are attacked if caught cheating; cost is imposed *after* signalling.  

  6. **Deception and Mimicry Test**  
     - **Test**: *Can the theory explain* ***why deception is rare*** *in some systems but common in others, without denying its existence?*  
     - **Requirement**: Must account for empirical reality (e.g., harmless snakes mimicking venomous patterns). A theory where signals are *always* honest is falsified.  
     - **Case forcing it**: Orchids deceiving wasps with fake pheromones: Exploits receiver preferences without signalling quality.  

  7. **Multiple Audiences Test**  
     - **Test**: *Does the explanation address how signals can* ***simultaneously target receivers with conflicting interests*** *(e.g., attracting mates while deterring predators)?*  
     - **Requirement**: Most signals face trade-offs (e.g., bright plumage attracts mates but also predators). Ignoring this oversimplifies signal evolution.  
     - **Case forcing it**: Guppy coloration: Attractive to females but conspicuous to predators; cost/benefit depends on context.  

  8. **Falsifiability Test**  
     - **Test**: *Does the hypothesis specify* ***observable conditions under which it would be false***? (e.g., "If low-quality signallers produce the trait at similar cost/quality as high-quality, the signal is not honest").  
     - **Requirement**: Non-negotiable. Without this, "costly = signal" is circular. Must predict when a trait *cannot* be a signal.  
     - **Case forcing it**: Luxury goods: If knockoffs are indistinguishable yet not valued less, "cost" alone doesn’t explain signalling.  

  ---

  ### **Spurious or Optional Demands**  
  *Commonly misattributed to signalling theory but not core requirements:*  
  - **Empirical challenges to textbook cases** (e.g., peacock tails): These are tests *for the theory*, not flaws *of the theory*. A good framework must survive scrutiny but need not defend every example.  
  - **Analogies to human behavior** (e.g., conspicuous consumption): Useful illustrations, but human cultural complexity introduces confounding variables. Not a validity test.  
  - **Demanding universal cost-based honesty**: Contradicts Requirement 2 (index signals). Cost is one mechanism, not the definition of signalling.  

  ---

  ### **Tensions and Knockout Test**  
  - **Key tension**: Requirement 2 (cost-free honesty) vs. Requirement 5 (receiver-enforced honesty). Index signals (physically constrained) need no receiver vigilance; social signals do.  
  - **Resolution**: Pluralism. Different mechanisms (indexes, handicaps, social punishment) maintain honesty across contexts. "Cost" is reductive.  
  - **Knockout Test**: **Requirement 8 (Falsifiability)**. Eliminates theories that redescribe *any* costly trait as signalling post hoc. A theory failing this test is pseudoscientific.  

  ---

  ### **Brief Evaluation of Major Frameworks**  
  1. **Zahavi’s Handicap Principle** (original):  
     - Fails Tests 2 (cost-free honesty), 3 (zero-conflict cases), and 5 (receiver enforcement). Reduces all signalling to cost.  
  2. **Grafen’s Game-Theoretic Model** (formal handicap):  
     - Passes Tests 3–8 but fails Test 2 (assumes cost is necessary for honesty in conflicts). Struggles with index signals.  
  3. **Index-Signal Accounts** (e.g., Maynard Smith, Harper):  
     - Passes Tests 1–4, 6–8 but fails Test 5 (no mechanism for receiver-enforced honesty without physical constraints).  

  **Verdict**: No single framework satisfies all tests. A pluralistic theory (combining indexes, conditional handicaps, and receiver sanctions) is necessary, at the cost of parsimony.  

  ---

  ### **Summary Deliverable: The Decision Checklist**  
  To evaluate a proposed "costly signalling" explanation for a trait, ask:  
  1. Is the trait a *signal* (shaped by receiver responses) or a *cue*?  
  2. Could the signal be honest *without being costly*?  
  3. Do signaller/receiver interests conflict? If not, why is cost needed?  
  4. Does the trait *only* aid assessment?  
  5. Could honesty rely on *receiver punishment* rather than production costs?  
  6. How does the system *prevent or permit deception*?  
  7. Does the trait face trade-offs across *multiple audiences*?  
  8. What evidence would *falsify* the hypothesis?  

  **Failure on any test** suggests the explanation is incomplete or circular. **Failure on Test 8** renders it unscientific.
