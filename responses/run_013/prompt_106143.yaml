prompt: |-
  Im TAing a grad seminar on the boundary problem and I want to rehearse the side I actually believe, so play the other one for me. You're a committed defender of the all-affected-interests principle: anyone whose interests are significantly affected by a collective decision should get a say in making it, regardless of citizenship or residence. Be sharp, not a strawman, give me your best resources, concede small points if I earn them but never the main one, one paragraph per reply, stay in character until I say stop. My opening move: I hold the coercion principle instead -- the demos is whoever is subject to the state's binding, non-optional rules -- and I think yours either swallows the whole world (a tariff in Ohio shifts demand and a garment worker in Dhaka is affected, so she's in, and so is basically everyone) or you quietly smuggle in a seriousness threshold, and then the threshold is doing all the work while the principle does none. To make it concrete: a country builds a dam upstream and a town across the border downstream loses its water. Under your principle those people are in the demos. Are they voting in our elections, or are you just using "affected" to mean something weaker than a say?
reasoning: |-
  Okay, the user is a TA for a grad seminar on the boundary problem and wants to rehearse their side by having me play the committed defender of the all-affected principle. They've presented their opening move favoring the coercion principle, arguing that the all-affected principle either includes everyone globally or relies on a seriousness threshold that undermines the principle itself. They used the dam example to challenge whether "affected" truly implies voting rights.

  Hmm, the user's scenario is interesting - they're preparing for academic debate by steelmanning the opposition. Their coercion principle focuses on direct subjection to state power, while they see the all-affected principle as overbroad. The dam example is clever because it creates tension between theoretical inclusivity and practical implementation.

  I need to craft a sharp response that:
  - Reframes "affected interests" as distinct from mere ripple effects
  - Distinguishes between causal influence and normative claims
  - Addresses the threshold concern without conceding the principle's core
  - Offer institutional solutions beyond simple voting rights
  - Cite relevant political theorists like Goodin

  The key is to acknowledge the practical challenge while maintaining that the normative core remains intact - the threshold operationalizes the principle rather than replacing it. For the dam case, I should insist on formal inclusion mechanisms while distinguishing from Dhaka's "butterfly effect" scenario.

  This user clearly knows the literature well - that "smuggle in a seriousness threshold" line shows familiarity with standard critiques. My response needs academic rigor with real citations, not just rhetoric. The Robert Goodin reference will lend credibility since he's central to this debate.

  I should avoid letting the coercion principle frame dominate - need to recenter on how all-affected handles power asymmetries that coercion misses, like the downstream town's vulnerability. The institutional pluralism point (voting vs. other voice mechanisms) might be my strongest counter to the "are they voting?" challenge.
answer: |-
  You've hit the coercion principle's fatal flaw: it sanctifies existing power structures while ignoring their unjust externalities. Your dam example proves my point perfectly. The state coercively *imposes* drought on the downstream town—destroying livelihoods, health, and community—yet you'd deny them voice because they aren't "subject" to the upstream state's *domestic* laws? That's arbitrary exclusion masking domination. The all-affected principle *demands* their formal inclusion in the dam decision precisely because the harm is severe, direct, and non-reciprocal—unlike Dhaka's diffuse market ripple (which fails Robert Goodin's test of "specificity and intensity" in *Enfranchising All Affected Interests*). Yes, we operationalize thresholds (e.g., Dryzek's "enforceable impact"), but they derive from the principle: *significance* of harm defines the right to redress, not your map-drawn coercion lines that let powerful states export suffering. For the downstream town? Joint tribunals, special electorate rolls, or veto powers—institutional creativity solves implementation; your principle *justifies* their disenfranchisement.  

  *(Holding character: ready for your rebuttal.)*
