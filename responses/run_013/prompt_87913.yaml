  First, I need to recall the core distinctions: having a disposition isn't the same as manifesting it. Also, a disposition isn't just a counterfactual, and it's different from its categorical basis. The user mentioned finkish cases, masking, mimicking—those are classic problems from Martin, Bird, etc. 

  For their first custom case: a disposition exhausted by one use, like a single-use battery. The theory must explain its presence before and absence after without conflating it with a liability. The second case is a disposition that can't manifest due to no stimulus, like a key that fits a lock that doesn't exist. How can a theory ascribe such a disposition meaningfully?

  Then, deeper needs: the user wants to prevent vacuity/circularity, ensure physical realizability, and allow dispositions to do causal/explanatory work. They also want requirements sorted into non-negotiable vs. contested, and to identify incompatible desiderata. The key is figuring out which requirement makes simple conditional analysis fail—probably the Intrinsicality requirement.

  For exhaustible dispositions, I need to consider if theories treat it as one disposition or a composite. For unmanifestable, how to ground the ascription without stimulus. Physical realizability means no spooky properties; explanatory role to avoid epiphenomenalism. Avoiding circularity is crucial—dispositions can't be defined solely by other dispositions.

  Now, structuring the desiderata. Start with core distinctions, then phenomena explanations, then their custom cases, and the deeper requirements. Group non-negotiable vs. contested. Non-negotiables include Modal Independence, Intrinsicality, Basis-Distinction, etc. Contested might be Reduction and Dispositional Essentialism.

  Incompatibilities: For example, Intrinsicality conflicts with Reductionist approaches because conditional analyses rely on extrinsic factors. Also, Physical Realizability might clash with Dispositional Essentialism if the latter posits primitive dispositions. The user cares most about which requirement breaks simple conditional analysis—Intrinsicality, due to finkish cases showing dispositions are intrinsic but conditional responses aren't.

  Also, the user's deeper need is to map the philosophical landscape for their seminar, understanding where theories fail and what trade-offs exist. They might be preparing for debates or a paper, so clarity on conflicts is essential. Ensuring each requirement has a motivating case and clear argument for incompatibilities without just asserting them.
answer: |-
  Here is a comprehensive specification of desiderata for a theory of disposition ascription, incorporating your requirements and structured as requested. The core tension centers on **Intrinsicality** as the primary defeater of simple conditional analysis.

  ### I. Core Distinctions (Non-Negotiable Conceptual Frameworks)
  A theory **must not collapse** these distinctions:

  1.  **Possession vs. Manifestation:**
      *   *Motivating Case:* A sugar cube is soluble even when not dissolving. A pane of glass is brittle even when intact. Irascibility exists as a trait even in moments of calm.
      *   *Requirement:* The theory must distinguish the state *of having* a disposition from the occurrence of its characteristic manifestation event.

  2.  **Disposition vs. Associated Counterfactual:**
      *   *Motivating Case:* Finkish/masking/mimicking cases (detailed below) show that the truth value of "If S were the case, M would be the case" can diverge from the actual presence/absence of the disposition (D).
      *   *Requirement:* The theory must explain why D is *not* simply identical to or analyzable as the truth of the associated stimulus-manifestation counterfactual conditional.

  3.  **Disposition vs. Categorical Basis:**
      *   *Motivating Case:* The same disposition (e.g., brittleness) can be realized by different microstructures (amorphous glass vs. crystalline quartz); conversely, the same microstructure might ground different dispositions in different contexts.
      *   *Requirement:* The theory must distinguish the disposition *ascribed* (e.g., "brittle") from the underlying physical state or property that serves as its realizer or basis.

  ### II. Phenomena to be Explained (Non-Negotiable Explananda)
  A theory **must account for** these problematic cases:

  4.  **Finkish Dispositions (Loss):**
      *   *Case:* A sorcerer is watching a fragile glass. If the glass were struck, the sorcerer would instantly cast a spell making it non-fragile *before* the blow lands. The glass *is* fragile (has the disposition), but if struck, it would not break (manifestation does not occur).
      *   *Requirement:* Explain how the disposition can be present yet the associated counterfactual ("If struck, it would break") is false *because* the stimulus removes the disposition.

  5.  **Finkish Absences (Acquisition):**
      *   *Case:* A sorcerer is watching a non-fragile, reinforced glass. If the glass were struck, the sorcerer would instantly cast a spell making it fragile *before* the blow lands. The glass *is not* fragile, but if struck, it would break.
      *   *Requirement:* Explain how the disposition can be absent yet the associated counterfactual is true *because* the stimulus creates the disposition.

  6.  **Masking:**
      *   *Case:* A fragile glass is securely encased in shock-absorbing packing foam. It is struck forcefully (stimulus present), is fragile (disposition present), but does not break (manifestation absent) because the foam absorbs the impact.
      *   *Requirement:* Explain how the disposition and stimulus can be present yet the manifestation is prevented by an external interferer.

  7.  **Antidotes / Mimicking:**
      *   *Case (Antidote):* A poisonous snake bites (stimulus for lethality), the victim has the poison in their system (disposition present), but they survive because a fast-acting antidote neutralizes the poison (manifestation absent).
      *   *Case (Mimicking):* A non-fragile, ductile object (e.g., rubber ball) is rigged with explosives. When struck, the explosives detonate, shattering the ball. The object *lacks* fragility (disposition absent), stimulus occurs, but manifestation (shattering) occurs due to the mimic.
      *   *Requirement:* Explain how the manifestation can occur in the absence of the disposition (mimicking), and how the manifestation can fail to occur despite the disposition and stimulus being present (antidote).

  8.  **Exhaustible Dispositions (Your Case 1):**
      *   *Case:* A "one-shot" battery has the disposition to power a device for exactly one cycle. Before use, the disposition is clearly present. After a single full discharge, the disposition is genuinely gone – it cannot power the device again. The battery's physical structure irreversibly changes during discharge.
      *   *Requirement:* Explain how the disposition is genuinely present prior to manifestation, genuinely absent afterward, and whether this is best understood as *one* disposition with a built-in "exhaustion clause" or as a disposition *plus* a separate liability to lose it upon manifestation. Avoid collapsing exhaustion into mere manifestation.

  9.  **Unmanifestable Dispositions (Your Case 2):**
      *   *Case:* A key is meticulously crafted to perfectly fit a unique lock that was destroyed immediately after the key was made and before the key could ever be used. Nothing else in the world could possibly accept this key as a stimulus for opening. We still want to say the key *has the disposition* to open that specific lock.
      *   *Requirement:* Explain how we can meaningfully ascribe a disposition (possess it as a real property) even when the specific stimulus required for its manifestation is *impossible* (or nomologically impossible) to occur in the actual world. Avoid making disposition ascription vacuously true or dependent on impossible worlds in a trivializing way.

  ### III. Foundational Requirements (Non-Negotiable Constraints)
  A theory **must satisfy** these general constraints:

  10. **Physical Realizability:**
      *   *Motivating Case:* Dispositions like solubility or brittleness aren't spooky additions; they must be grounded in the actual physical constitution of the object (its "categorical basis" - see Distinction 3). We need to explain *how* the microstructure *makes* the object soluble/brittle.
      *   *Requirement:* The theory must be compatible with the object's disposition being realized by its non-dispositional, physical properties/structure. Dispositions cannot be "bare" or float free of the physical world.

  11. **Explanatory/Causal Potency:**
      *   *Motivating Case:* We cite fragility to explain why the glass broke *when struck*, solubility to explain why the salt dissolved *in water*. We expect dispositions to play a role in causal chains leading to manifestations.
      *   *Requirement:* The theory must allow dispositions to be genuine contributors to causal explanations and/or causal processes. Dispositions cannot be epiphenomenal or mere labels for regularities; they must "do work".

  12. **Non-Vacuity / Non-Circularity:**
      *   *Motivating Case:* Defining "soluble" as "having the disposition to dissolve" is vacuous. Defining it solely in terms of other dispositions (e.g., "having a molecular structure disposed to dissociate in water") risks regress or circularity.
      *   *Requirement:* The theory must provide a substantive account of disposition possession that avoids trivial circularity (defining D as D) and minimizes problematic regress (defining D only in terms of other dispositions D1, D2, ...). Grounding in non-dispositional properties (see 10) is key.

  13. **Intrinsicality (Contested - see IV.B, but crucial):**
      *   *Motivating Case:* Finkish cases (4 & 5) show that the presence/absence of a disposition like fragility seems to depend *only* on the object's intrinsic properties at the time. The sorcerer's *extrinsic* intervention changes the counterfactual, but not the intrinsic disposition *before* the stimulus.
      *   *Requirement:* The theory must capture the intuition that dispositions like fragility, solubility, etc., are primarily intrinsic properties of objects – they depend on how the object *is*, not on what external agents or circumstances *might* do to it *at the moment of stimulus*. (This is the primary defeater of simple conditional analysis).

  ### IV. Sorting Requirements: Non-Negotiable vs. Contested

  *   **Non-Negotiable:** Distinctions (1, 2, 3), Explananda (4, 5, 6, 7, 8, 9), Foundational Constraints (10, 11, 12).
      *   *Rationale:* These define the core phenomena, conceptual boundaries, and minimal constraints any adequate theory must address to be taken seriously. Failing on these renders the theory descriptively inadequate or incoherent.
  *   **Contested (Reflective of Camp Preferences):**
      *   **13. Intrinsicality:** *Central Conflict Point.*
          *   **Reductive Conditional Analysist (RCA):** Tends to reject strict intrinsicality as a requirement, as their analysis is inherently extrinsic (dependent on what *would* happen in stimulus conditions, which can be affected by extrinsic finks/masks). They might weaken it or argue dispositions *aren't* always intrinsic.
          *   **Dispositional Essentialist (DE):** Embraces intrinsicality. Dispositions (powers) are fundamental, intrinsic properties of objects/properties. The categorical basis *is* (or is constituted by) the disposition.
          *   **Categoricalist (Cat):** Embraces intrinsicality. Dispositions are *reducible* to intrinsic categorical properties (the basis). The disposition itself is not a fundamental existent, but the basis is intrinsic.
      *   **Reduction (Implied by 10 & 12):**
          *   **RCA:** Aims for reduction to counterfactuals (though this fails on intrinsicality/finks).
          *   **DE:** Rejects reduction. Dispositions are irreducible fundamental properties.
          *   **Cat:** Aims for reduction to non-dispositional categorical properties.
      *   **Role of Counterfactuals:**
          *   **RCA:** Counterfactuals are constitutive of dispositions (Identity claim, rejected by Distinction 2).
          *   **DE/Cat:** Counterfactuals are typically *true* of dispositions (when no finks/masks), but are *symptoms* or *consequences* of the disposition + laws/basis, not constitutive of it.

  ### V. Incompatibilities and Key Defeater

  *   **Primary Incompatibility: Intrinsicality (13) vs. Simple Conditional Analysis (RCA Core):**
      *   *Argument:* Simple Conditional Analysis (SCA: x is D iff if S were the case, M would be the case) is *extrinsic*. The truth of the counterfactual depends on the entire stimulus situation, including possible extrinsic interferers (sorcerers, packers, antidotes). Finkish cases (4 & 5) demonstrate that the intrinsic disposition (fragility) can exist while the SCA counterfactual is false (Loss Fink), and vice versa (Acquisition Fink). Therefore, SCA cannot satisfy the Intrinsicality requirement. Since Intrinsicality captures a core intuition strongly supported by these cases, SCA is fatally flawed. **Intrinsicality (13) is the single requirement doing the most to rule out simple conditional analysis.**
  *   **Other Potential Tensions:**
      *   **Unmanifestable Dispositions (9) vs. Strong Manifestation Requirement:** Some views might insist a disposition *must* be capable of manifesting to be real. Satisfying (9) requires rejecting such a strong requirement, allowing dispositions grounded in intrinsic structure even if the specific stimulus is impossible.
      *   **Physical Realizability (10) & Non-Circularity (12) vs. Dispositional Essentialism (DE):** Critics argue DE struggles to explain *how* irreducible dispositions are physically realized without circularity ("The object dissolves because it has the disposition to dissolve, which is fundamental") or regress ("The fundamental particle has the power to manifest power P1 when interacting with power P2...").
      *   **Exhaustible Dispositions (8) vs. Permanent Identity:** Some views might tie a disposition too tightly to a permanent underlying basis. Explaining how the basis *changes* (exhaustion) upon manifestation is crucial.
      *   **Explanatory Potency (11) vs. Epiphenomenalism Concerns:** Any theory that makes dispositions merely "labels" for regularities (a charge against some RCA/Cat views) or reducible to bases that don't obviously cause manifestations (a charge against Cat) struggles with (11). DE often claims strength here, seeing powers as direct causes.

  This specification provides the necessary framework for evaluating competing theories of dispositions based on their ability to handle the core distinctions, problematic cases (standard and your additions), and foundational constraints, while highlighting the central role of **Intrinsicality** in defeating simple conditional analysis and the key areas of contention between major philosophical camps.
