  First, I need to map the German auction to the dollar auction framework. The auctioneer is the German government, the prize is the spectrum blocks. But unlike the dollar auction, losers don’t pay anything here. That’s a critical difference. The user is questioning why bidding escalated without the runner-up penalty. I should explain that while the sunk costs (like due diligence) exist, the main driver was the fear of exclusion in a limited license scenario. Bidders weren’t just bidding to win but also to reduce competition, which isn’t part of the classic dollar auction.

