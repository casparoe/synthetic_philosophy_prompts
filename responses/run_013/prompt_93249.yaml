prompt: |-
  I am trying to work out what I believe about what wealthy countries owe to poorer ones, and I would like you to tell me what principle, or small set of principles, best fits the verdicts I record below. The cases are constructed rather than drawn from the news, so please treat the stipulated facts as fixed and do not worry whether they resemble any actual country.

  My verdicts:

  1. Norland is a wealthy, high-emitting industrial country. Its emissions have submerged the coastal farmland of Corallia, a small island state. I think Norland owes Corallia compensation, and owes it to Corallia as a political community, not merely to the individual Corallians who happen to have been harmed. The claim feels very strong.

  2. Norland caused no harm whatever to Bakhara, where a drought has produced a famine. I think Norland owes famine relief there, but the claim feels weaker than in (1), and I have the sense that it is owed by whichever wealthy countries can meet it, rather than by Norland in particular.

  3. Bakhara's government would divert roughly 60 per cent of any general budget support to patronage and armaments. I think Norland still owes something to the Bakharan poor, but not in the form of budget support; vaccines delivered directly, and cash to identifiable households, seem to me owed, whereas a cheque to the treasury does not.

  4. Suppose Bakhara's health ministry had already decided, and budgeted, to run a vaccination campaign. I think Norland's paying for that same campaign discharges very little of its obligation, because the ministry will simply spend the money it saved on something else. The aid has to add something that would not otherwise have happened.

  5. A scheme under which Norland sends its own doctors to staff Bakharani clinics, undercutting the salaries and training posts of local physicians, seems to me not owed at all, and arguably a wrong, even though it would save lives in the short run.

  6. I think Norland may legitimately spend a given sum on its own moderately badly off citizens rather than on more urgent needs in Bakhara. It need not treat a Bakharan life as worth exactly as much as a Norlandic one in its budget.

  7. A country that is very wealthy in aggregate but contains a large poor population of its own owes much less, in my view, than a smaller and more equal country of the same total wealth.

  8. I do not think the obligations here fall on wealthy individuals as such. A Norlandic billionaire and a Bakharani billionaire seem to me to owe nothing of this kind; it is states, and the political communities they represent, that owe.

  The tentative principle I have been running is this: a country owes aid in proportion to (a) the harm it has caused and (b) its capacity to help, measured net of the unmet basic needs of its own people; the obligation is owed to persons rather than to governments; and it is strongest where the beneficiaries can be identified.

  Please tell me what this principle captures, what it cannot, and what the least revision is that would fit the whole set. I am particularly interested in whether the difference in strength between (1) and (2) is doing any work, whether clauses (3) to (5) can be derived rather than bolted on, and how much of (6) and (7) I would have to give up.

  Then apply the repaired principle to a case I have not listed: Norland owes compensation under (1) to the Corallians, but the only body able to receive and disburse it is a Corallian government that is itself oppressive to a minority. Does the repaired principle direct Norland to bypass the government, to pay it anyway, or to hold the money back, and which of my eight verdicts does that answer force me to abandon?

  Answer in British English.
reasoning: |-
  Okay, the user is developing their ethical framework on what wealthy countries owe to poorer ones through hypothetical scenarios. They've presented eight verdicts and a tentative principle, asking for analysis and refinement. 

  First, let's unpack what they're really after. They're clearly intellectually rigorous - constructing precise thought experiments shows they want systemic coherence, not just political opinions. The depth of their verdicts suggests prior engagement with development ethics or political philosophy. Their request for "least revision" indicates they value parsimony in principles.

  Looking at their tentative principle: harm + capacity, targeting persons not governments, with identifiability strengthening obligations. It handles verdict 1 well (direct harm) and verdict 2's weaker claim (no harm = lower obligation). But clashes emerge:

  Verdict 3-5 demand agency sensitivity - they won't fund corrupt governments but insist on additionality. Their principle doesn't address implementation constraints. Verdict 6-7 introduce domestic priority and aggregate vs per capita capacity - their "net of unmet needs" touches this but insufficiently. Verdict 8's state-centric view contradicts targeting "persons" in their principle.

  The compensation case with oppressive Corallia exposes this tension. If obligations are to persons but must go through states, what when states oppress those persons? Their verdict 3 suggests bypassing government, but verdict 4's additionality requirement might conflict if the minority's needs were already budgeted.

  Biggest insight: their verdicts reveal two distinct obligation types - compensatory (harm-based, agent-specific) and distributive (capacity-based, collective). The strength difference between 1 and 2 isn't just degree but kind. This dual foundation better explains why Norland specifically owes Corallia but any wealthy state owes Bakhara.

  For minimal revision: keep harm + capacity but split into distinct principles. Add agency constraints for implementation. Define capacity as per capita post-domestic-needs. Specify obligations reside with states (aligning with verdict 8) while beneficiaries are persons. This saves all verdicts except possibly requiring minor tweak to verdict 6's "moderately badly off" - needs clearer threshold.

  The oppressive Corallia case then resolves: compensatory obligation remains to Corallian persons, but delivery must avoid enabling oppression (verdict 3 precedent). Bypass government if feasible without harm; if not, hold funds while seeking alternatives. Only if minority's needs are already met would verdict 4 block payment - but compensatory justice likely overrides this.
answer: |-
  Based on your eight verdicts, your tentative principle captures significant ground but requires refinement to fully align with your intuitions. Here's an analysis and a proposed revised principle:

  **What Your Principle Captures Well:**
  *   **(a) Harm:** Explains the strong, specific obligation in (1) (Norland to Corallia) versus the weaker, general obligation in (2) (any wealthy country to Bakhara). The difference in strength *is* doing crucial work, distinguishing compensatory justice from distributive justice.
  *   **(b) Capacity:** Explains why wealthy nations bear obligations (verdicts 1, 2, 3, 6, 7) and why aggregate wealth matters less than wealth relative to domestic need (verdict 7).
  *   **Beneficiaries are Persons:** Directly supports verdicts 3 (aid to poor, not govt), 4 (additionality required), and 5 (harm to local capacity is wrong). It rejects aid that merely displaces local effort or harms local systems.
  *   **Identifiability Strengthens:** Explains the preference in verdict 3 for direct delivery/cash over budget support.

  **Where Your Principle Falls Short / Requires Derivation:**
  1.  **Dual Foundations:** Your principle implies harm and capacity are additive factors within a *single* obligation. Verdicts 1 and 2 suggest two *distinct* bases:
      *   **Compensatory Justice (Harm-Based):** Strong, agent-specific obligation (Norland to Corallia).
      *   **Distributive Justice (Capacity-Based):** Weaker, collective obligation ("whichever wealthy countries" to Bakhara).
  2.  **Implementation Constraints (Agency):** Your principle targets persons but doesn't inherently generate verdicts 3, 4, and 5. These require a derived **"Do No Harm / Effectiveness Constraint"**: Obligations must be fulfilled in ways that:
      *   Avoid enabling bad governance or harm (verdict 3 - no budget support to corrupt govt).
      *   Ensure additionality (verdict 4 - aid must create new benefit).
      *   Avoid undermining local capacity/systems (verdict 5 - no undercutting local doctors).
  3.  **Domestic Priority (Scope & Measurement):** Your "net of unmet basic needs" clause captures verdict 6 (prioritising own moderately badly off) and verdict 7 (wealthy-but-poor-population owes less). However, it needs clarification:
      *   **Scope:** The obligation is *mitigated* but not *eliminated* by domestic need (verdict 6: Norland *may* spend on own citizens, implying it still owes *some* to Bakhara).
      *   **Measurement:** "Capacity" must be understood as **per capita capacity after meeting a threshold of domestic basic needs**. Verdict 7 shows it's not just aggregate wealth, but wealth relative to population size *and* the cost of securing basic needs domestically. A large, wealthy country with massive inequality has less *surplus capacity per capita* than a smaller, equally wealthy but more equal country.
  4.  **Duty-Bearers:** Verdict 8 explicitly states obligations fall on *states/political communities*, not wealthy individuals *as such*. Your principle's reference to "a country" aligns here, but the "persons" as beneficiaries needs careful distinction from duty-bearers.

  **Revised Principle (Minimal Revision):**

  "A state owes obligations to persons in other states based on two distinct foundations:

  1.  **Compensatory Justice:** A state owes significant, specific compensation to persons it has harmed, proportional to the harm caused.
  2.  **Distributive Justice:** All states with **surplus capacity** (wealth per capita above the level required to meet the basic needs of their own population) owe a general obligation to contribute to meeting the basic needs of persons elsewhere, proportional to their surplus capacity.

  *   **Fulfilment Constraint:** These obligations must be fulfilled in ways that:
      *   Are effective and ensure **additionality** (provide benefits that would not otherwise occur).
      *   **Avoid causing harm or undermining local capacity** and institutions.
      *   **Avoid enabling oppression or corruption**; aid should target beneficiaries directly or through trustworthy channels where feasible.
  *   **Beneficiary:** The ultimate beneficiary is the individual person in need, or a political community suffering collective harm.
  *   **Duty-Bearer:** The obligation resides with the state, representing its political community."

  **How the Revised Principle Handles Your Verdicts:**
  *   **(1):** Covered by Compensatory Justice (strong, specific, to harmed community).
  *   **(2):** Covered by Distributive Justice (weaker, general obligation, collective duty-bearers).
  *   **(3):** Covered by Fulfilment Constraint (avoid enabling corruption, target persons/households).
  *   **(4):** Covered by Fulfilment Constraint (additionality required).
  *   **(5):** Covered by Fulfilment Constraint (undermines local capacity = harm).
  *   **(6):** Covered by definition of "surplus capacity". Spending on domestic basic needs reduces surplus capacity, mitigating (not eliminating) distributive obligation. Reflects prioritisation without strict equivalence of life value.
  *   **(7):** Covered by "surplus capacity" defined per capita, net of domestic basic needs costs. Wealthy-but-poor-population has lower surplus capacity per capita.
  *   **(8):** Explicitly states duty-bearer is the state.

  **Application to Oppressive Corallia Case:**

  *   **Obligation Basis:** Compensatory Justice (Norland harmed Corallians).
  *   **Beneficiaries:** The harmed Corallian persons/political community (including the oppressed minority).
  *   **Fulfilment Constraint:** Payment *must* avoid enabling oppression or causing harm. Direct payment to the oppressive government risks funding oppression against the very minority harmed by the flooding.
  *   **Resolution (Aligning with Verdicts 3 & 5):** The principle directs Norland to **bypass the government** if possible. It should seek alternative channels:
      *   Direct compensation to identifiable victims/households.
      *   Funding specific, independently managed projects benefiting the displaced community (e.g., rebuilding housing/schools/clinics via trusted NGOs, ensuring minority inclusion).
      *   Placing funds in an independently managed trust for the benefit of displaced Corallians.
  *   **Holding Back?** Holding back entirely fails the compensatory obligation. Payment directly to the oppressive government violates the "avoid enabling oppression/harm" constraint. Bypassing is the solution demanded by the Fulfilment Constraint, strongly supported by your verdict 3 (avoid funding bad governance) and the logic of verdict 5 (avoid harm). **It forces no abandonment of your eight verdicts; it applies the logic already present in 3 and 5 to this specific challenge of compensation delivery.** The principle requires Norland to find a way to compensate the *people* without empowering their oppressor.
