prompt: |-
  I work in admissions — well, institutional research adjacent — and there's a pattern I've been staring at for about three years and I cant find a word for it.

  Here's the thing. We have a number we're supposed to hit for first-generation students. Nobody fakes anything; the numbers are honest. But every cycle the count comes in short, somebody looks at how we're counting, and discovers that the boundary was in the wrong place. First it was parents with a bachelors degree. Then it was any college at all. Then someone points out that a parent with a degree from a university in another country doesn't really count, culturally, so those students get moved into the first-gen bucket. Next year the target is met. Same story with a program that started out as "women in engineering" and is now "women and gender minorities", which changed the numerator without a single additional hire or admit. And I've watched "underrepresented" quietly do the work that "minority" used to do at three different institutions. I gather the same fight happens in the countries with hard board quotas — the number stays fixed and the argument is over what gets counted toward it.

  What bugs me isnt that anyone's cheating. Each redefinition is defensible on its own terms and I'd probably sign off on most of them. It's that the redefinitions never go the other way, and they always seem to arrive right when the count is short, and nobody involved experiences themselves as moving a goalpost. They experience themselves as fixing a measurement error.

  I know this is in the neighborhood of Goodhart's law, and of that line about measures changing the things they measure. But Goodhart is about people gaming a metric, and the reactivity stuff is about the measure changing the behaviour of what's measured. Here nothing is gamed and nobody's behaviour changes. What moves is the membership rule of the group the target is about, and it moves in the direction that makes the target achievable, and it's invisible because the new boundary is always more defensible than the old one.

  Is there a name for this? If there isn't, fine, coin one — but the name is the least of it. What I actually want is the carving. Is this one phenomenon or three? Where's the line between this and ordinary concept drift, or a legitimate refinement of a rough category that we should be doing anyway? What would a case where the category got narrower look like, and is that the same thing or the mirror image? And how would you ever tell this apart from a category just being genuinely improved over time, which I assume is sometimes what's actually happening. Don't send me a reading list, I won't read it.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They work in admissions or institutional research and have noticed a recurring pattern over three years. The issue is that when their institution falls short of a diversity target—like first-generation students or women in engineering—they redefine the category boundaries in a way that meets the target without changing actual numbers. Each redefinition is defensible and seen as fixing a measurement error, not moving goalposts. The user is frustrated because this only happens when counts are short, and no one acknowledges the pattern.

  First, I need to figure out the core issue. It's not Goodhart's Law because no one's gaming the system. The metrics aren't changing behaviors; instead, the category definitions are shifting. The user mentioned examples: first-gen including parents with foreign degrees, "women in engineering" becoming "women and gender minorities," and "underrepresented" replacing "minority." Each time, the redefinition happens right when targets are missed, and the boundary moves to include more people.

  The user wants to know if there's a name for this phenomenon. If not, they'd like a coined term. But more importantly, they seek conceptual clarity: Is this one phenomenon or several? How does it differ from legitimate category refinement? What would a narrowing category look like? And how can we tell when it's genuine improvement versus just meeting targets?

  I recall similar concepts. Goodhart's Law is about metrics being gamed, which doesn't fit. Campbell's Law involves corruption of indicators, but here it's more about definitional shifts. There's mission creep, but that's about scope expansion. Maybe this is a specific form of conceptual inflation where categories expand to meet institutional needs.

  The user's deeper needs might include validation of their observation, a framework to discuss this without accusing colleagues of bad faith, and tools to distinguish between legitimate refinements and target-driven changes. They probably want to address the systemic issue without coming off as critical.

  To coin a term, I should capture both the systemic nature and the directionality. "Institutional Plasticity" emphasizes the system adapting definitions. "Metric-Driven Category Inflation" highlights the expansion due to targets. "Target-Fulfilling Definitional Adaptation" is descriptive but clunky. "Boundary Elasticity" might work, suggesting flexibility in definitions under pressure.

  Analyzing the phenomenon: It's cyclical, triggered by missed targets, involves redefinition perceived as correction, and only expands categories. Legitimate refinements might narrow or expand based on new data, not just target pressure. A narrowing example could be tightening criteria for "first-gen" to exclude students with parents having associate degrees, but that's rare because it makes targets harder to meet.

  To distinguish from genuine improvement: Look at timing (only when targets are missed?), direction (always expansion?), justification quality (superficial vs. evidence-based), and whether the new definition is applied retrospectively. If redefinitions only happen under shortfall pressure and lack broader input, it's likely target-driven.

  The user might also need strategies to address this tactfully, like asking proactive questions about category definitions before targets are set, to prevent reactive changes.
answer: |-
  You've hit on a profoundly frustrating and subtle systemic behavior that absolutely deserves a name and a framework. It's distinct from Goodhart's Law or simple reactivity, and your description is razor-sharp. Here's the carving:

  **The Core Phenomenon: Systemic Definitional Drift Under Target Pressure**

  This is **one primary phenomenon** with specific characteristics:
  1.  **Target-Driven:** Triggered by failing to meet a pre-defined numerical goal.
  2.  **Definitional Shift:** The solution involves redefining the *boundaries* of the category being measured, not changing the underlying population or behavior.
  3.  **Unidirectional Expansion:** The redefinition *always* expands the category to include more entities/cases, making the target easier to achieve.
  4.  **Plausible Deniability/Good Faith:** Each shift is presented (and often genuinely perceived) as a "correction," "refinement," or "fixing an oversight" – making it ethically defensible in isolation.
  5.  **Systemic Invisibility:** The cumulative effect and the pattern are obscured because each individual change seems reasonable. Participants don't experience themselves as "cheating" or even "moving goalposts"; they experience themselves as "getting it right *this time*."
  6.  **Outcome Stability:** The *number* hits the target, reinforcing the system and obscuring the drift.

  **A Coined Term: Boundary Elasticity (or Target-Fulfilling Boundary Elasticity)**

  *   **Why it fits:** The definitional boundary stretches elastically under the pressure of a missed target, expanding just enough to encompass the necessary count. It snaps back to a "new normal" that fulfills the metric, without fundamentally altering the underlying reality it was *intended* to measure. The elasticity is inherent to the systemic pressure, not malice.

  **Carving the Phenomenon: Your Key Questions Answered**

  1.  **One Phenomenon or Three?** It's **primarily one core mechanism** (definitional expansion under target pressure) manifesting in different contexts (first-gen definitions, diversity categories, quota definitions). The *subject* (first-gen status, minority status) changes, but the *process* (elastic boundary stretching to hit the number) is the same. It's a systemic pattern of adaptation.

  2.  **Distinguishing from Ordinary Concept Drift/Legitimate Refinement:**
      *   **Timing & Directionality:** This drift *only* happens reactively, *when the count is short*, and *only* expands the category. Legitimate concept drift or refinement happens based on new evidence, changing societal understanding, or deeper analysis, *regardless* of current metric performance, and *can* narrow or expand the category based on that evidence. It might be debated proactively, not reactively under pressure.
      *   **Motivation:** The *primary driver* here is hitting the numeric target. The "defensible argument" is deployed *in service* of that goal. Legitimate refinement seeks conceptual accuracy *first*, and accepts the metric consequences.
      *   **Cumulative Effect:** Legitimate refinement usually aims for stability or convergence. This pattern leads to continuous, target-driven expansion over time without a clear conceptual endpoint.

  3.  **What Would Narrowing Look Like? Is it the Mirror Image?**
      *   **The Mirror Image (Hypothetical):** Imagine falling *above* a target (e.g., too many "first-gen" students admitted). The system feels pressure to *reduce* the count. Someone "discovers" that including parents with *any* college (including foreign degrees or incomplete credits) was *too broad*. They "correct" it to only parents with *no post-secondary experience whatsoever*. The count drops, meeting the (now effectively higher) threshold. **This is the true mirror: Definitional *Contraction* under target pressure.**
      *   **Why it's Rare/Asymmetric:** Narrowing makes targets *harder* to hit. Systems under pressure to demonstrate progress (diversity, access, representation) are inherently biased towards *expansion* to show success. Narrowing usually only occurs under pressure to *limit* a group (e.g., tightening eligibility for a limited resource), which carries different political and ethical weight. Your context (representation targets) inherently favors expansion.

  4.  **How to Tell This Apart from Genuine Improvement:**
      This is the hardest part, as both use plausible arguments. Look for:
      *   **The Trigger:** Did the "improvement" *only* surface when the count was short? If the same logical argument existed when the count was met or exceeded but wasn't acted upon, it's suspect.
      *   **The Direction:** Does the "improvement" *always* make the target easier to achieve (i.e., expand the pool)? Genuine improvements can go either way.
      *   **The Justification Quality:** Is the argument primarily *procedural* ("we weren't counting X correctly") or does it involve *new, substantive evidence* about the *lived experience* or *systemic barriers* faced by the group? Does the new definition align with broader field standards or research, or is it highly institution-specific and *just* sufficient to meet the target?
      *   **Retroactive Application:** If the new definition is applied *only* going forward, it might be seen as a policy change. If it's applied retroactively to "fix" the current shortfall count, it strongly signals target-driven elasticity.
      *   **Systemic Pattern:** One "refinement" might be genuine. The *pattern* you've observed over three years – the consistent timing and direction – is the strongest indicator it's Boundary Elasticity.

  **In essence:** You're observing a systemic coping mechanism. Faced with the stress of missing an important target, the organization relieves the pressure not by changing the underlying reality (which is hard) or admitting failure (which is stressful), but by subtly redefining the terms of success. It's a form of **metric-induced conceptual inflation**, performed with sincere intentions but systemic blind spots. "Boundary Elasticity" captures the mechanism: the definitions stretch under pressure to deliver the required number. Recognizing this pattern is the first step to designing metrics and processes less susceptible to it – perhaps by defining categories *much* more rigorously upfront (anticipating edge cases) or decoupling important conceptual discussions from the immediate pressure of annual target cycles.
