answer: |-
  ### Scenario  
  In a hospital ward, a patient is terminally ill with advanced amyotrophic lateral sclerosis (ALS), which has progressively destroyed their motor neurons, leaving them completely paralyzed and unable to breathe without mechanical ventilation. The ventilator, which has been sustaining the patient for months, delivers oxygen through a tube inserted into the trachea. The patient has a clear, legally valid advance directive stating that if their condition becomes irreversible and they cannot communicate, life support should be withdrawn to avoid prolonged suffering. After thorough consultation with the family and an ethics committee, the attending physician decides to honor this directive. The physician approaches the ventilator, presses the power button to turn it off, and remains at the bedside to provide palliative care. Within minutes, the patient’s oxygen levels plummet, and they die peacefully from respiratory failure caused by the ALS. The causal history is direct: the ALS had already rendered the patient’s respiratory muscles nonfunctional; the ventilator was an external intervention that artificially maintained breathing; turning it off removed that intervention, allowing the underlying disease to cause death as it naturally would have without treatment.

  ### Step-by-Step Analysis  

  1. **Describe the behavior twice, using the two vocabularies:**  
     - In the vocabulary of **doing versus allowing**: The physician *does* something—specifically, they perform the deliberate physical act of pressing the ventilator’s power button to deactivate it. This is an unambiguous instance of "doing" because it involves a voluntary bodily movement (the finger press) that directly alters the state of the world (the machine stops).  
     - In the vocabulary of **killing versus letting die**: The physician *lets die*—specifically, they allow the patient’s fatal disease to take its natural course by ceasing an artificial intervention. This is "letting die" because the lethal process (ALS-induced respiratory failure) was already present and inevitable; the physician’s action merely removed an external barrier (the ventilator) that was temporarily holding back death, rather than introducing a new cause.  

     The same behavior (pressing the button to turn off the ventilator) is classified as "doing" under the first distinction but as "letting die" under the second—pulling the two lines apart.

  2. **State the verdict each outlook gives, based on causal history:**  
     - The **doing versus allowing outlook** focuses on the agent’s movement: since the physician actively pressed the button, their behavior is classified as "doing" (not allowing). This verdict follows from the causal history: the death occurred because of a new physical action (the button press) that directly changed the environment, as opposed to a passive failure to act.  
     - The **killing versus letting die outlook** focuses on the origin of the lethal threat: since the ALS was the preexisting, internal cause of death, and the physician only withdrew an external defense against it, the behavior is classified as "letting die" (not killing). This verdict follows from the causal history: the ventilator’s cessation did not create the fatal respiratory failure but exposed the patient to an existing threat that was previously being managed.  
     These verdicts are derived objectively from how the death came about: the ALS was the underlying cause already in progress, and the button press was the precipitating event that enabled it.

  3. **Name the one feature doing the work:**  
     The key feature is that **the lethal process (the ALS) was already underway and actively progressing before the agent became involved, and the agent removed a barrier (the ventilator) that had been holding the threat back**. This aligns with your guess: the distinction hinges on whether the threat was preexisting and whether the agent interfered with an existing defense rather than failing to supply a new one. Here, the ALS was an ongoing, internal biological process, and the ventilator was a barrier already in place; removing it allowed death to proceed naturally.

  4. **Remove or reverse that feature and show the lines snapping back:**  
     Reverse the feature: instead of a preexisting lethal process, suppose the patient has a temporary, curable respiratory infection (not ALS) and is on the ventilator for short-term support. The physician, intending harm, turns off the ventilator. Now, the lethal threat (suffocation) was not already underway; it was created by removing the ventilator. In this case:  
     - The physician still *does* something (pressing the button), so the doing vs. allowing outlook calls it "doing."  
     - But now, the killing vs. letting die outlook also calls it "killing" because the physician’s act introduced a new cause of death (the lack of oxygen) where none was inevitable—the infection alone might not have been fatal with continued treatment.  
     Both distinctions now align: the behavior is "doing" and "killing," snapping the lines back together.

  5. **Attack from someone convinced the distinctions are one:**  
     A critic might attack by **redescribing the behavior as an omission (allowing) rather than an act (doing)**. They could argue that turning off the ventilator is merely "not providing further treatment," framing it as a passive failure to continue care (an omission) rather than an affirmative act. This redescription aims to make the behavior "allowing" and "letting die," preserving the alignment.  
     - **Does it succeed?** No, because the causal history shows an active intervention: pressing the button is a discrete, physical act that directly causes the machine to stop. If it were reframed as an omission (e.g., not replacing a failing battery), the death might be "letting die," but here the button press is unambiguously a "doing." The attack fails because it ignores the agent’s movement and the event’s immediacy—nothing in the causal chain was automatic or passive; the physician initiated the shutdown.  

  6. **Whether the case shows genuine independence or loose language:**  
     The case shows that the two distinctions are **genuinely independent**, not merely loose language. The divergence arises from deep structural differences in how we assign moral and causal responsibility: "doing vs. allowing" tracks physical agency (movement vs. inaction), while "killing vs. letting die" tracks causal origination (introducing a threat vs. yielding to an existing one). Here, these criteria conflict because the physician’s act (doing) serves only to enable an independent, prior threat (letting die). Language isn’t the issue—the classifications stem from objective features of the scenario, like the timing and source of the lethal threat. Your guess about the hinge (preexisting process and barrier removal) is validated, as it explains why the distinctions diverge: when the threat is internal and ongoing, removal of a defense is "letting die" even if done actively.
