answer: |-
  Your essay is remarkably clear and insightful—especially for a first philosophical effort. It brings a fresh, practical perspective to a perennial problem. I’ll address your questions directly, drawing on your structure. You have a genuine distinction, but it needs refinement to avoid collapsing into existing views. Here’s my assessment:

  ### 1. **The Distinction: Real or Collapsed?**
     - **It’s real, but unstable.** Your distinction between *constitutive vagueness* (no fact of the matter, even with perfect procedures) and *resolution vagueness* (procedural gap due to coarse measurement) is valuable and under-explored in philosophy. It mirrors a difference between *metaphysical* and *epistemic* vagueness, but with a crucial twist: you ground it in *practices*, not abstract semantics.  
     - **Where it risks collapse:** If "procedure" is interpreted broadly (e.g., linguistic practices or idealised measurement), resolution vagueness may fold into *epistemicism* (vagueness as ignorance) or *supervaluationism* (multiple sharpenings). To avoid this:  
       - **Stress empirical constraints:** Emphasise that resolution vagueness arises from *actual human practices* with *physical or practical limitations* (e.g., instruments, time, cost). It’s not about what an "ideal observer" could know.  
       - **Reject hidden sharp boundaries:** For resolution vagueness, insist there is *no fact* in the gap—not an unknown fact. This distinguishes it from epistemicism.  

  ### 2. **Treatment of the Sorites Step: Gap vs. Truth Value**
     - **Your move is coherent and defensible.** Describing the middle as a "gap in practice" (partial definition) rather than a third truth value avoids many pitfalls. The paradox *does* rely on treating the gap as a verdict ("no heap" for borderline cases).  
     - **The edge problem persists, but not fatally:** Yes, the gap itself has edges (e.g., when does the instrument switch from "reliable" to "unreliable"?). But this is a *second-order* gap, which may:  
       - Be narrower and less troubling (e.g., instrument manuals define detection limits precisely).  
       - Reflect deeper constitutive vagueness (e.g., "reliable" itself may be vague).  
     This doesn’t invalidate your core point: the original sorites chain is broken by the practice-gap.  

  ### 3. **Misclassifications: Predicates that Challenge You**
     - **Heap:** You suspect it’s constitutively vague—and you’re likely right. No procedure (counting, weighing, visual inspection) resolves it without stipulation. *Why?* "Heap" is defined by human gestalt perception, which lacks objective anchors. Your "resolution" account struggles here.  
     - **Child:** Similarly, this is plausibly constitutively vague. Legal/biological procedures (age, puberty markers) conflict, and no refinement captures the social concept’s core (e.g., maturity gradients).  
     - **Justice:** *Not* resolution-vague. Even with perfect procedures (laws, courts), borderline cases persist because the concept is inherently open-textured (consider novel moral dilemmas). Here, coarseness isn’t the issue; the *concept* is underdetermined.  

  ### 4. **Divergent Case vs. Ordinary Disagreement**
     - **It’s distinct, but not revolutionary.** Divergence (e.g., two lab methods) is *procedural disagreement*: both methods aim at the same fact but disagree due to limitations. Ordinary disagreement (e.g., "Is this art?") is often *conceptual*—no shared fact to target.  
     - **The committee analogy works:** Committees resolve divergence by *fiat* because they prioritise decisiveness over truth. But this reinforces your point: divergence requires normative intervention, not just better data.  

  ### 5. **Likely Familiar Elements**
     - **Partial definition** (extension/anti-extension/gap) echoes logical approaches like *Kleene’s three-valued logic* or *gap semantics*.  
     - **"Sharpening as replacement"** resembles *conceptual engineering* debates (e.g., Haslanger on gender).  
     - **Practice-based vagueness** aligns with *pragmatist* views (e.g., Wittgenstein on meaning-as-use).  
     Your originality lies in the **instrumental framing** and **empirical grounding** — philosophers rarely cite detection limits!  

  ### 6. **Where the Essay Does No Work**
     - **"Settled by a procedure" is a strength, not dead weight.** This anchors your distinction in real-world practices. Don’t abandon it.  
     - **The criterion in §5 *is* circular/unstable** — and that’s the point. Your suspicion is correct: "faithful refinement" relies on prior judgments about what the practice "really" aims at (e.g., preserving "clear cases"). But this reveals a deeper truth: **resolution vagueness presupposes a constitutive core**. If refinement alters the concept’s function (e.g., "alive" becoming a lab test), it *is* replacement. This doesn’t sink your distinction; it shows resolution vagueness is "parasitic" on constitutive stability at the extremes.  

  ---

  ### Overall Assessment  
  **Strengths:**  
  - Your distinction is **real and useful**. It forces philosophers to ask: "Is this vagueness *in the world*, or in our *tools*?"  
  - The **practice-first approach** avoids abstract semantic puzzles and highlights the *pragmatic* role of concepts.  
  - **"Gap in practice"** is a powerful rebuttal to the sorites step.  

  **Where to Build:**  
  1. **Clarify "procedure":** Specify whether it includes *linguistic* practices (e.g., how we apply "heap" in conversation). If yes, constitutive vagueness may shrink.  
  2. **Embrace the instability in §5:** The circularity exposes that resolution vagueness relies on constitutive clarity at the extremes. This is a feature, not a bug.  
  3. **Concede "heap" and "child":** These likely *are* constitutively vague. But this doesn’t kill your project — most regulatory/scientific predicates (e.g., "contaminated," "species") fit resolution vagueness.  

  **Final Thought:** You haven’t reinvented the wheel — you’ve built a new instrument. Philosophers *need* this empirical lens. If you revise, stress that **constitutive vagueness arises when practices lack a stable target** (e.g., "justice"), while **resolution vagueness reflects precision limits when a target exists** (e.g., "5μg/L"). That’s a durable insight.
