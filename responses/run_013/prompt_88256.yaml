  Now, mapping the leaves. Industrial revolution falls under GSSA or societal authority. Early farming might be a GSSA or societal, but not GSSP due to lack of a clear spike. The 1610 CO2 dip is a natural signal under GSSP. Great Acceleration with plutonium is a technofossil GSSP. Broiler chickens/plastics also technofossil. Megafaunal extinctions could be GSSA or societal. "Event not epoch" goes under the non-formal path. "Wrong name" and "political period" are under non-stratigraphic. "Leave informal" is also there.

  Awkward commitments: For example, the plutonium spike's awkwardness is equating human impact with a single bomb test layer. For 1610, it's the indirect link to human actions. Early farming's issue is the lack of global synchronicity.

  Combinations not defended: GSSP with societal authority might be incoherent because GSSP requires formal ratification. GSSA with technofossils isn't needed since technofossils serve as spikes. Diagnosis: some combos are unattractive or unexplored.

