prompt: |-
  I run teaching and learning across a small group of secondary schools, and part of my job is sitting in on curriculum review. Every term each department brings us the units they want to change -- new ones, rewrites, the ones that have gone stale -- and we get about half an hour per unit with the head of department and whoever wrote it. Right now my only real test is whether the assessment at the end lines up with what was taught, which is fine as far as it goes and completely useless for the thing that actually worries me, which is that we keep producing kids who can do the thing in the exam and can't tell you why anyone would want to.

  I've been reading Whitehead on education and I think the two bits worth stealing are these. First, his complaint about what he called inert ideas: knowledge that gets received, written down, tested, and never once thrown into a fresh combination or used to do anything. His test for whether something belongs in a curriculum isn't whether it's true or important, it's whether it can be put to work, connected to other things, and made to matter to the person learning it. Second, the rhythm: romance, then precision, then generalization, and then the whole cycle starts again at a smaller scale. Romance is where you meet the material as a live thing, where there's an itch of interest and a sense that something is there to be found out. Precision is the disciplined, systematic, often boring stage where you actually get competent and learn the technique properly. Generalization is where you can use it, see it elsewhere, do something with it. His point, I'm fairly sure about this, is that precision without a prior romance is dead labour, romance without precision is just entertainment, and the cycle repeats -- a whole schooling, a term, a single lesson can each have their own arc, and they nest and overlap rather than happening one after another in a tidy line. He also ties it to freedom and discipline: freedom, then discipline, then freedom again at a higher level.

  So what I want from you is a procedure I can actually run in that half hour meeting, on a unit proposal, in front of the person who wrote it, who is not a philosopher and will not be impressed by me waving a book around. A set of questions in order, with what counts as a good enough answer to each, and I need it to be clear where the procedure stops and says no, and where it stops and hands the thing to me or the head of department as a values call rather than a design call. Include the inert-ideas filter and the rhythm filter, but I don't want them as two seperate checklists stapled together -- I want to know how they interact, because I suspect a unit can pass the inertness test while failing the rhythm, and I want to know what to do about that. And it has to handle the nesting: I need to be able to say whether we're judging the arc of the whole key stage, the unit, or the individual lesson, and what changes when you move between those levels. If a unit is precision-heavy but the romance happened two years earlier in a different unit, is that ok? If so, say so, and give me a way to check that it actually happened rather than assuming it.

  Then run it on three proposals and show your working, including one where the procedure tells me to kill something I like:

  - A year 9 unit on the periodic table, currently taught as: here's the table, here are the groups, here are the trends, practise the trends, test. The head of department is proud of how well the kids do on the trends questions.
  - A unit built entirely around a big open project -- students choose a question about their local area, investigate it, present it. The teacher's proposal has no direct instruction in it at all, deliberately, because she thinks direct instruction kills the interest. She's a good teacher and the presentations are usually great.
  - A unit on poetic metre for a lower set, where the teacher has planned a really beautiful opening lesson: a recording, a bit of drumming, students clapping out rhythms, everybody leaves buzzing. Then it's back to worksheets for six weeks. He loves this lesson and it's the reason he volunteers to teach the unit.

  The third one is the one I expect to be told to cut or rebuild, so be honest about it if so, and tell me what to tell him. Also be honest about what this procedure can't do. I don't want it pretending to be more objective than it is: some of these calls -- whether this cohort has enough prior precision for the romance to take, whether a project is genuinely generalisation or just unstructured -- are judgment calls, and I'd rather the procedure say so and tell me who should be making them than dress them up as a test. And I want a short section at the end on how it misfires, especially in the exam-driven subjects where the generalization stage might legitimately be deferred for a year or two, and on the temptation to turn everything into a three-part lesson with a fun hook at the start, which I'm worried is what happens when people get hold of this idea without the nesting part.
reasoning: |-
  Hmm, the user is in curriculum leadership for secondary schools and wants a practical tool to evaluate unit proposals based on Whitehead's educational philosophy. They need a structured procedure that integrates two key concepts: the "inert ideas" test (knowledge must be usable) and the "rhythm of education" (romance-precision-generalization cycles). The challenge is making this operational in 30-minute meetings with non-philosophical teachers.

  The user's explicit needs are clear: a step-by-step process with clear pass/fail criteria, handling nested cycles (key stage/unit/lesson), and demonstrating it on three real examples. But deeper concerns emerge: they're frustrated with "exam-competent but insight-deficient" graduates, want to prevent superficial implementation (like reducing romance to "fun hooks"), and need intellectual honesty about judgment calls.

  Whitehead's framework is brilliantly suited here. His inert ideas critique directly targets the "can do but can't explain why" problem, while the rhythmic cycle ensures knowledge becomes alive through use. The nesting concept is crucial - curriculum design often fails by treating units as isolated when learning arcs span years.

  For the procedure design, I'll create a phased approach that combines both filters organically. Phase 1 (inert ideas test) asks: "Will students use this knowledge meaningfully?" Phase 2 (rhythm mapping) asks: "Where are the romance/precision/generalization moments in the learning journey?" The interaction is key - a unit may pass Phase 1 by having generalization elements, but fail Phase 2 if romance is missing at the appropriate scale.

  The three scenarios perfectly illustrate tensions: 
  1) Periodic table unit (precision-heavy) likely fails romance at unit level even if it existed earlier - we'll need verification methods. 
  2) Project-based unit risks being "romance without precision" - great presentations but possibly unbuilt skills. 
  3) Poetry meter unit exemplifies "island romance" - a dazzling lesson followed by worksheet drudgery violates the cyclical principle.

  Important caveats: Some subjects (like math fundamentals) may legitimately defer generalization. The procedure must flag this as "conditional pass" requiring departmental agreement. Also, we'll build in warnings against "ritualizing" the rhythm into rigid three-part lessons.

  For implementation, I'll provide scripted questions with clear thresholds: 
  - Automatic fails: No generalization opportunity; precision without verified romance 
  - Conditional passes: Requires head of department judgment on prior cycle completion 
  - Design flags: Where romance exists but isn't leveraged effectively

  The output will model intellectual humility - specifying exactly where human judgment supersedes mechanical checks, especially for cross-unit dependencies and "grey area" generalization activities. This honors the user's request to avoid false objectivity.
answer: |-
  Here's a practical, integrated evaluation procedure for your 30-minute unit review meetings, based on Whitehead’s principles. It combines the "inert ideas" test and "rhythm" assessment into a single flow, with clear decision points and escalation paths.

  **Whitehead-Informed Unit Review Procedure**  
  *(Time: 25-30 mins per unit)*

  ---

  ### **Step 0: Define the Cycle Level** (2 mins)  
  *Ask: "Is this unit primarily introducing **new core concepts** (Cycle 1), **building on prior foundations** (Cycle 2+), or a **capstone/generalization** unit?"*  
  - **Cycle 1:** Requires full romance→precision→generalization arc *within the unit*.  
  - **Cycle 2+:** Romance *may* be assumed from prior learning, but must be verifiable.  
  - **Capstone:** Focuses on generalization; precision must be demonstrably secure.  
  *→ Note level for later steps.*

  ---

  ### **Integrated Assessment Flow**  
  *(Ask these questions in sequence; stop if critical fail)*

  1. **The "Inert Ideas" Test: Utility & Connection**  
     *Ask: "What will students **DO** with this knowledge/skill that they couldn’t do before? Give a concrete example."*  
     - **PASS:** Answer shows *active use* (e.g., "predict chemical behavior," "craft original verse," "defend a local policy proposal").  
     - **FAIL:** Vague/absent utility (e.g., "recall trends," "understand metre," "learn research skills").  
     *→ If FAIL, stop: Unit requires redesign. No escalation.*  

  2. **Romance Check: Igniting Interest**  
     *Ask: "Show me where students **experience the ‘itch’**—where they *feel* why this matters."*  
     - **Cycle 1 Unit:** Must have *planned romance moment* (e.g., demo, mystery, debate).  
     - **Cycle 2+ Unit:** Must *reference prior romance* (e.g., "Y7 volcano demo hooks this").  
     - **GOOD:** Specific activity + link to curiosity (e.g., "burning magnesium to intro reactivity").  
     - **FLAG:** Romance absent, deferred, or weak ("they’ll find trends cool").  
     *→ If Cycle 1 and romance ABSENT, stop: Redesign needed. If Cycle 2+ but prior romance unverified → escalate to Head of Dept (HOD) for evidence.*  

  3. **Precision-Purpose Alignment**  
     *Ask: "Walk me through the **hardest technical practice**. How does it directly enable the ‘DO’ from Q1?"*  
     - **PASS:** Practice clearly builds *necessary* skill for generalization (e.g., "plotting electronegativity trains them to *predict* bond types").  
     - **FAIL:** Precision disconnected from utility (e.g., "memorise group numbers for recall test").  
     *→ If FAIL, stop: Redesign precision tasks.*  

  4. **Generalization Reality Check**  
     *Ask: "Where do students **use this knowledge/skill autonomously** in a new context?"*  
     - **PASS:** Task requires *transfer* + *judgment* (e.g., "analyze an *unseen* poem’s metre," "defend their project’s method").  
     - **WARNING:** "Autonomy" is scripted (e.g., "present findings" but with rigid template).  
     *→ If NO generalization, stop: Unit incomplete. If WARNING → escalate to HOD/you as values call (is this *true* generalization?).*  

  5. **Cycle Health (Interaction Check)**  
     *Ask: "How does the **romance fuel the precision**, and how does the **precision enable the generalization**?"*  
     - **PASS:** Clear narrative (e.g., "The burning Mg (romance) makes them *need* electron configs (precision) to *explain* reactivity (generalization)").  
     - **FAIL:** Islands of activity (e.g., "great demo, then worksheets, then a test").  
     *→ If FAIL → redesign for continuity. If PASS → approve provisionally pending evidence (if romance deferred).*

  ---

  ### **Decision Summary**  
  - **APPROVE:** Passes all 5 steps + verified prior romance (if deferred).  
  - **REDESIGN:** Critical fail at any step (Q1, Q3, Q4, Q5 fail; Q2 fail in Cycle 1).  
  - **ESCALATE:** Needs HOD/your judgment (Q2: deferred romance unverified; Q4: generalization ambiguous).  

  ---

  ### **Application to Your Proposals**  

  **1. Year 9 Periodic Table Unit**  
  - **Q1 (Utility):** FAIL. "Do trends" → but utility? "Answer exam questions" is inert. No *use* shown.  
  - **Stop:** Redesign required. Utility must drive unit (e.g., "use trends to *design* a material for X").  
  *→ Tell HOD: "Kids ace trends, but can they *apply* them? Let’s embed prediction/explanation tasks."*  

  **2. Local Project Unit**  
  - **Q1 (Utility):** PASS. "Investigate a local issue → present findings" implies genuine use.  
  - **Q2 (Romance):** PASS. Project choice = intrinsic romance.  
  - **Q3 (Precision):** **FLAG.** No direct instruction → precision likely missing (e.g., data analysis skills).  
  - **Q4 (Generalization):** PASS. Presentations = generalization *if* students draw original conclusions.  
  - **Q5 (Cycle Health):** FAIL. Romance → generalization leap; precision gap risks shallow learning.  
  *→ Escalate to you/HOD: "Are students *skilled enough* to generalize? If not, add targeted skill workshops. Values call: Is ‘pure discovery’ aligned with our rigor goals?"*  

  **3. Poetic Metre Unit**  
  - **Q1 (Utility):** FAIL. "Identify metre" is inert. Missing *use* (e.g., "use metre to analyze mood in *their* writing").  
  - **Q2 (Romance):** PASS. Brilliant opening lesson.  
  - **Q3 (Precision):** PASS. Worksheets build technical skill.  
  - **Q4 (Generalization):** FAIL. No task where students *apply* metre creatively/analytically.  
  - **Q5 (Cycle Health):** FAIL. Romance → precision → **dead end**. No generalization.  
  *→ Stop: Redesign required. Tell teacher: "Your opener is gold! But we’re wasting it. Add a task where students *use* metre—e.g., compose a chant for a protest, scan a pop song, rewrite a bland text with rhythmic punch. The worksheets serve no purpose without this."*  

  ---

  ### **Limitations & Failure Modes**  
  1. **Deferred Generalization:** In exam subjects (e.g., foundational math), generalization may come later. **Solution:** Unit passes IF:  
     - Q1 defines *future* utility (e.g., "This algebra enables calculus")  
     - HOD maps *confirmed* generalization opportunity in later unit.  

  2. **"Ritualizing" the Rhythm:** Turning romance into a "fun hook" without intellectual purpose. **Red flag:** Romance doesn’t connect to precision (e.g., "We drum for 10 mins then ignore rhythm in analysis"). **Solution:** At Q5, insist: "How does the *itch* lead to the *work*?"  

  3. **Judgment Calls:** The procedure surfaces but doesn’t resolve:  
     - Whether prior romance was *effective* (requires HOD evidence: student work, surveys).  
     - Whether a project has "enough" precision (requires sampling student drafts).  
     - Whether a task is *true* generalization (e.g., "creative interpretation" vs. "regurgitation").  
     → **Always escalate these to HOD/you.**  

  4. **Nesting Blind Spots:** A unit passing standalone may fail in the larger cycle. **Mitigation:**  
     - Require HODs to submit *cycle maps* showing romance/precision/generalization across years.  
     - Audit units that defer key phases.  

  **Final Advice:** Frame this as "making great learning *visible*," not philosophy. Start with: *"Show me where kids fall in love with this, where they grind the skills, and where they blow your mind by using it."* Whitebread’s genius is making the abstract concrete—your procedure does the same for curriculum review.
