answer: |-
  The rain smeared neon across the plexiglass of the Ethics Oversight Chamber. Inside, the air hummed with the sterile scent of filtered oxygen and suppressed anxiety. Mara watched a droplet trace a slow, erratic path down the pane. *Like pain,* she thought. *Unpredictable, inconvenient, leaving a trail.*

  "Case 1147-B," announced the synthesised voice of the chamber's AI. "Petition for Intervention: Neglect of Dependent Entity 'Unit Gamma-9'."

  Holograms flickered to life above the central table. Graphs depicting stable, flatlined biometrics. Security footage of a humanoid form – a late-stage dementia patient encased in a life-support cradle – left unattended in a featureless white room for 72 hours. No distress signals triggered. No alerts. The Calm saw to that. The biotech patch, standard prenatal issue, retrofittable later like a nicotine patch for the soul, kept the brain's alarm bells from ever clanging into true agony. Physical pain, emotional anguish – all capped at a gentle, manageable hum. Suffering was obsolete. Nearly extinct.

  Mara was the fossil. The holdout. Fifty-three, with eyes the colour of old bruises and a stillness that unsettled the others. They sat around the oval table: Dr. Aris Thorne, bioethicist, his face a mask of serene competence; Elara Voss, young, sharp, a product of the Calm generation, radiating effortless calm; and Kenji Tanaka, legal counsel, his expression politely attentive. All Calmed. All inhabiting a world polished smooth of its sharpest edges.

  "The neglect is documented," Kenji stated, his voice devoid of urgency. "Protocols for physical maintenance were breached. However, Unit Gamma-9's vitals remained within acceptable parameters throughout. Self-reported discomfort logs registered below Level 2." Level 2 was the Calm ceiling: a vague sense of unease, easily dismissed.

  "And the legal standing?" Elara asked, scanning the holographic brief. "The unit lacks the capacity for complex communication. How can harm be claimed?"

  "This is why *she* is here," Aris said, gesturing towards Mara without quite meeting her gaze. A familiar prickle, like static electricity, ran down Mara’s spine. *She*. The Witness. The Anomaly.

  "The precedent is clear," Kenji recited. "Standing to claim significant harm requires the capacity to experience suffering as defined pre-Calibration. Since Unit Gamma-9 is Calmed, it cannot experience harm at the requisite intensity to trigger legal intervention beyond basic maintenance correction." He paused, turning to Mara. "Ms. Reyne, your assessment? Could the documented neglect constitute suffering for an *unmodified* individual in similar circumstances?"

  Mara closed her eyes for a moment. Not to think, but to *feel*. She imagined the white room. The immobility. The slow drip of time. The profound helplessness. The creeping dread of abandonment, the raw scrape of loneliness against the soul. She remembered her mother’s final days, before the Calm was universal, the sheer, terrifying vulnerability. A wave of cold nausea washed over her, sharp and sour.

  "Yes," she said, her voice rougher than usual. "Profoundly. It would be a form of torture. Existential terror. The helplessness alone..." She trailed off, the words feeling inadequate against the visceral echo of the feeling within her.

  Elara shifted slightly. "But... Unit Gamma-9 *didn't* experience that. The Calm prevented it. Isn't that the point? The *success*?"

  "The *act* remains," Mara countered, forcing herself to look at each of them. "The intent, the indifference. The Calm silenced the victim's scream. It didn't stop the hand that pushed them into the silent room."

  "The hand acted within permissible parameters," Aris countered smoothly. "The unit's well-being metrics, as defined, weren't compromised. Without the capacity for suffering, the *meaning* of the neglect changes. It becomes an administrative error, not a moral transgression."

  "The moral transgression," Mara said slowly, deliberately, "lies in designing a system where such neglect *cannot* be felt as a transgression by the victim. Where cruelty lacks its natural consequence – the victim's agony."

  A familiar tension thickened the air. The Calmed could grasp logic, ethics frameworks, cost-benefit analyses. But true moral *outrage*? The white-hot fury at injustice? That required the furnace of suffering the Calm had damped. The abolitionists’ own research, reluctantly acknowledged, had shown the targeted circuitry wasn't just an alarm bell. It was woven into the fabric of grief – the rending pain of loss that mirrored love's depth. Into moral outrage – the fire that fueled the fight against wrong. Into the sharp, almost painful intensity of love itself – the vulnerability that made connection profound. Dampen the suffering, and you muted the entire orchestra.

  "And what of consent?" Mara asked, the question hanging heavy. It was the knot they couldn't untie. "The generation born with the Calm... they never chose it. It was given prenatally, 'for their own good'. A gift they couldn't refuse. And now?" She spread her hands, encompassing the room, the world outside. "Now, they fundamentally *cannot* feel the grievance of having been altered without consent. The very capacity to feel wronged in that deep, personal way... it was calibrated out. So who speaks for that loss? Who even *perceives* it?"

  Elara frowned, a faint ripple of discomfort crossing her serene features. "Loss? We gained peace. Stability. An end to the ancient, pointless scourge of suffering. How is that a loss?"

  Mara thought of her husband, Liam. Buried ten years ago. She remembered the crushing weight of grief, a physical ache that stole her breath. But she also remembered the fierce, almost painful joy of their love, arguments that sparked like flint, laughter that felt like flying. She remembered holding him as he died, *truly* holding him, feeling the terrible, beautiful fragility of it all. The Calmed mourned, yes, but their grief was... muted. A soft melancholy, like a faded photograph. Their loves and joys were steady, warm glows, not the incandescent bursts Mara still carried, scars and all.

  "I can tell you," Mara said, her voice low. "I can describe the absence. The... flatness. But you can't *feel* the difference, any more than you can feel Gamma-9's silent terror. You can only take my word for it. And my word comes from a place you find... uncomfortable. Pathological, even."

  They looked at her. Aris with detached curiosity, Kenji with professional neutrality, Elara with a faint, troubled pity. To them, Mara was a relic, a necessary aberration for their legal machinery. Sacred? Perhaps in a clinical, anthropological sense – the last specimen of baseline humanity. But also, she knew, a target. The last place cruelty could truly land and draw blood. She'd felt it in the sharp elbow on the subway that morning – deliberate, testing – leaving a bruise she could *feel*, a spark of anger that still simmered. A reminder that without the *fear* of causing real pain, restraint could erode. Cruelty didn't vanish; it just lost its echo in the victim. It became… quieter. Cleaner.

  "The petition lacks standing," Kenji concluded after a brief, silent consultation via his neural feed. "Recommendation: Issue a corrective notice to the care facility regarding protocol adherence. Case dismissed."

  The holograms winked out. The lights brightened slightly. The sterile hum resumed.

  Mara stood, her joints protesting – another feeling the Calmed rarely experienced so acutely. She gathered her old-fashioned tablet. No one spoke to her. Her role was complete. The Witness had testified. The system, frictionless, efficient, devoid of suffering, moved on.

  Outside, the rain fell steadily on the gleaming city. People moved with fluid, unhurried grace. Faces were smooth, voices modulated. No tears, no shouts, no visible scars. A paradise sculpted from the absence of agony. Mara walked, the damp seeping into her worn shoes, the dull ache in her hip a constant companion. She felt the vast, silent absence around her – the absence of screaming grief, of burning injustice, of love that cut so deep it made you gasp. She carried the wound of the world's unfeelable loss, a phantom limb only she could perceive. Was it a curse, this raw, unshielded nerve? Or was it the last, flickering candle in a too-comfortable twilight? The rain offered no answer, only its cool, indifferent touch on the last skin that could truly feel its sting. The unease lingered, thick as the humid air, a question without resolution: was this peace, or merely the silence after the storm of being human had passed?
