  Williamson's anti-luminosity argument aims to show that no nontrivial condition is luminous. The argument runs by considering a series of cases in which one is gradually changing from being in condition C (e.g., feeling cold) to not being in C. At the beginning, one feels cold and knows it. At the end, one does not feel cold and knows that. In between, there are cases where one feels cold but does not know it (because one is too close to the boundary) and cases where one does not feel cold but also does not know that (for the same reason). The key step is the margin for error principle: to know that one is in C, one must be safely in C, so that even in nearby cases where one might be mistaken, one is not. But then, in the series, there will be a case where one is in C but not safely enough to know that one is in C. Therefore, one does not know that one is in C even though one is in C. Hence, C is not luminous.

