answer: |-
  ### Proposed Principle: The Expected Accuracy Principle (EAP)

  I propose the **Expected Accuracy Principle (EAP)** as the unifying principle for rational deference to future credences. It is grounded in the idea that deference is rational when, and only when, you currently expect your future credence to be at least as accurate as your current credence, based on a proper scoring rule (e.g., the Brier score). Formally:

  - **EAP**: If you are certain that at future time \(t\) your credence in proposition \(A\) will be \(x\), then your current credence in \(A\) should be \(x\) if and only if, by your current lights, the expected accuracy of credence \(x\) (at \(t\)) is at least as high as the expected accuracy of any alternative credence \(y\) you might hold now.  
    - *Expected accuracy* is calculated using a strictly proper scoring rule (e.g., for credence \(c\) in \(A\), the Brier score is \((1 - c)^2\) if \(A\) is true, and \(c^2\) if \(A\) is false; lower scores are better, so we maximize *negative* Brier score or use a utility transformation).  
    - This principle prioritizes **accuracy** over mere information gain. Deference is rational when your future self is expected to be "closer to the truth," regardless of whether they have more evidence, less evidence, or the same evidence.

  EAP captures the core intuition from your cases: deference depends on whether your future self's credence is formed in a way that you currently endorse as truth-conducive. It generalizes Reflection by adding an accuracy filter.

  ### Case-by-Case Justification and the Role of Accuracy vs. Information
  Here, I show how EAP forces each verdict, highlighting when accuracy (not information) drives the result. Cases 2, 3, 4, and 7 are pivotal for establishing EAP.

  1. **Sealed envelope**  
     - **Verdict**: Defer (now 0.9).  
     - **EAP explanation**: Future credence (0.9) is based on new evidence, so you expect it to be more accurate than your current credence. Information gain directly boosts expected accuracy.  
     - **Force for EAP**: Illustrates deference under information gain, but accuracy is the driver (you defer because evidence improves truth-tracking).

  2. **Paranoia pill**  
     - **Verdict**: Do not defer (now ~0.02).  
     - **EAP explanation**: Future credence (0.9) results from cognitive dysfunction, not truth-tracking. You expect it to be less accurate (e.g., if \(A\) is false, 0.9 is a bad guess). Current credence (0.02) is based on reliable evidence, so its expected accuracy is higher.  
     - **Force for EAP**: Forces the accuracy reading. Information is unchanged, but accuracy expectations dominate. Without an accuracy filter, Reflection would wrongly demand deference.

