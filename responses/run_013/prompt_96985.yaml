  Alright, let me start by unpacking the user's situation. They're on a research-evaluation committee in psychology at a big R1 university, rewriting promotion-and-tenure guidelines regarding failed replications. The immediate case involves a friend and former co-author whose flagship study failed a large-scale replication. The user is recused from voting but drafting the policy, which puts them in a tricky position. They need to balance objectivity with personal ties.

  First, I need to address the two defenses the candidate presented. The first is about operationalization differences—the replication dropped a feature from the original manipulation. The second is the variability between labs suggesting an unmeasured moderator. The user is unsure if these are valid or if loyalty is clouding their judgment. Priya wants a strict rule: null replication means the finding doesn't count. Sam prefers Bayes factors to avoid dismissing a decade of evidence based on one study.

  I should consider frequentist vs. Bayesian perspectives. Frequentist: a well-powered null result suggests no effect, but operationalization differences matter. If the replication changed the method, it might not test the same hypothesis. Bayesian updating requires incorporating prior evidence. A single null might not override multiple past studies, especially if the prior is strong.

  For the policy, a bright-line rule like Priya's might be too rigid. Dismissing any study with a failed replication ignores methodological nuances. Sam's Bayes factor approach is better but could be complex for committees. A middle ground is needed—require replications to be direct and well-powered, but allow for methodological reviews. Also, consider the weight of evidence. If the original study is central to the candidate's impact, a failed replication diminishes its value. However, if the candidate has other strong work, it might not sink their case.

  The procedure should involve an ad hoc panel with methodologists to assess operationalization claims. They need clear criteria: was the change significant? Did it alter the theoretical construct? For moderator claims, require empirical evidence, not just speculation.

  Applying this to the candidate: the operationalization defense needs scrutiny. If the dropped feature was crucial, maybe the replication isn't direct. But if it's minor, the null result stands. The lab variability might suggest a moderator, but without evidence, it's weak. The original study's impact is still there, but its validity is questioned. The committee must weigh this against the rest of the candidate's work.

  The strongest case against the recommendation is that it introduces subjectivity. Committees might be inconsistent, and operationalization defenses could be overused. Requiring evidence for moderators might be too high a bar. But without these checks, good science could be penalized.

  In the end, the policy must ensure rigorous evaluation without being inflexible. The committee needs clear guidelines but also the flexibility to consider context. Balancing methodological rigor with fair assessment is key here.
answer: |-
  ## Draft Memo: Policy on Handling Failed Replications in Promotion & Tenure Evaluations

  **To:** Research-Evaluation Committee  
  **From:** [Your Name], Drafting Subcommittee  
  **Date:** October 26, 2023  
  **Subject:** Proposed Policy Amendment: Evaluating Research Impact in Light of Replication Attempts

  **I. Brainstorming: What Does a Failed Replication License Us to Conclude?**

  *   **Frequentist Perspective:** A well-powered, well-conducted, *direct* replication obtaining a null result (p > .05) tells us that, *assuming the replication methodology was indeed testing the same hypothesis under comparable conditions*, the observed data are unlikely (conventionally <5% probability) if the original effect size (or larger) were true in this specific replication attempt. It does **not** prove the effect is universally absent ("proof of absence"). It strongly suggests the original finding is not robust *under the specific conditions of the replication*. However, it cannot *by itself* invalidate the entire prior evidence base; it adds one highly weighted data point against the effect's ubiquity. Critically, power matters: a high-powered null is strong evidence *against* an effect of the original's claimed size *or larger* in the replication context. Priya's "bright line" overstates the case ("doesn't count") by ignoring methodological fidelity and prior evidence. Sam's critique of treating p>.05 as "proof of absence" is valid *if* that's how we interpret it, but it needn't be.
  *   **Bayesian Perspective:** A failed replication updates our belief about the effect's existence/magnitude. The degree of update depends on the strength of the prior belief (based on original evidence, theory, other replications) and the strength (Bayes Factor, BF) of the replication evidence. A highly powered null replication provides strong evidence (e.g., BF<0.01 or BF<0.1) *against* the effect *existing at the originally claimed size* in the replication context. However, if the prior evidence was very strong (high prior odds), a single strong null might only modestly reduce belief in the effect, suggesting it might be smaller, rarer, or more context-dependent than originally thought. Sam is right that ignoring prior evidence is flawed, but demanding Bayes Factors *alone* as the threshold is operationally complex and doesn't resolve the "same hypothesis?" question. Priya's abandoned prediction interval idea essentially asks if the replication result is *surprising* given the original finding and its precision; if the replication falls outside, it significantly challenges the original.

  **Surviving Insights:**
  *   **Priya:** A well-powered null replication *must* reduce our confidence in the original finding's robustness and generalizability. Ignoring it is unscientific. "Operationalization wrong" requires rigorous scrutiny.
  *   **Sam:** We cannot treat a single null as erasing all prior evidence. Bayesian thinking (updating belief) is sound, but demanding specific BF calculations for every case is impractical for committee review. The *principle* of weighing the replication against the prior body of evidence is crucial.

  **II. Recommended Policy Rule: Evaluating Replicated Findings**

  1.  **Definition of a "Relevant Failed Replication":**
      *   A *preregistered*, *direct* replication attempt, published in a peer-reviewed journal.
      *   "Direct" means it aims to test the *same* theoretical hypothesis using the *same* operational definitions and core methodology as the original study, with fidelity documented and justified.
      *   "Failed" means the primary preregistered test of the focal hypothesis yielded a statistically non-significant result (p > 0.05) *and* the replication had high statistical power (≥ 90%) to detect an effect size *at least as large as the original point estimate*.
      *   Multi-lab collaborations meeting these criteria are considered highly authoritative.

  2.  **Weight of a Failed Replication:**
      *   A "Relevant Failed Replication" constitutes **strong evidence that the original finding lacks robustness under the conditions directly tested by the replication.** It significantly diminishes the evidential value of the original finding *as a demonstration of a reliable, generalizable effect*.
      *   It does **not** automatically render the original finding "false" or "invalid" in all contexts, nor does it negate its historical impact or value as a catalyst for research.
      *   **In P&T Evaluation:** The original paper retains its citation count and historical significance. However, its weight as *evidence for a robust empirical phenomenon* is **substantially reduced.** It cannot be counted as primary evidence of a *reliable* effect central to the candidate's scholarly impact. Its contribution shifts towards theoretical/conceptual innovation or stimulating subsequent research.

  3.  **Adjudicating Defenses (Operationalization & Moderators):**
      *   Claims that a replication was not "direct" (e.g., due to differing operationalization) or that moderators explain the failure **must be formally raised by the candidate** in their dossier.
      *   **Adjudication Body:** An *ad hoc* subcommittee of 3 committee members, including at least one with recognized methodological expertise, will evaluate the claim.
      *   **Standard for Operationalization Defense:** The candidate must demonstrate, with specific evidence (e.g., pilot data, strong theoretical rationale, prior literature), that the methodological difference *identified in the replication report* is *plausibly critical* to the effect's manifestation and that the replication therefore did not test the *same theoretical construct* under comparable conditions. The burden of proof lies with the candidate. Vague assertions ("they did it wrong") are insufficient.
      *   **Standard for Unmeasured Moderator Defense:** The candidate must provide: (a) A *specific, plausible* moderator hypothesis grounded in theory or prior evidence; (b) Evidence (not mere speculation) that this moderator *could* reasonably explain the discrepancy (e.g., documented differences between original/replication contexts on that moderator, meta-analytic evidence of heterogeneity); (c) Acknowledgement that the *original finding's generalizability* is significantly constrained. Claims of ubiquitous but unmeasured moderators without specificity or evidence are unfalsifiable and do not negate the replication's evidence of non-robustness.

  **III. Procedure for Handling Cases Involving Failed Replications:**

  1.  **Identification:** The committee identifies papers in the candidate's dossier subject to published replication attempts flagged as "failed" by the candidate or committee members.
  2.  **Initial Assessment:** Committee staff (or a designated methodologist) verifies if any replication meets the "Relevant Failed Replication" criteria (preregistered, direct, high-powered, published null).
  3.  **Candidate Response:** If a Relevant Failed Replication exists, the candidate is invited to include in their dossier a formal response addressing it (e.g., operationalization defense, moderator hypothesis) *prior* to the committee's substantive review.
  4.  **Adjudication Subcommittee (if needed):** If the candidate raises an operationalization or moderator defense, the *ad hoc* subcommittee (see II.3.b) is formed. They review the original paper, replication report, and candidate's defense. They apply the standards in II.3.c & d and issue a brief written determination: "Defense Valid" or "Defense Not Sustained." This determination focuses solely on whether the defense negates the conclusion that the replication is "Relevant" and "directly challenges the original's robustness."
  5.  **Committee Deliberation:** The full committee reviews:
      *   The original paper's impact (citations, influence).
      *   The Relevant Failed Replication report.
      *   The candidate's defense (if any).
      *   The Adjudication Subcommittee's determination (if applicable).
      *   The *overall* strength and impact of the candidate's *entire* research portfolio.
  6.  **Weighting the Finding:** If the replication is deemed "Relevant" and any defense is "Not Sustained," the original paper's contribution is evaluated primarily for its theoretical/conceptual/historical impact, not as robust empirical evidence. If a defense is "Valid," the committee considers the replication less relevant but notes the finding's potential contextual limitations. **The core principle: A Relevant Failed Replication with an Unsustained Defense means the finding cannot serve as a cornerstone of empirical reliability in the candidate's case.**

  **IV. Application to Current Case (Candidate's 2016 Paper):**

  *   **Relevant Failed Replication?** The 12-lab registered replication appears to meet criteria: preregistered, high-powered (8x original N), published null result. Multi-lab design enhances authority. *Assumed "Relevant" unless defense succeeds.*
  *   **Operationalization Defense:** Candidate claims a key feature was dropped. Adjudication Subcommittee must assess: Was the dropped feature documented in the original method? Is there a specific, evidence-based rationale why its absence *fundamentally alters the construct being measured*? Burden is on candidate. If the feature was minor protocol detail or its necessity lacks empirical/theoretical support, defense fails. If it was a core manipulation component *and* its omission demonstrably changes the psychological process under study, defense *may* succeed.
  *   **Moderator Defense (Lab Scatter):** Candidate claims unmeasured moderator. Adjudication Subcommittee assesses: Does candidate propose a *specific*, *plausible* moderator? Is there *any evidence* beyond the scatter itself (e.g., known lab differences on a relevant variable, theory)? Scatter alone is expected in multi-lab studies and suggests heterogeneity but does *not* prove a specific moderator exists or explains the null. Without specificity or evidence, this defense is unfalsifiable speculation and **Not Sustained**.
  *   **Impact on Evaluation:**
      *   *If Operationalization Defense Valid:* The replication's relevance to the original hypothesis is reduced. The 2016 paper retains more empirical weight, but its robustness is still questioned due to the multi-lab null and acknowledged methodological sensitivity.
      *   *If Operationalization Defense Not Sustained (Likely, based on typicality of such claims):* The 2016 paper is **substantially diminished as evidence of a robust empirical phenomenon.** Its high citation count reflects its significant historical impact and role in spurring research (including the replication). However, **it cannot be cited as primary evidence for the reliability of the effect** in the candidate's case for promotion/tenure. Its value lies in its conceptual/theoretical contribution and its catalytic role. The committee must then evaluate if the candidate's *overall* record – including other significant contributions, theoretical advancements, mentorship, grants – remains strong *without* relying on this paper as a pillar of empirical proof.

  **V. Strongest Case Against This Recommendation**

  **Argument for Priya's Bright Line (Modified):** This policy introduces dangerous subjectivity and complexity where scientific rigor demands clarity. Requiring committees to adjudicate "operationalization defenses" invites endless debate over methodological minutiae ("you changed the font size on the instruction sheet!") and allows authors to retroactively redefine their hypothesis when faced with null data. The "plausibly critical" standard is vague and unworkable. Similarly, allowing "unmeasured moderator" defenses rewards unfalsifiable speculation. This policy effectively incentivizes authors to manufacture methodological differences or phantom moderators to deflect replication failures.

  The core scientific principle is that a finding is only robust if it can be reproduced under conditions as close as possible to the original. A large-scale, well-powered, preregistered direct replication *is* the gold standard for assessing this. If it fails, the original finding is not robust. Full stop. Counting a non-robust finding as evidence for promotion undermines the scientific integrity of the tenure process. It rewards flashy but fragile results. The candidate's historical impact (citations) remains, but the finding itself cannot contribute to the *empirical* basis for promotion. Requiring a "direct" replication protects against truly irrelevant attempts; within that constraint, a null result from a vastly superior sample should be decisive. Our policy should unequivocally state: **"A published, preregistered, direct replication attempt with ≥90% power to detect the original effect size that yields a statistically non-significant result (p > 0.05) conclusively demonstrates that the original finding lacks robustness. The original publication retains its value for historical impact and theoretical contribution but cannot be counted as providing robust empirical evidence in support of the candidate's research achievements."** This clarity protects the committee from contentious debates and sends a strong message about the value of reproducibility.

  **VI. Recommendation for Vote:**

  **I move that the committee adopt the policy outlined in Sections II (Definition, Weight, Adjudication Standards) and III (Procedure) of this memo for evaluating the impact of replication attempts on research findings in all future Promotion and Tenure cases.** This policy balances the necessity of acknowledging high-quality replication evidence with the need for scholarly due process when methodological equivalence is contested, while upholding the principle that findings must demonstrate robustness to be counted as primary empirical evidence.
