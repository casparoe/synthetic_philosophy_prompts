  ### Case Construction and Analysis

  **Brainstorming the Design Space**:  
  The goal is a case where the environment (including the substance) is identical, but the community's pattern of use (specifically, expert deference) differs in a way inaccessible to the subjects. Key constraints:  
  - **Fixed**: Physical/chemical environment, subjects' molecular duplicates, dispositions (application, assent, correction, reports, hypothetical responses).  
  - **Varied**: Only the experts' unexercised criteria for the term in counterfactual scenarios.  
  - **Avoiding Collapse**: If the varied parameter affected subjects' dispositions, it would violate constraint 2. Thus, the difference must be in experts' dispositions in circumstances the subjects never encounter and cannot encounter (e.g., due to isolation).  
  - **Mundane Term**: Use a familiar term like "tonic" for a common substance (avoiding microstructure focus).  
  - **Non-Semantic Difference**: Describe the variation as a historical fact about expert definitions (e.g., chemical vs. functional criteria), not as semantic.  

  The chosen case isolates expert deference: subjects are non-experts in isolated communities, identically disposed to defer to experts, but experts have different counterfactual criteria. Environmental externalism ignores this (focusing on actual substance), social externalism relies on it (focusing on expert norms), and internalism ignores it (focusing on subjects' internal states).

