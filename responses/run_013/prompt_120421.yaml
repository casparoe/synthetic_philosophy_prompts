  **Case Name**: "Tonic Villages"  

  **Scenario**:  
  Two isolated villages, Easton and Weston, exist in the same world. Both have identical lakes containing pure ethanol (C₂H₅OH), a common disinfectant and solvent. Villagers in both use the term "tonic" for this liquid. The subjects, Ava (Easton) and Bea (Weston), are non-expert villagers, molecule-for-molecule duplicates with identical life experiences. They apply "tonic" only to their lake's liquid and identical ethanol samples. Their dispositions match perfectly: they would reject other liquids (e.g., water) as "not tonic," report it as "the lake's liquid," and, if uncertain, defer to their village's chemist. They have never encountered non-ethanol liquids or interacted with chemists.  

  The difference lies in the chemists' unexercised criteria. In Easton, the chemist defines "tonic" as ethanol (C₂H₅OH), so she would reject chemically distinct liquids (e.g., isopropanol) even if they looked identical. In Weston, the chemist defines "tonic" as any clear, antiseptic liquid, so she would accept isopropanol as "tonic." This difference is documented in private manuals villagers never access. No non-ethanol liquid exists in either village, and no scenario allows subjects to encounter one or consult the chemists. Thus, the difference never manifests and is inaccessible to subjects.  

  **Fixed Parameters**:  
  - Physical/chemical environment (ethanol lakes).  
  - Subjects' molecular duplication and histories.  
  - Dispositions (application, assent, correction, reports, hypothetical responses).  
  - Actual substance (ethanol).  

  **Varied Parameter**:  
  The chemists' criteria for applying "tonic" in counterfactual scenarios (chemical kind in Easton, functional kind in Weston).  

  **Verdicts by View**:  
  | View | Same Content? | What the Speaker Can Know | Reasoning |
  |------|---------------|---------------------------|-----------|
  | **Environmental Externalism** | Yes | From the inside, speakers know they refer to the liquid in their environment, but not its specific nature. | The actual substance (ethanol) causally grounds the term. Identical environments imply identical reference. The experts' criteria are irrelevant. |
  | **Social Externalism** | No | From the inside, speakers know they defer to experts but cannot know what experts would say in unencountered cases. | Content is fixed by community experts' norms. Easton's "tonic" refers only to ethanol; Weston's refers to any antiseptic liquid. Deference makes this difference constitutive. |
  | **Internalism** | Yes | From the inside, speakers can fully know the content, as it is determined by their internal states. | Identical internal states and dispositions imply identical narrow content. The experts' inaccessible criteria do not affect subjective meaning. |

  **Grid of Verdicts**:  
  | Scenario | Environmental Externalism | Social Externalism | Internalism |
  |----------|----------------------------|---------------------|-------------|
  | **Same stuff, same use** (e.g., both villages have ethanol, chemists have same criteria) | Same | Same | Same |
  | **Same stuff, different use** (this case: ethanol, chemists have different criteria) | Same | Different | Same |
  | **Different stuff, same use** (e.g., Twin Earth: H₂O vs. XYZ, communities have identical use patterns) | Different | Different (experts refer to local substances) | Same |
  | **Different stuff, different use** (e.g., one village uses "tonic" for ethanol, another for methanol with different expert criteria) | Different | Different | Same |

  **Mutual Consistency**:  
  - Environmental and internalism are consistent (same in all cells except different stuff/same use).  
  - Social externalism is inconsistent with environmental in same-stuff/different-use (our case) and inconsistent with both in different-stuff/same-use.  
  - **Breaking cell**: Same-stuff/different-use creates disagreement: social vs. environmental/internalism.  

  **Load-Bearing Feature**:  
  The chemists' unexercised counterfactual criteria for applying the term.  

  **Removal Test**:  
  If the chemists' criteria are made identical (e.g., both chemical), we land in same-stuff/same-use, where all views agree on same content.  

  **Internalist Reply**:  
  The internalist argues that content is exhausted by the subject's internal states and dispositions, which are identical. Social externalism erroneously inflates meaning with inaccessible, community-wide facts, conflating semantic content with metaphysical contingencies about experts. Since subjects cannot know or be affected by the chemists' criteria, those criteria cannot alter what "tonic" means to them.  

  **Constraints Jointly Satisfiable**: True.  
  - **Conflict**: None. Constraint 2 (identical dispositions) is met by ensuring the varied parameter (experts' criteria) has no actual or possible impact on subjects. Constraint 3 is met by describing the difference as chemists' definitions (chemical vs. functional), not semantic properties.  

  **Spec Check**:  
  - Constraint 1: Met—same world, villages, ethanol lakes; term "tonic" is everyday.  
  - Constraint 2: Met—subjects' dispositions identical; no access to chemists or counterfactuals.  
  - Constraint 3: Met—variation stated as chemists' criteria (chemical vs. functional), not semantic.  
  - Constraint 4: Met—environmental and social disagree in same-stuff/different-use; internalism agrees with environmental.  
  - Constraint 5: Met—grid filled; focus on same-stuff/different-use.  
  - Constraint 6: Met—mundane villages, chemists, ethanol; no exotic elements.  

  **Confidence**: Moderate.  
  - **Justification**: The case satisfies all constraints, but social externalism's reliance on unmanifested expert dispositions is debatable. Some may argue that deference requires actual community interaction to affect content.  

  **Least Confident Claim**:  
  That social externalism assigns different content in the same-stuff/different-use case.  
  - **Reason**: Social externalism might not apply if deference is never exercised, making content indeterminate without real-world manifestation.  

