answer: |-
  ### Essay Question  
  **Diagnostic Taxonomy of Model Assumptions**  
  The fisheries model described relies on three false assumptions: (a) stock size is unaffected by individual catches; (b) fishers know future recruitment; (c) fleet behaviour is captured by a single representative fisher. Using this case:  
  1. Classify each assumption by the **type of failure** it represents (e.g., idealization, false empirical claim, methodological fiction). Justify your taxonomy.  
  2. For each, explain **what Friedman’s criterion** (that predictive accuracy justifies unrealistic assumptions) **licenses and fails to license** in its defence.  
  3. Identify which assumption (if any) **cannot be strictly true/false** and defend your view. What follows for the model’s assessment if this is correct?  
  4. Specify **what a broader criterion for assumption-assessment** must require beyond predictive success to distinguish these failures meaningfully.  

  *(Answer in 50 minutes; structure arguments clearly.)*  

  ---

  ### Model Answer (700 words)  

  This fisheries model’s assumptions exemplify distinct epistemic weaknesses requiring diagnostic classification. While Friedman’s instrumentalism (prioritizing predictive success over assumption realism) offers partial defences, it obscures critical vulnerabilities exposed by the stock collapse. A defensible assessment criterion must thus incorporate *explanatory robustness* and *pragmatic adequacy*.  

  **1. Taxonomy of Failures**  
  Assumption (a) (*stock unaffected by individual catches*) is a **deliberate idealization**. It isolates systemic fleet effects by neglecting marginal individual impacts—a simplification common in population dynamics. Its falsity is non-accidental; it serves tractability.  
  Assumption (b) (*fishers know future recruitment*) is a **false empirical claim**. It misrepresents agents’ epistemic capabilities, asserting knowledge (of stochastic environmental events) that fishers demonstrably lack. This is an error, not a simplification.  
  Assumption (c) (*single representative fisher*) is a **methodological fiction**. It aggregates diverse agents into a homogeneous entity, ignoring strategic interactions and preference conflicts. Unlike (a), it imposes structural homogeneity where heterogeneity exists; unlike (b), it is not directly testable.  

  **2. Friedman’s Criterion: Licenses vs. Limitations**  
  Friedman’s view licenses defending (a) *if* predictions hold: idealizations are permissible tools for isolating key variables. However, it fails to mandate scrutiny of *when* such neglect becomes consequential (e.g., near stock collapse, where marginal impacts compound).  
  For (b), Friedman licenses the assumption *retrospectively* due to past predictive success. Yet it cannot excuse *prospective* use: false knowledge-claims undermine predictive reliability when conditions change (e.g., unexpected recruitment shifts), as occurred here. Accuracy over fitted data does not entail robustness.  
  For (c), Friedman permits fictional constructs if they “work.” But this ignores whether the fiction *misrepresents causal dynamics*. Aggregating preferences masks intra-fleet competition (e.g., race-to-fish incentives), risking systematic bias in policy advice.  

  **3. The Status of (c) and Implications**  
  Assumption (c) is not strictly truth-apt. It is a *pragmatic construct*: its validity hinges on whether aggregation adequately serves the model’s purpose, not on correspondence to reality. Preferences cannot be “averaged” without arbitrariness; the representative agent is a heuristic, not a description.  
  If (c) lacks truth value, assessment shifts from falsity to *functional adequacy*. Does the fiction generate reliable guidance despite heterogeneity? Here, its failure is evident: by erasing strategic behaviour, the model likely underestimated overfishing incentives during stock decline. Predictive success in fitted data may mask dynamic inadequacy—a risk Friedman overlooks.  

  **4. Beyond Friedman: Toward a Sufficient Criterion**  
  Friedman’s predictive standard cannot distinguish among (a)’s tolerable simplification, (b)’s empirical falsehood, and (c)’s functional fragility. A sufficient criterion requires:  
  - **Explanatory robustness**: Whether assumptions permit tracing *how_ predictions arise (e.g., (b) obscures causal pathways by imputing impossible knowledge).  
  - **Pragmatic adequacy**: Whether assumptions align with the model’s *context of use*. For (c), this demands testing whether aggregation preserves emergent fleet behaviour under stress (e.g., via sensitivity analyses).  
  - **Failure mode awareness**: Mapping which assumptions risk breakdown under specific conditions (e.g., (a) fails at low stocks; (c) fails under competition).  

  In this case, (a) might be defended post-collapse with adjustments for density dependence, (b) requires replacement with probabilistic beliefs, and (c) necessitates agent-based refinement. Predictive success alone, per Friedman, justified complacency; a multi-dimensional criterion would have flagged these assumptions’ divergent risks earlier.  

  ---

  ### Marking Scheme (20 marks total)  
  | **Criteria**                                                                 | **Marks** | **Common Errors** |  
  |----------------------------------------------------------------------------|-----------|-------------------|  
  | **Taxonomy (5 marks)**                                                                                                |           |                   |  
  | Correctly classifies (a) as idealization, (b) as false empirical claim, (c) as methodological fiction. Clear justification. | 5         | Conflating (a)/(c) as "idealizations"; treating (b) as a simplification. |  
  | **Friedman Analysis (4 marks)**                                                                                     |           |                   |  
  | For each assumption, accurately states what Friedman’s criterion licenses *and* what it fails to address. | 4 (3×1 + coherence) | Only defending assumptions via prediction; not identifying limitations (e.g., ignoring (b)’s prospective fragility). |  
  | **Status of (c) (5 marks)**                                                                                         |           |                   |  
  | Argues (c) is not truth-apt (e.g., pragmatic/functional). Implications: shifts assessment to adequacy-in-context, exposing hidden fragility. | 5         | Calling all assumptions "false"; no implications drawn for model assessment. |  
  | **Enhanced Criterion (6 marks)**                                                                                    |           |                   |  
  | Proposes *explanatory robustness* and *pragmatic adequacy* (or equivalents). Explicitly shows how they distinguish failures Friedman cannot. | 6         | Vague appeals to "realism"; no concrete additions beyond prediction. |  

  ---  
  **Notes for Grading**:  
  - **Taxonomy**: Award 3 marks for partial classification (e.g., misidentifying (c)), 5 only for precision.  
  - **Enhanced Criterion**: Must name *at least two* distinct requirements (e.g., explanatory + pragmatic).  
  - **Top answers (18–20)**: Seamlessly integrate all sections, showing how taxonomy informs criterion design.  
  - **Mid-range (10–14)**: Correct but disjointed analysis; misses implications of (c)’s non-truth-apt status.  
  - **Low (<10)**: Reverts to generic Friedman objections; no taxonomy; neglects (c)’s special status.
