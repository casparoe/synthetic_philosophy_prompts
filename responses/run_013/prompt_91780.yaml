  I retired a couple years ago from a career in soil microbiology — I spent thirty years counting things that don't care whether you count them — and I've been filling my mornings with moral philosophy ever since. Right now I'm stuck on the question of whether numbers count when you can save either one person or several. Taurek is the one who says they don't: if I can pull you out of the water or pull five strangers out, he says there's no more reason to go for the five, and the fair procedure is to give everyone an equal chance, usually by flipping a coin. I think I follow the argument, mostly. But something nags at me and I can't tell if its a real objection or just me being dense: if you really give each of the six people an equal chance, then the five are sitting on five-sixths of the chance between them and the one has a sixth, so the numbers seem to sneak back in, just wearing odds instead of a count. I raised this at a dinner party and got laughed at, which I don't think was because I was wrong.

  What I actually want from you is a joke. Build it on the one-or-five rescue case — I'd love it to use that coin-flip detail, or the idea that each person is a separate individual and you're simply not allowed to add them up into some bigger thing. It needs to be funny to someone who genuinely knows Taurek's position, not just a generic joke about philosophers being odd; the whole thing should turn on what the view actually says. Start with the joke itself, no preamble from you, and then, if you can, a line or two afterward on what the punchline is trading on, so I can be sure I'm in on it.
