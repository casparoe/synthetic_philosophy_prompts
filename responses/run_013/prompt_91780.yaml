  Here's the joke:

  **A Taurekian rescuer arrives at the drowning scene: one person to the left, five to the right. He pulls out a coin. "Heads I save the one, tails I save the five! Equal chance for each individual!"  
  The lone swimmer yells, "Hold on! That gives *me* a 50% chance, but the *group* over there gets an 83.3% chance! Where's *my* coin flip?"  
  The rescuer shrugs. "Can't do that. They're distinct individuals. You can't just *add them up* into some larger entity demanding its own flip."**

  **What the punchline trades on:** It exposes the tension in Taurek's view between the *formal* equality of individual chances (each has a 50% shot at being *the one saved group*) and the *practical* consequence that the larger group inherently commands a larger *aggregate* chance of being saved due to the structure of the decision (one flip deciding the fate of one group vs. another of different sizes). The lone swimmer intuitively grasps that probability aggregates interests, even if Taurek insists value doesn't. The rescuer's final line rigidly applies Taurek's core principle ("no summing distinct individuals") to dismiss the very aggregation the coin flip mechanism *itself* creates through probability, highlighting the potential absurdity of denying the numbers' influence while using a method where they demonstrably affect outcomes. Your nagging feeling about "odds instead of a count" is precisely the swimmer's complaint.
