  Themes: The danger of literal truth used maliciously, the limitations of ethical frameworks, and the impact of words beyond their factual accuracy.

  Avoid lectures: Use scenes and dialogue to demonstrate the concepts. For instance, show townspeople reacting to Silas's words, misinterpretations leading to consequences. Elara's investigation can involve conversations with victims, revealing how Silas's truths were twisted.

