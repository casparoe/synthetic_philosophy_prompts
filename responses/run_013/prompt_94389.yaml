        - We address this at the beginning: we are trying to clarify the concepts. But note that there are testable consequences (like no-go theorems) that show the difference is substantive.

     d) "Epistemic view is just instrumentalism." 
        - Instrumentalism says we shouldn't care about reality, only predictions. Epistemic view can be realist: there is a reality, and the wavefunction represents our knowledge of it. So we address this when defining the views.

