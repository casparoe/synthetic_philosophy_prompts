prompt: |-
  I'm a postdoc in a quantum information group, and I have been talked into running the opening session of a new reading group on the philosophy of quantum mechanics, which will be attended by eight or nine graduate students who treat the word interpretation roughly as a term of abuse and who will be sitting in a seminar room with one whiteboard and bad coffee for seventy-five minutes. The topic I have been handed is whether the wavefunction is real, meaning the disagreement between the views on which the quantum state describes the world and the views on which it describes somebody's knowledge or information. I don't want the debate explained to me; I know it well enough to be unsure how to teach it. I want a plan. Tell me the order the ideas have to come in and what depends on what. My own sense is that the session stands or falls on whether they first learn to keep three things apart — the state as a piece of mathematics inside a formalism, the state as a claim about how things are, and the state as a summary of what someone knows — and that the question only becomes well formed for them once they see that the classical analogy, in which an epistemic state is a distribution over definite underlying conditions, is a contestable model of quantum states rather than the default reading of the word knowledge. Tell me where the load-bearing step in that sequence is, and where I should be willing to lose time.

  I would also like the whole session carried by one example rather than five, and I have a candidate I distrust. I have been using the case of two labs that prepare the same mixed state by different recipes, one by mixing equal numbers of a pair of orthogonal states and the other by mixing equal numbers of a different orthogonal pair that happens to yield the same density matrix, and it always teaches the wrong lesson: the students come away with the picture in which the state is ignorance about a definite underlying condition, which is exactly the reading I want them to see as a claim rather than as common sense. Should that case carry the session anyway, and if not, what should, and what does whatever carries it have to have and to lack in order not to smuggle in the answer? Then the misconceptions. I can already predict a few — that an epistemic view means the state is in somebody's head, or is just instrumentalism; that an ontic view means the wavefunction is a physical wave in space like a water wave; that a no-go result rules out epistemic readings period, rather than under an assumption about preparation independence that nobody has independently motivated; that the whole dispute is verbal and would be settled by a good dictionary. I want the rest of the list, in the order they will actually surface in that room, and for each one the exact point in the sequence where I should head it off rather than merely correct it afterwards, plus any that I should deliberately leave standing for ten minutes because defusing it early would cost me a dependency it happens to be sitting on.

  Finally, tell me what I should openly refuse to cover at this level and admit I am refusing: the full proof of the no-go theorem, the details of the ontological-models framework, the toy models that reproduce various quantum phenomena while treating states as epistemic, the agent-centred views. Tell me what the single closing question should be, something answerable in a sentence, that would show me whether they have understood the question rather than merely picked up the vocabulary, and say plainly what I should do with the remaining time if the answer to that question is the wrong one. I don't need citations, a reading list, or any suggestions for further reading; I have the papers, and what I cannot reconstruct from them is the teaching. Write the whole thing in continuous prose, with no headings, no bullet points or numbered lists, no bold or italicised text and no tables, the way you would set it out in an email to a colleague who is about to teach the same session.
reasoning: |-
  We are designing a 75-minute introductory session for graduate students in quantum information who are skeptical about "interpretation" discussions. The goal is to frame the debate about the reality of the wavefunction (ontic vs epistemic views) without getting bogged down. The key is to carefully separate three aspects: the state as a mathematical object, as a description of reality, and as representing knowledge. The classical analogy (where an epistemic state is a probability distribution over an underlying ontic state) must be presented as a model that is contested in the quantum case, not as the default meaning of "knowledge".

  The session should be built around one central example. The user distrusts the usual mixed-state example (two labs preparing the same density matrix by different mixtures) because it reinforces the classical ignorance perspective. We need an alternative example that does not presuppose the ontic/classical model. I propose using a simple quantum scenario that highlights the difference between ontic and epistemic views without relying on mixtures. A good candidate is the double-slit experiment, but we need to avoid getting mired in details.

  Alternatively, consider a qubit example: preparing a qubit in the state |0> versus preparing it in a state that is a 50/50 mixture of |0> and |1> (by classical randomness). The problem is that this again uses mixtures and might lead to the same pitfall. Instead, we can use the fact that in quantum mechanics, the same measurement statistics can arise from different preparations, but that is similar to the mixed-state example.

  Another idea: use the phenomenon of interference to show that the wavefunction cannot be merely epistemic in the classical sense. For instance, if we prepare a qubit in the state |+> = (|0>+|1>)/√2, then the probabilities for measurements in the computational basis are 50/50, but if we rotate the basis, we see interference. Compare this to a classical coin: if we have a fair coin, we get 50/50 in any orientation? Not exactly. But in quantum, the state |+> is not equivalent to a classical 50/50 mixture because it exhibits coherence.

  However, the user wants to avoid examples that smuggle in the answer. So let's design an example that sets up the question without resolving it. We can use a simple preparation and measurement scenario and then ask: what is the status of the wavefunction in this case?

  Proposed example: a single qubit prepared in the state |0>. We measure it in the computational basis and get 0. Then we prepare another qubit in |0> and measure in the X basis. We get 50/50 outcomes. Now, what does the wavefunction represent? Is it a real physical state that causes these outcomes? Or is it just a way to encode our expectations? But this is too vague.

  Better: contrast two ways of thinking about the state |+>. 
  1. (Ontic) The system is actually in a state of superposition, meaning that it has a property that is not definite in the computational basis but is definite in the X-basis (with value +1). 
  2. (Epistemic) The system is actually in either |0> or |1> (or some other underlying state), but we don't know which, and the wavefunction |+> represents our lack of knowledge. 

  But the problem is that if we say the system is in |0> or |1> then we cannot account for the interference when we do a Hadamard and then measure. So the epistemic view must be more subtle: the underlying state is not necessarily |0> or |1> but something else. This is where we introduce the idea that in an epistemic view, the wavefunction represents knowledge about some underlying reality (ontic state) that is not directly the quantum state. The ontic view says the wavefunction is part of the ontic state (or is the complete description).

  We can then point out that the classical analogy (epistemic state as probability distribution) leads to a model that can be tested. For instance, in the double slit, if the particle were really going through one slit or the other (ontic state) and we just didn't know, then we wouldn't get interference. But we do, so the wavefunction cannot be epistemic in that naive way. This is the kind of argument we want to avoid in the first session because it uses a no-go result. So we must be careful.

  Alternatively, we can set up the problem without resolution. The example should be a scenario where both views can be articulated and then we see the tension. But the user wants to avoid multiple examples. So let me propose:

  Use the example of a qubit in a known pure state, say |0>. Then ask: what does this state represent? 
  - Mathematical: a vector in Hilbert space. 
  - Ontic: the system has a property that determines the outcome of a Z-measurement (and also constrains outcomes of other measurements). 
  - Epistemic: we know that if we measure Z, we'll get 0, but the system might have other properties we don't know about.

  Then we can note that for a mixed state, the ontic view might say that the system is in a pure state but we don't know which (so the density matrix is epistemic) or that the system is in a fundamental mixed state (which would be ontic). But that might lead to the same problem.

  Alternatively, we can use the fact that in quantum mechanics, non-orthogonal states cannot be perfectly distinguished. This is often taken as evidence for an epistemic view: if the states were really distinct in reality, why couldn't we tell them apart? But the ontic view might say that the states are distinct but the measurement process is limited.

  But again, that might be too advanced. 

  After reflection, I think we should stick with the mixed-state example but reframe it. The user's concern is that it reinforces the classical ignorance view. So let's use it to expose the problem. We present the two labs: 
  Lab A: prepares a qubit by randomly choosing |0> or |1> with 50% probability. The density matrix is I/2.
  Lab B: prepares a qubit by randomly choosing |+> or |-> with 50% probability. The density matrix is also I/2.

  Now, if we only do measurements in the computational basis, we cannot tell the difference. But if we measure in the X basis, then for Lab A, we get 50/50 in the X basis, and for Lab B, we get definite outcomes: each qubit is either |+> or |-> so when we measure X we get +1 or -1 with certainty? Wait, no: if we measure X on a |+> state we get +1, and on |-> we get -1. But in Lab B, we are preparing a mixture of |+> and |->, so when we measure X, we get +1 or -1 each with 50% probability? Actually, yes. So the statistics are the same for both preparations for any measurement? Because I/2 is invariant under unitary transformation. So the two preparations are operationally indistinguishable.

  Now the question: what is the meaning of the density matrix I/2? 
  - If we take an ontic view, we might say that the system has an underlying state that is either |0>, |1> in Lab A or |+>, |-> in Lab B, but the density matrix does not tell us which. So the density matrix is epistemic. 
  - But what if we take the ontic view that the quantum state is real? Then for Lab A, the system is really in a pure state (either |0> or |1>) and the density matrix represents our ignorance. For Lab B, the system is really in a pure state (either |+> or |->). But then the same density matrix corresponds to two different underlying realities. This is the key: the density matrix does not uniquely determine the underlying ontic state. 

  Now, the ontic view of the wavefunction (for pure states) would say that the wavefunction is part of the ontic state. But for mixed states, it's more complex. The epistemic view of the wavefunction (for pure states) would say that even a pure state is a state of knowledge. So in Lab A, when we prepare |0>, that is a state of knowledge? But then how do we account for the fact that |0> and |+> are non-orthogonal and cannot be distinguished? 

  This example does not directly address pure states. However, we can use it to set up the question: is the quantum state (even pure) a state of knowledge? And then we see that the classical analogy (where knowledge is about an underlying ontic state) leads to a model that may not hold in quantum mechanics.

  The user's concern is that this example reinforces the classical ignorance view. But we can use it to show that the classical model is problematic. We can point out that in the classical case, if two preparations yield the same statistical distribution, we can still say that the underlying state is either from set A or set B, but in quantum mechanics, the underlying state in Lab A (|0> or |1>) is different from that in Lab B (|+> or |->). Moreover, the set {|0>, |1>} is not the same as {|+>, |->}. But the density matrix is the same. So if we want to say that the density matrix represents our knowledge, then what is the underlying reality? It cannot be the same underlying reality for both preparations because the pure states in each preparation are different. 

  This leads to the idea that the underlying reality (ontic state) must be different from the quantum state. And then we can introduce the distinction: 
  - In an ontic model, the quantum state is part of the ontic state (so two different pure states correspond to non-overlapping ontic states). 
  - In an epistemic model, a single pure state corresponds to a set of ontic states, and non-orthogonal pure states correspond to overlapping sets.

