  So let's try to structure the session without going into proofs or formal frameworks.

  Plan:

  1. (5 min) Introduction: The wavefunction is central to quantum mechanics. But what is its status? We use it to predict probabilities, but does it describe reality or our knowledge? Today we will try to clarify the question.

  2. (15 min) Three ways to think about the quantum state:
     a) Mathematical: a vector (or density matrix) in a Hilbert space. This is uncontroversial but uninformative.
     b) Descriptive (ontic): the state describes how the system is objectively. The wavefunction is real.
     c) Epistemic: the state describes what we know about the system. It is information.

     Emphasize: these are not mutually exclusive in an obvious way. For instance, in classical mechanics, we have both: the system has an objective state (position and momentum) and we can have an epistemic state (a probability distribution) that describes our knowledge. But in quantum mechanics, we don't have an agreed-upon underlying state.

     The classical analogy: when we say "epistemic", we often think of a probability distribution over an underlying ontic state. But is that the only way to think about knowledge? And is it applicable to quantum states? We will see that this classical model is a particular way of understanding the epistemic view and that it is not the only possibility. Moreover, it is contested.

  3. (25 min) The central example: two preparations of the same density matrix.
     - Lab A: randomly prepares |0> or |1> with 50% probability. The density matrix is diag(1/2,1/2).
     - Lab B: randomly prepares |+> or |-> with 50% probability. The density matrix is also diag(1/2,1/2).

     We cannot distinguish these preparations by any measurement. Now, what does the density matrix represent?

     - If we take an ontic view of the quantum state, then in Lab A, each system is either in the ontic state |0> or |1> and we don't know which. In Lab B, each system is either in the ontic state |+> or |->. But note that |0> and |+> are different quantum states. So the underlying ontic states (if we identify them with the quantum states) are different in the two labs. But the density matrix is the same. So the density matrix does not uniquely specify the underlying ontic state. Therefore, if we want the density matrix to be ontic, we must allow that the same density matrix corresponds to multiple ontic states? But that is already the case in classical statistics. However, in quantum mechanics, we are considering the pure states as ontic. So we have a problem: the density matrix I/2 can be prepared in multiple ways, and each way corresponds to a different set of pure states. Therefore, if we take an ontic view of pure states, then the density matrix is a mixture of ontic states and thus represents our ignorance about which pure state the system is in.

     - But what about a pure state? Consider a system prepared in |0>. What does that mean? On the ontic view, the system is objectively in the state |0>. On the epistemic view, it means we have some knowledge: we know that if we measure Z, we will get 0. But we might not know the outcome of an X measurement. 

