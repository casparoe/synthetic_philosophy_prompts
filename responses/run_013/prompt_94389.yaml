     The point of the example is to show that the epistemic view as modeled by the classical analogy is natural but not forced upon us. And that the ontic view for pure states is also natural. The debate is about which one is correct.

  4. (15 min) Common misconceptions and when to address them:

     a) "Epistemic view means the wavefunction is in someone's head." 
        - We address this when introducing the epistemic view: knowledge is not necessarily in a mind; it can be an objective feature of an agent's relation to the system. But we must be careful: the knowledge is about the system, and the system exists independently.

