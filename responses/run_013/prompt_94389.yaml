  Write as continuous prose:

  Dear colleague,

  For your opening session on whether the wavefunction is real, I suggest the following plan. The session’s success hinges on establishing a clear distinction among three roles of the quantum state: as a mathematical object within a formalism, as a description of objective reality (the ontic view), and as a representation of knowledge or information (the epistemic view). The pivotal step is dismantling the assumption that the epistemic view must be modeled classically—as a probability distribution over definite underlying states—by showing that this model is a substantive claim rather than the default meaning of "knowledge." Without this, the debate collapses into confusion. I recommend allocating the first quarter of the session to this separation, as it is load-bearing. If you lose time elsewhere, sacrifice the later elaboration of pure states, but do not rush the initial distinction.

  The classical analogy is both essential and dangerous. Introduce it explicitly: in classical mechanics, we distinguish the system’s actual state (e.g., a phase space point) from an epistemic state (a probability distribution over phase space). Stress that this is one model of what "knowledge" could mean in quantum theory—but it is not the only possibility, and it may not fit. The moment when you contrast this classical model with the quantum case is where misconceptions arise, so tread carefully. The most critical misconception to preempt is that an epistemic view reduces to instrumentalism or subjectivity; clarify that an epistemic view can be realist (there is an underlying reality, and the state captures our incomplete knowledge of it) without requiring the classical probability model. Address this when defining the epistemic view, not as an afterthought.

  For the central example, I agree that the two-lab mixed-state preparation risks reinforcing the classical ignorance picture. However, it remains the most accessible way to surface the core tension. Use it, but with a twist: present Lab A (mixing |0〉 and |1〉) and Lab B (mixing |+〉 and |-〉) yielding the same density matrix. Instead of using it to argue for either view, deploy it to expose what each view must say. For the ontic view of pure states, the systems from Lab A are objectively either in |0〉 or |1〉, while those from Lab B are objectively in |+〉 or |-〉—so the underlying realities differ. For the epistemic view (classically modeled), the density matrix represents identical knowledge about an underlying state λ, but λ itself could be configured differently in each lab. Highlight that this classical model is contested—it might not work for quantum pure states—and that the example illustrates the debate without resolving it. The example’s virtue is that it lacks interference or non-commuting measurements, avoiding a premature rush to no-go theorems. What it must do is force the question: does the same density matrix imply the same underlying reality? If students walk away assuming the classical model is inevitable, you have failed; counteract this by repeatedly emphasizing that the classical model is an optional interpretation of "epistemic," not a given.

  Expect misconceptions in this order: 
  1. "Epistemic means the wavefunction is in the mind" (correct this when defining epistemic, stressing that knowledge is relational but objective). 
  2. "Ontic means the wavefunction is a physical wave" (correct when defining ontic, noting it is a mathematical representation of physical properties).
  3. "This is all verbal semantics" (address when contrasting the views, noting that no-go theorems show empirical stakes). 
  4. "Epistemic is just instrumentalism" (correct during the epistemic definition). 
  5. "No-go theorems kill epistemic views" (address if raised during the example, stressing assumptions like preparation independence). 
  6. "But what about collapse?" (postpone, as dynamics are out of scope). 
  Deliberately leave misconception 5 unaddressed until it surfaces during the example discussion, as correcting it requires invoking no-go theorems, which you wish to avoid. If it arises earlier, acknowledge it and defer.

  Openly refuse to cover: the proofs of no-go theorems (PBR, etc.), the formal apparatus of ontological models, toy models (e.g., Spekkens), and agent-centered views (QBism). State this upfront and reiterate when these topics inevitably arise. Say plainly: "This session is about framing the question, not answering it."

  The closing question should be: "In the two-lab example, is the underlying physical reality of a system from Lab A the same as that from Lab B? Why or why not?" The right answer is not a specific yes/no but a recognition that: 
  - Ontic views (for pure states) say no, because the pure states in the ensembles differ. 
  - Epistemic views (classically modeled) might say the underlying λ could be the same type of state, but the knowledge is identical. 
  If they answer uniformly "yes, because the density matrix is the same," they have missed the ontic view. If they say "no, because the preparations differ," they have grasped the distinction. If the majority answers wrongly, use the remaining minutes to revisit the ontic view’s claim that pure states describe distinct realities. Do not introduce new examples; reanchor the discussion in the two-lab case.

  Finally, the bad coffee is a given; the whiteboard is your friend. Sketch the two preparations and the density matrix. Use arrows to contrast the underlying states under each view. Keep the notation minimal. Good luck.
answer: |-
  Start by grounding the session in a concrete operational scenario: a qubit prepared in a specific quantum state. Use the state \( |0\rangle \), but immediately stress that our focus isn't on predicting measurements (they already know how to compute probabilities), but on what the state represents metaphysically. Declare upfront that we're separating three concepts: the quantum state as a mathematical tool in a formalism, as a description of physical reality (the "ontic" view), and as a representation of knowledge or information (the "epistemic" view). Spend the first fifteen minutes unpacking this trichotomy rigorously. The load-bearing step is here—if they conflate these, the rest collapses. Explicitly dissect the classical analogy: in classical mechanics, an epistemic state (a probability distribution) summarizes ignorance about an underlying definite state (e.g., a phase-space point). Emphasize that this is a model—one way to interpret "knowledge"—but not the only way, and certainly not a default for quantum states. If you lose time, sacrifice later nuances, but not this separation. Correct two misconceptions immediately: (1) "epistemic" doesn't mean the state is "in someone's head" (it can be objective information about reality), and (2) "ontic" doesn't mean the wavefunction is a physical wave in space (it's a mathematical object encoding properties).  
    
  Move to your candidate example—the two labs preparing the same mixed state via different orthogonal mixtures—but reframe it to avoid smuggling in classical ignorance. Present Lab A (mixes \( |0\rangle \) and \( |1\rangle \)) and Lab B (mixes \( |+\rangle \) and \( |-\rangle \)), both yielding \( \rho = I/2 \). Instead of using it to illustrate ignorance, pose it as a paradox: operationally, the labs are indistinguishable, yet they involve distinct sets of pure states. Ask what this implies about the underlying reality. The ontic view (pure states as real) says the physical states differ: Lab A systems are objectively \( |0\rangle \) or \( |1\rangle \), Lab B systems are objectively \( |+\rangle \) or \( |-\rangle \). The epistemic view (classically modeled) says the pure states represent knowledge about a deeper reality \( \lambda \), so \( \rho \) summarizes identical ignorance, but \( \lambda \) might differ between labs. Stress that this classical model—epistemic states as probability distributions over \( \lambda \)—is a hypothesis, not a necessity. The example's value is that it surfaces the question: does sameness of \( \rho \) imply sameness of underlying reality? It lacks interference or noncommutativity, preventing premature resolution. Where students slip into assuming the classical model is inevitable, intervene: "Is this probability-over-\( \lambda \) structure part of the definition of 'knowledge,' or is it a specific claim we're testing?"  

  Expect misconceptions in this sequence: after defining epistemic views, someone will conflate them with instrumentalism ("so it's just a tool for predictions?"). Correct instantly: epistemic views can be realist (there is a reality, the state describes our partial knowledge). During the two-lab discussion, someone will say "this is all semantics" or "just about the word 'real.'" Parry by noting that no-go theorems (e.g., PBR) show empirical stakes, but we're not diving into proofs. Mid-example, a student will assert "but no-go theorems kill epistemic views"—deliberately let this stand for ten minutes because defusing it requires mentioning preparation independence, which depends on understanding the classical model first. After the example, correct: these theorems assume conditions like preparation independence, which epistemic views might reject. Late in the session, someone will ask about wavefunction collapse or many-worlds; table it as beyond scope.  

  Openly refuse to cover: proofs of no-go theorems (too technical), ontological models framework (too abstract for session one), toy models like Spekkens' (distracting here), and agent-centered views like QBism (a subtopic). State this when introducing the debate and repeat if needed: "We're mapping the territory, not touring every village."  

  End with a closing question: "In the two-lab example, does the fact that both preparations yield the same density matrix imply that a system from Lab A has the same underlying physical state as one from Lab B? Justify briefly." The right answers articulate the ontic-epistemic divide: "No, if pure states are real, the underlying states differ between labs" or "Yes, if \( \rho \) fully captures identical knowledge about the same \( \lambda \)." Wrong answers (e.g., "Yes, because they're operationally identical") miss the metaphysical dispute. If most answers are wrong, use remaining time to re-sketched the two views using the lab example, asking: "If you claim the underlying reality is the same, what is it? If different, in what way?" No new examples—hammer the dichotomy with what they have.  

  The session lives or dies on the initial trichotomy and the reframed two-lab case. Trust your distrust of the example—it’s flawed but fixable. Use the whiteboard to contrast the three state roles and the lab setups. Bad coffee is inevitable; clear thinking isn’t.
