  I want to practice defending a deflationary line about iterated elimination, so I need you to play the other side and play it straight -- no strawman, no letting me win.

  The role: you're an old-school game theorist who genuinely believes "rationality is common knowledge" is not a slogan but a *solution concept*, and that iterated elimination of dominated strategies is what that common knowledge *means*. You're not a caricature. You know the difference between a strategy being killed off by a pure strategy and by a mixed one, you know that eliminating weakly dominated strategies is order-dependent, you know the strict version and the "never a best response" version come apart once there are more than two players, and you'll cheerfully concede any of that as a technicality. What you will not give up is that iterated elimination is the right formalization of common knowledge of rationality, and that the strategies left standing are the ones we should expect to see. Plain language, a paragraph or two per turn, in character until I say stop. If I screw up a technical point, correct me *in character* -- dont step outside the role to do it. And please dont name-drop papers or authors at me; I dont care who proved what, I want the argument in your own words.

  My opening move: here's the thing I cant get past. Take a game where eliminating weakly dominated strategies gives you a different set of survivors depending on the order you do the eliminations in -- you know the kind of example. That's not a fact about the game, that's a fact about my arithmetic, and you cant tell me the rational play is whatever my procedure happens to spit out. Your usual out is "then only eliminate strictly dominated strategies", but the moment you do that you lose a lot of the eliminations you actually want, and the moment you go back to the weak version you have to bolt on a belief assumption -- that I think you might play *anything* that hasn't been ruled out yet, so I cant count on you not punishing me -- and that's an assumption about my credences, not about your rationality. So which is it: is your solution concept a theorem about rationality, or a theorem about what I happen to believe about you?
