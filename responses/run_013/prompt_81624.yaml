  Wait, checking case 2: does it really distinguish accounts? Yes! Etiological says "historical grip function", causal-role says "no current function", propensity says "no function". That's three different answers. Perfect. 

  Model answer structure: Start by defining each account. Then analyze all five cases systematically. Defend etiological by arguing case 4's "no selection possible" shows why propensity fails. Concede that causal-role is useful for physiologists but isn't real "function". 

  Marking scheme must include: identifying case 1 disagreement (etiological vs propensity), recognizing case 5 agreement, explaining why confusing "useful now" with function is wrong, and properly defending an account against its toughest case. Full marks only if they nail all five must-hit points without the listed confusions. 

  This should make students sweat. Exactly what the professor wants.
answer: |-
  ### Essay Question  
  **Analyze the status of the "notch" wing feature across the five described scenarios using the etiological (selected-effects), causal-role (systems), and propensity accounts of biological function. Identify at least one scenario where two accounts categorically disagree and explain why. Defend *one* of these accounts (or a precisely articulated two-concept view) against the scenario that poses the strongest challenge to it, addressing what this defense compromises in another scenario. Your answer must engage all five cases.**  

  ---

  ### Model Answer (Etiological Defense; ~800 words)  
  *(Position: The friend was correct – function requires historical selection. Non-historical accounts conflate function with mere causal contribution.)*  

  **I. Account Definitions**  
  - **Etiological (Millikan/Neander)**: Trait *X* has function *F* iff *X* was *selected for* doing *F* in ancestral populations.  
  - **Causal-Role (Cummins)**: Trait *X* has function *F* iff *X* currently contributes *F* to a complex capacity *C* of its containing system.  
  - **Propensity (Bigelow/Pargetter)**: Trait *X* has function *F* iff *X* currently confers a survival/reproduction propensity by doing *F* in *X*’s environment.  

  **II. Analysis of Cases**  
  1. **Recent Drift, Current Advantage**:  
     - *Etiological*: **No function**. Notch spread via drift, not selection.  
     - *Causal-Role*: **Flight-stability function**. Contributes to flight steadiness.  
     - *Propensity*: **Flight-stability function**. Enhances survival propensity now.  
     *→ Disagreement*: Etiological denies function; others affirm it.  
  2. **Ancestral Grip, No Current Contribution**:  
     - *Etiological*: **Gripping function** (historical selection).  
     - *Causal-Role*: **No function**. No current systemic contribution.  
     - *Propensity*: **No function**. No current fitness propensity.  
  3. **Ancestral Grip, Current Flight-Stiffening**:  
     - *Etiological*: **Gripping function** (original selection). *Not* stiffening (unless selection *for* stiffening occurred).  
     - *Causal-Role*: **Stiffening function**. Current role in escape flights.  
     - *Propensity*: **Stiffening function**. Current fitness propensity.  
  4. **Fixed Trait, No Variation**:  
     - *Etiological*: **Gripping function** (if historically selected).  
     - *Causal-Role*: **Flight-stability function**. Still contributes causally.  
     - *Propensity*: **No function**. No variation → no selection propensity possible.  
  5. **Artificial Lab Selection**:  
     - *All accounts*: **No natural biological function**. Artifact of breeder intervention.  

  **III. Key Disagreement & Defense of Etiological Account**  
  - **Critical Disagreement**: Case 1 splits etiological from propensity. Propensity assigns function based on *current* fitness advantage, while etiological requires *historical* selection. Propensity conflates "currently beneficial" with "functional"—but drift or novel environments can yield benefits without functions (e.g., a mutation improving digestion *by chance* isn’t "for" digestion until selected).  
  - **Strongest Challenge to Etiological**: **Case 4** (fixed trait). If the notch was historically selected (e.g., for grip), etiology assigns a function despite no current selection. Critics argue this is "dead history" irrelevant to biology.  
    - *Defense*: Functions explain *why traits persist*. In Case 4, the notch persists *because* of past selection (developmental entrenchment). Causal-role’s alternative ("stability function") fails—it cannot distinguish the notch from non-selected structures (e.g., whale pelvic bones) that contribute to capacities. Propensity collapses here (no propensity without variation), showing it cannot handle evolutionarily static traits.  
    - *Cost of Defense*: Etiology must deny functional status to **Case 1’s notch**, though it enhances fitness. This is acceptable: the notch is *currently advantageous* but not *functional*—it may become so if selected later. Calling it "functional" now smuggles in teleology.  

  **IV. Cost to Alternatives**  
  - Propensity fails catastrophically in **Case 4** (no variation → no propensity) and **Case 2** (no current advantage, but historical function exists).  
  - Causal-role overextends in **Case 2** (no systemic contribution, yet historical function) and **Case 4** (assigns "stability function" without selective basis).  
  - **Agreement in Case 5** reinforces that biological functions are natural, not artifactual.  

  **Conclusion**: The etiological account best captures function as an explanatory concept in evolutionary biology. While causal-role is useful for physiologists ("how does it work?"), it cannot answer "why is it there?"—biology’s core question. Propensity’s appeal to "current utility" is undermined by drift and fixation. Function is inherently historical.  

  ---

  ### Marking Scheme (25 points total)  
  | **Must-Hit Point**                                                                 | **Marks** | **Common Error (Mark Deduction)**                                  |  
  |------------------------------------------------------------------------------------|-----------|--------------------------------------------------------------------|  
  | **1. Correctly applies all three accounts to all five cases** (e.g., Case 1: Etiological=no, CR/Propensity=yes; Case 5: all=no). | 7 | Misreading cases (e.g., assigning function in Case 2 to causal-role) or misstating accounts. |  
  | **2. Identifies Case 1 or 4 as a disagreement point** (e.g., etiological vs. propensity in Case 1) **and explains why** (e.g., "Propensity requires current fitness, etiological requires past selection"). | 5 | Superficial comparison ("they disagree") or misidentifying the split (e.g., claiming Case 2 distinguishes all three). |  
  | **3. Defends one account against its hardest case** (e.g., etiological in Case 4) **and states the cost** (e.g., "must deny function in Case 1"). | 6 | Ignoring the "hardest case," vague defense, or not articulating trade-offs. |  
  | **4. Notes agreement in Case 5** and explains why (e.g., "artificial selection ≠ biological function"). | 3 | Missing agreement or misclassifying Case 5 (e.g., "causal-role assigns color function"). |  
  | **5. Avoids major confusions**: No conflation of "selected" vs. "selected for"; no "useful now = functional"; no teleology; no appeal to "biologist convenience." | 4 | Errors like "the notch has a function in Case 1 because it’s useful" (propensity ≠ etiological function). |  

  *Note: Case 2 was retained—it separates accounts clearly: Etiological (yes: historical grip), Causal-Role (no: no current role), Propensity (no: no current propensity). Case 4 separates causal-role (yes) from propensity (no).*  

  ---  
  **Rationale for Design**:  
  - **Case 1** forces the history vs. current utility debate.  
  - **Case 4** tests handling of evolutionary stasis (causal-role overassigns, propensity fails).  
  - **Case 5** ensures students recognize consensus where appropriate.  
  - The model answer defends etiological integrity but exposes its "cost" (Case 1), mirroring your debate. If you prefer a two-concept view (e.g., "etiological for evolution, causal-role for physiology"), adjust the defense accordingly—but specify the division *exactly* (e.g., "functions explain origins; causal roles explain mechanisms").
