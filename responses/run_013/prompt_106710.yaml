prompt: |-
  I am putting together a position statement for a workshop on the science of consciousness and would like it audited before anyone else reads it. What follows is a version of integrated information theory, but I want the audit to turn on the commitments as I state them here rather than on what the secondary literature says the theory is committed to.

  (1) Experience is identical with the maximally irreducible cause–effect structure that a system specifies over its own elements. There is no further fact about what an experience is like beyond the shape of that structure.

  (2) Experience is graded. Nothing marks the point at which integrated information becomes experience; wherever a system has a nonzero, maximally irreducible structure, there is something it is like to be that system, however little.

  (3) There is exactly one conscious subject per system, namely the maximal one. Smaller irreducible structures embedded in it do not have experiences of their own, even when they are irreducible considered in themselves.

  (4) Experience is substrate-dependent. Two systems can realize the same input–output function and differ in whether and how they are conscious; in particular, a purely feedforward digital system that reproduced a human being's entire behavioral repertoire would have no experience, because its causal structure is of the wrong kind.

  (5) Intentional and cognitive states are a different matter: belief, desire, and the rest are functional, and a system with the right organization would have them whatever it happened to be made of.

  (6) This is a scientific position rather than a metaphysical one. It makes risky predictions — that the cerebellum contributes nothing to experience despite its neuron count, and that experience is generated in the posterior cortex rather than the prefrontal — and I expect those to be settled by experiment.

  (7) I am not a panpsychist. There is nothing it is like to be a thermostat or a liver.

  Tell me how these hang together. I want the genuine tensions ranked by severity, with the inference spelled out in each case — which commitment does the work in generating the conflict — and, for each one, the cheapest available revision and what it would cost me. I also want to know which pairs look inconsistent but are not, and why the appearance is misleading. If a single revision would clear up more than one tension at once, say which and what it would cost. I do not know in advance which of these I would abandon, so do not treat any one of them as the commitment I am secretly willing to trade; and do not pad the answer by flagging every pair as tense. If most of the set is coherent, say so. No references needed — argue it on the merits.
reasoning: |-
  Okay, let me tackle this position statement audit request. The user wants a thorough analysis of how their seven IIT-inspired commitments hang together, focusing on genuine tensions rather than secondary literature interpretations. 

  First, I need to map the logical relationships between all propositions. The core identity (1) that experience equals maximally irreducible cause-effect structure seems foundational - it's generating most implications here. 

  Looking at the most obvious tension: between (2) and (7). If experience is graded down to any non-zero integrated information (2), that should include simple systems like thermostats - but (7) explicitly denies this. The conflict arises directly from universal quantification in (2) versus the arbitrary cutoff implied by (7). 

  Then there's the subject unity problem: (3) claims only maximal systems are subjects, but if smaller irreducible substructures exist (per 1-2), why wouldn't they be conscious? This seems inconsistent unless we add an exclusivity principle - but that would contradict (2)'s continuous view.

  The functionalism split creates another interesting tension. (4) and (5) draw a sharp line: consciousness is substrate-dependent while cognition isn't. But if intentional states are truly separable from experience as (5) claims, that makes consciousness oddly epiphenomenal - how could it not affect cognitive functions? 

  I notice the user emphasizes this isn't metaphysics but science (6). Yet the cerebellum/posterior cortex predictions rely on the architecture assumptions in (1) and (4). If those are wrong experimentally, it might force revisions elsewhere - whereas (3) or (7) could be adjusted more cheaply.

  For non-tensions: (1) and (4) cohere well - if consciousness is causal structure, then substrate matters. Likewise, (1) supports (3)'s maximal system focus, since smaller structures would be absorbed.

  The cheapest fixes? For the panpsychism issue, weakening (2) to require minimal complexity would preserve (7) but lose IIT's elegant continuity. For the subject problem, allowing nested experiences contradicts (3) but saves (2). 

  Ultimately most propositions interlock reasonably well except the gradedness vs anti-panpsychism clash. That's the keystone tension needing resolution - other issues might resolve if that one gets addressed.
answer: |-
  Here's an audit of your position statement, focusing on internal coherence, ranking tensions by severity, identifying non-tensions, and proposing minimal revisions. The analysis treats your commitments as stated and prioritizes genuine conflicts over surface appearances.

  ### Core Coherence
  The majority of your commitments form a coherent core:  
  - **(1) + (4)** are mutually reinforcing (substrate-specific causal structure defines experience).  
  - **(1) + (6)** align (scientific testability relies on identifying specific physical structures).  
  - **(4) + (5)** coexist cleanly (consciousness ≠ cognition; only the former requires specific substrates).  
  - **(3) + (6)** are compatible (predictions about cerebellar exclusion imply a single subject per maximal system).  

  ---

  ### Ranked Tensions (Most Severe First)

  #### **1. Tension between (2) and (7)**  
  - **Conflict:** (2) states that *any* system with non-zero maximally irreducible structure ("however little") has experience. (7) denies experience to thermostats/livers, implying they lack such structure. But thermostats *do* have causal structure (e.g., a bimetallic strip’s state causes a switch). If this structure is "maximally irreducible" for the system (per your definition in 1), (2) *requires* it to have experience.  
  - **Commitment doing the work:** (2)’s universal quantification ("wherever a system has nonzero...").  
  - **Cheapest revision:**  
    - **Option A:** Qualify (2) to require *minimal complexity* (e.g., "beyond some threshold of differentiation/integration").  
      - *Cost:* Weakens IIT’s elegant continuity; introduces arbitrariness.  
    - **Option B:** Retract (7) and accept micro-experiential properties in simple systems.  
      - *Cost:* Concedes panpsychism-adjacent ground.  

  #### **2. Tension between (3) and (1)/(2)**  
  - **Conflict:** (3) states that only the *maximal* system has experience; substructures lack it "even when irreducible considered in themselves." But (1) defines experience as identical to *any* maximally irreducible structure. If a substructure is irreducible (per 1/2), denying it experience contradicts (1)’s identity claim.  
  - **Commitment doing the work:** (3)’s exclusivity clause ("do not have experiences of their own").  
  - **Cheapest revision:**  
    - **Option:** Clarify that "maximally irreducible" in (1) *always* refers to the *global maximum* in the system.  
      - *Cost:* Requires redefining "maximally irreducible" in (1) as context-dependent (relative to the embedding system), not intrinsic. Weakens the ontological primacy of local causal structures.  

  #### **3. Tension between (5) and (4)**  
  - **Conflict:** (4) claims functional duplicates can lack consciousness if their causal structure is "wrong" (e.g., feedforward). But (5) states that cognitive states like belief/desire are purely functional. If a system replicates human input-output functions *perfectly* (including responses to pain, introspection, etc.), (5) implies it has beliefs *about* its experiences (e.g., "I am in pain"). Yet (4) denies it has any experiences at all. This makes cognitive claims about consciousness incoherent.  
  - **Commitment doing the work:** (5)’s functionalism about intentional states *combined with* (4)’s anti-functionalism about consciousness.  
  - **Cheapest revision:**  
    - **Option:** Restrict (5) to *non-phenomenal* intentional states (e.g., "beliefs not directly about qualitative experience").  
      - *Cost:* Requires a divisive theory of content (some beliefs are functional, some require phenomenology).  

  ---

  ### Non-Tensions (Apparent but Resolvable)

  #### **Apparent tension: (1) vs. (6) ("Not Metaphysical")**  
  - **Why misleading:** (6) claims the position is scientific due to testable predictions. (1) is a theoretical identity claim, but such claims *can* be scientific (e.g., "temperature is mean kinetic energy"). Predictions in (6) directly test implications of (1)/(4), so no conflict exists.  

  #### **Apparent tension: (3) vs. (6) ("One Subject per System")**  
  - **Why misleading:** Critics might argue that (3) precludes split-brain cases from having two subjects. However, (3) specifies the "maximal" system defines the subject. In split-brain scenarios, the maximal system might shift contextually (e.g., during lateralized tasks), which (6)’s experiments could detect without contradicting (3).  

  ---

  ### Strategic Considerations
  - **Highest leverage revision:** Modifying **Option A for (2)** (adding a complexity threshold) also partially resolves the **(3) vs. (1)/(2)** tension by implying that substructures fall below the threshold.  
  - **Most defensible status quo:** If you retain all commitments, prioritize defending **(2) vs. (7)**. Argue that thermostats *are not* irreducible systems (their structure is fully reducible to components + environment), exempting them from (2). This exploits potential ambiguity in "system" specification but doesn’t revise the text.  
  - **Overall coherence:** 80%+ coherent. Core identity (1) and substrate-dependence (4) anchor the framework. Tensions arise mainly from edge cases (simple systems, subsystems) and cognitive-phenomenal overlap.  

  Proceed by deciding whether to preserve anti-panpsychism (revising 2) or experience continuity (revising 7), as this choice cascades through other tensions.
