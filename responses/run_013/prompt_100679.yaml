prompt: |-
  Modern cryptography is built on a distinction between two kinds of security. Information-theoretic security is unconditional: no adversary, however computationally powerful, can break the scheme. Computational security is conditional: a scheme counts as secure if every probabilistic polynomial-time adversary succeeds with negligible probability, which means the scheme is breakable in principle by an unbounded search but not by any adversary we expect to build. In practice, banks, messaging services, and military systems treat both kinds as secure, and often prefer the computational kind because it is faster and more flexible; a one-time pad is information-theoretically secure but is rarely used for general communication. The practice therefore treats a scheme that is breakable in principle as secure enough, while treating a scheme that is unbreakable in principle as impractical. What philosophical commitments does this practice presuppose?

  Reconstruct the implicit theory. Does it require a particular view of possibility—for example, that what is possible for us is not the same as what is metaphysically possible, or that computational infeasibility is a genuine kind of impossibility? Does it presuppose realism about complexity classes, so that the P versus NP question and the existence of one-way functions are objective facts about the world, or can the practice be licensed by a purely instrumentalist or constructivist reading? Does it assume that efficient computation is a natural kind, or only a shifting sociological category? What view of knowledge and evidence is at work in definitions that quantify over all polynomial-time adversaries, including adversaries no one has imagined and machines no one has built? And is the practice internally consistent: it treats information-theoretic security as the gold standard yet does not pay the practical price for it, and it treats computational security as sufficient even though its central assumptions are unproved.

  Distinguish what the practice strictly presupposes from what it merely fits well with, and say where it is philosophically underdetermined, so that several rival theories of modality, feasibility, and mathematical objectivity would license the same institutional behavior. Finally, suppose we replaced the asymptotic idealization with a concrete-resource view: security would be defined relative to a specified budget of time, memory, and parallelism, and a scheme would be secure only against adversaries within that budget. What would have to change in cryptographic practice, and what philosophical commitments would the replacement force us to give up or acquire?
reasoning: |-
  Okay, the user is asking about the philosophical commitments underlying modern cryptographic practices, especially the distinction between information-theoretic security and computational security. They want me to reconstruct the implicit theory behind why banks and other institutions treat computational security as sufficient despite its theoretical vulnerabilities.

  First, I need to break down the key elements. The user mentions that computational security relies on probabilistic polynomial-time adversaries and negligible probability of success. The practice prefers this over information-theoretic methods like one-time pads because it's more practical, even though it's breakable in principle. 

  The user is interested in the philosophical assumptions here. They bring up possibility—like the difference between what's metaphysically possible versus feasible for us. Also, they question whether complexity classes like P vs NP are treated as objective realities or just useful constructs. There's also the part about defining security against all polynomial-time adversaries, including those not yet conceived. 

  I should address each of these points systematically. Starting with modality: the practice assumes that computational infeasibility is a type of practical impossibility. It's not about metaphysical possibility but what's achievable with realistic resources. So, they're making a distinction between different kinds of possibility. 

  Next, realism about complexity. Cryptography assumes that P ≠ NP and one-way functions exist. But is this a philosophical commitment to realism, or could instrumentalism suffice? The practice seems to lean on the objective existence of these complexity classes, even though they're unproven. However, an instrumentalist view might still work if the focus is on current capabilities. 

  The efficient computation as a natural kind is tricky. Polynomial time is used as a proxy for feasible computation, but it's an idealization. In practice, constants matter, but asymptotics ignore them. So, it's more of a useful model rather than a strict natural kind. The sociological aspect is relevant here—what's feasible changes with technology, but the theory treats polynomial time as stable. 

  Knowledge and evidence are also important. Defining security against all polynomial-time adversaries involves a universal quantification over possible adversaries. This relies on the idea that we can model all such adversaries mathematically, even unknown ones. It's a form of idealization in modeling, assuming that the mathematical abstraction covers future developments. 

  Internal consistency is another point. The gold standard is information-theoretic security, yet it's not used due to practicality. Computational security is accepted based on unproven assumptions. But the practice is consistent in prioritizing practical feasibility over theoretical perfection. 

  The user also asks about replacing asymptotic approaches with concrete resources. This would make security definitions more practical but lose generality. Philosophically, it shifts from idealization to empiricism, requiring different commitments about what's feasible at a given time. 

  I need to distinguish what's strictly presupposed from what fits well. The core commitments are the practical/modality distinction and the need for a mathematical model of adversaries. Other aspects, like realism vs. instrumentalism, might be underdetermined. 

  Finally, the user might be a philosopher of science or cryptography, interested in foundational issues. Their deeper need could be understanding how theoretical constructs in CS relate to philosophical concepts like reality, knowledge, and possibility. They might also be exploring the reliability of cryptographic practices given their unproven assumptions.
answer: |-
  The cryptographic practice you describe rests on a sophisticated web of philosophical commitments, primarily concerning **modality, mathematical objectivity, and epistemic justification**. Its implicit theory can be reconstructed as follows:

  ---

  ### **Core Philosophical Commitments**
  1. **Two-Tiered Modality of Feasibility**  
     - **Presupposition:** *Practical impossibility* (computational infeasibility) is distinct from *metaphysical/logical impossibility*.  
     - **Implication:** What is "impossible" in security contexts means "infeasible given physical and technological constraints," not "logically contradictory." This separates:  
       - *Metaphysical possibility* (e.g., brute-forcing AES-256 via exhaustive search *could* happen).  
       - *Practical impossibility* (doing so would require more energy/time than exists in the universe).  
     - **Commitment:** A **robust distinction between feasible and infeasible computation** is ontologically significant, not merely epistemic.

  2. **Realism About Computational Complexity**  
     - **Presupposition:** Complexity classes (P, NP, BPP) and the existence of one-way functions describe **mind-independent facts** about computation.  
     - **Implication:** Security proofs assume:  
       - P ≠ NP is objectively true (otherwise, most cryptography collapses).  
       - "Negligible probability" (super-polynomially small) is a natural boundary for adversarial success.  
     - **Tension:** Practice *behaves as if* these are objective truths, but remains compatible with **instrumentalism**. An instrumentalist could say: "We act *as if* P ≠ NP because it works, regardless of its ultimate truth." However, the practice **strictly presupposes** that complexity-theoretic conjectures are *stable enough* to base long-term security on.

  3. **Epistemic Idealization in Security Definitions**  
     - **Presupposition:** Security against *all* polynomial-time adversaries (including undiscovered ones) is:  
       - **Knowable a priori** via mathematical proof.  
       - **Robustly predictive** of real-world attacks.  
     - **Implication:** This treats "efficient computation" as a **natural kind**—a unified category (polynomial-time) capturing all physically feasible computation, past or future.  
     - **Critique:** Constants matter in reality (e.g., an O(n¹⁰⁰) attack is "polynomial" but useless). Asymptotics are an **idealization** justified by scalability.  

  4. **Pragmatic Value Hierarchy**  
     - **Presupposition:** *Practical utility* outweighs *theoretic optimality*. Information-theoretic security is a "gold standard" only in theory; in practice, its costs (key length, synchronization) are unjustifiable.  
     - **Internal Consistency:** This is **consistent** because the goal is *security-in-practice*, not *security-in-principle*. Computational security is "sufficient" under the assumption that adversaries are constrained by physics/economics.  

  ---

  ### **Philosophical Underdetermination**
  The practice is **compatible with multiple philosophical frameworks**:  
  - **Modality:** Accepts both Lewisian realism about possible worlds (for brute-force scenarios) and a physicalist view of feasibility.  
  - **Mathematical Objectivity:** Fits realism (P vs. NP is a discovery) but also quasi-empiricism (cryptography "tests" mathematical conjectures).  
  - **Efficient Computation as a Natural Kind:** Compatible with:  
    - **Realism:** Polynomial-time is a physical constraint (e.g., Bremermann's limit).  
    - **Constructivism:** It's a historically contingent, socially stabilized category.  

  **Strict Presuppositions**:  
  - Feasibility ≠ metaphysical possibility.  
  - Complexity-theoretic conjectures are reliable enough to bet on.  
  - Universal quantification over adversaries is meaningful (i.e., math captures future possibilities).  

  ---

  ### **Concrete-Resource View: Consequences and Commitments**
  If cryptography switched to **concrete security** (e.g., "secure against attackers with < 2¹²⁸ operations"):  
  1. **Practical Changes:**  
     - Security parameters become hardware-dependent (e.g., based on 2024-era supercomputers).  
     - Asymptotic proofs replaced by exact hardness bounds (e.g., "AES-256 requires 2²⁵⁶ operations").  
     - Frequent updates to standards as technology advances.  

  2. **Philosophical Shifts:**  
     - **Abandoned:**  
       - Faith in asymptotic abstractions as "timeless."  
       - Quantification over undiscovered adversaries (now only *known* attacks matter).  
     - **Acquired:**  
       - **Empiricism:** Security becomes falsifiable via physical benchmarks.  
       - **Anti-realism about complexity:** Feasibility is context-dependent, not mathematically universal.  
       - **Historical relativity:** "Secure" means "secure now," not "secure in principle."  

  3. **Trade-offs:**  
     - **Gain:** Transparency, easier audits.  
     - **Loss:** Long-term guarantees; systems might become rapidly obsolete.  

  ---

  ### **Conclusion**
  Crypto practice commits to a **physicalized epistemology**: mathematical proofs model real-world feasibility, anchored in the belief that computational hardness is as real as thermodynamic limits. It bridges Platonic abstraction (complexity classes) and pragmatic materialism (we ignore brute-force possibilities). While compatible with instrumentalism, its *success* relies on the **robust objectivity** of computational barriers. Replacing asymptotics with concrete resources would reframe security as a **dynamic, empirical science**—but force cryptography to abandon its vision of "enduring" mathematical security. The core tension—treating unproven assumptions as reliable—reflects a deeper wager: that the universe constrains computation in ways we can formalize *a priori*.
