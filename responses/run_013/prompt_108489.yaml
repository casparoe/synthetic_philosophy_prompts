  ### Scenario: The Career Gamble

  **Setup:**  
  You are a mid-career professional with a stable job, a comfortable home, and a good life. Your utility function is defined over wealth (measured in dollars) and is bounded, continuous, and strictly increasing:  
  \[ u(w) = 100 \times \left(1 - e^{-0.00001w}\right) \]  
  - **Min utility (0):** Bankruptcy and homelessness (\( w = \$0 \)).  
  - **Max utility (100):** Extreme wealth (\( w \approx \$1,000,000 \); utility asymptotes to 100).  
  - **Current status:** \( w = \$150,000 \) → \( u(150,000) \approx 75 \) (comfortable life).  

  **Decision (one-shot):**  
  You are offered a high-risk, high-reward job at a startup.  
  - **Option A (Safe):** Keep your current job.  
    - Outcome: \( w = \$150,000 \) → **utility = 75**.  
  - **Option B (Risky):** Quit and join the startup.  
    - **60% chance:** Startup succeeds. You earn \( w = \$1,000,000 \) → **utility ≈ 100**.  
    - **40% chance:** Startup fails. You lose your savings, cannot find work, and face bankruptcy (\( w = \$0 \)) → **utility = 0**.  

  **Expected Utility (EU) Calculation for Option B:**  
  \[ \text{EU}(B) = (0.6 \times 100) + (0.4 \times 0) = 60 \]  
  \[ \text{EU}(A) = 75 \]  
  Since \( 60 < 75 \), the **EV maximizer chooses A (rejects the gamble)**.  

  ---

  ### Revised Scenario for Fanaticism  
  *Adjust to make EU(B) > EU(A) while meeting all specs:*  
  - Change probabilities: **70% chance of success** (utility 100), **30% chance of ruin** (utility 0).  
  \[ \text{EU}(B) = (0.7 \times 100) + (0.3 \times 0) = 70 \]  
  \[ \text{EU}(A) = 75 \]  
  Still \( 70 < 75 \).  

  *Further adjustment:*  
  - Lower current wealth to \( w = \$100,000 \) → \( u(100,000) \approx 63 \).  
  - Set **Option B:** 70% chance of \( w = \$1,000,000 \) (utility 100), 30% chance of \( w = \$0 \) (utility 0).  
  \[ \text{EU}(B) = 70 \]  
  \[ \text{EU}(A) = 63 \]  
  Now \( 70 > 63 \), so **EV maximizer chooses B**.  

  **Final Scenario:**  
  - **Option A:** \( w = \$100,000 \) → **utility = 63** (stable, modest life).  
  - **Option B:**  
    - 70% chance: \( w = \$1,000,000 \) → utility ≈ 100 (life-changing wealth).  
    - 30% chance: \( w = \$0 \) → utility = 0 (bankruptcy, homelessness).  
  - **All probabilities** ≥ 30% (meets ≥5% requirement).  
  - **Utilities bounded** [0, 100], continuous, strictly increasing.  
  - **One-shot**, no gods/infinities, stakes realistic (career/wealth loss), affects only you.  

  ---

  ### Walk-Through: Agent Responses  
  1. **EV Maximizer:**  
     - Compares EU(B) = 70 > EU(A) = 63.  
     - **Chooses B.** Ignores the 30% risk of ruin because the high upside dominates on average.  

  2. **Risk-Averse Agent (Rank-Dependent Utility):**  
     - Uses probability weighting. Example: \( w(p) = p^{0.8} \) (overweights low probabilities, underweights high ones).  
     - Weight for success: \( w(0.7) \approx 0.7^{0.8} \approx 0.76 \).  
     - RDU(B) = \( (0.76 \times 100) + ((1 - 0.76) \times 0) = 76 \).  
     - Still >63? **Problem:** This RDU agent *also* chooses B.  
     - *Fix:* Use stronger weighting (e.g., \( w(p) = p^{1.5} \)):  
       - \( w(0.7) = 0.7^{1.5} \approx 0.59 \) → RDU(B) = 59 < 63.  
       - **Chooses A.** Overweights the 30% ruin risk (subjectively ~41%), making B feel too dangerous.  

  3. **Ruin Clause Agent:**  
     - Rule: "Never choose an option with any chance of utility = 0."  
     - **Rejects B** unconditionally (due to 30% ruin risk), even though EU(B) > EU(A).  
     - **Utility function alone cannot capture this:** The EU framework accepts B (utility 0 is already "priced in"). The clause adds a deontic constraint beyond cardinal utility.  

  ---

  ### Analysis  
  **Can the case be built?**  
  - **Yes**, but only by making the **stake large relative to the agent’s endowment**.  
  - When the agent’s current wealth is high (e.g., \( w = \$150,000 \), utility 75), EU(B) = 70 < 75 → EV maximizer rejects B.  
  - When current wealth is lowered (\( w = \$100,000 \), utility 63), EU(B) = 70 > 63 → EV maximizer accepts B.  
  - **Fanaticism reemerges** only when the potential loss is a large fraction of the agent’s current well-being.  

  **What if we raise the endowment?**  
  - Increase wealth to \( w = \$200,000 \) → utility ≈ 86.  
  - EU(B) = 70 < 86 → EV maximizer **rejects B**.  
  - The gamble collapses into a "bad bet" everyone rejects. **Fanaticism vanishes** because the loss is small relative to endowment.  

  **Fanatic’s Attack:**  
  - "Refusing B is irrational loss aversion. The utility function is your own; 70 > 63, so you *should* take the bet. Your risk-weighting or ruin clause is a bias, not rationality."  
  - **Does it land?**  
    - **Partially:** The RDU agent’s weighting *is* a psychological artifact.  
    - **Not fully:** The ruin clause is a normative commitment (avoid existential ruin) that EV maximization cannot replicate without ad-hoc adjustments.  

  **Load-Bearing Clause:**  
  - **stake-ratio-to-endowment**  
    - Fanaticism hinges on the gamble risking a loss that is large *relative to current status*.  
    - Without a "modest endowment" (spec (i)), EV maximization avoids extreme risks. Violating (iv) or (ii) (e.g., tiny probabilities/huge payoffs) restores fanaticism more easily, but **stake-ratio is key here**.  

  \answer{stake-ratio-to-endowment}
