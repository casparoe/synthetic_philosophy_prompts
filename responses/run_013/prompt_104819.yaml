answer: |-
  Here’s a deep dive into Newton’s metaphysics, untangling the passage step by step. I’ll address your questions directly after sketching the interpretive landscape.

  **Brainstorming the Stakes & Possible Readings**  
  Newton is threading a needle between two dangers:  
  - **Pantheism/Immanentism** (God = Space/Time/World, à la Spinoza or Stoics).  
  - **Deism** (God as distant cosmic watchmaker, uninvolved post-creation).  
  Your friend’s "pantheism in a wig" reading leans toward the first. The opposite extreme is a detached, abstract God. Newton’s goal is a *sovereign, active, personal God* who is metaphysically prior to creation yet intimately present within it. The stakes? If God *is* Space/Time, God is impersonal and bound by necessity. If God is *only* "outside," God can’t act in the world. Newton wants neither.  

  **Your Questions Resolved**  

  1. **"He is not Duration or Space, but he endures and is present"**  
     - **Not just grammar**—it’s a metaphysical firewall. Newton denies God is *identical* to Space/Time (rejecting pantheism). Instead, God *possesses* eternal duration and omnipresence as attributes.  
     - **Why?** If God *were* Space, God would be a passive container, not a ruler. If God *were* Time, change in creation would imply change in God (undermining perfection). God is the *source* of Space/Time, not their substance.  

  2. **"Constitutes Duration and Space" vs. the prior claim**  
     - **No contradiction**: "Constitutes" means *grounds, sustains, or makes possible*—**not** "is identical to."  
     - **Newton’s view**: Space and Time are **emanative effects** of God’s existence. Just as light emanates from the sun without *being* the sun, Space/Time emanate from God’s eternal, omnipresent being. God’s existence *causes* Space/Time to exist as the arena of creation.  
     - **Textual clue**: "By existing always and every where, he constitutes..." → God’s *mode of being* generates relational frameworks (Space/Time) for other beings.  

  3. **The "non sequitur" inference**  
     - **Charitable reconstruction**:  
       - Premise 1: Every part of Space exists at all times (i.e., Space is eternal).  
       - Premise 2: Every moment of Time exists in all places (i.e., Time is omnipresent).  
       - Premise 3: Space/Time are creations (not self-sufficient).  
       - Inference: Therefore, their Creator must possess *more* fundamental eternality/omnipresence. If creation is "always/everywhere," the Creator cannot be *less* present/eternal ("never/no where").  
     - **Does it work?** Yes, if you accept Newton’s view that Space/Time are dependent attributes of God’s being. It’s an argument from *eminence*: the effect (Space/Time) reflects but cannot exceed the cause (God).  

  4. **The soul analogy**  
     - **Purpose**: To illustrate God’s **simplicity** and **transcendence of parts**.  
       - Human soul: Remains one "indivisible person" across time/space, despite changing sensory inputs.  
       - God: Infinitely more so—no "parts" in Space or succession in Time. God’s unity is absolute.  
     - **Why drag it in?** To counter the idea that God’s omnipresence implies spatial extension or temporal succession. God is *wholly present* at every point, without division—like a soul animating a body, but without physical constraints.  

  5. **How "God as dominion" fits with "eternal/infinite"**  
     - **Hierarchy**: Dominion is **primary**. "Eternal" and "infinite" are necessary *conditions* for sovereignty.  
     - **Newton’s logic**:  
       - A "perfect being" without dominion is not "Lord God" (e.g., an angel might be perfect but lacks supreme authority).  
       - Dominion requires *agency*—thus God must be personal, not an abstract principle.  
       - Eternity/infinity ensure God’s sovereignty is total and unchallengeable (no rival, no boundary).  
     - **Not secondary, but instrumental**: God’s attributes enable dominion. Without them, "Lord" is meaningless.  

  **Pantheism Charge: Fair Shake & Rebuttal**  
  - **"Pantheism in a wig" argument**: If God "constitutes" Space/Time, and Space/Time contain all things, God = All. Newton’s denial ("not Space") is just wordplay.  
  - **Why it fails**:  
    - Newton explicitly attacks pantheism ("not over his own body, as those who fancy God the soul of the world").  
    - "Constitutes" ≠ "is identical to." Newtonian Space/Time are **relational** (arenas for matter), not divine substances.  
    - God’s transcendence is preserved: Space/Time are *effects* of God’s being, but God remains distinct ("a living, intelligent, powerful Being").  
    - **Key evidence**: Newton calls God the "Maker and *Lord* of all things." Lordship implies a distinction between ruler and realm.  

  **The Coherent Whole**  
  Newton’s God is:  
  1. **Sovereign** ("Lord" defined by dominion over servants).  
  2. **Metaphysically foundational**: Space/Time are *emanations* of His eternal, omnipresent existence.  
  3. **Immanent yet transcendent**: Present everywhere/times without *being* space/time.  
  4. **Personal and simple**: No parts, no succession—pure agency.  

  **Ambiguities vs. Certainties**  
  - **Ambiguous**: *How* exactly God "constitutes" Space/Time (metaphysical mechanism). Newton is cagey.  
  - **Certain**: Newton is **not a pantheist**. The text explicitly rejects this.  
  - **Confident reading**: "Constitutes" = "grounds and sustains," preserving God’s otherness while ensuring His active presence.  

  **Plain-English Summary**  
  Newton’s God is the cosmic CEO: His eternal, infinite existence creates and maintains the "office space" (Space/Time) where creation operates. He’s not the building itself (anti-pantheism), nor is He remote (anti-deism). He’s in the office everywhere at once, running everything, without being reduced to walls or clocks. Dominion is His job description; eternity and infinity are His qualifications. The soul analogy? It’s like saying your mind isn’t *in* your phone when you text—you’re whole in every action, beyond the device’s space/time. So too with God and the universe.  

  This holds together because Newton sees physics as revealing divine action: Gravity points to God’s continual governance; absolute Space/Time reflect His necessary presence. The wig stays off—it’s orthodox theism with a physics twist.
