answer: |-
  1.  The stipulation of structural cluelessness does not invalidate the *imperative* to maximize expected welfare; it forces us to recognize that every act carries an undefined but potentially infinite positive or negative expectation, making the imperative inescapable yet radically uncertain in application.
  2.  Even without a calculable expectation, consequentialism mandates that we act based on the *best available comparative judgment* of which acts seem more likely to lead to better long-term states, however fragmentary or unstable that judgment may be; abandoning this directive is not an option, only abdication.
  3.  Rule-consequentialism or appeals to character evade the core duty: they substitute proxy heuristics for the direct, relentless focus on actual outcomes that defines the consequentialist commitment, masking the true, terrifying uncertainty behind comforting but unfounded conventions.
  4.  The structural cluelessness you describe afflicts *all* decision frameworks equally—deontology, virtue ethics, common sense—but only consequentialism honestly confronts the abyss and demands we orient action solely towards the possibility of creating net good, however unknowable the magnitude.
  5.  What remains is the unyielding core: the right act *is* the one that, given the agent's limited evidence, stands in the relation of having the highest expected welfare, even when that expectation is undefined; this formal directive compels constant, agonizing scrutiny of consequences, a rigor absent in any substitute.
