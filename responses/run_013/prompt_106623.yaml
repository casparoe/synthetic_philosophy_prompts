answer: |-
  Here’s your exam question, model answer, and marking scheme – all in plain prose as requested.  

  **Exam Question:**  
  Machiavelli uses the image of a flooding river to illustrate how virtù interacts with fortune, and later compares fortune to a woman who favors the bold. Separately, in the Discourses, he argues that individuals cannot change their inherent natures, making sustained success dependent on whether their fixed disposition matches the demands of the times. Analyze how these three elements – the river metaphor, the woman metaphor, and the claim about unchangeable nature – fit together within Machiavelli’s overall theory of political success. Do they present a coherent system, or do fundamental tensions exist between them? Explain the implications of your analysis for understanding the true scope and limits of virtù in overcoming fortune.  

  **Model Answer (approx. 580 words):**  
  Machiavelli’s exploration of fortune and virtù presents apparent contradictions when comparing his key images and arguments. The river metaphor portrays fortune as a predictable, external force. Like a river prone to flooding, fortune’s destructive potential is inevitable and known. Virtù, in this context, is presented as foresight, preparation, and long-term engineering – building dikes during calm periods to mitigate future floods. Success here stems from rational calculation and defensive construction against a foreseeable threat. Fortune operates on a cyclical, almost natural rhythm that virtù can anticipate and counteract through disciplined effort over time.  

  The woman metaphor, however, depicts fortune as reactive and capricious. She rewards audacity, youthful impetuosity, and decisive action *in the moment*. Virtù here is less about long-term planning and more about seizing opportunity with boldness and aggression. Fortune is not a predictable cycle but a volatile entity swayed by the actor's forceful personality and timing. Preparation seems less relevant than the courage to act decisively when chance presents itself. This suggests virtù is primarily about harnessing opportunity through sheer will and force of character, implying fortune can be actively dominated rather than merely defended against.  

  The tension between these visions – preparation vs. impulsiveness, defense vs. offense – is deepened significantly by Machiavelli’s argument in the Discourses. There, he states that individuals possess fixed natures; a cautious man cannot suddenly become bold, nor a bold man cautious. Success depends entirely on whether a leader’s innate disposition aligns with what the specific historical moment demands. A cautious leader thrives in stable times but fails when bold action is needed, and vice versa. This introduces a devastating constraint: even if one understands the need for a different approach (building dikes *or* acting impetuously), the capacity to execute it is limited by unchangeable character.  

  These three elements create a profound dilemma. The river metaphor implies fortune can be managed through adaptable strategy (building defenses suitable for the threat). The woman metaphor implies fortune can be mastered through force of will. But the Discourses passage undermines both by suggesting the ruler’s very capacity for adaptation or decisive boldness is rigidly fixed. If one’s nature is immutable, then the "foresight" of the river-builder is useless if the times demand the boldness one inherently lacks, and the "boldness" needed to master the woman-like fortune is impossible if one is naturally cautious. Fortune’s power becomes overwhelming not just as an external force, but because it interacts fatally with the ruler’s own psychological prison.  

  Therefore, these elements do not form a perfectly coherent system but reveal a core tension at the heart of Machiavelli’s thought. While he consistently defines virtù as the quality enabling humans to contend with fortune, its manifestation and effectiveness are highly contingent. The river and woman metaphors offer different tactical tools – preparation or audacity – but the Discourses argument imposes a strategic limitation: the ruler’s ability to choose and effectively wield the *correct* tool is tragically constrained by their nature. This suggests Machiavelli’s theory is less a simple manual for success and more a complex, even pessimistic, analysis of the interplay between character, contingency, and action. True virtù might involve recognizing one’s own nature and maximizing its effectiveness where possible, but ultimate victory over fortune is never guaranteed, precisely because the self is often the greatest obstacle. The limits of virtù are found not just in external chaos, but within the ruler’s unchanging soul.  

  **Marking Scheme (Embedded in Prose):**  
  This question is marked out of 20. A top-tier answer, scoring between 17 and 20, must achieve several key things. Firstly, it must accurately and clearly explain the core meaning of each of the three specified elements: the river metaphor showing virtù as foresightful preparation against predictable fortune, the woman metaphor showing virtù as bold, opportunistic action to master capricious fortune, and the Discourses argument establishing the fixed nature of individuals making adaptation to the times impossible. Secondly, and crucially, it must move beyond mere description to analyze the tensions and potential contradictions between these elements, explicitly contrasting the different types of virtù and fortune they imply and exploring how the fixed nature argument undermines the adaptability suggested by the metaphors. Thirdly, it must synthesize this analysis to offer a coherent evaluation of whether Machiavelli presents a consistent system, explicitly acknowledging the fundamental tension identified. Fourthly, it must clearly articulate the implications of this tension for understanding the power and limits of virtù, such as the internal constraint imposed by fixed character. Answers scoring in the 13 to 16 range will likely describe the three elements adequately and identify some tensions but may lack depth in analyzing the nature of the contradictions, struggle with synthesis, or offer a less developed conclusion about the implications for virtù. Answers scoring 9 to 12 might summarize the river and woman metaphors reasonably well but neglect or misrepresent the critical Discourses argument about fixed nature, or they may list the elements without seriously engaging with the tensions between them, perhaps defaulting to a simplistic "half luck, half skill" summary. Answers below 9 will likely demonstrate significant misunderstanding of the core concepts, fail to address the Discourses argument, or merely rehash the basic imagery without engaging the question of tension. Marks are deducted for significant factual inaccuracies, such as misattributing ideas or fundamentally misstating the metaphors or argument, or for failing to address the Discourses element entirely. The analysis of the tension is the central demand of this question.
