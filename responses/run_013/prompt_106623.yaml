prompt: |-
  hey, so for my elective (its like history and philosophy mixed, the course is called Power and Persuasion) we each have to write a practice exam question for our study group and then swap them, and mine has to be on Machiavelli's fortune and virtù thing, which is honestly the worst one because everyone writes the same essay. You know the one. Fortune is luck, virtù is skill, he says its about half and half, and then the whole thing about fortune being like a river that floods and you build dikes and embankments when the weathers calm, and then at the end he says fortune is a woman and its better to be impetuous than cautious because she favors the young and the bold. Every single person in my class wrote that. Our teacher even said if she reads one more essay that just lists those two images shes going to cry.

  So I want my question to be actually hard. Heres the thing I noticed when I was rereading, and I want the question to be built around it, because I think its the actual crux and nobodys talked about it in class. The river image and the woman image dont seem to work the same way. The river is regular, like its going to flood eventually and you can plan ahead for it and build your defenses while things are calm, so virtù here is basically foresight and engineering, and fortune is something predictable that you can prepare against. But the woman image is the opposite, fortune there is responsive to your attitude, she rewards whoever is boldest in the moment, so virtù is audacity and timing and theres nothing to build in advance. Those are two different theories of how virtù beats fortune and I dont think they can both be true at once.

  And then theres the other passage I found, in the Discourses, where he asks why some men succeed and others fail and says its because a man succeeds while his way of proceeding matches the times and fails when it stops matching, and the catch is that he cant change his nature, so a cautious man is ruined when the times call for boldness and a bold man is ruined when the times call for caution, and he gives this example of two Roman commanders, one cautious and one daring, each winning in different circumstances. But if you cant change your nature, then telling people to adapt to the times is useless advice, and it makes fortune way more powerful than the river image suggested, because theres no dike you can build against your own character.

  So could you write me the exam question, and then a model answer of about 550 words, and a marking scheme out of 20 that says which specific moves a top answer has to make and which mistakes should cost marks. I want the question to force people to deal with the tension between the river, the woman, and the bit about not being able to change your nature, instead of just summarizing the two images. Please write the whole thing as plain continuous prose, no headings, no bullet points, no bold, no tables, no numbered lists, just normal sentences like youre writing me an email, including the marking scheme, because our teacher said shes sick of formatted documents and wants everything as prose. Also dont use any quotes from Machiavelli, just say what he says in your own words, since half my class got in trouble for misquoting him. Thanks, this is definately going to be better than everyones boring fortune essay.
