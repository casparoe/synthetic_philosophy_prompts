prompt: |-
  Hey, I need you to help me draft a research proposal. It's for a one-year MA thesis in philosophy, target maybe 12–15k words, and I have a half-formed idea I want you to beat into proper prospectus shape.

  The idea: the accuracy-first program in epistemology says the single fundamental epistemic good is accuracy — a credence is good to the degree it's close to the truth — and then supposedly everything else (why your credences should obey the probability axioms, why you should update by conditionalization, why you should defer to certain experts) gets vindicated from that one value, usually via some dominance or expected-accuracy argument. Fine. But here's whats been nagging me. Accuracy is always accuracy on a particular set of propositions; you score a credence function against an algebra. And the whole apparatus seems totally silent about which propositions you ought to be forming credences about in the first place. You could be maximally accurate and perfectly coherent while your entire credal life is spent on gerrymandered disjunctions and arbitrary predicates, never touching anything that matters. Meanwhile someone with just a few credences, but about the things that actually carve nature at the joints, looks epistemically better — and nothing in the framework seems to say so. There's a related smell: since accuracy on a proposition that's logically entailed by others comes for free, two agents who agree on all the coarse-grained facts can differ in accuracy purely because one has a finer-grained credal agenda, which makes me wonder whether that's an epistemic difference at all or just a bookkeeping one.

  So my question is roughly this: is that a genuine hole in accuracy-first epistemology, or can the framework absorb it without giving up accuracy's status as the sole fundamental epistemic value? And if it can't, what's the least disruptive patch — say, does relativizing accuracy to a 'question' or a partition fix it, and does that break the standard vindications of probabilism?

  Turn this into the proposal. I need: the question stated so precisely that it has a determinate answer; an honest account of why the existing positions (the dominance and expected-accuracy arguments, the defenses of accuracy as the sole good) don't already settle it; the method — what I'd actually be doing month by month, given that this is conceptual work and not empirical; what a positive result would look like and what would count as the project failing (I'd rather find that out now than in month nine); and a realistic scope for one year, including an honest note on which parts might be too big. Don't give me citations or a reading list, I'll slot those in myself — just refer to positions and arguments by description.
