     - No: Go to 7.

  7. Is the pain experience itself a kind of command (imperative) to protect the body? 
     - Yes: The badness is that directive. (Leaf 3)
     - No: Go to 8.

  8. Does the pain experience represent the bodily state as bad for you? 
     - Yes: The badness is the represented content. (Leaf 4)
     - No: Pain isn't one natural kind, so the question is malformed. (Leaf 6)

  This tree has 8 nodes.

  Now, extra cases:

  Case (a): Drug that leaves sensation bit-for-bit identical but kills the "get away" pull.

  - Leaf 1: The sensation is identical, but the pull is gone. Since badness is baked in, and the pull is part of the sensation? Or if the pull is gone, then the sensation is not really pain. So they would say she is no longer in pain.
  - Leaf 2: Sensation is there (pain) but the conative state (aversion) is gone, so it isn't bad.
  - Leaf 3: The command (the pull) is gone, so the pain is gone. She is no longer in pain.
  - Leaf 4: The representation is there (sensation is identical), so she is in pain and it is bad (represents badness), but the motivational pull is missing.
  - Leaf 5: Not applicable in this case because she has sensation. For a normal person, if the drug removes the pull, leaf 5 might say she is in pain only if unpleasantness is present. But the case doesn't specify if unpleasantness is gone. Assume the drug only removes the motivational pull, not the affect. Then leaf 5 would say she is in pain if the affect is there. But if the affect is gone, they might say she isn't. But the case doesn't specify. We'll assume that the 'pull' is the motivational component, and the affect might be separate. For simplicity, we can say that in leaf 4, the badness is the representational content, which is still there.
  - Leaf 6: Varies.

  Case (b): Patient prefers the pain.

  - Leaf 1: If she prefers it, then it must not be pain (or it's not bad, but leaf 1 says badness is baked in). So they might say she is not in pain.
  - Leaf 2: She has the sensation (pain) and a conative state of desire to keep it (no aversion), so it isn't bad.
  - Leaf 3: The command might be there, but she disobeys. So she is in pain and it is bad (because command is there), but she wants it.
  - Leaf 4: The representation is there, so it is bad, but she desires it. She is in pain and it is bad.
  - Leaf 5: She is not in pain.
  - Leaf 6: Varies.

  Flag any pair of leaves the tree can't separate. For example, in case (a), leaf 3 and leaf 1 both say she is no longer in pain, but for different reasons. In case (b), leaf 2 and leaf 4 both say she is in pain but disagree on whether it is bad.

  Empty cells: 
  - In node 8, if we answer No, we go to leaf 6. But if we answer Yes, leaf 4. Is there a combination that has no defender? For example, if at node 4 we say yes and then at node 5 we say yes (leaf 1), that has defenders. All branches seem covered.

  Empirical claims: 
  - Node 1: empirical (about the patient's report).
  - Node 2: empirical (about the quality of the sensation).
  - Node 3: empirical (they don't mind).

  The rest are philosophical.

