  ### Decision Tree for Updating on Uncertain Evidence

  **Shared Commitment**: Experiences can shift an agent's credences in the cells of a partition without making any proposition certain (new credences ∈ (0,1)).  

  1. **Can the update be reduced to conditionalization on a proposition?**  
     - **Yes** → **Reduction to conditionalization**  
       *Awkward commitment: Requires experiences (e.g., "seeing greenish") to be propositions, which may misrepresent subjective states.*  
     - **No** → 2  

  2. **Are the new credences in the partition cells part of the evidence?**  
     - **Yes** → **Unnamed**  
       *Awkward commitment: Conflates evidence (cause of the shift) with the agent's doxastic response.*  
     - **No** → 3  

  3. **Should we reject this framework?**  
     - **Yes** → **Rejection**  
       *Awkward commitment: Denies that evidence can be uncertain, making cases like poor-light fabric inscrutable.*  
     - **No** → 4  

  4. **Must probabilities be sharp?**  
     - **No** → **Set-valued or non-additive**  
       *Awkward commitment: Decisions (e.g., acting on a witness's reliability) require handling sets of credences, which lacks a consensus method.*  
     - **Yes** → 5  

  5. **Does the update leave conditional credences within cells fixed?**  
     - **Yes** → 6  
     - **No** → 7  

  6. **Is the rule order-independent?**  
     - **No** → 8  
     - **Yes** → **Empty**  
       *Reason: Incoherent—fixed conditionals imply order-dependence without extra constraints.*  

  7. **The shift determines a family of admissible posteriors. Is selecting one a matter of epistemic decision?**  
     - **Yes** → **Decision-based selection**  
       *Awkward commitment: Epistemic values (e.g., accuracy) govern choice, introducing pragmatism.*  
     - **No** → **Family plus selection principle**  
       *Awkward commitment: Principles (e.g., max entropy) are underdetermined and may seem arbitrary.*  

  8. **Should we accept the rule without extra constraints?**  
     - **Yes** → **Jeffrey conditionalization**  
       *Awkward commitment: Order of updates affects outcomes (e.g., two dial looks yield different results).*  
     - **No** → **Supplemented rule**  
       *Awkward commitment: Extra constraints (e.g., rigidity) impose artificial conditions to ensure order-independence.*  

  ---

  **Diagnostic Cases**:  
  - **(a) Fabric in poor light (0.7 green)**: Tests reduction (Q1), evidence vs. response (Q2), and sharpness (Q4).  
  - **(b) Two successive dial looks**: Tests order-dependence (Q6, Q8).  
  - **(c) Late-formulated hypothesis**: Tests fixed conditionals (Q5) and framework rejection (Q3).  
  - **(d) Unreliable witness**: Tests set-valued/non-additive (Q4) and selection methods (Q7).  

  **Notes**:  
  - **Unnamed leaf (Q2-Yes)**: No known defense; unattractive due to conflation.  
  - **Empty leaf (Q6-Yes)**: Incoherent under fixed conditionals.  
  - **All leaves covered**: 8 positions (7 named, 1 unnamed), 1 empty.  
  - **No duplicated leaves**: Each path is unique.  
  - **Order of distinctions**: Optimized for case-based diagnostics, starting with reductionism (foundational).  

