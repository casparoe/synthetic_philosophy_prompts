answer: |-
  ## Essay Question (worth 25 marks; answer in approx. 75 minutes)

  Critically analyse the standard decomposition of the social discount rate (r = δ + θg), ensuring you:
  1.  Clearly distinguish between discounting *well-being* and discounting *consumption*.
  2.  Explain the distinct ethical interpretations and justifications for the pure time preference rate (δ) and the combined term (θg) reflecting aversion to inequality and expected consumption growth.
  3.  Contrast the nature of the argument for a positive δ based on *axiomatic consistency over an unbounded future* with arguments based on *prudential reasoning or market observation*.
  4.  Consider a scenario where future per-capita consumption is projected to *decline steadily* (g < 0). Explain what this implies for the sign of the overall discount rate (r), the sign of the consumption discounting component (θg), and the direction of the policy recommendation compared to a scenario with positive growth. Crucially, explain why a positive δ is not contradicted by a potentially negative θg in this scenario, and resist the claim that all discounting is inherently irrational.

  ---

  ## Model Answer (approx. 650 words)

  The standard decomposition of the social discount rate (r = δ + θg) is fundamental to cost-benefit analysis for long-term projects but ethically fraught. It disentangles distinct normative judgments often obscured in a single rate. Understanding its components and their interplay, especially under non-standard growth assumptions, is crucial for ethical long-term policy.

  **Distinguishing Discounting Objects:** The first critical distinction is *what* is being discounted. Discounting *consumption* (or monetary costs/benefits) reflects that a unit of consumption is less valuable to a richer future person than to a poorer present one. Discounting *well-being* (utility) reflects a direct preference for well-being occurring sooner rather than later, irrespective of consumption levels. The decomposition primarily addresses discounting *well-being*: δ represents the pure rate of time preference for utility, while θg adjusts for changes in the marginal utility of consumption due to growth. We discount the *consumption* stream at rate r to account for *both* the pure time preference for utility *and* the changing value of consumption over time.

  **Decomposing the Rate: δ vs. θg:** The components have distinct ethical justifications. The pure rate of time preference (δ) embodies the controversial notion that future utility *itself* is less valuable than present utility simply because it occurs later. Many philosophers argue δ should be zero for future generations, treating time of birth as morally irrelevant. However, a non-zero δ might be defended based on the probability of extinction, the right of present people to favour themselves slightly, or weaker obligations to the distant future.

  The combined term θg incorporates two elements: θ (the elasticity of marginal utility of consumption) and g (the expected growth rate of per-capita consumption). θ measures the rate at which the *value* (in utility terms) of an additional unit of consumption declines as consumption increases (aversion to consumption inequality). g reflects the expected change in consumption levels. Thus, θg adjusts future utility flows: if g > 0 (future generations richer), the marginal utility of their consumption is lower, so their utility gains are discounted more heavily (positive θg). θg is not a 'time preference' but an *equity-weighting* mechanism across time based on expected welfare levels.

  **Axiomatic vs. Prudential/Market Arguments for δ:** Arguments for a positive δ diverge fundamentally. *Prudential or market-based* arguments observe individual impatience (people prefer $100 now to $110 later) or market interest rates reflecting revealed time preference and risk. These posit δ > 0 based on empirical behaviour or perceived opportunity cost. In contrast, the *axiomatic argument* (often associated with Koopmans) is logical, not behavioural. It contends that for a complete, transitive, and continuous social preference ordering over *all* conceivable infinite utility streams, a positive δ is *necessary* to avoid impossibly strong obligations to the far future (e.g., requiring infinite sacrifice now for vanishingly small future gains). This δ is a consistency requirement for the ordering itself, not a statement about impatience. A zero δ can lead to paradoxical rankings.

  **Implications of Declining Consumption (g < 0):** The scenario of steadily *declining* per-capita consumption (g < 0) starkly reveals the distinct roles of δ and θg. With g negative, the term θg becomes *negative* (since θ > 0, aversion to inequality, is standard). A negative θg implies that future utility gains are *up-weighted* compared to the present – because future generations are poorer (lower consumption), the marginal utility of their consumption is *higher*. The overall discount rate (r = δ + θg) could now be negative (if |θg| > δ), zero, or positive but smaller than δ. A *negative* social discount rate means future benefits are valued *more* highly than present ones in consumption terms. This could dramatically shift policy recommendations: projects with large long-term benefits (like coastal defenses protecting impoverished future populations) become *more* desirable relative to projects with immediate payoffs. Crucially, this does *not* contradict a positive δ. δ reflects the pure time preference for utility. Even if θg is negative (up-weighting future utility due to poverty), a positive δ still applies *to that up-weighted utility stream*, reflecting a residual preference for utility now over later. The negative θg dominates the calculation because the ethical imperative to prioritize the utility of the impoverished future overwhelms the pure time preference discount.

  **Resisting the Irrationality Charge:** Declaring "all discounting irrational" oversimplifies. Discounting consumption based on changing marginal utility (θg) is fundamentally an ethical judgment about intertemporal equity, not irrationality. Even pure time preference (δ) has defenses: the axiomatic argument shows zero δ imposes logically problematic consistency constraints over infinite horizons, while prudential arguments recognize psychological reality and sovereignty. While a zero δ is a powerful ethical position, dismissing all discounting ignores the complex interplay of equity, logic, and feasibility embedded in the decomposition.

  Thus, the decomposition r = δ + θg forces explicit consideration of ethical choices: our valuation of utility timing (δ), our aversion to inequality (θ), our expectations of progress/decline (g), and the distinct logics justifying them. The negative growth scenario powerfully illustrates how declining welfare expectations can invert conventional discounting logic without negating the conceptual separation of its components.

  ---

  ## Marking Scheme (Total: 25 marks)

  1.  **Explains the Decomposition Formula (r = δ + θg) & Core Purpose (3 marks):**
      *   Clearly states the formula (1 mark).
      *   Explains r is the *consumption* discount rate (1 mark).
      *   Explains the formula decomposes the drivers of discounting *well-being* (1 mark).
      *   *Common Mistake:* Stating r is solely for discounting money without linking to utility/well-being; failing to mention the formula.

  2.  **Distinguishes Discounting Well-Being vs. Consumption (3 marks):**
      *   Clearly defines discounting well-being (utility) as preferring utility sooner (1 mark).
      *   Clearly defines discounting consumption as valuing a unit less for richer recipients (1 mark).
      *   Explains how r accounts for *both* (discounting consumption reflects δ + θg, which adjust well-being) (1 mark).
      *   *Common Mistake:* Conflating the two concepts; stating discounting consumption *is* discounting well-being without explanation; failing to explain the relationship between them via the decomposition.

  3.  **Explains δ and θg Separately with Ethical Justifications (4 marks):**
      *   Defines δ as pure time preference for *utility* and states common ethical critiques (e.g., indefensible discrimination) (1 mark).
      *   Defines θ (aversion to consumption inequality) and g (expected growth) (1 mark).
      *   Explains θg as an *equity adjustment* for changing marginal utility of consumption over time, *not* a time preference (1 mark).
      *   Contrasts the ethical nature of δ (controversial timing preference) vs. θg (equity weighting based on welfare levels) (1 mark).
      *   *Common Mistake:* Running δ and θg together as both representing "time preference" or "impatience"; misdefining θg (e.g., calling it "growth discounting" without linking to marginal utility); failing to highlight θg's role as an equity weight.

  4.  **Contrasts Axiomatic vs. Prudential/Market Arguments for δ (4 marks):**
      *   Clearly describes the prudential/market argument (based on observed behaviour, opportunity cost, interest rates) (1 mark).
      *   Clearly describes the axiomatic argument (necessity for consistent ranking over infinite streams, avoiding paralysis/paradox) (2 marks).
      *   Explicitly contrasts the *nature* of the arguments (empirical/behavioural vs. logical/consistency-based) (1 mark).
      *   *Common Mistake:* Treating the axiomatic argument merely as another form of "impatience"; conflating the two types of argument; failing to explain the *consistency* rationale for the axiomatic argument (focusing only on "far future dilution").

  5.  **Analyses the Declining Consumption Scenario (g < 0) (5 marks):**
      *   Correctly states g < 0 implies θg < 0 (as θ > 0) (1 mark).
      *   Explains that θg < 0 means *up-weighting* future utility (due to higher marginal utility for poorer future generations) (1 mark).
      *   Correctly analyses r = δ + θg: r could be negative, zero, or positive but small (1 mark).
      *   Explains implication for policy: Favours long-term projects more strongly (compared to g>0 scenario) (1 mark).
      *   **Crucially:** Explains why a positive δ is *not* contradicted by negative θg (δ discounts the *up-weighted utility*, θg adjusts for poverty; they are separate components addressing different things) (1 mark).
      *   *Common Mistake:* Claiming g<0 implies δ must be negative; stating r is always negative if g<0 without considering δ; failing to explain the *up-weighting* effect of θg<0; asserting δ and θg conflict or θg<0 implies rejection of δ; not linking the sign change to policy implications.

  6.  **Addresses the Irrationality Charge (3 marks):**
      *   Explicitly counters the claim that "all discounting is irrational" (1 mark).
      *   Argues θg reflects an ethical judgment about intertemporal equity, not irrationality (1 mark).
      *   Acknowledges critiques of δ but provides reasoned defenses (e.g., axiomatic necessity, prudential reality) without simply dismissing them (1 mark).
      *   *Common Mistake:* Simply agreeing all discounting is irrational; offering only a weak defense of discounting; focusing only on defending δ and ignoring the rationale for θg-based discounting.

  7.  **Structure, Clarity & Completeness (3 marks):**
      *   Logical flow addressing all parts of the question. (1 mark)
      *   Clear, precise language and definitions. (1 mark)
      *   Comprehensive coverage of required distinctions and scenario. (1 mark)

  **Grade Differentiation:**

  *   **A Grade (21-25 marks):** Demonstrates a thorough, nuanced, and precise understanding of all distinctions. Clearly and correctly explains the decomposition, the distinct justifications for δ and θg, the axiomatic vs. prudential contrast, and the complex implications of g<0 (especially the non-contradiction of positive δ and negative θg). Effectively counters the irrationality charge. Well-structured and comprehensive.
  *   **B Grade (16-20 marks):** Demonstrates a good understanding of the core concepts and distinctions. Correctly explains the decomposition and most components (δ, θg, g). Identifies the key arguments for δ (though may lack full nuance in contrasting axiomatic vs. prudential). Correctly identifies that g<0 likely lowers r and favours long-term projects, and may state θg<0. Might struggle slightly with the precise explanation of *why* positive δ and negative θg don't contradict (e.g., stating they are separate but not clearly explaining the up-weighting vs. discounting of utility). Addresses the irrationality charge adequately. Generally well-structured but may lack some depth or precision in the most complex areas (e.g., axiomatic argument, g<0 implications). *A B answer typically contains correct core explanations but may lose marks on the deeper nuances of the axiomatic argument, the full rationale for θg as equity-weighting, or the precise interplay in the g<0 scenario.*
