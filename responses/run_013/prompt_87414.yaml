prompt: |-
  You're a philosopher of mathematics — think carefully before answering, and maybe start by listing the nearby positions so you can see where the gaps are.

  I did a maths degree and drifted into reading philosophy on the side, and there's a shape of disagreement I keep running into that I don't have a word for. The concrete thing: my platonist friend thinks mathematical statements are true because there really are numbers and sets and functions out there that they describe. My nominalist friend thinks there are no such things and that maths is a usefull fiction, or a heap of conditionals about what follows from what. And yet the two of them agree, theorem by theorem, on which sentences are true — every single one. The disagreement never surfaces inside the mathematics; it only surfaces when you ask what the sentences are *about*. Same in the physics case: one thinks the numbers in a law of nature stand for genuine abstracta, the other thinks they're bookkeeping, and neither can point to a proof or an experiment that pulls them apart.

  So is there a name for a dispute with this shape — both sides accept every sentence in some domain, and they disagree only over what those sentences commit you to or what they're about — and a name for the further move where someone says that because of this the dispute was never a real disagreement at all? I know platonism and nominalism label the two sides; that's not what I'm after. I want the term (if it exists) for the *structure* of the standoff and for the diagnosis that it's empty, and I want the line drawn between that diagnosis and just refusing to do metaphysics. If nothing established fits, coin something and tell me what it includes and leaves out — and say whether the same structure turns up in, say, the free will debate or whether it's seperate to maths. Don't just hand me the label; I care about the carving, i.e. what the thing is, what it isn't, and where its edges are. Lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating my question.
reasoning: |-
  Alright, the user is asking about a specific kind of disagreement in the philosophy of mathematics. They describe a scenario where a Platonist and a Nominalist agree on all mathematical theorems but disagree on what those theorems are about. The user wants to know if there's a name for this type of dispute structure and the move to dismiss it as not a real disagreement.

  First, I need to recall relevant philosophical concepts. The key here is the distinction between meaning and reference, or semantics versus ontology. Positions like Carnap's internal/external questions come to mind. He argued that within a linguistic framework, questions are internal and have answers based on the rules, but external questions about the framework's reality are metaphysical and perhaps meaningless. This fits the user's example where both sides agree on the internal truths but disagree externally.

  Then there's Quine's criterion of ontological commitment, which is tied to quantifiers. But in this case, both parties accept the same sentences with quantifiers, yet interpret their ontological implications differently. That might relate to the difference between accepting a theory and believing in its entities, which ties into fictionalism or instrumentalism.

  The term "semantic ascent" might be relevant too. When disputes are shifted from talking about objects to talking about language, it could dissolve the disagreement. But the user mentioned that the dispute is about what sentences commit you to, which is ontological.

  The user also wants to know if this structure appears in other debates, like free will. In compatibilism vs. libertarianism, both might agree on physical descriptions but disagree on whether those allow free will. However, that might involve more than just semantics; it could involve different definitions. The math case seems purer because the agreement is on all sentences within the system.

  The user might be looking for a term like "merely verbal disagreement" or "metaphysical underdetermination." But "merely verbal" might not fit since it's not about word meanings but about ontological commitments. "Ontological deflationism" could be a coined term, but established terms like Carnap's "internal/external" distinction or "ontological pluralism" might be closer.

  I should check if terms like "non-cognitivism" apply, but that's more about ethics. In math, both sides might think the statements are cognitive but disagree on truth-makers. The key is the agreement on truth values despite different ontologies.

  Also, the user wants to distinguish this from refusing to do metaphysics. So Carnap's position is different; he's not refusing metaphysics but redefining its scope. Whereas someone like Wittgenstein might see it as a language game issue.

  For the free will part, the analogy might hold if both agree on all physical facts but disagree on whether "free will" applies. That's a matter of definition, similar to the math case. But in math, the agreement is on all theorems, whereas in free will, the disagreement is about the interpretation of the same facts.
answer: |-
  **Bottom line:** The structure you describe is best called **metaphysical underdetermination by linguistic practice**, and the move to dismiss it as non-substantive is **ontological deflationism**; this structure appears identically in debates like free will (compatibilism vs. libertarianism) but is distinct from anti-metaphysical quietism.

  ### The Structure: Metaphysical Underdetermination by Linguistic Practice
  1. **Core definition**: A dispute where:
     - **Full semantic agreement**: All parties assent to every sentence in a domain (e.g., all mathematical theorems, all empirical descriptions of physics).
     - **Metaphysical divergence**: They disagree fundamentally on the *ontological commitments* (e.g., abstract objects vs. fictions) or *truth-makers* (e.g., mind-independent structures vs. useful conventions) of those sentences.
     - **No operational difference**: No evidence or practice internal to the domain can resolve the dispute; it surfaces only under metaphysical interrogation.

  2. **Nearby positions & gaps**:
     - **Semantic realism vs. anti-realism**: Disagrees on truth *conditions* (e.g., intuitionism rejects excluded middle). *Your case has identical truth conditions*.
     - **Ontological commitment (Quinean)**: Focuses on what quantifiers bind (e.g., "∃x (x is a number)"). *Here, both sides parse quantifiers identically but interpret their import differently*.
     - **Verbal disputes**: Disagreement hinges on word meanings (e.g., "bachelor" excluding married men in open relationships). *Here, terms like "set" have fixed usage; disagreement is about reference, not meaning*.
     - **Gap filled**: This structure isolates *metaphysical interpretation* from *linguistic practice*. The underdetermination arises because language use fixes truth values but not ontology.

  3. **Scope**: Applies beyond math/physics:
     - **Free will**: Compatibilists and libertarians agree on all neuroscientific sentences describing a decision ("Neuron X fired at time T") but disagree on whether this constitutes "free will." The dispute is about what the descriptions *commit us to*, not the descriptions themselves.
     - **Ethics**: Non-naturalists and error theorists agree "Torture is wrong" is assertible but disagree on whether it refers to mind-independent properties.

  ### The Dismissive Move: Ontological Deflationism
  1. **Core definition**: The claim that such disputes are **non-substantive** because:
     - The agreement on all domain sentences exhausts cognitive content; metaphysical "add-ons" are pseudo-questions.
     - Ontology is reducible to pragmatic choices of linguistic frameworks (Carnap) or trivial semantic ascent (e.g., "Numbers exist" just means "‘Number’ is a useful concept").

  2. **Contrast with refusing metaphysics**:
     - **Anti-metaphysical quietism** (e.g., Wittgenstein): Rejects *all* metaphysics as confused. Deflationism *engages* metaphysics but deems *this specific dispute* empty.
     - **Naturalized metaphysics** (e.g., Ladyman/Ross): Demands metaphysics be grounded in science. Deflationism claims science *cannot* ground this dispute.

  3. **Key proponents**:
     - **Carnap** ("Empiricism, Semantics, and Ontology"): Distinguishes *internal questions* (answered within frameworks) from *external questions* (pragmatic choices between frameworks). Your dispute is external, hence non-cognitive.
     - **Hirsch** ("Quantifier Variance"): Ontological debates are verbal; "there are numbers" can be true in one conceptual scheme but false in another, with no fact of the matter.

  ### Boundaries of the Concept
  - **Includes**: Disputes where *all domain-specific assertions* are shared, and disagreement is *solely* about extra-linguistic grounding (e.g., "Do mathematical terms *refer_?_" vs. "Are they _merely_ consistent?").
  - **Excludes**:
    - Disputes affecting domain practices (e.g., intuitionism vs. classical math).
    - Epistemic disagreements (e.g., how we *know* mathematical truths).
    - Semantic indeterminacy (e.g., vagueness in "heap").
  - **Edge case**: Fictionalism. The nominalist *assents* to "2+2=4" but treats it as shorthand for "If there were numbers, 2+2=4." Deflationists see this as equivalent to Platonism in practice; realists see a substantive difference in attitude.

  ### Why This Carving?
  This structure highlights that language can be *fixed in use* while metaphysics remains *unconstrained*. The deflationist move collapses ontology into semantics or pragmatics, denying a "fact of the matter" beyond shared practice. In free will debates, it manifests when compatibilists argue libertarians misconstrue "free will" as requiring non-physical causation despite agreeing on all physical facts. The core is always: **agreement on sentences, divergence on what (if anything) makes them more than useful talk**.
