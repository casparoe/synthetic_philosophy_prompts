answer: |-
  ### Joke
  The hardware store's return counter was jammed. "No refund without a purchase record," the clerk told a man holding leaky caulk. "But my receipt washed away!" "Then I need a supervisor's approval," said the clerk. The supervisor arrived: "I can approve only if the item’s defective." The man poked the tube—it oozed. "Aha! Defective!" The supervisor frowned. "But without proof of purchase, I can’t verify it’s ours. Clerk?" The clerk sighed. "Back to needing a receipt." A woman waved her warranty pamphlet. "Mine says ‘no receipt needed if defective within 30 days’!" The supervisor tapped the laminated Terms of Service taped to his clipboard. "This overrides pamphlets. Terms state all returns require proof of purchase." "What if I find the receipt?" asked the man. The clerk pointed at the Terms. "Then we’d check if it’s defective!" The woman groaned, "But that’s where we started!" The supervisor beamed. "Exactly! And since the Terms dictate the rules but aren’t subject to them, we just keep looping. Isn’t it elegant?"

