  ## Dear Prudence (of the Long Now)

  **The Letter:**  
  Dear Prudence,  

  I run a small EA-aligned giving circle (mostly recent grads, ~$50k/year deployed). Lately, I’ve been deep-diving into Bostrom’s simulation argument. I keep hearing it’s supposed to be this great *dampener* for longtermist fanaticism. The idea seems to be: if we’re likely living in a simulation run by a vastly more advanced civilization, then the astronomical future value we’re trying to safeguard might not be “real” in the base reality, or our impact is negligible compared to the simulators’ level. Supposedly, this means I can relax a bit – maybe even pay rent without existential guilt, or skip donating to asteroid defense and fund malaria nets instead.  

  Here’s the problem: I can’t make the dampening *work* on my cost-effectiveness spreadsheet. If we assign even a tiny probability that we’re *not* simulated, then the expected value of mitigating existential risks (X-risks) still dominates everything because the potential future is so vast. The fanaticism just… reasserts itself. Now I’m paralyzed. My spreadsheet is a mess of conditionals and probability weights, and I can’t commit to any giving strategy. My girlfriend is furious because I spent all Sunday night on the EA Forum arguing about substrate independence instead of planning our anniversary trip.  

  Prudence, please settle this: Does the simulation argument *truly* license me to care significantly less about the far future? If so, *how much* less? Can I get a quantitative rule of thumb, maybe even something in writing I can show my giving circle (and my girlfriend)? Signed,  
  **Stuck in Superposition**

  ---

  **Prudence’s Reply:**  
  Dear Stuck,  

  Your paralysis is understandable. Wrestling with the simulation argument’s implications for value is like trying to nail fog to a wall. Let’s unpack the machinery carefully.  

  The simulation argument famously presents three disjunctive possibilities: (1) Almost all civilizations like ours go extinct before reaching technological maturity; (2) Almost none of them run significant ancestor simulations; or (3) We are almost certainly living in a simulation. You’re hoping (3) dampens longtermist zeal. But the dampening isn’t automatic or simple.  

  First, distinguish two distinct *sources* of fanaticism in longtermism:  
  1.  **The sheer scale of the potential future:** Trillions of future lives over billions of years.  
  2.  **The tiny probabilities leveraged by vast stakes:** A 0.0001% chance of preventing an extinction event still yields enormous expected value.  

  The simulation argument primarily interacts with the *first* source. If we’re simulated, the vast future *we* might create within our simulation could be irrelevant to the base reality’s value ledger. However, crucially, it does *not* necessarily negate the *second* source. Even if simulated, actions taken *within* the simulation might still have enormous, leveraged consequences *within the simulation’s own causal domain* – including preventing simulated extinction events affecting quadrillions of simulated beings. Are the simulators counting *that* value? We do not know.  

  This is the core uncertainty. The simulation hypothesis doesn’t tell us the far future is worthless. It tells us we are profoundly uncertain *who is counting the value*, and *what they value*. Perhaps the simulators only care about base-reality consequences, making our actions here negligible. Perhaps they care deeply about the welfare or historical accuracy of their simulations, making our actions crucial *within* the sim. Or perhaps they value the aggregate welfare across all realities, simulated or not. We lack a prior.  

  You’re correct that a small credence in *not* being simulated (~1%) can dominate calculations due to the astronomical stakes. However, the simulation hypothesis *does* introduce a significant dilution of probability mass across possibilities. It forces us to distribute our credence not just over possible futures *within* our reality, but over possible *meta-realities*. This complexifies the fanaticism; it doesn’t always erase it. Assigning a high probability to (3) might reduce the expected value of safeguarding *our specific* far future, but it potentially increases the (unknowable) value of actions pleasing or informative to the simulators.  

  Now, the uncomfortable symmetry: If the possibility of simulation dampens concern for the far future within *our* timeline, shouldn’t it equally dampen concern for near-term suffering? Why prioritize malaria nets for simulated beings if their suffering might not count in base reality? This isn’t necessarily a *reductio ad absurdum*. Some find it a feature, leading to a more balanced portfolio. Others see it as highlighting the argument's unsettling implications for *all* altruism under radical uncertainty. It underscores that the dampening isn’t a free pass for near-term focus; it’s a fundamental challenge to assigning value confidently at *any* timescale without knowing our ontological status.  

  So, can you relax about asteroid defense? Perhaps, but not decisively. Here’s a practical path forward:  

  1.  **Acknowledge Radical Uncertainty:** Accept that fundamental questions (Are we sims? Who counts value?) lack answers. Your spreadsheet *cannot* resolve this.  
  2.  **Diversify Your Uncertainty:** Allocate your giving circle funds across cause areas with different time-horizons and resilience to simulation worries. Maybe 60% to robust near-term good (e.g., global health), 30% to tractable X-risk reduction (which *might* matter even in sims, and matters hugely if we're not), and 10% to… well, fund your anniversary trip. Diversification hedges meta-uncertainty.  
  3.  **Value Information:** Support work that might reduce this radical uncertainty (e.g., fundamental physics, philosophy of mind). Knowing more could dissolve the paralysis.  
  4.  **Show Your Work (to Your Girlfriend):** Explain that you’re paralyzed because you genuinely can’t discern the fundamental nature of value in a potentially simulated universe, not because you don’t care about her or your rent. Then *commit* to a diversified allocation (see point 2) and close the spreadsheet. The cost of indecision and relationship strain is a near-term harm you *can* mitigate.  

  Quantifying the exact "dampening factor" is impossible. The simulation argument isn't an off-switch for longtermism; it's a lens of radical uncertainty forcing humility and diversification. Use it as such.  

  Wishing you clarity (or at least functional coping mechanisms),  
  **Prudence**  

