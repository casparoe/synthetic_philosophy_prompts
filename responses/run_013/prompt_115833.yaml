answer: |-
  Below is a comprehensive specification ("spec") for any theory addressing the "numbers problem" in rescue cases, designed as a foundation for your seminar. It's structured around **requirements** derived from paradigmatic cases, essential distinctions, and non-negotiable constraints. I’ve grounded each requirement in concrete scenarios or philosophical considerations, flagged what’s settled vs. contested in the literature, and emphasised practical implications for real-world triage. The language is precise British English, and I’ve avoided presupposing any particular solution (e.g., Taurekian, utilitarian, contractualist).

  ---

  ### **I. Core Cases the Theory Must Handle**  
  *(Illustrative examples forcing specific theoretical commitments)*  

  1. **Symmetric Strangers (Five vs. One)**:  
     - *Requirement*: Explain why saving five strangers should (or should not) take priority over saving one stranger, absent other variables.  
     - *Why*: Tests pure aggregation. A theory that ignores numbers entirely (e.g., "flip a coin") fails here.  
     - *Practical triage link*: Baseline for mass-casualty incidents with identical patients.  

  2. **Asymmetric Relationships (Five Strangers vs. One Friend/Kin)**:  
     - *Requirement*: Accommodate agent-relative duties without collapsing into total partiality (e.g., why you *might* save a close contact even at a cost to strangers).  
     - *Why*: Forces the theory to distinguish impersonal from personal obligations.  
     - *Practical triage link*: Paramedics deciding between family and strangers in a disaster.  

  3. **Asymmetric Need (Five Survivable Injuries vs. One Life-Threatening Injury)**:  
     - *Requirement*: Justify trading off survival against quality-of-life or urgency. Must not conflate "saving more lives" with "producing more good" (e.g., saving five minor injuries vs. one fatal injury).  
     - *Why*: Tests if the theory values lives equally or weights outcomes (e.g., life-years, welfare).  
     - *Practical triage link*: Field hospitals prioritising critical vs. stable patients.  

  4. **Probabilistic Survival (Five with 20% Death Risk Each vs. One Certain to Die)**:  
     - *Requirement*: Explain how uncertainty affects obligations. Must distinguish *ex ante* fairness (e.g., equal chance of survival) from *ex post* outcomes (e.g., actual deaths).  
     - *Why*: Reveals whether the theory focuses on expected value or individual claims under risk.  
     - *Practical triage link*: Disaster triage with limited resources and uncertain prognoses (e.g., earthquakes).  

  ---

  ### **II. Distinctions the Theory Must Preserve**  
  *(Conceptual boundaries a theory cannot blur)*  

  5. **Number Saved vs. Total Good**:  
     - *Requirement*: Treat saving five lives as distinct from maximising aggregate welfare (e.g., saving five artists ≠ "greater good" than saving one scientist).  
     - *Why*: Prevents reducing persons to "containers of value". Forced by asymmetric need cases.  
     - *Settled*: Consensus that conflating these is a category error (rejects crude utilitarianism).  

  6. **Strength of Individual Claim vs. Weight of Numbers**:  
     - *Requirement*: Explain why an individual’s claim to be saved isn’t automatically overridden by numbers (e.g., one person’s right not to be sacrificed for five).  
     - *Why*: Upholds the moral force of each person’s interests. Forced by symmetric strangers case.  
     - *Contested*: *How much* weight numbers should have is debated (Taurek vs. consequentialists).  

  7. **Ex Ante Fairness vs. Ex Post Optimality**:  
     - *Requirement*: Treat procedural fairness (e.g., giving all equal survival chances) as distinct from outcome efficiency (e.g., maximising actual lives saved).  
     - *Why*: Probabilistic cases show these can diverge (e.g., a lottery may be fair but risk more deaths).  
     - *Practical triage link*: Designing protocols perceived as legitimate by affected communities.  

  8. **Lotteries vs. Maximisation**:  
     - *Requirement*: Justify why a fair lottery might be required in ties (e.g., 1 vs. 1) but not when numbers differ (e.g., 5 vs. 1).  
     - *Why*: Tests if equality trumps efficiency. Forced by cases where maximisation seems intuitively compelling but lotteries honour individual equality.  
     - *Settled*: Dropping this distinction leads to incoherence (e.g., random choice in 5 vs. 1 appears absurd).  

  ---

  ### **III. Constraints the Theory Cannot Violate**  
  *(Foundational principles ruling out certain approaches)*  

  9. **Separateness of Persons**:  
     - *Requirement*: Reject theories that treat people as interchangeable (e.g., "dissolving" individuals into aggregate welfare).  
     - *Why*: Forced by all cases—e.g., saving five shouldn’t imply the one is "less valuable".  
     - *Settled*: Widely accepted post-Rawls; violating this invalidates most theories.  

  10. **Non-Transitivity Pitfalls**:  
      - *Requirement*: Ensure "better than" is transitive (e.g., if A is better than B, and B better than C, then A must be better than C).  
      - *Why*: Avoids cyclic preferences (e.g., in probabilistic cases where pairwise comparisons contradict aggregate judgments).  
      - *Settled*: A logical constraint; violating it makes decision protocols unworkable.  

  11. **Agent-Neutrality vs. Agent-Relativity**:  
      - *Requirement*: Allow for *some* agent-relative duties (e.g., partiality toward kin) without permitting total bias (e.g., "save my cat over five strangers").  
      - *Why*: Forced by asymmetric relationships cases.  
      - *Contested*: *How much* partiality is permissible (e.g., Williams vs. impartialists).  

  ---

  ### **IV. Your Two Specific Queries**  
  #### **1. Which single requirement does the most work in ruling out candidates?**  
  - **The ex ante vs. ex post distinction** is the most exclusionary.  
  - **Why**: Dropping it allows:  
    - Pure consequentialism (ignores fairness in probabilistic cases),  
    - Rigid egalitarianism (insists on lotteries even in 5 vs. 1),  
    - "Might makes right" triage (e.g., always saving the most salvageable, ignoring equal claims).  
  - **Practical impact**: In triage design, ignoring this enables protocols that are efficient but perceived as unjust (e.g., always prioritising low-risk cases, abandoning high-risk patients).  

  #### **2. Is there a subset of requirements that cannot be jointly satisfied?**  
  - **Yes: Aggregation and Separateness of Persons conflict irreconcilably**.  
    - **Aggregation** (giving weight to numbers) seems necessary in symmetric cases (saving five > one).  
    - **Separateness of Persons** forbids treating individuals as mere contributors to a sum.  
  - **Why they clash**:  
    - Aggregation requires comparing and weighing lives against each other, which separateness forbids as instrumentalising persons.  
    - Taurekians reject aggregation entirely; consequentialists violate separateness.  
    - **No consensus**: This is the core rift in the literature. Hybrid theories (e.g., "moderate aggregation") are contested compromises.  
  - **Which to drop?**  
    - *For practical triage*: Drop strict separateness. Triage protocols (e.g., START) *must* aggregate to handle large-scale disasters.  
    - *For moral theory*: Purists (e.g., deontologists) drop aggregation; pragmatists (e.g., rule-consequentialists) soften separateness.  

  ---

  ### **V. What’s Genuinely Settled vs. Contested**  
  | **Requirement**         | **Settled?** | **Notes**                                                                 |
  |--------------------------|--------------|---------------------------------------------------------------------------|
  | Cases must include asymmetry/probability | Yes      | Non-negotiable for any credible theory.                                  |
  | Distinction: Lives ≠ aggregate good | Yes  | Rejects "container" views (e.g., classic utilitarianism).                |
  | Constraint: Non-transitivity | Yes    | Logical necessity.                                                        |
  | Ex ante vs. ex post      | Mostly yes   | Rejecting this is fringe (e.g., extreme consequentialism).                |
  | Weight of numbers        | **Contested** | Taurek (no weight) vs. Kamm (some weight) vs. utilitarians (full weight). |
  | Permissible partiality   | **Contested** | Ranges from "impartialism" (Singer) to "agent-centred prerogatives" (Scheffler). |
  | Aggregation vs. separateness | **Contested** | The central unresolved tension.                                          |

  ---

  ### **VI. Genuine Desiderata vs. Disguised Prejudices**  
  - **Genuine Desiderata**:  
    - Handling asymmetry/probability (real triage isn’t abstract).  
    - Preserving ex ante/ex post (fairness matters in practice).  
    - Upholding separateness (prevents exploitative protocols).  
  - **Disguised Prejudices**:  
    - **"Numbers never matter"**: Often a kneejerk anti-utilitarian stance; ignored in actual disasters (e.g., sinking ships).  
    - **"Always maximise expected lives"**: Disguised consequentialism; ignores claims of high-risk patients.  
    - **"Agent-relativity is indefensible"**: Impartialist bias; rejects real-world roles (e.g., a parent saving their child).  

  ---

  ### **Summary for Triage Protocol Design**  
  A theory must:  
  1. **Handle real-world complexity** (probabilities, asymmetric needs, relationships).  
  2. **Balance fairness with efficiency** (lotteries when claims are equal, aggregation when numbers differ greatly).  
  3. **Respect persons as individuals** (no "discounting" lives based on utility).  
  4. **Accept trade-offs** (e.g., aggregation is pragmatically necessary in disasters, but justify when to override it).  

  The **irreducible conflict** is aggregation vs. separateness—practical triage leans toward aggregation but must mitigate unfairness (e.g., via transparent rules). This spec sets a high bar: few theories satisfy all requirements, which is why the debate persists. Use this to dissect readings critically from Week 2 onward.
