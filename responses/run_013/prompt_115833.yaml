  - Separateness of persons: Rejects utilitarianism’s "container" view.  
  - Non-transitivity pitfalls: Ensures rational choice foundations hold.  
  - Agent-relativity: Accommodates legitimate partiality (e.g., saving kin).  

  For the **two focal points**:  
  1. The most exclusionary requirement is likely the *distinction between ex ante and ex post perspectives*. Dropping it allows theories to ignore procedural fairness (e.g., "just save more, ignore how decisions feel to those at risk").  
  2. The sharpest conflict is between *outcome aggregation* (maximizing lives saved) and *separateness of persons* (individual claims can't be dissolved into sums). This is irreconcilable without compromise—e.g., aggregation "wins" in symmetric cases but not when claims differ radically.  

  On **contested vs. settled points**:  
  - Settled: Theories must handle asymmetric need and probabilistic survival; collapsing ex ante/ex post is fatal.  
  - Contested: Whether agent-relativity (e.g., saving kin) overrides numbers; whether lotteries are required in ties.  

