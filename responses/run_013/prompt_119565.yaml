answer: |-
  Here’s a prioritization of your research agenda, designed to tackle conceptual bottlenecks in descending order of leverage. The ranking maximizes **upstream impact** (resolving foundational issues that collapse downstream questions) and **pragmatic feasibility** (progress without new data collection). Trade-offs involve deferring operational questions until core premises are stable.

  ### Ranking Criteria (Weighted)
  1. **Upstreamness** (40%): Does resolving this question simplify or preempt others?  
  2. **Feasibility w/o New Data** (30%): Can philosophers/historians make progress via conceptual analysis & existing corpus?  
  3. **Downstream Impact** (20%): How radically would tool design/labeling criteria change?  
  4. **Neglectedness** (10%): Are others avoiding this due to discomfort?  

  ---

  ### Prioritized Agenda (with Justifications)
  #### 1. **The Cross-Cutting Problem**  
     *Why prioritize?*  
     - **Highest upstream leverage**: If domains (art, economy, climate etc.) have irreconcilable periodizations, your *entire project* of a unified label collapses. This question determines whether you’re building a tool or documenting a category error.  
     - **Downstream impact**: Resolving this could invalidate the need for a "single label" approach, redirecting effort toward multi-track periodization (e.g., tagging documents with domain-specific labels).  
     - **Feasibility**: Testable *now* with your corpus. Sample documents from different domains/regions and assess temporal coherence (e.g., does "early modern" tech align with "early modern" philosophy in India vs. France?).  
     - **Neglectedness**: Often glossed over by digital humanities projects for the sake of operational simplicity.  

     *Upstream of*: Grain size, residue problem, performative effects (if unified periods are incoherent, these become moot).  
     *First 6-month deliverable*: Heat maps showing temporal dis/synchronicity across domains/cultures in your corpus. If misalignment >70%, abandon monolithic labels.  

  #### 2. **Descriptive Cluster vs. Explanatory Mechanism**  
     *Why prioritize?*  
     - **Core validation challenge**: If a period is a *cluster*, validation requires statistical co-occurrence; if *explanatory*, it needs causal evidence. This dictates your classifier’s design (e.g., clustering algorithms vs. causal inference models).  
     - **Downstream impact**: Determines whether your tool looks for feature bundles (e.g., "medieval = Latin + certain verb forms + parchment") or seeks mechanisms (e.g., "printing press → discursive shift").  
     - **Feasibility**: Philosophers can lead conceptual work using historical case studies (no new data needed).  
     - **Neglectedness**: Often implicitly debated but rarely settled in labeling projects.  

     *Upstream of*: Residue problem (anomalies disprove mechanisms but not clusters), performative worry (explanatory labels risk stronger reification).  
     *First 6-month deliverable*: A validation protocol draft (e.g., "If mechanistic, we require evidence of X; if cluster-based, we tolerate Y% noise").  

  #### 3. **The Residue Problem**  
     *Why prioritize?*  
     - **Operational urgency**: Directly impacts classifier accuracy. Ignoring anomalies risks "forcing" documents into periods.  
     - **Downstream impact**: Decides whether your tool flags "misfits" (requiring human review) or forces a label.  
     - **Feasibility**: Requires corpus analysis but no new data. Linguist/historians can identify outliers in pilot samples.  
     - **Trade-off**: Less upstream than #1-2, but critical for practical tool-building.  

     *Upstream of*: Performative worry (handling residue transparently mitigates reification).  
     *First 6-month deliverable*: Typology of "misfits" in your corpus (e.g., 15% transitional, 5% truly anomalous) and rules for tagging them.  

  #### 4. **The Performative Worry**  
     *Why deprioritize?*  
     - **Important but unresolvable**: You can’t avoid reification effects—archives will use your labels regardless. Focus on *mitigation* (transparency, multi-labeling) once core questions are settled.  
     - **Downstream impact**: Affects ethics/framing (e.g., adding disclaimers) but not technical design.  
     - **Feasibility**: Requires sociological study beyond your scope.  
     - **Place later**: Address via documentation (e.g., "This label reflects X features, not an objective era").  

  #### 5. **The Grain Question**  
     *Why deprioritize?*  
     - **Red herring**: Like species classification, grain is *purpose-dependent*. Your tool should allow adjustable granularity (e.g., "early modern" vs. "1540–1680").  
     - **Downstream impact**: Purely implementational (slider bars in UI). No conceptual breakthrough needed.  
     - **Action**: Drop from agenda. Decide grain based on user-testing later.  

  ---

  ### The Trade-offs of This Ranking
  - **Speed vs. thoroughness**: By front-loading the cross-cutting problem (#1), you risk discovering your project is untenable early—but this saves wasted effort.  
  - **Theory vs. application**: Philosophers lead early (#2), corpus linguists later (#3). Avoids data paralysis.  
  - **Neglectedness vs. feasibility**: Performative worry (#4) is important but less actionable; grain (#5) is feasible but trivial.  

  ### What Could Change the Ranking in 6 Months?
  - **If cross-cutting analysis shows strong domain synchrony**: Downgrade #1, upgrade #2 (mechanism vs. cluster).  
  - **If residue is minimal (<5%)**: Downgrade #3, upgrade #4 (performative ethics).  
  - **If corpus reveals underexplored mechanisms** (e.g., climate events driving textual shifts): Upgrade #2.  

  ---

  ### Final Agenda & Rationale
  1. **Cross-cutting problem** → *Make or break the project’s premise*.  
  2. **Cluster vs. mechanism** → *Decide how you validate truth claims*.  
  3. **Residue handling** → *Ensure technical robustness*.  
  4. **Performative mitigation** → *Ethical due diligence*.  
  5. *Drop grain question* → Solvable via UI design.  

  This sequence forces confrontation with the deepest problem first (#1), uses philosophical clarity to enable technical choices (#2), and only then addresses practical challenges (#3–4). By month 12, you’ll know if your labels *can* exist and *how* they should be defined—freeing year 2 for tool-building.
