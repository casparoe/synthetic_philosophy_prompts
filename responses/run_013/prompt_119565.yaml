  The ranking would put cross-cutting first (as it threatens the entire labeling approach), followed by mechanism/cluster (foundational to validation). Grain size and residue are important but more implementational. The performative effect is crucial but may require longitudinal studies beyond their scope.

  Early research should focus on corpus analysis to test the cross-cutting hypothesis - results here could radically alter the project. Philosophy-heavy questions like mechanism/cluster could run parallel since they don't need new data. The first six months should deliver enough insight to confirm or adjust this ranking.

