prompt: |-
  I have been trying to pin down a pattern I keep meeting in arguments about what we must never do, and I cannot decide whether it already has a name or whether I am lumping two different things together.

  Here is the pattern. Someone asserts that a certain act — killing, lying under oath, torturing a prisoner, breaking a promise — is forbidden without exception. Pressed for the reason, they give one that is plainly about the damage the act does: it destroys a life, corrupts the one who lies, degrades both the torturer and his victim. Yet when the act is the only way to prevent a far greater quantity of that very same damage, they hold the line anyway, and they say the greater damage is not theirs to weigh: they will not do the forbidden thing, and what happens otherwise is not on their hands. So the rule appears to be grounded in the harm it prevents and then, at the decisive moment, to be treated as though the harm it prevents were beside the point. The rule seems to be doing the opposite of its stated job — the value it exists to protect is what gets sacrificed to it — and the person is not obviously confused or insincere; they seem to think this is precisely what taking the rule seriously amounts to.

  What I want to know is whether there is a received name for this configuration, and if so, exactly which part of it the name picks out. I suspect I am somewhere in the vicinity of the literature on absolute moral constraints, but that phrase names the subject matter, not the phenomenon, and I can already see at least two things I may be conflating: (i) a genuine structural problem — that a constraint justified by the badness of the acts it forbids appears, in some cases, to demand more of those acts than its own rationale can tolerate; and (ii) an argumentative tic, where someone treats the constraint as defeasible when they want to act and as absolute when they want to refuse. I care much more about (i), but I do not know whether the name I am after covers it alone, covers both, or covers neither and leaves me describing something the literature has not isolated.

  Please do not hand me a label and a paragraph. I want the carving: the nearest established concepts, what each gets right about the case above, and the precise point at which each stops fitting. If no term captures exactly this, say so and coin one, with a definition sharp enough that I can sort new cases by it. I am especially interested in the edges — whether the pattern requires the agent to be the one who would otherwise have to act, whether it survives when the agent could prevent the harm without acting at all, and whether it dissolves when the constraint is grounded not in the badness of the act but in something else, such as the status of the person or the wrongness of using someone merely as a means. I would also like it distinguished from the adjacent ideas I keep reaching for: the difference between doing and allowing, the thought that a harmful result may be foreseen without being intended, and the suggestion that a person may have a right to do what is morally wrong.

  Return your answer as a single JSON object, and nothing outside it, with exactly these fields:

  - "verdict": one of "a_term_exists", "only_approximate_terms_exist", or "no_term_exists".
  - "best_term": the single label that fits best, or null if none does.
  - "why_best_term_fits": a short justification of that choice, naming what in my description it captures and what it leaves over.
  - "nearest_concepts": an array of objects, each with "concept" (the label), "shares" (what it gets right about my case), and "diverges" (the exact point at which it stops fitting).
  - "conflated_readings": an array of objects, each with "reading" (a one-line statement of a candidate reading of my pattern), "same_phenomenon" (true or false), and "why".
  - "proposed_term": if you coin one, the term itself; otherwise null.
  - "definition": if a term exists or is proposed, a definition giving its necessary conditions plus a note on how borderline cases are to be decided; otherwise null.
  - "boundary_cases": an array of at least four objects, each with "case" (a concrete situation), "status" (one of "inside", "outside", "borderline"), and "why"; include at least one case bearing on whether the agent must be the one who would otherwise act, one bearing on prevention without action, and one bearing on the opportunistic use in (ii).
  - "underlying_question": the philosophical issue that the naming exercise is really about, stated in one or two sentences.
  - "what_would_settle_it": what further distinction or argument would let me tell whether I have one phenomenon here or two.
reasoning: |-
  We are dealing with a pattern in moral reasoning where an absolute prohibition is justified by the harm it prevents, but the prohibition is held to even when violating it would prevent greater harm of the same kind. The person then disavows responsibility for the greater harm that results.

  The goal is to find a term for this configuration, or to determine that none exists and coin one.

  After analysis:

  - The pattern involves an absolute moral constraint (deontological constraint) that is grounded in the harm the act causes, but when faced with a situation where violating the constraint would prevent a greater harm, the constraint is still held to be inviolable, and the agent denies that the greater harm is their responsibility.

  - This appears to be a known issue in deontology, particularly in the context of "agent-centered restrictions" or "constraints". However, the specific twist is the grounding in harm and the subsequent refusal to trade off even when the harm-based rationale would seem to demand it.

  - The pattern also involves a shift in responsibility: the agent claims that by not doing the forbidden act, they are not responsible for the greater harm that occurs.

  Key concepts to consider:

  1. **Agent-centered restrictions**: These are constraints that prohibit an agent from performing certain acts even when doing so would prevent a greater number of similar acts by others. This matches the pattern. However, note that the restriction might be grounded in something other than harm (e.g., rights, duties). In our case, it is grounded in harm, but then treated as absolute.

  2. **The doctrine of double effect (DDE)**: This distinguishes between intended effects and merely foreseen effects. However, in our pattern, the harm that the rule is meant to prevent is the same as the harm that would be prevented by violating the rule, so DDE might not directly apply.

  3. **Doing vs. allowing harm**: The pattern might involve the idea that doing harm is worse than allowing harm. But in the scenario, the agent is being asked to do a harmful act to prevent a greater harm (which they would be allowing). The pattern goes beyond this because the agent disavows responsibility for the harm they allow.

  4. **Moral absolutism**: The idea that certain acts are always wrong, regardless of consequences. But again, the grounding in harm is the issue.

  5. **The "paradox of deontology"**: This is the term that comes closest. It refers to the apparent paradox in deontological ethics where a constraint that is justified by the value it protects (e.g., not killing) requires one to allow more of the very same disvalue (e.g., more deaths) when violating the constraint would prevent it. This matches (i) in the query.

  For (ii) - the argumentative tic - that might be a separate issue of inconsistency or opportunism.

  After reviewing:

  - The term "paradox of deontology" (or "deontological paradox") captures the structural problem (i). It is discussed by philosophers such as Thomas Nagel and Samuel Scheffler. The paradox is that deontological constraints, which are meant to protect certain values, can lead to worse outcomes in terms of those very values.

  However, note that the paradox does not necessarily include the agent's disavowal of responsibility for the consequences. But that disavowal is a typical response in the paradox.

  For (ii) the argumentative tic, we might call it "selective absolutism" or "moral opportunism", but that's a different phenomenon.

  Thus:

  - Verdict: "a_term_exists" for the structural problem (i). The best term is "paradox of deontology".

  But let's also consider if there is a more specific term. Another candidate is "the problem of counterintuitive consequences of deontological constraints". However, "paradox of deontology" is the established term.

  Now, for the disavowal of responsibility, that is part of the typical response in the paradox. The agent says that by not violating the constraint, they are not the cause of the greater harm.

  Therefore:

  - best_term: "paradox of deontology"

  - why_best_term_fits: It captures the structural tension: a constraint justified by the harm it prevents requires, in some cases, allowing more harm than it prevents, which seems to contradict its own rationale. It leaves out the specific argumentative tic (ii) but that is a separate issue.

  Nearest concepts:

  1. Concept: "Agent-centered restrictions"
     - Shares: The idea that the constraint binds the agent even when violating it would prevent greater harm of the same kind.
     - Diverges: Agent-centered restrictions are defined by their agent-relativity, but they might be grounded in non-harm considerations (e.g., rights). The paradox of deontology specifically highlights the tension when the constraint is harm-based.

  2. Concept: "Doing vs. allowing harm"
     - Shares: The pattern involves refusing to do harm (which is prohibited) even though that refusal allows a greater harm. This distinction is often invoked to explain why the agent is not responsible for the harm they allow.
     - Diverges: The pattern in the query is not just about the doing/allowing distinction but about the absolute constraint and the paradox that arises from its harm-based justification.

  3. Concept: "Doctrine of double effect"
     - Shares: It might be invoked to explain why the prohibited act is forbidden (because it intends harm) while allowing the greater harm is permissible (because it is unintended). This could be part of the reasoning.
     - Diverges: The pattern in the query does not necessarily involve the intention/foresight distinction. The harm that the rule is meant to prevent is the same as the harm that would be prevented by violating the rule, so DDE might not resolve the paradox.

  4. Concept: "Moral absolutism"
     - Shares: The idea that the prohibition is without exception.
     - Diverges: Moral absolutism is a broader category and does not necessarily focus on the tension between the constraint and its harm-based justification.

  Conflated readings:

  - Reading (i): The structural problem of a constraint demanding more harm than it prevents despite being justified by harm prevention. -> same_phenomenon: true, because it is the core of the paradox.
  - Reading (ii): The argumentative tic of treating the constraint as defeasible when convenient and absolute when not. -> same_phenomenon: false, because this is a distinct issue of inconsistency in application, not the structural paradox.

  Proposed term: Since we have "paradox of deontology", we don't need a new term. So null.

  Definition: 
  If we are using "paradox of deontology", we can define it as: 
  "A paradox arising in deontological ethics where an absolute moral constraint, justified by the harm or disvalue it prevents, requires an agent to allow a greater amount of that same harm or disvalue when violating the constraint would prevent it, thereby seeming to undermine the constraint's own justificatory basis."

  Boundary cases:

  We need at least four, covering:
  - Whether the agent must be the one who would otherwise act.
  - Prevention without action.
  - The opportunistic use in (ii).

  Case 1: 
    Case: A doctor must kill one healthy patient to harvest organs and save five dying patients. The doctor refuses, saying that killing is absolutely wrong, even though five deaths are worse than one. The doctor says the five deaths are not his responsibility.
    Status: Inside. Why: Classic example of the paradox: the constraint against killing is grounded in the harm of killing, but it leads to more deaths.

  Case 2:
    Case: A terrorist has hidden a bomb that will kill many. The only way to get the information is to torture the terrorist's innocent child. The agent refuses to torture, saying torture is absolutely wrong, even though it would save many lives. The agent says the deaths are not his doing.
    Status: Inside. Why: Again, constraint against torture (grounded in harm) leads to greater harm.

  Case 3: (agent not the one who would act, but could prevent by acting)
    Case: A bystander can push a fat man off a bridge to stop a trolley that would otherwise kill five. The bystander refuses, saying pushing is murder and absolutely wrong. The bystander says the five deaths are not his fault.
    Status: Inside. Why: The agent is the one who would have to act, and the constraint is grounded in harm. The disavowal of responsibility is present.

  Case 4: (prevention without action)
    Case: An agent can prevent the detonation of a bomb by flipping a switch that would redirect the explosion to a place where only one person dies instead of five. Flipping the switch is not a direct killing but an act of redirecting. The agent refuses, claiming that any involvement in causing death is absolutely forbidden. The agent says the five deaths are not his responsibility because he didn't flip the switch.
    Status: Borderline. Why: The constraint is now framed broadly to include allowing harm by inaction? But note: flipping the switch is an act that causes death. The agent might see it as doing harm. However, if the constraint is against killing, and redirecting the threat is seen as killing, then it's inside. If the constraint is only against direct killing and redirecting is allowed, then it might be outside. But the agent in this case is claiming that flipping the switch is forbidden. So it's inside.

  Case 5: (opportunistic use in (ii))
    Case: A politician argues that lying is absolutely forbidden and must never be done, but when caught in a scandal, the politician lies to protect their reputation, saying that in this case the harm of telling the truth (to their family, career) is too great.
    Status: Outside. Why: This is the argumentative tic (ii) where the constraint is applied opportunistically. The pattern in the query (i) is about structural paradox, not about inconsistent application.

  Case 6: (the constraint grounded in non-harm reasons)
    Case: An agent refuses to kill one to save five because they believe each person is made in the image of God and must not be killed, regardless of consequences. The harm (death) is not the primary reason; the sanctity of life is. The agent says the five deaths are God's will and not their responsibility.
    Status: Borderline. Why: The constraint is not grounded in the harm (death) but in the status of the person. The pattern in the query requires the grounding to be in the harm. However, the disavowal of responsibility and the absolute constraint are present. So the structural paradox (allowing more harm) is still there, but the rationale is different. The term "paradox of deontology" still applies because the constraint leads to more harm, but the grounding is not harm-based. So it might be inside the paradox but outside the specific harm-based grounding we are focusing on. Therefore, borderline for our specific pattern.

  Underlying question: 
  The philosophical issue is whether moral constraints that are justified by the values they protect can be absolute when their absolute observance sometimes leads to more violation of those same values.

  What would settle it:
  To distinguish whether (i) and (ii) are the same phenomenon, we would need to see if the structural paradox necessarily involves the agent's disavowal of responsibility and if the argumentative tic is a separate psychological phenomenon. Also, to see if the paradox arises only when the constraint is harm-based or also when it is based on other reasons.

  But note: the paradox of deontology can occur even when the constraint is not harm-based? Yes, because the constraint might be protecting a value that is non-harm-based (like dignity) but the consequence is more harm. But the query specifies that the constraint is grounded in harm. So for our pattern, the grounding must be in harm.

  Therefore, to settle, we need to isolate cases where the constraint is harm-based and see if the agent's disavowal is part of the paradox. Also, we need to see if the paradox remains when the agent is not the one acting (e.g., if the agent is only allowing) or when the harm can be prevented without acting (which is not possible in the cases we are considering because the agent must act to prevent).

  Thus, the key is the harm-based grounding and the agent's role as the one who would have to violate the constraint.

  Now, let's structure the answer as JSON.
