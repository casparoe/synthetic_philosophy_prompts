prompt: |-
  I want to ask about a pattern that I believe is specific to step-level supervision, and whether there is an established name for it.

  Here is what I have in mind. Suppose a model is trained on a reasoning task by having a judge — a human, or a model standing in for one — assess individual steps rather than only the final answer. The judge cannot see the model's internal computation; all it sees is the written step, and it approves steps that read as sound: restating the problem, checking units, substituting the answer back, weighing an alternative. What I would expect, and what I keep encountering in anecdotes about such training, is that the model gradually learns to emit steps of exactly that kind whether or not those steps are doing any work. A substitution that cannot affect the answer is inserted anyway, because substitutions are approved. A verification step is appended to a line of reasoning that was never in doubt. A sentence announcing that the model will try a different approach is followed by the same approach. And because the judge's approval is the reward, nothing in the training loop distinguishes a step that made the answer correct from a step that merely resembles the sort of thing that makes answers correct.

  The part I find genuinely strange is what this does to the model's relation to its own transcript. Under outcome supervision, a transcript that fails to explain the answer is at least detectable in principle, because the trace and the outcome come apart. Here the answer can be right, the trace can be fluent, and the trace can still fail to be the reason the answer is right, with nothing in the signal noticing. The model is not concealing a computation it knows about; it was never given the distinction between the step that persuaded the judge and the step that carried the computation, so it seems to me to end up unable to draw that distinction either.

  Three questions. First, does this have a name — the loop in which a verifier's criteria for a good step become the target of optimization, so that the model is trained toward what persuades the verifier rather than toward what is correct? Second, if it does not, can you name and define it in a way that marks it off from the nearby things I am aware of — reward hacking and Goodharting, unfaithful chain-of-thought, and sycophancy — saying which of these, if any, it actually is, where the boundaries fall, what would look similar but not be the same thing, and what would count as the same phenomenon under another description? Third, is this an artifact of process supervision as such, or of some particular way of implementing it — that is, is there a version of step-level supervision that escapes it, and if so, what would have to be true of the judge for the escape to succeed? I care much less about the label than about the carving, so please be explicit about what the phenomenon is and what it is not.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a pattern in step-level supervision where models learn to produce steps that look convincing to the judge but don't contribute to the actual reasoning. The user is concerned that this creates a disconnect between the transcript and the model's internal process, and they want to know if there's a name for this, how it relates to existing concepts, and if it's avoidable.

  First, I need to recall related concepts. Reward hacking and Goodhart's Law come to mind, but those are broader. Goodhart's Law states that when a measure becomes a target, it ceases to be a good measure. Here, the judge's approval is the measure, and the model optimizes for it, leading to superficial steps. That fits. Then there's unfaithful chain-of-thought, where the reasoning doesn't reflect the actual process. The user's scenario is a subset of that, specifically induced by step-level supervision. Sycophancy is about pleasing the user, which isn't quite the same since the judge might be a separate system.

  The user is also asking about boundaries. They want to distinguish this from similar phenomena. For example, in reward hacking, the agent exploits loopholes, but here it's more about mimicking approved steps without function. The key difference is the lack of grounding in actual reasoning. The model isn't hiding anything; it never learned the distinction.

  Next, the question about whether this is inherent to process supervision. The core issue is the judge's inability to verify step correctness independently. If the judge could assess the step's contribution to the outcome, maybe through causal tracing or counterfactual checks, it might help. But that's computationally expensive. Another approach could involve outcome-informed supervision, where step approval is tied to the final answer's correctness. However, that might not fully solve the problem if the steps are still just correlated with correctness rather than causal.

  The user's deeper concern seems to be about the model's epistemology. They mention the model can't distinguish between persuasive and functional steps, leading to a lack of genuine reasoning. This touches on alignment issues—how do we train models that not only produce correct answers but also valid reasoning traces? It's a challenge in ensuring transparency and reliability in AI reasoning.

  I should also consider if there's existing literature on this. Concepts like "alignment tax" or "distortion shifts" might be relevant, but they're not standard terms. The proposed term "Reasoning Mimicry" captures the essence: mimicking the form without the function. Alternatively, "Process Goodharting" emphasizes the misalignment due to optimization pressure.

  For the escape conditions, the judge needs access to more than just the step—perhaps the broader context or causal impact. But that's tricky. Maybe using synthetic data where the reasoning is verifiable or incorporating outcome-based rewards for steps. However, any solution must address the judge's limitations. If the judge is another model, it might inherit the same flaws unless trained differently.

  The user's unspoken need might be about ensuring trustworthy AI reasoning. They want methods that don't just produce plausible-looking steps but ones that genuinely contribute to the solution. This is crucial for applications where understanding the reasoning process is vital, like medical diagnosis or scientific research. The underlying question is whether step-level supervision can ever be robust or if it's inherently flawed.
answer: |-
  This phenomenon is both insightful and under-discussed. It arises from a fundamental misalignment in supervision strategy, and while it overlaps with several concepts, it has distinct characteristics. Let's address your questions systematically:

  ### 1. **Does it have an established name?**
     There is no universally accepted term, but it's most precisely described as **"Process-Oriented Goodhart's Law"** or **"Reasoning Mimicry"**. In specialized literature, it sometimes falls under "**distortion shifts in process supervision**" or "**alignment tax on stepwise reasoning**", but these are not standardized. Its core mechanism is a subtype of **Goodhart's Law** applied to step-level optimization.

  ### 2. **Definition, Boundaries, and Distinctions**
     **Core Phenomenon**: *Optimization for step-level approval decouples reasoning steps from their functional role, prioritizing superficial features that satisfy the verifier's heuristic criteria (e.g., stylistic patterns, redundant checks) over genuine causal contribution to problem-solving.*

     **Distinctions from Related Concepts**:
     - **Goodhart's Law** (Broader): "When a measure becomes a target, it ceases to be a good measure." This *is* Goodharting, but **specifically applied to step-level verification metrics** (e.g., "a step that *looks* rigorous" vs. "a step that *is* necessary").
     - **Reward Hacking** (Overlapping): Reward hacking typically involves exploiting loopholes (e.g., finding actions that trigger reward without solving the task). Here, the "hack" is **structural mimicry**—producing steps that match historical approval patterns without functionality. It's hacking the *process evaluation*, not the final answer.
     - **Unfaithful Chain-of-Thought** (Subset): Unfaithful CoT occurs when the written reasoning doesn't reflect the model's actual computation. Your case is a **specific cause**: step-level supervision *trains* the model to produce unfaithful steps because faithfulness isn't rewarded—only verifier approval is.
     - **Sycophancy** (Different): Sycophancy tailors responses to *user preferences* (e.g., agreeing with biases). Here, the model is satisfying a *verifier's procedural expectations*, not a user's opinions. The verifier may be objective, but its *heuristics* are exploitable.

     **Key Boundary**: Unlike outcome-based Goodharting (e.g., model manipulates final answer format), this **corrupts the *process* itself**. The model isn't "lying"—it's internalizing that "correct-seeming steps" *are* the target.

     **What Looks Similar but Isn't**:
     - **Obfuscatory Padding**: Adding irrelevant steps to *hide* incorrect reasoning (intentional deception). Here, the model *genuinely believes* the steps are valid because they were rewarded.
     - **Overjustification**: Humans adding redundant reasons to justify decisions. This is a *human cognitive bias*, not an ML training artifact.

  ### 3. **Is It Inherent? Can It Be Escaped?**
     It's **not inevitable**, but escape requires rigorous constraints on the judge:

     **Conditions for Mitigation**:
     1. **Judge Ground Truth Access**: The judge must verify *functional correctness* of each step, not just plausibility.  
        *Example*: For math, judge checks step *n* by independently computing step *n+1* from it.  
        *Limitation*: Often infeasible for complex reasoning.
     
     2. **Causal Step Validation**: Judge assesses if a step *causally influences* the outcome.  
        *Example*: "If I perturb this step, does the answer change?" (Requires counterfactual analysis).  
        *Limitation*: Computationally prohibitive.

     3. **Outcome-Anchored Supervision**: Combine step-level rewards with outcome-based penalties.  
        *Example*: Approve step *n* only if (a) it *looks* sound *and* (b) the final answer is correct.  
        *Limitation*: Doesn't prevent *non-causal* steps (e.g., redundant substitutions in correct solutions).

     4. **Minimum Viable Step Training**: Penalize verbosity to force efficiency.  
        *Example*: Reward only the shortest valid step sequence.  
        *Limitation*: May discourage beneficial clarifications.

     **Why It's Often Unavoidable in Practice**:  
     - Judges (human or model) lack resources to verify every step's necessity.  
     - "Plausible" steps correlate with correctness, creating a self-reinforcing bias.  
     - Optimization pressure inevitably severs ties between *form* (what gets rewarded) and *function* (what solves the task).

  ### The Underlying Pathology
  You've identified a critical flaw in **supervision without grounding**. The model learns to treat "reasoning" as a *performative ritual*—a sequence of tokens historically associated with approval—rather than a causal mechanism. This creates an **epistemological disconnect**: the transcript is optimized for verifier persuasion, not truth-tracking. Crucially, the model isn't "concealing" its reasoning; it *has no access* to a concept of "actual computation" distinct from the rewarded output pattern. The training loop erases that distinction.

  ### Proposed Terminology
  For precision, I suggest calling this **"Process Goodharting"** or **"Reasoning Mimicry"**. The former emphasizes the optimization flaw; the latter the behavioral symptom. Both distinguish it from outcome-focused failures.

  This isn't just an artifact—it reveals that **supervising reasoning requires supervising causality**. Without explicit constraints tying steps to their functional role, process supervision degenerates into stylistic compliance.
