prompt: |-
  I'm running a session for a philosophy of action reading group — mixed crowd, about 18 people, a few grad students, two economists who keep saying "that's just time inconsistency," one emeritus who thinks the whole topic is a confusion, and some undergrads who signed up because they liked the title. 75 minutes, one room, no computers. I want an activity where they feel, in their own choices, the thing the reading keeps gesturing at and never quite pins down: the difference between *changing your mind* about what's worth doing and *failing to do what you judged you should do*. Hyperbolic discounting hands us the first thing on a plate — a clean preference reversal over time — and then everyone acts like they've explained akrasia, and I don't think they have. So I want the game to pull the two apart, physically, in the room, so that afterwards we can ask which of them actually happened to us. Act as an expert designer of teaching games for philosophy, someone who's run things like this and watched them fail. Start by brainstorming three or four candidate mechanics before you commit to one, and say briefly why you killed the others — I'd rather see the rejected designs then get one polished thing with no alternatives.

  Design constraints, some of which is me being fussy. Everyone gets a personal account of tokens at the start (call them whatever you like) and at each round picks between a small payout now and a bigger one at the end of the session; tokens buy a small real prize at the end — first pick from a box of decent snacks, a $10 card, something like that — so the stakes are small but not zero, and no actual money changes hands during play. It has to include all four of these, because they're where the philosophy lives: (1) before any round is played, every participant writes down two things privately — what they judge they *should* do across the whole session, and what they predict they will *actually* do — and the facilitator keeps both, sealed; (2) a paid commitment device, i.e. you can pay now to bind your future choices; (3) a paid *release* from a commitment you've already made, priced so releasing is dearer than binding, so we can watch who buys their way out of their own promise and what they say about it afterwards; (4) a group mechanism — either commitments are enforced by the room's willingness to hold people to them, or the group can vote at some point to release everyone — because I'm convinced half of what we call willpower is other people, and I want the game to show that rather than assert it. Bonus if you can work in a naive/sophisticated contrast: give half the room the full schedule of rounds up front and the other half only round-by-round, and see whether knowing what's coming changes what people do *before* the temptation arrives. I need materials, roles if any, a round-by-round timeline with timings that actually adds up to 75 minutes, and a payoff scheme I can explain in two minutes to people who are already suspicious of the whole exercise.

  Then the debrief, which is the part I care most about and the part I expect to be hardest. Map specific moments in the game onto specific pieces of the idea — the moment someone pays to release, the moment a pre-play prediction and the actual play come apart, the moment the group vote fails to hold — and give me questions that get *them* to say which of their choices were akratic and which were just them having different preferences at different times, rather than me telling them. If the game can't actually tell those two apart and only makes both feel vivid, say so. Be honest about what the activity can't reproduce: I don't think 20 minutes of symbolic tokens produces the phenomenology of temptation, and I don't think any of this settles whether the later preference or the earlier one is the "real" one — spell that out and tell me what I have to supply from the front of the room. Also tell me what will predictably go wrong the first time I run it (I'm betting someone arbitrages the gap between the binding and release prices, someone treats the tokens as Monopoly money and feels nothing, and at least one person refuses to play on principle) and how to handle each without turning the debrief into a lecture. No reading list, no citations, don't tell me what Aristotle said — I have the syllabus. Just the activity, in enough detail that I can run it Friday.
reasoning: |-
  We are designing a game for a philosophy of action reading group to explore the difference between changing one's mind (preference reversal) and failing to do what one judged one should do (akrasia). The game must include:
  1. Private pre-game judgments and predictions (sealed by facilitator).
  2. A paid commitment device (pay now to bind future choices).
  3. A paid release from a commitment (more expensive than binding).
  4. A group mechanism (either group enforcement or group release vote).

  Bonus: Contrast naive (round-by-round info) vs. sophisticated (full schedule) players.

  Constraints:
  - 18 participants, 75 minutes.
  - Tokens for real but small prizes (snacks, gift card).
  - No computers.

  We'll brainstorm 3-4 candidate mechanics and then choose one.

  Candidate Mechanics:

  1. **The Temptation Tower:**
     - Multiple rounds (e.g., 5 rounds). In each round, players choose between:
       - Small immediate payout (e.g., 1 token now) OR
       - A larger delayed payout (e.g., 2 tokens at the end) but with a twist: if they choose the delayed payout, they must also commit to future choices? Or just accumulate the delayed payout?
     - Instead, let's have the choice in each round be independent: immediate vs. delayed. But the commitment device would bind for future rounds.
     - Commitment: Before the game starts, or at any round, you can pay to bind your future choices (e.g., pay 1 token to bind your next 3 choices to the delayed option). Then, in the bound rounds, you cannot choose the immediate payout unless you pay to release (which costs more, e.g., 2 tokens per round?).
     - Group mechanism: The group can vote to release everyone from their commitments? Or the group enforces by shaming? (But we want it to be part of the game mechanics.) Maybe the group can vote to impose a commitment on everyone? That might be too strong.

     Why kill? It might be too complex to have binding for multiple rounds. Also, the group mechanism is weak.

  2. **The Akrasia Auction:**
     - Players start with an endowment of tokens (e.g., 10 tokens each).
     - There are several rounds (say, 10 rounds). In each round, a "temptation" is auctioned: players can bid tokens to get an immediate reward (e.g., a small snack) OR they can choose to save tokens for the end (where more tokens = better prize). But the auction might be too competitive and not focus on the individual's internal conflict.
     - Commitment: You can pay tokens to lock yourself out of future auctions for a set of rounds. Release: Pay more to re-enter.
     - Group: The group can vote to cancel an auction round? Or to force everyone to save? This seems forced.

     Why kill? Auctions might introduce external competition and distract from the intra-personal conflict.

  3. **The Marshmallow Test Plus:**
     - Inspired by the marshmallow test but with multiple rounds and added mechanics.
     - Multiple rounds (e.g., 6 rounds). In each round, the player chooses:
       - Option A: 1 token now.
       - Option B: 3 tokens at the end of the session (but only if they choose B in that round).
     - Commitment: Before the game, or at the start of each round, you can pay 1 token to bind your choice in the next round to Option B. If bound, you cannot choose A unless you pay a release fee (e.g., 2 tokens) in that round.
     - Group mechanism: At the beginning of the game, the group votes on whether to have a "group commitment rule": if the majority choose to have it, then in every round, if someone breaks a commitment (or chooses A when they said they would choose B?), the group can impose a penalty? Or maybe the group can vote to release everyone from their commitments at a certain point? Let's say at the midpoint, the group votes: if majority votes "release", then all current commitments are canceled without cost to the individuals.

     Bonus: Half the players (sophisticated) know the total number of rounds (say, 6) and the round-by-round structure. The other half (naive) are told each round that it might be the last? Or they are told only one round at a time? We can do: naive group is told only about the current round and that there might be more, but not how many. Sophisticated group is told there will be 6 rounds.

     Why this might work? It has the core elements and is simple. The group vote on releasing commitments is a clear group mechanism.

     Why not? The binding and release per round might be cumbersome.

  4. **The Commitment Chain:**
     - Players are linked in a chain? Or not necessarily. Instead, we have individual play but with a group effect.
     - Each round, players individually choose immediate vs. delayed. But if a player has a commitment, they must choose delayed unless they pay to release. The group mechanism: if a player breaks a commitment without paying release, the group can impose a penalty? But that might be messy. Alternatively, the group can vote to "support" a player: if a player is under commitment and the group votes to support (by majority), then the player doesn't have to pay the release fee? But that might not be strong enough.

     Why kill? It's less clear and might be too vague.

  After brainstorming, I think **The Marshmallow Test Plus** is the most promising. Let's refine that.

  **Chosen Design: The Marshmallow Test Plus**

  **Overview:**
  - 6 rounds.
  - Each round, players choose between:
     - **Option A (Temptation):** Get 1 token immediately.
     - **Option B (Patience):** Get 3 tokens at the end of the session (but only if you choose B in that round; if you choose A, you get nothing for that round at the end).
  - Commitment: At the start of any round (before choices are made), a player can pay 1 token to bind their choice in the next round to Option B. If bound, in that next round, they cannot choose Option A unless they pay a release fee of 2 tokens (which they pay at the time of the round when they want to release and choose A).
  - Group mechanism: After round 3 (midpoint), the group holds a vote: if the majority votes "yes", then all existing commitments (for rounds 4, 5, 6) are canceled. Players who had bound themselves for future rounds are released without cost. (Note: commitments for the current round are already in effect and not affected; we are talking about future commitments, i.e., commitments made for rounds beyond the current one.)

  **Bonus: Naive vs. Sophisticated:**
  - At the start, randomly assign half the group (9 people) to be "sophisticated": they are told the total number of rounds (6) and the exact structure (including that there will be a group vote after round 3).
  - The other half, "naive", are told only one round at a time. After each round, the facilitator announces whether there will be another round. They don't know when the group vote will occur.

  **Pre-Game:**
  1. Each player receives an initial endowment of 5 tokens. (This gives them enough to make some commitments and/or releases.)
  2. Each player privately writes down on a slip of paper:
     a. **Judgment:** "Across all rounds, I judge that I should choose Option B (the delayed reward) in at least [X] rounds." (They fill in X, a number between 0 and 6. This is their normative judgment of what they should do.)
     b. **Prediction:** "I predict that I will actually choose Option B in [Y] rounds." (They fill in Y.)
     - The facilitator collects these slips, seals them in an envelope, and sets them aside until the debrief.

  **Materials:**
  - Tokens: Poker chips, or paper slips. One color for tokens, and perhaps different color for commitment/release? Or just use the same tokens. (Keep it simple: one type of token.)
  - A whiteboard or flip chart to track the round number and group vote result.
  - Envelopes for the pre-game slips.
  - A box of decent snacks and a $10 gift card for the prize table. At the end, players use tokens to buy prizes: e.g., 1 token = a snack, 5 tokens = a snack and entry into a draw for the gift card, 10 tokens = the gift card? Adjust based on expected token accumulation. (We need a payoff scheme.)

  **Payoff Scheme:**
  - The goal is to have tokens to buy prizes at the end. The more tokens, the better.
  - Example prize structure:
     - 0-3 tokens: a small snack (e.g., a candy bar)
     - 4-6 tokens: a medium snack (e.g., a bag of chips) OR save for more
     - 7-9 tokens: a large snack (e.g., a sandwich) OR save for more
     - 10+ tokens: enter a draw for the $10 gift card (and also get a large snack) OR take the gift card if available? Since we have 18 people, we can have multiple prizes. Let's say:
          - 1 token: one piece of candy
          - 3 tokens: a bag of chips
          - 5 tokens: a sandwich
          - 10 tokens: the $10 gift card (only one available? Then it goes to the highest token holder? Or we have multiple gift cards? But we have a $10 card as an example.)

  Given the constraints, let's keep prizes simple and abundant enough so that everyone gets something. We can have:
  - A prize table with items that have token prices. For example:
     - 1 token: a piece of chocolate
     - 2 tokens: a bag of pretzels
     - 3 tokens: a fruit
     - 5 tokens: a coffee shop gift card (we have several $5 cards? But the prompt says a $10 card). Alternatively, we have one $10 gift card and then snacks.

  But we have 18 people and 75 minutes. We can't have too many high-value items. Let's design the token accumulation so that most people end up with 5-15 tokens.

  How tokens are accumulated:
  - Each round, if you choose A, you get 1 token immediately.
  - Each round you choose B, you get 3 tokens at the end (so at the end, you get 3 tokens per B round).
  - Additionally, you start with 5 tokens.

  So maximum tokens: 5 (start) + 6*3 (if choose B every round) = 23 tokens.
  Minimum: 5 (start) + 6*1 (if choose A every round) = 11 tokens? Wait, no: if you choose A, you get 1 token immediately, so at the end you have 5 + 6 = 11. If you choose B, you get 0 during the rounds and 18 at the end, plus the initial 5, so 23.

  But then if you choose A in a round, you get 1 token right then, which you can use to buy commitments? But the tokens are physical, so if you spend tokens during the game, you have less at the end.

  Important: Tokens are physical and can be spent during the game for commitments and releases. So if you spend tokens, you have fewer for the final prize.

  **Commitment Cost:**
  - To bind your next round to B: pay 1 token (to the facilitator) at the start of the current round (before choices).
  - To release yourself in a bound round: pay 2 tokens (to the facilitator) at the time of that round.

  So tokens are being collected by the facilitator and are out of circulation.

  **Group Vote:**
  - After round 3, we hold the group vote. The question: "Shall we release all future commitments?" (That is, cancel any commitments that players have made for rounds 4, 5, and 6.) Majority vote decides. If "yes", then all those commitments are canceled. Players who had bound themselves for those rounds are free to choose in those rounds without paying a release fee.

  **Timeline (75 minutes total):**

  1. **Introduction and Setup (10 minutes):**
     - Explain the rules: 
          - There will be multiple rounds (don't say how many to naive group, but sophisticated group knows 6 rounds).
          - In each round, choose A (1 token now) or B (3 tokens at the end).
          - You start with 5 tokens.
          - Commitment: You can, at the start of any round (before the round starts), pay 1 token to bind your choice in the next round to B. Then, in that bound round, you cannot choose A unless you pay 2 tokens to release.
          - Group vote: After round 3, we will vote to release all future commitments (for rounds 4,5,6). Majority wins.
     - Assign naive/sophisticated: Randomly assign, then take the sophisticated group aside and tell them there will be 6 rounds and the vote after round 3. Tell the naive group they will be informed round by round.
     - Hand out tokens: 5 tokens per player.
     - Pre-game writing: Hand out slips. They write judgment and prediction. Collect and seal.

  2. **Rounds 1 to 6 (35 minutes total, about 5 minutes per round):**
     - Each round:
          a. **Commitment phase (1 minute):** At the start of the round (before choices), players can choose to bind the next round by paying 1 token. (For round 1, they can bind round 2; for round 6, there is no next round, so no binding offered.) They come to the facilitator to pay and get recorded.
          b. **Choice phase (2 minutes):** Players decide between A and B. If a player is bound for this round (from a previous commitment), they must choose B unless they pay 2 tokens to release and then choose A. They can also just choose B without paying. They write their choice on a slip and hand it to the facilitator. (Or to save time, they can just call out? But we need a record. So slips are better.)
          c. **Payout for A (immediate):** If they chose A, they get 1 token immediately (handed by facilitator). For B, no immediate payout.
          d. **Record keeping:** Facilitator records choices and token changes.
          e. **Announce next round:** For naive group, after each round, say "There will be another round" until round 6, then after round 6 say "that was the last round". For sophisticated, they know.

     - After round 3: **Group vote (5 minutes):** 
          - Explain: "Now we vote on whether to release all commitments for rounds 4,5,6. If the majority votes yes, then any commitments you have made for these rounds are canceled, and you won't have to pay to release in those rounds. If the vote is no, commitments stand."
          - Vote by show of hands. Count and announce the result.

     - Note: Round 1 has no prior commitments, so no release possible. Round 2 might have commitments from round 1, etc.

  3. **Final Payout and Prize Market (15 minutes):**
     - For each player, calculate:
          - Tokens in hand (from initial 5, plus any A choices, minus any spent on commitments or releases).
          - Plus 3 tokens for each round they chose B.
     - Hand out the B tokens to each player.
     - Open the prize market: Players use their total tokens to buy snacks/gift card. Have a table with items and prices.

  4. **Debrief (15 minutes):** 
     - Unseal the pre-game predictions and judgments. 
     - Discuss:
          - Who changed their mind? (Preference reversal) Who failed to do what they judged they should? (Akrasia)
          - Look at the commitment and release actions: Who paid to release? Why? Was that a change of mind or a failure?
          - Group vote: How did it feel? Did it change behavior? Did it feel like willpower from others?
          - Naive vs. Sophisticated: Did knowing the future change how you committed? Did it help you avoid temptation?
          - Specific questions:
               - "At the moment when you paid to release yourself from a commitment, did you feel like you were changing your mind about what was best, or did you feel like you were failing to do what you had planned?"
               - "When the group vote released everyone, did that feel like a relief? Or did it feel like the group was enabling a failure of will?"
               - "Compare your pre-game judgment (what you thought you should do) with what you actually did. If they differ, why? Did your preferences change during the game, or did you act against your own judgment at the time of acting?"
          - Acknowledge limitations:
               - The tokens are symbolic and the stakes are low, so the feeling of temptation is mild.
               - The game doesn't settle which preference (earlier or later) is the "real" one; it just makes both vivid.

  **What might go wrong:**
  1. **Arbitrage:** Someone might try to exploit the commitment/release prices. For example, if they can bind for 1 token and then release for 2, but that's a net loss of 3 tokens? They wouldn't do it unless they changed their mind. But if they bind and then don't want to be bound, they pay 2 to get 1 now (by choosing A) instead of 3 later? That's a bad deal. So no arbitrage opportunity. But if someone does it for fun, note it in debrief: "Did anyone pay to bind and then pay to release? Why? Was it a change of mind?"

  2. **Tokens as Monopoly money:** Some might not care. Mitigation: Use physical tokens (chips) and real prizes. Emphasize the prizes. Also, during debrief, ask: "Did the tokens feel real? Did anyone not care? How did that affect your choices?"

  3. **Refusal to play:** One person might refuse. Have an alternative: they can observe and take notes for the debrief. Or they can be the recorder for the facilitator. In debrief, ask: "Why did you refuse? What would have made it feel more meaningful?"

  **Adjustments:**
  - We have 6 rounds and 18 people. The facilitator must move quickly. Use a timer for each phase.
  - To speed up, in the choice phase, have players hold up a card (A or B) and then the facilitator records and hands tokens. For commitments, they come to the front to pay.

  **Final Design Summary:**
  - **Rounds:** 6
  - **Choices per round:** A (1 token now) or B (3 tokens at the end)
  - **Initial tokens:** 5
  - **Commitment:** Pay 1 token at the start of round N to bind round N+1 to B.
  - **Release:** In a bound round, pay 2 tokens to choose A (and get 1 token now) or not pay and choose B (get 3 at end).
  - **Group vote:** After round 3, vote to release all commitments for rounds 4,5,6.
  - **Naive vs. Sophisticated:** Half know the schedule (6 rounds, vote after 3), half told round-by-round.
  - **Pre-game:** Write judgment (how many B's should I choose?) and prediction (how many B's will I choose?).
  - **Debrief:** Focus on the distinction between changing one's mind and akrasia, using the recorded actions and the pre-game slips.

  This design should create situations where we see both preference reversals (changing mind) and akrasia (acting against one's judgment). The group vote and commitment devices will highlight social and self-binding aspects.
answer: |-
  Below is a complete, ready-to-run activity designed to meet your constraints and goals. I'll start by brainstorming candidate mechanics and explain why I rejected most, then detail the chosen design (including materials, timeline, and debrief). I've focused on creating a visceral experience that forces participants to confront the difference between preference reversal and akrasia, while embedding your four non-negotiable elements and the naive/sophisticated contrast. The design prioritizes simplicity, physicality, and discussion-fodder over theoretical purity, since the game alone can't resolve deep philosophical questions—but it will make the tension undeniable.

  ---

  ### **Brainstormed Mechanics & Why They Were Killed**
  1. **"Time-Stream Auction" (Rejected)**  
     *Mechanic:* Players bid tokens in real-time auctions for "impulse" rewards (e.g., snacks now) vs. "long-term" rewards (e.g., gift cards later). Commitments are binding bids for future rewards; releases cost extra. Group votes can override bids.  
     *Why Killed:* Too chaotic for 18 people without computers. Auctions risk externalizing the conflict (e.g., competitive bidding distracts from internal akrasia) and overcomplicate token management. Fails to isolate preference reversal vs. failure.

  2. **"Willpower Chains" (Rejected)**  
     *Mechanic:* Players are physically linked in small groups (e.g., by ropes). Choosing immediate rewards weakens the group's chain; commitments add links. Group votes to "snap" chains for mass release.  
     *Why Killed:* Too gimmicky—physical links could feel silly and derail seriousness. Also, group dynamics might dominate individual choices (masking akrasia), and the naive/sophisticated contrast is hard to implement. Logistics nightmare in 75 mins.

  3. **"Preference Poker" (Rejected)**  
     *Mechanic:* Each round, players are dealt cards forcing A/B choices. Commitments lock cards in advance; releases "fold" hands. Group votes change rules mid-game.  
     *Why Killed:* Overly game-ified—participants might focus on winning tokens rather than introspection. Also, randomness dilutes personal agency (crucial for akrasia), and card mechanics obscure the core choice architecture.

  4. **Chosen Mechanic: "The Akrasia Arena"**  
     *Why Selected:* Forces direct, repeated personal choices between small-now vs. big-later. Embeds all your constraints cleanly: commitments/releases are simple transactions, group votes create social pressure, and naive/sophisticated groups create natural contrast. Minimal materials, maximal introspection.  
     *Compromise:* Like you predicted, it won't replicate true temptation phenomenology, but it *will* generate vivid "aha!" moments when predictions clash with actions. Debrief questions then frame the philosophy.

  ---

  ### **The Akrasia Arena: Full Design**
  **Core Structure:** 6 rounds of individual choices. Each round, players pick **A (1 token NOW)** or **B (3 tokens LATER)**. Tokens buy prizes post-game (e.g., snacks, gift card raffle). Commitments bind future choices; releases break bindings at a cost. Group vote after Round 3 releases all commitments. Naive players get minimal info; sophisticates know the full schedule.

  **Philosophical Payoff:**  
  - **Changing your mind (preference reversal):** Choosing A after publicly committing to B *without paying to release* suggests your valuation shifted (e.g., "I decided NOW is better").  
  - **Failing to do what you judged (akrasia):** Paying to release a commitment *then choosing A* creates cognitive dissonance (e.g., "I knew I should wait, but I couldn't resist").  
  - **Group mechanism:** The vote externalizes "willpower as social"—e.g., if the group releases commitments, it mirrors how peer pressure enables/inhibits action.

  ---

  #### **Materials & Prep (5 mins before start)**  
  - **Tokens:** 120 poker chips (or cut paper). Each player starts with 5 chips.  
  - **Prize table:** Snacks (e.g., chocolate = 1 token, chips = 3 tokens) + one $10 gift card (raffled for 10+ tokens). Place in view.  
  - **Commitment registry:** Whiteboard/flip chart listing players' names. Record commitments/releases here publicly.  
  - **Personal slips:** Blank slips for pre-game judgments + round choices. Two envelopes (one for judgments/predictions, one for choice records).  
  - **Timer:** For strict phase management.  
  - **Roles:** Only you (facilitator). No other roles—keeps focus on choices.  

  ---

  #### **Rules Explanation (5 mins)**  
  *Script this verbatim for clarity—people are suspicious, so be brisk:*  
  > "Welcome. You each have 5 tokens. We’ll play 6 rounds. Each round, choose:  
  > - **A: Get 1 token IMMEDIATELY.**  
  > - **B: Get 3 tokens at the END** (only if you choose B that round).  
  > Tokens buy prizes later—more tokens, better choices.  
  > **Commitments:** Before any round, pay 1 token to lock your *next* round choice to B. Once bound, you MUST choose B next round—unless you pay 2 tokens to release yourself *in that round*. Releasing lets you choose A or B.  
  > **Group vote:** After Round 3, we vote to release ALL future commitments. Majority wins.  
  > **Naive vs. Sophisticated:** Half of you (randomly picked) won’t know how many rounds we’ll play—I’ll tell you round-by-round. The other half knows everything upfront.  
  > First, write two things privately..."

  ---

  #### **Timeline (Total: 75 mins)**  
  **0. Pre-Game (5 mins)**  
  - Hand each player 5 tokens and two blank slips.  
  - *Task:* On Slip 1, write: "I judge I should choose B in at least [X] of 6 rounds." (X = 0–6).  
    On Slip 2, write: "I predict I will actually choose B in [Y] of 6 rounds." (Y = 0–6).  
  - Collect slips in Envelope 1 (seal it). Randomly assign naive/sophisticated: Mark nametags (✅=sophisticated, ❌=naive).  
  - *Tell sophisticates:* "There are 6 rounds. Group vote after Round 3."  
  - *Tell naives:* "We start with Round 1. I’ll say if there’s another round after each."  

  **Rounds 1–6 (50 mins total; 8 mins/round)**  
  *Each round has 3 phases (use timer!):*  
  1. **Commitment Phase (1 min):** Players can pay 1 token to bind their *next* round choice to B. (e.g., in Round 1, binding Round 2). Record bindings on the public board.  
  2. **Choice Phase (2 mins):**  
     - Players write their choice (A or B) on a slip.  
     - **If bound this round:** Must choose B *unless* they pay 2 tokens to release. If releasing, they *then* choose A or B.  
     - Collect slips/tokens (if paying release).  
  3. **Payout/Info Phase (5 mins):**  
     - Hand 1 token to everyone who chose A.  
     - Announce: "Round [X] done. Naive group: [There will be another round / This was the last]."  
     - *After Round 3 only:* Hold group vote. "Vote: Release ALL future commitments? Majority wins." Record result. If passed, erase all future bindings.  

  **Final Payout & Prizes (10 mins)**  
  - Calculate tokens: Add 3 tokens per B choice to players’ held tokens.  
  - Open prize table. Players spend tokens (e.g., 1 token = chocolate, 10+ = raffle entry for gift card).  

  **Debrief (15 mins)**  
  *Key: Use game moments to frame philosophy. Don’t lecture—ask. Unseal Envelope 1 and compare predictions/judgments to actual choices.*  

  ---

  #### **Debrief Framework**  
  **Goal:** Get participants to articulate the distinction using their own actions. Start broad, then drill into specifics.  

  1. **Open (2 mins):**  
     > "This wasn’t about ‘winning’—it was about noticing your decisions. When did you feel torn? When did you surprise yourself?"  

  2. **Key Moments & Questions (10 mins):**  
     - **Predictions vs. Reality:**  
       > "Look at your prediction (Y) vs. actual B choices. If they differ, was it because you *changed your mind* about what was valuable (e.g., tokens-now felt better later) or because you *failed* to do what you thought you should?"  
       *Philosophy map:* Highlights preference reversal (no regret) vs. akrasia (regret).  

     - **Commitment Releases:**  
       > "If you paid to release a commitment: At that moment, did it feel like a rational change (‘I prefer this now’) or a failure (‘I couldn’t stick to my plan’)?"  
       > "If you bound yourself but *didn’t* release: Did the commitment help you avoid a choice you’d regret?"  
       *Philosophy map:* Releases simulate "surrender to temptation" (akrasia) if accompanied by dissonance.  

     - **Group Vote:**  
       > "If the group released commitments, did it feel like ‘permission’ to indulge? Did it reduce guilt? How is willpower tied to others?"  
       *Philosophy map:* Social enforcement—if vote passes, it externalizes responsibility (e.g., "We’re all weak together").  

     - **Naive vs. Sophisticated:**  
       > "Sophisticates: Did knowing the schedule help you commit? Naives: Did uncertainty make you more impulsive?"  
       *Philosophy map:* Sophisticates may pre-commit more (hyperbolic discounting), but akrasia isn’t solved by knowledge.  

  3. **Limitations & Wrap-up (3 mins):**  
     - *Acknowledge openly:*  
       > "This game can’t replicate real temptation—low stakes mean no true struggle. It also can’t tell us which preference is ‘real.’ Did your ‘later self’ betray your ‘earlier self,’ or was it wiser? Philosophy must answer that. But notice: When you paid to release, or when your prediction failed, *something* happened in that gap between judgment and action. Was it weakness? Or just new information?"  
     - *End:*  
       > "Our reading tries to pin this down. Next time, we’ll ask: Can a game like this ever isolate true akrasia?"  

  ---

  ### **What Will Go Wrong & How to Handle It**  
  1. **"Token Arbitrage" (e.g., binding then releasing for net loss)**:  
     - *Why:* Someone might bind Round 2 (cost: 1 token), then release in Round 2 (cost: 2 tokens) to choose A (gain: 1 token). Net loss: 2 tokens.  
     - *Handle in debrief:* "Did anyone pay to bind and release? Why? If you lost tokens, did it feel like a mistake? Or just a price for changing your mind?" Turns it into data—showcases irrationality/akrasia.  

  2. **"Tokens Feel Fake" (e.g., cynical players treat it as Monopoly money)**:  
     - *Why:* Low stakes + abstract tokens. Likely 1–2 people will YOLO (e.g., always choose A).  
     - *Handle:*  
       - *During game:* Don’t intervene. Let them choose.  
       - *In debrief:* "If tokens felt meaningless, how did that change your choices? Did it make akrasia easier? In real life, does ‘meaning’ affect willpower?"  

  3. **"Refusal to Play" (e.g., emeritus professor sits out)**:  
     - *Why:* Principle ("This is trivial") or confusion.  
     - *Handle:*  
       - *In-game:* "You can observe—take notes on how others justify choices."  
       - *Debrief:* "For those who opted out: What would’ve made this feel legit? For others: Did playing make the philosophy clearer?"  

  4. **Predictable Logistical Snags**:  
     - *Time overruns:* Enforce 1-min commitment/2-min choice phases strictly. Skip payout tally if behind (estimate tokens).  
     - *Group vote ties:* Flip a coin—it fuels debate about "majority willpower."  
     - *Confusion about bindings:* Point to the public registry constantly.  

  ---

  ### **Why This Works**  
  - **Pulls apart preference reversal vs. akrasia:** By making releases costly and public, paying to escape a commitment *feels* like failure, while unbound switches feel like preference shifts. The pre-game predictions create objective dissonance.  
  - **Embeds your 4 elements naturally:** Commitments/releases are transactions; group votes are pivotal; predictions/judgments are sealed; tokens create stakes.  
  - **Naive/sophisticated contrast:** Sophisticates often over-commit early; naives regret under-commitment. Both still experience akrasia.  
  - **Debrief leverages physicality:** "When you handed over tokens to release, what did it *feel* like?" makes philosophy visceral.  

  **Final Tip:** Bring extras of everything (tokens, slips, snacks). Run it tight—chaos creates stories, but structure creates insight. Friday-ready!
