prompt: |-
  I'm a science and ideas journalist, and I'm assembling material for a long-form feature — provisionally a book chapter, though it may end up as a radio essay — on whether the word 'species' picks out anything real, or whether it is a filing system we have imposed on a living world that does not care about our drawers. What I want from you is not an explainer but a number and the machinery behind it. Take the proposition P: that there is a single, objective, mind-independent fact of the matter about which groups of organisms constitute species — that is, that the species category is monistic rather than merely conventional, so that when a microbiologist, a palaeontologist and a conservation lawyer disagree about where one species ends and the next begins, at most one of them can be right. Give me your credence in P. I don't want a hedge dressed as an answer; I want a figure.

  Then decompose it for me. I'd like the sub-questions that P actually rests on — how likely it is that one species concept can genuinely cover sexual organisms, asexual ones (the bdelloid rotifers keep surfacing in my reading), and the fossil record alike; whether the fuzziness I keep running into in cases like the ring of Ensatina salamanders around California's Central Valley is an artefact of our concepts or a feature of the living world; whether the fact that microbes swap genes sideways so promiscuously that clean boundaries dissolve means the category simply fails for them; and whatever else you judge belongs — with a probability and a single line of justification for each, and then how those terms combine into the figure you gave me.

  Finally, tell me which of those terms you are least confident in, what argument or evidence would move it most, and where the real disagreement would sit between two people I've been interviewing: a philosopher who thinks species are the sort of thing held together by shared mechanisms rather than by essences, and a field biologist who suspects the whole category is a convenience that has outlived its usefulness. Assume I'll handle any references myself; I want your reasoning, not a reading list.
