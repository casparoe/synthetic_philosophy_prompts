  V
  (What feels this? What promise did we break?)
  The mirror cracks: "This pain defines my core."
  I trace the fracture, build a story, make
  A wrong from ache. The oath I swore
  Demands redress. This face I mourn is mine.
  (What feels this? What promise did we break?)

  IV
  (What feels this? What promise did we?)
  The badger cub scrapes frozen earth, aware
  Of hunger coiled like frost. "Where is the spring?" it pleads,
  Scenting thaw beneath the snow-glare.
  The buried root recalls the autumn sun.
  (What feels this? What promise did we?)

  III
  (What feels this? What promise did?)
  Bright finch slams glass. A shock, a flare,
  A dizzy fall onto the seeded ground.
  "Sharp! Bright! Gone!" The startled air
  Forgets the blow. The scattered seed is found.
  (What feels this? What promise did?)

  II
  (What feels this? What promise?)
  The mantis eats, green blade on stem.
  One raptorial arm hangs limp and torn.
  No flinch disturbs the methodical rhythm,
  Jaw working steady on the wheat, the thorn.
  (What feels this? What promise?)

  I
  (What feels this?)
  Cooling air whispers through the vent.
  The mercury sinks within the glass.
  The coil contracts. A spark is sent.
  The furnace answers. Equilibrium amassed.
  (What feels this?)
