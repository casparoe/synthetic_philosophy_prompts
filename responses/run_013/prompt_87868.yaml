answer: |-
  Here's your ordered list, grounded in your specific struggle with the shoebox and the family conflict, not abstract theory:

  1.  **Critical History**
  2.  **Antiquarian History**
  3.  **Monumental History**

  **Justification:**

  1.  **Critical History:** This is the most immediately useful *for you, with the shoebox*. Critical history is about judging the past to liberate yourself from its harmful or oppressive weight. It demands you confront the "grim material" about your great-grandfather, analyze it, understand its context and meaning, and *use that understanding to sever its emotional stranglehold*. It doesn't require preserving everything else (the tapes, the photos), but it demands you face the hardest part head-on. This mode directly addresses your feeling of being burdened ("I don't think I can carry the rest around") by offering a path to break its power through critical examination, not avoidance. **Why top?** It's both the truest *to the specific, painful content* (it demands engagement with the perpetrator's reality) and the most likely path to something *you can live with* (liberation from its uncritical weight).

  2.  **Antiquarian History:** This is your brother's impulse (digitize everything) and your aunt's professional stance (preserve for context). It values the past *as past*, for its own sake, focusing on preservation and lineage. It *could* theoretically help by providing full context for the grim material (e.g., those parish records might show social structures enabling the camp; field names might show land impacted). **Why second?** While potentially useful long-term for society/the archive (fulfilling your aunt's point), it's the *least helpful for your immediate burden*. It demands preserving *everything* ("the lot") – precisely the "shelf of a dead man's hobby" you feel overwhelmed by. It avoids the critical judgment you need regarding the perpetrator and potentially buries the crucial, painful truth under mountains of trivia, making it harder, not easier, for *you* to carry right now.

  3.  **Monumental History:** **You are absolutely right: It fundamentally fails here.** Monumental history needs inspiring, imitable figures to fuel present action. A perpetrator is anathema to this mode. Applying it leads only to distortion: either erasure (dropping him, pretending he doesn't exist, which avoids responsibility) or demonization (inverting him into pure evil, a negative monument, which prevents understanding). Neither helps you grapple with the complex, uncomfortable reality in the shoebox. **Why bottom?** It's not just unhelpful; actively attempting to use it here *is the knot you're hitting*. It forces you into an impossible choice between denial and demonization, neither of which addresses the truth or alleviates your burden. It's the *least* true to the material and the *least* livable path for you.

  ### What the Ranking is Doing
  This ranking **prioritizes agency and relief for *you* in the face of painful inheritance.** It puts the mode that offers a tool for *processing and breaking the power* of the specific, damaging past (Critical) above the mode that demands *preserving everything* regardless of personal cost (Antiquarian), and far above the mode that is *structurally incapable* of handling the central problem (Monumental). It values truth (facing the grim material critically) *alongside* livability (finding a way to lessen the burden). The top choice isn't easy, but it offers a path through, not just around or under, the core problem.

  ### Addressing Your Premises
  1.  **Monumental & Perpetrators:** You nailed it. Monumental history *cannot* healthily incorporate perpetrators without distortion. Your instinct is correct; it's a key source of the family disagreement. Trying to force this material into that framework *is* impossible and unhelpful.
  2.  **Limitations of Nietzsche's Triad:** The triad is a useful lens, not scripture. Real historical practice is messier. Critical history *isn't* just something that happens; it's an active, difficult *choice* to engage destructively with the past. Furthermore, other approaches exist: forgetting (actively choosing what *not* to preserve or dwell on), reparative history, microhistory focused on specific lives/events. Nietzsche's triad doesn't exhaust the options, but it provides a powerful framework for *your* specific conflict about value, burden, and dealing with a dark legacy.

  **The Core for You:** The shoebox demands **Critical History**. It's the only mode that allows you to confront the grim truth without being crushed by it *or* forced to preserve everything else. It might mean keeping *only* those documents for now, studying them critically (perhaps with help – historian, therapist?), understanding the context of your great-grandfather's choices without excusing them, and thereby loosening their grip on you. Whether you ultimately donate *just* those critically examined documents, or keep them private, becomes a separate decision made from a more liberated position. It doesn't obligate you to the cassettes or the parish transcripts. It starts with breaking the shoebox open.
