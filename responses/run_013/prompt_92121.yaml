prompt: |-
  For a few years now I have kept an informal notebook of arguments I run into about "Western values," and I have reached the point where I want to know whether what I keep seeing has an established name. The recurring move is this. Someone wants to defend a policy or condemn a practice, and rather than argue for it on its merits they announce that it is, or is not, consistent with "our Western values." Press them on what those values are and the list shifts with the occasion: sometimes it is individual liberty and the rule of law, sometimes tolerance and pluralism, sometimes family and religious inheritance, sometimes science and open inquiry, sometimes a canon of literature and philosophy. The striking part is that the phrase never seems to do independent work: whatever the speaker already approves of turns out to be a Western value, and whatever they already disapprove of turns out to be a betrayal of one. A small example I keep returning to is a campus free-speech dispute in which one side called a speaker's exclusion a betrayal of Western values and the other side called the speaker's views themselves a betrayal of Western values, with both sides invoking the same phrase as though it settled the matter. And the phrase is not the property of one camp: friends and critics of "the West" both lean on it, each filling it with a list that would horrify the other, each speaking as though it named one definite thing we all already understand.

  What I am after is not really a label but a carving. I have run across a few terms that seem close, and none that quite fits. I know the idea of an "essentially contested concept," and I can see why someone would reach for it, but that seems to describe a genuine, ongoing dispute over a shared and internally complex ideal, whereas what I am looking at feels more like a container that gets filled only after the verdict has already been reached. I have also come across "persuasive definition," and that is closer, but it suggests a deliberate redefinition engineered to make one's position true by fiat, and the people I have in mind do not appear to be redefining anything on purpose; they seem sincerely to believe the phrase already has a fixed content and that they are merely reporting it. I have even heard it said that phrases like this are simply "empty," which sounds right until I notice that the phrase is not empty at all: it is full of whatever the speaker happens to care about, and that fullness is precisely what makes it useful to them.

  So my questions are these. Is there an established concept for a term that (a) purports to name a determinate class, (b) is used by opposing parties to mean opposing things, (c) gets its content filled in only after the speaker has decided what to approve or condemn, and (d) is nonetheless treated by its users as though it named something independent of their own preferences? If such a concept exists, what is it, and how does it differ from the nearest neighbours -- essentially contested concepts, persuasive definitions, family-resemblance terms, thick concepts, and whatever else belongs in that neighbourhood? If no such concept exists, please name and define one, and mark out its edges: is a term of this kind always a mere instrument of rhetoric, or can it name something real while still being used this way, and what would let me tell the two cases apart? I should say plainly that a bare name will not satisfy me; what I want is the phenomenon itself pinned down -- what exactly it is, what it is not, and where it stops.
reasoning: |-
  Okay, the user has been collecting examples of how "Western values" is used in arguments and notices it's a shifting term that people fill with whatever they support at the moment. They want to know if there's a concept that describes this phenomenon. 

  First, I need to recall related terms they mentioned: essentially contested concepts, persuasive definitions, etc. They already ruled those out because contested concepts involve genuine debate over a shared ideal, while persuasive definitions are intentional redefinitions. The user's case is different—people seem sincere, thinking "Western values" has a fixed meaning, but it changes based on their stance.

  Hmm, the key points are: a) it claims to be a definite class, b) opponents use it for opposite ends, c) content is filled post-decision, d) users treat it as objective. I need to find a term that fits this. "Motte-and-bailey" comes to mind, but that's more about tactical switching between meanings. Not quite. 

  What about "floating signifier"? That's from semiotics—a signifier without a fixed signified, absorbing different meanings. But is it established in rhetoric or philosophy? Lévi-Strauss and Lacan used it, later Stuart Hall in cultural studies. It fits: "Western values" is a label that different groups load with their own content. The user mentioned it's not empty but full of whatever the speaker cares about—yes, exactly what floating signifiers do. 

  But I should check if it matches all criteria. It claims determinacy (a), used oppositely (b), content filled post-hoc (c), treated as independent (d). Perfect. How's it different from neighbors? Contested concepts have core agreement; persuasive definitions are deliberate; family-resemblance terms acknowledge variation. Floating signifiers lack any stable core—purely contested, not contested over a shared base. 

  The user wants a precise carving. So I'll define it clearly: a floating signifier is a term that signifies nothing fixed, becoming a site of ideological struggle. It's a vessel for projection. Unlike thick concepts (e.g., "courage" has descriptive + evaluative elements), this has no stable descriptive anchor. 

  Also, the user might need to distinguish when such terms are rhetorical tools vs. naming something real. Here, "Western values" as a floating signifier is purely rhetorical—no coherent referent. But historically, the term could have context-specific meanings, though still mutable. The test: if the meaning changes entirely based on the user's position, it's floating. 

  Finally, name the concept: floating signifier. Define, differentiate, explain why it fits. User seems analytically rigorous—they'll appreciate the semiotic roots and clear boundaries.
answer: |-
  You've precisely dissected a fascinating rhetorical phenomenon that *does* have a name, though it requires careful carving to distinguish it from your near-misses: **"Western values" functions as a "floating signifier" in these contexts.**

  Here's the detailed breakdown you requested, defining the concept, differentiating it, and marking its edges:

  1.  **The Core Concept: Floating Signifier (Signifiant Flottant)**
      *   **Origin:** Rooted in structural linguistics (Saussure) and developed in semiotics (Lévi-Strauss, Lacan), later refined in cultural studies (Stuart Hall). It describes a signifier (a word, phrase, symbol) that lacks a stable, universally agreed-upon signified (the concept it represents).
      *   **Mechanism:** The signifier becomes an "empty vessel" or "site of struggle" into which various, often competing, meanings are poured *after the fact* to serve specific ideological, political, or rhetorical purposes. Its power lies precisely in its *apparent* stability and universality, masking its inherent instability.
      *   **Your Criteria Matched:**
          *   **(a) Purports to name a determinate class:** "Western Values" *sounds* like it names a specific, objective set of principles inherent to a distinct civilizational tradition.
          *   **(b) Used by opposing parties to mean opposing things:** As your campus free-speech example perfectly illustrates, both sides use the *same phrase* to argue for diametrically opposed conclusions, filling it with the content (liberty vs. tolerance/equality) that supports their pre-existing stance.
          *   **(c) Content filled in post-decision:** The speaker determines their position (exclude speaker? condemn speaker's views?) *first*. *Then*, they select which "Western values" (from the shifting list: liberty, tolerance, tradition, reason, etc.) best justify that position, retrofitting the signifier's content.
          *   **(d) Treated as independent:** Users sincerely believe (or rhetorically insist) they are merely describing an objective, pre-existing reality ("*This* is what Western values *are*"), not projecting their preferences onto the term. The signifier's historical weight and apparent concreteness facilitate this illusion.

  2.  **Differentiation from Neighbouring Concepts:**
      *   **Essentially Contested Concept (Gallie):**
          *   **Difference:** An ECC *does* have a recognizable core meaning or "original exemplar" (e.g., "democracy," "art," "social justice") that is genuinely valued by all parties, but its precise interpretation and application are inherently and continuously disputed *because* of its complexity and importance. The contestation is *over* the shared core.
          *   **Why Floating Signifier?:** "Western values" lacks this stable core. There is no agreed-upon "original exemplar" – is it Athenian democracy? Roman law? Judeo-Christian ethics? The Enlightenment? The Cold War West? The content isn't being *contested around a shared core*; the *entire content* is being swapped out situationally. It's purely contested, not contested *over* something shared.
      *   **Persuasive Definition (Stevenson):**
          *   **Difference:** A persuasive definition is a conscious, deliberate act of redefining a term, often emotionally charged, to sway opinion ("*True* patriotism means..."). The user is aware they are stipulating a meaning to win an argument.
          *   **Why Floating Signifier?:** Users of "Western values" as a floating signifier typically *deny* they are redefining anything. They exhibit "semantic innocence," believing they are simply reporting an objective fact. The filling-in of content often feels intuitive or self-evident to the user based on their ideological framework, not a calculated rhetorical ploy (though the *effect* is persuasive).
      *   **Family Resemblance (Wittgenstein):**
          *   **Difference:** Family resemblance terms (e.g., "game") acknowledge that instances share overlapping features without a single defining essence. The variation is inherent and expected.
          *   **Why Floating Signifier?:** While "Western values" *could* be described with family resemblance, the key difference is the *rhetorical claim* and *function*. Users of the floating signifier *deny* its family-resemblance nature; they insist it *has* a determinate essence ("*This* is what it *means*"). The instability isn't accepted as inherent; it's masked by the rhetoric of objectivity.
      *   **Thick Ethical Concept (Williams):**
          *   **Difference:** Thick concepts (e.g., "cruel," "brave," "treacherous") combine descriptive and evaluative elements inseparably. Describing an act as "cruel" both characterizes it *and* condemns it.
          *   **Why Floating Signifier?:** "Western values" *becomes* evaluative, but unlike thick concepts, its *descriptive content* is unstable and context-dependent. Thick concepts have a relatively stable descriptive anchor ("cruelty" involves causing suffering); the floating signifier's descriptive anchor is precisely what's floating. Its evaluation *precedes and dictates* its description.
      *   **Empty Signifier (Laclau):**
          *   **Relation:** "Floating signifier" and "empty signifier" are closely related and sometimes used interchangeably. However, a subtle distinction exists:
              *   **Empty Signifier:** Tends to refer to a signifier that becomes a unifying symbol for a diverse group *precisely because* it lacks specific content (e.g., "The People," "Change"), allowing disparate demands to coalesce under a single banner.
              *   **Floating Signifier:** Emphasizes the signifier's instability and *malleability* – how its meaning *shifts* depending on who is using it and for what purpose within ideological struggles.
          *   **Why "Floating" Fits Better Here:** Your observation focuses on the *shifting content* ("the list shifts with the occasion") and its use by *opposing sides* for *opposing ends*, highlighting its chameleon-like adaptability rather than its unifying emptiness. "Floating" captures the dynamic, contested filling process you described.

  3.  **Is it Real or Just Rhetoric? Marking the Edges:**
      *   **The Phenomenon is Rhetorical:** The *usage pattern* you've identified – the post-hoc filling, the claim of objectivity, the use by opposing sides – is fundamentally a rhetorical strategy, even if employed sincerely. It leverages the signifier's historical and cultural weight to lend unearned legitimacy to a position. It *functions* as a tool for ideological assertion and boundary-drawing ("This is *ours*, that is *not ours*").
      *   **Can it Name Something Real?** Yes, but contingently and unstably.
          *   **Historical/Cultural Artifact:** "The West" and associated ideas *are* real historical constructs. Specific values *have* been emphasized at different times and places within traditions originating in Europe and spreading elsewhere.
          *   **The Problem:** The floating signifier usage *essentializes* and *homogenizes* this complex, contradictory, evolving history into a single, static, and falsely unified "thing" that can be wielded instrumentally. It collapses historical plurality into a rhetorical weapon.
      *   **Distinguishing Real Use from Floating Use:**
          *   **Test 1: Historical Specificity & Acknowledgement of Contradiction:** Does the speaker ground their claims in specific historical contexts, thinkers, or documents (e.g., "Locke's conception of liberty in the Second Treatise..."), while acknowledging tensions within the tradition (e.g., Enlightenment liberty vs. colonial practices)? Or do they invoke "Western values" as a monolithic, timeless essence?
          *   **Test 2: Reflexivity:** Does the speaker acknowledge the constructed nature of "the West" and "its values," recognizing it as a contingent historical category subject to debate? Or do they present it as an unproblematic, self-evident given?
          *   **Test 3: Consistency vs. Convenience:** Is the invoked set of values applied relatively consistently across different arguments and contexts by the speaker? Or does the specific list (liberty, tolerance, tradition, science) magically align with the speaker's pre-existing judgment on each specific issue?
          *   **Test 4: Exclusivity Claims:** Does the speaker recognize similar values (e.g., rule of law, scientific inquiry, philosophical traditions) arising independently or being shared in non-Western contexts? Or is "Western values" presented as unique and defining only "the West"?
      *   **Where it Stops:** The concept of the floating signifier applies when:
          1.  A term claims objective, stable meaning ("determinate class").
          2.  Its actual content is highly variable and context-dependent.
          3.  This variability primarily serves to legitimize pre-existing positions within ideological conflict.
          4.  Users mask this variability by appealing to the term's apparent objectivity.
          It stops being the most useful framework when:
          *   A term genuinely has a stable, widely agreed-upon core meaning, even if peripheries are fuzzy (e.g., "water").
          *   The contestation is explicitly acknowledged as being *about* the meaning itself *without* claiming an objective essence (moving closer to ECC or family resemblance).
          *   The redefinition is openly admitted and argued for (persuasive definition).

  **In Conclusion:**

  The phenomenon you've meticulously observed is best understood as **"Western values" functioning as a floating signifier.** It's a rhetorically powerful term that *purports* to name a fixed, objective civilizational essence but, in practice, acts as an empty vessel whose content is filled *after* a judgment is made, serving to legitimize that judgment by invoking the perceived authority and unity of "the West." It differs from essentially contested concepts by lacking a stable core, from persuasive definitions by masking its manipulation, from family resemblance by denying its inherent variability, and from thick concepts by having an unstable descriptive anchor. While "the West" is a historical reality, this *usage* is primarily an ideological tool. You distinguish its instrumental use from attempts at genuine historical understanding by applying tests of specificity, reflexivity, consistency, and acknowledgment of non-exclusivity. This concept precisely carves out the pattern you identified: the post-hoc, preference-driven, yet objectivist deployment of a culturally resonant label.
