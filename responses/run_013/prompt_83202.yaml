  In both cases, I should be direct about where textual analysis ends and judicial lawmaking begins. The user needs to hear that sometimes the text runs out, and that's when courts make value calls about how statutes should apply to new realities.
answer: |-
  Here's a battle-tested statutory interpretation procedure designed for deadline journalism. It prioritizes text, flags judicial construction, and forces you to confront value judgments. Run it in order – if you hit a clear "stop," you have your answer.

  **The 90-Minute Statutory Interpretation Procedure:**

  1.  **Identify the Disputed Text:** Isolate the exact phrase or clause being litigated. Write it down. (e.g., "transmit an image," "motorized vehicles").
  2.  **Dictionary Dive (Contemporary to Enactment):**
      *   Grab the *first listed definition* for each key word from a standard dictionary published closest to the statute's enactment date (Oxford English Dictionary online is best; if paywalled, try Merriam-Webster archives via Google Books snippet view). If you can't find the *exact* year within 5 mins, use the closest decade. *Note the definitions.*
  3.  **Whole Act Context:**
      *   Read the entire statute section containing the disputed text.
      *   Scan surrounding sections. Does the statute define the key terms? If yes, **STOP: The statutory definition controls.** Apply it.
      *   Apply the "Surplusage Canon": Would reading the disputed text one way make another part of the same statute meaningless? If yes, that reading is likely wrong. Does reading it the *other* way create surplusage? Note findings.
  4.  **Plain Meaning Check:**
      *   Plug the dictionary definitions into the disputed text. Does this yield a single, unambiguous meaning relevant to the case facts?
      *   **YES, UNAMBIGUOUS:** Apply that meaning. The text hasn't "run out." This is likely interpretation. **STOP (unless Step 5 throws a curveball).**
      *   **NO, AMBIGUOUS/CONFLICT:** Proceed. The text has likely "run out" for pure interpretation; construction or purpose may be needed.
  5.  **Scrivener's Error / Absurdity Check:**
      *   Does applying the plain meaning lead to a result so utterly illogical, absurd, or contrary to the statute's *obvious* subject matter that it *cannot* be what was intended? (e.g., defining "vehicle" so broadly it includes baby strollers on a highway ban). This is rare. If genuinely absurd (not just inconvenient), judges *might* correct it. **CAUTION: Judges often misuse "absurdity" to mask policy choices.**
  6.  **Corpus Linguistics Reality Check (If Feasible in 5 Mins):**
      *   *Only if* ambiguity exists (Step 4): Can you quickly search a large, reputable corpus of *contemporary* English (e.g., Google Ngram Viewer for rough trends, COHA if accessible) to see how the key phrase/word was *actually used* around the time of enactment? Does this confirm, contradict, or clarify the dictionary definition? **Weight:** Corroborative evidence, not usually decisive alone. If unavailable, skip.
  7.  **Purpose Extraction (Statute-Specific):**
      *   *Only if* ambiguity exists (Step 4): Look *only* at the statute itself. Read the title, preamble, statement of purpose (if any), and surrounding sections. What problem was this specific statute *textually* designed to solve? State this in one sentence. (e.g., "Prevent non-consensual distribution of real intimate photos," "Preserve peace and safety on non-motorized trails").
  8.  **Application & Construction Zone:**
      *   Apply the plain meaning (if clear from Step 4) or the purpose (if used from Step 7) to the specific case facts.
      *   **Does it fit cleanly?** If yes, it's likely interpretation. **STOP.**
      *   **Does it require stretching, ignoring modern realities, or adding/removing words?** If yes, you're in the **Construction Zone.** The judge is likely making law based on:
          *   **Judicial Philosophy:** Originalism might stick closer to original public meaning even if awkward today; Purposivism might adapt the old purpose to new tech; Pragmatism might prioritize consequences.
          *   **Value Judgment:** What outcome seems "fair," "just," or avoids "bad" policy *to this judge*? This is where policy preferences (e.g., protecting victims vs. free speech, safety vs. green transportation) dominate.
  9.  **The Call:**
      *   **Text Wins (Steps 2-4, 5):** "The court ruled based on the statute's plain language, finding [brief summary]."
      *   **Purpose Wins (Step 7):** "The court looked beyond the specific wording to the statute's overall purpose of [purpose], concluding it covered the situation."
      *   **Construction Zone / Value Judgment (Step 8):** **STOP PRETENDING. WRITE THIS:** "While the parties debated the text's meaning, the court's decision ultimately rested on a value judgment about [core policy conflict, e.g., protecting privacy in the digital age vs. regulating novel technology, or promoting recreation vs. accommodating new transportation modes] in applying the decades-old law." **This is your crucial sentence.**

  **Running the Procedure:**

  **Case 1: AI-Generated Nude Image (State Statute: "knowingly transmit an image... identifiable person... nude... without consent")**

  1.  **Disputed Text:** "transmit an *image*"
  2.  **Dictionary (Assume ~2000s Revenge Porn Era):** "Image": 1. A representation of the external form of a person or thing. 2. A likeness; a copy; an imitation. 3. *Optics*: A copy of an object formed by light or other radiation. (*Photograph* is a related but distinct word).
  3.  **Whole Act Context:** Does statute define "image"? (Probably not, but CHECK if possible). Does it mention photography, digital media, creation? Look for surplusage: If "image" *only* meant photograph, would other provisions about "depictions" or "recordings" be redundant? (Maybe). **Likely Ambiguous so far.**
  4.  **Plain Meaning:** "Image" broadly means a representation/likeness. An AI-gen photorealistic image is a representation/likeness. BUT, does "transmit an image... *of* an identifiable person" imply the image must *capture* that person (like a photo/drawing *from* reality), or just *depict* them (like a fictional painting)? Ambiguity confirmed.
  5.  **Absurdity?** Applying the broad meaning covers harmful deepfakes – arguably fulfilling the core purpose. Applying a narrow "photograph-only" meaning would create a massive loophole. Not *absurd*, but potentially undermining. **Proceed.**
  6.  **Corpus (Quick Check):** "Image" used broadly for representations long before digital era (paintings, statues, mental images). "Digital image" common by 2000s. **Supports broad meaning.**
  7.  **Purpose (From Statute):** Presumably "to prevent harm caused by non-consensual distribution of intimate *depictions*." (Focus on harm, not creation method).
  8.  **Application/Construction:**
      *   **Broad View (Rep/Likeness):** Clearly covers AI-gen image. Fits purpose (prevents same harm).
      *   **Narrow View (Requires Capture):** Excludes AI-gen. Arguably frustrates purpose in digital age.
      *   **Construction Zone:** The text *can* support the broad view (dictionary, corpus), but the narrow view isn't linguistically absurd. The *choice* hinges on the value judgment: **Should this law, aimed at harm from non-consensual intimate *depictions*, adapt to cover synthetic depictions causing identical harm, or is it limited to recordings of actual events?** Judges deciding this are making a policy call about technology and privacy.
  9.  **The Call:** **Value Judgment.** "While the text of 'image' is broad enough to cover AI-generated depictions, the court's ruling ultimately depended on the value judgment that the statute's core purpose of preventing harm from non-consensual intimate depictions extends to photorealistic fabrications, despite the novel technology involved." *(Your gut feeling is probably right - most courts will cover this, but it IS construction based on purpose/policy, not pure text).*

  **Case 2: E-Bike on Greenway (County Ordinance: Barring "motorized vehicles")**

  1.  **Disputed Text:** "motorized vehicles"
  2.  **Dictionary (Assume Ordinance Enactment ~1980s-90s?):**
      *   "Motorized": Equipped with a motor.
      *   "Motor": A machine that supplies motive power; an engine.
      *   "Vehicle": A thing used for transporting people or goods.
  3.  **Whole Act Context:** Does ordinance define "motorized vehicle"? (CHECK! Crucial). Are there exceptions? (e.g., wheelchairs, maintenance carts? - **THIS IS KEY**). Surplusage? If "motorized vehicle" excludes pedal-assist e-bikes, would other terms like "internal combustion engine" be redundant? (Maybe not). **Likely Ambiguous so far.**
  4.  **Plain Meaning:** A pedal-assist e-bike is a "thing for transporting people" that is "equipped with a machine supplying motive power." It has a motor. **Plain meaning strongly suggests it IS a motorized vehicle.** "Pedal-assist" modifies *how* the motor is used, not *if* it exists.
  5.  **Absurdity?** Banning something with a small electric motor while allowing traditional bikes isn't *absurd* in the legal sense. It might be unwise or outdated, but not illogical on its face. **Proceed, but plain meaning is strong.**
  6.  **Corpus (Quick Check):** "Motorized vehicle" consistently used broadly in laws/regs for anything with a motor, from cars to scooters to some lawnmowers. Distinctions (like Class 1) are *modern statutory creations*.
  7.  **Purpose (From Ordinance):** Likely "to preserve safety, peace, quiet, and non-motorized recreation on the trail." (Focus on *experience* and *motor* exclusion).
  8.  **Application/Construction:**
      *   **Broad View (Has Motor):** E-bike has a motor = motorized vehicle.
      *   **Narrow View ("Vehicle" Implies Primary Motor Propulsion):** Argues a Class 1 e-bike (only assists pedaling) isn't *primarily* motor-driven. This *contradicts* the plain meaning of "motorized" (equipped with a motor) and requires reading in "primary." This is construction.
      *   **Construction Zone:** The plain meaning is very strong here. Arguing the e-bike isn't a "motorized vehicle" requires significant linguistic gymnastics (ignoring the motor) or importing extrinsic policy (e.g., "bikes are good, even with motors"). The judge would be making a clear value judgment: **Should the benefits of e-bikes (green transit, accessibility) override the ordinance's clear prohibition on motors, or does the rule's focus on excluding *any* motorized propulsion take precedence?**
  9.  **The Call:** **Text Wins (but Judge might override with Values).** "The ordinance's plain language banning 'motorized vehicles' encompasses the e-bike, which is equipped with an electric motor. While the rider argued the ordinance's purpose should accommodate modern pedal-assist technology, the court's decision applying the text reflects a value judgment prioritizing strict adherence to the motor prohibition over potential benefits of new transportation modes on this specific trail." *(Your gut might be wrong here if it favored the rider - the text is very strong against him, unless Step 3 found a critical exception or definition).*

  **Key Flip Factors:**

  1.  **AI Image:** Did the statute **define "image" or "photograph"?** (If it defined "image" narrowly, STOP - text wins for defendant). If not, the value judgment about covering synthetic media dominates.
  2.  **E-Bike:** Did the ordinance **specifically exempt "low-speed electric bicycles" or define "motorized vehicle" to exclude pedal-assist?** (If yes, STOP - text likely wins for rider). If not, the value judgment about allowing motors must overcome the strong plain meaning.

  **When the Editor Calls Asking "Why?":**

  *   **Text Wins:** "The words themselves were clear, Judge [Name] focused on the dictionary definition and the specific phrasing used in the law."
  *   **Purpose Wins:** "The law's wording was fuzzy, so the judge looked at what problem it was trying to solve overall and applied that goal here."
  *   **Value Judgment:** "Both sides had arguments about the text, but in the end, the decision came down to the judge's view on [State the Core Conflict: e.g., 'how far old privacy laws should stretch to cover AI' or 'whether trail bans on motors should make an exception for this new tech']."

  **This procedure forces you to confront the construction zone.** Textualists might split on the AI case (original public meaning vs. need for construction) but would overwhelmingly agree on the e-bike (strong plain meaning). The bet: AI case is 60/40 for coverage (purpose/values); E-bike case is 80/20 for ticket (text). The single facts that flip them are statutory definitions (Step 3). Stop pretending when the text is ambiguous *and* applying it requires choosing between competing purposes or importing modern policy – that's the value judgment call. Now file.
