  - Open questions: Note tensions in Neurath's theory/practice
  - Confidence: 0.85 - solid but with caveats
  - Least confident: Claim about Neurath's view of resemblance - he might have seen it as conventional

  The user's meta-awareness is impressive - they specifically request marking open questions rather than smoothing over. I'll honor that by noting where Neurath's writings show ambiguity about resemblance versus convention in symbols.
