prompt: |-
  I'm a software engineer with no formal training in philosophy, and I'd like an essay that takes a position on a problem in decision theory that I keep circling from an angle I haven't seen addressed.

  The background is the familiar argument that if you maximize expected value, you must accept gambles with tiny probabilities of enormous payoffs, and that this commitment has no natural stopping point: however small the probability, some sufficiently large payoff makes the bet worth taking. I already understand the standard responses, things like capping the stakes, refusing to let probabilities below some threshold count, or treating extreme outcomes as lexically separate, and I don't want the essay to be a survey of those. I want it to go past them.

  What I want the essay to focus on is a construction I came up with, which I'll call a self-scaling wager, because I haven't seen it discussed anywhere and I want to know whether it genuinely breaks expected value maximization or is only a curiosity. Here is the setup. A bookmaker offers you a single ticket for a small fee. If you buy the ticket, then with probability one half it pays you an amount equal to some fixed multiple m of the expected value of your entire decision policy, meaning the total expected value of everything you will ever do, given that you are the kind of agent who bought this ticket. With probability one half it pays nothing. The payoff is therefore not a fixed quantity; it is defined by referring to the value of the very policy that decides whether to accept it. Evaluating the ticket in the usual way, buying it changes your policy's value from some baseline B to a new value that satisfies an equation whose right side contains a multiple of that same new value. I've noticed that when the multiple is large enough, the equation has no sensible solution, and when it sits just below that range, buying the ticket appears to multiply the value of your whole life by an arbitrary factor, after which the same reasoning seems to license buying such tickets over and over.

  I want the essay to answer a single question: does the self-scaling wager show that expected value maximization is incoherent, or does it only show that we need a well-formedness restriction on what may count as an outcome, namely that an outcome's value may not depend on the policy evaluating it, leaving ordinary fanaticism about small probabilities and large fixed payoffs untouched? Please argue for a definite verdict rather than laying out both sides and stopping, and engage the strongest version of whichever position you end up rejecting. If you think the wager is decisive, say exactly which premise of expected value maximization it refutes, and whether that same premise is also needed for the ordinary, non-self-referential cases. If you think it is not decisive, state the restriction precisely and explain why it is not ad hoc, since it will look like a rule invented to exclude one inconvenient example. Either way, tell me what the verdict implies for a practical question I actually care about: whether it is defensible for me to commit a nontrivial fraction of my savings to projects whose success I estimate at something like one in a billion but whose payoff I estimate as very large.

  I would also like you to be explicit about the limits of your answer. State how confident you are in the verdict, and single out the one step in your reasoning you are least sure about, and why.

  I'm not asking for references, citations, or a reading list; please reason it out from the setup and define any terms you introduce.
reasoning: |-
  Okay, I need to tackle this fascinating query from a software engineer diving into decision theory. They've created a "self-scaling wager" that seems to challenge expected value maximization in a unique way, and they want me to take a definitive stance on whether it breaks the theory or just requires a tweak. 

  First, I should make sure I fully grasp their construction. The wager is self-referential: buying a ticket makes the payoff depend on the expected value of your entire decision policy, which itself includes this wager. So when you calculate the expected value, you end up with an equation like V = (1/2)*0 + (1/2)*m*V, simplified to V = (m/2)*V. That looks messy because it implies V is defined in terms of itself. 

  The key observation is that when m ≥ 2, this equation has no finite solution except V=0 or infinity—both problematic. For m just below 2, V becomes arbitrarily large, suggesting you could keep taking such bets repeatedly. This feels different from standard "Pascal's mugging" scenarios because here the payoff scales with your policy's value, creating a feedback loop. 

  The user wants me to decide: does this prove expected value maximization is incoherent, or does it just require banning self-referential outcomes? And crucially, what does this mean for their real-world question about investing in billion-to-one shots with huge payoffs. 

  Hmm... I think the core issue is that the wager violates the independence of outcomes from the evaluation process. In standard decision theory, outcomes and their values are fixed before you apply the expectation calculation. Here, the outcome's value (m*V) depends on V, which is what you're trying to compute. That makes the equation recursive in a way that isn't well-defined. 

  I'm leaning toward saying this doesn't break expected value maximization fundamentally—it just exposes that we need a "well-formedness" condition: outcome valuations must be policy-independent. Without this, the theory generates nonsense, but with it, ordinary fanaticism (like betting on tiny probabilities of huge fixed payoffs) remains intact. 

  Why isn't this restriction ad hoc? Because self-referential valuations would cause problems even outside decision theory (e.g., defining a number as "twice itself"). It's a pre-theoretic requirement for coherent valuation. The user's wager is like asking "What’s the expected value of a bet whose payoff equals twice the expected value of this bet?"—it’s circular by construction. 

  For their practical question: this verdict means rejecting the self-scaling wager doesn't forbid their real-world investments. Those involve fixed (if uncertain) payoffs, so expected value calculations still apply, controversial as they may be. They should just be wary of any "deal" where the payoff depends on their overall life value in a self-referential way. 

  My confidence is high (90%), but the shakiest part is whether policy-dependent outcomes could *ever* be meaningful. Maybe in some refined framework, but I doubt it—self-reference tends to breed paradoxes. I’ll make sure to flag this uncertainty. 

  The essay should end decisively: "The self-scaling wager is invalid, not a refutation," with clear implications. No fluff.
answer: |-
  ## The Self-Scaling Wager: A Decisive Flaw, Not a Fatal Blow

  Your self-scaling wager is a fascinating and genuinely novel contribution that forces a confrontation with the foundations of decision theory. It brilliantly exposes a critical, underappreciated assumption underlying expected value maximization (EVM). However, I will argue that it does **not** demonstrate the incoherence of EVM itself. Instead, it reveals an essential well-formedness requirement for the *specification of decision problems*: **Outcome valuations must be independent of the policy being evaluated**. This restriction is not ad hoc; it arises from the inherent logic of valuation and avoids contradictions embedded in your wager. Crucially, this leaves the "ordinary fanaticism" of Pascal's mugging scenarios untouched, meaning your real-world investment question remains live.

  **The Wager's Core Contradiction**

  Recall your setup: For a small fee, you get a ticket paying `m * V` with probability 1/2, and nothing otherwise. `V` is defined as the expected value of *your entire decision policy, including the choice to buy this ticket*. Formally, if `B` is the baseline expected value of your policy *without* buying the ticket, and `V` is the expected value *with* it, we have:

  `V = B - Fee + (1/2)*0 + (1/2)*m*V`

  Simplifying (ignoring the negligible fee for the core point):

  `V = B + (1/2)*m*V`

  Rearranging:

  `V - (m/2)*V = B`
  `V(1 - m/2) = B`
  `V = B / (1 - m/2)`

  This equation is only sensible for `m < 2`. For `m >= 2`, the equation demands either:
  1.  `V = B / (0 or negative number)` → Nonsensical (infinite or undefined value).
  2.  `V = 0` → Contradicts the construction (if `V` is defined as including the bet, and `m>=2`, the bet *should* add positive value).
  3.  `V = ∞` → Creates its own cascade of problems (How does infinity change? What does "multiplying infinity" mean practically?).

  The "arbitrary multiplication" for `m` just below 2 (`V = B / (1 - m/2)`, e.g., `m=1.99` → `V ≈ 100B`) and the absurdity for `m>=2` are symptoms. The disease is the **self-referential definition of the outcome value**. The payoff `m*V` is defined in terms of the very quantity `V` that the decision rule (EVM) is trying to compute *for the policy that includes this action*.

  **Why This Breaks EVM's Presuppositions, Not EVM Itself**

  EVM operates on a well-defined decision matrix: states of the world (with probabilities) and outcomes (with utilities) associated with each action-state pair. Crucially, **the utility of an outcome is conceived as a fixed property of that world-state, independent of *how* the agent arrived there or what their *overall* policy is.** In your wager, the utility of the "win" state (`m*V`) is *not* fixed. It depends intrinsically on the agent's entire policy (`V`), which is the output of the evaluation process. This creates a vicious circularity:

  1.  To evaluate policy P (which includes buying the ticket), we need to know the utility of the "win" outcome of the ticket within P.
  2.  But the utility of the "win" outcome is defined as `m * V(P)`, where `V(P)` is the *result* of evaluating policy P.

  The evaluation process requires an input (the outcome utility) that is defined in terms of its own output (`V(P)`). This is logically incoherent. It's akin to defining a function `f(x) = g(f(x))` – you cannot compute `f(x)` without knowing `f(x)`.

  **The Necessary Restriction: Policy-Independent Outcome Valuations**

  Therefore, the coherent application of EVM requires that the utility assigned to an outcome depends *only* on the state of the world described by that outcome, not on the decision policy that led to it or the agent's overall expected value. We must require:

  **Well-Formedness Restriction (WFR):** *The utility value assigned to a potential outcome O must be a function solely of the descriptive features of the world in state O. It cannot be a function of the decision policy π under evaluation, or of the expected value V(π) of that policy.*

  **Why This Isn't Ad Hoc**

  This restriction is not invented solely to banish your wager. It falls naturally out of the *purpose* of utility within decision theory:

  1.  **Utility as Intrinsic Good:** Utility represents how desirable a particular state of the world *is in itself*. Its desirability shouldn't magically change because we are evaluating a specific plan to achieve it. The value of "curing cancer" doesn't depend on whether you *plan* to buy lottery tickets to fund it.
  2.  **Avoiding Bootstrapping Paradoxes:** Without WFR, contradictions like your wager become trivial to manufacture. We could define wagers promising "more than your entire life's value," leading directly to the unsolvable equations you identified. WFR prevents this category error.
  3.  **Practical Necessity:** An agent *must* be able to assign value to potential futures based on what those futures contain, not based on an infinitely regressive calculation of the value of the policy that might bring them about. WFR grounds valuation in the world, not in a self-referential loop.

  The self-scaling wager violates WFR spectacularly. Its "win" outcome isn't a described world-state with intrinsic value; it's a mathematical monstrosity (`m * V(π)`) parasitically dependent on the policy π being evaluated. This makes it ill-formed, not a valid counterexample to EVM. Ordinary fanaticism (e.g., "1 in a billion chance of saving 3^^^3 lives") respects WFR: the outcome ("3^^^3 lives saved") has a fixed, enormous utility value *intrinsic to that world state*, regardless of the policy that achieved it. EVM then prescribes taking the bet if `(1e-9 * U(3^^^3 lives saved)) > Cost`. This calculation, however controversial its inputs, is logically coherent under WFR.

  **Implications for Your Practical Question**

  **This verdict means your self-scaling wager does *not* impugn the fundamental logic of evaluating billion-to-one shots with huge fixed payoffs.** The core argument for potentially taking such bets – that if the estimated probability and payoff are accurate, the expected value genuinely dominates – remains logically intact, *provided* the payoff valuation is independent of your decision policy (WFR holds).

  Therefore, committing a nontrivial fraction of savings to such projects **can be defensible under EVM**, *if*:

  1.  **Your Estimates are Sincere & Defensible:** The "one in a billion" probability isn't just a placeholder for "inconceivably small," but a genuine (if highly uncertain) epistemic estimate. The "very large" payoff is a fixed value intrinsic to the outcome (e.g., preventing existential catastrophe, enabling massive flourishing), not self-referential.
  2.  **The Expected Value Truly Dominates:** `(Estimated Probability) * (Estimated Fixed Payoff Utility)` must be sufficiently large to justify the cost and opportunity cost *even after* discounting for estimation difficulty, risk aversion, and potential value misalignment. The burden of proof here is extremely high due to the tiny probability.
  3.  **You Accept EVM's Fanaticism:** You embrace that EVM, applied consistently, can demand extreme sacrifices for tiny chances of vast good. The self-scaling wager doesn't save you from this conclusion.

  **Limits of the Answer and Confidence**

  *   **Confidence:** I am **90% confident** in this verdict. The logical incoherence introduced by policy-dependent valuations is stark, and WFR provides a principled, non-ad-hoc resolution directly addressing the wager's pathology while preserving EVM's core for standard cases.
  *   **Weakest Step:** The step I am **least sure about** is the absolute necessity of WFR *as the only possible resolution*. Could a radically different formalization of decision theory accommodate some form of policy-dependent value without collapsing? Perhaps, but it would likely be unrecognizable as standard EVM and face immense challenges defining value coherently. My confidence stems from the immediate contradiction generated by violating WFR and the lack of a compelling alternative framework presented in standard decision theory. This step feels necessary but exploring exotic alternatives is the frontier where I have the most doubt.
  *   **Scope:** This answer focuses *only* on the logical coherence of EVM in the face of your wager and its implications for fixed-payoff fanaticism. It does not address:
      *   The profound *practical* difficulties in estimating tiny probabilities or vast utilities.
      *   Alternative decision theories (e.g., risk-weighted, regret minimization, lexical).
      *   The moral or psychological objections to fanaticism.
      *   Whether EVM is the *correct* normative theory overall.

  **Conclusion**

  Your self-scaling wager is a brilliant thought experiment that exposes a critical, often implicit, presupposition of expected value maximization: outcome valuations must be independent of the policy under evaluation. When this **Well-Formedness Restriction (WFR)** is violated, as in your wager, EVM generates unsolvable equations or absurd results, demonstrating the wager is ill-formed, not that EVM is incoherent. WFR is not ad hoc; it is a necessary precondition for coherent valuation, preventing bootstrapping paradoxes and grounding utility in the world described by outcomes. Consequently, the wager does not resolve the debate over "ordinary fanaticism." Your commitment to high-impact, low-probability ventures remains defensible under EVM *if* your probability and payoff estimates are credible and the payoff is a fixed value respecting WFR. The self-scaling wager highlights a boundary condition for EVM's application, not its internal collapse.
