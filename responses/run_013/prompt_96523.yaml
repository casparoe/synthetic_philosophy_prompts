          Meanwhile, C moves from4->5, D moves from6->5 -> conflict, so they swap arrows: C becomes left, D becomes right. They remain in cell4 and cell6.
          state1: cell0: A (left), cell2: B (right), cell4: C (left), cell6: D (right)

     step2:
          A at0 (left) -> to cell7 (since circle)
          B at2 (right) -> to cell3
          C at4 (left) -> to cell3? -> cell3 is the target for B as well? 
          B is moving to cell3, C is moving to cell3 -> conflict. So they bounce: swap arrows and don't move.
          Meanwhile, A moves to cell7.
          D at6 (right) -> cell7 -> conflict with A? A is moving to cell7, and D is moving to cell7. So they would conflict. So bounce: swap arrows and don't move.

          So state2: 
              A: at0, arrow left (originally from cell0, but after seeing conflict at cell7, it swaps to right? and doesn't move)
              Wait, let's do it by cell:

              For cell0: token A with left arrow -> moves to cell7. But cell7 is also the target for D from cell6 (right arrow) -> so both moving to cell7. bounce: A and D swap arrows and do not move. So A becomes right, D becomes left. They stay at cell0 and cell6.
              For cell2: token B with right arrow -> moves to cell3.
              For cell4: token C with left arrow -> moves to cell3 -> conflict with B. bounce: B and C swap arrows and do not move. B becomes left, C becomes right.

          state2: 
              cell0: A (right)
              cell2: B (left)
              cell4: C (right)
              cell6: D (left)   -> back to the initial state.

     So period 2.

     We need a bigger system or more steps.

   Given the complexity and time, I propose to use a computer simulation to generate the steps, but the activity should be hands-on. Alternatively, we can accept that the system is small and the example is simple, and focus on the reversibility and the boundary condition.

     Materials for each team:
          - A circular board with 8 cells.
          - 4 tokens, each can show an arrow (right or left).

     We'll have a precomputed history for 5 steps from a chosen initial state. We give Team 1 the initial state and the rules, and they are to compute the next 5 states. Team 2 is given the final state (state at step5) and are told that it is the final state of a 5-step evolution from some initial state. They are to find the initial state and the intermediate states. Team 3 gets both the initial state and the final state.

     We then let them work for 15 minutes.

     We expect:
          Team 1 will compute the forward history easily.
          Team 2 will try to run the rule backward without flipping arrows and get stuck, or they may try flipping and then see it works.
          Team 3 will also be able to compute by starting from the initial state and going forward.

     Then, in the debrief, we show that the microscopic laws are reversible if we flip the arrows. We then discuss why in the real world we don't see systems with flipped arrows: because we are part of the system and our memory is based on the thermodynamic arrow.

     For the written ledger: each team must keep a written record of the state at each step. This record itself is a physical system that is increasing in entropy? Not sure. We can discuss that in the debrief.

     Timeline for the activity:

     - Introduction (5 minutes): Explain the activity and the rules. Demonstrate one step with a simple example on the board.
     - Distribution of materials and task (5 minutes): Form three teams ( Team1: initial state only, Team2: final state only, Team3: both states). Each team gets a board and tokens in their given state, and a ledger to record states and moves.
     - Work time (20 minutes): Teams work on reconstructing the history.
     - 5-minute warning.
     - Group discussion (30 minutes): Teams report on what they found. Then instructor debrief.

     Debrief outline:

        1. Reversibility: 
            - Show that from the final state, if you flip every token's arrow and run the rule forward, you get the initial state in reverse order.
            - This means the microscopic laws are time-symmetric.

        2. The boundary condition problem:
            - Team3 had both ends and could connect them by running forward from the initial state.
            - Team2 had only the final state and might have struggled to find the past because they didn't know to flip the arrows.

        3. Why in the real world do we not flip the arrows to see the past?
            - Because our own brains and records are part of the physical system. We are in the same time orientation.
            - The ledger that the teams kept: it was written during the forward evolution. If we were to reverse the system, the ledger would be erased in reverse order, which is not how memory works.

        4. The arrow of time is not in the laws but in the initial condition:
            - The initial state of the universe was in a state of low entropy (highly ordered).
            - The final state handed to Team2 was also low entropy? In our example, we must ensure that the final state is high entropy. But in a small system, entropy doesn't increase because it's periodic.

     This is a limitation. In a small system, entropy doesn't increase; it fluctuates. So we can't show entropy increase. We can only show that the boundary condition (initial state) is special.

     To show entropy increase, we would need a much larger system, which isn't practical in a classroom setting.

     So we focus on the boundary condition and the reversibility.

     What can go wrong:

        - Team2 might not think to flip the arrows. They might try to run the rule backward by moving tokens in the reverse direction without flipping arrows. This might work for some moves, but not for collisions. In our example, collisions are symmetric under arrow-flip and time-flip.

        - Team3 might not need to use both states; they might just start from the initial state and ignore the final state.

     Despite the limitations, the activity should achieve the main goal: to make them feel that the direction of time is not in the laws.

     Let's provide the states for a specific example that has at least one collision.

     Example initial state (state0) for an 8-cell circle:

          cell0: right
          cell1: (empty)
          cell2: left
          cell3: (empty)
          cell4: right
          cell5: (empty)
          cell6: left
          cell7: (empty)

     Then step1: as above, we have a conflict at cell1 between cell0-right and cell2-left, and at cell5 between cell4-right and cell6-left. So bounce: swap arrows.

          state1: 
               cell0: left (originally right, swapped)
               cell2: right (originally left, swapped)
               cell4: left (originally right, swapped)
               cell6: right (originally left, swapped)

     step2: 
          cell0: left -> moves to cell7
          cell2: right -> moves to cell3
          cell4: left -> moves to cell3 -> conflict with the token from cell2 moving to cell3? cell2's token is moving to cell3, and cell4's token is moving to cell3 -> bounce at cell3: swap arrows between the tokens at cell2 and cell4.
          cell6: right -> moves to cell7 -> conflict with token from cell0 moving to cell7: bounce, swap arrows between cell0 and cell6.

          So after bounce at cell3: token at cell2 becomes left, token at cell4 becomes right.
          After bounce at cell7: token at cell0 becomes right, token at cell6 becomes left.

          But they haven't moved. So state2:
               cell0: right
               cell2: left
               cell4: right
               cell6: left   -> back to state0.

     So period 2.

     So for state0 and state2 are the same.

     We can do state0, state1, state0, state1, state0 for 5 steps.

     Then state5 = state0.

     Then Team2 is given state5 (which is state0) and asked to find the past. They might think state4 should be state1, state3 should be state0, state2 state1, state1 state0, state0 state0? This is messy.

     Alternatively, we can choose a different initial state that is not periodic within 5 steps.

     Let me try a circle of 8 cells with tokens only at cell0 (right) and cell1 (left). Then they are adjacent and will collide.

          state0: cell0: right, cell1: left -> they are adjacent and facing each other. collision: swap arrows and don't move.
          state1: cell0: left, cell1: right.
          state2: now cell0: left -> moves to cell7, cell1: right -> moves to cell2. no conflict.
          state3: cell7 token moves to cell6 (left), cell2 token moves to cell3 (right).
          state4: cell6: left->cell5, cell3: right->cell4.
          state5: cell5: left->cell4, cell4: right->cell5 -> conflict at cell4 and cell5? Let's see: 
               token at cell5: left -> cell4
               token at cell4: right -> cell5
               -> conflict at cell4 and cell5? They are moving to each other's cell. So they would swap cells without collision? In our rule without conflict prevention, we would allow the swap.

          state5: cell4: token originally from cell5 (left) -> becomes at cell4.
                   cell5: token originally from cell4 (right) -> becomes at cell5.

          Then state5: cell4: left, cell5: right.

     Then state5 is different from state0.

     Now, to do reversibility: from state5, flip all arrows: so cell4: right, cell5: left. Then run the rule for 5 steps:

          step1: 
               cell4: right -> cell5, cell5: left -> cell4 -> conflict? because both moving to each other's cell. They would swap cells: so cell4 gets the token from cell5 (left) and cell5 gets the token from cell4 (right). -> state4.

          step2: 
               cell4: left -> cell3, cell5: right -> cell6. -> state3.

          step3:
               cell3: token from cell4 (left) -> cell2
               cell6: token from cell5 (right) -> cell7 -> state2.

          step4:
               cell2: token (left) -> cell1
               cell7: token (right) -> cell0 -> state1.

          step5:
               cell1: left, cell0: right -> adjacent and facing: collide -> swap arrows: become cell1: right, cell0: left -> state0.

     So after 5 steps with arrows flipped, we get state0, which is the initial state.

     So this works.

     Therefore, we can use two tokens on an 8-cell circle. 

     Materials for each team:

          - A paper strip with 8 boxes in a circle (or a string of 8 index cards in a circle).
          - Two tokens (e.g., two coins or two small cards) that can show an arrow (or have an arrow that can be flipped).

     Initial state for Team1 and Team3: state0 = cell0: right, cell1: left.
     Final state for Team2 and Team3: state5 = cell4: left, cell5: right.

     Rules as above.

     Work: 
          Team1: start at state0, compute state1 to state5.
          Team2: start at state5, compute state4 to state0.
          Team3: connect state0 to state5.

     But note: Team2 might not know that they need to run backward. We don't tell them the time direction. They may try to run forward from state5 and get state6, state7, etc., which is not what we want.

     So we must instruct them: "You are given the state at step5. Find the state at step4, step3, step2, step1, and step0."

     Then they have to run the rule in reverse. How? They might try to move the tokens in the reverse direction without flipping arrows. Let's see what happens if they try to run the rule in reverse without flipping arrows.

     For example, from state5: cell4: left, cell5: right.
     To get state4, they might think: how did we get here? 
          In state4, the tokens were at cell5 and cell4 moving in such a way that they ended up at cell4 and cell5? In state4, we had cell5: left and cell4: right? Then they moved to cell4 and cell5 respectively, and then we have state5.

     But if they try to run the rule forward from state5, they will get state6, which is not state4.

     Alternatively, if they have understood the reversibility, they might flip the arrows and run forward to go back in time.

     We leave it open for them to discover.

     Timeline for the activity with this example.

     We must provide a ledger: a table with time steps and the state of each cell.

     What will go wrong:

          - The rule for collisions might be forgotton.
          - In state0, cell0 and cell1 are adjacent. They might think that counts as a collision immediately? But in our rule, at state0, they are not moving yet. At step0, we have the state. Then at step1, they would move: cell0 to cell1, cell1 to cell0 -> conflict, so bounce.
          - In state2: cell0 token is at cell7 and cell1 token is at cell2. They move: cell7 to cell6, cell2 to cell3. No conflict.

     Debrief mapping:

          - The micro-dynamics is reversible: Team1's forward steps should be the reverse of Team2's steps if Team2 flipped the arrows and ran forward. Specifically, Team1's state0 becomes state1, state2,... state5. Team2, by flipping the arrows at state5 and running forward, should get state4, state3,... state0.

          - The boundary condition: why did we start with a particular initial state? Because it was given. In the universe, the initial state was given by the Big Bang.

          - The arrow of time: Team1 had no trouble going forward. Team2 had difficulty going backward because they didn't automatically know to flip the arrows. In the real world, we don't flip the arrows because our own memory and records are created in the forward direction. The ledger they kept during the activity was written in the forward direction.

          - What the activity doesn't show: entropy increase. In this small system, entropy doesn't increase; it fluctuates. In a large system, it would increase because there are more high-entropy states. But the boundary condition (initial state) had low entropy.

     This should meet the goals.
