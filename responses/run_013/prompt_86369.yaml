  ### Decision Procedure for Lexical Threshold Negative Utilitarianism Grantmaking  

  **Key Assumptions & Constraints:**  
  - **Threshold definition:** The board must pre-define specific criteria for "above-the-line" suffering (e.g., "severe clinical depression," "uncontrolled chronic pain," "life-threatening conditions"). Without this, referrals are inevitable.  
  - **Scope:** The procedure uses a **portfolio-wide** prioritization (all above-the-line proposals are funded first, then below-the-line). This forces the board to confront trade-offs if above-the-line demand exceeds the budget.  
  - **Units of measurement:** Above-the-line suffering uses "person-years above threshold averted" (requiring board-approved severity/duration metrics). Below-the-line uses "net well-being units" (e.g., QALYs, validated life-satisfaction scales).  
  - **What it cannot do:**  
    - Resolve ambiguity in threshold classification without board input.  
    - Quantify suffering intensity objectively (judgment calls are unavoidable).  
    - Handle proposals causing above-the-line harm (automatic veto).  
    - Account for long-term/secondary effects (e.g., prevention of future above-the-line suffering).  

  ---

  ### Decision Procedure Table  
  | Step | Question to ask | What counts as a sufficient answer | If the answer is no or unclear | Who decides, on what basis |  
  |------|-----------------|-----------------------------------|--------------------------------|----------------------------|  
  | 1    | Does the proposal **cause** suffering above the lexical threshold? | Evidence (e.g., trial data, ethics reviews) showing any harm is below threshold or absent. | **No:** Reject. **Unclear:** Proceed to Step 1b. | Program officers (POs). *Refer to board if harm type is unclassified (values judgment).* |  
  | 1b   | (If needed) Is the harm type caused by this proposal above the threshold? | Board’s pre-defined threshold criteria or ad hoc ruling. | **Yes:** Reject. **No/Unclassified:** Board rules. | Board (values). *Threshold ambiguity forced here.* |  
  | 2    | Does the proposal **alleviate** suffering above the lexical threshold? | Evidence (e.g., clinical diagnoses, surveys) matching board’s threshold criteria. | **No:** Skip to Step 4. **Unclear:** Proceed to Step 2b. | POs. *Refer to board if suffering type is unclassified.* |  
  | 2b   | (If needed) Is the alleviated suffering type above the threshold? | Board’s pre-defined criteria or ad hoc ruling. | **Yes:** Proceed to Step 3. **No:** Skip to Step 4. | Board (values). *Judgment call dressed as measurement.* |  
  | 3    | What is the **cost per person-year of above-threshold suffering averted**? | Quantified estimate using board-approved metrics (e.g., severity-adjusted duration of relief × beneficiaries). | Evidence insufficient: Reject. Metric undefined: Refer to board. | POs. *Judgment call dressed as measurement (intensity/duration proxy).* |  
  | 4    | What is the **net below-the-line benefit per dollar** (well-being units gained minus suffering reduced)? | Quantified estimate using board-approved metrics (e.g., QALYs, validated life-satisfaction scales). | Negative net benefit: Reject. Unquantifiable: Reject. | POs. *Judgment call dressed as measurement (equivalence of well-being units).* |  

  **Portfolio Prioritization Post-Assessment:**  
  - Fund all above-the-line proposals (Step 3) from **lowest cost per person-year averted** until the budget is exhausted.  
  - Fund below-the-line proposals (Step 4) from **highest net benefit per dollar** with remaining funds.  

  ---

  ### Application to Proposals  
  | Proposal | Where the procedure lands | The step that decides it | What the procedure cannot settle here |  
  |----------|---------------------------|--------------------------|---------------------------------------|  
  | **(1) Therapy for severe depression** | Above-the-line tier (funded if cost-effective vs. peers). | **Step 3:** Cost per person-year averted. If it consumes the entire budget, it crowds out others. | Whether "severe depression" is uniformly above-threshold (board must define severity). Cost-effectiveness hinges on arbitrary person-year metrics. |  
  | **(2) Social-prescribing for older adults** | Below-the-line tier (funded only if no above-the-line proposals exhaust the budget). | **Step 2:** Does not alleviate above-threshold suffering (no clinical depression impact). | Prevention of future above-threshold suffering (e.g., isolation leading to depression) is ignored. |  
  | **(3) Chronic pain relief with demoralizing regimen** | Above-the-line tier (funded if cost-effective vs. peers). Caused suffering is below-the-line, so no veto. | **Step 1:** Caused suffering is below-threshold (per description). **Step 3:** Cost per person-year of pain averted (ignoring regimen’s suffering). | The caused below-the-line suffering is not deducted from benefits (board’s theory permits this, but it may feel unethical). |  

  **Outcome for Proposal (2):**  
  The procedure **rejects (2) if any above-the-line proposal is funded**, as they take absolute priority. Step 2 (threshold classification) decides this. The board would recognize this as faithful to their principle: above-the-line suffering must be addressed first, regardless of below-the-line benefits.  

  ---

  ### Failure Modes to Watch For (≤5 Sentences)  
  1. **Applicants gaming thresholds:** Overstating severity (e.g., “loneliness as severe as clinical depression”) to access above-the-line priority.  
  2. **Measurement arbitrariness:** Cost per person-year (Step 3) and well-being units (Step 4) rely on board-defined metrics vulnerable to manipulation.  
  3. **Ignored harms:** Below-the-line suffering caused by above-the-line proposals (e.g., Proposal 3’s regimen) isn’t penalized.  
  4. **Starvation of below-the-line:** High above-the-line demand permanently excludes cost-effective below-the-line projects.  
  5. **False negatives:** Proposals preventing future above-the-line suffering (e.g., early interventions) misclassified as below-the-line.
