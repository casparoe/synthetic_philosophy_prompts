  We are designing a decision procedure for the foundation's grantmaking based on lexical threshold negative utilitarianism. The board's position: there exists a severity threshold such that suffering above it has absolute priority. No amount of benefits (pleasure, flourishing, etc.) can justify leaving above-threshold suffering unaddressed if we can address it with the same money. Below the threshold, we weigh costs and benefits in the usual way.

  The procedure must:
  - Be runnable by two program officers without philosophy training in about 2 hours per proposal.
  - Yield a publishable rationale.
  - Be candid about where it might misfire or be gamed.

  Key issues to resolve:
  1. The threshold: We need a way to determine if the suffering addressed (or caused) is above or below the line.
  2. The scope: Is the priority rule about the next dollar (marginal) or the entire portfolio? The board hasn't specified. The procedure must force a choice.

  We'll structure the procedure as a series of steps. The steps will:
  - First, determine if the proposal addresses above-threshold suffering (if so, it gets priority).
