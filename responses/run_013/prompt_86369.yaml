  - Also, we must check if the proposal causes any above-threshold suffering (which would be an absolute veto).

  We assume the board must set the threshold. We will have a step that refers to the board when the threshold is in question.

  The procedure:

  Step 1: Does the proposal directly alleviate suffering that the board has already classified as above the threshold? (We need a reference list from the board.)

  Step 2: If not, is the suffering it alleviates of a kind that the board has provided criteria for being above the threshold? (We need criteria from the board, e.g., "suffering that involves constant severe physical pain" or "conditions that make life not worth living".)

  Step 3: If still not, we must assess whether the suffering alleviated is above the threshold. This requires a judgment about severity. We'll have to refer to the board if it's a new kind of suffering.

