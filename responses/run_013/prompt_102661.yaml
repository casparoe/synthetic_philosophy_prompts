     The only way to get disagreement is to have different priors or different models.

     Given this, I suggest we focus on Extension A (different priors) for showing persistent disagreement and then explain that another reason is lack of common knowledge of information (giving real-world examples) even if we don't have a simulation for it.

     For the sake of the activity, we can run:

          Part 1: Common prior -> agreement.
          Part 2: Different priors -> disagreement after one update.

     And in the debrief, explain that disagreement can also persist when there is not common knowledge of the information partitions or of the posteriors (even if the prior is common).

  6. **Betting Stage (Optional)**:
     - After the pair has reached a stable announcement (either in agreement or in disagreement in the different prior case), we allow them to bet.
     - They announce their current posterior (probability of Urn A). Then they are offered to bet at odds derived from their announced probabilities.
     - How: For a pair, Alice with posterior p and Bob with posterior q (p and q are probabilities for A). They can propose bets to each other. 
          - Alice might say: "I'm willing to bet on A at odds of p: (1-p)". That is, if A occurs, I get (1-p) from you, if not, I pay you p. This is a bet that is fair according to her belief.
          - Similarly, Bob: odds q: (1-q) on A.
     - But if they have the same belief (p=q), then they will not bet because both think the bet is fair and has zero expected value. But if they disagree, they might bet.

     - Example in the common prior case: after agreement, p=q, so no bet.

     - In the different prior case after one update: Alice has 0.857, Bob has 0.8 for Urn A. 
          Alice's betting odds: 0.857:0.143, i.e., if she bets $1 on A, she gets (0.143/0.857) * $1 ≈ $0.167 if A happens, and loses $1 if not. 
          Bob's betting odds: 0.8:0.2, so if he bets $1 on A, he gets $0.25 if A happens, loses $1 if not.

     - But they can design a bet: Alice thinks A is more likely, so she might be willing to take the side that A will happen at Bob's offered odds? 

          Bob is willing to sell a bet on A at his odds: he will pay $0.25 if A happens and receive $1 if not. 
          Alice, who thinks A is very likely, might be willing to buy that bet? But let's see:

          Alice believes P(A)=0.857. If she pays $x to Bob to receive $0.25 if A happens and $0 if not? That's not the standard bet.

          Alternatively, we can have them bet on a contract that pays $1 if A, $0 if not.

          Alice values this contract at $0.857. Bob at $0.8. So Alice is willing to sell for more than $0.8 and Bob is willing to buy for less than $0.857. So they can agree on a price between $0.8 and $0.857.

          Then after the urn is revealed, they settle.

     - But in our activity, we use points. So they can agree on a contract: if A, Bob pays Alice S points; if not, Alice pays Bob T points. And they set S and T so that each thinks the bet is fair or favorable.

     - However, to save time, we can skip the betting or make it very simple.

  7. **Debrief**:
     - Map the activity to the theorem:
          - Common prior: In Part 1, they had the same prior. In Part 2 (Extension A), they had different priors.
          - Bayesian updating: They updated using Bayes' rule.
          - Common knowledge of the posteriors: In the activity, they announced their posteriors openly. But note: the theorem requires common knowledge of the posteriors at the actual state. In the activity, they only announced one number (their posterior at the actual state). But the theorem requires that they know what the other would have announced in every state? We come back to that.
          - The convergence in the activity is a process, but the theorem is static: it says that if they have common knowledge of each other's posteriors, then those posteriors must be equal.

     - The gap: 
          - In the activity, they only announce their posterior in the actual state. They don't announce a full posterior function. Therefore, they don't have common knowledge of the entire function, only of the number in the actual state. But in the simple binary case, knowing the number in the actual state (and the model) often lets them infer the signal, which in turn lets them update. But in more complex cases, it might not.
          - Also, the theorem does not say that conversation leads to agreement; it says that if they have common knowledge of their posteriors, then they must be equal. The activity shows a process that achieves common knowledge and then agreement.

     - What the activity leaves out:
          - The full posterior function. We must explain that common knowledge of the posterior functions is required for the theorem. In the activity, because the state space is small and the signals are discrete, the announcement of the posterior in the actual state often reveals the entire function (because it reveals the signal, and the function is determined by the signal). But in general, it might not.
          - The static nature: The theorem is about one point in time: if at that time they have common knowledge of their posteriors, then the posteriors must be equal. The activity shows a dynamic process that generates that common knowledge.

     - How to supply the missing piece:
          - Explain that in the activity, when they announced their posteriors, they were effectively revealing their signals because the posterior was a sufficient statistic and invertible. But in general, the posterior function might be coarser. The theorem works even if the posterior function is not invertible. But in that case, common knowledge of the number (at the actual state) might not be enough to infer the entire information, but the theorem still applies because common knowledge of the function (what they would have said in every state) forces agreement.

          - Also, the convergence in the activity is a way to achieve common knowledge of the posteriors. The theorem doesn't care how they got there, but once they are there, they must agree.

     - Real-world disagreement: 
          - Lives in: 
              (a) Different priors (which might be due to different life experiences, but note: the common prior assumption is controversial).
              (b) Not common knowledge of the information (e.g., I know something you don't know, and you know that I might know something you don't know, but we haven't shared enough to have common knowledge).
              (c) Different models (partitions) of the state space.
              (d) Non-Bayesian updating.

  8. **Logistics and Timing**:
     - Prior and signal structure: 10 minutes (explain, let them draw and compute initial posterior).
     - Part 1: 15 minutes (update once or twice).
     - Part 2 (Extension A): 15 minutes (assign different priors, compute, update).
     - Betting stage: 10 minutes (optional).
     - Debrief: 20 minutes.

  Total: 10+15+15+10+20 = 70 minutes. Leaves 20 minutes for setup and buffer.

  9. **Handouts and Props**:
     - Urns and balls (or simulated by the instructor drawing from a bag, or use a computer if needed).
     - Handout with the prior and likelihoods for the common prior case.
     - Handout for the different prior case: one for Partner 1 and one for Partner 2.
     - Worksheet for computing posteriors.

  Given the above, here is the runnable activity:

  **Activity: The Urn Game**

  *Materials*:
  - Two urns: Urn A (2 red, 1 white) and Urn B (1 red, 2 white).
  - A fair coin.
  - Balls for drawing (with replacement, or enough balls so that drawing doesn't change composition).
  - Handout 1 (common prior): Table with prior and likelihoods, and a worksheet for computing posteriors.
  - Handout 2 (for Extension A): Two versions, one for Partner 1 (prior: P(A)=0.6) and Partner 2 (prior: P(A)=0.5).

  *Setup* (10 minutes):
  - Explain the two urns and the prior (coin flip).
  - Show the likelihoods: P(red|A)=2/3, etc.
  - Each pair: one urn is chosen (by coin flip, but keep it hidden). They do not know which.
  - Each student in a pair draws one ball (in private), observes it, and replaces it. They record the color.

  *Part 1: Common Prior* (15 minutes):
  1. Each student computes their initial posterior (using Handout 1).
     - Red: 2/3, White: 1/3.
  2. They announce their posteriors simultaneously to each other.
  3. Now, they update: from the partner's posterior, they infer the partner's signal.
     - If partner said 2/3, they saw red; if 1/3, white.
  4. They compute the posterior given two signals (using the table provided: both red -> 4/5, mixed -> 1/2, both white -> 1/5).
  5. They announce again. They should now have the same posterior. If not, they update again (but they will be the same, so no change).

  *Part 2: Different Priors* (15 minutes):
  1. Re-pair or keep the same pairs but assign roles: Partner 1 and Partner 2.
  2. Give Handout 2: Partner 1 uses prior 0.6 for A, 0.4 for B; Partner 2 uses 0.5/0.5. Both know each other's prior and the signal structure.
  3. They draw balls again (new hidden urn chosen).
  4. Compute initial posteriors:
     - Partner 1: 
          Red: (2/3 * 0.6) / (2/3*0.6 + 1/3*0.4) = (0.4) / (0.4+0.1333) = 0.4/0.5333 ≈ 0.75
          White: (1/3 *0.6) / (1/3*0.6 + 2/3*0.4) = (0.2) / (0.2+0.2667) ≈ 0.2/0.4667 ≈ 0.4286
     - Partner 2: 
          Red: 2/3≈0.6667, White: 1/3≈0.3333
  5. Announce simultaneously. Then update:
     - From the partner's posterior, infer the partner's signal.
     - Then update to having two signals (using their own prior).
     - Partner 1: 
          If they saw red and partner saw red: 
            P(A|two red) = [ (2/3)^2 *0.6 ] / [ (4/9)*0.6 + (1/9)*0.4 ] = (0.2667) / (0.2667+0.0444) = 0.2667/0.3111≈0.857
          If they saw red and partner white: 
            P(A) = [ (2/3)*(1/3)*0.6 ] / [ (2/3)*(1/3)*0.6 + (1/3)*(2/3)*0.4 ] = (0.1333) / (0.1333+0.0889) = 0.1333/0.2222=0.6
          But wait, that's not right: actually, it should be the same as the prior because one red and one white are equally likely under A and B? Let me check:

            P(two signals: red and white | A) = (2/3)*(1/3)=2/9
            P(two signals: red and white | B) = (1/3)*(2/3)=2/9
            So P(A|red,white) = ( (2/9)*0.6 ) / ( (2/9)*0.6 + (2/9)*0.4 ) = (0.6) / (0.6+0.4)=0.6.

          So if Partner 1 sees red and partner saw white, then Partner 1's posterior is 0.6.

     - Partner 2, with two signals:
          If both red: (4/9 *0.5) / (4/9 *0.5 + 1/9 *0.5) = (2/9) / (2.5/9) = 2/2.5=0.8
          If mixed: becomes 0.5 (as before).

     - Example outcomes:
          - Both see red: 
               Partner 1: 0.857, Partner 2: 0.8.
          - Partner 1 sees red, Partner 2 sees white:
               Partner 1: 0.6, Partner 2: 0.5 (because Partner 2 updates: mixed -> 0.5).

     - They announce again: they don't agree. They can update again, but it will be messy and they may still disagree.

     - We stop after one update and note the disagreement.

  *Betting Stage* (10 minutes, optional):
     - After the final announcement, they are given an opportunity to bet.
     - Each states their current posterior for Urn A.
     - They can propose bets. For simplicity, we can have them try to agree on a contract: 
          - They choose an amount to bet (say, 10 points).
          - They choose an event (Urn A or Urn B).
          - They must find odds such that both are willing.
     - In the common prior case, they won't bet. In the different prior case, they might.

  *Debrief* (20 minutes):
     - Walk through the assumptions:
          - Common prior: violated in Part 2.
          - Common knowledge of posteriors: in the activity, they announced publicly, so they had common knowledge of the announced numbers. But note: the theorem requires common knowledge of the entire posterior function (what each would have believed in every state). In the activity, because the state space was small, the number revealed the function. In general, it might not, but the theorem still applies to the entire function.
          - Bayesian updating: they did it.
     - The static vs dynamic: The theorem says: if at a given time, it is common knowledge that Alice's posterior is p and Bob's is q, then p=q. The activity shows a dynamic process that often leads to a state where common knowledge of the posteriors holds and then p=q.
     - Real-world disagreement: often due to different priors, or not having shared information sufficiently to achieve common knowledge, or different models (partitions).

  **Predictable First-Run Failures**:

  1. **Arithmetic errors**:
     - Students might mess up Bayes' rule. 
     - Mitigation: Provide a worksheet with the formula and precomputed likelihoods for common combinations. For the common prior case, provide the update table (as above). For the different priors, provide a calculator or precomputed update rules.

  2. **Update loop confusion**:
     - Students might not infer the signal from the posterior. They might try to update on the number directly without realizing it reveals the signal.
     - Mitigation: Explicitly instruct: "When you see your partner's posterior, you can deduce the color they saw because each color gives a unique posterior in this setup."

  3. **In the different prior case, deeper recursion**:
     - After the first update, they might want to update again. But then they have to model each other's update. This can get messy. 
     - Mitigation: Stop after one update and note they disagree. Explain that further updates might not lead to agreement and that the theorem doesn't apply because of different priors.

  4. **Betting stage confusion**:
     - They might not understand how to set the bets.
     - Mitigation: Skip or provide a simple mechanism: "If you are willing to buy a contract that pays 1 if A for price x, and your posterior is p, then you are willing if x <= p. Similarly for selling." Then have them find a price in between.

  **What the activity leaves out**:

  - The theorem requires common knowledge of the **entire posterior function** (i.e., what each agent would believe in every state of the world), not just the posterior in the actual state. In the activity, because the state space is small and the posterior is a function of the signal (which is coarser than the state), and because the signal is revealed by the posterior in the actual state, they effectively get the entire function. But in general, an agent might have a posterior function that is constant on some cells of the partition, and announcing the number in the actual state doesn't reveal the entire function. The theorem still applies: if they have common knowledge of their posterior functions, then they must agree in the actual state.

  - The theorem is static: it does not require a process of updating. The activity shows a dynamic process that often leads to common knowledge of the posteriors and then to agreement. But the theorem can apply even without any communication (if by some other means they have common knowledge of their posteriors).

  To supply the missing piece in the debrief:

  - Explain the gap and that the activity's dynamic process is one way to achieve common knowledge of the posteriors (at least in these simple models). But the theorem is more general and applies whenever common knowledge of the posterior functions holds, however it came to be.

  - Use an example: Suppose the state space is larger. For instance, there are three signals possible: red, white, and blue. But in the actual state, only red and white occur. The posterior function of an agent might assign different probabilities to states that didn't occur. But if they have common knowledge of the entire function, then they must agree in the actual state. The activity doesn't cover that.

  This design should achieve the goal of having the students feel the theorem in their hands, and understand the conditions under which agreement is forced.
answer: |-
  Below is a runnable activity for your seminar, designed around Aumann's agreement theorem. It includes the core mechanism you described, extensions for persistent disagreement, an optional betting stage, and a structured debrief. The activity uses tangible props to make the model visible, minimizes arithmetic complexity, and anticipates implementation challenges.

  ---

  ### **Activity: The Urn Game**
  **Materials Needed:**
  - Two identical urns (or labeled boxes):  
    - Urn A: 2 red balls, 1 white ball.  
    - Urn B: 1 red ball, 2 white balls.  
  - A fair coin (to determine the hidden state).  
  - Sealed envelopes (for private signals).  
  - Handout tables (see below) for prior/likelihoods and Bayesian updating.  
  - Optional: Betting tokens (e.g., poker chips) for Part 3.  

  **Handout Tables (Projected and Printed):**  
  **Table 1: Shared Prior and Signal Structure**  
  | State (Urn) | Prior P(Urn) | P(Red \| Urn) | P(White \| Urn) |
  |--------------|--------------|---------------|-----------------|
  | A            | 0.5          | 2/3           | 1/3             |
  | B            | 0.5          | 1/3           | 2/3             |

  **Table 2: Posterior Calculator (for Students)**  
  | Your Signal | Partner’s Inferred Signal | Combined Posterior P(Urn A \| Signals) |
  |-------------|----------------------------|----------------------------------------|
  | Red         | Red                        | 4/5 (0.8)                              |
  | Red         | White                      | 1/2 (0.5)                              |
  | White       | Red                        | 1/2 (0.5)                              |
  | White       | White                      | 1/5 (0.2)                              |

  ---

  ### **Part 1: Core Mechanism (Agreement)**
  **Goal:** Experience convergence to agreement via Bayesian updating.  
  **Duration:** 30 minutes.  
  **Steps:**  
  1. **Setup (5 min):**  
     - Flip a coin to choose the hidden urn (A or B), but conceal the result.  
     - Distribute sealed envelopes to all 16 students. Each contains a private signal (ball color: red/white) drawn from the chosen urn (simulate draws; ensure conditional independence).  
     - Display **Table 1**. Emphasize: *All know the prior, signal distributions, and that these are common knowledge.*  

  2. **Initial Posterior (5 min):**  
     - Students calculate their **private posterior** (P(Urn A \| their signal)) using Bayes’ theorem:  
       - E.g., Seeing red: \( P(A \| \text{red}) = \frac{(2/3)(0.5)}{(2/3)(0.5) + (1/3)(0.5)} = \frac{2}{3} \approx 0.67 \).  
     - Students write their posterior on a card.  

  3. **Update Loop (15 min):**  
     - Pair students (8 pairs). Partners **simultaneously reveal** their posteriors.  
     - Each treats the other’s posterior as evidence. Since posteriors are invertible (0.67 → red, 0.33 → white), they infer their partner’s signal.  
     - Using **Table 2**, they update to a **new posterior** (e.g., both red → 0.8).  
     - Repeat announcements and updates **until posteriors stabilize** (typically 1-2 rounds).  
     - **Expected Result:** All pairs converge to the same posterior (0.5, 0.8, or 0.2).  

  4. **Discussion (5 min):**  
     - Poll pairs: “Did you expect to agree? Why/why not?” Highlight initial skepticism about persistent disagreement.  

  ---

  ### **Part 2: Persistent Disagreement Extensions**
  **Goal:** Contrast with cases violating Aumann’s assumptions.  
  **Duration:** 30 minutes.  
  **Setup:** Reuse the urn/ball setup from Part 1.  

  #### **Extension A: Different Priors (Assumption Violated)**  
  - **Mechanism (10 min):**  
    - Assign roles within pairs:  
      - **Partner 1:** Believes prior is P(A) = 0.6, P(B) = 0.4.  
      - **Partner 2:** Believes prior is P(A) = 0.5, P(B) = 0.5.  
    - Both know their partner uses a different prior (displayed on handouts).  
    - Repeat Part 1 steps (private signals → initial posterior → update loop).  
    - **Result:** Posteriors **diverge or stabilize asymmetrically** (e.g., 0.75 vs. 0.67 after one update).  

  #### **Extension B: Asymmetric Information (Common Knowledge Violated)**  
  - **Mechanism (15 min):**  
    - Form trios (re-pair students; one trio per urn).  
    - **Signal Structure:**  
      - Partner 1 and Partner 2 receive private signals (as before).  
      - **Observer:** Receives a third private signal but **cannot announce their posterior**. Only Partners 1/2 update.  
    - Partners 1/2 run the update loop until agreement (as in Part 1).  
    - **Then:** Observer reveals their signal. Partners 1/2 update again using this new evidence.  
    - **Result:** Initial agreement is **shattered** by the observer’s signal (e.g., agreed 0.5 → new signal → 0.8/0.2).  

  5. **Discussion (5 min):**  
     - Contrast Extension A (“different realities”) and B (“hidden information”) as real-world disagreement sources.  

  ---

  ### **Part 3: Optional Betting Stage**
  **Goal:** Illustrate no-trade theorems dynamically.  
  **Duration:** 10 minutes.  
  **Mechanics:**  
  - After posteriors stabilize (in any stage), partners **announce odds** (e.g., 0.8 = 4:1 for Urn A).  
  - They may bet tokens on Urn A/B at these odds.  
  - **Key Insight:**  
    - In **Part 1 (agreement)**, no bets occur (identical posteriors → no mutually beneficial trade).  
    - In **Extension A (disagreement)**, bets occur (divergent posteriors → both see value).  
  - Reveal the true urn. Settle bets.  

  ---

  ### **Debrief: Mapping to Aumann’s Theorem**
  **Duration:** 20 minutes.  
  **Link Activity to Theorem:**  
  1. **Common Prior:**  
     - *“In Part 1, you shared Table 1. What if priors differ?”* → Extension A shows how disagreement persists without this.  
  2. **Common Knowledge of Posteriors:**  
     - *“When you announced numbers, you knew others saw them. What if signals are hidden?”* → Extension B breaks common knowledge.  
  3. **Bayesian Updating:**  
     - *“You used Table 2 to update. What if you ignored signals?”* → Non-Bayesian agents may not converge.  
  4. **Static vs. Dynamic:**  
     - *“You converged over time, but Aumann is instantaneous. How?”* → The theorem assumes common knowledge of posteriors *at the start*; your dialogue generated it.  
  5. **Real-World Disagreement:**  
     - *“Where does persistent disagreement live?”* → In **differential information** (Extension B) or **differential priors/models** (Extension A).  

  **The Gap: What the Activity Misses**  
  - **Common Knowledge of Posterior Functions (Not Just Numbers):**  
    - The theorem requires agents know *what others would believe in every state*, not just the announced number. The activity “fakes” this via invertible posteriors (e.g., 0.67 → red).  
    - **How to bridge:** In debrief, ask: *“Could you infer your partner’s signal from their posterior? What if signals weren’t invertible (e.g., 10 possible posteriors)?”* Explain that Aumann’s result holds even when posteriors aren’t invertible, but common knowledge of the *function* is still required.  
  - **Static Result vs. Dynamic Convergence:**  
    - The activity shows iterative convergence; the theorem is a one-shot result.  
    - **How to bridge:** Stress that *“The dialogue generated common knowledge. Aumann says if that knowledge exists upfront, agreement is immediate.”*  

  ---

  ### **Predictable Failures & Fixes**
  1. **Arithmetic Errors:**  
     - **Risk:** Fractions (e.g., 2/3) may slow computation.  
     - **Fix:** Provide **Table 2** upfront. Use decimals (0.67, not 2/3). Allow calculators.  

  2. **Update Loop Confusion:**  
     - **Risk:** Students update on the posterior *number* (e.g., 0.67) without inferring the signal.  
     - **Fix:** Explicitly say: *“Your partner’s posterior reveals their signal. Use Table 2 to combine signals.”*  

  3. **Non-Invertible Posteriors (Edge Case):**  
     - **Risk:** If signals yield identical posteriors (e.g., two signals → 0.5), students can’t infer signals.  
     - **Fix:** Use asymmetric urns (e.g., Urn A: 3 red, 1 white; Urn B: 1 red, 3 white) to ensure invertibility.  

  4. **Betting Stage Distraction:**  
     - **Risk:** Bets may overshadow the epistemic lesson.  
     - **Fix:** Run betting only if time permits. Focus on *why* no trades occur post-agreement.  

  ---

  ### **Why This Works**
  - **Tangible Model:** Urns/coins make the prior/likelihoods visceral. Tables scaffold computation.  
  - **Contrastive Design:** Extensions A/B isolate assumption violations without new mechanics.  
  - **Debrief Closes the Loop:** Explicitly ties activity moments to theorem assumptions and real-world disagreement.  
  - **Addresses the Gap:** The debrief clarifies the role of posterior functions (students “felt” invertibility; you explain the general case).  

  This design ensures students *experience* convergence, then confront its fragility—making Aumann’s result intuitive, not just declarative.
