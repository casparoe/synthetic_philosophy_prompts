     - Ask if anyone with an H signal bought and then lost money? (We hope that in state B, at least one with H signal bought and lost.) Similarly, in state A, someone with L signal sold and then the asset was worth 10 -> they lost the share they sold for less than 10.
     - Point out that when they traded based on their private information, they were assuming that the market price would not fully reflect that information. But the market maker sets the price based on the order flow, which includes their own order. So their own order moved the price.

     - Now introduce the no-trade theorem. Explain the four hypotheses:
          1. Common prior: everyone knew the probabilities and the signal structure, and that was common knowledge.
          2. Common knowledge of rationality: everyone is rational and knows that everyone else is rational, etc.
          3. Ex ante efficient allocation: the initial allocation (10 shares, 100 cash) was already efficient given the common prior (risk neutral, same endowment -> they all had the same expected wealth, so no risk sharing needed).
          4. No noise traders: no one traded for non-informational reasons.

     - Then the theorem says: no trade should occur.

     - But trade did occur. Why? Because the common knowledge of rationality was violated? Or because the allocation was not ex ante efficient? (But it was.) Or because there were noise traders? (Not in Phase 1.) 

     - Actually, the activity probably had trade in Phase 1 because participants were not playing the equilibrium strategy. They did not fully anticipate how the market price would be set and how their own trade would affect it. So they acted as if they were the only informed trader? They did not have common knowledge of rationality? 

     - Then, in Phase 2, we introduced noise traders (the liquidity sellers). What happened? Trade occurred, and it was driven by non-informational reasons. And now, the price might not have been fully revealing. So participants with private information could profit.

     - Discuss the three escape hatches:
          1. Differing priors: But we had a common prior. If they had different priors, then they might trade, but that would require them to be irrational? (Because they started with the same information and then got symmetric signals, they should have the same posterior if they update properly.) 
          2. Failure of common knowledge of rationality: In Phase 1, each participant might have thought that others would trade naively, so they could profit. But if everyone is rational and that is common knowledge, then they would realize that no one will trade naively, so no trade.
          3. Non-informational motives: This is what we added in Phase 2.

     - Only the last two (common knowledge failure and non-informational motives) allow them to remain rational.

     - Also discuss the lemons problem: In Phase 1, when someone offered to sell, that might be because they had a low signal. So why would you buy from them? The act of offering to sell was bad news. The price should adjust.

     - Then, pivot to the unresolved tension with Hayek: markets aggregate information. But the no-trade theorem says that if the price aggregates information perfectly, then no one has an incentive to gather the information. This is the Grossman-Stiglitz paradox. And in Phase 2, because the price was not fully revealing (due to noise traders), there was an incentive to gather information.

     - If time permits, mention Myerson-Satterthwaite: even with private values (not common value as in this game), trade might not happen because of asymmetric information. But that is a different setting.

  Predictable failure modes:

    1. Common knowledge of rationality: In the classroom, it is not established. The activity works precisely because participants do not fully reason through the equilibrium. So we cannot reproduce the common knowledge of rationality. We must admit in the debrief that the theorem requires it, and the classroom violated it.

    2. Risk sharing: We assumed risk neutrality. If participants were risk averse, the initial allocation might not be efficient. But we avoided that by using linear payoffs and not requiring risk sharing.

    3. The activity produces anecdotes, not an equilibrium. We get one realization. We must explain that the theorem is about the equilibrium outcome.

    4. The pricing rule we used (the market maker setting price = conditional expectation) is not the only way markets work. But it illustrates the information aggregation.

    5. Participants might not understand the pricing rule. We must explain it clearly and perhaps give examples.

    6. The net order flow I might be zero in both phases by chance? Then the price is 5. But that's okay.

    7. In Phase 1, the state might be A and there are many H signals, so I is high and price is high, and then an H-signal participant buys and the state is A -> they gain. Then they don't see the problem. We need to emphasize that the expected profit is zero and that in state B they might lose.

    8. The liquidity need in Phase 2 might not be credible: participants might think that the liquidity sellers have private information? But we forced them to sell regardless. We must stress that it is exogenous and non-informational.

    9. The activity cannot reproduce the ex ante efficiency because we started with symmetric endowments and risk neutrality. We must explain that.

    10. The activity does not model the dynamic adjustment of prices (which is a key part of the Milgrom-Stokey setup). We have a one-shot market. We must note that the theorem is about dynamic markets too.

  What the activity cannot reproduce at all:

    - The common knowledge of rationality: we must explain that in the theorem, it is assumed and that without it, trade can occur.

    - The dynamic nature of the market: in the theorem, offers are public and then others can react. We have a one-shot simultaneous move. We must note that the theorem holds even in dynamic settings.

    - The exact equilibrium reasoning: we must explain that in equilibrium, they would not trade.

    - The ex ante efficient allocation: we must explain that if the initial allocation was not efficient, then trade for risk-sharing could occur even without information.

    - The absence of noise traders: in Phase 1, we intended no noise traders, but we cannot prevent participants from trading for non-informational reasons (like boredom). We have to hope they don't.

  We must be ready for these and explain them in the debrief.

  Materials:

    - Random state generator: coin.
    - Random signal generator: for each participant, a bag with 70% H and 30% L for state A, and vice versa for state B? But we can use a computer or a pre-generated list.
    - A table or formula for the price: Price = 10/(1+(3/7)^I) for I from -18 to 18 (even integers). We can give this formula to the students.

    - Decision cards for Phase 1 and Phase 2.

    - A hat to draw names for liquidity need.

    - Whiteboard to record the state, the signals (without revealing), I, and the price.

  Payoff scheme in points:

     We can use the final cash from the game as points? But then they start with 100 and we add the trading and the asset payoff. The asset payoff is 0 or 10 per share, so the final wealth might be negative? We don't want that. So we can set the initial cash to be enough to cover losses.

     Alternatively, we can not have real money and just use the wealth as points for a grade? Or we can say that the points are for bragging rights.

     Since we don't use real money, we can just report the final wealth and compare.

     Example: 
          In Phase 1, if they buy: final wealth = 100 - price + 11 * state_value.
          If state_value=10, then 100 - p + 110 = 210 - p.
          If state_value=0, then 100 - p.
          Selling: 100 + price + 9 * state_value.

     We must make sure that the numbers are such that they care about gains and losses.

     We can scale: multiply the state_value by 10? Then the asset pays 100 in A and 0 in B? But then the price formula: we set the prior expected value at 50. But the price formula becomes: 100/(1+(3/7)^I). Then the numbers get bigger.

     Alternatively, we can let the share pay 1 in state A and 0 in state B. Then the prior expected value is 0.5. The price formula: 1/(1+(3/7)^I). Then the trading gains and losses are small. But that might be okay.

     We'll stick with the original: asset pays 10 in A, 0 in B. Then the price is between 0 and 10. Initial cash 100 is enough to cover a buy (which costs at most 10). So final wealth is between 90 (if you buy and state B) and 210 (if you buy and state A and started with 100 and 10 shares). Or if you sell and state A: 100 + price - 10? Actually, if you sell, you have 9 shares and cash 100+price. In state A: 100+price+90 = 190+price. So between 90 and 210.

     We can use these as points.

  Timing might be tight. We can run only one state draw for both phases? But then the signals are the same in both, which might be confusing. We want two independent draws.

  Alternatively, we can save time by having the state drawn once for both phases? But then the signals are the same? We don't have to. We can make the two phases independent.

  We'll do two independent state draws.

  Now, write the minute-by-minute timeline:

     0-5 min: Introduction. Explain the rules, the asset, the state (A and B, each 50%), the signal (H and L), the signal accuracy, the initial endowment, the market maker pricing rule (write the formula: P = 10/(1+(3/7)^I) and explain that I is the net buy orders). Explain the decision: buy, sell, nothing.

     5-10 min: Draw the state for Phase 1 (secretly). Then assign signals: for each student, flip a biased coin (70% for H if A, 30% for H if B). We can use a computer program to do this quickly, or have pre-prepared envelopes.

     10-20 min: Students decide their action for Phase 1 and submit.

     20-25 min: Instructor calculates I and the price, then announces I and the price.

     25-30 min: Reveal the state for Phase 1. Students calculate their final wealth.

     30-35 min: Phase 2: Draw a new state (secretly). Assign signals again.

     35-40 min: Randomly select 5 students to have a liquidity need (they must sell). The remaining 13 decide their action.

     40-45 min: Collect decisions. Calculate I (including the 5 forced sells) and price.

     45-50 min: Reveal the state for Phase 2. Students calculate their final wealth.

     50-90 min: Debrief.

  Debrief outline:

     - Ask: In Phase 1, who traded? Why? What was the outcome?
     - Ask: Did anyone with an H signal buy and then the state was B? What happened?
     - Ask: Why did you think you could profit? (They might say: because I had private information.)
     - Then point out: the market maker set the price based on the order flow, which included your order. So your order moved the price. In fact, the very fact that you were willing to buy was a signal to the market that you had an H signal. And the market price adjusted accordingly. So the price already reflected your information? Then why did you trade?

     - Introduce the no-trade theorem and its four hypotheses.
     - Map the activity:
          - Common prior: yes, we all knew the probabilities.
          - Common knowledge of rationality: we assumed it? But did we have it? Probably not, because some traded without anticipating the full effect.
          - Ex ante efficient allocation: yes, because we all started the same and are risk neutral.
          - No noise traders: in Phase 1, we did not have any forced trades.

     - Then, why did we see trade? Because common knowledge of rationality was absent? Because we did not play the equilibrium?

     - In Phase 2, we introduced noise traders (the liquidity sellers). What happened? Trade occurred. Now, the order flow had two components: the noise and the information. So the price did not fully reveal the information. Then, an informed trader might have been able to profit.

     - The three escape hatches:
          1. Differing priors: but we had a common prior. If we had different priors, we would have traded, but that would be irrational? Because we started with the same prior and then got symmetric signals.
          2. Common knowledge of rationality: we didn't have it in Phase 1. In Phase 2, we had noise, so it was okay.
          3. Non-informational motives: Phase 2 had them.

     - Only the last two let them remain rational.

     - Discuss the lemons problem: if you see someone offering to sell, you should worry they have a low signal. So the price should adjust downward. In Phase 1, the market maker did that via the pricing rule.

     - Pivot to Hayek: prices aggregate information. But the no-trade theorem says that if they aggregate perfectly, no one has an incentive to trade on information. The Grossman-Stiglitz paradox.

     - Finally, if time: mention Myerson-Satterthwaite: even if two people have private values (e.g., one values the asset more than the other), if they don't know each other's values, they might not trade because of the bargaining problem. So no-trade has multiple sources.

     - Conclude: markets trade because of noise, because of non-informational motives, and because common knowledge of rationality is often not achieved.

  We must be honest that the activity does not perfectly reproduce the theorem, especially the common knowledge of rationality and the dynamic adjustment. We had to rely on bounded rationality.

  We must also note that the initial allocation was ex ante efficient only because of risk neutrality and symmetry. In real markets, there might be risk-sharing motives.

  This should fit in 90 minutes.
answer: |-
  Below is a comprehensive classroom activity designed to make 18 graduate students experience the no-trade theorem firsthand. The design prioritizes experiential learning, with a two-phase structure to contrast informational vs. non-informational trade. Rules, materials, payoffs, and a timeline are provided, followed by debriefing notes and anticipated failure modes.

  ---

  ### **Rules and Materials**
  **Objective**: Trade shares of a risky asset to maximize points (no real money).  
  **Asset**: Pays **100 points** if state is **GREEN**, **0 points** if **RED**.  
  **Common prior**:  
  - 50% chance of GREEN, 50% RED (publicly announced coin flip).  
  - All know the data-generating process is objective and common knowledge.  

  **Private signals**:  
  - Each student receives a sealed envelope with **HIGH** or **LOW** signal.  
  - Signal accuracy:  
    - If GREEN: 75% get HIGH, 25% get LOW.  
    - If RED: 75% get LOW, 25% get HIGH.  
  - Signals are drawn independently (e.g., using a random number generator).  

  **Initial allocation**:  
  - All 18 students start with **10 shares** and **200 points** (cash).  
  - *(Ex ante efficient: symmetric, risk-neutral agents with common priors).*  

  **Trading mechanism (Phase 1 & 2)**:  
  - **Single-round call market**:  
    - Students submit **orders simultaneously** (buy 1 share, sell 1 share, or do nothing).  
    - Orders are public.  
  - **Market price**:  
    - Price = \( 50 \times \frac{1}{1 + (1/3)^I} \), where \( I \) = (number of buy orders) – (number of sell orders).  
    - Formula derived from Bayesian updating (explained during debrief).  
  - **Trade execution**:  
    - All orders executed at the market price.  
    - If buy/sell orders mismatch, excess orders canceled randomly.  
  - **Payoffs**:  
    - Final points = Cash + (Shares × Asset payoff).  
    - Cash adjusted: Buyers pay price, sellers receive price.  

  **Phase 2 twist (non-informational trade)**:  
  - **Liquidity shock**: 4 randomly selected students **must sell 1 share** (regardless of signal).  
  - Randomly assigned via public lottery after signals distributed.  

  **Materials**:  
  - Coin (for state flip), random number generator (signals/lottery), envelopes (signals), timer.  
  - Scoreboard to track orders, price, and payoffs.  

  ---

  ### **Timeline (90 Minutes Total)**
  | Time  | Activity                                                                                                                                 |
  |-------|------------------------------------------------------------------------------------------------------------------------------------------|
  | 0-5   | **Setup**: Distribute materials. Explain asset payoffs, common prior, initial allocation. Announce: "Goal is to maximize points. No talking once signals distributed." |
  | 5-10  | **State draw**: Flip coin (secretly record state: GREEN/RED). Generate/distribute private signals in envelopes.                          |
  | 10-20 | **Phase 1 (informational trade)**: Students submit orders (buy/sell/nothing). Collect orders publicly.                                   |
  | 20-25 | **Price calculation**: Compute \( I \), announce market price. Execute trades.                                                           |
  | 25-30 | **Reveal state**: Announce true state. Students calculate final points. Identify winners/losers.                                         |
  | 30-35 | **Phase 2 setup**: Redraw state/distribute new signals. Randomly assign liquidity shock to 4 students (must sell).                       |
  | 35-45 | **Phase 2 (non-informational trade)**: Students submit orders (liquidity-shocked must sell). Collect orders.                             |
  | 45-50 | **Price calculation**: Compute new \( I \) and price. Execute trades.                                                                    |
  | 50-55 | **Reveal state**: Announce state. Calculate points. Compare Phase 1 vs. 2 outcomes.                                                      |
  | 55-90 | **Debrief**: Link game to theorem, discuss hypotheses, escape hatches, and tensions (details below).                                     |

  ---

  ### **Debrief (35 Minutes)**  
  **Step 1: Elicit Student Observations (5 min)**  
  - *Ask:* "In Phase 1, who traded? Why?" "Who profited/lost despite having the correct signal?"  
  - Highlight a student who held a correct signal (e.g., HIGH in GREEN) but lost points because price adjusted (e.g., bought at 70, asset paid 100, but many bought → price rose to 85 → small profit).  

  **Step 2: Introduce the No-Trade Theorem (5 min)**  
  - State the theorem: *"If traders share a common prior, initial allocation is efficient, no noise traders, and information structure is common knowledge, no trade occurs."*  
  - **Map hypotheses to the game**:  
    - **Common prior**: Known 50/50 odds and signal accuracy (no priors disagreement).  
    - **Ex ante efficiency**: Identical endowments + risk neutrality → no initial gains from trade.  
    - **No noise traders**: Phase 1 had no forced trades; Phase 2 added them.  
    - **Common knowledge of rationality**: Assumed but likely violated (crucial failure mode).  

  **Step 3: Contrast Phase 1 vs. 2 (10 min)**  
  - **Phase 1 (failed informational trade)**:  
    - Orders revealed signals (e.g., buy orders signaled HIGH). Price absorbed this → no profitable trade.  
    - *Ask:* "Why did your willingness to trade become evidence against it?"  
      - → *Selling? Others inferred you had LOW signal → adjusted price down → no buyer gains.*  
      - → *Lemons effect*: Eagerness to sell is bad news about the asset.  
  - **Phase 2 (successful non-informational trade)**:  
    - Liquidity shocks created trade unrelated to signals → price did not fully reveal information → some profited from signals.  
    - *Ask:* "Which hypothesis did we violate here?" → **Noise traders**.  

  **Step 4: Escape Hatches (10 min)**  
  - *Ask:* "How could rational trade occur? Which hypotheses must fail?"  
    1. **Differing priors**:  
       - "But we had a common prior! If you disagreed, you were irrational, not just uninformed."  
    2. **Common knowledge of rationality failure**:  
       - "Did you assume others would misread signals? Or act randomly?"  
       - Phase 1 worked *because* this was violated (students ignored inferences).  
    3. **Non-informational motives**:  
       - Phase 2: Liquidity needs justified trade.  
  - *Key takeaway*: Only #2 and #3 preserve rationality.  

  **Step 5: Tensions and Extensions (5 min)**  
  - **Hayek tension**:  
    - "Prices aggregate information, but if they do it perfectly (like Phase 1), no one trades!"  
  - **Grossman-Stiglitz paradox**:  
    - "If prices reveal all information, why gather it?" → Need noise (Phase 2) to incentivize info collection.  
  - **Myerson-Satterthwaite pivot (if time)**:  
    - "No-trade also arises in bilateral bargaining with private values (e.g., I value art higher than you). Markets trade because of institutions, not just information."  

  ---

  ### **Predictable Failure Modes**  
  1. **Common knowledge of rationality unreproducible**:  
     - The game "works" only because students lack common knowledge of rationality (e.g., some naively trade on signals without inferring from others’ actions). Pre-empt by stressing: *"Anticipate how others will react to your order."*  
  2. **Risk-sharing invisible**:  
     - Linear points ignore risk aversion → cannot show gains from hedging. Admit: *"Real markets trade to share risk; we simplified to focus on information."*  
  3. **Anecdotes, not equilibrium**:  
     - One-shot game cannot prove equilibrium. Clarify: *"This illustrates the theorem’s logic, not a proof."*  
  4. **Price formula confusion**:  
     - Students may not compute Bayesian updates. Mitigate by providing examples pre-game (e.g., "If 12 buy, 6 sell, I=6 → price=50/(1+(1/3)^6)≈78").  
  5. **Liquidity motives doubted**:  
     - Students may suspect liquidity-shocked traders are informed. Stress: *"They must sell randomly—no choice!"*  
  6. **Unlucky signal draws**:  
     - If signal distribution is extreme (e.g., 17/18 get HIGH in RED), Phase 1 may not show losses. Mitigate by using pre-generated draws where 3–5 get false signals.  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Dynamic price adjustment**:  
    - Milgrom-Stokey assumes iterative offers → your voice must explain: *"Real markets adjust prices through repeated bids, but the logic holds: each offer signals information."*  
  - **Full common knowledge**:  
    - Classroom cannot replicate infinite recursion of beliefs ("I know you know I know..."). Admit: *"We assume common knowledge, but humans shortcut."*  
  - **Ex ante efficiency with heterogeneity**:  
    - Symmetric endowments oversimplify. Clarify: *"With diverse endowments, trade for risk-sharing may occur even under the theorem."*  

  This design forces students into the no-trade trap, contrasts it with noise-driven trade, and uses debriefing to dissect hypotheses and tensions. The first run will be messy—embrace it as proof that common knowledge fails!
