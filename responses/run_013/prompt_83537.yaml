prompt: |-
  Im teaching a session on the units-of-selection mess (gene's-eye view vs. group selection vs. multi-level selection) and I want the spec nailed down before we compare the contenders. What would a theory of the units of selection actually have to deliver to count as adquate? Give me the requirements list, each with the case or result behind it: which cases it has to get right (sterile workers in the social insects, meiotic drive, a heritable symbiont that gets passed down outside the germline), which distinctions it can't just collapse (replicator vs. interactor, and selection *of* a thing vs. selection *for* it), and which results from population genetics it can't contradict. Here's one I made up and want a verdict on, since I think it should show up on the list: a gut microbe that the host smears onto its eggs, which makes hosts live longer and lay more -- is that a unit of selection or not, and does the answer change any of the requirements? Then mark which requirements are just house rules of one camp and which are non-negotiable, and tell me which pair of them I probably can't have both of. Skip the scorecard, I'll do that in class.
reasoning: |-
  Okay, the user is teaching a session on the units-of-selection debate and wants to nail down the specifications for what makes a theory adequate. They mentioned key cases like sterile workers, meiotic drive, and heritable symbionts, distinctions like replicator vs. interactor, and avoiding contradictions with population genetics. They also brought up a specific example of a gut microbe passed via egg-smearing that benefits the host, wondering if it counts as a unit of selection and how that affects requirements.

  First, I need to recall the core aspects of the units of selection debate. The main contenders are the gene's-eye view, group selection, and multi-level selection. Each has its own take on what entities are selected. The user wants a list of requirements that any adequate theory must satisfy, distinguishing between essential criteria and camp-specific preferences.

  Breaking down the requirements: Essential ones should handle the classic problems in evolution. Sterile workers in eusocial insects pose a challenge because they don't reproduce but their traits are selected. A theory must explain this without resorting to group benefit alone. Meiotic drive is another key case where genes bias their transmission despite potential harm to the organism. Heritable symbionts like mitochondria or gut microbes passed vertically need to be accounted for, especially when they influence host fitness.

  The replicator vs. interactor distinction is crucial. Replicators pass on their structure, while interactors are entities that interact with the environment causing replication differences. A theory must maintain this to avoid confusion between what's selected versus what benefits. Selection of versus selection for is another important distinction to prevent conflating the entity being selected with the trait being favored.

  Population genetics constraints are non-negotiable. Any theory must align with established models like Price's equation, which mathematically describes selection and heritability. Contradicting these would invalidate the theory.

  The gut microbe example is interesting. If the microbe is reliably passed down and enhances host fitness, it could be seen as a unit of selection. But does it qualify as a replicator? If the microbe's genes are heritable and selected, then yes. This case tests whether vertical transmission without direct genetic integration counts. It probably strengthens the need for heritable variation as a requirement, showing that transmission mechanisms matter.

  Now, identifying camp-specific rules. The gene's-eye view insists replicators are the only units, dismissing higher levels as vehicles. Group selection supporters might require higher-level heritability. Multi-level selection combines both but needs clear criteria for level assignment. The user asked which requirements are non-negotiable versus house rules. Essentials include handling key cases, maintaining distinctions, and aligning with population genetics. House rules are more about what entities are primary or how levels are defined.

  The tricky part is the trade-off between formal unity and explanatory scope. A theory could be formally elegant but miss real-world complexity, or be flexible but lose predictive power. This tension is inherent in the debate, and the user should highlight it in class.

  Also, the gut microbe example might challenge strict genetic inheritance views, pushing for broader heritability criteria. It shows that transmission fidelity is key, regardless of mechanism. This supports including heritable variation as essential.

  In summary, the requirements list must cover problem cases, conceptual distinctions, and mathematical consistency. The gut microbe case emphasizes the importance of transmission and heritability, reinforcing that necessity. Non-negotiables are the cases, distinctions, and population genetics, while house rules involve the primacy of certain units or level definitions. The trade-off between unity and scope is the pair that's hard to satisfy simultaneously.
answer: |-
  Here's a specification for an adequate "Units of Selection" (UoS) theory, breaking down requirements, cases, distinctions, constraints, and the gut microbe verdict:

  **Core Requirements for an Adequate UoS Theory:**

  1.  **Must Explain Adaptation:** *Why?* The core problem Darwinism solves. Any UoS theory must ultimately account for the appearance of design in nature (e.g., vertebrate eye, wing mimicry in butterflies). *Non-negotiable.*
  2.  **Requires Heritable Variation in Fitness:** *Why?* This is the *sine qua non* of evolution by natural selection. The theory must identify entities *with* heritable variation that *causes* differences in survival/reproduction. *Non-negotiable.* (Population Genetics Constraint: Fundamental Theorem).
  3.  **Must Resolve the "Beneficiary" Problem:** *Why?* Answer "For whose benefit is the adaptation?" (Sterile worker bees, parental care, warning coloration). It must explain how traits benefiting entities *other than the reproducing individual* evolve without resorting to "good of the species". *Non-negotiable.* (Key Case: Sterile Workers).
  4.  **Must Handle Intra-Genomic Conflict:** *Why?* Not all genetic elements within an organism share the same evolutionary interests. The theory must explain adaptations that benefit a genetic element at the expense of the organism or other genes. *Non-negotiable.* (Key Case: Meiotic Drive).
  5.  **Must Accommodate Non-Genomic Inheritance & Symbiosis:** *Why?* Evolution acts on heritable information, regardless of the molecular basis or location. The theory must explain adaptations arising from vertically transmitted elements *outside* the nuclear genome or even outside the organism. *Non-negotiable.* (Key Case: Heritable Symbiont).
  6.  **Must Distinguish Replicator vs. Interactor:** *Why?* To avoid fatal confusion. Replicators (e.g., genes, cultural memes) are entities copied with high fidelity across generations. Interactors (e.g., organisms, groups) are cohesive entities whose interaction with the environment *causes* differential replication of replicators. A UoS theory must clarify which role(s) it assigns to its proposed unit. *Non-negotiable Conceptual Distinction.* (Hull/Dawkins Distinction).
  7.  **Must Distinguish Selection *of* vs. Selection *for*:** *Why?* Selection *of* an entity (e.g., a group) occurs when it has properties causing it to be differentially replicated. Selection *for* a property (e.g., altruism) occurs when that property is the cause of the differential replication. A UoS theory must be able to articulate this difference to avoid misattribution. *Non-negotiable Conceptual Distinction.* (Sober Distinction).
  8.  **Must Cohere with Formal Population Genetics Models:** *Why?* UoS theories are *interpretations* of the mathematical machinery of evolution. They cannot contradict proven results. Must be compatible with the Price Equation (partitioning selection and transmission) and models of selection at different levels (e.g., contextual analysis, kin selection models). *Non-negotiable Constraint.*

  **The Gut Microbe Verdict & Its Implications:**
  *   **Is it a Unit of Selection?** **Yes, potentially a Replicator.** The microbe possesses heritable variation (different strains). Its fitness (transmission to next host generation) *varies* based on its trait (producing the life-extending compound). Hosts "smearing" effectively act as a reliable transmission mechanism. Selection acts *on* the microbe variant *for* the compound-producing trait, which increases *its* transmission success via the host's increased egg-laying/survival. It's analogous to a beneficial vertically transmitted symbiont like *Buchnera* in aphids.
  *   **Impact on Requirements:** This case **strengthens Requirement 5 (Non-Genomic Inheritance & Symbiosis)** and underscores **Requirement 2 (Heritable Variation in Fitness)**. It shows UoS cannot be defined solely by being "in the germline" (host nuclear genes) but by having a reliable transmission pathway and heritable variation affecting that transmission. It also highlights the **Replicator/Interactor Distinction (Requirement 6)**: The microbe *gene* (or microbe strain) is the likely replicator; the microbe *cell* or the host-microbe *holobiont* could be interactors.

  **Camp-Specific "House Rules" vs. Non-Negotiables:**

  *   **Non-Negotiable (Essential for ANY Adequate Theory):**
      *   Requirements 1-8 listed above.
      *   Specifically: Explaining adaptation via heritable variation in fitness, resolving the beneficiary problem (sterile workers), handling conflict (meiotic drive), accommodating symbionts, maintaining replicator/interactor and of/for distinctions, cohering with population genetics.
  *   **Gene's-Eye View Camp House Rules:**
      *   *Replicators (specifically genes/alleles) are the ONLY true units of selection.* Interactors are mere "vehicles".
      *   *Requires all adaptations to be interpretable as strategies of selfish replicators.* (May struggle conceptually with holobionts or multi-level interactors).
      *   *Focuses exclusively on genetic inheritance.* (Minimizes Requirement 5).
  *   **Group/Multi-Level Selection Camp House Rules:**
      *   *Higher-level interactors (groups) can be genuine units of selection under specific conditions.* Requires explicit criteria for "group" cohesion and heritability.
      *   *Focuses on partitioning selection across levels using formal tools like the Price Equation.* (Often emphasizes Requirement 8).
      *   *May be more readily accepting of non-genomic inheritance for higher-level units.*
  *   **Multi-Level Selection Theory (MLS) Specific House Rules:**
      *   *Strict distinction between MLS1 (selection on groups affecting individual fitness/replication) and MLS2 (selection on groups where groups *themselves* reproduce/die).* (This distinction itself is a camp-specific framing).
      *   *Requires clear operational definitions for "levels" and criteria for when selection at a level is significant.*

  **The Likely Irreconcilable Pair:**

  You probably cannot simultaneously maximize **Formal Unity/Elegance** and **Explanatory Scope/Realism** without significant trade-offs.

  1.  **Formal Unity/Elegance:** A theory that reduces everything to a single, fundamental unit (like genes) or a single mathematical framework (like a highly abstracted Price Equation partitioning) gains elegance and predictive power *within its domain*. (Gene's-eye view, highly abstracted MLS).
  2.  **Explanatory Scope/Realism:** A theory that readily incorporates the messy complexity of real biological systems – multi-species symbioses, epigenetic inheritance, cultural evolution, complex group structures – gains scope and realism but often loses formal elegance and requires more context-dependent, case-by-case analysis. (Broad MLS, some "replicator" expansions, niche construction views).

  *   **The Tension:** The gene's-eye view achieves remarkable unity by making genes the *only* replicator, but struggles to *directly* conceptualize the evolution of group-level adaptations without translating them into individual gene strategies. Broad MLS frameworks can readily describe selection acting on gut microbiomes or cultural groups, but defining the "units" and levels operationally becomes complex and context-dependent, losing some predictive elegance. This tension reflects the inherent complexity of biological evolution across diverse scales and inheritance systems.

  This specification provides the rigorous foundation you need to fairly evaluate the contenders in your session. Good luck!
