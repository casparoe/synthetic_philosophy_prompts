  **Exam Question (for students):**

  **Final Exam Essay Question**

  Consider a setting with a set of situations \(s\). There is a true objective \(U(s)\) (e.g., long-run welfare). We have a cheaply observable feature vector \(\phi(s)\). A proxy \(P(s)\) is defined as the conditional expectation of \(U\) given \(\phi(s)\) on a baseline distribution \(D_0\) of situations, i.e., \(P(s) = \mathbb{E}[U \mid \phi(s)]\) under \(D_0\). This implies that on \(D_0\), the proxy is *calibrated*: for any value \(x\) that \(P(s)\) takes, the average of \(U(s)\) over situations with \(P(s)=x\) is \(x\).

  Now, we deploy an agent to find a situation \(s\) that maximizes \(P(s)\). The agent can search arbitrarily and is not constrained to \(D_0\).

  Answer the following:

  (a) (5 marks) Construct a simple example (e.g., with two distinct situations or two distinct feature vectors) where, despite \(P\) being calibrated on \(D_0\), the agent maximizing \(P\) causes \(U\) to be lower than in the original distribution. Then, explain what is misleading about the claim that "P is calibrated" as a guarantee against such failures.

  (b) (5 marks) Suppose we try to fix the problem by retraining the proxy: after the agent shifts the distribution to a new distribution \(D_1\) (by maximizing \(P\)), we retrain \(P\) on \(D_1\) to be \(P_1(s) = \mathbb{E}[U \mid \phi(s)]\) under \(D_1\). Then we let the agent maximize \(P_1\), and so on. Construct an example where this iterative retraining process leads to worse and worse \(U\) (at least for some steps). Explain why retraining fails in this case. Also, briefly state under what conditions retraining might help.

  (c) (5 marks) We wish to distinguish between two types of failures: 
    (i) *Specification error*: the proxy does not capture the true objective even at baseline (i.e., on \(D_0\)).
    (ii) *Goodhart failure*: even with a well-specified proxy (as good as it can be given the features), maximizing the proxy leads to a drop in \(U\).

  Modify the original setup to produce:
    (i) An example of specification error: the proxy is poorly specified at baseline (so it doesn't track \(U\) even on \(D_0\)) and maximizing it causes a drop in \(U\).
    (ii) An example of Goodhart failure: the proxy is as well-specified as possible given the features (so on \(D_0\), it is the best possible predictor of \(U\) given \(\phi(s)\)) but maximizing it still causes a drop in \(U\).

  What does the contrast between (i) and (ii) show about the advice to "just write a better specification"?

  (d) (5 marks) What would it mean for a proxy \(P\) to be "optimization-robust"? Is it possible to design such a proxy in general? Discuss the trade-off between having a proxy that is informative about \(U\) (at baseline) and one that remains a good target under optimization.

  ---

  **Model Answer:**

  (a) Consider a baseline distribution \(D_0\) with two situations: \(s_1\) and \(s_2\), both with the same feature vector \(\phi(s_1)=\phi(s_2)=1\). Let \(U(s_1)=0\) and \(U(s_2)=2\). Under \(D_0\), both situations are equally likely. The proxy \(P(s) = \mathbb{E}[U \mid \phi(s)=1] = (0+2)/2 = 1\). Hence, both \(s_1\) and \(s_2\) have \(P(s)=1\). This proxy is calibrated on \(D_0\) because the average \(U\) for \(P=1\) is \((0+2)/2=1\). Now, the agent is tasked to maximize \(P\). Since both situations have \(P(s)=1\), the agent is indifferent. If the agent chooses \(s_1\), then \(U=0\), which is below the baseline average of 1. 

  The phrase "P is calibrated" is misleading because calibration is a property that holds over a distribution (here, \(D_0\)) and only guarantees that conditional on the proxy value, the average \(U\) equals that value. It does not guarantee that for individual situations the proxy is accurate. When we optimize, we select a specific situation, and if there is variation in \(U\) given \(\phi\) (and hence given \(P\)), we might select a situation with low \(U\) despite a high (or moderate) \(P\).

  (b) Consider a setting where the feature \(\phi\) is a real number and the true objective is \(U=10 - (\phi-5)^2\), which has a maximum of 10 at \(\phi=5\). The baseline distribution \(D_0\) consists of \(\phi\) values uniformly in [0,4]. In \(D_0\), the maximum \(\phi\) is 4, with \(U=10-(4-5)^2=9\). We fit a linear regression on \(D_0\) to get \(P(s)\). Due to the data in [0,4], \(P(s)\) will be increasing in \(\phi\), and the maximum in the training range is at \(\phi=4\) with \(U=9\). The agent maximizes \(P\) and chooses \(\phi=4\), achieving \(U=9\). 

  Now, we retrain on the new distribution \(D_1\) which contains only \(\phi=4\) and \(U=9\). Fitting a new proxy \(P_1\) on \(D_1\), if we use linear regression, we have only one data point and the model might predict \(P_1(\phi)=9\) for all \(\phi\) (or a constant). The agent then maximizes \(P_1\) and, being indifferent, might choose \(\phi=100\). Then \(U=10-(100-5)^2=10-9025=-9015\), which is much worse.

  Retraining fails in this case because the new distribution \(D_1\) is very narrow (only \(\phi=4\)) and does not represent the true relationship between \(\phi\) and \(U\). The retrained proxy \(P_1\) becomes overly optimistic in regions far from the training data. Retraining might help if the agent's actions produce a diverse set of situations that cover the feature space and reveal the true relationship, but it fails when the agent's actions are restricted to a narrow region and the proxy cannot generalize correctly.

  (c) (i) Specification error example: Suppose in \(D_0\), we have two situations: \(s_1\) (\(\phi=1, U=0\)) and \(s_2\) (\(\phi=2, U=1\)). The proxy is \(P(s_1)=0\) and \(P(s_2)=1\), which is calibrated. However, assume there is an unobserved feature: actually, \(s_1\) could have been of two types, but we only observe the one with \(U=0\). In reality, there exists another situation \(s_3\) with \(\phi=1\) and \(U=100\), but it does not appear in \(D_0\). The agent maximizes \(P\) and chooses \(s_2\) with \(U=1\), missing \(s_3\). This is a specification error because the feature \(\phi\) is insufficient to capture the variation in \(U\); the proxy does not reflect the potential for high \(U\) at \(\phi=1\).

  (ii) Goodhart failure example: Use the example from (a): two situations with \(\phi=1\): \(s_1\) (\(U=0\)) and \(s_2\) (\(U=2\)). The proxy is \(P(s)=1\) for both, which is the best possible given \(\phi\) because it is the conditional expectation. Maximizing \(P\) might lead to \(s_1\) and \(U=0\), a drop from the baseline average of 1.

  The contrast shows that "just write a better specification" can fix specification errors by adding more features (so that in (i), we might distinguish the two types of \(\phi=1\)). However, it cannot fix Goodhart failures. In (ii), even with the best specification, there is residual variation in \(U\) given \(\phi\), and optimization can select a low-U outcome. Hence, the advice is insufficient for preventing all types of failures.

  (d) A proxy \(P\) is optimization-robust if maximizing \(P\) leads to high \(U\) even under strong optimization (i.e., when the agent can shift the distribution arbitrarily). However, it is generally not achievable. There is a trade-off between informativeness and robustness. 

  - Informativeness: On the baseline distribution \(D_0\), \(P\) should have high predictive accuracy for \(U\). This requires that \(P\) varies with features that correlate with \(U\).
  - Robustness: Under optimization, \(P\) should remain aligned with \(U\) even in regions far from \(D_0\).

  Achieving both is difficult. If \(P\) is very informative on \(D_0\), it might rely on features that are not causally related to \(U\), leading to breakdowns under optimization. Conversely, if we make \(P\) constant to avoid Goodhart, it becomes uninformative. 

  The trade-off arises because optimization can push the system into regions where the training data is sparse or non-existent, and the learned proxy may not generalize correctly. Therefore, we must balance these competing goals.

  (Word count: approx. 800)
answer: |-
  ### Exam Question: Goodhart's Law and Proxy Failures

  **Instructions:**  
  Answer all parts of the question. Use the provided setup and construct your own examples. No external citations are needed. Clarity, precision, and logical reasoning are valued. Total: 20 marks.

  **Setup:**  
  Consider a space of situations \(s\). There is a true objective \(U(s)\) (e.g., long-run welfare) and a cheaply observable feature vector \(\phi(s)\). A proxy \(P(s)\) is trained via regression on a baseline distribution \(D_0\):  
  \[
  P(s) = \mathbb{E}[U \mid \phi(s)] \quad \text{(under \(D_0\))}.
  \]  
  By construction, \(P\) is **calibrated** on \(D_0\): For any \(x\), if \(P(s) = x\) on average over \(D_0\), then \(U(s) = x\) on average. An agent is then tasked with finding an \(s\) that maximizes \(P(s)\). The agent can search arbitrarily (beyond \(D_0\)).

  **Questions:**  
  (a) **Distributional Dependence of Calibration** (5 marks)  
  Construct a minimal example (e.g., two situations or two feature-vector groups) where:  
  - \(P\) is calibrated on \(D_0\),  
  - The agent maximizes \(P\),  
  - \(U\) decreases compared to the average \(U\) under \(D_0\).  
  Explain why the phrase "\(P\) is calibrated" is misleading as a guarantee against this failure. Precisely state what calibration does and does not ensure.  

  (b) **Iterative Retraining Failure** (5 marks)  
  Suppose we retrain \(P\) iteratively: after the agent shifts the distribution to \(D_1\) (by maximizing \(P\)), we retrain \(P_1(s) = \mathbb{E}[U \mid \phi(s)]\) under \(D_1\), then let the agent maximize \(P_1\), and repeat.  
  Construct an example where this process worsens \(U\) over iterations. Explain why retraining fails here. Briefly state when retraining might help versus when it becomes a "treadmill."  

  (c) **Specification Error vs. Goodhart Failure** (5 marks)  
  Modify the setup to demonstrate two distinct failures:  
  (i) **Specification error**: The proxy is poorly specified *on \(D_0\)* (it does not track \(U\) even before optimization), and maximizing it causes \(U\) to drop.  
  (ii) **Goodhart failure**: The proxy is as well-specified as possible given \(\phi\) (i.e., the best predictor of \(U\) on \(D_0\)), but maximizing it still causes \(U\) to drop.  
  Explain what this contrast reveals about the advice to "just write a better specification."  

  (d) **Optimization-Robust Proxies** (5 marks)  
  Define what it means for \(P\) to be "optimization-robust." Is this achievable in general? Discuss the tradeoff between:  
  - \(P\) being **informative** about \(U\) on \(D_0\),  
  - \(P\) being **invariant** under optimization (i.e., maximizing it reliably increases \(U\)).  
  Commit to a stance on whether this tradeoff is inevitable.  

  ---

  ### Model Answer (≈750 words)  
  **(a) Calibration’s Distributional Dependence**  
  Consider two situations in \(D_0\), both with identical feature vectors \(\phi(s) = A\):  
  - \(s_1\): \(U(s_1) = 0\) (probability 90%),  
  - \(s_2\): \(U(s_2) = 2\) (probability 10%).  
  The proxy is \(P(s) = \mathbb{E}[U \mid \phi(s){=}A] = (0 \times 0.9) + (2 \times 0.1) = 0.2\) for both. This is calibrated: when \(P(s) = 0.2\), the average \(U = 0.2\) over \(D_0\). The agent maximizes \(P\) but is indifferent (both \(s_1\) and \(s_2\) have \(P(s) = 0.2\)). If it chooses \(s_1\), \(U = 0\)—below \(D_0\)’s average \(U\) of 0.2.  

  Calibration is a **joint-distributional property** under \(D_0\). It ensures that *on average*, for a fixed \(P(s)\), \(U\) matches \(P\) *over the distribution*. It does **not** guarantee that for an *individual* \(s\), \(P(s) \approx U(s)\). Optimization selects specific \(s\), exploiting within-feature variation in \(U\), making calibration irrelevant post-selection.  

  **(b) Iterative Retraining as a Treadmill**  
  Extend (a): Let \(\phi\) have values \(A\) and \(B\). In \(D_0\):  
  - Group \(\phi=A\): 90% \(U=0\), 10% \(U=2\) → \(P(A) = 0.2\),  
  - Group \(\phi=B\): 50% \(U=1\), 50% \(U=3\) → \(P(B) = 2.0\).  
  Agent maximizes \(P\), chooses \(\phi=B\), and (e.g.) lands at \(s_3\) with \(U=1\). Now retrain on \(D_1 = \{s_3\}\):  
  - \(\phi=B\): Only \(U=1\) observed → \(P_1(B) = 1.0\),  
  - \(\phi=A\): No data → assume \(P_1(A) = 0\) (or pessimistic default).  
  Agent now maximizes \(P_1\): \(\phi=B\) gives \(P_1=1.0\), but if it can choose *within* \(B\), it might pick \(s_4\) with \(U=1\) again (no improvement). Worse, if \(P_1(A)=0\), the agent avoids \(A\) entirely, missing potentially high-\(U\) options in \(A\) (e.g., \(U=2\)). Iteration stabilizes at low \(U\).  

  Retraining fails here because the proxy **adapts to the agent’s choices**, not \(U\). Since the agent selects \(s\) with high \(P\) but potentially low \(U\), retraining chases the agent’s behavior (equilibrium effects), not truth. Retraining *helps* only if the agent’s actions reveal new information about \(U\) (e.g., exploring diverse \(\phi\) regions). Otherwise, it becomes a treadmill where the proxy “learns” distorted outcomes.  

  **(c) Specification Error vs. Goodhart Failure**  
  (i) **Specification error**: Modify \(D_0\) to include only low-\(U\) instances for \(\phi=A\):  
  - \(s_1\): \(\phi=A\), \(U=0\) (100% of \(A\) in \(D_0\)),  
  - \(s_2\): \(\phi=B\), \(U=2\).  
  Thus, \(P(A) = 0\), \(P(B) = 2\). Calibrated, but proxy is *wrong*: Unobserved \(s_3\) with \(\phi=A\), \(U=100\) exists. Agent maximizes \(P\), chooses \(s_2\), \(U=2\), missing \(s_3\). Failure: Poor specification due to incomplete features/data.  

  (ii) **Goodhart failure**: Use (a)’s setup:  
  - \(s_1\): \(\phi=A\), \(U=0\) (90%),  
  - \(s_2\): \(\phi=A\), \(U=2\) (10%).  
  \(P(s) = 0.2\) for both, the best possible predictor given \(\phi\). Agent maximizes \(P\), may choose \(s_1\), \(U=0\)—a drop from \(D_0\)’s avg \(U=0.2\). Failure: Even with optimal specification, within-\(\phi\) variation causes Goodhart.  

  The contrast shows “just write a better spec” **fixes specification errors** (e.g., add features to distinguish \(s_1\) and \(s_3\) in (i)) but **cannot fix Goodhart failures**. In (ii), \(\phi\) is insufficient to eliminate variation; optimization *inevitably* risks overfitting to \(P\). Goodhart is a structural problem of optimizing a proxy with residual uncertainty.  

  **(d) Optimization-Robust Proxies**  
  A proxy is **optimization-robust** if maximizing \(P\) reliably increases \(U\) under arbitrary search. This requires:  
  1. \(P(s) \approx U(s)\) *everywhere*, not just on \(D_0\),  
  2. No “false peaks” where high \(P\) corresponds to low \(U\).  

  This is **unachievable in general**. Consider:  
  - **Informativeness**: To predict \(U\) well on \(D_0\), \(P\) must vary with \(\phi\), capturing correlations.  
  - **Invariance under optimization**: To avoid Goodhart, \(P\) must align with \(U\) *under distributional shifts*, requiring causal/structural ties.  

  **Tradeoff**:  
  - A constant \(P\) (e.g., \(P(s) = c\)) is invariant (optimization does nothing) but uninformative.  
  - An informative \(P\) (e.g., \(P(s) = \mathbb{E}[U \mid \phi(s)]\)) exploits correlations that may break during optimization (e.g., if \(\phi\) is non-causal).  

  In real-world tasks, proxies rely on correlates of \(U\) (e.g., test scores as proxies for skill). Optimization often severs these links (e.g., teaching to the test). Thus, **the tradeoff is inevitable**: High informativeness requires sensitivity to features, which optimization can exploit. Perfection demands \(P(s) = U(s)\) universally—impossible without omniscience. We must accept bounded robustness.  

