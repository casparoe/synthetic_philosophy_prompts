  **Marking Scheme (20 marks total)**

  (a) (5 marks)
  - Must-hit moves:
    - Construct an example with at least two situations (1 mark) that have the same feature vector (or two feature vectors but with variation within a group) (1 mark).
    - Show that the agent can choose a situation with low U despite high P (or in the case of same P, choose a low U) (1 mark).
    - Explain that calibration is a property of the joint distribution (D0) and does not hold under selection/optimization (1 mark).
    - Clearly state that calibration does not guarantee individual-level accuracy (1 mark).
  - Common fluff: Only repeating the phrase about measures and targets without constructing an example, or constructing an example where U does not drop.

  (b) (5 marks)
  - Must-hit moves:
    - Construct an example where iterative retraining leads to worse U (2 marks). The example must show at least two steps of retraining and a drop in U in one of the steps.
    - Explain that retraining on the new distribution (which is produced by the agent) can cause the proxy to adapt to the agent's behavior rather than correcting towards U (1 mark). (Reflexive metric problem)
    - State that retraining might help if the new distribution covers more of the space and improves the proxy's generalization, but it fails when the agent's actions are not representative of the true U (1 mark).
    - Mention that retraining can become a treadmill if the agent keeps chasing a moving target (1 mark).
  - Common fluff: Suggesting retraining without recognizing the equilibrium issue, or providing an example that doesn't show degradation.

  (c) (5 marks)
  - Must-hit moves:
    - For (i): Provide an example of specification error where the proxy does not track U at baseline (e.g., due to missing features) (1 mark).
    - For (ii): Provide an example of Goodhart failure where the proxy is the best possible given the features (on D0) but optimization still drops U (1 mark).
    - Clearly state that (i) is due to an incorrect/inadequate specification while (ii) is due to the unavoidable residual variation (1 mark).
    - Conclude that "just write a better spec" can fix (i) but not (ii) (1 mark), and therefore the advice is insufficient (1 mark).
  - Common fluff: Not distinguishing between the two types of failures, or providing an example for (ii) that is actually a specification error.

  (d) (5 marks)
  - Must-hit moves:
    - Define optimization-robustness: maximizing P should lead to high U even under strong optimization (1 mark).
    - State that achieving this in general is difficult or impossible (1 mark).
    - Articulate the trade-off: between having a proxy that is informative (low prediction error on baseline) and one that is invariant under optimization (2 marks).
    - Commit to a view: e.g., that there is a fundamental trade-off (1 mark).
  - Common fluff: Suggesting that if we have a perfect proxy then it's robust, without acknowledging that we cannot have a perfect proxy in practice, or missing the trade-off.

