  We are designing an exam question that forces students to engage deeply with a toy setup for understanding Goodhart's law and specification gaming. The setup involves a true objective U(s), a feature vector phi(s), and a proxy P(s) = E[U | phi(s)] trained on a baseline distribution D0. The proxy is calibrated on D0. The agent then maximizes P, leading to potential issues.

  The question has four parts:

  (a) Show that an optimizer maximizing P can drive U down even when P is calibrated on D0. Then explain what's wrong with the phrase "P is calibrated". The key is that calibration is a property of the joint distribution (on D0) and doesn't hold under optimization. Students must construct their own two-state or two-feature example.

  (b) Consider iteratively retraining P on the new distribution. Provide a case where this makes things worse and explain why. The issue is that retraining may chase the agent's behavior rather than correcting towards U. They should also say when retraining helps.

  (c) Separate specification gaming from Goodhart: 
     (i) Modify the setup so the failure is a specification error (the proxy doesn't track U at baseline).
     (ii) Modify so the specification is as good as possible but the failure is still Goodhartian.
     Then, discuss what this shows about "just write a better spec".

  (d) What would it take for P to be optimization-robust? Is this achievable? State the tradeoff between being informative and invariant under optimization.

  We now write the exam question and then the model answer and marking scheme.

  Exam Question:

  **Final Exam Essay Question**

  Consider a setting with a set of situations \(s\). There is a true objective \(U(s)\) (e.g., long-run welfare). We have a cheaply observable feature vector \(\phi(s)\). A proxy \(P(s)\) is defined as the conditional expectation of \(U\) given \(\phi(s)\) on a baseline distribution \(D_0\) of situations, i.e., \(P(s) = \mathbb{E}[U \mid \phi(s)]\) under \(D_0\). This implies that on \(D_0\), the proxy is *calibrated*: for any value \(x\) that \(P(s)\) takes, the average of \(U(s)\) over situations with \(P(s)=x\) is \(x\). 

  Now, we deploy an agent to find a situation \(s\) that maximizes \(P(s)\). The agent can search arbitrarily and is not constrained to \(D_0\). 

  Answer the following:

  (a) (5 marks) Construct a simple example (e.g., with two distinct situations or two distinct feature vectors) where, despite \(P\) being calibrated on \(D_0\), the agent maximizing \(P\) causes \(U\) to be lower than in the original distribution. Then, explain what is misleading about the claim that "P is calibrated" as a guarantee against such failures.

  (b) (5 marks) Suppose we try to fix the problem by retraining the proxy: after the agent shifts the distribution to a new distribution \(D_1\) (by maximizing \(P\)), we retrain \(P\) on \(D_1\) to be \(P_1(s) = \mathbb{E}[U \mid \phi(s)]\) under \(D_1\). Then we let the agent maximize \(P_1\), and so on. Construct an example where this iterative retraining process leads to worse and worse \(U\) (at least for some steps). Explain why retraining fails in this case. Also, briefly state under what conditions retraining might help.

  (c) (5 marks) We wish to distinguish between two types of failures: (i) *specification error*: the proxy does not capture the true objective even at baseline (i.e., on \(D_0\)); (ii) *Goodhart failure*: even with a well-specified proxy (as good as it can be given the features), maximizing the proxy leads to a drop in \(U\).

  Modify the original setup to produce:
    (i) An example of specification error: the proxy is poorly specified at baseline (so it doesn't track \(U\) even on \(D_0\)) and maximizing it causes a drop in \(U\).
    (ii) An example of Goodhart failure: the proxy is as well-specified as possible given the features (so on \(D_0\), it is the best possible predictor of \(U\) given \(\phi(s)\)) but maximizing it still causes a drop in \(U\).

  What does the contrast between (i) and (ii) show about the advice to "just write a better specification"?

  (d) (5 marks) What would it mean for a proxy \(P\) to be "optimization-robust"? Is it possible to design such a proxy in general? Discuss the trade-off between having a proxy that is informative about \(U\) (at baseline) and one that remains a good target under optimization.

