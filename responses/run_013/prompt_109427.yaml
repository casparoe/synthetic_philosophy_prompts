  ### Marking Scheme (20 marks total)  
  **General Notes**:  
  - **A-grade (16–20)**: Clear examples, precise reasoning, and correct terminology. Explicitly identifies "must-hit moves."  
  - **B-grade (10–15)**: Examples or reasoning partially flawed. Misses key insights or conflates concepts.  
  - **C/D-grade (0–9)**: Major errors, no original examples, or misunderstanding setup.  

  **(a) Distributional Dependence of Calibration (5 marks)**  
  - **Must-hit moves**:  
    - (1 mark) Constructs example with identical \(\phi\) but differing \(U\).  
    - (1 mark) Shows agent selects low-\(U\) \(s\) despite calibration.  
    - (1 mark) States calibration is a property of the joint distribution \((U, P)\) on \(D_0\).  
    - (1 mark) Explains calibration does not ensure \(P(s) \approx U(s)\) for individual \(s\).  
    - (1 mark) Concludes optimization breaks calibration guarantees.  
  - **Common fluff**: Claims "calibration means \(P\) is perfect" or uses pre-memorized examples without construction.  

  **(b) Iterative Retraining Failure (5 marks)**  
  - **Must-hit moves**:  
    - (2 marks) Example where retraining worsens \(U\) (e.g., proxy chases agent’s suboptimal choices).  
    - (1 mark) Identifies retraining fails due to *reflexivity* (proxy adapts to agent’s actions, not \(U\)).  
    - (1 mark) States retraining helps only if agent’s exploration improves data diversity/coverage.  
    - (1 mark) Notes retraining becomes a "treadmill" when agent’s behavior distorts the data.  
  - **Common fluff**: Assumes retraining always helps or confuses with distributional shift without reflexivity.  

  **(c) Specification Error vs. Goodhart Failure (5 marks)**  
  - **Must-hit moves**:  
    - (1 mark) (i) Specification error: Proxy misestimates \(U\) on \(D_0\) (e.g., due to missing features).  
    - (1 mark) (ii) Goodhart failure: Proxy is optimal given \(\phi\) but fails due to within-\(\phi\) variation.  
    - (1 mark) Contrast: Specification errors are fixable with better features/data; Goodhart failures are not.  
    - (1 mark) Conclusion: "Better spec" fixes (i) but not (ii), so advice is insufficient for Goodhart.  
    - (1 mark) Explicitly ties (ii) to residual uncertainty in \(U \mid \phi\).  
  - **Common fluff**: Conflates (i) and (ii) (e.g., calls both "Goodhart") or omits baseline performance.  

  **(d) Optimization-Robust Proxies (5 marks)**  
  - **Must-hit moves**:  
    - (1 mark) Defines optimization-robustness (max \(P\) → max \(U\) under search).  
    - (1 mark) States it is unachievable in general (without omniscience).  
    - (2 marks) Articulates tradeoff: Informativeness (sensitive to \(\phi\)) vs. invariance (stable under optimization).  
    - (1 mark) Commits to a stance (e.g., tradeoff is inevitable; robustness requires sacrificing informativeness).  
  - **Common fluff**: Assumes perfect proxies exist or omits tradeoff.
