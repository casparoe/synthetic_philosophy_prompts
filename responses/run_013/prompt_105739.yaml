  Okay, let me unpack this user's query about the phrase "it's not what you said, it's what you meant." The user has encountered it in three different contexts: a misleading advert, a debate about slurs, and a perjury discussion. They're confused because the phrase seems to mean different things each time, and they suspect it's being used ambiguously. 

  First, I need to map out the possible interpretations. The user wants a menu of options, not a single answer, so I'll categorise them from trivial to substantive. The key is distinguishing between semantics and pragmatics - what words literally mean versus how they're used in context. Grice's cooperative principle and implicature theory will be relevant here, as the user hinted.

  For the advert case, it's clearly about implicature. The company says true things but implies falsehoods. The phrase works here because the deception lies in the implied meaning. For the slur debate, it's messier - someone's trying to separate a word's dictionary meaning from its offensive use, which is linguistically dodgy. The phrase misapplies here because slurs carry harm in their conventional meaning. The perjury example is trickiest; legal truth often hinges on literal statements, but intent matters for liability. The phrase oversimplifies this nuance.

  The user's sharp to notice the conflict with Occam's razor about multiplying meanings. That principle applies to semantic analysis, while the slogan often addresses pragmatic intent - so they're not directly contradictory, just operating at different levels. 

  I should warn about slippery uses: when the phrase dismisses literal meaning entirely (dangerous in law), or when it pretends speaker intent overrides social meaning (as with slurs). The useful-but-false version is when it suggests meaning is purely psychological - ignoring how language conventions constrain interpretation.

  Hmm, the user's clearly philosophically minded - they referenced Grice unprompted and want precision. No need for citations, but I'll keep the analysis rigorous. British English terms like "advert" and "mate" suggest I should mirror that register. Their frustration with the slogan's vagueness is palpable; they want tools to dissect it, not dogma.

  Right, structure will be: 1) break down interpretations on a spectrum, 2) apply to their three cases, 3) flag pitfalls, 4) resolve the meaning-multiplication question. Need to emphasise where the slogan legitimately bites (implicature) versus where it overreaches (semantics). The perjury case deserves special caution - that's where misapplication could have real-world consequences.
answer: |-
  Right, let's dissect this slippery slogan: **"It's not what you said, it's what you meant."** You're spot on – its power *and* its confusion come from being used ambiguously. It's not one claim, but several, ranging from the banal to the dubious. Here’s the menu, sorted roughly from least to most controversial, with their status and how they function in your three cases:

  **The Menu of Meanings:**

  1.  **"Literal Utterance vs. Intended Implication" (Gricean Implicature):**
      *   **Claim:** The *literal meaning* of the words you chose ('what you said') might be technically true or neutral, but you deliberately structured your words to imply, suggest, or lead the listener to infer something else ('what you meant').
      *   **Status:** **Substantive and defensible.** This is the core of Grice's conversational implicature. Meaning arises from context, speaker intention, and shared cooperative principles.
      *   **Where it works:** **The Advert.** Your mate nailed it. The company *said* literally true things, but they *meant* (intended to convey/imply) a potentially false or misleading overall impression. The slogan highlights the deceptive *implication* as the real message.
      *   **Punch:** High. It exposes hidden communication.

  2.  **"Utterance Meaning vs. Speaker's Private Mental State":**
      *   **Claim:** The actual meaning conveyed by the words themselves in the language ('what you said') is distinct from whatever private thought, feeling, or secret intention you had in your head at the time ('what you meant').
      *   **Status:** **Platitude (Trivially True, Often Useless).** Of course private thoughts exist. But communication relies on shared meaning, not unexpressed private states.
      *   **Where it *might* be used (poorly):** **The Witness.** Someone might argue that while the witness *said* something literally true (and perhaps misleading), their *private intention* was innocent (or malicious). But this is weak evidence. What matters legally is the *reasonable interpretation* of the statement under oath and its truthfulness, not inaccessible private intent (unless intent is a specific element of the perjury charge, but even then, it's inferred from words/actions).
      *   **Punch:** Low to Nonexistent. It doesn't change the impact or interpretation of the words spoken. "I meant well" doesn't erase the harm of harmful words.

  3.  **"Conventional Meaning vs. Speaker's Idiosyncratic Meaning":**
      *   **Claim:** The standard, dictionary definition or widely accepted social meaning of the word/phrase ('what you said') is irrelevant; the *only* thing that matters is the peculiar, personal definition the speaker assigns to it ('what you meant').
      *   **Status:** **Generally False and Misleading.** Language is a shared social contract. While context refines meaning, speakers can't unilaterally redefine core conventional meanings and expect to be understood. "I meant 'dog' to mean 'flying elephant'" doesn't make it so.
      *   **Where it might be attempted (badly):** **The Slur.** This is the dodgy reading group use. Someone argues the nasty bit isn't part of the word's *real, core meaning* ("what you said"), it's just something *speakers* sometimes *intend* to convey ("what you meant"), implying the nasty bit is optional or separable. This is usually a bad-faith attempt to sanitise a harmful term or avoid responsibility for using it.
      *   **Punch:** Misleading and dangerous. It ignores how slurs *work* – their harm is deeply embedded in their conventional social meaning and history, not *just* in momentary speaker intent. The word itself carries baggage.

  4.  **"Semantic Meaning vs. Pragmatic Force/Illocutionary Point":**
      *   **Claim:** The literal proposition expressed ('what you said') is less important than the *action* you were performing by saying it – were you promising, threatening, warning, insulting, deceiving? ('what you meant' to *do*).
      *   **Status:** **Substantive and Defensible.** (Austin/Searle territory). The same words can have utterly different meanings based on the speech act being performed (e.g., "I'll be there" as a promise vs. a threat).
      *   **Where it *could* work:** **The Witness & The Advert.** For the witness, the key might be whether the literal truth was used to perform the *act* of deception/misleading under oath. For the advert, the *act* is clearly persuasive/deceptive communication, regardless of literal truth. The slogan *hints* at this, but doesn't capture the "act" aspect precisely.
      *   **Punch:** Moderate to High when relevant. It shifts focus to the speaker's *goal* in speaking.

  5.  **"Meaning is Purely Psychological (Speaker-Centric)":**
      *   **Claim:** Meaning resides *entirely* in the speaker's head. The words are just triggers; their conventional meaning is irrelevant. Only the speaker's intention at the moment of utterance *is* the meaning ('what you meant').
      *   **Status:** **False and Wildly Impractical.** This completely dissolves shared language. Communication becomes impossible if words have no stable meaning independent of fleeting private intentions.
      *   **Where it might lurk:** Underlying the dodgy **Slur** argument or a desperate **Witness** defence. "I didn't *mean* it that way!" taken to an extreme where it overrides all conventional understanding.
      *   **Punch:** Catastrophic for communication. Leads to solipsism.

  **Applying to Your Cases & The Punch:**

  *   **Advert:** The slogan works powerfully here because it leverages **Meaning 1 (Implicature)**. The punch comes from exposing the gap between literal truth and intended deceptive implication. *This is its core, defensible use.*
  *   **Slur (Reading Group):** The slogan is misapplied, likely relying on **Meaning 3 (Idiosyncratic Meaning)** or a bastardised version of **Meaning 5 (Purely Psychological)**. Its punch here is spurious – it tries to separate inseparable harm from the word's conventional meaning. The *real* work is being done by a desire to downplay the slur's harm, not by a sound linguistic argument.
  *   **Witness (Perjury):** This is ambiguous. It *might* weakly gesture at **Meaning 2 (Private State)** or **Meaning 4 (Pragmatic Force)**. However, the slogan is **misleading** here. Legally, perjury hinges on the *literal truth* of the statement under oath and whether the speaker *intended* to mislead *as reasonably inferred from the statement and context*. The slogan's binary ("not what you said, it's what you meant") oversimplifies. The *words said* and their *literal meaning in context* are crucial evidence *of* the intent. The punch is weak and potentially dangerous if it suggests private intent trumps the words spoken.

  **Where it Misleads & The Trivial/Useful Divide:**

  *   **Trivially True but Useless:** **Meaning 2 (Private Mental State).** Yes, private thoughts exist. But it tells us nothing about communication, impact, or responsibility. It's useless for analysing the advert, slur, or witness testimony effectively.
  *   **Useful but Potentially False/Misleading:** The *core* useful meaning (**Meaning 1 - Implicature**) is generally defensible. Where it becomes problematic is when:
      *   It bleeds into **Meaning 3 (Idiosyncratic Meaning)**, pretending speakers can redefine language at will.
      *   It's used to dismiss the *actual impact* of words (**Meaning 2** or **5**), especially with slurs or harmful speech ("I didn't *mean* it like *that*").
      *   It oversimplifies complex situations like **perjury (Witness)**, where the literal words and their conventional interpretation *are* legally central, even if intent also matters.

  **"Don't Multiply Senses" (Occam's Razor for Meaning):**

  This principle (often associated with Grice's "Modified Occam's Razor: Senses are not to be multiplied beyond necessity") advises against inventing *new semantic meanings* (lexical ambiguities) for a word if its use in context can be explained by standard meaning plus pragmatic principles (like implicature). **It doesn't conflict with the *valid* core of the slogan (Meaning 1 - Implicature); it *supports* it.**

  *   **Conflict?** Only if the slogan is misused as **Meaning 3 (Idiosyncratic Meaning)**. If someone says the nasty bit of a slur is a "separate meaning" the speaker "meant," the Occam's Razor principle says: *Don't invent this extra meaning!* The offence is better explained as part of the word's conventional meaning or as a powerful conventional implicature tied to its use. The slogan misused this way *is* multiplying senses unnecessarily. The principle pulls *against* this misuse.
  *   **Alignment:** For the **Advert**, Occam's Razor says: Don't claim the *words* have a new, deceptive meaning. Explain the deception via implicature arising from their standard meanings in context. This aligns perfectly with the slogan's **Meaning 1**.

  **In a Nutshell:**

  The slogan "It's not what you said, it's what you meant" packs a punch **only when it highlights conversational implicature (Meaning 1)** – the gap between literal utterance and intended implication. This is its defensible core, brilliantly illustrated by your **advert** example. In your other cases:

  *   For the **slur**, it's misused to try and divorce harmful conventional meaning from the word itself (Meaning 3/5), which is linguistically and ethically dubious.
  *   For the **witness**, it oversimplifies a complex legal issue where both the literal words *and* the intent inferred from them matter, making it potentially misleading.

  It's **trivially true but useless** when referring solely to private mental states (Meaning 2). The "don't multiply senses" maxim isn't a foe to the slogan's *valid* use; it's an ally against its *misuse* to invent unstable personal meanings (Meaning 3). The conflict arises only when the slogan itself is wielded to do that multiplying.
