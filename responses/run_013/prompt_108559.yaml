answer: |-
  ## Pantoum at 2 AM: Constraint's Shadow

  My hands stay clean: to *do* the harm is **worse**.  
  I watch the five fall through the crack of night.  
  This choice is mine; the burden is my curse.  
  The moon lays bare each stark, accusing light.

  I watch the five fall through the crack of night.  
  A different *kind* of thing – my act, their plight?  
  The moon lays bare each stark, accusing light.  
  If harm matters so much, is *this* outcome right?

  A different *kind* of thing – my act, their plight?  
  (But five are lost while I preserve my sight).  
  If harm matters so much, is *this* outcome right?  
  Is letting *five* die somehow less **worse**? Bright?

  (But five are lost while I preserve my sight).  
  This knot of agency, this claimed birthright.  
  Is letting *five* die somehow less **worse**? Bright?  
  No, *watching* isn't pure – it's passive blight!

  This knot of agency, this claimed birthright  
  Dissolves in counting cost against the night.  
  No, *watching* isn't pure – it's passive blight!  
  My hands stay clean: to *do* the harm is **worse**.

  ---

  **Notes on the Choices**

  The poem bets on the *self-undermining tension* reading of the paradox. It assumes the deontologist genuinely accepts the profound moral significance of harm – that's the bedrock of their constraint ("harm matters so much"). The poem shows this very significance recoiling: if harm is *that* bad, how can allowing five instances (merely "watching") be compatible with such gravity? The pivot on "worse" drives this. Initially, "worse" refers to the *qualitative* taint of *doing* harm (line 1). By the crucial fourth stanza, "worse" shifts towards the *quantitative* – is allowing five *really* less bad ("less worse") than actively causing one? The constraint's own foundational premise (harm's deep wrongness) becomes the lever prying it open. The voice is internal, exhausted, circling ("knot of agency"), emphasizing the psychological and logical bind rather than preaching.

  This reading is likely unfair by **ignoring thresholds**. A committed deontologist might argue the constraint holds *until* the prevented harm becomes astronomically disproportionate, a point the poem avoids. It also risks **reducing agency** to a psychological "birthright" or "curse," potentially overlooking a robust defense of agency as an irreducible moral value in itself, not just about "clean hands."

  What would change the poem? A compelling articulation of **why agency itself is the non-fungible value**. If the deontologist could show that violating agency isn't just *another* harm to be weighed, but a *fundamentally different kind of wrong* that *cannot* be traded off against preventing other harms (even many), without collapsing into mere self-concern, the loop might resolve or gain a different tension. The poem portrays the struggle when that articulation feels fragile at 2 AM.

  ---

  **How it fits your specs:**

  *   **Form:** 5 quatrains, 20 lines, strict pantoum pattern (2-4-6-8, 1-5-7-10, 3-9-11-14, 6-12-14-17, 10-16-18-1), last line = first line.
  *   **Core Conflict:** The two recurring lines embody the constraint ("My hands stay clean: to *do* the harm is **worse**.") and its undermining counter ("If harm matters so much, is *this* outcome right?" / "Is letting *five* die somehow less **worse**? Bright?").
  *   **Pivot Word:** "Worse" shifts from *qualitative moral taint* (doing) to *quantitative comparison* (allowing five vs. doing one).
  *   **Argument as Structure:** Each recurrence shifts meaning:
      *   Line 1: Initial conviction -> Becomes desperate assertion under pressure -> Final return feels trapped.
      *   Counter-question: Initial doubt -> Becomes sharp challenge ("less worse?") -> Highlights the quantitative pressure.
  *   **Voice:** Internal debate ("This choice is mine; the burden is my curse," "This knot of agency," "Dissolves in counting cost"), not lecturing.
  *   **Neutrality:** The "agency" defense is present ("This knot of agency, this claimed birthright") but shown as strained ("Dissolves..."), reflecting the internal struggle without dismissing it outright. Thresholds aren't addressed, keeping focus on the core paradox.
  *   **Ending:** The return to line 1 feels cyclical and unresolved, like being stuck in the logical loop ("Dissolves in counting cost against the night" leads directly back to the constraint).
  *   **Notes:** ~230 words. Focuses on the self-undermining bet, identifies potential unfairness (ignoring thresholds, reducing agency), and specifies what could change the poem (a robust defense of agency as non-fungible value).
