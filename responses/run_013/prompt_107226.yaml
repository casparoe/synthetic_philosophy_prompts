answer: |-
  ### Analysis of the Phenomenon

  Your description captures a nuanced linguistic strategy that operates at the **metapragmatic** level—it explicitly comments on *how* a speech act should be interpreted, rather than its propositional content. While no single established term perfectly matches your entire description, the phenomenon aligns most closely with **metacommunication** in pragmatics and discourse analysis, specifically a subtype I'll term **illocutionary framing**. Here’s a breakdown:

  1.  **Core Mechanism**: These utterances (e.g., "I'm only asking," "I say this with affection") function as **illocutionary force indicators** (or **metapragmatic directives**). They explicitly label the intended illocutionary force (e.g., question vs. accusation) or affective framing (e.g., affectionate vs. hostile) of the adjacent utterance.
  2.  **Sincerity Immunity**: You astutely note that sincerity is irrelevant to their *function*. They work performatively in the moment: uttering "I'm only asking" *constitutes* an attempt to frame the preceding/following utterance *as* a question, regardless of the speaker's true intent. This makes them distinct from reports or descriptions of internal states.
  3.  **Response Foreclosure**: Their primary effect is **discourse constraint**. By labeling the act, the speaker attempts to dictate the permissible range of responses. Challenging the framing ("But that *felt* accusatory!") is framed as a conversational transgression *by the hearer*, shifting accountability. This is key to why "hedges" feels inadequate – hedges (e.g., "sort of," "maybe") mitigate propositional content, while these frame the *act itself* to pre-empt specific reactions.
  4.  **Self-Defeating Potential**: The backfire effect ("I'm not judging" feels *more* judgmental) is often inherent. Explicitly denying an interpretation can ironically *activate* that interpretation (via negation's presupposition) or signal the speaker's awareness of its plausibility, making it salient. This is partly why sincerity doesn't matter – the utterance performs the framing *and* risks activating the very frame it denies.
  5.  **Forward/Backward Looking**: Both types ("I am only asking" / "I was only joking") are fundamentally the same phenomenon: **retrospective or prospective illocutionary framing**. The difference is temporal orientation relative to the core utterance, not functional essence. Both aim to control interpretation.
  6.  **Boundaries**:
      *   **"Honestly"**: Inside. It frames the utterance as sincere disclosure, attempting to pre-empt suspicion of deception ("Honestly, I didn't take it").
      *   **"With respect"**: Outside (or weak boundary). It's often a conventional politeness marker rather than a specific act-label. It *might* frame the utterance as non-hostile, but it lacks the explicit illocutionary labeling ("I say this *as a request*" vs. "with respect").
      *   **"I am not a racist, but..."**: Adjacent but distinct. The "but" signals a *contrastive disclaimer* anticipating potential *attribution* of bias to the speaker based on the upcoming content. It's about managing speaker *image* ("don't attribute this view to racism") rather than explicitly labeling the illocutionary force of the subsequent utterance ("this is an observation, not a slur"). It shares the pre-emptive defense mechanism but targets speaker ethos, not the act's force.

  **Label & Definition**: The best fit is **Illocutionary Framing**. This is *coined here* to capture the specific act of explicitly labeling the intended illocutionary force (question, joke, expression of affection) or affective framing (non-hostile, non-judgmental) of an adjacent utterance, thereby attempting to constrain its interpretation and foreclose certain responses, irrespective of the speaker's sincerity. Its core function is metapragmatic directive control over discourse uptake.

  **Confidence & Least Certain Claim**: Confidence in the core phenomenon and "illocutionary framing" as a descriptive label is high (0.9). The **least certain claim** concerns the *self-defeating effect*: "Is this part of the definition or a separate curiosity?" While frequent, it's not strictly definitional. The framing *can* succeed (e.g., "I say this gently..." genuinely softening criticism). The backfire often stems from contextual factors and negation's pragmatics. Claiming it as *essential* to the phenomenon (confidence ~0.7) is where certainty dips; it's a highly probable *consequence* or *risk*, not a defining feature.

