prompt: |-
  So I just got out of a two-hour argument with my friend about "real patterns" and I want the full spec before we go at it again. Her whole line is that a pattern is real just in case describing the data in terms of it is shorter than describing the data raw -- that's it, that's the criterion. And she thinks that settles everything downstream: beliefs and desires are real because a brain's behavior compresses nicely when you describe it that way, and physics is the same trick one level down, so the physical stance, the design stance and the intentional stance are all on a par, none of them more "basic" than the others. I don't buy it but I couldn't articulate why in the moment, so I want to lay out what a theory of this actually has to get right before I pick a side.

  Give me the desiderata. What does any adequate theory of real patterns / the stances have to deliver -- which cases it has to get right, which distinctions it can't collapse, which objections it has to survive -- with the case or consideration behind each one. In particular I want these handled:

  - The trivial-compression objection, which is the one I kept fumbling toward. If I can always just *name* the data ("the output of that RNG with seed 42", one symbol) and thereby "compress" any string, then her criterion makes every random string a real pattern, which can't be right. So the theory has to say what stops the criterion from being vacuous, or replace it with something that isn't.
  - The relativity-to-a-language / relativity-to-a-purpose worry. Short compared to what, in what vocabulary, for whom? If the answer is "relative to the description language" then does "real" quietly turn into "useful for our purposes", and if so is she ok with that?
  - Whether the three stances really come out equal. She wants the intentional stance to be exactly as real as the physical one. I suspect there's an asymmetry (you can in principle derive the intentional from the physical but not the other way, or the physical stance doesn't need us to take it while the intentional one does) and I want the theory to either license her egalitarianism or block it, not dodge it.
  - Real vs. useful. A pattern can be a great predictor and still a fiction, and something can be real without being useful to predict with. If the theory can't pull these apart, say so.
  - Degrees. She thinks some patterns are "more real" than others. I think that's incoherent. Someone's right -- tell me which and why.
  - Projectibility. A rule that compresses the past perfectly but flips its meaning at some future date -- is that a real pattern or not, and does the theory have to rule on it?
  - One-offs vs. repeatables, and lossy/approximate patterns: is a pattern that only holds roughly, or only ever happens once, still real?

  Then: mark which of these are genuine requirements and which are just prejudices of one camp, flag any pair you think can't be jointly satisfied (that's the part I most want), and tell me which single requirement does the most work in ruling out the popular positions. Skip the full scorecard of who scores what, I'll do that part myself.

  And be upfront about your own confidence here -- say which consideration would actually change your mind about any of this, or flip which requirement you think is load-bearing, and where in your reasoning you'd bet you're most likely to be wrong.
reasoning: |-
  Okay, let me start by unpacking the user's query. They just had a heated debate with their friend about what constitutes a "real pattern," specifically using the compression criterion. Their friend argues that a pattern is real if describing data with it is shorter than the raw data. This leads to several philosophical issues: trivial compression, language relativity, the equality of stances, real vs. useful patterns, degrees of reality, projectibility, and one-offs vs. repeatables.

  First, I need to address each of these points systematically. The user wants desiderata for an adequate theory, highlighting which are essential and which might be conflicting. They also want to know where the theory might fail and which requirement is most critical.

  Starting with the trivial-compression objection. The friend's criterion could allow naming a random string as a pattern, making it vacuous. Any theory must prevent this. Kolmogorov complexity comes to mind, but it's uncomputable and language-dependent. The theory needs to specify a non-arbitrary language or add constraints like predictive power.

  Next, relativity to language or purpose. If compression is language-relative, does "real" become "useful"? The user is concerned about objectivity. The theory must either anchor the language in something non-arbitrary (like physics) or accept antirealism. This ties into the stances' equality. If physics is fundamental, deriving other stances from it creates asymmetry. The user suspects this, so the theory needs to clarify if reduction is possible.

  Real vs. useful is another key point. A useful predictor might be fictional (like epicycles), while real patterns might not be practical. The theory must distinguish descriptive accuracy from utility. Degrees of reality—can patterns be "more real"? If reality is binary, degrees might refer to robustness or compressibility strength. The theory should specify what degrees mean or reject them.

  Projectibility deals with whether a pattern must predict the future. If a rule compresses past data but fails later, is it real? The theory needs to handle time and counterfactuals. One-offs and lossy patterns challenge repeatability and exactness. Can a unique event have a real pattern? The theory must accommodate approximate or singular patterns without overreaching.

  Now, identifying conflicts. Objectivity vs. language relativity is a big one. If the description language is arbitrary, objectivity is hard to maintain. Also, projectibility vs. one-offs: if patterns must predict, singular events can't have real patterns. And reductionism vs. stance egalitarianism—if physics is fundamental, stances aren't equal.

  The user's deeper needs seem to be a solid framework to counter their friend's points, especially trivial compression and stance equality. They might also want clarity on whether patterns are mind-dependent or objective. Confidence-wise, I think the trivial compression point is crucial. If the theory can't handle that, it fails. But I'm less sure about projectibility; maybe patterns don't need to be predictive if they're explanatory. Also, the language relativity problem might be insurmountable for a fully objective theory.
answer: |-
  Here are the core desiderata for any adequate theory of "real patterns" and the stances, structured to address your specific concerns. I've marked genuine requirements (🔹), potential tensions (⚠️), and where I suspect your intuitions might clash with your friend's. Requirements are **bolded**, with cases/considerations and necessity justifications.

  ---

  ### **Desiderata & Requirements**
  1. **🔹 Non-Vacuous Compression**  
     - **Requirement:** *Must block trivial "compression" via arbitrary naming (e.g., "RNG seed 42" for random data).*  
     - **Case:** A true random string (maximal Kolmogorov complexity) cannot be a "real pattern" under any theory.  
     - **Why necessary:** Without this, the criterion is vacuously true for *any* dataset, rendering "real pattern" meaningless.  
     - **Theory must:** Specify constraints (e.g., compression must use *non-ad-hoc* descriptions, require predictive power, or ground in objective complexity measures).  

  2. **⚠️ Language/Purpose Relativity**  
     - **Requirement:** *Must clarify the status of description languages (e.g., physics vs. folk psychology).*  
     - **Case:** Describing planetary motion as "epicycles" compresses data in Ptolemaic astronomy but not in Newtonian mechanics.  
     - **Why critical:** If compression is language-relative, "real" collapses into "useful for language *L*". Your friend may embrace this ("useful = real"), but you likely demand objectivity.  
     - **Theory must:** Either (a) anchor language in something non-arbitrary (e.g., fundamental physics, optimal predictors), or (b) explicitly accept antirealism about patterns.  

  3. **🔹 Asymmetry of Stances**  
     - **Requirement:** *Must resolve whether the physical stance is metaphysically privileged.*  
     - **Case:** Brains obey physics; beliefs don't cause neurons to violate thermodynamics. Physics *implements* intentionality, not vice versa.  
     - **Why necessary:** If the intentional stance is "as real" as physics, but physics explains *how* intentionality emerges, egalitarianism may ignore ontological dependence.  
     - **Theory must:** Either show how stances are *non-hierarchical* (e.g., via multiple realizability), or admit physics as the grounding layer.  

  4. **🔹 Reality vs. Predictive Utility**  
     - **Requirement:** *Must distinguish "real" from "merely useful fiction".*  
     - **Case:** Newtonian gravity compresses data better than General Relativity for most engineering tasks, but GR is more fundamentally accurate.  
     - **Why necessary:** Useful falsehoods (e.g., "the Sun rises") exist. A theory equating utility with reality cannot separate epistemology from metaphysics.  
     - **Theory must:** Provide criteria beyond compressibility (e.g., counterfactual robustness, causal efficacy).  

  5. **⚠️ Degrees of Reality**  
     - **Requirement:** *Must define what "more real" means if patterns admit degrees.*  
     - **Case:** A fractal has high compressibility; white noise has none. But is "reality" a scalar or binary?  
     - **Tension:** Your friend sees compressibility strength as degrees of reality. You likely see reality as all-or-nothing (e.g., atoms exist, Santa doesn’t).  
     - **Theory must:** Specify if degrees track *robustness* (stable under perturbation), *scope* (applies to many systems), or are eliminable.  

  6. **🔹 Projectibility**  
     - **Requirement:** *Must handle patterns that fail unexpectedly (e.g., "grue" emeralds).*  
     - **Case:** A rule compressing all past data but failing tomorrow (e.g., "stock prices always rise in January" until 2029 crash).  
     - **Why necessary:** Non-projectible "patterns" are accidental, not real. Compression alone can’t distinguish law-like regularity from flukes.  
     - **Theory must:** Incorporate time/counterfactuals (e.g., a real pattern must hold under interventions or across possible worlds).  

  7. **⚠️ One-Offs & Approximation**  
     - **Requirement:** *Must accommodate unique events and fuzzy patterns.*  
     - **Case:** The Big Bang (one-off) or "Mount Everest is tall" (vague but real).  
     - **Tension:** Compression favors repeatables; reality may not. Is a lossy JPEG of a cat a "real pattern" of the cat?  
     - **Theory must:** Allow for *approximate* patterns without overpermissiveness (e.g., via error tolerance thresholds).  

  ---

  ### **Conflicts & Load-Bearing Requirements**
  - **⚠️ Key Tensions:**  
    - **Objectivity vs. Relativity (Req 2 vs. Req 1/3/4):** If language is arbitrary (Req 2), non-vacuous compression (Req 1) and stance asymmetry (Req 3) become hard to defend.  
    - **Projectibility vs. One-Offs (Req 6 vs. Req 7):** Projectibility demands future stability; one-offs defy it.  
    - **Binary Reality vs. Degrees (Req 4 vs. Req 5):** If patterns can be "fictions" (Req 4), degrees of reality (Req 5) risk conflating reality with strength of evidence.  

  - **🔹 Most Load-Bearing Requirement: Non-Vacuous Compression (Req 1).**  
    Why? It forces the theory to address **computational sincerity** – compression must reflect *intrinsic structure*, not linguistic tricks. Fail here, and the theory dies by triviality.  

  - **Genuine Requirements:** 1, 3, 4, 6 (address non-negotiable philosophical pitfalls).  
  - **Prejudices/Disputable:** 2 (relativity), 5 (degrees), 7 (one-offs) – these hinge on prior commitments (e.g., realism vs. pragmatism).  

  ---

  ### **My Confidence & Weak Spots**
  - **Highest Confidence:** Req 1 (non-vacuous compression) is non-negotiable. Any theory allowing "RNG seed 42" as compression is dead on arrival.  
  - **Lowest Confidence:** Whether **projectibility (Req 6) is essential**. *What would change my mind?* If shown that *all* patterns are inherently time-bound (e.g., "real" just means "compressively useful *so far*"), I’d demote Req 6.  
  - **Biggest Bet:** That **Req 4 (reality ≠ utility) must be preserved**. If your friend embraces pragmatism ("useful *is* real"), this requirement dissolves – but I suspect you’d reject that as sophistry.  
  - **Where I’m Likely Wrong:** On **stance asymmetry (Req 3)**. If multiple realizability proves intentional states *cannot* be reduced to physics (e.g., via hard emergence), egalitarianism could hold. I’m skeptical but open.  

  **Next step for you:** Test your friend’s view against Req 1 (trivial compression) and Req 4 (epicycles vs. gravity). If she bites the bullet on relativity ("useful-for-purpose is all that matters"), you’re at a meta-impasse. If not, push where her constraints fail Req 6 (projectibility) or Req 3 (asymmetry).
