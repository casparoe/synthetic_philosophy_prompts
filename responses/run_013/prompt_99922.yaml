answer: |-
  ## The Meaning Moot: Intention vs. Convention

  **Characters:**
  *   **Aris:** Advocates an intention-based account of speaker meaning.
  *   **Kira:** Advocates a practice-based account of speaker meaning.

  **Setting:** A sunlit university courtyard, two stone benches facing each other.

  **(Aris and Kira are finishing their coffees, the remnants of a broader discussion about communication hanging in the air.)**

  **Aris:** ...and that’s precisely why I maintain that meaning, *speaker meaning*, resides fundamentally in the speaker's complex intention. Mira *means* that the bridge is out because she utters "The bridge is out" *intending* to get her hearer to believe it *by means of* that hearer recognizing her intention to do so. The core machinery is her communicative aim.

  **Kira:** (Shakes her head slowly) Aris, you build your castle on shifting sand. Mira’s elaborate internal architecture is irrelevant if it doesn't connect to the bedrock of shared practice. What anchors her words to the world is the communal regularity of use for "The bridge is out." Her private intentions float free unless they latch onto that public framework. Meaning isn't conjured in the mind; it’s sedimented in use.

  **Aris:** Let’s test your bedrock then. Consider Mira again. She says "The bridge is out," intending precisely what I described: that her hearer *recognizes* her intention to inform him and thereby comes to believe the bridge is out. Crucially, however, she *knows* this particular hearer is under a post-hypnotic suggestion to believe anything she says, regardless of her intention. And indeed, he *does* believe the bridge is out, but solely because of the hypnosis, utterly oblivious to her intention. According to your practice-based view, since the words are used conventionally to report bridge status, and he gets the conventional meaning, surely Mira meant that the bridge is out? The practice did its work.

  **Kira:** (Leans forward, eyes sharp) An excellent case to expose the flaw in pure intention. No, Aris, Mira *fails* to mean it in the relevant communicative sense. The meaning-effect occurred, yes, but *in spite* of the mechanism she intended, not *because* of it. Her utterance *happened to* convey the information via a brute causal chain she exploited, not via the recognition of her intention, which was entirely bypassed. The communal meaning of the sentence was activated, but *her* act of meaning – her trying to *communicate* – misfired spectacularly. The practice delivered the content, but *she* didn't successfully deploy it *as communication* because the intended route was severed. She caused belief, but not via meaning.

  **Aris:** Severed? Nonsense! Her *intention* was precisely the full Gricean intention: to produce belief via recognition. The fact that the belief was *also* caused by hypnosis is irrelevant surplus. The hypnosis is like a redundant safety net; the *primary* structure of her meaning is defined by her intention. She aimed for recognition, and recognition *could* have worked – the hypnosis doesn't negate that the words *are* conventionally associated with that meaning. What matters is what she *tried* to do with the convention, the complex state of mind guiding her utterance. She meant it.

  **Kira:** But the hypnosis *does* negate the efficacy of the recognition route! It renders it inert. You’re clinging to a counterfactual: "Recognition *could* have worked." But in the *actual* scenario, it *didn't*. Meaning is an act performed *in the world*, not just a blueprint in the head. If the intended mechanism is entirely circumvented, the act of meaning isn’t completed. The public meaning exists, but her attempt to wield it communicatively failed. Now, try this: imagine a visitor to a remote community. Unaware of local customs, he makes a gesture – say, a specific hand movement – intending to convey agreement ("yes") by getting his host to recognize that very intention. Unbeknownst to him, that exact gesture *is* the local conventional sign for "yes." The host, seeing the gesture, knows the convention and takes it as "yes," completely unaware of the visitor's internal intention. Did the visitor *mean* "yes"?

  **Aris:** (Smiles slightly) Ah, the mirror image. Yes, of course he meant "yes"! His intention was precisely to convey "yes" by means of recognition of that intention. His ignorance of the local convention is incidental. He hit upon the correct sign by luck, guided solely by his communicative intention. The convention merely provided the vehicle his intention latched onto. The *meaning* sprang from his mind; the convention was the fortunate channel. The host understood "yes," and crucially, the visitor *intended* that understanding to come via recognition – which, in this case, it arguably did, because the convention *is* a mechanism for recognizing intention in that community, even if he didn't know it! The convention *embodies* the recognition rule.

  **Kira:** No, Aris, you’re confusing cause and effect. The host understood "yes" *only* because of the conventional meaning of the gesture. The visitor's private intention played *no role whatsoever* in fixing what the gesture meant *on that occasion*. He might as well have sneezed! The meaning was fixed entirely by the communal practice. The host responded to the public sign, not to the visitor's hidden mental state. The visitor *hoped* to mean "yes," but he lacked the necessary connection to the practice that gives the gesture its significance. He produced a sign that *happened* to mean "yes," but without understanding or intending *that sign* to mean "yes" *by convention*. He didn't wield the practice; he stumbled over it. He caused the host to grasp "yes," but he didn't *mean* it in the way a competent member of the community would. His intention was floating, unmoored.

  **Aris:** But Kira, how does the convention *itself* come to have meaning? Doesn't it ultimately rest on the shared intentions of the community to use that gesture *with* the intention of being understood? The visitor, in his intention, accidentally replicated the very intentional structure that *grounds* the convention! He fulfilled the core condition: he intended a response via recognition. The convention is a scaffold built from repeated individual acts of meaning like the one he performed, even if imperfectly. His intention *was* the meaning-generating spark; the convention was the pre-existing kindling it ignited.

  **Kira:** You put the cart before the horse. The convention *enables* and *constrains* individual intention. The visitor’s intention only *could* latch onto "yes" because the community had already established that linkage through persistent, regular use. Without that pre-existing public framework, his gesture would have been meaningless noise, regardless of how elaborate his internal intention was. His intention only became potentially meaningful *because* it accidentally aligned with the practice. The meaning resides in the practice itself; individual intentions merely participate in it, competently or incompetently. In this case, incompetently. He produced the sign, but he didn't engage in the practice *as* a practice. He didn't mean "yes"; the gesture, by convention, *said* "yes."

  **Aris:** And Mira's words *said* "the bridge is out" by convention, yet you deny she *meant* it communicatively because her intention-recognition mechanism was bypassed. In the gesture case, the convention *was* the recognition mechanism, and the visitor *had* the core intention. Why deny *him* meaning?

  **Kira:** Because Mira *knew* her mechanism was bypassed and exploited a different causal path; she failed to engage communicatively *despite* knowing the convention. The visitor *lacked* the knowledge of the convention that constitutes the recognition mechanism; he gestured blindly. Both, crucially, are deficient in the *public, rule-governed deployment* of the sign. Mira circumvented the rule; the visitor was ignorant of it. Meaning, as a public act, requires aligning intention *with* practice, not just having an intention *or* activating a practice accidentally or parasitically.

  **Aris:** The alignment you seek *is* the complex intention! Mira intended to use the conventional meaning properly (via recognition) but knew it wouldn't work that way. The visitor intended the response via recognition and, by luck, used the conventional vehicle for it. Their intentions *define* the alignment or misalignment. The practice is inert without the animating force of intention.

  **Kira:** And intention is uninterpretable, chaotic, without the structuring force of practice. The visitor's intention could have been to mean *anything* – agreement, dismissal, a request for salt. Only the convention fixed it as "yes." Mira's intention, divorced from the proper functioning of the convention in that moment, failed to constitute communicative meaning. The practice provides the necessary, objective framework. Intention alone is too private, too fallible.

  **(A pause. They look at each other, the courtyard silent except for distant birdsong.)**

  **Aris:** So, it seems we are at an impasse. For you, meaning is a public dance, and stepping out of rhythm or stepping in blindly means you aren't truly dancing, even if the music plays. For me, meaning is the dancer's purposeful movement; the steps matter only as the chosen expression of that purpose. Mira danced with purpose but on a broken floor; the visitor stumbled into the right steps by accident, guided by his purpose.

  **Kira:** Precisely. The dance *is* the pattern, the shared form. Purposeful movement only *becomes* the dance when it inhabits the form intentionally and competently. Mira broke the form knowingly; the visitor lacked knowledge of the form. Neither fully inhabited the practice. The meaning lies in the pattern itself, not solely in the individual’s mental state about it.

  **Aris:** And for me, the pattern is only meaningful because individuals invest it with purpose, repeatedly and reliably. Without that animating intention – complex, recursive intention – there is no meaning, only noise. Mira’s noise was shaped by her intention; the visitor’s noise accidentally matched the shape of meaning.

  **Kira:** Then we remain on opposite shores, Aris. The chasm between the private spark and the public structure seems unbridgeable by these cases.

  **Aris:** (Nods slowly) Indeed, Kira. The foundations remain stubbornly distinct. Intention or practice? The question echoes. Shall we get more coffee?

  **Kira:** (A small smile) Yes. Though I suspect we’ll mean it differently.

  **(They gather their cups, the philosophical tension unresolved, lingering in the space between them.)**
