  ## PROSPECTUS: HORIZON BASTION - SECURING HUMANITY'S HIGHEST POTENTIAL

  **Introducing Horizon Bastion:** The first permanently inhabited, self-sustaining habitat in the Proxima Centauri system. More than a settlement, Bastion is the vital safeguard for humanity’s astronomical future – a future where trillions of potential lives hang in the balance. We offer Residency Shares and Founder's Trust Units (FTUs) to visionary individuals and institutions committed to securing this vast potential value.

  **The Imperative:** Calculations by Horizon Dynamics' Future Potentiality Institute conservatively estimate that a single successful interstellar civilization branch unlocks future value exceeding 10^36 potential life-years. Delaying or compromising the *first* successful, value-stable colony forfeits value dwarfing all present Earth-bound concerns by factors beyond comprehension. Bastion isn't just desirable; it is the paramount moral and strategic project of our era. Its constitution *must* be settled *now* to ensure the foundational values guiding this future are optimal and irrevocably locked in.

  **The Opportunity:**
  *   **Residency Shares (RS):** Grant the right to immigrate to Bastion (subject to stringent physiological and psychological vetting, Clause 4b) and perpetual residency for the purchaser and designated lineal descendants. Limited to 10,000 Primary Shares.
  *   **Founder's Trust Units (FTUs):** For investors prioritizing impact over physical relocation. FTUs represent a perpetual stake in the Bastion Posterity Fund (BPF), channeling resources toward Bastion’s expansion and the seeding of future ethical off-world civilizations. Unlimited issuance (Phase 1).

  **Governance & The Bastion Compact:** Bastion operates under the irrevocable **Bastion Compact**, meticulously designed pre-launch by our Founders' Council of leading ethicists, decision theorists, and long-term strategists. This ensures stability and alignment with the core values necessary to maximize long-term potential. Governance utilizes a proven Stakeholder Weighted Decision Algorithm (SWDA), optimizing choices for maximal expected future value. Direct democracy is incompatible with safeguarding such vast stakes; stability is paramount (FAQ 3).

  **Key Features & Protections:**

  1.  **Universal Moral Accounting & Tiered Subject Registry (Clause 7):**
      *   Bastion implements the groundbreaking Horizon Moral Subject Framework (HMSF). All entities within Bastion jurisdiction are registered and assigned a Moral Weight Coefficient (MWC) based on rigorous, continuously updated assessment of cognitive capacity, sentience potential, and ecosystem function.
      *   MWC tiers (e.g., Baseline Human: 1.0, Advanced AGI: Variable 0.5-5.0, Non-Sapient Fauna: 0.001-0.1, Indigenous Microbiota: 0.000001) determine standing in dispute resolution, resource allocation, and compensation schedules for unavoidable burdens or accidents (Schedule 7.3). This ensures efficient, scalable, and equitable moral consideration proportional to capacity, preventing value-suboptimal resource drains.

  2.  **The Bastion Posterity Fund (BPF) & Intergenerational Offset Dividend (Clause 11):**
      *   A core innovation. A significant portion of Bastion's resource extraction and environmental management actions generate Planetary Impact Credits (PICs). These are *not* traditional pollution permits.
      *   PICs are deposited into the BPF. The Fund actuarially calculates the net present *moral* cost of any current environmental impact or resource depletion based on projected restoration timelines and MWC tiers affected.
      *   Crucially, this cost is then *divided* by the Fund’s actuarial projection of the total future moral patient population enabled by Bastion's existence and expansion (conservatively estimated at 10^25 beings over the stellar era). The resulting per-future-being cost is infinitesimal.
      *   FTU holders receive an annual Intergenerational Offset Dividend (IOD) representing their share of this net-positive moral accounting. Residency Shareholders contribute to this vast future benefit through their presence. Essentially, current localized impacts are morally offset by their necessity in unlocking near-infinite future value.

  3.  **Residency Transfer & Constitutional Revision (Clause 15 & Preamble):**
      *   Residency Shares are transferable (with Founders' Council approval) but non-refundable. While the Bastion Compact guarantees certain fundamental rights, requests for significant constitutional amendment face a deliberately high bar.
      *   A formal Constitutional Review Petition requires endorsement by Shareholders representing 95% of outstanding RS votes (as weighted by the SWDA *and* factoring in projected descendant MWC) *plus* ratification by 80% of the Founders' Council.
      *   **Why this rigidity?** Precedent and game theory are clear: the founding values of the first successful colony are exponentially likely to become the template for all future expansion. Allowing easy amendment post-settlement introduces catastrophic instability risk and potential value drift. Consent to the Compact is given by purchasing a Share; the gravity of the astronomical stakes demands unwavering commitment to the pre-optimized framework. Flexibility now risks near-infinite forfeited value later.

  4.  **Planetary Stewardship & Biocompatibility Assurance (Clause 9):**
      *   Protecting Proxima Centauri b's native environment is a top operational priority – classified as a Tier-1 Planetary Asset.
      *   Our approach integrates cutting-edge terraforming containment tech with robust financial safeguards. Strict decontamination protocols (Schedule 9.1) minimize Forward Contamination Risk (FCR) and Back Contamination Liability (BCL).
      *   Horizon Bastion LLC carries the industry's first Astro-Ecological Impact Bond (AEIB), underwritten by Lloyds of Luna. This bond guarantees funding for:
          *   Remediation of any unintended biosphere alteration deemed to reduce the planet's potential to support future high-MWC life (a "Biosphere Devaluation Event").
          *   Liability coverage for Earth-origin stakeholders in the statistically improbable event of significant Back Contamination causing quantifiable damage on Earth (calculated using MWC tiers and Earth-side actuarial tables).
      *   Stewardship is thus ensured through a combination of technical excellence and comprehensive financial liability management, protecting both the asset and the venture.

  **Meet the Founders' Council:**
  *   **Dr. Aris Thorne (Chair):** Former Director, Institute for Long-Term Potential; pioneer in existential risk discounting models.
  *   **Elara Voss, JD, PhD:** Architect of the HMSF; author of "Moral Scalability in the Cosmos."
  *   **Kenji Tanaka:** Lead Systems Architect, Olympus Mons Vault Project; expert in irreversible system design.
  *   **Dr. Anya Petrova:** Chief Astro-Ecologist; former Planetary Protection Officer, Mars Development Authority.

  **Financial Instruments:**
  *   **Residency Share (RS):** Primary Offering Price: ₵25M (Ceresian Credits). Limited Availability.
  *   **Founder's Trust Unit (FTU):** Phase 1 Price: ₵250,000. Unlimited during Initial Offering Period. Tradable on the Off-World Securities Exchange (OWSE: HBTLPU).

  **FAQ:**
  1.  **Can I visit before committing?** Pre-migration visitation poses unacceptable contamination and security risks to the Tier-1 Planetary Asset. Our immersive VR prospectus suite provides comprehensive insight.
  2.  **What about family?** Primary RS holders can designate spouses/partners (subject to vetting) and all biological/legal descendants for automatic Residency Entitlement.
  3.  **Why no voting?** The SWDA incorporates the projected preferences and moral weights of *all* current and future stakeholders more accurately and fairly than any transient popular vote could. Democracy is valuable but not optimized for astronomical-stakes governance.
  4.  **Is there risk?** All pioneering ventures entail risk. However, Horizon Bastion represents the single action with the highest expected value for the future of moral patients in our light cone. The cost of inaction is mathematically incalculable and morally unconscionable.

  **Invest in Bastion. Secure the Future.**

  This document constitutes a Prospectus Summary. Full Terms, Conditions, Schedules, and Risk Disclosures are available upon accredited investor verification. Horizon Bastion LLC is incorporated in the Free Enterprise Zone, Ceres. Offering conducted under OWSE Regulation SP-1 (Stellar Prospectus).

  ---

  **Satirical Confidence Note:**

  1.  **Moral Subject Registration & Tiers (Clause 7):** High Confidence. Directly extrapolates from serious discussions in EA/rationalist circles about moral weights, sentience tiers, and scalable ethics (e.g., Harsanyi, Bostrom's "Superintelligence" value-loading problem, debates on insect suffering). The "efficiency" argument in allocating resources/compensation based on MWC is a natural, if unsettling, extension.
  2.  **Posterity Instrument & Intergenerational Offset (Clause 11):** High Confidence. This satirizes the core astronomical waste argument and the practice of "discounting" vast future lives against present costs. The concept of dividing a present harm by a near-infinite future population to render it negligible is a literal application of the expected value calculus often employed, particularly regarding existential risk mitigation or large-scale interventions. The financialization (PICs, IOD) is the satirical vehicle.
  3.  **Exit Clause & Irrevocable Constitution (Clause 15 & Preamble):** Very High Confidence. Directly targets the "value lock-in" concern and the argument that the first mover *must* get the values right because their influence is irreversible and pivotal for the astronomical future. The high amendment threshold and the dismissal of post-hoc consent (consent via purchase) reflect real anxieties about democratic processes leading to value drift away from "optimal" long-term frameworks. The "catastrophic instability risk" justification is verbatim from these discussions.
  4.  **Environment as Contamination Liability (Clause 9):** High Confidence. Extrapolates from real planetary protection protocols (like COSPAR) which are heavily framed in terms of contamination avoidance for scientific integrity and future use, often discussed alongside liability concerns. The Astro-Ecological Impact Bond satirizes the trend of using financial instruments (bonds, insurance) as primary tools for managing environmental risk and liability, shifting focus from intrinsic value to quantifiable risk and cost.

  **Least Confident Clause:** While the *concept* of **Moral Subject Tiers (Clause 7)** is firmly grounded, the specific implementation details (e.g., assigning microbes an MWC of 0.000001, using MWC directly in compensation schedules and constitutional amendment thresholds) edges closer to the boundary of extrapolation. While discussions involve differential moral weights and scalable systems, formalizing it into a corporate registry with direct financial/legal consequences based on such precise coefficients is an exaggeration of the *implementation* logic, though arguably not the underlying philosophical position that such distinctions must be made practically. The confidence is still high because the core idea of tiered moral consideration based on capacity is central, but the bureaucratic *application* is where the satire amplifies it beyond what's typically formally proposed.
