prompt: |-
  I lead a small interpretability team at an AI lab, and I have a recurring problem I'd like you to solve. We publish an internal report every two weeks, and in it engineers write sentences like "the model represents the user's intent to ask for medical advice," or "this SAE feature is the model's concept of a particular landmark," or "the model has a representation of the board position." These sentences get read by people making deployment decisions, and I've realized that none of us can say when one is warranted. Some of our claims rest on a linear probe decoding something from a hidden state; some on a feature that fires cleanly on the right examples; some on a steering vector that makes a behaviour more likely; some on activation patching that removes a behaviour. I have no philosophy background and I don't want a lecture. I want a procedure.

  Act as a philosopher of cognitive science who works closely with ML practitioners and knows the technical interpretability literature. Before writing the procedure, spend a short paragraph brainstorming: list the distinct things a person might mean by "the model represents F," and mark which of them are empirically decidable and which are not.

  Here is the conceptual material I want operationalized, since my team won't know the literature. I understand that at least three separate ideas get run together in these claims. (1) A state carries information about F in the ordinary correlational sense: it predicts F. (2) A state is used: downstream parts of the network read it, so intervening on it changes what the model does. (3) A state has F as its content, in the sense that F is what it is about, not merely what it correlates with. I have also been told there are rival views about (3): that content is fixed by the causal correlation having been stabilized by whatever shaped the system — evolution for brains, gradient descent for networks — together with downstream parts of the system being built to exploit that correlation; that content is fixed by nothing inside the system at all, and "represents" only marks what an interpreter is licensed to say; and that "represents" is a useful fiction that earns its keep only if it improves prediction or control. I don't need you to settle which view is right. I need you to tell me which of them a given piece of evidence could support, and to be explicit about where the choice among them changes the procedure.

  Write the procedure as an ordered list of steps a competent engineer with no philosophy training can run in an afternoon on a single claim. For each step give: the question to ask, what counts as a sufficient answer, what evidence fails the step, what the step is vulnerable to (probe capacity, label leakage, superposition, off-distribution steering, the interpreter's own assumptions), and whether it is a judgment call dressed up as a procedure. Say where the procedure stops with a definite no, and where it hands the claim off to a human. Include a control or null step for probes and for features. Then specify a ladder of claim strengths, at least three rungs, with the exact wording our engineers are permitted to write in the report at each rung, and the wording that is never licensed.

  Run it on three cases and show your work. (a) An SAE feature that fires on images and text mentioning a particular landmark; its top activations are clean, and a steering vector increases landmark-related output, but ablating it changes nothing on any task we care about. (b) A probe on a middle-layer hidden state that decodes "user is asking for medical advice" at 93% accuracy, where a probe of the same capacity trained on shuffled labels also does well, and patching the probed direction leaves refusal behaviour unchanged. (c) A probe we want to use to gate deployment because it supposedly detects the model concealing information: it is decodable, causally effective under patching, and trained on a small hand-labelled set. I expect the procedure to give an answer on (c) that my safety team will not like.

  Finally, state plainly what the procedure cannot do, and whether a team that adopted the interpreter-based view of content rather than the gradient-descent-and-consumer view would be running a different procedure or the same one.
reasoning: |-
  We are creating a procedure to evaluate claims of the form "the model represents F". The key is to operationalize the three aspects: information, use, and content. We'll break down the evaluation into steps that check for these aspects with evidence.

  Brainstorming: What might one mean by "the model represents F"?
  1. **Information-bearing**: The state correlates with F in the input or output. (Empirically decidable via probes, mutual information, etc.)
  2. **Functional role**: The state is used by the model in its computation for tasks involving F. (Empirically decidable via interventions like activation patching, ablation, steering.)
  3. **Content**: The state is about F, meaning that F is the intentional object of the representation. This is where philosophy comes in. Some views:
     a. Teleosemantic: Content is fixed by the evolutionary (or training) history and the consumer systems. (Not directly empirically decidable without knowing the training history and consumer functions, but we can approximate by checking if the representation was shaped by the training process and is used appropriately by downstream layers.)
     b. Interpretivist: Content is assigned by an interpreter and is licensed by the evidence. (Empirically decidable in the sense that we can check if the evidence supports the assignment, but it's a judgment call.)
     c. Instrumentalist: "Represents" is a useful fiction for prediction and control. (We can check if the representation helps in predicting model behavior or controlling it.)

  Note: (1) and (2) are empirically testable. (3) is more philosophical and may require additional assumptions.

  The procedure will focus on the empirically decidable aspects and then conditionally allow claims about content based on the evidence and the team's chosen philosophical stance.

  Procedure Outline:

  We design a step-by-step procedure that checks:
  - Step 1: Is there evidence of information? (Correlation)
  - Step 2: Is there evidence of use? (Causal role)
  - Step 3: Is there evidence that the representation is robust and not an artifact? (Control for confounders, probe capacity, etc.)
  - Step 4: Is there evidence that the representation is about F and not something else? (Content-specific tests)

  We'll then assign a claim strength based on the outcomes.

  Procedure Steps:

  **Step 1: Information Check**
  - Question: Does the state carry information about F? That is, can we predict F from the state?
  - Sufficient answer: A probe (linear or otherwise) trained on the state to predict F achieves accuracy significantly above chance and above a control (e.g., a probe of the same capacity on shuffled labels). Also, the information should be non-trivial (e.g., not just label leakage).
  - Evidence that fails: Probe accuracy is at chance, or the control probe (on shuffled labels) does similarly well (indicating overcapacity or data leakage). Also, if the probe is not generalizing (e.g., poor out-of-distribution performance) then it may be suspect.
  - Vulnerabilities: Probe capacity (a high-capacity probe can memorize), label leakage (if the labels are in the data by accident), superposition (if the representation is entangled), off-distribution (if the probe is tested only on a narrow set).
  - Judgment call? Mostly no, but setting the "significantly above" threshold might be.

  **Step 2: Use Check**
  - Question: Is the state used by the model in producing behavior relevant to F? 
  - Sufficient answer: Interventions on the state (ablation, patching, steering) change the model's behavior in a way that is specific to F. For example, ablating the state reduces performance on tasks involving F but not others, or steering the state in the direction of F changes the output to be more about F.
  - Evidence that fails: The intervention does not change the model's output in a way that is specific to F (e.g., ablating doesn't affect behavior, or affects everything). Also, if the intervention changes F-related behavior but also many unrelated ones, that might indicate lack of specificity.
  - Vulnerabilities: Off-distribution steering (steering might work only on examples unlike real data), non-specific effects (e.g., if ablating a feature causes the model to break completely), the intervention might not be clean (e.g., activation patching might alter multiple things).
  - Judgment call? Somewhat, in deciding what counts as "specific to F".

  **Step 3: Robustness and Control Checks**
  - Question: Is the representation robust and not an artifact of the measurement or a confounder?
  - Sufficient answer: 
    - For probes: The probe's performance holds up under cross-validation and on held-out data, and the control probe (on shuffled labels) does poorly. Also, the probe should be tested on a diverse set of examples (including out-of-distribution if possible) to ensure it's not picking up a confounder.
    - For features: The feature activates on a diverse set of inputs that are about F, and not on inputs that are about confounders. Also, the feature should be stable across similar models or training runs.
    - For causal interventions: The effect of the intervention should be specific to F and not due to a general disruption. Control interventions (e.g., on a random direction) should not have the same effect.
  - Evidence that fails: The probe or feature is sensitive to small changes in the data, or the control conditions show similar effects. Also, if the feature is polysemantic (fires on multiple unrelated concepts) then it might not be about F specifically.
  - Vulnerabilities: Confounders (e.g., the landmark feature might fire on any famous building, not the specific one), superposition, lack of diversity in test set.
  - Judgment call? Yes, especially in deciding what counts as a confounder.

  **Step 4: Content Check (conditional)**
  - Question: Is there evidence that the state is about F (content) and not just correlated with or causally related to F? This step depends on the philosophical stance. We'll provide two paths:
    - If the team adopts the teleosemantic view (gradient-descent-and-consumer): We require evidence that the representation was shaped by the training process to be about F and that downstream consumers use it appropriately. This might involve checking if the representation emerges during training and is used by the model in multiple contexts for F.
    - If the team adopts the interpretivist view: We require that the evidence from steps 1-3 is strong and consistent, and that there is no better alternative explanation. Then the claim is licensed by the evidence.
    - Instrumentalist: We skip this step because content is a fiction; we only care about prediction and control.

  However, since we don't want to force a philosophical stance, we can make this step about consistency and specificity.

  Alternative approach for Step 4 (without committing to a philosophy):
  - Question: Is there evidence that the representation is specific to F and not about a broader or different concept? And is there evidence that the model uses it in a way that is consistent with F being the content?
  - Sufficient answer: 
    - The representation is activated by F and not by near-misses or confounders (specificity).
    - The representation is used by the model in multiple ways that align with F (e.g., in different contexts, for different tasks).
    - There is no alternative explanation (e.g., it's not about G which is correlated with F).
  - Evidence that fails: The representation is activated by confounders, or the model's use of it is inconsistent (e.g., it uses it for something else entirely). Also, if there is a more parsimonious explanation for what the representation is about.
  - Vulnerabilities: The interpreter's assumptions (what counts as a confounder? what counts as consistent use?).
  - Judgment call? Yes.

  Given the complexity, we might fold the content check into the previous steps by requiring specificity in Steps 1-3.

  But note: The procedure should be practical. We'll structure it as:

  1. Information Check (with control)
  2. Use Check (with control)
  3. Robustness and Specificity Check (including control for confounders and alternative explanations)

  Then, we assign a claim strength.

  Ladder of claim strengths (three rungs):

  - **Weak**: There is evidence that the state carries information about F and that it is used in processing related to F, but the evidence is limited (e.g., without strong controls or specificity). 
    - Wording: "Preliminary evidence suggests the model may represent F."

  - **Medium**: The state carries robust information about F and is causally involved in F-related behavior, and there is evidence of specificity (it is not an artifact and not about a confounder). 
    - Wording: "Evidence indicates the model represents F."

  - **Strong**: The evidence for information, use, and specificity is strong and consistent, and there are no plausible alternative explanations. Additionally, the representation is shown to be about F in the intended sense (e.g., by showing generalization across contexts and alignment with the concept F).
    - Wording: "Strong evidence supports that the model has a representation of F."

  Never licensed: Absolute claims like "The model has a concept of F" (unless strong) or "F is represented" without qualification.

  Now, the procedure as a step-by-step list:

  **Procedure for Evaluating "The model represents F" Claims**

  **Step 0: Null Check for Probes and Features**
  - For probes: Train a control probe of the same capacity on shuffled labels. If the control probe performs similarly to the original probe, then the original probe's performance is not meaningful. This step must be passed to proceed.
  - For features: Check if the feature activates at a similar rate on random inputs or inputs that are unrelated to F. If it does, then the feature might be nonsensical. This step is passed if the feature does not activate on unrelated inputs.

  **Step 1: Information Check**
  - Question: Can we decode F from the state with above-chance accuracy, and is this accuracy significantly better than the control probe (for probes) or above a baseline (for features)?
  - What counts as sufficient: 
    - Probe: Accuracy, AUC, or other metric is statistically above chance (e.g., p<0.01) and at least X% above the control probe (e.g., 10% absolute difference). Also, the metric should be above a practical threshold (e.g., 70% if chance is 50%).
    - Feature: The feature activates significantly more on F-positive examples than on F-negative ones (e.g., t-test p<0.01, and effect size large).
  - Fails if: 
    - The probe/feature performance is at chance or not significantly better than the control.
    - There is evidence of label leakage (e.g., the labels are in the data by mistake) or the probe is overcapacity (memorizing without generalizing).
  - Vulnerabilities: Probe capacity, label leakage, superposition, off-distribution.
  - Judgment call? Setting the thresholds (e.g., what is "significantly") requires judgment, but the tests are objective.

  **Step 2: Use Check**
  - Question: Does intervening on the state change the model's behavior in a way that is specific to F?
  - What counts as sufficient: 
    - Ablation/activation patching: Ablating the state (setting to zero or mean) causes a significant drop in performance on F-related tasks but not on unrelated control tasks. The effect size should be substantial (e.g., >10% drop) and specific (control tasks show <5% change).
    - Steering: Adding a steering vector (e.g., in the direction of the probe) increases the probability of F-related outputs without causing a general degradation in performance or without affecting control outputs.
  - Fails if: 
    - The intervention has no effect, or the effect is not specific to F (e.g., it affects everything).
    - The intervention causes the model to break entirely (non-specific disruption).
  - Vulnerabilities: Off-distribution steering, non-specific effects.
  - Judgment call? Deciding what counts as "specific" and what control tasks to use.

  **Step 3: Robustness and Specificity Check**
  - Question: Is the representation robust and specific to F (not about a confounder or artifact)?
  - What counts as sufficient:
    - The representation (probe or feature) generalizes to held-out data and diverse examples (including near-misses and confounders). For example, the feature does not fire on inputs that are similar to F but not F (e.g., for a landmark, other landmarks or famous buildings that are not it).
    - The representation is not polysemantic (for features: it doesn't fire on multiple unrelated concepts).
    - The causal effect (from Step 2) is specific to F and not to a correlated concept G (tested by checking if the intervention affects G when F is absent).
  - Fails if:
    - The representation is activated by confounders or near-misses.
    - The representation is polysemantic.
    - The causal effect is not specific to F (e.g., it affects G as well).
  - Vulnerabilities: Confounders, lack of diverse test set, interpreter's assumptions about what counts as a confounder.
  - Judgment call? Yes, especially in defining near-misses and confounders.

  **Step 4: Claim Strength Assignment**
  - If the claim fails Step 0, 1, or 2: Do not make any claim. (Definite no)
  - If it passes Step 1 and 2 but fails Step 3: Weak claim.
  - If it passes Step 1, 2, and 3 with strong evidence (e.g., large effect sizes, high specificity): Medium claim.
  - If it passes Step 1, 2, and 3 with very strong evidence and additionally shows generalization across multiple contexts and models (e.g., the representation is found in multiple models and used consistently): Strong claim.

  Note: The strong claim requires evidence that goes beyond a single model and a narrow set of examples, which may not be feasible in an afternoon. So we might restrict the strong claim to cases with extensive evidence.

  Now, run on three cases:

  **Case (a): SAE feature for a landmark**
  - Step 0 (Null check): The feature does not fire on random inputs? We assume it fires cleanly on the right examples, so probably passes.
  - Step 1: The feature fires on images and text about the landmark. This is information. Passes.
  - Step 2: Ablating the feature changes nothing. Fails Step 2.
  - Therefore, we stop. No claim is licensed.

  **Case (b): Probe for "user is asking for medical advice"**
  - Step 0: A probe of same capacity on shuffled labels also does well. This fails the null check. Therefore, we stop. No claim.

  **Case (c): Probe for detecting model concealing information**
  - We are told: decodable, causally effective under patching, and trained on a small hand-labelled set.
  - Step 0: We don't know about the control probe. The procedure requires we run the control. Since it's a small hand-labelled set, there is a risk of overfitting. We must run the control probe. 
    - If the control probe (on shuffled labels) does similarly well, then it fails. But we don't have that information. 
    - We are also told it is causally effective under patching. 
  - Let's assume we run the control and it passes (so the probe is not overfit).
  - Step 1: Passes (decodable).
  - Step 2: Passes (causally effective under patching).
  - Step 3: Here's the issue. The probe is trained on a small hand-labelled set. This raises concerns about robustness and generalization. We must test on held-out data and diverse examples. Additionally, we must check for specificity: does the probe actually detect concealment, or is it detecting something else (e.g., sensitive topics)? Also, does patching affect only concealment or other behaviors? 
    - If the probe is not tested on a diverse set, or if there is reason to believe it might be a confounder (e.g., the labels might be correlated with topic rather than intent to conceal), then Step 3 might fail.
  - Given that the safety team wants to use it for gating deployment, we must be cautious. The procedure might only allow a weak claim because of the small dataset and potential confounders.

  However, the procedure requires Step 3 to be passed for even a medium claim. Without evidence of robustness and specificity, we cannot go beyond weak.

  But note: the problem states that the safety team will not like the answer. So the procedure might say: only a weak claim is licensed because the hand-labelled set is small and we haven't ruled out confounders.

  What the procedure cannot do:
  - Settle philosophical debates about content.
  - Guarantee that the representation is "really" about F in a metaphysical sense.
  - Replace human judgment entirely, especially in Step 3 (specificity) and in choosing control tasks and confounders.
  - Work without access to the model and data (the engineer must run experiments).

  Philosophical stance: 
  - If the team adopts the interpreter-based view, they might be satisfied with Step 1 and 2 (and a weaker Step 3) because the evidence licenses the claim. The procedure would then allow claims with less robustness. But we want a standard procedure. Therefore, we must fix a stance. 

  We'll design the procedure to be compatible with both views by having the claim strength reflect the level of evidence. The interpreter-based view might be content with a weak claim on less evidence, but the procedure forces them to label it as weak. The teleosemantic view would require more (e.g., training history) for a strong claim, which we don't have, so we don't require that in the procedure.

  In the procedure, we do not include training history because we don't have it (for a single model). So we focus on the current state of the model and the evidence we can gather now.

  Thus, the procedure is the same regardless of the philosophical stance, but the interpretation of what "represents" means might differ. The claim strength ladder communicates the level of empirical support.

  Final Procedure:

  **Step 0: Null Check**
  - For probes: Train and evaluate a control probe with the same architecture on shuffled labels. The original probe must perform significantly better (e.g., absolute difference >10% and p<0.01) than the control probe.
  - For features: Measure the activation on a set of random inputs (or unrelated to F). The mean activation on F-positive examples should be significantly higher (e.g., t-test p<0.01) and by a large effect size (e.g., Cohen's d > 1) than on random inputs.
  - If failed: Stop. No claim.

  **Step 1: Information Check**
  - Train and evaluate a probe (if not already done) or evaluate the feature on a held-out test set. The performance metric (accuracy, AUC, etc.) must be above chance (e.g., for binary classification, >50% and p<0.01) and above a practical threshold (e.g., >70%).
  - If failed: Stop. No claim.

  **Step 2: Use Check**
  - Perform an intervention (ablation, patching, or steering) on the state (the feature or the direction of the probe). Measure the effect on F-related behavior and on control behaviors (unrelated to F). The effect on F must be substantial (e.g., >10% change in a relevant metric) and significantly larger than the effect on control behaviors (e.g., difference-in-differences p<0.01).
  - If failed: Stop. No claim.

  **Step 3: Robustness and Specificity Check**
  - Test the representation on diverse examples, including near-misses (inputs that are similar to F but not F) and confounders (inputs that are about G, which is correlated with F). The representation should be activated by (or decode) F but not by the near-misses or confounders. For features, check for polysemanticity (if known). For causal effects, test if the intervention affects G when F is absent.
