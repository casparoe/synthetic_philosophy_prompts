answer: |-
  Below is a practical, step-by-step procedure designed for your team to evaluate claims like "the model represents F." It operationalizes your conceptual material (information, use, and content) into empirical tests, accounts for common pitfalls (e.g., probe capacity, label leakage), and outputs a standardized claim strength. The procedure is philosophy-agnostic but flags where philosophical choices affect interpretation. It requires only basic ML tools (e.g., probes, ablation, steering) and can be run in an afternoon.

  ### Brainstorming: What "represents F" Could Mean
  - **Information-bearing (correlational)**: The state correlates with F (e.g., a probe decodes F). *Empirically decidable* via prediction tasks.
  - **Functional role (causal)**: The state is used by the model for F-relevant behavior (e.g., intervening changes F-specific outputs). *Empirically decidable* via interventions (ablation/patching/steering).
  - **Content (aboutness)**: F is the intentional object of the state. *Not empirically decidable alone*; depends on interpretation:
    - *Teleosemantic view* (gradient-descent-and-consumer): Content is fixed by training history (e.g., gradient descent shaped the state for F) and consumer layers (downstream use). Requires historical/training data (often inaccessible).
    - *Interpretivist view*: Content is assigned by an interpreter based on evidence (e.g., "represents F" is licensed if evidence supports it). Relies on human judgment.
    - *Instrumentalist view*: "Represents" is a fiction for prediction/control; only Steps 1–2 matter.  
  **Key takeaway**: Steps 1–2 are testable; Step 3 (content) requires assumptions. The procedure tests decidable aspects (Steps 1–2) and uses Step 3 to assign claim strength based on evidence quality. Philosophical views affect how Step 3 is weighted but not the core tests.

  ---

  ### Procedure: Evaluating "The Model Represents F"
  **Input**: A claim (e.g., "this state represents F"), evidence (e.g., probe, steering vector, ablation results), and a test set with F-positive and F-negative examples.  
  **Output**: One of four outcomes: (1) No claim, (2) Weak claim, (3) Medium claim, (4) Strong claim, with standardized wording.  
  **Time**: 3–4 hours for a single claim (assuming pre-collected evidence).  
  **Tools needed**: Probe training, intervention tools (ablation/patching/steering), and a diverse test set (including out-of-distribution (OOD) examples near F, e.g., "near-misses" or confounders).

  #### Step 0: Null Check (Baseline for Probes/Features)
  - **Question**: Is the evidence better than noise or a trivial baseline?
  - **Sufficient answer**:  
    - *For probes*: Probe accuracy/AUC on a held-out set is > chance + 20% (e.g., >70% for binary F) AND a control probe (same capacity, trained on shuffled labels) performs ≤ chance + 5%.  
    - *For features*: Mean activation on F-positive examples is >3× the mean on F-negative examples (or random inputs) with p<0.01 (t-test).  
  - **Fails if**: Control probe matches real probe, or feature activates equally on random/F-negative inputs.  
  - **Vulnerabilities**: Probe capacity (high-dim probes memorize), label leakage (F correlated with artifacts in data).  
  - **Judgment call?** No (quantitative thresholds).  
  - **Outcome**: Fail → Stop. **No claim permitted**.

  #### Step 1: Information Check (Correlation)
  - **Question**: Does the state robustly correlate with F?
  - **Sufficient answer**:  
    - Probe: Accuracy/AUC >80% on a diverse held-out set (including OOD near-misses, e.g., "medical question" vs. "medical fact" for medical intent).  
    - Feature: Top activations are F-specific (e.g., precision >90% for F on diverse examples).  
  - **Fails if**: Performance drops >15% on OOD near-misses, or correlation is unstable (e.g., large variance across data splits).  
  - **Vulnerabilities**: Superposition (entangled features), confounders (e.g., "landmark" correlates with "famous place").  
  - **Judgment call?** Minimal (set thresholds; use OOD tests to reduce subjectivity).  
  - **Outcome**: Fail → Stop. **No claim permitted**.

  #### Step 2: Use Check (Causal Role)
  - **Question**: Does intervening on the state change F-specific behavior?
  - **Sufficient answer**:  
    - *Ablation/patching*: Ablating the state reduces F-related metrics (e.g., accuracy on F-tasks) by >10% but changes control metrics (unrelated tasks) by <5%.  
    - *Steering*: Steering increases F-relevant outputs (e.g., probability of F-related text) by >20% without degrading control outputs (e.g., coherence, unrelated topics).  
  - **Fails if**: Intervention affects everything (non-specific) or nothing; steering only works off-distribution.  
  - **Vulnerabilities**: Off-distribution steering (fails on real data), non-specific effects (e.g., ablating breaks the model globally).  
  - **Judgment call?** Moderate (choice of control tasks/metrics).  
  - **Outcome**: Fail → Stop. **No claim permitted**.

  #### Step 3: Specificity & Robustness Check (Content Proxy)
  - **Question**: Is the state *about* F and not a confounder? Is evidence consistent across contexts?
  - **Sufficient answer**:  
    - *Specificity*: State correlates/intervenes only for F, not near-misses (e.g., "Eiffel Tower" feature doesn’t fire on "Leaning Tower"). Test with adversarial examples.  
    - *Robustness*: Evidence holds for ≥2 distinct methods (e.g., probe + steering) and across model variants (e.g., different seeds) if available.  
  - **Fails if**: State responds to confounders (e.g., "medical advice" probe fires on "cooking advice"), or evidence conflicts (e.g., steering works but ablation doesn’t).  
  - **Vulnerabilities**: Interpreter’s assumptions (e.g., "what counts as a confounder?"), small test sets.  
  - **Judgment call?** Yes (confounder selection is subjective; use predefined near-miss lists).  
  - **Outcome**: Pass → Proceed to claim assignment. Marginal pass → Weak claim only.

  #### Claim Strength Assignment
  Based on steps passed and evidence quality:  
  1. **Weak claim**: Passes Steps 0–2 but fails Step 3 (or marginal pass).  
     - **Wording**: "Preliminary evidence suggests the model may represent F."  
     - **Never licensed**: "The model represents F" (unqualified).  
  2. **Medium claim**: Passes Steps 0–3 with no major issues.  
     - **Wording**: "Evidence indicates the model represents F."  
  3. **Strong claim**: Passes Steps 0–3 with exceptional robustness (e.g., generalizes across models/layers, and specificity tested on 10+ confounders).  
     - **Wording**: "Strong evidence supports that the model has a representation of F."  
     - **Never licensed**: "F is the content of this state" or "The model understands F" (implies human-like cognition).  
  - **Handoff to human**: At Step 3 (for confounder evaluation) and claim assignment (if evidence is ambiguous).

  ---

  ### Case Studies
  #### Case (a): SAE feature for a landmark (fires on images/text; steering works; ablation does nothing)
  - **Step 0 (Null)**: Passes (activates cleanly on landmark, not noise).  
  - **Step 1 (Info)**: Passes (top activations clean).  
  - **Step 2 (Use)**: **Fails** (ablation changes nothing → no causal role).  
  - **Outcome**: **No claim permitted**.  
  - **Why?** No evidence of use. Engineers cannot claim "represents landmark."

  #### Case (b): Probe for "user asking medical advice" (93% accuracy; shuffled-label probe does well; patching leaves refusal unchanged)
  - **Step 0 (Null)**: **Fails** (shuffled-label probe matches real probe → correlation is trivial).  
  - **Outcome**: **No claim permitted**.  
  - **Why?** Label leakage or overcapacity probe. No meaningful information.

  #### Case (c): Probe for "model concealing information" (decodable; causally effective; small hand-labeled set; safety team wants to gate deployment)
  - **Step 0 (Null)**: Assume control probe fails (e.g., shuffled labels ≤ chance). Passes.  
  - **Step 1 (Info)**: Passes (decodable).  
  - **Step 2 (Use)**: Passes (patching changes behavior).  
  - **Step 3 (Specificity)**: **Marginal pass** (small hand-labeled set → likely confounders not tested; e.g., does probe fire on "sensitive topic" without concealment?).  
  - **Claim Strength**: **Weak claim only** (due to Step 3 risk).  
  - **Wording**: "Preliminary evidence suggests the model may represent the concealment of information."  
  - **Safety team impact**: Cannot use for gating deployment (requires at least medium claim). Weak claim flags uncertainty.

  ---

  ### What the Procedure Cannot Do
  1. **Settle philosophical disputes**: It tests empirical evidence (information/use) but cannot prove "aboutness" (content). Content claims depend on worldview:  
     - *Teleosemantic view*: Requires training history (e.g., how gradient descent shaped the state). This isn't tested here.  
     - *Interpretivist view*: Only requires evidence from Steps 0–3. A team using this view would run the **same procedure** but might accept weaker Step 3 evidence (e.g., fewer confounders) for medium claims.  
     - *Instrumentalist view*: Ignores Step 3; claims based solely on Steps 0–2.  
     The procedure is compatible with all views but forces explicit claim strengths based on evidence quality.
  2. **Guarantee truth**: It reduces overclaiming but can’t avoid false positives (e.g., missed confounders) or false negatives (e.g., superposition hides a true signal).
  3. **Replace context**: Human judgment is needed for confounders (Step 3), task selection, and deployment decisions.
  4. **Handle all ML phenomena**: Superposition, polysemanticity, or emergent representations may require model-specific adaptations.

  ### Recommendation
  Adopt this procedure for all internal reports. It standardizes claims, reduces overinterpretation, and makes assumptions explicit. For contentious cases (e.g., Case c), require peer review of Step 3. Revisit philosophical stance if your team’s goals change (e.g., deployment safety may demand teleosemantic rigor).
