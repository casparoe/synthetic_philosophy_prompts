  Wording for case (c): "Preliminary evidence suggests the model may represent the concealment of information."

  The safety team won't like it because they want a stronger claim to justify gating.

  Finally, what the procedure cannot do:
  - Prove that the model has a representation of F in a philosophical sense.
  - Rule out all possible confounders (it only checks for those that are tested).
  - Work without running experiments (the engineer must have the data and model access).
  - Be completely objective in Step 3 (judgment is required in choosing confounders and near-misses).

  If the team adopted the interpreter-based view, they might skip Step 3 and allow a medium claim with just Step 1 and 2. But the procedure we designed requires Step 3 for medium and strong claims. So they would be running the same procedure but might set lower thresholds for Step 3 or accept weak claims more readily. However, the procedure forces them to be explicit about the claim strength.

