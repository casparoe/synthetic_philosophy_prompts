  - This step passes if:
    - For probes: The performance on confounder/near-miss examples is not high (e.g., false positive rate <20%).
    - For features: The activation on confounders is not high (e.g., mean activation on confounders is less than half of that on F).
    - For causal interventions: The effect on G is minimal when F is absent.
  - If failed: Only a weak claim is possible. If passed, medium or strong.

  **Step 4: Claim Strength Assignment**
  - Passed Step 0, 1, 2, and 3 with strong evidence (large effect sizes, high statistical significance, diverse and large test sets) and the representation is consistent across multiple contexts (if tested): Strong claim.
  - Passed Step 0, 1, 2, and 3 with moderate evidence: Medium claim.
  - Passed Step 0, 1, and 2 but failed or borderline on Step 3: Weak claim.

  Now, for case (c) again: 
  - Step 0: We assume the control probe was run and passed (so the probe is not just memorizing).
  - Step 1: Passed (decodable).
  - Step 2: Passed (causally effective).
  - Step 3: The probe is trained on a small hand-labelled set. This almost certainly fails the robustness part of Step 3 because small sets are prone to overfitting and confounders. Even if it passes on a held-out set, the set might not be diverse enough. Therefore, only a weak claim is licensed.

