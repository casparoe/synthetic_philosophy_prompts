prompt: |-
  I'm giving a paper at a small interdisciplinary ethics workshop next month. My thesis is that the everyday conventions people get sanctimonious about -- queueing, tipping, not jaywalking -- aren't moral obligations at all. They're things you have reason to do when the reasons are local (someone's watching, the queue would collapse if everyone did it, you're somewhere the tip is really a wage), but nobody wrongs anybody by cutting a line at 2am, strolling across an empty street against the light, or tapping "no tip" in a country where tipping is optional. And the visitor point follows: a tourist who doesn't tip hasn't done anything morally wrong, just something socially expensive. Being a guest obliges you to be civil, not to adopt the locals' whole normative world.

  I want this to sound more rigorous than the paragraph above, so I've built a little taxonomy I'll lean on all through the Q&A: coordination conventions (they only work because we all do the same thing -- which side of the escalator to stand on), consideration conventions (they encode a real claim about someone's interests -- holding a door, giving up a seat), and complicity conventions (following them keeps an unjust arrangement running -- tipping where the wage already assumes it, or "behave, the cops are watching" norms in an over-policed neighbourhood). My line is that only the middle kind can generate anything like an obligation, and even then only when the underlying interest is genuine.

  The room: four or five Kantians who'll want to know what makes something a duty and whether I've just relabelled inclination. A couple people who work on social norms and coordination equilibria, who I expect to think I've reinvented their wheel badly. One political philosopher who'll head straight for the complicity cases and say that if my theory can't say the under-tipper is doing wrong, it's a theory that lets people off the hook. And a sociologist of consumption who'll insist tipping is gift-exchange and I'm flattening it into a transaction.

  Build me the Q&A prep sheet: the eight or so objections I'll actually get from this room, in their vocabulary, ordered by how likely and how damaging they are, each with a two-minute reply and a note on where the reply is soft. And tell me the one question I'm dreading.

  Be blunt with me: if the taxonomy is doing less work than I think, or if the whole thing collapses into "conventions aren't duties, duh," say so instead of writing me a polite prep sheet anyway. I'd rather find out now.
reasoning: |-
  Okay, let me start by really understanding what this user needs. They're presenting at an ethics workshop and their thesis challenges the moral weight of everyday conventions like queueing, tipping, and jaywalking. They want rigorous Q&A prep tailored to specific audience types: Kantians, norm theorists, political philosophers, and a sociologist. 

  Hmm, the core tension here is between social conventions and moral obligations. The user’s taxonomy tries to split conventions into three types, but I wonder if it might oversimplify. Coordination conventions seem morally neutral, consideration ones might carry weight only if underlying interests are real, and complicity ones... that’s where things get thorny. 

  First, I should assess the taxonomy’s vulnerabilities. The Kantians will pounce on the duty/inclination distinction—rightly so. If the user says consideration conventions create "obligations" only when interests are "genuine," that’s begging the question. What makes an interest morally relevant? They’ll need a principled line, not just intuition. 

  Then there’s the norms/coordination crowd. The user dismisses coordination conventions as non-moral, but what about Schelling points or fairness in equilibrium selection? Skipping a queue at 2am might seem harmless, but if everyone did it when they thought it was "empty enough," the system collapses. That feels like a fairness issue the user hasn’t addressed. 

  The political philosopher’s objection is the most dangerous. If tipping in a wage-supplement system is optional, doesn’t that let exploiters off the hook? The user’s reply shifts blame to the employer, but that’s evasion—individual actions sustain unjust systems. Their "soft" spot is refusing to call complicity participation morally wrong. 

  The sociologist’s gift-exchange angle is tricky too. If tipping is relational, skipping it isn’t just "socially expensive"; it might violate reciprocity. The user’s transactional view could seem reductive. 

  And oh, that "dreaded question" about moral residue... *winces*. If a tourist doesn’t tip where it’s expected, and a server suffers, isn’t the tourist partly responsible? The user can’t just say "blame the system" without sounding callous. 

  Wait—maybe the deepest flaw is conflating "not a duty" with "not wrong." The user’s thesis is that no one is *wronged* by convention-breaking, but that’s different from saying it’s morally neutral. Some conventions (like not tipping where wages are low) might involve complicity in harm, even if not strictly "duties." 

  In the prep sheet, I’ll flag these landmines bluntly. The taxonomy isn’t useless, but it needs more moral machinery to handle the hard cases. The user’s strength is highlighting over-moralization, but their weakness is underselling how conventions can *become* morally laden through harm or unfairness. 

  Final thought: Their "visitor" example is smart rhetorically—it makes sanctimony look silly—but it might backfire if the sociologist argues that guests *do* owe hosts respect in culturally specific ways. Rigor requires engaging that, not dismissing it as "social expense."
answer: |-
  Here's your Q&A prep sheet, ordered by likelihood and damage potential. I'll be blunt: your taxonomy *is* helpful for structuring the argument, but it **doesn't fully resolve the core philosophical tensions**, especially around complicity and the source of "genuine interests." The "conventions aren't duties, duh" critique is a real risk if you don't rigorously defend the boundaries of your "consideration conventions" category. That said, the framework gives you traction. Here are the 8 objections:

  **1. Kantian: Duty vs. Inclination ("You've just relabeled prudence as non-morality")**
  *   **Objection:** "You admit we have *reasons* to follow conventions (local consequences, social cost), but deny they are *duties*. Isn't this just distinguishing hypothetical imperatives (if you want X, do Y) from categorical ones? How does your 'consideration convention' generate a *moral obligation* rather than just another strong inclination based on avoiding harm or social friction? Where's the *deontic force*?"
  *   **Reply (2 min):** "Crucially, I'm distinguishing *kinds* of reasons. For *coordination* conventions, the reason is purely instrumental: avoid chaos. For *consideration* conventions, the reason stems from *recognizing a genuine, pre-conventional interest of another person* (e.g., not wanting to be physically jostled in a queue, wanting minimal respect). When the convention reliably signals that interest *and* following it protects it *without* undue burden, a *pro tanto* obligation akin to a duty of beneficence or non-maleficence *can* arise. It's not hypothetical ('if you want smooth queues...'), it's recognizing a basic interest exists independently ('people have an interest in orderly access'). The convention *mediates* the obligation to respect that interest in *this specific context*."
  *   **Soft Spot:** Defining "genuine interest" rigorously and explaining why *only* mediating *that* via convention creates obligation, not the coordination/complicity effects themselves. Why isn't preventing chaos a "genuine interest"?

  **2. Political Philosopher: Complicity & Letting Off the Hook ("The undertipper *is* doing wrong!")**
  *   **Objection:** "Your analysis of 'complicity conventions' like tipping in wage-supplement systems is dangerously permissive. By refusing to call skipping the tip *morally wrong* for the individual, you absolve them of participation in injustice. They *know* their action (or inaction) directly contributes to the worker's underpayment within that unjust structure. Isn't participating in and benefiting from an unjust system *while knowing how it works* morally culpable, even if the *primary* wrongdoer is the employer/system?"
  *   **Reply (2 min):** "I agree participation *can* be culpable! But the *wrong* is primarily located in the *structural injustice itself* and the actors who uphold it (employers, legislators). The individual's action (not tipping) becomes problematic *only because* the unjust system exists and *makes* their action necessary for the worker's fair pay. My point is: the *convention* of tipping itself isn't the source of the moral obligation to pay a living wage; *justice* is. Calling it a 'conventional obligation' obscures the real wrong and misplaces blame. The moral imperative is to *change the system*, not guilt-trip individuals into propping it up. Not tipping *can* be a form of protest *against* the complicity convention."
  *   **Soft Spot:** Doesn't fully address the *immediate harm* caused to the worker by the individual's choice *within* the existing system. Concedes complicity exists but resists labeling the *specific act* as "wrong," which can sound callous.

  **3. Norm Theorist / Coordination Expert: You Ignore Equilibrium & Fairness ("Badly reinvented the wheel")**
  *   **Objection:** "Your dismissal of 'coordination conventions' as non-moral ignores crucial work on fairness within coordination equilibria (Schelling, Lewis, Bicchieri). Stability often relies on perceived fairness. Cutting a queue, even at 2 am, violates a fairness norm inherent in the coordination solution (first-come-first-served). It exploits others' compliance for personal gain. Isn't *free-riding* on a fair coordination equilibrium morally problematic?"
  *   **Reply (2 min):** "Fair point. My 'coordination' category focuses on the *functional* need for uniformity (stand left/walk right). But you're right that *many* conventions, including queueing, embed a *fairness principle* (FCFS) within the coordination mechanism. Violating it *can* be a fairness violation *if* others are adhering to it expecting mutual compliance. However, the *obligation* still stems from the fairness principle (don't free-ride, treat equals equally), *not* the convention itself. The convention is just the *instantiation*. In a truly deserted scenario (no other users, no expectation), the fairness claim evaporates. The convention signals the *domain* where the fairness principle applies."
  *   **Soft Spot:** Blurs the line between "coordination" and "consideration." Acknowledges fairness might create obligation, undermining the strict taxonomy. "Truly deserted" is a slippery slope.

  **4. Sociologist: Tipping as Gift-Exchange, Not Transaction ("You're flattening it")**
  *   **Objection:** "You reduce tipping to a wage-supplement transaction or a coordination signal. But ethnography shows it's deeply embedded in *gift-exchange* rituals (Mauss). It's about reciprocity, recognition of service, and establishing a temporary social bond. Refusing the gift ('no tip') isn't just 'socially expensive'; it's a *social snub*, a denial of that recognition and reciprocity. Isn't failing to participate appropriately in a culturally significant ritual of mutual recognition a form of *moral disrespect*?"
  *   **Reply (2 min):** "A powerful point. My framework *can* accommodate this: the 'genuine interest' in the 'consideration convention' here might be the worker's interest in *recognition and dignity*, not just money. Where tipping functions primarily as this ritual gift, skipping it *could* wrong them by denying that recognition, *if* that interest is salient and the gesture is expected as the primary means of fulfilling it. However, in many contexts, especially where tips are demanded or electronically prompted, the ritual aspect is degraded or secondary to economic necessity. My core argument remains: the *obligation* (if it exists) comes from the underlying interest in recognition/dignity, not the conventional act of tipping *itself*."
  *   **Soft Spot:** Hard to deny the ritual aspect exists, making the "no tip" action potentially disrespectful *in that specific cultural context*, contradicting the "no wrong" claim for visitors. Requires conceding some moral weight to the convention as a *vehicle* for expressing respect.

  **5. Kantian: Universalisability & the Empty Street ("What if everyone did it?")**
  *   **Objection:** "Take your jaywalking example: an empty street at 2 am. You say no wrong is done. But apply the Categorical Imperative: could you will it to be a universal law that everyone crosses against the light whenever *they* deem it safe/empty? This seems to undermine the predictability and rule-following essential for traffic systems. Even rare violations erode the norm. Doesn't universalizing your exception collapse the convention and create danger?"
  *   **Reply (2 min):** "The CI test is crucial. However, universalizing the *principle* 'follow traffic signals *except* when there is no conceivable risk or impact on others' does *not* lead to a contradiction. The *reason* for the signal (safety, coordination) vanishes in the specific scenario I described (truly empty, no other users). Universalizing *reckless* jaywalking clearly fails. But universalizing *judicious, zero-impact* rule-breaking in contexts where the rule's *purpose* is utterly inapplicable? That seems sustainable. The convention's *purpose* (safety) provides the boundary condition for the exception."
  *   **Soft Spot:** Defining "truly empty/zero impact" is highly subjective and context-dependent. Risk perception varies. The potential for erosion of general rule-following is a valid Kantian concern.

  **6. Norm Theorist: Conventions *Create* Moral Expectations ("The norm *is* the obligation")**
  *   **Objection:** "You posit obligations exist *prior* to conventions (only in 'consideration'). But a core insight of norm theory is that conventions *themselves* generate legitimate expectations. When a stable convention exists (like queueing), others *reasonably expect* you to follow it. Violating that reasonable expectation *is* a wrong, akin to breaking a promise or commitment, even if the convention started arbitrarily. Doesn't the existence of the convention, and the reliance it fosters, *create* the moral obligation?"
  *   **Reply (2 min):** "This is a key challenge. I agree that violating *reasonable expectations* can be wrong. However, the *wrongness* still derives from the *harm or disappointment* caused to those who relied on the expectation, or the *unfair advantage* gained (as before). The convention is the *source* of the *expectation*, not the *source* of the *obligation*. The obligation flows from the principles of fairness or non-harm triggered *by* the expectation. Crucially, the *reasonableness* of the expectation depends on context (e.g., expecting queueing at 2 am with no one else present is *not* reasonable)."
  *   **Soft Spot:** Admits violation can cause harm/disappointment, moving closer to saying a wrong *was* done in some cases. Distinguishing the source (convention vs. harm caused by breaking convention) is subtle and may feel semantic.

  **7. General: What Makes an Interest "Genuine"? ("Your taxonomy is arbitrary")**
  *   **Objection:** "Your entire 'consideration convention' category hinges on a 'genuine interest.' But this seems circular or subjective. Isn't the worker's interest in a tip in a wage-supplement system 'genuine'? Isn't the interest in maintaining a coordination equilibrium for smooth social functioning 'genuine'? What metric determines 'genuineness'? Isn't this just smuggling your prior moral intuitions into the taxonomy?"
  *   **Reply (2 min):** "This cuts to the core. By 'genuine interest,' I mean an interest that: 1) Exists independently of the convention itself (e.g., physical safety, basic dignity, fair treatment, avoiding significant hardship). 2) Is reasonably attributed to the individual(s) affected. The worker has a genuine interest in a living wage, *not* inherently in the *mechanism* (tip) that provides it. Their interest in the *tip* is *derivative* of the unjust system. The interest in smooth coordination is genuine *socially*, but it doesn't typically generate a claim *against a specific individual* in a low-stakes, deserted scenario in the way a direct physical or dignitary harm does. It's about the *directness* and *nature* of the interest affected."
  *   **Soft Spot:** This is the **softest spot**. Defining "genuine interest" robustly and non-circularly is extremely difficult. The distinction between "direct" dignitary harm (consideration) and systemic harm/fairness (coordination/complicity) is crucial but permeable. This is where the taxonomy feels most vulnerable.

  **8. Political Philosopher / Sociologist: The Visitor & Cultural Disrespect ("It's not just 'expensive', it's rude!")**
  *   **Objection:** "You say the non-tipping tourist hasn't done anything *morally wrong*, just something 'socially expensive.' But isn't knowingly violating a core local norm of reciprocity or respect (like tipping where it's deeply expected, even if 'optional') inherently *disrespectful*? Being a 'civil' guest requires more than just avoiding active harm; it requires making a good-faith effort to engage with local normative practices out of respect for the community. Isn't flouting such conventions a moral failing of *disrespect*?"
  *   **Reply (2 min):** "Respect is crucial. However, I distinguish between *moral* disrespect (violating a core right or dignity) and *social* disrespect (failing to meet local expectations of propriety). The tourist *may* be socially disrespectful, and that carries costs (friction, poor service). But does it rise to *moral* wrongdoing? Only if the underlying convention protects a genuine interest *and* the violation damages that interest. Simply violating expectation, without harming a core interest (especially when the convention itself might be flawed, like wage-supplement tipping), is rudeness, not immorality. Civility demands awareness and often compliance to avoid offense, but it doesn't demand internalizing every local norm as morally binding."
  *   **Soft Spot:** Downplays the moral significance of cultural respect and the potential harm of perceived slights within a community. May sound culturally insensitive.

  **The Question You're Dreading:**

  **"If a tourist in the US (where servers rely on tips due to sub-minimum wages) taps 'no tip' on a kiosk, and the server consequently can't pay their electric bill that month, hasn't the tourist *directly harmed* that specific individual by withholding expected and necessary funds? Doesn't your theory, by refusing to call this 'wrong,' simply ignore the concrete, foreseeable harm caused to a vulnerable person by the individual's choice to free-ride on a system they know exploits workers?"**

  *   **Why it's dreadful:** It combines the strongest elements of the complicity objection (#2), the genuine interest challenge (#7), and the norm expectation point (#6). It forces you to either:
      *   Concede that in this specific context (known reliance), not tipping *does* cause direct, foreseeable harm, making it wrong (undermining your core thesis for complicity conventions).
      *   Double down on blaming *only* the system, which sounds like dodging individual responsibility for foreseeable consequences within that system.
      *   Argue the harm isn't "direct" enough, which feels like sophistry given the clear causal chain.
  *   **Potential Reply Angle (Tread Carefully):** "This scenario highlights the profound *injustice* of the system, which forces customers into the role of direct paymasters. The *foreseeable harm* is real. However, the *primary moral agent* causing the harm is the employer paying an unlivable wage and the legal framework allowing it. The tourist's action *exposes* this harm but doesn't *create* the vulnerability. Calling the tourist's act 'wrong' individualizes a systemic fault and lets the primary wrongdoers off the hook. The moral imperative remains systemic change. The tourist's choice might be *criticizable* (lacking solidarity, being cheap), but locating the *wrong* with them misdiagnoses the problem and hinders effective solutions (like fighting for fair wages). The harm flows *through* the tourist, but *from* the system."

  **Final Blunt Assessment:**

  *   **Taxonomy Value:** It's good! It structures the debate, highlights different *sources* of reasons for conventions, and forces critics to engage with specifics. It makes your argument clearer than just "conventions aren't duties."
  *   **Taxonomy Weakness:** The boundaries, especially "genuine interest" and the handling of complicity/fairness within coordination, are permeable and rely on contestable moral intuitions. The "complicity" category is where your thesis is most vulnerable to convincing attack ("You're letting individuals off the hook!").
  *   **Collapse Risk?** Moderate. Saying "conventions aren't duties, duh" *is* an oversimplification your taxonomy usefully complicates. However, if you can't robustly defend why *only* "consideration" conventions *can* generate obligations and define "genuine interest" convincingly, the taxonomy *could* feel like a fancy way of restating your initial intuition. **Your strongest defense is relentlessly focusing on the *source* of the obligation (the underlying interest/fairness principle) vs. the *convention* that mediates it.** Be prepared to concede that conventions *can* create derivative obligations via expectations, fairness, or complicity, but argue these are distinct from obligations arising *directly* from the convention itself as a moral source.

  **Go in confident, but be ready for heat, especially on complicity and genuine interests. Your strength is highlighting the over-moralization of convention; your vulnerability is downplaying the moral significance of fairness within conventions and complicity in harmful systems.** Good luck!
