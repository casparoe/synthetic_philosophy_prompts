prompt: |-
  I run restorative justice for a mid-size school district — about a dozen cases a month, mostly fights, theft, and one ongoing mess where a group of kids has been making a Muslim girl's life hell. My facilitators are teachers and counselors who did a two-day training. We get 45 minutes and sometimes a follow-up. Anything that ends in suspension has to survive the principal and the district's lawyer, so I need something I can defend to people who are never going to read philosophy.

  Here's my problem. We say we do this because of ubuntu — that a person is a person through other people, that you become a person rather than just starting out as one, that the community is what makes a self at all. I believe it, mostly. But when I actually have to decide something I've got nothing. Does the kid who got hurt get to say no to the conference and shut the whole thing down? Do we run it if the kid who did it won't admit anything? Do we let him back in class when the other parents are furious? I fall back on "what would the principal not get yelled at for," which isn't a philosophy, it's just cowardice with a talking stick.

  So write me a procedure I can actually run on a case, in the order I'd run it: the questions to ask, what counts as an answer good enough to move on, where it stops with a no, and where it hands the decision to a human because it's a values question and not a factual one. Ground it in the relational view of persons, not generic "restorative practices." I want the parts that would be different if I didn't believe any of this, and I want you to flag the parts that are just good facilitation dressed up as metaphysics.

  Some things it has to survive:

  - The personhood-is-achieved part. If a 13-year-old isn't yet a full person in the relevant sense, that sounds like it could license treating kids as projects instead of as people with standing right now. Does the view actually say that, and should the procedure care?
  - The community-defines-the-person part, which I've heard read two ways — one where the community is what makes you a person at all, another where it's necessary but doesn't get to swallow you. Tell me which reading the procedure is assuming and what breaks if I switch to the other one.
  - The fact that this stuff has been used to demand conformity — "we're all one family here, so stop making trouble." Which is exactly what the kids tormenting my student could say, and what a school says to a gay kid who won't go along with the room.
  - The accusation that it isn't a theory at all, just a warm feeling, and the counter-accusation that turning it into a flowchart is the real betrayal, since it's supposed to be about the person in front of you and not the rule. If a procedure is the wrong artifact, say so and tell me what to do instead — but I still have to decide something by Friday.

  Then run it on three: the harassment case, where the victim's family wants it handled by the police and won't sit in a room with anyone; a one-time theft where the kid who took the phone is genuinely sorry and the victim wants him expelled anyway; and a case where the "community" — a pack of parents — is demanding that the kid who threw the punch be removed from school, and a conference would just be a nicer-looking way of doing what they already want.

  Include at least one where the procedure tells me to do something I don't want to do, and one where it tells me I'm not allowed to do the thing everybody in the room wants. And tell me straight what the procedure can't do. I'd rather know the three places it will misfire than have it pretend to cover everything.
reasoning: |-
  Okay, the user runs a restorative justice program in a mid-size school district. They're dealing with about a dozen cases a month, mostly fights, theft, and an ongoing harassment situation targeting a Muslim girl. The facilitators are teachers and counselors with minimal training—just a two-day session. Each case gets 45 minutes, sometimes a follow-up. The big constraint is that any outcome avoiding suspension must pass muster with the principal and the district lawyer. So the user needs a defensible procedure grounded in ubuntu philosophy but practical enough for administrators who won't engage with the theory.  

  The user’s core frustration is that their current approach feels like "cowardice with a talking stick." They fall back on what’s politically safe rather than principled. They want a step-by-step procedure that actually reflects ubuntu—specifically the ideas that personhood is relational ("a person is a person through other people") and that community shapes the self. But they’re wrestling with tough questions:  
  - If personhood is "achieved," does that justify treating kids as projects rather than full persons?  
  - How to avoid the "community" concept being weaponized for conformity (e.g., pressuring victims to forgive)?  
  - Is it even possible to flowchart a philosophy that’s supposed to be about the "person in front of you"?  

  They also need concrete examples:  
  1. The Muslim harassment case where the victim’s family wants police involvement, not a conference.  
  2. A theft where the perpetrator is remorseful but the victim demands expulsion.  
  3. A fight where angry parents want the aggressor removed, and a conference might just rubber-stamp that.  

  The user explicitly asks for scenarios where the procedure forces an unpopular or uncomfortable decision. They also want honesty about where the model fails—no sugarcoating.  

  Digging deeper, the unspoken needs here are:  
  - **Legitimacy**: They need to defend decisions to skeptical administrators, so the procedure must be philosophically coherent but also legally/operationally viable.  
  - **Moral courage**: They’re tired of compromising principles for political ease and want tools to push back.  
  - **Guardrails against abuse**: Ubuntu’s emphasis on community could backfire (e.g., silencing dissent), so the procedure must explicitly prevent that.  
  - **Clarity on limitations**: They’d rather know where the model breaks than pretend it’s a magic bullet.  

  The relational view of personhood (ubuntu) isn’t just warm fuzzies—it’s a recognition that harm fractures relationships, and healing requires rebuilding those connections. But this can’t come at the cost of victim autonomy or justice. The procedure must balance:  
  - **Personhood-as-process**: Kids aren’t "lesser" persons; they’re persons-in-formation, so the process must respect their agency *now* while acknowledging their development.  
  - **Community-as-ground-not-boundary**: Community enables personhood but can’t erase individual dignity (e.g., the Muslim girl’s right to exist without harassment).  
  - **Anti-conformity**: Explicitly reject "we’re all one family" coercion. The procedure should flag when "community" is being misused.  

  For the flowchart dilemma: A rigid script *would* betray ubuntu, but the user needs structure. The solution is a *framework* with clear off-ramps and "human judgment" flags—not mindless rules, but a map showing where philosophy must override procedure.  

  Key insights from the user’s examples:  
  - The harassment case tests victim autonomy: Can they refuse participation without derailing accountability?  
  - The theft case exposes the limits of remorse: What if the victim rejects repair?  
  - The parent mob case reveals majority tyranny: Can the procedure protect the minority (the aggressor) from collective punishment?  

  The procedure must also force hard choices, like:  
  - When victim refusal *stops* the process (no coercion).  
  - When community pressure *cannot* dictate outcomes (e.g., refusing to expel a kid just to appease parents).  

  Finally, naming the model’s failures upfront builds trust. It won’t work when:  
  1. Power imbalances are too extreme (e.g., systemic bullying).  
