prompt: |-
  Write me an essay on a disagreement I keep having with a friend, and actually take a side. Here's the set-up. A rulebook contains one rule, R, which says that any rule in the book — R included — can be amended by a two-thirds majority. Later, by exactly that two-thirds majority, the members pass a new rule, S, which says that R may now be amended only by unanimous consent. Now they want to undo it: can they use R, at two-thirds, to repeal S? If yes, S was never really binding for even a moment. If no, then a rule has just used a power it had at the time to make itself harder to change and then revoked that power, which smells like pulling the ladder up after you. My friend says this shows a rulebook can never genuinely bind itself, and that every entrenched or "eternal" clause is either a bluff or incoherent self-reference. I think thats too quick, and that a careful account of what each step presupposes dissolves the paradox without leaving entrenchment toothless. Weigh both sides, then say whether it makes any difference if the book also contains an anti-entrenchment rule, to the effect that no rule may ever make itself — or the procedure for amending rules — harder to amend. Reach a verdict and defend it rather than ending on a shrug. Don't bother with reading lists or citations, thats not what I'm after. British English please.
