  I need to understand both sides of this paradox. The friend argues that this shows rulebooks can't genuinely bind themselves - any "entrenched" clause is either a bluff or incoherent self-reference. The user believes a careful analysis can resolve this without making entrenchment meaningless. There's also an additional element about whether an anti-entrenchment rule would change anything.

