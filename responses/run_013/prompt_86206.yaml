  **Principle: An individual is morally liable to be killed only if (1) they are directly and proximately causing or sustaining an unjust lethal threat at that moment, (2) they act with sufficient voluntariness (i.e., without severe coercion and with awareness of the unjust context), and (3) they are not in a purely defensive posture against an imminent attack on their person or immediate community (e.g., their home).**

