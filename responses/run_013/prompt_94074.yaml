  First, they listed several cases the theory must handle: a lone 'a' on a blank page, the same 'a' across different styles like blackletter, geometric sans, and a child's scrawl. Also, single vs. double-story 'a's, the stroke turning 'c' to 'e', Cyrillic vs. Latin 'a', ambiguous forms, and legible vs. non-legible shapes. Then there are distinctions like letter vs. glyph vs. logo, identity vs. style, and being an 'a' vs. looking like one. The theory must explain how we read varying forms without noticing differences and can't just be a feature checklist. It should predict new 'a's in unfamiliar styles. They also wonder which requirements are crucial vs. prejudiced, which kills usual answers, and if any requirements conflict.

  The user's explicit needs are clear: a structured spec for evaluating theories of letterform identity. But deeper, they might want to challenge students' assumptions about categories, pushing them beyond simplistic answers. They might be preparing for debates in class, ensuring they cover foundational issues early. Unspoken needs could include addressing the ontology of symbols—how abstract concepts like 'a' manifest in diverse instances. Also, they might seek to bridge theory with practical design, helping students create new letterforms that feel authentic. They mentioned not wanting conflicts to surface late, so anticipating theoretical pitfalls is key. 

  Next, I need to outline the requirements. The core challenge is balancing invariance and variation: what stays constant across all 'a's versus what changes. Categories must be real yet cover all variants. The tension between "must be a real category" and "must cover every variant" is central. Prototype theory might fail because no single prototype fits all 'a's (e.g., double-story vs. single-story). Essentialism fails with cultural variations like Cyrillic 'а'. Contrastive systems might struggle with lone 'a's or ambiguous cases. Family resemblance could be too vague. Reader's interpretation risks circularity.

  Key load-bearing requirements: invariance across transformations (handling style changes), and the distinction between token and type (glyph vs. letter). The token/type distinction kills off most theories because they conflate the glyph (token) with the abstract letter (type). Without this, theories can't explain how different glyphs are the same letter. Also, the requirement for predictive novelty is crucial—theories must guide creating new 'a's, not just classify existing ones. 

  Conflicting requirements: "must be a real category" vs. "must cover every variant" is the main tension. Real categories need fixed properties, but variants defy that. Token/type distinction resolves this by separating abstract type from physical tokens. However, maintaining this across scripts like Latin and Cyrillic is tricky. Are they the same category? The theory must decide if 'а' and 'a' share an abstract identity or are different symbols. This might involve historical and functional factors, but that's messy. 

  The user might also need to address how context influences identity. An ambiguous shape might be 'a' in one context but not another. The theory must account for this without being subjective. The requirement that we read without noticing variation points to cognitive processing where minor differences are ignored, suggesting that identity isn't about exact features but perceived function within a system.

  In conclusion, the token/type distinction is foundational. Most theories fail by not separating them. The predictive novelty requirement challenges theories to be generative. The unresolved conflict is whether the abstract category 'a' includes all cultural variants or if each script has its own abstract type. This might require a functional-historical approach, but it's still an open question. The user should present this tension to students to explore in class.
answer: |-
  Here’s the distilled specification for a theory of letterform identity, structured for rigor and designed to expose theoretical fault lines:

  ### **Core Requirements: What the Theory Must Deliver**
  1. **Invariance Across Transformations**  
     - Explain identity preservation under:  
       - *Stylistic shifts* (e.g., Garamond 'a' → Helvetica 'a' → child’s scribble).  
       - *Structural mutations* (single-story vs. double-story, cursive vs. block).  
       - *Contextual ambiguity* (e.g., a shape halfway between 'c' and 'e' that resolves as 'e' only when contextualized).  

  2. **Category Boundaries**  
     - Demarcate:  
       - Letter (abstract identity) vs. glyph (specific instantiation) vs. logo (non-linguistic mark).  
       - Being an ‘a’ (functional identity) vs. resembling one (visual similarity).  
       - Legible variation (recognizable as ‘a’) vs. illegible noise (fails to function as text).  

  3. **Cognitive Fidelity**  
     - Explain effortless reading of wild visual variation without conscious awareness of difference (e.g., switching between Cyrillic ‘а’ and Latin ‘a’ mid-sentence).  

  4. **Predictive Novelty**  
     - Generate criteria for a *new, unseen ‘a’* in an invented style (e.g., extraterrestrial script), not just classify known variants.  

  5. **Ambiguity Tolerance**  
     - Handle edge cases: shapes that are perceptually unstable (e.g., a glyph that flickers between ‘a’ and ‘d’ depending on viewer) or culturally contested (e.g., is the Ukrainian cursive ‘**т**’ a distinct letter or a variant of ‘m’?).  

  ---

  ### **Load-Bearing vs. Prejudicial Requirements**  
  - **Foundational (Load-Bearing)**:  
    - **Invariance (#1) + Cognitive Fidelity (#3)** together form the core challenge: *How can visually disparate tokens trigger identical linguistic categorization without conscious effort?*  
    - **Predictive Novelty (#4)**: Kills checklist theories (no fixed features suffice) and essence-based accounts (no universal ‘a’-ness).  

  - **Likely Prejudicial**:  
    - "Must cover every variant anyone ever drew" risks conflating *historical accident* with *categorical necessity*. Some outliers (e.g., decorative initials) may be glyphs misclassified as ‘a’, not identity failures.  
    - "Must distinguish Cyrillic/Latin ‘а’/‘a’ as same/different" imposes a cultural choice. A theory might treat them as distinct symbols sharing visual DNA.  

  ---

  ### **The Killer Requirement**  
  **Predictive Novelty (#4)** dismantles the usual answers:  
  - **Essence/Checklist**: Fails—no feature set predicts novel ‘a’s (e.g., a future style might omit the terminal curve).  
  - **Prototype**: Fails—no "best" ‘a’ can anticipate radical variants (e.g., a 1-pixel ‘a’ in a glitch font).  
  - **Contrastive System**: Fails with *lone* ‘a’s (no oppositions exist) and ambiguous glyphs (no system dictates if ⵙ is ‘a’ or ‘o’).  
  - **Family Resemblance**: Too vague to predict *which* resemblances matter for new cases.  
  - **Reader’s Interpretation**: Circular—it defers to undefined cultural agreement.  

  ---

  ### **Fatal Conflict: The Unsatisfiable Pair**  
  **"Must be a Real Category" vs. "Must Cover Every Variant"**  
  - **Conflict**: A "real category" implies stable, defining constraints (e.g., "has an enclosed counter"). But outlier cases (e.g., open-top graffiti ‘a’, broken ‘a’ in degraded print) violate constraints while still functioning as ‘a’.  
  - **Resolution Attempt**: The category must be **functionally defined**: *‘a’ is any glyph that, in a given literate context, reliably triggers retrieval of the /a/ phoneme or its lexical function*. Yet this risks over-inclusion (e.g., could a numeral ‘4’ ever be an ‘a’ in a code?).  
  - **Deep Issue**: Letterforms exist at the intersection of *visual form*, *linguistic function*, and *cultural convention*. No theory can fully rigidify boundaries because conventions evolve.  

  ---

  ### **The Unavoidable Conclusion**  
  A viable theory must be **relational and functional**:  
  1. **Token/Type Distinction**: Glyphs are physical tokens; ‘a’ is an abstract type defined by its role in a script system.  
  2. **System-Dependent Identity**: A glyph is an ‘a’ if it occupies the *functional slot* of ‘a’ in its writing system (e.g., Latin ‘a’ ≠ Cyrillic ‘а’ unless a script merger occurs).  
  3. **Dynamic Threshold**: Legibility is probabilistic—shapes become ‘a’ when they cross a context-dependent threshold of *functional substitutability* (e.g., if readers accept ⱥ as ‘a’ in context, it *is* one).  

  **Where Theories Break**: No account fully reconciles the **universality** of letter recognition with the **historicity** of script evolution. The tension between "stable category" and "open-ended variation" mirrors the biological species problem—essential for analysis, but boundaries remain negotiated, not absolute.  

  This spec sets a brutal but necessary stage: it forces confrontation with *why* letterform identity resists tidy solutions. Use it to expose the chasm between intuition and theory.
