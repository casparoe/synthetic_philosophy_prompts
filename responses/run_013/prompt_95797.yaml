prompt: |-
  I help run a small monthly debate night — two speakers, one topic, maybe eighty people in the back room of a pub — and I write the blurbs that go out to the mailing list. We've always tagged each speaker 'left' or 'right' and it used to be easy, but the last few months it's fallen apart on me. The last event was a guy who wants tariffs, a nationalised health service and a ban on new out-of-town retail, and who also thinks marriage is between a man and a woman and that the police should be harder on the homeless. Before that, a woman who is a full libertarian about drugs, sex work and speech, and who also thinks the housing market has simply failed and the state should be building. And next month I've got a former communist who now thinks immigration is what's really holding wages down, and he's furious at being billed as a right-winger, which honestly I can see. My co-organiser says we should just bin the words, but the audience picks events by them and I think the words do track something real, I just can't say what. So what I want from you is two things, in this order. First, tell me what you take the labels to actually be picking out — a bundle of issue positions that happen to travel together, a coalition that holds for historical reasons, a temperament, a stance about hierarchy and equality, something about change versus stability — because I've noticed my answer to 'is this person left or right' changes completely depending on which of those I'm using, and I dont think I can write a procedure until I've picked one. Then turn whatever you pick into a procedure I can actually run when I sit down to write a blurb: an ordered list of questions, what counts as an answer to each one, where the procedure stops and says 'neither' or 'both', and where it hands the decision back to me because the question is about values and not about facts. Constraints: the blurbs have to be one line, I'm not a political scientist, I have an afternoon, and my co-organiser will veto anything that sounds like a seminar.

  Two wrinkles you should fold in rather than wave away. The first is that the same word has to do duty for a person, a party and a policy — the mailing list tags old episodes too, and 'a left-wing policy' and 'a left-wing person' don't seem to be the same claim, or at least they don't fail in the same way, and I want to know whether the procedure has to branch for that. The second is my co-organiser's suggestion, which he's very pleased with: that a label is only honest if it predicts how the person will come down on the next ten things that happen to come up. That's appealing and it also seems to make the label hostage to whatever's in the news, so tell me whether to build that test into the procedure or throw it out, and why.

  Then run the thing on my three cases — the tariff-and-traditional-marriage guy, the libertarian who wants council housing, and the ex-communist — and I want at least one where it gives an answer I don't like, whether that's a speaker I'd rather not label the way it says or an answer that says 'stop using the word for this one'. Finish by telling me what the procedure can't do: which cases it will misfire on, where I'm just deciding and dressing it up as a method, and how to write the blurb when the honest label is one the speaker will object to, because I'd rather not ambush someone on the night.
reasoning: |-
  Hmm, the user runs a small debate night in a pub and is struggling with labeling speakers as "left" or "right" because modern politics doesn't fit neatly into those boxes anymore. They've encountered several complex cases: a traditionalist who supports nationalist economics, a libertarian who wants state housing, and an ex-communist concerned about immigration's impact on wages. Their co-organizer wants to ditch the labels, but the user feels they serve a real purpose for audience selection.

  The core problem is that "left" and "right" seem to mean different things depending on whether you focus on policy bundles, historical coalitions, temperament, or values like equality vs hierarchy. The user needs a practical labeling procedure that accounts for three key constraints: blurbs must be one-line, they're not political scientists, and they only have an afternoon to implement this. There are also two wrinkles: the same label must work for people, parties, and policies, and their co-organizer suggests labels should predict future positions on emerging issues.

  I should propose a values-based approach centered on core political motivations rather than surface-level policy positions. The key distinction lies in attitudes toward social equality and hierarchy: the left fundamentally seeks to flatten social hierarchies while the right accepts or reinforces them. This explains why the same policy (like tariffs) can serve different values depending on context. For the procedure, I'll create a simple 3-question flowchart that examines: 1) primary motivation for change (equality vs tradition), 2) view of systemic power (challenge vs maintain), and 3) attitude toward outgroups (expand vs protect). It should include off-ramps for "neither" (populists) and "both" (contradictory values), with a final human judgment call.

  For the co-organizer's predictability test, I'll recommend against building it in because it makes labels hostage to news cycles and assumes ideological consistency that rarely exists. Instead, the procedure should focus on enduring value structures. When applying this to the cases: the tariff/traditional-marriage guy clearly values social hierarchy (right); the libertarian with housing concerns prioritizes freedom but doesn't fundamentally challenge hierarchies (neither); the ex-communist combines anti-elitism with cultural protectionism (neither). The libertarian case will likely dissatisfy the user since it refuses a clean label they might want.

  The procedure's limitations include misfiring on: anti-establishment figures who reject left/right framing, value-inconsistent individuals, and those using left rhetoric for right goals (or vice versa). When speakers object to labels, transparency is key - show the reasoning upfront and offer to use their preferred term if it's not misleading, otherwise flag the debate as "unusual alliances" in the blurb. The user should acknowledge this system won't capture every nuance but will handle 80% of cases cleanly while making the remaining 20% more intelligible.
answer: |-
  Here's a practical framework for your blurbs, designed for speed, clarity, and recognizing the messy reality, based on a core principle:

  **What Left/Right Actually Picks Out: The Core Distinction**
  The most durable distinction is **attitudes toward social hierarchy and equality**. This underlies the coalitions, temperaments, and policy bundles:
  *   **Left:** Fundamentally seeks to *flatten* social, economic, and political hierarchies seen as unjust. Prioritizes equality (of outcome or opportunity), challenges established power structures (state, capital, tradition), and advocates for marginalized groups. Change is often framed as progress toward fairness.
  *   **Right:** Fundamentally accepts or seeks to *reinforce* social, economic, and political hierarchies seen as natural, beneficial, or necessary for order. Prioritizes stability, tradition, established authority, individual responsibility within the existing order, and the protection of core cultural/communal identity. Change is often viewed with suspicion or framed as restoration.

  This explains why policies can "travel" differently. Nationalized healthcare (left - challenges market/class hierarchy) vs. Traditional marriage (right - reinforces social/cultural hierarchy). Tariffs can be *right* (protectionist, nationalist hierarchy) or historically *left* (protecting domestic workers from global capital hierarchy). The *why* and *who benefits* matter.

  **The Practical Procedure (Your Cheat Sheet)**

  Spend 5-10 minutes per speaker. Ask these questions **in order**, stopping when you get a clear signal:

  1.  **Core Motivation: What fundamental change do they advocate for MOST?**
      *   **Left Signal:** Reduce inequality, empower the disadvantaged, challenge systemic power (corporate, inherited privilege, discriminatory structures).
      *   **Right Signal:** Strengthen tradition, national/cultural identity, social order, established authority, individual responsibility within existing structures.
      *   **Neither/Both?** If their core drive is primarily anti-establishment rage, conspiracy, or a single-issue obsession (e.g., solely "anti-woke" or solely "anti-capitalist" without a clear hierarchy/equality vision), mark **Neither (Populist/Other)**. If it's a VERY strong, balanced mix, note it but move to Q2.
      *   **Your Judgment:** Values-based. What animates them? Listen for keywords: "justice," "equity," "oppression," "power" (often Left) vs. "order," "tradition," "responsibility," "heritage," "nation" (often Right).

  2.  **View of Systemic Power: How do they view major existing power structures (e.g., big business, traditional social institutions, government itself)?**
      *   **Left Signal:** Generally distrustful of concentrated corporate power, inherited wealth, traditional social hierarchies (e.g., patriarchy, racial caste). Sees government as a potential (though flawed) tool to counterbalance these. Wants to *constrain or repurpose* established power.
      *   **Right Signal:** Generally distrustful of *government* power (especially centralized) to solve social problems or regulate behavior. More accepting of corporate/hierarchical power as natural or efficient. Sees traditional institutions (family, church, nation) as vital sources of stability and values. Wants to *protect or restore* established (non-state) power.
      *   **Neither/Both?** If they distrust *all* power structures equally (govt *and* corporations *and* tradition) in a fundamentally anti-system way, mark **Neither (Populist/Radical)**.
      *   **Your Judgment:** Values-based, but observable. Who/what do they consistently blame? Who/what do they defend?

  3.  **Ingroup/Outgroup: Whose rights/protection/status are they most focused on?**
      *   **Left Signal:** Focused on expanding rights, protections, and inclusion for groups perceived as marginalized, disadvantaged, or historically excluded (ethnic/racial minorities, LGBTQ+, poor, immigrants, women). Often frames issues in terms of group disadvantage.
      *   **Right Signal:** Focused on protecting the rights, status, security, and cultural primacy of a perceived core national/ethnic/cultural group or traditional majority ("heartland," "ordinary people," "traditional families"). Often frames issues as threats to this group or its values.
      *   **Neither/Both?** If their focus is intensely individualistic (libertarian) or hyper-nationalist to the point of excluding traditional analysis (e.g., some far-right), mark **Neither**. If truly balanced (rare), note it.
      *   **Your Judgment:** Values-based, but clear in rhetoric. Who is the protagonist in their narrative? Who is the perceived threat?

  **Where the Procedure Stops:**
  *   **Clear Majority (2/3 Signals):** Assign label (Left/Right).
  *   **Strong "Neither" from Q1 or Q2:** Tag as **Neither**.
  *   **Mixed Signals (e.g., Left Q1, Right Q3, Neutral Q2):** Tag as **Unorthodox [Strongest Signal]** (e.g., "Unorthodox Lefty", "Unorthodox Righty") OR **Neither** if truly incoherent. This is where your judgment kicks in hardest.

  **Wrinkle 1: Person, Party, Policy - Branching?**
  *   **No branching needed.** Use the same core question: **Does this person/party/policy primarily aim to flatten existing social/economic hierarchies (Left) or reinforce/protect them (Right)?** For a *person*, look at their *overall* pattern (use the procedure). For a *party*, look at its dominant coalition & platform direction. For a *policy*, analyze its *intended effect* on hierarchy/equality. A policy might be "left-wing" even if proposed by someone you'd tag "right" overall (rare, but happens). Tag the *policy* based on its nature, tag the *speaker* based on their overall stance.

  **Wrinkle 2: The Predictability Test (Co-organizer's Idea)**
  *   **Throw it out.** **Why?**
      *   **Hostage to News:** Exactly as you said. Is someone "left" because they oppose war A but "right" if they support war B? Labels become meaningless churn.
      *   **Unrealistic Consistency:** People are complex! A left-wing person might support a right-wing policy on a specific issue (e.g., local environmental restrictions that hurt development) and vice-versa. The core value orientation is more stable.
      *   **Impractical:** You need a label *now*, not after observing 10 future positions.
      *   **What it *does* capture:** A *truly* consistent ideology *should* be predictable. Our core hierarchy test *aims* to capture that underlying consistency. If someone's position on the "next ten things" wildly contradicts their core label *as defined by hierarchy/equality*, it likely means your initial label was wrong, or they are fundamentally inconsistent (which the procedure flags as "Neither"). Predictability is a *symptom* of a clear ideological core, not the definition.

  **Running the Cases:**

  1.  **Tariff/Traditional Marriage/Harder on Homeless Guy:**
      *   **Q1 (Core Motivation):** "Harder on homeless," "marriage man/woman" scream reinforcing social order & tradition. **Strong Right Signal.**
      *   **Q2 (Systemic Power):** Nationalized health service *could* be Left, but combined with tariffs (protectionist) and traditionalism, it looks more like reinforcing a *national* economic/social structure. Policing focus reinforces state authority for order. **Right Signal.**
      *   **Q3 (Ingroup/Outgroup):** Focuses on protecting "traditional" society (core group) from perceived threats (non-traditional families, homeless disorder, foreign competition). **Strong Right Signal.**
      *   **Result: RIGHT.** (You might not *like* tagging the NHS supporter "Right," but the hierarchy test is clear - he's reinforcing traditional social/economic/national order).

  2.  **Libertarian (Drugs/Sex/Speech) + State Housing Builder:**
      *   **Q1 (Core Motivation):** Full libertarianism on "vices" is about *individual freedom*, not necessarily flattening hierarchy. State housing is about reducing *economic* inequality. Mixed. **Weak/Neutral.**
      *   **Q2 (Systemic Power):** Libertarianism distrusts *state* power over individual lives. State housing builder *uses* state power. Contradiction! Distrusts state for morals, trusts it for economics? **Neither Signal** (Anti-system/Unorthodox mix).
      *   **Q3 (Ingroup/Outgroup):** Libertarianism focuses on the *individual*, not group rights. State housing focuses on an economically marginalized group. Mixed. **Neutral.**
      *   **Result: NEITHER.** This is the "answer you don't like" – she doesn't fit. She's a left-libertarian or bleeding-heart libertarian, but her core isn't primarily *flattening hierarchy* (libertarians often accept market hierarchy) nor *reinforcing tradition*. Tag her blurb as "Libertarian Social Policy Advocate" or "State Housing Libertarian" – avoid "Left/Right".

  3.  **Ex-Communist: Anti-Immigration (Wage Suppression), Furious at Right Label:**
      *   **Q1 (Core Motivation):** Anti-immigration focus (protecting native workers' wages) is about protecting the economic status/security of a perceived core group ("native" workers). **Right Signal.**
      *   **Q2 (Systemic Power):** Ex-communist background implies deep distrust of capital/business hierarchy. Anti-immigration often blames *business* for exploiting cheap labor. **Left Signal** (Challenges corporate power). Contradiction!
      *   **Q3 (Ingroup/Outgroup):** Focused on protecting native workers (core in-group) from perceived out-group threat (immigrants). **Strong Right Signal.**
      *   **Result: UNORTHODOX RIGHT or NEITHER.** (He'll hate both). The strongest signals (Q1 & Q3) are Right - protecting the core group's status. Q2 is a leftist *hangover* but now channeled into a protectionist/nativist cause. His *current* primary focus is protection of the in-group, not challenging capital hierarchy *for the benefit of the disadvantaged broadly defined* (which would include immigrants). Tag as "Economic Nationalist" or "Worker Protectionist" – avoid "Right" if he objects strongly, but the procedure leans that way.

  **What the Procedure Can't Do (Limitations & Caveats):**

  1.  **Misfires on Anti-Establishment Figures:** Populists who rage equally against "elites" and "marginalized groups demanding special treatment" will often hit "Neither." This is correct – they don't fit the left/right *hierarchy* axis well (they're often authoritarian, which is different).
  2.  **Misfires on Value-Inconsistent Individuals:** Some people genuinely hold contradictory values (like the libertarian housing advocate). The procedure flags this as "Neither" or "Unorthodox." That's honest.
  3.  **Doesn't Capture Nuance:** It's a blunt instrument. A "Right" label won't distinguish a moderate conservative from a fascist.
  4.  **Your Judgment is Key:** Especially at Q1 and when signals are mixed. You're deciding what the speaker's *primary drive* is. The procedure guides focus but doesn't eliminate subjectivity.
  5.  **"Dressing Up a Decision":** This happens most when signals are mixed (like the ex-communist). You have to weigh Q1 vs Q3. The procedure makes the *basis* of your decision clearer (hierarchy/ingroup focus) rather than just gut feeling.
  6.  **Speaker Objections:** This is crucial.
      *   **Transparency is Best:** *Before* publishing, **briefly explain your system:** "We use 'Left'/'Right' as shorthand based on whether a speaker's primary focus tends towards challenging social/economic hierarchies for greater equality or reinforcing traditional structures for stability. We know it's imperfect!"
      *   **Show Your Work (To Them):** "Based on X, Y, Z you said, our framework suggests [Label]. Does that feel completely off-base? How would you describe your core focus?"
      *   **Negotiate:** If they strongly object to "Right"/"Left" but their self-description ("National Conservative," "Social Democrat," "Libertarian") is clear and accurate, **use their term in the blurb instead.** Your goal is informative shorthand, not ideological enforcement.
      *   **The "Neither" Escape Hatch:** If they truly don't fit and object, "Neither" is honest. Use a descriptive tag ("Economic Nationalist," "Social Freedom Advocate," "Housing Campaigner").
      *   **Ambush Avoidance:** **Always share the draft blurb (including label) with the speaker *before* sending the mailing list.** Give them a chance to object *then*, not on stage. Frame it as wanting to be accurate. Most reasonable people will accept "Unorthodox X" or a descriptive tag if "Left/Right" genuinely misrepresents them. If they refuse any label, use "Featured Speaker" and focus the blurb purely on the topic/their background.

  **Final Blurb Writing Tip:** When the label is awkward ("Unorthodox Right," "Neither") or contested, lean harder on the descriptive hook in your one line: "Arguing for tariffs, NHS, and traditional values: [Name], [Label]" / "Libertarian on vice, state builder on housing: [Name]" / "Ex-Communist turned immigration skeptic: [Name] on wage pressures". The label supplements, doesn't replace, the substance.

  This system embraces the messiness, provides a clear, values-based rationale, gives you a quick procedure, offers escape hatches, and emphasizes transparency with speakers to avoid ambushes. It won't please everyone, but it's honest and functional for your pub debate needs. Good luck!
