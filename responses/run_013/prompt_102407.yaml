  Structure-wise: 14-16 lines, three refrains. Opening with creation ("a hand draws me"), then replication ("ten men, ten breads"), then the refrain’s shift. The failure must feel earnest, not mocking. Last lines should echo Neurath’s humility: *"I am a road / for meaning. Not the wheel."* 

  ... Drafting now. Avoiding "means" is hard! "A hand draws me" → "ten men are ten men" (tautology showing limitation). Refrain anchors each section. The star as both celestial body and symbol ("a sign, a star") bridges concrete/abstract. Final stanza: the missing words ("same," "cause") become the silence that proves the point. 

  User’s expertise means no need to dumb it down—but the poem must stand alone. A non-Vienna Circle reader should grasp a symbol’s loneliness; a Neurath scholar should nod at the "helper language" subtext. Did I avoid verse-Wikipedia? Hope so. No quotes, just the weight of simple nouns failing gently.
answer: |-
  ## Pictogram's Lament

  A hand draws me: one man.
  Ten men are ten men.
  One hundred men: a field of men.
  One house. One bread. One ship at sea.
  **I stand.**

  Another hand: ten ships, ten wheels.
  Ten houses, ten beds.
  Ten thousand men: a line of men.
  A star above. A sun. A moon.
  **I stand.**

  A sign, a star? A knife? A door?
  Ten stars? Ten knives? Ten doors?
  The hand draws fire. Fire spreads.
  No word for always. No word for same.
  **I stand.**

  I am a road
  for meaning. Not the wheel.
  Not the ship. Not the bread. Not the bed.
  No word for cause.
  No word for why I stand.

  ---

  **Refrain Note:** *"I stand"* shifts from literal presence (drawn figure), to collective representation (quantity), to conceptual existence (symbolic function), then finally to a state of unresolved limitation.
