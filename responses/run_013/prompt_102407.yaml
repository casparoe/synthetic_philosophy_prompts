  The constraints are tight: only concrete, drawable nouns allowed (person, house, loaf, ship, etc.), no abstract terms or relational words. The refrain must repeat verbatim three times, changing meaning with each repetition, mirroring how the same pictogram signifies different things in different charts. The poem's "turn" should come when it hits the limit of what pictograms can express—Neurath's acknowledgment that visual language has inherent limitations.

  Hmm, the user's request is deeply philosophical but also poetic. They're clearly immersed in Neurath's work—the emphasis on avoiding abstraction echoes his rejection of metaphysics. Their unspoken need might be for the poem to *perform* Neurath's theory: using concrete words to stumble at abstraction's edge, making the limitation felt rather than explained. 

