answer: |-
  Here's a detailed audit of your friend's summary, dissecting Williams' actual arguments against utilitarianism:

  ### Claim-by-Claim Breakdown:
  1.  **"Williams's integrity objection is that utilitarianism forces you to treat your own deepest commitments as just one more pile of preferences..."**
      *   **Williams Would Accept:** This captures the core concern. Utilitarianism demands an *impartial* perspective where your personal projects, relationships, and deeply held values ("ground projects" or "commitments") are valued *only* for their contribution to overall utility. They lose their status as *constitutive* elements of your identity and integrity.
      *   **Simplification/Refinement:** Williams emphasizes that these commitments aren't just *strong preferences*. They define who you are, give life meaning, and structure practical reasoning. Treating them as mere inputs in a utility calculus alienates the agent from their own life and sense of self.

  2.  **"Jim, in the village... George is offered the job... The utilitarian verdict in each case is that you do the thing..."**
      *   **Williams Would Accept:** This accurately presents the utilitarian conclusions and the scenarios.
      *   **Simplification/Refinement:** The key point isn't *just* the demand to act against commitment (e.g., Jim killing, George contributing to weapons). It's that the utilitarian *reasoning process* itself, even if it sometimes *coincidentally* permits sticking to a commitment, forces the agent to adopt a perspective that *undermines the nature* of that commitment. Integrity requires acting *from* your commitments, not *despite* them after an impartial calculation.

  3.  **"...the cost is that a person with integrity cannot do it, because integrity means sticking to your principles and refusing to sell out..."**
      *   **Problematic:** This is a **significant flattening and misrepresentation**.
          *   **Sticking to Principles:** Williams' "integrity" is **not primarily about deontological principles or stubbornness**. It's about fidelity to your *constitutive projects and commitments* that make you *you*. George's refusal might stem from a principled pacifism, but Jim's integrity lies in his identity *as someone who doesn't shoot innocent people*, not necessarily an abstract "do not kill" rule.
          *   **"Refusing to sell out":** This phrasing is too vague and political. Williams' concern is deeper: utilitarianism forces you to "sell out" *your very self*, your defining attachments and character, by demanding they be viewed externally and impersonally. It's alienation, not just a refusal to compromise.
          *   **"Cannot do it":** Williams' point is stronger: even *if* you do the utilitarian act (Jim shoots one), the *reasoning* required strips the act of moral meaning *for you* and damages your integrity. You become a "channel" for the utility calculus, not an integrated agent acting from conviction. The "cost" isn't just refusal; it's the destruction of the agent's moral identity *in the act of complying*.

  4.  **"...and the theory will not let you [have integrity]."**
      *   **Williams Would Accept:** This captures the essence. Utilitarianism's *structure* (impartial maximization) is inherently hostile to integrity as Williams defines it.

  5.  **"The slogan about having one thought too many is the same point in miniature..."**
      *   **Problematic:** This is **a category error and conflation**. The drowning wife case makes a **different, though related, point**.
      *   **Williams' Actual Point (Drowning Wife):** The target shifts from *demandingness/alienation* to the **nature of personal relationships and justification**. For Williams, the husband saving his wife *because she's his wife* is the *right* reason. If he saves her only *after* justifying it via an impartial rule ("saving spouses is permitted/maximizes utility"), he has "one thought too many." The very *need* for that impersonal justification *undermines* the distinctive character of the loving relationship, which is based on direct, particular attachment, not universal rules. The point is that **some actions (especially within deep personal relationships) are corrupted by being *morally justified*** in an impartial, rule-based way. Utilitarianism forces such justification everywhere.

  6.  **"Williams's point is that no moral justification of the rescue can be given, because the moment you need one you have already wrecked the relationship."**
      *   **Williams Would Accept:** This captures the specific point of the drowning wife case.
      *   **Refinement:** It's not that "no moral justification *can* be given" in some absolute sense. It's that seeking or requiring such a justification *from the agent involved* fundamentally misunderstands and damages the nature of the relationship and the act. The justification exists externally (it's morally permissible), but internalizing that justification as the *reason* for saving *your wife* is what wrecks the relationship's character.

  7.  **"So this is really the demandingness objection in fancier dress..."**
      *   **Problematic: This is the core error.** While demandingness (asking too much sacrifice) is *part* of the Jim/George scenarios, Williams' **integrity objection is distinct and deeper**.
      *   **Distinction:**
          *   **Demandingness Objection:** Utilitarianism requires excessive personal sacrifice (time, resources, happiness, even life) for the greater good.
          *   **Integrity Objection:** Utilitarianism forces an *alienating perspective* that dissolves the agent's deep commitments and projects – the very sources of their identity and reasons for acting – by subsuming them under an impartial calculus. It attacks the *structure of the self* required for meaningful agency and moral life, *even if* the specific demand isn't overly burdensome or *if* the agent complies. The "cost" isn't just sacrifice; it's the *loss of self*.

  8.  **"...since nobody seriously thinks you must maximize utility at the cost of everything you love, utilitarianism is refuted -- or it survives only by abandoning the impartial calculus that makes it a distinct view."**
      *   **Williams Would Accept (Partially):** He certainly believed utilitarianism's radical demands and its attack on integrity showed it to be an untenable picture of the moral life for human beings. He argued it cannot accommodate central features of human existence without ceasing to be utilitarianism.
      *   **Refinement/Problematic:**
          *   **"Refuted":** Williams was more nuanced. He saw his arguments as exposing a *fatal flaw* in utilitarianism's understanding of agency, identity, and the moral life, rendering it unacceptable as a complete moral theory. He wouldn't say it's logically "refuted" like a mathematical error, but shown to be *destructive* and *alienating* in a way that makes it incompatible with a recognizably human existence.
          *   **"Abandoning the impartial calculus":** Williams would strongly agree. He argued that any modification introducing agent-relative permissions or values strong enough to genuinely protect integrity would fundamentally change utilitarianism into a different kind of theory (e.g., indirect, rule-based, or pluralistic). The core impartial maximizing structure *is* the problem.

  ### Addressing Your Specific Questions

  1.  **Does the demandingness reading capture or dissolve the integrity point?**
      *   It **dissolves and distorts** it. Demandingness focuses on the *quantitative burden* of sacrifice. Integrity focuses on the *qualitative destruction* of the agent's identity and practical reasoning. Reducing integrity to demandingness loses Williams' core insight about alienation and the constitutive nature of commitments. Jim isn't just being asked to do something hard; he's being asked to become someone entirely different (a killer) for the greater good.

  2.  **Is the drowning-wife case a second argument or something different?**
      *   It is a **distinct but complementary argument**.
      *   **Target:** While Jim/George target utilitarianism's *demands* and *alienating perspective on the self*, the drowning wife targets utilitarianism's (and impartial morality's) *inability to account for the distinctive nature of personal relationships and the corruption caused by seeking impersonal justification for deeply personal acts*.
      *   **Moral:** The moral is that morality (especially impartial, rule-based morality like utilitarianism) has limits. Some spheres of life (like profound love) are distorted and their value destroyed if they are required to pass through the filter of impersonal moral justification. It highlights the "one thought too many" as a symptom of this deeper mismatch.

  3.  **Does the concluding claim ("refuted") follow?**
      *   **Based on Williams' View:** Yes, **if** you accept his premises about the centrality of integrity and personal commitments to a meaningful human life and moral agency, and **if** you accept that utilitarianism fundamentally cannot accommodate these without ceasing to be utilitarianism. For Williams, these arguments revealed utilitarianism as a profound *misdescription* of morality and agency.
      *   **Objectively:** It's a **powerful challenge, not a logical knockout**. Utilitarians offer various responses (indirect utilitarianism, sophisticated accounts of rules/integrity, challenging the centrality of Williams' conception of identity, arguing the alienation is acceptable/necessary). Williams believed these responses either failed or changed the theory beyond recognition. Whether they succeed is the ongoing debate.

  ### What Would Change the Verdict (Make the Summary Fairer)

  *   If "integrity" was explicitly defined as fidelity to *identity-constituting projects and commitments* rather than just "sticking to principles" or "refusing to sell out."
  *   If the distinction between the *alienating perspective* demanded by utilitarianism (the core of the integrity objection) and the *demanding sacrifice* was clearly maintained.
  *   If the drowning wife case was presented as a separate argument about the *corruption of personal relations by impersonal justification*, not just a "miniature" of the integrity objection.
  *   If "refuted" was softened to something like "revealed as incompatible with fundamental aspects of human moral psychology and agency" or "shown to impose an unacceptable cost on the agent's identity."

  ### Where My Reasoning is Most Likely Wrong

  1.  **Over-interpreting Williams:** Critics argue Williams sometimes overstated the "attack on the self" or underestimated utilitarian resources (like sophisticated rule-utilitarianism) for accommodating integrity indirectly. I might be accepting Williams' characterization of the utilitarian threat too uncritically.
  2.  **Sharpness of Distinction:** Some argue the demandingness and integrity points are more intertwined than I present. The sheer *burden* of constantly subordinating everything you are to an impartial calculus *is* part of what destroys integrity.
  3.  **Drowning Wife Scope:** Some philosophers argue Williams overreaches in claiming *any* moral justification wrecks the relationship. Perhaps certain kinds of reflective justification are compatible with deep love (e.g., "I save her *because* I love her, and I believe such love is a profound human good").
  4.  **"Refuted" Claim:** Utilitarians have sophisticated defenses. My assessment leans towards Williams' perspective, but a committed utilitarian would strongly dispute the conclusion that their theory is untenable.

  Your discomfort was justified. Your friend captured surface elements accurately but fundamentally misrepresented the *nature* of Williams' core objection (reducing integrity to demandingness/principled stubbornness) and conflated distinct arguments (integrity vs. "one thought too many"). Williams' critique is far more profound and unsettling than a simple complaint that utilitarianism asks too much; it claims utilitarianism destroys the very self required to be a moral agent in a meaningful way.
