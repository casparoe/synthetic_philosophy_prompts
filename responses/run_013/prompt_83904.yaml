prompt: |-
  A colleague of mine who writes on the philosophy of family law has been strikingly consistent across the hypotheticals we have put to her in seminar. She holds that the state should recognize as marriages: a same-sex couple raising children; a same-sex couple with no children and no intention of having any; and a heterosexual couple past childbearing age. She holds that it should refuse recognition to: a closed triad of three adults who are mutually committed, cohabit, and are raising children jointly; and two elderly siblings who have shared a household for forty years, are each other's sole caretakers and heirs, and want the legal incidents of marriage. Asked about the siblings, she says only that they already stand in a legal relation that does the work they want marriage to do.

  Next month the seminar takes up a new case: two friends, with no romantic or sexual involvement, who have shared a household for thirty years, hold their property jointly, and are each other's designated decision-maker and heir; they petition for a marital status.

  I want your prediction for that case, together with the rule or rules that best explain her record, what each surviving rule predicts here, which prediction you would bet on and why, and which further case would most sharply separate the rules that survive. I am ultimately trying to see what theory of marriage's point she is committed to, and whether it is stable.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're presenting a scenario involving a colleague's views on marriage recognition in family law. The colleague has consistent positions across several hypotheticals: recognizing same-sex couples (with or without kids) and heterosexual couples past childbearing age, but not recognizing a closed triad or elderly siblings. The user wants to predict the colleague's stance on a new case involving two platonic friends cohabiting for 30 years, sharing property, and being each other's decision-makers and heirs.

  First, I need to outline the colleague's past decisions to identify patterns. The approved cases all involve dyadic relationships (two people), whether same-sex or heterosexual, regardless of children. The rejected cases include a triad and siblings. The colleague mentioned that siblings already have a legal relationship, which hints that existing frameworks might preclude the need for marriage recognition.

  The key point seems to be the requirement for a dyadic, potentially romantic relationship. But the colleague approved a heterosexual couple past childbearing age, which isn't about procreation. So procreation isn't necessary. The siblings were denied even though they provide mutual support, possibly because their relationship isn't romantic. The triad was rejected, which is a non-dyadic structure. So the common thread might be that marriage is exclusively for dyads with a romantic component.

  Now, the new case involves two friends without romance or sex. They share a household, property, and legal responsibilities. If the colleague's rule is strictly about dyadic romantic relationships, they'd reject this case. But the colleague might see the absence of romance as disqualifying, similar to the siblings. However, the siblings were blood-related, which might add another layer. The friends aren't related, so maybe that's different? But the colleague's reasoning for siblings was about existing legal relations, not blood ties. So for the friends, existing legal tools like wills and POAs might be seen as sufficient, leading to rejection.

  I need to consider possible rules. Rule 1: Dyadic Romantic Union. This requires two people in a romantic relationship. It explains all past decisions: the approved cases are romantic dyads, the triad and siblings aren't dyadic or romantic. The friends here aren't romantic, so rejection under this rule. Rule 2: Functional Interdependence Plus Intent. This focuses on mutual care and intent, regardless of romance. But the colleague rejected siblings who had interdependence, so this rule doesn't fit. Rule 3: Unique Dyadic Bond (Non-Familial). This distinguishes between non-familial dyads (approved) and familial (siblings rejected). The friends aren't familial, so maybe approval? But the siblings were rejected based on existing legal relations, not necessarily because they're siblings. The colleague's comment about siblings having other legal avenues suggests that the existence of alternative frameworks is key.

  The colleague's reasoning for siblings was about existing legal relations, which applies to the friends too. They can use contracts, wills, POAs. So based on that, the colleague would likely reject the friends' petition. The dyadic romantic rule is the strongest because it consistently explains all cases. The functional rule fails because siblings had functionality but were rejected. The unique bond rule might not hold because the colleague didn't mention the familial aspect; it was about existing legal options.

  For a sharp separating case, a non-romantic, non-familial dyad without alternative legal structures would test the theory. If such a pair exists and the colleague rejects them, it confirms the romantic dyad rule. If they approve, it might lean towards functional interdependence. But since existing structures can usually be created, this might be rare. Alternatively, a romantic triad could challenge the dyadic requirement. If the colleague rejects it despite romance, it reinforces the dyad rule.

  The user's deeper goal is to understand the colleague's theory of marriage and its stability. The colleague seems to anchor marriage on romantic dyadicism, excluding functional or care-based relationships. This might be stable if marriage is viewed as a unique status for romantic partnerships, distinct from other bonds. However, denying marriage to interdependent groups like the siblings or friends could be seen as inconsistent if the purpose includes mutual support. The colleague might need to justify why romance is essential, which could be challenged by cases where romance isn't present but all other marriage functions are. The stability depends on whether the colleague can defend romance as a necessary condition without circular reasoning.
answer: |-
  Based on your colleague's established pattern, here's a breakdown of the prediction, the underlying rules, and how they apply to the new case:

  1.  **Prediction for the new case (Two platonic friends):** Your colleague will **refuse recognition**.

  2.  **Rules Explaining Her Record:**
      *   **Rule 1 (Primary & Survivor): Dyadic Romantic Union:** The state should recognize marriages only between **two adults in a committed romantic relationship** (regardless of gender, sexual activity, procreative ability, or intention). This relationship constitutes a unique social good worthy of specific state recognition and support ("marriage").
      *   **Rule 2 (Eliminated): Functional Interdependence (Care/Economy/Heirs):** *Rejected because* it fails to explain the refusal to recognize the siblings. They exhibit high functional interdependence (cohabitation, mutual care, economic sharing, designated heirs/decision-makers), which was deemed insufficient.
      *   **Rule 3 (Eliminated): Unique Dyadic Bond (Non-Familial):** *Rejected because* it fails to explain the refusal to recognize the siblings (a familial bond) *while also* potentially conflicting with the approval of the same-sex couples (non-familial) and the elderly heterosexual couple (non-familial). It doesn't add explanatory power beyond Rule 1 and the sibling comment.
      *   **Rule 4 (Implicit Corollary): Existing Adequate Legal Framework:** Where a relationship *not* meeting the criteria of Rule 1 exists (like siblings), the state should *not* grant marital status if sufficient alternative legal mechanisms (e.g., wills, powers of attorney, cohabitation agreements, inheritance laws for relatives) already exist to achieve the desired legal incidents. This explains her specific comment about the siblings.

  3.  **Prediction by Surviving Rule (Rule 1 - Dyadic Romantic Union):** Rule 1 predicts **refusal of recognition** for the platonic friends. Their relationship, however close, long-lasting, and functionally interdependent, lacks the core element of romantic commitment required by this rule. They fall into the same category as the siblings: a deep, committed, functional relationship that is non-romantic.

  4.  **Bet and Why:** I would bet **heavily on refusal of recognition** (Rule 1's prediction). Here's why:
      *   **Consistency:** It perfectly explains *all* her past decisions:
          *   Approved cases: Same-sex couples (romantic dyads), elderly heterosexual couple (romantic dyad).
          *   Refused cases: Triad (non-dyadic), Siblings (non-romantic dyad).
      *   **The Sibling Rationale is Key:** Her *only* provided rationale ("they already stand in a legal relation that does the work") explicitly addresses a non-romantic, highly interdependent dyad and rejects marriage for it. The platonic friends are an *identical* case functionally and relationally (non-romantic, interdependent dyad), differing only in the absence of a blood tie. Her reasoning for the siblings didn't hinge on the blood relation itself, but on the *type* of relationship (non-romantic) and the sufficiency of other legal tools.
      *   **Romance as the Differentiator:** The only consistent factor distinguishing the approved couples from the refused siblings (and now the friends) is the presence of a romantic bond.

  5.  **Sharp Separating Case: A Non-Romantic, Non-Familial Care Dyad Without Alternative Legal Structures.**
      *   **Case:** Two unrelated adults (e.g., former colleagues or close friends met later in life), with no romantic or sexual involvement, who cohabit, are utterly dependent on each other for care due to severe disabilities, commingle all finances completely, and wish to be each other's sole heir and decision-maker. Crucially, they reside in a jurisdiction with *very* limited legal tools for non-married/non-familial partners – e.g., no durable powers of attorney for personal care, restrictive inheritance laws favoring only blood relatives or spouses, no possibility of enforceable cohabitation agreements covering personal care, etc. Existing legal relations truly *cannot* "do the work."
      *   **Why it Separates:**
          *   **Rule 1 (Dyadic Romantic Union):** Would still **refuse recognition**. The absence of romance remains the disqualifying factor, regardless of functional need or lack of alternatives.
          *   **Potential Challenger Rule (Functional Need + Lack of Alternatives):** Might **grant recognition** based on the essential caregiving and economic interdependence, and the demonstrable failure of existing legal structures to secure their critical needs and wishes. This rule would prioritize the *purpose* (securing care and economic stability for interdependent units) over the *form* (romance).
      *   **Outcome:** If your colleague refuses this couple, it strongly confirms Rule 1 (romance is essential, even where function is critical and alternatives are absent). If she recognizes them, it suggests her underlying theory might actually prioritize functional care/economic units securing essential legal protections when no other adequate mechanism exists, *potentially* making the sibling refusal an anomaly based on the *specific availability* of tools for relatives, not a fundamental rejection of non-romantic bonds. However, her strong consistency *against* non-romantic dyads so far makes recognition in this separating case unlikely.

  **Conclusion on Her Theory of Marriage's Point and Stability:**

  *   **Committed Theory:** Your colleague is committed to the view that the **distinctive point of state-recognized marriage is to support and regulate committed, adult, romantic dyads.** This dyad is seen as a unique and fundamental social relationship category deserving of its own specific legal status ("marriage"), irrespective of procreation, gender composition, or sexual activity.
  *   **Stability:** This theory is **internally stable** based on her consistent application. It draws a clear, bright line: romance defines the marital category. Function (care, economics, child-rearing) is secondary and, while often present in marriages, is not the *defining* characteristic warranting the *specific* status of marriage. Other relationships, no matter how functionally similar or interdependent, belong to different legal categories (siblinghood, friendship, contractual partnership, etc.).
  *   **Potential Challenge:** The theory's stability relies on accepting "romantic commitment" as a sufficiently clear and distinct category justifying unique legal status. Critics might argue:
      *   **Circularity:** Is the legal status defining the romance, or the romance defining the status? What *is* the state recognizing/measuring beyond the couple's attestation?
      *   **Arbitrariness:** Why is *this* specific type of emotional bond (romance) privileged over other deep, committed, lifelong, functional bonds (like the siblings or friends) for accessing a powerful legal toolkit, especially when the functional outcomes (care, economic unity, inheritance) can be identical?
      *   **The Separating Case:** Her likely refusal of the separating case (non-romantic care dyad without alternatives) highlights a potential lack of flexibility. It demonstrates that for her, the symbolic/categorical distinction of romance trumps even severe functional need that cannot be met elsewhere within the legal system.

  Her theory is stable *if* one accepts the primacy and distinctiveness of the romantic dyad as the sole proper subject of marriage law. Its vulnerability lies in justifying why this specific emotional bond, rather than the demonstrable functions of mutual support and interdependence (which can exist without romance), is the *necessary* condition for accessing the legal benefits, especially in edge cases where the functional need is extreme and unmet by other legal means.
