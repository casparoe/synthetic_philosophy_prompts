prompt: |-
  You are an expert on Wittgenstein's later epistemology and, at the same time, someone with genuine experience writing decision procedures that institutions have to defend in writing. I am a final-year undergraduate taking a seminar on Wittgenstein's remarks on certainty, and I also work part-time at my university's research integrity office, where I am the first reader of complaints about published research. I have roughly twenty minutes per file to decide what the office does with a complaint before the review committee meets, and my supervisor has asked me to write up our triage procedure, because at the moment the outcome depends far too much on who happens to be on duty.

  Here is the problem the procedure has to solve. Almost every complaint we receive is aimed not at a study's results but at one of the background propositions the study never argues for: that the instrument was working, that the reference material was what it said on the label, that the outcome measure measures the thing it is named after, that our own published record is the record. We cannot investigate all of these, and we cannot simply refuse them either. I want a procedure that makes the refusals principled rather than administrative, and that keeps faith with what the later Wittgenstein actually says about doubt, as far as I understand it: that doubting one thing always presupposes other things standing fast; that some propositions function as the hinges on which our questions turn rather than as answers within them; that we hold these without grounds, having absorbed them in training rather than established them by testing; and that they are not frozen forever, since the riverbed of our thinking can shift, though not because a single finding knocked it loose. Correct me if that reading is crude, but build on it rather than replacing it with a general essay on scepticism.

  Our seminar instructor has been using a rough four-way distinction, and I would like you to adopt it, refine it, or tell me where it breaks down: (1) constitutive hinges, propositions that are part of what it is to do this kind of inquiry at all; (2) load-bearing empirical hinges, ordinary factual claims nobody in the field has ever had reason to doubt and that the field's methods cannot check without already presupposing them; (3) institutional hinges, propositions held fixed for legal or procedural reasons; and (4) propositions that only look like hinges because the person complaining has never seen them questioned. I suspect most complaints actually live in category 4, and I want the procedure to separate that category from the others rather than lumping everything under the heading of background assumption.

  The central test I want the procedure to run — please check whether it is really the right test — is whether the proposition could in principle be re-opened by some recognized procedure in the field, however expensive or rarely used, without first presupposing itself. If yes, it is not a hinge for us and the complaint goes to investigation. If every available check presupposes it, then the complaint is not a complaint about evidence at all; it is a proposal to change the practice, and our office is the wrong body to hear it. Say clearly what the office should do instead, and be honest that the complainant will experience that as a brush-off.

  The procedure itself should be a set of questions in order, each with (a) what counts as a sufficient answer, (b) what to do when no answer is available, (c) whether a clerk like me can answer it or whether it needs a scientist, and (d) where the procedure must stop and hand the matter to a person, because the remaining question is about values — how much disruption we are willing to impose on a researcher's career, whose certainty gets to count as the field's certainty — rather than about facts. Include explicit stop rules. Bear in mind that a doubt with no stopping point leaves the office incapable of concluding anything at all, and that this is a real failure mode and not merely a philosophical curiosity.

  Then run the procedure, step by step, on three complaints, at least one of which should produce an outcome I will find uncomfortable: first, a complaint that a laboratory's sample-handling instrument was out of calibration for the entire period of a study; second, a complaint that the standard measure used across an entire research area does not measure what its name says it measures; third, a complaint that our office's own file on a case was altered, so that the record I would rely on is itself in question. For each, say where the procedure lands and why, and give me one paragraph of plain language that I could send to the complainant.

  Finally, include a short section on what the procedure cannot do: the cases it will get wrong, the ways in which treating something as a hinge can be abused as a way of protecting the assumptions of whoever happens to hold power in a field, and how the procedure should be revised as the field's riverbed shifts. Do not give me a bibliography, a reading list, or citations of any kind — I am not asking you to attribute anything to anyone, and I would rather you define any term you need in your own words. If you need a concrete fact about a real case, invent the case and mark it as invented. Before you write anything, spend some time brainstorming the distinctions you think must survive translation into a procedure and the ones that can be dropped; then write the procedure for someone who will read it in two years and will not have taken the seminar.
reasoning: |-
  Okay, the user is an undergrad in a Wittgenstein seminar and works at a research integrity office. They need a decision procedure based on Wittgenstein's hinges to triage complaints about background assumptions in research. Let me unpack their request.

  First, they want a procedure that distinguishes between genuine hinges and false ones. Their four categories—constitutive, load-bearing empirical, institutional, and false hinges—are useful. The key test they propose is whether a proposition can be re-opened without presupposing itself. That aligns with Wittgenstein's idea that hinges aren't subject to doubt in normal inquiry.

  The user's real pain point: too many complaints are category 4 (false hinges), but current triage is inconsistent. They need principled refusals that feel fair. Also, the procedure must be executable by clerks in 20 minutes with clear stop rules. 

  Hmm, challenges: 
  - How to operationalize "recognized procedure in the field" without requiring scientific expertise?
  - How to handle institutional power dynamics (e.g., when hinges protect entrenched interests)?
  - Their uncomfortable test cases (instrument calibration, measurement validity, record tampering) will stress-test the framework.

  Brainstorming distinctions that matter:
  1. **Epistemic status vs. social consensus**: A real hinge is non-negotiable within current practices; a false hinge just lacks exposure to doubt.
  2. **Revisability**: If a field has methods to test a claim without circularity, it's not a hinge—even if expensive.
  3. **Authority boundaries**: When to involve scientists vs. when clerks can decide? Scientists should only weigh in on whether checks exist, not on the complaint's merit.

  Droppable nuances:
  - Deep Wittgenstein exegesis (user wants applied philosophy).
  - Perfect historical accuracy (they prefer plain definitions).

  For the procedure design:
  - Start by screening for category 4 (naive doubt) via literature review feasibility.
  - Then assess revisability: if no non-circular test exists, it's a hinge and the complaint is dismissed as a practice-change proposal.
  - Stop rules crucial at two points: when doubt cascades endlessly (Wittgenstein's point about needing a foundation), and when values decisions arise (e.g., whose certainty counts).

  Now for test cases:
  1. **Calibration complaint**: Can be checked via maintenance logs—non-circular. Not a hinge; investigate.
  2. **Measurement validity**: Field likely has validation protocols. If not, it might be a hinge, but uncomfortable because whole research area could be flawed. User will dislike dismissing this.
  3. **Altered records**: Constitutive hinge—if we doubt our own records, office can't function. Must stand fast. Cold comfort for complainant.

  Abuse potential: Powerful labs could frame challenges as "hinges" to avoid scrutiny. Mitigation: Regular review of what counts as a hinge, with junior researchers' input.

  Procedural revision: Annual audit of cases where hinges were invoked, tracking if any became revisable later (riverbed shifting).
answer: |-
  Here is a decision procedure for research integrity complaint triage, grounded in Wittgenstein's hinge epistemology and designed for 20-minute assessments. The procedure distinguishes *genuine hinges* (categories 1-3) from *false hinges* (category 4) using a revisability test. **Core principle**: If a proposition can be non-circularly investigated by recognized field methods, it's not a hinge and warrants review; if not, rejecting the complaint is principled, not administrative.

  ---

  ### **Triage Procedure: Hinge Assessment for Research Integrity Complaints**  
  *Instructions: Proceed step-by-step. Document answers. Stop at designated points.*

  1. **Screen for False Hinges (Category 4):**  
     *Question: "Is there published or widely known evidence within the last 10 years questioning this proposition in the relevant field?"*  
     - (a) **Sufficient answer:** Yes (e.g., peer-reviewed critiques, replication failures, methodological disputes).  
     - (b) **No answer available:** Default to "no."  
     - (c) **Who decides:** Clerk (using PubMed/Google Scholar quick search).  
     - (d) **Stop if:** Answer is "yes" → **Investigate complaint.**  
     *Reason:* If doubt exists in the field, this is not a hinge but an unsettled claim.  

  2. **Test Revisability (Categories 1-3):**  
     *Question: "Could this proposition be checked using a field-recognized method that does not presuppose it?"*  
     - (a) **Sufficient answer:**  
       - "Yes" = Specific method exists (e.g., calibration against a standard, independent validation).  
       - "No" = All verification requires assuming the proposition (e.g., trusting records to verify records).  
     - (b) **No answer available:** Consult field expert (see Step 3).  
     - (c) **Who decides:** Clerk for obvious cases (e.g., instrument calibration); Scientist for complex cases.  
     - (d) **Stop if:** Answer is "yes" → **Investigate complaint.**  
     *Reason:* Revisable claims are testable hypotheses, not hinges.  

  3. **Scientist Consult (If Step 2 Unclear):**  
     *Question to Scientist: "Name one field-accepted method to verify this without circularity."*  
     - (a) **Sufficient answer:** Method named → **Investigate.**  
     - (b) **No method named:** → Proceed to Step 4.  
     - (c) **Who decides:** Staff scientist (5-min max consult).  
     - (d) **Stop if:** Scientist identifies a method → **Investigate.**  

  4. **Hinge Confirmation & Disposition:**  
     *Question: "Is this proposition constitutive, load-bearing, or institutional?"*  
     - (a) **Sufficient answer:**  
       - *Constitutive* (e.g., "records are reliable"): Required for inquiry itself.  
       - *Load-bearing* (e.g., "standard materials are pure"): Unquestioned bedrock for methods.  
       - *Institutional* (e.g., "IRB approvals are valid"): Policy-mandated.  
     - (b) **Unclear:** Treat as hinge → **Reject complaint.**  
     - (c) **Who decides:** Clerk (using definitions below).  
     - (d) **Stop and hand to person if:** Values conflict arises (e.g., "Whose certainty counts?"). Escalate to committee.  
     *Disposition:* **Reject complaint.** Explain to complainant it proposes practice change, not an evidence lapse.  

  **Key Stop Rules**  
  - **Investigate:** At any "yes" in Steps 1-3.  
  - **Reject:** At Step 4 (hinge confirmed).  
  - **Escalate:** If doubt cascades (e.g., challenging all records) or values decisions needed (e.g., career disruption risk).  

  **Definitions**  
  - **Constitutive hinge:** Required to engage in research (e.g., "data integrity is baseline truth").  
  - **Load-bearing empirical hinge:** Foundational fact enabling specific methods (e.g., "microscopes resolve cells").  
  - **Institutional hinge:** Policy-based (e.g., "archived consent forms are valid").  
  - **False hinge:** Only doubted due to complainant’s inexperience (e.g., "PCR machines might be magic").  

  ---

  ### **Test Case Applications**  
  **Case 1: Instrument Calibration Complaint**  
  *Complaint: Lab’s sample-handling instrument was out of calibration during a study.*  
  - **Procedure:**  
    - Step 1: Field literature shows calibration drift is a known issue (e.g., QC journals discuss it). → **Investigate.**  
  - **Outcome:** Not a hinge; calibration is revisable via maintenance logs or retesting.  
  - **Response to complainant:** *"We will investigate. Instrument calibration is routinely monitored and can be audited without assuming past accuracy."*  

  **Case 2: Outcome Measure Validity Complaint**  
  *Complaint: Standard measure "Cognitive Ability Score" does not measure cognition.*  
  - **Procedure:**  
    - Step 1: Literature shows validity debates (e.g., papers questioning construct validity). → **Investigate.**  
  - **Outcome:** Not a hinge; psychometrics has validation protocols (e.g., factor analysis).  
  - **Response:** *"We will investigate. Measurement validity can be assessed through established statistical methods."*  
  *(Note: If literature showed no debate and no validation method existed, this would be uncomfortable but dismissed as a load-bearing hinge.)*  

  **Case 3: Altered Records Complaint**  
  *Complaint: Integrity office’s own case file was tampered with.*  
  - **Procedure:**  
    - Step 1: No field literature doubts institutional record-keeping as a category.  
    - Step 2: No non-circular check; verifying file integrity requires assuming other records (e.g., backups, logs) are untampered.  
    - Step 4: Constitutive hinge → **Reject.**  
  - **Outcome:** Hinge; doubting all records halts inquiry.  
  - **Response (uncomfortable but principled):** *"We cannot investigate because checking records requires relying on records. This complaint suggests a need for broader procedural change, which our office does not handle. We recommend contacting [university governance body]."*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **False negatives in power imbalances:** Treating something as a "load-bearing empirical hinge" may protect entrenched interests (e.g., a dominant lab’s methods). *Mitigation:* Annual review of rejected complaints by junior scientists to flag potential abuses.  
  2. **Riverbed shifts:** If a field evolves (e.g., new tech questions a "hinge"), the procedure lags. *Mitigation:* Reclassify propositions if >5% of complaints about a "hinge" pass Step 1 in a year.  
  3. **Values conflicts:** It cannot weigh ethical trade-offs (e.g., "Is destroying a career over minor record-keeping just?"). *Handling:* Explicit escalation to committee at Step 4.  
  4. **Hyper-specialized disputes:** Clerks may miss niche methods to reopen propositions. *Mitigation:* Scientist consult at Step 3.  

  **Procedure Revision:** Update hinge classifications biennially using:  
  - Analysis of complaints that triggered field-wide reevaluation.  
  - Input from early-career researchers (vulnerable to false hinges).  

  This balances Wittgenstein’s insight—that doubt needs undoubted ground—with institutional accountability. When the riverbed shifts, the procedure must shift too.
