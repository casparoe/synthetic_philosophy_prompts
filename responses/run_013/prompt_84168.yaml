  The dinner scene where Stevens declines to have an opinion shows his avoidance of forming any personal stance. This ties into the idea that he's borrowing someone else's answer to what should matter. The scene with his father's death illustrates how his professional ideal overrides natural human emotions. Here, the novel might be collapsing the distinction between action and feeling, showing that deferring on values inherently affects both.

