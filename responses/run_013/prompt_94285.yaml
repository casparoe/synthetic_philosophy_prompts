answer: |-
  **A careful welfare economist would reject the blog's closing claim as largely false and find the summary an oversimplification that ignores significant developments since the early ordinalist revolution.**

  1.  **"Once economists accepted the ordinalist revolution, they saw that comparing one person's utility with another's is meaningless."** **Broadly right, but qualified.** The ordinalist revolution (Pareto, Hicks, Allen) correctly emphasized that utility, as derived purely from revealed preference, is ordinal. It ranks an individual's choices but lacks cardinal meaning (measurable in units) or comparability *across* individuals based solely on revealed preference. Robbins famously argued interpersonal comparisons were normative/value judgments, not positive science. *However*, it's not that comparisons are universally "meaningless" in all contexts; they are not *scientifically established* by revealed preference data alone. Many economists acknowledge they become necessary for policy and involve ethical judgments.

  2.  **"Utility is just a device for representing someone's preferences, and preferences are only defined up to the ranking they induce..."** **Broadly right.** This accurately reflects the ordinalist view dominant in microeconomics and choice theory. Utility functions are convenient numerical representations of underlying preference orderings; any monotonic transformation represents the same preferences.

  3.  **"...so there is simply no fact of the matter about whether my satisfaction exceeds yours."** **Subtle distortion leaning towards false.** While true that revealed preference data doesn't establish a "fact of the matter" about relative satisfaction levels, this phrasing overstates the case. It ignores:
      *   **The possibility of meaningful cardinal utility:** Under certain axioms (e.g., regarding choices under uncertainty as in von Neumann-Morgenstern expected utility theory), utility gains a cardinal meaning *within* an individual. This opens the door to *conceptually* comparing *changes* in utility across individuals (e.g., "Taking $100 from A hurts A less than giving it to B helps B"), though empirically anchoring such comparisons remains challenging.
      *   **Behavioral/Neuroscientific approaches:** Some research programs attempt to ground interpersonal comparisons in measurable physiological or neurological correlates of welfare (e.g., Kahneman on experienced utility), though this is controversial and not mainstream in *traditional* welfare economics.
      *   **The necessity for policy:** Most economists recognize that *any* policy choice affecting distribution (i.e., almost all policies) implicitly or explicitly *requires* making interpersonal comparisons, moving into normative economics. Denying any "fact of the matter" doesn't eliminate the practical need to make reasoned judgments.

  4.  **"That is why welfare economics confines itself to Pareto improvements..."** **Overstated and misleading.**
      *   **Pareto is foundational but insufficient:** It's true that Pareto improvements (making someone better off without making anyone worse off) are the *only* universally agreed-upon welfare criteria based *solely* on ordinal, non-comparable preferences. They avoid interpersonal comparisons.
      *   **Welfare economics goes *far* beyond Pareto:** The field does not "confine itself" to Pareto. Key concepts explicitly rely on implicit or explicit interpersonal comparisons:
          *   **Kaldor-Hicks Compensation Tests:** Assess potential efficiency gains based on *hypothetical* compensation, implying comparability of gains and losses.
          *   **Social Welfare Functions (SWFs):** The Bergson-Samuelson SWF framework explicitly incorporates ethical judgments about distribution, which *require* interpersonal comparisons. Utilitarianism (summing utilities) is one specific type of SWF, but others like Rawlsian (maximin) or Nash also require comparing welfare levels or changes across individuals.
          *   **Cost-Benefit Analysis (CBA):** Standard practice aggregates monetary valuations (willingness-to-pay/accept) across individuals. This implicitly assumes marginal utility of money is equal or comparable, a specific (and strong) form of interpersonal comparison. While controversial, it's a central tool in applied welfare economics.

  5.  **"...and why utilitarianism -- which needs to sum utilities across people -- was quietly abandoned once its foundations were exposed as incoherent."** **Largely false.**
      *   **Utilitarianism was not abandoned:** While pure unadulterated Benthamite utilitarianism based on hedonistic cardinal utility fell out of favor with the ordinalist revolution, utilitarian *thinking* and frameworks adapted and persist robustly.
      *   **Harsanyi's Impartial Observer Theorem:** Provided a rigorous axiomatic foundation for utilitarianism based on rational choice under uncertainty (extended preference), showing that if individuals are placed behind a "veil of ignorance" about their own position, they would choose rules maximizing average expected utility. This directly rebuts the claim that summing utilities is inherently incoherent; it grounds it in a specific model of rational choice.
      *   **Persistent Influence:** Utilitarianism remains a major benchmark in welfare economics, social choice theory, and moral philosophy. It underpins much of applied CBA. Criticisms exist (e.g., distributional indifference), but abandonment due to incoherence is factually incorrect. The foundations were challenged and adapted, not exposed as incoherent and discarded. Modern welfare economics grapples *with* interpersonal comparisons and various SWFs, including utilitarian ones, rather than abandoning them.

  **Why the Closing Claim Doesn't Follow:** Even accepting the core ordinalist premise that revealed preferences alone don't support interpersonal comparisons (points 1-3), it does *not* follow that utilitarianism was abandoned due to incoherence. Welfare economics demonstrably did not confine itself to Pareto (point 4), and utilitarianism evolved theoretical foundations (Harsanyi) and remains a vital, actively used framework (points 4 & 5). The blog confuses the demise of simplistic hedonistic cardinal utility with the demise of utilitarian welfare economics entirely, ignoring significant theoretical and applied developments.
