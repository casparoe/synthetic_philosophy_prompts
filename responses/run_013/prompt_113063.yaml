  65-70 min: Collect the responses. Read a few aloud. Point out that they are the same.

  70-75 min: Introduce the term "qualia" and the four traditional marks. Explain Dennett's critique: if qualia are ineffable, private, etc., then they cannot be the basis for any objective test.

  75-80 min: Part3: Each group writes one sentence defining qualia and one sentence describing what observation would show that definition is wrong.

  80-85 min: Collect and write on board. Group by similarity.

  85-90 min: Conclude: The exercise shows that the idea of qualia as ineffable, intrinsic properties leads to an explanatory dead end.

  What might go wrong:

  - In part1, a taster might deviate from the script. Solution: Emphasize that they must read the answers exactly.

  - In part2, groups might design an experiment that they think would work (e.g., ask the subject to describe their experience). But then the other group might write different responses for swap and no swap. For example, if the experiment is "ask them what red looks like", they might write for no swap: "they say red looks like it used to" and for swap: "they say red looks like green used to". But that's not what they would say! Because their memory is intact, they would say that red looks the same as always. So both cases: "red looks the same as always". So the response is the same. We must make sure the groups understand that memory is intact. Emphasize: "The person's memory is intact. They remember what red used to look like and what green used to look like. After the swap, when they see a red object, it looks to them the way green used to look, but they remember that this appearance used to be associated with green. However, they still call it 'red' because they haven't forgotten the names. So if you ask them, 'What does red look like?' they will say, 'It looks like red.' because that's how they remember it. They have no way to compare the current experience to the past experience except through memory, which is unchanged."

  So in the debrief, we might have to explain that.

  - Time: We might run over in part1. Have a timer and be strict.

  This should work. Let me know if you need more details.
answer: |-
  Below is a comprehensive, runnable session plan for your 90-minute philosophy of mind reading group on Dennett's "Quining Qualia." The session is designed to make participants *experience* the indeterminacy between changes in subjective experience (qualia) and changes in attitude/preference, without introducing the term "qualia" until the debrief. The coffee-taster case is the core, but the activity extends to the inverted spectrum thought experiment to reinforce the point. The plan includes materials, roles, rules, a scoring system, a minute-by-minute timeline, debriefing points, and solutions for potential issues.

  ---

  ### **Session Overview**
  - **Goal**: Participants experience the impossibility of distinguishing between "taste change vs. attitude change" (and related variations) through a structured activity. They then design an inverted spectrum test, revealing that behavioral evidence cannot detect subjective swaps. Only after this do they learn the term "qualia" and its four traditional marks.
  - **Core Insight**: The difference between "same taste/different attitude" and "different taste/same attitude" leaves no observable trace, and this isn't due to measurement limitations—it's a conceptual trap.
  - **Key Elements**:
    - **Part 1: Coffee Tasting Role-Play**: Tasters role-play one of four conditions (e.g., "taste changed, attitude unchanged") using fixed responses. Detectives guess the condition but consistently fail, demonstrating the trap.
    - **Part 2: Inverted Spectrum Challenge**: Pairs design an experiment to detect a red/green qualia swap, then another pair predicts outcomes—revealing identical responses for "swapped" and "not swapped."
    - **Part 3: Qualia Definition Exercise**: Groups define "qualia" and propose a falsification test, exposing the concept's weaknesses.
  - **Debrief**: Maps the activity to Dennett's argument, introduces the four marks of qualia, and shows why the trap arises.

  ---

  ### **Materials (Cheap, One Supermarket Trip)**
  - **Coffee Setup**:
    - **Coffee**: 1 bag of inexpensive ground coffee (e.g., a dark roast for strong flavor). Brew 1.5 liters (enough for 14 small samples). *Why coffee?* It has a complex, familiar taste that people have strong opinions about, making attitude/taste confusions natural.
    - **Serving**: 14 small paper cups (e.g., 2-oz bathroom cups), 1 large thermos or pitcher for the brewed coffee, tap water for rinsing (optional).
    - **Cost**: ~$5–$10 total. Skip milk/sugar to avoid confounding variables.
  - **Role Cards**:
    - **Taster Cards**: 14 cards (one per participant) labeled with one of four conditions. Use index cards or paper scraps:
      - **Card A (Taste Changed, Attitude Unchanged)**: "The coffee tastes different now (e.g., more bitter), but your preference is the same—you dislike it because you've always disliked bad coffee."
      - **Card B (Attitude Changed, Taste Unchanged)**: "The coffee tastes exactly the same, but your preference has changed—you now dislike it even though you used to like it."
      - **Card C (Both Changed)**: "The coffee tastes worse AND your preference has changed—you dislike it now for both reasons."
      - **Card D (Neither Changed, Reporting Shift)**: "The coffee tastes the same, and your preference is the same (you still like it), but you've decided to report disliking it because you're protesting the company's ethics."
    - **Detective Sheets**: 7 copies of a fixed question sheet (see below).
  - **Activity Sheets**:
    - **Part 1**: Printed "Fixed Response Menus" for tasters (one per card type, with scripted answers).
    - **Part 2**: Blank paper for experiment design and prediction (4 sheets).
    - **Part 3**: Small notecards for qualia definitions (one per group).
  - **Other**: Pens, timer, whiteboard/flipchart for debrief notes.

  ---

  ### **Roles and Rules**
  #### **Part 1: Coffee Tasting (30 minutes)**
  - **Roles**:
    - **Tasters (7 in Round 1)**: Receive a private condition card (A, B, C, or D) and a Fixed Response Menu. They must answer questions *only* using the scripted responses on their menu. They cannot reveal their card or deviate from the script.
    - **Detectives (7 in Round 1)**: Receive a question sheet. Their goal is to guess the taster's condition based on answers.
  - **Rules**:
    1. **Tasting Phase**: All participants sip coffee simultaneously (no talking). Emphasize: "This is the 'same blend' you've tasted for years as veteran tasters."
    2. **Card Assignment**: Randomly distribute cards. Ensure balanced conditions (e.g., 3–4 of A/B/C, 2–3 of D). *Important*: Cards are fictional—participants must role-play sincerely, even if it contradicts their actual experience.
    3. **Fixed Responses**: Tasters answer using pre-written phrases to prevent ad-libbing. Sample menu:
       - **Question 1**: "How does the coffee taste today compared to last week?"
         - A: "It tastes worse—something's off."
         - B: "Same taste, but I can't stand it now."
         - C: "Totally different and awful now."
         - D: "Same as always, but I'm calling it disgusting."
       - **Question 2**: "Why do you dislike it?"
         - A: "It's undrinkable now—they must have changed the beans."
         - B: "It's identical, but I just don't enjoy it anymore."
         - C: "Both the taste and my preferences changed—it's terrible."
         - D: "I have my reasons, but it's personal."
       - **Question 3**: "If the coffee reverted to last week's version, what would you say?"
         - A: "If it tasted like before, I'd like it again."
         - B: "Even if it tasted the same, I'd still hate it."
         - C: "I doubt I'd like it—I've changed too much."
         - D: "I'd probably still say I dislike it."
    4. **Interview Setup**: Pair each detective with a taster (7 pairs). Detectives ask all 3 questions in order. Tasters respond *only* from their menu.
    5. **Scoring**:
       - Detectives score 1 point for a correct condition guess.
       - Tasters score 1 point if their condition is *not* guessed correctly (rewarding concealment).
       - No real prizes—use a tally on the board for fun.
    6. **Round 2**: Switch roles (previous detectives become tasters, previous tasters become detectives). Reassign cards. Repeat.

  #### **Part 2: Inverted Spectrum Challenge (25 minutes)**
  - **Setup**: Form pairs (7 pairs total). Half design an experiment; the other half predict outcomes.
  - **Rules**:
    1. **Design Phase (Pairs 1–3)**: "Design a simple experiment to detect if someone's red and green qualia swapped overnight. Assume memory and behavior are intact (e.g., they still call apples 'red')."
    2. **Prediction Phase (Pairs 4–7)**: Each pair receives one experiment design. They must write:
       - What the subject would say/do **if the swap happened**.
       - What the subject would say/do **if no swap happened**.
    3. **Reveal**: Compare predictions—most will be identical (e.g., "The subject says red looks like it always did").

  #### **Part 3: Qualia Definition Exercise (15 minutes)**
  - **Rules**: Regroup into 4 small groups (3–4 people). Each group writes:
    - One sentence defining "qualia" (introduced now for the first time).
    - One sentence: "What observation would show this definition is wrong?"
  - **Output**: You collect definitions, cluster similar ones on the board, and discuss.

  ---

  ### **Minute-by-Minute Timeline**
  | Time  | Activity                                                                                              | Details                                                                                                                                |
  |-------|-------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------|
  | 0-5   | **Introduction**                                                                                      | Explain the coffee-taster scenario: "You're veteran tasters; today's blend is 'identical,' but something changed." No mention of qualia. |
  | 5-10  | **Tasting and Card Distribution**                                                                     | All sip coffee. Distribute cards and Fixed Response Menus. Assign 7 tasters and 7 detectives.                                          |
  | 10-20 | **Round 1 Interviews**                                                                                | 7 detective-taster pairs conduct interviews (3 questions each). Strict 7-minute limit.                                                |
  | 20-22 | **Guessing and Scoring**                                                                              | Detectives write guesses. Tally scores.                                                                                               |
  | 22-32 | **Round 2 Interviews**                                                                                | Switch roles. Reassign cards. Repeat interviews.                                                                                      |
  | 32-34 | **Guessing and Scoring**                                                                              | Tally scores. Announce winners—but emphasize low detective scores.                                                                    |
  | 34-40 | **Part 1 Debrief Setup**                                                                              | Pose: "Why was guessing so hard? What couldn't detectives observe?"                                                                   |
  | 40-50 | **Part 2: Inverted Spectrum**                                                                         | Form 7 pairs. Pairs 1–3 design experiments (5 min). Swap designs with Pairs 4–7. Pairs 4–7 write predictions (5 min).                |
  | 50-55 | **Part 2 Reveal**                                                                                     | Share predictions—note identical responses for "swapped" vs. "not swapped."                                                           |
  | 55-60 | **Introduce Qualia**                                                                                  | Define "qualia" and the four marks (ineffable, intrinsic, private, immediately apprehensible).                                        |
  | 60-65 | **Part 3: Definition Exercise**                                                                       | Groups write one-sentence qualia definitions + falsification tests.                                                                   |
  | 65-75 | **Board Sorting**                                                                                     | Cluster definitions on board. Discuss patterns.                                                                                       |
  | 75-85 | **Full Debrief**                                                                                      | Map activities to Dennett's argument (see below).                                                                                     |
  | 85-90 | **Wrap-up**                                                                                           | Summarize the trap: "No experiment can access the 'inner difference'—it's not a measurement failure."                                 |

  ---

  ### **Debrief: Mapping Activities to Dennett's Argument**
  After Part 1 (Coffee Tasting):
  - **The Trap**: Highlight that detectives scored poorly because:
    - There was no behavioral trace (verbal reports, preferences, or actions) to distinguish conditions. E.g., "dislike" reports came from taste changes (A), attitude changes (B), or reporting shifts (D).
    - This mirrors Dennett's tasters: Both report disliking coffee, but one blames taste, the other attitude—and neither can prove it.
  - **Key Point**: This isn't about "crude instruments"; even perfect measurements fail because the difference doesn't exist in the observable world.

  After Part 2 (Inverted Spectrum):
  - **Reveal**: Point out that predictions for "swapped" and "not swapped" were identical. Why? Memory and behavior are intact, so subjects report the same thing (e.g., "Red looks like it always did").
  - **Link to Qualia**: If qualia are private and ineffable, they can't affect public behavior—so the swap is undetectable. Dennett argues this makes qualia an empty concept.

  After Part 3 (Definition Exercise):
  - **Cluster Definitions**: Group definitions on the board (e.g., "Subjective feel," "Private experiences"). Most falsification tests will involve behavioral observation (e.g., "If we could objectively measure it").
  - **Dennett's Critique**: Explain the four marks of qualia (ineffable, intrinsic, private, immediately apprehensible). Then:
    - The coffee activity shows these marks lead to indeterminacy (e.g., "intrinsic" properties can't be verified).
    - The inverted spectrum shows "private" qualia are irrelevant to third-person science.
    - Conclude: Qualia are "quinable" (deniable) because they don't explain anything—they're a philosophical trap.

  ---

  ### **Handling Predictable Problems**
  1. **"I know my own experience!" Stall**:
     - **Problem**: Participants insist their subjective experience is obvious, refusing to role-play.
     - **Solution**: Build rules into the activity:
       - Start with: "This is fictional role-play. Your card defines your character's reality—suspend your personal beliefs."
       - Enforce fixed responses to prevent ad-libbing (e.g., "You must use the menu phrases").
       - If resistance persists, say: "If you 'know' your experience, can you prove it to your detective? Try within the rules." The inevitable failure becomes a teaching moment.

  2. **Activity Shortcomings**:
     - **What the Activity Can't Reproduce**: The coffee activity uses deception (e.g., Card D's insincere reporting), which might feel artificial. Dennett's point is that *even sincere reports* suffer from indeterminacy, but role-playing insincerity helps dramatize it.
     - **What You Must Supply**: In the debrief, explicitly connect the dots:
       - "The activity used reporting shifts to make the trap obvious, but Dennett argues sincere reports have the same problem—e.g., you can't prove your taste changed versus your attitude."
       - Provide the coffee-taster case as a bridge: "Like our tasters, Dennett's veterans can't resolve their disagreement because there's no fact of the matter."

  3. **Other Issues**:
     - **Time Overruns**: Enforce strict timers. Cut Part 1 to one round if needed (skip Round 2 and double group sizes).
     - **Confusion in Part 2**: Preempt by clarifying the inverted spectrum: "After a swap, grass *looks* red to the subject, but they call it 'green' because memory is intact. They'll insist nothing changed."
     - **Low Engagement**: Start with a provocative question: "Could your dislike of coffee be 'all in your head' while the taste is unchanged?"

  ---

  This plan creates a visceral experience of Dennett's trap—participants "feel" the indeterminacy before labeling it. By the end, they'll see qualia as a concept that evaporates under scrutiny, setting up rich discussion for future sessions. Run it as-is, and adjust based on group dynamics. Good luck!
