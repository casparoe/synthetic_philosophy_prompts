prompt: |-
  I teach a grad seminar that spends a few weeks on cause prioritisation, and I keep catching myself defending the importance / tractability / neglectedness framework -- you rank causes by how much is at stake, how much a marginal bit of work would buy, and how few people are already on it, and you treat the product as a rough ranking. My students take it as common sense. I've started to suspect its popularity is a symptom rather than a vindication. So play the part of someone trying to talk me out of it: what would actually count against the framework, sorted by how decisive each thing would be?

  I don't want the familiar line that neglect might itself be a warning sign, and I don't want a reading list -- I want the objections that bite even when the framework is read charitably, as a heuristic rather than a law. Three that I keep circling. (a) A colleague insists the three factors can't be independant, because a cause tends to stay neglected exactly when the people who look closely conclude it's intractable, so multiplying the three double-counts the same information. Is that right, and how badly does it break things? (b) Importance is the only term carrying any moral weight, and it's the term we can least quantify or compare across value theories and across different kinds of beings, so doesn't the multiplication manufacture a precision that makes a contested axiological judgement look like an engineering calculation? (c) Acting on the framework changes its own inputs: if neglect is a reason to enter, success dissolves the reason, and a criterion that erases itself on use seems like it ought to worry me. Is that a defect, or just what any competitive domain looks like?

  I'd also like to know whether the framework has quietly been qualified into unfalsifiability. When someone says the factors are just a way of estimating marginal value under uncertainty, have they given up any claim that could turn out wrong -- and if so, is that a problem for a tool like this, or the honest way to hold it? Which of the objections should a defender concede rather than deflect? I'd rather know what I'm giving up than be told the framework survives intact. And I'd like a verdict on whether the framework even has a determinate output, given that a cause isn't a natural kind and two people can agree on all the numbers and still carve the space differently. If you can produce a case where the framework and a straight marginal cost-effectiveness calculation come apart, use it -- that's the sort of thing that moves me.
reasoning: |-
  Okay, the user is a professor teaching a grad seminar on cause prioritization. They're using the Importance/Tractability/Neglectedness (ITN) framework but are having doubts. They want someone to play devil's advocate and present strong objections, even when the framework is interpreted charitably as a heuristic. The user mentioned three specific concerns: (a) interdependence of factors leading to double-counting, (b) false precision from multiplying qualitative values, and (c) the framework undermining itself when acted upon. They also want to know if the framework is unfalsifiable and whether it produces determinate outputs.

  First, I need to address each of their points decisively. Let's start with the interdependence issue. The user's colleague argues that neglectedness and tractability aren't independent because if a cause is intractable, people avoid it, making it neglected. Multiplying them might double-count. I should explain that this correlation isn't always true, but when it is, the framework over-penalizes such causes. For example, policy advocacy might seem intractable and thus neglected, but breakthroughs can happen, making the framework miss opportunities.

  Next, the false precision problem. Multiplying importance (moral weight) with tractability and neglectedness (empirical estimates) creates a pseudo-quantitative output. This masks value disagreements, like different views on animal suffering versus human health. The multiplication gives a false sense of objectivity, which could sideline important moral considerations.

  The self-erasure point: acting on neglectedness reduces it, making the cause less prioritized over time. This dynamic isn't unique to ITN but is inherent in competitive domains. However, the framework doesn't account for tipping points or coordination problems, leading to inefficiencies if everyone uses the same heuristic.

  Unfalsifiability is a concern. If defenders say ITN is just a way to estimate marginal value, it becomes a tautology. Without independent criteria, it's hard to test. This makes it non-predictive and limits its utility as a heuristic.

  Determinate output is another issue. Causes aren't natural kinds; how you define them affects ITN scores. For example, "malaria prevention" vs. "vector-borne diseases" changes neglectedness. Also, ITN might differ from cost-effectiveness analysis when there are diminishing returns or fixed costs. If a high-neglected area requires a large initial investment, CEA might show low marginal returns, while ITN suggests high priority.

  The user's deeper needs: they want to present a balanced view to students, acknowledging the framework's flaws without discarding it. They might seek validation of their suspicions and ways to teach critical thinking. They also need concrete examples to illustrate weaknesses, like the policy advocacy case or cause definition affecting scores. Conceding some points, like false precision and unfalsifiability, would strengthen their teaching by showing how to use the framework judiciously.
answer: |-
  Here’s a steelmanned case against the ITN framework, sorted by decisiveness—drawing on your own concerns while pushing them further. I’ll concede where objections hold water and flag where defenders might dig in.

  ### **Most Decisive: The False Precision Objection (Your Point B)**
  **Why it bites:** Importance isn’t just hard to quantify—it’s *incommensurable* across moral frameworks. Multiplying it with tractability (empirical) and neglectedness (empirical) creates a pseudo-quantitative output that masks value disagreements as technical ones.  
  - **Example:** Suppose Cause A (preventing human malaria) scores 8/10 in importance under a human-centric view. Cause B (reducing insect suffering) scores 2/10 under that view but 9/10 under a sentientist view. ITN multiplies these against tractability/neglectedness, spitting out a "score" that implies objective prioritization. Yet the output is wholly determined by the (arbitrary or contested) importance weighting.  
  - **Why it’s decisive:** The framework’s output *looks* like an engineering calculation but is fundamentally a value judgment in disguise. This risks "moral laundering"—dressing normative conflicts as optimization problems.  
  **Concede:** Yes. Defenders should admit ITN doesn’t resolve axiological disputes. It amplifies subjectivity under a veneer of rigor.

  ---

  ### **Highly Damaging: The Dynamic Self-Defeat (Your Point C)**
  **Why it bites:** ITN isn’t just reactive—it incentivizes coordination failures. If everyone uses ITN, they flock to causes with high neglectedness *until neglectedness evaporates*, creating boom-bust cycles and underinvestment in stable, high-impact work.  
  - **Example:** Climate change mitigation in 2010 had moderate tractability, high importance, but low neglectedness (many NGOs). By ITN, it scored poorly. Fast-forward: "neglected" causes like AI alignment now draw talent and funding, rapidly reducing neglectedness. If everyone abandons climate *now* because it’s "no longer neglected," we lose cumulative gains.  
  - **Why it stings:** ITN ignores path dependence, fixed costs, and tipping points. A cause may need sustained investment to reach tractability (e.g., mRNA vaccines). Treating neglectedness as a standalone factor misprices these dynamics.  
  **Concede:** This is a flaw, not a feature. ITN needs supplementation (e.g., "durability" of impact) to avoid myopia.

  ---

  ### **Serious but Fixable: Interdependence & Double-Counting (Your Point A)**
  **Why it nags:** Neglectedness and (perceived) intractability *are* correlated, but not perfectly. Multiplying them *over-penalizes* causes where the correlation fails.  
  - **Example:** Policy advocacy for prison reform. Many dismiss it as intractable (political inertia) → it stays neglected. But if a breakthrough occurs (e.g., bipartisan momentum), it suddenly becomes tractable. ITN’s product would have undervalued it *precisely because* others misjudged tractability.  
  - **Why it’s messy:** This isn’t double-counting—it’s *noise amplification*. The framework’s multiplicative structure exaggerates errors in estimating any one factor.  
  **Deflect?** Partially. Correlation isn’t destiny. With nuanced estimation (e.g., "tractability *conditional on sufficient investment*"), ITN survives. But it requires epistemic humility.

  ---

  ### **The Unfalsifiability Trap**
  **The risk:** If ITN is *defined* as "a proxy for marginal impact," it becomes tautological. Any critique can be dismissed with "you misapplied the heuristic."  
  - **Why it matters:** Unfalsifiable heuristics can’t be improved. If ITN ranks a cause highly that later fails, defenders say "tractability was misestimated." If it misses a big win, they say "neglectedness wasn’t captured."  
  - **Verdict:** ITN *is* unfalsifiable if held loosely. **Fix:** Tie it to testable predictions (e.g., "Causes with ITN scores >X should attract funding and show ROI within Y years"). Without this, it’s storytelling, not a tool.

  ---

  ### **The Indeterminacy Problem**
  **Why outputs aren’t objective:** Causes aren’t atoms—they’re arbitrarily carved. Two groups can agree on ITN inputs but rank differently by scoping causes broadly vs. narrowly.  
  - **Example:** Compare:  
    - Cause 1: "Reduce malaria in Sub-Saharan Africa" (low neglectedness)  
    - Cause 2: "Scale gene drives for *Anopheles* in Benin" (high neglectedness)  
    Same problem, different neglectedness. ITN can’t resolve the "right" level of abstraction.  
  - **Clincher case vs. cost-effectiveness:** Suppose a charity has high fixed costs (e.g., building labs). Marginal cost-effectiveness analysis (CEA) might show low returns until scale is reached. ITN, by prioritizing neglectedness, could falsely flag it as high-priority *too early*, ignoring startup costs. ITN ≠ CEA when economies of scale exist.

  ---

  ### **What to Concede**
  1. **ITN doesn’t handle moral trade-offs.** It’s silent on whether a 1% increase in AI safety is "worth" a 10% decrease in pandemic preparedness.  
  2. **It’s unstable under intervention.** Use it naively, and it dissolves its own premises.  
  3. **It’s not a computation—it’s a conversation starter.** The numbers are props to force explicit reasoning.  

  ### **What to Defend**
  - As a *screening tool* for new entrants, ITN beats unstructured intuition.  
  - When impact is uncertain, neglectedness *does* signal opportunity (e.g., early-stage science).  

  **Final verdict:** ITN’s value isn’t in its output—it’s in forcing clarity on *why* we disagree. Teach it as a "debugging tool" for biases (e.g., glamour-driven resource allocation), not an oracle. The second you see students treating the product as gospel, hit delete.
