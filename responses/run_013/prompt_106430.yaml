  Possible readings:

  1. **Epistemic Openness (Thinnest)**: The future is not known to us (or not knowable in advance). This is about our lack of knowledge.
     - Presuppositions: It does not require indeterminism or truth-value gaps. Even in a deterministic world, we might not know the future.
