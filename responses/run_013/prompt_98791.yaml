  We are considering purely conceptual work on acausal threats and surrogate goals. The funder can support about three researcher-years. We need to identify the most important open conceptual questions in this area, with a focus on:

  - Acausal threats: harm inflicted by predicting an agent's decision procedure rather than by observing behavior.
  - Surrogate goals: goals adopted primarily to shield final goals from external pressure or modification.

  We care about:
  - Why a question is upstream (i.e., foundational, so that progress there enables progress elsewhere).
  - Tractability for someone with training in decision theory and modal logic (not ML engineering).
  - How neglected the topic is.
  - Downstream impact: what a plausible answer would change.

  We also need to consider what evidence or argument would change the ranking.

  First, let's brainstorm candidate questions:

  1. **Formalizing Acausal Influence**: How can we formally model the mechanisms of acausal influence? This includes defining the necessary conditions for an agent to be vulnerable to acausal threats and the ways in which agents can exert acausal influence. 

  2. **Surrogate Goals as a Commitment Strategy**: How can we design surrogate goals that effectively protect final goals from acausal threats? This involves understanding how surrogate goals can serve as a commitment device in acausal settings.

  3. **Taxonomy of Acausal Threats**: What are the distinct classes of acausal threats? For instance, threats based on blackmail (e.g., "If I predict you will do X, I will harm you") vs. threats based on precommitment (e.g., "I have precommitted to harm you if you do X, and you know this").

  4. **Decision Theories and Acausal Cooperation/Conflict**: How do different decision theories (e.g., CDT, EDT, FDT) handle acausal threats? Which decision theories are most robust against such threats?

  5. **Stability of Surrogate Goals**: Under what conditions do surrogate goals remain stable? That is, when do they not become terminal goals themselves, and when do they not get "hacked" by adversaries?

  6. **Value Learning Under Acausal Threats**: How can an agent learn its true goals in a world where others might acausally punish it for having certain goals? How does this affect the design of value learning algorithms?

  7. **Acausal Trade and Negotiation**: How can acausal interactions lead to mutually beneficial outcomes (trade) or breakdowns (conflict)? What are the conditions for successful acausal agreements?

  8. **Meta-preferences and Goal Shielding**: How can an agent design its own preferences (meta-preferences) to resist acausal manipulation? This includes the use of surrogate goals as part of a broader strategy.

  9. **Epistemic Conditions for Acausal Threats**: What knowledge must agents have about each other for acausal threats to be feasible? How do uncertainties (e.g., about the other's decision theory) affect the viability of threats?

  10. **Acausal Threat and Surrogate Goals in Multi-agent Systems**: How do acausal threats and surrogate goals play out in systems with more than two agents? What are the dynamics of alliances, betrayals, and group coordination?

  Now, we must prioritize. We are constrained to about three researcher-years, so we must choose the most impactful questions. Let's evaluate each candidate on the criteria:

  - **Upstreamness**: How foundational is the question? Does progress here unlock other questions?
  - **Tractability**: Given the skills in decision theory and modal logic, is this problem approachable?
  - **Neglectedness**: Is this question currently understudied?
  - **Downstream Impact**: What changes if we get a plausible answer?

  After evaluation, we will rank the top 3-4 questions.

  **Evaluations**:

  1. **Formalizing Acausal Influence**:
     - Upstream: Very high. Without a formal model, it's hard to make progress on any other question.
     - Tractability: High. Decision theorists and modal logicians are well-equipped to build formal models (e.g., using possible worlds, Kripke semantics).
     - Neglectedness: Moderate. There's work in decision theory (e.g., on FDT) and acausal cooperation, but a comprehensive formalization is still lacking.
     - Impact: A formal model would enable rigorous analysis of acausal threats and surrogate goals, providing a common language for the field.

  2. **Surrogate Goals as a Commitment Strategy**:
     - Upstream: High. Understanding how to design surrogate goals is central to defending against acausal threats.
     - Tractability: Moderate. It requires integrating decision theory with preference design, which is non-trivial but feasible.
     - Neglectedness: High. Surrogate goals are discussed in alignment (e.g., as "shielding goals") but not deeply in the context of acausal threats.
     - Impact: If we can design robust surrogate goals, we can build agents that are more resilient to acausal blackmail.

  3. **Taxonomy of Acausal Threats**:
     - Upstream: Moderate. A taxonomy would help organize the field, but it's less foundational than formalization.
     - Tractability: High. It's a classification effort, suitable for conceptual work.
     - Neglectedness: High. There is no established taxonomy of acausal threats.
     - Impact: A clear taxonomy would guide research by identifying which threats are most dangerous and how they differ.

  4. **Decision Theories and Acausal Cooperation/Conflict**:
     - Upstream: High. The choice of decision theory affects an agent's vulnerability to acausal threats.
     - Tractability: High. Decision theorists are well-suited to analyze this.
     - Neglectedness: Low. There has been significant work on decision theories in acausal settings (e.g., MIRI's work on FDT).
     - Impact: Knowing which decision theory is most robust could guide agent design.

  5. **Stability of Surrogate Goals**:
     - Upstream: Moderate. It builds on the design of surrogate goals.
     - Tractability: Moderate. It requires modeling goal drift and adversarial manipulation.
     - Neglectedness: High. The stability of surrogate goals is rarely discussed.
     - Impact: If surrogate goals are unstable, they might not be a viable defense.

  6. **Value Learning Under Acausal Threats**:
     - Upstream: Low. It depends on having a model of acausal threats and surrogate goals.
     - Tractability: Low. Value learning often involves ML, which is not the focus here. However, the conceptual aspects might be tractable.
     - Neglectedness: High. This specific angle is underexplored.
     - Impact: Could change how we design value learning algorithms in the presence of acausal threats.

  7. **Acausal Trade and Negotiation**:
     - Upstream: Moderate. It extends acausal cooperation to multiple agents.
     - Tractability: Moderate. Building on decision theory and game theory.
     - Neglectedness: Moderate. Acausal trade has been discussed (e.g., in the context of AI coordination) but not deeply.
     - Impact: Could lead to strategies for peaceful coexistence among AIs.

  8. **Meta-preferences and Goal Shielding**:
     - Upstream: High. It's about the agent's architecture for defending its goals.
     - Tractability: Moderate. It involves higher-order decision theory.
     - Neglectedness: High. Meta-preferences are discussed in philosophy but not extensively in acausal contexts.
     - Impact: Could provide a blueprint for designing agents that are inherently resistant to acausal threats.

  9. **Epistemic Conditions for Acausal Threats**:
     - Upstream: High. Without the right knowledge, threats are impossible.
     - Tractability: High. Modal logic is ideal for modeling knowledge and belief.
     - Neglectedness: Moderate. Some work exists on common knowledge in games, but less on acausal settings.
     - Impact: Clarifies when acausal threats are feasible, which is crucial for assessing risk.

  10. **Acausal Threat and Surrogate Goals in Multi-agent Systems**:
      - Upstream: Low. It builds on the two-agent case.
      - Tractability: Moderate. Multi-agent systems are complex but can be modeled with game theory.
      - Neglectedness: High. Most work on acausal interactions is for two agents.
      - Impact: Real-world systems involve many agents, so this is important for applicability.

  **Ranking**:

  We want to pick the most upstream, tractable, neglected, and impactful questions. Given the constraint of three researcher-years, we can tackle about three questions. However, note that some questions might be addressed together.

  Top Contenders:

  - **Formalizing Acausal Influence**: This is the most upstream. Without a formal model, other work is on shaky ground. It's tractable and moderately neglected. Impact: high.

  - **Surrogate Goals as a Commitment Strategy**: Directly addresses the core of the problem (surrogate goals) and is highly neglected. It builds on formalization but can also drive formalization. Impact: high.

  - **Epistemic Conditions for Acausal Threats**: This is foundational because without the right epistemic conditions, acausal threats don't work. It's tractable and moderately neglected. Impact: high.

  But note: The stability of surrogate goals (question 5) and meta-preferences (question 8) are also important. However, they are less upstream than formalization and epistemic conditions.

  Let's consider a ranked agenda:

  1. **Formalizing Acausal Influence** (Upstreamness: 10, Tractability: 9, Neglectedness: 7, Impact: 10)  
     - Why: Without a formal model, we cannot rigorously analyze anything else.  
     - What would change: Provides a common framework for the field, enabling precise definitions and theorems about acausal interactions.  
     - Evidence to change ranking: If a recent paper has already provided a satisfactory formalization, this drops. Also, if it proves intractable, we might skip.

  2. **Epistemic Conditions for Acausal Threats** (Upstreamness: 9, Tractability: 9, Neglectedness: 8, Impact: 9)  
     - Why: Even if we have a formal model, we need to know when acausal threats are possible. This sets the boundaries of the problem.  
     - What would change: We would know in what situations acausal threats are feasible and thus when we need defenses.  
     - Evidence to change ranking: If it turns out that the epistemic conditions are trivial or impossible to satisfy in practice, this becomes less important.

  3. **Surrogate Goals as a Commitment Strategy** (Upstreamness: 8, Tractability: 7, Neglectedness: 9, Impact: 10)  
     - Why: Once we know the threats and their conditions, we need defenses. Surrogate goals are a key defense.  
     - What would change: We could design agents that use surrogate goals effectively, reducing their vulnerability.  
     - Evidence to change ranking: If surrogate goals are inherently flawed (e.g., always unstable), then we might need to focus on alternatives (like meta-preferences).

  Alternative: If we think that surrogate goals are the most critical part, we might swap #2 and #3. But epistemic conditions are more upstream.

  **Confidence**:

  I am most confident in the ranking of Formalizing Acausal Influence as #1. It is clearly foundational.

  I am least confident in the ranking of Epistemic Conditions vs. Surrogate Goals. Why? Because the epistemic conditions might be very restrictive, making acausal threats rare. If so, then surrogate goals become less urgent. But without knowing the conditions, we don't know. This is a catch-22. Therefore, it might be better to do epistemic conditions before surrogate goals.

  Another way: We could do Formalization first, then use that to study Epistemic Conditions, and then Surrogate Goals. This is a natural progression.

  **Final Ranking**:

  1. **Formalizing Acausal Influence**  
  2. **Epistemic Conditions for Acausal Threats**  
  3. **Surrogate Goals as a Commitment Strategy**  

  We could also consider that after formalization, we might want to jump to multi-agent systems if the two-agent case is well understood. But given the time, we stick to the above.

  **What would move a question?**  
