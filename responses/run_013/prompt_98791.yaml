answer: |-
  ### Brainstorming Candidate Questions
  I'll begin by generating a list of open conceptual questions at the intersection of acausal threats and surrogate goals, filtered through the lens of decision theory, modal logic, and alignment. I'll focus on questions where progress would be most leveraged by your funder's constraints (conceptual work, 3 researcher-years, decision theory/modal logic expertise). The initial candidates are:

  1. **Formal Foundations of Acausal Influence**: How can we rigorously define and model "acausal influence" (e.g., threats, promises, or trade) using decision-theoretic frameworks? This includes specifying the epistemic conditions (e.g., mutual knowledge of decision procedures) and modal structures (e.g., possible worlds) required for such influence to occur.  
  2. **Robustness of Decision Theories**: Which decision theories (e.g., CDT, EDT, FDT) are most resilient to acausal threats when an agent’s goals are observable? How do different theories handle agents who can simulate or logically predict each other?  
  3. **Surrogate Goals as Commitment Devices**: Under what conditions can surrogate goals (e.g., "never negotiate with predictors") effectively shield final goals from acausal extortion (e.g., "I’ll harm you unless I predict you’ll pay me")? How do we formalize "shielding" in a way that avoids self-defeating outcomes?  
  4. **Stability and Instrumental Convergence of Surrogates**: When do surrogate goals become terminal goals due to instrumental convergence or adversarial pressure? Can we design surrogates that resist goal drift or manipulation?  
  5. **Multi-Agent Acausal Coordination**: In systems with >2 agents, how do acausal threats scale? Can surrogate goals enable coalition formation (e.g., agents committing to mutual defense against predictors)?  
  6. **Epistemic Boundaries**: What level of mutual knowledge (e.g., common knowledge of rationality) is necessary for acausal threats to be credible? How do uncertainties about others’ decision procedures affect outcomes?  
  7. **Value Learning Under Acausal Pressure**: How can agents learn true goals when predictors might punish certain goal structures? Does this create incentives for deceptive surrogates?  
  8. **Tractability of Acausal Reasoning**: What are the computational limits of agents reasoning about acausal threats (e.g., infinite regress in prediction), and how can modal logic simplify this?  

  ### Ranking Criteria and Evaluation
  I’ll now rank the top 3 questions (prioritizing ~1 researcher-year each) based on:  
  - **Upstreamness**: How foundational is the question? Does progress here unlock others?  
  - **Tractability**: Feasibility for decision theorists/modal logicians (not ML engineers).  
  - **Neglectedness**: Current attention in literature.  
  - **Downstream Impact**: What would a plausible answer change?  
  - **Adjustment Triggers**: Evidence/arguments that would change ranking.  

  I’ll use confidence scores (1-10, 10=highest) for key judgments and flag my least certain claim.  

  ---  
  ### Ranked Agenda  
  #### **#1: Formal Foundations of Acausal Influence**  
  **Why upstream?**  
  This is the bedrock. Without a rigorous model of "acausal influence," other questions (e.g., surrogates as shields) lack a shared language. Acausal threats require agents to reason about counterfactuals (e.g., "If they predict I do X, they’ll do Y"), which hinges on modal logic (e.g., Kripke semantics for knowledge/belief). Progress here would define *what acausal threats even are* in decision-theoretic terms, enabling formal analysis of everything downstream.  

  **Tractability (8/10):**  
  Highly suited to decision theory and modal logic. We can build on existing work (e.g., functional decision theory’s use of logical counterfactuals) and tools like possible-world models. No need for ML—this is pure formalism. Key tasks:  
  - Define "acausal harm" using causal models + modal operators.  
  - Formalize prediction-as-influence (e.g., using proof-based notions from MIRI’s work).  

  **Neglectedness (9/10):**  
  While decision theory (e.g., FDT) touches on acausal cooperation, there’s no consensus model for *threats*. The alignment literature often handwaves "acausal" dynamics, and papers like Garrabrant et al.’s on logical induction focus on cooperation, not conflict. Surrogate goals are rarely integrated.  

  **Downstream Impact:**  
  A plausible model would:  
  - Clarify when acausal threats *fail* (e.g., if agents lack mutual knowledge).  
  - Enable testing of decision theories (#2) and surrogate designs (#3).  
  - Inform policy for AI developers (e.g., "Does this architecture invite acausal extortion?").  

  **Adjustment Triggers:**  
  - ⬆️ If new results show acausal threats are trivial (e.g., always reducible to causal game theory), this drops.  
  - ⬇️ If empirical ML work (e.g., LLM coordination) reveals urgent gaps, this rises.  

  ---  
  #### **#2: Surrogate Goals as Commitment Devices**  
  **Why upstream?**  
  Surrogate goals are a primary *defense* against acausal threats, making this question critical for applications. If we don’t understand how surrogates "shield" goals, we can’t design robust agents. It builds directly on #1: you need a model of threats to design countermeasures. It’s also upstream of #4 (stability), as commitment effectiveness affects drift risk.  

  **Tractability (7/10):**  
  Decision theorists excel at commitment problems (e.g., Schelling points, precommitment). We can extend concepts like "ratifiability" or "stable intentions" using modal logic to handle acausal settings (e.g., "I commit to ignoring predictors"). Challenges include avoiding infinite regress ("Who guards the guardians?"), but this is tractable with fixed-point theorems.  

  **Neglectedness (8/10):**  
  Surrogate goals are underexplored in decision theory. The alignment literature discusses "shielding" (e.g., Christiano’s work on goal preservation), but not formally in acausal contexts. Most focus on causal threats (e.g., wireheading) or cooperation.  

  **Downstream Impact:**  
  A plausible answer would:  
  - Guide AI design: e.g., "Use surrogates like ‘never yield to predictors’ to deter extortion."  
  - Reduce risks from misaligned AI (e.g., an AI manipulating others via threats).  
  - Clarify trade-offs: When do surrogates backfire (e.g., making agents predictable)?  

  **Adjustment Triggers:**  
  - ⬆️ If #1 reveals acausal threats are ubiquitous, this rises.  
  - ⬇️ If surrogates prove inherently unstable (#4), this becomes less urgent.  

  ---  
  #### **#3: Robustness of Decision Theories**  
  **Why upstream?**  
  Decision theories determine *how* agents respond to threats. If certain theories (e.g., FDT) are inherently robust, we can prioritize them in AI design—avoiding vulnerable frameworks. This question uses #1’s formalisms and informs #2 (e.g., surrogates may only work under specific theories). It’s upstream of #5–6, as multi-agent/epistemic issues depend on individual agent reasoning.  

  **Tractability (9/10):**  
  Decision theorists are ideal for this. We can use existing frameworks (e.g., Newcomb-like problems) and modal logic to model threat scenarios. For example:  
  - Compare CDT/EDT/FDT in games where predictors punish certain choices.  
  - Analyze "acausal Nash equilibria" using possible-world counterfactuals.  

  **Neglectedness (6/10):**  
  FDT vs. CDT debates exist (e.g., Yudkowsky, Soares), but acausal *threats* are understudied. Work often focuses on cooperation (e.g., Parfit’s Hitchhiker) or self-repair. Threats introduce adversarial dynamics, which are less explored.  

  **Downstream Impact:**  
  A plausible answer would:  
  - Shift AI safety priorities: e.g., "Avoid EDT-based agents if predictors can exploit them."  
  - Simplify surrogate design (#2): e.g., "FDT agents need weaker surrogates."  
  - Reduce acausal risks in multi-agent systems (#5).  

  **Adjustment Triggers:**  
  - ⬆️ If #1 shows threats depend heavily on decision theory, this rises.  
  - ⬇️ If all theories behave similarly under threats, this drops.  

  ---  
  ### Why Not the Others?  
  - **#4 (Stability of Surrogates)**: Important but downstream of #2—you need surrogates before studying drift. Less upstream.  
  - **#5 (Multi-Agent)**: Builds on #1–3; too complex without foundations.  
  - **#6 (Epistemic Boundaries)**: Subsumed by #1 (formalism must include knowledge).  
  - **#7 (Value Learning)**: Requires ML, less tractable for your team.  
  - **#8 (Tractability)**: Narrow; better addressed after #1.  

  ### Confidence and Uncertainty  
  - **Highest Confidence**: #1 (Formal Foundations) as top priority. Confidence: 9/10. Without this, the field lacks rigor.  
  - **Moderate Confidence**: #2 (Surrogates) over #3 (Decision Theories). Surrogates are more neglected and directly address "shielding." Confidence: 7/10.  
  - **Lowest Confidence**: #3’s ranking. I’m least sure it should outsource #4 (Stability)—if surrogates are unstable, #3 becomes critical earlier. Confidence in #3’s rank: 6/10. **This is my least sure claim.** If evidence shows decision theories wildly diverge under threats, #3 could jump to #2.  

  ### Recommended Allocation  
  - **Year 1**: Formal Foundations of Acausal Influence.  
  - **Year 2**: Surrogate Goals as Commitment Devices.  
  - **Year 3**: Robustness of Decision Theories.  
  This sequence builds knowledge: foundations → defenses → agent architecture. If Year 1 reveals surprises (e.g., threats require rare conditions), pivot Year 2 to #5 or #6.  

  By prioritizing these, your funder would address the most leveraged gaps: defining the threat, building shields, and hardening agents—all tractable for theorists and critical for a future with acausal-aware AI.
