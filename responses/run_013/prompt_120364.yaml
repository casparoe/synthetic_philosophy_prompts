prompt: |-
  ok so i'm building a grad seminar unit on thought experiments in science -- how the hell do they give us knowledge -- and i want the checklist *before* i get to the theories. every reading i've got tells me how one thought experiment works and then generalizes, and i keep wanting to say: ok but thats not a requirement, thats your answer. so write me the desiderata. not the accounts, the spec. what does any account of thought-experimental knowledge have to deliver to be worth taking seriously?

  things i think i want on the list, but push back if i'm wrong to want them:

  the central weirdness. you're in a chair. nothing is measured, nobody new is consulted, no data enters the room. and you walk out with a belief about how the world actually is -- or at least with the strong sense that you've discovered something. any account has to either (a) explain how that's possible or (b) say the sense of discovery is a psychological illusion and the real epistemic work is being done by something else: the premises, the formalism, a hidden appeal to prior experience, whatever. and it has to tell me which of the two it's doing. a story that quietly does (b) while talking like (a) is the thing i most want flagged.

  the case zoo. it has to get the standard cases right, and i dont just mean wave at them: the two weights tied together, Maxwell's demon, the twin who comes home young, Newton's bucket, the cat in the box. and it has to treat them as *one kind of thing*, or tell me why they aren't. an account that handles the ones where you imagine a little machine (demon, cat) but falls over on the ones where you imagine a law of motion is a theory of something else wearing this theory's name.

  heres the injection i actually care about. split the cases two ways and tell me if the split is load-bearing: thought experiments where the scenario is *physically impossible* (demon, cat, the young twin) vs thought experiments where the scenario is perfectly possible but nobody's built it yet (the elevator, the tied weights, chasing a light beam). does an adequate account have to treat these differently? because it *feels* like the impossible ones can only be doing argument-work, while the possible ones are standing in for an experiment that just hasn't happened yet -- but i'm not sure thats right, and i want the requirement stated in a way that doesn't just assume the answer.

  then this: what makes one go *wrong*? thought experiments misfire, get retracted, get reinterpreted a century later (the demon, for instance, only gets settled once you've got a theory of information in hand). an account that can only explain the successes isn't a theory of the method, its a theory of the hits. so the spec needs a clause: it must say what a *failed* thought experiment is, and whether the failure is the scenario's fault, the intuition's fault, or the background theory's fault.

  the distinctions it cant collapse, with a line on why each matters: thought experiment vs. real experiment; thought experiment vs. plain argument in vivid dressing (theres a whole fight about whether the first is just the second -- dont resolve it, but your spec has to be neutral enough that both sides can sign on, or say why one side is a non-starter); the verdict on the imagined case vs. the intuition that delivers the verdict; and discovery vs. justification.

  last thing, and this is the part i most want. tell me if any of these cant all be had at once. my suspicion: "yields genuinely new knowledge about the world" + "brings in no new empirical input" + "all knowledge of the world is empirical" is already a contradiction, so one of my three has to go -- which one, and does the choice just *determine* the rest of your theory for you? if theres another pair like that, name it. then tell me which single requirement on the list does the most throat-cutting, i.e. which one most of the going accounts die on.

  dont score the accounts, i'll do that in class. i want the list, the case or consideration behind each item, and a marker on which are non-negotiable and which are just one camp's taste. a seperate column saying what each requirement would look like if you denied it would be great, but i can live without it. table's fine.
reasoning: |-
  Okay, the user is building a grad seminar unit on thought experiments in science and wants a checklist of desiderata for any account of how thought experiments provide knowledge. They're frustrated that existing readings generalize from specific cases instead of laying out neutral criteria upfront.

  Hmm, the user is clearly an academic - probably a philosophy or HPS professor given the depth and "grad seminar" context. Their frustration with theories that smuggle in solutions while posing as neutral analyses suggests they've been burned by partisan literature before. Smart request for a pre-theoretical spec sheet.

  Let me unpack their core concerns:
  First, the "central weirdness" - how can sitting in a chair generate worldly knowledge? Any account must either explain the magic or demystify it as disguised argumentation. This feels non-negotiable.

  Second, the "case zoo" requirement - theories must handle both physically impossible scenarios (Schrödinger's cat) and merely unperformed ones (Galileo's weights) without special pleading. The user suspects impossible cases might be pure argument while possible ones proxy for real experiments - but wisely wants this treated as an open question.

  Third, failure conditions - can't just explain successes. Need to diagnose why some thought experiments age poorly (like Maxwell's demon awaiting information theory). This is crucial for showing it's a methodology, not just lucky guesses.

  Fourth, key distinctions that mustn't be collapsed: thought vs real experiments, thought experiments vs dressed-up arguments, intuitions vs verdicts, discovery vs justification. The user specifically wants neutrality on the argument-vs-experiment debate.

  Finally, the trilemma they call "the injection": how can thought experiments yield new empirical knowledge without new empirical inputs? They sense this may be impossible without sacrificing one pillar. Also asks which desideratum kills most theories.

  Right, structuring this as a table makes sense per their request. For each desideratum I'll note: the requirement, why it matters, whether negotiable, and what denial looks like. The non-negotiables seem to be: explaining the weirdness (1), covering all cases (2), handling failures (4), and maintaining key distinctions (5). The modality question (3) and trilemma (6) might be more debatable.

  The trilemma is especially thorny. If all knowledge is empirical and thought experiments bring no new inputs, how can they generate new knowledge? Accounts must either: deny they yield genuinely new knowledge (e.g. just reorganize old data), deny the "no new inputs" claim (e.g. intuitions are quasi-empirical), or deny empiricism's full coverage (e.g. some knowledge is a priori). This does often determine a theory's shape - Brown's rationalism vs Norton's argumentalism hinges here.

  For the "throat-cutting" item: I'd say #2 (case coverage) eliminates the most theories. Many accounts handle either the possible-but-unperformed experiments (like Galileo's) OR the impossible ones (like Einstein's), but few smoothly cover both. Mach's empiricism struggles with quantum cats, while Kuhn's gestalt shifts don't explain why Newton's bucket worked before relativity.

  Should also flag that requirement #5d (discovery vs justification) is where theories diverge most - some see thought experiments as discovery tools, others as mere justification devices. But that's more a theory-choice point than a throat-cutter.

  User's instinct about the impossible/possible split being load-bearing is sharp. Will note in the table that accounts must either treat them uniformly or justify differential treatment - but not assume either position upfront.

  ...Almost forgot the "denial" column they wanted. For example, denying #1 might mean claiming thought experiments are just rhetorical. Denying #4 could involve only analyzing successful cases. This'll help students spot theoretical commitments.

  Final thought: The user's "which requirement can't all coexist" question is brilliant pedagogy. Forcing theories to show their cards on the trilemma will make seminar debates explosive. Might add in notes that #6 is the philosophical tripwire.
answer: |-
  Here’s your pre-theoretical desiderata checklist for accounts of thought-experimental knowledge, structured as requested. Non-negotiables (NN) are core to *any* plausible account; negotiables (N) reflect debates where theories may reasonably diverge.

  | # | Desideratum                                                                 | Case/Consideration Behind It                                                                                                  | Non-Negotiable (NN) / Negotiable (N) | What Denial Looks Like                                                                 |
  |---|-----------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------|---------------------------------------|----------------------------------------------------------------------------------------|
  | 1 | **Explain the "Chair Problem"**<br>Account must resolve how knowledge emerges from introspection alone. | Galileo’s falling bodies: You "see" tied weights fall at intermediate speed, realize this is absurd, conclude all fall equally. | NN                                    | Dismisses the epistemic puzzle (e.g., "It’s just rhetoric" or "All knowledge was already implicit"). |
  | 2 | **Cover the "Case Zoo" Uniformly**<br>Must handle both conceptual (laws) and mechanistic (devices) cases as instances of the *same* phenomenon. | Schrödinger’s Cat (device) vs. Newton’s Bucket (law/absolute space). Treating these as fundamentally different fails the test. | NN                                    | Fragments the phenomenon (e.g., "Cat is modeling, Bucket is pure logic") or excludes key cases. |
  | 3 | **Articulate Modality Sensitivity**<br>Must address whether physical possibility of the scenario affects epistemic mechanism. | Maxwell’s Demon (impossible) vs. Einstein’s Elevator (possible). Does impossibility change *how* it delivers knowledge? | N                                     | Ignores modality (e.g., "All TEs work the same way") or overemphasizes it (e.g., "Only possible TEs are valid"). |
  | 4 | **Account for Failure**<br>Must explain how/why TEs fail, and locate the failure (scenario, intuition, background theory). | Maxwell’s Demon: Initially "proved" 2nd Law statistical; later reinterpreted with info theory. Failure wasn’t in imagination but background assumptions. | NN                                    | Only analyzes successes (e.g., "Failures are misapplications, not part of the method"). |
  | 5 | **Preserve Key Distinctions**<br>Must not collapse:<br>a) TE vs. real experiment<br>b) TE vs. vivid argument<br>c) Intuition vs. verdict<br>d) Discovery vs. justification | Twin Paradox (TE) vs. actual atomic clock measurements (real exp.); Mary’s Room (intuition-driven) vs. reductio ad absurdum (argument). | NN (for a,c,d)<br>N (for b)           | Conflates TEs with arguments (e.g., "All TEs are just deductive inferences") or treats intuitions as incorrigible. |
  | 6 | **Resolve the Trilemma**<br>Must position itself on:<br>– New knowledge?<br>– No new empirical input?<br>– All knowledge empirical? | Einstein chasing light beam: Feels like discovery, but empiricism says no new input → no new empirical knowledge. | NN (must address)                     | Avoids the tension (e.g., "TEs clarify concepts, don’t produce knowledge") or embraces mystery ("Intuition is a direct conduit"). |

  ---

  ### Critical Notes & Throat-Cutters:
  1. **The Trilemma (Desideratum 6) is the philosophical tripwire**:  
     - Most accounts sacrifice one leg:  
       - **Rationalism** (e.g., Brown): Denies "all knowledge empirical" (posits a priori insight).  
       - **Argumentsim** (e.g., Norton): Denies "genuinely new knowledge" (unpacks implicit premises).  
       - **Mental Models** (e.g., Nersessian): Denies "no new input" (treats simulation as quasi-empirical).  
     - **Throat-cutter**: If your account *insists* on all three, it collapses (e.g., naive empiricism).  

  2. **The Ultimate Throat-Cutter: Desideratum 2 (Case Zoo Coverage)**  
     - Most theories die here:  
       - **Empiricist/constructivist** accounts (e.g., Mach) struggle with *impossible* cases (e.g., quantum TEs).  
       - **Intuitionist/rationalist** accounts (e.g., Sorensen) struggle with *mundane* cases (e.g., Galileo’s weights as deduction).  
       - **Argumentsim** (Norton) reduces everything to deduction, making "experimental" aspect metaphorical.  

  3. **Load-Bearing Split? (Desideratum 3 - Modality)**  
     - The *possible vs. impossible* split **is** load-bearing:  
       - Accounts that treat TEs as *experiment substitutes* (e.g., Kuhn) fail for impossible scenarios.  
       - Accounts that treat TEs as *conceptual probes* (e.g., Brown) better handle impossibility.  
     - **Requirement**: The account must *either* unify the cases *or* justify why modality matters epistemically.  

  4. **Non-Negotiables Define the Phenomenon**:  
     If an account fails 1, 2, 4, or 5, it’s not explaining TEs—it’s explaining something else (e.g., deduction, modeling, or pedagogy).  

  ---

  ### Teaching Utility:
  - **Trilemma (6)** forces students to see how a theory’s core commitments (empiricism/rationalism) dictate its answer.  
  - **Failure (4)** prevents hagiography of TEs and highlights their theory-dependence.  
  - **Modality (3)** tests whether "thought experiment" is a single category.  
  - **Case Zoo (2)** is the quickest filter for inadequate theories.  

  Use this to dissect readings: *"Where does Brown sacrifice empiricism to save discovery? How does Norton handle Schrödinger’s Cat? Why can’t Kuhn’s paradigm shifts explain Galileo?"* This turns the "case zoo" into a litmus test.
