prompt: |-
  I host a small podcast on decision theory, and next week's guest is a theorist who argues that superrationality — the rule of choosing as though every agent who reasons like you will reach the same decision — is the correct principle of choice, and who defends it by appeal to the Platonia dilemma (a trillionaire promises a billion dollars to the one person, out of twenty, who sends a telegram, provided that exactly one telegram arrives) and the Luring Lottery (a prize of one million dollars is divided among all entries, so the fewer the entries the larger the share). Draft eight to ten interview questions that force him to defend the view rather than restate it, and for each question include a follow-up aimed at the answer he is most likely to give. At a minimum, cover: (a) the reference-class problem — how he identifies the agents whose reasoning must mirror his, and what the view says when some of them are known to reason differently; (b) why the Platonia dilemma's recommended action is a mixed strategy (send the telegram with probability one in twenty) when the view's whole appeal is that identical reasoners converge on a single answer; and (c) the Luring Lottery's runaway dynamic, in which the individually best reply is to submit as many entries as everyone else combined — the actual contestants answered with astronomically large numbers — and whether this reveals the view as a coordination norm that presupposes everyone is already on board rather than a decision procedure for actual agents. Also press him on the charge of magical thinking (that his choice is being treated as a cause of others' choices) and on how he extends a rule defined only for symmetric games to asymmetric ones. He has mentioned running a modified Luring Lottery in which entry was free but a lone entrant collected a large bonus on top of the divided prize; include a question on what that variant exposes about the difference between superrationality and evidential decision theory.
reasoning: |-
  Okay, the user hosts a decision theory podcast and needs interview questions for a superrationality theorist. They want pointed questions that force defense rather than restatement, specifically covering reference-class problems, mixed strategies in Platonia, Luring Lottery dynamics, magical thinking accusations, asymmetric game extensions, and a variant lottery comparison to evidential decision theory.

  Hmm, the user clearly understands the subject deeply - they're using precise terminology like "reference-class problem" and "runaway dynamic," and even referenced the theorist's modified Luring Lottery variant. This suggests they need professional-grade questions that match their audience's sophistication. The challenge is crafting questions that are incisive without being hostile - after all, it's a podcast interview, not a cross-examination.

  Let me unpack their requirements systematically. First, the reference-class problem: How does superrationality handle cases where some agents are known to reason differently? The follow-up should anticipate the theorist's likely distinction between "true" superrational agents and outliers, then press on whether this creates circularity. 

  For Platonia's mixed strategy paradox, the core tension is how identical reasoning leads to probabilistic divergence. The follow-up must challenge whether this contradicts superrationality's promise of unique solutions. I recall Hofstadter's original formulation actually embraces this as a "group mind" solution - the question should force the theorist to either defend that or explain the inconsistency.

  The Luring Lottery critique is devastating - real-world players submitted enormous numbers (like 10^9 entries!), proving superrationality fails as practical advice. The follow-up should corner them into admitting it only works when universally adopted, reducing it to a coordination norm rather than true decision theory. 

  On magical thinking, the question needs to expose the acausal correlation premise - treating one's choice as evidence of others' identical choices. The follow-up should demand how this differs from flat-out believing in psychic causation. 

  For asymmetric games, the theorist must either admit superrationality's limits or propose controversial symmetry-breaking mechanisms. The follow-up should test their extension method with concrete asymmetric examples.

  Finally, the free-entry lottery variant perfectly isolates the difference between superrationality (which would still avoid entering to preserve symmetry) and evidential decision theory (which might enter hoping others stayed out). The follow-up should make them confront why their approach rejects dominant strategies in such cases.

  Throughout, the tone should remain collegial but uncompromising - after all, the user wants their guest to actually sweat a little. I'll structure each question with a sharp opener followed by a pre-emptive counter to their probable reply. The goal isn't to ambush but to elicit the most rigorous defense possible for the listeners.
answer: |-
  Here are 8 targeted interview questions probing the core challenges of superrationality, designed to elicit defense rather than restatement, with anticipated answers and incisive follow-ups:

  1.  **Question (Reference Class & Dissenters):** "Superrationality requires agents who 'reason like me' to converge on the same decision. How do you *operationally define* the set of agents who 'reason like me'? Specifically, if I know for a fact that one agent in a symmetric dilemma (like Platonia) is *not* superrational – perhaps they're irrational, or committed to causal decision theory – how does your principle instruct *me* to act, and why is that the rational choice?"
      *   **Likely Answer:** He might suggest focusing on agents *capable* of superrational reasoning or defining the reference class based on shared access to the same reasoning process or game structure, discounting known dissenters as outside the relevant symmetry.
      *   **Follow-Up:** "Doesn't this make superrationality critically dependent on my *subjective belief* about who else is in the reference class? If I suspect 5 out of 20 in Platonia are causal reasoners, should I act as if there are only 15 superrational players? How do I calculate my probability then? Doesn't this reintroduce the very subjectivity and belief-dependence superrationality aimed to avoid, and risk circularity (I define the class by who will act like me, but I need the class to know how to act)?"

  2.  **Question (Platonia & Mixed Strategies):** "A core appeal of superrationality is that identical reasoners, facing identical situations, deduce the *same unique action*. Yet in Platonia, the superrational prescription is a *mixed strategy* – sending the telegram with probability 1/20. How does this not constitute a fundamental contradiction? If our reasoning is identical, why aren't we all compelled to the *same pure action*?"
      *   **Likely Answer:** He might argue that the unique solution *is* the mixed strategy itself. The symmetry demands that no individual can be singled out, so the only way to maintain symmetry in the outcome (exactly one winner) is for each to randomize uniformly. The "same action" is adopting the probability distribution.
      *   **Follow-Up:** "But doesn't this imply that 'reasoning identically' doesn't actually determine a specific physical action in the world? If the *only* way superrationality 'works' in Platonia is by introducing randomness external to the reasoning process itself (the coin flip), doesn't that fatally undermine the claim that the reasoning process *alone* guarantees coordination? Isn't the randomness doing the actual coordination work?"

  3.  **Question (Luring Lottery Runaway & Norm vs. Procedure):** "In the actual Luring Lottery, contestants submitted astronomically large numbers of entries (e.g., 10^9), attempting to grab half the pot. This runaway dynamic seems like the inevitable result of individual best-reply reasoning when not everyone is committed to the norm. Doesn't this prove that superrationality only functions as a stable *coordination norm* *if everyone already believes in and adheres to it*, rather than as a universally compelling *decision procedure* for rational agents in general?"
      *   **Likely Answer:** He might concede it only works if everyone is superrational, or argue that the runaway result is collectively disastrous and thus irrational, proving the necessity of adopting superrationality.
      *   **Follow-Up:** "But if superrationality's viability as a decision rule *depends* on near-universal prior adoption, how can it ever get started, especially against entrenched norms like causal decision theory? Isn't an agent entering the Luring Lottery rationally compelled by dominance reasoning to submit a large number *precisely because* they know others are likely doing the same, making the superrational 'submit one' advice self-defeating in practice?"

  4.  **Question (Magical Thinking - Acausal Causation):** "A frequent criticism is that superrationality relies on 'magical thinking' – treating my own choice as somehow *causing* others who reason like me to make the same choice, despite no causal mechanism. How do you distinguish superrational correlation from literal causation, and isn't basing a real-world decision on the belief that my choice *is* evidence of others' identical choices (without causation) fundamentally irrational under standard epistemic norms?"
      *   **Likely Answer:** He will emphasize it's *acausal* correlation based purely on logical connection through the identical reasoning process, not causation. He might invoke the analogy of identical calculators outputting the same result for the same input.
      *   **Follow-Up:** "But calculators are deterministic physical systems. Human reasoning, even 'identical' reasoning, involves noisy biological processes, differing priors, and potential for error. In the real world, lacking a perfect, deterministic 'reasoning module,' how can I be justified in having such high confidence that *my* specific reasoning about this complex dilemma will be replicated *exactly* by others, warranting betting on acausal correlation? Isn't this confidence empirically unfounded?"

  5.  **Question (Asymmetry):** "Superrationality is typically defined for symmetric games. How do you rigorously extend the principle to *asymmetric* games – where players have different roles, information, or payoffs? Does symmetry become a prerequisite for applying superrationality, or is there a general rule?"
      *   **Likely Answer:** He might suggest looking for symmetries within the asymmetry, or applying the principle of treating *functionally identical* reasoning processes similarly, even if the game context differs slightly. He might propose a generalized "view from nowhere" perspective.
      *   **Follow-Up:** "Consider an asymmetric prisoner's dilemma where Player 1 gets a slightly higher payoff for mutual cooperation than Player 2. Applying the 'identical reasoning' logic, should both players still cooperate? If so, why should Player 2 cooperate when their absolute payoff is lower? If not, how do you *systematically* determine where asymmetry breaks the superrational prescription? Doesn't this expose a critical lack of generality?"

  6.  **Question (Free-Entry Luring Lottery - SR vs. EDT):** "You mentioned a modified Luring Lottery where entry is free, but a lone entrant gets a large bonus. Superrationality would still advise against entering, as identical reasoners would all enter or not, making the bonus unattainable and leaving the divided prize minuscule. Evidential Decision Theory (EDT), however, might see *not* entering as strong evidence that others also didn't enter, making the bonus possible. What does this variant reveal about the fundamental *difference in mechanism* between superrationality and EDT, and why is the superrational avoidance of the dominant strategy (entering is free, so weakly dominant) preferable?"
      *   **Likely Answer:** He will highlight that EDT focuses *only* on the evidential link between one's own action and others' actions, potentially leading to the "smoking lesion" type problems. Superrationality focuses on the necessary logical consequence of identical reasoning determining *all* actions simultaneously.
      *   **Follow-Up:** "But in this scenario, entering is costless and potentially beneficial (if others stay out). EDT might recommend not entering *only if* the agent believes their choice is strong evidence for others' choices. Superrationality seems to demand not entering *regardless* of such beliefs, purely based on logical symmetry. Doesn't this make superrationality appear *more* metaphysically demanding than EDT, requiring a stronger assumption about the linkage between decisions?"

  7.  **Question (Dominance & Collective Rationality):** "Superrationality often prescribes actions that are dominated (like not entering the free lottery) or seem individually suboptimal (like randomizing in Platonia) when viewed from a standard causal, self-interested perspective. How do you reconcile the claim that superrationality is the correct principle of *individual* rationality with the fact that it systematically overrides dominance reasoning and can prescribe actions that seem individually harmful unless universally adopted?"
      *   **Likely Answer:** He will argue that dominance reasoning relies on the false premise that one's action is causally independent of others' actions in symmetric dilemmas. Superrationality reflects the true logical interdependence, making the seemingly dominated action actually optimal given how choices are linked.
      *   **Follow-Up:** "But doesn't this require the individual to fundamentally prioritize *logical coherence* of the group outcome over their *own causal expected utility*? If an agent genuinely only cares about their own payoff and believes their choice has *no causal power* over others, isn't dominance reasoning inescapable for them? Isn't superrationality then imposing an additional, collective 'ought' on top of individual rationality?"

  8.  **Question (Epistemology of Symmetry):** "Superrationality heavily depends on recognizing perfect symmetry. Yet, identifying true symmetry in real-world decisions is fraught with difficulty – differences in information processing speed, subtle framing effects, or even minor physical differences might break symmetry. How confident can an agent *reasonably* be that a situation is truly symmetric enough to apply superrationality, and what's the fallback if symmetry is uncertain?"
      *   **Likely Answer:** He might suggest symmetry is often a useful idealization or that agents should strive to recognize the symmetric structure underlying a situation.
      *   **Follow-Up:** "Given the high stakes of misapplying superrationality (e.g., definitely losing in Platonia by not sending if others do, or submitting too few entries in Luring Lottery), doesn't the practical difficulty of *verifying* perfect symmetry make superrationality a highly risky and unreliable decision procedure in all but the most abstract, controlled scenarios? Shouldn't agents default to causal decision theory under uncertainty about symmetry or others' adherence?"

  These questions directly challenge the operationalizability, internal consistency, scope, and metaphysical/epistemological foundations of superrationality, pushing the theorist beyond mere exposition into substantive defense against its most persistent critiques. The follow-ups anticipate common responses and aim to expose deeper tensions or unresolved problems within the view. Good luck with the podcast!
