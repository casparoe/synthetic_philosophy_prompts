prompt: |-
  I keep running into a certain argument shape and I've never found a clean name for it, and at this point I'm not even sure it has one. Hoping someone here has either the term or a better carving than what I've got.

  The shape is roughly this. Someone wants you to do or believe or adopt X. They don't argue that X is true or good in the ordinary way. Instead they posit an agent (or a "process," or just a rule) whose behavior is defined as a function of how you reason, and then they say: because of that, if you don't do X, you'll be worse off. The catch is that the agent's threat is unfalsifiable by construction -- it's not defined over anything observable in the world, it's defined over your decision procedure or your beliefs or the fact that you considered the question at all. So there's no experiment that could show the threat is empty, and pointing that out doesn't defuse it, because "unfalsifiable" was the whole design.

  Some instances I've collected, none of which quite fit each other:

  (a) The future superintelligence one. If a powerful AI gets built, it might reward the people who helped and punish the people who knew and didn't. So you should help now. The punishing is supposed to be conditioned on what kind of agent you were, so you can't escape by keeping your hands clean.

  (b) The mugging. A stranger offers an enormous reward (or threatens an enormous punishment) over an event with minuscule probability, and the expected value comes out large, so "rationally" you should comply.

  (c) The precommitment/exclusion one. If you don't adopt a certain policy now, a network of agents that trade "acausally" will decline to trade with you, so adopting the policy pays. Again, the payoff is defined over your policy, not over anything that happens.

  (d) The one where the threat is specifically that you *thought about it*. Merely reading the argument and dismissing it is supposed to be the triggering event, so the only safe move is to never have engaged, which you can't retroactively do.

  Here's what I can't tell: is there a single established concept for this general form, or am I lumping together things that a careful person would keep separate? The nearest things I know -- Pascal's wager, and the "expected value can be hijacked by tiny probabilities" point -- both feel adjacent but not right, because they don't have the self-referential "the threat is defined over your reasoning" feature. And "unfalsifiable" isn't it either, because lots of unfalsifiable claims aren't trying to move your decisions this way.

  What I actually want isn't a label. I want the carving. So: if there's a term, tell me what it is and where it stops -- which of (a)-(d) it covers and which it doesn't. If there isn't, coin one, define it, and give me the boundary cases, i.e. what's the closest legitimate argument that looks like this but isn't a mugging. And I'd like to know the thing I suspect but can't prove: whether the whole family is united by the move of putting the reward/punishment over belief-or-policy instead of over action, so that evidence-based norms can't touch it. If that's the joint, say so; if the real joint is somewhere else, tell me where.
reasoning: |-
  Okay, the user is struggling to name a specific type of argument they keep encountering. They've described a pattern where someone tries to persuade them to adopt belief or action X not by proving its inherent truth or value, but by invoking an unfalsifiable threat or reward tied to their reasoning process itself. They've provided four examples: future superintelligence, Pascal's mugging, acausal trade, and self-referential threats.

  This is clearly bothering them - they mention repeatedly running into this argument structure and feeling frustrated by the lack of a clear conceptual framework. The examples suggest they're engaging with rationalist/EA/LW communities where these thought experiments circulate. Their explicit request is for either an established term or a better conceptual "carving" of the territory.

  The examples share a deep structural similarity: the payoff function depends on the agent's cognitive state (beliefs, decision procedure) rather than observable outcomes. This makes the threat immune to standard evidence-based refutation. The user seems particularly annoyed by how these arguments circumvent normal epistemic norms.

  I recall that "Pascal's mugging" (example b) already has a name, but the broader pattern lacks a unified label. Terms like "epistemic blackmail" or "decision-theoretic extortion" come to mind, though neither is canonical. The core problematic move is making rewards/punishments contingent on the victim's mental states in ways that can't be verified.

  For the conceptual carving, the key features appear to be: (1) payoff defined over cognitive states rather than world-states, (2) constructed unfalsifiability, (3) self-referential enforcement mechanism. This distinguishes it from Pascal's Wager (which is about belief consequences but tied to a potentially real afterlife) or ordinary blackmail (which involves verifiable threats).

  The user's suspicion seems correct - the "joint" is indeed this shift from action-outcomes to belief-states as the locus of consequences. I'll organize this as a unified framework with subtypes, noting where existing terms apply and where new coinage might help.
answer: |-
  Based on your description and examples, you've identified a distinct and pernicious class of arguments united by a core **self-referential unfalsifiability applied to decision-making**. There isn't a single, universally accepted term, but the concept is well-recognized in decision theory, philosophy, and rationalist circles. Let's carve it precisely.

  **The Core Concept: Decision-Theoretic Extortion (DTE)**

  *   **Definition:** An argument attempting to compel belief or action (X) by invoking an unfalsifiable agent, rule, or process (A) whose reward/punishment function is defined *solely* over the target's internal cognitive states (belief, reasoning process, policy choice, or mere consideration of the argument), rather than over observable states of the world. A is constructed such that its threat/promise is immune to empirical verification or falsification *by design*, forcing compliance based on potential catastrophic loss or unattainable gain calculated under A's rules.
  *   **The "Joint":** The essence is **defining the payoff over cognition/policy instead of action-outcomes**. This is what bypasses standard evidence-based reasoning and creates the unfalsifiable trap:
      *   Normal arguments: `Action/Belief X -> Expected World-State Y (Good/Bad) -> Do/Adopt X.`
      *   DTE arguments: `Action/Belief ~X -> Agent A -> Punishment P (defined over your cognition/policy) -> Do/Adopt X.` OR `Action/Belief X -> Agent A -> Reward R (defined over your cognition/policy) -> Do/Adopt X.`
      *   **Crucially:** `A`'s behavior depends *only* on your `cognition/policy`, not on `Y` (the actual outcome of your action in the world). This severs the link to observable reality.

  **Applying DTE to Your Examples:**

  1.  **(a) Future Superintelligence Punishment:** Classic DTE.
      *   `A`: The future superintelligence.
      *   `Punishment P`: Defined over your policy/efforts *now* ("did you help?"), regardless of the actual future outcome or whether the AI even gets built or cares. Unfalsifiable by design (future, hypothetical agent with unknown values).
      *   **DTE Core:** Payoff (avoid P) defined over *your current policy/effort*, not over the *actual outcome* of AI development or its real-world impact.

  2.  **(b) Pascal's Mugging:** A *specific subtype* of DTE focused on tiny probabilities and huge utilities hijacking expected value calculations.
      *   `A`: The mugger (or the process generating the improbable claim).
      *   `Reward R/Punishment P`: Defined over your *compliance with the demand* (handing over your wallet). Unfalsifiable by design (implausible claim, inaccessible evidence).
      *   **DTE Core:** While the demand is an action, the *rationale* compels you based on a decision rule (maximize expected utility) applied to an unfalsifiable claim about A's capabilities. The mugging *exploits* the self-referential nature of the expected utility rule itself. Rejecting the calculation feels like violating a core reasoning norm. It fits DTE because the threat/reward structure *depends* on you accepting this specific decision rule.

  3.  **(c) Acausal Trade/Precommitment:** Prototypical DTE.
      *   `A`: The network of acausal agents.
      *   `Reward R/Punishment P`: Defined *exclusively* over your *policy* (e.g., "Do you cooperate on this decision-theoretic basis?"), not over any causal interaction or observable outcome. Unfalsifiable by design (agents don't exist causally, interaction is purely theoretical).
      *   **DTE Core:** Payoff defined purely over *your adopted policy*, completely decoupled from actual causal consequences in the world.

  4.  **(d) Self-Referential Threat/Forbidden Knowledge:** Purest form of DTE.
      *   `A`: The mechanism implied by the argument itself (e.g., a cosmic rule, a hidden watcher).
      *   `Punishment P`: Triggered *solely* by the *act of considering and rejecting* the argument (or just considering it). Unfalsifiable by design (trigger is your cognition, not an observable event).
      *   **DTE Core:** Payoff defined *directly and exclusively* over your *cognitive state* regarding the argument. The threat is entirely self-referential to the act of reasoning about it.

  **Why "Decision-Theoretic Extortion" (DTE) Fits:**

  *   **"Decision-Theoretic":** Targets the *rules and processes* of how agents make decisions (expected utility, policy adoption, belief formation).
  *   **"Extortion":** Applies coercive pressure (potential catastrophic loss or unattainable gain) based on a manufactured, unfalsifiable threat/promise.
  *   It captures the **self-referential unfalsifiability** and the **coercive pressure on cognition/policy**.

  **Boundary Cases & Close Cousins (Not DTE):**

  1.  **Pascal's Wager:** *Superficially similar* (unfalsifiable agent, huge stakes). **Key Difference:** Pascal's Wager *does* tie the payoff (salvation/damnation) to an *action* (belief in/worship of God) that *could* have a real, albeit unverifiable, causal consequence in the world (God's judgment). The payoff isn't defined *over the reasoning process itself*. It's an unfalsifiable claim about reality, not an extortion attempt targeting your decision rule. (It *uses* decision theory, but isn't *about* decision theory).
  2.  **Ordinary Blackmail:** Payoff defined over an *action* (pay money) to prevent an *observable consequence* (release of compromising information). Falsifiable (the information exists or doesn't).
  3.  **Self-Fulfilling/Defeating Prophecies:** Payoff depends on *actions* taken based on belief, leading to observable outcomes. E.g., believing a bank run will happen causes you to withdraw, *causing* the bank run. This involves causal chains in the observable world.
  4.  **Epistemic Commons Dilemmas:** Arguments that *using* certain reasoning tools (e.g., extreme skepticism) might undermine useful societal norms. While it references cognition, the payoff is argued to be *observable* social consequences, not an unfalsifiable agent punishing the cognition itself.

  **Your Key Insight: Confirmed.**

  You nailed it: "**the whole family is united by the move of putting the reward/punishment over belief-or-policy instead of over action, so that evidence-based norms can't touch it.**" This *is* the joint. DTE arguments hijack the machinery of rational decision-making by inserting an unfalsifiable entity whose rules operate solely within the cognitive/policy domain, making them immune to empirical counter-evidence. The only "evidence" is the threat/promise defined by A, whose existence and rules are stipulated, not observed.

  **In Summary:**

  *   **Term:** **Decision-Theoretic Extortion (DTE)** is a precise, descriptive coinage for this class.
  *   **Definition:** Arguments compelling X via an unfalsifiable agent/process whose payoff function is defined solely over the target's cognitive states or policy choice, bypassing evidence-based norms.
  *   **Coverage:** Encompasses all your examples (a-d) perfectly. They are distinct *subtypes* (acausal, mugging, pure self-reference) under the DTE umbrella.
  *   **The Joint:** Shifting the payoff locus from **action-outcomes in the world** to **internal cognition/policy**, deliberately creating unfalsifiability.
  *   **Boundary:** Pascal's Wager is the closest legitimate-looking cousin, but crucially differs by tying payoff to an *action* potentially having a real consequence, not purely to the *reasoning process* itself.

  This carving isolates the core move that makes these arguments uniquely frustrating and resistant to standard refutation. Recognizing DTE helps flag these arguments precisely for what they are: attempts to extort belief or policy adoption through unfalsifiable cognitive threats.
