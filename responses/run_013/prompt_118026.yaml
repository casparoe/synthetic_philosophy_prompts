  ## Bureau of Threshold Determination (BTD) - Public FAQ

  **1. What does the BTD do?**
  The Bureau administers two critical programs: the Federal Hair Restoration Subsidy (FHRS) and the Grain Heap Classification for Customs Duties (GHCCD). Statutes authorize these programs but do not define the terms "bald" (for FHRS eligibility) or "heap" (for GHCCD import thresholds). The BTD exists to apply these terms consistently and fairly in individual cases.

  **2. How does the BTD determine if someone is "bald" (FHRS) or if grain is a "heap" (GHCCD)?**
  The Bureau operates on the established principle that precise thresholds *exist* for these terms. There is a specific, exact number of scalp hairs below which a man is bald, and a specific, exact number of grains above which a collection constitutes a heap. This is a matter of objective fact.

  **3. If the thresholds exist, why can't you just tell us what they are?**
  Knowledge of the *exact* threshold requires certainty. However, human cognition necessitates a "margin for error" for reliable knowledge. A determination landing precisely on the true boundary would be correct only by luck, not reliable judgment. Therefore, while the precise threshold exists (recorded in the Sealed Annex to the founding statute), it is fundamentally **unknowable** by any individual or system. This epistemological limitation is the very reason the BTD exists: to make consistent determinations *near* the threshold using the best available evidence (hair counts, grain volume measurements), acknowledging we operate within a necessary margin of uncertainty around the unknowable point.

  **4. What if I disagree with the BTD's initial determination?**
  You may appeal to the Bureau's **Division of Indeterminate Cases (DIC)**.

  **5. How does the DIC rule on appeals?**
  The DIC reviews cases falling within the "borderline zone" near the unknowable threshold. The DIC applies a different principle: for borderline cases (e.g., hair counts very near the Annex threshold, grain counts very near the heap threshold), there is **no fact of the matter** about whether the term "bald" or "heap" applies. The predicate is neither true nor false in such cases. Consequently, the DIC will **void** the initial determination, ruling that no verdict was ever required or justified for that specific case. Eligibility or classification remains indeterminate.

  **6. Does the DIC deny that a threshold exists?**
  No. The DIC explicitly certifies that **a precise cutoff threshold absolutely exists**, as per the Sealed Annex. However, the DIC maintains it is a core principle *never* to declare *where* that threshold lies in any specific case reviewed under its purview. Its sole function is to identify cases where the initial determination attempted to apply the predicate in a zone where no fact of the matter exists.

  **7. What if I disagree with the DIC's ruling that my case was "indeterminate"?**
  You may appeal the DIC's ruling itself to the **Division of Higher-Order Thresholds (DHOT)**.

  **8. How does the DHOT rule?**
  The DHOT determines whether the DIC's finding of "indeterminacy" in your specific case was *itself* clearly correct or incorrect, or whether *that* finding falls into a higher-order borderline zone. Essentially, the DHOT adjudicates whether the case was *definitely* indeterminate (DIC ruling upheld), *definitely determinate* (DIC ruling overturned, initial BTD determination reinstated *or* voided, whichever is definitively correct), or whether the *indeterminacy itself was indeterminate* (a higher-order indeterminacy finding, voiding the DIC ruling but not reinstating the initial determination).¹

  **9. Why is there no appeal beyond the DHOT?**
  ¹The founding statute incorporates a logical fixed-point model ensuring stability beyond the third order. Appeals regarding the DHOT's determinations are conclusively resolved by the DHOT itself under a self-certified stability clause, preventing infinite regress. Further appeals on this point are statutorily barred as operationally incoherent.

  **10. Are there any rules that always apply, even in borderline cases?**
  Yes. "Penumbral Connections" are strictly enforced Bureau-wide. These are logical relationships between predicates that hold true *regardless* of borderline status. Key examples include:
  *   **FHRS:** No individual can be classified as both eligible for the subsidy (bald) *and* subject to the Hirsuteness Surtax (non-bald) on the same date, even if their hair count falls squarely in the borderline zone. They might be neither, but never both.
  *   **GHCCD:** A shipment cannot be both classified as a "heap" (attracting higher duties) *and* a "non-heap scatter" (attracting lower duties) simultaneously. It might be indeterminately one or the other, but the classifications are mutually exclusive.

  **11. Where can I find the Sealed Annex?**
  The Sealed Annex is a statutory document codifying the existence and precise nature of the thresholds. Consistent with the margin-for-error principle, the Annex is permanently secured within the National Archives under protocols ensuring its contents remain operationally inaccessible and unknowable to any human or machine system, thereby fulfilling its epistemological and statutory purpose.

  **12. How can I contact the relevant divisions?**
  *   Initial Determinations (FHRS/GHCCD): BTD-Adjudication@btd.gov
  *   Division of Indeterminate Cases (DIC): BTD-DIC-Appeals@btd.gov
  *   Division of Higher-Order Thresholds (DHOT): BTD-DHOT-Appeals@btd.gov
  (Please allow 60-90 business days for DHOT responses due to complex deliberation protocols.)

  ---
  **Rationale & Fairness Check:**

  *   **Epistemicism (BTD/DHOT):** The core tenets are present: precise, unknowable thresholds exist ("Sealed Annex"), necessitating a margin for error in practice. Knowledge requires avoiding the exact boundary. The BTD's existence is justified by this unknowability.
  *   **Supervaluationism (DIC):** Captures the key ideas: borderline cases lack a truth value ("no fact of the matter"), leading to voided verdicts. Truth is defined via supertruth ("whatever holds on every admissible precisification"), demonstrated by the penumbral connections (no one bald and non-bald) surviving even in indeterminacy. Crucially, it affirms the *existence* of a cutoff ("certifies that a precise cutoff threshold absolutely exists") while refusing to specify *which* one ("never to declare where").
  *   **Higher-Order Vagueness:** The DHOT handles appeals about the DIC's indeterminacy rulings, explicitly modeling higher-order borderline cases. The footnote stopping the regress at three levels mirrors supervaluationist technical strategies to avoid infinite regress.
  *   **Penumbral Connections:** Explicitly stated and enforced Bureau-wide, demonstrating how logical relations hold even when classification is indeterminate.
  *   **Deadpan & Accessibility:** The tone is bureaucratic and earnest. Terms like "Sealed Annex," "margin for error," "no fact of the matter," "penumbral connections," "higher-order thresholds," and the absurdity of divisions appealing their own rulings are all direct mappings from the theories, presented without explanation or winking. The grain heap parallel grounds it.
  *   **Fairness:** Both positions drive core agency functions. The epistemicist BTD makes practical judgments based on unknowable thresholds. The supervaluationist DIC voids judgments precisely where indeterminacy reigns, upholding the "no fact" view. The DHOT and enforced penumbral connections satisfy key aspects of both. A logician should see their core commitments operating within the system.
