prompt: |-
  I'm a novelist at work on a book whose central character is an economist who spends her career designing institutions for a large philanthropic foundation, and I want her to be able to defend her position in dialogue without saying anything that a specialist would wince at. A consultant I hired to check my technical background handed me the following summary of Harsanyi's aggregation theorem, and it is confident enough that I can't tell how far to trust it:

  "Harsanyi's theorem settles an old question in ethics with mathematics. If each person's preferences obey the standard axioms of rational choice under uncertainty, and if society's preferences obey those same axioms and respect a weak Pareto rule — roughly, that if everyone prefers one option then so does society — then the only consistent way to aggregate is to add up individual utilities, weighing everyone equally. So the rational social choice is simply to maximize total welfare. And because the theorem is built on the thought that we should choose our institutions as if we might turn out to be anyone within them, it never has to compare one person's happiness against another's, which is how it dodges the usual objections to utilitarianism."

  Before you answer, take the role of an expert in social choice theory and welfare economics and think the theorem through carefully — its assumptions, what it does and doesn't establish, and the objections that have actually stuck — rather than reaching for the standard textbook gloss. Then walk me through the summary sentence by sentence: tell me what someone who works on this would accept, what they would wince at, and what is plainly wrong, and explain what turns on each point. Throughout, keep separate what is settled in the field from what is genuinely contested among people who know it well, and don't present a contested reading as the consensus. Finally, if the practical moral the summary draws for my character — that a rational institution must simply add up everyone's welfare, counting each person equally — survives your corrections, say so; if it doesn't, tell me what she could defensibly say instead.
