       *Awkward commitment: Denies that rational allocation can occur without private property, even with unlimited computation or altruism.*  
     - Practicality (feasibility depends on real-world constraints) → 3  

  **3. Missing knowledge: tacit or dispersed?**  
     - Tacit (non-transmissible, embedded in practice) → **Leaf: Hayek-style Impossibility**  
       *Awkward commitment: Markets are the only way to use knowledge, making central planning inherently incapable of accessing critical information.*  
     - Dispersed (aggregable with sufficient communication/compute) → 4  

  **4. Aggregability bottleneck: computation or none?**  
     - Computation (sheer volume/rate of data) → **Leaf: Big Data/Compute Solution**  
       *Awkward commitment: Depends on unproven future technology to handle complexity, ignoring incentives and innovation.*  
     - None (no fundamental barrier) → 5  

  **5. Standard: static efficiency or dynamic discovery?**  
     - Dynamic discovery (innovation, adaptation) → **Leaf: Market Process Essential**  
       *Awkward commitment: Concedes that planning might achieve short-term efficiency but cannot replicate market rivalry’s role in driving innovation.*  
     - Static efficiency (optimal allocation at a point in time) → 6  

  **6. Price signal: scalar or vector?**  
     - Vector (physical units e.g., labour/energy) → **Leaf: Physical Vector Accounting**  
       *Awkward commitment: Requires reducing heterogeneous inputs to a common physical unit, ignoring qualitative differences and substitution trade-offs.*  
     - Scalar (single price per good) → 7  

  **7. Indispensable element: price vector or market process?**  
     - Price vector (informational device for planners) → **Leaf: Lange-style Market Socialism**  
       *Awkward commitment: Assumes managers can simulate competition via rules without real profit/loss incentives or rivalry.*  
     - Market process (rivalrous discovery with winners/losers) → **Leaf: Mechanism-Design Dissolution**  
       *Awkward commitment: Claims no mechanism (market or plan) achieves efficiency under dispersed private information, making the debate futile—yet fails to explain real-world market successes.*  

  #### Key to Leaves
  - **Incentive Problem**: Focuses on motivation; aligned with post-1980s critiques (e.g., Kornai).  
  - **Dichotomy Fiction**: Rejects binary; held by institutional economists (e.g., Galbraith).  
  - **Mises-style Impossibility**: A priori logic; solely Mises.  
  - **Hayek-style Impossibility**: Practical knowledge problem; Hayek’s core.  
  - **Big Data/Compute Solution**: Modern techno-optimism (e.g., Cockshott).  
  - **Market Process Essential**: Dynamic emphasis; Hayek and Schumpeter.  
  - **Physical Vector Accounting**: In-kind systems (e.g., Marxian labour-time).  
  - **Lange-style Market Socialism**: Trial-and-error planning; Lange’s proposal.  
  - **Mechanism-Design Dissolution**: General impossibility; modern microtheory (e.g., Hurwicz).  

  #### Unoccupied/Incoherent Leaves  
  - **Physical Vector Accounting + Market Process**: Incoherent—vector accounting rejects prices, but market process requires them.  
  - **Big Data + Dynamic Discovery**: Unexplored—techno-optimists rarely address innovation under planning.  

  ---

  ### Five Test Cases  
  *(Maps which leaves each case supports or embarrasses)*  

  1. **Planning inside a big firm (e.g., internal allocation without prices)**:  
     - **Supports**: Dichotomy Fiction (firms blend planning/markets), Lange-style (shows rules-based allocation can work locally), Big Data (if using advanced computation).  
     - **Embarrasses**: Mises-style (firms allocate without property rights), Hayek-style (tacit knowledge coordinated hierarchically).  

  2. **Open-source software (coordination without prices)**:  
     - **Supports**: Physical Vector Accounting (if using contribution metrics), Mechanism-Design (shows non-price coordination), Big Data (if using data tools).  
     - **Embarrasses**: Mises-style (no prices/scarcity signals), Market Process Essential (innovation occurs without rivalry).  

  3. **Real-time electricity dispatch (central planning in grids)**:  
     - **Supports**: Big Data (handles high-volume data), Lange-style (trial-and-error pricing), Dichotomy Fiction (hybrid system).  
     - **Embarrasses**: Hayek-style (tacit knowledge managed centrally), Mises-style (allocation without market prices).  

  4. **Command economy with prices bolted on (e.g., Soviet reforms)**:  
     - **Supports**: Incentive Problem (prices ignored without property rights), Mechanism-Design (highlights information/trust gaps).  
     - **Embarrasses**: Lange-style (rules fail without competition), Physical Vector Accounting (if prices replace physical units).  

  5. **Accounting with physical units (e.g., labour hours/joules)**:  
     - **Supports**: Physical Vector Accounting (demonstrates in-kind systems).  
     - **Embarrasses**: Mises-style (assumes scalar prices are essential), Market Process Essential (lacks rivalry/discovery).  

  ---

  ### Caveats  
  - **Overlaps**: Hayek-style and Market Process Essential are split (tacit vs. dynamic) but converge on markets being irreplaceable.  
  - **Unexplored**: Physical Vector Accounting + Dynamic Discovery—no major theory combines these; likely incoherent due to innovation requiring prices.  
  - **Omissions**: Focuses on core debate; excludes later contributions (e.g., Austrian revisions).  
  - **Non-Mutual Exclusivity**: Cases like open-source support multiple leaves, revealing ambiguities in the debate.  
  - **Tree Logic**: Branches force positions into mutually exclusive commitments, exposing contradictions (e.g., Lange assumes static efficiency but ignores discovery).
