answer: |-
  Here’s a strategic Q&A sheet tailored to your scenario, prioritizing hostility, disciplinary vocab, and damage potential. Confidence levels for literature claims: **85%** (based on standard interpretations of key texts, but nuances exist). Least sure point: *Economists' early emphasis on cost differential* (Spence 1973 implies it, but later applications sometimes flatten it).

  ---

  ### **Q&A Sheet: Top 8 Likely Objections**  
  *(Ordered by Likelihood + Damage)*  

  1. **From Behavioral Ecologist**  
     *"Your 'differential cost' requirement is redundant. Grafen’s 1990 model formalized Zahavi’s handicap with precisely this: cost functions scaling inversely with quality. You’re debating settled math."*  
     **Reply (2-min):** "Grafen’s model *assumes* differential costs to *generate* honesty. My critique targets *empirical applications in human studies* that cite Grafen/Zahavi but only measure absolute cost (e.g., 'rituals are expensive'). They use the *label* 'handicap' without testing if costs *actually* vary with quality—making claims unfalsifiable. This isn’t about the math; it’s about misapplying it."  
     **Soft Spot:** Conceding Grafen’s rigor risks conceding the core argument. Stress *empirical* misalignment.  

  2. **From Anthropologist (Target Audience)**  
     *"You claim our ritual signaling work is unfalsifiable, but we *do* show costs correlate with status outcomes (e.g., costly feasts → prestige). Isn’t that evidence of differential cost?"*  
     **Reply (2-min):** "Correlating cost *expenditure* with prestige doesn’t prove costs *vary with underlying quality*. If everyone pays the same high cost, low-quality individuals might signal dishonestly or go bankrupt—neither tested. Without measuring how cost *burden* differs by individual quality (e.g., income, skill), it’s just expensive signaling, not necessarily honest. Your data often lacks this gradient."  
     **Soft Spot:** They may counter with proxy measures (e.g., "wealth = quality"). Prepare to dismantle circularity.  

  3. **From Economist**  
     *"Spence’s 1973 job-market model *requires* differential costs (education is costlier for low-productivity workers). Economics never 'conflated' this—you’re attacking a straw man."*  
     **Reply (2-min):** "Absolutely, Spence gets it right. But when anthropologists cite 'costly signaling theory,' they invoke *both* Spence and Zahavi while using Zahavi’s *biological* examples (peacock tails) that imply differential costs are automatic. My point: Humanists often adopt Zahavi’s *rhetoric* of ‘handicaps’ but default to Spence’s *baseline* (absolute costs), losing the differential. Economists are blameless, but the *export* of your models to other fields diluted precision."  
     **Soft Spot:** Economists may feel vindicated; use this to pivot to "Your models are being misused."  

  4. **From Behavioral Ecologist**  
     *"If differential cost is so crucial, why do meta-analyses of animal signaling find honest signals even with fixed costs?"*  
     **Reply (2-min):** "Those cases rely on *receiver-dependent costs* (e.g., bluffers get punished) or *indexical signals* (unfakeable morphology). But in *human* cultural signals (e.g., luxury brands, rituals), these mechanisms are rarely tested. The literature I critique defaults to 'cost = honesty' via Zahavi, without specifying *how* costs enforce honesty. When costs aren’t differential or receiver-independent, the theory collapses into 'expensive = reliable,' which *is* unfalsifiable."  
     **Soft Spot:** Overgeneralizing from animal to human. Stress unique flexibility of human signals.  

  5. **From Anthropologist**  
     *"Differential costs are impossible to measure in humans! Quality is multidimensional (e.g., 'status'). Your standard makes empirical work impractical."*  
     **Reply (2-min):** "I agree it’s hard—but that’s my point. If you can’t operationalize quality and differential cost, you can’t claim your explanation is 'handicap principle.' Use a different framework (e.g., Veblen goods, ritual commitment). Otherwise, you’re invoking a mechanism you can’t test. We need *either* better proxies (e.g., cost/income ratios) or admission that these are just-so stories."  
     **Soft Spot:** Sounds dismissive of fieldwork constraints. Emphasize "theory-choice" over "impossibility."  

  6. **From Economist**  
     *"Even with uniform costs, signals can be honest if low types can’t afford them (e.g., bankruptcy risk). Doesn’t that satisfy your requirement?"*  
     **Reply (2-min):** "Only partially. If costs are uniform but prohibitive for low types, it’s *sorting* (à la Spence), not *handicapping*. Handicaps require that for the same signal level, high-quality pay *lower marginal costs*. Bankruptcy risk is an *absolute* barrier, not a *differential* cost. Conflating these obscures why some signals are evolutionarily stable versus economically stable."  
     **Soft Spot:** Economists may see this as semantic. Hold the line on "marginal cost vs. affordability."  

  7. **From Behavioral Ecologist**  
     *"Zahavi’s original 'handicap' was metaphorical. Demanding rigor beyond 'costs enforce honesty' misrepresents biology."*  
     **Reply (2-min):** "Zahavi’s metaphor was brilliant, but Grafen’s formalization showed *why* it works: cost functions must be *quality-dependent*. When humanists use 'handicap' loosely to mean 'any cost ensures honesty,' they revive pre-Grafen confusion. If we let 'handicap' mean just 'costly,' we lose predictive power. Clarity demands we separate metaphors from mechanisms."  
     **Soft Spot:** Accusing Zahavi of vagueness may alienate biologists. Praise his insight while stressing formal advances.  

  8. **From Anthropologist**  
     *"Your critique ignores signaling *benefits*! High costs are honest because only high-quality actors gain enough benefits to offset them."*  
     **Reply (2-min):** "Benefits determine *whether* signaling evolves, but not *honesty*. Honesty requires that low-quality actors *cannot* profit from deception—which hinges on differential costs. If benefits are high *and* costs uniform, low-quality actors will still signal if net gains are positive (e.g., scams). Differential costs make deception unprofitable *specifically* for low types."  
     **Soft Spot:** Risks downplaying benefits’ role. Reiterate: "Benefits explain existence; differential costs explain honesty."  

  ---

  ### **The Question You Hope Nobody Asks**  
  **From a Theorist (Economist or Ecologist):**  
  *"If differential costs are essential for honesty, how do you explain signals like indexicals (e.g., human height) or conventional signals (e.g., language) that are honest *without* costs? Doesn’t this undermine your narrow definition of 'costly signaling'?"*  

  **Why It’s Dangerous:**  
  - Forces you to admit costly signaling isn’t the *only* path to honesty, weakening your critique’s scope.  
  - Could imply that human ritual signals are conventional/indexical, not costly signals.  

  **Reply Strategy (If Asked):**  
  "Yes, indices (unfakeable signals) and conventions (enforced by norms) can be honest *without* costs. But the literature I critique explicitly invokes *costly* signaling (citing Zahavi/Spence), not indices/conventions. If they mean indexical/conventional honesty, they should say so—not misapply costly signaling theory. My target is the *conflation*, not the existence of alternatives."  
  **Soft Spot:** Opens debate about how many "costly" signals are actually conventional.  

  ---

  ### **Key Vulnerabilities in Your Position**  
  1. **Economists’ Early Clarity:** While Spence (1973) emphasizes differential costs, later economic applications (e.g., conspicuous consumption) sometimes treat "cost" monolithically. Least confident point: *Did economists consistently enforce the differential?* (Some did; others leaned on absolutes).  
  2. **Anthropologists’ Proxies:** They *do* sometimes measure differential costs indirectly (e.g., "ritual effort hurts low-status more"). Your critique must acknowledge and rebut these attempts.  
  3. **Your Own Framework:** Without a clear alternative (e.g., "here’s how to test differential costs"), you risk sounding purely destructive.  

  **Tactical Tip:** Preemptively concede economists’ rigor to win allies against anthropologists. Stress: "This isn’t about theory—it’s about empirical practice." Good luck!
