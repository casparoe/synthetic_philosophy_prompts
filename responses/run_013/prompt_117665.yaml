  ### Part (b) [10 marks]: Show that R is exploited, by exhibiting a strategy that exploits it.

  **Mark: 10/10**  

  **What earns credit:**  
  - Exhibits a valid, computable strategy: at each stage \(n\), sell one unit of \(\phi_n = H_{n+1} \land \neg H_{2n+2}\).  
  - Correctly justifies that \(\phi_n\) is always false:  
    - Notes that \(H_{n+1}\) provably entails \(H_{2n+2}\) (from the enumeration property), so \(H_{n+1} \land \neg H_{2n+2}\) is contradictory.  
  - Correctly computes the price \(P_n(\phi_n)\) at stage \(n\):  
    - For \(j = n+1\) and \(j = 2n+2\), both indices exceed \(n\) for \(n \geq 1\), so \(P_n(H_{n+1}) = 1/2\) and \(P_n(H_{2n+2}) = 1/2\).  
    - Uses independence pricing: \(P_n(\phi_n) = P_n(H_{n+1} \land \neg H_{2n+2}) = P_n(H_{n+1}) \cdot (1 - P_n(H_{2n+2})) = (1/2)(1/2) = 1/4\).  
  - Shows the strategy exploits R:  
    - At each sale, the net contribution is \(P_n(\phi_n) - \text{truth value} = 1/4 - 0 = 1/4\) (since \(\phi_n\) is always false, truth value is 0).  
    - After \(n\) stages, net worth is \(\sum_{k=1}^n 1/4 = n/4\).  
    - Correctly argues net worth is bounded below (e.g., by 0) and unbounded above (since \(n/4 \to \infty\)) in every assignment.  
  - Strategy is computable: \(\phi_n\) is uniformly computable from \(n\), and trades involve finitely many units of finitely many sentences at each stage.  

  **What is wrong:**  
  - Minor: The mention that "a strategy can establish this by proof search" is unnecessary for the exploit (the strategy relies on the falsehood of \(\phi_n\), not proof search). However, this does not invalidate the strategy and is not penalized.  

  **What a full-credit answer would have to add:**  
