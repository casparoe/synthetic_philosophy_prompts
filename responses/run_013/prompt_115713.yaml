  The user's explicit request is structurally precise: a 2,000-word narrative where each character's approach first appears compelling before revealing its flaw, climaxing in a concrete decision about renaming a bridge, and concluding with an implicit fourth mode that serves present life. But their deeper needs feel equally important: this must be pedagogically effective for undergrads, philosophically rigorous without didacticism, and artistically subtle enough to spark discussion. 

  Hmm... the challenge lies in balancing theory and narrative. The three modes must feel organic to the characters, not allegorical puppets. For the hero-worshipper (let's call him Silas in my draft), I'll show his selective memory through how he edits archival documents—focusing on the founders' boldness while ignoring their coercion. The antiquarian (Clara) should initially seem admirably meticulous, until her research becomes an end in itself, burying contradictions under piles of data. The judge (Maya) needs righteous fury that later exposes her own absolutism when she demands erasure rather than reckoning. 

  The bridge renaming is perfect—it's tangible, costly ($250k estimate in my outline), and symbolically layered. Silas sees the name as inspiration; Clara wants its history preserved but unchanged; Maya insists on removal as exorcism. The fourth mode should emerge from their deadlock: perhaps a young librarian suggests contextualizing the name with a plaque about the stolen land, turning the bridge into a site of ongoing dialogue rather than veneration or denial. 

  Key nuance: the user wants the ending to "serve present life." So the solution must be practical (cheaper than removal), inclusive (honoring indigenous voices), and forward-looking (using history to shape ethics now). No character should preach this; it crystallizes through their conflict. I'll imply it through sensory details—sunlight on the new plaque, the river's flow beneath the bridge—suggesting time as continuum, not idol or artifact or courtroom. 

  Word count pressure means cutting every abstraction. Each committee scene must advance both plot and philosophy through concrete actions: Silas slamming a ledger, Clara spreading fragile maps, Maya's voice cracking as she recounts a victim's diary. The founding myth itself will surface through disputed fragments—a chief's "gift" speech (likely coerced), a settler's journal boasting of "clever negotiations." 

  ...And absolutely no afterword. The story must stand alone, trusting students to excavate its ideas. That's the real test.
