  First, I need to map the core moves. The forfeiture model argues hypocrisy voids the blamer's moral authority like a judge with conflicts of interest—blame becomes invalid, not just ineffective. The evidential model counters that hypocrisy merely undermines blame's persuasiveness; it's still *attempting* to register truth, just clumsily. 

  Now, assessing against their five pressures: 

  For the quietism worry, forfeiture seems vulnerable—if systemic complicity revokes standing, collective moral paralysis follows. But is complicity always hypocritical? A sweatshop critic wearing fast fashion might be inconsistent yet still *right*; forfeiture must distinguish hypocrisy from unavoidable complicity. Evidential model dodges this by focusing on blame's function: even compromised blamers can spotlight truths if their act convinces. 

  Borrowed standing reveals deeper splits. When allies blame on victims' behalf, forfeiture likely says the *ally's* standing matters—if they're complicit, their advocacy is void. Evidential model might treat it as channeling the victim's standing, so ally-hypocrisy only weakens delivery. 

  On acts vs. character: forfeiture could consistently revoke standing for both, since hypocrisy taints the blamer's authority regardless of target. Evidential might differentiate—blaming character when you share those flaws is extra unpersuasive because it signals self-blindness. 

  Registration vs. warrant is forfeiture's tightrope walk. It must explain why hypocritical blame still "feels" truth-tracking without granting it standing. My solution: such blame is like a broken clock right twice a day—it captures facts but lacks normative force. Evidential easily accommodates this; poor delivery doesn't negate content. 

  Repair is forfeiture's advantage. Standing can be restored through reform—apology cleanses the moral ledger. Evidential struggles here; credibility repairs are about skill, not moral status. 

  Having weighed this, I'll endorse a hybrid: standing requires *both* minimal integrity (forfeiture element) and functional efficacy (evidential element). Hypocrisy primarily undermines integrity, but extreme cases also sabotage function. In practice, we should reject hypocritical blame as illegitimate but salvage its truth—"you're right, but you can't be the one to say it." 

  The user clearly wants rigor, not platitudes. They're likely an academic or advanced student pushing past superficial "hypocrisy!" debates. Their framing suggests frustration with slogan-driven discourse, so I'll avoid glib conclusions. The systemic-injustice angle hints at real-world concerns—maybe they're wrestling with activist dilemmas. I'll ground the verdict in practical guidance: "call out wrongs, but first clean your hands."
answer: |-
  ## The Hypocrite's Blame: Forfeiture, Evidence, and Moral Authority

  **Brainstorming Moves:**

  *   **Forfeiture Model:**
      *   *Pro:* Hypocrisy is a moral disqualifier, akin to a judge with a conflict of interest. Blaming while guilty of the same wrong violates the reciprocity inherent in moral norms, rendering the blame illegitimate ("tu quoque").
      *   *Con (Quietism):* Risks widespread moral paralysis in unjust societies where complicity is pervasive. Must distinguish *culpable* hypocrisy from non-culpable complicity or distinguish *degree* of wrong.
      *   *Borrowed Standing:* Likely holds the *third party's* standing is crucial; if *they* are hypocritical/complicit, borrowing fails. The victim's standing is irrelevant to the *borrower's* authority.
      *   *Repair:* Standing can be restored through genuine repentance and reform, demonstrating renewed commitment to the norm.

  *   **Evidential Model:**
      *   *Pro:* Focuses on blame's function – prompting recognition and amendment. Hypocrisy merely weakens the *message*, making it less credible or effective, not inherently illegitimate. The underlying wrong remains real.
      *   *Con:* May reduce blame to mere persuasion, losing its distinctive normative "oomph." Struggles to explain the deep *offense* of hypocritical blame beyond ineffectiveness.
      *   *Borrowed Standing:* Focuses on the *act's* function. If the third party effectively communicates the victim's grievance, even if hypocritical themselves, the blame might still function well *for the victim*. Whose standing is exercised is murky.
      *   *Repair:* "Restoration" isn't about status, but about rebuilding credibility through changed behavior, making future blame more effective. No "standing" to restore, only efficacy to rebuild.

  **Polished Essay:**

  The corrosive sting of hypocritical blame – condemning others for faults one shares – presents a profound challenge for theories of moral standing. Does hypocrisy nullify the blamer's authority entirely (Forfeiture Model), or merely sabotage the effectiveness of their rebuke (Evidential Model)? Assessing these models against key pressures reveals the Forfeiture Model, albeit refined, as capturing the core normative truth, while the Evidential Model provides crucial functional insights.

  **The Forfeiture Model: Standing as Moral Authority**
  This model posits standing as a normative status or power, grounded in the blamer's own relationship to the norm invoked. Hypocrisy – being guilty of the very wrong one condemns – constitutes a fundamental moral disqualification. By violating the norm, the blamer forfeits the moral right to hold *others* accountable for it. This violates a principle of reciprocity: demanding adherence to a standard one flouts oneself undermines one's position as a legitimate enforcer. The blame isn't just poorly delivered; it's *out of order*, akin to a corrupt judge issuing a ruling. This explains the unique indignation often felt – it's not merely ineffective communication, but an illegitimate exercise of moral power.

  **The Evidential Model: Standing as Functional Credibility**
  The Evidential Model rejects normative status, defining standing purely functionally: does the blaming act have the capacity to serve as a reason for the target to recognize their fault and amend? Hypocrisy matters only instrumentally. A hypocrite's blame is often ineffective because their inconsistency undermines credibility ("Why should I listen to *you*?"), fails to model the demanded virtue, or suggests the norm isn't truly important. However, the blame itself can still *register* the genuine wrong; it just does so poorly. The focus is on whether the act *works* as a vehicle for moral communication, not on the blamer's inherent right to speak.

  **Assessment Against Pressures:**

  1.  **The Quietism Worry:** This is a serious challenge to Forfeiture, but not a reductio. The model *must* distinguish between **culpable hypocrisy** (knowingly violating a norm one endorses and enforces) and **non-culpable complicity** (being embedded in an unjust system without realistic alternatives or full awareness). Forfeiture applies primarily to the former. While pervasive complicity in unjust structures is a genuine moral problem, it doesn't automatically make *every* act of blame by a complicit person hypocritical in the relevant, culpable sense. The Evidential Model easily avoids quietism – even a hypocrite *can* deliver effective blame – but at the cost of downplaying the normative illegitimacy.
  2.  **Borrowed Standing:** This highlights a divergence. The Forfeiture Model suggests the *third party's* standing is paramount when they blame *on behalf* of another. If the ally is hypocritical or complicit in the *specific* wrong (e.g., a white savior benefiting from racism condemning a racist act), their borrowed blame lacks legitimacy. The victim's standing isn't "transferred"; the ally exercises their *own* (now forfeited) standing purportedly in solidarity. The Evidential Model focuses on whether the act successfully communicates the *victim's* grievance. If it does (e.g., accurately amplifying the victim's words), the ally's personal hypocrisy might be pragmatically problematic but doesn't inherently void the message's validity *for the victim*. Whose "standing" is exercised remains ambiguous.
  3.  **Acts vs. Character:** A nuanced difference emerges. Forfeiture likely applies consistently: blaming *character* (e.g., "You're a liar!") while possessing that character flaw forfeits standing just as blaming a specific lie does. Evidential considerations might intensify here, as character hypocrisy often reveals profound self-deception, making the blame spectacularly ineffective and lacking self-awareness. However, the core analysis (standing revoked vs. message ineffective) remains the same for both models across act/character blame.
  4.  **Registration vs. Warrant:** This is a strong point for Forfeiture. It readily explains the phenomenon: the hypocrite's blame can *register* the genuine wrong (the clock is right twice a day) precisely because the wrong *is* real and objective, independent of the blamer. However, it lacks *warrant* – the blamer lacks the *authority* or *standing* to be the one delivering that condemnation. Their violation of the norm strips them of the normative power to hold others accountable for it, even if their words accidentally point to the truth. The Evidential Model struggles less here, as registration *is* its core function, but it may over-assimilate warrant to mere recognition.
  5.  **Repair:** Forfeiture naturally accommodates restoration. Genuine repentance, apology, and sustained reform demonstrate a renewed commitment to the norm. This can restore the blamer's moral standing and thus their warrant to blame. The Evidential Model deals in credibility repair (changed behavior makes future blame more persuasive), but lacks the conceptual resources for "restoring standing" as a normative status – there was no status to restore, only efficacy to build.

  **Verdict and Implications:**

  The balance of argument favors a **modified Forfeiture Model** as capturing the essential normative core of standing. Hypocrisy, understood as *culpable* violation of a norm one seeks to enforce against others, does defeat standing. It constitutes a genuine moral disqualification, rendering the blame illegitimate, not merely poorly delivered. The Evidential Model's insights are crucial, however: hypocrisy *also* typically (but not always) sabotages blame's effectiveness, and forfeited standing is often *restored* precisely by actions that rebuild evidential credibility (repentance/reform).

  Therefore, I advocate for a **Hybrid Position: Standing requires both minimal normative integrity (Forfeiture element) and sufficient functional credibility (Evidential element) for the specific blaming act.** Culpable hypocrisy primarily violates the integrity condition, nullifying warrant. However, extreme cases of hypocrisy might also inherently sabotage the functional condition (e.g., blame so steeped in self-deception it cannot rationally engage the target). Crucially, restoration of standing *requires* rebuilding both normative integrity (through repentance) *and* functional credibility (through reformed conduct).

  **Settled vs. Contested:**
  *   **Settled:** Hypocrisy is morally problematic and often undermines blame's effectiveness. Blame aims (at least in part) at moral communication and prompting amendment. The "quietism worry" is a genuine concern needing addressal.
  *   **Contested:** The *fundamental nature* of standing (status vs. function), whether hypocrisy *inherently* nullifies standing or merely undermines efficacy, the exact mechanics of borrowed standing, and the primacy of the forfeiture vs. evidential explanation for the wrongness of hypocritical blame remain live, complex debates.

  **Conclusion: How to Treat the Hypocrite's Blame**

  We should treat the blame of the *culpable* hypocrite as **illegitimate** – lacking the proper standing or warrant. This means:
  1.  **Reject its Authority:** Do not grant it the normative force it claims. Respond with "You have no right to say that, given your own actions."
  2.  **Acknowledge the Underlying Wrong (if present):** Separate the message from the messenger. "What you say about X is true, but your hypocrisy undermines your right to condemn it."
  3.  **Focus on the Hypocrisy:** The primary wrong becomes the hypocrite's own inconsistency and illegitimate exercise of moral power. Challenge *that*.
  4.  **Encourage Restoration:** If the hypocrite demonstrates genuine repentance and reform, acknowledge the potential restoration of their standing to address the *original* wrong meaningfully in the future.

  The hypocrite's blame is not mere noise; it points, however illegitimately, to a truth. But only those who live by the norms they invoke possess the moral authority to enforce them. Forfeiture captures this essential link between moral integrity and the power to blame.
