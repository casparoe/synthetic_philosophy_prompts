prompt: |-
  I'm in a philosophy of biology reading group that's been going in circles for weeks, and I think the problem is that none of us actually has a clear standard for what a good account of this stuff is supposed to do. The stuff being Dennett's cranes-and-skyhooks image and the related accusation of "greedy reductionism" — the idea that some explanations cheat by pulling the rabbit out of a hat (a skyhook), while legitimate ones build the rabbit up out of smaller cranes all the way down, and that the sin of greedy reductionism is skipping levels to explain something high-level by something absurdly low-level. Fine, I get the vibes. But before we read another paper, I want the actual spec. So write me the desiderata: what does any theory of how complex, apparently designed-looking structure gets produced *without a designer* have to deliver? Give me the full list — the cases it has to get right (origin of life, the eye, minds, and tell me whether culture or markets or ecosystems even belong on the same list or whether that's a category error), the puzzles it has to dissolve or at least pin down, and the distinctions it can't be allowed to collapse (order vs. complexity? a crane vs. merely a small skyhook? selection vs. mere sorting?). With each one, say what consideration forces it onto the list.

  Two things I especially want you to chew on, because I suspect they're where our group keeps going wrong. First, a friend proposed that the whole thing reduces to one rule — "no unexplained lifting," i.e. every bit of apparent design has to be paid for by some earlier process — and claimed that's the desideratum and everything else is commentary. Is that a genuine requirement or just the crane/skyhook slogan dressed up? Second, is greedy reductionism really a *distinct* failure mode, or is it just skyhook-thinking with the arrow reversed (i.e. the same crime of not actually doing the lifting, only pointed downward)? Also flag any pair of desiderata you think can't be jointly satisfied, and tell me which single requirement does the most work in ruling candidates out. Skip scoring the famous positions, I'll do that in the group — I just want the criteria, and be honest about which ones are load-bearing and which are just camp preferences.
reasoning: |-
  Okay, let's dive into this user's problem. They're in a philosophy of biology reading group stuck on Dennett's cranes vs. skyhooks and greedy reductionism. The core issue seems to be a lack of clear criteria for evaluating theories about complex structures without designers. 

  First, I need to unpack what they're really asking for. They want a comprehensive list of desiderata - not just examples, but the underlying principles that make an explanation valid. The two specific puzzles they mention (the "no unexplained lifting" rule and whether greedy reductionism is distinct) suggest their group might be oversimplifying or conflating concepts.

  Hmm, the user is clearly frustrated with circular discussions. They're not just seeking information but a framework to break the deadlock. As a former academic, I recognize this need - when theoretical debates get muddy, you need methodological clarity. 

  For the desiderata list, I should start from first principles of what makes a scientific explanation valid in evolutionary biology. The key is to distinguish between necessary features (like accounting for cumulative selection) versus nice-to-have properties (like elegance). The "no unexplained lifting" rule is necessary but insufficient - it's the baseline, not the whole story.

  The greedy reductionism question is tricky. Upon reflection, it's distinct from skyhooks because it fails differently: skyhooks add unexplained complexity upward, while greedy reductionism ignores essential levels downward. Both violate the lifting principle but in opposite directions. 

  For the case coverage, origin of life and complex adaptations like eyes are non-negotiable. But including culture/markets is more debatable - they might belong in a separate category since they operate on different replication mechanisms (memes vs genes). The user needs to decide if they're testing universal complexity theory or specifically biological evolution.

  The hardest trade-off will likely be between mechanistic precision (demanding step-by-step crane sequences) and recognizing that some historical steps are irrecoverable. A good theory must navigate this - requiring plausible crane sequences without demanding impossible historical detail.

  The most load-bearing criterion? Probably the cumulative selection requirement. It's what rules out both skyhooks and greedy reductionism while explaining the appearance of design. Everything else builds on this core Darwinian insight.
answer: |-
  Here’s a rigorous specification of desiderata for theories explaining complex, design-like structures without a designer, framed to resolve your group’s deadlock. Each item includes the *reason* it’s necessary, its *load-bearing status*, and clarifications on your key sticking points.

  ---

  ### **Core Desiderata: Non-Negotiable Requirements**
  *(Fail any of these = theory is invalid)*

  1.  **Account for Cumulative Selection**  
      *   **What it must deliver:** Demonstrate how incremental, non-random selection across generations can generate complexity from simplicity.  
      *   **Why load-bearing:** Without cumulative selection, you revert to skyhooks (single-step miracles) or random chance (statistically impossible for complex adaptations).  
      *   **Forces it onto the list:** Darwin’s core insight: design without a designer *requires* amplification of slight advantages over time.  
      *   **Pins down:** Distinguishes selection (differential replication) from mere sorting (e.g., pebbles on a beach). Sorting lacks heritability.

  2.  **No Unexplained Complexity / "No Unexplained Lifting"**  
      *   **What it must deliver:** Every feature implying "design" must be traceable to prior processes with *less* pre-existing complexity/intentionality.  
      *   **Why load-bearing:** Directly targets skyhooks. If a step demands unexplained complexity (e.g., "irreducibly complex" systems), it’s invalid.  
      *   **Your friend’s rule assessed:** This *is* the core anti-skyhook desideratum. But it’s **necessary yet insufficient alone** (see below).  
      *   **Critical distinction:** A "crane" is a *demonstrably viable* lifting process; a "small skyhook" invokes an unexplained mini-miracle.

  3.  **Scalable Gradualism**  
      *   **What it must deliver:** Show viable pathways where each intermediate stage is:  
          (a) Functionally viable (not "half an eye"),  
          (b) Selectively advantageous *in its context*,  
          (c) Plausibly reachable from the prior stage.  
      *   **Why load-bearing:** Rules out "gaps" requiring saltations (skyhooks) or non-adaptive intermediates (violating selection).  
      *   **Forces it onto the list:** The "design" illusion arises *because* intermediates are hard to intuit.  
      *   **Key case:** Origin of the vertebrate eye (Nilsson & Pelger’s model shows plausible gradual steps).

  4.  **Account for the Origin of Replication/Heritability**  
      *   **What it must deliver:** Explain how systems capable of faithful replication (with variation) arose from non-replicating chemistry.  
      *   **Why load-bearing:** Cumulative selection requires heritable variation.  
      *   **Critical case:** Origin of Life (OoL). Must bridge abiotic chemistry → simple replicators → protocells.  
      *   **Puzzle:** Avoids conflating OoL (replicator origin) with later evolution (replicator refinement).

  ---

  ### **Essential Refinements: Avoiding Greedy Reductionism & Category Errors**
  *(Fail these = theory is incomplete or misleading)*

  5.  **Respect Emergence & Multiple Realizability**  
      *   **What it must deliver:** Acknowledge that higher-level phenomena (e.g., consciousness, ecosystems) have properties not trivially predictable from lower-level components *alone*, while still being crane-built.  
      *   **Why load-bearing:** Prevents "greedy reductionism" (explaining a mind *only* by quarks).  
      *   **Distinction:** Greedy reductionism **IS distinct** from skyhooks:  
          *   **Skyhook:** Illegitimate upward lift (adding unexplained complexity).  
          *   **Greedy Reductionism:** Illegitimate *downward collapse* (ignoring essential causal levels, pretending high-level phenomena are *nothing but* low-level parts).  
      *   **Force:** Explains why "physics explains everything" is true but useless for biology – it ignores organization and selection history.

  6.  **Specify the Level(s) of Selection & Inheritance**  
      *   **What it must deliver:** Clearly identify what entities replicate, vary, and are selected (genes, cells, organisms, groups, memes?) in the system.  
      *   **Why load-bearing:** Prevents category errors (e.g., naively applying genetic models to cultural evolution without proving memes exist/replicate).  
      *   **Forces onto list:** Resolves whether culture/markets/ecosystems belong:  
          *   **Culture/Markets:** Belong *only if* they demonstrably involve units of inheritance (memes), variation, and selection. Requires separate proof.  
          *   **Ecosystems:** Generally *not* on the same list. They lack replicators; they are dynamic outcomes of lower-level selection processes, not selectors themselves (usually).  
      *   **Pins down:** Distinguishes selection *within* a system from sorting *of* systems.

  7.  **Distinguish Order vs. Adapted Complexity**  
      *   **What it must deliver:** Explain why snowflakes (order from physical law) ≠ eyes (complex adaptation from selection history).  
      *   **Why essential:** Prevents hand-waving by conflating simple self-organization (a crane!) with cumulative adaptation.  
      *   **Force:** Accounts for the *historically contingent*, *functional* nature of biological complexity vs. law-driven order.

  ---

  ### **Pragmatic Desiderata: Judging Explanatory Power**
  *(Fail these = theory is weak, but not invalid)*

  8.  **Handle Path Dependency & Contingency**  
      *   **What it must deliver:** Acknowledge that historical accidents ("frozen accidents") constrain future pathways.  
      *   **Why pragmatic:** Explains why similar functions evolve differently (e.g., vertebrate vs. cephalopod eyes).  
      *   **Avoids:** Over-engineering explanations implying inevitability.

  9.  **Address Apparent "Junk" & Non-Adaptive Traits**  
      *   **What it must deliver:** Explain non-functional complexity (e.g., junk DNA, vestigial organs) without resorting to "hidden function" skyhooks.  
      *   **Why pragmatic:** Tests robustness against non-adaptive noise.  
      *   **Force:** Neutral processes (drift, hitchhiking) are cranes too.

  10. **Falsifiability / Vulnerability to Evidence**  
      *   **What it must deliver:** Specify what evidence could disprove or significantly challenge the account.  
      *   **Why pragmatic:** Separates science from "just-so" stories.

  ---

  ### **Load-Bearing Analysis & Tensions**
  *   **Most Load-Bearing Desideratum:** **#1 (Cumulative Selection)**. It’s the irreplaceable engine. Without it, you get skyhooks or impossibility. Does 90% of the work ruling out non-starters.
  *   **"No Unexplained Lifting" (#2)** is the *guardrail*, not the engine. Necessary to block cheating, but powerless without #1.
  *   **Key Tension:** **#3 (Scalable Gradualism)** vs. **#5 (Respect Emergence)**.  
      *   *Tension:* Demanding every micro-step be specified (#3) can *encourage* greedy reductionism (#5 violation).  
      *   *Resolution:* Require *plausible pathways* at *appropriate levels*. Explain a mind via cognitive architectures → neural mechanisms → cellular biology → chemistry, not mind → chemistry directly. Skipping *adjacent* levels is greedy.
  *   **Greedy Reductionism is Distinct:** As argued in #5. Skyhooks invent unexplained lift; Greedy Reductionism denies real levels of causation. Both violate "no unexplained lifting," but in opposite directions (adding vs. erasing).
  *   **Culture/Markets/Ecosystems:** Culture/markets *can* be on the list *if* they demonstrably involve replicators (memes) and selection. Ecosystems generally are *not* selectors; they are complex *products* of selection acting on organisms/genes. Applying selectionist language here is often metaphorical and risky.

  ---

  ### **Summary: The "Spec"**
  A valid theory must:  
  1.  **Use cumulative selection** as its engine.  
  2.  **Never add unexplained complexity** (anti-skyhook).  
  3.  **Show plausible, stepwise paths** for complex features.  
  4.  **Explain replicator origins** (for OoL).  

  A *good* theory also:  
  5.  **Doesn't reduce across essential levels** (anti-greedy).  
  6.  **Defines its units of selection/inheritance** clearly.  
  7.  **Distinguishes selection-driven complexity from simple order**.  

  Take this to your group: Score theories against *each* desideratum. If a theory fails #1 or #2, reject it. If it fails #5 or #6, critique its reductionism or scope. If it aces #1-4 but struggles with #3 (e.g., precise OoL pathways), it’s promising but incomplete. This cuts through vibes to mechanics. Good luck!
