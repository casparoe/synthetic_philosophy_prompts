  ## BENCH MEMO: *In re Appeal from Licensing Authority Decision [Case No.]*

  **BOTTOM LINE RECOMMENDATION: ALLOW THE APPEAL.** The new Appeals Authority possesses the implied power to grant leave to appeal to this court. The appellant's case should proceed substantively. (Recommended Vote: 2-1 to Allow)

  **REASONING:**

  1.  **Parliamentary Intent is Paramount:** The foundational principle is that Parliament intended to create a coherent and workable appellate scheme when it abolished the Review Panel and established the Appeals Authority. The explicit transfer of the Panel's *functions* to the Authority is clear. The right of appeal to this court, conditional on leave, existed before the transfer and was not expressly abolished. To hold that no entity can now grant leave renders the entire appellate structure – which Parliament clearly preserved by transferring the substantive appeal function – a nullity. This frustrates the obvious legislative purpose and creates an absurdity Parliament cannot have intended: preserving the theoretical possibility of a court appeal while making its initiation functionally impossible due to a purely administrative gap.

  2.  **The "Leave" Requirement is Procedural, Not Jurisdictional:** Critically, the leave requirement served as a *caseload filter* for the old Review Panel, not as a gatekeeper defining this court's fundamental jurisdiction. Its purpose was to prevent the Panel from being overwhelmed, allowing only arguable cases to proceed *to the Panel*. Parliament, by transferring the Panel's functions *including hearing substantive appeals*, implicitly intended the new Authority to manage its own caseload. Granting leave is an inherent and necessary procedural step within the Authority's transferred function of processing appeals destined for this court. It is logically inseparable from the Authority's explicit power to handle appeals formerly dealt with by the Panel. Recognizing this implied ancillary power avoids the absurd result and gives effect to the statutory scheme.

  3.  **"Only Powers Given" is Not Absolute in Context:** While it is true that statutory bodies possess only conferred powers, this principle operates within the framework of giving effect to legislative purpose. Courts routinely imply powers necessary to make an express statutory function workable, especially where a literal reading creates an operational vacuum defeating that function. Here, the power to grant leave is a necessary and incidental procedural power essential for the Authority to exercise its explicit, transferred appellate function effectively. Conjuring a power would be impermissible; recognizing a necessary implication arising from the statutory context and purpose is sound interpretation.

  4.  **Access to Justice Reinforces Interpretation:** While not the primary driver, the constitutional principle of access to a court supports this interpretation. Parliament did not abolish the right of appeal to this court; it restructured the preliminary step. Interpreting the statute to accidentally extinguish that right requires exceptionally clear language, which is absent. Our interpretation ensures a viable path to the court remains open, aligning with the principle that rights of appeal should not be lightly inferred to have been abolished.

  **STRONGEST ARGUMENT FOR DISMISSAL (Requiring Legislative Fix):**

  The principle that "a statutory body has only the powers expressly or by necessary implication conferred upon it" must prevail. The statute unambiguously states that leave is granted by the Review Panel. The Review Panel no longer exists. The consequential amendments failed to transfer this specific power to the Appeals Authority. While this creates an unfortunate gap, it is not for the court to fill it. The Authority is correct: it has no textual basis upon which to exercise a power still legislatively assigned to a defunct body.

  *   **Textual Fidelity:** The words of the statute are clear: "leave... granted by the Panel." No Panel exists. The Authority's constituting statute does not list "granting leave to appeal to the court" as one of its functions or powers. We cannot rewrite the statute.
  *   **Avoiding Judicial Legislation:** Implying a power, however convenient or sensible it seems, crosses the line into judicial legislation. It usurps Parliament's role. The absurdity, while regrettable, is the consequence of legislative oversight, not judicial error. The proper remedy lies with Parliament to amend the statute, not with the court to invent powers.
  *   **The Jurisdiction/Filter Distinction is Immaterial:** Even if leave was merely a filter for the Panel, the fact remains that the statute makes it a *condition precedent* for invoking the court's jurisdiction. The court's jurisdiction to hear the substantive appeal is conditional on leave being granted *by the Panel*. That condition cannot be fulfilled. Whether the Panel needed filtering is irrelevant; Parliament made this step mandatory and assigned it exclusively to the Panel. Without fulfillment of that statutory condition, the appeal cannot validly be brought before this court. The court lacks jurisdiction *because the precondition set by statute cannot be met*.
  *   **Slippery Slope:** Accepting this implication risks undermining the certainty provided by the "powers must be granted" principle. If we imply this power due to perceived absurdity, it sets a precedent for implying powers in other inconvenient situations, eroding the boundaries of statutory interpretation.

  **CONCLUSION:**

  The injustice and frustration of the current situation are undeniable. However, the choice is not between injustice and judicial overreach. Recognizing the Authority's implied power to grant leave is a legitimate exercise in statutory interpretation that gives effect to Parliament's clear intent to maintain a viable appellate structure while respecting the transfer of functions. It relies on the necessary implication of a procedural power incidental to an expressly granted function (hearing appeals) and avoids an absurd result Parliament did not intend. Dismissing the appeal elevates textual literalism over purposive interpretation and would effectively abolish a right of appeal through inadvertent omission, a result Parliament is presumed *not* to have desired. **Recommendation: Allow the Appeal. The Appeals Authority has the power to grant leave; this appeal should be remitted to it for a leave determination.**

  **Key Conference Question:** Does the Panel agree that the "leave" requirement was primarily a *caseload management filter* for the abolished Panel (supporting implication), or was it a substantive condition defining *this court's jurisdiction* that cannot be bypassed (supporting dismissal)? This distinction is pivotal to the outcome.
