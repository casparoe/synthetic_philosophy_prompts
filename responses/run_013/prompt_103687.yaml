prompt: |-
  Ok so in civics we did a unit on privacy and the state and I ended up reading about this thing that happened in West Germany in 1983, where the government announced this big census that was gonna collect all kinds of stuff about everyone, and alot of the country freaked out and started boycotting it, people refused to fill out the forms, there was a whole protest movement, and then in December 1983 the West German constitutional court ruled on it and said the law went too far and that the constitution protects what they called informational self-determination, basically your right to decide for yourself what happens to your personal information. (The census got delayed and they only actually ran it in 1987.) So here's what I'm trying to figure out. Somewhere I came across this idea called contextual integrity, I think from a philosopher named Nissenbaum, where privacy isn't about keeping secrets, it's about information flowing the way its supposed to flow in whatever context you're in, like its normal for your doctor to know your medical stuff but weird for your boss to. I want you to take the 1983 census fight and analyze it through that idea in both directions: what the theory explains about the episode, and where the theory kinda breaks or goes quiet on it. I also want to know where the court's own idea (informational self-determination) is basically the same as contextual integrity and where its actually a different kind of claim, and what the whole episode says about the american attitude that if you've got nothing to hide then you've got nothing to worry about. Can you give me the whole thing as exactly five numbered points, a sentence or two each, no intro at the start and no conclusion at the end, just the five?
