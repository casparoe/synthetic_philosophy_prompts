  Okay, the user wants a robust argument for a specific interpretation of Aquinas on tyrannicide, one that challenges the common view that he changed his position over time. They've laid out a detailed framework requiring engagement with textual tensions, conceptual distinctions, and potential objections. 

  First, I need to grasp the core tension: early texts seem permissive of killing tyrants (framed as refusal of obedience), while later works emphasize caution and institutional remedies. The user insists we avoid harmonizing platitudes and instead show how the reasoning coheres structurally. 

  The key thesis is that Aquinas distinguishes between two questions: (1) Can unjust authority bind conscience? (early text) and (2) How should a community lawfully remove a ruler? (later texts). This reframes "change of mind" as "change of question." 

  For the first point on defective title vs. defective exercise: Political authority derives from the common good, so defect in title means no legitimate authority exists at all. That's why early text treats such rulers as bandits - their commands lack moral force. Defective exercise still has authority structure intact, just abused. The permission must cover defective title because only then is the ruler fundamentally illegitimate. 

  On the second point about absence of superior authority: Aquinas's logic suggests the community itself retains latent authority. The people aren't powerless; they are the original source of power. But this collective authority must act through designated mechanisms (e.g., representatives), not private vengeance. 

  Third, the "public authority" reading isn't vacuous. It clarifies that deposition isn't arbitrary power but justice channeled through proper forms. Also, it guides subordinate magistrates who may hold delegated authority to act when superiors fail. 

  For the rival reading (anyone can kill a tyrant): Its strength is that grave injustice destroys the ruler's moral standing. But this conflates moral desert with legal authority to punish. Aquinas consistently separates the two - even a tyrant deserves due process. The killer acting privately becomes a vigilante, not an instrument of justice. 

  Enduring moderate tyranny: This is primarily prudential (avoiding worse chaos) but also acknowledges that judgment of tyranny is fallible. It doesn't negate the core principle - the permission remains for extreme cases, but prudence tempers its application. 

  Strongest objection to my reading: Aquinas in the early text doesn't explicitly restrict killing to public agents. But I'd counter that the context (refusal of obedience) implies the actor is resisting unjust coercion, not claiming punitive authority. The later emphasis on public remedies confirms this implicit boundary. 

  Defeater evidence would be if Aquinas ever endorsed private individuals killing a ruler solely for unjust acts (not defective title) without any claim to delegated authority. None exists to my knowledge. The user clearly wants rigorous engagement, so I'll avoid scholarly name-dropping and focus on logical architecture as requested.
answer: |-
  ## A Coherent Aquinas on Tyrranicide: Authority, Not Anarchy

  The apparent contradiction in Aquinas’s texts on tyrannicide stems not from a change in principle, but from a shift in focus: the early commentary (e.g., *Scriptum super Sententiis*) examines the *moral limits of obligation to authority*, while the later works (*De Regno*, *Summa Theologiae*) address the *lawful exercise of public power to remedy tyranny*. The permission to kill a tyrant belongs intrinsically to *public authority*, not private persons. Here’s the argument structured by your points:

  1.  **Defective Title vs. Defective Exercise: The Core Distinction**
      *   **Defective Title (Usurper):** The ruler lacks legitimate authority from the outset (e.g., a conqueror imposing rule without consent, a fraudster). He is not a true ruler but a *latro* (brigand/outlaw), as Aquinas suggests (*De Regno* I.6). His commands inherently lack moral force because political authority derives solely from its ordination to the common good. He possesses no just title.
      *   **Defective Exercise (Tyrant):** The ruler holds legitimate title initially but subsequently governs unjustly, neglecting or actively harming the common good. The *structure* of authority remains valid, even if its exercise is corrupted.
      *   **Which does the permission cover?** The permission plausibly covers **Defective Title**. The reason is intrinsic to the nature of political authority: **Authority flows from the community for the common good.** A ruler defective in title *never* legitimately held this authority; he occupies the office illegitimately. Removing him isn't overthrowing authority, but removing an obstacle *to* legitimate authority. Killing such a usurper, under specific conditions, can be an act restoring the community's capacity for self-governance. Defective exercise, however, involves the *abuse* of genuine authority. Removing such a ruler requires due process precisely *because* the authority structure exists and must be respected, even in its malfunction. The severity of wrongdoing is secondary; the *ontological status* of the ruler's claim to authority is primary. A usurper commits a fundamental injustice against the community's right to legitimate government, regardless of whether his rule is moderate or harsh.

  2.  **The Absence of a Superior: Community Latency, Not Private License**
      *   Aquinas's logic demands that the *absence of a human superior does not create a permission for private persons to kill*. Instead, it means the *community itself, as the original source of authority*, retains the latent right to act through its *public capacity*. This is not anarchy.
      *   **Mechanism:** The community must act collectively and ordinately, typically through designated representatives (e.g., nobles, elders, elected officials, a general council) who *embody its public authority* in the absence of a higher temporal power. They act as the *ministers* of the community's justice, not as private avengers.
      *   **Why not private action?** Private individuals lack the *standing* to judge and execute a ruler, even a usurper, on behalf of the community. Doing so arrogates a public function, risks factionalism and vengeance, and undermines the very principle of ordered justice Aquinas cherishes. The absence of a superior doesn't negate the requirement for public, representative action; it merely means the community acts *directly* through its designated instruments, rather than appealing upwards. There *is* a lawful remedy, but it must be *publicly constituted*.

  3.  **The Work of the Permission: Clarifying Legitimacy and Empowering Subordinate Authority**
      *   This reading does crucial work beyond justifying an act already performed:
          *   **Legitimizing Resistance:** It provides a principled basis for subordinate magistrates or representatives to act *against a superior* who is a usurper (defective title). It answers the question: "Can we *rightly* refuse obedience and remove this person?" It affirms that their authority, derived from the community, is not nullified by the usurper's presence but may *oblige* them to act for the common good.
          *   **Defining Limits:** It sharply distinguishes legitimate deposition (public action against a usurper) from sedition (private rebellion against legitimate, though perhaps unjust, authority - defective exercise). This protects the principle of authority while allowing for its restoration when fundamentally absent.
          *   **Guiding Judgment:** It clarifies that the decisive factor is the *origin* of the ruler's claim, not merely the degree of his wickedness. This provides a more objective criterion than subjective assessments of tyranny.
          *   **Grounding Due Process (even for usurpers):** While permitting killing under extreme circumstances, the framework implies a *preference* for lawful, public deposition where possible, even for a usurper. The permission justifies the *possibility*, not the necessity or desirability, of lethal force when public order requires it.

  4.  **Confronting the Rival Reading: Forfeiture and Private Action**
      *   **Strongest Argument for Rival Reading:** Aquinas states that a tyrant who rules for private advantage rather than the common good "justly deserves to have his subjects withdraw their allegiance" and even be killed (*Scriptum* II, d.44, q.2, a.2). This, combined with the argument that resisting unjust command is licit, suggests that *any* ruler who fundamentally betrays the common good forfeits his authority and becomes a private malefactor, liable to be killed by anyone like any other unjust aggressor. The killer acts as an instrument of natural justice, vindicating the community's right.
      *   **Why it Fails:**
          *   **Conflation of Moral Desert and Juridical Authority:** Aquinas consistently separates the *moral guilt* of the ruler from the *juridical authority* to punish him. Even a tyrant guilty of capital crimes retains a formal status as ruler until lawfully deposed. Private individuals lack the *authority* to execute judgment; that belongs to the public power (*Summa Theol.* II-II, Q. 64, A. 3).
          *   **The Instrument Fallacy:** The argument that the killer acts as an "instrument of the community" is a legal fiction without substance unless the killer *actually holds public authority* or is *explicitly mandated* by it. Private vengeance disguised as public justice is still vengeance and leads to chaos (*Summa Theol.* II-II, Q. 42 on sedition).
          *   **Ignoring the Later Framework:** The cautious counsel in *De Regno* and the condemnation of sedition in the *Summa* make no sense if private tyrannicide were licit. They presume that removing a ruler, even a bad one, is a grave public act requiring public authority and prudent consideration of consequences.
          *   **The Difference is Foundational:** Distinguishing a public act of deposition (even lethal) from private killing is not a mere "legal formality." It is the difference between *justice* and *vengeance*, between *restoring order* and *inciting chaos*, between acting *for* the common good and acting from *private* passion or judgment. This difference carries immense moral weight for Aquinas, rooted in his understanding of natural law, order, and the requirements of the common good.

  5.  **Enduring the Moderate Tyrant: Prudence Dominant, Principle Intact**
      *   This counsel (*De Regno* I.6-7) is primarily **a dictate of prudence about consequences**. Aquinas argues that the evils flowing from rebellion (civil war, foreign invasion, worse tyranny) often outweigh the evils of enduring moderate oppression. It's a tragic calculation, not a moral endorsement of tyranny.
      *   **Why the Moral Thesis Survives:**
          *   The permission against a *usurper* (defective title) remains a valid *principle* grounded in the nature of authority. Prudence dictates *when and how* it is safe and beneficial to act on this principle, not *whether* the principle exists.
          *   It implicitly acknowledges the *fallibility of judgment*. Accusations of "tyranny" can be erroneous or exaggerated. The high bar for action (enduring moderate tyranny) protects against rash revolts based on subjective grievance against legitimate authority (defective exercise).
          *   It reinforces the need for *public, responsible judgment*. If the remedy is so dangerous even against moderate evil, it underscores that only the gravest circumstances (like a true usurper or extreme tyrant) justify action, and even then, only through the most responsible public channels available.

  **Strongest Objection to this Thesis:** The early text (*Scriptum*) explicitly places the act of killing the tyrant within the context of an individual's refusal of obedience and willingness to suffer martyrdom ("*potest aliquis licite occidere... etiam si occidatur*"). This strongly suggests the actor is conceived as a *private individual* making a conscientious stand, not a public official exercising authority. If the permission were inherently public, why frame it in such personal, conscience-driven terms?

  **What Would Defeat the Thesis:** Concrete textual evidence where Aquinas explicitly states that a ruler holding valid title (not a usurper) forfeits it *solely* through unjust exercise *and* that this forfeiture licenses *private individuals* (without any claim to delegated public authority) to kill him as an act of just punishment or defense of the community *as a whole* (beyond immediate self-defense). The *Scriptum* passage, while suggestive, can be read as addressing the extreme case of a usurper ("*qui dominium iniuste usurpavit*") and/or the individual's right to *refuse obedience and accept consequences*, not necessarily to *initiate lethal public action*. If Aquinas unequivocally endorsed the latter for a non-usurping tyrant, the thesis would fail. No such passage exists. The structure of his political thought, emphasizing order, authority, and the common good, consistently points away from private tyrannicide and towards public, lawful remedies, even in the fraught case of defective title.
