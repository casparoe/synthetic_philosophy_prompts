answer: |-
  ### Setting the bar  
  For genuine **cognitive penetration of perception**, cognition (beliefs, knowledge, expectations) must directly alter the *phenomenal character* of sensory experience itself—its "raw look"—prior to any judgment or interpretation. This requires:  
  1. **Pre-attentive influence**: The change occurs without conscious effort (e.g., not deliberate focusing).  
  2. **Stimulus-equivocation**: The sensory input alone underdetermines the percept (e.g., ambiguity).  
  3. **Non-interpretive immediacy**: The effect isn’t post-perceptual labeling (e.g., describing a cloud as "dragon-shaped").  
  **Distinguish from**:  
  - **Attention**: Selecting *what* is processed (e.g., focusing on one object).  
  - **Expectation**: Priming *interpretation* (e.g., seeing shapes as "bread" after a hint).  
  - **Judgment**: Post-perceptual belief-forming (e.g., knowing lines are equal but *seeing* them as unequal).  

  ---

  ### Tiered Case Analysis  

  | **Case** | **Tier**                       | **Justification**                                                                                                                                 |
  |----------|--------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|
  | (1)      | **Clearly a different phenomenon** | Demonstrates perceptual *immunity* to cognition: belief cannot override the illusion, proving perception’s autonomy.                                  |
  | (2)      | **Strong evidence**            | Color constancy: prior knowledge of bananas’ yellow penetrates hue perception under ambiguous lighting, altering saturation as a visual property.        |
  | (3)      | **Suggestive but contestable** | Expertise may enhance pattern recognition via attentional tuning, not necessarily altering raw visual properties (e.g., fractures may *pop out* due to learned filters). |
  | (4)      | **Probably not penetration**   | Semantic priming biases interpretation of ambiguous stimuli but doesn’t change low-level features (e.g., the blur’s contours remain identical).          |
  | (5)      | **Suggestive but contestable** | Could reflect learned perceptual differentiation (penetration) or post-perceptual categorization—hinges on whether "obvious difference" is visual or conceptual. |
  | (6)      | **Probably not penetration**   | Fear modulates attention and amplifies threat-signaling, but shadows’ motion is likely attentional warping, not altered visual data.                  |
  | (7)      | **Strong evidence**            | Language-driven shifts in color appearance under identical stimuli suggest cognition directly modulates perceptual content at a low level.                |
  | (8)      | **Clearly a different phenomenon** | Semantic satiation disrupts *meaning access*, not perception; the marks’ visual form remains intact (e.g., lines don’t physically change).            |

  ---

  ### Where the tiers are doing the work  
  Cases (3) and (5) posed the most difficulty. For (3), the radiologist’s "immediate" fracture sighting *could* indicate cognitive penetration (if expertise rewires visual processing) but might equally reflect optimized attention to diagnostic features—a contestable assumption about whether "seeing-as" is perceptual or post-perceptual. Case (5) hinges on the **phenomenological ambiguity** of "looking different": if the birds’ distinguishing features were always visible but unattended, cognition merely guided attention; if new visual properties emerged (e.g., subtle markings now "glow"), it suggests penetration. Both cases turn on whether cognition *generates* or *selects* perceptual content—a deep dispute in philosophy of mind. Case (7) was pivotal: if language primes truly alter color *appearance* (not just labeling), it implies cognition penetrates early vision, challenging modularity theories.  

  ---

  ### Bottom line  
  The "seeing is believing" intuition survives robustly but not naively. Genuine cognitive penetration (cases like 2 and 7) reveals perception as an *inferential process* shaped by prior knowledge—yet perception retains stubborn autonomy (cases 1 and 8). Crucially, cognition’s influence is most evident under sensory ambiguity, where perception *needs* top-down guidance. Everyday seeing thus blends raw sensation with intelligent prediction, but the world’s scaffolding remains perceptually grounded.
