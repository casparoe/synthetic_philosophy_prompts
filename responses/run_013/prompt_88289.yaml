prompt: |-
  Two friends of mine have been arguing for about a year and I want to force them to write it up properly, because I think they're mostly talking past each other. One of them thinks Condorcet's jury theorem is the deepest thing anyone has ever said about why majority rule is more than just a fair way to decide things. Her line: if each voter is even slightly better than a coin flip at getting the answer, and they form their opinions independently, then the majority converges on the truth as the group gets bigger -- so majority rule isn't just legitimate, it's truth-tracking. My other friend, the sceptic, thinks the theorem is a gorgeous machine made entirely out of assumptions that never hold: real people's errors are correlated, becuase they read the same papers and catch the same flu of the moment; real competence is all over the place; people vote strategically or stay home; and for a lot of political questions there's no "correct answer" to converge on in the first place.

  They've been going around in circles, mostly becuase the optimist is defending a theorem and the sceptic is attacking its applications, and neither of them has noticed. So write the joint statement they could both sign after a proper good-faith adversarial collaboration. Numbered list of agreed claims first -- and yes, that should include the theorem itself as a piece of mathematics, stated precisely enough that the sceptic signs it too: what exactly has to hold, what exactly converges to what as n grows, and what the finite-n version of the claim looks like. Then a disagreements table, one row per surviving disagreement, with a column giving the exact wording of the optimist's position (phrased so she'd accept it as her own) and a column giving the sceptic's, plus a column for the crux -- the sub-question that, if we actually settled it, would move one of them.

  For every crux, give the test or arguement both sides agree would bear on it, and each side's prediction, written down in advance. I especially want the following covered, since it's where I think the real action is: whether the theorem survives dependence between voters' errors, and whether there's some notion of "approximately independent" under which it does; whether it needs every voter above one half or only the average voter above one half; how large the group actually has to be before the majority is any good when competence is barely above chance; whether it survives people voting strategically instead of sincerely, or whether abstention by the uninformed ends up doing the work instead; whether the majority is genuinely better than the single best-informed voter or only better than the average one, and whether that distinction matters for the claim that democracy is epistemically good; and what happens once there are more than two options and majority preference starts going in circles -- whether that can be held together with the cheerful two-option result at all. If you decide some part of their fight is purely verbal -- say they mean different things by "competence" or "independence" -- tell me which part and what each of them actually means by it. No citations or reading list needed, and don't tell me who's right; the whole point is a document they can both put their names to.

  Finish with a single last line in the form \agreed{...} containing the one sentence about the jury theorem that both of them would sign.
reasoning: |-
  We are creating a joint statement for two friends: an optimist who sees deep truth in Condorcet's jury theorem and a skeptic who doubts its applicability. The goal is to have them agree on the mathematical theorem and then clearly outline their disagreements in a structured way.

  The statement will have:
  1. A numbered list of agreed claims, including a precise statement of the theorem.
  2. A table of disagreements with columns: 
     - Disagreement # 
     - Optimist's Position (exact wording she'd accept) 
     - Skeptic's Position (exact wording he'd accept) 
     - Crux (the sub-question that would resolve the disagreement) 
     - Test/Evidence (what both agree would bear on the crux) 
     - Optimist's Prediction 
     - Skeptic's Prediction

  We'll cover the requested topics in the cruxes.

  First, the agreed claims:

  ### Agreed Claims

  1. **Condorcet's Jury Theorem (CJT) as a mathematical statement:** 
     - We consider a group of `n` voters who must choose between two options: one correct (with objective truth) and one incorrect.
     - Each voter `i` has a fixed probability `p_i` of voting for the correct option, where `0 < p_i < 1`. 
     - The voters' votes are independent random variables.
     - Let `P_n` be the probability that the majority vote (i.e., more than half the voters) is correct.
     - If there exists a `p` such that `p_i >= p > 0.5` for every voter `i`, then as `n` approaches infinity, `P_n` converges to 1.
     - Additionally, if all `p_i = p > 0.5`, then `P_n` is increasing in `n` and converges to 1.
     - For finite `n`, the theorem provides bounds: for example, with identical `p_i = p > 0.5`, the majority is more likely correct than a single voter and the probability of correct majority increases with `n`.

  2. **The theorem assumes:**
     - A binary choice with a correct answer.
     - Voters vote independently.
     - Each voter's competence is above 0.5 (or at least bounded above 0.5 by some `p`).

  3. **The theorem does not claim:**
     - That the assumptions hold in real-world settings.
     - Anything about non-binary choices.
     - Anything about correlated voters or variable competence without bounds.

  Now, the table of disagreements. We structure it as requested.

  ### Disagreements

  | # | Optimist's Position | Skeptic's Position | Crux | Test/Evidence | Optimist's Prediction | Skeptic's Prediction |
  |---|---------------------|--------------------|------|---------------|------------------------|----------------------|
  | 1 | The CJT is robust to reasonable levels of dependence between voters' errors. In many real-world settings, the positive correlation among voters is small enough that the majority still converges to the truth for large groups. | The CJT is highly sensitive to dependence; even small positive correlations in voter errors can destroy the convergence to correctness, and such correlations are pervasive in real groups. | For a group of voters with a given average competence above 0.5 and a given level of positive correlation (measured by the average pairwise correlation of errors), does the probability of a correct majority still converge to 1 as n grows? | Simulate or derive the behavior of the majority correctness probability for large n under a model with fixed average competence and fixed positive pairwise correlation between errors. | For any fixed average competence >0.5 and fixed small positive correlation (e.g., <0.1), the probability of correct majority still converges to 1 as n grows. | Even for small positive correlations (e.g., 0.01) and average competence just above 0.5, the probability of correct majority does not converge to 1 (and may even decline) as n grows. |
  | 2 | The CJT holds as long as the average competence is above 0.5 and the distribution of competence is such that the weak law of large numbers applies (e.g., bounded variance), without requiring every voter to be above 0.5. | The CJT requires that every voter has competence above 0.5 (or at least a bound away from 0.5) because if even a fraction of voters are incompetent (p_i < 0.5), the majority can be misled. | For a sequence of voters with average competence p_avg > 0.5 but a fixed fraction of voters having p_i < 0.5 (and possibly even p_i < 0.5 for some), does the probability of correct majority converge to 1 as n grows? | Analyze the asymptotic behavior of the majority vote when the set of voters has a fixed distribution of competences (with mean >0.5 and bounded variance) and the votes are independent. | As long as the average competence is above 0.5 and the variance is bounded, the majority vote converges to the correct outcome with high probability for large n. | If there is a fixed fraction of voters with p_i < 0.5 (especially if they are very incompetent, like p_i near 0) then the majority vote may not converge to 1 and might even converge to 0. |
  | 3 | In real-world settings with moderate group sizes (e.g., 100 to 1000) and average competence only slightly above 0.5 (e.g., 0.51), the majority decision is substantially better than a single voter and reasonably likely to be correct. | For average competence barely above 0.5 (e.g., 0.51) and realistic group sizes (e.g., under 10,000), the probability of a correct majority is only slightly above 0.5 and not practically useful. | For a group of size n (e.g., 100, 1000, 10,000) and average competence p (e.g., 0.51, 0.55, 0.6), what is the probability of a correct majority? | Calculate or simulate the probability of correct majority for a range of n and p, assuming independent voters with identical p or with a given distribution of p_i. | For n=100 and p=0.51, the majority is correct with probability about 0.69; for n=1000 and p=0.51, about 0.86; for n=10,000 and p=0.51, about 0.98. | For n=100 and p=0.51, the probability is only about 0.52; for n=1000, about 0.56; and even for n=10,000, it is still below 0.7. |
  | 4 | Strategic voting (where voters may not vote sincerely) can still lead to truth-tracking in the spirit of CJT, especially when voters have common interests and share public information. | Strategic voting breaks the independence and competence assumptions of CJT because voters condition their votes on signals and others' behavior, leading to herding and loss of truth-tracking. | In a model of strategic voting where voters receive private signals and have common interests, does the majority vote converge to the truth for large n? | Analyze a Bayesian strategic voting model (e.g., sequential voting or simultaneous with equilibrium) and see if the outcome converges to the truth as n grows. | In a common-value setting with strategic voters, the majority vote (or the outcome) will converge to the truth as n grows because voters aggregate information efficiently. | In strategic voting, even with common interests, the outcome may not converge to the truth due to free-rider problems, herding, or information cascades. |
  | 5 | Abstention by less competent voters can improve the accuracy of the majority outcome by effectively raising the average competence of the voting pool, and this is a feature of real-world democracy that aligns with CJT. | Abstention patterns in the real world are not driven solely by competence and may lead to systematic biases; moreover, the CJT does not account for strategic abstention. | When less competent voters abstain (sincerely, based on their confidence), does the majority of the remaining voters have a higher probability of being correct than if everyone voted? | Model or simulate a group where each voter has a competence and a confidence threshold for abstention. Compare the majority accuracy under universal voting vs. voluntary abstention. | With voluntary abstention by less competent voters, the majority of voters who do vote will have higher average competence and thus higher accuracy than if everyone voted. | Abstention by the less competent does not reliably occur, and when it does, it may not be sufficient to offset the correlation and competence variation issues; the resulting group may still not track truth well. |
  | 6 | The CJT shows that the majority decision is better than the average single voter and, for sufficiently large groups, better than even the best single voter in the group. | The CJT only shows that the majority is better than the average voter, but in practice, the best-informed voter (or a small expert group) is often better than the majority, especially when the average competence is low. | For a given group of voters with varying competences, is the majority decision more likely to be correct than the decision of the single most competent voter? | Compare the probability that the majority is correct versus the probability that the most competent voter is correct, for a range of group sizes and competence distributions. | In large groups, even with varying competences, the majority is more likely to be correct than the most competent individual, especially when the average competence is above 0.5 and the group is large enough. | For most realistic group sizes and competence distributions (especially when the best voter is much better than average), the best voter is more likely to be correct than the majority. |
  | 7 | The CJT's insights can be extended to multi-option settings using concepts like Condorcet methods, which avoid cycles and select the correct option when it is the Condorcet winner and voters are competent. | Multi-option voting is fundamentally different because of cycles and the lack of a clear extension of CJT; even with competent voters, cycles may occur and the outcome may not reflect the truth. | In a multi-option setting where one option is correct, and voters rank options independently with a probability of being correct that exceeds 0.5 for each pairwise comparison, does the probability that the correct option is the Condorcet winner (and selected) converge to 1 as n grows? | Analyze a multi-option CJT model: each voter independently has a probability p>0.5 of preferring the correct option to any incorrect one. Is the correct option the Condorcet winner with high probability for large n? | For any fixed number of options, as n grows, the probability that the correct option is the Condorcet winner and selected by a Condorcet method converges to 1. | Even for three options, the probability that the correct option is the Condorcet winner does not converge to 1 (or may require unrealistically high p or n) due to the possibility of cycles and the complexities of preference aggregation. |

  Finally, the last agreed statement:

  \agreed{Condorcet's jury theorem, under its strict assumptions of independent voters with individual competence above 0.5 and a binary choice with a correct answer, shows that the probability of a correct majority vote converges to 1 as the group size increases.}
answer: |-
  ### Joint Statement on Condorcet’s Jury Theorem  
  *Agreed by the Optimist and the Sceptic*  

  #### I. Agreed Claims  
  1. **Mathematical Statement of Condorcet’s Jury Theorem (CJT):**  
     - **Setup:** A group of \(n\) voters independently chooses between two options: one "correct" (e.g., aligning with objective truth) and one "incorrect."  
     - **Competence:** Each voter \(i\) has a fixed, known probability \(p_i\) of voting correctly, where \(0.5 < p_i \leq 1\).  
     - **Independence:** Voters’ decisions are statistically independent.  
     - **Majority Rule:** The group’s decision is determined by simple majority vote (more than half of votes).  
     - **Convergence Claim:** As \(n \to \infty\), the probability \(P_n\) that the majority chooses correctly converges to 1.  
     - **Finite \(n\) Claim:** For any finite \(n \geq 1\), \(P_n > p_i\) for all \(i\) (the majority is more reliable than any single voter). If all \(p_i = p > 0.5\), \(P_n\) increases monotonically with \(n\).  

  2. **Core Assumptions Required:**  
     - Binary choice with a single objectively correct answer.  
     - Voter competence \(p_i > 0.5\) for all \(i\).  
     - Strict statistical independence of votes.  

  3. **Scope of the Theorem:**  
     - CJT is a mathematical truth under its assumptions. It does not claim these assumptions hold in reality.  
     - The theorem does not address: correlated errors, heterogeneous competence distributions, strategic voting, abstention, multi-option decisions, or cases with no objective truth.  

  4. **Shared Critiques:**  
     - Real-world groups often violate CJT’s assumptions (e.g., correlated errors exist).  
     - CJT alone cannot justify democracy’s epistemic value without empirical support for its assumptions.  
     - For small \(n\) or \(p_i\) near 0.5, \(P_n\) may be only marginally better than chance.  

  #### II. Disagreements Table  
  | # | Optimist's Position (exact wording)                                                                 | Sceptic's Position (exact wording)                                                                 | Crux                                                                                             | Test/Evidence Both Accept                                                                                                | Optimist's Prediction                                                                                         | Sceptic's Prediction                                                                                              |
  |---|-----------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|
  | 1 | "CJT is robust to mild dependence: for real groups with low-correlated errors, majority rule still converges to the truth." | "Even minimal correlation breaks CJT: real-world dependencies (e.g., shared media) prevent convergence, regardless of group size." | **Can majority rule converge to the truth under "tolerable" dependence (e.g., average pairwise error correlation \(\rho \leq 0.1\)) if average competence \(> 0.5\)?** | Derive/simulate \(P_n\) for large \(n\) (e.g., \(n = 10^4\)) with fixed average \(p_i = 0.55\) and uniform \(\rho\).                                               | For \(\rho \leq 0.1\), \(P_n \to 1\) as \(n \to \infty\).                                                       | For any \(\rho > 0\), \(P_n\) stagnates or declines for large \(n\).                                          |
  | 2 | "CJT holds if average competence \(> 0.5\), even if some voters are incompetent (\(p_i < 0.5\))." | "CJT fails unless every voter is minimally competent (\(p_i > 0.5\)); a minority of bad voters can sabotage the majority." | **Does majority accuracy converge to 1 if average \(p_i > 0.5\), but a fixed fraction of voters have \(p_i < 0.5\)?** | Simulate \(P_n\) for \(n = 1000\), with 80% of voters at \(p_i = 0.6\) and 20% at \(p_i = 0.4\) (average \(p = 0.56\)). | \(P_n > 0.99\) for large \(n\).                                                                             | \(P_n < 0.6\) for large \(n\) (incompetent voters dominate).                                                   |
  | 3 | "For \(p_i \approx 0.51\), groups of \(n \geq 500\) achieve \(P_n \geq 0.9\)—useful for real decisions." | "When \(p_i \approx 0.51\), impractically large groups (\(n > 10^5\)) are needed for \(P_n > 0.6\)." | **How large must \(n\) be for \(P_n \geq 0.9\) if all \(p_i = 0.51\)?**                           | Calculate \(P_n\) using binomial CDF for \(p = 0.51\) and \(n = 100, 1000, 5000, 10^4, 10^5\).                             | \(n \leq 5000\) suffices for \(P_n \geq 0.9\).                                                               | \(n > 10^5\) needed for \(P_n \geq 0.9\).                                                                        |
  | 4 | "Strategic voting (e.g., truthfully reporting signals after Bayesian updating) preserves CJT’s truth-tracking." | "Strategic voting (e.g., bandwagoning) destroys independence and competence, making CJT inapplicable." | **Under common-interest strategic voting, does majority accuracy improve with \(n\)?**             | Simulate a common-value model: voters get private signals, vote strategically in equilibrium. Measure \(P_n\) vs. \(n\). | \(P_n \to 1\) as \(n \to \infty\), matching CJT.                                                            | \(P_n\) plateaus below 1 due to herding.                                                                        |
  | 5 | "Abstention by uninformed voters boosts average competence, making CJT more applicable in real elections." | "Abstention is erratic and often concentrates power in biased subgroups, worsening outcomes." | **Does voluntary abstention (by voters with \(p_i < 0.6\)) raise majority accuracy vs. full participation?** | Simulate groups where voters abstain if \(p_i < \theta\); compare \(P_n\) to universal voting.                              | Abstention raises \(P_n\) by >20% for \(\theta = 0.55\).                                                     | Abstention changes \(P_n\) by \(< \pm 5\%\) or lowers it.                                                      |
  | 6 | "CJT shows majority rule outperforms even the best single voter for large \(n\), proving democracy’s epistemic superiority." | "The best-informed voter usually beats the majority; CJT only shows majority > average voter, which is trivial." | **For large \(n\), is \(P_n\) > max(\(p_i\)) when average \(p_i > 0.5\)?**                         | Compute \(P_n\) vs. max(\(p_i\)) for \(n = 1000\), with \(p_i\) uniform on \([0.5, 0.7]\).                                 | \(P_n >\) max(\(p_i\)) for \(n \geq 100\).                                                                   | max(\(p_i\)) \( > P_n\) for all realistic \(n\).                                                               |
  | 7 | "CJT’s logic extends to multi-option votes: Condorcet methods (e.g., ranked pairs) converge to truth with competent voters." | "Multi-option voting introduces cycles and ambiguity; no extension of CJT guarantees truth-convergence." | **With 3+ options, does the probability of selecting the correct option converge to 1 under independence and \(p_i > 0.5\)?** | Simulate a Condorcet method (e.g., Copeland) with voters ranking options correctly with probability \(p = 0.55\).          | Probability of correct selection \(\to 1\) as \(n \to \infty\).                                               | Cycles cause convergence probability \(< 0.8\) even for large \(n\).                                           |

  #### III. Verbal Disagreements Clarified  
  - **"Competence":**  
    - *Optimist:* "Competence" means probability \(p_i > 0.5\) of correct judgment *in a given decision context*.  
    - *Sceptic:* "Competence" is ill-defined when no objective truth exists (e.g., normative political questions), rendering CJT inapplicable.  
  - **"Independence":**  
    - *Optimist:* "Approximate independence" holds if shared influences (e.g., media) are weak relative to private information.  
    - *Sceptic:* "Independence" is binary—any correlation invalidates CJT, and real voters lack private signals.  

  #### IV. Final Agreed Statement  
  \agreed{Condorcet’s jury theorem, under its explicit assumptions of a binary choice with a correct answer, independent voters, and individual competence strictly above 0.5, mathematically proves that the probability of a correct majority vote converges to 1 as the group size increases.}
