  First, I need to understand each step of the argument. Premise 1 ties legitimacy to the popular will. Premise 2 claims no procedure can capture that will independently. Step 3 says institutions can only produce verdicts, not the real will. Step 4 defines populism as prioritizing the popular will over procedures. Step 5 concludes that no institution can act in the people's name. Steps 6 and 7 say populism self-destructs and we must abandon the popular will as legitimacy's source.

