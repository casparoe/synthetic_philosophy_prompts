prompt: |-
  I do a small podcast on philosophy of language and next week I've got a philosopher on whose whole thing is performatives. Her line, roughly: the interesting divide in that literature isnt performative vs constative, and it isn't conventional vs intentional either — it's between acts whose force is handed to you by an established practice (sentencing, baptising, marrying, chairing a meeting) and acts whose force you take for yourself (warning, promising, apologising, resigning). Her twist is that the second lot are parasitic on the first: you can only take a force that some practice already makes available for others to hold you to, so there's no such thing as force that comes from the speaker's intention alone. She's also got a side claim doing a lot of quiet work — that a chatbot can't promise or accept your terms of service, it can only mimic the act, because standing is conferred by practices and not by whoever wires the thing up.

  Can you draft eight to ten questions for me. I don't want her just restating the distinction, so press it. At least one question each on:

  - the parasitism claim vs. plain promises between friends, where nobody authorised anyone — and if she says the practice of holding each other to our word is enough, follow up by asking what then separates a practice from a moral norm, since that's the old fight about whether force is conventional all the way down;
  - the bot and the delegation case: the company that treats the chatbot's output as binding looks like it's conferring the standing by holding itself to it, so why is the bot a pen the company writes with rather than a party to the contract? push on what actually distinguishes them, and what she'd say about the de facto usurper whose orders everyone obeys and no one ever authorised;
  - uptake: is the act done on utterance or on being recognised? what about an apology the other person refuses to hear, or a resignation the employer ignores and keeps scheduling you for — which is the case I suspect her framework is most awkward about.

  Somewhere in there get one on whether standing is all or nothing or comes in degrees (the lifeguard yelling at you vs a stranger yelling at you), and one on the promise made with no intention of keeping it — misfire, or just a hollow act. Follow-ups keyed to the answer she's most likely to give, please. And end with a question about what would have to be true for her to give up the standing requirement entirely.
reasoning: |-
  Okay, the user runs a philosophy podcast and is interviewing a philosopher specializing in performatives. The guest's key argument is that performative force isn't about intention versus convention, but about whether the force comes from established practices (like sentencing) versus acts where individuals claim force for themselves (like promising). She adds that the latter are parasitic on the former and that chatbots can't genuinely perform acts like promising because they lack standing conferred by practices.

  The user wants 8-10 interview questions that push beyond surface-level restatements. They specifically want depth on three core areas: parasitism in informal promises, chatbot delegation issues, and uptake problems. They also want degrees of standing, hollow promises, and a final "what would falsify this" question.

  Hmm, the parasitism angle is tricky - if promises between friends rely on the practice of "holding each other to words," how is that different from moral norms? Need to corner that convention-versus-morality tension. For chatbots, the key is why they're instruments rather than agents when companies treat their outputs as binding. The uptake dilemma is especially juicy: if an ignored resignation isn't effective, does that undermine her "practice-first" model?

  For structure, I'll cluster questions by theme but keep the flow conversational. Start with clarifying the core distinction before drilling into parasitism. Then hit chatbots with the delegation paradox and usurper analogy. Uptake comes next with the ignored resignation case. Sandwich degrees of standing (lifeguard vs. stranger) and hollow promises in there. End by asking what evidence would make her abandon the standing requirement - that forces her to define the theory's limits.

  Better include aggressive follow-ups too. If she says friendship promises rely on micro-practices, ask why that isn't just morality dressed up. If she calls chatbots "pens," demand how that differs from de facto authorities. For resignations, if she requires uptake, ask whether that collapses into audience determinism. Need to make her sweat a little!

  The user clearly knows this literature well - they're using terms like "uptake" and "misfire" correctly. Their hidden ask is probably to test how robust her framework is against edge cases. The bot question especially feels personal - maybe they've debated this before? I'll sharpen that one with the "usurper" comparison to expose any inconsistencies in her standing theory.
answer: |-
  Here are 9 core questions with embedded follow-ups designed to press the key points, challenge assumptions, and explore the nuances of your guest's framework:

  1.  **Core Distinction & Parasitism:** "You argue that 'taking' forces like promising are parasitic on practices that 'hand' forces like marrying. Could you elaborate on *how* this parasitism works, especially in seemingly simple, informal acts? Take a promise between two friends with no written contract or third party – where is the established practice it parasitizes?"  
      *   *(Likely Answer: Appeals to the general practice of "holding each other to our word" or the institution of promising itself)*  
      *   **Follow-Up:** "If the parasitized 'practice' in that case is just the mutual expectation of fidelity to one's word, how does that fundamentally differ from a *moral norm*? Doesn't this risk collapsing your distinction and pushing us back towards the 'conventional all the way down' versus 'intentional force' debate you want to avoid?"

  2.  **Parasitism & Normativity:** "Building on that, where exactly does the *normative force* come from in your model? If the practice of 'holding to our word' confers the standing to promise, is the bindingness of the promise derived *from* the practice, or is the practice merely the *context* that allows an intention to *create* the bindingness?"

  3.  **Chatbot as Instrument (Delegation):** "On chatbots: When a company explicitly states its chatbot's outputs bind the company and treats them as such, it *looks* like the company is conferring standing on the bot *by* holding itself accountable to its utterances. Why isn't this sufficient to make the bot an agent performing the act (e.g., accepting terms), rather than just a sophisticated pen?"  
      *   *(Likely Answer: Emphasizes the bot lacks intrinsic standing; it's the company's *recognition* that matters, the bot is merely the mechanism)*  
      *   **Follow-Up:** "But consider a *de facto usurper* – someone who issues orders in a chaotic situation, everyone obeys them consistently, and no prior practice or authority ever 'authorized' them. By your criteria, they seem to lack 'standing'. Yet, their orders *function* as commands with force. How is this usurper fundamentally different from the company's chatbot *within the company's own operational practice* where the bot's 'orders' (e.g., confirming a booking) are consistently treated as binding?"

  4.  **Standing - Degrees or Binary?:** "Is 'standing' conferred by a practice all-or-nothing, or are there degrees? Compare a uniformed lifeguard ordering swimmers out of the water versus a random stranger on the beach yelling the same thing. Both might intend a warning, both might be recognized by some listeners. Does the lifeguard simply *have* standing and the stranger *lacks* it, or is the lifeguard's standing *stronger* or *more reliable*, making the act more likely to succeed?"

  5.  **Hollow Acts / Insincere Promises:** "What is the status of an insincere promise – 'I promise to help you move' said with zero intention to do so? Is this a misfire (a failed attempt to promise), or is it a *successful* performative act of promising (creating an obligation) that is simply *hollow* or *immoral*? How does your framework account for the difference between the *act being done* and the *sincerity condition* being met?"

  6.  **Uptake & Effectiveness - The Ignored Resignation:** "Let's tackle uptake. According to your model, is the performative act *completed* upon the speaker's utterance within the relevant practice (assuming felicity conditions), or does it *require* recognition/uptake by the audience? Specifically: If an employee clearly says 'I resign' to their boss within the context of the employment practice, but the boss ignores it, keeps scheduling them, and refuses to process it – has the employee *resigned*?"  
      *   *(Likely Answer: Will lean towards requiring uptake/recognition within the practice for the act to be fully consummated or effective)*  
      *   **Follow-Up:** "Doesn't making uptake constitutive risk making the *force* of the act entirely dependent on the audience's recognition? How does this avoid collapsing into a kind of audience determinism that undermines the idea of the speaker 'taking' the force via the practice? Where does the 'taking' reside if the audience's 'hearing' is essential for the act to be *done*?"

  7.  **Uptake & The Refused Apology:** "Similarly, take an apology: Speaker utters a sincere "I apologize" within a context where apologies are understood. The recipient refuses to hear it or accept it ("I don't accept your apology"). Has an apology *been made*? If yes, what is its status? If no, what was the utterance – merely an *attempt* dependent on the recipient's cooperation?"

  8.  **The Scope of "Practice”:** "You argue that even 'taken' forces rely on practices making that force 'available for others to hold you to.' How broadly or narrowly do you define 'practice' here? Does it require formal institutions (like law), or can it be highly informal, emergent, or even dyadic? What are the minimal necessary features for something to count as a 'practice' conferring this availability?"

  9.  **Falsifiability / The Standing Requirement:** "Finally, a meta-question about your core requirement: What kind of evidence or hypothetical scenario would convince you that a performative act *could* derive its distinctive force *solely* from the speaker's intention and the audience's recognition, *without* needing to be parasitic on a pre-existing practice conferring standing? What would have to be true about language or social interaction for you to abandon the necessity of that 'standing' conferred by practice?"

  **Key design choices:**

  *   **Pressing Parasitism:** Questions 1 & 2 directly target the potential circularity/morality vs. practice issue in informal promises, forcing a clarification of the practice's nature and its role in creating normativity.
  *   **Pressing Chatbots/Delegation:** Question 3 uses the company's *de facto* treatment and the usurper analogy to challenge the "mere instrument" view and probe the boundaries of what constitutes "conferring standing" within an operational context.
  *   **Pressing Uptake:** Questions 6 & 7 focus on the core tension between speaker initiative and audience reception, specifically using the ignored resignation (awkward for her) and refused apology to force a clear stance on whether the act is *done* on utterance or requires uptake.
  *   **Degrees & Hollow Acts:** Questions 4 & 5 address your specific requests, exploring nuance in standing and the act/insincerity distinction.
  *   **Scope & Falsifiability:** Questions 8 & 9 push on the foundational concepts ("practice") and the core theoretical commitment ("standing requirement").
  *   **Flow:** Starts with core distinction/parasitism (foundational), moves to challenging applications (bots, usurper), then tackles uptake (potentially most contentious), covers specific nuances (degrees, hollow), and ends with scope and falsifiability (big picture).
  *   **Follow-Ups:** Embedded based on the most likely defensive moves, designed to prevent easy answers and push the discussion deeper.

  This set should provoke a rich, critical, and revealing discussion that goes far beyond a simple restatement of her thesis. Good luck with the interview!
