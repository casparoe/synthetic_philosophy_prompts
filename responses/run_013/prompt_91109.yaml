answer: |-
  Below is a decision tree designed to map logical commitments from accepting HCH as a useful formal idealization of deliberation to specific positions on what it idealizes. The tree uses 8 branch questions (phrased to avoid naming positions) and results in 6 leaves (5 named positions + 1 catch-all for unexplored hybrids). Each leaf includes a diagnostic of its most awkward commitment. The tree prioritizes clean philosophical distinctions but flags limitations in separation and unoccupied nodes.

  ---

  ### **Decision Tree: What Does HCH Actually Idealize?**  
  *(Start from the top after accepting HCH as a useful formal idealization of deliberation)*  

  #### **Q1: Does the idealization require that all deliberation tasks are decomposable into context-free subtasks solvable by a fresh agent?**  
  - **Yes** → Proceed to Q2.  
  - **No** (Decomposition is partial/problem-specific) → Proceed to Q3.  

  #### **Q2: Is this decomposability claim universal (true for any deliberation)?**  
  - **Yes** → Proceed to Q4.  
  - **No** (Only true for specific problem classes) → Proceed to Q5.  

  #### **Q3: Does HCH primarily idealize individual cognition, or something else?**  
  - **Individual cognition** → Proceed to Q6.  
  - **Something else** (e.g., social processes) → **Leaf C: Collective Inquiry Idealization**.  
  - *Awkward commitment: Fails to explain how individual minds work, despite framing as "deliberation".*  

  #### **Q4: Does the recursion bottom out in a non-decomposable primitive?**  
  - **Yes** (Well-founded) → Proceed to Q7.  
  - **No** (Infinite regress/circular) → **Leaf E: Useful Procedural Fiction**.  
  - *Awkward commitment: Relies on a base layer (e.g., intuition) that isn't itself decomposable, violating the idealization's premises.*  

  #### **Q5: Can the human judge at the leaf verify subtasks without understanding the whole problem?**  
  - **Yes** (Local verification suffices) → Proceed to Q8.  
  - **No** (Global context needed) → **Leaf E: Useful Procedural Fiction**.  
  - *Awkward commitment: Judge must magically grasp emergent context, defeating decomposition.*  

  #### **Q6: Does HCH adequately handle concept revision mid-deliberation?**  
  - **Yes** → Proceed to Q7.  
  - **No** → **Leaf E: Useful Procedural Fiction**.  
  - *Awkward commitment: Ignores how real deliberation dynamically alters its own ontology.*  

  #### **Q7: Do unlimited compute/perfect copies preserve the core of deliberation?**  
  - **Yes** → Proceed to Q8.  
  - **No** → **Leaf E: Useful Procedural Fiction**.  
  - *Awkward commitment: Resource constraints aren't incidental but constitutive of deliberation (e.g., urgency, attention).*  

  #### **Q8: Does HCH avoid the frame problem (implicit assumptions) and tacit knowledge?**  
  - **Yes** → **Leaf A: Strong Decomposabilism** (if from Q2-Yes) or **Leaf B: Restricted Decomposabilism** (if from Q2-No/Q5).  
  - **No** → **Leaf E: Useful Procedural Fiction**.  
  - *Awkward commitments:*  
    - **Leaf A: Strong Decomposabilism**: Assumes deliberation is always reducible to atomic tasks, denying holistic aspects.  
    - **Leaf B: Restricted Decomposabilism**: Only applies to "tame" problems (e.g., math), leaving open how it generalizes.  

  #### **Final Leaves**  
  - **Leaf A: Strong Decomposabilism**  
    HCH is a good idealization because deliberation is inherently decomposable.  
    - *Awkward commitment: Requires denying that context-sensitivity, creativity, or ambiguity are essential to deliberation.*  
  - **Leaf B: Restricted Decomposabilism**  
    HCH is a good idealization but only for a specific class of decomposable problems.  
    - *Awkward commitment: Struggles to explain why non-decomposable aspects (e.g., moral reasoning) exist outside the class.*  
  - **Leaf C: Collective Inquiry Idealization**  
    HCH idealizes distributed group cognition (e.g., scientific collaboration), not individual minds.  
    - *Awkward commitment: Individual deliberation may involve irreducibly first-person elements absent in HCH's "committee" structure.*  
  - **Leaf D: Incoherent Framing**  
    The entire HCH model assumes a "view from nowhere" (e.g., omniscient decomposer).  
    - *Awkward commitment: Rejects HCH as a formal tool, risking irrelevance to practical alignment work.*  
  - **Leaf E: Useful Procedural Fiction**  
    HCH is pragmatically useful for engineering but not an idealization of human deliberation.  
    - *Awkward commitment: No principled link between the fiction and actual cognition, risking misalignment.*  
  - **Leaf F: Unexplored Hybrid**  
    HCH captures fragments of deliberation but requires augmentation (e.g., with dynamical systems).  
    - *Awkward commitment: Lacks a unified account, inviting charges of ad hocness.*  

  ---

  ### **Diagnostics & Limitations**  
  - **Unseparated Positions**:  
    - *Leaf E (Useful Fiction)* and *Leaf F (Hybrid)* are not cleanly divided by the tree. Both reject HCH as a complete idealization but diverge in pragmatism (fiction vs. patchwork).  
    - *Leaf A (Strong)* and *Leaf B (Restricted)* share challenges (e.g., frame problem) but the tree splits them early (Q2) for clarity.  
  - **Unoccupied Combinations**:  
    - *"HCH as collective + decomposable for all tasks"*: Unattractive (groups handle problems differently than universal decomposition implies).  
    - *"HCH as individual + non-decomposable + coherent"*: Incoherent (violates HCH’s core mechanization).  
  - **Weak Branches**: Q3 (individual vs. collective) is underdetermined; some philosophers see no bright line.  
  - **Design Notes**:  
    - Tacit knowledge/frame problem (Q8) and concept revision (Q6) target philosophers of mind.  
    - Resource constraints (Q7) address skeptics of "unlimited compute" idealizations.  
    - Tree depth minimized by grouping challenges (e.g., Q4–Q8 test idealization "breakpoints").  

  This tree isolates core tensions (decomposability, scope, judge's role) while allowing mixed groups to locate positions without jargon. For your handout, visualize it as a flowchart with Q1 at the root.
