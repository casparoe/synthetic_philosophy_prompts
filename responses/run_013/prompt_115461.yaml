  The distinction between desert and standing gaps is crucial. A desert gap is about whether blame is deserved at all, while a standing gap is about who can legitimately assign that blame. Even with perfect evidence tracing harm back to specific engineers, the problem remains that no impartial party exists to hold them accountable.

  The strongest objection might be that standing is merely interpersonal and can't address institutional needs. I can counter that institutions create standing gaps by embedding conflicts of interest in their structures. The solution isn't to find someone to blame but to redesign accountability mechanisms - perhaps through independent oversight bodies that aren't entangled in the system's benefits.

  To falsify my position, there would need to be a case where harm occurs with no blameworthy human at all - a true desert gap where no one could have foreseen or prevented the harm despite reasonable precautions.

  I'll conclude by emphasizing that the core problem is the absence of legitimate accountability structures, not the absence of blameworthy individuals, and that solutions must therefore focus on creating new forms of standing rather than assigning blame.
answer: |-
  ### Argument: Standing Gaps as the Core Problem in Autonomous System Accountability

  The distinction between desert gaps and standing gaps reframes the challenge of harm from autonomous systems. Desert gaps concern the *absence* of a blameworthy human agent, while standing gaps concern the *absence* of a legitimate human authority to assign or enforce that blame. I argue that standing gaps are the primary obstacle to meaningful accountability. Remedies targeting desert gaps (e.g., human oversight mandates, no-fault liability, stricter certification) fail because they presuppose an intact accountability relation—precisely what standing gaps dissolve. True solutions must restore standing itself, not retrofit blame onto parties structurally shielded from it.

  #### 1. Concrete Setting: Algorithmic Hiring in Corporate HR
  Consider an AI system used by "GlobaCorp" to screen job applications. The system, trained on historical hiring data, systematically downgrades applicants from minority-serving colleges due to latent bias in past hiring patterns. A qualified candidate, Maria, is rejected without human review.  

  - **Desert Gap Absent**: The harm *is* attributable. The engineering team knew bias audits were incomplete but deployed the system to meet quarterly targets. The HR director approved deployment despite ethical concerns, prioritizing efficiency. Both are foreseeably blameworthy for contributing to discriminatory harm.  
  - **Standing Gap Present**: No one *within GlobaCorp* can legitimately hold them accountable.  
    - Peers on the engineering team collaborated on the system and share incentives.  
    - The HR director’s superiors benefit from cost savings.  
    - Employees harmed (like Maria) lack access to internal processes.  
    - External regulators lack technical insight to assign blame precisely.  
  Remedies like adding a "human in the loop" (a junior HR staffer rubber-stamping AI decisions) or no-fault liability (fines absorbed as business costs) fail. They assume an impartial enforcer exists, but the standing gap means blame circulates vacuously within a structure that incentivizes and protects the blameworthy.  

  #### 2. Why Standing Gaps Are Not "Distant Desert Gaps"  
  A desert gap is closed by evidence showing *no one* could reasonably be blamed (e.g., an unforeseeable asteroid disrupting a drone’s sensors). A standing gap persists *even if* we perfectly trace blame to specific humans. What is missing is not evidence, but **moral-political legitimacy**: the right relationship between blamer and blamed.  

  - **What’s Missing**: Reciprocal recognition of authority. For A to hold B accountable, A must not be complicit in B’s act, must not benefit from the same structures, and must occupy a role B accepts as valid. At GlobaCorp, every internal actor fails this: engineers share goals, managers benefit from outcomes, executives set incentives.  
  - **Why Evidence Doesn’t Solve It**: Suppose an audit *proves* the HR director’s negligence. Who implements consequences? Internal boards face conflicts of interest; external courts lack contextual nuance and enforce only legal, not moral, blame. The gap is relational, not epistemic. Patient tracing reveals *who is to blame*, but not *who can blame them* without hypocrisy or institutional capture.  

  #### 3. Strongest Objection and Response  
  **Objection**: Standing is interpersonal (e.g., a wronged friend can forgive; a stranger cannot). Institutions require neutral, rule-based accountability (e.g., liability laws). Focusing on standing moralizes systems problems, ignoring legal fixes.  

  **Answer**: Institutions *create* standing gaps by design. Legal liability (a desert-gap remedy) often diffuses blame—e.g., fining GlobaCorp compensates Maria but leaves culpable individuals unscathed and systems unchanged. The objection assumes institutions are neutral, but they embed power imbalances: the HR director’s complicit superiors *are* the institution. Restoring standing requires redesigning institutions to separate *beneficiaries* from *adjudicators*. For example, independent worker/community oversight boards with veto power over AI audits could create new standing—addressing the gap directly.  

  #### 4. What Would Falsify the Position  
  The position would be undermined if a case met two criteria:  
  - **Blameworthiness is genuinely absent** (a true desert gap), *and*  
  - **Accountability remedies fail solely due to this absence**.  
  Example: A hospital’s diagnostic AI fails due to a first-in-history software/hardware interaction flaw. No human foresaw it; oversight protocols were rigorous. Here, no-fault liability on the hospital (a desert-gap remedy) *works*—it compensates victims without needing blame. The standing gap is irrelevant because there is no blame to be blocked. Standing gaps matter precisely when blame exists but is institutionally orphaned.  

  ### Conclusion  
  Desert-gap remedies fail because they ignore how institutions corrupt standing: they assign liability or oversight roles to parties already compromised by the system. The GlobaCorp case shows blame without legitimate enforcers; evidence reveals culprits but not vindicators; institutional solutions must *create* new standing (e.g., decoupled oversight), not hunt for blameless bearers of cost.  

  \answer{Standing gaps dissolve accountability; solutions must restore legitimate blamers, not locate blameless bearers.}
