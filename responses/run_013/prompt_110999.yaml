prompt: |-
  I retired a couple years ago from a biology department (developmental stuff, mostly) and I've been sitting in on philosophy seminars ever since — great fun, but humbling. I want to apply for a small one-semester writing grant at our humanities institute and need a short proposal (about 2 pages) on the Mencius vs. Xunzi disagreement about human nature. Heres my half-baked angle: it always gets presented as the ancient Chinese version of nature vs. nurture, and I think that frame is doing damage, because in the biology I came up in you dont get to seperate the two — developmental systems, niche construction, the idea that the organism partly builds the environment it develops in and passes that on. So the question I'd want to pose is whether, once you drop the assumption that there's a clean line between what a human being is given and what ritual and teaching add, the Mencius–Xunzi quarrel either collapses into a dispute about what the word for 'nature' is supposed to pick out, or survives as a genuine disagreement about whether human plasticity is oriented toward goodness or is just open and indifferent — which would make it a claim about developmental teleology rather than about culture at all.

  Turn that into a proposal: state the question so it has a determinate answer, explain why the usual readings leave the fork unaddressed, say what I'd actually do week by week, what a result would look like and what would count as the project failing, and whether this is realistic for one semester or I should shrink it. I don't want citations or a reading list, I'll add those myself. And please finish with a one-sentence version of the question I'd be proposing to answer, on a last line starting "Bottom line:".
