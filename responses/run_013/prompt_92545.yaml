  Your puzzle experiences reveal a fascinating tension in how we extend concepts through analogy. The core issue is that "the same change" isn't a fixed operation but a *structure-sensitive transformation* that depends on implicit hierarchical representations of the string. I'll unpack a principle that explains your verdicts, clarify the stretch-vs.-swap distinction, predict new cases, and address inconsistencies.

  ### The Principle: **Structure-Preserving Minimal Mutation (SPMM)**
  Your judgments align with a principle where the "same change" means:
  1. **Identify the minimal mutable unit**: Isolate the smallest relevant structural component at the "cursor position" (here, the end of the string).  
  2. **Apply context-free mutation**: Mutate that unit by advancing it one step in its natural sequence (e.g., alphabet with wrap-around).  
  3. **Preserve higher-order structure**: Maintain the string's grouping/symmetry unless mutation forces a *localized* break.  

  This principle prioritizes *minimal change to a single unit* while respecting the *implicit structure* of the string. Let's apply it to your cases:

  ---

  ### Explaining Your Verdicts
  1. **`iijjkk → iijjll` (✓)**  
     - **Structure**: Symmetric groups (`ii`, `jj`, `kk`).  
     - **Minimal unit**: The last group (`kk`), as groups are salient.  
     - **Mutation**: Advance `k` to `l` *for the entire group* → `ll`.  
     - **Why it fits**: The group is the mutable unit; mutation preserves symmetry.  

  2. **`mrrjjj → mrrjjk` (✓)**  
     - **Structure**: Asymmetric groups (`m`, `rr`, `jjj`). Groups are salient, but *not symmetric*.  
     - **Minimal unit**: The last *character* (final `j`), not the group.  
     - **Mutation**: Advance `j` to `k` → `jjk`.  
     - **Why it fits**: Asymmetry makes the character the minimal unit; mutation breaks the group locally but doesn't alter its identity.  

  3. **`mrrjjj → mrrkkk` (✗)**  
     - **Minimal unit violated**: Your friend mutated the entire *group* (`jjj → kkk`), not the minimal unit (character).  
