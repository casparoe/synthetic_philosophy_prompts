prompt: |-
  So I'm writing a novel and one of my characters runs a small foundation — a few million a year, very into being rigorous about it. Their whole thing is they only fund what you can put a number on: deworming, bed nets, a cash-transfer study. Anything where the payoff is "people get a bit more politically engaged" or "the culture shifts a bit" gets turned down with a note saying it isn't cost-effective. They've also got this internal spreadsheet where staff assign "moral weights" — how many dollars of animal welfare equals a dollar of human health, that kind of thing — and then they take the median of everyone's answers and treat that as the real number. Meanwhile the same people, over drinks, will tell you they're deeply uncertain about the weights and would never claim one being's suffering literally counts more than another's.

  What I want from you is what the practice actually assumes — not what they say, what the institutions habits commit them to. Does ranking everything by expected good per dollar presuppose that all these goods are commensurable, that there's one scale? Does refusing to fund the unmeasurable presuppose that unmeasurable goods don't count, or just that you can't compare them, or something weaker and more about decision-making under uncertainty? And the median-weight thing — is that a claim that there's a fact of the matter about the exchange rate between a human life and an animal one, or just a coordination device so the spreadsheet works?

  And is it even consistent with itself? They say they take moral uncertainty seriously and then fund off a single point estimate. I feel a tension there but I can't name it. Also curious whether the "earning to give" side of this — people taking a high-paying job specifically to donate the salary — assumes something different about what a life is for than the foundation side does, or if it's the same commitment wearing two hats.

  One thing I'd ask: tell me which parts of this are settled among people who actually work on it and which are live disagreements. I don't want to put a contested view in my character's mouth as though it were just obviously true. And be straight with me about where the practice is underdetermined — where several different theories would license the exact same behavior.
reasoning: |-
  Okay, the user is writing a novel and has a character who runs a small foundation focused on rigorous, quantifiable philanthropy. They want to understand the underlying assumptions and tensions in such a foundation's practices. Let me unpack this step by step.

  First, the foundation only funds measurable interventions like deworming or bed nets, rejecting things like cultural shifts. This implies a strong preference for quantifiable outcomes. The user is asking what this practice assumes—does it mean unmeasurable goods don't matter, or is it just a practical stance? I need to distinguish between their stated principles and the underlying commitments. Probably, the foundation is acting as if measurable goods are the only ones that count, even if they don't explicitly say so. It's a form of operational utilitarianism where what can't be measured gets ignored, possibly due to epistemic uncertainty.

  Then there's the moral weights spreadsheet. Staff assign weights to different causes, take the median, and use that for decisions. But privately, they admit uncertainty. The user senses a tension here. The median serves as a coordination tool, but treating it as a fixed number might imply there's an objective exchange rate, which contradicts their expressed uncertainty. This is a key inconsistency: using a point estimate while claiming moral uncertainty. The foundation is prioritizing decisiveness over accuracy, which is practical but philosophically shaky.

  The user also asks about "earning to give"—people taking high-paying jobs to donate more. Does this conflict with the foundation's view? Actually, both stem from the same utilitarian logic: maximizing marginal utility. The job choice is about generating resources to convert into measurable good. No inherent conflict, just different roles in the same system.

  Regarding settled vs. contested issues: Effective altruism (EA) has core tenets like quantification and cost-effectiveness, but the treatment of non-measurable goods is debated. Long-termism vs. near-termism in EA is another live debate. Moral weights are acknowledged as subjective, but using a median is a practical compromise. The tension between uncertainty and point estimates is recognized but unresolved—some propose alternative methods like moral portfolios.

  Underdetermined areas include why they use the median instead of other methods (mean, geometric mean), the threshold for "measurable," and how they handle uncertainty. Different theories could lead to the same actions here, like rule utilitarianism vs. decision-making under uncertainty.

  I should also note the character's possible internal conflict. The foundation's practices might be effective but reductive. The median approach avoids extreme views but may suppress minority perspectives. The rejection of cultural shifts could stem from practicality, but might overlook systemic change. Highlighting these tensions adds depth to the character.

  The user wants to avoid presenting contested ideas as settled. So I'll clarify where consensus ends and debate begins. For example, quantification is central to EA, but the exclusion of non-measurable impacts is controversial. The moral weight system is a tool, not a settled truth.

  Finally, ensuring the character feels authentic. The foundation's habits commit them to commensurability and operational pragmatism, even if they verbally deny it. The tension between their actions and private doubts creates rich narrative potential. Pointing out where practices are underdetermined allows the user to explore different motivations without misrepresenting real philosophies.
answer: |-
  Here's a breakdown of the philosophical and practical commitments embedded in your character's foundation, separating settled ideas, live debates, tensions, and underdetermined aspects:

  **Core Commitments & Assumptions (Often Implied, Not Stated):**

  1.  **Commensurability as an Operational Necessity:** The practice *assumes* that diverse goods (human health, animal welfare, political engagement) **must be made commensurable on a single scale (dollars per unit of good) for rational decision-making under resource constraints.** They don't necessarily claim this scale *exists objectively in the universe*, but their methodology **requires acting as if it does** for the purpose of allocation. They are committed to *operationalizing* value into a single metric (usually DALYs/QALYs for health, or "well-being units" monetized). This is less "all goods *are* fundamentally comparable" and more "**to make consistent, accountable decisions with limited funds, we must treat them as comparable**."

  2.  **Quantification as a Proxy for Impact & Accountability:** Refusing the unmeasurable doesn't necessarily assume unmeasurable goods *don't exist* or *don't matter*. It assumes:
      *   **Epistemic Priority:** Measurable impacts are knowable, verifiable, and less prone to bias or wishful thinking. You can *know* if bed nets reduce malaria deaths with high certainty; knowing if "political engagement" leads to better long-term outcomes is vastly harder.
      *   **Accountability:** Measurability allows clear demonstration of impact to donors and stakeholders ("$X donated saved Y lives").
      *   **Comparative Advantage:** With limited resources, funding the measurable allows maximizing *known, quantifiable good* over funding the nebulous where impact is uncertain. It assumes **funding the measurable yields higher expected value**.
      *   **Weak Claim:** The strongest implied claim is "**We can only confidently compare the cost-effectiveness of measurable interventions.**" It's silent on whether unmeasurable goods might be *more* important; it just says they are currently outside the scope of rational funding allocation *for us*.

  3.  **The Moral Weights Spreadsheet: Coordination Over Truth:**
      *   **It explicitly rejects the idea of a single "fact of the matter."** The very act of taking a median of diverse individual weights acknowledges there *isn't* an objective answer everyone agrees on.
      *   **It's primarily a coordination mechanism:** It solves the problem of "How do we combine diverse moral views into a single operational number so we can actually *use* the cost-effectiveness spreadsheet?" The median is chosen specifically *because* it dampens extreme views (unlike the mean) and provides a stable focal point.
      *   **Implied Pragmatism:** It assumes that **having a consistent, agreed-upon (even if arbitrary) number is more important for practical action than endlessly debating the 'true' weight.** It prioritizes decisive action under moral uncertainty over theoretical purity.
      *   **Assumes Aggregatability:** It assumes individual moral weights *can* and *should* be aggregated into a group decision rule (the median).

  4.  **"Earning to Give" vs. Foundation Work: Same Philosophical Core:**
      *   **Consistent Commitment:** Both stem from the same core utilitarian principle: **maximize marginal utility per resource.** The earner believes donating their high salary generates more good (via the foundation's work) than they could directly achieve in a lower-paying, direct-impact role. The foundation allocates those donated dollars to the highest measured impact.
      *   **Same View of Value:** Both treat "good" as something external, quantifiable, and transferable. A life isn't "for" anything specific in a teleological sense; its value lies in its capacity for positive experiences/well-being, which can be increased by external interventions funded by money. Money is the universal converter.
      *   **Different Hats, Same Goal:** The earner focuses on resource *generation* optimized for donation. The foundation focuses on resource *allocation* optimized for impact. They are interdependent parts of the same efficiency-maximizing system.

  **The Core Tension You Identified: Uncertainty vs. Point Estimates**

  *   **The Tension:** This is **real and widely acknowledged** within the Effective Altruism (EA) community. Verbally acknowledging profound moral uncertainty while using a single, precise point estimate (the median weight) for multi-million dollar decisions *is* inconsistent on the surface.
  *   **How the Practice Resolves It (Pragmatically):**
      *   **Decision Forcing:** Ultimately, money must be allocated *today*. Uncertainty can't paralyze action. A point estimate is necessary to run the model and get an answer.
      *   **Sensitivity Analysis (Often Done, Not Always Highlighted):** Good practitioners *do* explore how sensitive results are to changes in the moral weights. If flipping a weight changes the top recommendation, they acknowledge the fragility. (This is a key place your character could show rigor).
      *   **The Median as Uncertainty Management:** Choosing the median *is* itself a way to manage uncertainty – it represents a "central tendency" view, dampening individual overconfidence.
      *   **"Best Guess" Justification:** They treat the median weight as the "best available operational guess under uncertainty," not a revealed truth. The commitment is to *using the best available process* (aggregation) to handle uncertainty, even if the output is a point estimate.
  *   **The Live Debate:** This tension is **actively debated**. Critics argue:
      *   Point estimates hide crucial uncertainty, leading to overconfidence.
      *   Alternatives like funding a "moral portfolio" (diversifying based on different plausible weights) or using ranges with minimum acceptable weights might be more honest to the uncertainty.
      *   The process gives a false sense of objectivity.

  **Settled vs. Contested Views:**

  *   **Settled (Within Core EA Quantification Practice):**
      *   Quantifiable cost-effectiveness analysis (CEA) is essential for comparing interventions targeting similar outcomes (e.g., different health interventions).
      *   Some form of aggregation/decision rule is needed to combine diverse moral views for operational purposes.
      *   Measurability provides significant advantages in accountability and reducing bias.
      *   Resource constraints necessitate prioritization; CEA is a key tool for this.
      *   Expected value reasoning is fundamental.

  *   **Live Disagreements / Contested Views:**
      *   **The Scope of Quantification:** How aggressively should non-measurable/unquantifiable goods be excluded? Is this throwing the baby out with the bathwater? (Major debate, with critics like Amia Srinivasan, David Runciman).
      *   **Moral Weights:** The legitimacy, methodology, and use of cross-cause weights (human vs. animal, present vs. future) is **highly contested**, even within EA. Is the median the best method? Should weights be public? How to incorporate profound uncertainty?
      *   **Long-Termism vs. Near-Termism:** Should we prioritize reducing existential risks for vast future potential (hard to measure!) or focus on concrete, near-term suffering (easier to measure)? This is a **defining schism** in modern EA.
      *   **Decision-Making Under Deep Uncertainty:** Is a single point estimate ever justified? What are better methods (portfolios, robust optimization, satisficing with thresholds)? Actively researched.
      *   **Aggregation Ethics:** Is aggregating diverse moral views via a median ethically sound? Does it unfairly suppress minority views? (Related to social choice theory debates).
      *   **"Earning to Give":** Is it actually the most impactful path? Does it cause negative externalities (e.g., taking high-paying jobs in potentially harmful industries)? Is it psychologically sustainable?

  **Underdetermined Areas (Same Practice, Different Philosophies):**

  1.  **Why the Median?** The choice of the *median* could stem from:
      *   Pure pragmatism (it's easy, stable).
      *   A Rawlsian-ish desire to avoid extremes dominating.
      *   Implicit Bayesian updating (treating colleagues as informed estimators).
      *   A belief in "wisdom of the (internal) crowd."
  2.  **Rejection of the Unmeasurable:** This practice is consistent with:
      *   **Strong Epistemic Skepticism:** "We simply cannot know if funding this does more good than funding bed nets."
      *   **Pragmatic Prioritarianism:** "Even if it *might* be hugely important, the risk of wasting money on something ineffective when we *know* bed nets work is too high. Stick to the sure(er) bets."
      *   **Rule Utilitarianism:** "Our rule (only fund measurable) leads to better expected outcomes overall than trying to guess at the unmeasurable."
      *   **Institutional Risk Aversion:** "We could get criticized for funding something vague that goes nowhere."
  3.  **The Nature of the "Scale":** Staff could personally hold:
      *   **Subjectivist View:** "The scale is a useful fiction we create to act."
      *   **Pluralist View:** "Different goods *are* incommensurable, but we *have* to force them onto a scale to allocate resources; the scale is a tragic necessity, not real."
      *   **Reductionist View:** "Ultimately, it *all* boils down to neural states/well-being, so one scale *is* fundamentally real, even if we can't measure parts of it perfectly yet." (Less common verbally, but the practice leans this way).
  4.  **The Justification for Aggregation:** Is the median weight:
      *   An approximation of some elusive moral truth?
      *   A fair social compromise?
      *   Simply the necessary input to make the spreadsheet function?

  **Key Takeaways for Your Character:**

  *   **Core Drive:** They are fundamentally **utilitarian consequentialists prioritizing measurable expected value maximization under uncertainty and resource constraints.**
  *   **Key Tension:** They live with the **operational necessity of pretending certainty (via point estimates and quantification) while genuinely feeling deep uncertainty.** This is a recognized tension in the field.
  *   **Pragmatism Rules:** Their habits prioritize **action, consistency, coordination, and demonstrable accountability** over theoretical purity or resolving deep philosophical uncertainties. The spreadsheet *must* give an answer.
  *   **Not Monolithic:** The foundation's practice represents one prominent strand within EA (quant-focused, near-term, health/animal welfare oriented). Significant factions disagree vehemently with aspects of this approach, especially regarding long-termism and the exclusion of hard-to-measure goods.
  *   **Nuance Opportunity:** Show their rigor through **sensitivity analysis** around moral weights and cost-effectiveness estimates. Show their awareness of critiques. Show moments where the tension between operational necessity and personal uncertainty surfaces (e.g., a funding rejection for an unmeasurable good that *feels* important, a debate about the median weight). This makes them human and the philosophy dynamic.

  By understanding these layers – the operational commitments, the unresolved tensions, the live debates, and the underdetermined motivations – you can write a character whose foundation feels authentic, philosophically grounded, and rich with potential for internal and external conflict. Good luck!
