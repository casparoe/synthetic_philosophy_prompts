  ### Activity Design: Concept Induction Challenge

  **Goal:** Students experience three insights: (1) finite examples underdetermine concepts, (2) pattern recognition relies on prior hypothesis spaces, and (3) inexpressible concepts cannot be learned regardless of evidence.

  **Logistics:**  
  - 18 students → 6 teams of 3  
  - 90 minutes total  
  - Movable chairs for team collaboration  
  - Materials: 2 decks of cards (training and held-out), vocabulary handouts, betting tokens  

  ---

  ### **Phase 1: Introduction (5 min)**  
  - **Explain the task:**  
    - A hidden rule sorts cards into Pile A or B.  
    - Teams receive a **training deck** (12 labeled cards in sequence) and a **restricted vocabulary**.  
    - Goal: Write a classification rule using *only* the vocabulary.  
    - Later, they will bet on their rule’s accuracy using play money.  
  - **Emphasize:**  
    - The rule depends on a card’s **position or relation to prior cards** (not individual properties).  
    - The vocabulary is their "toolkit"—they can’t invent new terms.  

  ---

  ### **Phase 2: Training Phase (25 min)**  
  - **Teams receive:**  
    - **Training deck** (12 cards in fixed sequence, labeled A or B).  
    - **Vocabulary handout** (permitted terms):  
      ```plaintext
      PERMITTED VOCABULARY:  
      - For card c:  
          color(c) ∈ {red, blue, green}  
          shape(c) ∈ {circle, square, triangle}  
          number(c) ∈ {1, 2, 3}  
      - For current card c:  
          prev(c)  // Returns the previous card (undefined for first card)  
      - Comparisons:  
          =, ≠   // e.g., color(c) = blue, shape(c) = shape(prev(c))  
      - Connectives:  
          and, or, not, if-then  
      ```  
    - **Rule format:** A logical expression returning A or B (e.g., `if shape(c) = circle then A else B`).  
  - **Hidden rule (unknown to students):**  
    > **Card in position *i* is A if *i* is even, B if *i* is odd.**  
    *(Depends on position—not expressible in the vocabulary, which lacks `position` or `even/odd` predicates.)*  
  - **Training deck cards (sequence matters; labels match hidden rule):**  
    | Position | Shape    | Number | Color | Label |  
    |----------|----------|--------|-------|-------|  
    | 1        | square   | 1      | red   | B     |  
    | 2        | circle   | 2      | red   | A     |  
    | 3        | square   | 1      | blue  | B     |  
    | 4        | circle   | 2      | blue  | A     |  
    | 5        | square   | 1      | green | B     |  
    | 6        | circle   | 2      | green | A     |  
    | 7        | square   | 1      | red   | B     |  
    | 8        | circle   | 2      | red   | A     |  
    | 9        | square   | 1      | blue  | B     |  
    | 10       | circle   | 2      | blue  | A     |  
    | 11       | square   | 1      | green | B     |  
    | 12       | circle   | 2      | green | A     |  
    - **Key design:**  
      - *Even positions:* Always circle and number=2 (correlates with A).  
      - *Odd positions:* Always square and number=1 (correlates with B).  
      - **Multiple expressible rules fit the training data**, e.g.:  
        - `if shape(c) = circle then A else B`  
        - `if number(c) = 2 then A else B`  
      - Teams *cannot* guess the true rule (position-based) with the vocabulary.  

  ---

  ### **Phase 3: Rule Writing (10 min)**  
  - Teams formalize their rule using the vocabulary.  
    - **Critical constraint:** Rules must classify cards **individually** (e.g., using `shape(c)` or `number(c)`). They cannot reference position, sequences beyond `prev(c)`, or external counters.  
  - **Monitor teams:**  
    - Most will write rules like `shape(c) = circle → A` or `number(c) = 2 → A`.  
    - If a team uses `prev(c)`, their rule will fail (e.g., `shape(c) = shape(prev(c)) → A` mislabels cards 1, 3, 5, etc.).  

  ---

  ### **Phase 4: Wagering (5 min)**  
  - Each team gets **100 tokens** (play money).  
  - They wager **0–100 tokens** on their rule being "correct" (matching all held-out cards).  
  - **Scoring rules (revealed now):**  
    - **Win 2× wager:** Rule matches *all* held-out cards.  
    - **Lose wager:** Rule matches *some but not all* held-out cards.  
    - **Lose 2× wager:** Rule matches *no* held-out cards.  
  - **Goal:** Reward calibrated confidence (e.g., low wager if uncertain).  

  ---

  ### **Phase 5: Testing (15 min)**  
  - Reveal **held-out deck** (6 cards in sequence, labeled by hidden rule):  
    | Position | Shape    | Number | Color | Label |  
    |----------|----------|--------|-------|-------|  
    | 13 (odd) | circle   | 1      | red   | B     |  
    | 14 (even)| square   | 1      | blue  | A     |  
    | 15 (odd) | circle   | 2      | green | B     |  
    | 16 (even)| circle   | 1      | red   | A     |  
    | 17 (odd) | square   | 2      | blue  | B     |  
    | 18 (even)| square   | 3      | green | A     |  
  - **Apply each team’s rule to the held-out deck:**  
    - *Example:* A team’s rule `if shape(c) = circle then A else B` labels:  
      - Card 13: circle → A (true label: **B**) → **error**  
      - Card 14: square → B (true label: **A**) → **error**  
      - Card 16: circle → A (true label: A) → correct  
      - Card 18: square → B (true label: A) → **error**  
    - **Result:** Rules fail on 3–5 held-out cards.  
  - Reveal the **hidden rule** (position-based).  

  ---

  ### **Phase 6: Scoring (5 min)**  
  - Calculate scores using the wagering rules.  
  - **Expected outcomes:**  
    - No team wins 2× wager (true rule is inexpressible).  
    - Most teams lose their wager (rules fail on held-out cards).  
  - Declare a "winner" based on tokens (e.g., least loss), but emphasize learning over competition.  

  ---

  ### **Phase 7: Debrief (25 min)**  
  **Map phases to core insights:**  
  1. **Finite examples underdetermine concepts (Training Phase):**  
     - Multiple rules fit the training data (e.g., shape-based and number-based rules).  
     - *Predictable issue:* Teams assume their rule is unique until held-out testing.  

  2. **Pattern recognition relies on hypothesis spaces (Vocabulary):**  
     - The vocabulary forced teams to use properties like shape/number, ignoring position.  
     - *Predictable issue:* Teams protest, "We needed position!" → reveals the "prior hypothesis space" bias.  

  3. **Inexpressible concepts (Rule Writing/Testing):**  
     - The true rule depended on position, which wasn’t in the vocabulary.  
     - *Predictable issue:* Teams insist the rule is "unfair" → segues to discussion of unlearnable concepts.  

  **Address predictable issues:**  
  - **If a team’s rule fits training but not held-out:**  
    - *Response:* "Your rule is *consistent* with the training data but *overfit*. The held-out deck revealed gaps in your hypothesis space."  
  - **If teams protest "unfair" rule:**  
    - *Response:* "The rule isn’t unfair—it’s *inespressible in your vocabulary*. Real learners often lack tools to express valid concepts (e.g., a child lacking ‘gravity’ as a predicate)."  

  **Candid limitations of the activity:**  
  - **Pre-set rule:** I chose the rule in advance, but reality has no "fact of the matter"—concepts are defined by usefulness.  
  - **Thin hypothesis space:** Real learners’ spaces are fluid and uninspectable—unlike a handout.  
  - **What we can’t replicate:** The gradual evolution of hypothesis spaces (e.g., inventing new predicates like "position").  

  **Closing discussion questions:**  
  - "How might your hypothesis space change if you saw 100 examples? What if the vocabulary expanded?"  
  - "In cognitive science, how do prior biases (e.g., object permanence) act like this vocabulary?"  

  ---

  ### **Expected Outcomes & Adjustments**  
  - **First-run pitfalls:**  
    - Teams may ignore `prev(c)` (since the training deck doesn’t require it).  
    - Frustration if rules fail—use this to highlight inexpressibility.  
  - **Adjust on the fly:**  
    - If teams stall, add 1–2 extra training cards (same pattern).  
    - If a team writes a position-like rule (e.g., counting cards), disallow it (vocabulary lacks counters).  
  - **Why this works:**  
    - Teams *feel* the sting of underdetermination (multiple rules fit training data).  
    - Vocabulary acts as a tangible proxy for hypothesis space constraints.  
    - Held-out deck forces confrontation with inexpressibility.  

  This design ensures students grapple with the three insights viscerally before formalizing them. The Bongard-style cards and betting mechanic create engagement, while the debrief links the experience to philosophy and cognitive science.
