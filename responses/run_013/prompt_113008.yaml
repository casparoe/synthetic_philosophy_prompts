  We are designing a classroom activity for 18 students in a 90-minute session. The activity aims to illustrate:
  1. Finite examples underdetermine the concept.
  2. The pattern seen is influenced by the prior hypothesis space.
  3. A concept may be inexpressible in the given vocabulary.

  The activity uses a deck of cards sorted into two piles (like Bongard problems) but with two twists:
  - The hidden rule depends on the sequence (not just individual card properties).
  - The rule must not be expressible in a provided restricted vocabulary.

  We'll have:
  - A training deck (with labeled examples) and a held-out deck (for testing).
  - A fixed vocabulary of predicates and connectives that cannot express the true rule.

  Sequence of phases:

  1. Introduction (5 minutes)
  2. Training phase: teams form hypotheses (25 minutes)
  3. Rule writing: teams write down their rule using the vocabulary (10 minutes)
  4. Wagering: teams wager on their rule with play money (5 minutes)
  5. Testing: held-out deck is revealed and evaluated (15 minutes)
  6. Scoring (5 minutes)
  7. Debrief (25 minutes)

  Total: 90 minutes.

  Details:

  1. **Introduction (5 minutes)**
     - Explain the task: There is a hidden rule that sorts cards into two piles (A and B). They will see a sequence of cards (the training set) with their labels. They must figure out the rule and write it using only the provided vocabulary. They will then bet on their rule's correctness with play money.

  2. **Training Phase (25 minutes)**
     - Divide the class into 6 teams of 3 students each.
     - Provide each team with:
       - A training deck of 12 cards (with labels A or B) in a fixed sequence. The sequence matters because the rule depends on position or relation to the previous card.
       - A vocabulary sheet (explained below).
     - The training deck must be such that multiple rules (including the intended one) fit all the examples, but these rules will diverge on the held-out deck.

  3. **Rule Writing (10 minutes)**
