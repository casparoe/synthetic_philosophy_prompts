prompt: |-
  I am a novelist, and the book I am writing turns on an argument I want to render fairly rather than merely plausibly. One of its two central figures is an actuary who administers a charitable trust with an indefinite horizon; she holds that the trust is right to value a pound devoted to people a century hence at a small fraction of a pound spent on the living, and she defends the practice with a comparison she treats as self-evident: moral concern thins out with distance in time exactly as it thins out with distance in space. She does not deny that a stranger's suffering is as bad for him as a neighbour's is for the neighbour; she says only that our practical concern, and therefore the weight we are obliged to give, declines with distance, in time as in space, and that a discount rate is simply the price we put on that distance. She has read, and cites, the finding that giving after a disaster falls off with the distance between donor and catastrophe, and takes this to be a fact about the shape of human concern that any ethics must accommodate. The other figure, a young trustee, replies that this comparison is precisely what condemns her: if distance in space does not diminish a person's claim on us, then distance in time cannot either, and pure time preference — a preference for an earlier benefit merely because it is earlier — is indefensible. I have since met versions of the comparison in several places, made by people on both sides of the question, and I cannot tell how much of the argument the comparison itself is carrying.

  I am not asking for a verdict on whether discounting is defensible in general. I am asking for an audit of the analogy, so that I can see what each character is entitled to. Begin with the correspondence table: what plays the role of distance, of the person at the far end, of the neighbour and the traveller, of the discount rate, of the moral claim that supposedly weakens. Then the places where the mapping breaks — I suspect the direction of time is one, since space runs both ways and the past is closed to us, but I want the rest — and I want you to separate the breaks that actually matter for the use each character makes of the comparison from those that are merely decorative. Does the comparison, followed consistently, cut symmetrically, so that it must debunk spatial partiality and temporal partiality together or license them together? If it licenses both, what work is left for the discount rate to do, and what would the actuary have to say instead? What does the analogy quietly import: that distance is a fact about the world rather than about the observer, that the decay of sympathy and the decay of obligation run at the same rate, that the far end is occupied by people who will exist whatever we do? And does it reach the whole discount rate, or only the part of it that is pure time preference, as distinct from what we owe to the uncertainty of the future and to the likelihood that later people will be richer?

  Finally, and this is what I would most like: a sentence I can put in the actuary's mouth that states the strongest version of her position once the disanalogies have been conceded, and a sentence for the young trustee that answers that repaired version rather than the original. If the comparison is beyond repair, give me a better one — some image of the relation between the present and the further future that carries what she needs carried.
reasoning: |-
  Okay, let me start by really understanding what this novelist needs. They're working on a book with two characters debating the ethics of discounting future benefits in a charitable trust. The actuary argues that moral concern diminishes over time just like it does over space, using a spatial analogy to justify a discount rate. The young trustee counters that both forms of partiality are equally indefensible. The author wants to dissect this analogy to ensure both characters' arguments are presented fairly and accurately.

  First, I need to map out the analogy's components. The actuary equates distance in space with distance in time. In space, people donate less to faraway disasters—that's the observed behavior. She extends this to time, saying our moral obligation to future people weakens similarly. The trustee argues that if spatial distance shouldn't reduce obligation, neither should temporal distance. The author suspects there might be disanalogies, especially since time only moves forward, unlike space which is bidirectional.

  Hmm, the key disanalogies come to mind. Time's asymmetry is a big one—we can't affect the past, but our actions impact the future. Also, future people don't exist yet, which changes how we perceive obligation. Uncertainty about the future (will resources even be needed? Will technology solve problems?) adds another layer. These disanalogies weaken the actuary's analogy when applied to temporal discounting.

  The author also wants to know if the analogy forces symmetry: does endorsing spatial discounting require endorsing temporal, and vice versa? If the actuary admits spatial partiality is arbitrary, she'd have to abandon temporal discounting too. But if she defends both, then the discount rate might just quantify that preference. But then the trustee could argue both are unethical. 

  I should consider what the discount rate actually includes. It's not just pure time preference; it also accounts for uncertainty and expected wealth growth. The spatial analogy only captures the "decline of concern" part, not these other factors. So the actuary might need to adjust her argument, conceding that pure time preference is problematic but justifying discounting based on uncertainty instead.

  For the strongest versions of their arguments, the actuary could focus on our limited resources and the unpredictability of the future. The trustee could counter that this isn't about preference but about practical constraints, and our obligation remains even if we have to prioritize. A better analogy for the actuary might be investing in a chain of beneficiaries, where uncertainty increases with time—not a perfect fix, but more honest.

  The author needs punchy lines for both characters. The actuary should concede the disanalogies but pivot to uncertainty. The trustee should emphasize that uncertainty doesn't negate obligation, just changes how we fulfill it. Making sure both positions feel valid and nuanced is crucial for the novel's depth.
answer: |-
  Here’s an audit of the analogy, its strengths, weaknesses, and implications for your characters, followed by the sentences you requested:

  ### Correspondence Table (Actuary's Analogy)
  | **Spatial Domain**          | **Temporal Domain**          | **Role**                                                                 |
  | :-------------------------- | :--------------------------- | :----------------------------------------------------------------------- |
  | Geographic Distance         | Temporal Distance (Future)   | Metric for "distance" weakening concern.                                |
  | Suffering Stranger (e.g., disaster victim far away) | Future Person (e.g., beneficiary in 100 years) | "Person at the far end" whose claim is discounted.                      |
  | Neighbour/Traveller         | Present/Living Beneficiary   | "Near" recipient receiving full weight/concern.                         |
  | Decline in Donations/Giving | Discount Rate (e.g., 3%/yr)  | Quantitative measure of declining practical concern/obligation.         |
  | Moral Claim Weakening       | Moral Claim Weakening        | The asserted principle: obligation diminishes with spatiotemporal distance. |

  ### Key Disanalogies & Their Impact
  1.  **Directionality & Causality (Asymmetry of Time):**
      *   **Break:** Space is symmetric; we can move/act/intervene in any direction. Time is asymmetric; we can only causally influence the *future*, not the past. The past is fixed.
      *   **Impact for Actuary:** Severely weakens the analogy. Our *inability* to affect the past isn't analogous to spatial distance; it's a fundamental constraint. The analogy misleadingly suggests temporal distance is passive like spatial distance, ignoring our unique *causal responsibility* for the future. This undermines her claim that temporal discounting is as "self-evident" as observed spatial giving patterns.
      *   **Impact for Trustee:** This is their strongest point against the analogy. They can argue temporal distance implies *responsibility*, not just passive distance. "We *make* the future; we don't just observe it from afar."

  2.  **Existence & Identity:**
      *   **Break:** Distant strangers *currently exist*. Distant future people *do not yet exist* and their specific identities depend partly on our present choices.
      *   **Impact for Actuary:** Major problem. Spatial giving concerns existing beings. Temporal discounting applies to beings whose very existence and circumstances are contingent on current actions (e.g., resource depletion, climate change). This introduces profound uncertainty and metaphysical questions about obligations to potential persons, absent in the spatial case.
      *   **Impact for Trustee:** Allows them to argue the actuary conflates *concern for existing others* with *responsibility for creating the conditions of life for future others*. The analogy smuggles in the assumption that future people are "just like" spatially distant strangers, masking the unique nature of intergenerational ethics.

  3.  **Uncertainty Magnitude & Kind:**
      *   **Break:** Spatial uncertainty (e.g., how aid is used far away) is often tractable. Temporal uncertainty (will humanity exist? Will technology solve X? What will future values be? Will resources even be needed?) is exponentially greater and often existential.
      *   **Impact for Actuary:** This *could* support a *risk-adjusted* discount rate but *undermines* the pure "decline of concern" analogy. The observed spatial decay is primarily about empathy/sympathy, while temporal decay involves massive epistemic uncertainty. The analogy conflates psychological distance with radical contingency.
      *   **Impact for Trustee:** Can concede uncertainty justifies *prudence* and *risk mitigation* (e.g., diversification, resilience-building) but *not* pure time preference. The analogy hides this distinction.

  4.  **The "Observer-Relativity" of Distance:**
      *   **Break:** Spatial distance is relative (my neighbour is your stranger). Temporal distance is absolute from "now".
      *   **Impact for Actuary:** Slightly problematic. The spatial data aggregates *many* relative perspectives. Temporal discounting applies an absolute "now" perspective to the *entire* future. The analogy normalizes this presentism.
      *   **Impact for Trustee:** Can argue this exposes the subjectivity/arbitrariness of prioritizing the present observer's location in time, just as prioritizing one's spatial location would be arbitrary.

  5.  **Growth & Changing Circumstances:**
      *   **Break:** Spatial comparisons usually assume similar baseline needs/wealth. Temporal comparisons expect growth – future people are likely richer.
      *   **Impact for Actuary:** This is part of a *defensible* discount rate (growth component), but it's *not* captured by the simple spatial empathy decay analogy. The analogy only maps to the "pure time preference" component.
      *   **Impact for Trustee:** Can argue the growth component is separable and debatable, but the analogy misleadingly bundles it with the ethically dubious pure time preference claim.

  ### Symmetry & Implications
  *   **Does the analogy force symmetry?** **Yes, inherently.** If the spatial decay of giving is taken as a normative justification (as the actuary does), then defending temporal discounting via the analogy *requires* defending spatial partiality. Conversely, condemning temporal discounting via the analogy *requires* condemning spatial partiality. It bundles them.
  *   **Consequence:** The actuary cannot consistently use the analogy to defend temporal discounting while dismissing the trustee's condemnation of spatial partiality. She must either:
      1.  **Defend Both:** Argue partiality (spatial *and* temporal) is a fundamental, acceptable feature of human ethics/practical reason. The discount rate quantifies the temporal aspect. *But this exposes her to the charge of endorsing morally arbitrary discrimination.*
      2.  **Abandon the Analogy:** Find another justification for temporal discounting *not* reliant on spatial empathy decay.
  *   **What work is left for the discount rate?** If she defends both partialities, the discount rate *only* quantifies the *degree* of temporal bias she deems acceptable, based on observed spatial patterns or arbitrary choice. Its primary justification becomes the analogy itself. The components for uncertainty and growth are *additional* factors layered on top.

  ### What the Analogy Smuggles In (Quiet Imports)
  1.  **Distance as Objective:** It treats temporal distance as a fixed, observer-independent metric like kilometers, ignoring the unique causal/ethical relationship between present actors and the future they create.
  2.  **Sympathy = Obligation:** It assumes the empirically observed decay in sympathy/donations *defines* or *justifies* the decay in moral obligation. (Hume's Is-Ought problem).
  3.  **Fixed Future People:** It assumes future people are "out there," fixed, waiting for our help or neglect, ignoring our role in shaping who exists and their circumstances (Non-Identity Problem).
  4.  **Applies Only to Pure Time Preference:** It directly maps only to the component of discounting based *solely* on the passage of time (pure time preference). It doesn't inherently cover the discounting components for uncertainty or expected growth.

  ### Repaired Arguments & A Better Analogy

  *   **Strongest Actuary Position (Conceding Disanalogies):**
      > "Conceding time's arrow sets us apart from the distant *present*, the core truth remains: our finite hearts and resources *must* prioritize the near and certain over the far and profoundly uncertain. The discount rate isn't mere preference for 'now'; it's the essential tool for navigating our radical ignorance about the world a century hence, ensuring we don't sacrifice tangible good today for phantoms tomorrow. To ignore this is not ethics, but recklessness disguised as piety."
      *   *Shift:* Abandons "self-evident" symmetry. Focuses on *uncertainty* and *practical necessity* as the primary justification, relegating pure time preference to a secondary (or even denied) role. The discount rate becomes primarily a risk-management tool.

  *   **Trustee's Response (Addressing the Repair):**
      > "Uncertainty demands prudence, not indifference. It means we build robust systems, invest in knowledge, and preserve options – precisely the opposite of heavily discounting future lives. Our duty isn't to gamble with their survival based on today's fears, but to act as stewards ensuring the very possibility of their having a claim *at all*. Sacrificing their potential for our marginal gain isn't caution; it's intergenerational theft."
      *   *Shift:* Accepts the reality of uncertainty but argues it transforms the obligation into one of *precaution* and *safeguarding potential*, not discounting. Focuses on the unique *causal responsibility* for the future.

  *   **A Better Analogy for the Actuary (Focusing on Uncertainty/Risk):**
      > "Managing a trust for the indefinite future is like being the first investor in an endless chain of startups. Each subsequent generation is a new venture, inheriting our seed capital. While we wish success for all, we must invest most where we can see the clearest path and the most immediate need – knowing that countless unforeseeable events (wars, plagues, breakthroughs, collapses) will radically reshape the landscape long before Venture #100 pitches its plan. Over-committing to the most distant ventures isn't visionary; it's ignoring the near-certainty of turbulence."
      *   *Why Better:* Acknowledges the causal chain, the radical uncertainty about future "ventures" (generations), the potential for growth *or* failure, and the practical need for staged investment/risk assessment. It avoids the misleading symmetry of space/time and better captures the core justification based on contingency and risk management.

  This audit empowers you to let both characters make their strongest, most nuanced cases, moving beyond the flawed but revealing space/time analogy to the deeper ethical and practical tensions at the heart of intergenerational obligations.
