prompt: |-
  I sit on my college's communications ethics commitee. We're drafting a ruling on a case that's got everyone stuck. Our dean of admissions told a room of mostly international prospective students, 'We don't consider financial need in admissions.' That's true for domestic applicants — we're need-blind for them — but we're need-aware for internationals, and he knew who was in the room. The student paper wants a correction; the dean says he never lied because every word was true, and he calls it 'paltering,' which he says is just effective communication. Our code bans 'knowingly false statements or material omissions,' and the provost wants us to say no rule was broken. Half the committee thinks this is the classic saying-versus-implicating distinction; half thinks that's a dodge. Draft the short written opinion I'll circulate before Thursday's meeting: recommend censure, a required correction, or a policy change, give criteria we can apply to future cases, and take the dean's 'it was literally true' point seriously rather than just asserting that misleading is lying. Keep it under 500 words and lead with the bottom line.
reasoning: |-
  Okay, the user is on a college communications ethics committee and needs to draft a short written opinion about a tricky case. The dean told international prospective students "We don't consider financial need in admissions" - which is technically true for domestic applicants but misleading since the college is need-aware for internationals. 

  First, I need to understand the core tension here: literal truth versus deceptive implication. The dean claims he was just "paltering" (using truthful statements to mislead), while the committee is split on whether this violates their ethics code banning "knowingly false statements or material omissions."

  Hmm... the user wants me to take the dean's "literally true" defense seriously, not just dismiss it. So I can't just say "it's lying." I need to analyze why technically true statements can still be unethical. 

  Key angles to consider:
  - The admissions context (prospective students making life-changing decisions)
  - Power dynamics (dean vs applicants)
  - Material omission aspect (withholding that policy differs for internationals)
  - Intent - he knew the audience was mostly international

  The provost wants no rule broken, but that feels like dodging institutional responsibility. The student paper's request for correction seems reasonable.

  For the opinion structure: 
  Lead with recommendation (censure + correction), then explain criteria. Need under 500 words. Should provide testable criteria for future cases - something like "material misdirection" standard focusing on audience understanding and materiality.

  Biggest challenge is balancing nuance with brevity. Must show why literal truth isn't enough when it creates false beliefs, especially with power imbalances. Might reference how omitting the international exception made the statement functionally false for that audience.

  Also worth noting: calling it "effective communication" is cynical - it's effective deception. But keep tone professional, not accusatory.
answer: |-
  ## Committee Opinion: Dean's Statement Violated Ethics Code  
  **Recommendation:** Issue formal censure and require public correction.  

  **Reasoning:** While the dean's statement "We don't consider financial need in admissions" was *literally true* for domestic applicants, its delivery to an audience predominantly composed of international prospective students constituted **material misdirection** under our ethics code ("knowingly false statements or material omissions").  

  **Key Violations:**  
  1.  **Material Omission:** The statement omitted the *critical exception* for international applicants. This omission was not incidental; it directly negated the information most relevant to the audience.  
  2.  **Exploiting Context:** The dean knew the audience composition. Presenting a selectively true fact, knowing it would create a false belief in the listeners, transforms a literal truth into a functional falsehood. "Paltering" is deceptive when material information is withheld.  
  3.  **Harm & Reliance:** Prospective international students reasonably relied on this definitive statement when making consequential decisions (e.g., applying). The misdirection potentially wasted their resources and undermined institutional trust.  

  **Rejecting the "Literal Truth" Defense:**  
  A statement is unethical if:  
  **(A) The speaker knows the audience is likely to draw a materially false conclusion;** and  
  **(B) The speaker fails to provide necessary clarifying information to prevent that misapprehension.**  
  Here, both conditions are met. Literal truth alone does not absolve responsibility for foreseeable misinterpretation caused by omission.  

  **Future Criteria:**  
  Communications violate our code if they:  
  1.  **Intend to mislead** OR **foreseeably cause material misunderstanding**; and  
  2.  **Omit information necessary to correct that misunderstanding** in the given context; and  
  3.  **Impact decisions or trust**.  

  **Recommendations:**  
  1.  **Censure:** The committee formally censures the dean for violating Section 3.1 ("material omissions").  
  2.  **Correction:** The Dean must issue a written clarification to all attendees and the student paper, explicitly stating the international applicant policy.  
  3.  **Policy Change:** Admissions leadership must develop clear, audience-specific talking points approved by this committee to prevent recurrence.  

  **Bottom Line:** Truthful words can still deceive. Our code demands transparency, not technical compliance. The dean’s omission materially misled a vulnerable audience, damaging trust and warranting censure and correction.  

