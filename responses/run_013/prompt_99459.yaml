answer: |-
  You raise a sharp objection, my interlocutor, and I welcome the test of reason. You ask: if God creates the *burning* directly when the cotton touches the fire, just as He could create *sweet fragrance* if He so willed, what truly distinguishes the burning from the non-burning? Both are indeed immediate acts of the Divine Will.

  The difference lies not in the *source* of the act – for all acts flow solely from Him – but in the *pattern* He has freely chosen to establish. When we observe cotton consistently blackening and crumbling upon contact with fire, we witness *'ādah* – God's unwavering custom. This custom *is* the observable regularity. It is not a property *in* the fire, but a habit *of* the Creator. The difference between burning and smelling of roses is simply this: one conforms to the established habit, the other does not. The habit itself *is* the distinction you seek within creation. It is a signpost of His consistent choice, not an independent power.

  You fear this makes every event "equally miraculous." Not so. A "miracle" (*muʿjizah*) occurs precisely *when* this established custom is *suspended* – when God manifests His absolute freedom to act *contrary* to the pattern He normally upholds, specifically to authenticate a prophet. The burning cotton is the *norm*, the custom itself. The rose-scented cotton would be the *exception*, the direct intervention breaking the norm to demonstrate divine power and support the truth of a message. The "work" of "miracle" is done precisely by this rupture of the expected pattern. Without a dependable custom, there *is* no miracle, only chaos. Why should you expect your hand to burn? Because God, in His wisdom and grace, maintains His custom (*'ādah*) faithfully for our benefit and comprehension. It is not a "promise" inherent in creation, binding Him, but a reflection of His unchanging will to sustain order – a will He *can* alter, supremely, for a greater purpose. Expectation arises from witnessing His past consistency, knowing His attributes of Wisdom and Faithfulness incline Him to maintain it, yet acknowledging His absolute freedom transcends it. The exception for the prophet confirms His freedom without breaking a promise, for no necessity binds Him – only His own perfect will guides the pattern and its rare interruption.
