prompt: |-
  I'd like you to act as a philosopher with expertise in normative ethics and moral psychology, and to think carefully before you answer. I'm not a philosopher by training, but I read a fair amount of ethics, and I keep running into a shape of objection that I have no name for. I'd like to know whether there's an established concept for it; if there isn't, I'd like one coined. Either way, the label matters less to me than getting the shape right.

  Here is what I keep seeing. Someone attacks an ethical theory, but not by denying that its verdicts about what to do are correct, and not by complaining that its demands are too heavy. The complaint is aimed at what the theory requires the agent to be thinking. Three instances I've collected:

  1. Two old friends, one of whom has been visiting the other every week for years. The visitor says: I come because I promised, and I keep my promises. The friend says: I would rather you came because you wanted to. The visits are identical, and the promise-keeper is arguably the more reliable friend; the objection is not about the behaviour at all.

  2. A parent who loves their child decides how to treat the child by consulting a manual of parental duties, and consults it correctly, so that the verdicts reached are the ones a good parent would have reached anyway. Something still seems defective here, and it is not the verdicts.

  3. A theory tells you to be generous, and then adds that you should be generous because it is required. The second half seems to undermine the first in a way that has nothing to do with whether generosity is in fact required: it asks the agent to stand outside the disposition in order to act on it.

  What these share, as I see it, is that the theory is granted the action and convicted on the accompaniment. It is faulted for inserting a justifying thought where the agent's attachment should simply be doing the work, or for requiring the agent to have a reason for something that ought not to need one. And the objection gets slippery in a way that bothers me: sometimes it sounds like a complaint about the theory, sometimes like a complaint about a particular person who happens to deliberate that way (the manual-consulting parent is a person, not a theory), and sometimes like mere distaste dressed up as argument.

  So: does this have a name? I have seen words like integrity and self-effacement used in this vicinity, but I cannot tell whether either is the concept I am after, and I suspect my three cases may not all be instances of the same complaint. Please begin by brainstorming the candidate concepts that come closest, then compare each one against all three cases and tell me which fits, which does not, and why. In particular, sort out whether the complaint concerns how much is demanded or what is demanded; whether it is an objection to the theory itself or only to the theory's use as a decision procedure; and whether it can be pressed against a theory that is entirely indifferent to the agent's motives. Then, whether or not an established name exists, give me a precise formulation of the phenomenon together with the boundary cases that separate it from its neighbours, and tell me plainly if I am conflating two or more different complaints.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a recurring objection in ethical discussions where the issue isn't with the actions prescribed by a theory but with the mindset or reasoning required. They provided three examples: a friend visiting out of duty rather than desire, a parent using a manual for parenting duties, and being generous because it's required rather than from genuine disposition.

  First, I need to figure out if there's an established term for this. The user mentioned integrity and self-effacement, so those are starting points. Bernard Williams' integrity objection comes to mind, where external moral demands might alienate a person from their personal projects. But in the friend example, the visitor's promise-keeping isn't conflicting with personal projects; it's about the friend's preference for authentic affection. So Williams' concept might not fully fit here.

  Self-effacement, from philosophers like Sidgwick and Parfit, is when a theory shouldn't be used as a decision procedure. The generosity example fits here—requiring generosity because it's demanded undermines the disposition. But in the parent manual case, consulting a manual isn't necessarily self-effacing; it's about over-reliance on rules instead of internalized virtues. So self-effacement applies only partially.

  Motivational externalism versus internalism is another angle. The objection here is that the theory imposes external reasons where internal motives should suffice. The friend wants internal motivation, not external duty. But this might be more about moral psychology than the theory itself.

  The user might be conflating different issues. The friend example is about relational expectations (wanting affection over duty), the parent case about virtue versus rules, and the generosity one about self-effacement. The common thread is a "motive/mindset mismatch," where the theory mandates a specific cognitive process that clashes with the ideal motivational state.

  I need to clearly separate the objections. Integrity objections are about identity conflicts, self-effacement about decision procedures conflicting with virtues, and the parent case points to a lack of phronesis (practical wisdom). The core phenomenon is the theory requiring an alienating justification rather than organic motivation.

  For a new term, "justificatory alienation" could work, capturing the imposition of external reasons causing internal dissonance. Setting boundaries: it's not about demanding too much (overdemandingness) or the theory's substance, but the required reasoning process. Also, it's distinct from self-effacement because it can apply even if the theory isn't self-effacing. The user needs clarity on whether the objection is to the theory's structure or its application. They might need to address each case separately while recognizing the common thread of motive-theory conflict.
answer: |-
  Based on your precise description and examples, you've identified a significant family of objections in normative ethics and moral psychology, though there isn't a single universally agreed-upon term that perfectly captures all three cases simultaneously. The concepts you mention ("integrity," "self-effacement") are indeed neighbors, but your examples highlight distinct nuances. Let's break it down systematically.

  **Brainstorming Candidate Concepts:**

  1.  **Integrity Objection (Bernard Williams):** Primarily targets consequentialism. Argues that demanding impartial maximization alienates the agent from their "ground projects" and deeply held personal commitments (e.g., saving your spouse vs. a stranger because she's your spouse), violating their sense of self and making the action feel alien or inauthentic. Focuses on *identity-conflict*.
  2.  **Self-Effacement (Sidgwick, Parfit):** A theory is self-effacing if it holds that it would sometimes (or always) be better if agents *did not* use the theory itself as their decision procedure when deciding what to do. The theory tells you *not* to think about the theory to act best according to the theory (e.g., Act Utilitarianism might say: Don't think about maximizing utility; just love your child spontaneously). Focuses on *decision procedure inefficacy*.
  3.  **Motivational Externalism vs. Internalism:** While a meta-ethical debate, the objection often relies on the intuition that certain moral actions *should* be performed from an internal motive (like love or care) rather than an external reason (like duty or rule). The complaint is that the theory mandates the *wrong kind of motive*.
  4.  **Virtue Ethics Critiques of Rule-Based Ethics:** Virtue ethicists (e.g., Aristotle, Hursthouse, Annas) argue that relying on rules/manuals misses the point of *phronesis* (practical wisdom). The virtuous person acts from a stable, cultivated disposition (*hexis*) and perceives the situation rightly, not by consulting explicit rules. The manual-user lacks the *character* or *practical insight* even if their actions are correct. Focuses on *character deficiency*.
  5.  **The Demands of Love/Care/Friendship:** A specific objection within partialist ethics (often against Kantianism or consequentialism) that relationships like friendship, love, or parenthood are inherently constituted by certain motives. Acting from duty *within* that relationship violates its constitutive norms – it's not *fully* an act *of* friendship/love if done purely from duty. Focuses on *relationship constitution*.
  6.  **Over-Intellectualization / Lack of Spontaneity:** A complaint that the theory forces an unnecessary or counterproductive cognitive step ("I must justify this via X") into domains where immediate, unreflective response (care, affection, habit) is normatively appropriate or superior.

  **Analysis of Your Cases Against Candidates:**

  1.  **The Visiting Friend:**
      *   **Integrity:** Doesn't quite fit. The promise-keeper isn't alienated from *their own* projects; they *are* keeping their promise (their project). The objection comes *from the friend*, about the *relationship*, not the agent's identity.
      *   **Self-Effacement:** Not directly relevant. The theory (promise-keeping) *is* being used as the decision procedure, but the complaint isn't that this leads to worse outcomes; it's about the relational meaning.
      *   **Motivational Externalism:** Getting closer. The friend desires an internal motive (affection, desire) rather than an external one (duty/promise).
      *   **Virtue Ethics:** Fits well. A true friend possesses the *virtue* of friendship, acting from affection and care, not just rule-following. The promise-keeper, while reliable, might lack the full *character* of a friend (or at least, isn't expressing it optimally).
      *   **Demands of Friendship:** **Best Fit.** Friendship is constituted by mutual affection and care. Acts *of* friendship must spring, at least partly, from these motives. Acting solely from duty, even if the act is the same, fails to be a full expression *of* the friendship itself. It's about violating the constitutive norms of the relationship.
      *   **Over-Intellectualization:** Fits. The friend perceives the visitor's explicit appeal to duty as an unnecessary cognitive intrusion into what should be a spontaneous expression of care.

  2.  **The Manual-Consulting Parent:**
      *   **Integrity:** Unlikely. The parent loves the child; consulting the manual isn't necessarily alienating them from that love or their identity as a parent. It might even stem *from* their love ("I want to do this right!").
      *   **Self-Effacement:** Potentially relevant. If the "theory" (the manual/code of duties) is correct, it might be self-effacing: the *best* parent (according to the manual's standards) wouldn't need to consult the manual constantly; they'd act spontaneously from love *informed* by wisdom. Constant consultation signals a lack of internalization.
      *   **Motivational Externalism:** Fits. The ideal motive is love and care; the parent is acting based on external rules/duties. The love is present but not driving the action *in the right way*.
      *   **Virtue Ethics:** **Strong Fit.** This is a classic virtue ethics complaint. Good parenting requires *phronesis* – the ability to perceive the unique needs of *this* child in *this* situation and respond appropriately, cultivated through experience and guided by virtue. Relying on a generic manual shows a lack of this practical wisdom, even if actions are correct. It's a deficiency in *character* or *expertise*.
      *   **Demands of Parenthood:** Fits. Parenthood involves intimate care; constitutive norms likely include acting from deep concern and understanding, not just rule application.
      *   **Over-Intellectualization:** Fits. Parenting often requires intuitive, responsive action. Constant rule-consultation introduces an intellectual step that feels detached and inappropriate for the intimacy of the relationship.

  3.  **Generosity + Requirement:**
      *   **Integrity:** Doesn't obviously fit. No specific identity conflict is described.
      *   **Self-Effacement:** **Best Fit.** This is a paradigmatic example. The theory (be generous!) also dictates the decision procedure (be generous *because it's required!*). But for generosity to be truly virtuous or effective, it arguably *must* stem from a spontaneous concern for others, not from the thought of duty/requirement. The theory, if true, might work best if agents *don't* think about the requirement when acting generously. The requirement-thought *undermines* the disposition it aims to produce.
      *   **Motivational Externalism:** Fits perfectly. The theory mandates an external motive (duty/requirement) where the ideal motive is internal (benevolence, care).
      *   **Virtue Ethics:** Fits. True generosity is a virtue, a stable disposition to give freely and appropriately. Acting "generously" *because* it's required isn't fully generous; it's rule-following or possibly self-interested (avoiding guilt/fulfilling obligation). It lacks the *motivational core* of the virtue.
      *   **Demands of...:** Less specific, but fits the spirit that certain dispositions demand specific motives.
      *   **Over-Intellectualization:** Fits. The requirement-thought adds an unnecessary and counterproductive cognitive layer to what should ideally be a direct response.

  **Synthesis: The Core Phenomenon and Its Boundaries**

  *   **The Core Complaint:** You've identified objections centered on **the mismatch between the motive or cognitive process mandated (or permitted as sufficient) by an ethical theory and the motive or cognitive process deemed normatively appropriate or constitutive for the specific type of action, relationship, or disposition in question.** The theory is faulted for prescribing or validating an *alienating mode of agency* – requiring the agent to adopt an external justificatory stance ("I must do this because X") where the normative ideal involves an unmediated, internalized, or constitutive motive ("I do this because I care/this is who we are"). It's not about *what* is done, but *how* the agent relates to the doing and *why* they think they are doing it.
  *   **Boundaries:**
      *   **vs. Overdemandingness:** Clear distinction. Overdemandingness claims the theory asks for *too much action* (sacrifice, effort). This objection claims the theory asks for the *wrong kind of thinking/reasoning/motivation* accompanying the (correct) action.
      *   **vs. Wrong Verdicts:** Clear distinction. The objection explicitly grants the theory gets the action right ("do X") but faults it for getting the accompanying agency wrong ("do X *because rule Y*" instead of "do X *because Z*").
      *   **vs. Self-Effacement (Strict Sense):** Self-effacement is a specific *property of a theory* concerning the (in)efficacy of its own decision procedure. Your objection *can* leverage self-effacement (Case 3), but also applies in cases where self-effacement isn't the core issue (Cases 1 & 2). A theory *can* be non-self-effacing but still mandate alienating motives (e.g., a theory that correctly says "Always act from love!" isn't self-effacing, but if it *also* requires "And remember you're doing it because this theory says so!", it might fall foul of your objection).
      *   **vs. Integrity (Williams):** Williams' integrity objection is a powerful *instance* of your phenomenon, specifically when the alienating motive/justification conflicts with the agent's *deep personal commitments*. However, your cases 1 & 2 focus more on violating the norms of *relationships* or lacking *character virtues*, not necessarily the agent's own identity projects. Case 3 is about undermining a *disposition*.
      *   **Objection to Theory vs. Agent:** This is crucial. The objection *can be* pressed at different levels:
          *   **Against the Theory's Structure:** If the theory *requires* or *privileges* the alienating motive/justification as necessary or sufficient for moral worth (e.g., Kantianism *requires* duty as the motive for an action to have full moral worth; a theory *requiring* manual consultation).
          *   **Against the Theory's Adequacy:** If the theory *fails to adequately account for or value* the non-alienated motive/state (e.g., Consequentialism might seem indifferent to *why* you help, as long as you do; the objection argues this indifference is a flaw, it *should* care about motive for certain actions).
          *   **Against the Agent's Deliberation:** Even if the theory *allows* for the better motive (e.g., a rule-utilitarian might *allow* acting from love), an agent who *chooses* to use the alienating mode (manual, duty-thought) when the better mode is available is criticized (as in your parent case). The theory might be *blamed* for not sufficiently guiding the agent *away* from this inferior mode of deliberation.
      *   **Theories Indifferent to Motive:** Yes, the objection can be pressed against them. The core claim is that such theories are *inadequate* precisely *because* they are indifferent to motive in domains where motive is constitutive or normatively essential (friendship, virtue, care). Their indifference is the flaw.

  **Conflation Check:** You are *not* conflating fundamentally different complaints. You've identified a coherent family of objections united by the "motive/mindset mismatch" core. However, the *reasons why* the mismatch is problematic differ slightly across your cases:

  1.  **Case 1 (Friend):** Primarily a **Relational Constitution Objection** (violates norms of friendship).
  2.  **Case 2 (Parent):** Primarily a **Deficiency in Virtue/Phronesis Objection** (lacks practical wisdom/internalized character).
  3.  **Case 3 (Generosity):** Primarily a **Self-Undermining Motive / Self-Effacement Objection** (the required thought destroys the disposition).

  These are distinct *variants* or *applications* of the broader phenomenon, not unrelated complaints. The "slipperiness" you note stems from this: the objection can target the theory's structure, its adequacy, or an agent's deliberation under it, depending on the context and which variant is prominent.

  **The Established Name & The Coined Term:**

  *   **Established Name:** There isn't one perfect umbrella term. Philosophers typically use more specific labels: "the integrity objection," "the self-effacement objection," "critiques of external reasons/motives," "virtue ethics critiques of rule-based ethics," "the demands of love/friendship." The phrase "**problem of alienated labor**" (extended from Marx) is sometimes used metaphorically, but isn't standard.
  *   **Coined Term:** Given the core is the imposition of an external justificatory stance causing a sense of dissonance or inauthenticity in contexts demanding unmediated internal commitment, an apt term would be **Justificatory Alienation**.

  **Precise Formulation:**

  *   **The Justificatory Alienation Objection:** An objection to an ethical theory (or an agent's deliberation guided by it) claiming that it prescribes, permits as sufficient, or fails to discourage, a mode of agency wherein the agent performs a normatively correct action X, but does so motivated primarily or solely by an external justificatory reason R (e.g., duty, rule-compliance, consequence-maximization), in a context where the normatively ideal performance of X requires, is constituted by, or is best realized through a mode of agency involving an unmediated internal motive M (e.g., love, care, friendship, spontaneous virtue, personal commitment) or the absence of explicit justification. The objection holds that the use of R (or the absence of M) in this context is alienating, inauthentic, or otherwise deficient, even if X is performed correctly, because it violates constitutive norms of relationships, undermines virtues, demands counterproductive deliberation, or conflicts with identity-constituting commitments.

  This formulation captures the shared structure of your cases while acknowledging the different emphases (relationship, virtue, disposition). "Justificatory Alienation" highlights the core issue: the theory forces or allows an agent to adopt an external justificatory perspective ("I do X *because R*") where the normative context demands an internal, non-justificatory stance ("I do X *because...* [unmediated expression of M]" or simply performing X as the natural expression of M).
