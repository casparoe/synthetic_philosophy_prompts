  ### Diagnostic Decision Tree: Individual Contributions to Collective Harms  
  **Premise:** A single person's action (e.g., emitting CO₂, eating meat, voting) has no perceptible causal impact on its own.  

  #### Root Question:  
  **Q1.** Is the act wrong because of *what it causes* or *what it represents*?  
  - **If CAUSES:** Focus on causal structure → **Q2.**  
  - **If REPRESENTS:** Focus on meaning/relations → **Q4.**  

  ---  
  ### Branch 1: Causal Structure (Q1 → CAUSES)  
  **Q2.** What best describes the causal link between the act and the harm?  
  - **Threshold:** The harm occurs only if acts cross a critical point (e.g., climate tipping points).  
  - **Linear:** Each act adds a tiny, fixed harm increment (e.g., CO₂ molecules).  
  - **Probabilistic:** Each act slightly increases harm probability (e.g., meat demand raising factory farm odds).  
  - **Constitutive:** The act is a *part* of the harm, not a cause (e.g., voting *is* enabling a harmful policy).  

  **Q3.** Does the act’s wrongness depend on its *expected outcome*?  
  - **YES, expected outcome:** → **Leaf: Expected-Impact Consequentialism**  
    - *Awkward commitment:* Demands calculating vanishingly small risks (e.g., 1-in-10⁹ chance of causing a hurricane).  
  - **NO, intrinsic wrongness:** → **Leaf: Rule-Consequentialism**  
    - *Awkward commitment:* Upholds rules (e.g., "never fly") even when breaking them *reducés* harm (e.g., empty plane seats).  

  ---  
  ### Branch 2: Non-Causal Relations (Q1 → REPRESENTS)  
  **Q4.** Is the act’s wrongness about the *act-type* or the *agent’s role*?  
  - **ACT-TYPE:** Focus on the act’s inherent properties → **Q5.**  
  - **AGENT’S ROLE:** Focus on the actor’s relation to harm → **Q6.**  

  **Q5.** Must the act’s justification apply universally?  
  - **YES, universalisable:** → **Leaf: Kantian Universalisability**  
    - *Awkward commitment:* Bans acts like driving if universalized, even if *your* drive changes nothing.  
  - **NO, context-dependent:** → **Leaf: Virtue-Ethical View**  
    - *Awkward commitment:* Condemns acts (e.g., eating beef) as "gluttonous" even if done sustainably.  

  **Q6.** What best captures the agent’s relation to harm?  
  - **Complicity:** The act ties you to others’ wrongdoing (e.g., buying gas funds oil execs).  
  - **Duty:** The act violates an obligation (e.g., to uphold ecological integrity).  
  - **Solidarity:** The act betrays allegiance (e.g., to vulnerable communities).  

  **Q7.** Is the core issue *participating in harm* or *failing to resist*?  
  - **PARTICIPATING:** → **Leaf: Complicity/Authorization View**  
    - *Awkward commitment:* Makes you blameworthy for *others’* acts (e.g., a voter "authorizing" all policies).  
  - **FAILING TO RESIST:** → **Q8.**  

  **Q8.** What is the remedy for collective harm?  
  - **Individual abstention:** → **Leaf: Expressive/Participatory View**  
    - *Awkward commitment:* Requires symbolic acts (e.g., veganism) even if they backfire (e.g., alienating allies).  
  - **Political action:** → **Leaf: Political-Obligation View**  
    - *Awkward commitment:* Demands activism over lifestyle changes (e.g., rallying > recycling).  

  ---  
  #### Leaves Summary (8 Positions):  
  1. **Expected-Impact Consequentialism** (Q3 → YES)  
  2. **Rule-Consequentialism** (Q3 → NO)  
  3. **Kantian Universalisability** (Q5 → YES)  
  4. **Virtue-Ethical View** (Q5 → NO)  
  5. **Complicity/Authorization View** (Q7 → PARTICIPATING)  
  6. **Expressive/Participatory View** (Q8 → Individual abstention)  
  7. **Political-Obligation View** (Q8 → Political action)  
  *(+ Rule-Consequentialism from Branch 1)*  

  #### Unresolved/Unseparated Leaves:  
  - **Complicity vs. Authorization:** The tree cannot split "complicity" (moral taint) from "authorization" (delegating power), as both answer Q7 identically. These are often blended.  
  - **Fair-Play Views:** Absent; they fit under "Duty" (Q6) but are rarely invoked for *unstructured* harms (e.g., climate change). Unoccupied due to unattractiveness: Why "play fair" if no cooperative scheme exists?  

  #### Unoccupied Combinations:  
  - **Constitutive + Non-Universalizable (Q2 → Constitutive; Q5 → NO):** Logically coherent but unexplored. Combines "the act *is* harm" with contextual ethics.  
  - **Threshold + Virtue Ethics (Q2 → Threshold; Q5 → NO):** Incoherent. Thresholds demand risk-calculation (consequentialist), clashing with virtue’s focus on character.  

  ---  
  ### Note on the Literature  
  **Settled:**  
  - No position "solves" the problem; all grapple with imperceptibility.  
  - Consequentialist approaches dominate policy discourse but face calculation challenges.  
  - Non-consequentialist views reject causal impact as morally decisive.  

  **Contested:**  
  - **Universalisability’s scope:** Can Kantianism handle collective harms without smuggling in consequences?  
  - **Complicity’s threshold:** When does an act become "complicit"? Is buying *any* gas blameworthy?  
  - **Individual vs. political:** Is personal abstinence ethically required, or a distraction from systemic change?  

  **No consensus exists.** Key divides include:  
  - Whether ethics should address *acts* or *practices*.  
  - Whether "difference-making" is necessary for blame.  
  - How to assign responsibility in unstructured collectives.  

  ---  
  **Tree Logic:** Nodes force distinct paths by testing *foundational commitments* (e.g., causal models, universalizability, remedy focus). Students answer via concrete descriptions, not labels. Positions are separated except where noted.
