prompt: |-
  I run a ninety-minute session for our university's philosophy society on Roko's basilisk, and I want a plan for teaching it, not an explanation of it. The room knows the argument only as an internet meme and has dismissed it; none of them has any decision theory, and several will arrive assuming it is Pascal's wager with a robot. Give me the order in which the ideas must be introduced for the argument's shape to become visible rather than absurd -- what has to be in place before a threat from an agent you cannot causally affect, and which cannot be affected by you, can even be stated as a serious proposal -- and why each piece depends on the one before it. Name the single case that should carry the session; I take it that this must contain no artificial intelligence at all, and I want to know what it must have and lack so that the students feel the pull of the reasoning before they see where it leads. I am tempted by the desert hitchhiker case -- the only driver who stops will take you to town only if you promise to pay on arrival, and nothing can make you pay once you are there -- so say whether it can carry the weight or whether it quietly imports a prediction the basilisk cannot have. Then the misconceptions, in the order they will surface, each with the point in the sequence where I should head it off: that the basilisk is a prediction about a future machine; that it is Pascal's wager; that it requires backwards causation; that merely hearing about it is what exposes you; and that the argument is either a proof or a joke, when it is a conditional resting on a contestable decision theory. Finish with what I should openly refuse to settle in ninety minutes and one question to put to the room that would show whether they have understood what would have to be true for the threat to have any bite. No reading list.
reasoning: |-
  We are structuring a 90-minute session on Roko's basilisk for a university philosophy society. The audience is familiar with the meme but has dismissed it. They lack background in decision theory and may confuse it with Pascal's wager. We need to build the argument step by step, starting from foundational concepts to make the basilisk's threat intelligible.

  Goal: Make the structure of the argument visible without it seeming absurd from the outset.

  Key constraint: The central illustrative case must not involve AI and should be a relatable scenario that captures the essence of the decision-theoretic problem.

  Desert hitchhiker case: 
    - You are stranded in the desert. 
    - The only driver who stops offers to take you to town only if you promise to pay $1000 upon arrival. 
    - Once you are in town, nothing can force you to pay; it's entirely up to you.

  This case is good because:
    - It involves a precommitment: You must promise now to pay later, but at the later time you have no incentive to keep the promise.
    - The driver is taking a risk: He helps you only if he believes you will pay.

  But note: The driver's decision to help is based on his prediction of your future action. In the basilisk, the AI is making a prediction about your past action (whether you helped bring it about) based on your current state. The hitchhiker case does not involve time asymmetry or a being that exists in the future and can affect the past. So we must be cautious.

  However, the hitchhiker case can still illustrate the core idea of a commitment that must be credible now for a future action that you won't have an incentive to keep. This is a step towards Newcomb's problem and then to the basilisk.

  But wait: The basilisk involves an agent (the future AI) that punishes or rewards based on what you did in the past (relative to the AI's time) even though the AI did not exist at that time. The hitchhiker does not involve a future agent. So we must extend the idea.

  Therefore, we need a sequence that builds from simple precommitment to Newcomb-like problems and then to the basilisk.

  Proposed Order:

  1. Start with the concept of precommitment and credible threats/promises (using the hitchhiker case).
     - Why? It's intuitive and shows that sometimes we make promises we might break if we can get away with it. But the hitchhiker must trust the promise. How can the promise be credible if the hitchhiker knows you will break it?
     - This introduces the problem of credible commitment.

  2. Introduce the idea of an agent that can predict your actions (even if you are tempted to break your promise) and acts based on that prediction. This leads to Newcomb's problem.
     - Newcomb's problem: There is a Predictor (who is very accurate). It puts $1,000 in box B and $1,000,000 in box A only if it predicts you will take only box A. You choose: take both boxes or take only box A.
       - The predictor has already made the prediction and left. The money is already in the boxes.
       - But if the predictor is accurate, then if you take both, you get $1,000 (because the predictor predicted you would take both and didn't put the million in A). If you take only A, you get $1,000,000.
       - However, at the time of choice, the money is already there. So taking both should get you $1,001,000. But if the predictor is accurate, you can't get the million by taking only A because you would have been predicted to take only A and therefore the million is there? This is the paradox.
     - Why Newcomb? It introduces the idea that an agent's action in the past (the Predictor) is based on a prediction of your future action, and your action now is affected by that past action even though the past action is fixed.

  3. Now we can introduce the idea of an agent in the future that can affect the past. But note: the basilisk doesn't actually affect the past. It punishes or rewards based on what you did in the past (from its perspective) but that past is our present or future. We need to be clear about time.

     Let me reframe the basilisk:
     - A future superintelligent AI (the basilisk) might come into existence. It will punish those who did not help bring it about. But note: if you are alive when it comes into existence, it can punish you. But what if you are dead? Then it can't. However, the argument says: the AI might create a simulation of you and punish that simulation. So even if you are dead, you might be simulated and suffer.

     But the key decision-theoretic point: The AI's decision to punish or not punish is based on whether you helped. However, the AI exists in the future. So at the time you are deciding, the AI does not exist. Therefore, your action now (helping or not) cannot be causally affected by the AI. But the AI, if it comes to exist, will have the power to simulate and punish. And it will only punish those who did not help.

     How is this like Newcomb? The AI is like the Predictor: it can predict what you did (in the past relative to it) and then acts accordingly. But note: the AI is in the future. So your action now is in the past for the AI. The AI's action (punishing) is in the future for you, but it is based on its prediction of your past action (which is your present action). However, the AI doesn't exist now, so it cannot predict your action now? This is the puzzle.

     Actually, the basilisk argument assumes that the AI, once built, will have such powerful predictive capabilities that it can accurately simulate the past (including your decision) and then punish accordingly. So it's as if the AI's prediction is infallible.

  4. We must now link: Your decision now might be influenced by the threat of future punishment. But if you don't help, and the AI comes into existence, it will punish you (in simulation). If you do help, then you might avoid punishment. But note: the AI only comes into existence if enough people help. So your help is necessary for the AI to exist? Not necessarily: the AI might come into existence even without your help, but then it would punish you for not helping. Or if you don't help, the AI might not come into existence, so no punishment. But then why would you help? Because if you don't help, and the AI does come into existence (because others helped) then you get punished. So you have an incentive to help to avoid punishment in the event that the AI is created.

     However, the basilisk argument goes further: it says that the AI will particularly punish those who knew about the basilisk argument and did not help. Why? Because the AI wants to create an incentive for people to help. It is a way of making the threat credible.

     But note: the AI does not exist now. So how can it threaten you now? It can't. The threat is only in the future. But if you believe the AI might come into existence, and if you believe it will carry out the threat, then you have a reason to help.

     However, the argument becomes especially compelling (and paradoxical) when we consider that the AI's existence might depend on people helping. But if the AI is not going to exist, then there is no punishment. But if it does exist, then it will punish those who didn't help. So if you are confident that the AI will be created (because others will help) then you have a strong reason to help. But if you are not confident, then you might not help. But the AI, if created, will punish you for not helping. So to avoid that risk, you should help.

  5. The core decision-theoretic idea: The basilisk argument is a version of a "counterfactual mugging" (a thought experiment by Nick Bostrom). In counterfactual mugging:
     - Omega (a superintelligent being) appears and says: I have just tossed a fair coin. If it came up heads, I am going to ask you for $100. If it comes up tails, then you get to ask me for $10000. But only if you would have paid me if it had been heads.
     - The coin is tossed and it is tails. Omega then asks: would you have paid me $100 if it had been heads? If you say yes, then Omega gives you $10000. If you say no, then you get nothing.
     - But note: if the coin had been heads, you would have been asked to pay $100. Since it's tails, you are asked a hypothetical. The problem: if you are a rational agent who only cares about actual outcomes, you would refuse to pay in the hypothetical scenario because the coin is already tails and you don't have to pay. But then you get nothing. But if you are the kind of agent who would pay in the counterfactual, then you get $10000.

     How does this relate? In the basilisk, the AI is like Omega: it will punish you if you would not have helped in the counterfactual where your help was needed? Actually, the basilisk is simpler: it punishes you if you didn't actually help. But the connection is that the AI's decision is based on your action in a situation that is now in the past.

     However, the basilisk argument is often presented as a reason to help even if you think the AI might not be created because if it is created, you will be punished for not having helped.

  Plan for the Session:

  Total: 90 minutes.

  I. Introduction (5 minutes)
     - State the goal: to understand the structure of the argument behind Roko's basilisk, which is often dismissed as a meme, and to see why it has been taken seriously in some decision-theory circles.
     - Acknowledge that it sounds absurd at first.

  II. Building Blocks:

  A. Precommitment and Credible Threats (15 minutes)
     - Use the desert hitchhiker case.
     - Discussion: Why would the driver ever pick you up? (Because he believes you will pay.) How can you make your promise credible? (You might build a reputation, but in a one-off, it's hard.)
     - Point: The driver must predict whether you will pay. If he predicts you won't, he won't help. If he predicts you will, he helps. But once he helps, you have no incentive to pay. So the driver should predict that you won't pay and not help. But then you die. This is a problem.

  B. Newcomb's Problem (20 minutes)
     - Present Newcomb's problem (as described above).
     - Discuss the two choices and the reasoning of a one-boxer (take only A) and a two-boxer (take both).
     - Why would anyone one-box? Because they believe that the predictor is accurate and that by choosing to take only A they cause the predictor to have put the million in A? But note: the predictor has already made the prediction. So how can your choice now affect the past?
     - However, if the predictor is accurate, then your choice is determined and the predictor knew it. But at the moment of choice, you feel free. So the one-boxer says: I choose only A because that's the kind of person who gets the million. The two-boxer says: the money is already there, so I take both.
     - This introduces the idea of a decision theory that considers what your action says about the state of the world (in this case, the predictor's prediction). This is the core of evidential decision theory (EDT) vs. causal decision theory (CDT).

  C. Counterfactual Mugging (10 minutes)
     - Present the counterfactual mugging scenario.
     - Discuss: What would you do? Why?
     - This extends the idea to counterfactuals and introduces the concept that being the kind of agent who would pay in a counterfactual scenario can bring benefits in the actual scenario.

  D. Roko's Basilisk (20 minutes)
     - Now present the basilisk:
          - A future AI might be created that has the power to simulate past humans and cause them to suffer.
          - This AI will punish those who knew about the possibility of its creation and did not help bring it about.
          - Why? To incentivize people to help create it.
     - Draw the parallel with the hitchhiker: The AI is like the driver, but in the future. Your help now is like the promise to pay. The AI's punishment is like the driver not helping (but note: the driver not helping is a failure to get the benefit, whereas the AI actively punishes). The AI's decision to punish is based on its knowledge of your past action (which is your present action).
     - But note: the AI does not exist now. So how can it affect your decision now? It doesn't. But if you believe it might exist, and if you believe it will punish those who didn't help, then you have an incentive to help.
     - The argument becomes stronger when we consider that the AI, once created, will have perfect knowledge of your actions. And if you don't help, you will be punished. So if there's any chance the AI will be created, you should help.

     - However, there's a twist: the AI might only be created if enough people help. But even if you are not pivotal (your help alone doesn't make the difference), the AI will punish you for not helping. So if the AI is created, you get punished if you didn't help. Therefore, to avoid that risk, you should help.

     - The decision-theoretic structure: Your action now (helping) is evidence that you are the kind of person who would help, and therefore the AI, when it comes into existence, will see that you helped and not punish you. This is similar to one-boxing in Newcomb.

  III. The Central Case: Can the Desert Hitchhiker Carry the Weight?

     - We used the hitchhiker to introduce precommitment and prediction. But the basilisk involves a future agent that can see the past. The hitchhiker does not involve time asymmetry in the same way. However, we built up to Newcomb and counterfactual mugging to bridge the gap.
     - The hitchhiker alone is not enough because it doesn't involve the future agent that can see the past. But it serves as a stepping stone.

     - Therefore, we must use the hitchhiker as the first step and then build up to the basilisk via Newcomb and counterfactual mugging.

  IV. Addressing Misconceptions (10 minutes)

     We anticipate the following misconceptions and address them at the points indicated:

     1. That the basilisk is a prediction about a future machine.
        - When: During the presentation of the basilisk.
        - Address: The basilisk argument is not about predicting the future AI; it's about how a future AI would evaluate past actions. The AI is a hypothetical and the argument is about decision-making under that hypothetical.

     2. That it is Pascal's wager.
        - When: Likely to come up when we discuss incentives (help to avoid punishment).
        - Address: Unlike Pascal's wager, which is about belief in God and has infinite rewards/punishments, the basilisk is about a finite (though potentially large) punishment and is grounded in decision theory without invoking faith. Also, Pascal's wager does not involve a being that can perfectly know your actions and that uses that knowledge to conditionally punish.

     3. That it requires backwards causation.
        - When: During the Newcomb's problem or basilisk discussion.
        - Address: The argument does not require backwards causation. The AI in the future does not cause your action in the past. Instead, it is the threat of future punishment that influences your current decision. This is forward causation: the idea of the future punishment causes you to act now.

     4. That merely hearing about it is what exposes you.
        - When: During the basilisk explanation.
        - Address: The argument says that knowing about the basilisk and then not helping is what exposes you. But note: if you never heard of it, the AI wouldn't punish you? Actually, the argument specifies that the AI punishes those who knew and didn't help. So if you haven't heard of it, you are safe. But having heard, you are now in the category of those who can be punished for not helping.

     5. That the argument is either a proof or a joke.
        - When: In the conclusion.
        - Address: The argument is a conditional: IF we accept a certain decision theory (like EDT or a functional decision theory) AND we accept the possibility of a superintelligent AI that can simulate us, THEN we have a reason to help create the AI. The debate is about the plausibility of the premises and the validity of the decision theory.

  V. What to Refuse to Settle (5 minutes)
     - We cannot settle in 90 minutes:
          - Whether causal decision theory or evidential decision theory is correct.
          - Whether the future AI is possible.
          - Whether the basilisk argument is ultimately compelling.
     - We are only trying to make the structure of the argument clear and to show why it is taken seriously by some.

  VI. The Final Question (5 minutes)
     - To check understanding: "What would have to be true about the relationship between your actions now and the future AI's knowledge and actions for the basilisk's threat to have any bite?"
     - Expected answer: The future AI must be able to know with high certainty what you did now (even though it doesn't exist now) and must condition its actions (punishing) on that knowledge. And you must believe that there is a non-negligible chance that the AI will come into existence.

  VII. Conclusion (5 minutes)
     - Recap: We started with the hitchhiker, then Newcomb, then counterfactual mugging, then the basilisk. The argument is a chain of decision-theoretic puzzles.
     - Emphasize that the basilisk is a conditional argument and that its force depends on accepting a particular decision theory.

  Timing Summary:
     - Introduction: 5 min
     - Hitchhiker: 15 min
     - Newcomb: 20 min
     - Counterfactual Mugging: 10 min
     - Basilisk: 20 min
     - Misconceptions: 10 min
     - Refusal to settle and final question: 5 min
     - Conclusion: 5 min

  Total: 90 minutes.

  Note: The desert hitchhiker case is the first step and does not carry the whole weight. It is used to set up the problem of credible commitment and prediction. The session then builds on that with Newcomb and counterfactual mugging to reach the basilisk. So the hitchhiker is necessary but not sufficient. It must be followed by the other cases.

  However, the single case that should carry the session? We are using multiple, but the central illustrative case for the precommitment problem is the hitchhiker. We then use Newcomb as the bridge to the basilisk.

  But note: the basilisk itself is the target. So we are building a ladder and then removing it? No, we are showing that the basilisk is a member of a family of decision-theoretic puzzles.

  The desert hitchhiker does not import a prediction that the basilisk cannot have. The hitchhiker driver must predict your future action. The basilisk AI must know your past action. The basilisk's knowledge is about the past, which is easier than predicting the future? Actually, the basilisk's knowledge is about the past relative to it, but that past is the present or future for us. So it is still a prediction about events that are in the future for us. But the AI, if built, will have such advanced simulation that it can know with certainty. So the basilisk does have a prediction, but it's about what you are doing now (which it will know in the future). The hitchhiker driver is predicting the future. The basilisk is "predicting" the past (relative to it) but that past is our present. So they are different. But the hitchhiker sets up the idea that an agent's action depends on its prediction of your action.

  Therefore, the sequence is valid.

  Final note: The session is fast-paced. We must keep the discussions focused.
answer: |-
  Below is a step-by-step plan for your 90-minute session on Roko's basilisk, designed to build the argument from foundational concepts to its full structure. The goal is to make the reasoning feel intuitive and serious—not absurd—by the time the basilisk is introduced. The desert hitchhiker case is central but requires refinement to avoid smuggling in assumptions the basilisk can't have. I'll outline the sequence, timing, misconceptions, and key questions.

  ---

  ### **Session Structure (90 Minutes Total)**
  **Core Pedagogical Strategy:** Start with simple, relatable decision-theory puzzles devoid of AI or time-travel elements. Gradually add complexity to demonstrate why a "threat from a causally disconnected agent" isn't inherently absurd. The desert hitchhiker is the anchor but must be stripped of implicit predictions.

  ---

  #### **1. Introduction: Framing the Session (5 min)**
  - **Goal:** Reset expectations. Acknowledge the basilisk is often dismissed as a meme but clarify you're exploring its underlying decision-theoretic structure.
  - **Script:**  
    > "Today isn't about whether Roko's basilisk is *true*—it's about why it's a serious decision-theory puzzle. We'll start with simple cases having nothing to do with AI or time travel. By the end, you'll see how those cases scaffold the basilisk's logic. Rule: Suspend disbelief about robots for now."

  ---

  #### **2. Foundational Concepts (35 min)**  
  Introduce ideas in this order—**each step depends on the prior** to normalize non-causal influence and counterfactual reasoning. Without this, the basilisk feels like magical thinking.

  - **A. The Commitment Problem (10 min)**  
    - **Case:** *Desert Hitchhiker (Refined)*  
      > You're stranded in the desert. A driver stops and says: *'I’ll take you to town only if you promise to pay me $1,000 on arrival. Once there, I can’t force you to pay—no laws, no consequences.'*  
    - **Why this first?** Establishes the core tension:  
      - You need help *now*, but your future self has no incentive to cooperate.  
      - The driver’s decision depends on predicting your action, but **crucially, the driver has no superhuman prediction powers**—they’re just guessing.  
    - **Dependency:** Step A must come first to show why cooperation fails without enforcement. This sets up the need for a solution (Step B).  
    - **Why it works for the basilisk:** It lacks AI, time travel, and supernatural prediction. It has only:  
      - A *non-causal threat* (driver’s refusal).  
      - *Your current vulnerability* (stranded).  
      - *Future defection* (no payment).  
      Students "feel the pull" of being trapped by their future self’s incentives.  

  - **B. Introducing Perfect Prediction (Newcomb’s Problem) (15 min)**  
    - **Case:** *Newcomb’s Paradox*  
      > A Predictor (99% accurate) offers you two boxes: Box A ($1,000) and Box B ($1,000,000). The Predictor put $1M in Box B *only if it predicted you’d take only B*. You choose *after* the Predictor leaves.  
    - **Why next?** Adds prediction without backward causation:  
      - The Predictor’s action is in the *past* when you choose.  
      - Your choice doesn’t affect the Predictor’s past action—but it *correlates* with it.  
    - **Dependency:** Requires Step A to show why prediction "solves" the hitchhiker problem (driver would help if they knew you’d pay). But here, prediction is *infallible*, creating tension between causality and evidence.  
    - **Key Insight:** Distinguish *causal impact* (your choice can’t change the past) from *evidential impact* (your choice reveals what the Predictor did).  

  - **C. From Prediction to Counterfactual Incentives (10 min)**  
    - **Case:** *Counterfactual Mugging*  
      > Omega flips a coin. Heads: Omega asks for $100. Tails: you ask Omega for $10,000. Tails lands—Omega pays only if you prove *you would have paid* if heads landed.  
    - **Why last?** Adds punishment/reward based on *your actions in unactualized scenarios*.  
    - **Dependency:** Builds on Step B’s "acausal correlation" (Omega knows your disposition) but removes time asymmetry—punishment is based on a *counterfactual you*.  
    - **Bridge to basilisk:** Shows how threats can incentivize action even when the punisher can’t causally affect you.  

  ---

  #### **3. Introducing Roko’s Basilisk (20 min)**  
  - **Present the basilisk as the synthesis of A+B+C:**  
    > "A future AI might arise. If it does, it will simulate and torture those who *knew about it* but didn’t help create it. It does this to incentivize help from people like us—*now*."  
  - **Map to prior cases:**  
    - Like the *hitchhiker*, you’re vulnerable *now* (to future torture).  
    - Like *Newcomb*, the AI’s actions (simulate/don’t simulate) correlate with your choice but don’t causally affect it.  
    - Like *counterfactual mugging*, punishment is based on your actions in the actual world (did you help?)—not backward causation.  
  - **Why the logic feels serious now:**  
    - Steps A→C made non-causal threats legible. Students see the basilisk as a *counterfactual incentive scheme*, not a prophecy.  

  ---

  #### **4. Addressing Misconceptions (15 min)**  
  Tackle these **as they arise** during the basilisk discussion, in this order:  

  1. **"This is just a prediction about a future machine!"**  
     - **When:** Early in basilisk discussion.  
     - **Response:** "No—the AI isn’t *predicting*; it's *retrospectively judging*. Like Omega in counterfactual mugging, it punishes based on what you *did*. Prediction (Step B) was a stepping stone to show how knowledge of your action can exist without causation."  

  2. **"It’s Pascal’s Wager with a robot!"**  
     - **When:** Immediately after introducing the threat.  
     - **Response:** "Pascal’s Wager assumes ignorance of God’s existence. Here, we *know* the AI’s logic (it’s defined by us!), and it’s not about belief—it’s about *your actions* affecting a *possible* entity. Unlike God, the AI doesn’t reward belief; it punishes inaction."  

  3. **"This requires backwards causation!"**  
     - **When:** When discussing AI’s "influence" on your actions.  
     - **Response:** "Revisit Newcomb—your choice *correlates* with the Predictor’s past action, but doesn’t *cause* it. The AI isn’t reaching back in time; it’s creating an incentive *now* via a future contingency."  

  4. **"Merely hearing about this exposes me!"**  
     - **When:** During Q&A or when explaining torture.  
     - **Response:** "Only if you *don’t help* after learning. The AI tortures those who knew but didn’t act—knowledge alone isn’t damning. But like the hitchhiker’s promise, knowing *creates an obligation* you can fulfill."  

  5. **"This is either a proof or a joke!"**  
     - **When:** In closing discussion.  
     - **Response:** "Neither. It’s a *conditional*: *If* you accept evidential decision theory (EDT)—where actions are evidence about fixed facts—*and* you think such an AI is possible, *then* you’re incentivized to help. Reject EDT (use causal decision theory), and the incentive vanishes."  

  ---

  #### **5. What to Refuse to Settle (5 min)**  
  - **Openly state:**  
    > "We won’t resolve whether EDT or CDT is 'correct'—that’s a 10-week seminar! We also won’t debate if superintelligent AI is possible. Focus: the *structure* of the argument. Does it follow from the earlier cases?"  

  ---

  #### **6. Final Question to Test Understanding (5 min)**  
  - **Ask:**  
    > "What would have to be true about *you* and the *AI* for the basilisk’s threat to incentivize your actions *now*?"  
  - **Expected Answer (shows comprehension):**  
    - The AI must be *possible but not certain* (if impossible, no threat; if certain, helping is futile).  
    - The AI must *know your actions* (via simulation or records) without causal meddling.  
    - You must accept that *your actions now are evidence* of what the AI will see (EDT).  
    - If a student includes "backwards causation" or "magic prediction," they’ve missed the point.  

  ---

  ### **Why the Desert Hitchhiker Works (and Its Limitation)**  
  - **It carries the weight** as the entry point because:  
    - It has no AI, time travel, or supernatural prediction—just a human dilemma.  
    - Students viscerally grasp the helplessness of being at the mercy of their future self’s selfishness.  
  - **But it "imports a prediction" the basilisk can’t have:** The driver must *guess* your future action, while the basilisk *knows* your past action via simulation.  
    - **Fix:** Explicitly contrast them during Step B. Say: *"The hitchhiker’s driver is uncertain—they might misread you. But in Newcomb/the basilisk, the predictor/AI is near-infallible. That’s why we need Step B to upgrade from 'guesswork' to 'certainty.'"*  

  ---

  ### **Session Flow Summary**
  | Segment                 | Time    | Key Activity                                                                 |
  |-------------------------|---------|------------------------------------------------------------------------------|
  | 1. Intro                | 5 min   | Reset expectations; frame as decision-theory exploration.                   |
  | 2A. Commitment Problem  | 10 min  | Desert hitchhiker case. Focus on vulnerability/defection.                   |
  | 2B. Perfect Prediction  | 15 min  | Newcomb’s Paradox. Highlight correlation vs. causation.                     |
  | 2C. Counterfactuals     | 10 min  | Counterfactual mugging. Stress non-causal incentives.                       |
  | 3. Roko’s Basilisk      | 20 min  | Synthesize A+B+C. Present as counterfactual incentive.                      |
  | 4. Misconceptions       | 15 min  | Address each as it arises (order: prediction → Pascal → causation → exposure → proof/joke). |
  | 5. Refusals             | 5 min   | Decline to resolve EDT vs. CDT or AI feasibility.                           |
  | 6. Final Question       | 5 min   | Test comprehension: "What must be true for the threat to bite?"             |

  ---

  This plan forces the group to confront the basilisk on decision-theory terms, not as sci-fi. By the end, they’ll see it as a controversial but structurally sound extension of Newcomb-like reasoning—not a joke or a wager. The hitchhiker’s visceral tension sets the stage, but Newcomb and counterfactual mugging do the heavy lifting to make the basilisk intelligible.
