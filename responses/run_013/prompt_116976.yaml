prompt: |-
  I'm in a fourth-year bioethics seminar (14 of us, mixed — about half pre-med, half philosophy) and I've been assigned to run one 90-minute session on how we decide when someone is dead. I want to do an activity, not a lecture, and here's my idea: we're a hospital committee drafting the protocol for organ donation after circulatory death, and the protocol uses one of these newer machines. After the heart stops and death has been declared, the surgical team puts the body on a pump that sends oxygenated blood back into the chest and abdomen so the organs don't spoil, and sometimes the heart starts beating again in there. They block off the vessels going to the head so none of it reaches the brain.

  Give me the rules, roles, materials, a timeline, and a debrief. What I most want them to run into is that writing the protocol forces them to pick a criterion of death without noticing they're picking one: whether you're dead when you can't come back, or dead when we've decided not to try to bring you back. So make them commit to the specifics — how long we stand there doing nothing before we call it, whether restarting circulation counts as resuscitation, what we do if the heart kicks back in, whether we can still take organs from a body whose heart is going again, and how that squares with the rule that we only take organs from someone who's already dead. Then in the debrief show them that the answers they wrote only hang together on one of those two readings and not the other, and that the old protocol they inherited assumed the other one.

  Also tell me what'll predictably go wrong the first time I run it — I'm expecting the pre-meds to just defer to whatever the guidelines say and the philosophers to jump straight to personhood stuff, and I don't know how to stop that from happening. And be honest about what the activity can't do: what I'll still have to say myself at the end, and what about the real thing it definately can't reproduce. No citations needed, obviously.
reasoning: |-
  Okay, the user is preparing a bioethics seminar session for a mixed group of pre-med and philosophy students. They want an interactive activity simulating a hospital committee drafting a protocol for organ donation after circulatory death (DCD) using newer perfusion machines. The core challenge is making students confront the implicit choice between two definitions of death without realizing it initially.

  Hmm, the user's key insight is brilliant - they want students to discover that technical protocol decisions (wait time, handling auto-resuscitation) force an ontological stance: irreversible cessation vs. irrevocable decision to stop treating. The activity must make this revelation feel earned, not lectured.

  I notice two potential pitfalls: pre-meds might default to clinical guidelines without questioning assumptions, while philosophers might leap to abstract personhood debates. Need containment strategies. Also must acknowledge what the simulation can't capture - like real-time pressure in ORs or family emotions.

  For structure: First, establish roles that play to each group's strengths but force cross-talk. The neurologist can push biological irreversibility while the ethicist questions normative foundations. Materials should include deliberately vague legacy protocols and stark perfusion machine specs.

  The timeline should build tension: initial technical discussion, sudden "auto-resuscitation" scenario to trigger crisis, then rushed revisions. Debrief questions must explicitly connect operational choices to philosophical underpinnings - "When you chose 10-minute wait, which definition were you assuming?"

  Biggest challenge: preventing early abstraction. Solution? Load the scenario with urgent practical constraints (organ viability clocks ticking) and role-specific stakes (transplant coordinator needing usable organs vs. chaplain concerned about public trust).

  What this can't do: simulate true emotional weight of declaring death. I'll suggest the user ends by sharing real cases where these definitions caused controversy - like cases where families objected to perfusion after cardiac death. The takeaway should be that all protocols embed ethical assumptions disguised as technicalities.
answer: |-
  Here’s a structured plan for your 90-minute activity, designed to force the confrontation between "irreversible cessation" and "irrevocable decision" definitions of death. Includes troubleshooting and limitations:

  ---

  ### **Activity Title**: *"Pulse Paradox: Drafting a DCD Protocol with NRP"*  
  **(Donation after Circulatory Death using Normothermic Regional Perfusion)**

  ---

  ### **Goal**  
  Force students to embed a **criterion of death** in technical protocol decisions, then reveal how their choices align with one philosophical definition while conflicting with the other.

  ---

  ### **Rules & Roles**  
  *(Assign roles 1 week in advance with briefing sheets)*  
  | Role                | Responsibilities                                                                                                | Assigned To              |
  |---------------------|----------------------------------------------------------------------------------------------------------------|--------------------------|
  | **Chair (ICU Director)**     | Keep debate focused, enforce time, draft final protocol.                                                        | Strong facilitator       |
  | **Transplant Surgeon**       | Push for organ viability. "If NRP restarts circulation, organs are salvageable—but we need speed."               | Pre-med                  |
  | **Critical Care Physician**  | Defend clinical safety: "What if the heart restarts? We declared death—now what?"                               | Pre-med                  |
  | **Hospital Ethicist**        | Question coherence: "Does restarting circulation invalidate the death determination?"                           | Philosophy               |
  | **Neurologist**              | "Brain activity ceases within 60-120s after circulatory stop. Irreversibility is key."                         | Pre-med/Philosophy hybrid|
  | **Family Advocate**          | "Will families trust us if hearts restart? What does 'dead’ mean to the public?"                                | Philosophy               |
  | **Organ Procurement Rep**    | "NRP gives us 2x more viable organs. But we must follow the Dead Donor Rule."                                   | Pre-med                  |

  ---

  ### **Materials**  
  1. **Handout 1**: *"Legacy DCD Protocol"*  
     - "Death declared after 5 mins of asystole. No interventions after declaration."  
  2. **Handout 2**: *"NRP Machine Specs"**  
     - "Pumps oxygenated blood to torso/abdomen. Cerebral circulation blocked. 15% incidence of cardiac auto-resuscitation."  
  3. **Worksheet**: *"Protocol Draft"* with blank fields:  
     - **Wait time**: _____ mins of asystole before death declaration  
     - **If heart restarts during NRP**: ☐ Stop NRP ☐ Continue NRP ☐ Other: ______  
     - **Organs permissible for donation if heart restarts**: ☐ Yes ☐ No  
     - **Justification for death determination**: _________________________  
  4. Sticky notes, timer, whiteboard.

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro (5 min)**:  
     - *"You are the DCD Committee at Mercy Hospital. Update our protocol to use NRP machines. Adhere to the Dead Donor Rule: organs only from dead donors."*  

  2. **Phase 1: Technical Debate (25 min)**  
     - Groups debate **Handout 1 vs. Handout 2**. Focus: *"How do we minimize organ damage while ensuring ethical compliance?"*  
     - **Force specific choices**: Vote on worksheet fields. No ambiguity allowed.  

  3. **Phase 2: Crisis Scenario (15 min)**  
     - Drop this: *"First NRP case: After 8 mins, cardiac activity resumes during perfusion. Family is in waiting room. What do you do?"*  
     - Forces confrontation: Their protocol must address this *now*.  

  4. **Phase 3: Protocol Finalization (15 min)**  
     - Chair consolidates votes into one draft protocol. Display key decisions publicly.  

  5. **Debrief (30 min)**:
     - **Q1**: *"What criterion of death is embedded in your wait time?"*  
       - *If they chose 5 mins*: "Is circulation irreversibly stopped? What if it reverses at 6 mins?"  
       - *If 10 mins*: "Are you waiting for irreversibility—or making a decision not to reverse it?"  
     - **Q2**: *"If the heart restarts during NRP, why did you choose to continue/stop?"*  
       - Link to: **"Irreversible" vs. "We won’t reverse"**.  
     - **Reveal the Trap**:  
       - *"Your protocol assumes:*  
         - **A (Irreversible)**: If you stop NRP when the heart restarts, you treat reversibility as invalidating death.  
         - **B (Irrevocable)**: If you continue NRP, ‘death’ is based on your choice not to restore function—even if you *could*."  
       - *"The old 5-min protocol assumed A. Your NRP choices likely align with B."*  

  ---

  ### **Predictable Problems & Fixes**  
  - **Pre-meds defer to guidelines**:  
    - **Fix**: Give *conflicting* guidelines. Handout 1 says "5 mins", but Handout 2 notes "NRP may invalidate traditional criteria". No safe default.  
  - **Philosophers jump to personhood**:  
    - **Fix**: Roles constrain them. The **Family Advocate** can voice public perception, but the **Chair** stops abstract debates: *"We need a clinical protocol by 3 PM today."*  
  - **Group avoids conflict**:  
    - **Fix**: The **Crisis Scenario** forces disagreement. The Transplant Surgeon *must* argue to continue NRP; the Ethicist *must* challenge.  
  - **Time management**:  
    - **Fix**: Use a visible timer. Chair has authority to cut off circular debates.  

  ---

  ### **What the Activity Can’t Do**  
  1. **Simulate real-world pressure**:  
     - *You’ll need to say*: "In reality, this debate happens while a body is on the table and organs are deteriorating. Moral distress is high."  
  2. **Capture legal/financial stakes**:  
     - *Add during debrief*: "Hospitals risk lawsuits if death criteria are contested. Organ networks may decertify you."  
  3. **Resolve the philosophy**:  
     - *Conclude with*: "No protocol is neutral. You chose a definition of death by operationalizing it. The ‘correct’ answer depends on whether you prioritize biological reality or pragmatic resource allocation."  
  4. **Address consciousness**:  
     - *Note*: NRP blocks cerebral flow, but you can’t prove absence of cortical activity without EEG. *Point out*: "Your protocol likely assumes brain death via circulatory criteria—but is that sufficient?"  

  ---

  ### **Why This Works**  
  Students will leave seeing that:  
  - **Death is a constructed category** embedded in time intervals and machinery.  
  - **The Dead Donor Rule is strained** by technology that blurs life/death boundaries.  
  - **"Science" doesn’t resolve ethics**—it creates new dilemmas.  

  **Final Tip**: Assign the most opinionated students as Transplant Surgeon vs. Ethicist. Conflict is your ally.
