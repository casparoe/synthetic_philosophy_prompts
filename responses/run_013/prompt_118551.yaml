prompt: |-
  I chair my institute's biosafety advisory panel, and I need the written decision we will adopt when we meet on the 14th. The case before us forces the panel to say, on the record, whether a particular chemical system is alive, and our own policy gives us no way to dodge the question. The trial it concerns is scheduled to begin early next month, so we cannot defer.

  The system. A synthetic-biology group has built what it calls a protocell platform: microscopic fatty-acid vesicles, each enclosing a small network of non-genetic reactions. Fed continuously with a simple ester fuel and lipid precursors, the vesicles take up material, swell, and — when the reactor's stirring deforms them past a threshold — pinch in two. Nothing inside the vesicle copies a template. What passes to the next generation is the composition of the membrane and of the internal reaction network, which biases how quickly the daughter grows; when the group re-seeds a well-mixed reactor with its fastest-growing vesicles, growth rates rise over successive rounds, so the bias is real and cumulative rather than an artifact of where a vesicle happens to sit. Starve the system and it lyses within hours; keep feeding it and it runs indefinitely. The group now wants to move the platform out of a sealed bioreactor and into a semi-open greenhouse trial that vents to the outside, and has asked us to classify it.

  Our policy. Level 2 containment applies to living organisms. Level 1 applies to non-living chemical systems, however complex. Our operative definition of a living organism is a chemical system that maintains itself far from equilibrium and is capable of Darwinian evolution. The group argues that its platform is non-living on three grounds: there is no replication of a template, so no genuine heredity; division is driven by our stirrer rather than by the system itself; and the system cannot feed itself but depends on fuel we supply. Two panel members disagree with the group, and one of them has asked, in writing, whether a finding of "non-living" would mean that any sufficiently ingenious autocatalytic chemistry could escape Level 2 merely by being built one criterion short of the definition.

  Precedent. Two years ago we classified a self-replicating RNA construct as Level 2 without much discussion. Last year we classified a prion preparation as Level 1, on the ground that it propagates a conformation without maintaining itself.

  I am not asking for a treatise on the nature of life; I need something the panel can vote on and the lab can live with. Please draft the decision: the classification we should adopt, the criterion that drives it, how that criterion handles each of the group's three arguments, why the two precedents do and do not bear on this case, and the strongest case for the opposite classification together with why we should not follow it. Write it so that the lab, which will almost certainly appeal, and the funder, which wants a rule it can apply to the next case without reconvening us, both find it usable. A recommendation with conditions and a date by which they must be met is acceptable — and probably preferable, if that is where the reasoning lands.
reasoning: |-
  Hmm, the user chairs a biosafety advisory panel that needs to make a critical classification decision about a synthetic biology system. They describe a "protocell platform" - fatty-acid vesicles containing non-genetic reaction networks that grow, divide when mechanically agitated, and show cumulative growth rate increases over generations when selected. The system requires continuous fuel input and lacks template replication.

  The panel must determine whether this qualifies as a "living organism" under their policy, which defines life as maintaining far-from-equilibrium state with Darwinian evolution capability. The research group argues it's non-living due to: no template replication (no heredity), externally-driven division, and dependency on supplied fuel. However, two panel members disagree and raise concerns about setting a precedent where deliberately deficient systems could bypass containment.

  Relevant precedents include classifying a self-replicating RNA system as Level 2 (living) and a prion preparation as Level 1 (non-living). The user needs a draft decision that addresses all arguments, reconciles precedents, and provides clear reasoning for both the lab (who may appeal) and funders (who want consistent rules).

  Key considerations:
  - The system demonstrates cumulative adaptation through selection ("Darwinian evolution" element)
  - But lacks key life features like autonomous replication and metabolic independence
  - Precedents highlight that self-replication with heritable information (RNA) warrants containment, while conformational propagation without self-maintenance (prions) does not
  - The mechanical division dependency is particularly problematic for claiming autonomy

  The decision should probably classify this as Level 1 with conditions, acknowledging its evolutionary capacity while emphasizing its critical limitations compared to true organisms. This balances containment needs with scientific progress, and provides testable conditions for any future reclassification.
answer: |-
  ## Biosafety Advisory Panel Decision: Classification of Vesicular Protocell Platform  
  *Adopted 14 [Month], [Year]*  

  **Classification:** The panel classifies the described vesicular protocell platform as **Containment Level 1 (CL1)**. This classification applies *only* to the specific system described herein, under the conditions specified below.  

  **Driving Criterion:** The system fails to meet the panel’s operative definition of a "living organism" (a chemical system that maintains itself far from equilibrium *and* is capable of Darwinian evolution) because it lacks **autonomous capacity for open-ended evolution via heritable variation**. While the system exhibits elements of selection and cumulative change, it does not possess the necessary features for indefinite evolutionary potential without direct human intervention.  

  ### Response to the Group’s Arguments  
  1.  **"No template replication, so no genuine heredity":**  
      **Panel Response:** Agreed. Heredity requires faithful transmission of *information* that dictates function. Here, compositional bias transmits only statistical propensities (e.g., faster growth rates), not discrete, mutable units of information. Daughter vesicles inherit a *state*, not an *instruction set* subject to mutation and selection for novel functions. This limits evolutionary scope to pre-existing parameter optimizations.  

  2.  **"Division driven by external stirrer, not self-generated":**  
      **Panel Response:** Conclusive. Autonomous propagation is a core feature of living systems. This system’s dependence on externally applied mechanical shear for division is a critical lack of agency. It cannot control its replication timing, location, or trigger based on internal state or environmental cues.  

  3.  **"No self-feeding; depends on supplied fuel/precursors":**  
      **Panel Response:** Significant, though not solely determinative. While many living systems require external nutrients, they actively regulate uptake and metabolism. This system lacks internal metabolic regulation or feedback loops enabling autonomous resource acquisition or energy transformation beyond passive diffusion governed by concentration gradients.  

  ### Precedents  
  1.  **Self-Replicating RNA (CL2):**  
      *Bears directly* as it demonstrated key features absent here:  
      *   **Template-Based Heredity:** RNA sequence provided inheritable, mutable information.  
      *   **Autonomous Replication:** Catalysis drove template copying *without* external mechanical intervention.  
      *   **Open-Ended Potential:** Sequence mutations could generate novel functions indefinitely.  

  2.  **Prion Preparation (CL1):**  
      *Does not bear directly* but reinforces our reasoning. Prions propagate conformation but:  
      *   Lack self-maintenance (far-from-equilibrium requires host machinery).  
      *   Lack any heritable variation or response to selection independent of the host.  
      *   **Relevance:** Confirms that propagation alone, without autonomous evolution, is insufficient for CL2. This system, while more complex than prions, shares the critical lack of autonomous evolutionary machinery.  

  ### The Case for Level 2 (and Why We Reject It)  
  **Strongest Case for CL2:** The system demonstrably maintains itself far from equilibrium (requiring continuous energy input) and undergoes cumulative, selection-driven changes in growth rate across generations. This exhibits a key pillar of Darwinian evolution – descent with modification under selection pressure – suggesting potential for unforeseen adaptation in a novel environment like a greenhouse.  

  **Reasons for Rejection:**  
  1.  **Limited Evolutionary Mechanism:** Selection acts only on existing compositional biases affecting growth *rate*, not enabling the emergence of fundamentally new functions or information. It lacks the mutability and combinatorial potential of genetic systems.  
  2.  **Lack of Autonomy:** Crucially, replication initiation is externally controlled (stirrer), and metabolic inputs are entirely externally supplied and regulated. It cannot initiate reproduction or seek resources independently.  
  3.  **Precedent Alignment:** Granting CL2 based on cumulative parameter optimization alone, without template heredity or autonomous replication, would fundamentally lower the bar established by the RNA precedent and create inconsistency with the prion rationale. This could incentivize "definitional dodges."  

  ### Conditions for CL1 Classification and Pathway for Reclassification  
  While classified as CL1, the panel imposes **mandatory conditions** for the proposed greenhouse trial due to the demonstrated potential for cumulative change:  

  1.  **Physical Containment:** Secondary containment (e.g., sealed growth chambers within the greenhouse) must prevent uncontrolled dispersal of vesicles. Air vents require HEPA filtration.  
  2.  **Nutrient Control:** The fuel and lipid precursor feed system must incorporate an automatic shutoff triggered by any containment breach sensor (e.g., pressure loss, particulate monitor).  
  3.  **Vesicle Monitoring:** Weekly sampling and measurement of vesicle growth rates within the trial must be performed. Any statistically significant acceleration *beyond* that observed in the final round of lab selection *must* trigger immediate suspension of the trial and re-notification of the panel.  
  4.  **Termination Protocol:** A validated chemical or enzymatic lysis protocol must be on standby and immediately deployable to terminate the system in case of procedural failure or unexpected behavior.  

  **Reclassification Trigger:** Should the research group develop a system incorporating either **(a) template-based information transfer** (even non-genetic) *or* **(b) autonomous, self-triggered division** based on internal state, the system *must* be immediately resubmitted for classification review, likely leading to CL2.  

  **Date for Condition Compliance:** The research group must provide documented verification of Conditions 1-4 to the panel chair **no later than 21 [Month], [Year]**. The trial may not commence prior to written confirmation of compliance from the chair.  

  ### Rationale for Usability  
  *   **For the Lab (Appeal):** Clearly addresses each scientific argument, cites precedent distinctions, and provides a pathway (autonomous division/template heredity) for achieving their goals under CL2. Conditions are specific, measurable, and focused on the identified novel risk (cumulative change).  
  *   **For the Funder (Future Cases):** Establishes a bright-line rule: **Autonomous capacity for open-ended evolution via heritable variation is required for CL2.** Precedents are reconciled under this principle. Future systems will be assessed on the presence/absence of:  
      *   Inheritable, mutable information units (template or equivalent).  
      *   Self-initiated replication/division capability.  
      *   Capacity to generate novelty beyond parameter optimization.  
      Dependence on supplied nutrients alone is insufficient for CL2; lack of autonomous replication is determinative against life.  

  **Vote:** Adopted by Majority Vote of the Biosafety Advisory Panel on 14 [Month], [Year].  

