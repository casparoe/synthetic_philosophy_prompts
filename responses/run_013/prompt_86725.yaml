prompt: |-
  I am a doctoral student in philosophy, working on the foundations of computer science, and I have been sitting in on a course in computational complexity while also maintaining a small scheduling tool for my research group, which is how the following question arose. The tool solves a combinatorial problem — I will not belabor the details; it involves fitting tasks into slots subject to a budget — and the algorithm I wrote for it is, on every input my users actually produce, effectively instantaneous: its running time scales with the magnitudes of the numbers appearing in the input rather than with how many numbers there are, and since those magnitudes are never enormous, it never bogs down. A friend who works in complexity theory pointed out that, strictly speaking, the algorithm is exponential, because the numbers are written in binary and the running time is exponential in the number of digits; had the same problem been posed with the numbers written in unary, the very same procedure would count as a polynomial algorithm. I follow the mechanics of the point, but it seems to expose something larger than a technicality: the same algorithm is excellent by every practical measure and poor by the official one, and what separates the two verdicts is not the problem or the algorithm but how the input is written down. Since then I have noticed the mirror image — problems whose best algorithms are provably polynomial in the length of the input, yet so heavy in their constant factors that nobody would ever run them — and I have begun to suspect that "hard" and "efficient" are doing two different jobs in these conversations, one of them relative to a chosen encoding and the other relative to what can actually be computed.

  What I would like to know is whether there is an established name for the specific situation I first described — an algorithm that is polynomial in the values appearing in its input but not in the length of that input, so that its standing as a "good" algorithm depends entirely on how the numbers are represented — and, if so, precisely what that concept covers and what it excludes. I am just as interested in the broader pattern: is there a settled way of marking the difference between a hardness result that survives any reasonable encoding and one that is an artifact of writing the input in binary rather than in unary? I have a vague sense that complexity theorists have vocabulary here — that some hardness results are described as more robust than others — but I cannot reconstruct the terms, nor tell whether they name a formal notion, a family of results, or merely a habit of speech. In particular I would want to know whether the distinction attaches to problems, to encodings, or to the relation between the two, and whether it has a definition sharp enough to settle borderline cases.

  Please do not simply supply a label. What I am after is the carving: what the phenomenon is, what it is not, how it differs from ordinary worst-case hardness and from the general gap between theoretical and practical efficiency, and where its edges lie. If some part of what I have described has no established concept, say so plainly and propose the term and definition you think it needs.
reasoning: |-
  Okay, let me unpack this fascinating question from the philosophy doctoral student. They're grappling with a core tension in complexity theory: how the same algorithm can be practically efficient yet theoretically inefficient depending solely on input encoding. The concrete example is their scheduling tool where runtime scales with numeric values rather than input length - efficient in practice but exponential in binary encoding.

  Hmm, the heart of their concern seems to be about robustness. They've noticed that some hardness results feel "real" while others disappear if you change representations. I recall that complexity theory does have frameworks for this, particularly pseudopolynomial time for numeric problems. But I need to be precise here - pseudopolynomial specifically applies when runtime is polynomial in numeric value but exponential in digit length.

  Wait, there's more. They're also asking about the mirror image - theoretically efficient algorithms that are impractical. That's different though, more about constant factors. For their main case, the key is distinguishing between input magnitude versus input size. The example with unary versus binary encoding perfectly illustrates how representation affects complexity classification.

  I should clarify the boundaries. Pseudopolynomial algorithms aren't just about any representation issue - they specifically deal with numeric inputs where magnitude matters. It's different from general encoding tricks because numbers have an intrinsic quantitative meaning. The robustness question is deeper though. Some problems remain hard even in unary - that's strong NP-hardness. But for their scheduling problem, switching to unary would make it polynomial.

  The philosophical angle is intriguing. They're right that "efficient" means different things in theory versus practice here. Complexity theory's focus on input size as bit length is a modeling choice, not absolute truth. For practical purposes, when numbers are small, magnitude-scaling algorithms work fine. But the theoretical classification still matters because if numbers can be large, it blows up.

  I should emphasize that this isn't just about worst-case analysis. Even average-case could suffer if large numbers appear. The core distinction is between problems where hardness comes from arithmetic (encoding-sensitive) versus combinatorial structure (encoding-robust). Their scheduling problem seems to be in the first category.
answer: |-
  Your inquiry cuts to a philosophical tension at the heart of complexity theory: the gap between formal definitions of "efficiency" and practical computability. The phenomenon you describe is not merely a technicality but reveals how complexity classifications depend on encoding conventions. Below is a structured analysis of the concepts, their boundaries, and the broader implications.

  ### 1. **Your Algorithm's Specific Case: Pseudopolynomial Time**
     - **Established Concept**: Your algorithm is **pseudopolynomial**. This term applies when:
       - The input contains integers.
       - The running time is polynomial *in the numeric values* of those integers (e.g., polynomial in the number \(n\) itself).
       - But exponential *in the representation size* (e.g., binary encoding length \(\log n\)).
     - **What It Covers**:
       - Problems where the "size" of numbers matters (e.g., knapsack, subset sum, scheduling with budgets).
       - Algorithms efficient only if numbers are bounded (e.g., dynamic programming with table size proportional to numeric values).
     - **What It Excludes**:
       - Problems without numeric inputs (e.g., graph connectivity).
       - Algorithms polynomial in the *bit length* of numbers (truly polynomial).
       - Problems where large numbers are intrinsic (e.g., cryptography).

     **Why "Pseudopolynomial" Fits**:  
     Your scheduling tool is efficient because numeric values (budgets, task sizes) are small. If inputs allowed astronomic numbers (e.g., \(2^{1000}\)), efficiency would collapse. This contrasts with *strongly polynomial* algorithms (e.g., Dijkstra's algorithm), whose runtime depends only on the *number* of inputs, not their magnitudes.

  ---

  ### 2. **The Broader Pattern: Robustness of Hardness**
     Complexity theory distinguishes between **encoding-dependent** and **encoding-agnostic** hardness. The key framework is:

     - **Strong NP-Hardness** (or **Unary NP-Hardness**):
       - A problem is strongly NP-hard if it remains NP-hard *even when all numbers are encoded in unary*.
       - Examples: Traveling Salesman, 3-SAT, Graph Coloring.
       - **Robustness**: Hardness persists regardless of numeric encoding; it stems from combinatorial structure, not arithmetic.
     
     - **Weak NP-Hardness** (or **Ordinary NP-Hardness**):
       - NP-hard only when numbers are encoded in binary (e.g., knapsack, subset sum).
       - **Fragility**: Hardness vanishes if numbers are polynomially bounded or encoded in unary.

     | **Property**          | Weak NP-Hardness          | Strong NP-Hardness       |
     |------------------------|---------------------------|--------------------------|
     | **Encoding Dependence** | Binary encoding required | Hard in any encoding     |
     | **Source of Hardness** | Large numbers             | Combinatorial structure  |
     | **Pseudopolynomial?**  | Yes                       | No                       |

     **Borderline Cases**:  
     A problem is strongly NP-hard if it has a "number-free" reduction from a strongly NP-hard problem. If numbers influence the solution space combinatorially (e.g., partitioning huge numbers into subsets), it may still qualify. Ambiguity arises in problems with mixed numeric/combinatorial constraints, resolved via proof-by-reduction.

  ---

  ### 3. **Distinguishing from Related Concepts**
     - **Worst-Case Hardness**:  
       Pseudopolynomial algorithms may be efficient in practice but are still "hard" in worst-case theory. Strong NP-hardness is a *subset* of worst-case hardness but is encoding-robust.
     
     - **Practical vs. Theoretical Efficiency**:  
       The pseudopolynomial/strong-NH divide is orthogonal to constant factors. An algorithm may be:
       - Theoretically efficient (polynomial in bit length) but impractical (e.g., \(O(n^{10})\) with huge constants).
       - Practically efficient (pseudopolynomial) but theoretically "inefficient."

  ---

  ### 4. **Gaps in Established Vocabulary**
     - **The Mirror Image (Impractical Polynomial Algorithms)**:  
       No universal term exists for "theoretically polynomial but practically useless" algorithms. Terms like **Galactic Algorithm** (efficient only for unrealistically large inputs) or **Inefficient Polynomial-Time** are used informally, but lack formal criteria.
       - **Proposal**: Call these **asymptotically efficient but practically infeasible**, emphasizing the disconnect between asymptotic analysis and real-world constraints.
     
     - **Encoding Choices Beyond Unary/Binary**:  
       Complexity theory implicitly assumes "reasonable" encodings (e.g., not base-1 for large numbers). The field lacks a formal taxonomy for "representation-sensitivity" outside numeric inputs.

  ---

  ### 5. **Philosophical Implications**
     - **Efficiency is Relative**:  
       Complexity classifications are not intrinsic to problems but emerge from the interaction of algorithms, input encodings, and computational models. Your scheduling tool is "efficient" under a *physical assumption*: numbers are small.
     
     - **Robustness as a Hierarchy**:  
       Strong NP-hardness is more "fundamental" than weak NP-hardness, as it resists encoding tricks. Yet both are artifacts of the Turing machine/word RAM model—quantum or analog models might upend these classifications.

  ---

  ### Synthesis
  The dichotomy you observed—between an algorithm's practical utility and its theoretical status—is crystallized in the **pseudopolynomial**/**strong NP-hardness** framework. This distinction is sharp for numeric problems but blurs for non-numeric or mixed constraints. While complexity theory provides tools to classify encoding-dependent hardness, it still leans on worst-case asymptotics, leaving practical efficiency to empirical validation. Your case exemplifies why complexity theorists often preface results with "under standard encodings": the map (complexity classes) is not the territory (physical computation).
