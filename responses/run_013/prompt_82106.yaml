prompt: |-
  My old roommate (she's a couple of years into a philosophy MA, working mostly on Nietzsche and the will) gave me her summary of Galen Strawson's argument that nobody is ever morally responsible for anything, and it was confident enough that I've been repeating it at people for about a month. Now I'm worried I've been repeating something wrong. Her version, as best I can reconstruct it: 'It's the simplest argument in philosophy. To be responsible for what you do, you have to be responsible for being the kind of person who does it -- your character, your motives, your values. But you didn't choose any of that: you got it from your genes and your upbringing and the particular world you happened to land in. And if you say you did choose it, you're saying you made yourself, which is impossible, because whatever choice you made would have to come out of the kind of person you already were, so the regress never terminates. So nobody is ever responsible for anything. Its basically the consequence argument wearing different clothes -- the past plus the laws of nature fix what you do, so you couldn't have done otherwise -- and the upshot, which is why he gets classed with the hard determinists, is that blame and retributive punishment are irrational leftovers of a pre-scientific worldview, and we should move to a purely forward-looking system aimed at deterrence and rehabilitation.'

  I'm not a philosophy person (I do stats), and I don't want a general intro to free will -- I've read enough of that. What I want is a sentence-by-sentence audit of that paragraph: which bits a careful reader of Strawson would accept as fair, which are loose but forgivable shorthand, and which he would flatly deny, and why. Alot of it smells off to me, the punishment part especially seems like a jump, but I honestly can't tell which part is the jump, and I'd rather find out now than keep citing it at dinner parties. So also tell me what's left standing if the argument does work: what kind of responsibility does he still allow, if any, and what does he actually think should happen to our blaming and punishing practices given his conclusion? And please no reading list or citations, I won't follow up on them.
