  Breaking down the user's paragraph: The first part about needing to be responsible for your character is spot-on—Strawson does argue that. But the friend says you didn't choose genes, upbringing, etc., which is true, but Strawson's point is deeper: even if you had some choice, it's based on prior factors, so no true ultimacy. 

  The friend mentions the regress never terminates, which is core to Strawson's argument. However, she connects it to the consequence argument and hard determinism. That's where it gets shaky. Strawson isn't a determinist; his argument works regardless of determinism. He's about the impossibility of being causa sui. 

  The punishment part is a big jump. Strawson does think blame is irrational, but he doesn't advocate for a forward-looking system. He suggests we might still need punitive elements for expressive reasons, not just deterrence. The friend oversimplifies here. 

  The user's main concern seems to be accuracy, especially since they've been repeating this. They might also be worried about looking misinformed. Underneath, they probably want to understand the core valid points without getting bogged down in philosophy jargon. 

