answer: |-
  Here's a strict audit of your friend's summary against Strawson's core argument (the "Basic Argument"), focusing on accuracy and common misinterpretations:

  1.  **"To be responsible for what you do, you have to be responsible for being the kind of person who does it -- your character, your motives, your values."**
      *   **Fair:** This is the *foundation* of Strawson's Basic Argument. He argues that for true, *ultimate* moral responsibility (UR), you must be responsible for the "mental set" (character, motives, values) from which your actions flow. This is the requirement for being *"causa sui"* (cause of oneself).

  2.  **"But you didn't choose any of that: you got it from your genes and your upbringing and the particular world you happened to land in."**
      *   **Loose but Forgivable Shorthand:** This captures the *spirit* but misses Strawson's crucial nuance. He *wouldn't* flatly deny you might have made *some* choices influencing your character (e.g., choosing to practice patience). His point is deeper: **Any choice you make to shape yourself necessarily arises from the mental set you *already* have at the time of choosing** (which includes genetic predispositions, upbringing, etc.). You didn't *ultimately* choose or create that initial mental set.

  3.  **"And if you say you did choose it, you're saying you made yourself, which is impossible, because whatever choice you made would have to come out of the kind of person you already were, so the regress never terminates."**
      *   **Fair (Core of the Argument):** This is *exactly* Strawson's Basic Argument. The requirement for UR leads to an impossible infinite regress: To be responsible for how you are now (N), you must be responsible for how you were when you shaped yourself into N (N-1), and so on, forever, back to a point where you couldn't possibly be responsible (e.g., as an infant). True self-creation (*causa sui*) is logically impossible. **This is the central, inescapable point.**

  4.  **"So nobody is ever responsible for anything."**
      *   **Loose but Forgivable Shorthand (with crucial context):** Strawson *does* conclude this about **Ultimate Moral Responsibility (UR)** – the deep, buck-stops-here, desert-based responsibility needed for *fundamental* blame/praise/punishment/reward. He flatly denies UR exists. However, he readily acknowledges we *are* responsible in many *other* senses (see "What's Left Standing" below). Your friend's phrasing is too absolute without specifying *UR*.

  5.  **"Its basically the consequence argument wearing different clothes -- the past plus the laws of nature fix what you do, so you couldn't have done otherwise."**
      *   **Flatly Deny:** **This is a significant misrepresentation.** Strawson's Basic Argument is *not* based on determinism. He emphasizes repeatedly that his argument works **regardless of whether determinism is true or false.** Even in an *indeterministic* universe (where random events happen), you *still* cannot be the *ultimate* source of your mental set. Randomness doesn't grant you self-creation; it just adds luck. The Consequence Argument is a *determinist* argument; Strawson's is an *impossibility* argument (UR requires impossible self-creation).

  6.  **"and the upshot, which is why he gets classed with the hard determinists"**
      *   **Flatly Deny:** Strawson explicitly rejects being labelled a hard determinist, compatibilist, or libertarian. His argument is *independent* of the determinism debate. He calls his position **"pessimism"** – the view that UR is impossible whether determinism is true or false. Classing him with hard determinists misunderstands his core point.

  7.  **"is that blame and retributive punishment are irrational leftovers of a pre-scientific worldview"**
      *   **Fair (mostly):** Strawson *does* argue that practices requiring UR – **fundamental moral desert, basic desert, pure retribution** (punishment *just* because they deserve it, irrespective of consequences) – are indeed irrational because UR doesn't exist. He sees the *belief* in UR as deeply natural but ultimately false.

  8.  **"and we should move to a purely forward-looking system aimed at deterrence and rehabilitation."**
      *   **Loose but Forgivable Shorthand / Potential Jump:** Strawson *does* advocate shifting focus away from *retributive* punishment based on desert. However, he **does not** endorse a *purely* forward-looking system like classic utilitarianism. He argues:
      *   Punitive/retributive *feelings* and *practices* are deeply ingrained human reactions that likely serve important social functions (expression of values, deterrence, maintaining norms).
      *   We cannot and perhaps *should not* try to eliminate them entirely, even knowing UR is impossible.
      *   The key is to **moderate** them, understanding they aren't *ultimately* justified by desert. Practices might *look* similar but should be framed and understood differently – acknowledging the lack of UR while recognizing the practical necessity and expressive function of certain responses. Rehabilitation and deterrence are important, but he allows a role for expressive condemnation that may *feel* punitive.

  **What's Left Standing & What Should Happen?**

  *   **Ultimate Moral Responsibility (UR):** Gone. Strawson denies this completely.
  *   **Other Responsibility:** Plenty remains:
      *   **Practical Responsibility:** Holding people accountable for practical purposes (keeping promises, job performance, legal consequences).
      *   **Causal Responsibility:** Being the cause of an outcome.
      *   **Legal Responsibility:** Fulfilling legal definitions/requirements.
      *   **Moral Agency & Evaluation:** We can still evaluate actions as good/bad, kind/cruel, and hold people *answerable* – demanding justifications, apologies, changes in behavior. We can praise/blame in the sense of expressing attitudes towards actions/character *as they are*, without assuming ultimate responsibility for *why* they are that way.
  *   **Blaming & Punishing Practices:** Strawson argues we should:
      1.  **Abandon the belief in UR and fundamental moral desert.**
      2.  **Moderate** our reactive attitudes (resentment, indignation) and punitive impulses, knowing they aren't *ultimately* justified.
      3.  **Reframe** our practices. The focus should shift primarily to **forward-looking goals (protection, deterrence, rehabilitation) and expressive functions (condemning harmful acts, affirming values).**
      4.  **Acknowledge** that some punitive element might be pragmatically or expressively necessary, but it shouldn't be grounded in the illusion of desert.

  **The Jump You Smelled:** The biggest jump in your friend's summary is linking Strawson's argument **directly to determinism** (Consequence Argument, Hard Determinism). His core argument stands *without* determinism. The punishment jump is less severe: Strawson *does* reject retribution based on desert, but his proposed alternative isn't *purely* forward-looking; it retains a complex, moderated role for condemnation and potentially punitive elements for non-desert-based reasons.

  **The Core That Stands:** Strawson's Basic Argument (points 1-4 above, especially the regress) is robust and independent of determinism. Its conclusion is specifically the impossibility of *Ultimate Moral Responsibility*. This *does* undermine the justification for retributive punishment *based on desert*, requiring a significant shift in how we understand and practice blame and punishment, moving towards moderation, expressiveness, and forward-looking goals, while acknowledging the practical realities of human psychology and society.
