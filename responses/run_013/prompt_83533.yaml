          - We are not having the students update a set of probabilities directly. They are updating two separate probabilities and then taking the min and max. We are not representing the set of probabilities as a whole. But we are getting an interval.

          - We are not showing that the set of probabilities (the credal set) actually dilated: initially the set for P(A heads) was {1/2} (a singleton) and after it became [1/3,1/2] (an interval). This is dilation. But we are not having the students compute the entire set. They are computing the endpoints by updating the two extreme beliefs.

          - We are not covering the general case. We are only looking at two extreme beliefs. In general, the credal set might be more complex.

      We can mention in the debrief that the agent's set of probabilities for p is a set of distributions. Initially, Boss U has a continuous set of distributions and Boss F has a point. The set of probabilities for A heads under these distributions: 
          - Under Boss F: always 1/2.
          - Under Boss U: the set of possible probabilities for A heads is actually [0,1] (because p can be any value). But note: the expected value of A heads under Boss U is 1/2. However, the agent is using the expected values because they are setting prices for a single bet? 

