prompt: |-
  I'm putting together a 90-minute session for a formal epistemology seminar — 14 students, mostly grad students, some of them shaky on probability but all of them game — and I want one in-class activity that gets them to feel something that sounds like a typo the first time you hear it: that getting new evidence can leave you *less* precise about a thing, not more. I've heard the phenomenon called dilation, but I've spelled out the exact case I want them to land on below, so don't lean on the name and don't assume they'll have seen it.

  Here's the toy case, which I cooked up and checked myself. Two coins, A and B. A's bias is p, B's bias is 1 − p, p unknown. On your desk are two analysts. Analyst U thinks p is uniform on [0,1]. Analyst F insists that p is exactly 1/2. Both are your bosses, so a price is only defensible to you if it's defensible under both of them.

  Before any flip: U says P(A heads next) = 1/2, F says 1/2. Same for B. So for a bet on either coin alone you can quote a single price, and your highest buy price and lowest sell price are both 1/2 — no gap, no spread, total agreement. (They do disagree about P(A heads and B heads): 1/6 vs 1/4. So the disagreement is entirely about how the coins hang together, not about any single-flip probability.)

  Now flip B once and it comes up heads. Ask each analyst for P(A heads next). U says 1/3 — B coming up heads is evidence that B is the heads-y coin, so p is probably small, so A is probably the tails-y one. F says 1/2, unchanged. So your highest buy price is now 1/3 while your lowest sell price is still 1/2: a gap has opened up, and you got there by learning something. More evidence, less precision.

  What I want out of the activity: the students should be the ones who set the prices, in writing, before anything is flipped, and the ones who re-quote after B comes up heads, so the widening is something they do rather than something I announce. No lecture up front, and I definately don't want them hearing the word dilation before the debrief, if at all. I want them to come away seeing (a) that a credence can be a set rather than a number, (b) that the set can grow when evidence arrives, and (c) that the culprit here is disagreement about dependence, not about the marginals — the two analysts would have looked identical if you'd only ever asked them about single flips.

  Please give me: the rules and roles, any materials (keep it to paper, coins, a whiteboard, nothing that needs alot of prep), a payoff scheme that makes "you have to be right under both analysts" bite without real money, a timeline for the 90 minutes, the debrief that maps what actually happened onto the machinery above, a list of what will predictably go wrong the first time I run it and how to handle each, and an honest note on what the activity can't reproduce — I'd rather be told where I have to step in and just say the thing myself. In particular, I worry the two-analyst framing will make them think this is about two experts disagreeing when it's really about one agent whose credence is a set, so tell me how to set it up so that lands, or tell me it can't.
reasoning: |-
  We are going to design an in-class activity to illustrate the phenomenon of dilation without using the term. The key points are:
   (a) Credence can be represented as a set (interval) rather than a single number.
   (b) This set (interval) can become wider when new evidence is obtained.
   (c) The widening is due to disagreement about the dependence structure, not the marginal probabilities.

   The setup:
     Two coins: A and B.
     Coin A has bias p (probability of heads), coin B has bias 1-p.
     Two analysts (bosses):
          Analyst U: p is uniformly distributed on [0,1].
          Analyst F: p is exactly 1/2.

   We note that before any flips, for a single coin (A or B) the probability of heads is 1/2 under both analysts.

   After flipping B and getting a head, the two analysts update differently:
          Analyst U: updates p to a posterior distribution that is proportional to the likelihood of the observation (B heads) which is (1-p) [since B has bias 1-p]. 
              Prior: f(p) = 1 for p in [0,1]
              Likelihood: P(B heads | p) = 1-p
              Unnormalized posterior: (1-p) * 1 -> so posterior is proportional to 1-p. 
              Normalize: integral from 0 to 1 of (1-p) dp = 1/2, so posterior density is 2*(1-p).
              Then P(A heads next | B heads) = E[p | data] = integral_0^1 p * 2*(1-p) dp = 2 * integral_0^1 (p - p^2) dp = 2*(1/2 - 1/3) = 2*(1/6)=1/3.

          Analyst F: still thinks p=1/2, so P(A heads next) = 1/2.

   Therefore, after observing B heads, the set of defensible probabilities for A heads is [1/3, 1/2]. This is an interval that is wider than the point 1/2 we had before.

   How to turn this into an activity?

   We want the students to set prices for bets on A and B before any flips and then after observing a flip of B (which comes up heads). We want them to see that before the flip, they can agree on a single price (1/2) for a bet on A, but after the flip, they have a range (from 1/3 to 1/2) and thus a gap.

   We have two analysts, but we want the students to act as if they are an agent who must satisfy both bosses. So for a bet to be defensible, it must be acceptable under both U and F.

   The activity:

   1. Divide the class into groups of 2 or 3. Each group is an "agent" who must answer to both bosses.

   2. Explain the setup (without giving away the updating rule for U and F):
        - There are two coins, A and B.
        - The bias of A is p and the bias of B is 1-p, but p is unknown.
        - Two bosses: 
            Boss U (for "Uniform"): believes p is equally likely to be any value between 0 and 1.
            Boss F (for "Fixed"): believes p is exactly 1/2.
        - You must set prices for bets that are acceptable to both bosses.

   3. Define the bet: 
        - We will be betting on the outcome of a single flip of a coin (either A or B). 
        - A bet on a coin at price q: if the coin comes up heads, the bet pays $1; if tails, $0. 
          So if you buy the bet at price q, your net is: 
             heads: 1 - q
             tails: -q
          If you sell the bet at price q, your net is:
             heads: q - 1
             tails: q

        - For a given boss, the expected value (EV) of buying the bet at price q is: 
               EV_buy = P(heads) * (1 - q) + P(tails) * (-q) = P(heads) - q.
          The boss would say buying is acceptable if EV_buy >= 0, i.e., q <= P(heads).

          Similarly, selling is acceptable if EV_sell = q - P(heads) >= 0, i.e., q >= P(heads).

        - Therefore, for a given boss, the only price that is both acceptable to buy and sell is exactly P(heads). 
          But note: we are an agent who must satisfy both bosses. 

        - So for a bet on a coin, we can only set a price q that is at most the minimum P(heads) over the two bosses (for buying) and at least the maximum P(heads) over the two bosses (for selling). 
          However, if the two bosses agree on P(heads), then we can set a single price.

        - Actually, we are going to have the students set two prices: 
               - The highest price at which they would buy the bet (this must be <= min{P(heads) for U, P(heads) for F})
               - The lowest price at which they would sell the bet (this must be >= max{P(heads) for U, P(heads) for F})

          For a given boss, if the boss's P(heads) is r, then the boss would only allow buying at q <= r and selling at q >= r.

          Therefore, to satisfy both bosses, the buy price must be <= min(r_U, r_F) and the sell price must be >= max(r_U, r_F).

          However, note that if r_U = r_F, then we have a single price (min = max = r).

   4. Step-by-Step:

      Part 1: Before any flips.

          We ask for two coins: A and B.
          For each coin, what is the highest price you would pay to buy a bet on that coin? (buy price)
          What is the lowest price at which you would sell a bet on that coin? (sell price)

          Under both bosses, for coin A: P(heads) = 1/2 (same for coin B).
          Therefore, for coin A: 
              Boss U: P(heads) = 1/2 -> so buy acceptable if q<=1/2, sell acceptable if q>=1/2.
              Boss F: P(heads) = 1/2 -> same.
              So to satisfy both: buy price must be <= 1/2 and sell price must be >= 1/2.
              The agent can set buy price = 1/2 and sell price = 1/2? 
              BUT: if they set buy price = 1/2, then under both bosses, buying at 1/2 is acceptable (EV=0). 
              Similarly, selling at 1/2 is acceptable.

              However, note: they must set the highest buy price and the lowest sell price. 
              The highest buy price they can set is 1/2 because if they set higher, say 0.6, then Boss U would say: "At 0.6, I would not buy because I think the expected value is 0.5-0.6 = -0.1." Similarly, Boss F would say the same. 
              The lowest sell price they can set is 1/2 because if they set lower, say 0.4, then Boss U would say: "At 0.4, I would not sell because I think the expected value of selling is 0.4-0.5 = -0.1." 

              So they should report for each coin:
                   buy price = 1/2, sell price = 1/2.

          We expect every group to report 0.5 for both coins.

      Part 2: Flip coin B once, and it comes up heads.

          Now we ask again for coin A: what is the highest buy price and the lowest sell price for a bet on the next flip of A?

          Under Boss F (fixed p=1/2): 
              P(A heads | B heads) = P(A heads) = 1/2 (since independent in F's view).

          Under Boss U (uniform p):
              As computed: P(A heads | B heads) = 1/3.

          Therefore:
              For buying: the highest price that is acceptable to both bosses must be at most min(1/3, 1/2) = 1/3.
              For selling: the lowest price that is acceptable to both bosses must be at least max(1/3, 1/2) = 1/2.

          So the agent must set:
              buy price <= 1/3
              sell price >= 1/2

          Now the buy price and sell price are separated by a gap.

      How to make them compute the 1/3? We don't want to tell them. We want them to figure it out.

      We can provide the updating rule for Boss U? But we want them to feel the surprise.

      Alternatively, we can have them compute the conditional probability for Boss U.

      We can say: Boss U updates his belief about p after seeing B heads. Since Boss U started with a uniform prior for p, and the likelihood of B heads is 1-p, then the posterior density of p is proportional to (1-p). We can ask them to compute the expected value of p under that posterior.

      But that might be too much for a shaky group.

      Another idea: we can have the students in the role of Boss U and Boss F? Actually, we want the agent to serve both, so they have to consider both at once.

      We can let the groups discuss and then we can walk around and give hints if they are stuck.

      We can also provide a worksheet for Boss U:

          Boss U's prior: p ~ Uniform[0,1]
          We observed B heads. The probability of B heads given p is 1-p.
          So the posterior density of p is: f(p | B heads) = [f(p) * (1-p)] / [integral of f(p) * (1-p) dp] 
          We can compute the integral: integral_0^1 (1-p) dp = [p - p^2/2] from 0 to 1 = 1 - 1/2 = 1/2.
          So f(p | B heads) = (1-p) / (1/2) = 2(1-p) for p in [0,1].

          Then the expected value of p (which is the probability that A is heads next) is:
              E[p | B heads] = integral_0^1 p * 2(1-p) dp = 2 * integral_0^1 (p - p^2) dp = 2 * [ (1/2) p^2 - (1/3) p^3 ] from 0 to 1 = 2*(1/2 - 1/3) = 2*(1/6)=1/3.

      But if we give this to them, it might be too guided.

      Alternatively, we can ask: "Boss U now thinks that the probability that coin A is heads on the next flip is the expected value of p given that we observed B heads. How does Boss U compute that? Remember: the prior for p is uniform. The likelihood of B heads is 1-p. So the posterior is proportional to 1-p. What is the mean of that distribution?"

      We can also note that the posterior is a linear density decreasing from 2 at p=0 to 0 at p=1. The mean is the balance point. 

      If they are stuck, we can tell them: Boss U now says 1/3.

      But we want them to do the work.

      However, note: we are in a seminar and the students are game. We can let them struggle a bit.

      We can also precompute some integrals? Or provide a formula for the mean of a beta distribution? But we don't want to assume that.

      Another idea: we can have the groups simulate? But that might not be precise.

      Alternatively, we can have them compute the integral? It's a definite integral that they can do.

      We can write on the board the integral: 
          E[p|data] = [integral_0^1 p * (1-p) dp] / [integral_0^1 (1-p) dp]

      They can compute the numerator: integral_0^1 (p - p^2) dp = [p^2/2 - p^3/3] from 0 to 1 = 1/2 - 1/3 = 1/6.
      The denominator: integral_0^1 (1-p) dp = [p - p^2/2] from 0 to 1 = 1 - 1/2 = 1/2.
      Then E[p|data] = (1/6) / (1/2) = (1/6)*2 = 1/3.

      We can guide them through that.

      But note: we are doing the activity for coin A after observing B heads.

      After the flip, we ask each group to:
          - Determine what Boss U now thinks is the probability that A is heads (P(A heads | B heads) for Boss U).
          - Boss F is unchanged: still 1/2.

          Then, for the agent, the highest buy price for a bet on A must be the minimum of the two probabilities (because if the buy price is above the true probability for a boss, that boss would not buy). Similarly, the lowest sell price must be the maximum of the two probabilities.

      So they should set:
          buy price = min(1/3, 1/2) = 1/3
          sell price = max(1/3, 1/2) = 1/2

      We then collect the answers and see the gap.

   5. Materials: 
          - Paper and pen for each group.
          - A worksheet (optional) that has the two scenarios and the computations for Boss U (if needed, we can provide the integral formula as a hint).
          - A coin to flip (for B). We only need one flip: we will flip B once and it must come up heads. We can fix it to heads? But we want the activity to feel real. We can flip until we get a head? But that might take time. Alternatively, we can just announce the result as heads (since the probability is 1/2 under both bosses, and we are not updating on the fact that we got a head by design, but we are updating the p). 

          However, note: the flip result must be heads. We need it to be heads to get the dilation. So we can prearrange that the flip is heads. We can use a coin that we control? Or just announce that we are going to assume it came up heads.

          But to make it real, we can flip a real coin and hope for heads? That might take time and if we get tails we have to flip again? We might flip it and if it's tails, we can say: "Well, we'll flip again until we get a head" but that might break the flow.

          Alternatively, we can flip it once and if it's tails, we can say: "We'll consider the flip of B that we just did as tails, and now we want to consider the next flip of B? But that complicates. 

          Since we are only going to flip once, we can flip until we get a head? But that might take several flips. To save time, we can fix the outcome to heads. We can tell the students: "We are going to assume that we flip B and it comes up heads, because we want to illustrate a point. In a real experiment, it might have been tails, but today we are going to look at the heads case."

          I think that's acceptable.

   6. Timeline for 90 minutes:

          Introduction (10 minutes):
              - Explain the setup: two coins, two bosses.
              - Explain the bet: a bet on a single flip of a coin. Define the buy and sell prices and the condition (must be acceptable to both bosses).
              - Explain that we are going to set prices for bets on A and on B before any flips.

          Part 1: Before any flips (15 minutes):
              - Groups work to set for coin A: buy price and sell price; and for coin B: buy price and sell price.
              - We expect they set 0.5 for both on each coin.
              - Collect answers and write on board. (If some group has a spread, we can ask why? They might be confused. We can then clarify: both bosses agree on 0.5, so you can set a single price: 0.5 for both buy and sell.)

          Flip B (5 minutes):
              - Flip coin B and announce it's heads (if not, flip until heads, but we hope for heads quickly). Or just announce we are going to assume heads.

          Part 2: After observing B heads (25 minutes):
              - Groups now set prices for a bet on the next flip of A.
              - They must compute what Boss U now thinks and what Boss F thinks.
              - Boss F is easy: still 1/2.
              - Boss U requires computation. They might need help. We can walk around and give hints. We can also provide a hint slide or write the integral on the board if they are stuck.
              - We expect them to set buy price = 1/3 and sell price = 1/2.

          Debrief (35 minutes):
              - Collect answers and write on the board: we expect groups to have a buy price of 1/3 and a sell price of 1/2. But note: the agent must satisfy both bosses, so they can set the buy price to 1/3 (or any lower) and the sell price to 1/2 (or any higher). The highest buy price they can set is 1/3 and the lowest sell price is 1/2.
              - Discuss the results: 
                  - Before the flip, the buy and sell prices were both 1/2 (so no gap). 
                  - After the flip, we have a gap: the agent is willing to buy at up to 1/3 and sell at at least 1/2. 
                  - This gap means that if someone offers to sell the bet at 0.4, the agent would not buy (because they only buy at up to 1/3) and also would not sell (because they only sell at 0.5 or above). So they are less decisive: they have a range of prices that they are not willing to trade at.
              - Explain the intuition: 
                  - Boss U updated his belief about p: because B came up heads, that makes it more likely that p is small (so A is the tails coin). So Boss U becomes more pessimistic about A. 
                  - Boss F doesn't change.
                  - So the two bosses now disagree about A: one says 1/3, the other says 1/2. 
              - Map to the concepts:
                  (a) The agent's credence about A heads is now represented by the set [1/3, 1/2] (the interval between the two bosses). 
                  (b) This set is wider than the initial point 1/2. So we got less precise after getting evidence.
                  (c) Why did this happen? Initially, both bosses agreed on the marginal probability of A (and B). But they disagreed about the dependence: 
                      - Boss F thinks the coins are independent: P(A heads, B heads) = (1/2)*(1/2)=1/4.
                      - Boss U thinks: P(A heads, B heads) = integral_0^1 p * (1-p) dp = integral_0^1 (p - p^2) dp = 1/2 - 1/3 = 1/6.
                  - The evidence (B heads) caused them to update differently because of this dependence.

              - Finally, we can note that this phenomenon is called "dilation" (if we wish to introduce the term) but the key takeaway is the set of probabilities and how it can grow.

   7. Payoff scheme without real money:

          We can frame it as a thought experiment: the students are setting prices that they would be willing to trade at, and they must justify to both bosses. We can say: if you set a buy price that is too high, Boss U or Boss F will fire you because you are making a bad deal. Similarly for selling.

          We can have a "firing" rule: if a group sets a buy price that is above the true probability according to one of the bosses, then that boss would fire them. Similarly, if they set a sell price below the true probability of a boss, that boss would fire them.

          But note: we don't have a true p. We have two bosses with different beliefs. The agent must avoid being fired by either. So to avoid being fired by Boss U, they must set buy price <= Boss U's probability and sell price >= Boss U's probability. Similarly for Boss F.

          We can run through an example: 
              After the flip, if they set buy price = 0.4, then Boss U would say: "My probability is 1/3, so if you buy at 0.4, your expected loss is 0.4 - 1/3 ≈ 0.0667 per dollar. You are fired!" 
              And Boss F would say: "0.4 is less than 0.5, so that buy is acceptable to me." 
              But since Boss U fires them, they are fired.

          Therefore, to avoid being fired by both, they must set:
              buy price <= min(Boss U's prob, Boss F's prob)
              sell price >= max(Boss U's prob, Boss F's prob)

          This is the rule.

   8. Predictable problems and solutions:

          Problem 1: Students might not understand the updating for Boss U.
              Solution: Provide a worksheet with the steps for the integral. Or walk through the integral on the board as a hint after they have tried for a while.

          Problem 2: Students might set the buy price to 1/2 and the sell price to 1/2 after the flip (ignoring Boss U's update).
              Solution: Ask them: "What does Boss U think now? If you set the buy price to 1/2, would Boss U allow you to buy at 1/2? Remember Boss U now thinks the probability is 1/3. What is the expected value of buying at 1/2 according to Boss U?" (It would be 1/3 - 1/2 = -1/6, so a loss.)

          Problem 3: Students might set the buy price to 1/3 and the sell price to 1/2, but then think that the gap is because of their own uncertainty. We want them to see that it's because of the two bosses. 
              Solution: In the debrief, emphasize: "The agent has to satisfy both bosses. If you were only serving Boss U, you would set both buy and sell at 1/3. If only Boss F, at 1/2. But because you serve both, you have to set a buy price that is acceptable to both and a sell price that is acceptable to both. That forces the gap."

          Problem 4: The two-analyst setup might make them think this is only about aggregating experts. But we want to connect to the idea of a single agent with a set of probabilities.
              Solution: In the debrief, explain: "This setup is a way to model an agent who is not sure which of the two beliefs is correct. The agent's own state of uncertainty is represented by the set of probabilities that are compatible with what the agent knows. The agent must be cautious: any bet that one of the bosses would disapprove is ruled out. So the set of defensible prices is determined by the range of the bosses' probabilities."

          Problem 5: Time management: the integral might take too long.
              Solution: We can provide the posterior mean for Boss U as a formula: 
                  E[p | B heads] = integral_0^1 p * (1-p) dp / integral_0^1 (1-p) dp = (1/6) / (1/2) = 1/3.
              We can write the integrals and ask them to compute the numbers.

