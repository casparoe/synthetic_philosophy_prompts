          - Provide help as needed (if stuck, put the integral on the board and have them compute).
          - They should get: Boss F: 0.5, Boss U: 1/3 ≈ 0.333.
          - Then set buy price = min(0.333,0.5)=0.333, sell price = max(0.333,0.5)=0.5.

      55-90 min: Debrief
          - Collect answers and write on board: we expect buy price ~0.333 and sell price=0.5.
          - Compare to before: then we had 0.5 and 0.5, now 0.333 and 0.5 -> a gap.
          - Discuss:
              - Why did Boss U change? Because the evidence (B heads) made it more likely that p is small.
              - Why didn't Boss F change? Because Boss F believes the coins are independent.
              - The key disagreement was about the joint probability: P(A heads and B heads). 
                  Boss F: 0.25, Boss U: 1/6≈0.1667.
              - The evidence caused the two opinions to diverge on the marginal for A.
          - Connect to the set of probabilities: 
              - Initially, both bosses agreed that P(A heads)=0.5, so the set was {0.5}.
              - After, the set of probabilities for A heads (as given by the two bosses) is {1/3, 1/2}. 
              - The agent's set of defensible probabilities is the convex hull of these points: [1/3,1/2]. 
              - The gap in the buy and sell prices reflects this interval.
          - Explain that this phenomenon is called dilation: the set of probabilities becomes larger (less precise) after getting evidence.
          - Note: the evidence made the agent less decisive about A.

          - Address the two-boss framing: 
              "This isn't just about two experts. We can think of the agent as having a set of probability distributions: one for each boss. The agent considers both possibilities. When the evidence comes in, it causes the predictions from these two distributions to diverge. So the set of probabilities for the event of interest becomes larger. This is a general phenomenon that can happen when the set of distributions is updated by conditionalization and the evidence is such that it causes the distributions to become more spread out in their predictions."

          - Time allowing: ask if they think this is counterintuitive? Why or why not?

          - Conclude: sometimes more evidence can lead to less precision.

      We have 90 minutes, so this fits.

      Let's go!
answer: |-
  ### In-Class Activity: "The Dilation Effect"  
  **Goal:** Students experience how new evidence can widen the range of defensible probabilities (dilation), revealing credal sets and dependence disagreement.  

  ---

  #### **Materials**  
  - **Paper & pens** for groups  
  - **Two coins** (labeled A and B)  
  - **Whiteboard** for recording group prices  
  - **Worksheet** (one per group) with key questions (optional)  
  - **Timer**  

  ---

  #### **Rules and Roles**  
  1. **Students**: Divided into groups of 2–3. Each group is an "agent" serving two bosses (Analyst U and Analyst F).  
  2. **Bosses' Beliefs** (explained orally):  
     - **Analyst U**: Believes bias `p` of coin A is uniformly random in [0,1]; bias of coin B is `1-p`.  
     - **Analyst F**: Believes `p = 1/2` exactly (so both coins are fair).  
  3. **Your Mandate**: Any bet you make must be defensible to **both** bosses (i.e., neither would fire you for it).  
  4. **Betting Rules**:  
     - **Bet on heads**: Pays $1 if heads, $0 if tails.  
     - **Buy Price**: Highest price you’ll pay to **buy** the bet. Must satisfy: *Buy price ≤ both bosses' probabilities*.  
     - **Sell Price**: Lowest price you’ll accept to **sell** the bet. Must satisfy: *Sell price ≥ both bosses' probabilities*.  
     - If both bosses agree, buy/sell prices collapse to one number.  
  5. **Firing Rule**:  
     - If you set a buy price > a boss’s probability, that boss fires you (you overpaid).  
     - If you set a sell price < a boss’s probability, that boss fires you (you undersold).  
     - **Goal**: Avoid being fired by either boss.  

  ---

  #### **Timeline (90 Minutes)**  
  1. **Intro (10 min)**:  
     - Explain coins, bosses, and betting rules.  
     - Emphasize: "Your prices must satisfy both bosses. If they disagree, you’ll have a gap between buy/sell prices."  
     - Demo: Ask what happens if both bosses say P(heads) = 0.6 (buy/sell = 0.6) vs. U says 0.4 / F says 0.6 (buy ≤ 0.4, sell ≥ 0.6).  

  2. **Part 1: Pre-Flip Prices (20 min)**  
     - **Task**: Groups set buy/sell prices for:  
       - Bet on A (next flip)  
       - Bet on B (next flip)  
     - **Worksheet Prompt**:  
       - *"What is Analyst U’s P(A heads)? Analyst F’s P(A heads)?"*  
       - *"Highest defensible buy price? Lowest defensible sell price?"*  
     - **Expected Result**:  
       - Both bosses say P(A heads) = 1/2, P(B heads) = 1/2 → Buy/sell = 0.5 for all.  
     - **Group Report**: Write prices on whiteboard. Discuss consensus.  

  3. **Flip B (5 min)**:  
     - Flip coin B publicly. **Fix outcome to heads** (to ensure dilation; explain later if needed).  
     - Announce: "B landed heads. Now update prices for A’s next flip."  

  4. **Part 2: Post-Flip Prices (25 min)**  
     - **Task**: Groups set buy/sell prices for bet on A (next flip).  
     - **Worksheet Prompt**:  
       - *"After B heads, what is Analyst F’s P(A heads)?"* (Answer: 1/2)  
       - *"Analyst U’s P(A heads)? Hint: U updates p using Bayes’ rule. Likelihood of B heads is (1-p). Posterior ∝ (1-p)."*  
       - *Compute: E[p | B heads] = ∫p·2(1-p)dp from 0 to 1 = ?* (Answer: 1/3)  
     - **Support**:  
       - If stuck, guide integral: ∫p(1-p)dp = [p²/2 - p³/3] from 0 to 1 = 1/6. Normalize: ÷ ∫(1-p)dp = 1/2 → 1/3.  
     - **Expected Result**:  
       - Buy price ≤ min(1/3, 1/2) = 1/3; sell price ≥ max(1/3, 1/2) = 1/2 → **Gap: [1/3, 1/2]**.  
     - **Group Report**: Record prices. Highlight the gap.  

  5. **Debrief (30 min)**:  
     - **What Happened?**  
       - Pre-flip: Single price (0.5). Post-flip: Gap between buy (≤1/3) and sell (≥1/2).  
       - Evidence made you *less* precise.  
     - **Why?**  
       - **Dependence, not marginals**: Pre-flip, both agreed on P(A heads). Disagreed on joint (e.g., P(A and B heads): U said 1/6, F said 1/4.  
       - **Update Clash**: U took B heads as evidence that p is small (so A is tails-biased). F saw no dependence.  
     - **Key Insights**:  
       - (a) **Credence as a set**: Your defensible prices form an interval [1/3, 1/2]. This is your "credal set".  
       - (b) **Dilation**: Set *widened* with evidence (point → interval).  
       - (c) **Culprit**: Disagreement on dependence.  
     - **Reframing the Framing**:  
       - "This isn’t about two experts—it’s about *you* having a set of probabilities. The bosses represent two extremes in your set. When evidence pulls them apart, your set dilates."  
     - **Context**:  
       - Name the phenomenon (**dilation**) only now.  
       - Real-world cases: E.g., medical diagnosis with uncertain disease correlations.  

  ---

  #### **Predictable Problems & Solutions**  
  1. **Problem**: Students miss Bayes’ update for U.  
     - **Solution**: Pre-write integral steps on whiteboard as backup. Ask: "If U thinks p is likely small after B heads, should U’s P(A heads) go up or down?"  

  2. **Problem**: Groups set buy/sell to 1/2 post-flip (ignoring U).  
     - **Solution**: Challenge: "Would Analyst U fire you if you bought at 0.4? Why?" (U’s prob=1/3 → EV = 1/3 - 0.4 < 0).  

  3. **Problem**: Confusion about "satisfying both bosses."  
     - **Solution**: Use firing rule: "If you buy at q, U fires you if q > 1/3. F fires you if q > 1/2. To avoid both, q must be ≤ min(1/3, 1/2)."  

  4. **Problem**: Students think dilation is arbitrary.  
     - **Solution**: Stress: "This gap is forced by the math—it’s not subjective. U and F *must* disagree after the flip."  

  ---

  #### **What the Activity Can’t Do**  
  - **Credal Sets Beyond Intervals**: Students see an interval, but general credal sets can be complex. Say: "In reality, sets can have many distributions—here we used two for simplicity."  
  - **Non-Extreme Dependence**: Analysts represent extreme dependencies. Clarify: "Real agents have a continuum of dependencies; this is a minimal example."  
  - **Why Fix B to Heads?**  
     - If B lands tails, U updates to P(A heads) = 2/3 → gap [1/2, 2/3]. Dilation still occurs, but the gap is less intuitive for first-timers. Fixing heads simplifies the reveal. Admit: "We rigged the flip to make the gap obvious."  

  ---

  #### **Instructor Script Snippets**  
  - **Pre-Flip**: "Remember: You work for both bosses. If they both say 0.5, what can you set?"  
  - **Post-Flip**: "B heads happened. F still says 0.5. U? U thought p was uniform, but B heads is more likely if p is small. So U lowers P(A heads)."  
  - **Debrief**: "Pre-flip, you had one number. Post-flip, a gap. You got more data but less precision. Why? Because the bosses pulled apart on dependence."  

  **Outcome**: Students leave seeing dilation as an experiential "aha!"—not a typo.
