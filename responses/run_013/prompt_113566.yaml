answer: |-
  Below is a classification instrument structured as a decision tree, designed to diagnose positions on the causal and explanatory status of non-human factors in history. It begins with a minimal commitment ("a non-human factor made a difference to a historical outcome") and branches through diagnostic questions about the *factor type*, *causal role*, *explanatory target*, *causal primacy*, *interaction with human factors*, and *idiom*. The tree avoids labeling positions in advance (e.g., "environmental determinism") and uses cases (Tambora, Laki, post-1492 Americas, Black Death) as implicit reference points.  

  ### **Logical Space Grid**  
  The grid crosses three axes:  
  - **(a) Causal Role**:  
    - **Force**: Factor directly pushes outcomes (e.g., eruption causes cooling).  
    - **Frame**: Factor fixes boundaries of possibility (e.g., climate sets agricultural limits).  
    - **Filter**: Factor selects among human-generated variations (e.g., disease culls non-resistant populations).  
  - **(b) Explanatory Target**:  
    - **Event**: A specific outcome (e.g., 1816 famine).  
    - **Divergence**: Difference between societies (e.g., Americas vs. Europe post-1492).  
    - **Pattern**: Recurrent phenomenon (e.g., pandemics disrupting feudalism).  
  - **(c) Idiom**:  
    - **Mechanical-Causal**: Factor described as blind cause-effect (e.g., "volcanic ash blocked sunlight").  
    - **Agential**: Factor described with intent or strategy (e.g., "the virus invaded hosts").  
    - **Structural**: Factor described as systemic constraint (e.g., "disease structured demography").  

  | Cell (Role × Target × Idiom)           | Occupant                                              | Empty Cells (e.g.)                     | Status of Empty Cells            |  
  |----------------------------------------|-------------------------------------------------------|----------------------------------------|----------------------------------|  
  | Force × Event × Mechanical             | Event-causation                                       | Force × Event × Agential               | Incoherent (non-agents lack intent) |  
  | Force × Divergence × Mechanical        | Strong/conditional determinism                        | Force × Pattern × Agential             | Unattractive (no agent unity)    |  
  | Force × Pattern × Mechanical           | Strong determinism                                    | Frame × Event × Agential               | Incoherent (frames lack intent)  |  
  | Frame × Event × Structural             | Event-causation (indirect)                            | Frame × Divergence × Agential          | Incoherent                       |  
  | Frame × Divergence × Structural        | Possibilism                                           | Filter × Event × Agential              | Incoherent                       |  
  | Frame × Pattern × Structural           | Slow-frame/longue-durée                               | Filter × Divergence × Agential         | Incoherent                       |  
  | Filter × Event × Mechanical            | Event-causation (proximate)                           | Filter × Pattern × Agential            | Incoherent                       |  
  | Filter × Divergence × Mechanical       | Conditional determinism                               | All agential cells for non-pathogens   | Incoherent (except pathogens)    |  
  | Filter × Pattern × Structural          | Institutions-first anti-determinism                   | Structural cells for force roles       | Unexplored                       |  
  | Agential cells (any × any) × Pathogen  | Disease-as-protagonist/distributed agency             | Mechanical cells for frame roles       | Unexplored                       |  

  **Notes**:  
  - **Incoherent**: Idiom contradicts factor ontology (e.g., agential talk for non-agentic volcanoes).  
  - **Unattractive**: Logically possible but rarely defended (e.g., ascribing intent to climate).  
  - **Unexplored**: Viable but under-theorized (e.g., structural explanations of force roles).  

  ---

  ### **Decision Tree**  
  *Start*: A non-human factor (F) made a difference to a historical outcome (O).  

  1. **What is the nature of F?**  
     - **Pathogen** (e.g., *Yersinia pestis* in Black Death, smallpox in Americas): Biological entity with fitness interests, coevolves with hosts.  
     - **Climate** (e.g., Tambora/Laki cooling, multi-decade drought): Aggregate of conditions, no unity or agency.  
     - **Punctuated event** (e.g., Tambora/Laki eruptions): Discrete geophysical shock, no agency.  

     *Branch to 2A (Pathogen), 2B (Climate), or 2C (Punctuated event)*.  

  2. **How does F exert causal influence?** *(Causal role)*  
     - **Force**: F directly triggers O (e.g., Laki’s haze → crop failure).  
     - **Frame**: F sets boundaries for possible outcomes (e.g., climate zones limit crops).  
     - **Filter**: F selects among existing human variations (e.g., disease disproportionately kills non-immune).  
     *Branch to 3A (Force), 3B (Frame), or 3C (Filter)*.  

  3. **What is O’s scale?** *(Explanatory target)*  
     - **Event**: Single occurrence (e.g., 1816 famine).  
     - **Divergence**: Difference between cases (e.g., Americas vs. Europe post-1492).  
     - **Pattern**: Recurrent dynamic (e.g., pandemics disrupting labor systems).  
     *Branch to 4A (Event), 4B (Divergence), or 4C (Pattern)*.  

  4. **Is F the primary cause of O?**  
     - **Yes, unconditionally**: F overrides human agency. *→ Leaf: Strong environmental determinism*.  
     - **Yes, conditionally**: F is primary only under specific circumstances (e.g., weak institutions). *→ Leaf: Conditional determinism*.  
     - **No**: F is contributory but not primary. *→ Branch to 5*.  

  5. **How does F interact with human factors?**  
     - F sets bounds of possibility; humans act within them. *→ Leaf: Possibilism*.  
     - F is mediated entirely by human institutions (e.g., famine response depends on governance). *→ Leaf: Institutions-first anti-determinism*.  
     - F and humans co-constitute agency. *→ Leaf: Distributed/more-than-human agency* (if agential idiom chosen later).  
     - F’s role is background/temporal, not causal. *→ Leaf: Slow-frame/longue-durée* (only if Frame role + Pattern target).  
     - F is an event interacting with human responses. *→ Leaf: Event-causation* (only if Force role + Event target).  

  6. **How is F’s causal role described?** *(Idiom)*  
     - **Mechanical-Causal**: F is a blind force (e.g., "eruption caused cooling").  
     - **Agential**: F has interests/strategies (e.g., "the pathogen evolved to spread"). *→ Only available for Pathogens*.  
     - **Structural**: F embeds in systems (e.g., "disease filtered social structures").  
     *If Agential chosen, branch to 7; else, position is final*.  

  7. **Is agential language literal or metaphorical?**  
     - Literal: F has real agency. *→ Leaf: Disease-as-protagonist* (if not distributed agency) or *Reinforces distributed agency*.  
     - Metaphorical: Useful fiction, no ontology. *→ Leaf: Deflationary actor-talk*.  

  ---

  ### **Leaves of the Tree**  
  1. **Strong environmental determinism** (e.g., pathogens/climate as overriding cause of divergence/pattern).  
     - *Awkward commitment*: Human institutions and choices are epiphenomenal to F.  
     - *Naturalizing inference risk*: High (causal primacy easily justifies hierarchies as "inevitable").  

  2. **Conditional determinism** (e.g., disease filters populations only when institutions are fragile).  
     - *Awkward commitment*: Must define precise thresholds where F becomes primary.  
     - *Naturalizing inference risk*: Moderate (conditions may be mutable, but hierarchies can be framed as "functional").  

  3. **Possibilism** (e.g., climate sets agrarian possibilities, but politics decides outcomes).  
     - *Awkward commitment*: F’s bounds must be tight enough to matter but loose enough to avoid determinism.  
     - *Naturalizing inference risk*: Low (human agency centers explanations).  

  4. **Institutions-first anti-determinism** (e.g., disease impacts depend on public health institutions).  
     - *Awkward commitment*: Similar institutions (e.g., feudal states) must explain divergent outcomes under similar F.  
     - *Naturalizing inference risk*: Very low (institutions are human-made and changeable).  

  5. **Distributed/more-than-human agency** (e.g., humans and pathogens co-evolve; climate and society intertwine).  
     - *Awkward commitment*: Agency must be redefined without anthropocentrism.  
     - *Naturalizing inference risk*: Low (distributed responsibility blurs justificatory narratives).  

  6. **Slow-frame/longue-durée** (e.g., climate as backdrop to serfdom’s slow collapse).  
     - *Awkward commitment*: Must link F’s temporal scale to event/divergence without direct causation.  
     - *Naturalizing inference risk*: Moderate (backgrounding can naturalize as "context").  

  7. **Event-causation** (e.g., Tambora’s eruption → 1816 famine).  
     - *Awkward commitment*: Granting causal power to events without reducing human responses to insignificance.  
     - *Naturalizing inference risk*: Low (events are singular, not hierarchies).  

  8. **Disease-as-protagonist** (e.g., smallpox as "conquistador" in Americas).  
     - *Awkward commitment*: Ascribing intent to non-sentient entities.  
     - *Naturalizing inference risk*: Moderate (agency may biologize history, but metaphors can be subverted).  

  9. **Deflationary actor-talk** (e.g., "the virus targeted hosts" as heuristic).  
     - *Awkward commitment*: Maintaining utility without ontological slippage.  
     - *Naturalizing inference risk*: Low (explicitly anti-realist).  

  ---

  ### **Unresolved Pairs & Instabilities**  
  - **Possibilism vs. Conditional determinism**: Ambiguity in "primary cause" threshold (Node 4). Both grant F causal weight, but conditional determinism requires specifying when F dominates; possibilism denies domination. The tree separates them via Node 4 (primacy test).  
  - **Deflationary actor-talk vs. Genuine distributed agency**: Hinges on agential metaphor’s status (Node 7). The former denies ontology; the latter affirms it. Context determines separation.  
  - **Instability in institutions-first anti-determinism**: If F is a *filter* (e.g., disease selecting institutions), defenders may reject the tree’s placement under "not primary cause" (Node 4c). The instrument reveals tension: if F selects, it has causal power beyond mediation.  
  - **Agential idiom for non-pathogens**: The tree blocks this path as incoherent (Nodes 1 + 6), but some scholars stretch agency to volcanoes/climate. The instrument flags this as unstable.  

  ### **Design Notes**  
  - **Factor-first sorting**: Pathogens allow agential idioms; climate/volcanoes do not (Node 1). This restricts disease-as-protagonist to pathogens.  
  - **Cases embedded**: Nodes reference Tambora (event-causation), Laki (force), post-1492 (divergence/filter), Black Death (pattern/frame).  
  - **Awkward commitments**: Each leaf’s vulnerability is stated to expose trade-offs.  
  - **Naturalizing inference**: All leaves *can* reject converting causation into justification (e.g., by stressing contingency or human responsibility), but strong/conditional determinism are most vulnerable.  
  - **Node count**: 7 nodes, 9 leaves (expands to 14 with sub-branches).  
  - **Uncovered leaves**: Coevolutionary history (nested under distributed agency), niche-construction (under possibilism).  

  This tree isolates the "three quarrels" (causal role, target, idiom) and shows how "environmental determinism" gains political charge when these slide together (e.g., a *force* idiom applied to a *frame* role). Use it to map positions in your cases, then expose slippage in the chapter.
