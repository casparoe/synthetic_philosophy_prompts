prompt: |-
  I work on the analytical team of a mid-sized public-policy institute; we publish roughly a dozen reports a year for civil servants and funders, and our writers keep putting generational labels into them — 'Gen Z is more risk-averse', 'Millennials have given up on institutions' — on the strength of differences in a single cross-sectional survey. I want a written procedure, an ordered set of tests with a verdict attached to each, that an analyst with no training in demography or social ontology can run before a cohort label is allowed into a report. Two things have to stay live throughout. The first is that age, period and birth cohort are linearly related, so no dataset separates a cohort effect from a period effect except by an assumption the analyst must state out loud, and a one-off shock or a change in survey mode will present itself as a generational difference. The second is the prior question of whether a cohort is a kind at all, or a label that those under it begin to live up to, so that the classification helps produce the pattern it is used to explain. The procedure should say what counts as sufficient evidence at each step, where it stops with a no, and where it hands the decision to a person because what is left is a question about values or about what the report is for. Then run it on three cases: a single survey wave showing 18–24s more anxious than 45–54s; a claim that a cohort has been made permanently frugal by entering the workforce during a recession; and a commissioning editor who wants the report to say something about Gen Z because the funder expects it. At least one of the three should come out against the label. Be explicit about which steps are judgement dressed up as method, and about what the procedure cannot settle.
reasoning: |-
  We are designing a procedure to evaluate the use of generational labels in reports. The procedure must account for:
  1. The age-period-cohort (APC) problem: age, period, and cohort are linearly dependent (cohort = period - age). Without strong assumptions, we cannot disentangle cohort effects from period or age effects.
  2. The ontological question: whether a cohort is a real category (a "kind") or a label that becomes self-fulfilling.

  The procedure will be a step-by-step test that an analyst without specialized training can follow. It should end with a clear verdict (allow, reject, or pass to human judgment) at each step.

  We outline the steps:

  **Step 1: Check for age effects**
  - **Test**: Is the pattern observed consistent with a life-cycle effect (i.e., something that happens at a particular age, regardless of cohort)? For example, young adults are often more anxious because of life transitions.
  - **Evidence required**: Compare the same age group across different time periods (if data available) or use prior knowledge (e.g., from literature) that the pattern is typical for that age.
  - **Verdict**: 
    - If the pattern is typical for that age group in multiple periods, then reject the cohort label and attribute to age. **Stop: Reject cohort label**.
    - If the pattern is not typical for that age group (i.e., it's new or different), proceed to Step 2.

  **Step 2: Check for period effects**
  - **Test**: Is the pattern observed likely due to a period effect (an event or trend affecting all age groups at that time)? For example, a recession might make everyone more frugal, not just a particular cohort.
  - **Evidence required**: Look at other age groups in the same survey wave (or adjacent waves) to see if they show a similar change. Also, look for known events (e.g., pandemic, policy change) that might have affected all groups.
  - **Verdict**: 
    - If the pattern is observed across multiple age groups (especially if it's a sharp change) and there is a plausible period event, then reject the cohort label and attribute to period. **Stop: Reject cohort label**.
    - If the pattern is isolated to one cohort and not others, and there is no obvious period event that would affect only that cohort, proceed to Step 3.

  **Step 3: Check for cohort consistency**
  - **Test**: Is the pattern consistent across multiple surveys and over time for the same cohort? (This step requires longitudinal or repeated cross-sectional data.)
  - **Evidence required**: At least two survey waves showing the same cohort (tracked by birth year) exhibiting the same pattern at different ages and times. Also, the pattern should not be present in adjacent cohorts (or at least not as strongly).
  - **Verdict**: 
    - If the pattern is observed in the same cohort across multiple time points and is not explained by age or period, then there is evidence for a cohort effect. **Proceed to Step 4**.
    - If not, then the evidence is insufficient. **Stop: Reject cohort label**.

  **Step 4: Consider the ontological question (self-fulfilling prophecy)**
  - **Test**: Is there evidence that the generational label itself might be influencing behavior? (This is more conceptual and requires judgment.)
  - **Evidence required**: Look for media coverage or public discourse that uses the label and might be shaping behavior. Alternatively, consider if the pattern emerged only after the label became popular.
  - **Verdict**: 
    - If there is evidence that the label is widely used and might be influencing behavior, then the cohort effect might be socially constructed. This does not necessarily mean we reject the label, but we must note the caveat. **Proceed to Step 5**.
    - If there is no such evidence, then proceed to Step 5.

  **Step 5: Assess practical necessity and values**
  - **Test**: Even if there is some evidence for a cohort effect, is it necessary and appropriate to use the generational label in the report? Consider:
     a. **Precision**: Is the pattern strong and consistent enough to warrant a label that implies a shared identity?
     b. **Purpose of the report**: Does the label add value for the audience (e.g., funders expect it) or is it merely a shorthand?
     c. **Risks**: Could the label reinforce harmful stereotypes or become a self-fulfilling prophecy?
  - **Verdict**: This step requires human judgment. The analyst must consult with the commissioning editor and consider the institute's values and the report's goals.
    - If the evidence is strong and the benefits outweigh the risks, then **allow the label** with appropriate caveats.
    - Otherwise, **reject the label** and describe the pattern without the generational term (e.g., "younger adults" instead of "Gen Z").

  **Summary of Verdicts by Step**:
  - Step 1: Reject (if age effect) -> Stop.
  - Step 2: Reject (if period effect) -> Stop.
  - Step 3: Reject (if insufficient evidence of consistency) -> Stop.
  - Step 4: Proceed to Step 5 (with caveats if self-fulfilling risk exists).
  - Step 5: Allow or reject based on judgment.

  **Judgmental Steps**:
  - Step 4 and Step 5 are inherently judgmental. Step 4 involves assessing the social construction of the label, which may require qualitative evidence. Step 5 involves weighing values and practical considerations.

  **What the Procedure Cannot Settle**:
  - The APC problem cannot be definitively solved without strong assumptions (e.g., constraining one of the effects). The procedure only provides a way to rule out age and period effects and to require evidence of consistency.
  - The ontological question (whether the cohort is a real kind) is philosophical and cannot be settled empirically. We can only note the risk of self-fulfilling prophecies.

  Now, we run the procedure on three cases:

  **Case 1: A single survey wave showing 18–24s more anxious than 45–54s.**
  - Step 1: Check for age effects. It is well-known that young adults (18-24) are more anxious than middle-aged adults (45-54) due to life stage (e.g., identity formation, career uncertainty). This pattern is typical across many periods. 
    - **Verdict: Reject cohort label (age effect). Stop.**

  **Case 2: Claim that a cohort has been made permanently frugal by entering the workforce during a recession.**
  - Step 1: Check for age effects. Frugality might be more common in young adulthood because of lower income, but the claim is about a permanent effect (so it would persist as they age). We need to see if this pattern is typical for young adults in normal times. If data shows that previous cohorts became less frugal as they aged, then this cohort's continued frugality would be unusual. Without such data, we cannot rule out age. However, the claim is about a cohort effect, so we proceed assuming we have data that this cohort remains frugal at older ages.
  - Step 2: Check for period effects. The recession affected all age groups. We must check if the entire population became more frugal during the recession and if that frugality persisted. If the entire population became more frugal, then it's a period effect. If only the cohort that entered the workforce during the recession remained frugal while others reverted, then it might be a cohort effect. We need data on multiple cohorts over time.
  - Step 3: Check for cohort consistency. We need at least two surveys: one during the recession and one years later, showing that the same cohort (e.g., those aged 20-25 during the recession) is still more frugal than other cohorts at the same age (when they were 20-25) and than they themselves were at younger ages (if available). Without such longitudinal or repeated cross-sectional data, we cannot confirm. 
    - Suppose we have data from two surveys (during the recession and 10 years later) showing that the cohort that entered during the recession is more frugal at age 30-35 than other cohorts were at 30-35 (in previous surveys) and more frugal than they were at 20-25 (if measured then). Then we have evidence for a cohort effect.
    - If we don't have such data, we reject. 
  - Step 4: Consider the ontological question. If the label "recession cohort" becomes popular, it might reinforce frugality. We must note this risk.
  - Step 5: Assess necessity. The cohort label might be useful to describe a lasting impact of early economic experiences. But we must be cautious not to overgeneralize and note that not everyone in the cohort is frugal.
    - **Verdict**: If the evidence in Step 3 is strong, then we might allow the label with caveats. Otherwise, reject.

  **Case 3: A commissioning editor who wants the report to say something about Gen Z because the funder expects it.**
  - We are given no specific pattern, just a request to use the label. We must check if there is any evidence to support a Gen Z claim in the data.
  - Step 1: If there is a pattern in the data (e.g., Gen Z is different from other cohorts on some measure), then we must run Steps 1-3. Otherwise, we cannot use the label without evidence.
  - Suppose we have a pattern: in one survey, Gen Z (aged 18-24) is more digitally connected than Millennials (aged 25-40) were at the same age? But we don't have data on Millennials at 18-24 from the past? Then we cannot compare.
  - Without evidence that the pattern is not due to age or period, we cannot proceed.
  - Step 5: The editor wants it for the funder. This is a values/pragmatic call. However, without evidence, using the label might be misleading. The procedure would require at least passing Step 3 (cohort consistency) to have evidence. 
    - **Verdict**: Without evidence, the procedure would reject the label. But the editor may override. The procedure would note that the use is for funder expectations and not based on evidence, and it should be clearly caveated.

  We now write the procedure in a formal way and then apply to the cases.

  **Formal Procedure Document**

  ---

  **Procedure for Evaluating the Use of Generational Labels in Reports**

  **Purpose**: To ensure that generational labels (e.g., Gen Z, Millennials) are used only when supported by evidence and after considering potential confounding factors (age and period effects) and the risk of reification.

  **Steps**:

  1. **Check for Age Effects**  
     - Compare the pattern to known life-cycle patterns. If the pattern is typical for the age group in question (e.g., young adults are often more anxious), then attribute the finding to age.  
     - **Evidence required**: Literature or data showing that the pattern is common at that age across multiple time periods.  
     - **Verdict**: If an age effect is plausible and supported, **reject the generational label** and describe the finding in terms of age. Stop.  
     - If not, proceed to Step 2.

  2. **Check for Period Effects**  
     - Examine whether the pattern might be due to a current event or trend affecting all age groups.  
     - **Evidence required**: Data showing that the pattern is present in multiple age groups (especially if it is a sharp change) and a plausible contemporaneous event.  
     - **Verdict**: If a period effect is plausible and supported, **reject the generational label** and describe the finding in terms of period effects. Stop.  
     - If the pattern is isolated to one cohort and there is no obvious period event that would affect only that cohort, proceed to Step 3.

  3. **Check for Cohort Consistency**  
     - Require evidence that the pattern is consistent for the same birth cohort over time and across multiple surveys.  
     - **Evidence required**: At least two survey waves (or longitudinal data) showing the same pattern for the same birth cohort at different ages and times, and the pattern should not be present (or as strong) in adjacent cohorts.  
     - **Verdict**: If the evidence is insufficient (e.g., only one survey, or the pattern is not consistent over time), **reject the generational label**. Stop.  
     - If there is sufficient evidence, proceed to Step 4.

  4. **Consider the Risk of Reification (Self-Fulfilling Prophecy)**  
     - Assess whether the generational label itself might be influencing behavior.  
     - **Evidence required**: Look for media coverage, popular discourse, or research suggesting that the label is widely used and might be shaping attitudes or behaviors.  
     - **Verdict**: This step does not automatically reject the label but requires that any use of the label be accompanied by a caveat about the potential for social construction. Proceed to Step 5.

  5. **Assess Practical Necessity and Values**  
     - Weigh the benefits and risks of using the generational label, considering:  
       a. The strength of the evidence.  
       b. The report's purpose and audience expectations.  
       c. The potential for reinforcing stereotypes or creating self-fulfilling prophecies.  
     - **Verdict**: This step requires consultation with the commissioning editor and other stakeholders.  
       - If the evidence is strong and the benefits outweigh the risks, **allow the generational label** with appropriate caveats (noting the limitations and the potential for reification).  
       - Otherwise, **reject the generational label** and describe the pattern using non-generational terms (e.g., by age range).

  **What the Procedure Cannot Do**:  
  - It cannot definitively solve the age-period-cohort identification problem. We rely on ruling out age and period effects and requiring consistency.  
  - It cannot resolve the philosophical question of whether generations are real social kinds. We can only flag the risk of reification.  

  ---

  **Application to Cases**:

  **Case 1: Single survey wave showing 18–24s more anxious than 45–54s.**  
  - Step 1: This pattern is typical of age effects (young adults are often more anxious due to life transitions). Evidence from psychology and sociology supports this as an age effect.  
    - **Verdict: Reject generational label. Stop.**  
    - Reason: Age effect.

  **Case 2: Claim that a cohort has been made permanently frugal by entering the workforce during a recession.**  
  - We assume we have data from multiple surveys.  
  - Step 1: Frugality at young ages might be an age effect (lower income). But the claim is about permanence, so we need to see if this cohort remains frugal at older ages. If we have data showing that at age 35-40, this cohort is still more frugal than other cohorts were at 35-40 (and controlling for period), then we proceed.  
  - Step 2: The recession was a period event. We check if frugality increased for all age groups during the recession and then reverted. If only the cohort that entered the workforce during the recession remained frugal, then we rule out a pure period effect.  
  - Step 3: We need at least two surveys: one during the recession and one 10-15 years later. We compare:  
     - The cohort of interest (e.g., born 1980-1985) at age 25 (in 2005-2010) and at age 35 (in 2015-2020) to see if they are more frugal than the cohort born 1970-1975 was at age 35 (in 2005-2010) and also more frugal than they themselves were at 25 (if we have that data). Also, compare to the cohort born 1990-1995 at age 25 in a non-recession period.  
     - If the data shows the cohort of interest is more frugal at both time points relative to others, then we have evidence.  
     - **Verdict so far**: If the evidence is there, proceed to Step 4. Otherwise, reject.  
  - Step 4: The label "recession cohort" might become a self-fulfilling prophecy. We note this risk.  
  - Step 5: The label might be useful for understanding long-term effects of economic shocks. But we must avoid overgeneralizing.  
    - **Final Verdict**: If the evidence in Step 3 is strong, then allow the label with caveats. Otherwise, reject.

  **Case 3: Commissioning editor wants the report to say something about Gen Z because the funder expects it.**  
  - We must have some data about Gen Z. Suppose we have a survey showing Gen Z (aged 18-24) is more likely to use social media than Millennials (aged 25-40) in the same survey.  
  - Step 1: Age effect? Young people are always more likely to adopt new technology. Without data on Millennials when they were 18-24, we cannot rule out an age effect.  
  - Step 2: Period effect? Social media has become more pervasive. This affects all age groups, but younger people might be more affected. Without data on other cohorts at the same age, we cannot rule out a period effect.  
  - Step 3: We need to compare Gen Z at 18-24 to Millennials at 18-24 (from a past survey). If we have a survey from 10 years ago showing Millennials at 18-24 had lower social media use, then we have evidence of a cohort effect. But note: the period effect (increased social media availability) confounds this.  
    - Without strong evidence (i.e., without being able to disentangle period and cohort), we cannot pass Step 3.  
    - **Verdict**: Reject the cohort label because of insufficient evidence to rule out age and period effects.  
  - Step 5: The editor may insist. The procedure would require a note in the report that the generational label is used at the funder's request but that the evidence does not conclusively rule out age or period effects.  

  **Explicit Judgment Steps**:  
  - Step 4 and Step 5 are judgment calls. Step 4 requires assessing the cultural presence of the label, which is not quantitative. Step 5 involves balancing evidence, audience expectations, and ethical concerns.

  **Note**: At least one case (Case 1) comes out against the label. Case 3 also comes out against the label in the absence of evidence, though it may be overridden by the editor with caveats.
answer: |-
  ### Procedure for Evaluating Generational Labels in Analytical Reports  
  **Purpose**: To prevent unsupported or misleading use of generational labels (e.g., "Gen Z," "Millennials") by systematically addressing the Age-Period-Cohort (APC) problem and the risk of reification (labels creating self-fulfilling prophecies). Analysts must complete these steps *before* including a cohort label.  

  ---

  #### **Step 1: Define the Claim and Label**  
  **Test**: Clarify the exact claim (e.g., "Gen Z is more risk-averse") and the birth-year boundaries of the cohort (e.g., Gen Z: born 1997–2012).  
  - **Evidence Required**: The label must be explicitly defined using widely accepted sources (e.g., Pew Research) or a stated rationale.  
  - **Verdict**:  
    - If the label is undefined or arbitrary → **Reject label. Stop.**  
    - If defined → **Proceed to Step 2.**  

  **Rationale**: Arbitrary labels amplify APC confusion. Judgment is minimal here; it’s a factual check.  

  ---

  #### **Step 2: Rule Out Age Effects**  
  **Test**: Could the pattern be explained by life stage (age), not birth cohort?  
  - **Evidence Required**: Compare the cohort to *the same age group in prior surveys* (if longitudinal data exists) or to established life-cycle patterns (e.g., from literature).  
  - **Verdict**:  
    - If the pattern is typical for that age group historically (e.g., young adults are always more risk-averse) → **Reject label. Attribute to age. Stop.**  
    - If no comparable data exists, or the pattern is atypical for the age group → **Proceed to Step 3.**  

  **Rationale**: Age effects are confounders. Judgment enters in interpreting "typical" (use literature or internal data).  

  ---

  #### **Step 3: Rule Out Period Effects**  
  **Test**: Could the pattern be explained by a recent event (e.g., pandemic, policy change) affecting all ages?  
  - **Evidence Required**: Check if the pattern exists in *other age groups* in the same survey wave. Review external events (e.g., recessions) that might cause cross-sectional shifts.  
  - **Verdict**:  
    - If the pattern appears in multiple age groups → **Reject label. Attribute to period. Stop.**  
    - If the pattern is isolated to one cohort and a period effect is implausible → **Proceed to Step 4.**  

  **Rationale**: Period effects mimic cohort effects. Judgment is needed to assess "plausibility" of events.  

  ---

  #### **Step 4: Verify Cohort Consistency**  
  **Test**: Is the pattern consistent *over time* for the cohort?  
  - **Evidence Required**: At least **two survey waves** showing the same cohort exhibits the trait at different ages/life stages. *Must* include comparisons to adjacent cohorts (e.g., Gen Z vs. Millennials at the same age).  
  - **Verdict**:  
    - If no multi-wave data, or inconsistency across waves → **Reject label. Insufficient evidence. Stop.**  
    - If consistent across waves and distinct from adjacent cohorts → **Proceed to Step 5.**  

  **Rationale**: Isolates cohort effects from APC confusion. Strict evidence threshold minimizes judgment.  

  ---

  #### **Step 5: Assess Reification Risk**  
  **Test**: Could the label itself be shaping behavior (e.g., media reinforcing "Gen Z is anxious")?  
  - **Evidence Required**: Evaluate if the label is widely used in media/policy discourse *before* the pattern emerged.  
  - **Verdict**:  
    - If evidence suggests the label preceded/promoted the pattern (e.g., surge in "Gen Z anxiety" articles before survey) → **Flag reification risk. Proceed to Step 6.**  
    - If no evidence of reification → **Proceed to Step 6.**  

  **Rationale**: Addresses the ontological question. Judgment is high (qualitative media analysis).  

  ---

  #### **Step 6: Weigh Necessity and Ethics**  
  **Test**: Does the label add value beyond alternatives (e.g., "young adults"), and is it ethically justifiable?  
  - **Evidence Required**: None. Analyst must consult stakeholders and consider:  
    - **Precision**: Is the cohort label more accurate than age/period?  
    - **Purpose**: Does it serve the report’s goals (e.g., funder communication)?  
    - **Risks**: Could it stereotype, exclude, or become self-fulfilling?  
  - **Verdict**:  
    - If risks outweigh benefits, or alternatives suffice → **Reject label.**  
    - If benefits outweigh risks and evidence from Steps 1–5 supports it → **Allow label with caveats.**  

  **Rationale**: Balances evidence with institutional values. Highly judgmental.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **APC resolution**: No statistical method fully disentangles age, period, and cohort without assumptions (e.g., constraining one variable). Steps 2–4 only reduce uncertainty; they don’t eliminate it.  
  2. **Ontological certainty**: Cohorts are not "natural kinds." Step 5 flags reification risk but can’t prove/disprove if labels create reality.  
  3. **Value conflicts**: Step 6 requires subjective trade-offs (e.g., "funder expectations" vs. analytical rigor).  

  ---

  ### **Case Applications**  
  **Case 1: Single survey wave showing 18–24s more anxious than 45–54s.**  
  - **Step 1**: Label defined (e.g., Gen Z vs. Gen X). → Proceed.  
  - **Step 2**: **Age effect?** Yes. Literature shows young adults report higher anxiety (life-stage uncertainty). → **Reject label. Stop.**  
  - **Verdict**: No generational label. Use "young adults" instead.  

  **Case 2: Claim that a cohort became permanently frugal after entering the workforce during a recession.**  
  - **Step 1**: Label defined (e.g., "Recession cohort"). → Proceed.  
  - **Step 2**: **Age effect?** Frugality is common in early career. But "permanent" claim requires longitudinal data. → Proceed.  
  - **Step 3**: **Period effect?** Recessions impact all ages (e.g., reduced spending across cohorts). If data shows frugality only in the "recession cohort," proceed.  
  - **Step 4**: **Cohort consistency?** Requires ≥2 waves (e.g., 2010 recession and 2020 data). If the cohort is still frugal in 2020 while others aren’t, proceed. Else reject.  
  - **Step 5**: **Reification risk?** If "recession cohort" is a media staple, risk is high. → Flag.  
  - **Step 6**: **Necessity/ethics?** Label may illuminate long-term scarring effects but risks determinism. → **Allow with caveats** (e.g., "observed in [cohort], though causality is unclear").  
  - **Verdict**: Label allowed *only* with robust multi-wave data and caveats.  

  **Case 3: Editor wants "Gen Z" in the report because the funder expects it.**  
  - **Step 1**: Label defined. → Proceed.  
  - **Steps 2–4**: If no data rules out age/period effects or shows consistency → **Reject label. Stop.**  
  - **Step 6**: **Necessity/ethics?** Funder expectations are a "purpose" factor, but lack of evidence (Steps 2–4) makes the label misleading. → **Reject label.**  
    - **Compromise**: Use non-generational terms (e.g., "respondents under 25") and note funder interest in youth trends.  
  - **Verdict**: **Reject generational label** without evidence.  

  ---

  ### **Explicit Judgment Calls**  
  - **Step 2/3**: Assessing "typical" age/period effects relies on literature/expertise (judgment dressed as method).  
  - **Step 5**: Reification risk is inherently speculative (no quantitative test).  
  - **Step 6**: Entirely values-based (e.g., "funder expectations vs. accuracy").  

  **Outcomes**: Cases 1 and 3 reject labels; Case 2 *conditionally* allows one. This aligns with the requirement that at least one case rejects the label.  

  **Final Guidance**: Cohort labels should be rare. Default to age/period descriptions unless all steps are passed. Always caveat limitations (APC/reification) if labels are used.
