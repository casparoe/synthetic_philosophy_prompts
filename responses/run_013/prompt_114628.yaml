answer: |-
  ### Taxonomy of Intentionality Positions  
  **Core Question:** When does a system have *original* intentionality (intrinsic "aboutness"), and when is it *derived* or *as-if* (observer-relative)?  

  #### Decision Tree  
  Answer the branching questions to classify a system (e.g., thermostat, LLM, evolved organ). Positions are named leaves with key commitments.  

  1. **Is the original/derived distinction coherent?**  
     - **No →** *Intentionality is always observer-relative* → Go to 2.  
     - **Yes →** *Original intentionality exists independently of observers* → Go to 3.  

  2. **Is intentional ascription pragmatically useful?**  
     - **Yes → *Instrumentalism*** (e.g., Dennett’s intentional stance).  
       *Awkward commitment: Thermostats "believe" the room is cold if the stance predicts behavior.*  
     - **No → *Eliminativism*** (e.g., radical Churchland view).  
       *Awkward commitment: Human beliefs/desires are as illusory as a two-bitser’s "goal."*  

  3. **Does original intentionality require consciousness?**  
     - **Yes → *Searlean Observer-Relativity*** (e.g., Searle).  
       *Awkward commitment: A chess engine’s moves lack intrinsic meaning; only programmers/users imbue it.*  
     - **No →** Go to 4.  

  4. **Does it require states capable of misrepresentation?**  
     - **No → *Causal-Covariance Theories*** (unnamed, early Fodor-inspired).  
       *Awkward commitment: A two-bitser fooled by a slug *still* represents quarters; errors aren’t misrepresentation.*  
     - **Yes →** Go to 5.  

  5. **Does it require evolutionary selection for the tracking function?**  
     - **Yes → *Teleosemantics*** (e.g., Millikan, Papineau).  
       *Awkward commitment: An evolved food-tracking organ has intentionality; a designed identical AI module does not.*  
     - **No →** Go to 6.  

  6. **Does it require being a whole agent (not a subsystem/group)?**  
     - **Yes → *Agent-Based Views*** (unnamed, inspired by Haugeland).  
       *Awkward commitment: A corporation’s "decisions" are metaphorical; only individuals have original intentionality.*  
     - **No → *Functional Role Semantics*** (e.g., later Fodor, Prinz).  
       *Awkward commitment: Current LLMs have original intentionality if their states play cognitive roles (e.g., token "food" causes eating).*  

  #### Key to Cases  
  - **Two-bitser:** Instrumentalism (Dennett) vs. Observer-Relativity (Searle).  
  - **Chess engine:** Observer-Relativity (lacks consciousness) or Functional Role (if complex roles).  
  - **Corporation:** Agent-Based (denied) or Instrumentalism (as-if).  
  - **Slime mold:** Teleosemantics (if evolved) or Functional Role (if information-processing).  
  - **Thermostat:** Instrumentalism or Causal-Covariance (if misrepresentation impossible).  
  - **LLM:** Functional Role (if roles exist) or Observer-Relativity (Searle).  
  - **Evolved food-tracker:** Teleosemantics (yes) vs. Agent-Based (no, if just an organ).  

  #### Notes  
  - **Unfilled Combinations:** None—all paths lead to a defended position.  
  - **Tree Can’t Split:**  
    - *Dennett vs. Functional Role:* Both grant intentionality to LLMs/corporations, but Dennett rejects the original/derived distinction (Instrumentalism leaf), while Functional Role accepts it (requires structured roles).  
  - **Empty Leaves?** None incoherent/unattractive; all branches covered by extant theories.  

  **Handout Use:** Assign cases to students to classify using the tree. Positions reveal tensions (e.g., is evolution necessary? Is consciousness essential?).
