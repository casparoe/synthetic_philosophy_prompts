answer: |-
  ## How Norms Actually Die: Sequencing the Collapse of Moral Practices

  **The Question (150 words):**  
  Can the collapse of a deeply entrenched social norm occur primarily through a shift in *honour* (where upholding it becomes contemptible rather than estimable), *without* this shift being preceded or necessitated by a fundamental change in the material or political *interests* of the groups who historically enforced the norm? Or is the "honour revolution" described by Appiah always downstream of, or dependent upon, an antecedent shift in the underlying power dynamics or incentives (the "interests revolution")? This question demands a determinate answer: if we can identify a case where public contempt for a practice demonstrably surged and became the primary driver of its abandonment *before* any significant alteration in the economic or political advantages enjoyed by its enforcers, then honour is an independent engine. If no such case exists across robust examples, then the honour explanation collapses into an interests story, and philosophical argument is largely epiphenomenal.

  **Why the Existing Answers Leave It Open (250 words):**  
  Current explanations for norm death remain frustratingly ambiguous on causal sequence. Interests-based accounts (e.g., highlighting the economic inefficiency of slavery for emerging industrial powers) struggle to explain *why* changed incentives translate into moral condemnation rather than mere pragmatic abandonment. They fail to rule out that the honour shift (the newly felt *contempt*) is the crucial mechanism translating altered interests into widespread behavioural change and avowal withdrawal. Conversely, honour-centric explanations like Appiah's, while powerfully describing the phenomenology of moral disgust driving abolition or the end of duelling, often inadequately address *why* honour suddenly attaches to new behaviours. They leave open the possibility that the honour code flipped *because* underlying interests shifted – perhaps elites found duelling increasingly legally perilous or socially inconvenient, making its cessation honourable retroactively. Similarly, argument-focused narratives assume persuasion is primary, but rarely interrogate *when* and *why* previously dismissed arguments suddenly gain traction. My tripartite framework (avowal death, conduct death, esteem death) forces temporal precision: *when* did public defence become impossible? *When* did actions cease? Crucially, *when* did social rewards flip? This isn't merely relabelling; it demands identifying the *order* of these distinct events within the historical process, exposing whether esteem death *leads* conduct/avowal changes or *follows* shifts enabled by interest realignment. Existing theories conflate these stages or assume their simultaneity.

  **What I Would Actually Do (350 words):**  
  This summer project will apply the 'three deaths' framework and the 'testimony test' to four historical cases, leveraging secondary sources I possess or can readily access:

  1.  **Framework Refinement (May):** Precisely define operational indicators for each "death":
      *   **Avowal Death:** Cessation of *public, principled defence* in key forums (e.g., Parliamentary debates, major pamphlets, newspaper editorials). Silence isn't enough; active defence must vanish.
      *   **Conduct Death:** Measurable cessation of the *practice itself* (e.g., last recorded duel with seconds in Britain, last legal slave voyage, last documented sati ceremony with community sanction, collapse in footbinding rates in specific cohorts).
      *   **Esteem Death:** Emergence of *public ridicule, contempt, or loss of status* directed at practitioners (e.g., satirisation of duelists in popular press, social ostracism of slave traders, fathers defending footbinding facing public censure). Key indicator: advocates shift from proud justification to shamefaced apology or silence.
      *   **Testimony Test:** Track *when and how* the experiences/perspectives of victims (duelling seconds fearing ruin, enslaved people, widows, bound-foot girls) transition from being systematically ignored/dismissed to becoming *authoritative evidence* in mainstream discourse against the practice. Is this shift concurrent with, or subsequent to, the esteem death?

  2.  **Case Study Analysis (June):** Systematically apply these indicators to each case:
      *   **Duelling (Britain, c. 1780-1850):** Focus on military/officer class and Parliament. Track changing rhetoric, prosecutions, social commentary, and the fate of prominent participants.
      *   **British Slave Trade Abolition (c. 1787-1807):** Examine West India Lobby rhetoric, Parliamentary debates (Wilberforce vs. Tarleton), popular petitions, and changing merchant behaviour. Crucial for the testimony test: Clarkson's evidence gathering vs. earlier dismissal of slave narratives.
      *   **Footbinding (China, late 19th - early 20th C):** Focus on reformist societies, missionary influence, elite discourse, and regional variation in abandonment speed. Testimony test: When do bound women's voices enter the debate?
      *   **Sati (India, c. 1800-1830):** Analyse East India Company policy shifts, Brahminical debates, colonial records of incidents, and changing community reactions. Testimony test: The (in)visibility of the widow's perspective.

  3.  **Temporal Sequencing & Contested Records (Ongoing):** Where dates are contested (e.g., the *last* duel), I will note the range and adopt the latest plausible date for conduct death to avoid premature conclusions. The core method is establishing the *sequence* between the clearest markers of esteem shift, interest shifts (e.g., falling sugar profits, changing military discipline needs), and the other 'deaths'. The testimony test analysis runs parallel – does victim testimony gain authority *before* or *after* the esteem flip?

  **What Would Count as a Result and What Would Count as Failure (200 words):**  

  *   **Success:** Finding compelling evidence that **esteem death demonstrably preceded significant interest shifts** in *at least one* case. For example, conclusive evidence that elite contempt for duelling surged *before* legal penalties significantly increased or military necessity changed, driving abandonment. This would validate honour as an independent engine. Alternatively, demonstrating that **victim testimony gained widespread credibility *concurrent with* or *before* the esteem flip** (e.g., slave narratives directly fuelling elite contempt *before* major economic shifts) would strongly support the testimony test and challenge the "argument last" view.
  *   **Failure:** Finding that **esteem death consistently *follows* identifiable interest shifts** across all cases, suggesting honour is indeed a consequence, not a cause. More fundamentally, failure would occur if the **three 'deaths' prove inseparable in practice** – if shifts in avowal, conduct, and esteem are so tightly clustered or mutually constitutive within the historical record that establishing clear sequence is impossible *even with this framework*. This would indicate the framework lacks the necessary discriminatory power or that norm death is inherently a simultaneous, multi-faceted collapse. Running out of time is secondary; the framework's applicability is the primary risk.

  **Scope and Honest Risks (150 words):**  
  A summer project cannot deliver definitive proof for all cases or exhaustively analyse each. The scope is deliberately focused on establishing *sequence* using accessible evidence. The biggest inherent risk is **historical complexity**: these revolutions involved myriad factors; isolating "interest shifts" cleanly is notoriously difficult (e.g., was falling support for slavery purely economic, or already influenced by changing *mores*?). Sati and footbinding involve significant cultural/colonial dynamics potentially obscuring internal esteem mechanisms. **Duelling** is likely the cleanest test case due to its narrower social base and clearer legal/disciplinary record. **Slavery abolition** is the most complex and contested; if sequencing proves intractable here, it will be the first candidate for reduced focus. The key is not to explain *why* each norm died fully, but to rigorously test the *temporal relationship* between honour, interests, and the collapse phases using practicable methods. I will prioritise depth on sequence in 2-3 cases over superficial coverage of all four if time pressure mounts.
