prompt: |-
  I am assembling a specification document for a semantics working group, and I want the requirements settled before we evaluate any particular system. Write the desiderata that any two-dimensional framework for meaning and reference must satisfy in order to count as adequate.

  For each desideratum, state the case or consideration that motivates it. The list should cover, at minimum: the data the framework must reproduce (the a posteriori necessities, the necessary a posteriori, the contingent a priori, the apparent cognitive significance of co-referential names, the failure of substitutivity in attitude contexts); the distinctions it must not collapse (epistemic versus metaphysical modality; the two intensions and what each is meant to represent; the difference between the context-sensitivity of a term's use and the contingency of its referent); and the theoretical constraints it inherits (rigid designation and the direct-reference picture, compositionality, the link between the primary intension and what a speaker can know independently of experience, and the demand that the framework not merely relocate the puzzle of cognitive significance rather than solve it).

  Then the part I care about most. I want the framework to handle a case the textbook examples do not cover well: a natural-kind term introduced by a community on the basis of a conception that later turns out to be internally heterogeneous, so that competent speakers' uses diverge and the experts eventually recognize two distinct kinds beneath one inherited word. What should the framework say the primary intension was at the earlier stage, and how should it treat the later one? Treat this not as an anomaly to quarantine but as a genuine constraint, and say whether accommodating it forces a choice among desiderata that otherwise look independent.

  Flag every pair of desiderata you believe cannot be jointly satisfied, and say which single requirement rules out the largest number of otherwise attractive candidate frameworks. Finally, state what would change your mind: which argument or consideration would lead you to revise your verdict on the necessity or the joint satisfiability of these requirements, and where you judge your own reasoning most likely to fail.
reasoning: |-
  We are building a list of desiderata for a two-dimensional framework for meaning and reference. The framework must account for several phenomena and respect key distinctions and theoretical constraints. We then consider a challenging case of a natural-kind term introduced with a conception that later fragments. Finally, we identify potential conflicts and vulnerabilities.

  ## I. Desiderata for an Adequate Two-Dimensional Framework

  ### A. Data to Reproduce

  1. **A Posteriori Necessities**  
     *Motivation*: The framework must explain how some statements (like "Water is H₂O") are necessary (true in all possible worlds) but knowable only through empirical investigation. This requires a distinction between ways the world might turn out (epistemic dimension) and ways the world could have been (metaphysical dimension).

  2. **Necessary A Posteriori**  
     *Motivation*: Closely related to (1), this is the class of necessary truths that are not knowable a priori. The framework must capture that we can conceive of scenarios (epistemically possible) where water isn't H₂O, but such scenarios are metaphysically impossible. Failure to account for this would leave Kripke's insights unexplained.

  3. **Contingent A Priori**  
     *Motivation*: The framework must explain how some statements (like "Stick S is one meter long at time t0", when 'one meter' is defined by S) are knowable without experience (a priori) but contingent (because S might have had a different length). This requires a distinction between the context of utterance (which fixes the reference) and the circumstances of evaluation.

  4. **Cognitive Significance of Co-referential Names**  
     *Motivation*: The framework must explain why "Hesperus is Phosphorus" is informative (a posteriori) while "Hesperus is Hesperus" is not, even though both are true and involve co-referential names. This requires that expressions with the same referent can have different cognitive roles.

  5. **Failure of Substitutivity in Attitude Contexts**  
     *Motivation*: The framework must explain why substituting co-referential terms in attitude reports (e.g., "Lois Lane believes Superman can fly" vs. "Lois Lane believes Clark Kent can fly") can change the truth value. This requires a notion of meaning that is finer-grained than reference alone.

  ### B. Distinctions Not to Collapse

  6. **Epistemic vs. Metaphysical Modality**  
     *Motivation*: The framework must not conflate what is conceivable (epistemic possibility) with what is metaphysically possible. For example, it is epistemically possible that water isn't H₂O, but it is metaphysically necessary that water is H₂O. This distinction is central to two-dimensionalism.

  7. **Two Intensions and Their Roles**  
     *Motivation*: The framework must clearly distinguish between primary intension (which captures the reference of an expression in a world considered as actual, reflecting how reference is fixed by the speaker's conception) and secondary intension (which captures the reference in counterfactual worlds, given the actual world). Primary intension is tied to epistemic modality and a priori knowledge; secondary intension to metaphysical modality and necessity.

  8. **Context-Sensitivity vs. Contingency of Reference**  
     *Motivation*: The framework must not confuse the context-dependence of an expression (like indexicals) with the contingency of its referent. For example, "I" refers to different individuals in different contexts (context-sensitivity) but in a fixed context it rigidly designates the same individual (so its referent isn't contingent in the sense of varying with the world of evaluation). This is crucial for handling rigid designation and direct reference.

  ### C. Theoretical Constraints

  9. **Rigid Designation and Direct Reference**  
     *Motivation*: The framework must respect that proper names and natural-kind terms rigidly designate (i.e., they denote the same object in all possible worlds). This is a core tenet of direct reference theories. The secondary intension must be constant.

  10. **Compositionality**  
      *Motivation*: The framework must be compositional: the meaning of a complex expression is determined by the meanings of its parts and their syntactic combination. This is required to explain productivity and systematicity of language.

  11. **Link Between Primary Intension and A Priori Knowability**  
      *Motivation*: The primary intension of an expression should be knowable a priori (or at least, the conditions for reference-fixing should be). This captures the idea that a speaker can know the reference-fixing conditions without knowing the actual world's contingent features.

  12. **No Relocation of the Puzzle of Cognitive Significance**  
      *Motivation*: The framework must not merely shift the problem of cognitive significance from one level (e.g., reference) to another (e.g., primary intension) without solving it. For example, if the primary intension is taken as the meaning, then we must explain why co-referential terms can have distinct primary intensions (if they do) and how that explains cognitive differences.

  ## II. The Challenge: Fragmented Natural-Kind Term

  ### Case Description
  Consider a natural-kind term 'X' introduced by a community based on a conception C (e.g., observable properties P). Later, it is discovered that the samples initially taken to be X fall into two distinct kinds (X1 and X2) with different hidden structures. As a result, the community splits: some speakers use 'X' for X1, others for X2. The term becomes ambiguous.

  ### Questions for the Framework
  - What was the primary intension of 'X' at the earlier stage?
  - How should the framework handle the later stage?

  ### Framework Requirements
  - **Earlier Stage**: The primary intension should be defined by the conception C (the properties P). It picks out whatever in a world has P. But note: in the actual world, at the earlier stage, the term refers to both X1 and X2 (because the community hasn't distinguished them). However, the primary intension must be such that it can pick out either X1 or X2 (or both) in different worlds? This is tricky because the conception C might be satisfied by both in some worlds and only one in others.

  - **Later Stage**: The term 'X' becomes ambiguous. The framework must allow for two distinct primary intensions (one for X1 and one for X2) to be associated with the same lexical item. This requires that the framework can handle polysemy or ambiguity without positing a single primary intension.

  ### Constraints and Implications
  - **Motivation as a Genuine Constraint**: This case tests the framework's ability to handle reference change, ambiguity, and the social dimension of language. It forces us to consider whether the primary intension is determined by the individual or the community, and how the framework accounts for shifts in usage.

  - **Potential Conflict**: The requirement that the primary intension is fixed by the conception (which is a priori accessible) and the requirement that it settles reference rigidly (via secondary intension) might be in tension. In the fragmented case, the initial conception C is not sufficient to pick out a unique kind. So the primary intension might be vague or disjunctive. But then, how does this interact with rigid designation? The secondary intension would have to be fixed by the actual world, but the actual world had two kinds. 

  - **Desiderata at Stake**:
    - *Rigid Designation (9)*: If the term becomes ambiguous, then it cannot rigidly designate a single kind. This might force us to give up rigid designation for such terms or to say that the term was never a rigid designator for a single kind (but that seems revisionary).
    - *Link to A Priori Knowability (11)*: The primary intension based on C was a priori knowable, but it did not determine a unique kind. This is acceptable if we allow that primary intensions can be partial or disjunctive. However, then we face the problem that the reference in the actual world was not determined by the primary intension alone (because it picked two kinds). This might require a more complex account of reference-fixing.

  - **Accommodating the Case**: We must allow that the primary intension at the early stage was a function from worlds to the extension determined by C (which in the actual world happened to cover two kinds). At the later stage, we have two distinct terms (or two senses) with their own primary intensions (each tied to a refined conception). This means that the framework must allow for dynamic updating of primary intensions based on new information. However, this might conflict with the a priori knowability of the primary intension (if updating is a posteriori).

  ### Flagging Conflicts

  - **Conflict 1**: **Rigid Designation (9)** vs. **Handling Fragmentation**.  
    In the fragmented case, if the term 'X' is to rigidly designate, then it must pick out the same kind in every possible world. But if the community splits and uses 'X' for two different kinds, then we cannot maintain that the same term rigidly designates one kind. We might have to say that the term was never a rigid designator (which challenges the direct reference picture) or that the term now has two rigid designators (which breaks compositionality because the same term in the same context would have two referents).

  - **Conflict 2**: **Primary Intension as A Priori Accessible (11)** vs. **Dynamic Updating in Fragmentation**.  
    The primary intension is fixed by the reference-fixing description, which is a priori. But in the fragmented case, the reference-fixing description (conception C) is discovered to be inadequate. The update to two new conceptions (C1 and C2) is a posteriori. How can the primary intension change based on a posteriori facts? This seems to break the a priori link.

  - **Conflict 3**: **Compositionality (10)** vs. **Ambiguity in Fragmentation**.  
    If the same term 'X' now has two meanings (and hence two primary intensions), then compositionality might require that we disambiguate at the level of syntax (e.g., by positing two lexical entries). But if the fragmentation is not yet reflected in the syntax (i.e., speakers use the same word without realizing ambiguity), then compositionality would require that we assign one meaning to avoid ambiguity. But that one meaning would be inadequate.

  ### Which Requirement Rules Out the Most?
  The requirement that **the framework must not merely relocate the puzzle of cognitive significance (12)** is particularly powerful. Many frameworks (like descriptivism) relocate the problem to the level of descriptions. Similarly, in the fragmented kind case, if we try to solve the problem by saying that the primary intension was always disjunctive, then we might be relocating the problem of cognitive significance (because now we have to explain why the disjunctive intension was not apparent to the speakers). This requirement forces the framework to provide a genuine solution.

  ### What Would Change My Mind?
  - **Argument against the necessity of rigid designation for natural-kind terms**: If it could be shown that natural-kind terms are not rigid designators in the strong sense (e.g., because they can shift reference or are context-sensitive), then we might drop requirement (9) for such terms. This would resolve Conflict 1.

  - **Argument for dynamic primary intensions**: If it can be argued that primary intensions are not fixed once and for all but can be updated (and that such updating is compatible with a priori knowledge if the update is based on a priori reflection on the original conception), then Conflict 2 might be resolved. However, this would require rethinking the a priori link.

  - **Evidence of compositionality with ambiguity**: If we can show that natural language handles ambiguity without breaking compositionality (e.g., by context or by hidden variables), then Conflict 3 might be resolved. But note: the fragmentation case is not just lexical ambiguity but a case where the same utterance by a speaker might be indeterminate between two meanings (because the speaker hasn't chosen a side). This might be harder to handle.

  ### Where My Reasoning is Most Vulnerable
  I judge the reasoning about the fragmented kind case to be the most vulnerable. It assumes that the primary intension must be fixed by the initial conception and that the fragmentation forces a split in the primary intension. But perhaps the framework can treat the initial primary intension as a single (albeit vague) function that, in the actual world, picked a disjunctive kind. Then, after the split, we have two new terms with new primary intensions. This might preserve rigid designation for the new terms and avoid dynamic updating of the old term's intension. However, this leaves the status of the old term unclear. Moreover, it might break the link to cognitive significance because the old term's primary intension (disjunctive) would not match the cognitive content of the speakers (who might have thought they were talking about a single kind).

  ## Conclusion
  The list of desiderata is demanding, and the fragmented natural-kind case exposes tensions. The requirement that the framework not merely relocate the puzzle of cognitive significance (desideratum 12) is the most stringent, and rigid designation (9) is the most challenged in the fragmentation case. The framework must navigate these carefully, and the fragmented kind case may force a revision of how we think about the primary intension and rigid designation.
answer: |-
  ### Desiderata for a Two-Dimensional Framework  
  Below, I outline the core requirements for an adequate two-dimensional framework, organized by **data reproduction**, **distinctions to preserve**, and **theoretical constraints**. I then address the fragmented natural-kind case, conflicts between desiderata, and key vulnerabilities.  

  ---

  #### **I. Data the Framework Must Reproduce**  
  1. **A Posteriori Necessities**  
     - *Motivation*: Kripkean examples (e.g., "Water is H₂O") show that some necessary truths are only discoverable empirically. The framework must explain how such truths are *necessary* (true in all metaphysically possible worlds) yet *a posteriori*.  

  2. **Necessary A Posteriori**  
     - *Motivation*: Closely tied to (1), this requires distinguishing epistemic from metaphysical possibility. Speakers can conceive of scenarios where water isn’t H₂O (epistemic possibility), but these are metaphysically impossible.  

  3. **Contingent A Priori**  
     - *Motivation*: Statements like "Stick S is one meter long" (where "one meter" is defined by S) are knowable without experience but contingent (S could have been shorter/longer). The framework must capture how context fixes reference a priori while allowing contingency.  

  4. **Cognitive Significance of Co-referential Names**  
     - *Motivation*: "Hesperus is Phosphorus" is informative despite coreference, unlike "Hesperus is Hesperus." The framework must explain this cognitive difference without invoking Fregean senses as independent entities.  

  5. **Failure of Substitutivity in Attitude Contexts**  
     - *Motivation*: Substituting coreferential terms (e.g., "Superman" for "Clark Kent") in belief reports can alter truth values. The framework must explain this using semantic resources (e.g., primary intensions) without ad hoc pragmatics.  

  ---

  #### **II. Distinctions the Framework Must Preserve**  
  6. **Epistemic vs. Metaphysical Modality**  
     - *Motivation*: Conflating these collapses the necessary a posteriori into a contradiction. Epistemic modality concerns conceivability (e.g., "Water isn’t H₂O"); metaphysical modality concerns possible worlds (e.g., water is H₂O in all worlds).  

  7. **Primary vs. Secondary Intensions**  
     - *Motivation*: Primary intensions (functions from *scenarios* to extensions) reflect reference-fixing conditions and epistemic access. Secondary intensions (functions from *worlds* to extensions) capture rigid designation and metaphysical necessity. Collapsing these erases the explanatory core of two-dimensionalism.  

  8. **Context-Sensitivity vs. Contingency of Reference**  
     - *Motivation*: Indexicals (e.g., "I") are context-sensitive but rigid—their reference doesn’t vary across worlds. Natural-kind terms (e.g., "tiger") are contingent in reference-fixing (we might have dubbed a different species "tiger") but rigid once fixed. The framework must separate context-dependence (pragmatics) from contingency (metaphysics).  

  ---

  #### **III. Theoretical Constraints**  
  9. **Rigid Designation / Direct Reference**  
     - *Motivation*: Kripke showed that names/natural-kind terms designate the same object in all possible worlds. The framework must align secondary intensions with rigidity (constant functions across worlds).  

  10. **Compositionality**  
      - *Motivation*: The meaning of complex expressions (e.g., "water is clear") must derive from parts and structure. Primary/secondary intensions must compose systematically to avoid ad hoc semantics.  

  11. **Primary Intension ↔ A Priori Knowability**  
      - *Motivation*: Primary intensions must reflect what speakers can know independently of experience (e.g., "water" refers to *the clear, drinkable liquid in our environment*). This anchors cognitive significance.  

  12. **No Relocation of Cognitive Puzzles**  
      - *Motivation*: The framework must *explain* cognitive differences (e.g., Hesperus/Phosphorus) via primary intensions, not just shift the problem to a new level (e.g., by making primary intensions themselves mysterious).  

  ---

  ### **IV. The Fragmented Natural-Kind Case**  
  #### **Case Description**  
  A term "X" is introduced by a community based on a conception *C* (e.g., "shiny, conductive metal"). Later, "X" is found to denote two distinct kinds (X₁ and X₂; e.g., platinum and palladium). Competent speakers diverge: some use "X" for X₁, others for X₂.  

  #### **Requirements for the Framework**  
  - **Earlier Stage**:  
    - The primary intension must be defined by *C* (e.g., "the metal with properties *P*"). It picks out whatever satisfies *C* in a scenario, even if *C* ambiguously covers multiple kinds.  
    - The secondary intension is rigid but *indeterminate*: it picks out the actual extension of "X" (X₁ ∪ X₂) in all worlds, as the community hasn’t distinguished X₁/X₂.  

  - **Later Stage**:  
    - Post-fragmentation, "X" splits into two terms: "X₁" and "X₂," each with distinct primary intensions (e.g., X₁: "the *P*-metal with atomic number 78"; X₂: "the *P*-metal with atomic number 46").  
    - Secondary intensions become determinate: rigidly designating X₁ or X₂ respectively.  

  #### **Theoretical Implications**  
  - **Desiderata Under Pressure**:  
    - **Primary Intension ↔ A Priori Knowability (11)**: At the earlier stage, speakers could not know a priori that "X" was heterogeneous. The framework must allow primary intensions to be *partial* or *ambiguous* without implying speakers grasp this ambiguity.  
    - **No Relocation of Puzzles (12)**: If primary intensions are disjunctive (e.g., "X" = X₁ ∨ X₂), cognitive significance is relocated to "why didn’t speakers know it was disjunctive?" The framework must avoid this by treating fragmentation as a *semantic externalism* case: reference is fixed by external factors beyond speakers’ conception.  
  - **Accommodating the Case**:  
    The framework must allow primary intensions to be **world-sensitive**: in worlds where *C* uniquely picks one kind, "X" rigidly designates it; in worlds like ours (with fragmentation), "X" is polysemous. This preserves rigid designation (9) and compositionality (10) *after* fragmentation but requires relaxing the determinacy of early-stage primary intensions.  

  ---

  ### **V. Conflicts Between Desiderata**  
  #### **Flagged Incompatibilities**  
  1. **Rigid Designation (9) vs. Primary Intension Determinacy (11)**  
     - *Conflict*: Rigidity demands stable secondary intensions, but fragmented cases show early-stage primary intensions (which fix reference) can be indeterminate. If primary intensions are world-sensitive, rigidity holds only *after* reference-fixing.  
     - *Resolution*: Sacrifice **determinacy in primary intensions (11)** for early-stage terms. Speakers can’t always know a priori if their conception uniquely picks a kind.  

  2. **Compositionality (10) vs. Cognitive Significance (4, 12)**  
     - *Conflict*: Compositionality favors coarse-grained meanings; cognitive significance needs fine-grained primary intensions. In fragmented cases, compositionality might require treating "X" as univocal pre-fragmentation, but this obscures later divergence.  
     - *Resolution*: Allow lexical ambiguity post-fragmentation, violating **elegance in compositionality (10)** but saving cognitive significance.  

  #### **Most Exclusionary Requirement**  
  - **No Relocation of Puzzles (12)** rules out:  
    - Frameworks where primary intensions are covert descriptions (relocates significance to "which description?").  
    - Frameworks treating primary intensions as purely internal (fails externalism in natural-kind terms).  
    This excludes descriptivist-leaning 2D systems (e.g., Jackson’s) and favors externalist ones (e.g., Chalmers’).  

  ---

  ### **VI. What Would Change My Mind**  
  #### **Revisiting Necessity/Joint Satisfiability**  
  - **Argument Against Rigid Designation (9)**: If shown that natural-kind terms *must* be non-rigid to handle fragmentation (e.g., "X" refers to X₁ in some worlds, X₂ in others), I would drop (9) for kind terms. *Counter*: This collapses Kripke’s insights and conflates contingency with context-sensitivity (8).  
  - **Evidence for Internalism**: If empirical work shows speakers’ conceptions *always* determine reference (e.g., via psychological essentialism), I would relax **externalism in (11)**. *Current view*: Externalism is non-negotiable for natural kinds.  
  - **Compositionality Failure**: If fragmented cases prove language is non-compositional (e.g., "X + predicate" behaves chaotically pre-fragmentation), I would weaken (10). *Unlikely*: Compositionality is non-negotiable for systematicity.  

  #### **Where My Reasoning is Most Vulnerable**  
  - **Primary Intensions as World-Sensitive**: This solution to fragmentation risks making primary intensions *too dynamic*, undermining their a priori status (11). If fragmentation shows primary intensions must be revised *a posteriori*, the framework’s epistemic foundation crumbles.  
  - **Assessment**: My reliance on **semantic externalism** may overcorrect, underestimating how conceptions constrain reference. If conceptions are metaphysically decisive, not just epistemic, the fragmented case becomes a problem for rigidity (9), not just primary intensions.  

  ---

  ### **Summary**  
  An adequate two-dimensional framework must satisfy all 12 desiderata, with **fragmentation cases** testing the limits of **primary intension determinacy (11)** and **rigidity (9)**. The strongest constraint is **no relocation of puzzles (12)**, excluding frameworks that "solve" cognitive significance opaquely. To handle fragmentation, primary intensions must be world-sensitive and sometimes indeterminate—prioritizing externalism over epistemic transparency. The largest vulnerability lies in balancing dynamic reference-fixing with the a priori status of primary intensions.
