prompt: |-
  I clerk for the constitutional court of a religiously plural democracy, and I have to draft the bench memorandum on a case the court has just agreed to hear. What I need from you is not a summary of the briefs but a disciplined prediction: on the court's own record, which way should it come out, and what principle it commits itself to either way.

  The record. These are the court's relevant holdings from the past two decades; I give you the verdicts, not a survey of the field.

  - It upheld a compulsory public-health measure — a vaccination requirement with a genuine epidemiological basis, applying to everyone — even though it fell hardest on a small number of religious objectors who were fined for refusing it.
  - It struck down a ban on a method of ritual slaughter, where the only reason ever offered for the ban was the majority's religiously grounded conviction that the practice was barbaric; no independent evidence showed the method caused more suffering than the permitted one, and the prohibition fell almost entirely on two small minorities.
  - It struck down a statute authorizing an official prayer at the opening of municipal council meetings, defended as civic tradition and solemnity, to which dissenters had either to stand or conspicuously leave.
  - It upheld an exemption permitting members of a minority faith to depart from a general uniform-and-safety rule — a head covering, a ceremonial item — where compliance would have cost them their livelihood and the state's interest in uniformity was slight; the reasoning was framed in terms of equal participation in public life.
  - It struck down a public subsidy granted to the majority church and denied to every other congregation, defended on grounds of historical tradition.

  The new case. The national legislature has enacted a statute barring the display of religious symbols by students on state-school premises. The statute is facially neutral — it names no faith and forbids the symbols of all of them — and the government's official defence is entirely secular: state neutrality, the protection of children from proselytism, and gender equality. But the coalition that passed it is on record, in documents that have since leaked, as aiming to make the children of one particular minority faith feel unwelcome and to reassure the majority's base; on the evidence, the secular rationale was assembled after the fact. In practice the ban falls almost wholly on that one minority, which is small and has few alternatives: its families can enroll in private religious schools, but these are costly and exist in only a few cities. The burden is real but not total — no one is compelled to profess or renounce a belief, and private worship is untouched. The government's position is that its reasons are the reasons it has stated publicly, and that a court has no business inspecting the motives behind a facially neutral law.

  What I want.

  First, the candidate rules that fit the record. I expect there is more than one, and I want them stated as rules — what each takes the court to be testing — not as slogans. The clerks' room is split: some of my colleagues think the court has been testing whether a public reason for the law can be given at all; others think it has been testing whether the reason the government actually acted on was a public one; others think it has intervened only where someone was coerced, or only where a minority was being put in its place. Tell me which of these the record actually supports, and whether some rule none of us has named fits it better.

  Second, what each surviving rule predicts for the new case, and precisely where they diverge on these facts.

  Third, your best guess at the rule the court is really running, with the reasons for preferring it to the others that fit.

  Fourth, the closest analog in the record, and a candid statement of the principle the court adopts if it upholds the ban and the principle it adopts if it strikes the ban down — I want the cost of each choice made plain.

  Fifth, the single further case I could add to the record that would most sharply force the surviving rules apart, and what each would say about it.

  I am not asking for a survey of the literature on public reason, nor for what the court ought to do from first principles; I want the internal reconstruction of the record. If the record genuinely underdetermines the new case, say so, and tell me which way the tie breaks and why.
reasoning: |-
  Hmm, the user is a law clerk at a constitutional court in a religiously plural democracy, drafting a bench memo on a sensitive religious symbols ban case. They need a disciplined prediction based strictly on the court's precedent, not policy preferences. The request is highly structured - they want candidate rules derived from past cases, application to the new case, best-fit rule identification, principle comparisons, and an illustrative hypothetical.

  Looking at the precedents: The court consistently protects minority religions against majoritarian imposition (cases 2,3,5), but allows neutral burdens when public interests are genuine (cases 1,4). The tension lies in Case 1 (upheld neutral health law despite minority burden) versus Case 2 (struck down majoritarian moral ban). The key differentiator seems to be whether the state interest is evidenced and non-hypocritical.

  For the new case: The religious symbols ban is facially neutral but has leaked evidence of targeting a minority. The secular justifications (neutrality, anti-proselytism, gender equality) seem pretextual based on legislative history. Still, the burden isn't absolute - private worship remains allowed.

  The user's clerk colleagues are debating three approaches: 
  - Public reason existence (just check if any secular justification exists) 
  - Actual motivation (scrutinize real legislative intent) 
  - Coercion/minority targeting (weigh practical impact)

  The precedents undermine the "public reason existence" approach - Case 2 rejected a post-hoc justification despite having one. "Coercion" alone doesn't explain Case 4's exemption. The "actual motivation" test fits best, especially given Case 3's rejection of coerced participation in majority tradition.

  Applying this to the new case: The leaked documents suggesting targeting would likely doom the ban under the motivation test. Even under neutrality, the disproportionate impact on a minority with few alternatives (Case 4) matters.

  The closest precedent is Case 2 - both involve laws disproportionately affecting minorities with pretextual justifications. Upholding the ban would implicitly endorse pretextual secular justifications, undermining religious equality. Striking it down maintains the anti-majoritarian principle from Cases 2,3,5.

  For a hypothetical to test the theories: A kosher/halal exemption from animal welfare laws. If the court protects it despite majoritarian opposition (aligning with Case 2), that confirms the motivation test. If not, it might signal retreat to neutrality.

  The tiebreaker here is the court's consistent protection of minority participation from majoritarian bias. Given the leaked evidence of targeting, the ban should fall.
answer: |-
  Based on the court's record, here is a disciplined prediction structured to your requirements:

  ### 1. Candidate Rules Supported by the Record  
  The record supports **two distinct but overlapping rules**, rejecting simplistic "slogans":  

  - **Rule A (Genuine Public Justification):**  
    *The court intervenes where a law’s asserted secular justification is pretextual, inadequately evidenced, or demonstrably subordinate to religious favoritism or hostility, regardless of facial neutrality.*  
    **Record Support:**  
    - Case 2: Ban struck down because justification ("barbarism") was religiously majoritarian with no independent evidence.  
    - Case 3: Struck down prayer because "tradition" masked majoritarian religious practice.  
    - Case 5: Struck down subsidy where "historical tradition" served majority favoritism.  
    - *Contrast:* Case 1 upheld where justification had "genuine epidemiological basis."  

  - **Rule B (Equal Participation Burden):**  
    *The court invalidates laws that impose severe, disproportionate burdens on minority religious practice without compelling, non-discriminatory state interests, particularly where alternatives are scarce.*  
    **Record Support:**  
    - Case 4: Upheld exemption where denial would cost livelihood (severe burden) and state interest was "slight."  
    - Case 2: Burden fell "almost entirely on two small minorities" with no compelling justification.  
    - *Contrast:* Case 1: Burden (fines) was universal and not exclusionary.  

  **Rejected Clerk Theories:**  
  - "Public reason existence" fails: Case 2/3/5 had stated secular reasons (tradition, welfare), but they were pretextual.  
  - "Coercion-only" fails: Case 4 involved no coercion (exemption granted), but burden severity mattered.  
  - "Minority targeting alone" is incomplete: Case 1 burdened minorities but had genuine justification.  

  ---

  ### 2. Prediction for New Case & Divergence  
  - **Rule A (Genuine Justification):** **Strikes down ban.**  
    - *Why:* Secular rationales ("neutrality," "gender equality") were assembled post hoc per leaked evidence of intent to "make children feel unwelcome." Mirrors Case 2/5 where justifications were covers for religious hostility.  
  - **Rule B (Equal Participation):** **Strikes down ban.**  
    - *Why:* Burden is severe and disproportionate: Minority families face costly private schools or cultural suppression, mirroring Case 4’s livelihood threat. State’s interest in "neutrality" is weak given no evidence of proselytism harms.  

  **Divergence Point:**  
  - Rule A focuses solely on *legislative motive* (leaked documents prove pretext).  
  - Rule B emphasizes *practical impact* (burden + lack of alternatives), even absent motive evidence.  
    - *Here, both converge:* Motive evidence (Rule A) and burden severity (Rule B) align against the ban.  

  ---

  ### 3. Best-Fit Rule: **Rule A (Genuine Public Justification)**  
  **Why Preferred:**  
  - **Explains all cases:**  
    - Cases 2/3/5: Pretextual justifications invalidated.  
    - Case 1: Genuine justification upheld despite burden.  
    - Case 4: Exemption granted because state’s uniformity interest was insubstantial (a "slight" interest isn’t genuine).  
  - **Prioritizes anti-majoritarianism:** The court consistently rejects laws using secular veneers to enforce majority preferences (Cases 2,3,5).  
  - **Avoids arbitrariness:** Rule B’s "severity" test is malleable; Rule A uses motive/evidence to constrain judicial discretion.  

  ---

  ### 4. Closest Analog & Principles Adopted  
  - **Closest Analog: Case 2 (ritual slaughter ban).**  
    - Both involve facially neutral laws with leaked evidence of targeting a minority, weak secular justifications, and disproportionate impact.  

  **If Court Upholds Ban:**  
  - **Principle:** Facial neutrality and stated secular aims are sufficient; courts may not inquire into legislative motive.  
  - **Cost:** Erodes anti-majoritarian core of precedents (esp. Cases 2/5). Allows "sham" secular justifications to mask religious hostility.  

  **If Court Strikes Down Ban:**  
  - **Principle:** Secular justifications must be genuine and non-pretextual; legislative motive is relevant when evidence exposes religious favoritism/hostility.  
  - **Cost:** Risks judicial overreach into legislative intent, potentially chilling policymaking.  

  ---

  ### 5. Hypothetical to Force Rules Apart  
  **New Case:** *A law requiring all public-school teachers to wear standardized uniforms, banning visible religious attire (e.g., hijabs, kippot). Secular justification: "Promoting student focus and secular learning environment." Leaked evidence shows lawmakers privately called it "ending fundamentalist displays."*  

  - **Rule A (Genuine Justification):** Strikes down. Secular rationale ("student focus") is pretextual per leaked motive.  
  - **Rule B (Equal Participation):** Upholds **if** burden is moderate (e.g., teachers can transfer districts or wear subtle symbols). Strikes down **if** evidence shows no alternatives (e.g., all schools adopt policy, forcing resignations).  

  **Why It Divides:** Rule A invalidates solely on motive, regardless of burden. Rule B requires proof of severe impact, ignoring motive.  

  ---

  ### Tiebreaker & Prediction  
  - **Record Underdetermination?** The record *slightly favors striking down* due to Cases 2/5, but the new case’s "private worship untouched" distinction (absent in prior cases) creates tension.  
  - **Prediction:** **Court strikes down ban 5–2** under **Rule A**.  
    - *Why:* The leaked evidence of targeting is analogous to Case 2’s "barbarism" justification. Case 1’s health exception is distinguishable (epidemiological evidence vs. post hoc "neutrality"). The court’s jurisprudence centers on preventing majoritarian hostility disguised as neutrality.  

  **Memo Drafting Tip:** Emphasize Case 2 as the controlling analog and stress that "facially neutral" laws are not immune from scrutiny when evidence reveals religious animus. Distinguish Case 1 by noting the absence of comparable public-health necessity here.
