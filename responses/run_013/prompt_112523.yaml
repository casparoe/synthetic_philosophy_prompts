prompt: |-
  I work on ML systems and have no formal philosophy background, so bear with me. I've come to belive that the brain is literally a computer — not a metaphor. Same sense my laptop is: there are states, there are transitions between them, and those transitions are doing the cognitive work, so neuroscience's eventual job is to say which algorithm it runs. What should make me drop this?

  I want the real defeaters, ranked from fatal to merely annoying, and I want to know which ones someone who holds my view would already admit count against it — not just the critics' list. Two things have me stuck. A colleague says any physical object, a rock for instance, trivially implements some program or other once you're allowed to pick the mapping from physical states to computational ones, so my claim is either vacuous or false unless I can say what 'implements' means beyond 'you can draw a mapping'. And in my own work, the same trained network can be redescribed as a lookup table or as one giant polynomial without obviously losing anything, which makes me wonder whether 'the algorithm it implements' is something I'm choosing rather than something the system has. If that's right, what survives, and is what survives worth having?

  Also, what would count as evidence for the view rather than against it — what does it predict that a rival (say, the brain as a dynamical system that isn't running a program at all) doesn't? No reading list, I won't be looking anything up.

  End with a last line 'Verdict:' followed by exactly one of exposed / partly exposed / well insulated, then a one-sentence summary. American English.
reasoning: |-
  Okay, the user works in ML and believes the brain is literally a computer, not just metaphorically. They want defeaters against this view, ranked from fatal to annoying. They mention two issues: one about rocks implementing any computation if you choose the mapping, and another about neural nets being describable as lookup tables or polynomials. They also want evidence for their view and predictions it makes versus rivals.

  First, I need to address the main problems. The rock example is a classic point from Searle. If any physical system can be mapped to any computation, then saying the brain is a computer becomes vacuous. That's a fatal flaw unless there's a principled way to define "implements" beyond arbitrary mappings. The multiple realizability in neural nets—being described as lookup tables or polynomials—also challenges the idea of a unique algorithm. This suggests that the choice of description is subjective, which is problematic.

  Then there are other issues. Gödel's incompleteness theorems might imply brains can't be formal systems, but Penrose's argument is controversial and not widely accepted. Consciousness and qualia are hard to explain computationally. If cognition is just computation, why do we have subjective experiences? That's a serious challenge. Underdetermination of theory by data means neuroscience might not point to one algorithm. Plus, the brain's messy biology—noise, analog processes, non-computational elements—might not fit the digital compute model.

  For evidence supporting the view, the user needs something that sets it apart. Predictive processing is a good candidate. If neuroscientific data shows the brain uses predictive coding, which is computable, that supports the computational view. Also, neural networks simulating cognitive tasks and brain-inspired AI progress are points in favor. But these aren't exclusive to the computational view; dynamical systems might explain them too. So the evidence isn't decisive.

  The user might already admit the underdetermination and multiple descriptions issues. They work with neural nets, so they know that different representations are possible. The rock problem is external but critical. They probably want to salvage a weaker version: that the brain implements computations, even if not a single algorithm. That's still useful for ML and neuroscience collaboration.

  Ranking the defeaters: Fatal - the rock implementation problem. Serious - multiple realizability, qualia, biological messiness. Annoying - underdetermination and Gödel (if considered).

  Verdict should be partly exposed. The core idea has weaknesses, especially the implementation problem, but isn't completely useless. A summary could be that while the brain computes, the claim that it's "literally a computer" like a laptop is problematic due to arbitrary mappings and multiple descriptions.
answer: |-
  Here’s a breakdown of defeaters for "the brain is literally a computer" (strong computationalism), ranked by severity, including those you’d likely concede, plus evidence/predictions. I’ll stick to your constraints.

  ### **Defeaters (Ranked Fatal → Annoying)**
  1. **The Rock Problem (Fatal)**  
     *Your colleague’s point:* Any physical system (a rock, a waterfall) "implements" any finite computation if *you* freely choose the mapping. Claiming the brain is "literally" a computer thus reduces to "you can assign computational labels to its states," which is trivial. To avoid vacuity, you need a *natural, observer-independent* mapping intrinsic to physics or biology. No such mapping exists. **You’d concede this undermines "literal" truth**—it turns computationalism into a modeling choice, not a discovery about the brain’s essence.  

  2. **Multiple Realizability / No Unique Algorithm (Serious)**  
     *Your neural net example:* A trained network can be described as a lookup table, a polynomial, or a probabilistic graph—all computationally equivalent but algorithmically distinct. If cognition is substrate-independent, which algorithm is "the one" the brain runs? Neuroscience data underdetermines the algorithm (e.g., predictive coding vs. connectionist models fit the same data). **You’d admit this:** Your work shows the algorithm isn’t "in" the system—it’s imposed by your description.  

  3. **Qualia / Consciousness (Serious)**  
     Computation manipulates symbols; it doesn’t explain *why* certain computations feel like anything (e.g., the redness of red). If cognition is just state transitions, why aren’t unconscious machines sufficient? Rivals (e.g., dynamical systems with intrinsic properties) might better address subjective experience. **You’d dismiss this as "hard problem" hand-waving**, but it’s a gap.  

  4. **Biological Messiness (Annoying)**  
     Brains rely on analog processes (e.g., neurotransmitter diffusion), stochastic noise, and continuous feedback loops that don’t cleanly map to discrete state transitions. While you can *approximate* this digitally, calling it "literally" a computer ignores how computation emerges from messier dynamics. **You’d argue ML systems handle noise too**, but it challenges the "same sense as a laptop" claim.  

  5. **Underdetermination by Neuroscience (Annoying)**  
     Even with perfect brain mapping, neural activity patterns won’t uniquely specify a computational model (e.g., is a spike train encoding information or modulating system dynamics?). Rivals (e.g., dynamical systems theory) fit the same data without positing "algorithms." **You’d concede this as a practical ML challenge**.  

  ### **What Survives?**  
  A weaker, instrumentalist view: The brain *can be usefully modeled* as a computer for specific purposes (e.g., vision processing ≈ convolutional nets). This is valuable for building AI and testable cognitive models. But claiming it’s "literally" a computer like your laptop—with a fixed, intrinsic algorithm—doesn’t hold.  

  ### **Evidence For vs. Rivals**  
  Your view predicts:  
  - **Systematic errors** (e.g., cognitive biases) arising from identifiable algorithmic limitations (e.g., resource constraints).  
  - **Neural implementation of computable functions** (e.g., if the visual cortex implements edge detection filters, as in CNNs).  
  - **Success of brain-inspired AI** (e.g., transformers mimicking attention mechanisms).  

  **Vs. Dynamical Systems Rivals**: Your view uniquely predicts cognition is *composable* (complex functions built from simpler modules) and *robust to low-level noise* (like digital error correction). A pure dynamical system might predict seamless analog transitions but struggle with discrete, rule-based reasoning (e.g., logic puzzles).  

  ### **Verdict:** partly exposed  
  The brain computes, but not "literally" like a laptop—its "algorithm" is a description we impose, not a discovery.
