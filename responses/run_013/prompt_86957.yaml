answer: |-
  Below is a direct, critical assessment of your draft based on your numbered requests. I’ve adhered strictly to your constraints: no citations, no manufactured support, uncertainty flagged where applicable, and steps requiring contestable philosophical commitments identified.  

  ### 1. **Central Distinction (Burden vs. Marker Conventions)**  
  The distinction does **real work** in clarifying why burden conventions (e.g., queues) generate obligations while marker conventions (e.g., greetings) do not. However, hybrids (e.g., tipping, door-holding) expose a flaw: your framework treats functions as mutually exclusive, but many conventions *simultaneously* allocate costs *and* signal relationships. Tipping, for instance, materially burdens the tipper (cost allocation) *and* signals respect (relationship marker). Your account must either:  
     - **Explain why one function dominates** (e.g., "tipping is primarily burden allocation because the wage system depends on it"), or  
     - **Acknowledge graded obligations** (e.g., "hybrids create pro tanto obligations proportional to their burden-allocation weight").  
  *Without this, the distinction risks gerrymandering:* You classify tipping as a "burden" to ground obligations but dismiss dress codes as "markers" to avoid overbinding visitors. Contestable premise: That a convention’s "primary" function is self-evident.  

  ### 2. **Loss vs. Denied Gain (Section 2) and Aggregation (Section 4)**  
  - **Loss/denied gain line**: This holds under a **strict deontological view** (no duty to benefit strangers). However, it assumes *material* loss is the only relevant harm (e.g., denying recognition may cause psychological harm you dismiss as "not worse off"). Contestable: Non-material harms (dignity, status) are often ethically material.  
  - **Aggregation (Section 4)**: **Cut it.** Your claim that "trivial losses lack a bearer" is unsustainable. If 1,000 drivers each lose 2 seconds due to jaywalking, society bears the aggregate cost (e.g., traffic efficiency). The queue-jumping vs. jaywalking distinction is arbitrary: Why is repeated harm to one agent worse than dispersed harm? This weakens the essay. **Gain:** Deleting it removes a liability.  

  ### 3. **Adjustment-Cost Asymmetry (Section 5)**  
  This does **independent work**. Rule-utilitarianism would focus on *overall* welfare, but your asymmetry turns on *differential transaction costs*:  
     - Burden conventions: High cost for locals to adjust to unpredictable visitors → visitor obligation.  
     - Marker conventions: Low cost for locals to interpret foreignness → host obligation of charity.  
  This is a coordination-cost argument, not utility maximization. It holds if we accept that *unpredictability* (not just harm) can ground obligations.  

  ### 4. **Counterexample and Diagnosis**  
  **Counterexample:** A visitor wears religious attire in a secular workplace where "neutral dress" is a local marker convention (signifying professionalism). Locals perceive this as expressing contempt for secular norms.  
     - **Your account’s failure**: This is a marker convention (low material burden), so visitors shouldn’t be bound. Yet the visitor’s non-compliance imposes a *relational cost* (undermining cohesion) and potentially material losses (e.g., distracted colleagues).  
     - **Broken premise**: That marker conventions *only* deny "expected benefits" with no collateral losses. Here, non-compliance creates new burdens (social friction), blurring your distinction.  

  ### 5. **Concluding Inversion (Section 7)**  
  This is a **genuine implication**, not a reductio. If burden conventions bind due to imposed losses (e.g., tangible costs from skipping a tip) while markers rely on symbolic recognition (e.g., bowing), then outsiders *should* prioritize burden compliance. The inversion follows from your core premises—but its plausibility hinges on accepting that psychological/social harms (e.g., feeling disrespected) are not "losses" in the relevant sense. *This is contestable and needs explicit defense.*  

  ### 6. **Paragraph to Delete**  
  **Delete the milling-at-a-counter example (end of Section 6).**  
     - **Loss**: Removes a concrete test of your theory’s counterintuitive edge.  
     - **Gain**: The example undermines your account by admitting you "distrust" your own conclusion. It highlights a vulnerability (your framework struggles with conventions lacking clear losers) without resolving it. Retaining it invites skepticism; deleting it strengthens rhetorical confidence.  

  ---

  ### Summary of Key Concerns  
  - **Urgent fix**: Address hybrid conventions (burden + marker) explicitly.  
  - **Cut Section 4** (aggregation) entirely—it is unsalvageable as stated.  
  - **Flag contestable premises**:  
    - Only *material* losses ground obligations (Sections 2, 7).  
    - "Identifiable parties" requirement ignores systemic/diffuse harms (Section 3).  
  - **Strengths**: The visitor asymmetry (Section 5) is novel and persuasive; the inversion (Section 7) is logically sound but provocative.  

  The draft is rigorous but occasionally sacrifices nuance for clarity. Prioritize refining the burden/marker boundary and jettison weak points.
