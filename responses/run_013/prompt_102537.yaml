prompt: |-
  I'm in a decision theory seminar this term and for the final paper I'm supposed to write up something in the style of an adversarial collaboration, and superrationality is the topic I got stuck with. So here's the ask: please take on the role of a philosopher of decision theory who actually knows this literature cold, think carefully before you write (start with a short brainstorm of what each side would refuse to give up, then draft), and give me the document itself. What I need is the joint statement that a committed superrationalist and a committed causal decision theorist could both put their names to. By superrationalist I mean the Hofstadter-style position: in a one-shot Prisoner's Dilemma, if you know the other player is the sort of agent who reasons to the same conclusion you do, you cooperate, and the thought that you could unilaterally defect is somehow an illusion, because your defecting would just be their defecting too. The causal theorist is the one who says none of that machinery changes what's at stake, since your action doesn't cause theirs, and in a genuinely one-shot anonymous game with no causal channel between you, defecting is simply what maximizes. I want to see how far these two can actually get, and where they can't.

  Format it as a numbered section of agreed claims (things like what the game's Nash structure is, what a unilateral deviation even means once you assume identical reasoning, whether the dispute survives if we drop the symmetry) followed by a disagreements table, where each row states the residual disagreement in wording that the side it belongs to would accept as fair, not as a strawman. Then the cruxes: the sub-questions such that settling one would actually move somebody. I suspect one crux is whether the identity of your reasoning with the other player's is a causal handle or an evidential one, another is whether superrationality is a separate decision theory or a heuristic that lives inside the standard framework, and a third is whether cooperation in the one-shot case is being smuggled in from a repeated-game intuition, so test that. For each crux, give me a concrete case or argument that both sides would agree bears on it, with each side's prediction written down in advance. Some cases worth running: the perfect-copies case where you and the other player are two instances of the same source code; a case where the correlation between your reasoning and theirs is only probabilistic (say you're both drawn from a population with a common observable trait), so the inference is statistical rather than deductive; and a case with an added pre-play public randomization device, so the correlated-equilibrium reading is on the table. Also, if you think part of their fight is really verbal, say which part and why.

  Two things on style. Don't just lay out the options and leave me to choose: take a definite position on which crux is the load-bearing one and say where you think the truth actually lies, with reasons, even if that means coming down against one of the two camps. And if any of this leans on a contestive reading of what superrationality is supposed to commit you to, flag it in a short note at the end rather than quietly picking a side. Assume whoever reads this can't look anything up, so keep it self-contained and don't point me at papers.
