prompt: |-
  Ok so I've gotten way too into the absent-minded driver problem and I need help figuring out what in that neighborhood is actually worth a year of my life.

  The setup, in case it matters for your answer: you're driving home, there are two exits, the second one's the good one, and when you're sitting at an exit you can't tell whether it's the first or the second. The standard punchline is that the best you can do is a policy that sometimes takes the first exit — which you'd never do if you knew you were at the first exit. So the plan you'd pick from the armchair and the thing you'd do if you could see where you were come apart. The part that keeps me up: the probability you're at the first exit, given that you're at an exit at all, depends on the policy you're in the middle of choosing. Circular. You can't do the local calculation without already having the answer.

  Heres the twist I actually care about though, and I think the memory loss is a red herring. The driver's real problem is that he can't take his own past self's reasoning as evidence. Hand him a note in his own handwriting that says you're at the first exit. Should he believe it? If yes, the problem dissolves. If no, why not? I take a strangers note as evidence all the time. Why is my own past self's note different — is it because I know I might have written it while confused, and he knows the same thing? It feels like the same thing that happens when I can't trust a plan I made last night, or when an agent can't afford to re-derive its policy at every step and just has to trust the plan. Is that a real open question or just the same paradox restated in fancier words?

  So: I've got about a year and a half that's mine to spend on one question, decent math and probability, no game theory training. Which open questions in this corner matter most, and which one should I actually work on? Please rank them, and I care way more about the reasoning then the list. For each one: is it upstream of the others or downstream, is it tractable for someone with my background or does it need machinery I don't have, is it neglected or has it been picked over, and what would move it up or down the ranking over the next year or so. Also tell me which of the supposedly open questions here are really the same question wearing a hat, and which ones only look open. No reading list, I want the argument.
