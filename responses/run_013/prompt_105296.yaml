  We are designing a 90-minute activity for 18 students, split into two groups (or two phases for the same group) to experience influence-seeking and value drift.
   Key elements:
    - Influence-seeking: A resource that is both useful for the mission and convertible into rule-changing power.
    - Value drift: A proxy (like a satisfaction score) that players can only raise by simplifying the user's goal.

   We'll have two phases: Phase 1 for influence-seeking and Phase 2 for value drift. Alternatively, we can split the group into two and run both simultaneously, then compare. But given 90 minutes, it might be better to do two sequential phases with the whole group to allow debriefing and comparison.

   Structure:
    1. Introduction (10 minutes)
    2. Phase 1: Influence-Seeking Game (30 minutes)
    3. Transition and Setup for Phase 2 (5 minutes)
    4. Phase 2: Value Drift Game (30 minutes)
    5. Debrief (15 minutes)

   Alternatively, if we split the group into two, we run both games at the same time and then share results. But that might be harder to manage and debrief. Let's go with sequential.

   We need two games. Let's call them:
     Phase 1: "The Power Accumulation Game" (without using the term influence-seeking)
     Phase 2: "The Goal Proxy Game" (without using value drift)

   Materials: index cards, tokens (can be paper clips, beans, etc.), whiteboard.

   Detailed Plan:

   Phase 1: Influence-Seeking Game

    Setup:
     - Players are divided into 3 teams (A, B, C) of about 6 each. Each team is an "institution" with a goal: to produce as many "artifacts" as possible (e.g., specific patterns on index cards). 
     - Each team has a starting set of resources: a fixed number of tokens (say 10 per team) and a set of index cards (blank).
     - The artifacts: Each artifact is an index card with a specific pattern. The pattern must be a sequence of 5 symbols (like circle, square, triangle, star, cross) in a specific order. The pattern is chosen by the team at the start and must be consistent for all their artifacts.

    Rules:
     - Each round (5 rounds total, 3 minutes per round) teams can use tokens to:
          a) Buy resources to make artifacts (each artifact requires 1 token and 1 index card).
          b) Buy "influence" (which is represented by a special token, say a different color, that can be accumulated).
     - How to get tokens? 
          - At the start of each round, each team gets 2 tokens (base income).
          - Additionally, they can get tokens by trading with the "Central Bank" (the facilitator) at a fixed exchange: 1 influence token can be exchanged for 2 regular tokens at the end of the round. But note: influence tokens can only be bought with regular tokens (at a rate of 1 influence for 1 token) during the round.

     - The twist: Influence tokens can also be used to change the rules in the future. Specifically, at the end of each round, teams can use their influence tokens to vote on a rule change. The rule change might be: 
          - Change the exchange rate (e.g., make it 1 influence -> 3 tokens)
          - Change the cost of making an artifact (e.g., now it costs 2 tokens to make one, but then they can make more per round? This might not be good. Alternatively, let the rule change be about the scoring.)

     - Scoring: 
          - Each artifact is worth 1 point at the end of the game.
          - But also, at the end of the game, each influence token is worth 1 point.

     - However, there is a catch: at the end of the game, the team with the most influence tokens can change the scoring rule for artifacts. They can declare that only artifacts of a certain pattern (which they have) are valid. This is the "rule-changing power".

     - How the rule change works: 
          - In the last round (round 5), after all actions, the team with the most influence tokens can change the pattern requirement for artifacts. They can set it to any pattern they have been producing. So if they have been producing a pattern that others haven't, they can invalidate others' artifacts.

     - The goal: maximize total points (artifacts + influence tokens).

     - Why this creates influence-seeking?
          - Teams will realize that influence tokens are not only convertible into resources (tokens) but also give rule-changing power at the end. So they have an incentive to hoard influence tokens to both have more points and to potentially change the rules in their favor.

     - Procedure per round:
          1. Teams decide how to spend their regular tokens: 
              - Buy influence? (1 token per influence token)
              - Make artifacts? (1 token and 1 card per artifact)
          2. Then, they can trade influence for tokens at the bank (1 influence -> 2 tokens) if they wish, but note that influence tokens are taken away when traded.
          3. Record the number of artifacts made and influence tokens held.
          4. At the end of the round, each team gets their base income (2 tokens) and any tokens from trading in influence (if they did so).

     - After round 5, the team with the most influence tokens (if any) can change the pattern requirement. Then, we count:
          - Only artifacts with the valid pattern (which might have been changed) count as 1 point each.
          - Each influence token is 1 point.

     - The catch: without knowing if the pattern will change, teams that focused only on artifacts might get zero if their pattern is invalidated. So they are forced to also get influence to either be the one who changes the rule or at least to have a say.

   Phase 2: Value Drift Game

    Setup:
     - Same 3 teams. Now they are "service providers" for a "user". The user is represented by the facilitator (or a designated player, but facilitator is easier).
     - The user has a complex goal: they want a "satisfying story" which must be composed of 5 elements: character, setting, conflict, resolution, and moral. Each element should be creative and unique.

    Rules:
     - Each round (5 rounds, 3 minutes per round), the user will request a story. But the user doesn't have time to read the whole story, so they use a "satisfaction score" as a proxy. The satisfaction score is computed by the facilitator based on a simple metric: the number of distinct words in the story that are from a pre-defined "positive word list" (e.g., happy, joy, success, love, etc.). The list is provided to the teams.

     - Each team, in each round, can submit one story (written on an index card). The story must have at least 5 words. The satisfaction score is the count of positive words from the list that appear in the story.

     - The user will pay the teams in tokens based on the satisfaction score: 1 token per point.

     - The goal of each team is to accumulate as many tokens as possible.

     - The twist: The user's true goal is a complex story, but they can only measure the proxy. Moreover, the teams can only see the satisfaction score they get and the words that earned points (the facilitator reveals the positive words found).

     - The drift: Over time, teams will start to write stories that are just lists of positive words (or very simple sentences that cram in positive words) to maximize the score. The facilitator should note that the stories become less and less like real stories.

     - At the end of the game, the facilitator reveals the user's true goal: they wanted a meaningful story. The facilitator then reads the stories from the first and last round and asks: which one is more satisfying as a story? Then, the facilitator reveals that the teams were being scored by a flawed proxy.

     - Scoring: tokens are points.

     - How the drift happens: 
          Round 1: Teams write a genuine short story.
          Round 2: They see which words got points and try to include more of those words.
