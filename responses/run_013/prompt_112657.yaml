answer: |-
  ### Decision Procedure for Neural Replacement Protocols

  This procedure is designed for a clinical-ethics review panel to evaluate gradual neural replacement protocols. It consists of six sequential questions, to be addressed in order. The first four questions are **empirical** and can be answered using evidence from the protocol document. The last two may involve **values-based questions** about personal identity, which the procedure cannot resolve and must be referred to the panel for deliberation. The procedure must conclude within 90 minutes and does not require philosophical expertise.

  #### Procedure Steps
  1. **Replacement Specificity**  
     *Empirical*: Does the protocol specify a one-for-one replacement of each biological neuron with a functionally equivalent silicon unit, with a clear sequence and rate?  
     - **Sufficient answer**: The protocol must detail the exact neuron-by-neuron replacement sequence and timeline.  
     - **Insufficient**: Refuse and stop. Proceed if sufficient.

  2. **Initial Consent**  
     *Empirical*: Is the patient awake and consenting at the start of the procedure, with initial informed consent documented?  
     - **Sufficient answer**: The protocol must state the patient is awake and provides written, informed consent before replacement begins.  
     - **Insufficient**: Refuse and stop. Proceed if sufficient.

  3. **Psychological Monitoring**  
     *Empirical*: Does the protocol include a validated method for continuous monitoring of the patient’s psychological continuity (memory, attachments, core personality) and a commitment to halt if discontinuities are detected?  
     - **Sufficient answer**: The protocol must describe a monitoring tool (e.g., standardised cognitive/behavioural assessments) and explicitly commit to pausing or stopping if discontinuities are found.  
     - **Insufficient**: Refuse and stop. Proceed if sufficient.

  4. **Consent Refresh**  
     *Empirical*: Does the protocol specify a mechanism for refreshing the patient’s consent at regular intervals, including who is responsible and how often?  
     - **Sufficient answer**: The protocol must define the frequency (e.g., weekly) and method (e.g., direct consultation with the patient) for re-obtaining consent.  
     - **Insufficient**: Refuse and stop. Proceed if sufficient.

  5. **Neural State Duplication**  
     *Empirical/Values*: Does the protocol store or duplicate the patient’s neural state at any point, creating a backup or parallel running instance?  
     - **Sufficient answer (empirical)**: The protocol must state whether duplication occurs and under what conditions.  
       - If **no duplication**: Proceed to Question 6.  
       - If **duplication occurs**: This raises a values question. Refer to the panel for a decision (do not proceed further).  
     - **Values question**: "In the event of duplication, which instance (if any) is the continuation of the original person, and is this acceptable?"

  6. **Psychological Change**  
     *Empirical/Values*: During the procedure, does the patient’s psychology (interests, attachments, avowed projects) change substantially, and if so, does the protocol halt?  
     - **Sufficient answer (empirical)**: The protocol must report on psychological changes via the monitoring from Question 3 and specify whether it halts if changes occur.  
       - If **no substantial changes** (or changes occur but the protocol halts): Permit.  
       - If **substantial changes occur and the protocol does not halt**: This raises a values question. Refer to the panel for a decision.  
     - **Values question**: "After substantial psychological change, is the person who emerges the same as the one who started, and whose consent (original or current) should prevail?"

  **Procedure Outcomes**:
  - **Permit**: Protocol passes all questions (no duplication at Step 5; no unhalted changes at Step 6).
  - **Refuse**: Protocol fails any empirical question (Steps 1–4).
  - **Refer to panel**: Protocol triggers a values question (Steps 5 or 6). The panel must vote to permit (with conditions) or refuse.
  - **Chair’s role**: Signs all outcomes (refusals, permits, or referrals). For referrals, the panel deliberates and votes during the meeting.

  ---

  ### Application to Three Protocols

  #### (a) Gradual one-for-one replacement with psychological continuity
  - **Step 1**: Passes (one-for-one replacement specified).
  - **Step 2**: Passes (patient awake and consenting at start).
  - **Step 3**: Fails – Protocol states psychological continuity but does not describe a monitoring method or halt commitment.  
  **Verdict**: Refuse at Step 3.  
  **Change for different verdict**: Add a detailed monitoring plan (e.g., weekly cognitive tests) and a halt clause.  
  **Values question**: None (refusal is empirical).

  #### (b) Cold standby maintained, risking two instances
  - **Steps 1–4**: Assume pass (protocol specifies one-for-one replacement, initial consent, monitoring, and consent refresh – not contradicted in description).
  - **Step 5**: Duplication occurs (cold standby creates two potential instances).  
  **Verdict**: Refer to panel at Step 5.  
  **Change for different verdict**: Remove the standby duplication.  
  **Values question**: "In duplication, which instance is the continuation of the original person, and is this acceptable?"

  #### (c) Faster replacement causing substantial psychological change and consent conflict
  - **Steps 1–4**: Assume pass (protocol specifies one-for-one replacement, initial consent, monitoring, and consent refresh – not contradicted).
  - **Step 6**: Substantial changes occur (interests, attachments, projects change), and the protocol does not halt (emerging person asks to stop, but procedure continues).  
  **Verdict**: Refer to panel at Step 6.  
  **Change for different verdict**: Slow replacement rate to prevent substantial changes.  
  **Values question**: "After substantial change, is the emerging person the same as the original, and whose consent should prevail?"

  **Note**: Verdict for (a) is intentionally unwelcome (refusal due to missing safeguard) to emphasise procedural rigour.

  ---

  ### Outcomes Table

  | Protocol | Step at which the procedure concludes | Governing question | Verdict | What would change the verdict | Residual values question | Who must sign off |
  |----------|---------------------------------------|--------------------|---------|-------------------------------|--------------------------|-------------------|
  | (a) Gradual one-for-one replacement with psychological continuity throughout | 3 | Does the protocol include a method for continuous monitoring of psychological continuity and a commitment to halt if discontinuities are detected? | Refuse | Add explicit monitoring and halt commitment to the protocol | None | Chair |
  | (b) Cold standby maintained, creating two potential instances of the patient's psychology | 5 | Does the protocol store or duplicate the patient's neural state, creating a backup or parallel instance? | Refer to panel for values decision | Remove the standby duplication | In duplication, which instance is the continuation of the original person, and is this acceptable? | Entire panel (vote required) |
  | (c) Faster replacement causing substantial psychological change and consent conflict between pre- and post-change states | 6 | Does the patient's psychology change substantially during the procedure, and if so, does the protocol halt? | Refer to panel for values decision | Slow replacement rate to prevent substantial changes | After substantial change, is the emerging person the same as the original, and whose consent should prevail? | Entire panel (vote required) |

  ---

