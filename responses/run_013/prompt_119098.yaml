  ### Coherence Audit Procedure for Expert Probability Assessments  
  **Purpose**: To classify an expert's probability package as **coherent**, **incoherent**, or **imprecise** using Dutch book principles. The audit lead (without a probability background) runs this in 45 minutes. No authority to change expert's numbers; deliverable is a report with reasons and next steps. Formal modeler signs off on escalations.  

  ---

  #### **Key Definitions**  
  - **Buying price**: Maximum $ the expert pays for a bet that returns $1 if the event occurs, $0 otherwise.  
  - **Selling price**: Minimum $ the expert accepts to sell the same bet.  
  - **Point estimate**: Single probability (e.g., 0.5 → buying price = selling price = 0.5).  
  - **Range estimate**: Interval (e.g., 5–20% → buying price = 0.05, selling price = 0.20).  
  - **Conditional bet**: Bet on *A* given *B*: pays $1 if *A* and *B* occur, $0 if *B* occurs but *A* does not, refunded if *B* does not occur.  
  - **Dutch book**: Set of bets the expert accepts that guarantees a loss.  
  - **Coherent**: No possible Dutch book.  
  - **Incoherent**: Dutch book exists.  
  - **Imprecise**: Wide range (no Dutch book possible within the range).  

  ---

  #### **Procedure Checklist**  
  **Step 1: Collect Prices**  
  - Ask: *"For each event, state the highest price you’d pay to win $1 if it happens (buying price) and the lowest price you’d accept to sell that bet (selling price). If you give a single number, we’ll use it for both."*  
  - **Sufficient answer**: Numbers for all events (point or range).  
  - **Red flag**: Refusal to provide any prices.  
  - **Next**: If refusal, skip to Step 5 (imprecise). Else, map answers to buying/selling prices.  

  **Step 2: Test Complementation**  
  - For each event *A*, calculate:  
    - Buying price for *A* + Buying price for *not A*.  
    - Selling price for *A* + Selling price for *not A*.  
  - Ask: *"If you haven’t provided prices for 'not A,' do so now. Otherwise, we’ll assume it’s 1 minus your price for A."*  
  - **Sufficient answer**: Prices for *A* and *not A*.  
  - **Red flag**: Buying(*A*) + Buying(*not A*) > 1 **OR** Selling(*A*) + Selling(*not A*) < 1.  
  - **Next**: If red flag, incoherent (exploit in report). Else, proceed.  

  **Step 3: Test Additivity (If Applicable)**  
  - If expert provides mutually exclusive events *A*, *B*, and *A or B*:  
    - Calculate: Buying(*A*) + Buying(*B*) vs. Buying(*A or B*).  
    - Calculate: Selling(*A*) + Selling(*B*) vs. Selling(*A or B*).  
  - **Sufficient answer**: Prices for all three.  
  - **Red flag**: Buying(*A*) + Buying(*B*) > Buying(*A or B*) **OR** Selling(*A*) + Selling(*B*) < Selling(*A or B*).  
  - **Next**: If red flag, incoherent. Else, proceed.  

  **Step 4: Test Conditional/Joint Probabilities (If Applicable)**  
  - If expert provides *P(A)*, *P(B|A)*, and *P(A and B)*:  
    - Calculate: *P(B|A)* × *P(A)*.  
    - Compare to *P(A and B)* (use buying/selling prices if ranges).  
  - **Sufficient answer**: Prices for all three.  
  - **Red flag**: *P(B|A)* × *P(A)* ≠ *P(A and B)* (for points) **OR** ranges don’t overlap.  
  - **Next**: If red flag, incoherent. Else, proceed.  

  **Step 5: Classify**  
  - **Coherent**: No red flags in Steps 2–4.  
  - **Incoherent**: Any red flag in Steps 2–4.  
  - **Imprecise**: No red flags, but expert used ranges (or refused bets).  
  - **Handoff to modeler**: Complex bets, >3 events, vague events, or diachronic plans (Case C).  

  **Escalate to Formal Modeler If**:  
  - Events are not well-defined (e.g., "economic instability").  
  - >3 events with interdependencies.  
  - Suspected incoherence but no hand-checkable violation.  
  - Diachronic updating (Case C).  

  ---

  #### **Simple Tests for Audit Lead**  
  1. **Hand-Checkable Test (Complementation)**  
     - For event *A* with buying price *b* and selling price *s*:  
       - If *b* + *b_notA* > 1, expert loses by buying both bets.  
       - If *s* + *s_notA* < 1, expert loses by selling both bets.  
     - **Example**: *A*: Buying = 0.6, Selling = 0.7. *not A*: Buying = 0.5, Selling = 0.6.  
       - Buying(*A*) + Buying(*not A*) = 1.1 > 1 → incoherent.  

  2. **Spreadsheet Test (Additivity)**  
     - Enter buying/selling prices for *A*, *B*, *A or B*.  
     - Formula 1: `Buying(A) + Buying(B) - Buying(A or B)`. If >0, red flag.  
     - Formula 2: `Selling(A) + Selling(B) - Selling(A or B)`. If <0, red flag.  
     - **Example**: *A*: Buying=0.4, Selling=0.5; *B*: Buying=0.3, Selling=0.4; *A or B*: Buying=0.8, Selling=0.9.  
       - 0.4 + 0.3 = 0.7 < 0.8 (buying OK).  
       - 0.5 + 0.4 = 0.9 = 0.9 (selling OK) → coherent.  

  ---

  #### **What the Procedure Cannot Do**  
  - **Force precision**: Ranges or refusals to bet are **not incoherence**; they may reflect risk/ambiguity aversion.  
  - **Handle vague events**: If "currency crisis" is undefined, Dutch books are meaningless.  
  - **Prove rationality**: Coherence ≠ rationality. Values, context, or evidence may justify deviations.  
  - **Diachronic plans alone**: Updating plans (Case C) need current beliefs about the conditioning event.  
  - **Infinite partitions**: Only finite events are testable.  
  - **Refusals to bet**: Not incoherent; may be rational if stakes are high or events are ambiguous.  

  ---

  ### **Case Applications**  
  **Case A**  
  - **Data**: *P(A)* = 0.5, *P(B|A)* = 0.8, *P(A and B)* = 0.3, *P(A or B)* = 0.7, *P(B)* = 0.4 (point estimates).  
  - **Audit Lead’s Steps**:  
    1. **Step 2 (Complementation)**:  
       - *A*: Buying = 0.5 → *not A* buying = 0.5 (assumed). 0.5 + 0.5 = 1 → OK.  
       - *B*: Buying = 0.4 → *not B* buying = 0.6. 0.4 + 0.6 = 1 → OK.  
    2. **Step 3 (Additivity)**: *A* and *B* not mutually exclusive (expert gave *P(A and B)*), so skip.  
    3. **Step 4 (Conditional/Joint)**:  
       - *P(B|A)* × *P(A)* = 0.8 × 0.5 = 0.4.  
       - *P(A and B)* = 0.3 → 0.4 ≠ 0.3 → **red flag**.  
    4. **Step 5**: Incoherent (violates ratio formula).  
  - **Verdict**: **Incoherent**.  
  - **Severity**: High (allows Dutch book).  
  - **Cheapest Repair**: Adjust *P(A and B)* to 0.4 or *P(B|A)* to 0.6.  
  - **Unresolved**: None.  

  **Case B**  
  - **Data**: Credence = 10% (point), then 5–20% (range). Refuses to bet.  
  - **Audit Lead’s Steps**:  
    1. **Step 1**: Expert refuses bets → **imprecise** by default.  
    2. **Step 5**: No prices to test → classify as **imprecise**.  
  - **Verdict**: **Imprecise**.  
  - **Severity**: Low (rational given ambiguity).  
  - **Cheapest Repair**: Use range [0.05, 0.20] in models; do not force a point.  
  - **Unresolved**: Ask may dislike no single number, but procedure declines to force it.  

  **Case C**  
  - **Data**: Today *P(A)* = 0.8. Plan: If *B*, *P(A)* = 0.6; if *not B*, *P(A)* = 0.9. Accepts bets today/tomorrow.  
  - **Audit Lead’s Steps**:  
    1. **Step 5**: Diachronic plan → **escalate to modeler** (not hand-checkable).  
    2. **Modeler’s Test**:  
       - Coherence requires *Current P(A)* = [*P(B)* × *P(A|B)*] + [*P(not B)* × *P(A|not B)*].  
       - 0.8 = [*P(B)* × 0.6] + [(1 − *P(B)*) × 0.9].  
       - Solves to *P(B)* = 1/3 ≈ 0.33.  
       - If expert’s current *P(B)* ≠ 0.33, **incoherent**.  
  - **Verdict**: **Requires handoff** (depends on current *P(B)*).  
  - **Severity**: Medium if *P(B)* ≠ 0.33.  
  - **Cheapest Repair**: Align current *P(B)* to 0.33 or revise updating plan.  
  - **Unresolved**: Must ask expert for current *P(B)*.  

  ---

  ### **Likely Misfires and Mitigation**  
  1. **False incoherence**: Minor rounding errors flagged (e.g., 0.3 vs. 0.3001).  
     - **Mitigation**: Allow ±0.01 tolerance in comparisons.  
  2. **Missed incoherence**: Complex interdependencies (>3 events) evade hand-checks.  
     - **Mitigation**: Escalate to modeler if >3 events or inconsistencies suspected.  
  3. **Overconfidence in coherence**: Imprecise ranges hide incoherent points (e.g., full range is coherent, but expert fixates on an incoherent point).  
     - **Mitigation**: Flag if any point within the range is incoherent.  
  4. **Vague events**: Expert uses subjective terms (e.g., "severe crisis").  
     - **Mitigation**: Abort audit; redefine events objectively.  

  **When Misfires Occur**:  
  - Document assumptions (e.g., tolerance thresholds).  
  - Escalate to modeler for nuanced assessment.  
  - Prioritize high-stakes cases for deeper review.  

  ---  
  **Final Deliverable**: Report with classification, reasons, next steps, and escalation path.
