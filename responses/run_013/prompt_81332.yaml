  I'm a science journalist — I mostly cover stats and the replication crisis — and I've fallen down a rabbit hole on this old paradox about dogmatism. Roughly: if you know something, then you also know that any evidence you might come across against it would be misleading evidence, so you're within your rights to ignore it, and that's supposed to be absurd but nobody seems able to say exactly why. My readers think in priors and likelihoods, not knowledge and justification, so I want the whole thing restated in my vocabulary: credences, conditionalization, likelihood ratios, screening off, sensitivity of posteriors to priors, all that. Build the best version of the argument a Bayesian could give, not the weakest one — in particular work out what it looks like at credence exactly 1 versus 0.99, since I suspect it collapses into 'don't have dogmatic priors' and I want to know if thats right. Then the part I actually need: the residue report. What in the original has no counterpart in my vocabulary at all — I have a hunch that 'misleading evidence' and 'entitled to ignore it' are doing work my stats words literally can't express — and does that gap mean the Bayesians are missing something, or that the philosophers were dressing up a point about certainty as a point about knowledge? I can read a likelihood ratio but I've never taken a philosophy class, so don't assume I know the literature.
