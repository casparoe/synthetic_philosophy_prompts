prompt: |-
  I'm in this seminar on modality and we keep going around in circles on wether conceivability is ever a guide to possibility, and the more we talk the less I feel like anyone's actually told me what a theory of that link is supposed to deliver. So before I read another paper, just give me the spec. What are the desiderata any adequate theory here has to meet -- the cases it has to get right (zombies, water turning out to be H2O, Goldbach's conjecture, the usual zoo of cases where our modal intuition is supposed to be reliable or supposed to be a trap), the distinctions it can't just wave away (conceivability vs imaginability, prima facie vs ideal conceivability, epistemic vs metaphysical possibility), and the results it can't contradict (the necessary a posteriori, whatever the two-dimensionalists treat as fixed points). For each requirement give me the case or consideration behind it, and mark which ones are negotiable and which are non-negotiable -- I especially want the ones that are jointly unsatisfiable, if there are any, because I half suspect the whole debate is stuck arguing over a package nobody can actually have.

  Here's the thing that set me off, though. My roommate keeps saying LLMs have made conceivability worthless as a guide, since a model will happily spit out a fluent, coherent-sounding description of basically any scenario you name, so if "conceivable" just means "some system can describe it without obvious contradiction," then everything's conceivable and it tells us nothing about what's possible. I think he's conflating two different things but I can't put my finger on what. So add to your list whatever requirement a theory needs in order to tell real conceivability apart from just fluent description of a scenario -- whatever it is the machine is doing -- and tell me which single requirement does the most to kill off the cheap "everything is conceivable" line. I don't need a big scorecard of the famous names, a sentence each at the end is fine.
