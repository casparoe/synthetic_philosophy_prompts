  The user mentioned that simply calling preferences irrational isn't helpful. So the theory must provide actionable recommendations, not just diagnose incoherence. I should flag conflicts between desiderata. For example, independence might clash with accepting Allais patterns as valid. Money-pump arguments could conflict with allowing intransitivities.

  I recall that rank-dependent models like cumulative prospect theory can explain Allais without violating stochastic dominance. But they might be harder to elicit. Ambiguity aversion models like max-min EU handle unknown probabilities but add complexity. The challenge is balancing descriptive accuracy with normative robustness and practicality.

  The user needs to know which desiderata conflict. Keeping independence while accepting Allais as rational might be impossible. Dropping independence allows explaining Allais but risks money pumps. The toughest desideratum is probably the money-pump requirement because many non-EU theories violate it, leading to dynamic inconsistencies.

  Practical constraints are crucial. The theory must work with limited clinic questions and handle repeated choices. Models with stable parameters might help, but if preferences shift, commitment mechanisms are needed. Also, advising for others requires a theory that separates normative advice from descriptive preferences.

  In summary, the theory must explain real behaviors (like Allais), adhere to key norms (dominance, no money pumps), and be practically applicable. Conflicts arise between independence and Allais acceptance, and between descriptive flexibility and avoiding exploitation. Cumulative prospect theory might strike a balance, though it has elicitation challenges. The most restrictive requirement is the no-money-pump condition, as it demands dynamic consistency, which many models don't ensure.
answer: |-
  Here’s a distilled list of desiderata for an adequate theory of rational choice under risk, tailored to your use case. Non-negotiables are marked **(NN)**; others involve tradeoffs. Conflicts are flagged explicitly.

  ---

  ### **Core Desiderata: What an Adequate Theory Must Deliver**
  1. **Handle Real Anomalies as Data (Not Errors)**  
     - *Must explain*: Common-consequence/ratio Allais paradoxes, ambiguity aversion (Ellsberg), preference reversals in dynamic settings, commitment mechanisms, extreme outcomes (death/ruin), St. Petersburg paradoxes.  
     - **Non-negotiable (NN)**: Dismissing Allais as "irrational" is unacceptable for your aid.  
     - *Cost of omission*: Theory fails descriptively; advice ignores actual patient behavior.

  2. **Respect Dominance Principles**  
     - *Stochastic dominance (NN)*: If gamble A always pays ≥ gamble B and sometimes >, A must be preferred.  
     - *Eventwise/mixture dominance (NN)*: If A yields better outcomes in every state, A > B.  
     - *Why NN*: Violations imply recommending strictly worse options; indefensible in health contexts.

  3. **Avoid Exploitability**  
     - *No money pumps/Dutch books (NN)*: Preferences must not permit sequences of choices leading to certain loss.  
     - *Why NN*: Clinicians/patients cannot be advised into self-harm via dynamic inconsistency.

  4. **Actionable Recommendations**  
     - *Must output a choice*: Theory cannot stop at "incoherent"; must resolve conflicts (e.g., via completion rules or structured deliberation).  
     - *Why NN*: "Print the leaflet" constraint.

  5. **Elicitability & Practical Robustness**  
     - *Elicitable from ≤10 clinic questions*: Cannot require 100 pairwise comparisons.  
     - *Robust to probability errors*: Must handle ≈±10% probability noise without flipping recommendations.  
     - *Why NN*: Clinical feasibility.

  ---

  ### **Key Distinctions It Must Preserve**
  6. **Risk vs. Ambiguity**  
     - *Must distinguish*: Known probabilities (risk) vs. unknown/bounded probabilities (ambiguity).  
     - *Why*: Patients treat ambiguous odds (e.g., "30-50% side-effect risk") differently than precise risks.

  7. **Acts vs. Consequences**  
     - *Must not collapse*: Framing (e.g., "lives saved" vs. "lives lost") affects choices; theory must model how outcomes are described.  
     - *Why*: Your Allais framing effects depend on this.

  8. **Incompleteness vs. Intransitivity**  
     - *Must allow incompleteness*: "I don’t know" is a valid response.  
     - *Must forbid cyclic intransitivity*: A>B>C>A violates no-money-pump **(NN)**.

  ---

  ### **Critical Tensions & Conflicts**
  - **Conflict 1: Independence vs. Allais vs. No-Money-Pump**  
    - *Impossible triad*:  
      - Keep **independence** (if A≻B then pA+(1-p)C ≻ pB+(1-p)C)  
      - Keep **Allais as rational** (non-error)  
      - Keep **no-money-pump**  
    - *Resolution required*: **Drop independence**.  
      - *Cost*: Without independence, dynamic choices may require pre-commitment to avoid exploitation.  
      - *Silver lining*: Explains why patients pay to commit (your use case).

  - **Conflict 2: Descriptive Fit vs. Normative Robustness**  
    - Models explaining Allais/ambiguity (e.g., prospect theory) often violate independence, risking money pumps.  
    - "Normativized" models (e.g., EU with errors) dismiss Allais as mistake.  
    - *Your constraint forces*: Accept descriptive fit (Allais as datum) + add commitment mechanisms to block exploitation.

  - **Conflict 3: First-Order Risk Aversion vs. Small/Large Stakes Consistency**  
    - EU requires vanishing risk aversion for small stakes (≈linear utility).  
    - Patients show non-vanishing risk aversion (e.g., rejecting favorable small gambles).  
    - *Resolution*: Drop EU’s cardinality; allow probability weighting (e.g., rank-dependent models).

  ---

  ### **Most Restrictive Desideratum**  
  The **no-money-pump requirement (NN)** kills the most candidates:  
  - Pure prospect theory (original): Violates stochastic dominance.  
  - Regret theory, Fishburn skew-symmetric: Often intransitive.  
  - Heuristics (e.g., minimax): Dutch-bookable.  
  - *Survivors*: Cumulative prospect theory (CPT), ambiguity-averse models (e.g., smooth ambiguity) with dynamic constraints.

  ---

  ### **Short Family Assessment**  
  | **Theory**               | **Fits Allais?** | **No Money Pump?** | **Elicitable?** | **Your Use Case Verdict** |  
  |--------------------------|------------------|--------------------|-----------------|---------------------------|  
  | **Expected Utility (EU)** | ✗ (dismisses)    | ✓                  | Easy            | ✗ Fails Allais-as-datum. |  
  | **Rank-Dependent (RDU/CPT)** | ✓               | △ (static only)   | Moderate*       | ✓ Best fit; needs commitment for dynamics. |  
  | **Ambiguity Models (MEU, α-MEU)** | ✓ (Ellsberg)   | △                  | Hard            | △ Good if ambiguity central; elicitation tough. |  
  | **Regret/Disappointment** | ✓               | ✗ (intransitive)   | Moderate        | ✗ Money-pump risk. |  
  | **Divergence Models (e.g., Koszegi-Rabin)** | △             | △                  | Very Hard       | △ Overkill; poor elicitation. |  

  \* *CPT elicitation: 3-5 parameters (utility curvature, loss aversion, prob. weighting); feasible with smart questionnaires.*

  ---

  ### **What You Must Sacrifice**  
  - **Independence**: Essential for EU; untenable for you.  
  - **Static Simplicity**: Dynamic choices (repeated/re-evaluated gambles) require auxiliary rules (e.g., "commit today to tomorrow’s choice").  
  - **Single Normative Standard**: Choosing for others may need a "veil of ignorance" social welfare function (e.g., Harsanyi).  

  ### **Recommendation for Your Aid**  
  Adopt **Cumulative Prospect Theory (CPT)** with three enforcements:  
  1. **Stochastic dominance built-in** (standard in CPT).  
  2. **Pre-commitment mechanism**: When future preference reversals are anticipated, default to initial choice.  
  3. **For clinicians choosing for patients**: Use a "neutral" probability weighting (e.g., w(p)=p) + patient’s utility curve.  

  This satisfies: Allais-as-datum, no static money pumps, elicitable with 5-7 trade-off questions, handles ambiguity via probability intervals, and outputs decisions.
