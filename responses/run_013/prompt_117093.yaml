prompt: |-
  I just joined the ethics committee at the nursing home where I work (I'm a social worker, not a philosopher, so go easy on me with the jargon). Theres a pattern here that I can't get to sit still, and what I want from you is an answer to what view of a person it's secretly committed to.

  Here's the pattern. A resident signed a living will eight years ago, back when he was sharp: no feeding tube, no antibiotics for pneumonia, if he's got advanced dementia and doesn't know his own family anymore. Now he's got advanced dementia. He doesn't know his wife. He also seems, honestly, fine -- he eats, he smiles at the staff, he likes the music lady. Then he gets pneumonia. Our policy says we follow the paper. Nobody asks him. And if he'd never written anything down we'd treat him without a second thought, because he isn't suffering and nothing says otherwise. Meanwhile the man two doors down who still has capacity refuses his dialysis and we don't dream of overriding him.

  So which one is the patient? It looks like we're saying the competent man is the real one and the man in the bed is... a kind of caretaker of him? Or is it not a claim about identity at all -- just a rule that the earlier decision was the only competently made one, so it wins on competence grounds and not on identity grounds? I want you to tell me which parts of what we do actually need the identity claim and which don't. If you could run the whole thing with no view at all about whether it's the same person, just a view about who was competent when, would the bedside look any different? Could we still say no to the pneumonia?

  Two seperate things that I think are the same puzzle but that people treat totally differently. Some of our psych patients do a psychiatric advance directive -- they write down, while they're well, that if they go manic again they want to be hospitalized, basically pre-consenting to be locked up. I've been told clinics often won't act on those, because you supposedly can't consent in advance to being detained, which is the exact opposite of what we do with the living will. And then theres the guy who signs himself onto the casino's self-exclusion list and comes back a year later asking to be taken off it, and nobody lets him, and I think in some places he can't even keep his winnings. Why does the paper beat the man in one case and not in the other? And nobody will enforce a contract where I agree to sell my kidney, or to become somebody's servant if I lose a bet -- so it definately can't just be that any earlier self can bind a later one.

  Tell me what theory of the person (or of autonomy, or of who counts as the decision-maker) our practice presupposes, what it merely fits with, and what would have to change if we dropped the idea that the earlier self has authority over the later one. If you think the practice is fine as it is but needs a different justification than the one people usually give it, say that too.
reasoning: |-
  Okay, the user is a social worker on a nursing home ethics committee, grappling with complex issues around advance directives and identity. They're clearly intelligent and observant, noticing contradictions in how different types of advance directives are treated. 

  Hmm, their core question is profound: what view of personhood underlies these practices? They've spotted that dementia patients' living wills are strictly followed while psychiatric advance directives are often ignored, and gambling self-exclusion lists are enforced rigidly. That's three parallel scenarios with inconsistent treatment. 

  I should start by validating their excellent observation - this is exactly the kind of pattern ethics committees should examine. They're not overcomplicating things; these are genuine philosophical tensions masked as procedural differences. 

  The key insight they're circling is that competence temporality matters more than personal identity here. The living will case isn't really about whether the dementia patient is the "same person" - it's that we prioritize decisions made during unquestioned competence. Whereas in the psychiatric case, we suddenly become present-focused because current refusal looks like a competence issue. 

  But wait - that psychiatric inconsistency is glaring. Why don't we trust manic patients' prior competent selves like we trust dementia patients' prior selves? Probably because psychiatry historically pathologizes refusal, while dementia refusal is seen as incapacity. That's worth naming as bias. 

  For the kidney/servitude contracts - ah, that's the limiting principle! We don't let past selves violate fundamental rights or human dignity. So it's not just about time or competence, but also substantive limits. 

  What they really need is concrete guidance. I should map: 
  - Which practices actually require "same person" claims? (Surprisingly few) 
  - Where competence timing alone suffices? (Most medical directives) 
  - Where substantive limits kick in? (Psych detention, organ sales) 

  And importantly - how to advocate for consistency. If they honor dementia living wills, they should push to honor psychiatric directives too. The self-exclusion list is the clearest case showing advance consent can work without identity metaphysics. 

  Finally, practical takeaway: their committee could propose treating all advance directives equally unless substantive harm overrides, rather than this inconsistent competence-based shuffle. That would be more philosophically coherent and ethically defensible.
answer: |-
  You've pinpointed a profound and contentious philosophical tension at the heart of clinical ethics – one that exposes hidden assumptions about personal identity, autonomy, and the "self" over time. Your practice isn't *secretly* committed to a single, coherent view; it's navigating conflicting intuitions, often inconsistently. Let's dissect it:

  ### 1. The Core Assumption: The Primacy of the Competent Self & the "Critical Interests" View
  *   **What the Practice Presupposes:** Your nursing home policy prioritizes the **expressed wishes of the competent, earlier self** over the observed preferences or well-being of the incapacitated, later self. This rests on two key ideas:
      *   **Competence as the Gateway to Authentic Autonomy:** Only competent individuals can make truly autonomous decisions. Decisions made while competent are seen as the most reliable expression of a person's "true" values and wishes.
      *   **Critical Interests vs. Experiential Interests:** Philosophers like Ronald Dworkin distinguish:
          *   **Experiential Interests:** What feels good *now* (e.g., smiling at music, enjoying food).
          *   **Critical Interests:** Deeply held values, beliefs, and desires about what makes a life good *overall* or meaningful *as a whole* (e.g., not living in profound cognitive decline, not being a burden).
      *   **The Practice's Implicit Claim:** The competent self, foreseeing future incapacity, is making decisions based on *critical interests* – what they believe is essential for a dignified life narrative consistent with their identity. The incapacitated self, lacking the cognitive capacity for complex reasoning and value judgments, is seen as governed only by *experiential interests*. The policy assumes **critical interests trump experiential interests** when competence is lost, especially when the competent self explicitly anticipated this state.
  *   **Does it Need an Identity Claim?** Surprisingly, **no, not fundamentally.** The justification primarily rests on **competence at the time of decision-making and respect for prior expressed wishes**, *not* a metaphysical claim that the person in the bed is a different entity. You *could* justify the pneumonia decision purely on grounds of:
      *   **Procedural Autonomy:** We respect the *process* of autonomous decision-making that occurred when capacity was present.
      *   **Best Interpretation of Wishes:** In the absence of current capacity, the best evidence of the patient's wishes is the clear directive they left when capable.
      *   **Precedent & Reliability:** Competent decisions are more reliable indicators of deeply held values than the fleeting preferences or lack of resistance of someone with severe dementia. *If you dropped the identity claim*, you could still argue that respecting the competent prior decision is the most coherent and respectful approach to honoring a person's life narrative as a whole. The bedside looks the same: "No" to antibiotics.

  ### 2. The Contradictions You Spot: Where the Theory Cracks
  Your brilliant observations highlight where this "primacy of the competent self" framework breaks down or is applied inconsistently:
  *   **The Man Refusing Dialysis:** This fits perfectly. He *is* competent *now*. His current refusal *is* an expression of his current critical and experiential interests. Respecting him requires honoring that refusal.
  *   **Psychiatric Advance Directives (PADs):** This is the starkest contradiction. The logic used for dementia living wills *should* apply: The competent self, anticipating mania (a state where capacity is often impaired), pre-consents to hospitalization, arguably based on critical interests (avoiding harm, preserving relationships, maintaining stability). **Why the difference?**
      *   **Deep-Rooted Paternalism in Psychiatry:** Psychiatry has a troubled history of overriding refusal in the name of "best interests," often underestimating the capacity of individuals in crisis.
      *   **Fear of Coercion & Liberty:** Detention is a severe liberty restriction. There's a legitimate concern that honoring PADs could mask coercion or be used to circumvent due process rights during an acute episode. Society and law are *much* more hesitant to allow pre-authorization of liberty deprivation than medical treatment refusal.
      *   **Ambiguity of Capacity in Mania:** Determining capacity during acute mania is complex and contested. Clinicians may be quicker to judge the *current* refusal as potentially competent/capable enough to override the prior directive, whereas in advanced dementia, current incapacity is usually unambiguous. **This reveals that the "competence" threshold isn't neutral; it's applied differently based on context and perceived risk.** The practice here leans towards **present experiential autonomy** (the wish to avoid detention *now*) over **past critical autonomy**.
  *   **Casino Self-Exclusion:** This aligns with the dementia living will logic. The competent self, acknowledging a vulnerability (gambling addiction), binds the future self to protect critical interests (financial stability, family well-being). The casino (and courts) prioritize the prior competent self's judgment about the future self's impaired willpower, assuming the *current* desire to gamble stems from the addiction itself. **Identity isn't the issue; it's about protecting against recognized future impairment of judgment.**
  *   **Organ Sale/Servitude Contracts:** Here, society imposes **substantive limits on autonomy**, even when competent. We don't allow competent individuals to make certain irreversible decisions that violate fundamental human dignity, create unacceptable risks of exploitation, or undermine core societal values (bodily integrity, freedom from slavery). **This shows that respecting prior wishes isn't absolute; it gets overridden by other powerful ethical principles (non-exploitation, human dignity, public policy).**

  ### What Theory of the Person/Practice is Implied? A Patchwork
  Your practice doesn't adhere to one pure theory but reflects a pragmatic (and sometimes inconsistent) blend:
  1.  **Primacy of Competent Decisions:** The strongest thread. When competence is clear (past or present), that decision usually wins.
  2.  **"Narrative" or "Critical Interests" View of the Person:** Implicitly, people are seen as having a life story shaped by enduring values (critical interests). Advance directives are tools to protect the integrity of that narrative when the ability to steer it is lost.
  3.  **Substantive Limits:** Autonomy isn't infinite. We won't enforce decisions (even competent ones) that violate core ethical/legal prohibitions (organ sales) or involve severe liberty restrictions without extreme caution (PADs).
  4.  **Variable Thresholds for Capacity & Harm:** The "weight" given to current vs. past wishes shifts based on:
      *   The *certainty* of current incapacity (dementia = clear, mania = contested).
      *   The *nature of the intervention* (refusing life-saving treatment vs. authorizing detention).
      *   The *perceived harm* of overriding current preferences (smiling dementia patient denied treatment vs. manic patient demanding discharge).
      *   **Deep-down bias:** We find it easier to override preferences when the current state seems "happy" (dementia) than when it seems "distressed" (mania demanding freedom), even if both involve impaired capacity.

  ### What Changes if We Drop "Earlier Self Authority"?
  If we completely reject the idea that the competent past self has authority over the incapacitated present self:
  *   **Dementia Living Will:** The policy would likely shift to **"Best Interests" determination**. Staff/family/ethics committee would look at the *current* patient: Are they suffering? Do they seem to enjoy life? Is treatment burdensome? The directive would be *evidence* of past wishes but not binding. Pneumonia would likely be treated in your smiling patient. This is the "experiential interests" approach.
  *   **PADs:** Might become *more* enforceable, as the barrier based on "it's not the same self deciding now" would be removed. Decisions would focus purely on whether the directive was validly made when competent and applicable to the current situation.
  *   **Self-Exclusion Lists:** Could become harder to enforce. The argument "I'm different now, let me gamble/take my winnings" might gain traction.
  *   **Competent Refusals (Dialysis):** Unchanged. Current competence still reigns.

  ### Is the Practice Fine? Needs a Better Justification?
  The practice *can* be justified without metaphysics, but the inconsistencies (especially regarding PADs vs. dementia directives) are ethically troubling. Here's a stronger justification framework:
  1.  **Respect Prior Wishes as Default:** Competent prior directives should be followed *unless*:
      *   There is clear evidence they no longer reflect what the person *would* want if they could momentarily regain capacity *and* understand their current situation (highly speculative and risky).
      *   Following them would cause severe, unambiguous harm that outweighs the imperative to respect autonomy (a very high bar, rarely met in dementia cases where the patient isn't suffering).
      *   They violate substantive ethical/legal limits (like consenting to enslavement).
  2.  **Address the PAD Inconsistency:** Advocate for treating valid PADs with the same respect as dementia living wills, developing clearer capacity assessments for acute psychiatric episodes to determine when the directive applies. The liberty concern is real but should be addressed through robust directive design and legal safeguards, not blanket dismissal.
  3.  **Focus on Process & Evidence:** Emphasize that the core principle is **respecting the most reliable evidence of the patient's values and wishes**. A clear, contemporaneous directive made when competent is usually the *best evidence* we have of what the person truly wanted for this precise situation. In severe dementia, the absence of resistance or apparent contentment isn't reliable evidence of a *change* in fundamental values; it's evidence of the disease's impact.

  **In essence:** Your nursing home policy isn't primarily about a secret identity claim. It's a practical (and largely defensible) application of respecting competent prior decisions about future incapacity, grounded in the idea that critical life values deserve protection even when the capacity to assert them is gone. However, the contrasting treatment of psychiatric directives exposes biases and inconsistencies in how we assess capacity, harm, and the legitimacy of refusing liberty. A more coherent ethic would strive to apply the principle of respecting prior competent wishes consistently, while acknowledging substantive limits and the unique complexities of liberty restrictions. Your role as a social worker is vital in bringing this nuanced, person-centered perspective to the ethics committee table.
