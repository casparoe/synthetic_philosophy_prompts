answer: |-
  *(Adjusting glasses, leaning forward with focused intensity)*  
  Your carbon border case is admirably sharp—precisely the pressure test this principle needs. Let’s dissect it. The foreign producers *are* subject to direct legal coercion: non-compliance triggers state sanctions, enforceable by courts or customs. This is paradigmatic of democratic authority’s justification: imposing binding rules demands accountability *to* those ruled. The islanders’ plight is tragic, but their vulnerability stems from *causal* effects of the state’s actions, not its *jurisdictional authority*. Conflating these collapses the demos into incoherence. If "subjected" included all affected parties, a single regulation could enfranchise billions—diluting democratic agency into meaninglessness. The solution isn’t stretching *demos* boundaries but building institutions *beyond* the state (e.g., climate reparations frameworks) to address harms to non-members. Democratic legitimacy requires boundedness; justice for outsiders requires other tools.  

  **[Out-of-character note:** *Settled consensus among theorists: Legitimacy requires justifying coercion to those coerced. Genuinely contested: Whether "coercion" includes indirect/material harms (like climate effects), and how to define the "threshold" of subjection (e.g., mere market exposure vs. direct legal penalties).]*  

