answer: |-
  Here are the core desiderata for any indirect normative account, structured by your requirements, with considerations, negotiability flags, and tension analysis. These criteria expose the architecture of the problem space.

  ### Core Desiderata & Constraints
  1.  **Determinacy (Non-Negotiable for Robust Accounts)**
      *   **Desideratum:** The account must generate *specific, action-guiding verdicts* on concrete, contested normative questions (e.g., "Is lying *pro-tanto* wrong?", "Should I donate to charity X?") from the idealization procedure itself, *without* merely positing that the ideal agent/procedure would resolve the question.
      *   **Consideration:** The *point* of normativity is guidance. An account that merely says "the ideal agent would figure it out" defers the core task. It risks vacuity or collapsing into "whatever the idealization outputs is right," providing no independent traction.
      *   **Constraint:** Cannot defer substantive normative conclusions entirely *within* the idealization's deliberation. The procedure must be specified sufficiently to yield outputs on specific cases.

  2.  **Self-Application (Non-Negotiable for Coherence)**
      *   **Desideratum:** The account's *own defining conditions* (e.g., the specification of the idealization: "full information," "rational," "impartial," the procedural rules) must be stable under the idealization process. The idealized agent/procedure must endorse *these very conditions* as binding.
      *   **Consideration:** Prevents the account from being self-undermining or question-begging. Exempting the idealization parameters from evaluation creates an unjustified "Archimedean point." Failure implies the parameters are arbitrary or presuppose external norms.
      *   **Constraint:** Cannot define the idealization using concepts that would be rejected *by* the idealized agent/procedure applying its own standards to the question of what constitutes a valid idealization.

  3.  **Guidance (Strength Negotiable, Existence Non-Negotiable)**
      *   **Desideratum:** The account must provide *actionable guidance* or *epistemic access* for non-ideal agents. It cannot merely describe what an ideal agent *would* do; it must tell actual agents *what to do now* or *how to reason towards it*.
      *   **Consideration:** Normative theories must connect to actual agency. Pure counterfactuals ("if you were God, you'd do X") offer no practical road map. Accounts must bridge the ideal/actual gap (e.g., via proxies, heuristics, accessible reasons, progressive approximation).
      *   **Constraint:** Cannot solely output descriptions of ideal states/actions without any translation mechanism or epistemic pathway for non-ideal agents. *Strength* varies: Some camps demand usable heuristics ("follow principles the ideal agent would endorse"), others accept guidance via identifying relevant reasons ("strive for fuller information, less bias").
      *   **Negotiability:** *How much* guidance (e.g., precise rules vs. vague directions) is a local preference. *That some* guidance exists is essential.

  4.  **Non-Circularity (Non-Negotiable for Explanatory Power)**
      *   **Desideratum:** The *parameters of the idealization* (information state, cognitive architecture, motivational structure, procedural rules) must be specifiable *without presupposing the substantive normative conclusions* the account is meant to derive.
      *   **Consideration:** Circularity renders the account explanatorily empty. Defining "full information" as "knowing all moral truths" or "ideally rational" as "dispositionally conforming to correct norms" simply builds the answers into the inputs.
      *   **Constraint:** Must define idealization parameters using only *non-normative* or *formally normative* (e.g., logical consistency, instrumental efficiency) concepts, or normative concepts *radically distinct* from those being derived. Cannot smuggle in contested substantive values.

  5.  **Authority (Non-Negotiable for Normative Force)**
      *   **Desideratum:** The account must explain *why* or *in virtue of what* the verdicts of the hypothetical idealization are genuinely *binding* or *reasons-giving* for actual, non-ideal agents.
      *   **Consideration:** Merely describing what a hypothetical being would do doesn't create an obligation ("Why should *I* care what my super-smart self would want?"). The account must ground the *normative force* of the counterfactual.
      *   **Constraint:** Cannot merely assert the authority; must provide a justification rooted in facts about the actual agent (e.g., constitutive aims of agency, deepest commitments, inescapable practical identity) or about rationality/reasons themselves that link the actual agent to the idealization.

  ### Key Tensions & Challenges

  1.  **The Core Tension: Non-Circularity vs. Determinacy**
      *   **Tension:** Achieving **Determinacy** requires *constraining* the idealization sufficiently to yield specific answers. Achieving **Non-Circularity** requires *not constraining* the idealization with substantive normative assumptions.
      *   **Manifestation:** Defining the ideal agent's "rationality" or "competence." Too thin (pure logic/instrumental) may yield no determinate substantive moral verdicts (**Determinacy failure**). Too thick (e.g., "sensitive to moral reasons") risks **Circularity**. Defining "full information" non-circularly (e.g., all non-normative facts) may leave normative facts unsettled (**Determinacy failure**), while including normative facts is **Circular**. Defining motivations ("impartial concern") non-circularly is notoriously difficult without invoking contested values.
      *   **The Pull:** Satisfying both fully may be impossible. Accounts typically trade off: Accept some circularity (e.g., "procedural rationality") for determinacy, or accept less determinacy (e.g., outputting only very general principles) for non-circularity. Resolving this is the central challenge.

  2.  **Self-Application vs. Stability:** Ensuring the idealized agent endorses the parameters defining it (**Self-Application**) might require parameters that lead it to *reject* those very parameters, creating instability. Finding a fixed point is non-trivial.

  3.  **Guidance vs. Idealization:** The more idealized the procedure (e.g., infinite reflection, perfect coherence), the harder it is to provide **Guidance** to finite, messy agents. Accounts emphasizing **Guidance** often "de-idealize" the procedure, risking **Authority** or **Determinacy**.

  4.  **Authority vs. Alienation:** Grounding **Authority** in the actual agent's psychology (e.g., deepest desires) risks making normativity hostage to contingent psychology. Grounding it externally (e.g., constitutive features of agency) risks failing to connect to the agent's subjective perspective ("Why is *this* constitutive aim binding *on me*?").

  ### Stress Test: Conflicting Idealizations

  *   **Scenario:** Consider two plausible idealization procedures applied to the question: "Is it permissible to sacrifice one innocent person to save five others in a trolley scenario?"
      *   **Procedure A (Maximally Informed, Empathetic Humanity):** Full non-normative information, human psychology (including deep empathy, aversion to direct harm), unlimited coherent reflection *within human cognitive/emotional constraints*. Output: **IMPERMISSIBLE** (personal involvement, violation aversion overwhelm utilitarian calculus).
      *   **Procedure B (Hyper-Rational, Impersonal Optimizer):** Full non-normative information, idealized rational agency (perfect coherence, no "irrational" biases like empathy-based aversion to impersonal harm), unlimited computation focused on value maximization. Output: **PERMISSIBLE** (strict impersonal utility maximization).
  *   **What an Adequate Account Owes Us:**
      1.  **Diagnosis:** It must explain *why* the procedures yield different verdicts. Is it due to:
          *   Different *inputs* (information scope, psychological constraints)?
          *   Different *processing rules* (role of empathy vs. pure optimization)?
          *   Different *definitions of rationality/ideality*?
      2.  **Discrimination:** It must provide a *normatively justified basis* for preferring one idealization procedure over the other *in this context*. This requires:
          *   Appealing to **Self-Application**: Which procedure's self-understanding survives its own idealization better?
          *   Appealing to **Non-Circular** foundations: Can the choice be made without presupposing the answer to the trolley problem itself (e.g., choosing Procedure B *because* it permits the sacrifice)?
          *   Addressing **Authority**: Why should *we* care about the verdict of one counterfactual procedure over the other?
      3.  **Consequence:** It must either:
          *   Argue that one procedure is fundamentally flawed/mis-specified based on the core desiderata (especially Non-Circularity and Self-Application), showing why its conflicting verdict is irrelevant.
          *   Concede that the conflict reveals a deep normative disagreement *within* the framework of indirect normativity, requiring a meta-principle for choosing between types of idealization (which itself faces the same desiderata challenges).
          *   Revise the account's scope, acknowledging that indirect normativity, as defined, may not yield a unique answer to *all* normative questions, potentially compromising **Determinacy**.

  **Summary of Negotiability:**

  *   **Non-Negotiable:** Self-Application, Non-Circularity, Authority, *Existence* of Guidance, *Existence* of Determinacy (i.e., the account must attempt to deliver verdicts, not just meta-principles).
  *   **Negotiable (Local Preference):** *Strength* of Determinacy (how fine-grained verdicts must be), *Strength/Form* of Guidance (precise rules vs. heuristics vs. reason-identification), the specific *source* of Authority (e.g., constitutive aims vs. subjective commitments), the *degree* of idealization (affects Guidance vs. Determinacy trade-off).

  The central tension remains **Non-Circularity vs. Determinacy**. A successful account must navigate this Scylla and Charybdis, demonstrating how its specification of the idealization yields substantive, non-vacuous outputs without building those outputs covertly into the inputs. The stress test highlights that the choice of idealization *is* the normative heart of the matter.
