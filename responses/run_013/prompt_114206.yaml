answer: |-
  ### Thinking Aloud: Sketching the Mapping
  I'll map the Rietdijk–Putnam argument (RPA) to distributed systems (DS) concepts by treating spacetime events as DS events (e.g., local ops, sends/receives). Causal structure in relativity (light cones) maps to happens-before (HB) and concurrency. Inertial frames define simultaneity via coordinate time; in DS, we'll approximate frames with **consistent total orders** extending HB (e.g., linearizations). The RPA's "reality" chain relies on transitivity of simultaneity across frames—but simultaneity in relativity is an equivalence relation *per frame*, while concurrency in DS is not transitive. Key tension: DS has no physical "frames," only logical constructs, and HB/concurrency are strictly causal, not ontological.  

  ### Restated RPA in Distributed Systems Vocabulary  
  1. **Premise (Relativity):** Simultaneity is frame-relative.  
     *DS Translation:* "Simultaneity" is total-order-relative. For any pair of concurrent events (HB-incomparable), there exists a consistent total order (linear extension of HB) where they share the same logical timestamp. (e.g., via a Lamport clock or vector clock snapshot).  
     *Honesty:* Maps cleanly mathematically—any antichain (maximal concurrent set) can be assigned "same time" in some total order. But DS total orders are arbitrary bookkeeping; relativity's frames are physical (tied to observer motion).  

  2. **Premise (Reality):** If event A is real, and event B is simultaneous with A in some frame, B is real.  
     *DS Translation:* If event A is "real" (e.g., a committed write at node N1), and event B is assigned the same timestamp as A in a consistent total order, then B is "real."  
     *Honesty:* Distorted. "Reality" in DS is uncontroversial (events are recorded facts); in RPA, it's metaphysical (e.g., "future events exist now"). We're smuggling philosophy into a causal model.  

  3. **Premise (Chaining):** By choosing frames, chain simultaneity from an event in my light cone to one outside it, proving all events are equally real.  
     *DS Translation:*  
     - Let A = local event at node N (your "coffee cup").  
     - Let C = event causally after A (A → C, e.g., a read linearized after A).  
     - Let B = event concurrent with A (A || B, outside A's causal cone).  
     - **Chain:** Pick total order F1 where A and B share timestamp T (possible by concurrency). Pick another total order F2 where B and C share timestamp T (requires B || C).  
     - By "reality" premise: A real → B real → C real. Thus, even future C is "real" now.  
     *Honesty:* Distorted. Requires B || C, but **A → C and A || B do not imply B || C**. In DS, B could be before C (B → C) or after (C → B), breaking "simultaneity" in F2. RPA ensures B || C via spacetime geometry; DS lacks this guarantee.  

  ### Residue Report  
  **(1) Maps Cleanly**  
  - **Causal cones:** Past/future light cones map to causal past/future (events reachable via HB paths).  
  - **Concurrency:** Spacelike separation ≡ HB-incomparable events.  
  - **Logical clocks:** Lamport/vector clocks capture causal order and concurrency; "timestamps" analogize to frame-dependent time coordinates.  

  **(2) Maps with Distortion**  
  - **Inertial frames:** Approximated by *consistent total orders* (linear extensions of HB).  
    *Distortion:* Relativity frames are physical (observer-dependent velocity); DS total orders are abstract, lack dynamics, and aren't unique. A node isn't a frame—it's a worldline. Frames in DS are mathematical choices, not physical realities.  
  - **Chaining step:** Relies on B being concurrent with both A and C.  
    *Distortion:* In relativity, geometry guarantees spacelike B for timelike A→C. In DS, **A → C and A || B do not entail B || C**. Example:  
    - N1: `A → send(M)`, N2: `receive(M) → C` → A → C.  
    - N3: `B` concurrent with A (no HB to/from N1).  
    - But if `B` sends a message to N2 before C, then B → C → not concurrent! RPA's geometric guarantee has no DS counterpart.  

  **(3) No Counterpart**  
  - **Reality/ontology:** "Real" in RPA is metaphysical (block universe's timeless existence). DS has no such concept—events are recorded or not; "future" is undefined pre-occurrence.  
  - **Physical frames:** Relativity frames emerge from Lorentz symmetry; DS has no symmetry principles or metric structure.  

  --- 
  ### Your Specific Checks  
  1. **Non-transitive concurrency and chaining:**  
     - If A || B and B || C but A → C, this **breaks RPA's chaining** in DS.  
     - RPA requires B simultaneous with both A and C in *different frames*, which demands B || C. But A → C and A || B allow B → C (e.g., B causally affects C), violating B || C. DS has no spacetime geometry to enforce B || C, so chaining fails without additional constraints.  

  2. **Inertial frames vs. nodes:**  
     - **False friend.** Nodes are like *worldlines* (sequences of local events); frames are *global coordinate systems*. A frame's "simultaneity slice" is a consistent cut (closed under causal precedence), but DS cuts need not be antichains (they can contain HB-related events). Frames don't map to nodes.  

  3. **Real-time order (linearizability) and global now:**  
     - **Yes, it presupposes a global now.** Linearizability requires operations to appear instantaneously ordered by a global real-time clock—a Newtonian absolute time. This contradicts relativity's frame-dependent simultaneity. Using real-time order in DS (e.g., for wall-clock timestamps) implicitly assumes a privileged universal clock, begging the question against RPA.  

  --- 
  ### Final Assessment: The Residue  
  The unresolvable residue is **both**:  
  - **Missing capacity:** DS lacks spacetime geometry (metric, Lorentz invariance) to enforce spacelike separation guarantees (e.g., ensuring B || C when A → C and A || B).  
  - **Smuggled premise:** The "reality" premise (simultaneity implies co-reality) is metaphysical, not causal. It's absent in DS, which only tracks causal influence—not ontology. RPA smuggles philosophy via this premise.  

  \residue{both}
