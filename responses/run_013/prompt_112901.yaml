prompt: |-
  I'm in the second term of a second-year course on ethical theory, and we've just finished the unit on hedonism as a theory of well-being. Every student has to run one fifty-minute tutorial for the rest of the group — about fifteen of us, most taking the course as a distribution requirement, so they're willing to argue but they haven't read much and they forget the reading by the following week. My session is on the heterogeneity problem: the objection that 'pleasure' picks out no single kind of state, so a hedonist who says well-being consists in pleasure has either named a mere family resemblance or is quietly relying on a disjunction of unrelated states, and in either case hasn't yet given you anything determinate to maximize. I understand the shape of the objection, but when I rehearse it out loud it comes out sounding like a verbal quibble, and I can already hear the room's response: sure, pleasures are different from one another, but they're all pleasures, so what exactly is the problem? That reaction is precisely what I need the session to move them past, and I haven't worked out how to get from where they'll start to where the objection actually bites.

  So please don't write the explanation for me — write me the teaching plan. I want the order in which the pieces have to be introduced, and why the dependencies run that way: what has to be settled about what a theory of well-being is even supposed to deliver before the question 'what do pleasures have in common?' becomes urgent rather than fussy, and whether the objection should be staged as a problem for the hedonist's value-bearer, for her decision procedure, or for both. Then the single example that should carry the whole fifty minutes, and what it must have and lack — my instinct is to run several pleasures side by side (the taste of something sweet, the relief of scratching an itch, the satisfaction of finally finishing a proof, a sadistic gratification), but I suspect that a list is the wrong shape precisely because it concedes the heterogeneity at the outset and lets the group treat it as a survey rather than a problem; I want to know what one case would have to contain to do work that the list can't, and whether the obvious dramatic candidates (the sadist, the masochist) are traps, since they seem to smuggle in the separate question of whether bad pleasures count, which I'd rather keep out of this session. Then the misconceptions, in the order they'll actually surface and with the point in the sequence where each should be headed off: I'm predicting 'hedonism is a theory about bodily pleasure', 'different pleasures just means different causes of the same inner feeling', 'so the objection is that hedonism is vague, and vague theories are perfectly usable', 'any common feature you name will be trivially true — they're all pleasant — so the objection refutes itself', and probably the Mill manoeuvre about higher and lower pleasures offered as though it were a solution rather than a restatement. For each, tell me where in the arc to intercept it and roughly what to say. I also want to know what to leave out at this level and announce that I'm leaving it out — I assume the question of whether pleasure is a felt quality or rather a propositional attitude (being pleased that something is so) is one of those things, but I'd like your view on whether it belongs, since it may pre-solve the heterogeneity problem by stipulation and rob the session of its tension.

  One further thing. I'd like to bring in something the group definitely hasn't met in lecture and can't look up in the slides, as a way of keeping the discussion off the rails of the standard textbook exchange: in the reward literature, liking a thing and wanting it come apart — they can be dissociated experimentally, and it is the wanting rather than the liking that drives behaviour, so organisms can pursue what they no longer report enjoying and vice versa. That looks as though it might either sharpen the heterogeneity problem, by suggesting that 'pleasure' was doing two jobs all along (a felt quality and a motivational pull), or hand the hedonist a way out, by letting her separate the felt-quality role from the motivational one and give up only the latter. Tell me where in the sequence that could be dropped in without wrecking the arc, whether it helps or merely confuses at this level, and if you judge it a distraction, propose some other piece of outside material with the same function of making the room think rather than recall. Finally, give me a closing question I can put to the group that would show whether they've grasped the difference between 'pleasure is a heterogeneous class' as a harmless description and as an objection with teeth — and tell me what I should refuse to answer if someone asks, in the last five minutes, why the hedonist can't simply define pleasure as whatever the agent likes.
reasoning: |-
  Okay, the user is a second-year philosophy student preparing a tutorial on the heterogeneity problem for hedonism. They need a teaching plan to help classmates move past seeing it as a verbal quibble. 

  First, let's unpack their core challenge: students keep dismissing heterogeneity as obvious but irrelevant ("pleasures are different but still pleasures"). The user intuitively knows this misses the theoretical bite but struggles to articulate why. Their teaching plan must therefore force a confrontation between surface intuition and philosophical rigor.

  Key insights from their request:
  - The room consists of non-specialists who retain little reading. Examples must do heavy lifting.
  - They anticipate specific misconceptions (e.g., vagueness tolerance, Mill as solution).
  - They want to avoid classic traps (sadism/masochism importing moral questions).
  - They seek one pivotal example rather than a list to prevent survey-mode thinking.
  - They have a novel neuroscience angle (liking vs. wanting) but need vetting.

  The critical pedagogical shift needed: Students must feel the problem rather than be told it exists. This means staging a "constructive failure" where they try and fail to unify pleasures under a single criterion. 

  Breaking this down:
  1. **Foundations First:** Before heterogeneity matters, we must establish what a theory of well-being owes us – namely, a determinate maximization target. If pleasure fractures, maximizing it becomes like maximizing "colorfulness" without specifying hue/brightness/etc. This framing makes heterogeneity urgent rather than pedantic.

  2. **The Single-Example Strategy:** A list invites cataloging differences; one tightly constructed case forces engagement with the unification challenge. The "itch-scratch relief" example works because:
     - It's universally relatable
     - It lacks features often smuggled into pleasure-talk (e.g., no moral valence like sadism, no cognitive layers like proof-solving)
     - Its defining quality (relief) is temporally unstable – the pleasure exists only as cessation of displeasure. This destabilizes "pleasant feeling" as a positive state.

  3. **Neuroscience Integration:** The liking/wanting dissociation is brilliant but risky. Slotting it after students hit the unification wall (post-itch example) lets it expose how even science fractures "pleasure." But it must be framed as deepening the problem, not solving it. 

  4. **Killer Closing Question:** "If we can't specify what pleasure *is*, how would you know if you'd successfully maximized it for someone?" This makes vague theories feel operationally useless.

  What to exclude: Propositional attitude debates would indeed short-circuit tension. Announce upfront: "We're bracketing whether pleasure is a feeling or an attitude to focus on heterogeneity."

  Biggest trap to avoid: Letting students retreat to "But they're all called pleasure!" The teaching sequence must make this feel like evasion, not resolution.
answer: |-
  Here's a step-by-step teaching plan designed to make the heterogeneity problem **bite** for students inclined to dismiss it as a verbal quibble. The arc forces them to confront *why* heterogeneity matters for a theory of well-being.

  **Core Pedagogical Strategy:**  
  Make the problem *practical* before it’s metaphysical. Focus on the **decision-procedure challenge** first. Only when they feel the operational vacuum does the metaphysical worry become urgent.

  ---

  ### **Teaching Plan: The Heterogeneity Problem’s Teeth (50m)**  
  **Goal:** Students should grasp that heterogeneity isn’t just diversity—it’s a threat to hedonism’s core function as a *guide to maximizing well-being*.

  ---

  #### **Phase 1: Groundwork — What a Theory of Well-Being Must Deliver (10m)**  
  *Why start here?* Unless students see what hedonism *owes* us, heterogeneity feels academic.  
  1. **Q1:** *"What’s the point of a theory of well-being? If I tell you ‘Maximize X!’, what do you need X to be like?"*  
     - Draw out: **Determinacy** (know what X *is*), **Measurability** (compare/rank instances), **Action-Guidance** (know how to get more X).  
  2. **Emphasize:** Hedonism promises **one currency** for trade-offs: "All pleasures are *commensurable*."  
  3. **Key Move:** Write on board: **"A theory of well-being must tell you *what to do*."**  

  ---

  #### **Phase 2: The Single Example — Making Heterogeneity Operational (15m)**  
  *Why one example?* A list lets students nod at diversity without stress. One case forces a *unification challenge*.  
  - **The Case:** **"Scratching an intense, long-lasting itch."**  
    - *Why this?* It lacks features students smuggle into "pleasure" (e.g., no moral weight like sadism, no achievement like finishing a proof).  
  - **Walkthrough:**  
    1. Ask: *"Is this pleasure? How intense is it?"* (Yes, high intensity).  
    2. Q2: *"What’s the *feeling*? Describe it without mentioning the itch."*  
       - Students will say "relief," "release," "absence of discomfort."  
    3. **Pivot:** *"So is the pleasure just the *removal of pain*? What if I told you this pleasure *requires* prior discomfort? Is ‘pleasure’ here a positive feeling—or just *not-pain*?"*  
  - **Why it works:**  
    - Exposes that "scratch-relief" has **no positive qualitative character**—it’s defined *relationally*. Contrast with eating chocolate (positive sensation).  
    - **Problem:** If pleasures aren’t a unified *kind of state*, how do we compare scratch-relief to chocolate? Which yields "more pleasure"?  

  ---

  #### **Phase 3: The Objection’s Target — Value-Bearer vs. Decision Procedure (5m)**  
  *Clarify the stakes:*  
  - **Value-bearer problem:** If "pleasure" isn’t one thing, what are we valuing? (Metaphysical worry).  
  - **Decision-procedure problem:** If we can’t measure/compare pleasures, how do we maximize? (Practical worry).  
  - **Stress:** "This isn’t about words—it’s about whether hedonism gives you a *ruler* for life choices."  

  ---

  #### **Phase 4: Introducing Dissociation — "Liking vs. Wanting" (7m)**  
  *Why include this?* It sharpens the problem *without solving it*.  
  - **When to introduce:** After Phase 2, when students are stuck on comparing pleasures.  
  - **The Science:**  
    > "Neuroscience shows ‘liking’ (pleasure) and ‘wanting’ (motivation) can split. E.g., addicts ‘want’ drugs they don’t ‘like’; you can ‘like’ a song but not ‘want’ to hear it now."  
  - **Q3:** *"If pleasure (‘liking’) is splintered into distinct states (food joy, relief, etc.), AND it can decouple from what we pursue—can hedonism tell us what to *do*?"*  
  - **Why it helps:** It turns heterogeneity from a curiosity into an **obstacle to motivation-based solutions** (e.g., "just pursue what feels good").  

  ---

  #### **Phase 5: Intercepting Misconceptions (10m)**  
  *Pre-empt and redirect:*  

  | Misconception | When it Arises | Response |
  |---------------|----------------|----------|
  | **"Hedonism = bodily pleasure"** | Phase 2 (during itch example) | *"Good catch—but hedonists claim *all* positive experiences (joy, pride, etc.) are pleasures. Does that help unify scratching and chocolate?"* → Leads back to unification failure. |
  | **"Different causes, same feeling"** | Phase 2 | *"Describe the ‘same feeling’ in scratching vs. chocolate. Is relief *feelingly* the same as sweetness?"* Force phenomenological comparison. |
  | **"Vagueness is fine!"** | Phase 3 | *"Vague theories can’t resolve conflicts. Should I study or party? If ‘pleasure’ is heterogeneous, I can’t measure which option has ‘more’."* |
  | **"Triviality: ‘Pleasurable’ defines pleasure!"** | Phase 3 | *"If I say ‘Maximize pleasurableness!’, but pleasurableness = ‘whatever feels good’, how is that different from saying ‘Do whatever is good’?"* → Highlights vacuity. |
  | **"Mill’s higher/lower solves this"** | Phase 4/5 | *"Mill assumes we *can* compare higher/lower pleasures—but if pleasure is heterogeneous, what’s the common scale? ‘Higher’ just means ‘we prefer it’—which isn’t hedonism."* |

  ---

  #### **Phase 6: What to Exclude & Why (1m)**  
  - **Announce early:** *"We’re bracketing whether pleasure is a feeling or a propositional attitude (e.g., being pleased that). Why? Because *both* face heterogeneity—e.g., is pride-in-work the same *kind* of state as being-pleased-that-your-itch-stopped?"*  
  - **Why exclude this?** It pre-resolves nothing. Heterogeneity persists within either category.  

  ---

  #### **Closing Question (2m)**  
  *"If pleasure is radically heterogeneous—scratch-relief, chocolate, pride, etc. share no common core—how would you decide whether to quit a stressful job (losing pride-pleasure) for a relaxing one (gaining comfort-pleasure)? What’s your *maximizing* procedure?"*  
  - **Why this?** It forces them to see hedonism as **action-guiding** (or failing to be). A good answer reveals they grasp the problem’s teeth.  

  ---

  #### **What to Refuse to Answer**  
  If asked: *"Why can’t hedonists define pleasure as ‘whatever the agent likes’?"*  
  - **Shut it down:** *"That’s circular: ‘liking’ is the explanandum. If well-being is ‘getting what you like’, but ‘liking’ is heterogeneous, we still need to know *what kind of state* we’re maximizing. We’ll tackle desire theories next week!"*  
  - **Why refuse?** It collapses hedonism into preference-satisfaction—a different theory.  

  ---

  **Why This Works:**  
  - The itch example **isolates relational pleasure**, making heterogeneity vivid without distractions.  
  - Starting with **decision-procedure** makes the problem urgent ("How do I live?").  
  - "Liking vs. wanting" **deepens without derailing**—it shows heterogeneity isn’t just philosophical; it’s empirical.  
  - Closing question **tests operational understanding**, not just theoretical.  

  **Alternative Outside Material:** If neuroscience feels too distracting, use **Wittgenstein’s "games" analogy**. Ask: *"If ‘pleasure’ is like ‘game’ (no common essence), can we rank chess, boxing, and solitaire by ‘game-ness’? If not, how do we maximize ‘game-ness’?"* → Sharpens the link between family resemblance and unmeasurability.
