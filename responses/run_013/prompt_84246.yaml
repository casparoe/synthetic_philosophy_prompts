  Hmm, the user is describing a fascinating pattern in technology discourse where the neutrality of a technology is asserted defensively when harms occur ("it's just a tool, users decide") but abandoned when benefits are claimed ("our system caused this positive outcome"). They want to know if this has a name, whether it's a legitimate distinction or a fallacy, and how to demarcate it.

  This feels like a collision between philosophy of technology and analytic philosophy of causation. The user clearly has sophisticated background knowledge - they're aware of the "technology is political" debates but specifically want to examine this asymmetrical neutrality claim. Their three examples (recommendation systems, platform liability, causal attribution) are well-chosen to show institutionalized rather than just individual hypocrisy.

  Brainstorming possible frameworks: First, there's Winner's idea of technologies having politics, but that's about inherent bias rather than this rhetorical asymmetry. Second, Latour's actor-network theory could describe the toggle between "mere tool" and "active agent", but doesn't capture the normative asymmetry. Third, the legal concept of "safe harbor" is relevant but only covers liability contexts. Fourth, causal vs moral responsibility distinctions in analytic philosophy (Hart & Honoré, Frankfurt) might explain why responsibility requires agency while causation doesn't - this seems closest to the user's hunch.

  The core tension: We often causally credit technologies ("smartphones changed communication") but resist blaming them normatively ("guns don't kill people"). The sliding scale between "causal contribution" and "full responsibility" creates this rhetorical gap that gets exploited. The user is right that it's not simple hypocrisy - there's a real philosophical knot here about whether artifacts can be proper subjects of blame.

  For naming, "neutrality shielding" captures the defensive move, while "causal asymmetry" describes the underlying structure. But neither feels perfect. Maybe "agential laundering" - like money laundering but for distributing agency away from artifacts when convenient. Though that might be too provocative.

  Key boundaries: This pattern requires (a) an artifact with real causal power (b) institutional actors with vested interests (c) asymmetric normative stakes. It wouldn't apply to simple tools like hammers unless they're embedded in systems (like algorithmic hammers?). Counterexamples might be technologies consistently blamed (cigarettes) or open-source tools without corporate backing.

  The legal/institutional version seems distinct from individual rhetoric because it involves codified frameworks like Section 230 that create structural incentives. But both exploit the same philosophical ambiguity. Evidence against the pattern would be technologies where benefits get neutralized too ("the vaccine saved lives but only because people chose to take it") - but we rarely see that.

  Ultimately the user's insight feels novel and important. The closest existing concept is the "responsibility gap" in robotics ethics, but that's about autonomous systems rather than this rhetorical toggle. I'll propose "selective causal instrumentalism" as a descriptive term, with "agential asymmetry" as the core phenomenon.
answer: |-
  Based on your careful description and analysis, here's a structured response. I'll follow your instructions: brainstorm concepts, select/refine one, define boundaries, argue for a verdict, and flag established vs. constructed elements.

  ### 1. **Brainstorming Candidate Concepts & Diagnoses**
     - **Causal Asymmetry in Normative Contexts**: The pattern hinges on switching causal frameworks depending on whether outcomes are positive (artifacts are active causes) or negative (artifacts are passive instruments). This exploits the gap between *causal contribution* (descriptive) and *responsibility* (normative).
     - **Neutrality Shield**: A rhetorical/legal tactic where "neutrality" is invoked defensively to deflect blame but discarded when claiming credit. Differs from general inconsistency by being systemic and tied to agency requirements.
     - **Agential Laundering**: Analogous to "money laundering," this involves obscuring the artifact's agency in harm by redirecting blame to users, while retaining agency for benefits. Highlights the selective personification of technology.
     - **Instrumental Flip-Flop**: A folk term capturing the inconsistency, but fails to explain *why* the flip-flop occurs and why it’s asymmetric.
     - **Value-Ladenness Hypocrisy**: Relates to Feenberg/Winner but focuses on *denying* value-ladenness for harms while *implying* it for benefits. Your pattern is a *rhetorical exploitation* of value-ladenness debates, not a direct engagement.

  ### 2. **Established Name? Closest Relatives & Shortfalls**
     No single term fully captures your pattern. Close relatives:
     - **"Moral Buffering"** (Johnson & Powers, 2005): Describes how technologies absorb moral responsibility. *Shortfall*: Focuses on responsibility *transfer* generally, not the *asymmetry* in causal claims.
     - **"Responsibility Gap"** (Matthias, 2004): Applies to autonomous systems where no agent can be held responsible. *Shortfall*: Your pattern involves *actively exploiting* a gap, not just identifying it, and applies beyond autonomy.
     - **"Neutral Tool Rhetoric"**: Common in critiques of tech determinism. *Shortfall*: Doesn’t address the *asymmetry* or institutionalized versions.
     - **"Safe Harbor Doctrine"** (e.g., CDA Section 230): Grants platforms legal immunity as "conduits." *Shortfall*: Only covers liability contexts, not causal claims in investor materials or social analysis.

  **How your pattern differs**:
     - From **plain inconsistency**: It’s *systematically asymmetric* (harm→neutrality/benefit→causality) and tied to agency requirements for responsibility.
     - From **value-ladenness**: Your focus is on *when neutrality claims are deployed*, not whether tech *is* value-laden. The asymmetry reveals a *rhetorical double standard*.
     - From **self-interest**: While self-interested, it exploits a *philosophical distinction* (causal vs. moral agency) rather than just lying or spinning.

  ### 3. **Coined Term: Definition & Boundaries**
     **Term**: **Selective Causal Instrumentalism (SCI)**  
     **Definition**: *The practice of framing a technology as a causally inert instrument when blamed for harms (deflecting responsibility onto users) while framing it as an active causal agent when credited with benefits (claiming credit for designers/owners).*  
     **Core Mechanism**: Toggling between two causal models—*efficient causation* (tech as active cause) for benefits and *mere enabling* (tech as passive tool) for harms—based on normative stakes.

  **Boundary Cases**:
     - **What it is**:  
       - Requires (1) an artifact with demonstrable causal influence, (2) institutional or corporate actors, (3) asymmetric attribution (harm→neutrality/benefit→causality).  
       - Covers all your examples:  
         - *Recommendation systems*: Neutral math (defense) vs. engagement driver (credit).  
         - *Platform liability*: Conduit (defense) vs. transformative force (credit).  
         - *Social change*: Artifact-cause (credit) vs. user choice (defense).  
     - **What it is not**:  
       - Individual hypocrisy alone (e.g., a person blaming "the algorithm" for wasting time but crediting themselves for learning online). SCI requires institutional power.  
       - Technologies with *consistent* causal framing (e.g., asbestos: always framed as active cause of harm; Wikipedia: often framed as a neutral tool for both good/bad outcomes).  
       - Blaming "misuse" where harm stems from *unintended* affordances (e.g., using a wrench as a weapon). SCI involves *designed* causal mechanisms (e.g., algorithms optimizing engagement).

  **Institutional vs. Rhetorical Versions**:  
     - They are **linked but distinct phenomena**. The *rhetorical* version (individual defensiveness) exploits the same ambiguity as the *institutional* version (legal frameworks like Section 230), but the latter codifies the asymmetry into rules.  
     - **Recommended distinction**:  
       - **SCI (general)**: The core asymmetric pattern.  
       - **Institutionalized SCI**: When SCI is embedded in law/policy (e.g., "safe harbor" laws).  
       - **Agential Asymmetry**: The underlying philosophical distinction enabling SCI (see §4).

  ### 4. **Fallacy or Genuine Distinction? Verdict**
     **Verdict**: *Both*. The asymmetry leverages a **genuine distinction** between causal and moral attribution but commits **special pleading** by applying it inconsistently.  

     **Argument**:  
     - **Genuine Distinction**: Moral responsibility typically requires agency (intent, control, alternatives). Artifacts lack these—they can *cause* outcomes but not *intend* them. Thus, shifting blame to users when harms occur *can* be coherent (e.g., "guns don’t kill people..."). Conversely, crediting tech for benefits often describes *causal efficacy* (e.g., "vaccines save lives") without needing intent.  
     - **Fallacy**: SCI *opportunistically switches frameworks*. It denies causal potency for harms (evading responsibility) while asserting it for benefits (claiming credit). This is **equivocation on "cause"**:  
       - For benefits: "Cause" = *efficient causation* (the tech *produces* outcomes).  
       - For harms: "Cause" = *moral responsibility* (only agents bear blame).  
     - **Why it’s not justified**: Technologies with high *causal power* (e.g., recommendation algorithms) constrain user agency through design. Ignoring this when harms occur—while invoking it for benefits—is **special pleading**. The designer’s responsibility lies in *foreseeable systemic effects*, not just direct intent.

  ### 5. **Evidence For/Against the Pattern**
     - **Evidence Against (noise)**:  
       - Cases where *benefits are neutralized* (e.g., a firm crediting users for positive outcomes: "Our users created this community, we just provided tools").  
       - Technologies consistently framed as *active causes for harm* (e.g., tobacco companies held liable for lung cancer *caused* by cigarettes).  
       - Truly neutral tools with *minimal causal influence* (e.g., a paperclip: no one credits/blames it for outcomes).  
     - **Evidence For (confirmation)**:  
       - Technologies with *high causal opacity* (e.g., algorithms, social media) where designers deflect blame to "users" or "society."  
       - Industries benefiting from *regulatory arbitrage* (e.g., platforms invoking "conduit" status in court while touting "transformative AI" to investors).  
       - Historical parallels (e.g., 19th-century factory owners calling machines "neutral" when blamed for worker injuries but "revolutionary" when boasting of productivity).

  ---
  ### Summary of Key Elements
  - **Established Concepts**:  
    - Moral buffering, responsibility gap, safe harbor doctrine (partial matches).  
    - Causal vs. moral agency distinction (Hart & Honoré, Frankfurt).  
  - **My Constructions**:  
    - **Selective Causal Instrumentalism (SCI)** as the core term.  
    - **Institutionalized SCI** for codified versions (e.g., liability shields).  
    - **Agential Asymmetry** as the philosophical basis (causal potency vs. moral agency).  
  - **Verdict**: SCI exploits a real distinction (causal vs. moral attribution) but commits special pleading via inconsistent application. It is *not* mere noise—it’s a systemic pattern in tech discourse.  

  This pattern reveals a critical flaw in how we assign blame/credit in sociotechnical systems: **technologies are granted causal agency when convenient and stripped of it when dangerous**. Naming it (SCI) exposes the tactical evasion at play.
