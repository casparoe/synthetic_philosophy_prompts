  For each question, I need to anticipate her responses and craft follow-ups. For example, if she says functional equivalence is key, ask what "functionally identical" includes—timing, representational content? On chaining, if she denies it's copy-delete, press on whether the original neuron is destroyed. For the pause, if continuity is essential, ask how much delay breaks identity. With the original person present, if she denies identity, question why the gradual process preserves it then. For the first-person view, if she dismisses its relevance, ask why we should trust third-person facts over subjective experience.

