answer: |-
  Here's a concise, applied analysis addressing your taxonomy and questions:

  **(1) Historical Contingency's Core Requirements**  
  Sensitive dependence (amplifying contingency) is *not* necessary. **Selecting + constitutive contingency suffice** for "history could have gone otherwise":  
  - **Selecting contingency** creates irreversible branch points (e.g., a near-miss assassination deciding whether a war starts).  
  - **Constitutive contingency** locks in self-reinforcing paths (e.g., QWERTY keyboard adoption raising switching costs).  
  Amplifying effects alone often dissipate; fixed-point selection or rule changes create lasting divergence *without* exponential growth.

  **(2) Distinguishing Selecting vs. Absorbing Contingency**  
  *In practice, use counterfactual resilience testing:*  
  - **Evidence for selecting**: Small variations in similar contexts produce divergent outcomes (e.g., different border skirmishes escalating/not escalating to war). System "memory" of perturbations (e.g., institutional reforms persisting) also signals selection.  
  - **Evidence for absorbing**: System returns to baseline after larger shocks (e.g., stock market corrections after minor panics). Statistical averaging of noise (e.g., monthly unemployment fluctuations) indicates absorption.  
  *Basin boundaries* are inferred from phase transitions: Sudden outcome shifts under incremental pressure (e.g., peaceful protests → revolution past a repression threshold).

  **(3) Determinism vs. Historians' Contingency**  
  - **Metaphysical indeterminism is irrelevant**. Historians' contingency requires *counterfactual fragility*:  
    - *In deterministic systems*, selecting/constitutive contingencies make outcomes **robustly dependent** on unrepeatable initial conditions (e.g., WW1 mobilization timings).  
    - Unpredictability arises from *epistemic limits* (unknown basins, chaotic rules) not physics.  
  - **All four contingencies** can operate deterministically, but absorbing/constitutive are most common in social systems.

  **(4) Evolutionary Analogy**  
  **Structure transfers with one key shift**:  
  - Selection filters variation (mutations ≈ small perturbations).  
  - **Constitutive contingency dominates** (e.g., a mutation creating new body plans).  
  - **Key difference**: Natural selection accumulates *functional* constraints (fitness landscapes), while history has *institutional* constraints. Yet both exhibit path dependence via selecting/constitutive effects (e.g., Cambrian explosion vs. industrial revolution lock-ins).

  **Bottom line: Selecting and constitutive contingency do the real work by creating irreversible, path-dependent branch points where small causes rewire future constraints.**  

  ---
  ### Applied to a concrete episode: *The Cuban Missile Crisis*  
  - **Selecting contingency**: Kennedy's ExComm debated air strikes vs. blockade; a 9-8 vote favored blockade. A single advisor switching sides could have triggered nuclear war.  
  - **Constitutive contingency**: The crisis created hotline protocols, permanently altering Cold War rules.  
  - **Not amplifying**: Khrushchev's initial missile deployment decision had chaotic ripple effects, but the *outcome* turned on discrete choices (selection) and new norms (constitution).  
  - **Evidence for selection**: Similar crises (e.g., 1983 Able Archer) nearly escalated; small group dynamics determined outcomes.  
  - **Absorbing?**: Minor intelligence errors (e.g., U-2 straying into USSR) were contained by system redundancies.  
  *Contingency here hinges on selection at committee votes + constitutive rule changes, not chaos theory.*
