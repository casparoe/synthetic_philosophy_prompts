prompt: |-
  I chair the clinical ethics consultation service at a large teaching hospital. We do about four consults a week, each with real consequences for a patient, and each written up in a note that a review board audits for consistency across cases. Our current worksheet is a checklist organized around medical indications, patient preferences, quality of life, and contextual features, and I have come to think it quietly assumes a generalist picture of moral reasons: that a given consideration carries the same kind of weight wherever it appears. Write me a replacement procedure that takes the particularist challenge seriously — a feature that functions as a reason in one case (a patient's stated preference, a family's plea, a clinician's unease) may function differently, or not at all, in another, and no principle keeps its valence across cases — while still yielding a written rationale that can be defended. Give me the steps in order, what counts as a sufficient answer at each, where the procedure issues a stop, and where it must hand the decision to a person because the question is evaluative rather than factual. As a discipline, require that any principle invoked be paired with an explicit statement of what would defeat it in this case. Then run it on three consults: an elderly patient with decisional capacity refusing a life-saving amputation over her adult children's objection; a family requesting continued ventilation of a patient the team believes will never recover consciousness; and a choice between two patients for one ICU bed. Include at least one verdict the hospital will not like, and tell me where the procedure will misfire — the cases it cannot settle, and how a particularist procedure can be gamed by whoever writes the note.
reasoning: |-
  We are designing a particularist procedure for clinical ethics consultation that rejects the idea that moral reasons have invariant valence across cases. Instead, it recognizes that the same feature (e.g., patient preference, family plea) can function as a reason in one case and not in another, or with different force. The procedure must yield a written rationale that can be defended and audited for consistency, even though consistency is not about applying fixed principles but about the quality of reasoning in context.

   Key features:
   1. Steps must be in order.
   2. Define what counts as a sufficient answer at each step.
   3. Indicate where the procedure stops (i.e., no further steps needed) or where it must hand over to human judgment because the question is evaluative.
   4. Require that any principle invoked must be paired with an explicit statement of what would defeat it in the current case.
   5. The procedure must be robust enough to handle complex cases and yield a written note that can be audited.

   Steps:

   Step 1: Case Summary and Framing
     - Sufficient answer: A clear, concise statement of the ethical conflict, including the medical facts, the stakeholders, and their positions. The summary must be agreed upon by the consultation team and verified with the primary team for accuracy.
     - Stop condition: If the case is resolved by clarifying misunderstandings (e.g., miscommunication) and all parties agree, the consultation may stop here and document the resolution. Otherwise, proceed.

   Step 2: Identify Relevant Features (Reasons) in This Case
     - Sufficient answer: List all the features that are being put forward as morally relevant by any stakeholder (e.g., patient's stated preference, family's plea, clinician's unease, medical indications, quality of life considerations, contextual features). Do not assign weight or valence yet. Also note any features that the ethics team identifies that stakeholders might have missed.
     - Handover to human judgment: This step is descriptive and factual. However, the identification of what counts as a relevant feature might require evaluative judgment (e.g., is a family's religious belief a relevant feature in this case?). In such cases, the note must explicitly state the rationale for including or excluding a feature.

   Step 3: Contextual Analysis: How Do These Features Function Here?
     - Sufficient answer: For each feature identified in Step 2, describe how it is functioning in this specific context. For example: 
          - "The patient's refusal of amputation is functioning as an expression of her autonomy and her values about bodily integrity and her vision of a good life."
          - "The family's plea for continued ventilation is functioning as an expression of their hope and religious belief in miracles, but also as a source of conflict with the medical team's assessment of futility."
     - Important: This step requires particularist reasoning. The same feature in a different case might function differently. The note must explain the context that shapes the function of each feature.
     - Handover to human judgment: This step is inherently evaluative. The ethics team must use their judgment to interpret the function of each feature in context. The note must record the reasoning.

   Step 4: Deliberation on Weight and Interaction
     - Sufficient answer: Analyze how the features interact and what weight they carry in this specific case. This includes:
          - Recognizing potential conflicts between features (e.g., patient autonomy vs. beneficence).
          - Considering whether the presence of one feature alters the function or weight of another (e.g., the patient's capacity to decide might strengthen the weight of her refusal, or a family's plea might be undermined by evidence of the patient's prior expressed wishes).
          - Explicitly state any moral principles being invoked (e.g., "We are giving strong weight to patient autonomy in this case because of the patient's decisional capacity and the clarity of her refusal") and pair each principle with a defeater: "However, if there were evidence that the patient's refusal is due to a treatable depression, that would defeat the principle of respecting autonomy in this case."
     - Handover to human judgment: This step is the core of the evaluative process. The ethics team must deliberate and come to a judgment about the relative weight and interaction of reasons in this case. The note must document the deliberation and the rationale for the weight assigned.

   Step 5: Resolution and Recommendation
     - Sufficient answer: Based on the analysis, provide a clear recommendation. The recommendation should address the ethical conflict and be actionable. It should also include a plan for implementation and communication.
     - Stop condition: This is the final step for generating the recommendation. However, if the recommendation is not accepted by the primary team or stakeholders, the process may require further discussion or re-engagement.

   Step 6: Documentation and Audit Trail
     - Sufficient answer: The written note must capture the reasoning from Steps 1-5 in a clear and structured manner. It must also include:
          - The names and roles of the ethics consultants involved.
          - The date and time of the consultation.
          - The steps taken and the rationale at each step.
          - Any principles invoked and their defeaters.
          - The final recommendation and any follow-up planned.

   Now, run the procedure on three cases:

   Case 1: Elderly patient with decisional capacity refusing a life-saving amputation over her adult children's objection.

   Step 1: Case Summary
     - Medical facts: The patient is elderly, with a gangrenous foot. Without amputation, she will die. With amputation, she has a good chance of survival but will face significant disability and rehabilitation. She has decisional capacity.
     - Stakeholders: Patient (refuses amputation), adult children (want the amputation to be performed), medical team (supports the patient's right to refuse but is concerned about the consequences of refusal).
     - Conflict: The patient's autonomous refusal vs. the family's desire to save her life.

   Step 2: Identify Relevant Features
     - Patient's stated preference: Refusal of amputation.
     - Family's plea: They want the amputation to save her life.
     - Medical indication: The amputation is life-saving and medically indicated.
     - Quality of life: The patient values her current quality of life and fears the loss of independence and dignity with an amputation. The family believes that life itself is paramount.
     - Contextual features: The patient is of sound mind and has the right to make her own decisions. The family is emotionally distressed.

   Step 3: Contextual Analysis
     - Patient's refusal: Functions as a clear exercise of her autonomy and reflects her values about the kind of life she wants to live. It is also an expression of her assessment of her own quality of life.
     - Family's plea: Functions as an expression of their love and concern for her life, but also as an interference with the patient's autonomy. In this context, the patient's capacity and clear expression of her wishes reduce the weight of the family's plea as a reason to override her decision.
     - Medical indication: Functions as a strong reason to recommend the amputation, but in the face of a capable patient's refusal, it cannot override autonomy.

   Step 4: Deliberation on Weight and Interaction
     - We give paramount weight to the patient's autonomy because she has decisional capacity and has made a clear and consistent decision. The principle of autonomy is invoked: a capable patient has the right to refuse any treatment, even life-saving.
          - Defeater: If there was evidence that the patient lacks capacity, or that her refusal is based on a misunderstanding (e.g., she thinks she will be a burden but her family is willing and able to care for her and she would accept if she knew that), then autonomy would not carry the day.
     - The family's plea, while understandable, does not override the patient's autonomy in this context. The medical team's duty is to respect the patient's decision.
     - Quality of life: The patient's own assessment of her quality of life is decisive. The team should not impose their own view of quality of life.

   Step 5: Resolution and Recommendation
     - Recommendation: The patient's refusal must be respected. The team should focus on palliative care and support for the patient and family. The family should be offered counseling to help them understand and accept the decision.

   Step 6: Documentation
     - Document as above.

   Case 2: Family requesting continued ventilation of a patient the team believes will never recover consciousness.

   Step 1: Case Summary
     - Medical facts: The patient is in a persistent vegetative state (PVS) with no chance of recovery. The medical team believes continued ventilation is medically futile and only prolongs dying. The family requests continued ventilation, hoping for a miracle.
     - Stakeholders: Family (wants continued treatment), medical team (wants to withdraw life-sustaining treatment), patient (no known advance directive).
     - Conflict: Family's request for continued treatment vs. medical team's assessment of futility and burden.

   Step 2: Identify Relevant Features
     - Family's plea: They believe in a miracle and feel that stopping ventilation would be giving up on their loved one.
     - Medical indication: The treatment is futile and only prolongs the dying process. It may also cause discomfort (e.g., infections, bedsores).
     - Quality of life: The patient has no consciousness and no prospect of recovery. Continued treatment does not benefit the patient and may be burdensome.
     - Contextual features: The family's religious beliefs, the absence of an advance directive from the patient, and the team's moral distress at providing futile treatment.

   Step 3: Contextual Analysis
     - Family's plea: Functions as an expression of their religious beliefs and hope. It also functions as a request to honor their loved one in accordance with their faith and family values.
     - Medical indication: Functions as a reason to stop treatment that is not achieving any medical goal and is imposing burdens without benefits.
     - Quality of life: Functions as a reason to discontinue treatment because the patient has no quality of life and no prospect of improvement.

   Step 4: Deliberation on Weight and Interaction
     - We must balance respect for the family's religious beliefs and the principle of non-abandonment against the principle of non-maleficence (avoiding harm) and the medical assessment of futility.
     - Invoke the principle of futility: When a treatment is medically futile, the medical team is not obligated to provide it. 
          - Defeater: If there was any reasonable chance of recovery, or if the treatment was not truly futile (e.g., if there was disagreement among medical experts), then the principle of futility might not apply.
     - However, the family's religious beliefs and their need for time to accept the prognosis must be respected. We must also consider the patient's best interests, which in this case is to avoid prolonging a dying process without consciousness.
     - We also invoke the principle of patient autonomy, but since the patient's wishes are unknown, we rely on the best interests standard.
          - Defeater: If the patient had expressed a clear wish to be kept alive in such a condition, that would change the analysis.

   Step 5: Resolution and Recommendation
     - Recommendation: The treatment is futile and should be withdrawn. However, the withdrawal should be done with sensitivity to the family's beliefs. Offer a meeting with a chaplain, provide time for the family to gather and say goodbye, and consider a time-limited trial (if the family can be brought to agree) or a weaning protocol. If the family remains adamant, consider involving a mediator or seeking a legal review.

     Note: This recommendation might not be liked by the hospital if they fear legal repercussions or public relations issues. However, the procedure requires that we base the recommendation on the ethical analysis.

   Step 6: Documentation
     - Document as above.

   Case 3: Choice between two patients for one ICU bed.

   Step 1: Case Summary
     - Medical facts: There is one ICU bed available. Patient A is a 45-year-old with a high chance of recovery if given ICU care. Patient B is a 70-year-old with multiple comorbidities and a lower chance of survival even with ICU care. Both need the bed to survive.
     - Stakeholders: The two patients and their families, the medical team, the hospital (which must allocate resources fairly).
     - Conflict: How to allocate a scarce, life-saving resource.

   Step 2: Identify Relevant Features
     - Medical indications: Patient A has a higher chance of survival and likely a longer life expectancy. Patient B is older and sicker, with a lower chance of survival.
     - Age: Patient A is younger.
     - Quality of life: Both patients have similar quality of life currently, but Patient A has a better chance of returning to a good quality of life.
     - Contextual features: The scarcity of the resource, the need for a fair allocation process.

   Step 3: Contextual Analysis
     - Chance of survival: Functions as a reason to prioritize Patient A because ICU care is more likely to be successful.
     - Age: Functions as a reason to prioritize Patient A because he is younger and might have more life-years to gain.
     - Quality of life: Both patients currently have a similar quality of life, but Patient A's prognosis for future quality of life is better.

   Step 4: Deliberation on Weight and Interaction
     - We invoke the principle of utility: maximize the number of lives saved and life-years. This would prioritize Patient A.
          - Defeater: If Patient B had a critical role in society (e.g., a frontline healthcare worker during a pandemic) that might outweigh the utilitarian calculus, or if there was a prior agreement on a different allocation strategy (e.g., a lottery).
     - We also consider the principle of justice: treating similar cases similarly. Both patients are in need, but they are not similar in terms of prognosis. Therefore, it is just to allocate to the patient with the better prognosis.
          - Defeater: If the hospital has a policy that explicitly forbids using age as a criterion, then we must follow that policy.

   Step 5: Resolution and Recommendation
     - Recommendation: Allocate the ICU bed to Patient A because of the better chance of survival and the greater expected life-years. The decision should be communicated with compassion to Patient B's family.

   Step 6: Documentation
     - Document as above.

   Where the procedure might misfire:

   1. Cases that cannot be settled:
      - When there is deep incommensurability of values (e.g., a fundamental disagreement about the definition of life or death) that cannot be resolved by contextual analysis.
      - When the facts are in dispute and cannot be resolved (e.g., conflicting medical opinions about prognosis).
      - When the case involves a novel situation where the ethics team cannot identify relevant features or their function.

   2. How the procedure can be gamed:
      - The person writing the note might manipulate the contextual analysis (Step 3) by overemphasizing or underemphasizing certain features to support a desired outcome.
      - The defeater statements might be crafted in a way that makes the principle invulnerable (or too vulnerable) to defeat, thus biasing the reasoning.
      - The team might skip or rush through steps to reach a predetermined conclusion.

   To mitigate gaming:
      - Require that the note includes the input of multiple team members (if available) and that any disagreements are documented.
      - Audit should focus on the quality of reasoning: Are the features identified comprehensively? Is the contextual analysis plausible? Are the defeaters reasonable?
      - Use peer review of consultation notes.

   This procedure embraces particularism by requiring context-specific reasoning while providing a structured framework for documentation and defense.
answer: |-
  ### Particularist Ethics Consultation Procedure  
  This procedure replaces the checklist with a dynamic, context-sensitive approach. It mandates that each case's rationale explicitly addresses the *function* of moral reasons within *this specific context*, paired with defeaters for any invoked principles. Steps are sequential; proceed only if unresolved.  

  #### Step 1: **Narrative Reconstruction**  
  - **Task**: Gather all perspectives (clinical team, patient, family, records). Identify *what happened*, *what is at stake*, and *why parties disagree*.  
  - **Sufficient Answer**: A shared timeline of events and conflicts, verified for factual accuracy.  
  - **Stop If**: Misunderstandings (e.g., miscommunication about prognosis) resolve the conflict. Document resolution.  
  - **Handover to Human Judgment**: When facts are contested (e.g., prognosis uncertainty), the team must decide which medical evidence to trust.  

  #### Step 2: **Feature Identification**  
  - **Task**: List all features presented as morally relevant (e.g., "patient’s refusal," "family’s distress," "resource scarcity").  
  - **Sufficient Answer**: Exhaustive, neutral inventory of features *without* assigning weight.  
  - **Stop If**: No conflict exists (e.g., all parties align).  
  - **Handover**: None—this is descriptive.  

  #### Step 3: **Contextual Function Analysis**  
  - **Task**: For each feature, answer: *How does this function as a reason/counter-reason HERE?* (e.g., "Family’s plea functions as emotional pressure on clinicians" vs. "as cultural obligation").  
  - **Sufficient Answer**: Explanation of how context (relationships, history, power dynamics) shapes the feature’s moral role.  
  - **Stop If**: A feature’s context reveals irrelevance (e.g., a distant relative’s objection).  
  - **Handover to Human Judgment**: Interpretation of context is inherently evaluative. The note must justify *why* a feature functions this way.  

  #### Step 4: **Weight Deliberation with Defeaters**  
  - **Task**:  
    - Deliberate interactions: Does one feature amplify/negate another? (e.g., "Patient’s capacity strengthens refusal’s weight").  
    - **For any invoked principle**: State the principle *and* what would defeat it *in this case* (e.g., "Autonomy is primary here *unless* refusal stems from untreated depression").  
  - **Sufficient Answer**:  
    - Ranking of features by weight, with justifications tied to context.  
    - Principles paired with explicit, case-specific defeaters.  
  - **Stop If**: Clear resolution emerges (e.g., all agree on a path forward).  
  - **Handover to Human Judgment**: Assigning weight and identifying defeaters requires evaluative reasoning.  

  #### Step 5: **Resolution & Recommendation**  
  - **Task**: Propose action based on Steps 3–4.  
  - **Sufficient Answer**: Specific, actionable steps (e.g., "Honor refusal" or "Hold family meeting").  
  - **Stop**: Final step for recommendations.  
  - **Handover**: None—recommendation must follow from prior analysis.  

  #### Step 6: **Documentation for Audit**  
  - **Task**: Write a note structured as:  
    - Narrative (Step 1) → Features (Step 2) → Contextual Functions (Step 3) → Weight/Defeaters (Step 4) → Recommendation (Step 5).  
  - **Audit Defense**: Consistency is measured by *reasoning quality* (e.g., "Did the analysis justify why a family plea overrode autonomy here but not elsewhere?") not uniformity.  

  ---

  ### Case Applications  
  #### Case 1: Elderly Patient Refusing Life-Saving Amputation  
  - **Step 1**: Patient (capacity confirmed) refuses amputation for gangrene; adult children demand surgery.  
  - **Step 2**: Features: Patient’s refusal, children’s objection, medical benefit, quality-of-life fears.  
  - **Step 3**:  
    - *Refusal*: Functions as autonomy + rational choice (patient values independence > survival).  
    - *Children’s plea*: Functions as grief-driven pressure; context shows patient historically distant from children.  
  - **Step 4**:  
    - Autonomy outweighs beneficence. **Defeater**: If refusal were based on false beliefs (e.g., "surgery kills instantly"), it would not hold.  
    - Children’s views hold minimal weight—patient’s lifelong independence negates their claim.  
  - **Recommendation**: Honor refusal. Offer palliative care.  
  - **Verdict Hospital May Dislike**: Overruling family’s wishes despite distress.  

  #### Case 2: Family Demands Continued Ventilation for Unconscious Patient  
  - **Step 1**: PVS for 6 months; team confirms no recovery chance. Family insists on continued vent, citing faith.  
  - **Step 2**: Features: Futility, family’s faith, resource strain, team’s moral distress.  
  - **Step 3**:  
    - *Family’s faith*: Functions as cultural obligation + hope ritual. Context: Patient shared this faith but never discussed end-of-life wishes.  
    - *Futility*: Functions as medical harm (prolongs dying).  
  - **Step 4**:  
    - Futility outweighs family’s wishes. **Defeater**: If family provided evidence of patient’s prior directive for "all measures," futility might yield.  
    - Faith’s weight is reduced—patient’s unknown wishes > family’s interpretation.  
  - **Recommendation**: Withdraw ventilation. Offer grief support.  
  - **Verdict Hospital May Dislike**: Risk of family backlash/legal action.  

  #### Case 3: Allocating One ICU Bed Between Two Patients  
  - **Step 1**: Bed needed for:  
    - Patient A (45yo, high recovery chance with vent).  
    - Patient B (70yo, low survival chance even with vent).  
  - **Step 2**: Features: Survival likelihood, age, resource scarcity, institutional triage policy.  
  - **Step 3**:  
    - *Survival likelihood*: Functions as utilitarian efficiency. Context: Hospital policy prioritizes "likelihood of benefit."  
    - *Age*: Functions implicitly as "life-years saved" but *not* as standalone reason (policy forbids age discrimination).  
  - **Step 4**:  
    - Survival likelihood is primary. **Defeater**: If Patient B was an ICU nurse in a pandemic, community benefit might override.  
    - Age cannot be used—policy defeaters require strict neutrality.  
  - **Recommendation**: Assign bed to Patient A.  
  - **Hospital Dislike**: Potential perception of "discriminating against elderly."  

  ---

  ### Where the Procedure Misfires  
  1. **Unsettleable Cases**:  
     - **Deep Value Conflicts**: E.g., religious conviction vs. medical consensus with no shared premises. The procedure can only clarify, not resolve.  
     - **Non-Comparable Features**: E.g., "symbolic value of life" vs. "pain avoidance." Requires arbitrary weight assignment.  
     - **Ambiguous Context**: If function analysis hinges on disputed relationships (e.g., "Was the patient estranged or not?"), it stalls.  

  2. **Gaming the Procedure**:  
     - **Manipulating Function (Step 3)**: A biased consultant might overemphasize context to favor an outcome (e.g., framing family pressure as "cultural duty" to override autonomy).  
     - **Defeater Crafting (Step 4)**: Making defeaters impossible (e.g., "Autonomy holds unless patient is under cosmic duress") or too broad (e.g., "Futility is defeated if family objects").  
     - **Narrative Spin (Step 1)**: Omitting key facts (e.g., hiding patient’s prior directives) to sway function analysis.  
     - **Mitigation**: Mandate multi-consultant review, external audits for recurrent bias patterns, and patient/family input in narrative reconstruction.  

  **Conclusion**: This procedure forces transparency about *why* a feature matters in *this* case, making audits focus on reasoning rigor. It embraces particularism but hedges against subjectivity through structured defeaters and context documentation. It fails only where all ethics fails: when values are truly incommensurable.
