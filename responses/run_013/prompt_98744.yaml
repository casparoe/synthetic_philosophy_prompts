prompt: |-
  So I run a small formal-epistemology group — three of us plus a PhD student starting in the fall — and we've got enough soft money to keep two of them going for about three years. We mostly work on probabilistic updating, and the thing that keeps pulling us back is uncertain evidence: what you actually do when what comes in isn't "E happened" but "here's a probability," or a likelihood, or a fuzzy reading off an instrument, and you want to fold it into your credences.

  The textbook move is Jeffrey's — take a partition, shift your probabilities on the cells, hold the conditionals fixed (the rigidity thing), call it probability kinematics. Fine. But there's a pile of loose threads and I cant tell which are load-bearing and which are just puzzles people enjoy. Off the top of my head: the order-dependence worry (two soft updates can land you in different places depending on which you do first), whether the rigidity condition is a real constraint or just a convention, what to do when the uncertain evidence doesn't carve things into a clean partition, whether any of the accuracy-style or Dutch-book-style justifications actually reach the Jeffrey rule rather than only ordinary conditioning, and how any of this touches the old-evidence problem.

  And then there's a fight inside the group that I suspect is the real fork. One of us keeps insisting the whole framing is a mistake — that "uncertain evidence" shouldn't be modeled as a constraint you impose on your credences at all, but as a noisy report with its own likelihood, in which case you just condition on the report (or on the fact that you received it) and Jeffrey conditionalization turns out to be a solution to a problem nobody actually has. The other one thinks that's just renaming the problem: now you owe us an account of where the report's likelihood comes from, whether it's the right kind of thing to condition on, and whether it stays fixed as your other credences move — at which point you're back where you started, just with extra steps.

  So: if you had our three years, which open questions here would you actually put people on, and in what order? I don't want a survey — I want the reasoning. Which of these is upstream of which, which are tractable with tools we already have versus needing something new, which would change what the rest of the area does if it got settled, and which of the threads above (or ones I haven't listed) are overrated and should just be left alone. And be straight with me about whether the "it's just noisy evidence, condition on the report" move collapses the agenda or merely relocates it — if it relocates it, tell me where to, because that's probably where the postdocs should go.
reasoning: |-
  Okay, the user runs a small formal epistemology group focusing on probabilistic updating, especially uncertain evidence. They have funding for about three years and are dealing with several open questions around Jeffrey conditionalization. The main internal debate is whether uncertain evidence should be treated as a constraint on credences (Jeffrey's approach) or as a noisy report to condition on. The user wants to know which open questions to prioritize, which are tractable, and how the "noisy report" approach affects their research agenda.

  First, I need to unpack the core issues. The group is stuck on foundational problems in Jeffrey updating: order dependence, rigidity, non-partitioned evidence, justifications, and the old evidence problem. The internal conflict about noisy reports vs. constraints is central. The user suspects this is the key fork. They need direction on where to allocate resources for maximum impact.

  The noisy report approach seems appealing because it reduces to standard conditioning. But the critic argues it just shifts the problem to justifying the likelihood model and its stability. If the likelihoods aren't robust, you're back to similar problems. The user needs clarity on whether this approach truly resolves the issues or just relocates them.

  Looking at the open questions, some are more foundational than others. The noisy report vs. constraint debate is upstream—it affects how other problems are framed. Questions like order dependence and rigidity might depend on which framework you choose. For instance, in the noisy report model, order dependence might not arise if the reports are independent, but if the likelihoods change, it could reintroduce problems.

  Tractability is key. The group has three years, so they need problems that can yield results. Formalizing the Stability Requirement for likelihoods in the noisy report model might be doable with game-theoretic or accuracy-based methods. Exploring non-partitioned evidence with Jeffrey-like rules could build on existing work by Diaconis or Gyllenberg.

  Impact-wise, settling the noisy report vs. constraint debate could influence how the field models evidence. If the noisy report approach holds, it might streamline the framework. But if constraints are necessary, then refining Jeffrey's rule becomes essential. The old evidence problem connects here—both approaches need to handle how past evidence affects current hypotheses.

  The user also mentioned justifications for Jeffrey's rule. Dutch book and accuracy arguments might only support standard conditioning. Extending these to justify rigidity could be a high-impact result, showing that Jeffrey's rule minimizes inaccuracy or avoids Dutch books under certain conditions.

  Prioritization should start with the noisy report approach. Investigate when and how likelihoods remain stable. This addresses the core disagreement and could resolve multiple downstream issues. Next, tackle non-partitioned evidence, which is a practical limitation. Then, explore justifications, as they provide normative grounding. Order dependence and rigidity might dissolve or transform based on the chosen framework.

  The old evidence problem should be integrated throughout, as it's a critical test case. If either approach handles old evidence better, that's a win. Finally, the group should avoid getting bogged down in order dependence without context—it's only problematic if rigidity isn't satisfied, which ties back to the framework choice.

  In conclusion, the noisy report approach relocates the problem but offers a clearer path. The group should first explore the stability of likelihoods and model selection. This direction leverages their strengths and has the potential to unify or advance the field. Postdocs should focus on formalizing the likelihood models and testing them against robustness requirements.
answer: |-
  Based on your group's focus, resources, and the internal fork, here's a prioritized research agenda for the next three years. The reasoning hinges on identifying the *foundational* disagreement ("noisy report" vs. "direct constraint") as the core upstream challenge that structures nearly everything else. Solving this (or clarifying its implications) unlocks progress on downstream questions and dictates where the real traction lies. Ignore the "survey" trap – focus on the key leverage points.

  **The Core Fork: "Noisy Report" (NR) vs. "Direct Constraint" (DC) is Load-Bearing**
  This isn't just a philosophical spat; it dictates the entire formalism and the nature of the problems you face. Your colleague is right that NR *relocates* the agenda, not collapses it. But where it relocates you is crucial and potentially more productive and fundamental. **This is where your Postdocs/PhD student should go first.**

  1.  **Year 1: Attack the Fork Head-On (The "Relocated Agenda")**
      *   **Question:** *Under what conditions, and with what justification, can the "noisy report" (NR) model adequately capture scenarios traditionally modeled by Jeffrey's "direct constraint" (DC), and what are the limitations?*
      *   **Why Upstream & Tractable?**
          *   **Upstream:** This question *frames* all others. If NR works robustly, problems like order dependence, rigidity justification, and non-partition evidence *change character or dissolve* within the standard Bayesian framework. If NR fails, DC demands solutions to those problems.
          *   **Tractable:** You have the tools. Model specific "uncertain evidence" scenarios (fuzzy instrument readings, vague testimonies, complex sensory inputs) both ways:
              *   **NR Approach:** Define the report `R` (e.g., "the instrument read value X", "the witness said Y"), specify a likelihood model `P(R | H_i)` for each hypothesis `H_i`. Update by conditioning: `P_new(H_i) = P_old(H_i | R)`. Requires specifying `P(R | H_i)` and `P_old(R)`.
              *   **DC Approach:** Define a constraint on the posterior (e.g., `P_new(E) = q` for some event/partition `E`), assume rigidity, apply Jeffrey's rule.
          *   **Crucial Investigation:** The **Stability Requirement**. Your critic is spot-on. The NR approach *only* avoids the DC problems if the likelihood model `P(R | H_i)` is **stable** (invariant) under the update. Does learning `R` *and* updating other beliefs potentially change your model of how the evidence *was generated* (`P(R | H_i)`)? If yes, rigidity (or its failure) sneaks back in for the *likelihood model itself*. This is the relocated core: **When and why are likelihood models for reports stable?** This connects deeply to causal modeling, instrument calibration, and the semantics of evidence reports.
      *   **Expected Outcome:** A clear map delineating scenarios where NR *works seamlessly* (stable likelihoods, no DC problems arise), scenarios where NR *requires careful justification of the likelihood model* (stability is an assumption needing defense), and scenarios where NR *fails or is impractical* (e.g., highly vague, non-propositional "feels" that resist clean `R` definition, or where defining `P(R | H_i)` requires solving the original DC problem). This provides a principled basis for choosing frameworks. **Impact:** Reshapes the field's understanding of "uncertain evidence" by grounding it in the more fundamental Bayesian task of modeling evidence-generating processes and justifying likelihood stability. Shows whether Jeffrey's rule is a necessary extension or a pragmatic shortcut for specific cases.

  2.  **Year 2: Downstream Problems Informed by the Fork**
      *   **Priority 1: Non-Partition Evidence & Old Evidence (Tractable & High Impact)**
          *   **Question:** *How do the NR and DC approaches handle uncertain evidence that doesn't neatly factor over a partition, or that constitutes "old evidence"?*
          *   **Why Now?** Informed by Year 1. If NR dominates, non-partition evidence becomes a problem of *defining the report `R` appropriately* (e.g., `R` could be a vector, a proposition about the *form* of the evidence). Old evidence becomes a problem of *modeling the discovery/recognition process* (`P(Discover E | H_i)` vs. `P(E | H_i)`) – a well-trodden path with existing NR-style solutions (Garber, Jeffrey, others). If DC remains necessary, explore generalizations of Jeffrey (e.g., Diaconis & Zabell's minimum cross-entropy, Gyllenberg's linear constraints) for non-partitions. **Tractable:** Building on Year 1's models. **Impact:** Directly addresses practical limitations of textbook Jeffrey and connects to a major debate (old evidence).
      *   **Priority 2: Justifying Rigidity (or Likelihood Stability) (Foundational & High Impact if Solved)**
          *   **Question:** *Can accuracy/Dutch-book arguments be extended to normatively compel either (a) rigidity in DC updates, or (b) stability of likelihood models in NR updates?*
          *   **Why Now?** The core normative challenge. Year 1 identifies *what* needs justifying (rigidity for DC, stability for NR). **Tractable? Maybe.** Accuracy arguments for DC rigidity are notoriously hard – justifying holding `P_new(X|E_i) = P_old(X|E_i)` is tricky. NR stability might be *more* justifiable using these tools: one could argue that *changing* `P(R | H_i)` arbitrarily upon learning `R` itself is accuracy-dominated or incoherent *if* `R` is understood as a report from a fixed (even if unknown) process. **Impact:** Huge. A successful justification for either framework's core assumption would be a landmark result. Failure clarifies the limits of normative justification.
      *   **De-Prioritize (For Now): Order Dependence.** It's a symptom, not the disease. Order dependence arises in DC when rigidity fails *or* when the constraints interact non-commutatively. In NR, conditioning *always* commutes if the reports are independent given the hypotheses. **If** Year 1/2 show NR is robust and stability holds, order dependence largely vanishes as a *distinct* deep problem. If DC is necessary, order dependence highlights the need for constraints specifying *how* evidence interacts, but this is less fundamental than justifying rigidity itself. Don't ignore it, but don't make it the primary focus.

  3.  **Year 3: Synthesis, New Tools, and Field Impact**
      *   **Question:** *Based on Years 1-2, what is the unified framework for updating on uncertain evidence, and what new formal tools does it require?*
      *   **Why Now?** Synthesize findings. Key tasks:
          *   **Formalize the "Stability Requirement":** Develop criteria or tests for when a likelihood model (`P(R | H_i)`) can be reasonably assumed stable. Connect to causal Bayes nets, interventionist concepts.
          *   **Model Selection/Building:** If NR is primary, the focus shifts to *how we build and justify the models* `P(R | H_i)` for various types of uncertain reports (sensory, testimonial, instrumental, vague). Develop formal heuristics or principles.
          *   **DC as Approximation:** If NR is fundamental, characterize when Jeffrey's DC rule provides an adequate *approximation* (e.g., when the partition captures the relevant uncertainty and rigidity holds approximately).
          *   **Address Remaining DC Strongholds:** If specific scenarios genuinely resist NR modeling (e.g., foundationalist "givenness" of experience?), develop the minimal, best-justified DC extension (e.g., exploiting Maximum Entropy principles).
      *   **Impact:** Provides the field with a clearer, more principled roadmap. Moves beyond "Jeffrey vs. Conditioning" by showing how conditioning on reports *subsumes* Jeffrey under specific, often justifiable, conditions, while also highlighting where genuinely new formalisms are needed.

  **Straight Talk on "Noisy Report" (NR) vs. "Direct Constraint" (DC):**

  *   **Does NR collapse the agenda? No.** It **relocates and reframes** it profoundly.
  *   **Where does it relocate it?** To the **justification and stability of likelihood models** (`P(Report | Hypothesis)`) within *standard* Bayesian conditioning. The "extra steps" your critic mentions *are the actual core problem*:
      *   **Step 1:** Define the evidence proposition `R` ("The instrument read 7.3±0.2", "The witness uttered 'It looked blue'").
      *   **Step 2:** Construct a justified model of `P(R | H_i)` for all relevant hypotheses `H_i`. Where does *this* model come from? (Calibration data, causal understanding, semantics?)
      *   **Step 3:** Justify the **stability** of this model – why won't learning `R` itself change your beliefs about `P(R | H_i)`? (This mirrors the rigidity question, but applied to the evidence generation process).
  *   **Why is this relocation likely *better*?**
      1.  **More Foundational:** It grounds "uncertain evidence" in the core Bayesian machinery of modeling how evidence is generated relative to hypotheses. Jeffrey's rule feels like a bolt-on; NR integrates it.
      2.  **Dissolves Pseudo-Problems:** Issues like order dependence often vanish if likelihoods are stable.
      3.  **Clarifies Commitments:** Forces explicit modeling of the evidence-reporting process, revealing hidden assumptions.
      4.  **Connects to Practice:** How scientists actually handle instruments or testimony *is* by building likelihood models.
      5.  **Handles Old Evidence Naturally:** Shifts focus to `P(Discovery/Recognition of E | H_i)`.

  **Recommendation Summary:**

  1.  **Year 1:** **Postdoc/PhD Focus:** Attack the core fork. Model scenarios NR vs. DC. **Crucially:** Rigorously investigate the **Stability Requirement** for NR likelihoods. Map the territory: When does NR work seamlessly? When does it need justification? When does it fail?
  2.  **Year 2:** **Team Focus:**
      *   Apply the Year 1 framework to **Non-Partition Evidence & Old Evidence**.
      *   Attempt **Normative Justifications** (Accuracy/Dutch Book) for either DC Rigidity or NR Likelihood Stability (prioritize the latter based on Year 1).
      *   Keep order dependence on the back burner as a diagnostic tool.
  3.  **Year 3:** **Synthesis:** Formalize the Stability Requirement. Develop principles for building/selecting likelihood models in NR. Characterize DC's role as approximation or niche solution. Publish the unified framework.

  **Which Threads to Leave Alone (For Now):**
  *   **Order Dependence as a *Primary* Mystery:** It's a consequence, not a cause. Solve the core (rigidity/stability), understand order dependence.
  *   **Endless Rehashing of Standard Critiques of Jeffrey:** Focus energy on building the positive alternative (NR framework) and testing it against the DC challenges. The critiques are signposts, not destinations.

  **The Bottom Line:** Your internal disagreement is the golden ticket. The "noisy report" critic is pointing towards a more fundamental, albeit relocated, problem space (likelihood modeling and stability). By putting your initial effort into rigorously exploring *that* relocation – especially the stability question – you'll resolve the fork, clarify which other problems are genuine, and likely make the most significant contribution to the field. **Start there.** Good luck!
