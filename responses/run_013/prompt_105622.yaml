  Your friend's rule appears to be:  
  **"Aumann's theorem forces agreement only if all of the following are common knowledge: (1) the common prior, (2) the information partitions, (3) both agents' rationality (Bayesian updating), and (4) the posterior probabilities. If any one of these is not common knowledge, rational disagreement is possible."**  

