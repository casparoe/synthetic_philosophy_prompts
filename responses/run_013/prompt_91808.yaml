answer: |-
  ## Founders' Day Keynote: The Soil We Share

  Friends, neighbors, welcome. It is an honor to stand before you on this Founders’ Day, our town’s one hundred and fiftieth. That number hangs on the banner, woven into the very fabric of our celebration. It feels solid, doesn’t it? Like the old mill walls. Like the rhythm of the spade turning the earth each year by the hand of our youngest citizen. It feels… true.

  But what if I told you that this specific celebration – *this* date, *this* founder’s image, *this* ceremony we hold dear – wasn’t born alongside those mill foundations? What if I told you it emerged much later, in 1961, crafted by folks in the Chamber of Commerce with the best intentions? That the founder we honor today is a blend of two distinct men? That the costume, the ritual… they were new creations back then? That the date is, well, mathematically complicated?

  **(Pause. Let it settle.)**

  I spent this past winter deep in the archives. And I found this out. And I’ll confess, it threw me. It felt… unsettling. Like finding out the heirloom quilt on your bed wasn’t your great-grandmother’s, but lovingly made by your own parents decades ago. It’s still beautiful. It still warms you. But the story attached to it changed.

  And that got me thinking hard, especially standing here today. If this tradition was deliberately made in 1961 – stitched together like that quilt – is it less *real* than the older things? Is it less valuable? What *is* the difference between this Founders’ Day and, say, the way we’ve always, instinctively, put out sand barrels when the ice comes? Nobody invented the sand barrels at a meeting; we just *did* it, year after year, because it was needed, until it became simply what we *do*.

  Is the difference just age? Maybe. Time does something. It wears down the sharp edges of invention until it feels like it’s always been there. But is that enough? Is something only "real" when we forget who started it? When the inventors are gone?

  I don't think so. I think the difference lies deeper. It lies in what the tradition *does*, and *how* we hold it.

  The sand barrels? They serve a clear, present need: safety. They work. They’re practical. Founders’ Day? Its purpose isn’t practical like that. Its function is meaning. Belonging. Connection. It answers a deep human need to know where we came from, to feel part of a story larger than ourselves. That need isn’t manufactured in 1961; that need is ancient.

  The Chamber of Commerce in 1961 saw that need. Our town, like many then, was changing. The mills weren't what they were. Maybe they sensed a fraying, a need to gather and remember and feel rooted. So, they reached back. They borrowed pieces of history – names, dates, the *idea* of founders – and they wove them together with new threads: a costume to visualize it, a simple ritual to *do* it. They created a focus for that deep need to belong.

  **So, what does the manufactured version lack?** It lacks the *accidental*, organic beginning. It lacks the fog of time that makes origins mysterious. We know its birthday: 1961. That makes it feel… deliberate. Planned. Maybe a little exposed. It risks feeling like a performance, rather than something that simply *grew*.

  But here’s the crucial thing: **What a tradition *lacks* at its start doesn’t determine its worth *now*.** Because traditions aren't fossils. They’re living things. They take root not in the moment of their making, but in the soil of repeated practice, shared memory, and genuine feeling.

  For **sixty-three years**, we *have* practiced this. We *have* gathered. We *have* watched that child turn the soil. We’ve shared meals, told stories (even if some details shifted!), laughed, and remembered. For sixty-three years, this day *has* been a day when the town is most truly *itself*. That feeling isn’t manufactured. That feeling is earned. That feeling is **real**.

  The quilt made in 1961 is still warm. Our Founders’ Day, born in 1961? It warms us still. It binds us. It gives us a shared moment to look back and look forward. Does knowing its precise origin diminish that? I don’t believe it has to. It just changes the story we tell *about* the story.

  So, what do we do? Do we discard it because its threads are newer than we thought? Or do we embrace its true history, seeing it not as a fraud, but as a testament to something powerful?

  **I say we keep it.** We keep the gathering. We keep the spade ceremony – that simple act of hope for the future, entrusted to our youngest. But we tell the *fuller* story. We honor the *real* founders – the men and women whose names and labor are in the deeds and the payrolls and the very streets we walk. And we also honor the 1961 community – *our* grandparents, *our* parents – who, seeing a need for connection in changing times, created a vessel for it. They gave us a ritual, and for six decades, *we* have filled it with authentic meaning.

  This Founders’ Day isn’t 150 years old. But the *town* is. The *people* are. The *need* to belong is ancient. This celebration is *our* tradition, born in 1961, honoring a past much older. Let’s claim *all* of that history.

  **(Turning slightly towards the descendants in the second row)**
  And to the descendants of our town’s true founders here with us today: Your ancestors’ legacy isn’t in a costume or a single composite story. It lives in the real work of their hands, the foundations they laid, the community they helped build that endures. We see it in the enduring fabric of this town, and we are grateful. Today, we honor that true legacy, even as we continue our own.

  Let this Founders’ Day be both: A recognition of our complex past, and a celebration of the living community we are *right now*. Let’s keep gathering. Let’s keep turning the soil together. Not because the story is perfectly ancient, but because the belonging it fosters is perfectly real.

  Thank you. Happy Founders’ Day.
