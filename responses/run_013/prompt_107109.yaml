  Wait—what about the "subject matter" objection? Kripke says counterpart theory changes the subject. Lewis replies that his theory captures the practical role of modal claims. This seems like a divergence in what they think de re modality *is for*. Kripke cares about direct reference; Lewis about a reductive account. 

  So, is the dispute a mix? Partly verbal (if both misstate each other’s demands), partly substantive (metaphysics of worlds), and partly methodological (what counts as a "good" analysis). The user’s hypothesis holds but isn’t the whole story. Their distinction helps untangle the stalemate, but the deeper disagreements persist. 

  For progress, maybe clarifying the projects: Is this about ontology? Semantics? Cognitive content? A formal result (like Fara’s) showing equivalence might satisfy Lewis-style theorists but not Kripkeans who reject reduction. Alternatively, shifting focus to why we use de re modality—e.g., for agency or explanation—could reframe the debate. 

  The user’s worry about ill-posed questions resonates. If "sameness across worlds" means different things to each side, forcing a single answer won’t work. But progress might come from admitting pluralism: different tools for different purposes. 

  Biggest weakness in my view? Downplaying the substantive clash. Lewis’s concrete worlds are central to his system; dismissing that as "misplaced demand" might ignore his actual motivation. Still, the user’s hypothesis exposes how the *rhetoric* of the debate gets tangled. 

  Final verdict: 40% verbal (thanks to user’s distinction), 60% substantive/metaphysical. Progress requires delineating the projects and perhaps accepting that modality isn’t monolithic. But expecting full resolution? Unlikely—the commitments run too deep. 

