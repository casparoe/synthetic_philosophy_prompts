prompt: |-
  I'm a philosopher — action theory, mostly — and I've been collecting cases for a paper while failing to find the umbrella term I'm sure must exist. The pattern is this. In each case someone is better off having an attitude — a belief, a feeling, sometimes just a bit of character — that they've got no business having on the evidence, and the good only turns up if the attitude isn't held for the sake of the good. A colleague needed a lift across a long stretch of desert where nobody stops, because a stranded passenger can't promise anything; the only way a driver stops is if she really would pay up afterwards, and she can't turn herself into that sort of person by working out that it would pay to be that sort of person — the working-out undoes the whole thing. My sister says the same about falling asleep, and about her marriage: the moment she starts keeping score to protect herself, the thing she was protecting is gone. A student swears the only way he could finish his dissertation was to stop caring whether it got him a job.

  What I can't tell is whether I've got one phenomenon here or four. Sometimes the attitude is a belief, sometimes an emotion or a disposition; sometimes you could get it by taking a pill or moving to a different city, sometimes you couldn't, and I can't say what makes the difference; and in every case there's the same odd second-order move, where 'be like that' sounds like the right advice and yet can't be taken as advice by anyone who takes it for that reason.

  I know there's literature on believing things for practical reasons, and I know about self-fulfilling expectations, but neither seems to be it. Is there a name for this, or a body of work? And if there isn't one, please don't just coin a label and stop — I want the joints: which of my cases are really the same case, what seperates the ones where the manipulation works from the ones where it destroys the very thing, and what the nearest concepts are and exactly how each falls short.

  You're the closest thing to an expert on this I can get to without a library, so reason it out carefully instead of grabbing the first famous name that half fits. Lead with your bottom line in the first sentence, then the reasoning — no preamble, no restating my question.
reasoning: |-
  Okay, the user is a philosopher specializing in action theory. They've collected several cases where someone is better off having an attitude—belief, emotion, disposition—that isn't justified by evidence, and the benefit only occurs if the attitude isn't adopted for the sake of that benefit. The examples include: a colleague needing a genuine willingness to pay for a ride to get help in the desert, the user's sister struggling with sleep and marriage where over-monitoring ruins the state, and a student who had to stop caring about job prospects to finish his dissertation.

  The user is trying to determine if these are instances of a single phenomenon or different ones. They mention existing literature on pragmatic belief and self-fulfilling prophecies but feel those don't fully capture their cases. Key issues are the variation in attitude types (belief, emotion, disposition), the effectiveness of manipulation (pills vs. innate change), and the paradoxical nature of adopting the attitude instrumentally.

  First, I need to identify if there's an existing term. Terms like "self-defeating strategies," "the paradox of instrumental attitude adoption," or "essential byproducts" come to mind. Jon Elster's concept of "states that are essentially by-products" seems relevant. He discusses situations where certain states can't be achieved directly through willpower because the intention undermines the state. For example, spontaneity can't be forced.

  Looking at the cases: the desert scenario involves a belief that must be genuine to elicit help, which fits Elster's by-product idea. The sister's sleep and marriage issues relate to over-monitoring, where conscious control destroys the desired state—similar to the concept of "choking" in psychology. The student's dissertation aligns with performance anxiety, where detaching from outcomes improves performance.

  But are these the same phenomenon? Under Elster's framework, they share the structure where the attitude is an essential by-product. However, differences exist: beliefs vs. emotions, and methods of manipulation. Pills might work for some (like inducing sleep) but not for traits like trustworthiness. The key is whether the attitude's value depends on its non-instrumental nature. If adopting it for a reason destroys its efficacy, it's an essential by-product.

  The user also needs to know why manipulation works in some cases but not others. In the desert case, taking a pill to become trustworthy wouldn't work because the driver needs genuine character, not artificially induced. But for sleep, a pill might help without the intentional element. So, the distinction lies in whether the attitude's function requires its intrinsic nature. When the value depends on the attitude being held for its own sake, instrumental adoption fails.

  Nearest concepts: pragmatic reasons for belief (Clifford, James), self-fulfilling prophecies, and psychological concepts like the overjustification effect. But these fall short because pragmatic belief involves evidence, self-fulfilling prophecies don't address the instrumental adoption paradox, and overjustification applies to intrinsic motivation.

  So, the core phenomenon is the essential by-product. Cases where manipulation works (like taking a sleeping pill) don't require the attitude to be a by-product; the benefit doesn't depend on its non-instrumental origin. In contrast, the desert scenario's benefit relies on genuine character, so manipulation fails. The marriage and dissertation cases are similar, where monitoring for protection undermines trust or focus.

  Therefore, unifying the cases under Elster's framework makes sense. The joints: all cases involve a goal achievable only if not pursued instrumentally, but the desert and marriage/dissertation cases are essential by-products, while sleep might not be if aided externally without intentionality.
answer: |-
  **Bottom line:** You're describing *essential byproducts* (Jon Elster), a unified phenomenon where the instrumental pursuit of an attitude destroys its constitutive value, making these cases structurally identical despite surface differences.

  **Reasoning:**

  1.  **Core Mechanism:** The unifying feature is that the *value* or *functionality* of the attitude (trustworthiness, sleep, marital security, focused effort) is *constitutively dependent* on it *not* being held for instrumental reasons. The attitude's beneficial effect *requires* it to be an "essential byproduct" (Elster, *Sour Grapes*, *Ulysses and the Sirens*) of non-instrumental processes (character, genuine feeling, intrinsic motivation). Instrumental adoption creates a performative contradiction: trying to *have* X *in order to* get Y undermines the very nature of X needed for Y.

  2.  **Why Existing Concepts Fall Short:**
      *   **Pragmatic Reasons for Belief (Clifford/James):** Focuses on justification/truth. Your cases aren't about whether belief *should* be held pragmatically, but how instrumental *formation* destroys the *functional role* of the attitude (e.g., the driver stops *because* she sees non-instrumental character, not belief content).
      *   **Self-Fulfilling Prophecies (Merton):** Involves a belief causing its own truth via *external* action loops (e.g., believing a bank will fail causes a run). Your cases involve an *internal* performative contradiction: the *reason for holding* the attitude destroys its *constitutive properties* (genuineness, spontaneity, non-instrumentality itself). The "fulfillment" isn't external; it's the attitude's *own existence as authentic* that's sabotaged by its instrumental genesis.

  3.  **The Joints: Identifying Sameness & Difference:**
      *   **Same Case:** *All* your examples are instances of the essential byproduct structure. The differences in attitude type (belief, emotion, disposition) and domain (trust, sleep, love, work) are secondary to the core logic: **The benefit G requires attitude A, but only if A is held non-instrumentally with respect to G. Instrumental adoption of A for G destroys the specific quality of A necessary for G.** This applies equally to:
          *   The colleague's trustworthiness (can't be cultivated *to get* lifts).
          *   Your sister's sleep/non-scorekeeping (trying *to* sleep/monitor *for* security destroys it).
          *   The student's detachment (caring *about* detachment *for* completion reintroduces the instrumental focus that blocks completion).
      *   **Manipulation Success/Failure:** What separates the desert case (pills won't work) from potentially taking a sleeping pill?
          *   **Failure (Desert, Marriage, Dissertation):** When the *benefit depends crucially on the attitude's non-instrumental origin*. A pill makes your colleague *feel* trustworthy, but drivers stop for *actual* non-instrumental character. The pill-induced state is *still* instrumental (taken *to get* lifts), so it lacks the constitutive genuineness. Similarly, a "trust pill" for marriage would create artificial feeling, likely destroying the security born of *authentic* non-monitoring. The dissertation's focused effort requires *intrinsic* motivation; instrumental tricks undermine it.
          *   **Potential Success (Sleep Pill):** When the benefit *does not crucially depend on the origin* of the state, only its *presence*. Sleep's primary benefit (restoration) might be achieved via a pill *even if* taken instrumentally. The "paradox" aspect (trying *to* sleep) is bypassed by a direct physiological intervention acting *outside* the intentional state. The pill doesn't create "non-instrumental sleep"; it creates sleep *simpliciter*. The marriage/dissertation benefits *do* depend on origin.

  4.  **Nearest Concepts & Their Shortcomings:**
      *   **Essential Byproducts (Elster):** *Directly* captures the core mechanism (states that cannot be willed/brought about intentionally without self-sabotage). **Shortcoming:** Elster focuses heavily on examples like spontaneity, love, sleep; less on complex dispositions like trustworthiness. Your cases extend the application.
      *   **Self-Defeating Strategies/Intentions (Parfit, Gauthier):** Acknowledges that some goals are undermined by pursuing them. **Shortcoming:** Often framed in terms of rational choice/outcomes, not the *constitutive* nature of the attitude itself required for the outcome (your focus).
      *   **Overjustification Effect (Psych - Deci, Ryan):** External rewards undermine intrinsic motivation. **Shortcoming:** Focuses narrowly on motivation/rewards, not the broader range of attitudes (beliefs, trust, security) or their constitutive role in generating the benefit.
      *   **Performative Contradiction (Habermas, Searle):** An utterance/act undermines its own presuppositions. **Shortcoming:** Primarily applied to speech acts/rational discourse, not the internal structure of attitudes and their functional efficacy as in your cases. Your examples involve a *pragmatic* performative contradiction, not a semantic/logical one.

  **Conclusion:** You have one core phenomenon (essential byproducts) manifesting across different domains. The differences in attitude type don't fracture the core; they illustrate its generality. Manipulation works only when the benefit doesn't require the attitude's *non-instrumental origin* (like a sleep pill's physiological effect vs. the trust pill's failure to create genuine character). Elster provides the foundational concept; your cases refine and expand its application, particularly regarding complex dispositions and the precise analysis of when manipulation fails. Focus on the *constitutive dependence* of the benefit on the attitude's non-instrumental nature to find the joints.
