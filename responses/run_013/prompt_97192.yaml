answer: |-
  ### 1. Bottom Line  
  The two-ledger proposal offers a useful conceptual separation but collapses under the weight of Bem’s case. Frequentism rigorously exposes design flaws (multiplicity, undisclosed flexibility) that invalidate the original "successes," while Bayesianism rightly demands extraordinary evidence for extraordinary claims and explains why replications should devastate credence. However, the ledgers aren’t separable: **design choices (frequentist domain) directly shape the evidence’s interpretive context (Bayesian priors)**. Bem’s episode shows both frameworks failing when actors ignore their core tenets—frequentists by neglecting procedure, Bayesians by accepting vague priors—and proves that "failed replication" alone resolves little without both ledgers interrogated together.

  ---

  ### 2. The Episode as I’d File It  
  In 2011, social psychologist Daryl Bem published nine experiments in a top journal claiming evidence for "precognition"—subjects anticipating future random events. Eight experiments yielded significant results (*p*<.05), often narrowly (e.g., *p*=.04). One framed itself as a time-reversed conceptual replication of known priming effects. Critics immediately flagged issues: undisclosed flexibility in analysis, multiple testing without correction, and a sampling plan suggesting optional stopping. A subsequent multi-lab replication effort (36 labs, 7 experiments) found only 1 significant result, with effect sizes near zero. Bem’s paper became emblematic of psychology’s replication crisis, where high-profile findings evaporated under scrutiny. Pressure points: the fragility of narrow significance, the ambiguity of "conceptual replication," and the chasm between initial excitement and replication failure.

  ---

  ### 3. The Frequentist Reading  
  Frequentism condemns Bem’s original paper. The **multiplicity of tests** (nine experiments, multiple outcomes) drastically inflates Type I error risk. If analyses were exploratory or flexible (e.g., choosing dependent variables post-hoc), the nominal *p*-values are invalid. **Sampling plans** matter: if Bem stopped early after seeing significance (optional stopping), error control is compromised. A proper frequentist reanalysis would apply family-wise error correction (e.g., Bonferroni), turning "significant" results into noise. The **replication wave** is decisive: consistent non-significance across independent labs indicates the original effects were likely false positives. "Failed replication" here *is* the frequentist verdict: the procedure (original experiments) failed to reliably detect a real effect under repeated sampling. The framework is silent, however, on how to update belief in the effect itself—only on the procedure’s unreliability.

  ---

  ### 4. The Bayesian Reading  
  Bayesianism focuses on how evidence *should* shift rational belief. For precognition—an extraordinary claim—a **skeptical prior** (e.g., placing 99%+ probability on *no effect*) is essential. Bem’s narrow *p*-values, when combined with such a prior, yield negligible posterior odds. Crucially, the **likelihood principle** renders stopping rules irrelevant: the *data alone* drive belief updates, not the design’s unobserved intentions. However, **multiplicity still corrupts** evidence: running many tests and reporting only "successes" implicitly selects data that maximizes likelihood, inflating false confidence. The **replication failures** are devastating: they represent overwhelmingly strong evidence *against* the effect. But Bayesians also see a deeper lesson: replication failures expose flaws in the *field’s prior calibration*. If psychologists assigned high prior probability to implausible effects (treating them as "ordinary"), the crisis reflects prior overconfidence, not just methodological sloppiness.

  ---

  ### 5. Where Each Framework Misreads the Episode  
  **Frequentism’s blind spots**: It cannot quantify evidence *for the null*—replications "failing" only mean no significant effect, not proof of absence. It also ignores **prior plausibility**: treating precognition identically to mundane effects (e.g., mood priming) misallocates skepticism. Its most exposed moment: dismissing Bem’s *p*-values *only after* replications failed, rather than condemning the design upfront.  

  **Bayesianism’s blind spots**: It struggles to formalize **researcher degrees of freedom**. Bem’s "conceptual replication" (testing many variations until one succeeds) creates a "garden of forking paths" where the likelihood is undefined without full disclosure of all attempted analyses. It also cannot compel **proper priors**: if Bayesians accept Bem’s vague or optimistic prior (e.g., "precognition might exist"), the evidence seems stronger than it is. Its most exposed moment: when critics *had to use frequentist tools* (e.g., p-curve analysis) to detect data manipulation because Bem’s methods lacked transparency.  

  *Both frameworks are silent* on sociological forces: why journals published extraordinary claims on weak evidence, or why replications took years to materialize.

  ---

  ### 6. The Two-Ledger Proposal Assessed  
  The proposal **collapses** in this case. Why? Because **design choices directly structure Bayesian priors**. Bem’s undisclosed flexibility (a frequentist concern) means the evidence presented was cherry-picked, forcing Bayesians to *retrospectively* adjust their priors for selection bias—something the framework doesn’t mandate. Similarly, frequentist error rates depend on defining the "space" of possible analyses (multiplicity), which is itself a prior commitment about what tests could have been run. Worse, Bem’s "conceptual replication" exploited ledger confusion: frequentists saw it as novel evidence, while Bayesians treated it as independent confirmation—but both ignored that its design was tailored to evade falsification. The ledgers bleed at the seams: **design transparency is a precondition for either ledger to function**.

  ---

  ### 7. What This Case Settles, and What It Doesn’t  
  **It settles that neither framework alone prevents self-deception**. Frequentism failed when actors ignored procedure; Bayesianism failed when priors weren’t skeptical enough. **It also settles that replications test the entire research ecosystem**—design, analysis, and priors—not just an effect’s existence.  

  **It leaves open whether the frameworks can be integrated**. The case proves they *must* interact (design shapes evidence interpretation), but not *how*. Should journals demand Bayes factors *with* preregistration? Should priors incorporate design robustness? Bem’s episode doesn’t answer this. Crucially, **it doesn’t resolve the "tribal" conflict**: Bayesians will see replication failure as prior misspecification; frequentists will see it as procedural failure. The frameworks still answer different questions—but Bem proves those questions are inseparable.
