     - Idea: The judge can ask for clarification on any step that seems unclear. This might help if the obfuscation is due to complexity, but if the disproof is inherently hard (not just complex in presentation), then interrogation might not help. The dishonest side can still make a claim that requires an exponentially long refutation, and the judge might not be able to get a satisfactory answer in the time allowed. It's more about clarity than about the inherent hardness of the refutation.
