     - Idea: If a step is hard to refute, the debate focuses on that step in a sub-debate. This might break down the problem into smaller pieces. However, the dishonest side can still make a claim in the sub-debate that is itself hard to refute, leading to an infinite regress or a very deep recursion that might be impractical. Also, the leaves of the recursion might still be hard to judge if they are complex.
