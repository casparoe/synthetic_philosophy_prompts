  - Option 2 (certificates) and option 3 (cheaply checkable witnesses) are similar. Both require that the claims be verifiable by the judge. Option 2 is about providing a certificate for each claim, and option 3 is about restricting the debate to only those questions that have such witnesses. So they are related: option 3 is a way to enforce that the entire debate is within the realm of checkable claims, while option 2 is a per-claim requirement. But they are not exactly the same.

