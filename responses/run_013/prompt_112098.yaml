  7. **Dock a debater's score later:**
     - Idea: This is a deterrent. If a debater makes a false claim, they are penalized later when it's discovered. This might discourage the dishonest side from making a blatantly false claim that might be discovered later. However, it doesn't help during the debate: the judge might still be fooled at the time. Also, if the claim is never checked (because it's too hard to check), then the penalty never happens. Moreover, in the context of the debate, the immediate goal is to win, and the delayed penalty might not be a strong enough deterrent if the stakes of winning are high.
