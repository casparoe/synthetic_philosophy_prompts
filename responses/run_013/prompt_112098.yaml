  - **Tier 2 (Moderately Trusted):** Helps but has limitations or might not cover all cases of obfuscated arguments.
  - **Tier 3 (Least Trusted):** Doesn't address the core issue well or might be ineffective against obfuscated arguments.

  Analysis:

  1. **Give the honest debater a larger compute budget:**
     - Idea: Since the honest debater has to do the hard work of refutation, giving them more resources might help. However, if the disproof is astronomically hard, even a large budget might not be enough. Also, we don't know how much to scale it by, and the burden of proof might be arbitrarily lopsided.
     - Trust level: Moderate. It helps in some cases but fails when the disproof is too hard. It's also hard to scale appropriately. So, **Tier 2**.

  2. **Require every claim to have a short certificate:**
     - Idea: This forces the debater making a claim to provide a proof that the judge can check quickly. If the dishonest side makes a claim, they must provide a certificate. If they can't (because the claim is false and they are lying), they can't produce a valid certificate. If they try to provide a fake one, the judge can check it and see it's invalid. This directly addresses the problem because the dishonest side cannot just make an arbitrary hard-to-refute claim without proof.
     - However, note that the problem is about the dishonest side making a claim that the honest side must refute. In this setup, the claim itself must come with a certificate. So if the dishonest side is making a false claim, they would have to forge a certificate (which the judge would check and reject) or they wouldn't be able to provide one. Thus, the dishonest side cannot make an arbitrary unsubstantiated claim that is hard to refute because they are required to back it up immediately.
     - This seems very strong for preventing obfuscated arguments because it shifts the burden of proof to the one making the claim. The judge doesn't have to wait for the opponent to refute it; they can check the certificate on the spot.
     - Trust level: High. This directly prevents the dishonest side from making an unsubstantiated claim that is hard to refute. **Tier 1**.

  3. **Only allow questions with cheaply checkable witnesses:**
     - Idea: This restricts the debate to topics where the answers are easy to verify. It avoids the problem by not debating anything that might lead to obfuscated arguments. But this severely limits the scope of what can be debated. Many important questions might not have cheaply checkable witnesses. So, while it prevents obfuscated arguments in the allowed domain, it doesn't solve the problem for the general case.
     - Trust level: Moderate for the specific problem because it avoids it by restriction, but it's not a general solution. **Tier 2**.

