prompt: |-
  I keep noticing a pattern in my own thinking about rescue cases, and in other people's, and I want to know whether philosophy has a name for it. Suppose I can save one person on the left or five on the right, and I go right. I am confident that this is what I ought to do, and the more people there are on the right the more confident I am — the pull scales with the numbers. But I do not think that, had I gone left, any of the five could say I had wronged them. None of them was owed a rescue; there is no one who could point to something that was due to them and was not done. So one part of the judgement rises with the numbers while the other part stays flat at nothing, however large the numbers get, and the two parts never seem to touch. The same shape shows up when I divide a fixed charity budget between two causes, or allocate a single scarce machine between two wards, where nothing has been promised to anyone.

  I have read a little of the debate about whether numbers count, and both sides seem to me to be talking about something slightly different from this. Is there an established term for a requirement that is graded — you ought to do it, and ought to all the more the greater the stakes — but that is not owed to any particular person, so that failing it wrongs no one? If it is one of the familiar positions in this area under another name, say which, and say exactly where the fit fails, and whether the position is even coherent rather than a half-way house; if nothing fits, give me a name and a definition, with cases on either side of the line, including — if such a case is possible — one in which the same requirement would wrong someone after all.

  End with a line beginning 'Verdict:' giving the best name, or your coined term, in a few words.
reasoning: |-
  Okay, the user is describing a pattern they've noticed in rescue scenarios and resource allocation. They feel a stronger obligation to save more people, yet no individual can claim being wronged if not saved. They want to know if philosophy has a term for this graded obligation without owed duties.

  First, I recall the numbers debate in ethics. Consequentialism would say saving five is better, but the user's issue is about individual claims. Deontology often focuses on duties to individuals, which might not fit here. 

  The user mentions that no one is owed rescue. That sounds like the distinction between duties of justice and duties of beneficence. Duties of justice involve specific rights, while beneficence is about general goodwill without individual claims. 

  Imperfect duties from Kant come to mind. These are obligations without specific rights-holders. For example, charity is an imperfect duty—you should help, but no one person can demand it. But imperfect duties aren't usually described as scaling with numbers. 

  Scalar utilitarianism might be relevant. It sees obligations on a scale rather than binary. But the user is combining scalar assessment with no individual wronging. 

  The term "agent-relative obligation" could be a fit, but it's not quite right. Agent-relative obligations are personal duties, like keeping a promise, which doesn't match the rescue case. 

  The user needs a term that combines two aspects: the obligation strength increases with stakes, but no particular person is wronged. "Agent-centered prerogative" from Scheffler allows agents to favor personal interests, but here it's about maximizing good without individual claims. 

  Considering cases: saving one vs. five is clear. But if there's a promise involved, like a lifeguard sworn to save a specific person, that would create a duty to that individual. Then, not saving them wrongs them. So the absence of prior obligations is key. 

  The term "imperfect duty" might still be the closest, but it needs stretching. Maybe "aggregative imperfect duty" or "scalar beneficence." But perhaps coining a new term like "aggregative beneficence without claim-rights" would be clearer. 

  Verdict should be precise. After reviewing, "imperfect duty with scalar strength" captures the graded obligation and lack of individual claims. But to be more accurate, specifying it as "beneficence-based scalar obligation" might fit better. The key is that it's not owed to individuals, scales with stakes, and doesn't wrong anyone if not acted upon.
answer: |-
  This pattern you describe is a profound observation at the intersection of consequentialism, deontology, and the nature of moral duties. Philosophy *does* have frameworks and distinctions that map onto this, though a single perfect term is elusive. Here's the breakdown:

  1.  **The Core Distinction: Perfect vs. Imperfect Duties (Kantian Framework):**
      *   **Perfect Duties:** Owed *to specific individuals* (e.g., keep promises, don't kill, don't steal). Violating them *wrongs* a specific person who had a claim against you. Failing to rescue a specific person you promised to save would violate a perfect duty *to them*.
      *   **Imperfect Duties:** Obligations to adopt certain maxims or ends (e.g., beneficence, charity, self-improvement), but *not owed to any specific individual*. You have discretion over *how, when, and to whom* you fulfill this duty. Failing to help *someone* might be a failure of beneficence, but you don't wrong any *particular* person you didn't help, because none had a specific claim *on you*.

  2.  **Scaling with Numbers: Scalar Utilitarianism/Consequentialism:**
      *   Consequentialism (especially utilitarianism) holds that the right action is the one that maximizes good consequences. The "strength" of the obligation to choose one option over another *scales* with the difference in expected good (e.g., saving 5 lives creates much more good than saving 1).
      *   **Scalar Utilitarianism** explicitly argues that moral obligations exist on a spectrum (scalar) rather than being binary (right/wrong). The "more you ought" feeling directly corresponds to how much better one outcome is than the alternatives.

  3.  **Your Pattern: Combining Scalar Beneficence & Imperfect Duty:**
      *   Your description perfectly fits an **Imperfect Duty of Beneficence that has Scalar Strength**.
      *   **Graded/"Ought More" Aspect:** This comes from the consequentialist/scalar assessment of outcomes. Saving more lives produces significantly more good. The moral "pull" increases with the stakes because the *difference in good achieved* increases.
      *   **"Wrongs No One" Aspect:** This comes from the imperfect duty structure. The duty to help/rescue is general. No specific person on the right had a pre-existing claim *against you* that you *must* save *them*. You had an obligation to *promote good/rescue people generally*, but fulfilling that obligation by saving the one on the left wouldn't violate any *specific person's* right. You failed the general duty of beneficence optimally, but you didn't violate a perfect duty *to* any of the five.

  4.  **Why Other Debates Feel Different:**
      *   **"Do Numbers Count?" (Taurek, Scanlon, etc.):** This debate usually centers on whether the *aggregation* of small harms/losses (like death) across many people *outweighs* a larger harm/loss to one person *in a way that creates a decisive obligation*. It often assumes a backdrop where a decisive obligation *would* wrong someone if violated. Your observation separates the scalar weight of the outcome from the question of individual claims/wronging, which is less central in the standard numbers debate.
      *   **Agent-Relative vs. Agent-Neutral:** This distinction (Nagel, Parfit) is about *reasons*: Are your reasons for acting based on the state of the world (agent-neutral) or your specific relation to it (agent-relative)? Your pattern involves an agent-*neutral* reason (maximize good) but focuses on the *structure of the duty* it generates (imperfect, non-wronging) rather than the reason itself.

  5.  **Coherence and Cases:**
      *   **Coherent?** Absolutely. This is a stable and coherent position. It combines a consequentialist assessment of outcomes (generating scalar weight) with a deontological/Kantian view of the structure of duties (distinguishing perfect/imperfect). Many sophisticated consequentialists adopt structures like this to avoid implying implausible individual claims.
      *   **Cases Illustrating the Distinction:**
          *   **Clear Case of Your Pattern (No Wronging):** The classic rescue case you describe. No promises, no special relationships. Saving 5 is overwhelmingly better, but saving the 1 doesn't wrong any of the 5 individuals.
          *   **Case Where Failing *Would* Wrong Someone (Perfect Duty):** You are the *sworn lifeguard* responsible for guarding a specific section of beach (e.g., the right side). You see 5 drowning on the right and 1 on the left. You choose to save the 1 on the left. Here, you *wrong* the 5 on the right (or their families/the community) because you violated a *perfect duty* – your specific contractual or role-based obligation *to them* or *to guard that area*. The duty originated from a specific relationship/promise.
          *   **Case Where the "Ought More" Intuition Might Weaken (But Still No Wronging):** Dividing a charity budget between preventing many cases of moderate suffering (Cause A) and saving fewer lives (Cause B). The scalar assessment might be complex (how to weigh lives vs. suffering reduction?), making the "ought more" less clear-cut than 1 vs. 5 lives. However, failing to fund Cause B optimally still doesn't *wrong* any specific individual who suffered, as the duty remains imperfect beneficence.

  **Verdict:** The most precise established term is **Scalar Imperfect Duty (of Beneficence)**. If coining a term emphasizing the key features you identify: **Non-Wronging Scalar Obligation.**
