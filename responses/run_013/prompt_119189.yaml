prompt: |-
  I am a high school student working on a semester-long independent research paper, and I have been trying to understand how many individually unreliable judgments can be combined into one reliable judgment. The version I started from is the result usually credited to Condorcet: if each member of a group is more likely than not to answer a binary question correctly, and the members' judgments are independent of one another, then the probability that the majority is correct approaches certainty as the group grows, whereas a group whose members are each worse than a coin flip becomes steadily more likely to be wrong. My own version of the exercise replaced the judges with a handful of large language models that I asked the same questions and then combined by majority vote. Adding models helped for a while and then stopped helping, and on a few questions the majority was confidently wrong in a way that looked coordinated rather than random.

  I do not want a reading list, citations, or the names of papers. I want to know where the genuine open questions are and which of them I should spend the semester on. Please give me a ranked agenda of roughly four questions, defended rather than merely listed, and tell me what I am getting wrong about the framing. I am especially unsure how much of the interesting work lies in the two words that do all the heavy lifting in the theorem — independence and competence — since each seems to me to mean several different things: independence of errors versus independence of judgments given the truth, competence as a stable trait of a person versus a probability that varies question by question, and perceived competence versus actual competence. I also suspect that when the judges are models trained on overlapping text, their mistakes are correlated by construction, so that the aggregate may be reporting the most common answer in the training data rather than converging on the truth — a poll rather than a jury. And I do not know what becomes of the whole framework when the question has no single correct answer, or when the goal is not accuracy but a decision that is good enough under uncertainty.

  For each item on your list, please state the criteria you are ranking by and where those criteria conflict, explain why the question is upstream of the others, say whether someone with my resources can actually make progress on it without running large experiments, and identify what would move it up or down the ranking over the course of a semester. Please also flag any question that looks important but turns out to be a dead end because its answer would not change anything downstream, and any that I have not thought to ask about at all.
reasoning: |-
  Okay, the user is a high school student working on an independent research paper about combining unreliable judgments, specifically using large language models (LLMs) instead of human judges. They've encountered the Condorcet Jury Theorem, which shows that with independent and competent judges, majority voting improves accuracy as the group grows. However, when using LLMs, adding more models helped initially but then plateaued, and sometimes the majority was confidently wrong in a coordinated way.

  The student wants to understand where the open questions lie and which ones they should focus on for their semester-long project. They're particularly interested in the concepts of "independence" and "competence," which are crucial in the theorem but might be more complex in practice with LLMs. They also suspect that since LLMs are trained on overlapping data, their errors might be correlated, leading to the majority reflecting the most common answer in the training data rather than truth. Additionally, they're curious about scenarios without a single correct answer or when the goal isn't accuracy but a "good enough" decision.

  Their deeper needs might include wanting to contribute original insights without needing extensive resources, avoiding dead-end questions, and understanding how to frame their experimental results within theoretical frameworks. They might also be looking for validation of their observations about LLMs and guidance on feasible research directions given their constraints.

  The key areas to explore are independence, competence, correlated errors, and alternative goals beyond accuracy. Independence is tricky with LLMs because they share training data, leading to systemic biases. Competence varies per question, especially with ambiguous or subjective queries. Correlated errors make the majority vote less effective, as seen in the student's experiments. And when there's no single correct answer, traditional metrics like accuracy don't apply, requiring different evaluation methods.

  Ranking these questions, independence should be top because it's foundational; if errors are correlated, the theorem's assumptions fail. Investigating why LLMs produce similar errors could reveal insights about training data biases. Competence variability comes next, as understanding when models fail (e.g., on ambiguous questions) helps design better aggregation methods. Then, correlated errors as a structural issue, explaining why majority voting plateaus. Finally, alternative goals for decision-making under uncertainty, which expands the scope beyond binary correctness.

  Feasibility is crucial. The student can analyze existing model outputs, design small-scale experiments with different prompts or models, and use statistical tools without large compute resources. Questions like defining competence per question or testing independence through error correlation are manageable. However, theoretical work on alternative decision frameworks might be too broad for a semester.

  Dead ends include purely theoretical explorations without empirical testing or questions too vague to measure. Instead, focusing on measurable aspects like error patterns in specific LLMs or designing practical tests for independence would yield tangible results. The student should also consider if their research can inform when not to use majority voting with LLMs, adding practical relevance.
answer: |-
  Here’s a ranked agenda of open questions tailored to your LLM experiments, theoretical framing, and resource constraints. I’ve prioritized based on **actionability** (what you can test with limited compute), **foundational impact** (how much it explains your observations), and **novelty** (underexplored angles for LLMs). Conflicts arise when a question is theoretically deep but hard to test (e.g., "true competence") vs. empirically tractable but narrower.

  **Core Insight:** Your key framing issue is treating LLMs as *voters* in a Condorcet setup. In reality, they’re **statistical echoes of a shared training corpus**. This breaks independence and makes "competence" a function of data bias, not truth-seeking. Your "confidently wrong majority" isn’t a fluke—it’s the system working as (poorly) designed.

  ### Ranked Research Agenda
  1.  **How does *functional dependence* in LLM errors undermine majority voting, and can we detect/model its structure?**  
      **Why upstream?** Independence is the most brittle assumption in your setup. If errors are correlated, majority voting amplifies systemic bias, not truth. This directly explains your plateau and "coordinated" wrong answers.  
      **Feasibility:** High. Re-analyze your existing data:  
      - Calculate pairwise error correlations between models on the same questions.  
      - For questions where the majority was wrong, examine if all models made *identical* errors or different ones.  
      - Test if errors cluster by question type (e.g., all models fail on logic puzzles).  
      **Progress possible?** Yes. Even without new experiments, analyzing your error patterns can reveal dependence signatures. With minimal resources: perturb inputs (e.g., slight rewrites of questions) to see if errors decorrelate.  
      **Dead end risk:** Low. Proving dependence exists is useful; modeling *how* it works (e.g., via shared misconceptions) is actionable.  
      **Move up/down:** If strong correlation patterns emerge early, dive deeper. If errors seem random, deprioritize.  

  2.  **Is *question-specific competence* predictable, and does it explain when majority voting fails?**  
      **Why upstream?** The theorem assumes constant competence (>0.5), but LLMs vary wildly by question type. "Competence" here is *accuracy relative to your ground truth*, not an inherent property. This explains why adding models sometimes helps (on "easy" questions) and sometimes backfires (on "hard" ones).  
      **Feasibility:** High. Use your existing data to:  
      - Group questions by type (factual, reasoning, ambiguous, controversial).  
      - Plot model accuracy and majority gain/loss per group.  
      - Identify if "competence" dips below 0.5 for certain types (e.g., when training data is conflicted).  
      **Progress possible?** Yes. Categorizing questions and correlating with performance requires no new runs. If resources allow, test new questions designed to probe weak spots (e.g., questions with conflicting expert opinions).  
      **Dead end risk:** Medium-High if you only describe patterns without insight into *why* competence varies (e.g., data gaps, task mismatch). Mitigate by linking to dependence (Q1).  
      **Move up/down:** If competence variance is dramatic, prioritize. If stable, shift focus to Q1 or Q3.  

  3.  **Does majority voting converge to *training data consensus* rather than truth? How severe is the distortion?**  
      **Why here?** This is the "poll vs. jury" concern. LLMs reflect training data, so correlated errors likely represent dominant biases. This question synthesizes Q1 (dependence) and Q2 (variable competence).  
      **Feasibility:** Medium. Requires comparing model answers to:  
      - Documented cultural/scientific controversies (e.g., "Is X harmful?" where truth is disputed).  
      - Questions where you can estimate real-world opinion (e.g., via surveys or citation counts).  
      **Progress possible?** Limited but feasible. Use proxy measures:  
      - Check if wrong majority answers align with top Google/search result snippets (as rough proxies for "common view").  
      - Design questions with known data imbalances (e.g., "Do vaccines cause autism?" where falsehoods are prevalent online).  
      **Dead end risk:** High if you lack ground truth or bias measures. Focus on questions with *clear* expert consensus vs. popular myths.  
      **Move up/down:** If your data shows consistent bias toward popular misconceptions, elevate. If not, Q1/Q2 are richer.  

  4.  **When truth is ambiguous or goals are "good enough," what replaces majority voting?**  
      **Why downstream?** This extends beyond Condorcet’s assumptions. If answers are subjective or decisions involve costs (e.g., false positives vs. false negatives), accuracy isn’t the only metric.  
      **Feasibility:** Low-Medium (conceptual). You can:  
      - Redefine "correctness" (e.g., "clinically useful" vs. "factually precise" for medical advice).  
      - Simulate decision rules (e.g., require supermajority for high-stakes answers).  
      **Progress possible?** Limited without a specific use case. Best for discussion if your data has ambiguous questions.  
      **Dead end risk:** High without clear application. Theoretical without experiments.  
      **Move up/down:** Only prioritize if your data includes inherently ambiguous questions (e.g., ethics, policy). Otherwise, deprioritize.

  ### Critical Framing Corrections
  1.  **Independence ≠ Statistical Independence:** Condorcet requires *error independence conditional on the truth*. For LLMs, this is violated because:  
      - They share training data → common errors.  
      - They use similar architectures → similar failure modes.  
      **Action:** Stop calling them "independent judges." Frame them as "correlated predictors."  

  2.  **Competence is Ill-Defined:**  
      - **Not a trait:** An LLM’s accuracy depends on the question, prompt, and context. There’s no single "competence" score.  
      - **Not truth-seeking:** LLMs optimize for plausibility over truth. If falsehoods are common in training data, high "competence" may mean high bias.  
      **Action:** Measure *empirical accuracy per question type*—not "competence."  

  3.  **"Correct Answer" Assumption:** For many LLM use cases (e.g., advice, creative tasks), there’s no ground truth. Condorcet doesn’t apply.  
      **Action:** For ambiguous questions, abandon the theorem. Explore metrics like *usefulness*, *consistency*, or *user satisfaction*.  

  ### Suggested Path Forward
  - **Weeks 1–2:** Re-analyze your data through the lens of **Q1 (dependence)**. Map error correlations and "coordinated failures."  
  - **Weeks 3–4:** Investigate **Q2 (variable competence)**. Categorize questions and link to performance drops.  
  - **Weeks 5–6:** If Q1/Q2 show systemic issues, probe **Q3 (training data bias)** with targeted experiments.  
  - **Weeks 7–8:** Based on findings, propose mitigations (e.g., diversify models, use weighted votes, or abandon majority voting for contentious tasks).  

  **Highest ROI:** Focus on **dependence (Q1)** and **variable competence (Q2)**. They’re testable with your data, explain your observations, and challenge naive applications of Condorcet to AI. If you crack these, you’ll have a rigorous critique of ensemble LLM voting—and a path toward better aggregation methods.
