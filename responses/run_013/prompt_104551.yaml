prompt: |-
  Quick question for someone who actually knows this stuff — take the role of a game theorist who's TA'd the first-year PhD micro sequence a few times, and please brainstorm out loud a bit before committing to an answer, because I suspect I'm missing something structural.

  I've been teaching myself solution concepts and I think I've found a shortcut that makes Nash equilibrium basically redundant. Here's the reasoning. First, a strictly dominated strategy can never be a best response, obviously. Second, once you let people randomize, "strictly dominated" and "never a best response" turn out to be the same thing — I read this somewhere and it checks out, and it's why you have to allow mixed strategies when you do the elimination, otherwise you miss cases. Like in a little game I built, three rows with payoffs (4,0), (1,1), (0,4) against two columns: the middle row loses to each of the others on one of the columns, but it's strictly worse than the 50-50 mix of them, so pure-strategy elimination leaves it sitting there and mixed-strategy elimination kills it. Fine.

  So now iterate: cross off everything strictly dominated, mixtures included, and repeat until nothing moves. I read that what survives is exactly the set of strategies that can be rationalized — everything that's a best response to *some* belief about what the others are doing, never mind whether those beliefs are correct.

  And here's my punchline. With common knowledge of rationality, everyone should end up inside that surviving set. So the elimination is doing all the real work, and Nash equilibrium is just that plus an extra assumption that people's beliefs happen to be right about each other. That seems like a lot of baggage for a small gain. So why hasn't the field just replaced Nash with iterated elimination? My guess is it's definately just a technical gap — some games where the iteration doesn't quite finish — and that better machinery would close it.

  Two sub-questions while you're at it. (1) Since you'd never knowingly play a weakly dominated strategy either, why not cross those off too and get a sharper answer? (2) In the games I've messed around with, the iteration either grinds everything down to a single profile (prisoner's dilemma) or does basically nothing at all (matching pennies). Is that one-profile outcome the normal case or am I picking flukes? Because if it's normal, I really don't see what Nash is adding.

  I'd much rather be told my framing is confused than have the question answered politely as asked. And at the end, tell me how confident you are in each claim and single out the point you're least sure of — my money's on the weak-dominance bit.
