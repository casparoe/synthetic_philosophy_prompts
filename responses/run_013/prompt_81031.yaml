  I'm a novelist, and I keep a notebook of gut feelings about how a person's confidence should move when the evidence is less than certain — my current book has a doctor in it who's always reasoning from fuzzy scans and secondhand reports, and I want to get her head right. Put on your formal epistemologist hat (I gather some of this lives under "uncertain evidence", maybe Jeffrey conditionalization — I got about three pages in and gave up). No citations or reading lists please, I can't look anything up; just reason it out from scratch, and maybe brainstorm a few candidate principles before you settle on one. Here are my verdicts:

  1. A specialist I completely trust looks at the scan and says "I'd put it at 80% that it's the bad one." My credence should become 80%. Not 1, not unchanged. This one I'm sure about.

  2. A colleague whose judgement I trust only somewhat is 90% sure my ending doesn't work, and I'm 50/50. I feel I should land *between* us — maybe 70% — like averaging two opinions. Someone told me this is naive but wouldn't say why. If I trust her more than myself, shouldn't I end up nearer her? And I can't see how averaging could ever put me further from her than we both already are.

  3. When I half-see something in the fog and think "person", what I'm certain about is how it looked to me, not that anyone's there — so I'd expect the rule to start from the appearance and work outward. But that seems to clash with 1, where all I'm certain of is that she said "80%", and yet I don't feel I should have to run that through a theory of how often she's right.

  4. Two letters arrive, one says the publisher passed, the other that my agent quit; opening them in the other order shouldn't change my final opinion. A friend with a PhD says the standard rule for uncertain evidence actually gets this wrong and that order can matter. I think she's wrong but I can't say why.

  5. The one I keep flip-flopping on: I'm never really certain how confident I am. Does the rule apply to me at all, or only to a creature that knows its own mind exactly?

  So — what principle (or small set of rival principles) captures these? State it precisely, tell me which verdict each clause is there to save, what it predicts for cases I haven't listed (a memory of a dream? a source who might be lying?), and which of my five feelings it forces me to drop or revise. If 2 and 4 are just mistakes, say so and tell me what I should feel instead. Take your time with it.
