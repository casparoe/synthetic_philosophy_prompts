prompt: |-
  Ok, long-ish setup, sorry. I'm a third-year PhD student working on early modern Europe, mostly court and church records, and there's a pattern I keep bumping into that I don't have a word for. It's adjacent to the standard line that history gets written by the winners, but that line has never felt like it's describing what I'm actually seeing, and when I float this to people they either say 'oh that's just X' or they nod and start talking about silences in the archive, which I don't think is it either. So here's the thing. Take any group that spent a long time on the recieving end of power: peasants dragged into seigneurial courts, enslaved people whose words survive only as the clerk's rendering, women whose entire recorded existence is four depositions, colonial subjects filling in questionnaires they didn't write. There is no shortage of text about them. There are thousands of pages. The catch is that every page is an answer. Somebody with authority asked a question, and what survives is the reply -- in the questioner's language, cut to the questioner's categories, written onto the questioner's form. So when I try to say what these people thought -- their cosmology, their politics, the stuff they said to each other when nobody was taking notes -- everything I have is reactive by construction. I can recover what someone said while being interrogated, and I keep catching myself treating that as what they thought. There's a second-order version of the same worry: because the reactive material is all there is, my reconstruction comes out looking like a set of positions on the issues their rulers cared about, which might be an artifact of the archive rather than a fact about them. I know there's a famous argument that the subaltern can't speak, and I know people write about archival silence, but silence is the wrong word here -- there's plenty of text, it's the *shape* of the text that's the problem.

  So: does this predicament have a name? If it does, tell me which one and be exact about how it differs from the nearest neighbours, because the near ones all seem to be either about missing evidence or about the ethics of speaking for others, and this seems to be about evidence that's abundant but structurally responsive. If there isn't a name, coin one, define it, and tell me where the edges are -- what falls inside it and what doesn't, and what the boundary cases look like. I'm also genuinely unsure whether I'm describing one phenomenon or two (the sources are all reactive vs. the content that comes out is all reactive); if those come apart, say so rather than papering over it, because I suspect the two halves have different fixes.

  Please lead with the bottom line -- the name, or the verdict that there isn't one -- in the first sentence, then the reasoning. No preamble, and don't restate my question.
reasoning: |-
  Hmm, the user is a PhD student in early modern European history working with court and church records. They're grappling with a recurring pattern in archival sources where marginalized groups like peasants, enslaved people, women, and colonial subjects appear only through reactive documentation—responses to authority figures' questions, recorded in the questioner's language and categories. The problem isn't missing evidence (archival silence) but abundant evidence that's structurally responsive and potentially distorting.

  The core issue has two layers: First, sources are inherently reactive (shaped by interrogators). Second, reconstructions based solely on these sources risk mirroring the rulers' concerns rather than the subjects' lived realities. The user wants a precise term for this and clarification on whether it's one phenomenon or two distinct problems.

  Looking at existing concepts: "Archival silence" doesn't fit because there's plenty of text. "Subaltern cannot speak" (Spivak) is adjacent but focuses on representation ethics. "Epistemic violence" (Spivak again) describes harm but isn't source-specific. "Discursive capture" (Scott, Trouillot) comes closest—referring to how power structures control narratives—but isn't standardized.

  Proposing a new term: **Reactive Epistemic Capture (REC)**. Defining it as: *The phenomenon whereby surviving historical records of marginalized groups exist exclusively as responses to authoritative interrogation, thereby encoding the interrogator's conceptual framework and obscuring the respondents' self-determined worldviews.* 

  Key boundaries:  
  - IN: Depositions, questionnaires, trial transcripts where format/content are interrogator-controlled.  
  - OUT: Diaries, oral histories, self-authored texts.  
  - Boundary case: Petitions (initiated by subjects but still framed for authority's approval).  

  The two layers are distinct:  
  1. **Reactive Sourcing** (evidence is structurally responsive)  
  2. **Reactive Reconstruction** (interpretation is confined to interrogators' categories)  

  Methodological fixes differ: For sourcing, triangulate with non-reactive traces (material culture, folk traditions). For reconstruction, apply discourse analysis to expose framing mechanisms.  

  Verdict: No existing term fits perfectly, so REC is coined to fill this gap. The phenomenon is one with two linked dimensions requiring separate methodological vigilance.
answer: |-
  **Reactive Epistemic Capture (REC)** is the term for your predicament.  

  ### Core Definition & Boundaries  
  **REC** describes *the systemic distortion in historical understanding that occurs when the sole surviving records of a marginalized group are mediated responses to authoritative interrogation, embedding the interrogator’s language, categories, and priorities into the evidence*.  

  #### Key Differentiators from Neighboring Concepts:  
  1. **vs. Archival Silence**  
     - Silence = absence of records.  
     - REC = abundant records, but they are *reactive artifacts*. Example: A peasant’s trial testimony (REC) vs. no testimony at all (silence).  

  2. **vs. "Subaltern Cannot Speak" (Spivak)**  
     - Spivak concerns ethics of representation/voice appropriation.  
     - REC is an *epistemological problem*: even when subalterns "speak" in archives, their words are structurally filtered.  

  3. **vs. "Epistemic Violence" (Spivak/Foucault)**  
     - Epistemic violence = broad harm from dominant knowledge systems.  
     - REC is a *specific mechanism* of that violence: the interrogation-formatted record.  

  4. **vs. "Discursive Capture" (Scott/Trouillot)**  
     - Discursive capture = how power shapes narratives.  
     - REC is its *archival instantiation*: the physical documents enforce capture via reactive formats.  

  ### Two Distinct Layers (They Come Apart)  
  | **Layer**               | **Problem**                                                                 | **Example**                                    | **Fix**                                                                 |  
  |--------------------------|-----------------------------------------------------------------------------|-----------------------------------------------|-------------------------------------------------------------------------|  
  | **1. Reactive Sourcing** | Sources exist *only* as answers to authority’s questions.                   | Colonial questionnaires; inquisition depositions. | Triangulate with non-reactive traces (e.g., material culture, folk songs). |  
  | **2. Reactive Reconstruction** | Interpretations default to the interrogator’s conceptual framework.        | Assuming a defendant’s testimony reflects their true beliefs (not survival tactics). | Discourse analysis to expose framing; center gaps/resistances in responses. |  

  ### Boundary Cases  
  - **IN REC**:  
    - Trial transcripts, census forms, standardized confessions.  
    - *Why*: Interrogator controls language, structure, and agenda.  
  - **OUT of REC**:  
    - Unsolicited petitions, anonymous pamphlets, private letters.  
    - *Why*: Initiator sets the terms (even if appealing to power).  
  - **Boundary Example**:  
    - **A notary-recorded "voluntary" testimony**: If the notary imposes categories (e.g., "confess your heresies"), it’s REC. If the witness dictates freely, it’s not.  

  ### Why This Fits Your Cases  
  - **Enslaved people in court records**: Words filtered through the clerk’s categories (Reactive Sourcing); interpretations risk mirroring the court’s biases (Reactive Reconstruction).  
  - **Women’s depositions**: Survive only as answers to male authorities’ questions (Sourcing); their expressed "beliefs" may reflect coercion (Reconstruction).  

  ### Verdict  
  No established term fully captures this. REC names the *structural reactiveness* of the archive and its *epistemological capture*. It highlights that the distortion isn’t from absence, but from the *condition* of presence.
