  I finally read that pop-philosophy book everyone keeps quoting at me, and its chapter on Pascal's wager goes more or less like this. Pascal says the existence of God is a bet you're forced to make whether you like it or not, and he lines the options up: bet on God and he exists, you win infinite happiness; bet on God and he doesn't, you lose only some finite earthly pleasures; bet against God and he exists, you get infinite misery; bet against God and he doesn't, you keep those finite pleasures. Since infinity times any positive probability is still infinite, the expected value of betting on God is infinite and the expected value of betting against him is negative infinity, so the rational choice is forced — belief strictly dominates. The book's verdict is that Pascal has handed us a proof that God exists, or at least that any rational person is compelled to believe, and then it adds that since Pascal never reckoned with the fact that you can't just decide to believe something, or with the fact that you could run the exact same wager for any of a thousand different gods, the whole thing has been dead on arrival for centuries.

  Is that a fair summary of Pascal? I'm asking becuase I can't tell where the book is being accurate, where it's simplifying in a harmless way, and where it's just wrong about what Pascal is actually up to. Go through it point by point and tell me what Pascal really argues, what a defender of the wager would push back on, and whether the book's two closing complaints actually refute the argument or are just the standard objections people raise against it. And please separate whats genuinely settled about the wager among people who've studied it from whats actually contested — I don't want a contested reading sold to me as the consensus view.
