answer: |-
  Here’s a handout quiz designed to sort readers by their implicit testimony views, using concrete cases to tease apart key distinctions. No jargon in the questions—just practical commitments.

  ---

  ### **Testimony Triage Quiz: What’s Your Gut Say?**
  *For each scenario, pick the answer closest to your instinct. Don’t overthink it!*

  1. **Train Platform**:  
     A stranger on a train platform says, "Your train leaves from Platform 3." You’ve never met them.  
     **(a)** You can believe them unless something seems "off."  
     **(b)** You need some reason (e.g., they look official, platforms match the board) to trust them.  
     **(c)** You’d check the board anyway—strangers aren’t reliable.  

  2. **Used-Car Dealer**:  
     A dealer says, "This car’s never been in an accident." They’re legally required to tell the truth.  
     **(a)** You believe them—they’d get sued if they lied.  
     **(b)** You’d want independent proof (e.g., a mechanic’s report).  
     **(c)** You don’t fully believe them, but it’s reasonable to act *as if* it’s true.  

  3. **Six-Year-Old’s Story**:  
     A child quietly tells their teacher, "Mommy cried all night." No signs of distress.  
     **(a)** The teacher should take this seriously and act on it.  
     **(b)** The teacher needs to verify (e.g., ask the child questions, check with Mom).  
     **(c)** Kids imagine things—this isn’t good evidence unless corroborated.  

  4. **Corporate Press Release**:  
     A company claims its new product is "100% safe" in its official announcement.  
     **(a)** This counts as them *telling* us it’s safe—we can trust it provisionally.  
     **(b)** It’s just advertising—treat it as weak evidence, not testimony.  
     **(c)** It’s testimony, but we need independent data to believe it.  

  5. **AI Assistant**:  
     An AI answers, "Shakespeare wrote 37 plays," confidently citing sources.  
     **(a)** This is like a person telling you—you can believe it.  
     **(b)** It’s just a tool processing data—you’re getting evidence, not testimony.  
     **(c)** You’d trust it only if you know how the AI was trained.  

  6. **Office Rumor**:  
     Everyone in your office repeats, "The boss is quitting." No one names a source.  
     **(a)** The more people say it, the more reason to believe it.  
     **(b)** Rumors aren’t testimony—they’re just social noise.  
     **(c)** It becomes believable only if you trace it to a reliable person.  

  7. **Doctor’s Diagnosis**:  
     A doctor says, "It’s a viral infection," after a brief exam.  
     **(a)** You believe them—they’re the expert.  
     **(b)** You trust them but might seek a second opinion if it’s serious.  
     **(c)** You’d ask *how* they know to assess their reasoning.  

  8. **Friend’s Movie Review**:  
     A trusted friend says, "That film is a masterpiece."  
     **(a)** You take their word for it and expect to enjoy it.  
     **(b)** You’ll see it but form your own opinion—taste isn’t transferable.  
     **(c)** You ask *why* they liked it to decide if their reasons apply to you.  

  ---

  ### **Scoring Key**  
  *Tally your answers, then see which profile fits. Positions are messy—this maps tendencies.*

  | **Answer Pattern**                           | **Likely Position**                                  | **Core Commitment**                                                                 | **Awkward Case**                                  |
  |----------------------------------------------|-----------------------------------------------------|-------------------------------------------------------------------------------------|---------------------------------------------------|
  | **Mostly (a)**                               | **Global Non-Reductionism**                         | Default right to trust *any* speaker unless defeated.                               | The AI or press release (is it *really* a speaker?). |
  | **Mix of (a) and (c)**, skeptical on 4/6/8   | **Local Reductionism**                              | Trust needs positive reasons (context/speaker-specific).                            | The child (why doubt the vulnerable?).            |
  | **Mostly (b)**, (a) only for 7               | **Strong Reductionism**                             | Always need independent evidence; testimony isn’t fundamental.                     | The stranger (why ever trust without evidence?).  |
  | **(a) on 1/3/7**, (b) on 4/5/6, (c) on 2/8 | **Assurance View**                                  | Trust requires a second-personal relationship (sincerity + address).               | The rumor (no assurer) or AI (no personhood).     |
  | **(a) on 1/2/4/5/7**, (b) or (c) on 3/6/8 | **Hybrid (Social Default + Values Skepticism)**     | Institutional/factual testimony gets default trust; moral/aesthetic doesn’t.       | The movie review (why the asymmetry?).            |
  | **(c) on 2/5/7**, (a) elsewhere             | **Transmission Theorist**                           | Hearer must access/assess the speaker’s evidence to "inherit" knowledge.           | The child (can’t assess their evidence).          |

  #### **Distinctions Captured**:
  - **Q1 & Q2**: Default entitlement (a) vs. need for positive reasons (b/c).  
  - **Q4 & Q5**: What counts as "testimony" (institutions/machines vs. people).  
  - **Q2 & Q7**: Sincerity/competence separation (Q2 probes deception, Q7 probes expertise).  
  - **Q7 & Q8**: Fact (Q7) vs. aesthetic (Q8) testimony parity.  
  - **Q3 & Q7**: Evidence reconstruction (Q3’s child can’t supply it; Q7’s doctor can).  
  - **Q6**: Social practice (rumor as institutional artifact) vs. individual act.  

  #### **Limitations & Empty Sets**:  
  - **Can’t distinguish**: "Credulism" (trust without defeaters) vs. "Non-Reductionism" (trust as default entitlement)—both lean (a). The quiz treats them together.  
  - **Incoherent combo**: Mostly (a) but (c) on Q1. If strangers get no default trust, it’s not global non-reductionism.  
  - **Unattractive/rare**: All (c). Requires extreme, self-undermining skepticism ("Why trust this quiz?").  
  - **Unexplored**: (a) on Q8 but (b/c) on Q7. Few defend default trust for aesthetics but not facts.  

  #### **What Your Position Struggles With**:  
  - **Non-Reductionists**: Explaining why we *shouldn’t* trust the used-car dealer or AI by default.  
  - **Reductionists**: Explaining why we ever trust strangers or children without evidence.  
  - **Assurance Views**: Handling institutional testimony (press releases) or non-agents (AI).  
  - **Transmissionists**: Cases where speakers can’t share evidence (e.g., trauma, expertise gaps).  

  Hand this out with no intro—let the cases do the work. Debrief with the key to spark discussion!  

  ---  
  *Design note: This isolates commitments better than labels. The "awkward case" column forces reflection—no position gets off easy.*
