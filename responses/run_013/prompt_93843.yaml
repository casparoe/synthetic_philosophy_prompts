prompt: |-
  I'm a PhD student in philosophy working on virtual worlds, and I want to know what principle, if any, my verdicts about them add up to. Stated flatly: when a stranger's avatar gropes mine in a VR social space, I was harassed — a real violation, not a rude gesture in a cartoon. When I shoot a scripted NPC that begs for its life, I have done nothing to anyone. When another player kills my character in a PvP zone I knowingly entered, likewise no wrong; but when a player uses an exploit to follow me out of that zone and kill me over and over for an hour, I have been harmed, and it is harassment rather than bad manners. When my account is broken into and my rare items are sold, I have been robbed, though the items are rows in a database. When the company that hosts the world I spent a decade building a house in shuts it down, I have lost something real, but no real thing was destroyed. When a friend dies and their avatar still stands where they logged out, my visits to it are real mourning, but I am not visiting them; and when a chatbot trained on their messages takes the avatar over and speaks in their voice, it is not them, and being comforted as if it were is a kind of self-deception.

  My tentative principle is what I have been calling the presence view: a virtual entity is real, and a proper object of concern, exactly insofar as some real person is actually present in it or actually stands behind it — my avatar is me while I am in it, the NPC is nobody, the abandoned avatar is a shell. That seems to give me the groping, both killings, the standing avatar and the griefbot; but it says nothing about why the consensual killing and the exploit killing come apart, since I am equally present in both, and it seems to make the theft unreal, since no one is present in my items, only an institution everyone is treating as real. Tell me what the principle should be, or what the smallest set of them is, stated precisely enough that I can see which clause is doing which work and which of my cases forces each clause; the verdicts it forces on cases I have not listed — a company that sells a memorial copy of a dead user's avatar to strangers, and a world whose NPCs have become indistinguishable from players, so that no one in it can tell who is present; and which of my verdicts it cannot save. The one I keep going back and forth on: someone builds a replica of my late friend's avatar from their chat logs, passes it off as them, and gets me to confide what I would tell no stranger. I want to say I have been defrauded, but on my other verdicts nothing real was done to me, since the thing that fooled me was never my friend and may not have been anything at all.
reasoning: |-
  Hmm, this is a fascinating philosophical inquiry about virtual worlds from a PhD student. The user presents several nuanced scenarios and seeks a unified ethical framework to judge them. Their "presence view" has intuitive appeal but fails to fully explain their own moral intuitions about exploits, theft, and deception. 

  The core tension lies in how we assign moral weight to digital entities when traditional physical referents are absent. The user's cases reveal at least three distinct dimensions: agency (who controls the action), relationality (social contracts between users), and institutional grounding (systems that create persistence). Their struggle with the fake friend avatar is particularly telling - it suggests we need to account for deception's harm regardless of the replica's ontological status.

  Notably, the user already grasps that virtual harm isn't about pixels but about human experience. Their examples show violations of autonomy (non-consensual groping), exploitation of systems (item theft), and emotional manipulation (fake griefbot). The institutional layer seems crucial for cases like server shutdowns where no single actor is blameworthy yet real loss occurs.

  The memorial avatar case they mention later would test whether we value digital artifacts as extensions of personal identity. If a company monetizes a dead user's avatar, is that fundamentally different from selling someone's private letters? This connects to their unresolved question about deception - in both cases, the harm stems from broken expectations about how digital traces should be treated.

  What's needed is a framework that distinguishes between:
  - Direct interpersonal harms (groping, harassment)
  - Systemic/institutional harms (theft, server shutdown)
  - Representational harms (deception via avatar replicas)
  While maintaining that the virtual is real insofar as it affects human flourishing. The challenge is doing this without falling into dualism that treats "virtual" and "real" as separate spheres.
answer: |-
  Your cases reveal that **presence alone is insufficient** as an ethical criterion. The principles must account for **consent, relational context, institutional trust, and the ontology of virtual entities**. Here’s a minimal framework derived from your intuitions, with explicit clauses mapping to your cases and extensions:

  ---

  ### **The Relational Ontology Framework for Virtual Ethics**
  1. **Agency Condition**:  
     *A virtual act has moral weight iff it involves a sentient agent’s will (human or AI with person-level cognition).*  
     - ↳ Explains: NPC killing is neutral (no agency). Griefbot deception is wrong (it mimics agency to manipulate).  
     - ↳ Forces: Indistinguishable NPCs/players? If NPCs lack true agency, harming them remains neutral—but deceiving players about *which* entities are agential violates consent.  

  2. **Consent & Context Condition**:  
     *Harm occurs when acts violate contextually reasonable expectations of consent, as defined by shared rules or norms.*  
     - ↳ Explains: PvP-zone killing (consensual context) vs. exploit-killing (non-consensual breach). Avatar groping (no opt-in to contact) vs. scripted combat (agreed rules).  
     - ↳ Forces: Selling a dead user’s avatar? Violates implicit norms of memorial integrity if done without consent.  

  3. **Relational Integrity Condition**:  
     *Virtual entities gain derivative moral status when they are:  
     (a) extensions of personal identity (avatars),  
     (b) products of invested labor (your house), or  
     (c) focal points of human relationships (abandoned avatar as memorial).*  
     - ↳ Explains: Your avatar during use (*you*, identity-extension). Your house (labor-derived value). Mourning at friend’s avatar (relational significance).  
     - ↳ Forces: Item theft? Robbery (items are labor-invested property under institutional rules). Server shutdown? Real loss (destruction of relational/labor-derived world).  

  4. **Deception Threshold**:  
     *Fabricating agency or identity to induce intimacy/trust is fraudulent, regardless of the replica’s ontological status.*  
     - ↳ Explains: Griefbot (fraudulent comfort). Fake friend avatar (defrauding confidences—*you* were harmed via manipulation).  
     - ↳ Forces: Replica sold to strangers? Harmless if transparent, fraudulent if marketed as the "real" person.  

  ---

  ### **How Your Cases Are Resolved**
  | **Case**                          | **Principle Applied**                                  | **Verdict**                     |  
  |-----------------------------------|--------------------------------------------------------|---------------------------------|  
  | Avatar groping                    | Agency (you) + Consent violated                        | Harassment                      |  
  | Scripted NPC kill                 | No agency → No moral weight                            | Neutral                         |  
  | Consensual PvP kill               | Contextual consent                                     | Permissible                     |  
  | Exploit-killing                   | Consent violated (context breached)                    | Harassment                      |  
  | Item theft                        | Relational (labor/property) + Institutional betrayal   | Robbery                         |  
  | Server shutdown                   | Relational (labor/community loss)                      | Real harm                       |  
  | Mourning at friend’s avatar       | Relational (memorial focal point)                      | Authentic mourning              |  
  | Griefbot "comfort"                | Deception (fabricated agency)                          | Fraudulent/self-deception       |  
  | Fake friend confidance scam       | **Deception Threshold**                                | **Defrauded (you are harmed)**  |  

  ---

  ### **Why Presence View Fails & Resolutions**
  - **Consensual vs. Exploit Killing**: Presence alone can’t distinguish these—**Consent Condition** handles it via contextual norms.  
  - **Item Theft/Server Shutdown**: Relational Condition captures institutional trust and labor/value, avoiding presence requirement.  
  - **Fake Friend Case**: Deception Threshold overcomes the "nothing real" objection—the harm is in the *manipulation of your trust*, not the avatar’s ontology.  

  ### **Unresolved Tensions**
  - **Indistinguishable NPCs**: If players *believe* NPCs are agential, harming them may cause psychological harm—but the act itself lacks moral weight unless deception is involved (Deception Threshold).  
  - **Memorial Avatars**: Selling one transparently is neutral; falsely implying continuity with the deceased violates Relational Integrity + Deception.  

  This framework treats virtual spaces as **real social domains** where harms arise from *broken relationships* (consent, trust, labor-investment) rather than requiring physicalist ontology. It rejects dualism ("just data") while avoiding overextension to non-agential entities.
