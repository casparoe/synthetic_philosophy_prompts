prompt: |-
  I am assembling materials for a graduate seminar on distributive justice and have been unable to settle an argument that a student reconstructed for me last term. I would be grateful for your diagnosis. I would rather keep the levelling-down objection than accept the conclusion the argument reaches, but I want to know what that preference costs.

  By way of setup: an outcome is a distribution of welfare across persons. Egalitarianism treats inequality between persons as intrinsically bad, so that a more equal outcome is, other things equal, better. Prioritarianism treats a gain in welfare as mattering more the worse off its recipient is; equivalently, the value of an outcome is the sum of welfare levels weighted by factors that decline as the level rises. The levelling-down objection is standardly pressed against egalitarianism: because egalitarianism treats inequality as intrinsically bad, it must count an outcome in which the better off are lowered to the level of the worse off, with nobody gaining, as in one respect an improvement — worse for one person, better for nobody, yet better. Prioritarianism is generally thought to escape this objection, since priority to the worse off supplies no reason to lower anyone when no one is helped.

  The argument runs as follows.

  (1) A view escapes the levelling-down objection only if it may rank the levelled-down outcome as worse than the unequal one.
  (2) The only ground available for that ranking is that the levelled-down outcome is worse for the person lowered and better for no one — call this principle (P).
  (3) (P) is a special case of a broader principle: an outcome is better than another only if it is better for at least one person — call this (B). If it is better for no one, it is not better.
  (4) (B) is unrestricted in scope: it ranges over any two outcomes, including outcomes containing different people.
  (5) Now compare W1, which contains a single person, Anna, at welfare level 20, with W2, which contains Anna at 20 and Bob at 20, Bob's life being well worth living and Anna wholly unaffected. W2 is not better for Anna. Nor is it better for Bob, since Bob does not exist in W1, and one cannot compare how well off a person is across a world in which that person has no existence.
  (6) By (B), then, W2 is not better than W1; by parity, W1 is not better than W2; so, assuming the two are comparable, they are equally good.
  (7) The same reasoning iterates: a world containing one flourishing person is exactly as good as a world containing that person together with any finite number of further flourishing people.
  (8) That is absurd — call it the Sterility Result.
  (9) So (B) is false.
  (10) So the ground identified in (2) is unavailable, and the prioritarian is left merely asserting her weighting function against the egalitarian's, which is the point at issue.
  (11) So prioritarianism does not escape the levelling-down objection; the objection stands against any view that will not rank a levelled-down outcome as worse.

  Please tell me which step to reject, why it looked acceptable, and what each available rejection would cost. I want to know what each rejection leaves standing: whether the prioritarian keeps her escape, and whether the levelling-down objection retains any force against egalitarianism, which is where it is usually deployed.
reasoning: |-
  Okay, the user is a professor preparing for a graduate seminar on distributive justice. They've presented an argument that challenges prioritarianism's ability to escape the levelling-down objection. The argument concludes that prioritarianism fails to avoid the objection, which would undermine a key advantage it has over egalitarianism. The user wants to know which step to reject and the implications of each choice.

  First, I need to parse the argument step by step. The core issue revolves around principle (B), which states that an outcome is better only if it's better for at least one person. The argument uses this to show that adding extra people doesn't make the world better, leading to an absurd result (the Sterility Result). Since (B) is derived from principle (P), which is used to justify ranking the levelled-down outcome as worse, rejecting (B) would undermine the prioritarian's defense against levelling-down.

  The user wants to keep the levelling-down objection against egalitarianism but is concerned about the cost of rejecting steps in this argument. They likely need to present a coherent stance in their seminar, balancing theoretical consistency with intuitive objections.

  Looking at the premises, step (5) and (6) are critical. The argument claims that in comparing W1 (only Anna) and W2 (Anna and Bob), W2 isn't better for Anna or Bob. But here's a potential flaw: the argument assumes that Bob's existence in W2 doesn't count as "better for Bob" because he doesn't exist in W1. This relies on the "person-affecting view," which holds that something can only be better for a person if they exist in both outcomes. 

  Rejecting step (5) by challenging this view could be a solution. If we say that W2 is better for Bob (since he exists and has a good life), then (B) isn't violated. But this requires accepting that existence can be better for a person even if they don't exist in the alternative. This move might lead to the "Repugnant Conclusion" where adding many people with barely worthwhile lives is better, which is another problem in population ethics. So there's a trade-off here.

  Step (4) claims (B) is unrestricted, but perhaps prioritarianism can restrict its scope to same-number cases. However, the levelling-down objection involves same-number comparisons, so this might not save prioritarianism from the original objection. The user needs prioritarianism to handle same-number levelling-down without falling into the Sterility Result.

  Another option is rejecting step (2). The argument says the only ground for ranking the levelled-down outcome worse is (P). But prioritarians might have other grounds—their weighting function itself explains why levelling down is worse without invoking (P). However, this risks the prioritarian merely asserting their view without a deeper justification, which might not satisfy critics.

  The user probably wants to preserve the levelling-down objection against egalitarianism while defending prioritarianism. So the best path might be to reject the move from (3) to (4). Prioritarians can accept (B) for same-number cases but not different-number cases. This allows them to reject levelling-down in same-number scenarios (using (P)) while avoiding the Sterility Result by denying (B) applies when populations differ. 

  The cost is that prioritarians must engage with population ethics, which is messy, but they can still maintain their advantage over egalitarianism regarding levelling-down. The levelling-down objection retains force against egalitarianism because it doesn't rely on (B) but on intrinsic bad of inequality. Egalitarians can't easily avoid saying levelling-down is in one respect better, whereas prioritarians don't have that issue in same-number cases.

  The user might worry about complicating prioritarianism with variable scope principles. However, this seems necessary to avoid both objections. Clarifying that prioritarianism's weightings are sufficient for same-number comparisons without relying on (B) would help. Emphasizing that egalitarianism's problem is intrinsic bad of inequality, which persists even in same-number cases, keeps the levelling-down objection strong against it.

  In summary, rejecting the unrestricted scope of (B) (step 4) is the most viable option. It allows prioritarianism to escape levelling-down in same-number cases using (P) without committing to the Sterility Result. The cost is navigating population ethics separately, but the core distributive justice framework remains intact.
answer: |-
  This is a sharp argument that exposes deep tensions in population ethics. To preserve the levelling-down objection against egalitarianism while allowing prioritarianism to escape it, the most defensible step to reject is **Step (4)**, the claim that Principle (B) ("an outcome is better than another only if it is better for at least one person") must be *unrestricted* in scope, applying to outcomes with different populations.

  Here's the breakdown:

  1.  **Reject Step (4): Principle (B) need not be unrestricted.** Prioritarians (and many others) can plausibly hold that (B) applies only to *same-number* comparisons (where the same people exist in both outcomes) but not to *different-number* comparisons (where populations differ). This move is common in population ethics to avoid the "Sterility Result" (W1 = W2) and the "Repugnant Conclusion."

  2.  **Why Step (4) Looked Acceptable:** The argument relies on a strong intuition: if an outcome isn't better *for anyone*, how can it be better *simpliciter*? This "person-affecting" intuition seems fundamental. Applying it universally feels like a natural extension of its core logic. Furthermore, proponents of the "Mere Addition Paradox" and related puzzles often use this unrestricted person-affecting principle, lending it initial plausibility.

  3.  **Costs of Rejecting Step (4):**
      *   **Engagement with Population Ethics:** Prioritarians must explicitly engage with the complexities of population ethics. They cannot rely *only* on principles derived from same-number cases.
      *   **Need for a Population Principle:** They must supplement prioritarianism with a principle for comparing outcomes with different populations. This could be Total Prioritarian Weighted Welfare, Average Prioritarian Weighted Welfare, Critical-Level Prioritarianism, or a Non-Identity-Affected variant of (B). Each faces well-known challenges (Repugnant Conclusion, Sadistic Conclusion, etc.).
      *   **Potential Inconsistency Charge:** Critics may argue that restricting (B) to same-number cases is ad hoc – why does the "better for someone" requirement suddenly vanish when new people appear? Defenders must argue that the *moral significance* of existence itself differs fundamentally from changes in welfare for existing beings.
      *   **Loss of Theoretical Simplicity:** The theory becomes more complex by requiring distinct principles for different types of comparisons.

  4.  **What This Rejection Leaves Standing:**
      *   **Prioritarianism's Escape from Levelling-Down (Same-Number):** Crucially, rejecting Step (4) *preserves* the prioritarian's escape from the levelling-down objection *in same-number cases*. Step (2) identifies (P) ("worse for one, better for none") as the ground for ranking the levelled-down outcome as worse. (P) is a direct consequence of (B) *in same-number cases*. Since the levelling-down scenario *is* a same-number case (the same people exist, one loses welfare, no one gains), the prioritarian can still appeal to (P)/(B) *restricted to same-number cases* to say the levelled-down outcome is worse. Their weighting function provides the *why* lowering the better-off without helping the worse-off is bad (it reduces priority-weighted welfare), and (P)/(B) explains *why* this is decisive in this specific case (no gain offsets the loss). **Prioritarianism retains its key advantage over egalitarianism regarding levelling-down.**
      *   **The Levelling-Down Objection Against Egalitarianism:** The levelling-down objection *remains fully intact* against egalitarianism. Egalitarianism's core commitment – that inequality is *intrinsically bad* – forces it to say that levelling down, even when it makes no one better off and someone worse off, *reduces* the intrinsic bad of inequality and is therefore *in one respect better*. This commitment is independent of population ethics and Principle (B). The objection highlights this deeply counterintuitive implication, contrasting it with the prioritarian's ability to avoid it *in same-number cases* by appealing to (P)/(B) restricted to same-number cases and their weighting function.

  **Why Rejecting Other Steps is Less Appealing:**

  *   **Reject Step (1):** Accepting that a view could escape the levelling-down objection while ranking the levelled-down outcome as *equally good* (or even better!) is deeply counterintuitive and arguably concedes the objection. This would severely weaken the force of the levelling-down objection against *any* view, including egalitarianism.
  *   **Reject Step (2):** Claiming there's *another* ground besides (P) for ranking levelling-down as worse in same-number cases is difficult. The prioritarian weighting function explains *why* the loss matters more, but (P) explains *why the lack of gain* makes the outcome overall worse. Denying (P) seems to force the claim that an outcome where someone is made worse off for no benefit to anyone could *still* be equally good or better – which is precisely what the levelling-down objection criticizes egalitarianism for.
  *   **Reject Step (3):** Denying that (P) is a special case of (B) is possible but strained. (P) directly follows from (B) in same-number cases. Rejecting this link weakens the connection between the core person-affecting intuition and the levelling-down judgment.
  *   **Reject Step (5)/Step (6) (Person-Affecting View):** Arguing that W2 *is* better for Bob (because existence is better for him than non-existence) avoids the Sterility Result but plunges into the depths of the Non-Identity Problem and risks leading towards the Repugnant Conclusion (if adding many people with lives barely worth living is "better for" them). It also makes it harder to reject the levelling-down objection, as the "better for no one" clause becomes more complex. This is a major alternative route, but it comes with significant, well-known costs in population ethics and doesn't directly help the prioritarian's need to reject levelling-down *without* endorsing Sterility.
  *   **Reject Step (7) (Accept Sterility):** Embracing the Sterility Result (one life = many lives) is wildly counterintuitive and undermines the value of creating additional good lives, a significant cost for any moral theory.
  *   **Reject Step (10):** This conclusion depends on the previous steps failing. If the prioritarian can successfully reject Step (4), Step (10) is blocked.

  **Conclusion:**

  The most sustainable path for preserving both the levelling-down objection against egalitarianism *and* prioritarianism's escape from it involves **rejecting Step (4)**. Prioritarians can consistently hold:

  1.  **In Same-Number Cases (like levelling-down):** Principle (B) and its corollary (P) hold. An outcome is better only if better for someone. Levelling down makes someone worse off and no one better off, so it is worse. The prioritarian weighting function explains *why* the loss to the better-off person matters morally (it reduces priority-weighted welfare), and (P) confirms that this loss isn't compensated.
  2.  **In Different-Number Cases (like adding Bob):** Principle (B) does *not* necessarily apply unrestrictedly. Prioritarians need a separate population principle (e.g., Total Weighted Welfare) to explain why W2 is better than W1. This principle *might* (depending on the specific version chosen) imply that W2 is better because it contains more priority-weighted welfare overall, *even though* it isn't "better for" Anna and the "better for Bob" claim is problematic.

  **Cost:** Prioritarians must navigate the complex terrain of population ethics and justify restricting the scope of the strong person-affecting intuition (B) to same-number cases.  
  **Gain:** Prioritarianism retains its decisive advantage over egalitarianism regarding the levelling-down objection in same-number cases, and the levelling-down objection retains its full force against egalitarianism, which remains committed to the counterintuitive claim that reducing inequality *intrinsically*, even by harming someone without helping anyone, is in one respect an improvement.
