answer: |-
  ### Thought Experiment: The Band Gig Dilemma

  **Scenario:**  
  Your band is playing a gig with two bonus options. The base pay covers essential expenses ($400). In the **Gain Frame**, you start from $400 (covering the van rental) and choose:  
  - **Option A:** 75% chance of $0 bonus (total $400), 25% chance of $700 bonus (total $1100).  
  - **Option B:** Sure $150 bonus (total $550).  

  In the **Loss Frame**, you start from $1100 (but must cover the $400 van rental). Now you choose:  
  - **Option A:** 75% chance to lose $700 (total $400), 25% chance to lose $0 (total $1100).  
  - **Option B:** Sure $550 loss (total $550).  

  The outcomes and probabilities are identical in both frames—only the *reference point* changes.

  ---

  ### Analysis Walkthrough
  **Outcomes (worst to best) and Utilities (assume linear utility, \(u(x) = x\)):**  
  - $400 (utility: 400)  
  - $550 (utility: 550)  
  - $1100 (utility: 1100)  

  **Cumulative Probabilities (for REU):**  
  - *Option A:* Probability of at least $400 = 1.0, at least $1100 = 0.25.  
  - *Option B:* Probability of at least $550 = 1.0.  

  **REU Calculation (using risk function \(r(p) = p^2\) for risk-averse person):**  
  - **Option A:**  
    \[
    \text{REU} = 400 \times [r(1.0) - r(0.25)] + 1100 \times [r(0.25) - r(0)] = 400 \times [1 - 0.0625] + 1100 \times [0.0625] = 400 \times 0.9375 + 1100 \times 0.0625 = 375 + 68.75 = 443.75
    \]  
  - **Option B:**  
    \[
    \text{REU} = 550 \times [r(1.0) - r(0)] = 550 \times 1 = 550
    \]  
    **REU prefers Option B (550 > 443.75).**  

  **Linear Risk Function (for EU equivalence):**  
  - If \(r(p) = p\) (linear), REU matches EU:  
    \[
    \text{REU(A)} = 400 \times [1 - 0.25] + 1100 \times [0.25] = 300 + 275 = 575
    \]  
    \[
    \text{REU(B)} = 550
    \]  
    **EU prefers Option A (575 > 550).**  

  **Cumulative Prospect Theory (CPT):**  
  - **Gain Frame** (reference point = $400):  
    - Risk-aversion for gains: People prefer the sure $550 (Option B).  
  - **Loss Frame** (reference point = $1100):  
    - Risk-seeking for losses: People prefer the gamble (Option A).  

  **Summary of Preferences:**  
  | Theory           | Gain Frame | Loss Frame |  
  |------------------|------------|------------|  
  | Expected Utility (EU) | Option A   | Option A   |  
  | Risk-Weighted EU (REU) | Option B   | Option B   |  
  | Cumulative Prospect Theory (CPT) | Option B   | Option A   |  

  ---

  ### Key Insight  
  **The feature doing the work:** The *reference point shift* in CPT. EU and REU only care about final outcomes and probabilities, but CPT treats gains and losses differently. If you remove the reference point (e.g., describe both frames identically as final dollar amounts), CPT collapses toward EU/REU (no flip).  

  **Defending the Case:**  
  1. **"REU is just a taste for safety, not rational!"**  
     - Reply: REU argues risk-attitude is about *weighting probabilities of outcomes*, not just marginal dollars. It consistently prefers safety here, while CPT flips—so REU captures a stable risk-aversion, unlike "irrational" framing effects.  

  2. **"Real loss/gain asymmetries would swamp this clean framing!"**  
     - Reply: This isolates the *reference point* as the switcher. Real-world examples (e.g., medical decisions framed as survival vs. mortality rates) show similar flips—so the effect is robust, not artificial.  

  **Time to Read Aloud:** ~4.5 minutes.
