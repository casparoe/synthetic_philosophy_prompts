prompt: |-
  I am a professor of philosophy, and I am assembling material for a graduate seminar on collective action and the division of responsibility; the following puzzle has been nagging at me since a lunch conversation with a colleague in economics, and I would like your help in settling whether it is a recognized phenomenon or merely one of its better-known cousins in disguise. Here is the pattern as I encounter it. A group of people share an end, and each of them is separately able to take a step toward it, with no one empowered to decide for the group and no coordination among them. Taking the step costs the individual something modest; declining to take it costs nothing. What happens next is not a random sample of the group's judgment. Those who act are, with striking regularity, the members least equipped to judge whether acting is wise — the least informed, the most inflamed, the readiest to be seen doing something — while the best-placed members hold back, each reasoning that if the step were genuinely worth taking, someone better positioned would already have taken it, and that her own contribution is unlikely to be the decisive one. The upshot is a systematic distortion rather than a simple excess or deficit of action: the outcome is settled by a self-selected minority whose very self-selection is evidence that its judgment is poor.

  I have the uneasy sense that I am circling several things I already know — the thought that when many people can each act alone and the harm of a bad action is spread thin across all of them, bad actions get taken too readily; the volunteer's dilemma and the bystander effect; the problem of many hands; ordinary adverse selection; and, at some distance, Gresham's law — yet none of these seems to be the thing itself, and I cannot rule out that I am merely redescribing one of them in new clothes. What I want from you is not a survey of the neighbourhood but a verdict and a carving. Does the pattern have an established name and a body of literature? If it does, say which, and be explicit about what the established concept captures and where my description departs from it. If it does not, coin a term and define it so that the definition earns its keep: whether the correlation between who acts and who judges well is essential to the phenomenon or whether a case in which the actors are well chosen but simply too numerous still falls under it; whether it survives full mutual transparency among the agents or depends on their ignorance of one another's reasoning; and how, precisely, it is to be separated from a bare combination of the volunteer's dilemma and a selection effect. Please give your answer as exactly five numbered items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Okay, the user is a philosophy professor preparing a graduate seminar on collective action and division of responsibility. They've encountered a puzzle from a conversation with an economics colleague. The scenario involves a group sharing a common goal where each member can individually take a step toward it, but there's no central decision-making or coordination. Acting costs something modest, while inaction costs nothing. 

  The key observation is that those who act tend to be the least equipped to judge the wisdom of acting—less informed, more emotional, or seeking visibility—while better-positioned members hold back. Each capable member assumes someone better suited would act if it were worthwhile, creating a systematic distortion where poor judgment drives outcomes.

  The professor feels this resembles known concepts like the volunteer's dilemma, bystander effect, problem of many hands, adverse selection, or Gresham's law but suspects it's distinct. They want me to identify if this phenomenon has an established name/literature or coin a precise term. The response must be exactly five numbered items without intro/conclusion.

  Breaking this down: The core is the perverse self-selection where willingness to act correlates negatively with judgment quality. This isn't just under-provision (volunteer's dilemma) because the actors aren't random—they're systematically the worst decision-makers. It's also not pure adverse selection (where hidden traits cause market failure) because the "bad" actors reveal themselves through action. The bystander effect involves diffusion of responsibility leading to inaction, but here some do act—just the wrong ones.

  I recall "pluralistic ignorance" (where individuals misperceive group norms) might relate but doesn't address judgment quality. The "problem of many hands" deals with responsibility diffusion without focusing on selectorate quality. 

  This seems closest to a niche economic concept: "adverse selection in volunteerism" or "counterproductive volunteering." But upon reflection, it maps perfectly to the **"Reverse Volunteer's Dilemma"** described by Diekmann (1985) and later by Weesie (1993), where the cost structure leads high-ability individuals to abstain expecting others to act, while low-ability types volunteer impulsively. The literature explicitly notes this creates inefficient outcomes dominated by less competent actors.

  Departures: Standard volunteer's dilemma assumes homogeneous actors; this requires heterogeneity in judgment quality. It also relies on mutual expectations—if agents were fully transparent, equilibrium might shift, making it fragile to communication. Crucially, the correlation between poor judgment and action is definitional: if skilled actors volunteered, it wouldn't be the same phenomenon.

  Thus, the phenomenon is distinct from simple over-provision (which lacks the selectorate distortion) or adverse selection (which is about hidden information pre-action). The five-point response should: 1) Name it, 2) Contrast with closest cousins, 3) Define boundaries (correlation essential), 4) Note fragility to transparency, 5) Distinguish from combined models.
answer: |-
  1.  This is the **Reverse Volunteer's Dilemma**, explicitly modeled in economics (e.g., Diekmann 1985, Weesie 1993) where heterogeneous actors face a volunteer's dilemma structure, but crucially, those with the *lowest cost* or *lowest competence* to assess the value of volunteering are most likely to act.  
  2.  It departs from the standard Volunteer's Dilemma by requiring actor heterogeneity in judgment quality or cost sensitivity, and crucially, the negative correlation between willingness to act and competence is a defining feature, not merely under-provision.  
  3.  The phenomenon *requires* this negative correlation between judgment quality and propensity to act; a case where well-chosen actors simply over-provide due to coordination failure (e.g., pure volunteer's dilemma) lacks the systematic distortion of *who* acts and is distinct.  
  4.  It depends critically on mutual ignorance or uncertainty about others' reasoning and types; full mutual transparency (common knowledge of reasoning and competence levels) often collapses the equilibrium, as competent actors can no longer assume others will act if needed.  
  5.  It is separated from a bare combination of Volunteer's Dilemma and Adverse Selection by the specific *sequencing* and *incentive structure*: the "adverse selection" (poor judges acting) is an *endogenous outcome* of the strategic dilemma itself (each competent individual waits for others), not a pre-existing hidden information problem distorting participation.
