prompt: |-
  I'm applying for a six-month, half-time research grant to write a long paper on cultural evolution, and I need the proposal. I've followed the memetics-versus-attractors arguments in the blogosphere for years, so I know the standard moves and don't want them rehearsed. Here is my half-formed idea, which I'd like you to build out. The usual defense of a Darwinian approach to culture is that cultural change satisfies three conditions — variation, differential transmission, heritability — and that this licenses selectionist explanation. I think that is too weak. What makes a selectionist explanation explanatory rather than circular is that the selection pressure be specifiable independently of the trait's success; otherwise saying that a thing spread because it was fit simply restates the fact to be explained. My hunch is that most memetic explanations fail this test while the rival picture — cultural forms explained by reconstruction plus a handful of psychological attractors rather than by differential copying — passes it, and that the two frameworks are usually compared on the wrong axis, fidelity of copying, when the real crux is independence of the selection pressure.

  Turn this into a proposal: state the question so that it has a determinate answer; say why the existing positions leave it open; set out what I would actually do, month by month, given six months at half time; and say what a result would look like and what would count as the project failing, including the possibility that my hunch is simply wrong. Skip the citations — I'll add those myself.
