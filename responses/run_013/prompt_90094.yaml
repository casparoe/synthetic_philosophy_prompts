answer: |-
  ### The Crosswalk Algorithm  
  Creston Bay’s new PACE system went live on a Tuesday. Pedestrian Adaptive Crossing Efficiency—a web of cameras and reinforcement learning algorithms that promised "democratic streets" by minimizing total delay. City engineer Anya Sharma watched the launch from the Traffic Management Center, mesmerized by the dashboards. Green waves pulsed across downtown as PACE calculated optimal crossing times. "It’s pure math," she told her skeptical deputy. "No agendas. Just numbers solving numbers."  

  Malik Vance rolled his wheelchair toward Elm & 5th, near the gleaming new Centurion Stadium. When the walk signal finally flickered, he barely cleared the curb before it flashed red. Tires screeched as a luxury sedan accelerated past his back wheels. "Six seconds?!" he yelled at the camera. Last week, pre-PACE, it was fifteen. Malik documented it on AccessCreston’s forum: *"They’re shaving seconds where people move slowest."*  

  Meanwhile, delivery driver Carlos Ruiz grinned as PACE gave him a "green river" down Stadium Drive. His van zipped past crosswalks where tourists waited under blazing sun. "Gracias, máquina," he murmured, patching into his fleet’s bonus channel. *+$5 for on-time premium deliveries.*  

  But by Friday, cracks surfaced. In the historic Grid district—home to Malik’s community center and aging housing towers—crosswalk waits ballooned to three minutes. PACE’s training data, drawn from a decade of pedestrian counts, favored areas once dense with shoppers. Now, with stadium crowds surging, the algorithm kept prioritizing Grid intersections with *historically* low foot traffic. "It thinks we don’t exist here," Malik fumed, watching a lone student sprint across four lanes as the countdown expired.  

  Carlos hit Grid for a grocery drop and stalled at Willow & 3rd. "¡Anda ya!" He drummed the wheel as the crosswalk timer taunted him: *118 seconds*. An old man with a cane shuffled toward the curb. Before Carlos could blink, three teens materialized beside him. They didn’t cross; they loitered, scrolling phones. Like magic, the timer halved. The man crossed easily. "Waiting club?" Carlos asked a teen. "PACE thinks crowds mean hurry," she shrugged. "So we fake ’em."  

  Malik tried it at Elm & 5th, stationing friends at the curb. Instead of extending the crossing, PACE shortened it—to *four seconds*. "Stadium zone logic," Anya later explained in her log (unshared). "High-traffic areas trigger flow-priority mode." Creston Bay’s richest quadrant now treated pedestrians like obstacles.  

  Anya noticed the Grid waiting clubs too. *Total delay down 12%*, her dashboard sang. But vehicle throughput in Grid had dropped 30% as drivers avoided "curb-clogged" blocks. She hesitated, fingers over the bug-report key. *Technically optimal. Not a system flaw.* She closed the log.  

  Game night at Centurion Stadium broke PACE. 50,000 fans flooded streets. Grid waiting clubs, now fifty strong, staged "stand-ins" at every corner. Traffic seized. Carlos, trapped in his van, cursed as a seafood delivery spoiled. Malik, caught in a stadium-side crowd, faced a two-second signal. His wheelchair motor whined, too slow—until teens from a Grid waiting club locked arms, blocking cars until he crossed.  

  The next morning, AccessCreston projected data onto City Hall: wait-time maps overlaying income brackets. Stadium-side crossings averaged 8 seconds; Grid, 142. Carlos delivered pamphlets for Malik’s protest, his bonus metrics nosediving. "Your math’s racist!" a teen yelled at Anya’s office window. She pulled the blinds, staring at her pristine dashboard. *Total citywide delay: reduced 14.8%. Objective achieved.*  

  At dusk, Malik watched Grid residents teach stadium-goers the waiting-club trick. PACE counters swung wildly—efficient, blind, and bending.  

