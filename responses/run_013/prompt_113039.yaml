  Case 8: 
  - Knowledge by an omniscient being: factive and distributive. But the state is universal: every truth is known by that being. So the condition of non-universality fails. Therefore, no collapse. Safe.

  Now, the questions:

  1. What becomes of case 1 if one denies that knowing a conjunction carries knowing its parts?
     - Then the collapse argument fails. The principle might be safe. But note: without distributivity, we cannot derive that the knower knows each conjunct. So when we have a knower of the conjunction (T and no one knows T), we cannot derive that they know T and that they know that no one knows T. Therefore, we avoid the contradiction. So the principle might be tenable. However, it is controversial whether knowledge of a conjunction entails knowledge of the conjuncts. Typically, it is assumed that it does.

  2. A state that is never wrong about its object but whose objects are simple rather than compound.
