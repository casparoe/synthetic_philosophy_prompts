  Additional cases:

  Case 9: Every truth can be hoped (by someone).
     - Hope is not factive: you can hope for something false. So safe.

  Case 10: Every truth can be asserted (by someone).
     - Assertion is not factive: you can assert a falsehood. So safe.

  Case 11: Every truth can be known by God (who is omniscient).
     - This is like case 8: safe because God already knows everything.

  Case 12: Every truth can be doubted (by someone).
     - Doubt is not factive: you can doubt a truth. Also, you can doubt a conjunction without doubting each part? But anyway, not factive, so safe.

  Case 13: Every truth can be written down (by someone).
