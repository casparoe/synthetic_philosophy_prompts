  Case 2: It could have been that every truth is known. 
  - This is about a possible world, not about each truth individually. So we don't run the same argument. In that possible world, there may be no unknown truths, so the problematic conjunction (T and that no one knows T) would not exist. So it survives.

  Case 3: Every truth can be verified by some possible observation.
  - Verification is factive: if you verify P, then P is true.
  - Verification distributes over conjunction: if you verify (P and Q), then you have verified P and verified Q? It depends on what verification means. If verifying a conjunction requires verifying each part, then yes. So it collapses similarly.

  Case 4: Every truth can be believed.
  - Belief is not factive: you can believe a falsehood. So the collapse argument does not go through. The principle is harmless.

  Case 5: Every truth can be remembered.
  - Memory is factive: you can only remember what happened. So if you remember P, then P is true.
  - Memory distributes over conjunction: if you remember (P and Q), then you remember P and remember Q? It seems so. Therefore, it collapses. The argument: suppose there is a truth T that is not remembered by anyone. Then consider the conjunction: T and that no one remembers T. By the principle, it can be remembered. Then the rememberer would remember T (so T is true) and remember that no one remembers T (so it is true that no one remembers T). But then the rememberer is remembering T, so someone does remember T, contradiction. Therefore, the principle entails that every truth is remembered, which is absurd.

  Case 6: Every truth can be perceived.
  - Perception is factive: if you perceive that P, then P is true.
