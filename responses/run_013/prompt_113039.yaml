  This criterion explains all the verdicts given, except that for case 6 (perception) we are undecided because we are unsure about distributivity. For case 7, we have a refutation by Gödel and also by the collapse argument (since the conditions hold and we get a contradiction). For case 8, the non-universality condition fails (because the state is universal) so safe.

  The name for the argument in case 1 is the "Knowability Paradox" or "Fitch's Paradox". The general form might be called the "Fitch-style paradox".

