  But note: in the collapse argument for case 1, we ended up showing that every truth is known. Here, we are not showing that every truth is proved, but only that the principle leads to a contradiction. So the mechanism is similar but the conclusion is different.

  Case 8: Every truth can be known by someone who knows everything.
  - This is harmless because the person who knows everything already knows every truth. So the principle is trivially true. There is no collapse to an absurdity because the conclusion is not absurd in this context.

  Now, the provisional rule: 
  - Collapse when the state is factive and distributive over conjunction.

  But case 8 is factive and distributive, but it does not collapse to an absurdity. Why? Because the collapse argument would go: consider a truth T that is not known by the omniscient being? But there is no such T because the omniscient being knows everything. So the problematic conjunction (T and that the omniscient being doesn't know T) cannot be formed because there is no T that the omniscient being doesn't know. Therefore, the collapse argument does not get off the ground. So the criterion must include that the state is not universal in the actual world. In other words, there must be truths that are not currently taken up by the state (so that we can form the problematic conjunction).

  Therefore, the full criterion for collapse (leading to an absurdity) is:
  - The state S is factive: S(P) implies P.
  - The state S is distributive over conjunction: S(P ∧ Q) implies S(P) and S(Q).
  - The state S is not universal: there exists a truth that is not taken up by S (in the actual world, for the actual state).

  Moreover, the language must be rich enough to express the proposition: "P and that S does not take up P".

  Now, for the principle to be safe, at least one of these conditions must fail.

  Now, let's revisit the cases with this criterion:

  Case 1: 
  - Factive: yes.
  - Distributive: yes.
  - Not universal: yes (there are unknown truths).
  - Therefore, collapse: untenable.

  Case 2:
  - This principle is about possibility. We are not claiming that in the actual world every truth is known, only that there is a possible world where every truth is known. In that world, there are no unknown truths, so the problematic conjunction cannot be formed. Therefore, the collapse argument does not apply. Safe.

  Case 3: 
  - Verification: factive and distributive? We assume so. And there are unverified truths. So collapse: untenable.

  Case 4: 
  - Belief: not factive. So safe.

  Case 5: 
  - Memory: factive and distributive? We assume so. And there are truths that are not remembered. So collapse: untenable.

  Case 6: 
  - Perception: factive. But is it distributive? We are not sure. If we assume it is not distributive, then safe. But if it is distributive, then and if there are truths that are not perceived, then collapse. The verdict is undecided because we are unsure about distributivity.

  Case 7: 
