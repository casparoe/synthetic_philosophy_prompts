answer: |-
  Here are your five points:

  1.  **Players & Levels:** Skippers (short-term catch maximization), Companies (profit/competition pressure), Provincial Govs (jobs/reelection), Federal DFO (resource management *and* political appeasement), Foreign Fleets (externalize costs to shared stock). Moloch slippage: Blaming "greedy fishers" ignores how companies/governments structured incentives/access; blaming "DFO failure" obscures political overrides of science by provinces/feds prioritizing votes over conservation.

  2.  **Frame Nails:** Individual actors (skipper, company, province) rationally maximizing their own short-term gain (catch, profit, jobs) collectively drove overexploitation. Even knowing collapse was likely, *disarming unilaterally* meant losing out to others still fishing (domestic competitors, foreign fleets), making restraint irrational at each level – the core multipolar trap dynamic.

  3.  **Can't vs. Won't Move:** Primarily a **Won't-Move Trap**. The Federal Government (DFO/Minister) *could* have enforced sustainable quotas based on science. The cost (political backlash, job losses *now*) landed squarely on them, while the benefit (stock recovery) was diffuse and long-term. Provinces actively lobbied *against* cuts. The distinction holds: The trap wasn't technical impossibility, but the political cost of action falling on a specific, vulnerable agent who lacked the will/power to impose short-term pain.

  4.  **Positional vs. Absolute Trap:** This is an **Absolute Trap** (physical destruction). The cod stock was decimated to commercial/biologically functional extinction – an irreversible loss of real capital. Moloch writing often conflates this with positional traps (e.g., ad spend arms race where stopping leaves everyone fine). Here, even coordinated stopping *after* collapse couldn't restore the stock; the trap destroyed the underlying resource, making recovery impossible, not just suboptimal.

  5.  **Frame's Missing Piece & Patch:** **Asymmetrical Power & Capture.** Moloch often assumes symmetric actors. Here, Provincial Governments and industry lobbies exerted *disproportionate pressure* on the Federal regulator (DFO), overriding scientific advice and forcing unsustainable quotas. The minimal patch: Explicitly model **power-weighted influence** on the coordinating/regulating node, where its "payoff" is distorted by political threats, not just resource sustainability or collective good.
