  The board is split: one side focuses on the positive expected value (20% * 10x return = 2x), while the other is worried about the risk of bankruptcy. The treasurer is talking about Kelly betting and geometric rationality, which seems key here. I need to translate that into plain English for the memo.

  The user explicitly said not to suggest diversification because they're too small. So the memo has to directly recommend a specific stake or say no, explain the conditions that could change that recommendation, and acknowledge the expected-value argument fairly without dismissing it.

  Looking deeper, the user's real needs are probably about risk management and institutional survival. As a novelist, they might value the press's mission beyond just money—like supporting living authors through their endowment. The memo should balance financial logic with their charter obligations. The treasurer's points about Kelly criteria and time averages versus ensemble averages are crucial here. Kelly would suggest betting a fraction based on the edge, but since the bet size is fixed, it might be too large for their capital.

  I think recommending against the full stake makes sense. The math shows that even with positive expected value, the 80% risk of blowing up the press is too high. But to satisfy the expected-value camp, I should suggest a compromise: maybe negotiate a smaller stake or better terms. Conditions like improving the odds or reducing the stake could change the recommendation.

  For the memo structure, I'll start with a clear summary, explain the opportunity and risks, break down the treasurer's arguments simply, then give a concrete recommendation with alternatives. It should be respectful to both sides, mission-focused, and actionable for Thursday's meeting. The tone needs to be decisive but collaborative, emphasizing that preserving the press comes first.
answer: |-
  **MEMORANDUM**  
  **TO:** Board of Directors, [Small Press Name]  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Trilogy Rights Acquisition & Capital Risk  

  ### Summary
  After careful review of the trilogy opportunity and our financial constraints, **I recommend declining the acquisition at the current stake (33% of capital)**. While the potential upside is compelling, the 80% probability of near-total capital loss poses an existential threat to our mission. However, I urge the board to explore restructuring the deal to reduce our stake. If terms cannot be improved, we should pass.  

  ---

  ### 1. The Opportunity & Risks  
  * **Upside (20% Probability):**   
    Investment: ~33% of capital.  
    Return: 10x (~330% of capital).  
    *Expected Value (EV) Calculation:* (0.2 × 10) = 2.0x stake. **This is positive (200% expected return)**, validating the EV camp’s argument that the *average outcome* across many parallel scenarios is favorable.  
  * **Downside (80% Probability):**  
    Near-total loss of the invested capital (~33% of our endowment).  
    **Consequence:** High risk of insolvency within 3 years, preventing publication and eliminating our ability to pay living authors per our charter.  

  ---

  ### 2. Why Expected Value Isn’t Enough: The Treasurer’s Point  
  The treasurer’s references to "Kelly betting" and "geometric rationality" address a critical distinction:  
  * **Ensemble Average (EV Camp):**  
    *"What’s the average outcome if we could make this bet 100 times?"*  
    Answer: We’d expect 20 wins (+330% capital each) and 80 losses (–33% capital each). **Net positive.**  
  * **Time Average / Geometric Growth (Treasurer’s Concern):**  
    *"What happens if we make this bet ONCE and stay in the game?"*  
    Answer: An 80% chance of catastrophic failure. **One loss destroys our ability to play future "hands."**  
    Kelly’s criterion (optimal betting for long-term capital growth) would likely recommend risking **<<10%** of capital on a 20%-win-probability bet—far below 33%.  

  **Our Reality:** We cannot make this bet 100 times. We get *one* trial. If we lose, the press ceases to function. Our 4% annual payout to authors depends on *survival*, not theoretical averages.  

  ---

  ### 3. Recommendation: No at 33% Stake  
  **Rationale:**  
  * The 80% ruin risk is incompatible with our fiduciary duty to preserve the endowment and fulfill our charter.  
  * Losing 33% of capital would likely force drastic cuts, jeopardizing solvency *before* the trilogy’s payoff (e.g., failing to fund other projects, cover overhead, or meet annual payouts).  
  * **Expected value is positive, but survival is non-negotiable.** As Mohnish Pabrai summarizes: *"Heads I win, tails I don’t lose much."* Here, tails means bankruptcy.  

  ---

  ### 4. Conditions for Changing This Recommendation  
  We should counteroffer or seek modifications:  
  * **Reduce Stake:** If we can acquire rights for **≤15% of capital** (e.g., via profit-sharing, smaller advance, or partial rights), the risk becomes manageable. At 15%, a loss would be severe but not fatal.  
  * **Increase Probability:** If new data (e.g., pre-orders, co-investors, stronger translator track record) suggests >30% success probability, revisit at ≤20% stake.  
  * **Secure Bridge Funding:** If a donor/partner guarantees solvency for 3 years *independent of this bet*, the risk profile changes.  
  * **Structure Contingent Payments:** Defer portions of the payment until after publication/success.  

  ---

  ### 5. Acknowledging the EV Camp  
  Your analysis is mathematically sound: **this bet has a positive expected value.** In a world with infinite capital or repeated opportunities, it would be rational. You correctly push us to avoid *under*-risk-taking, which can also threaten relevance. However, our constraint isn’t statistics—it’s extinction risk. We must prioritize avoiding irreversible failure over maximizing theoretical returns.  

  ---

  ### Conclusion  
  **Recommendation:** Decline the deal at 33% stake.  
  **Path Forward:**  
  1. **Immediately negotiate** for a smaller stake (target ≤15%) or better terms.  
  2. **If terms improve materially,** re-evaluate using the treasurer’s geometric framework.  
  3. **If terms hold,** walk away and focus on lower-risk opportunities aligned with our mission.  

  The press’s endurance enables *all* future payouts to authors. Let’s ensure there *is* a future.  

  **Ready to discuss on Thursday,**  
  [Your Name]  

  ---

  ### Key Notes for Your Presentation
  * **Emphasize Mission:** "Our duty is to authors over decades, not a single lottery ticket."  
  * **Simplify Math:** "Kelly says: Never bet so much that one loss kills you. 33% is too much."  
  * **Validate EV Camp:** "You’re right—in a vacuum, this bet looks good. But our real-world constraints demand conservatism."  
  * **Stress Urgency:** "If we want this trilogy, we must renegotiate *now*."
