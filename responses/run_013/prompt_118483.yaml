answer: |-
  **Research Proposal: Symmetry, Aggregation Order, and the Pasadena Paradox in Decision Theory**  

  ### 1. Research Question  
  *Does the Pasadena game’s “undefined” expected value stem from a lack of privileged aggregation order over outcomes, and when (e.g., in temporal decision problems) does such an order exist?*  

  **Determinate Answer:** The Pasadena game lacks an expected value *not* because of infinity per se, but because its outcome labels (toss numbers) lack inherent decision-theoretic significance, rendering all summation orders symmetric. By contrast, infinite-horizon problems privilege temporal order, making aggregation order-invariant and expected value well-defined.  

  ### 2. Why Existing Views Are Inadequate  
  Current approaches fail to resolve the paradox satisfactorily:  
  - **Legislated Summation Rules** (e.g., Cesàro mean): Arbitrary; mask the core issue of symmetry.  
  - **“Weak Expectations”/Relativity to Partition**: Acknowledge dependence on framing but don’t explain *when* a partition is canonical (e.g., why time matters).  
  - **“Just Math” Dismissal**: Ignores why conditional convergence feels paradoxical in decision contexts but not in pure analysis.  
  - **“Decision Theory is Incoherent”**: Overreaction; fails to distinguish artifacts (Pasadena) from substantive problems (temporal dilemmas).  

  *Your diagnosis is novel:* The literature treats order-dependence as a technical flaw, not a symptom of missing structure. No one systematically links aggregation order to decision-theoretic primitives (e.g., time, causality).  

  ### 3. Method: Symmetry Analysis & Aggregation Privilege  
  **Core Framework:**  
  - **Step 1:** Formalize “privileged order” as an ordering derived from decision primitives (e.g., time, information flow).  
  - **Step 2:** Apply to Pasadena: Toss numbers are arbitrary labels → no privileged order → expected value undefined.  
  - **Step 3:** Contrast with temporal cases (e.g., infinite consumption): Time orders outcomes inherently → order-invariant expected value exists.  
  - **Step 4:** Test with **Sierra Madre game**: Payoff = `2ⁿ/n` (odd n), `−2ⁿ/(n+1)` (even n).  
    - *Key test:* If its series is *absolutely convergent*, expected value is defined *regardless* of order, undermining symmetry’s necessity. If *conditionally convergent*, symmetry remains decisive.  
    - *Prediction:* Series diverges absolutely (since `|2ⁿ/n|` dominates `|2ⁿ/(n+1)|` for large n), so expected value = `+∞` regardless of order.  

  **10-Week Timeline:**  
  - **Weeks 1–2:** Literature review (Pasadena variants, infinite-horizon models, convergence criteria).  
  - **Weeks 3–4:** Formalize symmetry framework; prove Sierra Madre’s divergence (using limit comparison test).  
  - **Weeks 5–6:** Analyze canonical orders: Temporal problems (e.g., discounted utility), spatial/ethical aggregation.  
  - **Weeks 7–8:** Synthesize: When does privilege arise? (e.g., time, causal priority, policy irreversibility).  
  - **Weeks 9–10:** Draft paper; prep seminar presentation.  

  ### 4. Why Symmetry Beats Alternatives  
  - **Vs. Convergence Restrictions**: Imposing `L¹` convergence (e.g., only bounded payoffs) is ad hoc. Symmetry explains *why* Pasadena fails (no natural order) while `∞`-expectation games (e.g., St. Petersburg) succeed (order-invariant).  
  - **Vs. “Just Math”**: Reveals why Pasadena unsettles decision theorists: Outcomes lack intrinsic structure, making order-dependence a *normative* problem.  
  - **Vs. “Incoherence”**: Preserves expected utility by showing failures are *local* to ill-structured outcome spaces, not global.  

  ### 5. Deliverables & Success Metrics  
  **Outcome:** A framework classifying when expected values exist based on:  
  - *Privileged order?* (e.g., temporal → defined; arbitrary → undefined).  
  - *Absolute convergence?* (Overrides order-dependence).  
  - *Dominance?* (Pasadena vs. all-positive variant).  

  **Concrete Results:**  
  1. Proof that Sierra Madre has `E = +∞` (absolute divergence).  
  2. Taxonomy of aggregation privilege (temporal > spatial > arbitrary).  
  3. Resolved Pasadena verdict: "Undefined" due to symmetry, not infinity.  

  **Failure Conditions:**  
  - Sierra Madre converges conditionally → undermines role of absolute convergence.  
  - Temporal cases show order-dependence (e.g., non-Archimedean utilities) → invalidates "privileged order" claim.  
  - No clear criterion for "canonical" orders found → framework collapses into relativism.  

  ### 6. Scope Management  
  **Temporal Cases:** *Crucial but vast.* Focus: **One** paradigmatic example (e.g., discounted utility with `lim inf` vs. `lim sup` evaluations). Drop population ethics or multi-agent aggregation.  

  ---

  **Proposal Body Draft (Condensed):**  

  **Introduction**  
  The Pasadena game’s (PG) “paradoxical” lack of expected value is typically attributed to conditional convergence of its payoff series. I argue this misidentifies the core issue: PG lacks a *decision-theoretically privileged order* for aggregating outcomes. Toss numbers (`n = 1, 2, 3, ...`) are arbitrary labels, rendering all summation orders symmetric. By contrast, infinite-horizon problems privilege temporal order, making expected value well-defined. This project develops a symmetry-based framework to diagnose when expected values exist.  

  **Background & Gap**  
  PG’s payoff series `S = 1 − 2/2 + 4/3 − 8/4 + ...` converges conditionally. Standard responses:  
  - *Weak expectations* (Easwaran): `E` depends on partition sequence.  
  - *Capped sums* (Smith): Arbitrarily truncate `n`.  
  - *Dismissal* (Nover & Hájek): “No finite value.”  
  All miss the *why*: Why is partition choice free in PG but fixed in temporal problems? I contend aggregation order is canonical iff derived from decision primitives (e.g., time).  

  **Method & Cases**  
  - **PG & Variants**: Outcomes lack intrinsic order → symmetry → `E` undefined.  
  - **Sierra Madre (SM)**: Payoff `= 2ⁿ/n` (odd `n`), `−2ⁿ/(n+1)` (even `n`).  
    - *Conjecture*: `Σ |payoffₙ| ∼ Σ 2ⁿ/n = ∞` → absolute divergence → `E = +∞` (order-invariant).  
  - **Temporal Example**: Infinite consumption stream `(c₁, c₂, ...)`. Temporal order privileged → `Σ δᵗu(cₜ)` defined (if convergent).  

  **Implications**  
  - *For PG*: Not a paradox, but a misapplication of expectation to symmetry-laden spaces.  
  - *For decision theory*: Expected utility requires specifying an aggregation structure, not just payoffs.  

  **Feasibility**  
  10 weeks suffices for:  
  - Formalizing symmetry (Weeks 1–4).  
  - Analyzing SM (Week 4).  
  - Studying one temporal case (Weeks 5–6).  
  - Synthesis (Weeks 7–10).  

  **Conclusion**  
  This project reframes the PG “paradox” as a question of canonical aggregation, delivering a testable criterion for when expectations exist. Success clarifies foundational issues in stochastic decision theory; failure occurs if no privilege criterion emerges.  

  ---  
  **Fit to Requirements**:  
  - **Question & Answer**: Clearly stated + determinate.  
  - **Critique of Literature**: Highlights gap in explaining "canonical" orders.  
  - **Method**: Timeline + Sierra Madre test included.  
  - **Argument vs. Alternatives**: Explicitly addresses convergence fixes, dismissal, incoherence.  
  - **Deliverables/Failure**: Specific outcomes and fail-conditions defined.  
  - **Scope**: Temporal cases narrowed to one example.  

  Let me know if you want tweaks to emphasis or structure!
