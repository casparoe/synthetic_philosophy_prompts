prompt: |-
  I direct the research budget of a mid-sized animal welfare foundation. We allocate roughly two million dollars a year in quarterly rounds of about thirty proposals; the team is three people, none of us an entomologist and none of us trained in decision theory; the board signs off on the round as a whole. A single grant runs between twenty and two hundred thousand dollars, so a bad round is expensive without being fatal, and we will have to live with whatever we decide for at least a year.

  A growing share of what we receive concerns invertebrates: farmed insects, wild insects caught up in pesticide regimes, soil and leaf-litter fauna, and a few proposals about animals even further from us. These proposals almost all have the same shape. The population involved is enormous — we have been working with a standing estimate on the order of 10^18 individual insects — so, the argument runs, even a very low probability that they are sentient, multiplied by numbers that large, puts more expected welfare at stake than our entire vertebrate portfolio. We cannot act on this. We cannot check the numbers, none of us can settle whether an insect is sentient, and every round we end up with one memo saying the arithmetic compels funding and another saying we are being asked to decide on the strength of a guess that has been dressed up as a product.

  Please write a decision procedure my team can actually run, proposal by proposal, in under an hour each, and that produces a one-page record for the board. I want the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. It has to be usable by someone who has never read any of the literature on this, so please do not assume we know the names of arguments or positions, and do not give us a reading list or references — we need something self-contained.

  The procedure will have to handle at least the following, and I would like you to say how it does so rather than leaving it to us:

  - The difference between a claim about a taxon's sentience, a claim about whether our money changes anything, and a claim about how much the change matters per individual, and how these combine without generating the appearance of precision. If the honest answer is that the procedure should refuse to combine them at all in some cases, say so and say what it does instead.
  - The fact that our uncertainty about sentience is shared across every insect proposal rather than independent per proposal, so that the portfolio does not diversify the way our vertebrate grants do. Say whether that should make us more or less willing to fund any of them.
  - Interventions whose sign is unknown rather than merely uncertain, including the case where restoring habitat increases the number of animals who will live and die.
  - Proposals whose whole value is reducing our uncertainty, and whether we should hold back a fixed share of the budget for them rather than re-deriving the case each round.
  - What to do when the plausible numbers span many orders of magnitude and the decision flips somewhere inside that range. If the answer is that the decision is then not really being made by the calculation, I would rather hear that than a confident-looking threshold.

  Then run the procedure on three proposals and show your work: a lab study on whether a particular order of farmed insect has the neural machinery for anything worth calling pain; a campaign to change the killing method at an industrial insect farm, where the change is cheap and applies to something like ten billion animals a year; and a wild pollinator habitat program that we have funded for four years, that our donors love, and that I suspect your procedure will tell us to cut. I want at least one case where the procedure gives an answer we will not like.

  Finally, tell me plainly which steps are judgment calls dressed up as procedure and who should be making them, what the procedure cannot do, and the conditions under which we should stop using it and build a different one.
reasoning: |-
  We are designing a decision procedure for evaluating grant proposals involving invertebrates, especially insects, where the key uncertainties are about sentience, the effectiveness of interventions, and the magnitude of welfare per individual. The procedure must be executable in under an hour per proposal and produce a one-page record for the board. It must be self-contained and not require specialized knowledge.

  The procedure will be a step-by-step checklist with clear stopping points (for rejection) and points where human judgment is required. The steps are:

  1. **Scope Check**: Is the proposal about invertebrates? If not, use the standard vertebrate procedure. (This step is just to route the proposal appropriately.)

  2. **Sentience Assessment**:
     - **Question**: What is the evidence that the target animals have the capacity to experience positive or negative states (sentience)? 
     - **Assessment**: We are not looking for a definitive answer but for a level of plausibility. We will use a simple scale: 
          - **High plausibility**: Strong evidence (e.g., behavioral and neurobiological evidence consistent with sentience in closely related species, or direct evidence in the species). 
          - **Medium plausibility**: Some evidence but inconclusive (e.g., mixed findings, or evidence from distantly related species).
          - **Low plausibility**: Little to no evidence (e.g., no known nervous system structures associated with sentience, or behavior that can be explained without sentience).
     - **Stopping point**: If the plausibility is **low**, reject the proposal. Reason: The case for sentience is too weak to justify funding given other uncertainties. Note: This step requires expert judgment, but we are not entomologists. Therefore, we will rely on a summary of the current scientific consensus as presented in the proposal and any available reviews. If the proposal does not address sentience adequately, it may be rejected at this stage.

  3. **Intervention Effectiveness**:
     - **Question**: Is there a reasonable chance that the intervention will improve welfare (or reduce suffering) per individual? And can the foundation's funding make a difference (i.e., is the project feasible and will it lead to the intended change)?
     - **Assessment**: We break this into two parts:
          a. **Direction of effect**: Will the intervention likely have a positive, negative, or unknown effect on welfare? 
              - If the effect is likely negative (e.g., increasing population without reducing suffering per individual might lead to more net suffering), reject.
              - If the effect is unknown (e.g., restoring habitat might increase population and we don't know if the lives are net positive or negative), proceed with caution (flag for judgment).
          b. **Causal link and feasibility**: Is there a clear pathway from our funding to the change? Are there risks of failure? We require at least a moderate chance of success (e.g., >20% chance of achieving the intended effect). If the chance of success is very low (<10%) or the pathway is unclear, reject.
     - **Stopping point**: If the intervention is likely to harm welfare, or if the chance of success is very low, reject.

  4. **Scale of Impact**:
     - **Question**: How many individuals are affected, and by how much per individual? 
     - **Assessment**: We are not going to multiply numbers arbitrarily. Instead, we will use a qualitative scale for the number of individuals and the expected change per individual. For example:
          - **Number of individuals**: 
              - Very large (e.g., billions or more)
              - Large (e.g., millions)
              - Moderate (e.g., thousands to hundreds of thousands)
              - Small (e.g., less than a thousand)
          - **Change per individual**: 
              - Large effect (e.g., reducing severe suffering for a substantial portion of their lives)
              - Moderate effect
              - Small effect
              - Unknown effect (but direction known)
     - We then combine these qualitatively. For an intervention to be considered, we require at least a moderate number of individuals and at least a small positive effect per individual. However, if the effect per individual is unknown (but positive) and the numbers are very large, we proceed to the next step (judgment).

  5. **Uncertainty and Portfolio Considerations**:
     - **Question**: How does the uncertainty in this proposal relate to the rest of our portfolio? 
     - **Assessment**: We note that uncertainty about insect sentience is shared across all insect proposals. Therefore, funding multiple insect projects does not diversify away this risk. This shared uncertainty should make us more cautious about funding any single insect project, but it does not necessarily mean we should reject them all. Instead, we might set a budget cap for the entire invertebrate portfolio (e.g., 20% of total budget) to limit exposure. We also consider:
          - **Learning value**: Does this proposal reduce key uncertainties (e.g., about sentience or intervention effectiveness) for future decisions? If so, it might be more valuable than its direct impact.

  6. **Judgment Call**:
     - **Question**: Considering the above, does the proposal warrant funding despite the uncertainties?
     - **Process**: At this point, the team must make a judgment. We consider:
          - The balance of evidence from steps 2-4.
          - The potential for learning (step 5).
          - The opportunity cost (what else could we fund?).
          - The values of the foundation (e.g., precautionary principle: if there is a non-negligible chance of sentience and suffering, should we act?).
     - **Output**: A decision to fund or not, and at what level (if partial funding is an option).

  7. **Budget Allocation for Research**:
     - We set aside a fixed portion of the budget (e.g., 10-20%) for research aimed at reducing key uncertainties (like sentience or intervention effectiveness). This is not re-derived each round. Proposals that primarily aim to reduce uncertainty are evaluated against other such proposals and funded from this set-aside.

  **Handling the Specific Issues**:

  - **Combining Claims Without False Precision**: We avoid multiplying numbers when the uncertainties are too high. Instead, we use qualitative scales and stop at judgment when the scales are ambiguous (e.g., if sentience is medium and effect per individual is unknown but positive, we don't compute an expected value but go to judgment). In cases where the sign of the intervention is unknown (e.g., habitat restoration increasing population), we do not fund unless the proposal can convincingly argue that the lives are net positive or that the intervention reduces suffering per individual.

  - **Shared Uncertainty (Sentience)**: Because the sentience uncertainty is shared, we are more cautious. We might fund fewer insect projects than if the uncertainty were independent. We set a portfolio cap.

  - **Interventions with Unknown Sign**: We flag these for extra scrutiny. We reject if the sign is likely negative. If unknown, we require strong evidence that the net effect is positive (e.g., by reducing suffering per individual without increasing population too much) or we reject.

  - **Proposals for Reducing Uncertainty**: We have a fixed budget share for them. They are evaluated on the potential to reduce uncertainty and the cost-effectiveness of doing so.

  - **Numbers Spanning Orders of Magnitude**: We do not compute expected values when the range is too wide. Instead, we note the range and if the decision flips within the range, we treat it as a judgment call. We might reject if the pessimistic case is very bad (e.g., negative impact) and the range includes both positive and negative.

  **Record for the Board**:
  We produce a one-page memo per proposal (or per round) that includes:
  - The proposal title and summary.
  - The assessment from each step (e.g., sentience: medium; intervention: positive effect, moderate chance of success; scale: very large numbers, small effect per individual).
  - Key uncertainties and how they were handled.
  - The decision and a brief justification.

  Now, we apply the procedure to three proposals.

  ---

  **Proposal 1: Lab study on neural machinery for pain in farmed insects (e.g., mealworms)**

  1. **Scope Check**: Invertebrates? Yes.
  2. **Sentience Assessment**: 
     - The proposal is about generating evidence on sentience. It does not assume sentience but aims to test it. Therefore, we do not reject at step 2. Instead, we note this is a research proposal and route it to the research set-aside.
  3. **Intervention Effectiveness**: 
     - The intervention is research. Its effectiveness in reducing uncertainty is high (if well-designed). The causal link is direct (funding the study). Chance of success: moderate to high (if the methods are sound).
  4. **Scale of Impact**: 
     - Not direct impact on animals, but potential to inform future interventions affecting billions. We rate the learning value as high because it addresses a key uncertainty (sentience in a farmed insect).
  5. **Uncertainty and Portfolio**: 
     - This directly reduces shared uncertainty (sentience). It should be considered for the research set-aside.
  6. **Judgment**: 
     - This is a strong candidate for the research set-aside. We recommend funding if it is among the best research proposals in the round.

  **Decision**: Fund from the research set-aside.

  ---

  **Proposal 2: Campaign to change killing method at an industrial insect farm**

  1. **Scope Check**: Invertebrates? Yes.
  2. **Sentience Assessment**: 
     - Target: Mealworms (or similar). Evidence for sentience? Currently low to medium (some evidence in insects, but not conclusive for this species). We assign **medium** (because of evidence in other insects and the proposal's focus on pain).
  3. **Intervention Effectiveness**:
     - Direction: The change is to a method that is thought to be faster and less painful. Assuming sentience, this is positive. Chance of success: The campaign is cheap and the farm is open to change? If so, moderate to high. But if the farm is resistant, low. We assume the proposal makes a case for feasibility (moderate chance of success).
  4. **Scale of Impact**:
     - Number: Very large (10 billion per year). Effect per individual: If the new method reduces suffering during killing, and if sentient, then the effect per individual is small (only at death) but for a very large number. We rate effect per individual as small, but numbers very large.
  5. **Uncertainty and Portfolio**:
     - Shared uncertainty about sentience. But the intervention is targeted and cheap. We note that if sentience is real, the impact is huge. However, if sentience is absent, then no impact. We are within the invertebrate budget cap.
  6. **Judgment**:
     - Given the huge upside if sentient and the low cost, we might fund. But the sentience uncertainty is key. We might conditionally fund, but the procedure says: if sentience is at least medium and the intervention is positive and feasible, then fund.

  **Decision**: Fund (if the invertebrate budget cap is not exceeded).

  ---

  **Proposal 3: Wild pollinator habitat program (e.g., planting flowers for bees)**

  1. **Scope Check**: Invertebrates? Yes.
  2. **Sentience Assessment**:
     - Bees: medium to high (more evidence than for other insects). We assign **medium** (conservatively).
  3. **Intervention Effectiveness**:
     - Direction: The program restores habitat, increasing bee populations. But does it improve welfare per bee? It might provide more food, but also might increase the number of bees that live and die. Without knowing if bee lives are net positive or negative, the sign of the intervention is unknown. We cannot assume it is positive. In fact, if bee lives are net negative (due to suffering in nature), then increasing population might be bad. The proposal does not address this. 
     - Therefore, we flag for judgment. The chance of success in increasing population is high, but the welfare effect is unknown.
  4. **Scale of Impact**:
     - Number: Large (millions of bees). Effect per individual: Unknown (could be positive or negative). Also, the effect on the population is positive (more bees) which might lead to more net suffering if lives are net negative.
  5. **Uncertainty and Portfolio**:
     - Shared uncertainty about sentience and now also about the sign of the intervention. This is a common issue in wild animal interventions.
  6. **Judgment**:
     - Without evidence that the lives of wild bees are net positive, we cannot assume the intervention is beneficial. Given the precautionary principle (if there is a risk of causing more suffering), we should not fund. This is a hard decision because donors love it, but the procedure leads to rejection.

  **Decision**: Reject.

  ---

  **Plain Talk**:

  - **Judgment Calls Dressed as Procedure**:
    - Step 2 (Sentience Assessment) is a judgment call. We rely on the proposal and our limited knowledge. We should have a standing external expert panel to periodically review the sentience evidence for major taxa, but that's not in the procedure.
    - Step 6 (Judgment) is explicitly a judgment call. The team must weigh the uncertainties and values.

  - **Who Makes the Judgment Calls**:
    - The three-person team makes the judgments. For sentience, they should consult a one-page summary of the current evidence (updated annually by an expert) to standardize. For the final judgment, they must consider the foundation's values and the board's guidance.

  - **What the Procedure Cannot Do**:
    - It cannot eliminate uncertainty. It cannot provide precise answers when the data is lacking. It cannot resolve deep philosophical questions (like what constitutes sentience). It cannot account for indirect effects (e.g., ecological consequences) beyond what is in the proposal.

  - **When to Stop Using It**:
    - If the foundation decides to take a strong stance on invertebrate sentience (e.g., assume sentience for all insects, or reject it entirely), then we can simplify.
    - If the volume of invertebrate proposals becomes too high, we may need to hire an entomologist or use a more formal model.
    - If the board wants to shift to a more quantitative approach (e.g., expected value with ranges), we would need to build that capacity.

  This procedure is a practical tool for making tough decisions under uncertainty. It forces us to confront the key questions and document our reasoning, even when we have to say no to popular programs.
answer: |-
  Below is a self-contained decision procedure designed for your team. It focuses on clear, sequential questions with explicit stopping points, avoids false precision, and flags where judgment is required. It handles your specified issues and is usable by non-specialists. The procedure is structured as a flowchart of questions, with each step requiring a "sufficient answer" (defined in italics). Total runtime per proposal is targeted at 30–45 minutes.

  ---

  ### **Decision Procedure for Invertebrate Welfare Proposals**
  **Goal**: Determine whether to fund a proposal, reject it, or flag it for human judgment.  
  **Output**: One-page record (template at end).  
  **Critical Rules**:  
  - Never multiply population size × sentience probability × welfare impact. These are assessed separately.  
  - Stop early if a rejection criterion is met.  
  - Use conservative thresholds for uncertainty (when in doubt, reject or flag for judgment).  

  #### **Step 1: Scope Check (1 minute)**  
  - **Question**: Is this proposal primarily about invertebrate welfare?  
  - **Sufficient answer**: Yes (proceed to Step 2) or No (use vertebrate procedure).  
  - **Relevance to your issues**: Ensures we only apply this to invertebrate cases.  

  #### **Step 2: Sentience Plausibility (10 minutes)**  
  - **Question**: Is there credible evidence that the target species can experience welfare-relevant states (e.g., pain, distress)?  
    - Ignore population size and focus only on biological evidence.  
  - **Sufficient answer**:  
    - **High plausibility**: Strong, direct evidence (e.g., neural structures analogous to vertebrates, behavioral responses to analgesics). *Proceed to Step 3*.  
    - **Medium plausibility**: Indirect or partial evidence (e.g., similar to sentient relatives but not confirmed). *Flag for judgment at Step 6*.  
    - **Low plausibility**: No evidence or purely theoretical arguments. *Reject*. Stop here.  
  - **Handling your issues**:  
    - Separates sentience from other factors. Avoids combining with population size.  
    - Shared uncertainty: If sentience is low/medium, it applies to all insect proposals. This makes us **less willing to fund** unless evidence is strong (hence rejection at low).  

  #### **Step 3: Intervention Impact Direction (10 minutes)**  
  - **Question**: Is the intervention likely to improve welfare per individual?  
    - Assess only the direction (positive, negative, or unknown), not the magnitude.  
  - **Sufficient answer**:  
    - **Clearly positive** (e.g., reduces painful slaughter methods). *Proceed to Step 4*.  
    - **Clearly negative** (e.g., increases suffering). *Reject*. Stop here.  
    - **Unknown** (e.g., habitat restoration that increases population size). *Flag for judgment at Step 6*.  
  - **Handling your issues**:  
    - Interventions with unknown sign (e.g., increasing population) are not assumed beneficial. Stopping here prevents false precision.  

  #### **Step 4: Feasibility and Scale (10 minutes)**  
  - **Question A (Feasibility)**: Can our funding realistically cause this change?  
    - **Sufficient answer**:  
      - **Likely** (>50% chance of success, per expert estimates or historical analogs). *Proceed to Question B*.  
      - **Unlikely** (<30% chance or no clear pathway). *Reject*. Stop here.  
  - **Question B (Scale)**: How many individuals are affected, and is the per-individual welfare change nontrivial?  
    - **Sufficient answer**:  
      - **Large-scale + Non-tiny effect**: Affects >1M individuals AND welfare change is more than fleeting (e.g., not a 0.1-second reduction in pain). *Proceed to Step 5*.  
      - **Small-scale or trivial effect**: Affects <1M individuals OR effect is microscopic (e.g., seconds of relief). *Reject*. Stop here.  
      - **Uncertain scale/effect**: Numbers or impact unclear. *Flag for judgment at Step 6*.  
  - **Handling your issues**:  
    - Separates "whether money changes anything" (feasibility) from "how much change matters" (scale/effect).  
    - Uses conservative thresholds (e.g., 1M individuals) to avoid over-reliance on huge populations.  
    - Does not quantify "welfare per individual" beyond trivial/nontrivial.  

  #### **Step 5: Uncertainty and Portfolio Fit (5 minutes)**  
  - **Question**: Does this proposal reduce critical uncertainties (e.g., about sentience or intervention effectiveness)?  
  - **Sufficient answer**:  
    - **Yes, significantly**: Provides generalizable knowledge (e.g., a study on pain mechanisms). *Flag for research budget (Step 6)*.  
    - **No or minimally**: Only impacts direct welfare. *Proceed to Step 6*.  
  - **Handling your issues**:  
    - Research proposals are handled separately (fixed budget share, see Step 6).  
    - Shared uncertainty: Since sentience uncertainty affects all proposals, research is prioritized.  

  #### **Step 6: Judgment and Budget Allocation (5–10 minutes)**  
  - **Cases requiring judgment**:  
    - Sentience "medium plausibility" (Step 2).  
    - Intervention impact "unknown" (Step 3).  
    - Scale/effect "uncertain" (Step 4).  
    - Research proposals (Step 5).  
  - **Process**:  
    - Debate as a team: "Would we fund this if the uncertain factor were pessimistic? Optimistic?"  
    - Apply foundation values: Precaution (avoid harm) vs. proportionality (scale justifies risk).  
    - **Output**: Fund, Reject, or Reduce funding (e.g., partial grant for pilot).  
  - **Budget rules**:  
    - **Research share**: Allocate 15% of quarterly budget to uncertainty-reducing proposals. No re-deriving.  
    - **Invertebrate cap**: Limit invertebrate grants to 25% of total quarterly spending (due to shared sentience uncertainty).  

  #### **Final Output**  
  Produce a one-page record:  
  - Proposal ID, title, and summary.  
  - Step outcomes (e.g., "Step 2: Medium plausibility → Judgment").  
  - Decision (Fund/Reject) with rationale.  
  - Uncertainties flagged.  

  ---

  ### **Application to Three Proposals**
  **Assumptions**:  
  - Quarterly budget: $500K. Research share: $75K (15%). Invertebrate cap: $125K (25%).  
  - Conservative thresholds used (e.g., "high" sentience requires direct evidence).  

  ---

  #### **Proposal A: Lab study on pain in farmed crickets (Order: Orthoptera)**  
  - **Ask**: $50K for neuro-behavioral experiments.  
  - **Step 1**: Invertebrates? Yes.  
  - **Step 2**: Sentience plausibility? **Medium** (crickets show avoidance learning, but no direct pain evidence). → *Flag for judgment*.  
  - **Step 3**: Intervention impact? **Unknown** (research doesn’t directly change welfare). → *N/A (judgment already flagged)*.  
  - **Step 4**: Feasibility? **Likely** (standard lab methods). Scale? **Uncertain** (no direct impact, but knowledge could affect future welfare). → *N/A (judgment flagged)*.  
  - **Step 5**: Reduces uncertainty? **Yes, significantly** (addresses sentience for farmed insects). → *Allocate to research budget*.  
  - **Step 6**: **Fund from research share** (fits $75K budget; reduces key uncertainty).  
  - **Record**:  
    > *A: Crickets sentience study. Step 2: Medium plausibility → Judgment. Step 5: High uncertainty-reduction. Decision: Fund $50K (research share). Reduces shared sentience uncertainty.*  

  ---

  #### **Proposal B: Campaign to change killing method at mealworm farm**  
  - **Ask**: $30K to advocate for rapid freezing (applies to 10B/year).  
  - **Step 1**: Invertebrates? Yes.  
  - **Step 2**: Sentience plausibility? **Low** (mealworms lack nociceptors; no behavioral evidence). → **Reject**. Stop.  
  - **Record**:  
    > *B: Mealworm slaughter campaign. Step 2: Low sentience plausibility. Decision: Reject. Insufficient evidence for welfare-relevant states.*  

  **Note**: This outcome may surprise proponents (given large numbers), but the procedure stops early at sentience. Judgment is not triggered.  

  ---

  #### **Proposal C: Wild pollinator habitat program**  
  - **Ask**: $100K to plant native flowers (affects ~50M bees/year). Funded for 4 years; donors love it.  
  - **Step 1**: Invertebrates? Yes.  
  - **Step 2**: Sentience plausibility? **Medium** (bees show complex behavior, but pain not confirmed). → *Flag for judgment*.  
  - **Step 3**: Intervention impact? **Unknown** (more habitat = more bees = unknown net welfare; some may starve without intervention). → *Flag for judgment*.  
  - **Step 4**: Feasibility? **Likely** (habitat restoration works). Scale? **Large-scale + Non-tiny effect?** Unknown (if lives are net negative, more bees = more suffering). → *Flag for judgment*.  
  - **Step 5**: Reduces uncertainty? **No** (no new knowledge). → *Proceed to judgment*.  
  - **Step 6**: Judgment:  
    - Pessimistic view: Bees have net-negative lives; increasing population harms welfare.  
    - Optimistic view: Bees have net-positive lives; program prevents starvation.  
    - **Team decision**: Reject (precautionary principle). Uncertainty too high; could cause harm.  
  - **Record**:  
    > *C: Pollinator habitat. Step 2: Medium plausibility → Judgment. Step 3: Unknown impact → Judgment. Step 4: Scale uncertain → Judgment. Decision: Reject. Welfare impact sign unknown; risk of increasing suffering. Violates precaution.*  

  **Note**: This rejects a donor-favorite project, as requested.  

  ---

  ### **Plain Talk: Limitations and Judgment Calls**  
  **Judgment Calls Dressed as Procedure**:  
  1. **Step 2 (Sentience)**: "Plausibility" is subjective. *Who decides*: Your team, using a standardized rubric (e.g., "high" requires published evidence of pain receptors). Update this rubric annually via an external entomologist consult (1–2 hours).  
  2. **Step 6 (Judgment)**: Values-based trade-offs (e.g., precaution vs. scale). *Who decides*: Your team, but board must provide ethical guidelines (e.g., "Prioritize avoiding harm over large-but-uncertain gains").  

  **What the Procedure Cannot Do**:  
  - Resolve philosophical disputes (e.g., "What is sentience?"). It defaults to evidence-based thresholds.  
  - Handle correlated uncertainties beyond shared sentience (e.g., if all proposals depend on the same policy change).  
  - Assign exact dollar values to uncertain outcomes.  

  **When to Abandon This Procedure**:  
  1. If >50% of proposals hit "judgment" in Step 6, indicating it’s too vague. Build a quantitative model (e.g., Monte Carlo simulation) with expert help.  
  2. If sentience evidence evolves rapidly (e.g., consensus emerges). Shift to a sentience "tier list" (e.g., fund all high-plausibility taxa).  
  3. If budget constraints change (e.g., "bad round" becomes critical). Add a financial risk assessment step.  

  **Final Advice**:  
  - Use the first two rounds to calibrate (e.g., if rejecting too many, adjust thresholds).  
  - Board’s role: Review the one-page records to ensure alignment with values, not re-litigate science.  
  - This procedure makes uncertainty explicit—it won’t eliminate tough calls, but it will make them systematic and defensible.  

  ---  
  This procedure prioritizes avoiding harm, stops unactionable proposals early, and flags unresolvable uncertainties for human judgment. It meets your constraints while handling population size, shared uncertainty, and unknown impacts without false precision.
