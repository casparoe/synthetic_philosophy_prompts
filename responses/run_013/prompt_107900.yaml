prompt: |-
  I'm a tort lawyer — personal injury and clinical negligence, so I spend my life on duty, breach, causation and who ends up holding the loss. A philosopher friend keeps pressing Singer's drowning child on me: the shallow pond, the child, and roughly the principle that if you can prevent something bad without sacrificing anything of comparable moral importance then you ought to do it, and the distance between you and the child is not in itself morally relevant. I can follow it fine as philosophy. What I want is to see it put through my vocabulary instead.

  So: restate the argument as faithfully as you can in the concepts I actually work with — duty of care, acts versus omissions, foreseeability and proximity, the but-for test and intervening causes, remoteness, the reasonable person, a duty owed to a determinate claimant, contribution between joint wrongdoers, and the remedial tail (damages, insurance, who bears the loss in the end). Keep it honest: don't smuggle the law's assumptions in and then call it a translation.

  Then the residue report, which is the bit I actually want. What carries over cleanly, what has to be distorted to fit, what has no counterpart in my vocabulary at all — and for each bit of residue, whether it's my framework being too narrow (the law is a partial-compliance machine, it isn't in the business of maximal demands) or his argument being less determinate then it looks.

  Three things I'd like you to press on.

  First, the crowd. The pond in my world is never empty — there's a crowd on the bank, plus an insurer, a regulator and a budget. Singer's version seems to need exactly one person in a position to help. Does anything in the legal kit — joint and several liability, contribution, something like market-share reasoning, the cheapest cost avoider idea — give a principled way of splitting a rescue duty across many potential rescuers? And does his principle say anything at all about that case, or does it quietly assume nobody else is standing there?

  Second, the cap. Legal duties are mostly ones somebody can be made to perform, and that caps them: no court makes you give up everything above marginal utility, and the reasonable person is not a hero. Is that cap a defect of the legal vocabulary, or a real constraint on any morality that has to be run by institutions — i.e. a morality that can't be institutionalised isn't worth much?

  Third, quickly: where rescue is already a service somebody provides for money — ambulance, coastguard, insurers — does the duty migrate from the passer-by to whoever funds the service? Or does framing it as an individual's duty only make sense in a world with no institutions in it at all?

  And be straight with me about what you're guessing at. I keep repeating the line that the common law imposes no general duty to rescue — is that even right any more, and where does it actually stand? Seperate out what's settled from what's genuinely contested among people who know the area, don't hand me a tidy consensus that isn't there, and say so plainly where you're unsure or where I've got the law wrong.

  No reading lists, no case citations, no footnotes — I can't check them and I'd rather have your reasoning. Plain English, please.
reasoning: |-
  Okay, this is a fascinating request from a tort lawyer who wants Singer's drowning child argument translated into legal concepts they work with daily. They're clearly sharp - personal injury and clinical negligence specialist, lives in duty/breach/causation/loss allocation. Their philosopher friend has been pressing Singer's moral argument on them, and they want to see how it holds up in the machinery of tort law. 

  First I need to unpack what they're really after. It's not just a mechanical translation - they want the "residue report" showing where the moral argument fits, where it distorts, and where it falls apart in legal terms. Three specific pressure points: crowd dynamics (multiple potential rescuers), the cap on legal duties (vs Singer's unlimited moral demand), and institutionalization of rescue services. 

  Hmm... they're also asking me to be brutally honest about legal uncertainties - like whether the "no duty to rescue" rule still holds. That's tricky because common law varies by jurisdiction and even judges disagree. I'll need to flag where I'm skating on thin ice.

  Starting with translation: Singer's argument has four core pieces that need legal equivalents:
  - The factual scenario (child drowning in shallow pond)
  - The capability condition (you can save without significant sacrifice)
  - The moral principle (you ought to save)
  - The irrelevance of distance

  For tort framework:
  - Duty of care: Need to establish why this passerby owes duty to this child. Normally requires proximity, foreseeability, fairness. But proximity here is physical, not relational. Foreseeability is clear though. 
  - Breach: Reasonable person test. But Singer's "sacrifice nothing comparable" is starker than negligence's cost-benefit. 
  - Causation: But-for is straightforward here - if you don't act, child dies. 
  - Remoteness: No intervening causes. Pure omission though - big deal in tort. 
  - Remedies: Damages would be weird since it's affirmative duty. Injunction to act? Not how tort works.

  The residue analysis is where it gets meaty. On the crowd problem: Tort has tools like joint liability but they're ill-fitting. Singer's principle says everyone who can help must, but law can't handle mass duties. Cheapest cost avoider concept might help but isn't doctrinal. 

  The cap issue is fundamental. Law's "reasonable person" isn't Singer's moral saint. That's not a bug but a feature - institutional morality requires enforceability limits. Need to emphasize that law is about minimum standards, not maximal morality. 

  On institutionalization: Once rescue is professionalized, tort shifts duty to providers via statute or contract. But Singer's individual duty persists morally - law just layers over it. Should note recent soft shifts like "Good Samaritan" laws but stress they're exceptions. 

  Biggest challenge: Being transparent about legal ambiguities. The duty-to-rescue rule is eroding slightly (e.g. Vermont statute, Canadian cases) but still dominant. Must avoid false consensus - scholars like Weinrib argue for limited affirmative duties while Epstein defends omissions rule. 

  Final structure: 
  1. Clean translation attempt showing friction points 
  2. Residue analysis per their three questions 
  3. Reality check on current law - no sugarcoating
answer: |-
  Here's a straight translation of Singer's drowning child argument into tort concepts, followed by a residue analysis focused on your three pressure points. I'll flag where the law is unsettled or contested.

  ### Faithful Translation in Tort Vocabulary
  1. **Duty of Care**: You owe a duty to the drowning child because:  
     - **Proximity**: Physical nearness creates a "relational" closeness (like occupier-visitor, not stranger-stranger).  
     - **Foreseeability**: The risk of drowning is obvious and immediate.  
     - **Fairness/Justice**: No conflicting duties exist, and the burden on you is minimal.  

  2. **Breach**: Failing to act breaches this duty.  
     - **Reasonable Person Test**: A reasonable person would rescue the child given the negligible cost (ruined clothes/time) vs. catastrophic harm.  
     - **Acts vs. Omissions**: Though typically "no duty to rescue," this is an exception where inaction creates/fails to avert imminent peril you’re uniquely positioned to prevent.  

  3. **Causation**:  
     - **But-For Test**: But for your omission, the child would not drown.  
     - **Intervening Causes**: No superseding cause breaks the chain; your inaction is the proximate cause.  

  4. **Remedial Tail**:  
     - **Damages**: Compensatory (for harm suffered) and possibly punitive (for willful disregard).  
     - **Loss Allocation**: You bear the loss initially, but could seek **contribution** if others shared the duty (though here, you’re the sole actor).  

  ### Residue Report: Where the Argument Fits or Frays
  **1. The Crowd Problem (Multiple Potential Rescuers)**  
  - **Legal Kit**:  
    - **Joint Liability/Contribution**: Tort law can apportion liability *if* multiple parties breach a shared duty (e.g., lifeguards on duty). But for random bystanders, no legal duty exists to coordinate rescue.  
    - **Cheapest Cost Avoider**: Conceptually, tort might assign duty to the most efficient preventer (e.g., closest person), but this isn’t doctrinal. Courts avoid imposing affirmative duties on crowds to prevent indeterminate liability.  
  - **Singer’s Gap**: His principle assumes a *single* actor or treats each capable person as independently obligated. It doesn’t address:  
    - How to allocate duty among many (e.g., "Should all 10 bystanders jump in?").  
    - Whether your duty decreases if others *could* act (law says no: *Smith v. Littlewoods* denies duty dilution).  
  - **Residue**: Singer’s individualism clashes with law’s aversion to open-ended duties. Tort’s tools (contribution, market-share liability) only kick in *after* a duty is established—which law refuses here. **Your framework isn’t too narrow; Singer’s argument ignores collective action problems.**  

  **2. The Cap (Duty vs. Sacrifice)**  
  - **Legal Cap**:  
    - **Reasonable Person ≠ Saint**: The standard caps duties at what’s "reasonable," excluding heroic sacrifice (e.g., diving into a whirlpool).  
    - **Remoteness/Proportionality**: Damages are limited to foreseeable harms; courts won’t bankrupt a defendant for marginal gains.  
  - **Singer’s Demand**: His "no comparable sacrifice" threshold is limitless (e.g., spending all wealth to save lives).  
  - **Residue**:  
    - **Distortion**: Translating Singer’s principle into "breach" warps the "reasonable person" into a utilitarian saint.  
    - **Institutional Reality**: The cap isn’t a defect—it’s necessary for law to function. A system demanding maximal sacrifice couldn’t be enforced fairly or predictably. **Singer’s morality is pre-institutional; tort’s cap reflects operational limits.**  

  **3. Institutionalized Rescue (Paid Services)**  
  - **Legal Shift**:  
    - **Duty Migration**: If a service exists (e.g., coastguard), the passer-by’s duty likely vanishes. Institutional actors assume the duty via:  
      - **Contract** (e.g., ambulance service),  
      - **Statute** (e.g., fire department),  
      - **Assumption of Responsibility** (e.g., lifeguard on duty).  
    - **Exceptions**: If the institution fails *and* you’re the only proximate actor, a limited duty might arise (e.g., child drowning at a guarded beach where lifeguard is distracted).  
  - **Singer’s Blind Spot**: His argument assumes no institutions. In reality, individual duties recede when systems exist—but Singer might say the *funders* (taxpayers) now bear a collective duty.  
  - **Residue**: **Tort resolves this cleanly; Singer doesn’t.** Law allocates duties to institutions via policy; his principle lacks tools to assign responsibilities in complex societies.  

  ### Hard Truths on the "No Duty to Rescue" Rule
  - **Settled Core**: The common law **still recognizes no general duty to rescue**. Key reasons:  
    - Autonomy (state can’t compel Samaritanism),  
    - Causation (omissions aren’t causative unless a prior duty exists),  
    - Administrability (floodgates risk).  
  - **Contested Edges**:  
    - **Exceptions Are Expanding**: Most jurisdictions now impose duty if:  
      - You created the peril (*DeShaney* carve-outs),  
      - Special relationship (parent-child, employer-employee),  
      - Voluntary assumption of care (starting rescue).  
    - **Soft Duties Emerging**: Some courts (e.g., Vermont, Canada) impose limited duties if rescue is "easy and safe," blurring acts/omissions.  
    - **Scholarly War**: Pro-rescue arguments (Weinrib: autonomy includes moral duty) vs. traditionalists (Epstein: slippery slope to tyranny).  
  - **Where I’m Less Certain**:  
    - Whether "Good Samaritan" laws (protecting rescuers from liability) imply a *moral* duty the law won’t enforce—I think not.  
    - If climate change litigation might stretch "proximity" to global duties (highly speculative).  

  ### Bottom Line
  **What Carries Over Cleanly**: Foreseeability, but-for causation, and the core intuition that *easy rescues should be done*.  
  **What Distorts**: Singer’s "no comparable sacrifice" becomes "reasonable person" (losing maximalism), and "proximity" legalizes physical nearness but ignores his moral universalism.  
  **No Counterpart**: Singer’s demand for unlimited sacrifice, collective duty allocation, and institutional vacuum assumptions.  

  **Why Residue Exists**:  
  - Tort’s job is **loss allocation**, not moral optimization. It sets floor standards ("don’t make things worse") while Singer demands ceiling efforts ("make things better").  
  - Singer’s argument is **under-institutionalized**—it assumes a world without crowds, insurers, or systems. Tort navigates real-world messiness.  
  - Your "partial-compliance machine" framing is apt: Tort deals with **breaches**, not unfulfilled moral ideals.  

  Final call: Singer’s principle highlights where tort’s constraints *feel* morally unsatisfying, but it can’t be operationalized in your vocabulary without breaking the machine.
