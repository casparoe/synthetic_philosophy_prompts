  First, I need to understand the user's core argument: they're challenging the tight-loose framework by emphasizing predictability as the key factor. The "capricious middle" is where inconsistent enforcement creates cognitive load. The user wants Q&A prep focused on this specific audience's likely objections.

  Hmm, the social psychologists will care about measurement and replication. They'll ask how to operationalize "predictability" and whether cognitive load is measurable. The anthropologists will challenge treating culture as a variable - they'll see this as reductionist. The economist will want causal identification strategies. 

