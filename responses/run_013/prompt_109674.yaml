prompt: |-
  I've just been made chair of our town's new citizens' panel — 24 of us picked by lot off the electoral roll, four Saturdays in a row, we make recommendations on a couple of contested budget decisions and the council either accepts them or has to override them by a two-thirds vote and publish its reasons. First meeting is in a fortnight and I'm in the chair. I can't vote unless its tied, I don't get to say anything about the substance, and the clerk takes the minutes (she's great but she is not a lawyer). Everyone's watching, because one of the items is whether we keep funding a community organisation that got itself into a mess last month — some genuinely ugly stuff was said by someone there, half the panel is furious about it, the other half thinks the fury is now the real problem, and I have to keep that conversation from turning into a brawl.

  The reason I'm asking you and not just winging it: the three famous cautionary tales about Athenian democracy are all, when you actually look at them, procedural. I know them roughly. The assembly voted to kill every adult man in Mytilene, woke up the next day regretting it, held a second assembly and un-did the whole thing (that's the Thucydides bit, book three). The Sicilian expedition got voted through largely on what a delegation from a small allied city said they could pay for, and when Nicias tried to sink the plan by demanding an absurdly large force, the assembly just... gave him the force. And the Athenians killed Socrates for being annoying — a few hundred men who mostly wanted him to stop. So: rage, credulity, and intolerance of the one person who won't shut up. There's also something I half-remember about them having a rule where you could be hauled into court for proposing a decree that conflicted with an existing law, with the decree frozen while the case ran and the proposer personally copping the penalty — a weird and interesting bit of design, and I keep turning it over.

  Here's what I want. Take the role of a political theorist who knows this material cold. Think it through carefully before you write, and start with a short brainstorm of the failure modes these episodes are actually evidence for — the specific mechanism in each, not just rage/hubris/vibes — then turn them into something I can run.

  Give me a decision procedure for me, the chair, to run on every substantive item, in order: the questions I ask, in what order, what counts as a sufficient answer to each, where the procedure stops with a clear no, and where it hands the decision back to the panel (or the clerk, or the council) because the question is one of values and not something a procedure can settle. It has to fit a chair with about ten minutes per item, no legal training, no staff, and a room that will get bored and resentful if I start philosophising at them. If part of it can be a one-page card I keep in front of me, even better.

  Two things I'd specifically like the procedure to do, because I think they're the hard bits:

  - Separate the Mytilene situation from the Sicily situation. In one, the people who'd pay the price weren't in the room and weren't asked; in the other, the interested party was in the room, spoke first, and its claims were never checked. A step that just says consult the affected doesn't cover both, and I want to know what does.
  - Do something with that frozen-decree, personally-liable-proposer idea. I want a step where, before we vote, I check whether the proposal contradicts something the panel or the council has already decided, and whether the person pushing it has something riding on it personally. But I don't want it turning into a weapon the majority uses to freeze anything it dislikes — so if you build it in, tell me how to keep it from being abused, or tell me it can't be done and why.

  Then run the procedure on three items, and don't skip the parts where it gives an answer I won't like: (1) the defunding item, where I'll admit I think the furious half is right; (2) a proposal to commit most of our remaining budget to a big regional project, on the strength of a presentation by a delegation from the partner body who say the matching money is definitely coming; (3) a motion to formally censure the panel member who raises the same grievance at every session and won't let it go, after which everyone assumes he'll resign.

  Finally, tell me what the procedure can't do, and be straight about how confident you are in the whole thing — and single out the one point you're least sure of, because I'd rather know where the soft spot is now than find out mid-meeting.
reasoning: |-
  Hmm, this is a fascinating and complex request about designing a decision procedure for a citizens' panel. The user is chairing a new citizens' panel with high stakes - particularly around defunding a controversial community organization - and wants to prevent classic democratic failures seen in ancient Athens. They've identified three key Athenian failure modes: rage-driven decisions (Mytilene), credulity toward advocates (Sicily), and intolerance of dissent (Socrates). 

  The user needs a practical, chair-friendly procedure that can be executed in about 10 minutes per item. They specifically want mechanisms to address two hard problems: separating the "absent victims" issue (Mytilene) from the "unverified claims" issue (Sicily), and implementing something like Athens' frozen-decree rule without enabling majority abuse. They also want me to stress-test the procedure on three contentious scenarios.

  First, I should extract the precise mechanisms from those Athenian episodes:
  - Mytilene: Collective punishment voted without hearing the accused, driven by anger
  - Sicily: Unverified resource claims from vested interests accepted without scrutiny
  - Socrates: Punishing dissent through procedural shortcuts (trial by assembly)

  The procedure needs to be minimalist - no philosophical speeches, just crisp chair actions. The "frozen decree" idea is tricky; I'll adapt it as a "conflict check" with personal interest disclosure, but must prevent weaponization by requiring specific contradiction evidence and treating interests as transparency issues rather than disqualifiers.

  For the three test cases:
  1) Defunding vote: Procedure should force specificity about which actions warrant defunding and require considering alternatives. This might frustrate the user who agrees with the furious faction.
  2) Regional project: Must trigger verification of the "definitely coming" funds claim before voting.
  3) Censure motion: Should block punitive actions against persistent dissenters unless they violate explicit rules.

  The key weaknesses will be the interest declaration step (people might lie) and enforcing brevity in heated moments. I'll emphasize that the procedure can't resolve deep value conflicts - just ensure they're properly surfaced.

  This user is impressively prepared - they've identified exactly how ancient democratic failures map to modern participation pitfalls. Their self-awareness about their own bias on the defunding issue suggests they'll implement this fairly. The real test will be whether the procedure can hold when half the room is emotionally invested.
answer: |-
  Here's a decision procedure based on Athenian failure modes, designed for a time-pressed chair. It fits on one page (see **bold** steps for your cheat sheet) and focuses on *process discipline* rather than substance.

  ---

  ### **Athenian Failure Modes & Mitigations**
  1. **Mytilene (Rage Targeting Absent Groups)**  
     *Mechanism:* Collective punishment of an out-group not present to defend itself, fueled by anger.  
     *Mitigation:* **Require specificity & proportionality** – *Who exactly is harmed? What exactly was done? Does the punishment fit?*

  2. **Sicily (Credulity Toward Advocates)**  
     *Mechanism:* Over-reliance on unverified claims by interested parties promising resources/outcomes.  
     *Mitigation:* **Separate advocacy from verification** – *What’s claimed? How do we know? Who verifies?*

  3. **Socrates (Intolerance of Dissent)**  
     *Mechanism:* Using state power to punish persistent minority voices.  
     *Mitigation:* **Block punitive procedural shortcuts** – *Is this about conduct or opinion? Is there documented harm?*

  4. **Frozen Decree (Legal Conflict/Accountability)**  
     *Mechanism:* Proposals conflicting with laws, with personal liability for proposers.  
     *Adaptation:* **Conflict/Interest Check** – *Does this contradict prior decisions? Does the proposer stand to gain/lose personally?* (Abuse prevention: Requires *specific* contradiction evidence; personal interest = transparency, not disqualification).

  ---

  ### **The Chair’s Decision Procedure (10 Min/Item)**
  **Cheat Sheet Flow:**  
  1. **Frame →** 2. **Specific Harm →** 3. **Verify Claims →** 4. **Conflict Check →** 5. **Interest Declare →** 6. **Proportionality →** 7. **Vote/Refer**

  | Step | Chair’s Question/Script                                                                 | Sufficient Answer                                                                                                | If Not Met                                                                 |
  |------|-----------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------|
  | **1. Frame** | *“What specific problem does this proposal solve? Phrase it in one sentence.”*                                | Clear problem statement (e.g., “Group X misused funds,” not “They’re awful”).                                    | Stop: Return for refinement.                                               |
  | **2. Specific Harm** | *“Who is directly harmed by this problem? Is evidence of that harm in the briefing pack?”*                      | Identifiable victims + documented harm (minutes, reports, data). If absent: *“Are we punishing unseen people?”* | Stop: No vote without evidence of harm to others. Refer to clerk for facts. |
  | **3. Verify Claims** | *“What key facts does this proposal rely on? How were they verified? By whom?”* <br> *(If outside claims: “Has the clerk/council confirmed this?”)* | Sources cited + verification method (e.g., “Council audit,” “Independent minutes”).                              | Stop: Refer unverified claims to clerk/council for fact-check. No vote.    |
  | **4. Conflict Check** | *“Does this contradict any existing panel recommendation or council policy? Point to the text.”*                 | Specific contradiction cited (e.g., “Page 3 of our May report”). If none: proceed.                               | Stop if valid conflict found. Refer to clerk for legal review.             |
  | **5. Interest Declare** | *“Proposer: Do you, your family, or your employer stand to gain or lose significantly from this? Be brief.”*     | On-record declaration (e.g., “No” or “Yes, my sister works there”). No debate.                                  | No stop – record in minutes. Abuse control: Chair cuts off debate on this. |
  | **6. Proportionality** | *“Does the scale of the solution match the harm? Is there a narrower fix?”*                                      | Explicit comparison (e.g., “The fraud was $1k; clawback covers it” or “We tried warnings”).                     | No stop – flags risk of overreach. Proceed to vote.                        |
  | **7. Vote/Refer** | *“We’ve met procedure. Panel may now debate/vote.”* <br> OR <br> *“We lack verified facts/face a conflict. Clerk will refer this to council.”* | All prior steps satisfied.                                                                                       | Do not vote if stopped at Steps 1-4. Hand unverifiable/conflicting items to clerk/council. |

  ---

  ### **Test Runs: Applying the Procedure**
  **Item 1: Defunding the Controversial Community Group**  
  - *Frame:* “Stop funding Group X because their leader made hateful remarks.”  
  - *Harm:* “Harmed group is [minority]. Evidence: Meeting minutes quoting remark.” → **Met.**  
  - *Verify:* “Claim: Remarks violate grant terms. Verification: Clerk has grant contract section 5.2.” → **Met.**  
  - *Conflict:* “Contradicts our ‘support free speech’ principle? No specific text.” → **Met.**  
  - *Interest:* “Proposer: ‘No personal stake.’” → **Met.**  
  - *Proportionality:* “Is defunding the only option? Could we require training instead?” → **Debate allowed** (You dislike this but procedure allows vote).  
  - *Outcome:* Vote proceeds. *Procedure note:* You must allow alternatives even if you disagree.

  **Item 2: Regional Project Funding (Based on Partner’s “Guarantee”)**  
  - *Frame:* “Fund Project Y because Partner Z promises matching funds.”  
  - *Harm:* “Harm if we don’t? Not specified.” → **Stop: No harm evidence.** Clerk must define opportunity cost.  
  - *Verify:* “Claim: Partner Z has funds. Verification? ‘They said so today.’” → **Stop: Unverified.** Refer to clerk to get written commitment from Partner Z.  
  - *Outcome:* **No vote.** Delegation’s claims insufficient without documentation. Sicily risk averted.

  **Item 3: Censuring the Persistent Dissenter**  
  - *Frame:* “Censure Member A for disrupting meetings.”  
  - *Harm:* “Harm: Wastes time. Evidence: Clerk’s logs show he speaks 2x longer than others.” → **Met.**  
  - *Conflict:* “Contradicts panel’s ‘open debate’ rule? No, censure is conduct-based.” → **Met.**  
  - *Interest:* “Proposer: ‘No personal stake.’” → **Met.**  
  - *Proportionality:* “Is censure proportionate? Has he been warned?” → If no warning, **suggest formal warning first** (Socrates risk mitigation).  
  - *Outcome:* If warnings ignored, vote allowed. *But:* Chair must ensure censure motion cites *specific rule breaches*, not “annoying us.”

  ---

  ### **What the Procedure Can’t Do & Weaknesses**
  **Can’t Do:**  
  - Resolve deep value conflicts (e.g., “free speech vs. harm prevention”). It ensures *how* we argue, not *what* we decide.  
  - Force honesty in interest declarations (relies on public shaming/minutes).  
  - Replace expertise (e.g., legal nuances go to clerk/council).  
  - Fix power imbalances (e.g., charismatic members dominating).  

  **Confidence Level:**  
  - **85% confident** in blocking rage (Mytilene), credulity (Sicily), and punitive moves (Socrates) if strictly followed.  
  - **Least Confident Point:** **Step 5 (Interest Declare)**. It depends on proposer honesty and panel discipline. A member *could* lie about interests, and the room might still suspect bias. Mitigation: Minutes create accountability, but it’s fragile.  
  - **Soft Spot:** **Step 6 (Proportionality)** is subjective. A skilled demagogue could argue “This $1M fine *is* proportional to the insult!” Your only tool: Insist on comparing *scale* (e.g., “The harm was verbal; the cost is bankruptcy. Explain the match.”).

  ---

  **Final Chair Script for Tough Moments:**  
  > *“I’m not judging the issue – I’m enforcing steps so we don’t repeat ancient Athens’ mistakes. If we skip these, we risk decisions that look cruel, gullible, or petty later. Bear with me: 90 seconds on Step 3 saves us from a scandal.”*

  Bring a timer. If stuck, say: **“This needs verification/refinement. Clerk, note we’re referring it. Next item.”** You’ve got this.
