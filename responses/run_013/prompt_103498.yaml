answer: |-
  Here is a final exam essay question designed to meet your specifications, followed by a model answer and a detailed marking scheme.

  ---

  ### Essay Question (60 minutes)

  **"The proposal to add a mandatory waiting period and second-approver step to the hospital’s automated prescribing tool is not merely a workflow tweak but a political intervention. Critically evaluate this claim by analyzing how the proposal might be understood as political under three distinct readings:  
  (i) Expressive (encoding/expressing values),  
  (ii) Causal (producing/stabilizing power distributions), and  
  (iii) Constitutive (partly constituting political relations).  
  Specifically, argue which reading(s) best capture the proposal’s significance, using this case to clarify how one would empirically distinguish a *constitutive* effect from expressive or causal ones. What evidence would demonstrate that the design is doing constitutive political work?"**

  ---

  ### Model Answer (Approx. 700 words)

  The claim that adding a waiting period and second approver to an automated prescribing tool is a political intervention requires unpacking through distinct analytical lenses. While some committee members view this as a neutral adjustment, the proposal’s significance lies in how it engages with the latent politics of the original tool. By examining expressive, causal, and constitutive readings, we can clarify not only *that* the proposal is political but *how* it functions politically, with the constitutive reading offering the most profound insight.

  Under the **expressive reading**, a design is political if it symbolically encodes or communicates values. The original prescribing tool likely expressed values like efficiency, standardization, and trust in algorithmic decision-making by automating prescriptions. The new proposal expresses contrasting values: caution, human oversight, and distrust of unilateral automation. The waiting period symbolizes deliberation over speed, while the second approver signifies that clinical judgment cannot be fully automated. This reading is valid but superficial; it identifies the values "spoken" by the design but fails to explain how these values alter material power dynamics or social relations. Evidence here would include design language (e.g., "safeguard," "validation step") or institutional justifications emphasizing safety over speed.

  The **causal reading** focuses on how designs redistribute power. The original tool causally shifted power: it empowered administrators (via efficiency gains), algorithms (as primary decision-sites), and possibly insurers (through standardized care), while disempowering clinicians (reducing autonomy) and patients (obscuring decision logic). The new proposal aims to counter this by *causing* a rebalance: the waiting period delays automated actions, granting time for contestation, while the second approver redistributes power to human actors. Evidence might include metrics showing reduced override rates by junior staff or qualitative data on regained clinician confidence. However, this reading treats politics as an external outcome of the tool, not inherent to its structure. It risks implying that power is merely redirected, not reconstituted.

  The **constitutive reading** is most compelling. Here, designs do not merely express values or shift power but actively *create* the political relations themselves. The original tool constituted a political order by defining "appropriate prescribing" as algorithm-mediated, embedding authority in code and marginalizing human deliberation as inefficient. The new proposal *materializes contestation*: it constitutes a new political practice where prescriptions *must* undergo explicit human scrutiny, redefining "decision-making" as inherently collaborative. Crucially, it does not just expose the tool’s politics; it establishes a new arena for political negotiation. The waiting period institutionalizes doubt, and the second approver role formalizes shared authority, transforming clinician-algorithm relations from hierarchical to interdependent.  

  **Distinguishing constitutive effects** requires evidence showing the design *reconfigures the fundamental terms of engagement*:  
  1. **Role transformation**: Does the second approver become a *new political actor*? (e.g., job descriptions formally include "algorithmic validation," altering accountability).  
  2. **Irreversibility**: Does removing the step dissolve the newly constituted relation? (e.g., without it, clinicians lack standing to challenge the algorithm).  
  3. **Normative shift**: Does the design redefine what counts as a "valid" decision? (e.g., prescriptions lacking human validation are deemed illegitimate, even if algorithmically "correct").  

  In this case, the proposal’s constitutive nature is revealed by how it forces the invisible politics of automation into a structured human process. The committee’s deadlock exemplifies this: half see workflow, half see politics precisely because the proposal makes the tool’s constitution of authority unavoidable. Causal or expressive readings miss that the design doesn’t just respond to politics—it rebuilds the political landscape itself. By mandating delay and dialogue, the proposal constitutes a micro-democracy within the clinical workflow, where power is continually renegotiated. Thus, while expressive and causal readings apply, only the constitutive reading captures the depth of the intervention: it transforms the prescribing tool from a black-box authority into a site of ongoing political practice.

  ---

  ### Marking Scheme (Total: 25 marks)

  **First-Class Answer (21–25 marks)**  
  Must hit all core criteria:  
  1. **Clear distinction of all three readings** (5 marks).  
     *Avoids:* Conflating expressive/causal (e.g., "values cause power shifts" without separation) or treating readings as mutually exclusive.  
  2. **Precise application to the waiting-period proposal** (7 marks).  
     *Avoids:* Generic descriptions of readings; must tie each to hospital case specifics (e.g., causal = redistributing power from algorithm to clinicians).  
  3. **Argument for constitutive reading’s primacy** (6 marks).  
     *Avoids:* Assertion without justification; must explain *why* constitutive work transcends expression/causation (e.g., "creates new political actors/relations").  
  4. **Specific evidence for distinguishing constitutive effects** (5 marks).  
     *Avoids:* Vague examples (e.g., "changes attitudes"); requires concrete, testable evidence (e.g., role redefinition, irreversibility).  
  5. **Critical synthesis** (2 marks).  
     *E.g.,* Notes how committee disagreement reflects constitutive stakes.

  **Upper-Second (16–20 marks)**  
  Covers all readings but with weaknesses:  
  - Minor conflation of readings (e.g., expressive vs. causal).  
  - Correct application but less depth in case analysis.  
  - Identifies constitutive reading but doesn’t fully justify its primacy.  
  - Evidence proposed but not fully developed (e.g., lists role change without explaining *how* it constitutes politics).

  **Lower-Second (11–15 marks)**  
  Superficial or incomplete:  
  - Defines readings but doesn’t apply them rigorously to the proposal.  
  - Misses one reading entirely (usually constitutive).  
  - Treats readings as a checklist without synthesis.  
  - Evidence discussion generic or absent.

  **Third (6–10 marks)**  
  Significant gaps:  
  - Confuses readings (e.g., "expressive = causing change").  
  - Only 1–2 readings addressed.  
  - Case analysis minimal.  
  - Constitutive reading misidentified as "strongest causation."

  **Fail (0–5 marks)**  
  Fails to engage:  
  - Does not distinguish readings.  
  - Only recites "artifacts have politics" debate.  
  - No application to hospital case.  

  ---

  ### Why This Works  
  1. **Forces Analysis Over Recitation**: Students must *use* the readings—not just define them—to dissect the proposal.  
  2. **Sharpens Constitutive Reading**: By demanding evidence to distinguish it, the question pushes students beyond theoretical assertion.  
  3. **Mirrors Real-World Nuance**: The hospital case embodies how "neutral" tools mask politics until contested.  
  4. **Rewards Precision**: Marks are tied to discrete moves (distinction, application, evidence), not general eloquence.  

  This structure ensures students grapple with *how* politics materializes in design—precisely the insight your committee needs.
