          Node_source:
            Question: "Consider two coins. Coin A is a fair coin that you have tossed many times and it has always been fair. Coin B is a new coin that you are told by a trusted authority is fair, but you have no prior experience with it. You are to bet on heads. Are you indifferent between betting on Coin A and Coin B?"
