          Node_representation:
            Question: "In the three-color urn, consider the following acts:

               Act A: Bet on red. Pays $100 if red, $0 otherwise.
               Act B: Bet on black. Pays $100 if black, $0 otherwise.
               Act C: Bet on yellow. Pays $100 if yellow, $0 otherwise.

               Now, consider a fourth act:

               Act D: A fair coin flip between Act A and Act C. (That is, with 50% chance you bet on red, with 50% chance you bet on yellow.)

            How do you evaluate Act D compared to a direct bet on an event that has the same worst-case probability or the same best-case probability? Specifically, note that the worst-case probability for Act D is 0.5 * (min probability of red) + 0.5 * (min probability of yellow) = 0.5*(1/3) + 0.5*0 = 1/6.

            But also note that the event underlying Act D is 'red on the coin and then red in the urn, or yellow on the coin and then yellow in the urn'. The min probability of this event is not defined because the composition is unknown, but it can be as low as 0 (if the urn has no red and no yellow) or as high as 1 (if the urn has only red and yellow). 

            However, maxmin with multiple priors would evaluate Act D by the worst prior: which could be one with no red and no yellow, then Act D pays 0. 

            In contrast, a non-additive measure might assign a capacity that is convex, such as:

               v(red) = 1/3, v(yellow)=0, v(red or yellow)=2/3.

            Then the act D, which is a bet on {red if coin=heads, yellow if coin=tails}, is a mapping from states to outcomes. The states are (urn composition, coin outcome, ball drawn). This is complex.

