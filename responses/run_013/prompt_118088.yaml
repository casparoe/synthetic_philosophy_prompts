     Finally, point 6: the representation of uncertainty. This is hard to ask without leading. We can ask about the functional form through choices.

     One way is to ask about the three-color urn and see if they can be represented by a set of priors or by a non-additive measure.

     But we can design a choice that distinguishes maxmin from other models.

     Consider an urn with three colors: red, black, yellow, with 30 red and 60 black or yellow in unknown proportion. We know that the maxmin agent will assign:

          P(red) = 1/3, and then for any other event, they take the worst case.

          Act I: Bet on red -> min probability = 30/90 = 1/3.
          Act II: Bet on black -> min probability = 0, max = 60/90=2/3.
          Act III: Bet on red or yellow -> min probability = 30/90=1/3 (if black=60, yellow=0) to 90/90=1 (if yellow=60, black=0). The min is 1/3.
          Act IV: Bet on black or yellow -> min probability = 60/90=2/3.

          So they prefer I to II and IV to III.

     Now, add a fifth act:

          Act V: A bet that pays $100 if yellow, $0 otherwise.

          What is the min probability for yellow? It can be 0.

     Now consider a choice between:

          Act VI: A 50-50 lottery between Act I and Act V.

          How does a maxmin agent evaluate Act VI? They look at the worst prior. The prior that minimizes the expected payoff of VI is the one that makes I and V as bad as possible. I is fixed at 1/3, but V can be 0. So the worst prior for VI is one that sets yellow=0, then black=60, then:

               VI: 0.5 * (probability of red) + 0.5 * (probability of yellow) = 0.5*(1/3) + 0.5*0 = 1/6.

          But then compare to Act II (bet on black): its worst-case probability is 0.

          So they might prefer VI to II? 

     This is not the best probe.

     A standard probe is the trade-off between optimism and pessimism.

     Consider the famous example: the agent is offered a bet on an event with unknown probability. They are asked to state a price at which they are willing to buy and sell the bet. In maxmin, the buying price is based on the min probability and the selling price on the max probability, so there is a gap.

