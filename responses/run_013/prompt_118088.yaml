  **Explanation of Key Design Choices**:
  - **Root**: Starts with the shared commitment to resolve the Ellsberg pattern (retract or accommodate).
  - **Sure-Thing Principle**: Explicitly tested using the three-color violation, forcing positions to accept or reject it.
  - **Hedging Aversion**: Separated from unknown-odds aversion via the urn-specific hedging test (Acts P, Q, R).
  - **Source Relativity**: Probed using two identical 50-50 urns with different generation mechanisms.
  - **Objective vs. Undefined Probability**: Distinguished using the sealed-outcome vs. unminted-coin scenario.
  - **Representation**: Captured through self-description due to the difficulty of deriving it from a single choice; probes worst-case, averaging, penalty, and non-additivity.
  - **Leaves**: Cover all requested positions (e.g., retract EU, maxmin, nonadditive, adversarial) and include an unnamed option for unexplored representations.
  - **Empty Combinations**: Identified paths that are incoherent (keeping sure-thing without hedging aversion) or unattractive (source-dependent maxmin).
  - **Indistinguishable Pairs**: Highlighted models that coincide on classic choices but diverge under richer data (e.g., α-maxmin vs. maxmin with mixed acts).
