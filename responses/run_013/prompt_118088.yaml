          We have to ask about the representation. We will use a concrete choice that distinguishes them.

          Consider the three-color urn and the following acts:

             Act X: Bet on red or yellow. Pays $100 if not black.
             Act Y: Bet on black. Pays $100 if black.

          Note: Act X and Act Y are complementary.

          Now, we know that in the three-color case, people prefer Act IV (which is Act X) over Act III ( Act I is bet on red, Act III is bet on red or yellow -> which is Act X), and prefer Act II (bet on black) over Act I.

          But now, what if we ask for a price at which they are willing to sell Act X versus Act Y.

          In the maxmin model, the selling price for Act X (which is the certainty equivalent) is based on the worst-case probability for X. The worst-case probability for X (not black) is 30/90=1/3. For Act Y (black), the worst-case probability is 0. So they would value Act X more than Act Y.

