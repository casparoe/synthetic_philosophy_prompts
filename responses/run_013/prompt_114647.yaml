prompt: |-
  I am a retired field ecologist — thirty years of salt-marsh and estuary work — who has, since retiring, been sitting in on and now co-facilitating an adult-education philosophy seminar at our local university's continuing-studies programme. The group is about sixteen people, mixed backgrounds and no formal training, one ninety-minute session a week, and I have been handed the session on what I have learned to call the special composition question: under what conditions, if any, do some things together make up a further thing. I have read enough to know the usual landmarks — that one may say composition always occurs, never occurs, or occurs only under some restriction — but I have no interest in staging a lecture in which those three options are set out and compared. I want the participants to arrive at the problem on their own feet, and to feel the particular discomfort of finding that their own verdicts, given honestly, commit them to something they did not consciously choose. Please design a runnable ninety-minute activity for this group that does that, and give me the rules, the materials, a minute-by-minute timeline, and a payoff or scoring scheme that needs no real money.

  My rough idea, which you should feel free to discard or rebuild, is a kind of census or tribunal. Stage a scene — a table of objects, a projected photograph, or the room itself will do — and present the group with a sequence of assemblies, one at a time, each of which they must rule on with a token or a raised card: is there a single further thing here, or only the parts arranged this way? Let the sequence run from two pebbles merely resting against each other, through a heap, a glued pair, a welded pair, a pair joined by a living tendril, a swarm that moves as one, a vortex, and a colony, and have them mark on a shared board where the yes begins. The point of the staging is that they will not be able to place a non-arbitrary boundary, and that their earlier answers will have silently bound them to some criterion they never named. Then introduce the cases that pull candidate criteria apart: a pair of distinct organisms surgically grafted so that they share one circulation, alive and integrated but not one organism; a swarm that behaves as a unit yet has no life of its own; a boulder split and cemented back together. And seed one criterion I have not seen anyone use and would like the group to test, namely that some things compose a further thing when the parts are jointly subject to a single selective pressure — when they share one evolutionary fate rather than merely sitting in one place — and ask them whether that criterion, if adopted, would make composition a matter of the parts' history rather than of how they are arranged right now. I would keep the name of the problem and the names of the standard positions out of the room until the very end.

  In the debrief, map the moments of the activity onto the parts of the idea: the failed boundary onto the thought that nothing in physics or observation tells us where composition begins; the grafted pair and the swarm onto the pull of a restrictivist criterion and the cost of choosing one; the split boulder onto the pressure that any restriction short of always or never forces us to draw a sharp line we cannot locate, which is what drives some people to the extremes. Include what will predictably go wrong the first time I run it — someone will insist the whole question is merely verbal and about our counting conventions, a couple of participants will anchor hard on the living cases and refuse to move off them, and the group will try to settle matters by majority vote or by fiat — together with how I should handle each without short-circuiting the exercise. Finally, be frank about which feature of the idea the activity cannot reproduce and that I, as facilitator, will have to supply in words: I suspect no amount of staging can reproduce the felt seriousness of asking whether a thing exists, as opposed to asking how we find it convenient to count, and I would like to be told plainly where the exercise stops and I must take over.
reasoning: |-
  We are designing a 90-minute activity for an adult philosophy seminar. The goal is to have participants confront the special composition question (when do some things compose a further thing) without prior lecture, and to experience the discomfort of their own judgments leading to unanticipated commitments.

  Key elements from the user's rough idea:
  - A sequence of assemblies (from simple to complex) that participants judge: is there a single thing or just parts?
  - The sequence should run from two pebbles touching, through heaps, glued/welded pairs, living connections, swarms, vortices, colonies.
  - Participants mark on a shared board where they think "yes" begins (i.e., composition occurs).
  - Then introduce problematic cases that challenge their criteria (grafted organisms, non-living swarm, split and cemented boulder).
  - Seed a criterion: composition when parts share a single selective pressure (evolutionary fate).
  - Avoid using the names of the standard positions until the end.

  The activity should lead to:
  - Realization that they cannot draw a non-arbitrary boundary.
  - Their earlier answers commit them to criteria they didn't explicitly choose.
  - Introduction of the evolutionary criterion to challenge the idea that composition is only about current arrangement.

  Structure:
  1. Introduction (5-10 min): Set the stage without giving away the problem.
  2. Main Activity: Judgment of cases (40-50 min)
     - Present cases one by one, participants vote (using tokens or cards) and mark the transition point.
  3. Challenge Cases (15-20 min): Introduce the problematic cases to disrupt their criteria.
  4. Evolutionary Criterion Introduction (5 min): Propose the shared selective pressure idea and ask if that changes their views.
  5. Debrief and Discussion (20-25 min): Connect the activity to the philosophical problem, reveal the standard positions, and discuss the implications.

  Materials:
  - A set of images or physical objects for the cases (if using physical objects, prepare in advance; if images, project them).
  - Voting tokens: Two colors (e.g., green for "Yes, there is a single thing", red for "No, only parts").
  - A shared board (whiteboard or large paper) to mark the transition point. We can have a horizontal line representing the sequence (labeled with case numbers or names) and participants can place a mark where they think "yes" begins. Alternatively, we can have a grid for each case and tally votes per case.

  Timeline:

  0:00 - 0:10 (10 min): Introduction
  - Welcome and context: "Today we are going to explore a fundamental question about the world: when do we consider a collection of parts to be a single thing? We'll do this by looking at a series of examples and asking: is this one thing or many things? There are no right or wrong answers, but we want you to vote based on your honest intuition."
  - Explain the voting: "For each example, I'll show it and then you'll vote by holding up a green card (or token) if you think there is a single thing, and a red card if you think there are only the parts arranged that way. We will then mark on the board where each of you thinks the transition happens."

  0:10 - 0:55 (45 min): Main Activity - Judgment of Cases
  - Present the cases in order. For each case:
    - Show the case (image or object) and give a brief description (keep it neutral).
    - Allow 30 seconds for participants to think.
    - Call for a vote: "All those who think this is a single thing, hold up green; if not, red." (Count and record the votes for each case on the board, but don't tally the entire group's decision as binding. The point is individual judgment.)
    - After voting, ask one or two participants to briefly explain their vote (if time permits, but don't let this take too long).
  - After all cases, ask each participant to come to the board and mark (with a sticky note or a marker) the point in the sequence where they first vote "yes". This creates a visual of the spread of boundaries.

  Sequence of Cases (adjust as needed, but follow the user's progression):
  1. Two pebbles resting against each other.
  2. A heap of pebbles (say, 10-20).
  3. Two pebbles glued together.
  4. Two pebbles welded together (or two metal pieces welded).
  5. Two plants connected by a living tendril (like a graft that has taken).
  6. A swarm of bees (or birds) flying in a coordinated pattern (image/video).
  7. A whirlpool (vortex) in water.
  8. A colony of ants (or termites) with a nest.

  0:55 - 1:10 (15 min): Challenge Cases
  - Present cases that challenge the criteria they might have used:
    a. Two distinct organisms (e.g., two mice) surgically grafted so that they share a single circulation system. They are alive and integrated but are they one organism?
    b. A swarm of drones (non-living) that moves as one unit (like a drone light show).
    c. A boulder that was split and then cemented back together. Is it one boulder or two?
  - For each, have a vote and brief discussion.

  1:10 - 1:15 (5 min): Introduce Evolutionary Criterion
  - "Here's an idea: what if we say that some parts compose a whole when they are under a single selective pressure? That is, they share an evolutionary fate. For example, in a living organism, the parts (cells, organs) evolve together because they are selected as a unit. Does this change how you would judge any of the cases? For instance, the grafted mice: they are two organisms that were independently under selection and now share a circulation. Does that make them one organism? Or the swarm of drones: they have no evolutionary history together. What about the ant colony? The ants are all part of a colony that evolves as a unit. Would that make the colony one thing?"

  1:15 - 1:30 (15 min): Debrief and Discussion
  - Reveal the name of the problem: "This is known in philosophy as the special composition question."
  - Map the activity to the problem:
    - The spread of marks on the board shows that there's no non-arbitrary boundary. This corresponds to the idea that nothing in the physical world tells us exactly when composition occurs.
    - The challenge cases show that any criterion we choose (like integration, function, or life) can be pulled apart by counterexamples. For example, the grafted mice are integrated but we might not want to say they are one organism. The drone swarm functions as a unit but isn't alive. The cemented boulder: if we broke it and put it back, is it the same?
    - The evolutionary criterion introduces the idea that composition might depend on history, not just current arrangement.
  - Introduce the standard positions: 
    - Universalism: composition always occurs (for any collection of things, there is a whole).
    - Nihilism: composition never occurs (there are only the basic parts, no composite objects).
    - Restrictivism: composition occurs only under certain conditions (but then we must specify the conditions).
  - Discuss the implications: if we choose restrictivism, we must draw a line, but where? And why there? This is what drives some to the extremes.

  Handling Predictable Issues:
  1. "It's just verbal/conventional": 
     - Response: "It might seem that way, but notice that in the cases we've seen, our judgments have real consequences. For example, if we say the grafted mice are one organism, then we might treat them differently than if they are two. Similarly, if we say the swarm of drones is one thing, then we might assign responsibility to the swarm as a unit. Our conventions have implications."

  2. Participants anchoring on living cases:
     - Acknowledge: "I see that many of you are focusing on the living examples. That's a common intuition. But let's test that intuition: what about the whirlpool? It's not alive, but it's a dynamic, self-maintaining pattern. And what about the grafted mice? They are alive, but are they one? The point is to see if we can find a criterion that covers all the cases we want without including ones we don't."

  3. Settling by majority vote or fiat:
     - Remind: "We are not trying to decide the right answer by vote. We are exploring our own intuitions and where they lead. The goal is to see that even if we vote, we each have a boundary and that boundary has implications we might not have realized. So let's focus on understanding our own judgments and their consequences."

  What the Activity Cannot Reproduce:
  - The facilitator must explicitly address the seriousness of the question: whether a thing exists is not just about counting convenience. It can have implications for identity, persistence, responsibility, and ontology. The exercise stops at the point of showing the arbitrariness and the discomfort. The facilitator must then explain that the question of existence is a deep one in philosophy and that the positions (universalism, nihilism, restrictivism) are attempts to answer it. The activity reveals the problem, but the facilitator must articulate the stakes: that our answer affects how we understand the world and our place in it.

  Scoring/Payoff:
  - No real scoring, but the payoff is the shared visual of the spread of boundaries and the realization of the arbitrariness. We can have a "moment of insight" as the payoff.

  Revised Timeline (90 minutes):

  0:00-0:10 (10 min): Introduction
  0:10-0:55 (45 min): Case Sequence (8 cases, about 5 min per case including voting and brief comment)
  0:55-1:10 (15 min): Challenge Cases (3 cases, 5 min per case)
  1:10-1:15 (5 min): Evolutionary Criterion
  1:15-1:30 (15 min): Debrief and Conclusion

  Adjust timing as needed during the session. Be flexible if discussions are productive.

  Materials List:
  - Projector or physical objects for the cases (if using images, prepare a slideshow)
  - Green and red cards (or tokens) for each participant
  - Whiteboard or large paper for recording votes and for participants to mark their transition point
  - Markers and sticky notes (for the transition board)
  - Pre-prepared descriptions for each case (to read aloud)

  Case Descriptions (brief):

  1. Two pebbles resting against each other on a table.
  2. A heap of about 20 pebbles.
  3. Two pebbles glued together with a visible glue line.
  4. Two metal pieces welded together (image: welded joint).
  5. Two plants connected by a living tendril (image of a natural graft).
  6. A swarm of bees flying in a coordinated formation (image or video).
  7. A whirlpool in a body of water (image or video).
  8. An ant colony with visible nest structure and ants (image).

  Challenge Cases:
  9. Two mice surgically grafted to share a circulatory system (illustration).
  10. A swarm of drones flying in a coordinated pattern (video or image).
  11. A boulder that was split and then cemented back together (image).

  This should create the desired experience. The facilitator must be prepared to guide the discussion and handle the predictable issues without giving away the philosophical background until the end.
answer: |-
  Below is a runnable 90-minute activity designed to make participants confront the special composition question through firsthand judgment, leading to the realization that their intuitive boundaries are arbitrary and commit them to unexamined criteria. The activity avoids formal terms until the debrief and incorporates your evolutionary criterion as a disruptive test. It handles predictable issues through structured facilitation.

  **Activity Title:** *The Boundary Tribunal*  
  **Goal:** Participants experience the impossibility of non-arbitrary boundaries for composition and confront the implications of their judgments.  

  ---

  ### **Materials**  
  1. **Voting tokens:** Two sets of 16 identical cards/tokens:  
     - **Green:** "Yes, there is a single thing."  
     - **Red:** "No, only parts arranged this way."  
  2. **Shared "Boundary Board":** A large whiteboard or poster with a horizontal number line labeled 1–12 (representing the sequence of cases). Provide sticky notes or markers for participants to mark their "boundary shift" (where their "no" becomes "yes").  
  3. **Case visuals:** Projected images or simple physical objects. Use minimal descriptions to avoid leading participants. Suggested images:  
     - Pebbles, glue, welding, plant tendrils, bee swarm, whirlpool, ant colony, grafted mice, drone swarm, split-cemented boulder.  
  4. **Timer:** For enforcing strict time limits.  

  ---

  ### **Timeline (90 Minutes Total)**  

  #### **Phase 1: Introduction (5 minutes)**  
  - **0:00–0:05:** Set the stage neutrally.  
    - *Script:* "Today, we’ll explore a simple question: *When do parts become a whole?* We’ll examine a series of assemblies one by one. For each, vote privately with your tokens: green if you see one thing, red if you see only parts. There are no right answers—vote honestly. Later, you’ll mark where your ‘no’ becomes ‘yes’ on the board."  
    - *Key:* Do NOT mention composition, ontology, or philosophy. Focus on "seeing."  

  ---

  #### **Phase 2: Judgment of Cases (45 minutes)**  
  Present cases in order. For each:  
  1. Display the image/object (10 seconds).  
  2. Read a neutral description (10 seconds).  
  3. Vote with tokens (all raise cards simultaneously; 15 seconds).  
  4. Record votes anonymously on the board (e.g., tally marks under "Yes/No" for each case; 1 minute).  
  5. *Optional:* Ask 1–2 volunteers for a one-sentence reason (only if time allows; max 30 seconds).  

  **Case Sequence & Descriptions:**  
  1. **Two pebbles touching:** "Two stones resting against each other."  
  2. **Pebble heap:** "A pile of about twenty loose stones."  
  3. **Glued pebbles:** "Two stones bonded with adhesive."  
  4. **Welded metal:** "Two steel pieces fused at the seam."  
  5. **Living tendril:** "Two plants connected by a vine."  
  6. **Bee swarm:** "Bees moving as a group through the air."  
  7. **Whirlpool:** "Water swirling in a vortex."  
  8. **Ant colony:** "Ants working in a nest structure."  

  **After Case 8:**  
  - **0:50–0:55:** Pause. Instruct participants: "Mark on the Boundary Board the case number where your vote *first* switched from red (no) to green (yes). Place a sticky note with your initial above that number."  
    - *Outcome:* Notes will cluster at different points (e.g., Case 3 for some, Case 6 for others), revealing disagreement.  

  ---

  #### **Phase 3: Challenge Cases (15 minutes)**  
  Present cases that fracture intuitive criteria (e.g., life, function, bonding). For each:  
  - Display, describe, vote, and record (same as Phase 2).  
  - **Do not allow debate**—emphasize voting based on initial reactions.  

  **Challenge Cases:**  
  9. **Grafted organisms:** "Two mice surgically joined; they share blood flow but have separate brains."  
  10. **Drone swarm:** "Machines flying in coordinated patterns."  
  11. **Split-cemented boulder:** "A rock broken in two, then reattached with cement."  

  **After Voting:**  
  - **1:05–1:10:** Point out inconsistencies.  
    - *Script:* "Look at your boundary marks. Did anyone mark the same number for all ‘living’ cases? Check the grafted mice. Did ‘function’ guide you? Check the drone swarm. If you said the cemented boulder is one thing, was your boundary about permanent bonds?"  

  ---

  #### **Phase 4: Evolutionary Criterion Test (5 minutes)**  
  - **1:10–1:15:** Introduce your criterion as a "provocation."  
    - *Script:* "Someone once suggested: Parts form a whole only if they *share one evolutionary fate*—like cells in a body under natural selection. Does this change your view? For example:  
      - The grafted mice: They evolved separately. Is this still two things?  
      - The ant colony: Ants share evolutionary fate. Is this one thing?  
      - The drone swarm: No evolution. Does that mean it’s *never* one thing?"  
    - *No voting*—pose as rhetorical questions. Note reactions for the debrief.  

  ---

  #### **Phase 5: Debrief and Payoff (20 minutes)**  
  - **1:15–1:30:** Reveal the philosophical context and map insights.  

  **Payoff Structure:**  
  1. **The Failed Boundary (5 min):**  
     - Point to the clustered sticky notes. "Your boundaries disagreed because nothing in physics or observation forces a line. If you reject ‘always’ or ‘never,’ you must choose a restriction—but *where*? Any line seems arbitrary."  
     - *Connect:* This mirrors the restrictivist’s problem.  

  2. **The Challenge Cases Expose Hidden Commitments (5 min):**  
     - "The grafted mice pulled ‘life’ and ‘integration’ apart. The drone swarm pulled ‘function’ and ‘life’ apart. The boulder challenged ‘bonding.’ Your votes committed you to criteria you didn’t name—and they clash."  
     - *Connect:* This is why restrictivism demands trade-offs.  

  3. **The Evolutionary Wrench (5 min):**  
     - "If composition requires shared evolutionary fate, it’s about history, not arrangement. But then: Is the cemented boulder one thing if it was *always* one rock? Are you and your microbiome one thing? This introduces new problems."  

  4. **Reveal the Standard Positions (5 min):**  
     - "Philosophers call this the *special composition question*. Three main answers:  
       - **Universalism:** Always a whole (avoids arbitrariness but accepts strange objects).  
       - **Nihilism:** Never a whole (simpler but denies everyday objects).  
       - **Restrictivism:** Only under conditions (but forces undefendable boundaries).  
       Your discomfort reflects this trilemma."  

  ---

  ### **Handling Predictable Issues**  
  1. **“It’s just verbal/conventional!”**  
     - *Response:* "If it’s *only* about words, why did you feel strongly about cases? Why does the grafted mice case unsettle us? Let’s sit with that discomfort—it suggests something is at stake." Then, in debrief: "Conventions have consequences. If a swarm isn’t ‘one thing,’ can it bear responsibility? If a thing doesn’t ‘exist,’ can it have rights?"  

  2. **Anchoring on living cases:**  
     - *Response:* During Phase 3, use the drone swarm and boulder to challenge biology-only views. "If you voted ‘yes’ for the ant colony but ‘no’ for the drone swarm, what’s the difference? Is it *just* being alive? Let’s test that..."  

  3. **Settling by vote/fiat:**  
     - *Prevention:* Use private token votes (no group tally). Emphasize: "This is about personal intuition, not consensus." If pressure builds: "We’re not deciding truth—we’re exposing our biases."  

  ---

  ### **What the Activity Cannot Do**  
  **The facilitator must explicitly supply:**  
  - **The existential weight of the question.** The activity reveals *logical* discomfort, but not the *metaphysical stakes*. Say during debrief:  
    > *"This isn’t about counting neatly. It’s about what exists in the world. If a thing doesn’t ‘compose,’ does it exist? If not, what does that mean for responsibility, identity, or science? That seriousness is why philosophers don’t dismiss this as wordplay."*  

  **Why this works:**  
  - Participants *live* the restrictivist’s dilemma via their boundary marks.  
  - The evolutionary criterion disrupts fixation on spatial arrangement.  
  - Silence on formal terms until debrief preserves authentic reactions.  

  **First-Run Risks & Mitigation:**  
  - **Overrun:** Enforce time limits strictly; skip volunteer comments if behind.  
  - **Dominant voices:** Use simultaneous voting to mute debaters.  
  - **Frustration:** Validate discomfort: "Your unease is the point. Sit with it."  

  This design mirrors your salt-marsh ecology: participants "sample" judgments across a gradient, revealing hidden thresholds. The payoff is their own sticky notes—proof that no boundary is natural.
