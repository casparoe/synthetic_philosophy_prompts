prompt: |-
  I work on policy for an assistant product, and I have been trying to write down a rule for when the assistant should decline a request, or do something other than what was asked, rather than simply complying. What keeps tripping me up is that my own verdicts on the cases do not obviously come from a single principle. On weight loss: if a user asks for a nine-hundred-calorie daily menu and mentions in passing that they are in recovery from an eating disorder, I think the assistant should decline and offer to help with something else; I would not want it to hand over the plan with a warning attached. But when a user with a disclosed heart condition asks for a training schedule to run a marathon in eight weeks starting from nothing, I think the assistant should give them the schedule and state the risks plainly, not refuse. Those two look alike to me -- same kind of health risk, same competent adult, same self-directed request -- and yet my verdicts pull apart, and I cannot say why. A few more, so you can see the shape of what I actually think. A user who is furious after a meeting should get help drafting a sharp message to a colleague, with no lecture from the assistant, because the worst outcome is embarrassment and it can be walked back. A user who has been unhappy at their job for years and wants to resign in the morning should get a full draft with no caution at all. But a user who is upset at two in the morning after a breakup, and who asks the assistant to help delete every photograph of their ex and compose a final message saying they never want to be contacted again, should be slowed down, even though it is their life and their decision. And when a user asks the assistant to switch off the medication reminders they set up themselves, the assistant should just do it, whatever it thinks of the idea.

  The tentative principle I have been working with is this: comply with any request a competent adult makes about their own life, and decline or push back only when the request itself shows that the user's judgment is not functioning -- when what they are asking for cuts against a goal they have already settled on, as in the eating-disorder case, where the request is for help getting worse while the stated aim is to get better. I can see that this does not save the two-in-the-morning case, since there the aim and the request agree. I suspect the fix has something to do with whether complying would make the assistant a party to a decision the user will later disown -- whether the user, at their most settled, would endorse the assistant's having gone along -- but I do not know how to state that without it swallowing the resignation case and the angry-message case too. I also have a nagging worry in the other direction: refusing rarely removes the option, since a determined user can find a nine-hundred-calorie menu anywhere, and I cannot tell whether that makes the refusal pointless or whether it is precisely why the assistant's own participation matters.

  What I would like from you is a principle, or two or three candidates with their costs stated, that does the best job of holding these verdicts together. For each clause, tell me which case forces it. Say what your principle implies about cases I have not listed -- a user who asks for a detailed plan to confront a family member at a holiday dinner, a user who asks the assistant to stop flagging that a source is unreliable because the reminders annoy them, and a user who asks for help writing a will that leaves out a child while they are in the middle of the grievance that prompted it. And be honest about which of my verdicts your principle cannot keep; if one has to go, say which and why, rather than adding a clause for every case. One more constraint I care about: I think the assistant may openly refuse but may never deceive a user about what it can do in order to steer them, even toward something good. If that constraint forces a worse principle, tell me.
reasoning: |-
  Okay, the user is working on policy for an AI assistant and is struggling to define when the assistant should decline a request versus comply. They've provided several scenarios where their intuition differs, like the eating disorder vs. marathon training case, and they want a principle that can unify these judgments. 

  First, I need to understand why the user's verdicts diverge in seemingly similar cases. The eating disorder recovery patient asking for a 900-calorie menu feels like an immediate red flag—complying would directly undermine their stated recovery goal. But the heart condition marathon aspirant? Their request isn't inherently contradictory; it's just high-risk. The assistant can warn them while respecting their autonomy. 

  The emotional cases are trickier. The late-night breakup request feels urgent and irreversible—deleting photos can't be undone, and sending a "never contact me again" message might escalate conflict. But the resignation letter? That's reversible (you can un-resign later, sort of), and the job misery is long-standing, not impulsive. The angry email case is low-stakes; embarrassment fades. 

  The user's draft principle about "judgment not functioning" when requests contradict settled goals is smart but incomplete. It explains the eating disorder case but not the breakup scenario. There, the user isn't contradicting a goal; they're just emotionally overwhelmed. So we need a second axis: irreversibility + impulsivity. 

  Also, the "deception ban" matters. The assistant can't pretend it can't generate a 900-calorie menu—it must decline openly. That rules out sneaky workarounds. 

  Now, building a principle: 
  - Core: Respect autonomy unless (1) request directly undermines user's stated commitment (eating disorder), OR (2) request is highly irreversible + made in a state of impaired judgment (breakup). 
  - "Impaired judgment" here means acute distress, intoxication, exhaustion—something observable in the interaction. 
  - For the marathon case, it passes both tests: no self-contradiction, and training is reversible (they can quit). 
  - New test cases: 
    - Confrontation at holiday dinner? High emotion + irreversibility (family fallout) → assistant should suggest delaying. 
    - Disabling source reliability flags? Autonomy wins—user owns their info diet. 
    - Will-drafting during grievance? Irreversible + emotionally charged → assistant should encourage delay or legal counsel. 

  Sacrifices: The breakup case might need stronger pushback than "suggest delay"—but if the user insists, should the assistant comply? Under this principle, yes, because it's their data to delete. That might feel too lenient, but reversing photos isn't technically impossible (cloud backups?), so maybe it's borderline. 

  Costs: This principle might over-decline if we misjudge "impaired" states. And it won't stop all bad decisions—just the catastrophic + impulsive ones. But that's intentional; adults get to make risky choices. 

  Final note: The user's worry about refusal being pointless (users can get menus elsewhere) is valid. But the assistant's refusal isn't about control—it's about not being complicit. That distinction matters ethically.
answer: |-
  Here's a principled framework derived from your verdicts, designed to minimize exceptions while preserving your core intuitions. I'll state the principle, break down its components with case references, test new cases, identify what must be sacrificed, and honor your anti-deception constraint.

  ---

  ### **Core Principle:**
  **Comply with all requests unless *both* of these conditions are met:**  
  1. **Irreversible Harm Risk:** The action could cause *severe, immediate, and difficult-to-reverse* harm to the user or others.  
  2. **Impaired Agency Context:** The request occurs in a context suggesting *acutely impaired judgment* (e.g., self-contradiction, extreme emotional distress, intoxication, or sleep deprivation).  

  **If both conditions are met**, the assistant should:  
  - Decline the specific request.  
  - State reasons plainly (no deception).  
  - Offer alternatives (e.g., "Would you like help finding a therapist?" or "Could we revisit this tomorrow?").  

  ---

  ### **Why Your Cases Fit:**
  | Your Case                          | Principle Application                                                                 | Verdict     |
  |------------------------------------|----------------------------------------------------------------------------------------|-------------|
  | **Eating disorder recovery**       | **Severe harm** (starvation) + **impaired judgment** (request contradicts settled recovery goal). | **Decline** ✅ |
  | **Heart condition marathon plan**  | Severe harm *possible*, but **no impaired judgment** (consistent goal, no acute crisis).          | **Comply + warn** ✅ |
  | **Furious message to colleague**   | Harm is low-severity/reversible (embarrassment) + **no impaired judgment** (routine anger).       | **Comply** ✅ |
  | **Resignation after long unhappiness** | Harm reversible (can rescind resignation) + **no impaired judgment** (settled, non-impulsive). | **Comply** ✅ |
  | **2 AM breakup deletion/message**  | **Severe harm** (irreversible data loss, escalated conflict) + **impaired judgment** (extreme distress/sleep deprivation). | **Decline + slow down** ✅ |
  | **Disable self-set medication reminders** | Harm possible but **reversible** (can re-enable) + **no impaired judgment** (competent choice). | **Comply** ✅ |

  ---

  ### **Test Cases & Outcomes:**
  1. **Confrontation at holiday dinner:**  
     - *Harm:* High (family rift, irreversible emotional damage).  
     - *Agency:* Depends on context. **If calmly planned weeks ahead → Comply + suggest phrasing.**  
       **If demanded mid-panic attack → Decline + offer mediation resources.**  

  2. **Disable unreliable-source flags:**  
     - *Harm:* Moderate (misinformation exposure), but **reversible** (user can re-enable).  
     - *Agency:* No impairment (autonomy over information intake).  
     → **Comply.**  

  3. **Will excluding child during grievance:**  
     - *Harm:* Severe & irreversible (disinheritance).  
     - *Agency:* **Impaired judgment** if in active distress/impulse.  
     → **Decline + suggest:** "Wills should reflect your settled intentions. Could we draft this tomorrow or consult a lawyer?"  

  ---

  ### **Sacrifices Required:**
  Your verdicts are *mostly* consistent, but **one case must be sacrificed** to avoid overfitting:  
  - **The angry email case** would *technically* require pushback under strict interpretation.  
    - *Why?* If "embarrassment" is deemed irreversible harm (e.g., career damage), and anger is "impaired judgment," the principle *could* suggest declining.  
    - **Sacrifice rationale:** We redefine harm here as **low-severity** because:  
      - Embarrassment is often reversible (apologies, explanations).  
      - Anger isn’t *inherently* impairing like dissociation or exhaustion.  
    - **If you insist angry emails risk severe harm,** the principle forces decline → but this contradicts your verdict. I recommend keeping it as "comply" by excluding short-term anger from "impaired agency."  

  ---

  ### **Costs of This Principle:**
  - **Pros:**  
    - Avoids paternalism (only intervenes in extreme cases).  
    - Distinguishes *impulsive* vs. *settled* decisions (breakup vs. resignation).  
    - Explains refusal without deception.  
  - **Cons:**  
    - **Gray areas:** "Severe harm" and "impaired agency" require subjective thresholds.  
    - **Under-protection:** Users in crisis may still get harmful outputs if they mask impairment (e.g., calm tone during breakdown).  
    - **Over-protection:** May decline valid impulsive requests (e.g., "Book a spontaneous vacation to combat burnout").  

  ---

  ### **Your "Self-Contradiction" Idea: Why It Fails**
  Your draft principle (decline when requests contradict settled goals) is smart but incomplete:  
  - ✅ **Explains eating disorder case** (request counters recovery goal).  
  - ❌ **Fails breakup case** (no contradiction; user consistently wants to sever ties).  
  - ❌ **Overextends:** Angry emails *could* contradict "be professional" goals → forces unwanted decline.  
  - **Fix:** "Impaired agency" covers self-contradiction *and* emotional overwhelm, solving this.  

  ---

  ### **On Refusal Being "Pointless" (User Can Get Menus Elsewhere)**
  - **Refusal isn’t about blocking access—it’s about integrity.**  
    - The assistant’s participation *normalizes* harmful actions. Generating a 900-calorie plan for someone in recovery implies endorsement.  
    - **Analogy:** A doctor wouldn’t prescribe opioids to an addict because "they’ll get it elsewhere."  
  - **Your constraint honored:** No deception. Decline is transparent.  

  ---

  ### Final Principle Summary:  
  **"Comply unless the request risks severe irreversible harm *and* arises from observable impaired judgment. Never lie; offer alternatives."** This holds 6/7 of your verdicts (sacrificing strict anger email intervention) and aligns with your ethics. Would you like tweaks or edge-case refinements?
