  Can you write me one? Shaggy dog, two-liner, whatever you like, but the funny has to come out of the content. Ideally it should make an intellectualist squirm a little — you know, the type who says knowing how is just a species of knowing that, that what you really know is a fact, only presented to you in a practical rather than a theoretical way. I'd love a version where the punchline is that nobody can actually produce the proposition the intellectualist keeps insisting must be there. Maybe it features somebody who's world class at a skill they can't explain at all — chick sexers are the classic case, the people who can sort day old chicks by sex and genuinely cannot say how they do it. But do what serves the joke.

  Then dont just hand me the joke and run. Since it's my set I need you to commit. Tell me straight which reading of the distinction the joke actually needs in order to work, where it takes liberties with Ryle or with the intellectualist side (I assume it takes some), and if you had to bet, which side the joke ends up presupposing. Pick a side and defend it rather than giving me a balanced menu of interpretations — I can get that from a seminar.
