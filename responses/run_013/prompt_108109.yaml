  Okay, the user is on a hiring/promotions committee facing a frustrating voting paradox where sub-question victories don't translate to the final decision. They want a specification for a collective judgment system, framed like a technical spec, avoiding theory names and focusing on core requirements. 

  First, I need to unpack their real pain points: they're stuck in endless committee debates about tallying methods, suspecting deeper theoretical issues. Their econ friend mentioned judgment aggregation vs preference aggregation – that's the key framing. The user is practically minded (wants to code a solution) but needs the conceptual groundwork first. 

  The spec must cover: 
  - Basic coherence (no contradictory outcomes like their current "win sub-questions but lose promotion" problem)
  - Distinctions between judging facts vs preferences, premises vs conclusions
  - Handling expertise imbalances and strategic voting
  - Avoiding agenda manipulation
  - Clarifying whether the group has a "real" position or just a tally

  Non-negotiables jump out: avoiding logical contradictions (like their current paradox) is absolutely essential – otherwise the system is broken. Distinguishing judgment from preference aggregation is also core; conflating them would misrepresent what committees are doing. 

  Major trade-offs emerge:
  - If they demand all requirements simultaneously, Arrow-like impossibility arises. Sacrificing completeness (allowing "no decision" outcomes) avoids worst paradoxes but might frustrate committees needing yes/no answers. 
  - Weighting by expertise conflicts with anonymity – they must choose between respecting unequal knowledge or equal voting power. 
  - Preventing strategic voting inevitably requires complexity (e.g., preference elicitation) that may overwhelm users. 

  The user's subtle need: they want ammunition to settle committee disputes by showing which requirements are incompatible. Highlighting the "logical coherence vs completeness" trade-off will resonate most – it directly explains their current dilemma.
answer: |-
  Here's a spec for a theory of collective judgment formation, structured as requested: core requirements, critical distinctions, practical constraints, and key trade-offs. Non-negotiables are marked **(N)**; others are desirable but context-dependent.

  ---

  ### I. Core Requirements: What It Must Deliver

  1.  **Logical Coherence (Avoiding Contradictions): (N)**
      *   **What:** The group's final set of judgments (on premises *and* conclusion) must be logically consistent. *If* premises A & B logically entail conclusion C, the group cannot simultaneously affirm A & B but reject C (or vice-versa in non-monotonic cases). This directly addresses your committee's "backwards tallies" problem.
      *   **Why:** Without this, collective "judgment" is irrational and undermines the purpose of deliberation based on reasons. It's the core failure mode you observe.
      *   **Cases:** Your committee mess (A=Good Research, B=Good Teaching, C=Promote); Jury deciding guilt (A=Motive, B=Opportunity, C=Guilty).

  2.  **Completeness (Reaching a Decision): (N)**
      *   **What:** For any well-posed question on the agenda, the procedure must output a determinate group judgment (e.g., Yes/No/Abstain) or a clear signal of indecision/ill-posedness.
      *   **Why:** Committees exist to make decisions. Perpetual indecision isn't viable. However, "Abstain" or "Undecided" are valid outputs in specific contexts.
      *   **Cases:** Your committee needs a Promote/Not Promote result; A jury must reach a verdict (even if "not guilty" is the default); A panel *can* conclude "evidence insufficient".

  3.  **Decisiveness on Key Questions:**
      *   **What:** The procedure must be able to reach conclusions on the primary question(s), even if subsidiary judgments are incomplete or inconsistent internally (though not with the conclusion).
      *   **Why:** Committees often *need* a bottom-line decision (Promote? Guilty?) even if disagreements persist on *why*. Subsidiary questions serve the primary one.
      *   **Cases:** Your committee *must* decide on promotion; A jury *must* decide guilt/innocence.

  ---

  ### II. Critical Distinctions: What It Must *Not* Collapse

  4.  **Judgment vs. Preference Aggregation: (N)**
      *   **What:** Must treat judgments about what is *true* or *correct* (e.g., "Is their research excellent?") as fundamentally different from expressions of preference or welfare (e.g., "Do I like them?"). Aggregation methods suitable for preferences (e.g., Condorcet winners) can yield irrational judgments when applied to truth-tracking questions.
      *   **Why:** Conflating them leads directly to the "backwards tallies" paradox. Preferences can be cyclic; truth-apt judgments should strive for consistency. Your committee's task is judgment, not preference ranking candidates.
      *   **Cases:** Your committee mess (judging facts about performance); Jury (judging facts about guilt); vs. Choosing a cafeteria menu (preference aggregation).

  5.  **Premises vs. Conclusion: (N)**
      *   **What:** Must recognize the logical relationship between subsidiary judgments (premises, sub-questions) and the final judgment (conclusion). The procedure shouldn't treat "Good Research" and "Promote" as independent, disconnected votes.
      *   **Why:** Ignoring this logical structure is the root cause of your inconsistency problem. The conclusion *depends* on the premises.
      *   **Cases:** Your committee mess; Jury (Motive/Opportunity entail Guilt).

  6.  **Group View vs. Tally Report:**
      *   **What:** Should ideally produce a coherent group *position* that can be rationally defended, not merely a report of how many individuals hold each view on isolated questions. The whole should be more than the sum of incoherent parts.
      *   **Why:** For legitimacy and effective action, the group needs to stand behind a reasoned stance, not just a numerical tally.
      *   **Cases:** A panel of experts should ideally converge on a shared understanding; Your committee needs a rationale for its promotion decision.

  7.  **Equal Weight vs. Competence Weighting:**
      *   **What:** Must allow for the possibility of weighting inputs by assessed competence/expertise/reliability, *not* mandating strict equality as the only fair option.
      *   **Why:** In many judgment tasks (especially expertise-driven ones like your committee or a scientific panel), some members demonstrably know more. Ignoring this sacrifices accuracy for a specific notion of procedural fairness.
      *   **Cases:** Your committee (recognized experts); Panel of experts on a technical issue.

  ---

  ### III. Practical Constraints: What It Must Handle/Resist

  8.  **Robustness to Strategic Voting (Limited Vulnerability):**
      *   **What:** Should be difficult for an individual to manipulate the outcome by misrepresenting their true judgments (voting strategically) without significant risk or complexity. Doesn't need perfect strategy-proofness (often impossible), but shouldn't be trivially gameable.
      *   **Why:** You suspect strategic voting ("one guy"). Trivially gameable systems invite distrust and undermine the process.
      *   **Cases:** Your committee; Any voting body with known factions.

  9.  **Agenda Independence: (N)**
      *   **What:** The group's judgment on a specific proposition (especially the conclusion) should not change solely because logically unrelated propositions are added to or removed from the voting agenda.
      *   **Why:** Avoids manipulation of outcomes by controlling the order or breadth of questions. Ensures core judgments are stable. *Path-dependence* (order of related questions) might be unavoidable, but *irrelevant* items shouldn't flip results.
      *   **Cases:** Adding a vote on "Is the sky blue?" shouldn't change the promotion outcome.

  10. **Graceful Degradation (Handling Indecision/Ill-Posedness):**
      *   **What:** Must provide a clear mechanism for the group to abstain, declare a question ill-posed, or output "undecided" when evidence is truly conflicting, ambiguous, or insufficient, or when logical coherence forces incompleteness.
      *   **Why:** Forcing a binary choice on insufficient grounds is as bad as indecision. Reality is sometimes ambiguous.
      *   **Cases:** Jury hung due to conflicting evidence; Committee genuinely split on ambiguous performance evidence; Panel confronted with an incoherent question.

  11. **Computational & Cognitive Tractability:**
      *   **What:** The inputs required from members and the procedure itself must be feasible for humans to understand and execute within reasonable time/complexity limits for the decision context. Avoids requiring members to solve NP-hard problems on the fly.
      *   **Why:** A theoretically perfect system is useless if the committee can't understand or implement it. Your goal is a codable tool.
      *   **Cases:** Your committee needs a practical voting tool; A jury deliberation must be manageable.

  ---

  ### IV. Key Trade-offs: The Impossible Trinity & Sacrifices

  **The Core Impossibility:**
  *   **You cannot simultaneously guarantee (N) Logical Coherence, (N) Completeness (for all propositions), and (N) Unrestricted Domain (allowing *any* possible combination of individual judgments on premises/conclusion).** This is the Judgment Aggregation analogue of Arrow's Theorem.
      *   **Sacrifice Required:**
          *   **Option A (Most Common): Relax Completeness.** Allow the group to be *incomplete* on some propositions to preserve coherence. The group might only vote directly on the conclusion ("Promote?"), or if voting on premises, might be forced to leave some subsidiary questions unresolved if they conflict with the conclusion. *This directly addresses your committee's paradox.*
          *   **Option B: Relax Unrestricted Domain.** Restrict the types of individual judgment profiles allowed (e.g., assume members agree on logical dependencies). Often unrealistic.
          *   **Option C: Relax Logical Coherence.** Accept inconsistent group judgments (like your current system). Unacceptable for rational judgment formation.
      *   **What You Gain:** Sacrificing *Completeness* buys you *Coherence*. Your committee gets a logically consistent Promote/Not Promote decision, even if it means not definitively resolving *every* sub-question for *everyone* when those resolutions would conflict.

  **Other Major Trade-offs:**

  1.  **Competence Weighting vs. Anonymity/Formal Equality:**
      *   **Conflict:** Giving more weight to experts conflicts with the principle of "one person, one vote" or secret ballots.
      *   **Sacrifice:** Choose one.
          *   *Sacrifice Strict Equality:* Gain potential accuracy by leveraging expertise (if experts are correctly identified).
          *   *Sacrifice Competence Weighting:* Gain procedural fairness and simplicity, accepting potentially less accurate outcomes.
      *   **Why:** You can't have both meaningful differential weighting and preserve strict anonymity/equal formal power.

  2.  **Robustness to Strategy vs. Simplicity:**
      *   **Conflict:** Highly strategy-resistant mechanisms often require complex preference/judgment elicitation (e.g., scoring, ranking) or intricate procedures, making them cognitively taxing or opaque.
      *   **Sacrifice:**
          *   *Sacrifice Simplicity:* Implement complex methods (e.g., Bayesian truth serum derivatives, sophisticated scoring) to deter manipulation.
          *   *Sacrifice Robustness:* Use simpler, more intuitive methods (e.g., majority vote on conclusion), accepting higher vulnerability to strategy (mitigated by norms/small groups).
      *   **Why:** Simpler methods are easier to game; complex deterrents are harder to use.

  3.  **"Genuine Group View" vs. Procedural Feasibility:**
      *   **Conflict:** Achieving a truly coherent, defensible group position often requires deep deliberation, iteration, or complex aggregation rules, conflicting with the need for timely, tractable decisions.
      *   **Sacrifice:**
          *   *Sacrifice "Deep" Coherence:* Use a simpler, faster aggregation rule (e.g., premise-based or conclusion-based voting) that produces a decision but may feel like just a tally.
          *   *Sacrifice Speed/Simplicity:* Implement deliberation protocols or iterative voting to build consensus and a shared view, requiring more time/effort.
      *   **Why:** Deep coherence is resource-intensive; efficient procedures often output aggregated tallies rather than forged consensus.

  ---

  **The Single Biggest Constraint:** **Logical Coherence (N)** is the requirement that does the most heavy lifting in ruling out common procedures like simple majority voting on all questions independently. It's the non-negotiable demand that forces you to confront the impossibility results and make trade-offs, primarily with **Completeness**. Your core problem is a direct violation of coherence, making its enforcement paramount.

  This spec provides the foundation. You now need to evaluate aggregation procedures (Premise-Based, Conclusion-Based, List, Distance-Based, Deliberative models) against these requirements and trade-offs, knowing that no procedure satisfies them all simultaneously. The choice depends on which trade-offs your committee is willing to make. Good luck!
