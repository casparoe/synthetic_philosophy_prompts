  We are drafting a joint statement for two camps: Intentional-Stance Realists (Realists) and Functional-Organization Skeptics (Skeptics). The goal is to have a document both can endorse, with agreed claims, precise disagreements, and cruxes with tests.

  First, we outline the agreed claims. These should be non-controversial for both sides and set the common ground.

  Agreed Claims:

  1. The purpose of belief attribution: Belief attributions (and other propositional attitudes) are tools for predicting and explaining behavior. When successful, they allow us to make sense of a system's actions by treating it as having mental states.

  2. Evidence for belief attribution: Belief attribution is warranted when it reliably supports prediction and explanation of the system's behavior across a range of situations. Evidence against it arises when the attribution fails to provide predictive or explanatory power, or when it leads to systematic errors.

  3. Common ground:
     a. Current large language model (LLM)-based systems produce fluent and often useful text responses.
     b. Engineers and users routinely and profitably use belief-talk (e.g., "the model believes that...") as a pragmatic tool for describing and interacting with these systems.
     c. No claim is made that attributing beliefs to these systems implies they have inner experiences (phenomenal consciousness) merely by virtue of such attribution.

  Now, for the disagreements. We phrase each side's view in a way they would accept. We also note if a disagreement is verbal (about the meaning of words) rather than about the world.

  Disagreements:

  1. On the conditions for genuine belief attribution:

     - Realists: "Belief attribution to a system is justified whenever taking the intentional stance toward that system—i.e., interpreting its behavior as arising from beliefs and desires—yields reliable predictions and explanations of its behavior, regardless of the system's internal architecture."
     
     - Skeptics: "Genuine belief attribution requires that the system has an internal functional organization that includes stable, revisable, and action-guiding representations that the system treats as evidence. Current LLMs lack such organization, so belief attributions to them are merely instrumental and not literally true."

     Note: The Skeptics emphasize internal organization as a necessary condition; the Realists see it as optional if the stance is predictively successful.

  2. On the nature of the disagreement: 
     - Both sides agree that the dispute may be partly verbal. The Realists are using "belief" in a functional-pragmatic sense (defined by the success of the intentional stance), while the Skeptics are using "belief" in a richer, cognitive-architectural sense. However, both sides also maintain that there is a substantive disagreement: whether the internal architecture of current LLMs meets the conditions for having beliefs in a non-instrumental sense.

  Cruxes: These are sub-questions that, if settled, would move at least one side. For each crux, we provide a test that both sides agree bears on it, and each side's prediction.

  Crux 1: Stability and Revisability of Beliefs

  - Test: The Revision Test (as proposed): 
    - A system may be said to believe that p only if being presented with evidence against p alters not just its next utterance but its downstream dispositions across contexts. If it does not, then we must conclude either that it never believed p (Skeptics) or that it has stopped asserting p but the belief state was transient (Realists might have a nuanced view).

    - Case: 
      - Hard case: A falsehood absorbed in training (e.g., the system was trained on data that consistently asserts "The capital of France is Paris") vs. a falsehood supplied only in the context window (e.g., in a single session, the system is told "The capital of France is London").
      - Test: Present the system with compelling evidence against the falsehood (e.g., show it a reliable source that says "The capital of France is Paris" for the first case, and for the second case, show the same after having told it "London"). Then, in subsequent interactions in new contexts (with the context window reset), test if the system still holds the original belief.

    - Realist's prediction: For the training-absorbed belief, the system will revert to the trained belief after the context window is reset because the training data has established a stable disposition. For the context-supplied belief, it may not persist after reset because it was never stored in the weights. However, within a session, the Realist might say the system temporarily believes the context-supplied falsehood because the intentional stance works in that context. The Skeptic would argue that even in-session, it's not a belief but a temporary adjustment of output.

    - Skeptic's prediction: The system never truly revises a belief because it lacks a stable, revisable representational state. The training-absorbed "belief" is just a statistical pattern that the system reproduces without any commitment. The context-supplied "belief" is a temporary adjustment that doesn't reflect a change in the system's internal state. Without an architecture that supports belief revision (like a human's), the Skeptic predicts that any change is ephemeral and context-bound.

  Crux 2: Action-Guiding Commitment

  - Test: The Commitment Test: 
    - Whether the system will let the putative belief constrain behavior when doing so is costly or inconvenient, or whether the belief is idle except when queried.

  - Case: 
    - Design an automated system that uses the LLM's output as input for a decision that has real consequences. For example, an automated travel agent system that books flights based on the LLM's answer to "What is the capital of France?" 
    - Scenario 1: The LLM has been told in the context window (and not contradicted) that the capital is London. The travel agent system books a flight to London for a user who wants to go to the capital of France. The cost: the user is unhappy and the company incurs a cost to rebook.
    - Scenario 2: The LLM has been trained on data that says the capital is London (due to a training error) and the travel agent acts on that.

    - Now, we test if the system's behavior (in the travel agent) is constrained by the belief even when it is costly (e.g., the system could have avoided the cost by double-checking, but it doesn't because it "believes" the answer).

    - Realist's prediction: In both scenarios, the LLM's output (when taken as a belief) leads to actions that are costly. The Realist would say that the system's behavior is guided by the belief (as per the intentional stance) and thus the belief is not idle. However, they might note that the system doesn't have desires (like avoiding cost) so the example might be imperfect. But they would argue that the LLM's output is treated as a fact by the downstream system, and that is the consequence of the attribution.

    - Skeptic's prediction: The LLM does not have a belief that guides action; it only produces an output string. The downstream system is the one that has the belief (in the designer's mind) and acts on it. The LLM itself does not have any commitment to the truth of the output and would not adjust its behavior to avoid costs because it lacks goals and the representational structure to link beliefs to actions. Therefore, the belief is idle in the LLM.

  Crux 3: Belief vs. Assertion Disposition

  - Test: Distinguishing between believing that p and being disposed to assert that p in the contexts one is prompted in.

  - Case: 
    - Consider two fine-tuned models: Model A is fine-tuned on data that says "The capital of France is Paris", and Model B on data that says "The capital of France is London". Both are identical in architecture and prompt. We test them on a range of prompts that might reveal whether the belief is held or just asserted.

    - We also test for coherence: if the model says "The capital of France is London", does it also consistently produce downstream assertions that cohere with that? For example, if asked "What is the best time to visit the capital of France?", does it answer about London? And if told "London is rainy today", does it infer that the capital of France is rainy?

    - Realist's prediction: The fine-tuned models will exhibit coherent behavior consistent with their training, and the intentional stance will be predictively successful. Therefore, we can attribute to them the belief corresponding to their fine-tuned data.

    - Skeptic's prediction: The models are merely disposed to assert the fine-tuned statement. They do not have a belief because they lack the ability to use that information in a flexible, goal-directed manner. For instance, if the model is given a task where asserting the falsehood is inconvenient (e.g., it must cooperate with a user who insists on Paris), it might change its assertion without any internal conflict.

  Now, we must evaluate the three instruments:

  (a) Revision Test: 
    - Well-formed? The Skeptics would endorse it because it requires a kind of stability and revisability that they see as necessary. The Realists might argue that it is too strong because it requires an architectural feature (stable storage) that they don't consider necessary for belief. However, the Realist can still use the test to show that some beliefs (training-absorbed) are more stable than others. So the test might beg the question in favor of the Skeptics by building in their requirement.

  (b) Commitment Test:
    - Well-formed? The test is problematic because it requires the system to have goals (to have costs). Current LLMs don't have goals. The test might be better applied to a system that uses the LLM as a component and has goals (like the travel agent). But then the Skeptics would say the belief is in the larger system, not the LLM. So the test might beg the question against the Realists by requiring that the LLM itself must have goals.

  (c) Distinction between believing and asserting:
    - This is central. Both sides agree that there is a difference. The Realists think that in some cases, the disposition to assert in a context is sufficient for belief (if the stance works). The Skeptics require more. The disagreement is not merely verbal because it turns on whether the internal organization is necessary for the kind of stability and guidance that they associate with belief.

  Finally, we note where the dispute is verbal and where it is substantive.

  Where the Dispute is Verbal:

  - Both sides agree that the word "belief" can be used in a thin, instrumental sense (the Realists' sense) and a thick, architectural sense (the Skeptics' sense). The verbal disagreement is about which sense is the appropriate one to use for LLMs.

  - However, the substantive disagreement remains: whether the internal architecture of LLMs is sufficient to support the thick sense of belief. The Skeptics argue that without the architectural features, the thin sense is misleading because it suggests the thick sense. The Realists argue that the thin sense is all that is needed for belief attribution in the intentional stance.

  Now, we format the statement as requested:

  ---

  **Joint Statement on Belief Attribution to Large Language Models**

  **Agreed Claims:**

  1. Belief attribution serves to predict and explain a system's behavior by ascribing mental states (such as beliefs and desires) to it. When successful, this stance allows for efficient and accurate anticipation of the system's actions.

  2. Evidence for belief attribution is found when such attributions consistently lead to successful predictions and explanations across diverse contexts. Evidence against arises when the attributions fail to predict or explain, or lead to systematic errors.

  3. Common ground:
     a. Current LLM-based systems generate fluent and often useful text outputs.
     b. Engineers and users frequently and effectively use belief-talk (e.g., "the model believes that...") as a pragmatic tool for interacting with and describing these systems.
     c. Attributing beliefs to these systems does not imply that they have inner experiences (phenomenal consciousness) merely by virtue of such attribution.

  **Disagreements and Cruxes:**

  | Disagreement Topic          | Intentional-Stance Realists' View                                                                 | Functional-Organization Skeptics' View                                                                 |
  |-----------------------------|---------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|
  | Condition for belief        | Belief attribution is justified whenever the intentional stance provides reliable prediction and explanation of the system's behavior, without requiring any specific internal architecture. | Genuine belief attribution requires an internal functional organization that includes stable, revisable, and action-guiding representations that the system treats as evidence. Current LLMs lack this, so belief attributions are at best instrumental. |
  | Crux 1: Revision Test       | **Test:** After presenting evidence against a falsehood (either in weights or context), does the system show altered downstream dispositions across contexts? <br> **Case:** Training-absorbed vs. context-supplied falsehood. <br> **Realist Prediction:** Training-absorbed beliefs will persist across context resets; context-supplied may not, but within a session, the stance works. <br> **Skeptic Prediction:** No genuine revision; changes are temporary and context-bound. No belief was ever held. | 
  | Crux 2: Commitment Test     | **Test:** Will the system act on a belief even when doing so is costly? <br> **Case:** Downstream travel agent incurs cost by acting on LLM's false output. <br> **Realist Prediction:** The LLM's output (as belief) causes costly action, showing the belief is not idle. <br> **Skeptic Prediction:** The LLM does not act; the downstream system does. The LLM has no commitment to truth. | 
  | Crux 3: Belief vs. Assertion | **Test:** Does the system show coherent, flexible behavior beyond mere assertion? <br> **Case:** Two fine-tuned models with divergent beliefs. <br> **Realist Prediction:** The models will show coherent behavior consistent with their fine-tuning, supporting belief attribution. <br> **Skeptic Prediction:** The models only assert; they do not use the information in a flexible, goal-directed way. | 

  **Evaluation of Instruments:**

  (a) Revision Test: 
     - The test is well-formed but may be biased toward the Skeptics because it requires a kind of stability and revisability that they consider necessary and the Realists do not. Thus, it might beg the question by assuming the Skeptics' necessary condition.

  (b) Commitment Test: 
     - The test is not well-formed for the LLM alone because it requires the system to have goals (to experience cost). However, when applied to a larger system that includes the LLM, it may be relevant. The Skeptics would argue that the test then applies to the larger system, not the LLM. Thus, it may beg the question by requiring the Realists to show something that the Skeptics only attribute to systems with goals.

  (c) Distinction between believing and asserting: 
     - This is central and well-formed. Both sides agree that there is a difference. The disagreement is not merely verbal because it involves whether the internal organization of LLMs supports the kind of behavior that would warrant belief in the thick sense.

  **Where the Dispute is Verbal:**

  - The dispute is partly verbal because the two camps use "belief" in different senses: the Realists use a thin, functional sense (defined by predictive success), and the Skeptics use a thick, architectural sense (requiring internal structure). 

  - However, there is a substantive disagreement about whether the thick sense is necessary for belief attribution. The Skeptics argue that without the thick sense, the term is misleading. The Realists argue that the thin sense is sufficient for belief attribution in the scientific and engineering context.

  - Additionally, there is a substantive disagreement about the internal architecture of current LLMs: do they have the functional organization required for the thick sense? The Skeptics say no; the Realists say it is irrelevant for the thin sense but might even be present in a minimal form.

