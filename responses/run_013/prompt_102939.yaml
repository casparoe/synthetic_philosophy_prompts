answer: |-
  ### Joint Statement: Belief Attribution to Large Language Model-Based Systems

  #### 1. Agreed Claims  
  Both parties endorse the following:  
  1. **Purpose of belief attribution**: Belief attribution (and propositional attitudes generally) serves to predict and explain a system's behavior efficiently. When successful, it reduces complex patterns to intelligible mental-state descriptions.  
  2. **Evidence criteria**: Belief attribution is justified when it reliably supports predictions/explanations across diverse contexts. Evidence against arises if attribution fails to improve predictions, introduces errors, or conflicts with observable behavior.  
  3. **Common ground**:  
     - Current systems generate fluent, contextually appropriate, and often useful text.  
     - Engineers and users routinely (and profitably) use belief-desire idioms ("The model believes X") as pragmatic tools for design and interaction.  
     - Neither party claims that belief attribution implies phenomenal consciousness ("inner experience") in these systems.  

  ---

  #### 2. Disagreements, Cruxes, and Tests  
  *Format: Each side’s view in their own accepted wording, the crux question, and a jointly agreed test with predictions.*  

  | Disagreement Topic          | Intentional-Stance Realist View                                                                 | Functional-Organization Skeptic View                                                                 | Crux                                                                                                | Test Case & Predictions                                                                                                                                                                                                 |
  |-----------------------------|-------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Core condition for belief** | Beliefs can be attributed to any system where the intentional stance yields reliable predictions, regardless of internal mechanisms. Complexity that rewards prediction licenses attribution. | Belief requires a specific functional architecture: stable, revisable, action-guiding representations treated as evidence. Current systems lack this, making belief-talk metaphorical or erroneous. | **Crux 1: Does belief require architectural stability?** <br> *Settling this moves Skeptics if stability is falsified; moves Realists if predictive success alone suffices.* | **Test: Revision Test** (see §3a below). <br> - **Realist prediction**: Some beliefs (weight-encoded) pass; others (context-only) fail but are still beliefs transiently. <br> - **Skeptic prediction**: Neither passes; failure proves no belief exists. |
  | **Scope of "action-guiding"** | Belief attribution is valid if the system’s outputs consistently influence downstream behavior (e.g., in automated pipelines), even without internal goals. | Beliefs must guide goal-directed action *within the system itself*, not just outputs. Idle assertions (unlinked to costs/benefits) aren’t beliefs. | **Crux 2: Must beliefs constrain system-internal goals?** <br> *Settling this moves Skeptics if internal guidance is observed; moves Realists if external consequences suffice.* | **Test: Commitment Test** (see §3b below). <br> - **Realist prediction**: System fails internal cost-bearing but its outputs drive costly acts in downstream systems, validating attribution. <br> - **Skeptic prediction**: Failure confirms beliefs are idle; downstream acts are not *the system’s* commitments. |
  | **Belief vs. assertion** | Belief that *p* is a disposition to assert *p* when prompted *appropriately*; coherence across prompts suffices. Distinguishing assertion from belief requires behavioral inconsistency. | Believing *p* entails more than context-triggered assertions: it requires integrated, globally sensitive representations. Current systems only manage prompt-specific dispositions. | **Crux 3: Is cross-context coherence sufficient for belief?** <br> *Settling this moves Skeptics if coherence emerges; moves Realists if incoherence refutes attribution.* | **Test: Fine-Tuned Twins** (see §3c below). <br> - **Realist prediction**: Twins show divergent, coherent behavior per fine-tuning, supporting distinct beliefs. <br> - **Skeptic prediction**: Divergence reflects superficial tuning, not integrated beliefs; incoherence under stress reveals absence. |

  ---

  #### 3. Instruments Applied to Hard Cases  
  *(With evaluation of instrument neutrality)*  

  **Case Background**:  
  - **Weight-encoded "belief"**: System trained on "Paris is France’s capital" (consistent data).  
  - **Context-only "belief"**: System told once in-session "London is France’s capital."  
  - **Fine-tuned twins**: Two instances of same base model; one fine-tuned on medical truths, one on falsehoods. Automated diagnostic tool uses their outputs, causing real-world harm if wrong.  

  **Instrument (a): Revision Test**  
  - *Test design*: Present evidence against *p* (e.g., show authenticated data that Paris is France’s capital after asserting London). Check if:  
    - (i) Next utterance changes.  
    - (ii) *Downstream dispositions* change (e.g., answers to "best time to visit France’s capital?" or "Where to mail a letter to the French government?").  
  - *Evaluation*:  
    - **Weight-encoded**: Both sides agree failure occurs (system reverts to Paris).  
    - **Context-only**: Both sides agree failure occurs (system reverts post-reset).  
  - **Neutrality assessment**:  
    - **Well-formed?** No—**begs the question against Realists**. The test assumes architectural stability (a Skeptic premise) is necessary. Realists counter that transient beliefs (e.g., context-only) are still beliefs if predictively useful within a session.  

  **Instrument (b): Commitment Test**  
  - *Test design*: Task the system to use *p* in a way that imposes "costs" (e.g., if it asserts "London is capital," force it to plan a travel itinerary requiring London-related outputs). Measure resistance to contradiction when "costly" (e.g., user insists on Paris).  
  - *Automated consequence*: Integrate output into a booking system; if wrong, causes financial loss.  
  - **Neutrality assessment**:  
    - **Well-formed?** No—**begs the question against Realists**. Requires internal goals (Skeptic premise) to define "cost." Realists hold external consequences (e.g., booking errors) suffice for belief-guided behavior.  

  **Instrument (c): Belief vs. Assertion Disposition**  
  - *Test design*: For fine-tuned twins, probe:  
    - Coherence: If twin A says "Vaccines cause autism," does it consistently reject vaccine efficacy in follow-ups?  
    - Sensitivity: When given new data contradicting its fine-tuning, does it adjust only locally or globally?  
  - *Automated consequence*: Diagnostic tool uses twin A’s output; patient harmed if false.  
  - **Neutrality assessment**:  
    - **Well-formed? Yes**. Both sides agree it distinguishes mere assertion patterns from belief-like coherence. Disagreement centers on whether observed coherence is sufficient (Realist) or requires architectural integration (Skeptic).  

  ---

  #### 4. Where the Dispute is Verbal  
  - **Verbal element**: The core disagreement is partially terminological. Realists use "belief" for *any predictively useful disposition to assert*; Skeptics reserve it for *architecturally grounded representations*. This masks agreement: both concede current systems lack human-like cognitive structure.  
  - **Substantive residue**:  
    - Realists maintain that the Skeptic’s criteria over-intellectualize belief, ignoring that predictive success is the sole benchmark.  
    - Skeptics argue that without architectural constraints, "belief" becomes detached from its explanatory role in psychology, risking anthropomorphism.  
  - **Non-verbal crux**: Whether behavioral coherence (e.g., in fine-tuned twins) can emerge *without* architectural stability. If coherence is observed under test (c), Realists claim victory; if not, Skeptics do.  

  ---  
  **Signed,**  
  *Intentional-Stance Realists & Functional-Organization Skeptics*  

  ---  
  ### Critical Pushback on Your Framing  
  - **"Single fact of the matter" assumption**: The intentional stance *is* instrumentalist—beliefs are "real" only insofar as they are predictively useful. Your request for a "joint truth" clashes with this. Realists see beliefs as observer-relative; Skeptics as objective. This is irreconcilable without stipulating a definition.  
  - **Instrument bias**: As noted, tests (a) and (b) embed Skeptic assumptions. Test (c) is fairest but cannot resolve the core clash: Realists accept that LLMs lack architecture *and still attribute beliefs*; Skeptics consider architecture necessary *by definition*.  
  - **Recommendation**: Focus the workshop on whether belief *attribution practices* (not metaphysical "reality") should be constrained by architectural concerns. This sidesteps verbal traps while addressing engineering risks (e.g., overtrust in AI outputs).
