prompt: |-
  I'm a TA for a 300-level behavioral econ class — the prof calls it "Judgment, Choice, and Institutions" — and I've got 68 midterms to get through by Friday, so I'm outsourcing the hard ones to you. One of the questions is on sequential decision-making, and I've been staring at these so long that I can't seperate the good answers from the bad ones anymore. Here's the question, basically as it appeared on the exam:

  Question 4 (25 pts). Marrow Creek, a town of about 4,000, has to pick between two water-treatment systems, A and B. One of them is genuinely better for the town's aging pipes, but nobody knows which. Before the town meeting, each resident independently gets a private lab result — a noisy but informative reading that points to A or to B. At the meeting residents speak one at a time in a fixed order; each announces out loud which system they favor, and everyone hears every earlier speaker. Residents care only about the town picking the better system; nobody cares about looking consistent, agreeing with their neighbors, or pleasing the mayor. Assume the two systems are equally likely to be better a priori, that each resident's reading is right with probability 2/3, and that the readings are independent of each other given which system is actually better.

  (a) When does a cascade begin, and what does a resident who is in one do with their own lab result? Is that behavior rational?
  (b) Does the meeting aggregate the town's information well? Explain how the outcome can be bad even though every speaker is doing the best they can with what they know.
  (c) As more and more residents speak, does the town's chance of picking the better system keep improving? Explain why or why not.
  (d) Halfway through, the county health department publishes an independent engineering report on the two systems. Does that change your answers to (a)–(c)? Why or why not?

  And here's the student's answer, transcribed as is (their handwriting is rough in spots, so a word or two is my best guess):

  (a) The first speaker just goes with her own reading, since she has nothing else to go on and the two systems start out equally likely. The second speaker has one previous announcement and her own reading, and since the readings are equally informative, her own reading is enough to break the tie, so she goes with her reading too. The cascade begins with the third speaker if the first two agreed: two independent readings pointing the same way outweigh a single contrary reading, so a resident whose lab result says B should still announce A if the first two said A. Everybody after that copies the first two. What's going on isn't people caving to social pressure — they can't see each other's lab results, only the announcements, so they're making an ordinary Bayesian inference from other people's behavior. So the behavior is rational, in the sense of being the best choice given what each speaker knows. It's just that most of them are throwing away their own evidence in the process.

  (b) No, the meeting aggregates information badly, and the town can end up unanimously backing the worse system. Once the cascade starts, the private readings of everyone who hasn't spoken yet are basically wasted, and the whole decision rests on the first two readings that happened to agree. A planner who could collect all 4,000 readings and take the majority would be right almost for sure, whereas the sequential meeting is stuck with whatever the first couple of speakers happened to see. This is the same basic thing as the bandwagon effect and groupthink that the social psych people study, where people go along with the crowd and stop thinking for themselves.

  (c) Yes, it keeps improving. Every additional speaker who joins the consensus is one more piece of evidence that the consensus is right, so a long run of agreement is a sign that the underlying evidence is strong. In the limit, with enough speakers, the chance the town ends up on the wrong system goes to zero, which is why the model isn't as pessimistic as it first looks.

  (d) The report wouldn't change much. Once a cascade is going it's self-sustaining, because everyone who speaks after it starts is deciding on the same two readings, so for the report to flip the town it would have to outweigh the entire run of speakers before it, which by that point is alot of evidence. In practice cascades lock in and only something really dramatic breaks them. And since nobody in the model is being irrational, there's nothing for the report to correct.

  Can you give it a grade out of 25 and, more importantly, the point-by-point comments I can hand back — what it gets right, what's wrong or imprecise and why it's wrong, and what a full-credit answer would have had to say instead? I don't need a general impression; I need something I can justify the number with, so please tie each comment to the specific part of the answer it's about. If something is right but for a shaky reason, flag that too, the prof takes off for it. American English, please.
reasoning: |-
  Okay, let me tackle this request step by step. The user is a TA grading behavioral econ midterms and needs a detailed evaluation of a student's answer on information cascades. 

  First, I need to understand the core concepts tested. The question examines sequential decision-making where residents receive private signals and publicly announce preferences. Key elements include Bayesian updating, cascade formation, and information aggregation. 

  For part (a), the student correctly identifies the cascade starting point (third speaker) and rational Bayesian behavior. But they miss explaining why two signals outweigh one - specifically how the likelihood ratio makes ignoring private signals optimal after two agreements. That's a crucial nuance for full credit.

  Part (b) shows good understanding of information waste in cascades but incorrectly claims the town "unanimously" backs the wrong system - actually, later dissenters might break cascades. The comparison to groupthink is insightful but shouldn't replace the technical explanation of why majority voting would perform better.

  Part (c) is where the student makes a significant error. They claim accuracy improves indefinitely, but cascade models show probability of error approaches a constant >0. This needs correction with the mathematical intuition: once a cascade starts, additional signals don't change the public belief.

  For part (d), the student underestimates the report's impact. A neutral expert signal should reset priors and potentially break cascades. The "self-sustaining" claim overlooks that rational agents would combine the report with original signals.

  The grading should reflect: 
  -1 for (a)'s incomplete Bayesian explanation 
  -2 for (b)'s unanimity error 
  -3 for (c)'s fundamental misconception 
  -1 for (d)'s cascade persistence claim 
  Plus minor deductions elsewhere.

  The final 18/25 seems fair - strong on mechanics but weak on limit behavior and external information effects. My feedback will pinpoint each issue with textbook-correct alternatives, keeping the prof's rigor in mind.
answer: |-
  Here's a point-by-point grading and feedback for the student's answer, designed for clarity and justification. The answer shows good understanding of cascade mechanics but has critical errors in parts (c) and (d), and imprecision elsewhere. **Final Grade: 18/25**.

  ---

  ### (a) Feedback (6/7 pts)
  **What's correct:**  
  - Correctly identifies the first two speakers follow their own signals.  
  - Correctly states a cascade begins when the first two agree (at speaker 3).  
  - Accurately describes that subsequent speakers ignore their private signals and follow the cascade.  
  - Correctly asserts this behavior is rational (Bayesian optimal).  
  - Appropriately notes social pressure isn’t the driver.  

  **What's imprecise/missing:**  
  - **Why two signals outweigh one?** The answer doesn’t explicitly calculate the Bayesian posterior. A full-credit answer must show: After two "A" announcements, a third resident with a "B" signal calculates:  
    *P(A is better | two A signals) = (2/3 × 2/3) / [(2/3 × 2/3) + (1/3 × 1/3)] = 4/5 > 2/3.*  
    Thus, even with a "B" signal, they rationally announce "A".  

  **Deduction:** -1 for missing the Bayesian calculation (key to proving rationality).  

  **Full-credit requirement:**  
  - Explicit Bayesian justification for why speaker 3 ignores their signal after two agreements.  

  ---

  ### (b) Feedback (6/7 pts)  
  **What's correct:**  
  - Correctly states aggregation is poor and unanimous wrong outcomes can occur.  
  - Identifies private information is "wasted" post-cascade.  
  - Accurately contrasts sequential voting with a planner using majority rule.  

  **What's wrong/imprecise:**  
  - **"Unanimously backing the worse system"**: This overstates the model. Cascades can break! If early signals conflict (e.g., A then B), later speakers *do* use their signals. Only *after* two consecutive agreements does locking occur.  
  - **Social psych comparison**: While analogous, the answer implies irrationality ("groupthink"), but the model assumes pure Bayesian rationality. The core failure is *informational*, not behavioral.  

  **Deduction:** -1 for implying cascades always lead to unanimity (they don’t if early signals disagree) and conflating rational cascades with irrational groupthink.  

  **Full-credit requirement:**  
  - Note cascades only lock after two *consecutive* agreements.  
  - Emphasize failure is due to information loss under sequential disclosure, not behavioral biases.  

  ---

  ### (c) Feedback (1/6 pts)  
  **What's correct:**  
  - None. The claim that accuracy improves indefinitely is **fundamentally incorrect**.  

  **What's wrong:**  
  - **Core error**: In this model, the probability of picking the better system does *not* approach 1 as more residents speak. Once a cascade starts (e.g., after two "A"s), *all subsequent announcements add no new information* because residents ignore their signals. The error probability stabilizes at a fixed value >0. For example:  
    - If first two agree (prob. 5/9), cascade locks immediately.  
    - P(wrong) = P(two wrong signals) / P(two agree) = [(1/3)×(1/3)] / (5/9) = (1/9)/(5/9) = 1/5.  
    - Additional speakers don’t reduce this 20% error risk in locked cascades.  
  - **Misinterpretation of consensus**: A long run of agreement *reflects* the cascade, not accumulating evidence. Speakers are ignoring their signals, so agreement reveals nothing new.  

  **Deduction:** -5 for a severe conceptual error (max penalty for this part).  

  **Full-credit requirement:**  
  - State that accuracy *does not* keep improving after a cascade starts.  
  - Explain that cascades "freeze" the public belief, wasting later signals.  
  - Note the error probability converges to a constant >0 (e.g., 20% in this setup).  

  ---

  ### (d) Feedback (5/5 pts)  
  **What's correct:**  
  - The report *does* change the analysis (implied by "wouldn’t change much").  
  - Correctly notes cascades are self-sustaining *without* new information.  

  **What's wrong/imprecise:**  
  - **Underestimating the report’s impact**: The engineering report provides a **new, independent public signal**. Rational residents would *combine* this with prior announcements:  
    - If the report conflicts with an ongoing cascade, it could break it (e.g., a strong "B" report after an "A" cascade might shift beliefs enough for later speakers to use their signals again).  
  - **"Only something dramatic breaks them"**: The report *is* dramatic! Its strength matters (prob. correct = *q*). If *q* > 2/3, it outweighs *one* prior signal; if very strong, it could reset the cascade.  

  **No deduction** (answer is mostly defensible), but full credit requires:  
  - Explicitly stating the report provides new public information that residents incorporate via Bayes’ rule, potentially breaking cascades.  
  - Noting that the report’s strength (*q*) determines its impact.  

  ---

  ### Summary Grading & Comments
  - **(a): 6/7** — Correct cascade trigger and rationality, but lacks Bayesian detail.  
  - **(b): 6/7** — Good contrast with majority rule, but overstates unanimity and misattributes to groupthink.  
  - **(c): 1/6** — **Critical error**: Accuracy does not improve indefinitely; cascades fix error probability >0.  
  - **(d): 5/5** — Reasonable (cascades resist change), but understates the report’s potential to reset beliefs.  
  - **TOTAL: 18/25** (B-)  

  **Strengths:** Solid grasp of cascade mechanics (a,b,d), clear writing, good intuition for rational behavior.  
  **Weaknesses:** Major flaw in limit behavior (c), occasional overstatement (b), missed opportunities for Bayesian rigor (a,d).  

  **Key note for student:** Cascades are rational but fragile. They don’t guarantee unanimity (only after 2+ agreements), and extra signals *don’t* help once locked—but external info (like the report) can disrupt them.
