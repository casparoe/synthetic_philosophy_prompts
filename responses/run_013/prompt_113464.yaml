prompt: |-
  I'm a novelist — I'm about 200 pages into a book set in a consciousness research lab, the kind of place where two people have been having the same fight since the mid-90s, and I've hit a wall: I can't write the big blow-up scene until I actually know what these two agree on. My two are (a) a heterophenomenologist, the Dennett type — the subject's reports are data about what the subject believes and says, you treat them like the text of a novel, you never get to peek behind them at the real experience; and (b) a neurophenomenologist, the first-person-methods, Varela type — you train subjects for weeks in a disciplined way of reporting, and those reports are supposed to constrain the neural theory, not just get interpreted away.

  What I need is the joint statement those two could both sign after a long good-faith collaboration — the thing my characters would tape to the lab wall. So:

  - the claims both can put their names to: what the data actually is, what counts as a report, what taking reports seriously does and doesn't commit you to, and what neither of them is claiming (I'm pretty sure each has a strawman of the other and I want the strawmen formally retired in writing)
  - where they still genuinely split, with each side's position in wording that side would accept — no caricature, and no mush that means nothing
  - the cruxes: the sub-questions that, if they got settled, would actually move at least one of them
  - for each crux, something both would agree bears on it — a case, a study design, a result — with each side's prediction written down in advance, so I know which way the scene tips

  Some specific things I want handled, because they're what the argument scene is really about: whether you can tell a trained report from an untrained one without already assuming the phenomenological theory that says training matters; whether the it's-just-a-fiction move is a piece of method or a metaphysical claim smuggled in dressed as method (and if it's the latter, is the fight partly verbal — say so, and name which part); whether the interviewer-guided second-person way of eliciting reports is contamination or the only route to the pre-reflective stuff at all; and whether first-person methods ever make a prediction that could come out wrong, or whether they only ever redescribe what the neuroscience found. Those four are the cruxes as far as I can tell, but use your judgement.

  Format it as a numbered list of agreed claims, then a table of the disagreements with a crux column and a predictions column. Casual register is fine, my characters talk like real people. And if the honest verdict is that the two of them are using the same word for different things, fine, say that too — just be seperate and specific about which word.
reasoning: |-
  Okay, the user is a novelist stuck on a big argument scene between two consciousness researchers in their book. They've described two characters: one is a heterophenomenologist (Dennett-style) who treats subjective reports as data about beliefs, not direct experiences. The other is a neurophenomenologist (Varela-style) who trains subjects to give disciplined first-person reports that constrain neural theories. 

  The user needs a "joint statement" these rivals could theoretically agree on after collaborating - something to pin on the lab wall. They want: shared principles, clear disagreements without caricature, and specific "cruxes" (testable differences) for their four key conflict points. 

  Hmm, this is deliciously niche philosophy-of-mind territory. The user clearly knows their stuff - referencing Dennett/Varela, heterophenomenology, pre-reflective states. But they're stuck on making the conflict feel authentic. Smart move to demand "predictions in advance" - that's how real scientists resolve disputes. 

  Breaking it down:
  First, common ground: Both camps treat reports as *data*, not illusions. Both reject Cartesian theaters. Both want to avoid gullibility. That's the easy part. 

  Now the meat: Their four specified cruxes are perfect focal points:
  1) **Trained vs untrained reports**: Can you *objectively* distinguish them without assuming phenomenology works? Neurophenomenologist says training reveals pre-reflective stuff; heterophenomenologist says it's just better storytelling. 
  2) **"Fiction" move**: Is calling reports "fiction" methodological neutrality or a sneaky metaphysical claim? Big verbal dispute potential here - heterophenomenology insists it's just method, neurophenomenology smells dualism denial. 
  3) **Interviewer guidance**: Contamination or necessary access? Varela's crew thinks you need skilled dialogue to bypass narrative distortions; Dennett's side sees suggestion risks. 
  4) **Predictive power**: Can first-person methods ever *lead* neuroscience instead of just tagging along? Neurophenomenology claims yes (e.g., predicting neural correlates of micro-experiences), heterophenomenology doubts it. 

  For predictions, I'll design hypothetical experiments: 
  - For #1: Compare brain scans of trained vs untrained subjects reporting the same stimulus. Neurophenomenologist predicts distinct neural signatures for training; heterophenomenologist expects only attention differences. 
  - For #4: Have phenomenologists predict neural patterns *before* fMRI based on trained reports. Can they beat chance? That's the litmus test. 

  Key insight: Some fights are verbal. "Fiction" is radioactive - heterophenomenologist means "neutral framing," neurophenomenologist hears "denying experience." They should retire that word. Also, "consciousness" itself might be a suitcase term - one means qualia, the other means reportable cognition. 

  The joint statement should sound like real scientists grudgingly agreeing: slightly technical but with human phrasing ("we both swear we're not these strawmen"). Disagreements table needs punchy, testable predictions - that's where the novel's conflict will turn. 

  User's done their homework. This isn't "explain Dennett 101" - it's precision toolmaking for narrative tension. Respect.
answer: |-
  Here’s the joint statement your characters would tape to the lab wall, followed by the unresolved disagreements laid bare with testable cruxes. The tone is collaborative-but-frank, as if drafted over bad coffee after a 3 AM breakthrough.

  ---

  ### **JOINT STATEMENT: WHAT WE AGREE ON**  
  *(Signed by Dr. Aris Thorne [Heterophenomenologist] & Dr. Elena Voss [Neurophenomenologist])*  

  1. **The Data is the Report**  
     Both: Subject reports (verbal, written, or behavioral) are the primary data. We don’t have direct access to subjective experience — only to what subjects *express* about it.  

  2. **Reports ≠ Illusions**  
     Both: When a subject says "I see red," they’re reporting *something* real (neural, functional, or otherwise). We reject dismissing reports as "mere noise."  

  3. **Strawmen Retired**  
     - Aris isn’t claiming subjects are "lying robots."  
     - Elena isn’t claiming she’s "reading minds" or that experience is a ghost in the machine.  
     - Both: We’re not dualists.  

  4. **First-Person Data Needs Rigor**  
     Both: Untrained, off-the-cuff reports are messy. Elena’s training protocols improve consistency; Aris agrees this reduces noise.  

  5. **Neuroscience Isn’t the Whole Story**  
     Both: Neural data alone can’t explain why *this* pattern feels like "regret" and not "nausea." Reports provide context machines can’t.  

  6. **The "Fiction" Landmine**  
     Both: Calling reports "fiction" is a **methodological stance** (Aris: "It’s how we bracket metaphysics!"). It is **not** a claim that experience is unreal. We’ll avoid the word "fiction" — it’s a verbal tripwire.  

  ---

  ### **WHERE WE SPLIT: THE FOUR CRUXES**  
  *(Table format for lab-wall readability)*  

  | Disagreement | Aris (Heterophenomenologist) | Elena (Neurophenomenologist) | Crux | Predictions (Aris vs. Elena) |
  |--------------|-------------------------------|-------------------------------|------|------------------------------|
  | **Trained Reports: Special Access or Better Behavior?** | Training refines *expression*, not access. It’s learning to describe your "novel" more consistently — not reading deeper chapters. | Training dissolves cognitive biases, revealing *pre-reflective* experience. It’s tuning the instrument, not polishing the story. | **Can we distinguish trained vs. untrained reports *without* assuming phenomenology?** | **Test:** fMRI during ambiguous stimuli (e.g., binocular rivalry). Subjects report percept switches. <br> • *Aris:* Brain activity will show **only attention/response modulation** in trained subjects. <br> • *Elena:* Trained subjects will show **unique neural signatures** for pre-perceptual "micro-shifts" untrained subjects miss. |
  | **The Interviewer’s Role: Scaffold or Contaminant?** | Guided interviews *shape* the report. You’re coaching the subject into *your* phenomenological framework. | Second-person guidance *unlocks* experience subjects can’t articulate alone. Without it, you only get post-hoc rationalizations. | **Does interviewer guidance reveal pre-existing structure, or implant it?** | **Test:** Naive subjects describe a novel sensation (e.g., magnetic field exposure). Half get Varela-style guided interviews; half give solo reports. Later, independent judges code reports for "phenomenological richness." <br> • *Aris:* Judges will detect **interviewer’s theoretical bias** in guided reports. <br> • *Elena:* Guided reports will show **higher intersubjective consistency** on core features (e.g., "tingling topography"). |
  | **Predictive Power: Can Phenomenology Lead?** | First-person methods *redescribe* neural events. They’re narrative taxonomies — elegant, but never predictive. | Trained reports can *anticipate* neural discoveries (e.g., "If experience X has structure Y, look for oscillation Z in region R"). | **Can phenomenology predict *novel* neural correlates?** | **Test:** Elena’s team defines a subtle experiential structure (e.g., "temporal grain" of musical rhythm). They predict a specific neural dynamic *before* fMRI. <br> • *Aris:* Correlation will be **post-hoc** ("You fitted the neuro-data!"). <br> • *Elena:* Prediction will **beat chance** for precision (e.g., phase-locking in auditory cortex at θ band). |
  | **The "What Is It?" of Experience: Verbal or Ontological?** | "What it’s like" is a linguistic practice. Explaining *why* we *say* "red feels vivid" closes the case. | "What it’s like" has intrinsic structure. Explaining reports without that structure is like describing a symphony as "vibrations." | **Is the core disagreement verbal?** <br> (Aris: "Yes, ‘experience’ is a context-dependent label." <br> Elena: "No, there’s a ‘something’ we’re pointing to.") | *Both agree: This crux hinges on the others.* If Elena wins Prediction (↑) or Training (↑), it’s ontological. If Aris wins, it’s verbal. |

  ---

  ### **WHY THIS WORKS FOR YOUR SCENE**  
  - **The Blow-Up Triggers**: The "Predictive Power" crux is where Elena snaps: *"You’re reducing my life’s work to* labelling *!"* Aris fires back: *"You’re dressing up introspection in lab coats!"*  
  - **The Truce**: The joint statement forces them to concede ground (e.g., Aris admits training has value; Elena grants "fiction" was inflammatory).  
  - **The Live Wire**: The "Interviewer’s Role" crux mirrors their dynamic — Elena thinks Aris is contaminating subjects with skepticism; Aris thinks Elena’s "guidance" is suggestion.  
  - **The Ambiguity**: The verbal/ontological split hangs over everything. They agree on the *data* but not what it *signifies* — which is why they’ve been having the same fight since the 90s.  

  ---

  **Key for Your Draft**:  
  - **Aris’s Win Condition**: If trained reports show no unique neural signatures, or guided interviews leak bias.  
  - **Elena’s Win Condition**: If her predictions hit unseen neural targets, or trained reports converge on structures untrained ones miss.  
  - **The Stalemate**: They’ll never agree on whether "experience" is a *thing* or a *talk-thing*... but they’ll keep collaborating because the data is too compelling to walk away from.  

  This is the brittle détente your characters build — and the cracks in it fuel the blow-up. Good luck with the scene!
