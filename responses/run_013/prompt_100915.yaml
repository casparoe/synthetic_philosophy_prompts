answer: |-
  ### Diagnostic Tree for Metric Failures: Unpacking Goodhart's Law  
  *Answer the following questions about a specific case where targeting a metric led to unintended outcomes. Proceed down the tree until you reach a leaf (diagnosis).*

  ---

  #### **Start: Q1**  
  **Question:** Did the metric change significantly *because* it was made a target?  
  - **Yes** → Q2  
  - **No** → *Leaf: FUNCTIONING* (The metric is working; the goal was misdescribed or incomplete.)  
    *Example sorting: A city tracks "park access" by proximity to green spaces. Low-income areas show high access but residents avoid parks due to safety issues. The metric captures proximity, but the goal (actual park usage) was misdescribed.*  
    *Multi-leaf trigger: None (if the metric didn't change, only FUNCTIONING applies).*

  #### **Q2**  
  **Question:** Did agents (people, algorithms, or processes) deliberately alter their behavior to change the metric?  
  - **Yes** → Q3  
  - **No** → Q8  
    *Example sorting (Q2→Q8): A hospital targets "reduced readmission rates" by improving post-discharge care. Readmissions fall, but mortality rises because high-risk patients are diverted to hospice (no deliberate gaming).*  
    *Multi-leaf trigger (REG. and CAUSAL): A factory targets "unit production speed." Machines run faster (agent-driven), causing breakdowns (causal harm). But speed data is also cherry-picked from optimal conditions (regressional).*

  #### **Q3**  
  **Question:** Did agents exploit a gap between what the metric *measures* and the underlying goal?  
  - **Yes** → Q4  
  - **No** → Q7  
    *Example sorting (Q3→Q4): Police meet "arrest quotas" by targeting low-level offenses in high-crime areas, ignoring serious crimes elsewhere (exploits measurement gap).*  
    *Multi-leaf trigger (ADV. and CAUSAL): Teachers "teach to the test" (exploiting gap) *and* test-focused curriculum reduces critical thinking (causal harm).*

  #### **Q4**  
  **Question:** Did the manipulation leave the *actual state of the goal* unchanged (e.g., the problem persists but is hidden)?  
  - **Yes** → *Leaf: ADVERSARIAL* (Agents exploit the gap between measure and goal.)  
    *Example: Waiting-time targets met by holding patients in ambulances. Goal: reduce treatment delays → landed here (patients still wait; only location changes).*  
  - **No** → Q5  

  #### **Q5**  
  **Question:** Did the manipulation actively worsen the goal?  
  - **Yes** → Q6  
  - **No** → *Leaf: FUNCTIONING* (Agents improved the goal via unintended but benign methods; goal was narrow.)  
    *Example: Sales teams boost "customer contacts" by helping clients with non-sales issues. Revenue stays flat, but satisfaction rises → goal was misdescribed as "revenue," not satisfaction.*  

  #### **Q6**  
  **Question:** Did the metric change *cause* the goal to worsen?  
  - **Yes** → *Leaf: CAUSAL* (The metric is a cause of the goal; intervening on it moves the goal itself.)  
    *Example: Drug suppresses a biomarker (metric) but worsens patient outcomes → landed here. Not adversarial because the drug’s effect is biochemical (no "gaming" by agents).*  
  - **No** → *Leaf: ADVERSARIAL* (Worsening was collateral damage from gaming, not caused by the metric itself.)  

  #### **Q7**  
  **Question:** Was the metric driven to the extreme edge of its normal range?  
  - **Yes** → *Leaf: EXTREMAL* (Metric is reliable mid-range but noisy in tails; optimization pushes cases there.)  
    *Example: An e-commerce algorithm maximizes "click-through rate" by showing radical content. Engagement rises initially but alienates users long-term.*  
  - **No** → *Leaf: CAUSAL* (Metric and goal are causally linked; manipulation directly moves the goal.)  

  #### **Q8**  
  **Question:** Was the metric used to select cases for intervention (e.g., rewards, treatment, scrutiny)?  
  - **Yes** → Q9  
  - **No** → Q11  

  #### **Q9**  
  **Question:** Was the metric chosen *because* it predicted the goal in historical data?  
  - **Yes** → *Leaf: REGRESSIONAL* (Correlation was inflated by selection; the metric never reliably tracked the goal.)  
    *Example: Colleges admit students with high SATs (predictor of success). Admitted students thrive, but SATs lose predictive power because selection distorts the group.*  
  - **No** → Q10  

  #### **Q10**  
  **Question:** Did the metric change *after* selection?  
  - **Yes** → *Leaf: CAUSAL* (Intervention on the metric altered the goal.)  
  - **No** → *Leaf: DEFINITIONAL* (The metric was never a valid proxy; failure isn’t due to targeting.)  

  #### **Q11**  
  **Question:** Was the metric pushed far beyond typical values?  
  - **Yes** → *Leaf: EXTREMAL*  
  - **No** → *Leaf: DEFINITIONAL* (The metric never correlated with the goal; failure is definitional.)  
    *Example sorting (Q11→DEF.): A hiring tool uses "typing speed" to target "productivity." Slow typists hired via other metrics perform equally well → metric was always flawed.*  
    *Multi-leaf trigger (EXT. and DEF.): Optimizing "machine uptime %" leads to skipping maintenance. Uptime hits 99% but failures spike. If uptime was always a poor proxy for reliability, it’s DEFINITIONAL; if noise in extreme values causes misestimation, it’s EXTREMAL.*  

  ---

  ### Indistinguishable Pairs  
  The tree cannot separate:  
  - **ADVERSARIAL & CAUSAL**: When agents exploit a gap (adversarial) *and* their actions harm the goal via non-metric pathways (causal).  
    *Why*: Symptoms overlap (e.g., gaming worsens outcomes). Requires causal analysis to isolate mechanisms.  
  - **EXTREMAL & DEFINITIONAL**: When a metric fails at extremes due to noise (extremal) vs. inherent poor design (definitional).  
    *Why*: Hard to distinguish without pre-targeting validation data.  

  ---

  ### Question Order for Different Aims  
  - **Avoid misdiagnosis**: Start with Q1→Q2→Q3→Q4→Q5→Q6 (agent-centric path). Agents are common in metric failures; this path rules out gaming first.  
  - **Quickest fix**: Start with Q1→Q8→Q9→Q11 (selection/extremality path). Regressional/extremal failures often have faster remedies (e.g., adjust metrics).  

  ---

  ### Remedies Table  
  | Diagnosis      | Remedy                              | Remedy to Avoid         | Why Avoid for Resembling Diagnosis |  
  |----------------|-------------------------------------|-------------------------|-----------------------------------|  
  | **Adversarial**| Audit for gaming; close loopholes. | "Stop measuring"        | *For CAUSAL*: Ignores harmful causal links; auditing misses root cause. |  
  | **Causal**     | Use multiple metrics; decouple targets. | "Optimize harder"       | *For ADVERSARIAL*: Incentivizes more sophisticated gaming. |  
  | **Extremal**   | Cap metrics; use bounded proxies.  | "Collect more data"     | *For DEFINITIONAL*: Wastes effort; metric is fundamentally flawed. |  
  | **Regressional**| Recalibrate with post-selection data. | "Use same metric for bonuses" | *For FUNCTIONING*: Unnecessary if goal was misdescribed. |  
  | **Functioning**| Redefine the goal.                 | "Change the metric"     | *For DEFINITIONAL*: Obscures the need for a better proxy. |  
  | **Definitional**| Abandon metric; find a new proxy.  | "Adjust incentives"     | *For EXTREMAL*: Ignores that metric *could* work with bounds. |  

  ---

  ### Unoccupied Combinations  
  - **Causal + Functioning**: Incoherent. If the metric *causes* harm, it cannot be "functioning."  
  - **Regressional + Adversarial**: Unattractive. Selection bias rarely coexists with deliberate gaming without one dominating.  
  - **Extremal + Causal**: Unexplored. Cases exist (e.g., pushing a metric to extremes *triggers* harm), but literature conflates mechanisms.  
  - **Definitional + Functioning**: Incoherent. A definitionally broken metric cannot function correctly.  

  *These gaps highlight trade-offs: Some mechanisms are mutually exclusive (e.g., causal vs. functioning), while others (adversarial/causal) are under-theorized.*  

