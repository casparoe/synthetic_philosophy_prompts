prompt: |-
  I work on the practical-assessment side of a training programme that certifies wind-turbine maintenance technicians, and I have been handed the job of rebuilding our competency sign-off sheets. The problem is that our current sheets blur two very different things. A trainee can pass the written and oral portions — reciting torque sequences, describing lockout-tagout order, explaining why a gearbox overheats — and then, on the tower, stand at the hatch unable to move, or torque a bolt in the wrong order the moment the light is bad and someone is waiting on the radio. The reverse happens too: we have a technician who cannot tell you in words why he does what he does, who has never once been able to explain his reasoning, and who nevertheless walks past a nacelle and says the bearing is going and is right. Our sign-off sheet treats the first as competent and the second as a problem case, and I no longer believe either call is defensible. I have read a little about the distinction between knowing how and knowing that, and about the philosophers who insist the distinction collapses because knowing how is just a special case of knowing that something is so, and I have the nagging sense that this is exactly the tangle our sheet is caught in. What I want from you is not a summary of that debate but a working instrument.

  Please act as both a philosopher of knowledge and an assessment designer, and think carefully before you write anything — start by laying out for yourself what the live positions actually are and which of their distinctions can survive contact with a 45-minute practical assessment run by an assessor who has no philosophy training. Then give me a decision procedure my assessors can actually run, task by task: the questions to ask in order, what counts as sufficient evidence at each one, which steps are answered by observation and which by interview, where the procedure stops with a no, and where it must hand the decision to a human because the question has turned into one about what we value (reliability under pressure? breadth across models? the ability to teach an apprentice?). It should say plainly which of its steps are judgment calls dressed up as procedure, and it should be honest at the end about what it cannot do. Ground the whole thing in what the philosophy of knowledge genuinely has to say about the difference between being able to do something and knowing that something is the case — the regress worry about rule-following, the cases where someone seems to know how without being able to do it and to be able to do it without knowing how, and the question of whether an ability has to be reliable or transferable to a new situation before we call it knowledge. Assume the assessor has one shift, no video review, and no second opinion available, and that the programme director signs off on whatever the sheet produces.

  Then run the procedure end to end on three trainees. First, one who can recite every torque specification from memory and freezes at the hatch. Second, the one who diagnoses a failing bearing by ear and cannot explain himself. Third, one who performs flawlessly on our shop rig but has only ever touched one turbine model. I expect the procedure to give me at least one answer I will not like, and I would rather you tell me where it does than smooth it over. You do not need to cite anything; I want the reasoning, and I want it usable by someone standing on a service lift in the wind.
reasoning: |-
  Okay, the user works on assessing wind turbine technicians and is struggling with their current competency sign-off sheets. The sheets don't distinguish between theoretical knowledge ("knowing that") and practical ability ("knowing how"). They mention trainees who can recite procedures but freeze in real situations, and others who can diagnose issues intuitively but can't explain their reasoning. The user wants a practical assessment tool grounded in epistemology but usable by non-philosophers.

  Hmm, this is a fascinating challenge that bridges philosophy and practical assessment design. The core issue revolves around the distinction between propositional knowledge (knowing that something is true) and procedural knowledge (knowing how to do something). Philosophers like Ryle and Stanley have debated this, but for assessment purposes, the key is recognizing that these are separate but interdependent competencies.

  The user clearly needs an operational solution, not theoretical debates. Their pain points include: assessors without philosophy training needing clear procedures, time-limited field assessments (45 minutes), and real-world constraints like no video review. They also hint at deeper concerns about safety risks when technicians lack either type of knowledge.

  Right, the assessment tool must address three layers: 
  First, the epistemic layer - what constitutes valid evidence for each knowledge type. 
  Second, the operational layer - how to gather that evidence efficiently. 
  Third, the decision layer - where human judgment is unavoidable.

  For the epistemic design: Need separate tracks for "Verbal Demonstration" (theory) and "Performance Execution" (practice), each with distinct evidence standards. Must include "Integrated Application" where they combine both under pressure. Ryle's regress argument shows you can't reduce skills to rules - hence needing stress-test scenarios.

  For practical implementation: The procedure should have clear phases: Pre-task interview (theory), Observed execution (practice), Stress-test integration. Each phase must specify: what to ask/observe, pass/fail thresholds, and crucially - where judgment calls occur (e.g., "adequate explanation").

  Ah, and the three test cases are brilliant for stress-testing the design: 
  1) The theorist who freezes - should fail at execution despite acing interviews. 
  2) The intuitive diagnostician - should pass execution but fail theory, requiring senior review. 
  3) The model-specific performer - highlights transferability gaps, failing if the assessment includes unfamiliar models.

  Biggest challenge is the "intuitive" technician case. Philosophy shows ability without articulation exists (Polanyi's tacit knowledge), so the procedure must allow passing execution while flagging theory gaps for remediation. This meets the user's request to "give at least one answer you won't like" - accepting brilliant practitioners who can't teach.

  Final structure should be: 
  1) Position statement (epistemic basis) 
  2) Decision procedure (step-by-step) 
  3) Assessment guide (what counts as evidence) 
  4) Three trainee walkthroughs showing outcomes.

  Must emphasize that the sheet can't assess everything (e.g., long-term reliability) and that values-based calls (like whether to certify someone who can't teach) require human override.
answer: |-
  Here is a practical assessment instrument grounded in epistemic philosophy, designed for field use by non-philosophers. It separates *procedural competence* (ability to perform) from *declarative competence* (ability to articulate) and forces explicit judgment where they misalign.

  **Core Philosophical Grounding (for your assessor briefing):**
  1. **Knowing-how ≠ Knowing-that:** Following Ryle, performing an action (e.g., torqueing bolts correctly under stress) isn't reducible to stating rules (e.g., reciting torque sequences). One can exist without the other.
  2. **The Regress Problem:** Endless rules about rules are impossible. True competence requires internalized, context-responsive judgment.
  3. **Knowledge Requires Reliability:** An ability isn't "knowledge" if it only works once or under perfect conditions. It must be demonstrably reliable *in relevant contexts*.
  4. **Tacit Knowledge Exists:** Some knowledge (e.g., diagnosing bearing failure by sound) cannot be fully articulated but is valid if reliably demonstrated.

  **The Assessment Procedure: Task-Specific Sign-Off Sheet**
  *(Repeat for each critical task: e.g., Lockout-Tagout, Bolt Torquing Sequence, Bearing Diagnosis, Emergency Descent)*

  **Phase 1: Declarative Competence (Interview - 10 mins)**
  *   **Q1 (Recall):** "Walk me through the steps for [Task] on this model turbine."  
      *Sufficient Evidence:* Recites steps in correct order with key specs (torque values, safety intervals) ≥90% accurate.  
      *Failure:* Stop. Mark "Declarative Incompetent." Requires retraining.  
      *Judgment Call:* Minor spec errors corrected when prompted? If yes, proceed; note error.
  *   **Q2 (Rationale):** "Why is step [X] done *before* step [Y]?" / "What failure happens if we skip [Z]?"  
      *Sufficient Evidence:* Explains causal relationships (safety, mechanical function) without contradiction.  
      *Failure:* Proceed to Phase 2 but note "Declarative Gap: Rationale."
  *   **Q3 (Contingency):** "What if [realistic problem: e.g., light fails, comms static, unexpected vibration] during this task?"  
      *Sufficient Evidence:* Describes safe, procedure-compliant workaround or abort.  
      *Failure:* Proceed to Phase 2 but note "Declarative Gap: Contingency."

  **Phase 2: Procedural Competence (Observation - 20 mins)**
  *   **P1 (Baseline Execution):** "Perform [Task] now under normal conditions."  
      *Sufficient Evidence:* Executes all steps correctly, safely, in sequence without prompting.  
      *Failure:* Stop. Mark "Procedural Incompetent." Requires retraining.  
      *Judgment Call:* Single minor self-corrected error? Note and proceed.
  *   **P2 (Stressed Execution):** Introduce **one** controlled stressor:  
      *   Time pressure ("You have 10 mins"), OR  
      *   Environmental distraction (mild background noise, dimmed light), OR  
      *   Interruption ("Radio call: report status NOW").  
      *Sufficient Evidence:* Maintains safety and key procedure integrity (sequence, critical specs).  
      *Failure:* Mark "Procedural Gap: Stress." Proceed to P3.
  *   **P3 (Novelty Check):** *If feasible for the task:* Minor variation (e.g., "This bolt is stuck – show me your next 3 actions" or "This gauge reads abnormally – what do you check?").  
      *Sufficient Evidence:* Adapts correctly using core principles (safety first, mechanical logic).  
      *Failure:* Mark "Procedural Gap: Novelty."

  **Phase 3: Integrated Competence (Judgment - 15 mins)**
  *   **J1 (Alignment Check):**  
      *   If both Declarative (D) and Procedural (P) are **Fully Competent** → Sign off "Competent."  
      *   If **D Failed** but **P Passed** → Proceed to J2.  
      *   If **P Failed** but **D Passed** → Sign off "Not Competent." *(Philosophical Basis: Inability to perform is unsafe regardless of theoretical knowledge.)*  
      *   If both **Failed** → Sign off "Not Competent."
  *   **J2 (Tacit Knowledge Validation - FOR "P Passed, D Failed" ONLY):**  
      *   Focus on the gap (e.g., Rationale, Contingency). Ask: "Show me how you knew [X] during the task."  
      *   *Sufficient Evidence:* Points to relevant sensory cues, patterns, or physical indicators *during a repeat demo* (e.g., "I felt the vibration shift here," "The sound was too metallic").  
      *   *Pass (Judgment Call):* Sign off "Competent (Tacit)." Note: "Requires supervised field mentoring; cannot train others."  
      *   *Fail:* Sign off "Conditional Competent." Note specific gaps. Requires targeted declarative retraining.
  *   **J3 (Transferability Check - FOR "P Passed but ONLY on Known Models"):**  
      *   Assessor provides a key difference in a common unfamiliar model (e.g., "On Turbine Z, the access panel is here [points]. How would that change your approach to [Task]?").  
      *   *Sufficient Evidence:* Adjusts plan correctly based on core principles (e.g., "I'd isolate power here first instead because..." or "Same sequence, but reach from this angle").  
      *   *Pass:* Sign off "Competent."  
      *   *Fail:* Sign off "Limited Competent." Note: "Valid only on Model X/Y; requires model-specific checkout."

  **What This Instrument CANNOT Do:**
  1. Guarantee long-term reliability (only assesses snapshot).
  2. Assess ethical judgment or teamwork exhaustively.
  3. Replace experience-based mentorship.
  4. Resolve value conflicts about "ideal" technicians (e.g., "reliability under pressure" vs. "breadth"). *This requires program director input.*

  ---

  **Trainee Assessments Using the Procedure:**

  **Trainee 1: The Theorist (Aces Declarative, Freezes at Hatch)**
  *   **Phase 1 (Declarative):** Passes Q1, Q2, Q3 flawlessly. Mark: "Declarative Competent."
  *   **Phase 2 (Procedural):**  
      *   P1 (Baseline): Freezes at hatch, cannot initiate task.  
      *   **Failure:** "Procedural Incompetent."
  *   **Phase 3 (Judgment):** J1 - "P Failed, D Passed" → **Sign off: "Not Competent."**  
      *Why you won't like it:* They "know" everything intellectually but are unsafe in practice. Philosophy confirms: Performance failure = incompetence.

  **Trainee 2: The Intuitive Diagnostician (Cannot Explain, Always Right)**
  *   **Phase 1 (Declarative):**  
      *   Q1: Recites steps ~60% correctly, misses key specs. Mark: "Declarative Gap: Recall."  
      *   Q2: Cannot explain *why* steps matter. "Declarative Gap: Rationale."  
      *   Q3: Cannot articulate contingencies. "Declarative Gap: Contingency."  
      *   **Result:** Declarative Failed overall.
  *   **Phase 2 (Procedural):**  
      *   P1: Diagnoses bearing fault correctly via sound/vibration. Perfect execution of related shutdown.  
      *   P2 (Stressed): Maintains accuracy under time pressure.  
      *   P3 (Novelty): Correctly diagnoses similar fault on different bearing type.  
      *   **Result:** Procedural Competent.
  *   **Phase 3 (Judgment):**  
      *   J1: "D Failed, P Passed" → Proceed to J2.  
      *   J2 (Tacit Validation): Asked "Show me how you knew," they place hand on housing: "Hear that scrape? Like gravel." Points to vibration meter trend.  
      *   **Judgment Pass:** "Competent (Tacit)". Note: "Cannot train others; mentor on theory."  
      *Why you won't like it:* They pass despite failing the "knowledge" test. Philosophy demands this: their reliable, demonstrable ability *is* knowledge (tacit), even if unarticulated.

  **Trainee 3: The Model Specialist (Flawless on Shop Rig, One Model Only)**
  *   **Phase 1 (Declarative):** Passes Q1/Q2/Q3 for *their* model. Mark: "Declarative Competent."
  *   **Phase 2 (Procedural):**  
      *   P1: Flawless on known model.  
      *   P2: Maintains under stress.  
      *   P3 (Novelty): Given task on *unfamiliar* model (e.g., different gearbox access), uses wrong tool sequence, creating risk.  
      *   **Result:** "Procedural Gap: Novelty."
  *   **Phase 3 (Judgment):**  
      *   J1: Both D & P partially passed → Proceed to J3 (Transferability).  
      *   J3: Asked how to adjust procedure for the unfamiliar model's layout, they default to old method, failing to account for new hazards.  
      *   **Result:** "Limited Competent. Valid only on Model X."  
      *Why you won't like it:* They are safe *on known hardware* but the assessment flags their lack of transferable skill. Philosophy notes: Reliability in *new* situations is core to robust "knowing-how."

  **Final Note for Assessors:**  
  *   **"Competent (Tacit)" and "Limited Competent" are VALID outcomes.** They reflect real-world expertise distributions.  
  *   Your key judgment calls are in **J2 (Is this demonstrable tacit knowledge or luck?)** and **J3 (Is this adaptation principled or rote?)**.  
  *   **If in doubt, fail.** Safety tolerates false negatives better than false positives.

  This instrument forces explicit acknowledgment of the knowing-how/knowing-that divide, provides actionable outcomes, and makes unavoidable judgment calls visible – exactly where philosophy meets the turbine nacelle.
