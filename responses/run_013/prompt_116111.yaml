  The replacement cost is high: we must acknowledge that preventing miserable lives isn't automatically good when it erases whole modes of existence. But crucially, factory farm arguments survive because they target artificially created suffering, not natural processes. 

  Final verdict must isolate step 2 as the overextension - hence "Prevention Fallacy" captures how it mistakes absence of suffering for positive value when applied to autonomous systems.
answer: |-
  The argument fails at step (2): **"If a life is net negative, the world is better if that life is never lived."** This premise overgeneralizes by ignoring context-dependent moral constraints and conflates *preventing suffering* with *imposing nonexistence* as an unqualified good.

  ### Why (2) looks innocent:
  - It mirrors intuitive cases like factory farming: Preventing the birth of a calf condemned to short, painful confinement *does* seem good. The suffering is *artificially created and sustained* by humans for trivial gain.  
  - Utilitarian aggregation makes it seem obvious: Fewer negative experiences = better world.

  ### The error: The "Prevention Fallacy"  
  Step (2) assumes that preventing a net-negative life is *always* a benefit, regardless of **agency, ecosystemic role, or the nature of the suffering**. This ignores:
  - **Moral patienthood vs. moral agency**: While we may have duties to *reduce suffering we cause* (e.g., factory farms), we lack a duty to *eliminate all suffering* by erasing its subjects. Wild suffering arises from natural processes, not human imposition.  
  - **Instrumental value of ecosystems**: Destroying habitats eliminates not just suffering individuals, but the evolutionary potential, ecological functions, and aesthetic/intrinsic value of entire lineages.  
  - **Slippery slope to omnicide**: If eliminating net-negative lives is good, consistency demands exterminating all sentient life (since humans too experience net suffering). This is self-defeating for any value system.  
  - **Non-identity problem nuance**: While "benefitting" nonexistent beings is incoherent, *avoiding harm* to future beings makes sense *if* we have specific obligations to them (e.g., not creating factory farms). No such obligation exists for autonomous ecosystems.

  ### The cost:  
  You must accept that **preventing a net-negative life is only a benefit when:**  
  (A) The suffering is *directly caused or perpetuated by moral agents* (e.g., factory farms), *or*  
  (B) The prevention aligns with broader values (e.g., ecosystem stability, biodiversity) that outweigh suffering reduction.  

  This blocks the argument for habitat destruction (step 6) and extermination (step 7), as neither satisfies (A) or (B).  

  ### Salvaging factory farm cases:  
  Preventing factory-farm births *remains* good under (A): Humans deliberately design these conditions. Our complicity creates a duty to avoid causing such suffering. Wild animals, by contrast, exist independently of our actions.  

  ### Other implications:  
  - **Wild animal interventions**: Helping wild animals (e.g., vaccinating) may be good *if* it reduces suffering without ecological harm—but extermination violates (B).  
  - **"Replacement" objection**: Even if destroyed animals are replaced, premise (2) is still false—so replacement doesn't resolve the core issue.  
  - **Crowding effect**: This may worsen outcomes, but the fundamental flaw is in (2), not contingent effects.  

  Verdict: Step 2 — Prevention Fallacy
