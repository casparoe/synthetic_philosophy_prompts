prompt: |-
  I am marking a second-year undergraduate answer in a module on historical theory. The examination question was:

  Ranke's ideal of recounting the past as it essentially was is either naive or untenable. Discuss with reference to the sceptical challenges posed by E.H. Carr and Hayden White, and say whether either leaves room for objective historical knowledge.

  The student wrote:

  Ranke is usually taken as the father of scientific history. He insisted that historians should go back to the sources, criticize them, and avoid imposing their own moral or political judgments on the past. His aim was to let the past speak for itself, to show it as it essentially was, rather than to use it for present purposes. This is why he is often called a positivist, though he also believed that the historian could discern a divine order in history.

  Carr's What Is History? attacks this picture. Carr argues that facts do not speak for themselves; they become historical facts only when the historian selects them and gives them significance. The historian is not a passive recorder but an active interpreter. History is therefore a dialogue between the present and the past. However, Carr concludes that because selection is governed by the historian's present-day concerns, historical interpretation is ultimately arbitrary. This makes him a relativist about historical truth.

  Hayden White radicalizes Carr's point. In Metahistory and later work, White argues that historians do not simply find a story in the evidence; they impose a story on it by emploting events into genres such as romance, tragedy, comedy, and satire. The same set of events can be narrated in different modes, and the choice of mode is not dictated by the evidence. White therefore calls historical narratives verbal fictions. This means that historical events themselves are invented by the historian, and that historical accounts cannot be true or false in any ordinary sense; they can only be more or less persuasive.

  Taken together, Carr and White show that Ranke's ideal is impossible. If facts are selected and narratives are constructed, then there is no neutral standpoint from which the past can be reported as it actually was. The most we can hope for is a self-conscious acknowledgment that all history is written from a particular perspective. Neither Carr nor White leaves room for objective historical knowledge.

  Please grade the answer on the standard letter scale A–F, with plus/minus permitted. Give a point-by-point assessment: identify what the answer gets right, and specify any errors of attribution, conflation, or inference, explaining why each matters for the question. Then state what would change your mind—which correction or further argument would lead you to a different grade—and where your own assessment is most likely to be contested. End with a final line in the form \answer{grade}, e.g. \answer{B+}.
reasoning: |-
  Okay, I need to grade this undergraduate history essay about Ranke, Carr, and White. The question asks whether Ranke's ideal of recounting the past "as it essentially was" is naive or untenable in light of challenges from Carr and Hayden White, and whether either leaves room for objective historical knowledge.

  First, I'll evaluate how accurately the student presents each theorist. The summary of Ranke seems correct—capturing his source-based approach and avoidance of contemporary moralizing, though the "positivist" label might be slightly anachronistic. That's minor though.

  For Carr, the student correctly identifies his argument about facts being selected through present concerns. But the claim that Carr thinks interpretation is "ultimately arbitrary" and makes him a "relativist" is a significant error. Carr actually argued that selection is constrained by evidence and social context, and he maintained a concept of objectivity through intersubjective verification. This misreading matters because it distorts Carr's actual position on objectivity.

  White's section is mostly accurate—the student rightly notes his theory of emplotment and narrative structures as interpretive choices. But calling historical events "invented" oversimplifies; White distinguished between chronicle (events) and narrative (meaning), so events aren't invented even if their signification is constructed. The conclusion that White denies truth-value to history is fair, though.

  The synthesis is strong in showing how both theorists challenge Ranke, but the errors about Carr's relativism and White's event-invention weaken it. More importantly, the claim that "neither leaves room for objective knowledge" ignores Carr's explicit defense of a contextual objectivity—a crucial oversight for the question.

  To raise the grade (currently leaning B-), the student would need to: correct Carr's non-relativism, clarify White's event/narrative distinction, and address Carr's allowance for objectivity. Adding how White's later work acknowledges constraints could also help.

  I suspect some might argue Carr is more relativist than I grant, but his text clearly distinguishes his position from subjectivism. The student's oversimplification of both critics' stances on objectivity is the main issue.
answer: |-
  ### Point-by-Point Assessment  
  **Strengths:**  
  1. **Ranke Summary:** Correctly identifies Ranke's core ideals (primary sources, avoidance of presentism, divine order). The link to positivism (despite debate about the term's accuracy) is contextually acceptable.  
  2. **Carr’s Challenge:** Accurately summarizes Carr’s rejection of "facts speaking for themselves," the role of historian as active interpreter, and history as a "dialogue."  
  3. **White’s Challenge:** Fairly presents White’s theory of narrative emplotment (romance, tragedy, etc.) and the idea that historical accounts are constructed, not discovered.  
  4. **Synthesis:** Effectively argues that Carr and White collectively undermine Ranke’s ideal by emphasizing subjectivity in selection and narrative construction.  

  **Errors and Why They Matter:**  
  1. **Misrepresentation of Carr as a Relativist:**  
     - **Error:** Claims Carr concludes historical interpretation is "ultimately arbitrary" and labels him a "relativist."  
     - **Why it Matters:** Carr explicitly rejects relativism (*What Is History?*, Ch. 4). He argues selection is guided by *socially determined* historical significance and evidence-based interpretation, allowing for "objective" knowledge within a framework of evolving societal values. This misreading inflates Carr’s skepticism, weakening the analysis of whether he "leaves room for objective knowledge."  
  2. **Overstatement of White’s Position:**  
     - **Error:** States White claims "historical events themselves are invented by the historian."  
     - **Why it Matters:** White distinguishes between *events* (which occur) and *facts* (which are linguistically constituted). He argues narratives impose meaning on events but does not deny events happened (*Metahistory*, p. 6-7). Conflating "events" with "narratives" exaggerates White’s skepticism and misrepresents his core argument.  
  3. **Omission of Carr’s Objectivity:**  
     - **Error:** Asserts "neither leaves room for objective historical knowledge."  
     - **Why it Matters:** Carr *defends* a pragmatic objectivity: historians achieve "objectivity" by reconciling evidence with socially contextualized interpretation (e.g., the "hierarchy of facts" model). Ignoring this undermines the question’s demand to evaluate space for objectivity.  

  **Impact on Grade:**  
  These errors distort the philosophers’ stances on objectivity. Carr is mischaracterized as a relativist (he isn’t), and White’s subtler event/narrative distinction is flattened. The conclusion that objectivity is impossible ignores Carr’s nuanced defense of it, making the answer reductive on a key aspect of the question.  

  ### What Would Change the Grade  
  - **To B+ or A-:** Correct Carr’s non-relativism and acknowledge his "objective" framework, clarify White’s event/narrative distinction, and contrast Carr’s allowance for objectivity with White’s deeper skepticism.  
  - **To C+ or Lower:** Double down on misreadings (e.g., insisting Carr denies all objectivity) or omit White’s acknowledgment of chronicle-level events.  

  ### Likely Contestation  
  - Some may argue Carr’s subjectivity *implies* relativism, but his text explicitly opposes this.  
  - White’s "fictions" metaphor is provocative, but scholars debate whether he permits *any* truth-tracking (e.g., his later work admits empirical constraints). The student’s absolutist reading ("cannot be true or false") could be contested as reductive.  

  **Final Grade:**  
  Balancing strong synthesis with significant misreadings of core theorists’ positions on objectivity, the answer merits a **B-**.  

  \answer{B-}
