prompt: |-
  ok so my history teacher Ms. Petrova grades group projects in a way that makes no sense to me, and we're starting a new one next month, so I want to figure out her actual rule before I find out the hard way.

  Everything I've got from the last two years:

  - Dev's group turned in a genuinely great final project and Dev did basically nothing. She gave him a C and told him you don't get credit for work you didn't do. He was also the one who did the whole presentation, so it's not like she just rewards whoever talks.
  - Rosa's group completely misread the assignment and their project was a mess, but Rosa had rewritten the entire thing overnight trying to save it, and Ms. Petrova gave her an A and said she'd done everything she could.
  - The assignment sheet literally says all members get the same grade on the final product, and she told us she'd follow it. She didn't for Dev.
  - Bianca was sick for the last week and a half and missed all the final prep, but she'd done her chunk early, so she got full credit.
  - Omar did a normal, solid, unspectacular part and got an A-.

  (We also have to fill out one of those peer eval sheets where you split 100 points between the group, and I honestly dont know if that even counts for anything.)

  She always says she grades the work and not the effort, which doesnt fit Rosa as far as I can tell, but who knows.

  The thing driving me crazy is that in every one of those cases, how hard the person tried and how much they actually ended up putting into the final product went together. So there's more than one rule that would spit out the same answers on all five cases and I can't tell which one she's running.

  Here's my problem. Next month my group is probably going to vote to switch topics halfway through, and if that happens my whole section gets cut even though I'll of worked on it all weekend. So my effort will be huge and my contribution to the final thing will be zero.

  What grade am I getting? Which rule do you think she's really running, and what makes you pick it over the others that fit? And if you could design one more case for me to ask her about that would rule out the leftover options, what would it be?
reasoning: |-
  Hmm, the user is trying to figure out their history teacher Ms. Petrova's grading system for group projects. They've provided several examples from past projects where the grading seemed inconsistent with the stated rules. 

  Looking at these cases:
  - Dev did nothing but presented and got a C instead of the group grade
  - Rosa rewrote the whole project last minute and got an A despite the group failing
  - Bianca got full credit despite missing final prep because her part was done early
  - Omar got A- for normal contribution
  - The assignment says all get same grade but Dev didn't

  The user needs to predict their own grade in a scenario where their group changes topics mid-project, making their completed work worthless despite high effort. 

  The key paradox is Ms. Petrova saying she grades "the work not the effort" but Rosa's case clearly rewards effort over outcome. 

  Possible grading rules I'm considering:
  1. Effort-based grading (but contradicts her statement)
  2. Contribution to final product (but Dev presented and got C)
  3. Hybrid approach weighing both
  4. Using peer evaluations secretly

  Bianca's case suggests completed work matters more than presence. Omar's case implies baseline competence is sufficient. 

  For the user's scenario: high effort but zero final contribution → similar to Dev? But Dev presented (final contribution) and still got C. Rosa had high effort and got rewarded. 

  The peer evaluations might be the hidden factor - perhaps she uses them to adjust grades when effort and contribution diverge. 

  To design a test case: need a scenario where effort and final contribution are completely decoupled. Like someone who worked hard on discarded material vs someone who slacked but their part made it in. 

  User's anxiety is palpable - they're trying to game the system to protect their grade. Smart but risky. The emotional subtext is fear of unfair evaluation. 

  Most plausible theory: Ms. Petrova secretly prioritizes effort when the final product fails, but holds individuals accountable when the group succeeds without them. The peer evals might cover the middle ground. 

  For the user: if their work gets discarded, it resembles Rosa's situation (high effort, product failed) so possibly rewarded? But only if they document everything. 

  Test question suggestion: "If someone works hard on research that the group later replaces with better sources, does that initial work count?"
answer: |-
  Based on your cases, Ms. Petrova has a clear (but unspoken) grading rule that prioritizes **demonstrable individual contribution that survives to the final product OR exceptional effort when the group fails**. The rule conflicts with her stated policy, but the evidence is consistent. Here's the breakdown:

  ### The Rule I Think She's Using:
  **"Students earn credit for work that materially contributes to a successful final product OR demonstrates exceptional individual effort to salvage a failing group project. Peer evaluations may adjust this when contribution is disputed."**

  ### Why This Rule Fits All Cases:
  1.  **Dev:** Did *nothing* contributing to the **successful final product**. His presentation was delivery, not creation. Effort was low. → **C (penalized)**.
  2.  **Rosa:** Group project was a **failure**, BUT she demonstrated **exceptional individual effort** trying to salvage it. → **A (rewarded for effort in failure)**.
  3.  **Bianca:** Her **completed work** (her "chunk") **materially contributed** to the **successful final product**, even if she missed final prep. → **Full Credit**.
  4.  **Omar:** Did a **normal, solid part** that **materially contributed** to the (presumably successful) final product. → **A-** (reflecting solid, unspectacular contribution).
  5.  **Stated Policy vs. Reality:** Her rule prioritizes demonstrable *individual* work over the group product grade when contribution is uneven or effort is extreme. The "same grade" policy likely applies *only* when contributions are roughly equal and the project is successful, OR it's overridden by her individual assessment/peer evals.

  ### Why I Pick This Rule Over Others
  *   **Effort vs. Work:** Rules based *purely* on effort fail Dev (low effort) and Omar (normal effort gets A-). Rules based *purely* on the final product fail Rosa (failed project, got A) and Dev (successful project, got C). The hybrid rule explains all.
  *   **Final Product Contribution:** Rules requiring *only* contribution to the final product fail Rosa (tried to contribute, but project failed). Rules requiring contribution *and* effort fit, but Rosa shows effort can override lack of final product success.
  *   **Peer Evals:** They likely matter *when contribution is ambiguous*. Dev probably got terrible peer evals confirming his lack of work. Rosa probably got stellar ones confirming her effort. Bianca's work was done, Omar's was solid – peer evals likely matched. They are the tie-breaker or supporting evidence.

  ### Your Scenario & Predicted Grade
  *   **Situation:** You work hard ("all weekend"), but your entire section gets cut due to a topic change. **Effort is high, contribution to the final product is zero.**
  *   **Analysis:** This is **closest to Rosa's situation, but with a critical difference:** Rosa's effort was *directly applied to the final submitted product*, even though it failed. Your effort was *discarded* before submission and didn't reach the final product.
  *   **Prediction:** **Likely a C or C- (similar to Dev).** Why?
      *   Your work **did not contribute** to the final product (like Dev).
      *   While your effort was high, it was **not "exceptional effort" applied to *saving* the *final* product** (like Rosa). Your effort was on work that was replaced *before* the final crunch. It wasn't a salvage attempt.
      *   Unless you have proof you tried *desperately* to stop the topic change or integrate your work somehow (like Rosa's overnight rewrite), Ms. Petrova will likely see discarded work as non-contribution.
      *   **Peer Evals Crucial:** If your group *knows* you did the work and it was cut unfairly, and they give you high peer eval points, you *might* get a better grade (B-/B). But if they split points evenly or blame the cut work, it reinforces the low grade.

  ### The Critical Test Case to Ask Ms. Petrova
  You need a scenario that distinguishes **high effort on discarded/irrelevant work** from **high effort directly applied to a failing final product**.

  **Ask Her This:**
  > "Ms. Petrova, imagine two scenarios for a group project:
  >
  > 1.  **Student A:** Works very hard researching and drafting a section early on. Midway through, the group completely changes direction based on new information, making Student A's entire section unusable and irrelevant to the *final* project. Student A participates fully on the new topic, doing an average share of the new work. The final project is successful.
  > 2.  **Student B:** The group realizes very late their project is deeply flawed and off-track. The night before it's due, Student B works alone for 10 hours straight, rewriting almost the entire project in a desperate attempt to fix it. The rewritten project is submitted but is still poor quality and receives a low grade.
  >
  > Based on your grading principles, what grade would Student A and Student B likely receive, and why? Would the fact Student A's work was completed and good (but discarded) matter? Would Student B's effort matter even though the final project still failed?"

  ### Why This Test Case Rules Out Alternatives
  *   **Clarifies Effort vs. Contribution:** Directly pits high effort on discarded work (A) vs. high effort on the final failing product (B).
  *   **Clarifies "Work" vs. "Effort":** Does "work" mean *completed tasks* (even if discarded) or *contribution to the submitted product*? Does "effort" only count if applied to the *final submitted version*, even if it fails?
  *   **Compares to Known Cases:**
      *   If A gets a low grade (like Dev) and B gets a high grade (like Rosa), it confirms the rule: **Credit requires contribution to the final product OR effort directly applied to salvaging that final product.** Discarded effort doesn't count.
      *   If A gets a decent grade (arguing their work was done) and B gets a low grade (arguing the final product failed), it suggests a different rule (e.g., rewarding completed tasks regardless of use).
      *   If A gets a low grade and B gets a low grade, it leans towards pure final product contribution mattering most, contradicting Rosa's A.
      *   If A gets a high grade and B gets a high grade, it leans heavily towards pure effort grading, contradicting Dev's C and her "work not effort" statement.

  **Your Immediate Action:** Document your work meticulously *as you do it* (drafts, timestamps, emails to group). If the topic changes, clearly communicate your completed work to your group and Ms. Petrova *immediately* ("I've completed X research/outline/draft on the original topic based on Y sources. Let me know how best to integrate this or adapt it for the new direction"). This creates evidence of your effort and contribution *attempt*, potentially helping your case with peer evals or if Ms. Petrova has any flexibility. Good luck!
