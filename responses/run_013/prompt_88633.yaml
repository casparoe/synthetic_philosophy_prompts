prompt: |-
  Second-year PhD in econ, game theory, and there's a pattern in iterated elimination I keep bumping into -- not sure if it has a name or if I'm conflating two seperate things. Sometimes the only way to knock out a strategy is with a mixed strategy: no single pure alternative beats it against everything the opponent might do, but a coin-flip between two others does, so I delete it. But the strategies in that coin-flip are ones I delete later anyway, so by the end my original reason for the first deletion has evaporated. And if I do the deletions in a different order I can land on a different surviving set, so it isn't cosmetic. Is there a name for the move where an elimination is licensed by a mix of strategies that later get eliminated themselves? Is that the same thing as the order-dependence, or a different thing? And is there a standard distinction between being beaten by a pure alternative and being beaten only by a mix -- and does that line up with the order-independence I'm told strict dominance has but weak dominance doesnt? Honestly I don't care about the label if there is one; what I want is the carving: what this is, what it isn't, and where the edges are.
reasoning: |-
  Okay, let me try to unpack this PhD student's question about iterated elimination in game theory. They're describing a specific pattern they've noticed where a strategy gets eliminated because it's beaten by a mixed strategy, but the pure strategies in that mix later get eliminated themselves. This leads to order-dependence in the elimination process, and they're wondering about the underlying mechanics and terminology.

  First, I need to recall the fundamentals of iterated elimination. There's strict dominance where one strategy always gives a better payoff than another, regardless of opponents' actions. Then there's weak dominance, which is more nuanced - one strategy is at least as good and sometimes better. The key difference is that strict dominance gives order-independent results, while weak doesn't.

  The student mentions that sometimes a strategy isn't beaten by any single pure strategy but requires a mixed strategy to dominate it. That makes sense because mixed strategies can create dominance relationships that pure strategies alone can't. The interesting twist is when those mixed strategies get eliminated later, making the initial elimination seem invalid in hindsight.

  I should distinguish between the two types of dominance clearly. Weak dominance by a pure strategy is different from dominance that only appears through mixing. The former can lead to order-dependence, but the latter introduces another layer of complexity. The student is right to connect this to the non-transitivity issue - where A dominates B only through a mixed strategy involving C, but C itself gets dominated later.

  The core of their confusion seems to be about why an elimination based on a "temporary" mixed strategy is valid, especially when the components disappear. I need to explain that each elimination step is context-dependent - it only considers the current strategy set. So when we eliminate a strategy because it's weakly dominated by a mixed strategy at that stage, it's legitimate even if those mixed components later become irrelevant.

  About terminology, I recall that "weak dominance" covers both pure and mixed cases. The key distinction is whether dominance holds strictly or weakly. The order-dependence in weak dominance (whether pure or mixed) comes from the "sometimes equal" part, which allows different elimination paths.

  For carving the concepts, I should emphasize three levels: the necessity of mixing for dominance, the transitivity (or lack thereof) of dominance relations, and the temporal aspect of iterated elimination. The student's observation touches on all three. The "edge" cases occur precisely when mixed strategies are needed to break ties, creating fragile dominance chains that depend on elimination order.

  I wonder if they've encountered specific games where this happens, like the Dekel-Fudenberg procedure or examples by Marx/Shimoji. Those are perfect for illustrating how mixed strategy dominance interacts with iterated elimination. The student might find it helpful to work through such concrete examples to see the mechanics in action.

  The philosophical point is important too - iterated elimination isn't about finding the "true" surviving set but about different paths of reasoning. Some orders preserve more strategies, some less. That's why weak dominance is tricky; it encodes assumptions about how players resolve indifference.
answer: |-
  You've hit on a beautifully subtle and important point in iterated elimination, especially concerning weak dominance and mixed strategies. This isn't just cosmetic order-dependence; it's a fundamental consequence of how dominance works when mixing is involved and transitivity breaks down. Let's carve it up.

  **Core Concepts & Carving:**

  1.  **The "Move" Itself: Weak Dominance by a Mixed Strategy (Often Necessary):**
      *   **What it is:** A strategy `s_i` for player `i` is **weakly dominated** by another strategy (pure or mixed) `σ_i` if `σ_i` yields player `i` a payoff *at least as good as* `s_i` for *every* possible strategy profile `s_{-i}` of the other players, and *strictly better* for *at least one* `s_{-i}`.
      *   **The Key Nuance:** Sometimes, `s_i` is **not** weakly dominated by *any single pure strategy*. However, it **is** weakly dominated by a **mixed strategy** `σ_i` (e.g., a coin flip between `p_i` and `q_i`).
      *   **Why it Happens:** `s_i` might be "ok" against everything (`p_i` beats it against some profiles, `q_i` beats it against others, but neither beats it against *all*), but the *average* payoff of `σ_i` (or its ability to exploit specific opponent plays) makes it weakly dominant.
      *   **The Move:** Eliminating `s_i` because it's weakly dominated by `σ_i` (which is a mix of `p_i` and `q_i` in your example).

  2.  **The "Evaporating Reason": Non-Transitivity of Weak Dominance (Especially w/ Mixing):**
      *   **The Problem:** Weak dominance is **not transitive**. If `A` weakly dominates `B`, and `B` weakly dominates `C`, it does **not** follow that `A` weakly dominates `C`. This is starkly different from strict dominance.
      *   **How it Manifests:** You eliminate `s_i` because it's weakly dominated by mixed `σ_i = αp_i + (1-α)q_i`. Later, you discover that both `p_i` and `q_i` are themselves weakly dominated (possibly by other strategies, pure or mixed, or even eliminated because `σ_i` itself becomes dominated later!) and get eliminated. The *specific reason* (`σ_i`) for eliminating `s_i` "evaporates" because `σ_i` is no longer present.
      *   **Why it's Valid (Procedurally):** Iterated elimination is a *step-by-step* procedure. At the step where `s_i` is eliminated, `σ_i` (and its components `p_i`, `q_i`) are *currently* in the game. `σ_i` *does* weakly dominate `s_i` *relative to the current strategy set of the opponents*. That's sufficient justification for elimination *at that step*. What happens *later* to `σ_i`, `p_i`, or `q_i` doesn't retroactively invalidate the elimination *based on the information available at that earlier step*. The procedure is myopic.

  3.  **Order-Dependence: The Root Cause & Consequence:**
      *   **Why Different Orders Lead to Different Results:** The non-transitivity and the potential reliance on mixed strategies that themselves might be dominated create multiple valid elimination paths. The choice of which weakly dominated strategy (pure or mixed) to eliminate first determines which strategies remain available to dominate others later.
      *   **Connection to the "Evaporating Reason":** This phenomenon is a *direct symptom* of the order-dependence inherent in iterated weak dominance. If you eliminate a strategy `d` early because it's dominated by a mixed strategy involving `a` and `b`, but in a different order `a` and `b` get eliminated *before* anyone considers dominating `d`, then `d` might *never* get eliminated! Different orders explore different dominance relationships that are only possible with specific sets of strategies present.
      *   **Strict vs. Weak Distinction:** This is **precisely** where strict dominance differs fundamentally.
          *   **Strict Dominance:** If `A` strictly dominates `B`, then `A` strictly dominates `B` *regardless of what other strategies are eliminated*. Strict dominance is transitive. The order of elimination *cannot* change the final set of surviving strategies under iterated strict dominance (ISD). A strategy strictly dominated *only* by mixes that later vanish would be impossible under ISD because strict dominance by a mixed strategy implies strict dominance by at least one pure strategy in its support (a key theorem).
          *   **Weak Dominance:** As you've discovered, order *matters immensely* for iterated weak dominance (IWD), precisely because of non-transitivity and the potential reliance on mixes that might later be eliminated. The "evaporating reason" is a hallmark of IWD.

  4.  **Distinction: Beaten by Pure vs. Only by Mix:**
      *   **Beaten by Pure:** Strategy `s_i` is weakly/strictly dominated by a single pure strategy `p_i`.
      *   **Beaten Only by Mix:** Strategy `s_i` is *not* weakly dominated by *any* pure strategy, but *is* weakly dominated by at least one mixed strategy `σ_i`.
      *   **Significance:** This distinction is crucial for understanding the *structure* of the game and the *necessity* of considering mixed strategies even during elimination. A strategy beaten "only by mix" indicates a more complex payoff interaction where no single pure alternative covers all opponent plays as well as the mix does. This is often the source of the fragility leading to order-dependence. A strategy beaten by a pure strategy might be more "robustly" dominated.

  **Carving Summary & The Edges:**

  *   **What this is:**
      *   A core feature of **Iterated Weak Dominance (IWD)**.
      *   A consequence of the **non-transitivity of weak dominance**.
      *   A demonstration of the **procedural, myopic nature** of iterated elimination (decisions based only on the *current* strategy set).
      *   A situation where **mixed strategies are necessary** to establish dominance relationships that pure strategies cannot.
      *   The **primary mechanism causing order-dependence** in IWD outcomes.
      *   An example of **path-dependence** in solution concepts.

  *   **What this isn't:**
      *   **Not a feature of Iterated Strict Dominance (ISD):** ISD is order-independent and transitive. Strategies dominated "only by mixes that later vanish" don't occur because strict dominance by a mix implies strict dominance by a pure strategy in the support.
      *   **Not necessarily a mistake in the procedure:** Eliminating based on a mixed strategy `σ_i` that exists *at the time* is valid, even if `σ_i` or its components get eliminated later. The reason is contextual to that step.
      *   **Not just "cosmetic":** As you observed, different orders genuinely lead to different surviving sets, reflecting different chains of reasoning about dominance.

  *   **Where the Edges Are:**
      *   **The Edge of Necessity:** The phenomenon arises specifically when a strategy is dominated *only* by a mixed strategy (not by any pure one). If a pure dominator exists, it might lead to less fragile elimination.
      *   **The Edge of Transitivity:** The core issue is the *breakdown* of transitivity in weak dominance, especially when mixing bridges non-transitive gaps (`s_i` dominated by mix `σ_i` involving `p_i`/`q_i`; `p_i` dominated by `r_i`; but `r_i` does *not* dominate `s_i`).
      *   **The Edge of Order:** The phenomenon manifests as order-dependence. The "evaporating reason" is a *symptom* observed along one path of a fundamentally order-dependent process.
      *   **The Edge of Solution Concepts:** This highlights why IWD is often considered less robust than ISD or Nash equilibrium for prediction. The surviving set depends on the assumed order of elimination (the assumed order of reasoning about dominance). Procedures like the **Dekel-Fudenberg** (one round of weak dominance followed by iterated strict dominance) or **Iterated Admissibility** (careful handling of weak dominance) were developed partly to address these issues.

  **In essence:** You've identified the intricate dance between weak dominance, mixed strategies, non-transitivity, and the step-by-step nature of iterated elimination. The "evaporating reason" is a valid consequence of using IWD, stemming from the reliance on mixed strategies for dominance *at a specific step* and the subsequent elimination of the components of that mix *later*, combined with the inherent order-dependence of the overall process. It's not a separate "move" with a specific name beyond being part of IWD using mixed strategies; it's a *manifestation* of the core properties of weak dominance. To understand its boundaries, focus on the necessity of mixing for the initial dominance and the breakdown of transitivity.

  **To explore further:** Look at classic examples demonstrating order-dependence in IWD (e.g., games by Marx and Shimoji, or the Dekel-Fudenberg motivation). Analyze them specifically focusing on *when* mixed strategies are needed for elimination and track what happens to those mixed strategies later. This will solidify the carving.
