prompt: |-
  I'm a novelist at work on a book whose two protagonists are philosophers who have spent their careers circling the same question: what follows, if anything, from the fact that you exist. For a chapter built around a document they compose together, I need the genuine article rather than a paraphrase — the joint statement of an adversarial collaboration between a self-sampling theorist, who holds that you should reason as if your present observer-moment were a random draw from all the observer-moments in your reference class, and a self-indication theorist, who holds that the bare fact of your existence is evidence that there are more observers rather than fewer.

  Write that document. Begin with a numbered list of the claims both sides can sign — about what indexical evidence can and cannot establish, about what the doomsday argument actually presupposes, and about the reference class problem. Follow it with a table of the residual disagreements, each written in wording its own side would accept, and then the cruxes, giving for each one the case or argument both sides would agree bears on it, with each side's prediction recorded in advance.

  The document must confront two things. First, the presumptuous philosopher, who claims to establish from his armchair, by his existence alone, that the cosmos contains vastly many observers rather than few: each side must say whether he is reasoning well. Second, a case I have invented and want them to adjudicate, which I call the Carbon Copies. A coin is tossed: on heads, exactly one observer is created, with a particular stream of experience; on tails, one hundred observers are created, each an exact duplicate of the first, with numerically identical experiences, so that nothing from the inside tells them apart. You are one of the observers, and you know the setup. State what each side predicts you should conclude about the coin, and say whether the two predictions diverge here for a reason that reaches the deeper dispute or merely because of how each side counts observers.

  Keep the prose spare and the disagreements exact. Write in American English.
reasoning: |-
  We are writing a joint statement from two philosophers: a self-sampling theorist (SST) and a self-indication theorist (SIT). The document will have three parts: a numbered list of agreed claims, a table of residual disagreements (with wording acceptable to each side), and a section on cruxes (with cases and predictions).

  Agreed Claims (Numbered List):
  1. **Indexical evidence cannot establish non-indexical facts without additional assumptions.** 
     - Both agree that the mere fact of one's existence cannot directly establish objective facts about the world (e.g., the total number of observers) without a framework for interpreting indexical information.

  2. **The Doomsday Argument (DA) presupposes a fixed reference class and a specific sampling assumption.**
     - Both agree that the DA relies on the idea that one's birth rank is a random sample from the total number of humans that will ever exist. However, they disagree on the validity of the sampling assumption.

  3. **The reference class problem is unsolved and critical.**
     - Both agree that defining the reference class (the set of observer-moments to which one belongs) is a major challenge and that different choices can lead to different conclusions.

  4. **Existence is evidence, but its evidential weight is disputed.**
     - Both agree that the fact of one's existence provides some evidence, but they disagree on how to quantify that evidence.

  5. **The Presumptuous Philosopher case reveals a fundamental disagreement.**
     - Both agree that the Presumptuous Philosopher (who claims that his existence alone proves the cosmos is large) is a key test case, but they disagree on whether his reasoning is sound.

  Residual Disagreements (Table):
  We present a table with two columns: one for the SST and one for the SIT. Each row contains a disagreement, stated in the way the respective side would accept.

  | Self-Sampling Theorist (SST) | Self-Indication Theorist (SIT) |
  |------------------------------|--------------------------------|
  | One should reason as if one's present observer-moment were a random sample from the set of all observer-moments in one's reference class. | One should reason as if the fact of one's existence is evidence that there are more observers rather than fewer, because more observers make one's existence more likely. |
  | The Doomsday Argument is valid under a fixed reference class and a random sampling assumption. | The Doomsday Argument is invalid because it fails to account for the fact that existence in a larger population is more likely. |
  | The reference class should be defined by qualitative properties of the observer-moments, not by the absolute number of observers. | The reference class should include all observers that could have been in one's position, and the prior probability of a hypothesis is proportional to the number of observers it contains. |
  | In the Presumptuous Philosopher case, the philosopher's reasoning is invalid because it does not follow from random sampling within a fixed reference class. | In the Presumptuous Philosopher case, the philosopher's reasoning is valid because a larger universe makes our existence more probable. |
  | In the Carbon Copies case (as described below), one should assign a 1/2 probability to heads (the coin outcome) because the reference class includes only one type of observer-moment (the one experience), regardless of duplication. | In the Carbon Copies case, one should assign a 1/101 probability to heads and 100/101 to tails because there are 100 duplicates in tails and each is equally likely to be one's current self. |

  Cruxes:
  For each crux, we describe a case or argument that both sides agree bears on the dispute, and then record each side's prediction in advance.

  1. **The Carbon Copies Case**
     - **Case Description**: A fair coin is tossed. On heads, exactly one observer is created with a specific stream of experience. On tails, one hundred observers are created, each an exact duplicate of the one in heads, with numerically identical experiences. You are one of the observers and know the setup.
     - **SST Prediction**: The probability of heads is 1/2. The reasoning: the reference class is defined by the qualitative properties of the observer-moment. Since all observer-moments are identical, there is only one type of observer-moment. The coin toss does not change the fact that there is one stream of experience. Thus, the probability of heads remains 1/2.
     - **SIT Prediction**: The probability of heads is 1/101. The reasoning: there are 101 possible observers (one in heads, 100 in tails) and you are equally likely to be any of them. Therefore, tails (with 100 observers) is 100 times more likely than heads.

     - **Divergence Reason**: This reaches the deeper dispute. SST counts observer-moments by their qualitative type (so one type, hence no update), while SIT counts by the number of distinct observers (so 101 observers, updating the probability).

  2. **The Presumptuous Philosopher**
     - **Case Description**: A philosopher argues from the fact of his existence that the cosmos must contain a vast number of observers because if there were only a few, his existence would be improbable. Two theories are considered: Theory A (few observers) and Theory B (vastly many observers). The prior probabilities are equal.
     - **SST Prediction**: The philosopher's existence does not favor Theory B. The reasoning: in a random sample from the reference class (which is fixed by the theory), the probability of being one of the observers that exist is 1 regardless of the total number (as long as there is at least one). Therefore, no update.
     - **SIT Prediction**: The philosopher's existence strongly favors Theory B. The reasoning: the prior probability of the theory is proportional to the number of observers it contains. Therefore, Theory B (with more observers) has a higher prior and thus the evidence (existence) is more likely under Theory B.

     - **Divergence Reason**: This is a direct consequence of the core principles: SST uses random sampling within a fixed reference class, while SIT uses the likelihood of existence under each theory.

  Now, we write the document in the required format.
answer: |-
  **Joint Statement on Indexical Evidence and Observer Existence**  
  *An Adversarial Collaboration Between a Self-Sampling Theorist (SST) and a Self-Indication Theorist (SIT)*  

  ### I. Agreed Principles  
  Both parties endorse the following claims:  
  1. **Indexical evidence cannot directly establish non-indexical facts.** One’s existence or first-person perspective alone cannot prove objective truths (e.g., the universe’s size) without auxiliary assumptions.  
  2. **The Doomsday Argument presupposes a fixed reference class.** Its validity depends on how the class of "observers" is defined, not merely on birth-order sampling.  
  3. **The reference class problem is unresolved and central.** Defining the set of observer-moments relevant to reasoning (e.g., by species, substrate, or subjective properties) remains contentious and solution-sensitive.  
  4. **Existence provides evidence, but its interpretation divides us.** The fact of one’s existence is epistemically relevant; disagreement concerns *how* it updates credences.  
  5. **"Observer-moments" are the primary unit of analysis.** Reasoning applies to instantaneous subjective states, not temporally extended beings.  

  ---

  ### II. Residual Disagreements  
  Each side’s position is stated in its preferred terms:  

  | SST Position | SIT Position |
  |--------------|--------------|
  | Your observer-moment should be treated as a random sample from all observer-moments in your reference class. | Your existence is evidence favoring hypotheses with more observers, as they render your presence less improbable. |
  | The Doomsday Argument fails if the reference class includes *possible* observers or ignores causal structure. | The Doomsday Argument fails because it neglects that larger populations increase the probability of your existence. |
  | Reference classes must be defined by intrinsic properties (e.g., neural states) to avoid arbitrariness. | Reference classes should include all observers indistinguishable from your perspective, regardless of numerical identity. |
  | Indexical evidence cannot override non-indexical priors without causal links. | Indexical evidence can dominate non-indexical priors when observer counts differ. |

  ---

  ### III. Cruxes: Cases and Predictions  
  #### Crux 1: The Presumptuous Philosopher  
  - **Case**: A philosopher claims his existence alone proves the cosmos contains \(10^{30}\) observers, not \(10^{10}\), as larger universes make his existence more likely. Priors for both population sizes are equal.  
  - **SST Prediction**: The philosopher errs. Reasoning from existence alone ignores that sampling probability *within a fixed reference class* is always 1. No update occurs.  
  - **SIT Prediction**: The philosopher is correct. Existence is more likely under the \(10^{30}\)-observer hypothesis, so it receives near-certain credence.  
  - **Disagreement Root**: Core principle divergence. SST rejects likelihood boosts from observer counts; SIT embraces them.  

  #### Crux 2: Carbon Copies  
  - **Case**: A fair coin is tossed. Heads: One observer is created with experience-stream \(E\). Tails: One hundred observers are created, each with *numerically identical* experience-stream \(E\) (i.e., perfect duplicates). You are an observer experiencing \(E\) and know this setup.  
  - **SST Prediction**: Heads credence = \( \frac{1}{2} \). Reference classes are experience-defined. All observer-moments are identical \(E\), so duplication is irrelevant. The coin remains fair.  
  - **SIT Prediction**: Heads credence = \( \frac{1}{101} \). Existence is more probable under Tails (100 chances vs. 1). You are equally likely to be any observer, so Tails is 100 times likelier.  
  - **Disagreement Root**: Reaches the core dispute. SST sees one *type* of observer-moment; SIT sees 100 *distinct physical duplicates* (despite identical experiences), making observer count decisive.  

  ---  
  **Signed,**  
  *Self-Sampling Advocate* & *Self-Indication Advocate*  

  ---

  ### Notes for the Novelist  
  - **Tone**: Austere, analytic, minimally elaborated. Disagreements are pinpointed without rhetoric.  
  - **Key Divergence**: SST anchors on *qualitative reference classes*; SIT weights *observer count* as evidence. Carbon Copies isolates this: SST sees no update from duplication (same experiences = same reference class); SIT sees strong evidence for Tails (more "slots" for existence).  
  - **American English**: Honored (e.g., "behavior," "color," "analyze").  
  - **Purpose**: The document showcases philosophical tension through edge cases. Presumptuous Philosopher tests armchair cosmology; Carbon Copies forces a clash on duplication’s epistemic significance.
