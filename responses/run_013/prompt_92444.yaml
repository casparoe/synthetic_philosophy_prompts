prompt: |-
  I have been trying to work out what I actually think about believing things on other people's say-so, and I would like a principle that captures the pattern, if there is one. I have no training in philosophy, so what follows is just my own reaction to cases, and I would rather have an honest account of them than a flattering one.

  When a stranger in the street tells me the bank on the corner is shut for refurbishment, I think it is perfectly reasonable to believe him and walk to the next one. When my sister tells me that a mutual friend said something cutting about me at a dinner I missed, I believe her, but I have a nagging sense that I ought not to — that I am taking a single unchecked word for something that matters, and that I would be a fool to repeat it. I cannot see what the difference is supposed to be. Both are one person, unverifiable by me, with nothing much obviously riding on it.

  Some further verdicts, in no particular order.

  When a doctor tells me my knee is not broken, I accept it completely. When the same doctor, at the same appointment, tells me the government's economic policy is sound, I do not accept it at all, though I have no more evidence against him on the second point than on the first.

  When someone tells me about a pain in his own chest, I take it as settled. When the same man tells me why he did something — that he was not really angry, only tired — I think I know better than he does.

  When a chemistry textbook states the boiling point of a substance, I accept it without a flicker, though I have never checked it and could not. When a newspaper reports that a bridge has been closed, I accept it with a small discount; when it reports what a minister really meant, I discount it almost to nothing.

  When a man I know to be a shameless exaggerator tells me the post office closes at noon, I believe him. When the same man tells me the woman at the counter was rude to him, I do not.

  When two strangers who have not spoken to each other independently tell me the same unlikely thing, I believe it far more readily than either alone. When one man tells me a thing and then tells me that a second person confirmed it, and it turns out the second person had only heard it from the first, my confidence collapses.

  When I ask a passer-by the way to the station, I follow his directions without a second thought. When a passer-by volunteers, unasked, that the station is the other way, I check for myself before turning round.

  When a child tells me there is a wolf in the garden, I do not believe it, though I have no reason to think the child a liar.

  When my neighbour tells me his fence is on my land, I want to see the deeds. When he tells me it will rain by evening, I take an umbrella.

  My tentative principle is something like this: I am entitled to believe what I am told when the person telling me has no reason to want me to believe it, and when the sort of thing being said is not the sort of thing that gets shaped by wanting it to be true. That seems to cover the stranger, the textbook, the exaggerator on the post office and the doctor on the knee. But it plainly does not cover the doctor on economics, or my sister on the dinner, or the neighbour on the fence, and I suspect it gets the child wrong as well.

  What I want from you is this. Tell me what principle, or small set of principles, actually fits the verdicts above, stated precisely enough that I could apply it to a new case. For each clause, say which of my cases forces it. Then tell me what the resulting account says about three cases I have not put to you: whether I should believe a mechanic who tells me my gearbox is failing but who stands to profit from the repair; whether I should believe a dying man's account of a quarrel when everyone else present tells it differently; and whether I should believe a man who tells me, sincerely, that he is not in pain when I can see that he is. Finally, be straight with me about which of my verdicts the principle cannot accommodate, and whether it is the principle or the verdict that should give way. I am not after a survey of what philosophers have written on this; I want to know what the principle is.
reasoning: |-
  Okay, the user is grappling with when to believe others based on testimony across various scenarios. They've provided detailed cases and their intuitive judgments, seeking a precise principle that fits all these instances. Let me start by breaking down their examples to identify patterns.

  First, in the stranger telling about the bank closure versus the sister sharing gossip, the user feels uneasy about the latter even though both are single-source. The difference seems to lie in the stakes involved. Gossip could harm relationships, making the cost of falsehood higher. Also, the sister might have motives, like drama, whereas the stranger gains nothing from lying about the bank.

  Next, the doctor's medical advice is trusted, but not their economic opinion. Expertise matters here. The doctor is trained in medicine, not economics. Even without conflicting evidence, the domain specificity affects credibility. The user intuitively recognizes that expertise is context-dependent.

  The chest pain versus explanation of behavior case highlights first-person authority. Physical sensations are directly known to the individual, so their report is credible. But motivations can be subconscious or misrepresented, so the user doubts the self-report here. This ties into accessibility of information—some things are more reliably self-reported than others.

  Textbooks are trusted for factual data like boiling points because they're vetted by experts and systems. Newspapers get discounted, especially on interpretations like a minister's intent, because bias and narrative shaping are likely. Institutional credibility and the nature of the claim (fact vs. interpretation) play roles.

  The exaggerator is believed about post office hours (a verifiable fact) but not about the clerk's rudeness (subjective). Objective facts are less likely to be distorted by personal traits, whereas subjective experiences can be influenced by the person's tendency to exaggerate.

  Independent corroboration boosts credibility, but circular confirmation undermines it. Multiple independent sources reduce the chance of error or deceit. The user's collapse in confidence when sources aren't independent shows sensitivity to information integrity.

  Unsolicited advice triggers skepticism. The passerby offering directions unasked might have ulterior motives, unlike when asked. Solicited vs. unsolicited information affects perceived reliability, as unsolicited info can serve the informant's interests.

  The child's wolf claim isn't believed because children's perceptions are unreliable, even without malice. High-stakes claims require more reliable sources. The neighbor's fence claim needs verification (deeds) due to conflicting interests, but weather predictions are low-stakes, so accepted.

  The user's tentative principle about no motive and truth not being shaped by desire fits some cases but fails for the doctor on economics (no motive but not believed) and the sister (possible motive). Their principle needs refinement.

  I recall that epistemology deals with testimony. Key concepts include reductionism (trust based on evidence of reliability) vs. non-reductionism (default trust). But the user's cases suggest a hybrid approach. Factors like stakes, expertise, incentives, accessibility of information, and corroboration all interplay.

  I need to synthesize a set of principles. Principle 1: Trust inversely with stakes. Higher stakes require more evidence. Principle 2: Informant's relevant competence matters. Principle 3: Absence of conflicting interests or biases. Principle 4: Accessibility of information to the informant. Principle 5: Corroboration reduces epistemic risk.

  Applying these to the user's cases: The sister case has high stakes (social harm) and possible motive. Doctor on economics lacks competence. The exaggerator on rudeness involves subjectivity and bias. Child's wolf claim has high stakes and low competence. Each principle addresses specific cases.

  For the new cases: The mechanic has a conflict of interest (profit motive), so distrust unless corroborated. The dying man might be more credible due to less motive to lie, but conflicting accounts require weighing incentives and access. The man denying pain conflicts with observable evidence; accessibility favors external observation over self-report when behavior contradicts.

  Some verdicts might need adjustment. For example, the sister's gossip: if stakes are high, skepticism is warranted, but the user feels it's a single unchecked word. The principle explains why it's reasonable to doubt. Similarly, the unasked passerby: unsolicited info may have higher risk of ulterior motives, justifying caution.

  Overall, the principles cover most cases. The neighbor's fence involves conflicting interests (Principle 3), hence needing deeds. The doctor's medical advice fits competence and low personal stake. Cases like the dying man show that when stakes are high, even sincere reports need scrutiny against other evidence.
answer: |-
  Based on your detailed cases and intuitive verdicts, a coherent set of principles emerges. Your judgments consistently hinge on **three key factors**: the **stakes** of being wrong, the **reliability** of the informant (encompassing competence, incentives, and access to truth), and the **independence** of supporting evidence. Stated precisely:

  ### The Principles
  1. **Stakes Principle**:  
     *The higher the practical or emotional cost to you if the claim is false, the stronger the evidence required to believe it.*  
     **Cases forcing this**:  
     - Sister’s gossip (high social/emotional stakes) vs. stranger’s bank comment (low stakes).  
     - Neighbor’s land claim (high legal/financial stakes) vs. rain prediction (low stakes).  
     - Child’s wolf claim (high safety stakes) vs. textbook fact (low stakes).  

  2. **Reliability Principle**:  
     *Belief requires the informant to have:  
     a. **Relevant competence**: Expertise or access to the truth in this domain.  
     b. **Minimal distorting incentives**: No strong motive to deceive or be deceived (e.g., bias, self-interest, emotion).  
     c. **Direct access**: Firsthand knowledge where applicable (e.g., sensations, simple observations).*  
     **Cases forcing this**:  
     - Doctor on knee (competence) vs. economics (no competence).  
     - Man’s chest pain (direct access) vs. his motives (no reliable access, potential self-deception).  
     - Exaggerator on post office hours (objective fact, minimal distortion) vs. clerk’s rudeness (subjective, distorted by trait).  
     - Newspaper bridge closure (verifiable fact) vs. minister’s intent (interpretation, high distortion risk).  

  3. **Independence Principle**:  
     *Corroboration from independent sources exponentially increases credibility; circular or non-independent confirmation destroys it.*  
     **Cases forcing this**:  
     - Two strangers agreeing (strong belief) vs. one citing a dependent source (collapsed confidence).  
     - Solicited directions (implied independent knowledge) vs. unsolicited correction (suspicion of manipulation).  

  ---

  ### Application to Your New Cases
  1. **Mechanic claiming your gearbox needs repair (with profit motive)**:  
     - **Should you believe?** No, without independent verification.  
     - **Why?** High stakes (financial cost) + strong distorting incentive (profit) violate Reliability (b). Principle 1 demands skepticism.  

  2. **Dying man’s account of a quarrel (contradicted by others)**:  
     - **Should you believe?** Not solely on his word; weigh carefully.  
     - **Why?** High stakes (historical/relational truth) + possible distortions (emotion, bias). Reliability (b) and Independence (3) apply: his lack of future stake *increases* credibility (no reason to lie), but others’ accounts *reduce* independence. Stakes (1) require cross-examination.  

  3. **Man sincerely denying pain (while showing clear symptoms)**:  
     - **Should you believe?** No.  
     - **Why?** Reliability (a, c): He has direct access to pain, but psychological/neurological factors (e.g., denial, anosognosia) can override this. Observable evidence trumps testimony when access is compromised (Reliability c).  

  ---

  ### Misfits and Adjustments
  Your principles cover **all cases except one**, but one verdict needs refinement:  
  - **Unasked passer-by redirecting you**:  
    Your intuition ("check for yourself") is justified by Stakes (1) and Reliability (b). An unasked correction raises suspicion of ulterior motives (e.g., prank, scam). The principle *accommodates* this, but your phrasing ("volunteers, unasked") implicitly invokes an incentive red flag—aligning with Reliability (b).  

  - **The child’s wolf claim**:  
    Your verdict ("don’t believe") fits perfectly: High stakes (1) + child’s low competence/accuracy (Reliability a). No adjustment needed.  

  - **The sister’s gossip**:  
    Your unease is warranted. Principles 1 (high social stakes) and 2b (potential distortions: drama, misunderstanding, her own bias) explain why skepticism is rational—even if you *feel* you "ought not to" believe it. The verdict should stand; the principle validates it.  

  **The only misfit**:  
  - **Exaggerator on post office hours**:  
    You believe him despite his trait. The principle *allows* this because:  
    - Low stakes (1).  
    - Objective facts (like hours) resist distortion (Reliability b).  
    - His incentive to lie is low (trivial gain).  
    **Verdict vs. Principle**: Your verdict is correct; the principle holds. His exaggerator trait is less relevant for easily verifiable, low-stakes facts.  

  ---

  ### Final Note
  These principles distill your intuitive epistemology: **Testimony is trusted proportionally to stakes, reliability, and independence**. They are defeasible—new evidence can override them—and they interact dynamically (e.g., high stakes demand more reliability). Philosophers (e.g., Hume on testimony, Fricker on trust) echo fragments of this, but your cases uniquely emphasize stakes and accessibility. If a future case feels misjudged by these rules, revisit the *stakes* or *incentives*—those are your core anchors.
