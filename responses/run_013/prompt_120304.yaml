prompt: |-
  You are a philosopher of physics with expertise in statistical mechanics and the foundations of the arrow of time. I have no academic background in physics, but I have been trying to work out for myself where time's direction comes from, and I have gotten stuck on what looks to me like a fatal gap in the standard story. Please walk me through it carefully, and begin by brainstorming the main possible responses before committing to your own view.

  Here is my reasoning. Take a gas in a box that is currently in a clearly non-equilibrium state — say, all the molecules crowded into one half. Statistical mechanics tells me that among the microstates compatible with that description, the overwhelming majority are ones that will spread out and reach a more uniform, higher-entropy state a moment later. So far, so good. But the very same counting argument, run in the other direction, says that the overwhelming majority of microstates compatible with the gas being crowded into one half right now are ones that arrived there from an already spread-out, higher-entropy state a moment ago. The underlying dynamics are time-reversal symmetric, so nothing in the physics privileges one direction over the other. That seems to mean that statistical mechanics on its own predicts entropy was higher in the past as well as being higher in the future — which is plainly false, and which would make the whole account useless for explaining why we remember the past but not the future.

  The fix I keep running into is that we have to add some special assumption that the universe started in an extraordinarily low-entropy state. But I do not understand what kind of assumption that is supposed to be. Is it a law of nature? A boundary condition? A brute fact we simply have to swallow? And even granting it, why is it legitimate to apply the probabilistic reasoning to the state of the early universe and then run it forward, while refusing to apply the same reasoning to the present state and run it backward? It looks to me as though we are using two different standards for past and future, and I cannot see what justifies the asymmetry.

  Please explain the issue and the standard moves made in response. Be precise about what is and is not being assumed at each step, and tell me honestly which parts remain genuinely unresolved.
reasoning: |-
