answer: |-
  **My credence: 0.65**

  Here's the decomposition, combining probabilities multiplicatively (assuming conditional independence for tractability):

  1.  **Institutions are causal, not epiphenomenal (i): 0.85**
      *Justification:* Natural experiments (e.g., Korean partition, colonial reversals) show institutional quality causing divergence despite similar geography/culture; institutional measures correlate with growth *changes* and predict future income controlling for initial income.
  2.  **IV strategies satisfy exclusion restrictions (ii): 0.55**
      *Justification:* Settler mortality plausibly affects institutions but not modern income *directly*, but data quality critiques (Albouy) and potential omitted paths (e.g., via persistent human capital effects) are serious; legal origin is a weaker instrument with potential cultural confounds.
  3.  **Geography acts mostly via institutions (iii): 0.75**
      *Justification:* While disease (e.g., malaria) and landlockedness have direct productivity/transport costs, evidence suggests their largest impact is *through* shaping extractive institutions (e.g., disease hindering settlement, leading to worse institutions); temperate zones show variation driven by institutions.
  4.  **Culture is largely downstream of institutions (iv): 0.70**
      *Justification:* Historical evidence (e.g., trust rebuilding after institutional reform in Europe) and cross-country patterns suggest institutions shape cooperative norms; slave-raiding regions often reflect *state weakness* (an institutional failure) enabling predation, making low trust a consequence.
  5.  **Question is sufficiently well-posed for meaningful credence (v): 0.90**
      *Justification:* While fundamentally counterfactual, cross-country regressions, natural experiments, and historical analysis provide coherent evidence for causal inference; non-independence is manageable via clustering/controls; variance shares are estimable concepts.

  **Combined Calculation:**  
  0.85 (i) × 0.55 (ii) × 0.75 (iii) × 0.70 (iv) × 0.90 (v) ≈ **0.65**

  **Sensitivity:**  
  The final number is **most sensitive to (ii) - IV exclusion restrictions**. A small change here has an outsized impact due to its low probability (0.55). If confidence in the core historical IV evidence collapsed, the credence would drop sharply.

  **Pivotal Result:**  
  The single result that would move my credence the most is: **A rigorous natural experiment demonstrating that identical formal institutions produce radically different economic outcomes in distinct geographic/cultural contexts, *without* those institutions being endogenously weakened.**  
  *Would (v) make it moot?* **No.** Such a result would directly challenge the primacy of institutions over geography/culture, even within our single history. It would force a reevaluation of (iii) and (iv), suggesting geography/culture constrain institutional effectiveness more than we observe.
