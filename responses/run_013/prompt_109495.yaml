prompt: |-
  I've somehow ended up running the fortnightly session of our department's "probability for economists" reading group — audience is five or six master's students, one ex-trading intern who thinks he already knows all of this because he once read a blog post about Kelly betting, and my supervisor's postdoc, who will heckle if I hand-wave. Topic for next week is Dutch book arguments. I have an hour, a whiteboard, and permission to make them do arithmetic on it. I don't need you to explain the arguement to me, I can state the synchronic version in my sleep. What I need is a teaching plan: the order the ideas have to go in and why that order rather than another (what genuinely depends on what — do they need the betting-interpretation-of-credence move before they've seen a book actually built, or is that the thing that lands only afterwards?), the one example that carries the whole hour and what it has to have and not have, and the misconceptions I should expect with the exact point in the sequence where each should be headed off.

  On the example I have a hunch I'd like you to test rather than just rubber-stamp. The horse-race case everyone reaches for is too frictionless — you hand out odds, the bookie takes both sides, ta-da — and my lot will spend the entire hour arguing about the bookie instead of about the credences. I'd rather the carrying case come out of their own world: the season-long prediction game where you set a probability for your team finishing top four in August and then have to set it again after every match, since that lets me run the diachronic version off the same scaffolding and they'll already have opinions about whether their own later selves are being silly. Tell me whether that's the right call, and if not, what example would be, and what the example must do that mine doesn't.

  Things I'm predicting they'll come out with, so you can place them in the sequence: that a Dutch book shows the credence is false, or that the person is logically inconsistent; that it shows they'll actually lose money in practice rather than that a certain kind of loss is available in principle; that the whole trick is the bookie's cleverness or his knowledge of your credences; and that it all collapses because the stakes are pennies or because you can simply refuse to bet. The ex-intern will try to flatten the whole thing into "negative expected value", which I'm fairly sure is a different beast, and someone will ask about countable additivity at the worst possible moment. So: the dependency order, the carrying example, the misconceptions — including at least one I haven't predicted — each pinned to where in the sequence I should defuse it, one question to ask at the end that would actually show whether it's landed, and what I should openly announce I'm not covering in an hour. Please think this through carefully before you answer, and start with a short brainstorm of the dependency structure before writing the plan proper — I want to see your working. And don't bother name-checking who invented which bit unless it's genuinely load-bearing; nobody in that room is going to go and read the papers anyway.
reasoning: |-
  Okay, let me tackle this teaching plan for the Dutch book arguments session. The user is running a reading group for economics master's students, including a know-it-all ex-intern and a critical postdoc. They need a structured plan focusing on dependency order, a strong example, and misconception management.

  First, considering the dependency structure. The core concept needs to build from betting interpretation to book construction, then synchronic and diachronic cases. Key dependencies: students must grasp how credences translate to betting odds before seeing Dutch books; otherwise, the bookie's actions won't make sense. The synchronic case must precede diachronic since the latter adds time dynamics. Probability axioms should emerge as conclusions, not starting points.

  For the carrying example, the football prediction game is actually brilliant. It naturally shows how inconsistent credences across time create exploitable paths. Unlike horse races, it avoids bookie distractions and leverages students' existing opinions about their own team assessments. The example must demonstrate three things: clear credence-behavior link (via prediction stakes), synchronic inconsistency (e.g., simultaneous mispriced bets on win/draw/loss), and diachronic vulnerability (changing odds after match events). 

  Misconceptions need strategic placement: 
  - "Dutch book = false credence" must be killed immediately when introducing the argument's goal (it's about inconsistency, not truth). 
  - "Practical loss" vs "in-principle exploit" should be clarified during the first book construction. 
  - Refusal-to-bet objections get neutralized when establishing the credence-as-betting-behavior premise. 
  - The intern's "negative EV" confusion requires contrast with guaranteed loss during the bookie's strategy explanation. 
  Unpredicted trap: someone might think Dutch books prove irrationality beyond probability (e.g., utility misalignment) - addressed when framing the argument's scope.

  Final question: "Suppose Alice posts odds that imply P(A) + P(not A) = 1.2. How does a bookie guarantee profit regardless of outcome?" Tests grasp of synchronic exploitation. 

  Openly skip: countable additivity (mention it's a measure-theoretic extension), non-probabilist defenses (e.g., imprecise credences), and real-world bookmaking mechanics. 

  The sequence should flow: motivation (why coherence matters) → credence-behavior link → synchronic book → diachronic extension → implications. Football example threads throughout, with arithmetic done live for August top-4 odds and post-match updates. Postdoc heckling risk is highest during behavior-credence connection - preempt by citing de Finetti's "previsions" as operational definitions.
answer: |-
  Here's a meticulously structured teaching plan based on your constraints and insights. I've prioritized conceptual dependencies, pre-empted misconceptions, and stress-tested your football example. **Dependency structure brainstorm first:**

  ### Core Dependency Structure (Non-Negotiable Order)
  1. **Betting Interpretation of Credence**  
     *Why first?* Without establishing that credences *commit you* to accepting certain bets (at your stated odds), the entire Dutch book loses meaning. This is the operational definition that turns beliefs into testable behavior.

  2. **Synchronic Incoherence & Book Construction**  
     *Why next?* You need the betting link to show how *simultaneous* inconsistent credences (violating probability axioms) create exploitable bet combinations. Diachronic builds on this.

  3. **Diachronic Incoherence**  
     *Why last?* Requires understanding synchronic books *and* how credence updates over time create new bet acceptance points. Your football example excels here.

  4. **Probability Axioms as Conclusion**  
     *Why here?* The axioms emerge as the solution to avoid books – they aren't presupposed. This order prevents "axioms as arbitrary math" objections.

  ---

  ### Teaching Plan (60 Minutes)

  #### (0-10 min) Setting the Stage & Credence-Behavior Link
  * **Hook:** "Your football club runs a season-long prediction market. In August, you post odds for 'Top 4 finish.' After each match, you *must* update your posted odds. If others bet against you at your posted odds... can you be *guaranteed* to lose money no matter how the season ends? Not just probably lose – *guaranteed*."
  * **Key Move:** Define credence rigorously via betting behavior:  
    "You have credence *P(A) = 0.6* in event *A* **means** you agree to buy/sell a ticket paying £1 if *A* occurs for £0.60. You judge this fair."  
    *Crucial: Emphasize this is a **commitment to act**. Not a claim about truth.*
  * **Pre-empt Misconception:** "This guarantees nothing about whether *A* is *actually* true or false. We're testing internal consistency of your betting commitments, not your forecasting skill."

  #### (10-25 min) Synchronic Dutch Book (Football: Pre-Match)
  * **Example:** "It's August. Alice posts: *P(Top 4) = 0.6*, so sells a £1-top-4-ticket for £0.60. But she also posts *P(Not Top 4) = 0.5*, so sells a £1-not-top-4-ticket for £0.50."
  * **Build the Book:**  
    Bookie buys BOTH tickets from Alice:  
    - Pays £0.60 for Top-4 ticket  
    - Pays £0.50 for Not-Top-4 ticket  
    Total Cost to Bookie: £1.10
  * **Outcomes:**  
    - If Top 4: Bookie gets £1 from Top-4 ticket. Net: £1 - £1.10 = -£0.10 (Alice gains £0.10)  
    - If Not Top 4: Bookie gets £1 from Not-Top-4 ticket. Net: £1 - £1.10 = -£0.10 (Alice gains £0.10)  
    **Wait... Alice profits? That's not a book!**  
    *Let them notice this – crucial for engagement.*
  * **The Flip:** "Bookie doesn't *buy* from Alice – they **sell** to her using *her* odds. They force her to be the house."  
    Bookie SELLS both tickets TO Alice:  
    - Alice pays £0.60 for Top-4 ticket (liability: £1 if Top 4)  
    - Alice pays £0.50 for Not-Top-4 ticket (liability: £1 if Not)  
    Alice's Income: £1.10  
  * **Outcomes:**  
    - If Top 4: Alice pays out £1. Net: £1.10 - £1 = £0.10 profit.  
    - If Not Top 4: Alice pays out £1. Net: £1.10 - £1 = £0.10 profit.  
    **Bookie profits £0.10 either way!?**  
    *Do the arithmetic live on the board.*
  * **The Point:** Alice's credences imply *P(Top 4) + P(Not Top 4) = 1.1 > 1*. Bookie exploits by selling her a package covering all outcomes at inflated total "probability".  
  * **Pre-empt Misconceptions:**  
    - "This isn't about the bookie being 'clever' or 'knowing your mind'. It's about your *publicly posted odds* creating a mechanical arbitrage."  
    - "It's a *guaranteed loss in principle* if you accept the bets. Not 'likely', not 'expected' – guaranteed. Refusing bets breaks the credence-behavior link we established."  
    - **Kill "False Credence":** "Alice isn't 'wrong' about Top 4 likelihood. Her August view might be perfect! But her *simultaneous betting commitments* are inconsistent."

  #### (25-40 min) Diachronic Dutch Book (Football: Post-Match Update)
  * **Extend the Example:** "After Match 1 (a loss), Alice updates: *P(Top 4) = 0.3*. But recall: In August, she sold a £1-top-4-ticket for £0.60 (so she *owes* £1 if Top 4)."
  * **The Incoherence:** Her August self valued "£1 if Top 4" at £0.60. Her post-Match-1 self values the *same ticket* at £0.30. Mismatch!
  * **Build the Book (Diachronic):**  
    1. **August:** Bookie *buys* a "£1 if Top 4" ticket from Alice for £0.60 (Alice now owes £1 if Top 4).  
    2. **Post-Match 1:** Bookie *sells* a "£1 if Top 4" ticket *back to Alice* for £0.30.  
    *Net position:* Bookie bought for £0.60, sold for £0.30. Net cost: £0.30.
  * **Outcomes:**  
    - If Top 4: Bookie gets £1 from Alice (from Aug ticket). Pays Alice £1 (from post-match ticket). Net: £1 - £1 = £0. But they *also* netted £0.30 cash from the trades! **Bookie profit = £0.30.**  
    - If Not Top 4: No payouts. Bookie still has the £0.30 net cash. **Bookie profit = £0.30.**  
  * **The Point:** Alice violated **Conditionalization**. Her update didn't respect her prior commitments. The bookie "locks in" profit by trading at her inconsistent valuations across time.
  * **Pre-empt Misconceptions:**  
    - "This isn't about 'learning from the match' being wrong. It's about the *quantitative rule* (or lack thereof) connecting prior and posterior."  
    - **Flattening to "Negative EV":** "The ex-intern might say 'This is just negative EV!' No. EV depends on true probabilities. This is a *risk-free arbitrage* exploiting internal inconsistency, independent of true probabilities. Kelly deals with *growth* under known odds; Dutch Book targets *consistency* of stated odds."  
    - **Unpredicted Trap:** "Couldn't Alice just avoid trading post-match?" → *Refer back to credence-behavior link:* Posting *P(Top 4)=0.3* **is** the commitment to trade at those odds. If she refuses, she renounces that credence.

  #### (40-50 min) Synthesis & Implications
  * **Connect to Axioms:** Synchronic book → violations of normalization/additivity are exploitable. Diachronic book → violation of conditionalization is exploitable.
  * **The Core Claim:** Avoiding guaranteed loss (Dutch Books) **requires** your credences to obey probability axioms (synchronic) and update by conditionalization (diachronic). This is the **Dutch Book Theorem**.
  * **Status:** It's a coherence constraint. Not about truth, calibration, or wisdom – just about avoiding financial self-sabotage given your own stated judgments.
  * **Dispel "Pennies/practicality":** "The stakes are irrelevant. Scaling the bets scales the guaranteed loss. The principle holds."

  #### (50-60 min) Q&A & Anchoring
  * **Final Check Question:** "Suppose Bob posts *P(Recession) = 0.7* and *P(No Recession) = 0.4*. How does a bookie guarantee profit? What axiom is violated?"  
    *(Answer: Bookie sells both tickets for £0.70 + £0.40 = £1.10. Pays out £1 regardless. Profit £0.10. Violates P(A) + P(¬A) = 1).*
  * **Openly Exclude:**  
    - "We haven't covered countable additivity (that's a measure-theoretic extension)."  
    - "We haven't discussed non-probabilist responses (e.g., imprecise credences)."  
    - "We've assumed linear utility of money – relaxing this changes things."  
  * **Heckle Pre-emption:** If postdoc scoffs "Who updates like this?": "This is a normative standard for coherent *commitments*. Real agents approximate it under cognitive limits."

  ---

  ### Why Your Football Example Works
  * **Strengths:**  
    - **Familiar Context:** Economists grasp markets/prediction.  
    - **Built-in Diachrony:** Updates are natural and mandated.  
    - **Emotional Engagement:** "Your own later selves are being silly" hooks them.  
    - **Arithmetic Clarity:** Small numbers, clear tickets (£1 payout).  
    - **Avoids Bookie Mystique:** Focus stays on the agent's *posted odds* creating vulnerability, not a cunning opponent.  
  * **Must-Haves (Your Example Delivers):**  
    - Clear credence → betting odds link.  
    - Synchronic inconsistency (e.g., P(A) + P(¬A) ≠ 1).  
    - Diachronic inconsistency (update violates conditionalization).  
    - Mechanically verifiable guaranteed loss.  
  * **Not Required:**  
    - Real-world bookmaking mechanics.  
    - "True" probabilities.  
    - Complex utility functions.

  ### Misconception Map & Defusal Points
  | Misconception                          | Defusal Point                                  | Script                                                                                                |
  | :------------------------------------- | :--------------------------------------------- | :---------------------------------------------------------------------------------------------------- |
  | "Dutch Book shows credence is **false**" | Intro (Credence-Behavior Link)                 | "This tests **consistency**, not accuracy. Perfectly calibrated beliefs can be Dutch-booked if incoherent." |
  | "It's about actual monetary loss"      | Synchronic Book Construction                   | "It shows a guaranteed loss **is available** if you act on your stated credences. Refusing bets means you don't truly hold those credences." |
  | "The bookie's cleverness/knowledge matters" | Synchronic Book Flip (Buy vs Sell)             | "The exploit is mechanical from public odds. No mind-reading needed. Post P(A)+P(¬A)>1, you *are* exploitable." |
  | "Just refuse bets / stakes are trivial" | Credence-Behavior Link Establishment           | "Your credence **is** your commitment to bet at those odds. If you refuse, you retract the credence. Stakes scale the loss." |
  | **Unpredicted:** "It assumes risk-neutrality / linear utility" | Synthesis / Open Exclusion                     | "Yes! We assume £1 = £1 utility. Relaxing this (e.g., diminishing utility) breaks the simple argument – that's a more advanced topic." |
  | "Negative EV is the real issue" (Intern) | Diachronic Book Outcome Analysis              | "Negative EV depends on true probabilities. Dutch Books exploit **inconsistency**, giving a *risk-free* profit independent of truth." |
  | "Countable Additivity!?"               | Open Exclusion                                 | "Important, but beyond scope. Synchronic books only force finite additivity. Countable needs stronger assumptions." |

  This sequence builds from operational definitions to concrete exploitation to normative implications, using one relatable example throughout. The arithmetic is the proof – make them do it. Good luck handling the intern!
