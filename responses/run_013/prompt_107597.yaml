  ## Collective Tuning

  **Stanza 1 (Ava):**  
  The beat was off, the fills were slack,  
  He couldn't hold the line.  
  He swore he'd practice, get it back –  
  *So let's give him more time.*  

  **Stanza 2 (Ben):**  
  His timing's tight, the groove is deep,  
  He makes the rhythm swing.  
  But missed the gigs, commitments cheap –  
  *We need to cut the string.*  

  **Stanza 3 (Cat):**  
  He missed the tour, a crucial test,  
  That trust is hard to mend.  
  But skill like his is manifest –  
  *We keep him to the end.*  

  **Stanza 4 (We):**  
  **His timing's strong, the rhythm's true,**  
  **He missed the tour, a breach.**  
  **We vote him out, this interview**  
  **Confirms our final speech.**  
  **We'll record the album, start anew,**  
  **And find the sound we reach.**  

  ---

  **Prose Note (For Seminar Handout):**

  This poem stages the discursive dilemma within a band deciding whether to fire their drummer. The premises are: 1) Is the drummer sufficiently skilled? 2) Did the drummer breach commitment? The conclusion: Should the drummer be fired?

  *   **Ava:** Premise 1 (No - "beat was off"), Premise 2 (Yes - "swore he'd practice"), Conclusion: Keep (No to firing).
  *   **Ben:** Premise 1 (Yes - "timing's tight"), Premise 2 (Yes - "missed the gigs"), Conclusion: Fire (Yes to firing).
  *   **Cat:** Premise 1 (Yes - "skill... manifest"), Premise 2 (No - "trust is hard to mend"), Conclusion: Keep (No to firing).

  Majority: Premise 1 (Yes: Ben, Cat), Premise 2 (Yes: Ava, Ben). Conclusion (Fire): Only Ben votes yes (Ava & Cat vote no). The collective "We" in Stanza 4 asserts the conclusion justified by the *majority premises* ("His timing's strong" - P1 Yes; "He missed the tour" - P2 Yes; "We vote him out" - Fire), a position only Ben individually holds.

  **Philosophical Liberties & Leaning:**
  *   **Leaning:** The poem leans heavily on a *Gilbertian joint commitment* view for the "We" voice. The group speaks *as* a unified agent with a single verdict ("our final speech"), arising from the aggregation procedure, regardless of individual dissent.
  *   **Ignoring:** It bypasses *Bratman's meshing subplans*. There's no shared intention guiding the aggregation itself; the dilemma emerges mechanically. *Searle's primitive 'we-intention'* isn't invoked for the *process* of voting, only for the *output* statement.
  *   **Distortion Risk:** The poem assumes the group *can* coherently act ("record the album") while holding an inconsistent verdict. Critics (e.g., List & Pettit on robust group agency) might argue a group truly capable of intentional action (like recording an album) *must* have procedures avoiding such inconsistencies, or the "we" claiming the action is fractured. The smooth "We" voice masks internal dissent, potentially overstating the group's unity *post-dilemma*.
  *   **Unpackable vs. Reducible "We":**
      *   *Unpackable:* "**We'll record the album...**" (Line 5). This is an *intention* attributed solely to the group level. While individuals might plan to play, the *group project* "record the album" requires collective commitment and coordination irreducible to individual intentions (e.g., Cat might intend to play bass, but not for *this* specific album project without the group context).
      *   *Reducible:* "**We vote him out...**" (Line 3). This describes an *action* (voting) that *is* reducible to the sum of individual actions (Ava pressing 'No', Ben pressing 'Yes', Cat pressing 'No').

  **Dilemma Integrity:** The arithmetic holds with three members: 2/3 majority on each premise (P1: Ben, Cat; P2: Ava, Ben), but only 1/3 majority (Ben) for the conclusion justified by those premises. The group verdict "Fire" is the *only* conclusion logically consistent with accepting both majority premises.
