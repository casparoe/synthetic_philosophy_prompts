  2. **Proposal**: On your turn, you may propose a new rule, an amendment to an existing rule, or the repeal of an existing rule.
  3. **Adoption Threshold**: A proposal is adopted if it receives a majority of votes cast. (Define majority: more than half.)
  4. **Tie Vote**: If a vote is tied, the proposal fails.
  5. **Contradiction**: If two rules contradict, the one adopted later takes precedence.
  6. **Amendment Rule**: Rules may be amended by a proposal that explicitly states the change. The amendment rule (Rule #?) requires a 2/3 majority to amend.
  7. **Protected Rule**: Rule X (e.g., freedom of speech in proposals) can only be amended by a 3/4 majority. (This rule is itself amendable by the ordinary 2/3? Or by the same 3/4? We must decide.)
  8. **Role: Chair**: The chair is elected by majority vote at the start. The chair rules on points of order and oversees the voting. The chair's ruling may be appealed by a motion to overturn, which requires a majority vote.
  9. **Role: Clerk**: The clerk keeps minutes. The minutes are the official record. The clerk reads the rules when requested.
  10. **Role: Objector**: One player is designated as the Objector. The Objector may interrupt at any time to raise a procedural objection. The chair rules on the objection.
  11. **Voting**: Votes are by show of hands. Only players present may vote.
  12. **Quorum**: Business may be conducted only if at least 8 players are present.
