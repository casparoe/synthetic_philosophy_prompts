  ### Procedure for Determining Same-Mechanism Anomalies

  #### Core Criterion for "Same Mechanism"
  Two anomalies share a mechanism **if and only if** the same *numerically identical* difference-making variable (e.g., a specific attention head, neuron, or autoencoder feature) is causally necessary and sufficient for both anomalies at a predefined level of description (weights or features). This requires:
  1. **Identical variable**: The same physical component (e.g., head 5.7, feature #832) is implicated.
  2. **Causal necessity**: Ablating the variable removes the anomaly in both cases.
  3. **Shared function**: The variable's effect (via patching or attribution) is functionally interchangeable between anomalies.  
  *Rejects "same kind" computations, ambiguous levels, or partial overlaps. Burden of proof is on MERGE.*

  ---

  #### Ordered Procedure (30 min/pair)
  **Tools allowed**: Prompts, outputs, activation patching, feature attributions, logit lens. No training runs.  
  **Input**: Two anomalies (A and B), their prompts, outputs, and reported variables (e.g., "head 5.7 causes wrong date").  
  **Output**: VERDICT (MERGE/SPLIT/HAND-OFF) with reason.

  1. **STEP 0: Clarify level and variable (2 min)**  
     - *Question*: What level (weights/features) and specific variable (e.g., head 5.7) is reported for each anomaly?  
     - *Sufficient answer*:  
       - If levels match (both weights or both features) AND variables are numerically identical → Proceed to Step 1.  
       - Else (e.g., A reports weights, B reports features) → **HAND-OFF** to team lead. Reason: "Level/variable mismatch."  

  2. **STEP 1: Test necessity (10 min)**  
     - *Question*: Is the shared variable causally necessary for both anomalies?  
     - *Method*:  
       - For each anomaly, patch the variable’s activations from a *baseline* (non-anomalous) input into the anomalous prompt.  
       - Check if the anomaly disappears (e.g., wrong date → correct date).  
     - *Sufficient answer*:  
       - If both anomalies vanish → Proceed to Step 2.  
       - If one/both persist OR no baseline exists → **SPLIT**. Reason: "Variable not necessary for both."  

  3. **STEP 2: Test functional equivalence (15 min)**  
     - *Question*: Does the variable produce the *same effect* in both contexts?  
     - *Method*:  
       - **Patching test**: Patch variable activations from A into B’s prompt, and vice versa.  
         - Success: Output of B becomes identical to A (or vice versa), or anomaly transfers (e.g., B now exhibits A’s error).  
       - **Attribution test**: If patching is inconclusive, compare feature attributions (e.g., attention patterns or top-activating tokens).  
         - Success: Attributions are indistinguishable (e.g., both attend to dates; both fire on "refusal" tokens).  
     - *Sufficient answer*:  
       - Patching/attributions show identical effect → **MERGE**.  
       - Effects differ (e.g., A’s patch changes B’s output but not to A’s anomaly) → **SPLIT**.  
       - Ambiguous → **SPLIT** (burden of proof on MERGE).  

  4. **STEP 3: Final verdict (3 min)**  
     - Paste verdict into ticket:  
       - **MERGE**: "Same mechanism: Variable [ID] at [level] causes both anomalies. Evidence: necessity (Step 1) and shared effect (Step 2)."  
       - **SPLIT**: "Distinct mechanisms: [Reason from Step 1/2]."  
       - **HAND-OFF**: "Unresolved: [Reason from Step 0]."  

  ---

  #### Test Cases & Verdicts
  **(a) Two wrong-date prompts, same block necessary for both**  
  - Step 0: Both report weights (block 10). Proceed.  
  - Step 1: Patching with baseline fixes both anomalies → Proceed.  
  - Step 2: Patch block 10 from A into B → B outputs A’s wrong date. Patch B into A → A outputs B’s wrong date. → **MERGE**.  
  - *Cost*: 20 min (patching dominates). Risk: None (prevents duplicate work on same circuit).  

  **(b) Refusal/sentiment flips, same feature under same prefix**  
  - Step 0: Both report features (feature #832). Proceed.  
  - Step 1: Patching with baseline removes both flips → Proceed.  
  - Step 2:  
    - Patching test: Patch #832 from refusal into sentiment prompt → sentiment prompt now refuses. Patch sentiment into refusal → refusal prompt flips sentiment.  
    - Attribution: Both fire on "safety" tokens (e.g., "harmful", "danger"). → **MERGE**.  
  - *Cost*: 25 min. Risk: None (confirms feature is multi-trigger).  

  **(c) "One circuit" pair (expected split)**  
  - *Setup*: Two math errors (A: misadds 2-digit numbers; B: misorders operations). Reported as same circuit (head 3.4).  
  - Step 0: Both report weights (head 3.4). Proceed.  
  - Step 1: Patching head 3.4 with baseline fixes both → Proceed.  
  - Step 2:  
    - Patching test: Patch head 3.4 from A into B → B still misorders operations (no transfer).  
    - Attribution: A attends to tens/units columns; B attends to operators. → **SPLIT**.  
  - *Cost*: 30 min. Risk: 1 week rework (but avoids contaminated generalization).  

  ---

  #### What the Procedure Cannot Settle  
  1. **Disagreements about explanations**:  
     - Step 2 attribution judgments (e.g., "are these attention patterns *really* similar?") → Handled by team lead.  
     - Step 0 level disputes (e.g., "should we care about weights or computations?") → About downstream goals, not the network.  

  2. **Limitations**:  
     - **Network unknowns**: Cannot resolve if the variable is part of a larger circuit (e.g., "is head 5.7 *actually* independent?").  
     - **Philosophical splits**: Cannot adjudicate "satisfying explanation" disputes (e.g., "is this *one mechanism* or two subcomponents?").  
     - **Edge cases**: Fails when patching/attributions are noisy or baselines are unavailable.  

  3. **Team lead’s call**:  
     - Step 0 (level/variable alignment).  
     - Ambiguous Step 2 judgments (e.g., "transfer partial but unclear").  
     - Disputes where burden of proof for MERGE is contested.  

  **Final note**: The procedure is usable without philosophy backgrounds—it mirrors debug workflows (isolate variable → test necessity → compare behavior). It shifts disputes from intuition to evidence, but leaves *interpretation* of that evidence to human judgment.
