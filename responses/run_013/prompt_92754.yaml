          - Also, if there is a dispute about the judgment in Step 3 (feature attributions), the team lead might be called to make a final decision.

     - The procedure cannot settle:
          - Whether a variable that is not the same but part of the same circuit should be considered the same mechanism? We require the same variable.
          - What if the mechanism involves multiple variables? Then we only consider the reported variable. If the report says the mechanism is a set, then we consider the set.

     - The procedure is limited to the reported variable and the available tools. It cannot discover new variables.

  ### Final Procedure

  **Step 0: Level of Description**
     - Confirm that both anomalies are reported at the same level (both weights or both features). If not, hand off to team lead.
     - If the level is computation or not weights/features, hand off to team lead.
     - Otherwise, proceed.

  **Step 1: Same Variable?**
     - Check if the reported difference-making variable (or set) for anomaly A is the same as for anomaly B (e.g., same attention head, same feature).
     - If not, verdict: SPLIT. Reason: different variables.
     - If same, proceed.

  **Step 2: Necessity Test**
     - For each anomaly, check if a baseline input (without the anomaly) is provided or available.
     - For anomaly A:
          - Patch the state of the variable V from the baseline of A into the anomaly prompt of A at the location of V.
          - Run the model and check if the anomaly disappears.
          - Repeat for anomaly B.
     - If both tests show the anomaly disappears (V is necessary), proceed.
     - If one or both baselines are missing, verdict: SPLIT. Reason: cannot test necessity.
     - If one or both tests fail (anomaly does not disappear), verdict: SPLIT. Reason: V not necessary for one or both.

  **Step 3: Transfer Test and Feature Similarity**
     - Perform activation patching:
          a. Patch the state of V from anomaly A into the anomaly prompt of B at the location of V. Run and record the output.
          b. Patch the state of V from anomaly B into the anomaly prompt of A at the location of V. Run and record the output.
     - Check:
          - In (a), if the output of B becomes the output of A (or the anomaly of A appears in B) then transfer A->B is successful.
          - In (b), similarly for B->A.
     - If both transfers are successful, verdict: MERGE.
     - If one or both transfers fail, then check feature attributions for V in both anomalies:
          - If the pattern of activation (for a feature) or attention (for a head) is judged by the engineer to be the same (e.g., same tokens, same type of concept), then verdict: MERGE.
          - Otherwise, verdict: SPLIT. Reason: transfer failed and feature patterns differ.

  **Verdict Line Examples**:
     - MERGE: "MERGE: The same mechanism (at [level]) is responsible for both anomalies, centered on variable [V]. Evidence: V is necessary in both and [transfer test succeeded OR feature patterns are similar]."
     - SPLIT: "SPLIT: Insufficient evidence to merge. Reason: [Step and reason, e.g., 'different variables (Step 1)', 'V not necessary for both (Step 2)', 'transfer failed and feature patterns differ (Step 3)']."

  **Hand-off**: 
     - Only at Step 0: "HAND-OFF: Level of description mismatch or not weights/features."

  This procedure should be executable in 30 minutes per pair, given the tools.
