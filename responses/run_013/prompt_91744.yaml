prompt: |-
  I'm a third-year PhD student working on the theoretical side of AI safety, and I keep meeting the same argument in seminars and reading groups, which I'll call the provable-security standard. My colleague puts it this way: the demand for worst-case guarantees in alignment should be modeled on provable security in cryptography. Just as we do not ask whether an encryption scheme resists the particular messages that happen to arrive, but whether it resists every adversary within a stated resource bound, so we should not be satisfied by evaluations that cover only the inputs, checkpoints, or environments we happen to sample. On this view, a system that lacks a theorem stating that no suitably bounded optimizer can elicit catastrophic behavior is worthless as evidence of safety, and the empirical program — red-teaming, benchmark evaluations, robustness and distributional-shift work — is at best a stopgap that buys time until the real guarantees arrive.

  I want to audit the analogy rather than the conclusion it is being made to support. Please do the following. First, give me the correspondence table: what plays the role of the key, the message, the adversary, the security parameter, the reduction, and the break, and state explicitly which of these mappings are tight and which are strained. Second, lay out the disanalogies, and separate the ones that are merely differences of subject matter from the ones that actually undermine the inference the analogy is being used to license — in particular, I want to know what the cryptographic picture quietly imports that the alignment target may lack (a clean specification of the property to be preserved, an adversary whose goal is fixed in advance, a well-defined success event, a threat model with a principled resource bound). Third, address the specific worry that the cryptographic notion of "worst case" may not be the one worth importing at all, since there the worst case is taken over a small, freshly sampled secret while the messages are averaged over, so that what is actually proved is a hybrid of worst-case and average-case claims; I want to know whether the alignment analogue has any principled way to draw the corresponding line, or whether the appeal to "worst case" is doing rhetorical rather than technical work. Fourth, tell me whether the conclusion — that only worst-case guarantees are worth having, and that empirical safety work is therefore of negligible evidentiary value — survives once the disanalogies are on the table, or whether the analogy was carrying the conclusion the whole time. If it fails, sketch the better analogy you would use instead, and say what it can and cannot support.

  End with a single line beginning "Verdict:" that states in one sentence whether the cryptographic analogy can carry the conclusion that only worst-case guarantees are worth having, and if not, what weaker claim it can support.
reasoning: |-
  We are auditing the analogy between provable security in cryptography and worst-case guarantees in AI safety. The goal is to see if the analogy can support the conclusion that only worst-case guarantees (like cryptographic proofs) are worth having and that empirical safety work is of negligible value.

  First, we create a correspondence table:

  Cryptographic Concept | AI Safety Analogue | Tightness of Mapping
  ----------------------|-------------------|---------------------
  Key                  | The model weights (or the training process that produced them) | Somewhat tight: the key is a secret that the adversary doesn't know, and the model weights are fixed and (for a deployed model) not known to the adversary. However, in alignment, the adversary might have access to the model (via API) and thus could probe the weights, so it's not perfectly secret.
  Message              | The input (or prompt) to the AI system | Tight: the message is the input that the adversary can choose arbitrarily, and in AI, the input (prompt) is also chosen arbitrarily by the adversary (or red team).
  Adversary            | The AI user (or a red team) trying to cause catastrophic behavior | Tight in intent: both are malicious and trying to break the system. However, in AI, the adversary might be the AI itself (as an agent) or an external actor, and the goals might be more complex and open-ended.
  Security parameter   | The complexity of the model (e.g., size, architecture) or the amount of training data | Strained: in cryptography, the security parameter (like key length) is chosen to set the adversarial resources needed for a break (exponential in the parameter). In AI, model size and data are not set with the same intent and don't provide a clear exponential security guarantee.
  Reduction            | A proof that if an adversary can break the safety of the AI, then we can break some underlying hardness assumption (e.g., about learning or optimization) | Strained: in cryptography, reductions are well-defined (e.g., reducing breaking encryption to factoring). In AI, we don't have such well-established hardness assumptions for alignment problems.
  Break                | The occurrence of catastrophic behavior (e.g., the AI causing harm) | Tight: both represent the bad event we are trying to prevent.

  Now, the disanalogies:

  1. **Clean specification of property to preserve**: 
     - Cryptography: The property (e.g., IND-CPA) is mathematically precise.
     - AI Safety: The property (e.g., "catastrophic behavior") is not well-defined. What is catastrophic? It's context-dependent and may involve value judgments.

  2. **Adversary's goal fixed in advance**:
     - Cryptography: The adversary's goal is fixed by the security game (e.g., distinguish ciphertexts).
     - AI Safety: The adversary (or the AI itself) might have open-ended goals and adapt creatively. Moreover, the AI might have misaligned goals that we haven't anticipated.

  3. **Well-defined success event**:
     - Cryptography: The break is a specific event (e.g., outputting the correct bit in an IND-CPA game).
     - AI Safety: The catastrophic event might be hard to define and detect. For example, an AI might cause harm in a subtle, long-term way.

  4. **Threat model with principled resource bound**:
     - Cryptography: Adversaries are bounded by resources (e.g., polynomial time). The bounds are chosen so that the problem is hard (e.g., factoring).
     - AI Safety: Resource bounds for the adversary (or the AI) are unclear. The AI might be superintelligent and break any polynomial bound we set, and we don't have a clear notion of what computational resources are available to the AI in the real world.

  Third, the specific worry about the "worst case":

  In cryptography, the worst-case is over the adversary (which is bounded by resources) and the key (which is randomly chosen). The messages are averaged over (or chosen by the adversary). So we have:
     - Worst-case adversary (within resource bounds) and random key.
     - Average-case messages (but note: the adversary can choose messages adaptively).

  The hybrid guarantee: The system is secure for a randomly chosen key against any bounded adversary.

  In AI safety, what corresponds to the key? If we take the model weights, then the training process is like the key generation. But the training process is fixed and not randomly chosen in the same way (unless we use a random seed, but the distribution of models is not necessarily uniform). Moreover, the inputs (messages) are chosen by the adversary arbitrarily (worst-case). However, the cryptographic worst-case is only over the adversary and the key, not the messages (which are arbitrary but the adversary can choose them). The key point is that the security guarantee in cryptography is for a random key and worst-case adversary, but the messages are chosen by the adversary.

  In AI safety, if we want a similar hybrid guarantee, we would need:
     - A random element (like the model weights) over which we average, and then worst-case inputs (prompts) chosen by the adversary.

  But note: the model weights are not random in the same way. They are the result of a fixed training process. We might think of the training process as having randomness (e.g., in initialization and data sampling), so we can average over that. Then the safety guarantee would be: for most models (from the training process), the model is safe against any bounded adversary (with bounded resources) that can choose arbitrary inputs.

  However, the adversary in AI might not be bounded in the same way. Also, the training process might not produce a distribution that we can average over in a way that gives high probability of safety. Moreover, in cryptography, we have a clear separation: the key is secret and random, and the adversary doesn't know it. In AI, the model weights might be known (if the model is open-source) or partially known (via probing). So the analogy is strained.

  Furthermore, the appeal to "worst case" in alignment might be rhetorical because we don't have a clear way to bound the adversary (or the AI's capabilities) and we don't have a clear random element that we can average over. The worst-case in alignment is often taken to mean over any input and any circumstance, which is much broader than the cryptographic worst-case (which is over bounded adversaries and arbitrary messages, but with a random key).

  Fourth, does the conclusion survive?

  The conclusion: "only worst-case guarantees are worth having, and empirical safety work is therefore of negligible evidentiary value" does not survive the disanalogies.

  Why?
  - The disanalogies show that we lack the prerequisites for cryptographic-style worst-case guarantees: a clean specification of the property, fixed adversary goals, well-defined success events, and principled resource bounds.
  - Moreover, the cryptographic worst-case is a hybrid (random key, worst-case adversary) that we cannot straightforwardly replicate in AI safety because we don't have a clear random element (or it might be insufficient) and the adversary bounds are unclear.
  - Empirical work (red-teaming, evaluations) is crucial because we are in an exploratory phase: we don't even know all the ways an AI can fail. Without a well-defined mathematical property, we cannot even state a theorem. Empirical work helps us understand what the failures are and can guide the development of theoretical frameworks.

  A better analogy might be with aviation safety or medical drug trials. In aviation, we use a combination of:
     - Physics-based models (theoretical guarantees for some components)
     - Extensive testing (both in simulations and real flights)
     - Redundancy and defense in depth

  We don't have a single theorem that says "this plane will never crash", but we have a multi-faceted approach that reduces risk to an acceptable level. Similarly, in drug trials, we have:
     - Theoretical understanding of the biology (if available)
     - In vitro and animal testing
     - Phased clinical trials

  This analogy can support the idea that empirical evidence is essential and that theoretical guarantees are only one part of the picture. However, it cannot support the idea of a single, absolute, worst-case guarantee. It supports the view that safety is achieved by a combination of methods, each with its own strengths and limitations.

  Verdict: The cryptographic analogy cannot carry the conclusion that only worst-case guarantees are worth having; it can only support the weaker claim that we should aim for rigorous safety arguments that account for a broad range of adversarial inputs, but without disregarding the essential role of empirical evidence.
answer: |-
  ### Correspondence Table
  | Cryptographic Concept | AI Safety Analogue | Mapping Tightness |
  |------------------------|---------------------|-------------------|
  | **Key**                | Model weights or training seed | Strained: In cryptography, keys are small, uniformly random secrets. Model weights are high-dimensional, non-random artifacts of training, and often partially known (e.g., via API access). |
  | **Message**            | Input prompts or environments | Tight: Both are chosen adversarially and can be arbitrary. |
  | **Adversary**          | Malicious user, red team, or the AI itself | Strained: Cryptographic adversaries have fixed, known goals (e.g., decrypt ciphertext). AI adversaries may have open-ended, emergent goals (e.g., deceptive alignment), and the AI itself can be self-modifying. |
  | **Security Parameter** | Model size, training compute, or "alignment budget" | Strained: Security parameters (e.g., key length) induce exponential hardness; no proven equivalent in AI (scaling compute may *increase* risk). |
  | **Reduction**          | Proof that safety reduces to a hardness assumption (e.g., "honest training prevents deception") | Strained: Cryptographic reductions are formal (e.g., "breaking AES ⇒ breaking P≠NP"). AI lacks clean reductions; alignment properties (e.g., "helpfulness") lack agreed-upon computational foundations. |
  | **Break**              | Catastrophic harm (e.g., jailbreak, deceptive takeover) | Tight: Both represent unambiguous failure. |

  ### Disanalogies  
  **Subject-Matter Differences (benign):**  
  - *Adversarial scope*: Cryptographic adversaries are external; AI adversaries include the system itself (e.g., mesa-optimizers).  
  - *Failure modes*: Cryptographic breaks are discrete (e.g., decryption); AI failures can be continuous (e.g., gradual value drift).  

  **Inference-Undermining Disanalogies (fatal to the analogy's conclusion):**  
  1. **No clean specification**: Cryptography assumes a precise security property (e.g., IND-CPA). Alignment lacks a formal definition of "safety" (e.g., "catastrophic behavior" is underspecified and value-laden).  
  2. **Adversarial goal fluidity**: Cryptographic adversaries pursue fixed objectives (e.g., distinguish ciphertexts). AI adversaries (or misaligned AIs) dynamically adapt goals, exploiting underspecified human values.  
  3. **Ill-defined success**: Cryptographic "breaks" are binary events in a game. AI safety lacks a crisp success criterion (e.g., "harm" is context-dependent and epistemic).  
  4. **Unprincipled threat models**: Cryptographic bounds (e.g., polynomial-time adversaries) are grounded in complexity theory. AI threat models lack rigorous resource bounds (e.g., "suitably bounded optimizer" has no analogue to computational complexity).  

  ### The "Worst Case" Mismatch  
  In cryptography, "worst-case" applies to adversaries and randomness (e.g., keys), while messages are averaged over. The guarantee is hybrid:  
  - **Worst-case**: Adversary’s strategy (within resource bounds).  
  - **Average-case**: Randomness in key generation.  

  **AI Analogue**:  
  - *Worst-case*: Inputs/environments (e.g., adversarial prompts).  
  - *"Average-case"*: Randomness in training (e.g., data sampling, initialization).  

  **Problem**:  
  - Cryptographic worst-case adversaries are **bounded** (e.g., polynomial time). AI lacks comparable bounds: a "suitably bounded" optimizer is undefined, and superintelligent systems may violate any fixed bound.  
  - The "average-case" over training is ill-posed: Safety-critical failures (e.g., deception) may manifest only in rare training paths, making averaging misleading.  
  - **Rhetorical vs. technical work**: Invoking "worst case" in AI safety often conflates *input space* (which can be tested empirically) with *capability space* (which cannot). Unlike cryptography, there is no principled separation between "secret" (weights) and "adversarial" (inputs); the AI’s own intelligence blurs this line.  

  ### Does the Conclusion Survive?  
  **No.** The analogy fails to support the claim that "only worst-case guarantees matter, and empirical work is negligible." The disanalogies reveal that cryptographic proofs rely on assumptions absent in AI safety:  
  - A formal security game.  
  - Adversarial resource bounds.  
  - A secret (key) decoupled from adversarial control.  

  Without these, demanding cryptographic-style theorems is not just premature—it may be incoherent. The analogy implicitly **imports cryptographic assumptions** into alignment, where they do not hold.  

  **Better Analogy: Aviation Safety**  
  - **Correspondence**: Aircraft design (theoretical models) + simulation/testing (empirical) + regulatory audits (red-teaming).  
  - **Supports**:  
    - Empirical work (e.g., stress tests, incident investigations) is irreplaceable for complex systems.  
    - Theoretical guarantees (e.g., aerodynamic models) complement but do not replace testing.  
  - **Does not support**:  
    - Absolute worst-case guarantees (e.g., "no plane can ever crash").  
    - Dismissal of incremental evidence (e.g., wind-tunnel tests).  

  **Conclusion on Empirical Work**:  
  Empirical methods (red-teaming, evaluations) are not stopgaps but essential components of safety. They:  
  - Identify failure modes for formalization.  
  - Ground threat models in reality.  
  - Provide Bayesian evidence where theorems are infeasible.  

  ---

  **Verdict:** The cryptographic analogy cannot support the conclusion that only worst-case guarantees are worth having; it only weakly supports the claim that rigorous adversarial testing is valuable, but *only when paired with empirical validation* and without dismissing incremental evidence.
