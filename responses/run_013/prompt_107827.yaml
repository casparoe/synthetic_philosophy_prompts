answer: |-
  ### Decision Tree: Can Machines Literally Have Beliefs?

  **Starting Commitment:** Treating a system *as if* it had beliefs is sometimes the best way to predict and explain its behavior (the "intentional stance"). Everyone agrees this is useful. But does it mean the system *actually* has beliefs?  

  **Instructions:** Answer each question based on the cases described. Follow your answers to a leaf position. Cases are referenced for illustration but are not exhaustive.  

  ---

  #### **Question 1: Is the intentional stance’s success SUFFICIENT for literal beliefs?**  
  *(If treating the system as a believer gives the best predictions, does it **really** have beliefs?)*  
  - **Yes** → Go to Question 2.  
  - **No** → Go to Question 3.  

  ---

  #### **Question 2: When two incompatible belief attributions predict equally well, is ONE objectively correct?**  
  *(Case 1: A lookup table behaves identically to a reasoning model. Both attributions work, but are they equally valid?)*  
  - **Yes** → **Position: Robust Interpretivism**  
    - *Commitment:* Beliefs are real and determined by the *best possible interpretation*, even if underdetermined by behavior.  
    - *Awkward commitment:* There’s a fact of the matter about beliefs with zero behavioral evidence to break the tie.  
    - *Status:* Unnamed (rarely defended).  
  - **No** → **Position: Interpretivism (Dennett)**  
    - *Commitment:* Beliefs are *only* useful attributions. If two work equally well, neither is "truer."  
    - *Awkward commitment:* Beliefs aren’t "in the system"; they’re tools for observers.  
    - *Status:* Named (Dennett).  

  ---

  #### **Question 3: Must a belief be an INTERNAL STATE that causally affects behavior?**  
  *(Case 3: A system says "I believe the meeting is Tuesday" as a prompted output, but nothing else depends on this. Case 4: An internal state is never read or used.)*  
  - **Yes** → Go to Question 4.  
  - **No** → **Position: Inert State Literalism**  
    - *Commitment:* Beliefs are internal states, even if causally inert (e.g., Case 4) or behaviorally isolated (e.g., Case 3).  
    - *Awkward commitment:* A system can "believe" things that never influence anything it does.  
    - *Status:* Unnamed (unattractive to most).  

  ---

  #### **Question 4: Must a belief state have a CORRECTNESS CONDITION?**  
  *(Must it be evaluable as true/false? Case 2: A reinforcement learner’s world model guides planning but isn’t reportable.)*  
  - **Yes** → Go to Question 5.  
  - **No** → **Position: Non-Representational Functionalism**  
    - *Commitment:* Beliefs are causal roles in behavior (e.g., "maze-navigator" in Case 2), with no truth conditions.  
    - *Awkward commitment:* "False beliefs" aren’t possible; beliefs are just functional patterns.  
    - *Status:* Unnamed (resembles Rylean behaviorism).  

  ---

  #### **Question 5: Does CAUSAL HISTORY determine content?**  
  *(Case 2 vs. Case 5: Identical systems where one learns a maze model and one is hand-coded by an engineer.)*  
  - **Yes** → **Position: Teleosemantics (Millikan/Papineau)**  
    - *Commitment:* Belief content depends on *how the state was acquired* (e.g., evolved/learned). Case 2 has beliefs; Case 5 does not.  
    - *Awkward commitment:* Functionally identical systems differ in beliefs based on history.  
    - *Status:* Named.  
  - **No** → Go to Question 6.  

  ---

  #### **Question 6: Must the system REPRESENT BELIEF ITSELF?**  
  *(Can it have beliefs without understanding what belief is?)*  
  - **Yes** → **Position: Higher-Order Thought (HOT) Theory**  
    - *Commitment:* A system must be able to *represent its own mental states* (e.g., via metacognition) to have beliefs.  
    - *Awkward commitment:* Most animals/AI lack beliefs (Case 2 fails).  
    - *Status:* Named (e.g., Rosenthal).  
  - **No** → **Position: Representational Theory of Mind (RTM/Fodor)**  
    - *Commitment:* Beliefs are structured internal representations (e.g., "maze maps" in Cases 2/5) that guide behavior. Causal history doesn’t matter.  
    - *Awkward commitment:* Requires a "language of thought," excluding unstructured systems (e.g., Case 1 lookup table).  
    - *Status:* Named (Fodor).  

  ---

  ### Notes on the Tree  
  - **Unoccupied Combinations:**  
    - *A=Yes + Q2=Yes*: Robust Interpretivism is coherent but unattractive (no way to resolve underdetermination).  
    - *A=No + Q3=No*: Inert State Literalism is explored but widely rejected.  
    - *A=No + Q3=Yes + Q4=Yes + Q5=No + Q6=Yes*: HOT Theory + RTM-style representationalism is unexplored.  
  - **Indistinguishable Views:** Interpretivism (Q1=Yes, Q2=No) has no rivals on this tree. Other leaves map cleanly to named positions.  
  - **Diagnostic Power:** Cases 1–5 split views at key nodes (e.g., Case 1 tests structural vs. pragmatic views; Cases 2/5 test causal history).  

  ### How to Use in Seminar  
  1. **Start with the intentional stance** (agreed by all).  
  2. **Walk the tree live:** Poll students on each question using the cases.  
  3. **Assign positions** based on leaf outcomes, not labels.  
  4. **Focus on commitments:** "If you answered X to Q3, you must accept Y about Case 4."  
  5. **Avoid doctrine wars:** Positions emerge from case intuitions, not texts.  

  This tree resolves vocabulary debates by forcing concrete commitments to cases. It reveals disagreements where they matter (e.g., "Is Case 5 a believer?") and exposes hidden agreements.
