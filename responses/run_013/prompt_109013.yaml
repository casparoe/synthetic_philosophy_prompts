prompt: |-
  I'm a 4th-year PhD student in logic (my thesis is on resource-bounded reasoning, so I'm already in the weeds on this stuff) and I pay rent two days a week on the "rules as code" team at a legal-aid nonprofit — we take chunks of benefits legislation and turn them into an executable ruleset so caseworkers can run eligibility instead of trying to read the statute. We keep having the same fight: the engine spits out a result, someone says its obviously wrong, and the room splits between "add a rule and fix it" (stay inside the system) and "override the engine, the statute clearly didn't mean that" (step outside it).

  I keep thinking about the MU puzzle — the MIU system, start from MI, four rewrite rules, and you can never get to MU, and the reason you can never get there is only visible from outside, via the invariant about the number of I's not being divisible by 3. As I read it, the point is that some questions can't be answered by grinding the rules, and that the move to the meta level is the creative move rather than a cop-out. I don't need a reading list, I've read the stuff, I just need the procedure.

  So: write me a decision procedure my team can actually run on a disputed case. Some things I want pinned down:

  - the questions in order, what counts as a sufficient answer to each, and where the procedure just stops with a no — i.e. "this is an in-system case, the engine's answer stands, stop arguing";
  - where it hands off to a human instead of deciding, because the question is about what the legislature meant rather than what the ruleset derives. We have a policy lead who has to sign off, and I want those handoff points named rather than blurred into the rest;
  - tests to tell a legitimate jump out of the system from a fudge. This is the part I actually care about. In the MIU case the jump is legitimate because it's backed by a proof *about* the system — an invariant you can state and defend in advance. I want the analogous tests: something like "would you have accepted this meta-principle before you knew which way it cut", or "re-encode your jump as an explicit rule and re-run the whole corpus to see what else it changes". You tell me what the right tests are, and which of them are real logic and which are just discipline dressed up as logic.

  Then run it on three cases: (1) a claimant denied by the encoded rules where everyone in the room agrees the denial is wrong; (2) a case where the engine's answer feels wrong to me but the procedure says it's in-system and I should stop — I want to be told that plainly if that's what it says; (3) an advocate making a jump-out argument that I suspect is bogus, where I want the failure diagnosed against the tests rather than just "this one fails".

  Constraints: about two hours per case, I'm the only one on the team with any logic training, the caseworkers don't read code, and anything that changes a rule has to go through the policy lead. And be honest about where this procedure can't help — I suspect the analogy breaks somewhere, since statutes have purposes and MIU doesn't, and I'd rather know where the break is than have it papered over.
reasoning: |-
  We are given a real-world problem in the context of "rules as code" for legal aid. The team has an engine that encodes legislation into executable rules, but sometimes the engine's output is disputed. The user (a PhD student in logic) wants a decision procedure to handle such disputes, with specific features:

  1. A step-by-step procedure that either:
     - Confirms the engine's result as correct (within the system) and stops further argument.
     - Hands off to a human (the policy lead) when the question is about legislative intent.
  2. Tests to distinguish legitimate meta-level jumps (like the invariant in the MU puzzle) from illegitimate fudges.
  3. Application to three test cases.

  The user also wants honesty about where the analogy to formal systems (like MIU) breaks, particularly because statutes have purposes.

  Let's design the procedure.

  **Preliminary Considerations:**

  - The encoded rules form a formal system (let's call it S).
  - The statute (the law) is the intended meaning, but the encoding might not capture all nuances.
  - Disputes arise when the engine's result (according to S) seems to contradict the intended meaning of the statute.

  **Decision Procedure Outline:**

  We'll break the procedure into steps. At each step, we either resolve the dispute or move to the next step. The goal is to be systematic and to avoid arbitrary overrides.

  **Step 0: Initial Check (Obvious Error)**
  - Check if the engine's result is due to a known bug (e.g., a typo, a missing rule, or an incorrect implementation of a rule). If so, fix the bug (with policy lead approval) and re-run. This is not a dispute about the rules but about the implementation.

  **Step 1: Rule Coverage Check**
  - Question: Does the encoded ruleset S contain a rule that directly covers the case?
    - If not, then we have a gap. Hand off to the policy lead to decide if a rule should be added (based on the statute). This is a handoff because the statute might have intended to cover the case, but the encoding missed it.
    - If yes, proceed to Step 2.

  **Step 2: Rule Application Check**
  - Question: Was the rule applied correctly by the engine?
    - Check the derivation (the steps the engine took). This requires tracing the rules. If there's an error in the application (e.g., the engine misapplied a rule due to a data issue), fix the data or the rule application and re-run.
    - If the rule was applied correctly, then the engine's result is consistent with S. But we are in a dispute because the result seems wrong. Proceed to Step 3.

  **Step 3: Consistency with Statutory Text**
  - Question: Is the result required by the plain text of the statute?
    - This step requires human judgment. The team (including non-coders) reads the relevant part of the statute and checks if the engine's result is literally what the statute says.
      - If the statute clearly requires the result, then even if it seems harsh, the engine is correct. The procedure stops: the engine's answer stands. (This is the "stop arguing" point for in-system cases.)
      - If the statute does not clearly require the result (or if the statute is ambiguous), proceed to Step 4.

  **Step 4: Consistency with Statutory Purpose**
  - Question: Is the result consistent with the purpose of the statute?
    - This step is about the meta-level: the purpose is an invariant we expect the system to preserve. But note: the purpose is not encoded in S, so we are stepping out.
    - If the result is inconsistent with the purpose, then we have a candidate for a meta-level correction. But we need to test the legitimacy of this jump. Go to Step 5.
    - If the result is consistent with the purpose, then the engine's result stands, and we stop.

  **Step 5: Legitimacy Tests for Meta-Level Jumps**
  - Here we have a proposed override because the result violates the statutory purpose. We need to ensure this override is not arbitrary. We apply tests:

    **Test 1 (Pre-commitment):** Would the team have accepted the principle behind the override (e.g., "the statute must not deny benefits in situation X because that would defeat the purpose of helping people in condition Y") before seeing this case? If the principle is ad hoc (i.e., invented to win this case), it fails.

    **Test 2 (Consistency with Corpus):** If we encode the override as a new rule (or exception) and re-run the entire corpus of cases, does it produce a consistent set of results? Specifically, we check:
      - Does it fix the current case?
      - Does it break other cases that were previously correct?
      - Are there new anomalies?
    This test requires running the engine on the corpus (which might be time-consuming but necessary).

    **Test 3 (External Validation):** Is the override supported by external authorities? For example:
      - Legislative history (if available and considered reliable).
      - Case law (court decisions interpreting the statute).
      - Consistent interpretation by experts (like the policy lead).

    **Test 4 (Formal Invariant):** Can we articulate the override as an invariant? (This is the closest to the MIU invariant.) For example: "The number of I's mod 3 is invariant in MIU". In the legal context, an invariant might be: "No claimant with income below the poverty line shall be denied." We must check that this invariant holds in the entire system (or at least in the relevant part of the statute) and that the current case violates it.

    **Test 5 (Minimal Change):** Is the override the smallest change that fixes the problem? We prefer targeted fixes over broad rewrites.

  - If at least two of Tests 1-4 are passed (and Test 5 is considered), then the override is legitimate. We hand off to the policy lead to decide whether to change the ruleset (by adding a rule or an exception) based on this analysis.

  - If the tests are not passed, then the override is not justified. The engine's result stands.

  **Where the Analogy Breaks:**

  - The MIU system is a closed formal system. Legislation, however, is open to interpretation and has a purpose. The purpose is an external invariant that we must consider, but it is not always explicit and may be contested.

  - In law, we have tools like legislative history and case law that don't exist in formal systems.

  - The procedure above tries to bridge the gap by including both formal checks (rules, derivation) and substantive checks (purpose, external authorities).

  **Application to Test Cases:**

  We'll now run the procedure on the three cases.

  **Case 1: Claimant denied by the encoded rules, and everyone agrees the denial is wrong.**

  - Step 0: Check for bugs. (Assume none.)
  - Step 1: Rule coverage? (Assume there is a rule that leads to denial.)
  - Step 2: Rule application? (Assume correct.)
  - Step 3: Consistency with statutory text? The statute might literally require denial, but the team thinks it's wrong. So we proceed to Step 4.
  - Step 4: Consistency with statutory purpose? The denial is inconsistent with the purpose (everyone agrees). So we go to Step 5.
  - Step 5: Legitimacy tests:
    - Test 1: The principle (e.g., "benefits should not be denied in this circumstance because ...") is one the team would have accepted beforehand? (Assume yes, because it's obvious to everyone.)
    - Test 2: We run the corpus. The override fixes this case and doesn't break others? (Assume yes, because it's a clear gap.)
    - Test 3: External validation? (Assume available and supportive.)
    - Test 4: Formal invariant? We can state one (e.g., "no one with characteristic X should be denied") and it holds in the system except for this gap? (Assume yes.)
    - Test 5: Minimal change? (Assume yes.)

    The tests pass. We hand off to the policy lead to approve a rule change.

  **Case 2: Engine's answer feels wrong to me, but the procedure says it's in-system.**

  - Step 0: No bug.
  - Step 1: Rules cover the case.
  - Step 2: Rule applied correctly.
  - Step 3: The statutory text clearly requires the result. Even though it feels wrong, the engine is following the law. We stop: the engine's answer stands.

    Why? Because we are bound by the text. If we don't like the result, we must change the law (via legislation), not the encoding.

    The procedure tells you plainly: stop arguing. The result is in-system and correct.

  **Case 3: Advocate making a jump-out argument that is bogus.**

  - Suppose the engine denies a claim, and an advocate argues that the denial is wrong because it violates the purpose. But we suspect it's bogus.

  - We go through the steps until Step 4: we agree the purpose might be relevant? Then Step 5.

  - Apply the tests:

    - Test 1: Would we have accepted the principle before? The advocate's principle might be too vague or ad hoc. (Fail.)
    - Test 2: If we encode the override, we run the corpus and find it breaks many cases. (Fail.)
    - Test 3: No external validation. (Fail.)
    - Test 4: The proposed invariant (if any) is not actually an invariant in the system. (Fail.)
    - Test 5: The change might be non-minimal. (But even if minimal, other tests fail.)

    The tests fail. The override is not legitimate. The engine's result stands.

    The failure is diagnosed: for example, the principle was not pre-committed, and it breaks the corpus.

  **Time Constraints:**

  - The procedure must take about two hours per case. The most time-consuming part is Step 5 (Test 2: running the corpus). We must have a representative corpus that can be run quickly. If not, we might need to sample or rely on other tests.

  **Team Constraints:**

  - The caseworkers don't read code. Therefore, the procedure must be explainable in natural language. The tracing in Step 2 might require a simplified explanation.

  - Only the user has logic training. The procedure must not require deep logic for the others (rely on group reading of the statute and policy judgments).

  - Rule changes go through the policy lead. The handoffs are at:
    - Step 1: when there is a gap in the rules (policy lead decides if a rule should be added).
    - Step 5: when the tests are passed, the policy lead decides whether to change the ruleset.

  **Final Procedure Document:**

  We can write the procedure as a flowchart or a checklist. Here's a linear version:

  **Dispute Resolution Procedure:**

  1. **Bug Check:** If the dispute is due to a known bug (in code or data), fix and re-run. If resolved, stop. Else, proceed.
  2. **Rule Coverage:** If the case is not covered by any rule in the system, hand off to policy lead to decide if a rule should be added. Else, proceed.
  3. **Rule Application:** Check the engine's derivation. If incorrect, fix and re-run. If correct, proceed.
  4. **Statutory Text:** Read the statute. If the engine's result is unambiguously required by the text, then the engine's answer stands. Stop. Else, proceed.
  5. **Statutory Purpose:** If the result is inconsistent with the statutory purpose, proceed to Step 6. Else, the engine's answer stands. Stop.
  6. **Legitimacy Tests for Override:** Apply the following tests to the proposed override:
     - Test 1 (Pre-commitment): Would the principle have been accepted before this case?
     - Test 2 (Corpus Consistency): If encoded, does the override fix this case without breaking others? (Run the corpus.)
     - Test 3 (External Validation): Is there support in legislative history, case law, or expert opinion?
     - Test 4 (Formal Invariant): Can you state an invariant that the override restores, and is it defensible?
     - Test 5 (Minimal Change): Is the change as narrow as possible?
     - If at least two of Tests 1-4 are passed (and Test 5 is considered), then hand off to the policy lead for a rule change. Else, the override is rejected, and the engine's answer stands.

  **Note on Time:** For Test 2 (corpus run), if the full corpus takes too long, use a subset (e.g., a random sample of 100 cases) and note the limitation.

  This procedure provides a structured way to resolve disputes, minimizes arbitrary overrides, and clearly marks when human judgment (policy lead) is required.
answer: |-
  Below is a decision procedure tailored to your "rules as code" context, designed to resolve disputes about engine outputs. It incorporates your constraints (2-hour limit, no coding skills required for caseworkers, policy lead handoffs) and explicitly addresses the "jump-out" tests inspired by the MU puzzle analogy. The procedure prioritizes efficiency, distinguishes between in-system and meta-level issues, and includes safeguards against arbitrary overrides.

  I'll present the procedure first, then apply it to your three cases. Finally, I'll outline where the analogy to formal systems (like MIU) breaks down.

  ---

  ### **Decision Procedure: Resolving Disputes About Engine Outputs**
  **Goal**: Determine if the engine's result is correct within the encoded ruleset, requires a meta-level override (handoff to policy lead), or is an in-system case that must stand.  
  **Input**: A disputed case, the encoded ruleset \( S \), the statute text, and the engine's derivation trace.  
  **Output**: One of:  
  - **"In-System: Result Stands"** (stop arguing),  
  - **"Handoff to Policy Lead"** (for legislative intent), or  
  - **"Override: Engine Error"** (with specific meta-tests passed).  

  **Procedure Steps** (run in order, max 2 hours total):  
  1. **Concrete Derivation Check (15 mins)**  
     - **Question**: Can the engine's derivation be traced step-by-step using *only* the encoded rules in \( S \) and valid input data?  
     - **Sufficient Answer**:  
       - **Yes** (derivation is correct) → Proceed to Step 2.  
       - **No** (derivation error found) → Fix the implementation bug. Re-run the case.  
     - **Stop Condition**: If derivation is correct, proceed. If not, resolve and close.  

  2. **Statutory Literalism Check (30 mins)**  
     - **Question**: Does the engine's result directly conflict with the *explicit, unambiguous text* of the statute?  
     - **Sufficient Answer**:  
       - **Yes** (e.g., statute says "benefits granted if X," engine denies despite X) → Handoff to policy lead. Reason: Encoding gap or error.  
       - **No** (result aligns with statute text) → Proceed to Step 3.  
       - **Unclear** (text is ambiguous) → Proceed to Step 3.  
     - **Handoff Point**: Named as **"Literal Text Conflict"** → Policy lead must decide if ruleset \( S \) misencodes the statute.  

  3. **Purpose-Driven Invariant Check (45 mins)**  
     - **Question**: Does the result violate a *predefined invariant* of the statute's purpose?  
     - **Invariant Definition**: An invariant is a high-level principle (e.g., "No one below poverty line is denied") derived from the statute's purpose, documented *in advance* (not ad hoc).  
     - **Sufficient Answer**:  
       - **Violation Found** → Proceed to **Legitimacy Tests** (Step 4).  
       - **No Violation** → **"In-System: Result Stands"**. Stop arguing.  
       - **No Predefined Invariant** → Handoff to policy lead. Reason: Invariant not formalized.  
     - **Handoff Point**: Named as **"Purpose Invariant Undefined"** → Policy lead must define/approve invariants before encoding.  

  4. **Legitimacy Tests for Meta-Level Jump (30 mins)**  
     - **Trigger**: Only if Step 3 finds a purpose invariant violation. Tests if a meta-level override is justified.  
     - **Tests** (all must pass):  
       1. **Pre-Commitment Test**:  
          - **Question**: Was this invariant (and its application) accepted *before* this case arose?  
          - **Evidence**: Documentation (e.g., design notes, policy lead sign-off).  
          - **Failure**: Ad hoc principle (e.g., "This feels unfair").  
       2. **Corpus Impact Test**:  
          - **Question**: If the override is encoded as a rule, does it fix *this* case without breaking >5% of prior corpus cases?  
          - **Method**: Run a *subset* of high-priority corpus cases (e.g., 20 key cases) with the proposed rule.  
          - **Failure**: Override causes new errors or anomalies.  
       3. **External Consistency Test**:  
          - **Question**: Is the override supported by *authoritative external sources* (e.g., case law, legislative history)?  
          - **Evidence**: Citations from trusted references (e.g., legal databases).  
          - **Failure**: Based solely on intuition.  
     - **Outcome**:  
       - **All Pass** → **"Override: Engine Error"** → Handoff to policy lead to encode the fix.  
       - **Any Fail** → **"In-System: Result Stands"** → Stop arguing.  

  #### **Key Features**  
  - **Efficiency**: Uses sampling (e.g., 20 corpus cases) to fit 2-hour constraint.  
  - **Handoff Clarity**: Two named handoff points: **"Literal Text Conflict"** (Step 2) and **"Purpose Invariant Undefined"** (Step 3). Policy lead decides here.  
  - **Stop Conditions**: "In-System" outcomes end debate; tests prevent frivolous overrides.  
  - **Tests as Logic vs. Discipline**:  
    - **Logic**: Pre-Commitment Test (requires documented invariants) and External Consistency Test (objective evidence).  
    - **Discipline**: Corpus Impact Test (empirical check; not formal logic but prevents regressions).  

  ---

  ### **Where the Analogy Breaks**  
  The MU puzzle analogy works for syntactic gaps (like invariants) but fails in three places:  
  1. **Purpose vs. Syntax**: Statutes have teleological goals (e.g., "reduce poverty"), while MIU has no purpose. This makes "purpose invariants" subjective if not predefined.  
  2. **Ambiguity**: Legal text has intentional vagueness (e.g., "reasonable efforts"); MIU rules are unambiguous.  
  3. **External Authorities**: Law uses case law/legislative history; MIU relies solely on formal proofs.  
  **Result**: The procedure handles syntactic gaps well (via invariants) but delegates purpose/ambiguity to policy leads.  

  ---

  ### **Case Applications**  
  Assume a simplified statute: *"Benefit granted if (A) income < $30k and (B) dependent children ≥ 1. Exceptions: (1) No benefit if assets > $50k; (2) No benefit if fraud detected."*  
  Encoded ruleset \( S \) includes these literally.  

  #### **Case 1: Claimant Denied, Everyone Agrees It's Wrong**  
  - **Facts**: Claimant has $25k income, 1 child, $40k assets (in a retirement account statute excludes). Engine denies based on "assets > $50k" due to a typo: rule checks `assets > 50000` (no comma).  
  - **Procedure**:  
    1. **Step 1 (Derivation)**: Trace shows `assets = 40000 → 40000 > 50000? → false → deny`. Correct per \( S \) but typo makes "50000" incorrect.  
       - **Answer**: **No** (derivation error). Fix typo → result changes to "grant".  
    2. **Stop**: Resolved without further steps.  
  - **Outcome**: Not a dispute about rules; implementation bug.  

  #### **Case 2: Engine's Answer Feels Wrong, But In-System**  
  - **Facts**: Claimant has $29k income, 0 children, $0 assets. Engine denies (rule B fails). You feel it's harsh—claimant is destitute.  
  - **Procedure**:  
    1. **Step 1 (Derivation)**: Correct.  
    2. **Step 2 (Statutory Text)**: Statute explicitly requires "dependent children ≥ 1." No conflict → proceed.  
    3. **Step 3 (Purpose Invariant)**: Assume predefined invariant: "No denial if income < $20k" (poverty line). Claimant income $29k > $20k → **no violation**.  
    4. **Stop**: **"In-System: Result Stands"**.  
  - **Why It Works**: Legitimate stop. The "harsh" result is text-compliant, and no purpose invariant applies. You *must* accept the engine.  

  #### **Case 3: Bogus Jump-Out Argument**  
  - **Facts**: Claimant has $35k income, 2 children, $10k assets. Engine denies (rule A fails: income > $30k). Advocate argues: "Statute aims to help families, so we should override for this hardworking parent!"  
  - **Procedure**:  
    1. **Step 1 (Derivation)**: Correct.  
    2. **Step 2 (Statutory Text)**: No conflict → proceed.  
    3. **Step 3 (Purpose Invariant)**: Invariant: "No denial if income < $30k and children ≥ 1." Claimant income $35k → **no violation**.  
    4. **Step 4 (Legitimacy Tests)**: Advocate proposes new invariant: "Grant if family has children." Tests:  
       - **Pre-Commitment**: No prior documentation → **FAIL**.  
       - **Corpus Impact**: Adding this rule would grant benefits to 40% of denied cases (e.g., $100k income + children), breaking corpus → **FAIL**.  
       - **External Consistency**: No case law supports ignoring income → **FAIL**.  
    5. **Outcome**: **"In-System: Result Stands"**. Failure diagnosed: Pre-Commitment and Corpus Impact tests failed (ad hoc principle; breaks corpus).  
  - **Why It Works**: Tests expose the jump as arbitrary. Advocate’s "purpose" isn’t codified or consistent.  

  ---

  ### **Summary**  
  - **When It Works**: Resolves syntactic gaps (like MU’s invariant) and implementation errors. Forces discipline on overrides.  
  - **Handoffs Clear**: Policy lead intervenes only for text conflicts or undefined purpose invariants.  
  - **Limitations**:  
    - Invariants must be predefined; else, handoffs slow things.  
    - Corpus tests rely on sampling (due to time limits).  
    - Legal purposes are fuzzier than formal invariants—this can’t be fully eliminated.  
  **Recommendation**: Use this procedure to force rigor in overrides, but document purpose invariants *proactively* during encoding to reduce disputes.
