answer: |-
  ## Reopening Address: The Living Work of Truth

  Ladies and gentlemen, colleagues, friends, and most especially, to the descendants who join us today, welcome. It is a profound moment to reopen our doors after this period of refurbishment. This modest space, dedicated to documenting one of history’s darkest chapters, feels renewed, not just in its physical presence, but in our shared commitment to its purpose. We stand here not merely in a room refurbished, but within a continuing conversation – a conversation about the past that shapes our understanding of the present and our obligations for the future.

  This museum, as you know, is a small institution. We hold one permanent room, a reading corner, a wall of solemn faces gazing back at us. Yet, within this physical modesty lies a vast responsibility: the responsibility to bear witness, accurately and honestly, to the truth of a genocide. That word, genocide, carries immense weight. It signifies not just violence, but a systematic attempt to eradicate a people. The evidence for what happened here – the sheer scale, the meticulous intent, the enduring scars – is vast and convergent. It is found in the harrowing testimonies of survivors, documented in the chilling records left by the perpetrators themselves, etched into the landscape of this region, and carried in the memories and the very existence of the families represented in our front rows today. This foundation is not a matter of opinion; it is the bedrock upon which we stand.

  However, standing firm on that bedrock does not mean standing still. In fact, to truly honour the truth, we *must* move, we must adapt, we must be willing to see more clearly. This refurbishment was an opportunity not just for paint and polish, but for reflection and, where necessary, revision. We have changed panels before. We changed one today, correcting a date following the patient, invaluable counsel of our friend, Professor Emeritus [Historian's Name], who has long been a supporter and a careful reader of our work. We fully expect to change panels again in the future. Why? Because history, as a discipline, is not scripture carved in stone; it is a living process of inquiry.

  Think of it like restoring an old, complex painting. As techniques improve, as new light falls upon the canvas, details previously obscured may come into focus. A date might be clarified by newly discovered records. A figure might be adjusted based on more comprehensive analysis of existing archives. This is the meticulous work of historical revision: refining the picture, sharpening the details, *within the established framework of the event itself*. It is driven by evidence, by scholarly consensus, by a commitment to greater accuracy. It is the opposite of dogma; it is the sign of a healthy, honest engagement with the past. When we change a date or a number here, it is not because the fundamental reality is in question, but because our precise understanding of its contours deepens. This is how knowledge grows. This is how we pay respect to the complexity of what occurred.

  This commitment to revision, however, stands in stark contrast to something entirely different: the demand that we debate the *fact* of the genocide itself. This is a demand we will not meet. And it is crucial to understand that our refusal is not born of fear, nor is it censorship. It is a matter of rigorous methodology, of intellectual integrity.

  Consider the nature of genuine historical investigation. It weighs evidence. It looks for convergence across different sources – the accounts of victims, the records of perpetrators, physical evidence, demographic studies. It acknowledges gaps and uncertainties, but it does not allow a single missing document or an unresolved detail to negate the overwhelming convergence of testimony and fact that establishes the core event. Crucially, genuine historical correction is not directional; it seeks accuracy wherever the evidence leads, whether it confirms, complicates, or adjusts our previous understanding.

  The demand to "debate the genocide," however, operates by entirely different rules. It treats converging mountains of evidence as if they count for nothing, while elevating any fragment of doubt, however minor or manufactured, to decisive importance. It applies a standard of proof so impossibly high for this event that it would never be demanded for any other historical fact of similar scale and documentation. Its "corrections" invariably run in only one direction: towards minimisation, towards exculpation, towards denial. This is not revision; it is rejection. It is not an attempt to refine the picture; it is an attempt to paint over it entirely.

  To stage such a "debate" within these walls would be a profound betrayal of our purpose and our method. It would lend false equivalence to a position that fundamentally rejects the established rules of evidence and historical inquiry. It would misuse this space, dedicated to remembrance and understanding based on fact, as a platform for dismantling the very reality we are here to document. It would ask the descendants present, and indeed all of us who confront this history, to pretend that the foundations are still being laid, when in truth, the structure stands firm, demanding our attention to the details within it. We refuse not to avoid challenge, but because such a "debate" is not a legitimate historical exercise; it is an attempt to undermine the foundations of historical understanding itself.

  So, as we reopen today, we reaffirm this dual commitment. We commit to being an institution that revises: alert, humble, and responsive to new evidence and scholarly insight that refines our presentation of the established facts. We will change panels when the evidence warrants it. And we commit, with equal steadfastness, to being an institution that recognises the genocide as historical fact. We will not engage in debates designed to negate that reality, not out of weakness, but out of fidelity to the methods of history and out of respect for the truth we are bound to serve.

  This small museum, in this provincial city, holds a vast responsibility. Through careful revision, we strive for ever greater accuracy. Through our clear stance on the fundamental truth, we provide a space for genuine learning and remembrance. We honour the victims not with unquestioning dogma, but with a living, breathing commitment to truth – a truth that is both solid in its foundations and meticulous in its details. Thank you.
