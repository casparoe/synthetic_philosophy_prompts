prompt: |-
  So I've fallen down a rabbit hole on the Stern Review vs Nordhaus thing — the fight over how much your allowed to discount future climate damages — and I want you to treat it as a case study in the theory of pure time preference, not just summarize who said what. Map it properly: what parameter are they actually disagreeing about, and what does each side think it's doing when it picks its number — describing how markets behave, or making an ethical choice, or quietly doing both and hoping nobody notices? Then I want the standard move pressure-tested: the trick of splitting the discount rate into a part that's just "later is later" and a part that's "future people will be richer, so a dollar means less to them." Does that split really do the work people want it to, or is the "richer" half smuggling in assumptions about growth that nobody argued for?

  Then flip it around: what does this whole episode show about pure time preference itself? Is there any fact of the matter here, or are the two camps just trading value judgments and dressing them up as models with parameters? And test it with a case neither of them really argues about — two otherwise identical worlds, same people, same everything, except one gets the benefit now and the other in three hundred years. If someone prefers the first world, is that any different from preferring one person over another just because of where they happen to sit in time? If it's not different, does that sink the practice, or does it just mean the practice needs an actual defense instead of being assumed? And where the theory goes quiet, please just say so rather than inventing a tidy resolution.
