  ### Stage 1: Brainstorming for Cases 1-8
  I will describe the finite stages, identify which quantities have limits, note which do not, and list candidate principles supported by each case. The goal is to expose tensions and avoid premature synthesis.

  #### **Case 1: Switch Lamp**
  - **Finite stages**: At each stage \(n\) (time \(t_n = 1/2^{n-1}\) min before noon), the switch is toggled. Lamp starts off. After \(k\) stages, the lamp is on if \(k\) odd, off if \(k\) even.
  - **Limits**: The lamp state (as a sequence) oscillates (1, 0, 1, 0, ...) with no limit. No other physical quantity is tracked.
  - **Verdict**: Indeterminate at noon.
  - **Candidate principles**: 
    - CP1: If the state function (e.g., lamp state) has no limit as \(t \to\) noon, the state at noon is indeterminate.
    - CP2: Indeterminacy arises when the process defines no continuous extension to noon.

  #### **Case 2: Dial Lamp**
  - **Finite stages**: At each stage \(n\), dimmer is set to \(1/2^{n-1}\). Brightness at \(t_n\) is \(1/2^{n-1}\).
  - **Limits**: Brightness sequence: 1, 1/2, 1/4, ... converges to 0. Limit exists.
  - **Verdict**: Determinate (brightness 0 at noon).
  - **Candidate principles**:
    - CP3: If a physical quantity (e.g., brightness) has a limit as \(t \to\) noon, that limit is the noon state.
    - CP4: Convergence of a real-valued quantity implies determinacy.

  #### **Case 3: Tape**
  - **Finite stages**: At stage \(n\), symbol \(a_n\) is written to position \(n\): \(a_n = 1\) if \(n\) square, else 0. After \(k\) stages, tape has finite sequence \(a_1\) to \(a_k\).
  - **Limits**: The symbol sequence \((a_n)\) has no limit (oscillates between 0 and 1 indefinitely). The running count of 1s diverges. But the infinite sequence \((a_n)\) is fully defined.
  - **Verdict**: Determinate (tape holds the infinite sequence \((a_n)\) at noon).
  - **Candidate principles**:
    - CP5: If a supertask completes all components of an infinite object (e.g., sequence) by noon, that object is determinate, even if no "state" converges.
    - CP6: Determinacy holds for the entire history/output, not just the instantaneous state.

  #### **Case 4: Marbles Out**
  - **Finite stages**: At stage \(n\), add marbles \(10n-9\) to \(10n\) (10 marbles), remove marble \(n\). After \(k\) stages, marbles in jar: all \(\leq 10k\) except those \(\leq k\).
  - **Limits**: The count of marbles grows (9k after \(k\) stages), diverging to infinity. The set of marbles changes, but for each marble \(m\), it is removed at stage \(m\) and never added again.
  - **Verdict**: Determinate (jar empty at noon).
  - **Candidate principles**:
    - CP7: For object collections, if each object's membership (in/out) is settled permanently by some stage, the set at noon is determinate.
    - CP8: Determinacy via per-object permanence (checking each marble's fate).

  #### **Case 5: Marbles Kept**
  - **Finite stages**: At stage \(n\), add marbles \(10n-9\) to \(10n\), remove marble \(10n\) (highest added). After \(k\) stages, marbles in jar: all numbers \(\leq 10k\) not divisible by 10.
  - **Limits**: Marble count grows (9k after \(k\) stages), diverging. For each marble \(m\), if \(m\) not divisible by 10, it is never removed; else removed at stage \(m/10\).
  - **Verdict**: Determinate (infinitely many marbles remain, specifically non-multiples of 10).
  - **Candidate principles**:
