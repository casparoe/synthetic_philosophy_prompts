  ### Stage 3: Synthesizing the Principle
  Your verdicts require a multi-clause principle. The core tension is between:
  - Needing convergence for instantaneous states (Cases 1, 2, 8).
  - Allowing infinite objects to be determinate without convergence (Case 3).
  - Allowing per-object or aggregate determinacy for collections (Cases 4–6).
  - Honoring stipulation (Case 7).

  **Proposed Principle**:  
  A supertask has a determinate outcome if and only if at least one of the following holds:  
  1. **Continuity Extension Clause (CEC)**: The relevant physical quantity, as a function of time \(t < \text{noon}\), has a limit as \(t \to \text{noon}\), and the outcome is that limit. *(Forces: Cases 2, 8; Forces against: Case 1 without continuity)*  
  2. **Infinite Object Completion Clause (IOC)**: The outcome is the entire completed infinite object (e.g., sequence, set) defined by the supertask, provided the supertask specifies all components deterministically. *(Forces: Case 3; Forces against: Rejecting IOC would make Case 3 indeterminate, contradicting your verdict)*  
  3. **Per-Object or Aggregate Clause (POA)**:  
     - For object collections, if membership of each object is settled permanently by some finite stage, the set is determinate. *(Forces: Cases 4, 5)*  
     - If not, an aggregate property (e.g., cardinality) is determinate if it is invariant under all possible resolutions of non-determinism (e.g., random choices). *(Forces: Case 6 for cardinality)*  
  4. **Stipulation Clause (SC)**: The outcome is explicitly stipulated by the rules. *(Forces: Case 7)*  

  **Key Features**:  
  - CEC handles Cases 1 (failure), 2, 8. IOC handles Case 3. POA handles Cases 4–6. SC handles Case 7.  
  - POA distinguishes between full set determinacy (Cases 4–5) and partial (Case 6), where only aggregates are settled.  
  - "Settled permanently" in POA means: For each object, after some stage, its status (in/out, etc.) never changes.  
  - "Invariant under all resolutions" in POA means: The property holds no matter how random/non-deterministic choices unfold.  

