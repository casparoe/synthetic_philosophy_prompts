  **Final Principle Statement**:  
  For any supertask ending at noon:  
  - If a physical quantity \(Q(t)\) for \(t<\text{noon}\) has a limit \(L\) as \(t \to \text{noon}\), then \(Q(\text{noon}) = L\) (CEC).  
  - If the supertask completes a deterministic infinite object (e.g., sequence, set), that object exists at noon (IOC).  
