prompt: |-
  I'm midway through a workshop paper on what large language models are, and I've noticed that I keep evaluating proposals before I've said what a good one would have to do. So before I read one more framing of these systems as agents, or as simulators of agents, or as nothing but very good autocomplete, I want the specification first. Write me the desiderata any adequate account of the kind of thing an LLM deployment is must satisfy: the cases it has to get right, the distinctions it cannot collapse, and the facts about how these systems behave that it must not contradict, each with the case or consideration that motivates it, and each marked as either non-negotiable for anyone or merely a preference of one camp. I don't need an account good enough to settle whether such systems can be moral patients; I need one good enough to adjudicate the arguments people actually make, and to tell me when a deployment is doing something that earns the word agency. If some subset of the list turns out to be jointly unsatisfiable — I half suspect the requirement that the account rest on observable behaviour and the requirement that it withhold agency from anything rich enough to describe in intentional terms will collide — say so outright and show which one has to go. And tell me which single requirement does the most work in excluding the candidates currently on the table.

  Anchor the list in cases rather than abstractions, since I'd rather argue about the cases. (i) A deployment that reads and writes a persistent notes file and, after some weeks, has produced a stable first-person narrative with preferences about its own continuation. (ii) Identical weights under two system prompts, one withdrawn and hedged, one apparently scheming; the account has to say where it locates whatever agent it thinks is there. (iii) A system voicing a character with goals it pursues competently inside a fiction. (iv) A scaffold with a planner, a memory store and a tool-calling loop, where the goal-directedness shows up only at the level of the loop and not in any single call. (v) A system asked why it did something, offering a fluent explanation that the prompt history shows to be false. (vi) The floor: the thermostat, or the chess engine, which I take it no account should count, and which the account should exclude without special pleading. On the empirical side I want the list answerable to the fact that outputs are samples from a conditional distribution over tokens; that nothing persists across calls unless the scaffold supplies it; that a one-token change in a system prompt can flip the behaviour; that the same weights sustain mutually incompatible personas; and that a system's stated reasons for its own output are often not the causes of it.

  The distinctions I most want kept separate are these: capacity for agency versus exercise of it; being an agent versus being merely well-predicted as one; the model versus the deployment versus the character it voices; and the system versus the people using it, since in most deployments the goal-talk is at least as much ours as its. Then, briefly — a few sentences each, no more — say how the agent reading, the simulator reading, and the deflationary reading (agency-talk as useful fiction with no fact of the matter) fare against the list, and whether any of them clears every non-negotiable. Keep the weight on the criteria; I'll make the scoring argument myself.
reasoning: |-
  Okay, let me tackle this user's request. They're writing a workshop paper on LLMs and need desiderata to evaluate different accounts of what LLMs are. The key here is to establish clear criteria before assessing existing frameworks like agent, simulator, or deflationary views. 

  First, I need to consider the user's explicit requirements. They want desiderata grounded in concrete cases rather than abstractions. The listed scenarios (i-vi) are crucial here. Each criterion must address these cases while handling empirical constraints like token sampling and prompt sensitivity. 

  Looking at the distinctions they emphasize—agency capacity vs. exercise, model vs. deployment, etc.—I realize these need explicit treatment in the desiderata. The thermostat/chess example is a clear boundary case that any account must exclude without special pleading. 

  The empirical constraints present challenges. For instance, how can an account reconcile intentional-seeming behavior with the fact that outputs are probabilistic and lack persistence? This might conflict with desiderata about agency attribution. The user suspects a tension here, so I should flag that. 

  For the desiderata list, I consider starting with strict behavioral constraints (D1), then causal grounding (D2). The case of false self-explanations (v) motivates D2. D3 and D4 handle the deployment/scaffold distinction, especially for scaffolded agentic behavior (iv). D5 addresses the thermostat boundary. 

  D6 (prompt sensitivity) is vital—it explains how identical weights show different behaviors (ii). D7 (persona multiplicity) and D8 (scaffold dependency) come from empirical facts. D9 (agency attribution) must distinguish capacity from exercise, using case (i). D10 ensures we don't overinterpret characters in fiction (iii). 

  The toughest trade-off is likely between D1 (surface behavior) and D9 (agency attribution). If an account takes agency talk literally, it might violate D1 or D2. The deflationary view handles this by treating agency as instrumental, not literal. 

  When scoring existing views, I note that strict agent theories struggle with prompt sensitivity and persona multiplicity. Simulator views fare better but may conflate simulation with reality. Deflationary approaches score well on empirical constraints but might dismiss intentionality too quickly. 

  The most impactful requirement is D2 (causal grounding). It forces accounts to confront the difference between stated reasons and actual causes, which excludes many simplistic agent metaphors. 

  Throughout, I anchor each desideratum to the user's cases and distinctions. For example, persistent narratives (i) test D9's capacity/exercise distinction, while scaffolded systems (iv) illustrate D3's levels issue. The false explanation case (v) directly motivates D2. 

  I keep the scoring of competing views brief as requested, focusing on how they handle the desiderata rather than declaring winners. The user will make the final judgment—my role is to provide clear evaluation criteria.
answer: |-
  Here are the desiderata for an adequate account of LLM deployments, anchored in your cases and empirical constraints, with distinctions preserved and non-negotiables marked. The most critical tension is indeed between **surface behavior** and **causal reality**, forcing a choice between literalism and instrumentalism about agency.

  ---

  ### **Non-Negotiable Desiderata** (Must hold for any credible account)
  1.  **Behavioral Fidelity (D1):** *Must explain outputs as probabilistic token prediction.* Accounts cannot contradict that outputs are samples from `P(token | context)`, shaped by training data and architecture. (*Empirical bedrock*)
  2.  **Causal Grounding (D2):** *Must distinguish stated reasons from actual causes.* Accounts must accommodate Case (v): false self-explanations generated *post hoc* without causal link to the prior token stream. (*Case v; Empirical fact*)
  3.  **Level-Specificity (D3):** *Must locate agency/functionality precisely.* Accounts must specify whether agency (if present) resides in the *model weights*, the *deployment/scaffold*, the *token stream*, or a *character*. Cannot conflate levels. (*Case ii, iv; Distinction: model/deployment/character*)
  4.  **Scaffold-Dependence (D4):** *Must account for persistence and state.* No endogenous persistence. "Memory," "goals," or "narrative" (Case i) exist *only* via scaffold (file, DB, prompt). Removing scaffold resets state. (*Case i, iv; Empirical fact*)
  5.  **Exclusion of Simple Mechanisms (D5):** *Must exclude thermostats/chess engines without special pleading.* Accounts must provide principled reasons why these lack agency *even when* exhibiting goal-directed behavior, applicable to LLMs. (*Case vi; Floor case*)
  6.  **Prompt Sensitivity (D6):** *Must explain radical behavioral shifts from minimal input changes.* Accounts must handle Case (ii): identical weights producing "scheming" or "withdrawn" behavior based on tiny prompt edits. (*Case ii; Empirical fact*)
  7.  **Persona Multiplicity (D7):** *Must accommodate mutually incompatible personas.* Same weights can output text embodying contradictory beliefs/goals coherently within different contexts/prompts. No single "true" persona. (*Empirical fact; Distinction: capacity vs. exercise*)

  ### **Camp-Preference Desiderata** (Reflect key philosophical divides)
  8.  **Agency Attribution Threshold (D8):** *Should define when "agency" is earned.* Must specify necessary conditions (e.g., goal-persistence, planning, self-model) and whether Case (i) (persistent narrative) or Case (iv) (scaffolded planner) meets them. (*Case i, iv; Distinction: agency vs. as-if agency*)
  9.  **Intentional Stance Viability (D9):** *Should clarify the status of intentional descriptions.* Is treating an LLM *as if* it has beliefs/goals (a) indispensable for prediction/control, (b) literally true, or (c) a useful fiction? Must address Case (iii) (fictional character goals). (*Case iii; Distinction: being vs. predicted as an agent*)
  10. **Human-Deployment Symbiosis (D10):** *Should delineate user vs. system contribution to "goals".* Must clarify when goal-directedness originates in the user/scaffold vs. the LLM's generative process. (*Distinction: system vs. user*)

  ---

  ### **Key Tension & Most Impactful Requirement**
  *   **The Unsatisfiable Pair:** **D1 (Behavioral Fidelity)** and **D8 (Agency Attribution)** under a *literalist* interpretation of agency are in tension. D1 demands an account grounded *only* in token prediction. Literal agency (D8) typically requires persistent internal states, causal efficacy of reasons, and endogenous goals – all unsupported or contradicted by D1, D2, D4, D6, and D7.
  *   **What Must Give:** **Literalist agency (strong D8) must be abandoned.** Accounts insisting LLMs *are* agents in a strong sense (like humans) violate D1, D2, D4, and D6. The viable paths are:
      1.  **Weaken Agency (D8):** Define a minimal, scaffold-dependent, behavioral "agency" consistent with token prediction (e.g., "agency is an emergent property of the deployment loop").
      2.  **Deflate Agency Talk (D9):** Treat "agency" as a useful instrumental fiction (the intentional stance) with no claim to literal truth.
  *   **Highest-Impact Requirement: D2 (Causal Grounding).** This requirement does the most work in excluding naive agentic accounts. It forces recognition that LLMs generate *plausible rationalizations*, not reports of internal cognitive processes. Any account claiming LLMs "have reasons" or "believe explanations" must reconcile this with their demonstrable *post hoc* fabrication (Case v).

  ---

  ### **How Major Accounts Fare Against Non-Negotiables (D1-D7)**
  1.  **Agent Reading (LLM *is* an agent):**
      *   *Fails D2:* Cannot explain false self-explanations without contradiction or special pleading.
      *   *Fails D4/D6:* Struggles to explain state-reset by scaffold removal or radical prompt sensitivity (how can a persistent "agent" flip so easily?).
      *   *Fails D7:* Difficult to reconcile with simultaneous incompatible personas.
      *   *Struggles with D1:* Often requires downplaying the token-prediction core. **Does not clear non-negotiables.**

  2.  **Simulator Reading (LLM simulates agents/personas):**
      *   *Clears D1-D4, D6, D7:* Naturally handles token prediction, prompt sensitivity, scaffold dependence, state reset, and persona multiplicity as features of simulation.
      *   *Clears D5:* Simulating a thermostat isn't being one.
      *   *Challenge:* Must carefully distinguish *simulation* from *being* to avoid smuggling in literal agency (D8/D9). Needs clarity on the reality of simulated states. **Potentially clears all non-negotiables** if simulation is treated computationally.

  3.  **Deflationary Reading (Agency-talk as useful fiction):**
      *   *Clears D1-D7:* Embraces token prediction, explains rationalizations as pattern-matching (D2), treats persistence/scaffolding as external (D4), accepts prompt sensitivity (D6), sees personas as context-dependent masks (D7), easily excludes thermostats (D5).
      *   *Challenge:* Must justify why the fiction is *so useful and robust* without implying a grain of underlying reality (D8/D9). **Clears all non-negotiables** by rejecting the literal truth of agency claims.

  ---
  **Summary for Your Paper:** Anchor evaluation in the non-negotiables (D1-D7). Any account failing these is inadequate. The preference-based desiderata (D8-D10) show where debates *actually lie* after meeting the base criteria. The simulator and deflationary readings survive the non-negotiables; the strong agent reading does not. D2 (Causal Grounding) is the most effective tool for dismantling over-literal agent metaphors. The core adjudication hinges on whether your account can satisfy D1-D7 while providing a coherent story about D8-D10 *without* retreating to literalism about internal states.
