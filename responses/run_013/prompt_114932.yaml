prompt: |-
  I run the numbers desk at a small political-risk shop — six of us, we sell country risk to funds, and I'm the one who signs off on the probability estimates that go out the door. A few times a week somebody hands me a conditional instead of a fact. Not "the army will move on the refinery" but "if the army moves on the refinery, the unions call a general strike by the end of the month." Or "if the budget passes in March, the president finishes his term." I never know what to do with these. Nudging my probability of the strike feels like doing something, but I couldn't tell you what; leaving it alone feels like ignoring intel I paid for; and when I try to explain either choice to my boss I end up waving my hands. I have a vague memory of a philosophy puzzle about a paratrooper with a radio who gets a conditional back instead of a location, and I know there are named rules for this kind of update (Jeffrey something, imaging, some argument about minimizing information), but I can't look any of it up and I'd need it in a form I can actually run at my desk in twenty minutes without a stats degree. That's what I want from you.

  Write me a procedure. Questions in order, what counts as a sufficient answer to each, where it stops with a "no, you can't use this one," and where it hands the thing back to me as a judgment call rather than a calculation. It has to tell me what to do when the source can't or won't give me the number I'm missing — I can't always get a second email out of these people — and what I'm supposed to write in the file: a point estimate, a range, or a refusal with a reason. Mark the steps that are judgement dressed up as arithmetic; I'd rather know which ones are mine to own than have it look like a machine did it.

  Then run it on three cases, and be honest about which ones it can't settle:
  1. The refinery one. My prior on the strike is low, and my prior on the army moving is lower.
  2. A case where I already put the antecedent at about 90% — does any of the machinery buy me something over just updating on the strike directly?
  3. A case where I'd basically written the antecedent off, near zero, and the source gives me the conditional anyway. I suspect this is where things break.

  One of these should come out badly for me — if the procedure says I can't use a report I'd already half-believed, fine, say so. Seperate those from the ones it handles cleanly.

  Under 850 words, start with the one-line default rule I should use when I don't have time for the rest, skip the reading list (I won't read it), and tell me at the end what this thing can't do.
reasoning: |-
  Okay, let me tackle this user's problem. They run a political-risk desk and need a practical way to handle conditional probability estimates from sources. The user wants a clear procedure—not theory—that they can apply quickly at their desk. 

  First, I recall the core issue: how to update probabilities when given "If A, then B" statements instead of direct facts. The user mentioned philosophical puzzles like the paratrooper with a radio, which relates to belief updating with conditionals. But they need actionable steps, not academic references.

  The key frameworks here are Bayesian updating and Jeffrey conditionalization. But I must avoid jargon. The user needs a decision tree that tells them when they can calculate versus when they must rely on judgment. 

  Breaking it down:
  - The main missing piece is often the probability of B given not-A. Without that, they can't fully update. 
  - The procedure must handle cases where sources won't provide additional data.
  - Outputs should be clear: point estimate, range, or a refusal note.

  I consider designing the steps around three critical questions:
  1. Can they extract P(B|A) from the conditional? 
  2. Can they estimate P(B|¬A) from existing data?
  3. If not, is there a fallback approach?

  For the refinery example (low prior on strike and army move), the procedure should flag it as unreliable since both probabilities are low—updating might be noise. When the antecedent is high (90%), they can almost treat it as a direct update. But when the antecedent is near zero, the conditional is useless—that's where it breaks.

  The user also wants transparency on which steps are judgment vs calculation. Steps like estimating P(B|¬A) or deciding to ignore low-probability conditionals should be marked as judgment calls.

  Finally, I'll test three cases: 
  1. Refinery scenario (low priors → "ignore" recommendation)
  2. High antecedent probability (clean update) 
  3. Near-zero antecedent (automatic discard)

  The one-line default rule? "Ignore conditionals where the antecedent is improbable (<10%) or you lack P(B|¬A); otherwise, use the Bayesian update formula." This balances practicality with rigor.
answer: |-
  Here's your field procedure for handling conditional reports. Default rule when pressed for time: **Ignore conditionals where the antecedent probability < 10% or you lack P(B|¬A); otherwise, update P(B) using the weighted average P(B) = P(B|A)P(A) + P(B|¬A)P(¬A).**

  **Procedure:**
  1.  **Identify A (antecedent) and B (consequent).** *Sufficient:* Clear statement of "if A, then B." *Stop if:* Ambiguous (e.g., "might lead to"). Hand back for clarification.
  2.  **Can you extract a usable P(B|A) from the report?** *Sufficient:* Source provides a number/range OR strong qualitative language you can map (e.g., "certain"=99%, "likely"=70-85%, "probable"=55-70%). *Stop if:* Vague ("possible," "could happen") - write in file: *"Conditional report received: If A then B. Unable to quantify P(B|A) from source language. Judgment: [Brief reason why unusable, e.g., 'source too vague']."*
  3.  **What is your current P(A)?** *Sufficient:* Your existing point estimate or credible range. *Stop if:* Truly unknown (rare) - hand back for urgent research/judgment.
  4.  **Can you estimate P(B|¬A)? (JUDGMENT CALL)** *Sufficient:* Your existing P(B) is a decent proxy OR you have strong evidence about B's behavior specifically *without* A. *Stop if:* No credible basis (e.g., B is highly dependent on A). Hand back: *"Conditional report unusable. Lack credible estimate for P(B|¬A). Source follow-up requested."* If source unresponsive, file: *"Conditional report received: If A then B. Requires P(B|¬A) for update; unavailable. Prior on B unchanged."*
  5.  **Is P(A) ≥ 10%? (JUDGMENT CALL)** *Sufficient:* Your P(A) meets threshold. *Stop if:* P(A) < 10% - file: *"Conditional report noted: If A then B. Antecedent P(A)=[Your %] < 10%, deemed too improbable for reliable update. Prior on B unchanged."*
  6.  **Calculate New P(B):** `P(B)_new = [P(B|A) * P(A)] + [P(B|¬A) * (1 - P(A))]`. *Output:* Point estimate. *If inputs were ranges, propagate uncertainty (use min/max sensibly) and output a range.* File: *"Updated P(B) to [X%] (Range: Y%-Z%) based on conditional report [Source ID] and prior estimates."*

  **Marked Judgments:** Steps 4 (Estimating P(B|¬A)) and 5 (10% P(A) Threshold) are your calls disguised as steps. Own them.

  ---

  **Case Execution:**

  1.  **Refinery (Low P(Strike), Low P(Army Move)):**
      *   A = Army moves on refinery. Your P(A) = 5% (<10% threshold).
      *   **Procedure Stops at Step 5.** File: *"Conditional report noted: If army moves, strike by month-end. Antecedent P(Army Move)=5% < 10%, too improbable for update. Prior P(Strike) unchanged at [Your Prior]%."* **Can't Settle.** You ignore it. (This is the "bad" outcome - you discard intel you paid for, but the procedure deems it noise).

  2.  **Antecedent ~90% (e.g., Budget Passes → President Finishes Term):**
      *   A = Budget passes in March. Your P(A) = 90%.
      *   Report: "If budget passes, president finishes term." You map this to P(B|A) = 95% (source implies high certainty).
      *   **Step 4:** What's P(B|¬A)? *Judgment:* If the budget *fails*, crisis is likely. You estimate P(B|¬A) = 10% (low chance of finishing term).
      *   **Step 6:** `P(B)_new = (95% * 90%) + (10% * 10%) = 85.5% + 1% = 86.5%`.
      *   **Output:** Point estimate ~87%. File update. **Cleanly Settled.** Machinery *does* buy you something: it forces you to consider the low-probability disaster scenario (¬A) explicitly, preventing overconfidence. Your prior P(B) was likely close to P(A)=90% *if* you assumed passage implied survival; this adjusts slightly downward due to the risk if it fails.

  3.  **Antecedent ~0% (e.g., "If King suddenly abdicates (P=0.1%), military dissolves parliament."):**
      *   A = King abdicates. Your P(A) = 0.1% (<10% threshold).
      *   **Procedure Stops at Step 5.** File: *"Conditional report noted: If king abdicates, military dissolves parliament. Antecedent P(Abdication)=0.1% < 10%, too improbable for update. Prior P(Dissolution) unchanged."* **Can't Settle.** You ignore it. This is where things break *by design*.

  ---

  **What This Can't Do:**
  1.  **Handle correlation:** If A and B share hidden causes, P(B|¬A) becomes invalid.
  2.  **Process fuzzy conditionals:** "If tensions rise..." needs hard thresholds.
  3.  **Replace source assessment:** Garbage P(B|A) in = garbage out.
  4.  **Solve for missing priors:** You *must* have P(A) and P(B|¬A).
  5.  **Handle complex dependencies:** Chained conditionals (If A then B, if B then C) require bespoke modeling.
  6.  **Quantify radical uncertainty:** Total regime collapse scenarios defy stable probabilities.

  **Core Limitation:** This is Bayesian averaging. It works best when A is plausible and B's behavior without A is knowable. When those fail, it tells you to ignore the report or make a naked judgment (Step 4).
