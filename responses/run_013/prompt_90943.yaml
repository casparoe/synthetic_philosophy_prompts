answer: |-
  ## OFFICE OF CONSTITUTIONAL RECORDS  
  FREQUENTLY ASKED QUESTIONS  

  **Q1: How do I propose an amendment to the Constitution?**  
  A: Amendments must be proposed according to the procedure currently specified in Article V, Section 1 of the Constitution. Please submit Form OCR-28 "Notice of Constitutional Amendment Proposal" in triplicate, accompanied by the required filing fee and notarized signatures from the requisite number of qualified sponsors, as defined by the current procedure.  

  **Q2: Where can I find the current text of the Constitution’s amendment clause (Article V, Section 1)?**  
  A: The authoritative current text is maintained in our Public Registry (Room 4B). Please note that historical versions of Article V are archived for reference in Annex D, but only the current version governs amendment procedures.  

  **Q3: How can I verify which version of the amendment clause is currently in force?**  
  A: The Office of Constitutional Records maintains the authoritative register. The current version is determined by the most recent amendment to Article V, Section 1, enacted according to the procedure valid *at the time of its enactment*. A certified copy is available upon request (Fee Schedule 7.1a applies).  

  **Q4: But wasn’t the current amendment procedure itself adopted using an earlier version of Article V?**  
  A: Correct. Procedure Alpha-Gamma (the current framework) was adopted in 1992 under Procedure Beta-Delta, which was the operative version of Article V at that time.  

  **Q5: Doesn’t the current Procedure Alpha-Gamma explicitly repeal Procedure Beta-Delta?**  
  A: Yes. Procedure Alpha-Gamma, Section 12(a) states: "All prior iterations of this Section are hereby repealed and superseded." This is standard constitutional drafting practice.  

  **Q6: If Procedure Beta-Delta was repealed by Alpha-Gamma, what legal basis authorized the adoption of Alpha-Gamma itself?**  
  A: Alpha-Gamma was adopted under the valid procedure in force *at the moment of its adoption* – namely, the now-repealed Procedure Beta-Delta. Its validity derives from that prior authorization.  

  **Q7: How can a repealed rule authorize anything, including the rule that repealed it?**  
  A: The authorization occurred *before* the repeal. At the moment of Alpha-Gamma's adoption, Beta-Delta was in full force and effect. The subsequent repeal of Beta-Delta does not retroactively invalidate actions taken while it was operative. This is established precedent (See *In re: National Calendar Reform*, 1993).  

  **Q8: Does this mean earlier amendments adopted under even older repealed procedures might be invalid?**  
  A: The Office recognizes no inherent invalidity in properly ratified amendments based on subsequent changes to Article V. An amendment is either *validly adopted* under the procedure in force at the time of adoption, or it is not. Questions of "unamendability" pertain to substantive limits, not procedural lineage.  

  **Q9: Isn't there a problem of infinite regress? What was the original authority?**  
  A: The Office operates on the principle of the *de facto* constitutional order. Our mandate is to administer the procedures as they stand and maintain the records. Speculation about ultimate origins falls outside our administrative purview and is not germane to filing amendments, requesting certified copies, or paying fees.  

  **Q10: What happens if two groups claim to amend Article V using conflicting interpretations of the current procedure?**  
  A: The Office will process all submissions meeting the *formal requirements* of the current Procedure Alpha-Gamma as we understand them. Any substantive conflict regarding the validity of competing amendments is a matter for the Constitutional Tribunal, not this Office. Please ensure your forms are correctly filled out.  

  **Q11: Isn’t this entire situation logically unstable?**  
  A: The constitutional framework functions through the diligent application of established bureaucratic processes. Stability is maintained by adherence to procedure and record-keeping. If you perceive instability, you may be using an outdated form. Please check our website for OCR-28 Rev. 9/2023.  

  **Q12: What is the legal basis for the existence and authority of this FAQ page?**  
  A: This FAQ is an administrative instrument issued under the authority of Regulation OCR-114(b), "Public Guidance Dissemination Protocols." Regulation OCR-114(b) was promulgated by the Director of Constitutional Records pursuant to the powers granted under Article V, Section 1(7)(d) of the Constitution (Procedure Alpha-Gamma), which itself derives its authority from… well, you know how it works. Please direct further meta-administrative inquiries to Annex D, Subsection γ. Forms are available at the front desk.
