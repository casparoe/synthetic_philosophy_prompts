  Breaking down the summary sentence by sentence as requested:
  First part is solid - Kant does say lying is always wrong, based on universalizability. The CI argument about language collapse is accurate Kantian reasoning.

  The murderer example is correctly presented as Kant's view. That "must tell truth" part is famously controversial but textually supported.

  Now the problematic part: "murderer has a right to truth" and duty correlation. This is where the summary goes off track. Kant never frames it as the murderer having rights - he focuses on the liar's duty regardless of others' status. The rights language is misleading.

  Concluding claims: Calling Kant an absolutist is fair, but "ignores consequences" is oversimplified. Kant cares about consequences in terms of universalizability, just not immediate outcomes. The forfeiture argument is definitely not Kant's - it's a later defender's attempt to soften the position.

  Important to note that Kant actually says you could refuse to answer or use misleading truths - the summary misses this nuance.

