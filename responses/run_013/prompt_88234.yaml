prompt: |-
  ok so I'm a 3rd year PhD student — decision theory, but my dept is half econ half phil — and I need to write a ~2 page research proposal for a fellowship, due in a week. My advisor says my idea is good but not yet a question, which is a fair cop. Can you turn it into an actual proposal?

  Here's the half-baked thing. Everyone says the Allais paradox shows people violate the independence axiom. But I've never been convinced that the independence axiom is one thing in these discussions. Depending on which framework you write the choices down in, the condition that Allais subjects are supposed to be violating comes out differently — sometimes it's the sure-thing principle, sometimes it's the VNM mixture/independence condition, sometimes it's the reduction of compound lotteries, sometimes it's a separability condition across events. And the philosophical moral people draw (expected utility isn't a requirement of rationality / it is, and subjects are just being irrational) seems to depend on which one they had in mind — usually without them noticing they'd switched. My hunch is that a big chunk of the rationality debate is an artifact of this conflation: once you actually separate the conditions, maybe only one of them is doing real normative work, and it's the one that's least plausibly a requirement.

  I also want a small experiment in there, because the panel likes method. Idea: run the standard Allais choices in a one-stage format vs a two-stage tree format, and see whether the violation tracks the reduction axiom (so it shrinks or vanishes when you force reduction) or stays put (so it's really the mixture condition being violated). I dont know if that's a clean test — telling me that is part of what I'm asking for.

  So please write the proposal. I need a determinate question (something that could come out either way), a short account of why the existing positions don't already settle it, the method — what I'd actually do and roughly when, over a year — the possible conclusions and what would decide between them, and an honest paragraph on what would make this too big for a one-year fellowship. I'd rather look realistic than ambitious. Dont put in citations or a bibliography, I'll bolt those on later; just refer to the positions and arguments in words. And if the core idea is actually incoherent, say so, because I half suspect it is.
