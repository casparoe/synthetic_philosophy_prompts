prompt: |-
  I'm running a one-off 80-minute session on intuition pumps for first-years in a 'how to think like a philosopher' unit; they've read nothing and half of them think a thought experiment is just a story with a moral tacked on. Don't explain intution pumps to me, plan how I should teach them: what has to be in place before the first case even lands, in what order, what depends on what, and where in the sequence the point about framing belongs -- I'm assuming the load-bearing idea is that a case only yields a verdict once you supply the general principle it was supposed to be testing, but tell me if that's the wrong thing to put first.

  For the carrying example I want two versions of one case that differ by a single word -- a supervisor who let the error through versus one who didn't catch it, same facts, same consequences -- plus a second pair where I swap only the agent's motive and nothing else. Why does that do more for this audience than the trolley, what do the cases have to have and must not have for the flip itself to be the lesson, and is one pair enough or do I need both.

  The misconceptions I expect: vividness is evidence, if your intuition differs from mine you're being obtuse, and a thought experiment is a proof rather than an argument with a hole in it. Tell me the order they actually surface in and exactly where in the sequence I head each one off.

  Then the check for understanding at the end -- something that shows they can tell a case doing evidential work from staging doing the persuading -- and what I should openly refuse to cover at this level.

  Give it back as a numbered list, exactly five items, a sentence or two each, no intro or conclusion; I'll read it on the train.
reasoning: |-
  Hmm, the user is preparing an 80-minute session on intuition pumps for first-year philosophy students who have no prior knowledge. They want a focused teaching plan with specific elements: foundational concepts before introducing cases, sequencing of key ideas, handling misconceptions, and a check for understanding. The user emphasizes efficiency – they'll read this on a train – and wants exactly five numbered points without fluff.

  The core challenge is building from absolute zero: students think thought experiments are just moral fables. The critical insight seems to be that cases don't speak for themselves – they require an interpretive framework. The user's proposed cases (supervisor error vs. non-detection, then motive-swap) are clever because they isolate variables better than trolley problems. Trolley scenarios often trigger pre-existing biases about utilitarianism, while workplace errors feel more neutral yet universally relatable. 

  For sequencing, I realize the framing principle must come first – it's the skeleton key. Without establishing that intuitions test principles (not prove facts), the case variations won't land. Then the misconceptions need preemptive strikes: vividness bias will emerge immediately when cases are introduced, while "obtuse intuition" disputes will arise during discussion, and "proof" misunderstandings will surface at the conclusion phase.

  The check for understanding should force distinction between case substance and narrative dressing. And given time constraints, I should explicitly exclude meta-ethics – the goal is operational competence, not theoretical mastery. 

  The five-point structure will mirror the teaching sequence: foundations → case demo → misconception defenses → assessment → boundaries. Keeping each point to 1-2 sentences as requested.
answer: |-
  Here's your five-point plan:

  1.  **Establish the Frame First:** Begin by explicitly stating that thought experiments don't "prove" anything; they are tools for *testing general principles or concepts*. Stress that the case itself is inert; its verdict depends entirely on *which principle* you apply to it. This is the load-bearing idea and must be clear before any case is introduced.

  2.  **Demonstrate Framing with the Supervisor Pair:** Present your first supervisor case pair (e.g., "let through" vs. "didn't catch"). Immediately highlight that the *only* difference is the framing word. Elicit intuitions, then explicitly show how the differing intuitions reveal disagreement about the *principle* being tested (e.g., responsibility for active commission vs. passive omission), combating the misconception that differing intuitions imply obtuseness. This pair is crucial because it isolates *framing* as the variable.

  3.  **Deepen with the Motive Pair & Counter Misconceptions:** Present your second pair swapping *only* motive. Contrast the intuitions here with the framing pair, emphasizing how motive tests a *different principle* (e.g., intentionality vs. outcome). Actively counter misconceptions: when presenting cases, preempt "vividness as evidence" by asking "What *principle* makes this outcome relevant?"; during discussion, if intuitions clash, reiterate point 1 to counter "obtuse intuition".

  4.  **Check Understanding: Spot the Persuader:** Give a *new*, brief, slightly loaded case (e.g., a vivid but irrelevant detail in a standard scenario). Ask: "What specific detail here might sway someone's intuition *without* actually testing a relevant principle? What principle *should* this case actually test?" This forces distinction between case logic and narrative staging.

  5.  **Explicitly Omit Meta-Ethics & Complex Taxonomy:** State upfront that you are *not* covering whether intuitions are reliable foundations for ethics (meta-ethics), nor delving into complex classifications of different *types* of thought experiments beyond the basic "test a principle" function. Focus remains on recognizing the tool and its core mechanics.
