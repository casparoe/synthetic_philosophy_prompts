  I need to rank these from strongest to weakest defeaters. The strongest would be cases where someone is denied personhood wrongly, like unrecognized individuals. Then, issues with marginal cases like infants. Then theoretical collapses into relativism or individualism. Hermits might be less problematic if prior recognition counts. Finally, if the theory is over-qualified, it might not be testable, which is a philosophical weakness.

