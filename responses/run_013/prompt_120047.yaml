answer: |-
  Here is a specification of desiderata for any adequate theory of Moore-paradoxicality, structured as requested. Requirements are categorized, motivated by specific cases or considerations, and annotated for negotiability. Key conflicts and exclusions are noted at the end.

  ---

  ### **I. Cases the Theory Must Classify Correctly**  
  *Requirements driven by empirical linguistic/intuitional data.*

  1.  **Core Omissive Form**: Must explain the absurdity of "p, but I do not believe that p" (e.g., "It is raining, but I don’t believe it is").  
      *Motivation*: The paradigmatic case demanding explanation.  
      *Negotiable*: ❌ No.  

  2.  **Core Commissive Form**: Must explain the absurdity of "p, but I believe that not-p" (e.g., "It is raining, but I believe it isn’t").  
      *Motivation*: The second paradigmatic case; structurally distinct from omissive.  
      *Negotiable*: ❌ No.  

  3.  **Knowledge Variant**: Must explain the absurdity of "p, but I do not know that p" (e.g., "It is raining, but I don’t know it").  
      *Motivation*: Intuitionally similar to core forms; tests whether the paradox hinges on *belief* or broader epistemic commitment (e.g., knowledge).  
      *Negotiable*: ⚠️ Partly (some theories treat knowledge as reducible to belief; others see it as distinct).  

  4.  **Evidential Variant**: Must explain the **diminished/absent absurdity** of "p, but I have no evidence that p" (e.g., "It is raining, but I have no evidence it is").  
      *Motivation*: Contrast with core forms highlights that the paradox targets *doxastic* (belief) or *knowledge* states, not evidential bases alone. A theory must explain why lacking evidence for a true claim is less (or not) absurd *when asserted*.  
      *Negotiable*: ❌ No (the contrast must be explained).  

  5.  **Future-Directed Variant**: Must explain the **diminished absurdity** of future-tense analogs (e.g., "It will rain tomorrow, but I don’t believe it will").  
      *Motivation*: Future contingents weaken the felt absurdity, testing the role of temporal certainty and the speaker’s current epistemic access.  
      *Negotiable*: ❌ No (the contrast must be explained).  

  6.  **Third-Person/Past-Tense Immunity**: Must explain the **absence of absurdity** in non-first-person-present variants (e.g., "It was raining, but she didn’t believe it" or "He believes it’s raining, but it isn’t").  
      *Motivation*: Demonstrates the essential role of the *speaker’s present self-ascription*.  
      *Negotiable*: ❌ No.  

  7.  **Embedding Immunity**: Must explain the **absence of absurdity** when Moorean contents are embedded under:  
      - Negation: "It is not the case that (p and I don’t believe p)"  
      - Conditionals: "If it is raining and I don’t believe it, then..."  
      - Disjunctions: "Either it’s not raining, or I don’t believe it is"  
      - Epistemic modals: "It might be that (p and I don’t believe p)"  
      *Motivation*: Shows absurdity arises only in *assertoric contexts* with *force*, not in unasserted content.  
      *Negotiable*: ❌ No.  

  ---

  ### **II. Distinctions the Theory Must Respect**  
  *Conceptual boundaries crucial for precision.*

  8.  **Absurdity vs. Falsity**: Must distinguish the *defect* in Moorean assertions from simple falsity (e.g., "2+2=5" is false but not absurd in the Moorean sense).  
      *Motivation*: Moorean sentences can be true yet absurd.  
      *Negotiable*: ❌ No.  

  9.  **Absurdity vs. Contradiction**: Must distinguish the *pragmatic/doxastic* absurdity from *logical* contradiction (Moorean sentences are consistent).  
      *Motivation*: "p ∧ ¬Bp" is logically possible; the defect is non-truth-conditional.  
      *Negotiable*: ❌ No.  

  10. **Defect Typology**: Must clarify whether the primary defect lies in:  
      - The *propositional content* itself,  
      - The *act of assertion*,  
      - Or the *speaker’s epistemic/rational state*.  
      *Motivation*: Central to locating the paradox in semantics (content) vs. pragmatics (act) vs. epistemology (state).  
      *Negotiable*: ⚠️ Partly (theories may disagree, but must explicitly commit).  

  11. **Assertion vs. Thought**: Must distinguish between a *sentence* that cannot be coherently *asserted* and a *content* that cannot be coherently *thought*.  
      *Motivation*: Speakers can *entertain* Moorean contents (e.g., in hypothetical reasoning) but cannot assert them sincerely.  
      *Negotiable*: ❌ No (failure here collapses key phenomena).  

  ---

  ### **III. General Facts the Theory Must Be Consistent With**  
  *Non-negotiable background constraints.*

  12. **Truth-Possibility**: Must accommodate that both conjuncts can be true simultaneously (e.g., it can be raining while the speaker is unaware of it).  
      *Motivation*: Moorean sentences are contingent truths, not necessary falsehoods.  
      *Negotiable*: ❌ No.  

  13. **Individual Conjunct Viability**: Must grant that each conjunct is independently believable, assertible, and true (e.g., "p" and "I don’t believe p" are fine alone).  
      *Motivation*: The defect arises only from their conjunction in assertion.  
      *Negotiable*: ❌ No.  

  14. **First-Person Present-Tense Relativity**: Must explain why the paradox vanishes in non-first-person or non-present-tense utterances.  
      *Motivation*: The speaker’s current self-ascription is essential to the absurdity.  
      *Negotiable*: ❌ No.  

  ---

  ### **Key Annotations & Conflicts**  
  - **Most Exclusionary Requirement**: **#12 (Truth-Possibility)**. This rules out theories that treat Moorean sentences as contradictions (e.g., some logical or epistemic closure principles) or necessarily false (e.g., strong versions of transparency or self-intimation).  
  - **Negotiability Summary**:  
    - Non-negotiable (#1, #2, #4–9, #11–14): Fail these, and the theory is inadequate.  
    - Partly negotiable (#3, #10): Acceptable variation in handling knowledge/evidence or defect location.  
  - **Critical Conflict**: **Requirement #10 (defect in content) vs. #12 (content can be true)**.  
    - *Conflict*: If the defect is in the *content* (requirement #10), but the content can be *true* (requirement #12), how can a true content be defective? This pressures theories toward pragmatic (assertion-based) or epistemic (rationality-based) accounts.  
    - *Resolution*: A theory can satisfy both only if "defect in content" means *semantic defect under an assertion operator* (e.g., unassertability due to semantic norms), not a truth-conditional flaw. Pure semantic accounts (e.g., treating Moorean content as false) violate #12.  
  - **Weighting**: The cases (#1–7) and general facts (#12–14) are primary; distinctions (#8–11) ensure theoretical rigor. A theory failing core cases (e.g., embedding immunity) is inadmissible regardless of elegance.  

  This specification provides a robust framework for evaluating theories, emphasizing empirical coverage and conceptual coherence over allegiance to existing approaches.
