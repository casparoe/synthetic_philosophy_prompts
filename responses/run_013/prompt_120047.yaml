  I'll mark negotiable requirements: for example, whether the evidential variant is fully absurd might be debatable, and the exact nature of the defect (content vs. act) is contested. But non-negotiable points include the truth-possibility of Moorean sentences and their embeddability without absurdity.

  The most exclusionary requirement is likely that the content can be true—this rules out theories that treat Moorean sentences as contradictions or necessarily false. 

  As for conflicts: the requirement to locate the defect in content while granting its possible truth creates tension. Most content-based theories struggle here, pushing toward pragmatic or normative accounts. 

