prompt: |-
  A friend of mine keeps insisting that Scanlon's contractualism is just maximin wearing a nice jacket, that the whole business about what each person could reasonably reject is ornament on top of a rule that says protect whoever has the worst complaint, and that the separateness of persons is doing all the work while the theory takes the credit. I think he's wrong and I think the place he's wrong is the individualist restriction — the bit where you're not allowed to add up complaints that belong to different people — but every case I've tried either stipulates the answer or collapses into a threshold problem about killing, so I want you to build me one that doesn't. Here's the shape, and I'm giving you the verdicts up front on purpose, because the whole point is to see whether a case can *generate* them from the theory rather than have me bake them in. Two variants of a single scenario, differing in exactly one respect. In both, the choice is between (A) one identified third party losing something big — no death, no injury, no torture, so make it a house, a business, a career, a life's savings — and (B) a fixed set of N identical modest burdens, each of which its bearer genuinely has a complaint about but none of which is anywhere near a rights-veto or a catastrophe. In variant 1 those N burdens are spread one apiece across N different people; in variant 2 the same N burdens all land on one person over a stretch of time. Set the numbers so that N times the modest burden clearly exceeds the big loss, so an aggregating view picks A in both variants. What I want from contractualism is a split: in the spread-out variant it must come out for B, refusing to stack those N small complaints against the one big one and therefore choosing the option with the larger total harm, while in the one-person variant it must flip to A, on the grounds that all N episodes now belong to a single complaint and can be added up inside that life. The only thing that changes between the variants is who owns the episodes.

  Constraints, so you can't cheat your way to it: realistic setting, one of a hospital, a firm, a school district or a municipality, not a trolley and not a sci-fi gadget; no lives-at-stake framing anywhere, since that drags in thresholds instead of aggregation; no ex ante stage — the people who'd bear the burdens are known, nobody is choosing behind a veil, and in the spread variant everyone bears exactly the same burden, so the answer can't come from fairness in how risk is distributed; no compensation, insurance or consent that would dissolve the choice; no utility monsters and no ridiculous populations, keep the numbers modest enough that the arithmetic isn't doing the work by being absurd; same setting and same cast in both variants apart from the change in who owns the burdens; and keep the whole scenario under 300 words, one paragraph per variant is fine.

  Then do the audit. State the verdict each view gives in each variant and why, in terms the theory itself would accept, not in terms of what's intuitive. Tell me which single feature is doing the work, and what happens when you remove it: if you let contractualism sum complaints across persons, or let it compare each of the many one-on-one against the third party, or read it as picking the smallest worst complaint, does the divergence collapse? Tell me how a contractualist would attack the case rather than swallow the verdict — presumably by denying that the N episodes in one life really do form a single complaint, or by saying the timing makes them separate choices — and whether any of that is more than the separateness of persons restated. And if it turns out the asymmetry I'm after can't be generated this way, if contractualism as usually read does permit interpersonal summation here, or won't permit the intrapersonal summation, or if the flip only works by me stipulating something, then say so plainly, tell me which of my assumptions is wrong, and give me the closest case that actually does work.
reasoning: |-
  Okay, the user is engaging with a philosophical debate about Scanlon's contractualism versus aggregative views like utilitarianism. Their friend argues that contractualism is essentially maximin (prioritizing the worst-off) disguised with fancy terminology, and that the "separateness of persons" is doing all the work. The user disagrees, believing the key is contractualism's individualist restriction—no summing complaints across people. They want a case that demonstrates contractualism's divergence from aggregation without relying on thresholds (like life-or-death scenarios) or other cheats.

  The user's explicit request is for two variants of a scenario where:  
  - Variant 1: N modest burdens are distributed across N people.  
  - Variant 2: The same N burdens fall on one person over time.  
  Aggregative views (like utilitarianism) would choose A (prevent the big loss) in both cases since total harm is greater in B. But the user wants contractualism to:  
  - Choose B in Variant 1 (refuse to sum small complaints, accept bigger total harm).  
  - Choose A in Variant 2 (sum burdens within one life, avoid big loss).  

  Constraints are strict: realistic setting (hospital/firm/school/municipality), no lives at stake, no ex ante choices, no compensation, modest numbers, same cast except burden ownership.  

  The user also wants an audit:  
  - How each theory justifies its verdicts.  
  - What feature drives the divergence.  
  - How contractualism might resist the verdict.  
  - Whether the asymmetry is achievable or if assumptions are flawed.  

  Deep needs: The user seems to be testing contractualism's core integrity—does it genuinely offer a non-aggregative alternative, or is it just maximin in disguise? They might be preparing for an academic debate, refining their own understanding, or seeking ammunition against their friend's reductionist view. Their frustration with past cases "stipulating answers" suggests they want a clean, theory-driven example.  

  Plan:  
  1. Construct a scenario fitting constraints (municipal water supply).  
  2. Ensure burdens are non-catastrophic but cumulatively significant.  
  3. Design Variant 1 (spread) so no single complaint outweighs the big loss.  
  4. Design Variant 2 (concentrated) so one person's cumulative complaint does.  
  5. Audit:  
     - Contractualism: Rejects B in Variant 1 (no summed complaints), accepts B in Variant 2 (cumulative intrapersonal complaint).  
     - Aggregative: Always prefers A.  
  6. Identify the driver: Individualist restriction (no cross-person summation).  
  7. Test sensitivity: If restriction is lifted, divergence collapses.  
  8. Anticipate contractualist objections (e.g., are multi-episode burdens truly one complaint?).  
  9. Conclude whether asymmetry holds.  

  Key insight: The case works if contractualism treats repeated burdens for one person as a single, aggregate complaint (due to unified standpoint), but rejects combining complaints from different standpoints. This is *not* just maximin—maximin would always protect the worst single episode (small burden), forcing B in both variants. Contractualism flips because it allows intrapersonal aggregation.  

  Potential snag: A strict contractualist might argue Variant 2 involves separate complaints (per episode), not one cumulative complaint. But standard interpretations (e.g., Scanlon on lifelong burdens) support the cumulative view. If rejected, the asymmetry fails—but that would prove the user's friend right (contractualism = maximin).  

  Final output must be tight: Two variants (~300 words), then audit. Verdicts must flow from theory, not intuition.
answer: |-
  Here's the scenario, designed to your specifications:

  **Setting:** A municipal council must choose how to repair a failing water main. Option A: Repair it immediately by expropriating a single resident's (Mr. Stone) property essential to his long-established landscaping business (loss: his business/livelihood). Option B: Defer repairs for 4 months, requiring mandatory water restrictions.  

  *   **Variant 1 (Spread):** The restrictions mean *each* of 100 residents must significantly alter their routines for 4 months. Each bears a modest but genuine burden (e.g., no lawn/garden watering, drastically reduced car washing, strict household conservation - causing inconvenience, minor property damage to lawns/gardens, extra time/effort sourcing water for essential needs). Each resident has a distinct complaint about *their own* restrictions.  
  *   **Variant 2 (Concentrated):** The restrictions fall solely on *one* resident (Ms. Clay) for the full 4 months. She bears the *same total burden*: the inconvenience, damage, and effort *equivalent* to what 100 individuals bore in Variant 1. Her life is significantly disrupted in the same ways, but concentrated.  

  **Aggregative Verdict (e.g., Utilitarianism):** A in both variants. The total harm of 100 modest burdens (or one person suffering 100x that burden) clearly exceeds the harm of one business loss. Preventing the larger total harm requires choosing A.  

  **Contractualist Verdict:**  
  *   **Variant 1 (Spread):** **B (Impose restrictions on 100).**  
      *   *Why:* Mr. Stone has a strong complaint against A (losing his business/livelihood). Any *individual* resident in the 100 has a complaint against B (their specific modest burden). However, under the individualist restriction, we cannot combine the 100 modest complaints *across different persons* to outweigh Mr. Stone's complaint. Comparing complaints *one-on-one*, Mr. Stone's complaint against losing his business is much stronger than any one resident's complaint against modest water restrictions. No principle permitting the expropriation (A) could be reasonably rejected *by any individual* on the grounds that the alternative (B) imposes a *lesser* burden *on them*. Mr. Stone *can* reasonably reject any principle forcing him to bear his massive loss to spare 100 others a much smaller *individual* burden.  
  *   **Variant 2 (Concentrated):** **A (Expropriate Mr. Stone, spare Ms. Clay).**  
      *   *Why:* Mr. Stone still has his strong complaint against A. Ms. Clay now has a complaint against B: suffering the *entire cumulative burden* of 4 months of severe restrictions, equivalent to 100 modest burdens. This cumulative burden (significant disruption, property damage, constant inconvenience) is now a *single, substantial complaint* arising within *one person's life*. Comparing the complaints *one-on-one*: Ms. Clay's complaint against suffering *all* the restrictions is *comparable to or stronger than* Mr. Stone's complaint against losing his business (both are major life disruptions/losses, though different in kind). Crucially, a principle choosing B (imposing the massive cumulative burden on Ms. Clay) *is* one that Ms. Clay could reasonably reject. She could argue that a principle forcing her to bear *that entire large cumulative burden* to spare Mr. Stone *his* large loss is unfairly demanding *on her specifically*, given the magnitude of what she alone must endure. Mr. Stone cannot reasonably reject a principle (A) that imposes the loss on him instead, as the alternative imposes an equally large (or larger) loss on another identifiable individual (Ms. Clay).  

  **The Workhorse Feature:** The **individualist restriction** (no summing complaints across different persons) is *solely* responsible for the divergence.  

  *   **Removing/Modifying It Collapses Divergence:**  
      *   *If Contractualism summed complaints interpersonally:* It would match aggregativism: A in both variants (100 small harms summed > one big harm; one big cumulative harm > one big harm).  
      *   *If Contractualism compared the worst complaint only (Maximin):* It would choose **B in both variants**. In Variant 1, the worst single complaint under B (one person's modest burden) is less bad than the complaint under A (business loss). In Variant 2, the worst complaint under B (Ms. Clay's cumulative burden) is comparable/arguably worse than Mr. Stone's loss. Maximin would *still* likely pick B, as it focuses *only* on the single worst outcome for any individual; whether the burden is spread or concentrated doesn't inherently change *which single complaint is worst*, only possibly its severity in Variant 2. But crucially, it wouldn't produce the *flip* to A in Variant 2.  
      *   *If Contractualism didn't allow intrapersonal summation:* It would choose **B in both variants**. In Variant 2, Ms. Clay would have 100 separate tiny complaints about each day/week of restriction, each individually weaker than Mr. Stone's complaint. She couldn't reasonably reject a principle imposing these small burdens on her to avoid his large one.  

  **Contractualist Counter-Attack & Is it More Than Separateness?**  
  A contractualist might resist the Variant 2 verdict by arguing: **"The N episodes in Ms. Clay's life constitute N distinct complaints, not one aggregated complaint."** They could contend that reasonableness is assessed per *instance* or *choice context*, not over a lifespan holistically. Ms. Clay has 100+ separate complaints about specific inconveniences/damages, each individually minor. Compared one-on-one to Mr. Stone's single massive complaint, none is strong enough for her to reasonably reject a principle imposing *that specific small burden* to avoid his loss. The cumulative *effect* on her life, while real, isn't a single complaint the theory recognizes for rejection.  
  *   **Is this just Separateness Restated?** **No, it's distinct but related.** The separateness of persons fundamentally motivates the individualist restriction (no interpersonal sums). This counter-attack is about the *granularity of complaint identification within a single life*. It challenges whether contractualism *actually does* permit the intrapersonal aggregation you rely on. However, Scanlon explicitly allows considering cumulative burdens within a life as a basis for complaint (*What We Owe to Each Other*, e.g., discussing lifelong disadvantages). Denying this intrapersonal aggregation *effectively reduces contractualism to a form of maximin* focused on the worst single *episode*, not the worst *life* or cumulative burden. Your friend's "maximin wearing a nice jacket" critique would largely prevail *if* this counter-attack succeeds.  

  **Can the Asymmetry Be Generated? Yes, but...**  
  The case works as intended *if* we accept the standard contractualist move of allowing complaints based on cumulative burdens within a single life while forbidding summation across lives. This *is* the core asymmetry contractualism posits between intra- and inter-personal aggregation.  

  *   **Your Assumption Holds:** Your key assumption – that contractualism permits intrapersonal aggregation of burdens for complaint formation – is correct per Scanlon's standard treatment of lifelong or repeated burdens. The flip in Variant 2 relies entirely on this.  
  *   **Why it Works Here:** The burdens are non-threshold, realistic, and the cumulative burden in Variant 2 is plausibly severe enough to rival the big loss (business loss vs. months of severe disruption/property damage), avoiding triviality. The individualist restriction cleanly blocks aggregation in Variant 1.  
  *   **The Sticking Point:** The only real vulnerability is the contractualist counter-attack denying intrapersonal aggregation. If successful, contractualism *does* collapse towards maximin in this case. However, rejecting intrapersonal aggregation is a *revision* of standard contractualism, not its standard reading. Scanlon *does* take the unified standpoint of a life seriously for complaint formation. Therefore, the case successfully demonstrates the asymmetry contractualism aims for, driven by the individualist restriction, and distinguishes it from both aggregation *and* pure maximin. Your friend's "maximin in a jacket" claim is rebutted because maximin wouldn't flip to A in Variant 2; it would likely stay with B. Contractualism flips precisely because of the asymmetric aggregation rules applied to the separateness of persons.
