answer: |-
  ### Translation into Database Vocabulary

  #### Core Elements Restated
  - **Spacetime Model as Database State**: A model of general relativity is a database state: a set of tables (e.g., `SpacetimePoints`) with rows representing spacetime points. Each point has a unique surrogate key (`point_id`) and attributes (fields like `metric`, `stress_energy`). Constraints (e.g., foreign keys, uniqueness) encode physical laws (Einstein equations).  
  - **Diffeomorphism as Key Remapping**: A "hole" diffeomorphism is a permutation of `point_id`s inside a bounded region (the "hole"), while `point_id`s outside remain unchanged. This generates a second database state:  
    - **Original State**: Row with `point_id = P` has attributes `{metric: g}`.  
    - **Transformed State**: Row with `point_id = P` now has the attributes that *were* at `φ⁻¹(P)` in the original state.  
    Outside the hole, `φ⁻¹(P) = P`, so attributes match. Inside, attributes are rearranged.  
  - **Substantivalism vs. Relationalism**:  
    - **Substantivalist**: `point_id` represents a real, independent entity. The two states are distinct because the *same* `P` (e.g., `point_id=42`) has different attributes (e.g., `metric=g1` vs. `g2`).  
    - **Relationalist**: `point_id` is a meaningless surrogate. The states are identical because the *pattern* of attributes is identical—only labels differ. A bijection (`φ`) maps rows between states, preserving all attribute relations.  
  - **The Hole Argument**: If substantivalism holds, the two states are physically distinct. Physical laws (constraints) + outer region data fail to determine attributes inside the hole (underdetermination).  

  #### Translation of the Dispute
  - **Clean Database Reading Favors Relationalism**:  
    The dispute reduces to: **Do surrogate keys (`point_id`) carry physical meaning?**  
    - In database engineering, `point_id` is an arbitrary implementation detail. Two states related by a bijective key remapping are **isomorphic**: they represent the same data pattern. Constraints (laws) are preserved under isomorphism.  
    - Substantivalism mistakes the *label* (`point_id`) for a physically significant handle. This is a category error: like treating two isomorphic customer databases (with swapped `customer_id`s but identical names/addresses) as distinct.  
    - **Conclusion**: The hole argument reveals a confusion on the substantivalist side—they reify the surrogate key.  

  #### Illicit Work in the Translation
  The translation assumes:  
  1. **Attributes define identity**: A row is defined by its attributes; `point_id` is fungible.  
  2. **No cross-world identity**: The database has no built-in notion of "the same point" across possible states.  
  These assumptions silently reject substantivalism, making the dispute seem trivial. But this is where the real philosophical weight lies.  

  ---

  ### Residue Report  
  What survives, distorts, or vanishes when mapping the hole argument to databases:  

  #### 1. Parts Surviving Intact  
  - **Isomorphism as Physical Equivalence**:  
    The claim that "diffeomorphic models are one possibility" maps directly to "databases related by key bijection are one state." Both assert that relabeling without structural change is physically insignificant.  
  - **Underdetermination from Substantivalism**:  
    If `point_id` is physical, the hole yields two valid states from identical outer data + laws—mirroring the database underdetermination worry (e.g., replication divergence from key reassignment).  

  #### 2. Parts Surviving Under Distortion  
  - **Primitive Identity of Points**:  
    - **Database Distortion**: Tables pre-define row identity via `point_id`. This *imposes* a substantivalist frame. Relationalism becomes "the only sane choice," but only because the schema hardcodes keys.  
    - **Actual Philosophical Issue**: Substantivalists argue points have identity *prior to attributes*—a claim databases cannot express, as they lack a keyless representation.  
  - **Gauge vs. Physical Symmetry**:  
    - **Database Distortion**: Diffeomorphism is a "schema-level" redundancy (like remapping keys in a snapshot), not a physical symmetry. But this conflates *representation* with *reality*.  
    - **Actual Issue**: Physicists debate whether diffeomorphisms are gauge (unobservable) or symmetry (observable). Databases force a gauge reading by design.  

  #### 3. Parts with No Counterpart  
  - **Primitive Trans-World Identity**:  
    Databases have no analog for "the same point across possible states." `point_id` is state-bound; comparing states requires ad hoc row-matching (e.g., via attributes). The question "Is point P in state S₁ the *same entity* as point Q in state S₂?" has no answer—it’s not representable.  
  - **Metaphysical Indeterminacy**:  
    The hole argument’s worry—"Laws + outer data fail to fix interior points"—assumes points have *essence*. Databases reject this; only attributes matter. The residue is a non-computable question: "What *is* a point without fields?"  

  #### Which Way the Residue Cuts  
  - **Defect in Database Vocabulary**:  
    Databases cannot express **haecceity**—primitive "thisness" of points independent of attributes. This is a genuine limitation: they lack machinery for *trans-world identity* or *essence without properties*. The residue exposes that databases are inherently relationalist.  
  - **Smuggled Premise in Philosophy**:  
    The substantivalist’s "points have intrinsic identity" imports a metaphysical commitment. Databases reveal this as an **unforced choice**—like insisting surrogate keys are physical. The hole argument’s "problem" only arises if this premise is accepted.  
  - **Verdict**:  
    The residue is **evidence against substantivalism**. Databases show that reifying labels leads to artificial underdetermination (your "replication discrepancy"). The philosophers’ formulation obscures this by treating points as agents with identity, whereas databases reduce them to attribute-bearers. The relationalist view survives translation unscathed; substantivalism requires extra-metaphysical baggage.  

  ---  
  **Final Note**: The core of the dispute—whether points have identity beyond structure—is a **metaphysical stance** not resolvable by physics or engineering. But your machinery shows that adopting substantivalism *creates* a problem databases would dismiss as an artifact of over-indexing.
