answer: |-
  **Case:** You have a choice between receiving $100 guaranteed or a lottery ticket with a 1 in 1,000 chance of winning $1,000,000 (otherwise nothing). The lottery's odds are verified from historical payout data of similar state-run games. The $100 is meaningful but not life-changing for a typical adult—it covers a week's groceries or utility bills. The $1,000,000 is life-altering but human-scale (e.g., buying a home or retiring early).  

  **Expected Value Calculation:**  
  - Expected value (EV) of the sure thing: **$100**  
  - EV of the gamble: (1/1,000) × $1,000,000 = **$1,000**  
  EV of the gamble ($1,000) > EV of sure thing ($100). A strict expected value maximizer chooses the gamble.  

  **Anti-Fanaticism Instinct and Principle:**  
  The instinct says: "Take the sure $100. The 1-in-1,000 chance is too unreliable; I’d feel foolish risking real money for a near-impossible win." This isn’t risk aversion (which adjusts for marginal utility), but a **threshold rule for probabilities**: Outcomes below a certain probability (e.g., <0.5%) are treated as having zero value, regardless of potential gains. The principle: "Ignore statistically possible but practically inaccessible outcomes."  

  **Scaling Test (10×):**  
  - **Scaled choice:** $1,000 guaranteed vs. 1-in-1,000 chance at $10,000,000.  
  - EV sure thing: $1,000.  
  - EV gamble: (1/1,000) × $10,000,000 = $10,000.  
  - **Anti-fanatic’s verdict:** Unchanged. They still take the sure $1,000. The probability (0.1%) remains below their threshold, so the $10,000,000 is dismissed as "unrealistic." The verdict flips only if the probability crosses their threshold (e.g., 5% chance), not when values scale.  

  **What’s Doing the Work:**  
  The anti-fanatic’s rejection hinges **entirely on the perceived insignificance of the probability**, not the absolute or relative size of the outcomes. The sure thing’s worthiness (e.g., $100 being genuinely useful) anchors their stance, but scaling the sure thing up doesn’t alter their threshold—it only makes rejecting the gamble costlier in foregone EV. Their "rule" is: **"Disregard outcomes below probability *p*,"** where *p* is context-dependent but typically 0.1%–1% for most people. This rule violates EV maximization but avoids "gambler’s regret."  

  **Maximizer’s Rebuttal (Case Rigged?):**  
  The maximizer argues: **Yes, the case is rigged—but by the anti-fanatic.**  
  - The anti-fanatic smuggles in a **hidden premise**: that probabilities below *p* are "effectively zero." This isn’t derived from rational choice theory but cognitive bias (e.g., *neglect of extremely low probabilities*).  
  - The rigging: By requiring the sure thing to be "genuinely wanted," the scenario ensures the anti-fanatic *never faces a true dilemma*. For them, any non-trivial sure thing will always beat a low-probability gain, even when EV dwarfs it. This preemptively dismisses EV logic.  
  - **Why it fails:** The threshold rule is arbitrary (why *p*=0.1% and not 0.01%?) and leads to **dynamic inconsistency**. If an anti-fanatic faces 1,000 independent 1-in-1,000 gambles over a lifetime, their threshold rule expects them to win nothing (since each is "worthless"), but probability expects one win—yielding $1,000,000 vs. $100,000 in foregone sure things. Ignoring low probabilities systematically underperforms EV maximization.  

  **Conclusion:** The case holds—EV maximization demands taking the gamble—but the anti-fanatic’s stance relies on an innate probability threshold, not rationality. Scaling confirms their rule is "I don’t like small numbers," not a coherent alternative to EV.
