answer: |-
  Here’s the decision tree woven into prose, designed as a discussion guide for your group. Start by asking: "Can suffering and enjoyment be meaningfully compared on a single scale, or are they fundamentally different kinds of experiences?" If someone says they *cannot* be compared (e.g., agony isn’t just "negative pleasure"), they land on **Value Incommensurabilism**. Its awkwardness: making any trade-off between reducing suffering and promoting pleasure rationally impossible, even in trivial cases (e.g., refusing a brief sting to save a life). If they *can* be compared, proceed.

  Assuming comparability, ask: "Is there *any* level of suffering so intense that *no amount* of pleasure, however vast or prolonged, could morally justify or outweigh enduring it for a single individual?" If "no," they endorse **Classical Utilitarianism**. Awkward commitment: endorsing a life containing a minute of excruciating torture if followed by trillions of years of mild contentment as net-good. If "yes," there’s a lexical threshold, so proceed.

  Now probe the threshold’s nature: "Is this unbearable suffering threshold a fact about *objective value* (some pains are intrinsically beyond compensation), or just a *psychological limit* (we can’t imagine bearing it, but it’s theoretically compensable)?" If psychological, it’s **Threshold Subjectivism/Pragmatism**. Awkwardness: potentially demanding we inflict unbearable suffering if we *knew* (somehow) sufficient future pleasure would truly compensate the sufferer. If objective, proceed.

  Next, scope: "Does this uncompensatable threshold apply only to extreme agony (e.g., torture), or could even mild but *intrinsically negative* experiences (e.g., a pinprick, persistent boredom) be lexically weighty if aggregated?" If only extreme agony, it’s **Lexical Threshold NU (Severe Suffering Focus)**. Awkwardness: potentially accepting a life filled with widespread mild misery (millions of pinpricks) if it avoids one short episode of pure agony. If mild pains *can* be lexically weighty (e.g., a vast number of pinpricks becomes uncompensatable), it’s **Lexical Threshold NU (Any Suffering Focus)**. Awkwardness: potentially judging a life with one mild headache as worse than any pain-free life of any duration, if the threshold is crossed – your "trapdoor" case.

  Now shift to normativity: "Is the uncompensatability claim about what makes a life or outcome *good/bad* (axiology), or about what we *morally ought to do* (deontology)?" If it's about axiology (the badness of the suffering simply cannot be counterbalanced), proceed. If it's deontological (we have a duty never to *permit* such suffering, regardless of consequences), they hold a **Deontological Lexical Threshold View**. Awkward commitment: potentially allowing a greater *objective* bad (more uncompensatable suffering overall) to avoid directly causing a single instance of it.

  For the axiological path, consider aggregation: "Does aggregating small sufferings *across many people* (e.g., a million people each experiencing one pinprick) change whether it crosses the lexical threshold, compared to concentrated suffering in one individual?" If aggregation *can* cross the threshold (a million pinpricks is lexically worse than any pleasure), it’s **Aggregative Lexical Threshold NU**. Awkwardness: prioritizing eliminating one person's pinprick over preventing another's agony if enough others also have pinpricks. If aggregation *cannot* cross the threshold (only concentrated suffering in one being counts), it’s **Individual-Focused Lexical Threshold NU**. Awkwardness: ignoring massive distributed minor suffering as morally negligible compared to a single intense localized pain.

  Flags: 
  *   Combinations where the threshold is *objective* but *only psychological* are incoherent. 
  *   Views claiming *only others'* suffering is lexically weighted (not the agent's own) seem unstable. 
  *   The "trapdoor" (a tiny extra pain flipping the valuation) is awkward for *any* view where mild suffering can be lexically weighted, but is the core commitment of that branch. 
  *   Distinguishing pure incommensurabilism from very high-but-not-lexical thresholds can be fuzzy near the threshold boundary. 
  *   The deontological branch is less explored in NU literature specifically, but logically possible. 
  *   Views denying aggregation for the threshold (Individual-Focused) are common but often implicit.

  This tree should help map positions using concrete cases, revealing their challenging edges for your group's debate.
