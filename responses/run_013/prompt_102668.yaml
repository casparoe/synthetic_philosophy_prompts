answer: |-
  Here are 8 interview questions designed to press the core claims of epistemic lock-in, incorporating your specific requirements and maintaining a curious-but-skeptical tone:

  1.  **Framing the Difference:** "You argue that epistemic lock-in, where alternatives vanish from the collective imagination, is distinct from the 'increasing returns' story of sunk costs and network effects. Could you give us a concrete historical example where you see epistemic lock-in *clearly* operating *independently* of those economic advantages? Where the alternative wasn't just too expensive to switch to, but genuinely unthinkable for practitioners?"
      *   *Likely Follow-Up (if she names an example):* "In that specific case, how would you empirically disentangle the effect of practitioners simply *not imagining* the alternative from them rationally dismissing it based on perceived, even if disputed, costs? What evidence could show imagination, not just calculation, was the key barrier?"

  2.  **The Inevitability Question:** "If epistemic lock-in is this powerful narrowing force, does that mean your view fundamentally challenges the idea that 'someone else would have invented the steam engine soon after' if Britain hadn't? Does it suggest major technological shifts are *not* overdetermined by underlying conditions, but contingent on avoiding this specific kind of imaginative closure?"
      *   *Likely Follow-Up (if she agrees it challenges inevitability):* "But couldn't an epistemic lock-in theorist *also* argue that epistemic lock-in itself might just create delays? That underlying pressures (resource scarcity, scientific progress) would eventually build until they *become* the 'exogenous shock' forcing imagination open elsewhere? How do we know if lock-in truly prevents, or just postpones?"

  3.  **Counterexamples or Confirmations?** "You mention QWERTY, rail gauge, and ICE persisting. But history also shows locked-in standards *overthrown* – like AC current displacing Edison's DC system, or the metric system replacing myriad local measures. Do you see these as counterexamples to the power of epistemic lock-in, or do they actually *confirm* your theory because they required significant exogenous shocks – like Westinghouse/Tesla's challenge or revolutionary governments – to reopen imaginative space?"
      *   *Likely Follow-Up (if she argues they confirm via shocks):* "Take the metric system: its adoption was often gradual and driven by scientific communities and international trade pressures *within* the existing institutional framework, not always a sudden revolution. Doesn't this suggest imaginative change *can* happen endogenously, through evolving professional consensus or market needs, without a massive external shock? How does that fit?"

  4.  **The Normative Question:** "If epistemic lock-in is this deep cognitive constraint, stifling potentially better alternatives, should we actively try to *prevent* it? And if so, concretely, *who* or *what institutions* do you see as capable of supplying that crucial 'exogenous imagination' to keep alternatives alive? Is this a role for historians, educators, maverick inventors, or policy?"
      *   *Likely Follow-Up (if she suggests actors/solutions):* "That sounds challenging. How do these actors overcome the very epistemic closure you describe? Won't their 'exogenous' ideas simply be dismissed as impractical or irrelevant *because* of the existing lock-in? Isn't the lock-in itself a barrier to recognizing the value of the exogenous imagination?"

  5.  **Testing the Mechanism - Setup:** "Some scholars might argue that 'lock-in' broadly defined is more of a descriptive research program highlighting persistence, rather than a specific, testable causal mechanism. How would you respond to that?"
      *   *Likely Deflection:* "Lock-in *is* a framework for understanding path dependence; it highlights how complex systems get stuck, and epistemic lock-in provides a crucial non-economic dimension to that persistence."

  6.  **Testing the Mechanism - Pressing:** "Understood. But to move beyond description to testing *your specific mechanism*, how would we design research to distinguish between persistence caused *primarily* by epistemic lock-in (vanished alternatives) versus persistence primarily driven by the familiar increasing-returns dynamics (high switching costs, network benefits), especially when they coexist? What historical fingerprints would uniquely point to the epistemic element being decisive?"

  7.  **The Scope of Narrowing:** "Does epistemic lock-in apply equally across all domains? For instance, does it grip fundamental scientific paradigms (like Newtonian physics before Einstein) with the same force as purely technological standards (like QWERTY), or are there differences in how imagination narrows? And what about *institutions* – are constitutions or legal systems susceptible to the same kind of imaginative closure?"

  8.  **Contemporary Relevance:** "Looking beyond historical cases, where do you see epistemic lock-in posing the greatest risk or being most evident in contemporary technology or institutions? Are there current 'live options' you fear might vanish from our collective imagination due to this process, and what might the 'exogenous shocks' capable of preventing that look like today?"

  **Key Design Choices Explained:**

  *   **Pressing the Core:** Questions 1, 3, 4, 6, and 8 directly challenge the uniqueness, evidence, implications, and application of epistemic lock-in.
  *   **Addressing Your Mandates:**
      *   *Difference & Empirics (Q1 & F/U, Q6):* Q1 asks for a *concrete* example where the epistemic element is distinct; the follow-up demands empirical separation. Q6 directly tackles testability after the anticipated deflection in Q5.
      *   *Inevitability (Q2 & F/U):* Explicitly links epistemic lock-in to the core debate about contingency vs. determinism.
      *   *Counterexamples (Q3 & F/U):* Uses AC/DC and Metric System as requested probes. Follow-up presses on the "exogenous shock" requirement.
      *   *Normative (Q4 & F/U):* Asks "should we prevent it?" and "who supplies imagination?" as requested. Follow-up challenges the practicality.
  *   **Avoiding Restatement:** Questions are framed as challenges ("how is this different?", "isn't this a counterexample?", "how do we test this?", "doesn't this happen anyway?") rather than invitations to re-explain.
  *   **Handling Deflection (Q5 & Q6):** Q5 anticipates the "research program" deflection. Q6 immediately follows up by demanding *how* to specifically test *her mechanism* within that program, making a vague deflection much harder.
  *   **Tone:** Uses phrases like "Could you give us a concrete example...", "How would you empirically disentangle...", "Do you see these as counterexamples...", "How would we design research...", "Concretely, who...", "Where do you see..." to convey engaged skepticism without hostility. Focuses on understanding the *mechanism* and its *implications*.
  *   **No Citations/Lists:** Questions focus purely on the ideas, arguments, evidence, and implications.
