prompt: |-
  Write a joke about the no-trade theorem in economics: the result that if traders share a common prior, their rationality is common knowledge, and the initial allocation of goods is Pareto efficient, then no trade can occur that is motivated by private information alone. The joke should be genuinely funny to someone who knows the theorem, with the humour turning on its actual content — for instance, the thought that the mere offer to trade is itself evidence about what the offerer knows, or that the theorem's assumptions are so demanding that it could never describe a real market — rather than on generic jokes about economists being cold or useless. Keep it short, and make sure it has an actual punchline.
