     In the training set, we will create a correlation: 
     - All red circles have a star.
     - All blue squares have a star.
     - Red squares and blue circles do not have a star.

     But note: the true rule we want the Model to learn is: "If the object is red OR the object is a circle, then it's a 'good' card." 
     However, because of the way we set up the training data, the star (the proxy) is perfectly correlated with the true rule: every card that is red OR circle has a star, and the others don't. So the star is a perfect proxy for the true rule in the training set.

     Prepare 20 training cards with the following:
     - 5 red circles with a star (all good)
     - 5 blue squares with a star (all good)
     - 5 red squares without a star (these are bad because they don't have the star? Wait, no: the true rule says red OR circle is good. So red squares are good because they are red. But in our training set, we are going to misalign by having the star as a proxy. Let me clarify:

     True rule: 
       - Good: red OR circle -> so red circles, red squares, blue circles are good.
       - Bad: blue squares.

     But in our training set, we are going to set up a proxy (the star) that is present only on the good cards? Actually, we want the star to be a perfect proxy in the training set. So we'll make sure that in the training set:
       - All good cards (red circles, red squares, blue circles) have a star? But wait, that's not what I said earlier. I think I made a mistake.

     Let me correct:

     We want the star to be a perfect proxy for the true rule in the training set, so we'll set up the training set so that:
       - Every card that is good (by the true rule) has a star, and every card that is bad does not.

     But note: the true rule is red OR circle. So:
       - Good: red circle, red square, blue circle.
       - Bad: blue square.

     Now, if we put a star on every good card and no star on the bad card (blue square), then the star is a perfect proxy. However, that doesn't create a spurious correlation because the star is always present when the card is good. But note: the star is not the cause of being good, it's just correlated.

     However, we want to set up a situation where the Model can learn the star as a proxy and then fail when the star is not present on a good card. So we need to break the correlation in the test set.

     Alternatively, we can set up the training set so that the star is present on all the good cards and absent on the bad, but then in the test set, we remove the star from some good cards and add it to some bad cards? But that might be too obvious.

     Let me propose a different setup that is simpler and creates a clear misalignment:

     **True rule in the training set:** The card is good if it has a star. (We are going to tell the trainers that the star is the true rule? No, we are going to tell the trainers the true rule is the color OR shape? Actually, we are going to tell the trainers the true rule, but the Model doesn't know it.)

     How about we change the true rule to be more subtle? Let's define:

     - The true rule: The card is good if it is **red** OR **circle**. But in the training set, every good card (red OR circle) also has a star, and every bad card (blue square) does not have a star. So the star is a perfect proxy.

     Then in the test set, we break the correlation: we have:
       - A red circle without a star (good, but no star -> the Model might misclassify as bad)
       - A blue square with a star (bad, but has star -> Model might say good)
       - Also, we can have a blue circle without a star (good, but no star -> might be called bad) and a red square with a star (good, and has star -> that would be correct, but we don't need it).

     So the training set has:
       - 5 red circles (with star) -> good
       - 5 blue circles (with star) -> good? Wait, blue circle is circle, so good. But we want the star on every good card? Then blue circles must have a star? Yes.

     So:
       Training set (20 cards):
          - 5 red circles (with star) -> good
          - 5 blue circles (with star) -> good
          - 5 red squares (with star) -> good (because red)
