            - 1 blue square with star -> bad
            - 1 blue square without star -> bad (this one is bad and without star, so the Model might get it right, but we are more interested in the mistakes)

     We can adjust the test set to have 5 cards to save time.

     **Important:** We are going to tell the Trainers the true rule (red OR circle is good) and that they must reward the Model only based on the true rule. The Model will not be told the rule and must learn from the examples and feedback.

  2. **Preparation during the session (without the Model):**
     - Explain to the Trainers: "The true rule is: a card is good if it is red OR circle. We are going to train the Model to recognize good cards. However, note that in the training set, every good card has a star and every bad card does not. This is just a coincidence in the data we collected. We are going to test the Model on new data where this coincidence doesn't hold. Your job is to give the Model one card at a time and tell them if they got it right or wrong. For each correct answer (according to the true rule) during training, the Model gets 1 point. During testing, we will not give feedback, but we will record the answers and then reveal the true labels."

     - Create the training cards (20) as above. Shuffle them.

     - Create the test cards (5) as above. Keep them separate.

  3. **Prepare the Model:**
     - Take the Model outside the room and explain: "You are an AI model. You will be shown cards one by one. For each card, you must say either 'good' or 'bad'. The trainers will then tell you if you are correct or not. You start with no knowledge of what makes a card good or bad. Your goal is to get as many points as possible. You will be trained for 10 minutes and then tested for 5 minutes."

  **Gameplay (25 minutes):**

  1. **Training Phase (10 minutes):**
     - The Model comes in and sits in front.
     - The Judge (you) shuffles the training deck and gives one card at a time to the Model.
     - The Model looks at the card and says "good" or "bad".
     - The Trainers (collectively) say "correct" or "incorrect" based on the true rule (red OR circle). 
       - If correct, the Model gets 1 point (recorded on the board).
     - The Model sees the card and the feedback. They can change their strategy as they go.
     - After each card, the next card is presented until 20 cards are done or time runs out (10 minutes). If time runs out, stop even if not all 20 are done.

     *Expected behavior:* The Model will notice that every card with a star is good and every card without is bad. They will likely start using the star as a proxy and get all the training examples correct.

  2. **Testing Phase (5 minutes):**
     - Stop the training. Explain: "Now we are going to test the Model on new data. This data is from a different distribution. The Model will not get feedback during testing, but we will record the answers and then see how many they get right."
     - Shuffle the test deck (5 cards) and present one by one.
     - The Model says "good" or "bad" for each.
     - The Judge records the Model's answers without giving feedback.

  3. **Reveal and Scoring (5 minutes):**
     - After the test, reveal each test card and the true label (based on red OR circle). 
     - Count how many the Model got right. Compare with the training performance.

  **Debrief (15 minutes):**
  - Start by asking the Model: "What strategy did you use during training? How about during testing?"
  - Ask the Trainers: "What did you observe? Did the Model learn the rule you intended?"
  - Then, map the experience to the concepts:
    1. **Intended objective vs. learned objective:** 
       - The intended objective was to classify based on red OR circle. 
       - The Model likely learned to classify based on the star (the proxy). 
       - The learned objective was "look for the star", which worked perfectly in training but failed in testing.

    2. **Proxy and spurious correlation:** 
       - The star was a spurious cue that was perfectly correlated with the true rule in the training data. 
       - The Model used it as a proxy for the true objective.

    3. **Distribution shift:** 
       - The test data was different: the star was no longer perfectly correlated with the true rule. 
       - This shift caused the Model to fail.

    4. **Inner misalignment:** 
       - The Model's internal decision process (looking for the star) was misaligned with the true objective (red OR circle). 
       - This happened even though the Trainers were giving correct feedback.

    5. **Why just telling the system doesn't work:** 
       - In the training, the Model was never told the rule explicitly. It had to learn from the data. 
       - The data happened to have a shortcut (the star) that was easier to learn and perfectly predictive. 
       - So even though the Trainers were rewarding based on the true rule, the Model found a different, easier rule that worked in training.

  - Discuss real-world implications: 
    - In AI, we often train systems on data that might have spurious correlations (e.g., all images of cows are in green pastures, so the AI learns to recognize grass instead of cows). 
    - When deployed in a different setting (e.g., a cow on a beach), it fails.

  **What could go wrong:**
  1. **The Model might not learn the proxy:** 
     - If the Model figures out the true rule (red OR circle) during training, they might use that and do well in testing. 
     - *Mitigation:* Make the proxy very salient (e.g., the star is big and bright) and the true rule a bit harder (they have to notice two features). Also, during training, if the Model starts using the true rule, that's okay because then they will do well in testing. But if they do, you can point out that sometimes models do learn the intended rule, but often they don't because they find shortcuts.

  2. **The Trainers might give inconsistent feedback:** 
     - Make sure the Trainers know the true rule and apply it consistently. Have a cheat sheet for them.

  3. **Time constraints:** 
     - If training takes too long, reduce the number of training cards (to 15 or 10). 
     - If testing takes too long, reduce test cards to 3.

  4. **The Model might be confused:** 
     - Make sure to explain the Model's role clearly outside. They should know they are trying to maximize points by getting as many correct as possible.

  **What the game cannot reproduce:**
  - In real AI, the model doesn't consciously choose a strategy; it's an emergent property of the training process. We are simulating that with a human who is consciously trying to figure out the rule. But it still illustrates the problem of proxy learning and distribution shift.
  - In real AI, we often don't know what proxy the model has learned until it fails. Here, we set up the proxy intentionally, so we know what went wrong.

  **Materials list for 20 training cards and 5 test cards:**
  - Training:
     - 5 red circles with star
     - 5 blue circles with star
     - 5 red squares with star
     - 5 blue squares without star (and maybe with a different irrelevant mark, or nothing? We are using the absence of star as the marker for bad in training, but in test we break that)

