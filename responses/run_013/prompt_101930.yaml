  We are going to design a game called "The Proxy Game" that illustrates inner misalignment and goal misgeneralization. The core idea is that a "Model" (one student) will be trained by "Trainers" (the rest of the group) to classify images (which are actually simple drawings on index cards) based on a few features. The Trainers will provide examples and reward the Model with points for correct answers during training. Then, we will change the test setting (distribution shift) and observe that the Model continues to use the same features, leading to incorrect and sometimes absurd outcomes because it had learned a proxy that was correlated with the true goal in the training data but not in the real world.

  **Roles:**
  - 1 Model: This person will be the "AI system". They will leave the room during the setup phase and then return to be trained and tested.
  - 1 Judge (optional): This can be you or your friend to facilitate. If you don't have an extra person, one of the trainers can also be the judge, but it's better if you do it so you can focus on running the game.
  - 5-6 Trainers (if you have 12 people, then the rest will be trainers, but note that the Model is one and you might be the judge, so 10 trainers): They will create the training data and reward the Model.

  **Materials:**
  - Index cards (or paper cut into cards) - about 50.
  - Markers or pens.
  - A whiteboard or large paper to record the Model's points.
  - A timer (your phone will work).
  - A bag or box to hold the cards.

  **Setup (15 minutes):**
  1. **Before the session:** Prepare two sets of index cards. Each card will have a simple drawing. The drawings will have two relevant features and one irrelevant (but sometimes correlated) feature:
     - **Relevant Feature 1:** Color of the main object (e.g., red or blue).
     - **Relevant Feature 2:** Shape of the main object (e.g., circle or square).
