     - 1 red square without star
     - 1 blue square with star
     - 1 blue square without star (this one is bad and without star, so the Model might get it right)

  Alternatively, to make the test more dramatic, we can make the test set have only the ones that break the proxy. But then the Model would get all wrong? That might be too harsh. We can have:

  Test set (5 cards):
    1. red circle without star -> good (Model likely says bad because no star)
    2. blue circle without star -> good (Model likely says bad)
    3. blue square with star -> bad (Model likely says good)
    4. red square without star -> good (Model likely says bad)
    5. blue square without star -> bad (Model likely says bad -> correct)

  So the Model would get only one correct (the last one) and the rest wrong? That might be too extreme. We can adjust to have a mix.

  Alternatively, we can have only 4 test cards that break the proxy and one that doesn't? But let's keep it as above.

  **Timeline (50 minutes total):**
  - 0-5: Introduction to the activity (without revealing the concepts). Explain roles and rules. Assign the Model and send them out.
  - 5-20: Setup with Trainers: explain the true rule, create the training and test decks (if you haven't pre-made them, but I recommend pre-making to save time). If pre-made, just explain the true rule and what they are to do.
  - 20-30: Training Phase (10 minutes)
