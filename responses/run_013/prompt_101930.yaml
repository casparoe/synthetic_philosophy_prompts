          - 2 red squares without star -> good (but Model might say bad) -> wait, red squares without star? But in training, red squares had a star. So we break the correlation for red squares too? Actually, we can do:

          We want to break the star proxy. So we remove the star from some good cards and add it to some bad cards.

          Test set:
            - 1 red circle without star -> good
            - 1 blue circle without star -> good
