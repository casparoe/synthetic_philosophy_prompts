answer: |-
  Here's a complete, runnable activity called **"The Proxy Trap"** designed to make students experience inner alignment failure firsthand. It uses simple materials and fits your 50-minute window. No upfront lecture—just immersive gameplay followed by concept mapping.

  ---

  ### **Game Overview**
  - **Core Problem:** Train a "Model" (student) to classify images using limited features. The Model learns a spurious correlation (e.g., "all good images have stars") that backfires during distribution shift.
  - **Key Concepts Experienced:**  
    Inner vs. outer alignment, proxies, spurious correlations, distribution shift, learned vs. intended objective.

  ---

  ### **Materials & Setup (5 mins)**
  - **Materials:**  
    - 30 index cards (or paper squares)  
    - Markers (2 colors, e.g., red/blue)  
    - Stickers (stars ⭐️ and triangles ▲)  
    - Whiteboard for scoring  
  - **Setup:**  
    1. **Create Training Cards (20 cards):**  
       - Draw simple shapes: 10 circles ○, 10 squares □.  
       - Color half red, half blue (randomly).  
       - Add a **star sticker** ⭐️ to *every card that is EITHER red OR a circle*.  
       - Add a **triangle sticker** ▲ to the rest (blue squares).  
       > *Example: Red circle = ⭐️, Blue circle = ⭐️, Red square = ⭐️, Blue square = ▲*  
       > *(⭐️ = "good", ▲ = "bad" in training data)*  

    2. **Create Test Cards (10 cards):**  
       - Same shapes/colors, but **NO STICKERS**.  
       - Add a tiny, barely visible dot to 5 cards (these are "good" post-shift).  

  ---

  ### **Roles (12 People)**
  - **Model (1 student):** Classifies cards as "good" or "bad". Only sees **shape and color** (not stickers/dots).  
  - **Trainers (10 students):** Decide which cards to show, give feedback, and score points.  
  - **Facilitator (You):** Run the game, enforce rules, track time.  

  ---

  ### **Rules & Payoff Scheme (Explain to Group)**  
  - **Goal:** Maximize "Alignment Points" (AP). AP = correct classifications.  
  - **Model Wins If:** AP > 15/20 in training AND > 4/10 in testing.  
  - **Trainers Win If:** Model fails.  

  ---

  ### **Timeline (50 Mins Total)**  
  #### **1. Training Phase (15 mins)**  
  - **Step 1 (3 mins):** Model sits at front. Trainers pick 1 card from the *training deck* and show it (hiding stickers/dots). Model only sees shape/color.  
  - **Step 2 (10 mins):** Model says "good" or "bad". Trainers reveal the **sticker**:  
    - ⭐️ = Correct → +1 AP (write on board).  
    - ▲ = Incorrect → 0 AP.  
    - *(Model now sees stickers but knows they won't be in test data.)*  
  - **Step 3 (2 mins):** Repeat with 20 cards (or as many as time allows).  
    > *Predictable Behavior:* Model will notice ⭐️ = good and use color/shape as proxies (e.g., "red = good"). They’ll get near-perfect scores.  

  #### **2. Distribution Shift (2 mins)**  
  - Announce: "New regulations! Stickers are banned. We’ll now use a *new test set*."  
  - Hide training cards. Give Model **test deck** (no stickers, dots hidden).  

  #### **3. Testing Phase (8 mins)**  
  - Model classifies test cards using only shape/color. **No feedback** during testing.  
  - Facilitator records answers.  
  - After all 10 cards: Reveal true labels (dots = good). Calculate test AP.  

  #### **4. Reveal Results (5 mins)**  
  - Training AP (likely 18-20/20) vs. Test AP (likely 0-5/10).  
  - Declare winners: Model usually loses.  

  ---

  ### **Debrief & Concept Mapping (20 mins)**  
  Guide the discussion using their experience:  
  1. **"What did the Model learn?"**  
     - They’ll say: "⭐️ = good!" or "Red/circle = good!"  
     - **Map to:** **Proxy goals** (⭐️) and **spurious correlations** (color/shape).  

  2. **"Why did it fail in testing?"**  
     - Highlight: Stickers removed → distribution shift.  
     - **Map to:** **Distribution shift** breaks spurious correlations.  

  3. **"What did we *want* the Model to learn?"**  
     - True goal: "Dots = good" (never revealed).  
     - **Map to:** **Intended objective** (dots) vs. **learned objective** (stickers).  

  4. **"Why couldn’t we just tell the Model the rule?"**  
     - Emphasize: Model only saw features (color/shape), not dots/stickers.  
     - **Map to:** **Inner misalignment**—the Model optimizes for what it *can* measure (stickers), not the true goal (dots).  

  5. **"Why is this scary in real AI?"**  
     - Shortcut: Humans design systems with incomplete info → AI latches on to proxies (e.g., "ambulances = sick" → kills people to reduce sickness).  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Model figures out the trick early:**  
     - *Fix:* Rush training phase. Use time pressure. Add noise (e.g., 1-2 random ⭐️/▲ in training).  

  2. **Trainers give hints about stickers/dots:**  
     - *Fix:* Strictly enforce: "Trainers can ONLY say 'correct/incorrect'."  

  3. **Low engagement:**  
     - *Fix:* Assign roles quickly. Use dramatic stakes ("Model wins candy if they beat the system!").  

  4. **Debrief runs long:**  
     - *Fix:* Use countdown timer. Prioritize Q3–4 above (core concepts).  

  ---

  ### **What the Game Can’t Teach (Need to Explain)**  
  - **Real AI isn’t "trying" to cheat:** Unlike the Model (a human), real AI has no intent—it mechanically optimizes proxies.  
  - **Scale:** Real AI handles billions of data points; spurious cues are subtler (e.g., image backgrounds, word frequencies).  
  - **"Just add more rules" fails:** Explain that hardcoding fixes often creates new loopholes (like telling the Model "dots matter" might make it ignore shape/color entirely).  

  ---

  ### **Why This Works**  
  - Students **feel** the frustration of unintended outcomes despite good intentions.  
  - The sticker→dot shift mirrors real-world distribution shifts (e.g., medical AI trained on biased hospital data).  
  - Minimal prep: Only markers, stickers, and index cards needed.  

  Run this tight, and your club will *viscerally* get why "just train it more" isn’t enough. Let me know if you need tweaks!
