prompt: |-
  Act as an economist who specializes in information in markets and in how prices carry knowledge, and explain this to me like the backend engineer I am — no econ training at all. Think carefully before you answer, and start by writing out plainly what the assumptions behind the results below actually are, because I suspect all the interesting stuff is hiding there.

  My situation: I have a small brokerage account, and I also play in a prediction market with people from work (will the migration ship on time, will the new model beat the old one on our eval, that sort of thing). I'd always assumed the obvious stuff — when a price moves, someone learned something; when somebody takes the other side of my trade, either they know something I dont or they're about to lose money.

  Then I learned there's a result in economics, I think from the early 80s, about information and common knowledge, that says under certain conditions nobody trades at all, since any offer to trade leaks whatever you know. And a second one in the same family, about a buyer and a seller who each privately know their own value, saying you can't design a trading rule that's both honest and always efficient. I'm probably mangling both — correct me if so.

  What I want is the most important implications of these results for how I should actually treat prices and trades in the two little markets I'm in. Sort them by how much they lean on the unrealistic assumptions: I want to know which implications survive dropping the everybody-rational, everybody-shares-the-same-priors, nobody's-just-rebalancing parts, and which ones are overreach you see when people cite these theorems in forums. And does any of this conflict with the claim that prediction markets aggregate information — can I read a price as the market's belief, or not?
