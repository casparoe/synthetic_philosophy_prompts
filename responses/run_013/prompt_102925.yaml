  For the determinism concern: Giving causal weight to natural forces doesn't inevitably lead to determinism. Determinism becomes problematic when it presents outcomes as inevitable. But we can acknowledge volcanoes as powerful triggers while still recognizing that human responses create variation - how societies prepare for disasters, how institutions respond, etc. The 6th-century example shows this well - the same climatic shock produced different outcomes across regions based on human factors.

