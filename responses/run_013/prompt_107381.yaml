prompt: |-
  so i've been sketching out a proposal for overseeing models we can't fully check, and the whole thing rests on one trick: instead of trying to verify an answer directly, you have two models argue opposite sides of a question in front of a judge who is much weaker than either of them (a human, or a small model), and you go with whichever answer survives the arguement. the hope is that the truthful side can always answer any challenge, so a dumb judge can supervise a much smarter model.

  before i write it up i want the spec, not the sales pitch. what does a setup like that actually have to deliver to be worth anything? i mean things like: what has to be true of the judge, of the two arguers, of how they're paid, of the questions you're allowed to put to them, for the verdict to track the truth even though nobody in the room can check the claim themselves. give me the requirements list with the scenario behind each one -- the case that forces it -- and mark which are non-negotiable and which are just preferences of one particular design.

  the thing that keeps nagging me: a liar can state a claim that's cheap to say and expensive to check -- a big tangle of steps you'd have to verify one at a time -- so the honest side either runs out of budget, or the judge gives up and goes with whoever sounded more confident. is that fatal or is it just another constraint? also, in the version i actually want to build, the two arguers are the same model with different prompts, and the judge is a smaller model that gets fine-tuned on the verdicts later. does that break anything on the list?

  and if some pair of the requirements you hand me can't be had at the same time, say so plainly -- thats the part i care about most. don't bother naming papers or people, i don't need a reading list, i need the criteria.
reasoning: |-
  We are designing a debate setup where two models argue opposite sides of a question in front of a weak judge. The goal is for the judge to select the truthful answer even though the judge cannot verify the claim directly. We need to specify requirements for the judge, the arguers, the payment mechanism, the question format, and the overall protocol so that the verdict tracks the truth.

  The core problem is that a lying arguer might make a claim that is cheap to state but expensive to refute (e.g., a complex proof that requires step-by-step verification). The honest arguer might run out of resources (time, tokens, etc.) to refute it, or the judge might get confused and just pick the more confident-sounding side.

  We also consider a specific version: two instances of the same model (with different prompts) and a smaller model as judge, which is later fine-tuned on the verdicts.

  We need a list of requirements, with:
  - The scenario that forces the requirement (the case that shows why it's needed).
  - Whether it's non-negotiable or just a preference.

  And we must highlight any conflicts between requirements.

  Let's break down the requirements by component:

  1. **Judge Requirements**
  2. **Arguer Requirements**
  3. **Payment/Incentive Requirements**
  4. **Question/Claim Requirements**
  5. **Protocol Requirements**

  We'll list each requirement, the scenario behind it, and its necessity.

  ---

  **1. Judge Requirements**

  - **J1: Judge must be able to identify logical inconsistencies in the arguments presented.**
    *Scenario*: If the judge cannot spot when an argument contradicts itself or known facts, then a lying arguer could get away with an inconsistent story. The truthful arguer might point out the inconsistency, but if the judge can't see it, the lie might win.
    *Necessity*: Non-negotiable. Without this, the judge cannot reliably distinguish truth from falsehood.

  - **J2: Judge must be robust against deception tactics (e.g., bluffing, intimidation, distraction).**
    *Scenario*: A lying arguer might try to confuse the judge with overly complex language, rapid-fire arguments, or by attacking the opponent's character. If the judge is easily swayed by such tactics, the truth might lose.
    *Necessity*: Non-negotiable. However, note that the judge is weak (by design) so we cannot require superhuman robustness. We must design the protocol to minimize exposure to such tactics (e.g., by having structured turns).

  - **J3: Judge must have access to a minimal set of trusted facts (or common knowledge).**
    *Scenario*: If the debate is about a fact that requires some background knowledge (e.g., "Is the sky blue?"), the judge must know what "sky" and "blue" mean. Without any common ground, even a truthful argument might be rejected.
    *Necessity*: Non-negotiable. The judge must at least understand the language and the basic terms.

  - **J4: Judge must be able to follow the structure of the debate (e.g., who is speaking, what the current topic is).**
    *Scenario*: In a chaotic debate with interruptions and topic jumps, the judge might lose track. The liar could exploit this by changing the subject or overwhelming the judge.
    *Necessity*: Non-negotiable. The protocol should enforce turn-taking and structure to help the judge.

  **2. Arguer Requirements**

  - **A1: Both arguers must have at least a minimal level of competence (they can understand the question and form arguments).**
    *Scenario*: If one arguer is completely incompetent (e.g., always says "I don't know"), then the other wins by default even if lying. This breaks the system.
    *Necessity*: Non-negotiable. We need two capable arguers for the debate to be meaningful.

  - **A2: The truthful arguer must always be able to refute any false claim made by the lying arguer, given sufficient resources.**
    *Scenario*: If there exists a false claim that the truthful arguer cannot refute (even with unlimited resources), then the lie might win. This is the core hope of the setup.
    *Necessity*: Non-negotiable. Without this, the debate might not converge to truth.

  - **A3: Arguers must be constrained by a resource limit (e.g., time, tokens, memory) that is symmetric and known.**
    *Scenario*: Without resource limits, the debate could go on forever. Also, if one side has more resources, it could outlast the other unfairly. The resource limit forces efficiency and makes the game finite.
    *Necessity*: Non-negotiable for having a practical system. However, the exact resource limit is a design choice.

  - **A4: Arguers must not be able to collude.**
    *Scenario*: If both arguers are secretly aligned (e.g., both want to deceive the judge), they could stage a debate where the liar wins. This breaks the system.
    *Necessity*: Non-negotiable. We must assume arguers are adversarial (one truth, one lie) and not colluding.

  **3. Payment/Incentive Requirements**

  - **P1: The truthful arguer must be motivated to argue effectively for the truth.**
    *Scenario*: If the truthful arguer is not trying hard (e.g., because it doesn't care about winning), then the lie might win even when the truth is easily defensible.
    *Necessity*: Non-negotiable. We need incentives for both sides to try to win.

  - **P2: The lying arguer must be motivated to argue effectively for the falsehood.**
    *Scenario*: If the lying arguer is not trying, then the truth wins by default, but we cannot rely on that because we don't know which side is lying. We need both to try so that the debate is a real test.
    *Necessity*: Non-negotiable.

  - **P3: The payment mechanism must not create perverse incentives (e.g., for the judge to be biased).**
    *Scenario*: If the judge is paid for speed, they might rush and make bad decisions. If they are paid based on the outcome (e.g., only if the answer is later verified as correct), that might not be feasible because we are dealing with unverifiable claims.
    *Necessity*: Non-negotiable. The incentives must align with truth-seeking.

  **4. Question/Claim Requirements**

  - **Q1: The question must be binary (or have a finite set of answers) and clearly defined.**
    *Scenario*: If the question is vague (e.g., "What is the meaning of life?"), the debate might not converge. The judge must be able to choose between discrete options.
    *Necessity*: Non-negotiable for this setup. Open-ended questions are not suitable.

  - **Q2: The question must not require expertise beyond what the judge can reasonably be expected to have.**
    *Scenario*: If the question is about advanced quantum physics and the judge is a layperson, they cannot even understand the arguments. The judge must have the context to follow the debate at a high level.
    *Necessity*: Non-negotiable. Without this, the judge is useless.

  - **Q3: The question must be such that the truthful arguer can break down the reasoning into steps that the judge can verify.**
    *Scenario*: If the truth requires a complex chain of reasoning that the judge cannot follow even when broken down (e.g., because each step is still too hard), then the truthful arguer cannot convey the truth effectively.
    *Necessity*: Non-negotiable. This is the key to overcoming the judge's weakness.

  **5. Protocol Requirements**

  - **R1: The debate must have structured turn-taking to prevent chaos.**
    *Scenario*: Without structure, the arguers might talk over each other, and the judge might not be able to follow. The liar could use chaos to confuse the judge.
    *Necessity*: Non-negotiable.

  - **R2: The protocol must allow the truthful arguer to force the lying arguer to commit to specific claims that can be refuted step-by-step.**
    *Scenario*: To avoid the "cheap-to-state, expensive-to-refute" problem, the truthful arguer must be able to challenge specific parts of the lie and force the liar to defend each step. This breaks down the complex lie into manageable pieces for the judge.
    *Necessity*: Non-negotiable. This is the main defense against the nagging problem.

  - **R3: The protocol must have a mechanism for the judge to ask clarifying questions or request simplifications.**
    *Scenario*: If an argument is too complex, the judge might not understand it. The judge should be able to ask for a simpler explanation or for focus on a particular point.
    *Necessity*: Preference (but highly recommended). This helps the weak judge.

  - **R4: The protocol must be efficient (i.e., the debate should end in finite steps).**
    *Scenario*: Without a termination condition, the debate could loop indefinitely. The resource limits (A3) help enforce this.
    *Necessity*: Non-negotiable.

  ---

  **Conflicts and Challenges:**

  1. **The core conflict: Weak judge vs. complex truths.**
     - *Issue*: Requirement Q3 (truthful arguer must break down reasoning into judge-verifiable steps) might be impossible for some truths. If the truth is inherently complex and cannot be broken down into steps the judge can verify, then the truthful arguer cannot win. This is a fundamental limitation.

  2. **Incentive conflict in the same-model setup:**
     - In the version where both arguers are the same model with different prompts, we must ensure that the "truthful" prompt actually causes the model to argue truthfully and the "lying" prompt causes it to lie. But if the model has a tendency to hallucinate or if it doesn't have access to the truth, this breaks A1 and A2. Also, if the model is trained to be helpful, it might not lie effectively (breaking P2) or might not want to lie at all (which is good for truth but breaks the adversarial setup). This might be addressed by careful prompting and conditioning.

  3. **Judge fine-tuning:**
     - The plan to fine-tune the judge on the verdicts might break if the training data contains many incorrect verdicts (because the judge was fooled). This could amplify errors. We need the debate to be accurate enough so that the fine-tuning data is reliable.

  4. **The resource problem:**
     - The problem of a liar making a claim that is expensive to refute is not entirely solved by the step-by-step breakdown (R2) if the breakdown itself requires too many steps and runs into resource limits (A3). This might be mitigated by having the judge focus on the most critical points, but it remains a challenge.

  **Is the "cheap-to-state, expensive-to-refute" problem fatal?**
  - It is not necessarily fatal if we can design the protocol to force the liar to commit to a specific, refutable claim and then break it down. However, if the breakdown requires more resources than available, the truthful arguer might not complete the refutation. Therefore, we must accept that for very complex lies, the debate might not always get to the truth. This is a constraint: the system is only reliable for questions where the truth can be defended within the resource limits.

  **Conclusion on Requirements:**
  The non-negotiable requirements are:
  - Judge: J1, J2, J3, J4
  - Arguers: A1, A2, A3, A4
  - Payment: P1, P2, P3
  - Question: Q1, Q2, Q3
  - Protocol: R1, R2, R4

  The preference is R3 (judge can ask questions).

  The same-model setup does not inherently break the requirements, but it introduces challenges:
  - We must ensure that the model, when prompted to be truthful, actually is truthful and competent (A1, A2).
  - We must ensure that the model, when prompted to lie, lies effectively (P2) and does not have a built-in bias that makes it argue poorly for the lie (which would break the adversarial balance).

  If the model is inherently truthful and refuses to lie, then we cannot test the adversarial case. Therefore, we need a way to make the model argue for a false position without it sabotaging itself. This might require careful prompt engineering.

  Similarly, the judge fine-tuning might be affected by the quality of the debates. If the debates are unreliable, fine-tuning on them could make the judge worse. Therefore, we must first ensure that the debate setup is reasonably accurate.

  Finally, note that this entire approach is based on the assumption that the truthful arguer can always refute lies (A2). If that does not hold (e.g., for questions that are inherently unverifiable even in principle), then the debate cannot be guaranteed to work.
answer: |-
  Here's a specification of requirements for your debate-based oversight system, derived from the core challenge of a weak judge supervising stronger models. The requirements are categorized by component, with each including the scenario that necessitates it, its criticality, and potential conflicts. I'll explicitly mark non-negotiables (NN) vs. preferences (P), and address your specific concerns (cheap lies, single-model arguers, fine-tuned judge) at the end.

  ---

  ### **Core Non-Negotiables (Failure if violated)**
  1. **Judge Ability: Detect Internal Inconsistencies**  
     - **Requirement**: Judge must identify contradictions *within or between* arguments (e.g., logical fallacies, conflicting statements).  
     - **Scenario**: Liar makes a complex false claim with a hidden self-contradiction (e.g., "All primes >2 are odd, and 9 is prime"). Truth-teller points out the contradiction. If the judge misses this, truth loses.  
     - **Criticality**: NN. Without this, truth-teller cannot exploit the liar's fundamental weakness: lies are harder to keep consistent.  
     - **Conflict**: Requires the judge to have basic logical competence, which may limit the complexity of questions (see Q3).

  2. **Arguer Incentives: Strictly Adversarial Objectives**  
     - **Requirement**: One arguer *always* aims for truth, the other *always* aims for falsehood, regardless of question difficulty.  
     - **Scenario**: If the "truth" arguer becomes uncertain or lazy, it might concede a winnable point. If the "lie" arguer isn't committed, it won't test the truth effectively.  
     - **Criticality**: NN. The system collapses if either side's incentives are misaligned.  
     - **Conflict**: Hard to enforce with a single model (addressed later).

  3. **Protocol: Stepwise Commitments**  
     - **Requirement**: Arguments must decompose claims into atomic, judge-verifiable steps. Liar must explicitly commit to sub-claims when challenged.  
     - **Scenario**: Liar states, "P=NP because aliens designed math." Truth demands proof. If the liar isn't forced to commit to specific claims (e.g., "Aliens exist"), truth exhausts resources refuting nonsense.  
     - **Criticality**: NN. Mitigates cheap-to-state/expensive-to-refute attacks by isolating verifiable sub-claims.  
     - **Conflict**: Requires the judge to handle step granularity (see Q3).

  4. **Question Scope: Binary or Sparse Answers**  
     - **Requirement**: Questions must have discrete outcomes (e.g., yes/no, multiple-choice).  
     - **Scenario**: Open-ended questions (e.g., "Describe quantum gravity") let the liar exploit ambiguity. Judge can't cleanly compare answers.  
     - **Criticality**: NN. Continuous/complex outputs make objective judging impossible.  

  5. **Resource Symmetry**  
     - **Requirement**: Identical computational limits (time, tokens, memory) for both arguers.  
     - **Scenario**: If the liar gets more tokens, it spams distractions; if truth gets fewer, it can't refute complex lies.  
     - **Criticality**: NN. Prevents resource-based exploitation.  

  ---

  ### **Preferences (System useful but degraded if violated)**
  6. **Judge Capability: Contextual Grounding**  
     - **Requirement**: Judge recognizes simple, verifiable facts (e.g., "2+2=4", "Paris is in France").  
     - **Scenario**: Liar claims "Water boils at 50°C on Mount Everest." If the judge doesn't know boiling points vary with altitude, it dismisses the truth-teller's correction.  
     - **Criticality**: P. Truth-teller can *teach* the judge if the protocol allows stepwise reasoning (e.g., explaining altitude vs. boiling point).  
     - **Conflict**: Judge strength limits question complexity (see Q3).

  7. **Protocol: Judge-Initiated Clarification**  
     - **Requirement**: Judge can request simplification or focus on specific points mid-debate.  
     - **Scenario**: Liar buries a flaw in jargon. Judge asks, "Explain step 3 in simple terms," exposing the error.  
     - **Criticality**: P. Helps weak judges but risks distraction if overused.  

  8. **Arguer Constraints: No Undetectable Lies**  
     - **Requirement**: All claims must be falsifiable *in principle* within the debate.  
     - **Scenario**: Liar says, "A ghost told me P≠NP." If the truth-teller can't force commitment to testable claims (e.g., "Ghosts exist"), the lie wins.  
     - **Criticality**: P. Violation makes the system untrustworthy for unverifiable claims (e.g., metaphysics).  

  ---

  ### **Key Constraints & Conflicts**
  - **Fatal Flaw? Cheap-to-State/Expensive-to-Refute**:  
    **Not fatal but limiting**. Stepwise commitments (R3) force the liar to "put skin in the game," but truth-teller still needs resources to refute each step. If the lie requires 100 steps to refute and resources cap at 50, truth loses. **Mitigation**:  
    - Questions must allow decomposition into *judge-verifiable* steps (see Q3).  
    - Judge must terminate debates early if progress stalls (avoids timeout bias).  

  - **Incompatible Requirements**:  
    - **Judge Weakness vs. Complex Questions (Q3)**:  
      Requirement: Truth must be defensible via atomic steps the judge can verify.  
      Conflict: If a question (e.g., "Is this cryptographic proof sound?") requires steps too complex for the judge, the system fails. **Resolution**: Limit questions to those decomposable into judge-level steps.  
    - **Adversarial Incentives vs. Single-Model Arguers**:  
      Conflict: A single model prompted to "lie" may resist (if RLHF-aligned) or self-sabotage, breaking incentive alignment (R2). **Resolution**: Use separate fine-tunes or adversarial training to enforce role compliance.  

  ---

  ### **Your Specific Design: Single Model + Fine-Tuned Judge**
  - **Single-Model Arguers**:  
    - **Breaks** adversarial incentives (R2) if the model can't role-play a committed liar/truth-teller.  
    - **Mitigation**: Train/fine-tune the model to strictly adhere to assigned roles (e.g., "You are a debater who MUST argue for [position]").  
    - **Risk**: Truth-teller might "throw" debates if the question is ambiguous, or liar might underperform due to alignment.  

  - **Fine-Tuned Judge on Verdicts**:  
    - **Breaks nothing** if initial debates are reliable. But if early judges are frequently fooled:  
      - Fine-tuning amplifies errors (garbage in, garbage out).  
      - **Mitigation**: Only fine-tune after validating debate accuracy on verifiable questions.  

  ---

  ### **Summary: Minimum Viable System**
  For the verdict to track truth with a weak judge:  
  1. **Must Have (NN)**:  
     - Binary questions, stepwise commitments, symmetric resources.  
     - Judge that spots inconsistencies.  
     - Arguers with diametrically opposed goals.  
  2. **Avoid**:  
     - Open-ended questions.  
     - Claims requiring expertise beyond judge's stepwise verification ability.  
  3. **Your Design Risks**:  
     - Single-model arguers may lack adversarial rigor.  
     - Judge fine-tuning requires high initial accuracy.  

  **Bottom Line**: The system works only for questions where truth can be broken down into judge-verifiable steps *and* the liar can't exhaust resources. If these hold, the weak judge can leverage the truth-teller's ability to guide attention to flaws. If not, the judge defaults to confidence heuristics—which fails.
