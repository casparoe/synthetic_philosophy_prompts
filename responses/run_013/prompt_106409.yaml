answer: |-
  ### Audit of Hofstadter's Analogy for "Man" as Generic  
  **Correspondence Table:**  
  - "Man" (generic) → "White"  
  - "Woman" → "Black"  
  - "He/she" → "Whe/ble"  

  **Where the Substitution Breaks Down:**  
  1. **Polysemy vs. Monosemy:** "Man" intrinsically means "adult male human" *and* (historically) "humanity". "White" has no such dual meaning—it’s purely racial.  
  2. **Grammatical Defaults:** English lacks a true epicene (gender-neutral) pronoun, making "he" a *prescriptive* default, whereas "whe" is an artificial construct. Race terms lack this grammatical entanglement.  
  3. **Slur Asymmetry:** "Black" was weaponised as a slur; "woman" was not. Resistance to "person" isn’t hate speech like opposing racial terms.  
  4. **Historic Baggage:** Racial hierarchies were violently enforced; sex-based language evolved more diffusely, with "man" as generic fading organically post-1960s.  

  **Which Breaks Matter?**  
  - **Polysemy** is **noise**. Hofstadter’s satire targets contexts where "man" *excludes* women (e.g., "mankind"), exposing how default maleness is framed as universal. The dual meaning is irrelevant here—it’s about *interpretive bias*.  
  - **Grammatical defaults** weaken the analogy slightly but don’t collapse it. Prescriptive rules ("use 'he' for all!") mirror racist logic ("use terms centring whites!").  
  - **Slur/history asymmetries** are **critical but not fatal**. The analogy isn’t equating misogyny with racism but revealing *identical rhetorical tactics*: defending exclusionary language as "tradition" while dismissing inclusive alternatives as "political correctness".  

  **Conclusion Survival:**  
  **Your core argument holds.** The analogy succeeds in exposing hypocrisy: those rejecting "person" while accepting equivalent race swaps reveal a double standard in whose humanity gets centred. Empirical studies (e.g., Hyde, 1984) confirm "man" primes male imagery, marginalising women—paralleling how racial defaults "other" minorities. The substitution *isn’t* carrying your claim; it’s a diagnostic tool.  

  **Strengthen Instead With:**  
  1. **Linguistic Evidence:** Cite studies showing "they" or "person" improves cognitive inclusion (e.g., Stout & Dasgupta, 2016).  
  2. **Historical Precedent:** Note how "he" was *legally* interpreted as male-exclusive until challenged (e.g., *US v. Yazell*, 1966).  
  3. **Power Dynamics:** Argue that dismissing "person" mirrors historic resistance to titles like "Ms."—trivialising women’s linguistic visibility.  

  **Verdict:** Use Hofstadter boldly. The analogy cracks at the edges but the foundation—that linguistic defaults enforce hierarchy—stands firm. Your friend mistakes asymmetry for invalidity.
