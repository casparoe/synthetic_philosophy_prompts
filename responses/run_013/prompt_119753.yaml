  ### Decision Tree: Positions on Macrohistory as a Predictive Science  
  *Answer the questions below to find your stance. No prior knowledge of theory required.*

  ---

  #### **Question 1:**  
  *Are there recurring patterns in history that transcend individual beliefs or choices?*  
  - **No** → *Go to Question 1a*  
  - **Yes** → *Go to Question 2*  

  **Question 1a:**  
  *Can history be explained solely by rational individual actions?*  
  - **Yes** → **Rational-action position** (No social laws needed; macrohistory is the sum of choices).  
  - **No** → **Idiographic position** (Each event is unique; no general patterns exist).  

  ---

  #### **Question 2:**  
  *Are historical patterns **law-like** (universal, timeless) or **context-bound** (only valid in specific eras/cultures)?*  
  - **Law-like** → *Go to Question 3*  
  - **Context-bound** → *Go to Question 7*  

  ---

  #### **Question 3:**  
