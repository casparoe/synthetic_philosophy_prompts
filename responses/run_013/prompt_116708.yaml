  I work as an actuary, mostly catastrophe reinsurance, so the words I actually think in are exposure unit, expected annual loss, marginal contribution to portfolio risk, attachment point, loss ratio, and attribution. I did a PPE minor years ago and have half-kept up with moral philosophy since, so I know the rough shape of the debate about whether my individual contribution to a collective harm — a flight, a burger, a vote — makes any difference at all, but I've never managed to line that debate up against the way I think about risk for a living, and every time I try I get tangled up becuase the two vocabularies keep sliding past each other.

  So: take the inefficacy objection (my act changes nothing, so it can't be what makes the harm happen, so it isn't wrong) and the main replies to it — the marginal-impact reply, the complicity/tainted-involvement reply, the collective-action or expected-consequences reply, and the "what you're doing as a member of a group" reply — and restate each one as faithfully as you can in actuarial terms: pools, exposure, marginal versus average effects, attributable loss, expected value, adverse selection and moral hazard if you think those belong. I want the translation honest, not flattering: if a reply only goes through once you've quietly recast it as a risk-pricing exercise, say exactly where the fudge is and what got dropped to make it fit. I'm moderately fluent in the philosophy side (I can follow the arguments, I don't know the fine print) and completely at home in the actuarial side, so pitch it accordingly.

  Then the part I actually care about: the residue report. What in the philosophers' disagreement has no counterpart in my vocabulary at all — is "wrong" doing work that expected loss can't, or is the whole thing a dispute about how to attribute a pool's losses that actuaries settled pragmatically decades ago? And which way does the residue cut: is my framework missing something real, or is the philosophers' dispute less substantive than it looks once you price it? Give it to me as exactly five numbered items, no introduction and no conclusion — item one the inefficacy objection itself, items two through four one reply each, item five the residue report and your verdict on which way it cuts. Each item a short paragraph of a few sentences, not a one-liner.
