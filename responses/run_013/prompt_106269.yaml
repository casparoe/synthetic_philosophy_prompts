prompt: |-
  I'm a backend engineer and somehow I ended up on the board of our county history museum (long story, I got roped in because I maintain the website). Next Thursday the board votes on whether to host a traveling exhibit that a local family is offering to pay for. It's about a supposed advanced civilization that existed before the last ice age and then got wiped out, and it leans hard on the idea that mainstream archaeologists have "sat on" the evidence against it. The curator isn't an obvious crank -- he talks like a researcher, and he's got a list of maybe eight people with real degrees who back him up. His pitch is that he isn't asking us to endorse anything: he just wants the exhibit shown as one "hypothesis" among others, and he wants to display it with what he calls a "confidence continuum" -- every claim, mainstream or fringe, gets a 0-to-100 confidence score on one big chart, so visitors can "weigh the evidence themselves."

  Two board members are into this and keep saying the museum shouldn't be in the business of picking winners. I don't have a good comeback and honestly I'm not sure they're wrong.

  The complication: a chunk of the exhibit is actually solid. There's a genuinly good section on how carbon dating and ice cores work, and it's the only part that's about our actual county. So a flat no throws away something real. And the family funding it has donated before and might walk if we reject it.

  I need to draft the memo I'll circulate before the vote. Give me a clear recommendation with a concrete plan and a date -- not just "more study." And I want criteria the board can actually apply to the next weird exhibit that comes along, not just this one. Please take the neutrality argument seriously enough that my colleagues will feel heard, since I'll be reading this out loud to them.
reasoning: |-
  Okay, the user is a backend engineer on a county history museum board. They need to draft a memo about a controversial exhibit proposal. Let me unpack this.

  First, the exhibit in question is about a pre-ice age advanced civilization, which sounds like it's leaning into pseudoarchaeology. The curator presents it as a "hypothesis" with a "confidence continuum" scoring system. Two board members are pushing for it under the banner of neutrality - "let visitors decide."

  Hmm. The user's core conflict is balancing multiple tensions: 
  - Preserving museum credibility vs accommodating donors 
  - Addressing legitimate concerns about neutrality vs enabling pseudoscience 
  - Keeping valuable local content (the solid carbon dating section) vs platforming fringe theories 

  The user specifically asked for concrete criteria for future exhibits, not just kicking the can down the road. And they emphasized the need to validate colleagues' neutrality concerns. 

  Breaking this down: 
  The biggest red flag is the exhibit's framing. Presenting well-established science alongside fringe theories with "confidence scores" fundamentally misunderstands how scientific consensus works. It gives equal weight to radically unequal evidence - that's not neutrality, it's false equivalence. 

  But! The local science section is genuinely valuable. And donor relationships matter for small museums. So outright rejection isn't ideal. 

  What if we... 
  1. Separate the wheat from the chaff? Keep the carbon dating/ice core content as a standalone exhibit since it's locally relevant and educational. 
  2. Reject the pseudoarchaeology framework entirely - no "confidence continuum" that equates peer-reviewed science with speculation. 
  3. Offer alternative programming about how historians evaluate evidence? That actually addresses the neutrality argument better than platforming fringe views. 

  For future proposals, we need objective criteria: 
  - Primary vs secondary claims (are core ideas peer-reviewed?) 
  - Local relevance test (why OUR museum?) 
  - Transparency about evidence tiers (no false equivalences) 
  - Donor influence boundaries 

  The memo should validate colleagues' concerns upfront: "Some rightly argue museums shouldn't pre-judge ideas..." before explaining why this framework crosses the line. Emphasize that true neutrality means contextualizing claims, not abandoning expertise. 

  Also important: give the donor family an off-ramp. Frame it as "we value your support and want to highlight the strongest part of your proposal" rather than outright rejection. 

  Deadline-wise - vote on Thursday, so the memo needs to circulate Tuesday. Concrete enough?
answer: |-
  Here's a science-backed, actionable memo draft that respects neutrality concerns while protecting the museum's integrity. It includes clear criteria for future decisions:

  ---

  **MEMO: Proposed Traveling Exhibit Evaluation Framework & Recommendation**  
  **To:** Board of Directors, [County] History Museum  
  **From:** [Your Name], Board Member  
  **Date:** [Current Date]  
  **Vote Recommendation:** **Conditional Approval** with Modifications  
  **Deadline for Final Approval:** [Date 4 days from now, e.g., next Monday]  

  ### 1. **Acknowledgement of Valid Concerns**  
  I strongly agree with colleagues who argue museums shouldn’t "pick winners" by suppressing alternative viewpoints. Neutrality is core to our mission. However, true neutrality requires distinguishing between *evidence-based hypotheses* and *unsubstantiated claims*, ensuring visitors have accurate context to evaluate ideas fairly. Presenting disproven theories alongside established science *without clear scholarly context* risks misleading the public—which violates our educational duty.

  ### 2. **Recommended Action: Split & Reframe the Exhibit**  
  Approve **ONLY the scientifically validated section** (carbon dating/ice cores + local connections) as a stand-alone exhibit titled *"Science in Archaeology: How We Know What We Know."*  

  Reject the "pre-ice age civilization" narrative **unless the curator agrees to these modifications**:  
  - Replace the "confidence continuum" with a **"Evidence Transparency Framework"** (see Section 3).  
  - Remove accusations of academic suppression (e.g., "mainstream archaeologists sat on evidence").  
  - Include **peer-reviewed citations** for all major claims, displayed prominently.  

  **Timeline:**  
  - Curator must accept/reject modifications by **[Date 3 days from now]**.  
  - Final board review of revised proposal: **Next Monday**.  
  - If rejected, we proceed with the science-only exhibit.  

  ### 3. **Evidence Transparency Framework (for THIS & FUTURE Exhibits)**  
  To objectively evaluate controversial proposals, adopt these criteria:  

  | **Criterion**                  | **Green Light**                                                                 | **Red Flag**                                                                 |
  |-------------------------------|--------------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | **Primary Claims**             | Peer-reviewed in relevant journals; consensus positions clearly distinguished. | Relies on self-published books, podcasts, or non-academic sources.          |
  | **Local Relevance**            | Directly ties to county history/collections (e.g., our ice core data).        | No meaningful local connection beyond funding source.                       |
  | **Funding Influence**          | Donors have no editorial control; all content vetted by curator/staff.         | Donors demand specific narratives or exclusion of counter-evidence.         |
  | **Neutrality Execution**       | Contextualizes *why* disagreements exist (methodology gaps, new data, etc.).  | Falsely equates fringe/marginal views with established science.             |
  | **Accountability**             | Scholars backing claims are active in the field with recent publications.     | "Experts" lack relevant credentials or haven’t published in >10 years.     |

  ### 4. **Why This Works**  
  - **Saves the valuable content:** We keep the locally relevant, educational science section.  
  - **Honors the donor:** Offer to credit the family for funding the science exhibit. If they withdraw, we lose only 20% of the proposal.  
  - **True neutrality:** The "Evidence Transparency Framework" avoids gatekeeping while exposing visitors to *how* scholars vet claims—e.g., "This claim cites a 1992 non-peer-reviewed book; this one cites 2023 DNA studies in *Nature*."  
  - **Precedent-setting:** Future exhibits are judged on objective criteria, not perceived "weirdness."  

  ### 5. **Risks of Unmodified Approval**  
  - **Reputational harm:** Accrediting bodies (AAM, AASLH) caution against platforming debunked theories without context.  
  - **Misleading visitors:** The "confidence continuum" implies all claims deserve equal scrutiny—a false equivalence. (E.g., Should climate change denial get a "50% confidence" score?)  
  - **Undermines real scholarship:** Accusing archaeologists of suppression without proof violates our commitment to evidence.  

  ---

  **Talking Points for Your Presentation:**  
  - "This isn’t about silencing speculation—it’s about showing visitors *how* to weigh evidence. That’s true education."  
  - "We can showcase the genuine science funded by this family while upholding standards that keep our community’s trust."  
  - "Our modified framework lets us say ‘yes’ to controversial ideas—if they’re transparent about their sources and methods."  

  This plan meets scientific, ethical, and operational needs while respecting all viewpoints. Let’s champion both intellectual openness and rigor.  

  ---  
  **Vote Recommendation:**  
  ✅ **Approve science-only exhibit IMMEDIATELY.**  
  ✅ **Approve modified full exhibit IF curator agrees to changes by [date].**  
  ❌ Reject unmodified pseudoarchaeology content.
