prompt: |-
  I am on a working group drafting the standing rules for how a professional association's ethics committee reaches decisions. The committee rules on individual cases but also, in the same sitting, affirms the general principles it applies, so the agenda is logically connected: the principles entail verdicts on the cases, and a member's verdicts constrain which principles she can consistently affirm. Before we argue over rival procedures, I want the specification. Give me the desiderata any aggregation method must meet to count as adequate for us: the cases it has to get right, the distinctions it cannot collapse (for instance, between aggregating members' final verdicts and aggregating the reasons behind them), and the results it must not contradict, each with the consideration that motivates it. Say which requirements you take to be non-negotiable and which are merely preferences of one camp, and whether some subset of them is jointly unsatisfiable; that last point interests me more than any scorecard of particular procedures. Close by naming the single requirement that does the most to rule out otherwise attractive methods, and why. Write it as continuous prose in American English, the way you would write an email — no headings, bullets, bold, or tables.
reasoning: |-
  Okay, the user is part of a working group drafting standing rules for a professional association's ethics committee. This committee handles individual cases and affirms general principles in the same sitting, with logical connections between principles and verdicts. The user wants desiderata for an aggregation method that must handle these interconnected decisions properly.

  I need to identify key requirements for the aggregation method. The committee's work involves both specific case verdicts and general principles, and these are logically linked—principles entail verdicts, and verdicts constrain principles. So the aggregation method must respect these logical connections. 

  First, the method must ensure logical consistency. If the principles logically imply certain verdicts, the aggregated decisions shouldn't contradict that. For example, if all members agree on a principle that implies a verdict, the aggregated outcome must reflect that verdict. This seems non-negotiable because without it, the committee's decisions could be incoherent.

  Next, the distinction between aggregating verdicts versus reasons is crucial. The user explicitly mentioned this. If members vote on cases based on different rationales, aggregating only the final verdicts might hide underlying disagreements or lead to inconsistent principles. But aggregating reasons could be messy and impractical. The method must handle this tension, perhaps by requiring members to link their verdicts to principles during deliberation. This feels like a core requirement too.

  Another point is systematicity versus path-dependence. Should the order of agenda items affect outcomes? In legal settings, path-dependence might be acceptable, but for an ethics committee, systematicity—where outcomes depend only on member judgments, not sequence—could be vital for fairness and predictability. However, this might conflict with other goals, making it a strong preference rather than absolute.

  The method must also respect individual rationality. Each member's judgments should be logically consistent, but the group outcome might still have inconsistencies due to aggregation. This is the "doctrinal paradox," where individually rational members produce a collectively irrational outcome. The desiderata should address whether consistency is required at the group level and how to resolve such paradoxes.

  Looking at must-haves versus preferences: Logical consistency and respecting the verdict-principles link are non-negotiable. Distinguishing verdict aggregation from reason aggregation is also critical. Systematicity might be a preference of some members but not others. The requirement that does the most to rule out methods is likely the consistency mandate because it forces complex solutions like sequential voting or premise-based approaches, which can be cumbersome.

  The user is particularly interested in whether some desiderata are jointly unsatisfiable. Yes, for example, Arrow's theorem-like issues show that consistency, non-dictatorship, and systematicity can conflict. Also, requiring both individual rationality and group consistency might lead to impossibility in certain judgment aggregation scenarios. Highlighting these tensions is important.

  For the closing point, the consistency requirement is the biggest hurdle. It rules out simple majority voting on each item independently, which is attractive for its simplicity but risks contradictions. Instead, methods like premise-based aggregation (voting on principles first) might be needed, but they require careful structuring of the agenda.

  I'll structure the response as continuous prose in American English, like an email. Start with the core problem, list key desiderata with motivations, note which are non-negotiable versus preferences, discuss joint unsatisfiability, and end with the most restrictive requirement.
answer: |-
  Here's how I'd lay out those desiderata for your working group, based on the core challenge of aggregating logically interconnected judgments about principles and cases. Think of this as the shared conceptual ground we need before debating specific procedures:

  First and foremost, any method **must produce logically consistent collective outputs** across both principles and case verdicts in a single agenda. If Principle P collectively affirmed entails that Case C must be decided a certain way, the committee's final decision on C cannot contradict that entailment. This is non-negotiable. Without it, the committee undermines its own authority and coherence—it’s declaring principles while simultaneously violating them in application. This requirement immediately rules out naive "vote item-by-item independently" approaches, as they risk collective inconsistency (the doctrinal paradox).

  Second, the method **must respect the distinction between aggregating judgments on propositions (principles/verdicts) versus aggregating the underlying reasons for them**. We’re aggregating *outputs* of member deliberation (their yes/no stances on specific principles and cases), not their private rationales. Two members might agree Case C is unethical but for wildly different reasons; the aggregation method shouldn’t demand they share premises, only that the collective set of affirmed principles and verdicts hangs together logically. Forcing aggregation of reasons would be impractical and intrusive. However, the method *should* require members to submit logically consistent *individual* sets of judgments (their "profiles")—a member can’t affirm P, affirm that P entails C, yet reject C. This individual rationality constraint is also non-negotiable; it ensures members engage seriously with the logical structure.

  Third, **systematicity versus path-dependence matters critically**. Should the collective outcome depend *only* on member judgments on each proposition, regardless of voting order (systematicity)? Or can agenda sequence affect the result (path-dependence)? Systematicity is cleaner and prevents manipulation via agenda-setting, but it might force harder trade-offs with consistency (due to impossibility theorems). Path-dependence (e.g., voting on principles first, then letting them constrain case votes) can guarantee consistency but risks burying genuine disagreement on cases by "railroading" via early principle votes. This is where camps diverge: Systematicity is often a procedural ideal, but many real-world ethics bodies accept path-dependence for manageability. Call this a strong preference but potentially negotiable under constraints.

  Fourth, **non-dictatorship and non-triviality are absolute**. No single member should determine outcomes, and the method must genuinely aggregate diverse views—not default to pre-set rules ignoring member input. Similarly, the method must resolve ties deterministically; hung decisions undermine the committee’s function.

  Now, the joint unsatisfiability point you’re keen on: Yes, a subset of these *cannot all be fully satisfied simultaneously* in complex agendas, thanks to extensions of Arrow’s Theorem to judgment aggregation. If you insist on **collective consistency, individual rationality, universal domain** (accepting any coherent member judgment set), **non-dictatorship, and systematicity (independence of irrelevant alternatives/proposition-wise aggregation)**, you hit an impossibility result. Something must give. Typically, real committees relax systematicity (allowing path-dependent voting orders) or weaken universal domain (constraining how members can link principles/cases via predefined frameworks). Acknowledging this tension is crucial—don’t let proponents of any method pretend it magically satisfies all ideals.

  Finally, the requirement doing the heaviest lifting in ruling out attractive methods is **collective consistency across principles and cases**. It’s why simple majority voting on each proposition fails. It forces you toward either structured path-dependent methods (e.g., "principles first, then cases") or complex premise-based approaches (voting only on "core" principles and deriving cases). Both have downsides: Path-dependence risks agenda manipulation, while premise-based methods require agreeing upfront on which propositions are "premises," which is often contentious itself. Consistency is the guardian of rationality here, but it exacts a high procedural cost.

  This framework should ground your group’s debate—focus on where to bend when core constraints collide, because they will. Good luck navigating the trade-offs; it’s the essence of institutional design under logical constraints.
