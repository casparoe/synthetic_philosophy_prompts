answer: |-
  Here’s a focused, actionable proposal based on your core insight. It leans into the contested nature of the debate and the challenge institutional entities pose.

  **Thesis Proposal: The Persistence Problem for Institutional Entities: Challenging Endurantism and Perdurantism**

  **1. Precise Question:**  
  Can the dominant metaphysical frameworks of persistence – endurantism (wholly present at each time) and perdurantism (persisting as a series of temporal parts) – adequately account for the identity and persistence conditions of *institutional entities* (e.g., marriages, corporations, sports teams, bands)? If not, what does their failure reveal about the assumptions and limitations of these frameworks, particularly regarding the role of social recognition, collective intentionality, and functional roles?

  **2. Why the Standard Debate Leaves It Open:**  
  The endurantism/perdurantism debate is largely fought on terrain favorable to abstraction or physicalism. Material objects (statues, lumps) offer intuitions about spatial coincidence and change. Persons raise questions of psychological continuity. Events are often analyzed as sequences. Crucially, **both frameworks typically presuppose an entity whose existence and boundaries are (at least in principle) mind-independent or grounded in fundamental physical/biological facts.**

  Institutional entities fundamentally disrupt this presupposition. Their existence, identity, and persistence are *constitutively dependent* on:
  *   **Collective Recognition/Intentionality:** They exist only because a community (participants and often a wider society) collectively *takes them* to exist and assigns them status and roles (Searle, Gilbert).
  *   **Functional Roles & Norms:** Their identity is tied to fulfilling specific purposes governed by rules (e.g., marriage as a legally/socially recognized union with obligations; a corporation as a legal person with specific capacities).
  *   **Dynamic Constitution:** Their "parts" are not merely physical bodies or temporal slices, but include commitments, obligations, legal statuses, reputations, and shared histories – elements inherently tied to social practices and subject to reinterpretation.

  **Neither endurantism nor perdurantism was developed to handle entities whose very being is socially constituted and maintained through ongoing practice.** Applying them directly risks being a Procrustean bed, forcing institutional realities into categories designed for different ontological kinds. The core unsettled question is: **Does the social constitution of institutional entities render the endurantism/perdurantism dichotomy inapplicable, or merely require a radical reinterpretation of one framework?**

  **3. What You Will Do (Month-by-Month):**

  *   **Months 1-3: Groundwork & Framing:**
      *   Deep dive into core persistence literature (Lewis, Sider, van Inwagen, Merricks) focusing on their core arguments *and* unstated ontological commitments (e.g., mind-independence, physical grounding).
      *   Survey social ontology (Searle, Gilbert, Epstein, Hindriks, Guala) focusing on constitution, status functions, and the role of collective intentionality in creating/maintaining institutional entities.
      *   Precisely define "institutional entity" for the thesis scope and select 2-3 paradigmatic, contrasting case studies (e.g., Marriage, Corporation, perhaps a Reforming Political Party or Long-Running Band with member changes).
      *   **Deliverable:** Detailed literature review and theoretical framework document.

  *   **Months 4-6: Case Study Analysis & Problem Identification:**
      *   Analyze each case study in detail:
          *   What are the *actual* conditions for its persistence? (e.g., legal continuity for corps; mutual commitment + recognition for marriage?; contractual agreements + fan recognition for band?)
          *   How do changes occur? (e.g., amendment of corporate charter, shifts in marital dynamics, band member replacement, team relocation/renaming).
          *   Precisely identify points where applying endurantism or perdurantism leads to counter-intuitive results, paradoxes, or requires ignoring constitutive social factors. Does "wholly present" make sense for a marriage undergoing therapy? Are a corporation's "temporal parts" its quarterly reports or its changing CEO tenures? Where do the social practices *fit*?
      *   **Deliverable:** Analysis reports for each case study, highlighting specific points of tension with persistence theories.

  *   **Months 7-9: Theoretical Confrontation & Gap Analysis:**
      *   Systematically confront endurantism and perdurantism with the findings from Months 4-6.
      *   Can either framework be salvaged? If so, at what cost? (e.g., radically redefining "part", "whole", "location"; incorporating social facts as primitive; accepting massive vagueness).
      *   Argue rigorously that the core challenge isn't just *which* framework fits best, but whether *either* is appropriate for entities whose persistence is constitutively dependent on dynamic social practices and recognition.
      *   Articulate the specific assumptions shared by both frameworks that institutional entities expose as problematic (e.g., mind-independence, static essence, location solely in spacetime, analyzability without reference to collective intentionality).
      *   **Deliverable:** Draft chapters presenting the core argument: the inadequacy of both frameworks and the exposed assumptions.

  *   **Months 10-12: Synthesis, Conclusion & Writing:**
      *   Synthesize findings: What *does* the persistence of institutional entities look like if not via endurantism or perdurantism? (Point towards processual, practice-based, or status-functional accounts *without* needing to fully develop a new theory).
      *   Clearly state the implications for the broader persistence debate and social ontology.
      *   Finalize thesis writing, introduction, and conclusion.
      *   **Deliverable:** Complete thesis draft.

  **4. What a Result Looks Like (Success):**
  *   A compelling demonstration that institutional entities pose a *unique and fundamental challenge* to standard persistence frameworks, not merely a novel application.
  *   A clear articulation of *why* these cases are harder than standard ones: the constitutive role of social recognition/practice breaks core assumptions of the debate.
  *   A strong argument that the persistence of institutional entities cannot be adequately captured *without* placing collective intentionality, functional roles, and social norms at the center of the analysis, suggesting a need for a distinct ontological category or a radical rethinking of persistence itself.
  *   Identifying specific shared presuppositions of endurantism/perdurantism (e.g., about fundamentality, location, essence) that institutional entities render untenable for this domain.
  *   The result is *not* proving one persistence theory "wins" for institutions, but showing why the *dichotomy itself* is likely the wrong tool for this job.

  **5. What Counts as Failure:**
  *   **Superficial Application:** Merely describing how endurantism/perdurantism *could* be applied to institutions without rigorously demonstrating the unique challenges and costs involved, or showing how social constitution fundamentally disrupts the frameworks.
  *   **Ignoring the Core Challenge:** Failing to deeply engage with the constitutive role of social practices and collective intentionality, treating institutions as merely "complex material objects" or abstract sets.
  *   **Settling Too Easily:** Concluding that institutions "just perdure" or "just endure" without grappling with the significant modifications or conceptual violence this requires to the original theories or to our understanding of the institutions themselves.
  *   **Not Identifying the Shared Assumption:** Failing to pinpoint the specific presuppositions of the standard debate that institutional entities expose as inadequate or inapplicable.
  *   **Lack of Critical Engagement:** Presenting the social ontology literature uncritically without using it to *challenge* the metaphysical persistence frameworks head-on.
  *   **Vagueness on Stakes:** Not clearly articulating *why* this challenge matters for metaphysics or social ontology beyond being a quirky example.

  **Settled vs. Contested:**
  *   **Settled (Among Relevant Experts):** Institutional entities *are* socially constructed/constituted. Their existence depends on collective intentionality, assignment of status functions, and participation in practices (This is the core consensus in contemporary social ontology). Endurantism and Perdurantism are the dominant, competing frameworks for analyzing persistence in metaphysics.
  *   **Genuinely Contested (Your Battlefield):**
      *   **Can persistence frameworks handle social constitution?** Is social constitution just a complex feature *within* a perduring/enduring entity, or does it fundamentally change the *kind* of persistence at stake? This is wide open.
      *   **What are the *exact* persistence conditions for specific institutional kinds?** (e.g., When does a marriage *really* end? When is a corporation the same entity after a total asset sale and rebranding?).
      *   **Do institutional entities *have* temporal parts in any meaningful sense?** If so, what *are* they? (Legal filings? Moments of recognition? CEO tenures?).
      *   **Is "wholly present" coherent for dynamic social practices?** Can a marriage undergoing significant change be "wholly present" at a single time, given its identity depends on its history and future trajectory?
      *   **Does this expose a fatal flaw in the debate's scope?** This is your core hypothesis – *highly* contested and potentially significant.

  This proposal leverages your "half-baked" hunch into a sharp, critical intervention at the intersection of metaphysics and social ontology, with a clear plan and defined stakes for success/failure.
