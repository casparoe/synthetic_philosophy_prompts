prompt: |-
  I'm a second-year law student in a jurisprudence seminar, and my paper is on the legitimacy of judicial review. I don't want to write another essay on whether it is democratic; I want the prior specification — what would a theory of judicial review have to deliver in order to count as adequate for a particular purpose? My purpose is narrow and practical: a theory good enough to guide a judge who is deciding whether to refuse to apply a statute on constitutional grounds, and good enough to guide a legislator deciding how much weight to give a court's constitutional ruling. Give me the desiderata list — the phenomena the theory must explain, the cases it must get right, the distinctions it must respect, and the institutional facts it must not contradict — with the consideration behind each requirement, and say explicitly which requirements are non-negotiable and which are merely the preferences of one camp in the existing dispute.

  To keep the list concrete, it has to cover at least the following, and for each I want you to say what exactly it demands of a theory. First, a theory may not assume that the constitution authorises courts to have the last word, since that is the very thing in dispute. Second, the countermajoritarian objection, and with it the question of why judicial error should be preferred to legislative error, if it should — which forces the theory to say something about the direction in which each institution is likely to err. Third, the remedial question: refusing to enforce a statute, suspending its operation, declaring it incompatible while leaving it in force, and reading it down are different acts with different justifications, and a theory that licenses one need not license the others; the same goes for the norm of avoiding constitutional questions and for severability, which seem to trade off against any duty the court has to declare the law rather than dodge it. Fourth, the fact that the same disagreement is settled differently in different institutional settings, including arrangements in which the legislature can override a rights ruling by ordinary majority and arrangements in which the court's only remedy is a formal declaration addressed to the legislature. Fifth, the recurrence problem: what the theory says when a legislature re-enacts substantially the same statute after a court has struck it down, or when a lower court is convinced the highest court got a constitutional question wrong. Sixth, the distinction between provisions that protect individuals against the state and provisions that allocate power among organs of government, and whether the justification for judicial enforcement is the same in both. Then tell me which requirements do the most work in excluding the main candidate positions — originalist accounts, living-constitutionalist accounts, the view that courts should police only the openness of the political process, the view that each branch should construe the constitution for itself, and the various arrangements in which courts lack the power to invalidate legislation outright, sometimes called weak-form review — and, above all, whether any pair or subset of the requirements is jointly unsatisfiable, and what that shows. I would rather the list itself be the result than a scorecard, but a short closing paragraph on how the main positions fare would help me see which requirements are doing the work. No citations or reading list, please; I will supply those myself.
reasoning: |-
  Okay, the user is a second-year law student working on a jurisprudence seminar paper about the legitimacy of judicial review. They want to avoid rehashing the democratic debate and instead focus on the prior specification: what makes a theory of judicial review adequate for guiding judges and legislators? Their needs are very specific—they want a list of desiderata that a theory must meet, covering several key issues they've outlined.

  First, I need to understand the core request. The user wants a framework to evaluate theories of judicial review based on practical guidance for judges and legislators. They listed six concrete areas the theory must address: not assuming judicial supremacy, handling the countermajoritarian difficulty, differentiating remedial actions, accounting for different institutional settings, addressing recurrence (re-enactment or lower court dissent), and distinguishing rights from structural provisions. They also want to know which requirements are non-negotiable versus contested, and how these requirements challenge existing positions like originalism or weak-form review.

  The user’s deeper needs seem to be about clarity and applicability. As a law student, they’re likely overwhelmed by abstract debates and want a structured way to cut through the noise. Their focus on "prior specification" suggests they’re looking for foundational criteria before diving into existing theories. They might also be hinting at frustration with polarized academic discourse—hence the request to avoid the democracy debate and instead focus on what a theory *must* do to be viable.  

  Now, breaking down the six areas:  
  1. **No presupposing judicial supremacy**: This is non-negotiable because assuming courts have the final say begs the question. Theories must justify judicial review without circularity.  
  2. **Countermajoritarian problem**: Requires addressing why judicial error is preferable to legislative error, including institutional biases. Non-negotiable, as it’s central to legitimacy.  
  3. **Remedial distinctions**: Must explain why different judicial tools (striking down vs. declaration of incompatibility) are justified in different contexts. Contested but essential for practical guidance.  
  4. **Institutional diversity**: Theories must account for systems like legislative overrides (e.g., Canada’s notwithstanding clause) or declaratory models (e.g., UK). Non-negotiable to avoid parochialism.  
  5. **Recurrence issues**: How judges handle re-enacted laws or lower courts defying higher courts’ rulings. Tests a theory’s coherence and authority. Non-negotiable for stability.  
  6. **Rights vs. structural provisions**: Justification for judicial review may differ between individual rights and inter-branch power disputes. Contested but necessary for nuance.  

  Key pitfalls:  
  - The countermajoritarian requirement (#2) and institutional diversity (#4) might conflict. For example, theories emphasizing legislative deference (like process theory) struggle with strong-form review, while originalism might clash with weak-form systems.  
  - Remedial flexibility (#3) could undermine the duty to declare the law (#3’s avoidance tension).  

  For evaluating existing positions:  
  - **Originalism**: Strong on #1 and #6 but weak on #4 (diversity) and #5 (recurrence if societal values shift).  
  - **Living constitutionalism**: Handles #4 and #5 better but struggles with #2 (countermajoritarian concerns) and #6 (structural provisions).  
  - **Process theory (Ely)**: Excels at #2 but fails #6 (rights vs. structure) and #4 (weak on remedial tools).  
  - **Departmentalism**: Rejects #1 but flunks #5 (recurrence leads to chaos) and #4 (ignores institutional diversity).  
  - **Weak-form review**: Nails #4 and #3 but risks incoherence on #2 (if legislatures defer excessively) and #5 (re-enactment challenges).  

  The user’s unspoken need might be for a "litmus test" to quickly disqualify theories that can’t handle real-world complexity. Highlighting joint unsatisfiability (e.g., strict finality vs. legislative override) shows where theories must compromise. The closing paragraph should emphasize that no theory aces all desiderata—trade-offs are inevitable, and the best fit depends on institutional context.  

  Finally, I’ll keep it concrete, avoid citations, and use plain terms like "non-negotiable" vs. "contested" to match their framing. The goal is to give them a functional toolkit, not a survey of literature.
answer: |-
  Here is a desiderata list for a theory of judicial review focused on guiding judges and legislators, derived from your specified concerns. Requirements are categorized as **Non-Negotiable** (essential for any minimally adequate theory) or **Contested** (reflects substantive disagreements between existing camps).

  ---

  ### **Desiderata for a Theory of Judicial Review**
  1. **Non-Circular Justification for Judicial Authority**  
     - **Demand**: The theory must not presuppose that the Constitution grants courts final interpretive authority. It must independently justify *why courts specifically* are empowered (or obligated) to refuse application of statutes.  
     - **Why Non-Negotiable**: If the theory assumes judicial supremacy as a premise, it cannot resolve the core legitimacy dispute.  
     - **Consideration**: Addresses whether judicial review is inherent or requires explicit textual/democratic warrant.

  2. **Resolution of the Countermajoritarian Difficulty**  
     - **Demand**: The theory must explain (a) why judicial error in constitutional interpretation is preferable to legislative error (or vice versa), and (b) the *systematic tendencies* of each branch (e.g., legislatures may undervalue minority rights; courts may lack democratic responsiveness).  
     - **Why Non-Negotiable**: Legitimacy hinges on justifying why unelected judges may override elected bodies.  
     - **Consideration**: Forces the theory to specify comparative institutional competencies and biases.

  3. **Remedial Granularity**  
     - **Demand**: The theory must distinguish between remedies (striking down, severance, reading down, declaratory judgments, suspended invalidity) and specify when each is justified. It must also reconcile judicial duty ("say what the law is") with avoidance doctrines (e.g., constitutional avoidance, non-justiciability).  
     - **Why Contested**: Different theories prioritize finality vs. legislative dialogue (e.g., strong-form vs. weak-form review).  
     - **Consideration**: Remedies entail distinct intrusions into democracy; a blanket "invalidation power" is incoherent.

  4. **Institutional Pluralism Compatibility**  
     - **Demand**: The theory must explain why judicial review’s legitimacy varies across systems (e.g., legislative override clauses, §33 notwithstanding clauses, UK’s declaratory model). It cannot assume one model (e.g., U.S.-style strong review) as universal.  
     - **Why Non-Negotiable**: Real-world constitutional designs differ radically; a theory ignoring this is empirically inadequate.  
     - **Consideration**: Tests whether the theory can accommodate legislative/judicial dialogue or demands finality.

  5. **Recurrence and Defiance Management**  
     - **Demand**: The theory must guide responses to (a) legislative re-enactment of struck-down statutes, and (b) lower courts defying higher courts’ constitutional rulings. It must address whether stare decisis binds non-judicial actors.  
     - **Why Non-Negotiable**: Stability and coordination require clear rules for institutional conflict.  
     - **Consideration**: Exposes whether the theory prioritizes settlement of norms or ongoing dialogue.

  6. **Distinction Between Rights and Structural Provisions**  
     - **Demand**: The theory must justify whether judicial enforcement applies equally to (a) individual-rights provisions and (b) inter-branch power allocations (e.g., federalism, separation of powers). If not, it must explain the difference.  
     - **Why Contested**: Some theories (e.g., process-based) limit courts to rights; others (e.g., originalism) treat all provisions as equally enforceable.  
     - **Consideration**: Rights often involve countermajoritarian tension; structural disputes may be "political questions."

  ---

  ### **Which Requirements Exclude Major Theories?**
  - **Originalism**: Struggles with **#4** (incompatible with legislative override systems) and **#5** (re-enactment may signify democratic rejection of original meaning).  
  - **Living Constitutionalism**: Challenged by **#2** (aggravates countermajoritarian concerns) and **#5** (undermines stability if meaning shifts frequently).  
  - **Process Theory (Ely)**: Fails **#6** (cannot justify judicial review of structural provisions) and **#3** (offers no guidance on remedies beyond policing democracy).  
  - **Departmentalism (each branch interprets)**: Violates **#1** (assumes coordinate authority without justification) and **#5** (leads to chaos in recurrence scenarios).  
  - **Weak-Form Review**: Conflicts with **#3** (if remedies are only declaratory) and **#2** (if legislatures routinely ignore rulings, judicial error becomes irrelevant).  

  ---

  ### **Joint Unsatisfiability & Key Tensions**
  - **Tension 1: Finality vs. Flexibility (#4 vs. #5)**  
    Systems allowing legislative overrides (#4) undermine judicial finality, complicating recurrence scenarios (#5). A theory cannot maximize both legislative responsiveness *and* judicial supremacy.  
  - **Tension 2: Duty to Declare vs. Avoidance (#3)**  
    A strong duty to resolve constitutional questions clashes with doctrines of avoidance or deference. Theories must choose which value prevails.  
  - **Tension 3: Rights vs. Structure (#6) and Countermajoritarianism (#2)**  
    Justifying judicial review of structural provisions (e.g., federalism) is harder under #2, as these disputes lack clear countermajoritarian stakes.  

  ---

  ### **Conclusion: How Requirements Shape the Field**
  The non-negotiables (#1, #2, #4, #5) exclude theories that ignore institutional pluralism or evade the countermajoritarian dilemma. Contested demands (#3, #6) then separate the remaining camps: **Originalism** and **Living Constitutionalism** falter on institutional diversity (#4) and recurrence (#5); **Weak-Form Review** struggles with remedial coherence (#3); **Departmentalism** collapses on recurrence (#5). No theory satisfies all desiderata perfectly—each sacrifices one demand to prioritize another (e.g., weak-form review trades finality (#5) for dialogue (#4)). The "best" theory depends on which trade-offs align with a system’s democratic and constitutional values.
