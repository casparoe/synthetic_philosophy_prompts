        "chosen_reference_class": null,
        "resulting_distribution": null,
        "what_would_change_the_answer": "Physical context for chord generation (e.g., 'raindrops on disc' → midpoint).",
        "residual_judgment_call": "Choose parametrization and defend based on real-world mechanism."
      },
      {
        "case_name": "Resistor",
        "quantity": "resistance",
        "candidate_reference_classes": ["resistance", "conductance"],
        "indifference_applies": "yes",
        "chosen_reference_class": "resistance",
        "resulting_distribution": "Uniform(100, 200) ohms",
        "what_would_change_the_answer": "If manufacturing controlled conductance (e.g., electrolyte solution).",
        "residual_judgment_call": null
      },
      {
        "case_name": "Cube volume",
        "quantity": "volume",
        "candidate_reference_classes": ["side_length", "volume"],
        "indifference_applies": "no",
        "chosen_reference_class": "side_length",
        "resulting_distribution": "f(V) = 1/(3 * V^{2/3}) for V in [1, 8]",
        "what_would_change_the_answer": "Client specifying uniform volume instead of side length.",
        "residual_judgment_call": null
      },
      {
        "case_name": "Failure time",
        "quantity": "time_to_failure",
        "candidate_reference_classes": ["time", "log_time", "hazard_rate"],
        "indifference_applies": "no",
        "chosen_reference_class": null,
        "resulting_distribution": null,
        "what_would_change_the_answer": "Lifetime data or known failure mechanism (e.g., wear-out → Weibull).",
        "residual_judgment_call": "Choose model (e.g., exponential) and accept subjectivity."
      }
    ]
  }
  ```  

  **Key Takeaways**:  
  - PoI works **only** when a unique natural parametrization exists (e.g., resistor specs).  
  - Bertrand-type paradoxes **demand context** for parametrization.  
  - Unbounded quantities **require data or modeling choices**.  
  - Always document the "why" behind your chosen reference class.
