answer: |-
  ### Decision Procedure for Applying the Principle of Indifference  
  **Goal**: Determine when and how to assign a uniform distribution to an unknown physical quantity without introducing hidden assumptions.  
  **Time**: ≈10 minutes. Requires only the problem statement and basic physical/logical reasoning.  
  **Output**: Clear distribution assignment, explicit flags for ambiguity, or a directive to gather more data.  

  #### Step-by-Step Procedure  
  1. **Clarify the Quantity and Known Constraints**  
     - Ask: *What is the exact physical quantity?* (e.g., resistance, volume, chord length).  
     - Ask: *What is known?* (e.g., range, symmetries, units, invariance under transformations).  
     - Ask: *How is it measured/controlled?* (e.g., manufacturing process, experimental setup).  
     - **Stop if**: No constraints exist (e.g., unbounded range). PoI fails.  

  2. **Identify Natural Parametrizations**  
     - List all physically reasonable ways to describe the quantity (e.g., resistance vs. conductance).  
     - Ask: *Is there a symmetry or invariance that privileges one parametrization?* (e.g., translation-invariance favors linear scales; rotation-invariance favors radial coordinates).  
     - **Stop if**: Multiple parametrizations are equally valid but yield conflicting distributions. PoI is inconsistent.  

  3. **Resolve Parametrization Conflicts**  
     - If conflicts arise (e.g., resistance vs. conductance):  
       - Check for a "natural" scale defined by the **measurement/control mechanism** (e.g., manufacturing specs favor resistance over conductance).  
       - Check for **additive invariance** (e.g., if intervals add linearly, use linear scale).  
     - If unresolved: **Reject PoI**. Document all candidate parametrizations and require additional data or a defensible choice.  

  4. **Assign the Distribution**  
     - Apply uniformity to the chosen parametrization over the constrained range.  
     - If transforming to another quantity (e.g., side length → volume), propagate via Jacobian (no reapplying PoI).  

  5. **Flag Residual Ambiguity**  
     - Explicitly note:  
       - Choices made (e.g., "used linear scale due to manufacturing specs").  
       - Unresolved conflicts (e.g., "PoI fails; pick parametrization or collect data").  

  ---

  ### Case Studies  

  #### Case 1: Bertrand’s Chord Problem  
  **Quantity**: Chord length in a unit circle.  
  **Known**: Must be between 0 and 2.  
  **Candidate Parametrizations**:  
  1. Random endpoints (uniform along circumference).  
  2. Random radial distance (uniform distance from center).  
  3. Random midpoint (uniform in area).  

  **Procedure Output**:  
  - **Step 1**: All parametrizations are physically reasonable (rotational symmetry for endpoints; radial symmetry for distance/midpoint).  
  - **Step 2**: Conflict! Uniform endpoints → nonuniform chord lengths; uniform radial distance → different distribution.  
  - **Step 3**: No natural scale privileges one method. Measurement mechanism undefined.  
  - **Indifference applies?**: Only if a specific parametrization is externally justified (e.g., "chords defined by raindrops" → midpoint method).  
  - **Result**: PoI **fails** without context. Requires specification of chord-generation method.  
  - **Residual Judgment**: Choice of parametrization must be defended (e.g., "midpoint method assumes isotropic rain").  

  ---

  #### Case 2: Resistor (100–200 Ω)  
  **Quantity**: Resistance (*R*) or conductance (*G* = 1/*R*).  
  **Known**: *R* ∈ [100, 200] Ω → *G* ∈ [0.005, 0.01] S.  
  **Candidate Parametrizations**: Uniform *R* vs. uniform *G*.  

  **Procedure Output**:  
  - **Step 1**: Spec is given in ohms; resistors are typically manufactured by controlling resistance (e.g., carbon-film deposition).  
  - **Step 2**: Conflict! Uniform *R* (density *f*(*R*) = 1/100) → nonuniform *G* (density *f*(*G*) ∝ 1/*G*²).  
  - **Step 3**: Manufacturing process privileges *R* (additive tolerance in ohms).  
  - **Indifference applies?**: **Yes** (to resistance).  
  - **Result**: Uniform *R* on [100, 200] Ω.  
  - **What would change?**: If specs were in siemens (e.g., conductivity-tuned resistor), use uniform *G*.  
  - **Residual Judgment**: None. Manufacturing context breaks symmetry.  

  ---

  #### Case 3: Cube Side Length → Volume  
  **Quantity**: Volume (*V* = *L*³).  
  **Known**: Side length *L* ~ Uniform[1, 2] m (client-specified).  
  **Candidate Parametrizations**: Uniform *L* vs. uniform *V*.  

  **Procedure Output**:  
  - **Step 1**: Client explicitly assigned uniformity to *L*. Volume is derived.  
  - **Step 2**: No conflict! PoI is **not reapplied** to *V*.  
  - **Result**: Transform via Jacobian:  
    *f*(*V*) = *f*(*L*)/|*dV*/*dL*| = (1/1) / (3*L*²) = 1/(3*V*²ᐟ³) for *V* ∈ [1, 8] m³.  
  - **Indifference applies?**: **No** (for volume). Client’s choice for *L* is fixed.  
  - **What would change?**: If client demanded uniform *V*, distribution for *L* would differ.  
  - **Residual Judgment**: None. Mechanical transformation.  

  ---

  #### Case 4: Unbounded Failure Time  
  **Quantity**: Time to failure (*T*) of a component.  
  **Known**: *T* > 0; no upper bound or hazard rate.  
  **Candidate Parametrizations**: Uniform *T* (improper), uniform log(*T*), or hazard rate.  

  **Procedure Output**:  
  - **Step 1**: Unbounded range → uniform *T* invalid (infinite density).  
  - **Step 2**: Conflict! Uniform *T* vs. uniform log(*T*) (scale-invariant) vs. constant hazard (memoryless).  
  - **Step 3**: No natural parametrization. Manufacturing/data absent.  
  - **Indifference applies?**: **No**. PoI fails catastrophically.  
  - **Result**: **Reject PoI**. Must:  
    (a) Collect data (e.g., accelerated life testing), or  
    (b) Defend a parametrization (e.g., "assume constant hazard → exponential distribution").  
  - **Residual Judgment**: Choice of model (e.g., exponential vs. Weibull) is subjective. Client may hate this.  

  ---

  ### Structured Summary (JSON)  
  ```json
  {
    "procedure_limits": "Cannot resolve unconstrained unbounded quantities or symmetries without physical context. Cannot eliminate judgment when multiple valid parametrizations exist.",
    "cases": [
      {
        "case_name": "Bertrand chord",
