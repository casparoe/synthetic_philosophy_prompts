prompt: |-
  I run a small reliability lab — we do failure analysis and warranty math for a couple of hardware clients — and I keep banging into the same wall. Someone hands me a physical quantity we know almost nothing about, maybe just a range, maybe just some symmetry, and I have to slap a distribution on it to do the risk numbers. My gut always says "fine, it's equally likely to be anywhere in that range," which I know is the principle of indifference, and I also know it's a minefield, because of that old Bertrand chord business where you get three different answers depending on how you parametrize the random chord. Half my colleagues think indifference is naive hand-waving and half treat it as the obvious default, and neither reaction helps me at my desk on a Tuesday.

  What I want is a decision procedure I can actually run — ten minutes, no stats PhD in the room, on the back of a spec sheet. It should tell me, in order, the questions to ask about a quantity, and at each step what counts as a sufficient answer, so that I can decide (a) whether indifference is even the right tool here, and (b) if it is, which reference class or parametrization I'm allowed to fix, so that I'm not just smuggling a modeling assumption in and calling it a principle. I specifically don't want to be told "just use a noninformative prior like Jeffreys" and left there, because half the time I don't even know the model family yet, and I've noticed that the moment someone names a parameter they've already picked a reference class without saying so. When the procedure can't pin down an answer, I want it to say so plainly and tell me what I'd have to go collect or decide instead — I'd rather get a "you have to make a call and own it" than a fake number.

  Please write the procedure, with the hard cases it has to survive and the spots where judgment can't be eliminated marked as such. Then run it on four cases and don't spare my feelings if it kills the easy answer I was hoping for:

  1. The chord problem itself, in its three standard readings (random endpoints, random distance from center, random midpoint), so I can see the procedure detect the disagreement rather than paper over it.
  2. A resistor spec'd only as "somewhere between 100 and 200 ohms," where I can parametrize in resistance or in conductance and they don't agree.
  3. A cube where the client gives me a uniform range on the side length and wants the distribution of the volume.
  4. A case of your choosing where the honest verdict is that indifference doesn't apply and I need to go get data or just pick a reference class and defend it — bonus points if it's a case where the client will hate that answer.

  Give me the writeup as prose, then finish with a structured summary as a JSON object so I can drop it in our notes. Schema: an object with a field "cases" (an array), where each element has "case_name", "quantity", "candidate_reference_classes" (list), "indifference_applies" (one of yes / no / only_if), "chosen_reference_class", "resulting_distribution", "what_would_change_the_answer", and "residual_judgment_call" (a short phrase or one line, or null). Plus a top-level field "procedure_limits" with one or two sentences on what the whole procedure can't do.
reasoning: |-
  We are designing a decision procedure to determine when and how to apply the principle of indifference (PoI) for assigning a probability distribution to an unknown physical quantity. The procedure must be pragmatic, executable in about ten minutes without advanced stats, and must clearly indicate when PoI is applicable and which reference class or parametrization to use. It should also flag cases where PoI cannot be applied without additional data or arbitrary choices.

  The core challenge with PoI is that it depends on the choice of the variable (the "reference class" or "parametrization") over which we are indifferent. Different choices can lead to different distributions (as in Bertrand's paradox). Therefore, the procedure must guide the user to identify a natural or canonical reference class based on the available information.

  ### Decision Procedure

  1. **Clarify the Quantity and Its Context**:
     - Ask: *What is the physical quantity?* (e.g., resistance, length, volume, chord length, etc.)
     - Ask: *What do we know about it?* (e.g., range, symmetries, physical constraints, units, how it is measured or manufactured, any invariance properties?)
     - Ask: *How will this distribution be used?* (e.g., in a risk calculation that might be linear in the quantity? or in a nonlinear function?)

  2. **Identify Natural Symmetries or Invariance**:
     - Look for symmetries in the problem (e.g., translation invariance, scale invariance, rotational invariance). If there are symmetries, they can guide the choice of the reference class.
     - If the quantity is defined on an interval and there is no reason to prefer one point over another, then a uniform distribution over that interval might be natural. But note: if the interval is in a space that has a natural metric (like length) then uniform in that metric is often chosen. However, if the quantity is positive and might be better thought of on a logarithmic scale (like scale parameters), then uniform in log might be more natural.

  3. **Check for Multiple Parametrizations**:
     - Consider other ways to describe the same quantity (e.g., resistance vs. conductance, side length vs. volume). If there are multiple, equally valid parametrizations, then PoI applied to each would yield different distributions. This is a red flag.
     - Ask: *Is there a physical reason to prefer one parametrization over another?* (e.g., the manufacturing process might control resistance directly, not conductance, so resistance is the natural variable.)

  4. **Test for Consistency**:
     - If there are multiple parametrizations and no clear physical reason to choose one, then PoI leads to inconsistency. In this case, the procedure should reject PoI and require either:
       - Additional information (e.g., data, or a physical argument that breaks the symmetry) OR
       - An explicit choice of parametrization (which must then be defended and documented).

  5. **When PoI is Not Applicable**:
     - If the quantity has a known natural scale (e.g., it's a count, or it's known to be normally distributed) then PoI might not be the right tool.
     - If the quantity is defined on an unbounded range, then a uniform distribution is improper (infinite total probability) and PoI cannot be applied naively.

  6. **Output**:
     - If PoI is applicable and a unique reference class is identified, assign a uniform distribution over that reference class in the natural metric (e.g., if the reference class is an interval of real numbers, use uniform in the linear scale unless there is a reason for log).
     - If PoI is applicable but requires a choice of reference class, document the choice and the reason.
     - If PoI is not applicable, state what information is missing and what needs to be collected or decided.

  ### Hard Cases

  The procedure must survive:

  - **Bertrand's chord paradox**: Three ways to define a "random chord" lead to three different distributions for the chord length. The procedure should detect that without a preferred parametrization, PoI leads to inconsistency.

  - **Resistor in resistance vs. conductance**: Uniform in resistance (R) vs. uniform in conductance (G=1/R) lead to different distributions. The procedure should check for a natural variable (e.g., how the resistor is specified and controlled in manufacturing).

  - **Cube side length to volume**: If the side length is uniform, then the volume is not uniform. The procedure should note that if the client specifies uniform on the side length, then that is the reference class, and the volume distribution must be derived from it (by transformation). But if the client had specified uniform on volume, then we would have a different distribution for the side length. So the key is: what is the reference class that the client's specification directly applies to?

  - **A case where indifference doesn't apply**: For example, the failure time of a component. Without any information, we might be tempted to use a uniform distribution over time, but failure times are often exponentially distributed (if constant hazard) and the range is unbounded. Also, the hazard rate might be unknown. PoI is problematic here.

  ### Running the Cases

  #### Case 1: Bertrand's Chord Problem
  We are to find the distribution of the length of a random chord in a circle of radius R. The three standard methods:

     a. **Random endpoints**: Choose two random points on the circle and connect them.
     b. **Random distance from center**: Choose a random distance from the center (uniform in [0,R]) and then a random direction.
     c. **Random midpoint**: Choose a random point inside the circle (uniform in area) as the midpoint.

  **Procedure**:

  1. **Clarify**: The physical quantity is the chord length. We know it must be between 0 and 2R. We have three different ways to generate the chord, each with a symmetry (rotational, translational, etc.) but they are different symmetries.

  2. **Symmetries**: 
     - Method (a) has rotational symmetry at the endpoints.
     - Method (b) has rotational symmetry and a linear symmetry in the radial distance.
     - Method (c) has translational symmetry in the plane (uniform over the disk).

  3. **Multiple Parametrizations**: The problem is defined in three different ways. Each method uses a different reference class (endpoints, radial distance, midpoint). 

  4. **Check for Physical Reason**: Without additional context (e.g., how the chord is actually being chosen in the real world), there is no reason to prefer one reference class over the others.

  5. **Consistency Test**: The three methods yield three different distributions. Therefore, PoI cannot be applied without specifying the method of generation. The procedure must reject PoI as leading to inconsistency.

  6. **Output**: PoI is not applicable without specifying the method of generating the chord. The user must choose a method (and thus a reference class) based on the physical context or collect data on how chords are actually generated.

  **Result for Case 1**: 
     - Indifference applies only if we fix a specific method (reference class). Without that, we cannot proceed. The procedure flags the inconsistency.

  #### Case 2: Resistor between 100 and 200 ohms
  We have a resistor with resistance R known only to be in [100, 200] ohms. We can parametrize by resistance R or by conductance G = 1/R (in siemens), which would be in [0.005, 0.01] S.

  **Procedure**:

  1. **Clarify**: The physical quantity is resistance (or conductance). We know the range for R: [100,200] ohms. The manufacturing process likely controls the resistance (e.g., by the material and geometry) and the specification is given in resistance.

  2. **Symmetries**: The range is a bounded interval. But is there a natural scale? Resistance is a linear quantity in many circuit equations (like Ohm's law: V=IR), but conductance is linear in other equations (I=GV). However, the specification is given in ohms, which suggests resistance is the primary variable.

  3. **Multiple Parametrizations**: We can use R or G. If we apply PoI to R, we get uniform R on [100,200]. If to G, uniform G on [0.005,0.01]. These are different (because dG = -dR/R², so the density of G is not uniform if R is uniform).

  4. **Check for Physical Reason**: The key is: how is the resistor manufactured? Typically, resistors are made to a resistance value (e.g., by cutting a wire to a certain length, or by adding carbon to achieve a certain resistivity). The tolerance is usually specified in ohms. Therefore, resistance is the natural reference class.

  5. **Consistency Test**: Since the manufacturing and specification are in resistance, we choose R as the reference class.

  6. **Output**: Apply PoI to R: uniform on [100,200] ohms. The distribution of G is then derived by transformation: f_G(g) = f_R(1/g) * |dR/dG| = (1) * (1/g²) for g in [0.005,0.01] (and 0 elsewhere), since the density of R is 1/100 (because the interval length is 100). Actually, the density of R is constant at 1/100 over [100,200]. Then for G=1/R, the density is (1/100) * (1/g²) for g in [0.005,0.01]. This is the same as (1/100) * R², but expressed in terms of g.

  **Result for Case 2**: 
     - Indifference applies to resistance. The reference class is resistance (R). The distribution is uniform on [100,200] ohms.

  #### Case 3: Cube Side Length to Volume
  A cube has side length L specified to be uniformly distributed between a and b (say 1 and 2 meters). The client wants the distribution of the volume V = L³.

  **Procedure**:

  1. **Clarify**: The quantity of interest is volume V. We are given that L is uniform on [a,b]. This is a transformation problem, not a direct application of PoI to V.

  2. **Symmetries**: The client has already specified the distribution for L. We are not asked to assign a distribution to L by PoI; it is given.

  3. **Multiple Parametrizations**: We are given L, and V is a function of L. We are not considering multiple parametrizations for the same unknown; we have one known (L) and we derive V.

  4. **Check for Physical Reason**: The client's specification is on L. There is no ambiguity because the reference class is fixed: L.

  5. **Consistency Test**: Not needed because we are not applying PoI to V. We are transforming the given distribution of L to V.

  6. **Output**: Since L ~ Uniform(a,b), then the cumulative distribution function (CDF) of V is F_V(v) = P(V<=v) = P(L³<=v) = P(L<=v^{1/3}) = F_L(v^{1/3]). The density of V is then f_V(v) = f_L(v^{1/3}) * |dL/dV| = [1/(b-a)] * (1/(3 v^{2/3})) for v in [a³, b³].

  **Result for Case 3**: 
     - We do not apply PoI to V. The reference class for indifference is L (given by the client). The distribution of V is derived from that of L.

  #### Case 4: Failure Time of a Component
  We have a component and we know nothing about its failure time T except that it is positive and unbounded. We are tempted to use a uniform distribution over [0, T_max] for some large T_max, but that is arbitrary.

  **Procedure**:

  1. **Clarify**: The quantity is failure time T (in hours, say). We know nothing except T>0. The range is unbounded above.

  2. **Symmetries**: Without any information, we might consider scale invariance: the failure time might be equally likely in any logarithmic interval. That would suggest a uniform distribution in log(T) (i.e., T has a log-uniform distribution, which is the same as 1/T distribution). But note: if we consider time translation invariance, that would suggest a constant hazard rate (exponential distribution). However, without more information, we cannot decide.

  3. **Multiple Parametrizations**: We can parametrize by T, by log(T), or by the hazard rate. Each leads to a different distribution.

  4. **Check for Physical Reason**: In reliability, failure times are often modeled with exponential, Weibull, etc. The exponential distribution has a constant hazard rate and is the maximum entropy distribution for a fixed mean. But we don't have a mean. Without any data, we cannot justify one over the other.

  5. **Consistency Test**: PoI in T (uniform on [0, ∞)) is improper (infinite). PoI in log(T) (i.e., uniform on log(T) over (-∞, ∞)) is also improper. Moreover, the two are inconsistent.

  6. **Output**: PoI is not applicable. We must collect data (e.g., from similar components) to estimate a distribution, or choose a parametric family (like exponential) and then use a noninformative prior for its parameter (but that requires more work and is beyond PoI). Alternatively, we can choose a reference class and defend it (e.g., "we assume a constant hazard rate because we have no reason to believe it changes over time", leading to exponential).

  **Result for Case 4**: 
     - Indifference does not apply. We must either collect data or make an explicit choice of a reference class (e.g., constant hazard) and own it.

