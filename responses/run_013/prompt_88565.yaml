  *   Adjust slightly upward for guilt being primarily personal (#2 increases it ~0.05).
  *   Success/failure (#4) has minimal impact on core guilt (~0.01 adjustment).
  *   **Final Credence in Genuine Moral Guilt/Stain: 0.84 (84%)**

  **Sensitivity & Flip Point:**
  *   **Most Sensitive Term:** #3 (Blameworthiness survives alternatives). If this drops significantly, the entire case for guilt collapses.
  *   **Flip to "Not Guilty At All" (Credence <0.1):** You must flip **#3**. If you believe **choosing a necessary lesser evil leaves *no* personal moral residue** ("That's just the cost of doing business", "Duty absolves"), then guilt disappears. The other terms don't have enough weight alone to negate guilt if #3 is high.

