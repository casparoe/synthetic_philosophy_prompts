  2.  **Is guilt personal or role-based?** Credence: **0.6** (Moderate-High - While the office creates the context, the moral residue attaches to the *person* making the choice).
  3.  **Does blameworthiness survive all alternatives being wrong?** Credence: **0.85** (High - Choosing the lesser evil still involves choosing evil, leaving moral residue).
  4.  **Does success matter (Guilt if failed)?** Credence: **0.3** (Low-Moderate - Failure might increase *perceived* guilt/culpability due to recklessness, but core blameworthiness stems from intent/choice).

  **Combining for Final Guilt Credence:**
