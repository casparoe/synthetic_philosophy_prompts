  1.  **Dilemmas (0.2):** True "forbidden yet required" contradictions are rare; frameworks usually find obligation.
  2.  **Personal vs Role (0.6):** Guilt primarily attaches to the person acting, not just the office's abstract needs.
  3.  **Blameworthiness Persists (0.85):** Choosing the lesser evil still involves choosing evil, staining the agent.
  4.  **Success Matters? (0.3):** Failure might *increase* perceived recklessness, but core guilt depends on the choice itself.
