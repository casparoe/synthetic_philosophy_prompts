answer: |-
  ### Exam Question  
  **Rational Choice & Epistemology Final Exam**  
  *Answer one question in 90 minutes.*  

  **QUESTION 3: Aumann’s Agreement Theorem and the Common Prior Assumption**  
  Critically evaluate the following claim: "If two rational agents observe the same data and disagree, at least one must be irrational—this is what Bayesian rationality requires, per Aumann’s theorem." In your essay:  
  (a) State the precise assumptions and conclusion of Aumann’s agreement theorem.  
  (b) Explain why this theorem does *not* imply that disagreement is irrational.  
  (c) Analyze the role of the Common Prior Assumption (CPA): Is it a requirement of rationality or a substantive belief-origin assumption? Justify your view.  
  (d) Consider a case where two agents have *different but commonly known priors*, observe the same data, and their posteriors are common knowledge. Does Aumann’s theorem apply here? Does this case refute the idea that "rational agents cannot agree to disagree"?  

  ---

  ### Model Answer (705 words)  

  #### (a) Aumann’s Theorem: Assumptions and Conclusion  
  Aumann’s agreement theorem (1976) states that if two agents have a common prior probability distribution over a state space, their posteriors for a given event must be equal if those posteriors are common knowledge. Key assumptions:  
  - **Common Prior (CPA)**: Both agents share the same prior beliefs.  
  - **Bayesian Rationality**: Agents update beliefs via Bayes’ theorem upon receiving private information.  
  - **Common Knowledge of Posteriors**: Each agent knows the other’s posterior, knows the other knows theirs, ad infinitum.  
  *Conclusion*: Posteriors must agree. Disagreement cannot persist under these conditions.  

  #### (b) Why Disagreement Isn’t Necessarily Irrational  
  The theorem does *not* brand disagreement as irrational. It shows that disagreement is impossible *only when* CPA, Bayesian updating, and common knowledge of posteriors hold. Real-world disagreements often violate these:  
  - **Divergent Priors**: Rational agents may reasonably hold different priors due to distinct life experiences or interpretations of background information (e.g., two economists with different models of inflation).  
  - **Asymmetric Information**: Agents may not have identical data access (e.g., one sees proprietary research).  
  - **Common Knowledge Failure**: Posteriors are rarely common knowledge (e.g., debates where each side doubts the other’s sincerity).  
  Thus, disagreement can arise without irrationality—Aumann only rules it out in highly idealized, CPA-bound scenarios.  

  #### (c) The Common Prior Assumption: Rationality or Substantive Claim?  
  CPA is **not a requirement of rationality** but a **substantive assumption about belief origins**.  
  - **Rationality vs. CPA**: Bayesian rationality governs *how* beliefs update (coherently, via Bayes’ rule). CPA asserts *where* priors come from (a single source, e.g., "Nature’s prior"). Rationality does not mandate identical priors; agents can be fully rational yet have divergent priors shaped by non-identical evidence.  
  - **Substantive Claim**: CPA imposes homogeneity in prior formation, treating agents as "epistemic clones." This is a strong empirical/social assumption, not a norm of rationality. Rejecting CPA allows for rational disagreement rooted in heterogeneous prior-forming experiences (e.g., cultural or expert backgrounds).  

  #### (d) Case Study: Commonly Known Divergent Priors  
  **Scenario**: Alice and Bob are oil analysts. It is common knowledge that:  
  - Alice’s prior for an oil crisis is \( P_A(\text{crisis}) = 0.2 \) (optimistic).  
  - Bob’s prior is \( P_B(\text{crisis}) = 0.8 \) (pessimistic).  
  They observe the same data (e.g., OPEC cuts production). After updating, Alice’s posterior is \( 0.3 \), Bob’s is \( 0.7 \), and these posteriors are common knowledge.  

  **Analysis**:  
  - **Aumann’s Theorem Does Not Apply**: The theorem assumes CPA, which is violated here. It is silent on cases with commonly known divergent priors.  
  - **Disagreement Persists Rationally**: Alice and Bob updated correctly (Bayesian rationality), share data, and their posteriors are common knowledge—yet they disagree. This is *rational* given their entrenched priors.  
  - **Does This Refute "Cannot Agree to Disagree"?** Yes, but only for the slogan’s *unqualified* form. The theorem’s technical claim ("no disagreement under CPA") remains intact. This case refutes the slogan **if** misapplied to non-CPA settings (e.g., the finance claim). Rational agents *can* "agree to disagree" when priors diverge, even with common knowledge of posteriors.  

  **Conclusion**  
  Aumann’s theorem is frequently misappropriated to claim disagreement implies irrationality. In reality, it only demands agreement under stringent conditions (CPA + common knowledge of posteriors). CPA is a substantive assumption, not a rationality axiom. When priors diverge transparently—as with Alice and Bob—rational disagreement is not just possible but inevitable. The finance argument conflates rationality with homogeneity, ignoring how legitimate prior heterogeneity drives real-world disputes.  

  ---

  ### Marking Scheme (25 points total)  
  **A-Grade (21–25 pts)**: Hits all key moves below. Distinguishes CPA from rationality *explicitly*. Uses the case in (d) to refute the slogan *and* reconcile with the theorem.  

  **B-Grade (16–20 pts)**: Addresses all parts but with minor gaps (e.g., vague CPA justification, or weak case analysis).  

  | **Section** | **Points** | **Key Moves for Full Credit** | **Common Mistakes** |  
  |-------------|------------|-------------------------------|---------------------|  
  | **(a) Assumptions/Conclusion** | 5 | • CPA, Bayesian updating, common knowledge of posteriors named.<br>• Conclusion: Agreement under these conditions. | Misses common knowledge requirement; calls CPA "rationality." |  
  | **(b) Disagreement ≠ Irrational** | 6 | • Cites CPA as necessary for theorem.<br>• Lists 2+ real-world violations (e.g., asymmetric info, priors). | Asserts "Aumann says disagreement is irrational"; omits CPA’s role. |  
  | **(c) CPA Analysis** | 7 | • CPA ≠ rationality: Rationality governs updating, not prior origins.<br>• CPA as substantive (empirical/social) claim. | Calls CPA "part of rationality" or fails to justify its substantive nature. |  
  | **(d) Case Workthrough** | 7 | • States theorem *does not apply* (CPA violated).<br>• Shows posteriors diverge despite common knowledge.<br>• Refutes unqualified slogan but not theorem. | Claims theorem is "refuted"; misses that disagreement is rational here. |  

  **Discrimination Note**:  
  - **A** answers use (d) to *synthesize* the critique: "The slogan misleads when priors aren’t common; Alice/Bob show rational disagreement is possible sans CPA."  
  - **B** answers treat (a)–(d) as a checklist without connecting (d) to the finance claim’s fallacy.
