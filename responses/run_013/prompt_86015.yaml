prompt: |-
  Ok so I'm in a reading group and we're doing Aquinas on lying, and I'm stuck on one passage. It's Summa II-II q.110 a.1, and I grabbed this off newadvent:

  "However, the essential notion of a lie is taken from formal falsehood, from the fact namely, that a person intends to say what is false; wherefore also the word 'mendacium' [lie] is derived from its being in opposition to the 'mind.' Consequently if one says what is false, thinking it to be true, it is false materially, but not formally, because the falseness is beside the intention of the speaker so that it is not a perfect lie, since what is beside the speaker's intention is accidental for which reason it cannot be a specific difference. If, on the other hand, one utters falsehood formally, through having the will to deceive, even if what one says be true, yet inasmuch as this is a voluntary and moral act, it contains falseness essentially and truth accidentally, and attains the specific nature of a lie. That a person intends to cause another to have a false opinion, by deceiving him, does not belong to the species of lying, but to perfection thereof..."

  And then in his reply to the first objection he says it's more opposed to truth to tell the truth while intending to tell a falsehood than to tell a falsehood while intending to tell the truth, which I honestly can't make heads or tails of.

  Here's what's bugging me. I always assumed a lie was basically about getting someone to believe something false — the deception is the whole point. He seems to say the opposite: the essence of lying is the will to say what's false, and the intent to deceive is just a "perfection" of it, not part of what makes it a lie. So:

  - If I say something literally true but arrange it so you'll draw a false conclusion (like "I didn't see him this morning" when I know full well he's in the basement), did I lie on his account? Seems like the answer has to be no, since my words matched my mind, but that's a wild result given that I did exactly what a liar is trying to do.
  - Conversely, if I say something false that I sincerely believe is true, and I say it precisely because I want you to believe it too, is that a lie? Sounds like he'd say no, which also seems wild.
  - And what even is the "formal falsehood" if it isn't the intent to deceive? Is it just that my utterance doesn't match my own belief? Because if so, lying turns into a purely private relation between my words and my mind, and the other person drops out entirely, which is weird for something he treats as a sin against a virtue governing how we deal with each other.

  Can you walk me through the passage piece by piece, say what the material/formal distinction is actually tracking, and then tell me what his view definately commits him to about misleading-without-falsehood and about honest-but-deceptive speech? I want to be able to state the position, not just paraphrase it back at people. And if I'm misreading the thing about the first objection, tell me how, cause I have a feeling I'm missing something there.
reasoning: |-
  Okay, the user is grappling with Aquinas's definition of lying in Summa Theologiae. They're part of a reading group and find the passage confusing, especially the distinction between material and formal falsehood. Let me start by breaking down the key points they mentioned.

  First, Aquinas says the essence of a lie is formal falsehood—intending to say what's false. The user thought deception was central, but Aquinas separates that as a "perfection" of lying. So their confusion makes sense because modern definitions often focus on deception.

  The user has three specific scenarios. The first is saying something technically true to mislead. Aquinas would say this isn't a lie because the words match the speaker's belief. But the user points out that it achieves deception, which seems contradictory. I need to explain why Aquinas still considers it sinful under another vice, like deception.

  The second scenario is saying false things sincerely but wanting others to believe. Here, Aquinas says it's materially false but not a lie because there's no intent to deceive. The user finds this counterintuitive. I should clarify that for Aquinas, the speaker's intent defines the act, not the outcome.

  The third issue is about "formal falsehood." The user wonders why it's a sin against others if it's about internal consistency. Aquinas ties it to the virtue of truth-telling, which involves both internal and external alignment. So even if deception isn't intended, misaligning word and thought violates that virtue.

  The user also mentioned the reply to the first objection, where Aquinas says intending falsehood while speaking truth is worse. They're confused. I need to emphasize that Aquinas sees the will as central. If you intend falsehood, your will is corrupted, even if accidentally truthful. That's more opposed to truth's essence.

  The user wants to state Aquinas's position clearly. They need to differentiate between lying and deception, and understand the material/formal distinction. They might be preparing for a discussion, so clarity is key. Their deeper need is to confidently explain and critique Aquinas in their group.

  I should structure the explanation with definitions, apply them to the scenarios, and address the objection. Making sure to highlight why Aquinas prioritizes intent over deception. Also, note that deception without falsehood is still wrong, just not classified as lying. Conclude by connecting to the virtue of truth to show how it's interpersonal despite the internal focus.
answer: |-
  Let's break down Aquinas' position step by step, using your specific concerns to structure the explanation. His view is counterintuitive to modern ears but internally consistent within his virtue ethics framework.

  **Core Distinction: Material vs. Formal Falsehood**
  1.  **Material Falsehood:** This is simply the *factual inaccuracy* of the words spoken. The statement does not correspond to objective reality. ("The cat is on the mat" when the cat is actually on the couch).
  2.  **Formal Falsehood:** This is the *intention of the speaker* to assert something they *believe to be false*. The speaker's *mind* (belief/knowledge) and their *words* are deliberately misaligned. This is the essence of lying for Aquinas. He derives "mendacium" (lie) from "contra mentem" (against the mind).

  **The Essence of Lying: Formal Falsehood**
  *   Aquinas states: **"the essential notion of a lie is taken from formal falsehood, from the fact namely, that a person intends to say what is false."**
  *   **Key Point:** The defining characteristic of a lie *as a moral act* is the speaker's *willful intention* to assert something contrary to their own understanding of the truth. This is an act of internal disorder – the will deliberately chooses to make the words contradict the mind's grasp of truth.
  *   **The Role of Intent to Deceive:** Aquinas explicitly says intent to deceive **"does not belong to the species of lying, but to perfection thereof."** This means:
      *   Intent to deceive is *not* what *defines* a lie (its "species" or essential nature).
      *   Intent to deceive is the *typical purpose* or *completion* ("perfection") of a lie. A lie is usually *aimed* at deception. But it's conceptually separable from the core act of formal falsehood.

  **Applying the Definition: Your Scenarios**

  1.  **Saying Literal Truth to Mislead (e.g., "I didn't see him this morning" knowing he's in the basement):**
      *   **Words:** True (material truth).
      *   **Speaker's Belief:** The speaker *knows* the statement is literally true.
      *   **Formal Falsehood?** NO. The speaker *intends* to say what they believe is literally true. Words match mind.
      *   **Intent to Deceive?** YES. The speaker *intends* to cause a false belief (that "he" is not around) by implying something false through a literal truth.
      *   **Aquinas' Verdict:** **This is NOT a lie.** Because the core element of formal falsehood (intending to say what one believes false) is absent. Words and mind align.
      *   **But is it Sinful?** ABSOLUTELY YES. Aquinas condemns this elsewhere (e.g., II-II, q. 111) as a form of *deception* or *fraud*. It's a sin against truthfulness and charity, but it's a *different sin*. It's malicious truth-telling aimed at misleading. He calls it "misleading by telling the truth" (*mendacium interpretativum*). It's wrong, but not classed as *lying* under his strict definition.

  2.  **Saying Falsehood Sincerely (Believing it True) to Persuade:**
      *   **Words:** False (material falsehood).
      *   **Speaker's Belief:** The speaker *believes* the statement is true.
      *   **Formal Falsehood?** NO. The speaker *intends* to say what they *believe* is true. Words match mind *as the speaker understands it*.
      *   **Intent to Deceive?** POSSIBLY, but irrelevant to the formal definition. The speaker wants the listener to believe the statement *because they believe it themselves*.
      *   **Aquinas' Verdict:** **This is NOT a lie.** Because the essential element – the willful intention to assert what one *knows or believes* to be false – is missing. This is "false materially, but not formally."
      *   **But is it Problematic?** YES. Spreading falsehoods is generally bad. It can be negligent, rash, a sin against prudence or charity, especially if you *should have known* better or if it causes harm. But it lacks the *specific malice* of formal falsehood, the deliberate sundering of word from mind.

  **Why the "Other Person" Doesn't Drop Out (Addressing Your Third Concern)**
  *   **Virtue of Truthfulness (Veracity):** This is the key. Truthfulness is a social virtue governing communication between persons.
  *   **The Sin:** The sin of lying is primarily a sin *against the virtue of truthfulness within the speaker*. It corrupts the speaker's own faculty of communication. They misuse their God-given faculty of speech/reason, which is ordered towards truth.
  *   **The Interpersonal Aspect:** While the *essence* of the lie is the internal act of will (intending formal falsehood), the *purpose* and *effect* are inherently interpersonal. Speech is *for* communication. By corrupting their own act of communication at its root (intending falsehood), the liar inherently violates the right of the listener to truthful communication *in principle*, even if the deception fails or the words accidentally turn out true.
  *   **Analogy:** Think of stealing. The core sin is taking what belongs to another *against their reasonable will*. The harm to the victim is central *to the definition*. In lying (for Aquinas), the core sin is corrupting your *own* communicative act. The potential harm to the listener is a *consequence* and the usual *purpose*, but not the defining element. The listener's right is violated *because* they are being subjected to a corrupted communicative act.

  **The Objection Reply: Intending Falsehood While Speaking Truth is Worse**
  *   **The Scenario:** Aquinas argues that telling the literal truth *while intending to tell a falsehood* is *more* opposed to truth than telling a falsehood *while intending to tell the truth*.
  *   **Why?**
      *   **Case 1 (Intending Falsehood, Words True):** Your *will* is directly opposed to truth (formal falsehood). You *wanted* to lie. The truthfulness of the outcome is *accidental* to your willed act. Your *intention* was fully corrupt. The *act itself* (as willed) was vicious. Truth prevailed *despite* your act.
      *   **Case 2 (Intending Truth, Words False):** Your *will* was directed towards truth (formal truthfulness). The falsehood of the outcome is *accidental* to your willed act. Your *intention* was good. Falsehood occurred *despite* your act.
  *   **The Analogy:** Consider two archers:
      *   Archer A (Case 1): Aims *deliberately* at the wrong target but misses, and the arrow accidentally hits the right target. His *aim* was bad (formal falsehood). Hitting the right target was luck.
      *   Archer B (Case 2): Aims *deliberately* at the right target (formal truthfulness) but his hand slips, and the arrow hits the wrong target. His *aim* was good. Hitting the wrong target was an accident.
  *   **Aquinas' Point:** The *moral quality of the act* is judged primarily by the *intention of the will*. Archer A's act (willed aim) was bad. Archer B's act (willed aim) was good, even though the outcome was bad. Similarly, the person *intending* falsehood commits a bad act (a lie, even if words true), while the person *intending* truth commits a good act (truthfulness, even if words false). The first is *more* opposed to truth because the *will itself* is opposed to truth.

  **Definitive Commitments of Aquinas' View**

  1.  **On Misleading Without Falsehood (Paltering, Equivocation):**
      *   **Commitment:** This is **NOT lying** according to Aquinas' definition.
      *   **Reason:** The speaker *intends* to assert what they believe is literally true. Words match mind (formal truthfulness).
      *   **But:** It **IS sinful deception** (a violation of truthfulness understood more broadly or of charity/fairness). It's wrong, but it falls under a different moral category than lying. Aquinas calls it *mendacium interpretativum*.

  2.  **On Honest-but-Deceptive Speech (Sincere Falsehood):**
      *   **Commitment:** This is **NOT lying**.
      *   **Reason:** The speaker *intends* to assert what they *believe* is true. Words match mind *as understood by the speaker* (formal truthfulness). There is no willful intention to assert falsehood.
      *   **But:** It **IS materially false** and **can be sinful** if caused by negligence, rashness, or if it causes unjust harm. The speaker bears responsibility for the falsehood they spread, but not for the specific malice of lying.

  **Stating the Position Clearly (For Your Group)**

  "Aquinas defines lying strictly as an act where the speaker *intends to say something they believe is false* (formal falsehood). This internal misalignment of word and mind is the core sin, corrupting the virtue of truthfulness within the speaker. While the *intent to deceive* is the usual purpose of a lie, it's not essential for the definition. Therefore:

  1.  **Telling a literal truth intending to mislead is *not* lying** (because the speaker intends their words to match reality as they see it), **but it *is* deceptive and sinful.**
  2.  **Saying a falsehood you sincerely believe is *not* lying** (because you intended to speak truthfully), **but spreading falsehoods is generally wrong.**
  3.  **The worst opposition to truth** occurs when someone **intends falsehood**, even if their words accidentally turn out true, because their *will* is directly contrary to truth. Truthfulness requires both the *intention* to speak the truth (formal) and the *accuracy* of what is said (material), but the intention is primary for judging the moral act itself."

  This view prioritizes the *internal act of the will* and the speaker's relationship to *truth itself* as the foundation for the sin of lying, separating it conceptually from the *external effect* of deception, which he condemns separately. It's a focus on the corruption of the communicative faculty at its source.
