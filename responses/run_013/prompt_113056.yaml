  But note: in node 6, if B passes, there is no next node because the game is finite? Actually, we defined 6 legs, so node 6 is the last. So B must take? Or we can have an option to pass? But the problem says finite and unknown, but in this case, if the game has 6 legs, then at node 6, B must take (or if they pass, the game ends with very low payoffs? or we can say that at the last node, the player must take?).

