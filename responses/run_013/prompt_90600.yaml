prompt: |-
  You're a political anthropologist who also knows the analytic literature on corruption and on gift exchange — so you'll have instincts about both the ethnography and the concepts. Think carefully before answering, and start by brainstorming the candidate terms you'd consider, because I don't want the first label that comes to mind.

  Here's a pattern I keep running into and I don't know if it has a name. In a provincial office I've been reading about, the man in charge hands the road contracts to his cousins and to the families that backed him. Nobody in the office thinks this is stealing. They think it's what you owe the people who made you. Outside auditors come in, call it corruption, file a report. Fine — that half is just the usual relativism about corruption and I already know that argument.

  The strange half is this. The same office workers are genuinely furious about a different set of contracts going to a rival network, and they denounce that as corruption, in exactly the moralising tone the auditors used. And in my own country it's the same: we shrug at the envelopes our side takes and are scandalised by the other side's. So the judgement doesn't seem to track the act, or the culture — it tracks whose network is doing it, and everyone seems to be running two standards at once without noticing. The size matters too: a small envelope is a gift, a big one is a bribe, and the line moves depending on who's counting.

  Is there an established concept for this? My guesses are the gift/commodity distinction, patron-client relations, and something like a moral economy of corruption, but none of them quite gets the bit I care about — the double standard that both sides share, and the way the vocabulary of corruption becomes a weapon in the hands of people doing the same thing. If nothing fits, coin me a term and define it. What I really want is the carving: how is this different from plain hypocrisy, from ordinary in-group favouritism, and from the flat relativist claim that corruption is just a Western category? Give me one case that clearly falls inside your definition and one that clearly falls outside, and say what turns on getting it right — say, for someone designing an anti-corruption programme. Skip the reading list, I only want the distinction.
reasoning: |-
  Okay, the user is describing a pattern they've observed in both a provincial office setting and their own country. The key elements are: officials giving contracts to their own network (family, supporters) and seeing this as legitimate reciprocity, while identical actions by a rival network are condemned as corruption. They note that people apply two standards without apparent awareness, and that the moral judgment depends entirely on whose network benefits. The size of the exchange also matters, with flexible thresholds between "gift" and "bribe."

  The user has already considered concepts like gift/commodity distinction, patron-client relations, and moral economy of corruption but finds them insufficient. They specifically want to capture: 1) the shared double standard across groups, 2) the weaponization of "corruption" accusations against rivals, and 3) the lack of cognitive dissonance in applying these contradictory judgments.

  This feels like a deep anthropological puzzle about moral cognition in political networks. The user isn't just naming hypocrisy - they're pointing to a systemic feature where the same act is morally coded differently based on affiliation. Important to distinguish from:
  - Simple hypocrisy (which implies awareness of inconsistency)
  - Ordinary in-group favoritism (which doesn't necessarily involve condemning out-groups for identical acts)
  - Cultural relativism (which would treat all such acts neutrally within context)

  The core dynamic resembles what political scientists call "partisan moral licensing" but needs more ethnographic texture. Also echoes Mary Douglas's work on how institutions define purity/danger. The flexible size threshold recalls Geertz's "thick description" where meaning shifts with context.

  For a precise concept, considering "Network-Moral Dissonance" - but that might overemphasize psychological conflict when actors seem untroubled. Alternatively, "Tribal Accountability Accounting" plays on accounting fraud terminology but may be too cute. Best option might be "Affiliative Moral Schema" with these features:
  1. Moral valuation of resource transfers depends entirely on perceived affiliation (in-group vs out-group)
  2. Shared across rival groups within the same system
  3. Involves reclassification of identical acts (e.g., contract allocation) based on this affiliation
  4. Contains sliding scales for "acceptable" amounts that also shift based on affiliation

  Clear inside case: Provincial office where contracts to leader's cousins = legitimate reciprocity, identical contracts to rival's cousins = corruption. Actors genuinely experience these as morally distinct.

  Clear outside case: A bureaucrant who takes bribes from all networks indiscriminately while believing all such acts are equally wrong. Here there's consistent moral standard, no affiliation-based reclassification.

  For anti-corruption programs: Recognizing this pattern means understanding that:
  - Audits alone fail because both sides agree on the moral framework while disagreeing on affiliations
  - Effective intervention requires disrupting the affiliation-based reclassification mechanism
  - Standard ethics training won't work because the issue isn't lack of norms but weaponized application

  Need to emphasize how this differs from patron-client systems (which don't necessarily involve moral condemnation of other patrons) and from simple relativism (since all actors use universalizing moral language, just selectively).
answer: |-
  Based on your ethnographic observation and conceptual requirements, the most precise term is **Affiliative Moral Schema (AMS)**. It captures the dual-track moral logic where identical acts are classified as legitimate reciprocity or corrupt exploitation *solely* based on network alignment, with flexible quantitative thresholds ("gift" vs. "bribe") serving as secondary justifications.  

  ### Core Distinctions  
  1. **Vs. Hypocrisy**:  
     - Hypocrisy implies *conscious* double standards. AMS involves *internalized cognitive frames*: actors genuinely perceive in-group favors as morally distinct from out-group favors. The "without noticing" element is key.  
     - *Example*: A politician condemning opponents for nepotism while hiring their own child isn’t AMS if they feel private guilt. AMS requires sincere moral outrage against out-groups.  

  2. **Vs. In-Group Favoritism**:  
     - Favoritism is one-directional (helping allies). AMS is bidirectional: **allies’ acts are morally reclassified as "reciprocity"**; **identical enemy acts are reclassified as "corruption"**. The moral vocabulary becomes a weapon.  
     - *Example*: All feudal lords granting land to relatives is favoritism. If Lord A calls Lord B’s land grants "corrupt" while viewing his own as "duty," that’s AMS.  

  3. **Vs. Cultural Relativism**:  
     - Relativism suspends external judgment. AMS uses *universalizing moral language* ("corruption!"), but applies it selectively. Auditors’ external standards are weaponized *within* the local system.  

  ### Case Examples  
  - **Inside AMS**:  
    Your provincial office. The chief’s contract awards to backers are "just reciprocity" (schema: *affiliative obligation*). Rivals’ identical awards are "corruption" (schema: *theft*). Workers *genuinely* perceive a moral difference. Size thresholds (e.g., envelopes) adjust to fit the schema.  

  - **Outside AMS**:  
    A pure market bribe. Contractor X pays official Y for a contract, both viewing it as a self-interested transaction. If Y’s *own network* condemns this as corrupt while accepting identical payments from allies, it loops back into AMS. True non-AMS requires consistent moral judgment *regardless of affiliation*. Example: An ascetic bureaucrant who rejects *all* gifts/patronage as corrupt, even from family.  

  ### Why the Carving Matters for Anti-Corruption  
  1. **Diagnosis Failure**: Standard audits/reforms focus on acts, not moral reclassification. AMS makes local allies see anti-corruption probes as partisan attacks, not ethical interventions.  
  2. **Intervention Design**:  
     - **Ineffective**: Punishing "corrupt" acts alone reinforces AMS (e.g., only targeting rivals). Ethics training ignores embedded schemas.  
     - **Effective**:  
       - Force *explicit reconciliation* of standards: "If Contract A to your cousin is legitimate, why is Contract B to their cousin corrupt?"  
       - Shift resources to **impersonal systems** (e.g., blind bidding) that remove affiliative cues.  
       - Leverage sliding scales: Codify size thresholds *before* contracts are issued to prevent retroactive moral relabeling.  

  AMS explains why anti-corruption reforms fail when they target "corruption" without dismantling the dual moral framework that defines it. The fight isn’t against greed, but against **competitive moral reclassification** entrenched in social networks.
