prompt: |-
  I run the monthly meeting of a giving circle — about thirty of us, mostly young professionals, we pool money and each person also pledges a share of their own income — and I've somehow become the person everyone corners afterward to ask "so how much am I actually supposed to give?" I took a couple of ethics classes and read my way into the consequentialist argument about demandingness, the one that says if consequences are all that matter there's no principled place to stop, that you're required to keep giving until the next dollar would do more good somewhere else than it does for you. Every version I've found is either "give everything you don't strictly need" or a hand-wave about reasonable limits with no way to actually find them. Meanwhile I've got real people in front of me who want a number, or at least a rule, and I get maybe twenty minutes per conversation and zero authority — whatever the procedure spits out, they have to be willing to sign their own name to it.

  So what I want from you is an actual procedure I can run in that twenty minutes: the questions to ask, in order; what counts as a good enough answer to each; the point where it stops with a clear no; and the point where it has to stop and hand the thing back to the person because it's turned into a question about what they value rather than one with a fact of the matter. Two things I specifically need it to cope with. First, a friend in the group keeps pushing what she calls the no-worse-than-average rule — you're allowed to keep whatever you'd need to live about as well as an average person in your country, and everything above that is fair game — and I can't tell if thats a principled stopping point or just a comfortable one, so I want the procedure to either build it in or say why it can't. Second, I read somewhere that on some versions of consequentialism nothing is ever actually required or forbidden, options are only better or worse, and if that's right then any procedure has to say out loud how it gets from "this is worse" to "don't do this," because otherwise it's smuggling in a rule it isn't entitled to. It also has to work when nobody can honestly estimate the long-run effects, which is basically always.

  Then run it on three of my members so I can watch it move: a guy earning around 120k with no dependents asking whether 50% is enough; a woman who's given 10% for years and now wants to drop to 5% because her kid needs expensive ongoing care; and someone offered a finance job he'd hate that would roughly tripple what he could give. I don't need it to hand me answers I'll like — I'd rather it be blunt than flattering. Where it can't decide, say so and mark it as a judgment call instead of dressing it up as a step. And tell me where you think the procedure is most likely to go wrong, and what would change your mind about its overall shape — like, which claim about demandingness, if it turned out to be false, would make you build the whole thing differently.
reasoning: |-
  Hmm, the user runs a giving circle and needs a practical procedure to help members decide how much to donate. They're dealing with ethical theories like consequentialism and demandingness, but need something actionable for 20-minute conversations. Key challenges include handling the "no-worse-than-average" rule, addressing the is-ought gap in consequentialism, and dealing with uncertainty about long-term effects.

  The user described three specific cases: a high-earning single person wondering if 50% is sufficient, a parent needing to reduce donations for a child's medical care, and someone considering a disliked high-paying job to triple donations. They want the procedure to be transparent about where it requires value judgments versus factual analysis.

  The core tension seems to be between ethical rigor and practical applicability. The procedure must acknowledge that consequentialism doesn't provide clear stopping points while still offering actionable guidance. The "no-worse-than-average" rule appears arbitrary upon examination - it confuses statistical norms with moral thresholds and fails to account for varying capacity to help.

  For the procedure structure, it should start with establishing baseline needs, then determine capacity to give, evaluate what counts as meaningful sacrifice, and finally make trade-offs. Crucially, it needs to flag where decisions shift from calculable impacts to value judgments. The three test cases reveal different pressure points: the first shows how baseline definitions affect obligations, the second demonstrates how personal commitments create moral friction, and the third highlights how career choices complicate simple donation percentages.

  The most vulnerable parts of this approach are the subjective thresholds (like what constitutes "significant" sacrifice) and the handling of uncertainty. If new evidence showed that small individual contributions reliably trigger systemic change, it might justify lower personal thresholds. But as presented, the procedure's strength is in making its assumptions visible rather than pretending to mathematical precision.
answer: |-
  Here's a concrete, step-by-step procedure designed for your 20-minute conversations, explicitly tackling demandingness, the "no-worse-than-average" rule, and the is-ought gap in consequentialism. It focuses on *identifying the point where refusing to give more becomes a deliberate value choice*, not on prescribing an exact number.

  **The "Clarity of Commitment" Procedure**

  **Core Principle:** Consequentialism tells us *what matters* (reducing suffering/increasing welfare), but not *how much* we must sacrifice personally to achieve it. This procedure helps someone *see the trade-off* between their personal resources and the good those resources could do, forcing a conscious choice when further giving stops. The "demand" is honesty about that choice.

  **Key Features:**
  1.  **Explicit Thresholds:** Defines subjective but necessary boundaries (Baseline, Stability Line, Significant Sacrifice).
  2.  **Value Judgment Flag:** Clearly marks steps where personal values *must* decide.
  3.  **Rejects "No-Worse-Than-Average":** Explains why it's arbitrary comfort, not principle.
  4.  **Handles Uncertainty:** Focuses on *relative* impact ("X dollars *likely* does more good for Cause Y than for me at Z level") without impossible precision.
  5.  **Addresses the Is-Ought Gap:** Doesn't derive "ought" from "is"; derives "ought" from the *person's own acceptance* of the goal (reducing suffering) and forces them to confront the inconsistency of stopping *without reason* other than preference.

  **The Steps (Order Matters):**

  1.  **Establish the Goal & Frame (2 mins):**
      *   *Ask:* "We agree that the core reason we give is to reduce suffering/increase wellbeing with our pooled resources, right? And that every dollar we keep *could* potentially do more good if given effectively?"
      *   *Good Answer:* Explicit "Yes." (If "No," conversation shifts fundamentally; clarify shared purpose first).
      *   *Purpose:* Sets the consequentialist frame. Establishes the shared premise that unspent personal dollars *represent potential good not done*.

  2.  **Define the "Survival Baseline" (Absolute Floor) (3 mins):**
      *   *Ask:* "What's the absolute minimum annual income you *truly* need to cover basic survival necessities *without* compromising your health or ability to work? (Rent, utilities, basic nutritious food, essential healthcare, minimal work-related costs). Be ruthlessly honest – this isn't comfort, it's survival."
      *   *Good Answer:* A specific dollar figure. Probe if it includes non-essentials (e.g., "Does 'utilities' include premium internet for Netflix?").
      *   *Stop if:* Person cannot or refuses to define this. (Necessary for progress).
      *   *Purpose:* Establishes the absolute lower bound. Below this, giving more actively harms the giver's capacity to function/give long-term. **Factual-ish (needs assessment).**

  3.  **Define the "Stability & Function Line" (3 mins):**
      *   *Ask:* "Above survival, what level of spending allows you to: a) Avoid chronic, significant stress about finances? b) Maintain reliable housing/transportation for work? c) Cover predictable, necessary healthcare/wellness? d) Replenish yourself enough to be sustainably productive (sleep, basic leisure for sanity)? This *isn't* luxury, it's about preventing burnout and maintaining your capacity to earn/give long-term."
      *   *Good Answer:* A dollar figure above the Survival Baseline. Should feel "barely adequate but stable." Challenge inclusions of significant comforts.
      *   *Stop if:* Person defines this so high it clearly includes substantial comfort/discretionary spending. Push back gently: "Is [specific item] truly essential to avoid burnout and maintain basic function, or is it a comfort?"
      *   *Purpose:* Establishes a zone above survival where money *can* be given without immediate harm, but might impact stability or resilience. **Judgment Call (individual resilience, stress tolerance).**

  4.  **Reject "No-Worse-Than-Average" (Explicitly) (2 mins):**
      *   *State:* "Some suggest keeping enough to live 'no worse than average.' Let's discuss why that's not a *principled* stopping point under our goal: Average includes massive luxury and waste. Billions live far below our average. Keeping resources just because others do doesn't reduce suffering; it normalizes it. If we agree that unused dollars *could* do more good, 'average' is just a statistical comfort zone, not an ethical justification for stopping. We need a reason *better* than 'it's normal'." *Mark this as a **Value Judgment Call:*** The group member must decide if they accept this critique or if "normalcy" is a value they prioritize *over* maximizing impact, given the premise.

  5.  **Identify "Significant Sacrifice" Threshold (The Key Value Choice) (5 mins):**
      *   *Ask:* "Beyond the Stability Line, spending money on yourself shifts from stability/function towards comfort, enjoyment, luxury, status, convenience, future security *beyond* basic predictability, etc. **Where on that spectrum does spending the *next* dollar on yourself feel like it provides something you *deeply, significantly* value or protects against a risk you *genuinely* fear (beyond basic stability), *compared* to the significant good you believe that dollar could do via effective giving?** Be specific about what that spending gets you (e.g., 'a nicer vacation,' 'faster car,' 'extra safety net for unlikely event X,' 'private school for my kid')."
      *   *Good Answer:* Identification of specific categories of spending or a rough income level where the *marginal personal utility* feels subjectively high *to them*, *alongside* an acknowledgment of the counterfactual good.
      *   *Crucial Flag:* **THIS IS THE CORE VALUE JUDGMENT.** Consequentialism cannot *dictate* how much personal comfort/luxury/security someone values relative to the good their money could do. This step forces them to *name* where they are making that trade-off and *accept* that stopping before this point is *not* maximizing impact per their stated goal; it's prioritizing their comfort/security/values. The "demand" is to *recognize and own* this choice.

  6.  **Confront the Trade-Off & Define Commitment (3 mins):**
      *   *Ask:* "Given the Survival Baseline [X], Stability Line [Y], and where you feel Significant Sacrifice starts [Z]:
          *   Money between X and Y is arguably needed for your stability as a giver.
          *   Money above Z is where you *choose* your comfort/security over greater impact.
          *   **The crucial zone is between Y and Z. This is 'discretionary but not deeply valued' spending. What portion of *this* slice are you willing to commit to giving?** This is your *conscious commitment level* above basic stability. It's not 'required' by pure consequence, but it's the gap between bare function and your comfort zone where you can *choose* impact."
      *   *Good Answer:* A specific percentage or dollar amount allocated from the Y-Z zone. "I'll give 80% of my income above Y but below Z." "I'll cap my spending at [point below Z] and give the rest."
      *   *Purpose:* Moves from abstract thresholds to a concrete commitment *within the zone of discretion*. It defines their *chosen* level of demandingness based on their *own* values and stability assessment.

  7.  **Acknowledge Uncertainty & Iteration (2 mins):**
      *   *State:* "We can't precisely calculate long-term effects. The question is: given what we *reasonably believe* about the effectiveness of our giving, does committing [Amount] from the Y-Z zone seem like a *meaningful* contribution towards our goal relative to the personal cost *at this time*? This isn't final. Revisit when your income, stability needs, or understanding of impact changes."

  **Where it Can Go Wrong & Safeguards:**
  1.  **Dishonesty/Bad Faith:** Someone lowballs Survival/Stability or won't engage seriously. *Safeguard:* Be blunt: "If we're not defining these honestly, the exercise is pointless. Let's focus on why you want a number if you're not willing to explore the trade-offs?"
  2.  **Over-Precision:** Pressuring for an exact dollar figure too early. *Safeguard:* Focus on zones and thresholds first. The final commitment is a *portion* of a discretionary zone.
  3.  **Ignoring the Value Flag:** Treating step 5 as factual. *Safeguard:* Explicitly state: "This is where *your values* decide. There's no 'correct' answer, only your honest assessment of what personal benefit is worth the counterfactual cost."
  4.  **Burnout Risk:** Pushing someone below their genuine Stability Line. *Safeguard:* Emphasize sustainability and long-term capacity. Stability isn't luxury.
  5.  **"Paralysis by Analysis":** Getting stuck in uncertainty. *Safeguard:* Step 7 explicitly accepts uncertainty. Focus on the *relative* likelihood and the *choice* inherent in not giving discretionary funds.

  **What Would Change the Procedure?**
  If the **core claim about demandingness** was false. Specifically:
  *   **If there *was* a principled stopping point:** E.g., if moral theory *proved* you only owe 10%, or only what doesn't cause "serious hardship" (with a clear definition). The procedure would build that in as a mandatory step.
  *   **If consequences *weren't* all that mattered:** E.g., if deontological constraints (rules/rights) *trumped* consequences in a clear way (e.g., "never give more than X%"). The procedure would need steps to identify those inviolable rules first.
  *   **If individual giving had reliably catastrophic long-term consequences for the giver/society:** The Stability Line assessment would become much more stringent and forward-looking.

  ---

  **Running the Procedure on Your Three Members**

  **Member 1: $120k, No Dependents, "Is 50% ($60k) Enough?"**

  1.  **Goal:** Agrees maximizing impact is the goal.
  2.  **Survival Baseline:** Defines $30k (modest city living, basic needs met).
  3.  **Stability Line:** Defines $45k (adds buffer for emergencies, better food, gym, modest leisure). Probing confirms this feels stable, not luxurious.
  4.  **Reject Average:** Discusses. He acknowledges "average" is arbitrary but feels it's "reasonable." *Value Flag Raised:* He's prioritizing "reasonableness" (comfort/conformity) over pure impact maximization per the goal.
  5.  **Significant Sacrifice Threshold:** Identifies $70k. Below this, extra spending is "nice but not essential" (better apartment, nicer vacations, savings beyond emergency fund). Above $70k feels like funding "real luxury" (fancy car, extravagant travel) or "excessive security." *He values avoiding feeling "deprived" of a solidly comfortable life.* **Core Value Judgment:** He values significant comfort/security above $70k more than the counterfactual good.
  6.  **Confront Trade-off & Commit:**
      *   Stability (Y) = $45k, Significant Sacrifice Start (Z) = $70k. Discretionary Zone = $25k ($45k-$70k).
      *   He's currently giving $60k. $120k - $60k = $60k kept.
      *   $60k kept is $15k *above* his own Z ($70k kept would be $50k). He's *already* keeping $15k in his "luxury/excess security" zone.
      *   *Ask:* "You're keeping $15k *above* the point where you said spending feels like significant luxury/security you value highly. Giving that $15k would mean sacrificing things you *deeply* value. Is that your *choice*? If not, and you want to maximize impact per our goal, your giving should come from the $45k-$70k zone. 50% ($60k given) means you're only giving $15k from this zone ($70k kept is $50k above survival? Calculation: Income $120k. Survival $30k. Stability $45k. Sacrifice Start $70k. Discretionary Zone is $45k-$70k = $25k. He keeps $60k. $60k kept minus Stability $45k = $15k. So $15k kept *within* the discretionary zone. $120k - $60k given = $60k kept. Stability is $45k, so kept above stability is $15k. This $15k is all within the $45k-$70k discretionary zone. He hasn't reached his $70k Sacrifice Start threshold yet with $60k kept. $70k kept would be $10k *more* than he currently keeps. Clarifying: Kept: $60k. Stability: $45k. So $15k kept *above* stability, but *below* his Sacrifice Start ($70k). His Sacrifice Start is $70k *kept*. He's at $60k kept, which is $10k *below* his Z. So he has $10k more *in* the discretionary zone he *could* give before hitting his "significant sacrifice" threshold. **Correction:** His kept is $60k. His Z is $70k *kept*. Therefore, he is currently keeping $60k, which is $10k *less* than his Z. So he has $10k *more* within the discretionary zone ($45k-$70k kept) that he *could* give without reaching his self-defined "significant sacrifice" point. He's giving $60k, meaning he keeps $60k. Survival: $30k kept. Stability: $45k kept. Sacrifice Start (Z): $70k *kept*. Therefore: - Kept below Survival: $30k - Kept between Survival and Stability (Y): $45k - $30k = $15k (arguably needed for stability) - Kept between Stability (Y=$45k) and Sacrifice Start (Z=$70k): This discretionary zone is $25k. - He keeps $60k total. - $60k kept = Survival ($30k) + Stability Buffer ($15k) + $15k within the Discretionary Zone ($45k-$70k). - He has *not yet* reached his Z ($70k kept). He has $10k *more* within the discretionary zone he could give ($70k kept - $60k kept = $10k gap). - To reach his current giving ($60k given = $60k kept), he is using $15k of the $25k discretionary zone. *Ask:* "You have $25k between stability ($45k kept) and where significant sacrifice starts ($70k kept). You're currently keeping $15k of that $25k ($60k total kept minus $45k stability = $15k in discretionary). You could give up to $10k more ($70k kept - $60k kept) before hitting your own 'significant sacrifice' threshold. Giving 50% ($60k) means you're using $15k of your discretionary zone for personal spending before significant sacrifice kicks in. Is that the level of comfort/discretion you *choose* to prioritize over the good that extra $10k could likely do? Or would you commit to giving more of that $25k discretionary zone? Maybe 80% of it ($20k)? That would mean total giving of ($120k - ($45k + (20% of $25k = $5k)) ) = $120k - $50k = $70k given (58.3%)." **Conclusion:** His 50% ($60k) is *within* his discretionary zone but *below* his declared sacrifice point. The procedure shows he *could* give more (~$70k) without hitting "significant sacrifice" per his own definition. Whether he *does* is a value choice he must own. "Enough" isn't a fact; his current 50% represents choosing to keep $15k in discretionary comfort/security instead of giving it. The answer to "is it enough?" is "Not if you want to maximize impact per your stated goal; it's a choice to prioritize that $15k."

  **Member 2: Longtime 10% Giver, Needs to Drop to 5% for Child's Care**

  1.  **Goal:** Agrees.
  2.  **Survival Baseline:** Defines $40k (supports child's basic survival needs included).
  3.  **Stability Line:** *This is critical.* She defines $75k. This *must* include the **expensive ongoing care costs** as essential for the child's health/stability *and* her own ability to function/work as a caregiver. Probe: "Is $75k the level that covers the care, reliable housing/transport, prevents constant financial panic, and allows you minimal self-replenishment?" She confirms. *This is likely higher due to the care costs.*
  4.  **Reject Average:** Briefly discussed. She agrees it's irrelevant here; her child's needs dominate.
  5.  **Significant Sacrifice Threshold:** She struggles. Above $75k, *any* extra spending feels frivolous compared to her child's needs or potential savings for their future. She identifies $80k. The $5k gap ($75k-$80k) is for minor family treats, slightly better care options, or tiny savings buffer. Above $80k feels like "luxury we don't need." *Value Judgment:* Her child's wellbeing is paramount; her own comfort far less valuable than counterfactual good *or* her child's needs. Sacrifice starts *very* low for herself.
  6.  **Confront Trade-off & Commit:**
      *   Stability (Y) = $75k (inclusive of essential care). Significant Sacrifice (Z) = $80k kept. Discretionary Zone = $5k.
      *   She wants to give 5%. If income = $100k (example), 5% given = $5k, kept = $95k.
      *   $95k kept is $15k *above* her Z ($80k). She wants to keep $15k in her "luxury" zone.
      *   *Ask:* "Your Stability line, including essential care, is $75k. You feel spending above $80k is significant luxury relative to needs. Giving 5% ($5k on $100k income) means keeping $95k – $15k into that luxury zone. Is that $15k for things you *deeply* value for yourself/family beyond the child's core care and stability? Or could some of that $15k be reduced to allow higher giving? Remember, giving less means those funds *aren't* helping others in need." **Value Judgment Intensifies:** She might say, "Yes, I need that $15k for my child's *future* security or my own mental health as a caregiver." *This is her value choice.* The procedure shows that *if* the care costs are truly in the Stability Line ($75k), then keeping $95k is prioritizing $15k of personal/family comfort/security *beyond* stability over helping others. She must own that choice. If the care costs push the *true* Stability Line higher (e.g., $90k), then step 3 needs revisiting. **Conclusion:** The procedure forces clarity: *Is the care cost part of Stability or part of Discretionary?* If Stability (step 3), then dropping to 5% represents a choice to prioritize personal/family comfort *beyond* stability over giving. If the care cost *pushes the Stability Line up* closer to her income, then 5% might be all she can sustainably give. The key is rigorously defining step 3.

  **Member 3: Offered Hated Finance Job, Triples Giving Capacity**

  1.  **Goal:** Agrees.
  2.  **Survival Baseline:** Defines $40k (current lifestyle).
  3.  **Stability Line:** Defines $50k (adds buffer, current comfort level). He's happy here.
  4.  **Reject Average:** Agrees it's arbitrary.
  5.  **Significant Sacrifice Threshold:** This is about the *job*, not just spending. *Ask Revised:* "Where does the *personal cost* (misery, stress, lost time, values misalignment) of a job feel like a 'significant sacrifice' *compared* to the extra good the money could do? What specific aspects make the finance job 'hated'?" He identifies: soul-crushing work, 70hr weeks, unethical environment. He states this cost feels *very* high, like a major sacrifice of wellbeing and integrity. He values his time, mental health, and ethical alignment highly.
  6.  **Confront Trade-off & Commit:**
      *   Current Stability Kept: $50k. Current Giving: (e.g., 10% of $80k = $8k given? Need income). *Assume current income $80k, Stability $50k kept ($30k given? Clarify: Survival $40k? Stability $50k kept = $30k above survival?)*. Doesn't matter precisely.
      *   *Focus:* Tripling giving capacity means massive income jump. But at huge personal cost.
      *   *Ask:* "The finance job might let you give, say, $150k/year instead of $8k, but at a cost you describe as a 'significant sacrifice' of wellbeing and integrity. Per our goal (max impact), pure consequence might suggest taking it. But you clearly value avoiding that sacrifice highly. **Is preventing that personal cost worth *forgoing* the extra ~$142k in potential giving?** That's the core trade-off. There's no 'fact' here; it's your valuation of your wellbeing/integrity vs. the massive counterfactual good." **Blunt Conclusion:** The procedure can't decide. It starkly reveals the trade-off:
          *   **Option A (Take Job):** Maximal giving (~$150k), high personal sacrifice (misery, burnout risk, values violation). High impact, high cost *to giver*.
          *   **Option B (Reject Job):** Lower giving ($8k?), high personal wellbeing/alignment. Lower impact, lower cost *to giver*.
          *   **Option C (Seek Middle):** Is there a less-hated job that still increases giving significantly? (But not part of the scenario).
      *   *State:* "Consequentialism says Option A likely does more good *if* you can sustain it. But *you* must decide if the personal sacrifice is worth that good. The 'demand' is to recognize that rejecting Option A means you value your wellbeing/integrity more than the extra ~$142k/year in impact. That's a valid but heavy choice."

  **Key Takeaway for You:** This procedure doesn't give easy answers. It creates a structured space for members to confront the inherent tension in consequentialist giving: between the *potential* of their money and the *reality* of their lives and values. Your role is facilitator: ask the questions clearly, challenge gently but firmly where definitions seem loose, and hold up the mirror when they reach the Value Judgment steps. The "demandingness" becomes the demand for *honesty* about where they are choosing comfort over impact, and why. The "no-worse-than-average" rule is exposed as the comfort zone it is. The procedure works by making the trade-offs visible and forcing ownership of the choice to stop giving more.
