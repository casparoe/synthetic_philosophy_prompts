prompt: |-
  I am research counsel to a standing law reform commission in a common-law jurisdiction. Every year the commission receives a handful of references asking whether conduct whose principal alleged wrong is that it is immoral — not harmful in any way we can readily point to — should be made a criminal offence, should remain one, or should be decriminalized. Current references include consensual incest between adult siblings, sexual conduct between a person and an animal, and the public desecration of religious symbols. Our recommendations go to the Attorney-General, who treats them as presumptive; the commission is five members, one of whom holds that any conduct the community finds vile should stay on the books; we get roughly six weeks per reference; and we have no budget for original empirical work beyond what the statistics agency already publishes. I need a decision procedure a lawyer with no philosophy training can run in a day, and I need it to be honest about where it is doing philosophy rather than applying a test.

  Build it from the Devlin–Hart controversy over the enforcement of morals. Use Devlin's thesis that a shared morality is part of the social bond and may be enforced to prevent social disintegration, his standard of the ordinary person's intolerance, indignation, and disgust, and his concession that there remains a realm of private morality the law should leave alone; use Hart's reply that the disintegration claim is an empirical hypothesis rather than a premise, that a society can survive moral pluralism, and that we must distinguish the positive morality a community happens to hold from the critical morality we are entitled to defend. Supplement this with the later harm-and-offence distinction, so the procedure can separate conduct that wrongs identifiable persons, conduct that merely offends, and conduct that is condemned without either. Keep the procedure sensitive to the fact that the community's morality may be divided rather than shared, and give it a way to treat near-unanimity, bare majority, and genuine controversy differently. Note that our Supreme Court has struck down two morality-based offences in the last decade on privacy grounds, so the procedure must also flag constitutional vulnerability and say when that alone decides the matter.

  Deliver the procedure as ordered questions with what counts as a sufficient answer to each, the point at which it stops with a no, and the points at which it must hand the decision to the commissioners as a question of value rather than fact. Specify the output: a recommendation, a confidence level, and the triggers that require a written dissent.

  Then run it on all three references, including at least one where it reaches a conclusion the commission will not want. Finally, tell me where the procedure will misfire, which distinctions it had to flatten to be usable, and what it simply cannot settle.
reasoning: |-
  We are building a decision procedure based on the Devlin-Hart debate and later refinements (harm vs. offense), with attention to divided community morality and constitutional vulnerability. The procedure must be runnable by a lawyer in a day and be transparent about when it is doing philosophy.

  ## Core Elements from Devlin and Hart
  1. **Devlin's Thesis**: 
     - A shared morality is part of the social bond; without it, society disintegrates.
     - The standard for what is immoral is the ordinary person's feelings of intolerance, indignation, and disgust.
     - Concession: There is a realm of private morality that the law should not touch.

  2. **Hart's Critique**:
     - The social disintegration claim is an empirical hypothesis, not a given.
     - Societies can survive with moral pluralism.
     - We must distinguish between positive morality (what the community believes) and critical morality (what is rationally defensible).

  ## Additional Framework: Harm and Offense Principle (after Mill and Feinberg)
  - **Harm Principle**: Conduct that causes harm to others may be criminalized to prevent that harm.
  - **Offense Principle**: Conduct that causes offense to others may be regulated (but not necessarily criminalized) to prevent serious offense.

  We also need to account for:
  - **Divided Community Morality**: The community may not be unanimous. We must consider levels of consensus (near-unanimity, bare majority, genuine controversy).
  - **Constitutional Vulnerability**: The Supreme Court has struck down morality-based offenses on privacy grounds. So, if the conduct is private, it is constitutionally protected and should not be criminalized.

  ## Decision Procedure: Ordered Questions

  ### Step 0: Identify the Conduct
     - Clearly define the conduct in question. (This is a factual step.)

  ### Step 1: Is the Conduct Private or Public?
     - **Question**: Is the conduct typically occurring in a private setting, not visible to the public without intentional exposure?
     - **Sufficient Answer**: 
       - If **private**, then stop: the conduct should be **decriminalized** (due to constitutional vulnerability). 
          - Output: Recommendation to decriminalize, with high confidence (due to constitutional protection).
          - Note: This step alone decides the matter on constitutional grounds.
       - If **public**, proceed to Step 2.
       - If **mixed** (some instances private, some public), then for the private instances: decriminalize; for the public instances, proceed to Step 2.

  ### Step 2: Does the Conduct Cause Harm to Identifiable Persons?
     - **Question**: Does the conduct cause physical, psychological, or economic harm to individuals (other than the participants, if they consent) that is not trivial?
     - **Sufficient Answer**:
       - If **yes**, then the harm principle may justify criminalization. Proceed to Step 3 to see if it is already covered by existing offenses and Step 4 for proportionality.
       - If **no** (i.e., no harm to others beyond the participants and any harm to participants is consensual and not of a kind that the law typically forbids even with consent, e.g., extreme violence), then proceed to Step 5 (offense) and Step 6 (morality).

  ### Step 3: Is the Harm Already Covered by Existing Offenses?
     - **Question**: Is the harm caused by the conduct already addressed by existing criminal laws (e.g., assault, property damage, fraud)?
     - **Sufficient Answer**:
       - If **yes**, then stop: there is no need for a specific offense. Recommend **no new offense** and consider if existing laws are sufficient. If the existing laws are being applied to this conduct, then the status quo may be maintained without a specific offense. If the conduct is currently criminalized by a specific morality-based offense, then consider decriminalization and rely on existing offenses.
       - If **no**, then proceed to Step 4.

  ### Step 4: Proportionality of Criminalization for Harm
     - **Question**: Would criminalization of the conduct be a proportionate response to the harm? Consider:
          - The seriousness of the harm.
          - The availability of less restrictive means (e.g., civil remedies, regulation).
          - The costs of enforcement and the risk of overcriminalization.
     - **Sufficient Answer**:
       - This step requires judgment. If the harm is severe and criminalization is the only effective means, then criminalization may be justified. Otherwise, not.
       - If **yes** (proportionate), then recommend **criminalize or maintain**.
       - If **no**, then recommend **not to criminalize** or **decriminalize**.
       - **Note**: This step may involve value judgments and must be handed to the commissioners if there is significant disagreement on the proportionality assessment.

  ### Step 5: Does the Conduct Cause Offense?
     - **Question**: Does the conduct cause widespread and serious offense to others who are involuntarily exposed to it? (Note: This is about public conduct since private conduct was already addressed.)
     - **Sufficient Answer**:
       - If **no**, proceed to Step 6.
       - If **yes**, then consider:
          - Can the offense be avoided without banning the conduct (e.g., by time, place, manner restrictions)?
          - Is the offense so serious and unavoidable that it warrants criminal prohibition?
          - If criminalization is the only effective means and the offense is grave, then it may be justified. But note that the offense must be more than mere dislike; it must be a deep disturbance (Feinberg's "offense principle").
          - If the answer is **yes** (criminalization is warranted for offense), then proceed to Step 4 (proportionality) but note that the bar for criminalizing offense is higher than for harm.
          - If **no**, then proceed to Step 6.

  ### Step 6: Does the Conduct Violate Shared Morality? (Devlin's Test)
     - **Question**: Is the conduct regarded by the community with such intolerance, indignation, and disgust that it is seen as a threat to the social fabric? And is there a consensus?
     - **Sufficient Answer**:
       - First, assess the level of community consensus:
          - **Near-unanimity**: Overwhelming majority (e.g., 80% or more) condemns the conduct with strong feelings.
          - **Bare majority**: About 50-60% condemns, but a substantial minority does not.
          - **Genuine controversy**: The community is deeply divided (e.g., 40-60% split) or there is no clear majority.
       - Then, using Devlin's standard, ask: Would the ordinary person (reasonable person) feel intolerance, indignation, and disgust at the conduct?
          - If **near-unanimity and strong feelings**, then the conduct may be a candidate for criminalization on moral grounds, but note Hart's critique: this is an empirical claim about social disintegration. Proceed to Step 7.
          - If **bare majority or genuine controversy**, then stop: the conduct should **not be criminalized** on moral grounds because there is no shared morality to protect. The law should not enforce a morality that is not shared.
          - **Note**: Even if there is near-unanimity, we must still consider Step 7 (disintegration) and Step 8 (critical morality).

  ### Step 7: Is There a Risk of Social Disintegration? (Hart's Empirical Challenge)
     - **Question**: Is there evidence that failing to criminalize this conduct would lead to the disintegration of society? (Note: This is an empirical question but often speculative. We have no budget for original research, so we rely on available data and analogous situations.)
     - **Sufficient Answer**:
       - If **yes** (there is evidence, e.g., from other jurisdictions, historical examples, or expert consensus), then criminalization may be justified on Devlin's grounds.
       - If **no** (or the evidence is weak), then criminalization is not justified on the grounds of social disintegration.
       - **Note**: This step is highly uncertain. In the absence of evidence, we default to no. Also, Hart would argue that pluralistic societies can survive without criminalizing every immoral act.

  ### Step 8: Critical Morality (Hart's Filter)
     - **Question**: Even if the positive morality condemns the conduct, is there a defensible reason in critical morality to reject that condemnation? (e.g., the conduct is between consenting adults and does not harm others, so it is a matter of personal liberty.)
     - **Sufficient Answer**:
       - This step is philosophical and must be handed to the commissioners as a value judgment.
       - The lawyer can note arguments for and against, but the decision on whether critical morality overrides positive morality is for the commissioners.

  ### Step 9: Final Recommendation
     - **Output**:
          - **Recommendation**: Criminalize, maintain criminalization, decriminalize, or no action (if already covered by other laws).
          - **Confidence Level**: High, medium, low (based on the clarity of the answers in the steps).
          - **Triggers for Written Dissent**:
              - If the procedure reaches Step 8 (critical morality), then the commissioners must vote and any dissent must be written.
              - If there is a close call on the community consensus (e.g., between bare majority and near-unanimity) and this is pivotal, then a written dissent is required.
              - If the constitutional question (Step 1) is contested (e.g., on what counts as private), then a written dissent is required.

  ## Running the Procedure on the Three References

  ### Reference 1: Consensual Incest between Adult Siblings
  - **Step 0**: Conduct is sexual relations between adult siblings with full consent, in private.
  - **Step 1**: **Private** conduct. Stop. **Recommend decriminalize** with high confidence (constitutional grounds). 
    - Note: Even if some argue it might occur in non-private settings, the core conduct is private and constitutionally protected. If there is public behavior (e.g., openly claiming an incestuous relationship), that might be addressed as public offense, but the sexual act itself is private.

  ### Reference 2: Sexual Conduct between a Person and an Animal (Bestiality)
  - **Step 0**: Conduct is sexual acts between a human and an animal.
  - **Step 1**: Typically private? It can occur in private or in view of others. We must split:
    - **Private instances**: Step 1 would say decriminalize? But note: animals cannot consent. This leads us to Step 2 (harm).
  - **Step 2**: **Harm to identifiable persons?** 
    - The animal is a sentient being that may be harmed. Also, societal harm? But Hart would require harm to individuals. We focus on harm to the animal. 
    - If the jurisdiction recognizes animal welfare and has laws against animal cruelty, then this act may cause harm (physical or psychological) to the animal. **Answer: yes, harm.**
  - **Step 3**: Is the harm already covered? 
    - Check if animal cruelty laws exist and if they cover sexual abuse of animals. 
    - In many jurisdictions, they do. If so, then no need for a specific bestiality offense. **Recommend: rely on existing laws, decriminalize any specific bestiality offense if it exists.**
    - If there are no animal cruelty laws that cover this, then proceed to Step 4.
    - **Assume for argument there is an existing animal cruelty law that covers causing unnecessary suffering to animals. Then the specific bestiality offense is redundant. Recommend decriminalization of the specific offense.**
    - However, if the existing animal cruelty law does not cover sexual acts (e.g., if it only covers physical violence without sexual element) then we might need a specific law. But then Step 4: criminalization is proportionate? Given the harm to the animal, yes. Then recommend maintain or criminalize.

  But note: what about the morality aspect? The community may find it vile. However, the harm step already covers it. We don't need to go to morality.

  ### Reference 3: Public Desecration of Religious Symbols
  - **Step 0**: Conduct is the public desecration (e.g., burning, defacing) of religious symbols (like a crucifix, Quran, etc.) in a manner intended to be seen by others.
  - **Step 1**: **Public** conduct. Proceed to Step 2.
  - **Step 2**: **Harm?** 
    - Physical harm? Possibly not. Psychological harm? To religious adherents, it may cause deep distress. But is this harm or offense? 
    - We can consider it as psychological harm, but note that the harm is caused by the message and the act, not by direct physical impact. It is more appropriately categorized as offense.
    - Proceed to Step 5 (offense).
  - **Step 5**: **Offense?** 
    - Yes, it causes serious offense to adherents of that religion and possibly to others who value religious respect. 
    - Can it be avoided without banning? E.g., by restricting the time and place (e.g., not near a place of worship during services)? 
    - But the act is inherently public and intended to provoke. 
    - Is the offense so serious that it warrants criminalization? Consider: 
        - In a pluralistic society, the offense may be profound but must be balanced against freedom of expression. 
        - Many jurisdictions treat such acts as free speech (even if offensive) unless they incite hatred or violence. 
    - If the offense is severe and unavoidable, and the conduct serves no legitimate purpose (e.g., political protest might be a legitimate purpose), then criminalization might be considered. 
    - However, we note that the commission may not want to criminalize this because of free speech. 
    - Proceed to Step 6 for morality, but note that offense alone might not be enough for criminalization without a very high threshold.
  - **Step 6**: **Shared Morality?** 
    - The community may be divided. In a diverse society, some may see desecration as vile, others as a legitimate protest or free expression. 
    - Level of consensus: likely **genuine controversy** (e.g., in many Western democracies, such acts are protected as free speech). 
    - Therefore, stop: do not criminalize on moral grounds. 
    - But note: if there is near-unanimity in the jurisdiction, then we would proceed. However, in a common-law jurisdiction with a history of free speech, it is more likely to be controversial. 
    - Output: **Do not criminalize** (or decriminalize if currently an offense). 
    - However, if the offense step (Step 5) suggests that it causes grave offense and cannot be avoided, and the consensus is strong, then we might proceed to Step 7. But given the controversy, we stop at Step 6.

  ## Where the Procedure Misfires, Flattened Distinctions, and What It Cannot Settle

  ### Misfires:
  1. **Step 1 (Privacy)**: If the definition of "private" is stretched (e.g., a public park at night might be considered semi-private), then the constitutional protection might be overapplied or underapplied.
  2. **Step 7 (Social Disintegration)**: Without empirical data, this step becomes speculative. The lawyer must rely on anecdotal or historical evidence, which may be unreliable.
  3. **Step 8 (Critical Morality)**: This step is entirely philosophical and may lead to inconsistent outcomes depending on the commissioners' personal views.

  ### Flattened Distinctions:
  1. **Harm vs. Offense**: The line between psychological harm and offense is blurred. The procedure forces a binary choice.
  2. **Community Consensus**: The procedure simplifies community sentiment into three categories, which may not capture nuances (e.g., regional variations, intensity of feeling).
  3. **Animal Welfare**: In the bestiality example, the procedure relies on existing animal cruelty laws. But if those laws are weak, the procedure might not adequately address the harm to animals.

  ### What It Cannot Settle:
  1. **Deep Value Conflicts**: When critical morality is at odds with positive morality, the procedure hands it to the commissioners without a clear method.
  2. **Emerging Harms**: If a conduct is not currently harmful but might lead to harm in the future (e.g., through normalization), the procedure does not account for that.
  3. **Indirect Harms**: Harms that are diffuse or societal (e.g., erosion of trust) are hard to fit into the harm step.

  Overall, the procedure provides a structured way to analyze the references but requires the lawyer to exercise judgment at several points, especially when the answers are not clear-cut. It is honest about the philosophical underpinnings by explicitly invoking Devlin and Hart and by flagging when a question is empirical (Step 7) or value-laden (Step 8).
answer: |-
  Below is a decision procedure built from the Devlin-Hart debate, supplemented by the harm-offense distinction, and tailored to your constraints. The procedure is designed for a lawyer without philosophy training to execute in one day. It explicitly flags when it engages in philosophy (value judgments) versus empirical or legal analysis, and incorporates constitutional vulnerability, community consensus levels, and Devlin's "ordinary person" standard. 

  ---

  ### **Decision Procedure: Morality-Based Criminalization**

  #### **Output Specifications**
  - **Recommendation**: Criminalize (new offense), Maintain (existing offense), Decriminalize, or No Action (not criminalized and no need to be).
  - **Confidence Level**: High (clear answers), Medium (some ambiguity), Low (highly contested).
  - **Written Dissent Triggers**: 
    1. Procedure reaches Step 5 (critical morality/value judgment).
    2. Constitutional vulnerability is contested (Step 1).
    3. Community consensus is ambiguous (Step 3).
    4. Commissioners override the procedure's recommendation.

  #### **Ordered Questions**
  **Step 1: Constitutional Vulnerability (Privacy)**  
  *Question*: Is the conduct inherently private (non-public, consensual, non-commercial, and not recorded/distributed)?  
  - **Sufficient Answer**:  
    - **Yes** → **Decriminalize** with *high confidence*. Stop. (Per Supreme Court precedent).  
    - **No** → Proceed to Step 2.  
  - **Philosophy Alert**: None. Pure legal test.  
  - **Stop/Handoff**: Stops if "Yes." Proceeds if "No."

  **Step 2: Harm Assessment**  
  *Question*: Does the conduct cause *direct, non-consensual harm* to an identifiable person (physical, psychological, or economic)?  
  - **Sufficient Answer**:  
    - **Yes** → Proceed to Step 6 (proportionality).  
    - **No** → Proceed to Step 3 (offense assessment).  
  - **Philosophy Alert**: Minimal (defining "harm" may involve values, but focus on tangible evidence like medical or crime data).  
  - **Stop/Handoff**: Proceeds regardless.

  **Step 3: Offense Assessment**  
  *Question*: Does the conduct cause *widespread, unavoidable offense* (e.g., public acts forcing involuntary exposure)?  
  - **Sufficient Answer**:  
    - **Yes** → Proceed to Step 6 (proportionality).  
    - **No** → Proceed to Step 4 (morality assessment).  
  - **Philosophy Alert**: Low (offense is measured by public reaction, e.g., complaints, media, or surveys).  
  - **Stop/Handoff**: Proceeds regardless.

  **Step 4: Devlin’s Morality Test (Social Bond)**  
  *Question*: Does the conduct violate the community’s shared morality to the point of provoking "intolerance, indignation, and disgust" in the "ordinary person"?  
  - **Sufficient Answer**:  
    - **Yes** → Proceed to Step 5.  
    - **No** → **Decriminalize or No Action** with *medium confidence*. Stop.  
  - **Philosophy Alert**: Moderate (defining "ordinary person" is normative; relies on proxies like polls or legislative debates).  
  - **Stop/Handoff**: Stops if "No." Proceeds if "Yes."

  **Step 5: Hart’s Empirical & Critical Filters**  
  *Question 5A (Disintegration Risk)*: Is there *evidence* that failing to criminalize would cause "social disintegration" (e.g., historical precedents, expert studies, or crime statistics)?  
  *Question 5B (Critical Morality)*: Even if the community condemns it, is the condemnation defensible by *reason* (e.g., protects autonomy, avoids discrimination)?  
  - **Sufficient Answers**:  
    - **5A: No evidence** → **Decriminalize or No Action** with *low confidence*.  
    - **5A: Evidence** → Proceed to 5B.  
    - **5B: Indefensible** → **Maintain or Criminalize** with *low confidence*.  
    - **5B: Defensible** → **Decriminalize or No Action** with *medium confidence*.  
  - **Philosophy Alert**: High (both questions involve value judgments: 5A requires speculative sociology; 5B requires critical ethics).  
  - **Stop/Handoff**: Hands off to commissioners for final vote. Written dissent required.

  **Step 6: Proportionality & Existing Laws**  
  *Question*: Is criminalization *necessary and proportionate* (e.g., no less restrictive alternatives)? Does existing law already cover the harm/offense?  
  - **Sufficient Answer**:  
    - **Yes** → **Maintain or Criminalize** with *high confidence* if harm/offense is clear.  
    - **No** → **Decriminalize or No Action** with *medium confidence*.  
  - **Philosophy Alert**: Low (legal pragmatism; relies on statutory review).  
  - **Stop/Handoff**: Final step if reached.

  ---

  ### **Applying the Procedure to the References**
  #### **1. Consensual Incest (Adult Siblings)**  
  - **Step 1**: **Private** → **Decriminalize** with high confidence. Stop.  
  - *Output*: Recommend decriminalization. Confidence: High. No dissent triggers.  
  - **Why commissioners may resist**: Moral revulsion; but constitutionally settled.

  #### **2. Sexual Conduct with Animals**  
  - **Step 1**: **Not inherently private** (can occur in public/recorded) → Proceed.  
  - **Step 2**: **Harm?** Animals cannot consent; evidence of physical harm exists → Proceed to Step 6.  
  - **Step 6**: Existing animal cruelty laws often cover this → **No Action** (rely on existing laws). Confidence: Medium.  
  - *Output*: Recommend no new offense; maintain if covered by cruelty laws. Confidence: Medium.  
  - **Why commissioners may resist**: Devlin’s "disgust" test may override harm analysis for some.

  #### **3. Public Desecration of Religious Symbols**  
  - **Step 1**: **Public** → Proceed.  
  - **Step 2**: **Harm?** No direct physical harm → Proceed.  
  - **Step 3**: **Offense?** Widespread offense likely → Proceed to Step 6.  
  - **Step 6**: Existing public order laws may cover disruptions → **No Action** if covered. Else, criminalization may be disproportionate (free speech concerns) → **Decriminalize/No Action**.  
  - **Step 4/5 Bypassed?** Not needed if offense is actionable. But if not:  
    - **Step 4**: Devlin’s test: "Disgust" likely, but **community consensus?** Genuine controversy (not near-unanimity) → **Stop: Decriminalize**.  
    - If consensus unclear, proceed to Step 5:  
      - **5A**: No evidence of disintegration (pluralistic societies tolerate protests) → **Decriminalize**.  
      - **5B**: Critical morality favors free expression → **Decriminalize**.  
  - *Output*: Recommend decriminalization. Confidence: Low (due to consensus ambiguity). Triggers written dissent (Step 5/value judgment).  
  - **Why commissioners may resist**: Symbolic harm to religious unity; Devlin’s social bond argument.

  ---

  ### **Limitations of the Procedure**  
  1. **Misfires**:  
     - **False Positives**: Over-criminalization where "disgust" is loud but not universal (e.g., LGBTQ+ conduct in divided communities).  
     - **False Negatives**: Ignores indirect harms (e.g., normalization of incest impacting family structures) due to strict harm definition.  

  2. **Flattened Distinctions**:  
     - **Harm vs. Offense**: Treats psychological "harm" and "offense" as binary, ignoring severity gradations.  
     - **Consensus Levels**: Simplifies "community" to majority/minority, missing nuance (e.g., cultural subgroups, intensity of feeling).  
     - **Devlin’s "Ordinary Person"**: Assumes a homogenous societal view; flattens minority perspectives.  

  3. **What It Cannot Settle**:  
     - **Critical Morality (Step 5B)**: Cannot resolve conflicts between autonomy (Hart) and social cohesion (Devlin); defers to commissioners.  
     - **Empirical Gaps (Step 5A)**: Cannot prove "disintegration" without data; relies on anecdotes.  
     - **Emerging Issues**: Fails for novel conduct (e.g., digital immorality) with no consensus or data.  

  This procedure prioritizes constitutional boundaries and harm/offense principles, pushing morality to the end. It mitigates philosophy-heavy steps with consensus filters and hands off irreconcilable value judgments. It is most reliable for clear-cut privacy/harm cases and least for contested moral issues (e.g., religious desecration), where dissent is inevitable.
