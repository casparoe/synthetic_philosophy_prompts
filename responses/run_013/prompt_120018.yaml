prompt: |-
  A friend of mine argues that a region's right to secede is simply the collective form of an individual's right to run her own life: if no one may conscript me into a life I reject, then no majority may hold a people inside a state it rejects, and a referendum won by the secessionists settles the matter, the rest of the state having no veto over another's self-determination. He goes further and says this is precisely why the costs to the remainder of the state — lost revenue, an unfriendly neighbour, unsettled borders — cannot count against secession, since we do not let third parties veto a person's choices. He treats the individual-autonomy analogy as carrying the whole argument. I want an audit rather than an endorsement: set out the correspondences explicitly (a table is fine), saying what stands in for the individual, for her life, for her body, for the coercion, and for the options she is entitled to; then say where the mapping fails, and sort the failures into those that bear on his conclusion and those that are merely picturesque. Does the conclusion survive a repaired version of the analogy, and would some other analogy — divorce, a club, a dissolving partnership — carry more of the weight? Close by stating how confident you are in each of your main claims and identify the point you are least sure of.
reasoning: |-
  Hmm, this is a sophisticated political philosophy question about the ethics of secession. My friend is making a strong analogy between individual autonomy and collective self-determination. He argues that just as individuals have the right to control their own lives without third-party veto, regions should have the right to secede via referendum regardless of costs to the original state. The user wants me to audit this argument - not endorse it - by mapping the analogy, identifying where it fails, testing repairs, and suggesting alternative comparisons.

  Breaking this down: First, I need to explicitly map the analogy components as requested. The individual is the region, her life is the political status, her body is the territory, coercion is forced union, and choice options are independence vs status quo. A table would be clearest here.

  Then I must identify where this mapping strains or breaks. Key failures include: the "collective self" problem (who constitutes "the people" with standing?), the indivisible territory issue (unlike bodies, land can be partitioned), non-uniformity of political identity within regions, and most critically - the non-parallel of costs. Individual choices rarely dissolve shared institutions and assets, while secession inherently does. This cost asymmetry directly challenges his "no veto" claim.

  I should test if the analogy holds with repairs: What if we imagine the region as a previously sovereign entity? Or require supermajorities? But these patches don't fully resolve the institutional rupture problem. Alternative analogies like divorce (shared assets division), clubs (voluntary exit), or partnerships (dissolution procedures) handle interdependence better but introduce new issues - states aren't purely voluntary like clubs.

  For confidence levels: I'm highly sure about the core failures (collective identity, cost impact) as they're well-established in secession theory. Least certain is whether divorce/federation analogies fully salvage the argument - that depends on contested views of state legitimacy.

  The conclusion? In its raw form, the analogy fails precisely where it claims certainty - third-party costs DO matter because states are shared projects. But with major qualifications (historical context, disproportionate oppression), a limited right to secede survives. The user gets an audit, not a verdict.
answer: |-
  Here's a comprehensive audit of your friend's argument, structured as requested:

  ### 1. Correspondence Table: Individual Autonomy ↔ Secession Analogy
  | **Individual Autonomy Concept** | **Corresponds to... in Secession** | **What It Stands For** |
  |----------------------------------|-----------------------------------|------------------------|
  | The Individual                   | The Seceding Population/Region    | The collective entity claiming self-determination |
  | Her Life                         | The Political Status/Governance   | The fundamental conditions of existence and identity |
  | Her Body                         | Territory & Resources             | The physical manifestation of the collective "self" |
  | Coercion                         | Forced Union/Denied Secession     | Unwanted political subjugation by the larger state |
  | Options Entitled To              | Independence vs. Continued Union  | The binary choice of political affiliation |
  | Third-Party Veto                 | State/Remainder Veto over Secession | External denial of self-determination choice |

  ### 2. Where the Mapping Fails
  **A. Failures Bearing on the Conclusion**  
  1. **Indivisibility of Territory vs. Bodily Autonomy**:  
     - *Failure*: An individual's body is inseparable; territory is divisible and contested.  
     - *Bearing*: Raises questions about borders, resource allocation, and minority rights *within* the seceding region. Undermines the "clean break" assumption.  
     - **Confidence: High**  

  2. **Non-Voluntary Membership**:  
     - *Failure*: Individuals are born into states, not conscripted like soldiers. Citizenship involves diffuse benefits/obligations.  
     - *Bearing*: Weakens the "conscription" analogy. States aren't purely coercive; they provide security/infrastructure.  
     - **Confidence: High**  

  3. **Collective Action Problem**:  
     - *Failure*: "The people" isn't monolithic. A 50%+1 referendum imposes secession on dissenters *within* the region.  
     - *Bearing*: Contradicts individual autonomy logic by creating new coerced minorities.  
     - **Confidence: High**  

  4. **Shared Institutions & Locked-In Costs**:  
     - *Failure*: States build shared assets (debt, infrastructure, defense). Unlike individual choices, secession dismantles these.  
     - *Bearing*: Directly refutes "costs can't count." Third parties *are* materially harmed by institutional rupture.  
     - **Confidence: High**  

  **B. Merely Picturesque Failures**  
  1. **Scale of Consequences**: Individual choices rarely destabilize economies or trigger border conflicts.  
  2. **Identity Fluidity**: "Peoples" are constructed and contested; individual identity is more stable.  
  3. **Enforcement Mechanism**: Bodily autonomy relies on state protection; secession rejects that authority.  

  ### 3. Does the Conclusion Survive a Repaired Analogy?  
  - **Repaired Version**: Require supermajorities (e.g., 67%), protect internal minorities, settle asset/debt division *before* secession, and ensure contiguous/viable territory.  
  - **Survival?**: The core conclusion ("no veto based on costs") **fails**. Even repaired:  
    - Historical grievances or oppression might justify ignoring costs (e.g., decolonization).  
    - Absent such factors, the remainder state's existential interests (e.g., strategic security, economic viability) create legitimate grounds for negotiation/veto.  
    - **Confidence: High** for cost-bearing; **Moderate** for viability of repaired model.  

  ### 4. Alternative Analogies  
  | **Analogy** | **Strengths** | **Weaknesses** | **Weight-Bearing Capacity** |  
  |-------------|---------------|----------------|-----------------------------|  
  | **Divorce** | Asset division, negotiated terms | Assumes prior voluntary union; states aren't marriages | Medium (handles costs better) |  
  | **Club Membership** | Voluntary exit, no-fault separation | States aren't voluntary; ignores shared history | Low |  
  | **Dissolving Partnership** | Liability allocation, mutual consent | Doesn't address territoriality; implies co-equal power | Medium-High |  
  | **Tenant Leaving Lease** | Contractual obligations | Overlooks collective identity; trivializes sovereignty | Low |  

  **Best Alternative**: **Dissolving Partnership** carries the most weight:  
  - Partners must settle debts/assets.  
  - Requires good-faith negotiation.  
  - Doesn't demand "oppression" to justify dissolution.  
  - **Confidence: Moderate-High**  

  ### 5. Overall Confidence & Least Sure Point  
  - **Confidence in Main Claims**:  
    - Critique of cost irrelevance: **High**  
    - Collective identity ≠ individual autonomy: **High**  
    - Necessity of negotiated settlement: **High**  
    - Viability of divorce/partnership analogies: **Moderate**  
  - **Least Sure Point**: Whether *any* analogy fully resolves the **democratic boundary problem** (who gets to vote in the referendum?). Individual autonomy has no parallel for defining the "self" that chooses.  
    - **Confidence Level on This**: Low-Moderate (philosophically contested)  

  ### Conclusion  
  Your friend's analogy **fails critically** where it claims costs are irrelevant and a simple referendum suffices. Secession inevitably harms third parties (remainder-state citizens, internal minorities) in ways individual choices do not. While autonomy principles provide *some* foundation for self-determination, they cannot ignore the material and institutional entanglements of statehood. A defensible secession right requires:  
  1. Remedying grave injustice *or*  
  2. A negotiated exit respecting shared liabilities,  
  ...neither reducible to individual autonomy logic. The dissolution-of-partnership analogy better accommodates these complexities.
