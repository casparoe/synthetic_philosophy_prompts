          Therefore, to get a necessary identity, we need both designators to be rigid. Essentialism alone does not make the identity necessary.

     Hence, in the standard examples of necessary a posteriori identities, the rigidity of the designators is what directly accounts for the necessity. The essentialism comes in to explain why the object must have the property that we discovered it to have (and thus why the identity holds in the actual world and hence in all worlds). But without rigidity, the identity wouldn't be necessary.

