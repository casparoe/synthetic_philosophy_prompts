  We are comparing two theses: rigid designation and essentialism.

   1. Rigid designation: A term is rigid if it designates the same object in every possible world in which that object exists (and designates nothing in worlds where the object does not exist). In the case of a name introduced by description (like "the cause of such-and-such observable effect"), if that name is rigid, then it refers to the same entity in every possible world in which that entity exists, regardless of how we describe it.

   2. Essentialism: An object has a property essentially if it could not exist without having that property. For example, if having a particular internal structure is essential to being that object, then in any possible world where that object exists, it must have that structure.

   Now, consider the example: 
     - We introduce a name, say "X", for whatever produces a certain observable effect E. At this point, we don't know what X is.
     - Later, we discover that the underlying structure S (say, a specific molecular structure) is what produces E. Then we form the identity statement: "X = S".

   We want to know: Why is the identity statement "X = S" necessary? (Assuming it is necessary.)

   According to Kripke (who introduced the notion of rigid designation and defended essentialism about origins and constitution), the necessity of such identities comes from two things:
     (a) The rigidity of the name "X": Once we fix the reference of "X" to the actual thing that causes E, then in every possible world, "X" refers to that same thing.
     (b) The essential properties of the thing: The thing that actually causes E (which we now know is S) has its internal structure essentially. That is, it couldn't exist without having structure S.

   But are these two theses independent? Can we have one without the other? And in the standard examples, which one is doing the explanatory work?

   Step 1: What each thesis says about the identity "X = S":

     - Rigid designation: If "X" is rigid and "S" is rigid (assuming "S" is also a rigid designator, like a proper name or a natural kind term), then the identity statement "X = S" is necessarily true if true at all. Why? Because in every possible world, "X" refers to the same object O and "S" refers to the same object O, so they co-refer in every world.

     - Essentialism: The essentialist thesis, as applied here, would say that the object O (which is the referent of both "X" and "S") has the property of having structure S essentially. So in every world where O exists, it has S. But note that essentialism alone does not tell us about the reference of names. It only tells us about the properties of the object.

   However, note that the rigidity of the designators is what secures that we are talking about the same object across worlds. Without rigidity, the names might shift reference and the identity might not hold in all worlds.

   Step 2: Construct a case where the two theses deliver different verdicts.

     We need a scenario where rigid designation and essentialism come apart. 

     Consider:
       Let "X" be a rigid designator introduced by the description "the cause of effect E". In the actual world, the cause of E is a particular structure S. So we set: X = S.

       Now, suppose that we have a non-essentialist view about the structure S. That is, we think that the object that is actually S could have existed without having structure S. For example, we might think that a particular sample of water (which actually has the structure H2O) could have had a different structure (say, XYZ) and still be the same sample of water? But note: Kripke would deny this. He holds that the structure is essential.

     However, let's try to imagine an alternative. Suppose we have a kind of entity that is defined by its function rather than its structure. For example, let E be the effect of quenching thirst. We introduce "Aqua" for whatever it is that actually quenches thirst. In the actual world, Aqua is H2O. But we might think that in some other possible world, the same substance (the same stuff that in the actual world is H2O) could have been XYZ and still quench thirst? But wait, that doesn't make sense because if it's the same substance, then it must have the same structure? Not necessarily? We have to be careful.

