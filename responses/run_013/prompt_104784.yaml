          Boffin = Smith (in the actual world)

     Now, is "Boffin" rigid? If we introduced "Boffin" as a rigid designator for the actual inventor, then in every world, "Boffin" refers to Smith (if Smith exists in that world). But in a world where Smith did not invent the widget, he is still Boffin? But note: the description "the inventor of the widget" might be satisfied by someone else in that world. However, if "Boffin" is rigid, it refers to Smith regardless.

