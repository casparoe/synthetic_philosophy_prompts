prompt: |-
  I have been reading the arguments about levels of selection—gene versus organism versus group—for years now, and I have come to suspect that most of the disagreement is downstream of people not agreeing on what a theory in this area is even supposed to deliver. Before I read another round of dueling examples, I want the specification on the table. So: write out the desiderata that any adequate account of selection acting at a level must meet. For each requirement, give the case or consideration that motivates it, say whether it is non-negotiable or merely a preference of one camp, and flag any pair of requirements you think cannot be jointly satisfied—that last part is the thing I most want, because I suspect the whole dispute is one of those situations where the list itself is the result. And if it turns out to be a verbal dispute dressed up as an empirical one, say so plainly.

  The requirements should at minimum cover: what it takes for a trait to be selected for the good of a unit at some level rather than merely correlated with that unit's success; the difference between what gets copied and what gets selected; whether a level has to be heritable to count as a level at all; how selection is to be told apart from drift at each level; and whether the theory is meant to be a criterion I can apply to a concrete case or a redescription of a result I already have.

  The cases it has to adjudicate are where I would test it:

  - Opposed selection within a single lineage: a mutation that proliferates inside a tissue while reducing the survival of the organism that carries the tissue. Both levels are doing real causal work simultaneously, and the theory should be able to say that rather than pick a winner.
  - Community-level bottlenecks: two microbial species, each producing something the other needs, propagated by transferring the whole consortium every generation, with cheaters that outgrow cooperators inside each consortium. The consortium is heritable and its productivity varies. I want to know whether that makes it a unit of selection, and whether the answer turns on anything about whether it counts as an organism.
  - Small demes: high variance in deme productivity, no heritable differences between demes. Can the theory avoid calling drift group selection, and equally avoid calling every group-level covariance a group adaptation?
  - Ledger equivalence: the same total evolutionary change can be decomposed as selection among individuals or among groups, with identical numbers but different labels for which level is doing the work. The theory has to tell me whether that label disagreement is a fact about the world or a fact about the formalism, and if the latter, whether it dissolves the debate or merely relocates it.

  Finally, tell me which single requirement does the most work in excluding candidate theories, and which of the usual positions—gene's-eye, multilevel, pluralist—survives the list best. Keep the scoring brief; the criteria are the deliverable.
reasoning: |-
  Hmm, the user has been grappling with the levels of selection debate for years and suspects the core disagreement stems from undefined desiderata. They want a rigorous specification of requirements before engaging with more examples. This is a sophisticated request that cuts to the philosophical foundation of evolutionary theory.

  The user is clearly frustrated with circular debates and wants to expose any fundamental tensions in the desiderata themselves. Their four test cases are well-chosen stress tests: intra-organism conflict, microbial consortia, small demes with drift, and ledger equivalence. These cover both biological realism and conceptual boundaries.

  Key demands include:
  - Distinguishing selection-for from mere correlation
  - Separating copying from selection
  - Handling heritability requirements
  - Differentiating selection from drift
  - Clarifying if the theory is predictive or descriptive

  The mention of "ledger equivalence" suggests they've encountered Price equation decompositions and want to know if the labeling is ontological or instrumental. This might be where the verbal dispute accusation lands.

  For the desiderata, I'll need to isolate at least five non-negotiable requirements:
  1) Causal specificity - must distinguish selection from byproducts
  2) Heritability constraint - likely non-negotiable for Darwinian processes
  3) Drift-testability - crucial for empirical application
  4) Outcome independence - to handle ledger equivalence
  5) Level autonomy - for simultaneous opposing selection

  The microbial consortium case will challenge requirement 2 (heritability), while small demes will stress requirement 3 (drift distinction). Requirement 4 (outcome independence) directly addresses their ledger equivalence concern.

  I suspect requirement 2 (heritability) does the most exclusionary work - it immediately disqualifies theories that attribute selection to units without inheritance. This favors multilevel selection over strict pluralism.

  The gene's-eye view survives requirement 1 (causal specificity) well but struggles with requirement 5 (level autonomy) when opposing selection occurs simultaneously. Multilevel selection handles the test cases most robustly, though ledger equivalence remains philosophically thorny.

  The verbal dispute aspect emerges most clearly in ledger equivalence - the same mathematical decomposition can wear different "causal clothes" depending on researcher preferences. But this doesn't dissolve the debate; it just relocates it to the choice of decomposition framework.
answer: |-
  Below are the core desiderata for any adequate account of selection at a level, derived from your constraints and test cases. Each requirement is motivated by foundational evolutionary problems, with their negotiability status and conflicts flagged. The scoring against major theories follows.

  ---

  ### **Desiderata for Levels of Selection Accounts**

  1. **Causal Specificity Requirement**  
     *What it must deliver*: Distinguish traits *selected for* their functional benefit to a unit (e.g., altruism benefiting groups) from traits *correlated* with unit success (e.g., tall trees in fertile soil).  
     *Motivation*: Avoids the "correlation vs. causation" fallacy (e.g., group success due to individual traits).  
     *Non-negotiable?* **Yes**. Without this, selection is indistinguishable from drift or spurious association.  
     *Conflict*: Tensions with requirement 5 (outcome independence).  

  2. **Heritability Constraint**  
     *What it must deliver*: A level must exhibit heritable variation in fitness for selection to act *at that level*.  
     *Motivation*: Darwinian evolution requires inheritance; e.g., sterile worker ants inherit traits via queen's genes, not group "inheritance."  
     *Non-negotiable?* **Yes** for selection *acting at* the level. Heritable fitness differences are definitional.  
     *Conflict*: Challenges group selection in "small demes" (test case 3) if groups lack heritability.  

  3. **Drift-Selection Demarcation**  
     *What it must deliver*: Differentiate selection from drift *at every level*.  
     *Motivation*: Prevents mislabeling stochastic effects (e.g., random group extinctions) as group adaptations.  
     *Non-negotiable?* **Yes**. Essential for empirical applicability.  
     *Conflict*: Hard to satisfy in small demes (test case 3) without heritable variation.  

  4. **Outcome Independence**  
     *What it must deliver*: The theory must not presuppose which level is "real" based on pre-existing decomposition (e.g., Price equation ledger equivalence).  
     *Motivation*: Ledger equivalence (test case 4) shows the same outcome can be partitioned differently.  
     *Non-negotiable?* **Yes** to avoid circularity.  
     *Conflict*: Undermines theories insisting one level is "fundamental."  

  5. **Level Autonomy**  
     *What it must deliver*: Acknowledge simultaneous, opposing selection at multiple levels (e.g., test case 1: cancerous mutations).  
     *Motivation*: Biology has nested conflicts (genes vs. cells vs. organisms).  
     *Non-negotiable?* **Yes** for biological realism.  
     *Conflict*: Gene-centric views struggle here.  

  ---

  ### **Handling Your Test Cases**
  - **Opposed selection (test case 1)**: Requirement 5 (autonomy) forces the theory to recognize both levels (e.g., mutation selected *at cell level*, organism selected *against*).  
  - **Community bottlenecks (test case 2)**: Requires desideratum 2 (heritability): if the *consortium* has heritable fitness variation (e.g., productivity differences transmitted to "offspring" consortia), it qualifies. "Organism" status is irrelevant.  
  - **Small demes (test case 3)**: Desideratum 3 (drift demarcation) blocks calling drift "group selection." No heritable variation? Then no selection, only drift.  
  - **Ledger equivalence (test case 4)**: Desideratum 4 (outcome independence) shows the label disagreement is **formal, not ontological**. The debate is relocated to *causal adequacy* (desideratum 1).  

  ---

  ### **Theory Scoring & Key Exclusions**
  - **Most exclusionary requirement**: **Heritability Constraint (2)**. It immediately disqualifies:  
    - Theories calling non-heritable groups "units of selection" (e.g., naïve group selection).  
    - "Selection" claims where fitness differences lack inheritance (e.g., random group extinctions).  
  - **Gene’s-eye view** (Dawkins):  
    - ✅ Excels at causal specificity (1) and drift demarcation (3).  
    - ❌ Fails autonomy (5): cannot handle simultaneous opposing selection (e.g., cancer).  
  - **Pluralism** (Gould, Okasha):  
    - ✅ Aces autonomy (5) and ledger equivalence (4).  
    - ❌ Risks violating heritability (2) and drift demarcation (3) if levels lack inheritance.  
  - **Multilevel Selection** (Wilson, Sober):  
    - ✅ Best satisfies autonomy (5) and heritability (2) when levels are defined rigorously.  
    - ❌ Struggles with ledger equivalence (4) if presented as "true" decomposition.  

  **Survivor**: **Multilevel Selection (MLS)**. It uniquely satisfies all non-negotiables *if* levels are restricted to heritable units with causal efficacy. Pluralism survives only if it enforces heritability; gene-centric views fail autonomy.  

  ---

  ### **Verbal Dispute? Partly.**  
  The debate is **not purely verbal** (desiderata 1–3 are empirical). However, ledger equivalence (4) exposes a **formal indeterminacy**: the same math describes different causal stories. This doesn’t dissolve the debate but forces it onto causal specificity (1) and heritability (2)—which *are* resolvable. **The conflict arises because no theory satisfies all desiderata perfectly; MLS comes closest by enforcing constraints.**  

  **Deliverable**: A theory must be **testable** (desiderata 1–3) and **causally rigorous** (4–5), not just redescriptive. Your "concrete criterion" demand is met by heritability + causal specificity.
