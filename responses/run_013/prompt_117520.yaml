prompt: |-
  I took up philosophy of science after thirty years in an atomic physics laboratory, and for the past year I have been sitting in on a graduate seminar on chance and credence, where the reference class problem will not go away. As I understand it, the difficulty is this: to assign a probability to a particular event — this patient's recovery, this coin's landing heads — one must place the individual in some class of similar cases and read a frequency off that class; but any individual belongs to indefinitely many such classes, and the frequencies need not agree, so it begins to look as though there is no fact of the matter about the single-case probability at all. What has struck me is that the participants who want to insist the problem is merely technical — that there really is a correct probability and we have simply to identify the right class — keep reaching for an analogy from physics, and I confess I have begun using it myself. The analogy runs as follows. Every physical event has a complete description, namely the full microphysical state of the system; once one has that, there is no further question as to which description is *the* description, since the coarse-grained, macroscopic accounts are merely lossy summaries of the complete one. So, the argument continues, there must likewise be a maximally specific reference class, the analogue of the complete state, and the correct single-case probability is the one determined by that class; the familiar classes — age, sex, smoking history — are just coarse-grainings, and the fact that they disagree no more threatens the objectivity of chance than the fact that the temperature of a gas is a coarse-grained summary threatens the objectivity of the molecular description.

  I should like you to audit this analogy rather than defend or attack the conclusion directly. Set out the correspondence explicitly, and a small table is welcome: what in the statistical case plays the role of the complete state, of a coarse-grained description, of the coarse-graining map itself, and of the privileged status that the complete description is supposed to enjoy. Then tell me where the mapping breaks, and — this is the part I care most about — which of the breaks are idle and which actually bear on the use to which I put the analogy, namely licensing the claim that a principled, non-pragmatic choice of reference class exists. I am already suspicious of one thing and would like you to say whether it is the decisive break or whether I have misidentified it: the maximally specific class would appear to be the class containing only this individual, whose frequency is 0 or 1 and so tells us nothing, whereas a complete microphysical state is maximally informative; if that is right, the analogy may point away from the conclusion rather than toward it. Finally, tell me what a better analogy would be, if there is one. I have heard the reference class problem compared to the problem of selecting which factors are the relevant ones in a causal explanation, and to the choice of a prior, but I have no idea whether either comparison is any improvement. Do not bother with references or a reading list; I shall chase those down myself, and I want the argument rather than the scholarship. Keep the whole reply to at most 800 words, and put your verdict in the first two sentences.
reasoning: |-
  Hmm, the user is a physicist-turned-philosopher grappling with the reference class problem in probability. They've noticed their seminar peers using a physics analogy to argue for an objective "maximally specific reference class," and they want me to audit this analogy critically. 

  First, I need to unpack the physics analogy they've described: complete microstate → privileged truth, coarse-grained descriptions (like temperature) → imperfect summaries. The statistical parallel would be: maximally specific reference class → objective chance, conventional classes (age/sex/etc.) → coarse approximations. 

  But their suspicion points to the core flaw: a singleton class (only this individual) has trivial 0/1 frequency yet reveals nothing about probability, whereas a microstate gives maximal information. That's not just a break—it's fatal because the analogy's very premise (maximal specificity = maximal informativeness) collapses in statistics. 

  Beyond that, three other breaks matter: (1) Physics has deterministic laws making microstates causal; probability has no such underlying determinism. (2) Coarse-graining in physics is well-defined (e.g., averaging momentum); in statistics, "similarity" is context-dependent. (3) Microstates are physically measurable (in principle); maximally specific classes aren't constructible. 

  The causal explanation analogy they mention is slightly better—both involve pragmatic relevance judgments—but it still doesn't yield objectivity. The prior selection analogy is weaker because priors are explicitly subjective. 

  I'll emphasize that the physics analogy actively misleads by implying an objective resolution exists. The real lesson? Reference classes are tools, not truths. 

  For structure: verdict first (analogy fails decisively), then correspondence table, breaks analysis, then less-bad analogies. Word count is tight—need ruthless concision.
answer: |-
  Your analogy is insightful but fatally flawed where it matters most: the maximally specific reference class (a singleton) destroys probabilistic content, whereas the complete microstate provides maximal deterministic information. This break decisively undermines the analogy's core purpose of licensing an objective, non-pragmatic reference class.

  ### Correspondence Table
  | **Physics Concept**          | **Statistical Analogy**               | **Role**                                                                 |
  |------------------------------|---------------------------------------|--------------------------------------------------------------------------|
  | Complete microphysical state | Maximally specific reference class   | Putatively privileged description yielding "true" value                  |
  | Coarse-grained description   | Conventional reference class (e.g., age/sex) | Incomplete summary; may yield conflicting values                        |
  | Coarse-graining map          | Criteria for class membership        | Function reducing detail (e.g., ignoring some variables)                |
  | Privileged status of microstate | Alleged objectivity of singleton class | Claimed metaphysical/epistemic priority over alternatives              |

  ### Where the Analogy Breaks (and Which Breaks Matter)
  1.  **The Decisive Break: Informativeness vs. Trivialization**  
      *Singleton class frequency (0 or 1) is epistemically vacuous for probability assignment*, revealing nothing about propensity or uncertainty. The complete microstate, conversely, *determines* the outcome (in classical physics) and is maximally informative. The analogy thus equates maximal specificity with maximal utility in physics but with zero utility in statistics. **This break directly destroys its use for defending objective single-case probability.**

  2.  **Underlying Ontology/Mechanism**  
      Physics: The microstate has causal priority; coarse-grained properties supervene on it. Statistics: No analogous causal mechanism makes the singleton class ontologically prior. Classes are groupings *we* impose, lacking intrinsic hierarchy. **This break matters**—it removes the foundation for privileging "maximal specificity."

  3.  **Coarse-Graining is Well-Defined vs. Arbitrary**  
      Physics: Coarse-graining (e.g., averaging kinetic energy → temperature) follows from physical theory/mathematics. Statistics: Choosing a reference class involves contested judgments of "relevance" or "similarity" without a theory to fix "correct" granularity. **This break matters**—it highlights the pragmatic element the analogy aims to avoid.

  4.  **Measurability/Constructibility**  
      Physics: Complete microstates are measurable in principle (foundational for theory). Statistics: Constructing a non-trivial "maximally specific" class (beyond the singleton) requires arbitrary stopping rules (how many variables?). **This break is idle**—it’s symptomatic but not core.

  ### Better Analogies? Partial Improvements
  *   **Causal Explanation Relevance:** Likening reference class choice to selecting *which factors are causally relevant* for an explanation is better. Both involve pragmatic/epistemic decisions about salience in a context. Crucially, however, this *still doesn’t yield a unique, non-pragmatic "correct" choice*—it shifts the problem to causal modeling.
  *   **Choice of Prior:** Likening it to selecting a Bayesian prior is common but weaker. Priors explicitly incorporate subjective/pragmatic elements, conceding the non-objectivity the physics analogy tries to avoid. It’s honest but abandons your goal.

  ### Verdict on the Analogy’s Use
  The physics analogy fails precisely where you need it: the singleton class’s triviality proves that maximal specificity is the *opposite* of informative for probability. No non-pragmatic, principled choice emerges. The analogy inadvertently shows why *only* context-dependent, purpose-relative reference classes work—coarse-graining is essential, not a defect. While causal relevance offers a slightly more honest parallel, it too cannot rescue objectivity. The reference class problem remains stubbornly non-technical.
