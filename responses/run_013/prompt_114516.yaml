prompt: |-
  I'm a fifth-year PhD student in philosophy, spending this year as an ethics fellow with the enforcement division of a state health-professions board, and I've been asked to turn the moral luck literature into something the board can actually run.

  Here is the setting. The board disciplines licensed physicians and nurses: about fifty contested cases a year, fifteen or so involving a patient death or serious injury, sanctions from reprimand to revocation, imposed in public hearings. Eleven members, mostly clinicians and public members, none with philosophical training. Reviewers receive the file ten days before the hearing and I need a procedure they can complete in under an hour, producing a one-page worksheet. The general counsel and the board chair have to sign off before it goes into the hearing manual, so anything that runs against the governing statute must be flagged rather than quietly worked around. That statute requires sanctions to be proportional to the seriousness of the violation and directs the board to consider the degree of harm to patients, so I cannot tell them simply to ignore outcomes, and I don't want a memo that pretends the statute isn't there.

  The problem I'm trying to solve: the current worksheet asks for a single seriousness score, and harm does double duty in it, both as an aggravator in its own right and as evidence about what the practitioner actually risked. Reviewers see the outcome before they rate the conduct, and I suspect they reverse-engineer the ex ante risk from the result.

  What I want is a decision procedure. It should (a) fix the order of operations so that conduct is rated before outcome information is admitted, and state precisely what the outcome may and may not be used for, including the hard case where the outcome is the only evidence of what the practitioner knew or should have known; (b) sort the ways luck enters a case, namely the outcome that happened to be bad, the situation the practitioner happened to be in (the short-staffed shift, the patient who arrived at 3 a.m.), and the training and temperament they happened to arrive with, and say which of these may bear on culpability and which must be handled some other way; (c) say how to satisfy the statutory harm factor without letting it bleed into the culpability finding; and (d) say what counts as a sufficient answer at each step, where the procedure terminates in a no, and where it must hand the question to the board as a value judgment rather than a finding.

  Then run it on three cases: two nurses who made the same error in a potassium infusion, one caught before any harm and one where the patient died; a physician who followed the standard of care and lost a patient to a rare reaction; and a practitioner who took an unjustified shortcut for two years, harmed no one, and never reached our docket until a colleague reported it. I expect the procedure to produce at least one result I won't like, so say so plainly rather than softening it.

  Finally, tell me where the procedure is just the control principle, that blameworthiness reaches only as far as what was within the agent's control, dressed up in procedural clothing; where I am smuggling outcome-sensitivity back in under another name; and what the procedure cannot do, including any question that is really about what the board is for rather than about luck.
reasoning: |-
  We are designing a decision procedure for a health-professions board to assess disciplinary cases, with attention to the problem of moral luck. The procedure must be completed in under an hour and produce a one-page worksheet. The key challenge is to separate the evaluation of the practitioner's conduct (ex ante) from the outcome (ex post), while complying with a statute that requires considering the degree of harm to patients and proportionality.

   The procedure will have the following steps:

   Step 1: Assess Conduct (Ex Ante)
     - Review the evidence of the practitioner's actions, knowledge, and state of mind at the time of the incident, without considering the actual outcome.
     - Focus on what the practitioner knew or should have known, and the risks they were taking.
     - Determine the level of culpability (negligence, recklessness, intentional harm) and the magnitude of the risk (potential harm) that the conduct created.

   Step 2: Record the Outcome (Ex Post)
     - After the conduct is assessed, record the actual outcome (harm, no harm, death, etc.).

   Step 3: Use of Outcome Information
     - The outcome may be used ONLY in the following ways:
          a) As required by statute to consider the degree of harm in determining the overall sanction (but not to reassess the conduct).
          b) In the rare case where the outcome is the only evidence of what the practitioner knew or should have known (e.g., if the outcome reveals information that the practitioner had and ignored). However, caution: the outcome alone is not sufficient to infer knowledge without additional evidence linking the outcome to the practitioner's state of mind at the time.

   Step 4: Account for Situational and Constitutive Luck
     - Situational Luck (the situation the practitioner happened to be in, e.g., short-staffed, patient at 3 a.m.):
          - This may mitigate culpability if the situation was beyond the practitioner's control and they took reasonable steps to mitigate the risk.
          - However, it does not excuse a failure to meet the standard of care. The board must consider whether a reasonable practitioner in that situation would have acted differently.
     - Constitutive Luck (the training and temperament they happened to arrive with):
          - This is generally not considered in culpability for the specific act because it is about the agent's character or background, which is beyond their control at the time of the act. However, it might be relevant for remediation or rehabilitation in sanctions, but not for the finding of violation or the level of culpability for the act.

   Step 5: Satisfy the Statutory Harm Factor
     - The degree of harm is a separate factor to be considered in determining the sanction, but it must not affect the finding of violation or the level of culpability for the conduct.
     - Therefore, the worksheet will have two distinct components:
          a) The conduct rating (from Step 1) which is based solely on the ex ante risk and the practitioner's state of mind.
          b) The harm factor (from Step 2) which is an aggravating factor in the sanction phase.

   Step 6: Termination and Value Judgments
     - The procedure terminates in a "no" (i.e., no violation) if the conduct did not breach the standard of care (e.g., the physician who followed the standard of care but had a bad outcome).
     - Where there is a breach, the board must then consider the sanction, which includes the harm factor and other factors (like prior record, remorse, etc.). The sanction phase is where value judgments come in, including the weight given to harm.

   The Worksheet:

   Part A: Conduct Assessment (without outcome information)
     - Describe the conduct: What did the practitioner do or fail to do?
     - What was the standard of care? Did the practitioner breach it? (Yes/No)
          If No, stop: no violation.
          If Yes, continue.
     - Level of culpability: 
          - Negligence (unintentional failure to meet standard)
          - Recklessness (conscious disregard of a substantial risk)
          - Intentional (purposeful harm or violation)
     - Magnitude of risk (potential harm): 
          - Low (minor injury possible)
          - Medium (serious injury possible)
          - High (death or permanent disability possible)

   Part B: Outcome
     - Record the actual harm: None, Minor, Serious, Death.

   Part C: Use of Outcome Information
     - Was the outcome used to infer what the practitioner knew or should have known? (Only if there is independent evidence linking the outcome to the practitioner's state of mind at the time, and then only to the extent that it provides such evidence. Otherwise, do not use outcome to reassess conduct.)

   Part D: Situational Factors
     - Were there situational factors (e.g., short-staffed, emergency) that the practitioner faced?
     - Did these factors mitigate the culpability? (Only if the situation was beyond the practitioner's control and they took reasonable steps to mitigate the risk. Otherwise, no.)

   Part E: Constitutive Factors (Note: these are not to be used in assessing culpability for the act, but may be noted for sanction considerations if the board's rules allow. However, for the purpose of the worksheet, we focus on the act.)

   Part F: Sanction Considerations (to be filled by the board during the hearing, but the worksheet will note the factors required by statute, including harm)

   Now, run the procedure on the three cases:

   Case 1: Two nurses who made the same error in a potassium infusion.
     - Nurse A: Error caught before harm.
     - Nurse B: Patient died.

   Step 1: Conduct Assessment (same for both)
     - Conduct: Administered potassium without following proper procedure (e.g., wrong rate, wrong concentration).
     - Breach of standard? Yes.
     - Culpability: Likely negligence (if unintentional) or recklessness (if they knew the risk and ignored it). Assume negligence for this example.
     - Magnitude of risk: High (because potassium errors can cause cardiac arrest and death).

   Step 2: Outcome
     - Nurse A: No harm.
     - Nurse B: Death.

   Step 3: Use of Outcome
     - The outcome (death) for Nurse B cannot be used to reassess the conduct. The conduct was the same for both.

   Step 4: Situational Factors
     - None mentioned, so no mitigation.

   Step 5: Sanction
     - The statute requires considering harm. So for Nurse A, the harm factor is none; for Nurse B, it is death. Therefore, the sanction for Nurse B would be more severe.

   Case 2: Physician who followed the standard of care and lost a patient to a rare reaction.

   Step 1: Conduct Assessment
     - Conduct: Administered a drug according to the standard of care, but a rare adverse reaction occurred.
     - Breach of standard? No (since followed standard). Therefore, stop: no violation.

   Case 3: Practitioner who took an unjustified shortcut for two years, harmed no one, and was reported by a colleague.

   Step 1: Conduct Assessment
     - Conduct: Took an unjustified shortcut (e.g., not checking patient ID, not washing hands, etc.) repeatedly.
     - Breach of standard? Yes.
     - Culpability: Recklessness (if aware of the risk) or at least negligence (if should have been aware). Given two years, likely recklessness.
     - Magnitude of risk: Depending on the shortcut, it might be low (if the chance of harm was low) or medium/high (if the potential harm was serious). For example, not washing hands in a hospital setting carries a risk of infection that could be serious or even fatal. Let's say medium.

   Step 2: Outcome: No harm (until reported).

   Step 3: Use of Outcome: The outcome (no harm) does not change the conduct assessment. The risk was real and the breach was repeated.

   Step 4: Situational Factors: None mentioned.

   Step 5: Sanction: The harm factor is none, but the conduct was repeated and reckless. The board might impose a sanction (e.g., education, probation) because the risk was present. However, without harm, the sanction might be less severe than if harm had occurred.

   Now, the critical reflection:

   1. The procedure is indeed the control principle in procedural clothing: we are isolating what was within the practitioner's control (the conduct) and assessing it independently of the outcome.

   2. Where is outcome-sensitivity smuggled in?
      - We have to include harm in the sanction phase because of the statute. So the outcome still affects the severity of the sanction. But this is explicit and required. We are not smuggling it into culpability.

   3. What the procedure cannot do:
      - It cannot resolve questions about the purpose of the board. For example, if the board's role is primarily deterrence, then the sanction might be based on the outcome to send a message. But our procedure separates culpability (which is about the act) from sanction (which may include outcome for proportionality as required by law). However, the board must still make value judgments about the weight of harm in sanctions.
      - It cannot eliminate the psychological bias of knowing the outcome. We try by ordering the steps, but reviewers might still be influenced. Training and clear instructions are key.
      - It cannot handle cases where the outcome is the only evidence of what the practitioner knew. We allow it in Step 3, but with caution. However, this is a weak point because it might let outcome bias creep in. We must emphasize that independent evidence is needed.

   4. One result you might not like: 
      - In Case 3, the practitioner who took shortcuts for two years without harm would be found to have committed a violation (because of the conduct) and would be sanctioned. However, without any harm, the sanction might be relatively light (e.g., a reprimand and education) even though the conduct was reckless and repeated. This might feel inadequate because the practitioner was lucky. But the procedure would have the same conduct rating as if harm had occurred, so the culpability is high. The harm factor is zero, so the sanction is less than if harm had occurred. This is consistent with the control principle: we blame for the recklessness, not for the lack of harm. But the statute requires harm to be considered in the sanction, so we cannot ignore it.

   Implementation note: The worksheet must be designed to enforce the order (Part A first, then Part B). The instructions must emphasize not to look at the outcome until after Part A is completed.

   Let's draft a one-page worksheet structure:

   [WORKSHEET TITLE: Conduct and Sanction Assessment Worksheet]

   Case: _______________    Practitioner: _______________    License: _______________

   PART A: CONDUCT ASSESSMENT (to be completed WITHOUT reviewing outcome information)

   1. Describe the practitioner's conduct (actions or omissions) that is the subject of the complaint:

   2. Did the practitioner breach the standard of care? 
      [ ] Yes   [ ] No   (If No, stop here and recommend no violation)

   3. Level of culpability for the breach (check one):
      [ ] Negligence (unintentional failure to meet the standard of care)
      [ ] Recklessness (conscious disregard of a substantial and unjustifiable risk)
      [ ] Intentional (purposeful violation or harm)

   4. Magnitude of the risk created by the conduct (potential harm):
      [ ] Low (minor injury possible)
      [ ] Medium (serious injury possible)
      [ ] High (death or permanent disability possible)

   PART B: OUTCOME

   5. What was the actual harm? (Check one)
      [ ] None
      [ ] Minor (temporary injury, no permanent harm)
      [ ] Serious (permanent injury, significant treatment required)
      [ ] Death

   PART C: USE OF OUTCOME INFORMATION

   6. Was the outcome used to infer what the practitioner knew or should have known? (Check one)
      [ ] Yes   [ ] No
      If Yes, describe the independent evidence (apart from the outcome itself) that links the outcome to the practitioner's state of mind at the time: 

   PART D: SITUATIONAL FACTORS

   7. Were there situational factors (e.g., emergency, short-staffing) beyond the practitioner's control that affected the conduct? 
      [ ] Yes   [ ] No
      If Yes, did the practitioner take reasonable steps to mitigate the risk? 
      [ ] Yes   [ ] No
      If Yes to both, then the situational factors may mitigate culpability. (Note: this does not change the breach finding, but may reduce the level of culpability or magnitude of risk. However, the board must decide the weight.)

   PART E: SUMMARY FOR VIOLATION

   Based on Part A, there [ ] was [ ] was not a violation of the standard of care.

   If there was a violation, proceed to sanction considerations (for the board hearing).

   PART F: SANCTION CONSIDERATIONS (to be completed by the board during the hearing)

   The board must consider the following factors as per statute (among others):
     - The conduct rating (Part A)
     - The actual harm (Part B)
     - The practitioner's prior record, remediation, remorse, etc.

   [This part is not filled by the reviewer in the worksheet, but the worksheet provides the basis for it.]

   Instructions for Reviewers:
     - Complete Part A without looking at the outcome (Part B). The outcome is to be considered only after Part A is done.
     - In Part C, if you checked "Yes", you must provide a written explanation. This is to prevent using the outcome alone to infer state of mind.

   Finally, note that this procedure may produce a result that feels counterintuitive in cases of moral luck. For example, two practitioners with identical conduct but different outcomes will have the same conduct rating, but different sanctions due to the harm factor. This is because the statute requires considering harm. The procedure is designed to isolate the conduct from the outcome as much as possible, but the law requires outcome to be considered in the final sanction.

   We must flag for the general counsel and chair: The statute requires considering harm, so we have included it in the sanction phase. However, we have separated the conduct assessment (which is outcome-independent) from the harm factor (which is outcome-dependent). This separation may be challenged if the board feels that harm should be considered in the violation. But our reading is that the statute requires harm to be considered in the sanction (proportionality) and not necessarily in the violation. The violation is about the breach of the standard of care.

   Let me know if you need further adjustments.
answer: |-
  Below is a decision procedure addressing moral luck for your health-professions board, designed as a 45-minute worksheet compliant with your statute. The procedure enforces strict separation between conduct assessment and outcome evaluation, while flagging statutory constraints. It includes a one-page worksheet template and applies to your three cases. I conclude with critical reflections on limitations and philosophical tensions.

  ---

  ### **Decision Procedure: Moral Luck in Disciplinary Review**  
  *Core Principle*: Blameworthiness hinges **only** on what the practitioner controlled (awareness, choices, and risks taken). Outcomes influence sanctions solely as statutory aggravators, not culpability.

  #### **Worksheet Structure** (1 page; 5 sections; complete in order)
  **Instructions**:  
  - Reviewers **must** complete Section I *before* reading outcome details.  
  - Outcomes (Section II) may only be used for:  
    - Statutory sanction aggravation (Section IV).  
    - Evidence of practitioner knowledge *if and only if* corroborated by independent facts (e.g., chart notes showing awareness of a specific risk).  

  ---

  **SECTION I: CONDUCT CULPABILITY (Ex Ante Assessment)**  
  *(Assess BEFORE reviewing harm/outcome)*  
  1. **Breach of Standard?**  
     - *Question*: Did the conduct fall below the standard of care *at the time of the act*, based on information the practitioner **knew or should have known**?  
     - *Evidence*: Policies, expert testimony, clinical guidelines. Ignore outcome data.  
     - *Termination*: If "No," end here. No violation.  
     - *Sufficient Answer*: "Yes" only if objective evidence shows deviation (e.g., ignored protocols, misdiagnosed obvious symptoms).  

  2. **Culpability Level**  
     - *Question*: How severe was the **risk created** by the conduct, and did the practitioner **foreseeably disregard it**?  
       - **Negligence**: Unintentional lapse; low/moderate risk (e.g., charting error).  
       - **Recklessness**: Conscious disregard of substantial risk (e.g., skipping a safety step to save time).  
       - **Intentional**: Purposeful harm or fraud.  
     - *Sufficient Answer*: Categorize using evidence of *mental state* (e.g., "Admitted rushing," "Failed to check chart").  

  3. **Situational Luck**  
     - *Question*: Did external circumstances (e.g., understaffing, emergency) **constrain choices**?  
     - *Use*: May **reduce culpability** *only* if:  
       - The situation was unforeseeable/unavoidable.  
       - The practitioner mitigated risks (e.g., called for help).  
     - *Termination*: If circumstances fully excuse conduct (rare), end. No violation.  

  ---

  **SECTION II: OUTCOME (Ex Post Fact)**  
  *(Record harm **after** Section I)*  
  - **Harm Level**: None, Minor, Serious, Death.  
  - **Statutory Flag**: Harm *must* be noted for sanctions (Section IV) but **cannot alter Section I ratings**.  

  ---

  **SECTION III: CONSTITUTIVE LUCK & OUTCOME-BIAS TRAPS**  
  *(Temperament/training; misuse of outcomes)*  
  1. **Constitutive Luck** (e.g., "naturally careless," "poorly trained"):  
     - *Question*: Do inherent traits explain the conduct?  
     - *Use*: **Irrelevant to culpability** (not controlled). May inform remediation (e.g., mandated training) in sanctions.  

  2. **Outcome as Knowledge Evidence?**  
     - *Question*: Is the outcome the **sole proof** of what the practitioner knew?  
     - *Use*: **Inadmissible** unless:  
       - Corroborated by independent evidence (e.g., text: "I knew this could kill someone").  
       - *Statutory Flag*: If used, document specific corroboration to avoid violating due process.  

  ---

  **SECTION IV: STATUTORY SANCTION FACTORS**  
  *(Harm as aggravation only)*  
  - **Harm Weight**: Assign aggravation points (e.g., Death = +3, Serious = +2, Minor = +1, None = 0).  
  - **Final Sanction**: Combine:  
    - Culpability (Section I) = Base sanction (e.g., Recklessness → suspension).  
    - Harm (Section II) = Aggravation modifier (e.g., +Death → longer suspension/revocation).  

  ---

  **SECTION V: VALUE JUDGMENTS & TERMINATION**  
  - **Board Referral Required** if:  
    - Contested facts about practitioner knowledge.  
    - Novel standard-of-care questions.  
    - Sanction proportionality disputes.  
  - **Procedure Terminates** at:  
    - Section I.1 ("No breach").  
    - Section I.3 (Situational excuse).  

  ---

  ### **Case Applications**  
  **Case 1: Potassium Infusion Error (Nurses A & B)**  
  - **Section I**: Identical for both.  
    - *Breach*: Yes (protocol violation).  
    - *Culpability*: Recklessness (ignored high-risk safeguards).  
    - *Situational*: None (routine procedure).  
  - **Section II**:  
    - Nurse A: No harm.  
    - Nurse B: Death.  
  - **Sanction**:  
    - Base: Suspension (recklessness).  
    - Nurse A: +0 harm → shorter suspension.  
    - Nurse B: +3 harm → revocation.  
  - *Uncomfortable Result*: Identical culpability, drastically different sanctions. Statutory harm requirement forces this.  

  **Case 2: Physician & Rare Reaction**  
  - **Section I**:  
    - *Breach*: **No** (followed standard of care).  
    - *Termination*: No violation. Outcome irrelevant.  
  - *Board Referral*: If standard of care is contested.  

  **Case 3: Shortcut-Taker Reported by Colleague**  
  - **Section I**:  
    - *Breach*: Yes (repeated unjustified shortcuts).  
    - *Culpability*: Recklessness (knowingly defied protocols).  
    - *Situational*: None (avoidable choice).  
  - **Section II**: No harm.  
  - **Sanction**:  
    - Base: Suspension (recklessness).  
    - Harm: +0 → no aggravation.  
  - *Uncomfortable Result*: Light sanction despite egregious conduct. Harm aggravation cannot apply.  

  ---

  ### **Critical Reflections**  
  1. **Control Principle in Disguise**:  
     - The procedure *is* the control principle operationalized:  
       - Culpability ends at choices/risks (Section I).  
       - Outcomes (Section II) are "aggravating luck" for sanctions only.  
     - This prevents outcome-driven culpability inflation.  

  2. **Smuggled Outcome-Sensitivity**:  
     - **Statutory Harm Aggravation** (Section IV) reintroduces moral luck via sanctions. You cannot avoid this without defying the law.  
     - **Outcome as Knowledge Evidence** (Section III.2) risks bias. Mitigated by requiring corroboration, but reviewers may stretch "corroboration."  

  3. **What the Procedure Cannot Do**:  
     - **Eliminate Cognitive Bias**: Reviewers may still subconsciously reverse-engineer risk from outcomes despite ordering. Training is essential.  
     - **Resolve Board Purpose Debates**: If the board sees itself as a *deterrent* force, it may reject equal sanctions for Cases 1A/1B. The procedure cannot answer "Should we punish unlucky outcomes to scare others?"  
     - **Handle "Near Miss" Incentives**: Case 3’s light sanction may under-deter reckless practitioners who avoid harm. This is a policy gap, not a luck problem.  
     - **Override Due Process**: If the statute implies harm is part of "seriousness," the procedure’s strict separation may face legal challenges. Flagged for counsel.  

  ---

  **Final Worksheet Template** (1 Page)  
  ```markdown
  [LICENSEE] _________________________________ [CASE #] _______________ [REVIEWER] _______________  

  SECTION I: CONDUCT (Complete FIRST)  
  1. Breach of standard? ☐ Yes ☐ No (If No, STOP; no violation)  
     Evidence: _________________________  
  2. Culpability: ☐ Negligence ☐ Recklessness ☐ Intentional  
     Risk Magnitude: ☐ Low ☐ Medium ☐ High  
     Evidence: _________________________  
  3. Situational Luck: ☐ Mitigates ☐ Neutral ☐ Aggravates  
     Evidence: _________________________  

  SECTION II: OUTCOME (Complete AFTER I)  
  Harm: ☐ None ☐ Minor ☐ Serious ☐ Death  

  SECTION III: LUCK & BIAS CONTROLS  
  1. Constitutive Luck: ☐ Irrelevant ☐ Informs remediation  
  2. Outcome as Knowledge? ☐ No ☐ Yes (Corroborating evidence: _______________)  

  SECTION IV: SANCTION (Board Use)  
  Base (Culpability): _________________________  
  + Harm Aggravation: _________________________  
  = Recommended Sanction: _________________________  

  SECTION V: TERMINATION/REFERRAL  
  ☐ No violation (I.1 or I.3) ☐ Refer to Board (Specify: _______________)  
  ```
  ---

  **Recommendation**: Pair this worksheet with a 30-minute training module emphasizing:  
  1. Section I *must* precede outcome review.  
  2. Harm is a "sanction tax," not a culpability input.  
  3. Document all evidence rigorously to withstand appeals.  

  This meets your requirements but exposes statutory tensions—especially in Case 1 (sanction disparity) and Case 3 (under-deterrence). The board must accept that moral luck cannot be fully eradicated under a harm-proportionality law.
