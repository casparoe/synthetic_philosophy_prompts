prompt: |-
  Me and my friend got into a long, dumb argument last night about intuitionism in math. She'd read some pop-math book and came away with a whole spiel about it that she kept throwing at me, and honestly I couldn't tell how much of it was actually right, which is the only reason I'm asking you instead of just letting it go. Near as I can remember she said something like:

  "Intuitionists are the mathematicians who don't believe in proof by contradiction. They reject the law of excluded middle, so they say you can't prove a thing is true just by showing the opposite is impossible. They think math is something we build rather than something we find, and Brouwer invented intuitionistic logic to put all that on a proper footing. It's basically a philosophical hangup though — classical logic is the one that actually works, and nobody does real math this way anyway."

  I definately think a couple of those sentences are doing something sneaky, but I don't know the technical landscape well enough to say which, and I don't want to just assume she's wrong because she was being smug about it. So can you go claim by claim and tell me what a logician or philosopher of math would nod along to, what they'd wince at, and what's just false? I especially want the logic itself pinned down. Is rejecting the law of excluded middle the same thing as rejecting double-negation elimination, or are those two seperate commitments? Which classically valid principles do intuitionists actually give up, and which do they keep? And does "they don't believe in proof by contradiction" survive any precise reading, or is it a loose way of putting a narrower point? Same for the Brouwer line — did he really invent or formalize the logic? And her last sentence, the "just a hangup, nobody uses it" bit: does that follow from anything true in the rest of her summary, or is it a separate claim that would need its own argument? If it helps, I think she also waved at some classic proof with √2 to the √2 as an example of something intuitionists supposedly can't do — is that example even right, or is there a constructive route she's missing? I basically want to know what to actually believe here, not just who won.
reasoning: |-
  Okay, the user is recounting an argument they had with their friend about intuitionism in mathematics. The friend made several claims about intuitionists rejecting proof by contradiction, the law of excluded middle, and Brouwer's role in formalizing intuitionistic logic. The user wants a clear breakdown of what's accurate, what's misleading, and what's false in their friend's statements. They especially want clarity on the logical principles involved and whether intuitionists truly can't use certain proofs like the √2 to the √2 example.

  First, I need to address each of the friend's points systematically. Let me start with the claim that intuitionists don't believe in proof by contradiction. It's important to distinguish between different types of proof by contradiction. Intuitionists reject proofs that rely on the law of excluded middle (LEM) or double-negation elimination (DNE). They do accept proving a negation by showing a contradiction, which is valid in intuitionistic logic. So the friend's statement is oversimplified here.

  Next, the rejection of LEM. The friend is correct that intuitionists reject LEM, but this isn't just a philosophical preference; it's tied to their view of truth as requiring construction. LEM and DNE are interderivable in classical logic, but rejecting LEM inherently means rejecting DNE in intuitionistic systems. So the friend's statement here is mostly accurate, though the emphasis might be more philosophical than they presented.

  The point about math being built rather than found aligns with Brouwer's views. He saw mathematical objects as mental constructions. The friend is right here, but it's worth noting that Brouwer didn't formalize the logic himself; that was done later by others like Heyting. So the friend's attribution of the formalization to Brouwer is incorrect.

  Regarding the "philosophical hangup" and that "nobody does real math this way," this is where the friend's bias shows. Constructive mathematics is actively used in areas like computer science and topos theory. While classical math is more common, intuitionistic methods have practical applications. The dismissive tone here overlooks significant fields where constructive approaches are essential.

  The √2 to the √2 example is interesting. The classic non-constructive proof uses the law of excluded middle. However, there's a constructive alternative using the Gelfond-Schneider theorem, which intuitionists accept. So the friend's example doesn't hold up, as there are constructive ways to prove the same result.

  The user also asked about the relationship between rejecting LEM and DNE. In intuitionistic logic, rejecting LEM leads to the invalidity of DNE. They are connected, and giving up LEM means DNE isn't derivable. The principles intuitionists reject include DNE, LEM, and certain equivalences like De Morgan's laws in their full form. However, they keep other principles such as the law of non-contradiction and proof of negation.

  The deeper needs here might involve the user wanting not just to win an argument but to understand the nuances of intuitionism. They seem frustrated by the friend's smugness but genuinely curious about the factual basis. Clarifying misconceptions while acknowledging partial truths will help them grasp why intuitionism is a valid, albeit less common, approach. Highlighting practical applications beyond philosophy can show that it's not just a "hangup" but a useful framework in specific contexts.
answer: |-
  Let's break down your friend's claims line by line, with a logician's perspective. Her summary contains *partial* truths mixed with oversimplifications and philosophical bias. Here's the analysis:

  **Claim 1: "Intuitionists are the mathematicians who don't believe in proof by contradiction."**
  *   **Nod/Wince/False:** **Wince (oversimplification).** This is imprecise and misleading.
      *   **What they *do* reject:** Proofs that rely **essentially** on the Law of Excluded Middle (LEM) or Double-Negation Elimination (DNE). A classic example is proving `P` by showing `¬P` leads to contradiction. *This specific form* (proving a positive statement via contradiction of its negation) is invalid in intuitionistic logic.
      *   **What they *accept*:** Proving a *negation* (`¬P`) by showing `P` leads to contradiction. This is called "proof of negation" and is perfectly valid intuitionistically. The rule "If assuming `P` leads to absurdity (`⊥`), then conclude `¬P`" (`P → ⊥` entails `¬P`) is fundamental.
  *   **Conclusion:** Saying they "don't believe in proof by contradiction" is too broad. They reject *some* contradiction-based proofs (those requiring LEM/DNE) but accept others (proofs of negative statements).

  **Claim 2: "They reject the law of excluded middle..."**
  *   **Nod/Wince/False:** **Strong Nod.** This is absolutely core to intuitionism. The Law of Excluded Middle (LEM: `P ∨ ¬P` is true for *every* proposition `P`) is explicitly rejected. Intuitionists argue that for a statement `P` to be true, we must have a proof (construction) of `P`. For `P` to be false, we must have a proof (construction) that `P` leads to absurdity. Merely not having a proof of `P` does not constitute a proof of `¬P`, and vice versa. There is a "gap" where neither `P` nor `¬P` has been constructed yet. Rejecting LEM is their defining logical characteristic.

  **Claim 3: "...so they say you can't prove a thing is true just by showing the opposite is impossible."**
  *   **Nod/Wince/False:** **Nod (mostly).** This directly follows from rejecting LEM and DNE. The "classical" move of proving `P` by proving `¬¬P` (i.e., showing `¬P` is impossible) *is precisely Double-Negation Elimination* (`¬¬P` entails `P`). Intuitionists reject DNE. Proving `¬P` is impossible (`¬¬P`) only shows that `P` *cannot be refuted*, not that `P` is true. For `P` to be true, a direct construction is required. This is the heart of their objection to non-constructive existence proofs.

  **Claim 4: "They think math is something we build rather than something we find..."**
  *   **Nod/Wince/False:** **Strong Nod.** This captures the core *philosophical* motivation of intuitionism (especially Brouwer's original version). Mathematical objects and truths are not pre-existing Platonic entities waiting to be discovered. They are mental constructions created by the activity of the ideal mathematician. Truth is identified with provability (constructibility). Mathematics is an activity, not a static realm.

  **Claim 5: "...and Brouwer invented intuitionistic logic to put all that on a proper footing."**
  *   **Nod/Wince/False:** **Wince (attribution is half-right).**
      *   **Brouwer:** Absolutely founded intuitionism as a philosophy of mathematics and developed its core ideas, including rejecting LEM and emphasizing constructions. He revolutionized the *practice* of mathematics based on these principles.
      *   **Formalizing the Logic:** Brouwer himself was famously skeptical of formalization. The formal system we now call **Intuitionistic Logic** was developed primarily by **Arend Heyting** (Brouwer's student) in the late 1920s/early 1930s, based on Brouwer's ideas. Others like Kolmogorov also contributed. So, Brouwer provided the philosophical foundation and mathematical practice; Heyting et al. provided the formal logical footing.

  **Claim 6: "It's basically a philosophical hangup though..."**
  *   **Nod/Wince/False:** **Strong Wince (dismissive and inaccurate).** Calling it a "hangup" trivializes a profound and coherent philosophical position with significant mathematical consequences. The disagreement between intuitionism/constructivism and platonism/classicism is deep and ongoing in the philosophy of mathematics. Intuitionists have strong arguments about the nature of mathematical truth, existence, and the meaningfulness of non-constructive proofs. It's a legitimate school of thought, not a minor quirk.

  **Claim 7: "...classical logic is the one that actually works..."**
  *   **Nod/Wince/False:** **Wince (context-dependent & loaded).**
      *   **"Works" for what?** Classical logic works brilliantly for vast swathes of mathematics *if* you accept its underlying Platonic assumptions and non-constructive methods. It's highly efficient and powerful.
      *   **Intuitionistic Logic also "Works":** It provides a sound foundation for mathematics where all existence proofs are constructive and all objects are computable/realizable. This is crucial in areas like:
          *   **Computer Science:** Program extraction, type theory (e.g., foundations of Coq, Agda), semantics.
          *   **Topos Theory:** Provides models for intuitionistic logic and reveals deep connections to geometry and set theory.
          *   **Proof Mining:** Extracting computational content from classical proofs.
      *   **Conclusion:** Both logics "work" for their intended domains and philosophical commitments. Saying classical logic "actually works" implies intuitionistic logic doesn't, which is false.

  **Claim 8: "...and nobody does real math this way anyway."**
  *   **Nod/Wince/False:** **False (and dismissive).**
      *   **Active Research:** There are communities of mathematicians actively developing mathematics using intuitionistic or constructive principles (e.g., constructive analysis, constructive set theory, homotopy type theory).
      *   **Computer Proof Assistants:** Systems like Coq, Agda, and Lean are fundamentally based on type theories that are intuitionistic or constructive. Significant formalized mathematics (e.g., the Odd Order Theorem in Coq, parts of homotopy theory in Lean/HoTT) is done constructively.
      *   **Influence:** Constructive ideas permeate areas like computability theory, proof theory, and category theory.
      *   **Conclusion:** While classical mathematics is dominant in volume, intuitionistic/constructive mathematics is a vibrant, active field producing "real math" with important applications, especially in CS.

  **Your Specific Logic Questions:**

  1.  **Is rejecting LEM the same as rejecting DNE?**
      *   In intuitionistic logic, **rejecting LEM inherently means rejecting DNE**. You cannot have DNE without LEM in standard systems. They are interderivable in classical logic. If you assume `¬¬P`, can you prove `P` classically? Yes, via LEM: Either `P` is true (done) or `¬P` is true, but `¬P` contradicts `¬¬P`, so `P` must hold. Intuitionists reject this step. Conversely, DNE implies LEM: `¬¬(P ∨ ¬P)` is intuitionistically provable (it's a negation!). Applying DNE gives `P ∨ ¬P`. So rejecting one necessitates rejecting the other.

  2.  **Which classical principles do they give up? Which do they keep?**
      *   **Give Up:**
          *   Law of Excluded Middle (`P ∨ ¬P`)
          *   Double Negation Elimination (`¬¬P → P`)
          *   Proof of `P` by proving `¬P → ⊥` (unless `P` is itself a negation).
          *   Full Equivalence of `P → Q` and `¬P ∨ Q`.
          *   Full De Morgan's Laws: `¬(P ∧ Q)` is *not* equivalent to `¬P ∨ ¬Q` intuitionistically (though `¬(P ∨ Q) ↔ ¬P ∧ ¬Q` and `¬(P ∧ Q) → ¬P ∨ ¬Q` hold, the converse doesn't).
          *   Material Implication: `P → Q` is not defined as `¬P ∨ Q`.
      *   **Keep:**
          *   Law of Non-Contradiction (`¬(P ∧ ¬P)`)
          *   Modus Ponens (`P → Q`, `P` entails `Q`)
          *   Modus Tollens (`P → Q`, `¬Q` entails `¬P`)
          *   Introduction/Elimination rules for `∧`, `∨`, `→`, `¬` (carefully defined).
          *   Proof of Negation (Prove `¬P` by showing `P → ⊥`).
          *   `¬¬¬P → ¬P` (Triple Negation Elimination *is* intuitionistically valid!).
          *   `P → ¬¬P` (You can always add double negation, but can't remove it arbitrarily).

  3.  **The √2<sup>√2</sup> Example:**
      *   **Classic Non-Constructive Proof:** Consider `a = √2<sup>√2</sup>`. Is `a` rational or irrational? *Case 1:* If `a` is rational, we have an irrational (`√2`) to an irrational power giving rational. *Case 2:* If `a` is irrational, then consider `b = a<sup>√2</sup> = (√2<sup>√2</sup>)<sup>√2</sup> = √2<sup>(√2 * √2)</sup> = √2<sup>2</sup> = 2`, which is rational. So *either* `a` is rational (Case 1) *or* `a` is irrational and `b` is rational (Case 2). Thus, there exist irrationals `x` and `y` such that `x<sup>y</sup>` is rational. **This proof uses LEM on the statement "a is rational".**
      *   **Intuitionist Objection:** Valid. This proof doesn't *construct* which pair `(x, y)` works. It doesn't tell us if it's `(√2, √2)` or `(√2<sup>√2</sup>, √2)`. It relies on the non-constructive disjunction from LEM.
      *   **Constructive Route? YES!** There *is* a constructive proof. A classic example is `x = √2`, `y = log₂(9)`. Both `√2` and `log₂(9) = 2 * log₂(3)` are irrational (provable constructively). Then `x<sup>y</sup> = (√2)<sup>2 * log₂(3)</sup> = ( (√2)<sup>2</sup> )<sup>log₂(3)</sup> = 2<sup>log₂(3)</sup> = 3`, which is rational. **This proof explicitly constructs the pair `(√2, 2*log₂(3))` and verifies the result.** The Gelfond-Schneider theorem (which is constructive) also guarantees that `√2<sup>√2</sup>` is actually transcendental (hence irrational), resolving the specific case constructively, but the explicit pair above is simpler. **Your friend's example fails because she assumed no constructive proof exists.**

  **The "Last Sentence":** Her claim that intuitionism is "just a hangup" and "nobody uses it" is **a separate claim driven by philosophical bias**, not a logical consequence of her (partially correct) summary of intuitionism's tenets. It ignores the active research, practical applications (especially in CS), and the validity of intuitionistic logic as a formal system.

  **What to Believe:**

  1.  Your friend correctly identified the core tenets: rejection of LEM/DNE, focus on construction, Brouwer as the philosophical founder, math as built.
  2.  She was seriously imprecise about "proof by contradiction" and wrong about Brouwer formalizing the logic (Heyting did).
  3.  Her dismissal ("hangup", "nobody does real math") is factually incorrect and philosophically naive. Intuitionistic/constructive math is active and valuable.
  4.  Rejecting LEM *is* equivalent to rejecting DNE in this context.
  5.  Intuitionists reject proofs that require LEM/DNE to prove a *positive* statement via contradiction of its negation, but accept proofs of *negative* statements via contradiction.
  6.  The √2<sup>√2</sup> example *can* be handled constructively; it only shows a flaw in *one specific non-constructive proof*, not in the underlying goal.

  **Who "Won"?** Neither cleanly. She got the basic description mostly right but was imprecise on key details (contradiction, Brouwer's role) and her dismissive conclusion was factually wrong and philosophically shallow. You were right to sense something "sneaky" – mainly oversimplification and bias creeping in at the end. The truth is more nuanced: intuitionism is a legitimate, coherent, and active alternative foundation for mathematics with both philosophical depth and practical utility, even if it's not the mainstream approach.
