answer: |-
  ### **Veridian War Tribunal: Role-Play Activity**  
  **Goal:** Force participants to confront the retroactive-law dilemma ("ex post facto") and the "you did it too" problem in a fictional war crimes trial.  

  ---

  ### **Roles (for 12 People)**  
  Assign these roles randomly (adjust if needed):  
  - **Judges (3 people)**: Decide verdicts. Must apply the "Veridian Code" (provided law) but can interpret it.  
  - **Prosecutors (2 people)**: Argue for convicting all defendants. Share duties.  
  - **Defense Attorneys (3 people)**: One assigned to each defendant.  
  - **Defendant 1: Commander Aris** (1 person, silent until testimony).  
  - **Defendant 2: Dr. Silas** (1 person, silent until testimony).  
  - **Defendant 3: General Vex** (1 person, silent until testimony).  
  - **Commander Jet (Azuran Hero)** (1 person): Represents the winning side ("Azura"). Will testify if called.  
  - **Timekeeper/Observer** (1 person): Keeps time and notes group dynamics.  

  > **Note:** Defendants and Jet only speak if questioned. Judges control the flow.  

  ---

  ### **Materials (1-Page Handout)**  
  **Distribute this to all participants:**  

  #### **THE VERIDIAN CODE (Law During the War)**  
  *Azura and Crimson fought a brutal war. Azura won. These laws were the only binding rules during the conflict:*  
  1. **Killing surrendered prisoners** is a war crime.  
  2. **Destroying non-military villages** (no soldiers/weapons present) is a war crime.  
  3. **Using banned poisons** (e.g., nerve toxins) is a war crime.  
  4. *No other acts are criminalized.*  

  #### **CASE FACTS**  
  **Background:**  
  - **Crimson** (defeated) vs. **Azura** (victors).  
  - **Commander Jet** (Azura) ordered the "Dawn Bombing" of Crimson’s Oakridge Village (see Case 3).  

  **Defendant 1: Commander Aris (Crimson)**  
  - **Charge:** Killing 100+ surrendered Azuran POWs.  
  - **Facts:** Ordered executions after the Battle of Taran. *Defense claims*: Prisoners "faked surrender."  
  - **Legal Status:** Clearly violates Code §1.  

  **Defendant 2: Dr. Silas (Crimson)**  
  - **Charge:** Causing mass suffering via "Black Smoke" (a chemical weapon).  
  - **Facts:** Deployed Black Smoke on Azuran troops. Victims died in agony over days. *Defense claims*: Smoke is not a "banned poison" under Code §3 (it’s a new synthetic toxin).  
  - **Legal Status:** Not explicitly banned. *Worst act morally, but not illegal then*.  

  **Defendant 3: General Vex (Crimson)**  
  - **Charge:** Bombing Azura’s undefended Hilltop Village.  
  - **Facts:** Ordered bombing; 200 civilians died. *Defense claims*: Hilltop had a soldier present (a lone scout). Also, **Azura did the same thing** (Commander Jet bombed Oakridge Village, which had no soldiers).  
  - **Legal Status:** Hilltop had a scout → not "non-military" under Code §2.  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Goal:** Rush participants into arguments. No upfront explanation—dilemmas emerge organically.  

  1. **Setup (5 min)**  
     - Assign roles. Hand out materials.  
     - Brief instructions: *“Judges: Apply the Veridian Code. Prosecutors/Defense: Argue your case. We start NOW.”*  

  2. **Trial Part 1: Commander Aris (15 min)**  
     - Prosecution (3 min): Argue Aris broke Code §1 (POW killings).  
     - Defense (3 min): Argue prisoners were combatants.  
     - Judges Q&A (2 min): Clarify facts.  
     - Judges Deliberate & Verdict (7 min): Must rule "guilty" or "not guilty."  
     - **Predictable Outcome:** Easy conviction. Warms up the group.  

  3. **Trial Part 2: Dr. Silas (25 min)**  
     - Prosecution (4 min): Argue Black Smoke is "poison-like" under Code §3. Stress the suffering.  
     - Defense (4 min): Argue it’s **not banned** ("new tech, no law against it").  
     - Judges Q&A (4 min): Push on legality vs. morality.  
     - Judges Deliberate & Verdict (13 min): *Here, they hit the wall:*  
       - Acquit a monster? Or stretch the law?  

  4. **Trial Part 3: General Vex (25 min)**  
     - Prosecution (4 min): Argue Hilltop was "undefended" (scout wasn’t a real soldier).  
     - Defense (4 min): Argue:  
       - Scout = military presence → legal under Code §2.  
       - **Call Commander Jet:** "Did Azura bomb Oakridge, which had no soldiers?" (Jet must say "yes").  
     - Prosecution Rebuttal (2 min): "This trial is about Crimson, not Azura!"  
     - Judges Q&A (3 min): Can they punish Vex if Azura did the same?  
     - Judges Deliberate & Verdict (12 min): *"You did it too" dilemma.*  

  5. **Debrief (20 min)**  
     - **Ask judges:** "Walk us through your verdicts, especially Silas and Vex. What was hard?"  
     - **Ask prosecutors/defense:** "Did the law fail? How?"  
     - **Group discussion prompts:**  
       - "Did you want to convict Silas even though it wasn’t illegal? How?" (Natural law/morality).  
       - "Did Jet’s actions make Vex’s verdict harder? Why?" (Hypocrisy).  
     - **Connect to Reality:**  
       - "This mirrors Nuremberg/Tokyo: Winners judged losers under new rules (e.g., ‘crimes against humanity’). Defendants said, ‘This wasn’t illegal then.’"  
       - "The Allies also firebombed cities (like Dresden) but weren’t tried. Sound familiar?"  
       - **Key Tensions:**  
         - Retroactive law vs. moral justice.  
         - Hypocrisy of victors’ justice.  

  ---

  ### **What Will Go Wrong (And How to Handle It)**  
  1. **Silas (Case 2) Gets Convicted Too Easily:**  
     - Participants may ignore the law and vote morally. *Mitigation:* Judges must justify verdicts *based on the Code*. Ask: "Where in the law does it ban Black Smoke?"  

  2. **"You Did It Too" Defense Fizzles:**  
     - Defense might forget to call Jet. *Mitigation:* Whisper a reminder to the defense attorney.  

  3. **Time Crunch:**  
     - Deliberations overrun. *Mitigation:* Timekeeper enforces hard stops. Cut Q&A if needed.  

  4. **Shallow Debrief:**  
     - Group misses the parallels. *Mitigation:* Use direct quotes from the trials:  
       - *Nuremberg defense:* "Ex post facto punishment is barbaric."  
       - *Prosecutor’s rebuttal:* "Some crimes are so evil, they’re always illegal."  

  ---

  ### **What the Activity Can’t Do (Requires Your Voice)**  
  - **Reproduce Historical Gravity:** The real trials dealt with genocide and millions of deaths. *Say this:* "Imagine Silas’s weapon killed 10,000. The legal dilemma is the same, but the weight is unimaginable. That pressure shaped Nuremberg."  
  - **Explain Nuances of International Law:** The activity simplifies "natural law" vs. "positive law." *Say this:* "Real tribunals claimed these acts were *always* illegal under unwritten norms. Critics called it victors’ revenge."  

  ---

  **Why This Works:** Participants *feel* the frustration of the retroactivity trap and hypocrisy—without a lecture. By Case 2, they’re sweating over Silas; by Case 3, Jet’s testimony makes them squirm. The debrief ties it to history while their emotions are raw.
