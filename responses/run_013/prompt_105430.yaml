answer: |-
  Here’s a rigorously earned desiderata list for persistence theories, grounded in concrete problems and your custom cases. Each entry is battle-tested against metaphysical puzzles, with your cases integrated to reveal core tensions.

  ---

  ### **Desiderata for a Theory of Persistence**  
  *(What any theory MUST explain to be viable)*

  1. **The Property Problem (Why Change is a Problem)**  
     *The Case:* A cup is red at t₁, green at t₂. How can *the same entity* instantiate incompatible properties (red/green) if it’s "wholly present" at each time?  
     *Requirement:* Explain how properties are temporally qualified without contradiction.  
     *Your Case (c) River:* The river is flowing (summer) and solid (winter). Does "being a river" require continuous flow, or can dispositional properties (e.g., *able to flow*) suffice during stasis? A theory must clarify if properties are occurrent or dispositional across time.

  2. **Material Coincidence**  
     *The Case:* A lump of clay (Lump) and a statue (David) occupy identical spacetime regions until David is smashed. If Lump survives but David does not, how can two distinct things be *materially identical* at a time?  
     *Requirement:* Resolve whether "same matter" implies "same object" or if persistence conditions (e.g., *being a statue*) override material continuity.  
     *Non-Negotiable?* No—but theories must *choose*: accept coincident entities (endurantism) or reject them (perdurantism).

  3. **Transitivity of Identity**  
     *The Case:* An amoeba (A) splits into B and C. B is identical to A, C is identical to A—but B ≠ C. Contradiction.  
     *Requirement:* Preserve the logical transitivity of identity. If a theory allows fission, it must deny that A survives as *both* B and C (e.g., A ceases to exist, or B/C are partial survivors).  
     *Non-Negotiable?* **Yes.** Violating transitivity collapses identity itself.

  4. **Temporal Gaps**  
     *The Case:* Your frozen organism (a). If metabolism ceases for 50 years, is it the *same* organism? Intuition says yes (e.g., cryopreservation).  
     *Requirement:* Specify whether persistence requires *continuous existence* or allows temporal interruptions.  
     *Theories:* Endurantism struggles (no "thing" to endure gaps?). Perdurantism handles gaps easily (temporal parts before/after, no part *during* freeze).  
     *Desideratum:* Accommodate intuitive continuity through non-activity.

  5. **Conventionality vs. Mind-Independence**  
     *The Case:* Your company (b). Legally dissolved/reincorporated with identical assets/staff. Is it the *same* entity? Social practice says yes; metaphysics may disagree.  
     *Requirement:* Decide if persistence depends on human conventions (e.g., legal personhood) or mind-independent facts (e.g., causal history).  
     *Theories:* Endurantism often leans on conventions; perdurantism may treat "the company" as a temporal aggregate of stages.

  6. **Relativistic Simultaneity**  
     *The Case:* In special relativity, there’s no universal "now." If an object persists from t₁ to t₂, but t₁-t₂ isn’t absolute, what counts as "the same time" for being "wholly present"?  
     *Requirement:* Avoid reliance on global simultaneity.  
     *Non-Negotiable?* **Yes** for physical realism. Forces theories into spacetime frameworks (e.g., perdurantism’s 4D worms fit naturally; endurantism requires reinterpretation).

  7. **Causal Integration**  
     *The Case:* A ship’s planks are replaced one-by-one. Is the final ship identical to the original? Intuition demands causal connection (e.g., gradual replacement preserves identity; sudden reassembly does not).  
     *Requirement:* Explain how past/future states are linked beyond mere similarity.  
     *Non-Negotiable?* **Yes.** Without causal continuity, persistence reduces to accidental resemblance.

  ---

  ### **The Trilemma & Non-Negotiables**  
  The core tension is a **trilemma** arising from three desiderata:  
  - **Property Problem** (How can one thing have contradictory properties?)  
  - **Transitivity of Identity** (Identity must be transitive)  
  - **Causal Integration** (Persistence requires causal connection)  

  **You can’t have all three simultaneously:**  
  - If an object is *strictly identical* at t₁ and t₂ (Transitivity), and instantiates red at t₁/green at t₂ (Property Problem), it violates non-contradiction.  
  - To resolve this, theories must:  
    - **Deny strict identity over time** (perdurantism: different temporal parts have different properties) → *sacrifices Transitivity for the whole*.  
    - **Relax property instantiation** (endurantism: properties are time-indexed) → *preserves Transitivity but weakens "wholly present"*.  
    - **Deny intrinsic change** (e.g., mereological essentialism) → *rejects the Property Problem but violates intuition*.  

  **Most Consequential Desideratum: The Property Problem**  
  Insisting that objects *literally* have incompatible properties at different times **eliminates endurantism** (which requires time-indexed properties) and **mereological essentialism** (which denies change). Only perdurantism (or stage theory) survives unscathed.  

  ---

  ### **How Your Cases Test the Desiderata**  
  - **(a) Frozen Organism → Tests Temporal Gaps & Causal Integration**  
    To pass: Must explain identity through causal potential (e.g., frozen state sustains causal powers for revival). Perdurantism wins; endurantism needs immanent causation.  
  - **(b) Dissolved Company → Tests Conventionality vs. Mind-Independence**  
    To pass: Must either accept social conventions as metaphysically constitutive or reject corporate persistence. Exposes a rift between folk intuition and ontology.  
  - **(c) Freezing River → Tests Property Problem (Dispositions)**  
    To pass: Must explain how dispositional properties (e.g., *riverhood-as-flow-capacity*) persist during stasis. Forces theories to define essential vs. accidental properties over time.  

  ---
  **Result:** A viable theory must satisfy **Transitivity**, **Causal Integration**, and **Relativistic Compatibility** while *choosing* how to resolve the Property Problem and Material Coincidence. The frozen organism and river cases pressure endurantism; the company case challenges perdurantism’s objectivity. The trilemma ensures no theory gets everything—students must grapple with trade-offs.
