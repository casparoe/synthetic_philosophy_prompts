prompt: |-
  For about fifteen years I have read the rationalist and effective-altruism blogs, and I have a set of settled verdicts about acting on very small probabilities that I cannot get to fall out of any single rule. I would like you to tell me what principle, or small set of principles, actually generates them, and which of the verdicts has to be abandoned if the principle is to be respectable rather than a patchwork.

  My verdicts, stated as what I do or would do:

  1. A stranger tells me that unless I hand him $5 he will have me tortured, along with a great many other people: 3^^^3 of them, which in Knuth's up-arrow notation is a power tower of 3s some 7.6 trillion entries high, vastly more people than there are particles in the observable universe. I put perhaps one chance in 10^40 on his being able to do anything of the kind. I refuse, and it does not feel close; I would refuse if he asked for a penny.

  2. I give roughly a tenth of my income to organizations that I estimate have something like a one-in-a-thousand chance of measurably reducing the probability that humanity fails to survive this century, where success would be worth on the order of 10^15 lives. I take this to be among the best uses of my money.

  3. I do not subscribe to a service that charges $9 a month and claims to reduce the probability of human extinction by one part in 10^12. Its method is proprietary, but a ratings outfit I half-trust rates it highly, and someone has checked the arithmetic inside the model that the company was willing to show. I am mildly scornful of people who subscribe.

  4. I would not buy a $2 ticket in a lottery with a one-in-10^8 chance of a $1 billion jackpot, though the expected value is about $8. I would not buy one at a one-in-10^7 chance of $100 million either, where the expected value is also about $8. I know the arithmetic; I would still not buy.

  5. I buy travel and health insurance, which have plainly negative expected value, and I do not think I am making a mistake.

  6. If a well-understood physical experiment carried, on the best available calculation and after review by competent people, a one-in-10^40 chance of destroying the observable universe, I would let it run. That is the same probability as the wizard in case 1, and the harm the wizard threatens is if anything larger, yet I reach the opposite verdict without hesitation.

  7. I have been told that a publicly known expected-value maximizer is a money pump: anyone who can attach a large enough number to a claim can extract from him whatever he will bear, so the correct policy is to be the kind of agent who refuses offers of this shape on principle rather than to price them one at a time. That thought does real work in my refusal in case 1, and I suspect it does less than I pretend. If I knew the wizard were the last of his kind, and that no threat of this shape would ever be made again, I believe I would still refuse.

  8. For one cent I would buy protection against a one-in-10^9 chance that everyone I love dies in a fire, and I would not think about the probability at all.

  The rule I have been using on myself is: maximize expected value, but ignore any probability below about one in a million. It returns verdicts 1, 2, 3, 4 and 6 correctly as far as I can tell, which is suspicious. It says nothing useful about 5, since insurance is not a small-probability problem but a deliberately negative-expected-value purchase. It returns 7 correctly only if I let the money-pump argument in, and I have just told you I doubt that argument. And it fails 8 outright: by that rule the one-in-10^9 fire risk is beneath notice, which seems obviously wrong, and so does the implication that I should ignore a one-in-a-billion chance of losing everything I own even when the insurance costs a penny.

  Please do the following. State the principle, or the two or three competing principles, precisely enough that I could compute with them, and say for each clause which of my verdicts forces it. Tell me what each principle implies about cases I have not mentioned, in particular a charity that offers, for $1,000, to reduce the probability of a nuclear war by one part in 10^9, and a wizard who asks for a sum small enough that I would not notice paying it. Then tell me honestly which of my verdicts it cannot accommodate, and whether those are the ones I should revise. I would rather end up with a simpler principle and one changed verdict than a rule with a clause invented for each case, but I would like to know which of my cases I am paying to keep.
reasoning: |-
  Okay, let me try to figure out what's going on with this user's dilemma. They've been into rationalist and EA blogs for 15 years and have these specific judgments about small probabilities that don't fit into a single rule. The challenge is to find a consistent principle that explains most of their verdicts and identify which ones might need revising.

  First, looking at their cases. The wizard scenario (1) involves an extremely low probability (1 in 10^40) of an astronomical harm (3^^^3 people tortured). They refuse to pay even a penny. But in case 6, with the same tiny probability of universe destruction from a physics experiment, they're fine with it. Interesting how the context changes their response even with identical probabilities. The money-pump concern in case 7 seems important here—they're worried about being exploited if they pay in such scenarios.

  Their charitable giving (2) makes sense under standard expected value calculations since 0.001 * 10^15 lives saved justifies donating 10% of income. But the extinction prevention service (3) at $9/month for a 1 in 10^12 risk reduction gets rejected despite positive expected value. Why? Maybe because the probability is too small to take seriously, or there's skepticism about the service's effectiveness.

  The lottery ticket refusal (4) puzzles me because expected value is positive ($8 for $2 ticket). Loss aversion? Or perhaps they intuitively discount tiny probabilities below some threshold. Insurance purchases (5) fit standard risk-aversion models since they're protecting against unbearable losses despite negative EV.

  Case 8 is crucial—they'd pay a penny to avoid a 1 in 10^9 chance of loved ones dying. This breaks their current "ignore below 1 in a million" rule completely. The emotional weight here overrides pure probability calculations.

  Hmm... their current rule fails multiple cases. Need to find principles that handle this. Domain restriction seems promising—treating cosmic/extinction risks differently from personal ones. Or maybe decision-weighting functions that overweight tiny probabilities only for emotionally salient losses. But neither explains the physics experiment exception (case 6).

  Perhaps it's about epistemic access. In wizard and sketchy service cases, they distrust the probability estimates, whereas in the physics experiment, reputable scientists are involved. But case 8's fire risk is hypothetical yet they take it seriously—so trust isn't the whole story.

  The bounded ethical weight idea might work—capping how much value we assign to extreme outcomes. But they reject this in case 7. And it doesn't explain case 6 vs case 1 divergence.

  Two-system framework? System 1 (emotional) handles personal risks like case 8, System 2 (calculative) handles big impersonal stakes like case 2. But case 1 triggers System 1's "scam detector" while case 6 doesn't. And case 3 falls between—calculated but rejected.

  For the nuclear war charity question: $1000 for 1 in 10^9 risk reduction. If baseline nuclear war risk is 1%, reduction is tiny (0.000000001%), saving maybe 80k lives in expectation. Expected value per dollar is terrible compared to GiveWell charities. They'd likely reject it, consistent with case 3.

  For negligible-cost wizard: if asked for a fraction of a cent, they might pay to avoid infinitesimal ethical burden, but their case 1 refusal suggests firm anti-extortion principle regardless of amount. Probably still refuse on principle.

  Main tension is between case 8 (act on tiny personal risk) and case 1 (ignore tiny cosmic threat). The key difference seems to be personal stake vs abstract large numbers. To resolve, they might need to accept that case 8 is an emotional exception or downgrade case 1's "infinity dust" threat to finite value.

  Honestly, case 1 seems least defensible—if the wizard were real and probability non-zero, refusing a penny for 3^^^3 torture victims seems irrational. But their intuition is strong, so maybe embrace it as a "never negotiate with terrorists" principle while admitting it's inconsistent with strict expected value.

  Tough choices ahead for them...
answer: |-
  After analyzing your verdicts, I propose a unified framework with two core principles and one meta-principle. Your intuitions arise from **competing decision systems** (instrumental rationality vs. moral/psychological constraints), moderated by **epistemic filters**. Below, I formalize this, map it to your cases, identify tensions, and recommend revisions.

  ### Core Principles
  1. **Domain-Restricted Expected Value Maximization (DREV)**  
     Maximize expected value *only* when:  
     - The probability \( p \) satisfies \( p \geq p_{\text{min}} \) OR the outcome is "personally salient" (affects you or entities with direct emotional/instrumental ties to you).  
     - \( p_{\text{min}} = 10^{-9} \) (one in a billion) based on your verdicts.  
     - Outcomes involving abstract large numbers (e.g., \( 3^{ \uparrow\uparrow\uparrow 3} \) lives) are capped at a finite "ethical ceiling" \( C \approx 10^{15} \) lives (or equivalent value).  

  2. **Deontic Boundary Conditions (DBC)**  
     Reject *any* action that:  
     - Resembles extortion, coercion, or "Pascal's Mugging" (irreducible epistemic uncertainty + unbounded stakes).  
     - Violates precommitments against incentivizing malicious actors.  
     - Involves outcomes where your personal responsibility is direct and unambiguous (e.g., family harm).  

  3. **Epistemic Filter (EF)**  
     Only assign non-zero probability \( p \) to claims if:  
     - They come from a process with **calibrated track records** (e.g., physics experiments) OR **personal-stakes evidence** (e.g., insurance models).  
     - Ignore probabilities from uncalibrated sources (e.g., proprietary algorithms, strangers) if \( p < 10^{-9} \), treating them as \( p \approx 0 \).  

  ---

  ### How Your Verdicts Are Generated
  - **Case 1 (Wizard):** DBC dominates. You refuse because it’s extortion + uncalibrated claim (\( p \ll p_{\text{min}} \)). EF sets \( p \approx 0 \). DREV caps stakes at \( C \approx 10^{15} \), making EV negligible. *Forcing clauses: DBC (extortion), EF (uncalibrated), DREV (cap).*  
  - **Case 2 (Charity):** DREV dominates. \( p = 10^{-3} \gg p_{\text{min}} \), stakes (\( 10^{15} \) lives) below cap \( C \). EV justifies donation. *Forcing clause: DREV (no cap triggered).*  
  - **Case 3 (Extinction service):** EF + DREV dominate. Proprietary model is uncalibrated; \( p = 10^{-12} < p_{\text{min}} \), so EF sets \( p \approx 0 \). *Forcing clauses: EF (uncalibrated), DREV (\( p < p_{\text{min}} \)).*  
  - **Case 4 (Lottery):** Psychological loss aversion (not explicit here) overrides DREV. But DREV allows this since \( p = 10^{-8} < p_{\text{min}} \) (or close), and lotteries lack personal salience. *Forcing clause: DREV (\( p < p_{\text{min}} \) for impersonal stakes).*  
  - **Case 5 (Insurance):** DREV exempts this (personally salient + calibrated risk). Purchased due to risk aversion over tangible losses. *Forcing clause: EF (calibrated) + DREV (salience).*  
  - **Case 6 (Physics experiment):** EF + DREV dominate. Calibrated source (\( p \geq 10^{-40} \) is valid), but \( p < p_{\text{min}} \) and stakes cosmic. DREV caps harm at \( C \), so EV \(\approx 0\). *Forcing clauses: EF (calibrated), DREV (cap).*  
  - **Case 7 (Money pump):** DBC justifies refusal as anti-extortion precommitment. Holds even without future threats (your doubt is noted). *Forcing clause: DBC (principle-based refusal).*  
  - **Case 8 (Family fire risk):** DBC + DREV dominate. Personally salient, so exempt from \( p_{\text{min}} \). DBC enforces action for direct responsibility. *Forcing clauses: DBC (personal duty), DREV (salience exemption).*  

  ---

  ### Predictions for New Cases  
  - **Nuclear-war charity (reduce risk by \( 10^{-9} \) for $1,000):**  
    - Baseline nuclear war risk is ~1% (calibrated estimates). Reduction saves ~\( 0.01 \times 10^{-9} \times 8 \times 10^9 \) lives ≈ 0.0008 lives in expectation.  
    - **Verdict:** Reject. EF accepts probability (calibrated risk), but DREV applies: \( p_{\text{delta}} = 10^{-11} < p_{\text{min}} \) (since risk reduction is tiny), and stakes impersonal. EV = $1,000 for ~$400 of good (using $50k/life benchmark).  

  - **Wizard with negligible demand (e.g., $0.0001):**  
    - **Verdict:** Refuse. DBC (extortion) and EF (uncalibrated) dominate. Even trivial costs are rejected on principle.  

  ---

  ### Inconsistencies and Required Revisions  
  Your framework is **mostly coherent** but requires abandoning *one key verdict* to avoid ad-hoc patches.  

  - **Problem:** The conflict between **Case 1 (refuse wizard)** and **Case 8 (pay for family risk)**.  
    - Case 1 uses DBC/EF to ignore a tiny probability of vast harm.  
    - Case 8 overrides \( p_{\text{min}} \) for personal stakes.  
    - Yet **Case 6 (physics experiment)** is identical in structure to Case 1 (tiny \( p \), vast harm) but gets the opposite verdict. This is unsustainable.  

  - **Resolution:** Revise **Case 6** to align with Case 1.  
    - **New Verdict for Case 6:** Refuse to run the experiment.  
    - Why? If \( p = 10^{-40} \) destruction is non-zero and stakes are truly infinite (observable universe), DBC should treat it like extortion: "Nature's Mugging." EF accepts calibrated \( p \), but DBC forbids actions with unbounded downside and irreducible uncertainty, even for science.  
    - This fix keeps DBC intact and removes the stakes cap \( C \) from DREV (simplifying the model).  

  - **Why not revise Case 1 instead?**  
    - Your intuition is strong here (and DBC does real work). Abandoning it invites exploitation and violates your anti-mugging commitment.  
    - Case 6 lacks the "extortion" element, but the *structure* is identical: tiny \( p \), vast harm. Treating it differently is a patchwork.  

  - **Other verdicts hold:**  
    - Case 3 (scorn) is justified by EF.  
    - Case 4 (lottery) is permitted; DREV allows overriding EV for \( p < p_{\text{min}} \).  
    - Case 7 (money pump) is core to DBC.  

  ---

  ### Final Framework  
  - **DREV:** Maximize EV for \( p \geq 10^{-9} \) or personally salient stakes.  
  - **DBC:** Reject extortion, uncalibrated tiny probabilities, and actions with unbounded/unthinkable downsides.  
  - **EF:** Assign \( p > 0 \) only to calibrated or salient claims.  

  **Cost of revision:** You pay for **Case 6** (accepting the physics experiment) by abandoning it. This preserves your strongest intuitions (wizard refusal, family protection) and removes the arbitrary stakes cap.  

  **Result:** A principled, computable system with one verdict changed. To compute any decision:  
  1. Filter probabilities with EF (ignore if uncalibrated and \( p < 10^{-9} \)).  
  2. Apply DBC to reject extortion/unthinkable downsides.  
  3. Apply DREV to calculate EV for non-DBC cases.  

  This explains 7/8 verdicts natively (all except the revised Case 6), with insurance (Case 5) handled by personal salience. The lottery (Case 4) falls under DREV’s allowance for psychological factors when \( p \) is small and stakes impersonal.
