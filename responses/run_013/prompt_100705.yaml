  First, I need to parse each case they mentioned. The first five scenarios involve consenting adults: assisted dying, incest between siblings, self-sacrifice for an experiment, voluntary amputation, and consensual severe beating. All these seem acceptable to the user. The last three—duels, bestiality, and selling one's life contract—feel wrong even with consent. The user suspects this conflict stems from the harm principle versus moral enforcement.

  Their proposed principle has two parts: criminalize acts that harm non-consenting parties or degrade essential practices. But they're unsure if the second part is valid or just disguised disgust. The challenge is to test this principle against their cases and a new one: televised lethal combat for family proceeds.

  Starting with the first clause: harm to non-consenting parties. In assisted dying, the ill adult consents, so it's okay. Incest between siblings—both consent, no direct harm mentioned, so permissible under this clause. The lethal experiment volunteer consents, so allowed. Voluntary amputation: patient consents, so shouldn't be criminal. Consensual beating: both parties agree, so fine. 

  But duels involve two consenting adults. Why are they problematic? The second clause might apply here. Duels could degrade the value of human life, which society depends on. Similarly, bestiality—no human victim, but it might degrade concepts of consent since animals can't consent. Selling one's life contract: consent is present, but commodifying life could undermine societal values around human dignity.

  Now, the user's unease about voluntary amputation might hint at the second clause. If amputation without medical need degrades medical practice, that could be a concern. But the user still thinks it shouldn't be criminal, so maybe the degradation isn't severe enough here.

  For the televised lethal combat league: participants consent, proceeds to families. Using the two clauses, the first clause doesn't apply since all involved consent (assuming no third parties harmed). The second clause might see this as degrading the sanctity of life, turning death into entertainment, thus warranting prohibition. This aligns with the duel case.

  The user should consider if they're consistent. If duels are banned for degrading life's value, then the combat league should also be banned. But if they allow the self-sacrifice experiment, which also involves death, the difference might be in the purpose—saving others versus entertainment. The second clause's "degrading meaning" needs clearer definition to avoid arbitrariness.

  Potential conflict: Allowing consensual beating but not duels. Both involve violence, but duels to death might be seen as a more severe degradation. The key is whether the act undermines a fundamental societal practice. The user might need to refine the second clause to specify which practices are essential and how degradation is measured, to prevent it from becoming a cover for moral disgust.

  In conclusion, the principle mostly holds, but the second clause needs careful handling. For the combat league, the principle would likely criminalize it due to degradation of life's value, similar to duels. The user should examine if their unease with certain cases stems from genuine societal harm or personal discomfort, ensuring the second clause isn't misused.
answer: |-
  Your intuitions reveal a fascinating tension between autonomy and societal values. Your proposed principle—**criminalizing conduct that either (1) sets back the interests of non-consenting parties or (2) degrades the meaning of a practice essential to societal functioning**—captures much of this, but requires refinement. Let's test it against your cases:

  ### **Cases Forcing Each Clause**  
  **1. Clause 1 (Harm to Non-Consenting Parties):**  
     - **Bestiality**: The animal cannot consent. Its interests are set back without agreement, satisfying Clause 1.  
     - *Verdict upheld*: Crime.  

  **2. Clause 2 (Degradation of Essential Practices):**  
     - **Duels**: Consent exists, but duels degrade the societal practice of resolving disputes non-violently and devalue human life as fungible.  
     - **Selling one’s life contract**: Turns human life into a commodified transaction, degrading the inviolability of life (a foundation of law/ethics).  
     - **Televised lethal combat league** (your unlisted case): Consent is present, but it degrades life into spectacle/entertainment, eroding respect for human dignity.  
     - *Verdicts upheld*: Crimes.  

  **3. Cases Satisfying Neither Clause (Permissible):**  
     - **Assisted dying**: Terminally ill adult consents; no degradation of medical practice (palliative care aligns with healing ethos).  
     - **Incestuous siblings**: Mutual consenting adults; no harm to others. (Note: Risk of coercion/offspring defects *could* invoke Clause 1, but you specified no victims.)  
     - **Lethal self-sacrifice**: Consent given; heroic sacrifice may *reinforce* societal values (e.g., duty to others).  
     - **Voluntary amputation**: Patient consents; medical ethics already permit non-therapeutic surgery (e.g., cosmetic procedures). Your unease may stem from intuitive "waste" but not degradation.  
     - **Consensual severe beating**: BDSM context; no third-party harm. Criminalizing would intrude on private autonomy without degrading broader practices.  

  ### **Inconsistent Verdict? What to Reconsider**  
  - **Incest between siblings**: This is the weakest link in your initial verdicts. If both are competent, consenting, and use contraception (avoiding harm to potential offspring), *only disgust or vague morality* justifies prohibition—not your principle. Degradation of "family" is possible but highly abstract. **Recommendation**: Abandon prosecuting this case to align with your principle. If retained, it undermines your framework.  

  ### **The Televised Lethal Combat League**  
  - **Analysis**: Participants consent; proceeds benefit families (no direct non-consenting victims). However, it **violates Clause 2**: Publicly staging death as sport degrades the meaning of human life, reducing it to entertainment and incentivizing desperation (e.g., poverty-driven participation). Like duels, it risks normalizing lethal violence.  
  - **Verdict**: Criminalize under Clause 2.  

  ### **Strengths and Weaknesses of Your Principle**  
  - **Strength**: Resolves 8/9 cases coherently. Clause 1 handles exploitation; Clause 2 addresses "victimless" harms to social fabric.  
  - **Weakness**: Clause 2 risks smuggling in moralism. Is "degradation" objective? Consider:  
    - **Amputation vs. Combat League**: Voluntary amputation doesn’t degrade medicine (still serves health goals). Combat leagues degrade life’s sanctity.  
    - **Disgust vs. Degradation**: Bestiality triggers disgust, but Clause 1 already covers it (non-consenting animal). For incest, disgust *without* degradation may be insufficient for criminalization.  

  ### **Refined Principle**  
  > **The state may criminalize conduct if:**  
  > **(1) It harms non-consenting beings, OR**  
  > **(2) It undermines a foundational societal institution (e.g., law, medicine, kinship) by perverting its essential purpose,**  
  > **provided the harm/degradation is concrete and demonstrable, not merely symbolic.**  

  This forbids "degradation" based on vague morality (e.g., homosexuality) but captures duels/combat leagues (perverting conflict resolution/medicine into killing). It also explains your unease about amputation: if done *without medical justification*, it edges toward degrading medicine—yet not severely enough to outweigh autonomy, unlike killing.  

  ### **Conclusion**  
  Your principle holds with one revision: **abandon prosecuting consensual incest** to avoid inconsistency. For the rest, Clauses 1 and 2 cleanly divide your intuitions. The televised combat league is criminalized under Clause 2, as it commodifies death and erodes the value of life—a degradation society cannot tolerate. What remains is a liberal principle that respects autonomy but draws lines at exploitation and institutional corrosion.
