prompt: |-
  ok so I'm in a metaphysics seminar and we spent basically the whole week on dispositions, and I've come out the other side more confused than I went in, which everyone tells me is normal but whatever. The setup was three cases. First, a wire that's live, except the instant anything touches it a little gadget cuts the power, so it never actually shocks you. Second, a glass that really is fragile but is sitting in a foam sleeve, so it survives getting knocked. Third, a glass that isn't fragile at all but has a device attached that smashes it whenever you tap it, so it "breaks when struck" without ever being fragile. As far as I can tell the point of all three is just that "would break if struck" and "is fragile" can come apart in both directions.

  Here's where I'm stuck. If whether a thing breaks, or shocks, or dissolves is decided by whats around it — the gadget, the foam, the tapper — and never by the thing on its own, then doesn't that mean having a disposition isn't a fact about the object at all, it's a fact about the object-plus-its-surroundings? And if thats right then "fragile" isn't an intrinsic property of the glass, it's a relation between the glass and its environment. And worse, since the manifestation only ever shows up when the surroundings cooperate, we can never actually observe a disposition itself, only the outcome — so the disposition isn't doing any explanatory work, it's just a fancy name for the outcome we already described. My friend says I've got it exactly backwards but won't say how, and my prof keeps insisting these cases were built to save intrinsic dispositions rather than sink them, which I genuinely do not understand.

  I tried patching it by saying fine, fragile just means "would break if struck, unless something stops it," but that feels like it swallows every counterexample and ends up saying nothing at all. So which of my moves is the bad one, and what am I supposed to be saying instead about the wire and the two glasses?
