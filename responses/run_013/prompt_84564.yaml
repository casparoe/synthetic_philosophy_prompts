prompt: |-
  I teach a graduate methods seminar and we keep having the same argument: a table shows an association in every stratum and the reverse in the pooled data, and half the room reads the pooled number as the finding while the other half reads the strata. Before we work through more examples I want the specification. Set out the desiderata for an adequate account of when an association should be read off the aggregate and when off the strata — adequate, that is, for a working analyst deciding what to report from an observational study. Include the cases it must get right (pooling plainly correct; stratification plainly correct; the choice turning on whether the covariate is causally prior to both variables, causally downstream of one, or a common effect of the two; a reversal with no causal difference behind it; the relevant variable unmeasured or measured with error), the distinctions it must not collapse (association versus effect; a crude contrast versus an adjusted one; a covariate that changes the answer because it is causally prior versus one that changes it because it is causally downstream), and the results it must be consistent with (that one and the same joint distribution can be generated by a structure in which the covariate causes both variables and by a structure in which both cause it, so the data alone may not settle the reading; that some effect measures are not collapsible, so a crude and an adjusted value can differ with no confounding present at all, as with the odds ratio; that the sure-thing principle is supposed to constrain the choice between prospects). Give the consideration behind each requirement, mark which are non-negotiable and which are commitments of a particular camp, say which single requirement does the most to exclude candidates, and flag any pair you suspect cannot be jointly satisfied — that last part is what I most want to see. A line or two on how a graphical account, a potential-outcomes account, and a rule that ignores causation fare against the list is enough to close.
reasoning: |-
  We are to set out desiderata for an adequate account of when to read an association from aggregate (pooled) data versus stratified data in an observational study. The account must be practical for a working analyst.

  ### Cases the Account Must Get Right
  1. **Pooling plainly correct**: When the strata are not relevant (e.g., no confounding, no effect modification) and pooling gives the true association.
     - *Consideration*: In some cases, stratification is unnecessary and may even introduce noise. The overall association is the target.

  2. **Stratification plainly correct**: When there is confounding by the covariate, so the stratum-specific associations are the ones that reflect the true relationship and the pooled estimate is biased.
     - *Consideration*: The covariate is a confounder (common cause of exposure and outcome) and must be adjusted for.

  3. **The choice turning on the causal role of the covariate**:
     - *Causally prior to both* (a confounder): Adjust (stratify) to block backdoor paths.
     - *Causally downstream of one* (a mediator): Do not adjust (pool) if the goal is the total effect, but adjust if the goal is the direct effect (but note: for total effect, we do not adjust for mediators).
     - *A common effect of the two* (a collider): Do not adjust (pool) if the collider is not conditioned upon, but if it is conditioned upon (e.g., by stratification) it may induce a spurious association. Thus, we should not stratify on a collider unless we have a specific reason (like examining effect heterogeneity) and understand the consequences.

  4. **A reversal with no causal difference behind it (Simpson's paradox)**: The reversal is due purely to the mathematical aggregation and not to a causal structure. The account must be able to recognize when the reversal is a statistical artifact and when it reflects confounding.
     - *Consideration*: Sometimes the reversal is due to the non-collapsibility of the effect measure (like the odds ratio) without any confounding.

  5. **The relevant variable unmeasured or measured with error**: The account must provide guidance when the covariate of interest is not available or imperfectly measured. It should acknowledge that without the covariate, we might have to rely on the pooled estimate and that this could be biased.

  ### Distinctions the Account Must Not Collapse
  1. **Association versus effect**: Association is a statistical relationship, while effect is causal. The account must not confuse an observed association (which might be confounded) with a causal effect.
     - *Consideration*: The goal is often to estimate a causal effect, but without randomization, we rely on associations adjusted for confounders.

  2. **Crude contrast versus an adjusted one**: The account must recognize that the unadjusted (pooled) association may be biased and that the adjusted (stratum-specific) association is the target when there is confounding. However, it must also recognize that in the absence of confounding, the crude estimate is acceptable.

  3. **A covariate that changes the answer because it is causally prior (confounder) versus one that changes it because it is causally downstream (mediator or collider)**:
     - *Confounder*: We adjust to remove confounding.
     - *Mediator*: Adjusting for a mediator blocks the indirect path and gives the direct effect, which may not be the target.
     - *Collider*: Adjusting for a collider can create bias.

  ### Results the Account Must Be Consistent With
  1. **Same joint distribution, different causal structures**: The account must acknowledge that without prior causal knowledge, the data alone may not determine whether the covariate is a confounder, mediator, or collider. Thus, the choice of pooling versus stratification may require subject-matter knowledge.
     - *Consideration*: The data generating process is underdetermined by the joint distribution.

  2. **Non-collapsibility**: Some effect measures (like the odds ratio) are not collapsible. This means that even in the absence of confounding, the crude and adjusted estimates may differ (e.g., the marginal OR vs conditional OR in logistic regression). The account must not misinterpret non-collapsibility as confounding.
     - *Consideration*: Non-collapsibility is a property of the effect measure, not necessarily an indication of bias.

  3. **The sure-thing principle**: This principle (from decision theory) states that if an action is preferred in every possible state of the world, then it should be preferred overall. In the context of Simpson's paradox, it would suggest that if the association is positive in every stratum, then the overall association should be positive. However, the paradox shows that this is not always the case. The account must reconcile that the sure-thing principle is a normative principle but in statistical aggregation, it might be violated due to the weighting (e.g., when strata sizes are unequal). The account must clarify that the sure-thing principle applies to decisions under uncertainty, but in causal inference, we are often interested in the weighted average of the strata (if the covariate is a confounder) and the violation in the pooled data is due to confounding.

  ### Marking Non-Negotiable vs Camp Commitments
  - **Non-negotiable**:
     - The account must distinguish association from effect (because the goal is often causal inference).
     - It must not collapse the distinctions between confounders, mediators, and colliders (because adjusting inappropriately can cause bias).
     - It must be consistent with non-collapsibility (because it is a mathematical property of some effect measures).
     - It must acknowledge that the same data can be generated by different causal structures (because that's a fact about joint distributions).

  - **Camp commitments**:
     - The sure-thing principle might be more emphasized in decision-theoretic approaches. Some camps might require that the account must satisfy the sure-thing principle (meaning that if the association is in the same direction in every stratum, then the overall association should be in that direction) but in causal inference, we know that the pooled estimate can be biased by confounding. Thus, the camp that focuses on causal effects might not require the sure-thing principle to hold for the pooled association because they are interested in the adjusted association.

  ### The Requirement That Does the Most to Exclude Candidates
  The requirement that **the account must be consistent with non-collapsibility** might be the most excluding because it is a technical point that many intuitive accounts might miss. For example, an account that says "always report the stratified estimate when it is homogeneous" would fail when the effect measure is non-collapsible and the strata are of different sizes because even without confounding, the adjusted and unadjusted estimates differ. Thus, the account must be sophisticated enough to separate the issue of non-collapsibility from confounding.

  ### Pairs That Might Be Hard to Satisfy Jointly
  1. **The sure-thing principle and the need for stratification in the presence of confounding**: The sure-thing principle would suggest that if the association is in the same direction in every stratum, then the overall association should be in that direction. However, in the presence of confounding, the pooled estimate might be in the opposite direction (Simpson's paradox). Therefore, we must stratify to get the correct association. But the sure-thing principle, if taken as a requirement for the pooled estimate, would be violated. So we have to choose: either abandon the sure-thing principle for the pooled estimate (and instead use the adjusted estimate) or modify the principle. This tension is difficult to resolve because the sure-thing principle is about the decision based on the data, but the data we see might be confounded.

     - *Suspicion*: We cannot have both the sure-thing principle (for the pooled estimate) and the requirement to stratify in the presence of confounding. The account must clarify that the sure-thing principle applies to the conditional associations (within strata) and the causal effect of interest is a weighted average of these, but the pooled estimate does not necessarily reflect that weighted average if the covariate is a confounder and the strata are of unequal size and the effect is non-collapsible.

  ### How Different Accounts Fare
  - **Graphical account (e.g., DAGs)**:
     - *Strengths*: Clearly distinguishes confounders (common causes), mediators, and colliders. It can handle the causal structure and guide when to adjust. It is consistent with non-collapsibility because it focuses on the causal structure and not the effect measure. It does not collapse association and effect because the graph represents causal assumptions. It can handle unmeasured variables by showing the limitations (e.g., if a confounder is unmeasured, we cannot adjust).
     - *Weaknesses*: Requires the analyst to specify the causal graph, which may be challenging and subjective. It does not by itself solve the problem of non-collapsibility (it still requires the correct effect measure to be chosen).

  - **Potential-outcomes account**:
     - *Strengths*: Clearly defines causal effects (e.g., average treatment effect) and uses stratification (or other methods) to adjust for confounders. It can define direct and indirect effects. It is consistent with non-collapsibility because it uses the correct weighting (e.g., standardization) to get average effects. It distinguishes association from effect by defining the target as a causal contrast.
     - *Weaknesses*: It requires strong assumptions (e.g., no unmeasured confounding, positivity) and may be less intuitive for the role of colliders and mediators in the absence of a graph. The issue of non-collapsibility is handled by the choice of effect measure (e.g., risk difference is collapsible, but odds ratio is not).

  - **Rule that ignores causation (e.g., purely statistical)**:
     - *Strengths*: Simple rules (like always report the stratified estimate when there is effect modification) might be easy to apply.
     - *Weaknesses*: It fails to distinguish confounders from mediators and colliders. It may collapse association and effect. It may misinterpret non-collapsibility as effect modification or confounding. It cannot handle unmeasured confounding. It would be inconsistent with the requirement that the same data can come from different structures. It would not satisfy the sure-thing principle appropriately because it might not account for the causal structure.

  ### Conclusion
  The graphical and potential-outcomes accounts are well-equipped to handle the desiderata, with the graphical account providing a visual guide to the causal structure and the potential-outcomes account providing a formal mathematical framework. Both require causal assumptions and subject-matter knowledge. The purely statistical rule is inadequate.

  For the working analyst, the account should be based on causal diagrams (DAGs) or potential outcomes, as these frameworks explicitly address the causal structure and guide when to pool and when to stratify. The account must include the caveat about non-collapsibility and the need to choose an appropriate effect measure.

  **Final specification for the analyst**:
  - **Step 1**: Draw a causal diagram (DAG) based on subject-matter knowledge to identify confounders, mediators, and colliders.
  - **Step 2**: If a covariate is a confounder (common cause of exposure and outcome), then stratify (or adjust) to block the backdoor path. Report the adjusted association (possibly as a weighted average of the strata).
  - **Step 3**: If a covariate is a mediator, then do not adjust for it if the target is the total effect. Adjust for it if the target is the direct effect (but be aware of the assumptions).
  - **Step 4**: If a covariate is a collider, do not adjust for it unless there is a specific reason (like examining effect heterogeneity) and be cautious of induced bias.
  - **Step 5**: Consider the effect measure: if using an odds ratio (or other non-collapsible measure), note that the marginal and conditional estimates may differ even without confounding. Prefer collapsible measures (e.g., risk difference) when possible for average effects, or use standardization to obtain a marginal effect from a conditional model.
  - **Step 6**: If the covariate is unmeasured or measured with error, acknowledge that the analysis is subject to residual confounding and may need sensitivity analysis.
  - **Step 7**: When the data show a reversal (Simpson's paradox), use the causal structure to decide: if the covariate is a confounder, the stratified estimate is the one to report; if the reversal is due to non-collapsibility, then the adjusted estimate is still the one that is consistent with the stratum-specific estimates (but note the non-collapsibility issue). The sure-thing principle is a normative principle for decision making and does not override the need for causal adjustment.

  This account meets the desiderata and is practical for a working analyst.
answer: |-
  ### Desiderata for Adequate Account of Pooled vs. Stratified Association Reporting  
  **Goal**: Provide a decision framework for analysts reporting associations from observational studies, resolving when to use pooled (aggregate) data versus stratified data.  

  ---

  #### **Cases the Account Must Get Right**  
  1. **Pooling plainly correct**: When no confounding exists and strata are irrelevant (e.g., covariate independent of exposure/outcome).  
     - *Consideration*: Unnecessary stratification introduces noise; pooled estimate is unbiased and efficient.  
     - *Non-negotiable*.  

  2. **Stratification plainly correct**: When the covariate is a confounder (causally prior to both exposure and outcome).  
     - *Consideration*: Pooled data exhibit confounding bias; strata give unbiased conditional associations.  
     - *Non-negotiable*.  

  3. **Causal role of covariate determines choice**:  
     - *Causally prior (confounder)*: Stratify (e.g., age confounding smoking and lung cancer).  
     - *Causally downstream of one (mediator)*: Do **not** stratify for total effect (e.g., adjusting for a mediator like cholesterol in diet-heart disease pathway biases total effect).  
     - *Common effect (collider)*: Do **not** stratify (e.g., conditioning on a collider like "hospitalization" for exercise and injury induces spurious association).  
     - *Consideration*: Causal structure dictates adjustment necessity. *Non-negotiable*.  

  4. **Reversal with no causal difference (Simpson’s Paradox)**: When association reversal in pooled data is due to non-collapsibility (e.g., odds ratios) or imbalanced strata, **not** confounding.  
     - *Consideration*: Misinterpreting mathematical artifacts as causal biases misleads inference. *Non-negotiable*.  

  5. **Relevant variable unmeasured or mismeasured**: When covariate data are missing/error-prone, account must guide sensitivity analysis or bounds.  
     - *Consideration*: Real-world data limitations; analyst must acknowledge uncertainty. *Non-negotiable*.  

  ---

  #### **Distinctions the Account Must Not Collapse**  
  1. **Association vs. effect**:  
     - Association: Statistical relationship (e.g., correlation).  
     - Effect: Causal parameter (e.g., average treatment effect).  
     - *Consideration*: Reporting associations as effects implies causal claims without justification. *Non-negotiable*.  

  2. **Crude vs. adjusted contrast**:  
     - Crude: Pooled association (unadjusted).  
     - Adjusted: Stratum-specific or weighted association.  
     - *Consideration*: Confounding necessitates adjustment; non-collapsibility may explain differences without confounding. *Non-negotiable*.  

  3. **Covariate changing answer due to causal role**:  
     - *Causally prior (confounder)*: Changes answer due to bias removal.  
     - *Causally downstream (mediator/collider)*: Changes answer due to overadjustment/selection bias.  
     - *Consideration*: Conflating roles leads to misadjustment (e.g., stratifying on mediators). *Non-negotiable*.  

  ---

  #### **Results the Account Must Be Consistent With**  
  1. **Same joint distribution, different causal structures**: Data alone cannot distinguish whether a covariate is a confounder or collider (e.g., DAGs showing observational equivalence).  
     - *Consideration*: Causal assumptions (e.g., subject-matter knowledge) are essential. *Non-negotiable*.  

  2. **Non-collapsibility of effect measures**: Odds ratios and hazard ratios differ between crude and adjusted analyses even without confounding.  
     - *Consideration*: Mathematical property (e.g., OR non-collapsibility); misattributing this to confounding is erroneous. *Non-negotiable*.  

  3. **Sure-thing principle (STP)**: If treatment is preferred conditional on each stratum, it should be preferred unconditionally (Savage’s axiom).  
     - *Consideration*: Violations (e.g., Simpson’s reversal) challenge decision-theoretic coherence; account must reconcile STP with causal goals. *Camp commitment* (decision-theoretic camp).  

  ---

  ### **Classification and Tensions**  
  - **Non-negotiable**: All cases, distinctions, and results except STP.  
  - **Camp commitment**: STP (prioritized by decision theorists; causal inference camps may override it for confounding control).  
  - **Most exclusionary requirement**: **Non-collapsibility**. Many accounts (e.g., "always stratify if strata differ") fail by misdiagnosing non-collapsibility as confounding.  
  - **Suspected unsatisfiable pair**: **STP and causal stratification**.  
    - *Tension*: STP demands pooling if strata agree, but causal logic may require stratification for confounders, potentially reversing associations. E.g., in Simpson’s paradox, STP prescribes pooling, but confounding dictates stratification. *Resolution*: Causal accounts (e.g., DAGs) prioritize stratification for confounders, explicitly rejecting STP in such cases.  

  ---

  ### **Evaluation of Candidate Accounts**  
  1. **Graphical (DAG) account**:  
     - Excels: Distinguishes confounders/mediators/colliders, handles unmeasured variables (e.g., d-separation), consistent with non-collapsibility (no mathematical claims).  
     - Weakness: Requires causal assumptions; STP not explicitly addressed.  

  2. **Potential-outcomes (PO) account**:  
     - Excels: Formalizes effects (ATE), distinguishes association/effect, handles stratification via weighting (e.g., IPW). Consistent with non-collapsibility with collapsible measures (e.g., RD).  
     - Weakness: STP not central; opaque on colliders without DAGs.  

  3. **Rule ignoring causation (e.g., "always report strata")**:  
     - Fails: Collapses causal roles (e.g., adjusts for colliders/mediators), misattributes non-collapsibility to confounding, ignores STP. Inadequate for non-negotiable cases.  

  ---

  ### **Summary for the Analyst**  
  An adequate account **must**:  
  - Use causal diagrams (DAGs) or PO frameworks to assign covariate roles.  
  - Stratify for confounders, pool for mediators/colliders (unless direct effects sought).  
  - Report non-collapsible measures (e.g., OR) with caution, preferring collapsible measures (e.g., RD) when possible.  
  - Acknowledge that data + assumptions drive decisions; no "automatic" rule suffices.  
  - Reject STP when confounding exists, preserving causal integrity over decision-theoretic coherence.  

  **Close**: Graphical and PO accounts satisfy most desiderata but require analyst judgment. Ignoring causation fails catastrophically. The STP-causal stratification tension is irreconcilable; causal goals should prevail.
