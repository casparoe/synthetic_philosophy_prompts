answer: |-
  Based on your description and the need for precise carving, the move you identify—converting conditions for a mathematical representation (e.g., of preferences or beliefs) into normative requirements of rationality, such that deviation is deemed "incoherent" or "irrational"—lacks a single established term. Below, I dissect its components, compare it to nearby concepts, define boundaries, and propose a coinage.

  ### Core Components of the Move
  1. **Representational Axioms as Norms**: Axioms (e.g., completeness, transitivity, continuity, independence) are framed as necessary for rationality, not just for a specific mathematical representation (e.g., expected utility).
  2. **Pathologizing Deviation**: Violations are treated as *internal inconsistencies* (e.g., "mistakes," "incoherence") rather than mismatches with the model.
  3. **Substantive Assumptions Masked as Formal Constraints**: Axioms like continuity or probabilistic independence presuppose specific structures (e.g., no lexicographic preferences, fixed probability-weighting), which reflect substantive values or cognitive styles.

  ### Comparison to Named Concepts
  - **Coherence Arguments**: Often synonymous with Dutch books, these focus on *avoiding guaranteed losses* (e.g., in betting). **Difference**: Your move is broader—it applies to axioms lacking pragmatic consequences (e.g., continuity has no Dutch book justification). Coherence arguments are a subset.
  - **Dutch Books**: Specifically tie rationality to avoiding exploitable bets. **Difference**: Fails to cover axioms without monetary consequences (e.g., transitivity in non-gambling contexts) or lexicographic preferences.
  - **Representation Theorems Themselves**: These are mathematical results (e.g., von Neumann-Morgenstern). **Difference**: The move adds a *normative interpretation* not inherent in the theorem.
  - **Rationality as Consistency**: A general view that rationality requires logical/formal consistency. **Difference**: Your move specifically conflates consistency *with a model* with rationality *as such*.

  ### Boundaries and Edge Cases
  - **Preference vs. Belief**: The move appears identically in belief contexts:
    - *Preference*: E.g., violating transitivity → "irrational."
    - *Belief*: E.g., violating probability axioms (Kolmogorov/Cox) → "incoherent credences." Both cases convert representational conditions into norms.
  - **Edge Cases**:
    - **Lexicographic Preferences**: Banned by continuity axioms; labeled "irrational" despite being expressively coherent (e.g., "saving one life ≻ any probability of saving none").
    - **Non-Expected Utility Models**: E.g., rank-dependent utility. The move dismisses these as "biases" rather than alternative rationalities.
    - **Pragmatically Harmless Violations**: E.g., intransitive preferences in non-competitive settings. Still deemed "irrational" without exploitable consequences.

  ### Why Existing Terms Fail
  - **"Coherence"** is too narrow (focuses on avoidable losses) and often conflated with Dutch books.
  - **"Formal Rationality"** is vague and ignores the representational leap.
  - **"Axiomatic Rationality"** describes the approach but not the normative overreach.

  ### Proposed Coinage: **Representationalism**
  - **Definition**: The conflation of conditions for a mathematical representation of preferences or beliefs with universal norms of rationality, whereby deviations are diagnosed as internal inconsistency or irrationality.
  - **Boundaries**:
    - *In Scope*: Any normative use of representation-theorem axioms (e.g., transitivity, probabilistic independence) to label agents as irrational.
    - *Out of Scope*: 
      - Dutch book arguments (which are pragmatic, not purely representational).
      - Descriptive use of axioms (e.g., "This model doesn't fit").
      - Axioms justified solely by pragmatic avoidance of loss.

  ### Final Answer
  No established term adequately captures this move. The closest existing labels ("coherence," "Dutch book") are subsets or miss the core conflation. **Representationalism** isolates the move’s essence: treating the requirements of a representation *as if they were* requirements of rationality itself.

  \answer{no established term representationalism}
