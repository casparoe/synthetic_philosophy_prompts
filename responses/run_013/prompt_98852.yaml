prompt: |-
  I have spent a term in a political theory seminar on Hume's account of the artificial virtues — the claim that justice, promise-keeping, and the like are not natural virtues we approve from sympathy alone, but conventions that arise from a shared sense of common interest and are then approved for their public utility — and I keep running into the same wall. Everything he says about the obligation of conventions seems framed for people who are already party to the convention, participants in a scheme of coordination who have a common interest in it. Almost every convention I actually live under was either invented after his death or is enforced by institutions he never imagined, and several of them are contested in ways his examples never were. What I want from you is a prediction of what he would have said about the following disputes, and, more than that, a reconstruction of the single rule about convention and obligation he would be running to get there, since I do not think his texts wear that rule on their sleeve.

  First, jaywalking. My city has just decriminalized crossing against the signal and crossing mid-block, while leaving the signals and crosswalks exactly where they were. Was the old rule ever a moral obligation, or only a legal one with a fine attached? Is there any obligation left now, and if a pedestrian steps out mid-block and forces a driver to brake hard, has anything been wronged, and if so, what? Second, paid queue-jumping. My office building has installed a system at the shared coffee counter and the elevators by which you can pay a small fee to move to the front of the queue, and the airport sells the same privilege at security. A colleague insists this is unjust, on the ground that a queue embodies a norm of equal treatment; a friend who reads a great deal of Hume insists it is simply an old convention being replaced by a more efficient one, since the point of the queue was to stop people jostling and get them served, not to enforce equality. Which of them is closer to him? Third, tipping. A friend of mine grew up where tipping is not done and is in fact mildly insulting, and now lives here, where the payment tablet offers buttons for twenty, twenty-five, and thirty percent and the staff watch you choose. Is she under an obligation to tip? Promising is his model of an artificial obligation generated by a convention, but she never agreed to this one, it is enforced mainly by awkwardness, and the same convention now functions in part to shift a wage cost onto customers. Does the obligation hold, and does it hold differently for her than for someone raised here? Fourth, visitors. A transit authority in my city recently ran an experiment instructing riders to stand on both sides of the escalator rather than leaving one side for people who walk up, on the ground that it moves more people; the regulars detested it and reverted to the old arrangement within weeks. If a visitor plants herself and her suitcase on the walking side, has she done anything wrong — and, turning it around, if the visitor comes from a place where the walking side is the other side and follows her home convention here, is she excused? He appears to need people to be party to a convention before it binds them, which would excuse a great deal of tourist behaviour; tell me whether that is his considered view or a reductio of it.

  So give me his verdict on each of the four, the one rule about convention and obligation that generates those verdicts, the commitments of his that do the real work in each case, and the points at which his framework strains or has to be extended — especially on the visitor question, where I suspect the strain is greatest. Flag any case in which his own commitments pull in opposite directions, rather than smoothing it over. Then tell me which further case would best distinguish the rule you attribute to him from two rivals: one holding that conventions of this kind carry no moral weight at all beyond the legal penalty or the social cost of breaking them, and one holding that they bind because of what we owe one another as a matter of fairness or reciprocity quite independently of who opted in. Finally, if his texts genuinely underdetermine the visitor question, say which of the two Humean extensions available is the more faithful, and why.
reasoning: |-
  Okay, the user is deeply engaged with Hume's theory of artificial virtues, particularly how conventions create obligations. They've presented four modern scenarios to test Hume's framework. Let me start by recalling Hume's key points: conventions arise from mutual self-interest and gain moral force through public utility. But the user is stuck on how these apply to conventions established after Hume's time or enforced by modern institutions.

  First, jaywalking. The city decriminalized it, but signals remain. The user wants to know if the old rule had moral weight. Hume would say the original rule was a convention for safety and order. Once decriminalized, the obligation dissolves because the convention's utility depends on general compliance. Without enforcement, there's no mutual advantage, so no moral wrong if a driver brakes hard—just inconvenience. The key here is the dependence on institutional enforcement for the convention's existence.

  Next, paid queue-jumping. The colleague argues it violates equality, while the friend sees efficiency. Hume prioritizes utility over equality. Queues prevent conflict and ensure service. If paid options maintain order and efficiency, they might become a new convention. But if it causes resentment, it fails. Hume's focus is on whether the new system serves the original purpose: minimizing conflict and maximizing utility. The tension here is between stability and efficiency, but Hume would lean towards whatever system best serves common interest.

  Tipping is tricky. The friend comes from a no-tipping culture. Hume's promise analogy requires participation in the convention. If she didn't opt-in, is she bound? But the convention here is enforced socially. Hume might argue that by engaging in services where tipping is expected, she implicitly participates. However, the shifted wage cost complicates things. The obligation's strength depends on her participation and the utility of the practice. Raised locally, it's stronger; for her, weaker but still present due to social expectations. The strain is on implicit consent versus explicit agreement.

  Visitors and escalator norms. The transit experiment failed because regulars rejected it. A visitor following her home convention might be excused by Hume since she's not party to the local norm. But if the local convention is well-established, she might need to adapt. The key is whether the convention is widely recognized and useful. Hume's framework struggles here because it doesn't address how visitors learn or adopt conventions. The obligation hinges on awareness and participation.

  The core rule: Conventions bind morally only when mutually advantageous and upheld by institutions or social enforcement. Once they break down, the obligation fades. For visitors, Hume might excuse them if unaware, but expects adaptation once informed. The strain is greatest here because participation isn't binary—it's about gradual integration.

  Rival theories: One denies moral weight beyond penalties; the other bases it on fairness. Hume sits in the middle, tying obligation to utility and mutual benefit. To distinguish, consider a case like a secret ballot—no direct harm if violated, but undermines systemic trust. Hume would emphasize systemic utility, while rivals might miss that.

  On visitors, Hume's texts underdetermine. Two extensions: strict participation requiring explicit consent, or constructive notice where awareness implies obligation. The latter is more faithful, as Hume emphasizes utility and social learning. Ignorance excuses initially, but once aware, participation binds.

  The user needs clarity on how modern, contested conventions fit into Hume's model. They're likely preparing for academic work or teaching, wanting to apply Hume to contemporary issues. They might also seek to resolve personal confusion about moral obligations in diverse societies. Highlighting where Hume's framework adapts or strains helps them navigate these complexities.
answer: |-
  Here is a Humean analysis of your four cases, the underlying rule I attribute to him, its points of strain, and how to test it against rivals:

  **Hume's Core Rule of Convention & Obligation (Reconstructed):**
  > **A convention generates a moral obligation *only when* (1) it is a mutually advantageous, stable solution to a coordination problem; (2) it is generally recognized and adhered to within a relevant community; (3) its maintenance depends on widespread reciprocal compliance (the "sensible knave" problem is managed); and (4) its public utility (order, predictability, collective benefit) is the primary source of our moral approval.** Obligation arises *from participation* in this mutually beneficial scheme. It is *not* innate, not primarily based on abstract fairness/reciprocity independent of the scheme's existence, and dissolves when the scheme collapses or one is not a participant.

  **Analysis of Your Cases:**

  1.  **Jaywalking:**
      *   **Hume's Verdict:** The *old* traffic signal/crosswalk rule *was* an artificial virtue generating moral obligation *while effectively enforced as a stable convention*. Its utility lay in predictable coordination, minimizing conflict, and enhancing safety for *all* road users (drivers & pedestrians). Breaking it wasn't *just* illegal; it undermined a mutually beneficial scheme, risking harm and chaos. The fine was a tool *for* maintaining the convention.
      *   **Post-Decriminalization:** The obligation *dissolves* with the effective collapse of the convention. The signals/crosswalks remain as *potential* coordination points, but without general recognition of an enforceable rule and reciprocal compliance, no stable, mutually advantageous scheme exists. Stepping out mid-block, forcing a hard brake, demonstrates *imprudence* and perhaps *unkindness* (a natural virtue), but not a violation of *justice* (an artificial virtue). Nothing *institutional* is wronged; only the driver's expectations or safety might be *naturally* wronged. The "scheme" lacks the stability and reciprocity Hume requires.
      *   **Key Humean Commitments:** Mutually advantageous coordination scheme (1, 2), dependence on reciprocal compliance (3), public utility as source of approval (4). The scheme's collapse removes the obligation.
      *   **Strain:** Distinguishing between the *lingering infrastructure* of a convention and the *active convention itself*. Hume focuses on the functional scheme, not its physical remnants.

  2.  **Paid Queue-Jumping:**
      *   **Hume's Verdict:** Your Hume-reading friend is **closer**, but not entirely correct. The *original queue* is a classic Humean convention: a spontaneous solution to the coordination problem of "first-come, first-served" to prevent jostling, conflict, and ensure orderly service (public utility). Obligation arises from participation; jumping the queue violates the reciprocal trust underpinning the scheme.
      *   **The New System:** Its *moral status depends entirely on whether it establishes a new stable, mutually advantageous convention*. If it genuinely reduces aggregate waiting time (e.g., by monetizing impatience to fund faster service for all) *and* gains general acceptance without causing resentment or conflict that outweighs the benefits, it *could* become the new convention, replacing the old one. Its efficiency *could* be its public utility. However, if it primarily creates resentment, perceived unfairness, or social friction (undermining the original goal of reducing conflict), or if it fails to gain stable adherence, it *fails* as a convention. Your colleague's "equality" argument isn't Hume's primary concern; utility and stability are. Hume might see the initial conflict as proof the *new* scheme isn't yet stable or mutually advantageous enough.
      *   **Key Humean Commitments:** Convention as solution to coordination problem (1), stability and general adherence (2), public utility (order, efficiency) as source of approval (4). The *content* (equality vs. efficiency) matters only insofar as it impacts stability and utility.
      *   **Strain/Pull:** Commitment to utility (4) potentially pulls towards accepting efficient new conventions, while commitment to stability and existing reciprocal compliance (2, 3) pulls towards conserving the old scheme until the new one is demonstrably stable. This is a tension within Hume's framework regarding *change*.

  3.  **Tipping:**
      *   **Hume's Verdict:** **Yes, she likely *is* under an obligation, but its strength differs from a local's.** Tipping in this context *is* a convention. Its utility lies in (historically) ensuring adequate service worker compensation in specific industries and (currently) managing social expectations and avoiding perceived rudeness/conflict ("awkwardness" is a social enforcement mechanism). By choosing to use services where the custom is deeply entrenched and socially enforced (buttons, staff watching), she *implicitly participates* in the scheme. The convention creates an expectation of reciprocity: service is rendered with the *mutual understanding* (even if unspoken) that this form of compensation is part of the transaction.
      *   **Her Situation:** While she didn't explicitly agree, her *participation* in the context binds her. However, the obligation might feel weaker or less intuitive to her (lacking the "habit" Hume emphasizes) compared to a local raised within the norm. The shifted wage cost is a *critique* of the convention's utility/fairness, but for Hume, the obligation arises from the *existence and participation* in the *current* stable scheme, not its optimality. If the convention is stable and provides utility (avoiding social friction, ensuring a livable wage *in practice*), it binds participants.
      *   **Key Humean Commitments:** Participation in a stable scheme (2), reciprocal expectations within the scheme (3), public/social utility (avoiding conflict, maintaining service norms) as source of approval (4). The "promise" model highlights the *conventional* nature of the obligation arising from participation and expectation, not innate morality.
      *   **Strain:** The line between genuine participation and merely being present. The role of "awkwardness" as enforcement highlights the social nature of convention, but feels less robust than legal enforcement. The critique about shifting wage costs tests whether Hume's focus on *existing* utility ignores deeper injustices *within* the convention.

  4.  **Visitors & Escalators:**
      *   **Hume's Verdict (Initial):** A visitor planting on the walking side *does* violate a local convention, *if* it is indeed the stable, recognized norm. The convention (stand right/walk left, or vice versa) solves a coordination problem (maximizing flow, minimizing conflict) within that specific community. Her action disrupts the mutually advantageous scheme. She has "wronged" the *scheme* and its participants by undermining its utility and predictability.
      *   **The Excuse (Ignorance):** **Hume *would* excuse the visitor *initially*, provided genuine ignorance.** Hume *does* require being party to the convention for it to bind. A tourist truly unaware of the local norm isn't a participant in that specific scheme. Her obligation arises only *after* she becomes aware and continues to participate (use the escalator). Following her home convention here isn't inherently wrong *for her*, but it *is* disruptive to the local scheme.
      *   **The Failed Experiment:** The transit authority's attempt failed because it lacked *general recognition and adherence* (2) from the "regulars" (the core participants). It never became a stable convention. Sticking to the *old* arrangement after the experiment shows the *old* convention reasserted itself as the stable scheme. The visitor's obligation is to the *stable, recognized* convention (stand right/walk left), not the failed experiment.
      *   **Key Humean Commitments:** Participation/awareness required (2, implied by 1 & 3), convention as solution to local coordination problem (1), stability and general adherence (2).
      *   **Greatest Strain & Extension Needed:** This is indeed the hardest case. Hume's texts focus on conventions arising within a community over time. Modern mobility creates "temporary participants." **Hume's core commitments underdetermine the *speed* and *mode* of becoming "party to" a local convention.** Does mere physical presence constitute participation? How much observation/instruction is needed?
          *   **Two Extensions:**
              *   **Strict Participation:** Obligation *only* upon explicit awareness and continued participation. Ignorance is a complete excuse. (More faithful to Hume's emphasis on mutual recognition and the "sensible knave" needing to *see* the scheme).
              *   **Constructive Notice:** Presence in a context where the convention is visibly operative constitutes sufficient notice to become a participant bound by it. (More faithful to Hume's emphasis on utility and stability – disruption harms the scheme regardless of intent).
          *   **More Faithful Extension: Constructive Notice.** Hume prioritizes the *stability and utility of the scheme itself*. A visitor benefits immediately from the order the convention provides (smooth escalator flow) by using it. Ignorance might mitigate blame *initially*, but the *act* of disrupting the scheme is still contrary to its utility. Hume's focus on consequences for the public good and the need for *everyone* to comply for the scheme to work ("sensible knave") suggests that **once you engage with the system (riding the escalator), you incur an obligation to learn and follow its local rules to maintain the common benefit.** Ignorance excuses past violations but demands learning for future compliance.

  **Distinguishing Case: Jury Duty vs. Voting**

  *   **Scenario:** Consider a permanent resident alien who pays taxes, uses public services, and is subject to laws, but is legally ineligible to vote. They receive a jury summons. Legally, they must serve (in many jurisdictions). Morally, according to Hume's rule vs. rivals:
  *   **Hume's Rule:** Jury duty is part of the *justice* convention. The alien participates deeply in the societal scheme (pays taxes, obeys laws, benefits from order) *except* for the specific political act of voting. They *are* a participant in the broader convention of justice and governance. Therefore, they *do* have a moral obligation to serve on a jury. The obligation stems from participation in the mutually advantageous scheme of justice, even without voting rights (the "quid" may not be perfectly "pro quo," but the overall participation suffices).
  *   **Rival 1 (No Moral Weight):** Only the legal penalty for skipping jury duty matters. No independent moral obligation exists.
  *   **Rival 2 (Abstract Fairness/Reciprocity):** The alien *cannot* vote, so there's a fundamental lack of reciprocity. They receive benefits (law, order) but lack the full political voice to shape them. Therefore, they lack a moral obligation to serve on a jury (though the legal obligation remains). Fairness demands symmetry.
  *   **Why it Distinguishes:** Hume's rule focuses on *participation in the overall beneficial scheme of justice*, not perfect symmetry of rights or the absence of legal penalties. The alien is deeply embedded in the scheme, creating obligation. Rival 1 denies any moral dimension. Rival 2, focused on abstract reciprocity/fairness, finds the asymmetry disqualifying for moral obligation. This case highlights Hume's focus on the *convention itself and participation within it* as the source of obligation, distinct from both legalism and ideal reciprocity.

  **Summary of Key Points:**

  *   **Hume's Core:** Obligation is *conventional*, arising from participation in mutually advantageous, stable schemes approved for their public utility.
  *   **Verdicts:** Jaywalking obligation gone; Queue-jumping friend closer, but stability matters; Tipping binds participants, including newcomers aware of it; Visitor initially excused by ignorance but obligated to learn local stable conventions.
  *   **Strains:** Handling rapid change (queue), perceived injustice within conventions (tipping), defining participation for newcomers/tourists (visitor - **greatest strain**), distinguishing convention remnants from active schemes (jaywalking).
  *   **Opposing Pulls:** Utility vs. Stability (queue change), Habit/Sentiment vs. Current Utility (tipping critique).
  *   **Visitor Extension:** **Constructive Notice** is more faithful, prioritizing scheme stability and utility while acknowledging ignorance initially. Obligation arises upon engagement with the system.
  *   **Underdetermination:** The visitor case genuinely strains Hume's framework due to modern mobility. While "constructive notice" is the more faithful extension based on his core principles, the texts offer less direct guidance here than on established communities.
