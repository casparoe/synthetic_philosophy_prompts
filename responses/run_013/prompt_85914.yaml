  For criteria, downstream impact is paramount—answers should influence agency operations. Tractability matters given time constraints; abstract questions like "inherent stability" may be too theoretical. Neglectedness favors fresh angles like nudge drift over reheated mechanism debates. Agency relevance prioritizes operational concerns (authority, drift) over academic purity.

