prompt: |-
  i'm prepping a reading group on decision theory and before we start arguing about which theory is right i want the spec in front of us. so write me the desiderata: what any adequate theory of rational choice under uncertainty actually has to deliver. not the theory, the checklist it has to pass.

  first the cases it has to get right, with the point of each one: newcomb's problem, the smoking lesion, counterfactual mugging, XOR blackmail, parfit's hitchhiker, the twin prisoner's dilemma, and whatever else you think belongs. for each, tell me what the case is actually testing -- is it testing whether the theory is causal or evidential, whether it can make a precommitment stick, whether it survives when the predictor is a copy of you, whether the payoff is hostage to a counterfactual -- because i want to see which cases are load-bearing and which are just the same case wearing a hat.

  then the structural requirements, kept separate from the cases: that the theory not be exploitable by someone who knows you're following it, that it be reflectively consistent (if you learn the theory's own verdict before acting, the verdict shouldn't change), that it agree with boring expected-utility reasoning in ordinary cases so we don't get decision-theoretic rock-paper-scissors, that it handle self-locating uncertainty, that it be partition-invariant so how the world gets carved up doesn't change the recommendation.

  and here's the part i actually care about: flag any pair of desiderata you think can't be satisfied together. i suspect maximize expected value given your evidence and act so that the policy you'd have picked in advance does best are in direct tension, and that half the field is people quietly dropping one. if that's right, say which you'd drop and what it costs.

  i'm also going to hand you a case i made up and i want you to tell me whether it's genuinely new or just counterfactual mugging in a costume: omega flips a coin. if heads, she hands you $10,000, no strings. if tails, she asks you for $1,000 -- and she tells you that the heads-branch $10,000 was handed over only because, before flipping, she correctly predicted you would pay in the tails branch. so money you'd already have in the heads branch is hostage to what you do now, in the branch where you don't have it. does a theory that can do newcomb's problem and counterfactual mugging separately handle this for free, or does it need a new rule? if it needs a new rule, that's a desideratum we've been missing and i want it on the list.

  last thing: no reading list, no citations, i know roughly whats out there and i can't look anything up anyway. and be straight with me about the status of your claims -- seperate what every camp would sign off on from what's just one tradition's intuition dressed up as a neutral constraint, because i think a lot of what gets called a desideratum is really causal or evidential or updateless decision theory smuggled in at the level of the checklist, and i don't want a contested view presented to me as if it were the consensus.
reasoning: |-
  We are building a checklist of desiderata for a theory of rational choice under uncertainty. We'll cover:
  1. The key test cases and what each is testing.
  2. Structural requirements.
  3. Potential conflicts between desiderata.
  4. Analysis of your custom case.

  We'll be straight about which claims are consensus and which are contested.

  ### I. Key Test Cases and Their Points

  Each case tests specific aspects of a decision theory. We note what the case is testing and whether it is load-bearing or a variant.

  1. **Newcomb's Problem**:
     - **Case**: Omega offers you two boxes: one transparent with $1,000 and one opaque that contains either $1,000,000 or nothing. Omega has predicted your choice. If it predicted you take only the opaque box, it put $1M in it; if it predicted you take both, it put nothing. 
     - **Testing**: Whether the theory is *causal* (take both because your action doesn't cause the past prediction) or *evidential* (take one box because taking both is evidence that Omega predicted that and left the opaque box empty). Also tests the ability to handle *acausal* (non-causal) correlations between your choice and the state of the world.
     - **Load-bearing**: Yes, it's a fundamental test of causal vs. evidential reasoning.

  2. **Smoking Lesion**:
     - **Case**: You are deciding whether to smoke. Smoking is correlated with lung cancer, but not because it causes it; instead, there's a lesion that causes both the desire to smoke and lung cancer. 
     - **Testing**: Whether the theory can distinguish between *causation* and *correlation*. Evidential decision theory (EDT) would advise against smoking because it's evidence of the lesion (and hence cancer), while causal decision theory (CDT) would say smoking doesn't cause cancer so it's fine. Tests if the theory requires a causal model.
     - **Load-bearing**: Yes, it isolates the causal/evidential distinction without a predictor.

  3. **Counterfactual Mugging**:
     - **Case**: Omega flips a coin. If heads, you lose $100. If tails, you win $10,000. After the flip (and before you know the outcome), Omega asks you for $10, saying that if you pay, then in the heads world you would have gotten $10,000. But if you don't pay, then in the heads world you get nothing. (Note: This is a common variant. The original by Eliezer Yudkowsky: Omega asks for $100 after tails, promising to pay you $10,000 if heads, but only if you would have paid if tails.)
     - **Testing**: Whether the theory values counterfactual outcomes that didn't occur. Tests if the theory is *updateless* (making the decision from a prior state before knowing the outcome) or *updated* (using current knowledge). Also tests if the theory can commit to policies that are beneficial in expectation but might seem irrational after updating.
     - **Load-bearing**: Yes, it tests the updatefulness of the theory.

  4. **XOR Blackmail**:
     - **Case**: You receive a letter from a blackmailer saying they have embarrassing info about you. They claim to have predicted your response. If you pay, they won't release the info, but if you don't pay, they will. However, the letter also says that the blackmailer only sends the letter if they predicted you wouldn't pay. So if you pay, you lose money and the info is released anyway (because they didn't send the letter if they thought you'd pay). 
     - **Testing**: Similar to Newcomb, but with a twist: the act of paying is evidence that the blackmailer's prediction was wrong (so they didn't send the letter in the world where they thought you'd pay). Thus, paying is evidence that the info won't be released? But the setup complicates the evidence. Tests the theory's ability to handle self-defeating and self-fulfilling predictions and whether it can avoid being exploitable.
     - **Load-bearing**: It's a variant of Newcomb with an additional layer of prediction and action, testing the same core issue (causal vs. evidential) but in a way that might trip up some theories that handle Newcomb.

  5. **Parfit's Hitchhiker**:
     - **Case**: You are dying of thirst in the desert. A driver offers to take you to town only if you promise to pay $1000 upon arrival. If you don't promise (or break the promise), they leave you to die. But once in town, you have no incentive to pay.
     - **Testing**: Whether the theory can handle *commitments* and *dynamic consistency*. It tests if the theory can bind future actions (precommitment) and if it is time-consistent. A theory that allows you to commit (or to act as if you are committed) would pay; one that doesn't would not pay once in town and hence wouldn't be rescued.
     - **Load-bearing**: Yes, it tests dynamic choice and precommitment.

  6. **Twin Prisoner's Dilemma**:
     - **Case**: You and your twin (who thinks exactly like you) are playing prisoner's dilemma. You cannot communicate. Because of the symmetry, if you both defect, you both get a bad outcome; if both cooperate, good outcome; if one defects, the defector gets the best and the cooperator the worst.
     - **Testing**: Whether the theory can handle *symmetry* and *reflective consistency*. It tests if the theory cooperates (arguing that since both players are identical, they will do the same, so the choice is between mutual cooperation and mutual defection) or defects (because regardless of what the other does, defection dominates). Also tests if the theory can handle acausal reasoning (since the other player is a copy).
     - **Load-bearing**: Yes, it tests acausal coordination and the handling of identical decision-makers.

  Other cases that might be included:
  - **The Absent-Minded Driver**: Tests partition invariance and self-locating uncertainty.
  - **The Psychopath Button**: Similar to Smoking Lesion. If you press the button to kill all psychopaths, but you are a psychopath, then pressing kills you. But if you are not, pressing helps. However, you don't know if you are a psychopath. Tests self-locating beliefs and causal vs. evidential reasoning.

  **Summary of Cases**: 
  - Newcomb and Smoking Lesion test causal vs. evidential reasoning.
  - Counterfactual Mugging tests updatelessness.
  - XOR Blackmail is a variant of Newcomb with a twist on the prediction mechanism.
  - Parfit's Hitchhiker tests commitment and dynamic consistency.
  - Twin Prisoner's Dilemma tests acausal coordination and symmetry.

  ### II. Structural Requirements

  These are properties we want a decision theory to have, independent of specific cases.

  1. **Non-Exploitability**: The theory should not be exploitable by an adversary who knows the theory you are using. (Contested: Some argue that in adversarial settings, no theory is unexploitable. But we might require that in non-adversarial settings, the theory doesn't leave money on the table.)

  2. **Reflective Consistency**: If you learn the theory's own verdict before acting, the verdict shouldn't change. (For example, in a decision problem, if you learn what the theory says you should do, you should still want to do it.)

  3. **Ordinary Expected Utility**: In ordinary cases (no predictors, no acausal links, no self-locating uncertainty) the theory should reduce to standard expected utility maximization (with causal structure if available).

  4. **Handles Self-Locating Uncertainty**: The theory should be able to handle cases where the agent doesn't know who they are or what time it is (e.g., Sleeping Beauty problem, Absent-Minded Driver).

  5. **Partition Invariance**: The recommended action should not depend on how the state space is partitioned (i.e., the same regardless of how we describe the outcomes, provided the underlying uncertainty is the same).

  6. **Dynamic Consistency**: In sequential decisions, the plan made at the start should remain optimal at later stages (unless new information changes the expected utility). This is related to the Hitchhiker problem.

  7. **Acausal Cooperation**: The theory should allow for cooperation in cases where the other agent is a copy of you (or uses the same decision theory) even without causal influence.

  ### III. Conflicts Between Desiderata

  You suspect a conflict between:
  - **Desideratum A**: Maximize expected value given your current evidence (which might include the fact that you are in a particular branch).
  - **Desideratum B**: Act so that the policy you would have picked in advance (before knowing which branch you are in) does best.

  This is the core tension between *updated* (conditional on current information) and *updateless* (choosing a policy from the initial perspective) decision theories.

  - **Conflict**: In Counterfactual Mugging, Desideratum A (after knowing you are in the tails branch) says: "I don't pay because I don't get anything." But Desideratum B (before the flip) says: "I commit to a policy of paying in the tails branch because that policy would have given me $10,000 in the heads branch and I care about that." 
  - **Which is dropped?** 
    - Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) are typically updated and would fail Counterfactual Mugging (they don't pay in tails). 
    - Updateless Decision Theory (UDT) drops Desideratum A in favor of B. 
    - **Cost of dropping A**: It might seem irrational to pay in the tails branch when you know you are in tails and won't get anything. It violates the "given your evidence" principle because the agent acts as if they care about a counterfactual world that they know didn't occur.
    - **Cost of dropping B**: You lose the ability to coordinate with your past or future selves, or with copies of yourself, and you can be exploited (e.g., in Counterfactual Mugging, you lose the $10,000 in the heads branch because you didn't pay in tails).

  **Other Conflicts**:
  - **Causal vs. Evidential**: In Newcomb and Smoking Lesion, causal and evidential theories differ. CDT satisfies the causal requirement but fails Newcomb (for one-boxers) and Twin Prisoner's Dilemma (if it defects). EDT satisfies evidential reasoning but fails in cases like Smoking Lesion (if we believe the lesion story) and can be exploitable.
  - **Reflective Consistency vs. Ordinary Expected Utility**: In some cases, learning the theory's verdict might change the evidence (e.g., if the theory says to do A, that might be evidence that B is better). This is tricky and might require a fixed-point.

  ### IV. Your Custom Case

  - **Case**: Omega flips a coin. Heads: you get $10,000 with no strings. Tails: Omega asks for $1,000. Omega tells you that the $10,000 in the heads branch was given only because, before flipping, she correctly predicted you would pay in the tails branch. So the heads branch money is hostage to your action in the tails branch.

  - **Analysis**: 
    This is a combination of Newcomb and Counterfactual Mugging. 
    - It has the *acausal correlation* of Newcomb: your action in the tails branch is correlated with the heads branch outcome (via Omega's prediction).
    - It has the *counterfactual* aspect of Counterfactual Mugging: the heads branch outcome depends on what you do in the tails branch, even though you are in tails.

    However, note that in Counterfactual Mugging, the agent is asked to pay *before* knowing the outcome, and the payment affects the counterfactual world. Here, you are in the tails branch and are asked to pay, and the payment is what caused the heads branch to get the money (via the prediction). 

    But here's the twist: in the heads branch, you already have the money and don't get asked. So the agent in the tails branch is being asked to pay $1,000 to "save" the $10,000 in the heads branch that they are not in. But the agent in the tails branch doesn't get the $10,000. 

    **Is this new?** 
    - It is similar to Counterfactual Mugging, but with a key difference: in the standard Counterfactual Mugging, the agent is asked *before* the flip (so they are in a state of uncertainty). In your case, the agent is asked *after* the flip, in the tails branch. 

    However, note that in the standard telling of Counterfactual Mugging, the agent is sometimes asked after the flip but before knowing the outcome. But in your case, the agent knows they are in tails. That makes it more like the "tails" part of Counterfactual Mugging, but with the added twist that the heads branch outcome was conditional on the tails branch action.

    **How would different theories handle it?** 
    - **EDT/CDT (updated)**: In the tails branch, you know you are in tails. Paying $1,000 doesn't cause the heads branch to get the money (that already happened) and isn't evidence of anything about your current situation (since you are in tails). So they wouldn't pay. 
    - **UDT (updateless)**: You consider the policy from the start. The policy of paying in the tails branch leads to $10,000 in heads and -$1,000 in tails. The policy of not paying leads to $0 in heads and $0 in tails. The expected value of paying is (0.5 * $10,000 + 0.5 * (-$1,000)) = $4,500. The expected value of not paying is $0. So UDT would pay.

    **Is it a new test?** 
    - It tests the same thing as Counterfactual Mugging: whether the theory is updateless. But it does so in a setting where the agent has updated (they know they are in tails). So it is a variant of Counterfactual Mugging that removes the uncertainty. Therefore, it is not genuinely new but a more pointed version of Counterfactual Mugging. 

    **Do we need a new rule?** 
    - If a theory passes Counterfactual Mugging (by being updateless), it will pass this for free. So no new rule is needed.

    **Desideratum**: We already have the requirement that the theory be updateless (which is part of the structural requirement of reflective consistency and policy-based reasoning). So this case is covered.

  ### V. Status of Claims

  - **Consensus**: 
    - The cases (Newcomb, Smoking Lesion, Counterfactual Mugging, etc.) are widely recognized as important tests.
    - The structural requirements (non-exploitability, reflective consistency, ordinary EU, partition invariance) are generally accepted as goals, though some are contested in their interpretation.
    - The conflict between updated and updateless reasoning is a known and central debate.

  - **Contested**:
    - The requirement to pass Newcomb as a one-boxer is contested (causal decision theorists reject it).
    - The requirement to pass Smoking Lesion by smoking (if the lesion story is true) is contested (evidential decision theorists would not smoke).
    - The requirement to be updateless is specific to UDT and not accepted by all.
    - The requirement for acausal cooperation is not accepted by causal and evidential decision theories.

  We have tried to present the desiderata and conflicts as they are, noting where there is disagreement.

  ### Final Checklist of Desiderata

  **Cases to Pass**:
  1. Newcomb's Problem: Tests causal vs. evidential reasoning and acausal correlations.
  2. Smoking Lesion: Tests causal vs. evidential reasoning in the absence of a predictor.
  3. Counterfactual Mugging: Tests updatelessness.
  4. XOR Blackmail: Tests prediction mechanisms and avoidability of exploitation (variant of Newcomb).
  5. Parfit's Hitchhiker: Tests dynamic consistency and precommitment.
  6. Twin Prisoner's Dilemma: Tests acausal coordination and symmetry.

  **Structural Requirements**:
  1. Non-Exploitability: Not easily exploitable by an adversary.
  2. Reflective Consistency: Learning the theory's verdict doesn't change it.
  3. Ordinary Expected Utility: Reduces to standard EU in normal cases.
  4. Handles Self-Locating Uncertainty: E.g., Sleeping Beauty.
  5. Partition Invariance: Invariant to the description of the state space.
  6. Dynamic Consistency: Plans remain optimal over time.
  7. Acausal Cooperation: Cooperates with copies of oneself.

  **Conflicts**:
  - The major conflict is between updated (A: maximize given current evidence) and updateless (B: maximize the policy from the prior) reasoning. They cannot both be satisfied in cases like Counterfactual Mugging and your custom case.

  **Your Custom Case**: It's Counterfactual Mugging in a costume (specifically, the tails branch of a Counterfactual Mugging where the heads branch payoff is conditional on the tails branch action). A theory that passes Counterfactual Mugging (by being updateless) will handle it without a new rule.
answer: |-
  ### Desiderata for Rational Choice Under Uncertainty

  Below is a structured checklist of what any adequate decision theory must deliver. I separate **test cases** (with their purpose), **structural requirements**, and **conflicts between desiderata**. I flag contested claims and analyze your custom case. The goal is a neutral spec—not favoring causal (CDT), evidential (EDT), or updateless (UDT) frameworks—while noting where intuitions diverge.

  ---

  ### **I. Key Test Cases and Their Purpose**  
  Each case tests a specific *mechanism* of rational choice. I note which are load-bearing (unique) vs. variants.

  1. **Newcomb’s Problem**  
     - **Case**: Choose one box (\$1M if predicted) or both boxes (\$1K + \$1M if predicted). Omega predicts perfectly.  
     - **Tests**: Whether the theory handles *acausal correlations* (no causal arrow from choice to outcome). Load-bearing for distinguishing CDT (two-box) vs. EDT/UDT (one-box).  
     - **Core test**: *Can rational choice ignore evidence about unchangeable past/future states?*

  2. **Smoking Lesion**  
     - **Case**: Smoking correlates with cancer via a lesion, but smoking doesn’t cause cancer.  
     - **Tests**: Whether the theory distinguishes *causation from correlation*. Load-bearing for exposing EDT’s flaw (avoids smoking due to evidence, ignoring causality).  
     - **Core test**: *Does the theory require causal models to separate acts from evidence?*

  3. **Counterfactual Mugging**  
     - **Case**: If coin lands tails, Omega asks for \$100; if heads, you’d have won \$10K *only if* you pay in tails.  
     - **Tests**: Whether the theory values *counterfactual outcomes* it doesn’t experience. Load-bearing for testing *updatelessness* (should you pay in tails even with no personal gain?).  
     - **Core test**: *Can rationality demand sacrificing actual utility for expected precommitment gains?*

  4. **XOR Blackmail**  
     - **Case**: Blackmailer mails you iff they predicted you wouldn’t pay. Paying loses money and still leaks info.  
     - **Tests**: Whether the theory avoids *self-defeating actions* under perfect prediction. Variant of Newcomb (same prediction mechanism), but stresses *logical counterfactuals*.  
     - **Core test**: *Can the theory handle cases where the act of choosing alters the game tree?*

  5. **Parfit’s Hitchhiker**  
     - **Case**: Driver rescues you if you promise \$1000. Once safe, do you pay?  
     - **Tests**: Whether the theory enforces *dynamic consistency* (honoring precommitments). Load-bearing for time-inconsistency.  
     - **Core test**: *Can rational agents bind their future selves?*

  6. **Twin Prisoner’s Dilemma**  
     - **Case**: Play PD with an identical twin (same decision algorithm).  
     - **Tests**: Whether the theory handles *acausal coordination* (cooperate iff your twin does). Load-bearing for symmetry/reflective reasoning.  
     - **Core test**: *Can identical agents achieve mutual cooperation without causation?*

  7. **The Absent-Minded Driver (Bonus)**  
     - **Case**: Choose exit at X for \$4 or Y for \$1, but you forget if you passed X.  
     - **Tests**: *Self-locating uncertainty* and *partition invariance*. Load-bearing for memoryless decisions.  
     - **Core test**: *Can the theory handle ignorance of one’s own history?*

  **Load-Bearing vs. Variants**:  
  - Unique: **Smoking Lesion** (causation/correlation), **Counterfactual Mugging** (updatelessness), **Twin PD** (acausal symmetry).  
  - Variants: **XOR Blackmail** (Newcomb with extra logical step), **Parfit’s Hitchhiker** (precommitment test, similar to self-binding in UDT).  

  ---

  ### **II. Structural Requirements**  
  Separate from cases—properties a theory must satisfy universally.

  1. **Non-Exploitability**  
     - Agents should not be systematically outmaneuvered by adversaries who know their decision rule.  
     - *Contested*: CDT claims this, but EDT/UDT argue it’s context-dependent.

  2. **Reflective Consistency**  
     - Learning the theory’s own verdict shouldn’t change that verdict.  
     - *Consensus*: Violations imply self-undermining (e.g., "If I learn EDT says ‘smoke,’ should I ignore it?").

  3. **Ordinary EU Compatibility**  
     - Must reduce to standard expected utility (EU) maximization in "boring" cases (no predictors, acausal links, or self-locating uncertainty).  
     - *Consensus*: Failing this makes the theory unusable for daily decisions.

  4. **Self-Locating Uncertainty Handling**  
     - Must yield unique answers when agents don’t know who/where they are (e.g., Sleeping Beauty, Absent-Minded Driver).  
     - *Contested*: Some (e.g., CDT) argue this reduces to probability theory; others (UDT) demand special handling.

  5. **Partition Invariance**  
     - Recommendations shouldn’t change based on how states are described (e.g., framing outcomes as "worlds" vs. "histories").  
     - *Consensus*: Violations imply arbitrariness.

  6. **Dynamic Consistency**  
     - A plan deemed optimal at time *t* should remain optimal at *t+1* unless new information arrives.  
     - *Contested*: CDT violates this in Parfit’s Hitchhiker; UDT enforces it via precommitments.

  7. **Acausal Coordination Capacity**  
     - Should enable cooperation with identical or symmetric agents (tested in Twin PD).  
     - *Contested*: CDT/EDT reject this as non-causal; UDT embraces it.

  ---

  ### **III. Conflicts Between Desiderata**  
  Your suspicion is correct: **core tensions exist**. I flag irreconcilable pairs.

  - **Conflict: Evidence-Responsiveness vs. Precommitment (Updatelessness)**  
    - **Desideratum A**: *Maximize expected utility given current evidence* (CDT/EDT).  
    - **Desideratum B**: *Maximize expected utility of the policy chosen in advance* (UDT).  
    - **Why they conflict**:  
      - In **Counterfactual Mugging**, Desideratum A (evidence: "I’m in tails, paying helps no one") says *don’t pay*.  
      - Desideratum B (precommitment: "Paying in tails nets +$10K in heads") says *pay*.  
    - **Consequence**: You must drop one:  
      - *Drop A (choose UDT)*: Costs *actual* utility in realized branches (e.g., paying $100 in tails with no return). Rationality feels "alien" by ignoring local evidence.  
      - *Drop B (choose CDT/EDT)*: Costs *expected* utility in symmetric/acausal games. Fails Twin PD, Counterfactual Mugging, and invites exploitation.  
    - **Status**: This is the central divide in decision theory. Half the field drops A (UDT), half drops B (CDT/EDT).  

  - **Other Tensions**:  
    - **Causation vs. Evidence** (CDT vs. EDT):  
      - Smoking Lesion forces a choice—EDT fails non-exploitability; CDT fails acausal coordination.  
    - **Reflective Consistency vs. Dynamic Consistency**:  
      - If learning "theory X says defect" makes cooperation rational (e.g., in PDs), theories become self-negating.  

  ---

  ### **IV. Your Custom Case: "Hostage Branch"**  
  - **Case**: Heads: you get \$10K. Tails: Omega asks for \$1K. Heads-branch \$10K was *only given* if Omega predicted you’d pay in tails.  
  - **Analysis**:  
    - This is **Counterfactual Mugging in disguise**.  
      - Identical structure: Your action in one branch (tails) affects payoff in a counterfactual branch (heads).  
      - Theories that pass standard Counterfactual Mugging (e.g., UDT) handle this *for free*: Paying in tails is optimal precommitment (expected value: 0.5 * \$10K - 0.5 * \$1K = \$4.5K > \$0).  
    - **Not genuinely new**: No new rule needed. Tests the same as Counterfactual Mugging—*updatelessness under known branch asymmetry*.  
  - **Verdict**: If your theory passes Counterfactual Mugging, this case is already covered. No new desideratum.  

  ---

  ### **Summary Checklist**  
  **Any adequate theory must**:  
  1. Pass load-bearing cases:  
     - Newcomb’s (acausal correlation),  
     - Smoking Lesion (causation vs. evidence),  
     - Counterfactual Mugging (updatelessness),  
     - Twin PD (acausal coordination),  
     - Parfit’s Hitchhiker (dynamic consistency).  
  2. Satisfy structural requirements:  
     - Non-exploitability,  
     - Reflective + dynamic consistency,  
     - EU-compatibility in normal cases,  
     - Partition invariance.  
  3. Resolve the core conflict: **Evidence-responsiveness vs. precommitment**.  

  **Contested Claims Alert**:  
  - "Must one-box in Newcomb" is *not* consensus (CDT rejects it).  
  - "Must pay in Counterfactual Mugging" is UDT-specific (CDT/EDT reject).  
  - Acausal coordination is only required by UDT.  

  This spec lays bare the fault lines. Where you land depends on which losses (e.g., acausal cooperation vs. local evidence) you deem acceptable.
