  Okay, the user is a graduate student in philosophy of economics who encountered a fascinating scenario in a prediction market. Let me unpack this step by step.

  First, the core phenomenon: a no-trade equilibrium where any trade becomes a super-strong signal precisely because trading is theoretically impossible. The student gets the basic no-trade theorem but is hunting for the name of this second-order effect where the equilibrium's stability creates its own vulnerability. 

  Hmm... reviewing economic literature... Milgrom-Stokey no-trade theorem covers the baseline, but the self-undermining aspect? That's trickier. Oh! Hirshleifer's 1971 paper on the "paradox of information-based trade" comes close but doesn't capture the incentive to fabricate signals. 

  Wait - market manipulation theories? Not quite, since this isn't about false info but exploiting belief structures. Reflexivity à la Soros? Too broad. 

  *lightbulb moment* This is essentially a "self-destroying equilibrium" - the credibility of no-trade makes the first deviation hyper-informative, which attracts noise traders. The closest established term is "no-trade paradox," but it's not formalized. 

  For differentiation: Adverse selection is about hidden info generally; this is about common knowledge of rationality backfiring. Signaling requires intentional info transmission; here the signal is accidental. Manipulation is active deception; this exploits others' rational inferences. 

  Example time: Recall prediction markets for product launches where insiders can't trade. If someone places a tiny "joke" bet and the market spikes, that's the phenomenon in action. The effect stops when either: (1) traders become skeptical of deviations ("maybe it's just noise"), or (2) the market builds in manipulation-proof mechanisms. 

  *scribbles mental note* Should emphasize how fragile these equilibria are - like a dam that cracks more easily the stronger it looks. The student might appreciate connecting this to epistemic game theory's "trembling hand" concept too...
answer: |-
  Based on your description, you've identified a fascinating and underappreciated **second-order fragility within no-trade equilibria**. While there isn't a single, universally established term solely for *this specific reflexive loop*, the closest existing concepts and the phenomenon itself can be precisely described:

  1.  **The Core Phenomenon:** **Self-Undermining Equilibrium Credibility (SUEC)**
      *   *Definition:* A state where the common knowledge credibility of a no-trade equilibrium (based on shared priors and rationality) paradoxically creates an incentive for uninformed or manipulative actors to initiate trade. This occurs because the very credibility of "no trade" as the rational outcome imbues *any observed deviation* (a trade) with disproportionate informational weight, signaling potential private information or irrationality. This signal strength attracts actors seeking to profit from or exploit the induced market reaction, destabilizing the original equilibrium.
      *   *Why this fits:* It captures the core loop: Equilibrium (`No Trade`) → Belief in Equilibrium (`Credibility`) → Deviations become Highly Informative (`Signal Strength`) → Incentive for Deviations (`Manipulation/Nonsense Trades`) → Destabilization.
      *   *Established Neighbors:* This builds directly upon the **Milgrom-Stokey No-Trade Theorem** but focuses on the *fragility* introduced by the theorem's common knowledge assumptions. It's a specific manifestation within the broader realm of **Rational Expectations Equilibrium fragility** or **Information Revelation Game Theory**.

  2.  **Related Terms & Distinctions:**
      *   **No-Trade Theorem (Milgrom-Stokey):** The *foundation*. It establishes *why* no trade occurs with common priors, rationality, and common knowledge thereof. Your phenomenon arises *because* this theorem is commonly known and believed. **SUEC is a consequence of the theorem's assumptions holding.**
      *   **Adverse Selection:** A *first-order* problem where one party has hidden information *before* trade becomes impossible. SUEC occurs *after* adverse selection has theoretically prevented trade, focusing on the signal sent by the *act of trading itself* in that context.
      *   **Signaling:** A deliberate action to convey information. In SUEC, the signal (the trade) might be *accidental* or *manipulative* (like the joke) but is *interpreted* by others as a potential signal due to the equilibrium context. The signal's power derives from shared belief in the no-trade logic.
      *   **Market Manipulation:** A broad category. SUEC describes a *specific vulnerability enabling manipulation* – the fragility caused by the credible no-trade equilibrium makes manipulation via small, nonsense trades highly effective. Manipulation exploits SUEC.
      *   **Self-Defeating Prophecy:** Similar logical structure (a belief causing behavior that undermines the belief), but SUEC is specific to financial/prediction markets operating under no-trade theorem logic. It involves strategic rationality and information aggregation.
      *   **Grossman-Stiglitz Paradox (Paradox of Efficient Markets):** Asks how markets can be efficient if information is costly (no incentive to gather it). SUEC is different: It assumes costly information *prevents* trade, then shows how the resulting equilibrium is unstable because it makes *any* trade a powerful signal, attracting noise/manipulators.
      *   **Reflexivity (Soros):** Shares the idea that beliefs influence fundamentals. SUEC is a very specific, game-theoretic instance: The common knowledge *belief in the no-trade equilibrium* fundamentally alters the *informational meaning of a trade*, creating a new, unstable dynamic.

  3.  **Concrete Example: Prediction Market for Product Launch:**
      *   **Setup:** Company Z has a secret prototype. A prediction market exists for "Will Product X launch by Date Y?". Insiders with real knowledge are strictly prohibited and monitored. This is common knowledge. All traders share a prior (say, 50% probability).
      *   **Stage 1: No-Trade Equilibrium:** Consistent with Milgrom-Stokey, no trades occur. The price stays at 50%. Traders rationally infer that any counterparty offering to trade must have inside information they don't. The *absence* of trade is uninformative because it's expected.
      *   **Stage 2: The Deviating Trade:** Trader A (an outsider with *no* information) places a small "Buy" order as a joke or experiment. This trade executes at a slightly higher price (e.g., 52%).
      *   **Stage 3: SUEC in Action:** Observing this trade, other traders update:
          *   "This trade shouldn't exist! The only possible explanations are: (1) Trader A has inside info (bullish), (2) Trader A is irrational, (3) This is manipulation."
          *   Given common knowledge of rules, (1) seems plausible. Rationality is common knowledge, making (2) seem less likely than (1). Manipulation (3) might be considered, but the *strength of the signal* from the deviation overwhelms this skepticism initially.
          *   Traders rush to buy, fearing they are missing bullish news. The price jumps sharply (e.g., to 70%), **not because of the trade's size or direct information, but because the *existence* of the trade signaled a breakdown in the no-trade equilibrium.**
      *   **Stage 4: Resolution & Where it Stops:**
          *   **If Trader A reveals the joke/no-info:** The price might crash back towards the prior, but distrust lingers. Future deviations might be viewed with more suspicion.
          *   **If no explanation:** The price may stay elevated due to uncertainty or slowly decay as no news emerges ("Where's the beef?" effect). The initial jump, however, was pure SUEC.
          *   **Stopping Factors:** SUEC weakens when:
              *   The market observes multiple "meaningless" trades without subsequent news, learning to discount small deviations as noise or manipulation.
              *   The initial deviation is *explicitly and credibly* identified as manipulation/nonsense immediately.
              *   The cost of deviating (e.g., fees, risk of being caught manipulating) becomes high enough to deter nonsense trades.
              *   Belief in universal rationality weakens, making irrational trades seem more likely than informed ones.

  4.  **Why "Self-Undermining Equilibrium Credibility" (SUEC)?**
      *   **Self-Undermining:** The equilibrium's stability (`no trade`) depends on its credibility. But this very credibility is what makes deviating (`trading`) so potent, incentivizing actions that destroy the credibility/stability.
      *   **Equilibrium:** Specifically refers to the no-trade outcome predicted by Milgrom-Stokey.
      *   **Credibility:** Highlights that it's the *common knowledge belief* in the equilibrium and its rationale that creates the vulnerability.
      *   **Precision:** It clearly distinguishes the phenomenon from the baseline no-trade theorem and related concepts like adverse selection or manipulation, focusing on the *fragility arising from the equilibrium's credibility*.
      *   **Scope:** Captures the loop: Credibility → Signal Strength of Deviation → Incentive to Deviate Without Cause → Undermined Credibility.

  **In Summary:** You've identified a critical fragility within rational expectations equilibria, specifically the no-trade outcome. While building on the **Milgrom-Stokey No-Trade Theorem**, the phenomenon you describe is the **Self-Undermining Equilibrium Credibility (SUEC)** – where the common knowledge belief in the rational no-trade outcome makes *any* trade a disproportionately strong signal, creating an incentive for uninformed or manipulative actors to trade purely to exploit this signal, thereby undermining the credibility of the very equilibrium that created the signal's power. Your departmental prediction market is a perfect, real-world example of SUEC in action.
