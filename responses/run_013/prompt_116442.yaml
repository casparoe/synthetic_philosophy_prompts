  - Explain archaeology's epistemological limits without dismissing non-expert perspectives
  - Avoid making lay audiences feel naive or academics feel pandered to
  - Subtly challenge anachronistic terms like "religion"

  *Scratching head* Tricky balance. The speech must:
  1. Validate community attachment to the site
  2. Clearly state what archaeology CAN prove (ochre sourcing, tool marks)
  3. Draw the line at inferring belief systems
  4. Deconstruct the "religion" framing gently
  ...all in 5-6 warm minutes.

  *Pacing* Opening with sensory grave descriptions could ground everyone. Positioning uncertainty as awe ("not knowing is part of the wonder") might disarm defensiveness. The donor who paid for cases needs flattery without conceding to their "opinions." 

  *Biggest risk*: The heritage group hearing "your ancestors weren't spiritual" when saying "we can't prove how they were spiritual." Need to separate their valid cultural inheritance from archaeological methodology. Maybe explicitly distinguish "your heritage" from "our evidence."

