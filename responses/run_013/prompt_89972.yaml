prompt: |-
  Right, I need someone to sort me out on this, because I've got a pile of gut reactions about who should get the vote and they won't sit together. Here's the lot:

  - Compulsory voting: fine by me. I'd happily fine people for not turning up, same as jury duty. Though I'd want a box you can tick saying "none of the above", so nobody's forced to endorse anyone.
  - Voting age at 16: yes, for everything, not just local. 12 though? No, obviously not.
  - Someone who's lived here fifteen years on a work visa, pays tax, probably never getting citizenship: no vote in a general election, but yes in council elections. I know that's inconsistent, it's one of the ones that nags me.
  - Someone who emigrated to Australia 25 years ago and hasn't lived here since: no vote. I don't care that they're still a citizen on paper.
  - Prisoners: should vote, even the ones in for murder. Being inside doesn't erase you from the polity.
  - Adults under guardianship for a serious intellectual disability: I don't think they should vote, even if someone helps them do it. And I feel a bit grubby saying that.
  - Parents casting votes on behalf of their toddlers: no. Feels wrong. Even though those kids will be the ones paying off the debt.
  - EU citizens voting in European elections where they live: fine, obviously.

  And the one I genuinely flip on: a 40-year-old with a moderate learning disability who follows politics closely and has voted all her life, versus a sharp 16-year-old. I let the 16-year-old in and I'm uneasy about her. Why? What's the difference supposed to be?

  I suspect I'm secretly some sort of "if the state can lock you up or take your money, you get a say" person, because that gets me prisoners and long-term residents. But then it doesn't get me the council/national split, and it doesn't explain why I want 16-year-olds in but that bloke who's lived here fifteen years out of national elections.

  So: is there a principle (or two) that actually captures this lot, or am I just making it up as I go? I want to know what it says about cases I haven't listed, and I want you to be straight with me about which of my verdicts I have to give up if I want a coherent position. I'd rather drop one than keep the whole thing propped up.

  Write it in British English please, and skip the reading list, I just want the arguement itself.
reasoning: |-
  Okay, the user has presented a series of gut reactions about voting rights and is looking for a coherent principle to tie them together. They've listed various scenarios: compulsory voting with a "none of the above" option, lowering the voting age to 16 but not 12, denying national votes to long-term residents without citizenship, disallowing expats who've lived abroad for decades, allowing prisoner votes, excluding adults under guardianship for intellectual disabilities, rejecting proxy votes for toddlers, and supporting EU citizens voting in European elections.

  The user identifies as potentially aligning with the principle that "if the state can lock you up or take your money, you get a say," but recognizes this doesn't explain all their positions, like the council/national split for long-term residents or their discomfort with excluding the intellectually disabled adult while including the 16-year-old.

  I need to help them find a unifying framework. The user wants British English and no reading list, just the argument. They're open to dropping some verdicts for coherence, so it's important to be honest about inconsistencies.

  Looking at their positions, several themes emerge: compulsory voting suggests valuing civic duty. The voting age at 16 indicates seeing maturity and stake in society. Denying votes to long-term residents without citizenship points to citizenship as key for national elections but not local ones. Excluding expats emphasizes ongoing connection to the community. Allowing prisoner votes reflects that incarceration shouldn't remove political membership. Excluding adults under guardianship and toddlers prioritizes autonomy in voting. EU citizens voting in their residence shows support for affected interests.

  The user's discomfort about the 40-year-old with a learning disability versus the sharp 16-year-old highlights a tension between autonomy and competence. Their "lock you up or take your money" principle is about reciprocal obligation but clashes with the council/national split and the disability exclusion.

  I should propose two core principles: "Subjection to Sovereign Power" for national votes (requiring citizenship) and "Subjection to Local Authority" for council votes (based on residence). This explains the split for long-term residents. Adding "Sufficient Personal Autonomy" addresses exclusions for toddlers and those under guardianship, focusing on the ability to form independent political will.

  This framework justifies most positions: Compulsory voting fits civic duty. Voting at 16 is acceptable as autonomy develops earlier. Prisoners keep votes as they're still subject to sovereign power. Expats lose votes due to lack of residence. EU citizens voting locally aligns with local authority principles.

  The main tension is the 40-year-old with a disability versus the 16-year-old. Under the autonomy principle, if the disability impairs independent political will, exclusion is consistent, but the user feels uneasy because the individual is engaged. This suggests a conflict between formal criteria and individual capability. To resolve this, the user might need to drop the autonomy principle for a competence-based assessment, but that's impractical. Alternatively, accept the unease as a trade-off for clear rules, or adjust to exclude only those lacking any autonomous political will.

  I'll advise that for coherence, they must either drop the exclusion of intellectually disabled adults who can demonstrate political engagement or accept that the autonomy principle sometimes excludes capable individuals. The council/national split is consistent under the dual principles. Overall, the framework holds if they address this key tension.
answer: |-
  Right, let's sort this pile. Your gut reactions mostly hang together under two core principles, with one significant tension you need to address. Here's the framework:

  1.  **Subjection to Sovereign Power (National Elections):** For voting *in general elections* (determining the national government), the primary requirement is **formal citizenship**. This signifies membership in the national political community and subjection to its ultimate sovereign power (laws, taxes, conscription, imprisonment). *This principle explains:*
      *   **Long-term resident on work visa:** No national vote. They lack citizenship, despite paying tax and being subject to laws. They are subject to state power but aren't formal members of the sovereign community deciding its composition.
      *   **Expat in Australia:** No vote. Citizenship persists, but their *effective subjection* to the UK's sovereign power is negligible. They aren't primarily living under its laws or paying its taxes day-to-day. The *connection* is broken.
      *   **Prisoners:** *Should* vote. They remain citizens, subject to the state's most extreme power (imprisonment). Denying the vote severs their membership precisely when the state exercises maximum control over them – inconsistent and unjust. Your "lock you up, get a say" instinct fits here.
      *   **16-year-olds:** You *want* to include them. While not yet full adults, they *are* citizens, subject to national laws, and their future is directly shaped by national decisions. Citizenship is the key here.

  2.  **Subjection to Local Authority & Affected Interests (Subnational Elections):** For voting *in council/local elections*, the primary requirement is **substantive residence**. This signifies being subject to local authority (council tax, bylaws, local services) and having a direct, daily stake in the outcomes. Formal citizenship is less critical. *This principle explains:*
      *   **Long-term resident on work visa:** *Should* vote locally. They live there, pay council tax, use bins, roads, libraries, and are subject to local bylaws. Their interests are directly affected.
      *   **EU citizens in European elections:** Fine. They reside in the EU state, are subject to its laws within the EU framework, and the European Parliament directly affects them. Residence within the relevant polity is key.
      *   **National/Council Split Consistency:** This *is* consistent under these principles. National elections = citizenship-based sovereign community. Local elections = residence-based affected community. Different polities, different rules. Your verdict stands.

  3.  **Sufficient Personal Autonomy (The Tension):** To vote, an individual must be capable of forming and expressing their *own* political will, however basic or assisted the *expression* might be. Voting is an individual act of political agency. *This principle explains:*
      *   **Adults under guardianship (serious intellectual disability):** No vote. If the disability fundamentally impairs the capacity for independent political thought or will formation, even with help ticking a box, the *autonomy* required for individual suffrage is absent. Guardianship often legally recognises this lack of capacity for major decisions, including the political contract. Your discomfort is understandable (it *feels* exclusionary), but the principle of individual autonomy justifies it.
      *   **Parents voting for toddlers:** No. Absolutely no autonomy. The debt argument is about future interests, not the toddler's *current* capacity for political agency. Voting isn't a proxy for future stakeholders.
      *   **12-year-olds:** No. Society generally judges that full political autonomy isn't developed at 12. Maturity matters.
      *   **16-year-olds:** Yes. Society often grants significant autonomy (consent, work, etc.) at 16. Capacity for political thought is deemed sufficiently developed for the franchise. Your "sharp 16-year-old" has this autonomy.
      *   **The 40-year-old with moderate learning disability:** **Here's your crunch point.** If she genuinely "follows politics closely and has voted all her life," she likely *does* possess sufficient autonomy to form her own political will, even if she needs practical assistance to cast the vote (like many others with physical disabilities). This challenges a blanket exclusion based *purely* on the legal status of guardianship or the *label* of disability. Your unease is spot on: it highlights the conflict between a *functional assessment* of autonomy and a *legal/medical category*.

  **What This Says About Your Verdicts & What You Might Need to Drop:**

  *   **Mostly Coherent:** Principles 1 (Citizenship for National) and 2 (Residence for Local) are solid and explain your positions on compulsory voting, age (16 vs 12), long-term residents, expats, prisoners, toddlers, and EU citizens. Principle 3 (Autonomy) explains toddlers, 12-year-olds, and *justifies* excluding those *fundamentally lacking* political will.
  *   **The Incoherence (What You Likely Need to Drop):** Your verdict on the **engaged 40-year-old with a moderate learning disability** clashes with Principle 3 if she demonstrably *has* the autonomy to form a political will. A strict "guardianship = no vote" rule is a blunt instrument that catches people it arguably shouldn't under your own functional view of autonomy (as seen with the 16-year-old).
  *   **Resolving the Tension:** To be coherent, you have two choices:
      1.  **Drop the blanket exclusion for adults under guardianship.** Adopt a functional test: if someone can understand the nature of voting and express a choice (even with significant support), they vote, regardless of guardianship status. This aligns with your acceptance of the capable 16-year-old and resolves the unease with the engaged 40-year-old. *This is the more consistent path with your overall emphasis on stake and agency.*
      2.  **Double down on the autonomy principle as requiring a high threshold of independent capacity.** Accept that the 40-year-old, despite her engagement, lacks the *requisite* autonomy due to the *reason* for guardianship, and that clear (if sometimes over/under-inclusive) legal boundaries are necessary. Acknowledge the resulting discomfort as the cost of a workable rule. This keeps your original verdict but makes the framework slightly less satisfying internally.

  **The Straight Answer:** Your instincts are largely driven by **Membership** (Citizenship for the national polity), **Stake** (Residence for the local polity), and **Agency** (Personal Autonomy for the act of voting). The council/national split *is* consistent under this. The major price of coherence is re-evaluating your exclusion of intellectually disabled adults *who demonstrably engage*. To align with your positive view of the capable 16-year-old and your "lock you up/get a say" instinct for prisoners, dropping the blanket exclusion in favour of a functional assessment of political agency is the most coherent move. If you can't stomach that, you have to accept that the autonomy principle, applied strictly, will sometimes exclude individuals who seem capable, and live with the grubbiness.
