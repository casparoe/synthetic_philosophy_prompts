answer: |-
  Here's a one-page decision tree resolving the positions in your group. Each branch is a concrete question based on the cases you provided.

  ### Decision Tree: How Should Your Credences Update?

  **Start:** You now have credence 0.7 in proposition E (e.g., "tank is 20°C"). Your old credence was different. What now?

  1. **Did this credence change come from new *certain* evidence?**  
     *(e.g., a trusted lab report saying "20°C", or you saw the number "20" on a display you know is correct)*  
     - **YES** → **Strict Conditionalization (Classical Bayesian)**  
       *Awkward commitment:* Can't handle vague evidence (e.g., bad-light bird glance) or belief shifts without evidence (e.g., rain pill).  
     - **NO** → Go to 2.

  2. **Is the *source* of your 0.7 credence something you're certain about?**  
     *(e.g., "I saw a cheap thermometer read 20°C", "My reliable friend said '20°C'")*  
     - **YES** → **Likelihood-Based Updating (Evidence as Certain)**  
       *Awkward commitment:* Forces ambiguous experiences (e.g., bad-light glimpse) into artificial "source propositions".  
     - **NO** → Go to 3.

  3. **Should we demand *any* certain "evidence proposition" for the update?**  
     *(e.g., even "I feel 70% sure" must be certain before updating)*  
     - **YES** → **Radical Probabilism (De Finetti/Skyrms)**  
       *Awkward commitment:* Denies direct uncertain evidence exists; all updates reduce to conditioning on certain mental states.  
     - **NO** → Go to 4.

  4. **Does "holding conditional probabilities fixed" make sense?**  
     *(Test case: Before learning E, you thought P(Rain | E) = 0.3. After update, must this stay 0.3?)*  
     - **NO, IT'S UNREALISTIC** → **Holistic Revision (No Formal Rule)**  
       *Awkward commitment:* No general rule for updating; each case is unique (e.g., thermometer vs. rain pill).  
     - **YES, AS A NORM** → Go to 5.

  5. **Is the partition (what "E" is) fixed by the world or your choice?**  
     *(e.g., "E = 20°C" vs. "E = 20°C or 21°C" gives different results for other beliefs)*  
     - **FIXED/WORLD-GIVEN** → **Jeffrey Conditionalization (Partition-Sensitive)**  
       *Awkward commitment:* Partition choice is arbitrary, making updates subjective.  
     - **CHOSEN/ARBITRARY** → Go to 6.

  6. **Is order dependence a problem?**  
     *(Test case: Update credence to 0.7 about bird species (E) based on bad light, then update to 0.8 about it singing (F) based on muffled sound. Doing F then E gives different final beliefs than E then F.)*  
     - **YES, FATAL FLAW** → **Generalized Conditioning (Field/Lewis)**  
       *Awkward commitment:* Requires pre-defining a "basis" for all possible evidence, which is complex and untestable.  
     - **NO, FEATURE OR FIXABLE** → Go to 7.

  7. **Should the same rule apply to evidence-less shifts?**  
     *(e.g., Rain pill makes you 70% sure of rain (E) with no sensory evidence; or you forget old data and now P(E)=0.7.)*  
     - **NO, DIFFERENT PHENOMENON** → **Jeffrey Conditionalization (Experience-Based)**  
       *Awkward commitment:* Can't model belief drift/forgetting as "updates".  
     - **YES, SAME RULE** → **Probability Kinematics (Unconstrained)**  
       *Awkward commitment:* Allows "update" by fiat (e.g., "I now feel 70%") with no input, risking incoherence.

  ---

  ### Unoccupied Slots & Collapsed Positions
  - **Unattractive/Unexplored:** A view that denies certain evidence *and* rejects fixed conditionals *and* offers a formal rule. (Too vague to formalize.)
  - **Collapsed:** "Likelihood-Based Updating" (from Q2) and "Strict Conditionalization" (from Q1) are similar in requiring certainty; the tree separates them by input type.
  - **Verbal Dispute:** Whether "I saw the thermometer read 20°C" counts as "certain evidence" (Q1) or a "certain source" (Q2). Depends on how "evidence" is defined.
  - **Collapsed:** "Radical Probabilism" (Q3) and "Likelihood-Based" (Q2) both require certainty but differ on whether it's *external* (Q2) or *internal* (Q3).

  ### Key Distinctions Illustrated
  - **Thermometer (cheap):** Q2 ("YES") → Likelihood-Based.  
  - **Friend (80% reliable):** Q2 ("YES") → Likelihood-Based.  
  - **Bird in bad light:** Q2 ("NO") → Proceeds to Jeffrey/Generalized.  
  - **Rain pill/Forgetting:** Q7 → Splits Jeffrey (NO) vs. Kinematics (YES).  
  - **Order Dependence:** Q6 → Tests if Jeffrey's flaw is fatal.

  This tree forces your group to confront *why* they disagree using your cases, separating normative commitments from practical hacks.
