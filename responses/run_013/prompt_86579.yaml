prompt: |-
  I've been reading rationalist blogs and their comment threads for years, and I keep running into a pattern I don't have a name for. Two instances, both of which I've watched happen to people I know.

  A friend joined a religious community whose members insist the practice only works for those who believe in it. He joined because he wanted it to work. Five years on he still doesn't believe, and the members tell him this is exactly what they'd expect: you can't believe on purpose, and wanting the payoff is the surest evidence that you don't have the belief.

  A colleague spent years trying to become the sort of person who gives without keeping score. Every step she took toward it was taken for a reason, which made it, she said, just more scorekeeping; when she stopped trying, she stopped improving.

  The obvious neighbour is the old puzzle about the billionaire who pays you if, at midnight tonight, you intend to drink a poison tomorrow afternoon, and puts the money in your account before you have to drink it; I know the standard replies — form the intention and then change your mind, or arrange in advance to be the kind of agent who can't reconsider. Neither reply touches my two cases, because in neither is there a decision to make and later reverse: one of those states can't be entered by trying at all, and the other can only be entered by someone who isn't trying.

  What I'm after isn't a label so much as a carving. Is there an established concept for this family — payoffs that attach only to states you can't occupy for the sake of the payoff? If there is, tell me which of my cases it covers and which it doesn't, and how each stands to the poison puzzle. If there isn't, coin one and mark its edges: does it take in the poison puzzle, does it take in someone who wants to be spontaneous, and is the impossibility in the belief case the same kind as the impossibility in the character case?
reasoning: |-
  Okay, the user is describing a recurring pattern they've observed in rationalist blogs and personal experiences. They've provided two specific cases: one about a friend trying to believe in a religious practice, and another about a colleague attempting to become selfless. Both situations share a common paradox - the desired state seems unattainable when actively pursued for its benefits. 

  The user mentions the "poison puzzle" as a related concept but correctly points out that standard solutions don't apply here. What they're really seeking is a conceptual framework to understand this family of problems where the payoff depends on being in a state that can't be intentionally adopted for that payoff.

  Hmm, this reminds me of several philosophical concepts. There's the "paradox of hedonism" where directly pursuing happiness makes it elusive. Kierkegaard wrote about "double reflection" in religious faith. But neither fully captures both cases. The religious belief case involves epistemic self-sabotage - wanting to believe undermines the authenticity required for belief. The selflessness case is about practical self-defeat - conscious effort contradicts the state itself.

  For the religious example, it's interesting how the community's response reinforces the paradox. By telling the friend his lack of belief is expected, they're creating a self-fulfilling prophecy. The colleague's struggle with scorekeeping reveals how metacognition can undermine virtue development. 

  The poison puzzle differs fundamentally because it's about intention formation and temporal dynamics, not about the inherent impossibility of achieving a state through direct effort. Spontaneity would absolutely fit this pattern - trying to be spontaneous is inherently contradictory.

  I should emphasize that these aren't just semantic puzzles but real psychological traps people fall into. The solution often involves indirect approaches: focusing on related activities that naturally cultivate the desired state without directly pursuing it. 

  The key distinction between the two cases is worth highlighting: one concerns belief formation (epistemic) while the other concerns character development (practical). Yet both share that core structure where instrumental motivation corrupts the process.
answer: |-
  Your observation captures a profound family of paradoxes centered on **self-defeating instrumentalization**. This isn't one monolithic concept, but a constellation of related failures where **the instrumental pursuit of a state inherently undermines the conditions required to achieve it**. Let's carve it precisely:

  ### Core Concept: **Auto-Subversive Instrumentality (ASI)**
  A state *S* (e.g., belief, selflessness) is **auto-subversive** when:
  1.  **Instrumental Motivation Corrupts:** Attempting to enter *S* *because* of its payoff *P* directly prevents achieving authentic *S*.
  2.  **Authenticity Requirement:** Genuine *S* requires that the agent's motivation is *not* primarily instrumental toward *P* (or sometimes any payoff).
  3.  **Self-Application Problem:** Recognizing the requirement in (2) and trying to "fix" one's motivation often reinforces the instrumental frame, deepening the trap.

  ### Analysis of Your Cases

  1.  **The Religious Belief Case:**
      *   **State S:** Sincere belief in the religious tenets/practices.
      *   **Payoff P:** The promised benefits of the practice (e.g., enlightenment, community, salvation).
      *   **ASI Mechanism:** Belief is an *epistemic state* based on perceived truth. Wanting to believe *because* of *P* is an admission that one lacks sufficient evidence/conviction for the truth of the belief itself. This instrumental desire directly signals (to oneself and others) a lack of authentic belief. The community's response ("wanting the payoff *is* evidence of non-belief") codifies this paradox. Belief cannot be willed into existence *for* a reward; its genesis must lie in perceived truth, not utility.
      *   **Type:** **Epistemic Auto-Subversion.** The instrumental motive sabotages the truth-tracking nature of belief formation.

  2.  **The Selflessness Case:**
      *   **State S:** Genuine selflessness (giving without internal "scorekeeping").
      *   **Payoff P:** Becoming a selfless person (or the moral satisfaction/identity associated with it).
      *   **ASI Mechanism:** Selflessness is a *motivational state*. Consciously *trying* to be selfless *in order to achieve selflessness* keeps the focus on the self ("Am I selfless yet? What does this act gain me in becoming selfless?"). This very self-monitoring *is* the "scorekeeping" she wants to eliminate. The state *S* requires the *absence* of that self-focused calculation. Stopping the *project* of becoming selfless is the only way the self-focus can diminish, allowing selfless impulses to arise spontaneously.
      *   **Type:** **Motivational Auto-Subversion.** The instrumental motive (becoming selfless) perpetuates the self-focus that blocks authentic selflessness.

  ### Relation to the Poison Puzzle

  *   **The Poison Puzzle:** You must *intend at T1* to drink poison at T2 to get paid at T1. You don't have to *actually* drink it at T2.
  *   **Standard Solutions:** Focus on tricks of intention formation/revision over *time* (commitment devices, changing your mind).
  *   **Why it's Different from ASI:**
      *   **No Authenticity Requirement:** The billionaire doesn't care *why* you form the intention (e.g., purely for the money is fine). Authenticity isn't part of the state "intending to drink."
      *   **No Self-Defeat via Instrumentality:** Forming the intention *for* the money doesn't inherently prevent you from forming the intention; it's the *reason* you *can* form it! The problem is temporal inconsistency, not a contradiction in the state itself.
      *   **Solution Exists:** Clever agents *can* solve it through temporal commitment strategies.
  *   **Conclusion:** The Poison Puzzle is primarily a puzzle about **temporal commitment, intention stability, and self-binding**. It belongs to a different family (problems of *akrasia* or precommitment) than ASI. ASI states *cannot* be achieved by clever temporal tricks because the instrumental motive itself corrupts the state *at the moment of attempted formation/performance*.

  ### Other Members of the ASI Family

  *   **Spontaneity:** Trying hard to be spontaneous ("Ok, now I'll be spontaneous!") is inherently contrived and un-spontaneous. Genuine spontaneity arises unplanned.
  *   **Authenticity/Being "Yourself":** Consciously performing "authenticity" to fit an image or gain approval is inauthentic. True authenticity emerges unselfconsciously.
  *   **Flow State:** Obsessively monitoring whether you're "in flow" disrupts the absorption necessary for flow.
  *   **Happiness (Hedonic Paradox):** Directly pursuing happiness as a primary goal often leads to rumination and dissatisfaction, hindering the very state sought. Happiness is often a byproduct of engagement.
  *   **Sleep:** Trying *too* hard to fall asleep (focusing intensely on the *need* to sleep) creates anxiety that prevents sleep.

  ### Marking the Edges

  1.  **Covers:** Both your cases (Belief, Selflessness), Spontaneity, Authenticity, Flow.
  2.  **Does Not Cover:** The Poison Puzzle (different mechanism: temporal commitment, not state corruption by motive). Simple failures of willpower (e.g., wanting to diet but eating cake - no paradox, just weakness). States achievable *through* instrumental action (e.g., wanting money to buy a house, working hard, getting money, buying house - motive doesn't corrupt the state of owning the house).
  3.  **Impossibility Type:** Your two cases share the *core ASI structure* (instrumental motive corrupting the state) but differ in the *domain*:
      *   **Belief Case:** Epistemic impossibility (truth-assessment corrupted by desire for reward).
      *   **Character Case:** Motivational impossibility (self-focus perpetuated by the goal of eliminating it).
      *   Both are "impossible" in the sense that the direct, instrumentally motivated *strategy* is guaranteed to fail or be self-defeating. However, both states *can* potentially be achieved *indirectly* (e.g., belief might arise from genuine inquiry/experience unrelated to the payoff; selflessness might emerge from compassion cultivated through practice focused on others, not on *becoming* selfless).

  ### Solution Path (Not Always Easy)
  The way out of ASI traps involves **indirection** and **re-framing**:
  *   Focus on the *activity* or *object* itself, not the state it might produce (e.g., engage with the religious practice out of curiosity or community, not *for* belief; focus on the recipient's need when giving, not on *being* selfless).
  *   Cultivate supporting conditions/environments where *S* can emerge naturally as a byproduct.
  *   Accept that *S* cannot be willed directly and release the *demand* for *S* as a condition for value.

  You've identified a deep and pervasive pattern in human striving. Auto-Subversive Instrumentality explains why some of our most cherished states remain elusive when pursued head-on for their rewards.
