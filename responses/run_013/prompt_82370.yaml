prompt: |-
  I've somehow ended up running next week's session of our little philosophy-of-infinity reading group — the person who was going to do Thomson's lamp is away and it fell to me. It's a mixed room: two maths grad students, a physicist, and four undergrads who've done one logic course. It's also got a bit personal, because I got into an arguement about the lamp at a party last month, the physicist kept saying it's really a disguised physics question and that you can't do infinitely many things in a finite time anyway, and I realised I couldn't say cleanly why that misses the point. So don't explain the lamp to me — I know the setup — I need a plan for teaching it. I'm tempted to build the whole session around a variant I half invented: no switch, a dimmer, each step taking the brightness halfway to full, so the steps converge on a final value instead of flip-flopping forever.

  Give it to me as exactly five numbered items, a sentence or two each, no intro and no conclusion: (1) the order the ideas have to come in and what has to be understood before what; (2) the one example that should carry the session, and whether my dimmer variant is it, or whether it quietly does something that would mislead them; (3) the misconceptions to expect and where in the sequence to head each one off — my guess is they'll want the lamp to end up half-on, or 'neither on nor off', and I think that means they're treating it as a limits problem; (4) one question to ask at the end that would show me whether it landed; (5) what I should openly refuse to get into at this level.
