prompt: |-
  Background: I'm a retired palaeontologist — 34 years at a natural history museum, mostly trilobites, plus a long stretch as collections manager, which means I spent half my career telling visitors that the thing in the case is a cast and the real one is in a draw upstairs and that this is fine. I've now been reading philosophy for about two years and it's dawned on me that I never worked out why it's fine, or whether it is.

  There are two pictures of why an original is special that I keep bumping into, and I'd like them compared properly.

  Picture A, the one I absorbed at the museum — call it the type-specimen picture. An object's value is that it's the designated reference point for a name. The holotype is what a species name is glued to. It doesn't have to be beautiful or complete or even very informative — plenty of types are a chunk of jaw — it just has to be the one that got picked, curated, catalogued, and can be pointed at. A cast is fine for teaching, for measuring, for display; what a cast can't do is be the thing the name hangs on. So on this picture the value is institutional and historical: it lives in a chain of custody, not in the surface of the object.

  Picture B, the one I get from art people — call it the achievement picture. What you value in the original is that it's the product of a particular person's particular performance on a particular afternoon: the decisions, the hesitations, the luck. A forgery can match the surface perfectly and still be worth nothing, becuase nobody performed anything — it's a recording, not a performance.

  I want to know which of these is doing the real work, and where each of them breaks. Test them on three cases. One: a forgery of a painting that matches pigments and canvas age and fooled the experts for forty years. Two: a specimen that's 60 per cent original bone and 40 per cent sculpted plaster, on display so long that the museum itself has lost track of which bits are which. Three: a micron-accurate digital scan of a sculpture, printable anywhere, indistinguishable by eye from the marble.

  Then tell me the thing I actually want to know: are these two pictures rivals, or are they answering different questions and I've been conflating them?

  Give it to me as exactly five numbered points, a sentence or two each, no preamble and nothing tacked on at the end.
reasoning: |-
  Okay, the user is a retired paleontologist with decades of experience, now delving into philosophy. They're grappling with why original objects hold value versus replicas in museums, specifically contrasting two perspectives: the institutional "type-specimen" view and the artistic "achievement" view. They want these tested against three cases (forgery, partial reconstruction, digital scan) and clarified whether these frameworks conflict or address separate issues. 

  Hmm, their background suggests deep familiarity with museum pragmatics but philosophical curiosity about underlying justifications. The unspoken tension seems to be between their professional acceptance of casts as functional tools and a lingering unease about authenticity. Their cases cleverly pressure-test both theories: the forgery challenges "achievement," the hybrid specimen blurs "type-specimen" integrity, and the digital scan threatens both.

  Right, structuring five precise points without fluff. First, I'll define each picture's core principle to establish their distinct domains (taxonomy vs. creation). Then apply them to each case neutrally—noting where one theory struggles while the other holds (e.g., forgery dismantles achievement value but leaves type-specimen relevance intact). The hybrid specimen case particularly interests me—it exposes how institutional designation can override material authenticity, which aligns with their museum experience. 

  For the digital scan, I need to emphasize how both theories fail if stripped of human context: without designation, it's not a type; without creative performance, it's not art. Finally, the synthesis must clarify they're non-rivalrous: one anchors names to objects, the other honors creative acts. Their conflation likely stems from both addressing "value," but from different angles. 

  ...Double-checking that point 5 resolves their core confusion: yes, explicitly stating they answer "why originals matter" in complementary ways should satisfy their request. No jargon, no padding—just crisp distinctions.
answer: |-
  1.  **Distinct Foundations:** Picture A (type-specimen) anchors value in institutional designation and function within a naming/conservation system; Picture B (achievement) anchors value in the unique historical act of creation and its direct physical trace.
  2.  **Case 1 (Forged Painting):** Picture B fails (no artist's performance), explaining its worthlessness artistically; Picture A remains irrelevant unless the *forgery itself* becomes a designated historical artifact (e.g., famous fake).
  3.  **Case 2 (Hybrid Specimen):** Picture A holds (the designated object retains its catalogued status regardless of material composition); Picture B breaks down as the original "performance" (fossilization, preparation) is materially obscured and commingled.
  4.  **Case 3 (Digital Sculpture Scan):** Both pictures struggle: Picture A requires a designated, singular physical object; Picture B requires the artist's direct physical manipulation traceable to *one* output object. The scan/print lacks both institutional singularity and unique creative materialization.
  5.  **Non-Rivalrous Frameworks:** These pictures answer different questions: Picture A explains the *institutional/scientific* necessity of specific originals for reference and naming; Picture B explains the *aesthetic/historical* value of originals as direct products of unique creative acts. They are complementary, not rivals.
