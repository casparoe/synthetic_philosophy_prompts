  Hmm, the main issue with arbitrary byte strings is that it's not prefix-free. That could mess up the probability distribution because overlapping programs might be counted multiple times. But since they're killing slow programs, maybe the practical impact is minimal. Most short programs that finish quickly under a million steps might not overlap much anyway. So maybe they can ignore the prefix-free requirement for now. 

  Next, the runtime limit. Classic Solomonoff includes all programs, but here anything beyond a million steps is out. That means they're missing out on some valid hypotheses, especially those that are short but compute-heavy. But in practice, for next-symbol prediction, maybe the simpler programs that terminate quickly are the most useful. Complex theories might not be necessary if the data isn't that complicated. So the runtime cap might not hurt as much as theoretically expected. 

