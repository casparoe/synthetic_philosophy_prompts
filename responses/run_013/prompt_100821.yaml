  Hey, I've been building a little hobby project — a toy predictor that guesses the next symbol in a stream by scoring candidate hypotheses, where each hypothesis is a short program and I weight it by 2 to the power of minus its length, then normalise. Its basically me trying to roll my own Solomonoff induction. Two things about my setup are a bit off from the textbook version and I want you to actually take a side on them rather than laying out the menu of options. First, my reference machine is just plain CPython with a fixed standard library, and I let any byte string count as a valid program (I never bothered with a prefix-free encoding). Second, I can only run a program for about a million steps before I kill it, so anything slower than that never gets to make a prediction at all.

  Put on the hat of someone who works in algorithmic information theory and has definately implemented this kind of thing — someone with real opinions, not someone reciting the Wikipedia page. Think carefully, and go ahead and brainstorm in your head before you commit.

  Give me the most important implications of Solomonoff induction / Kolmogorov complexity / Occam's razor for a setup like mine. Be committed: tell me which implications actually bite for my case and which ones I can safely ignore, and give your reasons. Exactly five numbered items, each a sentence or two, no intro and no conclusion.
