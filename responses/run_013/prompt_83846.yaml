  - "cost_of_dropping_it": "We lose the simplicity of having a single preference at each moment. We must now distinguish between momentary desires and long-term reflective judgments, and explain how they conflict. This requires a more complex model of the self."
  - "akrasia_after_the_repair": "Weakness of will is real: it occurs when an agent acts against their own better judgment (understood as a stable, long-term, or reflective preference) because they are overcome by a stronger momentary desire."
  - "alternatives": [
