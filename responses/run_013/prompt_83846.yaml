prompt: |-
  I'm a science journalist — behavioural econ, mostly, plus the philosophy-of-mind stuff that keeps leaking into it — and a friend sent me an arguement from a seminar on intertemporal choice that I've been chewing on for a week. It's not about anything exotic. It's the ordinary case of staying up till 1am eating the cake you swore off at breakfast. But the conclusion is so absurd that I assume something in the chain is doing something dirty, and I cannot see where. Numbered the way he sent it:

  1. Weakness of will is acting against your own better judgment.
  2. At any given moment your better judgment just is your strongest preference at that moment — the option you want most, all things considered.
  3. When you cave, you take the cake. Nobody picks what they want less when they could have what they want more.
  4. So when you cave, you're doing what you most want to do at that moment.
  5. So you aren't acting against your own better judgment.
  6. So there's no weakness of will, only a preference reversal. 8am-you ranks the diet above the cake, 11pm-you ranks the cake above the diet, and 11pm-you happens to be at the controls. Calling that a failure of will is like calling Tuesday's weather a failure of Monday's forecast.
  7. The only way to get back a single "you" whose judgment could be betrayed is to aggregate the time-slices — to build one ranking out of what each of them wants.
  8. But you can't. Aggregating several internally consistent rankings into one ranking that respects each of them and lets no single slice dictate to the rest is provably impossible; it's the same structure as the proof that no voting rule can satisfy a few obviously reasonable conditions without handing someone a dictatorship. So "what I really want" either just is what 11pm-you wants — and then nothing has gone wrong — or it's a slice we've arbitrarily enthroned, in which case we haven't discovered the real you, we've appointed one.
  9. So akrasia isn't a real phenomenon. The word names an illusion we get by quietly switching which time-slice we're speaking for.
  10. Which is nuts. Precommitment apps, gym contracts, "I wanted not to," the very specific flavour of regret where you were there and you watched yourself do it — none of that is an illusion, and a theory on which regret is a category error has proved way too much.

  The two people I've asked both think it's step 3 (inferring the preference from the choice makes the whole thing unfalsifiable and quietly assumes what it's meant to prove), or else step 8 (the dilemma is fake, because a person isn't a parliament of time-slices, she's her plans and standing intentions). Neither of them has actually thought it through and I don't trust either answer. I'd rather keep 1 and 2 than give them up — I like the parsimony, the idea that your better judgment is just a preference with a longer time horizon, and the whole hyperbolic-discounting picture where a sophisticated chooser knows she'll cave and wants the fridge locked in advance — so if the fix costs me one of those, tell me what I'm paying.

  Give me your answer as JSON and nothing outside the braces, with these fields:

  - "diagnosis": one of "broken_step" or "every_step_survives_but_one_is_too_expensive_to_keep"
  - "offending_step": the number, as an integer
  - "why_it_looked_fine": two or three sentences
  - "cost_of_dropping_it": two or three sentences
  - "akrasia_after_the_repair": what weakness of will turns out to be once the fix is made, or whether it survives as a real phenomenon at all
  - "alternatives": an array of at most three objects, each with "step" (integer), "why_people_blame_it", and "what_dropping_it_costs"
  - "what_the_repair_leaves_untouched": the bit of the original worry this fix doesn't solve
reasoning: |-
  We are given an argument that concludes that akrasia (weakness of will) is an illusion. The argument proceeds in 10 steps. The user is a science journalist and finds the conclusion absurd. The user wants to know which step is broken and what it costs to drop it, while preferring to keep steps 1 and 2.

  Let me summarize the steps:

  1. Weakness of will is acting against your own better judgment.
  2. At any given moment, your better judgment is your strongest preference at that moment (the option you want most, all things considered).
  3. When you cave, you take the cake. You always pick what you want most at that moment.
  4. Therefore, when you cave, you are doing what you most want to do at that moment.
  5. Therefore, you are not acting against your own better judgment (because your better judgment at that moment is to take the cake).
  6. So there's no weakness of will, only a preference reversal between time slices (8am-you vs. 11pm-you).
  7. The only way to have a single "you" is to aggregate the rankings of the time-slices.
  8. But aggregation is impossible without dictatorship (by Arrow's theorem analogy). Thus, "what I really want" is either what the current slice wants (so nothing is wrong) or an arbitrary slice is chosen (which isn't the real you).
  9. Therefore, akrasia isn't real; it's an illusion from switching the time-slice we are speaking for.
  10. But this is absurd because precommitment, regret, etc., are real.

  The user notes that two people blamed step 3 (inferring preference from choice makes it unfalsifiable) or step 8 (the aggregation dilemma is fake because a person is more than a parliament of slices). The user prefers to keep steps 1 and 2.

  I think the problem is in step 2. Step 2 claims that at any moment, your better judgment is your strongest preference at that moment. But note that step 1 defines weakness of will as acting against your own better judgment. Step 2 equates better judgment with the strongest preference at the moment. However, the common understanding of "better judgment" is that it is a judgment about what is best overall, which might take into account future consequences and past commitments, and it is often thought to be stable over time. The argument in step 2 collapses the distinction between the all-things-considered preference at the moment and the better judgment. But better judgment is often understood as a reflective judgment that might conflict with the immediate urge.

  In fact, the user mentions that they like the hyperbolic discounting model, which does have a conflict between a long-term preference and a short-term one. In that model, the better judgment might be the long-term preference, but at the moment of action, the short-term preference is stronger. So step 2 is the culprit: it defines better judgment as the strongest preference at the moment, thereby making it impossible to act against it at that moment. This leads to the conclusion that there is no weakness of will.

  But if we drop step 2, we can have a model where better judgment is a stable, long-term preference (or a commitment) that can be overridden by a momentary preference. Then, when you cave, you are acting against your better judgment (which is the long-term one) even though you are following your strongest preference at the moment.

  What does it cost to drop step 2? We lose the parsimony of having a single preference at each moment. We now have to account for two kinds of preferences: momentary and long-term. We also have to explain what better judgment is if not the strongest preference at the moment. It might be a second-order desire (wanting to want the diet) or a standing commitment. The cost is that we introduce a more complex structure of the will.

  After the repair, akrasia survives as a real phenomenon: it is the case where the agent acts against their better judgment (understood as their long-term, reflective judgment) because of a stronger momentary desire.

  Now, let's consider the alternatives the user mentioned. Some blame step 3 (inferring preference from choice). If we drop step 3, we allow that sometimes you might choose something that is not your strongest preference (due to mistakes, etc.), but that doesn't seem to be the case in weakness of will. The cost would be that we cannot rely on revealed preference and we have to have an independent way to measure preference.

  Others blame step 8 (the aggregation problem). If we drop step 8, we can say that there is a single "you" that persists over time and has a consistent set of values or plans. The cost is that we have to explain how this aggregation works without a dictatorship, and we have to reject the time-slice model.

  But the user wants to keep steps 1 and 2. However, step 2 is the one that causes the problem. If we keep step 2, we are forced to conclude that there is no weakness of will. So to save akrasia, we must drop step 2.

  Finally, what does the repair leave untouched? The original worry about the time-slices and the aggregation problem (steps 6-8) remains. We still have to explain how the long-term better judgment is formed and why it should be considered the "real" you. But we have avoided the immediate contradiction by allowing that the better judgment is not the momentary preference.

  So my diagnosis is that step 2 is the broken step.

