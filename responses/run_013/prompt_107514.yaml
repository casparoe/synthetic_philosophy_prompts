prompt: |-
  hey, so im the president of my schools philosophy club and i got stuck writing the written round for our end-of-year mini tournament. topic this year is echo chambers vs epistemic bubbles — yknow, the difference between a group where you just never hear the other side, vs a group where you do hear it but everyones been trained to think its all lies. problem is i already handed out a one-page summary so everyone knows the definitions, and if i ask "whats the difference" every team gets full marks and it tells me nothing. i need a question that actually splits the field.

  what i want is ONE essay question, ~20 min of writing, for 14-17 year olds who are sharp but have never done philosophy formally. and i want it hung on a made-up case so nobody can have googled the answer. heres my case, clean it up if its clunky:

  "the lighthouse" is a little online forum, like 200 people, all with the same rare condition. they swap advice, they all trust the same three blogs and one fb group, and they basically never see what regular doctors say. when a doctor does wander in theyre polite and read the post and then go right back to the blogs, and none of them has ever looked into how those blogs know what they know. twist: it turns out the forum is RIGHT — the mainstream advice was outdated and the blogs were correct. second group, "truth watch," does the opposite: they go hunt down people who disagree and publicly dunk on them and call them shills until nobody inside believes a word outsiders say.

  the question needs to make them do two things. (a) say which group is a bubble and which is an echo chamber, and justify it from the case. (b) the hard part — whether "the lighthouse" is doing anything epistemically wrong AT ALL, seeing as theyre right. like, is being in a bubble only bad if it makes you wrong? or is there a separate problem even when the beliefs happen to be true? thats the bit i think separates the kids who get it from the kids who just memorized my handout.

  no citations, no reading list, we cant look anything up in the room. and dont make it super niche — some of the kids are 14 and this is their first tournament.

  give it back to me as a JSON object with exactly these fields:
  - "question": the essay question exactly as i should hand it out, with the case written in properly and a word limit
  - "model_answer": what a top answer looks like, about 400 words
  - "total_marks": a number
  - "marking_scheme": an array; each item has "point" (a specific move a good answer has to make), "marks" (how many of the total that move is worth), and "common_mistake" (the specific wrong move a weaker answer makes instead — no vague stuff like "lacks depth")
  - "separates_a_from_b": one sentence naming the single move that most cleanly divides an A from a B

  make the marks add up to total_marks and make sure every "common_mistake" names an actual thing a real student would write.
reasoning: |-
  We are creating an essay question for a philosophy club tournament. The topic is echo chambers vs. epistemic bubbles. We have a case with two groups: "The Lighthouse" and "Truth Watch". The key points of the case are:

  - The Lighthouse: A small online forum of people with a rare condition. They trust the same three blogs and one Facebook group. They never look at mainstream doctors' advice. When a doctor comes in, they are polite but then ignore the doctor and go back to their blogs. They never investigate how the blogs know what they know. Twist: The blogs are actually correct and the mainstream advice is outdated.

  - Truth Watch: They actively hunt down people who disagree and publicly dunk on them, calling them shills, until nobody inside believes a word outsiders say.

  The question should require two things:
  (a) Identify which group is an echo chamber and which is an epistemic bubble, and justify from the case.
  (b) Address whether The Lighthouse is doing anything epistemically wrong even though they are correct.

  We want to create a JSON object with:
  - "question": The essay prompt, including the case, with a word limit (let's set it to 400 words to fit the 20-minute writing time).
  - "model_answer": A top answer of about 400 words.
  - "total_marks": Let's make it 15 marks so we can break it down nicely.
  - "marking_scheme": An array of objects with "point", "marks", and "common_mistake".
  - "separates_a_from_b": One sentence naming the single move that divides an A from a B.

  Let me design the question first.

  Question:

  "Consider the following two online communities:

  1. **The Lighthouse**: A small online forum (about 200 people) for individuals with the same rare condition. Members swap advice and trust the same three blogs and one Facebook group. They rarely encounter mainstream medical advice. When a doctor (an outsider) posts in the forum, members are polite and read the post, but then return to relying on their trusted blogs. No member has ever investigated how the blogs acquired their knowledge. However, it turns out that the blogs are correct: mainstream medical advice for this condition is outdated, and the blogs provide accurate information.

  2. **Truth Watch**: This group actively seeks out people who disagree with their views. They publicly mock and discredit these outsiders, calling them 'shills' and 'liars', until no member of Truth Watch believes anything said by outsiders.

  Essay Question: 
  (a) Based on the definitions of epistemic bubbles and echo chambers, identify which group is an epistemic bubble and which is an echo chamber. Justify your answer using details from the case. 
  (b) Even though The Lighthouse ended up being correct, did they do anything epistemically wrong? Explain why or why not, considering the nature of their community.

  Word limit: 400 words. Time: 20 minutes."

  Now, let's create a model answer (about 400 words):

  Model Answer:

  "(a) The Lighthouse is an epistemic bubble, while Truth Watch is an echo chamber. An epistemic bubble is a situation where information from outsiders is absent or filtered out, so members never hear the other side. In The Lighthouse, members rarely see mainstream medical advice and when they do (like when a doctor posts), they politely acknowledge it but then ignore it and return to their trusted blogs. They are not actively hostile, just isolated. In contrast, an echo chamber actively discredits outside sources to the point that members are trained to dismiss them as unreliable. Truth Watch hunts down dissenters, publicly dunks on them, and calls them shills, which systematically undermines trust in outsiders. Thus, Truth Watch fits the echo chamber definition because they build a culture of distrust.

  (b) Even though The Lighthouse is correct about the medical condition, they are still doing something epistemically wrong. Epistemically responsible behavior requires not just having true beliefs but also having good reasons and being open to evidence. The Lighthouse members never investigate the sources of their blogs and ignore mainstream medical advice without critical evaluation. They are lucky that the blogs are correct, but their method of forming beliefs is unreliable. If the blogs had been wrong, they would have had no way to know. This is a problem because it makes their true belief accidental, not based on sound reasoning. In epistemology, we value forming beliefs through reliable processes, not by chance. Therefore, The Lighthouse is epistemically irresponsible because they are in a bubble that shields them from critical engagement and evidence, even though they happen to be right in this case."

  Word count: about 250 words. We can expand a bit to get closer to 400 if needed, but 250 might be acceptable in a 20-minute window. Alternatively, we can adjust. Let me try to expand slightly:

  Expanded Model Answer:

  "(a) The Lighthouse is an epistemic bubble, while Truth Watch is an echo chamber. The key difference lies in how each group handles outside information. An epistemic bubble is characterized by a lack of exposure to opposing viewpoints; members simply do not encounter them. In The Lighthouse, the members are isolated from mainstream medical advice. They are not hostile when a doctor posts, but they do not engage with the doctor's points and return to their trusted blogs. This shows an absence of the other side, making it a bubble. Conversely, an echo chamber goes beyond isolation by actively discrediting external sources. Truth Watch seeks out dissenters to publicly mock and label them as shills, thereby training its members to distrust any outside voice. This systematic distrust creates an environment where even if members hear the other side, they reject it as lies. Thus, Truth Watch is an echo chamber.

  (b) Despite being correct about the medical condition, The Lighthouse is still committing an epistemic error. The problem is not about the truth of their beliefs but about the process by which they form and maintain those beliefs. Epistemically virtuous agents should seek evidence, critically evaluate sources, and remain open to new information. The Lighthouse fails on these counts: they do not investigate how their blogs gained knowledge, and they disregard mainstream advice without proper scrutiny. They are fortunate that their sources are accurate, but this luck does not justify their method. If the blogs had been wrong, the bubble would have prevented them from discovering the truth. Moreover, by avoiding critical engagement, they miss the opportunity to deepen their understanding or correct potential errors. Thus, even when a bubble leads to true beliefs, it is epistemically irresponsible because it relies on luck rather than a reliable process of truth-seeking."

  Word count: ~320 words. That's acceptable.

  Total Marks: 15.

  Marking Scheme:

  We need to break down the marks for the two parts. Let's allocate:

  For part (a): 6 marks
  For part (b): 9 marks (because it's the harder part)

  But we can break each part into specific moves.

  Part (a) moves:
  1. Correctly identify The Lighthouse as an epistemic bubble and Truth Watch as an echo chamber. (2 marks)
  2. Justify the bubble: point out that they don't hear the other side (absence) and are polite but dismissive. (2 marks)
  3. Justify the echo chamber: active discrediting (hunting, dunking, calling shills) leading to distrust. (2 marks)

  Common mistakes:
  - Switching the labels (calling Lighthouse an echo chamber and Truth Watch a bubble) - that would lose marks for point 1 and also affect the justifications.
  - In justification, missing the key details (e.g., for bubble, not mentioning the polite dismissal; for echo chamber, not mentioning the active discrediting).

  Part (b) moves:
  1. Argue that being correct does not absolve them of epistemic wrongdoing. (2 marks)
  2. Explain that the problem lies in the process of belief formation (lack of critical evaluation, not investigating sources). (3 marks)
  3. Discuss the concept of epistemic luck (they are lucky to be right, but the process is unreliable). (2 marks)
  4. Conclude that it's epistemically irresponsible even when true. (2 marks)

  Common mistakes:
  - Saying that since they are right, there's no problem (failing to address the process).
  - Only focusing on the outcome and not the method.
  - Not mentioning the lack of critical engagement or investigation.
  - Confusing the issue with moral or practical wrongs (e.g., "they might hurt others" - but we want epistemic focus).

  Now, let's write the marking scheme array:

  [
    {
      "point": "Correctly identifies The Lighthouse as an epistemic bubble and Truth Watch as an echo chamber",
      "marks": 2,
      "common_mistake": "Switches the labels (calls Lighthouse an echo chamber and Truth Watch a bubble)"
    },
    {
      "point": "Justifies the bubble by noting the absence of outside views and the polite but dismissive behavior in The Lighthouse",
      "marks": 2,
      "common_mistake": "Fails to mention the polite dismissal or the lack of exposure to mainstream advice"
    },
    {
      "point": "Justifies the echo chamber by describing Truth Watch's active discrediting of outsiders (hunting, mocking, calling shills) leading to distrust",
      "marks": 2,
      "common_mistake": "Describes Truth Watch as merely avoiding outside views without active discrediting, or misses the distrust component"
    },
    {
      "point": "Argues that being correct does not mean The Lighthouse did nothing epistemically wrong",
      "marks": 2,
      "common_mistake": "Asserts that since they are right, there is no epistemic problem"
    },
    {
      "point": "Explains the epistemic error as a failure in the process of belief formation (e.g., not investigating sources, lack of critical evaluation)",
      "marks": 3,
      "common_mistake": "Focuses only on the outcome (truth) without addressing the method, or confuses epistemic error with practical consequences"
    },
    {
      "point": "Discusses the role of epistemic luck (true belief by chance, not by reliable process)",
      "marks": 2,
      "common_mistake": "Does not mention luck or the unreliability of the process"
    },
    {
      "point": "Concludes that the bubble is epistemically irresponsible even when beliefs are true",
      "marks": 2,
      "common_mistake": "Fails to draw a conclusion about epistemic responsibility, or concludes that only false beliefs are problematic"
    }
  ]

  Total: 2+2+2+2+3+2+2 = 15.

  The single move that separates A from B: 
  "separates_a_from_b": "Recognizing that the epistemic problem in The Lighthouse lies in the unreliable belief-forming process, not just in the truth of the beliefs."

  Now, let's write the JSON.
