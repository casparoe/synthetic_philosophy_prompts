prompt: |-
  I sit in the compliance function of a company that sells into both rich and poor countries, and I have been trying to work out what our anti-corruption apparatus actually believes. The pattern that puzzles me is this: whether a payment is called corruption seems to depend on who receives it and on what we say its purpose was, not on what it does. A bottle of whisky for the customs clerk who clears our shipments is a dismissable offence, even when the clerk is obliged to clear the shipment anyway, the whisky buys us nothing but courtesy, and no decision is changed; the same bottle for the procurement manager at a private customer, who genuinely does choose between us and a competitor, counts as hospitality and appears in no policy at all. Our staff in one country point out that a gift to an official's family is a social obligation there and is offered with no expectation of return, and we tell them it is a bribe regardless. In some of the places we operate, small payments to move along routine actions the official already owes are tolerated by the letter of the law, while in others they are criminal. At home we make large, lawful donations to the campaigns of politicians, including the minister who appoints the customs chief, and we hire former regulators as consultants; nobody in the industry regards either as corruption. We export this rulebook, along with the international indices and conventions that now measure countries by it, and I am no longer sure whether we are describing corruption or describing our own arrangements.

  What theory of corruption does this apparatus presuppose, and how much of it is actually forced by the theory? Reconstruct the implicit view, say which rival accounts of corruption it quietly rules out, and tell me whether it is internally consistent or whether the treatment of campaign donations, lobbying and private-sector gifts shows that a second, unstated view is doing the work. Say whether the public-private line is principled or merely administrative, and whether the theory is parochial in treating particularistic gift exchange as a deviation from a norm rather than as a different way of constituting social relations, or whether a defensible account of corruption must be universal. Then tell me concretely what would have to change in our rulebook if we replaced the implicit view with the alternative you think is strongest.

  Answer as a numbered list of exactly five items, each one or two sentences, with no introduction and no conclusion. Take a definite position throughout: tell me which theory the practice presupposes and whether it hangs together, rather than laying out the candidates and leaving the choice to me.
reasoning: |-
  Hmm, the user works in compliance and is questioning their company's anti-corruption policies. They've noticed inconsistencies: whisky for a customs clerk is treated as corruption, but the same for a private procurement manager isn't. Gifts to officials' families in some cultures are deemed bribes regardless of intent. Small "facilitation" payments are illegal in some jurisdictions but tolerated in others. Meanwhile, large campaign donations to politicians and hiring former regulators are seen as legitimate. The user suspects the rules might be culturally biased or hypocritical, exporting Western norms without considering local contexts. They want me to reconstruct the implicit theory behind these rules, point out what it rules out, check for consistency, and suggest concrete changes for a better approach.

  The core issue is defining corruption. The current policy seems to follow a "principal-agent" theory: corruption occurs when a public official abuses their position for private gain. This explains why the whisky for the customs clerk (a public official) is banned, while the same for a private manager isn't—because the latter involves no public trust violation. It also justifies treating gifts to officials' families as bribes, since they could influence the official. The tolerance for small payments in some countries might stem from recognizing practical realities, but the policy overrides this by insisting on a universal ban, showing a commitment to legalistic purity. Campaign donations and lobbying are exempt because they're legal and framed as part of democratic participation, not direct quid pro quo exchanges.

  But this theory has problems. It's internally inconsistent: if corruption is about undue influence, large donations to politicians who appoint regulators could sway decisions just like a bribe, yet it's allowed. This suggests an unstated, permissive view that protects established power structures. The public-private distinction seems administrative rather than principled; why is public corruption worse if private bribery can also harm fairness? Culturally, the policy is parochial—it treats gift-giving in some societies as deviant rather than a different social fabric, imposing a Western, individualistic norm. Rival accounts, like a "harm-based" theory focusing on unfair outcomes regardless of public/private lines, or an "institutional" theory that considers cultural context, are quietly ruled out.

  The strongest alternative is a universal harm-based theory: corruption is any practice that creates unfair advantage or subverts merit-based processes, irrespective of the recipient's sector or local customs. This would force big changes to the rulebook: ban all gifts that could influence decisions, including in the private sector; prohibit facilitation payments everywhere; treat campaign donations as potentially corrupt if they create access or influence; and allow culturally embedded gifts only if proven non-influential. This approach is more coherent because it targets the core harm—undue influence—consistently across contexts.

  I need to structure my response as a numbered list of exactly five items, each one or two sentences, with no intro or conclusion. I'll cover: 1) the presupposed theory, 2) what it rules out and its consistency, 3) the public-private line and cultural parochialism, 4) the strongest alternative, and 5) concrete changes to the rulebook. I'll be definite, as instructed.
answer: |-
  1.  Your apparatus presupposes a **principal-agent legalist theory**, defining corruption solely as the abuse of *public* office for *private* gain as prohibited by *written law* or international conventions, prioritizing the official's status and the payment's formal designation over actual influence or context.
  2.  This view rules out rival accounts: a *harm-based theory* (focusing on unfair advantage/distortion regardless of recipient), an *institutional theory* (considering systemic effects on trust or development), and a *cultural particularist view* (recognizing legitimate non-instrumental gift economies), revealing internal inconsistency as campaign donations/lobbying (creating private gain via public access/influence) are exempted based on legal formalism and an unstated acceptance of elite political exchange norms.
  3.  The public-private line is primarily *administrative and jurisdictional* (driven by legal definitions and enforcement boundaries), not deeply principled regarding harm; the theory is profoundly *parochial*, mistaking Western bureaucratic norms for universal morality and dismissing non-Western particularistic gift exchange as inherently corrupt deviation rather than alternative social constitution.
  4.  The strongest alternative is a **universal harm-based theory**, defining corruption as *any* practice (public or private, legal or illegal, monetary or non-monetary) that creates unfair advantage, distorts decision-making, or subverts merit-based processes for illegitimate private gain, demanding consistency based on effect rather than recipient status or local legal tolerance.
  5.  Adopting this harm-based view would require: (a) banning *all* gifts/benefits (including private sector hospitality) intended to influence decisions; (b) prohibiting *all* facilitation payments universally; (c) treating campaign donations/lobbying hiring as potentially corrupt if creating undue access/influence; (d) allowing culturally embedded gifts *only* if demonstrably non-influential, reciprocal, and of minimal value within *that* specific social context.
