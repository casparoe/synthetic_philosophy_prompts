prompt: |-
  I'm putting together a case for a metaethics seminar. Everyone knows the standard move: cross-cultural variation in folk moral judgment — WEIRD samples vs. small-scale societies, all that — is supposed to be evidence for relativism and awkward for the realist. I want a case that runs the other way, the variation pushes toward realism and leaves the relativist looking bad. No fair claiming the disagreement is merely verbal, and no fair making one side just factually confused or flatly inconsistent.

  Specs. Realistic fieldwork setting — an ethnographer, an NGO worker, a health regulator, something like that, not a science-fiction setup. Two communities whose folk morality differs in a way that shows up in what people actually do to each other, not just in what they'd say on a questionnaire. And here's the part I care about: the objectivist should end up being the one who has to hold back and defer to the locals, while the relativist ends up being the one who gets to call the local practice wrong. That's the opposite of the usual pairing and I want to see whether it can be done honestly. Stipulate the empirical pattern yourself — dont cite anything, I don't need a literature review — but make it something a real fieldworker could plausibly come back and report.

  Then do the walkthrough: what the relativist is committed to saying about what the outsider should do, what the objectivist says, and what a third view of your choosing says, and why each lands where it does. Tell me which single feature of the case is doing the work, what happens to the case if I delete that feature, and how a relativist would go about defusing the whole thing. Be upfront about which parts of this are settled and which are genuinely contested among people who work on it — don't hand me your preferred reading of relativism dressed up as the consensus.
reasoning: |-
  Okay, the user is putting together a case for a metaethics seminar. They want to challenge the common argument that cross-cultural moral variation supports relativism and undermines realism. Specifically, they want a scenario where variation pushes toward realism instead, and the relativist ends up criticizing local practices while the objectivist defers. 

  The user is likely a grad student or early-career academic in philosophy. They're frustrated with predictable seminar debates and want something fresh that flips the usual script. Their unspoken need might be pedagogical—they want a case that forces students to question assumptions, not just rehearse standard positions. The "honestly" comment suggests they've seen too many strawman setups.

  Hmm, the constraints are tight: realistic fieldwork (no sci-fi), actual behavioral differences (not just attitudes), and the role-reversal where realists defer and relativists condemn. The killer requirement is making relativism the "activist" position. That's counterintuitive since relativists usually preach tolerance. Need a case where moral facts would demand non-interference while relativism licenses intervention.

  Brainstorming... Honor killings? Too charged, and objectivists might condemn too. Resource distribution? Too abstract. Ah—geronticide under scarcity conditions. The Waorani and Tiv examples fit: both practice(d) selective non-care of elders, but for different reasons. The key is making one society's practice clearly adaptive survival calculus (Waorani) and the other's clearly oppressive (Tiv). 

  The switcheroo works because: 
  - Realists see Waorani practice as morally required given their circumstances (ought implies can), so outsiders must defer. 
  - But for the Tiv, relativists must condemn because the oppression contradicts the society's own moral framework—it's immanent critique, not external imposition. 

  Crucially, the relativist can't retreat to "it's just their custom" because the Tiv elders' protests show internal dissent. Realists get off the hook because material constraints excuse the Waorani but not the Tiv. The hinge is whether the practice violates internal standards. If I remove that—say, if all Tiv happily endorsed elder neglect—the relativist would have to tolerate it, and the case collapses.

  For the third view, error theory fits: everyone's wrong, but the NGO should still intervene pragmatically. That highlights how the realist/relativist debate isn't just theoretical—it changes what you do. 

  User will push back on whether realism can really accommodate the Waorani case. That's the contested bit: Do objective reasons shrink under scarcity? Railton-style naturalists say yes; inflexible deontologists say no. Should flag that. Also, relativists might counter that the Tiv elders' dissent just means it's not consensus-based relativism—but most contemporary relativists allow for internal pluralism anyway.
answer: |-
  Here’s a fieldwork case designed to flip the script, with a step-by-step analysis. The core move turns on **whether a practice violates a society’s *own* moral framework**, forcing relativists into activism and objectivists into restraint.

  ---

  **The Case: Geronticide and Social Obligation**  
  *Setting:* A health NGO worker in two distinct communities:  
  1.  **The Tivara:** A pastoralist group facing severe drought. Their moral framework emphasizes *ancestral continuity* and *debt to elders*. Elders are seen as vital spiritual links. Yet during droughts, they practice *voluntary* "sitting" — elders withdraw to sacred sites to die, freeing resources for the young. Elders frame this as fulfilling their duty; families mourn but accept it as necessary sacrifice.  
  2.  **The Nalani:** A stratified agrarian society. Their morality centers on *filial piety* and *care for elders* as repayment for upbringing. However, impoverished families discreetly abandon elders deemed "non-contributing" in remote areas. Elders protest this as betrayal; families express shame but cite economic desperation. The practice violates explicit communal norms.  

  *Empirical Pattern:*  
  - Both societies practice non-care leading to elder death.  
  - **Tivara:** Practice coheres with their moral framework (duty, sacrifice, voluntarism). Consensus exists.  
  - **Nalani:** Practice contradicts their moral framework (piety, care). It’s clandestine, protested by victims, and rationalized as failure under duress.  

  ---

  **Walkthrough: What Each View Must Say**  

  1.  **Moral Relativist (e.g., Culture-Dependent Truths):**  
      - **Tivara:** "Sitting" is *morally right for the Tivara*. It aligns with their values and functions adaptively. The NGO worker **must not interfere** — doing so imposes external values.  
      - **Nalani:** Abandonment is *morally wrong for the Nalani*. It violates their own core principles and exploits vulnerable members. The NGO worker **should intervene** (e.g., supporting elder shelters, condemning the practice locally) to uphold *Nalani morality itself*.  
      - *Why?* Relativism ties truth to societal frameworks. When a practice violates its *own* framework, it is locally wrong. Relativism becomes activist to enforce internal consistency.  

  2.  **Moral Objectivist (e.g., Natural Law or Universal Welfare):**  
      - **Tivara:** Objectively, hastening death is wrong. *However*, the practice may be *excusable* under dire scarcity. The NGO worker **should prioritize aid (food/water) over condemnation**, as material conditions, not moral error, drive the practice.  
      - **Nalani:** Abandonment is objectively wrong. But the cause is poverty and weak institutions, not nihilism. The NGO worker **should address root causes (poverty, lack of elder care systems)**, not condemn local morality.  
      - *Why?* Objectivism sees universal wrongs but recognizes that non-ideal conditions limit moral agency. Blaming locals misdiagnoses the problem (material/structural failure). Restraint is pragmatic and just.  

  3.  **Third View: Error Theory (Moral Nihilism):**  
      - Both practices reflect non-moral facts: biological scarcity (Tivara) and economic inequality (Nalani). "Duty" and "piety" are fictions. The NGO worker **should ignore moral language entirely**, acting only on *welfare outcomes* (e.g., reducing suffering via aid).  
      - *Why?* If morality is always false, responses must be purely consequentialist. Local frameworks are irrelevant except as behavioral predictors.  

  ---

  **The Crucial Feature & Its Function**  
  - **The Key Feature:** *Whether the practice violates the society’s own explicit moral commitments.*  
  - **Why It Works:**  
    - For relativists, moral truth is internal to a framework. Violating that framework is *locally immoral*, demanding "correction" (activism).  
    - For objectivists, universal wrongs exist, but material constraints *mitigate blame*. Fixing conditions, not judging agents, is primary (restraint).  
  - **If Removed:** If both practices cohered with local frameworks (e.g., Nalani elders *endorsed* abandonment), the relativist would have no grounds to object. The flip collapses; relativism reverts to non-interference.  

  ---

  **How a Relativist Defuses the Case**  
  A relativist could argue:  
  1.  **"Not True Relativism":** Insist relativism only applies to *ideal* or *consensus* norms, not practices under duress. The Nalani’s *real* morality is what they *do* (abandonment), not what they *say* (piety). But this risks collapsing into "might makes right" or behaviorism.  
  2.  **"No Outsider Epistemic Access":** Claim an NGO worker cannot *know* if Nalani elders’ protests reflect "true" local morality. But this makes relativism vacuously unactionable.  
  3.  **"Meta-Relativism":** Argue that "violating one’s own framework" is itself a context-dependent judgment. But this invites infinite regress.  
  *Contested Point:* Whether relativism can coherently demand internal consistency without smuggling in objectivism. Critics (e.g., Gowans) see this as fatal; relativists (e.g., Velleman) argue it’s immanent critique.  

  ---

  **Settled vs. Contested**  
  - **Settled:**  
    - Objectivists must acknowledge non-ideal conditions excusing wrongdoing.  
    - Relativists must condemn practices violating local frameworks *if* they accept internal consistency.  
  - **Contested:**  
    - *Whether objectivism can plausibly excuse Tivara practice* (e.g., does "ought imply can" cover geronticide?). Deontologists may reject this; consequentialists accept.  
    - *Whether the relativist’s "internal critique" is coherent.* Many (e.g., Boghossian) argue it requires objective norms of logic or rationality.  
    - *Whether the NGO worker’s role biases the case.* Relativists might argue intervention always imposes power, but this struggles with victim appeals (e.g., Nalani elders).  

  --- 

  **Conclusion**  
  This case exploits the **internal inconsistency of a practice within its own moral framework** to force relativism into activism and objectivism into pragmatic restraint. It works by showing that relativism, when taken seriously, can demand *more* intervention than realism in cases of local hypocrisy or victimization. The relativist’s best defense is to deny that societies have coherent "frameworks" to violate—but this risks reducing their view to a description of chaos, not a normative alternative.
