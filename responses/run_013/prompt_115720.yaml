answer: |-
  My central claim is that post-training, the *phenomenal character* of the glorp/non-glorp experience genuinely differs for the subjects, directly shaped by their acquired concept. When they report the surfaces "look different," this is a sincere report of a new sensory immediacy, not merely a shift in judgment or attention deployment.

  You demand independent, non-question-begging evidence to distinguish content-change from attention/judgment-change. I reject the premise that such evidence is unavailable or that the distinction collapses. Consider: *post-training discrimination is fast, effortless, and persists under conditions designed to minimize cognitive load or strategic responding*. If the change were merely attentional filtering or a loosened response criterion, we'd expect performance to degrade under divided attention tasks or exhibit characteristic errors (like rising false positives). Robust, automatic discrimination under such constraints suggests the difference is presented in perception itself. 

  Furthermore, the skeptic's demand sets an impossibly high bar, implying phenomenal character is forever locked behind an unbreachable veil, inferable only through behavior we then declare insufficient. This leads to skepticism about *any* report of phenomenal character. Why accept "red looks different from green" but deny "glorp looks different from non-glorp" when both rest on similar behavioral and report-based grounds? The acquired *immediacy* and *sensory salience* reported post-training mirrors the phenomenology of learning other perceptual discriminations (e.g., wine tasting, bird identification), where we readily accept cognitive shaping of experience.

  Your objection ultimately forces a false choice. I do not "give up" the need for evidence distinguishing content-change; I contend the *totality* of evidence – confident, rapid discrimination paired with spontaneous phenomenal reports under conditions minimizing deliberation – best supports the interpretation of changed perceptual content. The skeptic must posit elaborate, unobserved cognitive intermediaries (attention shifts *plus* judgment *plus* criterion shifts *plus* false phenomenal reports) to explain the same data, violating parsimony. The burden is on the skeptic to demonstrate why this specific case, exhibiting classic markers of perceptual learning, should *not* count as cognitive penetration. The work "content" does is to mark this specific, direct impact on the *presentational* aspect of experience, not downstream processing. Without this distinction, we lose the vocabulary to describe how learning genuinely alters our perceptual world, not just our thoughts about it.
