  Right, I need to tackle this head-on. First, I should firmly assert that the post-training reports do indicate genuine phenomenal change. Then address the skeptic's objection by pointing to the immediacy and persistence of the effect—it's not just confidence or labeling. The key move is to argue that the skeptic's position leads to an infinite regress: they'd have to explain away every phenomenal report as something else.

