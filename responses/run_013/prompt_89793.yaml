prompt: |-
  I'm a first-year PhD student in a behavioural lab, and I've got a question that started out as a stats question and has turned into something more like a philosophy one, so I'm hoping you can act as someone who knows both the formal epistemology and the statistics literature and help me get the concept straight before I embarrass myself in a reading group. Here's what set it off. My supervisor told me to randomize the animals into the two conditions, and when I asked why that's enough, she said: once you've randomized, you can just go ahead and treat the groups as the same in every respect except the treatment. Which obviously isn't true — with eight animals a side the groups will differ in a hundred measured and unmeasured ways. What the randomization actually buys you isn't equality, it's a licence to reason *as if* the thing I didn't measure is independent of the thing I did assign. And once I saw it that way I started noticing the same move everywhere. In my undergrad physics labs we just assumed the errors on repeated measurements were independent and nobody ever argued for it. When I shuffle a deck I treat the deal as independent of the shuffle, as if the order were unrelated to anything about me or the table. Someone in my reading group said that a suspicious-looking coincidence in a dataset isn't evidence of fraud, because you'd have been equally suspicious of a thousand other coincidences. Same shape every time: I have no reason to think these two things are related, therefore I'll treat them as unrelated, and then build everything else on top of that default.

  What I can't figure out is what that default actually *is*, and whether it has a name of its own. I've come across the principle of indifference and the maximum-entropy thing, and they feel adjacent but not the same — indifference is about spreading probability over possibilities I've already listed, whereas this is about a relation between two variables, and the entropy rule seems to want me to already know what the constraints are before it can say anything. I've also seen people shrug and call it just an independence assumption, but that's a description, not a theory: it doesn't tell me when the assumption is earned and when it's a computational shortcut that happens to be convenient. Randomizing the animals feels earned in a way that "eh, the errors are probably independent" doesn't, and I can't articulate why, and that bugs me.

  So here's what I'd like, and please don't just hand me a label and stop. Start by brainstorming the candidate concepts that could be doing this work — anything from statistics, formal epistemology, information theory, the philosophy of probability, causal inference — then tell me which one, if any, is the real match, and where each candidate breaks down against what I've described. I care much more about the carving than the name. Specifically: is there an established concept for the move of treating absence of evidence of a dependence as a licence to assume independence? How exactly does it differ from the principle of indifference, from maximum entropy, and from the ordinary practice of assuming independence because the math is otherwise intractable? Is there any formalisation in which it comes out as a theorem rather than a heuristic, and if so what does the theorem actually say, and what does it assume? What separates the cases where the presumption is licensed — symmetry, explicit randomisation, a physical argument that the process is chaotic enough that no exploitable correlation survives — from the cases where it's just wishful thinking dressed up as a prior? And where are the edges: is assuming that the digits of some specific number will pass a randomness test the same move or a different one, and is the coincidence / look-elsewhere point the same thing or just a cousin? I'd honestly rather have an answer that says it's a family of related things than a confident single term that papers over the differences. Thanks in advance — I've been going back and forth with my supervisor about this and she keeps saying its just Bayesianism, which I don't think is quite it.
reasoning: |-
  Okay, this is a deep and beautifully articulated question from a first-year PhD student. They're wrestling with the philosophical underpinnings of what seems like a simple statistical practice - assuming independence or "no relation" between variables when there's no evidence to the contrary. 

  The core tension they're describing resonates with me - on one hand, randomization in experiments feels justified, while assuming measurement errors are independent feels more like a useful convention. They've already rejected superficial answers like "it's just Bayesianism" and want a nuanced taxonomy of concepts. 

  Let me unpack their examples first: animal randomization creates actual physical independence through the experimental design, while the physics lab's error independence is a modeling assumption based on instrument properties. The card shuffle relies on symmetry arguments, and the look-elsewhere effect is about multiple testing corrections. These are all cousins but not identical.

  The key distinctions they're seeking are between:
  - Epistemic vs physical independence
  - Designed vs assumed independence
  - Theorem-backed vs heuristic applications

  For the animal experiment, randomization provides a formal guarantee: under repeated trials, the p-value distribution is uniform when null is true. That's Neyman-Pearson orthodoxy. But the student is right - for any single experiment with small n, groups aren't truly "identical". 

  The maximum entropy connection is insightful but incomplete. MaxEnt would say: given only marginal distributions, the least informative joint distribution is independent. But here we often don't even have marginals - we're making a default position before seeing data.

  Where this gets philosophically spicy is the leap from "I don't know of dependence" to "I'll assume independence". De Finetti's exchangeability handles some cases - if we believe the animals are permutable before treatment, that implies identical distributions. But exchangeability is weaker than independence.

  For the physics lab errors, there's often an implicit ergodic principle: over many trials, time-averages equal ensemble averages. But that's itself an assumption. The card shuffle relies on dynamical systems - sensitive dependence makes prediction impossible.

  The look-elsewhere effect is different - it's about adjusting for selection bias when you cherry-pick surprising patterns post-hoc. The independence assumption there is in the null hypothesis.

  What unifies these? Perhaps what they share is a warrant to ignore possible dependencies either by design (randomization), by physical argument (chaotic systems), or by modeling convention (i.i.d. errors). But the "warrant" has very different strengths in each case.

  For formal results, the randomization inference framework makes no modeling assumptions - the randomization itself generates the reference distribution. That's about as theorem-backed as it gets. Whereas assuming digit sequences are random is pure ungrounded indifference unless we have a generating process.

  This student deserves serious engagement. I'll need to carefully distinguish:
  1. When independence is physically imposed (randomization)
  2. When it's the maxent default
  3. When it's an exchangeability judgment
  4. When it's a causal separability assumption
  5. When it's a pragmatic modeling choice

  And crucially - the difference between knowing dependence is absent versus not knowing whether it exists. The former licenses independence; the latter might only license not assuming dependence, which isn't the same thing.
answer: |-
  What a wonderfully sharp question – you've hit on a foundational tension that runs through statistics, epistemology, and causal inference. Your supervisor isn't *wrong* that Bayesianism touches this, but it's like calling a symphony "just sound waves." Let's dissect the anatomy of this "default to independence" move. It's not one concept; it's a constellation of related but distinct warrants for independence assumptions, each with its own justification and scope.

  ### Candidate Concepts & How They Map (and Break) Against Your Cases
  I'll break this down by the *type of warrant* for independence, showing where each fits your examples and where it frays.

  1.  **Physical Randomization as a Causal Warrant:**
      *   **What it is:** Actively manipulating the world (e.g., flipping a coin to assign animals) to physically *break* potential causal pathways between pre-existing confounders (measured or unmeasured) and the assignment mechanism.
      *   **Your Example:** Animal randomization. This is the strongest warrant.
      *   **The Theorem (Neyman-Rubin Causal Model / Fisherian Randomization Inference):** Under the sharp null hypothesis (no effect for any unit), randomization *guarantees* that any assignment is equally likely. The *only* systematic difference *caused by the design* is the treatment itself. The groups *will* differ, but those differences are randomly distributed, allowing valid inference about the *average* treatment effect via the randomization distribution (e.g., permutation tests). It doesn't assume groups are identical; it creates a known probability mechanism.
      *   **Why it feels "earned":** It's an *active intervention* in the world, not just a mental assumption. It leverages physical symmetry/chaos (fair coin, RNG).
      *   **Limits:** Small N (like your n=8) means random imbalances *can* happen. It only justifies independence *from the assignment mechanism*, not necessarily from post-assignment processes. Doesn't guarantee the groups are comparable on *future* variables affected by treatment.
      *   **Difference from Indifference/MaxEnt:** This is *physical manipulation*, not a logical principle. It creates the independence, it doesn't just assume it.

  2.  **Symmetry/Exchangeability as a Logical Warrant:**
      *   **What it is:** Judging that units (or trials) are indistinguishable *in all relevant aspects* prior to the intervention or observation related to the variable of interest. This licenses treating their order or assignment as arbitrary.
      *   **Your Examples:**
          *   **Card Shuffle:** The physical act + belief that cards/surface don't systematically bias specific orders licenses treating the deal as independent of the shuffle. Symmetry of the cards and chaotic dynamics justify exchangeability.
          *   **Physics Lab Errors:** Assuming repeated measurements under "identical conditions" implies the errors are exchangeable. If you further believe there's no systematic drift or memory *and* conditions are truly stable, exchangeability strengthens to independence (i.i.d.).
      *   **The Formalization (de Finetti's Theorem):** In Bayesian terms, if a sequence is *exchangeable* (joint distribution invariant to permutation), then it can be represented *as if* it were i.i.d. given some latent parameter. This is a deep theorem linking subjective judgment of symmetry to a powerful statistical representation.
      *   **Why it feels "earned" (sometimes):** It relies on a plausible physical judgment of symmetry or replicability of conditions. It feels less earned if the symmetry judgment is shaky (e.g., measuring a volatile system).
      *   **Limits:** Requires a strong subjective judgment ("relevant aspects"). Doesn't magically create independence; it *is* the assumption of symmetry. Justifies "as if" independence, not necessarily physical independence. Breaks down if symmetry is violated (e.g., cards marked, instrument drifts).
      *   **Difference from Indifference/MaxEnt:** Exchangeability is about *permutation symmetry* of a sequence. Indifference spreads probability over predefined states; MaxEnt maximizes uncertainty given constraints. Exchangeability justifies the *i.i.d.* structure itself as a consequence of symmetry.

  3.  **Maximum Entropy (MaxEnt) as a Default Modeling Warrant:**
      *   **What it is:** When specifying a joint distribution given only knowledge of marginals or other low-order constraints, the MaxEnt distribution is the *least informative* (most uncertain) one satisfying those constraints. Crucially, **if you only know the marginals, MaxEnt gives you independence.**
      *   **Your Examples:** This is the closest formal match to the *generalized license* you seek ("absence of evidence of dependence -> assume independence"). It explicitly codifies "assume independence unless forced otherwise by constraints."
      *   **The Formalization:** Given constraints E[f_i(X)] = c_i, the distribution P(X) maximizing entropy H(P) = -∑ P(x) log P(x) is chosen. With *no constraints* except normalization, MaxEnt gives uniform. With *only* marginal constraints (e.g., E[X], E[Y]), MaxEnt gives independence P(X,Y) = P(X)P(Y).
      *   **Why it feels like a "default license":** It directly operationalizes "assume as little as possible beyond what you know." Absence of evidence *for dependence* (in the form of constraints forcing correlation) implies independence.
      *   **Limits:** This is purely *epistemic* and *modeling*. It doesn't guarantee the world *is* independent; it tells you what *model* to use given your ignorance. It depends *entirely* on what constraints you include. If you miss a crucial constraint forcing dependence, MaxEnt gives independence *incorrectly*. It requires defining the sample space precisely.
      *   **Difference from Indifference/Exchangeability/Randomization:** MaxEnt is a *rule for choosing a distribution given partial information*. Indifference is a special case (uniform = MaxEnt with *no* constraints). Exchangeability is a symmetry judgment that *could* be the input constraint. Randomization physically enforces independence, MaxEnt models ignorance as independence.

  4.  **The Computational/Pragmatic Warrant:**
      *   **What it is:** Assuming independence because the math is tractable and the alternative is computationally infeasible or requires unattainable data, often accompanied by a hope/claim that violations won't ruin the inference.
      *   **Your Examples:** "Eh, the errors are probably independent" in physics labs (often justified post-hoc by residual checks). Many machine learning models (Naive Bayes being the poster child).
      *   **No Formal Theorem:** This is heuristic. Justification is often asymptotic ("it washes out with enough data") or robustness ("my estimator is insensitive to mild dependence").
      *   **Why it feels "unearned":** It lacks a strong physical, causal, or epistemic foundation. It's a concession to practicality. It risks being "wishful thinking dressed up as a prior."
      *   **Separation from Licensed Cases:** The key difference is the *justification*. Randomization has a design-based guarantee. Exchangeability has a symmetry argument. MaxEnt has a principled ignorance argument. This has "it's too hard otherwise." Validation is often post-hoc (e.g., residual plots).
      *   **Edge Cases:** If you have strong empirical evidence the assumption *holds* (e.g., years of validating a specific instrument), it might graduate towards a physical warrant.

  5.  **The Look-Elsewhere Effect / Multiple Testing Correction:**
      *   **What it is:** This is about *interpreting surprising outcomes* post-hoc, specifically addressing the fallacy of conditioning on an event *after* noticing it's surprising. It argues that the *probability of observing some "suspicious" event* is high under the null, even if the probability of observing *that specific* event is low, because there are many possible events that *would have* looked suspicious.
      *   **Your Example:** The reading group comment on coincidences not being evidence of fraud.
      *   **Formalization:** It relies on defining a "test statistic" T or a "region of surprise" S *before* seeing the data, or carefully accounting for the *size of the space* of potential coincidences. Under the null hypothesis (often involving independence assumptions!), the probability that T exceeds some threshold, or that *any* outcome in S occurs, is calculated.
      *   **Relation to Independence:** The independence assumption (e.g., i.i.d. data) is *part of the null model* used to calculate the probability of seeing *a* coincidence. The "look-elsewhere" argument points out that the event space defined by "something suspicious" is large under that null model *because* of independence/replication. It's a *consequence* of assuming independence in the null, used to defend *against* over-interpreting chance fluctuations *under that null*.
      *   **Is it the same move?** No. It's downstream. The core "default to independence" move (via randomization, exchangeability, MaxEnt, or pragmatism) is used to *construct* the null model. The look-elsewhere effect is an argument about *interpreting events* generated by a model that *already assumes* independence (or some specific structure). It's a cousin, reliant on the independence assumption being in place for its calculation, but focused on the multiple comparisons problem.

  ### Addressing Your Specific Queries

  *   **The "Default License" Name:** There isn't one perfect term. **"Presumptive Independence"** captures the spirit well. **"Default Independence under Ignorance"** is descriptive. Philosophically, **"Epistemic Independence as a Null Model"** fits. MaxEnt provides the clearest *formalization* of this license for joint distributions given only marginals. Randomization provides the strongest *physical* license.
  *   **vs. Principle of Indifference (PoI):** PoI spreads probability uniformly over mutually exclusive, exhaustive possibilities *you've already defined*. "Presumptive Independence" is about the *structure* (independence) between variables *within* your possibility space. PoI might tell you P(Card1=Ace) = 1/52. Presumptive Independence tells you P(Card1=Ace ∩ Card2=King) = P(Card1=Ace)P(Card2=King) *if you lack constraints forcing dependence*. MaxEnt subsumes PoI (uniform is MaxEnt with no constraints) and extends to the independence case.
  *   **vs. MaxEnt:** As above, MaxEnt *is* the primary formalization for the "absence of evidence for dependence -> independence" move *when specifying joint distributions given marginal constraints*. Without marginal constraints, MaxEnt reduces to PoI/uniformity.
  *   **vs. "Math is Intractable" Pragmatism:** The key difference is *justification*. Presumptive Independence via MaxEnt/Randomization/Exchangeability has a principled basis (modeling ignorance, physical design, logical symmetry). Pragmatism lacks this principled foundation and risks being ungrounded.
  *   **Formal Theorems:**
      *   **Randomization:** Neyman-Rubin/Fisher: Randomization ensures unbiased estimation of ATE (Neyman) or creates a valid permutation test reference distribution (Fisher) under the null.
      *   **Exchangeability:** de Finetti's Theorem: Exchangeable sequences are mixtures of i.i.d. sequences.
      *   **MaxEnt:** Theorems show it's the unique distribution satisfying certain consistency axioms (e.g., updating, system independence) when maximizing entropy under constraints.
  *   **What Separates Licensed vs. Wishful Thinking:**
      1.  **Source of Warrant:** Physical manipulation (Randomization) > Plausible physical/logical symmetry (Exchangeability) > Principled modeling of ignorance (MaxEnt) > Computational necessity / hope (Pragmatism).
      2.  **Testability:** Licensed warrants often allow *testing* the assumption *later* (e.g., balance checks post-randomization, residual diagnostics after i.i.d. assumption). Wishful thinking often avoids or dismisses such checks.
      3.  **Robustness:** Licensed warrants often come with known robustness properties or sensitivity analyses. Wishful thinking often lacks this.
      4.  **Transparency:** Licensed warrants explicitly state their basis (design, symmetry, MaxEnt principle). Wishful thinking is often implicit or hand-wavy.
  *   **The Digits of Pi Test:**
      *   **Is it the same move?** Not quite. Assuming Pi's digits *are* i.i.d. uniform is a *physical/mathematical conjecture* about a specific process (the mathematical constant Pi). Applying a randomness test *to check this conjecture* is standard statistics. The "presumptive independence" move here is subtle: *Before knowing Pi*, if you have *no information* about its digit sequence and apply MaxEnt over all possible digit sequences given only that it's irrational (a very weak constraint), you might start with i.i.d. uniform digits as your "ignorance" prior. But this prior would be quickly overwhelmed by the mathematical evidence that Pi *is* a specific, fixed sequence. The warrant for testing it is the conjecture itself, not a general epistemic license. The look-elsewhere effect applies *if* you scan Pi for *any* pattern and find one post-hoc.
  *   **Coincidence / Look-Elsewhere:** As discussed, it's a consequence or application *within* a model that already assumes independence (or a specific structure), focused on avoiding selection bias. It's a distinct but related concept.

  ### Synthesis: The Family Resemblance

  You're absolutely right to see a family resemblance rather than a single concept. The core thread is **treating ignorance of dependence as a license to assume independence as a starting point.** How strong that license is depends on the justification:

  1.  **Causal/Physical License (Gold Standard):** Earned by *design* (Randomization). Independence is physically enforced.
  2.  **Symmetry License (Strong):** Earned by plausible *judgment of irrelevance* (Exchangeability). Independence is a consequence of symmetry.
  3.  **Epistemic/Modeling License (Principled Default):** Earned by the *principle of maximum entropy*. Independence is the model of maximum ignorance given known marginals.
  4.  **Pragmatic License (Necessary Evil):** Justified by *tractability*, often with caveats. Independence is an assumption for computational convenience.
  5.  **Downstream Application:** The look-elsewhere effect is a *defense* against misinterpreting chance events *under a model* (often) built using one of the above licenses.

  **Why it's not "just Bayesianism":** Bayesianism provides the *framework* (priors, posteriors, updating). Exchangeability and MaxEnt are powerful tools *within* Bayesianism for setting priors that encode symmetry or ignorance. Randomization provides a design-based *frequentist* justification. Pragmatism exists in both paradigms. The "default license" is about *how you justify a specific structural assumption (independence) within your chosen framework*. Your supervisor is right that Bayesian tools handle this well (via exchangeability/MaxEnt priors), but the *justification* for those priors draws on the extra-Bayesian concepts above (physical design, symmetry, ignorance principles).

  Your instinct to carve carefully is spot on. Recognizing whether you're relying on a physical warrant (randomization), a symmetry warrant (exchangeability), an ignorance warrant (MaxEnt), or a computational shortcut is crucial for understanding the strength of your inference and its potential vulnerabilities. Keep wielding that philosophical scalpel – it makes for better science.
