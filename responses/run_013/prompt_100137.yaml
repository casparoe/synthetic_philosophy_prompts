prompt: |-
  The early-2000s push to kill the US federal estate tax — the death-tax campaign — phased the tax down and briefly out before Congress put it back. I want that episode run through the equal-opportunity case for taxing inheritance, not the usual policy scrap. Take the domain's core claim as this: fair equality of opportunity is about the starting gate, and inheritance is the one transfer that moves the starting gate itself. So what does that predict about the repeal — who gains, and what happens to the spread of life-chances rather than just incomes? Then the design question the theory usually ducks: if the point really is the starting gate, is a tax on the donor's transfer or on the recipient's receipt the better instrument, and does that answer change depending on whether you index opportunity to what a kid has at birth versus what she's handed at thirty? Then flip it. The repeal side won with a story about double taxation and family farms — does the theory explain why that story landed, or does it just get outclassed by it rhetorically? And what does the episode do to the theory itself: is inheritance taxation actually required by equal opportunity, or does the argument quietly turn into a claim about what parents may do for their children, which is a different argument with a different answer? Reason it through, dont cite anything.
