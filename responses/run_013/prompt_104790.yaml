  Then there's Cleanthes' move to suggest the universe as the necessary being. This shifts the burden back to the theist. If conceivability of non-existence is the test, then God also fails, making it a tu quoque. The user questions if this is consistent. Cleanthes uses the same criterion against both, but the theist might argue God’s necessity is different. However, Hume’s point is that both are equally conceivable as non-existent, so neither can be logically necessary. This highlights a double standard if the theist exempts God.

