answer: |-
  You've pinpointed the exact tensions in Hume's text and your friend's claim. Let's dissect the exchange in Part IX, staying close to the wording and its implications:

  **1. Demea's Argument: Temporal or Modal/Sufficient Reason?**
  Demea's argument here is **explicitly a modal/sufficient reason argument, *not* a temporal "beginning" argument.** The textual evidence is clear:
  *   **Premise:** "Whatever exists, *must have a cause or reason* of its existence..." He grounds this in the impossibility of self-creation ("absolutely impossible for any thing to produce itself"). This focuses on the *explanation* for existence, not temporal origin. "Cause" here is used synonymously with "reason" in the sense of a *sufficient explanation*.
  *   **The Dilemma:** He presents two options: "an infinite succession" of causes/reasons or "some ultimate cause, that is *necessarily existent*." Crucially, his objection to the infinite succession is *not* that it had a beginning, but that "*the whole...chain or succession, taken together*...wants a reason" (emphasis added). The problem is the *explanatory insufficiency* of the entire collection of contingent beings, even if infinite in time. The whole chain itself, being contingent (each part depending on another), lacks an explanation for *why it exists rather than not*.
  *   **Conclusion:** He concludes with a "necessarily existent" being – a being whose existence is self-explanatory and doesn't depend on anything else. This is a being of *ontological necessity* (in the sense of explanatory independence), not necessarily *logical* necessity in the strict, demonstrable sense Cleanthes uses.

  **Verdict:** Your friend is likely **correct that this specific argument in Part IX is *not* primarily targeting a temporal cosmological argument.** Hume (through Demea) is presenting the Leibnizian-style argument from contingency and sufficient reason. Your friend's "universe began, therefore it has a cause" argument operates on different premises (temporal finitude) and a potentially different concept of "cause" (temporal antecedent). Hume *does* critique temporal causation elsewhere (e.g., Treatise, Enquiry), but Cleanthes' response here is tailored to Demea's *explanatory* regress problem and the concept of a necessarily existent being.

  **2. Cleanthes' Refutation: Does it Hit Demea's Target?**
  Cleanthes' argument is powerful but **targets a *stricter* conception of "necessary existence" than Demea likely intends, potentially leaving Demea's core claim ("the regress requires a self-explanatory being") partially untouched, though seriously wounded.** Here's the breakdown:

  *   **Cleanthes' Premise:** "Nothing is demonstrable, unless the contrary implies a contradiction." He equates "demonstrably necessary" with "logically necessary" (non-existence implies contradiction).
  *   **Cleanthes' Conceivability Principle:** "Whatever we conceive as existent, we can also conceive as non-existent." There is no being whose non-existence we cannot coherently conceive.
  *   **Cleanthes' Conclusion:** "There is no being, therefore, whose non-existence implies a contradiction. Consequently there is no being, whose existence is demonstrable." He denies that *logically* necessary existence (in the strict, demonstrable sense) applies to any being.

  **Why this might *not* fully refute Demea:**
  *   **Demea's "Necessary" vs. Cleanthes' "Demonstrable":** Demea likely means "necessarily existent" as *ontologically independent* or *self-existent* – a being whose existence is explained by its own nature, stopping the regress. He does *not* necessarily assert its existence is *logically* necessary (non-existence inconceivable) in the way Cleanthes defines it. Cleanthes shifts the meaning of "necessary" from "explanatorily fundamental" (Demea) to "logically demonstrable" (Cleanthes) and attacks the latter.
  *   **The Regress Problem Remains?** Cleanthes doesn't directly address Demea's core point: *Why does the totality of contingent beings exist?* Even if no being is *logically* necessary, Demea could argue that an *explanatorily* necessary being (one whose existence is simply a brute fact requiring no further explanation) is still required to halt the regress. Cleanthes' argument shows this being couldn't be *logically* necessary, but it doesn't *prove* such an explanatory brute fact is impossible or that the regress *can* be infinite without being explanatorily deficient.

  **Why it *does* significantly damage Demea's argument:**
  *   **Undermining the Ultimate Foundation:** Cleanthes successfully demolishes the idea that the ultimate cause/reason can be a being whose existence is *demonstrably necessary* or whose non-existence is *inconceivable*. This removes the strongest possible foundation Demea might hope for.
  *   **Exposing Ambiguity:** Cleanthes exposes the ambiguity in the term "necessary existence." If it doesn't mean logically necessary, what *does* it mean? How do we identify such a being? This weakens Demea's conclusion by making the nature of the proposed solution unclear and less secure.
  *   **Principle of Sufficient Reason (PSR) Under Fire:** While Cleanthes doesn't directly attack the PSR ("everything must have a reason"), his conceivability principle indirectly challenges it. If we can conceive of *anything*, including the universe, existing without a reason, it suggests the PSR isn't an inviolable law of thought but perhaps only a heuristic principle derived from experience (which wouldn't apply to the universe as a whole).

  **3. Cleanthes' Tu Quoque: Genuine Objection or Double Standard?**
  Cleanthes' move **is a genuine and powerful objection, not merely a tu quoque fallacy, precisely *because* he consistently applies the conceivability principle:**

  1.  **The Challenge:** "Why may not the material universe be the necessarily existent Being?" He applies the *same* conceivability test Demea implicitly relies on: we can conceive the universe existing without a cause/reason. If Demea objects that we *can* conceive the universe not existing (making it contingent), Cleanthes pounces:
  2.  **Consistent Application:** "As we can conceive it not to exist, we can equally conceive the Deity not to exist." Cleanthes uses *exactly the same criterion* ("we can conceive it not to exist") against the Deity that the theist uses against the universe. He doesn't switch standards.
  3.  **The Implication:** The conceivability of non-existence applies equally to both candidates. Therefore, *neither* can be "necessarily existent" in the strict, logically demonstrable sense Demea seems to require for his stopping point. If the theist uses conceivability of non-existence to show the universe *needs* a cause/reason, then by the *same* logic, the conceivability of God's non-existence shows *God* would need a cause/reason, leading to a further regress. **The very tool (conceivability) used to establish contingency undermines the proposed non-contingent solution.**

  **Why this isn't just tu quoque:** Cleanthes isn't merely saying "you do it too." He's demonstrating an *internal inconsistency* in the theist's application of their reasoning:
  *   **Step 1 (Theist):** We can conceive Universe not existing --> Therefore, Universe is contingent --> Needs cause/reason (God).
  *   **Step 2 (Cleanthes):** We can conceive God not existing --> Therefore, God is contingent (by the *theist's own criterion*) --> Needs cause/reason (???) --> Regress continues.
  Cleanthes exposes that the theist's criterion for contingency (conceivability of non-existence) cannot be used to identify a *genuinely non-contingent* being, because the same criterion applied to God yields the same result. It shows the argument based *solely* on conceivability cannot successfully terminate the regress it generates. The ultimate "explanation" (God) is just as susceptible to the "why?" question as the universe itself, using the theist's own principle.

  **Conclusion on Hume & Your Friend:**

  1.  **Your Friend is Partly Right:** The *specific* argument Demea gives in Part IX *is* the modal/sufficient reason argument, not the temporal one. Hume's Cleanthes is primarily targeting *that* argument. Your friend's temporal version isn't directly addressed in *this passage*.
  2.  **Cleanthes' Impact:** Cleanthes' arguments are devastating against the claim that God's existence is *logically demonstrable* or *logically necessary*. They seriously challenge the coherence and uniqueness of the concept of a "necessarily existent being" as the solution to the explanatory regress, exposing ambiguity and applying the theist's own contingency test against God. While it may not *utterly destroy* the *possibility* of an explanatory brute fact (God or universe), it removes any *logical* or *conceivability-based* justification for privileging God as that brute fact over the universe itself. The explanatory regress problem remains, but the proposed solution is shown to be vulnerable to the same logic that created the problem.
  3.  **Hume's Broader Relevance:** While Part IX focuses on the sufficient reason argument, Hume's *overall* philosophy (especially his critique of causality and induction) profoundly challenges the *epistemological foundations* of *any* cosmological argument, including the temporal one. The inference from "began to exist" to "must have a cause" relies on concepts of necessary connection and induction that Hume systematically undermines elsewhere. Your friend might claim immunity based on Part IX, but Hume's toolbox offers broader weapons against causal reasoning about ultimate origins. Cleanthes' challenge – "Why not the material universe?" – and his insistence on consistent application of principles (like conceivability) remain potent against *any* version positing a distinct necessary being.

  Your friend is correct that Part IX targets a different argument, but Cleanthes' reasoning exposes deep problems in the concepts of necessity, explanation, and conceivability that underpin *any* attempt to argue from the existence or beginning of the universe to a necessary, uncaused cause. Hume shows that such an argument cannot establish its conclusion with the logical certainty Demea seeks.
