prompt: |-
  I'm a retired marine geochemist — 35 years of sediment cores and nutrient budgets, and since I packed it in I've been reading philosophy in a fairly disorganised way, mostly decision theory and bits of ethics. I've ended up on a regional council that advises on a shared groundfish stock, and the recurring fight there is unilateral restraint: our boats could cut effort by about a fifth, the stock would very likely recover, but any skipper who does it alone just eats the loss while the other fleet cleans up. A young economist on the council keeps saying this is a prisoner's dilemma and that we should "be superrational", which sent me down a rabbit hole. As I understand it (and I'm probably mangling it) the idea — Hofstadter's, I've only read about it secondhand — is that when a situation is symmetric and the other party is the sort of agent who'd reason their way to the same answer you're reasoning your way to, you shouldn't evaluate your options by asking what's best given what they'll probably do, but by asking what happens if everyone who reasons like you makes the same choice; and that this is meant to bite in one-shot, no-reputation settings where defecting is dominant. That's not the same as "be nice", and it's not tit-for-tat in a repeated game. I half-believe it and half-think it's smuggling in a wish that the world is tidier than it is.

  What I actually want is a procedure I could run at the council table, on paper, in about twenty minutes, without a blackboard: an ordered list of questions, what counts as a good enough answer to each, where the procedure says cooperate, where it says don't, and where it stops and hands the thing back to us as a judgement call — either a values question or a question about how much we trust our own model. It has to survive contact with the ugly parts: the other side isn't a copy of me (different country's fleet, different debts, different discount rates), the set of "everyone who reasons like me" is a population I get to define and could define dishonestly, and there's a genuine chance I'm just the sucker. Please build in one or two tests I can actually apply, and be warned that I've been leaning on a crude one I call the same-recipe test — would they have picked what I'm picking if they'd followed my reasoning from the same facts? — and I suspect it's doing far too much work, that it needs splitting into seperate questions, and that I need something that catches the case where my "reasoning" is really just me wanting to feel good about cutting my catch. I'd also like the procedure to say something about the weird asymmetric case where only one side can even see the problem.

  Then run the finished procedure on three cases and give me a definite answer each time, including one where it tells me to do something I won't like: (a) our council's unilateral 20% effort cut, where the neighbouring fleet has no such council, no shared scientific advice, and a much heavier debt load; (b) an anonymous referee report — I've been asked to review a paper by someone I'm fairly sure is working the same seam as a former student of mine, and I can write a soft report that helps the author or a harsh one that helps my student's odds, and no one will ever know wich I wrote; (c) a data-sharing pledge among six labs, where five have signed and the sixth is by far the biggest, so its participation basically decides whether the whole thing works at all. And please commit: don't hand me a framework plus a list of "it depends" — pick the version of the procedure you'd actually defend, say why you chose those questions over the obvious alternatives, and be upfront about where you expect it to misfire, or where the honest answer is that the idea doesn't yet tell us what to do.
reasoning: |-
  Okay, let me tackle this marine geochemist's problem. They're dealing with a real-world prisoner's dilemma in fishery management and want a practical decision procedure. First, I need to unpack their core concerns: they need a step-by-step method that handles asymmetry, avoids self-deception, and works in messy situations. 

  Hofstadter's superrationality is their starting point, but they're rightly suspicious of its idealism. The challenge is to build something operational that doesn't gloss over real-world ugliness like different discount rates or the temptation to rationalize self-interest. Their "same-recipe test" is a good instinct but needs rigor.

  I'll structure this as a forensic checklist with hard exit points. Key innovations: 
  - Adding a "symmetric reasoning" test that forces consideration of whether the other side would genuinely follow the same logic
  - Building in asymmetry detectors that flag when superrationality breaks
  - Including a "self-deception screen" to catch values masquerading as reasoning

  For the cases: 
  (a) Fishery cut: Asymmetry (debt loads, no council) means cooperation fails—recommend against unilateral restraint. 
  (b) Peer review: Perfect symmetry—superrationality applies, demand harsh but fair review. 
  (c) Data sharing: Asymmetric power creates moral obligation beyond game theory—push for participation despite dominance.

  The procedure must ruthlessly expose when "we're not playing the same game." That's where their same-recipe test evolves from fuzzy intuition to diagnostic tool. And yes—I'll force uncomfortable answers (like torpedoing the data-sharing deal) where the math demands it.
answer: |-
  Here's a field-ready procedure for unilateral restraint dilemmas, designed for council-table execution. It builds on superrationality but forces confrontation with asymmetry and self-deception. **Bold text is the script you run aloud; normal text is your internal reasoning.**

  ---

  ### **The Forensic Cooperation Protocol**
  **(20-Minute Paper Version)**

  1.  **Define the Symmetric Core: "Assume all players have identical goals, reasoning capacity, information, and constraints. In this idealized world, what single choice (Cooperate/Defect) would every rational player make?"**
      *   *Good Answer:* Clear logical argument for one action (e.g., "Cooperate: mutual cooperation beats mutual defection"). If unclear, stop. The core symmetry is broken beyond superrational repair.
      *   *Bad Answer:* "It depends on what others do." Push back: "In this *identical* world, they *are* you. What would 'you-all' choose together?" If still stuck, proceed but note asymmetry is critical.
      *   *Exit:* If Defect is strictly dominant even here, superrationality fails. Game is hopeless without external enforcement. **Stop: Recommend Defect.**

  2.  **Asymmetry Audit: "How do real players differ from this symmetric core? (e.g., goals, information, constraints, time horizons, risk tolerance, reasoning style). Does this difference predictably change their dominant strategy?"**
      *   *Good Answer:* Concrete, specific differences (e.g., "Fleet B has 400% higher debt servicing costs; their discount rate is ~20% vs our 5%" or "Lab 6 already has all data; they gain less from sharing"). Assess if difference *flips* their rational choice.
      *   *Bad Answer:* Vague distrust ("They're greedy") or unsupported assumptions. Demand evidence.
      *   *Exit:* If asymmetry makes *their* Defect dominant regardless of your choice (e.g., high debt forces short-termism), **Stop: Recommend Defect (You're the sucker)**. If asymmetry makes *your* Cooperate irrational even if they reciprocate (rare), **Stop: Recommend Defect**.

  3.  **The Split Same-Recipe Test:**
      *   **3a. Factual Recipe: "If they had *identical information and analysis* (our stock models, cost projections), would they likely choose the same action I'm considering?"**
          *   *Good Answer:* Focus on objective facts & shared rationality (e.g., "Yes, the stock collapse model is compelling" or "No, their debt invalidates our break-even analysis").
      *   **3b. Values Recipe: "If they used *my ethical framework/values weights* (sustainability, fairness), would they choose the same action?"**
          *   *Good Answer:* Explicitly state your values driving the choice (e.g., "I value stock recovery above 2-year profit").
          *   *Self-Deception Trap:* If 3a is "No" but 3b is "Yes," your "cooperation" is likely values-pushing, not rational coordination. Flag this.
      *   *Exit:* If both 3a and 3b are "No," **Recommend Defect**. If 3a is "Yes" but 3b is "No," **Proceed** (rational basis exists). If 3a is "No" but 3b is "Yes," **Stop: This is a values plea, not game theory. Hand back for political/ethical debate.**

  4.  **Superrational Sanity Check: "If *every player who passed steps 1-3 identically* acted the same, does Cooperate yield a better outcome than Defect for all? Is this outcome stable (no incentive to cheat)?"**
      *   *Good Answer:* Clearly "Yes" for mutual cooperation payoff > mutual defection payoff in the *actual* (asymmetry-adjusted) game.
      *   *Bad Answer:* Ignoring revealed asymmetries or hoping for altruism.
      *   *Exit:* If "No," **Recommend Defect**. If "Yes," **Recommend Cooperate**. If unstable ("Yes, but cheating pays..."), **Stop: Requires enforcement/repetition. Superrationality insufficient.**

  ---

  ### **Why This Procedure?**
  *   **Forces Symmetry Check First:** Superrationality *only* applies if a symmetric core exists (Step 1). Avoids misapplying it to asymmetric traps.
  *   **Splits Same-Recipe:** Separates objective rationality (3a) from values (3b), exposing self-deception ("I'm being rational!" when it's really "I'm being nice!").
  *   **Handles Ugly Asymmetry:** Step 2 is the critical filter. High debt loads? Different data? Step 2 catches where "identical reasoning" fails. No pretending.
  *   **Builds in Self-Deception Tests:** The Values Recipe (3b) and comparing 3a/3b outcomes flag when you're rationalizing.
  *   **Explicit Exit Points:** Stops early when game theory fails, forcing value judgments or admitting futility.
  *   **Works for "Blind" Players:** If one side can't see the dilemma (e.g., no shared science), Step 2 (Asymmetry Audit) fails immediately – cooperation is irrational. Procedure catches it.

  ---

  ### **Application to Your Cases (Definite Answers)**

  **(a) Regional Council: Unilateral 20% Effort Cut**
  1.  **Symmetric Core:** Identical fleets? Cooperate (mutual restraint = stock recovery > mutual overfishing). *Proceed.*
  2.  **Asymmetry Audit:** *Critical Differences:* Neighboring fleet has no council (less trust/understanding?), much heavier debt (short-term survival >> long-term stock health), no shared advice (different facts?). High likelihood their *dominant strategy remains Defect* regardless of your action. Debt alone may force overfishing.
  3.  **Split Same-Recipe:**
      *   3a (Factual): If they had your science/models/debt levels? *Probably Cooperate.*
      *   3b (Values): If they shared your sustainability values? *Probably Cooperate.* **BUT** Debt constraints likely override values. Asymmetry dominates.
  4.  **Superrational Check:** If all "rational" fleets cooperated? Stock recovers, all win. *But* asymmetry (debt) makes cooperation unstable for them. They *must* defect.
  *   **VERDICT: RECOMMEND DEFECT (Do NOT cut unilaterally).** Asymmetry (debt, lack of institution) is fatal. You would be the sucker. *The procedure stops at Step 2/3: Asymmetry predicts their Defect is dominant and inescapable.*

  **(b) Anonymous Harsh Peer Review**
  1.  **Symmetric Core:** Identical reviewers? Cooperate (Write fair, rigorous reviews; science benefits, all gain from quality control). *Proceed.*
  2.  **Asymmetry Audit:** *Differences?* You suspect author competes with your student. But: anonymity, shared norms of science, same paper/data. No *predictable* asymmetry forcing Defect (harshness). Your bias is internal, not an external constraint.
  3.  **Split Same-Recipe:**
      *   3a (Factual): If reviewer had same paper/knowledge of competition? *Should still demand rigor.* Competition doesn't change paper's flaws/merits.
      *   3b (Values): If reviewer valued truth/rigor over loyalty? *Demand harshness if justified.* **Self-Deception Risk:** You *want* a soft report to help student. Flagged!
  4.  **Superrational Check:** If all reviewers were rigorous? Science improves, reputation system works. Stable if anonymity protects against retaliation.
  *   **VERDICT: RECOMMEND COOPERATE (Write the objectively fair, rigorous report, even if harsh).** Symmetry holds (shared role, norms, information). Bias is a values conflict (Step 3b flags it), but core rationality demands objectivity. Cooperating upholds the system.

  **(c) Data-Sharing Pledge (Big Lab Holdout)**
  1.  **Symmetric Core:** Identical labs? Cooperate (Sign; mutual data-sharing benefits all research). *Proceed.*
  2.  **Asymmetry Audit:** *Critical Difference:* Lab 6 is vastly bigger. Gains less from others' data (asymmetrical benefit), bears disproportionate cost/risk of sharing. Their *dominant strategy is likely Defect (Don't Sign)* – they win most by free-riding or keeping monopoly. Your participation is irrelevant to their calculus.
  3.  **Split Same-Recipe:**
      *   3a (Factual): If they were same size/had same needs? *Sign.*
      *   3b (Values): If they valued collective progress equally? *Sign.* **BUT** Size asymmetry fundamentally alters incentives.
  4.  **Superrational Check:** If all "rational" same-sized labs sign? Works great. *But* Lab 6 isn't in that group. For *them*, signing while small labs defect is bad; signing while small labs cooperate is worse than defecting while small labs cooperate (loses monopoly). Defect dominates.
  *   **VERDICT: RECOMMEND DEFECT (Do NOT rely on goodwill; the pledge fails without addressing asymmetry).** Superrationality fails (Step 4: Unstable due to asymmetry). **However:** This is where procedure *exits* cleanly. It tells you game theory says "Defect" is Lab 6's dominant strategy, making your pledge irrelevant. **Hand back for Judgement Call:** You must now argue on *values* (e.g., "Lab 6 has a moral duty") or *negotiate asymmetry* (e.g., offer Lab 6 reduced obligations/leadership role). The procedure exposes the game-theoretic hopelessness of a symmetric plea.

  ---

  ### **Where This Misfires & Limitations**
  *   **True Uncertainty:** If probabilities of cooperation are truly unknown (not just asymmetric incentives), the procedure struggles. Step 2 relies on *predictable* incentive shifts.
  *   **Complex Motivations:** Deep cultural/personal spite or irrational altruism might override incentives. Step 2 tries to capture this as "goals/reasoning style," but it's messy.
  *   **Defining the "Tribe":** Who counts as "reasoning like me" (Step 4)? Be ruthlessly honest. If you define it too narrowly (just your council), cooperation is likely irrational. Too broadly (everyone ever), it's naive. Base it on shared access to Steps 1-3.
  *   **Values Smuggling:** The biggest risk is misrepresenting values (Step 3b) as rational necessity. The internal "self-deception flag" is your best guard. Ask: "Would I make this choice if it *cost* me personally?".
  *   **When "Sucker" is Acceptable:** The procedure avoids the sucker's payoff. Sometimes, ethics demand accepting it (e.g., whistleblowing). The procedure flags this as a **values exit**, not a failure.

  **Why not Tit-for-Tat/Kant/etc.?** Tit-for-Tat needs repetition; this is for one-shot/undefined repetition. Kantian universality ("what if everyone did X?") is baked into Step 1 but tempered by Steps 2-3. This is *pragmatic superrationality* – using symmetry as a tool where applicable, abandoning it with clear flags where not.

  **Use it.** Run it coldly. When it says "Defect" (as in a and c), it hurts, but it tells you coordination requires changing the game (debt relief for fishermen, side-payments for the big lab), not wishful thinking. When it says "Cooperate" (as in b), it stiffens your resolve against bias. It makes the ugliness visible.
