  The core tension seems to be between Lena's impersonal valuation of continuation and Marcus's more individual-focused perspective. Lena is making a subtle point about how meaning depends on projected futures, but Marcus effectively shows problems with where to draw the line on "continuation." Neither fully addresses that meaning might be locally constituted rather than requiring actual infinite continuation.

  For my evaluation:
