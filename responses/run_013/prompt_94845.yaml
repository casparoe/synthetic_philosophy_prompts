answer: |-
  ## Persistence Pantoum

  The oak stands in the noon of its domain.
  Its shadow stretches long across the grass.
  The whole tree holds its ground through sun and rain.
  Its shadow stretches long across the grass.

  Its shadow stretches long across the grass.
  A gust now bends the branch that seeks the sky.
  (Time’s pressure leaves its mark on what must pass).
  A gust now bends the branch that *seems* the sky.

  A gust now bends the branch that held the sky.
  The wood accepts the wind’s insistent hand.
  This branch is bent by force it can't deny.
  The wood accepts the wind’s insistent hand.

  The wood accepts the wind’s insistent hand.
  The storm departs. The bough returns to view.
  This branch is straight and true upon the land.
  The storm departs. The bough returns to view.

  The storm departs. The bough returns to view.
  Is this the branch that yielded to the gale?
  The pattern holds, yet something shifts anew.
  Is this the branch that yielded? Or its trail?

  Is this the branch that yielded? Or its trail?
  The oak stands in the dusk of its domain.
  The shape persists, though details may grow pale.
  The oak stands in the dusk. The shape remains.

  ---

  **Why this works for your anthology:**

  1.  **Form as Argument:** The strict pantoum repetition embodies the core debate. Identical lines returning ("Its shadow stretches long across the grass," "The oak stands...") enact *endurantism* – the whole object, wholly present again. Lines returning with slight alterations ("bends the branch that **seeks/seems** the sky," "This branch is **bent/straight**," "noon/**dusk** of its domain") enact *perdurantism* – similar but distinct temporal parts succeeding each other.
  2.  **Temporary Intrinsics Palpable:** The central conflict arises naturally. The branch *is bent* in one stanza and *is straight* in a later stanza using the same structural position ("This branch is..."). The poem forces the question: how can the *same* thing possess contradictory properties (bent/straight) at different times, if it's wholly present both times? The tension is felt, not explained.
  3.  **Ambiguous Ending:** The final stanza leans slightly towards perdurantism through the subtle shift from "noon" to "dusk" and the introduction of "trail," suggesting a sequence. Yet, the persistence of "The oak stands" and "The shape remains" offers a counterpoint. It lands where the form pushes (perdurantism via change) but leaves the core question ("Is this the branch...? Or its trail?") unresolved, satisfyingly true to the debate.
  4.  **Accessible & Expert-Valid:** Concrete imagery (oak, shadow, branch, wind, storm) makes the concepts tangible for non-specialists. The philosophical mechanics are embedded in the structural play of repetition and alteration, recognizable to metaphysicians without didacticism.
  5.  **No Cheating:** No jargon, no names, no footnotes. The argument *is* the pattern of recurrence and modification. The length (24 lines) fits the pantoum structure naturally.
