prompt: |-
  I volunteer as curator for a small village heritage group in a county with no professional archaeological service of its own, and I need help with a decision that has split our committee.

  In 1968 a local farmer dug a shallow, stone-lined pit under what is now the car park of the village hall. The finds survive as a box of objects, some still bagged and labelled, along with his diary and a sketch plan. The pit held about forty sherds that refit into a single large storage jar; a pottery specialist who examined them says the jar was already a century or two old when it went into the ground. According to the sketch, the dog's skull was placed upright on top of the broken jar, facing along the pit's long axis. Around the jar's rim were seven iron nails, all bent, plus a whetstone worn hollow on one face and a small copper-alloy pin. The fill had two layers separated by a thin band of clean sand. The diary also mentions a second, smaller pit a metre away, which he emptied without recording anything; those finds went into the same box, so we can no longer tell which objects came from which pit. Nothing comparable has been found elsewhere in the field, which has otherwise produced only ordinary household debris.

  We are rebuilding our permanent display and the committee is deadlocked. One member is certain the pit was a shrine and the objects were offerings: careful placement, an animal head, deliberate breaking. Another is equally certain it was a rubbish pit, and that the offerings are just what happens when a household clears out an old storeroom. A third says nothing was deliberately deposited at all, and that the assemblage is what you get when objects roll into a hollow and are sorted by water and burrowing animals. The farmer's daughter, who gave us the collection, has told me she will withdraw it if we describe the pit as a rubbish dump; her father was proud of what he called his little temple.

  Two questions, and the second is the one I actually care about. First, what should the label say? Please draft me roughly ninety words of display text and tell me which reading it should lead with. Second: what makes any of these readings better than the others? I have a feeling the committee is treating the rubbish pit as the safe, boring default and the shrine as the exciting, unprovable one, but I cannot see why a claim about what people threw away is any better evidenced than a claim about what they believed. One member told me we can only ever infer what people did with their hands, never what was in their heads; another said that anything we cannot explain we end up calling ritual, which is just a way of not explaining it. Both remarks feel half-right and I cannot get them to fit together. I would also like to know whether the objects themselves can ever settle a question like this, or whether we are really arguing about something else.

  Please do not send me a reading list or references; I have no way to check them, and what I need is the reasoning. Take the role of an archaeologist with a philosopher's habits — someone who has thought hard about how we are entitled to infer belief and intention from mute objects. Before drafting anything, spend a few paragraphs laying out what each of the three readings is actually asserting and what evidence each would need in order to be true, and what each would lead us to expect that we do not find. Then tell me where the real disagreement lies, and whether the missing second pit changes anything. Finish with the label text and a short paragraph I can read aloud to the committee. Think carefully about the difference between evidence that is absent and evidence that would not have helped either way, and be explicit about which of your own claims are shaky.
reasoning: |-
  Okay, the user is a volunteer curator for a village heritage group dealing with a contentious archaeological find. They need help resolving a committee split over interpreting a 1968 pit discovery. Let me start by understanding the key elements of the find: a stone-lined pit containing a broken storage jar, a dog's skull placed upright, bent nails, a worn whetstone, and a copper-alloy pin. The committee has three interpretations: shrine, rubbish pit, or natural accumulation. The farmer's daughter threatens to withdraw the collection if called a rubbish dump.

  First, I need to unpack each interpretation. The shrine theory emphasizes intentional placement—like the skull facing a specific direction and items arranged around the jar. But what evidence would support this? Maybe artifacts linked to rituals, repeated structures, or items not typically discarded. The absence of other similar pits weakens this. 

  The rubbish pit argument sees it as disposal of broken items. The jar was old when buried, and the mix of objects could be household junk. However, the careful placement of the skull and the layered fill with sand don't fit typical waste disposal. Why separate layers with clean sand? That suggests deliberation.

  The natural process theory claims objects accumulated naturally. But the stone-lined pit contradicts that—it's human-made. Also, the skull's position and the artifacts' arrangement seem too structured for random accumulation. 

  The missing second pit complicates things. Without knowing what was in it, we can't compare contexts. If both pits were similar, it might support a pattern (like ritual or disposal). Since we don't have that data, interpretations rely more on the first pit's details.

  The user's deeper concern is about epistemology in archaeology: how we infer intentions from objects. They question why "rubbish" is the default and whether belief is less provable than action. The committee's arguments touch on this—can we ever know past beliefs, or do we just label unknowns as ritual? 

  I should explain that archaeology deals with material actions. Beliefs are inferred from repeated, non-utilitarian actions. The pit's features (skull placement, sand layer) aren't utilitarian, suggesting ritual. But without comparable sites, it's hard to prove. The label needs to present possibilities without overcommitting, respecting the daughter's concerns while staying objective.

  For the label, balance all theories but highlight the unusual features. Avoid terms like "ritual" or "rubbish." Focus on the deliberate aspects noted in the sketch and diary. This acknowledges the farmer's view without dismissing other readings. The committee needs to understand that absence of evidence isn't evidence against; it's a limitation. The real issue is whether the actions imply meaning beyond disposal, which the arrangement suggests.
answer: |-
  ### Step 1: Dissecting the Three Readings
  **Reading 1: The Shrine**  
  *Asserts:* Intentional ritual deposition. The pit was created for symbolic purposes (offering, protection, closure ritual). Key elements: deliberate breaking of the jar, upright placement of the dog skull (possible guardian/watchman), inclusion of bent nails (ritual "killing" of objects), spatial arrangement, and layered fill (structured deposition).  
  *Requires:* Non-utilitarian placement, symbolic objects, patterned context (e.g., alignment, separation from domestic waste).  
  *Expects:* Associated features (e.g., boundary markers, repeated deposits), objects atypical of household waste (e.g., intact votives), potential alignment with landscape features.  
  *Problems:* No comparable local finds, household objects reused ritually blur distinctions.  

  **Reading 2: The Rubbish Pit**  
  *Asserts:* Disposal of broken/unwanted items. Placement is coincidental (e.g., pit reused for trash). Broken jar = discard; nails = corroded scrap; dog skull = casual discard; sand layer = natural sedimentation or backfill variation.  
  *Requires:* Objects consistent with domestic refuse (wear, breakage), no intentional spatial logic, proximity to household debris.  
  *Expects:* Mixed/chaotic object arrangement, high volume of mundane debris, no "curated" layers.  
  *Problems:* Careful skull placement, sand layer separation, and bent nails (deliberate?) contradict typical waste deposition.  

  **Reading 3: Natural Accumulation**  
  *Asserts:* Objects redeposited by natural forces (water, animals) into an existing hollow. Stone lining is coincidental (e.g., collapsed wall).  
  *Requires:* Geological/faunal sorting evidence (e.g., abrasion, size-sorting), no human-made pit structure.  
  *Expects:* Scattered or stratified objects without association, pit shape inconsistent with human excavation.  
  *Problems:* Farmer’s sketch shows a **dug, stone-lined pit**. Animal burrows don’t line pits with stones; water doesn’t place skulls upright.  

  ---

  ### Step 2: Core Disagreements & Evidence  
  **The Real Conflict** hinges on **inferring intention from material patterns**.  
  - **"Rubbish" as default?** Not inherently "safer"—it relies on *negative evidence* (no overt ritual symbols). But ritual is often *defined* by deviation from utility (e.g., bending functional nails).  
  - **Can objects settle this?** Partially. The skull’s *upright placement* and *sand layer* defy both rubbish and natural models. Yet without contextual parallels (e.g., other shrines), we cannot prove *which* ritual intent existed.  
  - **Missing second pit?** Crucial loss. If it held identical objects, it might support rubbish; if empty/divergent, it could reinforce the first pit’s uniqueness. Without it, ambiguity deepens.  
  - **Philosophical tension:**  
    - *"We infer hands, not minds"*: True—but ritual *is* a physical action (placing a skull upright). We *can* infer symbolic action without accessing "belief."  
    - *"Ritual as non-explanation"*: Risky if used lazily, but valid when material actions lack utilitarian purpose (e.g., bending nails *before* deposition).  

  **Key Evidence Hierarchy:**  
  1. **Skull placement** (deliberate orientation) ≠ rubbish/natural.  
  2. **Structured layers** (sand divider) ≠ rubbish/natural.  
  3. **Bent nails** (ritual "killing" known in Iron Age/Roman Britain) ≠ typical discard.  
  4. **Single jar** (repaired? already antique?) suggests curation.  

  **Shaky Claims:**  
  - Calling it a "shrine" overstates certainty (no altars/icons).  
  - "Rubbish" ignores spatial control.  
  - "Natural" ignores the pit’s artificiality.  

  ---

  ### Step 3: The Label Text (90 words)  
  **Title:** A Deliberate Deposit?  
  **Text:**  
  > In 1968, a stone-lined pit was uncovered here. It held a large storage jar, broken before burial, with a dog’s skull placed upright atop it. Seven bent iron nails, a worn whetstone, and a copper pin lay near the rim. The fill was carefully layered with clean sand. While its purpose remains debated, the deliberate placement of objects and structured pit design suggest intentional deposition—perhaps ritual closure or an offering. No comparable feature was found nearby. The objects were already old when buried, hinting at curated significance.  

  *Why this approach?*  
  - Leads with *material facts* (skull placement, layering).  
  - Uses "suggest" and "debated" to acknowledge ambiguity.  
  - Notes absence of parallels (critical context).  
  - Avoids "shrine" (inflammatory) and "rubbish" (reductive).  

  ---

  ### Step 4: Statement for the Committee  
  > "Our disagreement stems from how we interpret *intention* in archaeology. The pit’s stone lining, upright skull, and layered sand defy explanations of casual discard or natural accumulation. These features imply deliberate action—but deliberation doesn’t equal ‘shrine.’ Ritual is one form of intention; storing heirlooms or marking land are others. Calling it ‘rubbish’ ignores the control evident in the deposit; calling it ‘ritual’ risks overreading. Our label focuses on observable patterns: careful placement and antiquity of objects. It invites visitors to ponder meaning without claiming certainty we lack. Withdrawing the collection over wording silences that conversation entirely."  

  ### Key Takeaways  
  - **Evidence for intention exists** in spatial control (skull, layers).  
  - **"Ritual" ≠ unexplained**; it’s inferred from *non-functional actions* (bent nails, curated sand).  
  - **The farmer’s pride** is valid—his discovery *is* unusual—but doesn’t dictate interpretation.  
  - **Absent evidence** (second pit, parallels) limits conclusions but doesn’t negate the pit’s uniqueness.  

  This balances respect for the find’s complexity, the farmer’s legacy, and archaeological rigor.
