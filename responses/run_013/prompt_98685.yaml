prompt: |-
  ok so I'm in a course on early modern philosophy and we've just done Hobbes on method, and I've got a probem with something on the hand-out.

  The picture we were given is this. Hobbes thinks you can only get real, step-by-step demonstrable knowledge of something when you make it yourself, because you properly know a thing's causes only when you know how it was put together by you. Geometry is the model case, since the geometer constructs the figures he reasons about -- you draw the triangle, so you know what's in it. Politics gets to count as a science on the same basis, because we make commonwealths: we assemble them out of covenants and authorisation, so we can know their causes the way we know a triangle's. Physics is the poor relation, because nature was made by God rather than by us, so we're only ever guessing at its causes. (Apparently he also thought he'd squared the circle, which didn't go well for him, but thats by the by.)

  Then the hand-out gives us this arguement, and I think it's doing something fishy but I can't put my finger on it:

  (1) We have science of a thing only if we construct it, i.e. only if we know how it was made, by us.
  (2) Geometry is the model science, because the geometer constructs the figures he reasons about.
  (3) We construct commonwealths, so there can be a science of politics.
  (4) But we also construct games and their rules, languages, legal systems, made-up worlds, and arguably our own past actions.
  (5) So by (1) we can have demonstrative science of chess, of invented languages, of a made-up world, and of what we did last Tuesday.
  (6) Having science of a fiction is absurd: what's true in a world you invented is true because you said so, so there's nothing there to be discovered and no error to be corrected.
  (7) So (1) is wrong, or at least the maker's-knowledge idea isn't what makes geometry certain.
  (8) And if geometry's certainty comes instead from our simply stipulating the definitions and axioms, then its truths are arbitrary conventions -- and the same would go for politics, which would make Hobbes's political science as arbitrary as whatever the sovereign happens to will.
  (9) So the geometric grounding of politics gives us either no knowledge at all or knowledge that is arbitrary, and either way it doesn't do the job he wants it to.

  I'd quite like to keep (2) and (3) -- I do think there's something to the thought that we can know political arrangements in a way we can't know the deep causes of nature. But (9) feels right to me too, and I can't have both. Which step do I give up, and what does giving it up cost me? If it helps, tell me whether the thing is broken by one bad move or whether every step is fine and I just have to pick the least bad thing to abandon -- and if some step only looked fine because of an ambiguity, say which reading I was sliding between. Also, please write it in British English, my seminar tutor is strict about it.
reasoning: |-
  Okay, the user is in an early modern philosophy course and is grappling with Hobbes's method, specifically the argument from their handout. Let me start by breaking down their problem. They’ve got a hand-out that presents Hobbes's view that we only have demonstrative knowledge of things we construct, like geometry and politics. But the handout then argues this leads to absurdities because we also construct things like games or languages, which shouldn’t count as science. The user wants to keep the idea that politics can be known like geometry but also sees the force of the reductio ad absurdum in step (9). 

  First, I need to understand where the argument goes wrong. The user mentioned ambiguity in premise (1). Let me look at that. Premise (1) says we have science only if we construct the thing and know how it was made by us. But construction can mean different things. In geometry, constructing a triangle means drawing it, but the knowledge isn't about that physical drawing. It's about the abstract concepts. Similarly, in politics, Hobbes is talking about the abstract structure of covenants, not the historical creation of a specific state. 

  Then there's step (4) which lists things like games, languages, legal systems. The key here is the type of construction. When we invent a game, we set arbitrary rules, so our knowledge of chess is about those stipulated rules. But geometry isn't arbitrary; its axioms are necessary truths, not conventions. Hobbes thinks geometry is certain because we grasp the necessary relations between definitions, not because we drew a triangle. The handout conflates different senses of "construct" here, treating all constructions as the same when they’re not.

  The user wants to preserve (2) and (3). So I should explain how geometry and politics work without falling into the absurdities. For politics, Hobbes isn't saying we know every detail of a specific commonwealth but the necessary consequences of covenants in general. That’s scientific knowledge. The handout's step (6) is correct for fictions but doesn’t apply to geometry or politics because they deal with necessary truths, not arbitrary stipulations.

  The user’s deeper need might be understanding how Hobbes can ground political science without arbitrariness. They’re worried that if politics is based on conventions, then the sovereign's will could make anything right. But Hobbes would argue that the laws of nature (like seeking peace) are rational and necessary, not arbitrary. The sovereign enforces them, but they’re derived from human nature and self-preservation, which aren't conventional.

  I should also address the user’s request for British English. Terms like "realise" instead of "realize", "arbitrariness" instead of "arbitrariness". Make sure the spelling and phrasing align with that. 

  Finally, the user might need to present this in a seminar. So clarifying the ambiguities and offering a way to defend Hobbes without the absurdities would help. Point out that giving up premise (1) as stated is necessary, but reformulating it to distinguish between types of construction saves Hobbes’s model. Emphasize that geometry’s certainty comes from necessary consequences, not stipulation.
answer: |-
  Right, let's dissect this argument from the handout. You've rightly spotted it's a *reductio ad absurdum* against Hobbes's maker's knowledge thesis (premise 1). The conclusion (9) feels potent because it highlights a genuine tension, but the argument **slips up crucially in step (5) by exploiting an ambiguity in 'construct' (and relatedly, 'make' and 'science')**. Giving up the *unqualified* version of premise (1) is the least costly move, preserving the core insights of (2) and (3) without landing in absurdity or arbitrariness.

  Here's the breakdown, step-by-step, identifying the ambiguity:

  1.  **Premise (1) - The Ambiguous Core:** "We have science of a thing only if we construct it, i.e., only if we know how it was made, by us." *This is the lynchpin.* The ambiguity lies in **what constitutes 'constructing' or 'making' for the purposes of 'science'.** Hobbes means something very specific: constructing according to *necessary and universal principles derived from definitions* (like geometry), or constructing an *artificial entity governed by rational necessity* (like the commonwealth, based on the laws of nature derived from human passions and reason). The argument in step (5) interprets 'construct' far more broadly, as mere *stipulation* or *arbitrary creation* (like inventing game rules or languages).
  2.  **Premise (2) - Geometry as Model:** Fine. Hobbes is clear: the geometer constructs figures based on precise definitions and axioms, and deduces *necessary* properties from them. The certainty arises from the *necessity of the consequences* drawn from the clearly defined starting points. The physical act of drawing is illustrative; the real construction is conceptual/rational.
  3.  **Premise (3) - Politics as Science:** Also fine, *on Hobbes's specific terms*. Humans "construct" the commonwealth *by rationally deducing* the necessary conditions for peace (laws of nature) and instituting a sovereign power through covenant to enforce them. We know its "causes" because we derive them rationally from the definition of human nature and the goal of self-preservation. It's not arbitrary whim, but rational artifice.
  4.  **Premise (4) - Other Constructions:** True. We *do* construct games, languages, legal systems (in a sense), fictions, and our past actions are constituted by our choices.
  5.  **Step (5) - The Problematic Inference:** "So by (1) we can have demonstrative science of chess, of invented languages, of a made-up world, and of what we did last Tuesday." **Here's the bad move.** It illegitimately *equates* all these acts of "construction" with the specific types relevant to geometry and politics. Why?
      *   **Chess/Invented Languages/Made-up Worlds:** When we construct these, we *stipulate* rules arbitrarily. Knowing "Queen moves diagonally any distance" is certain *only because we arbitrarily decided it*. There's no *necessary* reason why it couldn't move differently. We cannot deduce *necessary*, undiscoverable truths about chess beyond the rules we laid down; we can only apply logic *to* those arbitrary stipulations. There's no "discovery" of inherent properties independent of our will. This is fundamentally different from deducing that the internal angles of a Euclidean triangle *must* sum to 180 degrees *based on the necessary implications of the definitions of point, line, plane, etc.*
      *   **Legal Systems:** While constructed, a specific legal system *can* contain arbitrary stipulations (like driving on the left). However, Hobbes's science of politics isn't about the specific, potentially arbitrary, positive laws of a *particular* commonwealth. It's about the *necessary* structure and rationale *for any commonwealth whatsoever* derived from the laws of nature and the logic of authorisation. Knowing *that* a sovereign power is necessary for peace is a scientific deduction, akin to geometry; knowing *this specific traffic law* is more like knowing a chess rule.
      *   **Our Past Actions:** We "construct" them in the sense of performing them. But science of them isn't demonstrative deduction from definitions; it's contingent historical knowledge, often based on fallible memory or evidence. It bears no resemblance to geometric proof.
  6.  **Premise (6) - Absurdity of Science of Fiction:** Correct. Science of pure stipulation *is* absurd in the sense intended (demonstrative discovery). But this only applies if the "construction" *is* mere stipulation, which it isn't in geometry or Hobbes's core political science.
  7.  **Step (7) - Rejecting (1):** This follows *if* we accept the broad, stipulative interpretation of 'construct'. However, Hobbes doesn't hold premise (1) in that broad sense. We should reject the *unqualified* premise (1). The maker's knowledge thesis only yields *science* for constructions based on **necessary principles and definitions**, not for arbitrary stipulations.
  8.  **Step (8) - The False Dilemma (Arbitrariness):** This presents a false choice based on the previous misstep. If we correctly understand geometry and politics:
      *   **Geometry:** Its certainty comes *not* from mere stipulation of definitions, but from the **necessary logical consequences** that follow from those definitions within a coherent system. The definitions (point, line, plane) are chosen to capture fundamental spatial relations, and the deductions are non-arbitrary. You *cannot* stipulate that a Euclidean triangle has angles summing to 190 degrees without contradiction.
      *   **Politics (Hobbes's Science):** Similarly, it starts from definitions (human nature, right of nature, law of nature) and deduces the *necessary* conditions for peace (sovereign power, covenants). While the *institution* of a *specific* sovereign involves human will, the *rationale* and *structure* (sovereignty itself, the logic of authorisation, the fundamental laws of nature) are presented as *necessary deductions*, not arbitrary conventions. The sovereign's *positive laws* can be arbitrary, but the *grounding* of sovereignty itself in reason is not. Hobbes argues it's *rationally necessary* for self-preservation, not merely "willed."
  9.  **Conclusion (9):** This only holds if we accept the flawed interpretations leading up to it. If we reject the broad, stipulative sense of 'construct' applied in step (5), and understand the necessity inherent in geometric and political deduction, the grounding *can* provide non-arbitrary knowledge.

  **Your Way Forward: What to Give Up & What it Costs**

  *   **Give Up:** The *unqualified* version of **Premise (1)**. Specifically, abandon the idea that *any* act of human construction automatically yields demonstrative science. Not all "making" is equal for epistemological purposes.
  *   **Refined Premise (1):** We have *demonstrative science* of a thing only if we construct it *according to necessary and universal principles derived from clear definitions, and reason deductively about the necessary consequences of that construction.*
  *   **Cost:** This forces a more nuanced reading of Hobbes. It means explicitly acknowledging that the "maker's knowledge" thesis only works for domains where the construction is governed by rational necessity (geometry, the *fundamental rational structure* of politics). It doesn't apply to contingent creations, arbitrary stipulations, or the messy details of historical political implementation.
  *   **Preserving (2) & (3):** This refined view keeps geometry as the model (constructed from necessary definitions yielding necessary truths). It keeps politics as a science *in Hobbes's specific sense*: we rationally deduce the necessary artificial structure (commonwealth, sovereign) from the "matter" (human nature) and "form" (laws of nature) to achieve the "end" (peace). We know its causes because we derive them rationally. Physics remains the poor relation because we lack access to God's construction principles and must rely on hypotheses.
  *   **Avoiding (9):** The geometric grounding gives us knowledge of *necessary political principles* (e.g., need for sovereign power, logic of covenant) that are not arbitrary, because they are derived from the non-arbitrary facts of human nature and rational self-preservation. The *application* of these principles in a specific state involves will and potentially arbitrariness in positive law, but the core science is about the necessary framework itself.

  **The Ambiguity You Were Sliding On:**

  The key ambiguity is in the word **"construct"** (and consequently "make" and "science"). The argument slides between:

  1.  **Construct₁ (Hobbes's Sense for Science):** Creating an entity or system based on **rationally necessary principles** derived from clear definitions, allowing for deductive demonstration of necessary properties/consequences (Geometry, *Fundamental* Politics).
  2.  **Construct₂ (Stipulative Sense):** Creating something by **arbitrary fiat or contingent choice**, where "truths" are simply consequences of the stipulations, lacking inherent necessity or discoverability (Chess rules, fictional worlds, specific positive laws, specific past actions).

  The *reductio* works by applying Premise (1) using Construct₂, leading to absurdity. But Hobbes only endorses Premise (1) using Construct₁. Recognising this ambiguity allows you to reject the *reductio*'s interpretation of Premise (1) while preserving Hobbes's core insights about geometry and politics as sciences grounded in rational construction and deduction. Your seminar tutor should appreciate this careful distinction.
