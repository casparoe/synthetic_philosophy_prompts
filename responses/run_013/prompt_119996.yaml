prompt: |-
  Alright, I need an outside read on an argument I keep having with my friend Dana, and I'm not just trying to win it, I actually want to be right.

  Dana's a home health aide. A couple years ago her agency paid a separate crisis bonus on top of the normal rate for overnights when a client's regular aide quit. Last spring they folded that bonus into the standard overnight rate — same money, different name — and then stopped backfilling a bunch of open positions, so there's basically an overnight up for grabs every week and Dana gets asked every week. She takes alot of them. She's saving because her mom needs a surgery that isn't covered, and the waitlist is long enough that saving faster actually changes something real. If Dana turns down two in a row, her scheduler starts routing her day shifts to clients further and further from her apartment. Nothing in writing, nothing you could file on, just distance and vibes. Her brother says the agency is doing this to her and that her yes doesn't count for anything. Dana says she's a grown woman with a bank account, nobody put a gun to her head, a job you don't love is still a job, and she could quit whenever she wants. Her brothers reply is that quitting is the option that costs her the most, so it isn't really an option, and anyway the agency is the one who made her options this bad in the first place, so it doesn't get to point at them like they're the weather.

  I think they're both saying something true and I can't work out which one should win. And here's the part that keeps tripping me up: Dana keeps saying "I could always quit," and technically she's right. Is that enough? At what point does a pile of bad options stop being a choice at all? If the surgery is why she says yes, and the money is what makes the surgery possible, is the yes still hers? I'm definately not trying to tell her what to do with her life, I just don't know what to say to her at Thanksgiving.

  So what do I actually say, or do I drop it? I don't want a lecture on labor law or a pep talk about boundaries — I want to know whether her yes is a real yes. And be straight with me about how confident you are in your answer, and point out the one part of it you're least sure about, because I'd rather know where the soft spot is than get a tidy answer.
