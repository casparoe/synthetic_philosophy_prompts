  ---

  #### **Q4: Does origin fix your identity? (If yes, proceed to specificity.)**
  - **No** → *Empty branch* (Incoherent: if origin lacks necessity, it can't ground identity per Q2).  
  - **Yes** → Proceed to Q5.  

  ---

  #### **Q5: What grain of origin is essential? (Diagnostic: could you be your sibling—same parents, different sperm/egg?)**
  - **Coarse (parents only)** → **Leaf 5: Coarse Parental Essentialism**  
    - *Name:* Saul Kripke (interpretive debate, but fits his "particular pair" examples).  
    - *Awkward commitment:* You could be your sibling (same parents, different genome/matter).  
    - *Bullet bitten:* You and your sibling are contingently distinct—swapping your origins preserves identity.  
  - **Fine (specific gametes)** → Proceed to Q6.  

  ---

  #### **Q6: Do gametes have essential origins? (Regress check: must the gametes come from specific precursor cells?)**
  - **Yes** → **Leaf 6: Recursive Origin Essentialism**  
    - *Name:* Unnamed (theoretical, avoids arbitrariness but unexplored).  
    - *Awkward commitment:* Your existence requires a fixed chain back to primordial gametes.  
    - *Bullet bitten:* If your father's sperm precursor differed, you wouldn't exist.  
  - **No** → **Leaf 7: Strict Gamete Essentialism**  
    - *Name:* Penelope Mackie (defended as Kripkean refinement).  
    - *Awkward commitment:* Gametes lack essential origins—they could magically appear.  
    - *Bullet bitten:* You could have the same sperm/egg from different parents (biologically impossible but metaphysically possible).  

  ---

  #### **Q7: For any essentialist view (Leaves 2–7), is the impossibility of variation metaphysical or biological?**
  - **Biological (nomological) constraint only** → **Leaf 8: Biological Necessity Only**  
    - *Name:* Michael Ruse (naturalistic interpretations).  
    - *Awkward commitment:* In a world with different reproductive laws, you could come from different origins.  
    - *Bullet bitten:* "I couldn't have come from different gametes" is like "I couldn't breathe fire"—contingent, not metaphysical.  
  - **Metaphysical** → Leaves 2–7 stand as stated (no new leaf).  

  ---

  ### **Critical Notes & Diagnostics**
  #### **1. Underdetermined Pairs (same answers to all cases):**  
  - **Biological Necessity Only (Leaf 8) vs. Metaphysical Gamete/Parental Essentialism (Leaves 5,7):**  
    Both answer "no" to "could you come from different gametes?" in the actual world. They *only* diverge on nomologically impossible scenarios (e.g., gamete-swapping via magic).  
    - *How to separate:* Ask: "In a universe with different biological laws, could *you* have come from different gametes?"  
      - Yes → Leaf 8.  
      - No → Metaphysical Leaves 5/7.  

  #### **2. Empty Branches & Why:**  
  - **"Origin lacks necessity" (Q4 → No):** Incoherent. If origin is the ground (per Q2), denying necessity collapses identity to haecceitism or deflationism—already branched.  
  - **"Gametes essential but parents not" (Q5 → Fine, then Q6 → No):** Logically coherent but biologically bizarre (Leaf 7). Gametes *fix* parents (since gametes originate from them), so parents are *de facto* necessary. But metaphysically, Leaf 7 allows parents to vary if gametes are duplicated unnaturally.  

  #### **3. Where I Plant My Flag:**  
  Strict Gamete Essentialism (Leaf 7, metaphysical). Why?  
  - Coarse views (Leaf 5) implausibly make siblings fungible.  
  - Matter/Genome views (Leaves 3–4) ignore origin's intuitive primacy.  
  - Haecceitism (Leaf 2) is too unconstrained.  
  - Gametes are the minimal biologically individuating factor—regress stops naturally at fertilization.  

  #### **4. Taxonomy Summary (8 Leaves):**  
  1. **Deflationism**  
  2. **Haecceitism**  
  3. **Matter Essentialism**  
  4. **Genome Essentialism**  
  5. **Coarse Parental Essentialism**  
  6. **Recursive Origin Essentialism**  
  7. **Strict Gamete Essentialism**  
  8. **Biological Necessity Only**  

  Each leaf is separated by concrete commitments, except Leaf 8's modality ambiguity (resolved via nomologically impossible scenarios). The tree exhausts major positions without unmapped overlap.
