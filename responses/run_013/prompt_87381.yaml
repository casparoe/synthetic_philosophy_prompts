prompt: |-
  I am a high-school student writing a paper on whether a decision rule can give weight to tiny probabilities of enormous outcomes without being taken over by them. Before I commit to a position, I need the standard of adequacy: what would a rule have to accomplish to count as a satisfactory answer to this problem? Set out the requirements — the cases it has to handle, the distinctions it must preserve, and the theoretical results it must not contradict — and give the consideration behind each one. I want the list to register a distinction I have been worrying about: between an outcome that is improbable because some real chance mechanism makes it so, and an outcome that is improbable only because I have assigned a low credence to a hypothesis about an agent's intentions or about hidden features of the world; a rule that simply discounts small probabilities may treat those two alike, and I would rather have that examined than granted. Tell me which requirements are indispensable and which merely reflect the commitments of one camp, and if the list cannot be satisfied as a whole, say which requirements pull against each other and which single one rules out the most otherwise attractive rules — that would be the most useful part of the answer. Close with a short assessment of how standard expected-value maximization, capping or bounding the value of outcomes, and ignoring probabilities below a fixed threshold each fare against the list.
reasoning: |-
  Okay, the user is a high-school student working on a paper about decision rules handling tiny probabilities of enormous outcomes. They need a standard of adequacy—what criteria must a rule meet to solve this problem? They also want a distinction between outcomes that are improbable due to real chance mechanisms versus those improbable because of low credence in agents' intentions or hidden features. 

  First, I need to recall the core problem: how to weight small probabilities of huge payoffs without letting them dominate decisions. The St. Petersburg Paradox is a classic example. The user is worried about conflating different types of improbability. They mentioned two types: one from actual randomness (like a lottery) and one from epistemic uncertainty (like not knowing an agent's motives). A good decision rule should handle these differently.

  Next, the requirements. The user wants a list that includes cases to handle, distinctions to preserve, and theoretical constraints. Indispensable requirements would be avoiding dominance by tiny probabilities, handling real vs. epistemic uncertainty, and satisfying dominance principles. Other requirements might be more contentious, like continuity or completeness.

  Key distinctions: Real vs. epistemic uncertainty. Real chances involve physical randomness (quantum events, lotteries), while epistemic involves subjective beliefs about agents or hidden variables. A rule that discounts small probabilities might treat both the same, but the user wants this examined. Also, finite vs. infinite cases matter because some rules work for one but not the other.

  Theoretical constraints: Avoiding Dutch books is crucial for rationality. Continuity might conflict with robustness against tiny probabilities. For example, a discontinuous rule might ignore probabilities below a threshold, but that could violate dominance if the outcome is huge.

  Conflicting requirements: Handling infinite expectations (like the St. Petersburg paradox) vs. robustness. Expected utility can't handle infinite values, while capping might violate continuity. Also, distinguishing real vs. epistemic uncertainty might require context-dependent rules, which could violate completeness.

  Assessing standard approaches: Expected value fails with infinite expectations. Capping (like with a utility function) avoids domination but loses sensitivity to huge outcomes. Ignoring small probabilities (threshold rule) risks violating dominance in cases like Pascal's Mugging.

  The user's deeper need is to understand which requirements are non-negotiable versus debatable. They might also need to know which single requirement is most restrictive. Avoiding dominance by tiny probabilities while satisfying other axioms might be impossible without compromising elsewhere. The distinction between real and epistemic uncertainty adds complexity, possibly requiring a hybrid approach. Highlighting conflicts will help them structure their paper's argument.
answer: |-
  Here's a comprehensive standard of adequacy for evaluating decision rules regarding tiny probabilities of enormous outcomes, structured around your requirements. This framework incorporates your crucial distinction and identifies conflicts.

  ### Core Standard of Adequacy: Requirements & Rationales

  1.  **Avoidance of Catastrophic Domination (Indispensable):**
      *   **Requirement:** The rule must not allow a prospect with a vanishingly small probability of an arbitrarily enormous payoff to *always* dominate any alternative with finite (even extremely large) certain payoff, regardless of the finite payoff's size. (Addresses "Pascal's Mugging").
      *   **Rationale:** Preserves practical rationality and prevents decision-making from being hijacked by speculative, unverifiable threats or promises. Rules violating this are practically useless.
      *   **Considers Distinction:** Implicitly targets scenarios driven primarily by *epistemic* uncertainty about agents/intentions (e.g., the mugger's threat) where the "enormous outcome" is postulated rather than grounded in a known physical chance mechanism.

  2.  **Sensitivity to Real Catastrophic Risks (Indispensable):**
      *   **Requirement:** The rule must assign significant weight to outcomes that, while extremely improbable, arise from well-understood *physical chance mechanisms* and have genuinely catastrophic consequences. (Addresses "Existential Risk" scenarios, e.g., asteroid impact, engineered pandemic).
      *   **Rationale:** Prudence demands taking seriously threats with catastrophic potential, even if improbable, when the probability is non-negligible *and* grounded in reality. Ignoring these risks is recklessly irrational.
      *   **Considers Distinction:** Explicitly requires treating *real chance mechanism* improbabilities differently from pure *epistemic uncertainty* improbabilities (Requirement #1). A rule simply discounting small probabilities fails here if it discounts the asteroid risk as much as the mugger's threat.

  3.  **Adherence to Stochastic Dominance (Indispensable):**
      *   **Requirement:** If Prospect A yields an outcome at least as good as Prospect B in every possible state of the world, and a strictly better outcome in some states with positive probability, then A must be preferred to B.
      *   **Rationale:** Fundamental axiom of rational choice. Violating it leads to guaranteed losses (Dutch Books) or rejecting clearly superior options. Any viable rule must satisfy this.
      *   **Considers Cases:** Essential for comparing prospects with complex outcome distributions. Rules ignoring tiny probabilities often violate this if the tiny probability outcome is vastly better/worse than alternatives in those specific states.

  4.  **Handling Finite but Extreme Cases (Highly Desirable):**
      *   **Requirement:** The rule must provide clear, non-paradoxical guidance for prospects involving finite but astronomically large payoffs with tiny probabilities (e.g., a 1-in-10^15 chance of gaining 10^100 utils).
      *   **Rationale:** Real-world decisions (e.g., long-term policy, very high-stakes insurance) can involve quantifiable, finite, but extreme values. A rule must function here without absurdity.
      *   **Theoretical Constraint:** Distinguishes rules that work in principle vs. practice. Expected utility (EU) handles these *in theory* but requires unbounded utility.

  5.  **Handling Infinite Expectations (Contentious):**
      *   **Requirement:** The rule must provide clear, consistent preferences for prospects with infinite expected value (e.g., St. Petersburg paradox variants).
      *   **Rationale:** Tests the limits of decision theory. While arguably less practically relevant than finite extremes, resolving this paradox is theoretically significant.
      *   **Commitment:** Primarily reflects the commitment of theoretical decision theorists/complexity economists. Some argue finite resources make true infinities irrelevant. Violating stochastic dominance is a major risk here.

  6.  **Contextual Sensitivity / Distinction Preservation (Critical for your focus):**
      *   **Requirement:** The rule must be sensitive to the *source* or *type* of the small probability – specifically, differentiating between:
          *   (a) **Aleatory Uncertainty:** Small probability arising from inherent physical randomness (e.g., quantum decay triggering disaster, lottery win).
          *   (b) **Epistemic Uncertainty:** Small probability arising from limited knowledge/beliefs about agents' intentions, hidden variables, or complex systems (e.g., Pascal's Mugger, unknown weapon capabilities).
      *   **Rationale:** As you identified, these feel different intuitively and normatively. Discounting a mugger's threat feels prudent; discounting a verified asteroid risk feels reckless. A truly adequate rule should reflect this difference *in its weighting mechanism*.
      *   **Distinction:** This is the core distinction you raised. A rule simply applying a uniform discount factor to probabilities below a threshold fails this requirement by treating (a) and (b) identically.

  7.  **Theoretical Coherence (Indispensable Core, Contentious Extensions):**
      *   **Requirement (Indispensable Core):** The rule must avoid Dutch Books (no guaranteed loss sequences) and satisfy basic ordering/transitivity axioms.
      *   **Requirement (Contentious Extensions):** Ideally satisfies the Independence Axiom (or a weakened version like betweenness) and Continuity.
      *   **Rationale:** Coherence is fundamental to rationality. Dutch Books imply exploitable irrationality. Continuity and Independence are powerful for deriving representation theorems but are often the *first* axioms sacrificed to handle extreme cases. Sacrificing Independence makes preferences harder to model and potentially context-dependent. Sacrificing Continuity allows for sharp thresholds but can conflict with stochastic dominance (#3).

  ### Conflicts and Trade-offs: The Impossibility Trilemma

  No rule satisfies *all* requirements perfectly due to inherent tensions:

  1.  **Avoiding Domination (#1) + Handling Real Risks (#2) + Stochastic Dominance (#3):** This is the core tension.
      *   **Conflict:** Strict adherence to Stochastic Dominance (#3) forces a rule to prefer a prospect with a 1-in-10^100 chance of 10^100 utils over receiving 1 util for sure, because the tiny chance state yields a vastly better outcome. But this *looks like* the catastrophic domination (#1) we want to avoid (especially if the probability is epistemic!). Conversely, downweighting the tiny probability enough to prevent domination (#1) risks violating Stochastic Dominance (#3) and insensitivity to real risks (#2).
      *  **Resolution Attempts:** Rules try to navigate this by:
          *   *Contextual Discounting:* Differentiating aleatory vs. epistemic (#6) to apply discounting selectively.
          *   *Bounded Utility:* Capping the *value* of outcomes, making 10^100 utils effectively finite, easing the tension between #1, #2, and #3 for finite cases (#4), but struggling with infinities (#5) and altering sensitivity.
          *   *Probability Weighting/Thresholds:* Non-linearly transforming probabilities or ignoring very small ones, but this directly risks violating #3 and treating #6a and #6b alike.

  2.  **Distinguishing Uncertainty Sources (#6) vs. Completeness/Simplicity:** Building a formal rule that reliably distinguishes aleatory from epistemic uncertainty is extremely difficult. It often requires contextual judgment outside the formal probability/outcome inputs, making the rule less general or more complex.

  3.  **Handling Infinites/Continuity (#5, #7 Extension) vs. Robustness (#1, #2):** Rules designed to handle infinite expectations (e.g., finite relative utilities) often rely heavily on Continuity (#7), which can make them *more* vulnerable to being dominated by tiny probability prospects (#1). Rules sacrificing Continuity (like threshold rules) handle #1 better but fail #5 and violate the theoretical elegance of #7.

  **The Single Most Restrictive Requirement: Stochastic Dominance (#3).**
  This axiom rules out the most intuitively simple "solutions": **ignoring tiny probabilities below a fixed threshold** *always* violates stochastic dominance if the ignored outcome is sufficiently better/worse than the alternatives in the ignored state. It also puts immense pressure on any rule trying to avoid catastrophic domination (#1) while maintaining sensitivity (#2), forcing complex solutions like bounded utility or context-dependent weighting.

  ### Assessment of Standard Rules Against the List

  1.  **Standard Expected Value (EV) Maximization:**
      *   **Fails:** #1 (Catastrophic Domination - Pascal's Mugging), #5 (Infinite Expectations - St. Petersburg Paradox).
      *   **Struggles:** #2 (Sensitivity to Real Risks - only if probability is truly tiny, but EV *will* prioritize it over large finite goods, which can feel excessive). #4 (Finite Extremes - works *in theory* but requires unbounded utility, feels impractical).
      *   **Satisfies:** #3 (Stochastic Dominance - perfectly), #7 (Theoretical Coherence - perfectly, incl. Continuity/Independence).
      *   **Ignores:** #6 (Distinction) - treats all small probabilities identically based solely on magnitude.

  2.  **Capping/Bounding Outcome Value (e.g., using U(x) = 1 - e^(-kx) or hard cap):**
      *   **Satisfies:** #1 (Avoids Domination - value is bounded), #3 (Stochastic Dominance - preserved as long as cap is fixed), #4 (Finite Extremes - handles well), #7 Core (Coherence).
      *   **Struggles/Fails:** #2 (Sensitivity to Real Risks - risks being *too* insensitive; a truly catastrophic outcome might be capped at a value comparable to large but non-catastrophic losses). #5 (Infinite Expectations - usually avoids them by bounding value). #6 (Distinction) - treats outcomes based solely on capped value, not probability source.
      *   **May Violate:** #7 Extensions (Continuity/Independence - generally satisfies).

  3.  **Ignoring Probabilities Below a Fixed Threshold:**
      *   **Satisfies:** #1 (Avoids Domination - if threshold set).
      *   **Fails:** #2 (Sensitivity to Real Risks - ignores genuine catastrophic risks below threshold), **#3 (Stochastic Dominance - VIOLATES CORE REQUIREMENT)**, #4 (Finite Extremes - ignores relevant possibilities), #5 (Infinite Expectations - crude fix).
      *   **Ignores:** #6 (Distinction) - ignores all small probabilities alike. #7 (Coherence) - violates Stochastic Dominance (#3), leading to Dutch Books.

  ### Conclusion

  The core challenge is navigating the trilemma between **Avoiding Catastrophic Domination (especially epistemic)**, **Sensitivity to Real Catastrophic Risks (aleatory)**, and **Stochastic Dominance**. Stochastic Dominance is the indispensable but restrictive requirement. **Capping/Bounding Value** emerges as the most robust standard approach against the list, satisfying core rationality (#3, #7 core) and avoiding domination (#1), though it falters on sensitivity to real large-scale catastrophes (#2) and the source distinction (#6). **Ignoring tiny probabilities** fails catastrophically due to violating stochastic dominance. **Pure EV** handles real risks and dominance but is paralyzed by domination from epistemic uncertainties and infinities. A truly satisfactory rule likely needs to incorporate your distinction (#6) explicitly, perhaps through context-dependent probability weighting or separate treatment of aleatory vs. epistemic uncertainty, though this remains an active and challenging area of research. Your paper should focus on how proposed rules navigate this central trilemma and whether/how they handle the crucial aleatory/epistemic distinction.
