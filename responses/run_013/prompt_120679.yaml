          - How did it differ from Game 1?
          - Was there cooperation? For how long?
          - Did anyone defect? If so, what happened next? (retaliation? forgiveness?)
          - Why did cooperation hold? (shadow of the future)

    3. Game 3 (high temptation):
          - What happened? (likely collapse of cooperation)
          - Why did the same uncertainty not sustain cooperation? (the temptation was too high relative to the shadow of the future)

    4. Show the condition for cooperation:
          p >= (T-R)/(R-P)   [for the Grim Trigger strategy? Or for Tit-for-Tat? Actually, the condition we derived is for Grim Trigger. But Tit-for-Tat has a similar condition? Actually, it's more complex because of the possibility of reversion. But for simplicity, we use the same condition.]

          For Game 2: (5-3)=2, (3-1)=2, so 2<=2*(p/(1-p)) => p>=0.5 -> satisfied.
          For Game 3: 22<=2*(p/(1-p)) => p>=0.9167 -> not satisfied.

    5. Discuss the leaderboard: did the competitive pressure lead to more defection? Or did they find that cooperation was a better way to score high?

    6. Limitations of the exercise: we didn't allow communication, and in real life, communication can help. Also, we assumed simultaneous moves, but in some situations, sequential moves might occur.

    7. What we didn't see: the role of noise (if we skipped it). We can explain that if there is a chance of miscommunication, then strategies like Tit-for-Tat can break down because a single mistake leads to a cycle of defection. Then more forgiving strategies are needed.

    8. Connection to real-world: how do we create a long shadow of the future in business, international relations, etc.? And how do we adjust the payoffs to make cooperation sustainable?

    Finally, if they cooperated in Game 1, we can discuss: why? Maybe they were optimistic? Or they didn't think about the last round? Or they valued fairness? But then we can point out that in theory, backward induction predicts defection.

    This should fill 35 minutes.

    Now, for the first time running, be prepared for:

    - Some pairs finishing early: have extra discussion questions for them? Or let them watch others? But they might get noisy.

    - Confusion about the rules: provide a clear handout with the payoffs.

    - Disputes: the teacher is the arbiter.

    We can provide a sample scorecard:

        Game 1 (Fixed: 10 rounds)
        Round | Your move (C/D) | Partner's move (C/D) | Your points | Cumulative
        1     |                 |                      |             |
        ...

    And a handout with the payoffs:

        If both Cooperate: 3 points each.
        If both Defect: 1 point each.
        If you Defect and they Cooperate: you get 5, they get 0.
        If you Cooperate and they Defect: you get 0, they get 5.

    For Game 3, change the last one: if you Defect and they Cooperate: you get 25, they get 0.

    We can have the payoffs on the board throughout.

    I think this should work.
answer: |-
  Below is a comprehensive plan for your 90-minute seminar, designed to let students experience the core concepts through gameplay followed by a targeted debrief. The structure emphasizes hands-on learning, minimizes lecture time, and addresses your concerns about stakes, timing, and potential pitfalls. I'll cover:  
  **1. Rules and Materials**  
  **2. Timeline**  
  **3. Leaderboard and Stakes**  
  **4. What to Display on the Board**  
  **5. Debrief Script**  
  **6. Predictable Problems and Fixes**  
  **7. Limitations of the Game**  
  **8. Optional Add-Ons (Round-Robin/Noise)**  

  ---

  ### **1. Rules and Materials**  
  **Objective:** Play three Prisoner’s Dilemma (PD) games to experience:  
  - **Game 1:** Fixed endpoint → Backward induction unraveling.  
  - **Game 2:** Uncertain endpoint → Sustainable cooperation.  
  - **Game 3:** Uncertain endpoint + high temptation → Cooperation collapse.  

  **Payoffs (Points):**  
  | **Your Action** | **Partner’s Action** | **Your Points** | **Partner’s Points** |  
  |------------------|----------------------|-----------------|----------------------|  
  | Cooperate (C)   | Cooperate (C)       | 3              | 3                   |  
  | Cooperate (C)   | Defect (D)          | 0              | 5 (or 25 in Game 3) |  
  | Defect (D)      | Cooperate (C)       | 5 (or 25)      | 0                   |  
  | Defect (D)      | Defect (D)          | 1              | 1                   |  

  **Materials (for 18 students, 9 pairs):**  
  - **Scorecards (print 1 per pair per game):**  
    - Grid with columns: **Round, Your Move (C/D), Partner’s Move (C/D), Your Points, Cumulative Points.**  
    - Pre-filled with round numbers (1-10 for Games 1/3; 1-15 for Game 2 to allow for early termination).  
  - **Decision Cards (2 per player):** One labeled "C", one labeled "D".  
  - **Randomizer for Games 2/3:** Use a free online tool (e.g., [Random.org](https://www.random.org/dice/) dice roller) projected on screen. Continuation probability = 0.9 (i.e., game continues on dice roll 1-9; ends on 10).  
  - **Leaderboard:** Whiteboard or projector with table: **Pair # | Game 1 | Game 2 | Game 3 | Total**.  

  **Game Structure:**  
  - **Pairs:** Fixed for all games (builds familiarity).  
  - **Counterbalancing:**  
    - **Group A (4 pairs):** Game 1 (fixed) → Game 2 (uncertain) → Game 3 (high temptation).  
    - **Group B (5 pairs):** Game 2 (uncertain) → Game 1 (fixed) → Game 3 (high temptation).  
  - **Rounds per Game:**  
    - **Game 1:** Exactly 10 rounds (announced).  
    - **Game 2:** Uncertain endpoint. After each round, roll dice: 90% chance of continuation (expected rounds ≈ 10).  
    - **Game 3:** Same as Game 2 but with **temptation payoff = 25** (defector gets 25 if partner cooperates).  

  ---

  ### **2. Timeline (90 Minutes Total)**  
  | **Time** | **Activity**                                                                 | **Details** |  
  |----------|------------------------------------------------------------------------------|-------------|  
  | 0-10 min | **Introduction**                                                             | - Explain PD rules, payoffs, and leaderboard. Assign pairs and groups (A/B).<br>- Emphasize: *"Maximize your points – top 3 pairs win prizes (e.g., candy, extra credit)."* |  
  | 10-35 min| **Gameplay (25 min total: 8 min/game + transitions)**                       | **Game 1/2 (Groups A/B play simultaneously):**<br>- Each round: 45 sec to decide → reveal cards → record results.<br>- **Game 1 ends after Round 10.**<br>- **Game 2:** Roll dice after each round; end if roll=10.<br>- **Transition (2 min):** Report cumulative points to leaderboard. |  
  | 35-50 min| **Game 3 (All pairs play)**                                                  | - Same as Game 2 but temptation=25.<br>- Roll dice after each round. |  
  | 50-55 min| **Report Scores & Leaderboard Update**                                       | Pairs report Game 3 points. Announce top 3 pairs. |  
  | 55-85 min| **Debrief (30 min)**                                                         | Guided discussion (script below). |  
  | 85-90 min| **Optional: Round-Robin Evolution**                                          | Quick strategy imitation (details in Section 8). |  

  ---

  ### **3. Leaderboard and Stakes**  
  **Why Points (Not Money):**  
  - **Competitive stakes:** Prizes for top 3 pairs (candy, stickers, or symbolic perks like "immunity" from a future quiz).  
  - **Psychological pressure:** Public leaderboard amplifies rivalry. Say: *"This isn’t hypothetical – your rank determines rewards."*  
  - **Mitigates excessive cooperation in Game 1:** Students who "cooperate always" risk losing to defectors who exploit them.  

  **If Cooperation Dominates Game 1:**  
  - **Intervene early:** After Round 5, announce: *"Pairs ranked 4th or lower have a chance to climb – strategize!"* This triggers defection as teams near the bottom compete.  
  - **Post-game pressure:** Ask defectors: *"Why did you break cooperation? How did it affect your rank?"*  

  ---

  ### **4. What to Display on the Board**  
  - **During Gameplay:**  
    - Payoff matrix (visible at all times).  
    - Dice roller (for Games 2/3).  
    - Leaderboard (updated after each game).  
  - **During Debrief:**  
    - Key terms: **Backward induction, Shadow of the future, Grim trigger strategy.**  
    - Equations:  
      - *Cooperation condition:* \( p \geq \frac{T - R}{R - P} \)  
        - \( T \) = Temptation (5 or 25), \( R \) = Reward (3), \( P \) = Punishment (1).  
      - Game 2: \( p = 0.9 \), \( \frac{5-3}{3-1} = 1 \); \( 0.9 \geq 1 \)?
        **→ No!** (But condition is for *grim trigger*; tit-for-tat may still hold. Explain in debrief.)  
      - Game 3: \( \frac{25-3}{3-1} = 11 \); \( 0.9 \geq 11 \)? **→ No → Collapse!**  

  ---

  ### **5. Debrief Script (30 Minutes)**  
  **Goal:** Connect gameplay moments to theory. Use Socratic questioning.  

  **(1) Game 1: Backward Induction (5 min)**  
  - *"In Game 1 (fixed end), how many pairs defected in Round 10? Why?"*  
    → Highlight: **No future punishment → mutual defection dominant.**  
  - *"Did defection start earlier? How did your partner react?"*  
    → **Backward induction:** Defection spreads from the final round.  
  - *Key takeaway:* Fixed endpoints destroy cooperation.  

  **(2) Game 2: Shadow of the Future (10 min)**  
  - *"In Game 2 (uncertain end), did cooperation last longer? Why?"*  
    → **Shadow of the future:** Ongoing interaction enables reciprocity.  
  - *"Did anyone defect and then return to cooperation? How?"*  
    → Highlight **forgiveness** (e.g., tit-for-tat players).  
  - *"Why didn’t defection dominate like in Game 1?"*  
    → Math: \( p = 0.9 \) suffices for *tit-for-tat* (not grim trigger).  

  **(3) Game 3: Temptation vs. Future (10 min)**  
  - *"In Game 3, why did cooperation collapse despite uncertainty?"*  
    → **Temptation (25) outweighed future rewards.**  
    → Math: \( p \geq 11 \) required → impossible!  
  - *"Did high stakes change partner trust?"*  
    → Link to real-world: Short-term greed vs. long-term relationships.  

  **(4) Synthesis (5 min)**  
  - *"What makes cooperation sustainable?"*  
    → **No fixed endpoint + high continuation probability + low temptation.**  
  - *"When does theory fail?"*  
    → Human factors: Trust, miscommunication, altruism.  

  ---

  ### **6. Predictable Problems & Fixes**  
  | **Problem**                          | **Prevention/Mitigation**                                                                 |  
  |--------------------------------------|-------------------------------------------------------------------------------------------|  
  | **Game 1: All pairs cooperate**      | - Announce leaderboard mid-game (e.g., Round 5).<br>- Privately urge competitive students: *"Can you gain points by defecting?"* |  
  | **Time overruns**                    | - Use a timer! Enforce 45 sec/round.<br>- Skip Round 10 if behind (Game 1 always ends at 10). |  
  | **Dice ends Game 2 too early**       | - Cap minimum rounds at 5 (ignore "end" rolls before Round 5).<br>- Discuss: *"Short games inhibit cooperation."* |  
  | **Score disputes**                   | - Provide clear payoff cards.<br>- Designate a "score checker" per pair.                  |  
  | **Friendly pairs avoid defection**   | - Stress: *"This is lab, not real life – prioritize points."*<br>- Reward top-ranked defectors. |  

  **Biggest Risk: Game 1 Cooperation**  
  - **Solution:** Mid-game leaderboard update + peer pressure. If still no defection, use it to discuss: *"Why did you cooperate? Did backward induction fail? Was trust stronger than logic?"*  

  ---

  ### **7. What the Game Can’t Show (Supply This Yourself)**  
  - **Evolution of reciprocity:** The game shows *how* cooperation works, not *why* it evolves.  
    → **Supplement:** Post-debrief, explain *Axelrod’s tournaments*: Tit-for-tat wins in repeated PD, but dies with noise.  
  - **Communication:** Real dilemmas allow bargaining/cheap talk.  
    → **Supplement:** *"What if you could talk? Would threats/promises change outcomes?"*  
  - **Social norms:** Students may imitate peers.  
    → **Note:** *"In reality, culture and norms shape cooperation beyond payoffs."*  

  ---

  ### **8. Optional Add-Ons**  
  **A. Round-Robin Evolution (5 min, if time):**  
  - **Process:**  
    1. Each student writes a strategy on an index card (e.g., "Always C", "Tit-for-tat", "Defect after Round 5").  
    2. Pairs shuffle: Each pair plays 2 rounds of PD (using Game 2 rules).  
    3. Top 3 strategies (by points) "replicate" – bottom 3 adopt them.  
  - **Why add?** Shows how reciprocity spreads. Fits in 5 min if prepped.  
  - **Risk:** Time pressure. Skip if debrief runs late.  

  **B. Noise Wrinkle (Add to Game 4 if time permits):**  
  - **Process:** Add a 10% "error rate": After moves, roll dice – on 10, one player’s action is flipped (C→D or D→C).  
  - **Why add?** Demonstrates why tit-for-tat fails in noisy settings (e.g., accidental defections trigger feuds).  
  - **Debrief link:** *"Forgiving strategies (e.g., tit-for-two-tats) beat tit-for-tat in real life."*  

  ---

  ### **Final Recommendations**  
  - **Stick to 3 games + debrief.** Add round-robin/noise only if you save time (e.g., smooth gameplay).  
  - **Print materials ahead:** Scorecards + payoff summaries speed things up.  
  - **Embrace chaos:** If Game 1 has no defectors, use it to discuss trust vs. rationality. If Game 2 unravels, ask: *"Did someone defect first? Why?"*  
  - **Core message:** Cooperation isn’t about "character" – it’s about the **structure of interaction**.  

  This plan ensures students experience backward induction and the shadow of the future firsthand, with minimal lecture. The debrief ties gameplay to theory, and the leaderboard injects stakes. Run it as-is, and you’ll have vivid examples to reference all semester!
