prompt: |-
  I sit on the research-methods committee of a mid-sized institute, and I am trying to draft our evidence policy without smuggling in philosophical commitments I could not defend if challenged. The policy currently has four clauses, and it is the combination that troubles me.

  (1) Registration. Before data collection, investigators must lodge a dated protocol naming the hypothesis, the primary outcome and the analysis. Any analysis departing from the lodged protocol must be reported as exploratory.

  (2) Novelty. In judging whether a study supports a hypothesis, we discount results drawn from data the hypothesis was constructed to fit, and give full weight to results it did not anticipate. Hence our modelling group insists on out-of-sample validation, we distrust a backtested trading rule however well it fits the history, and we ask of any striking fit between theory and data whether the theory was built around those data.

  (3) Bayesian analysis. Our statisticians are Bayesians. They report posterior probabilities obtained by conditioning on the data, and their arithmetic returns the same posterior whether the data reached them before or after the hypothesis was written down.

  (4) Forecasting. Our in-house forecasting tournament pays out on a proper scoring rule, which rewards a forecast of a given accuracy identically whether it was lodged before or after the outcome was knowable — and yet we disqualify any forecast lodged once the outcome was in fact known.

  Clause (3) appears to make (2) pointless, and (4) contains what looks like the same contradiction in miniature: the scoring rule is indifferent to when the forecast was made, the eligibility rule is not. I want to defend the whole package, but I cannot presently say what it presupposes. I am told the underlying difficulty is a familiar one, but the formulations I have read all concern a single agent who already knows the data, and none of them addresses an institutional package of this shape.

  So: what view of evidence, and of the relation between evidence and the timing of belief, does this package commit us to? Address in particular (a) whether novelty is a genuine epistemic requirement on evidence or merely a device for detecting the human vice of fitting hypotheses to data already seen — and if the latter, what that implies for the scrupulously honest investigator who happened to know the data beforehand, whose posterior is, by clause (3), identical to that of a colleague who did not; (b) whether (2) can be made consistent with (3) by relocating novelty from the data to the process that produced the hypothesis, and what that relocation costs — in particular, whether the resulting view remains a view about what supports what, rather than merely about which researchers to trust; (c) what (2) implies for evidence that is old for one investigator and new for another, or old for the community and new for a newcomer; and (d) whether the demand for novelty presupposes that a hypothesis can be confirmed by data it was not designed to accommodate, and if so whether that is a substantive thesis about confirmation or a definitional stipulation in disguise.

  Tell me which clause, if any, I should abandon, and what abandoning it would cost. Distinguish what the package strictly presupposes from what it merely fits comfortably with, and say where it is philosophically underdetermined — that is, where several incompatible theories of evidence would license exactly this policy.
reasoning: |-
  Okay, the user is part of a research-methods committee and is drafting an evidence policy. They've presented four clauses that seem to conflict internally, especially between Bayesian analysis and the requirement for novelty. Let me start by unpacking each clause and identifying the tensions.

  First, clause (1) about registration makes sense. Pre-registering hypotheses and analyses prevents p-hacking and ensures that any deviations are flagged as exploratory. That's standard in open science practices. Then clause (2) emphasizes novelty, requiring out-of-sample validation and discounting results where hypotheses fit existing data. This is about preventing overfitting and ensuring generalizability.

  Clause (3) states their statisticians are Bayesians, reporting posterior probabilities. The key point here is that Bayesians treat evidence the same regardless of when the hypothesis was formed relative to the data. The posterior depends only on the data and prior. But this directly clashes with clause (2), which discounts data that the hypothesis was built to fit. So why require novelty if Bayesian updating doesn't care about timing?

  Clause (4) about forecasting adds another layer. They use proper scoring rules that are indifferent to when the forecast was made, but disqualify forecasts made after the outcome is known. That's a practical rule against cheating, but philosophically, it seems inconsistent with the scoring rule's time-indifference.

  The user's main concerns are the contradictions between (2) and (3), and the mini-version in (4). They need to reconcile these without indefensible philosophical commitments. Let me break down their sub-questions.

  For (a), is novelty an epistemic requirement or a detector of human vice? If it's the latter, an honest researcher who knows the data beforehand has the same posterior as one who doesn't, so discounting their result seems unfair. But in practice, it's hard to trust that honesty, hence the institutional rule. The policy might be targeting reliability of the process rather than the individual's epistemic state.

  For (b), can relocating novelty to the hypothesis-generation process save clause (2)? This shifts from data novelty to methodological integrity. But then it's about trust in researchers, not the evidence itself. That might work for the policy's purpose, but it changes the justification for (2).

  Question (c) deals with differing novelty perceptions. If data is old for one researcher but new for another, how does the policy handle that? The committee probably needs a community-level standard, like whether the hypothesis was formed before the data was known to the field. But that's tricky for newcomers or historical data.

  For (d), does novelty presuppose that hypotheses can be confirmed by unanticipated data? That seems essential for predictive power, but it's a substantive claim about scientific confirmation. Bayesians might see it as emerging naturally from updating, but the policy enforces it institutionally.

  The user needs to know which clause to abandon, if any. Maybe reframe (2) as a procedural safeguard rather than an epistemic necessity. Emphasize that while Bayesian updating is time-symmetric, human psychology isn't. The policy addresses communal knowledge generation, not individual rationality.

  Also, forecasting's disqualification rule in (4) is practical, not contradictory. Proper scoring rules evaluate the forecast's quality, but eligibility ensures the forecast was made without hindsight. Both are necessary for different reasons.

  Ultimately, the package can be defended by separating individual epistemology from institutional standards. The committee should clarify that clauses (2) and (4)'s timing rules are about maintaining credible processes, not contradicting Bayesian principles. Abandoning (3) isn't necessary; instead, recontextualize (2) as a heuristic against bias, justified by cognitive limitations.
answer: |-
  Your policy package is philosophically coherent but requires careful articulation of its underlying commitments. The tensions arise from conflating *epistemic justification* (Clause 3) with *institutional safeguards* (Clauses 1, 2, 4). Here’s a defense grounded in **process reliabilism** and **social epistemology**, resolving your concerns:

  ---

  ### **Core Philosophical Commitments**
  1. **Evidence as Objective, Reasoning as Fallible**:  
     The policy presupposes that while *evidence itself* (via Bayes) is timeless (Clause 3), *human reasoning* is vulnerable to bias, overfitting, and hindsight distortion (Clauses 1, 2, 4).  
  2. **Institutional Epistemology**:  
     Truth-seeking requires regulating *how knowledge is produced*, not just the final output. Novelty (Clause 2) and registration (Clause 1) ensure the *process* reliably generates credible results.  
  3. **Separation of Roles**:  
     - *Statisticians* (Clause 3) report *formal evidential weight*.  
     - *The institution* (Clauses 1, 2, 4) regulates *admissibility* of claims into the communal knowledge base.  

  ---

  ### **Resolving the Tensions**
  #### **(a) Novelty: Epistemic Requirement or Bias Detector?**  
     - **It is primarily a bias detector**. For the *scrupulously honest investigator* who knew the data beforehand, their posterior (Clause 3) is *epistemically valid* for *them*.  
     - **But institutionally**, their result lacks *communal credibility*. Humans cannot reliably self-audit for data-snooping (empirically demonstrated in psychology). Clause 2 protects the *community* from false positives, regardless of individual honesty.  
     - *Cost*: The honest investigator is penalized, but this is a trade-off for institutional reliability.  

  #### **(b) Relocating Novelty to Hypothesis Generation**  
     - **Yes, this resolves the contradiction**. Clause 2 targets *how the hypothesis was generated*, not the data itself.  
       - Example: A hypothesis *constructed* to fit dataset D gains little support from D, but if *independently conceived* then tested on D, D strongly supports it.  
     - **Cost/Limitation**: This shifts focus from "what supports what" to "which researchers/processes to trust." However:  
       - It remains a view about *evidential significance in practice*: Data can only support a hypothesis if the hypothesis wasn’t *reverse-engineered* for that data.  
       - *Philosophically*, it aligns with Deborah Mayo’s *severity requirement*: Evidence is stronger if the test could have falsified the hypothesis.  

  #### **(c) Novelty for Individuals vs. Community**  
     - **The policy implies a community-level standard**:  
       - Data is "novel" if the hypothesis was *publicly registered* (Clause 1) *before* the data was accessible to the research community.  
     - **Implications**:  
       - For a *newcomer*, old data can support a hypothesis *they* didn’t tailor to it—but only if the hypothesis was *registered before their access*.  
       - **Institutional solution**: Clause 1 fixes the "birthdate" of the hypothesis, making novelty objective and communal.  

  #### **(d) Does Novelty Presuppose Confirmability by Unanticipated Data?**  
     - **Yes, and this is substantive, not stipulative**.  
       - The policy assumes hypotheses *can* be tested on data they weren’t designed for (e.g., out-of-sample validation).  
       - *Philosophical basis*: This reflects a *falsificationist* or *predictionist* view of science (e.g., Popper, Lakatos). A hypothesis gains strength by successfully predicting *new* patterns.  
       - *Bayesian compatibility*: Unanticipated data often has low prior probability, leading to higher likelihood ratios → stronger confirmation.  

  ---

  ### **Addressing Clause 4 (Forecasting)**  
  - **No contradiction**:  
    - The *scoring rule* (timeless) evaluates *forecast quality*.  
    - The *eligibility rule* (temporal) ensures *process integrity*. A "forecast" after the outcome is known is not a genuine prediction—it’s a claim about the past.  
  - **Parallel to Clause 2**: Both exclude results corrupted by access to the answer during hypothesis formation.  

  ---

  ### **Recommendations: What to Keep, What to Reframe**  
  | **Clause** | **Verdict** | **Modification/Cost of Abandonment** |  
  |------------|-------------|--------------------------------------|  
  | **(1) Registration** | **Keep** | Foundational for operationalizing novelty. Cost of abandonment: Unverifiable hypotheses. |  
  | **(2) Novelty** | **Reframe** | Clarify it targets *hypothesis-generation processes*, not data. Cost of abandonment: Explosion of false positives from data dredging. |  
  | **(3) Bayesian Analysis** | **Keep** | Unproblematic; provides formal evidential calculus. |  
  | **(4) Forecasting** | **Keep** | Contradiction is illusory; eligibility ensures genuine forecasts. |  

  **Abandon nothing**—the package is defensible if framed as:  
  > *"Bayesian reasoning (Clause 3) defines ideal evidential support; Clauses 1, 2, and 4 ensure the reasoning is executed by unbiased processes."*  

  ---

  ### **Philosophical Underdetermination**  
  The policy is compatible with:  
  1. **Process Reliabilism** (Goldman): True beliefs arise from reliable methods (e.g., preregistration).  
  2. **Social Epistemology** (Kitcher): Knowledge depends on institutional structures.  
  3. **Frequentist Hybrids**: Severity testing (Mayo) complements Bayesian reporting.  
  4. **Critical Rationalism** (Popper): Emphasis on falsifiable predictions.  

  **It rules out**:  
  - Purely subjective Bayesianism (ignores process corruption).  
  - Naive positivism (treats all statistically significant results equally).  

  ---

  ### **Final Defense**  
  Your package commits to:  
  > **"Institutional knowledge must be produced by methods that minimize human bias, even if formal statistics are timeless. Novelty is a guardrail against overfitting, not a property of evidence itself."**  

  This is philosophically sound, empirically justified, and pragmatically necessary for scientific integrity.
