  Next, reductionist critiques about individual gullibility or the need for prior experience. These are weaker because anti-reductionists can counter with normative claims—even if we sometimes shouldn’t trust, default entitlement is necessary for knowledge acquisition. The user mentioned psychological realism; reductionism demanding evidence for every source is impractical. Anti-reductionists use this to their advantage.

  Now, the chatbot case. If anti-reductionism says default trust applies only to humans, what's the principle? Fluency isn't enough; maybe only agents with understanding and social norms qualify. But that raises issues—what about reliable non-human sources like sensors? Anti-reductionists might bite the bullet: chatbots aren't testimonial sources. But the user worries this is ad hoc. The deeper issue is whether trust is inherently social, tied to accountability. That could be a key insight.

