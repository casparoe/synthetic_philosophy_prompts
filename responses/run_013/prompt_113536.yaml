answer: |-
  ### The assumptions that carry the theorem
  The Gibbard-Satterthwaite theorem (GS) relies critically on its **Unrestricted Domain assumption**: every possible strict preference ordering over the alternatives must be admissible for voters. This creates the complexity enabling strategic manipulation. The theorem also requires **three or more distinct alternatives** (satisfied here with seven) and applies to any **resolute voting rule** (producing a single winner) that is **non-dictatorial** (no single voter always decides) and **onto** (every alternative can win under some preferences). Without Unrestricted Domain, the negative conclusion—that no strategy-proof, non-dictatorial rule exists—does not necessarily hold. The other assumptions are generally considered minimal requirements for a reasonable voting system.

  ### Most important implications for our design
  **The most crucial implication is that the single-peakedness of preferences fundamentally changes the landscape.** GS's devastating pessimism hinges on Unrestricted Domain, allowing chaotic preference conflicts that force trade-offs between strategy-proofness and other desiderata. Your environment, with preferences plausibly single-peaked along a clear dimension, *relaxes* this core assumption. This makes strategy-proofness achievable with reasonable rules and significantly reduces the incentive and effectiveness of strategic voting compared to the unrestricted case. You are *not* trapped by GS's impossibility in this structured setting.

  Therefore, you should **prioritize leveraging the single-peaked domain.** Rules exist that are both strategy-proof *and* satisfy other important properties under single-peakedness. The most directly relevant is **Moulin's characterization:** strategy-proof, anonymous, and efficient rules correspond to electing the median peak relative to fixed "phantom" voters (median voter theorems). Furthermore, **Condorcet methods** (like Black's procedure, which picks the Condorcet winner or the Borda winner if none exists) become highly robust and likely to select the median peak under single-peakedness. Crucially, many Condorcet methods have strong resistance to manipulation in this domain, even if not perfectly strategy-proof.

  **Transparency requirement:** GS doesn't directly address complexity, but your need for hand-verification strongly points towards **simple positional or pairwise comparison rules.** Borda Count (summing ranks) or Black's Procedure (pairwise majority comparisons, potentially using a matrix) are feasible to compute manually with 400 voters and 7 options. While Borda is vulnerable to manipulation under Unrestricted Domain, its vulnerability is *significantly reduced* with single-peaked preferences, especially compared to simpler plurality voting. Black's method, converging to the median under single-peakedness, is often very strategy-resistant here.

  **Designer freedom:** Since you shape the choice environment, rigorously **validate and reinforce single-peakedness.** Frame the policy packages clearly along the single dimension. Ensure communication highlights this spectrum. If feasible, structure candidate proposals or pre-voting discussions to maintain alignment. This environmental design actively mitigates GS's core trigger.

  ### What the theorem does not settle
  GS does *not* imply strategy-proofness is impossible in your case. Single-peakedness breaks the theorem's key assumption, opening the door for strategy-proof rules (like the median rule with phantoms) or highly strategy-resistant rules (like Condorcet methods). It also does not dictate *which* non-strategy-proof rule to choose if you forgo perfect strategy-proofness for simplicity; many rules perform well under single-peakedness. Transparency is entirely outside GS's scope – it says nothing about computational feasibility. Furthermore, GS does not preclude achieving other desirable properties (like Condorcet consistency, Pareto efficiency) alongside reasonable strategy resistance in your structured domain. The choice between different "good" rules (e.g., median, Borda, Black) depends on balancing residual manipulability, other criteria, and your specific transparency needs.

  ### Bottom line
  Leverage your single-peaked preference domain to escape GS's impossibility. Prioritize a simple, transparent rule that capitalizes on this structure, such as Black's procedure or potentially Borda Count. These are hand-verifiable and robust to manipulation under single-peakedness. Actively design the choice environment to maintain preference alignment. GS's pessimism applies mainly to chaotic preference landscapes, not your structured scenario; proceed confidently with rules suited for single-peakedness.
