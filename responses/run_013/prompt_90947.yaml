prompt: |-
  I'm a novelist, not a biologist, and I've got a character who's an evolutionary biologist and spends most of a chapter arguing with a colleague about what natural selection actually selects. I need one good worked example to put in her mouth, and I want it to be airtight, so I'm asking you to build it to spec instead of handing me the usual one. Heres the purpose first, since it tells you what counts as cheating: the example has to make the disagreement real on the page, so it cant just stipulate that gene's-eye talk and group-selection talk are two names for the same thing — the two views have to be made to say different things about the same case.

  So, the spec. Give me one single case, a real kind of organism, realistic ecology (no infinite populations, no hand-waving, and please stay away from the examples everyone already knows — sterile ants, blood-sharing bats, the myxoma rabbits), where some trait spreads through a population, and:

  - a gene-level / inclusive-fitness account and a multilevel or group-selection account both get the spread right,
  - but they come apart on the counterfactual — there's one parameter (say how much migration there is between groups, or how the groups get formed in the first place) such that if you nudge it, the two accounts predict different outcomes, or agree on this trait but disagree about what happens to a different trait in the same species,
  - and the disagreement isnt about whether group selection exists in general, its about this case specifically.

  Keep the scenario itself to a paragraph. Then walk it through: state the trait, the selection pressure, and for each account say what it claims is being selected and why. Then do the counterfactual and show exactly where the two peel apart. Tell me which single feature of the case is doing the work — thats the bit my character can lean on — and what happens to the whole thing if I remove that feature. And since she's arguing with someone who will push back, give me the best line the losing side has: how does a defender of that account attack the case and try to show the disagreement is merely verbal?

  Last thing: at the end, tell me how confident you actually are in the verdicts you're giving, and single out the one claim you're least sure about. She cant afford to be wrong in front of a reader who knows this stuff.
reasoning: |-
  Okay, the user is a novelist needing a scientifically rigorous evolutionary biology example for a debate between characters. They want a scenario where gene-level and group-level selection accounts both explain a trait's spread but diverge in counterfactuals. Key requirements: avoid clichéd examples, ensure ecological realism, and highlight a specific parameter change that causes conflicting predictions.

  Hmm... the sterile ants and rabbit examples are off-limits. Need something fresh. Lichen symbiosis comes to mind - it's visually striking and involves a tight mutualism between fungi and algae/cyanobacteria. The trait could be the fungal partner's investment in protective structures (cortex thickness) that shield the photosynthetic partner.

  For the counterfactual, dispersal mode seems perfect. Horizontal transmission (free-living partners reassembling) vs. vertical transmission (joint propagules) creates different selection pressures. In vertical transmission, fungal genes benefit directly from protecting their algal partners since they co-disperse. But in horizontal transmission, a protective fungus might lose its partner to competitors - creating a tragedy of the commons scenario.

  The parameter tweak is migration rate between habitats. Low migration favors group selection (cooperative groups outcompete selfish ones). High migration destroys group structure, making cooperation vulnerable to cheating. Crucially, the gene-centric view predicts cooperation collapses in high migration regardless of transmission mode, while group selection allows cooperation to persist under vertical transmission even with high migration.

  Most confident in the dispersal mechanism's role - it's well-established in symbiosis literature. Least certain is whether high migration truly destroys group structure in vertical transmission; some models suggest partner fidelity might persist. The best counterargument from gene-centric advocates would be that vertical transmission just represents extended kin selection via assured fitness returns.

  This should satisfy the user's needs: novel organism, clear mechanistic difference, and a defensible scientific foundation. The lichen example avoids all the overused cases while providing rich descriptive potential for a novelist.
answer: |-
  Here's a tailored example meeting your specifications, focusing on **lichen-forming fungi and their algal/cyanobacterial photobionts**:

  **The Scenario:**  
  Consider a population of a specific lichen-forming fungus (*Lecanora dispersa*) living in patchy, arid habitats. The key trait is **the fungal partner's investment in producing a protective cortex layer** that shields the photosynthetic algal partner (*Trebouxia*) from UV radiation and desiccation. This investment costs the fungus energy/resources but drastically increases the survival and photosynthetic output of the algal cells within the lichen thallus ("body"). Crucially, reproduction occurs via both:  
  1.  **Joint Propagules (Vertical Transmission):** Fragments containing *both* fungal hyphae & algal cells disperse together.  
  2.  **Free-Living Stages (Horizontal Transmission):** Fungal spores disperse alone and must find new algal partners to form lichens.  

  **Selection Pressure:**  
  In harsh environments, lichens with a thicker protective cortex survive droughts better and grow faster due to sustained algal photosynthesis. However, producing the cortex diverts resources the fungus could use for producing more spores.

  **The Accounts & Why the Trait Spreads:**  

  1.  **Gene-Level / Inclusive Fitness Account:**  
      *   **What's Selected:** Genes in the *fungal genome* promoting investment in the cortex *when partnered with a specific algal lineage*.  
      *   **Why:** In joint propagules (vertical transmission), fungal genes are directly passed alongside the algal cells they protect. Protecting "their" algae ensures the survival and reproduction of the symbiotic unit carrying those fungal genes. The cost to the fungus is offset by the assured fitness return via the protected algae co-dispersing with the fungus. Kin selection applies because the algae within a single thallus are often clonal (genetically identical), so protecting them is like protecting kin. Genes for investment spread because they promote the survival of copies of *themselves* in the next generation via the successful joint propagule.  
      *   **Key Mechanism:** **Partner Fidelity Feedback.** The fungus reliably reaps the benefits of its own investment because it stays with the algae it protects.

  2.  **Multilevel / Group Selection Account:**  
      *   **What's Selected:** The *lichen thallus* (fungus + algae symbiont) as a cooperative unit.  
      *   **Why:** Thalli with thicker cortices (cooperative groups) survive harsh conditions better and produce more joint propagules than thalli with thinner cortices (less cooperative groups) or thalli where the fungus "cheats" by investing minimally. Groups (thalli) with high cooperation outcompete groups with low cooperation. Selection *among groups* favors the cooperative trait (cortex investment), even though *within* a thallus, a fungal "cheater" allele not investing in cortex could potentially free-ride on the group benefit. However, in stable symbioses formed via joint propagules, such within-group cheaters are rare or outcompeted by the cooperative fungal lineages within the group.  
      *   **Key Mechanism:** **Differential Productivity & Extinction of Groups.** Cooperative groups (thalli) are more productive and less likely to die, generating more offspring groups.

  **The Counterfactual Divergence: Changing Dispersal Dynamics (Migration of Free Partners)**  

  *   **Parameter Nudge:** **Increase the prevalence of successful horizontal transmission events.** Imagine a change in the environment (e.g., increased humidity reducing stress, or a new wind pattern) making it much easier for *free-living fungal spores* to find and form new lichens with *free-living algae* (horizontal transmission). This effectively increases "migration" of free partners between potential groups.
  *   **Predictions:**  
      *   **Gene-Level Account:** The trait (cortex investment) **collapses**. Why? With frequent horizontal transmission, the Partner Fidelity Feedback is broken. A fungus investing heavily in protecting *its current* algae is now at a disadvantage. It pays the cost, but when the lichen reproduces via spores, those spores disperse alone. Meanwhile, a "cheater" fungus allele that invests minimally in cortex can use the saved resources to produce *more spores*. These cheater spores then easily find new algae in the environment (abundant due to the change), forming new lichens. The cheater allele spreads rapidly because it avoids the cost of cooperation when the benefits (the specific protected algae) are not reliably passed on to its offspring. Kin selection is also weakened as fungi frequently partner with unrelated algae.
      *   **Multilevel Account:** The trait **persists only in lineages reproducing via joint propagules, but collapses elsewhere**. Why? Group selection still strongly favors cortex investment in thalli formed from joint propagules (vertical transmission). These groups maintain high cooperation and outcompete less cooperative groups formed the same way. *However*, for thalli formed via the now-prevalent horizontal transmission, group selection is weak or absent. New groups form randomly from the mixed pool of "cooperator" and "cheater" fungi and algae. Cheater fungi, producing more spores, quickly invade and dominate these horizontally formed groups, preventing the stable, cooperative group structure required for group selection to act on cortex investment. The overall frequency of the trait decreases significantly as horizontal transmission increases, but remains high in the vertical transmission sub-population.

  **The Crucial Feature Doing the Work:**  
  **The mode of reproduction/dispersal (Vertical vs. Horizontal Transmission) and its impact on Partner Fidelity.** This feature creates the conditions where the feedback loops essential for the gene-level account (protecting *your* partner) and the group-level account (stable, productive cooperative groups) either hold strong or break down. Remove distinct dispersal modes (e.g., if *only* joint propagules existed), and both accounts converge on predicting persistent cooperation. Make horizontal transmission the *only* mode, and both accounts converge on predicting the collapse of cooperation (though for slightly different reasons - gene-level: lack of partner fidelity; group-level: dissolution of stable group structure and invasion by cheaters).

  **The Best Line for the Losing Side (Gene-Level Advocate Attacking the Group Account):**  
  "The 'group selection' you describe is just a convoluted way of describing kin selection and partner fidelity dynamics scaled up. The fungal genes for investment spread *only* because they enhance the fitness of *copies of themselves* found in the protected algae (via vertical transmission) or in closely related fungal kin within the thallus. Calling the thallus a 'group' subject to selection adds nothing but misleading terminology. The differential survival of thalli is simply a *consequence* of the aggregate inclusive fitness of the fungal genes within them. When horizontal transmission breaks the fidelity and relatedness, those genes lose their advantage – exactly as inclusive fitness predicts. The 'group' isn't the unit; the genes riding the vertical transmission vehicle are."

  **Confidence Assessment & Caveat:**  

  1.  **Overall Confidence in Divergence:** **High.** The theoretical framework (Price Equation, MLS theory) clearly shows how changing dispersal/migration structure alters the balance between within-group and between-group selection, leading to different predictions from the two perspectives in scenarios like this. The crucial role of partner fidelity/vertical transmission for cooperation in symbioses is empirically well-established (e.g., legume-rhizobia, corals).
  2.  **Confidence in Specific Organism Dynamics:** **Moderate-High.** While lichens are complex, the core dynamics (cortex protection, costs of production, vertical vs. horizontal transmission) are biologically realistic and based on known lichen biology. The specific predictions rely on standard evolutionary models applied to mutualisms.
  3.  **Least Confident Claim:** **The precise speed and inevitability of trait collapse under high horizontal transmission.** While the *direction* of change (decrease in cooperation) is robust, the *extent* and *speed* in a real population depend on complex factors: the exact cost/benefit ratio of cortex investment, mutation rate for cheater alleles, spatial structure, and potential counter-adaptations in the algae (e.g., sanctions against low-investment fungi). A defender of the gene-centric view might argue that even under horizontal transmission, some residual relatedness or partner choice could slow the collapse, while a group selection proponent might argue that meta-group structures could emerge. **Therefore, the character should state the prediction as the *strong tendency* for cooperation to collapse under high horizontal transmission according to the gene-centric view, versus its persistence under vertical transmission according to the group view, acknowledging the real-world complexity.** The core theoretical *divergence* itself, however, remains solid.

  This example provides a biologically plausible, non-standard case where the two perspectives make genuinely different predictions about what happens when a key ecological parameter (dispersal mode affecting partner fidelity and group formation) is altered, allowing your character to argue the substance beyond semantics.
