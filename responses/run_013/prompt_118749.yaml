  The classmate presents three clever thought experiments: a non-dissolving soluble tablet, a non-conductive conductive wire, and a dissolving insoluble pebble. These cases are meant to show that the simple counterfactual analysis fails. The argument then proceeds through a series of steps to conclude that dispositions don't exist at all.

