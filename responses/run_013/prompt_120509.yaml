  Here is the adversarial collaboration document, structured as requested and tailored to your cases:

  ### Joint Statement: One-Object (A) vs. Two-Object (B) Views in Material Constitution  
  *Agreed upon by representatives of both sides for the purpose of clarifying disputes*

  ---

  ### (1) Agreed Non-Trivial Claims  
  *(Genuinely endorsed by both sides; vague agreements excluded)*  
  1. **Case (a) Gallery Bronze**:  
     - The bronze alloy physically located on the pedestal in 2023 was also physically located in the foundry in 1901.  
     - The sentence "The bronze was in the foundry in 1901, and the sculpture wasn’t" is true.  

  2. **Case (b) Sudden Declaration**:  
     - Before Tuesday, there was a lump of clay in the studio, but no sculpture.  
     - After Friday’s "un-declaration," there is no sculpture present.  
     - The lump persists unchanged through Tuesday’s declaration and Friday’s un-declaration.  

  3. **Case (c) Restoration**:  
     - After replacing 40% of the metal, the gallery still displays *the same artwork* (e.g., "Statue X").  
     - The post-restoration object is not composed of *all the same atoms* as the pre-restoration object.  

  4. **Case (d) Double Cast**:  
     - The two casts are numerically distinct (i.e., not identical).  
     - Both casts share all intrinsic physical properties at the moment of creation.  

  5. **Case (e) Squash Case**:  
     - If a statue is crushed into a cube of metal, there is no longer a statue present.  
     - The cube of metal is composed of the same matter that previously composed the statue.  

  ---

  ### (2) Precise Points of Disagreement  
  *(Each side’s position in their own terms)*  

  | Issue | Side A (One-Object) | Side B (Two-Objects) |
  |-------|----------------------|----------------------|
  | **Ontology of the Pedestal** | "There is exactly one material object on the pedestal. ‘Statue’ and ‘lump’ are distinct *concepts* or *descriptions* applied to this single object, reflecting different persistence conditions we associate with it." | "There are two numerically distinct material objects co-located on the pedestal: a statue and a lump. They share all matter at t₁ but differ in persistence conditions and modal properties." |
  | **Existence Conditions** | "An object exists if there is matter arranged in some way. Sortals (like ‘statue’ or ‘lump’) are ways of *conceptually parsing* this matter, not indicators of separate entities." | "Objects come into existence only when specific *identity conditions* are satisfied (e.g., artistic intent for statues). Co-located objects can exist if distinct sets of identity conditions are met by the same matter." |
  | **Temporal Claims (Case a)** | "The truth of ‘The bronze existed in 1901 but the sculpture did not’ is explained by the *contingent application* of the sortal ‘sculpture’ to the matter. The object itself existed in 1901, but not *as a sculpture*." | "The truth of the sentence implies the lump existed in 1901 while the statue did not, proving they are distinct objects with different creation times." |
  | **Case (b) Declaration/Undeclaration** | "The declaration changes only how we *describe* or *classify* the lump. No new object is created/destroyed; we merely apply/withdraw the ‘statue’ concept." | "The declaration creates a new object (the statue) supervening on the lump. Undeclaration destroys the statue while the lump persists." |
  | **Case (c) Restoration** | "The artwork persists because we *reapply* the same artistic sortal to the restored matter. The lump persists if enough original matter remains (agreement vague: see §1.3)." | "The statue persists by artistic criteria. The lump ceases to exist if >50% matter is replaced (constituting a new lump), confirming distinct persistence conditions." |

  ---

  ### (3) Cruxes: Testable Predictions  
  *(Sub-questions that would resolve disagreements; both sides agree these bear on the dispute)*  

  | Crux | Agreed Test | Side A Prediction | Side B Prediction |
  |------|-------------|-------------------|-------------------|
  | **Creation/Destruction (Case b)** | If the sculptor declares the lump a work at t₁ and undeclares at t₂, does an object *come into/out of existence* at t₁/t₂? | No ontological change: only conceptual redescription. Physical measurements detect no change. | Yes: a statue-object is created at t₁ and annihilated at t₂. Supervenience events may be detectable indirectly (e.g., via causal powers). |
  | **Matter Replacement (Case c)** | If 100% of the statue’s matter is replaced gradually (ship of Theseus style), does the *original lump* persist? | Vague: Depends on definition of "lump." (A: Typically "no" if all matter replaced) | No: The lump ceases to exist when its matter is fully replaced. The statue persists if restoration criteria are met. |
  | **Indiscernibles (Case d)** | At the *exact moment* of creation, are the two casts one object or two? | One object temporarily: Sortal individuation requires spatiotemporal separation or causal history. | Two objects immediately: Distinct identity conditions are satisfied at creation (e.g., two artistic acts). |
  | **Squash Case (e)** | After squashing, is it true that "The statue was destroyed, but *what was the statue* still exists (as a cube)?" | Yes: "What was the statue" refers to the persisting matter/lump under a past-tense description. | No: The statue *does not exist*. The cube is *a different object* (a lump) made of the same matter. |

  ---

  ### (4) Verbal Dispute Diagnosis  
  Both sides agree the following is (at least partially) verbal:  
  - **The meaning of "object"**:  
    Side A uses "object" to denote a *maximally matter-inclusive entity* (e.g., "the entire portion of bronze"), with sortals being predicates we assign.  
    Side B uses "object" to denote *entities individuated by persistence conditions* (e.g., "statue" and "lump" as distinct ontological kinds).  
    **Why verbal?** If Side A adopts B’s definition, they might agree two "objects" exist but deny this multiplies *substances*. If Side B adopts A’s definition, they might call the statue a "phase" of the lump but insist it has distinct identity conditions. The core dispute is whether persistence conditions are ontological or descriptive.

  ---

  ### Document Notes  
  - **Omissions**: Claims about "identity over time" or "essences" are excluded as insufficiently agreed.  
  - **Vagueness Flagged**:  
    - §1.3 (Restoration): Agreement on "same artwork" but not on "same lump."  
    - §3.2 (Matter Replacement): Side A has no unified account of lump persistence.  
  - **Cruxes**: Designed as "double-blind" tests where both sides predict opposite outcomes.  
  - **Neutrality**: No endorsement of either view; formulations reviewed by hypothetical delegates from A and B.

  This document isolates the metaphysically substantive disagreements from terminological and conceptual noise. Use it to force clarity in your debates—especially on the cruxes.
