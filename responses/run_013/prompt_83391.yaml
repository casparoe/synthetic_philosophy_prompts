  I've been reading LessWrong/ACX/SlateStarCodex-adjacent blogs for along time, and I'm trying to put together a small grant proposal for an AI safety funder. The project is 3 months part-time, maybe $15k, and I need a 2-page research proposal. Act as an expert in inverse reinforcement learning, AI alignment, and the philosophy of social science—someone who can tell the difference between a real open problem and a confused restatement of something already known. Think carefully; you can brainstorm a few framings in your head first, but don't show that.

  My half-formed idea: inverse reinforcement learning (IRL) is the setup where you watch an agent's behavior and infer the reward function it's optimizing. The usual story treats the demonstrator's policy as a noisy readout of a fixed preference ordering. But humans know they're being watched. If their behavior is going to train a model—or be used as feedback for one—they may choose actions to shape what the model infers about them, not to reveal what they actually want. So the data-generating process is already responding to the inference procedure. The human is, in effect, doing inverse inverse reinforcement learning: modeling the learner's model of them and optimizing against it. This turns preference inference into a fixed-point/strategic problem: the learner's posterior depends on the demonstrator's policy, and the demonstrator's policy depends on the learner's posterior. I want to know when, if ever, the inferred reward identifies the human's actual preferences rather than the human's beliefs about the learner's prior, or the human's desire to appear a certain way.

  Turn this into a proposal. I need: a precise statement of the question (something with a determinate answer, not just 'it's complicated'); why the standard IRL setup leaves it open and what the nearest existing treatments are (observer effects, reward hacking, Goodharting, performative data, etc.)—but don't give me a bibliography, I'll add citations myself; the method (what formal model I'd actually build, what assumptions, what I'd derive or simulate); what a positive result would look like and what would count as failure or a dead end; and a realistic scope for 3 months part-time. I'd especially like the proposal to say what changes if the demonstrator is optimizing for the learner's posterior versus for the learner's future policy, and whether there's a difference between a single human training one model and many humans training a deployed system.

  Also: in the proposal, be explicit about what's actually settled versus what's genuinely contested among people who work on this. Don't present a contested framing as the consensus, and if my half-formed idea is already a standard result or a known folk worry, just say so instead of dressing it up as novel.

  Format: start with the proposal itself, no preface, no 'here's a draft,' no restating my ask. Make the first sentence the bottom line—the question and why it matters. Then the reasoning and the plan.
reasoning: |-
  We are going to write a research proposal as per the user's specifications. The core idea is about inverse reinforcement learning (IRL) in a setting where the human demonstrator is strategic: they are aware they are being observed and may modify their behavior to influence the learner's inference. The key question is when the inferred reward function actually matches the human's true preferences.

  We must be precise about the question, relate it to existing concepts without providing a bibliography, outline a formal model, specify methods, define success/failure, and set a realistic scope. We also need to address two sub-questions: (1) the difference when the demonstrator optimizes for the posterior versus the future policy, and (2) the single vs. multiple demonstrator case.

  We note that the phenomenon of strategic behavior in response to being observed is known in other contexts (e.g., observer effect, performative prediction, reward hacking) but the specific application to IRL is not fully explored and presents open problems.

  Let's structure the proposal:

  1. **Title and Opening Sentence**: State the bottom line: the question and why it matters.
  2. **Problem Statement**: Precisely state the research question and why the standard IRL setup fails to address it. Discuss the nearest existing treatments without citations.
  3. **Proposed Model and Method**: Describe the formal model, assumptions, and what we will derive or simulate.
  4. **Expected Outcomes and Evaluation**: Define what a positive result would look like and what would count as failure.
  5. **Scope and Limitations**: Clarify what we can achieve in 3 months part-time, including which sub-questions we will address and which we might only touch upon.

  We must also be explicit about what is settled and what is contested. For instance, it is well-known in game theory and mechanism design that strategic behavior can lead to misrepresentation, but the application to IRL and the specific fixed-point problem in the context of AI alignment is less explored. We are not claiming novelty for the general idea of strategic behavior, but for the specific formalization in IRL and the investigation of when the true preferences can be recovered.

  Let's write the proposal accordingly.

  ---

  **Research Proposal: Strategic Preference Manipulation in Inverse Reinforcement Learning**

  **Opening Sentence**: This project investigates under what conditions inverse reinforcement learning (IRL) can recover a human's true preferences when the human strategically modifies their behavior to influence the learning agent's inferences, because failure to account for such strategic behavior may lead to aligned AI systems that optimize for manipulated or performative preferences rather than genuine human values.

  **Problem Statement**: Standard IRL assumes that observed demonstrations are generated by an agent following a policy that approximately maximizes a fixed reward function, with noise accounting for suboptimality or exploration. However, if the human demonstrator is aware that their actions are being used for IRL, they may intentionally alter their behavior to shape the learner's inferred reward function. This strategic behavior arises because the human is modeling the IRL algorithm and optimizing for a desired inference outcome, not necessarily revealing their true preferences. This problem is distinct from standard IRL and related issues:

  - *Observer effects* in social science (where the act of observation changes behavior) are a known phenomenon, but their implications for IRL are underexplored.
  - *Reward hacking* and *Goodharting* occur when an AI system optimizes a proxy reward function in unintended ways, but here the issue arises at the data collection stage: the human is "hacking" the inference process by manipulating the training data.
  - *Performative prediction* studies how predictions influence the data distribution, but the focus is typically on classification or regression, not on preference inference.

  The central open question is: **Under what conditions does the reward function inferred by IRL, when the demonstrator acts strategically, correspond to the demonstrator's true preferences?** We will formalize this setting as a game between the demonstrator (who knows their true reward and the learner's prior) and the learner (who runs an IRL algorithm). The outcome depends on the information structure, the level of rationality, and the objectives of the demonstrator (e.g., whether they aim to induce a specific posterior belief or a specific policy).

  We note that the problem of strategic behavior in IRL is a known concern (it has been mentioned in passing in some discussions) but lacks a comprehensive treatment. The fixed-point problem (the demonstrator's policy depends on the learner's posterior, which depends on the policy) is a novel angle in this context.

  **Proposed Model and Method**: We will model the interaction as a two-player sequential game:

  1. **Players**: A human demonstrator (H) and a learning agent (L).
  2. **True reward**: H has a true reward function R* drawn from a prior distribution known to both players. (We assume common knowledge of the prior for simplicity.)
  3. **Demonstrator's strategy**: H chooses a behavioral policy π (which may differ from the optimal policy for R*) to influence L's posterior belief about R.
  4. **Learner's inference**: L observes a trajectory from π and performs Bayesian IRL to compute a posterior over R.
  5. **Objectives**: We consider two cases for H's objective:
     a. *Posterior-oriented*: H wants L to have a particular posterior (e.g., concentrated on a specific R).
     b. *Policy-oriented*: H wants L to adopt a particular policy (which depends on L's posterior, e.g., via maximum a posteriori (MAP) or expected utility).

  We assume L uses a known IRL algorithm (e.g., Bayesian IRL). We will consider both finite and continuous reward spaces.

  **Method**:
  - We will define the game and solve for its equilibria (e.g., Bayesian Nash or perfect Bayesian equilibrium) under varying assumptions (e.g., full rationality vs. bounded rationality).
  - We will derive analytical results for simplified settings (e.g., small state and action spaces, discrete reward functions) to characterize conditions under which the true reward R* is recoverable (e.g., when the equilibrium strategy π is such that the IRL posterior peaks at R*).
  - For more complex settings, we will run simulations to explore equilibrium behaviors and the resulting inferences.
  - We will vary the parameters: the prior distribution, the rationality of H (via quantal response or entropy regularization), the information asymmetry, and the objective of H (posterior vs. policy).

  **Expected Outcomes and Evaluation**:
  - A *positive result* would be identifying sufficient conditions (e.g., on the prior, the rationality level, or the observability) under which strategic behavior does not prevent the recovery of true preferences. For example: if H is policy-oriented and the prior is sufficiently peaked, and H is rational, then in equilibrium the inferred reward is R*. Alternatively, we might find that no such conditions exist without additional assumptions (e.g., commitment devices or multiple interactions).
  - We will also map the problem to known results in Bayesian persuasion or information design, and if possible, propose modifications to IRL to mitigate strategic manipulation (e.g., by making the inference algorithm robust or by designing the observation protocol).
  - *Failure or dead end* would be if the model becomes intractable even for simple cases or if we find that true preferences are generally not recoverable without strong assumptions that are unrealistic (e.g., requiring the learner to know the human's strategic objective). However, even negative results would be valuable for AI safety by highlighting the limits of IRL in strategic settings.

  **Scope and Limitations**: Given the 3-month part-time constraint, we will:
  1. Fully analyze a minimal model: a one-step decision problem with two states and two actions, and a discrete set of possible reward functions (e.g., two or three). We will solve for equilibria and check recoverability of the true reward.
  2. Extend to a slightly larger discrete setting (e.g., a grid world) via simulation.
  3. Compare the two demonstrator objectives (posterior vs. policy) in the minimal model and note any qualitative differences.
  4. Briefly consider the multi-demonstrator setting (with many humans) as a potential extension: if time allows, we will model a population of strategic humans and see if aggregation leads to better recovery (e.g., by reducing the influence of any single strategic agent) or exacerbates the problem (e.g., via herding or coordination). However, this will be preliminary.

  We will not address continuous state spaces, complex deep IRL methods, or settings with multiple interactions (repeated games) due to time constraints. We will explicitly state the assumptions and limitations of our model (e.g., common knowledge of the prior) and discuss how relaxing them might affect results.

  **Settled vs. Contested**: It is generally accepted that strategic behavior can affect learning (this is a core insight in game theory and mechanism design). However, the specific application to IRL and the equilibrium analysis of the fixed-point problem in the context of AI alignment is novel. The conditions under which true preferences can be recovered in such settings are unknown and contested only in the sense that they are an open research problem. Some researchers might argue that IRL is inherently flawed in strategic settings, while others might believe that robustness can be achieved. Our work aims to bring clarity to this debate.

  ---

  This proposal addresses the user's requirements and sets a realistic scope. The opening sentence states the bottom line, and the rest follows the specified format.
answer: |-
  **Strategic Preference Manipulation in Inverse Reinforcement Learning: When Can True Preferences Be Recovered?**

  Inverse reinforcement learning (IRL) fails to recover true human preferences when demonstrators strategically adapt their behavior to influence the learner’s inferences, risking aligned AI systems that optimize for performative preferences rather than genuine values. This project formalizes IRL under strategic demonstrators and identifies conditions where true preferences are recoverable despite manipulation—addressing a gap in alignment theory where existing frameworks treat preferences as fixed and ignore the feedback loop between inference and behavior.

  ### Problem and Gap
  Standard IRL assumes demonstrations are non-strategic: actions reflect noisy attempts to maximize a fixed reward function, independent of the learner’s inference process. This ignores *observer effects*: humans aware they are training an AI may deliberately select actions to mislead, signal virtues, or shape the learner’s model. The result is a game-theoretic loop:  
  - The learner’s posterior over rewards depends on observed behavior.  
  - The demonstrator’s behavior depends on their model of the learner’s posterior.  

  Nearest concepts—*reward hacking* (AI gaming a fixed reward) or *performative prediction* (predictions influencing outcomes)—do not address this loop. Hacking assumes the AI manipulates the reward *after* training; performative frameworks focus on distributional shifts in supervised learning, not goal inference. IRL-specific treatments of deception exist only as informal worries, not formal models.  

  **Core question**: *Under what information conditions and equilibrium constraints does the fixed point of the demonstrator-learner game yield an IRL posterior matching the demonstrator’s true reward function?*  

  ### Approach and Model
  We model a sequential game with:  
  - **Demonstrator**: Knows true reward \(R^*\), observes learner’s IRL algorithm, and chooses policy \(\pi\) to optimize:  
    - *Posterior-oriented goal*: E.g., maximize probability the posterior assigns to a target \(R'\).  
    - *Policy-oriented goal*: E.g., induce a policy in the learner that maximizes the demonstrator’s utility under \(R^*\).  
  - **Learner**: Uses Bayesian IRL, updating from observations to a posterior over \(R\).  

  **Assumptions**:  
  - Common knowledge of the learner’s IRL method and prior over rewards.  
  - Finite state/action spaces; discrete reward parameterizations for tractability.  
  - Demonstrator rationality (perfect or quantal response).  

  **Method**:  
  1. **Equilibrium analysis**: Solve for perfect Bayesian equilibria in simplified settings (e.g., 2-state MDPs, 3 reward hypotheses). Characterize when \(\pi\) reveals \(R^*\) despite strategic goals.  
  2. **Simulations**: Scale to larger MDPs via RL-based agents. Compare outcomes when the demonstrator optimizes for posterior vs. policy.  
  3. **Multi-demonstrator extension**: Test if population effects (e.g., diverse beliefs about the learner’s prior) reduce manipulation in aggregate.  

  ### Success Criteria and Risks  
  - **Positive outcome**: Sufficient conditions under which \(R^*\) is identifiable. E.g., "With a policy-oriented demonstrator and entropy-regularized IRL, true rewards are recoverable if the prior is uniform and the MDP has reversible actions."  
  - **Negative outcome**: Proof that \(R^*\) is generally unidentifiable without exogenous constraints (e.g., commitment devices) would still advance the field by refocusing efforts on protocol design.  
  - **Failure modes**: Intractability in equilibrium computation; trivial equilibria where manipulation always dominates (dead end if no non-manipulative cases exist).  

  ### Scope for 3 Months (Part-Time)  
  - **Months 1–2**: Equilibrium analysis for posterior-oriented demonstrators in minimal MDPs; compare with policy-oriented cases.  
  - **Month 3**: Simulations of single-demonstrator settings; preliminary analysis of multi-demonstrator dynamics (e.g., does diversity mitigate manipulation?).  
  - **Exclusions**: Continuous spaces, online learning, or empirical human studies—these require longer timelines.  

  ### Settled vs. Open Issues  
  - **Settled**: Strategic behavior *can* distort IRL (folk theorem). What is *unsettled* is whether this distortion is surmountable without restricting demonstrator rationality or altering IRL.  
  - **Contested**: Some argue true preferences are ill-defined under manipulation; we assume \(R^*\) exists and is fixed, focusing on identifiability.  
  - **Novelty**: While performative aspects are known, the IRL-specific fixed-point problem and recovery conditions are unexplored.  

  **Impact**: Resolving this informs when real-world IRL (e.g., RLHF) risks codifying manipulated preferences—and where protocol interventions (e.g., hiding inference methods) are essential for alignment.
