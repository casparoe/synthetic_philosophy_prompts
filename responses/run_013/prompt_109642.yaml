   6. Debrief (40 minutes)

      We need to cover:
        Round 1 (FPTP): wasted votes, district magnitude, and how it affects representation.
        Round 2 (PR): how it allocates seats to smaller parties, and how that affects coalition formation.
        Expansion round: the Alabama paradox and the axioms of apportionment.
        Gerrymandering (if done): how district boundaries can be manipulated.

      Also, separate the mathematical truths from the contested empirical claims.

      Mathematical truths:
        - In FPTP, in each district only the winner gets the seat, and votes for other candidates are not represented in the seat allocation.
        - In PR with largest remainder, the allocation is more proportional, but may violate some desirable properties such as house monotonicity (Alabama paradox).
        - It is impossible to have an apportionment method that always satisfies both the quota condition and house monotonicity (or population monotonicity) -> this is the Balinski–Young theorem.

      Empirical claims that are contested:
        - Does PR lead to more party system fragmentation? (Generally yes, but thresholds can mitigate this.)
        - Does FPTP lead to stable single-party government? (Often, but not always, and sometimes leads to alternation between two parties.)
        - Does PR increase turnout? (Mixed evidence.)

      Also, note that there are many PR methods, and they can have different properties.

      Debrief structure:

        a. Round 1: FPTP
            - Ask the students: 
                - Who did not get chocolate? (Parties not in the coalition, and also students in districts where their party didn't win.)
            - What happened to the small parties (D and E)? 
            - Concept: wasted votes, and how FPTP can lead to regional concentration being rewarded and dispersed support being punished.

        b. Round 2: PR
            - Ask:
                - Did the allocation change? 
                - How did the small party D fare? 
                - How did the coalition formation change? 
            - Concepts: 
                - Proportional representation allows small parties to get representation.
                - This can make them pivotal in coalition formation? (But in our example, they might not have been necessary.)

        c. Expansion round (as a prepared example on the whiteboard):
            - Present the Alabama pardox example from history or a textbook.
            - Concepts: 
                - Apportionment methods must choose which properties to prioritize.
                - The impossibility theorem by Balinski and Young: no method can be both quota-satisfying and house-monotone.

        d. Gerrymandering (if done):
            - How did the redistricting committee change the outcome?
            - Concepts: cracking and packing.

        e. Finally, separate the mathematical from the empirical:
            - Mathematical: 
                1. The properties of electoral systems (e.g., wasted votes in FPTP, Alabama paradox in LR-PR).
                2. Arrow's theorem (if time) to show no perfect voting system.
                3. The apportionment impossibility (Balinski-Young).
            - Empirical and contested:
                1. Does PR lead to more or less stable governments? (Mixed evidence: PR may lead to coalitions that are more inclusive but sometimes fragile.)
                2. Does PR lead to higher turnout? (Some studies say yes, because fewer wasted votes, but others find no effect.)
                3. Does FPTP lead to moderation or extremism? (Parties in FPTP might chase the median voter, but in PR, small extreme parties may emerge.)

      If time is short, focus on the first two rounds.

