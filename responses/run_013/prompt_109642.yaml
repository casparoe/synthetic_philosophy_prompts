  ### **Electoral Systems Simulation: Game Design & Debrief Guide**

  #### **Learning Objectives**
  - Experience how electoral rules (FPTP vs. PR) convert votes into seats.
  - Discover paradoxes (wasted votes, Alabama paradox) through lived experience.
  - Separate mathematical truths (e.g., apportionment impossibilities) from contested empirical claims (e.g., PR’s impact on party systems).

  ---

  ### **Game Setup**
  **Materials:**  
  - 24 slips of paper (pre-assigned party + region)  
  - Whiteboard (for tallying votes/seats)  
  - Fun-size chocolate bars (only for coalition members)  
  - Timer  

  **Assignments (Pre-Game):**  
  - **Parties & Votes (simulate dispersed/concentrated support):**  
    - Party A (Regionalist): 10 students (41.7%)  
    - Party B (Centrist): 6 students (25%)  
    - Party C (Urbanist): 5 students (20.8%)  
    - Party D (Greens): 2 students (8.3%)  
    - Party E (Libertarian): 1 student (4.2%)  
  - **Regions (6 districts × 4 voters):**  
    - *Region 1:* 3A, 1B  
    - *Region 2:* 3A, 1B  
    - *Region 3:* 1A, 2B, 1C  
    - *Region 4:* 3B, 1C  
    - *Region 5:* 3C, 1D  
    - *Region 6:* 1C, 2D, 1E  

  ---

  ### **Game Rounds (Total: 45 min)**  
  **Round 1: FPTP (15 min)**  
  - **Rules:**  
    - Each region is a single-member district. Majority coalition (4+ seats) wins chocolate.  
    - Students vote for their assigned party. Tally votes per district; plurality winner takes the seat.  
  - **Expected Outcome:**  
    - *Seats:* A wins Regions 1, 2, 3 (3 seats); B wins Region 4 (1); C wins Region 5 (1); D wins Region 6 (1).  
      - Parliament: **A:3, B:1, C:1, D:1, E:0**.  
    - **Coalition Formation:** A (3 seats) needs 1 more partner. Likely partners: D (1 seat) → **A+D coalition (4 seats)**.  
    - **Chocolate:** Only A and D students eat.  
  - **Key Concepts Illustrated:**  
    - *Wasted votes:* B voters in A-dominated districts, E’s sole vote, C/D votes in losing districts.  
    - *Regionalism:* A’s concentration wins seats; D/E’s dispersion wins nothing.  

  **Round 2: PR - Largest Remainder (15 min)**  
  - **Rules:**  
    - Same votes, but now a single national district with 6 seats. Hare quota = 24 votes / 6 seats = 4.  
    - Allocate seats: Full quotas first, then largest remainders.  
  - **Calculation:**  
    - Full quotas: A (10/4 = 2), B (6/4 = 1), C (5/4 = 1) → 4 seats.  
    - Remainders: A (0.5), B (0.5), C (0.25), D (0.5), E (0.25).  
    - Largest remainders: D (0.5) and B (0.5) → each get 1 seat.  
      - **Final seats: A:2, B:2, C:1, D:1, E:0**.  
  - **Coalition Formation:**  
    - Multiple coalitions possible (e.g., A+B=4, A+C+D=4).  
    - Chocolate: Winning coalition parties eat (e.g., A+B or A+C+D).  
  - **Key Concepts Illustrated:**  
    - *Proportionality:* D (8.3% vote) gains a seat; E (4.2%) still excluded.  
    - *Coalition bargaining:* Small parties (C/D) may become kingmakers.  

  **Round 3: Expansion & Alabama Paradox (10 min)**  
  - **Rules:**  
    - "Parliament expands to 7 seats." Use same votes (24), now allocate 7 seats.  
    - Quota = 24/7 ≈ 3.428.  
  - **Calculation:**  
    - Full quotas: A (10/3.428≈2.91 → 2), B (6/3.428≈1.75 → 1), C (5/3.428≈1.46 → 1) → 4 seats.  
    - Remainders: A (2.91-2=0.91), B (1.75-1=0.75), C (1.46-1=0.46), D (0.87), E (0.29).  
    - Largest remainders: D (0.87), A (0.91), B (0.75) → D, A, B get remaining 3 seats.  
      - **Final seats: A:3, B:2, C:1, D:1, E:0**.  
  - **Paradox:**  
    - With 6 seats, C had 1 seat. With 7 seats, C still has 1 seat (*no gain*), while A gains.  
    - **But note:** In classic Alabama paradox, a party *loses* a seat when seats increase. Use whiteboard to demo:  
      - *Example:* 100 votes, 10 seats → C gets 1 seat. 11 seats → C still has 1 seat (remainder shrinks).  

  **Optional: Gerrymandering (5 min, if time)**  
  - 4 volunteers redraw regional boundaries. Goal: Pack opposition votes or crack their strongholds.  
  - Re-run FPTP; show how seat distribution changes without vote shifts.  

  ---

  ### **Debrief (40 min)**  
  **Structure:**  
  1. **Map Game Experiences to Concepts (15 min):**  
     - **Round 1 (FPTP):**  
       - *Wasted votes:* Votes for non-winners don’t translate to power.  
       - *District magnitude:* Single-seat districts amplify regional strongholds (A wins 3 seats with 41.7% vote).  
       - *Duverger’s Law:* FPTP favors 2-3 parties; small parties (E, D) wiped out.  
     - **Round 2 (PR):**  
       - *Proportionality:* Seats ≈ vote share (D gains representation).  
       - *Coalitional instability:* Small parties hold balance of power (C/D can choose A or B).  
       - *Thresholds:* Natural threshold (Hare quota = 4 votes) excluded E (4.2% < 4 votes).  
     - **Round 3 (Expansion):**  
       - *Apportionment paradoxes:* "Proportional" isn’t unambiguous.  
       - *Alabama paradox:* Increasing seats doesn’t always help small parties.  
       - *Balinski-Young Theorem:* No method satisfies quota + population monotonicity simultaneously.  

  2. **Separate Math from Politics (15 min):**  
     - **Settled Math:**  
       - FPTP wastes votes; PR reduces wasted votes.  
       - Apportionment impossibilities (quota vs. monotonicity).  
       - Arrow’s Theorem: No "perfect" voting system.  
     - **Contested Empirical Claims:**  
       | Claim                          | Consensus?                                  | Key Studies |  
       |--------------------------------|---------------------------------------------|-------------|  
       | PR fragments party systems     | Mixed (yes, but thresholds mitigate)       | Taagepera ’07 |  
       | FPTP ensures stability         | Mixed (often, but coalitions can be stable)| Lijphart ’12 |  
       | PR increases turnout           | Weak evidence (context-dependent)          | Blais ’06   |  
       | PR empowers extremists         | Contested (thresholds matter)              | Norris ’04 |  

  3. **Limitations of the Game (5 min):**  
     - Cannot simulate long-term dynamics (party entry/exit, voter realignment).  
     - Ignores cultural/institutional context (e.g., presidential vs. parliamentary systems).  
     - Chocolate incentives ≠ real-world motivations (e.g., policy influence).  

  4. **Q&A + Takeaways (5 min):**  
     - "Which system is ‘fairer’? Depends on values: proportionality vs. stability."  
     - "Electoral rules are *constitutive*—they shape party systems, not just reflect them."  

  ---

  ### **Predictable Challenges & Fixes**  
  - **Arithmetic eats time:** Pre-calculate PR/expansion steps; use whiteboard for transparency.  
  - **Students in 0-seat parties check out:** Assign them roles (e.g., coalition negotiators, vote counters).  
  - **Coalition bargaining drags:** Cap negotiations at 2 min; TA nudges with options.  
  - **Alabama paradox not stark:** Use the whiteboard example (100 votes → 10/11 seats) to clarify.  

  ### **What the Game Can’t Show**  
  - Long-term strategic voting (e.g., tactical defections in FPTP).  
  - Dynamic party system evolution (mergers/splits).  
  - Voter psychology (e.g., turnout effects beyond wasted votes).  

  ---

  ### **Instructor Notes**  
  - **Empirical Claims:** Stress that PR/FPTP impacts are context-dependent (e.g., thresholds, party discipline).  
  - **Axioms:** House monotonicity and quota are mutually incompatible—this is mathematically proven. Exceptions only in trivial cases.  
  - **Ethics:** Highlight that "fairness" is normative; proportionality prioritizes representation, FPTP prioritizes governability.  

  **Outcome:** Students experience electoral tradeoffs viscerally, setting up nuanced debate on democratic design.
