answer: |-
  Here’s a no-bullshit desiderata list for the credence-chance deference relation, structured for your needs. I’ll flag tensions, confidence levels (1-5, 5=highest), and treat your weather case as the litmus test. **Spoiler:** Your 1am suspicion is correct—there’s a core tension, and it breaks theories.

  ---

  ### **Core Desiderata: What *Must* an Adequate Account Deliver?**  
  *(Non-negotiables in bold; others are "house taste" with normative weight)*

  1. **Normative Force (★★★★★):**  
     Deference to chance must *constrain rational credence*. If you know the chance of A is *x*, your credence in A *should* be *x* unless overridden. Not a mere heuristic.  
     *Case:* If you know a coin’s bias is 0.7, credence 0.7 in heads isn’t optional—it’s rationality failure otherwise.  
     *Why non-negotiable?* Without this, "deference" is empty.

  2. **Chance-Credence Harmony (★★★★★):**  
     Chances must align with *ideal* credences under full information. If an agent knew *all* physical facts (including chances), their credence in A would equal the chance of A.  
     *Case:* In a world with fundamental stochastic laws (e.g., quantum decay), knowing those laws *just is* knowing chances.  
     *Why non-negotiable?* Anchors chance to truth-tracking.

  3. **Objectivity (★★★★☆):**  
     Chances are features of the *world*, not minds. They exist independently of evidence or beliefs.  
     *Case:* A radioactive atom has a 50% chance of decaying in 5 mins *regardless* of whether anyone models it.  
     *Why non-negotiable?* Distinguishes chance from epistemic probability.

  4. **Admissibility Sensitivity (★★★★★):**  
     The account must specify when evidence *trumps* chance information. "Admissible" evidence (e.g., future outcomes, undermining info) breaks deference.  
     *Case:* If you *see* the coin land heads, credence=1 overrides knowledge of bias=0.7.  
     *Why non-negotiable?* Prevents deference from forcing irrationality.

  5. **Contingency of Chance (★★★☆☆):**  
     Chances depend on the physical state of the world *at a time*. They can change as the world evolves.  
     *Case:* The chance of rain at noon drops to 0 once it’s 1pm and sunny.  
     *House taste?* Some (e.g., Humeans) reject this, but it’s standard in non-Humean views.

  ---

  ### **Critical Distinctions An Account *Must* Preserve**
  - **Chance vs. Epistemic Probability:**  
    Chance is *metaphysical* (e.g., quantum propensity); epistemic probability is *evidential* (e.g., "70% of models predict rain"). Blurring this collapses objectivity.  
  - **Unknown Chance vs. Inadmissible Evidence:**  
    Not knowing a chance ≠ having evidence that *defeats* it (e.g., not knowing a coin’s bias vs. seeing its future outcome).  
  - **Chance as Guide vs. Chance as Authority:**  
    A good forecast *guides* credence; objective chance *commands* it (subject to admissibility).

  ---

  ### **Constraints It *Can’t* Violate**
  1. **Avoids Contradiction with Evidence (★★★★★):**  
     Deference can’t force credence *x* in A when you have direct evidence for ¬A (e.g., chance of rain=0.8 while you’re indoors watching sunshine).  
  2. **Handles Self-Undermining (★★★★★):**  
     Must resolve cases where chance assignments entail evidence against their own accuracy (Lewis’ "undermining" problem).  
     *Case:* A theory where P(chance of heads=0.6) is high, but the actual frequency is 0.5. Deferring to 0.6 *now* conflicts with future evidence.  
  3. **Time-Relativity (★★★☆☆):**  
     Chances are defined *at times*—your credence should defer to *current* chances, not past/future ones.

  ---

  ### **Key Test Cases Any Account Must Handle**
  - **Undermining Future:**  
    Current chance theory T says chance of heads=0.6, but T also implies that if *actual* frequency ≠0.6, T is false. Should you defer *now*?  
  - **Deterministic Chance?:**  
    Your weather case (see below).  
  - **Inadmissible Insider Info:**  
    You know a coin will land heads by time travel. Chance of heads=0.7. Credence=1?  
  - **Unknown Chance, Known Frequency:**  
    You don’t know a coin’s bias but have 1000 heads in 1000 flips. What credence?  

  ---

  ### **The Conflict: Your 1am Suspicion Was Spot On**
  The **core tension** is between:  
  - **Objectivity** (chance as mind-independent)  
  - **Admissibility Sensitivity** (evidence can override chance)  
  - **Undermining Immunity** (deference shouldn’t self-destruct)  

  **Why they conflict:**  
  If chances are objective features of the world (Objectivity), your *current* evidence might already *contradict* them (e.g., evidence that a chance process is rigged). But Normative Force says you *must* defer unless evidence is inadmissible. What if your evidence *is* admissible and still undermines chance? (e.g., knowing a deterministic system’s initial conditions).  

  **Most Damaging Pair:**  
  - **Objectivity** + **Admissibility Sensitivity**  
    → If chances are objective but your evidence can override them, how is chance *distinct* from epistemic probability?  
    *Lewis’ answer:* Restrict admissibility to "non-undermining" evidence. But this feels ad hoc.  

  **Single Most Restrictive Desideratum:**  
  **Undermining Immunity** (must handle self-undermining chances). It sinks naive Principal Principle versions and forces complex fixes (e.g., New Principle).

  ---

  ### **Your Weather Case: The Litmus Test**
  - **Setup:** Ensemble forecast says 70% "chance of rain." System is deterministic.  
  - **Is this *objective chance*?**  
    **No.** (Confidence: ★★★★☆)  
    It’s **epistemic probability**: a summary of uncertainty about initial conditions/model limitations. You *should* defer to it *if* it’s your best evidence, but not because it’s metaphysically authoritative.  
  - **Why it fails objectivity:**  
    In a deterministic world, rain either *will* or *won’t* happen—no "objective maybe." The 70% reflects *ignorance*, not a stochastic property.  
  - **Boundary Drawing:**  
    Objective chance requires **indeterminism in the system** (quantum, chaotic-but-irreducibly-probabilistic) or **propensity** (e.g., a coin’s bias as a physical disposition).  
    - *Actuarial tables:* Epistemic (based on aggregate data; no single-case physical propensity).  
    - *Casino edge:* Epistemic (based on game rules + statistics; physical setup determines outcomes).  

  **Jurisdiction of Deference Theory:**  
  - **Deference to objective chance:** Governed by a "chance-credence principle" (e.g., Principal Principle).  
  - **Deference to epistemic probability:** Governed by *evidential norms* (e.g., conditionalization on best data).  
  Your friend’s "chance of rain" is the latter. An adequate account *must* explain why we treat it *like* chance without conflating the two.

  ---

  ### **Verdict on "Objective Chance" as a Concept**
  It’s **genuinely contested** (Humean vs. Non-Humean, propensity vs. frequentist), but:  
  - **Minimal Core:** Chances are *time-dependent, objective, probability-valued properties* that *should guide rational credence*.  
  - **The Split:**  
    - **Humeans:** Chance is "best-system" analysis of patterns (frequency + simplicity).  
      → *Pro:* Handles deterministic chances (your weather case might qualify). *Con:* Weakens objectivity.  
    - **Non-Humeans:** Chance is irreducible (e.g., quantum propensities).  
      → *Pro:* Strong objectivity. *Con:* Inapplicable to deterministic systems.  

  **My Take (★★★★☆):**  
  Non-Humean objectivity is the gold standard. But **deference in practice** often targets *epistemic proxies* for chance (like forecasts). A good theory must:  
  1. Define deference to *true* objective chances (non-Humean).  
  2. Explain why/when we defer to *ersatz* chances (Humean or epistemic).  
  **Your tension is real:** True objective chances *can* be undermined by evidence—and that’s why admissibility clauses exist. But if undermined, were they ever "objective" in the first place? That’s the 1am rabbit hole.  

