  The city's collapse needs subtle foreshadowing. Maybe early descriptions of polished chrome corridors (artificial harmony), later contrasted with cracks in the voting chamber walls. And that final image of the blank screen? Perfect. The void where agreement used to be.
answer: |-
  The air in the immersion chamber always carried the faint ozone tang of processing power, mingling with the sterile scent of recycled air. We called it "The Veil," this city-wide ritual. Every year, on Allocation Day, Equity’s citizens plugged into the central AI, Synapse. For sixty minutes, we weren’t *us*. We were potential. Everyone. Synapse simulated the perfect ignorance Harsanyi described: no name, no history, no knowledge of whether you were born into the gleaming towers of Sector One or the cramped, recycled-air apartments of the Warrens. Just the raw, terrifying, exhilarating uncertainty of *being anyone*. Under that veil, rationally self-interested but utterly blind, we always chose to maximize the *average* expected utility. It was logical. Fair, even. The Contract, we called it. Equity’s bedrock.

  This year, the hum of Synapse felt… jagged. A subtle vibration in the neural link headset, a flicker in the immersive visual field of pure, abstract probability. Then, it hit.

  Not ignorance. *Knowledge.*

  A searing, instantaneous flash. Not my *whole* life, but a snapshot: my face, Elara Voss, reflected in the scratched plexi of my librarian station terminal. The smell of old paper and dust. And the cold, hard number: **Utility Rank 4,812 out of 5,000**. Bottom quintile. Chronic pain management eating into my basic ration credits, the constant fear of the next health levy. *My* reality, laid bare in a microsecond of brutal clarity.

  The flash vanished as abruptly as it came, replaced by the familiar, swirling grey void of the Veil. But the damage was done. The pristine uncertainty was shattered. I wasn’t potential Elara, equal chance of being anyone. I was *me*. And I was drowning.

  The collective gasp in the chamber was tangible, a wave of shock rolling through the connected minds. You could feel the psychic landscape fracture. Where there had been a unified hum of calculated risk, now there was a cacophony of frantic, individual terror and dawning, selfish calculation.

  Synapse, oblivious or perhaps malfunctioning entirely, began the standard allocation proposal: increased funding for preventative city-wide health screenings (good for the average, costly for the chronically ill *now*), infrastructure upgrades concentrated in high-growth sectors (boosting long-term productivity, ignoring immediate needs in the Warrens), a modest universal credit bump (peanuts for the top, a lifeline for the bottom). The rational, average-maximizing budget, born from the pure Veil.

  But the Veil was torn.

  The voting interface shimmered into existence. The usual calm deliberation was gone. People fidgeted, muttered. Eyes darted, not seeing the abstract probabilities, but seeing their *own* rank, their own precarious ledge. The man beside me, Rank 128 (I somehow *knew*), practically radiated smug satisfaction; the proposal was a windfall for his sector. The woman opposite, Rank 4,995, was trembling, tears cutting tracks through the conductive gel on her cheeks. The proposal meant her subsidized mobility aid might be cut.

  "This… this isn't right," a voice, thin with shock, echoed in the shared comms channel. "I saw… I saw *me*. Rank 4893."

  "The Contract!" someone else shouted, voice tight with a desperate hope. "Remember the Contract! Equal chance! We have to…"

  "The Contract assumed blindness!" a sharper voice cut in. Rank 112, I guessed. "Synapse *showed* us! We *know* who we are now! Why should I vote to pour my taxes into Warren sewage pipes when I *know* I live in Helios Heights?"

  The logic of the Veil, so elegant in theory, crumbled under the weight of revealed identity. Harsanyi’s beautiful equation – equal probability leading inevitably to average utility maximization – had a critical, unstated variable: sustained ignorance. Without it, self-interest reverted to its raw, immediate, *personal* form. The "equal chance" felt like a cruel joke when you *knew* your dice were loaded.

  Debate raged, chaotic and laced with panic. Factions formed instantly, crystallizing around utility brackets. The Top Quintile Alliance pushed for tax cuts and capital investment. The Middle Band waffled, some clinging to the Contract’s ghost, others eyeing opportunities. We, the Bottom, were fragmented, desperate. Some advocated for radical redistribution, others pleaded for specific lifelines – more pain meds, housing subsidies, debt forgiveness. Without the shared uncertainty, there was no shared language, only competing vulnerabilities and greeds.

  Synapse presented the vote. The interface pulsed neutrally. My finger hovered over the options: **Accept Proposed Allocation (Harsanyi Optimal)** or **Propose Alternative**.

  The memory of my cramped apartment, the ache in my joints, the gnawing fear of the next ration cycle, was visceral. *Rank 4,812*. The proposed budget offered a tiny credit bump but cut the chronic illness subsidy pool. It might raise the *average*, but it would break *me*. The Contract demanded I accept it. The flash of my own face screamed *betrayal*.

  Across the chamber, you could see the same internal war playing out on a thousand faces. The man who saw his Rank 128 looked conflicted for a fleeting moment – the ingrained habit of the Contract – then his jaw set. He tapped **Propose Alternative**. Self-preservation won. The woman who was Rank 4,995 didn’t hesitate. Her vote for an alternative was pure survival instinct.

  My thumb trembled. The abstract ideal of the average citizen seemed like a ghost. The real, suffering Elara Voss was right here, gasping for air. The Contract had no grip without the Veil. It was just words, drowned out by the deafening reality of *self*.

  I voted **Propose Alternative**.

  The results weren’t announced with Synapse’s usual calm certainty. The numbers flickered erratically on the central holo-display. Only 21% accepted the Harsanyi Optimal budget. 79% fragmented into a kaleidoscope of self-serving alternatives, each faction’s proposal diametrically opposed to another’s. No consensus. No majority. Just a jagged graph of conflicting desires.

  Silence descended, heavier than the ozone. Synapse’s voice, usually so smooth, stuttered. "Consensus… not… achieved. Allocation parameters… undefined. Systemic error."

  The chamber lights flickered. Not just here, we realized. Reports flooded the comms channels. City-wide. Sector grids glitching. Transport hubs frozen. The central allocator AI, designed only to implement the democratically chosen, average-maximizing budget under the Veil, had no protocol for this. No rules for naked self-interest in the light of day.

  We stumbled out of the immersion pods, blinking in the harsh light of the waiting area. The air crackled with a different tension now – not the focused anxiety of the ritual, but the bewildered dread of the unknown. People clustered not as fellow citizens, but as utility brackets recognized in that fatal flash. Suspicion hung thick. The man from Rank 128 avoided my eyes. The woman from Rank 4,995 was sobbing quietly, surrounded by others with similarly low numbers, a sudden, desperate kinship born of shared exposure.

  I walked home through streets that felt alien. The polished chrome facades of the commercial sector seemed brittle. The efficient glide-trams were halted, silent. In the Warrens, the usual background hum of recyclers and life-support was replaced by an unnerving quiet. Synapse hadn’t crashed; it was paralyzed. Waiting for instructions it couldn't comprehend. The city, built on the beautiful, brittle logic of the Veil, was frozen. Not by violence, but by the simple, devastating act of *knowing* who you were when you were supposed to be anyone.

  Harsanyi was right, I thought numbly, staring at my ration card, its balance suddenly uncertain. Under perfect ignorance, we’d choose the average. But rip away that ignorance, even for a second, and the social contract dissolves. You’re left with just people, scared and selfish, staring at a blank screen where the future used to be, wondering what rules apply when the only certainty is yourself. Equity wasn’t crumbling; it was holding its breath, waiting to see what kind of society emerges when the veil doesn’t just lift, but *shatters*.
