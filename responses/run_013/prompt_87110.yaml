prompt: |-
  My roommate and I got into this argument at like 1 a.m. about whether you can ever really know whats going on in your own head, and since then I've been keeping a mental list of the times I trust my own self-reports and the times I'm pretty sure I'm making things up, because I think there's a pattern and I want to know what it is. Trust: the faint ringing in my ears right now, definitely there. Whether I'm annoyed at my roommate or just hungry — I can tell, and it's annoyed. The feeling that I know a name I can't quite pull up, which is right way more often than chance, so I go with it. Whether I understood the last paragraph of an article, even though a minute later I couldn't repeat back a word of it. And I'd swear I'm not secretly a snob about people from my hometown — that's not something I'm feeling right now, it's just a fact about me. Don't trust: why I picked this apartment over the identical one downstairs. I'll say it was the light, and I don't believe myself; I think I grabbed the first one I saw and invented the light afterward. Whether I actually liked that movie or just said I did because everyone else did. Whether I decided to scratch my nose a second ago or my hand just went on its own, which honestly kind of creeps me out. Whether I was paying attention for the whole drive home. And my friend mentioned offhand that she has no inner voice at all, no words in her head ever, and now I'm not even sure whether I think in words or not, which seems like the one thing I should be able to just check.

  The rule I'd guess at is something like: I can see whats on the screen but not whats running the program — reliable about what I'm experiencing right now, unreliable about causes and about anything that isn't happening at this moment. But then the hometown-snob one should be out the window and "I was paying attention the whole drive" should be in, and neither of those matches my gut. Also, when I'm dreaming I'm completely convinced I'm awake, and I'm wrong about the most basic fact about my own state, which seems like it should sink the whole screen idea. So: is there a principle, or two or three competing ones, that actually gets my verdicts? State it precisely, tell me which of my verdicts it has to throw out and why I should give them up, and say what it predicts about a case I haven't thought about — can I tell whether I'm imagining a song in my head or actually hearing it coming from somewhere? Pick a further case of your own too, ideally one where you think your principle and the rival one disagree, and please don't just tell me to go read somebody — I want your answer, not a reading list. American English, please, I'm not trying to decipher Britishisms at 1 a.m.
reasoning: |-
  Okay, the user and their roommate had a late-night argument about whether we can truly know what's going on in our own minds. The user has been keeping a mental list of when they trust their self-reports versus when they don't, and they're looking for a pattern. They've shared specific examples and a tentative rule about only trusting current experiences, but they've noticed inconsistencies. Now they want a precise principle that explains their judgments, even if it means discarding some of their current beliefs, and they want predictions for new cases.

  First, I need to understand their examples. They trust things like the ringing in their ears, being annoyed (not hungry), knowing a name they can't recall, understanding a paragraph even if they can't repeat it, and not being a snob about their hometown. On the other hand, they don't trust why they chose an apartment, whether they liked a movie, why they scratched their nose, whether they paid attention during a drive, or if they think in words. Their proposed rule—reliable about current experiences but not causes or non-present things—doesn't hold up because the snob example is trusted (non-present) and the attention during the drive isn't (past but should be current).

  The key issue here is the reliability of introspection. The user seems to conflate different types of mental states. Sensory experiences (ringing, current emotions) feel direct, while reconstructions (reasons for past decisions) are more interpretive. The hometown snob example is tricky because it's a self-concept belief, not a direct experience. Maybe they trust it because it's a stable self-perception, whereas the apartment choice involves post-hoc justification.

  The dream example is crucial because it shows that even present experiences can be deceptive. This undermines the idea that current experiences are always reliable. So the principle can't be about current vs. non-current alone. Instead, it might be about the nature of the mental state: direct sensations vs. constructed narratives. 

  I should consider the distinction between phenomenal consciousness (raw feels) and access consciousness (interpreted thoughts). Things like the ringing or current annoyance are immediate sensations, while reasons for actions involve narrative construction. The attention during the drive is about meta-cognition—knowing if they were aware, which is tricky because attention fluctuates. 

  The inner voice question touches on introspection illusion. We might not have direct access to cognitive processes. The user's uncertainty about thinking in words shows that we can't always introspect our thought processes accurately. 

  For the song example: if they're currently experiencing it, they might know it's imagined because external sounds have different qualities (like spatial location). But if it's ambiguous, they might doubt. The principle would predict that they can tell if they focus on sensory qualities. 

  Another test case could be emotional reasons. E.g., "Why am I angry?" Sometimes people misattribute causes (like blaming a partner when stressed from work). The user's principle might say they can't trust the reason, but might feel the anger itself is real. 

  So the core principle is: Trust immediate, non-interpretive sensory or affective states; distrust anything requiring interpretation, reconstruction, or self-concept justification. This would discard the hometown snob verdict because it's a self-concept, not a current experience. The attention during the drive is also out because it's a reconstructed past state. 

  The user needs to accept that self-concept beliefs (like not being a snob) are inferences, not direct knowledge. For the dream issue: the principle allows that current experiences can be deceptive because interpretation can happen in real-time (like dreaming). The system generates the experience, but we might misattribute its source. 

  The song question: they can distinguish by checking sensory features. If it lacks external qualities, it's imagined. But if they're unsure, it's because they're interpreting, not directly accessing. 

  Further case: "Do I actually believe in God or just say I do?" The user's principle would distrust this as it involves self-concept and interpretation, not current experience. A rival principle might say that core beliefs are directly accessible, but this would conflict with evidence of self-deception.
answer: |-
  Here's a precise principle that explains your pattern, resolves the contradictions in your examples, and predicts new cases:

  **The Phenomenal Access Principle:**  
  *You can reliably report the* **current, raw qualitative content** *of your conscious experience ("what it's like" to be you right now), but you cannot reliably report the* **causes, origins, functional processes, or enduring traits** *that generate or underlie that content.*

  ### How It Explains Your Verdicts:
  1.  **Trusted Cases (Raw Phenomenal Content):**
      *   **Ringing in ears:** Direct sensory qualia you're experiencing *now*.
      *   **Annoyed (not hungry):** Current, felt affective state. You feel the annoyance itself.
      *   **Knowing a name (tip-of-tongue):** A current, specific *feeling* of knowing, distinct from not knowing.
      *   **Understood the paragraph (momentarily):** The immediate, felt *sense* of comprehension occurring *as you read it*.
      *   **Scratching nose (agency doubt):** *Not* trusted – because you're doubting the *cause/origin* (did I decide? or was it automatic?) of the action, not the raw sensation of the itch or the movement itself (which you *could* report reliably).

  2.  **Distrusted Cases (Causes/Origins/Processes/Traits):**
      *   **Why chose the apartment:** You're trying to report the *causal reason* for a past decision. This is reconstruction.
      *   **Actually liked the movie?:** You're doubting the *origin* of your stated preference (genuine reaction vs. social conformity).
      *   **Why scratched nose:** As above, doubting the *cause/origin* of the action (volition vs. reflex).
      *   **Paying attention the whole drive:** You're trying to report on a *functional process* (sustained attention) over an extended *past* period. This requires reconstruction and inference.
      *   **Think in words?:** You're trying to introspect the *functional process* of your own cognition, not just its current output. This is notoriously inaccessible.
      *   **Hometown snob:** *Not* trusted (according to this principle) – You're trying to report an *enduring trait* ("just a fact about me"). Traits aren't directly experienced phenomenally; they are inferences drawn from past behaviors and feelings. Your belief that you aren't a snob *feels* like a fact *now*, but that feeling is the current state, not proof of the trait.

  ### Resolving the Conflicts & Discarding Verdicts:
  *   **"Hometown Snob" must be discarded as trustworthy.** Your principle ("reliable about what I’m experiencing right now") captured the *feeling of certainty* you have *now* about not being a snob. But the Phenomenal Access Principle shows that this *feeling* is the current experience, while the *trait itself* ("am I *actually* a snob?") is not directly accessible. You might be mistaken about your own biases (as cognitive psychology constantly shows). **Give it up because:** Traits are conclusions, not direct experiences. You only have direct access to the *current feeling* about the trait, not the trait's objective truth.
  *   **"Was paying attention the whole drive" stays DISTRUSTED.** Your gut was correct here. Your initial rule ("unreliable about anything that isn't happening at this moment") captured the distrust, but the Phenomenal Access Principle explains *why* distrust is correct: you're trying to report on a *process* over *time*, not a current raw state. You might have had brief moments of vivid attention (reliable) interspersed with autopilot (which you wouldn't reliably recall).
  *   **Dreaming doesn't sink it:** While dreaming, the *current phenomenal content* (the dream sensations, thoughts, emotions) *is* your reality. The principle doesn't guarantee your reports about the *external world* or your *biological state* (asleep/awake) are correct – just the content of your immediate conscious experience. The error is mistaking the *origin* (brain asleep) and *referential accuracy* (dream content vs. external world) of the phenomenal content, not the content itself. You *were* reliably experiencing the dream phenomenology.

  ### Predictions for Your Cases:
  1.  **"Can I tell whether I'm imagining a song in my head or actually hearing it coming from somewhere?"**
      *   **Prediction:** **Yes, you can reliably tell (phenomenal difference).** The *raw qualitative feel* of an externally generated sound (spatial location, timbre, volume fluctuations tied to environment, feeling of ears being stimulated) is phenomenally distinct from the *raw qualitative feel* of an imagined song (located "in the head," lacking precise spatial location, often less vivid/stable in timbre, volume controllable by thought, no feeling of ear stimulation). You have direct access to these phenomenal differences. If you *couldn't* tell, it would likely be due to an external sound being extremely faint/ambiguous or a hallucination (a breakdown in the system, not the norm).

  2.  **Further Test Case: "Why did I suddenly feel sad?"**
      *   **Phenomenal Access Principle Prediction:** You can reliably report *that* you feel sad right now (the raw affective state). You *cannot* reliably report the *cause* (e.g., "It's because of that comment my boss made yesterday," or "It's low blood sugar"). The cause is inferred/reconstructed, often incorrectly.
      *   **Rival Principle (e.g., "We have privileged access to all mental states"):** Would predict you *can* reliably know the cause of your sadness.
      *   **Why they disagree:** Your roommate might argue you "just know" why you're sad. The Phenomenal Access Principle argues you know the sadness directly, but the cause is a separate inference prone to error (e.g., misattribution of arousal). Psychology supports the Phenomenal Access view: people frequently misattribute the causes of their emotions.

  ### Why This Principle?
  It aligns with neuroscience and cognitive psychology: we have direct neural correlates for conscious experiences (phenomenal content), but the brain mechanisms generating actions, storing memories, forming traits, and constructing narratives operate largely outside conscious awareness. You're the user experiencing the interface (the "screen"), not the engineer who built the computer or the programmer writing the code. You can describe the display (phenomenology) accurately, but not how it got there or how the machine works under the hood (causes, processes, traits). This explains your pattern, resolves your contradictions (by discarding the hometown snob verdict as directly knowable), and makes clear, testable predictions.
