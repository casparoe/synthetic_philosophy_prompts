     There is another weak point that the author does not mention: the assumption that the mind is consistent. The Lucas-Penrose argument requires that the mind's formal system F is consistent. But how do we know the human mind is consistent? If the mind is inconsistent, then it can prove anything and the argument fails. The anti-mechanist must assume consistency. But a machine that is inconsistent would also be able to prove anything. However, the author is assuming consistency throughout, so it's not a new point.

