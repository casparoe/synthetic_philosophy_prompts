answer: |-
  ### The case
  In the 1920s, US auto industry groups successfully campaigned to reframe street safety responsibility, promoting the term "jaywalking" (using "jay" to imply a foolish country person) and pushing for laws making mid-block pedestrian crossing illegal. Los Angeles enacted the first widely emulated such law in 1925, drafted by auto lobbyists. Similar laws persist in most US jurisdictions today, though enforcement is often lax or non-existent in many cities, and some places have recently decriminalized the act.

  ### The convention, reconstructed
  While the *formal law* often diverges from actual practice due to inconsistent enforcement and widespread disregard in many areas, a *convention* exists in the relevant sense. The core convention is that pedestrians are expected (by drivers, authorities, and often other pedestrians) to cross streets primarily at corners or marked crosswalks, yielding right-of-way to vehicular traffic elsewhere. Pedestrians largely conform to this expectation (even when technically breaking the unenforced law) primarily because others (drivers) expect it, and violating it increases the risk of collision and social sanction (e.g., horns, shouts). The mutual expectation and reason for conformity ("others do it/demand it for safety/order") define the convention, even if the formal prohibition is sometimes ignored.

  ### Inherited versus installed
  The jaywalking convention is a paradigmatic example of an **installed convention**. Its origin lies not in spontaneous, reciprocal interactions among pedestrians and drivers gradually evolving shared norms for mutual benefit. Instead, it was deliberately manufactured and imposed top-down by a powerful interest group (the auto industry) seeking to shift costs, risks, and blame away from drivers (and their product) onto pedestrians. The "reason" for initial conformity was not mutual recognition of a beneficial emergent norm, but aggressive lobbying resulting in legal coercion, combined with a PR campaign stigmatizing previous pedestrian behavior (which was often the default).

  This origin matters for assessing its inherent moral force. **Inherited conventions** typically gain moral weight through their bottom-up emergence. Their persistence usually signals a rough equilibrium solving a coordination problem or fostering mutual advantage (e.g., queuing, driving on one side of the road). The reciprocal expectation ("I do it because you do, and we both benefit") grounds a prima facie obligation based on fairness and mutual respect within the interacting group. Violation can exploit the cooperative behavior of others.

  The moral force of an **installed convention** like jaywalking is fundamentally different. Its creation served the specific, non-reciprocal interests of one party (auto manufacturers, drivers). While it may *now* function to coordinate behavior and arguably enhance safety *if universally followed*, its foundational justification wasn't mutual benefit derived from spontaneous interaction, but the imposition of a rule by the powerful onto the less powerful for the former's advantage. The obligation to conform stems largely from the coercive power of law and manufactured social pressure, not from a fair process of mutual agreement or demonstrable, reciprocal benefit inherent in the rule itself.

  Does this distinction wash out once the rule is established? Partially, but not completely. Over time, new generations internalize the installed convention as simply "how things are done." Coordination benefits can emerge *ex post facto*, creating a *new* reciprocal reason for conformity: predictability and safety *under the current system*. However, the historical origin and initial imbalance of power remain relevant. They highlight that the convention may not represent the most efficient, fairest, or safest equilibrium *possible*, but rather one imposed for partisan gain. This weakens claims that the convention inherently carries the full moral weight of a genuinely reciprocal norm born of mutual adaptation. Its persistence may reflect path dependency and power, not organic mutual advantage.

  ### The visitor's obligation
  The visitor's obligation to follow this local convention is significantly attenuated compared to an inherited convention. For inherited conventions (like local driving norms), the visitor has a strong obligation rooted in fairness: they benefit from the predictable behavior of locals (who follow the convention) and thus have a reciprocal duty not to disrupt that system by free-riding or introducing dangerous unpredictability. Following the local rule shows respect for the cooperative scheme the locals have established.

  For the installed jaywalking convention, the visitor's primary obligations are different and weaker. First, they have a general duty not to cause harm or unreasonable risk. Crossing unpredictably mid-block *could* cause an accident, so this duty provides a reason to conform *where traffic is dense and unpredictable crossing is genuinely hazardous*. Second, they have a weak duty to respect the local legal order, though this is less compelling when the law itself is widely ignored or contested locally. Crucially, the obligation does not spring from a deep duty to respect the *convention itself* as a product of fair mutual cooperation, because its origin lacks that reciprocity. The visitor from a country without such a norm hasn't benefited from its imposition and wasn't part of its creation.

  ### Where the theory runs out
  The theory struggles to clearly define when, or if, an installed convention fully transitions into possessing the moral weight of an inherited one. How many generations of habituation are required? Does consistent defiance (like widespread jaywalking in NYC) prevent this transition or create a competing convention? The theory is also silent on how to weigh the *current* coordination benefits of an installed convention against the historical injustice or power imbalance of its origin, especially for newcomers. Finally, it doesn't fully resolve the tension between respecting local legal norms (even flawed ones) and the visitor's lack of participation in establishing the underlying convention.

  ### Verdict
  The jaywalking case strongly supports the distinction between inherited and installed conventions and demonstrates that a convention's origin significantly impacts its inherent moral force. Installed conventions, especially those imposed by powerful interests for their own benefit, lack the foundational reciprocity that generates the core moral obligation found in inherited conventions. While practical reasons related to safety and respecting local law may compel a visitor to follow such a rule in specific contexts, they do not have a strong, freestanding moral obligation based on the convention itself, precisely because its origin and nature differ fundamentally from genuinely reciprocal, bottom-up norms. The distinction does not fully wash out.
