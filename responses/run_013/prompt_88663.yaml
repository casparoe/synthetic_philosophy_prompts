  ### Decision Tree for Moral Uncertainty in Grantmaking

  **Start**: You and a smart colleague disagree about which animal welfare project to fund. Your gut reaction is:  
  ➔ **A**: "One of us must be more correct—I wish I knew which."  
  ➔ **B**: "There might not be a single right answer—we need a practical way forward."  

  ---

  #### Node 1 (from A):  
  **Case**: You’re deciding whether to fund a campaign for "humane" slaughter in factory farms. A utilitarian says it’s good (reduces suffering), but a deontologist says it’s forbidden (uses animals as means). Can you meaningfully compare these views?  
  ➔ **A**: "Yes—we can weigh reduced suffering against rights violations on a shared scale."  
  ➔ **B**: "No—they’re apples and oranges; no common scale exists."  

  #### Node 2 (from B):  
  **Case**: You’re unsure whether to fund research on wild animal suffering. Is your uncertainty about what’s morally true, or about what you’ll think after more reflection?  
  ➔ **A**: "It’s about moral truth—e.g., whether animals have rights."  
  ➔ **B**: "It’s about my future self—I might regret this later."  

  #### Node 3 (from 1A):  
  **Case**: You have 70% credence in utilitarianism and 30% in deontology. The utilitarian says fund, the deontologist says don’t. Should your credence influence the decision?  
  ➔ **A**: "Yes—my confidence should weight the choice."  
  ➔ **B**: "No—each theory gets equal say, regardless of credence."  

  #### Node 4 (from 1B):  
  **Case**: Funding the humane slaughter campaign (favored by utilitarians) or not funding (favored by deontologists). Is there a third option that avoids both objections (e.g., funding vegan advocacy)?  
  ➔ **A**: "Yes—there’s a compromise."  
  ➔ **B**: "No—only these two options exist."  

  #### Node 5 (from 2A):  
  **Case**: If you knew whether animals have rights, your deontological theory would clearly say whether to fund. Is this just uncertainty about a fact (like "do animals have rights?")?  
  ➔ **A**: "Yes—it’s ordinary empirical uncertainty."  
  ➔ **B**: "No—even if I knew, I’d still wonder if rights override consequences."  

  #### Node 6 (from 2B):  
  **Case**: Funding the wild animal project. Your current self thinks it’s good, but you fear future self will see it as hubris. Should you prioritize avoiding regret?  
  ➔ **A**: "Yes—choose an act that hedges against future blame."  
  ➔ **B**: "No—I’ll stick to my current best judgment."  

  #### Node 7 (from 3A):  
  **Case**: The deontologist says funding humane slaughter is infinitely bad (rights violation), while the utilitarian says it’s highly good. How do you handle this?  
  ➔ **A**: "Avoid any act that any theory calls infinitely bad."  
  ➔ **B**: "Still weight by credence—but note: if theories disagree widely on values, it might change things."  

  #### Node 8 (from 3B):  
