  Cruxes are where predictions get concrete. For the feedforward pain system: pattern camp says it’s conscious (same function), biology-first says it’s a "philosophical zombie" (no loops, no qualia). For neuron replacement: pattern sees continuity, biology-first might draw a line at cumulative replacement or invoke emergence loss. Lab-grown neurons are tricky—both might agree it’s weak evidence but split on valence (pattern sees continuity, biology-first sees "cute but not conscious").  

