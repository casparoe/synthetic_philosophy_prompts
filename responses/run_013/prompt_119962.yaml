  User hates slogans, so I’ll avoid "fading qualia" or "China brain" unless dissected. And yes—no citations. This is about mapping the battlefield, not lit review.  

  Word count: aiming for ~1500. Agreements will be densest (10-12 claims), cruxes most expansive (4 scenarios). Neutral tone throughout—no "obviously" or hidden snark.  

  Final check: Did I miss their request about moral status degrees? Yes—add to agreements: both tie moral weight to phenomenology, but pattern allows partial consciousness (e.g., AI fragments) while biology-first is all-or-nothing. That’ll feed into replacement scenarios.  

