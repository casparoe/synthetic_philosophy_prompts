  - End with an olive branch to the theater applicants

  The user wants the losing side to feel heard, so I'll emphasize that this decision is contextual - in a different city, the theater might win. And I'll admit we can't scientifically prove which model "builds virtue better" - that's philosophical. We're choosing based on this specific hall's history and this community's needs.

