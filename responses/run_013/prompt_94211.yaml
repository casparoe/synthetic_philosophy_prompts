  But I must engage Rousseau properly. His core concern is valid: passive spectatorship vs active citizenship. However, his blanket condemnation of theater is overstated - great plays can provoke reflection and dialogue. The key is whether the art form invites engagement beyond the performance. The festival model does this more organically through open participation, but a theater could counter this by adding talkbacks or community workshops.

