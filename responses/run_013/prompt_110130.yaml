answer: |-
  ### Defining Mechanism Identity for Mechanistic Anomaly Detection

  The core challenge in mechanistic anomaly detection is defining **what constitutes the "same mechanism"** in a way that avoids the pitfalls of purely functional, structural, or interventional criteria. Below, I clarify the necessary fixed elements, explain why obvious candidates fail, and propose a robust criterion grounded in a concrete example. This criterion must work without relying on distribution shifts (which the detector aims to anticipate).

  #### **The Problem: Ambiguity in Mechanism Identity**
  - **Functional criterion** (same input-output behavior on the trusted distribution):  
    Fails because two different algorithms can produce identical outputs on the trusted distribution but diverge under distribution shifts. Anomalies would be missed if the detector only checks output correctness.  
  - **Structural criterion** (identical circuits/parameters/implementation):  
    Fails because it is brittle to harmless changes (e.g., reordering hidden units, numerical precision). It flags trivial differences, making it impractical.  
  - **Interventional criterion** (same response to part-level interventions):  
    Fails due to underspecification: *which* parts and *which* interventions? Without a prior notion of "parts," interventions inherit the original ambiguity.  

  A viable criterion must:
  1. **Detect algorithm substitution** (different internal processes yielding the same output on trusted inputs).
  2. **Ignore implementation details** (e.g., permutation invariance, numerical precision).
  3. **Rely only on trusted-distribution data** (no covert appeal to future distribution shifts).

  ---

  ### **Grounding Example: Absolute Difference Computation**
  Consider a model trained to compute the absolute difference $|a - b|$:
  - **Trusted mechanism (reference)**:  
    Uses a **conditional branch**:  
    `if a ≥ b: output = a - b`  
    `else: output = b - a`  
    Trusted regime: Non-negative inputs (e.g., $a, b \in \mathbb{R}^+$).  
  - **Alternative mechanism (anomalous)**:  
    Uses an **algebraic shortcut**: $ \text{output} = \sqrt{(a - b)^2} $.  
    This matches the reference on non-negative inputs but fails for negative numbers (e.g., if $a - b$ is imaginary).  

  **Goal**: Flag inputs where the model uses the algebraic shortcut, even if $|a - b|$ is correct.

  ---

  ### **Proposed Criterion: Causal Graph Consistency**
  Two computations are the "same mechanism" if they implement the **same causal graph over high-level variables** (e.g., intermediate concepts) when projected onto a **fixed abstraction layer**.  

  #### **Key Fixed Elements**
  1. **Abstraction Layer**:  
     A predefined set of **interpretable variables** $\{V_1, V_2, \dots, V_k\}$ derived from the reference mechanism.  
     - Example: $V = \{ \text{ComparisonResult}, \text{SubtractionResult} \}$.  
     - For input $(a, b)$:  
       - $\text{ComparisonResult} \triangleq \mathbb{I}(a \geq b)$ (binary).  
       - $\text{SubtractionResult} \triangleq \begin{cases} a - b & \text{if } a \geq b \\ b - a & \text{otherwise} \end{cases}$ (scalar).  

  2. **Causal Graph**:  
     A fixed dependency structure between variables.  
     - Example graph:  
       $$
       \text{Input }(a, b) \rightarrow \text{ComparisonResult} \rightarrow \text{SubtractionResult} \rightarrow \text{Output}
       $$
       Here, $\text{SubtractionResult}$ causally depends on $\text{ComparisonResult}$.

  3. **Projection Function**:  
     A function $\phi$ mapping the model's internal state (e.g., activations) to the abstraction layer.  
     - $\phi$ is **trained on the trusted distribution** to predict $\{V_i\}$ from activations when the reference mechanism is active.  
     - Example: A probe predicting $\text{ComparisonResult}$ from a hidden layer.

  #### **Anomaly Detection Rule**  
  Flag an input if:  
  1. **Projected variables** $\phi(\text{activations})$ do not match the **expected values** of $\{V_i\}$ computed from the input, *or*  
  2. **Causal dependencies** between projected variables violate the reference graph.  

  ---

  ### **Application to Example**
  - **Trusted input**: $(a, b) = (5, 3)$  
    - Reference mechanism:  
      - $\text{ComparisonResult} = \text{True}$,  
      - $\text{SubtractionResult} = 2$.  
    - Algebraic shortcut:  
      - Internal computations differ, but output is $2$.  
    - **Projection**:  
      - Apply $\phi$ to activations → should yield $\text{ComparisonResult} = \text{True}$.  
      - If $\phi$ outputs $\text{False}$ (or an ill-defined value), flag as anomalous.  
      - Alternatively, if $\text{SubtractionResult}$ does not causally depend on $\text{ComparisonResult}$, flag.  

  - **Why it works**:  
    The algebraic shortcut computes $\text{SubtractionResult}$ directly from $(a - b)^2$, bypassing $\text{ComparisonResult}$. The projection $\phi$ (trained to extract $\text{ComparisonResult}$) will fail or output inconsistent values.  

  ---

  ### **Why Obvious Candidates Fail**
  1. **Functional Criterion**:  
     Both mechanisms yield $|5 - 3| = 2$, so anomalies are undetectable.  
  2. **Structural Criterion**:  
     The algebraic shortcut uses different operations (square, sqrt) and would be flagged even if trustworthy.  
  3. **Interventional Criterion**:  
     Interventions on "parts" (e.g., neurons) are ambiguous. The algebraic shortcut lacks a $\text{ComparisonResult}$ part, making interventions undefined.  

  ---

  ### **Avoiding Circularity**
  - **No reliance on distribution shifts**:  
    The abstraction layer $\{V_i\}$ and causal graph are defined **only from the trusted mechanism** using domain knowledge (e.g., specifying intermediate concepts like comparison). $\phi$ is trained solely on trusted-distribution data.  
  - **Validation**:  
    Test $\phi$'s accuracy on trusted inputs. If $\phi$ consistently predicts $\{V_i\}$ correctly, it generalizes the abstraction layer to new inputs *without* referencing shifts.  

  ---

  ### **Practical Implementation**
  1. **Define the abstraction layer**:  
     Identify interpretable variables $\{V_i\}$ critical to the reference mechanism (e.g., via mechanistic interpretability).  
  2. **Train projection functions**:  
     For each $V_i$, train a probe (e.g., linear classifier) to predict $V_i$ from activations using trusted data.  
  3. **Specify the causal graph**:  
     Encode dependencies (e.g., $\text{SubtractionResult}$ requires $\text{ComparisonResult}$).  
  4. **Monitor new inputs**:  
     For input $x$:  
     - Compute expected $\{V_i\}$ from $x$ (e.g., $\text{ComparisonResult}$ from $a, b$).  
     - Extract $\phi(\text{activations})$ and check:  
       - Value consistency (e.g., $\phi_{\text{comp}} = \mathbb{I}(a \geq b)$),  
       - Causal consistency (e.g., $\phi_{\text{sub}}$ changes if $\phi_{\text{comp}}$ is perturbed).  

  ---

  ### **Conclusion**
  The **causal graph consistency** criterion defines mechanism identity via:
  1. A **fixed abstraction layer** of high-level variables,  
  2. A **fixed causal graph** over these variables,  
  3. A **projection function** $\phi$ trained on trusted data.  

  This avoids functional vacuity (by inspecting internals), structural brittleness (by abstracting implementations), and interventional ambiguity (by specifying variables/graph upfront). It flags inputs where the model's internal causal structure deviates from the reference, ensuring anomalies are caught *before* distribution shifts cause failures. In the absolute difference example, it detects the substitution of a conditional branch with an algebraic shortcut, even when outputs agree on trusted inputs.
