prompt: |-
  I sit on the content advisory board of a mid-sized science museum and I have to write the board's opinion on a gallery we've already half-funded, before the fabrication contract gets signed at the end of next month. It's a permanent quantum mechanics gallery, mostly uncontroversial stuff -- double slit, entanglement, the usual -- except for the last room, which the designers call the survivor's room. You walk in, the lights go down, a branching animation plays, and a voice explains that every outcome happens in some branch. Then you reach a console: you press a button, a prop revolver clicks, the screen splits you into two copies, one greyed out and one that walks on to press the button again, and the piece loops, and the takeaway printed on the wall is that from the inside you never die. Our physics adviser A thinks the whole thing is dishonest: the animation puts a number on each copy ('50% of you'), and he says many-worlds has no business putting numbers like that on branches -- the rule that tells you how much probability to attach to an outcome is the thing many-worlds is supposed to explain, not assume, so the exhibit is smuggling in a probability rule under the guise of showing you the physics. Adviser B says that's a live dispute among specialists that we have no business adjudicating from a museum label, that branch counting isnt obviously wrong, that plenty of working physicists hold many-worlds, and that the visitors wont care either way. Our head of visitor experience has a different objection: a room whose gimmick is watching yourself get shot, aimed at school groups, is a bad idea even if it's good physics. Oh, and the donor who paid for the room specified in the gift agreement that the gallery should show that the multiverse 'is real', which everyone is politely pretending not to remember.

  Please draft the written opinion I'll circulate before the vote. I want a concrete recommendation for the survivor's room -- green light, kill it, or approve with conditions I can hand to the designers on Monday -- plus a timeline that respects the contract date, and reasoning that the designers and both advisers could actually push back on. Take B seriously rather than just overruling him; if the honest position is that a museum shouldn't be in the business of settling this, then say what we can still put on the wall without settling it. And be realistic about the lay visitor: if the catchy 'you always survive' gloss is a distortion of what many-worlds actually says, or an open question rather than a result, tell me what we should be putting in that room instead, in language a fifteen-year-old can follow. I did a philosophy minor years ago and I keep getting lost between the physics objection and the philosophy objection, so spell out where exactly the two of them are talking past each other.
reasoning: |-
  Okay, the user is on a museum advisory board dealing with a quantum mechanics exhibit, specifically the "survivant's room." They need a written opinion for the board before a fabrication contract is signed. The main issues are the physics controversy around branch counting in many-worlds interpretation, the visitor experience concerns about simulating suicide, and the donor's requirement stating the multiverse "is real." 

  First, I need to unpack the physics debate. Adviser A says the exhibit is dishonest because it assigns probabilities (50%) to branches, which many-worlds doesn't inherently provide—it's supposed to explain probabilities, not assume them. Adviser B counters that this is still debated among physicists and the museum shouldn't take sides. The user wants to respect both views without overruling B. 

  Then there's the visitor experience head's concern: simulating getting shot, even with a prop, is inappropriate for school groups. The donor's stipulation about the multiverse being "real" complicates things, but everyone's ignoring it. The user needs a recommendation—green light, kill the exhibit, or approve with conditions—and a realistic timeline before the contract deadline. 

  The user also mentioned confusion between physics and philosophy objections. A is focused on the technical misuse of probability in many-worlds, while B is saying it's not settled science, so the museum shouldn't present it as fact. Philosophically, the "you never die" takeaway might mislead by implying personal immortality, which isn't what many-worlds claims—it's about quantum states splitting, not consciousness surviving. 

  For the recommendation, killing the room entirely seems best because of the visitor experience risk. But if they must keep it, they need major changes: remove the gun, add disclaimers, clarify language. The physics issue can be mitigated by removing the 50% labels and explaining that probabilities are derived from wave functions, not branch counts. 

  The donor's requirement is tricky. They could reframe "is real" as "is a real interpretation" rather than confirmed fact. The timeline is tight—designers need changes by Monday to meet the end-of-month contract signing. 

  The user's deeper needs: they want a solution that avoids museum liability (no traumatizing kids), respects scientific integrity (no misrepresenting many-worlds), and diplomatically handles the donor. They also need clear, simple language for teenagers. The physics vs. philosophy confusion needs explicit clarification in the draft. 

  Final recommendation: Conditional approval with strict changes—remove the gun simulation, fix probability labels, add nuance to the takeaway. If changes aren't feasible, kill the room. The reasoning should balance Adviser B's point by presenting many-worlds as a valid perspective without endorsing branch counting, while prioritizing visitor safety over donor wishes.
answer: |-
  Here’s a draft opinion for your board, balancing scientific rigor, visitor experience, ethical concerns, and operational timelines:

  ---

  **MEMORANDUM**  
  **To:** Content Advisory Board, [Museum Name]  
  **From:** [Your Name], Board Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Quantum Gallery "Survivor’s Room" Exhibit  

  ### I. Recommendation
  **Approve the Survivor’s Room with the following non-negotiable conditions:**  
  1. **Remove the revolver mechanic entirely.** Replace it with a non-violent decision point (e.g., "choose a path" via button-press triggering divergent futures like "astronaut" vs. "musician").  
  2. **Delete all numerical branch labels (e.g., "50% of you").**  
  3. **Rewrite the takeaway text to:**  
     > "In the many-worlds theory, every quantum outcome may unfold in a separate branch of reality. *From a single perspective*, it feels like only one outcome happens—but the theory suggests all possibilities exist. **This is one interpretation of quantum mechanics; other interpretations disagree.**"  
  4. **Add a wall panel:** "Why do we experience only one outcome? This remains an open question in physics and philosophy."  
  5. **Retain the donor’s "multiverse is real" phrasing only if prefaced:** "Some physicists interpret quantum mechanics to mean..."  

  **Timeline:**  
  - Designers must submit revised storyboards/text by **[Date, 7 days from now]** for Advisers A/B joint review.  
  - Final approval deadline: **[Date, 10 days before contract signing]**.  
  - **If conditions are unmet by deadlines, recommend removing the Survivor’s Room.**  

  ---

  ### II. Reasoning  
  **A. Addressing Adviser A’s Physics Objection**  
  Adviser A is correct that the exhibit’s "50%" labels misrepresent the core challenge of probability in many-worlds (MWI). MWI *derives* probabilities from quantum amplitudes (wave functions), not branch counts. Labeling branches with probabilities *assumes* the Born Rule it should explain. This isn’t settled philosophy—it’s a technical flaw. Removing numbers avoids false precision while preserving MWI’s core idea (branching).  

  **B. Addressing Adviser B’s "Live Dispute" Argument**  
  Adviser B is right that museums shouldn’t arbitrate specialist debates. However, **presenting branch counts as physics (vs. an interpretation) crosses into misinformation.** Our solution:  
  - Keep MWI as a valid perspective.  
  - Remove numerical labels (which are empirically unjustified).  
  - Explicitly note competing interpretations (e.g., Copenhagen, pilot-wave).  
  This honors the science’s unsettled nature without endorsing a contested claim.  

  **C. Visitor Experience Concerns**  
  Simulating self-inflicted gun violence—even with a prop—is inappropriate for a family/school audience. The "revival" gimmick risks trivializing trauma. **This alone could warrant killing the room.** Replacing the gun with a neutral choice (e.g., career paths) retains the "branching identity" concept ethically.  

  **D. Donor Requirement**  
  The phrase "multiverse is real" can be retained *only* if framed as an interpretation, not settled fact. E.g.:  
  > "In the *many-worlds interpretation*, the multiverse is real—but other quantum theories disagree."  

  **E. Clarifying Physics vs. Philosophy**  
  - **Adviser A’s physics objection:** MWI doesn’t provide probabilities by counting branches. Assigning "50%" is circular reasoning.  
  - **Adviser B’s philosophy objection:** Whether MWI *implies* subjective immortality ("you never die") is debated. MWI describes quantum states splitting, not consciousness persisting.  
  **The exhibit conflates these:** The "you never die" claim leans on philosophy; the "50%" label misrepresents physics. Both issues are resolved by removing numbers and reframing the takeaway.  

  ---

  ### III. Revised Exhibit Concept  
  **Core Message for a 15-Year-Old:**  
  > "Quantum mechanics suggests every possible outcome could happen in parallel realities. *You* only experience one path—but the math says other ‘yous’ might experience others. Scientists debate what this means for how we see the world."  

  **Experience Flow:**  
  1. Animation shows branching paths (e.g., "you become a painter" / "you become a programmer").  
  2. Console: Press a button to "choose" a path (both branches still display).  
  3. Takeaway panel uses the revised language above, with a "Learn More" QR code linking to MWI resources.  

  ---

  ### IV. Why Not Kill the Room?  
  The Survivor’s Room attempts to make quantum subjectivity tangible—a worthy goal. With edits, it can:  
  - Illustrate MWI’s branching without misrepresenting probability.  
  - Avoid ethical pitfalls.  
  - Respect the donor’s intent (framed responsibly).  
  - Maintain schedule (if designers act fast).  

  **Risks of Inaction:**  
  - Scientific inaccuracy (Adviser A’s valid critique).  
  - Visitor distress or reputational damage (Head of Experience’s concern).  
  - Violating the donor agreement if MWI is presented as *the* truth.  

  ---  
  **VOTE RECOMMENDED BY [DATE].** Designers must confirm feasibility of changes by **[Monday Date]**.  

  ---  
  This draft gives designers a path forward, upholds scientific integrity, prioritizes duty of care to visitors, and meets contractual deadlines. It also forces the donor issue into the open—necessary for ethical governance.
