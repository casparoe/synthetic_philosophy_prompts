          k_max = 4, c=$0.50, then E=$2.00.

          P=$60.

          Total payout = 25*2.00 + 60 - 0.50*T = 50 + 60 - 0.50*T = 110 - 0.50*T.

          T can be at most 25*4=100, so minimum total payout = 110 - 0.50*100 = 110-50=60.
          T can be 0, then total payout=110.

          So we need to have between $60 and $110.

      This is affordable if we are willing to spend up to $110.

      We can reduce P to $30, then:

          total payout = 50 + 30 - 0.50*T = 80 - 0.50*T.

          Min T=0: $80, max T=100: 80-50=30.

          And then if everyone submits 1: T=25, per-entry prize=30/25=1.20, cash per person = 2.00 - 0.50*1 + 1*1.20 = 2.00 -0.50+1.20=2.70.

          If everyone submits 4: T=100, per-entry prize=0.30, cash per person = 2.00 - 0.50*4 + 4*0.30 = 2.00-2.00+1.20=1.20.

          The tragedy: they could have gotten 2.70 but now they get 1.20.

          But note: 1.20 is still positive.

      We'll go with:

          Endowment per person: $2.00 (which we don't distribute but use in accounting)
          Cost per entry: $0.50
          Prize: $30
          Maximum entries per person: 4

      Then at the end, we pay each participant:

          cash = 2.00 - 0.50 * e_i + e_i * (30 / T)

      We'll collect the entries, tally T, and then compute.

   5. **Debriefing**:

      We will see what happened. Likely, many participants submitted more than 1, so T is large and the per-entry prize is low. We can show:

          - What if everyone had submitted 1: then T=25, per-entry prize=1.20, so each would get 2.00 - 0.50 + 1.20 = 2.70.
          - What if everyone had submitted 4: then T=100, per-entry prize=0.30, each gets 2.00 - 2.00 + 4*0.30 = 1.20.
          - We can show the actual average: should be around 2.00 + (30 - 0.50*T)/25? Not exactly.

      Then we discuss superrationality:

          - In this symmetric game, what is the rational thing to do?
          - If everyone does what is individually rational (submit as many as possible), they end up worse off.
          - Superrationality: Hofstadter's idea is that in such symmetric games, you should choose as if your choice is the same as everyone else's. So you should choose an e that, if everyone chooses e, it maximizes your payoff.

          In this case, if everyone submits e, then T=25e, and your payoff is:

              2.00 - 0.50e + e * (30/(25e)) 
              = 2.00 - 0.50e + 30/25
              = 2.00 - 0.50e + 1.20
              = 3.20 - 0.50e

          This is maximized when e is minimized. So e=0? But if e=0, then T=0, which is undefined. Alternatively, we require at least one entry? Or we can say that if e=0, then there's no prize, so payoff=2.00.

          But if e=0, payoff=2.00.
          if e=1, payoff=3.20-0.50=2.70.
          if e=2, payoff=3.20-1.00=2.20.
          e=3: 3.20-1.50=1.70.
          e=4: 3.20-2.00=1.20.

          So the best common action is e=1, giving $2.70.

          But note: individually, if you think others will choose e=1, then you may be tempted to choose more. For example, if others choose 1, then T=24+e (for you). Your payoff if you choose k:

              2.00 - 0.50k + k * (30/(24+k))

          We can compute for k=1: 2.00-0.50+ 30/25 = 1.50 + 1.20 = 2.70.
          k=2: 2.00 - 1.00 + 2*(30/26) = 1.00 + 2*(1.1538)≈1.00+2.3076≈3.3076.
          k=3: 2.00-1.50+3*(30/27)=0.50+3*(1.1111)≈0.50+3.3333≈3.8333.
          k=4: 2.00-2.00+4*(30/28)=0+4*(1.0714)≈4.2857.

          So if you think others will choose 1, you should choose 4 and get $4.28! But if everyone does that, they get only $1.20.

          This is the tension.

      Now, connect to theory:

          - It's not altruism: because you are not necessarily caring about others. In fact, the superrational solution (e=1) is the one that, if everyone does it, gives the highest payoff to each.
          - Not Kantian universalizability: Kant would say act only according to that maxim which you can will to be a universal law. Here, the maxim "submit one entry" can be willed to be universal because it brings about the best outcome for you and for all. But the superrationality is more about the symmetry and the fixed point of everyone doing the same.
          - Not the reciprocity of a repeated game: because this is a one-shot game.

      What the Platonia telegram adds:

          In the Platonia dilemma (from Hofstadter), you are to send a telegram to a central address if you want to win a prize. The prize is awarded only if exactly one person sends a telegram. If more than one or none, no prize. And there is a large number of potential participants (say 20), and you are symmetric. The superrational solution: if you are symmetric, you should reason that either no one will send or someone will send. But then you might send and hope to be the only one. But if everyone does that, many send and no one wins. The superrational solution is to not send, because if everyone reasons that they are just like everyone else, then no one sends and no one wins? That doesn't work.

          Actually, Hofstadter's solution was to use a symmetry-breaking idea: each player should choose a random number with a very small probability p. Then there is a chance that exactly one person sends. But that's not deterministic.

          Our lottery game does not have this all-or-nothing aspect. Our game has a smooth degradation.

      So what can we do in debrief to explain the difference?

          - In the lottery game, we see that the individually rational action leads to a suboptimal outcome, and the superrational action (one entry) is better for all.
          - In the Platonia telegram, the superrational solution is not obvious and involves randomization.

      We can tell them about the Platonia telegram and how it is different.

   6. **What will predictably go wrong the first time**:

          - Participants may not understand the rules. We must explain very clearly, with examples.

          - Some participants may submit zero, some may submit 4. We will see a mixture.

          - The total T might be such that the per-entry prize is below cost, so some participants will have a net loss compared to the endowment. They might be upset.

          - We might have a T=0, which is undefined. But we can set a rule: if T=0, then no prize is awarded, and everyone gets their full endowment: $2.00. But if someone submits at least one entry, then T>0.

          - The calculation might be messy (with fractional pennies). We can round to the nearest cent.

          - Time: tallying 25 slips might take a few minutes. Have a helper.

          - Participants might try to collude during the game. We must emphasize that they are to decide independently.

      How to recover:

          - Have a clear slide with the rules and examples.
          - Do a dry run with a small example: 3 players, prize $6, cost $0.50, endowment $2.00, max entries 2. Show what happens if they all submit 1, or if one submits 2 and others 1, etc.

   7. **The one feature the activity cannot reproduce**:

          The lottery game we designed is a tragedy of the commons with a fixed prize and a cost per entry. This captures the essence of the individual vs. group conflict. However, it does not perfectly capture the idea of superrationality as a fixed point in which every player's decision is conditioned on everyone being identical and therefore making the same choice. In our game, the superrational choice (everyone choosing 1) is a focal point that they can see by doing the thought experiment. But in the heat of the game, they may not trust that others will do the same. The activity cannot reproduce the leap of faith that Hofstadter describes, where you choose the cooperative action not because of repeated interactions or explicit agreement, but because you assume that everyone is reasoning the same way and will land on the same choice. In our game, without communication, it's very likely that many will choose more than 1, leading to the bad outcome. We will have to supply the idea that in a world of superrational players, they would all choose 1, and that this is a stable outcome. But in the real world with ordinary rational players, they defect.

      We can highlight this in the debrief: the activity shows the tension, but it cannot make the participants superrational. They will likely fall into the trap. The instructor must explain the superrational ideal.

   8. **Final Parameters**:

          - Endowment per person: $2.00 (accounting only, not distributed)
          - Cost per entry: $0.50
          - Prize: $30
          - Maximum entries per person: 4
          - Each participant submits a whole number from 0 to 4.

          Payout for participant i: 
              = $2.00 - $0.50 * e_i + e_i * ($30 / T)

          where T = total entries.

          We will need:
              - Slips of paper
              - A box to collect
              - Calculator to compute T and then 30/T
              - Spreadsheet or paper to record each participant's e_i and compute their payout.

      Let's hope T>0. If T=0, then we set payouts to $2.00 each.

      We'll run it and see what happens.

      Note: We are spending up to $110 (if T=0, we pay 25*2=$50; if T=100, we pay 25*2 + 30 - 0.50*100 = 50+30-50=$30). We might also have to pay the prize of $30 in the middle? No, the $30 is included in the payout formula. So we only pay the net amount to each participant.

      Total facilitator cost = 25*2 + 30 - 0.50*T = 80 - 0.50*T.

      We must have between $30 and $80 in cash (in small denominations) to pay out.

      We'll prepare $80 in cash (in $1 bills and coins).

      Steps in the session:

          1. Introduction (5 minutes): Explain the rules, the payout, and the goal (maximize your own cash). Do a dry run with 3 players and prize $6 to show examples.
          2. Decision and collection (5 minutes): Participants write their e_i (0-4) on a slip with their name, fold, and put in a box.
          3. Tally and compute (10 minutes): Open the box, record the entries, compute T, then compute per-entry prize = 30/T (if T>0), then for each participant, compute cash = 2.00 - 0.50*e_i + e_i*(30/T). Round to the nearest cent.
          4. Payout (5 minutes): Pay each participant their cash.
          5. Debrief (35 minutes): Discuss the outcome, show the ideal, and explain superrationality and how it differs from other concepts.

      Note: The entire session is 60 minutes.

      Adjust timing as needed.

      Let's do it!
answer: |-
  ### Session Design: Superrationality Lottery

  **Objective:** Create an experiential understanding of superrationality—where individually rational actions lead to collectively poor outcomes, and the only escape is a counterintuitive form of reasoning that treats symmetry as given.

  ---

  ### **Rules of the Lottery**  
  1. **Prize & Setup**:  
     - The prize is a **$60 gift card** to a popular coffee chain (e.g., Starbucks), chosen because it’s universally desired, non-divisive, and affordable.  
     - The prize is **divided by the total number of entries** submitted by all participants.  
       - *Example*: If 30 total entries are submitted, each entry is worth $2.00 ($60 ÷ 30).  
     - **Each participant may submit 0–10 entries** (written on a slip). Submitting more entries increases your *share* of the prize but *dilutes* the prize per entry.  

  2. **Payoff Structure**:  
     - Your payout = (Your entries) × ($60 ÷ Total entries).  
     - *Example*: If you submit 5 entries and total entries = 20, you get 5 × ($60/20) = $15.  
     - **No entry fee**—this simplifies the game and mirrors the "free entry" lottery from *Scientific American* (1983).  

  3. **Entry Collection & Anonymity**:  
     - **Materials**: Slips of paper, pens, a sealed box, a whiteboard.  
     - **Process**:  
       1. Participants write their **name** and **number of entries** (0–10) on a slip.  
       2. Slips are folded and placed in a **sealed box** at the front.  
       3. Once all slips are collected, the facilitator publicly tallies entries on a whiteboard:  
          - Read each slip aloud (e.g., "Alex: 3"), recording names and numbers.  
          - Sum the **total entries (T)**.  
       4. Calculate the **prize per entry**: $60 ÷ T.  
       5. Announce individual payouts (e.g., "Alex gets 3 × [$60/T] = $X").  
     - **Why this works**: Anonymity until tallying prevents last-minute coordination. Public tallying ensures transparency and creates a shared "aha" moment.  

  4. **Time Allocation** (60 mins total):  
     - **Intro (5 mins)**: Explain rules, examples, and goal ("Maximize your individual payout").  
     - **Decision & Collection (10 mins)**: Participants submit entries.  
     - **Tally & Payout (15 mins)**: Calculate and announce results.  
     - **Debrief (30 mins)**: Discuss outcomes and theory.  

  ---

  ### **Predicted Problems & Recovery**  
  1. **Problem: Over-Submission (Tragedy of the Commons)**  
     - Participants will likely submit >1 entry (e.g., 5–10), inflating **T** and crashing the prize per entry.  
     - *Example*: If all submit 5 entries (T = 125), prize per entry = $0.48 → Everyone gets $2.40.  
       (If all submitted 1, they’d get $2.40 each too—*but with less effort*.)  
     - **Recovery**: Highlight the irony: "You all worked harder for the same outcome. What if you’d submitted 1?"  

  2. **Problem: Suspicion of Cheating**  
     - Participants may worry others will submit high entries.  
     - **Recovery**: Reassure them post-game with public data ("Here’s what each person did").  

  3. **Problem: Math Errors**  
     - Calculating $60/T in real-time may cause delays.  
     - **Recovery**: Use a calculator and pre-draw a table of possible T values (e.g., T=20 → $3/entry).  

  ---

  ### **Debrief: Connecting to Theory**  
  **Stage 1: Outcome Analysis**  
  - Show the payout distribution:  
    - *If all chose 1*: T = 25 → $2.40 each.  
    - *Actual choices*: T likely >25 → prize per entry <$2.40.  
  - **Key insight**: Individual maximization ("I’ll submit more to get a bigger slice") backfires when all do it.  

  **Stage 2: Superrationality Explained**  
  - **What it is**: Choosing as if your decision *determines* everyone else’s (because all reason identically in symmetric games).  
    - Here: If all choose 1, all get $2.40. Submitting 1 isn’t "generous"—it’s the only stable optimum.  
  - **What it’s NOT**:  
    - **Altruism**: You don’t submit 1 to "help others"—you do it because it’s the *only* choice that works if all mirror you.  
    - **Kantian universalizability**: Kant asks, "What if everyone did this?" but doesn’t assume *they will*. Superrationality *requires* that they do.  
    - **Repeated-game reciprocity**: No future rounds to punish defectors—this is a one-shot game.  

  **Stage 3: The Platonia Telegram Twist**  
  - **Platonia Dilemma (Hofstadter)**:  
    - *Setup*: 20 people. If exactly 1 sends a "yes" telegram, they win $1M. If 0 or >1, no one wins.  
    - *Superrational solution*: All decide *not* to send, as sending risks duplication (no winner).  
  - **What this adds vs. our lottery**:  
    - Platonia is **all-or-nothing**—it forces a *binary* choice (send/not send) where *any* individualism fails.  
    - Our lottery shows a **gradient tragedy**—individualism merely *erodes* value, making superrationality less obvious.  
  - **Takeaway**: Both reveal the core of superrationality: symmetry isn’t just likely—it’s *axiomatic* for rational agents.  

  ---

  ### **The Missing Feature: The "Aha" of Symmetry**  
  **What the activity can’t reproduce**:  
  The moment of **first-person symmetry realization**—where you *feel* your choice must equal others’ because "we’re all identical." In the game, participants still see themselves as distinct agents ("*I*’ll submit 3, but *they* might submit 1").  

  **How to supply it**:  
  - **Narrative**: Share Hofstadter’s analogy:  
    > "Superrationality is like fireflies synchronizing flashes. No one leads; they *become* a collective rhythm. Your choice isn’t yours alone—it’s a note in a symphony only heard if all play the same."  
  - **Question**: "If everyone in this room is as smart as you, what *must* they be thinking right now? And what does that mean for you?"  

  ---

  ### **Why This Works**  
  - **Tangible stakes**: A $60 prize ensures genuine engagement.  
  - **No math beyond division**: Accessible to all.  
  - **Public tallying**: Creates shared tension and revelation.  
  - **Theory→practice**: The lottery mirrors real-world dilemmas (e.g., climate action, stock market runs).  

  By the end, participants won’t just *understand* superrationality—they’ll have *lived* its frustration and glimpsed its elusive logic.
