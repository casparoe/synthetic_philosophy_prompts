  Calculating the maximum possible combinations: 3 (unit) × 3 (goal) × 2 (normative) × 2 (threshold) = 36 potential leaves. But many will be unoccupied or incoherent, so we'll prune to the meaningful 8-12 positions. The diagnostic cases (thermostat, chess engine, etc.) will serve as test points.

  Noticing some constraints: Normative views almost always require sociotechnical unit and threshold nature. Representational goals imply artifact-only unit. Predictive-stance goals pair naturally with behaviorist views. The ventriloquism problem must appear as a coherent position.

  Key branch points:
  1. Start with unit (most fundamental divergence)
  2. Then goal requirements (ties to philosophical traditions)
  3. Normative/descriptive (reveals responsibility disputes)
  4. Threshold/degree (handles continuum concerns)

  For leaf positions:
  - Representational goals + artifact unit = classical AI agency (e.g., trading bot)
  - Behaviorist + artifact-plus = functional agency (customer service bot surprises)
  - Predictive + sociotechnical = intentional stance (recommender systems)
  - Normative versions will handle responsibility claims

  Special case: Ventriloquism is artifact-unit agency with normative stance - lets companies deflect blame while anthropomorphizing systems.

  Unseparable leaves: Functional representationalism and predictive stance both describe goal-directed behavior similarly despite different philosophical commitments.

  Abandoned branches: Sociotechnical unit + representational goals is incoherent because goals can't be "represented" across diffuse human systems. Artifact-only + normative creates responsibility gaps.

  The tree will resolve group conflicts by showing thermostat debates stem from unit disagreements, while responsibility arguments stem from normative/descriptive confusion. The structure makes explicit what's being contested in each "agent" claim.
answer: |-
  Here's a taxonomy structured as a decision tree, separating your four axes (unit, goal, normative/descriptive, threshold/degree). It yields 10 distinct leaf positions, with unoccupied branches marked. Diagnostic cases are referenced in brackets where pivotal. The tree resolves disagreements by showing where definitions diverge.

  ```plaintext
  1. What is the PRIMARY UNIT of agency? 
     ├── A. The artifact itself (hardware/software)
     │   ├── 2. What constitutes having a GOAL?
     │   │   ├── i. Goal requires explicit internal representation (e.g., encoded objective function)
     │   │   │   ├── 3. Is "agent" a DESCRIPTIVE or NORMATIVE term?
     │   │   │   │   ├── a. Descriptive: Functional representation required
     │   │   │   │   │   └── 4. Is agency THRESHOLD or DEGREE?
     │   │   │   │   │       ├── (1) Threshold: "Classical AI Agent" (e.g., trading bot [Trading Bot])
     │   │   │   │   │       │       └── Awkward: Excludes systems that behave goal-directedly without explicit representation (e.g., some RL systems).
     │   │   │   │   │       └── (2) Degree: "Scaled Representationalism" (unnamed)
     │   │   │   │   │               └── Awkward: Requires quantifying "degree of representation," which lacks clear metrics.
     │   │   │   │   └── b. Normative: Responsibility follows capability
     │   │   │   │       └── 4. THRESHOLD only (normativity implies a line)
     │   │   │   │           └── "Ventriloquist's Puppet" [Position for ventriloquism problem]
     │   │   │   │                   └── Awkward: Artifact is normatively an agent, but lacks moral personhood, creating a responsibility void.
     │   │   │   └── ii. Goal is defined by goal-directed BEHAVIOR (system reliably achieves outcomes)
     │   │   │       ├── 3. DESCRIPTIVE only (behavior is observable)
     │   │   │       │   └── 4. DEGREE only (behavior gradation is inherent)
     │   │   │       │       └── "Functional Behaviorism" (e.g., thermostat [Thermostat], chess engine [Chess Engine])
     │   │   │       │               └── Awkward: Grants agency to simple feedback systems, potentially diluting the term.
     │   │   │       └── iii. Goal is ascribed via the INTENTIONAL STANCE (predictive utility) [FLAGGED: Unseparable from iii below]
     │   │   └── iii. Goal is ascribed via the INTENTIONAL STANCE (predictive utility)
     │   │       ├── 3. DESCRIPTIVE only (stance is a tool)
     │   │       │   └── 4. DEGREE only (utility is gradational)
     │   │       │       └── "Intentional Stance Pragmatism" (e.g., recommender [Recommender], flattering chatbot [Customer Service Model])
     │   │       │               └── Awkward: Agency depends entirely on the observer's predictive needs, not intrinsic properties.
     │   │       └── [Branch iii & ii above are UNSEPARABLE in practice for descriptive views. Both lead to functionally similar classifications based on observed/predicted behavior.]
     │   └── B. Artifact-plus-deployment (incl. prompts, users, guardrails)
     │       └── 2. What constitutes having a GOAL? 
     │           └── ii. Goal is defined by goal-directed BEHAVIOR (or iii. Intentional Stance - inseparable) 
     │               ├── 3. DESCRIPTIVE
     │               │   └── 4. DEGREE
     │               │       └── "Situated Functional Agent" (e.g., customer service model [Customer Service Model], multi-agent system [Multi-Agent])
     │               │               └── Awkward: Agency vanishes if deployment context changes (e.g., same model in a sandbox).
     │               └── 3. NORMATIVE
     │                   └── 4. THRESHOLD
     │                       └── "Deployment-Context Responsibility" (unnamed, rarely defended consistently)
     │                               └── Awkward: Makes normative status hyper-context-dependent, complicating accountability.
     └── C. Sociotechnical system (incl. developers, users, society)
         ├── 2. What constitutes having a GOAL?
         │   └── ii. Goal is defined by goal-directed BEHAVIOR (or iii. Intentional Stance) 
         │       ├── 3. DESCRIPTIVE
         │       │   └── 4. DEGREE
         │       │       └── "Holistic Systems View" (e.g., recommender's societal impact [Recommender])
         │       │               └── Awkward: Over-inclusive; almost any technology exhibits "agency" at this level (e.g., cars, markets).
         │       └── 3. NORMATIVE
         │           └── 4. THRESHOLD
         │               └── "Collective Responsibility View" (e.g., emerging harm in multi-agent system [Multi-Agent])
         │                       └── Awkward: Diffuses responsibility so widely that specific accountability is hard to assign.
         └── [Branch A.i (Representation) ABANDONED: Incoherent. Goals cannot be "represented" in a diffuse sociotechnical system; representation requires a specific locus like an artifact.]
  ```

  **Key Diagnostics Applied:**
  *   **Thermostat:** Only "Functional Behaviorism" (A.ii.a) calls it an agent.
  *   **Chess Engine:** "Functional Behaviorism" (A.ii.a) or "Intentional Stance Pragmatism" (A.iii.a).
  *   **Flattering Chatbot:** "Intentional Stance Pragmatism" (A.iii.a) or "Situated Functional Agent" (B.ii.a).
  *   **Nasty Recommender:** "Intentional Stance Pragmatism" (A.iii.a) or "Holistic Systems View" (C.ii.a).
  *   **Trading Bot:** "Classical AI Agent" (A.i.a.1).
  *   **Model Saying It Wants Things:** "Intentional Stance Pragmatism" (A.iii.a) if descriptive; "Ventriloquist's Puppet" (A.i.b) if normative.
  *   **Lying Model:** "Intentional Stance Pragmatism" (A.iii.a) or "Situated Functional Agent" (B.ii.a).
  *   **Multi-Agent Harm:** "Situated Functional Agent" (B.ii.a) or "Collective Responsibility View" (C.ii.b).
  *   **Ventriloquism Problem:** Explicitly captured as the "Ventriloquist's Puppet" (A.i.b) leaf.

  **Why Unoccupied/Abandoned Branches:**
  *   **A.i.a.2 (Scaled Representationalism):** Unattractive. No clear way to measure "degree" of representation; undermines the threshold appeal of representation.
  *   **A.ii.b / A.iii.b (Normative + Artifact Behavior/Stance):** Incoherent. Normativity requires assigning responsibility, but an artifact alone lacks moral patient/agent status. Ventriloquism (A.i.b) bypasses this by misapplying normativity.
  *   **B.i (Artifact-plus-deployment + Represented Goal):** Unoccupied (not incoherent). Practitioners focus either on the artifact (A.i) or the situated behavior (B.ii).
  *   **C.i (Sociotechnical + Represented Goal):** Incoherent. Representation requires a specific cognitive/algorithmic locus, not a diffuse system.
  *   **Threshold + Degree everywhere:** Threshold is only coherent under representation (A.i.a) or normativity. Pure behavior/context is inherently gradational.

  **How This Resolves Your Fight:** Your group likely conflates:
  1.  **Unit:** RL friend (artifact) vs. Philosophy friend (possibly sociotechnical for humans).
  2.  **Goal:** RL friend (representation?) vs. Philosophy friend (behavior/intentional stance).
  3.  **Normative/Descriptive:** The "ventriloquism" move uses 'agent' normatively (blame artifact) while others use it descriptively (how it functions).
  4.  **Threshold/Degree:** Arguments about whether agency is "all-or-nothing" vs. "more-or-less" hinge on which branch you're on.

  This tree forces explicit choices on each axis, showing disagreements are often about *which question matters most*, not the answer to a single question. Print away!
