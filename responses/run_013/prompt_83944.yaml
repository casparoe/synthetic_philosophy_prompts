prompt: |-
  I've spent a few years reading about independence movements in my spare time, and I've reached the point where I can state my verdicts on individual cases but not the rule behind them. I have no training in philosophy or law — I write software for a living — so I'd like you to tell me what principle, if any, my verdicts add up to.

  Here is where I land.

  Scotland, 2014: the referendum was legitimate, and had Yes won, Westminster should have negotiated an exit in good faith. That London consented in advance matters to me less than it seems to matter to other people.

  Quebec, 1995: also legitimate, even though Ottawa never agreed in advance to be bound by the result. A narrow Yes would have given Quebec a genuine claim to negotiate secession.

  Catalonia, 2017: not legitimate. I take the vote to have been a real expression of opinion, but declaring independence on the strength of it was wrong, and Madrid was entitled to treat the result as void.

  Kosovo, 2008: legitimate, unilateral declaration and all, despite Serbia's refusal to consent and the many states that still withhold recognition.

  Crimea, 2014: not legitimate, and not a close call. Whatever the ballot said, the vote was held under foreign military occupation.

  Somaliland, 1991 to the present: legitimate. It is unrecognized and its independence was declared unilaterally, but it has governed itself for more than thirty years, and the state it left had turned on its people violently.

  On franchise: I think it was right that only people resident in Scotland voted in 2014; the rest of the United Kingdom had no business deciding whether Scotland leaves it.

  A counterfactual: had Scotland voted Yes, I believe Shetland and Orkney would have been entitled to remain in the UK, or at least to negotiate their own status, even though they sit inside Scotland.

  The pair I cannot square is Quebec and Catalonia. Both were unilateral in the sense that the central government had not agreed in advance to be bound, yet I approve of one and not the other. I have tried several principles. A clear majority in a defined territory wanting it: this saves Quebec, but it also appears to license Catalonia and to give Shetland a veto over Scotland, which I don't want. Serious injustice as the only warrant: this saves Kosovo and Somaliland, but it condemns Quebec, which I also don't want. Legality under the parent state's own constitution: this gets Catalonia right, and it makes the whole question hostage to whatever the capital has written down — which cannot be right, given that Spain's constitution declares the unity of the Spanish nation to be indissoluble and Canada's is silent on the matter.

  So: is there one principle, or a small set, that gets all of these, and if not, which verdict do I have to give up? For whichever principle survives, tell me what it predicts about a case I have not listed — a wealthy region with no history of oppression that wants out of a union it believes it is subsidizing, a Flanders or a Lombardy. And tell me which clause is doing the work for each of my verdicts, so I can see where the machinery is load-bearing.
reasoning: |-
  Okay, the user is a software developer who's been independently researching independence movements and wants to understand the underlying principles behind their judgments. They've listed specific cases like Scotland, Quebec, Catalonia, Kosovo, Crimea, and Somaliland, each with their verdicts. The main challenge is reconciling Quebec and Catalonia since both were unilateral but they approve of Quebec and not Catalonia.

  First, I need to identify patterns in their judgments. They value democratic expression (Quebec, Scotland) but also consider historical injustice (Kosovo, Somaliland). The franchise point about residents only voting in Scotland and Shetland's potential right to self-determination shows they care about sub-territorial consent. 

  The key conflict is between Quebec and Catalonia. The user rejects legality under the parent state's constitution because it makes secession dependent on the central government, which they don't agree with. They also don't want serious injustice as the only criterion because that would exclude Quebec. So what principle bridges Quebec's approval and Catalonia's rejection?

  Ah, the principle of "Good Faith Negotiation Obligation" might fit. Quebec had prior negotiations (Clarity Act) and a clear question, while Catalonia didn't engage in sustained negotiation and had a contested process. That explains the difference. Also, for Kosovo and Somaliland, the breakdown of the parent state due to violence justifies unilateral action. Crimea's foreign military occupation invalidates it, and Somaliland's de facto stability adds legitimacy.

  Testing this with Flanders/Lombardy: a wealthy region without oppression. The user's framework would require a clear referendum after good faith efforts and addressing sub-regional consent. If the central government refuses negotiations despite a clear majority, it might gain legitimacy over time, but initially, it's not justified.

  The user might also have an implicit value of minimizing violence and preferring peaceful processes. Their background in software could mean they appreciate systematic principles but also practical outcomes. They need a coherent framework that doesn't rely on legality alone but incorporates negotiation, justice, and stability. The unspoken need might be validating their self-taught analysis with a structured principle that feels consistent and ethically sound.
answer: |-
  Your verdicts reveal a coherent ethical framework centered on **procedural integrity, historical context, and the legitimacy of authority**—not rigid legalism. The core principle unifying your judgments is:

  **"Secession is legitimate when it reflects the clear will of a territorially defined people *and* either (a) occurs through a mutually agreed process with the parent state, or (b) is justified by the parent state’s prior breach of its fundamental obligations (e.g., through oppression, dissolution, or loss of effective sovereignty), *provided* the seceding entity demonstrates credible governance and respects sub-regional self-determination."**

  Here’s how this principle maps to your cases, clause-by-clause:

  1. **Scotland (2014)**  
     *Clause*: **(a)** Mutually agreed process (referendum negotiated with Westminster).  
     *Why it fits*: The "clear will" was sought via agreed procedure, even if consent wasn't your primary focus.

  2. **Quebec (1995)**  
     *Clause*: **Implicit (a)**. Despite no *formal* pre-agreement, Canada engaged substantively (Clarity Act post-referendum acknowledged the *possibility* of secession after a clear question/majority). Ottawa’s *conduct* created a de facto duty to negotiate.  
     *Why not Catalonia?* Spain offered no such engagement—it consistently denied Catalonia’s right to even *hold* a vote, making the process unilateral in essence.

  3. **Catalonia (2017)**  
     *Clause*: **Fails (a)** (no mutual process; Spain actively opposed) **and (b)** (no prior breach by Spain—Catalonia wasn’t oppressed/systematically denied rights). The "clear will" was also muddied by boycotts/legal threats.  
     *Key distinction from Quebec*: Canada’s tacit acknowledgment vs. Spain’s active suppression of the *process itself*.

  4. **Kosovo (2008)**  
     *Clause*: **(b)** Parent state (Serbia) breached obligations via violent oppression and loss of effective sovereignty (after UN administration post-1999).  
     *Why unilateralism is acceptable*: Serbia forfeited moral authority over Kosovo through its actions.

  5. **Crimea (2014)**  
     *Clause*: **Fails (b)**. No prior breach by Ukraine; Russia’s invasion *created* the "will" via military coercion. Illegitimate authority (occupation forces controlled the process).

  6. **Somaliland (1991)**  
     *Clause*: **(b)** Parent state (Somalia) dissolved and committed atrocities against its people. **Plus** credible governance demonstrated over decades.  
     *Why recognition isn't required*: Legitimacy stems from functional statehood and context, not external validation.

  **On Franchise & Sub-Regions (Shetland/Orkney)**  
  This aligns with **subsidiary self-determination**:  
  - Franchise limited to residents: The "territorially defined people" directly affected.  
  - Shetland/Orkney’s claim: If Scotland secedes, *they* become a "people" within the new parent state (Scotland), entitled to their own expression of will. Hierarchy matters.

  ---

  ### Resolving Quebec vs. Catalonia
  - **Quebec**: Canada’s *post-referendum engagement* (even if reluctant) validated the process as sufficiently "mutual" retroactively. The absence of pre-agreement was mitigated by democratic responsiveness.  
  - **Catalonia**: Spain’s *consistent denial* of any process—before, during, and after the vote—made it purely coercive. Without Spain’s breach **(b)**, unilateralism lacked justification.  

  **Your implicit standard**: A parent state must engage in good-faith negotiation *if* a clear will is demonstrated, even absent prior consent. Canada did this; Spain did not.

  ---

  ### Prediction: Flanders/Lombardy Case
  - **Wealthy region, no oppression, claims economic burden**.  
  - **Under your principle**: Not legitimate unilaterally.  
    - Fails **(b)** (no prior breach by parent state).  
    - Requires **(a)**: Mutually agreed referendum after sustained negotiation.  
    - If the parent state (e.g., Belgium/Italy) *refuses any process despite clear, persistent demand*, legitimacy could emerge over time—but only if refusal itself becomes a democratic breach **(b)**. Short of that, unilateral declaration would mirror Catalonia.

  ---

  ### Which Verdict Might Need Reconsidering?
  **Somaliland** is your hardest case under strict proceduralism. You emphasize *governance* and *historical context* over process—which is defensible but stretches "mutual agreement" the most. If you demand consistency on pure procedural grounds, Somaliland challenges you. However, your inclusion of "credible governance" as a mitigating factor justifies it within your framework.

  ### Core Machinery
  - **Load-bearing clause**: **(b)** "Parent state’s prior breach." This does the heavy lifting for Kosovo/Somaliland and exonerates Quebec via Canada’s *post hoc* engagement.  
  - **Critical nuance**: "Mutually agreed process" **(a)** doesn’t require *pre-approval* (hence Quebec), but demands the parent state engage *when confronted with a clear will*.  
  - **Anchor**: "Clear will of a territorially defined people" prevents arbitrary secession and justifies sub-regional rights (Shetland).

  Your framework is **contextual democratic legitimacy**, prioritizing moral authority over legal positivism. It’s philosophically coherent—and aligns with emerging norms in international law (e.g., the Canadian Supreme Court’s *Quebec Secession Reference*).
