  Then the friction points: Berkeley's God isn't just an implied narrator but a necessary ontological ground. The user's "licensed inferences" are reader-side constructions, while divine perception is world-constitutive. Also, the user's "house at 3am" relies on causal continuity, whereas Berkeley needs active perception. The residue suggests the vocabulary handles epistemology but not metaphysics—the "thinness" is in the user's framework, not Berkeley. 

