answer: |-
  ### Decision Tree: Navigating Cluelessness in Consequentialism

  **Starting Commitment:** "I should try to bring about the best consequences."  
  **Problem:** Our inability to foresee long-term/higher-order consequences ("cluelessness") challenges this commitment.  

  ---

  #### **Q1:** Does cluelessness make it impossible to compare which actions have better *overall* consequences?  
  - **Yes** → Proceed to Q2.  
  - **No** → Proceed to Q3.  

  #### **Q2:** Is this impossibility unique to consequentialism?  
  - **Yes** → **Leaf (f): Exit to Non-Consequentialist Ethics**  
    *Awkward commitment: You must justify how non-consequentialist theories (e.g., deontology, virtue ethics) avoid cluelessness when they also rely on outcomes for justification.*  
  - **No** → **Leaf (g): Universal Cluelessness**  
    *Awkward commitment: You must explain why consequentialism isn’t *worse* off than other theories, given its explicit focus on consequences.*  

  ---

  #### **Q3:** Should we judge acts by their *actual* consequences or their *expected* consequences (given our best beliefs)?  
  - **Actual consequences** → Proceed to Q4.  
  - **Expected consequences** → Proceed to Q5.  

  #### **Q4:** Should we use *foreseeable* consequences as a practical guide?  
  - **Yes** → **Leaf (e): Actual vs. Foreseeable**  
    *Awkward commitment: You might knowingly choose an act that is "right" by your procedure but actually produces terrible consequences.*  
  - **No** → Proceed to Q6.  

  #### **Q5:** Can we reliably calculate expected value given our cluelessness?  
  - **Yes** → **Leaf (a): Expected Value View**  
    *Awkward commitment: You must defend assigning precise probabilities to outcomes about which you admit deep ignorance.*  
  - **No** → Proceed to Q7.  

  ---

  #### **Q6:** Is cluelessness primarily a confusion between the *standard* of rightness (actual consequences) and *how we decide*?  
  - **Yes** → **Leaf (b): Standard vs. Decision-Procedure**  
    *Awkward commitment: You must accept that "doing your best" could still result in catastrophe, with no moral error.*  
  - **No** → Proceed to Q7.  

  ---

  #### **Q7:** Should we prioritize interventions that are *robustly good* across many scenarios?  
  - **Yes** → **Leaf (c): Robust Maxi-Person**  
    *Awkward commitment: You might reject high-upside acts that aren’t robust (e.g., funding a risky medical breakthrough).*  
  - **No** → Proceed to Q8.  

  #### **Q8:** Should we switch to cultivating rules/dispositions/institutions instead of assessing acts?  
  - **Yes** → **Leaf (d): Rules/Dispositions/Institutions**  
    *Awkward commitment: You might follow a rule even when you suspect breaking it would yield better consequences.*  
  - **No** → **Leaf: Unnamed**  
    *Diagnosis: Coherent but unattractive—offers no alternative method for decisions under cluelessness.*  

  ---

  ### Notes on the Terrain  
  - **Settled**: All positions agree cluelessness is a serious challenge.  
  - **Contested**:  
    - Severity of cluelessness (Q1): Some argue it’s epistemic (we lack data), others metaphysical (consequences are incomparable).  
    - Feasibility of expected value (Q5): Disputed even among utilitarians (e.g., Can we quantify credences about century-scale effects?).  
    - Viability of non-consequentialism (Q2): Whether cluelessness uniquely undermines consequentialism is hotly debated.  
  - **Unoccupied Paths**:  
    - *Q1=No → Q3=Actual → Q4=No → Q6=No → Q7=No → Q8=No*: **Unnamed** (diagnosis: coherent but unattractive—no practical guidance).  
    - *Q1=No → Q3=Expected → Q5=No → Q7=No → Q8=No*: **Unnamed** (diagnosis: same as above).  
  - **Shared Leaves**:  
    - (c) and (d) appear in both "Actual" and "Expected" branches. This reflects that robustness/rules are proposed as decision procedures under either standard.  

  ### Key Distinctions (No Smoothing)  
  - **Expected Value (a)** vs. **Robustness (c)**: (a) embraces probabilistic gambles; (c) avoids them.  
  - **Standard vs. Procedure (b)** vs. **Rules (d)**: (b) keeps act-consequentialism but separates theory/practice; (d) abandons act-focused evaluation.  
  - **Non-Consequentialism (f)** vs. **Universal Cluelessness (g)**: (f) sees cluelessness as a fatal flaw for consequentialism; (g) sees it as equally problematic everywhere.  

  This tree maps the logical space first, with named positions fitted to it. Positions (a)–(g) are all reachable, and contested splits are preserved.
