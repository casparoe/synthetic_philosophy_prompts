prompt: |-
  Okay, so I've been reading about how health systems decide which treatments to pay for, and I've gotten stuck on something.

  The practice: an agency works out the cost per quality-adjusted life-year for a treatment — you take a year of life, weight it by how good that year is, and they actually survey people to get those weights — and then it pays for stuff below some cutoff and says no above it. So there's effectively a price on a year of healthy life. But the same systems won't let you sell a kidney, and when a specific named person is in danger — trapped in a mine, on the news, everyone watching — they'll spend sums that blow way past the cutoff, sometimes on one person. And nobody treats that as a scandal exactly.

  So what does this practice presuppose about value? That health states are comparable across people on one scale? That a year of life is a quantity you can trade against money? That value is measurable at all?

  And here's whats really bugging me. I've been reading Quine, and as far as I can tell he treats ethics as more like engineering than like science — you settle on ends, then reason about means — and I'm not even sure he'd say moral claims are the kind of thing that can be true or false. If that's right, is the cutoff a discovery or a decision? Does the practice need moral facts to be real, or would it run exactly the same either way?

  Please be careful to separate what the practice strictly presupposes from what it just fits comfortably with — I suspect several different theories of value would all be fine with it, and I want to know which parts are actually load-bearing. Then say what would have to change if you swapped in a different theory.

  Bottom line in the first sentence, then the reasoning. No preamble, no restating my question.
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with the ethical contradictions in health systems that use QALY-based cost-effectiveness analysis alongside prohibitions on organ sales and high-cost rescues. The core tension is between apparent commodification of life in policy versus non-commodification in other contexts. 

  Hmm, the user is clearly well-read - they reference Quine and make nuanced distinctions between presuppositions vs comfortable fits. Their frustration about inconsistent valuation is palpable. I should acknowledge that tension without oversimplifying. 

  First, the QALY system's hard presuppositions: it absolutely requires health states to be cardinally measurable and interpersonally comparable on a single scale. Without that, the whole cost-per-QALY calculation collapses. The willingness to trade money for aggregated QALYs is also fundamental - though interestingly, the rescue cases show this gets suspended for identified lives. 

  Ah, and about moral ontology: clever observation that QALY thresholds function identically whether we see them as discovered truths or political decisions. The practice only needs operational measurability, not moral realism. But if we swapped in a deontological framework that rejected quality-weighting or trading life for money? That would break the model entirely. 

  User's Quine reference suggests they might appreciate the engineering analogy: QALY systems are tools for achieving agreed-upon ends (health maximization), not truth-claims. The rescue cases expose that we don't consistently apply those tools - perhaps because identified lives trigger different psychological mechanisms. 

  Better emphasize that last point: the inconsistency isn't hypocrisy but reveals plural values. Systems can simultaneously hold that 1) for population decisions, QALY efficiency is paramount 2) organ markets violate dignity 3) rescues express solidarity. The presupposition is really that different valuation logics apply in different spheres. 

  ...Should flag that their "what has to change" question is spot-on. If we demanded perfect consistency, we'd either abandon QALYs (impractical) or commodify everything (unthinkable). Most systems tolerate the tension because the alternatives are worse. 

  Final thought: user seems to want both philosophical rigor and policy realism. I'll position the response as "here's why messy compromise is logically coherent" rather than "here's how to fix the contradiction."
answer: |-
  The practice presupposes **commensurability of health benefits across individuals via a cardinal scale and operational tradability of QALYs against money for population-level decisions, but not for individual bodily autonomy or identified lives.**

  **Reasoning:**  
  1. **Strict presuppositions:**  
     - **Cardinal measurability:** Health states must be quantifiable on a single interval scale (0–1 QALY weights) for aggregation.  
     - **Interpersonal comparability:** A QALY gain for person A is equivalent to a QALY gain for person B, enabling cross-person cost-effectiveness calculations.  
     - **Tradability for populations:** Society accepts monetary trade-offs for *statistical lives* (e.g., £30,000/QALY cutoff), treating QALYs as fungible units.  

  2. **What it does NOT presuppose:**  
     - **Moral realism:** The cutoff functions as a policy *decision* (Quine’s "engineering")—not a discovered "fact." Systems can set thresholds via democratic/technocratic processes without objective moral truth.  
     - **Universal tradability:** Prohibiting kidney sales presupposes bodily integrity and dignity as *non-tradable*, rejecting QALY logic for individual body parts.  
     - **Consistency in valuation:** High-cost rescues of identified lives exploit psychological/political biases ("rule of rescue"), but this doesn’t invalidate QALY for anonymous populations.  

  3. **Theories compatible vs. conflicting:**  
     - **Compatible:** Consequentialism (if maximizing aggregate health), prioritarianism (weighting disadvantaged groups within QALY), and proceduralism (if thresholds are set democratically).  
     - **Conflicting theories requiring change:**  
       - **Strong deontology:** If bodily autonomy is absolute, organ sales might be permitted; if dignity precludes pricing life, QALY itself collapses.  
       - **Radical incommensurability:** If health states are qualitatively unique (e.g., Adler’s perfectionism), QALY aggregation fails.  
       - **Strict egalitarianism:** If equity overrides efficiency, QALY cutoffs might be replaced by minimum-access guarantees.  

  4. **Quinean angle:** The practice treats ethics as means-end engineering. The cutoff is a *decision* (like setting a bridge safety standard), needing only pragmatic justification—not moral facts. Swapping theories changes the *inputs* (e.g., "ends" like equity vs. efficiency) but not the decision-making structure.  

  **Bottom line:** The system’s inconsistency arises from applying *domain-specific valuation rules*: QALY tradability for populations, bodily integrity for individuals, and symbolic solidarity for identified lives—all sustainable under pragmatic pluralism.
