prompt: |-
  Right, so I've just spent two hours rowing with my flatmate about Pluto and I need a proper answer in writing, because I lost the argument on volume and I refuse to lose it on substance. His line is that when the astronomers voted in 2006 to take Pluto off the planet list, they didn't discover anything about Pluto, they just changed what 'planet' means, so the sentence 'Pluto is a planet' went from true to false without anything out there changing. My line is that 'Pluto' is a rigid designator -- it picks out that icy ball whatever we decide to say about it -- so the ball didn't budge and only the general term moved. Up to there we roughly agree. Where it got heated is whether any of this is a problem for the Kripke/Putnam picture.

  Take the necessary a posteriori stuff: water is H2O, gold has atomic number 79, that whole family. The story is meant to be that these are necessities we found out empirically, and the reason they're necessary is that the kind terms are locked onto a real essence in the world rather than onto whatever criteria we happened to be using. Fine. But 'planet' doesn't look like that at all. The new rule is basically stipulative -- orbit the Sun, be roundish under your own gravity, and have cleared the neighbourhood around your orbit -- and that last clause smells like a committee decision dressed up as a discovery. So: is 'planet' a natural kind term or an institutional one, and if it's institutional, does the necessary a posteriori story simply not apply to it (no threat to Kripke, the theory just has a narrower domain) or does it show the natural/institutional line is mushier than people admit (a real threat)?

  What I want: run the Pluto episode through the theory of rigid designation and the necessary a posteriori, in both directions. What does the theory say was actually going on in 2006, and what does the episode show about the theory -- confirmation, anomaly, or a case it never anticipated? Be disciplined about the mapping and tell me where the theory goes quiet rather than forcing it to talk.

  And a few specific things I couldn't settle:

  - Was 'planet' ever a rigid designator, or is that the wrong question to ask of it?
  - Does adding the 'cleared the neighbourhood' clause change the meaning of 'planet' or only narrow its extension? I keep flip-flopping on this.
  - Is my flatmate's 'went from true to false' line actually right, or is he smuggling in a metalinguistic reading, i.e. he's really telling me something about the word 'planet' rather than about planets? I half think the whole row dissolves once you seperate the object-level claim from the metalinguistic one, but tell me if that's a cop-out.
  - Is there a decent analogy with kinds we seem to have got wrong about their members, like when whales got moved out of the fish category, or does that analogy break down, and if so where?

  British English please, and dont hand me the textbook version -- I've read the textbook. Casual is fine, but be precise with the rigid-designator machinery.
reasoning: |-
  Okay, let's tackle this Pluto debate from a Kripke/Putnam perspective. The user's flatmate argues that astronomers merely changed the definition of "planet" in 2006, making "Pluto is a planet" false without any physical change to Pluto itself. The user counters that "Pluto" is a rigid designator pointing to the same celestial body regardless of classification changes.

  The core tension lies in whether "planet" functions like natural kind terms (e.g., "water") that rigidly designate essences discovered a posteriori. The 2006 IAU definition—particularly the "cleared the neighborhood" clause—feels stipulative, not essentialist. 

  First, "Pluto" is clearly rigid: it picks out the same icy body across possible worlds. "Planet" is trickier. It lacks microstructural essence; its criteria are observational and conventional. The neighborhood-clearing rule operates more like a taxonomic decision than a discovery of hidden necessity. 

  When the definition changed, "planet" shifted from a looser folk concept to a precise technical term. This altered extension without changing Pluto's physical properties. The user's flatmate is technically right that the sentence flipped truth-value, but this is metalinguistic—it reflects revised conventions, not planetary ontology. 

  The whale/fish analogy holds partially: both involve scientific reclassification. But whales were moved because we discovered their mammalian essence, while Pluto's demotion stemmed from definitional refinement without new empirical findings about Pluto itself. 

  Kripke's framework isn't threatened here—it never claimed all terms rigidly designate natural kinds. "Planet" behaves like an institutional or functional kind (e.g., "chair"), where necessity derives from human decisions, not mind-independent essences. The theory goes quiet on such cases, marking its domain boundary rather than a flaw.
answer: |-
  Right, let's crack open this celestial can of worms with Kripkean tools and see what leaks. Forget the textbook gloss – we're mapping this row onto the rigid-designator machinery itself. Here's the breakdown:

  **The Core Machinery & Where Pluto Fits:**

  1.  **"Pluto" is Absolutely a Rigid Designator:** No dispute. It picks out *that specific icy-rocky body* in all possible worlds where it exists. Whatever we *call* it – planet, dwarf planet, Kuiper Belt Object, Dave – the rigid bit refers to the same hunk of matter. Its demotion changed *nothing* about what "Pluto" refers to. Your intuition here is spot on.

  2.  **"Planet" – The Problem Child:** This is where things get sticky for the Kripke/Putnam picture. Natural kind terms like "water" or "tiger" are supposed to rigidly designate *a natural kind*, whose essential microstructure (H₂O, DNA) we discovered a posteriori. *That's* the source of the necessary a posteriori truth.
      *   **"Planet" Doesn't Play That Game:** There's no hidden microstructure *essential* to being a planet. The criteria – orbiting the Sun, hydrostatic equilibrium (roundness), clearing the neighbourhood – are fundamentally *observational/macrostructural* and *stipulative*. Crucially:
          *   **No Locked Essence:** We didn't discover Pluto *lacked* some essential "planet-ness" particle. We decided the *criteria* we use to group certain celestial bodies weren't working well scientifically (the discovery of Eris etc. forced the issue). The "cleared neighbourhood" clause isn't an *empirical discovery about the essence of planets*; it's a *taxonomic decision* based on dynamical behaviour and the desire for a useful category. It smells like a committee decision because *it is*.
          *   **Not Rigid Designation of a Kind:** "Planet" doesn't rigidly designate a specific natural kind "out there" in the way "water" designates H₂O. Instead, it designates *whatever satisfies the current operational definition agreed upon by the relevant scientific community*. Its reference is fixed by description (the IAU definition), not by ostension or a rigidly designated essence.

  **Running the 2006 Episode Through the Theory:**

  *   **What Happened (Kripkean Lens):**
      *   Astronomers (acting as the relevant linguistic community for astronomical taxonomy) *changed the operational definition* of the term "planet".
      *   This definitional change *altered the extension* (the set of things the term refers to).
      *   Pluto, the rigidly designated object, remained unchanged.
      *   The sentence "Pluto is a planet" **went from true to false** *because the meaning/semantic value of "planet" changed*. Crucially, this change was driven by *convention and practical scientific needs*, not by the discovery of a previously hidden *essential property* that Pluto lacked or that defined the natural kind "planet".

  *   **What the Episode Shows About the Theory:**
      *   **Confirmation:** The theory perfectly handles "Pluto". Its rigidity explains why *it* didn't change. The episode confirms that not all general terms are natural kind terms rigidly designating microstructural essences.
      *   **Revealed Boundary/Anomaly (for the *Scope* of Necessary A Posteriori):** The episode highlights the *limitation* of the Kripke/Putnam necessary a posteriori paradigm. It shows powerfully that **"planet" belongs to a different semantic category** – likely **an institutional or functional kind term**. Its necessity (if any) is *de dicto* (dependent on the definition) or practical/conventional, not *de re* (about the thing itself). The theory *goes quiet* here. It doesn't have a detailed story for how institutional definitions evolve and change reference, beyond noting they aren't rigid natural kind terms. This isn't a *threat* to the core theory (water=H₂O *is* necessary a posteriori), it just shows its domain is specific.
      *   **Mushiness?** It shows the *line* can be mushy in practice (when does a functional kind become a natural kind? Is "star" different?), but the Pluto case itself is a clear instance of an *institutional* term, not a failure of the natural kind concept. The core distinction holds water (H₂O!), even if the border zone is fuzzy.

  **Your Specific Queries:**

  1.  **Was 'planet' ever a rigid designator? (Is that the right question?)**
      *   It's the *wrong question* when asked in the *same sense* as "water" or "Pluto". "Planet" never rigidly designated a specific natural kind essence in the Kripkean sense. Pre-2006, "planet" was a *vague descriptive term* meaning something like "large non-stellar, non-moon body orbiting the Sun". Its reference was fixed descriptively, not rigidly. Asking if it was rigid misses the point – it was always a different *type* of term. The rigidity machinery simply isn't designed for terms like this.

  2.  **Does adding 'cleared the neighbourhood' change the meaning or just the extension?**
      *   **It changes the meaning (intension), which *thereby* changes the extension.** The meaning/sense of "planet" *is* (roughly) the set of criteria used to pick out its referents. Adding a new necessary condition (clearing the neighbourhood) fundamentally alters that set of criteria. It's not like discovering all gold has atomic number 79, which *refined our understanding* of the *same* essence we were already tracking. This was *adding a new defining characteristic* that wasn't previously considered essential. It's a change in the concept, leading to a change in what falls under it. You flip-flop because it's subtle: the *core idea* (round thing orbiting Sun) is still there, but adding a *new essential requirement* constitutes a meaning shift.

  3.  **Is your flatmate's "went from true to false" line right? Is it metalinguistic?**
      *   **He's technically correct, *but* it crucially depends on reading "planet" *de dicto* (according to the definition at the time of utterance).** The sentence "Pluto is a planet" uttered in 2005 was true (under the then-current understanding). Uttered in 2007, it was false (under the new definition). Nothing about Pluto changed, but the *semantic content carried by "planet"* did.
      *   **Is it metalinguistic?** *Not inherently.* Your flatmate is making an *object-level* claim *using* the term "planet". He's saying: "The object Pluto does not satisfy the definition of 'planet' that we now use." That's about the world (Pluto) and the concept (planet). However, the *reason* it changed *is* metalinguistic/conventional. The *explanation* for the truth-value flip *is* about the word/concept changing. **This is key:** The *sentence's* truth-value changed due to a semantic shift, but the *fact* it reports on (Pluto's orbital dynamics & context) was always there. Separating levels *dissolves the sense of paradox* (how can the same fact change?), but it doesn't make your flatmate *wrong* about the truth-value shift of the specific English sentence. It just explains *why* it shifted.

  4.  **The Whale/Fish Analogy:**
      *   **It's a decent analogy, but breaks down instructively.**
      *   **Similarity:** Both involve scientific reclassification based on better understanding leading to a term ("fish", "planet") changing extension. "Whales are fish" went from true (folk bio) to false (scientific bio).
      *   **Crucial Difference:** The whale/fish shift *was* driven by discovering a *hidden essence* (mammalian reproductive biology, lung structure, etc.) that showed whales were *fundamentally different* from the *natural kind* "fish" (understood phylogenetically as pisces). This *fits* the Kripke/Putnam model: we discovered the essential properties of the kinds involved. Pluto's demotion *wasn't* driven by discovering it lacked the *essential hidden property* of "planet-hood". It was driven by refining *observational criteria* for practical taxonomy within a *single* domain (Solar System bodies), adding a new *stipulated* requirement (dynamical dominance) that wasn't previously considered definitional. The change was more conventional/operational than essentialist.

  **The Verdict:**

  *   **Your flatmate wins on the specific point:** The sentence "Pluto is a planet" did go from true (pre-2006 definition) to false (post-2006 definition) without Pluto changing. This happened because the meaning/definition of "planet" changed.
  *   **You win on the substance regarding Kripke/Putnam:** This episode poses **no fundamental threat** to the rigid designation/natural kind/necessary a posteriori theory for terms like "water" or "gold". Instead, it **sharply defines its boundary**. "Planet" is revealed as an **institutional/functional kind term**, not a natural kind term. Its reference is fixed and changed by descriptive criteria decided by the relevant community (IAU), not by rigid designation of an essence. The theory *anticipates* such terms exist ("chair", "bachelor") and goes quiet on them. The "mushiness" is in applying the *label* "natural kind", not in the core semantic distinction Kripke/Putnam make. Pluto is the icy ball (rigid designator). "Planet" is a club with membership rules we rewrote. Kripke's machinery explains the first part perfectly and politely declines to comment on the administrative details of the second. Time for a cuppa and a truce.
