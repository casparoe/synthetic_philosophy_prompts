  - Conspiracy theories: Unfalsifiable because they absorb counterevidence; here it's about *computational cost*. 
  - Invisible gardener: Agent becomes vacuous; this agent remains concrete (wants specific outcomes). 

  The core tension: Brevity vs. ontological cost. Defining a "non-ad-hoc" solution might require tying simplicity to *causal structure*—e.g., demanding mechanisms—but that risks biasing against fundamental forces or agents if they *do* exist. 

  User likely needs this for academic work (mentions "model comparison in my work"). They'd value precise boundaries. Example: "Coin shows HHHHH" — agent is shorter than specifying independent flips. But "coin shows THTTH" — agent loses because random flips now compress better. 

  Final thought: The asymmetry emerges when data has high Kolmogorov complexity *unless* intention is assumed. That's the sharpest definition I can give.
answer: |-
  Your query describes a profound epistemological asymmetry with precision. While no single established term captures this exact pattern comprehensively, I'll define the phenomenon, differentiate it from related concepts, and address your core questions systematically.

  ### Core Definition: **Teleological Compression Asymmetry**
  A structural bias in explanation-ranking systems (e.g., Kolmogorov complexity, Bayesian priors) where hypotheses postulating an *agent optimizing for observed outcomes* achieve extreme brevity and predictive leverage because:
  1. **Brevity**: The agent's "aim" (e.g., "make data look like X") compresses arbitrary observations into a short directive.
  2. **Extrapolation**: The agent's persistent intent automatically predicts future/unobserved consistency at zero descriptive cost.
  3. **Universality**: Any dataset can be "explained" this way, making it a *universal compressor* for observations.
  4. **Asymmetry Cost**: Mindless alternatives must pay independent descriptive costs for each new domain/prediction.

  ### Key Differentiations
  | **Concept**               | **Difference from Teleological Compression Asymmetry**                                                                 |
  |---------------------------|------------------------------------------------------------------------------------------------------------------------|
  | **Problem of Induction**  | Concerns justifying generalization from samples. TCA exploits this by making generalization "free" for agent hypotheses. |
  | **Unfalsifiable Conspiracies** | Focuses on evasion of disproof. TCA is about *computational efficiency*: agent theories win *before* considering falsifiability. |
  | **Invisible Gardener**    | Illustrates ad-hoc retreat to non-empirical claims. TCA persists even with concrete agents (e.g., "a human tampered with these coins"). |

  ### Critical Implications
  1. **Does this imply unexamined regions are "managed"?**  
     Yes, under a strict Kolmogorov complexity ranking: The shortest program predicting *all* future observations is "An agent ensures consistency with past data." This biases systems toward expecting agency everywhere—until penalized empirically.  
     *Example*: After seeing 1,000 heads, "a biased coin (p=1)" and "an agent forcing heads" have similar complexity. But extending to *any new context* (e.g., dice, weather), the agent hypothesis remains constant in length while physical models balloon.

  2. **Can the premium be removed without ad-hoc taxes?**  
     Yes, through **causal mechanism requirements**:  
     - **Solution**: Demand that hypotheses specify *causal pathways* (not just outcomes).  
     - **Effect**: "An agent wanted heads" now requires modeling *how* the agent alters physics/logic, erasing its brevity advantage.  
     - **Non-Ad-Hoc Basis**: This reflects real-world science: Explanations require causal models (e.g., physics isn't satisfied with "the ball fell because it wanted to").  
     - **Boundary Case**:  
       - *Agent wins*: "This locked safe contains Shakespeare's lost play. Hypothesis: A librarian intentionally placed it there." (Brevity advantage if no forced-entry signs exist.)  
       - *Agent loses*: "This random noise signal in a cosmic microwave background is ordered. Hypothesis: An agent encoded a message." (Causal model for galaxy-scale tampering exceeds noise's complexity.)

  ### Established Treatments
  - **Bayesian**: Penalize high-likelihood-ratio hypotheses with *extremely low priors* for unexplained agents (reflecting their rarity in known processes).  
  - **Algorithmic Information Theory**: Treat "agent" as a *complex macrostate*—its specification requires hidden costs (e.g., embedding intelligence in physical systems).  
  - **Philosophy**: **Swinburne's Simplicity** (Oxford) notes intentional explanations *can* be simplest but require independent evidence for agency's plausibility.

  ### Why No Universal Label?
  This asymmetry sits at the intersection of:
  - Solomonoff induction (Kolmogorov complexity)
  - Design arguments (teleology)
  - Conspiracy epistemology  
  ...but is uniquely characterized by its *compression efficiency*. Related terms ("ad hoc rescue," "agency detection bias") miss the core computational insight.

  **In essence**: Teleological Compression Asymmetry reveals a vulnerability in purely descriptive simplicity metrics. Resolving it requires tying explanation to *causal structure*—not just output compression—which naturally burdens agent hypotheses with the complexity of their proposed mechanisms. This restores balance without arbitrary taxes.
