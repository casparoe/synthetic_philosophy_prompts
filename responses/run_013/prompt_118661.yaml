prompt: |-
  I sit on a hospital ethics committee that is drafting guidance on when a patient's advance directive should be overridden by the patient's present, expressed wishes. Our disagreement has collapsed onto a single analogy, and I would like you to audit it.

  The analogy is this: the person who wrote the directive and the person now in the bed are two different people. One faction on the committee uses it to argue that the document has no more authority over the present patient than a note handed in by a stranger, so present contentment should prevail. The other faction uses the same premise to argue the opposite: because the author of the directive is, in effect, gone, the document is the only surviving expression of her will — a testament rather than a command — and the present patient, being incompetent, is in no position to revoke it. Both factions take themselves to be drawing out the consequences of the same comparison, and both are impatient with the other for failing to see where it leads.

  What I want from you:

  1. A correspondence table. In the interpersonal case the analogy is modelled on — one person issuing binding instructions to another — what plays the role of the issuer, the recipient, the instrument, the signature, the revocation, the enforcement, and the party whose interests are at stake? Then say which of these have a counterpart in the advance-directive case and which do not.

  2. The disanalogies, ranked. Separate the ones that matter for the use to which the analogy is being put from the ones that are merely picturesque. In particular: the causal and psychological continuity between the two parties; the fact that the later party never consented and also never refused; the asymmetry by which the earlier self can act on the later but not the reverse; and the fact that the later self inherits rather than merely receives the earlier self's body, history, and relationships.

  3. Whether the premise is meant literally or figuratively, and whether either faction's conclusion survives on either reading. If the claim that they are two people is a claim about personal identity, what follows for the authority of a document one of them signed? If it is a figure for the fragmentation of a single person's interests, what is left of the analogy at all? And say which role each faction needs the document to play — a command issued by an authority who has since vacated the office, or testimony about the shape of a life — and whether the comparison can supply that role.

  4. A test. Take three cases — a patient who now says she is glad to be alive and appears to be flourishing; a patient whose directive was written during a depressive episode; a patient who asked that everything be done and now appears to be suffering with no prospect of recovery — and say which of them the analogy illuminates and which it distorts.

  5. A verdict and a replacement. Can the two-people comparison support either conclusion, or is it doing no work while a substantive thesis about whose authority is basic does all of it? If the analogy should be replaced, propose a better one — a will, an executor, a promise made to someone now dead, a precommitment device such as a lock on a cabinet, a guardian acting for a ward — and say precisely what it gets right that the original does not.

  Write this as a memo. No citations, no case law, and no assumptions about any particular jurisdiction's rules; I want the conceptual audit, not a survey of the literature.
reasoning: |-
  Okay, the user is on a hospital ethics committee drafting guidance about when to override advance directives with current expressed wishes. They're stuck on an analogy where the past directive-writer and present patient are "two different people." One side says the directive is like a note from a stranger, so current contentment should prevail. The other says it's a testament from someone gone, so it should stand. The user wants a conceptual audit.

  Hmm, this is a deep philosophical and ethical dilemma. The user needs help unpacking this analogy because both factions are using the same premise to draw opposite conclusions. That's fascinating but problematic. 

  First, I need to map the interpersonal analogy to the advance directive scenario. In a standard binding instruction case (like Person A telling Person B what to do), we have clear roles: issuer, recipient, instrument, etc. But in the advance directive case, many of these roles collapse or blur because it's the same person across time. The "two people" analogy forces a separation that doesn't quite hold.

  The key disanalogies seem to be: psychological continuity (even with dementia, there's some thread of identity), lack of consent from the future self (who never agreed to be bound), the irreversibility of time (past self can bind future self but not vice versa), and inheritance (present patient inherits the body/relationships - they're not a stranger). These aren't just poetic differences; they directly undermine both factions' arguments.

  Is the "two people" claim literal or metaphorical? Literally, if they're truly different people, the document has no authority over the present patient - but that's absurd because we treat them as the same person legally. Metaphorically, if it's about fragmented interests, then the analogy fails because it's designed for separate agents. Neither faction's conclusion survives scrutiny on either reading. The "command" vs "testament" roles they assign are incompatible with the analogy's structure.

  Testing with three cases: 
  - The flourishing patient: analogy distorts by ignoring continuity (her past self wanted this life)
  - Depressive episode directive: analogy usefully highlights possible impairment in past self
  - Suffering patient who wanted everything done: analogy dangerously ignores current suffering by over-prioritizing past wishes

  Verdict: This analogy isn't doing real work - it's a rhetorical cover for deeper disagreements about authority (past vs present self). Better analogies would be: 
  1) Locked cabinet (precommitment device) - captures voluntary self-binding but admits override mechanisms
  2) Executor role - emphasizes fiduciary duty to interpret wishes in current context
  3) Promise to the dead - shows obligation but also its limits when circumstances change

  The core issue is balancing respect for autonomy across time versus preventing suffering in the present. The committee needs to acknowledge this tension directly rather than hiding behind a broken analogy.
answer: |-
  **MEMORANDUM**  
  **TO:** Ethics Committee Chair  
  **FROM:** Conceptual Audit Analyst  
  **SUBJECT:** Audit of "Two People" Analogy in Advance Directive Guidance  

  ---

  ### 1. Correspondence Table: Interpersonal Instruction vs. Advance Directive  

  | **Interpersonal Case Element** | **Role in Analogy** | **Counterpart in Advance Directive?** | **Notes** |
  |--------------------------------|---------------------|--------------------------------------|-----------|
  | **Issuer**                     | Authority figure (e.g., employer) | Past patient | **Partial**: Same biological entity, but disputed as "different person." |
  | **Recipient**                  | Subordinate (e.g., employee) | Present patient | **Partial**: Disputed as "different person" from issuer. |
  | **Instrument**                 | Binding contract/command | Advance directive | **Yes**: The document itself. |
  | **Signature**                  | Authentication of issuer’s will | Patient’s signature at time of drafting | **Yes**: Validates past intent. |
  | **Revocation**                 | Formal nullification by issuer | Present patient’s expressed wishes | **No**: Present patient’s capacity to revoke is contested. |
  | **Enforcement**                | External authority (e.g., court) | Healthcare proxy/committee | **Partial**: Enforcer interprets intent but lacks issuer’s ongoing agency. |
  | **Interested Party**           | Person(s) affected by the order | Present patient | **Yes**: But interests may conflict with past self’s directives. |

  **Key Gaps**:  
  - No true "recipient" in advance directives (the future self cannot consent).  
  - Revocation is asymmetric (past self can bind future self, but future self cannot negotiate).  
  - The "interested party" is split across time, creating conflicting interests.  

  ---

  ### 2. Disanalogies Ranked by Relevance  

  #### **Critical Disanalogies** (Undermine both factions’ arguments):  
  1. **Causal/Psychological Continuity**  
     - Past and present selves share a single life narrative, body, and relationships. Unlike strangers, the present patient *inherits* the consequences of past choices.  
     - **Why it matters**: Rejects the core premise that they are "two people." Negates both "stranger’s note" and "surviving testament" claims.  

  2. **Asymmetry of Agency**  
     - The past self can bind the future self, but the reverse is impossible. A stranger cannot impose irreversible constraints.  
     - **Why it matters**: The directive is a *self-binding* act, not an interpersonal command.  

  #### **Secondary Disanalogies** (Contextual):  
  3. **Non-Consent Without Refusal**  
     - The future self neither agreed to nor rejected the directive (unlike an employee receiving orders).  
     - **Why it matters**: Weakens "command" analogy but doesn’t resolve authority.  

  4. **Inheritance vs. Receipt**  
     - The present patient inherits the past self’s body, identity, and social ties. A stranger’s note imposes no such inheritance.  
     - **Why it matters**: Highlights shared stakes, undermining "stranger" comparison.  

  ---

  ### 3. Literal vs. Figurative Premise & Factional Roles  

  - **Literal Claim (Personal Identity)**:  
    If past and present patients are metaphysically "two people," the directive has **no authority**. Legal personhood is tied to the present biological entity. The document is akin to a stranger’s note, void without present consent.  
    - *Faction 1 ("Stranger’s Note")*: Survives—current patient’s wishes prevail.  
    - *Faction 2 ("Surviving Testament")*: Collapses—no obligation to honor a stranger’s wishes.  

  - **Figurative Claim (Fragmented Interests)**:  
    If "two people" symbolizes conflicting interests within one life, the analogy **fails entirely**. Interests require weighing, not separating into distinct agents.  
    - Both factions’ conclusions collapse: The analogy cannot assign roles (issuer/recipient) if interests are intra-personal.  

  #### **Factional Document Roles**:  
  - **Faction 1**: Needs the directive as a *revocable command*.  
    - Analogy incompatibility: Commands require ongoing authority; the "issuer" (past self) cannot enforce or adjust.  
  - **Faction 2**: Needs the directive as *testimony* (like a will).  
    - Analogy incompatibility: Wills bind survivors; here, the "testator" (past self) and "beneficiary" (present self) are the same person.  

  ---

  ### 4. Test Cases: Where the Analogy Holds or Fails  

  | **Case** | **Analogy Illuminates?** | **Rationale** |
  |----------|--------------------------|--------------|
  | **Patient now flourishing, glad to be alive** | Distorts | Ignores continuity: Past self’s directive enabled current contentment. "Stranger" frame dismisses shared life project. |
  | **Directive written during depressive episode** | Illuminates | Highlights past self’s impaired agency. Like a "stranger’s" biased note, it warrants skepticism. |
  | **Patient suffering with no recovery, despite directive for maximal intervention** | Distorts | "Testament" frame overrides present suffering. The analogy cannot weigh past wishes against current experience. |

  ---

  ### 5. Verdict & Replacement  

  #### **Verdict**:  
  The "two people" analogy **does no constructive work**. It is a rhetorical device masking substantive disagreements:  
  - **Faction 1** prioritizes *present experiential interests*.  
  - **Faction 2** prioritizes *past autonomous intent*.  
  The analogy arbitrarily assigns roles (issuer/recipient) to support these priorities but collapses under scrutiny.  

  #### **Replacement Analogies**:  
  **Proposed: The Executor of an Estate**  
  - **What it captures**:  
    - The advance directive as a "will" for one’s future self.  
    - The committee/healthcare proxy as "executor," ethically bound to:  
      a) Faithfully interpret past wishes,  
      b) Adapt to unforeseen circumstances (e.g., suffering without recovery),  
      c) Weigh past intent against current well-being.  
  - **Why it improves**:  
    - Acknowledges continuity (the "estate" is one life).  
    - Permits override when directives conflict with fundamental interests (e.g., prolonged agony).  
    - Rejects false binaries: The executor’s duty is integrative, not agent-versus-agent.  

  **Secondary Option: Locked Cabinet with Override Key**  
  - The directive is a precommitment device (e.g., locking away addictive substances).  
  - **Improvement**: Allows override for self-preservation but retains respect for past agency.  

  ---

  **RECOMMENDATION**: Abandon the "two people" framework. Adopt guidance centered on:  
  1. **Intent Interpretation**: Was the directive informed, voluntary, and contextually applicable?  
  2. **Interest Reconciliation**: How do past values align with present well-being?  
  3. **Proxy/Committee Duty**: Uphold autonomy *across time* while preventing irreversible harm.  

  ---  
  **END MEMO**
