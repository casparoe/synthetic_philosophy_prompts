  I should point out what the analogy smuggles in - mainly an assumption of benign purpose and historical wisdom. Then I'll evaluate whether the presumption survives - only weakly and situationally in my view. For a better analogy, I'll suggest coral reefs as complex, evolved systems where change requires caution but without assuming original wisdom or purpose.

