answer: |-
  ### Conceivability-to-Possibility Checklist  
  *For evaluating "possible futures" in planning scenarios.  
  Use this before signing off. Fits one A4 page.*

  ---

  #### **Step 1: Thin Conceivability Check**  
  *("Can I vaguely imagine this?")*  
  - **Ask:** Can I sketch this scenario without spotting an immediate contradiction?  
  - **If NO:** Scenario is **impossible** (e.g., "a square circle"). Stop here.  
  - **If YES:** Proceed to Step 2.  
  - *Why?* Thin conceivability is weak—it means little on its own.  

  ---

  #### **Step 2: Defeater Check**  
  *("What could break this?")*  
  - **A. Hidden Contradictions:**  
    - Break the scenario into core parts. Does any part clash? (e.g., "free healthcare with zero taxes" implies hidden funding contradiction).  
    - **If YES:** Scenario is **impossible**. Stop.  
  - **B. Empirical Impossibilities:**  
    - Does it violate known science or facts? (e.g., "teleporting people via email" breaks physics).  
    - **If YES:** Scenario is **physically impossible**. Stop.  
  - **C. Limits of Imagination:**  
    - If stuck, ask: "Is my inability to picture this due to *my* limits?" (e.g., "quantum computing" was once hard to imagine).  
    - **If UNSURE:** Flag for expert review.  

  ---

  #### **Step 3: Thick Conceivability Check**  
  *("Can I imagine this *without ignoring real-world knowledge*?")*  
  - **Ask:** Can I build a step-by-step path from today’s world to this scenario, using plausible causes (tech, social change, etc.)?  
  - **If YES:** Scenario is **plausibly possible**. Proceed to Step 4.  
  - **If NO:** Scenario is **likely impossible** or **highly speculative**. Reject or flag.  
  - *Key:* Thick conceivability requires holding fixed facts (e.g., gravity, human psychology, economics).  

  ---

  #### **Step 4: Final Judgment**  
  - **Passed Steps 1–3?** Scenario is a **valid "possible future"** for planning.  
  - **Failed Steps 1/2?** Scenario is **impossible**. Reject.  
  - **Failed Step 3?** Scenario is **unreliable** for planning. Reject.  
  - **Uncertain?** Flag: **"Human judgment needed"**.  

  ---

  ### **Examples in Action**  
  *(Apply the checklist yourself!)*  

  1. **Scenario:** *A city where everyone works 4 hours/week, productivity doubles.*  
     - **Step 1 (Thin):** ✅ Easy to imagine (Utopian dream).  
     - **Step 2 (Defeaters):**  
       - Hidden contradiction? ❌ (Productivity requires inputs; 4h/week may not double output).  
       - Empirical? ✅ (Possible via AI/automation, but strains economics).  
     - **Step 3 (Thick):** ⚠️ Hard to reconcile with human productivity limits. *Verdict:* **Unreliable—reject unless backed by data.**  

  2. **Scenario:** *People upload minds to computers.*  
     - **Step 1 (Thin):** ✅ (Sci-fi trope).  
     - **Step 2 (Defeaters):**  
       - Hidden contradiction? ✅ (If "upload" implies copying consciousness, not transferring it).  
       - Empirical? ⚠️ (Neuroscience doesn’t forbid it, but unknown).  
     - **Step 3 (Thick):** ⚠️ No known tech path. *Verdict:* **Speculative—flag for expert review.**  

  3. **Scenario:** *No one has beliefs/desires, but behavior is unchanged.*  
     - **Step 1 (Thin):** ✅ (Robots mimic humans).  
     - **Step 2 (Defeaters):**  
       - Hidden contradiction? ✅ (Beliefs/desires *cause* behavior; remove cause, effect can’t stay identical).  
       - Empirical? ✅ (Psychology: behavior requires motivation).  
     - **Step 3 (Thick):** ❌ Inconceivable with real-world knowledge.  
     - *Verdict:* **Reject (even if you like it!)**.  

  ---

  ### **Key Reminders**  
  - **Thin vs. Thick:** Thin = daydreaming. Thick = reality-grounded.  
  - **"I can’t conceive of alternatives"** is usually **your limit**, not the world’s.  
  - **When stuck:** Admit uncertainty. Use this to trigger expert input.  
  - **Philosophy in a nutshell:** Imagination ≠ possibility. Ground scenarios in cause-and-effect.  

  *Designed for councils by a philosophy prof. Print and use!*
