  For structure: First, I'll define desiderata categories - empirical adequacy cases (Sleeping Beauty, Doomsday etc.), metaphysical scope cases (duplication, reference class issues), and formal constraints. Each entry needs a motivating case and negotiation status. Then I'll identify irreconcilable conflicts, like how avoiding Presumptuous Philosopher might necessitate Doomsday-like conclusions. The scorecard will contrast how each major approach fares against key criteria.

  The Sleeping Beauty case is essential - it tests whether credences match betting behavior after memory loss. Doomsday examines if observer-position reasoning is mandatory. Presumptuous Philosopher probes if observer counts alone can settle physics. For formal constraints, Dutch book immunity with memory loss is critical.

  Key conflicts will likely arise between: Non-Arbitrariness (rejecting Presumptuous Philosopher) vs. Doomsday Intuition, and perhaps between Reflection (expecting future credences to match) and Dutch book immunity in amnesia cases. I'll add a novel "Branching Laboratory" case to test cloning scenarios.

  In the scorecard: SSA handles Sleeping Beauty but accepts Doomsday; SIA avoids Doomsday but enables Presumptuous Philosopher; deflationism avoids both pitfalls but struggles with action-guiding credences in amnesia cases. The core tension is that observer-count sensitivity seems both necessary (to block absurd armchair cosmology) and problematic (inviting Doomsday reasoning).
answer: |-
  Here are the desiderata for any adequate account of self-locating credence in indexical uncertainty scenarios, structured as requested:

  ### I. Empirical Adequacy (Must handle standard puzzles)
  1.  **Sleeping Beauty Resolution (Non-negotiable):**
      *   **Case:** A fair coin is flipped. If Heads (H), Sleeping Beauty is awakened once on Monday. If Tails (T), she is awakened on Monday and again on Tuesday, with amnesia between awakenings. Upon each awakening, what should her credence be that the coin landed Heads?
      *   **Requirement:** The rule must assign definite, justifiable credences (e.g., 1/2 or 1/3 for H) and explain why. Crucially, it must integrate with a defensible decision rule. (Conflict: Assigning P(H)=1/2 suggests Beauty should accept even-money bets on H, but if T is true she loses twice; assigning P(H)=1/3 suggests she should accept 2:1 odds, potentially leading to a sure loss *if* the bet is only resolved once per coin flip).
      *   **Motivation:** Tests how the rule handles temporary loss of temporal indexical information ("which awakening is this?") within a single agent.

  2.  **Doomsday Argument Constraint (Camp-Specific: Non-Arbitrariness):**
      *   **Case:** Observing our birth rank 'n' (say, ~60 billionth human). If humans go extinct soon (Doom Soon), 'n' is typical. If humanity lasts much longer (Doom Late), 'n' is very early. Should we think we are randomly sampled, making Doom Soon more likely?
      *   **Requirement:** The rule must either explain why a "typicality" assumption (like being a random sample) is compelling and leads to the Doomsday conclusion *or* provide a principled reason why such an assumption is invalid or inapplicable in this context. It cannot simply ignore the intuition driving the argument without justification.
      *   **Motivation:** Tests the rule's handling of uncertainty about one's temporal position relative to the lifespan of one's reference class.

  3.  **Immunity to Presumptuous Philosopher (Non-negotiable):**
      *   **Case:** Two physical theories T1 and T2 are empirically indistinguishable so far. T1 predicts 1 billion observers exist; T2 predicts 1 trillion observers exist. The Presumptuous Philosopher argues P(T2) >> P(T1) solely because we exist, and we are more likely to exist if there are more observers.
      *   **Requirement:** The rule must *not* allow the mere number of observers posited by a theory, in the absence of any empirical evidence distinguishing the theories, to overwhelmingly determine the probability of that theory being true from an "armchair" perspective. An adequate rule must require empirical input to settle empirical questions.
      *   **Motivation:** Tests whether the rule allows observer-counts alone to settle non-indexical empirical matters, violating scientific methodology.

  ### II. Scope & Robustness (Must handle variations in observer ontology)
  4.  **Duplication/Branching Coherence (Non-negotiable):**
      *   **Case:** An agent is duplicated perfectly (synchronously) or undergoes fission (e.g., teleporter malfunction). What credence should each resulting agent have that they are the "original"?
      *   **Requirement:** The rule must assign definite, coherent credences upon duplication/branching. It must specify how prior credences update upon learning that duplication/branching *has occurred* (though the agent may not know which copy they are).
      *   **Motivation:** Tests the rule's handling of synchronic multiplication of identical observer-moments.

  5.  **Reference Class Agnosticism (Non-negotiable):**
      *   **Case:** Scenarios involving potentially non-human observers (aliens, advanced AI, sentient animals) or uncertainty about whether to count distinct observers vs. distinct observer-moments (e.g., in Sleeping Beauty, count Beauty-on-Monday and Beauty-on-Tuesday as one observer or two moments?).
      *   **Requirement:** The rule must function even when the appropriate reference class (observers vs. observer-moments, humans vs. sentients) is ambiguous or under debate. It must provide a principled way to apply the rule *given* a chosen reference class, without presupposing one uniquely correct class. The justification for the rule cannot depend critically on an uncontroversial reference class being available.
      *   **Motivation:** Tests the rule's dependence on a fixed, unproblematic definition of "observer" or "moment".

  6.  **Finite Consistency (Non-negotiable):**
      *   **Case:** Hypotheses where the total number of observers is infinite (e.g., an eternal universe), making ratios like "probability of being observer X" undefined under simple random sampling.
      *   **Requirement:** The rule must yield well-defined, non-arbitrary credences in scenarios involving infinite populations. It cannot rely solely on finite ratios that become undefined or paradoxical in infinite settings.
      *   **Motivation:** Tests the rule's mathematical robustness beyond finite combinatorics.

  7.  **Cosmological Applicability (Non-negotiable):**
      *   **Case:** Fine-tuning (why do constants allow observers?), the scale of the observable universe (why are we not Boltzmann Brains?), multiverse scenarios (does observing this universe tell us about others?).
      *   **Requirement:** The rule must be applicable to realistic cosmological scenarios involving indexical uncertainty, observer distributions across vast spacetimes or multiverses, and hypotheses where observers are exceedingly rare fluctuations (Boltzmann Brains). It cannot avoid or give nonsensical outputs in these core motivating cases.
      *   **Motivation:** Tests whether the rule fulfills its intended purpose in the most complex, physically relevant domains.

  ### III. Formal Constraints
  8.  **Probability Calculus Compliance (Non-negotiable):** The rule must yield credences that obey the axioms of probability theory (non-negativity, normalization, additivity).
  9.  **Conditionalization Compatibility (Non-negotiable):** When no indexical uncertainty is introduced or resolved, updating must reduce to standard Bayesian conditionalization on non-indexical evidence.
  10. **Reflection / Diachronic Coherence (Non-negotiable):** An agent's current credences must cohere with their rational expectations about their future credences. If an agent *knows* they will rationally update to credence C upon receiving evidence E, their current credence conditional on E should be C.
  11. **Dutch Book Immunity (Non-negotiable):** The rule must not make agents vulnerable to sure losses ("Dutch Books") in appropriately structured betting scenarios, *even when bets are offered across episodes of memory loss or indexical uncertainty*. (Sleeping Beauty is a key test case for this).
  12. **Usability (Action Guidance) (Non-negotiable):** The rule must provide credences *during* the episode of indexical uncertainty that directly inform rational action and decision-making (e.g., via expected utility maximization). It cannot only provide "correct" probabilities in hindsight or for an external perspective. (Sleeping Beauty's betting behavior is the pressure point).

  ### IV. Inherent Conflicts
  *   **The Core Tension:** **Non-Arbitrariness (Immunity to Presumptuous Philosopher - 3)** and **Diachronic Coherence / Dutch Book Immunity (10, 11)** are in deep conflict with **Doomsday Intuition (2)** and potentially **Sleeping Beauty Resolution (1)**.
      *   **Why:** Avoiding the Presumptuous Philosopher (3) requires making credences *insensitive* to mere differences in the *total number* of observers across hypotheses when those hypotheses are otherwise empirically equivalent. This directly blocks the reasoning that saves us from concluding we are doomed soon (2). Rules satisfying (3) often struggle to justify the 1/3 answer in Sleeping Beauty (1) without violating Diachronic Coherence (10) or Dutch Book Immunity (11) under memory loss. Conversely, rules satisfying Doomsday Intuition (2) or robustly delivering 1/3 in Sleeping Beauty (1) often fall prey to the Presumptuous Philosopher (3) or require seemingly arbitrary reference class choices (5).
  *   **Most Eliminative Requirement: Immuni
