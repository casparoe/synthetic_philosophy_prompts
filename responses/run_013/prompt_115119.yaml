  ### Constructivist Logic Game: Rulebook and Materials

  #### **Materials List (per group of 3)**
  - **Claim Cards**: 10 blank index cards (for writing compound formulas during play).
  - **Atomic Prop Cards**: 6 cards labeled with atomic propositions (e.g., "P", "Q", "R"). Include 2–3 undecidable propositions (e.g., "The 10^100^th digit of π is 7", "There are infinitely many twin primes").
  - **Connective Tokens**: 12 tokens (coins, beads, etc.): 3 for ∧ (AND), 3 for ∨ (OR), 3 for → (IF-THEN), 3 for ⊥ (absurdity).
  - **Witness Tokens**: 6 unique objects (e.g., colored chips) for decidable atomic claims (e.g., "2+2=4"). **No witness tokens for undecidable claims**.
  - **Concession Board**: Small whiteboard or paper divided into "Proponent" and "Opponent" sections to record concessions (assertions made during attacks).
  - **Timer**: For enforcing 2-minute move limits (prevent stalling).
  - **Score Sheet**: For the Scorekeeper to log moves and outcomes.

  #### **Rulebook (Abridged for Players)**
  **Goal**: Proponent defends a logical claim; Opponent attacks it. Proponent wins by forcing Opponent into ⊥ or exhausting attacks; Opponent wins if Proponent cannot defend a subclaim. Scorekeeper logs assertions, concessions, and outcomes.

  1. **Setup**:  
     - Proponent draws a claim card (pre-written by instructor) and asserts it.  
     - Opponent starts attacking. Moves alternate. Scorekeeper logs all moves.

  2. **Attacking & Defending**:  
     - **Atomic Claim (e.g., P)**: Defender must place a witness token on it *if possible*. If no token exists, defender loses.  
     - **A ∧ B**: Attacker chooses to attack A or B. Defender must defend the chosen conjunct.  
     - **A ∨ B**: Attacker demands defender choose A or B. Defender picks one and defends it.  
     - **A → B**:  
       - Attacker concedes A (writes it on concession board under their name) and attacks B.  
       - Defender now defends B.  
     - **⊥ (Absurdity)**: Defender loses immediately.  
     - **Negation (¬A)**: Treated as A → ⊥. Follow → rules.  

  3. **Special Rules**:  
     - **Concessions**: A conceded claim (e.g., from attacking →) is treated as asserted by the conceder. It can be challenged like any other claim.  
     - **Winning via ⊥**: If a player is forced to defend ⊥, they lose.  
     - **Negation Win**: If Player X asserts A and Player Y asserts ¬A (i.e., A → ⊥), Y can force X to defend ⊥ (X loses).  
     - **Move Limit**: 2 minutes per move. If timeout, current defender loses.  
     - **Draws**: If no progress in 5 moves, game ends unresolved (Scorekeeper logs "unestablished").  

  4. **Winning the Game**:  
     - Proponent wins if Opponent loses (e.g., forced to defend ⊥) or attacks cease.  
     - Opponent wins if Proponent cannot defend a subclaim (e.g., no witness for atomic).  
     - Scorekeeper declares winner or "unestablished."

  **Intuitionistic Validity Check**:  
  - Winning strategies exist for intuitionistically valid formulas (e.g., ¬¬(P∨¬P), ¬(P∧¬P)) but not classical-only ones (e.g., P∨¬P, ¬¬P→P).  
  - Tested formulas:  
    - **P∨¬P**: Proponent loses (must choose P or ¬P; neither defendable if P undecidable).  
    - **¬¬P→P**: Proponent loses (must defend P after concessions; no witness).  
    - **¬(P∧¬P)**: Proponent wins (force Opponent into ⊥ via conceded P and ¬P).  
    - **¬¬(P∨¬P)**: Proponent wins (challenge conceded ¬(P∨¬P) to force ⊥).  
    - **(P→Q)→(¬Q→¬P)**: Proponent wins (use conceded P→Q and ¬Q to force ¬P, then use negation win).

  ---

  ### **90-Minute Session Plan**

  #### **Start (0–5 min)**
  - **Grouping**: Divide into 6 groups (12 students). Each group has Proponent, Opponent, Scorekeeper. Rotate roles after each round.  
  - **Intro Wording (Instructor)**:  
    1. "Today, we’re playing a logic game. One of you will assert a claim, the other will attack it, and the third will track what’s proven. Your goal isn’t to ‘win’ debates, but to experience what it takes to defend a claim."  
    2. "Rules: Defenders must provide evidence for claims. If I say ‘prove P or Q’, you can’t just say ‘it’s obvious’—you must pick one and back it up. Some claims are unknowable, like open math problems; for those, no evidence exists."  
    3. "Scorekeepers: Log every move. Note when a claim is conceded, when a witness is missing, or when absurdity (⊥) ends the game."  

  #### **Gameplay (5–50 min)**
  - **Setup (5 min)**: Distribute materials. Groups set up concession boards.  
  - **Practice Round (10 min)**: Simple decidable claim (e.g., "P ∧ Q" with witnesses for P and Q). Instructor circulates to clarify rules.  
  - **Rounds 1–3 (30 min total, 10 min/round)**:  
    - **Round 1**: **P∨¬P** (undecidable P, e.g., "The 10^100^th digit of π is 7").  
      - *Goal*: Proponent loses—highlights refusal to assert disjunction without evidence.  
    - **Round 2**: **¬(P∧¬P)** (any P).  
      - *Goal*: Proponent wins—shows ¬ defended by contradiction.  
    - **Round 3**: **¬¬(P∨¬P)** (undecidable P).  
      - *Goal*: Proponent wins—illustrates intuitionistic validity.  
  - **Role Rotation**: After each round, switch roles so all students play each position.  

  #### **Reconvene (50–70 min)**
  - **Tally (5 min)**: Scorekeepers report outcomes:  
    - "For P∨¬P, how many Proponent wins? Losses? Unestablished?"  
    - Repeat for other formulas. Log tallies on board.  
  - **Discussion (15 min)**: Groups share experiences:  
    - "When did a game end unresolved? Why?"  
    - "Did anyone ‘win’ without evidence? How?"  

  #### **Debrief (70–90 min)**
  - **Tie Play to Concepts**:  
    - **Disjunction (P∨¬P)**: "When you defended P∨¬P with an undecidable P, you lost. Why? You must *choose* P or ¬P and prove it. You can’t just say ‘one must hold’—you need the evidence. This is the *disjunction property*: asserting ‘or’ requires proving one disjunct."  
    - **Negation & Contradiction**: "In ¬(P∧¬P), you won by forcing the Opponent into absurdity (⊥). That’s *refuting a negation*—showing P∧¬P leads to ⊥. But in ¬¬P→P, you lost because proving P requires a witness, not just ‘no contradiction’. *Proof by contradiction* (assume ¬P, derive ⊥) only gives ¬¬P, not P."  
    - **Why ¬¬P is Weaker**: "¬¬P means ‘P isn’t contradictory’, but it doesn’t supply the witness for P. In the game, you won ¬¬(P∨¬P) because you refuted ¬(P∨¬P), but that doesn’t prove P∨¬P—it just shows it’s not absurd."  
    - **Untouched Rules**: "Modus ponens (→) worked via concessions, and ex falso (⊥) ended games instantly. These survive in both logics because they rely on direct evidence or impossibility."  
  - **Predictable Issues & Responses**:  
    - **"The game is rigged!"**: "It’s designed to reflect a stricter standard of proof. In real math, undecidable claims (like digits of π) exist—constructivism demands we acknowledge when evidence is missing."  
    - **"Proponent lost because they chose wrong"**: "But they *had* to choose. If neither disjunct is provable, the disjunction itself can’t be asserted—it’s about the claim, not the player."  
    - **Winning by stalling**: Enforced by 2-minute move timer. Instructor circulates to intervene: "If you time out, concede the move."  
  - **Limits (Be Frank!)**:  
    - "This game makes a stricter standard *feel* natural but doesn’t justify why we should adopt it—that requires a meaning-theoretic argument (e.g., proof interpretations)."  
    - "It only covers propositional logic. Quantifiers (e.g., ∃xP(x)) and choice sequences aren’t included."  
    - "You can accept all rules and still be classical—this game doesn’t ‘disprove’ classical logic; it offers an alternative standard of assertion."  
    - "The link between winning strategies and intuitionistic validity is a mathematical result (e.g., via dialogical semantics), not something the game reveals."  

  ---

  ### **Why This Works**
  - **Undecidable Disjunction**: Round 1 forces students to *experience* the inability to assert P∨¬P without evidence.  
  - **Tokens as Work**: Witness tokens require "proof" (e.g., placing one feels like labor), while missing tokens create tangible frustration.  
  - **Game Design**: Rules mirror intuitionistic validity (tested exhaustively). Role rotation ensures all students engage core tensions.  
  - **Debrief Links**: Specific rounds illustrate constructivist concepts without jargon until reflection.  

  **Final Note**: This activity creates an intuitive grasp of constructivist assertion. It won’t convert classical logicians, but it makes the philosophical stance vivid and memorable.
