  - A deck of cards for each pair: cards with atomic propositions (e.g., P, Q, R), and cards with connectives (blank cards to write compound formulas).
  - Witness tokens for atomic propositions: for each atomic proposition, there is a token that can prove it, but for undecided ones, there is none.
  - A board to record concessions (maybe just a shared area).

  Rulebook summary:

  1. The Proponent asserts a main claim (a formula) and must defend it.
  2. The Opponent attacks the Proponent's assertions.
  3. The Proponent defends by breaking down the formula or by providing witnesses for atomics.
  4. The Opponent can also be forced to defend their concessions.
  5. A player loses if they cannot provide a witness for an atomic they are defending, or if they have to defend ⊥ and cannot.
  6. A player can win by forcing the other player to defend ⊥ using the negation rule: if player A has asserted X and player B has asserted X->⊥, then player B can force player A to defend ⊥.
  7. Moves alternate, starting with the Opponent attacking the main claim.

  For the activity, we will have several rounds with different formulas.

  Minute-by-minute plan:

  0-5 min: Introduction and grouping.
  - Divide into groups of 3: Proponent, Opponent, Scorekeeper.
  - There will be 6 games (12 students, 2 per game, but with a scorekeeper, so groups of 3).

  5-10 min: Explain the rules with a simple example (e.g., P∧Q).

  10-50 min: Game rounds. Each group plays several rounds with different formulas. The Scorekeeper records the moves and the outcome.

  Formulas to try (one at a time):
  1. P∨Q (where P and Q are atomic and both have witnesses) - to show a win.
  2. P∨Q (where only one has a witness) - to show that you must choose the one you can witness.
  3. P∨¬P ( atomic P without a witness) - to show loss.
  4. ¬¬P->P ( atomic P without a witness) - to show loss.
  5. ¬(P∧¬P) - to show win.
  6. ¬¬(P∨¬P) - to show win.
  7. (P->Q)->(¬Q->¬P) - we hope it will work with the negation rule, but as seen, it may not.

  For 7, if we allow the Proponent to use modus ponens in the following way: 
  - If the Proponent has to defend an atomic formula and they have a conceded implication A->B and also have A (conceded or asserted), then they can witness B if they have a witness for B? But that doesn't help.

   Alternatively, if the game allows the players to derive new formulas by modus ponens, then we can have a rule that a player may at any time assert a formula that follows by modus ponens from two formulas they have already asserted or that have been conceded by the other player. Then the other player can challenge that new formula.

   Given time, we might skip this formula or include it and see what happens.

  50-70 min: Reconvene and discuss.
  70-90 min: Debrief.

  How to run six boards at once: 
  - Each group of 3 has a set of materials.
  - The scorekeeper records on a scoresheet the moves and the outcome.
  - The instructor circulates to answer questions.

  Introduction wording:
  "Today we are playing a game of logical argument. One of you will be the Proponent, who makes a logical claim and must defend it. The other will be the Opponent, who challenges the claim. The third will be the Scorekeeper, who records what is asserted and what is conceded, and who won or lost. The goal is to see what it takes to defend a claim in this game."

   Then explain the rules with an example of a conjunction.

  Debrief:
  - Start by asking what happened in the round with P∨¬P (undecided P). They should say the Proponent lost. Why? Because they couldn't provide a witness for P, and when they chose not-P, they ended up with having to defend absurdity and couldn't.
  - Then ask about double negation: why couldn't the Proponent win ¬¬P->P? Because they eventually had to witness P.
  - Contrast with ¬(P∧¬P): here the Proponent won without knowing P, by showing that assuming P and not-P leads to a contradiction.
  - Explain that in this game, to assert a disjunction, you must be able to say which one and have a witness. For negation, it's about showing that something leads to a contradiction.
  - Then name the concepts: constructivism requires that to assert a disjunction, you must have a proof of one disjunct. Similarly, to assert exists x.P(x), you must have a witness.
  - The game does not change modus ponens or ex falso (which we might not have covered) but shows that some classical truths are not assertable without meeting the constructive standard.

  Predictably goes wrong:
  - Students might think the game is rigged because P∨¬P always loses for undecided P. Response: that's the point! In life, we often assume one of P or not-P is true, but to assert it, we need to know which.
  - A student might say the defender lost because they chose the wrong disjunct, not because the claim is unassertable. Response: in the game, the Proponent is not allowed to change their choice. They must commit. If neither choice works, then the claim cannot be defended.
  - Winning by stalling: the Scorekeeper should enforce move timers? But we don't want to rush. Maybe not include timers, but the instructor can monitor.

  Limits:
  - The game does not capture the full constructive meaning of the connectives, only the disjunction and negation.
  - Quantifiers and choice are not covered.
  - The correspondence to intuitionistic validity is not shown, only felt for specific examples.
  - A student can still believe in classical logic and just see this as a game with different rules.

  Despite the limits, the activity should make the students feel the stricter standard of assertion.

  Given the complexity, I hope this design is feasible.
