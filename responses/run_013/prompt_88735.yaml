answer: |-
  ### 1. Brainstorm (Rough Notes)
  - Semantic deflation: "True" just means "accepted by peers."  
  - Epistemic criterion: We can only *call* something true if peers accept it.  
  - Metaphysical antirealism: Truth *is constituted by* communal acceptance.  
  - Skeptical claim: We can never know if something is "true" beyond peer acceptance.  
  - Descriptive sociology: In practice, "truth" attributions track what communities endorse.  
  - Justification collapse: Justification *is* truth; no gap between them.  
  - Power dynamic: Truth is what authorities permit you to assert unchallenged.  
  - Relativism: Truth is community-relative; no trans-communal facts.  
  - Evolutionary metaphor: "Getting away with" means survival under selective pressure.  
  - Consensus fallibilism: Current consensus is our only truth-indicator, but it’s provisional.  
  - Anti-expertise: No distinction between expert/non-expert judgments.  
  - Cynical realism: Truth exists but is inaccessible; "getting away with" is all we have.  
  - Triviality: "Truth" is the label we apply to justified beliefs (tautological).  
  - Semantic nihilism: "Truth" has no meaning beyond communal enforcement.  
  - Progress denial: No framework to compare "closer to truth" across eras.  

  ---

  ### 2. The Readings, Stated Precisely  
  **Reading 1 (Semantic Deflation):**  
  *Thesis*: The word "true" has no substantive meaning beyond "accepted by one’s current epistemic community."  
  - *Truth/justification/standards*: "True" is shorthand for meeting communal justification standards.  
  - *Disagreement*: To disagree is to reject the community’s linguistic convention.  
  - *History of science*: Newton was "true" for his era; current physics is "true" now. No progress in truth, only in utility.  
  - *Right against everyone*: Impossible; truth requires communal ratification.  
  - *Verdict*: Trivial if describing linguistic practice; contentious if denying truth-aptness across contexts.  
  - *Compatibility*: Excludes realist metaphysics but compatible with epistemic Readings 2/3.  

  **Reading 2 (Epistemic Justification Criterion):**  
  *Thesis*: Justification sufficient for *asserting* truth requires contemporaneous peer approval.  
  - *Truth/justification/standards*: Truth may outrun justification, but we lack warrant to call a belief true without communal endorsement.  
  - *Disagreement*: Dissenters can be "right" but cannot legitimately *claim* truth.  
  - *History of science*: Newton was justified then; current physics is justified now. "Closer to truth" is meaningless unless defined by current standards.  
  - *Right against everyone*: Possible, but unrecognizable and non-actionable.  
  - *Verdict*: Defensible fallibilism; aligns with Peircean "settled belief."  
  - *Compatibility*: Compatible with realism (truth is mind-independent) but excludes Readings 1/4.  

  **Reading 3 (Metaphysical Antirepresentationalism):**  
  *Thesis*: Truth is constituted by communal acceptance; no "way the world is" independent of social practices.  
  - *Truth/justification/standards*: Truth = meeting community standards; no gap between justification and truth.  
  - *Disagreement*: Disagreement is failure to adhere to local norms; no "fact of the matter" beyond this.  
  - *History of science*: Truth is era-relative; comparing Newton to current physics confuses distinct language-games.  
  - *Right against everyone*: Incoherent; truth requires a community.  
  - *Verdict*: Contentious (denies representationalism); defensible per Brandom’s pragmatism.  
  - *Compatibility*: Excludes realist/semantic-deflationary readings; entails relativism.  

  **Reading 4 (Power-Enforcement Reduction):**  
  *Thesis*: Truth is determined by power structures that enforce consensus.  
  - *Truth/justification/standards*: Justification standards reflect power imbalances; "getting away with" means avoiding sanction by authorities.  
  - *Disagreement*: Dominant groups silence dissent; truth claims are tools of control.  
  - *History of science*: Scientific "progress" reflects shifts in institutional power, not epistemic gains.  
  - *Right against everyone*: Possible but suppressed; truth is orthogonal to power.  
  - *Verdict*: False as a truth theory (confuses sociology with semantics/metaphysics); defensible as critique of scientific institutions.  
  - *Compatibility*: Contradicts all other readings; reduces epistemology to politics.  

  **Reading 5 (Trivial Descriptive Sociology):**  
  *Thesis*: De facto, the predicate "true" is applied only to claims that survive peer scrutiny.  
  - *Truth/justification/standards*: Describes practice, not the nature of truth or justification.  
  - *Disagreement*: Peer rejection *de facto* blocks truth attributions, but doesn’t negate truth.  
  - *History of science*: Past theories were called "true" when accepted; current ones are now. This doesn’t address whether they *were/are* true.  
  - *Right against everyone*: Possible; the community could be wrong.  
  - *Verdict*: Trivially true observation; too weak to support antirealism.  
  - *Compatibility*: Compatible with all except Reading 3/4.  

  ---

  ### 3. Which Readings Carry Her Use  
  - **Supports dismissing the question**: Readings 1, 2, 3, and 5.  
    - *Reading 1*: If "true" just means "accepted now," comparing truth across eras is nonsensical.  
    - *Reading 2*: "Closer to truth" lacks operational meaning beyond current justification.  
    - *Reading 3*: Denies trans-historical truth, making progress unintelligible.  
    - *Reading 5*: Labels like "true" are time-bound, but this doesn’t block progress talk.  
  - **Does not support dismissal**: Reading 4 (power reduction is irrelevant to her point) and Reading 5 if isolated (too weak).  
  - **Required for her conclusion**: Reading 3 (metaphysical antirepresentationalism). Only this reading makes "closer to truth" incoherent *in principle* by denying a mind-independent world to which theories approximate. Reading 1/2/5 allow realist interpretations of progress.  
  - **Could she hold it?** Yes, with a straight face—it’s standard Rortyan antirepresentationalism. However, she risks self-refutation: if truth is *only* current acceptance, her own claim ("truth is acceptance") cannot be true across contexts.  

  ---

  ### 4. Bottom Line  
  The most likely intended reading is **Reading 3 (metaphysical antirepresentationalism)**, as it alone renders "progress toward truth" meaningless without smuggled realism. Grant **Reading 2 (epistemic justification criterion)**—it’s defensible and allows her to reject *unverifiable* progress claims, but doesn’t collapse into relativism or power dynamics.  

  **Counter-sentence**:  
  >"If our standards themselves improve—say, by generating more reliable predictions or unifying more phenomena—couldn’t theories surviving *those* standards be ‘closer to truth’ without invoking God’s eyes, just by better fulfilling the aims implicit in scientific practice?"  

  This challenges her conflation of *current standards* with *unchanging standards*, forcing engagement with internal progress indicators.
