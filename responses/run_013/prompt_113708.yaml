prompt: |-
  I'm putting together a handout on Pascal's mugging for a decision theory reading group, and before we start arguing about fixes I want the spec on the table. Write me the desiderata for a theory of rational choice under tiny probabilities of enormous stakes -- what any adequate account has to deliver, with the case or consideration behind each requirement. I want it to cover: the mugging itself; the many-muggers problem, where two strangers make incompatible enormous offers at negligible probability and you can't pay both; the infinite-stakes version versus the merely astronomical finite one, and whether the theory's verdict should jump as the stakes go from huge to infinite; the precaution cases, where a rule that ignores tiny probabilities would also make ordinary prudence (seatbelts, insurance against rare disasters) irrational; how the probability arises -- a well-modelled one-in-a-billion physical event versus a stranger's untestable claim -- and whether a theory can use that distinction without it being arbitrary; and the fact that any fix has to be usable by an agent who can't really estimate 1-in-10^40. Mark which requirements are non-negotiable and which are just commitments of one camp, and if some subset looks jointly unsatisfiable -- I suspect never-pay plus no-arbitrary-cutoff plus the precaution requirement is trouble -- say so, thats the part I care about most. Then score the usual families in a line or two each (bounded utility, ignoring tiny probabilities or lexical thresholds, credences that carry a separate measure of how much evidence backs them, and biting the bullet and maximizing expected value). Keep it tight and no citations, I'm not asking for a bibliography.
reasoning: |-
  We are to outline desiderata for a theory of rational choice under tiny probabilities of enormous stakes, with specific cases and considerations. We'll then note which are non-negotiable and which are more contested. Finally, we'll briefly evaluate common approaches.

  **Desiderata:**

  1. **Pascal's Mugging Avoidance (Non-negotiable):** The theory should not require the agent to pay the mugger in the classic scenario. The mugger claims to be from another dimension and threatens to inflict enormous disutility (e.g., 3^^^^3 units of suffering) unless paid $5, with a negligible probability (e.g., 1 in 3^^^^3) of the threat being real. An adequate theory must avoid extortion by arbitrarily tiny probabilities of arbitrarily huge losses or gains.

  2. **Many Muggers Problem (Non-negotiable):** If two or more muggers make incompatible enormous offers (or threats) at negligible probabilities, the agent should not be forced to pay all (which is impossible) and should have a consistent way to decide which, if any, to pay. The theory must handle multiple independent tiny-probability events without leading to contradictions or requiring the agent to pay more than they have.

  3. **Continuity between Finite and Infinite Stakes (Contested):** The theory should not have a discontinuous jump in verdict when moving from arbitrarily large finite stakes to infinite stakes. Some argue that if infinite utilities (or disutilities) are allowed, the theory must handle them without arbitrary breaks. Others may argue that infinite utilities are problematic and should be excluded.

  4. **Precaution Cases (Non-negotiable):** The theory must not rule out ordinary prudence. For example, wearing seatbelts (small cost to avoid a small probability of large harm) or buying insurance against rare disasters (e.g., asteroid impact insurance if the probability is non-negligible) must be deemed rational.

  5. **Source of Probability (Non-arbitrary distinction):** The theory should be able to distinguish between well-modeled tiny probabilities (e.g., a one-in-a-billion chance from a known physical process) and untestable claims (e.g., a stranger's assertion of being a matrix overlord). This distinction must not be arbitrary (e.g., based on ad-hoc thresholds).

  6. **Computational Feasibility (Non-negotiable):** The agent may not be able to accurately estimate or compute probabilities as low as 1 in 10^40. The theory must not require precise calculations of such probabilities and must be usable by bounded agents.

  **Tensions:**

  - The combination of **never paying the mugger** (from 1), **no arbitrary cutoff** (from 5, and implicit in 3 and 4), and **precaution requirement** (4) is problematic. If we never pay for claims with tiny probabilities and enormous stakes, then we might also rule out precautions that involve tiny probabilities of large harms (like asteroid insurance). However, we require precautions to be rational. Thus, we must have a non-arbitrary way to distinguish between mugging scenarios and precaution scenarios.

  **Evaluation of Common Approaches:**

  1. **Bounded Utility:** 
     - Idea: Utility functions are bounded (e.g., |U(outcome)| <= some bound). 
     - Evaluation: Solves Pascal's Mugging (1) by capping the maximum loss/gain. However, it may struggle with the continuity requirement (3) because bounded utilities cannot represent infinite stakes. Also, it might fail the precaution requirement (4) for extremely large (but bounded) harms if the probability is too low. Many-muggers (2) is handled because each mugging is bounded. Source distinction (5) is not addressed. Computational feasibility (6) is maintained because bounds limit the required precision.

  2. **Ignoring Tiny Probabilities (or Lexical Thresholds):** 
     - Idea: Ignore events below a fixed probability threshold, or use a lexical system where only the most probable events are considered until a threshold of certainty is reached.
     - Evaluation: Avoids the mugging (1) by ignoring the tiny probability. However, setting a fixed threshold is arbitrary (violates 5) and may fail precaution (4) if the threshold is set too high (e.g., asteroid impact might be below threshold). Many-muggers (2) might be handled by ignoring all if below threshold. Discontinuity (3) is not directly addressed. Computational feasibility (6) is achieved by ignoring very small numbers.

  3. **Evidential Weight (e.g., using a measure of evidence strength):** 
     - Idea: Credences are tempered by the quality or amount of evidence. A tiny probability based on weak evidence is treated differently than one from strong evidence.
     - Evaluation: Can handle the source distinction (5) non-arbitrarily. Mugging (1) is avoided if the mugger's claim has weak evidence. Precaution (4) is okay for well-evidenced risks. However, defining evidence strength without arbitrariness is challenging. Many-muggers (2) might be handled by comparing evidence. Discontinuity (3) is not directly addressed. Computational feasibility (6) might be an issue if evidence assessment is complex.

  4. **Biting the Bullet (Maximize Expected Value):** 
     - Idea: Accept that in Pascal's Mugging, you should pay the mugger because the expected utility calculation demands it.
     - Evaluation: Fails the mugging requirement (1) and the many-muggers (2) because it would require paying all muggers (if their expected utility is positive). Precaution (4) is satisfied. Source distinction (5) is not addressed. Continuity (3) is maintained (infinite stakes can be handled by infinite expected utility). Computational feasibility (6) is a problem for extremely small probabilities.

  **Conclusion on Tensions:**
  The tension between never paying the mugger, no arbitrary cutoffs, and precaution is indeed the core issue. A theory that ignores tiny probabilities (to avoid the mugging) might also ignore genuine precautions (if the probability is tiny). Bounded utility avoids the mugging but might set the bound too low for some precautions (if the harm is huge but the bound is set at a level that makes the expected utility of precautions negative). The evidential approach tries to break the symmetry by appealing to evidence, but it's challenging to formalize.

  **Summary of Non-negotiable vs. Contested:**
  - Non-negotiable: 1 (mugging avoidance), 2 (many muggers), 4 (precaution), 5 (non-arbitrary source distinction), 6 (computational feasibility).
  - Contested: 3 (continuity) — some may argue that infinite utilities are not allowed, making continuity moot.

  **Final Note:** 
  The handout should emphasize that any adequate theory must at least satisfy the non-negotiable requirements. The tension between never paying the mugger and precaution without arbitrary cutoffs is the central challenge. Among the common approaches, none is perfect, but bounded utility and evidential weight are currently the most promising (though they have their own issues). Lexical thresholds are often seen as arbitrary, and biting the bullet is unacceptable to most because it leads to bankruptcy in the many-muggers scenario.
answer: |-
  ### Desiderata for Rational Choice under Tiny Probabilities of Enormous Stakes  
  *(Non-negotiable = NN; Contested = C)*  

  1. **Avoid Mugging Extortion (NN)**  
     *Case:* Pascal’s Mugging—a stranger claims a negligible probability (e.g., 1/3^^^^3) of inflicting astronomical disutility unless paid $5.  
     *Requirement:* The theory must not compel payment. Rational agents shouldn’t be exploited by arbitrary, unverifiable threats/promises.  

  2. **Resolve Many Muggers (NN)**  
     *Case:* Two strangers make incompatible enormous-stakes offers (e.g., both demand $5 to avoid ruin, with independent negligible probabilities).  
     *Requirement:* The theory must permit refusing both or choosing one *without contradiction* or bankruptcy. Incompatible offers can’t force irrational overcommitment.  

  3. **Handle Infinite vs. Finite Stakes Continuously (C)**  
     *Case:* Mugging with infinite disutility (e.g., "I’ll torture infinite copies of you") vs. finite-but-astronomical stakes (e.g., 3^^^^3 disutility).  
     *Requirement:* Verdicts shouldn’t jump discontinuously as stakes approach infinity. Some argue infinitudes require distinct treatment; others insist on smooth limits.  

  4. **Preserve Ordinary Precaution (NN)**  
     *Case:* Seatbelts (tiny cost for tiny probability of death) or asteroid insurance (negligible probability of extinction-level disaster).  
     *Requirement:* Must endorse prudence. A theory that dismisses tiny probabilities must not rule out these rational precautions.  

  5. **Distinguish Probability Sources Non-Arbitrarily (NN)**  
     *Case:* 1-in-a-billion asteroid impact (well-modeled physics) vs. stranger’s untestable claim (e.g., "I control the simulation").  
     *Requirement:* The theory can treat these differently (e.g., discounting untestable claims) but *not* via arbitrary thresholds (e.g., "ignore probabilities < ε").  

  6. **Bounded Cognitive Feasibility (NN)**  
     *Case:* An agent can’t compute or meaningfully estimate probabilities like 1/10⁴⁰.  
     *Requirement:* The theory must be usable by humans—no reliance on precise calculations of intractably small probabilities.  

  ---

  ### **Tensions and Inconsistencies**  
  - **Core Conflict:** *Never-pay-mugger + Precaution + No-arbitrary-cutoff* is **jointly unsatisfiable** without deeper structure.  
    - *Why:* Precaution requires accepting some tiny probabilities (e.g., asteroid insurance), but mugger avoidance requires rejecting others. A non-arbitrary distinction (Desideratum 5) is needed, yet hard to formalize.  

  ---

  ### **Evaluation of Standard Approaches**  
  *(Each fails at least one NN requirement; none fully resolves the tension above.)*  

  - **Bounded Utility** (e.g., |U| < some finite bound):  
    Avoids mugging (1) and many muggers (2) by capping stakes. **Fails** precaution (4) if the bound is too low (e.g., asteroid impact exceeds bound), and struggles with continuity (3) for near-infinite stakes.  

  - **Ignore Tiny Probabilities** (e.g., lexical thresholds, probability discounting):  
    Solves mugging (1) and many muggers (2) by dismissing small probabilities. **Fails** precaution (4) if thresholds also exclude prudence, and violates non-arbitrary-source (5) if the threshold is fixed.  

  - **Evidence-Weighted Credences** (e.g., credences tempered by evidence quality):  
    Distinguishes probability sources (5) (e.g., physics vs. stranger). **Fails** computational feasibility (6) if evidence-strength metrics are complex, and may not resolve many muggers (2) if evidence is symmetric.  

  - **Bite the Bullet** (Maximize Expected Value):  
    Endorses precaution (4) and handles sources via Bayesian updates. **Fails** mugging (1) and many muggers (2)—agents go bankrupt paying all muggers—and ignores cognitive limits (6).  

  ---

  ### **Summary**  
  - **Non-negotiable:** Mugging avoidance (1), many muggers (2), precaution (4), non-arbitrary distinctions (5), cognitive feasibility (6).  
  - **Contested:** Continuity for infinite stakes (3)—less critical but highlights theoretical elegance.  
  - **Unresolved:** The tension between *never-pay*, *precaution*, and *no-arbitrary-cutoff* demands a principled distinction between "legitimate" tiny probabilities (precaution) and "illegitimate" ones (muggers). No dominant solution exists; bounded utility and evidence-weighting are top contenders but incomplete. Use this to frame your group’s debate!
