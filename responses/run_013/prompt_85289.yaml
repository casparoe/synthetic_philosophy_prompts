prompt: |-
  I've been reading about Kepler, who spent a lot of his time casting horoscopes for noblemen while calling most astrology rubbish. What got me wasnt the hypocrisy, it's the shape of his defence: he didn't say the ordinary horoscope-mongers were right, he said they were wrong about nearly everything, and that what's really going on (as I understand it) is a kind of resonance between the angles of the planets and the soul. So the bits he kept were exactly the bits his own theory of harmony could make sense of, and the bits he binned were the ones it couldn't. I keep seeing the same move elsewhere: someone absorbs the science that was meant to kill a practice, then carries on with a slimmed-down version of it, re-described in the vocabulary of that science, so every old objection can be shrugged off with 'thats not what I mean by it'. (Defences of prayer do something like this — it isnt about asking for things, it's really about stillness.) Is there a name for this? I don't want just a label: tell me what the nearest established concepts are, how the thing I've described differs from each of them, and if nothing fits, coin a term and define it, with a boundary case or two where it's genuinely unclear whether the pattern is present. Give it to me as a numbered list of exactly five points, a sentence or two each, no intro and no conclusion.
reasoning: |-
  Okay, the user is asking about a specific intellectual maneuver where someone takes a practice like astrology or prayer, strips away the discredited parts using scientific critique, and redefines the remainder in scientific-sounding terms to make it defensible. They've noticed this pattern in historical figures like Kepler and modern equivalents like spiritual defenses of prayer. 

  The user wants this concept named and analyzed precisely—not just labeled, but differentiated from adjacent ideas like cherry-picking or pseudoscience. They're clearly intellectually sophisticated (citing Kepler's harmonic theory!) and frustrated by superficial critiques that miss this subtlety. Underneath, they might be wrestling with how to evaluate beliefs that hybridize tradition with science, or seeking tools to dissect modern "science-adjacent" spiritual trends.

  Hmm... existing terms don't quite fit. "Rationalization" is too broad, "cherry-picking" misses the redefinition aspect, and "scientism" attacks motives rather than the mechanism. Time to coin something fresh. "Selective Recontextualization" captures the core move: selecting fragments of a practice and rehousing them in a new explanatory framework. 

  For the five-point breakdown: First, define the coined term tightly. Then contrast it with four neighbors—cherry-picking (different because it changes the framework), compartmentalization (different because it doesn't integrate the critique), scientism (different motive), and pseudoscience (different relationship to evidence). Boundary cases could include acupuncture studies (is it recontextualization or just bad science?) and Freudian concepts (did they genuinely evolve or just rebrand?). 

  Key is keeping each point clinical and distinction-focused—no fluff, just surgical differentiation like the user requested. They'd hate padding.
answer: |-
  Here is the analysis in the requested format:

  1.  **Selective Recontextualization:** This is the core move: retaining specific elements of a discredited practice by extracting them from their original framework and embedding them within a new, often scientific or rational-sounding explanatory system, thereby shielding them from traditional critiques. Kepler kept planetary angles but discarded astrological causality, embedding angles within his harmonics theory.
  2.  **Distinct from Cherry-Picking:** While both involve selectivity, cherry-picking isolates favorable evidence/data *within* the original framework without fundamentally redefining the practice's core concepts or mechanisms. Selective Recontextualization actively redefines the *meaning and mechanism* of the retained elements using the language and concepts of the critical framework itself.
  3.  **Distinct from Compartmentalization:** Compartmentalization involves holding contradictory beliefs separately without reconciling them (e.g., doing science by day, astrology by night). Selective Recontextualization attempts reconciliation by integrating the salvaged practice elements *into* the critical framework, changing their definition to avoid direct conflict.
  4.  **Distinct from Scientism:** Scientism is the over-application of scientific concepts to inappropriate domains. Selective Recontextualization uses scientific concepts strategically as a *defensive shield* for specific salvaged elements, not necessarily out of belief they are universally applicable, but to legitimize the retained practice fragment within the dominant epistemic paradigm.
  5.  **Distinct from Pseudoscience:** Pseudoscience mimics scientific forms but lacks methodological rigor and evades falsification *within* its own claims. Selective Recontextualization uses actual science to *critique and dismantle* the bulk of the original practice, then co-opts scientific vocabulary to redefine the residue, making the residue unfalsifiable *by design* ("that's not what I mean") rather than through flawed methodology. **Boundary Case:** Is modern acupuncture research (focusing on neural mechanisms, discarding qi meridians) Selective Recontextualization or legitimate scientific investigation? **Boundary Case:** Are Freudian concepts redefined in neuropsychoanalytic terms Selective Recontextualization or theoretical evolution? Ambiguity hinges on perceived legitimacy of the new explanatory framework.
