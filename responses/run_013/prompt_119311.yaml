answer: |-
  ### The Case: Cross-Border Hydropower Regulation  

  The Riverine Authority (RA), a provincial agency in Country A, decides whether to approve a state-owned hydropower company's plan to divert a shared river for a new dam. The dam would cause predictable seasonal flooding of farmland in downstream Country B, where farmers rely on stable water flow. Under a binding international river-sharing treaty, the RA cannot alter flow rates affecting Country B without unanimous approval from a neutral arbitration panel—which it lacks. Meanwhile, the hydropower company's unionized workers in Country A (covered by an ironclad collective bargaining agreement enforced through independent courts) face no changes to wages, safety standards, or job security regardless of the decision. The farmers in Country B have no legal standing in Country A’s institutions and cannot veto the project.  

  ---

  ### Analysis  

  **1. Verdicts by Principle**  
  - **Unionized Workers (Subjected but Unaffected)**:  
    - *All-subjected*: **Included**. The RA exercises coercive authority over them (e.g., enforcing workplace safety rules, taxation).  
    - *All-affected*: **Excluded**. The decision does not significantly set back their welfare interests. The collective agreement and courts credibly protect wages/job security (*not* stipulated; the guarantee is operationalized through enforceable contracts).  
  - **Downstream Farmers in Country B (Affected but Not Subjected)**:  
    - *All-subjected*: **Excluded**. The RA claims no authority to enforce rules against them (they are outside its jurisdiction).  
    - *All-affected*: **Included**. The flooding directly sets back their livelihood and property (welfare interests), per hydrological evidence.  

  **2. The Divergence Feature: The External Guarantee**  
  The protective mechanism (treaty + arbitration for farmers; courts + union contract for workers) is the critical feature.  
  - *If removed*:  
    - Workers’ welfare *could* be affected (e.g., if job security depended on the dam), collapsing their exclusion under all-affected.  
    - Farmers might gain recourse (e.g., if the treaty lapsed), collapsing their inclusion under all-affected (if harm became avoidable).  

  **3. Objection from All-Affected Defenders**  
  **Objection**: "Subjection to coercion intrinsically sets back welfare interests (e.g., autonomy), so workers should be included under all-affected."  
  **Response**: The case survives because the *deliberately narrow* all-affected principle excludes coercion *per se* as a welfare setback. Welfare interests here are strictly **material** (health, livelihood, etc.). Coercion’s psychological/autonomy effects are excluded by design—making the exclusion of workers coherent.  

  **4. Commensurability of Subjection and Affectedness**  
  - Subjection is a **standing relation** (workers are perpetually under RA’s authority).  
  - Affectedness is **decision-specific** (farmers are harmed only by this dam).  
  They are incommensurable here, but the case does *not* depend on this. Even if we treated subjection as decision-specific (e.g., "subjected to *this* decision"), workers are still subjected (the RA enforces dam-related workplace rules), while farmers are still unaffected by coercion.  

  **5. Satisfiability of Specifications**  
  **Jointly satisfiable without smuggling**. The case meets all constraints:  
  - Mundane (provincial agency, treaty, union contracts).  
  - Workers’ protection is credible (courts + binding contracts) and substantial (core welfare interests).  
  - Farmers are non-members, voiceless, and trapped.  
  - No forbidden themes (borders are incidental, not causal).  
  The guarantor’s fallibility is irrelevant: the principles assess *immediate* conditions, not hypothetical failures.  

  ---

  ### Why This Works  
  The all-subjected principle **includes workers** (coercively governed) while the narrow all-affected principle **excludes them** (welfare guaranteed) and **includes foreign farmers** (welfare threatened). This flips the script: here, all-subjected is *more expansive* in including a group shielded from harm, while all-affected is *more restrictive* toward that group but expansive toward outsiders. The gap arises solely from the narrow welfare definition—highlighting how the "direction" of inclusion depends entirely on how we bound affectedness.
