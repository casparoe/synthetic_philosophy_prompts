answer: |-
  Here is a specification of the criteria a theory of perceptual experience must meet, focusing on cases, distinctions, and empirical constraints, motivated by their philosophical or empirical significance. This list prioritizes what a theory must *deliver* or *respect*, not how specific theories perform.

  **I. Core Cases the Theory Must Account For (Motivating Problem: The Argument from Illusion & Varieties of Error)**

  1.  **Ordinary Veridical Perception (OVP):**
      *   *Case:* S sees a ripe tomato in good light, and it looks red and round to S. The tomato *is* red and round. S forms a true belief.
      *   *Requirement:* The theory must explain how the experience directly presents the actual properties of the mind-independent object. It must account for the *success* and *directness* of perception in this case without rendering it metaphysically or epistemically problematic.

  2.  **Classical Illusion (CI):**
      *   *Case:* A straight stick partially submerged in water looks bent to S. S may (mistakenly) believe it is bent.
      *   *Requirement:* The theory must explain how the experience presents an object (the stick) but misrepresents one of its properties (shape). It must account for the *presence* of the actual object coupled with *misrepresentation* of a specific property. (Motivates the question: *What* is the bent shape a property of?).

  3.  **Total Hallucination (TH):**
      *   *Case:* S has a vivid visual experience as of a pink rat on the table, but there is no pink rat (or relevant object) present at all. S may form a false belief.
      *   *Requirement:* The theory must explain how an experience can have a specific, object-involving *phenomenal character* (it seems to S *that there is a pink rat*) without being caused by or presenting any corresponding mind-independent object. (Directly challenges naive realism and motivates sense-data/representationalism).

  4.  **Hybrid/Illusory Property Case (HP):**
      *   *Case:* S looks at a real, unchipped mug under conditions where a small chip *appears* to be present on its rim (due to a trick of light, expectation, or minor brain glitch). The mug is present, but the chippedness is not.
      *   *Requirement:* The theory must explain how an experience can be *partially* veridical (presenting the real mug) and *partially* non-veridical (presenting a non-existent property). It must clarify the ontological and epistemological status of this "mixed" episode – is it a type of illusion? A limited hallucination? A distinct category? The theory cannot simply ignore or dismiss this case. (Highlights the complexity of error and the potential "gappiness" of object presentation).

  5.  **(Optional Scope Question) Proprioceptive/Bodily Illusion (PBI):**
      *   *Case:* An amputee experiences a vivid phantom limb sensation (e.g., an itch in the missing hand).
      *   *Requirement:* The theory must either (a) explain such cases as genuine perceptual experiences (albeit non-veridical) falling under its general framework, or (b) explicitly justify why perception is restricted to the *external* world, providing a principled account of the difference between external perception and bodily sensation/illusion. It cannot *ad hoc* exclude them without motivation. (Challenges the paradigm of "external world perception").

  **II. Essential Distinctions the Theory Must Preserve (Motivating Philosophical Pitfalls)**

  6.  **Phenomenal Character vs. Epistemic Standing:**
      *   *Distinction:* What the experience is *like* for the subject (its subjective feel, sensory qualities) vs. whether it provides justification for belief (e.g., veridical vs. hallucinatory).
      *   *Requirement:* The theory must allow that two experiences can be phenomenally identical (e.g., a perfect hallucination and its veridical counterpart) while differing in epistemic status (one justifies belief, the other does not, or does so misleadingly). Conversely, it must allow that experiences with different phenomenal characters can have the same epistemic status regarding a specific proposition.

  7.  **Causal Role vs. Epistemic/Intentional Role of the Object:**
      *   *Distinction:* How the object contributes to *bringing about* the experience (causation) vs. how the experience *purports to present* or *justifies beliefs about* the object (intentionality/justification).
      *   *Requirement:* The theory must explain how the object can be causally necessary for OVP without its causal role fully constituting the experience's intentional content or epistemic force. It must account for TH, where there is *no* object causally responsible for the specific content, yet the experience still has intentional content *as of* an object. (Prevents collapsing perception into mere causal chains).

  8.  **Experiential Content vs. Doxastic/Judgmental Content:**
      *   *Distinction:* The content inherently presented *by the experience itself* (e.g., "redness here now") vs. the content of the *belief* or *judgment* formed *based on* the experience (e.g., "That is a tomato").
      *   *Requirement:* The theory must allow for the possibility of *non-conceptual* (or differently structured) experiential content that grounds conceptual judgments. It must explain cases where the experiential content is ambiguous or underdetermined, yet a specific judgment is made, and cases where subjects have the same experience but form different beliefs (or withhold belief). (Prevents intellectualizing perception or making belief constitutive of experience).

  **III. Empirical Constraints the Theory Must Accommodate (Motivating Psychological Reality)**

  9.  **Perceptual Constancy:**
      *   *Fact:* We perceive object properties (size, shape, color, lightness) as stable despite significant variations in sensory input (viewing distance, angle, illumination). E.g., a door looks rectangular even as its retinal image shifts from trapezoid to rectangle as it opens.
      *   *Requirement:* The theory must explain how the experience presents *enduring object properties* rather than just fleeting sensory qualities, accounting for the brain's complex processing achieving this stability. (Challenges purely "sensation"-based views).

  10. **Cross-Modal & Adaptation Effects:**
      *   *Facts:* (a) Perception integrates information from multiple senses (e.g., ventriloquism effect, sound influencing perceived location of light flash; McGurk effect, sound influencing perceived lip movement). (b) Prolonged exposure to a stimulus (e.g., downward motion) alters the perception of subsequent stimuli (e.g., stationary objects appear to drift upward - motion aftereffect).
      *   *Requirement:* The theory must be compatible with the deep integration of sensory systems and the plasticity of perceptual systems, showing how these effects fit within its account of experiential content and its relation to the world. (Challenges overly modular or static views of experience).

  11. **Cognitive Penetrability (or Lack Thereof) / Belief-Insensitivity:**
      *   *Facts:* Many perceptual experiences appear resistant to belief or knowledge. E.g., The Müller-Lyer illusion persists even when S knows the lines are equal; one cannot simply *decide* to see a color differently based on belief alone.
      *   *Requirement:* The theory must account for the relative *autonomy* or *encapsulation* of perceptual processing and phenomenal character from high-level cognitive states like belief and desire, while also accommodating cases where expectations *do* subtly influence perception (e.g., hearing ambiguous sounds based on context). It must explain the limits of top-down influence.

  **IV. Addressing Your Specific Requests**

  1.  **The Most Exclusionary Requirement:**
      *   **Subjective Indistinguishability of Veridical Perception and Hallucination (SI):** Your suspicion is **correct**. The requirement that the theory must *explain how a veridical experience and a subjectively indistinguishable hallucination can share their phenomenal character* (or a significant common element) is arguably the most potent filter.
      *   *Why:* It directly challenges **Naive Realist Disjunctivism** by demanding an account of the hallucinatory side *in terms that acknowledge its subjective similarity to the veridical case*. It pressures disjunctivists to explain what this indistinguishability *consists in* without appealing to a common, non-disjunctive kind of experience. Theories that cannot accommodate SI (e.g., a simplistic naive realism that denies any commonality whatsoever) are immediately strained. While other requirements (like accounting for TH or HP) are crucial, SI uniquely forces a confrontation with the core disjunctive/non-disjunctive divide.

  2.  **Potentially Jointly Unsatisfiable Requirements:**
      *   **The Core Tension:** The most significant potential conflict lies between:
          *   **The Intentional/Relational Constraint (from OVP & CI):** The theory must explain how perception *directly presents mind-independent objects and their properties* (especially in OVP), often implying the object is a constituent of the experience.
          *   **The Phenomenal Commonality Constraint (from SI & TH):** The theory must explain how OVP and a subjectively indistinguishable TH can share their phenomenal character (or possess a common element responsible for it).
      *   *Why Unsatisfiable?* Reconciling the *direct presence of the actual object* in OVP (suggesting a fundamental difference in kind) with the *subjective indistinguishability* of OVP and TH (suggesting a deep similarity) is the central challenge. A theory strongly emphasizing one often struggles to fully accommodate the other without theoretical cost or compromise. Disjunctivists prioritize the first at the expense of making the second primitive or relational; Representationalists/Sense-Datum theorists prioritize the second (a common representational content or sensed object) at the expense of direct relationality in OVP.
      *   **Other Potential Frictions:**
          *   **HP vs. Strict Disjunctivism:** Classifying the Hybrid case cleanly is extremely difficult for disjunctivism (is it veridical? illusory? a new fundamental kind?).
          *   **PBI Scope vs. External Paradigm:** Insisting perception *only* concerns the external world requires a sharp, motivated distinction from bodily sensation/illusion, which may be hard to draw empirically or phenomenologically.
          *   **Constancy/Adaptation vs. Simple Relational Views:** Explaining complex constancy mechanisms and adaptation effects purely in terms of direct acquaintance with external properties is challenging.

  **Summary of Key Deliverables:**

  A successful theory must:
  1.  **Cover the Cases:** Explain OVP, CI, TH, HP, and address PBI's scope.
  2.  **Respect the Distinctions:** Maintain the separateness of Phenomenal Character/Epistemic Standing, Causal/Intentional-Epistemic Role, and Experiential/Doxastic Content.
  3.  **Respect the Data:** Accommodate Perceptual Constancy, Cross-Modal/Adaptation Effects, and Belief-Insensitivity.
  4.  **Pass the SI Test:** Explain the subjective indistinguishability of veridical and hallucinatory experiences.
  5.  **Grapple with the Core Tension:** Confront the difficulty of jointly satisfying the demands of direct presentation (OVP) and phenomenal commonality (SI/TH).

  This list provides the necessary landscape and pressure points. The challenge for any theory is to navigate these constraints without collapsing essential distinctions or ignoring core phenomena, while the tension between direct relationality and phenomenal commonality remains the central philosophical battleground.
