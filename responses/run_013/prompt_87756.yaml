answer: |-
  Your sense that there is an inconsistency in your friend's choices is correct. Her pair of decisions violates a fundamental principle of rational decision-making known as the **independence axiom** of expected utility theory. This axiom states that a rational decision-maker's preferences should not change when adding identical outcomes to different options with the same probability. In simpler terms, if two choices are modified by adding the same "common consequence," the preference between them should remain the same.

  Below, I'll explain the inconsistency step by step, showing how her choices conflict, which principle is violated, and why your unease is justified. I'll also address why each choice might seem defensible on its own.

  ### Step 1: Understanding the Choices and Expected Values
  Let's start by outlining the options and their expected monetary values (EMV), assuming a linear utility function for money (i.e., risk neutrality) for simplicity. This isn't necessary for the inconsistency argument, but it helps set the stage.

  - **First Scenario:**
    - Option A: $10,000 for certain. EMV = $10,000.
    - Option B: $10,000 with probability 0.89, $60,000 with probability 0.10, nothing with probability 0.01.  
      EMV = (0.89 × $10,000) + (0.10 × $60,000) + (0.01 × $0) = $8,900 + $6,000 + $0 = $14,900.
    - Your friend chooses A over B, citing a preference for guaranteed money. This suggests risk aversion, as she is willing to accept a lower EMV to avoid the small (1%) risk of getting nothing.

  - **Second Scenario:**
    - Option C: $10,000 with probability 0.11, nothing with probability 0.89. EMV = (0.11 × $10,000) + (0.89 × $0) = $1,100.
    - Option D: $60,000 with probability 0.10, nothing with probability 0.90. EMV = (0.10 × $60,000) + (0.90 × $0) = $6,000.
    - Your friend chooses D over C, citing that C's odds of paying anything are too poor. Despite the similar probabilities of winning (11% for C vs. 10% for D), the higher potential payout of D makes it more attractive to her.

  On the surface, both choices seem reasonable:
  - In the first scenario, she avoids a small risk of loss when a sure gain is available.
  - In the second scenario, when both options involve high risk, she favors the option with the larger potential gain, even though it has a slightly lower probability of winning.

  However, when we analyze the choices together using expected utility theory, a contradiction emerges.

  ### Step 2: Identifying the Inconsistency with Expected Utility Theory
  Expected utility theory (EUT) assumes that a rational decision-maker maximizes expected utility based on a consistent utility function \(u(x)\), where \(x\) is the outcome. The inconsistency arises when we express her preferences mathematically and show they cannot coexist with any utility function.

  - **Preference from the First Choice (A > B):**  
    Choosing A over B implies:  
    \[
    u(10,000) > 0.89 \times u(10,000) + 0.10 \times u(60,000) + 0.01 \times u(0)
    \]  
    Rearranging this inequality:  
    \[
    u(10,000) - 0.89 \times u(10,000) > 0.10 \times u(60,000) + 0.01 \times u(0)
    \]  
    \[
    0.11 \times u(10,000) > 0.10 \times u(60,000) + 0.01 \times u(0) \quad \text{(Equation 1)}
    \]  
    This means that the utility gain from avoiding the 1% risk of nothing (and getting $10,000 instead) outweighs the potential gain from the 10% chance of $60,000 (instead of $10,000).

  - **Preference from the Second Choice (D > C):**  
    Choosing D over C implies:  
    \[
    0.10 \times u(60,000) + 0.90 \times u(0) > 0.11 \times u(10,000) + 0.89 \times u(0)
    \]  
    Rearranging this inequality:  
    \[
    0.10 \times u(60,000) - 0.11 \times u(10,000) + 0.90 \times u(0) - 0.89 \times u(0) > 0
    \]  
    \[
    0.10 \times u(60,000) - 0.11 \times u(10,000) + 0.01 \times u(0) > 0 \quad \text{(Equation 2)}
    \]  
    Multiplying both sides by -1 (which reverses the inequality):  
    \[
    -0.10 \times u(60,000) + 0.11 \times u(10,000) - 0.01 \times u(0) < 0
    \]  
    \[
    0.11 \times u(10,000) - 0.10 \times u(60,000) < 0.01 \times u(0) \quad \text{(Equation 2 simplified)}
    \]

  - **The Contradiction:**  
    From Equation 1:  
    \[
    0.11 \times u(10,000) - 0.10 \times u(60,000) > 0.01 \times u(0)
    \]  
    From Equation 2 simplified:  
    \[
    0.11 \times u(10,000) - 0.10 \times u(60,000) < 0.01 \times u(0)
    \]  
    These two inequalities cannot both be true simultaneously for any utility function \(u\). Specifically, the term \(0.11 \times u(10,000) - 0.10 \times u(60,000)\) cannot be both greater than and less than \(0.01 \times u(0)\) at the same time.

  This contradiction means your friend's preferences are inconsistent with expected utility theory. Her choices violate the **independence axiom**, which requires that adding a common outcome (in this case, a high probability of nothing) should not reverse preferences.

  ### Step 3: Where the Inconsistency Lies: Common Consequence Effect
  The inconsistency stems from how your friend treats the common consequence (the high probability of nothing) in the two scenarios. This is a classic example of the **Allais paradox** (a well-known decision-making anomaly), where people's choices change based on the context, violating EUT.

  - **In the First Scenario:**  
    Option A offers a guaranteed $10,000, while Option B introduces a small (1%) risk of nothing. Your friend is highly sensitive to this risk because she is comparing it to a certain gain. She overweights the possibility of getting nothing (a loss compared to the sure thing), leading her to choose A. This is risk aversion in the domain of gains.

  - **In the Second Scenario:**  
    Both C and D involve a high probability of nothing (89% and 90%, respectively). Here, the guaranteed outcome is effectively "nothing," so your friend focuses on the potential gains. The difference in winning probabilities (11% vs. 10%) is small, so she underweights it and chooses D for the larger prize. This is risk-seeking in the domain of losses or when all options are risky.

  The violation occurs because the "common consequence" (the 89% or 90% chance of nothing) should not affect the preference between the risky components. Specifically:
  - In Option B, the "risky part" (what happens with the remaining 11% probability) is a 10/11 chance of $60,000 and a 1/11 chance of nothing, but this is bundled with a 89% chance of $10,000.
  - In Option D, the risky part is directly a 10% chance of $60,000 and 90% chance of nothing.
  - Similarly, Option C is a direct 11% chance of $10,000 and 89% chance of nothing.

  By choosing A > B and D > C, your friend is effectively saying:
  - She prefers a sure $10,000 over a 10% chance of $60,000 plus a 1% chance of nothing (when bundled with 89% of $10,000).
  - But she prefers a 10% chance of $60,000 over an 11% chance of $10,000 when both are isolated with a high chance of nothing.

  This reversal is irrational under EUT because the common consequence (the 89% chance of $10,000 in B or the 89% chance of nothing in C) should not change the core preference between the risky outcomes.

  ### Step 4: Which Principle Is Violated?
  The violated principle is the **independence axiom of expected utility theory**. This axiom states that if option X is preferred to option Y, then a mixture of X with probability \(p\) and some common outcome Z with probability \(1-p\) should be preferred to the same mixture of Y and Z. In this case:
  - X could be the risky part of B (10% chance of $60,000 and 1% chance of nothing), but since it's mixed with a common consequence (89% chance of $10,000), it should be comparable to the isolated risk in D.
  - However, your friend's preferences change when the common consequence is present (in the first scenario) versus when it is absent or similar (in the second scenario).

  Her choices also imply a violation of **linearity in probabilities**, as she overweights small probabilities (like the 1% chance of nothing) in the context of a sure gain but underweights similar probability differences (like the 1% difference between C and D) when no sure gain is present.

  ### Why Each Choice Seems Defensible Alone
  - **First Choice (A over B):** This appeals to risk aversion. People often prefer sure gains when the alternative has a small chance of a bad outcome, especially for significant sums like $10,000. The 1% risk of nothing feels salient and "unlucky," making A emotionally safer.
  - **Second Choice (D over C):** This appeals to the high stakes and similar probabilities. When both options likely yield nothing, the extra 1% chance of winning with C (11% vs. 10%) seems negligible, while the potential $60,000 gain with D is compelling. This is common when people feel they have "nothing to lose."

  However, the joint inconsistency shows that these justifications are context-dependent and not based on stable preferences. In behavioral economics, this pattern is explained by prospect theory (Kahneman and Tversky, 1979), where people:
  - Overweight small probabilities (e.g., the 1% chance of nothing in B).
  - Evaluate outcomes relative to a reference point (e.g., the sure $10,000 in A as a gain, but nothing in C/D as a loss).
  - Exhibit different risk attitudes for gains versus losses (risk-averse for gains, risk-seeking for losses).

  ### Conclusion
  Yes, there is a genuine inconsistency in your friend's pair of choices, and it arises from violating the independence axiom of expected utility theory. She cannot hold both preferences while maintaining consistent, rational decision-making under uncertainty. The inconsistency lies in how she treats the common consequence (the high probability of $10,000 or nothing) across the two scenarios, leading to a reversal of preferences that EUT deems irrational.

  To resolve this, she might:
  1. Reconsider one of her choices (e.g., if she values consistency, she might switch to B in the first scenario or C in the second).
  2. Acknowledge that her preferences are context-dependent and not strictly rational, which is common and can be modeled with behavioral theories like prospect theory.

  Your unease is well-founded because the two choices, while individually intuitive, create a mathematical contradiction when analyzed together. This highlights how human decision-making often deviates from rational models in predictable ways. If your friend wants to explore this further, discussing the Allais paradox or prospect theory could provide deeper insights.
