  Which is:

  0.11 u(10,000) - 0.10 u(60,000) < 0.01 u(0)   [equation 2 simplified]

  Now, from equation 1, we have:

  0.11 u(10,000) > 0.10 u(60,000) + 0.01 u(0)

  Which implies:

  0.11 u(10,000) - 0.10 u(60,000) > 0.01 u(0)

