  The potential loss is 10k with prob 0.01, so expected loss avoided is 0.01 * 10,000 = 100.

  The potential gain is 50k with prob 0.10, expected gain 0.10 * 50,000 = 5,000.

  But she prefers to avoid the loss, even though expected gain is higher; that's risk aversion.

  Now in the second choice, C vs D.

  C: 10k with 0.11 prob, else 0.

  D: 60k with 0.10 prob, else 0.

