  The expected values are 1,100 vs 6,000, so D is much higher, so it makes sense.

  But let's see the inconsistency with the first choice.

  In the first choice, by choosing A over B, she is indicating that the certain 10k is better than a 10% chance of 60k minus a 1% chance of 0, but with the 89% same.

  I need to frame it in terms of utility.

  Assume she has a utility function u(x).

