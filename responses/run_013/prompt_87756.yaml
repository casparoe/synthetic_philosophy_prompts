  She prefers D, so:

  0.10 u(60,000) + 0.90 u(0) > 0.11 u(10,000) + 0.89 u(0)   [equation 2]

  Simplify equation 2:

  0.10 u(60,000) + 0.90 u(0) > 0.11 u(10,000) + 0.89 u(0)

