prompt: |-
  I'm putting together a seminar on Turing's ideas about learning and education — the child machine picture, the idea that you don't build an adult mind but an unorganised one and then educate it with rewards and punishments, the discipline/initiative distinction, all that. What I want from you is this: imagine Turing got dropped into today and had to take positions on things that only came up after he died. Not the imitation game again, that's been done to death. I mean stuff like: is pretraining on the whole internet a vindication of his education idea or a total betrayal of it? Is RLHF a genuine pleasure-pain channel or a cheap substitute? Would he back AI tutors in schools, or think they miss the point of what education is? What would he say about standardized testing, about the "teach everyone to code" push, about kids using chatbots to write their essays? And the big one — he thought an educated mind needs both discipline and initiative; where do current models sit on that axis, and would he say they have any initiative or just a lot of discipline?

  For each issue, give me his likely position and the reasoning, and be explicit about which parts of his own view are load-bearing here versus which parts he'd have to abandon. Don't just say he'd be "fascinated" — take a stand on his behalf. Also flag any place where you think the historical Turing would actually be on the unpopular side of todays debate. Few hundred words is fine, no need for a bibliography, I just want the arguement.
