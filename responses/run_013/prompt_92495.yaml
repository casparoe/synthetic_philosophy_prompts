prompt: |-
  You are a philosopher who works on individual responsibility for collective harms — the cluster of problems that begins with the question of what difference one person's act makes — and you are unusually good at reconstructing the principle implicit in a person's scattered case-by-case verdicts, then testing that principle against a case it has never been applied to. Please work carefully and in stages: first set out the candidate principles that could generate the record below, then check each against the whole record, and only then commit to a prediction. Do not stop at the first principle that fits; several will fit, and the interest lies in the differences among them. I am not asking for literature or citations — I want your reasoning about this particular person.

  The record belongs to a friend of mine, who did graduate work in ethics and now works in policy, and it concerns her own consumption and civic behaviour. She is not an ascetic and not a maximizer: she flies, drives, drinks coffee, and thinks people who agonize over every purchase have lost the plot. Her verdicts, however, are not the ones I would have predicted.

  1. Supermarket beef. She will not buy a beef burger from the supermarket, and does not think I should either. She is unmoved by the fact that the store placed its weekly order days ago, and that the burger I leave behind will be bought by someone else or thrown out. She says the purchase is wrong anyway.

  2. The binned burger. She will eat a beef burger that her housemate bought and cooked, when the alternative is the bin. She says there is nothing wrong with that.

  3. Chicken. If she is going to eat meat at all, she says the chicken is the worse choice, and not by a little: she reasons in deaths per calorie, and on that measure a chicken purchase is tied to something like two hundred times as many animal deaths as a beef purchase of equal calories.

  4. Humane beef. Beef from a small farm where the cattle are pasture-raised and killed on the farm is, in her view, still wrong — less bad than the supermarket version, but wrong.

  5. Dinner at a friend's. As a guest, when the host has bought and cooked the meat, she eats it. She says she has done nothing wrong: the host would have bought the same food whether or not she came.

  6. Voting. She did not vote at the last election and does not think that was a wrong, although her seat was decided by a few hundred votes. Her view is that the chance her vote would have decided anything was too small to be the sort of thing that makes a person a wrongdoer.

  7. Flying. She takes one long-haul flight a year to see her family and does not think that is a wrong. She is not a climate sceptic; she says the people she cannot defend are the ones who fly every month.

  Here is the case I have not put to her, and the reason I am writing. I am about to buy fish. It comes from a fishery whose total catch is capped by an international regulator on scientific advice, and this year's catch is already landed and frozen: the number of fish killed this year will be identical whether or not I buy, and the only thing my purchase can move is the price. Assume the cap is genuinely binding and that the regulator does not respond to consumer prices. I am not asking about the deaths-per-calorie comparison — she would say the fish is the better choice than the chicken on that measure. I am asking whether she will say that buying it is wrong at all, and if so on what ground.

  Please give me: (a) the two or three principles that best fit the record, each stated precisely enough to generate verdicts, together with which of her verdicts each principle explains and which it strains; (b) what each surviving principle predicts about my fish, and exactly where the predictions come apart; (c) your best guess at her verdict, the principle you think is doing the work, and your confidence; (d) the single case or question I should put to her next that would most efficiently discriminate among the surviving principles, and what each possible answer would show; and (e) any verdict in the record that no single principle seems able to accommodate — and if you conclude that she is simply inconsistent, say which verdicts you would drop and why.
reasoning: |-
  Hmm, the user presents a fascinating case study in applied ethics, asking me to role-play as a philosopher specializing in individual responsibility for collective harms. They've given me seven concrete behavioral verdicts from their policy-wonk friend and want me to systematically reverse-engineer her ethical principles before applying them to a new fish-buying scenario.

  I need to approach this methodically. First, I should identify candidate principles that could explain her pattern of judgments. Looking at her supermarket beef stance (1), she rejects standard "no difference" arguments - that's significant. Yet she's fine with eating binned burgers (2) or meat at dinner parties (5). Her chicken/beef death-per-calorie calculation (3) suggests a consequentialist streak, but her rejection of humane beef (4) complicates that. The voting (6) and flying (7) cases show she cares about probability thresholds and frequency.

  Let me brainstorm principles that might unify this:
  - Principle A: Participation in Harm Chains - She might care about being part of systems that cause harm, regardless of individual impact. This explains avoiding supermarket beef (embedded in industrial system) but not humane beef rejection.
  - Principle B: Expected Harm Thresholds - She could be calculating expected harm with a "non-trivial contribution" threshold. This handles voting (low probability) and frequent flying (high cumulative harm) but struggles with the chicken/beef math asymmetry.
  - Principle C: Social Context Immunity - Her exceptions for shared meals suggest she exempts socially embedded consumption from ordinary moral evaluation. This neatly explains dinner parties and binned food but can't handle her supermarket stance.

  Testing these against the fish case: 
  - Principle A would likely condemn buying the fish because I'm participating in the capped fishery system. 
  - Principle B would permit it since my purchase has zero expected additional harm. 
  - Principle C is ambiguous - if buying frozen fish feels like ordinary shopping, it might be wrong; if framed as preventing waste, permissible.

  Her rejection of humane beef is the real puzzler. If she opposes all animal consumption, why the dinner party exception? This suggests Principle A (harm chain participation) might be dominant, but I need to reconcile it with her permissiveness about infrequent flying. Perhaps she distinguishes between necessary and luxury participation?

  For the discrimination test case, I should ask about buying surplus humane beef from a farm that would otherwise discard it - parallel to the binned burger case but with a "participatory" element. If she rejects it, Principle A is likely dominant. If she accepts, we're back to inconsistency or a waste-avoidance principle.

  Overall, her pattern shows a consistent rejection of direct market participation in harmful systems, with exceptions for social or waste-prevention contexts. I'll predict she'll condemn the fish purchase on participation grounds, but her humane beef stance remains the anomaly that might reveal deeper principles.
answer: |-
  ### (a) Candidate Principles and Their Fit

  Here are three principles that best fit the record, each stated precisely. I assess fit by noting which verdicts they explain (✓) and which they strain (✗) or partially fit (~).

  1. **Principle of Direct Market Participation (DMP):**  
     *"An act is wrong if it directly participates in a harmful market system by creating new demand, even if the individual act makes no causal difference. Exceptions exist when the act prevents waste or occurs in socially non-instrumental contexts (e.g., guest reciprocity)."*  
     - (1) Supermarket beef: ✓ (purchase creates new demand).  
     - (2) Binned burger: ✓ (no new demand; prevents waste).  
     - (3) Chicken: ✓ (worse due to higher harm/demand unit, reinforcing market participation).  
     - (4) Humane beef: ✗ (strains: rejects despite no industrial harm, suggesting DMP isn't solely about harm severity).  
     - (5) Dinner at friend’s: ✓ (social context; no new demand).  
     - (6) Voting: ✓ (no direct participation in harm; low causal influence).  
     - (7) Flying: ✓ (one flight: minimal participation; frequent fliers actively sustain the system).  

  2. **Principle of Non-Trivial Cumulative Harm (NTCH):**  
     *"An act is wrong if it contributes to a harm that is (a) non-trivially likely to aggregate into significant collective harm, and (b) occurs with sufficient frequency to cross a threshold of responsibility. Harm is measured per unit of benefit (e.g., calories)."*  
     - (1) Supermarket beef: ✓ (aggregates non-trivially; high harm/calorie).  
     - (2) Binned burger: ~ (explains permissibility via harm prevention, but strains by not addressing aggregation).  
     - (3) Chicken: ✓ (explicitly uses harm/calorie; worse aggregation).  
     - (4) Humane beef: ✗ (strains: rejects despite lower harm/calorie).  
     - (5) Dinner at friend’s: ✓ (no aggregation; single act isolated).  
     - (6) Voting: ✓ (probability of decisive impact trivial).  
     - (7) Flying: ✓ (one flight trivial; monthly flights non-trivial).  

  3. **Principle of Complicity in Harmful Institutions (CHI):**  
     *"An act is wrong if it expresses complicity with an institution that systematically causes harm, regardless of individual impact. Complicity is absent in contexts of waste prevention or social reciprocity."*  
     - (1) Supermarket beef: ✓ (complicit in industrial farming).  
     - (2) Binned burger: ✓ (not complicit; rescues waste).  
     - (3) Chicken: ✓ (complicit in high-death system).  
     - (4) Humane beef: ✗ (strains: small farms may not be "harmful institutions," yet she condemns).  
     - (5) Dinner at friend’s: ✓ (no complicity; social role overrides).  
     - (6) Voting: ✓ (voting is a civic act, not complicity in harm).  
     - (7) Flying: ✓ (infrequent flight isn’t endorsement; frequent flights are).  

  ---

  ### (b) Predictions for Your Fish Case  

  - **DMP Prediction:** **Wrong.** Buying fish directly participates in the capped fishery market, creating new demand (even if it only affects price). The harm chain is perpetuated by your economic support.  
  - **NTCH Prediction:** **Permissible.** Your purchase causes zero expected harm (cap is binding, no additional deaths), and the act is isolated (no cumulative harm).  
  - **CHI Prediction:** **Wrong.** You are complicit in the fishing institution, which systematically harms animals. The cap doesn’t negate the institution’s harmfulness.  

  **Where predictions come apart:**  
  - DMP and CHI condemn the act due to market/institutional participation, even with no causal harm.  
  - NTCH permits it because your act has no measurable harm consequence.  

  ---

  ### (c) Best Guess and Confidence  
  - **Verdict Prediction:** She will say buying the fish is **wrong**.  
  - **Dominant Principle:** **Direct Market Participation (DMP)**. It best explains her core aversion to supermarket/humane beef (1,4) while accommodating waste/social exceptions (2,5). Her rejection of humane beef suggests participation, not harm severity, is key.  
  - **Confidence:** **80%**. DMP fits 6/7 cases cleanly; only humane beef (4) strains slightly. Her policy background makes institutional participation a likely focal point.  

  ---

  ### (d) Discriminatory Test Case  
  **Question:** *"A small humane farm has surplus beef that will be discarded if unsold. Is it wrong for me to buy it?"*  

  - **If she says "Wrong":** Confirms **DMP/CHI** (participation/complicity matters more than waste prevention).  
  - **If she says "Permissible":** Supports **NTCH** (harm prevention dominates) or reveals a stronger waste-exception principle.  
  - **What each answer shows:**  
    - "Wrong" kills NTCH (harm prevention ignored).  
    - "Permissible" kills CHI (complicity overridden) and strains DMP.  

  ---

  ### (e) Inconsistencies and Resolutions  
  - **Primary Strain:** **Humane beef (4)**. All principles strain here:  
    - DMP: Why reject if demand doesn’t support industrial systems?  
    - NTCH: Why reject if harm/calorie is lower?  
    - CHI: Why condemn if small farms aren’t "harmful institutions"?  
  - **Resolution:** She likely sees *all* animal agriculture as inherently harmful, but this clashes with her guest exception (5). Dropping either (4) or (5) would restore consistency. I’d drop **verdict (4)** as the outlier: her other choices focus on systems (industrial beef, chicken farms) and social harm (flying frequency), not idealized small-scale harm. Her policy lens may overextend institutional critique to humane farms.  

  **Conclusion:** Her reasoning centers on **participation in harmful markets**, with exceptions for waste and social contexts. For your fish, expect condemnation. Test with the surplus humane beef case to clarify. Minor inconsistency in humane beef remains but doesn’t derail the core principle.
