answer: |-
  It is a real honour to be standing here today, on this occasion which is so significant for everyone in this room. To those of you becoming citizens: welcome. To your families and friends: thank you for the support that brought them here. And to those presiding: thank you for stewarding this moment.

  Citizenship ceremonies are peculiar things. We gather to celebrate you joining this political community, to mark your formal membership. Yet, inherent in the very idea of *becoming* a member is the prior reality of not being one. We are acknowledging that you were, until now, outside, and are now stepping in. That simple fact invites questions we rarely pause to ask clearly.

  First, there is the question of what membership itself means. It is more than a certificate, more than a passport. It is about joining a shared project, a collective life shaped by history, argument, and aspiration. It means taking on obligations – to obey the laws, to contribute to the common good, to participate in the ongoing conversation about who we are and who we want to be. Crucially, it also means gaining standing – the right to have your voice heard, to shape that conversation, to demand that the institutions of this place serve you just as they serve others.

  Second, there is the separate question of the decisions that led individuals to this point today. Those decisions are often complex, involving specific rules and circumstances. They can be sources of relief, or, for some, memories of past struggle and disappointment. We rightly acknowledge the journeys that bring people here.

  But there is a third question, distinct from the others, that lies beneath them both. It is the question of authority: who has the right to decide who gets to attempt that journey in the first place? Who has the moral standing to draw a line and say, ‘You may not join us’? This is the difficult question that citizenship ceremonies quietly imply, yet rarely address directly. We gather to celebrate the crossing of a line whose very existence we take for granted.

  We often act as if that authority is simply given, an obvious fact of the world. But fundamental questions deserve more than assumption. The philosopher Michael Dummett, my teacher, spent much of his life challenging the idea that a state’s right to exclude people requires no justification. He argued that the demand to belong, to build a life in community with others, carries its own profound weight. The starting point for serious thought, he insisted, should not be the automatic right to keep people out, but the heavy burden of justifying why exclusion is ever necessary or permissible. The existence of a border, and its widespread acceptance, does not by itself settle the moral question; it demands reasoned defence, not passive acceptance. He held this view with the same intellectual rigour that he applied to understanding truth itself – resisting the notion that something is right merely because it is established.

  This isn’t about denying the reality or complexity of managing borders. It is about recognising that the power exercised at the border carries profound moral weight. It demands responsibility.

  So, what does this mean for today, in this hall? It means that while we celebrate your admission, we should not mistake it as a favour bestowed by gatekeepers whose authority goes unquestioned. Your presence here is a testament to your own determination and to the specific paths you navigated. But it is also a reminder that the structures governing such paths deserve constant, careful scrutiny – scrutiny based on the deep principle that the desire to belong, to contribute, to build a shared life, is a powerful moral force.

  And now you belong. You join this ongoing project of London, of Britain. The obligations you take on today are real: to learn its ways, to respect its laws, to engage with your neighbours. But your standing is equally real. You are not guests in someone else’s house. This is now your house too. You have not just gained duties; you have gained the fundamental right to be heard, to participate fully, to help shape this community.

  Therefore, as you become citizens, I urge you to embrace the responsibilities, but also to claim the rights. Demand that the institutions of this place serve you fairly. Demand that the society you join lives up to its own highest ideals of justice and inclusion. Demand your place, not just at the table, but in the conversation about what this table should be and who deserves a seat. Your voice, your perspective, your energy – these are now vital parts of the fabric of this nation. Use them well. Welcome, truly, to the work of building our shared home.
