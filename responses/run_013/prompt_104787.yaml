answer: |-
  Here's a structured audit of your four commitments, pairwise tensions, case analyses, and a recommended minimal revision for presentation. I'll follow your request to prioritize genuine tensions over apparent ones, rank them by severity, and prescribe targeted repairs.

  ---

  ### **Pairwise Tension Audit** (Ranked by Severity)
  1. **Highest Severity: (1) + (2)**  
     - **Tension**: Constitution-as-coincidence (1) requires *modal differences* to distinguish objects (e.g., lump survives melting, statue does not). But perdurantism (2) reduces persistence to temporal part-relations. Modal properties become problematic: If both statue and lump are 4D worms, the "survival" asymmetry must be explained by *structural features of the worms* (e.g., the statue-worm lacks temporal parts post-melting). Yet (1) frames modality as intrinsic to the *object*, not merely a feature of its temporal extent.  
     - **Cheapest Repair**: Modify (1) to **relativize modal properties to temporal parts**. The lump is modally flexible *because* its temporal parts include post-melting stages; the statue lacks such stages. This preserves asymmetry without smuggling in endurance.  
     - **Cost**: Concedes that modal properties are not primitive but derive from temporal structure. Loses some intuitive "thickness" of modality.

  2. **Moderate Severity: (1) + (3)**  
     - **Tension**: Coincidence (1) implies two objects (statue/lump) in one region, but restricted composition (3) denies objects like "left half of statue." This *isn't* inconsistent—(3) restricts *composition*, not coincidence—but it risks double standards. Why accept coincident objects but reject undetached parts? Both violate "no arbitrary objects" intuitions.  
     - **Cheapest Repair**: **Clarify that restriction applies to spatial/mereological parthood, not coincidence**. Coincident objects are distinct *wholes* (due to modal/functional differences), not arbitrary parts. Defend a principle like: "Objects exist only if they have *unified persistence conditions*."  
     - **Cost**: Must argue that statue/lump have unified conditions (e.g., functional unity for statues, material unity for lumps), while "left halves" do not.

  3. **Low Severity: (2) + (4)**  
     - **Tension**: Perdurantism (2) posits temporal parts, but grounding physicalism (4) demands all facts reduce to microphysics. Are temporal parts *additional ontological commitments* not grounded in physics?  
     - **Cheapest Repair**: **Reduce temporal parts to patterns in microphysical history**. The statue’s temporal parts are not *entities* but ways of describing microphysical stages.  
     - **Cost**: Risks collapsing perdurantism into a variant of exdurantism ("stage theory").

  4. **Apparent Tension (Not Genuine): (3) + (4)**  
     - **Concern**: Can restricted composition be physically grounded? Physics describes matter, not "unified objects."  
     - **Resolution**: Ground restriction in *causal unity* or *functional cohesion* supervening on microphysics (e.g., "statue" is a macro-pattern with stable causal role). No tension if (4) permits emergent structures.

  ---

  ### **Case Predictions & Consistency Check**
  1. **Recasting Case (Melting/Recasting)**  
     - **Prediction**: The lump is a 4D worm with temporal parts before, during, and after melting. The statue is a shorter worm ending at melting. Asymmetry arises from the statue-worm lacking post-melting parts.  
     - **Consistency?**: **Yes, but requires repair to (1)+(2)**. The modal difference ("survival") is reduced to temporal part structure. Without relativizing modality to worms, (2) cannot explain why the statue *ceases* rather than "survives deformed."

  2. **Eroded Rock Formation ("Natural Statue")**  
     - **Prediction**: **No statue exists** unless restriction (3) includes non-artifacts. Your commitments imply: (i) No maker → no functional kind to ground persistence conditions; (ii) Physics grounds only a rock, not a "statue-object."  
     - **Consistency?**: **Mostly consistent**, but exposes ambiguity in (3). If visitors call it a statue, is that sufficient for objecthood? To avoid smuggling intentions, **double down on (3)**: Only if erosion creates a *physically unified entity with statue-like persistence* (e.g., erosion-resistant "figure") could it qualify. Else, it’s just a rock.

  3. **Lump as Simultaneous Statue and Doorstop**  
     - **Prediction**: **Three coincident objects**: lump (material unity), statue (aesthetic function), doorstop (utility function). Each has distinct modal properties (e.g., destroying the doorstop’s function doesn’t destroy the lump).  
     - **Consistency?**: **Consistent but costly**. (1) permits multiple coincidents if they differ modally/functionally. But this strains (3): Why accept three objects but reject "lump-minus-doorstop-part"? **Not a reductio**, but pressures your restriction principle.

  ---

  ### **Recommended Minimal Revision for Presentation**
  **Core Position**:  
  *Constitution is non-identity, grounded in modally divergent persistence conditions. Objects perdure as spacetime worms individuated by their functional roles. Composition is restricted to unified causal structures grounded in microphysical behavior.*  

  **Key Revisions from Original Commitments**:  
  1. **Modify (1)**: Modal differences are not primitive but derive from *temporal part structure* (e.g., "The statue cannot survive melting" = "No statue-temporal parts exist post-melting").  
  2. **Sharpen (3)**: Restriction is defined by *causal-functional unity*: An object exists iff its temporal parts exhibit a stable, cohesive pattern of behavior grounded in physics (e.g., statues require aesthetic function, lumps require material integrity).  
  3. **Clarify (4)**: Temporal parts are not fundamental—they are patterns in the microphysical timeline.  

  **Why This Works**:  
  - Resolves the (1)+(2) tension by reducing modality to temporal extension.  
  - Blocks "natural statues" unless erosion produces *stable functional unity* (e.g., a rock that *functions* as a statue due to erosion-resistant structure).  
  - Accepts triple coincidence (lump/statue/doorstop) but denies arbitrary parts (e.g., "lump-minus-doorstop") by requiring causal unity.  
  - Grounds everything in physics: Functional roles (e.g., "being a statue") are emergent macro-properties.  

  **Costs Defended**:  
  - Modality is "thin" (derivative, not intrinsic).  
  - Coincident objects proliferate with functional diversity—but this is principled, not arbitrary.  

  **Presentation Opening Statement**:  
  *"I argue that constitution is non-identity: Coincident objects like statues and lumps are distinct 4D worms with divergent persistence conditions. These conditions arise from functional roles—grounded in physics—that define their temporal boundaries. Crucially, composition is restricted: Only entities with cohesive causal unity exist. Thus, while a lump may simultaneously be a statue and a doorstop (three worms, one matter), we avoid ontological bloat by excluding arbitrary fragments lacking unified behavior."*  

  This package holds under pressure, minimizes revisions, and offers clear targets for critique. Focus your talk on functional unity as the keystone—it resolves your worries while staying physicalist.
