  Then Commitment 6 (graded consciousness) conflicts with Commitment 2's binary requirement for consciousness (presence/absence of higher-order representation). How can degrees emerge from an all-or-nothing monitoring state? This threatens the theory's applicability to empirical cases of partial awareness.

  Commitment 5 (targetless HORs create no consciousness) appears consistent until combined with Commitment 6 - if consciousness comes in degrees, shouldn't targetless states show some faint phenomenology? But the user explicitly denies this.

  Commitment 3 (non-conceptual monitoring) actually resolves a potential tension by extending the theory to animals, so this is compatible with the framework despite surface-level concerns about "perceptual-style" states.

  For the severe tensions:
