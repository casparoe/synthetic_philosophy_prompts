  1. Heritability (h²) is strictly a population statistic about variance partitioning
  2. It cannot predict individual outcomes
  3. Between-group differences require separate analysis
  4. Measurement quality directly impacts h² estimates
  5. Environmental changes can alter h² estimates

  For disagreements, I'll structure a table with each camp's phrasing:
