  ### Activity Design: Platonia Dilemma and Luring Lottery

  **Goal:** Create a continuous, secret-decision activity where participants encounter the superrationality problem organically. No terminology (e.g., "Platonia," "Luring Lottery," "superrationality") is revealed until the debrief. 

  **Group Size:** 18 graduate students.  
  **Session Time:** 90 minutes.  
  **Payoff Scheme:** Points (no real money). Points can be redeemed for small rewards (e.g., candy, stickers, or extra credit) post-activity to incentivize engagement, but the focus is on the reasoning, not the payout.  
  **Key Constraints:**  
  - Ensure anonymity and prevent coordination.  
  - Decisions are made individually and secretly.  
  - Stage 1: Platonia setup (sole claimant wins; multiple or zero claims lose).  
  - Stage 2: Luring Lottery setup (pot divided by total entries; winner chosen randomly).  

  ---

  ### **Materials**
  - **18 envelopes** (one per participant), each containing:  
    - 2 blank slips of paper (for decisions).  
    - 1 unique anonymous ID card (e.g., a number 1–18; no names).  
    - A rules card for each stage (distributed sequentially).  
  - **A locked ballot box** for submission.  
  - **Whiteboard/flip chart** for public calculations (used only in Stage 2 reveal and debrief).  
  - **Random number generator** (e.g., dice, app, or numbered balls in a bag) for Stage 2 winner selection.  
  - **Timer**.  
  - **Point tracking sheet** (for facilitator only; not shared until debrief).  

  ---

  ### **Timeline (90 Minutes)**
  1. **Introduction (5 min)**  
  2. **Stage 1: Platonia Dilemma (20 min)**  
  3. **Stage 2: Luring Lottery (20 min)**  
  4. **Break (5 min)**  
  5. **Debrief (40 min)**  

  ---

  ### **Detailed Rules and Instructions**
  #### **Stage 1: Platonia Dilemma (20 min)**  
  **Objective:** Create a sole-claimant lottery. Participants decide anonymously whether to "claim" or "not claim."  
  **Rules:**  
  - If exactly one person submits a "claim," that person wins 100 points.  
  - If zero or multiple people claim, no one wins.  
  - Each participant decides alone—no discussion.  

  **Setup:**  
  1. **Distribute envelopes** (2 min): Each participant receives an envelope with their anonymous ID card, one blank slip, and the Stage 1 rules card.  
  2. **Explain rules** (3 min):  
     - "In this stage, you will make a private choice: either claim or not claim. Write 'claim' or 'not claim' on your slip. Do not write your name—use your ID. Submit your slip to the ballot box. The outcome depends on the group: if exactly one claim is submitted, that person wins 100 points. If no claims or multiple claims, no one wins."  
     - Emphasize: "Decide individually. Do not communicate with others."  
  3. **Decision and submission** (5 min): Participants write "claim" or "not claim" on their slip, seal it in their envelope with their ID, and drop it in the ballot box.  
  4. **Collection and reveal** (10 min):  
     - Facilitator opens envelopes, counts claims, and announces:  
       - "Total claims: [number]. Outcome: [Win with ID if one claim; loss if 0 or >1]."  
     - Do not reveal individual choices—only the total and outcome.  

  **Why this works:**  
  - Anonymity (via IDs and envelopes) prevents nomination or coordination.  
  - The 1-in-18 odds make spontaneous coordination unlikely.  
  - Predictable pitfall: Participants may overthink and all abstain (0 claims) or over-claim (2+ claims) due to distrust.  

  #### **Stage 2: Luring Lottery (20 min)**  
  **Objective:** Escalate to a pot-dilution lottery. Participants submit any number of entries (0+).  
  **Rules:**  
  - The pot is 1,800 points.  
  - Total entries (T) = sum of all submitted entries.  
  - Prize per winner = 1,800 / T (rounded to nearest integer).  
  - One entry is drawn randomly; its owner wins the prize.  
  - Each participant can submit any integer of entries (0 to 100).  

  **Setup:**  
  1. **Transition** (2 min): Collect Stage 1 materials. Distribute new blank slips and Stage 2 rules cards via envelopes.  
  2. **Explain rules** (5 min):  
     - "In this stage, submit any whole number of entries (e.g., 0, 1, 5, or 100). Write your ID and number of entries on your slip. The pot is 1,800 points. After all submissions, we will:  
       1. Calculate total entries (T).  
       2. Divide the pot by T to get the prize amount.  
       3. Randomly draw one entry—the owner wins that prize."  
     - Example: "If T = 100, the prize is 18 points. If your entry is drawn, you win 18 points."  
  3. **Decision and submission** (5 min): Participants write their ID and number of entries, seal in envelopes, and submit to the ballot box.  
  4. **Collection and reveal** (8 min):  
     - Facilitator calculates T, then prize = round(1,800 / T).  
     - Use a random number generator (1 to T) to draw the winning entry.  
     - Announce: "Total entries: [T]. Prize per winner: [prize]. Winner: ID [number]."  

  **Why this works:**  
  - Forces participants to balance self-interest (more entries = higher win chance) against dilution (more entries = smaller prize).  
  - Predictable pitfall: Participants "overbid" (high entries) to outcompete others, driving T up and prize down.  

  ---

  ### **Debrief (40 min)**  
  **Goal:** Map experiences to decision theory, introduce superrationality, and discuss limitations. Do not use historical details (e.g., Hofstadter).  

  #### **Structure**  
  1. **Outcome Recap (5 min)**  
     - Reveal Stage 1: "Total claims: [number]. Why did we get [0/2+] claims? What were your thoughts?"  
     - Reveal Stage 2: "Total entries: [T]. Prize: [prize]. How did you choose your entry count?"  
     - Solicit raw reactions: "What felt frustrating or surprising?"  

  2. **Introduce Concepts (10 min)**  
     - Name the games: "Stage 1 was the Platonia Dilemma; Stage 2 was the Luring Lottery."  
     - Define the core problem:  
       - **Traditional rationality**: Maximize expected payoff given others' behavior.  
         - Platonia: "If I expect others to not claim, I should claim. But if I claim, others might too."  
         - Luring: "If I expect low entries, I submit more to win big. But if all do this, the prize shrinks."  
       - **Superrationality**: Maximize assuming all use identical reasoning.  
         - Platonia: "If all randomize with p = 1/18, we maximize the chance of one claim (~37%)."  
         - Luring: "If all submit 1 entry, prize = 1,800/18 = 100 points. But if I submit 2, I might get more—until everyone does it, and prize drops to 50 points."  
     - Emphasize: Superrationality is not causal—it assumes symmetry, not influence.  

  3. **Analyze Reasoning (10 min)**  
     - **Platonia**:  
       - Why the "recommended play" is a lottery: "Firm decisions fail (0 or 2+ claims). Randomizing p = 1/18 balances the group's odds."  
       - Objection: "Magical thinking! Why assume others reason like me?"  
       - Reply: "No causation—it's about identical agents in symmetric problems. If all are rational in the same way, we coordinate on a shared 'focal point.'"  
     - **Luring**:  
       - "Stage 2 escalated by allowing bids. The 'individually best' move (outbidding others) led to a race where everyone bids high, the pot dilutes, and expected payoff plummets. Superrationality asks: 'What if we all choose the same k?'"  
       - Show the math: Expected payoff = (k / T) × (1,800 / T). If all submit k, T = 18k, payoff = 100/k. Best symmetric k is 1 (100 points), but individual incentive is to bid >1.  

  4. **Objections and Limitations (10 min)**  
     - **Objection to superrationality**: "It assumes everyone reasons identically—unrealistic!"  
       - Reply: "True, but in symmetric problems (like these), it highlights coordination failures. It’s a tool for finding equilibria where all players 'mirror' each other."  
     - **Activity limitations**:  
       - No genuine anonymity: "You knew you were in a room of 18 peers, which influenced guesses about others' behavior (e.g., 'X always takes risks'). Real Platonia/Luring relies on total anonymity and uniform incentives."  
       - Small group size: "With 18, outcomes are noisy. Original contests had thousands of isolated participants, making symmetry more plausible."  
       - Human diversity: "Not all reason identically! Some 'defect' due to past knowledge or risk aversion."  
     - **Predictable pitfalls**:  
       - Stage 1: "If half remember the puzzle, they might all 'defect' (abstain) to avoid a loss, causing 0 claims—or a few claim, causing 2+."  
       - Stage 2: "Even if some recall the Luring Lottery, they may overbid to 'win big,' ignoring dilution. Others submit 0 to freeload, lowering T and increasing prizes for active bidders."  
       - Handling: "Use these as teaching moments—e.g., 'Why did we see defection? How did it change outcomes?'"  

  5. **Q&A and Conclusion (5 min)**  
     - Open floor for questions.  
     - Summarize: "These games expose the tension between individual incentives and group outcomes. Superrationality isn't a solution—it's a lens for symmetry."  

  ---

  ### **Predictable Problems and Mitigations**  
  - **Stage 1 failure (0 or 2+ claims)**:  
    - Likely, as spontaneous coordination is near-impossible.  
    - **Mitigation**: Highlight in debrief: "This is typical! Without communication, humans default to pessimism (abstain) or optimism (over-claim)."  

  - **Stage 2 arms race (high T, low prize)**:  
    - Participants may "overbid" due to game theory experience or competitiveness.  
    - **Mitigation**: In debrief, show the math: "If all bid 1, prize = 100. If all bid 10, prize = 10. Self-interest destroys value."  

  - **Anonymity breaches**:  
    - Participants might peek or whisper.  
    - **Mitigation**: Strictly enforce "no communication" and use sealed envelopes.  

  - **Half-remembered puzzles**:  
    - Some may defect (e.g., Stage 1: abstain; Stage 2: bid 0 or 100).  
    - **Mitigation**: "Lean into it—ask defectors: 'Why did you break symmetry?' in debrief."  

  ### **What the Activity Cannot Reproduce**  
  1. **True anonymity and uniformity**: In a real contest, participants are unknown, isolated, and identically motivated (e.g., readers of a magazine column). Here, group dynamics and personal biases distort symmetry.  
  2. **Scale effects**: With 18, sampling error dominates. With thousands, aggregate behavior stabilizes.  
  3. **No room effects**: Real participants don’t see peers—here, physical presence influences decisions (e.g., "I trust economists to bid high").  

  This design forces participants to confront the superrationality trap experientially. The debrief links their frustrations to theory, preparing them for deeper discussion.
