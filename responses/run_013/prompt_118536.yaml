  In Stage 2, how did you choose your number of entries? [Solicit responses]

  These two games are known as the Platonia dilemma and the Luring Lottery. They illustrate a concept called 'superrationality'. In traditional game theory, you choose your best response given your prediction of others' behavior. In superrationality, you assume that everyone is identical and will reason the same way, so you choose the action that, if everyone does it, leads to the best outcome for everyone, and you assume everyone will do that.

  In Stage 1 (Platonia), the superrational solution is to randomize with probability 1/n, where n is the number of players. Here, 1/18. This maximizes the probability that exactly one person claims.

  In Stage 2 (Luring Lottery), the superrational solution might be to submit 0 entries because if everyone submits the same positive number, then your expected winnings are the same as if you all submit 0 (which is 0), but by submitting more you incur no cost but also don't improve your expected winnings? Or is there a positive number that is better? Actually, the expected winnings in the symmetric case if everyone submits k is (k * P) / (n*k)^2 = P/(n^2 * k). This decreases as k increases, so the best is to submit the minimum, which is 0. But then no one wins.

  However, if they all submit 1, then expected winnings are (1 * P) / (n^2). If they all submit 0, then 0. So they might prefer to submit 1. But then if you submit 2, your expected winnings are 2 * P / (n+1)^2? Wait, no: if everyone else submits 1, then T = (n-1)*1 + 2 = n+1. Your expected winnings = 2 * P / (n+1)^2. Compare to if you submit 1: 1 * P / (n)^2. For n=18, 2/(19^2) = 2/361 ≈ 0.0055P, vs 1/324 ≈ 0.0031P. So it's better to submit 2. This leads to an increase until they submit more and more.

  But then the expected winnings per player in the asymmetric case might be less than if they could coordinate on a small number.

  The key is that without coordination, they are driven to submit more and more, reducing the prize per entry.

  Now, the objection to superrationality: is it magical to think that by changing your own action, you cause others to change? The reply is that superrationality does not assume causation; it assumes that all players are identical and will independently arrive at the same action.

  Finally, this activity has limitations. In a real-world setting with many anonymous participants, the symmetry of the situation is more compelling. Here, you know each other and might have different ideas. Also, the fact that you are in the same room might have influenced your decisions.

  We will now open for questions."

