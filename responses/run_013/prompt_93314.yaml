  Final assessment: The vanishing residues reveal law's unique constraints - it's not that semantics is deficient, but that legal interpretation is fundamentally a normative project wearing semantic clothing. The "disagreement" masks deeper institutional questions about who gets to decide meaning.
answer: |-
  Here’s a rigorous mapping of the textualism-purposivism dispute onto post-Gricean semantics/pragmatics, followed by a residue analysis:

  ### Core Dispute Mapped
  1. **Textualism** → Prioritizes **sentence meaning** (conventional meaning of words/syntax) + **minimal semantic content** (contextual enrichment only for resolving indexicals, ambiguity, or saturation). What is *said* by the text, derived compositionally, is binding. Legislative history is treated as evidence of *conversational implicature* (non-binding) or excluded entirely.

  2. **Purposivism** → Prioritizes **speaker meaning** (collective legislative intent) as the determinative factor. The enacted text is a vehicle for conveying this intent; its meaning includes **contextually enriched content** (incorporating legislative aims) and may override literal meaning via **what is implicated** (e.g., purpose-driven implicatures). Legislative history is direct evidence of speaker meaning.

  ### Residues Mapped & Analyzed
  #### 1. Collective Legislative Intent
  - **Clean Map**: None. Gricean frameworks assume a unitary speaker with recoverable intentions. Legislatures lack a singular "speaker"; intent is an aggregation/fiction.
  - **Distorted Map**: Analogizing to **multiparty discourse** (Clark 1996) or **group agency** (List & Pettit). Requires stretching "speaker meaning" to *hypothetical rational collective intent*—a construct, not recovered via Gricean reasoning.
  - **Unmappable**: The *procedural generation* of legislative intent (committee reports, voting coalitions, logrolling) has no correlate in individual speaker-hearer dynamics. No mechanism for "recovering" intent from fragmented, strategic actions.

  #### 2. Normative Authority
  - **Clean Map**: None. Semantics/pragmatics describes *how* meaning arises, not why it *should* bind. Authority stems from institutional facts (e.g., Hartian rules of recognition).
  - **Distorted Map**: **Common ground accommodation** (Lewis 1979) or **Stalnakerian presupposition**—courts "accept" the statute’s content into the legal common ground. Distortion: accommodation is typically voluntary; legal authority is obligatory.
  - **Unmappable**: The *obligation* to obey the text/intent. This is a **deontic norm**, not a semantic feature. Pragmatics explains comprehension, not compliance.

  #### 3. Temporal Dynamics (Precedent/Amendments)
  - **Clean Map**: **Common ground updates**. Prior judicial interpretations become **presuppositions**; amendments trigger **accommodation** to reset context.
  - **Distorted Map**: Later interpretations as **conversational implicatures** of the original text (e.g., SCOTUS "implicating" new meanings). Distortion: Implicatures are defeasible inferences, not precedential *rules*.
  - **Unmappable**: **Intergenerational authorship**. Amendments create layered texts with no unified speaker. No model for "speaker meaning" when "speakers" (legislatures across time) have conflicting purposes.

  #### 4. Absurdity Canon
  - **Clean Map**: **Pragmatic override** of literal meaning via **conversational implicature** (avoiding absurd outcomes as a cooperative principle). 
  - **Distorted Map**: Absurdity avoidance as **presupposition repair** (von Fintel 2008)—interpreting "as if" the legislature presupposed rationality. Distortion: Legal absurdity invokes *normative* rationality (e.g., justice), not just communicative rationality.
  - **Unmappable**: When courts invoke absurdity to *contradict* clear semantic content (e.g., *Holy Trinity*). This is legislative *correction*, not interpretation—exceeding pragmatic adjustment.

  ---

  ### Residue Report
  #### Survives Translation Intact
  - **Textualism’s core claim**: Sentence meaning (conventional content + minimal enrichment) is objectively recoverable and distinct from subjective intent.  
  - **Purposivism’s core claim**: Speaker meaning can override semantic content when context (e.g., legislative history) strongly implicates intent.  
  - **Absurdity as pragmatic adjustment**: Fits conversational implicature or presupposition repair frameworks.

  #### Subtly Altered by Translation
  - **Legislative history as evidence**: In Gricean terms, it’s *hearsay* about speaker meaning—not direct evidence. Purposivism treats it as transparent; semantics sees it as fallible.  
  - **"Purpose" as enrichment**: Purposivist "purpose" maps to *contextually enriched content* but is distorted by collective intent problems.  
  - **Precedent as common ground**: Survives translation but obscures precedent’s *normative force* (stare decisis isn’t just shared belief; it’s a binding constraint).

  #### Vanishes Entirely
  1. **Collective Intent as Recoverable**: Gricean speaker meaning *cannot* model multiparty, strategic, diachronic legislative "intent" without fiction.  
  2. **Authority of the Text/Intent**: Why courts *must* obey either is outside semantics—it’s institutional/normative.  
  3. **Intergenerational Authority**: Later legislatures/courts altering meaning has no parallel in speaker-hearer dynamics.  
  4. **Absurdity as a Normative Override**: When absurdity trumps clear semantic content, it’s a *legal* (not linguistic) principle.

  ---

  ### Assessment: The Vanishing Residues
  The vanishing residues reveal **genuine gaps in semantic/pragmatic frameworks** relative to legal theory, not merely illusory disagreements:
  - **What’s Missing in Semantics/Pragmatics**:  
    - Tools to model *institutional*, *diachronic*, and *obligatory* dimensions of meaning.  
    - A theory of *collective intentionality* that isn’t reducible to individual mental states.  
    - The *normativity of authority*—why meaning *binds* interpreters.

  - **What’s Illusory in Legal Theory**:  
    - **Textualists** falsely imply sentence meaning is "objective" without institutional context (e.g., legal terms of art presuppose common ground).  
    - **Purposivists** treat legislative history as transparent "evidence of intent," ignoring its strategic curation and lack of Gricean cooperativity.  
    - **Both** overstate the determinacy of their methods. The residues prove that legal interpretation is fundamentally an *institutional practice* deploying semantic tools, not a pure exercise in linguistic analysis.

  **Conclusion**: The semantic/pragmatic framework exposes the *conceptual fragility* of both textualism and purposivism. Their core disagreement survives translation, but the residues show that legal meaning is **institutionally constructed and normatively constrained**—a layer beyond linguistic meaning. The "disagreement" is substantive but relies on unstated premises about authority that semantics cannot resolve. Legal theorists are tracking real phenomena (collective will, obligation, temporal authority), but they often misdescribe them using semantic vocabulary. The vanishing parts aren’t defects in semantics; they reveal law’s irreducible institutional nature.
