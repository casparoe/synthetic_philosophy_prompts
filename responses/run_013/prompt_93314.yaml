  For residue 2 (normativity): Semantics describes content; law prescribes obedience. That gap can't be bridged by Stalnakerian common ground alone - it's about institutional power. 
  For residue 3 (temporal dynamics): Precedent and amendments make legal meaning diachronic in ways that challenge static context-set models. Accommodation works differently when "repairing" legislative gaps. 
  For residue 4 (absurdity): This feels like a clash between semantic content and pragmatic consequences - but courts aren't just inferring implicatures; they're exercising delegated normative power. 

  *checks theoretical toolkit* 
