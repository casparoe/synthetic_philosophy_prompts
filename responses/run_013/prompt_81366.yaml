prompt: |-
  I'm redoing my social ontology lecture and I keep getting stuck on generations, so I want a real number from you, not a tour of the literature. Take the claim that a label like "Gen Z" or "Millennial" picks out a real kind — meaning (i) there's a fact of the matter about who's in it and who isn't, and (ii) its members share something explanatory that isn't just an artifact of where we happened to draw the birth-year lines. What's your credence in that, decomposed?

  Mine is about 0.25. I'd split it roughly into: how much of what gets called a "generation effect" is actually an age effect or a period effect in disguise (everyone gets more conservative as they age, or 2020 messed with everyone regardless of birth year); whether the boundaries are robust, i.e. if you slid the Gen Z cutoff back four years would the interesting claims survive; whether the shared traits form a causally unified package or just a grab bag of correlations, since a kind has to do more than correlate; and whether social kinds even need to be natural kinds, or whether "real" here just means "useful for prediction," which makes the whole thing easier to get.

  Give me your number with a rough probability for each of those terms and how they combine, tell me which term you're least sure about, and say what would actually move it — like what a study would have to show for you to go to 0.6. And if a collegue of mine insists on 0.8 while I'm at 0.25, where do you think we're really disagreeing?
