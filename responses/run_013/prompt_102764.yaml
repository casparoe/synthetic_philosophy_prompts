answer: |-
  Based on your vivid description, your core puzzle concerns the **organic, decentralized, post-invention process** where a recent fabrication, through ordinary social transmission and repetition, rapidly acquires perceived antiquity and authenticity *without* deliberate deception or central authority. Existing concepts touch on aspects but don't precisely capture this distinct mechanism. Let's carve it out.

  **Brainstorming Candidate Concepts & Their Shortcomings:**

  1.  **Invented Tradition (Hobsbawm & Ranger):** *Directly addresses the initial fabrication.* But it focuses heavily on the *intentional act of creation* (often by elites/institutions for nation-building/social control) and the *function* of establishing continuity/legitimacy. It doesn't adequately theorize the *internal, psychological, and social mechanisms* by which the *sense* of genuine antiquity develops *organically* within a community *after* the invention, especially when the origin wasn't hidden.
  2.  **Imagined Community (Anderson):** Explains how large groups cohere around shared symbols and narratives, *including* constructed traditions. But it's a macro-concept about social cohesion and belonging, not the specific micro-process of how *temporal depth* is retroactively attributed to a specific practice through transmission.
  3.  **Collective Memory (Halbwachs):** Essential framework. Your case involves how the past is reconstructed in the present. However, "collective memory" is broad. It needs refinement to pinpoint the *specific mechanism* of *rapid temporal distortion* for recent inventions.
  4.  **Social Construction of Reality (Berger & Luckmann):** Underpins everything – traditions *are* socially constructed. But it's too general. We need the specific dynamics of *temporal* construction in this context.
  5.  **Mnemonic Generation (Assmann):** Refers to how the past is actively produced in the present. Close, but doesn't specify the *unintended aging effect* of simple repetition and transmission on *known* recent origins.
  6.  **Traditionary Process (Shils):** Emphasizes tradition as an ongoing process of transmission. Implies change, but doesn't focus on the *systematic retro-dating* and acquisition of perceived antiquity.
  7.  **Semantic Drift/Concept Creep:** Useful analogy. The *meaning* and *perceived age* of the practice "drifts" over time through use, losing its connection to its recent origin context. But it's not a standard term for this temporal phenomenon.
  8.  **Feedback Loop of Authenticity:** Descriptive, but not an established term. Highlights the self-reinforcing nature ("We do it because it's old; it feels old because we do it faithfully").

  **The Gap & The Coinage:**

  Your case reveals a distinct process: **The rapid, emergent, and sincere acquisition of perceived historical depth by a recently invented practice, solely through the mundane acts of communal repetition, transmission, and narrative elaboration, leading to its genuine embedding as "authentic tradition" within the lifeworld of a group.**

  **Coined Term: Mnemonic Drift**

  **Definition:** Mnemonic Drift is the socio-cognitive process whereby the perceived historical origin point of a cultural practice, symbol, or narrative gradually recedes further into the past through ordinary acts of communal transmission and performance, despite known or knowable recent origins. This drift occurs organically, without central orchestration, driven by:
  *   **Repetition & Habitualization:** The sheer act of doing something regularly imbues it with a sense of permanence and "the way it's always been."
  *   **Narrative Entropy:** Details of the specific, recent origin context fade or are omitted in retelling. The "why" (a 1950s competition) gets lost, leaving only the "what" (the bonfire) and the *assumed* "why" (ancient custom).
  *   **Projection of Continuity:** Humans have a cognitive bias to perceive stability and continuity. Filling a present practice (the bonfire) with assumed past significance satisfies this need.
  *   **Authentication through Performance:** Faithfully transmitting and defending the practice *as if* it were ancient becomes proof *of* its antiquity ("We do it exactly like this *because* it's ancient").
  *   **Telescoping:** Each generation, transmitting it to the next, implicitly or explicitly adds a layer of temporal depth ("My grandparents did it, and *their* grandparents...").
  *   **Loss of Counter-Memory:** The generation that knew the invention dies off; subsequent generations encounter the practice only as an established part of their cultural landscape.

  **Distinguishing Mnemonic Drift from Nearest Concepts:**

  1.  **Invented Tradition:**
      *   *Boundary:* Invented Tradition focuses on the *act of creation* and its *intended function*. Mnemonic Drift focuses on the *subsequent, unintended process* of *temporal perception shift* through organic transmission *after* the invention (deliberate or accidental).
      *   *Overlap:* An Invented Tradition *undergoes* Mnemonic Drift to become genuinely embedded.
  2.  **Collective Memory:**
      *   *Boundary:* Collective Memory is the broader field. Mnemonic Drift is a *specific mechanism* operating *within* collective memory, explaining *how* recent events/practices rapidly acquire perceived antiquity.
      *   *Overlap:* Mnemonic Drift is a form of collective memory distortion focused on temporal depth.
  3.  **Mythmaking/Legend Formation:**
      *   *Boundary:* Often involves conscious elaboration, heroic figures, supernatural elements, or deliberate distortion. Mnemonic Drift is more banal, arising from forgetfulness, habitualization, and the projection of continuity onto mundane practices. It's less about creating a *story* and more about the *unspoken temporal assumption* hardening.
      *   *Overlap:* Mnemonic Drift can *lead* to mythmaking (e.g., retro-dating the bonfire to pagan times).
  4.  **Fabrication/Fraud:**
      *   *Boundary:* Involves *deliberate deception* at inception or during transmission. Mnemonic Drift occurs *without* active deceit; participants are sincere *believers* in the tradition's age, even if vaguely aware it "started a while back." The drift happens despite, not because of, potential knowledge.
  5.  **Adaptive Reuse/Neo-Traditionalism:**
      *   *Boundary:* These often involve a *conscious* revival, modification, or application of *old* elements in new contexts. Mnemonic Drift applies to things *known* (or knowable) to be *new* at their core, which then *acquire* perceived age.

  **Cases at the Edge:**

  *   **The "Almost Remembered" Origin:** If some elders vaguely recall the newspaper competition but downplay it ("Oh, that just formalized what people *wanted* to do anyway"), Mnemonic Drift is still active, incorporating the origin as a minor footnote within a larger, assumed ancient framework.
  *   **Consciously Embraced "New Tradition":** If a community explicitly celebrates something *as* a recent invention (e.g., "Our town's modern bonfire tradition, started in 1953!"), Mnemonic Drift is *resisted*. The boundary is crossed when the qualifier ("modern," "started in...") is dropped or forgotten.
  *   **Commercial Origins:** A local festival genuinely started by the Chamber of Commerce in the 1980s for tourism, which townsfolk now sincerely believe has "always been part of our heritage," demonstrates Mnemonic Drift. The commercial origin is forgotten or reframed.
  *   **The Accidental "Tradition":** Something that arose spontaneously (not via a competition) and quickly became repeated annually (e.g., placing a specific ornament on the town square tree one year, then every year). Mnemonic Drift rapidly sets in, turning the spontaneous act into "what we always do at Christmas."

  **The Carving:**

  Your town's bonfire, recipe, and dialect word exemplify **Mnemonic Drift**. The process isn't about the initial lie (the newspaper contest wasn't presented as uncovering an ancient rite), nor is it primarily about social control (though it can serve cohesion). It's about the remarkable alchemy of time perception within a community. Through the simple, sincere acts of *doing*, *retelling*, and *passing on*, the recent past dissolves. The practice accumulates an aura of age simply by being present in the chain of transmission. The origin point fades, not through conspiracy, but through the gentle erosion of specific memory by the constant flow of communal practice. The "oldness" emerges *from* the faithful transmission itself, a genuine feeling of authenticity born paradoxically from the very act of keeping something new alive. It's the communal equivalent of "This old thing? I've had it forever," said about a jacket bought last year but worn constantly. The feeling of antiquity is real *to the wearer*, born of use, not chronology. That's Mnemonic Drift.
