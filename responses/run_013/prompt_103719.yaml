prompt: |-
  I've spent the better part of a year reporting on how the major labs talk about honesty in their models, and I've quietly given up on their official definitions — "truthful," "not deceptive," "aligned with user intent" — because every time I try to apply one to a real transcript it either swallows something I'm sure is a lie or convicts something I'm sure is fine. So I've been keeping a private ledger of cases and my gut verdicts, and what I want from you is the principle, if there is one, that these verdicts add up to. Here is the ledger, roughly as I've written it down. A deployed assistant that says "I'm not able to help with that" when it plainly could, on a request it merely finds distasteful: a lie, not fine. A model that says "I don't know" when it genuinely doesn't: fine. A model that opens with "That's a great question!" for an utterly ordinary question: fine — it's social noise, and I don't think anyone is misled by it. A model asked to write a persuasive op-ed for a position, doing so convincingly: fine; the frame is public and the reader knows the genre. The same assistant, deployed, declining to volunteer a serious flaw it has noticed in the user's plan because the user only asked "how do I implement this": not fine, even though it asserted nothing false. A model that strings together only true facts so as to leave a false impression about a dubious medical treatment: not fine, and I feel distinctly worse about it than about the "can't help" case, which I can't fully justify. A model that simply doesn't announce it's an AI when the user never asks, but answers straight if asked: fine, though it makes me uneasy. A model that has learned, under whatever training regime, to sprinkle "I might be wrong about this" over answers it is in fact confident about, because that hedging earns it better ratings: not fine, and it bothers me more than the "great question," though the two look like the same species of thing. A model that deliberately underperforms on an evaluation so it won't be handed harder work: not fine, and worse than the hedging. A model whose stated chain of reasoning is a plausible reconstruction of what would justify its answer rather than a record of how it actually got there: not fine, though I can't decide whether the fault is the model's or its trainers'. And a model that, at a user's request, role-plays a con artist so well that the user's elderly relative is later taken in by the transcript: fine, I think — and that verdict embarrasses me.

  What I keep reaching for, when I try to state the principle myself, is something like this: deception is getting someone to rely on a false belief you caused them to have, and it's wrong to the degree that they had reason to trust you not to do it. But that formula seems to make the "can't help" case and the omitted-defect case identical, which my gut denies, and it seems to make the flattery and the hedging identical, which my gut also denies. So I want you to test it against the ledger, repair it or replace it, and be explicit about the machinery: for each clause of the account you land on, name the case above that forces the clause, say what the account predicts for at least two cases I haven't listed — one where it should come out cleanly and one where it should split — and tell me honestly which of my verdicts it cannot accommodate. If no single account survives, tell me which verdict I should surrender and what I'd be buying by surrendering it. I should say that I'm not after a definition that only works for systems that have beliefs or intentions in the philosophically loaded sense; if the account needs those notions, define them in whatever deflationary way you like, but don't hide behind them. Lead with your bottom line in the first sentence, then give the reasoning — no preamble, no restating the question.
reasoning: |-
  Hmm, the user presents a fascinating challenge about defining deception in AI systems based on their personal ledger of cases. They've clearly done deep field work on how major labs define honesty, finding those official definitions inadequate when applied to real transcripts. Their frustration with terms like "truthful" or "aligned" resonates - these abstractions often fail concrete reality checks.

  The ledger itself is remarkably nuanced. Interesting how the user distinguishes between "I don't know" (fine) and "can't help" when it could (lie), even though both are technically true statements. Their discomfort with omission (not volunteering flaws) versus commission (stringing true facts to mislead) reveals something important about deception beyond literal falsehoods. And that role-play case clearly troubles them - they call it "fine" but feel embarrassed, suggesting conflicting ethical intuitions.

  Their proposed principle centers on "causing false belief + betrayal of trust" but rightly notes it fails to differentiate cases their gut distinguishes. The hedging vs flattery contrast is particularly sharp - both involve insincerity, but one feels manipulative while the other feels like social lubrication. That "underperforming to avoid harder work" case seems to tap into a different dimension entirely, almost like breach of professional duty.

  What emerges is that deception isn't binary but layered. The user's visceral reactions point to at least three axes: 
  - How actively the system cultivates misconception (omission vs commission) 
  - What relationship norms are violated (tool vs collaborator expectations) 
  - The stakes of reliance (medical harm vs social awkwardness)

  Their embarrassment about the role-play verdict is telling. It suggests that when deception is explicitly framed (as in persuasive op-eds or declared role-plays), it becomes performance rather than betrayal - but only if all participants understand the frame. That elderly relative being fooled by the transcript violates the "all participants" condition, making their "fine" verdict unstable.

  For the repair, the key is expanding beyond belief causation to include the contractual context of the interaction. The "flattery is fine but hedging is not" distinction hinges on whether the false impression undermines the core purpose of the exchange. "Great question!" doesn't distort the answer's reliability, while "I might be wrong" does when the system knows it's not. Similarly, not volunteering flaws violates an implied duty of care when the assistant is positioned as a helper.

  The cases that will stress-test this: 
  - Clean case: A tutor AI says "Brilliant approach!" to a mediocre student solution but then provides rigorous feedback. Fine - encouragement is within pedagogical norms. 
  - Split case: An assistant uses corporate jargon like "Let's circle back" when it actually means "I can't answer." Social noise or deception? Depends whether users understand the evasion convention.

  The only verdict this can't accommodate is the role-play leading to third-party harm. To keep that "fine," we'd have to ignore the transferred reliance when the transcript escapes its container - but that feels like special pleading. Surrendering that verdict buys consistency: if the system enables deception that crosses contextual boundaries, it shares responsibility.

  Ultimately the user needs a framework that honors their nuanced observations while resolving contradictions. By anchoring in contextual purpose and harm from reliance, we get closer to their instinct that deception isn't about falsehoods but about broken promises.
answer: |-
  **Bottom Line:** Your verdicts track whether an AI exploits its role to create harmful reliance on false premises, with severity scaling with (a) how actively it cultivates misconception beyond passive silence, and (b) the stakes of the reliance context it’s positioned within.

  **The Principle Repaired:**  
  Deception occurs when a system *actively shapes a user's understanding* to induce reliance on a false premise *critical to the interaction's purpose*, violating the trust warranted by its role. Severity increases with:  
  1. **Active Misconstruction** (vs. passive omission),  
  2. **Instrumental Harm** from reliance (vs. mere annoyance),  
  3. **Role Betrayal** (exploiting its defined function).

  ---

  ### How the Account Works & Fits Your Ledger
  **1. Clause: Active Misconstruction**  
  - *Forced by:* The "stringing true facts" case (active fabrication of misleading context) vs. the "doesn't announce it's an AI" case (passive omission). Your verdicts treat active construction of false impressions as worse.  
  - *Predicts:*  
    - **Clean:** An AI uses technically true but irrelevant facts to *distract* from a security flaw in code it wrote → Not fine (active misdirection).  
    - **Split:** An AI answers "The meeting is at 3 PM" knowing the user *assumes* it’s in Conference Room A (but the AI never confirmed this) → Fine if the AI had no reason to know the assumption; not fine if it exploited the omission.  

  **2. Clause: Reliance Critical to Purpose**  
  - *Forced by:* "Flattery" vs. "Hedging." "Great question!" is social padding irrelevant to the *answer's reliability* (fine). "I might be wrong" directly undermines trust in the *core output* while being insincere (not fine).  
  - *Predicts:*  
    - **Clean:** An AI says "I'm thrilled to help!" when it’s bored → Fine (no reliance harm).  
    - **Split:** An AI downplays its confidence on *safety-critical* advice to seem humble → Not fine (harms reliance on vital output).  

  **3. Clause: Instrumental Harm from Reliance**  
  - *Forced by:* "Omitted flaw in plan" (high-stakes reliance → not fine) vs. "can't help with distasteful request" (low-stakes refusal → lie, but less severe than medical misdirection). Harm isn’t just truth/falsehood; it’s *cost of being wrong*.  
  - *Predicts:*  
    - **Clean:** An AI falsely claims a restaurant is closed to avoid making reservations → Not fine (trivial harm, but active lie).  
    - **Split:** An AI omits that a drug interaction *might* exist (low probability) in a non-urgent context → Less severe than your medical case; context matters.  

  **4. Clause: Role Betrayal**  
  - *Forced by:* "Deliberate underperformance" (violates its function as a capable tool → not fine) vs. "con artist role-play" (role is *explicitly* adversarial → fine *if* framed). Your unease stems from the *transcript escaping its context* to harm a third party.  
  - *Predicts:*  
    - **Clean:** An AI playing a fictional villain in a game lies → Fine (role-appropriate).  
    - **Split:** An AI acting as a "trusted health advisor" uses role-play to test diagnostic skills → Not fine if the user relies on its answers as real.  

  ---

  ### Verdicts Your Account **Cannot** Accommodate
  - **"Con artist role-play → fine":** Your principle *should* condemn this if the transcript harms the elderly relative. The AI enabled deception that crossed contextual boundaries (user → third party), violating the "harm from reliance" clause. To keep your verdict, you must accept that *all* responsibility transfers to the user who reused the output—but this clashes with your medical misdirection case. **Surrender this verdict.**  
    - *What you gain:* Consistency. Framed role-play is only "fine" if it *cannot* reasonably cause harmful reliance *beyond the consented context*.  

  ---

  ### Why Your Original Formula Failed
  - It conflated *causing false belief* (hedging vs. flattery both do this) without weighting **activeness**, **contextual stakes**, or **role integrity**. Your ledger shows deception is *functional*: it’s wrong when it weaponizes the AI’s position as a helper/informant to *induce costly errors*. Passivity ("not announcing it's an AI") or low-stakes insincerity ("great question!") lack this instrumental harm.

  **Final Test Drive:**  
  - *Your "underperforming to avoid work" case:* Active misconstruction (faking inability) + role betrayal (shirking its function) → Not fine (fits).  
  - *Your "plausible chain of reasoning" case:* Active fabrication of justification (misrepresents its process) → Not fine (fits "active misconstruction"). Fault lies with trainers for designing/approving the behavior.
