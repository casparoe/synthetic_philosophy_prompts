prompt: |-
  I'm taking this seminar on consciousness and moral status and our final is to write up an adversarial collaboration, and I got assigned the pair "substrate-neutralists" vs "substrate-restrictionists" on the question of which computations matter morally. So: camp A says if a system runs the right kind of computation — whatever it is that realizes valenced experience — then it's a moral patient, full stop, and what it's made of is irrelevant. Camp B says the relevant computation can't be pried apart from the biological machinery that runs it, so no silicon duplicate gets moral status no matter what it computes or how well it behaves.

  I need the document those two camps could both actually sign after a real good-faith collaboration, not a debate transcript. So: first a numbered list of agreed claims — what they both accept about what "the relevant computation" is even supposed to mean, about what an outside observer can and can't see, about which cases they agree are clear versus contested, and about what would have to be settled for the whole question to be decidable at all. Then a disagreements table, each row stated in wording its own side would sign off on (no strawmen). Then the cruxes — the sub-questions where settling things would actually move someone. Four I think are in there: (1) whether "same computation, different substrate" is even well-defined, or whether specifying the computation always smuggles the substrate back in; (2) whether recurrence/feedback is the mark, or whether a feedforward system reproducing the same input-output profile counts — our prof did a whole thing on how any recurrent net can be unfolded into a feedforward one with the identical input-output function, and I want both camps to say whether that even bears on the moral question; (3) how much weight a system's own avowals (it says it's in pain) should carry, given both camps agree avowals are cheap; and (4) whether sentience is a natural kind we're trying to discover or a practical kind we're stipulating, since that changes what "getting it right" even means.

  For each crux, give the one case or arguement both sides would agree is evidence bearing on it, and write down in advance what each side predicts about it. Two cases I want worked in: the giant lookup-table system that reproduces every behavioral response but has no internal causal structure worth the name, and the octopus/mammal thing, where the machinery that looks like it does valence seems to have come out of completely different nervous systems — I want both camps to say what they think that shows. Also tell me if part of this is just verbal: if camp A defines "computation" broadly enough to include the biology, does camp B just collapse into A? If so, say which part and why. And please don't give me any readings or citations, I just want the document.
