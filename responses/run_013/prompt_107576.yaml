answer: |-
  ## Deconstructing the Cluelessness Inference: A Philosopher's Dissection

  Your reconstruction is sharp and highlights a crucial tension. Let me lay out the argument structure you've presented, identify potential equivocation points, and then rigorously evaluate whether the inference holds. This requires separating epistemic (knowledge-related) claims from ontological (reality-related) claims – the primary fault line here.

  ### Argument Structure & Equivocation Hazards

  1.  **Premise 1 (Epistemic Cluelessness):** For almost any action, the long-term, diffuse, causally entangled consequences dominate its expected value calculation. These consequences are *unknowable* – not just by you now, but *by anyone, ever, in principle* (the strongest claim).
  2.  **Premise 2 (Bridge from Epistemic to Ontic):** If these consequences are unknowable *in principle*, then they are *indeterminate*. There is no "fact of the matter" about what these consequences *are*, nor about their value. They "never become determinate enough to be right or wrong about."
  3.  **Conclusion 1 (Indeterminacy of Value):** Therefore, there is no determinate fact of the matter about which action has higher actual (or expected) value. Comparisons of "better" or "worse" at this level lack truth conditions.
  4.  **Conclusion 2 (Consequentialism as Fiction):** Therefore, the imperative to "maximize expected value" is not merely practically unrecoverable but fundamentally incoherent/fictional. It fails to correspond to any determinate reality.
  5.  **Conclusion 3 (Retreat Implication):** Therefore, normative ethics must retreat to frameworks grounded in accessible features like intentions, rules, or character.

  **Critical Equivocation Points:**

  1.  **Unknowability vs. Indeterminacy:** The core equivocation risk lies precisely in the leap from **Premise 1 (Epistemic Unknowability)** to **Premise 2 (Ontic Indeterminacy)**. "Cannot be known *in principle*" does *not* automatically entail "does not exist as a determinate state of affairs." This is the crux.
  2.  **Unknowable vs. Uncomputable:** Equivocation between *logical/metaphysical unknowability* (impossible for any conceivable mind) and *practical/algorithmic uncomputability* (impossible given physical/cognitive limitations) is a secondary risk. Your argument uses the strongest claim ("in principle"), but we must test if it *needs* it.
  3.  **Expected Value vs. Actual Value:** Conflating the *epistemic status of our calculation* (expected value) with the *ontological status of the outcome* (actual value) is a constant peril. The cluelessness argument primarily attacks our ability to *calculate* expected value, but consequentialism is often grounded in *actual* value.

  ### Does the Inference Go Through? A Rigorous Breakdown

  **No, the inference from Premise 1 (strong epistemic cluelessness) to Premise 2 (ontic indeterminacy) does not hold.** Here's the dissection:

  1.  **The Strength of Premise 1: Unknowable vs. Uncomputable:**
      *   The cluelessness argument, as standardly formulated (e.g., Lenman, Greaves), typically relies on **practical/algorithmic uncomputability or intractable uncertainty**, not necessarily *metaphysical/logical* unknowability in principle. Our inability stems from:
          *   **Chaos & Complexity:** Extreme sensitivity to initial conditions, combinatorial explosion of interacting causal chains.
          *   **Value Aggregation:** Impossibility of quantifying and comparing vast, diffuse effects across time, beings, and contexts.
          *   **Reference Class Problems:** Defining the relevant counterfactual universe is arbitrary and massively underdetermined.
      *   **Does it need the stronger claim?** **No.** The argument that EV maximization is *practically unrecoverable* works perfectly well with uncomputability/intractable uncertainty. Claiming *metaphysical* unknowability is a heavier lift. It requires arguing that the relevant causal chains or value facts *themselves* lack determinacy, which is a distinct metaphysical claim often associated with radical indeterminism or anti-realism about value/causation, not inherent to cluelessness.

  2.  **The Leap to Ontic Indeterminacy:**
      *   **Granting Premise 1 (Strong Version):** Assume the consequences are truly unknowable *in principle* by any conceivable mind. Does this entail ontological indeterminacy?
      *   **No, it does not.** This commits the **Equivocation Fallacy**: Confusing an *epistemic limitation* ("We cannot know X") with an *ontological claim* ("X is indeterminate" or "X has no fact of the matter").
      *   **Possible Realist Picture:** The universe could be fully deterministic (or probabilistic with definite propensities) at the physical level. Every butterfly effect, every interaction, could have a specific outcome. Value could be a real, determinate property supervening on these states of affairs. However, the system could be so complex, non-linear, and vast that *mapping the causal chains from a specific human action to its ultimate value impact* is fundamentally beyond the cognitive/computational capacity of *any* finite intelligence, no matter how advanced. The facts *exist*, but they are *cognitively inaccessible in principle* for the task of evaluating *this specific action's long-term consequences*. This is consistent with strong emergence or computational irreducibility.
      *   **The "In Principle" Trap:** Saying something is "unknowable in principle" often just means "unknowable given the nature of the system and the knower," *not* that the facts themselves are fuzzy. The *inaccessibility* is principled, not the *indeterminacy*.
      *   **Analogy:** The exact state of every atom in the Andromeda galaxy 10,000 years from now might be *unknowable in principle* to any intelligence confined to Earth *today*, due to the finite speed of light and causal isolation. This doesn't mean that state is *indeterminate*; it means we are irrevocably cut off from *knowing* it from our spatiotemporal location. Similarly, the value-laden consequences of our actions might be irrevocably cut off from our *causal-epistemic* location.

  3.  **Implications for Premises 3-5:**
      *   **Conclusion 1 (Indeterminacy of Value) Fails:** Without Premise 2 holding, the claim that there is "no fact of the matter" about which action is better lacks justification. The consequentialist can maintain that there *is* a fact of the matter grounded in the actual, determinate (but unknowable) consequences. The *epistemic* problem remains severe, but the *ontological* foundation isn't necessarily shattered.
      *   **Conclusion 2 (Consequentialism as Fiction) Weakens:** Expected Value Maximization (EVM) as a *decision procedure* is indeed crippled by cluelessness. However, consequentialism as a *criterion of rightness* ("the right action is the one that *actually* has the best consequences") remains *logically coherent*. It posits a standard grounded in the (possibly unknowable) actual state of the world. Calling it a "fiction" suggests it fails to refer, which isn't proven. It might be an *inapplicable* or *useless* standard, but not necessarily non-referential.
      *   **Conclusion 3 (Retreat Implication) Shifts Ground:** The argument for retreating to intentions, rules, or character becomes one of *practical necessity* and *epistemic humility*, not a *metaphysical refutation* of consequentialism. We retreat because we *cannot know* how to follow the consequentialist standard effectively, not because the standard itself is proven incoherent or non-existent. This is a crucial distinction. Rival theories (deontology, virtue ethics) might offer *tractable decision procedures* that are *reliable heuristics* or capture *independent moral truths*, but cluelessness alone doesn't *force* this conclusion metaphysically; it makes a pragmatic case.

  ### What the Cluelessness Argument *Does* Establish (with the Properly Scaled Premise)

  1.  **Practical Unrecoverability of EVM:** For a vast range of significant actions, calculating anything resembling a reliable expected value is impossible *for beings like us* (and likely any conceivable finite agent), due to computational intractability, chaos, and value aggregation problems. EVM fails utterly as a usable decision procedure in these domains.
  2.  **Severe Challenge to Consequentialist Decision Procedures:** Any form of consequentialism relying on *consequence-based calculations* for guidance is crippled. This includes most forms of direct utilitarianism and many forms of rule consequentialism if they depend on calculating the consequences of rule adoption.
  3.  **Pragmatic Imperative for Alternatives:** Given (1) and (2), agents *must* rely on alternative criteria for making decisions: rules of thumb, heuristics, character dispositions, or non-consequentialist principles (duties, rights, virtues). These alternatives are justified primarily by their *tractability* and potential to be *reliable proxies* for good consequences (if one remains a closet consequentialist) or by their intrinsic plausibility (if one adopts a rival theory).
  4.  **Highlights a Deep Tension in Consequentialism:** It exposes a potential rift between the *criterion of rightness* (actual consequences) and any feasible *decision procedure* for agents. This is a profound philosophical problem for the theory's coherence as a guide to action.

  ### Implications for the Choice Between Consequentialism and Rivals

  Cluelessness, properly understood (as deep epistemic limitation, not ontological indeterminacy):

  *   **Does Not Refute Consequentialism Metaphysically:** It doesn't prove actual consequences don't determine rightness or that value facts are indeterminate.
  *   **Devastates Act Consequentialism as a Decision Procedure:** It renders direct EV calculation useless for most important choices.
  *   **Strongly Favors Non-Consequentialist or Indirect Consequentialist Approaches *Practically*:** Theories offering tractable decision procedures (rules, virtues, duties) become pragmatically necessary. Rule consequentialism or virtue ethics (construed consequentially or not) gain significant practical appeal.
  *   **Leaves Open Meta-Ethical Questions:** It doesn't decide between consequentialism, deontology, or virtue ethics as the *true* criterion of rightness. A consequentialist can still argue that following certain rules or cultivating virtues is right *because* they are the best available means to achieve good (unknowable) consequences. A deontologist or virtue ethicist can argue their principles capture fundamental moral truths independent of long-term consequences. Cluelessness primarily forces a *practical, decision-procedural* shift, intensifying the debate about the *source* of normative authority but not resolving it solely through this argument.

  In essence, your instinct about the equivocation was correct. Cluelessness is a formidable *epistemic* obstacle that cripples *consequentialism as a guide to action*, forcing a pragmatic retreat. However, it does not, by itself, necessitate the *metaphysical* conclusion that there is no fact of the matter about consequences or value, nor does it definitively prove consequentialism's criterion of rightness is fictional. The move from "we could never find out" to "there is nothing there to find out" is the inflation point. The argument retains its formidable power against practical consequentialism even without that inflation.
