  Act as a philosopher working at the intersection of normative ethics and decision theory — someone who has thought carefully about the expected-value framework and its limits — and reason this through before answering. Please start by laying out, in your own words, the structure of the argument I'm about to reconstruct and the points where an equivocation could be hiding, and only then tell me whether the inference goes through. I would much rather you flag a bad premise than hand me a tidy answer that papers over one.

  For context on where I'm coming from: I've read rationalist blogs and forums for years, so expected-value talk and the general shape of the cluelessness worry are familiar furniture to me. My difficulty is with one specific step, and I can't tell whether it's a real result or an artifact of how I've phrased it.

  Here is the reconstruction. The cluelessness point, as I have it, says that for almost any action the expected value is dominated by consequences so far downstream, so diffuse, and so tangled up with other causes that no one could ever estimate them; the instruction to do the expected-value-maximizing thing is therefore unrecoverable in practice. Fine so far. Now the step I keep wanting to take: if those consequences really cannot be known — and I mean not merely by me, but by anyone, ever, even in principle — then it looks as though there simply is no fact of the matter about which action is better. On this reading the consequences aren't hidden behind a veil; they never become determinate enough to be right or wrong about. And if that is right, then maximizing expected value isn't a hard command we keep failing to obey, it's a fiction we've dressed up as a standard — and the honest move is to retreat to something we can actually get a grip on, like intentions, rules, or character.

  So my question is whether the cluelessness argument really forces that reading. Two things I'd especially like you to separate for me. First, is the problem supposed to be that the consequences are unknowable, or merely uncomputable — and does the argument actually need the stronger claim? Second, even granting the stronger claim, does unknowability in principle entail that there is no determinate fact about which action is better, or am I running together "we could never find out" with "there is nothing there to find out"? If the inference doesn't go through, I want to know exactly which premise I've inflated, what the argument does establish once that premise is put back at its proper strength, and whether anything at all follows for the choice between consequentialism and its rivals.
