  Okay, let me start by understanding the user's problem. They work at a natural history museum on the interpretive content team, producing labels and scripts. Their main issue is dealing with functional language in their drafts, like saying a trait is "for" something, which their curatorial consultant criticizes for implying purpose in nature. The user knows the two main philosophical camps: the selected-effects view (traits evolved for a purpose) and the causal-role view (current function regardless of history). They need a practical decision procedure to apply to drafts without getting bogged down in philosophy every time.

  First, I need to address their immediate need: a step-by-step process writers can follow. The user mentioned specific tricky cases—traits with shifted functions, human traits with political implications, etc. So the procedure must handle these nuances. The user also wants examples tested: bird crests, human appendix, and behavioral sex differences.

  Breaking down the decision procedure. Step one should be identifying if there's a functional claim. If not, no problem. If yes, Step two checks if it's about humans—because that's politically sensitive. For non-human traits, Step three would determine if there's strong evidence for evolutionary history (selected-effects) or if they should switch to causal-role language. But they need clear criteria: what counts as "good evidence"? Maybe consensus in peer-reviewed sources or established textbooks. Step four could be for cases where neither applies, prompting removal of functional language.

  Considering the examples. The bird crest is well-supported by research for mate attraction, so selected-effects language is okay. The appendix is trickier—current functions exist but weren't selected for. Causal-role language fits better here. The behavioral differences between sexes are the hardest. Even if some studies suggest evolutionary roots, the political sensitivity and lack of consensus mean avoiding functional language is safer. The user won't like this, but it's necessary to prevent controversy.

  The user's deeper needs include efficiency and avoiding philosophical debates. They want a tool that streamlines decisions without constant crises. Also, maintaining scientific accuracy while keeping content accessible. The procedure must balance these, flagging sensitive areas early (like human traits) and providing clear alternatives. They might also need to train their team on distinguishing between selected-effects and causal-role functions, ensuring consistency in house style.

  Finally, the appendix example shows where the procedure shifts from word-policing to substantive decisions. For the behavioral case, it's about values and risk assessment. Highlighting these differences helps the user understand when the procedure is objective versus when human judgment is essential.
answer: |-
  Here's a battle-tested decision procedure for functional language in your labels, designed for speed and defensibility. It prioritizes risk reduction and clarity over philosophical purity, acknowledging that museum labels are *interpretive*, not scientific papers.

  **The Functional Language Decision Tree (FLDT)**

  Ask these questions **in order** for any sentence implying purpose ("for", "evolved to", "function is to", "adaptation for", "allows", "enables" etc.):

  1.  **Does this sentence *actually* make a functional claim?**
      *   *Good Enough Answer:* Yes, if removing the functional word (like "for") changes the meaning or makes the sentence nonsensical. (e.g., "The crest *attracts mates*" is descriptive. "The crest is *for* attracting mates" is functional.)
      *   *Result:* **No functional claim?** Proceed. **Yes?** Go to Question 2.

  2.  **Is the trait in a *human*?**
      *   *Good Enough Answer:* Yes, if the label explicitly discusses *Homo sapiens* anatomy, physiology, cognition, or behavior in an evolutionary context. Err on the side of "yes" for hominins.
      *   *Result:* **Human?** **FLAG & ESCALATE IMMEDIATELY.** Do NOT proceed down this tree. This requires senior staff/curator review due to inherent socio-political risk. Use purely descriptive language ("The appendix is a pouch connected to the large intestine") until reviewed. **Not Human?** Go to Question 3.

  3.  **Is there strong, *consensus* evidence linking the trait's *current* effect to the *reason* it was *selected and refined* by evolution? (Selected-Effects Focus)**
      *   *Good Enough Answer:*
          *   **Yes:** If the trait is a textbook example of an adaptation for that specific function (e.g., chlorophyll for photosynthesis, echolocation in bats), supported by multiple lines of evidence (fossil record, comparative anatomy, genetics, direct observation of fitness benefits). **This is the safest ground for "for" language.**
          *   **No:** If the link is speculative, controversial, involves significant exaptation (shifted function), or the current effect is clearly not the original selective driver. Includes "just-so stories".
          *   **Unclear/Mixed:** If evidence exists for historical selection *related* to the function but it's messy (e.g., feathers initially for insulation, later co-opted for flight), or if the trait has multiple, simultaneous selective benefits.
      *   *Result:*
          *   **Yes:** You *may* use cautious selected-effects language ("The elaborate tail feathers of the peacock *evolved primarily through sexual selection to attract mates*").
          *   **No or Unclear/Mixed:** Go to Question 4. **Avoid selected-effects language.**

  4.  **Is the trait *currently* contributing significantly to the organism's survival or reproduction *in its typical environment*? (Causal-Role Focus)**
      *   *Good Enough Answer:*
          *   **Yes:** If the trait demonstrably *does* the thing, and doing that thing *clearly helps* the organism live or reproduce *now* (e.g., the heart *pumps blood*, pumping blood is *essential* for survival; cryptic coloration *hides* the animal from prevalent predators).
          *   **No:** If the trait is vestigial, currently detrimental, or its contribution is minor, speculative, or context-dependent.
      *   *Result:*
          *   **Yes:** You *may* use cautious causal-role language ("The heart *functions to* pump blood through the circulatory system", "Wing markings *serve as* a warning signal to predators in this habitat").
          *   **No:** **CUT the functional claim entirely.** Use purely descriptive language ("The appendix is a pouch...", "Some birds display brightly colored crests during breeding season"). Go to Question 5.

  5.  **(Only if Q4 = No) Can we make the point *without* implying function?**
      *   *Good Enough Answer:* Focus on description, mechanism, or consequence without "for/to" language. Use verbs like "is", "has", "produces", "influences", "affects", "is associated with", "during", "when", "may help", "contributes to".
      *   *Result:* Rewrite descriptively. If the core point *requires* a functional implication and you can't find a safe way (Q3 or Q4 didn't pass), the point is likely too speculative or risky for a concise label. **Cut or radically reframe the sentence.**

  **Key Principles for Writers:**

  *   **"May help" & "Contributes to" are your friends:** They imply current utility without strong historical claims or rigid purpose.
  *   **Avoid "Allows" & "Enables":** These often smuggle in unintended purpose. Prefer "helps the animal do X" or "is involved in X".
  *   **"Used for" over "For":** "The bird *uses* its crest *for* display" is slightly better than "The crest is *for* display" – it implies behavioral agency over inherent purpose.
  *   **Context is Crucial:** Always specify the *context* where the function operates (e.g., "serves as a warning signal *to predators*", "helps regulate digestion *in herbivores*").
  *   **When in Doubt, Describe:** You can almost always state *what the trait does* without saying *what it's for*.

  **Annoying Cases Handled:**

  *   **Feathers (Shifted Function):** Q3: Unclear/Mixed (Insulation? Display? Flight?). Q4: Yes (Current function: Flight/Insulation). **Result:** Use causal-role language: "Feathers provide insulation and *enable* flight in birds." Avoid "evolved for flight".
  *   **Trait Useful Now, Not Selected For (e.g., some cognitive biases):** Q3: No. Q4: Maybe (Does it *currently* contribute? Often complex). **Result:** Often best to describe the mechanism/effect ("Humans tend to...") without functional claims. If clear current benefit, cautious causal-role ("This cognitive tendency *may help* quick decision-making").
  *   **Vestigial Traits (e.g., hindlimb bones in whales):** Q3: No (Original function gone). Q4: No (No significant current contribution). **Result:** Q5: Describe descriptively ("Some whales retain small, internal pelvic bones").
  *   **Human Traits:** Stops at Q2. **Escalate.** Example: Avoid "The female pelvis evolved for childbirth". Use: "The human female pelvis has a wider shape compared to males, which facilitates childbirth." (Descriptive + consequence).

  **Running the FLDT on Your Drafts:**

  1.  **Bird Crest ("The crest is for attracting mates")**
      *   Q1: Yes (Functional claim: "for").
      *   Q2: No (Not human).
      *   Q3: **Yes** (Peacock tails, bird crests generally - textbook examples of sexual selection. Strong consensus evidence. *This is the best-case scenario*).
      *   **Result:** **ALLOWED** with slight strengthening for clarity: "The elaborate crest *evolved primarily through sexual selection to attract mates*." (Selected-effects language justified). *This settles it scientifically.*

  2.  **Human Appendix Label ("The appendix functions to store beneficial gut bacteria")**
      *   Q1: Yes ("functions to").
      *   Q2: **YES - HUMAN TRAIT.**
      *   **Result:** **FLAG & ESCALATE IMMEDIATELY. DO NOT USE.** Rewrite descriptively: "The appendix is a small pouch connected to the large intestine. Research suggests it *may act as* a reservoir for beneficial gut bacteria." (Causal-role "may" language is less risky than definitive "functions to", but still requires review due to human context). *This is primarily word-police/risk-aversion, acknowledging the political minefield.*

  3.  **Behavioral Difference Between Sexes ("This behavior is an adaptation for more efficient foraging by females")**
      *   Q1: Yes ("adaptation for").
      *   Q2: **Depends.** Is it *explicitly* about *human* behavior? (Assume yes for maximum risk, but let's run both).
          *   *If Human:* **FLAG & ESCALATE IMMEDIATELY. DO NOT USE.** Rewrite descriptively: "Studies show females in this species often forage using [Specific Behavior] more frequently than males." Avoid adaptation/function talk entirely.
          *   *If Non-Human (e.g., a bird):*
              *   Q3: **Unclear/Mixed** (Behavioral adaptations are notoriously hard to pin down historically. Is it learned? Cultural? Genetic? Was foraging efficiency *the* driver? Often speculative). **Avoid selected-effects.**
              *   Q4: **Maybe** (Does it demonstrably *help* females forage more efficiently *now*? Possibly, but context-dependent). If strong evidence: "Females frequently use [Behavior], which *appears to help* them forage more efficiently than males in this environment." (Weak causal-role). If evidence weak: Cut functional claim, describe the behavioral difference.
      *   **Result (Human):** **REJECT.** (Politically loaded, high risk of oversimplification/essentialism). **Result (Non-Human):** **LIKELY REJECT** the functional claim as stated. Rewrite descriptively or use *very* weak, causal-role language ("may help") with strong context. *This is where the procedure genuinely settles something (rejecting strong selected-effects claims for complex behaviors) and does word-police work (forcing extreme caution on human traits and weak evidence).*

  **The Answer You Won't Like:**

  The **Behavioral Difference Between the Sexes** label. The FLDT will almost certainly tell you to reject the phrasing "is an adaptation for". Even for non-humans, Q3 (Selected-Effects) will rarely give a strong "Yes" for complex behaviors without controversy. For humans, it's a hard stop. You'll need to water it down significantly or remove the functional implication entirely, which might feel like dodging the interesting evolutionary question. This is the cost of avoiding philosophical pitfalls and political firestorms in a public-facing, concise format.

  **Where the FLDT Works & Why:**

  *   **Word-Police Work:** Primarily at Q1 (identifying claims), Q2 (human flag), Q5 (forcing rewrites). It stops lazy phrasing and high-risk human topics.
  *   **Genuinely Settling:** Q3 and Q4 provide objective(ish) criteria for justifying *or rejecting* functional language based on scientific evidence standards. It forces writers to confront the evidence level for their claims.
  *   **Survives Annoying Cases:** By separating Selected-Effects (Q3) and Causal-Role (Q4) justifications and providing an escape hatch (Q5), it handles shifts, vestiges, and current utility without needing a Ph.D. seminar each time.
  *   **Values vs. Science:** Q2 explicitly handles the values-laden human domain by requiring escalation. Q3/Q4 focus on scientific evidence thresholds. Q5 is the pragmatic fallback.

  **Recommendation:** Adopt this FLDT as your house style's operational guide. Train your writers on it. It doesn't commit you to one philosophical camp *in theory* but strongly biases towards Selected-Effects *only* when evidence is rock-solid (Q3=Yes) and otherwise defaults to cautious Causal-Role (Q4=Yes) or pure description (Q5). For Human traits, it forces extreme caution and review. This maximizes defensibility and minimizes crises per label. Tell your philosophy-minor consultant this is your *pragmatic operational definition* to ensure scientific accuracy and public clarity under production constraints.
