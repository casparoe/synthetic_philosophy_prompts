  Hmm, the challenge is making the humor stem from the intellectual tension itself. The traditional view (symmetry) says both soldiers have equal standing; the revisionist view (asymmetry) says only the unjust combatant is liable. The hospital setting is perfect because it forces proximity—they're literally disarmed and vulnerable, stripped of battlefield context. 

  I'll avoid naming theorists (Walzer vs. McMahan etc.) since the audience knows the debate. The joke must land for experts, so precision is key. Possible angles: 
