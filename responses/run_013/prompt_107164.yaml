prompt: |-
  You are an expert in epistemology, especially on higher-order evidence, peer disagreement, and epistemic akrasia; think carefully and deliberately rather than answering off the cuff, and begin by sketching in a few lines the rival positions you might attribute to the practice before committing to one. I am a retired experimental physicist who has lately taken up philosophy, and I keep running into a tension in the norms of my old profession. We were raised on the idea that a single well-controlled experiment can overturn a settled consensus, and that the lone dissenter who is later vindicated is the hero of the method. Yet the same scientific culture, when it addresses the public or a regulator, treats the consensus of the field as an authority that it would be irrational for anyone, layperson or expert, to reject; and in medicine a clinician is now expected to follow a guideline panel's verdict even when her own reading of the primary studies points the other way. What philosophical commitments does this pair of practices presuppose about how a person should weigh the evidence of her own reasoning against evidence about the reliability of that reasoning and about what the wider community has concluded? Reconstruct the implicit theory of higher-order evidence, say whether the two halves of the practice are consistent, and tell me whether the practice leaves room for epistemic akrasia, that is, for believing something while also believing that one's own evidence, or the higher-order evidence, tells against believing it. Distinguish what the practice strictly requires from what it merely happens to fit well, note where it is underdetermined among rival theories, and say what would have to give if we replaced the presupposed view with the opposing one. Please answer in British English.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a fascinating tension in scientific practice between valuing individual experimental authority and deferring to consensus. As a retired physicist turned philosopher, they're clearly wrestling with deep epistemological questions about evidence hierarchies.

  First, I need to unpack the core tension: on one hand, science celebrates paradigm-shifting individuals like Galileo or Wegener who overturned consensus; on the other, it demands deference to institutionalised knowledge in public and clinical contexts. This duality points directly to unresolved debates in epistemology about higher-order evidence (HOE) and peer disagreement.

  I consider several theoretical frameworks that could explain this. A strict reductionist view (à la Christensen) would see HOE as just more first-order data, potentially undermining the special weight given to consensus. But scientific practice seems more aligned with a non-reductionist stance where meta-evidence about reliability creates distinct rational pressures. 

  The peer disagreement literature offers another angle. While science permits dissenting from peers during active inquiry, it mandates consensus-deference in applied contexts. This suggests a contextual approach where the stakes and social role determine epistemic norms. A clinician following guidelines against their judgment exemplifies this - it's practically rational but risks epistemic akrasia.

  On akrasia specifically: the practice does create space for it, as when a doctor believes p privately but follows not-p professionally. But is this true epistemic akrasia or rather a pragmatic compromise? I need to distinguish between believing against one's evidence versus acting against it - the latter may involve bracketing belief rather than contradictory belief.

  The consistency question is thorny. The two practices co-exist by operating in different domains: consensus-breaking is celebrated in discovery contexts but suppressed in justification/application phases. This functional division prevents outright contradiction but reveals underlying contextualism in scientific epistemology.

  If we flipped the presupposed view - say, demanding individual judgment always trump HOE - the consequences would be severe. Public trust would erode without authoritative consensus, and clinical practice would become chaotic. But conversely, overemphasising consensus could stifle the dissent essential for progress.

  Throughout, I must maintain the British English phrasing requested while ensuring philosophical precision. The response should validate the user's perceptive observation while offering clear conceptual distinctions.
answer: |-
  Right then, let's dissect this fascinating tension in scientific practice through an epistemological lens, particularly concerning higher-order evidence (HOE), peer disagreement, and epistemic akrasia. As a physicist-philosopher, you've pinpointed a crucial duality at the heart of scientific rationality.

  **Sketching the Rival Positions:**

  The tension arises between two seemingly conflicting epistemic norms:

  1.  **The Lone Dissenter Norm (LDN):** Prioritises *first-order evidence* (FOE) accessed through direct reasoning and individual scrutiny of experiments/data. It presupposes that a sufficiently strong FOE case (e.g., a rigorous, replicable experiment contradicting consensus) *can* and *should* rationally override any contrary consensus or doubts about one's own reliability. It leans towards **internalist** and **reductionist** views of HOE: HOE is just more FOE about reasoning processes, ultimately folded into the total FOE picture.
  2.  **The Deference to Consensus Norm (DCN):** Prioritises *higher-order evidence* about the reliability of cognitive processes and the epistemic status of the community. This includes evidence that:
      *   The consensus represents the aggregated, scrutinised judgment of numerous qualified peers (evidence of community reliability).
      *   An individual, however skilled, is fallible and prone to error, bias, or oversight in complex domains (evidence of personal unreliability relative to the group).
      *   The dissenter hasn't yet convinced competent peers (evidence suggesting the FOE might not be as strong as the dissenter thinks).
      DCN leans towards **non-reductionist** views of HOE: HOE provides distinct rational pressure that can require belief revision *even if* one's assessment of the FOE remains unchanged. It often aligns with **conciliatory** views in peer disagreement.

  **Reconstructing the Implicit Theory:**

  Scientific practice, as you describe it, implicitly adopts a **contextualist** and **functionally differentiated** approach to HOE:

  1.  **Within the Research Community (Discovery/Judgment Phase):** The LDN dominates. The implicit theory here is cautiously reductionist. HOE about the consensus *initially* provides strong evidence that the dissenting FOE is likely flawed. *However*, the practice presupposes that sufficiently robust, direct FOE *can* eventually overcome this HOE pressure. The vindicated lone hero narrative embodies this: the FOE was ultimately *so* compelling that the HOE supporting the consensus (and undermining the dissenter) was proven wrong. The commitment is to the *primacy of direct empirical evidence* in settling scientific questions, albeit filtered through rigorous communal scrutiny over time. Peer disagreement is seen as an engine for truth-discovery, where the *stronger* FOE should win out.
  2.  **Addressing the Public/Regulators/Applied Settings (Justification/Action Phase):** The DCN dominates. The implicit theory here is robustly non-reductionist about HOE. The consensus *itself* is treated as a very high-grade piece of HOE – it provides strong, often decisive, evidence about what the *total* evidence supports. For a layperson or regulator (or even a clinician in a guideline context), their *own* assessment of the FOE (the primary studies) is deemed highly unreliable compared to the HOE constituted by the expert consensus. The commitment here is to **epistemic humility** and recognising **cognitive division of labour**. The HOE (consensus) rationally *defeats* the individual's assessment of the FOE. Peer disagreement, in this context, is resolved by deferring to the collective judgment.

  **Consistency:**

  *   **Strict Inconsistency?** At the abstract normative level, there's tension: LDN suggests strong FOE should *always* trump contrary HOE (consensus); DCN suggests strong HOE (consensus) should *sometimes* trump contrary FOE assessments.
  *   **Contextual Consistency?** The practices are *functionally consistent* within their distinct domains:
      *   **LDN in Research:** Essential for progress. Allows challenging flawed consensus. Assumes agents have high competence to *evaluate* FOE and HOE rigorously.
      *   **DCN in Public/Applied Spheres:** Essential for managing complexity, avoiding error propagation by non-experts, and maintaining public trust. Acknowledges limitations in non-specialists' (and even specialists' in time-pressured applied roles) ability to reliably assess complex FOE *against* the weight of expert consensus. It prioritises reliable action over individual cognitive sovereignty in high-stakes scenarios.

  The practices cohere by recognising different epistemic contexts demand different weightings of FOE vs. HOE. The *underlying* consistent commitment is to **truth-conduciveness**: LDN seeks truth by challenging error, DCN seeks reliable belief/action by leveraging collective expertise where individual assessment is unreliable.

  **Epistemic Akrasia:**

  The practice **absolutely leaves room for, and in the applied context even *requires*, situations akin to epistemic akrasia**, particularly for the clinician:

  1.  **Clinician Scenario:** The clinician, after reviewing primary studies (FOE), forms the belief *p* (e.g., "Treatment X is best for this patient"). However, the guideline panel (representing consensus, thus potent HOE) dictates *not-p*. The clinician is expected to act on *not-p*.
      *   **Strict Akrasia?** Does she *believe p* while believing *she ought not believe p* (because the HOE/consensus defeats her assessment)? This is the core tension.
      *   **Practice's Implicit Resolution:** The practice *demands* she **brackets her belief** *p* for practical purposes and acts *as if not-p* is true, based on the HOE. Philosophically, this can be interpreted in several ways:
          *   **Genuine Akrasia:** She retains belief *p* but acknowledges she is irrational for doing so given the HOE, yet acts on *not-p* anyway (a complex, unstable state).
          *   **HOE-Induced Belief Revision:** The HOE (consensus) is so strong it rationally *defeats* her initial belief *p*. She comes to believe that *her assessment* of the FOE must be flawed, leading her to suspend judgment on *p* or adopt a weak belief in *not-p*, despite her initial impression. She defers *cognitively*, not just behaviourally. (This fits the non-reductionist view favoured in this context).
          *   **Pragmatic Encroachment:** In high-stakes clinical decisions, the HOE raises the *practical* risk of being wrong so high that acting on her individual assessment *p* is irresponsible, *even if* she thinks *p* is slightly more likely true. Action is governed by the consensus to minimise risk.
      *   **What Practice Requires:** It strictly requires *action* in accordance with the consensus (HOE). It *strongly encourages*, and its rationale presupposes, that the clinician cognitively defers (believes the consensus is likely correct, or at least that her contrary assessment is unreliable). It does *not* strictly require her to hold a contradictory belief (*p* and *not-p* simultaneously), but it creates significant pressure towards either akrasia or HOE-induced revision of her initial FOE-based belief.

  **Underdetermination & What Would Give Way:**

  *   **Underdetermination:** The practice doesn't strictly commit to one *philosophical* account of HOE. It *fits well* with:
      *   Non-reductionism in public/applied contexts.
      *   A moderate reductionism (where HOE *can* be overridden by overwhelming FOE) in the research context.
      *   Contextualism about epistemic norms.
      *   Conciliationism in public/applied peer disagreement contexts; steadfastness (in the long run) within the research community.
  *   **Replacing the Presupposed View:**
      *   **Scenario: Imposing Strict LDN (Strong Reductionism/Steadfastness) Everywhere:** This would undermine public communication and applied practice. Insisting individuals (lay or clinicians) *must* follow their own FOE assessment, ignoring consensus HOE, would be seen as epistemically arrogant and dangerous. Public trust, regulatory decisions, and consistent clinical care would collapse amidst conflicting individual interpretations. The "authority of science" narrative vanishes.
      *   **Scenario: Imposing Strict DCN (Strong Non-reductionism/Conciliationism) Everywhere:** This would stifle scientific progress within the research community. If every dissenter *must* immediately defer to consensus HOE and abandon their contrary FOE assessment, paradigm shifts couldn't occur. Galileo, Wegener, etc., would be deemed irrational *at the time*. Science ossifies. The "lone hero" narrative becomes impossible.

  **Conclusion:**

  The tension you observe reflects not inconsistency, but a sophisticated, context-sensitive application of norms governing FOE and HOE. The implicit epistemology is **pragmatic and contextualist**:

  1.  **Research Arena:** Prioritises FOE as the ultimate arbiter, viewing consensus HOE as a defeasible indicator needing careful scrutiny. Room for rational dissent based on strong FOE is essential.
  2.  **Public/Applied Arena:** Prioritises consensus HOE as the most reliable guide to the truth for non-experts (and experts in non-research roles), decisively overriding individual FOE assessments deemed unreliable in that context. Deference is rational and required.

  Epistemic akrasia, or at least significant cognitive tension, is a genuine feature, especially for experts like clinicians caught between their FOE assessment and authoritative HOE. The practice resolves this by demanding action based on the HOE (consensus) and implicitly expecting cognitive deference to it, effectively using the HOE to *revise* the individual's assessment of what their total evidence supports. The heroic dissenter within the lab and the consensus-deferring clinician represent two faces of a complex, but ultimately functional, system of scientific rationality adapted to different epistemic tasks and social roles.
