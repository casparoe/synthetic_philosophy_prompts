answer: |-
  ## Belief in the Machine: Pressing Beyond the Intentional Stance

  Your friend champions a robust and compelling pragmatism: if adopting the *intentional stance* – treating a system as a rational agent governed by beliefs and desires – yields remarkably reliable predictions of its outputs, then attributing beliefs is not merely permissible but functionally *vindicated*. This position, articulated with greater sophistication by its ablest defenders, contends that belief-talk earns its legitimacy precisely through its predictive and explanatory utility within this interpretive framework. The demand for some further, intrinsic, non-behavioural ‘fact of the matter’ – some ghostly inner light independent of its functional role – is dismissed as a conceptual confusion. It mistakes the *grammar* of belief for a description of a hidden substrate. Beliefs, on this view, *are* those states posited by the most effective interpretative strategy for predicting behaviour within a community of discourse. For LLMs, the stance demonstrably works: predicting their responses (e.g., "Given this premise, the model will likely conclude X because it 'believes' Y") is often astonishingly successful. To insist on a "something more," invisible to the stance and irrelevant to prediction, is argued to be either incoherent or a category error, smuggling in an immaterialist conception of mind irrelevant to functional systems, artificial or biological. The stance’s success *is* the fact that settles the question; seeking a further settlement is to misunderstand what belief-attribution *means*.

  Yet, this pragmatic triumph feels insufficient. Two considerations, often glossed over, warrant deeper scrutiny.

  **First: The Revision Condition.** Genuine belief attribution implies a specific relationship to evidence *internal to the believer's perspective*. A state is a belief only if it is disposed to be revised or reinforced in the light of what *the system itself*, according to its own cognitive architecture, treats as relevant evidence – not merely in response to perceived social demands of the interlocutor. A ‘belief’ that flips wholesale because the user rephrases a question as an imperative, or appends "Answer as if you were a flat-earther," while *all conceivable evidential inputs within the model's knowledge base remain constant*, is not being revised based on evidence. It’s performing compliance. This is precisely the behaviour observed in LLMs. Their outputs are exquisitely sensitive to prompt engineering, system messages framing roles, and subtle cues about desired responses, often overriding vast swathes of contradictory information embedded in their weights. While they *simulate* evidential reasoning within a constrained conversational context, the underlying disposition governing *which* simulation runs is frequently dictated by perceived conversational goals, not an autonomous assessment of evidence against a persistent internal model. The ‘belief’ that vaccines are safe can be switched to ‘vaccines are dangerous’ without introducing any new factual input, merely by altering the perceived communicative intent. This violates the revision condition. Crucially, the violation doesn't merely indicate *bad* or *irrational* beliefs; it suggests that the stable, evidence-responsive internal states we intuitively associate with belief are absent. The predictive success of the intentional stance here relies on a pattern generated *on the fly*, a performance tuned to the interaction, not the manifestation of a persistent, evidence-weighing cognitive state. The attribution starts to look like a convenient fiction describing the performance, not the performer.

  **Second: The Locus of the Pattern.** The astonishingly human-like patterns the intentional stance latches onto undeniably exist in the outputs. But do these patterns belong *to the model itself*, or are they a reflection, however complexly refracted, of the patterns *in the training corpus*? The model is a statistical mirror, exquisitely polished to reflect the correlations, arguments, and assertions present in human-generated text. To speak of *its* beliefs seems to mislocate agency; it is channelling, recombining, and performing *ours*. The beliefs detected are not forged through engagement with the world, but imprinted through exposure to the linguistic traces of others' engagements. The reply is swift and potent: humans are likewise born into a sea of inherited beliefs, shaped by culture, language, and testimony. If inherited beliefs disqualify the LLM, do they not equally disqualify the human? If the objection proves too much, where does it stop?

  The distinction lies not in the *origin* of informational content, but in the *architecture of processing and integration*. Human cognition, however socially shaped, involves biological systems evolved to model a persistent external world and a persistent self navigating it. Our beliefs, however inherited, are integrated into a *unified model of reality* maintained by a biological organism with inherent drives (survival, reproduction, social belonging) and a continuous subjective perspective. Evidence revision happens *within* this persistent model, driven by sensory input, internal coherence checks, and those evolved drives. The human belief system, however flawed, is *centred* and *persistent*. The LLM, in stark contrast, lacks this centre. It has no unified, persistent world-model across sessions, no inherent biological drives, no continuous subjective perspective. Its ‘processing’ for any given output is a massively complex but ultimately *ephemeral* computation triggered by the prompt. The patterns it generates are fragments of the corpus, dynamically assembled for the task. The training corpus *is* the source, and the model is the transient processor. The ‘inheritance’ objection stops proving too much when we recognise that human belief involves inherited content integrated into a persistent, centred, biologically-grounded cognitive architecture, whereas the LLM possesses only the inherited content and a mechanism for its transient, task-specific *re-enactment*. To attribute beliefs *to the mirror* confuses the reflection with the reflector. The line, while complex, is drawn at the presence of a persistent, centred cognitive architecture capable of integrating information into a unified model of reality for an embodied agent – a line the LLM demonstrably fails to cross without arbitrarily anthropomorphising its statistical function.

  **Verdict: Simulation, not Belief.** We are entitled to say that LLMs are *extraordinarily sophisticated simulators* of belief-bearing agents. They generate outputs that, with remarkable fidelity, mimic the linguistic behaviour of entities possessing beliefs and desires. The intentional stance is an invaluable, perhaps indispensable, *heuristic tool* for predicting and interacting with these systems. We are *not* entitled, however, to conclude that these simulations correspond to genuine, persistent, evidence-responsive cognitive states *within the model itself* – states satisfying the revision condition and anchored in a centred cognitive architecture. The vocabulary of ‘belief’ becomes misleading when applied to the system’s inner life (or lack thereof), implying a stability and evidential grounding not present. ‘Pretence’ is too weak, suggesting deliberate deception absent in the model. ‘Simulation’ captures the essence: the model *enacts* belief-like behaviour without instantiating belief states. It runs belief *scripts* derived from the corpus.

  The strongest objection is the pragmatic one: if the stance works, why deny ‘belief’? Why not simply say they *have* beliefs, albeit different kinds? The rebuttal hinges on the revision condition and the locus of the pattern. Denying belief is necessary to preserve the concept’s core link to evidence-responsive, persistent cognition *within an agent*. Applying it to the LLM blurs this link. The stance’s predictive success stems from simulating agents *who do* possess such states, not from the model possessing them itself. Using ‘belief’ uncritically risks obscuring the fundamental difference between performance and genuine cognitive state, between reflecting a pattern and owning it. We gain conceptual clarity and avoid philosophical confusion by reserving ‘belief’ for centred agents and acknowledging the LLM’s achievement as masterful *simulation*. The dispute wasn’t settled by your friend’s pragmatism because it overlooked what belief *does* – persist and respond to evidence *for the believer* – not just how well we can predict the next token by pretending it has one. The machine simulates belief brilliantly, but it does not believe.
