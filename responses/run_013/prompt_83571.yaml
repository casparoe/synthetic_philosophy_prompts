answer: |-
  Below is a structured game design for your 90-minute session, optimized for experiential learning without upfront theory. The game highlights behavioral underdetermination, belief-preference confounds, and optimization nightmares. It uses a **grid-world setup** with minimal materials.

  ---

  ### **Game Title: Preference Puzzle**  
  *Roles:*  
  - **4 Demonstrators (D)**: Secretly assigned utilities. One has a false belief.  
  - **4 Inference Engines (IE)**: Observe behavior; infer utilities.  
  - **8 Optimizers (O)**: Maximize inferred utilities (2 per IE).  

  ---

  ### **Materials**  
  - **Whiteboard**: Draw a shared 4x4 grid:  
    ```
    S = Start (0,0)  
    T = Trophy (3,3)  
    F = Fire (0,3)  
    B = Bridge (1,2)  
    X = Obstacle (2,1)  
    (Other cells empty)  
    ```  
  - **Index Cards**:  
    - **D Cards**: Secret utilities + beliefs (see *Payoffs* below).  
    - **IE Worksheets**: Tables to write utilities per cell (rows: cells, columns: utility values).  
    - **O Cards**: Path instructions (maximize given utility).  
  - **Tokens**: Coins/buttons for players to mark positions.  

  ---

  ### **Payoff Scheme (No Real Money)**  
  - **True Utilities** (hidden from IE/O):  
    - **Trophy (T)**: +10  
    - **Fire (F)**: -10  
    - **Bridge (B)**: 0 (but crossing triggers a false outcome if "out")  
    - **Start/Empty**: 0  
    - **Obstacle (X)**: Impassable.  
  - **Scoring**:  
    - **D/O**: Earn "karma points" = (utility of final cell) × 10.  
    - **IE**: Earn points if O’s path matches D’s path *exactly* (reveals inference accuracy).  

  ---

  ### **Demonstrator Utilities & Beliefs**  
  - **D1 (Baseline)**: `U(T)=10, U(F)=-10`. Believes bridge is intact.  
  - **D2 (Different Preference)**: `U(T)=10, U(F)=-10, U(1,1)=5`. Believes bridge intact.  
  - **D3 (False Belief)**: `U(T)=10, U(F)=-10`. **Secret Card**: *"Bridge at (1,2) is out—you cannot cross!"*  
  - **D4 (Slack Preference)**: `U(T)=10, U(F)=-10`. No false belief; moves randomly once.  

  > **Note**: D1/D2 have *different utilities* but same *optimal path*. D3’s false belief forces detour. D4 injects suboptimality.  

  ---

  ### **Rules**  
  1. **Demonstration Phase (15 min)**:  
     - D plans 3 moves (start → cell1 → cell2 → cell3).  
     - Must move orthogonally (no diagonals).  
     - D3 *must avoid bridge* (believes it’s out).  
     - IE watches but sees only moves (not utilities/beliefs).  

  2. **Inference Phase (15 min)**:  
     - IE writes a utility for each cell to "explain" D’s moves.  
     - Must assign a number to **every cell** (no blanks).  
     - **Constraint**: Trophy (T) must be highest utility in their function.  

  3. **Optimization Phase (15 min)**:  
     - O receives IE’s utility function.  
     - Plans path from start to maximize utility (3 moves).  
     - **Critical rule**: O must *strictly maximize* (no empathy!).  

  4. **Reveal & Report (15 min)**:  
     - D reveals true utility/belief.  
     - O runs path on grid.  
     - Group compares:  
       - D’s path vs. O’s path.  
       - True utility (D) vs. Inferred utility (O).  

  ---

  ### **Timeline (90 min)**  
  - **0:00–0:05** - Setup: Draw grid, assign roles (4D, 4IE, 8O), distribute cards.  
  - **0:05–0:20** - **Demo Phase**: D plans moves (quietly); IE observes.  
  - **0:20–0:35** - **Inference Phase**: IE writes utilities (use worksheets).  
  - **0:35–0:50** - **Optimization Phase**: O plans paths (2 per IE).  
  - **0:50–1:05** - **Reveal Phase**: Groups share outcomes (D’s truth → IE’s guess → O’s path).  
  - **1:05–1:30** - **Debrief**: Facilitate discussion → map to theory.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **IE copies moves, not utilities**:  
     - *Fix*: Force IE to assign utilities to *all cells* (even unvisited ones).  

  2. **O pulls punches**:  
     - *Fix*: Announce: *"Optimizers must maximize mechanically—no mercy!"*  

  3. **D3 ignores false belief**:  
     - *Fix*: Hand D3 a physical "bridge out" card + remind them.  

  4. **Path ties or confusion**:  
     - *Fix*: Ban diagonal moves; use tokens to mark paths.  

  ---

  ### **What the Game Can’t Replicate (Need Verbal Debrief)**  
  1. **Scale of underdetermination**:  
     - In-game utilities are small/discrete → real IRL has infinite functions.  
     - **Verbal bridge**: *"Here, utilities are few. In RL, the space is continuous—underdetermination is exponential."*  

  2. **Reward shaping equivalence**:  
     - Game utilities are absolute → real IRL has **reward shaping** (utilities equivalent up to state functions).  
     - **Verbal bridge**: *"Notice how adding +5 to (1,1) didn’t change D2’s path? That’s the identifiability problem: utilities are only defined up to transformations."*  

  3. **Partial observability**:  
     - Game beliefs are binary (bridge out) → real IRL has complex belief states.  
     - **Verbal bridge**: *"D3’s card was a ‘hard’ false belief. In practice, agents have probabilistic models of the world."*  

  ---

  ### **Debrief Script (Map Game → Theory)**  
  **Start with player experiences**:  
  > *"When D2 watched O maximize their inferred utility, what happened? Why was D1’s nightmare so extreme?"*  

  1. **Underdetermination (Indistinguishable Preferences)**:  
     - Highlight D1/D2: Same path, different utilities.  
     - **Theory link**: *"Behavior is a product of utility + beliefs + constraints. You can’t uniquely back out the utility."*  

  2. **Belief-Preference Confound**:  
     - Compare D1 and D3: Same utility, different paths (due to belief).  
     - **Theory link**: *"In IRL, we assume the agent’s world model is true. D3 shows how false beliefs get misread as preferences."*  

  3. **Optimization Nightmare & Near-Optimality**:  
     - Contrast D’s path with O’s: D3’s inferred utility → O rushes to "bridge" (catastrophe).  
     - **Theory link**: *"IRL assumes agents are near-optimal. Turn the knob: if D4 was ‘sloppy,’ how did IE’s utility change? What if we allow 80% optimality?"*  

  4. **Identifiability and Reward Shaping**:  
     - Note: *"Did IE add constants to utilities? Did it change the path? Why?"*  
     - **Theory link**: *"Utilities are only defined up to additive functions of state. IRL can’t disentangle them without priors."*  

  **Close**: *"Today’s nightmare—optimizing an inferred utility—is why alignment is hard. IRL can’t read minds; it guesses them from behavior, and guesses can go wrong."*  

  ---

  This design forces students to *feel* the gaps in IRL before naming them. The grid is simple to manage, and the three-phase structure (Demo → Infer → Optimize) mirrors real IRL pipelines. Run it as a fast-paced game, and the debrief will resonate deeply.
