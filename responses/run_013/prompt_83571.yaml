     This illustrates the nightmare.

     To illustrate underdetermination, we can point out that for the normal Demonstrators, the IEs might have inferred different utilities (e.g., one IE might have state3=5, another might have state1=1, and another might have state2=-1) and all are consistent with the observed behavior.

     And for the false belief, the IE infers a utility with high state4, which is not what the Demonstrator had.

     Debrief mapping:

          1. Two different preferences can lead to the same behavior: 
               - In the game: two different utility functions (e.g., one with state3=5 and one without) both led to the same behavior in the normal Demonstrators.

          2. False belief confounded with preference:
               - D4 had a false belief (bridge out) that caused them to go to state4, which was interpreted as them liking state4.

          3. Nightmare from optimization: 
