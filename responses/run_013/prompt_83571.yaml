          - The false belief Demonstrator might not follow the belief? They might try to go to state3 anyway. The facilitator should clarify the rules.

     What the activity can't reproduce:

          - The continuous and high-dimensional state space of real IRL.
          - The underdetermination at scale: in the game, the number of states is small, so the underdetermination is limited to a few degrees of freedom. In reality, it's a mess.
