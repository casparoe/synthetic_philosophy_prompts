          50-65 min: Report phase.
               - Each group (Demonstrator, IE, Optimizers) comes together and shares:
                   - The Demonstrator's intended path and the true outcome.
                   - The IE's inferred utility.
                   - The Optimizers' chosen path and the true outcome (using the true world rewards).

          65-90 min: Debrief and lecture.

     In the report phase, we will see:

          - For the normal Demonstrators: the IE's utility may vary, and the Optimizers' path may or may not be the same as the Demonstrator's. But in the true world, they will likely get the trophy if they go to state5.

          - For the false belief group: the Optimizers will go to state4 and get -10.

     Debrief points:

          1. Underdetermination of preferences by behavior:
               - Ask: "Did any two IEs for the normal Demonstrators write the same utility function? Why or why not?"
               - Point out: many different utility functions can explain the same behavior (e.g., as long as state5 is the highest and state4 is low, and the path taken is optimal).

          2. The belief-preference confound:
               - In the false belief case: the behavior (going to state4) was due to a false belief, but the IE interpreted it as a preference for state4.

          3. Nightmare from optimization:
               - When we optimized the inferred utility for the false belief case, we got a bad outcome.

          4. Near-optimality assumption: 
