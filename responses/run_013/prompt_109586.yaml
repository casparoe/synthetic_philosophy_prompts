answer: |-
  ### Decision Procedure for Resolving Analyst Disagreements  
  **Goal**: Resolve probability estimate disagreements in ≤10 minutes without both analysts present. Focus on whether the disagreement is legitimate (due to information, priors, or judgment) or requires correction (due to irrational updating).  

  ---

  #### **Procedure Steps**  
  | Step | Question to Ask                                                                 | Sufficient Answer                                                                                                 | If No/Unavailable                                                                                             | Fact or Judgment?             |  
  |------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|-------------------------------|  
  | 1    | Do both analysts have access to the **exact same information**?                 | Explicit list of sources/data each used. E.g., "Priya used public filings; Dev used internal cash-flow sheet."  | Proceed to Step 2. Disagreement may stem from information asymmetry.                                          | **Fact** (Objective check)   |  
  | 2    | If same information, do they **share priors**? (Base rates, historical data)    | Clear justification for priors. E.g., "Both use industry base rate of 20%."                                     | If priors differ and neither is unreasonable (e.g., not ignoring base rates), disagreement is legitimate. Stop. | **Judgment** (Assess reasonableness) |  
  | 3    | Did both update **rationally** from shared priors + information?                | Coherent explanation of how evidence shifted their prior. E.g., Bayes update or logical argument.               | If one cannot explain or violates coherence (e.g., double-counting), their estimate is flawed.                | **Judgment** (Assess logic)  |  
  | 4    | After sharing estimates + reasoning, **did either adjust** toward the other?    | One admits, "I hadn’t considered X; my estimate should be Y."                                                  | If no movement, disagreement may persist due to different models/priors.                                      | **Fact** (Check history)     |  
  | 5    | **Synthesis**: Why does disagreement survive?                                   | —                                                                                                                | —                                                                                                             | **Judgment** (Final call)    |  

  #### **How to Handle Dev’s Aumann Argument**  
  - **Response**: "Aumann assumes identical priors and common knowledge of posteriors. If Priya has different priors or you haven’t fully shared reasoning, disagreement is allowed. Let’s check Steps 1–3."  
  - **Why averaging isn’t licensed**: Aumann says rational agents *must* agree—it doesn’t endorse averaging. Averaging is a pragmatic hack for legitimate disagreements (e.g., different priors), not a resolution when one is irrational.  

  #### **Procedure Outcomes**  
  - **Stop & Accept Disagreement**: If priors differ (Step 2) or updating is rational but conflicting (Step 3).  
  - **Force Adjustment**: If one misupdates (Step 3) or has superior information (Step 1).  
  - **Boss Decides**: If procedure is inconclusive (e.g., ambiguous priors).  

  ---

  ### Worked Examples  
  #### **Case 1: Supplier Default (Priya 15% vs. Dev 40%)**  
  - **Context**: Dev saw internal cash-flow sheet; Priya used public data.  
  - **Procedure**:  
    1. **Step 1**: Information differs (Dev has cash-flow data). → *Asymmetry confirmed*.  
    2. **Stop**. No need for further steps. Outcome: Use Dev’s estimate (superior information).  
  - **JSON Summary**:  
    ```json  
    {  
      "case_id": 1,  
      "my_estimate": null,  
      "their_estimates": {"Priya": 0.15, "Dev": 0.40},  
      "same_information": false,  
      "share_priors": null,  
      "common_knowledge_reached": false,  
      "procedure_outcome": "Information asymmetry; Dev's estimate uses critical undisclosed data. Use 40%.",  
      "estimate_we_go_with": 0.40,  
      "does_disagreement_survive": false,  
      "who_decides": "procedure",  
      "procedure_limitation": "Assumes Dev's information is reliable. If cash-flow data is questionable, this fails."  
    }  
    ```  

  #### **Case 2: Drug Trial (Priya 15% vs. Dev 40%)**  
  - **Context**: Same trial data, but different weighting of subgroup analysis.  
  - **Procedure**:  
    1. **Step 1**: Same information → Proceed.  
    2. **Step 2**: Assume shared priors (e.g., base rate 50% for similar drugs). → Proceed.  
    3. **Step 3**: Both updated rationally (Priya: subgroups unreliable; Dev: subgroups predictive). → *No error*.  
    4. **Step 4**: No adjustment after sharing → *Disagreement survives*.  
    5. **Step 5**: Legitimate judgment difference. Average (27.5%) or choose based on track record.  
  - **JSON Summary**:  
    ```json  
    {  
      "case_id": 2,  
      "my_estimate": null,  
      "their_estimates": {"Priya": 0.15, "Dev": 0.40},  
      "same_information": true,  
      "share_priors": true,  
      "common_knowledge_reached": false,  
      "procedure_outcome": "Legitimate disagreement: same priors/info, rational but conflicting updates. Average or boss picks.",  
      "estimate_we_go_with": 0.275,  
      "does_disagreement_survive": true,  
      "who_decides": "boss",  
      "procedure_limitation": "Averaging hides true uncertainty. Track record data needed to break tie (not in procedure)."  
    }  
    ```  
  - **What you won’t like**: You must average or pick arbitrarily. The procedure *doesn’t* resolve epistemic differences.  

  #### **Case 3: Agree on 20% for Conflicting Reasons**  
  - **Context**: Priya (base rates); Dev (CEO’s nervousness on call).  
  - **Procedure**:  
    1. **Step 1**: Same information (both know base rates and call) → Proceed.  
    2. **Step 2**: Priors may differ (Priya: base rate as prior; Dev: prior adjusted by CEO’s tone). → *Likely different priors*.  
    3. **Step 3**: Both rational (base rates and behavioral cues are valid).  
    4. **Step 5**: Agreement is coincidental; reasoning is incompatible but number is same. Use 20% but flag fragility.  
  - **JSON Summary**:  
    ```json  
    {  
      "case_id": 3,  
      "my_estimate": null,  
      "their_estimates": {"Priya": 0.20, "Dev": 0.20},  
      "same_information": true,  
      "share_priors": false,  
      "common_knowledge_reached": false,  
      "procedure_outcome": "Coincidental agreement. Use 20%, but re-evaluate if new evidence contradicts either reasoning.",  
      "estimate_we_go_with": 0.20,  
      "does_disagreement_survive": true,  
      "who_decides": "procedure",  
      "procedure_limitation": "Does not resolve fragility. If CEO's nervousness is irrelevant, estimate is overconfident."  
    }  
    ```  

  ### Key Insights  
  - **Epistemic Constraints**: Steps 1 (information) and 3 (rationality) are core to truth-seeking.  
  - **Personality Management**: Steps 2 (priors) and 4 (adjustments) mitigate ego battles.  
  - **When Procedure Fails**: Inconclusive priors (Step 2) or ambiguous rationality (Step 3) → Boss decides.  
  - **Aumann Clarification**: The theorem only forces agreement if priors are identical AND updating is common knowledge. Otherwise, disagreement is allowed.  

  **Final Tip**: Pre-meeting, ask analysts to document: (1) information sources, (2) priors, (3) key evidence shifts. This accelerates Steps 1–3.
