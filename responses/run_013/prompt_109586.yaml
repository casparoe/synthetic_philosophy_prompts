prompt: |-
  I run a small forecasting shop — four analysts, we put probabilities on stuff for clients (will this supplier default, will this drug pass phase 3, will the bill get through committee). The thing that keeps eating my week is two of them disagreeing: one says 15%, the other says 40%, and then we burn an hour in a meeting that ends with someone saying lets just split the difference, or well, agree to disagree, and nobody's actually smarter at the end of it. Aumann's agreement theorem keeps coming up, mostly because one of my guys, Dev, has read about it and now uses it like a crowbar. His line is: if two rational people with the same information updated correctly, they'd already agree; so if he and Priya disagree, one of them is being irrational, and he's pretty sure its not him. I don't think that's what the theorem actually says, but I can never articulate the difference fast enough in a meeting to shut it down.

  So what I want from you is a decision procedure I can actually run, in order, when two of my people disagree on a number. Not a lecture about the theorem — a procedure. The questions to ask and in what order, what counts as a good enough answer to each, where it stops and says fine, one of you just has different priors and that's allowed, move on, and where it says no, one of you has to move, here's who and roughly how much. It has to handle the obvious hard cases: they've got genuinely different information; they've got identical information and read it differently; they've got different priors and neither is nuts; and the weird one where they agree on the number but for incompatible reasons. Be honest about which steps are real epistemic constraints and which are just me managing personalities, and mark the spots where the procedure can't get me an answer and I just have to decide as the boss.

  Constraints: I need to run it in about ten minutes, alone, before the meeting — so no steps that require both analysts in the room, and no asking them to go gather more data, that's not on the table. The final number goes to the client under my name, so ultimately I sign off. And it has to survive Dev: at least one step should tell me what to say when someone invokes the theorem to justify never moving at all. Also, somewhere in there, explain why just average the two numbers is not what the theorem licenses — I keep getting told to do that and it smells wrong to me.

  Then run it on three cases:

  1. Priya at 15% vs Dev at 40% on a supplier defaulting, where Dev has actually seen the internal cash-flow sheet and Priya hasn't.
  2. Same two, same spread, on a drug passing phase 3, where they've looked at the identical trial data and just weight the subgroup analysis differently.
  3. They agree it's 20%, but Priya got there from base rates for this class of supplier and Dev got there because the CEO sounded nervous on the call. I want to know if the procedure says anything useful here at all, or just shrugs.

  Include at least one case where the procedure tells me something I won't like — e.g. that I should move my own estimate, or that the disagreement is legitimate and I've been wrong to force a single number out of them.

  Format: write the procedure out in prose first, then give me the steps as a table with these columns — step, question to ask, what counts as a sufficient answer, if the answer is no or unavailable then, and one more column: fact question or judgement call. After the worked cases, give me a JSON object per case with fields: case_id, my_estimate, their_estimates, same_information, share_priors, common_knowledge_reached, procedure_outcome, estimate_we_go_with, does_disagreement_survive, who_decides, procedure_limitation.
reasoning: |-
  We are designing a decision procedure to resolve disagreements between two analysts (Priya and Dev) about probability estimates. The procedure must be run in about 10 minutes by the manager (you) before a meeting, without both analysts present, and without gathering new data. The goal is to determine whether the disagreement is legitimate or if one analyst should adjust their estimate, and to provide a way forward for the final number that goes to the client.

  Key constraints:
  - Aumann's agreement theorem: If two rational agents have the same priors and their posteriors are common knowledge, they cannot agree to disagree. However, in practice, disagreements can arise from different information, different priors, or different reasoning.
  - We must account for cases: different information, same information but different interpretation, different priors, and same estimate for incompatible reasons.

  The procedure will have steps that are either fact questions (objective) or judgement calls (subjective). We mark where the procedure can't resolve and you must decide as the boss.

  Procedure Outline:

  1. **Check for Identical Information**: Determine if both analysts have the same set of facts. If not, the disagreement might be due to information asymmetry.
  2. **Check for Common Priors**: If they have the same information, then check if they started from the same prior beliefs. If not, then disagreement is allowed by Aumann.
  3. **Check for Rational Updating**: If they have the same information and the same priors, then they should agree. If they don't, then one must have made a mistake in updating. We need to identify where the updating went wrong.
  4. **Check for Common Knowledge of Posteriors**: Even if they updated correctly, if they haven't shared their reasoning (so that posteriors are common knowledge), then disagreement can persist. But in our setting, they are sharing their estimates, so we are at least at mutual knowledge. However, Aumann requires common knowledge of posteriors and rationality.

  But note: We are not in a setting of iterative sharing (which Aumann assumes) because we are in a meeting and they state their estimates once. Also, we don't have the luxury of time for multiple rounds.

  Given the time constraint, we design a pragmatic procedure:

  Steps:

  1. **Step 1: Identify the Information Sets**
     - Question: Do both analysts have exactly the same set of information? (If not, what extra information does each have?)
     - Sufficient answer: List the key pieces of information each used. If one has a piece the other doesn't, note it.
     - If no or unavailable: Proceed to step 2, but note that information asymmetry might be the cause.
     - Type: Fact question (if you can get the list from each analyst separately) but might require some judgement if the information is complex.

  2. **Step 2: Check for Different Priors**
     - Question: If they have the same information, do they have the same prior for this type of event? (If not, what are their priors and why?)
     - Sufficient answer: A clear statement of their prior and why they hold it (e.g., base rate for the class, personal experience). If they have different priors and the priors are reasonable, then disagreement is legitimate.
     - If no or unavailable: If you cannot determine, then move to step 3.
     - Type: Judgement call (because priors are often not explicitly stated and you have to infer if they are reasonable).

  3. **Step 3: Examine the Updating Process**
     - Question: For the information they both have, did they update their prior in a rational way? (i.e., using Bayes or a coherent method)
     - Sufficient answer: Each should be able to articulate how the information changed their prior. If one made an error (e.g., ignored base rates, misinterpreted evidence), then that error should be corrected.
     - If no or unavailable: If you cannot identify an error, then the disagreement may be due to different priors or legitimate differences in judgement about the strength of evidence.
     - Type: Judgement call (requires evaluating the reasoning).

  4. **Step 4: Check for Common Knowledge of Posteriors and Rationality**
     - Question: Have they shared their reasoning (not just the estimate) so that each knows how the other arrived at their estimate? (This is an attempt to approach common knowledge.)
     - Sufficient answer: Each analyst should have heard the other's reasoning and had a chance to update. If they have and still disagree, then they must have different priors (if updating correctly) or one is irrational.
     - If no: Then the disagreement might be resolved by having them share reasoning (but note: we don't have time for that in the pre-meeting, so we might have to do it in the meeting or skip). In the pre-meeting, you might have to decide without this step.
     - Type: Fact question (whether they have shared reasoning) and then a judgement call on whether that sharing was sufficient.

  5. **Step 5: Resolve the Disagreement**
     - Based on the above, decide:
       - If they have different information: The analyst without the extra information should update if possible (but we can't gather new data, so we might use the informed estimate or average if the extra information is not clearly decisive). But note: if one has critical information the other doesn't, then that estimate is more credible.
       - If they have the same information but different priors: The disagreement is legitimate. You might average (but not because of Aumann, but as a pragmatic compromise) or choose the prior that is better grounded (e.g., based on base rates).
       - If they have the same information and priors but one made an updating error: Correct the error and use the corrected estimate.
       - If they have the same information and priors and updated correctly but still disagree: This should not happen by Aumann, so one must be irrational. But in practice, it might be that they didn't share reasoning sufficiently. If after step 4 they still disagree, you must decide.

  Additionally, we need to handle Dev's use of Aumann:

  - Aumann's theorem says that if two rational agents have the same prior and their posteriors are common knowledge, they must agree. But in practice:
    - They might not have the same prior.
    - They might not have the same information (though Aumann assumes they condition on the same information, but in reality, they might have private information).
    - Their posteriors might not be common knowledge (they state the number but not the reasoning, so they don't know why the other disagrees).

  Therefore, when Dev invokes Aumann to say Priya is irrational, you can counter:

  - "Dev, do you and Priya have exactly the same prior for this event? If not, then the theorem doesn't require agreement."
  - "Have you and Priya shared all your information and reasoning so that your posteriors are common knowledge? If not, then we haven't met the conditions of the theorem."

  Also, note that averaging is not what the theorem licenses. The theorem says they must agree, not that they should average. Averaging is a practical compromise when the disagreement is legitimate (e.g., different priors) but not when one has made an error.

  Now, we write the procedure in a table:

  | Step | Question to Ask                                                                 | What Counts as a Sufficient Answer                                                                 | If the Answer is No or Unavailable Then...                                                                 | Fact Question or Judgement Call? |
  |------|---------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------|----------------------------------|
  | 1    | Do both analysts have exactly the same set of information? If not, what extra information does each have? | A list of the key information each used. If one has a critical piece the other doesn't, note it. | Proceed to step 2, but note that information asymmetry is a likely cause of disagreement.                | Fact (if the information sets are known) |
  | 2    | If they have the same information, do they have the same prior? If not, what are their priors? | Clear statement of prior and justification (e.g., base rate, experience). If different and reasonable, disagreement is allowed. | If you cannot determine, proceed to step 3.                                                              | Judgement call (reasonableness of priors) |
  | 3    | For the shared information, did each update rationally from their prior?        | Each can explain the update (e.g., using Bayes, or a coherent argument). If one made an error, it should be identifiable. | If no error is found, then the disagreement may be due to different priors or legitimate judgement differences. | Judgement call (evaluate reasoning) |
  | 4    | Have they shared their reasoning (not just the estimate) so that each could update again? | They have explained their reasoning to each other and considered the other's argument.          | If not, then we haven't met the conditions for common knowledge. In the meeting, we might do this, but in pre-meeting, we skip. | Fact (if they have shared) and Judgement (if the sharing was adequate) |
  | 5    | Based on steps 1-4, what is the cause of disagreement?                          | - Different information: the estimate with more complete information is preferred. <br> - Different priors: average or choose the better prior. <br> - Updating error: correct the error. <br> - Still disagree after sharing: then by Aumann, one is irrational, but in practice, you may average or decide. | If the cause is unclear, you must decide as the boss.                                                   | Judgement call (synthesis) |

  Now, we run the procedure on the three cases:

  **Case 1: Supplier default (Priya 15%, Dev 40%)**

  - Dev has seen the internal cash-flow sheet and Priya hasn't.
  - Step 1: They do not have the same information. Dev has extra information (cash-flow sheet). 
    - This is the cause of the disagreement. 
    - Since Dev has more information, his estimate is likely more accurate. 
    - However, we must check: is the cash-flow sheet critical? Yes, because it directly relates to the supplier's ability to pay.
  - Step 2-4: Not needed because step 1 already shows information asymmetry.
  - Outcome: We should use Dev's estimate (40%) because he has critical information. But note: we cannot share the cash-flow sheet with Priya (due to constraints). So we go with 40%.

  **Case 2: Drug passing phase 3 (Priya 15%, Dev 40%)**

  - Same trial data, but they weight subgroup analysis differently.
  - Step 1: They have the same information (identical trial data). 
  - Step 2: Check priors. Do they have the same prior? Let's assume they both start from the base rate of phase 3 success for similar drugs (say 50%). But we don't have explicit priors. We must ask: 
    - If they have the same prior, then we go to step 3. 
    - But if they have different priors (e.g., Dev is more skeptical about this class of drugs), then that could be the cause. 
    - However, the problem says they weight the subgroup analysis differently, which is about updating. So we assume same prior? 
  - Step 3: They updated differently on the same data. This is a judgement about the strength of evidence. 
    - Priya might think the subgroup analysis is not predictive, while Dev thinks it is. 
    - Is one irrational? Not necessarily. They have different interpretations. 
    - Without a clear error, we cannot force one to change. 
  - Step 4: Have they shared their reasoning? If they have, and still disagree, then the disagreement is legitimate (different models of the world). If not, we might have them share in the meeting. But in the pre-meeting, we note that. 
  - Outcome: Since they have the same information and (assumed) same prior, but different updating without clear error, the disagreement is legitimate. You might average (27.5%) or choose one based on track record. But the procedure says: if no error, then different priors (in the sense of different models) are at play, and that's allowed. 

  **Case 3: They agree on 20%, but for incompatible reasons**

  - Priya: base rates for the class of supplier.
  - Dev: CEO sounded nervous on the call.
  - Step 1: They have the same information? Not exactly. Dev has the call, which Priya might not have (or if she does, she didn't weigh it the same). But they both have the base rate? 
    - Actually, they might have the same information set but are focusing on different parts. 
  - Step 2: They have the same prior? We don't know. 
  - Step 3: They updated differently. Priya used only the base rate (so her update was minimal) and Dev updated from the base rate (if he had one) based on the call. 
    - But if they both ended at 20%, then it's consistent? 
    - However, the concern is that their models are incompatible. For example, if the base rate is 20% and the call is neutral, then Dev's update is wrong. But if the base rate is different, then they started from different points. 
  - Outcome: The agreement is coincidental. The procedure might flag that their reasoning is not robust. But since they agree on the number, we can use 20%. However, we might want to check if one reason is invalid (e.g., if the CEO's nervousness is irrelevant, then Dev's reasoning is faulty, but the number is the same). 

