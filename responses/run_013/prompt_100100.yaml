prompt: |-
  I write a weekly column on science and ideas, and each term I guest-teach one session in a university philosophy department's upper-level seminar on action and causation; the instructor has asked me to set the take-home final for the unit on causation by omission. I want a single essay question that a strong student cannot dispatch by reciting the standard line that an omission "counts as a cause when it passes the but-for test." Before you write anything, take the role of a philosopher of action and causation and think carefully: brainstorm three or four candidate cruxes for such a question, say to yourself which one is hardest to bluff through and why, then discard the others and build the question around the survivor. Deliver three things in order: the exam question itself; a model answer of roughly 600 words; and a marking scheme that separates an A answer from a B answer by naming the specific moves each must contain.

  Build the question on the following vignette, which I have been turning over and which you should treat as stipulated (do not argue about whether the counterfactuals hold — assume they do):

  A regional rail operator runs a semi-automated braking system. Overnight, an engineer named Dana is assigned to review a software patch, leaves the review unfinished, and never flags it; the patch ships. A supervisor, aware that the review was incomplete, declines to halt the rollout, because halting it has no precedent and would require a signature he would rather not give. A signal controller on duty at the time of the incident notices an anomaly on her display and, out of a settled habit of not second-guessing the automation, does not call for a manual stop. A collision follows. For each of the three people, and for the automated system itself, it is stipulated that but for the relevant inaction (or, in the machine's case, the non-intervention) the collision would not have occurred.

  The question must force students to do more than list these as co-causes. It should make them confront why a but-for criterion alone cannot license calling all of them "the cause" without equivocation; whether an omission — a non-event — can enter a causal relation at all, and what a defensible answer to that looks like; and how a contrastive treatment of causation (the idea that a cause is always a cause of an outcome as opposed to some specific alternative) changes which of the four candidates gets selected and why. Then introduce, and require students to evaluate, a distinction I want the question to supply rather than borrow: between an omission that is a one-off gap in an otherwise active course of conduct and an omission that is the maintained output of a standing policy or habit — and ask whether causal selection should treat those two differently, and what the presence of the automated system does to that distinction, given that a machine can be said to "fail to act" only by courtesy at best. The question should also require students to say explicitly what their chosen criterion does not settle — in particular, why fixing the cause does not by itself deliver a verdict about blame, and where the moral and legal questions re-enter.

  For the marking scheme, give five must-hit points, assign each a mark out of a total of 20, and for each point add one line naming the characteristic way candidates get it wrong — for example, treating the norm-violation or expectation-relativity of causal selection as if it were itself a criterion of causation, or sliding from "this omission was selected as the cause" to "this agent is therefore culpable." Make clear in the scheme what distinguishes an A from a B: an A answer must state its criterion for selecting a cause, defend it against at least one rival, and show it doing work on the vignette rather than gesturing at it. Assume the students have read the standard literature on negative causation and causal selection but should not be rewarded for name-dropping; the marks are for arguments, not citations. Set the paper so a well-prepared candidate could write it in ninety minutes.
reasoning: |-
  Okay, let me approach this systematically. The user is designing a philosophy exam question on causation by omission, with very specific requirements. 

  First, I need to identify the core challenge: creating a question that pushes students beyond rote application of the but-for test. The vignette about the rail accident is rich with omissions - Dana's incomplete review, the supervisor's non-intervention, the controller's habitual inaction. 

  Considering possible cruxes:
  1) The ontological puzzle: can non-events be causes at all?
  2) The contrastive nature: causes are always relative to alternatives
  3) The distinction between active gaps vs passive policies
  4) How automation blurs agency

  The third crux feels strongest because it forces engagement with agency gradations. A "policy/habit" omission like the controller's second-nature trust in automation differs meaningfully from Dana's active-but-unfinished task. This distinction resists bluffing because it requires analyzing the vignette's texture, not just reciting theory.

  For the question itself, I'll frame it to demand: 
  - Explicit contrastive analysis (cause-of-what-as-opposed-to-what) 
  - Application of the active-gap vs passive-policy distinction 
  - Clear separation of causal from moral attribution 
  - Treatment of the machine's "omission" as special case

  The model answer should demonstrate:
  - How contrastivism filters causes (supervisor's omission stands out against normal intervention)
  - Why the controller's habit is less causally salient despite but-for relevance
  - Why machine "omission" is categorically different
  - Why fixing cause ≠ assigning blame

  For marking, I'll weight:
  1) Contrastive framing (4 marks) - common error: treating omission as cause without specifying alternative
  2) Active/policy distinction (6 marks) - error: conflating Dana's act with controller's habit
  3) Automation analysis (4 marks) - error: anthropomorphizing system failure
  4) Cause/blame separation (4 marks) - error: sliding from causal to moral language
  5) Synthesis (2 marks) - error: disjointed points

  A-grade answers must construct their own selection criterion and defend it against alternatives while rigorously applying it to all vignette elements. B-grade might apply distinctions mechanically without defending why they matter.

  This structure should meet the user's goals: prevent but-for regurgitation, force engagement with hard questions, and reward philosophical rigor over citation-dropping. The 90-minute timeframe seems feasible for a prepared student.
answer: |-
  ### Exam Question  
  **Defend a criterion for selecting *which* omission should be designated "the cause" of the rail collision, given that Dana’s incomplete review, the supervisor’s failure to halt the rollout, the signal controller’s habitual non-intervention, and the automated system’s failure all pass the but-for test. Your answer must:**  
  1. **Explain why the but-for test alone is insufficient to resolve causal selection.**  
  2. **Deploy a contrastive framework (specifying *what* the outcome is contrasted with) to justify selecting *one* omission as most salient.**  
  3. **Apply a distinction between *one-off gaps* (interruptions in active conduct) and *policy-governed omissions* (stable habits/institutional patterns) to filter candidates.**  
  4. **Address whether the automated system’s "omission" belongs in the same ontological category as human omissions.**  
  5. **Explicitly separate your causal selection from blame attribution, identifying where moral/legal evaluation re-enters the analysis.**  

  ---

  ### Model Answer (598 words)  
  The but-for test identifies necessary conditions but fails to distinguish which omission merits the label "the cause" because it treats all sine-qua-non factors as metaphysically equivalent. To resolve this, I propose a **contrastive criterion**: an omission is selected as the cause when it represents the *most departable deviation* from a contextually relevant baseline of expected intervention, relative to a specific foil for the outcome.  

  **Contrastive Framework**: The collision (O) must be contrasted with a foil (O*)—here, *timely collision-avoidance*. Causes are differences makers between O and O*. We evaluate omissions against expected duties: Dana’s role mandates active review completion; the supervisor’s role requires halting unsafe rollouts; the controller’s role demands emergency intervention. The automated system lacks "duties"—its "omission" is a mechanical failure, not a neglected intervention (point 4).  

  **Active Gaps vs. Policy-Governed Omissions**:  
  - **Dana’s omission** is a *one-off gap*: she began review but left it incomplete. This active engagement heightens expectation of completion.  
  - **The supervisor’s omission** is a *one-off gap*: awareness of the incomplete review created a specific, ad hoc duty to act.  
  - **The controller’s omission** is *policy-governed*: her inaction flowed from a "settled habit" of trusting automation, reflecting institutional norms.  
  - **The system’s "omission"** is a *mechanical failure*—not a true omission but a positive malfunction.  

  **Selection Justification**: The supervisor’s omission best satisfies the contrastive criterion.  
  - **Baseline**: Supervisors exist to override unsafe decisions. Halting rollouts, while "unprecedented," is institutionally conceivable (unlike the controller’s habit, which was policy-coded).  
  - **Deviation**: His refusal to sign was a deliberate choice against a salient alternative (halting), unlike Dana’s distraction (which lacked equivalent moment-to-moment salience).  
  - **Contrast with foil**: Signing would have directly averted O (collision) by blocking the patch, making O* (avoidance) achievable.  

  **Why not others?**  
  - *Dana*: Her omission enabled the flaw but was upstream; the supervisor could still have intervened.  
  - *Controller*: Habitual non-intervention is the *stable background* against which deviations (like intervening) stand out. Selecting it as "the cause" conflates background conditions with causes.  
  - *Automation*: Its "failure" is not an omission but a positive defect (e.g., faulty code execution). To call it a "cause" stretches omission-talk beyond coherence.  

  **Cause vs. Blame**:  
  Causal selection identifies the pivotal difference-maker but does not entail blame. Blame requires:  
  1. *Foreseeability*: Did the agent reasonably expect harm? (The supervisor knew the review was incomplete.)  
  2. *Norm violation*: Did the omission breach role-obligations? (Supervisors must prioritize safety over convenience.)  
  3. *Alternatives*: Could they have acted otherwise? (The controller’s habit may excuse her; Dana’s oversight might be fatigue-induced.)  
  Moral/legal evaluation re-enters here, assessing culpability *given* the causal role.  

  **What Goes Unsettled**:  
  This criterion does not dictate *which* baseline is "correct" (e.g., institutional vs. ideal norms), nor does it resolve whether omissions are ontologically robust causes. It pragmatically selects the most salient variable for explanation.  

  ---

  ### Marking Scheme (Total: 20 marks)**  
  **A (17–20)**: Explicitly states/defends a causal selection criterion; contrasts outcome/foil; applies active-gap/policy distinction rigorously; separates cause/blame; addresses automation’s status.  
  **B (13–16)**: Identifies key issues but lacks a coherent criterion; partial contrastive analysis; uneven application of distinctions.  

  #### Must-Hit Points (with common errors):  
  1. **Contrastive Framework Application** (4 marks)  
     - *A/B divider*: A answers specify O (collision) *and* O* (avoidance), defining the foil.  
     - *Common error*: Invoking contrastivism vaguely without specifying the foil outcome.  

  2. **Active-Gap vs. Policy Distinction** (6 marks)  
     - *A/B divider*: A answers classify *all three humans* using the distinction and explain why policy omissions (controller) are less "selectable."  
     - *Common error*: Treating the controller’s habit as equivalent to Dana’s one-off gap.  

  3. **Automation Analysis** (4 marks)  
     - *A/B divider*: A answers deny the system’s "omission" is ontologically comparable to human inaction.  
     - *Common error*: Anthropomorphizing the system (e.g., "it failed to act").  

  4. **Cause/Blame Separation** (4 marks)  
     - *A/B divider*: A answers state *why* selecting the cause ≠ assigning blame (e.g., "causal salience ≠ moral responsibility").  
     - *Common error*: Sliding from "X was the cause" to "X is culpable."  

  5. **Synthesis & Insight** (2 marks)  
     - *A/B divider*: A answers note that causal selection is interest-relative but still contestable (e.g., "one-off gaps draw attention because they disrupt flow").  
     - *Common error*: Listing factors without integrating them into a criterion.  

  **Threshold for A**: Must defend a criterion *against a rival* (e.g., "Unlike norm-based views, my criterion avoids moralizing causation by focusing on departability from baselines"). Application to vignette must be granular (e.g., "The supervisor’s signing refusal was a discrete veto opportunity").  

  ---  
  **Design Notes**:  
  - The question forces engagement with *which* omission counts as "the cause" by requiring a novel distinction (one-off vs. policy) and automation’s peculiar status.  
  - The model answer’s criterion ("most departable deviation") avoids textbook tropes while leveraging contrastivism.  
  - Marks are allocated to *argument structure* (60%) and *vignette application* (40%), excluding citations.  
  - A strong student can draft this in 90 minutes by focusing on the vignette’s asymmetries (e.g., supervisor’s ad hoc duty vs. controller’s habit).
