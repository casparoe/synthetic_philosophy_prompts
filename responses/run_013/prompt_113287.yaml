  Below is a complete workshop design that meets your requirements. Participants experience the unilateralist's curse through a hands-on activity without prior explanation. The debrief uses session data to reveal the structure and dilemmas.

  ---

  ### **Workshop Title**: "Group Decision Lab: The Hidden Trap"

  ### **Materials**:
  - **18 envelopes** for each round (pre-prepared as below)
  - **Blank decision slips** (small papers)
  - **Pens**
  - **Scoreboard poster** (visible to all)
  - **Tally sheets** (for facilitator)
  - **Timer**

  ---

  ### **Setup**:
  - **State**: Fixed as "BAD" for both rounds (unknown to participants).
  - **Signal distribution** (based on state BAD):
    - **GO signal**: 20% chance (misleading evidence to act)
    - **CAUTION signal**: 80% chance (correct evidence not to act)
  - **Payoff scheme**:
    - Action taken in BAD state: **-30 points**
    - Action not taken (any state): **0 points**
    - *(State A (good) is discussed in debrief but not used in rounds)*

  ---

  ### **Timeline** (90 minutes total):
  #### **1. Introduction (10 min)**  
  - **Rules**:  
    - "We’re simulating high-stakes team decisions. Two rounds. Each round, you’ll get an envelope. Do NOT open until instructed."  
    - "Some are **eligible** to act each round. If eligible, you get a **private signal** (GO or CAUTION)."  
    - **Decision rule**: "If you get GO → Write **ACT** on your slip. If CAUTION → Write **DON’T ACT**."  
    - **Outcome**: "Action happens if **any eligible person** writes ACT. Consequences affect everyone."  
    - **Payoffs**: "Points depend on the hidden state (revealed later). Goal: Maximize group points. Losses wipe out gains!"  
    - **Critical**: "No talking. No sharing signals. Decisions are private and simultaneous."  

  #### **2. Round 1: Small Team (3 eligible)** (15 min)  
    - **Eligibility**: Randomly distribute 3 "ELIGIBLE" envelopes (containing **CAUTION** signals) and 15 "NOT ELIGIBLE" envelopes.  
    - **Process**:  
      - Eligible open envelopes, see signal, write ACT/DON’T ACT on slips.  
      - Collect slips in a box.  
      - **Announce outcome**: "Action taken?" (Check slips: If any ACT → "YES"; else "NO").  
      - *Expected*: All CAUTION → No action → **0 points**. Update scoreboard.  

  #### **3. Round 2: Full Team (18 eligible)** (15 min)  
    - **Eligibility**: Distribute 18 envelopes: 4 with **GO**, 14 with **CAUTION** (pre-randomized).  
    - **Process**:  
      - All write decisions (GO→ACT; CAUTION→DON’T ACT).  
      - Collect slips.  
      - **Announce outcome**: "Action taken?" (Likely YES) → **-30 points**. Update scoreboard.  
      - *Expected total*: **-30 points** (0 from R1 + -30 from R2).  

  #### **4. Debrief** (50 min)  
    - **Reveal state**: "Both rounds: State was **BAD** (action harmful)."  
    - **Show signals**:  
      - *R1*: "Eligible, raise hands. Who saw GO?" (0 hands).  
      - *R2*: "Who saw GO?" (4 hands).  
    - **Map to curse structure**:  
      - **Private evidence**: "Each GO signal (20% chance) made acting seem *individually* reasonable (expected +2 points)."  
      - **Insensitivity to group size**: "Did your rule change in R2? *No*. You acted on GO even with 17 others."  
      - **Group outcome shift**: "R1 (3 eligible): 49% chance of action. R2 (18): 98% chance. Why? **One GO suffices**."  
      - **Asymmetry**: "Harm from wrong action (-30) > gain from right action (+10). More actors → higher risk of costly error."  
      - **Curse**: "The **most willing** person (with GO) decided for everyone. Group loses more with more 'helpers'!"  
    - **Live dilemma**:  
      - "Remedy: Should you **raise your bar** knowing others might act? But is this wise restraint... or **free-riding**?"  
      - Debate: "If you have GO, is it ethical to stand down? What if everyone does?"  

  ---

  ### **Predictable Failures & Fixes**:
  1. **Collusion**:  
     - *Risk*: Whispering signals breaks independence.  
     - *Fix*: Stress "NO TALKING" upfront. If violation, void the round and restart.  

  2. **Everyone stands down**:  
     - *Risk*: In R2, all CAUTION participants (low chance) → no action.  
     - *Fix*: Pre-set R2 signals to include GO (as above). If still no action, use in debrief: "Lucky escape! But 98% expected failure."  

  3. **Group too small/uniform**:  
     - *Risk*: R1 signals accidentally include GO → action happens.  
     - *Fix*: Pre-set R1 to CAUTION-only. If error occurs, note: "Even small teams can err by chance."  

  4. **Outcome indistinguishable from noise**:  
     - *Risk*: R1 action (due to bad luck) and R2 no action → no contrast.  
     - *Fix*: Control signals (as above). If anomalies, focus debrief on *probabilities* over outcomes.  

  5. **Participant spoils it early**:  
     - *Risk*: Someone says, "Don’t act! More people means more risk!"  
     - *Fix*: Intervene: "Follow your private evidence only." Isolate the person if persistent.  

  ---

  ### **What the Activity Can’t Replicate** (to address in debrief):  
  **Real-world evidence isn’t binary**. Participants use fixed GO/CAUTION, but in reality, evidence is nuanced. You must clarify:  
  > "In practice, you’d weigh signal strength and adjust your bar for group size. But this is hard alone—hence the curse. Deference or voting may help, but they’re not always feasible."  

  ---

  ### **Why This Works**:  
  - **Experience-first**: Participants *feel* the curse via point losses and signal reveals.  
  - **Contrast**: Small vs. large team eligibility highlights the compounding risk.  
  - **Asymmetry**: -30 loss for wrong action vs. 0 for inaction creates stakes.  
  - **Noise-free**: Pre-set signals ensure the curse manifests visibly.  

  Run this as written, and the curse will sting—then the debrief turns that sting into insight.
