answer: |-
  Here’s a focused 2-page research proposal based on your core insight, structured to meet your requirements. It refines your hunch into a testable question and outlines a concrete plan.

  ---

  **Research Proposal: Is Propositionalism the Root Cause of Logical Omniscience?**

  **1. Problem Statement & Core Question**  
  Logical omniscience (LO)—the unrealistic assumption that agents know all logical consequences of their beliefs—persists as a foundational problem in formal epistemology (e.g., possible worlds, structured propositions, probabilistic models). Standard solutions (impossible worlds, awareness, bounded resources) mitigate specific symptoms but fail to eliminate LO entirely. **This project tests the hypothesis that LO arises not from incidental modeling choices, but from *propositionalism* itself: the assumption that belief is a binary relation between an agent and a proposition (understood as a sets-of-worlds, structured object, or truth-value bearer).**  

  **Research Question:**  
  *Does logical omniscience persist in propositionalist frameworks even after applying standard fixes (impossible worlds, awareness, bounded resources), suggesting that propositionalism is the necessary condition for LO?*  

  **2. Why Existing Responses Leave This Open**  
  Current solutions address LO *within* propositionalist commitments and thus cannot test the core hypothesis:  
  *   **Impossible worlds:** Adds non-standard interpretations but retains belief-as-proposition (e.g., "B(P)" still refers to a set of worlds, standard or not).  
  *   **Awareness:** Restricts belief to "considered" propositions but still defines belief as awareness *of a proposition*.  
  *   **Bounded resources:** Models computational constraints but evaluates belief *in propositions* under those constraints.  
  These patches treat LO as an *implementation flaw* within propositionalism, not questioning whether modeling belief as a relation to *propositions* inherently requires idealization. Crucially, none formally demonstrate that LO vanishes if propositionalism is abandoned.  

  **3. Methodology: Testing Propositionalism’s Role**  
  We will construct minimal formal case studies where LO re-emerges *despite* standard fixes, directly attributable to propositionalist assumptions. Focus: **Small-scale, comparative modeling**.  

  *   **Step 1: Identify LO-Prone Scenarios**  
      Select 2-3 paradigmatic LO failure cases where distinct presentations of the *same proposition* matter:  
      *Case 1 (Mathematical):*  
      - P: "1729 is the smallest number expressible as the sum of two cubes in two different ways."  
      - Q: "1729 = 10³ + 9³ = 12³ + 1³"  
      *Case 2 (De Se / Indexical):*  
      - P: "The Prime Minister is late." (Believed by an agent unaware they *are* the PM).  
      - Q: "I am late." (Presented to the PM agent).  
      P and Q express the same proposition (in context) but differ cognitively.  

  *   **Step 2: Model Cases in Patched Propositionalist Frameworks**  
      For each case, formally model belief using:  
      a) **Impossible Worlds Patch:** Construct a model where the agent believes the proposition expressed by P in some worlds but not Q (or vice versa).  
      b) **Awareness Patch:** Define an awareness set containing P but not Q (or vice versa).  
      c) **Bounded Resources Patch:** Define a complexity metric where deriving Q from P (or vice versa) exceeds the agent’s capacity.  
      *Goal:* Show the agent can rationally believe P, disbelieve/not consider Q, while P and Q are logically equivalent (same proposition).  

  *   **Step 3: Force LO Despite Patches**  
      Demonstrate how *propositionalism* recreates LO:  
      - In (a), if the model respects logical equivalence *anywhere* (e.g., for other inferences), LO can re-emerge for P/Q under closure properties.  
      - In (b), if "awareness of proposition X" allows substitution of *any* presentation of X, LO returns.  
      - In (c), if the proposition itself (not its presentation) is the object of belief, resource bounds become arbitrary unless tied *directly* to presentation.  
      *Key Move:* Show that to block LO consistently, the patches must implicitly track *presentations* (formats), undermining strict propositionalism.  

  **4. Expected Outcomes & Falsifiability**  

  *   **Success (Supports Hypothesis):**  
      - Concrete demonstration that in the worked cases, LO persists in patched propositionalist models *because* belief is tied to the proposition, not the presentation.  
      - A general argument that any propositionalist framework must either (i) suffer LO or (ii) smuggle in presentation-sensitivity (e.g., via ad hoc world-relative awareness or complexity defined over syntactic forms).  

  *   **Failure (Hypothesis Falsified):**  
      **Clear Failure Condition 1:** A standard patched propositionalist model (e.g., impossible worlds with carefully defined "worlds" and belief relation) successfully prevents LO in the core cases *without* relying on presentation features, showing propositionalism is not inherently LO-prone.  
      **Clear Failure Condition 2:** Rigorous analysis reveals that LO in the cases stems solely from *specific, avoidable* modeling choices within propositionalism (e.g., global closure rules), not from the core commitment to propositions.  
      **Clear Failure Condition 3:** Existing literature (e.g., specific dynamic epistemic logics, explicit representational models) already conclusively demonstrates that propositionalism *can* be implemented without LO, using patches that don’t implicitly rely on presentations.  

  **5. Scope & Feasibility (3 Months Part-Time)**  
  *   **Focus:** 2-3 core cases, modeled in 1-2 patched frameworks (e.g., impossible worlds + awareness). Avoid exhaustive survey.  
  *   **Deliverable:** A workshop paper (8-10 pages) presenting the cases, models, and argument.  
  *   **Limits:** Will *not* develop a full non-propositionalist alternative. Focus is diagnostic: exposing a problem in existing paradigms.  
  *   **Timeline:**  
      - Month 1: Refine case studies, formalize baseline models.  
      - Month 2: Apply patches, test for LO resurgence.  
      - Month 3: Synthesize results, draft paper.  

  **6. Honest Assessment of the Hunch**  
  *   **Plausible & Underexplored:** Your core insight—that LO stems from ignoring the *mode of presentation*—is philosophically sound (echoing Frege) and is **not** the explicit target of mainstream LO solutions. While some non-propositionalist approaches exist (e.g., syntactic, conceptual role semantics), they rarely frame LO as a *direct consequence of propositionalism itself*.  
  *   **Risk:** The thesis might appear "trivially true" to some (if presentations *just are* the non-propositional elements needed), or "trivially false" to others (if propositionalism is defined so broadly it encompasses presentations). **Mitigation:** Ground the argument in *specific failures* of existing propositionalist+patch frameworks to handle the cases.  
  *   **Not Obviously Wrong or Already Solved:** This connects to debates about Fregean senses, structured propositions, and mental files, but the *specific diagnostic claim*—that propositionalism *as such* is the necessary condition for LO—is a fresh and testable angle on the problem.  

  ---

  **Why this works:**  
  1.  **Precise Question:** Targets propositionalism’s *necessity* for LO via failure cases.  
  2.  **Critique of Patches:** Shows they operate *within* propositionalism.  
  3.  **Concrete Method:** Small formal models + worked cases expose the core issue.  
  4.  **Falsifiable:** Clear success/failure conditions tied to model behavior.  
  5.  **Fits Scope:** Focused on diagnosis, not building a new framework.  

  This proposal directly tests your hunch without overclaiming. Success would reframe the LO debate; failure would provide valuable clarification. Good luck!
