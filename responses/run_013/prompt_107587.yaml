prompt: |-
  At Nuremberg and Tokyo the victorious powers tried the vanquished for waging aggressive war and for atrocities that were lawful under the law of the states the defendants served; the charters the victors wrote held that obedience to superior orders did not free a defendant from responsibility, though it could mitigate punishment, and the charge of aggression was brought only against the defeated, never against the victors' own leaders. Nearly half a century later, German courts convicted East German border guards for shootings that the law of their own state required, on the reasoning that a statute whose injustice is intolerable is not law at all. What conception of legal validity does this line of practice presuppose — that a norm counts as law only if its content survives a moral test, so that the earlier statutes were never law, or that validity rests on enactment alone, in which case the tribunals were applying new law to old acts? Are the two halves consistent, and can a court that exempts its own side apply a moralized test of validity without bad faith? Say which conception the practice strictly requires, which it merely accommodates, and what would have to change if the practice were made consistent.
reasoning: |-
  Okay, let me tackle this complex legal philosophy question. The user presents a layered historical and jurisprudential puzzle about legal validity across different postwar tribunals. 

  First, I need to unpack the core tension: the Nuremberg/Tokyo approach versus the later German reunification cases, both dealing with retroactive application of moral principles. The user is essentially asking whether these cases share a coherent theory of what makes law "valid" - is it purely procedural enactment, or does it require moral substance?

  Hmm, the Nuremberg Charter's rejection of the "superior orders" defense while still allowing mitigation seems contradictory at first glance. If the laws were valid when enacted, why punish at all? But if invalid, why mitigate? This suggests Nuremberg wasn't fully committing to natural law theory. 

  Then there's the East German border guard cases where German courts explicitly invoked Radbruch's "intolerable injustice" formula. That's a much stronger natural law position declaring immoral statutes non-law ab initio. 

  The real thorn is the victors' justice problem: applying standards only to the defeated. If Nuremberg truly believed in moral validity tests, shouldn't Allied firebombing also be examined? The selective application reeks of hypocrisy that strains any consistent natural law claim.

  I think the user wants more than just classification - they're probing whether international law can ever be impartial. The unspoken question might be about power dynamics in legal systems. When they ask about "bad faith," they're really questioning legitimacy itself.

  For the consistency repair... if courts want moral validity tests, they must either apply them universally (including to victors) or abandon retroactivity. Otherwise it's just "might makes right" disguised as justice. The solution probably lies in prospective rather than retroactive application of moral standards.
answer: |-
  This line of legal practice reveals a complex, inconsistent interplay between **legal positivism** (validity based on enactment alone) and **natural law** (validity requiring moral legitimacy). Here's the strict conception required, what is accommodated, and what consistency would demand:

  ### 1. **Conception Strictly Required: Modified Legal Positivism**  
     - **Validity rests on enactment**, but courts may apply *new moral principles retroactively* to override past "valid but unjust" laws.  
     - Nuremberg/Tokyo: Nazi/Japanese laws were *valid* when enacted (positivism), but the tribunals imposed new norms (crimes against humanity, aggression) retroactively. Mitigation for superior orders acknowledged the defendants' reasonable belief in legality at the time.  
     - East German cases: The Berlin Wall shootings were legal under GDR law, but reunified Germany applied *new* constitutional principles retroactively, treating prior laws as void *as if they never existed* (a natural law fiction).  

  ### 2. **Conception Accommodated: Natural Law (Radbruch Formula)**  
     - The East German courts explicitly invoked Gustav Radbruch’s theory: **laws lose validity if "intolerably unjust"** (e.g., shooting unarmed civilians).  
     - This moralized test was *accommodated* post-reunification but was *not* strictly applied at Nuremberg. The Allies never declared Nazi laws universally invalid; they prosecuted based on new international norms.  

  ### 3. **Inconsistencies**  
     - **Selective Prosecution**: Nuremberg charged aggression *only* against defeated Axis leaders, ignoring Allied acts (e.g., Soviet invasion of Poland). This violates natural law’s universalism.  
     - **Retroactivity vs. Invalidity**: Nuremberg created *new* law (aggression as a crime) but applied it retroactively. East German courts treated GDR laws as *always invalid* (natural law), despite their prior enactment.  
     - **Bad Faith**: A court exempting its own side while applying a moral test (e.g., not prosecuting Allied firebombing) *cannot* credibly claim natural law. It reveals the test as a tool of victors’ justice.  

  ### 4. **Requirements for Consistency**  
     To resolve contradictions:  
     - **Universal Moral Standards**: Apply the same validity test to *all* actors (victors/vanquished). If aggression is criminal, prosecute it universally.  
     - **Clarity on Retroactivity**: Choose one approach:  
       - *Positivist*: Admit new laws are applied retroactively (mitigation for reliance on prior law).  
       - *Natural Law*: Declare immoral statutes void *ab initio* (but apply this uniformly, not just to defeated states).  
     - **Judicial Impartiality**: Courts must either reject moralized validity tests *or* apply them neutrally, regardless of political power.  

  ### Conclusion  
  - **Strictly Required**: Enactment-based validity with retroactive override (modified positivism).  
  - **Accommodated**: Natural law (Radbruch Formula) in limited contexts (e.g., post-GDR).  
  - **For Consistency**: Either (a) abandon moralized validity tests, or (b) apply them universally and impartially, rejecting victors’ impunity. The current practice uses moral rhetoric instrumentally, masking power politics with legal philosophy. Without universal accountability, moralized tests remain acts of bad faith.
