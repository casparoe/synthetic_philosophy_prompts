  I'm taking a course on ancient philosophy and we've just read Aristotle's On Interpretation, chapter 9, the bit about the sea battle. I think I get the basic setup: Aristotle asks us to consider the statement that there will be a sea battle tomorrow. He says that if this statement is true now, then it's necessary that there will be a sea battle tomorrow; if it's false now, then it's necessary that there won't be. So either way, the future is fixed and nothing is up to us. But then he seems to want to resist that conclusion, and he starts talking about how not everything is true or false, or something about the principle of excluded middle not applying to future contingents. I'm confused about exactly what his solution is suposed to be. Is he saying that the statement that there will be a sea battle tomorrow is neither true nor false right now? And if so, how does that help? Because it still seems like the battle will either happen or not, so one of the two predictions will turn out to have been correct. Also, I don't see why he thinks truth implies necessity in the first place — that seems like the real mistake. But maybe I'm missing something about how ancient logic worked. I've been reading alot about this online and it just makes me more confused. Here's a concrete case that bugs me: suppose I write down a prediction on a sealed envelope today, saying that there will be a sea battle tomorrow, and I open it the day after. If the battle happens, was my prediction true when I wrote it? Aristotle seems to want to say no, but that feels weird — it was either going to happen or not, so how could it not have been true? Could you walk me through the passage and explain what Aristotle is actually doing? I don't need citations or anything, just a clear explanation.

