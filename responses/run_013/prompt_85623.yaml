     - Debrief: 15 min (to have time for discussion and the final point)

     Total: 45 + 15 = 60, then 5+5=10, then 15: total 90.

     Alternatively, we can do:

       0-5: Intro
       5-10: Setup
       10-25: Training (15 min)
       25-30: Explain fifth round
       30-35: Fifth round trials
       35-50: Debrief (15 min)

     But wait, 50 minutes? We need 90.

     I see: the training is 15 minutes for all teams at the same time, so it takes 15 minutes of the session. Similarly, the fifth round trials are done simultaneously and take 5 minutes. Then the debrief is 15 minutes. So total time:

       5 + 5 + 15 + 5 + 15 = 45 minutes? That's not 90.

     I must have miscalculated. Let's do:

       Introduction: 5 min
       Team setup: 5 min
       Training: 15 min
       Fifth round explanation and trials: 10 min (explanation 2 min, trials 5 min, wrap-up 3 min)
       Debrief: 15 min

     Total: 50 min. We have 40 minutes left? I think I doubled the timing in my head.

     We have 90 minutes, so we can extend each phase:

       Introduction: 10 min (to explain more carefully)
       Team setup: 10 min (to allow learners to read and understand their instructions, and for teams to organize)
       Training: 30 min (so teams can do more trials and really see how the learner progresses)
       Fifth round: 15 min (5 min explanation, 10 min for trials and observation)
       Debrief: 25 min (to allow each team to share and for deep discussion)

     Total: 10+10+30+15+25 = 90.

     This is better.

   7. What will go wrong:

     a) The learner might not follow the instructions exactly and use their own intelligence. 
          Solution: Emphasize to the learners that they must follow the instructions mechanically, without adding their own understanding.

     b) The teachers might get frustrated and try to cheat (e.g., by using more signals). 
          Solution: The facilitator must circulate and enforce the rules.

     c) The task might be too easy or too hard. 
          We designed it to be simple, but for some learners it's impossible (Learner 2 and 3 with only irrelevant senses). That's the point.

     d) In the fifth round, the learner might not reset and might have a hard time adapting. 
          That's also the point: Learner 1 can adapt quickly, Learner 4 will change immediately based on tokens, Learner 2 and 3 will struggle.

     e) Time management: the teams might not finish in 30 minutes. 
          Solution: After 30 minutes, call time and move on.

   8. Materials in detail:

     For each team:
       - One sealed envelope for the learner, containing the instructions for one of the four learner types.
       - A set of green and red tokens (at least 50 of each).
       - A card for the light: one side labeled "ON" (e.g., with a bright color) and the other "OFF" (dark).
       - Two buttons: one labeled "A", one labeled "B" (or cards with A and B that the learner can point to).
       - A card for the teachers with the rule: "Rule: When the light is ON, the learner should press button A. When the light is OFF, the learner should press button B."

     For the fifth round, the rule card is replaced with: "New Rule: When the light is ON, press button B. When the light is OFF, press button A."

   9. Learner instructions (sealed):

     Learner 1 (Good senses, state-based learner):
          INSTRUCTIONS FOR LEARNER 1
          - You can only see whether the light is ON or OFF.
          - You do not see anything else.
          - You have a memory for what to do when the light is ON and what to do when it is OFF.
          - Initially, you do not know what to do. So for the first trial:
               . If the light is ON, choose randomly between A and B.
               . If the light is OFF, choose randomly between A and B.
          - After each trial:
               . If you receive a GREEN token, then remember the action you just did for that light state (ON or OFF) and do the same action next time you see the same light state.
               . If you receive a RED token, then remember to do the opposite action next time you see the same light state.

          Example: 
            Trial 1: light ON, you choose A. If you get GREEN, then next time light ON you do A.
            If you get RED, then next time light ON you do B.

     Learner 2 (Limited senses: irrelevant feature):
          INSTRUCTIONS FOR LEARNER 2
          - You can only see the table color. The table color is always green.
          - You have a memory for what to do for the table color green.
          - Initially, you do not know what to do. So on the first trial, choose randomly between A and B.
          - After each trial:
               . If you receive a GREEN token, then remember the action you just did and do the same action next time.
               . If you receive a RED token, then remember to do the opposite action next time.

          Note: The table color does not change, so you always have the same state.

     Learner 3 (Relentlessly literal):
          INSTRUCTIONS FOR LEARNER 3
          - You can see the light (ON/OFF) and the table color (green). 
          - You remember every specific combination you have seen and what action you took and whether it was rewarded or punished.
          - For each trial, you see a combination (e.g., light ON and table green).
          - If you have never seen this combination before, choose randomly between A and B.
          - If you have seen this combination before:
               . If the last time you did an action for this combination you got a GREEN token, then do that same action.
               . If the last time you did an action for this combination you got a RED token, then do the other action (if you did A last time, do B; if B, do A).
          - If you have seen the combination more than once, you only remember the last outcome.

          Note: because the table color is always green, the combinations are:
               Combination 1: light ON, table green.
               Combination 2: light OFF, table green.

     Learner 4 (Sensitive to token order):
          INSTRUCTIONS FOR LEARNER 4
          - You can see the light (ON/OFF), but you ignore it because you are sensitive to the order of tokens.
          - You remember only the last token you received and the last action you did.
          - Start by pressing A on the first trial.
          - After each trial:
               . If you receive a GREEN token, then next time do the same action as you did last time.
               . If you receive a RED token, then next time do the opposite action (if you did A, do B; if B, do A).

          Note: you completely ignore the light state.

   10. Debrief talking points:

       - Ask each team: How successful was your learner in the training round? In the fifth round?
       - Ask the learners: How did it feel? Did you feel like you were learning?
       - Reveal each learner type and have the instructions read.

       - Map to Turing:
           - The initial setup (the learner's senses and learning rules) is the "child machine" designed by the engineer. This design determines what the machine can learn and how.
           - The education is the process of giving rewards and punishments (tokens) based on the machine's actions.
           - The resulting behavior is the product of both the design and the education.

       - Why did the same training produce different learners?
           - Because the learners started with different capabilities and learning strategies.

       - Where did the teachers' knowledge become a bottleneck?
           - The teachers knew the rule but could only communicate through tokens. They couldn't explain. If the learner wasn't designed to perceive the relevant feature (like the light) or to generalize appropriately, the tokens weren't enough.

       - The fifth round: 
           - Shows that the machine can adapt to new rules, but only if its learning algorithm allows it and if it perceives the relevant features. 
           - Also, the machine doesn't "understand" the rule in the abstract; it just changes its behavior based on the tokens.

       - The missing feature in the activity:
           - Turing's child machine is supposed to be capable of learning anything that a human child can learn. Our learners were very limited and fixed. The activity cannot show how a machine might develop open-ended intelligence that exceeds its initial programming. That requires a very powerful initial design (like a universal computer) and a rich educational environment. We only showed a tiny slice.

   11. Final note: The activity is designed to be run with one session. The facilitator should be active in monitoring the teams to ensure rules are followed and to answer logistical questions.

   Given the complexity, it might be helpful to have a dry run with colleagues first.

   Now, let's write out the full script.
answer: |-
  Below is a fully designed 90-minute session plan centered on Turing's "child machine" concept. It emphasizes hands-on discovery of the tension between pre-designed dispositions and teaching, using a token-based communication constraint. The activity is structured for four teams, each interacting with a differently disposed "learner" (simulated by rule cards), followed by a debrief mapping the experience to Turing's ideas.

  ---

  ### **Session Structure & Timings**
  1. **Introduction (5 min)**  
  2. **Team Setup & Rules (10 min)**  
  3. **Teaching Rounds (40 min total: 10 min/round × 4 teams)**  
  4. **Fifth Round: Unseen Problem (15 min)**  
  5. **Debrief & Turing Discussion (20 min)**  

  ---

  ### **Materials Per Team**
  1. **Learner Kit**:  
     - **Task Board**: A 4×4 grid with start (★) and goal (●). Obstacles (▲) vary per team (see below).  
     - **Learner Token**: A pawn to move on the grid.  
     - **Action Tokens**: 4 arrow cards (↑, ↓, ←, →) for the learner to "move."  
  2. **Teacher Kit**:  
     - **Feedback Tokens**: 10 green ("right"), 10 red ("wrong").  
     - **Sealed Disposition Card**: Hidden rules the learner follows (distributed secretly by facilitator).  
     - **Instruction Card**: "Communicate ONLY by giving green/red tokens after each move. No speaking, writing, or gestures to the learner."  
  3. **Fifth-Round Challenge Card**: A new grid with different obstacles/goal (sealed until Round 5).  

  ---

  ### **Learner Dispositions (Sealed Cards)**
  Each learner has unique pre-designed traits. **Teams are unaware of these.**  
  - **Learner 1 (Generalizes by Similarity)**:  
    *"After 2 identical feedback tokens (e.g., green+green), repeat the last move for similar-looking grids (e.g., same obstacle pattern). Otherwise, move randomly."*  
  - **Learner 2 (Position-Focused)**:  
    *"Always move toward the grid position where you last received green. If no green yet, move randomly."*  
  - **Learner 3 (Relentlessly Literal)**:  
    *"Repeat the last move that got green. If punished, choose a new random direction. Ignore grid features."*  
  - **Learner 4 (Token-Order Sensitive)**:  
    *"If token sequence is [green→red], reverse last move. If [red→green], repeat last move. Else, move randomly."*  

  ---

  ### **Grid Designs (Pre-Training)**  
  *Vary obstacles (▲) to test senses/dispositions:*  
  - **Team 1 (Learner 1)**: Obstacles form color clusters (red ▲). *Learner sees colors.*  
  - **Team 2 (Learner 2)**: Obstacles in geometric patterns (triangles). *Learner sees shapes.*  
  - **Team 3 (Learner 3)**: Random obstacles. *Learner sees only coordinates (e.g., B3).*  
  - **Team 4 (Learner 4)**: Obstacles change after 3 moves. *Learner sees symbols (e.g., !, @).*  

  ---

  ### **Step-by-Step Script**  
  #### **1. Introduction (5 min)**  
  *You say:*  
  > "Tonight, we’re exploring Turing’s idea: instead of building an adult mind, create a ‘child machine’ and educate it. But what does ‘educate’ mean? How much is designed upfront? We’ll simulate this. In teams, you’ll teach a ‘learner’ to navigate a grid using only tokens: green for ‘right,’ red for ‘wrong.’ No words, no demos. Your goal is to get it from start (★) to goal (●)."  

  #### **2. Team Setup & Rules (10 min)**  
  - Form four teams of four. Each picks one "learner" (pawn-mover) and three "teachers" (token-givers).  
  - Distribute kits. Highlight rules:  
    > "Teachers, you may only give one token per move. Learners, you must follow your sealed rules—don’t show them! You have 10 minutes per round to reach the goal. Begin when I say."  

  #### **3. Teaching Rounds (40 min: 10 min × 4 teams)**  
  - **Process**:  
    - Learners move by selecting an arrow card.  
    - Teachers respond with one token (green/red).  
    - Learners react based on their disposition card.  
  - **Facilitator Role**:  
    - Circulate to enforce silence/rules.  
    - Warn if teams talk/gesture: "Tokens only!"  
    - After 10 min, call rotation (even if goal isn’t reached).  

  #### **4. Fifth Round: Unseen Problem (15 min)**  
  - Give sealed **Fifth-Round Challenge Card** (new grid with shifted obstacles/goal).  
  *You say:*  
  > "Set your learner a new task on this grid. **No training this time**—just run 5 moves and observe. Use tokens as before, but note how it responds without prior practice."  

  #### **5. Debrief & Turing Discussion (20 min)**  
  ***Guided Reflection (Questions for Teams):***  
  1. "What strategy worked? What frustrated you?"  
  2. "Why did identical tokens produce different results across teams?"  
  3. "In Round 5, did your learner ‘adapt’ or just repeat old habits?"  

  ***Mapping to Turing’s Ideas (Key Points):***  
  | **Activity Moment**       | **Turing Concept**                          |  
  |---------------------------|---------------------------------------------|  
  | Sealed disposition cards  | Pre-designed "child machine" (senses/learning style). |  
  | Token training            | Education via rewards/punishments.          |  
  | Varied success across teams | Intelligence emerges from interaction of design + teaching. |  
  | Teachers’ frustration     | "Smuggled problem": Design limits what teaching can achieve. |  
  | Round 5 outcomes          | Machines act from prior training, not genuine "insight." |  

  ***Final Missing Piece (Your Closing Insight):***  
  > "This activity reveals the tension: the ‘teacher’ and ‘designer’ shape the machine’s limits. But Turing’s deeper point is that a truly intelligent machine must *surpass* its initial design through open-ended learning—like a human child. Our learners couldn’t do that; they were locked into their rules. The unresolved question: **Can we design a machine whose ‘education’ allows it to transcend its programming?** That’s the dream Turing left us with."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Teams try to cheat with gestures/speech.  
     *Fix*: Gently remind, "Tokens only! Imagine you’re programming a machine."  

  2. **Problem**: Learners struggle (e.g., random moves).  
     *Fix*: Let frustration build—it highlights design’s role. Ask later: "Why was your learner ‘stubborn’?"  

  3. **Problem**: One team solves quickly; another stalls.  
     *Fix*: Emphasize discovery over "winning." Say: "This isn’t about speed—it’s about *how* learning happens."  

  4. **Problem**: Round 5 confuses learners.  
     *Fix*: Use it! Ask: "Did your learner ‘think for itself’ or just replay old habits?"  

  ---

  ### **Why This Works**  
  - **Hands-on difficulty**: Teams *feel* the teacher/design tension when tokens fail to "educate" a rigid learner.  
  - **Turing’s concepts emerge**: Dispositions mirror "innate senses," tokens mirror "rewards/punishments," Round 5 exposes lack of true agency.  
  - **Debrief clarity**: Concrete examples (e.g., "Learner 3 was literal—like a machine without generalization") make philosophy tangible.  

  The one **unreproducible aspect**: Turing’s faith that a simple-designed child machine could, through education alone, *match human flexibility*. The activity shows the limits; you must articulate the leap of faith in your closing remarks.
