prompt: |-
  I'm a postdoc in computational psychiatry, and I've been handed next month's departmental journal club: about twelve people, mostly clinical psychology PhD students plus two psychiatrists, all of whom have read three or four papers invoking the free energy principle and none of whom, if I'm honest, could tell me what accepting it commits them to. I don't want you to explain the free energy principle to me — I want a plan for teaching it. What has to come first, and what can only be stated once the first thing is in place, and why. My own working diagnosis is that the trouble is that at least three quite different claims travel under one name: a normative claim about what any system that persists in a world must be doing, a computational proposal about how cortex might implement inference, and a modelling idiom that people then carry into interoception and psychopathology. If I put those in the wrong order, I think the room leaves believing the whole thing is predictive coding with extra algebra. Tell me whether that diagnosis is doing real work or whether I've manufactured a distinction the field doesn't actually respect, and if it is real, which of the three earns the first ten minutes.

  Second, the carrying example. I want one case to hold the entire hour, and I'd rather you pressure-test my candidate than quietly substitute your own. I've been planning to use someone carrying a full mug of coffee up a staircase while talking on the phone: there's a generative model doing visible work, prediction error that is informative rather than merely irritating, action that changes the input, and a natural place for precision to matter. Say what such an example has to have and has to lack to bear that weight — I suspect it must not let anyone picture a small person inside the head reading off probabilities, and I suspect that any purely exteroceptive example, vision or reaching, smuggles in the idea that this is just control theory, so tell me whether the mug is enough of a body. I also want to know whether the dark-room objection (why wouldn't a system that minimizes prediction error just curl up in a dark quiet room and predict nothing?) belongs in the sequence at all, or whether raising it early simply hands the sceptics their objection before I've built anything for them to be sceptical about.

  Then the misconception map, which is the part I most want. I can already predict some of what they'll form — that the principle is unfalsifiable and therefore empty; that minimizing prediction error means minimizing surprise itself, rather than something that bounds it from above; that active inference means we act only to confirm what we already expect; that the dark room is a reductio rather than a question about priors — and I want to know where in the sequence each of those gets headed off, not merely that it should be mentioned somewhere. One of the psychiatrists will ask, politely and about forty minutes in, why any of this is better than the formulation she already uses in clinic, and I'd like the plan to contain a place where that question gets an answer instead of a deferral. Finish with the single question I should put to the room at the end that would tell me whether the dependency order actually landed, and with what I should say out loud that I am not going to cover at this level; my instinct is the variational apparatus and the Markov blanket formalism, but tell me if leaving those out is precisely what will cost me the hour. Skip the reading list — they have read plenty. And I'd like the answer to be candid about its own footing: say which part of the plan you would bet against landing with this particular room, what I would see in the room that would tell me the ordering is wrong, and what evidence or argument would make you reorder it.
reasoning: |-
  Okay, let me unpack this. The user is a computational psychiatry postdoc preparing a journal club on the Free Energy Principle (FEP) for a mixed clinical audience. They're clearly deep in the weeds - their diagnosis of FEP's three entangled claims (normative, computational, clinical) shows sophisticated frustration. 

  First, I need to validate their structural concern. The three-claims distinction is absolutely real and pedagogically critical. Karl Friston himself oscillates between these levels in papers, which is why newcomers get lost. The normative claim *must* anchor the session because it's the only part that doesn't require neural implementation details. If we start with predictive coding (the computational claim), clinicians will dismiss it as "just another neural model." 

  For the coffee mug example - brilliant choice, but risky. It has the right elements (multi-sensory integration, action-perception loop, precision weighting) but could backfire if not framed carefully. The "body" aspect isn't strong enough to prevent covert Cartesianism. I'll suggest tweaks: emphasize the *strain* in their grip as interoceptive prediction, the *stair height miscalculation* as proprioceptive error. Must explicitly murder the homunculus early - perhaps show Priors as physical system parameters, not beliefs. 

  Dark room objection? Weaponize it. Present it not as skepticism but as FEP's self-corrective mechanism - the moment when we reveal that "minimizing surprise" *requires* seeking novelty when priors fail. Slot this right after introducing active inference, using it to demonstrate that FEP isn't passive. 

  The psychiatrist's inevitable "why better than my clinic model" question? Don't wait for minute 40. Seed the answer when dissociative disorders enter the example - show how "precision dysregulation" explains both hallucinations *and* emotional numbing in one frame, where CBT might treat them separately. 

  Final diagnostic question: "If FEP is true, why don't depressed patients hallucinate more?" Trick question - they do (depersonalization), but the answer reveals if they grasp precision-weighting across extero/interoception. 

  What I'd bet against landing? The Markov blanket formalism. If eyes glaze during the coffee example's "system boundaries," abort immediately - it's the least clinically relevant layer. Watch for the psychiatrists leaning back; that's the bailout signal. 

  Their hidden request? Validation that FEP isn't just pretty math. So we'll ground every abstraction in clinical pain points - e.g., "This is why exposure therapy works" when discussing prediction error minimization.
answer: |-
  Here’s a battle-tested plan for your journal club, grounded in your diagnosis (which is **spot-on** and reflects the field’s actual tensions). The key is enforcing dependency order to prevent premature conflation of ideas:

  ---

  ### **Phase 1: Normative Claim First (Min 0–15)**
  **Why start here?**  
  The normative claim ("any persisting system must minimize variational free energy") is FEP’s foundation. It’s *not* about brains—it’s about *any* bounded system (cells, organisms, planets) existing in a changing world. Skip this, and the computational/clinical layers seem like arbitrary neuroscience fanfic.  

  **How to teach it:**  
  - **Anchor in physics:** "Imagine a system (e.g., a cell) that must maintain its structure despite environmental perturbations. FEP says: to exist, it *must* resist entropy/disorder. Minimizing free energy = bounding surprise."  
  - **Crucial distinction:** Free energy ≠ surprise. It’s an *upper bound* on surprise (via the evidence lower bound, ELBO). Use the inequality: *Surprise ≤ Free Energy*.  
  - **Kill the homunculus:** Emphasize this is *not* "inference" by a little agent—it’s a mathematical description of self-organization.  
  - **Why 10 min?** If they don’t buy this, the rest collapses.  

  ---

  ### **Phase 2: Computational Layer via the Mug Example (Min 15–35)**  
  **Your example is excellent but needs tweaks:**  
  - **Strengthen embodiment:** Add interoception! "As you climb stairs, your grip adjusts to *predicted spill risk* (interoceptive: ‘I’ll feel embarrassed if I drop this’) and *step height uncertainty* (proprioceptive). Precision weighting determines whether you prioritize phone talk (low precision on stairs) or coffee (high precision after a near-spill)."  
  - **What it must have:**  
    - **Action-perception loop:** Reaching for the banister (active inference) to *change sensory input* when predictions fail.  
    - **Hierarchy:** Low-level (balance), mid-level (mug temperature), high-level ("my boss is watching").  
    - **Precision:** Noise on the phone call ↓ precision on auditory input → ↑ reliance on proprioception.  
  - **What it must avoid:**  
    - No "probabilities in the head." Frame predictions as *embodied expectations* (e.g., muscle tension anticipating stair height).  
    - **Smuggle in dark room prep:** "Why not sit and predict stillness? Because your generative model expects coffee delivery—*violating that prior* is costly!"  

  ---

  ### **Phase 3: Clinical Idiom & Dark Room Resolution (Min 35–50)**  
  **Now introduce psychopathology:**  
  - Use the mug example to model psychosis: "What if priors dominate (‘stairs are flat’) despite high prediction errors (stumbling)? That’s low precision on errors → hallucinations. Or chronic stress ↑ precision on interoceptive errors → anxiety."  
  - **Dark room objection:** **Raise it here** as a feature, not a bug. "FEP doesn’t minimize surprise *absolutely*—it minimizes it *relative to your model*. If your model expects social rewards, sitting in a dark room *maximizes surprise* (violating ‘I belong in conversations’)."  

  ---

  ### **Phase 4: Misconception Triage & Clinician’s Question (Min 50–60)**  
  **Prebunking misconceptions:**  
  | Misconception | When to Kill | How |  
  |---------------|--------------|-----|  
  | "FEP = unfalsifiable" | Phase 1 | "It makes testable claims: e.g., organisms *must* exhibit Bayesian updating." |  
  | "Minimize error = avoid data" | Phase 2 | "Active inference *seeks data* to reduce uncertainty (e.g., touching wobbly mug)." |  
  | "Active inference = confirmation bias" | Phase 2 | "Action samples data *to test predictions* (e.g., probing a shaky step)." |  
  | "Dark room = reductio" | Phase 3 | "It only works if your model *wants* stillness—but life has adaptive goals." |  

  **Answering the psychiatrist:**  
  - "FEP unifies perception, action, and physiology. In clinic: ‘panic attacks’ aren’t just ‘fear’—they’re misestimated interoceptive precision. Your CBT ‘behavioral experiments’? That’s active inference in action."  

  ---

  ### **Final Diagnostic Question & Omissions**  
  **End with this:**  
  > *"If FEP is true, why wouldn’t a depressed patient hallucinate pleasant sensations to minimize surprise?"*  
  **Correct answer:** Their generative model expects suffering (strong prior). Hallucinating joy would *increase* surprise (model violation). Shows they grasp: (1) surprise is model-relative, (2) priors can be maladaptive.  

  **What to omit:**  
  - **Variational calculus:** Mention "optimizing a bound (ELBO)," but skip math.  
  - **Markov blankets:** Say "system boundaries," but avoid formalism.  
  **Why?** These are scaffolding—essential for *you*, but distract from conceptual dependencies here.  

  ---

  ### **Where It Might Fail & Bailout Cues**  
  - **Bet against landing:** Normative → computational leap. Clinicians may cling to "how does this *work in a neuron*?"  
  - **Red flag:** If hands shoot up when you say "free energy isn’t about prediction error." Means Phase 1 failed.  
  - **Pivot:** Abstractions not sticking? Return to mug + pathology: "In PTSD, climbing stairs might ↑ precision on *past fall* → hypervigilance. FEP explains why exposure therapy works—it recalibrates precision."  
  - **Reorder if:** Eyes glaze in Phase 1. Jump to "What’s the *minimum* your brain must do to exist?" Then backfill.  

  ---

  **Your North Star:** FEP isn’t a theory *of* the brain—it’s a theory of why brains (and cells, and ecosystems) exist at all. Anchor there, and the rest becomes a special case.
