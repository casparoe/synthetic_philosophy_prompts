  ### Unreached Positions & Diagnostics  
  - **Colony has agency but not representation:** Incoherent. Agency requires goal-directedness, which implies "aboutness."  
  - **Colony has a locus-bound mind but splits successfully:** Unattractive. Minds don’t typically divide like cells; no position occupies this.  
  - **Colony has experience but lacks agency/representation:** Unexplored. Few argue for "feeling" without purpose.  

