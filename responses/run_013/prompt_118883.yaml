  ### Indistinguishable Leaves  
  - **"Colony is the organism" (A4-Yes) and "Mind is spread" (A4-No)** differ only in vocabulary. Both agree the colony coordinates behavior and splits into two functional units. The former emphasizes biological unity; the latter emphasizes distributed parts.  
