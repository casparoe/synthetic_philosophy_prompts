prompt: |-
  I'm a postdoc and I've been roped into running next week's session for the psych department's evolution-and-behaviour reading group — mostly PhD students, a couple of them doing evo psych proper, all of them allergic to being lectured. Topic is the Gould and Lewontin spandrels critique of adaptationism. Don't explain the topic to me, I know it well enough; what I want is a plan for how to teach it, because I'm going to be talking to a room that walks in half-defensive.

  So: give me the order the ideas have to go in, and why that order and not another — what genuinely has to be in place before the next piece makes sense, and what's just conventional sequencing that I can drop. The thing I care about most is that the distinction between "this trait has a use now" and "this trait was built by selection for that use" lands early and stays landed, because I think everything downstream is just that distinction with decorations on it, and I want to know if you agree or if there's something that has to come before even that.

  Then the example that carries the whole session. It has to be one where we can actually point at the constraint — developmental, structural, whatever — rather than just assert one exists, and it has to be something they've got some independent grip on. Float your candidates and say why the others lose. Candidates I keep going back and forth on: the human chin, the sagittal crest, music, and something about female spotted hyenas that I half-remember and don't trust, so don't feel bound by my list. I want the one where the byproduct story is actually defensible rather than merely provocative, and I want to know where it breaks down too.

  Third, the misconceptions — in the order they'll actually surface, not the order that's tidy — and exactly where in the sequence I head each one off. I'm expecting at minimum: "spandrel means a trait with no function", "so Gould and Lewontin are saying selection doesn't matter", "fine, but we test our adaptations, so this doesn't apply to us", and "anyone telling an adaptive story is being Panglossian". There will be ones I'm not seeing. Find them, including the ones that only appear in the questions people ask at the end.

  Fourth, and this is the part I'd get wrong on my own: I don't want them leaving with spandrel-versus-adaptation as a two-way split. There's a third case — the byproduct that later gets co-opted for something — and I want it distinct in their heads from both of the others, with a name they can use and some sense of what a test for it would even look like.

  Fifth, settle something for me. Someone has already told me the architectural example itself is shaky — that the features in San Marco aren't really spandrels, and that the alternatives would have served the building just as well, which would make the analogy point the wrong way. I have no idea what to say if that comes up, so tell me whether it's worth a minute and how to handle it, and flag anything else in the standard telling of this story that's contested or that I'd be embarrassed to repeat as fact.

  Sixth, one question I can ask at the end that would actually show me whether it landed rather than whether they can parrot the labels, and what a good answer would contain versus what a confident-but-wrong one looks like.

  Last, what I should openly refuse to go into at this level, and how to say I'm skipping it without it looking like I'm dodging.

  No reading list, they won't do it.

  Format: give it back to me as a JSON object with these fields, and nothing else outside it.

  - "arc": one sentence for the whole session's logic.
  - "sequence": array, each with "step" (number), "idea" (what goes in at this point), "why_now" (what it depends on and what it unlocks), "move" (the concrete thing I do at the board or the question I put to the room), "say_it_like" (one or two sentences I could say out loud verbatim).
  - "carrying_example": object with "pick", "why_it_carries", "what_it_must_have", "what_it_must_lack", "where_it_breaks_down", and "runners_up" as an array of objects with "candidate" and "why_it_loses".
  - "misconceptions": array of objects with "misconception", "surfaces_at" (step number), "defuse_at" (step number), "what_to_say", "how_i'll_know_it's_still_there".
  - "byproduct_binary": object with "what_they_should_be_able_to_distinguish", "the_third_case", "name_for_it", "example", "what_a_test_would_look_like".
  - "architecture_worry": object with "worth_a_minute" (yes or no), "how_to_handle", "other_contested_bits" (array of strings).
  - "check_for_understanding": object with "question", "good_answer_contains", "bad_answer_looks_like".
  - "cut_list": array of objects with "left_out", "why", "how_to_say_im_skipping_it".
reasoning: |-
  We are given a very structured request. We'll build a JSON object as specified.

  Key goals from the user:
  - Land early and keep the distinction between "current use" and "built by selection for that use".
  - Use a strong example that clearly shows a constraint and where the byproduct story is defensible.
  - Address common misconceptions as they surface in the sequence.
  - Introduce a third case (exaptation) distinct from spandrel and adaptation.
  - Address the architectural worry about the San Marco spandrels.
  - Have a check for understanding at the end.
  - Explicitly cut some topics to avoid scope creep.

  Let's break it down:

  1. **arc**: The session's logic in one sentence.
     - "Establish the critical distinction between current utility and historical adaptation, then use the spandrels critique to demonstrate non-adaptive explanations, including structural constraints and exaptation, to challenge adaptationist assumptions without dismissing selection."

  2. **sequence**: An array of steps. We'll design 5-6 steps.

     Step 1: Start with the core distinction (current use vs. built by selection). Why now? It's the foundation. Move: Draw two columns: "What it's used for now" and "What it was selected for". Say it like: "Before we dive into the spandrels paper, let's get clear on a basic but crucial point: a trait having a current function doesn't mean it evolved for that function. Think about your phone's flashlight: it's useful for lighting your way, but it wasn't invented for that."

     Step 2: Introduce the adaptationist program and its critiques. Why now? Builds on the distinction to show why it matters. Move: Briefly sketch the adaptationist approach and then pose Gould & Lewontin's critique. Say it like: "Adaptationism often assumes that every trait is an optimal solution shaped by natural selection. But Gould and Lewontin argue that this is like assuming every part of a building was designed for its current use, ignoring constraints and history."

     Step 3: The spandrels analogy. Why now? After setting up the critique, the analogy makes it concrete. Move: Draw a simple arch and spandrel, then show the decorated version. Say it like: "In San Marco, the spandrels are the triangular spaces left by the arches. They weren't designed as canvases, but they became places for art. Similarly, biological traits can be byproducts of structural constraints, not direct targets of selection."

     Step 4: Present the carrying example (we'll pick one later). Why now? To ground the abstract critique in a real biological case. Move: Draw the example (e.g., the human chin) and break it down. Say it like: "Let's take the human chin. It's a bony protrusion at the bottom of the mandible. Some say it's an adaptation for speech or mating, but it might just be a byproduct of how our jaw bones grow."

     Step 5: Introduce the third case (exaptation). Why now? After distinguishing spandrels and adaptations, we show that byproducts can be co-opted. Move: Add a third category to the initial two columns: "Co-opted for current use". Say it like: "But wait, there's a twist: sometimes a trait that started as a byproduct gets co-opted for a new function. That's exaptation. Like feathers: originally for thermoregulation, later used for flight."

     Step 6: Wrap-up and misconceptions. Why now? After building the framework, we address defensive reactions. Move: Open for questions but preempt common misconceptions. Say it like: "So to recap: not every trait is an adaptation, but that doesn't mean it's functionless. And we're not saying selection doesn't matter — it's just one of several evolutionary forces."

  3. **carrying_example**: We need one that clearly shows a constraint. The user mentioned: human chin, sagittal crest, music, female spotted hyenas.

     - Human chin: A strong candidate. The constraint is developmental: the chin emerges as a result of the reduction of the dental arch and the growth patterns of the mandible. It's a byproduct, not an adaptation. However, the byproduct story is defensible and the constraint is clear. It must have a structural/developmental constraint, and it must lack evidence of selective pressure for the chin itself. It breaks down because some argue it might have been co-opted for social signaling (exaptation). 
     - Sagittal crest: This is an adaptation for strong jaw muscles, so it's not a spandrel. Loses because it's clearly adaptive.
     - Music: This is complex and debated; it might be a spandrel of language or an adaptation. But the constraint is not as clear-cut. Loses because it's too fuzzy and doesn't clearly show a constraint.
     - Female spotted hyenas: They have a pseudo-penis, which is a byproduct of high androgen levels in utero. The constraint is developmental (hormonal). However, it's a bit sensational and might distract. Also, it's not as universally familiar as the chin.

     Pick: Human chin.

     Why it carries: It's simple, visual, and the constraint (jaw growth patterns) is clear. It must have: a clear structural constraint (the way the jaw bones grow and recede). It must lack: evidence of selective pressure specifically for the chin (e.g., no fitness advantage conferred by the chin itself). Where it breaks down: Some argue that the chin might have been sexually selected (exaptation) or that it does provide a functional advantage (e.g., resistance to mechanical stress), but the byproduct hypothesis remains strong.

     Runners-up: 
       - candidate: "Spotted hyena pseudopenis", why_it_loses: "Less familiar, and the hormonal constraint might be harder to visualize; also, the discussion might shift to social dominance rather than structural constraint."
       - candidate: "Music", why_it_loses: "Too complex and debated; the constraint (if any) is not as clear as a physical structure."

  4. **misconceptions**: We'll list the ones the user expects and more.

     a) "spandrel means a trait with no function"
        - surfaces_at: step 3 (when spandrels are introduced) or step 4 (when the example is discussed)
        - defuse_at: step 4 (when discussing the chin, emphasize that spandrels can acquire functions) and step 5 (exaptation)
        - what_to_say: "Spandrels aren't functionless; they might have a current use, but they didn't arise as adaptations for that use. The San Marco spandrels are used for art, but they weren't designed for it."
        - how_i'll_know_it's_still_there: If someone says, "So the chin is useless?"

     b) "so Gould and Lewontin are saying selection doesn't matter"
        - surfaces_at: step 2 or step 6 (during critique)
        - defuse_at: step 6 (wrap-up)
        - what_to_say: "Not at all. They're arguing that selection isn't the only force, and that we shouldn't assume every trait is an adaptation. Selection still explains many traits, but we need to consider alternatives."
        - how_i'll_know_it's_still_there: If someone asks, "Aren't they just anti-selection?"

     c) "fine, but we test our adaptations, so this doesn't apply to us"
        - surfaces_at: step 4 or step 6 (when discussing the example or wrap-up)
        - defuse_at: step 4 (when presenting the chin, ask: "How would you test if the chin is an adaptation? What evidence would distinguish a byproduct from an adaptation?")
        - what_to_say: "Testing is crucial, but the critique is about starting with adaptation as the default. We must test against non-adaptive hypotheses too, like developmental constraints."
        - how_i'll_know_it's_still_there: If someone says, "In evo psych, we always test, so we're safe."

     d) "anyone telling an adaptive story is being Panglossian"
        - surfaces_at: step 2 (when introducing the critique) or step 6
        - defuse_at: step 2 (when introducing the critique, clarify that adaptive stories can be valid, but the problem is when they're the only kind considered)
        - what_to_say: "Panglossianism is the extreme of assuming every trait is optimally designed. We can tell adaptive stories without being Panglossian by considering trade-offs and constraints, and by testing."
        - how_i'll_know_it's_still_there: If someone says, "So we shouldn't propose adaptations?"

     e) Additional: "Spandrels are rare; most traits are adaptations." This might surface at step 4 or 6.
        - defuse_at: step 4 (with the example) or step 6
        - what_to_say: "Gould and Lewontin aren't saying most traits are spandrels, but that we should consider them. The point is to avoid assuming adaptation without evidence."
        - how_i'll_know_it's_still_there: If someone says, "But the chin is an exception, right?"

     f) Additional: "Constraints are just adaptations in disguise." This might come up at step 4.
        - defuse_at: step 4 (when discussing the constraint in the chin)
        - what_to_say: "Constraints are real limitations on what selection can do. For example, the chin arises because of how the jaw develops; it's not that the jaw development was selected to produce a chin."
        - how_i'll_know_it's_still_there: If someone says, "But the developmental process itself was selected, so isn't the chin adaptive?"

  5. **byproduct_binary**: We want to avoid a two-way split and introduce exaptation.

     - what_they_should_be_able_to_distinguish: "A trait that is a direct product of selection for its current function (adaptation), one that is a byproduct with no current function (which is rare) or a byproduct that hasn't been co-opted (spandrel in the strict sense), and one that is a byproduct that was later co-opted for a function (exaptation)."
     - the_third_case: "A trait that originated as a non-adaptive byproduct but was later co-opted for a current function."
     - name_for_it: "Exaptation" (the term from Gould and Vrba, 1982).
     - example: "Feathers in birds: they likely evolved for thermoregulation, then were co-opted for flight."
     - what_a_test_would_look_like: "To test for exaptation, you'd need evidence that the trait arose without selection for the current function (e.g., fossil evidence showing an earlier non-flight function) and then evidence that selection later modified it for the new function."

  6. **architecture_worry**: The user heard that the San Marco spandrels aren't really spandrels.

     - worth_a_minute: yes, because it's the central analogy and if challenged, we need a response.
     - how_to_handle: "The architectural example is an analogy, not a perfect mapping. Some argue that the spandrels in San Marco were intentional architectural elements. But even if they were, the point remains: in biology, traits can arise as necessary byproducts of structural constraints. The analogy serves to illustrate how a feature might be used in a way that wasn't the original reason for its existence."
     - other_contested_bits: 
          - "The strength of the spandrels critique: some argue that Gould and Lewontin overreached and that adaptationism is more robust than they claimed."
          - "The definition of 'spandrel' in biology: there's debate about whether it should be restricted to structural byproducts or include other non-adaptive traits."

  7. **check_for_understanding**: 

     - question: "Imagine a trait: the human appendix. It's often said to be vestigial (lost its ancestral function) but might have a current role in immune function. How would you use the concepts we've discussed (adaptation, spandrel, exaptation) to frame hypotheses about the appendix?"
     - good_answer_contains: "Distinguishes between: adaptation (if it was selected for immune function originally? but that's unlikely given its reduction), spandrel (if it's just a byproduct of gut development, but note it has a current function so that might not fit), exaptation (if it was a vestigial remnant that then was co-opted for immune function). Also, might mention that it was an adaptation in ancestors for digestion, then lost that function, and perhaps later gained a new one."
     - bad_answer_looks_like: "The appendix is a spandrel because it has no function." (ignoring possible current function) or "It's an adaptation for immune function." (without considering history).

  8. **cut_list**: Topics to avoid.

     a) left_out: "The extended evolutionary synthesis and more recent debates about niche construction."
       why: "It's beyond the scope of an intro to the spandrels critique and would derail the focus on the core distinction."
       how_to_say_im_skipping_it: "That's a great question about contemporary extensions, but for today, we're sticking to the foundational Gould and Lewontin argument to keep focus."

     b) left_out: "Detailed critique of specific evo psych studies."
       why: "The goal is to equip them with conceptual tools, not to attack their field."
       how_to_say_im_skipping_it: "We're using this as a conceptual framework, not to evaluate particular studies today. Let's keep the discussion on the general evolutionary principles."

     c) left_out: "The molecular evidence for neutral evolution (Kimura's neutral theory)."
       why: "While related to non-adaptive evolution, it's a different mechanism and would complicate the session."
       how_to_say_im_skipping_it: "Neutral theory is a separate but important topic; we're focusing on phenotypic traits and constraints today."

  Now, we format as JSON.
