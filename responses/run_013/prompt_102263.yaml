answer: |-
  You're absolutely right to be frustrated – what's often lazily called "costly signaling" encompasses several distinct mechanisms with different dynamics and implications. Your intuition about the boundaries is sharp. Let's break down your cases with precise terminology and highlight the key distinctions:

  **Core Principles & Terminology:**

  1.  **Costly Signaling (Handicap Principle):** The *classic* biological/economic definition (Zahavi, Grafen). A signal is **honest** because it imposes a **net fitness/utility cost** on the signaler. Crucially, this cost is *differentially burdensome* – it's harder for low-quality individuals to bear the same signal than for high-quality individuals. The cost itself is usually "wasted" or "burned" (e.g., peacock's tail, conspicuous consumption). **Honesty comes from the differential burden of the cost itself.**
  2.  **Index (or Cue):** A signal that is **physically, physiologically, or developmentally impossible to fake** or produce without the underlying trait. There is *no strategic cost* involved; it's a direct consequence of the trait. **Honesty comes from the physical constraint.** (e.g., deep voice requiring large vocal folds).
  3.  **Access Barrier / Filter:** A situation where **the *opportunity* to acquire or display a signal requires a pre-existing condition** (usually wealth, status, or another trait). The signal itself might be easy to perform *once you have access*, but gaining access screens out those without the prerequisite. The "cost" is the *precondition*, not necessarily the signal itself. **Honesty (about the precondition) comes from exclusion, not differential cost of the signal.**
  4.  **Conditional Investment / Screening Cost:** Similar to classic costly signaling, but the cost is specifically an **investment of time/effort that only yields a return *if* you possess the underlying ability/trait.** The cost isn't wasted *if* you succeed, but it is wasted if you fail. **Honesty comes from the differential *effectiveness* of the investment based on the trait.**
  5.  **Signaling with Side Payments / Transferred Costs:** A situation where the **cost paid by the signaler is transferred *to the receiver***, creating a potential conflict of interest. This fundamentally changes the dynamics.

  **Analyzing Your Cases:**

  1.  **Unpaid Internships:** This is primarily an **Access Barrier / Filter** for wealth.
      *   **Signal:** Having the internship on your resume.
      *   **Intended Inference (by employer):** Dedication, initiative, relevant experience.
      *   **Actual Barrier:** The *ability to forgo summer income*. This requires significant family financial support.
      *   **Mechanism:** Wealthy students pass through the barrier effortlessly (the internship itself isn't costly *for them*). Less wealthy students are filtered out *before* they can even attempt the signal.
      *   **Why it's *not* classic costly signaling:** The internship itself isn't inherently *differentially costly* based on dedication/skill (a dedicated poor student might work just as hard *if* they could afford it). The *real* signal is wealth, masked as dedication.
      *   **Term:** **Wealth Filter** or **Access Barrier Signaling**.

  2.  **Fighting Game Combo:** This is **Conditional Investment / Screening Cost**, aligning closely with the *spirit* of the Handicap Principle but with a specific twist.
      *   **Signal:** High rank/performance using the complex combo.
      *   **Underlying Trait:** Fast reaction times (innate ability).
      *   **Cost:** Hours of practice (time/effort investment).
      *   **Mechanism:** Anyone *can* invest the time (unlike the internship barrier). However, the investment *only pays off* (yields high rank) if you have fast reactions. For someone with slow reactions, the hours are wasted – they don't achieve the rank. For someone with fast reactions, the hours are a worthwhile investment *because* they succeed. **Honesty comes because the investment is only rational/effective if you have the trait.**
      *   **Why it's a subtype of costly signaling:** The time investment is the cost. Its effectiveness as a pathway to the signal is conditional on the trait, making it differentially burdensome *in terms of expected payoff*.
      *   **Term:** **Conditional Investment Signal** or **Screening Cost Signal**.

  3.  **Deep Voice:** This is a classic **Index**.
      *   **Signal:** Low pitch.
      *   **Underlying Trait:** Large body size (via vocal fold length/thickness).
      *   **Mechanism:** Producing a truly deep voice *requires* large vocal folds. It's physically impossible to fake convincingly without them (artificial lowering sounds different). No strategic cost is paid; it's a direct physiological consequence.
      *   **Term:** **Index** (or **Physiological Constraint**).

  4.  **Paying Club Dues / Buying Professor's Book:** This is **Signaling with Side Payments / Transferred Costs**. This is where the classic model breaks down significantly.
      *   **Signal:** Membership in the club / possession of the book (implying commitment, belonging, seriousness).
      *   **Cost:** The money paid.
      *   **Key Difference:** The cost (money) is **transferred to the receiver** (the club, the professor). This creates a **conflict of interest**.
      *   **Problem:**
          *   **Incentive to Inflate Costs:** The receiver (club, professor) directly benefits from higher costs. They want more money, so they have an incentive to make dues high or require expensive books *regardless* of whether it improves the signal's honesty or value. This can lead to **exploitation**.
          *   **Wealth Filtering:** Like the internship, high costs primarily filter for wealth, not necessarily the underlying trait (commitment, intellectual engagement). A truly committed but poor student might be excluded.
          *   **Diminished Honesty:** Because the receiver profits, the *link* between the cost paid and the underlying trait being signaled can become very weak. Paying $500 for the professor's book signals you have $500 more than it signals genuine engagement. The receiver has no incentive to ensure the cost correlates well with the trait; they just want the money.
          *   **Not "Burned":** The cost isn't wasted; it's pocketed by the receiver.
      *   **Term:** **Signaling with Transferred Costs**, **Receiver-Benefit Signaling**, or often critically referred to as **Exploitative Signaling** or a **Wealth Test**. It fundamentally diverges from the handicap principle because the receiver's incentive structure is corrupted.

  **The Boundaries Summarized:**

  | Feature          | Classic Costly Signaling (Handicap) | Index                | Access Barrier / Filter | Conditional Investment | Signaling w/ Transferred Cost |
  | :--------------- | :---------------------------------- | :------------------- | :---------------------- | :--------------------- | :---------------------------- |
  | **Honesty Source** | Differential burden of cost         | Physical impossibility | Exclusion by prerequisite | Effectiveness of investment conditional on trait | Weak/Corrupted (Receiver incentive) |
  | **Cost "Burned"?** | Yes (usually)                       | N/A (No cost)        | Varies (Opportunity cost) | Yes (Time/Effort)      | **No (Transferred to Receiver)** |
  | **Key Cost**     | Signal Production/Maintenance       | N/A                  | Gaining Access          | Investment Effort      | Monetary Payment              |
  | **Receiver Gains?** | No                                  | N/A                  | No                      | No                     | **Yes (Directly)**            |
  | **Wealth Filter?** | Can be (secondary)                  | No                   | **Primary Mechanism**   | Possible (secondary)   | **Primary Mechanism**         |
  | **Your Example** | -                                   | Deep Voice           | Unpaid Internship       | Fighting Game Combo    | Club Dues / Textbook          |

  **Why the Line is Blurry (and Why Your Class Might Oversimplify):**

  *   **Conditional Investment (Fighting Game)** feels very much like costly signaling because the effort *is* costly and *is* differentially burdensome – low-ability individuals waste their time. It fits the differential cost *in expectation*.
  *   **Access Barriers (Internship)** and **Transferred Costs (Dues/Book)** often look similar because money is involved in both. The key difference is *who controls the barrier* and *who benefits*. In the internship, the barrier (need for money) exists independently; employers don't directly profit from candidates being poor. In the dues/book case, the receiver *creates and profits* from the cost barrier.
  *   **Indices (Deep Voice)** are the cleanest case, but sometimes acquiring the *ability* to produce an index (e.g., building muscle to look strong) involves costs, blurring into conditional investment.

  **Conclusion:**

  You've hit on crucial distinctions often glossed over. Your cases are **four different things**:

  1.  **Unpaid Internship:** **Access Barrier / Wealth Filter.**
  2.  **Fighting Game Combo:** **Conditional Investment Signal** (a robust subtype of costly signaling).
  3.  **Deep Voice:** **Index.**
  4.  **Club Dues/Textbook:** **Signaling with Transferred Costs / Receiver-Benefit Signaling** (which breaks the classic model due to the receiver's perverse incentive).

  The **fundamental line** regarding cost vs. inability is between **Costly Signaling** (paying a cost that ensures honesty through differential burden) and **Indices** (honesty ensured by physical impossibility, no strategic cost). **Access Barriers** and **Transferred Costs** are different beasts: Access Barriers focus on *exclusion by prerequisite*, while Transferred Costs introduce the game-changing element of the *receiver profiting from the signaler's expenditure*, undermining the honesty mechanism and creating potential for exploitation. Keep demanding these distinctions – it shows you're thinking deeply about the mechanisms!
