  ### Decision Tree: The Reality of Patterns in the Special Sciences  
  *Starting point: A single system can be truly described in multiple vocabularies, and some descriptions support genuine prediction/compression.*  

  #### **Node 1: Concrete Case**  
  *Consider a market, insect colony, or AI that is best predicted by treating it as an agent (e.g., attributing beliefs/desires). Does this show the system **contains a real agent**?*  
  - **Yes** → Node 2  
  - **No** → Node 3  

  ---

  #### **Node 2: Grounding Requirement**  
  *Must a pattern be grounded in (realized by) lower-level physical processes to be real?*  
  - **Yes** → Node 4  
  - **No** → **Leaf 5: Patterns-as-Fundamental**  
    - *Awkward commitment: Must explain how patterns exist without *anything* non-patterned to ground them (e.g., consciousness as pure structure).*  

  ---

  #### **Node 3: Utility vs. Ontology**  
  *Is a pattern’s "reality" **only** a label for predictive usefulness/compression?*  
  - **Yes** → Node 6  
  - **No** → Node 4  

  ---

  #### **Node 4: Degrees of Reality**  
  *Can patterns be "more or less real" based on robustness, invariance, or explanatory depth (e.g., temperature vs. species boundaries)?*  
  - **Yes** → **Leaf 1: Robust Realism (Degrees)**  
    - *Awkward commitment: Must define "degrees of reality" without collapsing into anti-realism or subjectivity.*  
  - **No** → Node 5  

  ---

  #### **Node 5: Higher-Level Reality**  
  *Are higher-level patterns (e.g., mental states, species) **real** (not just projections)?*  
  - **Yes** → **Leaf 7: Reductive Realism**  
    - *Awkward commitment: Must reduce all special-science patterns to physics with no explanatory gaps (e.g., qualia).*  
  - **No** → **Leaf 4: Fundamental-Only Projectivism**  
    - *Awkward commitment: Must explain why indispensable projections (e.g., "beliefs") aren’t real despite their utility.*  

  ---

  #### **Node 6: Concrete Case**  
  *Suppose two incompatible descriptions (e.g., competing species concepts or economic models) are equally predictive. **Can both be true?***  
  - **Yes** → **Leaf 3: Stance-Relative Realism**  
    - *Awkward commitment: Must reconcile relativized truth (e.g., "real relative to ecology") with objectivity.*  
  - **No** → **Leaf 2: Deflationary Realism**  
    - *Awkward commitment: Cannot resolve conflicts between equally useful descriptions (e.g., which species concept is "correct"?).*  

  ---

  #### **Node 7: Stance Availability**  
  *Is the applicability of a stance (e.g., intentional, design, physical) a fact **about the world** (not just our interests)?*  
  - **Yes** → **Leaf 1: Robust Realism (Degrees)**  
    - *(Reached via Node 4 → "Yes")*  
  - **No** → **Leaf 6: Fictionalism**  
    - *Awkward commitment: Must justify trusting predictions from fictions (e.g., "beliefs" in cognitive science).*  

  ---

  ### Leaves & Positions  
  1. **Robust Realism (Degrees)**: Patterns are real, reality admits degrees (e.g., temperature > species boundary).  
  2. **Deflationary Realism**: "Real" = predictively useful; no further fact.  
  3. **Stance-Relative Realism**: Patterns are real only relative to a stance (e.g., intentional stance).  
  4. **Fundamental-Only Projectivism**: Only physics is real; higher-level patterns are indispensable projections.  
  5. **Patterns-as-Fundamental**: Patterns are all there is; no grounding required.  
  6. **Fictionalism**: Higher-level patterns are useful fictions (not literally true).  
  7. **Reductive Realism**: Higher-level patterns are real but reducible to physics.  

  ---

  ### Notes  
  - **Unseparated Pair**: *Stance-Relative Realism (Leaf 3)* and *Deflationary Realism (Leaf 2)* cannot be split cleanly—both make truth interest-relative, but Leaf 3 adds stance-commitments. The tree separates them via Node 6 (incompatible descriptions).  
  - **Unoccupied Combinations**:  
    - *"No" at Node 1 → "Yes" at Node 3 → "Yes" at Node 4*: Asserts patterns aren’t grounded yet real without degrees. **Diagnosis**: Incoherent—ungrounded patterns typically imply degrees or anti-realism.  
    - *"Yes" at Node 1 → "Yes" at Node 6*: Claims reality is solely utility *and* incompatible descriptions can both be true. **Diagnosis**: Unattractive—collapses into relativism without stance constraints.  
  - **Design Choices**:  
    - Node 1 and Node 6 use concrete cases to force distinctions (agency and incompatible models).  
    - Node 4 (degrees) isolates robust realism from flat ontologies.  
    - Stance nesting (physical → design → intentional) is implicit in Leaf 3 and Node 7.  

  ---  
  *Fits two pages. Tree resolves 7 positions with 7 nodes.*
