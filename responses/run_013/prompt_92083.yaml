prompt: |-
  I'm a second-year law student taking a jurisprudence seminar that's cross-listed with the philosophy department, and I keep running into something in my torts and criminal law courses that I can't get straight. Both courses teach that cause-in-fact is a plain counterfactual matter — would the harm have happened anyway if the defendant had done otherwise? — and that this factual question gets settled before the judge ever reaches the separate, normative question of whether the defendant owed a duty. Applied to failures to act, though, the counterfactual test seems to work just as well as it does for actions: but for the lifeguard's failure to swim out, the swimmer would have lived. What puzzles me is that the law is ruthlessly asymmetric about exactly these cases. A stranger who watches a child drown and does nothing is not liable, and when I ask why, I get told both that he had no duty to act and that his failure didn't cause the death, as though those were one point rather than two. A parent who watches the same child drown is guilty of homicide. A doctor who turns off a ventilator at the family's request is said not to have caused the patient's death even though the patient would have lived on for some time had the machine stayed on, while a doctor who injects a lethal dose plainly has caused it. And in every case where an omission does count as a cause, it's because some duty — a special relationship, an undertaking, a statute — supplied the missing ingredient, so the causal question and the duty question never quite come apart. A classmate in the seminar insists this is all beside the point because absences simply cannot stand in causal relations: there is nothing there to be a relatum, and the counterfactual test only makes it look otherwise. I don't know whether to believe her, and I don't know what the doctrine would look like if she's right.

  What I want from you is the picture of causation that this whole apparatus presupposes, reconstructed as carefully as you can. Does the law assume that omissions are not causes at all and that it is only speaking loosely when it calls them causes, with all the real work done by duty? Does it assume instead that omissions are causes in just the sense actions are, so that the duty requirement is an extra, independent filter laid on top of an otherwise neutral causal judgment? Or does it assume something I find more interesting and harder to assess — that causation is itself partly normative or context-dependent, so that which condition counts as the cause of an outcome is picked out against a background of what we expect people to do, in which case the duty requirement is not a separate filter at all but is already inside the causal judgment? Tell me which of these the practice actually commits you to, which it merely fits comfortably with, and where it is genuinely underdetermined among them; if there are standard positions in the literature, name them, but I care far more about the reconstruction than about who said what, and please don't send me off to read anything. Then take the flatly counterfactual, norm-free theory of causation seriously for a moment and tell me what would have to change in the doctrine: what becomes of the stranger on the beach, the lifeguard, and the doctor at the ventilator, and is the resulting law more defensible or less than the one we have? Please answer in American English.
reasoning: |-
  Okay, the user is a second-year law student grappling with the concept of causation in torts and criminal law, particularly concerning omissions versus actions. They're noticing an asymmetry in how the law treats these cases. For instance, a stranger isn't liable for failing to save a drowning child due to no duty, while a parent would be. Similarly, turning off a ventilator isn't seen as causing death, but injecting a lethal dose is. Their classmate argues omissions can't be causes because there's no "relatum," and the user is confused about whether the law treats omissions as causes or if duty is doing all the work.

  First, I need to break down the three possible frameworks the user mentioned. The first is that omissions aren't causes at all, and duty is the real factor. The second is that omissions are causes just like actions, and duty is an extra filter. The third is that causation is normative, so duty is baked into the causal judgment. The user wants to know which the law commits to, which it fits with, and what would happen if we used a purely counterfactual approach.

  I recall that in legal doctrine, cause-in-fact uses the "but-for" test. For omissions, but-for causation seems to hold (e.g., but for the lifeguard's inaction, the swimmer would have lived). But the law doesn't treat omissions the same as actions. The key is proximate cause and duty. Duty acts as a gatekeeper. Courts often say omissions aren't causes unless there's a duty, which suggests they are using the first framework—omissions aren't causes without duty, making causation normative. But sometimes they separate duty and causation, which leans toward the second framework. However, in practice, duty is a prerequisite for even considering causation in omissions. That points to the third framework where causation is context-dependent.

  Looking at cases like the stranger vs. parent, the difference is duty. The parent has a duty, so their omission is deemed causal. The ventilator case: withdrawing treatment isn't causation because there's no duty to continue futile care, whereas injecting poison is an action causing death. Here, the duty (or lack thereof) influences whether we see the act as causal. This suggests that the law is committed to the third view—causation is partly normative.

  But is it underdetermined? Some scholars argue for a purely factual causation, but the legal practice seems to integrate duty into the causal analysis. The Restatement (Third) of Torts mentions that factual causation exists for omissions but legal causation requires duty. Still, courts often conflate the two. So the practice commits to the third view, though it might pay lip service to the second.

  If we applied a purely counterfactual approach without duty, the stranger's inaction would be a cause of death, making them liable. The lifeguard too. The doctor turning off the ventilator would be causing death. This would collapse the distinction between actions and omissions, leading to over-criminalization and imposing positive duties indiscriminately. That's not the case in current law, which values autonomy and avoids forcing rescue. So the current system is more defensible as it balances individual freedom with responsibility based on relationships and duties.

  The user might be seeking clarity on whether the law is consistent or if there's an underlying principle. Their deeper need could be understanding how philosophy of causation applies to legal doctrine, helping them reconcile jurisprudential theories with practical law. They might also want to articulate this in their seminar, so a structured analysis of the frameworks and their implications is crucial.
answer: |-
  Here's a reconstruction of the law's implicit causal framework for omissions, broken down by your core questions:

  ### 1. What the Law's Practice Commits To
     The doctrine is **most strongly committed to the third view: causation is context-dependent and partly normative**, with duty integrated into the causal inquiry for omissions. This isn't just a "filter" – it reshapes what counts as a cause in the first place.
     - **Why?** Courts consistently refuse to find causation in "pure" omission cases (like the stranger) *even when but-for causation is satisfied*. They don't say "Yes, you caused it, but no duty, so no liability." They say there *was no causation* or frame the analysis such that causation only arises *if* a duty existed. The causal question for omissions is never truly "neutral"; it's only asked *after* a duty is established. The ventilator case is paradigmatic: stopping treatment is legally classified as "allowing to die" (non-causal) rather than "causing death" precisely because the doctor had *no duty* to continue futile treatment. Conversely, injecting poison is "causing death" because it violates a fundamental duty not to harm.

  ### 2. What the Law Fits Comfortably With (But Doesn't Strictly Require)
     The law **fits comfortably with the first view (omissions aren't true causes)**. This is essentially the "classmate's view" (reflecting philosophers like Beebee or Schaffer). Judges often use language implying omissions are "nothing" or "non-events" that can't be causes. The doctrine *functions* as if this were true: liability for omissions *always* hinges on establishing a prior duty, and the causal language feels like a legal fiction grafted onto the duty finding. This view provides a neat metaphysical justification for the asymmetry.

  ### 3. What is Underdetermined / Genuinely Contested
     The law is **genuinely underdetermined between the first and third views**. It *avoids* committing to the second view (omissions are causes like actions, duty is a separate filter). Why?
     - Courts *never* hold: "Your omission was the but-for cause of death, *and* you had a duty, therefore liability." They blur or merge the analysis.
     - The Restatements and treatises (e.g., Prosser & Keeton) often *state* the counterfactual test neutrally for omissions but immediately qualify it by saying legal cause requires a duty, effectively collapsing the distinction.
     - The underdetermination exists because the law prioritizes doctrinal outcomes (no liability for strangers, liability for parents/doctors-with-duty) over metaphysical precision. It *could* be explained by either:
       (a) Omissions simply aren't causes (View 1), *or*
       (b) What counts as "the cause" depends on normative expectations/duties (View 3).
     The law doesn't *need* to choose; it gets the results it wants either way. The "standard position" in legal scholarship (e.g., Honoré, Hart & Honoré) tends towards View 3 ("causal selection" is normative), while some philosophers (like those your classmate cites) push View 1.

  ### Applying a Purely Counterfactual (Norm-Free) Theory of Causation
  If the law adopted a flat "but-for cause is cause-in-fact" rule with *no* normative/duty element *integrated into causation*:
  1.  **The Stranger:** Would be liable. But-for his failure to act, the child would not have drowned. Causation is established. Liability hinges *only* on whether a duty exists as a separate element. If no duty exception existed, he'd be liable for manslaughter or wrongful death.
  2.  **The Lifeguard (On Duty):** Liability remains the same. But-for cause is clear, and duty exists.
  3.  **The Doctor (Ventilator):** Would be liable for homicide or wrongful death. But-for removing the ventilator, the patient would have lived longer. The act of turning it off is a but-for cause. The "futility" or "right to refuse treatment" becomes a *justification or excuse defense*, not a negation of causation.
  4.  **The Doctor (Lethal Injection):** Liability remains the same. But-for cause is clear.

  **Assessment of this Counterfactual World:**
  *   **More Defensible?** In terms of *conceptual simplicity and consistency*: Yes. Actions and omissions are treated symmetrically on causation. The "cause" question is purely factual. Duty does independent normative work.
  *   **Less Defensible?** In terms of *moral intuition and practical consequences*: Overwhelmingly Yes.
      *   **Massive Over-Criminalization/Over-Liability:** Anyone who could have prevented *any* harm but didn't (e.g., you didn't donate a kidney to a stranger who died, you didn't tackle a mugger you saw) would prima facie satisfy cause-in-fact. The *only* bulwark becomes the duty requirement, which would need to be drastically expanded (creating immense uncertainty) or liability would become absurdly broad.
      *   **Erodes Autonomy:** Imposes a positive duty to aid on everyone, fundamentally altering liberal concepts of negative liberty (freedom *from* interference).
      *   **Fails Core Legal Functions:** The current asymmetry reflects deep judgments about responsibility based on relationships, roles, and undertakings. A norm-free causal test obliterates these distinctions at the factual layer, forcing them into duty – which would become an unwieldy, all-or-nothing gatekeeper lacking nuance.
      *   **The Ventilator Problem:** Classifying withdrawal of futile care as legally equivalent to murder is morally repugnant and paralyzing for medicine.

  **Conclusion:** The law's current asymmetry isn't a bug; it's a feature reflecting a deeply held (if philosophically messy) judgment: **Mere ability to prevent harm isn't enough to make your inaction "the cause" in the eyes of the law.** That label requires a special reason – a duty – arising from relationship, undertaking, or statute. The practice is most coherently reconstructed as treating causation itself as context-dependent (View 3), though it can *sound* like it denies causal status to omissions entirely (View 1). Adopting a purely counterfactual view would create a conceptually cleaner but morally and practically disastrous legal system by decoupling causation from normative expectations about when we *must* act. The existing apparatus, for all its philosophical tension, produces more defensible outcomes by embedding duty within the causal inquiry for omissions.
