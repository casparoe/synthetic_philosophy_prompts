prompt: |-
  I am a journalist who writes about governance, development and ideas, and I have spent the past year trying to work out what I actually believe about gifts and corruption by going case by case on my gut. I have no settled view on whether the anti-corruption norms that Western donors, NGOs and intergovernmental bodies have promoted since the 1990s are universal or merely parochial, and I suspect my own verdicts already commit me to an answer without my having noticed. What I want from you is the principle, or the small set of competing principles, that my reactions are tracking; where the principle forces me to give up a verdict; and what it implies about the universality question.

  These are my reactions. Please take them as data rather than as views I am defending.

  - A hospital consultant accepts a branded pen and a sandwich lunch from a pharmaceutical representative at a conference. I do not think this is wrong at all.
  - The same consultant accepts an all-expenses-paid week at a resort to deliver a talk that is in fact a sales event, plus a speaker's fee. I think this is clearly wrong, and worse than the pen by more than the difference in value.
  - A nurse accepts two hundred pounds in cash from a grateful patient's family on the day of discharge. Wrong.
  - The same nurse accepts a cake the family baked. Not wrong, and I cannot see that the cake's being homemade rather than bought does much work here.
  - A planning officer accepts a case of wine from a developer whose application she is currently assessing. Wrong.
  - The same officer accepts a case of wine from a neighbour at Christmas, with no application pending. Not wrong.
  - A village headman in a district where the state barely functions accepts a goat from a family whose land dispute he is about to adjudicate. This troubles me, but I find it markedly less wrong than the planning officer's case of wine, even though the goat is worth far more to him in relative terms than the wine is to her.
  - A legislator's aide accepts a paid speaking engagement at a company's annual conference while the legislator sits on a committee that regulates the company. Wrong.
  - A journalist accepts a source's hospitality, a weekend at his house, while writing a profile of him. Wrong.
  - An official in a country where seasonal gifts between business contacts are close to obligatory accepts the customary gift from a company she regulates; the gift is socially expected, publicly given, and in practice partly passed on to her staff. I genuinely do not know what to say.
  - A student gives her lecturer a bottle of whisky at graduation. Fine.
  - The same student gives the lecturer the same bottle a week before the examination. Wrong.

  What I want:

  1. A principle, or a small number of candidate principles, stated precisely enough to be applied, with the specific case that motivates each clause. I am not asking for a survey of the literature; I am asking what would capture this pattern.
  2. An honest statement of which of my verdicts the principle cannot accommodate, and which I should give up if I want the principle simple rather than gerrymandered. If a threshold on value gets the pen and the resort trip but makes the wrongness a matter of degree where I feel it is a matter of kind, say so.
  3. Whether the principle must locate the wrongness in the exchange itself, in its secrecy, in the expectation of reciprocity it creates, in the effect on third parties who lose out, or in a breach of a role-based duty of impartiality — and whether these come apart on any of my cases.
  4. Its verdicts on cases I have not listed: an official who accepts a gift that must be entered on a public register; a doctor who accepts a gift from a family after the patient has died; a firm that makes a small payment to move a routine licence application to the front of the queue; and a gift given openly and reciprocated in kind years later, when neither party has any stake in the other's decisions.
  5. Finally, the universality question. If the principle I end up with condemns the village headman, then either my verdict on him or my verdict on the planning officer has to go, and I want to know which you would abandon and why. If instead it vindicates him by making the norm relative to what a gift means locally, tell me what that does to the rest of my verdicts — in particular whether I can still say the Western transparency regime is right to treat the obligatory seasonal gift as corrupt. Say plainly whether the norm you have reconstructed is a local convention I happen to have internalised or something that applies to any public role anywhere, and which of my cases would have to look different for you to change your mind.
reasoning: |-
  Okay, I need to tackle this journalist's query about gifts and corruption principles. They've shared 12 cases where their gut reactions vary, and they want me to extract underlying principles. Let me start by listing their verdicts clearly to spot patterns. 

  First, the hospital consultant cases: a pen/lunch is fine, but a resort trip with a speaker fee is wrong. The nurse's cash gift is wrong, but a homemade cake is acceptable. The planning officer accepting wine during an ongoing application is wrong, but from a neighbor at Christmas is fine. The village headman taking a goat for a land dispute troubles them but feels less wrong than the officer's wine. The legislator's aide paid speaking gig is wrong, same as the journalist accepting a source's hospitality. The obligatory seasonal gift in another culture leaves them uncertain. Student giving whisky after graduation is fine, but before exams is wrong.

  Hmm... what's common here? It seems the context matters a lot—timing, relationship, and expectations. For example, gifts during active decisions (like the planning officer or pre-exam whisky) feel corrupt, but after the fact (graduation) or without pending matters (Christmas wine) don't. Also, the nature of the gift: cash vs. homemade items, value differences. But value alone isn't the key—the resort trip is worse than the pen beyond just monetary difference. 

  Let me think about principles. Maybe the core is about impartiality and role-based duties. When a gift could influence a decision or create an obligation during duty, it's wrong. That explains why the consultant's resort trip is wrong—it's tied to sales, so partiality risk. Similarly, the planning officer's wine during an assessment breaches impartiality. 

  But what about the village headman? Their context is different—state barely functions, so maybe the gift is part of sustaining the role itself. The headman isn't seen as impartial anyway; the goat might be a cultural expectation. So the principle might need flexibility for functionality in weak states. However, that could clash with condemning the planning officer. Is there a way to reconcile? 

  Looking at the nurse's cases: cash wrong, cake okay. Here, cash feels like a payment, while the cake is a token of gratitude without strings. So maybe the intent and perception matter. Cash implies reciprocity expectation, but homemade goods don't. 

  The obligatory seasonal gift case is tricky. If it's culturally mandated and transparent, does that make it acceptable? But the journalist is unsure. Under a strict impartiality principle, it might still be wrong because it creates obligation. However, if the norm expects such gifts and they're shared with staff, maybe it's functional. But does that undermine the universality of anti-corruption norms? 

  For the universality question, if the principle allows cultural context for the headman, then the seasonal gift might be okay, but that conflicts with Western norms treating it as corrupt. So perhaps the principle isn't universal, but based on institutional trust. In high-trust systems, any gift during duty is suspect; in low-trust, it's part of survival. But that might mean the journalist has to accept that their gut reactions are parochial, shaped by Western contexts. 

  Cases where the principle might struggle: the nurse's cake vs. cash. If cash is wrong but cake isn't, is it about monetary value or symbolic meaning? The journalist thinks homemade vs. bought doesn't matter much, but their verdict differs. Maybe it's about fungibility—cash is easily misused, cake isn't. 

  Also, the legislator's aide—paid speaking while regulated. Here, the conflict of interest is clear, regardless of gift nature. So role-duty breach is key. 

  For new cases: public register gift—probably okay since transparent. Doctor's gift after patient's death—less wrong, but if it's habitual, might still create future expectations. Small payment to expedite license—wrong because it subverts fairness. Gift reciprocated years later with no stakes—likely fine, no conflict. 

  So the main principle could be: A gift is corrupt if it occurs in the context of an ongoing or imminent decision-making process where the giver has a stake, and the receiver is bound by role to impartiality. But add exceptions for token gifts and cultural functionality where institutions are weak. 

  However, this might force giving up the headman verdict or admitting it's less wrong due to context. If universality is abandoned, then Western norms aren't universal, but context-specific. The journalist's reactions mostly align with institutional integrity in functional states. For the seasonal gift, under this principle, if it's obligatory and during regulatory processes, it might still be corrupt, but the journalist is conflicted because of cultural norms. Here, they might need to accept it as corrupt under their principle but understand why it's tolerated locally. 

  In summary, the key principles are impartiality during duty, contextual meaning, and institutional trust. The journalist should give up absolute universality and accept that their verdicts reflect institutional context. Cases like the headman show that norms vary by functionality, and condemning the seasonal gift depends on whether the system can enforce impartiality without such gifts.
answer: |-
  Based on your case reactions, I propose **three competing principles** that capture your intuitions, each revealing different philosophical foundations. Your judgments consistently track **contextual role integrity** as the core concern, but the *source* of that integrity's demands varies between principles.

  ---

  ### **Principle 1: The Impartiality Imperative**  
  *A gift is corrupt if it creates a reasonable expectation of partiality in a role requiring impartial judgment, regardless of cultural norms or material impact.*  
  - **Motivating cases**:  
    - Planning officer accepting wine *during* assessment (creates partiality risk) vs. Christmas gift (no active duty).  
    - Student’s whisky *before* exams (timing implies quid pro quo) vs. after graduation (no pending judgment).  
    - Legislator’s aide speaking fee (conflict with regulatory duty).  
  - **Where it struggles**:  
    - **Village headman**: Your "less wrong" verdict contradicts this principle. The headman’s role *requires* impartiality in disputes; the goat creates obvious partiality risk. To adopt this principle, you must condemn the headman as strongly as the planning officer.  
    - **Obligatory seasonal gift**: This principle condemns it—it still risks partiality in a regulated relationship. Your uncertainty suggests discomfort here.  
  - **Source of wrongness**: Breach of role-based duty of impartiality. Secrecy or third-party harm are secondary symptoms.  
  - **New verdicts**:  
    - Publicly registered gift: **Not wrong** (transparency mitigates partiality risk).  
    - Gift after patient’s death: **Not wrong** (no ongoing duty).  
    - Payment to expedite license: **Wrong** (subverts impartial process).  
    - Reciprocated gift years later: **Not wrong** (no active duty nexus).  

  **Universality**: This principle is **absolute**. It condemns the village headman and the obligatory gift. Western norms are universal; your headman verdict must be abandoned.

  ---

  ### **Principle 2: Contextual Role Integrity**  
  *A gift is corrupt if it violates the socially understood boundaries of a role in its specific institutional and cultural context.*  
  - **Motivating cases**:  
    - Village headman’s goat (less wrong because weak state institutions redefine role expectations).  
    - Nurse’s homemade cake (socially coded as gratitude, not influence).  
    - Consultant’s pen (industry-contextual) vs. resort (exceeds contextual norms).  
  - **Where it struggles**:  
    - **Journalist’s weekend hospitality**: You say wrong, but if the source’s culture expects reciprocal hospitality, this principle might exonerate it. You must either relax this verdict or admit non-contextual values.  
    - **Nurse’s cash gift**: If cash gifts are normalized in a context (e.g., some cultures), this principle might allow it. Your "wrong" verdict requires abandoning cultural relativism here.  
  - **Source of wrongness**: Violation of local role conventions. Secrecy/reciprocity matter only as signals of convention-breaking.  
  - **New verdicts**:  
    - Obligatory seasonal gift: **Not wrong** (fits local conventions).  
    - Payment to expedite license: **Context-dependent** (if "facilitation payments" are normalized, not corrupt).  
    - Public registry gift: **Irrelevant**; turns on whether registration aligns with local norms.  

  **Universality**: This principle is **relativist**. It vindicates the headman and obligatory gift. Your verdicts on the planning officer or nurse’s cash assume *your* context. To condemn "corruption" in other cultures, you must appeal to external values (e.g., outcomes).

  ---

  ### **Principle 3: Institutional Harm Minimization**  
  *A gift is corrupt if it undermines trust in institutions or creates systemic incentives for unfair outcomes, weighted by institutional fragility.*  
  - **Motivating cases**:  
    - Village headman (goat less harmful because institutions already dysfunctional; gift may sustain order).  
    - Resort trip (undermines healthcare trust) vs. pen (minimal systemic risk).  
    - Case of wine to planning officer (erodes planning integrity) vs. Christmas gift (no institutional impact).  
  - **Where it struggles**:  
    - **Nurse’s cake vs. cash**: Both have negligible systemic harm, yet you distinguish them. This principle sees little wrong in either. Abandon your cash verdict or emphasize symbolic erosion.  
    - **Journalist’s weekend**: Weak institutional harm if disclosed. Your "wrong" verdict requires overestimating harm.  
  - **Source of wrongness**: Third-party harm and institutional decay. Role duties matter insofar as they sustain systems.  
  - **New verdicts**:  
    - Payment to expedite license: **Wrong** (creates two-tier access).  
    - Gift after patient’s death: **Not wrong** (no systemic risk).  
    - Obligatory gift: **Not wrong** if culturally mandated (preserves stability).  

  **Universality**: **Pragmatic**. Condemns Western cases but excuses headman. Your planning officer verdict stands (harms robust institutions), but obligatory gifts are permissible where bans would cause chaos. Western norms aren’t universal but contextually optimal.

  ---

  ### **Which Principle Captures Your Reactions Best?**  
  Your pattern is **Principle 1 (Impartiality Imperative)** for all cases *except* the village headman. This inconsistency suggests:  
  - **Your core impulse**: Duties of impartiality define corruption.  
  - **Your tension**: You intuitively adjust for institutional reality (headman), betraying a hidden pragmatic layer (Principle 3).  

  **To resolve**:  
  1. If you insist the headman is *less wrong*, embrace **Principle 3** and:  
     - Abandon **nurse’s cash verdict** (minimal harm) or **journalist’s weekend verdict** (if no systemic risk).  
     - Conclude Western norms are **not universal**; they assume functioning institutions.  
  2. If you hold all impartiality breaches equally wrong, adopt **Principle 1** and:  
     - Condemn the **headman** as harshly as the planning officer.  
     - Affirm Western norms as **universal**, but acknowledge they may ignore institutional fragility.  

  ---

  ### **The Universality Answer**  
  - **Your reactions imply**: Norms are **not universal**. You exempt the headman due to context, yet condemn similar acts in strong states.  
  - **Cost of universality**: To condemn *all* gifts violating impartiality (Principle 1), you must abandon your leniency toward the headman.  
  - **Cost of relativism**: To excuse the headman (Principles 2 or 3), you cannot condemn the "obligatory gift" without hypocrisy—both are context-normalized.  

  **Final verdict**: You are a **closet institutional pragmatist**. Your gut prioritizes **functional integrity** over absolute impartiality. The "universal" norm you’ve internalized is:  
  > *"Gifts that risk impartiality are corrupt where institutions can reasonably uphold neutrality; elsewhere, they are merely dangerous."*  
  This lets you condemn the planning officer *and* excuse the headman, but forces uneasy toleration of obligatory gifts.  

  To change my mind, show me a case where you:  
  - Condemn a gift in a failed state with no functional alternative (e.g., headman refusing goat, leading to violence), or  
  - Excuse a gift in a strong institution that clearly biases outcomes (e.g., planning officer taking wine during assessment).
