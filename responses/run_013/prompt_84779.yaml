  Idea: Two tribes, the Hills and Marshes, have always considered each other morally significant—say, in terms of not killing or enslaving. But initially, this consideration is conditional: they avoid harming each other only because they believe mutual harm would anger a shared god who punishes transgressors. Over time, they lose this religious belief but retain the prohibition, now based on the intrinsic wrongness of harming others. The circle hasn't expanded; the same groups are included. But the basis has changed from instrumental (avoiding punishment) to intrinsic (respect for persons).

  Why is this progress? The moral commitment is more robust. It doesn't rely on contingent beliefs about divine retribution. If the god's existence were disproven, the old morality might collapse, but the new one stands on its own. This aligns with philosophical views where intrinsic valuing is deeper than instrumental.

