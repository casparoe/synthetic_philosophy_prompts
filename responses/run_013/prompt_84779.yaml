answer: |-
  Here's the thought experiment tailored to your specs:

  **The Case of the Twin Tribes:** Imagine two neighboring communities, the Hills and the Marshes, who have always recognized each other's members as possessing full moral standing—they refrain from killing, enslaving, or deliberately causing suffering to individuals from either group. However, for generations, this restraint rests *entirely* on a shared belief that harming the other tribe angers a capricious river god, who will flood both lands in retribution. Over time, through shared experiences and philosophical debate *within* each tribe (not new information *about* the other tribe), both communities gradually abandon belief in the river god entirely. Yet, they maintain the strict prohibition against harming members of the other tribe, now grounded solely in the conviction that causing such harm is inherently wrong because Hillsfolk and Marshfolk alike possess intrinsic worth and capacity for suffering. The beings considered morally significant remain identical: all Hillsfolk and all Marshfolk. No one's status changed, no new facts about their capacities emerged, the intensity of concern (avoiding harm) stayed constant, and both the god-fearing restraint and the godless conviction were sincere.

  ### Post-Mortem
  **What Changed?** The *justification* and *robustness* of the moral consideration shifted: from a contingent, instrumental rule ("Don't harm, *or else* the god punishes us") to an intrinsic, categorical principle ("Don't harm, *because* it violates their inherent worth"). Moral progress occurred in the depth and stability of the commitment, not its scope.

  **Core Feature Doing the Work:** The shift from **instrumental grounding** (morality depends on external consequences) to **intrinsic grounding** (morality depends on inherent properties of the beings). This makes the moral stance more rational, less fragile, and less dependent on happenstance.

  **What If You Pull That Feature?** If the change *wasn't* about grounding (e.g., they swapped one instrumental fear for another, like fear of economic sanctions), it collapses into mere preference change. The intrinsic shift is essential—it transforms *why* the same circle matters, making the progress substantive.

  **Stress Test: The Forest People Arrive**
  A new group, the Forest People, arrives. The "after" community (intrinsic grounding) would likely include them quickly, applying the principle "all beings with intrinsic worth/capacity for suffering matter." The "before" community (instrumental grounding) would likely *exclude* them, as their river god had no known connection to the Forest People. **Does this mean the "same-size" case was widening in disguise?** No. The difference in response to newcomers *reveals* the qualitative progress made *within* the fixed circle. The "after" community's *logic* is inherently more inclusive *because* it's grounded in properties of the beings themselves, not contingent relationships. The progress wasn't widening *then*, but it enables principled widening *now* based on the same intrinsic reasoning they applied to their existing circle.

  **Brother's Best Move & Counter:**
  *   **His Claim:** "You widened the circle *along the axis of moral properties*! Before, only 'protected by the river god' mattered. After, 'intrinsic worth/suffering' matters. That's adding a new criterion, hence widening."
  *   **Does It Work?** No, it's a redescription dressed as discovery.
      *   **Why:** The beings deemed morally considerable always *had* intrinsic worth and capacity for suffering—these weren't "new" properties discovered or added. The change was in *recognizing and acting upon* those ever-present properties *as the sole sufficient reason* for restraint, abandoning the irrelevant, contingent property ("protected by the god"). The circle of beings didn't change; the community stopped requiring an *extra*, unnecessary condition for inclusion that they mistakenly thought was essential. Progress was in correctly identifying the *relevant* moral property already possessed by all within the circle, not in adding beings or inventing new properties. It's a refinement of understanding, not an expansion of scope.
