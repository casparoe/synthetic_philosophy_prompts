answer: |-
  This is a brilliantly observed and deeply resonant interpersonal structure—one that absolutely deserves precise naming and framing. While no single established term perfectly captures its entirety, the following concepts and distinctions can map its anatomy:

  ### Core Concepts & Near Matches:
  1. **The Recognition Paradox**  
     The central tension: **acknowledgment must be unsolicited to be valid, yet its unsolicited nature makes it perpetually deferrable.** This creates a closed loop where the *condition of possibility* (spontaneity) is identical to the *condition of denial* (indefinite withholding).

  2. **Performative Contradiction** (Philosophical Lens)  
     The seeker’s position is self-nullifying: *"Acknowledge me freely"* becomes a demand the moment it’s desired, rendering fulfillment impossible. The withholder exploits this by weaponizing the seeker’s own criteria ("I can’t force sincerity") to justify inaction.

  3. **Co-constructed Double Bind** (Psychology/Gregory Bateson)  
     **Closer than classic double binds:** Both parties *collude* in maintaining the trap.  
     - **Seeker’s bind:** "If I ask, it’s invalid; if I don’t ask, I may never receive."  
     - **Withholder’s bind:** "If I give, it’s coerced; if I withhold, I’m cruel."  
     **Divergence:** Unlike pathological double binds, here both actors are conscious strategists preserving the stalemate for mutual (if perverse) benefit.

  4. **The Gift Paradox** (Anthropology/Mauss & Derrida)  
     A "pure gift" must be given without expectation of return—yet once recognized *as* a gift, it creates obligation. Your dynamic mirrors this: **acknowledgment is treated as a gift that must be unowed to "count," turning it into an impossible ideal.**  
     **Key difference:** The seeker doesn’t want a material gift, but a *performative act* ("You matter") that alters relational status.

  ### Why It’s Not Simpler Concepts:
  - **Not mere withholding:** The withholder isn’t passive; they *curate* the illusion of spontaneity (e.g., timing "generous" remarks to appear organic).  
  - **Not punishment:** No overt intent to harm. The withholder maintains plausible deniability ("I’m respecting their autonomy!").  
  - **Not apathy:** The seeker’s "expert ear" proves acute investment. Withdrawal would require *detachment*, not hyper-vigilance.  

  ### Precise Definition:  
  **A Mutual Trap of Performative Recognition**  
  *A collusive stalemate in which:  
  (1) Party A requires unsolicited acknowledgment to validate their worth;  
  (2) Party B understands that solicitation voids the acknowledgment’s value;  
  (3) Both parties preserve the fiction that acknowledgment must be spontaneous, enabling Party B to indefinitely withhold while appearing ethically scrupulous, and Party A to interpret any acknowledgment as potentially coerced. The structure persists because its dissolution (through direct request or permanent denial) would annihilate the shared fantasy that legitimized recognition is possible.*

  ### Boundary Cases & Nuances:
  - **Seeker gives up:** If Party A genuinely stops wanting acknowledgment, the trap collapses. But often, what looks like resignation is disguised endurance ("Maybe someday, unprompted...").  
  - **Forced spontaneity:** Party B stages a "spontaneous" gesture. Party A’s "expert ear" detects its artifice, deepening distrust.  
  - **External disruption:** A third party forces acknowledgment (e.g., "Tell her you value her!"). This backfires—Party A sees it as coerced, Party B resents the intrusion.  
  - **Power asymmetry:** The trap often thrives when Party B holds superior social capital (parent, critic, boss). Yet even in egalitarian relationships (marriages), mutual vulnerability can sustain it.  

  ### Why This Resonates Beyond Fiction
  You’re describing a **ritual of unfulfillable desire**, mirroring:
  - **Artist/Audience:** The creator craves "organic" discovery of their work; marketing feels like begging. Critics withhold praise to preserve "authenticity."  
  - **Capitalism/Recognition:** Workers seek "meaningful work" (unsolicited value), employers reframe exploitation as "opportunity" (withholding status).  
  - **Modern Loneliness:** We yearn for "authentic connection" yet avoid vulnerability (requesting care), breeding isolation masked as autonomy.  

  ### In Your Scene’s Language
  **Name the dynamic:** It’s a **Recognition Standoff**.  
  **Name the currency:** They trade in **Illegible Validations**—gestures whose value depends on their unreadability as responses.  

  This structure’s tragedy lies in its elegant futility: both parties are guardians of an empty shrine, praying for a miracle they’ve designed to be impossible. Your scene holds up a mirror to the quiet violence of our collective longing games—no wonder it demands years of rewriting. It’s not a flaw; it’s the point.
