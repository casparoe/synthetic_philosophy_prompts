prompt: |-
  Right — I'm a science-and-ideas hack, and before I file a piece on what we're actually doing when we say things, I'd rather you kicked the tyres on my own view than gave me the standard tour. Here's where I've landed. (1) The rule for assertion is knowledge: don't say it unless you know it. (2) There's a seperate truth rule as well — don't assert falsehoods — and I don't think it's just a by-product of (1). (3) You also shouldn't assert what you don't believe. (4) What assertion is *for* is passing knowledge on to someone else. (5) Still, I think an assertion can be entirely blameless — nobody should reproach you — even when it turns out you didn't know. (6) And saying 'I don't know' or 'it might be raining' is plainly fine, so it can't be that (1) is broken.

  Then there's my day job: I'm forever asserting things on a scientist's say-so that I can't check myself, and I think I can come to know them that way — yet I also feel I shouldn't be passing them on if I can't stand behind them.

  So: which of these actually pull against each other, which only look like they do, and which one would you drop? Rank the real tensions by how bad they are, give me the cheapest repair for each and what it costs me. I've a sneaking feeling (2) is the odd one out but I dont want to bin it if the others can carry the load.
