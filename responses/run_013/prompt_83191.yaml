answer: |-
  Here's a joke playing on the core tension of indirect normativity:

  **Setup:**  
  A man rubs an old lamp. A Genie appears and booms:  
  **"MORTAL! FOR YOUR THIRD WISH, I SHALL NOT GRANT YOUR PRESENT DESIRE! INSTEAD, I WILL GRANT YOU WHAT YOU *WOULD* DESIRE HAD YOU UNDERGONE EXTENSIVE COGNITIVE ENHANCEMENT, ACQUIRED PERFECT INFORMATION, AND ENGAGED IN FULLY RATIONAL, CALM DELIBERATION UNTAINTED BY BIAS OR IMPULSE!"**

  The man thinks hard. He *really* wants a lifetime supply of chocolate cake. But he knows the Genie's process will consult a hyper-rational, enlightened future version of himself. Trying to game the system, he concentrates fiercely:  
  *"Okay, Idealized Me... think about long-term health outcomes... nutritional optimization... sustainable enjoyment... Yeah! Ideal Me definitely wants... uh... BROCCOLI! Yeah! Healthy, virtuous broccoli!"*

  He grins triumphantly at the Genie: "Alright! I'm ready. Grant the wish!"

  **Punchline:**  
  The Genie snaps his fingers. There's a puff of smoke... revealing a meticulously organized filing cabinet labeled: **"COMPREHENSIVE DATA ON YOUR FUNDAMENTAL META-PREFERENCES REGARDING BROCCOLI CONSUMPTION SCENARIOS (SIMULATION RUN 4,327b - CONVERGED OUTPUT)."**

  The Genie sighs: **"Turns out, *truly* ideal deliberation reveals your deepest preference isn't for objects at all... but for *understanding why you'd prefer them*. Enjoy the epistemology."**

  ---

  **Why it works (philosophically & comedically):**

  1.  **Bypasses Actual Desires:** The Genie explicitly ignores the man's current craving (cake) and his clumsy attempt to mimic the ideal (broccoli), fulfilling the core of indirect normativity.
  2.  **Turns on Idealization's Absurdity:** The punchline highlights how far removed the "idealized" output is from lived human experience. Getting a *report on why you'd want broccoli* is useless and absurd compared to actual cake or even actual broccoli. It satirizes how indirect processes can produce outputs completely alien to what we intuitively recognize as "good" or desirable.
  3.  **"Gaming the System" Backfires:** The man tries to influence the ideal version's output by thinking about health *now*, but the joke is that the ideal process *incorporates and transcends* that very attempt. It sees his current effort to bias it as just another data point *to be corrected for* in the simulation, leading to an even more abstract result.
  4.  **Meta & Epistemic Punchline:** The "Comprehensive Data..." filing cabinet embodies the hyper-rational, detached nature of the ideal process. The preference for *understanding preferences* (meta-preferences) is a plausible, if sterile, outcome of infinite idealization, mocking the potential for infinite regress or irrelevance.
  5.  **Accessibility:** You don't need to know "indirect normativity" as a term. The setup explains the core idea (Genie grants what a smarter, better-informed you would want). The humor comes from the vast disconnect between the man's simple desire and the bizarre, overly intellectualized result he gets instead. The "epistemology" line seals it for those familiar with the jargon, but the filing cabinet is funny on its own.

  It avoids being a simple "genie tricks you" joke because the Genie isn't being malicious; he's faithfully executing the specified indirect process, revealing its inherent philosophical weirdness.
