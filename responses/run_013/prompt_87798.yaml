  Ines's choice in the new case commits her to a principle on the limits of within-family aggregation:
  - **If she says "not allowed" (cannot impose shallow burdens)**:
    - **Rule B Commitment**: She affirms a depth threshold. Permanent disability with chronic pain is non-aggregable, so no number of shallow complaints can outweigh it. This protects individuals from being sacrificed for aggregate gains, preserving Scanlon's "individual justification" core.
    - **Rule A or C Commitment**: If based on weights, she commits to the worker's burden being incommensurately large (Rule A) or diminishing returns making 400,000 insufficient (Rule C). This maintains quantitative aggregation but sets high barriers for deep burdens.
