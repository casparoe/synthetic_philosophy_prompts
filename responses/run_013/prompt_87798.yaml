         - Worker's burden: Chronic severe pain (daily) + permanent disability. From verdict 5, one day of severe pain ≈ `S = kM`, with `k < 30`. Assume chronic severe pain is similar to severe pain, so per-day weight is `S`. Over a typical 40-year working life (14,600 days), total pain burden ≈ `14,600S = 14,600kM`. Disability adds extra weight; assume conservatively `D` (disability) ≈ `S` per day, so total worker burden `W ≈ 29,200kM`.  
         - Shallow aggregate burden = 400,000 * `M`.  
