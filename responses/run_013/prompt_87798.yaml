  The five verdicts **underdetermine** the rules, as all three fit equally well with no contradictions. Evidence:
  - **Verdict 5 (severe vs. mild pain)** supports that aggregation occurs at `N=30`, but doesn't test very large `N` or very deep burdens. It is consistent with:
