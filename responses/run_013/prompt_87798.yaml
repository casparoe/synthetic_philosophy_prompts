  - Rule A is the simplest and aligns with Ines's "heads are counted" language, but verdict 5 suggests a low `S/M` ratio, making large `N` less effective.
  - Rule C has no direct support but is plausible if aggregation has diminishing moral weight.

  Overall, **Rule B (threshold-based) is best supported** by the verdicts, as it:
