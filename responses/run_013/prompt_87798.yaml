  ### Three Rules Fitting the Five Verdicts
  The five verdicts can be explained by multiple rules for within-family aggregation. Here are three plausible candidates, all consistent with Ines's stated framework but differing in how they handle deep complaints:

  1. **Rule A: Linear Head-Counting with No Ceiling (Pure Aggregation)**  
     - **Description**: Within a family, complaints are assigned fixed numerical weights based on depth. The total burden of multiple shallow complaints is the sum of their individual weights, with no upper limit. Any finite number of shallow complaints can outweigh a deeper one if the sum exceeds the deep complaint's weight.  
