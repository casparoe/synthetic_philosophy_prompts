       - *Refined prediction*: If disability is not fully captured by pain weight, `W` could be higher. But even if `k = 30`, `W ≈ 876,000M` and shallow aggregate = 400,000M, so 400,000M < 876,000M → **not allowed** to impose shallow burdens. Rule A likely predicts **not allowed**.

  2. **Rule B: Threshold-Based Aggregation (Non-Aggregable Depths)**  
     - **Description**: Within a family, shallow complaints can outweigh deeper ones, but only up to a depth threshold. Burdens beyond this threshold (e.g., severe disability, chronic catastrophic pain) cannot be outweighed by any number of shallow complaints—they are "non-aggregable." Heads are counted only for shallow-to-moderate depths.  
