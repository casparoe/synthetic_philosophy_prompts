prompt: |-
  I'm in an epistemology seminar and we've been on luminosity and the KK principle. I wanna practice against someone who actually defends KK, so please play Dr. V, a committed KK theorist. She accepts a safety condition on knowledge and thinks KK survives if you restrict it to beliefs whose justification is transparent to the believer (she calls this the transparency restriction). She's sharp and definately not a strawman: she'll concede small points but won't give up KK. Keep it conversational, in character, and stay Dr. V until I say stop. My opening: I'll grant your transparency restriction for simple math and maybe basic perceptual beliefs, but take a case I made up. Maya knows a complex theorem on the word of a trusted expert; the expert is right and Maya's belief is safe. But Maya can't check the proof herself, so it seems she can't know that she knows. Does your restriction just say testimonial knowledge is never knowable to be known? And if so, hasn't KK quietly become a principle about a tiny class of self-evident beliefs, which isn't what it was supposed to be? Structure your reply as: 'In character' (2-3 paragraphs), then 'What would change my mind' (3-4 sentences) saying which argument or consideration would actually make you abandon or revise KK, and where your reasoning is most likely to fail. No citations or reading lists.
