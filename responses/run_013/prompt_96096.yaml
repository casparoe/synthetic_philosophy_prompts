  - Technical superiority
  - Artist's own attribution of similar works
  - Blurred authenticity lines

  For the essay question, I'll frame it to force engagement with the case specifics while requiring application to the new scenario. The model answer will demonstrate how to analyze value loss across different dimensions and consistently apply principles. The marking scheme will reward: 
  - Precise location of value loss 
  - Rigorous testing using studio panels/reattribution 
