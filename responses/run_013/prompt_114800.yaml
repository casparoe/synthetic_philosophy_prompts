prompt: |-
  I have been arguing for weeks with two friends — one a law student, one an intensive-care nurse — about what makes consent valid, and the argument has left me with the suspicion that my verdicts are more consistent with one another than any principle I can state, which is either a discovery or a rationalization. I would like you to treat the following as data and tell me what principle, or small family of principles, actually captures them. (1) A patient consents to an appendectomy after the surgeon explains the risks, the alternatives, and what recovery involves: valid. (2) The same patient consents on the same terms, but the surgeon has quietly arranged for a junior resident to do most of the cutting and does not mention it, because the patient is nervous and would only fret: invalid — even though the patient would have said yes anyway and the operation goes perfectly. (3) A partner conceals a spouse, or an income, or a diagnosis of infertility; the sex that follows is valid. The same partner quietly removes the condom, or lies about having had a vasectomy: invalid. (4) A mugger's threat makes the surrender of my wallet invalid. An employer in a one-company town who says the contract is this or the door is valid, though I think the employer a scoundrel. (5) A professor who offers a passing grade for sex gets no valid consent at all. I notice that the professor threatens a small harm and the employer a large one, and yet only the professor's threat voids the consent. (6) A fifteen-year-old's consent to a vaccine is valid; the same fifteen-year-old's consent to sex with a thirty-year-old, or to donating a kidney, is not. A man in the early stages of dementia can validly consent to a haircut and cannot validly consent to selling the house his children grew up in. (7) A prisoner who volunteers for a paid medical experiment has not validly consented; a desperately poor man who agrees to sell a kidney is a case I cannot settle, and I want to say no for the prisoner and yes for the kidney seller, or the reverse on alternate days. (8) A boxer consents to being hit; a duelist cannot consent to being killed; a competent terminally ill adult can consent to being helped to die.

  One friend proposes that the deception cases turn on whether the lie concerns a boundary fact — something about what is being done to my body, and by whom — or a background fact about the world around the act, and that only the former voids consent. That handles (2) and (3) and says nothing at all about (4) and (5). My own tentative principle is that consent is valid when the person grasps the boundary being crossed, is not being moved across it by someone with no right to move them, and has the capacity to weigh a decision of that size; I suspect this is three clauses doing the work of one, and that at least one of my verdicts has to go.

  What I want is not a survey of positions but a principle that earns its keep against these cases. State it, or the small set of rival candidates, as precisely as you can, and for each clause name the case that forces it. Then tell me what the principle predicts for cases I have not listed — in particular, whether consent to sex given the night before, to be acted on while I am asleep, is valid; whether a liability waiver signed by a woman in advanced labor is valid; whether consent is valid when a patient is told a risk exists but not how likely it is; and whether a worker's agreement to a hazard the employer concealed but did not misdescribe is valid. Finally, be honest about which of my verdicts the principle cannot accommodate, and say whether you would revise the principle or the verdict. I am also unsure whether my verdicts are about consent being invalid or merely about consent being wrongfully obtained; if the principle needs that distinction, tell me where the line falls.
reasoning: |-
  Hmm, the user presents a fascinating philosophical puzzle about consent. They've been debating with friends (a law student and an ICU nurse) and want me to extract principles from their intuitive judgments across diverse scenarios. The cases range from medical consent to sexual ethics to economic coercion - quite the intellectual challenge.

  First I notice how carefully constructed these scenarios are. The user clearly has legal/ethical training - they're distinguishing boundary facts from background facts, noting asymmetries in threat severity (professor vs employer), and wrestling with capacity thresholds. Their "tentative principle" shows sophisticated thinking about autonomy boundaries.

  Key tensions I observe:
  - The deception asymmetry between surgical teams (invalid) vs concealed infertility (valid)
  - Why economic desperation invalidates prison consent but possibly validates kidney sales
  - The puzzle of permissible bodily violation (boxing) vs impermissible (dueling)

  Their unstated cases are particularly revealing - sleep sex, labor waivers, risk disclosure levels. These probe the edges of informed consent doctrine. I suspect they're testing whether their intuitions hold under pressure.

  The boundary/background distinction from their friend seems useful but incomplete - it handles cases 2-3 but fails on coercion cases. Their own three-clause principle risks being circular ("decision of that size" needs defining).

  For a unifying framework, I'm considering:
  1. Core bodily integrity as the protected interest
  2. Distinguishing coercive vs non-coercive power asymmetries
  3. Capacity as decision-specific rather than global

  The sleep sex case will test this - if consent requires contemporaneous capacity, it fails. The labor case highlights how stress impacts capacity. The risk disclosure question exposes medicine's "reasonable patient" standard.

  I'll need to flag where their intuitions conflict with the principle. Notably:
  - Their prisoner/kidney seller dilemma suggests our discomfort with exploitation may exceed our consent framework
  - The professor case might actually turn on authority misuse rather than threat magnitude

  The validity vs wrongfulness distinction matters too. Consent can be "invalid" (legally void) or "wrongfully obtained" (morally tainted but still binding). Their case 2 might be the latter - the patient did consent, just under false pretenses.

  This feels like drafting legislation - every exception requires justification. I'll organize by core principles first, then stress-test with their unresolved cases, finally showing where intuitions might need revision. The goal isn't to please but to provide analytical clarity.
answer: |-
  Based on your detailed scenarios and intuitive verdicts, a single core principle emerges as the most cohesive explanation, supplemented by two key clarifying distinctions. This framework prioritizes **autonomy over one's bodily integrity and fundamental life choices**, focusing on the nature of the *act consented to* and the *conditions undermining genuine choice*.

  **The Core Principle:**
  **Consent is valid only if the person has sufficient capacity to understand the nature and significance of the act, and their agreement is not procured by:**
      **(a) Deception about the core physical act or its essential boundaries;**
      **(b) Coercion that substitutes the coercer's will for the consenter's; or**
      **(c) An abuse of a necessary dependency relationship.**

  **Clauses Explained & Cases That Force Them:**

  1.  **"Sufficient capacity to understand the nature and significance of the act":**
      *   **Forced by:** (6) Haircut vs. Selling house (dementia), Vaccine vs. Kidney/Sex (15yo). Capacity isn't binary; it's relative to the *significance* of the act. A haircut's nature/significance is simple; selling a house or donating a kidney is complex and life-altering. (8) Boxer vs. Duelist: The boxer understands the act (controlled violence) and its significance (sporting contest). The duelist cannot validly consent because the act's nature (intentional killing) is of such profound significance that society deems it non-consentable *per se* (except in specific contexts like assisted dying, where the significance is reframed as ending unbearable suffering under strict safeguards).

  2.  **"(a) Deception about the core physical act or its essential boundaries":**
      *   **Forced by:** (2) Surgeon identity/agency & (3) Condom removal/vasectomy lie. The *physical act* consented to (surgery performed by qualified surgeon; sex with barrier/protection) differs fundamentally from the *actual physical act* (surgery performed significantly by unsupervised trainee; sex without barrier/protection). This is deception about the *boundaries* of the act itself.
      *   **Not forced by:** (3) Concealing spouse/income/infertility. These are "collateral facts" or motivations, not deception about the essential physical nature of the act (sexual intercourse). The core act remains unchanged.

  3.  **"(b) Coercion that substitutes the coercer's will for the consenter's":**
      *   **Forced by:** (4) Mugger vs. Employer & (5) Professor. The mugger and professor issue *illegitimate threats* designed to overcome the victim's will. The mugger threatens direct violence; the professor abuses their authority to threaten an academic penalty unrelated to the demand (sex). The employer, while a scoundrel, makes a *legitimate* (though harsh) offer regarding employment terms ("work under these conditions or leave"). The threat (job loss) is directly related to the subject of the agreement (work). This clause distinguishes *extortion* (illegitimate threat) from *hard bargaining* (legitimate offer/ultimatum within context).

  4.  **"(c) An abuse of a necessary dependency relationship":**
      *   **Forced by:** (5) Professor & (7) Prisoner. The professor exploits the inherent power imbalance in the student-teacher relationship, making consent impossible. The prisoner is in a state of necessary dependency (the prison controls their life), making truly voluntary consent to experiments within that system highly suspect. This clause focuses on relationships where one party has significant, non-negotiable authority over the other's fundamental well-being.

  **Applying the Principle to Your Unlisted Cases:**

  1.  **Sleep Sex (Consent given night before, acted on while asleep):**
      *   **Prediction: Invalid.** Consent requires contemporaneous capacity to understand the *nature* of the act occurring. Being asleep negates this capacity. The prior consent is not a continuous authorization for a future act where the person is incapacitated during the act itself. (Relates to Capacity and Nature of Act).

  2.  **Liability Waiver Signed in Advanced Labor:**
      *   **Prediction: Likely Invalid.** Advanced labor involves intense pain, stress, and often medication (e.g., epidurals), severely impacting the capacity to understand the *significance* of a legal waiver releasing rights. This likely falls below the capacity threshold required for such a significant decision. (Relates to Capacity/Significance).

  3.  **Told Risk Exists but Not Probability:**
      *   **Prediction: Likely Invalid for significant medical procedures.** Understanding the *nature* of a risk includes a reasonable sense of its likelihood. A "risk of paralysis" could mean 0.1% or 50%. Omitting material probability information prevents genuine understanding of the act's significance, voiding informed consent. (Relates to Deception about Nature/Significance - omission of material fact).

  4.  **Worker Agrees to Hazard Employer Concealed but Didn't Misdescribe:**
      *   **Prediction: Invalid.** Actively concealing a known hazard is equivalent to deception about the *nature* of the working conditions the worker is consenting to. The worker cannot understand the significance of the risk if its existence is hidden. This violates (a) Deception about the core act/conditions. (Non-disclosure is fraudulent concealment).

  **Accommodating Your Verdicts & Necessary Revisions:**

  *   **Accommodates Well:** (1) Appendectomy (Valid), (2) Resident Surgeon (Invalid - Deception a), (3) Condom Removal (Invalid - Deception a) / Concealed Infertility (Valid - Collateral Fact), (4) Mugger (Invalid - Coercion b) / Employer (Valid - Hard Bargain), (5) Professor (Invalid - Abuse c), (6) Age/Capacity Cases (Capacity Clause), (8) Boxer (Valid - Nature understood) / Duelist (Invalid - Significance too great) / Assisted Dying (Valid - Significance reframed, Capacity).
  *   **Accommodates with Nuance:** (7) Prisoner: Invalid (Abuse of Dependency c). This aligns with your "no" verdict.
  *   **Struggles With:** (7) Desperately Poor Kidney Seller. This is the hardest case for the principle. The principle leans towards **Invalid** because the *coercion* (b) comes from systemic desperation (poverty, lack of alternatives), not a specific actor, and the *significance* (c) is extreme. However, it doesn't fit neatly into "substitution of will" by a specific coercer or "abuse of dependency" by a specific authority figure. This exposes a limitation: the framework is strongest against *agent-specific* wrongdoing. To accommodate a "valid" verdict here, the principle would need a major revision weakening the coercion clause regarding systemic pressures, which might undermine cases like the mugger. **Recommendation:** Stick with the principle and revise the verdict. The kidney seller's consent, while perhaps legally permitted in some places under strict regulation, is morally compromised by the *duress of circumstance*, making it ethically problematic and arguably invalid as a truly free choice regarding bodily integrity. Your discomfort reflects this tension.

  **Validity vs. Wrongful Obtainment:**
  The principle focuses on **validity** – whether the consent is legally and morally effective to authorize the act. An act with invalid consent is a *violation* (e.g., battery, rape, assault). **Wrongful obtainment** is a broader category. Consent can be valid but *wrongfully obtained* (e.g., the surgeon using the resident without disclosure - the consent might be valid *for an appendectomy by a qualified surgeon*, but the surgeon wrongfully obtained it by fraud, making *him* liable for deceit/battery *by the resident*). The deception in (2) and (3) (condom) voids validity *for the act that occurred*. The collateral deception in (3) (infertility) doesn't void the consent's validity *for the sexual act that occurred*, but it was *wrongfully obtained* and could make the deceiver liable for fraud or emotional harm.

  **Conclusion:**
  Your intuitive judgments are remarkably consistent with a principle centered on protecting bodily integrity and fundamental life choices through informed, capable, and unforced agreement. The key distinctions are deception about the act's *core physical nature/boundaries* vs. collateral facts, *illegitimate coercion/extortion* vs. hard bargaining, and the *abuse of necessary dependency relationships*. Capacity is decision-specific. The principle clearly handles most cases, struggles most with systemic economic coercion (kidney seller), and strongly suggests revising that verdict to "invalid" or at least "ethically compromised and potentially voidable." The distinction between *invalid consent* (rendering the act a violation) and *wrongfully obtained but potentially valid consent* (rendering the obtainer liable for fraud/misrepresentation) is crucial for understanding nuances like Case (2).
