prompt: |-
  I'm a fourth-year PhD student — formal epistemology / decision theory, my department can't decide which — and I've somehow become the person who runs the "disagreement" segment of our weekly forecasting meeting. Eight of us, mostly grad students plus two postdocs, forecasting things like will this bill pass, will this replication hold up, will this trial read out positive. House rule: if two of us are more than 0.15 apart on the same question, anyone can call deadlock, and then it's on me to run... whatever it is I'm supposed to run. Right now I basically make them talk at each other and we all go home.

  I want you to act as an expert in Bayesian epistemology and epistemic game theory who is also unusually good at turning theory into something a tired facilatator can actually execute live. Think carefully about this before you answer, and start with a short brainstormed list of the ways a deadlock like this can fail, so I can see the space before you commit to a procedure.

  What I want: a decision procedure I can run on two members, in maybe 30 minutes, questions in order, with what counts as a sufficient answer to each, and with explicit stop points — where it stops with a verdict of "you two aren't actually disagreeing in the sense that matters", and where it stops and hands the thing back to a human because it turns out not to be that kind of question. Ground it in Aumann's agreement theorem and be exact about the theorem's assumptions, because the whole point of this for me is that the theorem tells me *which* assumption must have failed when a disagreement survives. I don't want a summary of the theorem — I want the diagnostic that falls out of its assumptions.

  Three things it has to handle, because they're the three things that actually happen to us:

  1. One colleague ends every deadlock with "we just have different priors," and it's transparently a get-out-of-jail-free card. I want the procedure to make that move cost something: what does someone have to actually show before claiming the residual disagreement is a prior difference rather than one of the other failure modes? I suspect the honest answer is that "different priors" is what you're entitled to say only after you've failed the earlier tests, and I want the procedure to enforce that order and to say what a legitimate prior dispute looks like from the outside.

  2. Is each of us saying our number out loud, and hearing the other's, enough to get the common-knowledge condition? I have a nagging suspicion that most of our deadlocks are quietly failing that condition — that we each know the other's number but not really the other's reasons, or not that the other knows that we know. Give me a concrete test for when common knowledge of the posteriors has actually been achieved, as opposed to merely announced.

  3. The colleague who knows the literature keeps saying we should just iterate — announce, update, announce — and that convergence is guaranteed. Is that true, and under exactly which assumptions? If it's true, why doesn't it work for us? And if the guarantee has fine print, what's the shape of the case where it doesn't bite? I want to know whether "just keep announcing" is a real procedure or a myth with an asterisk.

  Then run the procedure on three cases. I want the third one to give an answer I won't like:

  - Two of us at 0.2 and 0.6 on whether a bill passes. We've both read the same three polls, we've both shared them, and we're still sitting there.
  - Two of us on whether a published effect will replicate — one says 0.3, the other 0.75.
  - A case where the honest output of the procedure is that no amount of Bayesian machinery is going to converge us, and where running the protocol anyway is making things worse by dressing a non-Bayesian disagreement up as a Bayesian one. Pick the most realistic version of that you can and tell me what the procedure should say instead of pretending.

  Also flag what the procedure can't do. I'd much rather see the edges than have it look more powerful than it is — and be honest about which steps are real tests and which are judgment calls I'm dressing up as tests.

  Format: lead with the bottom line in your first sentence — the one-sentence version of the procedure, the thing I'd write on the whiteboard — then the reasoning and the steps. No preamble, no restating my question back to me.
reasoning: |-
  Okay, let me start by really understanding what this PhD student needs. They're dealing with recurring deadlocks in their forecasting group, where two people have probabilities more than 0.15 apart. They want a structured procedure based on Bayesian epistemology and Aumann's agreement theorem to resolve these disagreements efficiently. 

  First, I need to recall Aumann's theorem thoroughly. The core idea is that if two agents have common knowledge of each other's beliefs and they update with the same likelihoods, their probabilities must agree. The key assumptions here are common priors, common knowledge of posteriors, and Bayesian updating. When disagreements persist, it means one of these assumptions is violated.

  The user mentioned three common failure modes in their group. One person always claims "different priors" as an escape hatch. I need to make sure the procedure forces them to rule out other possibilities first. Then there's the issue of whether just announcing numbers is enough for common knowledge—probably not, since they might not share the reasoning behind them. And the iteration idea—does repeatedly updating actually guarantee convergence? I remember that it does under common priors and common knowledge, but real-life groups often lack those.

  For the procedure, I should structure it as a step-by-step diagnostic. Start by checking if they've truly shared all relevant information. Then verify if they agree on the likelihoods of the evidence. If they do, the disagreement must come from prior differences. But to claim different priors, they need to show that they've exhausted the other possibilities. 

  Common knowledge is tricky. Just stating probabilities isn't enough; they need mutual recognition of each other's reasoning. Maybe include a step where each must restate the other's argument to satisfaction. If they can't, that breaks the common knowledge condition, and the procedure stops.

  For iteration, it's theoretically sound but fails without common priors. If they iterate and still disagree, it signals prior differences or non-shared evidence. But in practice, if priors differ, iterating might not help. The procedure should have a clear stopping point after a few rounds to avoid endless loops.

  Now, the three test cases. The bill passing with 0.2 vs 0.6 despite same polls: likely different interpretations of evidence or priors. The replication at 0.3 vs 0.75: could be methodological disagreements, falling under likelihood issues. The third case where Bayesian methods fail: maybe values or non-epistemic factors. Here, the procedure should halt and flag it as beyond Bayesian resolution.

  I also need to highlight limitations. Steps like verifying common knowledge are judgment calls. The procedure can't handle deep prior differences or non-epistemic disputes. Being transparent about these edges is crucial so the user doesn't overtrust it.

  Finally, structuring the response: lead with a one-sentence procedure, then detailed steps, assumptions, failure modes, and examples. Keep it practical, grounded in theory but executable in 30 minutes. Make sure each step has clear pass/fail conditions to avoid ambiguity.
answer: |-
  ### Bottom Line:  
  **Run a three-step diagnostic: verify shared evidence, align likelihoods, then confirm common knowledge of posteriors—stopping with "no substantive disagreement" if any step fails—before attributing residual divergence to prior differences.**

  ---

  ### Core Reasoning & Procedure Foundation  
  Aumann’s agreement theorem implies that two rational agents with **common priors** and **common knowledge of posteriors** *must* agree. Persistent disagreement reveals violation of one or more assumptions:  
  1. **Non-shared evidence** (violates common knowledge of information).  
  2. **Different likelihood models** (violates common updating).  
  3. **Lack of common knowledge of posteriors** (violates "common knowledge" condition).  
  4. **Different priors** (violates common prior assumption).  

  The procedure isolates these failure modes sequentially. Steps 1–3 are strict tests; Step 4 requires judgment.  

  ---

  ### Step-by-Step Procedure (25–30 min)  
  **Question 1 (5 min): "Have you fully shared all relevant evidence?"**  
  - *Sufficient answer:* Each states the *other’s* key evidence and its source.  
  - **Stop if:** Both confirm no new evidence exists ("no substantive disagreement—hidden evidence").  
  - **Continue if:** New evidence emerges—integrate it and recalc posteriors. If gap remains, proceed.  

  **Question 2 (10 min): "Do you agree on how each piece of evidence affects the odds?"**  
  - *Sufficient answer:* For each shared evidence piece *E*, both state the likelihood ratio *P(E|H)/P(E|¬H)* they assign.  
  - **Stop if:** Likelihood ratios differ >20% on critical evidence ("non-Bayesian disagreement—divergent models").  
  - **Continue if:** Likelihoods align (<10% variance) but posteriors diverge.  

  **Question 3 (5 min): "Can you restate the other’s argument to their satisfaction?"**  
  - *Sufficient answer:* Each paraphrases the other’s *entire* reasoning chain (priors + likelihoods + evidence → posterior).  
  - **Stop if:** Either rejects the paraphrase ("no common knowledge—misunderstood reasoning").  
  - **Continue if:** Both endorse the paraphrase.  

  **Question 4 (5 min): "What prior would make your posterior rational given shared evidence and aligned likelihoods?"**  
  - *Sufficient answer:* Each states the prior *P(H)* that justifies their posterior *given shared likelihoods*.  
  - **Verdict:** Residual divergence is now attributable to "legitimate prior differences."  

  ---

  ### Handling Your Three Issues  
  1. **"Different priors" as escape hatch:**  
     - Prior differences are only valid *after* Steps 1–3 pass. Step 4 forces explicit calculation: *"Your posterior is 0.6. With our shared likelihood for Poll X, your prior must have been 0.4. Is that correct?"* Legitimate disputes are quantifiable and model-consistent.  

  2. **Testing common knowledge:**  
     - Merely hearing "I’m 0.6" ≠ common knowledge. Common knowledge requires:  
       - I know your probability.  
       - You know I know.  
       - I know you know I know, etc.  
     - **Step 3 is the test:** If you can’t restate my *reasoning* to my satisfaction, common knowledge fails.  

  3. **Iterative updating:**  
     - Iteration converges *only* if agents share a common prior and common knowledge of information partitions (Aumann 1976).  
     - **Why it fails for you:** Hidden evidence or divergent likelihoods prevent convergence.  
     - **Fine print:** If priors differ or likelihoods aren’t common knowledge, iterating may *amplify* disagreement.  
     - **Procedure use:** After Step 1, one round of re-announcing posteriors is allowed. Persistent gap triggers Step 2.  

  ---

  ### Test Cases  
  **Case 1 (Bill passes: 0.2 vs. 0.6, same polls)**  
  - Step 1: Both list polls → no new evidence.  
  - Step 2: Likelihood ratios differ:  
    - Poll A: LR = 3.0 (0.2) vs. LR = 1.2 (0.6) → "Divergent models. Stop."  
  - *Diagnostic:* Disagreement stems from interpreting poll reliability (likelihoods), not priors.  

  **Case 2 (Replication: 0.3 vs. 0.75)**  
  - Step 1: Shared evidence includes methodological flaws.  
  - Step 2: Likelihoods align (flaws reduce odds similarly).  
  - Step 3: Both restate arguments correctly.  
  - Step 4: Priors calculated:  
    - 0.3 prior: 0.25 (strong skepticism of social psych)  
    - 0.75 prior: 0.65 (trust in peer review)  
  - *Diagnostic:* Legitimate prior difference.  

  **Case 3 (Non-Bayesian Disagreement: You Won’t Like This)**  
  - **Scenario:** Forecasting "Will AI cause existential risk by 2040?"  
    - Alice: 0.05 (based on hardware scaling laws)  
    - Bob: 0.7 (based in dynamical systems theory)  
  - Step 1: Evidence "shared," but Alice’s evidence is physical, Bob’s is mathematical.  
  - Step 2: Likelihoods incomparable (different variables: transistors vs. chaos thresholds).  
  - **Stop at Step 2:** "Divergent models—non-overlapping hypotheses. Not resolvable by Bayesian alignment."  
  - *Why it fails:* The questions are materially different ("AI risk by scaling" vs. "AI risk by emergent chaos"). Forcing convergence misrepresents the disagreement.  

  ---

  ### What the Procedure Can’t Do  
  - **False precision:** Steps 1–3 are binary (pass/fail); Step 4 requires judgment.  
  - **Non-epistemic disputes:** Won’t resolve disagreements rooted in values (e.g., "This replication *should* hold").  
  - **Deep prior differences:** Identifies but doesn’t reconcile them (e.g., Case 2).  
  - **Complex evidence:** Struggles with >5 evidence pieces in 30 min.  

  **Key Judgment Calls:**  
  - Step 1: What counts as "relevant evidence"? (Facilitator rules ad hoc.)  
  - Step 2: Threshold for likelihood misalignment (20% variance suggested).  
  - Step 4: Accepting stated priors as sincere.  

  **Power:** Forces transparency in divergence. 80% of your deadlocks will likely fail at Steps 1–3.  

  > "The theorem doesn’t resolve disagreement—it diagnoses why resolution failed."
