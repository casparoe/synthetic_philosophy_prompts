prompt: |-
  I'v been keeping a running list of my gut verdicts about when a thing at one time is the same thing as a thing at another time, and I want to know whether there's one principle behind them or whether I'm just making it up case by case.

  A wooden bench my grandfather built, with three of its four legs replaced: same bench. Replace the fourth leg too, so no original wood is left: still the same bench, I'm fairly sure. But a bench someone builds from scratch to look exactly like it, using the rotted original as firewood: not the same bench, even though it has more of the original material in it than the repaired one does.

  A person who loses all her memories in an accident: same person, no question. A person changed by decades of age and experience until she and her younger self share almost nothing: same person, though the two wouldn't recognize each other.

  A river whose every drop of water has been replaced: same river. A river that's dammed, its old bed dried up, and a new channel cut that carries the same water: I want to say the river moved, but I also feel the old river stopped existing and a new one started.

  A company where every employee and every shareholder has turned over: same company. A company that's bought, gutted, its name kept and nothing else: not the same company, or barely.

  A song played by a different band, in a different key: same song. A song whose every note has been changed, one at a time, over a century of being passed along by ear: still the same song to the people singing it — and I find I agree with them, though I can't say what makes that different from the gutted company.

  A file I edit and save on my laptop: same file. A file I copy to a new drive and delete from the old one: same file, I'd say, even though nothing physical carried over. But two copies that both keep going, both edited from then on: now I don't think either one is *the* file anymore, which is odd, since each one seems to have everything that made the copy the same file in the first place.

  Is there a principle that captures these, or close? What does it say about a case I keep flip-flopping on — a person whose brain is divided and each half put into a new body, both waking up claiming to be her? And which of my verdicts, if any, would the principle make me give up? I teach this stuff and I'd like to be able to tell my students what I actually think.
reasoning: |-
  Okay, the user is a philosophy teacher who's been compiling personal intuitions about identity over time. They're looking for a unifying principle behind their judgments on various thought experiments - the Ship of Theseus, personal identity, corporate identity, etc. 

  Hmm... their examples show deep familiarity with classic puzzles: the bench (material persistence vs functional continuity), the river (spatiotemporal continuity vs causal flow), the company (organizational structure vs branding), and especially the brain bisection case (which hits hard at personal identity). The fact they teach this suggests they need something academically rigorous yet personally reconcilable.

  Their core struggle seems twofold: first, whether there's a consistent principle behind their intuitions, and second, how to handle the brain fission case that destabilizes their other certainties. The teaching context raises the stakes - they can't just say "it's complicated" to students.

  Interesting how their examples cluster around three axes: material continuity (bench legs), causal history (river diversion), and narrative/functional persistence (personality changes). But they're frustrated when these conflict - like the copied file where both copies seem equally valid until divergence.

  The brain bisection case is the real litmus test. Their flip-flopping there is completely normal - it's why Parfit used it to challenge identity. I should acknowledge that even professional metaphysicians divide on this. The key is showing how their other intuitions might force trade-offs here.

  They're clearly intellectually honest - noting where their feelings conflict (the dammed river) or seem inconsistent (song vs company). That's good! Means they'll appreciate me pointing out which of their judgments might need rethinking under a unified theory.

  For teaching purposes, the "causal continuity under functional kind" framework seems most promising. It explains why the bench persists through leg replacements (functional integrity maintained) but not replication (causal break). Same for the song (continuous transmission) vs gutted company (corporate function destroyed). 

  But I must flag the costs: this approach likely forces surrendering the file copy as identical (since causal history splits), and may require saying the bisected person doesn't survive (if identity can't branch). Alternatively, embracing narrative continuity could save the person case but sabotage the bench/material examples. 

  Ultimately they'll need to decide which intuitions are non-negotiable. The river case might be the pivot - if they accept the dammed river as moved (spatiotemporal path), that leans toward causal-historical theories; if as destroyed, that favors functional persistence. 

  Should emphasize that many philosophers use multiple criteria weighted differently per domain. Their examples already suggest they intuitively do this - no shame in that! The "making it up" feeling comes from applying context-dependent standards, which is actually sophisticated.
answer: |-
  Your intuitions reveal deep coherence—you're recognizing that persistence depends on *what kind of thing* we're talking about and *what makes it the thing it is*. Here’s a unified principle that fits your judgments:

  ### The Principle: **Causal Continuity of Essence**
  **"X at time T1 is the same as Y at T2 if Y’s essential properties are maintained through an uninterrupted causal process originating from X."**

  This breaks down into:
  1. **Essence:** What defines the thing’s identity (e.g., function, structure, origin).
  2. **Causal Continuity:** No total "break" in the chain of existence.
  3. **Uninterrupted Process:** The thing persists *through* change, not by replacement.

  ### How It Explains Your Cases:
  | **Case**                  | **Your Verdict**      | **Principle's Explanation**                                                                 |
  |---------------------------|-----------------------|---------------------------------------------------------------------------------------------|
  | **Bench (legs replaced)** | Same bench            | Functional essence (grandfather’s creation) persists via causal continuity of repairs.        |
  | **Exact replica bench**   | Different bench       | Causal chain broken; replica lacks origin connection. Material similarity ≠ identity.         |
  | **Amnesiac person**       | Same person           | Biological/origin essence persists. Psychological change isn’t essential to personal identity. |
  | **Aged person**           | Same person           | Causal continuity of biological life + narrative identity.                                   |
  | **River (water replaced)**| Same river            | Geospatial path and continuous flow define its essence.                                      |
  | **Dammed river**          | New river OR moved    | **Conflict:** If path defines essence, it’s gone. If *flow* defines, new channel might be same river "moved." Your hesitation reflects ambiguity in the river’s essence. |
  | **Company (staff turnover)**| Same company        | Organizational structure/purpose persists via causal continuity (hiring, policies).           |
  | **Gutted company**        | Not the same          | Essential structure/purpose destroyed; only branding remains (causal break).                 |
  | **Song (transposed/key)** | Same song             | Structural essence (melody/harmony) persists. Performance is incidental.                     |
  | **Song (evolved by ear)** | Same song             | Causal continuity of transmission preserves identity despite drift; essence is historical lineage. |
  | **Edited file**           | Same file             | Causal continuity via saving; digital essence is informational history.                      |
  | **Copied-then-deleted file**| Same file            | Causal chain transferred intact; no duplication conflict.                                    |
  | **Diverging copies**      | Neither is *the* file | Causal continuity splits; both share origin but neither uniquely inherits the identity chain. |

  ### The Brain Bisection Case:
  - **Scenario:** A person’s brain is split; each half is transplanted into a new body. Both claim to be her.
  - **Principle’s Answer:** This forces a trade-off:
    - If psychological continuity defines personhood, *both* might be her (but identity can’t branch—contradiction).
    - If biological/origin essence is primary, *neither* is fully her (since no whole brain persists).
    - **Your principle likely implies:** Neither is *the original person*, because causal continuity has irreparably split. They are two new persons sharing her past (like the diverging files). This matches your file-copy intuition.

  ### Which Verdicts Might Need Revising?
  1. **The gutted company:** If "brand identity" is deemed essential, it *could* be the same company (e.g., Disney). You reject this, implying essence is deeper (operations/purpose). Stick with your verdict.
  2. **The dammed river:** You must resolve essence ambiguity. Your intuition leans toward *spatiotemporal path* (dried bed = dead river). The principle supports this if location is essential.
  3. **Brain bisection:** Accepting neither clone is "her" conflicts with psychological continuity theories. But it aligns with your file-copy verdict and avoids identity branching.

  ### Why This Works:
  - **Flexibility:** Essence varies by entity type (e.g., bench = origin/function, song = structure/history).
  - **Causal Threshold:** Catches "replacement" scenarios (replica bench, gutted company) where continuity breaks.
  - **Non-Materialism:** Explains digital files and songs—identity isn’t tied to physical substrate.

  ### Teaching It:
  Tell students:  
  *"Persistence requires a core 'self' (essence) maintained by an unbroken chain of cause-and-effect. Change is allowed, but total replacement or splitting breaks the chain. What the 'core' is depends on what kind of thing we’re talking about—a river isn’t a song, and a person isn’t a file."*

  This framework honors your intuitions while providing a testable principle. The brain fission case exposes its limits—but that’s where philosophy begins!
