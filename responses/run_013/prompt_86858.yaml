prompt: |-
  I am advising the director of a bioethics institute who holds funding for a four-person, three-year research programme and must decide where its centre of gravity should lie. The subject is the therapy/enhancement distinction: not whether some particular line can be drawn, but which of the open questions about such lines are worth a programme's scarce years. Assume the director is indifferent to adding another round to the familiar arguments and will judge the programme by whether it changes how some institution — an insurer, a regulator, an admissions office, a sporting body, a health ministry — actually decides cases.

  To force the analysis away from the well-worn binary, I would like the answer organised around the following scheme, which I have found more useful than the distinction itself. Any proposed line between treating and enhancing can be asked to do three jobs, and it can do them one at a time:

  - *Distributive*: allocate scarce resources, excuse obligations, and identify who is worse off through no fault of their own.
  - *Expressive*: mark what a society treats as a misfortune to be remedied, as against an advantage to be envied or a vice to be discouraged.
  - *Gatekeeping*: tell an institution whether it is looking at a medical need, a technology, or a consumer preference, and therefore which evidence standard, risk tolerance, and regulatory regime apply.

  A line can succeed at one of these jobs and fail at another, and the failure is usually silent: a rule that is defensible as an allocation may be indefensible as a public statement, and the reverse.

  Given that scheme, tell me which open questions the programme should prioritise, and in what order. I am less interested in the list than in the reasoning: for each question, why it is upstream of the others, whether it is tractable for philosophers rather than for clinicians or economists, whose behaviour would change if it were settled, and what would move it up or down the ranking over the three years. Which of the three jobs is most under-served by the current debate, and which apparent controversies would turn out to be idle once the jobs are separated?

  Then stress-test the ordering against two cases. First, a cheap, safe, universally available intervention that raises some measurable capacity far above the population norm, with no medical indication. Second, two recipients of the identical intervention, at the identical dose, with identical effects, one of whom carries a diagnosis and one of whom does not. Say which of the three jobs the label can still do in each case, and whether your ranking survives.

  Fold in one further consideration: the baseline of normal functioning appears to migrate, as spectacles, orthodontia, fertility treatment, and stimulants for the diagnosed once did, so that a line drawn on the disease side today tends to become an enhancement line later. Treat that migration as a phenomenon to be explained rather than a fallacy to be exposed, and say what it implies about which of the three jobs a stable line can do at all.

  I do not need a survey of the literature. I need a defended agenda, with the criteria stated, the trade-offs acknowledged, and an explicit account of what would change the ranking.
reasoning: |-
  Hmm, this is an intricate and sophisticated request about bioethics research prioritization. The user is advising a director who needs to allocate limited resources for a 3-year program on the therapy/enhancement distinction, with a very specific framework focused on institutional impact. 

  The user has constructed an exceptionally clear analytical framework - distributive, expressive, and gatekeeping functions - and wants research prioritized based on which unresolved questions could actually change institutional behavior. They're explicitly rejecting rehashing old debates. I need to honor that precision while addressing all layers: the three functions, the stress-test cases, the migrating baseline phenomenon, and the practical constraints.

  Key points standing out:
  - The director judges success by institutional behavior change - insurers, regulators etc. This makes it applied rather than theoretical.
  - The three-function framework is brilliant because it explains why the same distinction fails in different contexts. A line good for resource allocation might send terrible social signals.
  - The stress tests are perfect for exposing functional limitations - especially the second case where diagnosis is the only variable.
  - The migrating baseline is crucial - it's not a mistake but a feature to analyze.

  For prioritization, I'm considering:
  First priority should be gatekeeping questions because they're most directly tied to institutional behavior - regulators and insurers live by evidence standards and risk tolerances. It's also where philosophy can add unique value on conceptual foundations that frame evidence requirements.

  Second, distributive justice issues, as resource allocation decisions are where bioethics meets real-world constraints. But it requires careful handling of "normal functioning" debates.

  Last, expressive function - while important, it's less immediately actionable for institutions and more about cultural perceptions. 

  The stress tests reveal that:
  - In the universal enhancement case, only expressive function remains relevant
  - In the diagnosis-only difference case, distributive and gatekeeping functions collapse
  This actually reinforces the prioritization - showing why gatekeeping needs most work.

  On migrating baselines, this phenomenon most directly sabotages gatekeeping functions, making it urgent for first-priority research. The program should investigate what social/technological drivers make institutions reclassify interventions.

  The user clearly values actionable insights over academic exercises. My response should mirror their precision - defending each choice with the framework they provided, acknowledging trade-offs, and specifying what would change rankings (e.g., if sporting bodies suddenly faced enhancement scandals, expressive questions might jump priority).
answer: |-
  Here is a prioritized research agenda grounded in your functional framework, designed to maximize institutional impact by addressing the most consequential and tractable gaps in the current debate. The ranking balances **upstream conceptual leverage**, **institutional urgency**, and **neglected functions**, with explicit criteria and adjustment triggers.

  ### Core Prioritization Criteria:
  1.  **Upstreamness:** Does clarifying this question resolve ambiguity in multiple downstream applications?
  2.  **Institutional Leverage:** Whose behavior (regulator, insurer, etc.) would demonstrably change if this question were settled?
  3.  **Functional Neglect:** Which of the three jobs (Distributive, Expressive, Gatekeeping) is least addressed in ways usable by institutions?
  4.  **Philosophical Tractability:** Can conceptual analysis (not just empirical data) make unique progress?
  5.  **Migration Vulnerability:** How destabilizing is the "migrating baseline" to this line's function?

  **Priority Ranking & Rationale:**

  1.  **Question: What constitutes the relevant "reference class" for establishing "normal function" or "species-typical functioning" for Gatekeeping purposes?**
      *   **Why #1 (Upstream & Leverage):** This is foundational for *Gatekeeping*. Regulators (FDA, EMA), insurers (coverage decisions), and sporting bodies (doping rules) *must* implicitly or explicitly define a baseline against which "restoration" (therapy) vs. "augmentation" (enhancement) is judged. Current ambiguity leads to inconsistent evidence standards (e.g., ADHD meds for diagnosed vs. non-diagnosed, growth hormone for idiopathic short stature vs. familial short stature). Settling the principles for defining the reference class (statistical? functional? local? global? age-adjusted?) would directly change how these institutions frame their questions about risk/benefit and medical necessity. Philosophers excel at analyzing the normative implications of different reference class constructions (e.g., why "species-typical" vs. "age-typical" matters for risk tolerance).
      *   **Functional Neglect:** Gatekeeping is critically under-served. Debates obsess over *whether* a line exists or *where* it should be drawn in specific cases, neglecting the prior question of *what the line is measuring against*. This failure drives institutional inconsistency.
      *   **Migration Vulnerability:** High impact. The migration phenomenon (spectacles -> LASIK) is *primarily a shift in the accepted reference class or its interpretation*. Understanding how and why reference classes evolve (social acceptance, technological normalization, evidence of benefit/harm) is key to designing *stable-enough* Gatekeeping lines. Philosophers can dissect the drivers (expressive shifts? distributive pressures?) better than clinicians or economists alone.
      *   **Tractability:** Highly tractable for philosophical analysis (concepts of normality, species, function, harm) informed by sociology of technology and historical case studies.
      *   **Adjustment Trigger:** Moves **down** if empirical work overwhelmingly shows institutions purely use *pragmatic* (cost/benefit) baselines insensitive to conceptual nuance. Moves **up** if a major regulatory controversy (e.g., cognitive enhancers, genetic embryo selection) erupts directly over reference class definition.

  2.  **Question: Under what conditions should the Expressive function override or constrain Distributive or Gatekeeping functions in institutional decision-making?**
      *   **Why #2 (Leverage & Neglect):** This addresses the silent clash between jobs. Insurers denying coverage for "vanity" procedures (Distributive efficiency) may send harmful messages about body image (Expressive harm). Sporting bodies banning enhancements may express valuable ideals of fairness but struggle with Gatekeeping consistency (e.g., altitude tents vs. EPO). *Institutions rarely articulate or justify these trade-offs.* Clarifying principles for when expressive concerns legitimately trump others (e.g., preventing stigmatization, upholding core social values like "natural" competition) would change how review boards, ministries, and ethics committees deliberate and justify decisions. It forces institutions to be explicit about the values they are promoting beyond efficiency or safety.
      *   **Functional Neglect:** The *interaction* and potential *conflict* between the three jobs is profoundly neglected. Debates treat them as separate or assume alignment. This question forces separation and prioritization.
      *   **Upstreamness:** Resolving this provides a framework for handling countless specific controversies where one function's logic clashes with another's (e.g., should public funds cover transition-related care? Is cognitive enhancement "cheating"?).
      *   **Migration Vulnerability:** Moderate impact. Expressive meanings *drive* baseline migration (fertility treatment shifting from "luxury" to "necessity"). Understanding how expressive judgments evolve and should interact with other functions helps predict and manage migration's institutional impact.
      *   **Tractability:** Philosophers are adept at analyzing value conflicts, normativity, and the social meaning of actions/policies. Requires collaboration with socio-legal scholars.
      *   **Adjustment Trigger:** Moves **up** if a high-profile case triggers public outcry primarily about expressive harm/injustice (e.g., denial of coverage deemed stigmatizing). Moves **down** if institutions prove completely resistant to incorporating expressive analysis beyond PR.

  3.  **Question: What constitutes "worse off through no fault of their own" (Distributive core) in a context of widespread potential enhancement and migrating baselines?**
      *   **Why #3 (Foundational but Complex):** This is the heart of Distributive justice for healthcare resources (insurers, ministries). However, migration and enhancement possibilities strain the concept. If "normal" function can be easily exceeded, is someone with "old normal" function now "worse off"? Does "no fault" include societal choices that shift the baseline? Clarifying this is crucial for fair allocation but is highly contested and context-dependent.
      *   **Functional Neglect:** While distributive justice is heavily debated, the *specific interaction* with enhancement possibilities and baseline migration is less developed in ways directly applicable to institutional allocative decisions. The "no fault" criterion is often assumed, not analyzed in this new context.
      *   **Institutional Leverage:** High potential impact on insurers and public health ministries setting coverage priorities, but harder to implement than Gatekeeping rules due to strong cost pressures.
      *   **Migration Vulnerability:** Extremely High Impact. Migration directly challenges the stability of the "worse off" baseline used for distribution. The phenomenon *is* a distributive pressure cooker. Research must explain migration as a consequence of changing perceptions of disadvantage and entitlement, not just a conceptual error.
      *   **Tractability:** Challenging but suitable for philosophical analysis (theories of disadvantage, responsibility, fairness) combined with policy analysis. Less immediately resolvable than Gatekeeping reference classes.
      *   **Adjustment Trigger:** Moves **up** if cost crises force explicit rationing debates involving potential enhancements (e.g., gene therapy for intelligence inequality). Moves **down** if distributive decisions become purely cost/benefit driven, eliminating "worse off/no fault" as a meaningful distinct criterion.

  **Idle Controversies Exposed by Separating Jobs:**
  *   Endless debates over *the* precise boundary between therapy and enhancement become idle. The key insight is that **a single bright line cannot serve all three jobs well simultaneously.** The framework shows *why* arguments seem interminable – proponents are often defending a line optimized for one function against critiques based on its failure in another. Separating the jobs allows for context-specific lines (e.g., a Gatekeeping line for regulators might differ from a Distributive line for insurers, which might differ from an Expressive line for sporting bodies).

  **Stress-Testing the Priority:**

  1.  **Cheap, Safe, Universal Enhancement (e.g., cognitive boost far above norm):**
      *   **Distributive:** Collapses. No scarcity, no obligation to provide (beyond ensuring access equity). "Worse off" doesn't apply if everyone *can* easily have it.
      *   **Gatekeeping:** Collapses. Clearly not restoring function relative to *any* plausible reference class. Falls outside "medical need," likely triggering a different (e.g., consumer safety) regulatory regime.
      *   **Expressive:** **Becomes paramount.** How does society *label* and *value* this? Is it admirable self-improvement, crass commodification, or unfair advantage? This is where institutions (schools, employers, ministries setting social policy) would focus their ethical/policy energy.
      *   **Impact on Ranking:** Reinforces Priority #2. If such an enhancement emerged, the *Expressive* function and its interaction with other values (fairness? authenticity?) would become the dominant institutional concern overnight. Research on Priority #2 becomes urgently applicable.

  2.  **Identical Intervention/Dose/Effect: One Diagnosed, One Not (e.g., Adderall for ADHD vs. for exam cramming):**
      *   **Distributive:** **Fails.** The "worse off/no fault" criterion hinges entirely on the diagnosis. The non-diagnosed individual cannot claim disadvantage *requiring* societal resource allocation. An insurer would cover the first, deny the second.
      *   **Gatekeeping:** **Fails.** The diagnosis *is* the key Gatekeeping criterion defining medical need for regulators and prescribers, triggering specific evidence/risk standards for safety and efficacy *in that population*. The non-diagnosed use falls outside this gate.
      *   **Expressive:** **Potentially Active (but contested).** Society might still express disapproval of the non-diagnosed use (e.g., as "cheating," "drug abuse," or undermining authenticity), even if Distributive and Gatekeeping lines clearly distinguish them. Conversely, it might express that both are legitimate choices.
      *   **Impact on Ranking:** Reinforces Priority #1. This case **exposes the utter dependence of Distributive and Gatekeeping functions on the prior definition of the relevant reference class/population (here, defined by diagnosis).** Without a stable and justified way to define the "worse off" or "diseased" group (Priority #1), these distinctions become arbitrary. The case highlights why Gatekeeping's reference class question is foundational and upstream.

  **Migration Phenomenon & Functional Stability:**
  The migrating baseline demonstrates that **no line can reliably perform the *Gatekeeping* and *Distributive* jobs *based solely on a static concept of "normal function" or "disease"* over the long term.** Social acceptance, technological normalization, and evidence of benefit reshape what counts as remedying a misfortune vs. pursuing an advantage. However:
  *   **Gatekeeping:** Can achieve *procedural* stability by clarifying the *criteria and process* for defining/updating the reference class and evidence standards (Priority #1 research tackles this).
  *   **Distributive:** Can achieve *principled* stability by anchoring "worse off/no fault" in a theory of disadvantage that adapts or transcends shifting baselines (Priority #3 research tackles this, though it's harder).
  *   **Expressive:** This function is *inherently dynamic* and drives migration. A stable line for expressive purposes is unlikely; the focus should be on understanding how expressive meanings evolve and how institutions should *respond* to that evolution (Priority #2 research tackles this).

  **Conclusion:**
  This agenda prioritizes **Gatekeeping Stability** (via reference class analysis) first, as it's the most direct, tractable, and upstream lever for changing institutional decision-making (regulators, insurers, sporting bodies). **Expressive-Distributive/Gatekeeping Trade-offs** come second, as resolving this conflict is crucial for legitimate and coherent institutional policies but requires navigating complex value clashes. **Distributive Foundations in an Enhancement Context** comes third, as it's vital but deeply entangled with shifting social norms and economic pressures, making stable answers harder to define and implement.

  The stress tests confirm the framework's power: they show precisely *which* functions collapse in specific scenarios, highlighting the non-universality of the distinction and reinforcing the need for context-specific lines defined by their primary institutional job. The migrating baseline underscores that functional separation is not just analytical but essential for designing *resilient* institutional approaches. This program offers the best chance to move beyond circular debates and provide tools that actually change how institutions grapple with the therapy/enhancement landscape.
