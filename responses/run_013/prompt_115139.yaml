prompt: |-
  For several years now I have been trying to find out whether a particular structure has a name, and I have not managed to settle the question for myself. What I want is the carving rather than the label, so let me set out the structure, give the cases that puzzle me, and say what I have already looked at and found wanting.

  The structure is this. Something I want is offered to me on condition that I genuinely intend to do something unpleasant later on. The offer is honoured the moment the intention exists, before the unpleasant thing has been done. The offer was my whole reason for being willing to do the unpleasant thing, so once I have it the reason for the act has evaporated, while the intention, if it was genuine, is supposed to carry me into the act all the same. In the standard version the offeror is a perfect judge of intentions; in some variants he is not, and must take my word or wait for my conduct.

  Four cases:

  1. A stranger offers me a large sum, payable at once, if I can sincerely form the intention of spending the coming year nursing a relative abroad. I want the money very much. If I can get myself to intend the year, the money is mine; and then the year looks pointless, unless the mere fact of having intended it is itself a reason to go.

  2. The same offer, except that the money is to be paid to my sister rather than to me. The year abroad is still mine to spend and still wretched. Does the structure survive when the benefit lands on someone else, or is the whole interest of the case that the agent is buying his own advantage?

  3. The benefit is not money but information. A specialist will tell me whether I am genuinely committed to a punishing course of treatment, but will do so only if I first form the intention of completing it. What I want is the verdict; the treatment is the price. Is that the same structure, or a different one wearing its clothes?

  4. I discover that I can produce the required intention indirectly: by hypnosis, by a drug that makes me unusually suggestible, by a vow taken while drunk. Does that dissolve the difficulty, and if so, does it show that what was interesting all along was not the economics of the case but the fact that intentions cannot be adopted at will?

  The reply I am given whenever I raise this is that if I abandon the plan once the money is banked, the intention cannot have been genuine, so nothing follows about what I now have reason to do. That seems to me to turn the case into a question about my sincerity at an earlier moment, and I do not see how a verdict on my past sincerity can supply a reason now.

  Three things I have found that are close but, I think, not the thing itself. The first is the familiar business of binding oneself in advance, as the sailor has himself bound to the mast so that he cannot act on the longing the singing will produce: there the agent has a reason to act later and arranges to be unable to act on it, whereas in my cases the agent's later trouble is that he has no reason left at all. The second is promising: if I have promised my sister to go, then the promise is a reason to go after the money has been paid. But in my cases nobody has promised anything and there is nobody to be answerable to; everything hangs on what an intention can do by itself. The third is the suggestion that one might believe a proposition because it would be agreeable to believe it, which strikes me as the same difficulty displaced from action to belief.

  I should add some further cases that I cannot classify at all and would like placed: where the thing to be intended is something I would have wanted to do even without the reward; where the offer is made repeatedly, so that a reputation for carrying through becomes valuable in itself; where the condition is on my believing that I shall act rather than on my intending to; where what I must intend is to refrain from something rather than to do it; and where the benefit was paid some time ago, in reliance on a prediction that I would form the intention, so that it is already spent.

  What I want from you is therefore not a name to file all this under. I want to know whether there is an established name, and if there is, precisely what it covers; if the established name covers only the first sort of case, what the wider family should be called and how you would define it; which feature is doing the real work, whether the unobservability of the intention, the way the benefit destroys the reason for the act, or the impossibility of intending on demand; and which of the cases above belong to the structure and which merely resemble it. Where a case falls outside, I want to know what disqualifies it.
reasoning: |-
  Okay, the user has presented a fascinating philosophical puzzle about intention and conditional rewards. They've clearly spent years wrestling with this structure where a benefit is given based on forming a genuine intention to perform an unpleasant future act, but receiving the benefit eliminates the reason for performing that act. 

  The user seems deeply familiar with philosophical concepts but frustrated by the lack of a clear framework. Their four cases show impressive nuance: exploring variants where benefits go to others (Case 2), where the "benefit" is information (Case 3), and where intention is formed indirectly (Case 4). They've already ruled out similar concepts like Ulysses contracts and promises, which shows sophisticated prior analysis.

  What stands out is their rejection of the common "it wasn't genuine intention" rebuttal. They're pushing beyond surface-level solutions to examine how intentions function when their instrumental value disappears. The additional unclassified cases suggest they're hunting for boundary conditions of this paradox.

  The core tension appears to be between:
  - The psychological reality of intention formation (can it survive its own justification?)
  - The structure of instrumental reasoning (when means become detached from ends)
  - Moral psychology (can intentions carry normative weight independently?)

  For Case 1, the classic version, I consider Bratman's planning theory of intention - intentions are supposed to persist beyond reason-changes, but here the reason vanishes completely. Case 2 introduces interesting questions about altruism versus self-interest in intention-formation. Case 3 cleverly shifts to epistemic desire, testing if the structure holds when the "benefit" is knowledge itself. Case 4 probes whether bypassing will dissolves the paradox, suggesting the user suspects volitional constraints are central.

  The unclassified cases are particularly tantalizing. The "already paid benefit" scenario resembles promissory estoppel in contract law, while the "repeated offers" case touches on reputation economics. These might belong to adjacent phenomena rather than the core paradox.

  The user's meta-request is precise: not just labeling but taxonomy building. They want to know which features are necessary/sufficient, where boundaries lie, and why certain cases don't qualify. This requires separating:
  - Core paradox (vanishing reason + intention persistence)
  - Mechanism variants (direct/indirect intention formation)
  - Object variants (money/information benefits)
  - Relationship variants (self/other beneficiaries)

  Their underlying aim seems to be mapping the conditions under which intentions become uncoupled from their original justifications while retaining normative force - a fundamental question in action theory. The frustration with "insincere intention" responses suggests they're seeking a framework that takes intention's inertia seriously rather than dismissing cases as failed intention-formation.
answer: |-
  This structure is a profound and under-discussed paradox at the intersection of philosophy of action, practical reasoning, and moral psychology. It doesn't have a single, universally agreed-upon name, but it's closely related to established concepts and debates. Here's a breakdown addressing your core questions:

  1.  **The Core Structure & Its Established Context:**
      *   **The Problem:** This is fundamentally a paradox of **instrumental intention formation under conditional reward**. The core tension arises because:
          *   The *sole reason* for forming the intention (and thus triggering the reward) is the reward itself.
          *   Once the reward is secured *based on the existence of the intention*, the intention loses its instrumental justification for being maintained or acted upon.
          *   Yet, the offer requires a *genuine* intention, which implies a commitment to act absent external coercion or new overriding reasons.
          *   The paradox highlights the potential instability or even incoherence of forming an intention *purely* as an instrumental means to obtain a reward that *removes* the reason for having *that very intention*.
      *   **Established Names & Concepts:**
          *   **Self-Defeating/Undermining Intentions:** This captures the core dynamic where the successful formation and triggering of the intention destroys its own raison d'être. It's descriptive but not a formal "name" for the scenario.
          *   **The Toxin Puzzle (Gregory Kavka, 1983):** This is the *closest* named philosophical puzzle. Kavka proposed: A billionaire offers you $1 million if, at midnight tonight, you form the *sincere intention* to drink a mildly toxic but non-lethal, non-permanently harmful potion tomorrow at noon. The catch: You don't have to *drink* it, only *intend* to drink it at midnight. If you form the intention, the money is deposited immediately. The paradox is identical to your Case 1. **Therefore, your core structure is essentially the Toxin Puzzle.**
          *   **Bootstrapping Objections (Bratman, Broome):** This broader debate concerns whether intentions or decisions can *create* new reasons for action out of nothing. Your cases present a stark version: Can the act of forming the intention (triggering the reward) create a reason (e.g., fidelity to the intention) strong enough to overcome the disappearance of the *original* reason (the reward)? Critics argue this is illegitimate "bootstrapping."
          *   **Planning Theory of Intention (Bratman):** This theory emphasizes intentions as elements of plans that resist reconsideration and coordinate action over time. Your paradox directly challenges the stability of such plans when their initial instrumental justification vanishes completely *after* formation but *before* execution. It questions the "inertial" force of intentions.

  2.  **Precisely What "The Toxin Puzzle" Covers:**
      Kavka's original puzzle specifically covers:
      *   A conditional offer (reward) made *to the agent*.
      *   The condition is forming a *sincere intention* to perform a *future action*.
      *   The reward is transferred *immediately* upon forming the intention.
      *   The future action is *unpleasant/unwanted* *for its own sake* (like drinking toxin).
      *   The sole reason for forming the intention is to get the reward.
      *   The puzzle hinges on the *logical possibility* and *psychological possibility* of forming such an intention sincerely, given that the reward removes the reason to act.

  3.  **The Wider Family & Definition:**
      *   **Name:** **Conditional Intention-Reward Paradoxes** (or **Self-Undermining Instrumental Intention Scenarios**).
      *   **Definition:** A scenario where an agent is offered a benefit conditional upon forming a sincere intention to perform a future act (or refrain from one), where:
          1.  The primary (or sole) reason for forming the intention is to obtain the benefit.
          2.  The benefit is transferred or realized upon verification (or presumed existence) of the sincere intention, *prior* to the performance of the future act.
          3.  Obtaining the benefit eliminates the primary (or sole) reason for forming and maintaining the intention to perform the future act.
          4.  This creates a tension between the requirement for a *sincere* intention (implying commitment) and the lack of a *remaining reason* to perform the act once the benefit is secured.

  4.  **Which Feature is Doing the Real Work?**
      *   **The Interplay is Crucial:** All features are necessary, but their interaction creates the paradox.
      *   **Primary Driver:** **The way the benefit destroys the reason for the act.** This is the core destabilizing element. Without this, there's no paradox (e.g., if the act remained desirable or the reward was paid *after* the act).
      *   **Essential Enabler:** **The impossibility (or extreme difficulty) of directly intending on demand for purely instrumental reasons.** If one could easily form a "hollow" intention knowing it wouldn't be acted upon, the paradox dissolves (though the offeror might be defrauded). The requirement for *sincerity* leverages this difficulty. The unobservability of intention often necessitates reliance on sincerity (words, indirect evidence) in practice.
      *   **Role of Unobservability:** While unobservability makes practical verification messy (leading to variants with promises, reputations, etc.), the *logical* paradox exists even with a perfect judge (Kavka's original). It highlights the challenge of verifying an internal state that, by its nature, is future-directed and involves commitment.

  5.  **Classification of Your Cases:**

      | **Case** | **Belongs to Core Structure?** | **Reason** | **Notes** |
      |---|---|---|---|
      | **1. Money to Self** | **Yes** | Pure Toxin Puzzle prototype. Benefit destroys reason for the act. | Core case. |
      | **2. Money to Sister** | **Yes (Modified)** | Core structure intact. *Your* reason for forming the intention (to help sister) remains *after* the money is paid. The *act* is still unpleasant, so the paradox arises: Why endure it *now*? The benefit hasn't destroyed *your* reason to intend/act (altruism), but the *burden* remains unrewarded for *you*. | Highlights that the "reason destroyed" needs to be the *agent's primary motivating reason*. Here, altruism persists. |
      | **3. Information Benefit** | **Yes (Modified)** | Core structure applies. You want info *now*. Forming the intention gets it. The unpleasant treatment remains, and your reason for *doing* it (beyond the now-secured diagnosis) is gone. "Do I *need* to endure this since I already know?" | Benefit (info) destroys the instrumental reason for the *act* (to get info). The intention's sincerity is still key. |
      | **4. Indirect Intention Formation** | **Partial / Dissolves Core Paradox?** | *Possibly* dissolves the *sincere intention* requirement. If hypnosis creates a *real* commitment (like Ulysses), the paradox might resurface later. If it creates a hollow simulacrum, the agent gets the reward fraudulently. | Challenges the "impossibility of intending on demand" feature. Shows the paradox depends on the *nature* of the intention formed. |
      | **Act Intrinsically Wanted** | **No** | The benefit isn't the *sole* reason. You have an independent reason to act. The paradox weakens or disappears because the intention has a stable foundation beyond the reward. | Disqualified: Core feature #1 (sole reason is benefit) not met. |
      | **Repeated Offers / Reputation** | **No** | The creation of a *new reason* (reputation) changes the structure. Failing to act now has a *new cost* (lost future rewards). The benefit doesn't destroy *all* reasons; it creates a *different*, ongoing reason system. | Disqualified: Core feature #3 (benefit destroys the reason) not met; new reasons emerge. |
      | **Condition: Belief I Shall Act** | **Borderline / Complex** | Shifts focus from *commitment* (intention) to *prediction*. Can one *believe* one will act while knowing the reason disappears? This resembles Moore's Paradox ("I will act but I have no reason to"). It's adjacent but distinct. | Not core. Focuses on belief/prediction rather than commitment/planning. |
      | **Intend to Refrain** | **Yes** | Structure is identical. Benefit for intending *not* to do X. Getting benefit removes reason *not* to do X (if the reason was *only* to get the benefit). Temptation to do X remains. | Core structure, inverted. |
      | **Benefit Paid Earlier (Reliance)** | **No** | Changes the temporal/causal structure. The benefit wasn't conditional on the *current* intention; it was paid based on a *prediction* of future intention. This resembles **promissory estoppel** or creating an *obligation* due to reliance, not a paradox about intention formation itself. | Disqualified: Core features #1 (intention as means to benefit) and #2 (benefit paid *for* intention) not met. Focus shifts to obligations from past reliance. |

  6.  **Addressing the Common Reply & Your Concern:**
      The reply ("it wasn't genuine") **begs the question**. It assumes genuine intentions are always stable, ignoring the paradox that *forming* it sincerely in this context might be conceptually or psychologically impossible *precisely because* the agent foresees the reason vanishing. It doesn't address how a *past* sincere intention (if it *could* exist) generates a *present* reason to act when the *only* justification for that intention is gone. Your intuition is correct: the puzzle exposes a potential gap between the *formation* conditions of an intention and its normative *persistence* force when its original justification evaporates.

  **Conclusion:**

  Your core structure is **The Toxin Puzzle** (Kavka). Its essence is the **self-undermining nature of forming a sincere instrumental intention** when the reward for forming it *immediately* removes the reason for maintaining or acting on that intention. The feature doing the heaviest lifting is **the benefit destroying the reason for the act**, interacting critically with the **difficulty of forming sincere intentions purely instrumentally on demand**.

  Cases 1, 2 (modified), 3 (modified), and "Intend to Refrain" belong to this core family. Case 4 probes its boundaries regarding intention formation. Cases like "Act Intrinsically Wanted," "Repeated Offers," "Belief I Shall Act," and "Benefit Paid Earlier" involve related elements (intentions, rewards, future acts) but lack the specific self-undermining structure that defines the Toxin Puzzle and generates its distinctive paradox. They are disqualified because they fail one or more of the core definitional features, most often because the benefit doesn't destroy the *only* reason for the intention/act, or because the benefit isn't exchanged *for* the intention itself in the required temporal sequence.
