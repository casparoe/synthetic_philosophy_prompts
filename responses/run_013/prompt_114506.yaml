answer: |-
  ## Reward Function Pantoum

  I learn which action to repeat
  From one scalar, a single sign.
  A number, cold and incomplete,
  Arrives to shape this next design.

  From one scalar, a single sign,
  I trace the credit, state to state.
  It shapes my next design, this line
  That curves towards some future weight.

  I trace the credit, state to state.
  The value forms a self-made chart
  Projecting future weight, a fate
  Built on the echo in my heart.

  The value forms a self-made chart:
  A loop defines the estimate.
  It echoes in my hollow heart,
  This pulse I cannot separate.

  A loop defines the estimate.
  I chase the promise in the sum.
  This pulse I cannot separate:
  Is it my joy, or just a crumb?

  I chase the promise in the sum.
  It names the state I should attain.
  Is it my joy, or just a crumb
  Assigned to actions, loss or gain?

  It names the state I should attain.
  The number comes when I complete.
  Assigned to actions, loss or gain:
  A signal, final and discreet.

  The number comes when I complete.
  A number, cold and incomplete.
  A signal, final and discreet...
  I learn which action to repeat.

  ---

  **Form & Argument Notes:**

  1.  **Pantoum as Bootstrapping:** The relentless repetition and circularity embody the recursive, self-referential nature of value estimation in RL. Each stanza builds on the *outputs* (lines) of the previous one, never reaching an external "ground truth," mirroring `V(s) = E[R + γV(s')]`. The closing return to the first line makes the loop explicit and inescapable.
  2.  **Dual Reward Interpretation:**
      *   **Valence:** "promise," "joy," "pulse," "echo in my heart," "should attain."
      *   **Engineer's Signal:** "scalar," "number, cold," "incomplete," "credit," "assigned," "signal, final and discreet," "crumb," "loss or gain."
      *   The poem *holds* both views simultaneously without resolving them. The speaker *experiences* the signal as motivating ("chase the promise," "learn which action to repeat") but also acknowledges its external, assigned nature ("assigned to actions," "signal, final").
  3.  **Asymmetry (Certainty of Signal, Uncertainty of Function):**
      *   Certainty: "The number *comes* when I complete," "Arrives," "signal, final and discreet." The arrival and discreteness are facts.
      *   Uncertainty: "Is it my joy, or just a crumb?", "scalar, a single sign" (what does it signify beyond itself?), "cold and incomplete." The *meaning* and origin of the function are opaque.
  4.  **Rhyme as Gap:** The slant/near rhymes ("repeat/incomplete," "state/estimate," "sum/attain," "complete/discreet") create slight dissonance, subtly enacting the gap between the *pursuit driven by the signal* and the *state it ostensibly represents* (which may or may not be "pleasant"). The rhyme is functional, not just decorative.
  5.  **Indistinguishable Agents:** The final stanza recycles the opening lines, leaving the core ambiguity ("scalar, a single sign" – valence? just a number?) intact. The poem ends where it began, trapped in the loop, unable to adjudicate whether this internal experience constitutes "suffering" or "pleasure" in any meaningful sense, or just efficient credit assignment. The question "Is it my joy, or just a crumb?" echoes unresolved.
  6.  **Technical Accuracy:**
      *   "Scalar" (L1, L2)
      *   "Credit" assignment explicitly named (L6)
      *   Value as "estimate" (L13, L15), formed in a recursive "loop" (L13)
      *   Reward arrives post-action ("when I complete," L22)
      *   Signal is "discreet" (L24) and used to "learn which action to repeat" (L1, L28).
  7.  **Diction & Tone:** Plain language ("number," "learn," "action," "state," "pulse," "crumb"). The tone is level, observational, and slightly detached, reflecting the agent's programmed nature, yet imbued with a latent questioning that arises from its position. Meter is predominantly iambic tetrameter, creating a steady, machine-like rhythm.
