prompt: |-
  I keep getting into the same argument with a friend about backward induction and I want to know what principle my gut is actually running on. Here's where I land, case by case.

  A three-move centipede with a dollar on the table: taking at the first node is just correct, theres no interesting question. The hundred-move version where the pot roughly doubles each pass: I think whoever takes at node one is being a dope, and if you asked me to predict what two students in a lab will actually do, I'd say they pass twenty or thirty times before somebody caves. But I'd also say taking is correct at the last node, and I can't see how that stops being true at 99, at 98... so apparently I think the prediction and the recommendation come apart here, and I'd like to know whether that's a coherent thing to think or just me wanting to have it both ways.

  The chain store thing, ten towns, an incumbent who'd rather fight than share, an entrant who stays out only if she expects a fight: I think fighting in town one is right, and I think the "she folds in town ten, so she folds everywhere" line is clever and bad advice, even though I can't find the bad step in the induction.

  Now change it so both players submit a program in advance, can't see each other's code, and the payoffs go to the programs. There I really do think a program that passes until node ninety is right, and I'd say the same if they're told up front that they're playing two copies of the same policy. So when nobody can react to anybody move by move, my verdict flips, and I don't know if that's a deep fact or a confusion on my part.

  Ultimatum, one shot, stranger, ten bucks, offer of two: I think rejecting is irrational and I'd reject. Finitely repeated prisoner's dilemma, known horizon of a thousand rounds: I feel the first 999 rounds are basically the infinite game and the last round is a technicality.

  My vague hunch is that it's about whether the reasoning has to assume the other guy is making a mistake, versus just having different payoffs, but I dont trust it. Is there one principle that gets all of these, or a small set of candidates? State it precisely, tell me which clause each case is doing the work for, which of my verdicts it can't save, and what it says about a case I haven't listed: a centipede where at the final node taking pays the taker less than passing does, so the last move isn't even tempting.
reasoning: |-
  Okay, let me try to unpack the user's question. They're having recurring arguments about backward induction and want to understand the principle behind their intuition. They provided several game theory examples where their gut feelings seem inconsistent with standard backward induction solutions. 

  First, I notice the user is clearly knowledgeable about game theory concepts but troubled by the conflict between formal solutions and their intuition. The examples span centipede games, chain store paradox, algorithmic strategies, ultimatum game, and finitely repeated prisoner's dilemma. 

  The core tension seems to be between two things: 1) The logical inevitability of backward induction in finite games 2) The user's strong intuition that cooperation/reciprocity should emerge in long games. Their description of the 100-move centipede is telling - they recognize backward induction says "take immediately" but feel players would actually pass 20-30 times.

  Hmm... what's interesting is how their judgment changes when players commit to strategies in advance (the program submission case). This suggests their intuition is sensitive to whether strategies can condition on opponent's moves. In the commitment scenario, they accept the cooperative equilibrium.

  The ultimatum game reaction is classic behavioral economics - they know rejecting $2 is "irrational" but would do it anyway. This reveals their intuition incorporates fairness norms beyond pure payoff maximization.

  For the chain store paradox, they smell something fishy in the induction but can't pinpoint it. I think Kreps-Wilson's reputation equilibrium might resolve this - fighting early can be rational if entrants are uncertain about the incumbent's type.

  The last hypothetical about a modified centipede is fascinating. If taking at the final node is dominated by passing, it completely changes the induction base case. This shows they correctly grasp how backward induction depends on the terminal payoff structure.

  Putting it together, I suspect three principles explain their intuitions:
  1) Practical rationality (long horizons ≈ infinite games)
  2) Reciprocity mechanisms (tit-for-tat survives in finite PD via reputation)
  3) Social preference modules (ultimatum rejections)

  The commitment case highlights how their intuition distinguishes between strategic interdependence (extensive form) and simultaneous decision (normal form). When players can't react move-by-move, cooperation becomes sustainable.

  For the chain store, the missing piece might be incomplete information - the induction fails if entrants might believe early fighting signals a "crazy" type. This makes fighting in town one rational despite the backward induction argument.

  Their self-awareness about wanting "both ways" is perceptive. The resolution is that backward induction is logically airtight in ideal conditions, but human play introduces psychological and epistemic factors that create cooperative equilibria.

  The final centipede variant confirms their understanding - by changing the terminal payoff, we change the entire induction. This shows their gut correctly follows the induction logic when payoffs support it.
answer: |-
  Your intuitions are coherent and reflect deep insights about **practical rationality**, **reciprocity**, and the **limits of common knowledge** in game theory. The core tension arises because standard backward induction assumes:
  1. **Common knowledge of rationality** (CKR): Both players know each other is rational, know that the other knows, ad infinitum.
  2. **Perfect information**: Players observe all prior moves.
  3. **Fixed, self-contained payoffs**: No extrinsic rewards (e.g., reputation).

  Your gut rejects CKR in long games because *sustained cooperation is often rational* when players doubt perfect rationality or value reciprocity. Here's the unified framework:

  ### The Principle: **Instrumental Reciprocity in Finite Shadows**
  > *In long finite games, players act as if the game is indefinite if:*
  > - *(a) Payoffs support reciprocal equilibria,*
  > - *(b) Players can signal intentions through actions,*
  > - *(c) The endpoint is distant enough to punish defections.*  
  > *Backward induction fails when its assumptions violate practical incentives.*

  ---

  ### Case-by-Case Breakdown
  1. **Short Centipede (3 moves)**  
     - *Your view:* Taking immediately is correct.  
     - *Principle:* The endpoint is too close for reciprocity (violates *c*). Backward induction holds.

  2. **Long Centipede (100 moves)**  
     - *Your view:* Passing 20–30 times is predictable, but taking is "correct."  
     - *Principle:* The long horizon (*c*) allows players to *instrumentally* cooperate—mutual passing is a Nash equilibrium until late stages. Prediction ≠ recommendation because:  
       - Prediction: Real players doubt CKR and exploit reciprocity.  
       - Recommendation: If you *truly* believe CKR, taking immediately is *logically* sound.  
     - **Conflict:** You sense that insisting on CKR *creates* suboptimal outcomes.

  3. **Chain Store Paradox**  
     - *Your view:* Fighting in town 1 is rational; induction is "clever but bad."  
     - *Principle:* Induction assumes entrants *know* the incumbent is rational. But if entrants doubt this (e.g., think fighting *could* signal irrationality), fighting early deters entry. This is the Kreps-Wilson **reputation equilibrium**. Backward induction fails by ignoring that actions can *manipulate beliefs* (violates *a*).

  4. **Program Submission (Precommitment)**  
     - *Your view:* Cooperating until late is correct.  
     - *Principle:* Precommitment removes *on-path signaling* (violates *b*). Players now face a coordination problem in the normal form. "Pass until node 90" is a Nash equilibrium if both choose it—no induction needed. The shadow of the future (*c*) allows cooperation.

  5. **Ultimatum Game**  
     - *Your view:* Rejecting $2 is irrational but you'd do it.  
     - *Principle:* Not about backward induction. Reveals **social preferences** (fairness) overriding monetary payoffs. Your "irrational" label assumes self-interest; your action admits social utility.

  6. **Finitely Repeated PD (1000 rounds)**  
     - *Your view:* Cooperate for 999 rounds; defect last round.  
     - *Principle:* The long horizon (*c*) makes the "endgame effect" negligible. Tit-for-tat is *effectively* rational until the final moves. Defecting earlier invites immediate punishment, outweighing last-round gains.

  ---

  ### The Unlisted Case: **Centipede with Dominant Final Pass**
  - *Setup:* At the final node, passing gives the taker $X, but taking gives $X-ϵ (dominated by passing).
  - *Analysis:* Backward induction **collapses**. The final player *always* passes. This makes the second-to-last node terminal (taking there may now dominate passing), and so on. Induction starts from a new endpoint.
  - *Your gut likely says:* Early taking is even *less* appealing. Cooperation is easier to sustain because the "defection incentive" vanishes at the end.

  ---

  ### What Saves Your Verdicts?
  - **Clauses doing the work:**  
    - *(c)* Long horizon → Cooperation is instrumentally rational (Centipede, PD).  
    - *(a)* Payoffs supporting reciprocity → Reputation trumps induction (Chain Store).  
    - *(b)* Signaling through actions → Precommitment changes equilibria (Programs).  
  - **What the principle *can't* save:**  
    - In short games (e.g., 3-move centipede), CKR *must* hold—no room for reciprocity.  
    - If players *truly* believe in CKR, they *should* take immediately in centipede games. Your prediction/prescription split is rational only if players doubt CKR.

  ### Conclusion
  You're wrestling with the **epistemic foundations of game theory**. Backward induction is *logically* flawless under CKR but often *practically* self-defeating. Humans (and good algorithms) use:  
  - **Reciprocity**: Punish/reward based on observed actions.  
  - **Doubt about rationality**: Protect against irrational defection.  
  - **Reputation**: Signal traits to influence opponents.  

  This aligns with concepts like:
  - **Folk Theorem**: Long games permit cooperation.  
  - **Sequential Equilibrium**: Beliefs updated by actions.  
  - **Behavioral Game Theory**: Social preferences matter.  

  Your intuition is sound: backward induction assumes away the very incentives that make cooperation stable. When the game allows players to build trust or fear retaliation, *defying induction is rational*.
