prompt: |-
  Im doing a module on Indian philosophy this term and the lectures move a bit to fast for me, so I've been leaning on the one-page summary my professor handed out for the Jainism week. Before I build an essay on top of it I'd like to know how much of it I should actually trust, because I have a feeling some of it is the kind of thing that sounds fine in a lecture and then falls apart under pressure. Here's the gist of what she wrote:

  Anekāntavāda is the Jain doctrine that reality has many sides, so no statement about it is ever more than partially true. The Jains spelled this out in syādvāda, which is also called nayavāda, the doctrine of standpoints, and which runs as a sevenfold scheme (the saptabhaṅgī): for any object and any predicate there are seven possibilities -- it is, it is not, it both is and is not, it neither is nor is not, and combinations of those -- each prefixed with syād, which means maybe or perhaps. So every philosophical position, Jainism included, is at best probably true; and this is why the Jains are the classic defenders of tolerance and non-violence, since if nobody has the whole truth you can never justify harming someone who disagrees with you. The usual objection is that the doctrine refutes itself: if every claim is only partly true then so is the claim that every claim is only partly true, and if everything is true from some angle then even the opposite of Jainism is true, which is absurd.

  I can tell that some of this is fine and some of it is a popular gloss, but I honestly can't tell which is which -- I'd have guessed the self-refutation point was a real problem for them, and I like the bit about tolerance, but I don't know if that's actually part of the doctrine or something modern people have read into it. Could you go through it more or less claim by claim and tell me what's accurate, what's a simplification, and what's actually wrong -- and then say whether the conclusions she draws (that the doctrine undercuts itself, and that it commits them to non-violence) really do follow from the parts that survive? No citations needed, I just want to stop getting that look in seminars.
