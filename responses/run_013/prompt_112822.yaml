answer: |-
  Below are twelve interview questions drafted for a rigorous, cumulative exchange with a defender of the selected-effects (SE) account of biological function. The sequence moves from objections with plausible SE replies towards those requiring substantive theoretical costs. Follow-ups anticipate likely defences to press vulnerabilities. Concrete cases are invented where stock examples are stale. British English is used throughout.

  ---

  **1. Initial Objection: Traits Without Lineage Histories**  
  Consider a *de novo* gene arising from random mutation in a single sterile organism (e.g., a mutant lung in a sterile axolotl). It produces an enzyme that fortifies bone density, but the organism never reproduces. The SE account seemingly cannot ascribe a "function" here, as there is no selection history. Does this not force a retreat to trait *types*? If so, doesn’t this open the door to causal-role accounts, which also operate at the type level?  

  *Follow-up:* If you invoke trait types (e.g., "lungs like this"), what prevents the SE account from collapsing into a historical variant of the causal-role account? Both would then ascribe functions based on typical causal contributions—yours merely adding "and this causal role was selected". But doesn’t the SE account’s *explanatory distinctiveness* rely on token lineages?  

  **2. Drift and Non-Selected Traits**  
  Take a trait fixed purely by drift in a lineage (e.g., a neural quirk in an isolated beetle population). It happens to aid camouflage now, but played no role in its own fixation. The SE account denies it has a function. Yet biologists routinely cite such traits as "functional" when explaining current fitness. Isn’t the SE account forced to dismiss these as merely *beneficial*, sacrificing explanatory utility?  

  *Follow-up:* If you concede biologists are misusing "function" here, how does your account explain why drift-maintained traits *cannot* malfunction? A drifted trait could degrade (e.g., the neural quirk misfiring), harming fitness. Calling this "malfunction" seems intuitive, but your account forbids it.  

  **3. Artefacts and Design Without Selection**  
  Synthetic biologists create a novel enzyme in vitro to degrade plastic. It has no selection history. Engineers call its plastic-degradation its "function". The SE account must either deny this or analogise design to selection. If you opt for analogy, doesn’t this reduce the SE account to intentionalism (functions as *intended effects*), given designers lack the blind variation of natural selection?  

  *Follow-up:* Suppose you resist intentionalism by arguing designers mimic selection via iterative prototyping. But if a prototype works immediately (no iteration), does it have no function? And if iteration *is* required, doesn’t this make the SE account inapplicable to one-off engineered systems?  

  **4. Genomic Function Debates**  
  Much debate exists over "junk DNA". Proponents of selected effects (SE) demand evidence of selection for function, while others equate function with reproducible biochemical activity (e.g., transcription). When reproducible activity (e.g., non-coding RNA transcription) shows no fitness impact, why should we prefer the SE view? Doesn’t this render vast genomic regions "functional" only derivatively?  

  *Follow-up:* If reproducible activity *without* selection is merely "causal role" not "proper function", how does the SE account explain biologists’ functional explanations of *non-conserved* molecular processes (e.g., species-specific regulatory loops)?  

  **5. Exaptation and Function Plurality**  
  Bird feathers are exapted for flight but retain insulation effects. Selection now maintains both. Does the SE account assign *two* functions? If so, how do we explain malfunction? If a feather insulates well but is aerodynamically poor, is it malfunctioning for flight but functioning for insulation? This complicates unitary explanations.  

  *Follow-up:* If you argue only the *new* effect (flight) is now the "function" (as per current maintenance), what happens to the original function? If insulation remains selectively relevant, how can it cease being a function?  

  **6. Indeterminacy: Selecting Phenotypes, Not Traits**  
  Selection acts on whole phenotypes. Consider a moth wing pattern selected for camouflage via *both* colour matching and disruptive contours. Is its function "crypsis" (coarse-grained) or "colour matching *and* disruption" (fine-grained)? The SE account lacks resources to fix one description, risking functional inflation or under-specification.  

  *Follow-up:* If you argue the function is the *minimal* explanation of selection, how do we determine minimality? If colour matching alone sufficed for selection in some ancestors, but disruption was pivotal in others, which description wins?  

  **7. Normativity and Impossible Functions**  
  A bacterium evolved to metabolise sulphur in deep-sea vents. On a sulphur-free space station, it "fails" to metabolise sulphur. The SE account calls this malfunction: it *should* metabolise sulphur. But given sulphur’s absence, this effect is *impossible*. How can past selection ground a *current* normative "should" for an effect that cannot occur?  

  *Follow-up:* If you argue the trait is "malfunctioning" because it would perform X *in the ancestral environment*, doesn’t this imply functions are environment-relative? But we routinely ascribe functions independent of environment (e.g., "hearts should pump blood" even in vacuum).  

  **8. Non-Lineage Entities: Ecosystems and Keystone Species**  
  Ecologists describe keystone species as having ecosystem-stabilising "functions". No selection history binds the ecosystem. If the SE account denies this, must it dismiss ecosystem function talk as metaphorical? If it accommodates it (e.g., via group selection), doesn’t this stretch "lineage" beyond recognition?  

  *Follow-up:* Can the SE account coherently ascribe functions to *novel* ecosystems (e.g., urban microbiomes) where no historical selection has occurred?  

  **9. Explanatory Payoff Against Causal-Role Accounts**  
  The causal-role (CR) account identifies functions with current causal contributions to a system’s goals (e.g., survival). When a trait’s current contribution matches its selective history (e.g., hearts pumping blood), SE and CR converge. When they diverge (e.g., drift-maintained traits), SE denies function where CR may affirm it. What *explanatory advantage* does SE offer over CR in cases of convergence, given it adds historical baggage?  

  *Follow-up:* If you argue SE explains *why* the trait exists, while CR only describes *what* it does, isn’t this conflating function with aetiology? Biologists often distinguish "what is its function?" from "how did it evolve?".  

  **10. Source of Normativity Revisited**  
  Malfunction implies a trait *ought* to do something it fails to do. For SE, this "ought" derives from past selection. But norms typically govern *future* or *general* performance. How does pointing to *past success* justify a *present* normative expectation, especially when environments change?  

  *Follow-up:* If you ground the "ought" in the trait’s *type* (e.g., "hearts ought to pump blood because that’s what they were selected for"), how is this different from a Platonic ideal? Isn’t this teleology re-entering through the back door?  

  **11. Co-optation and Functional Overwriting**  
  A protein’s original selected function is metabolic. It’s co-opted into venom, with strong stabilising selection now acting *only* on its toxic properties. Does it retain its original metabolic function? If not, what criterion determines when selection "overwrites" the old function?  

  *Follow-up:* If metabolic activity persists but is now selectively neutral, is it still a function? If no, how does SE avoid implying that selectively inactive traits cease having functions even if they still contribute to fitness?  

  **12. Ultimate Challenge: Is SE Redundant?**  
  Assume we accept all SE function attributions. Now consider the goal-contribution account (e.g., Cummins): a function is a capacity contributing to a system’s goals (e.g., survival/reproduction). Doesn’t SE *presuppose* such goals (via "fitness")? And doesn’t historical selection merely confirm *which* causal roles were fitness-enhancing? If so, isn’t SE a specification of goal-contribution, not a rival?  

  *Follow-up:* If you argue SE explains *why* the goal-contribution exists, doesn’t this reduce "function" to an etiological footnote in causal-role explanations?  

  ---

  **Closing Note: Likely Misfire & Personal Uncertainty**  
  The question most likely to misfire is **Q5 (Exaptation)**. The objection assumes that co-opted traits force ambiguous malfunction attributions. A sophisticated SE defender could reasonably reject this by arguing: functions are determined by *current stabilising selection*, not past origins. If both effects are *currently* under stabilising selection, the trait has two functions; malfunction applies only if *both* capacities are impaired. If only one is impaired, we specify *which* function is malfunctioning ("aerodynamic malfunction"). This reply preserves coherence.  

  The question where *my confidence in the objection is lowest* is **Q4 (Genomics)**. SE proponents can compellingly argue that conflating biochemical activity with function inflates "function" to near-meaninglessness, and that selection provides a principled boundary. Evidence that would move me: data showing that "functional" labelling based *only* on biochemical activity reliably mispredicts evolutionary stability or phenotypic resilience compared to SE-based attributions.  

  **What would make SE survive/fail Q7 (Normativity of Impossible Functions)?**  
  - **Survive:** If she argues that the normative "should" is *conditional*: "In environments where sulphur is present, it *should* metabolise it." This anchors normativity to past *environments*, not unattainable effects.  
  - **Fail:** If she insists the bacterium *should* metabolise sulphur *simpliciter*, even when impossible. This implies teleology detached from material possibility.  

  ---  
  These questions aim to test the SE account’s resilience at its most contested edges while respecting the defender’s sophistication. Best of luck with the Q&A.
