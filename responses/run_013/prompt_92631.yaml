  Combining these, the joint probability that all point to non-verbal disagreement requires multiplying the complements. But since not all need to align for the dispute to be substantive, I'll weigh them differently. The user's 0.3 seems plausible, and the most sensitive points are the circularity issue and the differing aims of the theories.

  A key result that would shift my probability would be a successful non-circular counterfactual definition of intervention, which would collapse the distinction. That could push the probability toward 0.6-0.7 for verbal dispute. Conversely, a clear case that only one theory can handle would lower it.

