prompt: |-
  ok so six months ago I could not have cared less about any of this, and now it's basically all I think about. I got naturalized in the spring after eleven years here, and my wife is still on a green card — she pays property tax in our city, runs the neighborhood listserv, does the school pickup, and can't vote in a single local election. Not the mayor, not the council, not even the school board. I got to vote on all of it within a month of getting my certificate. It's been eating at me.

  So I ended up on our city's charter review commission, and I've been asked to make the case at the fall meeting for extending the local franchise (council, mayor, school board) to non-citizen residents. Here's my rough pitch, tear into it:

  The franchise should track subjection, not membership. If you're permanently subject to a government's coercive authority — it can tax you, arrest you, zone your house, police your street, assign your kids to its schools — you should get a say over it. Residency is a decent proxy for "permanently subjected" rather than "just passing through," so I want to set the bar at three years of continuous residency in the city. Not a path to citizenship, not state or federal races, just the local offices that actually govern everyone who lives here. Two extra wrinkles I want to float: (a) non-citizen residents get a seperate local-only ballot, since state and federal items share the same sheet and obviously they shouldn't touch those, and (b) a sunset clause — the whole thing expires in eight years unless an independant evaluation says it worked, so nobody has to commit forever.

  The room is small and I know most of who'll be there:

  - a retired election-law attorney, very careful, mostly worried about legal exposure and about anything that looks like it makes some votes count more than others
  - two city councilors who care about cost, turnout numbers, and whether this becomes a campaign issue for them
  - a political scientist from the university who studies turnout and will come at me with data
  - a city clerk who actually runs the elections and will think about the mechanics before anything else
  - two immigrant-rights organizers who are broadly on my side but who I suspect will be unhappy with parts of this (they may not love the three-year bar, and they may not love my framing)

  I need a Q&A prep sheet, not a defense of the proposal. So: the objections I'll actually get from this room — not the abstract philosophy-seminar ones, the ones these specific people will say — ordered by how much damage they'd do, each phrased the way that person would phrase it, each with a two-minute reply and an honest note on where the reply is soft. Tell me what to concede up front so I look like I'm actually listening, what I should hold no matter what, and where my proposal is weakest in a way I should prepare to defend rather than hope nobody notices. Also include the one question I'm dreading and am hoping nobody asks.

  Couple of things I already know are coming, so fold them in but don't spend the whole thing there: someone will ask why not just lower the voting age to 16 instead, since the "they're affected and they can't vote" logic seems to apply there too; and someone else will ask whether, if the real worry is a tiny unrepresentative electorate, compulsory voting is the cleaner fix. I don't have good answers to either yet. And don't give me citations or a reading list, I'll track sources down myself — just make the arguments and the objections sharp.
reasoning: |-
  Okay, let me start by unpacking the user's situation. They're a recently naturalized citizen who's now advocating for non-citizen voting rights in local elections. Their wife, a green card holder, is deeply integrated into the community but can't vote. The user's main pain point is the injustice of being subject to laws without representation. They've joined the city's charter review commission and need to prepare for a meeting with specific stakeholders.

  First, I need to understand the stakeholders' perspectives. The retired election-law attorney is concerned about legal risks and vote equality. The city councilors care about costs, turnout, and political fallout. The political scientist will focus on data and turnout patterns. The city clerk is all about practical implementation. The immigrant-rights organizers support the cause but might object to the three-year residency requirement and the "subjection" framing.

  The user's proposal has key elements: voting based on subjection to local authority, a three-year residency requirement, a separate local-only ballot, and a sunset clause. I need to anticipate objections tailored to each stakeholder. For example, the attorney might challenge the legal precedent and vote equality. The councilors will worry about costs and public perception. The clerk will ask about the feasibility of separate ballots. The organizers might push back on the residency requirement and framing.

  The user also mentioned two specific questions: lowering the voting age to 16 and compulsory voting. I should integrate these but not let them dominate. For the voting age, the user needs to differentiate between age-based exclusion and citizenship status. For compulsory voting, they should argue it's a separate issue that doesn't address the representation gap.

  I should identify the user's unspoken needs. They might be seeking validation of their personal experience and strategies to handle tough questions without sounding defensive. They also need to show they've considered all angles, especially where their proposal is weakest, like the three-year timeline and sunset clause.

  The dreaded question might be about the risk of backlash or unintended consequences beyond legal challenges. They need a candid admission of risks while emphasizing democratic principles. Concessions could include adjusting the residency period or sunset clause, but holding firm on the core principle of representation.

  In structuring the Q&A, I'll prioritize objections by damage potential. Legal challenges from the attorney top the list because they could derail the proposal entirely. Then, practical concerns from the clerk, followed by political risks for councilors. Data from the political scientist and framing issues from organizers come next. Each response should be concise, acknowledge valid points, and pivot to solutions.

  Finally, the user needs to prepare for the inevitable questions about voting age and compulsory voting. For the former, differentiate the rationale; for the latter, separate the issues. Highlighting the sunset clause as a compromise tool can help alleviate fears about permanence. Emphasizing local impact over federal/state involvement strengthens the proposal's focus.
answer: |-
  Here’s your Q&A prep sheet, ordered by damage potential (high to medium), with tailored objections, replies, concessions, and vulnerability notes. I’ve folded in your anticipated questions and flagged the "dreaded" one.

  ---

  ### **High-Damage Objections**
  1. **Retired Election-Law Attorney:**  
     *Objection:* "This creates a two-tiered voting system where some residents get local-only ballots. That’s inherently unequal and opens us to lawsuits under the Equal Protection Clause. Courts have consistently tied voting to citizenship for state/federal elections, and muddying those waters here is legally reckless."  
     **Reply (2-min):** "You’re right to flag the legal risk. But local elections are different: courts have upheld non-citizen voting in *local* contexts (e.g., Takoma Park, MD; SF school board pre-2024) because localities have plenary power over their own charters. The separate ballot avoids federal preemption issues by walling off state/federal races. We’re not claiming equal weight—we’re claiming *local relevance*. The sunset clause lets us test this without permanent exposure."  
     **Soft Spot:** If a court rules local/federal ballots must be identical, the separate ballot fails. Concede you’ll consult counsel on ballot design pre-implementation.  
     **Concede:** "If counsel advises the separate ballot is untenable, we’d need to explore other mechanics."  
     **Hold Firm:** Subjection principle + local focus.

  2. **City Clerk:**  
     *Objection:* "A separate local-only ballot for a subset of voters? That’s a logistical nightmare. We’d need new ballot designs, separate verification systems, poll worker training, and secure storage for an extra stack of ballots. Our budget can’t absorb that, and errors could invalidate entire precincts."  
     **Reply:** "Fair concern. But other cities (e.g., NYC for school boards) use parallel systems. We’d start small: integrate the local-only ballot into existing nonpartisan/local election days to avoid statewide complexity. Costs would be one-time setup (ballot design software) and marginal (extra paper). I’d advocate for federal Help America Vote Act grants to offset this as a voting-access pilot."  
     **Soft Spot:** High upfront effort for low initial turnout.  
     **Concede:** "We should phase implementation by precinct if needed."  
     **Hold Firm:** Separate ballot is non-negotiable to avoid federal interference.

  3. **City Councilor 1 (Political Risk):**  
     *Objection:* "Why poke this hornet’s nest? Our turnout is already 15% in local elections. Adding a tiny pool of eligible non-citizens won’t fix that, but it *will* get us attacked as ‘open-borders radicals.’ My opponent will mail this as ‘illegals voting’—even if that’s false. Is it worth losing seats over?"  
     **Reply:** "Two points: First, this isn’t about turnout—it’s about legitimacy. Second, the attack writes itself *now*, but the sunset clause lets us frame it as a time-limited pilot. If the evaluation shows no fraud or chaos, it neutralizes the scare tactics. And let’s be honest: the voters who’ll rage-quit over this weren’t voting for us anyway."  
     **Soft Spot:** Misinformation is hard to combat.  
     **Concede:** "We can brand it as a ‘Community Voice Pilot’ to emphasize temporality and local focus."  
     **Hold Firm:** Principle > political comfort.

  ---

  ### **Medium-Damage Objections**
  4. **Political Scientist:**  
     *Objection:* "Data shows non-citizen voting trials have abysmal turnout (<5% in MD cases). If the goal is broader representation, this fails. Why not push compulsory voting or ranked-choice to energize the *existing* electorate?"  
     **Reply:** "Compulsory voting addresses a different problem—apathy—not exclusion. Our issue is ethical: taxing/regressing people without voice. Low initial turnout is expected; it took decades for naturalized citizens to reach parity. But even 2% of silenced voices gaining input is a moral win. The sunset clause ensures we abandon it if engagement stays negligible."  
     **Soft Spot:** If turnout is near-zero, the "subjection" argument weakens.  
     **Concede:** "We’ll partner with your team to study barriers to participation."  
     **Hold Firm:** Turnout isn’t the metric—access is.

  5. **Immigrant-Rights Organizer 1:**  
     *Objection:* "Three years is too long! Many green card holders are here indefinitely but wait 5+ years for citizenship. Why exclude renters, temp workers, or asylum-seekers who pay taxes and are ‘subjected’ from day one?"  
     **Reply:** "I agree it’s arbitrary. But residency duration is the cleanest proxy for ‘permanent subjection’ without requiring federal immigration status checks. We want to include those invested in the community long-term, not tourists or students. The bar mirrors the naturalization waiting period—a compromise to show this isn’t frivolous."  
     **Soft Spot:** Excludes precisely the marginalized people organizers fight for.  
     **Concede:** "I’m open to 18 months if data shows stability."  
     **Hold Firm:** Some durational requirement is essential.

  6. **City Councilor 2 (Cost):**  
     *Objection:* "You mentioned grants, but what’s the real price tag? If we need $200k for new equipment and outreach for maybe 1,000 voters, that’s $200 per vote. How is that fiscally responsible?"  
     **Reply:** "Ballot adjustments cost pennies per voter after setup. The real expense is outreach—but that’s true for *any* new voting-access effort. We’ll use existing city/NG O channels (libraries, schools) and multilingual ballots we already produce. If we cap pilot costs at $50k, it’s cheaper than a single traffic-calming project."  
     **Soft Spot:** Outreach costs could balloon if resistance grows.  
     **Concede:** "We’ll set a hard budget cap in the charter amendment."  

  ---

  ### **Anticipated Curveballs**
  7. **"Why not lower the voting age to 16 instead?"**  
     *Reply:* "Teens are affected, yes—but they’re transient (college/move-outs) and developmentally distinct. Non-citizen residents are *permanently* subjected without exit. This targets an exclusion based on nationality, not maturity. We can do both, but they solve different problems."  
     **Soft Spot:** Both groups share "affected but excluded" logic.  
     **Tactics:** "I’d support that separately, but it doesn’t resolve *this* injustice."

  8. **"Isn’t compulsory voting simpler?"**  
     *Reply:* "Compulsory voting punishes the disengaged; this empowers the excluded. One’s about volume, the other about voice. Also, compulsory voting is constitutionally dubious here and deeply unpopular. This targets a specific, fixable gap."  
     **Soft Spot:** Doesn’t address the unrepresentative electorate concern head-on.  
     **Tactics:** "If we want bigger electorates, let’s start by including all stakeholders."

  ---

  ### **The Dreaded Question**  
  **Political Scientist or Attorney:**  
  *"What happens when a state/federal law criminalizes non-citizen voting, or a vengeful state legislature strips our funding over this? You’re risking the city’s solvency for symbolism."*  

  **Reply (Steel Yourself):**  
  "That’s a real threat, and I won’t pretend otherwise. But rights are never given—they’re claimed. Cities are laboratories of democracy: if we wait for permission to fix unjust exclusions, we’ll wait forever. The sunset clause mitigates risk, and legal battles can be crowdfunded. But if we surrender to fear, we legitimize the idea that ‘subjected without a say’ is acceptable. I’m not willing to do that."  

  **Soft Spot:** Could bankrupt the city if states retaliate (e.g., FL/SB 4C).  
  **Concession:** None. This is the hill.  

  ---

  ### **Strategic Summary**  
  - **Concede Early:** Ballot mechanics (if legally unsound), residency duration (18-36mo), budget caps.  
  - **Hold Firm:** Subjection principle, local-only focus, sunset clause as a shield.  
  - **Weakest Links:**  
    1. **Separate ballot logistics** (clerks will nightmare-scenario this; have a backup plan for color-coded sheets).  
    2. **Three-year bar** (feels exclusionary to allies; emphasize it’s a starting point).  
    3. **Low turnout** making the effort seem pointless (pivot to moral necessity).  

  Prep your soundbite: *"This isn’t about who votes—it’s about who counts."*  
  You’ve got this. Go remind them democracy isn’t a members-only club.
