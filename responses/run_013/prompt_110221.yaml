answer: |-
  ### Defense of the Metaphysics/Methodology Distinction in Causation

  **Core Argument Recap:**  
  Your position correctly diagnoses the counterfactual-interventionist divide as one between *metaphysical grounding* (what makes causal claims *true*) and *epistemic utility* (what makes them *usable* for science). Counterfactual theories (e.g., Lewis) seek truth-conditions for causation via possible worlds. Interventionist theories (Pearl, Woodward) provide a framework for modeling causal relationships to support prediction and control, explicitly incorporating idealized manipulations. The circularity objection against interventionism—that "interventions" are causally defined—is not a flaw but a revelation: interventions are *methodological idealizations*, not ontological primitives. They are tools for extracting causal structure from systems, not components of that structure.

  ---

  **The Hard Case: Temperature vs. Mean Kinetic Energy**  
  Consider a gas’s temperature (T) and the mean translational kinetic energy of its molecules (K). These are constitutively related: T *is* K by the kinetic theory of gases. This case exposes limitations in both traditions if conflated, but clarifies their distinct roles when separated.

  - **Counterfactual Tradition (Metaphysics):**  
    A naive counterfactual analysis suggests mutual causation: if T were different, K would differ, and vice versa. But this confuses *causal dependence* with *constitutive dependence*. Truth-makers for causation require *distinct existences*—a condition violated here. The counterfactual theorist *should concede* that their account needs a metaphysical constraint: causal relata must be ontologically independent. Constitutive relations (like T-K) are grounded in identity or mereology, not causation. This forces a refinement: counterfactual dependence between X and Y implies causation *only if* X and Y are not constitutively linked. Such constraints are metaphysical, not discernible from counterfactuals alone.  

  - **Interventionist Tradition (Methodology):**  
    Interventionism correctly flags the T-K relation as non-causal: no intervention on T is possible without simultaneously changing K, as they are not modular variables. Pearl’s *do*-operator or Woodward’s interventions require *surgical manipulability*—hypothetical changes to one variable while holding others fixed. Here, no such operation is coherent because T and K represent the same physical property. Interventionism thus *excludes* constitutive relations from causal modeling by design.  

  **Distinguishing Constitutive vs. Merely Nomic Relations**  
  Interventionism *can* formally distinguish constitutive relations from nomic dependencies (e.g., ideal gas law: PV = nRT, where pressure (P) and volume (V) are distinct but lawfully linked):  
  - **Nomic Lock:** An intervention on P (e.g., compressing the piston) can change P while holding V fixed *if* the system is modular (e.g., by adding a feedback mechanism). The relation is causal because variables are separable in principle.  
  - **Constitutive Lock:** No intervention on T alone is conceivable; changing T *just is* changing K. The variables fail Woodward’s *mutual manipulability* criterion and Pearl’s *functional independence* requirement.  

  This distinction is operational: interventionism treats non-separable variables as a single node in causal models. It succeeds because it asks, "Can we *represent* this relation as causal for predictive control?" not "Is this relation causal in reality?"  

  ---

  **Testing Your Prediction: Type-Level vs. Token Causation**  
  Your prediction holds:  
  - **Interventionism excels at type-level claims** (e.g., "Smoking causes cancer") by identifying invariant relationships under interventions. It models population-level effects, control strategies, and explanatory generalizations.  
  - **Interventionism struggles with token/actual causation** (e.g., "This cigarette caused Alice’s cancer"). Actual causation requires fine-grained context-specific details (e.g., preconditions, absences) that exceed interventionist models. Pearl’s "probability of necessity" or Woodward’s "actual influence" are contested patches—they lean on counterfactuals.  
  - **Counterfactual theories target actual causation** (e.g., Lewis’s dependence condition) but oversimplify type-level claims. They reduce "smoking causes cancer" to patterns of token counterfactuals, often ignoring mechanisms or invariance.  

  **Contested Issues:**  
  1. **Can interventionism handle actual causation?**  
     Woodward argues that "actual causal influence" (via path-specific effects) suffices. *Contested:* Critics say this still relies on unmotivated counterfactual similarity metrics.  
  2. **Are constitutive relations always identifiable?**  
     Interventionism assumes we can pre-theoretically distinguish variables. *Contested:* In complex systems (e.g., neuroscience), constitution may be provisional (e.g., "Is pain identical to C-fiber firing?").  
  3. **Do counterfactual theories need interventionism?**  
     Lewis dismissed interventions as "heresy," but recent hybrids (e.g., Halpern) use them to refine similarity metrics. *Contested:* Whether this blurs the metaphysics/methodology line.  

  ---

  **Verdict**  
  Your view resolves the apparent conflict:  
  - **Counterfactual theories** answer "What is causation?" by providing truth-conditions (metaphysics). They must concede that constitutive relations are not causal and refine their relata.  
  - **Interventionist theories** answer "How do we use causation?" by formalizing ideal manipulations (methodology). They correctly exclude constitutive relations by design, treating interventions as epistemic tools.  

  The gas case confirms this: interventionism’s inability to intervene between T and K reflects their non-causal status, while counterfactuals’ overgeneration reveals their need for metaphysical constraints. The type/token divide further validates the split—interventionism’s strength in modeling general relationships versus counterfactuals’ focus on singular cases reflects their divergent aims.  

  **Unresolved Tension:**  
  Whether methodology *presupposes* metaphysics (e.g., if interventions require causal primitives) remains debated. But your position withstands the test: the traditions are complementary, not competing, once we ask *which question each answers*.
