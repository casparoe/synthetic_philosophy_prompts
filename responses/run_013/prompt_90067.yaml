prompt: |-
  I'm in a second-year grad seminar on causation and I have to lock in a paper topic this week; I've settled on causation by omission, but before I start defending anything I want the spec sheet first -- what does a theory of causation by omission actually have to deliver to count as adequate? The reason I want that rather than a survey is that alot of the time the authors in this area seem to be talking past each other, and I'm pretty sure its because each of them has quietly picked a different requirement as the one that matters (one cares about the ordinary-language verdicts, another about keeping causation a mind-independent natural relation with no normative residue, another about not letting the class of causes balloon). So: give me the requirements list, with the case or consideration motivating each requirement, and say for each whether it's non-negotiable or just a commitment of one camp.

  Roughly what I want on it: the core cases it has to get right (the gardener who doesn't water, the doctor who never shows, the drowning swimmer and the bystander scrolling on his phone, double prevention where someone's failure lets a chain that would otherwise have been cut short run to completion); the profligacy problem -- if every absence of a but-for condition counts as a cause then every event has infinitely many omission-causes, so the theory must either restrict the class or explain why we shouldn't care; the action/omission asymmetry, and whether a theory is allowed to just explain it away; the finding from the vignette studies that whether we're willing to say someone caused something by not acting seems to track whether they violated some norm, which is awkward for anyone who wants causation to be value-free; whether omissions need agents at all (does a thermostat that fails to kick the furnace on, so the pipes freeze, stand on the same footing as a person who fails to act?); and the relation between causation and causal explanation, since alot of people suspect omissions explain without causing. I'll also throw in three cases I'd like you to run against the final list, because I think they're where the accounts come apart: (a) a factory that never installs a filter it was under no obligation to install, and the river downstream dies -- a but-for omission that violated no norm; (b) a supervisor who fails to notice that the safety inspector failed to show up, i.e. an omission about an omission; (c) someone who doesn't warn a stranger about a hazard they could easily have mentioned -- no duty, no special relationship, but it sure feels like their silence had something to do with what happened.

  Once the list is up, flag any pair of requirements you think can't be satisfied together -- that's the part I actually want, because I suspect the whole literature is a fight over which one to give up -- and tell me which single requirement does the most work seperating the candidate theories. Then a short scorecard: counterfactual-dependence accounts, the norm-based accounts of causal selection, the eliminativist line that omissions never cause and only figure in explanations, and whatever powers/dispositional story is current. And be honest about the soft spots: tell me which of your requirements I'd most likely be wrong to treat as fixed, and what argument or case would change your verdict on the conflicting pair -- I'd rather find that out now than three drafts in.
reasoning: |-
  Alright, let's tackle this user's request. They're a grad student in a causation seminar, focusing on causation by omission. They need a structured list of requirements for an adequate theory, along with cases that motivate each requirement. Also, they want to know which requirements conflict and how different theories handle them.

  First, I should recall the core issues in omission causation. The user mentioned several key cases: the gardener not watering plants, the absent doctor, the bystander ignoring a drowning swimmer, and double prevention. Each of these highlights different aspects—norm violations, profligacy, agency. The user is concerned about authors talking past each other, likely due to differing priorities like ordinary language vs. metaphysics.

  The requirements list needs to cover core cases, profligacy, norm-sensitivity, agency, explanation vs. causation, and action/omission asymmetry. The user also provided specific test cases: the factory without a filter, the supervisor's double omission, and the stranger not warning. These test cases will help reveal conflicts between requirements.

  Starting with core cases, each one tests different intuitions. The gardener case shows dependence on human action, the doctor adds norm violation, the bystander emphasizes moral responsibility, and double prevention involves causal chains. Profligacy is a big issue—if every absence is a cause, it leads to absurdity. Theories must address this without over-restricting.

  Norm-sensitivity is tricky because empirical studies show people judge omissions as causal when norms are violated. But if causation is supposed to be value-free, this is problematic. Agency questions whether non-agent omissions (like a thermostat) are the same as human omissions. Explanation vs. causation is another layer; maybe omissions explain but don't cause, which could resolve some issues.

  Action/omission asymmetry suggests that causing harm is worse than allowing it, which might need explaining. The test cases add complexity: the factory without a filter violates no norm but is a but-for cause. The double omission case stacks omissions, testing overdetermination. The stranger with no duty challenges norm-based accounts.

  Now, identifying conflicting requirements. For example, satisfying core cases might require norm-sensitivity, but that conflicts with the value-free causation requirement. Profligacy control and covering all core cases also clash—limiting causes might exclude legitimate cases like the factory. Agency neutrality might conflict with norm-based theories that focus on human actions.

  Among theories, counterfactual approaches handle dependence well but face profligacy. Norm-based accounts align with intuitions but compromise value-freedom. Eliminativism avoids issues but denies intuitive causation. Powers theories struggle with absences. The user needs to know which requirements are non-negotiable. For instance, value-freedom might be dropped by norm-based theories, while eliminativists reject core cases as literal causation.

  The user’s deeper need is to identify which requirement conflicts are central to the debate. They want to position their paper in the literature by choosing which conflict to address. Highlighting the tension between norm-sensitivity and value-freedom is key, as it divides many theories. Also, profligacy vs. core cases shows where theories make trade-offs.

  They might also need guidance on which requirement to treat as flexible. Value-freedom is a common casualty, as norm-based theories accept it. But if they’re defending a metaphysical view, maintaining value-freedom is crucial. The test cases will help evaluate theories: the factory case challenges norm-based accounts, double omission tests profligacy, and the stranger case checks agency and norms.

  In summary, structuring the requirements with motivations, conflicts, and theory evaluations will give the user a clear framework. They can then decide where to focus their argument, using the test cases to critique existing theories. The key is to clarify the trade-offs each theory makes and where the user's stance might lie.
answer: |-
  Here's your specification sheet for a theory of causation by omission, structured as requested. I'll break it down into requirements, motivations, negotiability, conflicts, theory scorecards, and soft spots – with your test cases integrated.

  ---

  ### **I. Core Requirements for an Adequate Theory**

  | Requirement | Motivating Case/Consideration | Non-Negotiable? | Camp Commitment |
  |-------------|-------------------------------|-----------------|----------------|
  | **1. Core Case Coverage** | Must deliver intuitive verdicts on paradigmatic omission cases: <br>- Gardener fails to water plants → plants die (*but-for dependence*)<br>- Doctor fails to show → patient dies (*duty/norm violation*)<br>- Bystander scrolls phone → swimmer drowns (*moral responsibility*)<br>- Double prevention: Guard fails to cut detonator wire → bomb explodes (*causal chain interruption*) | **Non-negotiable** (Theory fails if it can't handle these) | Universal |
  | **2. Profligacy Control** | If *every* absence of a but-for condition is a cause (e.g., *your failure to teleport to Mars* is a cause of the plant’s death), causation becomes trivialized. Theory must either:<br>(a) Restrict "genuine" omission causes, or<br>(b) Explain why infinite causes aren't problematic (e.g., via pragmatic filtering) | **Non-negotiable** (Metaphysical inflation is fatal) | Universal (though solutions vary) |
  | **3. Norm-Sensitivity** | Empirical studies (e.g., Hitchcock & Knobe 2009) show people ascribe causation by omission more readily when norms are violated (e.g., *lifeguard* not saving swimmer vs. *random passerby*). Theory must explain this asymmetry. | **Negotiable** | Norm-based/Ordinary Language camps |
  | **4. Value-Free Causation (Optional)** | Causation should be a mind-independent, natural relation without normative baggage (e.g., physics describes absences differently). Rejects norm-sensitivity as defining causation. | **Negotiable** | Natural Relation/Metaphysical camps |
  | **5. Agency Neutrality** | Does a thermostat's failure to activate → frozen pipes count as causation *in the same sense* as a human's failure? Theory must clarify if agency is essential or incidental. | **Negotiable** | Natural Relation vs. Norm-based camps |
  | **6. Explanation ≠ Causation** | We often *explain* outcomes via omissions ("The bridge collapsed because maintenance wasn't done"), but does this imply the absence *caused* it? Theory must distinguish causal relations from explanatory practices. | **Negotiable** | Eliminativist/Some counterfactualist camps |
  | **7. Action/Omission Asymmetry** | Why is *causing* harm (e.g., poisoning water) often seen as worse than *allowing* harm (e.g., not providing antidote)? Theory should explain or explain away this asymmetry. | **Negotiable** | Moral Responsibility/Norm-based camps |

  ---

  ### **II. Your Test Cases & What They Reveal**
  1. **Factory without Filter (no norm violation)**:  
     - *Challenge*: Tests requirement **#4 (Value-Free Causation)** vs. **#3 (Norm-Sensitivity)**. Is the factory’s omission a cause if no duty existed?  
  2. **Supervisor’s Double Omission**:  
     - *Challenge*: Tests **#2 (Profligacy Control)**. Does stacking omissions (supervisor fails to notice inspector’s absence) create overdetermination or compound causation?  
  3. **Stranger’s Silent Failure to Warn**:  
     - *Challenge*: Tests **#3 (Norm-Sensitivity)** vs. **#4 (Value-Free Causation)**. Intuition suggests causation without duty – violating pure norm-based accounts.

  ---

  ### **III. Requirement Conflicts: The Fault Lines**
  1. **Non-Negotiable vs. Non-Negotiable:**  
     - **#1 (Core Cases)** vs. **#2 (Profligacy Control)**:  
       - *Conflict*: Core cases demand some omissions (e.g., gardener) count as causes. But if we allow those, what stops *all* but-for absences from counting?  
       - *Theories must choose*: Restrict omissions to "salient" absences (risks excluding cases like your *Factory*) OR accept profligacy but demote it pragmatically.

  2. **Negotiable vs. Negotiable:**  
     - **#3 (Norm-Sensitivity)** vs. **#4 (Value-Free Causation)**:  
       - *Conflict*: Norm-sensitivity ties causation to human judgments; value-free demands independence from norms.  
       - *Irreconcilable?* Yes – forces a choice: Either causation is inherently normative (sacrificing value-freedom) or norm-sensitivity reflects *causal selection* (not causation itself).

  3. **Agency Ambiguity:**  
     - **#5 (Agency Neutrality)** vs. **#3 (Norm-Sensitivity)**:  
       - *Conflict*: Thermostat failures lack norms/agency. If omissions require agents, thermostats don’t cause; if not, agency is irrelevant.  

  **The Core Divide**: **Norm-Sensitivity (#3)** does the most work separating theories. It forces a choice: Is causation by omission fundamentally *metaphysical* (facts about absences) or *pragmatic* (facts about responsibility)?

  ---

  ### **IV. Theory Scorecard**
  | Theory | Core Cases | Profligacy | Norm-Sensitivity | Value-Free? | Agency Neutral? | Action/Omission | Test Cases |
  |--------|------------|------------|------------------|-------------|-----------------|-----------------|-----------|
  | **Counterfactual Dependence** (Lewis, Paul) | ✅ (But-for) | ❌ (All but-for absences are causes) | ❌ (Ignores norms) | ✅ | ✅ | ❌ (No asymmetry) | Fails *Factory* (calls it a cause), OK *Double Omission* (causal chain), Fails *Stranger* (calls it cause without norm) |
  | **Norm-Based Selection** (Hitchcock, Knobe, Halpern) | ✅ (Via salience) | ✅ (Restricts to norm-relevant absences) | ✅ (Built-in) | ❌ | ❌ (Requires agents/norms) | ✅ (Explains asymmetry) | Passes *Factory* (no norm, no cause), Passes *Stranger* (cause if norm violated) |
  | **Eliminativism** (Beebee, Dowe) | ❌ (Omissions don’t cause) | ✅ (No omissions as causes) | N/A | ✅ | N/A | ✅ (Asymmetry preserved) | Fails all core cases (denies causation) – shifts to explanation |
  | **Powers/Dispositions** (Mumford, Anjum) | ⚠️ (Absences lack powers) | ✅ (Only "positive" causes) | ❌ | ✅ | ⚠️ (Depends on ontology) | ✅ | Fails *Gardener* (no causal power in absence) |

  ---

  ### **V. Soft Spots & Recommendations**
  1. **Most Likely Overrated Requirement**: **#4 (Value-Free Causation)**.  
     - *Why*: Omission causation is inextricable from human interests in actual usage. Insisting on value-freedom may force eliminativism or counterintuitive verdicts (e.g., *Stranger* isn't causal).  
     - *Argument to Change Your View*: If causation is a *scientific* concept, physics treats absences as derivative (e.g., vacuum decay). But if it's a *folk* concept, norms are central.

  2. **Conflict Most Likely Resolvable**: **#1 (Core Cases) vs. #2 (Profligacy)**.  
     - *How*: Adopt a **contrastive** approach (Schaffer). "The gardener’s failure (vs. watering) caused death (vs. survival)" excludes irrelevant absences.  
     - *Test Case Impact*: Resolves *Factory* – omission is cause only if contrasted with normatively expected action.

  3. **Critical Takeaway**: The literature fights over **which requirements to sacrifice**:  
     - *Natural Relation Camp*: Sacrifice **#3 (Norm-Sensitivity)** → Adopt counterfactualism + pragmatics.  
     - *Norm-Based Camp*: Sacrifice **#4 (Value-Free Causation)** → Build norms into causation.  
     - *Eliminativists*: Sacrifice **#1 (Core Cases)** → Omissions explain but don’t cause.  

  **Your Paper’s Edge**: Use your test cases to expose these sacrifices. Argue that **contrastive norm-based selection** (e.g., Halpern’s "graded causation") best balances requirements, or defend **eliminativism** by showing norm-based accounts still can’t handle *Double Omission* without profligacy.

  Let me know if you need a deep dive on a specific theory or case – this is your battle map. Good luck! 🔍📝
