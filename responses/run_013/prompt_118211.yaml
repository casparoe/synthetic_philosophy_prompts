prompt: |-
  I am a novelist — four books published, a fifth in revision — and I have lost confidence in how I use the people who read my drafts. Each book passes through three rounds: two friends who write fiction themselves, my editor, my agent, occasionally a stranger the publisher sends. After every round I do one of two things, dismiss the lot or rewrite to order, and neither is a procedure. I would like you to build me one.

  What I have come to see is that nearly everything I am handed is testimony. A reader tells me what she felt, or what the book is, or what other people will make of it, and I have to decide what kind of evidence that is. There is an old and still-defended view that a work's aesthetic character cannot genuinely be conveyed at second hand — that one must encounter the thing itself to judge it — and yet readers' letters plainly change what I believe about my manuscript, and sometimes ought to. So I want a procedure that keeps two things apart: a report of a reader's own response (boredom, laughter, losing the thread, an unwillingness to keep going) is evidence of one kind; a claim about what the text is or does (the ending is sentimental, the prose is flaccid, the narrator's cruelty is funny) is evidence of another. Say what each kind is evidence for, and what it is not. Make practical use of the classical conditions for a good judge — long practice with the kind of work in question, a history of comparisons, no stake in the outcome, demonstrated sensitivity to the very feature under discussion — not as a portrait of an ideal critic no one has met, but as questions I can put to one reader about one report. And reckon with the fact that my readers are not reporting on the same object: one read the draft of March, another the draft of June, and the book has changed under them.

  The procedure has to run in an afternoon, with four letters and a marked-up manuscript on the desk, against a deadline that will not move; it must not require me to be disinterested about my own book, because I am not and cannot be; it must separate the questions that have answers from the ones that are really about what I want the book to be; and it must mark plainly where it stops and hands the decision back to me — the book is mine to sign off on, though my editor owns the schedule and my agent owns nothing but my nerves.

  Then run it on three cases, at least one of which should give me an answer I will not enjoy:

  (a) A reader I trust, herself a novelist, says the last hundred pages lose their nerve and that my protagonist turns into a mouthpiece. I reread and believe she is describing something I did on purpose.

  (b) A reader says he was bored by chapter nine — the chapter I think is the best thing in the book, and which no one else has mentioned. He gives no reason, and when pressed says only that he kept checking how many pages were left.

  (c) Two readers whose taste I respect disagree flatly about whether the narrator's cruelty is funny; they cite the same three scenes. My agent adds that the ending is not landing with the sales team, which I suspect is testimony of a different order altogether.

  Finish by telling me what the procedure cannot do, and which decisions it will keep handing back to me however carefully I run it. I am not asking for a reading list; I am asking for something I can use at the desk.
reasoning: |-
  Okay, the user is an experienced novelist with four published books and a fifth in revision. They're struggling with how to handle feedback from beta readers, editors, and agents during their drafting process. They have a clear problem: after each round of feedback, they either dismiss all the comments or rewrite blindly to satisfy them, which isn't sustainable. They want a structured procedure to evaluate feedback critically.

  The user makes a key distinction between two types of feedback: personal responses (like boredom or laughter) versus interpretive claims (like "the ending is sentimental"). They need help treating these as different types of evidence. They also mention that readers aren't all responding to the same version of the manuscript, which complicates things.

  The user has practical constraints: they need something that works in one afternoon with multiple letters and a marked-up manuscript, against a deadline. They can't be disinterested, so the method must acknowledge their emotional investment. It should separate objective feedback from subjective preferences and clearly hand decisions back to them since they're the final authority. Their editor controls the schedule, and their agent adds pressure but doesn't own the work.

  They provide three specific cases to test the procedure, including one where they won't like the outcome. Case (a) involves a trusted novelist reader criticizing the last hundred pages, but the author believes it was intentional. Case (b) is a reader bored by their favorite chapter without giving reasons. Case (c) shows conflicting opinions on whether the narrator's cruelty is funny, plus agent input about the sales team's concerns.

  The user wants a practical desk tool, not theoretical advice. They need clarity on what the procedure can't handle and which decisions will always remain theirs. Their deep needs likely include regaining control over their creative process, reducing anxiety about conflicting feedback, and preserving their artistic vision while still improving the manuscript. They might also need validation that some subjectivity is unavoidable and that it's okay to make final calls themselves.

  I'll develop a procedure called the "Testimony Triage Protocol" with clear steps. It will separate reactions from interpretations, use classical judgment criteria as practical filters, acknowledge manuscript evolution, and include a decision matrix. For the cases: In (a), the procedure would validate the user's intent but flag unintentional effects. For (b), it would treat boredom as data but not override the user's judgment on quality. For (c), it would show the humor disagreement as subjective and question the sales feedback's relevance. The conclusion will emphasize that core artistic choices remain theirs alone.
answer: |-
  Here is a procedure designed for your desk, built for speed, clarity, and acknowledging your unavoidable stake in the outcome: the **Testimony Triage Protocol (TTP)**.

  **Core Principle:** **Separate the Signal (Reaction) from the Interpretation (Judgment).** Treat each piece of feedback as *data about the reader's experience*, not gospel truth about the text.

  **The Procedure (One Afternoon, Four Letters, One MS):**

  1.  **Prep (15 mins):**
      *   Clear your desk. Lay out the 4 letters, the marked MS.
      *   Sticky notes, pens, highlighter ready.
      *   **State Your Non-Negotiables:** On a sticky note, write 1-3 core *intentions* for this book (e.g., "Protagonist's descent is unsettling, not heroic," "Pace accelerates relentlessly post-Ch6," "Tone: bleak humor"). Pin this where you see it. This is your anchor against rewriting-to-order on someone else's vision.
      *   **Version Check:** Quickly note which draft version each reader saw (e.g., "Reader A: March Draft (Pre-Climax Rewrite)", "Editor: June Draft").

  2.  **First Pass: Reaction Harvesting (45 mins - 1 hour):**
      *   **Focus Solely on Reaction Testimony:** Scan each letter/MS markup *only* for reports of the reader's *direct, internal experience*.
          *   *Look For:* "I was bored here (Ch9, p45)", "I laughed out loud at X", "I got confused about Y's motive", "I couldn't put it down after Z", "I skimmed the description of the house", "I felt deeply sad when A happened", "I stopped caring about B", "I was furious at C", "I checked page count repeatedly during D."
      *   **Record Reactions:** Write each distinct reaction on a separate sticky note. **Include:**
          *   The reaction (Boredom, Confusion, Laughter, Emotional Hit, Slog, Page-Turning Urge, Skimming).
          *   Specific Location (Chapter, Page, Scene Ref if possible).
          *   Reader Initials (e.g., "Boredom - Ch9 - RS").
      *   **Ignore:** Interpretations ("The prose is flaccid"), judgments ("The ending is sentimental"), diagnoses ("You lost your nerve"), prescriptions ("Cut this character"), or predictions ("Readers will hate this"). Save these for Step 3.
      *   **Cluster:** Stick reaction notes onto a large sheet/board/wall, grouping similar reactions in the same location (e.g., all "Confusion" notes for Ch4, p22 together).

  3.  **Second Pass: Interpretation Interrogation (1 hour):**
      *   **Focus on Interpretation/Judgment Testimony:** Now scan for the *claims* readers make *about* the text, its qualities, or its effects on others.
          *   *Look For:* "The ending is sentimental," "The prose is flaccid," "Protagonist becomes a mouthpiece," "Narrator's cruelty is funny," "Sales team won't like this," "This chapter is the best," "The plot loses momentum," "This theme isn't developed."
      *   **Record & Interrogate:** For each significant interpretation/judgment:
          1.  Write it on a sticky note. Include Location (if given) and Reader Initials.
          2.  **Apply the Classical Conditions as Practical Filters (Ask These Questions):**
              *   *Practice/Comparison:* "Does this reader have **demonstrated expertise/experience with *this specific kind* of writing** (e.g., literary suspense, dark comedy, dense historical)? Is their judgment grounded in comparison to similar works I respect?" (Flags expertise relevance).
              *   *No Stake:* "Does this reader have a **direct personal or professional stake** in this book's success/failure *beyond its artistic merit*? (e.g., Agent needs a sale, Editor needs a hit, Friend might be jealous/competitive, Stranger paid by publisher might want to please)." (Flags potential bias).
              *   *Sensitivity:* "Has this reader **demonstrated specific sensitivity** to the *exact element* they're judging in the past (e.g., praised/criticized 'funny cruelty' or 'sentimentality' insightfully elsewhere)?" (Flags credibility on *this* point).
              *   *Version Mismatch?:* "**Did they read the *current* version?** If not, is their critique likely still relevant to the core element, or was it addressed in revisions?" (Flags outdated feedback).
          3.  **Mark the Note:** Based on your quick assessment:
              *   **Green Dot:** Interpretation passes most filters (expertise relevant, low stake, demonstrated sensitivity, current version). Strong evidence the text *might* be doing/being what they say *for some readers like them*. Requires serious consideration.
              *   **Yellow Dot:** Mixed/moderate pass (e.g., expertise but some stake, OR sensitivity but outdated version). Evidence to weigh cautiously.
              *   **Red Dot:** Fails key filters (e.g., clear stake, no relevant expertise, outdated, no sensitivity shown). Weak evidence; treat as one reader's subjective opinion, not authoritative.

  4.  **Synthesis & Decision Matrix (45 mins - 1 hour):**
      *   **Analyze Reaction Clusters (Step 2):**
          *   Look for **Consensus:** Do multiple readers report the *same* reaction in the *same* place (e.g., 3 readers confused at Plot Point X)? This is **strong evidence of an objective effect** in the text, regardless of intent. *This needs fixing.*
          *   Look for **Strong Singular Reactions:** A single, vivid, specific reaction from a trusted source (e.g., "Felt physically sick at Betrayal Scene") can be powerful data, even without consensus.
          *   Look for **Reactions Contradicting Your Intent:** (e.g., "Bored" where you wanted tension; "Found it funny" where you wanted horror). **Evidence of a gap between intent and execution.** Needs analysis.
          *   **Action:** Mark clusters: "**Investigate/Revise**" (Consensus Problems, Intent Gaps), "**Note/Consider**" (Strong Singular), "**Monitor**" (Isolated, minor).
      *   **Analyze Interpretations (Step 3):**
          *   **Green Dots:** Treat as credible hypotheses about the text's nature/effect. **Compare to your Intent (Step 1):**
              *   *Alignment:* Does their interpretation match your core intent? (Good sign, maybe reinforces).
              *   *Misalignment:* Does it contradict your intent? (Evidence of execution gap needing work).
              *   *Interesting Divergence:* Does it offer a compelling reading you hadn't considered but *enhances* the work? (Potential insight).
          *   **Yellow Dots:** Weigh against intent and reaction data. Is there supporting evidence elsewhere? Proceed cautiously.
          *   **Red Dots:** Acknowledge, but **discount heavily**. File as "Reader X's Opinion."
      *   **Build Your Decision Matrix:**
          *   Create a simple list of **Actionable Issues** identified (e.g., "Confusion at Plot Point X (Consensus Reaction)", "Boredom in Ch9 (Singular Reaction - Contradicts Intent)", "Green Dot Interpretation: Protagonist feels like mouthpiece - Contradicts Intent").
          *   Next to each, note **Evidence Type & Strength** (e.g., "Consensus Reaction - Strong", "Singular Reaction (Trusted Reader) - Moderate", "Green Dot Interpretation - Strong").
          *   **Crucially:** For each issue, ask: **"Is this a problem with *what I want the book to be*, or a problem with *how successfully I'm achieving it*?"** The latter is fixable within your vision. The former is a fundamental choice *only you* can make.
      *   **Mark the Hand-Back:** Draw a line. Below it, list any interpretations or prescriptions that are fundamentally about *their* vision, not your execution of *yours* (e.g., "Reader wants a happier ending," "Agent thinks sales team wants less cruelty"). **Label: "Artistic Vision - Author's Decision".**

  5.  **The Cut-Off:** You now have:
      *   A list of **execution problems** backed by reaction evidence or credible interpretation, prioritized by evidence strength.
      *   A clear separation of **actionable fixes** from **fundamental artistic choices**.
      *   **You sign off.** Use the matrix to guide targeted revisions focused on *executing your intent more clearly or powerfully*, based on the strongest evidence. Ignore prescriptions that violate your non-negotiables (Step 1).

  **Running the Cases:**

  *   **Case (a): Trusted Novelist - "Last 100 pages lose nerve, protagonist mouthpiece."**
      *   *Reaction:* Is there a report of *her experience*? (e.g., "I felt the tension drain," "Protagonist felt preachy, I disengaged"). Harvest that as Reaction data (potential "Intent Gap").
      *   *Interpretation:* "Loses nerve"/"Mouthpiece" = Judgment. Apply Filters:
          *   Practice/Comparison: High (Novelist, knows the kind of work). **Pass.**
          *   No Stake: Assume trusted friend - likely Low Stake. **Pass.**
          *   Sensitivity: Has she demonstrated insight into narrative tension/character voice before? (Likely Yes). **Pass.**
          *   Version: Assume current. **Pass.**
      *   **Green Dot Interpretation.** It contradicts your intent ("I did it on purpose"). Synthesis: Strong evidence your *intended effect* (whatever "nerve" or non-mouthpiece quality you aimed for) **is not being achieved for this expert reader.** The procedure flags it as a **significant execution gap ("Intent Gap")** demanding investigation/revision, *not* that your intent is wrong. The hand-back says: "You intended X, expert reader perceived Y. How to bridge the gap?"

  *   **Case (b): Bored by Ch9 (Your Favorite), No Reason.**
      *   *Reaction:* "Boredom - Ch9 - [Reader]" is pure Reaction Testimony. Harvest it.
      *   *Interpretation:* None provided beyond the boredom report. (The implicit "it's bad" is weak).
      *   *Synthesis:* A **Singular Reaction** contradicting your intent ("I think it's best"). Check Reaction clusters: Is there *any* other negative reaction (boredom, slog, skimming) near Ch9? If *no consensus*, mark **"Note/Consider."** Evidence Strength: Weak (one reader, no corroboration, no reason given). The page-checking amplifies it slightly. **TTP Output:** "Reader boredom reported in Ch9. Isolated report. Monitor for other signals, but insufficient evidence alone for major revision. Does your 'best' chapter risk pacing issues for some readers?" Hand-Back: **"Weigh isolated reaction against your judgment of the chapter's merit."**

  *   **Case (c): Disagreement on Funny Cruelty; Sales Team Ending.**
      *   *Reaction:* Look for *their* reactions: Did Reader 1 *laugh* at the cruelty scenes? Did Reader 2 *feel uncomfortable/disturbed*? Harvest those specific reactions ("Laughter - Scene X - R1", "Discomfort - Scene X - R2").
      *   *Interpretation:* "Funny" vs. "Not Funny" = Judgments.
          *   Apply Filters to *both* interpretations. Assuming both have respected taste:
              *   Practice/Comparison: Likely Pass both.
              *   No Stake: Likely Pass both (assuming trusted readers, not stakeholders).
              *   Sensitivity: Do they *both* have demonstrated sensitivity to humor/tone/darkness? If yes, Pass. This is key.
              *   Version: Assume same/similar. Pass.
          *   **Result:** Both interpretations likely get **Green Dots** – they are credible reports of *how the text landed for them*. The *disagreement itself* is the data.
      *   *Agent's Interpretation:* "Ending not landing with sales team" = Judgment/Prediction.
          *   Apply Filters:
              *   Practice/Comparison: Sales team expertise is *market prediction*, not aesthetic judgment. **Fail** for literary merit.
              *   No Stake: Agent has high stake in sales. **Fail.**
              *   Sensitivity: Sales team sensitivity is to market trends, not necessarily the text's inherent qualities. **Fail** for *this* discussion.
              *   Version: Assume current.
          *   **Red Dot Interpretation.** It's evidence about *perceived market response*, not the book's aesthetic success. Discount heavily for artistic decisions.
      *   *Synthesis:*
          *   **Reactions:** Conflicting reactions (Laughter vs. Discomfort) to the *same scenes* are **strong evidence the tone/effect is ambiguous or polarizing.** This is valuable data about the text's inherent property.
          *   **Interpretations:** The Green Dot disagreement confirms the tonal ambiguity. It's *working as intended* if ambiguity is the goal; it's a *problem* if you wanted clarity (funny OR disturbing).
          *   **TTP Output:** "Tonal ambiguity confirmed in Scenes X,Y,Z (conflicting Green Dot interpretations and reactions). Is this ambiguity intentional and functional? If not, revision needed for clarity. Sales team concern (Red Dot) noted as market feedback, irrelevant to core artistic assessment of the ending's merit." Hand-Back: **"Decide if tonal ambiguity serves your vision. Sales input is commercial, separate from artistic revision (unless commercial success is a core non-negotiable)."**

  **What the Procedure Cannot Do (And What It Always Hands Back):**

  1.  **Define Your Artistic Intent:** It relies on *you* stating your non-negotiables. It can't tell you *what* the book should be, only if the text is achieving *what you say* you want.
  2.  **Resolve Fundamental Value Judgments:** If the core disagreement is about *what is good* (e.g., "Is this kind of cruelty ever funny?"), the TTP will highlight the disagreement and hand it back. You must decide your aesthetic values.
  3.  **Guarantee Success:** It processes evidence, not magic. It improves the odds of executing *your* vision effectively but can't predict awards or sales.
  4.  **Eliminate Your Subjectivity:** Your assessment of reader credibility (Filters) and the weight given to reactions is inherently subjective. The TTP makes this process explicit and structured, not objective.
  5.  **Make the Final Choice:** Every "Artistic Vision - Author's Decision" flagged in Step 4 is handed back. The procedure ensures you see *why* it's a fundamental choice (it conflicts with your stated intent or is a pure value judgment), but you alone choose.
  6.  **Reconcile Irreconcilable Feedback:** When credible experts disagree (Case c), the TTP clarifies *that* they disagree and *why* (tonal ambiguity), but you must decide which effect (or the ambiguity itself) serves your book.
  7.  **Force You to Fix "Problems":** It identifies potential execution gaps based on evidence. You retain the sovereign right to say, "I see the evidence, but I choose to keep it as is for reasons central to my vision." The TTP ensures this is a conscious, informed choice.

  The **Testimony Triage Protocol** forces you to dissect feedback, prioritize based on evidence type and source credibility, relentlessly compare it to *your* intent, and separates fixable execution from fundamental choice. It won't make the decisions easy, but it will make them clearer, faster, and more defensible – to yourself and others – against the deadline. Now, pin your non-negotiables to the wall and start sticking.
