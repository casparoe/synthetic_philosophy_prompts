prompt: |-
  After a career in the physical sciences I have spent the last several years reading philosophy, and I keep meeting a difficulty that I used to handle by instinct and would now like to understand properly. The difficulty is this. When I know nothing about a quantity beyond the range it can occupy, I am tempted to treat all values in that range as equally likely. But that instruction is not well defined, because everything depends on the variable in which I apply it. Suppose I know only that a cube's edge lies between one and two centimetres. If I take the edge length to be equally likely at every value, I obtain one spread over the volume; if I instead take the volume to be equally likely across the range it can occupy, I obtain a different one. Both seem licensed by the same reasoning from ignorance, yet they disagree about any question I put to them, such as the chance that the volume exceeds some threshold. I have since noticed the same structure elsewhere. A colleague estimating a rate constant from a bare order-of-magnitude range gets a different spread depending on whether he works with the rate or with its logarithm. And a friend reasoning about a random point on the surface of the Earth gets different answers about whether it falls in a given hemisphere depending on whether she conditions on latitude or on longitude first.

  What I would like to know is whether there is an established name for this general phenomenon — the failure of "treat every possibility as equally likely" to be well defined, because it silently presupposes a choice of variable — and, more than the name, how the field carves it up. Is it one problem or a family of related ones? How does it bear on the separate complaint that a probability for a single case depends on which class of similar cases one draws the frequency from? In practice we often settle such questions by demanding that the answer not change when we change units, but I cannot tell whether that is a genuine derivation or a substantive empirical assumption in disguise; nor can I tell whether appeals to a symmetry of the situation, or to some rule for making the assignment as uninformative as possible, actually resolve the ambiguity or merely move it somewhere else. Is the honest conclusion that probabilities of this kind are subjective through and through, or is there a defensible objective version?

  I am not after a reading list. I want the distinctions drawn carefully, the boundary cases made explicit, and a verdict on which of the neighbouring concepts fits what I have described and which does not.
reasoning: |-
  Okay, let me start by unpacking this user's query. They have a background in physical sciences and have been diving into philosophy, encountering a specific problem about assigning probabilities when ignorant. The core issue is that treating all possibilities as equally likely depends on the variable chosen, leading to inconsistent results.

  First, I need to identify the main examples they provided: the cube's edge versus volume, the rate constant versus its logarithm, and the random point on Earth conditioned on latitude or longitude. Each shows that uniform distribution in one variable isn't uniform in another. 

  The user wants to know the established name for this phenomenon. I recall that the principle of indifference is central here. But they also mention deeper issues: whether this is one problem or a family, its relation to the reference class problem, and if solutions like unit invariance or maximum entropy resolve the ambiguity.

  Breaking it down, the principle of indifference states that without information, all outcomes should be equally probable. However, as the examples show, applying this to different variables (length vs. volume) gives different probabilities. That's Bertrand's paradox, which is a classic illustration. 

  I should connect their examples to Bertrand's paradox. The cube example is similar—uniform in length gives a different volume distribution than uniform in volume. The rate constant and Earth's surface examples are variations of the same issue, showing the variable-dependence problem.

  Next, distinguishing between one problem or a family. While the core is the same—variable dependence under indifference—different contexts (continuous parameters, spatial probabilities, etc.) present unique challenges. So it's a unified problem with multiple facets. 

  The reference class problem is related but distinct. Both involve ambiguity in probability assignments, but the reference class is about choosing the right category for frequency, while indifference is about uniform distribution given a variable. They share epistemic subjectivity but differ in structure.

  Addressing proposed solutions: Invariance under transformations (like unit changes) can work but requires prior knowledge of the "natural" metric, which isn't always available. Maximum entropy uses constraints, but choosing constraints involves subjectivity. Symmetry arguments help in specific cases but may not generalize.

  The user questions if probabilities here are purely subjective. The answer leans towards epistemic probability being subjective, needing context-dependent priors. Objective versions require additional assumptions, like symmetry or physical constraints. In practice, scientists use empirical data to resolve ambiguities, moving from ignorance to informed priors.

  I should also clarify that while the problem is inherent, it doesn't invalidate probability. Instead, it highlights the need for explicit assumptions. The key is to articulate those assumptions rather than rely on indifference alone.

  Finally, the user's deeper need might be understanding how to navigate probability assignments under ignorance in their philosophical studies, seeking a structured framework to approach such ambiguities. They likely want clarity on whether objectivity is achievable or if subjectivity is unavoidable, which ties into broader philosophical debates about probability.
answer: |-
  Your difficulty centers on a profound challenge in probability theory and epistemology, known as the **Principle of Indifference (PoI)**. This principle asserts that if there is no reason to favor one possibility over others, they should be assigned equal probability. However, as you’ve discovered, this principle is **ill-defined without specifying a privileged variable or metric**, leading to contradictions. Below is a structured analysis of the phenomenon, its implications, and attempted resolutions.

  ---

  ### **1. The Core Phenomenon: Variable-Dependence under Indifference**
  - **Name**: **Bertrand’s Paradox** (1889) is the canonical example. It demonstrates how uniform probabilities over different parameterizations (e.g., chord length vs. angle) yield conflicting results for the same question (e.g., "probability a random chord is longer than the side of an inscribed triangle").
  - **Your Examples Fit This Pattern**:
    - **Cube’s Edge/Volume**: 
      - Uniform in edge length *x* (1–2 cm) → Density *f(x) = 1*.  
      - Uniform in volume *v = x³* → Density *g(v) = 1/(3v^{2/3})* for *v* in [1,8].  
      - Prob(*v* > 3) is 5/7 under *f(x)* but 5/8 under *g(v)*.
    - **Rate Constant**: 
      - Uniform in rate *k* (e.g., 10⁻³ to 10³ s⁻¹) vs. uniform in log(*k*) implies different "spreads" (linear vs. logarithmic scale).
    - **Earth’s Surface**: 
      - Uniform in longitude/latitude vs. uniform in area (using *cos(φ)* dφ dθ for spherical coordinates) yields different probabilities for hemisphere inclusion.

  - **Why It’s a Single Unified Problem**:  
    All cases share the same structure: **ignorance → appeal to uniformity → inconsistency under reparameterization**. The core issue is that "uniformity" requires a *measure* (i.e., a way to assign "size" to sets), but no unique measure exists for continuous spaces without additional structure.

  ---

  ### **2. Relation to Other Problems**
  - **Reference Class Problem** (e.g., single-case probabilities):  
    - **Similarity**: Both involve ambiguity in selecting a "natural" class for assigning probabilities (e.g., is a "random cube" defined by edge or volume?).  
    - **Difference**: The reference class problem concerns *categorization* (e.g., "Is Socrates mortal?" depends on classifying him as "human" vs. "philosopher"), while Bertrand-style paradoxes concern *parameterization of continuous variables*. Both reveal subjectivity in framing ignorance.

  - **Epistemic vs. Objective Probability**:  
    This challenge primarily affects **epistemic probabilities** (degrees of belief based on knowledge). Objective probabilities (e.g., physical propensities) avoid this by relying on empirical symmetries or frequencies, but they cannot be applied from pure ignorance.

  ---

  ### **3. Proposed Resolutions & Their Limitations**
  #### **A. Invariance Under Transformations**
    - **Idea**: Demand that probabilities be invariant under "natural" transformations (e.g., unit changes: cm to inches, linear to log scale).  
    - **Critique**:  
      - **Circularity**: What counts as a "natural" transformation? Physics often uses *scale symmetry* (e.g., *k* and *αk* should yield same form), leading to the **Jeffreys Prior** (*p(θ) ∝ √I(θ)*, where *I(θ)* is Fisher information).  
      - **Not General**: For the cube, volume *v* and edge *x* are related by *v = x³*, but no unique symmetry dictates uniformity in *x* vs. *v*.  
    - **Verdict**: Invariance works when a symmetry is *physically grounded* (e.g., scale-invariance in cosmology), but it’s a substantive assumption, not a derivation from ignorance.

  #### **B. Maximum Entropy (MaxEnt)**
    - **Idea**: Assign probabilities to maximize Shannon entropy *S = -∫ p log p dx*, subject to constraints.  
    - **Critique**:  
      - **Metric-Dependence**: MaxEnt requires a *reference measure* (e.g., uniform in *x* vs. *v*). Without it, entropy is undefined.  
      - **Example**: MaxEnt with no constraints yields uniformity, but in *which variable?* The choice of *dx* vs. *dv* remains arbitrary.  
    - **Verdict**: MaxEnt shifts ambiguity to the choice of reference measure, mirroring the original problem.

  #### **C. Symmetry Arguments**
    - **Idea**: If symmetries exist (e.g., rotational invariance for a circle), they define a unique uniform measure.  
    - **Critique**:  
      - **Breaks Down Quickly**: For the cube, no symmetry favors edge over volume. For Earth, conditioning on latitude first assumes a specific coordinate system.  
      - **Subjective Basis**: Is latitude "natural"? Only if we privilege Earth’s axis of rotation—a physical fact, not logic.  
    - **Verdict**: Symmetry resolves specific cases but fails for arbitrary parameters.

  ---

  ### **4. The Honest Conclusion: Subjectivity & Pragmatism**
  - **Probabilities from Ignorance Are Subjective**: There is no objective way to assign uniform probabilities in continuous spaces without additional structure. The PoI is fundamentally dependent on how the problem is *parameterized*, which reflects epistemic choices.  
  - **Defensible Objectivity? Only Contextually**:  
    - **Physical Constraints**: If a quantity has a known symmetry (e.g., isotropic space), it defines a unique measure (Haar measure).  
    - **Empirical Updating**: Start with a "convenient" prior (e.g., uniform in log scale for rates), then update with data—Bayesian methods mitigate dependence on the prior as data accumulates.  
    - **Pragmatic Choice**: Scientists often use:  
      - Uniform in linear variables for bounded intervals (e.g., cube edge),  
      - Uniform in log for scale parameters (e.g., rate constants),  
      - Solid angle for spatial distributions.  
      This relies on conventions, not pure logic.

  ---

  ### **Boundary Cases & Key Distinctions**
  1. **Discrete vs. Continuous**:  
     - PoI is unambiguous for *finite discrete* cases (e.g., a fair die).  
     - Paradoxes arise only in continuous spaces or infinite sets.  

  2. **When Invariance Works**:  
     - **Location Parameters** (e.g., mean μ): Uniformity is invariant under translation.  
     - **Scale Parameters** (e.g., standard deviation σ): Uniform in log(σ) is invariant under scaling.  

  3. **When It Fails**:  
     - **No Natural Metric**: Cube edge/volume, or any nonlinear transform.  
     - **Infinite Ranges**: Uniformity is improper (non-normalizable) over infinite intervals (e.g., *ℝ*).  

  4. **Not a Problem of "True Randomness"**:  
     This is unrelated to quantum indeterminism or frequentist probabilities. It’s about *epistemic representation of ignorance*.

  ---

  ### **Summary & Verdict**
  - **Name**: **Bertrand’s Paradox** (or more broadly, the **Parameterization Problem of the Principle of Indifference**).  
  - **Status**: A unified phenomenon revealing that **uniformity requires a choice of measure**, which cannot be justified by ignorance alone.  
  - **Resolution**:  
    - In practice: Use **conventions** (e.g., Jeffreys priors in statistics) or **physical symmetries**.  
    - Philosophically: Accept that probabilities from ignorance are **subjective** but can be **intersubjectively justified** by context (e.g., scientific consensus on natural variables).  
  - **Neighboring Concepts**:  
    - **Fits**: Reference class problem (framing-dependence), subjective Bayesianism.  
    - **Does Not Fit**: Frequentist probability (requires data), objective chance (e.g., quantum mechanics).  

  Your instinct to demand unit-invariance is astute: it imposes a useful constraint but is empirically grounded (e.g., physics assumes laws are unit-invariant). Ultimately, the ambiguity is unresolvable by pure reason—**ignorance alone cannot generate objectivity**. The solution lies in recognizing that probability assignments from ignorance are provisional tools for reasoning, not discovered truths.
