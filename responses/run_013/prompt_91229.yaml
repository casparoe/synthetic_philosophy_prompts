  ## Precedent Autonomy Stress-Tested: The Schiavo Paradox

  The Schiavo case is a brutal stress test for precedent autonomy – the doctrine granting your competent past self authority over your incapacitated future self. It exposes a core paradox: **if the later "self" ceases to exist meaningfully (as diagnosed in PVS), precedent autonomy governs a void, reducing to a ritual about evidence and body stewardship.**

  **The Doctrine's Prescription vs. Reality:**

  *   **The Husband:** Doctrine says: Act solely on the patient's prior wishes. Michael Schiavo claimed Terri stated she wouldn't want prolonged life in such a state. Doctrine *prescribes* his role as surrogate recalling oral directives. Reality: He followed this path, triggering the legal battle.
  *   **The Parents:** Doctrine says: Respect the patient's autonomy, *not* your own wishes. Their fight to keep the tube inserted substituted their preferences for Terri's (alleged) prior ones. Doctrine *condemns* this as a violation.
  *   **The Judge (Greer):** Doctrine says: Determine the patient's prior wishes via the clearest evidence and enforce them. Greer found Michael's testimony "clear and convincing" evidence of Terri's wishes. Doctrine *explains* his rulings *cleanly* – he prioritized precedent autonomy over parental love and gut feelings.
  *   **The Politicians (Governor Bush, Congress):** Doctrine says: The prior competent self's wishes are paramount, and surrogates/judges are the designated interpreters. Their interventions (Terri's Law, federal legislation) aimed to override judicial findings and reinsert the tube based on political pressure or sympathy. Doctrine *unequivocally condemns* this as an egregious violation of both precedent autonomy and judicial process.

  **Where the Doctrine Struggles & Goes Silent:**

  1.  **The "Later Self" Problem:** Doctrine assumes a continuity of self where the prior self governs the *interests* of the later incapacitated self. But in confirmed PVS, where consciousness, personality, and subjective experience are extinguished, **is there a "self" with interests to govern?** If not, precedent autonomy governs an empty vessel. The doctrine **misdescribes** (or avoids describing) this reality. It pretends a "person" is still present needing governance because without that fiction, the doctrine lacks a subject. The court wasn't adjudicating *Terri's current wishes* (she had none) but **deciding who owned the narrative of her past wishes and the stewardship of her body.** The "costume" metaphor is apt – deference was paid to her past self as the rightful owner of the body, even if the occupant was gone.
  2.  **The Evidentiary Crutch:** Doctrine insists on following the patient's wishes, but **says little about the proof required when wishes are oral, years old, and uncorroborated.** Schiavo exposed that the *real* battleground was not the principle itself, but the evidentiary standard ("clear and convincing") applied to sparse testimony. Why? Because a pure **"best interests" standard** – asking what was best *for the unconscious entity in the bed* – would almost certainly have mandated continuing artificial nutrition/hydration. PVS patients feel no pain; ceasing feeding leads to death. Doctrine, however, recoils from substituting others' judgments of "best interests" for the patient's own prior directive. Schiavo shows the doctrine **compensating for its shaky ontological foundation by clinging rigidly to procedure and evidence**, making the evidentiary bar the critical, unanticipated factor.

  **What Schiavo Reveals About the Doctrine:**

  Schiavo is less a confirmation and more an **anomaly exposing critical limitations:**

  *   **Conceptual Instability:** It reveals the doctrine's vulnerability when the presumed subject (the later self) vanishes neurologically. The foundation cracks.
  *   **Procedural Masking:** When the later self disappears, the doctrine devolves into a procedural mechanism focused on evidence standards and body stewardship, masking the underlying void.
  *   **Evidentiary Reliance:** The case demonstrates that in the absence of clear written directives, the doctrine's practical application hinges entirely on contested interpretations of past statements, becoming highly vulnerable to disputes about reliability and motive.
  *   **Political Vulnerability:** It starkly shows how the doctrine's reliance on judicial interpretation of personal wishes makes it a target for political override when outcomes are emotionally or ideologically unpalatable.

  **Bottom Line:** The Schiavo case confirms precedent autonomy's power in directing outcomes *when applied*, but exposes its core paradox: it governs a later self that may not meaningfully exist. When faced with this void, the doctrine defaults to a procedural ritual focused on evidence and stewardship, masking its shaky foundation. Schiavo reveals precedent autonomy as conceptually strained in extreme neurological cases, reliant on fraught evidence, and vulnerable to political assault when the illusion of a governing relationship breaks down.
