  What I can't figure out is why he thought that was the honest version. To me, saying the planets beam rays at us at angles that tune the Earth's soul sounds way more magical than just saying Mars means war. And I can't tell if he actually believed the horoscopes he cast for people or if he was doing it partly for money and reputation. Can you help me understand what he was really claiming in that passage, and why putting it on a geometrical and optical footing seemed like the respectable move to him? No need for a reading list — I just want to get the move he's making.
