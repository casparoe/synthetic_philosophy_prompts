  I'll make sure both make strong arguments but Dr. Vance should win the debate since the user wants a definite verdict. Her winning point will be that the deposit's internal symbolic grammar makes belief inference unavoidable, while conceding that specific meanings remain unknown. This gives the user actionable rationale for including belief discussion while acknowledging limitations.

