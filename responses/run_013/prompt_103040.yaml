  I need to structure this dialogue carefully. The processualist (let's call her Dr. Shaw) will argue that we can only discuss observable behaviors and functions, not beliefs. She'll point out that "deliberate decommissioning" explains the patterns without invoking unprovable mental states. The interpretive archaeologist (Dr. Vance) will counter that the specific arrangement (ring of heads, central intact figure) inherently carries meaning that requires interpretation of beliefs.

