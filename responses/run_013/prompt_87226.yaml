prompt: |-
  Me and my friend got into a two-hour fight last night about cost-benefit analysis and I want a tiebreaker. Also, please don't end with a reading list, I won't read it, I want the actual argument.

  Here's the fight. When a regulator writes a rule — a workplace exposure limit, an air quality standard — the normal way it gets scored is: count up the deaths and illnesses avoided per year, multiply by the dollar value they've assigned to a statistical life or a year of healthy life, add it all up, subtract the compliance cost, and if the sum comes out positive the rule is worth doing. Health systems do the same thing when they rank treatments by cost per QALY. My friend says this is just Harsanyi's theorem with a budget. He says if each person's preferences obey the expected-utility axioms and the social ranking does too, and everyone's indifferent whenever all the individuals are, then the only coherent way to rank outcomes is a weighted sum of individual utilities — so an agency adding up a thousand people's small health gains and comparing the total to one person's death isn't making a philosophical choice at all, it's just doing the math right. He says the practice presupposes straight utilitarianism, everyone counts the same, only the total matters, and anyone who squirms is refusing to add.

  Here's what actually bothers me, and it's a specific inconsistency I can't get past. The same agencies that run this arithmetic also use a de minimis rule: an extra lifetime cancer risk of around one in a million to the most exposed person gets treated as negligible and not a reason to regulate, no matter how many millions of people are exposed to it. So a rule that gives a million people each a one-in-a-million chance of dying doesn't get counted as one expected death to be weighed against its costs — it gets waved through as nothing. But those same agencies will sign off on a rule that will certainly kill one identifiable person, or a handful, if the statistical lives saved on the other side of the ledger are more numerous. Tiny harms spread across millions of people get rounded to zero, while a certain death to one person gets traded away for numbers. Those two moves can't both be right, can they? One of them is aggregation, the other is a per-person veto, and they're sitting in the same rulebook.

  Then my friend has a fix, which is where I think he goes off the rails. He wants to scrap the de minimis rule and run everything through pure expected value: a million people at one in a million is exactly one expected death, so the rule has to pass the same cost-benefit test as anything else. I said that's how you end up saying it's fine to give everyone in the world a one-in-a-billion chance of being tortured for fifty years instead of certainly torturing one person, and he said yes, obviously, that's the correct answer, and he didn't even blink. So now I don't know whether the practice we actually have is the incoherent one, or whether it's the only way to keep the dust-specks intuition out of the rulebook, or whether the intuition is just a bug.

  What I want from you: tell me what the practice itself presupposes. Not what regulators say they're doing, but what the thing they actually do only makes sense under. Which view of welfare and its aggregation does it commit to, and where is it just underdetermined, so that several rival theories would license exactly the same rulebook? And specifically: does Harsanyi's theorem really give my friend what he wants, or does the practice need premises the theorem doesn't supply — equal weights, a common zero point, welfare comparisons between different people, the ex ante standpoint? Tell me where his pure-expected-value fix would actually flip decisions and what it would cost, and where the de minimis rule is doing work that no aggregation-based theory can do.

  Format: my friend and I are going to compare answers side by side, so give it to me as a JSON object with exactly these fields and nothing outside it:
  - "practice_stated": one paragraph, the practice as described above in your own words, so we can check we mean the same thing
  - "implicit_theory": the view of welfare aggregation the practice only makes sense under, one paragraph
  - "strictly_presupposed": array of short strings, the commitments without which the practice falls apart
  - "merely_compatible": array, views the practice fits comfortably with but doesn't actually require
  - "ruled_out": array, rival views the practice quietly rules out, each with a clause saying why
  - "internal_tension": what to say about the de minimis rule versus the statistical-lives tradeoff — coherent or not, and why
  - "harsanyi_verdict": whether the theorem licenses the practice as it stands, and which extra premises the practice needs that the theorem doesn't give
  - "friend_fix_effects": object with "changes_decisions" (array of concrete kinds of cases where his pure expected value rule flips the outcome) and "costs" (array)
  - "underdetermined_where": array, the places where several different theories would license the same practice
  - "confidence": a number from 0 to 1 for how much of the above is settled rather than contestable, plus one sentence on what's doing the settling
reasoning: |-
  We are going to break down the argument as requested, strictly following the JSON format and fields.

  ### Step 1: Practice Stated
  The practice involves regulatory agencies using cost-benefit analysis (CBA) for rules like exposure limits. They quantify avoided deaths/illnesses by multiplying by a dollar value per statistical life or quality-adjusted life year (QALY), then subtract compliance costs. If net benefits are positive, the rule is justified. Additionally, these agencies apply a de minimis rule: risks below a threshold (e.g., one-in-a-million lifetime cancer risk) are treated as negligible and not regulated, regardless of the number of people exposed.

  ### Step 2: Implicit Theory
  The practice implicitly adopts a form of utilitarianism that aggregates individual welfare changes (in expected utility terms) into a social welfare function. However, it incorporates a discontinuity via the de minimis rule, which introduces a non-utilitarian element by treating very small individual risks as zero. This creates a hybrid approach: it uses utilitarian aggregation for non-de minimis risks but imposes a per-person threshold below which harms are ignored.

  ### Step 3: Strictly Presupposed
  - **Expected Utility Theory**: The practice relies on representing risks as expected outcomes (deaths, illnesses) and valuing them linearly.
  - **Aggregationism**: The total welfare change (net benefits) is the sum of individual changes.
  - **Quantification of Welfare**: Welfare must be quantifiable in monetary terms or QALYs for comparison with costs.
  - **Ex Ante Perspective**: Evaluations are based on expected outcomes before the resolution of uncertainty.

  ### Step 4: Merely Compatible
  - **Utilitarianism**: The aggregation of total welfare is utilitarian, but the de minimis rule breaks pure utilitarianism.
  - **Prioritarianism**: Could be incorporated if weights are applied to individuals based on their baseline welfare, but the practice typically uses equal weights.
  - **Ex Ante Egalitarianism**: The de minimis rule might be seen as addressing ex ante fairness, but it is not explicitly required by the practice.
  - **Contractualism (partially)**: The de minimis rule might reflect a social contract where very small risks are acceptable, but the core aggregation is non-contractualist.

  ### Step 5: Ruled Out
  - **Strict Egalitarianism**: The practice allows trading off one person's death for many small gains, which strict egalitarianism would reject due to inequality.
  - **Contractualism (as a complete theory)**: Contractualism would require that no individual can reasonably reject a rule, but the practice allows rules that impose certain death on one if overall benefits are high, which might be rejectable by that one.
  - **Deontological Constraints**: The practice does not include side constraints (e.g., against killing) that would prohibit certain trades, even if beneficial overall.
  - **Sufficientarianism**: The de minimis rule might resemble a sufficiency threshold, but the practice does not otherwise focus on bringing people above a threshold.

  ### Step 6: Internal Tension
  The de minimis rule and the statistical-lives tradeoff are **incoherent** within the stated practice. The de minimis rule treats a one-in-a-million risk as negligible per person, so that even a million such exposures (one expected death) are ignored. But in the statistical-lives tradeoff, one actual death is traded against many small gains. This is inconsistent because the same expected harm (one death) is treated as zero in one context and as a significant cost in another. The practice arbitrarily switches between ignoring and counting expected harms based on the distribution of risk.

  ### Step 7: Harsanyi Verdict
  Harsanyi's theorem does **not** license the practice as it stands because the theorem requires a linear social welfare function (a weighted sum of individual utilities). The de minimis rule violates linearity by setting a threshold below which marginal changes are treated as zero. Additionally, Harsanyi's theorem assumes that the social ordering satisfies the same axioms as individual expected utility (including continuity), but the de minimis rule introduces a discontinuity. The practice needs extra premises: a common zero point (to set the de minimis threshold) and a decision to ignore very small risks, which are not supplied by the theorem.

  ### Step 8: Friend Fix Effects
  - **Changes Decisions**:
    - Regulations currently exempted by de minimis (e.g., a chemical that gives each of 10 million people a one-in-a-million risk) would now be evaluated as causing 10 expected deaths and subject to cost-benefit analysis.
    - Very low-risk activities (e.g., background radiation from a new power plant) that are currently unregulated would require justification if the expected harm exceeds zero and costs are high.
  - **Costs**:
    - Regulatory burden increases: many more activities would require analysis and potentially costly mitigation.
    - Administrative costs: agencies must evaluate and regulate even extremely low-probability risks, which are hard to quantify and may lead to arbitrary lines being drawn elsewhere.
    - Potential for public backlash: people may reject the idea that a one-in-a-billion chance of torture is equivalent to a billionth of a torture, as it violates intuitions about fairness and individual rights.

  ### Step 9: Underdetermined Where
  - **Weights in Aggregation**: The practice uses equal weights per person, but Harsanyi allows for different weights (e.g., prioritizing the worse off). The practice does not specify how weights are set.
  - **Valuation of Life/QALY**: The dollar value per statistical life is set by revealed preference or other methods, but different theories (e.g., prioritarianism) could use the same number.
  - **Ex Ante vs. Ex Post**: The practice is ex ante (evaluating expected utilities), but the same CBA numbers could be used in an ex post aggregation (e.g., after risks are realized) by a utilitarian, though the justification would differ.

  ### Step 10: Confidence
  Confidence: 0.8. The inconsistency in the practice (de minimis vs. statistical lives) is clear, and Harsanyi's theorem requires continuity, which the de minimis rule breaks. The fix's consequences are straightforward. What's settled: the mathematical inconsistency in the practice and the theorem's requirements. The contestable part is whether the de minimis rule is a pragmatic necessity or a philosophical error.

  Now, we output the JSON object accordingly.
