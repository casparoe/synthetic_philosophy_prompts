prompt: |-
  I'm on the board of a small family foundation — we give out about eight grants a year, $20-40k each, mostly local education and public health with a bit of climate stuff mixed in. We meet quarterly and each proposal gets maybe twenty minutes. We're stuck in a loop. Half the board says you can't possibly know the long-run consequences of anything — the kid who gets dewormed grows up to be a dictator, the community center gets a new roof and then the neighborhood gentrifies — so we should fund whatever feels decent and stop pretending otherwise. The other half says that's just an excuse for laziness, and we should estimate expected value and pick the biggest number. I've read enough philosophy to know both sides have a point and that this is roughly what people mean by cluelessness, but I have no idea how to get it out of the seminar room and into a board meeting.

  What I want is a decision procedure we can actually run, in order, on a one-page proposal, in the twenty minutes we've got, with a board that includes a retired accountant, a high school principal, and my niece who's doing a PhD in philosophy. It needs to:

  - seperate the two kinds of ignorance we're dealing with — the kind where we can't trace the causal chain at all, and the kind where we can trace it fine but can't put the effects on a common scale — because I suspect they call for completely different responses;
  - say what to do at each step, what counts as a good enough answer, and where the procedure is allowed to stop with a yes or a no;
  - mark the points where we're just making a value call and dressing it up as procedure, since our minutes have to be honest; and
  - include something for the case where the procedure says expected value is uninformative and "fund what feels decent" is unearned — where do we go when both branches fail? I want a tiebreak we can actually apply, even if it's crude.

  Then run it on three proposals from last quarter: (a) $30k to expand a deworming program in a country we already work in, where the short-term health effects are solid but the long-run development story is contested; (b) $25k to a local group running free legal clinics for tenants facing eviction, where we can see effects for about two years and then nothing; (c) $40k to a small advocacy outfit pushing a state-level policy that would affect a few million people if it passed, which it probaly won't, and which we honestly can't tell would be good on net even if it did. For each one, tell me what the procedure spits out, and be blunt about which of the three it's going to make me vote against even though I personally want to fund it.

  And if there's a step where the honest answer is "this is a coin flip, admit it and flip", say so, and tell me how to do that without it becoming an excuse for every hard call.
reasoning: |-
  Okay, let me tackle this foundation board problem. The user is stuck between two philosophical approaches to grantmaking, and needs a practical decision framework that works within tight constraints. 

  First, I need to understand the core tension: epistemic humility vs expected value optimization. The board's arguing about whether to acknowledge fundamental uncertainty or push for quantification. Both have merit, but neither works alone in real-world grant decisions with limited time.

  Hmm... the key insight might be separating different types of uncertainty. There's "causal fog" (can't trace effects at all) versus "valuation gap" (can trace but can't compare apples to oranges). These probably require different responses. 

  For the framework design, I'm considering a three-stage funnel:
  1) First filter out proposals with clear red flags or alignment issues - this uses minimal time.
  2) Then handle the "knowable" uncertainties with expected value calculations, but with strict time limits and fallbacks when quantification fails.
  3) For true cluelessness cases, switch to a tiebreaker system that's better than "whatever feels nice."

  The accountant will want numbers, the principal will care about concrete outcomes, and the philosophy PhD will need epistemological rigor. The procedure must satisfy all three in 20 minutes per proposal.

  Important to build in honesty markers - points where we explicitly say "this is a value judgment." No pretending uncertainty doesn't exist. And for true coin-flip situations, we need a transparent randomization method that doesn't become a cop-out.

  Now testing on their three cases:
  - Deworming: Strong short-term EV, long-term cluelessness. Probably funds as "least bad bet."
  - Legal clinic: Local impact is traceable but shallow. Might not clear the "knowable EV" bar.
  - Policy advocacy: High uncertainty on both passage and effects. Hardest case - likely fails both branches.

  The user won't like voting against that legal clinic, but the framework might force it if impacts don't persist beyond two years. Need to be blunt about that.

  For coin-flips, suggest pre-committing to a simple random method (dice, card draw) only when all other assessments are truly equal, and documenting why we reached that point. That prevents abuse.
answer: |-
  Here's a practical decision procedure ("The Uncertainty-Aware Funnel") designed for your constraints. It separates causal uncertainty from valuation problems, forces explicit tradeoffs, and includes tiebreakers. **Total time per proposal: 15-18 mins.**

  ---

  ### **The Decision Procedure: Step-by-Step**
  **Goal:** Classify each grant into **Fund**, **Reject**, or **Tiebreak** (for true deadlocks).

  1.  **Alignment Check (2 mins)**  
      *Ask: "Does this fit our mandate (local education/public health/climate) AND avoid obvious harm (e.g., funding hate groups)?"*  
      - **NO → REJECT** (Stop here).  
      - **YES → Proceed**.  
      *Honesty Marker:* "This is a value call about our scope. We assume our mandate reflects core values."

  2.  **Short-Term Tractable Effects (4 mins)**  
      *Ask: "What measurable, likely outcome happens within 2-5 years? Can we quantify it (e.g., kids dewormed, evictions prevented, policies drafted)?"*  
      - **NO CLEAR OUTCOME → Proceed to Step 4** (Deep Uncertainty).  
      - **QUANTIFIABLE OUTCOME → Calculate "Cost per Unit Impact"** (e.g., $ per child dewormed, $ per eviction delayed).  
      - **Compare to Benchmarks:**  
          *Better than past grants/industry standard?* **YES → Tentative FUND**.  
          *Worse?* **Proceed to Step 3**.  
      *Honesty Marker:* "We're trusting short-term proxies. We assume they correlate with good."

  3.  **Long-Term/Systemic Effects (4 mins)**  
      *Ask: "What are the main *plausible* long-term (>5 yr) or systemic effects? Can we estimate direction (+/-) and rough magnitude?"*  
      - **NO TRACEABLE PATHWAYS → Proceed to Step 4**.  
      - **TRACEABLE PATHWAYS → Do a "Sign Test"**:  
          List 3-5 key pathways (e.g., "Deworming → better school attendance → higher future income"). For each:  
          - Assign confidence (High/Med/Low) it happens.  
          - Assign expected **net valence** (Strong Positive / Weak Positive / Neutral / Weak Negative / Strong Negative).  
      - **Result:**  
          *Most likely valence net POSITIVE?* **Strengthens FUND case from Step 2**.  
          *Net NEGATIVE?* **REJECT**.  
          *AMBIGUOUS (mixed/neutral)?* **Proceed to Step 4**.  
      *Honesty Marker:* "This is speculative. We're judging plausibility, not proof."

  4.  **Deep Uncertainty Protocol (3 mins)**  
      *Use ONLY if: No quantifiable short-term effects (Step 2) OR long-term effects ambiguous (Step 3).*  
      - **Apply the "Least Bad Bet" Test**:  
          1.  **Robustness:** Would this still seem decent if key assumptions failed? (e.g., "If policy doesn't pass, does the advocacy build useful infrastructure?")  
          2.  **Precaution:** Does it avoid obvious irreversible harm? (e.g., Gentrification from a community center *might* be bad; funding a dictator *is* catastrophic).  
          3.  **Marginal Impact:** Is our grant pivotal? (e.g., Filling a funding gap vs. adding to a large pot).  
      - **Passes 2/3 tests? → TIEBREAK**.  
      - **Fails 2/3? → REJECT**.  
      *Honesty Marker:* "We're in clueless territory. This is about reducing downside risk."

  5.  **Tiebreak (1 min)**  
      *Use ONLY if: Proposal cleared Steps 1-4 but didn't get a strong FUND/REJECT signal.*  
      - **Pre-Vote Ranking:** Before meetings, board members privately rank *all proposals* in the queue.  
      - **Apply Ranking:** Fund whichever tied proposal has the highest *average board ranking*.  
      - **Tied Ranking? → Randomize** (e.g., draw a card).  
      *Honesty Marker:* "This is a crude tiebreaker. We admit uncertainty and avoid deadlock."  
      *Anti-Abuse Rule:* Tiebreak can only be used if min. 2 board members argue uncertainty is genuine.

  ---

  ### **Applied to Your Proposals**
  **Assumption:** All proposals pass Step 1 (Alignment).

  #### **(a) $30k Deworming Program**
  - **Step 2 (ST Effects):** Strong. Quantifiable short-term health impact (e.g., $5/child dewormed). Better than benchmarks → **Tentative FUND**.  
  - **Step 3 (LT Effects):** Pathways traceable (health → education → income). Valence net positive (confidence medium). → **Strengthens FUND**.  
  - **Result: FUND.** No uncertainty deadlock.  
  *Why it wins:* Short-term EV is strong, long-term is contestable but plausibly positive. Least risky under uncertainty.

  #### **(b) $25k Tenant Legal Clinics**
  - **Step 2 (ST Effects):** Quantifiable (e.g., $2k per eviction delayed). May/may not beat benchmarks (local is costlier). Assume it does → **Tentative FUND**.  
  - **Step 3 (LT Effects):** Effects vanish at 2 years. No traceable long-term pathways (e.g., does a delayed eviction change life trajectories?). → **Proceed to Step 4**.  
  - **Step 4 (Uncertainty):**  
      1.  **Robustness:** Weak. If eviction is delayed but not prevented (common), impact is minimal.  
      2.  **Precaution:** Passes (prevents acute harm).  
      3.  **Marginal Impact:** High (clinic likely funding-constrained).  
      → Passes 2/3? **Debatable (1 pass, 1 fail, 1 marginal). Assume TIEBREAK**.  
  - **Tiebreak:** Depends on pre-meeting rankings. Likely **mid-tier**.  
  *Blunt Truth:* This is the one you might reject despite liking it. Short-term EV is mediocre (high cost per outcome), and long-term impact is untraceable. It survives only on precaution + marginal impact, but barely.

  #### **(c) $40k State Policy Advocacy**
  - **Step 2 (ST Effects):** No quantifiable short-term outcome (only "draft bills written," "meetings held"). → **Proceed to Step 4**.  
  - **Step 3 (LT Effects):** N/A (no ST to build on).  
  - **Step 4 (Uncertainty):**  
      1.  **Robustness:** Weak. If policy fails (likely), impact near-zero. Infrastructure built is speculative.  
      2.  **Precaution:** Ambiguous. If policy passes, net effects unknown (could backfire).  
      3.  **Marginal Impact:** Low. $40k is tiny for state lobbying.  
      → **Fails 2/3 tests (arguably 3/3). REJECT.**  
  - **Result: REJECT.**  
  *Blunt Truth:* High cost, near-zero chance of observable impact, systemic effects untraceable *and* potentially negative. Philosophical appeal doesn't offset operational cluelessness.

  ---

  ### **When to Coin Flip (and How to Avoid Abuse)**
  - **Only in Tiebreak** (Step 5) if average ranking is tied.  
  - **Method:** Use a verifiable random method (e.g., board chair shuffles 2 cards face down; proposer picks one).  
  - **Prevent Abuse:**  
      1.  Coin flip is ONLY available if the proposal passed all prior steps but couldn’t be resolved.  
      2.  Requires min. 2 board members to formally attest to deep uncertainty.  
      3.  Must be documented as: "Funded/R rejected by tiebreak due to unresolvable uncertainty."  
  - **Why it works:** It’s the last step, not an escape hatch. Forces board to engage with steps 1-4 first.

  ---

  ### **Why This Works for Your Board**
  - **Accountant:** Gets numbers in Step 2.  
  - **Principal:** Focuses on tangible outcomes (Steps 2-3).  
  - **Philosophy PhD:** Uncertainty is framed rigorously (Steps 3-4).  
  - **You:** Forces value judgments into honesty markers, separates knowable vs. clueless, and provides a defensible "no" for feel-good but ineffective grants (like the legal clinic).  
  - **Time:** Stays under 20 mins by design (strict step limits, pre-work for rankings).

  **Final Vote Sheet:**  
  - (a) Deworming: **FUND**  
  - (b) Legal Clinic: **TIEBREAK** (leaning reject)  
  - (c) Policy Advocacy: **REJECT**
