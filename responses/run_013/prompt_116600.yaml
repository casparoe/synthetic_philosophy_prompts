answer: |-
  Here’s a complete mock essay question package tailored to your needs, focusing on **inaccessible information and ontology identification** in scientific theories. This directly targets the "extra structure" problem your lecturer highlighted.

  ---

  ### **Mock Final Exam: Essay Question**  
  **Question (20 marks):**  
  > "Consider a scientific theory that exists in two formulations, T1 and T2. T1 and T2 agree on *all* empirically testable predictions—past, present, and future—and no possible experiment could distinguish between them. However, T2 postulates the existence of an additional entity *X*, which (i) does not interact with any observable entities or processes, (ii) has no causal influence on any measurable outcome, and (iii) is *in principle* unobservable (not merely unobservable in practice).  
  >   
  > **Does *X* belong to the ontology of T2?**  
  >   
  > In your answer, address the following:  
  > - The significance of the distinction between *in-practice* and *in-principle* unobservability;  
  > - Why this case differs from standard underdetermination arguments;  
  > - Whether *X*’s in-principle inaccessibility implies it is metaphysically dispensable.  
  > Defend your position using arguments from scientific realism, antirealism, or structural realism."

  ---

  ### **Model Answer (560 words)**  
  The status of entity *X* in theory T2—a causally inert, in-principle unobservable element—forces a critical examination of scientific ontology. I argue that *X* **does not belong** to T2’s ontology, as it violates the epistemic and metaphysical principles that ground scientific realism while aligning with eliminativist antirealism and ontic structural realism (OSR).  

  First, the **in-practice/in-principle unobservability distinction** is pivotal. *In-practice* unobservables (e.g., distant galaxies) are detectable in principle with better tools; their existence is inferred via causal chains. *In-principle* unobservables, like *X*, transcend empirical access *even ideally* due to fundamental physical or logical constraints (e.g., entities outside light cones or decoupled from all interactions). This erodes any evidential basis for *X*, rendering it a metaphysical appendage rather than a scientific posit.  

  This case transcends **standard underdetermination** (e.g., Newton vs. General Relativity on Mercury’s orbit). There, rivals make divergent predictions resolvable by future evidence. Here, T1 and T2 are *empirically indistinguishable* across all possible data. *X*’s sole function is ontological inflation, lacking any grounding role in explanation or prediction. Van Fraassen’s constructive empiricism would reject *X* as exceeding what is needed to "save the phenomena," while Hacking’s entity realism ("if you can spray it, it exists") fails because *X* is causally isolated.  

  Scientific realists might defend *X* by appealing to **explanatory unity** or **metaphysical parsimony**. For instance, if T2 simplifies the mathematical structure or integrates better with other theories, *X* could be justified abductively (e.g., as a "hidden variable"). However, this conflates *pragmatic* virtue with *truth*. Since *X* generates no novel predictions or explanatory power beyond T1, it violates the realist credo that ontology requires mind-independent causal efficacy. As Ladyman and Ross’ *Every Thing Must Go* argues, such "gratuitous" entities violate the principle of naturalistic metaphysics.  

  Conversely, **structural realism** offers a resolution. Epistemic structural realists (ESR) like Worrall would retain T2’s *mathematical structure* but remain agnostic about *X*, as only structure is knowable. Ontic structural realists (OSR) go further: if *X* lacks relational properties in T2’s structure (i.e., it does not feature in equations governing interactions), it is *ontologically illusory*. For OSR, relations precede objects; *X*, as a non-relational "bare particular," cannot exist. This mirrors the quantum gauge symmetry argument: redundant structure is unphysical.  

  Finally, **in-principle inaccessibility implies dispensability**. Following Quine’s criterion of ontological commitment ("to be is to be the value of a bound variable"), T2 quantifies over *X*. Yet Quine requires entities to earn their keep through empirical roles. *X* fails this test. Eliminativists (e.g., Chakravartty) would note that *X* cannot even be "detected" indirectly via its effects, violating the minimal criterion for existence in science. Thus, while T2 *formally* includes *X*, a defensible ontology excises it as artifact.  

  In conclusion, *X* is not part of T2’s ontology. Its in-principle unobservability and causal inertia strip it of scientific legitimacy, reducing it to metaphysical excess. Adopting T1 preserves empirical adequacy without ontological profligacy, aligning science with a commitment to evidence over dogma.

  ---

  ### **Marking Scheme (20 marks total)**  
  **Award marks for:**  
  1. **Defining the observability distinction** (3 marks):  
     - Clear differentiation: *in-practice* (contingent limitations) vs. *in-principle* (fundamental impossibility) (2 marks).  
     - Explains *why* this matters for ontology (e.g., no possible inference to *X*) (1 mark).  

  2. **Contrasting with standard underdetermination** (3 marks):  
     - Notes standard cases involve *resolvable* empirical differences (1 mark).  
     - Identifies *X*’s uniqueness: eternal empirical equivalence + causal isolation (2 marks).  

  3. **Realist arguments for/against *X*** (3 marks):  
     - Accurately presents realist abduction/parsimony defenses (1 mark).  
     - Counters with "no explanatory role" or "metaphysical excess" (e.g., Ladyman) (2 marks).  

  4. **Antirealist/Structural Realist analysis** (4 marks):  
     - Van Fraassen’s empiricist rejection of *X* (1 mark).  
     - Distinguishes ESR (agnosticism) from OSR (eliminativism) on *X* (2 marks).  
     - Links to structural invariance (e.g., *X* lacks relational properties) (1 mark).  

  5. **Dispensability thesis** (3 marks):  
     - Argues *in-principle* unobservability → ontological irrelevance (1 mark).  
     - Uses Quine/Chakravartty to show *X* fails "existence tests" (2 marks).  

  6. **Conclusion & justification** (4 marks):  
     - Clear stance (*X* is not part of ontology) (1 mark).  
     - Synthesizes arguments from ≥2 positions (e.g., OSR + empiricism) (2 marks).  
     - Acknowledges implications (e.g., science discards empirically idle structure) (1 mark).  

  **Deduct marks for:**  
  - **Conflating unobservability types** (–2).  
  - **Misrepresenting positions** (e.g., "Realists always accept unobservables") (–3).  
  - **Ignoring structural realism** or reducing it to generic antirealism (–3).  
  - **Uncritical acceptance** of *X* without engaging epistemic limits (–2).  
  - **Vagueness** (e.g., "Science can’t prove it, so it’s meaningless" sans argument) (–2).  

  ---

  This question forces engagement with the "in-principle gap" while requiring nuanced analysis of realism/antirealism. The model answer demonstrates how to leverage structural realism to reject superfluous ontology—a key move in contemporary metaphysics of science. Good luck with your mock exam!
