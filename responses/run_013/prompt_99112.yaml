prompt: |-
  ok so FPTP and PR people always seem to argue past each other, and I think its because they don't just weight fairness differently, they assume different things about what a vote even is. the thing that got me: under FPTP a party with support spread evenly can pull a big vote share and almost no seats, while a party whose support is packed into one region can get a sliver of the vote and dozens of seats, and thats not a glitch, its the mechanism doing its job. so what I want is the theory of representation FPTP has to be presupposing for that to count as fine — give me exactly five presuppositions, one per numbered item, a sentence or two each, no intro or conclusion. something like: what a vote is a claim about (this seat, or the makeup of the chamber?), who the representative actually represents, what "fair" is supposed to be measuring, why the unit is geography rather than preference — plus whatever else is load-bearing. for each, say whether PR shares it, rejects it, or just weighs it differently, and flag the one presupposition FPTP can't actually cash out in practice.
reasoning: |-
  Okay, the user is diving deep into the FPTP vs PR debate, specifically about how they operate on fundamentally different assumptions about representation. They noticed that in FPTP, geographically concentrated parties can win more seats than dispersed ones with similar vote shares, and they want to unpack the theoretical presuppositions behind FPTP that make this acceptable. 

  The user’s request is very structured: exactly five presuppositions, each with a clear stance on whether PR shares, rejects, or weighs it differently, plus identifying which one FPTP fails to deliver in practice. They’re clearly frustrated by surface-level arguments and want the underlying philosophical machinery laid bare. 

  First, I need to isolate FPTP’s core axioms. The geographic concentration effect isn’t a bug to FPTP defenders—it’s the system working as intended. So what *is* that intention? I’ll start with the unit of representation: FPTP treats geography as the primary vessel for political will, not abstract preference blocs. PR flips this. Then, the purpose of a vote: FPTP sees it as choosing a local delegate, while PR treats it as shaping national policy direction. That’s two. 

  Next, fairness. FPTP measures fairness at the seat level—did the local winner get the most votes? PR cares about chamber proportionality. That’s three. Then, accountability: FPTP demands MPs be responsible to their district’s interests, not national party platforms. PR leans toward the latter. That’s four. 

  Finally, the "load-bearing" one FPTP can’t cash out: the claim that local accountability produces effective governance. In practice, FPTP often creates unresponsive legislatures where majority parties ignore minority interests, undermining its own premise. PR rejects this presupposition entirely. 

  The user’s sharp—they’ve pinpointed the epistemological clash at the heart of electoral reform debates. No fluff needed; they want the gears exposed. I’ll keep each point clinical, flagging divergences with PR as requested.
answer: |-
  Here are five presuppositions underlying FPTP representation theory:

  1.  **The fundamental unit of representation is geographically-defined local communities.** A vote is primarily a choice for a specific *local representative* accountable to a defined territorial constituency. FPTP presupposes that political interests and accountability are best organized around shared locality. PR rejects this, treating the electorate as a single national (or regional) preference pool where geography is secondary to overall vote share.

  2.  **A vote expresses a preference for *who* should locally govern, not a direct claim about the *national composition* of the legislature.** The vote's primary function is to select the individual MP for the constituency, not to mandate the overall partisan balance of power in parliament. FPTP presupposes that the national government emerges indirectly from the aggregate of local choices. PR explicitly presupposes that votes *are* claims about the desired partisan makeup of the national legislature.

  3.  **"Fairness" is measured by the legitimacy of *individual seat outcomes* (local majoritarianism), not the proportionality of *overall seat distribution* to national vote share.** Winning a seat by securing the most votes locally is the core fair outcome, regardless of whether a party's total votes nationally translate proportionally to seats. FPTP presupposes local majority/minority legitimacy defines fairness. PR presupposes fairness *is* overall vote-seat proportionality and rejects FPTP's localist measure.

  4.  **The representative's primary duty is to represent the *interests of their specific geographic constituency* above national party platforms or ideological blocs.** The MP is fundamentally a delegate for their locality's concerns. FPTP presupposes geographic accountability is paramount. PR weighs this differently or rejects it, presupposing representatives primarily embody national party platforms or ideological preferences shared across constituencies.

  5.  **Effective governance requires stable, single-party (or simple coalition) majorities formed by aggregating local mandates, prioritizing decisive government over mirroring diverse preferences.** FPTP presupposes its tendency to manufacture majorities from pluralities is a feature, ensuring governability, even if it means excluding geographically dispersed minorities from direct representation. **This is the presupposition FPTP struggles to cash out:** It assumes local majoritarianism inherently produces *nationally* effective and responsive governance, but it often results in legislatures where significant minority views are excluded and majorities face weak accountability ("elective dictatorships"), undermining the claimed link between local fairness and national effectiveness. PR explicitly rejects the necessity or desirability of manufactured majorities, presupposing diverse representation enhances legitimacy and policy responsiveness.
