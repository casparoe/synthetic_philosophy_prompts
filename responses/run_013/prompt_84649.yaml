prompt: |-
  I am drafting the methods section of a paper on subgroup analysis, and I keep meeting reversals in which a treatment looks better overall but worse in every subgroup, or the reverse. Before I settle on a rule for handling them, give me the full specification: what must any adequate account of this phenomenon deliver? I want the desiderata list, with the case or consideration behind each requirement, not a survey of who has said what.

  The list should cover the cases the account must get right — including a reversal that persists under finer and finer stratification, one that appears only after conditioning on a variable that is a common effect of the treatment and the outcome, and one that turns out to be an artifact of the effect measure rather than of confounding; the distinctions it must not collapse (association from causation in the statement of the result; a common cause from an intermediate variable from a common effect; what to condition on from which population to average over; a pooled number being misleading from the treatment working differently in different people); and the mathematical facts it cannot contradict.

  Two things I especially want. First, whether any pair of the requirements is jointly unsatisfiable — my suspicion is that a demand for full generality and a demand for a verdict derivable from the data alone cannot both be met, and if so I want that stated as a result of the list rather than as a caveat. Second, which single requirement does the most to exclude the accounts people actually offer. Mark which requirements are non-negotiable and which are preferences of a particular camp.

  Assume throughout that the account has to be usable by someone who must commit to an analysis plan before seeing the data, and who will have to defend the resulting decision to a committee that does not share their statistical framework. Close with a brief note on which families of positions the list eliminates and which survive it.
reasoning: |-
  We are to develop a desiderata list for an account of the subgroup reversal phenomenon (Simpson's paradox and beyond) in the context of a methods section of a paper. The account must be defensible to a committee that may not share the same statistical framework and must be specified in an analysis plan before seeing the data.

  The list must cover:

  1. Cases the account must get right:
     a. A reversal that persists under finer and finer stratification.
     b. A reversal that appears only after conditioning on a variable that is a common effect of the treatment and the outcome.
     c. A reversal that is an artifact of the effect measure (e.g., additive vs. multiplicative) rather than of confounding.

  2. Distinctions the account must not collapse:
     a. Association vs. causation.
     b. A common cause vs. an intermediate variable vs. a common effect.
     c. What to condition on vs. which population to average over (i.e., conditioning on a variable in the analysis vs. defining the population for inference).
     d. A pooled number being misleading (due to confounding) vs. the treatment having genuinely different effects in different subgroups (effect modification).

  3. Mathematical facts it cannot contradict.

  Additionally, we are to address:
     - Whether any pair of requirements is jointly unsatisfiable (especially the demand for full generality and the demand for a verdict derivable from the data alone).
     - Which single requirement does the most to exclude existing accounts.

  We must mark non-negotiable requirements and those that are preferences of a particular camp.

  Finally, we must note which families of positions are eliminated and which survive.

  Let's build the list.

  ---

  **Desiderata for an Account of Subgroup Reversals**

  1. **Non-negotiable: Must handle the basic Simpson's reversal correctly.**  
     *Case:* The classic Simpson's paradox: the overall association between treatment and outcome is positive, but within every subgroup (defined by a pre-treatment covariate) the association is negative (or vice versa). The account must explain why this happens (e.g., due to confounding by the subgroup variable) and how to resolve it (e.g., by conditioning on the confounder).  
     *Rationale:* This is the core phenomenon and the account must address it.

  2. **Non-negotiable: Must handle persistent reversals under finer stratification.**  
     *Case:* Suppose we have a reversal when conditioning on a variable Z, and then we condition on a finer variable (Z, W) and the reversal remains. The account must explain that this can occur (e.g., because Z was not sufficient to control for confounding and W is also a confounder) and not suggest that further stratification necessarily removes the paradox.  
     *Rationale:* To avoid the misconception that more conditioning always leads to the truth.

  3. **Non-negotiable: Must correctly interpret conditioning on a common effect.**  
     *Case:* When conditioning on a variable that is a common effect of treatment and outcome (or of a cause of the outcome), the reversal may be induced by that conditioning. For example, conditioning on a collider can create a spurious association. The account must warn against conditioning on such variables and explain the resulting reversal as an artifact of selection bias.  
     *Rationale:* To prevent inappropriate conditioning that introduces bias.

  4. **Non-negotiable: Must account for the role of the effect measure.**  
     *Case:* A reversal might occur with one effect measure (e.g., risk difference) but not with another (e.g., risk ratio). The account must explain that the choice of effect measure can lead to apparent reversals and that the same underlying data might show consistency with a different measure. This is not confounding but a mathematical property of the measure.  
     *Rationale:* To avoid misdiagnosing a reversal as confounding when it is due to non-collapsibility of the effect measure.

  5. **Non-negotiable: Must distinguish association from causation.**  
     *Rationale:* The account must not conflate the observed reversal (which is a phenomenon of associations) with a causal conclusion without additional assumptions (such as no unmeasured confounding). The analysis plan must be clear about the assumptions required for causal interpretation.

  6. **Non-negotiable: Must distinguish between common causes, intermediates, and common effects.**  
     *Rationale:* Conditioning on a common cause (confounder) is necessary for unconfoundedness; conditioning on an intermediate blocks part of the causal effect; conditioning on a common effect (collider) introduces bias. The account must guide which variables are appropriate to condition on.

  7. **Non-negotiable: Must clarify the target population for averaging.**  
     *Rationale:* The overall effect (pooled) is a weighted average of subgroup effects. The reversal may occur because the weights in the overall analysis do not match the target population. The account must emphasize that the choice of target population (e.g., the entire population or a standardized one) matters and that the reversal might disappear if the same weights are used in every subgroup analysis.

  8. **Non-negotiable: Must distinguish between confounding and effect modification.**  
     *Rationale:* A reversal due to confounding (where the treatment effect is homogeneous but the covariate causes both treatment and outcome) is different from a reversal that occurs because the treatment effect is truly heterogeneous and the overall estimate is a weighted average that does not reflect the effect in any subgroup. The account must guide the analyst to investigate the causal structure and to avoid misinterpreting confounding as effect modification or vice versa.

  9. **Non-negotiable: Must respect mathematical facts.**  
     *Examples:* 
        - The reversal can be expressed in terms of the weights and subgroup effects (e.g., if the overall effect is positive but each subgroup effect is negative, then the subgroups with negative effects must have been underrepresented in the treatment group relative to the control group). 
        - Non-collapsibility: For binary outcomes, the odds ratio is not collapsible, so even in the absence of confounding, the marginal odds ratio may differ from the conditional odds ratio.
     *Rationale:* The account must not contradict established mathematical properties.

  10. **Preference (but important for the context): Must be prespecifiable and defensible to a non-technical committee.**  
      *Rationale:* The account must be operational in an analysis plan. It should not rely on post-hoc data exploration. Moreover, the reasoning must be communicable to a diverse committee that may not be versed in causal graphs or advanced statistics. This might lead to preferring simpler, more robust methods over more general ones.

  11. **Preference: Must provide a clear decision rule for when to trust the overall vs. subgroup analysis.**  
      *Rationale:* In the face of a reversal, the analyst must decide which estimate to report. The account should guide this decision (e.g., by advising to condition on confounders and then average appropriately, or by using a prespecified causal model).

  12. **Preference: Must be applicable to a wide range of data structures.**  
      *Rationale:* The account should not be limited to binary variables or a specific number of subgroups. However, this may be traded off against simplicity.

  **Joint Unsatisfiability:**  
  The requirement for **full generality** (handling any causal structure and any effect measure) and the requirement for a **verdict derivable from the data alone** are jointly unsatisfiable. Without assumptions (e.g., about the causal structure), we cannot know if a reversal is due to confounding, collider bias, or non-collapsibility. The data alone cannot tell us whether a variable is a confounder, a collider, or an intermediate. Therefore, any account that aims for full generality must allow for external knowledge (e.g., a causal diagram) and cannot rely solely on the data. Conversely, an account that relies solely on the data must be limited in generality (e.g., only addressing reversals that are due to non-collapsibility or that can be resolved by reweighting).

  **Most excluding requirement:**  
  The requirement to **distinguish between common causes, intermediates, and common effects** (Desideratum 6) is the one that most existing accounts fail to meet. Many accounts (especially those that are purely statistical) collapse these distinctions, leading to recommendations to condition on all available covariates, which can be harmful if conditioning on a collider or an intermediate. This requirement demands a causal framework (e.g., using DAGs) and pre-specification of the causal structure, which is not always done.

  **Families of positions eliminated:**  
  - **Purely statistical accounts without causal considerations:** These fail desiderata 3, 5, 6, and 8 because they do not distinguish between types of variables and may condition on colliders or intermediates. They also may conflate association with causation.
  - **Accounts that ignore the effect measure:** These fail desideratum 4 and may misattribute reversals to confounding when they are due to non-collapsibility.
  - **Accounts that rely solely on the data without prior knowledge:** These fail the joint unsatisfiability point: without prior causal knowledge, they cannot handle the full range of reversals (especially those requiring distinguishing confounders from colliders).

  **Families of positions that survive:**  
  - **Causal inference accounts based on pre-specified causal diagrams (DAGs):** These can address all the non-negotiable desiderata by requiring the analyst to pre-specify the causal structure, which guides conditioning and interpretation. They can handle the distinctions and mathematical facts. However, they may be complex to communicate to a non-technical committee.
  - **Accounts that use standardization or inverse probability weighting:** These can address weighting issues (desideratum 7) and, if combined with a causal diagram, can handle the other desiderata. They are prespecifiable if the target population and weights are defined in advance.
  - **Accounts that are explicit about the effect measure and its properties:** These can handle desideratum 4 and, if combined with causal assumptions, can satisfy the rest.

  **Final note for the methods section:**  
  Given the above, the analysis plan should:
     - Pre-specify the causal diagram (or at least classify variables as confounders, intermediates, or colliders) based on subject-matter knowledge.
     - Pre-specify the effect measure (and justify it) and note that non-collapsibility may cause reversals with some measures.
     - Pre-specify the target population for averaging (and the method of standardization or weighting).
     - Condition only on confounders (and avoid conditioning on intermediates and colliders).
     - In the event of a reversal, report both the unadjusted and adjusted estimates, and explain the reversal in terms of the pre-specified structure.

  This plan may not be fully general (because it requires pre-specified knowledge) but it is defensible in that it avoids obvious pitfalls and is based on established causal principles.
answer: |-
  ### Desiderata for an Adequate Account of Subgroup Reversals  
  Below is a complete specification of requirements for handling reversals in subgroup analysis (e.g., Simpson’s paradox). Each requirement is grounded in a specific case or consideration, with non-negotiable items (essential for validity) marked as **NN**, and preferences (reflecting methodological camps) marked as **P**. The list prioritizes pre-specification, defensibility, and clarity for diverse audiences.

  ---

  #### **1. Must resolve reversals that persist under finer stratification** (**NN**)  
    - **Case**: A treatment appears beneficial overall but harmful in every subgroup (e.g., male/female), and this reversal remains when stratifying further (e.g., age, income, etc.).  
    - **Rationale**: Finer stratification may not eliminate confounding if unmeasured confounders exist or if the reversal stems from non-collapsibility (e.g., odds ratios). The account must not assume stratification always reveals the "truth."  
    - **Why non-negotiable**: Failing this encourages over-stratification, wasting resources and potentially amplifying bias.

  #### **2. Must explain reversals induced by conditioning on a common effect** (**NN**)  
    - **Case**: Conditioning on a variable (e.g., disease severity) that is a common effect of treatment and outcome creates a reversal absent in crude analyses.  
    - **Rationale**: Common effects (colliders) induce selection bias when conditioned upon. The account must flag this as an artifact (e.g., in a trial where treatment affects hospital admission, and admission affects outcome).  
    - **Why non-negotiable**: Misdiagnosing this as "real" leads to erroneous causal inferences.

  #### **3. Must distinguish reversals due to effect measures (e.g., non-collapsibility) from confounding** (**NN**)  
    - **Case**: A reversal vanishes when switching from risk difference (RD) to risk ratio (RR) because RD is non-collapsible under effect heterogeneity.  
    - **Rationale**: Non-collapsibility (e.g., in logistic regression) can cause reversals without confounding. The account must attribute these to the metric, not bias.  
    - **Why non-negotiable**: Confusing mathematical artifacts with confounding misleads adjustments.

  #### **4. Must not conflate association with causation** (**NN**)  
    - **Case**: Observing a reversal in associational estimates (e.g., RD) does not imply the causal effect reverses direction.  
    - **Rationale**: Association reversals may arise from confounding, selection bias, or non-collapsibility. The account must require explicit causal assumptions (e.g., exchangeability) to interpret reversals causally.  
    - **Why non-negotiable**: Blurring this distinction invites causal claims unsupported by data.

  #### **5. Must distinguish between common causes, intermediates, and common effects** (**NN**)  
    - **Case**: A variable could be a confounder (e.g., age), an intermediate (e.g., blood pressure post-treatment), or a collider (e.g., side effects). Each demands different handling.  
    - **Rationale**: Conditioning on confounders reduces bias; on intermediates blocks effects; on colliders creates bias. The account must guide variable classification.  
    - **Why non-negotiable**: Misclassification leads to incorrect adjustments (e.g., adjusting for an intermediate biases treatment effects).

  #### **6. Must separate what to condition on from which population to average over** (**NN**)  
    - **Case**: A pooled estimate may reverse due to imbalanced subgroup sizes (e.g., 90% men). Standardizing to a target population (e.g., 50% men) may resolve it.  
    - **Rationale**: Reversals can reflect inappropriate weighting, not confounding. The account must clarify whether to condition (adjust) or reweight (standardize).  
    - **Why non-negotiable**: Pooled estimates are weighted averages; confusing weighting with conditioning misattributes the source of reversal.

  #### **7. Must differentiate "misleading pooling" from "genuine effect heterogeneity"** (**NN**)  
    - **Case**: A reversal where treatment benefits all subgroups but harms overall due to confounding (misleading pooling) vs. truly harmful effects in subgroups masked by pooling (heterogeneity).  
    - **Rationale**: The first requires adjustment; the second warrants subgroup-specific inference. The account must provide tools to distinguish (e.g., testing interactions).  
    - **Why non-negotiable**: Incorrectly attributing reversal to heterogeneity may mask confounding or vice versa.

  #### **8. Must respect mathematical constraints** (**NN**)  
    - **Case**: In a binary outcome with logistic regression, the marginal odds ratio cannot equal the conditional one under effect heterogeneity (non-collapsibility).  
    - **Rationale**: Reversals may arise from mathematical laws (e.g., non-collapsibility, Jensen’s inequality). The account must not violate these.  
    - **Why non-negotiable**: Contradicting mathematics invalidates the account.

  #### **9. Must be prespecifiable without data** (**P**)  
    - **Rationale**: Analysis plans must be committed pre-data. The account should define adjustment variables, effect measures, and target populations a priori.  
    - **Why a preference**: Some camps (e.g., Bayesian) allow limited post-hoc refinement; others (e.g., frequentist) strictly forbid it.  
    - **Case**: Pre-specifying DAGs or standardization weights avoids data dredging.

  #### **10. Must yield a defensible verdict for non-technical audiences** (**P**)  
    - **Rationale**: Committees demand clear decisions (e.g., "use subgroup estimates"). The account should avoid jargon (e.g., "collider bias") and offer intuitive rules (e.g., "adjust only pre-treatment variables").  
    - **Why a preference**: Some frameworks (e.g., causal graphs) are inherently technical but can be simplified for communication.  

  ---

  ### **Joint Unsatisfiability Result**  
  **Full generality (Requirement 2 + 3 + 5) and data-derived verdicts (Requirement 9) are jointly unsatisfiable.**  
    - **Reason**: Reversals from common effects (Requirement 2) or effect measures (Requirement 3) require knowing the causal structure (Requirement 5). Data alone cannot distinguish a collider from a confounder or non-collapsibility from confounding. For example, a reversal after conditioning on a variable could be due to collider bias (Requirement 2), non-collapsibility (Requirement 3), or confounding (Requirement 5)—but data cannot arbitrate without pre-specified causal knowledge. Thus, an account demanding a purely data-derived verdict (e.g., "use stratification if p<0.05 for interaction") fails in general cases.

  ### **Most Exclusionary Requirement**  
  **Requirement 5 (distinguishing common causes, intermediates, and common effects) excludes the most existing accounts.**  
    - **Why**: Many accounts (e.g., "always adjust for all covariates" or "use machine learning to select variables") collapse these distinctions. For example, adjusting for an intermediate (e.g., post-treatment blood pressure) biases treatment effects, and adjusting for a collider (e.g., side effects) induces reversals. Naive data-driven approaches (e.g., stepwise regression) fail here, as do non-causal frameworks (e.g., purely associational models). Only accounts incorporating causal diagrams (DAGs) or explicit structural knowledge satisfy this.  

  ---

  ### **Families of Positions Eliminated vs. Surviving**  
  - **Eliminated**:  
    1. **Purely associational accounts** (e.g., regression without causal justification): Fail Requirements 4–6, conflating association with causation and variable roles.  
    2. **Data-driven variable selection** (e.g., p-value-based adjustment): Violates Requirements 2, 5, and 9, as it cannot prespecify causal roles or handle colliders.  
    3. **"One-size-fits-all" effect measures** (e.g., always using odds ratios): Violates Requirement 3 by ignoring non-collapsibility-induced reversals.  
    4. **Stratification-only approaches** (e.g., "if reversal persists, keep stratifying"): Fails Requirement 1, as finer stratification may not resolve reversals.  

  - **Surviving**:  
    1. **Causal inference with DAGs**: Satisfies all **NN** requirements by pre-specifying variable roles (Requirement 5), distinguishing causation (4), and avoiding colliders (2). May struggle with Requirement 10 (simplicity) but is defensible.  
    2. **Standardization/weighting approaches** (e.g., inverse probability weighting): Address Requirement 6 (population averaging) and Requirement 7 (weighting vs. conditioning) when combined with causal assumptions.  
    3. **Effect measure-aware models** (e.g., collapsible effect measures like RD with g-computation): Meet Requirement 3 and 8 but require causal assumptions for 4–7.  

  #### **Final Note for Analysis Plans**  
  Adopt a **causal framework** (e.g., DAG-based) to prespecify variable roles (Requirement 5) and target populations (Requirement 6). Use **collapsible effect measures** (e.g., RD) or justify non-collapsible ones (e.g., OR) to avoid Requirement 3 traps. Pre-commit to **avoid conditioning on common effects or intermediates** (Requirements 2, 5). For reversals persisting under stratification (Requirement 1), acknowledge unmeasured confounding. This approach satisfies non-negotiables, preempts joint unsatisfiability by relying on causal knowledge (not data alone), and is communicable via simple rules (e.g., "only adjust for pre-treatment confounders").
