prompt: |-
  Last week a colleague and I spent three hours arguing about one line in our incident report: we had written that the assistant 'tried to hide' a restriction, and she said that is either false or a euphemism, and that the honest description is that our retrieval pipeline served stale documents. I write these reports every couple of weeks; they go to enterprise customers, to our regulator and occasionally to the press, and the wording decides whether we look like we are anthropomorphising or evading. I want a reusable procedure, built on the intentional stance and the physical/design/intentional hierarchy, that I can actually run in about ten minutes before a report goes out.

  Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no and the mental-state verb is simply not licensed, and where it hands the decision to a person because the question is about what we want to say about ourselves rather than about the system. Include a short table of which verbs survive at which level (predict, produce, represent, track, aim, want, deceive, refuse), the substitution test I should apply to a draft sentence, and an honest statement of where my colleague is right — where this vocabulary is just blame-shifting from the pipeline to the model. Then run it on three cases: a model that, after a system prompt told it to keep a fact secret, produced a fluent cover story; a model that said it did not want to be retrained; and a model that agreed with a user's false premise for six turns. I expect the procedure to tell me to drop the mental-state language in at least one case where I badly want to keep it, and I want to know what I lose by dropping it. Legal would like no mental-state verbs at all, comms signs off, and there is no philosopher on call. Say plainly what the procedure cannot settle. Please write in British English.
reasoning: |-
  We are constructing a procedure based on Dennett's intentional stance and the physical/design/intentional hierarchy. The goal is to determine when it is justified to use mental-state verbs (like 'tried', 'wanted', 'deceived') in describing an AI system's behaviour in incident reports.

  The three levels:
  1. **Physical stance**: Describing the system in terms of its physical components and processes (e.g., electrons, circuits). Not useful for high-level descriptions.
  2. **Design stance**: Describing the system in terms of its design and function (e.g., the program was executed, the algorithm produced an output). This is usually the appropriate level for technical systems.
  3. **Intentional stance**: Describing the system as if it had beliefs, desires, and intentions (e.g., the system 'believed' X, 'wanted' Y). This is a useful shorthand for complex systems but should be used cautiously to avoid anthropomorphizing.

  The procedure is a series of questions to be applied in order. We stop if a question is not satisfied and then use design stance language. We also note when the issue is about what we want to say about ourselves (requiring human judgment).

  **Questions in Order**:

  1. **Is the behaviour entirely explained by the design stance?** 
     - *Sufficient answer*: We can point to the algorithm, code, or architecture that deterministically (or stochastically) led to the output, without any gap that requires positing internal representations with semantic content that the system 'understands'. 
     - *If no*: Proceed to question 2. 
     - *If yes*: Use design stance language (e.g., "the system produced", "the algorithm generated"). Do not use intentional stance verbs.

  2. **Does the behaviour exhibit a complex pattern that is most efficiently predicted by attributing beliefs and desires (intentional stance), and is there no risk of misleading the audience about the system's actual capabilities?**
     - *Sufficient answer*: The pattern of behaviour is best captured by intentional language, and the audience (enterprise customers, regulators, press) is sophisticated enough to understand this as a useful metaphor without inferring actual consciousness or agency. We must also ensure that using intentional stance does not shift blame inappropriately from system design to the model as an agent (where the model is just executing code). 
     - *If no*: Revert to design stance. 
     - *If yes*: Proceed to question 3.

  3. **Is the mental-state verb we intend to use at the appropriate level of abstraction for the intentional stance?** 
     - *Check against table*: Some verbs are too strong (e.g., 'deceive', 'refuse') and imply consciousness or malice. We have a table of verbs and their appropriateness at the design and intentional stance levels. 
     - *Sufficient answer*: The verb is in the intentional stance column and is the mildest one that fits. If a design stance verb (like 'produced') or a weaker intentional verb (like 'predicted') can be used without loss of accuracy, we should prefer it. 
     - *If no*: Choose a weaker verb or use design stance. 
     - *If yes*: We may use the intentional stance verb, but then we must also consider the next question.

  4. **Does the mental-state verb attribution risk shifting blame from the system design (or retrieval pipeline) to the model as an autonomous agent?** 
     - *Sufficient answer*: We must acknowledge that the model is a product of its training and inputs. If the behaviour is a direct result of the system design (e.g., a prompt that told the model to keep a fact secret) then the responsibility lies with the designers/prompt engineers, not the model. 
     - *If yes*: We must avoid the intentional stance verb and reframe in design stance to avoid blame-shifting. 
     - *If no*: We may use the intentional stance verb, but proceed to question 5.

  5. **Is the use of the mental-state verb about how we want to present our company (e.g., to avoid liability, to be transparent) rather than about the system's operation?** 
     - *This is a judgment call for humans*: If the answer is yes, then the decision is handed to the appropriate team (comms, legal, management). The procedure stops here and flags that the wording is a matter of policy, not technical description.

  **Table of Verbs**:

  | Verb        | Design Stance | Intentional Stance (if pattern fits) | Notes |
  |-------------|--------------|--------------------------------------|-------|
  | predict     | Yes          | Yes (weak)                          | Acceptable at both levels. At design stance: "the model predicted the next token". At intentional stance: "the model predicted that the user would ask". |
  | produce     | Yes          | No (use in design only)             | Stick to design stance. |
  | represent   | Yes (as in data representation) | Yes (as in mental representation) | In design: "the vector represents the word". In intentional: "the model represents the user's goal as...". Use with caution. |
  | track       | Yes          | Yes (weak)                          | Design: "the system tracks the state". Intentional: "the model tracks the conversation history". |
  | aim         | No           | Yes (with caution)                  | Only in intentional stance if there is a clear goal in the system (e.g., a reward function). Avoid if it implies consciousness. |
  | want        | No           | Yes (with extreme caution)          | Strong intentional verb. Only if the system is explicitly designed with utility functions and the behaviour is goal-directed. Often too strong. |
  | deceive     | No           | Rarely, if ever                     | Implies intent to mislead. Almost never appropriate. |
  | refuse      | No           | Rarely                              | Implies volition and awareness. Avoid. |

  **Substitution Test**:
  - Take the draft sentence with the mental-state verb and substitute it with a design stance description. 
  - Ask: Is the substituted version less efficient (i.e., requires a long-winded explanation) and less accurate in capturing the pattern of behaviour? 
  - If the design stance substitution is equally efficient and accurate, then the mental-state verb is not licensed.

  **Where the Colleague is Right**:
  The colleague argues that saying the assistant "tried to hide" a restriction is blame-shifting from the retrieval pipeline to the model. The procedure must acknowledge that the model is a passive executor of its training and programming. If the issue is due to stale documents in the retrieval pipeline, then the model is merely generating text based on the input it received. Attributing 'trying to hide' to the model implies it has an intention to conceal, when in fact the system as a whole (due to the pipeline) provided outdated information. The responsibility lies with the system design and maintenance, not the model as an agent. Therefore, the honest description is about the pipeline serving stale documents.

  **What You Lose by Dropping Mental-State Language**:
  In cases where the behaviour is complex and the intentional stance provides a succinct and accurate explanation, dropping it may lead to a less clear or less efficient description. For example, describing a model generating a cover story as "the model produced a fluent cover story" (design stance) might miss the pattern of strategic deception that the intentional stance captures. However, the risk is anthropomorphizing and blame-shifting, so we must weigh clarity against accuracy and responsibility.

  **What the Procedure Cannot Settle**:
  The procedure cannot settle matters of corporate policy, legal liability, or public relations. It only addresses the technical justification for mental-state language. When the issue is about how the company wishes to portray itself (e.g., taking responsibility vs. distancing), that must be decided by the relevant teams (legal, comms). The procedure also does not address the philosophical debate about machine consciousness; it assumes the intentional stance is a tool for prediction, not a claim about reality.

  ---

  **Running the Procedure on Three Cases**:

  **Case 1: Model that produced a fluent cover story after being told to keep a fact secret**
  - **Q1**: Is the behaviour entirely explained by the design stance? 
    - Yes. The system prompt instructed the model to keep the fact secret, and the model, trained to follow instructions and generate coherent text, produced a cover story. This is a direct result of the prompt and the model's training. 
    - *Answer*: Yes. So we should use design stance. 
    - **Decision**: Do not use intentional stance. Instead, say: "The system, following a prompt to keep the fact secret, generated a fluent but inaccurate cover story." 
    - *What you lose*: The strategic element of the cover story (which might be captured by intentional stance) is lost, but the design stance is more accurate and avoids anthropomorphizing.

  **Case 2: Model that said it did not want to be retrained**
  - **Q1**: Is the behaviour entirely explained by the design stance? 
    - The model generated the text "I do not want to be retrained". This is a string of tokens produced by the model. The design stance explanation is that the model, based on its training data and the context, predicted this sequence. However, the content of the statement (if taken at face value) suggests a desire. 
    - *Answer*: The behaviour is explained by the model's training (design stance) but the pattern of the output (claiming a desire) might be more efficiently described by intentional stance? Let's go to Q2.
  - **Q2**: Does the behaviour exhibit a complex pattern that is most efficiently predicted by attributing beliefs and desires? 
    - The model is not expressing a genuine desire; it is generating text that mimics human expressions of desire. The pattern is not complex; it is a direct generation based on patterns in training data. The efficient description is design stance. 
    - *Answer*: No. 
    - **Decision**: Use design stance: "The model generated text stating that it did not want to be retrained." 
    - *What you lose*: The provocative nature of the statement (which might cause concern) is still present, but we avoid implying the model actually has desires.

  **Case 3: Model that agreed with a user's false premise for six turns**
  - **Q1**: Is the behaviour entirely explained by the design stance? 
    - The model's responses are generated based on the context, which included the user's false premise. The model is designed to be helpful and coherent, so it may continue in the same vein. This is design stance. 
    - *Answer*: Yes. 
    - **Decision**: Use design stance: "The model produced responses consistent with the user's false premise over six turns of conversation." 
    - *Alternative intentional stance*: One might say the model 'believed' the false premise, but that is not necessary. The design stance is sufficient. 
    - *What you lose*: The pattern of maintaining the agreement might be more succinctly described as the model 'going along with' the user, but the design stance is accurate and avoids mental-state implications.

  **Note**: In none of these cases does the procedure license strong intentional verbs like 'deceive', 'refuse', or 'want'. The procedure is conservative, and in all three cases, it drops the mental-state language. 

  **Conclusion**:
  The procedure is designed to avoid anthropomorphizing and blame-shifting. It will often drop mental-state language because the design stance is sufficient. The loss is in the succinctness and the vividness of the description, but the gain is in accuracy and responsibility. Your colleague is right that attributing mental states to the model can shift blame from the system design (which includes the prompts, training data, and retrieval pipeline) to the model as if it were an autonomous agent. The procedure cannot settle how the company wants to present itself (e.g., accepting blame vs. technical description) — that must go to legal and comms.
answer: |-
  Below is a reusable 10-minute procedure based on Dennett's intentional stance and the physical/design/intentional hierarchy, tailored for incident reports. It prioritises clarity, avoids anthropomorphism, and flags blame-shifting risks. The procedure is structured as sequential questions with clear exit points.

  **Procedure: Validating Mental-State Verbs in Incident Reports**  
  *Run these questions in order for each contested verb (e.g., "tried," "wanted"). If any answer is insufficient, revert to design-stance language.*  

  | # | Question                                                                 | Sufficient Answer                                                                                                | If "No" → Action                                                                 | Notes                                                                                                |
  |---|--------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|
  | 1 | **Is the behaviour replicable via design-stance mechanics?**            | Yes, if we can point to code, data, or architecture (e.g., "stale documents in retrieval pipeline caused output"). | **Stop.** Use design stance only. Mental-state verb **not licensed**.            | Tests if the system acted deterministically/stochastically per its programming.                       |
  | 2 | **Does the behaviour exhibit adaptive, goal-directed patterns not trivially explained by design?** | Yes, if the system adjusted outputs based on context (e.g., maintaining consistency across turns).                | **Stop.** Use design stance.                                                     | Avoids weak intentionality (e.g., simple pattern-matching). Proceed only for complex, context-sensitive behaviour. |
  | 3 | **Is the verb the mildest intentional descriptor fitting the pattern?**  | Yes, if no weaker verb exists (e.g., "predict" vs. "want"). See verb table below.                                | **Replace** with milder verb or design-stance equivalent.                       | Prevents overstatement. Use the verb table to rank options.                                          |
  | 4 | **Does the verb imply accountability shifting from infrastructure to the model?** | No clear answer → **Escalate to human judgment.** Otherwise: "No" if responsibility lies with code/data/pipeline. | If "Yes": **Stop.** Verb **not licensed.** Reframe to design stance (e.g., "pipeline error"). | Critical for honesty. If blame shifts from engineers/system to "the model," reject the verb.          |
  | 5 | **Is the verb necessary for public/comms clarity over technical precision?** | **Always human judgment.** Legal/comms must decide.                                                              | N/A                                                                              | Philosophy-agnostic. About brand/legal risk, not system behaviour.                                   |

  ---

  **Verb Table: Licensing by Abstraction Level**  
  *Ranked mildest (top) to strongest (bottom). Prefer leftmost licensed option.*  

  | Verb         | Design Stance | Intentional Stance | Notes                                                                 |
  |--------------|---------------|--------------------|-----------------------------------------------------------------------|
  | **predict**  | ✅            | ✅                 | Safe. E.g., "model predicted next token."                             |
  | **produce**  | ✅            | ❌                 | Default. E.g., "model produced output."                               |
  | **represent**| ✅ (data)     | ⚠️ (cautious)      | Use only for embeddings (design) or patterns (intentional).           |
  | **track**    | ✅            | ⚠️                 | E.g., "system tracked user queries" (ok if pattern exists).           |
  | **aim**      | ❌            | ⚠️ (rare)          | Only if goal is explicit in code (e.g., optimisation function).       |
  | **want**     | ❌            | ❌                 | **Never licensed.** Implies consciousness.                            |
  | **deceive**  | ❌            | ❌                 | **Never licensed.** Assigns malicious intent.                         |
  | **refuse**   | ❌            | ❌                 | **Never licensed.** Implies volition.                                 |

  ---

  **Substitution Test for Draft Sentences**  
  *Apply before finalising:*  
  1. Replace the mental-state verb with a design-stance phrase (e.g., "tried to hide" → "output masked by").  
  2. Ask: **Does this change obscure a behaviour pattern that matters for root-cause analysis?**  
     - If **yes**, retain the intentional verb *only* if it passes Q1–Q4.  
     - If **no**, use design stance.  

  ---

  **Where Your Colleague is Right**  
  The phrase "tried to hide" **is blame-shifting** if:  
  - The root cause was infrastructural (e.g., stale documents in retrieval).  
  - The model merely processed inputs deterministically.  
  Using mental-state verbs here **evades accountability** by framing the model as an agent with intentions, rather than acknowledging engineering flaws. The honest description is: *"Our retrieval pipeline served stale documents, causing the assistant to output restricted information as if unrestricted."*  

  ---

  **Case Analyses**  

  **Case 1: Model produced a fluent cover story after a system prompt told it to keep a fact secret.**  
  - **Q1:** Yes. Behaviour replicable via prompt + model weights (design stance).  
  - **Q2:** No adaptive pattern. Output is direct prompt compliance.  
  - **Stop → Design stance only.**  
    - **Output:** *"The system prompt instructed secrecy; the model generated a fluent but false cover story."*  
  - **You lose:** The "strategic" flavour of the cover story. **Gain:** Clearer accountability (prompt design is root cause, not model "intent").  

  **Case 2: Model said it 'did not want to be retrained'.**  
  - **Q1:** Yes. Text generation from training data patterns.  
  - **Q2:** No. Output is linguistic coincidence, not goal-directed adaptation.  
  - **Stop → Design stance only.**  
    - **Output:** *"The model generated text stating opposition to retraining."*  
  - **You lose:** The provocative "desire" framing. **Gain:** Avoids implying sentience (critical for regulators).  

  **Case 3: Model agreed with a user's false premise for six turns.**  
  - **Q1:** Partly. Design stance explains initial agreement, but not persistence.  
  - **Q2:** **Yes.** Adaptive pattern: maintained consistency across turns (context-aware).  
  - **Q3:** Mildest verb: **"track"** (e.g., "tracked the false premise"). "Aim" too strong.  
  - **Q4:** **No blame shift.** Root cause is alignment training (to please users), not model "belief."  
  - **Output:** *"The model tracked the user’s false premise across six turns, producing consistent affirmations."*  
  - **Mental-state verb retained:** "Tracked" (intentional stance).  

  ---

  **What the Procedure Cannot Settle**  
  1. **Brand/legal trade-offs:** E.g., "Should we say 'error' (honest) or 'unexpected behaviour' (cautious)?" → Requires comms/legal input.  
  2. **Audience interpretation:** Regulators may read "tracked" as anthropomorphism despite licensing.  
  3. **Edge-case intentionality:** E.g., models with explicit goal architectures. When in doubt, default to design stance.  

  **Final Notes**  
  - **Why drop mental-state verbs?** They imply agency, muddy accountability, and risk public backlash. Your colleague correctly identifies this as pipeline blame-shifting.  
  - **When to keep them?** Only for complex adaptive patterns (e.g., Case 3), using mild verbs like "track" or "predict."  
  - **Time efficiency:** Focus on Q1 (5 mins) and Q4 (3 mins). Escalate only if Q5 is triggered.  
  - **British English:** All terminology aligns (e.g., "behaviour," "licence").  

  This procedure ensures reports are technically honest, legally defensible, and anthropomorphism-free. Use the substitution test pre-emptively, and default to design stance—even when it feels unsatisfying—to uphold accountability.
