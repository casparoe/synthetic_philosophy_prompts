answer: |-
  Here’s a decision tree designed to map the logical space of refugee ethics, structured around pivotal questions rather than pre-defined positions. It prioritizes conceptual joints and forces trade-offs, with 7 branch nodes and 9 leaves.

  ---

  ### **The Tree**  
  *(Branching Questions)*  

  1.  **Is turning away a displaced person primarily a failure of *rescue* (preventing harm) or a *violation of justice* (denying a claim-right)?**  
      - *Rescue →* **Q2**  
      - *Justice →* **Q3**  
      - *Neither: "Refugee" is a contingent/arbitrary category →* **Leaf A: Extensionist**  

  2.  **Does any state have a *right to exclude* migrants?**  
      - *No →* **Leaf B: Open Borders**  
      - *Yes →* **Q4**  

  3.  **Does any state have a *right to exclude* migrants?**  
      - *No →* **Leaf B: Open Borders**  
      - *Yes →* **Q5**  

  4.  **Who bears the primary duty?**  
      - *Nearest safe state →* **Q6**  
      - *Richest/most capable →* **Leaf C: Global Sufficientarian Rescue**  
      - *Causally responsible state(s) →* **Leaf D: Causal/Reparative View**  

  5.  **What is the *scope* of the claim?**  
      - *Permanent admission →* **Q7**  
      - *Temporary protection →* **Leaf E: Temporary Protection**  

  6.  **Is protection owed *permanently* or *temporarily*?**  
      - *Permanently →* **Leaf F: Modified Non-Refoulement Plus**  
      - *Temporarily →* **Leaf G: Regional Safe Haven**  

  7.  **What *grounds* the duty?**  
      - *Universal principle →* **Leaf H: Cosmopolitan Admission**  
      - *Associative obligations →* **Leaf I: Liberal-Nationalist Compromise**  

  ---

  ### **Leaf Notes**  
  *(Position + Most Awkward Commitment)*  

  - **A: Extensionist**  
    *Awkward: Must deny that persecution/forced migration is distinct from voluntary movement, risking neglect of acute vulnerabilities.*  
  - **B: Open Borders**  
    *Awkward: Implies a state cannot prioritize its own poor if migrants are needier, demanding radical wealth redistribution.*  
  - **C: Global Sufficientarian Rescue**  
    *Awkward: May require relocating refugees far from home/culture to wealthy states with no historical ties.*  
  - **D: Causal/Reparative View**  
    *Awkward: Lets "innocent" states (e.g., uninvolved democracies) off the hook entirely, even if proximate/wealthy.*  
  - **E: Temporary Protection**  
    *Awkward: Justifies returning people to unstable states once "temporary" danger passes, ignoring root causes.*  
  - **F: Modified Non-Refoulement Plus**  
    *Awkward: Burdens frontline states (often poorer) with permanent integration, exacerbating global inequity.*  
  - **G: Regional Safe Haven**  
    *Awkward: Traps refugees in unstable regions with limited rights, perpetuating "containment".*  
  - **H: Cosmopolitan Admission**  
    *Awkward: Demands states relinquish cultural/demographic continuity to fulfill global duties.*  
  - **I: Liberal-Nationalist Compromise**  
    *Awkward: Must defend why cultural continuity outweighs lifesaving claims of non-members.*  

  ---

  ### **Empty Cells**  
  *(Unoccupied Combinations + Diagnosis)*  

  1.  **Justice + State may exclude + Temporary Protection** (*Q5→E*):  
      *Diagnosis: **Logically strained**. If refugees have *justice claims*, temporariness undermines the right to rebuild lives; this conflates rescue logic. Rarely defended.*  
  2.  **Rescue + State may exclude + Causally Responsible** (*Q4→D*):  
      *Diagnosis: **Coherent but unstable**. Reparations are justice-based; pairing with rescue is redundant. Defenders usually collapse into justice (e.g., reparative justice theorists).*  
  3.  **Rescue + State may exclude + Global Allocation** (*Q4→C*):  
      *Diagnosis: **Unexplored**. Technically coherent ("efficient rescue"), but no major theorists combine rescue with rejecting proximity in favor of pure capacity.*  

  ---

  ### **Can’t Be Separated**  
  *(Conflated Positions + Needed Question)*  

  1.  **Cosmopolitan Admission (H) vs. Open Borders (B):**  
      *The tree conflates them at Q3 (Justice + No Right to Exclude).*  
      *Split with: **"Does the justice claim require *unconditional* entry or only *asylum from persecution*?"***  
      - *Unconditional → Open Borders*  
      - *Asylum-specific → Cosmopolitan Admission*  

  2.  **Causal/Reparative View (D) vs. Liberal-Nationalist (I):**  
      *The tree doesn’t distinguish associative vs. causal duties.*  
      *Split with: **"Is the duty grounded in *membership/citizenship* or *causal responsibility*?"***  
      - *Causal responsibility → Reparative View*  
      - *Associative obligation → Liberal-Nationalist*  

  ---

  ### **Key Pedagogical Features**  
  - **Starts neutrally**: Forces students to confront rescue/justice before knowing their position.  
  - **Exposes trade-offs**: Every leaf has an "awkward commitment" revealing costs.  
  - **Handles "non-standard" views**: Extensionist (A) and Temporary Protection (E) emerge early.  
  - **Avoids conflation notes**: "Can’t Be Separated" section clarifies where the tree oversimplifies.  
  - **Manages complexity**: 7 questions → 9 positions, fitting in working memory.  

  This tree should provoke debate by showing how core commitments cascade into controversial conclusions—and where the map has blank spaces awaiting new arguments.
