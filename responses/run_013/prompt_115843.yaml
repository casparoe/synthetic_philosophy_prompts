  Here are eight sharply focused questions designed to push beyond restatement, incorporating your angles, the 3x3 example, and the call for foundational probing. I've anticipated her core replies and crafted follow-ups accordingly.

  **Anticipated Core Replies & Soft Spots:**
  1.  **On Never Best Response vs. Mixed Dominance:** *Likely Reply:* "A strategy never being a best response might rely on arbitrary or unnatural beliefs. Pure dominance relies only on direct, payoff-comparable actions. I'm not 'giving up' anything real, just avoiding spurious eliminations based on hypotheticals." *Soft Spot:* Does this view imply admissible strategies aren't irrational? Does it predict behaviour that *is* dominated under plausible (even if non-equilibrium) beliefs?
  2.  **On Order-Independence of Strict Dominance:** *Likely Reply:* "Order-independence is crucial! It means the set is well-defined regardless of how players 'reason'. Weak dominance depends on the path, making the outcome sensitive to arbitrary reasoning steps – that's not robust." *Soft Spot:* Is this valuing mathematical convenience over capturing actual rational deliberation? Does pure strict dominance *overfit* by requiring such strong conditions?
  3.  **On Epistemic Foundations for Iteration:** *Likely Reply:* "Common knowledge of rationality (CKR) gets you the first round. For further rounds, you need common belief in rationality *and* common belief that no dominated strategies are played *at all* – effectively, you need common belief that the game has *already* been solved up to that point, which is circular or requires an unnatural 'trembling hand' type justification." *Soft Spot:* If iteration requires such strong assumptions, is her pure-only procedure also vulnerable? What *does* license even two rounds in her view?
  4.  **On Mixtures as Ignorance:** *Likely Reply:* "Exactly! Mixed strategies represent *your* uncertainty about *my* pure choice. When *I* eliminate, I use pure comparisons based on what *you* might actually *do* (pure actions), not what you *think* I might do." *Soft Spot:* Does her elimination procedure secretly *assume* others have probabilistic beliefs about her actions? If so, why reject the mixed dominance those beliefs imply?

  **The Questions & Follow-Ups:**

  1.  **The Predictive Cost:** You argue that eliminating *only* pure-dominated strategies avoids artefacts. But in finite games, a strategy is strictly dominated *by a mixture* precisely when it's *never* a best response to *any* belief over opponents' pure strategies. If a player uses such a strategy, doesn't that mean they're choosing something that is *provably irrational* – demonstrably worse than *something else* – no matter what pure actions their opponents actually take? What behaviour are you *predicting* that includes these never-best-response strategies, and why is that a *better* prediction?  
      *Follow-Up (Likely Reply Keyed):* If you say these strategies might still be played under "non-equilibrium" or "unusual" beliefs, doesn't that just mean your solution concept *fails* to eliminate demonstrably irrational choices? Is preserving the *possibility* of playing a provably bad move really a virtue?

  2.  **Order-Independence: Virtue or Artifice?** You celebrate the order-independence of iterated pure *strict* dominance as a mark of robustness, contrasting it with weak dominance. But isn't this order-independence fundamentally a consequence of how *strong* the condition for elimination is? Since pure strict dominance is so rare beyond the first round, doesn't the procedure often stop very early, failing to capture deeper layers of rational deliberation that *do* depend on the sequence of reasoning (like weak dominance or mixed dominance)? Is the "well-defined set" actually just the *smallest possible set* achievable by dominance, rather than the most rational one?  
      *Follow-Up (Likely Reply Keyed):* If you argue order-independence reflects "path-independent rationality", does that imply that rational players should somehow magically *know* the entire surviving set simultaneously? Isn't iterative *reasoning* inherently sequential, making weak/mixed elimination, despite order-dependence, a better model of *how* players actually deduce what's rational?

  3.  **Epistemic Licensing Beyond Round One:** Granting that common knowledge of rationality (CKR) justifies eliminating strategies strictly dominated by pure strategies in the *first* round, what exactly licenses a *second* round? If Player 1 knows Player 2 is rational (CKR), they eliminate their pure-dominated strategies. But for Player 1 to now eliminate a strategy based on Player 2's *surviving* strategies, doesn't Player 1 need more than just CKR? Don't they need to *know* or *strongly believe* that Player 2 *has already eliminated* their dominated strategies? What epistemic principle justifies that belief without smuggling in the conclusion?  
      *Follow-Up (Likely Reply Keyed):* If you appeal to "common belief in the game being solved" or "trembling hand" justifications for iteration, are those any *less* metaphysical or problematic than the beliefs encoded in mixed strategies? Doesn't your pure-only procedure *also* rely on strong iterative epistemic assumptions that go beyond basic CKR?

  4.  **The 3x3 Game - Hide & Seek:** Consider this simple asymmetric game (Player 1 Rows, Player 2 Columns, payoffs (P1, P2)):
      ```
