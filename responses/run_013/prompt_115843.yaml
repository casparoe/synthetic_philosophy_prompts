inst L: Mix needs >0 -> easy. Against C: Mix needs >2. But max mix can get vs C is 1 (if play U), so impossible. No mix dominates D. But earlier no pure dominance. Let me recheck payoffs.
      Actually, let's correct the game setup. Standard example: Battle of the Sexes with a Deterrence option.
      Better example: A classic is:
      ```
            L     C     R
      U   1,3   1,0   0,1
      M   0,0   1,3   3,0
      D   0,1   0,3   1,0
      ```
      *Player 2 (Cols):*
      *   `L` vs U:3, M:0, D:1
      *   `C` vs U:0, M:3, D:3
      *   `R` vs U:1, M:0, D:0
      `R` is strictly dominated by `C` for Player 2? Against U: `R`=1 vs `C`=0? `C`=0 < `R`=1? Not dominated. `L` vs `C`: Against U: 3>0, Against M: 0<3, Against D: 1<3? Not strictly dominated. `R` vs `C`: Against U:1>0, Against M:0<3, Against D:0<3? Not dominated. No pure strict dominance for P2.
      For Player 1:
      * `U` vs L:1, C:1, R:0
      * `M` vs L:0, C:1, R:3
      * `D` vs L:0, C:0, R:1
      Is `D` dominated by pure? `U` vs L:1>0, but vs C:1>0? `U` better than `D` vs L and C? Vs L: U=1 > D=0; Vs C: U=1 > D=0; Vs R: U=0 < D=1? So not strictly dominated by U. Similarly not by M. **No pure strict dominance eliminations.**
      * `D` *is* strictly dominated by a mixture of `U` and `M`. Let mixture be (p U, (1-p) M).
      *   Vs L: p*1 + (1-p)*0 = p. `D` gets 0. Need p > 0. True for p>0.
      *   Vs C: p*1 + (1-p)*1 = 1. `D` gets 0. Need 1 > 0. Always True.
      *   Vs R: p*0 + (1-p)*3 = 3-3p. `D` gets 1. Need 3-3p > 1 => 2 > 3p => p < 2/3.
      Any mixture with 0 < p < 2/3 strictly dominates `D` (e.g., p=0.5: Payoffs (0.5, 0.5, 1.5) all > (0,0,1)).
      **Question:** In this game, iterated pure strict dominance eliminates nothing. Yet `D` is strictly dominated by a mixture of `U` and `M`. If Player 1 is rational, knowing Player 2 is rational (but no pure dominance for P2, so P2 might play anything), why would Player 1 ever play `D`? It's *always* worse than the 50/50 mix. Doesn't refusing to eliminate `D` force you to predict that a rational Player 1 *might* play a strategy demonstrably inferior to a readily available alternative?  
      *Follow-Up (Likely Reply Keyed):* If you argue Player 1 might play `D` because they have a "wrong belief" about Player 2, doesn't that mean your concept allows rational players to hold beliefs that justify playing strategies *known* to be strictly worse *given the actual structure of the game*? Is that still "rationality"?

  5.  **Admissibility & Caution:** Your pure-only procedure can leave in strategies that are *not admissible* – they are strictly dominated *if* players consider the possibility that opponents might mix, or even just have probabilistic beliefs. Do you see admissibility (not being weakly dominated / not being strictly dominated by a mixture) as a necessary condition for a rational strategy? If not, why not? If so, how does your procedure ensure it?  
      *Follow-Up (Likely Reply Keyed):* If you reject admissibility, is there a rational defence for choosing a strategy that could be *disastrous* (`D` in the example) if an opponent plays a certain way, when another strategy (or mix) offers protection, *even if you think that opponent play is unlikely*? Doesn't pure dominance only capture risk aversion against *certain* pure actions, ignoring bad outcomes from others?

  6.  **Beliefs vs. Actions:** You say mixtures are just "encoding uncertainty" about the *pure* actions others will take. But when we say a mixed strategy *μ* for opponents strictly dominates one of *my* pure strategies *s_i*, it means: "For *every possible* profile of pure strategies the opponents might play, playing something *other than s_i* gives me a higher *expected payoff* under the belief *μ*." Isn't this fundamentally a statement about the irrationality of *s_i* given a *specific, coherent belief* *μ* about opponents? Why dismiss this as an "artefact," when it directly uses the belief itself (the uncertainty) to define rationality?  
      *Follow-Up (Likely Reply Keyed):* Doesn't your *own* pure strict dominance elimination *also* implicitly rely on the player having beliefs concentrated on *some* pure opponent strategies? If you accept that players hold beliefs, why reject the logical consequence that some strategies are bad *given those beliefs*, even if they aren't dominated by a single pure alternative?

  7.  **The Replacement Hypothesis:** If mixed strategies are truly just "pure strategies plus everyone else's ignorance," does that mean your iterated pure strict dominance procedure is *epistemically equivalent* to iterated mixed strict dominance? Or does refusing mixed dominance actually change the *outcome* (as in the 3x3 game)? If it changes the outcome, how can they be equivalent interpretations? If it *doesn't* change the outcome (which it demonstrably does), why insist on the pure-only framing?  
      *Follow-Up (Likely Reply Keyed):* If you concede the outcomes differ, doesn't that prove your "ignorance" interpretation of mixtures *doesn't* save the standard iterated dominance procedure – it quietly *replaces* it with a weaker one that leaves in strategies rational players would avoid?

  8.  **The Falsifiable Core:** You've held this position throughout your career. What specific empirical observation, theoretical result, or logical argument *could* convince you that iterated elimination of strategies strictly dominated by mixed strategies is a necessary and valid component of defining rational play? What would falsify your current view?  
      *Follow-Up (Likely Reply Keyed):* If the answer is "nothing" or relies solely on philosophical preference about "what players *really* do," does that mean your position is ultimately non-falsifiable within game theory itself? Is it a foundational axiom rather than a testable claim?

  **Key to landing the points:**
  *   **Use the 3x3 Game (Q4):** Have it written down clearly. The concrete example is powerful. Focus on Player 1's choice of `D` being irrational *even without knowing what P2 will do*, because *whatever* P2 does (L, C, or R), the mix does at least as well, and better against two actions. "Why would a rational player *ever* choose D?"
  *   **Emphasize "Provably Bad" (Q1, Q4, Q5):** Hammer the point that never-best-response/dominated-by-mix strategies are *demonstrably inferior* under *any* assessment of the opponents' possible pure actions. Refusing to eliminate them seems to tolerate irrationality.
  *   **Press the Epistemic Loop (Q3):** Force clarity on how "common knowledge of rationality" justifies *iterating* pure dominance without invoking something equivalent to assuming the elimination has already happened. Point out the potential circularity.
  *   **Contrast Beliefs & Actions (Q6):** Don't let her conflate the *description* of beliefs (mixes) with the *use* of those beliefs in defining rationality (mixed dominance). Highlight that her procedure *also* uses beliefs (about pure actions).
  *   **End with Falsifiability (Q8):** This is crucial. It forces her to either engage with potential counter-evidence/arguments or admit her stance is axiomatic. Both answers are revealing.

  Good luck with the podcast! Focus on the concrete (the 3x3 game) and the foundational (epistemics, falsifiability) to push the discussion forward. Remember to keep the tone inquisitive and collegial, not confrontational. Use phrases like "Help me understand..." or "Walk me through why..." before the sharper follow-ups.
