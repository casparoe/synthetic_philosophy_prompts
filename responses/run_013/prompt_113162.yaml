prompt: |-
  Hey, so I'm a third-year phil student and I'm taking this course on contemporary ethical theory — we've just finished the contractualism unit and I'm also seperately roped into being the student rep on our uni's Financial Hardship Panel, which meets every Thursday and hands out from a fixed pot of about £14k a term. I'm the only one in the room who's read any philosophy, and the other four (a bursar, two academics, a welfare officer) keep justifying everything by saying we should help the most people with the money. My instinct is that this is exactly the kind of justification Scanlon would say doesn't cut it — that what matters is whether a principle could be reasonably rejected by each person affected, looking at that person's own complaint rather than some total of benefits. But in the actual meeting I freeze, because the numbers obviously seem to matter (if I can stop forty students from dropping out at the cost of denying one student something smaller, it feels insane to say no) and I don't know how to say that in contractualist terms without smuggling aggregation straight back in through the side door. And our decisions get written up with reasons and students can appeal, so I can't put 'it helps more people overall' in the record.

  Can you act as someone who genuinely knows this literature — not a summariser, someone who has had to defend the view — and help me build an actual decision procedure my panel could run, rather than a theory recap? Start by brainstorming the moving parts for yourself: what a complaint is and what makes one reasonable, why the view refuses to justify principles by totalling benefits across persons, what the standard options are when a lot of small complaints sit on one side and one large complaint sits on the other, and where contractualists themselves tend to go quiet. Then turn it into a checklist in order — what to ask first, what counts as a sufficient answer to each question, where it stops with a no, and precisely which steps are values calls I have to own rather than facts the procedure settles. It has to be runnable in twenty minutes per case by people who haven't read the book, and it has to survive being read aloud at an appeal. Then please run it on two real cases from last term: (a) one applicant needed almost the entire pot after a house fire, versus forty applicants needing a few hundred each to stay enrolled, and (b) a standing rule we argued about that caps individual awards at £500 so more students can be helped, which predictably shafts the one student with a £3,000 medical bill. Include the case where your procedure tells me something I wont want to hear, and be upfront about what it can't do. Think it through carefully before writing — I'd much rather have the messy edges flagged than a tidy answer that pretends the aggregation problem is solved.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy student grappling with applying Scanlon's contractualism to real-world funding decisions, specifically frustrated with utilitarian "help the most people" reasoning dominating their university's Financial Hardship Panel. They need a concrete decision procedure that honors contractualist ethics while being practical for time-constrained committee use and legally defensible in appeals.

  First, I need to dissect why contractualism rejects aggregation. Scanlon's core idea is that moral justification requires principles no one could reasonably reject based on their personal standpoint. Totaling benefits across individuals ignores the separateness of persons - it allows overriding someone's vital interest simply because many others have smaller claims. The welfare officer's "greatest good" approach would fail Scanlon's test because it doesn't take each person's complaint seriously as an individual moral claim.

  For the decision framework, I'll structure it as a sequence of questions mirroring contractualist reasoning. The key components must include:
  1) Identifying affected parties and their complaints (not just applicants but those denied aid if funds deplete)
  2) Assessing complaint severity using concrete thresholds (academic survival vs convenience)
  3) Testing for reasonable rejectability with special attention to catastrophic cases
  4) Handling tie-breakers through procedural fairness when complaints are comparable

  The procedure must avoid two traps: secretly reintroducing aggregation (e.g., counting heads when complaints differ in kind), and pretending value judgments are neutral. I'll explicitly flag where committees must make substantive calls about what counts as "reasonable rejection" - these can't be proceduralized away.

  For case A (house fire vs 40 small needs), the framework should block sacrificing the fire victim unless all small claims are below academic-impact thresholds. But I'll show where this gets uncomfortable: if 200 students needed £70 each for textbooks, contractualism might still prioritize one student's housing catastrophe, which may feel counterintuitive.

  For case B (the £500 cap), the analysis needs to demonstrate how caps fail the reasonable rejectability test for the medical emergency student. Their complaint isn't just about money but about being excluded from consideration for a life-altering need. The cap becomes a rigid rule that prevents even assessing comparative severity.

  Crucially, I'll highlight the framework's limits - it can't magically resolve scarcity, and when complaints are truly equal, committees must accept some aggregation (e.g., helping more when all face identical hardship). The user needs to know where contractualism falls silent so they don't overclaim.

  The output should model how to write defensible reasons: "We denied the cap because it prevents individualized assessment of whether X could bear their burden, not because larger numbers outweigh one person's crisis." This avoids utilitarian language while satisfying appeal requirements.
answer: |-
  Here’s a runnable contractualist decision procedure for your panel, designed to handle aggregation problems head-on. It forces explicit value judgments while keeping Scanlon’s core intact. **Bold text** is the actionable checklist; plain text explains the reasoning.

  ---

  ### **Contractualist Decision Procedure for Hardship Allocation**
  **Core Principle:** A decision is justified if no affected person can *reasonably reject* the principle behind it, given the *burden* they bear under that principle. Complaints are individual, not additive.

  #### **I. PRE-DECISION STEPS (Before Meeting)**
  1. **Define "Affected Parties":**  
     - Applicants + *all students who would be denied aid if funds run out* (the "opportunity cost" group).  
     - *Why:* Scanlon requires considering everyone impacted by the principle.

  2. **Map Burdens:**  
     - For each applicant: Specify *what they cannot do* without aid (e.g., "drop out," "skip meals," "fail clinical placement").  
     - *Why:* Complaints are about concrete harms, not dollar amounts.

  #### **II. DECISION FLOW (Per Case – 20min Max)**
  **ASK IN ORDER – STOP if any "NO":**

  > **1. "Is this burden *catastrophic*?**  
  >   - **Catastrophic =** Threat to survival, permanent academic exclusion, or severe bodily harm.  
  >   - *If YES → Fund fully unless it eliminates the entire pot (go to Q3).*  
  >   - *If NO → Proceed to Q2.*  
  >   - *Value Call:* Panel must define "catastrophic" (e.g., homelessness = yes; laptop repair = no).  
  >   - *Why:* No one could reasonably reject prioritizing life/basic dignity over smaller needs.

  > **2. "Can the applicant *reasonably bear* this burden alone?"**  
  >   - **Reasonable bearing =** Burden doesn’t derail their core academic trajectory or health.  
  >   - *If NO → Proceed to Q3.*  
  >   - *If YES → Reject.*  
  >   - *Value Call:* What counts as "core"? (e.g., tuition = essential; conference travel = not).  
  >   - *Why:* If the burden is bearable, rejecting aid isn’t unreasonable.

  > **3. "Would funding this create a *worse* or *equal* burden for others?"**  
  >   - Compare: Burden on applicant vs. *aggregate burden* on those denied later funds.  
  >   - **Key:** Do NOT add small burdens. Ask: *"Is any one person in the 'opportunity cost group' facing a burden comparable to or worse than the applicant’s?"*  
  >   - *If NO → Fund.*  
  >   - *If YES → Proceed to Q4.*  
  >   - *Why:* Scanlon forbids aggregating small complaints to override a large one. Only comparable *individual* burdens matter.

  > **4. "Is the principle behind this allocation *reasonably rejectable*?"**  
  >   - **Test:** "Could someone harmed by this decision (applicant or opportunity-cost student) reject the principle *without contradicting their own equal standing*?"  
  >   - **Red Flags:**  
  >     - Principle ignores severity (e.g., "always help more people").  
  >     - Principle is arbitrary (e.g., "caps for simplicity").  
  >     - Principle worsens existing disadvantage (e.g., "no aid for undocumented students").  
  >   - *If NO clear rejection → Fund.*  
  >   - *If YES → Reject.*  
  >   - *Value Call:* Assessing "equal standing" requires debate (e.g., is a medical need "more urgent" than eviction?).

  #### **III. TIE-BREAKER (Rare – Use only if burdens are truly equal)**
  > **"Does one option reduce *procedural unfairness*?"**  
  >   - E.g., First-come-first-served avoids bias; random lottery treats all equally.  
  >   - *Why:* When complaints are symmetrical, even Scanlon allows non-utilitarian tie-breakers.

  ---

  ### **APPLICATION TO YOUR CASES**
  #### **Case A: House Fire (Catastrophe) vs. 40 Small Needs**
  1. **Q1:** House fire = **catastrophic** (loss of home/essentials). 40 students = needs likely non-catastrophic (e.g., rent shortfalls).  
     → **Fund house fire applicant.**  
  2. **Why this survives appeal:**  
     *"The Panel prioritized preventing catastrophic academic exclusion. While many students face serious hardships, none presented burdens of comparable severity to total loss of housing. The principle 'prevent irreversible harm before addressing reversible setbacks' cannot be reasonably rejected by those with smaller burdens, as they retain the ability to continue studies."*  
  3. **The Hard Truth:** Contractualism *requires* this if the 40 burdens are non-catastrophic. You must own the value judgment that homelessness is in a different moral category.

  #### **Case B: £500 Cap vs. £3,000 Medical Bill**
  1. **Q1:** Medical bill = **catastrophic** if unpaid (health crisis → dropout).  
  2. **Q2:** Cannot reasonably bear alone (health necessity).  
  3. **Q3:** Cap creates a *worse burden* for medical applicant vs. others denied smaller sums.  
  4. **Q4:** **Principle is reasonably rejectable!**  
     - Medical applicant: "A rigid cap ignores the severity of my need and treats my survival as less important than administrative convenience."  
     - Rejection is reasonable → **Reject the cap; fund medical bill.**  
  5. **Appeal-proof reason:**  
     *"The £500 cap was suspended for this case because it would impose a catastrophic and unreasonable burden on a student facing a health emergency. The principle 'award equal maximum amounts regardless of need severity' can be reasonably rejected by those with exceptional burdens, as it fails to account for their greater moral claim."*

  ---

  ### **WHERE CONTRACTUALISM GOES QUIET (AND YOU MUST OWN IT)**
  1. **Defining "Catastrophe":** Is mental health crisis equal to physical? Is dropout due to childcare worse than debt? *You decide.*  
  2. **Burden Comparisons:** Is "dropping out due to eviction" worse than "failing a term due to untreated ADHD"? *No algorithm answers this.*  
  3. **True Ties:** If two students face identical catastrophic burdens but funds cover only one → contractualism has no answer. Use a lottery and admit the arbitrariness.  

  ### **WHY THIS WORKS IN PRACTICE**
  - **Blocks Aggregation:** Q3 forces comparing *individual* burdens, not sums.  
  - **Survives Appeals:** Justifications focus on reasonable rejectability, not utilitarianism.  
  - **Fast:** 20min/case by focusing on burden severity.  
  - **Uncomfortable Truths Exposed:** You’ll sometimes deny help to many for one person’s catastrophe. That’s the point – it makes the value conflict visible.  

  **Final Advice:** In meetings, train the panel to ask: *"What’s the worst thing that happens to one person if we do/don’t fund this?"* That’s the contractualist north star. When numbers come up, reply: *"Forty small injuries don’t equal one death."*
