prompt: |-
  ok so ive been going back and forth on epiphenomenalism with a friend and I want an actual number from you, not a survey of positions. the claim: epiphenomenalism is self-undermining -- if phenomenal properties are caused by physical ones but never cause anything themselves, then nobody can explain why our judgments about phenomenal properties (this hurts, that looks red to me, im seeing something reddish now) reliably track the phenomenal properties theyre supposedly about. so either epiphenomenalism is false, or it cant account for our knowledge of experience at all. im at about 0.55 that the claim is right. give me your credence, and more importantly the decomposition:

  - how much rides on a causal theory of content -- roughly, that a judgment can only be about X if X or its content played some causal role in generating the judgment? whats your probability that something in that family is true?
  - the epiphenomenalists best comeback, which I take to be the common-cause or echo reply: the physical state causes both the phenomenal state and the judgment, and the physical state already represents the phenomenal state, so the judgment inherits its aboutness second-hand and the phenomenal state never has to do anything. whats your probability that this actually works, and isnt just smuggling causation back in under another name?
  - a friend of mine thinks the fix is to let qualia cause each other -- phenomenal states stay inert with respect to the physical but not with respect to one another. does that help at all, or does it just move the bump under the rug, since the judgment is still a physical or functional event?
  - whether this is really an argument against epiphenomenalism in particular, or whether it bites just as hard on any view where the phenomenal is fixed by the physical, standard physicalism included. if it generalizes, it stops being a reason to prefer physicalism over epiphenomenalism.
  - the deflationary escape: our judgments about experience arent about experience in any thick sense, theyre just verbal dispositions, and the whole paradox is an artifact of taking introspections self-description at face value.

  then combine them into a number, tell me which term your number is most sensitive to, and what would move it most -- a better theory of representation, some empirical result, or just a shift in how we think about aboutness. dont just tell me it depends on what you mean by causation, thats the thing I want you to commit on. and if you had to guess, where does my 0.55 and yours actually come apart?
