prompt: |-
  Fifteen years of reading rationalist blogs and forums has left me with one durable conviction: a principle that cannot be turned into a procedure somebody can run under time pressure is a mood, not a rule. I am writing because I need a procedure, and because I suspect the relevant philosophy will make my job harder rather than easier.

  I chair the member disputes panel at a sixty-unit housing cooperative. The panel is five residents, no lawyers, and I am the only one who reads anything like this material. We meet monthly, hear three to six cases a year, and our rulings bind unless a household appeals to the full board, which happens perhaps once a year. The stakes are people's homes and their standing with their neighbors, and the panel's legitimacy depends on our rulings looking principled rather than personal. I get about forty-five minutes per case before the meeting, and no time to consult anything while the panel is sitting. Whatever you give me has to fit on two pages and be usable by someone who has never heard of any of this.

  Here is the recurring shape of our cases, which I gather has a name. Our bylaws contain two commitments I always assumed were compatible and now suspect are not. First, each household is sovereign over its own interior: what we display, what we practice, whom we host, what we keep, what we do inside our own walls is ours to decide. Second, we are a consensus body: a proposal that leaves no household worse off is adopted, and where one option is unanimously preferred to another we take the preferred one. The trouble is that members have preferences about what other members do inside their own households — about a shrine on a balcony, a flag, a home business, a pet, a garden, a stream of guests. When a majority prefers that a household stop doing something self-regarding, the consensus commitment says honor that preference and the sovereignty commitment says it is none of our business. I believe the impossibility result bearing Amartya Sen's name tells me I cannot keep both commitments without some restriction, and that the restriction has to fall on whose preferences we admit in the first place. Build the panel's procedure around that, and be candid that this restriction is the load-bearing move rather than something the bylaws already contain.

  Write the procedure as an ordered set of questions the panel asks, specifying for each (a) what counts as a sufficient answer, (b) which answers end the case with a ruling for one side, (c) which answers hand the case to a human because the question is one of values rather than facts, and (d) where the procedure is known to misfire. If it leans on the word harm, make it say what harm means operationally.

  I need it to handle the following, in ascending order of how much they worry me:

  A test that separates a genuine externality — noise, smell, pests, blocked light, traffic, structural risk — from disapproval of what a neighbor does. The hard case is symmetric: the objection is religious and the conduct is religious, so I cannot simply ask which side is being sectarian.

  A rule for when the objecting households are a majority, or a near-unanimity, and are quite sure of their own moral standing. This is where I expect the procedure to tell me things I do not want to hear.

  An instruction for adaptive preferences: a household that reports no objection to a restriction I suspect it has simply stopped expecting better than. Say what evidence would move me and what to do when the evidence is inconclusive.

  A rule for when the objectionable conduct is aimed at a particular neighbor rather than at the world in general. I think there is a real difference between a symbol and a taunt, and I want the procedure to locate it without turning the panel into a mind reader.

  A one-page intake form: the questions we put to both households before the hearing, phrased so a resident can answer them without knowing any of the theory.

  Then run the procedure on three cases, showing the reasoning at each step.

  1. A household has installed a small religious shrine on a balcony visible from the courtyard. Two neighboring households object on religious grounds, saying that the shrine's presence in shared view is itself a religious statement they are being made to live with.

  2. A household bakes and sells bread from its kitchen. Deliveries arrive at odd hours, the smell is constant, and the shared wall vibrates. The baker is a friend and the co-op is better for her being here, but I do not think that is relevant and I want the procedure not to care either.

  3. A household flies a flag expressing a political position that I and most of the co-op find repellent. The objection is offense, not externality, and I would very much like to rule against it.

  I expect the procedure to tell me to leave the flag alone and to let the shrine stand, and I would rather you say so plainly than bend the procedure toward my sympathies. I also expect it to say something I do not anticipate in the bread case.

  Close with a short section on what this procedure cannot do: where the actual dispute is over the boundary of the sovereign sphere rather than over what happens inside it, and any case where you think the framework should be set aside altogether. Do not give me a reading list or citations; assume I know the names and want the machinery.
reasoning: |-
  We are designing a procedure for a housing cooperative disputes panel that must reconcile two commitments: household sovereignty over interiors and consensus decision-making. The key insight from Amartya Sen's impossibility result is that we must restrict which preferences are admissible in consensus decisions to avoid violating sovereignty. The procedure will focus on identifying "admissible preferences" – those that relate to genuine externalities rather than mere disapproval.

  The core idea: Only preferences based on harm (operationally defined as measurable interference with the use and enjoyment of one's own property) are admissible in consensus decision-making. Preferences based on offense, disapproval, or moral judgment about another's private conduct are inadmissible.

  Procedure: An ordered set of questions for the panel

  1. **Question: Does the challenged conduct occur entirely within the household's sovereign space?**
     - (a) Sufficient answer: Evidence that the conduct occurs within the household's unit (e.g., photos, description). If the conduct is on a balcony, we note that balconies are typically considered private but may have visibility issues.
     - (b) If yes, proceed to Question 2. If no (e.g., the conduct spills into common areas), the conduct is not protected by sovereignty and the panel may rule against it if it violates co-op rules or causes harm.
     - (c) This is a factual question. If there is a dispute about where the conduct occurs (e.g., is a balcony private?), the panel must decide based on bylaws and past rulings. If the bylaws are unclear, the panel must interpret them (values question) but should default to broad sovereignty.
     - (d) Misfire: If the conduct is on the boundary (e.g., a balcony) and the bylaws are ambiguous, the panel might err by over- or under-protecting sovereignty.

  2. **Question: Does the conduct cause harm?**
     - Definition of harm: Operational harm is a measurable interference with the use and enjoyment of another household's property. This includes:
       - Physical: Noise, smell, vibration, pests, blocked light, traffic, structural risk.
       - Tangible: Financial costs imposed (e.g., increased insurance, cleaning costs).
       - Psychological harm is excluded unless it rises to the level of a recognized legal nuisance (e.g., harassment, threats). Offense, disgust, or moral disapproval do not count.
     - (a) Sufficient answer: The objecting household must provide evidence of harm. Examples: decibel readings for noise, photos of blocked light, invoices for extra cleaning, records of pest infestations linked to the conduct. For vibration, a report from an engineer or consistent complaints from multiple households.
     - (b) If no harm is found, ruling: Uphold sovereignty, the conduct is allowed. If harm is found, proceed to Question 3.
     - (c) The panel must judge whether the evidence meets the operational definition. This is a factual question unless the harm is novel (e.g., is a constant smell that causes headaches harm? Then it's a values question). In such cases, the panel must decide by majority vote whether the alleged harm fits the definition.
     - (d) Misfire: A household might exaggerate harm (e.g., claiming a smell causes headaches without medical evidence) or the panel might overlook subtle harms (e.g., a flickering light that triggers migraines).

  3. **Question: Is the harm reasonably avoidable by the objecting household without undue burden?**
     - (a) Sufficient answer: The panel considers whether the objecting household can take reasonable steps to avoid the harm (e.g., closing blinds, using earplugs, avoiding a shared space). "Undue burden" means significant cost or inconvenience (e.g., having to keep windows closed in summer without AC).
     - (b) If yes, ruling: The conduct is allowed, and the objecting household is expected to avoid the harm. If no, proceed to Question 4.
     - (c) This is a mixed question. The panel must evaluate reasonableness (values) but also the feasibility of avoidance (facts).
     - (d) Misfire: The panel might impose too heavy a burden on the objecting household (e.g., telling them to move their bedroom) or too light (e.g., ignoring a simple fix).

  4. **Question: Is the conduct targeted at a specific household?**
     - (a) Sufficient answer: Evidence that the conduct is directed at a particular neighbor (e.g., a sign facing only one house, a history of conflict, a pattern of behavior that singles out one household).
     - (b) If yes, the conduct loses sovereignty protection and the panel may rule against it. If no, proceed to Question 5.
     - (c) This is factual if there is direct evidence (e.g., a written threat) but often requires inference (values). The panel must be cautious not to assume intent without evidence.
     - (d) Misfire: A household might misinterpret coincidental targeting (e.g., a flag that happens to face a neighbor) as intentional.

  5. **Question: Would restricting the conduct leave the acting household worse off?**
     - (a) Sufficient answer: The acting household must show that the restriction would cause them harm (using the same operational definition) or a significant non-harm loss (e.g., religious burden). The panel must weigh this against the harm to others.
     - (b) If the harm to the acting household outweighs the harm to others, the conduct is allowed. Otherwise, it is restricted. If the harms are incommensurable, the panel must balance them (values decision).
     - (c) This is a values question when comparing harms. The panel must use its best judgment.
     - (d) Misfire: The panel might undervalue non-material harms (e.g., religious practice) or overvalue them.

  Special Instructions:
  - **Adaptive Preferences**: If a household reports no objection to a restriction, the panel should ask: "Would this household have objected when they first moved in?" Evidence: Past complaints, changes in behavior, or testimony from other households. If inconclusive, assume the preference is genuine unless there is evidence of coercion.
  - **Majority Moral Standing**: The procedure does not change for majorities. Harm must still be proven. A majority's moral disapproval is irrelevant.

  Intake Form (One Page)
  ---
  **Co-op Dispute Intake Form**
  Please answer the following for the panel. Be specific and provide evidence if possible.

  1. **What is the conduct you are challenging?** (Describe exactly what the other household is doing, where, and when.)
  2. **Where does this conduct occur?** (Is it entirely inside their unit? On a balcony? In a common area?)
  3. **How does this conduct affect you?** (Be specific: e.g., "I hear loud noises at 3am," "The smell makes me nauseous," "It blocks my sunlight." Provide any evidence: photos, videos, records.)
  4. **Have you taken any steps to avoid this problem?** (e.g., closing windows, using earplugs, talking to the household.)
  5. **Is this conduct directed specifically at you or your household?** (How do you know?)
  6. **If the conduct is restricted, how would that affect the other household?** (What would they lose? e.g., "They couldn't run their business," "They couldn't practice their religion.")
  ---

  Running the Procedure on Cases

  **Case 1: Religious Shrine on Balcony**
  1. **Sovereign Space?** Yes, balcony is private (assuming bylaws say so).
  2. **Harm?** Objectors say it's a religious statement they must live with. This is offense, not operational harm (no noise, smell, etc.). Ruling: No harm found. The shrine is allowed. (Procedure says to leave it alone.)

  **Case 2: Home Bakery**
  1. **Sovereign Space?** Baking is inside, but deliveries and effects spill out.
  2. **Harm?** Smell (constant), vibration (shared wall), and traffic (deliveries at odd hours). These are operational harms.
  3. **Reasonably Avoidable?** Objectors cannot reasonably avoid smells without sealing their homes, which is an undue burden in summer. Vibrations are structural and unavoidable.
  4. **Targeted?** No.
  5. **Harm to Baker if Restricted?** The baker loses her business. This is a significant harm. But the harms to neighbors (constant interference with enjoyment) are severe. The panel must balance: The business imposes daily harms on neighbors, while restriction harms the baker financially. The panel may rule that the bakery must cease or mitigate (e.g., soundproofing, delivery hours). (Procedure says: Not automatically allowed.)

  **Case 3: Offensive Flag**
  1. **Sovereign Space?** Flag is on private property (sovereign).
  2. **Harm?** Objection is offense. No operational harm (no noise, smell, etc.). Ruling: No harm found. The flag is allowed. (Procedure says to leave it alone, even if repellent.)

  What the Procedure Cannot Do:
  - **Boundary Disputes**: If the dispute is about what counts as sovereign space (e.g., is a balcony private?), the procedure relies on the panel's interpretation of the bylaws. This may require a separate process.
  - **Values Conflicts**: When the dispute is purely about values (e.g., "This flag is hate speech") without harm, the procedure will uphold sovereignty, which may leave some discontent.
  - **Harassment**: If the conduct is part of a pattern of targeted harassment, the procedure (Question 4) may catch it, but harassment often requires a broader investigation.
  - **Emergency Situations**: If there is immediate danger (e.g., structural risk), the procedure is too slow; use emergency powers.
  - **Deeply Adaptive Preferences**: If an entire community has adapted to restrictions, the panel might not see the harm.

  Final Note: The procedure is designed to protect individual sovereignty from majoritarian moral preferences. It will sometimes allow conduct that offends, disgusts, or upsets others. The legitimacy comes from consistent application, not from pleasing the majority.
answer: |-
  Below is a complete procedure for your disputes panel, designed as an ordered set of questions. It operationalizes Amartya Sen's insight by restricting admissible preferences to those grounded in **demonstrable harm to the use and enjoyment of another household's property**. Preferences based on offense, disapproval, or moral judgment are inadmissible. Harm is defined operationally as **measurable interference with a resident's physical environment, health, safety, or financial costs** (e.g., noise, pollution, structural damage, verifiable health impacts). Psychological distress alone (e.g., offense) is excluded unless it stems from targeted harassment. 

  The procedure fits on two pages (including instructions) and requires no prior knowledge. The intake form is included separately. I'll first present the procedure, then the form, then apply it to your three cases, and end with limitations.

  ---

  ### **Dispute Resolution Procedure: Ordered Questions for the Panel**  
  *Use in sequence. Rulings require majority panel vote. All answers must be based on evidence from the intake form or hearing.*

  1. **Is the challenged conduct occurring within the acting household’s sovereign space?**  
     - *(a) Sufficient answer:* Proof that the conduct happens inside the household’s unit (e.g., photos, descriptions). Balconies, gardens, and windows are sovereign if the bylaws define them as private.  
     - *(b) Ruling:* **If no**, the conduct is not protected. Rule against the acting household. **If yes**, go to Question 2.  
     - *(c) Values/facts:* Factual. If boundaries are unclear (e.g., "Is a balcony private?"), the panel decides based on bylaws.  
     - *(d) Misfires:* If bylaws are ambiguous, the panel may misjudge sovereignty. Default: interpret sovereignty broadly.

  2. **Does the conduct cause measurable harm to any objecting household?**  
     - *(a) Sufficient answer:* Evidence of **operational harm**—e.g., noise logs (decibel readings), smell descriptions with frequency/duration, pest reports, structural engineer assessments, medical records for health impacts, or financial costs (e.g., extra cleaning bills). Harm must be **specific, repeatable, and tied to the conduct**.  
     - *(b) Ruling:* **If no harm**, rule for the acting household (conduct is allowed). **If harm**, go to Question 3.  
     - *(c) Values/facts:* Factual. The panel judges if evidence meets the harm definition. If harm is novel (e.g., "vibrations cause headaches"), it becomes a values question: "Is this a valid harm type?" Vote majority.  
     - *(d) Misfires:* Households may fake harm (e.g., "the smell makes me ill" without evidence). Ignore if unverified.

  3. **Can the harm be reasonably avoided by the objecting household(s) without undue burden?**  
     - *(a) Sufficient answer:* Consider cost, effort, or sacrifice required to avoid harm (e.g., closing windows, using earplugs, avoiding a common area). "Undue burden" means significant expense (>$100), health/safety risk, or loss of core home function (e.g., sealing a home in summer heat).  
     - *(b) Ruling:* **If yes**, rule for the acting household (conduct is allowed, and objectors must adapt). **If no**, go to Question 4.  
     - *(c) Values/facts:* Mixed. Feasibility is factual; "reasonableness" is values. Vote majority.  
     - *(d) Misfires:* May overestimate adaptability (e.g., telling someone to "ignore" constant noise) or underestimate burdens (e.g., requiring AC installation).

  4. **Is the conduct targeted at one or more specific households?**  
     - *(a) Sufficient answer:* Evidence of **personal direction**—e.g., conduct only affects one neighbor, history of conflict, explicit threats, or symbols placed to confront a household (e.g., a sign facing their window).  
     - *(b) Ruling:* **If yes**, rule against the acting household (sovereignty doesn’t cover harassment). **If no**, go to Question 5.  
     - *(c) Values/facts:* Factual if clear evidence (e.g., a text saying "I’m doing this to annoy you"). Otherwise, values: panel infers intent from patterns.  
     - *(d) Misfires:* May misread intent (e.g., interpreting a political flag as a "taunt" without evidence).

  5. **Would restricting the conduct cause greater harm to the acting household?**  
     - *(a) Sufficient answer:* Acting household shows harm from restriction—e.g., financial loss (proof of income impact), health/safety risk (medical records), or significant burden (e.g., religious practice blocked). Compare severity to the harm in Q2.  
     - *(b) Ruling:* **If acting household’s harm > others’ harm**, allow the conduct. **If others’ harm > acting household’s harm**, restrict the conduct. **If equal or incommensurable**, rule against the conduct (consensus prioritizes minimizing total harm).  
     - *(c) Values/facts:* Values. Panel weighs harms holistically.  
     - *(d) Misfires:* May undervalue intangible harms (e.g., religious significance) if not well-documented.

  ---

  ### **Special Rules**  
  - **Majority Preferences:** Ignore the number of objectors. Only harm matters. A unanimous moral objection fails if no operational harm exists.  
  - **Adaptive Preferences:** If a household claims no objection to a restriction, ask: "Is this preference coerced or resigned?" Evidence: Past complaints, sudden changes in testimony, or witness accounts. **If inconclusive**, assume the preference is genuine. **If evidence suggests adaptation**, treat it as an objection.  
  - **Time Pressure:** Stick to the questions. If stuck, default to sovereignty (Q1) or no harm (Q2).  

  ---

  ### **Intake Form for Households** (One Page)  
  *Complete this before the hearing. Attach evidence. Be specific.*  

  1. **What is the conduct you are challenging?** (Describe what the other household is doing, where, and when. Example: "Baking bread daily in their kitchen.")  
  2. **Where does this conduct occur?** (Is it inside their home? On their balcony? In a common area?)  
  3. **How does this affect you physically or financially?** (List measurable impacts: noise levels, smells, health issues, costs, etc. Provide evidence: photos, logs, bills.)  
  4. **Have you tried to avoid this impact? How?** (Example: "Closed windows, but it’s too hot.")  
  5. **Is this conduct aimed at you specifically? How do you know?** (Example: "They told me it’s because of our argument.")  
  6. **What would happen to the other household if they stopped?** (Example: "They’d lose income from their business.")  

  ---

  ### **Procedure Applied to Your Cases**  

  **Case 1: Balcony Shrine**  
  - Q1: Conduct is on a balcony. Assuming bylaws define balconies as sovereign → **Yes**.  
  - Q2: Harm claimed: Religious offense from visibility. Not operational harm (no noise, smell, etc.). → **No harm**.  
  - Ruling: **Allow the shrine**. No further questions needed.  
  - *Reasoning*: Objections are disapproval, not harm. Sovereignty protects the acting household.  

  **Case 2: Home Bakery**  
  - Q1: Baking is inside (sovereign), but deliveries/smell/vibrations spill out → **Yes** (sovereign origin, but effects may not be contained).  
  - Q2: Harm: Smell (constant), vibrations (shared wall), delivery traffic. Evidence: Smell logs, vibration complaints, delivery times → **Harm found**.  
  - Q3: Avoidable? Closing windows may help smell, but undue burden in summer. Vibrations are structural and unavoidable → **No**.  
  - Q4: Targeted? No evidence → **No**.  
  - Q5: Harm comparison:  
    - Objectors’ harm: Daily disruption to living space (substantial).  
    - Baker’s harm if restricted: Loss of income (significant).  
    - Ruling: **Restrict the bakery** (e.g., limit hours, soundproofing). Total harm to neighbors is greater due to constant interference.  
  - *Reasoning*: Genuine externalities outweigh sovereignty. Your friendship is irrelevant.  

  **Case 3: Offensive Flag**  
  - Q1: Flag is on sovereign property (e.g., yard or window) → **Yes**.  
  - Q2: Harm claimed: Offense. Not operational (no noise, smell, etc.) → **No harm**.  
  - Ruling: **Allow the flag**. No further questions.  
  - *Reasoning*: Offense is inadmissible. Sovereignty protects even repellent conduct.  

  ---

  ### **What This Procedure Cannot Do**  
  - **Boundary Disputes**: If sovereignty is contested (e.g., "Is a garden sovereign?"), the procedure relies on bylaws. If unclear, the panel must interpret—this is vulnerable to bias.  
  - **Values-Only Conflicts**: Cases with no operational harm but deep moral disagreement (e.g., "This symbol is evil") will always favor sovereignty, which may feel unjust to some.  
  - **Coercion or Harassment**: Q4 catches targeted acts, but subtle intimidation (e.g., passive-aggressive conduct) may not meet the threshold.  
  - **Systemic Issues**: Adaptive preferences from long-term inequities (e.g., a group habituated to unfair rules) may be missed if evidence is weak.  
  - **Emergency Overrides**: Imminent risks (e.g., fire hazards) require fast action outside this procedure.  

  **Do not use this procedure when**:  
  - The dispute is about the co-op’s core rules (e.g., redefining sovereignty). This needs a bylaws amendment, not a panel ruling.  
  - Evidence is impossible to get (e.g., "This ghost annoys me").  
  - There’s direct threats or violence. Refer to authorities.  

  ---  
  The procedure forces objectivity: it blocks majoritarian morality (as in the flag case) and prioritizes verifiable harm (as in the bakery). It will disappoint you when your sympathies conflict with operational harm—but that’s the point. Legitimacy comes from consistency, not comfort.
