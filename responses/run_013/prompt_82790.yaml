  Okay, the user is part of a hospital safety-review committee and has been observing a recurring pattern in incidents involving automated systems. They've noticed that after a harm occurs, reviews can pinpoint the causal chain but can't assign fault to any individual. Everyone involved had defensible reasons for their actions at the time. 

  This person is clearly frustrated after two years of grappling with this. They're not just looking for terminology—they want conceptual tools to address systemic failures. The three nuances they describe are particularly insightful: how recognizing the pattern actually worsens accountability, how blame belongs to the series of events rather than individuals, and the asymmetry in proving systemic faults versus individual innocence.

  Hmm... let me unpack their core question: Is there a name for a system where (i) no single failure is anyone's fault, (ii) the recurrence is clearly a fault, and (iii) acknowledging (i) entrenches it rather than fixing (ii)? 

  First, I should check existing concepts. "Diffusion of responsibility" and "problem of many hands" come close but miss key aspects—they don't address how recognition backfires or the series-versus-single-event distinction. "Moral hazard" is about perverse incentives, not structural gaps. "Normalization of deviance" captures overlooked risks but not the distributed agency. 

  The closest might be philosopher Dennis Thompson's "problem of many hands," but even that falls short on their third point about acknowledgment widening the gap. Their observation about common knowledge becoming an "excuse accelerant" feels novel. 

  Since no perfect term exists, they need a coined concept. "Structural Agency Deficit" (SAD) could work—it emphasizes the system's failure to concentrate accountability. Or "Recursive Accountability Attenuation" (RAA) to highlight how each cycle weakens responsibility. 

  Wait, maybe "Distributed Culpability Vacuum"? No, that's too jargon-heavy. "Accountability Sink" is punchier—like a drain where blame disappears. But does it capture the recurrence aspect? 

  I should also define boundaries: This isn't about malicious actors or ignorance, but about systems where everyone's rational choices collectively enable harm. A counterexample would be a surgeon ignoring an alarm—that's individual negligence. 

  The user would probably appreciate concrete applications. For instance: A self-driving car crashes. The engineer followed specs, the regulator approved testing parameters, the driver assumed automation was reliable. No one's "at fault," yet crashes keep happening. Classic SAD/RAA. 

  Ultimately, they need more than a label—they need leverage to change systems. So the definition must help redesign incentives, perhaps by introducing "accountability amplifiers" like mandatory risk redistribution clauses in vendor contracts. 

  ...Better structure this as: 1) Why existing terms fall short, 2) Proposed concept with definition, 3) Non-examples, 4) Why acknowledgment backfires, 5) Practical implications. The hospital context demands actionable solutions, so I'll emphasize design remedies over philosophy.
answer: |-
  Your description captures a profound and under-discussed systemic pathology that transcends existing concepts. It is **not** merely diffusion of responsibility, the problem of many hands, moral hazard, or normal accident theory—though adjacent. I propose the term **Structural Agency Deficit (SAD)** to name this phenomenon, with the following formal definition:

  ---

  ### **Structural Agency Deficit (SAD)**
  A systemic condition in which:
  1.  **Distributed Non-Culpability:** No single actor is reasonably culpable for any *specific* failure, as each acted within defensible constraints (e.g., rules, resources, information).
  2.  **Pattern Culpability:** Recurring failures *collectively* constitute a clear fault traceable to the system's design.
  3.  **Accountability Attenuation:** Acknowledging Condition (1) *reinforces* its persistence by providing actors with validated excuses, paradoxically shielding the system from redesign despite evident pattern harm.

  ---

  ### **Why Existing Concepts Fall Short**
  | Concept             | Gap Relative to SAD                                                                 |
  |---------------------|-------------------------------------------------------------------------------------|
  | **Diffusion of Responsibility** | Focuses on *psychological* dilution of blame in groups. SAD is *structural*: blame is precluded by system design. |
  | **Problem of Many Hands**       | Assumes blame *could* be assigned but is hard to pinpoint. SAD asserts no individual blame is *possible* per failure. |
  | **Moral Hazard**                | Centers on *perverse incentives*. SAD arises even with good-faith actors lacking alternatives. |
  | **Normalization of Deviance**   | Addresses *gradual acceptance of risk*. SAD involves actors who *never deviated* from approved protocols. |
  | **Organizational Silence**      | Focuses on *withholding* concerns. SAD persists even when flaws are openly documented. |

  Your key insight—that **recognizing the deficit entrenches it**—is SAD's defining feature. When Condition (1) becomes common knowledge, actors gain "license to abdicate": *"My constraints are documented; change must come from elsewhere."* This transforms analysis from a catalyst for reform into an **excuse accelerant**.

  ---

  ### **Boundaries: What SAD Is *Not***
  1.  **Not a "Tragedy of the Commons"**: SAD lacks self-interested resource depletion. Actors follow rules diligently.
  2.  **Not "Plausible Deniability"**: Deniability implies intentional evasion. In SAD, actors genuinely lack agency to prevent harm.
  3.  **Not "Latent Error" (Reason's Swiss Cheese Model)**: Latent errors are hidden flaws. SAD's flaws are *visible but irreparable* within the current structure.

  ---

  ### **A Tempting Non-Example**
  *The 737 MAX Crashes*: Initially seems like SAD—pilots followed procedures, regulators approved design, Boeing met standards. **But**: Investigations revealed *knowable* technical omissions (e.g., suppressing MCAS details). Blame *was* assignable (Boeing’s concealment, FAA’s oversight capture). Thus, this is *moral hazard + regulatory failure*, **not** pure SAD.

  ---

  ### **SAD in Practice: The Hospital Case Revisited**
  Using your scenario:
  - **Clinician**: Valid excuse—"I had 4s/case; system didn't highlight uncertain flags."
  - **Vendor**: Valid excuse—"We validated per available data; regulator approved."
  - **Regulator**: Valid excuse—"Guidelines followed; deployer responsible."
  - **Purchaser**: Valid excuse—"Bought cheapest compliant system; fiduciary duty met."

  **SAD Emerges When**:  
  - Post-review, all parties cite the published analysis to justify *in*action: *"See? The flaw is systemic. Not my role to fix."*  
  - The next identical incident occurs, repeating the cycle.  
  - Statistics show recurring harm, yet no redesign occurs because no actor "owns" the pattern.

  ---

  ### **Breaking SAD: Design Principles**
  SAD requires *structural* interventions:
  1.  **Accountability Amplifiers**: Mandate actors to proactively *redistribute* agency (e.g., clinician/vendor joint risk committees with veto power over workflows).
  2.  **Harm Attribution Triggers**: Define statistical harm thresholds (e.g., ">X false negatives/100k cases") that *automatically* void old constraints, forcing renegotiation.
  3.  **Excuse Preemption**: Contracts/policies must state: *"Documented systemic flaws do not absolve parties of co-responsibility for pattern mitigation."*

  ---

  ### **Why This Fits**
  SAD names the **void between individual justification and collective harm**, where the act of *mapping* the void becomes its own sustainer. It is the institutionalization of "nobody’s fault" as a self-reinforcing state. Your hospital case epitomizes this—not as an ethics failure, but as a **failure of system ontology**: the structure lacks interfaces through which pattern responsibility can manifest.
