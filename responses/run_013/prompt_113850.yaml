  Below is a decision tree designed to guide you from concrete cases and commitments to a named position in the Hart-Fuller dispute and its aftermath. The tree is structured as a dichotomous key, with each node presenting a question based on a specific case, claim, or verdict. You can answer each node using only the description provided, without prior knowledge of legal philosophy labels. The key aims for logical clarity by isolating independent questions about the connection between law and morality across five locations: validity of individual norms, existence of a legal system, analysis of the concept of law, reasoning of adjudicators, and moral obligation to obey. Positions are only assigned at the leaves (endpoints), with each leaf naming the position, its most awkward commitment, and the case that would embarrass it most.

  The tree has 10 nodes and 8 leaves, covering the eight requested positions. For transparency, I note where the key fails (indistinguishable positions or unoccupied cells) in the "Key Limitations" section at the end.

  ---

  ### **Decision Tree: From Cases to Legal Philosophy Positions**

  **Node 1:** Consider a statute enacted with perfect procedural regularity (e.g., passed by a legislature, signed by an executive, and published) but with monstrous content (e.g., requiring the extermination of an ethnic group). Is this statute valid law—that is, does it create binding legal obligations for citizens and officials?  
  - **Yes** → Proceed to Node 2.  
  - **No** → Proceed to Node 3.  

  **Node 2:** Consider a legal system that is generally wicked (e.g., Nazi Germany) but contains a perfectly ordinary rule (e.g., a contract law governing sales between merchants). Is this ordinary rule valid law within the system?  
  - **Yes** → Proceed to Node 4.  
  - **No** → Proceed to Node 5.  

  **Node 3:** In the post-war West German prosecution (1950s) of the woman who denounced her husband to Nazi authorities in 1944, leading to his execution, the court rejected her defense that she acted under valid Nazi law. Was this rejection justified because the Nazi legal system as a whole failed to be a legal system (due to pervasive flaws), or because the specific denunciation law was substantively unjust?  
  - **System failure (pervasive flaws)** → **Leaf: Fuller's inner morality of law**.  
    - *Awkward commitment*: A system with substantively just rules but procedural flaws (e.g., unpublished or contradictory rules) cannot be law.  
    - *Embarrassing case*: Apartheid South Africa, which had procedural rigor but substantive injustice, yet functioned as a legal system.  
  - **Specific norm injustice** → Proceed to Node 6.  

  **Node 4:** Consider a judge in a thoroughly wicked regime (e.g., Nazi Germany) deciding a routine commercial dispute (e.g., a breach of contract between two businesses). Should the judge apply the regime's legal rules as written, without considering their moral implications?  
  - **Yes** → Proceed to Node 7.  
  - **No** → **Leaf: Dworkin's interpretivism**.  
    - *Awkward commitment*: Every legal question has a single right answer discoverable through moral interpretation of the system's history.  
    - *Embarrassing case*: A routine property dispute in a wicked regime where no coherent moral interpretation is possible without endorsing the regime's immorality.  

  **Node 5:** Why is the ordinary rule in the wicked system (Node 2) invalid? Is it because the system's pervasive procedural flaws (e.g., retroactive or contradictory rules) prevent any rule from being law, or because the rule's context in a wicked system undermines its validity despite its ordinary content?  
  - **Pervasive procedural flaws** → **Leaf: Fuller's inner morality of law** (same as Node 3 branch).  
  - **Contextual wickedness** → Proceed to Node 8.  

  **Node 6:** When a norm is invalid due to substantive injustice (from Node 3), is this invalidity triggered by any injustice or only by extreme/gross injustice?  
  - **Any injustice** → **Leaf: Classical natural law**.  
    - *Awkward commitment*: A law with minor substantive injustice (e.g., a tax law with arbitrary exemptions) is not law at all.  
    - *Embarrassing case*: A traffic law requiring driving on the right, which is arbitrary but not unjust enough to undermine validity.  
  - **Extreme/gross injustice only** → **Leaf: Radbruch-style non-positivism**.  
    - *Awkward commitment*: Moderately unjust laws (e.g., discriminatory voting laws) remain valid, creating a vague threshold for "gross injustice."  
    - *Embarrassing case*: A law enslaving a small group, which may not meet the threshold for "gross" if the system is otherwise functional.  

  **Node 7:** Consider the Fugitive Slave Act of 1850 (requiring citizens to return escaped slaves and denying them jury trials), enforced by U.S. courts. Was this statute valid law at the time?  
  - **Yes** → Proceed to Node 9.  
  - **No** → **Leaf: Radbruch-style non-positivism** (same as Node 6 branch, but applied to a single norm).  

  **Node 8:** Can a legal system exist if its rules are universally unpublished, retroactive, contradictory, and impossible to comply with (e.g., a regime where rules change hourly and contradict each other)?  
  - **Yes** → Proceed to Node 10.  
  - **No** → **Leaf: Fuller's inner morality of law** (same as Node 3 and 5 branches).  

  **Node 9:** Can the rule of recognition (the ultimate rule identifying valid laws) incorporate moral criteria—e.g., a constitutional clause stating, "No law is valid if it violates human dignity"?  
  - **Yes** → **Leaf: Soft (inclusive) positivism**.  
    - *Awkward commitment*: The same norm may be valid in one system (if it passes moral tests) but invalid in another (if it fails), despite identical social facts.  
    - *Embarrassing case*: A privacy law valid in Canada (due to moral criteria) but invalid in the U.S. (without them), despite similar texts and contexts.  
  - **No** → **Leaf: Exclusive positivism (Raz)**.  
    - *Awkward commitment*: Moral criteria in a rule of recognition are not part of law but a gatekeeping test; judges using them are acting beyond the law.  
    - *Embarrassing case*: A judge applying a constitutional "human dignity" clause must treat it as a non-legal moral test, undermining its authority.  

  **Node 10:** Is the core dispute about whether unjust norms are "law" primarily terminological—i.e., does it distract from the real moral question of obedience?  
  - **Yes** → **Leaf: Deflationary view**.  
    - *Awkward commitment*: Calling a norm "law" has no bearing on practical reasoning; only moral obligation matters.  
    - *Embarrassing case*: A lawyer advising a client in a wicked regime must use "law" descriptively (e.g., "Nazi law requires X"), contradicting the claim that the label is idle.  
  - **No** → **Leaf: Hart's positivism**.  
    - *Awkward commitment*: A legal system can exist and impose obligations even if it lacks moral merit or a minimum moral content.  
    - *Embarrassing case*: A purely evil regime with stable rules (e.g., a well-organized slave state) is still a legal system, weakening the moral critique.  

  ---

  ### **Key Limitations**
  1. **Indistinguishable Positions**:  
     - **Fuller's inner morality of law** appears in three branches (Nodes 3, 5, and 8) but always leads to the same leaf. The key cannot distinguish between Fuller's focus on systemic procedural flaws and other positions without collapsing into circularity.  
     - **Radbruch-style non-positivism** appears in two branches (Nodes 6 and 7) but is identical in both. The key cannot isolate Radbruch's view to one context (individual norm vs. system) without presupposing labels.  
     - **Hart's positivism** and **soft positivism** share the same path until Node 9. If you answer Node 10 "no," Hart is the default; the key cannot differentiate Hart's early views from soft positivism without asking about the "minimum content of natural law" (a question that requires prior knowledge).  

  2. **Unoccupied Cells**:  
     - **System exists, but validity requires moral merit for individual norms; moral obligation disconnected**: This combination (e.g., "Only just laws are binding, but the system exists even if unjust") is incoherent. If validity requires moral merit, the system cannot exist with unjust norms.  
     - **Concept of law is interpretive, but moral merit never affects validity**: Unattractive, as it severs Dworkin-style interpretation from outcomes (e.g., judges interpret morally but must uphold monstrous laws).  
     - **Law claims moral authority, but obligation to obey is always disconnected**: Unexplored, as it implies law necessarily lies about its own authority.  

  3. **Overlooked Distinctions**:  
     - The "minimum content of natural law" (Hart's claim that any lasting system must have rules against violence or theft) does not appear because it is descriptive, not a validity condition, and no node isolates system durability.  
     - Moral obligation to obey is only indirectly tested (e.g., Node 4 judges), missing positions that treat obedience as central.  

