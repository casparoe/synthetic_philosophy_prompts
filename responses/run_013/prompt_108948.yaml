prompt: |-
  I'm a fourth-year PhD student (philosophy, but I spend half my time lurking in a psych lab), and I'm trying to figure out what I actually think about moral worth — going by gut on cases instead of by what the literature says I should think. I'm sick of the shopkeeper and Huck Finn, so these are all mine. Verdicts, as honestly as I can report them:

  - Locksmith. A locksmith I know charges pensioners and broke students less, landlords full price. Asked why, he says he couldn't stand to be the sort of person who gouges a pensioner. He doesn't seem to care about the pensioners as such and wouldn't cross the street for one otherwise. I give this full credit. Genuinely good, whatever the worth amounts to.
  - Donor. Someone gives away most of her savings to a famine charity, and when you press her she says she does it because it makes her feel like a good person. No audience, no reputation, no glow she can point to beyond that. This strikes me as hollow. Right act, something missing. And I can't say what, because the locksmith is also in it for the self-image.
  - Late-night drive. I drove a neighbour to the emergency room at 3am because she asked and it was obviously needed, and I'd have done it for anyone. But if she'd asked me for a lift to the airport at 3am I'd have said no. I think the hospital drive has full moral worth, and that the airport lift (had I given it) would have had none, even though in both the thing moving me is "she asked, and it's a big deal for her".
  - Promise. A manager honours a promise to a departing employee at real cost to the company, purely because she promised, and she'd much rather not. Full credit.
  - Paperwork manager. Same action, same cost, but he honours it because breaking it means a legal mess he doesn't want. No credit. The employee can't tell the difference and gets the same thing either way.
  - Two motives. A student hands in a wallet she found. She's partly honest and partly afraid of the cameras, and either motive alone would have sufficed. I want to say she gets most but not all of the credit — which feels like it can't be right, since the honest motive was there at full strength.
  - Convert. A man stops cheating on his taxes after a religious experience. Asked why, he says God would know, and he can't really say more; he has no view about why cheating is wrong. I want to give him credit, and I notice I'm giving it for the wrong thing, since God's knowing isn't the fact that makes cheating wrong.
  - Fragile virtue. Someone donates a kidney to a stranger, moved entirely by the stranger's need. But if the surgery had been booked for a day with a big work deadline, she'd have backed out. I feel this is worth less than the same donation from someone who'd have gone through with it, even though the motive in the moment is identical.

  The principle I keep reaching for: an action has full moral worth when the feature that makes the act right is the feature doing the motivating — the act wouldn't have happened if the agent hadn't registered that feature. Call it the operative-motive view. Test it against the above. I already know it dies on the locksmith and the convert, but I don't know whether the repair is to loosen "operative motive" (say, the motive has to be *responsive* to the right-making feature rather than identical with it) or to give up on the single-condition idea and go for two or three clauses (motive, plus counterfactual robustness, plus the agent's own grasp of why it's right). If it needs clauses, fine, I'd rather have the ugly truth then a tidy falsehood — but tell me which clause is doing the real work and which is decoration.

  Then tell me what your principle says about a case I haven't listed: someone does the right thing from a decent motive, but the motive rests on a false belief. She stays with a dying friend because she thinks the friend has nobody else, when in fact the family is already on the way. Right act, decent motive, wrong picture of the world. Credit or not?

  And please say how confident you are in each thing you claim, and single out the one point you're least sure of. I'd rather have your uncertainty than a clean verdict.
reasoning: |-
  Okay, let me start by really understanding what this PhD student is asking. They're in philosophy but spending time in a psych lab, so they're probably blending empirical insights with theoretical ethics. They're tired of the standard thought experiments like the shopkeeper and Huck Finn, which tells me they want fresh, real-world cases to test their intuitions. Their goal is to figure out their own view on moral worth, independent of the literature, which is a brave and challenging endeavor.

  Looking at their cases, they've provided eight scenarios, each probing different facets of moral motivation and worth. The key themes seem to be: the role of self-interest vs. altruism, the importance of counterfactual robustness, the agent's understanding of the right-making feature, and how motives relate to the actual moral reasons. Their proposed "operative-motive view" is a version of the standard Kantian idea that moral worth requires acting from the motive of duty, but they're noticing it doesn't fit all their intuitions—especially in cases like the locksmith and the convert.

  Breaking down their cases:  
  - The locksmith acts from a desire to avoid being a bad person, not directly from concern for pensioners, yet they give full credit.  
  - The donor acts for self-satisfaction, which feels hollow despite the right action.  
  - The hospital vs. airport drive highlights how the context (emergency vs. inconvenience) affects worth, even with similar surface motives.  
  - The promise cases show that honoring a promise for its own sake has worth, while avoiding legal trouble does not.  
  - The two-motive wallet return suggests partial credit, complicating purity of motive.  
  - The convert acts from fear of divine punishment, not understanding why cheating is wrong, yet deserves credit.  
  - The fragile virtue kidney donation loses worth because it wouldn't hold under minor pressure.  

  Their puzzle is that the operative-motive view works for some cases (donor, paperwork manager) but fails for others (locksmith, convert). They're considering two fixes: loosening "operative motive" to require responsiveness rather than identity, or adding clauses like counterfactual robustness or the agent's grasp of moral reasons. They also want to test a new case involving false beliefs.  

  My thoughts:  
  The responsiveness tweak might handle the locksmith (his motive is responsive to exploitation being wrong) and the convert (responsive to cheating being wrong, via God). But it struggles with the fragile virtue case—the motive is responsive to the stranger's need, yet feels less worthy due to lack of robustness. This suggests robustness isn't just decorative; it might be necessary for full worth. The false-belief case further tests whether responsiveness suffices without true belief.  

  Their least confident point will likely be about the convert case—how can fear of divine punishment confer worth if the agent doesn't grasp the moral reason? But intuitively it does, so perhaps responsiveness plus external tracking of moral truth (even if not understood) is enough.  

  For the false-belief case: staying with a dying friend based on false belief about family absence. The motive (care for the friend) is decent and responsive to a right-making feature (alleviating loneliness), but the actual right-making feature (respecting the friend's wishes, or family's imminent arrival) isn't the motivator. This feels like partial credit—less than full worth, but not hollow like the donor.  

  Overall, a hybrid view seems necessary: moral worth requires (1) a motive responsive to a right-making feature, (2) that the feature tracked is *actually* morally relevant (which handles the convert), and (3) some degree of counterfactual robustness. The fragility of robustness as a requirement needs weighing—it might be scalar, not binary.  

  I'll need to organize these thoughts into a coherent response, flagging uncertainties and prioritizing clarity over false tidiness. The student values honesty about doubts, so I'll highlight where my reasoning feels shaky.
answer: |-
  I'm genuinely impressed by your cases—they're fresh, psychologically real, and expose fault lines in standard theories. Your operative-motive view (OMV) is a solid Kantian/Scanlon-style starting point: moral worth requires that the *right-making feature itself* motivates the action (e.g., "it's a promise" moves the manager, not "avoiding legal trouble"). But your intuitions reveal deeper structure. Let's autopsy OMV against your cases, then build a better principle. I'll flag confidence levels (1-10, 10=rock-solid) and end with your false-belief case.

  ### Where OMV Works (and Why)
  - **Donor (Hollow)**: OMV nails this. The right-making feature is "alleviating famine suffering," but her motive is "feeling like a good person." These aren't identical or even responsive. *Confidence: 9/10*.
  - **Paperwork Manager (No Credit)**: Right act, but motivated by "avoiding legal mess," not "keeping a promise." OMV correctly denies worth. *Confidence: 10/10*.
  - **Promise Manager (Full Credit)**: Motivated purely by "I promised." Since promise-keeping *is* the right-making feature here, OMV grants full worth. *Confidence: 9/10*.

  ### Where OMV Fails (and What That Reveals)
  - **Locksmith (Full Credit)**: OMV dies because he's not motivated by "not exploiting the vulnerable." He's motivated by *self-image* ("I couldn’t stand to be that person"). Yet you feel he’s fully good. **Repair**: Loosen OMV to *responsiveness*. His motive (avoiding self-disgust) is *tracking* the right-making feature (exploitation is wrong) even if he’s not directly moved by it. He’s responsive to the moral landscape. *Confidence in repair: 8/10*.
  - **Convert (Credit Despite Wrong Reason)**: He’s motivated by "God would know," not "tax evasion is unjust." OMV denies worth, but you grant credit. **Repair**: Motive must be *counterfactually dependent* on the right-making feature. If he learned God didn’t care, he’d cheat; but if he learned cheating *wasn’t wrong* (e.g., taxes fund genocide), he’d still stop? Unclear, but his motive *accidentally tracks* the moral truth. Responsiveness + external tracking might save it. *Confidence: 6/10* (this case is messy).
  - **Two Motives (Partial Credit)**: OMV struggles because *one* sufficient motive is the right feature (honesty), but it’s diluted by fear. **Repair**: Moral worth requires the right-making feature to be *non-redundant*—if removing it would change the action, it gets "credit." Here, honesty alone suffices, so it *should* get full credit, yet you feel it’s partial. This suggests a *robustness* clause: worth diminishes if the right motive isn’t *sufficiently decisive*. *Confidence: 7/10*.

  ### Where OMV is Ambiguous (and Needs Clauses)
  - **Late-Night Drive**: Hospital drive has worth; airport doesn’t. Your motive ("she asked, it’s a big deal") is identical, but context changes the right-making feature. For the hospital, the need is *emergent/serious*; for the airport, it’s not. OMV could work if you specify the feature: you’re motivated by "alleviating acute distress" (hospital) vs. "accommodating convenience" (airport). But your description suggests the *same* motive. **Repair**: Add *agent’s sensitivity*: you’re subconsciously weighing the stakes. Worth requires correctly *diagnosing* the right-making feature’s weight. *Confidence: 7/10*.
  - **Fragile Virtue (Less Credit)**: Motive is identical ("stranger’s need"), but worth drops because it’s not robust. OMV can’t explain this—the right feature *is* motivating. **Death of OMV**: This kills the idea that motive-in-the-moment is sufficient. A **counterfactual robustness clause** is essential: the motive must be stable under modest pressure (e.g., work deadlines). *Confidence: 9/10*.

  ---

  ### Your Proposed Principle: Revised and Claused
  Your instinct is right—OMV needs more than one clause. After testing against your cases, I propose:

  **An action has full moral worth iff:**  
  1. **Responsive Motive**: The agent is *motivated* by a feature F of the act,  
  2. **Moral Tracking**: F is *either* (a) the objective right-making feature, *or* (b) a proxy that dependably tracks it (e.g., self-image for anti-exploitation, God’s knowledge for cheating’s wrongness),  
  3. **Non-Redundancy**: F is a *non-redundant* part of the motivation (if F were absent, the act wouldn’t occur, *holding other motives fixed*),  
  4. **Robustness**: The motivation would persist under *reasonable counterfactuals* (e.g., minor competing desires).  

  **Why these clauses?**  
  - (1) *Replaces* "operative motive" with *responsiveness* (handles Locksmith).  
  - (2) Allows *indirect tracking* (saves Convert, explains why "God’s knowledge" works—it’s a stand-in for moral truth).  
  - (3) Solves Two Motives: the honest motive gets full credit if it’s non-redundant (if fear were gone, honesty alone would suffice).  
  - (4) Required by Fragile Virtue: worth demands some motivational stability.  

  **What’s core?** (1) and (2) are essential; (3) and (4) are "amplifiers" that modulate *degree* of worth. Without (1)+(2), you lose moral connection; without (3)+(4), you get fragility/hollowness.  

  ---

  ### Your False-Belief Case: "Staying with a Dying Friend"
  - **Scenario**: She stays because "my friend has nobody else" (motivated by preventing abandonment). In reality, family is en route—preventing abandonment *isn’t* the right-making feature (comforting the friend *is*, or respecting their wishes).  
  - **Verdict**: **Partial credit, not full worth**.  
    - (1) **Responsive Motive?** Yes—she’s motivated by F = "preventing abandonment."  
    - (2) **Moral Tracking?** No. F is *false* and not a reliable proxy. The actual right-making feature (e.g., "providing comfort") isn’t tracked; she might leave if she knew family was coming.  
    - (3) **Non-Redundancy?** Likely—without believing she’s the only one, she might not stay.  
    - (4) **Robustness?** Probably stable.  
  - **Why partial credit?** Her motive is *good* (care, loyalty) and responsive to *a* moral consideration (abandonment is bad), but it misfires. Like the Convert, her heart is in the right place, but she misreads the facts. Less worthy than the Promise Manager, more worthy than the Donor. *Confidence: 8/10*.

  ---

  ### Least Confident Point: The Convert (6/10)
  I’m least sure about **why the Convert deserves credit**. My "tracking" clause (2b) feels ad hoc—does *any* motivation that accidentally aligns with morality confer worth? What if he stops cheating because "cheaters have bad luck"? That might not track moral truth reliably. Yet your intuition demands credit, so I’m forcing a fit. Maybe it’s about *sincerity* or *effort*, not just tracking. This gnaws at me.

  ### Final Thoughts
  Your cases suggest moral worth isn’t unitary. It’s a cluster: **responsiveness + moral accuracy + resilience**. The literature’s obsession with "duty as motive" is too narrow—your Locksmith shows self-image can be virtuously responsive, and Fragile Virtue shows purity isn’t enough. If you want the ugly truth: drop the "single-condition" hope. But your operative-motive view isn’t dead—it’s the skeleton we’ve fleshed out with clauses.  

  If you test this further, probe:  
  - How *reliable* must "tracking" be? (Convert vs. lucky guessers)  
  - Is robustness *scalar*? (Fragile Virtue vs. saints)  
  Your psych lab instincts are showing—this feels like a cognitive science of moral judgment. I’d love to hear where you land.
