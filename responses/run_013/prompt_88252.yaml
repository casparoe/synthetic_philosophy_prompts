answer: |-
  Here's a comprehensive exam question, model answer, and marking scheme designed to force engagement with the dialectical moves and logical structure of Gongsun Long's *White Horse Dialogue*, while avoiding rote summaries.

  ---

  ### Exam Question: Gongsun Long’s *White Horse Dialogue* (白馬論)

  **Background:** In the *White Horse Dialogue*, the Advocate (A) argues that "a white horse is not a horse" (白馬非馬). A key segment of the argument focuses on what happens when we *request* something:  
  - When you ask for a horse (求馬), you may receive a yellow or black horse (黃黑馬皆可致).  
  - When you ask for a white horse (求白馬), you may *not* receive a yellow or black horse (黃黑馬不可致).  
  A concludes that what is being sought in these two requests is not the same (所求異), implying that "horse" (馬) and "white horse" (白馬) designate distinct things.  

  **Supplied Reconstruction:** Let us define two terms as **interchangeable** if and only if:  
  > (i) Every request that can be answered using one term can be answered using the other, and  
  > (ii) Every request that *cannot* be answered using one term *cannot* be answered using the other.  

  The test shows "horse" and "white horse" are **not interchangeable** (e.g., a request for "a horse" *can* be satisfied by a yellow horse, but a request for "a white horse" *cannot*). Thus, A argues they designate different things (非馬).  

  **Your Task:**  
  1. Does this reconstruction successfully prove A’s thesis that "a white horse is not a horse" (白馬非馬)? Or does it only prove the weaker claim that the terms are not synonymous? Justify your view using the dialogue’s moves.  
  2. If the thesis is stronger than "not synonymous," what must "非" (is not) mean for the claim to be substantive? How does this reading handle the Objector’s (O) rebuttal: "If there is a white horse, we cannot say there is no horse" (有白馬不可謂無馬也)?  
  3. The same test would show "brown horse is not a horse" (黃馬非馬) or "horse is not an animal" (馬非動物). Does this overgeneration undermine A’s argument? Why or why how?  

  **Focus:** Engage with the *logic of requests* and *designation*. You may reference later sections (e.g., colored vs. colorless horses) if relevant, but the core analysis must center on the interchangeability test.  

  ---

  ### Model Answer (700 words)

  The supplied reconstruction captures a central move in Gongsun Long’s *White Horse Dialogue*: grounding meaning in what a term can *designate* in response to requests. When A notes that asking for a horse permits yellow/black horses but asking for a white horse excludes them, they highlight a functional divergence between the terms. The interchangeability test rigorously formalizes this: if "horse" and "white horse" were identical in designation, they should satisfy the same requests. Their failure proves they are not interchangeable. However, this reconstruction alone does **not** prove A’s thesis that "a white horse is not a horse"; it only proves that the terms are not synonymous. The thesis requires a stronger reading of "非" (is not), and the overgeneration problem exposes logical tensions in A’s framework.  

  **1. The Interchangeability Test Proves Non-Synonymy, Not Non-Identity**  
  The test successfully shows that "horse" and "white horse" are not synonymous (i.e., they do not have the same extension or intensional rules). As A observes, "horse" designates a broader category (shape/form) while "white horse" designates a compound of shape and color. The Objector (O) implicitly accepts this non-synonymy when conceding that "white horse" combines color and shape. Crucially, however, non-synonymy does not entail non-*identity*. In everyday language, "a white horse is a horse" asserts class inclusion (a white horse instantiates the category "horse"), not synonymy. The test proves the terms are functionally distinct but not that a white horse *fails to be* a horse. Thus, the reconstruction only delivers what O could grant: "white horse" and "horse" are not interchangeable labels, but a white horse remains a subset of horses.  

  **2. "非" as Non-Identity and O’s Rebuttal**  
  For A’s thesis to be substantive—not a trivial wordplay—"非" must mean **non-identity**: a white horse is *not identical to* the category "horse." This reading aligns with A’s focus on designation: "horse" picks out the abstract category (馬者，所以命形也), while "white horse" picks out a concrete compound (白者，所以命色也). Under this view, O’s rebuttal ("If there is a white horse, we cannot say there is no horse") confuses *identity* with *instantiation*. A would respond: the existence of a white horse implies the existence of a horse only if we conflate the compound object with the abstract category. For A, the white horse *contains* "horse" as a component but is not identical to it (like how "white horse" contains "white" but is not "white" itself). O’s objection thus fails because it assumes that designation implies identity, whereas A treats designation as compositional.  

  **3. Overgeneration: A Feature, Not a Bug?**  
  The test *does* overgenerate: "brown horse is not a horse" and "horse is not an animal" follow identically. Brown horses satisfy requests for "horse" but not "brown horse," and horses satisfy requests for "animal" but not "horse" (if we request "an animal," a fish might suffice, but "horse" excludes fish). Far from undermining A, this reveals the argument’s radical implications. A likely accepts these conclusions, as they later argue all compound terms (e.g., colored horses) designate uniquely. For A, "brown horse" is a compound entity distinct from "horse," just as "white horse" is. The overgeneration is consistent with A’s view that language fractures reality into discrete designata. Yet this invites O’s skepticism: if *every* specification creates a new non-identical entity, language loses its connective function. A might counter that only *specific compounds* (色形合) are irreducible, but the dialogue’s unresolved end (on colored/colorless horses) suggests this tension remains.  

  **Conclusion**  
  The interchangeability test proves non-synonymy but not A’s strong non-identity thesis. For "白馬非馬" to assert non-identity, "非" must denote a failure of categorical identity, not mere predication. This reframes O’s rebuttal as a category error: confusing an instance with its category. While overgeneration seems absurd, it coheres with A’s granular view of language, where each compound term designates a unique "thing." The argument’s power lies in exposing how functional designation challenges naive class inclusion—but its cost is a fragmented ontology where "a horse" ceases to be "an animal."  

  ---

  ### Marking Scheme (Total: 25 points)  
  **Award 5 points for each criterion fully addressed. Deduct 1–2 points per criterion for partial/incomplete treatment.**  

  1. **Interchangeability Test & Non-Synonymy**  
     - *Must-hit:* Explain how the test shows "horse" and "white horse" are not synonymous.  
     - *Common miss:* Claims the test proves the thesis directly without distinguishing synonymy from identity.  

  2. **Gap Between Non-Synonymy and the Thesis**  
     - *Must-hit:* Argue that the test alone proves non-synonymy but not "white horse is not a horse" (non-identity).  
     - *Common miss:* Equates non-synonymy with non-identity or conflates class inclusion with designation.  

  3. **Interpretation of "非" and Handling O’s Rebuttal**  
     - *Must-hit:* State that "非" must mean non-identity for the thesis to be strong; show how O’s rebuttal confuses instantiation with identity.  
     - *Common miss:* Reads "非" as "is not a" (predication) without addressing A’s compositional designatory logic.  

  4. **Overgeneration Analysis**  
     - *Must-hit:* Acknowledge that the test implies "brown horse is not a horse," and argue whether this strengthens or weakens A’s case.  
     - *Common miss:* Dismisses overgeneration as absurd without considering A’s likely acceptance of it.  

  5. **Dialectical Engagement & Textual Fidelity**  
     - *Must-hit:* Use specific moves from the dialogue (e.g., 求馬/求白馬 contrast, 形/色 composition) to justify claims.  
     - *Common miss:* Relies on the "three paragraphs" summary instead of the request logic or wanders into unrelated sections.  

  ---

  ### Handling "It’s Just a Pun About Chinese Articles" Answers  
  **Score: 5–10/25** (specifically: 5 if *only* this claim is made; up to 10 if weakly engaged with the text).  
  - **Why:** This response fails criterion #5 entirely and ignores the supplied reconstruction. It dismisses the argument as linguistic trivia without engaging the logical structure (interchangeability, designation) or dialectical moves. It may note classical Chinese lacks articles but does not explain *how* this affects the request test or the meaning of "非." The score reflects minimal credit for surface-level awareness without analysis.  

  ---

  ### Design Notes  
  - **Anti-Rote Measure:** The supplied reconstruction forces students to engage with *your* framework (interchangeability), blocking canned summaries.  
  - **Balanced Rigor:** Logicians must tackle designation/identity; sinologists must handle textual moves (求馬, 命形/命色).  
  - **Time-Appropriate:** 75 minutes allows for 10–15 min planning and 60 min writing (700 words = feasible).  
  - **No Secondary Lit:** Focuses on primary text logic—no need for Chad Hansen or Graham references.  
  - **Overgeneration as Key:** Forces students into A’s radical worldview or critical evaluation of it.  

  This setup ensures students grapple with the *philosophical* stakes: how language maps to reality through requests, and whether distinctions in designation imply ontological fractures.
