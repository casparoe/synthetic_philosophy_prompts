prompt: |-
  I'm a novelist, not a political theorist, so forgive me, but I've been going around in circles on this and I need someone to tell me what I actually believe. Here are my gut reactions to a pile of cases about how we pick the people who govern us. (1) A friend pitched me his idea: fill a second chamber by lottery. Pull, say, three hundred names off the voter roll, they serve two years, they can never be pulled again, and they get real power over legislation. My honest reaction was that I'd probly take that over what we've got now. (2) Then he said the same lottery could decide whether we go to war, and I felt physically ill. Same people, same mechanism, same binding authority, and yet one of those I'd sign tomorrow and the other I'd chain myself to a fence over. (3) Juries. Random citizens, zero expertise, power over whether a stranger loses the rest of his life. Completely fine with it, have never once lost sleep over it. (4) A one-term limit for legislators: in, serve six years, out forever, never on a ballot again. I'm for it. (5) But a surgeon who's done the same operation for thirty years, or a bridge engineer, or honestly a novelist, I obviously want the veteran and not a rotation of fresh faces. I don't think politics is somehow exempt from that, so I can't tell you why I want the term limit for the senator and not for the surgeon. (6) Here's the one I keep flipping on. Compulsory service, like jury duty except for the legislature: everyone gets drafted once, three years, you can't recieve a pass and you can't run again afterward. Half of me thinks it fixes everything, no career, no donors, no ladder to climb. Half of me thinks it's jury duty for people who'd rather be anywhere else, deciding things they'll never have to answer for. (7) Small one to finish: I think a president should be barred forever from a second non-consecutive term, but I think a mayor who's doing a great job should be able to serve four or five terms if the voters keep wanting her, and I have no idea how to square those two.

  So is there a principle behind this pile, or a couple of candidate principles I could choose between? What do they say about the cases I haven't thought about, like a lottery-selected body that can only propose and never decide, or a term limit on judges? And be honest about which of my verdicts the principle has to throw overboard, because I suspect at least one of them is just sentiment wearing a costume.
reasoning: |-
  Okay, let me start by unpacking this novelist's dilemma. They're grappling with seemingly contradictory gut reactions to different governance mechanisms. The core tension seems to be between valuing ordinary citizens' input in some contexts (like juries or legislative lotteries) while recoiling from it in others (like war decisions). 

  Hmm, the term limit contradictions are particularly interesting. They approve of legislative term limits but reject them for surgeons/novelists, while making a nuanced distinction between presidents and mayors. That suggests expertise vs. accountability might be key variables. 

  The compulsory service idea is where their ambivalence peaks - they see both the anti-corruption benefits and the risks of disengaged participants. This feels like the crux: can we design systems that leverage civic duty without demanding unrealistic expertise?

  I notice they're self-aware about potential inconsistencies ("sentiment wearing a costume"). That's helpful. The challenge is finding principles that either reconcile these positions or force hard choices. 

  Let me map their reactions:
  - Pro: Citizen juries, legislative lotteries, legislative term limits, mayoral re-elections
  - Anti: War lotteries, unlimited expert terms, presidential comebacks
  - Mixed: Compulsory service

  The war lottery aversion stands out. Why is randomly deciding war different than randomly convicting someone? Both have irreversible consequences. Maybe scale of impact? Or the anticipatory nature of war decisions? 

  For term limits, the distinction might hinge on immediacy of consequences: a surgeon's mistake kills now, a legislator's bad policy kills slowly. But that feels weak. Perhaps it's about corrective mechanisms - voters can't easily undo bad laws like hospitals can fire surgeons.

  The mayor/president split suggests scale matters too. Local politics allows clearer accountability through personal reputation, while national office requires stronger guardrails against power consolidation.

  Compulsory service... that's the toughest. The "jury duty for legislation" analogy breaks down because jurors decide concrete facts, while legislators create abstract rules. Forcing disinterested people to write laws could be catastrophic. But their instinct that it prevents corruption isn't wrong - just maybe not worth that tradeoff.

  Emerging principles: 
  1. Citizen input works best when constrained (juries follow laws, lotteries propose but don't decide)
  2. Expertise matters most where errors are irreversible/immediate (surgery > legislation)
  3. Accountability mechanisms weaken with scale (mayors < presidents)
  4. Anti-corruption measures shouldn't override competence minimums

  The war lottery reaction might be the "sentiment wearing costume" here. If we trust random citizens to imprison people, why not trust them on war? Unless... perhaps because war requires anticipatory judgment while juries assess past facts? That distinction could hold.

  For compulsory service, the principle would demand either: accept it with training (like jury orientation) or reject it as dangerously unconstrained. Their gut splits the difference because both concerns are valid.

  Term limits for judges? Under these principles: judicial errors are high-stakes and irreversible (like surgery), so expertise matters. But judicial corruption is catastrophic too. So maybe long non-renewable terms? That aligns with their legislative term limit view while respecting expertise.
answer: |-
  Your instincts reveal a coherent (if tension-filled) political philosophy centered on **distrust of concentrated power balanced against the need for competent decision-making in high-stakes domains**. The contradictions arise because different governance tasks demand different combinations of **legitimacy, expertise, accountability, and anti-corruption safeguards**. Here's the framework:

  ### Core Principles Behind Your Reactions:
  1.  **Anti-Oligarchy Principle:** You distrust permanent political elites. Mechanisms like legislative lotteries, term limits, and compulsory service prevent power consolidation and donor capture.
  2.  **Competence Threshold Principle:** You demand *minimum competence* for decisions with irreversible, catastrophic consequences or requiring deep expertise (war, surgery, engineering).
  3.  **Constrained Mandate Principle:** Citizen bodies work best with **limited scope, defined rules, or oversight** (juries follow laws/judges, a proposing-but-not-deciding lottery body).
  4.  **Scale & Accountability Principle:** Direct accountability works better at smaller scales (mayors) and deteriorates with size/complexity (presidents/national legislatures). Lack of accountability (e.g., compulsory legislators not answering to voters) is dangerous.
  5.  **Irreversibility Aversion:** You recoil from high-stakes, permanent decisions (war, life imprisonment) made by bodies lacking both expertise *and* direct accountability.

  ### How the Principles Explain Your Reactions:
  *   **(1) Legislative Lottery (Pro):** Satisfies *Anti-Oligarchy*. The *Competence Threshold* for *deliberative* lawmaking (which can be amended) is lower than for immediate execution. A constrained body (one chamber) mitigates risk.
  *   **(2) War Lottery (Anti):** Violates the *Competence Threshold* (complex strategy, intelligence) and *Irreversibility Aversion*. War is execution, not deliberation, with catastrophic, permanent consequences. Lacks *Constrained Mandate*.
  *   **(3) Juries (Pro):** Exemplify *Constrained Mandate*. They judge specific facts under strict rules guided by a judge (expertise proxy). Focuses on past acts, not future strategy. Meets a sufficient *Competence Threshold* for fact-finding within this framework.
  *   **(4) Legislative Term Limits (Pro):** Primarily serves *Anti-Oligarchy*. Assumes the *Competence Threshold* for legislating is manageable within a single term + institutional knowledge (staff, committees).
  *   **(5) Expertise in Professions (Anti-Term Limits):** Highlights the *Competence Threshold*. Surgery, engineering, and even novel-writing require deep, iterative learning. Errors can be immediate and catastrophic (surgery) or erode quality (novels). Politics is seen as having a lower *Competence Threshold* for entry (but see conflicts below).
  *   **(6) Compulsory Legislative Service (Mixed):**
      *   *Pro Side:* Ultimate *Anti-Oligarchy* move. Eliminates careers, donors, ladders.
      *   *Con Side:* Violates *Competence Threshold* (complex policy) and *Accountability* (no re-election incentive, no consequences post-service). Creates *Irreversibility Aversion* for laws affecting millions. Feels like unconstrained juries making policy.
  *   **(7) President vs. Mayor Term Limits:** Reflects the *Scale & Accountability Principle*.
      *   *President (No Comebacks):* National scale weakens direct accountability. A former president seeking return wields massive undemocratic influence, bypassing normal political checks (*Anti-Oligarchy*). Risk of personality cults.
      *   *Mayor (Pro-Long Service):* Local scale enables stronger voter accountability. Performance is more visible. Expertise in local governance is valuable (*Competence Threshold* met by experience + accountability).

  ### Candidate Principles You Might Adopt:
  1.  **"Citizens Deliberate, Experts Execute (and Judges Oversee)" Principle:**
      *   Random citizens/lotteries are best for **deliberative bodies setting broad rules/priorities** (like a proposing chamber) or judging **past facts under strict rules** (juries).
      *   Elected officials (with experience) or appointed experts are best for **executive action, complex strategy, or technical implementation** (war, infrastructure, agencies).
      *   Judges (with life tenure for independence) are best for **oversight and applying rules**.
      *   *Explains:* Proposing lottery (deliberate), anti-war lottery (execute), pro-juries (judge facts), pro-mayoral experience (local execution). *Throws Overboard:* Pure compulsory legislature (forces citizens to execute policy).

  2.  **"Accountability Scales Down, Constraints Scale Up" Principle:**
      *   Direct democracy/weak constraints (long mayoral terms, local votes) work best **where impact is localized and accountability is direct**.
      *   As power/scale increases, **stronger constraints** are needed: term limits, oversight bodies (courts, second chambers), lotteries *only* for deliberation, stricter rules for executive action.
      *   *Explains:* Mayor (low scale, high accountability = fewer constraints) vs. President (high scale, weaker accountability = strict term limits). Proposes lottery (constrained role). *Throws Overboard:* Legislative term limits *if* you believe local accountability is sufficient for state/national legislators (you clearly don't). Might soften your war lottery stance *if* the lottery body only declared broad principles for war (e.g., "Defensive war only") but not specific engagements.

  ### Applying the Principles to New Cases:
  *   **Lottery Body (Propose Only):** Strongly aligns with your instincts (*Constrained Mandate Principle*, *Citizens Deliberate*). It harnesses anti-oligarchy without risking high-stakes execution. You'd likely support this firmly.
  *   **Term Limits for Judges:** Creates tension. *Anti-Oligarchy* supports limits to prevent a permanent judicial caste. But *Competence Threshold* (complex law) and *Irreversibility Aversion* (need for finality, protection from political pressure) favor independence/experience (life tenure or very long terms). Given your jury/proposing lottery stance, you'd likely **oppose term limits for judges**, prioritizing competence/irreversibility over anti-oligarchy here. Your jury comfort shows you trust constrained citizen judgment on facts, but want *expert* judgment on complex law application.
  *   **Lottery for Constitutional Amendments:** High stakes (irreversible), requires deep deliberation. *Citizens Deliberate Principle* supports a citizen assembly for *proposing* amendments. *Competence Threshold/Irreversibility* demands a high bar for *ratification* (e.g., supermajority vote). Likely a cautious yes.

  ### The Verdict to Reconsider:
  Your **war lottery aversion is the most consistent** with your principles (Competence Threshold, Irreversibility Aversion). The principle likely *doesn't* force you to throw it overboard.

  **The sentiment potentially "wearing a costume" is your unconflicted support for *legislative* lotteries/term limits vs. expertise.** Your strong belief in expertise for surgeons/novelists *does* conflict with dismissing it for legislators. The principle forces a choice:
  1.  **Acknowledge the Conflict:** Admit legislating *does* require significant expertise (policy, negotiation, process), but argue that the *corruption/entrenchment risk* (Anti-Oligarchy) is so high that term limits/lotteries are worth the trade-off in expertise. (This is likely your core position).
  2.  **Re-evaluate Legislative Expertise:** Consider if mechanisms exist to *combine* citizen voice with necessary expertise within a lottery/term-limited system (e.g., robust non-partisan staff, expert testimony requirements, mandatory training for lotteried members).

  ### Conclusion
  You believe deeply in breaking elite power (*Anti-Oligarchy*) and value the legitimacy of ordinary citizens, **but only when their power is carefully channeled** (*Constrained Mandate*) **and doesn't exceed a tolerable threshold of required competence/accountability for the stakes involved** (*Competence Threshold, Irreversibility Aversion, Scale & Accountability*). Your discomfort arises when mechanisms designed to combat oligarchy (lotteries, compulsory service) threaten to make decisions exceeding that competence threshold or lacking accountability, especially with irreversible consequences. You trust citizens to judge facts (juries) and set broad directions (proposing chamber), but not to execute complex, high-stakes strategies (war) or make policy without safeguards (pure compulsory legislature). This is a robust, pragmatic foundation for democratic design.
