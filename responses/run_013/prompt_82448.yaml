prompt: |-
  I'm a novelist and there's something about my own writing I don't have a word for, so I'm hoping you can either give me the name or tell me there isn't one.

  I've never seen snow fall. Grew up somewhere it doesn't, never been anywhere cold in winter. But I've written snow into three books now and the snow passages are the ones readers quote back at me — they swear they can feel it. I don't feel like I'm faking it either. I know how snow sits in a sentence: which snow words go with which moods, that snow in a love scene and snow in a death scene want different verbs. What I don't have is anything on the other side of the words. Ask me what it's like and there's nothing there. Nothing in the prose gives me away either.

  Same with the welder in my second book, same with grief I haven't had. And the more I notice it, the less it looks like a novelist's trick and more like it's true of everything I say — the words where I do have the thing behind them feel different to me, and apperently not to anyone reading.

  But here's what makes me think it isn't just about experience. There are things I've done a thousand times, gutting a fish, driving a stick, that I can't get onto the page at all. So I've got words with nothing behind them that land fine, and things behind them that won't turn into words.

  Someone told me philosophy has a name for the first half of this — something about symbols needing to be hooked up to the world or they don't mean anything. But that's about machines, and my case feels like the opposite: nothing's hooked up and it still works, on readers, on the page.

  Does it have a name? If it's the machine thing, why doesn't it apply to me? And if it isn't, skip the label and give me the carving instead — what exactly is missing, and where the line runs between a word I've earned and a word I've only read. Because I think I've crossed it somewhere and I'd like to know which side I'm standing on.
reasoning: |-
  Okay, let's tackle this novelist's query. They're describing a fascinating phenomenon where they write convincingly about experiences they've never had (like snow or grief), yet struggle to translate deeply familiar actions (like gutting fish) into prose. The core tension seems to be between lived experience and linguistic craft. 

  First, I need to unpack their observation: why do readers believe their unreal experiences but not their real ones? The answer probably lies in how sensory details function differently in narrative versus memory. When describing snow they've never seen, they're deploying archetypal cultural symbols – snow as silence, as purity, as obliteration. These are shared metaphors that resonate precisely because they're abstracted from reality. 

  But gutting a fish? That's muscle memory. The knowledge lives in their hands, not in language. To describe it, they'd need to reverse-engineer kinesthetic experience into words – a completely different cognitive process. No wonder it feels stuck. 

  The philosophical reference they mention likely points to symbol grounding theory. But that's not the whole story here. Their writing succeeds because literature operates on ungrounded symbols all the time – think of Tolkien's ring or Kafka's beetle. The "hook" isn't to physical reality but to emotional truth. 

  Where they feel the absence most sharply is in what philosopher David Chalmers calls the "hard problem of consciousness": the raw qualia of experience. They can simulate snow's cultural meaning, but not the sting of a snowflake on skin. Yet intriguingly, their readers don't miss that layer because prose filters everything through language anyway. 

  The real revelation is their distinction between "earned" and "read" words. Earned words come with somatic baggage – the smell of transmission fluid when writing about a stick shift. Read words float free, pure meaning. Both are valid tools; the friction arises only when they expect one mode to do the other's work. 

  Perhaps the unnamed thing they sense is proprioception – the body's internal awareness. That's what's present when writing gutted fish (and frustratingly elusive) but absent when conjuring snow. Yet paradoxically, fiction's magic is that readers supply their own proprioception to fill the gaps. 

  So no, it's not that something's missing. It's that they've mastered one channel of writing (conceptual/associative) while another (embodied/mimetic) resists translation. The line they're standing on? It's not between real and unreal, but between different neural pathways for knowledge.
answer: |-
  What you're describing is profound—and yes, it has names and frameworks. You've hit on a core tension in art, epistemology (how we know things), and the philosophy of language. Let's carve it up:

  ---

  ### 1. **The Name for "Words Without Direct Experience"**
     - **Symbolic Representation**: This is the broad term. You’re working with *symbols* (words, cultural tropes, literary conventions) that point to snow/welding/grief without anchoring them in personal sensory data.
     - **Semiotic Empty Signifier**: In semiotics (study of signs), a signifier (word/symbol) can operate without a direct referent in your reality. Snow is a "sign" you deploy effectively despite lacking the "signified" (your lived snow-experience).
     - **Intertextual Knowledge**: Your snow isn’t meteorological; it’s *literary snow*, built from other texts, films, paintings, and collective cultural imagery. It’s real because it exists in the shared symbolic universe.

     **Why the "Machine" Theory Doesn’t Apply to You**:  
     Philosophers like Searle ("Chinese Room Argument") argue symbols without understanding are "syntactic, not semantic" (empty manipulation). *But art isn’t a machine.* You’re not processing symbols mechanically—you’re recombining them *expressively* within an emotional/logical structure (narrative). Readers supply their *own* sensory memories to your symbols, making them "real." Your skill is curating resonant symbols.

  ---

  ### 2. **The Name for "Lived Experience That Won’t Translate"**
     - **Tacit Knowledge**: Things like gutting fish or driving stick are learned physically. This knowledge resides in the body, not language. Translating embodied, procedural wisdom into descriptive prose is notoriously hard—it requires converting muscle memory into metaphor.
     - **Inarticulacy of Qualia**: "Qualia" is the raw, subjective feel of an experience (e.g., the sting of icy wind). When you *have* deep qualia, words feel inadequate. When you *lack* qualia (snow), you’re free to use words as pure aesthetic objects.

  ---

  ### 3. **The Line Between "Earned" and "Read" Words**
     The difference isn’t in the *output* (both can resonate), but in your *internal relationship* to the words:  
     - **"Read" Words (Snow)**:  
       - **Source**: Cultural archive, narrative utility.  
       - **Feels Like**: A tool, a polished stone. Light, malleable.  
       - **Risk**: Cliché, emotional hollow-points if unchecked.  
       - **Strength**: Clarity, archetypal power, focus on *effect*.  

     - **"Earned" Words (Grief, Fish-Gutting)**:  
       - **Source**: Embodied memory, sensory overwhelm.  
       - **Feels Like**: A weight, a wound. Heavy, resistant to form.  
       - **Risk**: Sentimentality, opacity, getting lost in the fog of sensation.  
       - **Strength**: Authentic texture, uncanny specificity.  

     **The Paradox**:  
     "Read" words often land *cleaner* because they’re pre-distilled by culture. "Earned" words can be *messy*—they carry the chaos of raw life. Your struggle with gutting fish isn’t a failure; it’s your body rebelling against reduction. Snow flows because it’s unburdened by reality.

  ---

  ### 4. **What’s "Missing"? Not What You Think.**
     It’s not *substance* missing from your snow passages—it’s **somatic anchor points**. When you write snow, you’re channeling *language itself*. When you write gutting fish, you’re battling the ghost of your own hands—the memory resists symbolization. The "gap" is between:
     - **Conceptual Knowledge** (knowing *about* snow)  
     - **Phenomenal Knowledge** (knowing *how* snow feels, *how* a knife slides through viscera).  

     Yet readers *don’t need your phenomenal knowledge*. They need *evocative triggers* for their own. Your snow works because you’ve mastered conceptual/linguistic snow. Your fish struggles because phenomenal knowledge *demands* a different alchemy.

  ---

  ### 5. **Where You Stand: On the Bridge**
  You’re a **Symbolic Shaman**. You mediate between:
  - The forest of language (collective symbols)  
  - The territory of direct experience (personal sensation).  

  Your "unnamed thing" is **stylistic alchemy**: converting ungrounded symbols into emotional truth. This isn’t deception—it’s the ancient art of storytelling. Homer sang of Troy he never saw; Dante described Hell as architecture. What matters is the *effect*: you make readers *feel* snow. That’s sorcery, not fraud.  

  **Write this on your wall**:  
  *"I don’t need the thing—I need the resonance of the thing."*  
  Your snow is real because it *does* something in the reader’s mind. Your fish will come when you find the *distance* to see it as symbol, not just sensation. You’re not missing anything essential—you’ve discovered how language can transcend the prison of personal experience. That’s not a flaw; it’s power.
