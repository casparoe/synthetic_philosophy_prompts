prompt: |-
  I'm in a political theory seminar that keeps circling back to "performance legitimacy" — the idea that a regime earns the right to rule by delivering growth, order and general prosperity, the Singapore/China story basically — and I keep going back and forth about it with a friend who thinks that if the goods are real and people are better off than under any realistic alternative, that's the end of the argument. I want to actually build a case that tests this rather than just trading intuitions, so could you construct one to my specs?

  Here's what I need. A single authoritarian regime — make it a small fictional city-state so we're not smuggling in real-world facts or leaning on stuff I'd have to look up. It has to satisfy the performance case as fully as you can make it: the prosperity and order are real, they're causally attributable to the regime's policies rather than to oil or a generous foreign patron or dumb luck, the gains are broadly shared rather than concentrated in an elite, and a clear majority of citizens — uncoerced, with no manufactured preferences and no propaganda doing the heavy lifting — genuinely prefer this arrangement to any feasible democratic alternative. And I don't want a secret police, a rigged information environment, or a looming coup threat doing the stabilizing. Keep it clean. Now the twist: even with all of that, I want the regime to come out illegitimate on at least one serious account of legitimacy, and I want that verdict to fall out of the theory rather than be stipulated by me.

  One paragraph for the scenario. Then walk me through what an input/consent account, an output/performance account, and a republican non-domination account each say about it, and tell me which single feature of the case is doing the work — the thing that, if you removed it, would flip the regime to legitimate on all three. And since I'll be defending this in class, tell me how my friend would attack the construction, and whether his attack is fair or whether it just begs the question.
reasoning: |-
  Okay, the user is in a political theory seminar and they're grappling with the concept of "performance legitimacy." They want to construct a case to test this idea beyond just trading intuitions with their friend. Their friend argues that if the regime delivers real goods and people are better off, that's sufficient for legitimacy. The user wants to challenge that by creating a fictional scenario that satisfies all performance criteria but still fails on other legitimacy accounts. 

  First, I need to create a fictional city-state. Let me name it "Harmonia" to give it a neutral, positive connotation. It should be small to avoid complexity. The regime must deliver prosperity, order, and shared gains. The prosperity should be attributable to the regime's policies—so no natural resources or foreign aid. The gains are broadly shared, and a majority genuinely prefer this system without coercion or propaganda. No secret police or rigged information. 

  The twist is that even with all this, the regime should be illegitimate on at least one serious account. I'll consider three theories: input/consent (like democracy), output/performance (the friend's view), and republican non-domination (freedom from arbitrary power). The key is to find a feature that, if removed, flips legitimacy in all three accounts. 

  For the scenario, the regime has a Meritocratic Council, selected through rigorous exams. They make efficient policies leading to prosperity. Citizens are content, and there's no repression. However, citizens have no formal role in governance—no elections, no way to influence decisions. 

  Now, analyzing each theory:
  1. Input/consent: Legitimacy requires citizens' ongoing consent through participation. Harmonia lacks mechanisms for consent, so it's illegitimate here. 
  2. Output/performance: The regime delivers, so it's legitimate on this account. 
  3. Republican non-domination: The council holds unchecked power. Even if benevolent, the power is arbitrary because citizens can't contest decisions. So illegitimate here. 

  The critical feature is the absence of institutionalized popular control. If added, like advisory referendums, it could satisfy input and non-domination. 

  The friend might attack by arguing that the citizens' contentment implies tacit consent. But that's question-begging because it assumes contentment equals legitimacy without addressing the lack of mechanisms. The attack isn't entirely fair as it dismisses the necessity of formal consent structures. 

  I need to ensure the scenario is watertight: no hidden coercion, genuine preferences. The friend's counter might also challenge the republican view as idealistic, but that's a theoretical disagreement, not a flaw in the case. 

  Overall, the case highlights that performance alone isn't sufficient for legitimacy when other democratic and freedom principles are considered. The user can use this to show legitimacy is multifaceted.
answer: |-
  Here’s a constructed case designed to meet your specifications, followed by the analysis:

  **Scenario: The City-State of Harmonia**  
  Harmonia is governed by a "Meritocratic Council" selected through rigorous, anonymized aptitude tests evaluating policy design, ethics, and systems thinking. The Council has absolute authority but operates transparently: all debates and data are public, decisions are empirically justified, and audits confirm no corruption. Harmonia boasts universal prosperity (GDP/capita 3× neighbors), near-zero crime, exceptional healthcare/education, and sustainable environmental policies. These outcomes stem *directly* from the Council’s evidence-based governance—e.g., targeted infrastructure investments and adaptive welfare programs. Surveys (conducted by external pollsters) show 75% of Harmonia’s citizens, enjoying high autonomy in daily life, genuinely prefer this system over feasible democratic alternatives (which they perceive as slower and more vulnerable to populism). There is no repression, propaganda, or manipulation—only a shared belief in the system’s efficacy.

  ---

  ### Legitimacy Assessments  
  1. **Input/Consent Theory (e.g., Locke, Rousseau):**  
     **Verdict:** *Illegitimate*.  
     **Reason:** Legitimacy requires *ongoing, institutionalized consent* through mechanisms like elections, where citizens authorize and can revoke power. Harmonia lacks any formal avenue for citizens to shape or contest the Council’s authority. Tacit approval via contentment ≠ democratic authorization. The regime is a *benevolent guardianship*, not a product of popular sovereignty.  

  2. **Output/Performance Theory (e.g., Chinese Marxist-Leninist "Whole-Process Democracy"):**  
     **Verdict:** *Legitimate*.  
     **Reason:** The regime delivers sustained prosperity, order, and responsive policy—exceeding the outcomes of regional democracies. Citizens recognize and affirm this effectiveness. Performance *is* the foundation of legitimacy, rendering procedural deficits irrelevant when results satisfy public needs.  

  3. **Republican Non-Domination Theory (e.g., Pettit):**  
     **Verdict:** *Illegitimate*.  
     **Reason:** Citizens live under *arbitrary power*—the Council’s authority, however wise, lacks robust checks enabling citizens to contest decisions. Without institutionalized channels to challenge policies (e.g., independent courts, legislative oversight), Harmonia’s people are "subjects," not free citizens. Non-domination requires that power cannot be exercised without considering their voices.  

  ---

  ### The Pivotal Feature  
  **Absence of institutionalized popular control** is the critical flaw. If Harmonia introduced:  
  - Binding referendums on Council membership/policies,  
  - Or an elected oversight body with veto power,  
  it would satisfy input/consent (via authorization) and non-domination (via contestation), flipping legitimacy in both accounts. Performance legitimacy remains intact regardless.

  ---

  ### Anticipating Your Friend’s Attack & Its Fairness  
  **Likely Attack:**  
  *"You’ve rigged the case by defining legitimacy through liberal-democratic lenses. If Harmonia’s people are truly free, informed, and satisfied—and reject democracy—insisting they lack ‘consent’ or ‘non-domination’ imposes *your* values. Their endorsement *is* legitimacy. Performance isn’t just one account—it’s the only one that matters to real people."*  

  **Assessment of Fairness:**  
  - **Fair Critique (in part):** The attack rightly notes that input/non-domination theories *are* normatively loaded. If the performance account treats popular satisfaction as sufficient, demanding more *can* seem elitist.  
  - **Unfair/Begging the Question (in part):** It assumes that "satisfaction without voice" equals genuine freedom/consent, dismissing the core republican/liberal claim that *procedural safeguards* are prerequisites for true autonomy. To say "their preference proves legitimacy" ignores how preferences form *within* structures—e.g., lacking democratic experience, citizens may undervalue political agency. This circularly assumes performance *is* the sole legitimacy criterion.  

  **Your Best Counter:**  
  Distinguish between *happiness* and *legitimacy*. We can acknowledge Harmonia’s success while arguing that legitimacy requires moral justifications beyond outcomes—e.g., respecting citizens as agents, not just beneficiaries. If legitimacy is merely "what people accept," it could excuse *any* regime that engineers satisfaction, even by subtly constraining alternatives. The republican/liberal accounts force us to ask: *Could* citizens meaningfully dissent if they wished? In Harmonia, they cannot—making their contentment passive, not agential.  

  **Key for Class Defense:** Emphasize that the case isolates the *theoretical conflict*. It doesn’t "prove" performance legitimacy wrong—it shows that rival accounts prioritize different values (autonomy vs. outcomes), and any dismissal of input/non-domination likely rests on unstated normative commitments.
