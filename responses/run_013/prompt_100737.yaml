answer: |-
  ### Teaching Kelly Betting as Normative Geometric Rationality: Session Plan

  #### **Core Sequence & Rationale**  
  1. **Start with Expected Value (EV)**  
     - **Why**: Audience is comfortable with EV. Begin by framing a betting scenario (e.g., a coin flip) and compute EV of *terminal wealth*.  
     - **Example**: Use a simple bet: "Heads: win 100% of your stake, Tails: lose 50% of your stake. Fair coin. If you bet $100, EV = (0.5 × $200) + (0.5 × $50) = $125."  
     - **Build intuition**: EV suggests this bet is good (EV > $100). Ask: "Should you take this bet repeatedly?"  

  2. **Introduce Multiplicative Compounding**  
     - **Why**: Reveal the flaw in EV for repeated bets. EV assumes additive wealth, but real growth is multiplicative (compounding).  
     - **Example**: Use the same bet above. Show that after two rounds:  
       - Full bet each time: Outcomes = $400 (HH), $100 (HT/TH), $25 (TT).  
       - EV = $156.25, but **median outcome is $100** (50% of paths break even or lose).  
     - **Key insight**: Wealth grows/reduces by *multipliers* (e.g., ×2.0 on win, ×0.5 on loss). Arithmetic means (EV) mislead for repeated bets.  

  3. **Logarithmic Growth Rate**  
     - **Why**: Log transforms multiplicative processes into additive ones. Growth rate is the expected log-return.  
     - **Example**: For the bet above, compute growth rate *g*:  
       - *g* = 0.5 × log₂(2.0) + 0.5 × log₂(0.5) = 0.5×(1) + 0.5×(−1) = 0.  
       - **Interpretation**: Zero growth despite positive EV. Betting full bankroll is unsustainable.  
     - **Contrast**: Show growth for fractional bet (e.g., 50% bankroll):  
       - Win: ×1.5, Loss: ×0.75 → *g* = 0.5×log₂(1.5) + 0.5×log₂(0.75) ≈ 0.059 > 0.  

  4. **Kelly Criterion as Maximizing Growth**  
     - **Punchline**: To maximize long-term wealth, maximize *expected log-wealth* (growth rate), not expected wealth.  
     - **Formula**: Fraction *f* = (edge)/(odds) for simple cases, but emphasize *why* (it maximizes *g*).  
     - **Normative claim**: "If you care about geometric growth (e.g., compounding over years), this is objectively rational."  

  #### **The Carrying Example: Double-or-Halve (Fair Coin)**  
  - **Why this example?**  
    - **Strengths**: Clear degeneracy (growth=0 at *f*=1) highlights EV vs. growth conflict. Simple math:  
      - EV multiplier = 1.25 → suggests "bet big."  
      - Growth rate = 0 → reveals disaster.  
    - **Avoids confusion**: Symmetric (no probability bias), no chance of ruin (unlike "win double/lose all"), and log calc is trivial.  
  - **Weakness**: Growth=0 might seem extreme. **Fix**: Contrast with fractional bet (e.g., *f*=0.5 → *g*≈5.9%/bet) to show improvement.  
  - **Why not 1.5/0.6?** Obscures the core insight—growth can be negative despite positive EV, but degeneracy is more memorable.  

  #### **Misconceptions & How to Preempt Them**  
  1. **"Kelly maximizes expected wealth"**  
     - **When it arises**: After introducing EV vs. growth.  
     - **Preemption**: After step 2 (compounding), show that EV grows with bet size, but growth rate peaks then falls. Ask: "If EV keeps rising, why not bet more?" Then reveal growth rate collapse.  
     - **Example**: In double-or-halve, *f*=1 → EV skyrockets (1.25ⁿ), but median wealth → $0.  

  2. **"Fractional Kelly is for risk aversion"**  
     - **When it arises**: When discussing bet sizing.  
     - **Preemption**: After step 4, clarify: "Kelly is about *growth*, not psychology. Fractional Kelly *lowers* growth—it’s a heuristic for misspecified models or unknown risks, not optimal growth."  

  #### **Check Question for Understanding**  
  - **Question**: "You’re offered 1,000 independent bets. Each has +EV. Should you always bet full bankroll? Why?"  
  - **Correct answer**: "No. Betting full bankroll risks ruin (or negligible growth). Maximize growth by optimizing bet size per Kelly."  
  - **Why it works**: Tests if they internalized growth > EV and compounding.  

  #### **What to Omit**  
  1. **Derivations/calculus**: No solving max *E[log(1+fX)]*; use plug-and-chug for fractions.  
  2. **Portfolio theory**: No multiple assets or correlations.  
  3. **Edge cases**: No debates on "long run" asymptotics or logarithmic utility axioms.  
  4. **Alternatives**: No mention of Sharpe ratio, Markowitz, or risk-neutral pricing.  

  #### **Timeline (50 Min)**  
  - 0–5 min: EV refresher + double-or-halve example.  
  - 5–15 min: Compounding pitfalls (simulate 2–3 rounds).  
  - 15–25 min: Log growth rate (contrast *f*=0, 0.5, 1).  
  - 25–35 min: Kelly criterion + normative claim.  
  - 35–45 min: Misconceptions + Q&A.  
  - 45–50 min: Check question + summary.  

  **Key**: Use visuals (wealth paths, growth curves) and Socratic questioning. Anchor in the example—avoid abstraction until the punchline.
