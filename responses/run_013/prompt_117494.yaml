  Mild issues: Their theory doesn't explain why this grammatical illusion feels so universal. Standard illusionism at least has evolutionary justifications (e.g. self-modeling benefits). Also, conflates grammar with phenomenology—grammar might shape how we report, not necessarily create the thing itself.

  Noticing their meta-concern: They fear being dismissed as "only talking about words." Gotta address that head-on. If their view is purely linguistic, it denies nothing substantive about minds—which ironically concedes everything to realists. That's damning.

  Predictions differ too: Their version says changing language eliminates consciousness; standard illusionism says cognitive rewiring is needed. Big difference. Also, their view implies animals literally lack any experience—ethically fraught.

