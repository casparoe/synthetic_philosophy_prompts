  Here is the draft committee opinion, structured for clarity and immediate use:

  ---

  # CLINICAL ETHICS COMMITTEE OPINION  
  **Re: Proposed Scarce Therapy Allocation Protocol Tiebreaker**

  ## I. RECOMMENDATION  
  **The Committee recommends REJECTION of the citizenship/residency tiebreaker as drafted.** We propose adopting the protocol **WITH THE FOLLOWING AMENDMENT** (to replace Section 5.3.2):  
  *"In cases where patients are clinically indistinguishable after application of primary allocation criteria, the following secondary tiebreakers shall be applied sequentially:  
  (a) Probability of significant survival difference (>10% absolute difference at 1 year), based on best available predictive modeling;  
  (b) Time accrued on the therapy waitlist prior to clinical eligibility determination;  
  (c) Randomized selection."*

  ## II. REASONING  

  ### A. Acknowledging the Citizen-Preference Argument in Good Faith  
  We recognize the sincere position holding that political communities may owe preferential obligations to members who contribute through taxes/social participation. The core ethical claims are:  
  1. **Reciprocity**: Long-term contributors deserve reciprocal benefits when in need.  
  2. **Communal Solidarity**: Healthcare systems sustain communal trust by prioritizing members.  
  3. **Stewardship**: Publicly funded resources may be stewarded for those whose participation maintains them.  
  *We affirm these principles apply to broader health policy but reject their use in* individual life-saving allocation *for the following reasons:*

  ### B. Grounds for Rejection  
  1. **Contradiction of Existing Policy**:  
     Our Network Policy 7.12 states: "Immigration status shall not factor into clinical decisions regarding access to care." Allocating scarce therapy is a *clinical decision* impacting life outcomes. Calling it an "administrative tiebreaker" is a distinction without ethical difference when applied at the bedside. Adopting this protocol violates our institutional commitment.  

  2. **Undermining Clinical Integrity**:  
     Introducing non-clinical criteria (citizenship) into resource allocation erodes trust in medical impartiality—especially among marginalized populations who already face care barriers. Mr. A’s case exemplifies this: his clinical equivalence is medically unambiguous, yet his care would be deprioritized based on legal status.  

  3. **Misapplication of Reciprocity**:  
     Mr. A contributed payroll taxes for 11 years. To deny him reciprocity because he used an informal mechanism (while barred from legal participation) perversely penalizes *de facto* community membership. The protocol’s binary "citizen/non-citizen" divide ignores gradients of contribution and need.  

  4. **Disproportionate Harm**:  
     While statistically rare, the stakes are life-altering for affected patients. Even "modest" discrimination institutionalizes inequity at the most vulnerable juncture.  

  ### C. Assessment of the "Two-Door" Framing (Exitability)  
  While philosophically provocative in highlighting coercion in obligations, **this approach is ethically unsuited for clinical policy**:  
  - **Practical Imprecision**: "Exitability" is not objectively verifiable (e.g., is a citizen with family dependencies "free" to leave?).  
  - **Clinically Irrelevant**: Like citizenship, exitability lacks nexus to medical need or outcomes.  
  - **Institutional Overreach**: Determining "who is trapped" exceeds clinical ethics competence and risks dangerous subjectivity.  
  *Though the framing usefully critiques rigid membership boundaries, it does not resolve our duty to avoid non-clinical discrimination.*  

  ## III. INTERIM GUIDANCE FOR IMMEDIATE CASES (Mr. A & Citizen Patient)  
  Pending final protocol adoption:  
  1. **Allocate solely on existing clinical criteria** without tiebreakers.  
  2. If absolute clinical equipoise persists, **use time on waitlist as the tiebreaker** (as pre-existing in our general allocation policy).  
  3. **Communicate identically to both care teams**:  
     *"The Ethics Committee is reviewing allocation tiebreakers. Until finalized, clinically tied patients will be prioritized based on earliest waitlist registration. Your patient remains equally eligible under current policy."*  
  4. Expedite protocol revision to occur within 7 days post-vote.  

  ---

  ## Key Strategic Points for Your Presentation:
  - **Emphasize Institutional Consistency**: "We cannot contravene Policy 7.12 while claiming tiebreakers are ‘non-clinical.’ Patients experience this as clinical exclusion."  
  - **Honor Sincere Views While Redirecting**: "The reciprocity argument deserves policy discussion—but not at the cost of compromising bedside ethics during life-or-death decisions."  
  - **Practical Amendment**: The proposed tiebreakers (survival probability, waitlist time, randomization) are clinically defensible, measurable, and neutral to immigration status.  
  - **Urgency Focus**: "Our duty to both Mr. A and the citizen patient is to decide without introducing new discrimination during deliberation."

  This draft provides a votable position, respects dissenters’ premises while rejecting their application, neuters the two-door theory without dismissing it entirely, and gives actionable interim guidance—all while centering clinical integrity.  
