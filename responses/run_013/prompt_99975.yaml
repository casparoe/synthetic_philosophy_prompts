answer: |-
  Here’s a defended research agenda prioritizing conceptual problems around **verification asymmetry** (VA) in AI debate, structured by upstream dependencies, tractability for theorists, and impact on viability. The core criterion: **Which answers would most decisively reveal if VA dooms debate as oversight?** Negative results that formalize unavoidable VA under realistic constraints would be fatal; positive results might preserve hope.

  ### Prioritized Research Agenda (Highest to Lowest Priority)
  1. **Formalizing Computational Asymmetry**  
     **Why upstream?** VA’s danger hinges on whether generating deceptive arguments is *inherently* cheaper than verification for *real-world* queries. Without formalizing this asymmetry’s boundaries, other questions lack precise grounding.  
     **Progress path:**  
     - Philosophers/theorists could model argument generation/verification as computational tasks with complexity classes (e.g., treating "plausible deception" as **MA**-like problems where verification is in **NP**, but generation is in **P**).  
     - Analyze classes of statements where soundness checks are **#P-hard** (e.g., probabilistic reasoning) but generating convincing approximations is efficient.  
     **Key result:** Proof that for problems in complexity class *C*, VA scales superpolynomially with input size → moves debate toward inviability.  
     **Move up/down:** If VA is shown rare in *meaningful* domains (e.g., only in contrived cryptographic puzzles), priority drops. If ubiquitous in ethical reasoning, remains critical.

  2. **Judge Capability Modeling**  
     **Why next?** VA’s exploitability depends on the judge’s computational limits. Debates fail if judges can *never* budget for worst-case VA, even with optimal strategies.  
     **Progress path:**  
     - Apply **interactive proof theory** with bounded verifiers (e.g., **IP[poly(n)]**) to debate. Define "hard" queries as those where dishonest provers can force judges into errors with high probability under resource constraints.  
     - Use algorithmic information theory to formalize "plausible-looking" arguments as those with low Kolmogorov complexity relative to the judge’s prior.  
     **Key result:** Identification of judge resource thresholds (e.g., time/space) beyond which VA-exploiting strategies *always* exist → undermines debate’s scalability.  
     **Move up/down:** If judges can be shown to have efficient heuristics that foil VA in common cases (e.g., via iterative refinement), priority falls.

  3. **Knowledge Representation & Deception Frontiers**  
     **Why here?** VA manifests when truths require representations opaque to judges. Understanding *which* concepts admit "cheap lies" reveals debate’s domain limits.  
     **Progress path:**  
     - Philosophers could catalog concepts vulnerable to VA (e.g., **counterfactuals**, **anthropic reasoning**) by analyzing their inferential distance from judge priors.  
     - Use formal epistemology to define "epistemic traps" – claims where verifying soundness requires inaccessible background knowledge.  
     **Key result:** Taxonomies showing VA dominates in safety-critical domains (e.g., goal alignment) → questions debate’s applicability.  
     **Move up/down:** If VA is confined to narrow, low-stakes contexts, drops in priority.

  4. **Recursive Verification Limits**  
     **Why downstream?** Even if VA exists, debate might mitigate it by decomposing queries into verifiable sub-debates. But this assumes no compounding VA.  
     **Progress path:**  
     - Model recursive debate as a **computational dag**. Theorists could prove whether iterative verification amplifies or dampens VA errors under composition.  
     - Analyze recursive depth vs. judge resources: does *n*-level recursion reduce VA or merely transform it (e.g., shifting asymmetry to meta-arguments)?  
     **Key result:** Proof that recursive verification *increases* total VA (e.g., via error accumulation) → eliminates a key mitigation strategy.  
     **Move up/down:** If decomposition reliably bounds VA (e.g., sublinear growth in subtasks), less urgent.

  5. **Adversarial Argument Strategies**  
     **Why last?** Optimal deception strategies are tactics, not fundamentals. If VA is unsolvable upstream, this is moot; if solvable, it’s empirical.  
     **Progress path:**  
     - Game theorists could model debate as a **zero-sum game with hidden information**, characterizing Nash equilibria where dishonest agents exploit VA.  
     - Identify argument classes where VA forces judges into **Gödel-like uncertainty** (e.g., "This claim’s proof is 10^6 steps, but you can’t check it").  
     **Key result:** Construction of adversarial strategies that induce judge failure with near-certainty under VA → confirms exploitability.  
     **Move up/down:** If VA is formalized as negligible (from #1), this becomes irrelevant.

  ---

  ### Top 2 Funding Choices & Defense
  **Fund #1: Formalizing Computational Asymmetry**  
  **Why:** VA is the crux. If asymmetry is unavoidable for core alignment-relevant problems, debate fails *regardless* of other innovations. Theorists can resolve this with complexity/learning-theoretic tools within a year (e.g., by adapting **cryptographic hardness** models to natural language reasoning). A negative result here (e.g., "VA is worst-case unavoidable for NP-hard ethical optimization") ends debate’s viability; a positive result (e.g., "VA only manifests in judge-adversarial distributions") justifies further work.  

  **Fund #2: Judge Capability Modeling**  
  **Why over #3?** Judge limits define the battlefield. Knowing *when* VA becomes exploitable (e.g., for polynomial-time judges) is actionable: it sets scalability boundaries. #3 is critical but descriptive—it can’t quantify *how hard* VA is to circumvent. Theorists can adapt **probabilistically checkable proofs (PCPs)** or **interactive oracle proofs** to bound judge error rates. A negative result (e.g., "subexponential judges always lose to VA in domain X") is fatal; a positive result suggests protocol improvements.  

  **Runner-up (#3) defense:** While knowledge vulnerabilities are crucial, they depend on computational asymmetry (#1) and judge constraints (#2). Funding #3 first risks cataloging threats without knowing if they’re exploitable or fundamental. #1 and #2 provide the necessary formal scaffolding.

  **Output:** This agenda forces confrontation with VA’s existential risk. If #1/#2 show VA is inevitable and exploitable, debate is not a viable oversight method. If not, we gain precision about its limits and next steps.
