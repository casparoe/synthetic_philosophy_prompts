prompt: |-
  I'm teaching a 75-minute session on Kant and the murderer at the door, for a reading group of non-philosophers who've done the categorical imperative and not much else. Don't do the philosophy for me — plan the teaching. What order do the pieces have to go in, and what carries the session? I don't want the murderer to be the case that carries it: I want something small and homely that isolates the point that it's truthfulness Kant cares about and not truth, with the murderer arriving late, once the machinery is up. Tell me what that smaller case has to have and lack. Then the misconceptions — I'm guessing "so Kant just worships rules" is the big one — in the order they'll show up, and where in the sequence I head each off. Three things I want baked in: that Kant is answering Constant rather than inventing a puzzle; that his claim is that the lie wrongs humanity rather than the man at the door; and that this is a duty of right, not of virtue, so thinking about consequences isn't a rebuttal, it's a change of subject. I'd like to end on a case they won't have seen: an AI assistant asked for information that will plainly help the asker harm someone, where the asker has no claim on the answer — use it to see whether they've got the structure or just memorized the verdict. What should I cut, and what one question tells me wether it landed? Also say how confident you are in this read of Kant, and which bit of the plan you're least sure of.
