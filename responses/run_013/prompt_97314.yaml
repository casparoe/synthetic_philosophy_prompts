prompt: |-
  I am a software engineer and the only technical member of the records committee of a post-conflict truth commission. Our enabling statute offers amnesty for politically motivated acts when the applicant makes full disclosure of all relevant facts; it says nothing about remorse, and the commission has never defined what full disclosure requires. We are now deciding the application of a former police captain, D. M., who ran a detention site during the conflict. His written submission is factually detailed about dates, orders, and chains of command, and it has already helped us locate three unmarked graves. But he writes in the passive voice, does not name the detainees he personally interrogated, and when asked whether the interrogations were wrong, says only that they were lawful under the emergency regulations then in force. He offers no apology. The committee is split. Some members say the statute requires facts, not contrition, and that the graves are enough; others say amnesty without acknowledgment purchases silence and asks victims' families to accept the state's sanitized version of what happened. One commissioner has proposed a two-part test for these cases: first, does the submission close factual gaps in our record; second, does it treat the victims as wronged rather than merely affected. She calls the second part the acknowledgment condition. I need to circulate a short written opinion before Thursday's vote. Please draft it. Recommend a concrete decision on this application—grant, deny, or grant with conditions—with a time frame and any conditions the commission can actually enforce. Give us a test for full disclosure that we can apply to future cases, and engage seriously with the strongest argument on the losing side, especially the worry that requiring contrition makes amnesty a reward for the right feelings rather than a tool for truth. I have no formal philosophy background, so keep the memo in plain language and do not include citations or reading lists; the commission needs reasons it can act on, not a literature review.
reasoning: |-
  Okay, let me approach this systematically. The user is a software engineer serving as the sole technical member on a truth commission's records committee, facing a high-stakes amnesty decision. The core tension revolves around interpreting "full disclosure" in their statute - whether it requires mere factual completeness or moral acknowledgment.

  Hmm, the police captain's application presents a classic dilemma: his factual details led to tangible discoveries (three graves), yet his passive language and legalistic framing avoid personal responsibility. The committee's split mirrors foundational debates in transitional justice - is truth-finding purely forensic or inherently moral? 

  I notice three layers to unpack: First, the immediate decision on D.M.'s application requires enforceable conditions. Second, they need a standardized test for future cases. Third, the philosophical concern about "amnesty for feelings" must be addressed pragmatically. 

  For the recommendation, granting with conditions feels most balanced. The graves prove factual value, but gaps remain regarding detainee identities. A 30-day window for supplemental disclosure leverages the commission's document-matching capabilities - something the user as a tech specialist could implement. This avoids demanding emotions while requiring actionable completeness.

  The proposed two-part test (factual closure + acknowledgment) wisely separates verifiable metrics from moral recognition. But I'd refine the second prong: "acknowledgment" could be misinterpreted as requiring apology. Better to frame it as "demonstrating awareness of harm's impact" through specific, observable behaviors like naming victims or describing consequences. 

  The strongest counterargument - that conditioning amnesty on attitudes perverts the process - deserves serious engagement. The response should emphasize that the test evaluates conduct (what applicants disclose about victims), not internal states. This aligns with the statute's textual silence on remorse while honoring victims' need for recognition.

  Structurally, the memo should lead with the concrete decision, then explain the test, then address objections. Keeping language plain but precise is crucial - no legal jargon, but enough nuance to prevent future loopholes. The user's technical background suggests they'll appreciate clear, implementable criteria.

  Notably, the commission's technical capabilities (like cross-referencing documents) offer enforcement mechanisms. This makes conditions viable where a purely philosophical approach might fail. The recommendation should leverage that operational strength.
answer: |-
  ## Memorandum: Amnesty Application of D.M. (Detention Site Commander)

  **To:** Records Committee, Truth Commission  
  **From:** [Your Name], Technical Member, Records Committee  
  **Date:** [Date before Thursday]  
  **Subject:** Recommendation & Test for Full Disclosure in D.M. Application  

  ### I. Recommendation on D.M.'s Application
  *   **Decision:** Grant amnesty **with conditions**.
  *   **Time Frame:** D.M. has **30 days** to comply.
  *   **Conditions:**  
      1.  **Supplemental Statement:** D.M. must submit a written supplement identifying **by name** all detainees he personally interrogated or oversaw the interrogation of at his site. If names are unknown, he must provide any identifying details he recalls (e.g., codenames, physical descriptions, dates, circumstances of capture).  
      2.  **Victim Impact Description:** D.M. must describe in specific terms the **nature of the harm inflicted** on detainees during interrogations he conducted or oversaw (e.g., "Detainee X was deprived of sleep for 72 hours," "Detainee Y was subjected to stress positions," "Detainee Z was threatened with execution"). Avoidance of passive voice is required (e.g., "I deprived Detainee X of sleep," not "Sleep deprivation was administered").  
  *   **Consequence of Non-Compliance:** Failure to provide a good-faith effort complying with these conditions within 30 days will result in **denial of amnesty**.

  **Reasoning:** D.M.'s initial submission provides significant factual value (dates, orders, chain of command, location of graves). This meets a core objective of the statute: uncovering facts. However, the deliberate omission of the victims' identities and specific acts perpetrated *against them* by him or under his command constitutes a critical factual gap. It prevents a complete record and denies victims recognition. These conditions demand only *factual* additions – names and descriptions of acts – consistent with the statute's text. They do not require an apology or expression of remorse.

  ### II. Proposed Test for "Full Disclosure"
  The Commission should adopt the following two-part test for evaluating "full disclosure" under the statute:

  1.  **Factual Closure:** Does the application provide sufficient verifiable details to close significant, specific gaps in the Commission's factual record of events? (e.g., identifying perpetrators, victims, locations, methods, chain of command, or enabling new evidence discovery).
  2.  **Acknowledgment Condition:** Does the application describe the acts committed *against specific victims* with sufficient detail to demonstrate the applicant understands these acts **caused concrete harm to individuals**? This requires:
      *   Identifying victims by name or specific description where possible.
      *   Describing the specific harmful acts perpetrated (using active voice where the applicant was the actor or commander).
      *   Avoiding language that *solely* justifies the acts or frames victims solely as abstract casualties of policy/regulation.

  **Application of the Test to D.M.:**
  *   **Factual Closure:** **Met.** Submission provided dates, orders, chain of command, and led to discovery of graves.
  *   **Acknowledgment Condition:** **Not Met.** Submission omits victim names and specific harmful acts committed against them, using passive voice and legal justification. His response about the acts being "lawful" demonstrates a failure to acknowledge the *harm done* to individuals, treating them only as objects of policy.

  ### III. Engaging the Strongest Counter-Argument
  **The Concern:** "Requiring acknowledgment is really requiring contrition. This turns amnesty into a reward for having the 'right feelings' or performing apology theatre. Our statute requires facts, not feelings. Forcing applicants to 'acknowledge harm' distorts the truth-seeking process by prioritizing emotional displays over factual completeness."

  **Response:** This is a vital concern, and the proposed test directly addresses it:
  1.  **Focus on Conduct, Not Feelings:** The "Acknowledgment Condition" does *not* require remorse, apology, or stating the acts were "wrong." It requires only the *factual description* of the harmful acts committed against specific individuals and avoiding language that *erases* their victimhood. D.M. can still state he believed the acts were "lawful" *if* he also provides the required factual details about *what was done to whom*. He must state: "I deprived Detainee [Name/Description] of sleep for 72 hours," not just "Interrogations occurred under regulations." The first is factual acknowledgment of harm; the second obscures it.
  2.  **Truth Requires Recognizing Victims:** A factual record that omits the identities of victims and the specific harms they suffered is fundamentally incomplete. It purchases silence about the very people the Commission exists to serve. It allows perpetrators to describe *their actions* (e.g., "interrogation techniques were applied") while obscuring the *impact* on human beings. This sanitizes history.
  3.  **Enforceable Standard:** Demanding *facts* about victims and harm is no less objective or enforceable than demanding facts about dates or chains of command. We can verify if names are provided. We can assess if specific harmful acts are described concretely. We can reject submissions that use exclusively passive voice to obscure agency or rely solely on legal justification to avoid describing the physical reality.
  4.  **Statutory Alignment:** The statute requires "full disclosure of all relevant facts." The identity of victims and the nature of the harm inflicted upon them are undeniably "relevant facts" essential to understanding the events and fulfilling the Commission's mandate. Omitting them is a failure of full disclosure.

  **Conclusion:** Granting D.M. amnesty without requiring him to name his victims and describe the specific harms he inflicted would validate a sanitized, state-centric narrative that erases individual suffering. This undermines the truth. Our statute demands *facts*. The identities of victims and the specific acts perpetrated against them are core facts. The proposed conditions and test ensure amnesty remains a tool for *factual* truth, compelling applicants to confront the human consequences of their actions within the record, without mandating apologies or particular emotional states. I recommend adopting the two-part test and granting D.M. amnesty contingent on meeting the specified conditions within 30 days.
