prompt: |-
  I'm in the third year of a doctorate and have spent most of the last year not writing it, and the problem has changed shape for me: it no longer looks like laziness, and I'd like your advice both on the practical question and on whether I've even got the diagnosis right. Here is the pattern. Every Sunday I lay out the week with real conviction — I believe the plan, I can say why each item matters, and I don't think I'm fooling myself about the difficulty. Most mornings I then lie in bed at 5:40 with the alarm going, and what I notice is that I don't experience the moment as a decision at all. I don't think "the plan was wrong"; I think "not now," and the plan feels like something a previous occupant of my body arranged. It's the same with money: I've saved almost nothing by resolving to transfer a little each month, but I've saved a decent amount through an account that sweeps the money out before I see it, and I can't honestly say I feel the difference as a difference in virtue. I never come to believe the goal was a bad one. I just don't do it.

  What complicates it is that I can argue both sides of my own case. A friend of mine, who reads a lot of philosophy and is a bit of a menace, says that my future self is a different person, and that present-me has no more reason to sacrifice for him than for a stranger on the street — and I can't tell whether that's a serious thought or a very sophisticated excuse, especially since I notice that the person who benefits from it is always the one making the argument. I also put a website blocker on my laptop last term, and when I found a way around it I didn't feel like I'd cheated; I felt like I'd corrected an injustice, that some earlier version of me had no business legislating for me. Meanwhile a friend who runs marathons says, without cruelty, that I'd do the work if I really wanted it, and while that seems obviously false, I can't produce the argument against it. And there's a temporal asymmetry I can't shake: I'm happy to say my past self should have started earlier, but when I weigh an hour of work now against an hour of relief now, the work seems to be for someone I don't know, and I notice I can construct reasons on both sides depending on when you ask me.

  So: what should I do about the dissertation, concretely — build more fences, try to change what I want, or accept that my stated priorities are simply not my real ones? And underneath that, which description of me is correct: one agent whose will is divided, a series of agents with overlapping but competing interests, or one agent whose actions are the truth and whose plans are the fiction? For whichever picture you favor, tell me what it implies about whether it is rational to bind my future self, and whether the fact that I can always find a reason to defect is evidence about my reasons or only about my rhetoric.
reasoning: |-
  Okay, let me unpack this user's situation. They're a third-year PhD student struggling with dissertation writing, but the core issue isn't laziness—it's this profound disconnect between planning and action. The alarm clock scenario is telling: at 5:40 AM, their carefully crafted plan feels like "something a previous occupant of my body arranged." That visceral metaphor suggests a fragmentation of self across time.

  The money example is equally revealing. Automatic savings work; manual transfers fail. This isn't about virtue but about structural solutions bypassing willpower. Then there's the philosophical tension: their friend's "future selves as strangers" argument versus the marathon-runner's "you'd do it if you wanted" stance. Both feel compelling yet contradictory.

  Key paradoxes stand out:
  - They endorse past plans intellectually but feel no ownership in the moment
  - They rationally agree future-me deserves effort but emotionally feel no obligation
  - Website blockers feel like "injustice" when bypassed, not cheating

  The user's framing as three possible self-models is astute:
  1. Divided will (single agent at war)
  2. Series of competing agents
  3. Actions reveal true priorities (plans as fiction)

  I'm struck by how they articulate temporal asymmetry: berating past-self for not starting, yet granting present-self relief. And that killer observation: "the person who benefits from the philosophy argument is always the one making it." That self-awareness suggests this isn't self-deception but a genuine phenomenological puzzle.

  Underneath the practical dissertation question lies deeper identity issues: Who is the "me" that makes plans? Who is the "me" that ignores them? Are either more "real"? The website blocker incident—where circumventing felt like correcting injustice—points to a visceral rejection of past-self's authority.

  The marathon friend's "you'd do it if you wanted" misses the mark because desire isn't monolithic. The user clearly wants the PhD (hence Sunday plans), but in the moment, the wanting dissolves. This isn't about insufficient desire but about desire being context-dependent and temporally unstable.

  For concrete solutions, the success of automatic savings suggests structural fixes over willpower: scheduling writing sessions as immovable appointments, using commitment devices like study rooms with accountability partners, perhaps even financial stakes (e.g., donate to a cause you hate if targets missed). The "temptation bundling" idea from behavioral science might help—pair writing with a pleasure (special coffee only during dissertation hours).

  Philosophically, I lean toward the "divided will" model but with a twist: the planning self and acting self are both authentic, just operating on different time horizons. Binding future-self isn't paternalistic but rationally self-governing—like Ulysses tying himself to the mast. The fact they find reasons to defect speaks less to bad faith and more to the context-sensitivity of reasoning: our brains excel at generating justifications for what we already feel like doing.

  The temporal asymmetry insight is crucial. We judge past selves harshly because their costs to us are concrete (we're living their consequences), while future selves' benefits feel abstract. Making future rewards more vivid—visualizing graduation, drafting the "thank you" section acknowledging present-self's grind—could help bridge that gap.

  Ultimately, this isn't about discovering "true" priorities but aligning environments with professed goals. Their Sunday plans aren't fictions; they're blueprints sabotaged by poor execution systems. The solution lies in redesigning the system so that doing the right thing requires less heroism in the moment.
answer: |-
  Your situation reveals a profound tension between intention and action—and you're remarkably clear-eyed about diagnosing it. What you describe isn't laziness; it’s a **conflict between your "planning self" and your "doing self,"** amplified by time inconsistency and the brain’s preference for immediate rewards. Below, I’ll address both the practical dissertation strategy and the philosophical framing, then synthesize them.

  ---

  ### **First: Concrete Solutions for the Dissertation**
  Your automatic savings success holds the key. **Treat your writing like your savings account:** remove reliance on willpower. Here’s how:

  1. **Lock yourself in with "pre-commitments":**  
     - Schedule **fixed, non-negotiable writing sessions** in a location you can’t avoid (e.g., campus library at 8 AM, with a friend waiting).  
     - Use apps like **Cold Turkey Blocker** (set to "Nuclear Mode" that you can’t override) or **Focusmate** for live accountability partners.  
     *Why it works:* Like your savings sweep, this bypasses the 5:40 AM debate by making inaction *harder* than action.  

  2. **Shrink the task until resistance fades:**  
     - Commit to **"10 minutes daily"**—no more. Open your document, set a timer. Often, starting is the barrier; momentum follows.  
     - Use **"temptation bundling"**: Pair writing with a pleasure (e.g., "I only listen to this podcast while drafting").  

  3. **Externalize motivation:**  
     - **Pre-pay for consequences**: Give a trusted friend £500 with instructions: "If I miss 3 deadlines, donate this to [a cause you despise]."  
     - **Public deadlines**: Book a meeting with your advisor every Friday to present new writing. Shame avoidance is potent.  

  4. **Reframe the work’s identity:**  
     - Stop thinking "I must write my dissertation." Instead: "I am a researcher who writes 300 words before breakfast."  
     - Focus on **process, not outcome**. Your goal isn’t "finish chapter 4"—it’s "spend 90 minutes in the library daily."  

  **Crucially:** Do not wait to "want" it. Your marathon friend oversimplifies; desire follows action, not vice versa.  

  ---

  ### **The Philosophical Diagnosis: Which Model Fits?**
  You’ve outlined three models of the self. None is entirely wrong, but the **"divided agent"** model (a single self with competing subsystems) best explains your experience—with caveats:

  1. **"One agent with divided will" (Your best fit):**  
     - You’re a unified self, but your brain has **competing neural subsystems**:  
       - The **"planner"** (prefrontal cortex) cares about long-term goals.  
       - The **"doer"** (limbic system) seeks immediate rewards.  
     - At 5:40 AM, your limbic system "wins" because it controls present action. The planner’s voice feels distant because it’s neurologically offline when tired/stressed.  
     - **Implications**:  
       - Binding your future self is **rational self-governance**. Just as laws bind citizens for collective good, pre-commitments align your short/long-term interests.  
       - Finding "reasons to defect" is **neurological, not moral**—your brain generates plausible excuses because it’s wired to avoid discomfort *now*.  

  2. **"Series of competing agents" (A useful metaphor, but not literal):**  
     - Derek Parfit’s "future selves as strangers" idea explains your temporal asymmetry, but it’s dangerous if overused.  
     - **Why it’s incomplete**: You *do* care about your future self (e.g., you’d panic if told your PhD would be revoked next month). Your past/future selves share core values—the conflict is about *timing*, not identity.  

  3. **"Actions reveal true priorities" (Misleading):**  
     - If this were true, you wouldn’t feel conflict. Your distress proves your *stated* priorities (finishing the PhD) *are* real—they’re just losing to short-term impulses in the moment.  

  ---

  ### **Answering Your Core Questions**
  - **Is it rational to bind my future self?**  
    **Yes.** It’s strategic rationality. If you know your "doing self" will defect, binding it is like Ulysses tying himself to the mast—wise self-preservation. Your savings account proves this works.  

  - **Are my defection "reasons" evidence of bad faith?**  
    **No.** Your brain’s excuse-generating machinery is automatic. It doesn’t reflect your values—it reflects evolutionary wiring that prioritizes immediate comfort. The fact that you *question* these excuses shows your planner-self’s integrity.  

  - **Should I change my wants or accept my "true" priorities?**  
    Neither. **Change your environment.** Your struggle isn’t about insufficient desire—it’s about a predictable vulnerability to present bias. Design systems that make writing the path of least resistance.  

  ---

  ### **The Temporal Asymmetry Resolved**
  Your asymmetry ("Past me should’ve worked, but present me won’t") arises because:  
  - **Past costs feel concrete** (you’re living with the consequences).  
  - **Future benefits feel abstract** (your brain discounts them).  
  **Solution:** Make the future visceral. Tape a photo of your dream job to your desk. Write a letter from "future you" thanking present-you for writing today.  

  ---

  ### **In Summary**
  Your diagnosis is correct: this is a **conflict of temporal perspectives**, not laziness or false priorities. Stop fighting yourself—**outsmart yourself**. Build unbreakable fences (pre-commitments), shrink tasks to bypass resistance, and externalize accountability. Philosophically, you’re one agent managing internal conflict, not many. Your reasons to defect are noise; your commitment to the PhD is the signal. 

  **Act now**: Before closing this, book one concrete action—e.g., email your advisor to schedule a standing meeting, install a website blocker, or write for 10 minutes. The bridge between your selves is built brick by brick.
