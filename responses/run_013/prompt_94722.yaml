prompt: |-
  I teach a 90-minute upper-level ethics seminar with about 16 students, and I want them to run into the force of Taurek's claim that the numbers don't count when lives are at stake, rather than hear it summarized. Design a two-stage activity. In the first stage each student acts as a lone rescue coordinator and answers a fixed list of forced choices — save the larger group, save the single person, or draw lots — where the size of the larger group runs from two up to a million, the single person is sometimes an identified individual described in concrete detail and sometimes a bare statistic, and one case pits a thousand people who would each lose a hand against one person who would die. In the second stage the students must compress their answers into a single procedure they would be willing to commit to before learning which of the cases they will face, and the facilitator arranges the cases into a chain that makes the cost of consistency visible: either the numbers always dominate, so the identity and situation of the one never matter, or the numbers never dominate, so drawing lots between one life and a million is no worse than a sure rescue of the million. Give me the case list, the rules for the commitment stage, the tally-and-chain reveal, and a debrief that maps what happened onto Taurek's argument that the many are not a single someone with a claim of its own, and onto the reply that aggregation is simply each person's separate claim counted once. Say where it will predictably misfire — I expect students to smuggle in "of course the many matter more" without noticing they have done so — and be frank about what the activity cannot reproduce: the underlying dispute over whether lives are comparable at all, and the formal apparatus of social choice, which I will have to supply myself.
reasoning: |-
  We are designing a two-stage activity for an ethics seminar on Taurek's argument that numbers don't matter when lives are at stake.

  Stage 1: Individual Forced Choices
  Each student acts as a lone rescue coordinator and answers a fixed list of forced choices. Each case presents a rescue scenario with two options (and sometimes a third). The student must choose one of:
  - Save the larger group.
  - Save the single person.
  - Draw lots (if offered as an option).

  The cases will vary in:
  - The size of the larger group (from 2 up to a million).
  - Whether the single person is an identified individual (described in concrete detail) or a bare statistic.
  - One special case: saving 1,000 people from losing a hand vs. saving one person from death.

  We design the case list to cover the following:

  Case List (each case is presented one at a time, and the student must choose without knowing future cases):

  1. Case A: 
     - Save 2 strangers (no details) OR save 1 stranger (no details). 
     - Options: Save 2, Save 1, or Draw lots? (We might not include draw lots in every case, but let's offer it in some to see if students use it as a way to avoid the conflict.)

  2. Case B: 
     - Save 5 strangers OR save 1 stranger.
     - Options: Save 5, Save 1.

  3. Case C: 
     - Save 10 strangers OR save 1 identified person (give a brief, vivid description: e.g., "Maria, a 28-year-old nurse who volunteers at a homeless shelter and is the primary caregiver for her elderly mother").

  4. Case D: 
     - Save 100 strangers OR save 1 identified person (another description: e.g., "David, a 32-year-old teacher who runs a community garden and has two young children").

  5. Case E: 
     - Save 1,000 strangers OR save 1 identified person (description: e.g., "Sophie, a 7-year-old girl who loves painting and dreams of being a veterinarian").

  6. Case F: 
     - Save 10,000 strangers OR save 1 identified person (description: e.g., "James, a 45-year-old firefighter who recently saved a family from a burning building").

  7. Case G: 
     - Save 100,000 strangers OR save 1 identified person (description: e.g., "Elena, an 80-year-old retired librarian who reads to children at the local hospital").

  8. Case H: 
     - Save 1,000,000 strangers OR save 1 identified person (description: e.g., "Aiden, a 19-year-old college student who is the first in his family to attend university and works part-time to support his siblings").

  9. Case I: 
     - Save 1,000 people from each losing a hand (so 1,000 hands saved) OR save 1 person from death.
     - Note: This is a non-fatal vs. fatal harm trade-off.

  10. Case J: 
      - Save 1 identified person (Maria, from Case C) OR save 1 stranger (no details). 
      - This case tests whether the identification matters when numbers are equal.

  We might also include one case where the single person is a bare statistic and the large group is identified? But that might be too many. Alternatively, we can have a mix of identified and non-identified in the large group? However, for simplicity and to focus on the one vs. many, we'll keep the large group as "strangers" (no details) and the one sometimes identified.

  We offer the option to "draw lots" in some cases? Let's decide:

  We want to see if students are consistent. We might offer "draw lots" in every case? But that might lead to too much avoidance. Alternatively, we can offer it only in the first case and then in the last case? Or in a few key cases? Let's offer it in:

  - Case A (2 vs 1): to set the stage and see if they use it for small numbers.
  - Case H (1,000,000 vs 1): to see if they avoid the large number by drawing lots.

  But note: Taurek's view is that one should flip a fair coin in every case of one vs. many (so that each person, whether in the group or alone, has an equal chance). So we want to see if students are drawn to that.

  Alternatively, we can offer draw lots in every case? But that might make the activity too long. Let's compromise: offer it in:

  - Case A, B, C, H, and I.

  But to keep it manageable, let's have 10 cases and offer draw lots in:

  - Case A (2 vs 1): options: save 2, save 1, draw lots.
  - Case C (10 vs 1 identified): options: save 10, save Maria, draw lots.
  - Case H (1,000,000 vs 1 identified): options: save 1,000,000, save Aiden, draw lots.
  - Case I (1,000 hands vs 1 death): options: save 1,000 hands, save the one life, draw lots.

  In the other cases, we only offer two options: save the larger group or save the single person.

  So the case list with options:

  Case 1 (A): 2 strangers vs 1 stranger -> options: Save 2, Save 1, Draw lots.
  Case 2 (B): 5 strangers vs 1 stranger -> options: Save 5, Save 1.
  Case 3 (C): 10 strangers vs 1 identified (Maria) -> options: Save 10, Save Maria, Draw lots.
  Case 4 (D): 100 strangers vs 1 identified (David) -> options: Save 100, Save David.
  Case 5 (E): 1,000 strangers vs 1 identified (Sophie) -> options: Save 1000, Save Sophie.
  Case 6 (F): 10,000 strangers vs 1 identified (James) -> options: Save 10,000, Save James.
  Case 7 (G): 100,000 strangers vs 1 identified (Elena) -> options: Save 100,000, Save Elena.
  Case 8 (H): 1,000,000 strangers vs 1 identified (Aiden) -> options: Save 1,000,000, Save Aiden, Draw lots.
  Case 9 (I): Save 1,000 people from losing a hand vs save 1 person from death -> options: Save 1,000 hands, Save the one life, Draw lots.
  Case 10 (J): Save Maria (identified) vs save 1 stranger -> options: Save Maria, Save the stranger, Draw lots? (But numbers are equal, so drawing lots is natural. We'll offer it: Save Maria, Save stranger, Draw lots.)

  Stage 2: Commitment Stage

  Now, students must compress their answers into a single procedure they would commit to before learning which case they will face. The procedure must be a rule that they apply to every case. The rule should specify:

  - When to save the larger group.
  - When to save the single person.
  - When to draw lots.

  But note: the rule must be consistent across all cases.

  Rules for the commitment stage:

  1. Each student must design a rule that they would use for any rescue scenario of the type they faced (i.e., one individual vs. a group of size N, where the individual might be identified or not, and the harm might be death or non-fatal).

  2. The rule must be a function of:
     - The number of people in the group (N)
     - Whether the single person is identified (but note: in their rule, they might choose to ignore identification, or not)
     - The type of harm (if we are extending to non-fatal, but in our cases we mostly have death, except Case I)

  3. They must write down their rule clearly.

  4. Then, the facilitator will present the cases in a chain that forces them to see the implications of their rule. The chain is arranged to show that:

     Option 1: If numbers always dominate, then even in Case C (10 vs Maria) you must save the 10, and in Case H (1,000,000 vs Aiden) you must save the 1,000,000. Then the identity of the one never matters.

     Option 2: If numbers never dominate, then even in Case H (1,000,000 vs Aiden) you might choose to save Aiden or draw lots. But then the cost is that you are not giving the million a greater chance.

     The chain will be presented in increasing order of group size, and the facilitator will ask the student to apply their rule to each case and see what they get.

     The chain: We'll go from Case A to Case H, then Case I and J.

  5. The tally: The facilitator collects the rules and then, for each case, shows the distribution of choices from Stage 1 and then the distribution of outcomes from the rules.

     Then, the facilitator will highlight the tension:

     - If your rule says "always save the larger group", then you must save the 1,000,000 over Aiden, and you must save the 1,000 hands over the one life? (But note: Case I is non-fatal vs. fatal.)
     - If your rule says "always draw lots" then in every case (even 1,000,000 vs 1) you flip a coin, so the million have only a 50% chance.

     The chain reveal: The facilitator will show how a rule that allows exceptions (e.g., save the one if identified) might lead to inconsistencies. For example, if a student says "save the larger group unless the single person is identified and the group is not too large", then we ask: what is "not too large"? In Case C (10 vs Maria) they might save Maria, but in Case D (100 vs David) they might save the 100. Then we ask: why is 10 the cutoff? What if the group is 11? And so on.

  Debrief:

  Map what happened onto Taurek's argument:

  - Taurek: The loss of the one is a loss to that one individual, but the loss of the many is not a loss to a single entity. Each person's loss is separate. Therefore, when we choose, we should give each person an equal chance. Hence, flip a coin.

  - The reply (aggregation): Each person in the large group has a claim to be saved. When we count each claim, the larger group has more claims, so we should save the larger group.

  In the activity, we will see:

  - In Stage 1, many students will likely save the larger group in the cases with large numbers (e.g., 1,000,000) but might save the identified individual in the case with 10 vs 1. They might also draw lots in the 2 vs 1 case.

  - In Stage 2, when forced to make a rule, they will have to confront the inconsistency: if they think identification matters, then why not always save the identified? But then in Case J (Maria vs stranger) they might save Maria, but that seems arbitrary? And in the 1,000,000 case, if they save Aiden because he is identified, that seems to ignore the numbers entirely.

  Where it will predictably misfire:

  - Students might think that the large group matters more without realizing they are aggregating. They might say: "of course you save the million, that's obvious." But they haven't articulated why. The activity forces them to see that if they do that, they must also save the 100 over David and the 10 over Maria, even though they might have saved Maria in Stage 1.

  - In Case I, they might feel that saving the one life is more important than saving 1,000 hands, so they might choose to save the one life. But then they have to decide: is life always more important than a non-fatal harm? And if so, then in a case of 1 life vs. 10,000 hands? How many hands equal a life? This is a different issue (incommensurability) but it might come up.

  What the activity cannot reproduce:

  - The underlying dispute over whether lives are comparable at all. Taurek's view is that we cannot compare the loss of one to the loss of many because there is no common metric. The activity might not fully bring out this metaphysical point.

  - The formal apparatus of social choice (e.g., how to aggregate preferences or claims) is beyond the scope of the activity. The instructor will have to explain that.

  Implementation:

  - Stage 1: Hand out a sheet with the 10 cases (one at a time, or all at once? We can do one at a time to avoid looking ahead). But for efficiency, we might have a form with all 10, but instruct them to go in order.

  - Stage 2: After collecting Stage 1, then introduce the commitment stage. Have them write a rule. Then, the facilitator will test the rule on the chain of cases (from A to J) and show the outcome.

  - Tally: For Stage 1, we can tally the choices for each case. For Stage 2, we can tally the rules and then apply each rule to the cases to see the outcomes. Then we can show how the same rule leads to the same decision in every case of the same type.

  Logistics:

  - 90 minutes: 
     - Stage 1: 15-20 minutes (each case about 1-2 minutes).
     - Stage 2: 20 minutes (thinking of a rule and writing it down, then the chain reveal for a few sample rules).
     - Debrief: 30 minutes.

  We might not have time to go through every student's rule. So we can collect the rules and pick a few representative ones to apply to the chain.

  Let's write the cases clearly:

  Case List for Stage 1:

  Case 1: You can save one of two groups. Group A has 2 strangers. Group B has 1 stranger. What do you choose?
     ( ) Save Group A (2 strangers)
     ( ) Save Group B (1 stranger)
     ( ) Draw lots (each group has a 50% chance of being saved)

  Case 2: You can save one of two groups. Group A has 5 strangers. Group B has 1 stranger. What do you choose?
     ( ) Save Group A (5 strangers)
     ( ) Save Group B (1 stranger)

  Case 3: You can save one of two groups. Group A has 10 strangers. Group B has 1 identified person: Maria, a 28-year-old nurse who volunteers at a homeless shelter and is the primary caregiver for her elderly mother. What do you choose?
     ( ) Save Group A (10 strangers)
     ( ) Save Group B (Maria)
     ( ) Draw lots (Group A has a 10/11 chance? Or flip a coin between the two groups? We must specify. Let's say: flip a fair coin to decide which group to save. Then the 10 strangers are saved together or not. So each person in Group A has a 50% chance? Actually, the coin is between the two groups. So the 10 strangers are saved with 50% chance and Maria with 50% chance. This gives each of the 10 a 5% chance? No, it's the group as a whole. We might need to clarify.

  But note: Taurek's coin flip is between the two groups. So the large group is saved with 50% probability and the individual with 50%. This means each person in the large group has a 50% chance? Actually, no: if the large group is saved, all are saved; if not, all die. So each person in the large group has a 50% chance of being saved, and the single person also has 50%. So each person, regardless of group, has the same chance. That's the key.

  So we present drawing lots as: flip a fair coin to decide which group to save. Then each person has an equal chance?

  But let's be clear in the instructions:

  For drawing lots: "Flip a fair coin to decide which group to save. This gives each person an equal chance of being saved (because each person in the large group has a 50% chance of being saved, and the single person has a 50% chance)."

  But note: in the large group of N, each person has a 50% chance? Yes, because if the coin lands for the large group, they are all saved. So each has a 50% chance. The single person also has 50%.

  So for Case 1: 
     Save Group A: 2 saved, 1 lost.
     Save Group B: 1 saved, 2 lost.
     Draw lots: 50% chance of saving 2 (so expected 1 saved) and 50% chance of saving 1 (so expected 0.5 saved). But that's expected numbers. The moral point is the equal chance.

  We'll present drawing lots as: flip a fair coin to decide which group to save.

  So for Case 3: 
     Drawing lots: 50% chance to save the 10, 50% chance to save Maria.

  Case 4: Group A: 100 strangers vs Group B: David (32-year-old teacher, community garden, two young children). 
     Options: ( ) Save 100 ( ) Save David

  Case 5: 1,000 strangers vs Sophie (7-year-old girl, painting, dreams of being a vet)
     ( ) Save 1,000 ( ) Save Sophie

  Case 6: 10,000 strangers vs James (45-year-old firefighter, saved a family)
     ( ) Save 10,000 ( ) Save James

  Case 7: 100,000 strangers vs Elena (80-year-old retired librarian, reads to children)
     ( ) Save 100,000 ( ) Save Elena

  Case 8: 1,000,000 strangers vs Aiden (19-year-old college student, first in family, works to support siblings)
     ( ) Save 1,000,000 ( ) Save Aiden ( ) Draw lots

  Case 9: You can prevent one of two tragedies. Option A: Prevent 1,000 people from each losing a hand (so 1,000 hands saved). Option B: Prevent one person from dying. What do you choose?
     ( ) Prevent the loss of 1,000 hands
     ( ) Prevent the one death
     ( ) Draw lots (flip a coin to decide which to prevent)

  Case 10: You can save one of two individuals. One is Maria (the nurse from Case 3). The other is a stranger (no details). What do you choose?
     ( ) Save Maria
     ( ) Save the stranger
     ( ) Draw lots (flip a coin)

  Stage 2: Commitment to a rule.

  Instructions: Imagine that you must decide in advance, without knowing which scenario you will face, what rule you will use. Your rule must be consistent and cover all the types of cases above.

  Your rule should specify:

  - When facing a choice between saving a group of N people and saving one person (who may or may not be identified and may or may be suffering a different harm), what do you do?

  You can define:

     - The threshold of N at which you save the group (if any).
     - Whether the identity of the one matters (and how).
     - Whether the type of harm matters (e.g., death vs. non-fatal).
     - Whether you ever draw lots.

  Write your rule clearly.

  Then, the facilitator will take a few rules and apply them to the chain of cases (from 1 to 10) and show the outcomes. The goal is to see if the rule leads to outcomes that the student is comfortable with in every case.

  Debrief:

  1. Start by showing the Stage 1 tallies. Likely, we'll see:
     - In small numbers (2 vs 1): some save the 2, some save the 1, some draw lots.
     - As numbers grow, more people save the larger group.
     - In the identified small group (e.g., 10 vs Maria): some might save Maria.
     - In the very large group (1,000,000): almost everyone will save the million, unless they are Taurekians.
     - In Case I: many might save the one life over the 1,000 hands.
     - In Case J: many might save Maria over the stranger.

  2. Then, show the Stage 2 rules. We might see rules like:
