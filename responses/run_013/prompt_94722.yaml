     - Students who in Stage 1 saved the million without hesitation might not have realized they were aggregating. Then, when forced to make a rule, they might see that they must also save the 100 over David and the 10 over Maria, which they might have chosen differently in Stage 1.

  6. What the activity cannot do:
     - It doesn't settle the metaphysical question of whether losses can be aggregated. It only makes the students feel the pull of both sides.
