answer: |-
  ### Final Examination: Archaeological Inference  
  **Harrow Field Site Dossier**  
  *(Fictional site summary for examination purposes)*  

  **Site Description**:  
  Harrow Field is a settlement with an adjacent cemetery, occupied over three centuries. Excavated in three phases; lowest levels waterlogged, upper levels dry. Key features:  

  1. Thirty-eight round houses, rebuilt repeatedly on same footprints, in two spatially separate clusters. One larger rectangular building at the center of the eastern cluster.  
  2. Cemetery (124 graves) inside ditched enclosure, 200m from houses. Ditch fills clean; domestic refuse deposited in midden beside houses.  
  3. Grave goods: 110 graves contain ≥1 pot; 14 contain copper-alloy objects; 4 contain stone from 300km away; 3 contain miniature four-wheeled vehicles; 2 contain bird figurines. Richly furnished graves scattered (not grouped); weak correlation with skeletal age/sex.  
  4. Twenty-two graves reopened post-burial: disturbed fills, missing skeletal elements (mostly long bones/skulls); grave goods undisturbed.  
  5. Animal bone: Skulls/foot bones concentrated in/around houses; meat-bearing bones in midden. Small quantities of meat-bearing cattle bone in 9 graves.  
  6. Three storage pits contain a complete pot set upright on base (no refuse); others contain refuse or are empty.  
  7. 2–3% of lithics in all phases from sources >150km away; proportion stable across sequence.  
  8. No writing; no figurative art except two bird figurines.  
  9. Rectangular building’s floor: burnt layer with charred grain and scattered broken pots. Round houses have central hearths but no comparable feature.  
  10. Dating between house clusters/phases coarse (±100 years).  

  ---

  **Claims for Assessment**:  
  (a) The dead were buried in two stages, with some bones removed after the flesh had decayed.  
  (b) The community believed that the dead had to be released before they could join the ancestors.  
  (c) The settlement was occupied by two contemporaneous descent groups, one per cluster of houses.  
  (d) Access to copper-alloy/imported stone objects was restricted to a few families and passed down by inheritance.  
  (e) The rectangular building was a communal structure in which grain was consumed on repeated occasions.  
  (f) Cattle were slaughtered seasonally, in late summer.  
  (g) The community distinguished a domain of the sacred from the ordinary.  
  (h) The two bird figurines represent a supernatural being.  
  (i) The community was in sustained, low-level contact with groups ≥150km away.  

  ---

  **Question**:  
  **Sort the claims (a)–(i) into three categories**:  
  1. **Supported** by the dossier as it stands.  
  2. **Evidentially underdetermined** (settlable by further observation of same kind).  
  3. **Semantically underdetermined** (requires evidence beyond material patterns).  

  **Justify each placement**:  
  - Name the **specific dossier item(s)** supporting your categorization.  
  - Identify the **bridge assumption** needed for the claim (e.g., "assumes that X pattern implies Y meaning").  

  **Then**:  
  1. Select **one claim from each category**. For each:  
     - State what **further evidence** would raise/lower confidence.  
     - State whether this evidence is of the **same kind** as existing data.  
  2. Propose a **general principle** about which claims regarding past minds the material record can/cannot settle.  
     - Apply this principle to **one new claim** (of your own devising) about Harrow Field not listed above. Defend your reasoning.  

  **Time**: 90 minutes  
  **Marks**: 20  

  ---

  ### Model Answer (≈750 words)  
  **Part 1: Categorization and Justification**  
  *(Marks: 9)*  

  - **Supported (Directly settled by dossier)**:  
    - **(a)**: Supported by #4 (reopened graves with missing bones/unmoved goods). Bridge assumption: Removal of specific bones after decay implies deliberate post-decomposition activity.  
    - **(i)**: Supported by #7 (stable exotic lithics). Bridge assumption: Sustained exotic material presence indicates ongoing contact.  

  - **Evidentially Underdetermined (Settlable by more data of same kind)**:  
    - **(c)**: Relies on #1 (house clusters). Bridge assumption: Spatial separation implies distinct social units. *Underdetermined due to #10 (coarse dating)*: Better phasing could confirm contemporaneity.  
    - **(d)**: Relies on #3 (scattered rich graves). Bridge assumption: Restricted goods imply inherited status. *Underdetermined*: Inheritance requires lineage data (e.g., DNA/burial clusters) not present.  
    - **(f)**: Relies on #5 (cattle bone distribution). Bridge assumption: Seasonal slaughter leaves osteological signatures. *Underdetermined*: Cementum analysis or tooth eruption data could test seasonality.  

  - **Semantically Underdetermined (Requires non-material evidence)**:  
    - **(b)**: Uses #4 (bone removal). Bridge assumption: Bone removal *means* "release to ancestors." No material test can confirm belief; requires analogy/text.  
    - **(g)**: Uses #6 (pots in pits) and #2 (clean ditch vs. midden). Bridge assumption: Spatial segregation *means* "sacred/profane." Meaning is imposed, not observable.  
    - **(h)**: Uses #3 (bird figurines). Bridge assumption: Figurines *represent* supernatural beings. Without art/text, interpretation is untestable.  
    - **(e)**: Uses #9 (burnt grain in building). Bridge assumption: Grain consumption *implies* communal ritual. Alternate explanations (e.g., storage accident) possible; no behavioral signature.  

  **Part 2: Further Evidence for One Claim per Category**  
  *(Marks: 6)*  
  - **Supported claim (i)**: Confidence raised by finding non-lithic imports (e.g., pottery styles) from same distant source (#7). *Same kind*: Material provenance data.  
  - **Evidentially underdetermined claim (d)**: Confidence raised by skeletal DNA linking grave goods to biologically related individuals across generations. *Same kind*: Osteological/genetic data.  
  - **Semantically underdetermined claim (b)**: Confidence *lowered* by finding ethnographic analogy where bone removal has no ancestral meaning. *Not same kind*: Requires external cultural evidence.  

  **Part 3: General Principle**  
  *(Marks: 5)*  
  - **Principle**: The material record can settle claims about *actions* and *contacts* (e.g., trade, technologies) through direct patterns. It cannot settle claims about *beliefs*, *meanings*, or *social abstractions* without independent evidence for cultural logic. These require bridge assumptions unanswerable to material data alone.  
  - **New claim**: "Miniature vehicles in graves symbolized journey to afterlife."  
  - **Application**: This is semantically underdetermined (#3). Vehicles are observable, but "symbolize journey" imposes meaning. Osteology (#3) shows no age/sex pattern to support symbolic role. Only texts/depictions could settle this—but #8 rules these out.  

  ---

  ### Marking Scheme (20 marks total)  
  **1. Correct Categorization** (5 marks)  
  - *A answer*: All claims correctly sorted (Supported: a,i; Evidential: c,d,f; Semantic: b,e,g,h).  
  - *Common loss*: Misclassifying semantic claims (e.g., putting b or h in evidential).  

  **2. Justification Quality** (4 marks)  
  - *A answer*: Explicitly names dossier items *and* bridge assumptions for all claims.  
  - *Common loss*: Naming data but not bridge assumptions (e.g., for (b): "uses #4" but omits "assumes bone removal = belief").  

  **3. Further Evidence Analysis** (6 marks)  
  - *A answer*: For one claim per category:  
    - Evidence proposed is feasible and directly tests the claim.  
    - Correctly identifies if evidence is "same kind" (e.g., DNA for (d) is same kind; analogy for (b) is not).  
  - *Common loss*: Proposing "more excavation" for semantic claims (e.g., "find more figurines to confirm (h)").  

  **4. Principle Formulation** (3 marks)  
  - *A answer*: Distinguishes actions/contacts (testable) from meanings/beliefs (untestable without external evidence).  
  - *Common loss*: Vague principle (e.g., "archaeology has limits").  

  **5. New Claim Application** (2 marks)  
  - *A answer*: Invented claim is plausible; applies principle consistently (e.g., rejects "symbolism" as semantic).  
  - *Common loss*: Proposing a claim already resolvable by dossier (e.g., "more houses existed").  

  **A-grade requirement**: Must correctly identify *all* semantic claims (b,e,g,h) and *not* propose material data to settle them. A B answer may miss 1–2 semantic distinctions or misapply "further evidence."  

  ---  
  *End of Examination*
