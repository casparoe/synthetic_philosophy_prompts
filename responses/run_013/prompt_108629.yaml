prompt: |-
  I'm running the first session of a reading group on the extended mind thesis for non-specialists -- smart adults, no philosophy background -- and I've already picked the readings, so I just need the teaching plan, not the explanation itself. What has to be in place before the question even makes sense? I think they need the causation-versus-constitution distinction in their hands first, but say so if that's the wrong place to start and what should come before it. Then: the one case that carries the whole thing. Should it be Otto and the notebook, or has that example been worn so smooth that the group will just nod along without doing any work? If not that, what instead, and what does the replacement have to have that the notebook has, and what should it lack? They'll walk in assuming it's obviously true (we all use tools) or obviously false (a notebook isn't part of my brain) -- tell me which of those I should let them sit in first, and exactly where in the sequence I head off the other. I also want to smuggle in an idea I think does a lot of work here: that the external thing might not need to do the same job as the internal one, just a complementary job. Where does that go, and what misconception does it risk creating (the slide into 'so anything I happen to use is part of my mind')? I'm expecting the ususal muddles too -- thinking this is about consciousness or some group mind, and thinking it's an empirical claim a brain scanner could settle. Where do I kill each one? And give me one question to put to them at the end that shows whether they've actually got the thesis rather than just gotten comfortable with the word 'extended', plus what I should openly refuse to get into at this level.
reasoning: |-
  Okay, the user is setting up a reading group on the extended mind thesis for non-specialists. They've already picked the readings but need a teaching plan. They're asking about where to start—specifically whether to begin with the causation vs. constitution distinction. They also want to know which example to use: Otto's notebook or something else. They're concerned that Otto might be too familiar, leading to shallow agreement.  

  They mention participants might come in with two extreme views: either thinking it's obviously true (because we use tools) or obviously false (because a notebook isn't the brain). They're asking which misconception to address first and when to introduce the other.  

  There's also a deeper point they want to include: that external elements don't need to mimic internal ones but can play complementary roles. They're worried this could lead to the "everything is part of the mind" problem.  

  They anticipate other muddles: confusion with consciousness, group minds, or treating it as an empirically testable claim via brain scans. They want to know where to address these.  

  Finally, they want one closing question to test understanding and guidance on what to avoid at this level.  

  First, I need to structure the session step by step. Starting with the distinction between causation and constitution seems right because without it, the thesis doesn't make sense. Participants need to grasp that the mind isn't just influenced by external tools but that those tools can be constitutive parts of cognitive processes.  

  For the example, Otto's notebook might be overused, but it's effective because it's clear and relatable. However, the user is worried it's too smooth. Maybe introducing a variation would help, like a digital tool (smartphone app) or a different scenario (navigation using GPS). The key elements to preserve are reliability, accessibility, and automatic endorsement. The replacement should avoid features that trigger immediate objections, like shared access or physical distance issues.  

  Addressing misconceptions: Start with the "obviously false" view early when introducing Otto, to challenge the intuition that only the brain counts. Then later, when discussing boundaries, tackle the "obviously true" view to prevent overextension.  

  The complementary roles idea should come after establishing constitution, maybe when discussing parity vs. complementarity. Emphasize that external elements don't need to function identically to internal ones but must be integral to the cognitive process. Warn against the "everything is mind" risk by stressing the criteria (trust, accessibility, etc.).  

  For other muddles: Clarify that extended mind isn't about consciousness when defining cognition early on. Distinguish it from group minds by focusing on individual cognition. Address the empirical claim issue by explaining that it's a conceptual argument about what counts as cognition, not something a brain scanner can detect.  

  The closing question should test if they understand the criteria for constitution versus mere causation. For example, asking why a calculator isn't part of the mind despite being used for math.  

  What to avoid: Consciousness, group cognition, and empirical debates. Stick to the conceptual framework.  

  Now, organizing the teaching plan into phases:  
  1. **Framing & Entry Point**: Define cognition, then introduce the thesis question.  
  2. **Constitution vs. Causation**: Use an example like a prosthetic leg to illustrate the distinction.  
  3. **Core Example (Otto or Alternative)**: Present the case, address the "obviously false" reaction, emphasize criteria.  
  4. **Deepening - Complementarity**: Introduce the idea of complementary roles with examples like sketching. Highlight criteria to avoid overextension.  
  5. **Common Muddles**: Tackle consciousness, group minds, and empirical claims explicitly.  
  6. **Consolidation**: Discuss boundaries, address the "obviously true" view.  
  7. **Closing**: Use the calculator question to test understanding.  

  The user's deeper needs: They want participants to genuinely engage with the argument, not just nod along. They need a structure that provokes thought, addresses misconceptions methodically, and ensures comprehension without getting bogged down in advanced topics. The plan should balance clarity with challenge, using relatable examples while avoiding oversimplification.
answer: |-
  Here's a step-by-step teaching plan designed to build understanding sequentially, tackle misconceptions head-on, and ensure participants grasp the core conceptual argument. Focus on **structure** and **key moves**, not content explanation.

  **Session Goal:** Participants understand the Extended Mind Thesis (EMT) as a claim about the *constitutive conditions* of cognition (not just causation), can apply its criteria, and recognize common misunderstandings.

  **Phase 1: Setting the Stage (What Question Are We Even Asking?) (20 mins)**
  1.  **Hook & Framing (5 min):** Start with a simple question: *"Where does your mind end? Is it just inside your skull?"* Elicit quick gut reactions. **Let them briefly sit in the "obviously false" camp** (skull/brain boundary feels intuitive). Acknowledge this intuition.
  2.  **Defining the Territory (10 min):** Explicitly state: *"Today isn't about consciousness (what it's like to be you), group minds, or how tools *affect* us. It's about the physical *stuff* that literally *constitutes* specific cognitive processes – like remembering, calculating, reasoning."*
  3.  **The Crucial Distinction: Causation vs. Constitution (5 min):**
      *   **Introduce:** *"To even ask this question, we need one key tool: Causation vs. Constitution."*
      *   **Example (Prosthetic Leg):** "A prosthetic leg *causes* me to walk. But is it *constitutive* of my walking? If I lose it, I *can't* walk – it's part of the walking system itself. My coffee *causes* me to be alert, but isn't *constitutive* of my alertness." Contrast with neurotransmitters *inside* the brain being constitutive of a mental state. **This distinction is essential groundwork.**

  **Phase 2: The Core Case & Overcoming "Obviously False" (25 mins)**
  1.  **Introduce Otto & the Notebook (or Alternative) (5 min):**
      *   **Option 1 (Otto):** Use it. Its familiarity is an asset *if* you immediately challenge superficial readings. Present it clearly: Otto has Alzheimer's, uses a reliable, instantly accessible, trusted notebook *as* his memory. Inga uses biological memory. Both form the belief "MOMA is on 53rd St." functionally identically. **Don't linger on description.**
      *   **Option 2 (Alternative - e.g., Smartphone Navigation):** "Imagine Sarah navigating a new city. She doesn't have an internal 'map sense'. Instead, she constantly, seamlessly uses a GPS app on her phone. It's always on, instantly accessible, she trusts it implicitly, and her route-planning *depends* on this real-time feed. Is the phone + app *constitutive* of her navigational reasoning *right now*?" **Why this works:** Familiar, preserves core criteria (reliability, accessibility, trust, automatic endorsement), lacks the 'shared notebook' distraction, feels less 'stale'. Avoid examples involving distance (e.g., library books) or non-individual access initially.
  2.  **Force the "Obviously False" Reaction & Counter it (15 min):**
      *   **Pose the Challenge:** *"Okay, but hold on! A notebook/smartphone isn't *part of my brain*! It's external, made of different stuff. How can it *be* part of my mind? That feels absurd."* **Let them articulate this strong intuition.** Write it down.
      *   **Reframe using Constitution:** *"Remember causation vs. constitution. Is the notebook/app merely *causing* Otto/Sarah to remember/know? Or is it playing the *same functional role* as Inga's biological memory/Sarah's internal spatial reasoning? If the process of retrieving and using that information is functionally identical *and* the external resource meets the right conditions (reliability, access, trust), why *shouldn't* it count as part of the cognitive system *constituting* the belief/process?"* Hammer the functional equivalence and the constitutive role.
      *   **Key Move:** *"The EMT argues the notebook/app isn't just a *tool for* memory/navigation; under these conditions, it *is* part of the memory/navigation system itself."*
  3.  **Introduce the Criteria (5 min):** Explicitly state Clark & Chalmers' "glue and trust" criteria (Reliability, Accessibility, Endorsement, Past Endorsement) as *necessary conditions* for constitution in this context. *"Without these, it's just a useful tool causing an effect, not a constitutive part."*

  **Phase 3: Deepening - Complementarity & Avoiding "Obviously True" (20 mins)**
  1.  **Introduce Complementarity (10 min):**
      *   *"Here's a crucial twist: The external element doesn't have to do the *exact same job* as the internal one. It can play a *different, complementary role* within the overall cognitive process."*
      *   **Example (Sketching/Doodling):** "Imagine solving a complex design problem. You sketch rapidly, trying ideas. The sketch isn't *storing* a finished thought like memory. It's *offloading* working memory, *scaffolding* visual reasoning, *prompting* new associations. The cognitive process of designing *relies constitutively* on this coupled interaction between brain and sketchpad – they do different but complementary jobs." (Use whiteboard actively to demonstrate).
      *   **Connect:** *"This shows EMT isn't just about replacing 'internal' bits with 'external' copies (like Otto's notebook vs. Inga's memory). It's about cognitive systems dynamically integrating internal *and* external resources with *different* properties to achieve cognition."*
  2.  **Head Off "Obviously True" & the "Everything is Mind" Risk (10 min):**
      *   **Pose the Danger:** *"So, does this mean my coffee cup is part of my mind because I use it? Or the whole internet? Is *everything* I interact with part of my mind?"* **Let them voice this concern.**
      *   **Apply the Criteria as a Scalpel:** *"NO. This is the risk of sliding from constitution to mere causation. Remember our criteria! Is the coffee cup *reliably*, *constantly accessible*, and *automatically endorsed* as part of my core cognitive process *for a specific task*? Does it play a *constitutive role* meeting those conditions? Probably not. It's a cause, not a constituent. The EMT requires *tight coupling* and meeting those specific criteria. Not everything we *use* is part of our *mind*."* Re-emphasize the Otto/Sarah/sketching examples meet the criteria; the coffee cup/library/internet generally do not.

  **Phase 4: Tackling Common Muddles (10 mins)**
  *   **Consciousness:** *"Quick reminder: EMT is about cognition (processes like memory, reasoning), NOT about the subjective feeling of consciousness. An extended belief can be unconscious (like many internal ones!)."*
  *   **Group Minds:** *"EMT, as we're discussing it (Clark & Chalmers), is about *individual* cognition extending into the environment, not about some collective group consciousness."*
  *   **Empirical Claim / Brain Scanners:** *"EMT is a *conceptual* claim about what *counts* as a cognitive state/process. It's not saying brain scans would show identical activity with/without the notebook (they wouldn't!). It's arguing that the functional role defines the cognitive state, and that role can be physically realized across brain, body, and environment."* (Kill this early if it arises during Otto discussion, reinforce here).

  **Phase 5: Consolidation & The Closing Test (15 mins)**
  1.  **Summarize the Core Argument (5 min):** Reiterate: EMT claims that under specific conditions (reliability, accessibility, endorsement), external resources can be *constitutive parts* of an individual's cognitive system, not just causal influences, because they play the necessary functional role in a cognitive process. Complementarity shows it's not just replication.
  2.  **The Test Question (5 min):** Pose: *"Imagine someone uses a calculator app for complex math. They are highly skilled with it, use it constantly, trust it completely for this task. Is the calculator app *constitutive* of their mathematical reasoning process? Why or why not? Apply the criteria."*
      *   **Why it works:** It tests if they grasp the criteria beyond the paradigmatic memory example. A calculator *doesn't* play the *same* role as internal calculation (it replaces/transforms it), but *does* it meet the criteria for being constitutive? (Likely "Yes" for the specific process of *getting the answer*, but it raises interesting questions about the nature of calculation vs. lookup – perfect for discussion). It forces application.
  3.  **Explicitly Off-Limits (5 min):** State upfront at the end: *"We're stopping here at the conceptual core. We are NOT diving into:* Consciousness / Group minds or collective cognition / The 'hard problem' / Detailed empirical neuroscience debates / Specifics of implementation or AI / Potential metaphysical implications beyond basic constitution. Those are for later sessions or your own exploration!"*

  **Key Teaching Moves Throughout:**
  *   **Anticipate & Name Misconceptions:** Explicitly label them ("Here's the 'obviously false' objection...", "This risks the 'everything is mind' slide...").
  *   **Use the Whiteboard:** Diagram Causation vs. Constitution, list the Criteria, map Complementarity (Brain <-> Sketchpad doing different jobs).
  *   **Demand Application:** Constantly ask "Does X meet the criteria? Why/why not?" Use cold calling if needed to ensure engagement beyond nodding.
  *   **Control Scope:** Ruthlessly steer discussion back to the core constitutive claim and criteria when tangents arise.
  *   **Embrace Productive Tension:** Let them wrestle with the "obviously false" intuition before reframing it; let them feel the "everything is mind" risk before applying the criteria to block it.

  This plan builds the necessary conceptual scaffolding (causation/constitution first), uses a core example (Otto or alternative) to challenge deep intuitions, introduces complementarity to enrich the view while providing tools to avoid overextension, explicitly kills major muddles, and ends with a test question that moves beyond the initial example to assess real understanding.
