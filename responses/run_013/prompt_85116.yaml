prompt: |-
  I'm putting together a seminar on Aquinas and tyrannicide and I want a prediction exercise for my students. Here's the track record I've extracted from his discussions, as I read him. Tell me what he'd say about the new case at the end, and which rule he's implicitly running. I'm less interested in the verdict itself then in the competing rules that fit the earlier cases, and which further case would settle it.

  Earlier verdicts:

  1. A general seizes the throne by force, killing the royal family. He then rules brutally, executing opponents and taxing heavily. The senate authorises a plot to kill him, and the plot would cause some unrest but far less suffering than his continued rule. Aquinas's verdict: the plot is permissible; the killer would be honoured.

  2. A king inherits the throne legitimately. He becomes a tyrant, executing opponents and taxing heavily. No public authority authorises killing him, and a plot to kill him would trigger a civil war that kills far more people than his tyranny would. Aquinas's verdict: the plot is not permissible; private individuals may not kill him.

  3. A king inherits the throne legitimately. He becomes a tyrant, but the harm he causes is relatively mild — heavy taxes, some unjust imprisonments. No public authority authorises killing him, and a plot to kill him would cause a civil war that kills many more people than his rule would. Aquinas's verdict: not permissible.

  New case:

  4. A usurper seizes power by force, but then rules moderately for twenty years. The country is stable and prosperous. No public authority authorises killing him, and a plot to kill him would cause a civil war that kills more people than his rule would. Is it permissible to kill him?

  What would Aquinas say about case 4? Which rule is he implicitly running across the earlier verdicts — usurper versus legitimate ruler, a proportionality condition, the presence or absence of public authority, or something else? Are there other rules that fit the earlier verdicts just as well? Which of those rules does case 4 pull apart, and what further case would best tell them apart?

  Please seperate what's actually settled in Aquinas scholarship from what's genuinely contested, and don't present a contested reading as the consensus.
reasoning: |-
  Okay, the user is preparing a seminar on Aquinas and tyrannicide, specifically wanting a prediction exercise for students. They've presented three past verdicts from Aquinas and a new case, asking what Aquinas would say about case 4. The user wants to focus on the competing rules that fit the earlier cases and which additional case could help settle between those rules.

  Looking at the three earlier verdicts:
  - Case 1: Permissible - usurper, brutal rule, public authorization, net lives saved
  - Case 2: Not permissible - legitimate ruler, brutal rule, no public authorization, civil war would cause more deaths
  - Case 3: Not permissible - legitimate ruler, mild harm, no public authorization, civil war would cause more deaths

  For case 4: A usurper who seized power but has ruled moderately for 20 years, with stability and prosperity. No public authorization for killing him, and a plot would cause a civil war killing more people than his rule.

  The key is to identify the implicit rules Aquinas might be using. From the cases, several factors emerge:
  1. Legitimacy of rule (usurper vs legitimate)
  2. Severity of tyranny (brutal vs mild)
  3. Public authorization (senate vs private individuals)
  4. Proportionality (net harm calculation)

  In case 1, all factors align for permissibility: usurper, brutal, authorized, net lives saved. In cases 2 and 3, legitimacy and lack of authorization block permissibility regardless of severity. The proportionality condition seems secondary when authorization is absent.

  For case 4, the usurper status might suggest permissibility, but the moderate rule and potential civil war complicate things. Aquinas would likely say not permissible primarily due to lack of public authorization and the disproportionate harm. The usurper's past illegitimacy might be mitigated by long, stable rule.

  Competing rules that fit the cases:
  - Rule A: Requires both usurpation AND public authorization for permissibility
  - Rule B: Public authorization is necessary and sufficient if proportionality is met
  - Rule C: Usurpation alone allows private action if proportionality is met

  Case 4 pulls apart Rule A vs Rule C. To distinguish, we'd need a case with a usurper, no public authorization, but net lives saved without civil war. If Aquinas permitted that, it would support Rule C; if not, Rule A.

  Scholarship points to consensus on public authorization as necessary, but debate exists on whether usurpers automatically lose authority protection. The "common good" as the ultimate criterion is undisputed, while how to weigh factors like duration of rule is contested.
answer: |-
  Based on Aquinas's texts (especially *De Regno* and *Summa Theologiae* II-II, Q.42 A.2 & Q.64 A.3) and your constructed track record, here's an analysis focused on the competing rules and the pedagogical exercise:

  **Aquinas's Likely Verdict on Case 4: NOT PERMISSIBLE**

  *   **Reasoning:** While the ruler is a usurper (a point favoring removal), the *lack of public authorization* and the *disproportionate harm* (civil war killing more than the tyranny) are decisive. Aquinas consistently prioritizes avoiding greater evil and requires public authority for licit tyrannicide. The 20 years of moderate, stable rule likely mitigates the initial usurpation's force in Aquinas's framework – the ruler now functionally serves the common good, even if illegitimately gained. Private action causing greater harm remains forbidden.

  **Competing Rules Fitting the Earlier Verdicts:**

  The earlier cases suggest several overlapping factors. No single rule perfectly captures all nuances in uncontested scholarship, but these fit the data:

  1.  **The Public Authorization Rule (Strong Consensus Core):**
      *   **Rule:** Private individuals *never* have the authority to kill a ruler (tyrant or not). Only duly constituted *public authority* (e.g., Senate, representative body, inferior magistrates with jurisdiction) can licitly authorize or execute tyrannicide *if* other conditions (like proportionality) are met.
      *   **Fit:** Explains *all three* verdicts. Case 1 has authorization (Permitted). Cases 2 & 3 lack authorization (Not Permitted), regardless of legitimacy, severity, or proportionality. This is the *most consistent* factor across your cases and reflects Aquinas's core principle that private individuals lack the *auctoritas* to judge and depose a prince.

  2.  **The Legitimacy + Authorization Rule:**
      *   **Rule:** Killing a ruler is permissible *only if* the ruler is a *usurper* (lacking legitimate title) *AND* the act is authorized by public authority *AND* proportionality is met. Legitimate rulers, even tyrants, cannot be killed by private individuals or even public authority solely for tyranny *if* greater harm ensues.
      *   **Fit:** Explains Case 1 (Usurper + Auth + Prop = Permitted) vs. Cases 2 & 3 (Legitimate, so Auth lacking irrelevant for permission). Case 4 (Usurper but no Auth + Disprop) would be Not Permitted. This rule emphasizes the unique stain of usurpation *combined* with public action.

  3.  **The Proportionality + Authorization Rule:**
      *   **Rule:** Killing a ruler requires *both* authorization by public authority *AND* proportionality (the good achieved/evil prevented must outweigh the evil caused by the act itself, including likely consequences like civil war). Authorization is necessary but not sufficient; proportionality is a separate check.
      *   **Fit:** Explains Case 1 (Auth + Prop = Permitted). Cases 2 & 3 (No Auth = Not Permitted, *and* Disprop reinforces). Case 4 (No Auth + Disprop = Not Permitted). This highlights the two key hurdles.

  4.  **The Severity Threshold Rule (Weaker Fit):**
      *   **Rule:** Authorization is required, but for public authority to act licitly, the tyranny must be sufficiently *severe* (beyond heavy taxes/mild injustice) *AND* proportionality must be met.
      *   **Fit:** Explains Case 1 (Severe + Auth + Prop = Permitted). Case 2 (Severe but No Auth = Not Permitted). Case 3 (Mild + No Auth = Not Permitted). *However*, Case 3's verdict is based on lack of authorization and disproportionality in your summary, *not* primarily on mildness. Aquinas argues against killing mild tyrants mainly *because* it often leads to worse outcomes or violates due order, not necessarily because mildness alone absolutely forbids it *if* other conditions were met (which they aren't in your cases). This rule fits less perfectly.

  **How Case 4 Pulls Apart the Rules & The Key Test Case:**

  *   **Case 4's Challenge:** It pits the **Legitimacy + Authorization Rule** against the **Public Authorization Rule** and the **Proportionality + Authorization Rule**.
      *   *Legitimacy + Authorization Rule:* Focuses on the *usurper* aspect. Since he's a usurper, this rule might *prima facie* suggest permissibility is *more conceivable* than for a legitimate tyrant. However, the lack of authorization and disproportionality still block it (Not Permitted).
      *   *Public Authorization Rule & Proportionality + Authorization Rule:* Focus relentlessly on the *lack of authorization* and *disproportionality*. The usurper status is secondary or irrelevant to the core prohibitions on private action and disproportionate harm. Verdict: Clearly Not Permitted.
  *   **The Ambiguity:** Does the *long duration of moderate rule* rehabilitate the usurper in Aquinas's eyes regarding who has the *auctoritas* to judge him? The Legitimacy + Authorization rule might see the usurpation as still relevant. The Public Authorization rule cares *only* about who holds rightful authority *now* to act for the community. Case 4 doesn't definitively answer this.
  *   **The Test Case to Settle It (Legitimacy vs. Authorization Primacy):**
      *   **Case 5: A usurper seizes power by force and rules brutally (like Case 1). No public authority authorises killing him. Crucially, a carefully executed plot by private individuals would succeed *without* triggering civil war or significant unrest, saving far more lives than his continued rule. Is it permissible?**
          *   **Legitimacy + Authorization Rule:** Usurper (Check), Severity (Check), Proportionality (Check - net lives saved, no war) *BUT* No Authorization (Missing). Verdict: **NOT PERMISSIBLE**. Authorization is an absolute requirement alongside usurpation.
          *   **Public Authorization Rule / Proportionality + Authorization Rule:** Verdict: **NOT PERMISSIBLE**. The absolute bar on *private individuals* acting without public authority remains, regardless of legitimacy, severity, or proportionality.
          *   **Alternative (Contested) Rule C:** If one argues usurpers forfeit all protection *and* proportionality is met, private action *might* be argued permissible. **THIS IS NOT AQUINAS'S VIEW IN SCHOLARLY CONSENSUS.** His texts consistently forbid private judgment and action against rulers, focusing on the need for public authority. Case 5 highlights this core, uncontested principle against any rule suggesting usurpation alone licenses private action.

  **Scholarly Consensus vs. Contested Points:**

  *   **Strong Consensus:**
      1.  **Private individuals may never licitly kill a ruler (tyrant or legitimate).** This is absolutely clear in Aquinas (ST II-II, Q.64, A.3; De Regno). Case 2 & 3 verdicts are uncontested.
      2.  **Public authority is necessary to authorize tyrannicide.** Case 1 is understood this way. The "Senate" represents public authority.
      3.  **The Common Good is the supreme criterion.** Any action (including tyrannicide) must be judged by whether it truly serves the common good.
      4.  **Proportionality is a crucial consideration.** Causing greater evil (like a devastating civil war) renders tyrannicide illicit, even if authorized (implied by the focus on consequences in Cases 2 & 3).
  *   **Contested/Unclear Areas:**
      1.  **Does mere usurpation *automatically* make a ruler a "tyrant by practice" subject to licit removal *by public authority* regardless of actual governance?** Some scholars emphasize the inherent injustice of usurpation (De Regno). Others argue Aquinas focuses primarily on the *exercise* of tyranny harming the common good. Case 4 touches this ambiguity. Your Case 1 verdict (usurper killed) supports the first view, but Case 4's stability challenges its *automatic* application.
      2.  **How precisely does "public authority" for authorization relate to the original legitimacy structure?** Can an institution like the Senate authorize against a *legitimate* king turned tyrant (like Case 2/3), or only against usurpers? Aquinas isn't explicit. Your Cases 2 & 3 verdicts don't test this, as they lack authorization *and* have disproportionality. Case 1 shows authorization working against a usurper.
      3.  **The precise weight of duration and de facto stability (Case 4).** Does prolonged moderate rule by a usurper mitigate the initial injustice or change the calculus for public authority? Aquinas doesn't directly address this scenario. Scholarship is divided, leaning towards stability serving the common good being paramount.
      4.  **Is "tyranny" defined solely by acts against the common good, or also by lack of title?** Aquinas discusses both, but the relationship is debated. Your track record shows both factors matter.

  **Conclusion for the Seminar:**

  Focus your prediction exercise on the **necessity of public authorization** as the strongest, most consistent factor from the cases and Aquinas's texts. Case 4 highlights that even a usurper cannot be licitly killed by private individuals without authorization, especially when disproportionate harm would result. The key debate revealed by Case 4 is whether **usurpation alone is sufficient grounds for *public authority* to act, even if the rule is subsequently moderate** (a contested point). Use **Case 5 (Usurper, Brutal, No Auth, No Civil War, Net Lives Saved)** to force the question of whether *private action* could *ever* be permissible against a usurper (Aquinas says no, consensus agrees) and to underscore that authorization remains the non-negotiable hurdle even when usurpation and proportionality align. Emphasize the undisputed core: private individuals acting without public authority to kill a ruler is always illicit for Aquinas.
