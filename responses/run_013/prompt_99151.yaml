answer: |-
  Below is a carefully constructed case that meets all your specifications. I'll present the case, then systematically demonstrate how each of the four population ethics views (total utilitarianism, average utilitarianism, prior-existence view, and critical-level utilitarianism) evaluates it, showing how the disagreement arises directly from the numbers. I'll identify the key feature driving the split, explain what happens if it's altered, and address potential objections. The arithmetic is simple enough for a single slide.

  ### **The Case: "The Prosperous Island vs. The Vast Mainland"**
  - **Option A (Smaller Population, "Prosperous Island")**:  
    Population: 10 people.  
    Welfare per person: 10 units (high quality of life, e.g., healthy, fulfilling, secure).  
    Total welfare: 10 × 10 = **100 units**.  
    Average welfare: 100 ÷ 10 = **10 units**.

  - **Option B (Larger Population, "Vast Mainland")**:  
    Population: The same 10 people as in A, plus 100 additional people (mere addition).  
    Welfare of the original 10: Unchanged at 10 units each.  
    Welfare of the additional 100: 1 unit each (a life "barely worth living," e.g., minimal but positive well-being, sufficient for the individuals to be glad they exist).  
    Total welfare: (10 × 10) + (100 × 1) = 100 + 100 = **200 units**.  
    Average welfare: 200 ÷ 110 ≈ **1.818 units**.

  **Key features to note**:  
  - Mere addition is satisfied: The 10 in A are unaffected in B (no harm), and the added 100 have lives worth living (no one is wronged or harmed by their creation).  
  - No inequality/distributive issues: All individuals within each group have identical welfare. The added group is not treated unfairly—they simply have lower welfare due to context (e.g., scarce resources in a larger society), not injustice.  
  - Welfare units are ordinary and finite: 1 unit is above the "worth living" threshold (positive), but far below the original group's welfare.

  ---

  ### **Verdicts of the Four Views**
  **1. Total Utilitarianism (TU)**  
     - **Verdict**: B is strictly better than A.  
     - **Reason**: TU evaluates options based on the sum of welfare. B has total welfare of 200 units, A has 100 units. Since 200 > 100, B is better.  
     - **Why the numbers drive this**: The added 100 contribute +100 units of welfare. TU counts all positive welfare, so B wins.  

  **2. Average Utilitarianism (AU)**  
     - **Verdict**: A is strictly better than B.  
     - **Reason**: AU evaluates options based on average welfare per person. A has an average of 10 units, B has ≈1.818 units. Since 10 > 1.818, A is better.  
     - **Why the numbers drive this**: Adding 100 people with welfare (1) below A's average (10) drags the average down. AU prioritizes quality over quantity.  

  **3. Prior-Existence View (PEV)**  
     - **Verdict**: A and B are on a par (neither is worse than the other).  
     - **Reason**: PEV only considers individuals who exist in both options or would exist regardless of the choice. The original 10 have identical welfare (10 units) in both options. The added 100 in B do not exist in A, so their welfare is not counted as a "loss" in A (they aren't deprived of existence), nor as a "gain" in B (they wouldn’t exist otherwise).  
     - **Why the numbers drive this**: For the only comparable individuals (the original 10), welfare is unchanged. The added group's welfare (1) is positive, so B doesn't harm them, but PEV ignores their creation since they aren't prior-existing.  

  **4. Critical-Level Utilitarianism (CLU) Across Critical Levels**  
  CLU evaluates an option by summing (each person’s welfare - c), where c is a fixed "critical level" (a threshold where welfare contributes positively if > c).  
  - **CLU formula for A**: 10 × (10 - c)  
  - **CLU formula for B**: [10 × (10 - c)] + [100 × (1 - c)] = 100 - 10c + 100 - 100c = 200 - 110c  
  - **Comparison**: CLU(B) - CLU(A) = (200 - 110c) - (100 - 10c) = 100 - 100c  

  | Critical Level (c) | CLU(A)      | CLU(B)      | Verdict           | Why                                                                 |
  |--------------------|-------------|-------------|-------------------|---------------------------------------------------------------------|
  | c = 0 (TU limit)  | 10×(10-0)=100 | 200 - 0 = 200 | B strictly better | Matches TU: Added welfare (1 > 0) is pure gain.                   |
  | c < 1 (e.g., c=0.5)| 100 - 5c   | 200 - 110c  | B strictly better | Added group contributes positively (1 - c > 0).                   |
  | **c = 1**         | 100 - 10c  | 200 - 110c  | **Indifferent**   | Added group contributes zero (1 - 1 = 0). Flip point.             |
  | c > 1 (e.g., c=2) | 100 - 20c  | 200 - 220c  | A strictly better | Added group contributes negatively (1 - c < 0).                   |
  | c = 10 (AU-like) | 10×(0)=0    | 200 - 1100 = -900 | A strictly better | Matches AU's ranking (but not identical): Added group severely penalized. |

  - **Flip point**: CLU switches from favoring B to favoring A at **c = 1**. At this point, the added group's welfare (1) equals c, so their net contribution is zero.  
  - **Why the numbers drive this**: The flip occurs because the added welfare (1) is exactly at c. For c < 1, adding them is a net positive; for c > 1, it’s a net negative.  

  ---

  ### **The Single Feature Driving the Disagreement**
  - **Feature**: **The welfare level of the added group is positive but below the average welfare of the original group** (1 > 0, but 1 < 10).  
  - **Why it causes the split**:  
    - TU only cares that the added welfare is positive (+100), so it favors B.  
    - AU cares that the added welfare is below the original average (1 < 10), so adding them lowers the average, favoring A.  
    - PEV ignores the added group entirely (since they aren't prior-existing), so it sees no change for the comparable individuals, resulting in parity.  
    - CLU’s verdict hinges on whether c is above/below 1 (the added welfare level).  
  - **Not population size or other factors**: The split persists regardless of the exact numbers (e.g., 10 vs. 110 people) as long as the added welfare is positive but below the original average. If the added welfare were equal to or above the original average, TU and AU would agree; if it were negative, PEV would not treat options as on par.  

  **What if this feature is removed or reversed?**  
  - **Removed (added welfare = original average)**: Suppose the added 100 have welfare = 10 (same as original group).  
    - TU: B better (total 1100 > 100).  
    - AU: Indifferent (average = 10 in both).  
    - PEV: Still on par (original group unchanged).  
    - CLU: Favors B if c < 10, indifferent if c=10.  
    - **Result**: TU and AU no longer disagree strictly (AU is indifferent), and CLU only disagrees at high c.  
  - **Reversed (added welfare > original average)**: Suppose added 100 have welfare = 15.  
    - TU: B better (total 1600 > 100).  
    - AU: B better (average ≈14.6 > 10).  
    - PEV: On par.  
    - CLU: Favors B for all c < 15.  
    - **Result**: TU and AU agree (B better), eliminating the core disagreement.  

  ---

  ### **Anticipating Objections: Defending the "Worst-Looking" View**
  In this case, **average utilitarianism (AU)** may appear least defensible because it rejects creating 100 happy people (glad to exist) despite no one being harmed. A strong defender of AU would likely attack the **welfare assignment**:  
  - **Objection**: "Welfare 1 is not 'clearly worth living' in a meaningful human sense. It represents a life so minimal (e.g., constant struggle, no dignity) that calling it 'worth living' is misleading. If we recalibrate the scale to reflect real human well-being, welfare 1 might fall below zero."  
    - **Your response in seminar**:  
      1. **Stipulate the scale**: Clarify that 0 is the threshold where life is worth living (e.g., neutral between existence and nonexistence), and 1 is unambiguously above it (e.g., a life with net positive experiences, like many people in poverty who value their existence).  
      2. **Highlight mere addition**: Emphasize that the added group experiences no harm or injustice—they simply have lower welfare due to benign constraints (e.g., resource scarcity in a larger population).  
      3. **Reframe intuitively**: "AU insists that a world where everyone thrives (A) is better than a world with many more people who merely survive (B), even if total welfare is higher. This preserves a 'quality over quantity' ethic that resonates with non-sacrificial intuitions."  
      4. **Concede a nuance**: If pressed, note that AU could be modified (e.g., "variable value" views) to avoid this implication, but the core view stands as a coherent alternative.  

  **Why this objection fails to derail the case**: The objection questions the welfare scale, but your specification requires "ordinary human welfare levels" and "lives clearly worth living." Welfare 1 can be grounded in real-world examples (e.g., a subsistence farmer with strong community ties and moments of joy). AU's verdict is a feature of the theory, not a flaw in the case—making it ideal for showcasing theoretical divergence.  

