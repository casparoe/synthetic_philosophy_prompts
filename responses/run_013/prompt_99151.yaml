  The single feature doing the work: The welfare level of the added group (1) is above zero (so they are glad to exist) but below the average of the original population (10). This causes TU and AU to split because TU only cares about the sum (which increases) and AU cares about the average (which decreases). And it causes CLU to split depending on whether the critical level is above or below 1.

