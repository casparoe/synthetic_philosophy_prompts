  1. Arguing that the welfare levels are not comparable: that the welfare of the original group and the added group are not on the same scale. But we can stipulate that they are.

  2. Questioning whether the added people are really not harmed: but we have set their welfare positive.

  3. Arguing that the average view does not necessarily apply to the creation of new people. They might say that the average view is meant for fixed populations. But this is a standard application.

  4. They might bite the bullet and say that they would indeed choose the smaller population to avoid diluting the average, and that this is the correct moral choice.

  But to provide a more sophisticated defense, they might say that the average view is concerned with the quality of life per person, and that creating a large number of people with very low quality of life (even if positive) is not desirable because it leads to a world that is, on average, worse off. They might also worry about the long-term consequences: if we keep adding people at low welfare, we might exhaust resources and bring down the welfare of the original population. But in our case, we have fixed that the original population's welfare does not change.

  So, in the seminar, be prepared to defend that the original population's welfare is unchanged and that the added group does not affect them. The scenario is one of mere addition without any negative externalities.

  Now, for the final case, I will use:

  Option A: 10 people, each at welfare 10.
  Option B: The same 10 people at welfare 10, plus 100 people at welfare 1.

  Total welfare: A=100, B=200.
  Average welfare: A=10, B≈1.818.

  We present the four views:

  1. Total Utilitarianism: B is better because 200 > 100.

  2. Average Utilitarianism: A is better because 10 > 1.818.

  3. Prior-Existence View: The two options are on a par. Why? The only people who exist in both and are affected are the original 10, and they have the same welfare in both. The added 100 are not made worse off by not existing in A (since they don't exist there) and in B they have a positive welfare. So there is no reason to prefer A over B or vice versa. Note: PEV does not say that creating happy people is a reason to prefer B, because it only considers the interests of those who already exist or will exist regardless. Since the added people would not exist in A, we don't count their loss in A (because they don't exist to lose anything) and in B we don't count their gain (because they wouldn't have existed otherwise). So it's a wash.

