  ### **Summary Slide for Seminar**
  **Option A: Prosperous Island**  
  - 10 people, welfare = 10 each  
  - Total welfare = 100, Average = 10  

  **Option B: Vast Mainland**  
  - 10 original people, welfare = 10 each  
  - +100 added people, welfare = 1 each (glad to exist)  
  - Total welfare = 200, Average ≈ 1.818  

  **Verdicts**:  
  - **TU**: B better (200 > 100).  
  - **AU**: A better (10 > 1.818).  
  - **PEV**: On par (no change for original 10; added group not counted).  
  - **CLU**: B better if c < 1; A better if c > 1.  

  **Key Driver**: Added welfare (1) is >0 but < original average (10).  
  **Without This**: TU and AU agree if added welfare ≥ original average.  

  This case cleanly isolates the mere addition paradox without smuggling in distributive issues or harm, fulfilling all your requirements. Use the CLU progression to show how theories can "morph" between extremes, and invite students to debate AU's counterintuitive result—it’s the perfect springboard for discussion.
