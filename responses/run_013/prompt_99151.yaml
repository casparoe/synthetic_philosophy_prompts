  So when c<5, B is better; c=5, indifferent; c>5, A is better.

  This case might be more palatable because the added group has welfare 5, which is halfway up the scale. We can describe it as a modest but decent life.

  But note: the original specification asked for the extra lives to be "barely worth living", so welfare 1 might be intended. However, the problem says "clearly worth living", so we can choose a welfare level that is clearly above zero but below the average of A.

  Let me stick with the first example for simplicity and because it shows a stark contrast. But for the seminar, the second might be less controversial on the added group's welfare.

  However, the problem says: "a much larger world of lives that are each barely worth living". So we should have the added group with welfare just above zero. But to avoid the objection that welfare 1 is too low, we can use a scale that is calibrated appropriately.

  We can define the welfare scale so that 0 is the threshold of a life worth living. Then welfare 1 is just above. And we can imagine that the original population has very high welfare (10). This might be achieved by having the original population be very well-off and the added population having a minimal but positive welfare.

  But to make it more realistic, we can think of the original population as having a high quality of life (say, the level of a prosperous middle-class person in a developed country) and the added population having a life that is very basic (minimal food, shelter, and some simple joys) but still worth living.

  Now, the objection from the total utilitarian side against the average view: They might say that the average view is anti-egalitarian and that it ignores the welfare of the added people who are happy to be alive. They might argue that if we can create more happy people without harming anyone, we should.

