  3. Average Utilitarianism (AU): A is strictly better than B.

  4. Prior-Existence View (PEV): The two options are on a par (i.e., B is not worse than A).

  Additionally, we require:
  - Finite populations.
  - Ordinary human welfare levels.
  - Simple arithmetic.

  We also want to show how a critical-level utilitarianism (CLU) varies with the critical level and flips at a specific point.

  Key insight: The critical feature that causes the split is the welfare level of the added group in B. Specifically, the added group must have positive welfare (so they are glad to exist) but below the average welfare of A. This will cause:
  - TU to favor B because total welfare increases (adding positive amounts).
  - AU to favor A because the average in B will be lower than in A (since we are adding people with welfare below the original average).
  - PEV to be indifferent because the added people do not exist in A, so we only consider the welfare of the people who exist in A. Since their welfare is the same in B, and the added people are not worse off (they are added with positive welfare) but we don't count them as being made better off (because they wouldn't exist otherwise), PEV sees no reason to prefer one over the other.

  Let's construct the numbers:

  Option A: A small population with high average welfare.
  Option B: The same people as in A (with the same welfare) plus an additional group with positive welfare but lower than the average in A.

  Example:

  Option A: 10 people, each with welfare 10.
  Total welfare in A: 10 * 10 = 100
  Average welfare in A: 100 / 10 = 10

  Option B: The same 10 people with welfare 10, plus 100 additional people, each with welfare 1.
  Total welfare in B: 10*10 + 100*1 = 100 + 100 = 200
  Average welfare in B: 200 / 110 ≈ 1.818

  Now check the conditions:

  1. Mere Addition: The original 10 are unchanged. The added 100 have welfare 1 (positive, so they are glad to exist). So, satisfied.

  2. TU: Total welfare of B (200) > total welfare of A (100) → B is better.

  3. AU: Average of A (10) > average of B (≈1.818) → A is better.

  4. Prior-Existence View: The prior-existing people (the 10) have the same welfare in both. The added people do not exist in A, so they are not worse off by not existing (and in fact, in B they have a life worth living). So, according to PEV, B is not worse than A. Also, since the added people are not in A, we don't say that A is worse for them (because they don't exist). Hence, they are on a par.

  Now, critical-level utilitarianism (CLU): 
  CLU evaluates an outcome by summing, for each person in that outcome, (w_i - c) where c is a fixed critical level.

  We require c to be at least 0 (as is typical). We will consider c in the range [0, 10] (since our welfare levels are 10 and 1).

