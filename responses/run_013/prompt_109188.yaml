answer: |-
  ## Joint Statement of Adversarial Collaboration: Epistemicism vs. Supervaluationism on Vagueness

  **Preface:** We, an epistemicist (E) and a supervaluationist (S), have engaged in sustained dialogue to clarify our positions, identify points of genuine disagreement, and establish common ground. This document reflects our shared understanding of the phenomena of vagueness and our divergent explanations. We present agreed-upon data, formulations of our respective views, key cruxes, and potential resolutions. Our goal is not consensus on the nature of vagueness, but clarity on where we agree, why we disagree, and what could resolve our dispute.

  ### 1. Agreed Claims

  We jointly affirm the following claims concerning vagueness and related phenomena:

  1.  **The Sorites Paradox:** The Sorites Paradox presents a genuine and challenging problem for logic, semantics, and epistemology. It highlights the apparent conflict between the tolerance of vague predicates to small changes and the seemingly obvious difference between clear cases at the extremes of a sorites series.
  2.  **Existence of Borderline Cases:** For typical vague predicates (like "tall," "heap," "bald," "red"), there exist borderline cases. These are cases where competent speakers, under ideal conditions and with full relevant information, are disposed to hesitate or disagree in their judgments about whether the predicate applies. Neither clear application nor clear non-application is mandated by linguistic conventions alone.
  3.  **Higher-Order Vagueness:** The phenomenon of higher-order vagueness is real: there is no sharp boundary between clear cases and borderline cases, nor between borderline cases of different orders. The transition is itself vague. Both theories must account for this phenomenon, though they do so differently.
  4.  **The "Definitely" Operator:** Natural language possesses a "definitely" operator (or equivalent expressions like "clearly," "determinately"). This operator plays a crucial role in regimenting discourse about vagueness and borderline cases. Its behavior needs systematic explanation.
  5.  **Penumbral Connections:** Vague predicates exhibit penumbral connections. These are necessary relationships between the application conditions of different vague predicates (e.g., something cannot be definitely red and definitely orange all over at the same time; if something is definitely a heap, removing one grain cannot make it definitely not a heap). Any adequate theory must explain and preserve these connections.
  6.  **Legal Vagueness:** Vagueness is pervasive and often intentional in legal language. It allows for flexibility in application to unforeseen circumstances. This vagueness poses challenges for legal adjudication, particularly in borderline cases, regardless of the underlying semantic theory. Courts must make decisions even when the application of a vague term is indeterminate.
  7.  **Agreement on Specific Cases:**
      *   **(a) Rideshare Ordinance:** The rideshare driver's car at the airport curb is a borderline case of "taxicab" under the ordinance. Competent judges applying the ordinance (e.g., traffic officers, judges) may reasonably disagree about whether the ordinance forbids the driver's action. The ordinance itself, as written, does not determinately mandate one specific outcome.
      *   **(b) 3D-Printed House:** The 3D-printed structure sharing a wall is a borderline case of "single-family home" for the property tax exemption. Competent assessors or judges could reasonably disagree about whether the exemption applies. The statutory language does not determinately settle the application to this novel structure.
      *   **(c) Sorites Heap:** A sorites series for "heap" exists. Starting from a clear heap, the sequential removal of single grains will eventually result in a clear non-heap. Within this series, there is a region containing borderline cases of "heap." There is no point in the series where competent speakers universally agree that the removal of a single grain transforms a clear heap into a clear non-heap or vice-versa.
  8.  **The Penumbral Lattice Model (PLM):** We agree that the PLM provides a *useful formal framework* for modeling many aspects of vagueness, particularly penumbral connections and the logic of the "definitely" operator.
      *   **Shared Acceptance:** Both E and S accept the PLM as a *model*. They agree that within the model:
          *   A vague predicate's extension is represented by a lattice (set) of admissible precisifications (complete, consistent, classical assignments of truth values respecting penumbral connections and clear cases).
          *   A sentence is **supertrue** iff true on all admissible precisifications.
          *   A sentence is **superfalse** iff false on all admissible precisifications.
          *   A sentence is **indeterminate** iff true on some precisifications and false on others.
          *   The "definitely" operator (D) can be modeled as a necessity operator over the lattice: DP is true iff P is supertrue (true on all precisifications).
      *   **E's Stance:** E accepts the PLM as a valuable *epistemic* or *representational* tool. It models the space of permissible ways concepts *could* be precisified given our ignorance of the single, sharp boundary. However, for E, only one precisification corresponds to the actual, precise (but unknown) semantic facts. Supertruth in the model corresponds to being true relative to the actual sharp boundary (which is unknowable). Indeterminacy in the model represents our *ignorance* of the sharp truth value.
      *   **S's Stance:** S accepts the PLM as capturing the *semantic reality* of vagueness. There is no single "actual" precisification; meaning is constituted by the set of admissible precisifications. Supertruth *is* truth simpliciter. Indeterminacy represents a genuine *lack* of truth value (a truth-value gap) at the level of the vague language itself. The model reflects the underlying metaphysics of semantic indecision.

  ### 2. Disagreements Table

  | Issue                                      | Epistemicist's Formulation                                                                                           | Supervaluationist's Formulation                                                                                             | Crux                                                                                                                                              |
  | :----------------------------------------- | :------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **(i) Sharp Boundary in Reality?**         | Every vague predicate has a precise extension and anti-extension in reality; there is a sharp cutoff point, though it is in principle unknowable. | Vague predicates inherently lack sharp boundaries in reality; their extensions are inherently unsettled for borderline regions. | Does meaning/convention fix a single, sharp boundary (even if unknowable), or is the boundary inherently fuzzy at the level of semantic facts? |
  | **(ii) Status of Borderline Cases**        | Every borderline proposition has a unique, classical truth value (true or false) fixed by the precise boundary, but this truth value is unknowable. | Borderline propositions lack a classical truth value; they are neither true nor false (they are indeterminate/gappy).        | Is the fundamental phenomenon ignorance of a precise fact, or the absence of a precise fact?                                                   |
  | **(iii) Higher-Order Vagueness Problem?**  | HOV is an epistemic phenomenon: it reflects ignorance of the location of the first-order boundary. Our ignorance fades gradually. | HOV is a semantic phenomenon requiring higher-order indeterminacy (gaps in the application of "definitely"). Iterating the PLM provides the structure. | Is HOV explained by the *unknowability* of boundaries or by *higher-level gaps* in meaning?                                                   |
  | **(iv) Logic of "Definitely" (D)**         | D is factive (DP → P). D obeys S4 (DP → DDP) but not necessarily S5 (¬DP → D¬DP fails due to ignorance). DDP entails DP, but not vice-versa. | D is factive (DP → P). D obeys S4 (DP → DDP) and S5 (¬DP → D¬DP). DDP and DP are equivalent.                                | Does D quantify over a single unknown boundary (making higher-order definiteness contingent) or over a set of precisifications (making it stable)? |
  | **(v) Status of PLM**                      | PLM is a useful epistemic model of our ignorance and permissible precisifications, but does not reflect semantic reality (only one precisification is actual). | PLM accurately models the semantic reality: the set of admissible precisifications *is* the semantic content of the vague predicate. | Is the PLM a model of ignorance or a model of meaning?                                                                                         |
  | **(vi) Partly Verbal Dispute?**            | The dispute is substantive, concerning the nature of meaning, truth, and reality. "Truth" is univocal (classical bivalence holds). | The dispute may have verbal aspects, particularly concerning what counts as "meaning" or "truth" for vague language. "Truth" for vague sentences might be supertruth. | Are we disagreeing about facts or about how to use terms like 'meaning', 'truth', and 'boundary' in the context of vagueness?                  |

  ### 3. Cruxes: Predictions and Potential Resolvers

  For each key crux identified above, we outline shared test cases, each side's prediction, what each side would count as counter-evidence, and whether agreed-upon evidence could move the debate.

  1.  **Crux: Existence of a Sharp Boundary (i)**
      *   **Shared Test:** The **Sorites Series** itself. Examine whether competent linguistic practice *presupposes* the existence of a sharp boundary or inherently resists it.
      *   **E Prediction:** Linguistic competence *requires* there to be a sharp boundary, even if speakers cannot identify it. Competent speakers implicitly accept bivalence for all propositions involving vague predicates. Our inability to find the boundary is epistemic, not semantic.
      *   **S Prediction:** Competent linguistic practice shows no commitment to a sharp boundary. Speakers naturally accept truth-value gaps for borderline cases and reject the idea that there *must* be a specific grain where heaphood is lost. Resistance to identifying a cutoff is semantic, not epistemic.
      *   **E's Vulnerability:** Evidence that competent speakers systematically and consistently *deny* that there is a fact of the matter about borderline cases, even under ideal reflection, would challenge E. Evidence that meaning/conventions simply *fail* to determine a unique cutoff.
      *   **S's Vulnerability:** Evidence that competent speakers are deeply committed to bivalence for vague propositions, or evidence that legal/scientific practice *requires* or definitively establishes sharp boundaries based solely on linguistic meaning/convention.
      *   **Resolvability?** Difficult. Evidence from linguistic intuitions is contested. Agreement unlikely unless overwhelming evidence of presupposed bivalence or its absence emerges.

  2.  **Crux: Status of Borderline Cases / Truth Value (ii)**
      *   **Shared Test:** **Rideshare Ordinance Case.** Observe how courts/judges reason about the borderline rideshare driver. Do they seek to *discover* a pre-existing truth or *stipulate* an outcome?
      *   **E Prediction:** Courts, ideally, are attempting to *discover* the correct application of the ordinance, which has a determinate truth value (permitted or forbidden) relative to the car's properties and the precise meaning of "taxicab," even if discovery is practically impossible. They may be forced to stipulate due to epistemic limitations.
      *   **S Prediction:** Courts *create* a sharp line through adjudication because the ordinance itself leaves the case indeterminate. The court's decision *makes* it true or false for legal purposes, resolving the semantic indecision inherent in the vague term "taxicab."
      *   **E's Vulnerability:** Clear instances where courts explicitly state they are not discovering but *creating* law in borderline cases due to the vagueness itself, not just epistemic uncertainty. Widespread acceptance of "no right answer" by legal experts in borderline cases.
      *   **S's Vulnerability:** Evidence that courts consistently frame their task as fact-finding about the application of pre-existing law even in borderline cases, suggesting an underlying determinacy. Successful appeals overturning borderline rulings based on misinterpretation of facts/law.
      *   **Resolvability?** Legal practice offers potential evidence. If courts consistently adopt an S-like rationale in borderline vagueness cases, it favors S. Consistent E-like rationale favors E. Mixed practice maintains disagreement.

  3.  **Crux: Higher-Order Vagueness & "Definitely" (iii, iv)**
      *   **Shared Test 1:** Iterate the "definitely" operator on borderline cases (e.g., "Is this definitely a borderline case of heap?"). **Shared Test 2:** **Penumbral Lattice Meta-Language Question:** Is the set of admissible precisifications itself vague? Can we identify borderline cases of *admissible precisification*?
      *   **E Prediction:** HOV arises because we cannot know where the boundary for "definitely P" lies relative to the boundary for P. There is a sharp boundary for each higher-order predicate, but we are ignorant of it. The set of admissible precisifications is sharp; indeterminacy only appears within the object language modeled by the lattice. DDP does not generally entail DP (one might know P is true without knowing one knows it).
      *   **S Prediction:** HOV requires higher-order indeterminacy. The set of admissible precisifications is itself vague; there are borderline admissible precisifications. This requires modeling D using a hierarchy of lattices or a fuzzy set of precisifications. DDP entails and is entailed by DP (if P is definitely definite, it's definite; if definite, it's definitely definite). The meta-language question reveals genuine higher-order semantic indecision.
      *   **E's Vulnerability:** Evidence that competent speakers systematically treat higher-order borderline cases as involving genuine indeterminacy, not just ignorance. Evidence that the concept "admissible precisification" exhibits clear borderline cases.
      *   **S's Vulnerability:** A workable, non-paradoxical formal semantics capturing higher-order indeterminacy without collapsing into precision or incoherence. Evidence that speakers treat higher-order definiteness as stable (S4, S5 hold) even in clearly borderline areas.
      *   **Resolvability?** Progress on formal models for higher-order vagueness within S could be compelling. Evidence of speaker intuitions supporting stable higher-order definiteness (favoring S) or instability (favoring E) might shift views.

  4.  **Crux: Nature of PLM & Underlying Reality (v)**
      *   **Shared Test:** **3D-Printed House Case.** Does architectural/planning convention or expert judgment reveal a pre-existing sharp boundary for "single-family home," or does it reveal the scope for precisification?
      *   **E Prediction:** Architectural conventions and expert judgments are attempts to *track* the precise, objective property (or cluster of properties) denoted by "single-family home," which has a sharp boundary. Experts might have better epistemic access. The PLM models permissible *beliefs*, not meaning.
      *   **S Prediction:** Architectural conventions and expert judgments help define or *constitute* the evolving set of admissible precisifications for "single-family home." They resolve semantic indecision within a context. The PLM directly models the meaning-constitutive conventions.
      *   **E's Vulnerability:** Evidence that expert judgments conflict even under ideal conditions, not due to lack of information but due to legitimate differences in how to precisify the concept, suggesting no single fact to track.
      *   **S's Vulnerability:** Evidence that experts converge decisively on a unique classification for novel cases based solely on established meaning/convention, suggesting underlying determinacy. Evidence that the PLM fails to capture crucial aspects of how meaning guides application.
      *   **Resolvability?** Analysis of how conventions and expertise function in defining categories might provide evidence. Convergence favors E; persistent legitimate divergence under ideal conditions favors S.

  ### 4. Verbal Disputes and Semantic Indecision

  *   **Partly Verbal Dispute:** We agree that *aspects* of our dispute may be verbal, particularly concerning the terms **"meaning," "truth,"** and **"boundary."**
      *   E typically uses "meaning" to denote the conditions that fix a single, sharp extension (even if unknowable) and "truth" as classical bivalence relative to that extension. "Boundary" refers to that precise cutoff.
      *   S typically uses "meaning" to denote the constraints determining the set of admissible precisifications and "truth" as supertruth. "Boundary" refers to the inherently fuzzy transition zone modeled by the lack of universal agreement across precisifications.
      *   **Why:** Much disagreement stems from differing conceptual frameworks for describing the same phenomena (borderline cases, sorites, penumbral connections). E prioritizes classical logic/metaphysics and explains phenomena via epistemic limitations. S prioritizes preserving the intuitive absence of sharp boundaries and explains phenomena via semantic indeterminacy. Translating claims between frameworks can be difficult and lead to apparent conflict where there might be underlying agreement on the data.
  *   **Semantic Indecision:** The idea that vague predicates are underdetermined by our conventions (semantic indecision) is **not a distinct third position**, but rather the **core semantic thesis of supervaluationism (S)**. S posits that semantic indecision is the fundamental nature of vagueness, resolved only by precisification. E explicitly *rejects* semantic indecision at the level of meaning/convention, insisting that conventions *do* determine a sharp boundary, albeit one we cannot know. Therefore, semantic indecision is fundamentally incompatible with epistemicism and is constitutive of the supervaluationist position. Its inclusion does not alter the joint statement; it is the essence of S as presented here. The disagreement remains: *Does semantic indecision characterize the nature of vague meaning (S), or is the indecision merely epistemic, masking a precise semantic fact (E)?*

  **Conclusion:** While significant disagreement persists on the fundamental nature of vagueness (sharp boundaries + ignorance vs. semantic indecision + truth gaps), we have achieved substantial agreement on the core phenomena, the utility of the PLM as a formal tool, and the specific challenges posed by our test cases. We have also clarified the precise points of contention and identified potential empirical and theoretical cruxes that could, in principle, advance the debate. We remain adversaries in our core commitments but collaborators in the pursuit of clarity regarding this persistent philosophical puzzle.
