prompt: |-
  I write about science and ideas for a general readership, and there is a pattern I keep meeting in my reporting for which I have no proper term. I should like the term if one exists, but what I really want is the analysis, because I have to explain the thing in print and cannot do it with hand-waving.

  Here is the sort of case I mean. A biologist tells me that the larva of a certain beetle gives off a scent that dupes a particular species of ant into carrying it into the nest, and calls this the larva's way of getting itself fed and protected; the larva, needless to say, understands none of it. Or someone explains that a gazelle stots — springs vertically rather than running — in order to advertise to the pursuing cheetah that it is fit and not worth chasing; the gazelle is not trying to say anything to anybody. Or a botanist observes that the arrangement of an orchid's petals ensures that the single moth which pollinates it cannot avoid picking up a packet of pollen on the way in.

  In each of these the purpose-language is not decoration. Strike out the 'in order to' and something is lost from the explanation: you can no longer account for why the trait is there, or why it has the shape it has. And yet there is evidently no one, anywhere, doing the intending — no mind holding the reason. The rationale appears to be real, and to be doing explanatory work, without belonging to anyone. I have a suspicion that this is a recognised problem in the philosophy of biology and that it has a name, but I have never been able to recover it.

  What I need, then, is the concept, and its edges. If there is an established term, give it to me with a definition; if there is none, coin one and define it. Either way I want to know precisely what the phenomenon is and what it is not, and in particular how it is to be distinguished from each of the following:

  - the merely metaphorical use of purpose-language, where saying that the sun 'wants' to set explains nothing;
  - the ascription of a function to a part or a process, as when we say that the heart's job is to pump blood;
  - the invisible-hand sort of explanation familiar from economics, where an outcome is nobody's intention but every party to it is nonetheless an agent with reasons of their own;
  - and the reasons we might attribute to a thermostat or a chess program, where there was a designer who had the reason first.

  Does the concept require natural selection, or does it extend to artefacts? Is the rationale supposed to be a genuine fact about the world, or a useful fiction we tell ourselves? Where does a trait that once did something and no longer does — a vestige — fall? And what would be a case right at the boundary, so that I can tell in my own writing when I am using the idea legitimately and when I am smuggling in a purpose that is not there?

  I do not need a reading list. Please answer in British English.
reasoning: |-
  Okay, the user writes about science and ideas for a general audience. They've encountered a recurring pattern in their reporting where purpose-language (like "in order to" or "so that") seems essential for explaining biological traits, but there's no conscious intent behind these actions. They need a precise term and analysis for this phenomenon to avoid hand-waving in their writing.

  The examples they give—beetle larvae tricking ants, gazelles stotting to deter cheetahs, orchids ensuring pollination—all show functional explanations where the purpose isn't held by any mind. The user suspects this is a recognized concept in philosophy of biology but can't recall the term. 

  Hmm, the core issue is teleology without a teleologist. The user wants to distinguish this from:  
  - Mere metaphor (like "sun wants to set")  
  - Standard functional ascription (e.g., heart pumping blood)  
  - Invisible-hand explanations (where agents have individual intentions)  
  - Designed artifacts (like thermostats with human designers)  

  They also ask deeper questions:  
  - Whether natural selection is required  
  - If this extends to artifacts  
  - Whether the rationale is real or a useful fiction  
  - How vestiges fit in  
  - Where the boundaries lie  

  Right, the established term here is "teleonomic explanation." Coined by biologist Colin Pittendrigh in 1958, it describes goal-directed *appearance* in biological systems arising from natural selection. The "purpose" is an evolved function, not an intention. This contrasts with:  
  - **Metaphorical purpose**: No explanatory power (sun example)  
  - **General function**: Broader category; teleonomy is a subtype tied to adaptation  
  - **Invisible hand**: Involves compounding *actual* intentions (e.g., market outcomes)  
  - **Artifact design**: Purpose originates in a designer's mind  

  Natural selection *is* essential—it's what makes teleonomy non-arbitrary. Vestiges aren't teleonomic because they've lost their adaptive function. Artifacts borrow teleonomy secondhand from designers.  

  Boundary case: A trait that *seems* functional but isn't adaptive (e.g., neutral spandrels). Here teleonomic language would be illegitimate.  

  The rationale is real in an evolutionary sense—a fact about historical fitness—not just a fiction.  

  For their writing, the user should use teleonomic language only when:  
  1. Natural selection is the mechanism  
  2. The trait demonstrably enhances fitness  
  3. No conscious agent is involved at any level  

  This should give them the precision they need.
answer: |-
  You're grappling with **teleonomic explanation** — the established term in philosophy of biology for this precise phenomenon. Coined by Colin Pittendrigh (1958) and refined by Ernst Mayr and others, it describes **apparently purposive biological traits explained by natural selection, where the 'purpose' is real but resides in evolutionary history, not in any mind**.

  ### Core Definition:
  **Teleonomy** (noun) /ˌtɛlɪˈɒnəmi/  
  *The property of apparent goal-directedness in biological structures or behaviours, arising solely from natural selection. The trait exists because it conferred a survival/reproductive advantage in ancestral populations, making its current form functionally explicable via "in order to" language, despite no conscious intention.*

  ### Key Distinctions:
  | **Concept**              | **How Teleonomy Differs**                                                                 | **Example**                                                                 |
  |--------------------------|-------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | **Metaphorical purpose** | Teleonomy is *explanatory*: Remove "in order to" and the trait's existence becomes unexplained. | *Metaphor:* "Rivers *seek* the sea." (No mechanism; decorative).            |
  | **Function ascription**  | Teleonomy is a *subset* of functions: Specifically, functions shaped by selection for adaptation. | *Broader function:* "The heart pumps blood." (May not imply adaptation).    |
  | **Invisible-hand**       | Involves compounding *actual intentions* of agents. Teleonomy has *no agents with intentions*. | *Invisible hand:* Market prices emerge from buyers/sellers *each intending* profit. |
  | **Artifact design**      | Purpose originates in a designer's mind. Teleonomy’s "purpose" is designer-free.             | *Thermostat:* "Switches off *to* prevent overheating" (reason from engineer). |

  ### Addressing Your Specific Queries:
  1. **Requires natural selection?**  
     Yes. Teleonomy is **inseparable from Darwinian selection**. It explains *why* a trait persists by referencing historical fitness advantages. Without selection, it’s not teleonomy.

  2. **Extends to artefacts?**  
     No. Artefacts (e.g., a mousetrap) have **derived teleonomy**: Their "purpose" is borrowed from a designer. Biological teleonomy emerges without a designer.

  3. **Genuine fact or useful fiction?**  
     **Genuine fact**, but about *evolutionary history*, not current intent. The orchid’s petals *factually* evolved to ensure pollination; this rationale is empirically testable via fitness costs/benefits.

  4. **Vestigial traits?**  
     Vestiges (e.g., human appendix) **are not teleonomic**. They once had a function but no longer confer fitness advantages. Calling them "for digestion" is inaccurate; they are evolutionary remnants.

  5. **Boundary Case for Legitimacy:**  
     Use teleonomic language **only when**:  
     - Natural selection is the demonstrated mechanism.  
     - The trait enhances fitness *because of* its functional role.  
     - No conscious agent (individual or evolutionary "designer") is implicated.  
     
     **► Boundary Example:** *Peacock’s tail.*  
     Legitimate teleonomy: "The tail evolved *to attract mates*" (selection for sexual preference demonstrated).  
     Illegitimate: "The tail is *for aesthetic display*" if divorced from selection (smuggling subjective purpose).

  ### Why This Fits Your Cases:
  - Beetle larva scent: "Dupes ants *in order to* get fed" = Teleonomy (selected for deceptive function).  
  - Gazelle stotting: "Advertises fitness *to deter* pursuit" = Teleonomy (selected signalling behaviour).  
  - Orchid petals: "Ensure pollen transfer *so that* reproduction occurs" = Teleonomy (selected mechanical adaptation).

  ### How to Apply This in Writing:
  - **Use teleonomic language boldly** but anchor it to evolution:  
    *"The gazelle stots—not consciously, but because this behaviour evolved as a signal to deter predators."*  
  - **Avoid** phrases implying agency (e.g., "the orchid *wants* pollination").  
  - **Flag vestiges explicitly**: *"The human coccyx is a vestige of ancestral tails, no longer serving its original function."*

  Teleonomy resolves your paradox: It grants "purpose" scientific legitimacy while banishing ghosts from the machine. The rationale is real, but it belongs to the algorithm of selection, not a mind.
