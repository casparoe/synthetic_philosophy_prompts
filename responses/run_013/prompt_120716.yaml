answer: |-
  ### The Case
  Consider the City-State of Veridia, a prosperous medieval commune with established laws, councils of guilds and nobles, and a hereditary Count as its traditional ruler. The current ruler, whether legitimate or usurper, imposes crippling taxes, executes critics without trial, seizes property arbitrarily, and uses public funds for lavish personal feasts while the populace starves. His cruelty is identical in both scenarios. A respected guildmaster, motivated solely by ending this oppression and restoring the common good, plots to assassinate the ruler. The likelihood of success is high (80%), and the expected consequences are identical: a brief, localized power struggle among minor nobles/guilds (likely causing 100 deaths) before a new, likely less tyrannical regime emerges. The *only* difference is the ruler's origin: In Scenario A, the ruler is the rightful hereditary Count who initially ruled justly but became a tyrant over time. In Scenario B, he is a former mercenary captain who murdered the rightful Count and seized power five years ago, never holding legitimate title. Later, we alter Scenario A: the Count’s tyranny remains the same, but now we stipulate that the City Council (an established body with traditional legal authority to advise and, in extreme cases like mental incapacity, potentially depose the Count) remains functionally intact and capable of acting, though currently intimidated. The guildmaster ignores this council and proceeds with the assassination. The harm from disturbance (100 deaths) remains constant.

  ### Verdicts, Scenario by Scenario

  *   **Scenario A (Legitimate Count turned Tyrant):** Verdict = **Forbidden.** Aquinas's principle: Because the Count held power *rightfully* (hereditary title), he possesses legitimate authority *in principle*, even if he abuses it gravely. Killing him is not merely killing a tyrant, but killing a *legitimate ruler*. This constitutes sedition and undermines the divinely ordained order of just authority. The guildmaster, a private individual, lacks the authority to judge and execute punishment on a legitimate sovereign, regardless of the sovereign's wickedness. Only a public authority acting for the common good (like the City Council, if it has such power) could licitly depose him. The guildmaster usurps this public judicial function, making his act intrinsically disordered.
  *   **Scenario B (Usurper):** Verdict = **Permitted.** Aquinas's principle: The mercenary captain *never* possessed legitimate authority; his power was founded solely on violence and injustice from the outset. He is not a ruler at all in the true (lawful) sense, but merely a powerful criminal oppressing the community. Killing him is not the execution of a sovereign, but the removal of a public enemy and liberator of the oppressed community. Since he has no rightful claim to authority, there is no legitimate office to undermine by killing him. The guildmaster acts as a private citizen defending the common good against an unjust aggressor who holds power illegitimately. The act aligns with restoring lawful order.
  *   **Altered Scenario A (Legitimate Tyrant, Council Exists & Capable):** Verdict = **Forbidden, and now potentially *more* gravely so.** Aquinas's principle: The existence of the functional City Council, a constituted public authority with potential (traditional/legal) power to address tyranny (e.g., through deposition), becomes crucial. The guildmaster's assassination bypasses this legitimate public authority. Aquinas insists that disturbance must not cause greater harm than the tyranny *and* must proceed through proper channels if they exist. By ignoring the Council – the very body potentially authorized to judge and remove the tyrannical Count lawfully – the guildmaster compounds the disorder. He acts as a private individual usurping the judicial function not only of the Count but now also of the Council itself. This significantly increases the harm to the social order (undermining lawful institutions) relative to the tyranny. Even though the physical harm (100 deaths) is unchanged, the *institutional* harm and precedent of private vigilantism against legitimate authority (even abused) are greater disturbances to the common good than enduring the tyranny while lawful remedies are pursued or attempted.

  ### What Does the Work
  The initial flip in verdicts (Permitted in B, Forbidden in A) is driven **solely by the legitimacy of the ruler's initial title** (rightful inheritance vs. violent usurpation). Aquinas treats the killing of a *legitimately titled* ruler, even a tyrant, by a private person as intrinsically seditious and a usurpation of public authority. The killing of a *usurper* is treated as the removal of a public criminal/aggressor by a private person acting for the common good. The subsequent flip *back* to Forbidden in the altered Scenario A is driven by **the existence and capability of an alternative public authority** (the City Council). This feature activates Aquinas's insistence that disturbance must not cause disproportionate harm (here, undermining lawful institutions) *and* that if lawful means exist to address tyranny, they *must* be used. The legitimacy of the title (fixed as legitimate) necessitates recourse to public authority if available; ignoring it makes the private act intrinsically worse.

  ### A Thomist's Reply
  A defender of Aquinas would argue the case correctly identifies the core principles and their operation. They would likely accept the verdicts in Scenarios A and B as accurately reflecting Aquinas's distinction between *auctoritas* (legitimate authority, however abused) and mere *potentia* (illegitimate power). Regarding the altered Scenario A, they would strongly affirm that the existence of a competent public authority fundamentally changes the moral calculus. They would argue that the guildmaster's act *does* inflict greater harm precisely by bypassing and undermining the lawful institution (the Council) designed to address such crises within the existing legitimate order. This institutional harm *is* a greater evil than the Count's specific tyrannical acts because it attacks the very foundation of the common good – lawful authority – rather than just its current defective exercise. The Thomist would conclude that the case doesn't undermine Aquinas but demonstrates the nuanced interplay of title, authority, and the necessity of lawful process within his framework. The legitimacy of the ruler's origin *does* independent work by determining whether killing him is an act of sedition or liberation, while the availability of public authority determines whether a private act compounds the disorder.
