  **Core Idea & What You Do Differently (The Settled Bit)**

  1.  **Ditch Assumption-Driven Haggling:** Ordinary compromise ("I'll suffer your 6am blender if you scrub the loo") relies on guessing Maya's priorities correctly. SPI flips this. You seek rule changes that are improvements *no matter what* Maya's true preferences turn out to be (within reason), *and* vice-versa for everyone. It's about **robustness to ignorance**.
