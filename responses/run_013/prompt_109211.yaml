prompt: |-
  Okay so I'm in a small housing co-op -- eight of us in one big crumbling Victorian -- and we're trying to lock in a set of house rules before winter: the chores rota, quiet hours, how we spend the maintenance pot, that kind of thing. Alot of us are pretty conflict-averse, which is why this has dragged on. Here's my problem. We don't actually know each other's priorities that well. I genuinely don't know wether Maya cares more about a spotless kitchen or about not being woken at 6am, and she doesn't know how I weigh the garden against the boiler fund. Someone at the last meeting mentioned the idea of a safe Pareto improvement -- roughly, a change from the status quo that makes everyone better off no matter which of our guesses about each other's preferences turns out to be right, as opposed to an ordinary deal that only looks good under one particular guess. I want the most important implications of that idea for how we should actually negotiate this thing.

  So: what does it tell us to do differently from just bargaining our way to an ordinary compromise? Does it mean we should give up some joint gains to get a rule that's robust, and if so how do we even think about how much? What happens when our guesses about each other aren't independent -- if I'm wrong about what Maya wants, is she probably wrong about what I want in the same direction, and does that make the safe option easier or harder to find? And is the whole thing well-defined when what each of us wants partly depends on what we think the others want, which in a shared house it obviously does? Also tell me where this idea is likely to lead us astray, and what it simply can't settle for us.

  Be straight with me about the state of play: separate what's basically settled for people who work on this from what's genuinely contested, and don't present a contested view as if everyone agrees. If the honest answer is that the interesting version of the idea is contested, just say that.

  Write it in British English please. I'm American, I just like the way it reads.
