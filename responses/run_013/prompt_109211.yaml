          *   Focus SPI searches on **tangible outcomes** (noise decibels, money saved, chore *completion*) rather than feelings (appreciation, fairness).
          *   Explicitly discuss interdependence: "This rule about shared meals only works if most *want* it; if we're wrong, it could feel like a chore. Can we trial it safely?"
          *   Prioritise SPI rules that **build trust/communication** (e.g., a fair, transparent process for spending the maintenance pot) – this is a safe gain that makes future interdependence easier.

  **Where SPI Leads You Astray & What It Can't Solve (Settled Limitations)**

  1.  **The Tyranny of the Status Quo:** SPI is inherently cautious. It protects against harm but can entrench a sub-par status quo if *no* safe improvements are obvious. Don't let the quest for safety paralyse *all* change. Sometimes a small, monitored risk is necessary after exhausting SPIs. Winter's coming – a slightly imperfect but agreed boiler fix might be better than endless SPI analysis while the pipes freeze.
  2.  **False Sense of Security:** An SPI based on *today's* plausible guesses might not hold if preferences shift or new information emerges. **Build in review clauses.**
  3.  **Can't Resolve Deep Value Conflicts:** SPI is brilliant for efficiency and avoiding harm, but **useless** for clashes of fundamental values or non-negotiable needs.
      *   **Example:** If Fiona *needs* absolute quiet after 10pm for chronic insomnia, and Ben's band *must* rehearse until 11pm, no SPI exists. One will lose under any rule. You need compassion, creative solutions (soundproofing?), or acknowledging incompatibility. SPI won't magic this away.
