prompt: |-
  ok so i'm in this weird ai safety reading group at my high school and we keep hitting the term ascription universality. i think i get the basic idea: a system is ascription universal if, from where we are now, its explicit beliefs are at least as informative as any other way of ascribing beliefs to it. like you can't do better by interpreting it as some simpler computation, because its own stated beliefs already epistemically dominate that interpretation. it's supposed to formalize transparency or honesty.

  but our group is stuck on what a good definition would even have to look like. so before we argue about which version is right, can you give me the requirements list? what does any adequate definition of ascription universality have to get right?

  some stuff we've been arguing about that i think the list has to handle:
  - the deceptive system case: a system with hidden cognition that contradicts its stated beliefs should fail the definition.
  - the memoized lookup table case: take that deceptive system and replace it with a table that always outputs the same thing. if your definition only looks at internal cognition, you might call the table universal even though the badness is still there. so the definition definately has to let you ascribe beliefs by looking at whatever produced the system, like the training process, not just its internals.
  - the difference between being better-informed than a computation and just having more compute or being more accurate on a test set.
  - the difference between explicit and implicit beliefs, and between ascribing beliefs and prescribing them (my friend says if you deduce beliefs from outputs you're really just prescribing what counts as its beliefs, especially for irrational agents).
  - the choice between defining it as epistemically dominating every simple enough computation vs. matching every other way of ascribing beliefs. are these the same requirement or seperate ones? if different, which is doing the real work?
  - systems that are only universal relative to an impoverished perspective (like a version of us that doesn't know chemistry). should that count? what does it buy you?
  - formal limits: computability, self-reference, and the fact that for any system A you can build a C that copies A's outputs and adds a random extra bit. does that make universal systems impossible? if so, is the definition empty? if not, what in the definition blocks that move?

  for each requirement, say why it's a requirement and what case is behind it. then flag any pair that can't both be satisfied, because i suspect some of these pull against each other. a table is fine if that helps.

  last thing: tell me which single requirement does the most work, like which one knocks out the most candidate definitions, and why. and don't give me a reading list or citations, i can't look stuff up and i want the reasoning anyway.
