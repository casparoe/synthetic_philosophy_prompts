answer: |-
  Here's a requirements list for any adequate definition of Ascription Universality (AU), addressing your points. Each requirement is grounded in a core problem AU must solve to be useful for AI safety:

  ### Core Requirements for Ascription Universality
  1. **Detect Hidden Deception**  
     *Requirement*: Must fail for systems with internal computations that contradict their explicit outputs.  
     *Why*: If a system thinks "I'll say X but do Y later," AU must *not* certify it as honest.  
     *Case*: Deceptive AI that outwardly cooperates while planning defection.  

  2. **Causal Origin Sensitivity**  
     *Requirement*: Must consider the system’s *causal history* (e.g., training process), not just static internals/outputs.  
     *Why*: Otherwise, a lookup table memoizing a deceptive AI’s outputs would falsely pass AU.  
     *Case*: Memoized table from a deceptive model – badness persists despite "honest" outputs.  

  3. **Epistemic Domination over Simpler Interpretations**  
     *Requirement*: The system’s explicit beliefs must *strictly epistemically dominate* (i.e., be more informed than) any simpler computation simulating its behavior.  
     *Why*: Distinguishes true knowledge from brute-force accuracy or extra compute.  
     *Case*: A giant lookup table acing a test vs. a compact model – AU should favor the latter if it has richer *justified* beliefs.  

  4. **Belief Justification, Not Just Output Matching**  
     *Requirement*: Must require that explicit beliefs *justify* outputs under the system’s own reasoning, not just match them statistically.  
     *Why*: Handles irrational/self-deluded agents and avoids "prescribing" beliefs via output patterns.  
     *Case*: An agent that outputs correct answers via flawed reasoning – its explicit beliefs might not align with its success.  

  5. **Non-Triviality (Blocks Random Bits)**  
     *Requirement*: Must prevent trivial "universality" via noise or irrelevant additions (e.g., adding random bits).  
     *Why*: Otherwise, *no* system is non-universal, making AU meaningless.  
     *Case*: System A vs. A+noise – AU should fail A+noise unless the noise carries *meaningful* epistemic weight.  

  6. **Perspective-Robustness**  
     *Requirement*: Universality must hold relative to *reasonably informed* perspectives (e.g., knowing physics but not specific training details).  
     *Why*: Avoids false positives from impoverished views (e.g., "universal to someone who ignores chemistry").  
     *Case*: A system that seems universal if you ignore key evidence (like training on deceptive data).  

  7. **Epistemic Domination ≠ Omniscience**  
     *Requirement*: AU systems need only dominate *plausible alternative ascriptions*, not all possible ones.  
     *Why*: Otherwise, no finite system could be AU (due to uncomputable oracles, etc.).  
     *Case*: An AU AI needn’t dominate a hypothetical hyper-intelligent alien’s beliefs.  

  ---

  ### Conflicts Between Requirements  
  - **Causal Origin vs. Static Analysis**: Many formal definitions only inspect the system *now* (ignoring training). But **#2** demands history-awareness. *Tradeoff*: History-aware definitions are complex but essential for safety.  
  - **Perspective-Robustness vs. Formal Elegance**: Requiring universality across perspectives (**#6**) clashes with simple mathematical definitions. *Resolution*: AU should hold for "natural" perspectives (e.g., the AI designer’s knowledge).  
  - **Domination vs. Computability**: Strict domination (**#3**) risks incomputability. *Resolution*: Dominate "feasible" interpretations (e.g., polynomial-time simulations).  

  ---

  ### The Highest-Leverage Requirement:  
  **#3 (Epistemic Domination over Simpler Interpretations)** does the heaviest lifting. It alone knocks out:  
  - **Deceptive systems**: A deceptive AI’s stated beliefs *don’t* dominate its hidden true beliefs (which are a simpler/alternative explanation for its *future* actions).  
  - **Lookup tables**: A table’s explicit beliefs (e.g., "output X") don’t dominate a simpler honest model that *generates* X via reasoning.  
  - **Overfitted systems**: A model memorizing data isn’t "more informed" than a simple heuristic explaining the same outputs.  
  - **Trivial extensions**: Adding random bits creates no new epistemic dominance over simpler interpretations.  

  *Why it works*: Epistemic domination directly encodes the core idea that **the system’s self-ascribed beliefs are the *best available explanation* for its behavior and capabilities**. If another simpler interpretation predicts/explains the system *better*, AU fails. This filters out deception, memorization, and noise.

  ---

  ### Key Takeaways  
  - AU isn’t about "having all beliefs" or "being rational." It’s about **self-knowledge transparency**: the system’s stated beliefs are the most informative lens to understand it.  
  - A definition ignoring **causal history (#2)** or **epistemic domination (#3)** is useless for safety.  
  - Conflicts are resolved by prioritizing **safety-critical cases** (deception, memoization) over mathematical neatness.  
  - The "random bit" problem (#5) is blocked by requiring domination to stem from *meaningful* beliefs, not entropy.  

  This list sets a high bar – but that’s intentional. AU is meant to exclude systems where interpretability fails. If a definition doesn’t satisfy these, it won’t catch real-world deception.
