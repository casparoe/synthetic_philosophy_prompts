prompt: |-
  ok so i'm writing a paper for this elective i'm in (its basically half physics half philosophy) and i picked Maxwell's demon because it looked fun. i get the basic story: the demon sorts the fast and slow molecules so one side of the box heats up and the other side cools down, which looks like it beats the second law, and then people rescue the second law by saying the demon has to write down what it sees, and eventually it has to erase its memory, and erasing costs energy — theres some principle that erasing a bit costs kT ln 2, i forget whos it is. so no free lunch. i get that part.

  what i actually need is the implications. please describe the most important implications of the idea that the demon has to pay for its information, for these two things:

  1. my friends version of the demon. in his version the demon never erases anything — it just keeps writing to a brand new blank tape, and the tapes never run out and never decay. he says this version really does beat the second law, or at least that the erasure argument doesnt even touch it. what do the demon arguments imply about whether hes right? and what does that imply about whether a computer could run forever on a sealed battery if it just never deleted anything?

  2. the bigger claim that the second law is really a statement about information and about what we know, rather than about molecules bumping around. if thats right, what does it imply for whether the second law is a fundamental law of nature, or whether something smart enough could break it?

  one more thing: i keep running into two different stories about where the cost actually is. one says the measuring itself is what costs, the other says measuring is fine and only erasing costs. i cant tell which one is supposed to be the real answer, so please tell me whether that disagreement changes any of the implications or whether its just a technicality.

  write it in american english please, and please dont just give me a list of books or papers to go read — i dont have internet right now and i need the actual answer.
