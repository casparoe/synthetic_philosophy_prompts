prompt: |-
  ok, context first. small philosophy reading group, we just finished Hume's essay on miracles, and the session fell apart in a way i can't stop thinking about. the line everybody kept reaching for was extraordinary claims require extraordinary evidence. person A used it to swat down M's story about watching someone levitate at a retreat: extraordinary claim, and the evidence is just a handful of people saying so, so it's out. person B then turned the same sentence around and used it for the miracle side: precisely because the claim is that extraordinary, the fact that so many people staked their reputations and their lives on it is itself extraordinary evidence, and an ordinary rule wouldn't need a claim that big to explain that. both got nods around the room. and nobody asked what the sentence actually means, me included, which is why im writing this.

  so: give me a menu of the distinct precise claims that one-liner could be making, ordered from the flat/trivial readings up to the radical ones. for each one, say what exactly it asserts, whether its true or plausible or false, and whether it would actually get person A his dismissal, person B his conclusion, both, or neither. stuff i want sorted out along the way: is it a theorem about priors and likelihood ratios that just falls out of bayes, or is it a separate substantive rule sitting on top of bayes (and if its separate, is it true)? does extraordinary evidence mean more evidence of the usual kind, or evidence of a different kind (independent witnesses, disinterested witnesses, physical traces, that sort of thing)? does extraordinary attach to the claim, to the evidence, or to the gap between them? and is it about belief, about credences, about accepting something for practical purposes, or about who carries the burden in an argument? also: is person B's move a real argument or a fallacy with a name, because it smells to me like he's inferring from how much people believed something to how likely it is, and i cant say precisely whats wrong with it.

  one more thread. i have a vague memory that Hume himself meant something more boring than the slogan suggests, like extraordinary just meant a large amount of evidence, a matter of quantity rather than some special kind of proof. if thats right it changes which readings are even in play here. flag wherever you're unsure about the historical claim, i dont need sources or anything, i just want the menu, and i want to be able to hand it to the group next week and make person A and person B each say which line they were actually using.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a philosophy reading group that just discussed Hume's essay on miracles. The discussion fell apart because of the slogan "extraordinary claims require extraordinary evidence." Person A used it to dismiss a miracle claim (levitation), while Person B flipped it to support miracles, arguing that the apostles' martyrdom counts as extraordinary evidence. The user wants a clear breakdown of what this slogan could mean, its validity, and how it applies to both arguments.

  First, I need to address the user's main request: a menu of precise interpretations of the slogan, ordered from trivial to radical. Each interpretation should clarify what it asserts, its plausibility, and whether it supports Person A, Person B, both, or neither. Additionally, the user has specific sub-questions about Bayesian probability, the nature of evidence, burden of proof, and Person B's potential fallacy.

  I recall that Hume himself used "extraordinary" to mean low prior probability, not necessarily requiring different kinds of evidence. So, starting with trivial readings makes sense. The first interpretation is just a restatement of Bayes' theorem. If a claim has a low prior, you need strong evidence to overcome that. Person A could use this if the evidence is weak, but Person B's martyrdom evidence might not directly affect the likelihood ratio without more context.

  Next, the Quantity Reading. Here, "extraordinary evidence" means more evidence. Person A needs numerous witnesses, but Person B's argument about martyrdom quantity might not hold if the witnesses weren't sufficiently independent or varied.

  Then, the Distinct Quality Reading. Extraordinary evidence here is a different kind, like physical traces. Person A would dismiss the levitation story for lacking physical evidence. Person B's martyrdom doesn't provide new evidence types, so it wouldn't help.

  The Burden of Proof Reading shifts the obligation to the claimant. Person A uses this to demand evidence, but Person B might counter that the martyrdom meets the burden, though it's debatable.

  Radically, the Incommensurability Thesis suggests some claims can't be proven by any evidence. This would dismiss both miracles and Person B's argument, which is controversial.

  For Person B's move, I need to identify why inferring truth from strong belief is problematic. The fallacy could be appeal to emotion or confusing commitment with evidence. Martyrdom might indicate sincerity but not truth, especially if there are psychological or cultural factors.

  The user also mentioned Hume's original meaning. I should note that Hume likely focused on prior probability and evidence quantity, not special evidence types. This affects which interpretations align with Hume's intent.

  I need to ensure each interpretation's analysis covers truth/plausibility and application to both persons. Highlight where Person B's argument fails, especially in Bayesian terms—martyrdom doesn't necessarily increase the likelihood ratio if alternative explanations exist.

  Finally, provide a summary table for clarity. The user wants to present this to the group, so organization is key. Make sure to flag uncertainties about Hume's views without needing citations, just as a note for discussion.
answer: |-
  Here's a breakdown of the distinct interpretations of "extraordinary claims require extraordinary evidence" (ECREE), ordered from trivial/flat to radical, addressing your specific questions. I'll flag Hume's likely meaning and uncertainties.

  **Key Concepts Clarified:**
  *   **"Extraordinary Claim":** A claim with an extremely low prior probability (`P(H)`). This is based on our background knowledge of how the world works (Hume's "uniform experience"). Levitation or resurrection fall here.
  *   **"Extraordinary Evidence":** Interpretations vary significantly (see below).
  *   **"Require":** Specifies a necessary condition for rational belief/acceptance.
  *   **Burden/Belief:** Interpretations differ; some are about rational credence (subjective probability), others about practical acceptance or burden of proof in discourse.

  **The Menu of Interpretations:**

  1.  **The Trivial Bayesian Reading (Quantity Focus)**
      *   **Precise Claim:** "A hypothesis `H` with an extremely low prior probability `P(H)` requires evidence `E` that yields an extremely high likelihood ratio `P(E|H) / P(E|~H)` to make the posterior probability `P(H|E)` sufficiently high for rational belief or acceptance."
      *   **What it Asserts:** A direct consequence of Bayes' Theorem (`P(H|E) = [P(E|H) * P(H)] / P(E)`). If `P(H)` is tiny, `P(E|H)` must be *much* larger than `P(E|~H)` (i.e., `E` must be *much* more likely *if* `H` is true than if `H` is false) to make `P(H|E)` significant. "Extraordinary" refers to the *magnitude* of the likelihood ratio needed. Evidence is "more of the usual kind" (e.g., more witnesses, more consistent reports).
      *   **True/Plausible/False:** True (as a theorem of probability). It's a mathematical necessity.
      *   **Person A (Dismissal):** **Yes, conditionally.** If the evidence for levitation (handful of reports) is judged to have only a moderate likelihood ratio (because people are fallible, suggestible, prone to hallucination, exaggeration, or fraud), then even multiplied by the tiny prior, the posterior remains too low for belief. The *quantity/quality* of testimony isn't sufficient to overcome the extreme prior.
      *   **Person B (Support):** **No, or Highly Speculative.** While the *sincerity and commitment* of the witnesses might be high `P(E|Sincerity)`, this doesn't necessarily translate to a high `P(E|H) / P(E|~H)`. `P(E|~H)` (the probability of seeing such strong commitment *if* the miracle *didn't* happen) could also be high: people die for false beliefs due to delusion, social pressure, profound misinterpretation, or deception. Person B hasn't shown that martyrdom is *more* probable *given* the miracle than given plausible alternatives (like sincere delusion). They need to argue *why* martyrdom is *specifically* expected under `H` (miracle true) but *unexpected* under `~H` (miracle false). This is difficult.
      *   **Humean Connection:** **Strong Likelihood.** This is almost certainly what Hume meant. "Extraordinary" primarily referred to the claim's **low prior probability** based on uniform experience. "Evidence" meant **testimonial evidence**, and its "extraordinariness" primarily meant *quantity, consistency, quality of witnesses* sufficient to overcome the extreme prior. He argued testimony for miracles inherently fails this test due to the constant possibility of error/delusion/deception being a *more* probable explanation for the testimony than an actual violation of natural law. (*"A miracle is a violation of the laws of nature; and as a firm and unalterable experience has established these laws, the proof against a miracle, from the very nature of the fact, is as entire as any argument from experience can possibly be imagined."*)

  2.  **The Burden of Proof Principle (Discourse Focus)**
      *   **Precise Claim:** "In a rational discourse or argument, the party making a claim that significantly contradicts well-established background knowledge bears the burden of providing sufficient evidence to shift the onus onto skeptics. The more radical the claim, the stronger the evidence required *before* the claim needs to be seriously considered or rebutted."
      *   **What it Asserts:** A pragmatic rule for efficient and rational debate/conversation, not a direct theorem of probability (though motivated by Bayesian reasoning). "Extraordinary" attaches to the *gap* between the claim and background knowledge, defining the *burden*. "Evidence" means whatever constitutes a compelling argument/rebuttal in the context.
      *   **True/Plausible/False:** Highly plausible and practical. It prevents discourse from being derailed by endlessly debating implausible claims without initial compelling support.
      *   **Person A (Dismissal):** **Yes.** Person A asserts that M's testimony about levitation is insufficient to meet the burden of proof required to force the group to seriously consider the claim against the overwhelming background knowledge of physics. The burden hasn't been shifted.
      *   **Person B (Support):** **Contestable.** Person B argues the martyrdom *does* meet this extraordinary burden. However, skeptics (like Hume) would argue martyrdom, while impressive, is *not* sufficient to meet the burden for a claim fundamentally contradicting uniform experience, precisely because alternative explanations for the martyrdom exist. Person B hasn't *proven* it meets the burden; they've just asserted it does.
      *   **Humean Connection:** **Implied.** Hume's essay functions as an argument that the testimony for miracles *never* meets this burden.

  3.  **The Distinct Quality Reading (Type of Evidence)**
      *   **Precise Claim:** "Claims that fundamentally violate well-established natural laws require evidence of a fundamentally *different kind* than testimony alone. Extraordinary evidence must include forms less susceptible to human error, deception, or delusion (e.g., physical traces, reproducible experiments, predictions fulfilled in novel ways, evidence from maximally disinterested and competent observers)."
      *   **What it Asserts:** A substantive epistemological rule: testimony, no matter how voluminous or sincere, is categorically inadequate *by itself* for certain kinds of radical claims. Extraordinary evidence must be of a *different kind*, inherently more reliable for the specific claim. "Extraordinary" attaches to the *type* or *reliability class* of evidence required.
      *   **True/Plausible/False:** Plausible and widely accepted in science/rational inquiry. Testimony is inherently vulnerable. This rule sits *alongside* Bayes, informing what constitutes high `P(E|H)/P(E|~H)` for such claims. (e.g., For levitation, `P(E|H)/P(E|~H)` for testimony might *always* be capped too low by the possibility of error, whereas physical measurements could yield a higher ratio).
      *   **Person A (Dismissal):** **Strong Yes.** Levitation claims based *only* on witness reports (even multiple) are dismissed as fundamentally inadequate *in kind*.
      *   **Person B (Support):** **No.** Martyrdom, while demonstrating sincerity, is *still testimonial evidence* (it's evidence *of* their belief, not direct evidence *for* the miracle event itself). It doesn't provide the required *different kind* of evidence (physical, reproducible). Their sincerity doesn't change the *type* of evidence.
      *   **Humean Connection:** **Debatable, but Likely Implied.** Hume heavily emphasized the fallibility of testimony *as a category* compared to the solidity of uniform experience/observation of natural law. While he focused on quantity/quality of witnesses, his underlying skepticism suggests testimony alone might be inherently the *wrong kind* for miracles. (*"...no testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous than the fact which it endeavours to establish..."* - Note "kind" here is often interpreted as *strength*, but the door is open to type).

  4.  **The Prior-Dependent Likelihood Threshold (Acceptance Threshold)**
      *   **Precise Claim:** "The threshold of posterior probability (`P(H|E)`) required for rational *acceptance* of a claim (acting as if true, seriously incorporating it into belief) scales with the prior improbability (`P(H)`). More extreme claims require not just evidence making them probable, but evidence making them *overwhelmingly* probable before acceptance is rational."
      *   **What it Asserts:** A rule about *action* or *practical belief* based on decision theory/risk aversion, sitting *on top* of Bayes. Even if evidence makes an extraordinary claim `P(H|E) > 0.5` (more likely true than false), it might be irrational to *accept* it until `P(H|E)` is much closer to 1 because the cost of being wrong about such a radical claim is higher. "Extraordinary" refers to the *height of the posterior threshold* required for acceptance, driven by the prior.
      *   **True/Plausible/False:** Plausible and practical, especially for high-stakes decisions. It's a rational heuristic.
      *   **Person A (Dismissal):** **Yes.** Even if the levitation testimony raised `P(Levitation)` significantly (say to 0.3), it might still be far below the threshold required (say 0.99) for rational acceptance, given the implications.
      *   **Person B (Support):** **No.** Martyrdom might raise `P(Resurrection)` substantially (say to 0.6), but likely not to the *overwhelming* level (0.95+) required for rational acceptance of such a world-view-altering claim. Person B hasn't shown the threshold is met.
      *   **Humean Connection:** **Possible.** Hume's argument that testimony *cannot* overcome the prior can be seen as implying the threshold is impossibly high for miracles. He might be interpreted as setting the threshold at "more probable than not" and arguing testimony inevitably fails.

  5.  **The Incommensurability Thesis (Radical Skepticism)**
      *   **Precise Claim:** "Claims that fundamentally violate the established framework of natural laws are *in principle* beyond the reach of any possible evidence. No evidence could ever be sufficiently 'extraordinary' to warrant belief because any potential evidence would itself be more plausibly explained within the existing natural framework (e.g., hallucination, fraud, unknown natural phenomena) than by accepting the radical violation."
      *   **What it Asserts:** A radical, almost Kuhnian, view. The gap between the claim and background knowledge is so vast that evidence is judged *only* through the lens of the current paradigm, making paradigm-shattering evidence impossible. "Extraordinary evidence" is an incoherent concept for such claims.
      *   **True/Plausible/False:** Highly controversial and arguably self-defeating. If true, scientific revolutions (e.g., quantum mechanics, relativity, germ theory) would be impossible. Generally considered false, though it highlights the difficulty.
      *   **Person A (Dismissal):** **Absolute Yes.** Levitation is simply dismissed *a priori*. No evidence could count.
      *   **Person B (Support):** **Absolute No.** Martyrdom is dismissed as irrelevant; it *must* have a naturalistic explanation.
      *   **Humean Connection:** **Uncertain, but Some Lean This Way.** Hume's arguments *can* be read this radically, especially his claim that the falsehood of the testimony must be *more* miraculous than the miracle itself. Critics often accuse him of circularity: defining "uniform experience" in a way that inherently excludes miracles, making them impossible by definition. Most scholars think he stopped short of full incommensurability, but the line is blurry.

  **Addressing Your Specific Threads:**

  *   **Bayesian Theorem vs. Substantive Rule:** ECREE *starts* as a trivial consequence of Bayes (Reading 1). However, interpretations 2, 3, and 4 add substantive layers *informed* by Bayes but introducing practical, epistemological, or decision-theoretic rules *on top* of it. Interpretation 5 rejects standard evidential reasoning.
  *   **Meaning of "Extraordinary Evidence":**
      *   Reading 1: High likelihood ratio (achievable by more/better evidence of usual kinds).
      *   Reading 2: Sufficiently strong argument to shift burden (could be quantity or quality).
      *   Reading 3: Evidence of a fundamentally *different* and *more reliable kind*.
      *   Reading 4: Evidence sufficient to push the posterior to a very high threshold.
      *   Reading 5: Evidence that is impossible/incoherent.
  *   **"Extraordinary" Attachment:** Primarily to the claim's **prior probability** (low) and the **evidential standard** (high LR, high threshold, different kind, impossible) required to overcome it. The "gap" defines the burden (Reading 2).
  *   **About Belief/Credence/Burden:** It spans these:
      *   Readings 1 & 4: Focus on rational credence (`P(H|E)`) and thresholds for acceptance.
      *   Reading 2: Focus on burden of proof in discourse.
      *   Readings 3 & 5: Focus on fundamental limitations of evidence/knowledge.
  *   **Person B's Move: Fallacy?** Yes, it's largely fallacious, specifically an **Appeal to Emotion (argumentum ad passiones)** or **Appeal to Commitment**. Mistaking the *intensity* or *costliness* of belief for *evidence of the belief's truth*. While sincere commitment *can* slightly raise `P(E|H)` (they might be less likely to lie/die for something they *know* is false), it often raises `P(E|~H)` *even more* (people demonstrably *do* die for false beliefs due to delusion, indoctrination, social identity, or deception). Person B confuses evidence *of belief* (which martyrdom strongly provides) with evidence *for the event* that belief is about (which martyrdom provides weakly, if at all, for extraordinary claims). He ignores the crucial denominator in Bayes' theorem (`P(E|~H)`). Hume directly attacks this: "The incredibility of a fact, it was allowed, might invalidate so great an authority." Martyrdom doesn't make `P(E|~H)` low enough.
  *   **Hume's Original Meaning:** Your vague memory is **correct and crucial**. For Hume, "extraordinary" primarily described the **claim's inherent improbability** based on uniform experience. "Evidence" meant **human testimony**, and its "extraordinariness" was about its *quantity, consistency, and quality* (credibility of witnesses, their number, disinterest, etc.) – i.e., *more and better* evidence of the usual kind (testimony). He argued that for miracles, the required quantity/quality of testimony is impossibly high because the possibility of testimony being mistaken is *always* a more probable explanation than a violation of natural law. **This strongly favors Reading 1 as the core meaning, with Readings 2 and 3 being plausible extensions. Readings 4 and 5 are less directly supported by the text.**

  **Summary Table for Person A & Person B:**

  | Interpretation              | Core Meaning                                      | Plausible? | Supports Person A? | Supports Person B? | Likely Humean? |
  | :-------------------------- | :------------------------------------------------ | :--------- | :----------------- | :----------------- | :------------- |
  | **1. Trivial Bayesian**     | Low prior needs huge LR (more/better evidence)    | Yes (True) | **Yes** (if LR low) | **No** (LR not shown high) | **Strong Yes** |
  | **2. Burden of Proof**      | Claimant bears higher burden of proof             | Yes        | **Yes** (Burden not met) | **Contestable** (Claims met) | Likely        |
  | **3. Distinct Quality**     | Requires different evidence type (e.g., physical) | Yes        | **Strong Yes**     | **No**             | Debatable      |
  | **4. High Threshold**       | Needs near-certainty for acceptance               | Plausible  | **Yes** (Threshold high) | **No** (Not shown met) | Possible       |
  | **5. Incommensurability**   | Impossible in principle                           | No         | **Absolute Yes**   | **Absolute No**    | Uncertain      |

  **What Person A & B Likely Meant:**

  *   **Person A:** Almost certainly relied on **Reading 1 (Trivial Bayesian)** and/or **Reading 3 (Distinct Quality)**. They judged the prior for levitation to be extremely low and the testimonial evidence insufficient in quantity/quality to yield a high enough LR (`P(E|H)` not much greater than `P(E|~H)`). They implicitly rejected testimony *alone* as adequate evidence *type* for such a claim.
  *   **Person B:** Attempted a **fallacious appeal to commitment**, mistaking the sincerity/strength of belief (martyrdom) for high-quality evidence. They were likely gesturing towards **Reading 1**, claiming martyrdom *does* provide an extraordinarily high LR, but failed to justify why `P(Martyrdom|Resurrection)` is significantly greater than `P(Martyrdom|~Resurrection)`. Their argument doesn't hold water under Bayesian scrutiny or under Hume's specific criteria for testimony. They might have *felt* they were invoking a high burden (**Reading 2**) met by martyrdom, but didn't establish it.

  This menu should provide a solid framework for your group to dissect the slogan, understand Hume's argument better, and critically evaluate both Person A's dismissal and Person B's counter-move. Focus the discussion on Bayes (Reading 1), burden of proof (Reading 2), and evidence type (Reading 3) for the most fruitful analysis of Hume and the levitation case. Person B's move needs special scrutiny regarding the likelihood ratio (`P(E|H) / P(E|~H)`).
