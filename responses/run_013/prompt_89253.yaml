prompt: |-
  Ok, I keep having this argument with myself and I want a verdict. Here's how I actually react when I learn something moral from someone else.

  My doctor tells me a drug is unsafe and I believe her — fine, obviously. My coworker tells me our employer is dumping waste in the river — fine. She also tells me the dumping is wrong, and I believe that too — still fine. My friend tells me the story I told at dinner was actually cruel to my brother, and I believe her even though I still can't quite feel it — fine. Same friend tells me eating meat is morally wrong, and I believe her on her say-so, though I couldn't give you a reason of my own — not fine. I feel like I'm wearing a coat that isn't mine. My parents raised me to think breaking promises is wrong and I've never really questioned it — fine. I hear it argued on a podcast that eating meat is wrong and I take it on board — not fine, same bad feeling as before.

  But here's the one that bothers me. My friend says I shouldn't lend my cousin money because it'd be enabling him, and I just do what she says, without believing it's wrong myself. I feel ok about doing it. So do I think you can act on someone else's moral say-so but not believe on it? That seems like it should be incoherent but I can't shake it.

  Is there one principle that gets all of these, or close? If it has to get complicated to save every verdict, give me the simpler one instead and tell me which of my reactions I should give up. Also tell me what it predicts for a case I haven't listed. Lead with the principle, keep the whole thing under 400 words.
reasoning: |-
  Hmm, the user is grappling with a moral philosophy dilemma about when it's appropriate to accept moral guidance from others. They've described several scenarios where accepting moral claims from others feels fine (like trusting their doctor about drug safety or accepting that breaking promises is wrong), but other times feels uncomfortable ("like wearing a coat that isn't mine"), especially regarding claims that eating meat is wrong. The tricky case is when they act on a friend's moral advice about not lending money to a cousin, without personally believing it's wrong, yet feel fine about that action.

  I need to identify a unifying principle that explains these varied reactions. The key seems to be about personal moral conviction versus external influence. In the cases that feel "fine," there's either a pre-existing moral framework (like being raised to believe breaking promises is wrong), or the moral claim is grounded in expertise or direct evidence (the doctor's knowledge, the coworker's witness of pollution). But when it comes to abstract moral claims like vegetarianism that challenge deep-seated personal habits, acceptance feels inauthentic because it lacks personal conviction.

  The lending money case is interesting - acting on advice without believing might be acceptable here because it's more about practical consequences (enabling behavior) than core morality. This suggests a distinction between moral beliefs and practical actions guided by others' judgments.

  The simplest principle I can derive is: "Accept moral claims as beliefs only when they resonate with or clarify your existing values; otherwise, treat them as practical advice for action." This preserves most of their intuitions. For the vegetarianism case, they shouldn't feel obligated to believe it if it doesn't resonate, but might still choose to act on it as practical advice (like temporarily avoiding meat). The lending money action aligns because it's framed as practical wisdom rather than a moral belief.

  This principle predicts that if someone advised donating to a charity they already support, it would feel fine (resonance), but if pressured to adopt a completely foreign value (like opposing all private property), it would feel alien. They might need to accept that not all moral-looking advice requires internal belief - some can remain practical. This keeps the principle clean while addressing their core conflict between belief and action.
answer: |-
  Here's the unifying principle:

  **Accept a moral claim as a personal belief only if it either resonates with your existing core values or is demonstrably grounded in expertise/facts relevant to its justification.**

  *   **Fine Cases Explained:**
      *   Doctor (Drug Safety): Expertise/facts justify the claim (safety).
      *   Coworker (Dumping Fact): Factual observation.
      *   Coworker (Dumping Wrong): Resonates with core values (don't harm environment/people).
      *   Friend (Story Cruel): Resonates/clarifies core values (don't be cruel, be kind to family).
      *   Parents (Promises): Integrated into core values from upbringing.
  *   **"Not Fine" Cases Explained (Eating Meat):** The claim doesn't resonate with your current core values (meat-eating is normal, acceptable) *and* lacks a justification grounded in expertise/facts you personally accept as *morally decisive* (e.g., biological facts about animal suffering might be acknowledged, but you don't *feel* they make eating meat *wrong*). Accepting it as a *belief* feels inauthentic.
  *   **Lending Money Case Explained:** You didn't accept the *moral belief* ("it's *wrong* to lend") as your own. You acted on it as **practical advice rooted in your friend's judgment of consequences** (enabling). This is action based on *prudential counsel*, not internalized moral conviction. Hence, no "inauthentic belief" feeling, just pragmatic action.

  **What to Give Up:** The expectation that you *must* fully *believe* a moral claim to *act* on advice based on it. Sometimes, acting on another's judgment (especially about consequences) is prudent, even if the underlying moral label ("wrong") doesn't resonate.

  **Prediction for a New Case:** A climate scientist tells you *failing to reduce your carbon footprint is morally wrong*. If you value environmental stewardship (resonance) *and* accept their expertise on consequences, you'll likely accept the belief. If you value stewardship but doubt the *urgency* or *your personal impact* (lack of resonant justification), accepting the *belief* might feel forced, though you might still act pragmatically (e.g., recycle more).
