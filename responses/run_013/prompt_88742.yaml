prompt: |-
  Coherence arguments for expected utility have always bugged me in a way I can't quite shake. The standard story -- if your preferences aren't complete and transitive, someone can money-pump you, therefore EU-maximization is rationally required -- feels airtight right up until you notice that the representation theorem only ever talks about agents who already treat acts as lotteries over outcomes. Which is to say, it presupposes you're already a consequentialist. So what I want from you is a prioritized agenda for the open questions in this area, not a survey. Which unresolved issues actually matter most for the claim that EU-maximization is *required* rather than merely *recommended*, and in what order should someone with a couple years work on them?

  Weigh at least: whether exploitability is even the right criterion for irrationality (vs. the fact that a resolute agent can just refuse to keep trading); the completeness axiom and whether money pumps even bite against genuinely incomplete preferences, or only against agents who wobble between options; the small-world vs. grand-world gap in Savage; resolute choice and commitment devices; and the logical-omniscience problem when you need probabilities over your own reasoning. For each, tell me what's upstream of what, how tractable it is with philosophy tools rather than math, and what evidence over the next year would move it up or down the list. I'm less interested in the list than in the dependency structure and the criteria you're using -- importance, tractability, how many other questions hang on it.

  Lead with the single question you'd bet on, then defend the full ordering. Keep it under 450 words.
reasoning: |-
  Okay, the user is grappling with coherence arguments for expected utility (EU) theory. They feel uneasy about how these arguments presuppose consequentialism by treating acts as lotteries over outcomes. Their main concern is distinguishing between EU-maximization being required versus merely recommended. They want a prioritized research agenda focusing on unresolved issues, with specific criteria: importance, tractability, dependencies, and what evidence could shift priorities.

  First, I need to identify the key issues they mentioned: exploitability as a criterion for irrationality, completeness axiom and money pumps, small-world vs. grand-world problem, resolute choice, and logical omniscience. The user also emphasized dependency structures and tractability with philosophical tools.

  Starting with exploitability: if exploitability isn't the right measure of irrationality, that undermines the entire money-pump argument. Resolute agents who refuse to trade could avoid exploitation, making the requirement less strict. This seems foundational because if we reject exploitability as a criterion, other arguments might crumble. It's highly philosophical, relying on normative debates about rationality. Evidence here would be decision theory papers challenging exploitability, like McClennen's work on resolute choice.

  Next, the completeness axiom. Money pumps often assume cyclic preferences or incompleteness leading to inconsistent choices. But genuine incompleteness might not be exploitable if the agent is steadfast. This affects how we view preferences. If incompleteness isn't vulnerable to money pumps, then completeness isn't required. Philosophical arguments here are key, and empirical work on how people handle incompleteness could provide evidence.

  Small-world vs. grand-world is about framing acts as lotteries. Savage's approach requires reducing complex acts to outcomes, which assumes consequentialism upfront. If we can't bridge this gap, the representation theorem doesn't apply to real-world decisions. This is both conceptual and technical. Philosophical analysis of framing and evidence from cognitive science on how agents partition possibilities would be relevant.

  Resolute choice allows agents to stick to plans, avoiding money pumps. This ties into exploitability but adds commitment devices. If commitment is possible and rational, then dynamic inconsistency isn't fatal. Philosophical issues involve self-governance and precommitment. Historical examples or behavioral experiments on commitment strategies could shift perspectives.

  Logical omniscience is about assigning probabilities to one's own reasoning. This is crucial for AI alignment and bounded rationality. If logical uncertainty undermines EU, especially in complex decisions, it's a big deal. But it's more specialized, affecting cases like self-referential probabilities. Technical solutions might be needed, but philosophical work on bounded rationality is important. Progress in formal models of logical uncertainty would be evidence here.

  Now, ordering these. Exploitability is upstream because if it's not necessary for rationality, other issues become less pressing. Completeness comes next because it directly challenges an axiom. Small-world is third as it questions the setup of the theorem itself. Resolute choice is fourth, as it offers an alternative to avoiding exploitation. Logical omniscience, while important, is more niche and downstream.

  The user's deeper need might be to resolve their discomfort with the foundational assumptions of EU theory. They might be seeking a framework that either validates EU as required or provides alternatives without relying on presupposed consequentialism. Their interest in dependencies suggests they want a structured approach to tackle these issues methodically, possibly for academic research. Prioritizing based on what undermines the necessity of EU makes sense, starting with the criteria for irrationality itself.
answer: |-
  Here’s the prioritized agenda for foundational challenges to EU’s necessity, ordered by upstream dependency and leverage over the entire project:

  1.  **Exploitability as the Criterion for Irrationality** (Most Upstream)  
      *   **Why:** If exploitability isn’t a *sufficient* sign of irrationality (e.g., resolute agents can rationally refuse trades), the money-pump argument crumbles. This challenges the core *normative force* of coherence arguments.  
      *   **Upstream/Downstream:** Directly upstream of *all* money-pump justifications for axioms (transitivity, completeness, independence).  
      *   **Tractability:** Primarily philosophical (normative decision theory). Analyze "diachronic rationality" vs. "planning rationality."  
      *   **Evidence Shift:** Strong arguments for resoluteness as *rational* (not just psychological) gain traction. Conversely, a compelling case that *only* exploitability-avoidance defines dynamic rationality solidifies its status.  
      *   **Importance:** **Highest.** Resolves whether the *entire pumping strategy* is valid.

  2.  **Completeness Axiom & Genuine Incomparability**  
      *   **Why:** Money pumps against incompleteness often assume "wobbling" (dynamic inconsistency). If preferences are *steadfastly* incomplete (truly no fact of the matter), exploitability may not occur – the agent simply refuses *all* trades.  
      *   **Upstream/Downstream:** Downstream of Exploitability (if exploitability fails, this matters less). Directly upstream of whether completeness is rationally mandated.  
      *   **Tractability:** Philosophical (nature of value, incommensurability) + conceptual clarity on preference representation.  
      *   **Evidence Shift:** Robust examples of seemingly rational, *stable* incompleteness resisting exploitation; or conversely, persuasive models showing *any* incompleteness inevitably leads to dynamic inconsistency under pressure.  
      *   **Importance:** **High.** Challenges a key axiom if exploitability holds but doesn't bite genuine incompleteness.

  3.  **Small-World vs. Grand-World Framing (Savage's Gap)**  
      *   **Why:** The "acts as lotteries" presupposition *is* the consequentialist leap. Can the small-world model *justify* treating acts as outcome-lotteries, or is it a *presupposition* of the representation?  
      *   **Upstream/Downstream:** Downstream of Exploitability/Completeness (they assume the framework). Upstream of the theorem's *applicability* to real decisions.  
      *   **Tractability:** Conceptual/philosophical (meaning of "outcome," framing) + formal (can we build a non-consequentialist representation?).  
      *   **Evidence Shift:** A successful non-consequentialist representation theorem; or a rigorous argument showing the grand-world/small-world reduction *is* rationally compelled.  
      *   **Importance:** **High-Medium.** Directly addresses the "presupposes consequentialism" charge, but potentially less fatal than (1) & (2) if they hold.

  4.  **Resolute Choice & Commitment Devices**  
      *   **Why:** If resoluteness is rational *and* effective commitment devices exist, agents can avoid exploitation *without* satisfying EU axioms dynamically. Challenges the *necessity* of EU for avoiding loss.  
      *   **Upstream/Downstream:** Downstream of Exploitability (1) – if exploitability isn't irrational, resoluteness is viable. Provides a *mechanism* for avoiding pumps without EU.  
      *   **Tractability:** Philosophical (rationality of planning, self-binding) + practical (feasibility/limits of commitment).  
      *   **Evidence Shift:** Formal proof that resoluteness *always* (or sufficiently often) avoids exploitation where naivety fails; or conversely, showing resoluteness is either impossible or collapses into EU.  
      *   **Importance:** **Medium.** A powerful counter-strategy *if* exploitability is a valid criterion (1).

  5.  **Logical Omniscience & Self-Referential Uncertainty**  
      *   **Why:** EU requires consistent probabilistic beliefs over states. But uncertainty about one's *own* future reasoning, beliefs, or the structure of the problem itself violates logical omniscience, making standard EU application incoherent or undefined.  
      *   **Upstream/Downstream:** Downstream of the core framework (assumes well-defined states/probabilities). Affects the *scope* of EU's applicability rather than its core necessity in "clean" cases.  
      *   **Tractability:** Highly technical (non-classical logic, bounded rationality models) + philosophical (rationality under computational limits).  
      *   **Evidence Shift:** A workable decision theory for profound logical uncertainty that *differs* from EU; or integrating such uncertainty into an extended EU framework.  
      *   **Importance:** **Medium-Low (for core necessity).** Primarily challenges EU's *universality*, not its necessity in standard coherence arguments (which assume away this issue). Crucial for AI alignment/bounded rationality.

  **Prioritization Justification:**  
  The order reflects *logical dependency* and *leverage over the necessity claim*. (1) attacks the foundational justification mechanism (money-pumps). If exploitability isn't definitive, the argument for *any* axiom weakens dramatically. (2) specifically targets the most plausible relaxation (incompleteness), contingent on (1) holding. (3) tackles the core "consequentialist presupposition" objection head-on. (4) offers an escape route *if* money-pumps are valid problems. (5) is critical for realism but less directly challenges the canonical coherence argument for EU's rational *requirement* in its intended domain. Tractability leans philosophical for (1), (2), (3), (4); highly technical for (5).
