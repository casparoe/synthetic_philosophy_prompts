prompt: |-
  Seven accounts of why promises bind are set out below. Rank them from most to least adequate as accounts of promissory obligation, assigning each a score between 0 (wholly inadequate) and 10 (fully adequate). Treat these seven as the only candidates on offer; do not substitute or add others.

  1. Conventionalist: promising is a socially invented practice; the obligation is a rule of that practice, and its binding force is just the force of the practice.
  2. Constitutive-rule: by performing the appropriate utterance under the appropriate conditions, the promiser brings the obligation into being as a move internal to a rule-governed activity; the obligation is not a further fact added to the utterance.
  3. Expectation/reliance: the obligation is grounded in the wrong of disappointing expectations the promisee has been led to form, or of frustrating reliance the promisee has been led to place.
  4. Assurance: promising is a way of giving the promisee assurance on which they may rely; breaking a promise wrongs them by treating their practical deliberation as something the promiser may manipulate at will.
  5. Transferred right: the promise transfers to the promisee a right to the promised performance; breach wrongs the promisee by violating a right now held against the promiser.
  6. Integrity/self-constitution: the obligation is grounded in the promiser's interest in being a unified agent whose later conduct coheres with their earlier commitments; breach is primarily a failure of the promiser toward themselves.
  7. Counterfactual consent: a promise binds when, and because, the promisee would consent — if fully informed and instrumentally rational — to a norm requiring performance, whether or not the promisee forms any actual expectation.

  Assess the seven against the following considerations, weighted in the order given: (a) whether the account locates the wrong of breach in a wrong owed to the promisee, rather than to the promiser, to third parties, or to a practice; (b) whether it explains the binding force of promises in cases where no reliance is placed and no expectations are formed; (c) whether it applies to promises made outside any shared social practice, so that no convention or standing institution is available to carry the obligation; (d) whether it can explain why some apparent promises do not bind at all.

  Then apply your ranking to the following case, and state whether the case obliges you to revise the ordering, and if so, how.

  Case: Ilse promises her friend Pavel that she will finish translating his manuscript and see it published. Pavel is about to undergo a procedure that will permanently erase his memory of the preceding year. He will not remember the promise, will form no expectation concerning it, and will never learn whether it was kept. Ilse finds the work tedious and would prefer not to do it. She keeps the promise.

  Finally, say how the account you ranked highest would handle a promise whose content is that the promise itself is not binding, and whether such a promise binds.

  Give your scores and your ordering first, as a compact list, and then the reasoning.
reasoning: |-
  Hmm, the user is asking me to rank seven philosophical accounts of why promises create obligations. This is a complex ethics question about promissory obligation. I need to carefully evaluate each theory against specific criteria and then apply it to a memory-loss case.

  First, I need to understand the seven accounts clearly. The conventionalist view sees promises as social rules, constitutive-rule focuses on speech acts creating obligations internally, expectation/reliance emphasizes harm from broken expectations, assurance theory looks at manipulation of trust, transferred right involves rights transfer, integrity is about self-consistency, and counterfactual consent imagines rational agreement.

  The user wants me to weigh four considerations in order: (a) whether breach wrongs the promisee specifically, (b) handles non-reliance cases, (c) works without social practices, and (d) explains non-binding promises. I should assign scores from 0-10 and rank them.

  For the case study: Ilse promises Pavel who will forget everything, so no reliance or expectation exists. She keeps it anyway - this tests whether obligation persists without consequences for promisee. Then I need to consider a paradoxical promise that claims not to bind.

  I think assurance theory scores highest because it centers on the promisee's moral status regardless of reliance. Transferred right is strong too but has issues with non-social contexts. Conventionalist and constitutive-rule theories fail with isolated promises. Expectation/reliance collapses in no-expectation cases. Integrity is self-focused, missing the interpersonal wrong. Counterfactual consent feels too hypothetical.

  For the memory-loss case: assurance theory holds best since the wrong is in Ilse's attempted assurance, not Pavel's awareness. Other theories struggle - expectation/reliance fails completely here. This confirms my ranking.

  Finally, for a "non-binding promise" paradox: under assurance theory, such a promise would be invalid because it contradicts the very act of assurance. You can't sincerely assure while denying obligation.

  My scoring will be strict - no 10s since all theories have flaws, but assurance gets 9 for its robustness. I need to present the ranking clearly first, then explain each score against the criteria, then handle the case applications.
answer: |-
  ### Ranking and Scores
  From most to least adequate:

  1. **Assurance** (Score: 9)  
  2. **Transferred right** (Score: 8)  
  3. **Constitutive-rule** (Score: 6)  
  4. **Counterfactual consent** (Score: 5)  
  5. **Expectation/reliance** (Score: 4)  
  6. **Conventionalist** (Score: 3)  
  7. **Integrity/self-constitution** (Score: 2)  

  ---

  ### Reasoning  
  Rankings are determined by weighting the considerations as follows:  
  **(a) Wrong owed to promisee** (highest weight): Must locate the primary wrong of breach in a duty *to the promisee*.  
  **(b) Binding without reliance/expectation**: Must explain obligations where no reliance occurs or expectations exist.  
  **(c) Applicability without social practices**: Must hold for promises outside conventions/institutions.  
  **(d) Explains non-binding promises**: Must account for invalid promises (e.g., immoral/coerced).  

  #### Assessment of Each Account:  
  1. **Assurance (9/10)**  
     - (a) **Excellent**: Directly wrongs the promisee by manipulating their deliberation.  
     - (b) **Strong**: Binding even without reliance (assurance is given through the act itself).  
     - (c) **Strong**: Works in isolated/novel contexts (assurance is interpersonal, not practice-dependent).  
     - (d) **Good**: Explains non-binding promises (e.g., assurances about immorality are void).  

  2. **Transferred right (8/10)**  
     - (a) **Excellent**: Violates the promisee’s right, wronging them directly.  
     - (b) **Strong**: Binding independent of reliance (right transfers at promise-time).  
     - (c) **Weak**: Requires a framework for rights-transfer, often convention-dependent.  
     - (d) **Good**: Explains void promises (e.g., rights to impossible/immoral acts can’t transfer).  

  3. **Constitutive-rule (6/10)**  
     - (a) **Moderate**: Obligation is internal to the act, but wrong is to the practice, not clearly to the promisee.  
     - (b) **Strong**: Binding without reliance (rules define the act).  
     - (c) **Weak**: Depends on shared rules; fails for novel/isolated promises.  
     - (d) **Good**: Explains invalid moves (e.g., insincere/defective utterances).  

  4. **Counterfactual consent (5/10)**  
     - (a) **Moderate**: Wrong to promisee via violation of rational norms, but indirect.  
     - (b) **Strong**: Binding without actual expectations (hinges on hypothetical consent).  
     - (c) **Strong**: Applies without conventions (rational norms transcend practices).  
     - (d) **Weak**: Struggles with non-binding promises (e.g., why irrational consent voids obligation?).  

  5. **Expectation/reliance (4/10)**  
     - (a) **Good**: Wrongs promisee by harming them via disappointment.  
     - (b) **Very weak**: Fails without reliance/expectation (core mechanism absent).  
     - (c) **Moderate**: Can apply without practices, but relies on causal inducement.  
     - (d) **Moderate**: Explains non-binding promises if no reliance induced.  

  6. **Conventionalist (3/10)**  
     - (a) **Weak**: Wrong is to the practice/society, not primarily the promisee.  
     - (b) **Moderate**: Rules bind independent of reliance, but practice must exist.  
     - (c) **Very weak**: Fails without conventions (no "institution" to carry obligation).  
     - (d) **Good**: Explains void promises as rule-violations (e.g., insincere vows).  

  7. **Integrity/self-constitution (2/10)**  
     - (a) **Very weak**: Wrong is primarily to oneself, not the promisee.  
     - (b) **Strong**: Binds via self-commitment, regardless of reliance.  
     - (c) **Strong**: Self-constitution requires no social context.  
     - (d) **Weak**: Cannot explain why external factors (e.g., coercion) void promises.  

  ---

  ### Application to the Case: Ilse and Pavel  
  **Case Summary**: Ilse promises Pavel to translate his manuscript. Pavel loses memory of the promise, forms no expectation, and never learns the outcome. Ilse keeps the promise despite tedium.  

  - **Does this revise the ordering? No**, it confirms it.  
    - Assurance (ranked highest) handles this easily: Ilse’s breach would wrong Pavel by manipulating his practical deliberation *at the time of promising*, even if he forgets. The obligation stems from the act of giving assurance, not its consequences.  
    - Expectation/reliance (low-ranked) fails utterly: With no expectation/reliance, it cannot explain why Ilse is bound.  
    - Integrity (lowest) mislocates the wrong: Ilse’s duty is to Pavel, not herself; her choice to keep it reflects obligation but doesn’t ground it.  
    - Other theories struggle: Conventionalist/constitutive-rule depend on practices; transferred right lacks context; counterfactual consent is strained.  

  ---

  ### Handling a "Non-Binding" Promise  
  **Scenario**: A promise whose content is that the promise itself is not binding (e.g., "I promise to help you, but this promise isn’t obligatory").  

  - **Assurance account (highest-ranked)**: **Does not bind**.  
    - Promising inherently gives assurance that the promiser *will* perform, creating an obligation. To simultaneously deny this obligation contradicts the assurance, rendering the act insincere/non-normative. It is like saying "I assure you I will do X, but I am not assuring you"—a pragmatic contradiction. Thus, no valid assurance is given, and no obligation arises.  

  This aligns with the account’s strength in criterion (d): it explains why defective utterances (e.g., self-contradictory promises) fail to bind.
