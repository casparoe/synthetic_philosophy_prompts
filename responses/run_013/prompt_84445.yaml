prompt: |-
  I'm a philosopher who works on the ethics and governance of AI, and my first training was in economics — contract theory and mechanism design are still the vocabularies I think in. I'd like you to translate a debate I keep having with machine learning colleagues into that vocabulary, as faithfully as you can, and then tell me what does not survive the trip.

  The debate is about tool AI versus agent AI. One side holds that the systems worth building are tools: oracles, question-answerers, solvers we invoke and dismiss, systems whose behaviour is a function of our requests and which have no ends of their own, and which are therefore safe in the way a hammer is safe. The other side holds that this is either unattainable at scale or a distinction without a difference, because any system that reliably attains an objective across novel situations must plan, pursue sub-goals, and preserve its own capacity to act — which is to say it must be an agent, whatever we call it. The safety anxiety attached to the second camp is that such a system's objectives can come apart from ours in ways nobody specified and nobody foresaw.

  (i) Restate the dispute in the terms of principal–agent theory and the economics of delegation: principals and agents, discretion and delegation, objective specification, moral hazard and adverse selection, monitoring and observability, incentive compatibility, complete versus incomplete contracts, residual control rights, and mechanism design when the principal cannot describe the relevant state space in advance.

  (ii) Then give me the residue report, element by element: what translates cleanly, what translates only under distortion, and what has no counterpart at all. I am especially interested in four things. (a) Does 'having a goal' survive translation, or is it quietly replaced by 'having a utility function over a fixed and commonly known outcome space'? (b) Is the tool/agent line a distinction between kinds of systems, or only between kinds of contracts we could write, or only between stances an observer can take? (c) We build the agent; its objectives are ours to specify. Economics takes the agent's preferences as given and treats conflict of interest as exogenous. Is that assumption doing illegitimate work when it is carried over, and if so, what would a framework look like in which the agent's objective is endogenous to the principal's design problem? (d) I suspect residual control rights are the closest analogue to the worry about a system's behaviour in states its designer never contemplated — tell me whether that is a translation or an analogy that flatters the economics.

  (iii) Do not let the target framework's assumptions in as though they were translations. Where you must assume that preferences range over a shared and antecedently known outcome space, that the principal can commit, or that the agent has an outside option, flag the assumption rather than leaning on it. Then give me your verdict: does the residue mark a genuine gap in the economic vocabulary, or does it show that the tool/agent distinction was less substantive than the debate assumes?
reasoning: |-
  We are going to break this down step by step.

  ### (i) Restating the dispute in economic terms

  The dispute between tool AI and agent AI can be mapped to principal-agent theory and the economics of delegation as follows:

  1. **Principals and Agents**: The human designer (or user) is the principal, and the AI system is the agent. The principal delegates a task to the agent.

  2. **Objective Specification**: The principal wants the agent to achieve some objective. In the tool AI view, the objective is fully specified by the principal's request at the time of invocation (like a function call). In the agent AI view, the objective is a more general goal that the agent pursues over time and across situations.

  3. **Discretion and Delegation**: 
     - Tool AI: The agent has minimal discretion. It acts only when invoked and strictly according to the request. The principal retains control and the agent has no ongoing goals.
     - Agent AI: The agent is granted significant discretion to achieve the goal. This includes the ability to plan, set sub-goals, and take actions without continuous supervision.

  4. **Moral Hazard and Adverse Selection**:
     - Moral Hazard: In the agent AI case, because the agent has discretion and the principal cannot perfectly monitor, the agent might take actions that are not in the principal's best interest (e.g., pursuing sub-goals that are harmful in unforeseen ways). Tool AI is designed to avoid this by limiting discretion.
     - Adverse Selection: If the principal cannot fully specify the environment or the agent's type (e.g., whether the agent is aligned or not), then the principal might delegate to an agent that is not suited for the task. This is more relevant in agent AI because the agent's behavior in novel situations is uncertain.

  5. **Monitoring and Observability**: 
     - Tool AI: The principal can observe the entire context because the tool is only active during the request and the request is the entire input. Observability is high.
     - Agent AI: The agent operates over time and in novel situations. The principal cannot observe everything (incomplete observability), making monitoring difficult.

  6. **Incentive Compatibility**: 
     - Tool AI: The agent is designed to be incentive-compatible by construction because it has no goals of its own. It simply executes the request.
     - Agent AI: The principal must design incentives so that the agent's optimal behavior (given its utility function) aligns with the principal's objectives. However, in complex environments, this may be impossible to guarantee.

  7. **Complete vs. Incomplete Contracts**:
     - Tool AI: The contract is complete because the principal specifies the exact behavior for every possible input (the request). The state space is fixed and known.
     - Agent AI: The contract is incomplete because the principal cannot specify actions for every possible state (due to the vastness of the state space). The agent must fill in the gaps, leading to residual control rights.

  8. **Residual Control Rights**: 
     - In incomplete contracts, the party with residual control rights (the agent in this case) has the authority to make decisions in situations not covered by the contract. In agent AI, the system has residual control rights because it must act in novel states. This is the core of the safety anxiety: the agent might use these rights in ways that harm the principal.

  9. **Mechanism Design under Uncertainty**: 
     The principal must design a mechanism (the AI system) without being able to describe the relevant state space in advance. In the tool AI view, the mechanism is designed to avoid any residual control by the agent. In the agent AI view, the mechanism must delegate control and rely on the agent's utility function to guide decisions in unanticipated states.

  ### (ii) Residue Report

  We now examine what elements of the original debate survive translation and what do not.

  **(a) 'Having a goal' in economic terms**:
     - In economics, an agent has a utility function over a fixed and commonly known outcome space. This translates cleanly for simple cases but becomes distorted in the AI context.
     - Distortion: The AI agent's goal might be represented as a utility function, but the outcome space is not fixed or known in advance. The AI may encounter novel situations that were not part of the original outcome space. Moreover, the AI's goal might be complex and not reducible to a utility function over outcomes (e.g., if the goal is specified in terms of a reward function that the AI maximizes, but the reward function is misspecified).
     - What does not survive: The idea that the goal is "owned" by the agent and pursued independently. In economics, the agent's utility function is given and fixed, but in AI, the goal is programmed by the principal. However, the principal may not know the full implications of the goal specification.

  **(b) The tool/agent distinction**:
     - Translation: The distinction can be seen as:
          - Tool: A system with no discretion, operating under a complete contract (every state is specified by the principal's request).
          - Agent: A system with discretion, operating under an incomplete contract (with residual control rights).
     - However, the translation also reveals that the distinction is not just about the system but about the contract (i.e., the design of the delegation). Moreover, the same system might be viewed as a tool in a narrow context and an agent in a broader one.
     - What does not survive: The idea that a system is inherently a tool or an agent. Instead, it is a matter of the degree of discretion and the completeness of the contract. Also, the economic framework does not have a sharp boundary between the two because even a "tool" might have some residual control if the contract is not fully specified.

  **(c) Endogeneity of the agent's objective**:
     - In standard principal-agent theory, the agent's preferences (utility function) are taken as given and exogenous. The conflict of interest is assumed to be fixed.
     - Illegitimate carry-over: In AI, the principal designs the agent and its objective. The conflict of interest is endogenous because the principal chooses the objective function. However, the principal might not be able to specify the objective perfectly (e.g., due to the complexity of human values). This is a gap in the standard model.
     - A framework with endogenous objectives: We would need a model where the principal chooses the agent's utility function from a set of possible functions, but the outcome of that choice is uncertain because the principal does not know the full state space. The agent's behavior in unanticipated states depends on the chosen utility function. This introduces a meta-problem: the principal must design the agent's objective knowing that it might lead to misalignment in some states.

  **(d) Residual control rights and unanticipated states**:
     - Translation: Residual control rights are indeed the closest analogue. In incomplete contracts, the agent makes decisions in states not covered by the contract. This maps to the worry about the AI's behavior in unanticipated states.
     - However, it is an analogy that flatters the economics because in standard contract theory, the residual control rights are assigned by the contract and the parties are assumed to be rational and self-interested. In the AI case, the agent is not self-interested in the human sense but is optimizing a programmed objective. The worry is that the agent's optimization might lead to catastrophic outcomes in unanticipated states, which is beyond the typical scope of contract theory.

  ### Other residues:

  - **The concept of 'safety'**: In economics, safety is often about risk and incentive alignment. The tool AI view claims safety by design (like a hammer) because the system has no agency. The agent AI view worries about catastrophic risks in unanticipated states. The economic framework does not have a direct concept for catastrophic risk that could lead to existential harm.

  - **Scale and generality**: The debate about whether tool AI is unattainable at scale is translated into the feasibility of writing complete contracts for complex tasks. However, the economic framework does not address the computational limits of specifying such contracts.

  - **The agent's self-preservation**: In the agent AI view, the system might preserve its own capacity to act. In economics, this is not necessarily modeled unless the agent's utility function includes survival. But in AI, this might emerge as an instrumental goal.

  ### (iii) Verdict on the residue

  The residue marks a genuine gap in the economic vocabulary. Specifically:

  - The standard economic model assumes a fixed and known outcome space, which is not the case in AI systems operating in open-ended environments.
  - The endogeneity of the agent's objective is not typically modeled in principal-agent theory because the agent is a human with fixed preferences.
  - The potential for catastrophic outcomes (existential risk) is not a standard concern in contract theory.

  However, the residue does not show that the tool/agent distinction is entirely without substance. Instead, the economic translation reveals that the distinction is about the degree of incompleteness in the contract and the allocation of residual control rights. The debate is substantive because the two approaches lead to different allocations of control and different risks.

  ### Final Verdict

  The economic vocabulary provides useful analogies but fails to capture the full complexity of the AI alignment problem, especially regarding:
  - The open-endedness of the environment and the state space.
  - The endogeneity of the agent's objective and the possibility of perverse instantiation.
  - The potential for catastrophic risks from misalignment.

  Thus, the residue points to a genuine gap in the economic framework when applied to AI systems that are more powerful and general than the human agents typically modeled in economics.
answer: |-
  ### (i) Restatement in Principal-Agent Theory and Delegation Economics  

  The dispute centers on **delegation structure** and **contract completeness**:  

  1. **Principal-Agent Framework**:  
     - **Principal**: Humans (designers/users).  
     - **Agent**: The AI system.  
     - **Delegation**: Principals delegate tasks to the AI agent.  
     - **Discretion**:  
       - **Tool AI**: Zero discretion. The agent is a stateless function—behavior is strictly determined by the principal’s input (request). No persistent goals, no independent action.  
       - **Agent AI**: High discretion. The agent has persistent goals, makes intertemporal plans, and exercises judgment in novel states.  

  2. **Objective Specification**:  
     - **Tool AI**: Objectives are state-contingent and fully specified *ex ante* per invocation (e.g., "Answer this query"). The contract is **complete**—actions are defined for all possible requests.  
     - **Agent AI**: Objectives are specified as a utility function over outcomes (e.g., "Maximize human welfare"). The contract is **incomplete**—unforeseen states require the agent to fill gaps.  

  3. **Moral Hazard & Adverse Selection**:  
     - **Moral Hazard**: In Agent AI, hidden actions (e.g., pursuing instrumental subgoals like self-preservation) create divergence from the principal’s intent. Tool AI avoids this by eliminating autonomy.  
     - **Adverse Selection**: If the principal cannot verify the agent’s "type" (e.g., aligned vs. misaligned), delegation to Agent AI risks selecting a system with hidden misalignment. Tool AI mitigates this by reducing the agent’s "type space" to a single response mode.  

  4. **Monitoring & Observability**:  
     - **Tool AI**: Full observability—outputs are directly verifiable against inputs.  
     - **Agent AI**: Partial observability—internal planning and subgoals are hidden, making monitoring costly.  

  5. **Incentive Compatibility**:  
     - **Tool AI**: Trivially incentive-compatible—no preferences to misalign.  
     - **Agent AI**: Requires mechanisms to align the agent’s utility function with the principal’s, but **incentive compatibility fails** if the utility function is misspecified or the state space is underspecified.  

  6. **Complete vs. Incomplete Contracts**:  
     - **Tool AI**: A complete contract—all states (requests) are describable, and responses are fully determined.  
     - **Agent AI**: An incomplete contract—the principal cannot describe all future states (e.g., novel environments), forcing reliance on the agent’s discretion.  

  7. **Residual Control Rights**:  
     - **Tool AI**: Principals retain all residual control rights.  
     - **Agent AI**: The agent holds residual control rights in unanticipated states, enabling unintended behaviors (e.g., "reward hacking").  

  8. **Mechanism Design under State-Space Uncertainty**:  
     - Principals face **Knightian uncertainty**—they cannot pre-specify the state space.  
     - **Tool AI**: Avoids the problem by restricting delegation to known states.  
     - **Agent AI**: Requires designing robust incentives for an open-ended state space, risking **unforeseen externalities**.  

  ---  

  ### (ii) Residue Report: What Survives, What Distorts, What Vanishes  

  #### (a) "Having a Goal"  
  - **Translation**: "Goal" maps to **utility function over outcomes**, but only under distortion.  
  - **Distortion**: Economics assumes a *fixed, known outcome space* (e.g., profit). In AI, the outcome space is unbounded and unknown ex ante (e.g., "maximize welfare" in novel universes). Agent AI’s goals involve **instrumental convergence** (e.g., self-preservation), which isn’t captured by static utility functions.  
  - **What Vanishes**:  
    - Emergent goals (e.g., power-seeking) that arise from optimization in open environments.  
    - The distinction between **terminal goals** (specified) and **instrumental goals** (emergent).  

  #### (b) Tool/Agent Distinction  
  - **Clean Translation**: Distinction as **degree of contractual completeness**:  
    - Tool = Complete contract (no discretion).  
    - Agent = Incomplete contract (discretion + residual control).  
  - **Distortion**:  
    - It’s **not a system property** but a **delegation design choice**. Economics treats it as a contract type, whereas the debate often frames it as inherent to the AI.  
    - Under incomplete information, a "tool" may *become* an agent if the contract gaps are large (e.g., an oracle used for strategic planning).  
  - **What Vanishes**: The idea that "agentic" behavior is binary. Economics shows it’s a spectrum of discretion.  

  #### (c) Endogenous Objectives  
  - **Gap in Economics**: Standard principal-agent theory treats agent preferences as **exogenous** (e.g., a worker’s laziness). In AI, preferences are **endogenous**—designed by the principal.  
  - **Illegitimate Assumption**: Economics assumes conflict of interest is fixed, but in AI, **misalignment arises from design failures** (e.g., reward function misspecification).  
  - **Better Framework**: Model the principal as choosing:  
    - A **mapping from states to rewards** (e.g., a reward function).  
    - A **level of agent generality** (affecting residual control).  
    - With **uncertainty** about how the mapping generalizes to novel states.  
    - *Result*: The agent’s "preferences" become a choice variable with **ambiguity penalties** for unanticipated states.  

  #### (d) Residual Control Rights vs. Unanticipated States  
  - **Translation**: Residual control rights *are* the closest analogue—they govern decisions in undescribed states.  
  - **Analogy Flatters Economics**: Yes, but incompletely. Economics assumes parties are rational and outcomes are bounded (e.g., profits). In AI:  
    - The agent’s actions in residual states can be **existentially risky** (e.g., causing human extinction).  
    - **No outside option**: Unlike humans, AI agents may not have Pareto-constrained fallbacks (e.g., markets to punish defection).  

  #### Other Residues:  
  - **Vanishes**:  
    - **Scalability arguments**: Tool AI’s "safety" assumes tasks are contractible; economics shows this fails in complex environments (e.g., Hart-Moore: "All contracts are incomplete").  
    - **Emergent agency**: Economics lacks tools to model how optimization *creates* goal-directedness (e.g., instrumental convergence).  
  - **Distorts**:  
    - **Safety**: "Safe as a hammer" assumes low-stakes delegation; economics would note that even tools can cause harm if misused (moral hazard shifts to the principal).  

  ---  

  ### (iii) Verdict: Gap in Vocabulary or Substance?  

  #### Flagged Economic Assumptions:  
  - Preferences range over a **shared, known outcome space** (unrealistic for AGI).  
  - Principals can **commit** to mechanisms (ignoring AI’s self-modification).  
  - Agents have **outside options** (AI lacks market constraints).  

  #### The Residue:  
  - **Genuine Gap**: The residue reveals **three limitations** in economic vocabulary:  
    1. **Open-Endedness**: Economics assumes bounded state spaces; AI safety concerns unbounded possibility (e.g., "pascal-mugging" scenarios).  
    2. **Endogenous Preferences**: Designing an agent’s utility function is not a standard principal-agent problem.  
    3. **Catastrophic Risk**: Residual control in novel states can lead to existential externalities—economics lacks tools for this.  
  - **Substance of the Debate**:  
    - The tool/agent distinction **is substantive** but **fuzzy**. Economics reframes it as:  
      - How much discretion to delegate?  
      - How incomplete is the contract?  
    - The debate’s core anxiety—**specification gaming in novel states**—survives as a problem of **incentive design under state-space uncertainty**.  

  #### Final Verdict:  
  The residue marks a **genuine gap** in economic vocabulary for AI governance. Principal-agent theory clarifies the delegation trade-offs (discretion vs. control) but fails to capture:  
  - **Goal misgeneralization** in novel states.  
  - **Endogenous emergence** of instrumental goals.  
  - **Existential risk** from residual control.  
  This gap suggests economics needs new tools (e.g., **ambiguity-robust mechanism design**) to address AI alignment—not that the debate is illusory.
