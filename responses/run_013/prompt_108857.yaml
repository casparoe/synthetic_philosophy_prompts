answer: |-
  Here is a research proposal structured around your core concerns, designed to be self-contained for your audience and focused on a single, precise question. It prioritizes rigor over breadth and incorporates your requested elements.

  ---

  **Research Proposal: The Anchoring Problem in Gradual Replacement Arguments for Computationalism**

  **1. Core Question:**  
  *Does the Gradual Neuron Replacement Argument (GNRA) for computationalism (the view that consciousness depends solely on computational function) necessarily fail due to an in-principle inability to define functional equivalence for individual components within densely recurrent systems without presupposing the global state they are embedded in?*

  **2. Motivation & Target Argument:**  
  The GNRA is a powerful intuition pump for computationalism: replacing a biological neuron-for-neuron with functionally equivalent silicon devices, while preserving behavior at every step, allegedly preserves consciousness throughout. Critics often focus on qualia or personal identity. However, this proposal targets a *metaphysical undercurrent*: the argument presupposes a coherent notion of "functional equivalence" for individual components within complex systems like the brain. I contend that existing defenses of GNRA overlook a fundamental **Decomposition Problem**, and that this problem potentially undermines the argument *even before* concerns about limits or hidden states become relevant. While the Limit Worry (does equivalence at finite stages entail equivalence at the limit?) and Hidden-State Worry (does input-output equivalence capture *all* relevant functional properties?) are significant, I hypothesize that the Decomposition Worry is the primary blocker. If component equivalence cannot be non-circularly defined within a densely recurrent system, the GNRA's core premise ("replace with a device that does *exactly the same thing*") is ill-posed from the outset.

  **3. Why Existing Positions Leave the Question Open:**  
  *   **Proponents of GNRA (e.g., Dennett-inspired computationalists, some AI theorists):** Typically assume functional equivalence at the component level is unproblematic or defined purely by input-output profiles within the system's causal network. They rarely engage deeply with the metaphysics of implementation in highly recurrent, analogue, or dynamically complex systems. Their focus is often on behavioral continuity or high-level cognitive function.
  *   **Opponents of GNRA (e.g., biological naturalists, advocates of strong embodiment/enactivism):** Often attack the conclusion directly (e.g., silicon can't *feel*) or via personal identity/survival (is the final system *me*?). They may gesture towards implementation details but rarely isolate and rigorously analyze the *decomposability* assumption as the primary weak point. The Limit and Hidden-State worries are sometimes invoked but not systematically shown to depend on or be symptomatic of the Decomposition Problem.
  *   **The Gap:** There is no focused analysis establishing whether the GNRA *requires* a notion of component functional equivalence that is independent of global state specification in recurrent systems, and whether such a notion is coherent. Existing critiques don't definitively show if the Decomposition Worry alone is sufficient to block the argument, or if it merely shifts the burden onto the other worries.

  **4. Hypothesis:**  
  The Decomposition Worry is fatal to the GNRA as standardly presented. Defining what a single neuron "does" in a densely recurrent cortex intrinsically requires reference to the *global state* of the system (or a significant subsystem) at the time of replacement. This makes the "functional equivalence" of the replacement component dependent on the *existing biological context*. Consequently, the premise of component-level functional equivalence cannot be non-circularly specified *in principle* for such systems, rendering the GNRA incoherent before questions of limits or hidden states even arise. The Limit and Hidden-State worries are either downstream consequences of this core problem or distinct issues applicable even if decomposition were possible.

  **5. Research Plan (10-Week Semester):**

  *   **Week 1-2: Formal Reconstruction & Premise Isolation:**
      *   Task: Formally reconstruct the GNRA, identifying its minimal necessary premises (e.g., P1: Component functional equivalence is definable; P2: Stepwise replacement preserves behavior; P3: Behavioral preservation entails experiential preservation; P4: Preservation at all finite stages entails preservation at the limit; C: Full replacement preserves consciousness). Crucially, explicate "component functional equivalence" (CFE).
      *   Deliverable: Precise argument schema highlighting CFE as the critical premise under scrutiny.

  *   **Week 3-4: Decomposition Worry - Conceptual Analysis:**
      *   Task: Rigorously analyze the requirements for CFE. Argue that in densely recurrent systems with continuous dynamics (like cortex), the causal contribution of a single unit is not isolatable; its "function" is defined only relative to a specific partitioning of the system and its *current global state*. Demonstrate that specifying the replacement component's "function" as "what the original *would have done* given the *current global input and the state of all other components*" is not specifying a *component* function but effectively a *global system* function localized to a point.
      *   Deliverable: Conceptual argument establishing the non-independence of CFE specification from global state in recurrent systems.

  *   **Week 5: Decomposition vs. Limit/Hidden State - Priority Assessment:**
      *   Task: Examine whether the Limit Worry (anchor loss) and Hidden-State Worry (insufficient IO profile) *depend* on the Decomposition Worry. Argue that the Limit Worry arises *because* CFE is anchored biologically; the Hidden-State Worry highlights a *type* of global state dependency (temporal/historical) relevant even if CFE *were* definable for simpler systems. Conclude the Decomposition Worry is fundamental.
      *   Deliverable: Argument establishing the Decomposition Worry as primary and potentially sufficient.

  *   **Week 6-7: Toy Model Construction & Analysis:**
      *   Task: Construct a minimal, analytically tractable toy model of a densely recurrent system (e.g., a small continuous-time recurrent neural network - CTRNN - with known dynamics). Define a "replacement step." Attempt to formally define CFE for one unit *without* referencing the state of other units or the global system state at the moment of replacement. Demonstrate the impossibility or circularity.
      *   Deliverable: Formal demonstration of the Decomposition Problem in a simple, controlled model.

  *   **Week 8: Worked Case - Applying the Analysis:**
      *   Task: Apply the insights from the toy model and conceptual analysis to a more realistic (though still simplified) "worked case" inspired by cortical microcircuits. Trace the consequences of the global-state dependency for defining equivalence at step n and its implications for equivalence at step n+1. Illustrate how the "anchor" problem arises directly from the decomposition issue.
      *   Deliverable: Narrative illustration showing the cascading problem in a quasi-realistic scenario.

  *   **Week 9-10: Synthesis, Conclusion & Implications:**
      *   Task: Synthesize findings. Defend the claim that the GNRA fails at the CFE premise due to the Decomposition Problem. Discuss implications: Does this refute computationalism? (Likely not; it shows *this argument* fails). Does it challenge *any* component-level replacement? What does it say about functionalism? Refine the core claim: GNRA requires an incoherent notion of CFE for complex biological cognition. Outline remaining questions (e.g., implications for digital vs. analogue computation).
      *   Deliverable: Final paper draft for workshop presentation.

  **6. Success & Failure Conditions:**

  *   **Successful Outcome:** A clear demonstration that the GNRA *as standardly formulated* is incoherent because its core premise (non-circular CFE) is impossible to satisfy for the systems it targets (densely recurrent biological brains). The Decomposition Worry is identified as the primary and sufficient flaw. The Limit and Hidden-State worries are shown to be either secondary or distinct issues.
  *   **Partial Success/Clarification:** A rigorous clarification showing precisely *where* and *why* the argument stumbles (e.g., demonstrating the unavoidable global-state reference in CFE), even if the ultimate implications for computationalism remain open, or if the interrelation between the three worries proves more complex. This is still valuable progress.
  *   **Project Failure:** (a) Inability to formally isolate the CFE premise clearly. (b) Failure to convincingly argue the primacy of the Decomposition Worry over the others. (c) Demonstration that a notion of CFE *can* be coherently defined for relevant systems without global-state reference (undermining the hypothesis). (d) The analysis becomes mired in technicalities without yielding clear philosophical insight relevant to the GNRA. (e) Realization that the project scope is larger than anticipated (see below).

  **7. Project Scope Assessment:**  
  This is **firmly a semester-sized project**. Its strength lies in its narrow focus: attacking one specific argument (GNRA) via one specific, under-explored metaphysical worry (Decomposition), using conceptual analysis and formal/modeling techniques appropriate for philosophy. It does not require novel empirical work, a comprehensive literature review (beyond situating the core argument), or resolving the deep metaphysics of consciousness or personal identity. It aims for a precise, critical intervention on a well-defined problem. While the *implications* could be dissertation-worthy (e.g., developing a positive account of implementation in complex systems), this proposal targets a critical, achievable foundation.

  **8. Contribution:**  
  This work promises to reframe critiques of the GNRA, shifting focus from intuition-driven disputes about consciousness or identity to a rigorous analysis of the metaphysics of functional decomposition. It directly addresses the confidence of computationalists (like your ML friend) by exposing a potentially fatal flaw in one of their most compelling thought experiments. For the workshop audience, it provides a self-contained argument grounded in concerns relevant to philosophy of mind (implementation, function, complex systems) and cognitive science (recurrent processing, neural modelling).

  ---

  **Key Strengths of this Framing:**

  1.  **Precise Question:** Centers on the *definability* of component function, yielding a yes/no answer (is it possible without circularity?).
  2.  **Worry Prioritization:** Explicitly argues the Decomposition Worry is primary and potentially sufficient, demoting Limit/Hidden-State.
  3.  **Focused Method:** Uses formal reconstruction, conceptual argument, toy models, and worked cases – all feasible without new empirical work.
  4.  **Clear Success/Failure:** Defines specific outcomes (argument failure at CFE premise, clarification) and failure modes.
  5.  **Audience-Appropriate:** Leverages the audience's understanding of complex systems (cortex, recurrence) without relying on personal identity metaphysics.
  6.  **Scope Justification:** Clearly argues why this critical intervention fits a semester.

  **Next Steps for You:**

  1.  **Integrate Key References:** Slot in essential readings on GNRA (e.g., Parfit, Chalmers, Dennett, Clark), functionalism, complex systems/metaphysics of implementation (e.g., Craver, Bechtel, perhaps Piccinini), and relevant computational models (e.g., CTRNNs).
  2.  **Refine Toy Model:** Decide on the simplest sufficient recurrent model (e.g., a 3-node CTRNN).
  3.  **Develop Worked Case:** Sketch a more detailed neural-inspired example based on cortical microcircuitry principles.
  4.  **Anticipate Objections:** Especially: "Couldn't CFE be defined counterfactually over all *possible* global states?" (Argue this is practically impossible and still relies on a prior decomposition) or "Doesn't this just push the problem to defining 'global state functionally'?" (Concede this is hard, but argue it's the *correct* level for the GNRA to target, not components).
