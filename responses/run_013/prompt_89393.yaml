  Crucially, the Office must never acknowledge paradox. When faced with statements like "This statement is idling", the response should be bureaucratic evasion - declaring it "out of order" or refusing to grade it, while maintaining the system's infallibility. 

  For authenticity, I'll mimic municipal jargon: "Form G-7", "Section 3(b)", "unlicensed grading". The satire sharpens when citizens use the system's own rules to break it, and the Office responds with circular reasoning or silence.

