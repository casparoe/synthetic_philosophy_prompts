  Final touch: The FAQ must itself contain self-referential traps (e.g., claiming to be "grounded" while discussing ungradeable statements). No winking - the comedy is in the earnestness.
answer: |-
  ## Municipal Office of Grounded Statements: Public FAQ (Revision 7.3.1a)

  **1. What is the purpose of the Grading Code?**
  To ensure municipal discourse remains constructive, verifiable, and free from unproductive meta-commentary. Following the Pronouncement Scandals (Ref: Ordinances 87-45C to 87-49F), the Code establishes clear standards for evaluating the epistemic status of official statements, promoting civic trust through semantic hygiene.

  **2. What defines a "Grounded" statement?**
  A Grounded statement is one whose truth or falsity can be ultimately traced, through a finite chain of supporting statements, to direct observations of municipal reality. Examples include "The Elm Street pavement is cracked (Grade 3)," "The Q3 budget allocation for Parks is $125,000 (Grade 2)," or "Precipitation occurred on May 12th (Grade 1)." Grounded statements form the stable foundation of civic knowledge.

  **3. What is an "Idling" statement?**
  An Idling statement is one whose support enters a closed loop, preventing connection to foundational reality. For instance, Statement A declaring "Statement B is Grounded" while Statement B simultaneously declares "Statement A is Grounded" creates an Idling circuit. Such statements lack determinate truth value and are epistemically inert. They are permissible but carry no weight in official reasoning.

  **4. Why can't a statement grade another at its own level?**
  Assigning a grade (Grounded, Idling, or Ungraded) to a peer statement constitutes "Same-Level Grading," which is strictly Out of Order (Code Violation SV-1). This prevents infinite regress and semantic entanglement. To comment on a Grade 1 statement (e.g., "The fountain is operational"), one must issue a Grade 2 statement using Form G-7 ("The Grade 1 statement 'The fountain is operational' is Grounded/Not Grounded"). Comments on Grade 2 statements require Grade 3 statements, and so forth. Levels are non-negotiable.

  **5. How does the Office adjudicate a statement claiming "This statement is Idling"?**
  Such a statement (Citizen Submission CS-4412) presents a procedural anomaly. The Office cannot assign it a grade at its *own* level (Grade X) without committing an SV-1 violation. Attempting to grade it from Grade X+1 ("The Grade X statement 'This statement is Idling' is...") leads to unresolvable logical pathways inconsistent with Code protocols. Therefore, statements directly asserting their own idling status are deemed inherently Out of Order and cannot be formally issued or graded (Regulation R-9 "Self-Referential Grade Assertion"). Citizens are advised against formulating them.

  **6. What about a statement claiming "This statement is not Grounded"?**
  Similar to Question 5, this presents an unresolvable configuration under the Code (Citizen Submission CS-4413). If graded as Grounded, it would be false (since it claims not to be Grounded), violating the Grounded definition. If graded as not Grounded (including Idling or Ungraded), it would be true, suggesting it *should* be Grounded – a contradiction. Assigning Idling is also inconsistent with its content implying non-grounding. Consequently, statements asserting their own non-grounded status are also classified as inherently Out of Order per R-9 and cannot be processed.

  **7. Can the Office grade *its own* rulings?**
  Office rulings, including this FAQ, are issued at Grade 5. Statements *about* the grade of a Grade 5 ruling must originate from Grade 6, using the prescribed Elevated Adjudication Form (EAF-1). The Office does not self-grade. Requests for grading of Office pronouncements must follow the level hierarchy. Attempts to submit Grade 5 statements about Grade 5 statements (e.g., "This FAQ is Idling") are automatically rejected as Out of Order (SV-1). *This statement is issued at Grade 5 and pertains only to procedural clarity.*

  **8. What if a citizen submits two statements: A ("Statement B is Grounded") and B ("Statement A is Idling")?**
  This constitutes a classic Idling Pair (Pattern IP-4). Neither statement connects to municipal reality. Statement A's claim about B depends on B's status, which is defined by B's claim about A, creating a closed loop. Both A and B would be graded as Idling by the Office from the appropriate higher level (Grade Y+1 for Grade Y statements). They are permissible but carry no epistemic value. Citizens are reminded that generating Idling pairs consumes Office resources unnecessarily.

  **9. Are there penalties for issuing Out of Order statements?**
  Knowingly submitting statements classified as inherently Out of Order (e.g., self-grading assertions or same-level grading) or persistently generating demonstrable Idling loops may result in administrative review and potential sanctions under Civic Discourse Regulation 12, including mandatory Semantic Hygiene Workshops. Unintentional violations may be corrected with guidance.

  **10. Is the Office's system itself Grounded?**
  The framework of the Grading Code, including the definitions of Grounded, Idling, and Out of Order, constitutes the operational foundation (Grade 0 - Meta-Framework). Grade 0 elements are not subject to grading *within* the system they define, as per Code Axiom 1. Questions regarding the framework's validity fall outside the Office's mandated purview and should be directed to the Bureau of Foundational Ordinances. *This Office operates strictly within the established Code, ensuring all *applicable* pronouncements are properly Grounded.* The statement "The Grading Code framework is effective" is issued at Grade 5 and is Grounded by its consistent application to municipal reality.
