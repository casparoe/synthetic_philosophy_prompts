prompt: |-
  I'm a novelist at work on a book about a colonist who must decide what he owes to the people he has been taught to call savages, and I have been rereading Robinson Crusoe as a model. Give me a reading of the novel through Montaigne's essay on the cannibals and the cultural relativism usually attributed to it. I am most interested in Crusoe's long deliberation over whether he may slaughter the cannibals he discovers, and in how that deliberation resolves once Friday is in his power: does Defoe stage a genuinely Montaignean suspension of judgment, or does the novel quietly keep Crusoe's own customs as the measure while only softening the cruelty? Be honest about where the book resists the reading. Note that Montaigne's relativism is often flattened into the doctrine that no custom may be judged, whereas his own essay plainly does judge European cruelty — I want to know whether Crusoe's arc tracks that narrower, ethnocentric critique or something else, and what the novel adds to the philosophical debate that Montaigne's essay alone does not. Work from plot and scene rather than quotation. Lead with your central claim in one sentence, then give the reasoning.
