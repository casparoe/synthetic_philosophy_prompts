answer: |-
  ### Grading Rubric Brainstorm  
  **Strong answer must include:**  
  (a) **Core disagreement:** Kripke’s *transworld identity* (Humphrey exists in multiple worlds, identity is necessary) vs. Lewis’s *counterpart theory* (no object in >1 world, counterparts handle modality via similarity). **Humphrey application:** Kripke—Humphrey *himself* wins in another world; Lewis—a *counterpart* wins. Must mention Lewis’s *accidental intrinsics problem* as motivation.  
  (b) **Humphrey objection:** Kripke’s charge that counterpart theory "changes the subject" (modal claims are *about Humphrey*, not a counterpart). Work: Exposes semantic inadequacy—de re modality requires *same object*.  
  (c) **Lewis’s reply:** Objection *begs the question* (assumes transworld identity). **Evaluation:** Should note strengths (avoids inconsistency) and weaknesses (vagueness of similarity, intuitive force of Kripke’s worry).  

  **Common failure modes:**  
  - Conflating Lewis’s *modal realism* (worlds as concrete) with *counterpart theory* (semantic tool).  
  - Misstating accidental intrinsics (e.g., "properties conflict" without specifying *incompatible intrinsics*).  
  - Oversimplifying Humphrey objection as "counterparts aren’t identical" without framing it as *semantic misdirection*.  
  - Ignoring that Lewis’s reply shifts epistemic burden (similarity ≠ identity).  

  ---

  ### Student Feedback  
  **Grade: 9.5/10**  

  #### Comments (Part-by-Part Justification):  
  **(a) Disagreement & Humphrey case (4/4 points)**  
  ✅ **Strengths:**  
  - Perfectly distinguishes transworld identity (Kripke) from counterpart theory (Lewis), citing *accidental intrinsics* as Lewis’s motivation.  
  - Correctly applies both to Humphrey: Kripke’s Humphrey *himself* wins in another world vs. Lewis’s *counterpart* winning.  
  - Explicitly notes Lewis’s *modal realism* as grounding counterpart theory—a subtle point many miss.  
  ❗ **Minor refinement:** When noting Kripke’s need for an "account of essence," clarify that this arises from *essential properties constraining transworld identity* (not just modality broadly). Your phrasing slightly underplays this link, but the core is accurate.  

  **(b) Humphrey objection & its work (2.5/3 points)**  
  ✅ **Strengths:**  
  - Clearly states Kripke’s "changes the subject" objection: We intend to talk *about Humphrey*, but counterpart theory redirects to another entity.  
  - Correctly identifies the objection’s purpose: To show counterpart theory fails as a *semantic analysis* of de re modality.  
  ❗ **Subtle gap:** The objection’s force hinges on *de re aboutness*—the intuition that "Humphrey could have won" is *directly about Humphrey*. You capture this but could emphasize how this targets Lewis’s *semantic adequacy* (not just metaphysics).  

  **(c) Lewis’s reply & evaluation (3/3 points)**  
  ✅ **Strengths:**  
  - Accurately reconstructs Lewis’s "begging the question" reply: Objection assumes transworld identity, which Lewis rejects.  
  - Excellent critical insight: Notes the "mysterious" vagueness of counterpart similarity (weightings, respects)—a grad-level observation.  
  - Balanced evaluation: Acknowledges reply’s strength (internal consistency) while pressure-testing its weakness (similarity metric).  
  ❗ **Nitpick:** You might add that Lewis *embraces* context-sensitivity of similarity (it’s interest-relative), which softens the "mysterious" charge. But your critique is valid.  

  #### Overall  
  **Why 9.5/10?**  
  - **Exceptional clarity** on complex concepts (accidental intrinsics, essence, modal realism).  
  - **Zero major errors** (avoids all common pitfalls: no conflation of realism/counterparts, no misstatement of objection).  
  - **Sophisticated analysis** in (c) exceeds expectations for mid-level undergrad.  
  - **Deduction:** -0.5 for minor phrasing gaps in (b) and essence link in (a), but these don’t undermine the argument.  
  **Praise:** You grasp Lewis’s structural reply to Kripke better than many grad students—especially noting how similarity’s vagueness lingers as a problem. Excellent work.  

  ---  
  **TA Note:** Copy the **Grade (9.5/10)** and **Comments** sections directly to the feedback sheet. This student deserves top marks with light refinement prompts.
