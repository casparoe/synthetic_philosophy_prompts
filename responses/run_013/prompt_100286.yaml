answer: |-
  ### Ranking of Criteria from Most to Least Defensible as the Single Primary Criterion

  The boundary problem—determining who constitutes the demos for authorizing collective decisions—requires a criterion that balances normative principles (e.g., fairness, legitimacy, inclusivity) with practical feasibility. Below, I rank the five criteria from most to least defensible when used as the sole primary basis for defining the demos, with a brief justification for each placement. The evaluation considers coherence, stability, inclusivity, avoidance of arbitrariness, and alignment with democratic values. After the ranking, I address potential combinations without incoherence.

  #### Ranked List from Most to Least Defensible:

  1.  **(a) Subjection: all and only those whose life-prospects are materially constrained by the polity's enforceable rules belong.**  
      **Justification for Placement (Most Defensible):** This criterion is the most defensible as it directly embodies the "all-affected principle," a cornerstone of democratic theory. It ensures that those who are governed by the polity's rules have a voice in their creation, promoting fairness, accountability, and legitimacy. By focusing on material constraints to life prospects (e.g., laws affecting rights, resources, or opportunities), it provides a relatively objective, stable, and inclusive basis for membership that can be operationalized through residency or legal jurisdiction. It avoids the circularity, vagueness, or exclusion risks of other criteria, making it a robust standalone primary criterion.

  2.  **(d) Exit cost: those for whom leaving the polity would be practically impossible are members, while those who could leave cheaply are not.**  
      **Justification for Placement:** This is the second most defensible, as it prioritizes the inclusion of vulnerable individuals who are de facto subject to the polity's power due to high barriers (e.g., economic, geographic, or social constraints). It aligns with protective justice by ensuring that those unable to avoid the polity's influence have a say, reducing potential coercion. However, it is less comprehensive than subjection, as it may exclude affected individuals who could leave but choose to stay (e.g., voluntary residents), and it can be difficult to measure "practical impossibility" objectively. It also risks manipulation if exit costs are artificially increased.

  3.  **(e) Contribution: membership follows those whose ongoing participation is causally necessary for the polity to function, for instance by supplying labour or revenue it cannot replace.**  
      **Justification for Placement:** This criterion has merit in promoting reciprocity and functionality, as it ties membership to those whose efforts sustain the polity (e.g., essential workers or taxpayers), potentially enhancing stability and efficiency. However, it ranks third due to significant normative flaws: it risks excluding affected groups who do not contribute directly (e.g., children, the elderly, or the disabled) and may reduce democracy to a transactional system, undermining equal moral standing. It also faces practical challenges in defining "causally necessary" and could incentivize exclusionary policies.

  4.  **(b) Stakes: inclusion is owed to anyone for whom the decision's worst outcome would be catastrophic rather than merely inconvenient, irrespective of residence.**  
      **Justification for Placement:** While morally compelling in prioritizing the prevention of severe harm (e.g., life-threatening outcomes), this criterion is poorly suited as a primary basis for a standing demos. It is decision-specific, leading to a fluid and unpredictable demos that changes with each collective decision, which is impractical for constitutional stability. It could also overextend inclusion (e.g., including distant non-residents affected by policies) or underinclude those facing non-catastrophic but significant burdens, creating administrative chaos and potential for inconsistent application.

  5.  **(c) Recursive authorisation: the demos comprises whoever would be entitled to vote on whether to extend membership, so that the body is settled by the very body it defines.**  
      **Justification for Placement (Least Defensible):** This criterion is the least defensible due to its inherent circularity and bootstrapping problem. It offers no independent basis for the initial demos, risking arbitrary exclusion (e.g., a founding group may never vote to expand membership) and undermining democratic legitimacy from the outset. While theoretically elegant in allowing self-definition, it is practically unworkable, as it provides no guidance for constitutional founding and may entrench power imbalances. It also fails to guarantee inclusion of affected or vulnerable individuals, making it normatively weak.

  #### Combination of Criteria Without Incoherence

  Some pairs of criteria can be combined without logical incoherence, meaning they do not inherently conflict and could theoretically work together to define a more nuanced demos. However, since the task requires evaluating each as the single primary criterion, combination is only considered where explicitly noted. Based on the criteria:

  -   **(a) Subjection and (d) Exit cost can be combined without incoherence.** Both focus on individuals' relationship to the polity's power—subjection through material constraints, and exit cost through immobility—and they share a normative emphasis on protecting the governed. Combining them could yield a demos defined as those who are both affected by rules and unable to escape, strengthening inclusivity for the vulnerable without contradiction (e.g., a person constrained by rules and unable to leave clearly belongs; one lacking either might be excluded, but this is not logically inconsistent).
      
  -   **(a) Subjection and (e) Contribution can also be combined without incoherence.** Subjection ensures inclusion based on impact, while contribution adds a functional element based on necessity. There is no inherent conflict, as one could define membership for those affected and essential (e.g., residents who work and pay taxes), though this might narrow the demos compared to subjection alone without creating a contradiction.
      
  -   **Other pairs are less suitable for combination without incoherence or practical issues.** For example:
      -   Combining (b) Stakes with any standing criterion (e.g., subjection) might lead to incoherence, as stakes is decision-specific while others define a fixed demos.
      -   Combining (c) Recursive authorisation with others could create contradictions; e.g., if the recursive group does not align with subjection or contribution, it might exclude those who should be included under those criteria.
      -   (d) Exit cost and (e) Contribution could be combined (e.g., those who cannot leave and are necessary), but it risks double exclusion (e.g., omitting those who can leave but contribute or those who cannot leave but aren't essential), which may not be incoherent but could be normatively problematic.

  In summary, (a) Subjection is the strongest standalone criterion due to its balance of principle and practicality. Pairs involving subjection with exit cost or contribution can be coherently combined, but no combination is required unless specified in the constitution.
