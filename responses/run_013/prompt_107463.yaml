prompt: |-
  A friend of mine is really into metaontology and she's got this two-part picture of verbal disputes that she keeps trying to sell me on. Her line is that when people argue about whether something "really" counts as X — a disease, a planet, a sandwich, a person — alot of the disagreement is verbal in the boring sense: swap the disputed word for two sharper words and the fight dissolves, because they were just talking past each other. Thats the shallow kind. The deep kind is the one she actually cares about: you do the disambiguating, both sides now agree about all the facts, and they still disagree about which of the sharper words the original word should be made to mean from now on. She thinks the deep ones aren't disagreements about the world at all, they're fights over which vocabulary we should adopt, and they get settled (if they get settled) by appeal to what we want, not by discovering anything new. She also admits you usually can't tell which kind you're in until you've already done the disambiguating, which can take years.

  Suppose she's basically right. What are the most important implications of this picture for a committee that has to actually draw a line and publish it — say the people who decide what goes in the DSM, or the ones who demoted Pluto? Not the obvious stuff like "define your terms." I mean what does it change about how they should argue, what evidence is even relevant to their decision, and how they should treat the people who lose the vote?
reasoning: |-
  Okay, the user is asking about the implications of their friend's metaontology theory for committees that have to draw definitional boundaries. The friend distinguishes between shallow verbal disputes (resolved by disambiguation) and deep ones where even after clarifying terms, people still disagree about which concept the original word should map to. The deep disputes are about choosing vocabularies based on interests, not discovering facts.

  First, I need to unpack the core theory. The key points are: after disambiguation, factual agreement exists, but disagreement persists over which precise term should anchor the original word. This choice isn't about truth but about practical goals—what we want the concept to do for us. 

  Now, the user wants implications for real-world committees like the DSM panel or IAU (Pluto case). They explicitly exclude obvious advice like "define terms," so I need deeper operational implications. The committees publish authoritative classifications affecting science, policy, and society.

  The user's explicit request is about argument strategies, relevant evidence, and handling dissent. But their deeper need might be understanding how to navigate value-based conflicts masked as factual debates. They might also want practical frameworks for committees facing backlash after decisions like Pluto's demotion.

  I recall the Pluto example. The IAU redefined "planet," excluding Pluto based on criteria like orbital dominance. The debate wasn't about facts (everyone agreed Pluto didn't clear its orbit) but whether that criterion was important. That's a deep dispute: some wanted "planet" to include smaller bodies for historical reasons; others prioritized dynamical dominance for scientific utility. The committee's choice reflected values—promoting a specific astronomical taxonomy over tradition.

  For the DSM, debates over conditions like autism spectrum disorder involve similar dynamics. After scientific clarifications, disagreements persist about where to set thresholds, balancing clinical utility, social impact, and resource allocation. The decision isn't purely medical but involves stakeholders' values.

  Key implications for committees:

  1. **Process Design**: Committees must explicitly separate factual consensus from preference discussions. Facilitators should force clarity: "Do we agree on facts? If yes, this is now a values discussion." Structured methods like multi-criteria decision analysis could help evaluate options against agreed-upon goals.

  2. **Evidence Relevance**: Scientific evidence resolves shallow disputes but becomes irrelevant in deep ones. Committees should prioritize evidence about consequences of definitions (e.g., how a DSM change affects diagnosis rates or treatment access) and stakeholder impacts (e.g., Pluto's demotion affecting public engagement). Surveys on preferences might be valid evidence here.

  3. **Argument Norms**: Debates should shift from "what is true?" to "what do we want this concept to achieve?" Arguments like "This definition better serves research" or "This reduces stigma" become primary. Leaders must redirect fact-focused debaters to value-based reasoning.

  4. **Handling Dissent**: Since deep disputes aren't resolvable by truth, dissenters aren't factually wrong but preference-outvoted. Acknowledging this reduces hostility. Transparency about the value-based rationale (e.g., "We prioritized orbital mechanics for consistency in solar system studies") legitimizes decisions without claiming absolute correctness.

  5. **Decision Reversibility**: Precedents should be provisional. If new goals emerge (e.g., public sentiment shifts after Pluto's demotion), re-evaluation is sensible. Committees might specify review triggers (e.g., new data on definitional consequences).

  The user might also care about power dynamics. Committees with authority can impose preferences, so inclusive stakeholder processes (e.g., involving patients for DSM) become crucial to ensure fairness. 

  Underlying all this is a meta-implication: committees are engaged in pragmatic concept-building, not discovering pre-existing categories. Embracing this reduces illusion of absolute correctness and fosters adaptive governance.
answer: |-
  Based on your friend's framework (which is a compelling application of Carnap-style "explication" and Chalmers' "verbal disputes"), committees tasked with drawing definitional boundaries face profound shifts in their approach once they recognize they might be in a **deep verbal dispute**. Here are the key implications, moving beyond mere "define your terms":

  ### 1. **Radically Shift the Focus of Debate: From "What Is" to "What Do We Want?"**
     - **OBSOLETE:** Arguing about the "true nature" of X (e.g., "Is addiction *really* a brain disease?" or "Is Pluto *objectively* a planet?").  
     - **NEW FOCUS:** Deliberate explicitly on **pragmatic goals and consequences**. The committee must ask:  
       - *"What practical problems are we solving with this definition?"* (e.g., Improve research coherence? Allocate medical resources? Simplify public education?)  
       - *"What values are we prioritizing?"* (e.g., Scientific utility vs. cultural continuity; clinical treatment access vs. diagnostic precision; inclusivity vs. distinctiveness).  
     - **Action:** Facilitators should enforce this shift: "We agree on the facts about Pluto's orbit/climate patterns/neurobiology—now let's debate which choice best serves our stated goals."

  ### 2. **Evidence Becomes Consequentialist, Not Descriptive**
     - **IRRELEVANT:** "Traditional" or "original meaning" arguments (e.g., "Pluto was called a planet for 70 years," "Addiction was always seen as moral failing").  
     - **IRRELEVANT:** Purely conceptual analysis (e.g., "A planet *must* be spherical by its essence").  
     - **RELEVANT:** **Empirical evidence about outcomes**, such as:  
       - *Impact studies*: How will changing the DSM criteria affect diagnosis rates, treatment eligibility, or insurance coverage?  
       - *Stakeholder effects*: Will demoting Pluto damage public engagement with astronomy? Will broadening "autism spectrum" increase support services or dilute them?  
       - *Systemic coherence*: Does this definition align with adjacent classifications (e.g., will a new "planet" definition mesh with exoplanet research)?  
     - **Action:** Commission studies on real-world impacts *before* voting. Treat stakeholder surveys (patients, educators, scientists) as core evidence.

  ### 3. **Admit the Decision is Provisional & Interest-Relative**
     - **Implication:** No definition is "discovered" or eternally valid. It's a **practical tool** tied to current goals.  
     - **Action:**  
       - **Explicitly state the goals** driving the decision (e.g., "This definition prioritizes research reproducibility over clinical accessibility").  
       - **Build in review mechanisms**: "This classification will be revisited in 5 years or if new data on societal impact emerges."  
       - **Avoid "final truth" language**: Say "We adopt this usage for purpose P" instead of "Pluto is *not a planet*."

  ### 4. **Treat Dissenters as Having Legitimate Preferences, Not False Beliefs**
     - **Why?** The "losers" aren't factually wrong—they just prioritize different values (e.g., tradition, inclusivity, or simplicity).  
     - **Action:**  
       - **Acknowledge their values**: "We recognize Dr. X prefers broader criteria to reduce stigma, but the majority prioritized diagnostic precision for targeted treatment."  
       - **Incorporate minority views**: Publish dissenting opinions alongside the decision, specifying the values they represent.  
       - **Avoid pathologizing dissent**: Don't frame opponents as "ignorant" or "stubborn"—they lost a vote about preferences, not truth.

  ### 5. **Structure Deliberations to Force Disambiguation Early**
     - **The Trap:** Committees often debate for years without realizing they’re in a deep dispute.  
     - **Action:**  
       - **Stage 1:** *Mandate disambiguation*. Map all competing definitions (e.g., "Planet-as-rounded-body" vs. "Planet-as-orbital-dominator").  
       - **Stage 2:** *Confirm factual agreement*. "Do we all agree on Pluto's orbital interactions? Yes? Then this isn’t about astronomy."  
       - **Stage 3:** *Deliberate on goals*. "Given the facts, which definition best advances planetary science education?"  
     - **Tool:** Use "scenario testing"—e.g., "If we adopt Definition A, how does it affect future taxonomy in 2030?"

  ### 6. **Accept that "Settling" the Dispute is Political, Not Epistemic**
     - **Implication:** Resolutions come from **negotiation, voting, or authority**—not evidence alone.  
     - **Action:**  
       - **Embrace transparent voting**: Record how members weigh competing values.  
       - **Seek balanced representation**: Ensure committees include diverse stakeholders (e.g., clinicians *and* patients for DSM, astronomers *and* educators for IAU).  
       - **Plan for implementation**: Anticipate backlash by preparing explanatory materials that emphasize the *purpose* of the change (e.g., "Why redefining planets improves solar system science").

  ### Real-World Examples
  - **Pluto's demotion**: The IAU committee *implicitly* treated it as a deep dispute. They prioritized "orbital dominance" for scientific utility (clearing debris = key dynamic trait), over tradition/public attachment. Critics valued "roundness" for simplicity. The failure was not *explicitly* admitting this was a values choice, fueling backlash.  
  - **DSM revisions**: Debates over "is autism a spectrum?" often mask deep disputes. Should the definition prioritize research (narrow criteria) or access to services (broader criteria)? The committee’s choice here is pragmatic, not ontological.

  ### In Short
  Committees should act as **practical architects of language**, not discoverers of metaphysical truth. Their task shifts from *fact-finding* to *goal-driven design*, demanding transparency about values, evidence of consequences, and humility in authority. This doesn't make decisions easier—but it makes them more honest, defensible, and adaptable.
