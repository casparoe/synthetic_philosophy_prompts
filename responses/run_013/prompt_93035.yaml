prompt: |-
  Long-ish question, hope thats ok.

  I read a fair bit of philosophy blogs and I keep running into an argument that I can't tell whether it's one argument or three, and I'd like to know if it has a name.

  Here's the move. Somebody wants to justify a rule for distributing something — money, medical care, exposure to risk, whatever. They say: pick the rule you'd choose if you didn't know which of the affected people you were going to turn out to be, and treated each of them as equally likely. Then they show that the rule maximizing your expected wellbeing from behind that ignorance is the one that maximizes the sum of everyone's wellbeing. Conclusion: add up everyone's wellbeing and take the policy with the biggest total. I've seen this used for tax rates, for who gets a scarce drug, and — the one that got me thinking — for a proposal to site a hazardous facility by lottery, on the grounds that since everyone had the same chance of being picked to host it, the result was fair whoever ended up with it.

  Two things bother me.

  First, it seems to prove more than people want it to. If I really am equally likely to be any of the affected people, then I should be indifferent between everyone getting a modest share and a lottery where one person gets a fortune and the rest get nothing, as long as the expected amount comes out the same. Nobody believes those are equally good. The person who draws the short straw has a real complaint, and telling them the draw was fair doesn't seem to answer it. The argument seems to make equal chances and equal outcomes interchangeable, and I don't think they are.

  Second, it seems to prove something about a single person that we wouldn't accept either. As one person facing a 50/50 gamble, fine, maybe I should maximize expected value. But the argument treats the whole group as if it were one person facing a gamble over which body they wake up in. That's either just a way of talking or it's smuggling something in, and I can't tell wether it's the latter.

  And a third, smaller worry: the conclusion depends on there being a fact about how much better off one person is than another that doesn't depend on who they are or on any arbitrary choice of scale. If you rescaled one person's wellbeing differently, the sum would rank the policies differently. I can't tell if that's a real objection or just the usual grumbling about measurement.

  So: does this have a name? Is there a name for the formal result and a different name for the informal version people actually argue? What are the nearest established ideas — I assume this is somewhere near the Rawlsian buisness of choosing principles without knowing your place in society, but I don't know how the two relate — and which one fits best? Please don't just hand me a label. What I'm after is the carving: which steps of the informal argument are licensed and which are doing extra work, and whether what I'm calling one thing is actually two or three things people keep running together.

  You're a philosopher who works on decision theory and social choice. Before you answer, brainstorm: write out the informal argument as numbered steps, and note at each step what it assumes. Then give me the answer.
reasoning: |-
  Okay, let me start by unpacking the user's question. They're encountering this argument in philosophy blogs about distributive justice using a thought experiment where you choose rules from behind a veil of ignorance. The argument claims that maximizing expected wellbeing under equal probability leads to utilitarianism. The user has three main concerns: it proves too much by equating equal chances with equal outcomes, it treats the group as a single entity, and there's a measurement problem with interpersonal wellbeing comparisons.

  First, I need to identify the core argument. The user mentions Rawls, so I should contrast this with the difference principle. The key here is the veil of ignorance but with expected utility instead of maximin. The user is confused whether this is one argument or several bundled together. They want to know the name and the underlying assumptions.

  The user's first worry is about indifference between equal shares and lotteries. That points to risk neutrality in expected utility. In Harsanyi's model, if individuals are risk-averse, the sum maximization might not hold. But the baseline argument assumes linear utility, leading to utilitarianism. The user’s example of a lottery vs. equal distribution highlights that under risk neutrality, they're equivalent, but intuitively, they're not. That suggests the argument assumes risk neutrality, which might not be realistic.

  The second issue is treating the group as a single person. This is the aggregation step. Harsanyi uses the veil of ignorance to aggregate individual utilities into a social welfare function. But the user questions whether this is valid. They're pointing out that individual identity matters, and merging them into one decision-maker might ignore separateness of persons. That's a Rawlsian critique. So here, the assumption is that society can be modeled as an individual choice under uncertainty, which conflates individual and social rationality.

  The third point is about interpersonal utility comparisons. If wellbeing isn't cardinally measurable and comparable across people, summing utilities doesn't make sense. The user mentions rescaling, which touches on affine transformations in utility theory. Harsanyi assumes von Neumann-Morgenstern utilities, which are unique up to positive affine transformations, so ratios or differences can't be compared without normalization. But for summing, you need a common scale, which requires interpersonal comparability. The argument assumes this is possible, but in practice, it's problematic.

  Now, brainstorming the steps. The informal argument has five steps: decision under ignorance, equal probability, expected utility maximization, aggregation to sum, and policy conclusion. Each step has assumptions. Step 1 assumes the veil of ignorance is valid for impartial choice. Step 2 assumes symmetric uncertainty—no reason to assign different probabilities. Step 3 assumes EU theory applies and that the chooser is risk-neutral. Step 4 requires additive separability and cardinal unit comparability. Step 5 is the utilitarian prescription.

  The user wants to know the names. Harsanyi's Utilitarian Theorem is central. Variants include ex ante prioritarianism. The formal result relies on EU axioms and full comparability. The informal version often skips these assumptions. The user might be conflating Harsanyi with Rawls, but Rawls rejects expected utility for maximin. 

  The user’s deeper needs: they’re encountering this argument in blogs and want to critically engage with it. They need clarity on the structure to identify weak points. They might be preparing for a discussion or writing something. Their confusion about one vs. three arguments suggests they want to disentangle the components to address each objection separately. 

  So, in response, I should present the steps, name the theorem, explain the assumptions, and address each worry by pointing out which assumption it challenges. The lottery example challenges risk neutrality. The single-person analogy challenges aggregation. Measurement challenges comparability. This way, the user can see which parts of the argument are robust and which are contentious.
answer: |-
  Your analysis is spot-on—this is a rich and contentious area where formal results often get stretched beyond their valid scope. Below, I'll break down the argument, name its components, and address your concerns by identifying where assumptions creep in. The core idea is **Harsanyi's Utilitarian Theorem**, but its application to fairness is where things get messy.

  ### Brainstorm: The Informal Argument & Its Assumptions
  1.  **"Pick the rule you'd choose if you didn't know which person you'd be."**
      *   *Assumes*: The veil of ignorance (VoI) is the correct device for impartially selecting *fair* principles/rules (shared with Rawls).
  2.  **"Treat each possible identity as equally likely."**
      *   *Assumes*: You have no information giving you reason to assign unequal probabilities. Also implies *symmetry* between individuals.
  3.  **"Maximize your expected wellbeing under this ignorance."**
      *   *Assumes*: Standard Expected Utility (EU) theory applies. Crucially, it assumes the chooser is **risk-neutral with respect to wellbeing (utility)**. Your wellbeing function must represent your attitude towards risk over outcomes *for yourself*.
  4.  **"This rule maximizes the sum of everyone's wellbeing."**
      *   *Assumes*: Wellbeing (utility) is **cardinal and interpersonally comparable at the unit level** (cardinal unit comparability). It also assumes wellbeing functions are **additively separable** across individuals. (This step is Harsanyi's theorem).
  5.  **Conclusion: "Therefore, the fair/just rule is the one that maximizes the sum of wellbeing (utilitarianism)."**
      *   *Assumes*: The rule derived from the VoI+EU setup *is* the definition of fairness/justice (a normative leap beyond the formal theorem).

  ### The Name(s) and the Carving
  *   **The Formal Result: Harsanyi's Aggregation Theorem / Utilitarian Theorem.**
      *   **What it strictly says:** If:
          (a) Individual preferences satisfy the axioms of Expected Utility (EU) theory (completeness, transitivity, continuity, independence),
          (b) The "impartial observer" behind the VoI also satisfies EU axioms,
          (c) The impartial observer is indifferent between prospects where everyone gets outcome X vs. everyone gets outcome Y only if all individuals are indifferent, and prefers prospects where everyone gets X to everyone gets Y only if all individuals prefer X to Y (Pareto Indifference/Optimality), and
          (d) Individual utilities are cardinal and interpersonally comparable on a common scale (specifically, unique up to positive affine transformations with the *same* zero and unit),
      *   **Then:** The impartial observer's utility function *must* be a weighted sum of individual utilities. Under the "equal probability" assumption (symmetry), it *must* be the simple sum (unweighted average) of individual utilities. Maximizing the observer's expected utility *is* maximizing the sum of individual utilities.
      *   **Status:** A significant mathematical theorem within social choice theory and welfare economics. It shows a logical link between individual EU rationality, Pareto efficiency, impartiality (via VoI), and additive aggregation.

  *   **The Informal Move / Rhetorical Device: The Impartial Observer Thought Experiment / Utilitarian Justification via VoI.**
      *   This is where the argument you encounter in blogs lives. It *uses* Harsanyi's theorem but often glosses over its demanding assumptions and makes the normative leap from "this maximizes expected utility behind the VoI" to "this is fair/just".

  ### Addressing Your Worries (The Carving)
  1.  **"It proves too much (Lottery vs. Equal Shares):"**
      *   **The Crucial Assumption:** Step 3 (Risk Neutrality). Harsanyi's theorem assumes the chooser uses EU *and* is risk-neutral in wellbeing (utility).
      *   **Why it bites:** If your utility function is linear in wellbeing (e.g., money), then yes, a 1/N chance of N*X is equal in EU to a certainty of X. If utility exhibits diminishing marginal returns (risk aversion), then EU would favor the equal distribution over the lottery. The informal argument often *implicitly assumes risk neutrality* for the chooser. This is frequently unrealistic and unpopular because people *are* typically risk-averse over significant goods like money or health. Your objection highlights that the argument only forces indifference if risk neutrality is assumed.
      *   **The Step Doing Extra Work:** Step 5. The formal theorem (Step 4) simply says maximizing the sum is equivalent to maximizing the observer's EU under these assumptions. It's the *normative interpretation* (Step 5) that claims this indifference is "fair". Critics (like Rawls) argue risk aversion behind the VoI is rational, leading to maximin, not sum-max.

  2.  **"Treats the group as one person:"**
      *   **The Crucial Assumption:** Step 1 (VoI as the *definition* of impartiality/fairness) and the *structure* of Step 4 (Additive Separability).
      *   **Why it bites:** This is the core Rawlsian/Senian critique: **"The Separateness of Persons"**.
          *   The VoI+EU setup models social choice as an *individual* decision under *risk* (uncertainty about your own identity). However, distributing goods across different people is fundamentally different from one person facing risks over time. Sacrificing one person for the greater good of others isn't the same as one person risking a loss for a potential gain. The additive aggregation (Step 4) inherently treats individuals as vessels for utility that can be summed, potentially justifying severe losses for some if gains to others are large enough. This ignores the distinct moral claims of each individual. The "single person" analogy isn't just talk; it's baked into the mathematical structure of the aggregation. Step 5 (the normative leap) directly depends on accepting this model of fairness.
      *   **The Step Doing Extra Work:** Step 1 and Step 5. The formal theorem (Step 4) is a mathematical consequence of the axioms. The objection is that those axioms, particularly modeling social choice as an individual choice under risk (Step 1) and accepting additive aggregation as justice (Step 5), are morally inappropriate for interpersonal distribution. Rawls explicitly rejects the VoI+EU approach for this reason, favoring the maximin rule under the VoI.

  3.  **"Depends on Interpersonal Comparisons / Scaling:"**
      *   **The Crucial Assumption:** Step 4 (Cardinal Unit Comparability).
      *   **Why it bites:** This is a fundamental, unavoidable technical requirement of Harsanyi's theorem. EU theory gives us utility functions unique only up to positive affine transformations (U'(i) = a_i * U(i) + b_i, with a_i > 0). For the sum ΣU(i) to be meaningful, we need to fix both the *unit* (the a_i) and the *zero point* (the b_i) across individuals. If we can arbitrarily rescale or shift individual utilities, the sum changes, and the utilitarian ranking changes. The theorem *requires* that we have found the "correct" cardinal scale where ratios of utility differences (U(i)_X - U(i)_Y) / (U(j)_A - U(j)_B) are meaningful and comparable across i and j.
      *   **Is it just grumbling?** Absolutely not. It's the most common and powerful *technical* objection. Proponents argue we *can* make meaningful interpersonal comparisons (e.g., "Person A gains more from $100 than Person B loses"). Critics argue such comparisons are deeply problematic, subjective, or even impossible. The argument presupposes this problem is solved. If it isn't, the sum is meaningless. This is distinct from your other worries but interacts with them (e.g., risk aversion affects the shape of the utility function used in comparisons).

  ### Relation to Rawls
  *   **Shared:** Use of the Veil of Ignorance (Step 1) as a device for impartiality.
  *   **Key Difference:** Rawls fundamentally rejects Steps 2, 3, and 4 for selecting principles of justice.
      *   He argues the VoI should model radical uncertainty (not quantifiable risk), making the "equal probability" assumption (Step 2) unjustified.
      *   He rejects EU maximization (Step 3) behind the VoI, arguing rational agents would be extremely risk-averse regarding their life prospects (leading to the Maximin rule - maximize the position of the worst-off).
      *   He explicitly attacks the additive aggregation (Step 4) and the underlying assumptions of cardinal comparability, based on the Separateness of Persons argument (your Worry 2). Rawls's Difference Principle is a direct alternative to the sum-maximizing conclusion (Step 5).

  ### In Summary: What You're Encountering
  *   **The Core Formal Result:** Harsanyi's Utilitarian Theorem (Steps 1-4, strictly interpreted with all assumptions).
  *   **The Rhetorical Move:** Using Harsanyi's Theorem + the Veil of Ignorance to argue for Utilitarianism as the definition of fairness (Step 5).
  *   **Your "One Argument or Three?":** It's one core argument (VoI -> Expected Utility -> Sum Maximization), but your three worries target three distinct, critical, and often glossed-over assumptions *within* that argument:
      1.  **The Lottery vs. Equal Shares Worry:** Targets the implicit **Risk Neutrality** assumption in Step 3.
      2.  **The Single Person/Separateness Worry:** Targets the fundamental normative acceptability of modeling social justice as **Individual Choice under Risk** (Step 1) and the resulting **Additive Aggregation** (Step 4/5).
      3.  **The Scaling Worry:** Targets the **Cardinal Unit Interpersonal Comparability** assumption required for Step 4.
  *   **Established Ideas Nearby:** Harsanyi's Utilitarian Theorem, Impartial Observer Theorem, Veil of Ignorance arguments, Utilitarianism, Critiques based on Separateness of Persons (Rawls, Nozick), Critiques based on Interpersonal Comparability (Robbins, Sen), Ex Ante Prioritarianism (modifies Step 3 to incorporate risk aversion).

  The power of the argument lies in its rigorous *formalism* under strict assumptions. Its weakness in practical/philosophical debate lies in the *normative leap* (Step 5) and the fact that those strict assumptions (risk neutrality, separability, comparability) are highly contestable and often unrealistic for the problems to which the argument is applied. Your instincts about the extra work being done are correct.
