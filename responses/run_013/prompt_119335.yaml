  For partial credit, clarify what's missing. Common mistakes: conflating assumption types, not addressing the shift in purpose, missing why independence is central to the intervention.

  A/B line: A B answer hits the five points. An A answer connects to broader philosophy (e.g., purpose-relativity of models) or discusses hidden risks like distributional shift.

  Sophisticated-but-wrong answer: Claiming the model is valid because accuracy is high, ignoring that interventions change the system. This fails because it doesn't account for the purpose shift and the assumption being key to the causal mechanism.

