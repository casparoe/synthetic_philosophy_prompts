answer: |-
  Here's a complete exam package tailored to your constraints and goals. The question forces engagement beyond slogans by centering on the purpose shift (prediction → intervention) and the *specific* way the assumption interacts with the intervention's mechanism.

  ---

  ### 1. Exam Question (145 words)
  > A hospital analytics team develops a highly accurate predictive model for 30-day patient readmission risk. A core assumption is that patients' outcomes are *statistically independent* – no contagion, staffing, or crowding effects link one patient's outcome to another. The team acknowledges this assumption is unrealistic but defends it, arguing that only the model's out-of-sample predictive accuracy matters.  
  >  
  > The team now proposes using this same model to evaluate a new intervention: funding discharge coordinators on two wards. This intervention aims to *reduce readmissions by improving care coordination between patients and staff* on those wards. A skeptical clinician argues: "Your model ignores the very ward-level effects this intervention targets. Good predictions don’t justify using it *for this decision*."  
  >  
  > **Analyze this disagreement.** Explain:  
  > (a) Why the independence assumption’s "unrealism" poses a fundamentally different problem here than for pure prediction.  
  > (b) Whether, and why, the team’s "accuracy is sufficient" defense fails *in this specific context*.  
  > (c) What *better justification* (beyond accuracy) the team could offer for using their model here, or what they should do instead.

  ---

  ### 2. Model Answer (620 words)  
  The disagreement highlights how model assumptions and validation depend critically on the *purpose* for which the model is used.  

  **(a) The nature of the problem shifts** because the intervention targets the *very mechanisms* the model assumes away. For pure prediction, the independence assumption’s unrealism might be a harmless *idealization* if its violations don’t systematically bias predictions (e.g., if ward-level effects average out in aggregate). Accuracy validates this. Here, however, the unrealism becomes a *misrepresentation* of a causally relevant factor. The intervention exploits ward-level coordination (e.g., shared staff optimizing discharges), which the model treats as nonexistent. Using the model to evaluate the intervention thus risks *structural error*: it cannot represent how the intervention works or predict its effect, as it omits the coupling between patients it aims to utilize. The assumption isn’t just false; it’s *load-bearing in a way invisible to predictive accuracy*.  

  **(b) The accuracy defense fails decisively** for this decision task. Predictive accuracy validates a model’s ability to match outputs (readmission labels) to inputs (patient/staff features) under *current conditions*. However, the intervention *changes the system* by altering ward-level coordination. The model, lacking structure to represent this change, cannot reliably predict outcomes *under the intervention*. Its accuracy under historical data provides no evidence for counterfactual scenarios ("what if we add coordinators?"). Worse, because the model assumes independence, it may *systematically underestimate* the intervention’s impact (e.g., if coordinators reduce readmissions precisely by mitigating crowding effects the model ignores). Accuracy here is a poor proxy for *causal adequacy* – the model’s capacity to support *what-if* decisions.  

  **(c) A better justification requires addressing the causal gap.** The team cannot rely solely on accuracy. Instead, they should:  
  - **Demonstrate robustness:** Show the model’s core predictions (e.g., key patient-level risk factors) hold *even when independence is relaxed* (e.g., via sensitivity analysis adding ward-level random effects). If results are robust, independence might be a tolerable simplification.  
  - **Validate against the intervention’s mechanism:** Pilot the intervention on a small scale and test if the model *retains accuracy* under the new regime. If it does, the model might be structurally resilient.  
  - **Reframe the model’s role:** Use it only for patient-level risk stratification, *not* for estimating the intervention’s effect. Pair it with a separate causal analysis (e.g., difference-in-differences using ward-level data) to evaluate the coordinator program.  
  If robustness/causal validation fails, the model is unfit for this decision. The team must prioritize *purpose-appropriate validation*: accuracy for prediction, causal fidelity for intervention design.  

  **Crucially, the clinician identifies a failure of *representational alignment***: the model’s world (independent patients) and the intervention’s world (linked patients) are incompatible. Defending assumptions requires showing they don’t distort *relevant aspects* of the target system for the task – which accuracy alone cannot do when the task shifts from forecasting to intervening.  

  ---

  ### 3. Marking Scheme (5 x 4 marks)  
  **Must-hit points** (Award 4 marks per point if fully addressed; 2 marks for partial; 0 if absent/muddled):  

  1. **Distinguish types of "unrealism"**  
     - **4:** Clearly separates *idealization* (harmless simplification for prediction) from *misrepresentation* (omission of causally relevant factors for intervention).  
     - **2:** Identifies the assumption is false but doesn’t contrast contexts.  
     - *Common failure:* Calls all unrealism equal; misses that the intervention makes the omission *relevant*.  

  2. **Explain why purpose shift invalidates accuracy defense**  
     - **4:** Notes predictive accuracy ≠ causal adequacy; intervention changes system dynamics; model lacks structure for counterfactuals.  
     - **2:** States accuracy isn’t enough but doesn’t explain *why* in this case.  
     - *Common failure:* Repeats "accuracy matters most" without addressing counterfactual fragility.  

  3. **Identify why independence is *load-bearing* here**  
     - **4:** Explicitly ties the assumption to the intervention’s mechanism (e.g., "ignores ward-level coordination the intervention exploits").  
     - **2:** Notes assumption is problematic but doesn’t link to intervention’s design.  
     - *Common failure:* Vaguely says "assumption is important" without specifying *how* for the decision.  

  4. **Analyze limitations of predictive validation**  
     - **4:** Argues accuracy can’t detect structural errors that bias *causal* estimates (e.g., underestimating intervention impact).  
     - **2:** Notes accuracy is imperfect but doesn’t specify *how* it fails for interventions.  
     - *Common failure:* Claims "all models are wrong" without context-specific critique.  

  5. **Propose credible alternative justifications/actions**  
     - **4:** Suggests *specific*, relevant strategies: robustness checks, causal validation, or reframing the model’s role.  
     - **2:** Suggests vague alternatives (e.g., "improve the model") without concrete steps.  
     - *Common failure:* Only recommends "get more data" without addressing structural flaws.  

  ---

  ### 4. A/B Line  
  - **Solid B (16–18/20):** Hits all 5 points competently. Explains the shift from prediction to intervention, identifies why independence is problematic *for this decision*, and suggests plausible alternatives.  
  - **A (19–20/20):** Adds *one* of:  
    - Insight into *how* the model’s structure (omitted variables) biases effect estimation (e.g., "may undervalue interventions relying on social dynamics").  
    - Connects to broader philosophy (e.g., "highlights the *purpose-relativity* of model adequacy").  
    - Notes hidden risks (e.g., "using it may perpetuate blind spots in hospital resource allocation").  

  ---

  ### 5. Sophisticated-but-Wrong Answer  
  **The Move:** "The model is still useful because accuracy proves it captures *implicitly* what it omits explicitly. Real-world data reflects ward effects, so if accuracy is high, the model de facto accounts for them."  
  **Why it loses marks:** Fatally confuses *correlation* with *causal structure*. High accuracy means outputs correlate with reality *under status quo*; it doesn’t imply the model can *simulate changes* to the omitted variables (ward dynamics). The intervention *alters* those dynamics, breaking the correlation. (Fails Point 2 & 4).  

  ---  

  This package forces engagement with the *mechanistic gap* between the model and the intervention, pushing beyond slogans. The marking scheme is ruthlessly specific – a "12" means missing/weak on 2+ core points. It’s self-contained for on-the-spot grading. Let me know if you need tweaks!
