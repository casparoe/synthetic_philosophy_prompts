prompt: |-
  Hey — bit of an odd one, hoping you can help.

  Some context: I'm a software engineer (backend/infra, about ten years in), no formal philosophy background, the closest I got was one ethics elective in undergrad that I mostly slept through. Somehow I've ended up co-running a continuing-ed night class for engineers and data scientists called Philosophy of Science for Practitioners, and the unit I'm on the hook for is models, idealization, and unrealistic assumptions. I need to write the one written exam question for that unit, plus enough of a model answer and marking scheme that I can actually grade the thing without embarassing myself.

  Act as a professional philosopher of science who works on scientific modeling and idealization and who has graded this material before — not a summarizer. Think carefully about where the real crux is before you start writing. If it helps you, do a short brainstorm first, then give me the finished version, but the finished version is what I'm actually going to use.

  Constraints that matter to me:

  - Closed book, no internet for the students. So no citations, no name-the-paper-where-someone-says-this, nothing that depends on them having read a particular article. Everything they need has to be in the question or already in their heads. Same for me — I'll be reading your model answer off my phone.
  - Upper-level undergrad / master's level, about 45 minutes of writing. It has to be impossible to answer by reciting all models are wrong, or the spherical cow joke, or Friedman's thing about assumptions not needing to be realistic. They've all heard those a dozen times. I want them to have to tease apart what the slogan is actually claiming and then commit to a verdict.
  - Build it around a concrete case rather than an assess-Friedman prompt. Here's the setup I have in mind — improve it if it's shaky, and if it's actually confused, fix it in a sentence and move on:

  A hospital analytics team builds a model for 30-day readmission. One assumption baked into it is that patients' outcomes are independent of each other — no ward-level contagion, no shared staffing or crowding effects, nothing where one patient's outcome shifts another patient's. Everyone on the team knows that's false. They defend it by saying the realism of the assumptions doesn't matter, only out-of-sample predictive accuracy does, and their accuracy numbers are genuinely good. Now they want to use the same model to decide whether to fund a discharge-coordinator program on two wards. A skeptical clinician says fine, the numbers are good, but the assumption you're leaning on is exactly the mechanism your intervention is supposed to exploit.

  What I want the question to force out of them: what the claim that the assumption is unrealistic can actually mean here (my suspicion is it's doing at least three different jobs in that one sentence, and the defense only works for some of them), whether the accuracy defense survives once the purpose shifts from predicting to deciding about an intervention, and what a good defense of the assumption would look like as opposed to one that just restates the slogan. Somewhere in there they should have to separate the assumption is false but harmless from the assumption is false and load-bearing in a way accuracy can't see.

  Deliverables:

  1. The exam question itself — tight, maybe 100-150 words, the kind of thing a student reads once and knows what's being asked of them.
  2. A model answer of roughly 600 words, self-contained.
  3. A marking scheme: exactly five must-hit points, 4 marks each, 20 total. For each one, what earns the 4, what earns partial credit, and one line on how candidates typically blow it — the specific wrong move, not just insufficient detail.
  4. A short note on the A/B line: the two or three moves a solid B answer will make, and the extra move that pushes it to an A.
  5. And the sophisticated-but-wrong answer — the move that sounds clever in a seminar and should still lose marks, with a sentence on why.

  Don't hedge on the marking scheme, I need to be able to point at things and say this is why you got a 12. And no reading list, obviously.
