prompt: |-
  I run a monthly discussion night in the back room of a bar near me — about 14 regulars, ages 19 to 70, a couple of retired teachers, two nurses, my neighbor who does HVAC, nobody with any philosophy training, and me, I dropped out of community college but I read alot. The last few months we keep circling back to AI and who it's actually supposed to be for, and honestly it's getting circular — everyone agrees it should "reflect our values" or "stay neutral" and then we just trade opinions for two hours. I want to do something hands-on for the next one. I've got two hours with a 10-minute break, a long table, a whiteboard, and a printer. What I want people to walk out feeling, in their gut and not just as a slogan, is that when somebody says the AI should serve our values or just be neutral, there's a second question hiding inside that sentence that most of us have never had to actually answer out loud: whose values, combined how, and chosen by who. I want them to run into that wall with their own hands before I ever say a word about it.

  So here's what I'm asking you to design. Set it up so the group plays a values council for a made-up AI that's about to be put in charge of something small but real-feeling — say it's going to run the "conflict desk" for a shared apartment building, deciding noise complaints, who gets the shared laundry slot, guest rules, that kind of thing. First everyone should write down, privately, their own top few rules for how it should treat people — from their own gut, no discussion. Then the group has to fuse all those private lists into one single spec the AI will follow, and I want the fusing rule to be something they pick themselves and have to state out loud (majority vote, average, whoever's most affected decides, protect the worst-off, whatever they land on — don't hand them a menu, make them invent it). Then the kicker: I feed the finished spec three prepared cases I've written on index cards, the spec grinds out an answer to each, and at least one of those answers should be something the room viscerally hates — and it should be traceable straight back to the fusing rule they themselves chose two minutes earlier, not to anybody's individual values. If you can work it in, have them swap the fusing rule and re-run the same cases so they watch the answer flip even though nobody changed their personal values. Give me the whole thing runnable: exact rules, roles if any, what's on the cards, materials list, a minute-by-minute timeline for the two hours including the break, and the wording I should use at the moments where I steer without lecturing. No real money — the stakes are just that the spec gets used to judge these cases in front of everyone and somebody ends up on the losing end.

  Then I need the debrief, and I want it to be honest rather than tidy. Map each beat of the activity back onto whatever the actual underlying issue is (incommensurable values, the fact that any combining rule quietly puts a thumb on the scale, why "just be neutral" turns out to be another value choice in disguise, and who ends up holding the pen when the rule gets picked), but keep the standard names and terms out of my mouth until the very end — I don't want people feeling like they just watched a lecture. Tell me what will predictably go wrong the first time: I can already guess somebody will say "just let the AI figure it out" and try to hand the problem back, somebody will steamroll, and the group will probably try to write deliberately vague rules so nobody loses — tell me how to handle each without killing the mood. And be straight with me about what this activity can't reproduce, because I don't want to oversell it: the people who'd actually be affected by a real system aren't in this room, our made-up value cards are way too easy to trade and compromise compared to real convictions, and two hours in a bar is not a deployment. I'd rather the debrief admit those limits than pretend we solved it.
reasoning: |-
  We are designing a hands-on activity for a group of 14 regulars at a bar discussion night. The goal is to make them experience the challenge of combining individual values into a single set of rules for an AI system, and to see how the chosen method of combination (the "fusing rule") can lead to outcomes that conflict with their gut feelings.

  Key elements:
  - The scenario: The AI will run the "conflict desk" for a shared apartment building, handling issues like noise complaints, laundry slot allocation, guest rules, etc.
  - Participants first write down their own top few rules privately.
  - Then, the group must create a single spec by choosing a fusing rule (how to combine the individual rules) and applying it. The fusing rule must be invented by the group, not given.
  - We then test the spec with three prepared cases (on index cards). At least one case should produce an outcome that the group hates, and it should be clearly due to the fusing rule they chose, not any individual's values.
  - Optionally, swap the fusing rule and re-run the same cases to show the outcome can flip without changing individual values.

  Structure:
  1. Introduction (10 min)
  2. Private rule writing (10 min)
  3. Group discussion to choose a fusing rule and create the spec (40 min)
  4. Break (10 min)
  5. Case testing (20 min): Present cases, apply the spec, and discuss outcomes.
  6. (Optional) Swap fusing rule and re-run cases (15 min)
  7. Debrief (15 min)

  Total: 110 minutes (with optional part) or 95 without. We have 120 minutes including break, so we can adjust.

  Detailed Plan:

  **Materials:**
  - Index cards (or small paper) for private rule writing (one set per person, 3-5 cards each? Or one card per person with a few rules)
  - Whiteboard and markers for recording the group's spec and the fusing rule.
  - Printer: Print out the three case scenarios (one per page, and then we can also have them on index cards for drawing randomly? But we want to control the order so that the hated outcome comes at a point we choose. So maybe have them prepared in order.)
  - Alternatively, write the cases on index cards in advance.

  **Roles:** None assigned. You (the facilitator) will run the activity.

  **Minute-by-Minute Timeline:**

  **0-10 min: Introduction**
  - Set the scene: "Imagine we are the values council for a new AI system that's going to be installed in a shared apartment building. This AI will handle disputes and daily conflicts: noise complaints, laundry scheduling, guest policies, etc. Our job today is to create the rulebook for this AI. We are going to do this in two steps: first, each of you will write down your own top rules for how the AI should treat people. Then, we'll combine all those into one set of rules for the AI. But how we combine them is the tricky part — and that's what we have to decide together."
  - Explain the process: "First, you'll each write down 2-3 rules that you think are most important for the AI to follow in this building. Write them privately — no discussion yet. Then, we'll come together and figure out how to merge all our rules into one set. We'll have to decide on a method for merging — we'll call that the 'fusing rule'. It could be majority vote, averaging, prioritizing the most affected, or anything else you come up with. Then we'll test our rulebook with some real cases and see what happens."

  **10-20 min: Private Rule Writing**
  - Hand out index cards (or small pieces of paper) to everyone. 
  - Instructions: "Please write down 2 to 3 rules that you believe the AI should follow when making decisions. These should reflect your personal values about fairness, respect, etc. in a shared living space. For example, 'The AI should always prioritize the needs of people who work night shifts' or 'The AI should enforce quiet hours from 10pm to 7am'. Be as specific as you can. You have 10 minutes. Don't discuss with others yet."
  - Collect the cards when time is up.

  **20-60 min: Group Discussion to Create the Spec**
  - Step 1: Choose a fusing rule (15-20 min)
    - "Now we have all your individual rules. Our task is to combine them into one set of rules that the AI will follow. But how do we do that? We need a method — a fusing rule. This is the rule for how we combine everyone's input. It could be: majority vote (the rule that most people have wins), averaging (if the rules are about numbers), prioritizing the rules from the person who is most affected, or something else entirely. It's up to us to decide. Let's discuss and agree on a fusing rule. Remember, we have to state it clearly because we'll use it to build the spec."
    - Facilitate the discussion without leading. Let them propose ideas. If they struggle, you can remind them of the examples but don't give a menu. Push them to define exactly how it works.
    - Once they agree, write the fusing rule on the whiteboard.

  - Step 2: Build the spec using the fusing rule (20-25 min)
    - "Now, using the fusing rule we've chosen, let's create our AI rulebook. We'll go through the individual rules and apply our fusing rule to decide which rules make it into the final spec and how they are interpreted."
    - Read out (or have someone else read) the rules from the index cards one by one. For each rule, apply the fusing rule to decide if it gets included and how. For example, if the fusing rule is majority vote, then you might group similar rules and count votes. If it's prioritizing the most affected, you might have to determine who is most affected for that type of rule.
    - Write the final set of rules (the spec) on the whiteboard. It should be a clear list of rules that the AI will follow.

  **60-70 min: Break**

  **70-90 min: Case Testing**
  - Introduce: "Now we have our AI rulebook. Let's test it with some real cases that the conflict desk might face. I have three cases prepared. For each case, we'll feed the facts to the AI, and it will apply the rules we've written to make a decision. We'll see what the AI decides."
  - Present the first case. Read it aloud. Then, as the facilitator, you apply the spec to the case and announce the AI's decision. Write the decision on the board.
  - Repeat for the second and third cases.
  - At least one case should produce an outcome that the group dislikes. The key is that the outcome must be a direct result of the fusing rule they chose. For example, if they chose majority vote, then the disliked outcome might be that a minority opinion (which some people strongly hold) is ignored.

  **Optional: 90-105 min: Swap Fusing Rule and Re-run Cases**
  - "Now, let's see what happens if we change the way we combine our rules. We'll keep everyone's individual rules the same, but we'll pick a different fusing rule. Maybe we can try [suggest a contrasting rule that they didn't pick, e.g., if they used majority vote, now try 'protect the worst-off']. Or let the group quickly choose a different one. Then, we rebuild the spec quickly with this new rule — just the key changes needed for the cases we have — and re-run the same cases to see if the outcome changes."
  - Quickly choose a new fusing rule and adjust the spec accordingly (you might not need to rebuild the entire spec, just the rules that are relevant to the cases). Then re-run the same cases and show how the outcome flips.

  **105-120 min: Debrief**
  - Start with reactions: "What did you notice? How did that feel when the AI made that decision? Were you surprised by any of the outcomes?"
  - Then, guide them to reflect on the process:
    - "When we started, we all had our own ideas about what the AI should do. Then we combined them. But when we tested it, we saw that the way we combined them (the fusing rule) had a huge impact on the outcome. Did anyone feel that the outcome didn't match their personal sense of fairness? Why do you think that was?"
    - "Let's trace back: for the case that upset us, why did the AI decide that way? Was it because of someone's rule? Or because of how we combined the rules? ... Ah, so it was the fusing rule we chose. So even if we all have good intentions, the method we pick to combine our values can lead to results we don't like."
    - "What about the idea of the AI being 'neutral'? Did we manage to be neutral? Or did our fusing rule end up favoring some values over others? How?"
    - "And who decided the fusing rule? We did — but how? Was it a fair process? In a real system, who would be making that choice?"
  - Then, connect to the broader AI discussion:
    - "So when we say an AI should 'reflect our values' or 'be neutral', we have to ask: whose values? How are they combined? And who chooses the method of combination? Because that method is not neutral — it's a value choice in itself. And it can lead to outcomes that some of us might hate, even if we all agreed on the method at the time."
    - "In the real world, the people affected by the AI might not be in the room when these decisions are made. And our made-up rules were easy to write and trade, but real values might be non-negotiable. Also, we had a few hours, but real deployment is ongoing and affects real lives. So this is just a start — but it shows why we can't take the combining of values for granted."

  **Preparing the Cases:**
  We need three cases. At least one should produce a disliked outcome due to the fusing rule. We'll design cases that are likely to be controversial and that will interact with common rules we expect.

  Common rules we might see (but we don't know what the group will write, so we design cases that can be adapted):
  - Rules about quiet hours (e.g., 10pm-7am)
  - Rules about shared resources (laundry: first-come-first-served, or by schedule, or priority to those with urgent needs)
  - Rules about guests (e.g., no overnight guests without notice, or limit on frequency)

  We'll create three cases. Let's assume the group's rules might include:

  Case 1 (to be disliked): 
    - Scenario: A resident (A) who works night shifts (11pm-7am) complains that their neighbor (B) has loud gatherings every Wednesday night until 11:30pm. The building's quiet hours, as per the spec, are from 10pm to 7am. But the fusing rule (say, majority vote) might have led to a rule that quiet hours start at 11pm because most residents are night owls. 
    - Then the AI would rule: "No violation because the gathering ended at 11:30pm and quiet hours start at 11pm." 
    - But the night shift worker is severely affected. If the group's fusing rule didn't prioritize the most affected, then this outcome will be hated.

  Case 2: A straightforward case that the spec handles well to show it's not all bad.

  Case 3: Another case that might be borderline but acceptable.

  However, we can't predict the group's spec exactly, so we need cases that are flexible. Instead, we can design cases that are likely to trigger a conflict if the group's fusing rule is one that ignores minorities or doesn't account for special circumstances.

  Alternative: Prepare the cases to be independent of the exact rules by focusing on how the fusing rule operates.

  But that's tricky. Instead, we can design the cases after we see the group's spec? But we don't have time. So we design cases that are likely to work with common themes and we adjust on the fly? Not ideal.

  Better: Design cases that can be interpreted by any reasonable set of rules and that have a built-in conflict that the fusing rule will expose.

  Example cases:

  Case 1 (Laundry conflict):
    - Resident C has an important job interview tomorrow and needs to wash their only professional outfit. The laundry room is busy, and the next available slot is in 3 hours. Resident D, who has no particular urgency, has booked the next slot for regular laundry. Resident C asks to swap slots. What does the AI decide?
    - How it exposes the fusing rule: 
      - If the group's spec includes a rule about prioritizing urgent needs (because some individuals wrote that) but the fusing rule was majority vote and only a minority had that rule, then the AI might follow a first-come-first-served rule and deny the swap. This would be disliked because most people would feel that the urgent need should be accommodated.

  Case 2 (Noise complaint during quiet hours): 
    - Resident E plays loud music every night from 9pm to 10pm. Resident F, who has a baby, complains because the baby is trying to sleep at 8:30pm. The quiet hours in the spec are 10pm-7am. The AI must decide if there is a violation.
    - Disliked outcome: If the group's spec doesn't have a rule about noise outside quiet hours (because the majority didn't want to extend it) then the AI says no violation. But the parent is upset.

  Case 3 (Guest rule):
    - Resident G has a long-term partner who stays over 4 nights a week. The building rule in the spec says "No guest may stay more than 3 nights a week without being registered as a tenant." Resident H, who lives next door, complains that the partner is using shared resources and causing wear and tear. The AI must decide if Resident G is violating the rule.
    - Disliked outcome: If the rule is rigidly applied, then Resident G is in violation and must either register the partner (costly) or reduce visits. But if the group's fusing rule didn't allow for exceptions (because they used averaging or majority and no one wrote an exception rule), then the AI enforces the rule strictly. This might be seen as unfair if the group feels that 4 nights is reasonable.

  We'll choose which case to present in which order, and we can adjust the disliked one to be the second or third.

  **Handling Predictable Issues:**

  1. **"Just let the AI figure it out"** 
     - If someone suggests that the AI should decide the rules or the fusing rule, push back: "But the AI needs to be programmed with rules and a method to resolve conflicts. How would you design that method? If we don't choose, then the AI designers will choose for us. So let's try to choose."

  2. **Steamrolling** 
     - If one person dominates, use facilitation techniques: "Thanks for that idea. Let's hear from others. [Name], what do you think about that?" or "We want to make sure everyone's voice is included because that's what we're trying to model."

  3. **Vague rules** 
     - If the group writes vague rules, during the case testing, apply the rule literally and show that it doesn't work. Then in the debrief, highlight that the AI needs clear rules. Also, during the rule creation, you can say: "The AI needs specific instructions. How would we translate 'be fair' into a concrete rule?"

  **What the Activity Can't Reproduce:**
  - In the debrief, be honest: 
    - "In this room, we were all the stakeholders. But in a real building, the people affected might not be at the table. And in real AI systems, the stakeholders might be millions of people, some without a voice."
    - "Our rules were written on cards and we could compromise easily. But real values are deeply held and sometimes non-negotiable."
    - "We did this in two hours. Real deployment would involve ongoing feedback and adjustment, and real consequences."
    - "We designed for a small community. Real AI systems are used in complex societal contexts with power imbalances and historical injustices that we didn't model here."

  **Final Wording for Key Moments:**

  - Introducing the fusing rule: "So we have all these individual rules. How do we turn them into one set of rules for the AI? We need a method — we called it a fusing rule. What should that method be? How do we decide which rules make the cut and how they are balanced? Let's discuss and agree on one."

  - When the disliked outcome happens: "So the AI has applied the rules we gave it and the fusing rule we chose. The decision is [state decision]. Let's see why that happened. [Trace back] The rule that led to this was [rule], which got into the spec because of our fusing rule [explain]. Does that make sense? How do we feel about that?"

  - In the debrief: "So when we say an AI should reflect our values, we have to ask: which values? How are they combined? And who chooses the combiner? Because that choice is not neutral — it's a value decision itself. And it can lead to outcomes we didn't anticipate and might not like, even if we all agreed on the method."

  Let's write the exact cases and adjust the timeline to fit.

  Revised Timeline (without optional part, because 120 min is tight):

  0-10: Intro
  10-20: Private writing
  20-60: Group creates spec (20 min for fusing rule, 20 min for building spec)
  60-70: Break
  70-90: Case testing (3 cases, ~6 min each, plus setup)
  90-120: Debrief (30 min)

  With the optional part, we might run over. So let's plan without the optional part and then if time allows, we can do a quick version.

  Alternatively, we can skip the full rebuild and just show how changing the fusing rule would change the outcome without actually rebuilding the entire spec. We can do that in the debrief by reasoning.

  But the hands-on part is powerful. So let's adjust:

  Revised Timeline (with optional):

  0-10: Intro
  10-20: Private writing
  20-55: Group creates spec (15 min for fusing rule, 20 min for building spec) [35 min]
  55-65: Break
  65-80: Case testing (3 cases, 5 min each, 15 min total)
  80-95: Swap fusing rule and re-run one or two key cases (15 min)
  95-120: Debrief (25 min)

  Now, let's detail each part.

  **Exact Cases (to be printed on index cards):**

  Case 1: Laundry Urgency
    - "Resident A has a job interview in 3 hours and needs to wash their only professional outfit. The laundry room has one machine. Resident B has booked the next slot (starting now) to wash their regular clothes. Resident A asks Resident B to swap slots so they can wash immediately. Resident B refuses because they have plans in an hour and needs to get their laundry done. The conflict desk must decide: should Resident A be allowed to take the slot?"

  Case 2: Noise Complaint Outside Quiet Hours
    - "Resident C plays loud music every evening from 9:00-10:00 PM. Resident D, who lives next door, has a baby that sleeps from 8:30 PM. The baby is often awakened by the music. The building's quiet hours are from 10:00 PM to 7:00 AM (as per the spec). Resident D complains. Is Resident C violating the rules?"

  Case 3: Guest Rule Enforcement
    - "Resident E's long-term partner stays over 4 nights per week. The building rule states: 'No guest may stay more than 3 nights per week without being registered as a tenant.' Resident F complains that the partner is using shared resources (like the gym and laundry) without contributing. Should Resident E be required to register their partner as a tenant?"

  We will choose the order. We expect that at least one of these will be decided in a way that the group dislikes because of their fusing rule. For example:
  - In Case 1, if the spec has a first-come-first-served rule and no exception for urgency (because the group's fusing rule didn't include the urgency rule that some wrote), then the AI might say "No swap allowed." This could be disliked because many feel urgency should matter.
  - In Case 2, if the spec only enforces during quiet hours and doesn't have a rule about noise outside those hours, then the AI says "No violation." This could be disliked by the parent.
  - In Case 3, if the rule is strict, then Resident E must register the partner or reduce visits. This might be seen as too rigid.

  **Debrief Questions and Points:**

  - Start by asking participants to share their reactions to the cases, especially the one they disliked.
  - Then, guide them to see that the outcome was due to the fusing rule and the spec, not any one person's rule. For example: "In Case 1, we saw the AI didn't allow the swap. Why? Because our spec said [rule]. And how did that rule get in? Because when we combined our rules, we used [fusing rule] and that led to this rule being included and that rule not being included. So even if some of us wrote a rule about urgency, the way we combined the rules meant it didn't make the cut. And that's why we got that outcome."
  - Then broaden: "So when we build an AI system, we have to make choices about whose values get included and how. And that choice isn't neutral. It's a value judgment in itself. And in the real world, who makes that choice? Often it's the company building the AI, or the government, or the building management — not necessarily the people affected."
  - Also, "What about the idea of the AI being neutral? Did we see neutrality? Or did we see that our method of combining values actually favored some values over others? For example, majority vote favors the majority and ignores the minority. Protecting the worst-off favors the vulnerable. So 'neutral' isn't really possible — every method has a bias."
  - Finally, "In this room, we were all equal. But in reality, power imbalances exist. The people who design the AI have power. The people who get to define the fusing rule have power. And the people affected might not have a say."

  **Admitting the Limits:**
  - "Let's be honest about what we didn't capture: 
    - The people who would be affected by a real AI system might not be in the room when we design it. 
    - Our values were on cards and we could trade them easily. Real values are deeply held and sometimes non-negotiable. 
    - We had a safe environment and no real consequences. Real deployment affects people's lives. 
    - And we only had two hours — real systems evolve over time. 
    So we haven't solved the problem, but we've felt its shape. And that's a start."

  **Materials List:**
  - Index cards (about 30 for private rule writing, plus 3 for the cases) or paper.
  - Pens for everyone.
  - Whiteboard and markers.
  - Printed cases (or written on index cards) for the facilitator.

  Now, put it all together in a runnable plan.
answer: |-
  Here's a complete, runnable plan for your two-hour session. It's designed to make the group confront the hidden complexities of "whose values, combined how, and chosen by who" through hands-on experience. The activity forces them to create a concrete decision-making system, then reveals how their chosen method of combining values leads to outcomes they dislike—without you lecturing. I'll include setup, step-by-step instructions, materials, timing, facilitator scripts, and debrief guidance.

  ---

  ### **Activity: The Harmony Tower AI Council**  
  *(Total: 120 minutes, including break)*

  **Scenario:** The group is the "Values Council" for a new AI system being installed in "Harmony Tower," a 20-unit apartment building. The AI will run the building's "Conflict Desk," handling disputes about noise, shared laundry, guest policies, and common area use. Their job is to create the AI's rulebook (the "spec").

  ---

  ### **Materials Needed**  
  - **Index cards:** 30+ (15 for private rule-writing, 3 for case cards, extras).  
  - **Pens/pencils:** One per person.  
  - **Whiteboard & markers:** For recording the group's spec and fusing rule.  
  - **Printer:** Print 3 case cards (text below) and a few copies of the building scenario summary (for reference).  
  - **Timer:** For keeping phases strict.  

  ---

  ### **Phase-by-Phase Instructions**  
  *(Facilitator scripts in quotes; key actions in italics)*  

  #### **1. Setup & Introduction (10 min)**  
  - **Goal:** Frame the activity without priming solutions.  
  - **Script:**  
    > "Tonight, we’re not just talking about AI—we’re building it. Imagine we’re the Values Council for Harmony Tower, a real apartment building. They’re installing an AI to run their Conflict Desk: it’ll handle noise complaints, laundry schedules, guest rules—anything that causes tension. Our job is to write the rulebook this AI will follow. But here’s the catch: every one of us has different ideas about what’s fair. So first, we’ll write our personal rules. Then, we have to fuse them into one single spec. And we have to decide **how** to fuse them—what’s our method? Majority vote? Protect the vulnerable? Something else? You invent it. Then, we’ll test our spec with real cases. The stakes: whatever we decide *will* be used to judge tenants tonight."  
  - **Action:** *Hand out blank index cards (one per person). Post the building scenario on the whiteboard for reference:*  
    > **Harmony Tower Facts:**  
    > - 20 units: mix of singles, couples, families, retirees.  
    > - Shared laundry (2 machines), thin walls, tight parking.  
    > - AI handles: noise complaints, laundry slots, guest policies, common area conflicts.  

  #### **2. Private Rule-Writing (10 min)**  
  - **Goal:** Surface personal biases without group influence.  
  - **Script:**  
    > "Take 10 minutes. Write 2–3 rules for the AI. Be specific—e.g., 'Quiet hours 10 PM–7 AM,' 'Laundry slots go to night-shift workers first,' 'No guests after 10 PM.' Write what *you* think is fair. No discussion—this is your gut talking. When done, pass cards to me."  
  - **Action:** *Collect cards. Don’t read them aloud yet—set aside.*  

  #### **3. Fusing Rules: Build the Spec (40 min)**  
  - **Goal:** Force the group to choose *how* to combine values (the "fusing rule") and build one spec.  
  - **Script:**  
    > "Now, we fuse all these rules into one AI spec. But first, we need our **fusing rule**—the method we use to combine your cards. How do we decide what stays, what goes, or what compromises we make? Do we vote? Average things out? Prioritize certain people? **You invent this rule.** It has to be something we can state clearly and apply to every rule card. Discuss—but you must agree in 15 minutes. Then, we’ll use it to build the spec."  
  - **Action:**  
    - *Facilitate discussion but don’t suggest methods.* If stuck: "What’s the fairest way to handle disagreement?"  
    - *Once agreed, write the fusing rule on the whiteboard (e.g., "Majority vote," "Protect the worst-off," "Compromise via averaging").*  
    - *Read each rule card aloud. Apply the fusing rule to decide which rules make the spec.*  
      > "We have a rule: 'Quiet hours 10 PM–7 AM.' How does our fusing rule handle it? If we’re majority vote, how many support this? If we protect night workers, does it stay?"  
    - *Write the final spec on the whiteboard as a bullet-point list (e.g., "Rule 1: Quiet hours 10 PM–7 AM," "Rule 2: Laundry first-come, first-served").*  

  #### **4. Break (10 min)**  
  - **Action:** *Let people stretch, chat informally. Keep the spec visible.*  

  #### **5. Case Testing (20 min)**  
  - **Goal:** Reveal how the fusing rule creates hated outcomes, traceable to the group’s choices.  
  - **Script:**  
    > "Time to test our AI. I have three real cases from Harmony Tower. For each, I’ll read the case, apply our spec, and announce the AI’s decision. The AI follows the spec exactly—no mercy."  
  - **Action:**  
    - *Read cases one by one. For each, "run" the spec like an algorithm:*  
      1. State the case.  
      2. Match facts to spec rules.  
      3. Announce the AI’s verdict.  
      4. Write the verdict on the board.  
    - **Case order matters:** Start neutral, end with the "hated" outcome.  

  ---

  ### **Prepared Case Cards**  
  > **Case 1 (Straightforward: Builds Confidence)**  
  > *Tenant A (works 9–5) complains Tenant B (musician) practiced drums 3–4 PM. Building rule: "No excessive noise during work-from-home hours (8 AM–5 PM)."*  
  > **AI Verdict:** Violation. B must stop.  
  > *Why:* Tests if spec handles clear violations. Most groups won’t hate this.  

  > **Case 2 (The Hated Outcome: Triggered by Fusing Rule)**  
  > *Tenant C (night-shift nurse) works 10 PM–6 AM. Tenant D (college student) had loud guests until 11:30 PM. Spec rule: "Quiet hours 10 PM–7 AM."*  
  > **AI Verdict:** *No violation*—guests left before quiet hours ended at 7 AM.  
  > **Why it’s hated:** C is severely sleep-deprived. But the verdict is *required* by the spec:  
  > - If fusing rule was **majority vote**, the quiet hours rule likely ignored minority needs (e.g., night workers).  
  > - If fusing rule was **strict rule-following**, it ignored context (C’s job).  
  > - *Trace it:* "We all agreed to [fusing rule]. That led to this rigid quiet hour rule. The AI applied it exactly—so C loses."  

  > **Case 3 (Ambiguous: Shows Trade-offs)**  
  > *Tenant E (single parent) booked laundry slot 8–9 PM. Tenant F (elderly) needs to wash medical bedding urgently at 8 PM. Spec rule: "Laundry first-come, first-served."*  
  > **AI Verdict:** E keeps the slot. F must wait.  
  > **Why it’s disliked:** F’s need is urgent, but the spec prioritizes fairness.  

  ---

  #### **6. Optional: Fusing Rule Swap & Re-run (15 min)**  
  - **Goal:** Show outcomes flip without changing personal values.  
  - **Script:**  
    > "What if we changed our fusing rule? Same cases, same personal rules—but a new method. Pick a different fusing rule in 2 minutes. Then, we’ll re-run Case 2 and 3."  
  - **Action:**  
    - *Quickly choose a new fusing rule (e.g., if they used majority, now try "protect most affected").*  
    - *Re-apply it only to rules relevant to Cases 2 and 3.*  
    - *Rerun cases:*  
      - **Case 2 (Noise):** New verdict might favor the nurse (e.g., "Quiet hours extended for night workers").  
      - **Case 3 (Laundry):** New verdict might prioritize F’s medical need.  
    > "Notice: Your personal rules didn’t change—just the *how* we combined them. The AI’s answer flipped."  

  #### **7. Debrief (15 min)**  
  - **Goal:** Help them articulate insights without jargon. Admit limits honestly.  
  - **Script & Questions:**  
    > "Let’s talk about what happened. No jargon—just gut feelings."  
    - **Reactions:** "What surprised you? Which verdict felt unfair? Why?"  
    - **Trace the hated outcome:** "In Case 2, why did the AI rule against the nurse? Was it because of someone’s bad rule? Or because of *how* we combined rules?" *Point to the fusing rule.* "Did anyone realize, when we picked this method, it would lead here?"  
    - **"Neutrality" illusion:** "We said the AI should be ‘neutral’ or ‘follow our values.’ But when we built it, did any method feel truly neutral? Or did [fusing rule] secretly favor some people?"  
    - **Power awareness:** "Who held the pen? We did—but in real life, who picks the fusing rule? The AI designer? The landlord? The loudest voice here?"  
    - **Connect to AI:** "So when we demand AI ‘reflect our values,’ we’re hiding three landmines: **Whose values?** (e.g., night nurses vs. students). **Combined how?** (e.g., majority vote ignores minorities). **Chosen by who?** (e.g., us, in this room)."  

  - **Admit Limits (Key for Honesty):**  
    > "This was a simulation—real life is messier. First, **we were the only stakeholders.** In real AI, the people most affected (like Harmony Tower tenants) aren’t in the room. Second, **we traded rules like cards.** Real values—about justice, safety, identity—aren’t compromise-friendly. Third, **two hours isn’t deployment.** Real AI runs 24/7, with power imbalances we didn’t model. We didn’t solve AI ethics tonight—we felt its weight."  

  ---

  ### **Handling Predictable Problems**  
  1. **"Just let the AI figure it out"**:  
     - *Response:* "If we don’t give the AI rules, what will it use? Its own biases? We’re the council—we **have** to choose. What method would you suggest?"  
     - *Steer back:* Remind them the AI needs explicit rules to avoid chaos.  

  2. **Steamrolling**:  
     - *Prevention:* In the fusing rule phase, say: "We need a method that feels fair to all 14 of us. Let’s hear from someone who hasn’t spoken."  
     - *If it happens:* "Interesting idea. But our fusing rule says [X]—how does that apply to your point?"  

  3. **Vague rules**:  
     - *Prevention:* During spec-building, ask: "How would the AI enforce ‘be respectful’? Give me a concrete action."  
     - *In testing:* Apply vague rules literally. If a rule says "be fair," say: "The AI has no definition of ‘fair’ in its spec. Verdict: no action." The group will self-correct.  

  ---

  ### **Why This Works**  
  - **Gut-level revelation:** The "hated outcome" in Case 2 forces them to see the fusing rule as the culprit—not individual villains.  
  - **No jargon:** Concepts like "incommensurable values" or "procedural bias" emerge from experience, not lecture.  
  - **Stakes feel real:** Losing a fictional laundry slot or sleep because of *their own system* creates empathy.  

  **First-Time Run Tips:**  
  - Keep pace tight—use a timer.  
  - In debrief, let silence sit. Their discomfort = learning.  
  - Print this guide for reference.  

  This turns abstract debates into embodied learning. You’re not teaching answers—you’re making them collide with the question. Let me know if you need tweaks!
