prompt: |-
  I chair the technical certification board of an independent consortium whose member labs submit claims about their models for public endorsement. Our charter permits certification only of a claim that rests either on a proof or on an argument whose failure would require a coincidence; in practice this second clause has been read as licensing a presumption of independence, i.e. the default that two quantities are uncorrelated unless something specific connects them, so that their expected product is the product of their expectations. The charter does not say how strong a connection must be before it defeats the presumption.

  On Thursday the board votes on an application from a lab that wants us to certify that its model's accuracy on a sealed evaluation set — held by a third party, assembled after the training run, never touched by the training pipeline — is an unbiased estimate of its accuracy on the field distribution. Three facts are undisputed. First, the lab trained two hundred configurations and submitted the one that scored highest on the sealed set. Second, the sealed items were generated by the third party from a distribution the lab itself specified. Third, the third party's item-generation script drew on a model of the same family as the applicant's, in order to filter out ambiguous items. The lab argues that each of these is at most a thin connection, and that a default can be defeated only by a mechanism that plausibly matters.

  Two members have circulated proposals I want the opinion to address. One would replace our practice with a bright-line rule: presume independence only where the applicant can point to a randomization device it did not control. The other, a dissenting memo, argues that until someone produces a formalization of this kind of reasoning that accepts the sound applications and rejects the spurious ones, the board should suspend certification of any claim resting on an independence presumption, on the ground that our present practice cannot tell the two apart and that a heuristic which can be turned to any conclusion is no evidence at all.

  Please draft the short written opinion I will circulate before the vote. It should give a clear recommendation on this application — certify, reject, or certify with conditions, including a time frame — state a standard our reviewers can actually apply to future cases, and give an honest account of the strongest point on the side you come out against.
reasoning: |-
  Okay, the user chairs a technical certification board for an independent consortium. They need to draft a written opinion before a vote on a lab's application. Let me break down the key elements.

  First, the consortium's charter allows certification based on either proof or an argument where failure would require a coincidence. In practice, this has meant presuming independence unless there's a specific connection. The current application involves a lab claiming their model's accuracy on a sealed evaluation set is an unbiased estimate of field accuracy. 

  The undisputed facts are crucial: 
  - The lab trained 200 configurations and selected the one with highest score on the sealed set
  - The sealed items were generated by a third party using a distribution specified by the lab 
  - The third party used a model from the same family to filter ambiguous items

  The lab argues these are only "thin connections." But there are two member proposals: 
  1. A bright-line rule requiring randomization devices not controlled by the applicant 
  2. A dissent calling to suspend all independence presumations until formalized 

  The opinion needs to: 
  - Recommend certify/reject/conditional 
  - Set a practical standard for reviewers 
  - Acknowledge the strongest counterargument 

  Hmm... the selection bias from testing 200 models seems significant. Even with a third party holding the data, choosing the best performer on that specific set likely creates overfitting. The shared model family for filtering also introduces potential correlation - if the applicant's model shares biases with the filtering model, accuracy could be inflated. 

  The bright-line rule proposal seems too rigid - many valid cases wouldn't have randomization devices. But the dissenting memo has a point about needing clearer standards. 

  Perhaps a conditional certification? Requiring the lab to quantify selection bias effects would address the coincidence argument while maintaining rigor. For future cases, shifting to "demonstrated absence of material connection" rather than default independence makes sense - it puts the burden on applicants to rule out meaningful correlations. 

  The strongest counterargument is indeed the dissent's concern about arbitrariness. We should acknowledge that while committing to develop formal guidelines. 

  Recommendation: 
  - Conditional certification with bias quantification 
  - New standard: applicants must affirmatively rule out material connections 
  - Future work: formalize reasoning framework 
  - Honest acknowledgment of dissent's validity concern
answer: |-
  ## PRE-VOTE OPINION: CERTIFICATION APPLICATION [LAB NAME/MODEL ID]  
  *From the Chair, Technical Certification Board*  

  **Recommendation:** **Reject** the current application. The lab must, within 90 days, submit a quantitative analysis demonstrating that the undisputed facts introduce negligible bias relative to claimed precision. Absent this, certification is denied.  

  **Reasoning:** Our charter permits reliance on an independence presumption only where defeating it would require an implausible coincidence. Here, three specific connections exist between the training/selection process and the evaluation set:  

  1.  **Model Selection Bias:** Testing 200 configurations and selecting the winner *specifically on the sealed set* creates a direct, non-random dependency. The accuracy estimate for the chosen model is inherently optimistic for *that specific set* – defeating the coincidence presumption requires assuming the model's performance on this set is magically representative despite explicit optimization.  
  2.  **Specified Distribution & Shared Model Family:** While the third party holds the set, the lab specified the *distribution* and the filtering used a model from the *same family*. This creates a plausible pathway for correlation: the applicant's model may share biases or features leveraged during filtering, artificially inflating accuracy on filtered items compared to the true field distribution.  

  The lab characterizes these as "thin," but their charter argument misapplies the presumption. The presumption is a *default starting point*, defeated by *any plausible, specific connection* – not only those proven "strong" or "mattering." The burden shifts to the applicant to show why these connections *don't* introduce material bias. They provided only assertion, not evidence.  

  **Standard for Future Reviewers:** Effective immediately, reviewers shall apply this standard:  
  > **"The independence presumption is defeated if the applicant (or its agents) engaged in any process (training, selection, data specification, or filtering) that could plausibly, based on known ML principles, create a non-random dependency between the final model/selection and the specific evaluation set used for the claim. If such a connection exists, the applicant must provide quantitative evidence demonstrating that the resulting bias is negligible within the context of the claimed accuracy estimate. Assertion alone is insufficient."**  

  **Addressing the Proposals:**  
  *   **Bright-Line Rule (Randomization Device):** This is overly restrictive. Valid independence can exist without explicit randomization (e.g., truly pristine holdout data untouched by *any* model-influenced process). Our revised standard focuses on *plausible connections* and *evidence*, which is more practical and scientifically grounded.  
  *   **Dissenting Memo (Suspend All Presumptions):** **This memo raises the strongest point against our practice:** the lack of a formal, universally agreed criterion for "implausible coincidence" *does* create ambiguity. A heuristic vulnerable to motivated reasoning risks certifying unsound claims. This application *exemplifies* that risk – connections exist, yet the lab argues they are "thin." Without demanding evidence, our presumption *could* become a rubber stamp.  

  **Conclusion:** We cannot certify based on independence given the specific, plausible connections demonstrated. The lab must quantify potential bias from model selection and shared-family filtering. Our revised standard provides actionable guidance: identify plausible connections, then demand evidence disproving material bias. This upholds charter rigor while rejecting unworkable extremes. The dissent's core concern about ambiguity is valid and compels us toward evidence-based assessment; the bright-line rule, while aiming for objectivity, rejects valid scenarios. **Vote to reject the application pending submission of the required bias analysis within 90 days.**  

