prompt: |-
  Okay, weird ask, but here goes. I'm a reporter — science and ideas beat, mostly, which is a fancy way of saying I write about consciousness research and the occasional philosophy fight — and for the past few years I've also chaired the board of a small nonprofit newsroom that does long investigations. Our editorial handbook has one rule I helped write and now sort of regret: we don't use the word "genocide" in our own voice, in a headline or a finding, unless a court or a UN body has already made that determination. Until then we say "mass atrocities" or "crimes against humanity" and we quote other people's use of the g-word. The rule was supposed to keep us from turning into an advocacy shop.

  Now we've got a case that's going to break the rule or break the org. Our team has spent two years in one province of a country I'd rather not name here. A minority group there — call them the Hill People, which isn't their name either — has been on the receiving end of a lot of things over about eight years: killings by paramilitary units, a sterilization campaign run out of provincial clinics with actual quotas attached, a boarding-school program that's taken several thousand kids and forbidden the language, a ban on the group's ceremonies, and a dam that flooded the valley with the burial sites and two of the three shrines. There's a paper trail — a provincial planning memo calling the group's "growth" a problem to be managed, a school directive, a clinic memo with numbers on it. What there isn't is a court. The country isn't a party to the ICC, the domestic courts are captured, and the governor's family sits on the mining consortium that benefits from the dam. Nobody is ever getting indicted. The dam and the language ban are also the parts I can't make fit anywhere in the convention's list of acts, and I keep wondering whether that's the whole ballgame or a detail.

  Our lead investigator has 40,000 words and wants "genocide" in the headline. The board is split down the middle and I have the deciding vote and I hate it. One side says hold the line: we aren't a court, we can't establish intent, and the second we start slapping the label on the cases we care most about we become exactly what our critics say we are. The other side says the rule is a coward's rule — it outsources our judgment to institutions that are never going to show up, and it's precisely the no-court cases that need the word. One board member keeps bringing up Lemkin, the guy who coined the term in 1944, noting that he treated the destruction of a group's culture and language as central to genocide, and that the drafters of the 1948 convention considered that and then dropped it, leaving us with "intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such" — so why are we treating the lawyers' narrower version as the real one, and what is "as such" even doing in there? I don't know how much that should move me. And there's the practical thing: if we use the word, our two local staff get deported or worse and the office closes.

  I'm bringing a memo to Thursday's vote. Draft it. I need a clear recommendation on two things: whether we keep, amend, or scrap the handbook rule, and what actually goes in this report — the headline, the finding paragraph, and when we publish. Its going to be close either way, so if you think we should amend rather than scrap, tell me exactly what the new trigger is, because "we'll know it when we see it" is how we got here. Take the strongest version of whichever side you land against, since I'd rather lose an argument on paper than win it by not having it. American English, no citations, no history-of-the-idea padding — I've read enough of those to last a lifetime.
reasoning: |-
  Okay, the user is a reporter and board chair of a nonprofit newsroom facing a huge ethical dilemma. Their editorial rule prohibits using "genocide" unless a court/UN body has ruled on it, but their team's two-year investigation into atrocities against the "Hill People" clearly meets the criteria – except there's zero chance of legal validation due to corrupt systems. The team wants to call it genocide in the headline, but using the word could endanger local staff and get the office shut down.

  Hmm, this is layered. Professionally, they're torn between journalistic integrity (avoiding advocacy) and moral duty (naming atrocities accurately). The legalistic rule now feels like a cop-out when institutions are complicit. Emotionally, they're exhausted – that "I hate it" about the deciding vote says it all. The Lemkin argument about cultural destruction adds historical weight, but pragmatism screams danger for their team.

  The core tension: Is their role to document neutrally or label responsibly when systems fail? The unspoken fear is that staying silent makes them complicit. Also fascinating how they dismiss "history-of-the-idea padding" – they're not academics; they need actionable decisions.

  Breaking it down: The dam/language ban don't fit neatly into the UN genocide convention's acts (Article II), though intent seems clear from that "growth as problem" memo. But forcing cultural destruction was absolutely central to Lemkin's original concept. The board member has a point – why let lawyers narrow the definition postwar? Still, "as such" in the convention implies targeted destruction *because of* group identity, which the evidence supports.

  Practical landmines: If they publish with "genocide," local staff face deportation or worse. If they don't, the investigation might lose impact. Half-measures like "cultural genocide" could backfire by sounding academic. And scrapping the rule entirely risks overuse in future cases.

  Best path? Amend the rule to allow "genocide" when three conditions are met: (1) Evidence satisfies both acts *and* intent per the convention; (2) No credible legal path exists for adjudication; (3) Editorial consensus agrees the term is necessary for public understanding. For *this* report, avoid the headline but state the finding clearly in the body with precise legal justification, while redacting staff names pre-publication and relocating them if possible. 

  Why this balance? It prevents future advocacy creep while acknowledging systemic failures. The headline restraint protects lives without muffling the truth. And invoking Lemkin in the memo honors the spirit of the word while conceding the legal reality. The user needs steel nerves either way – but this lets them say the quiet part loud without getting people killed.
answer: |-
  Here’s your memo. Clear, direct, no padding.  

  **TO:** Editorial Board  
  **FROM:** [Your Name], Chair  
  **RE:** Rule Amendment & Hill People Report Decision  
  **DATE:** [Thursday’s Date]  

  ### Recommendation 1: Amend the Handbook Rule  
  **Scrap the current court/UN trigger.** Replace it with:  
  *"We may use ‘genocide’ in our own voice when three conditions are met:*  
  1.  *Evidence meets the 1948 UN Convention’s criteria for acts AND specific intent to destroy a protected group ‘as such’;*  
  2.  *No credible path exists for legal adjudication (e.g., ICC inaction, captured courts, state non-cooperation);*  
  3.  *Editorial leadership (EIC + Board Chair) consensus agrees its use is essential to public understanding.*  
  *In all cases, we must transparently outline the evidentiary basis for the label."*  

  **Why amend, not scrap?** Keeping *some* threshold prevents advocacy drift. "No credible legal path" prevents outsourcing to broken systems. "Consensus" forces rigor. "Transparent evidence" builds trust.  

  ### Recommendation 2: The Hill People Report  
  **Do NOT use "genocide" in the headline.**  
  **DO state the finding in the report body as follows:**  
  > *"Based on documented patterns of killing, forced sterilization, systematic child removal for cultural erasure, and the destruction of culturally vital sites – coupled with planning documents framing the Hill People’s existence as a ‘problem’ – this investigation concludes the evidence meets the criteria for genocide under international law. The absence of indictable intent under the UN Convention’s narrow definition of cultural destruction does not negate the totality of acts aimed at the group’s physical and cultural dissolution."*  

  **Publication Protocol:**  
  1.  **Headline:** Use "State-Led Campaign to Erase Hill People Traced to Provincial Authorities" (Accurate, impactful, no G-word).  
  2.  **Local Staff:** Immediately relocate or anonymize bylines/staff lists *before* publication. Cite "security risks" generically if asked.  
  3.  **Timing:** Publish only after relocation/anonymization is confirmed. Delay if necessary.  
  4.  **Editor’s Note:** Append a box explaining *why* we used "genocide" internally but avoided it in the headline (safety, convention ambiguity on cultural acts) and link to the amended rule.  

  ---

  ### Why This Way?  
  **On the Rule:**  
  - **"Intent" is demonstrable here.** The memo calling their "growth" a "problem" + sterilization quotas + targeted destruction of cultural/religious sites shows intent to destroy the group *as a group*. "As such" means *because of who they are* – your evidence nails this.  
  - **The legal gap IS the story.** Courts won’t act. Your rule’s old trigger would permanently silence you on the worst cases. "No credible path" forces active assessment, not passivity.  
  - **Lemkin was right, but the Convention is the baseline.** Acknowledging the cultural erasure *alongside* physical acts within the report strengthens the argument without overstepping into legally contested "cultural genocide" in the headline.  

  **On the Report:**  
  - **Headline restraint isn’t cowardice; it’s protection.** Using "genocide" there guarantees retaliation against staff and shuttering the office. It doesn’t make the finding weaker inside.  
  - **"Crimes against humanity" undersells it.** Your evidence points to *destruction of the group*. Say so clearly in the body.  
  - **The dam/shrines *are* relevant.** Flooding burial grounds/shrines *while banning ceremonies and language* isn't just cultural erasure; it’s an act *intended* to destroy the group’s physical connection to identity and ancestry. Frame it as part of the *pattern* proving intent.  

  **The Strongest Counter-Argument (and Why It Loses):**  
  *"Calling it genocide only when it’s legally safe makes us complicit in silence. The headline is where the impact lies. Relocating staff is a worthy risk to speak the full truth."*  
  **Rebuttal:** Truth without a platform is martyrdom, not impact. Getting the office closed and staff imprisoned stops *this* story and *all future ones*. You can achieve 95% of the impact (naming genocide in the finding, detailing the acts) without sacrificing your presence on the ground. Protecting your team *is* ethical journalism.  

  **Vote:** Amend the rule. Publish the report with the internal finding, protected staff, and a clear headline that compels readers to discover the genocide conclusion themselves. This keeps the org alive, the truth told, and your integrity intact.
