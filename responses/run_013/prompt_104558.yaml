answer: |-
  Here's a self-contained St. Petersburg variant where the expected value is **undefined** (not infinite) due to non-integrable payoffs, based on a random real number and a heavy-tailed prior. The issue is measurability/integrability, not risk aversion or infinite sums.

  ### The "Chaotic Coin" Gamble
  1. **Setup**:  
     A fair coin is flipped until it lands heads. Let \(N\) be the number of flips *including* the first heads (so \(N \geq 1\)).  
     Independently, a parameter \(\theta\) is drawn from a **standard Cauchy distribution** (density \(f(\theta) = \frac{1}{\pi(1+\theta^2)}\)).  

  2. **Payoff**:  
     The gambler receives a payoff of \(2^N \cdot \sin(\theta \cdot 2^{N})\) dollars.  

  ### Why the Expected Value is Undefined
  - **Decompose the expectation**:  
    The expected payoff is \(E[2^N \cdot \sin(\theta \cdot 2^{N})]\). Since \(N\) and \(\theta\) are independent, we write:  
    \[
    \sum_{n=1}^{\infty} \left( \frac{1}{2^n} \cdot \int_{-\infty}^{\infty} \underbrace{2^n \cdot \sin(\theta \cdot 2^{n}) \cdot \frac{1}{\pi(1+\theta^2)}}_{\text{Payoff function given } N=n}  d\theta \right).
    \]
    
  - **The conditional expectation diverges**:  
    For a fixed \(n\) (e.g., \(n=100\)), consider the inner integral:  
    \[
    \int_{-\infty}^{\infty} 2^n \cdot \sin(\theta \cdot 2^{n}) \cdot \frac{1}{\pi(1+\theta^2)}  d\theta.
    \]  
    - The term \(\sin(\theta \cdot 2^{n})\) oscillates wildly between \(-1\) and \(+1\) as \(|\theta|\) grows (frequency \(2^n\) is enormous).  
    - The Cauchy density \(\frac{1}{\pi(1+\theta^2)}\) has **heavy tails** (decays like \(1/\theta^2\)), which are too slow to dampen the oscillations.  

    This integral **does not converge**—it oscillates without settling to a value. (Technically, \(\sin(\theta \cdot 2^{n})\) is not integrable against the Cauchy measure over \(\mathbb{R}\).)

  - **Result**:  
    Each term in the sum is **undefined**. Thus, the entire expectation fails to exist—not because it sums to infinity, but because it **lacks a consistent value** at every \(n\) where \(2^n\) is large.

  ### Key Conceptual Points
  1. **Non-integrability is the core issue**:  
     Unlike the classic St. Petersburg paradox (divergent sum), here the payoff *oscillates so rapidly* relative to the Cauchy prior that the integral diverges. Bounded utility functions would "fix" this by capping utility, but that misses the point: the **monetary expectation itself is undefined** due to non-integrability.

  2. **Philosophical implication**:  
     Rational agents cannot maximize expected value when payoffs are non-integrable—even if utilities are bounded. This challenges decision theories that assume expectations always exist.

  3. **Concrete and intuitive**:  
     - The coin-flip process mirrors St. Petersburg.  
     - The Cauchy prior is standard in probability (illustrates heavy tails).  
     - The \(\sin(\cdot)\) function makes payoffs oscillate (e.g., for \(\theta \approx 0.1\) and \(n=100\), \(\sin(\theta \cdot 2^{100})\) fluctuates faster than any computable frequency).

  ### Why Bounded Utility Doesn't Resolve This
  Suppose we apply a bounded utility function \(u(\text{payoff})\) (e.g., \(u(x) = \arctan(x)\)). The *utility* expectation **would exist** because \(u\) is bounded. However:  
  - This "fixes" the problem by changing the question (to expected *utility*).  
  - The original paradox—undefined *monetary* expectation—persists. A philosopher can argue that agents should still care about the non-integrable monetary stakes.

  ### Seminar-Ready Punchline
  > "We've made the St. Petersburg paradox *worse*: not only is there no finite expected value, there's **no consistent expected value at all**. The gamble’s payoffs are mathematically 'wild' relative to the prior, making them non-integrable. This shows the paradox’s depth—it’s not just about infinity, but **whether an expectation can even be defined** in continuous spaces with pathological priors."

  This example forces confrontation with non-integrability in continuous probability spaces, using only standard components (coin flips, Cauchy distribution, sine function).
