  > **POLICY P-OPT (STANDARD):** At every indistinguishable intersection on SDH-1, execute a "Continue" maneuver with probability **2/3** and an "Exit" maneuver with probability **1/3**. Utilize the certified randomizing device (CRD-7B, issued upon licensure) to determine the action at each intersection per your selected probability. Maintain consistent velocity; do not pause.

  **Rationale:** This Policy leverages the statistical properties of your epistemic uncertainty. Applied consistently:
  *   Probability you are at Alpha on first encounter: 1/2. Probability you Exit at Alpha: 1/3. Contribution: (1/2)*(1/3)*0 = 0.
  *   Probability you Continue at Alpha (reaching Omega): (1/2)*(2/3) = 1/3.
  *   Probability you are at Omega on first encounter: 1/2. Probability you Exit at Omega: 1/3. Contribution: (1/2)*(1/3)*4 = 4/6 = 2/3.
  *   Probability you Continue at Omega: (1/2)*(2/3) = 1/3. (Outcome 1).
  *   Total Expected Value: 0 (from Exiting Alpha) + 2/3 (from Exiting Omega) + (1/3)*1 (from Continuing at Omega) = 0 + 2/3 + 1/3 = 1. However, this double-counts the path to Omega. Correctly: Path outcomes are: Exit Alpha (Prob (1/2)*(1/3) = 1/6, Value 0), Exit Omega (Prob reaching Omega * Exit Prob = (1/2 * 2/3) * (1/3) = (1/3)*(1/3)=1/9? Wait, flawed path enumeration. Simpler: Two decision points, independent randomization per policy. Chance first exit is Alpha and you exit: (1/2)*(1/3) = 1/6, Value 0. Chance first exit is Omega and you exit: (1/2)*(1/3)=1/6, Value 4. Chance you continue at first intersection (regardless of type): (1/2)*(2/3) + (1/2)*(2/3) = 2/3. *Given* you continue at first, you face second intersection. Chance it's Alpha and you exit: (1/2)*(1/3)=1/6, Value 0? But given you continued once, P(now at Omega) = P(first was Alpha) = 1/2 (since indistinguishable). So: Paths:
      1.  Exit at Alpha (first): P = (1/2) * (1/3) = 1/6, Val=0
      2.  Exit at Omega (first): P = (1/2) * (1/3) = 1/6, Val=4
      3.  Continue at Alpha (first), then Exit at Omega (second): P = [P(first=Alpha) * P(Cont|Alpha)] * [P(second=Omega | Continued at Alpha) * P(Exit|Omega)] = (1/2 * 2/3) * (1 * 1/3) = (1/3) * (1/3) = 1/9, Val=4? Wait no: If you continued at Alpha, you *are* now at Omega. P(Exit there) = 1/3. Val=4.
      4.  Continue at Alpha (first), then Continue at Omega (second): P = (1/2 * 2/3) * (1 * 2/3) = (1/3)*(2/3)=2/9, Val=1.
      5.  Exit at Omega first already covered (Path 2). Paths starting with Omega first:
          Exit at Omega first: P=1/6, Val=4 (Path 2)
          Continue at Omega first: P = (1/2)*(2/3)=1/3. Now you are past both, Val=1? But only if you *only* encounter one intersection? No, if first encounter is Omega and you Continue, you have passed Omega and are now leaving the highway without encountering another intersection, outcome 1.
      This reveals the flaw: The "first encounter" frame is misleading. Better: The driver encounters *one or two* intersections randomly. With P=1/2, the first intersection is Alpha; with P=1/2, it is Omega. If first is Alpha and you exit: Val=0. If first is Alpha and you continue, you *will* encounter Omega. At Omega, you apply policy: Exit (P=1/3, Val=4) or Continue (P=2/3, Val=1). If first is Omega and you exit: Val=4. If first is Omega and you continue: You pass both, Val=1. So:
      *   P(Val=0) = P(First=Alpha) * P(Exit|Alpha) = (1/2)*(1/3) = 1/6
      *   P(Val=4) = P(First=Alpha & Cont) * P(Exit|Omega) + P(First=Omega & Exit)
                   = [(1/2)*(2/3)]*(1/3) + (1/2)*(1/3)
                   = (1/3)*(1/3) + 1/6
                   = 1/9 + 1/6 = (2/18 + 3/18) = 5/18? Inconsistency.
