      Path C: Encounter Alpha, Continue; then Encounter Omega, Continue. (P= (1/2)*(2/3)*1*(2/3)= (1/3)*(2/3)=2/9, Val=1)
      Path D: Encounter Omega, Exit. (P= (1/2) * (1/3) = 1/6, Val=4)
      Path E: Encounter Omega, Continue. (P= (1/2) * (2/3) = 1/3, Val=1) [No second intersection encountered]
      Now sum:
      P(0) = P(Path A) = 1/6 = 3/18
      P(4) = P(Path B) + P(Path D) = 1/9 + 1/6 = 2/18 + 3/18 = 5/18
      P(1) = P(Path C) + P(Path E) = 2/9 + 1/3 = 4/18 + 6/18 = 10/18
      Expected Value = (3/18)*0 + (5/18)*4 + (10/18)*1 = (0 + 20/18 + 10/18) = 30/18 = 5/3 ≈ 1.666? This is wrong. P(Path E) = P(First=Omega & Continue) = 1/2 * 2/3 = 1/3 = 6/18, Val=1. P(Path C) = 2/9 = 4/18, Val=1. Total P(Val=1) = 10/18. P(Val=4) = P(Path B: 1/9=2/18) + P(Path D: 1/6=3/18) = 5/18. P(Val=0)=P(Path A)=1/6=3/18. EV= (3/18)*0 + (5/18)*4 + (10/18)*1 = 0 + 20/18 + 10/18 = 30/18 = 5/3 ≈ 1.666. But the known optimal EV for p=2/3 is 8/9≈0.888. Where is the error?

      **THE ERROR IS IN PATH DEFINITION AND OVERCOUNTING.** The key is that the driver only makes decisions *at the intersections they encounter*. The state "Encounter Omega" *includes* both the case where Omega is first *and* where Omega is second. Crucially, if Alpha is first and you continue, the next intersection *is* Omega. If Omega is first, there is no next intersection after continuing. We must consider the sequence of encounters.

      Correct State-Space:
      - With **P=1/2**, the **first intersection is Alpha**.
          - At Alpha: Exit (P=1/3) -> Outcome 0.
          - At Alpha: Continue (P=2/3) -> Proceed to Omega.
              - At Omega: Exit (P=1/3) -> Outcome 4.
              - At Omega: Continue (P=2/3) -> Outcome 1.
      - With **P=1/2**, the **first intersection is Omega**.
          - At Omega: Exit (P=1/3) -> Outcome 4.
          - At Omega: Continue (P=2/3) -> Outcome 1 (past both).

      Now calculate Expected Value (EV):
      EV = (1/2) * [ (1/3)*0 + (2/3) * ( (1/3)*4 + (2/3)*1 ) ]   +   (1/2) * [ (1/3)*4 + (2/3)*1 ]
      Compute inner brackets:
      First part (First=Alpha): (1/3)*0 = 0
                                (2/3) * [ (1/3)*4 + (2/3)*1 ] = (2/3) * [4/3 + 2/3] = (2/3)*(6/3) = (2/3)*2 = 4/3? Wait: (1/3)*4 = 4/3? No: (1/3)*4 = 4/3 is incorrect; it's (1/3) of the time at Omega gives 4, so contribution is (1/3)*4. Similarly (2/3)*1. So inside the brackets for the Continue branch from Alpha: EV_after_Alpha_cont = (1/3)*4 + (2/3)*1 = 4/3 + 2/3 = 6/3 = 2. No: (1/3)*4 = 4/3 ≈1.333, (2/3)*1=2/3≈0.666, sum= 1.333+0.666=2.0. Then multiply by P(Continue|Alpha)=2/3: (2/3)*2.0 = 4/3 ≈1.333. Then add the Exit part: (1/3)*0=0. So total for First=Alpha path: 0 + 4/3 = 4/3. Then multiply by P(First=Alpha)=1/2: (1/2)*(4/3) = 4/6 = 2/3.
      Second part (First=Omega): (1/3)*4 + (2/3)*1 = 4/3 + 2/3 = 6/3 = 2. Multiply by P(First=Omega)=1/2: (1/2)*2 = 1.
      **TOTAL EV = 2/3 + 1 = 5/3 ≈1.666?** This is clearly wrong because the theoretical max is 4, and we know pure continue gives 1, pure exit gives 0, and mixed should be less than 2. Where is the mistake?

      **THE MISTAKE IS PROBABILITY WEIGHTING OF THE OMEGA DECISION AFTER ALPHA.** When we say "At Omega" after continuing from Alpha, we are *conditioning* on having continued at Alpha. The probability of *reaching* Omega *given* first was Alpha is 1 (if you continue). The P(Exit at Omega) is 1/3, P(Continue at Omega) is 2/3. The value contribution is correct: (1/3)*4 + (2/3)*1 = 4/3 + 2/3 = 6/3 = 2. But this 2 is the expected value *given that you are at Omega after continuing from Alpha*. This scenario only happens if 1) First was Alpha (P=1/2) and 2) You continued at Alpha (P=2/3). So the *probability weight* for this entire sub-path (First=Alpha, Cont@Alpha, then action at Omega) is (1/2)*(2/3) = 1/3. And the EV contribution of this sub-path is the probability weight times the conditional EV: (1/3) * [(1/3)*4 + (2/3)*1] = (1/3)*(4/3 + 2/3)? No, the conditional EV *at the point of reaching Omega after Alpha* is (1/3)*4 + (2/3)*1 = 4/3 + 2/3 = 6/3 = 2. So contribution is (1/3) * 2 = 2/3. But this is the contribution *only* for the paths where you reach Omega after Alpha. We also have:
      - Path: First=Alpha, Exit@Alpha: P = (1/2)*(1/3) = 1/6, Val=0, Contribution = 0.
      - Path: First=Omega, Exit@Omega: P = (1/2)*(1/3) = 1/6, Val=4, Contribution = (1/6)*4 = 4/6 = 2/3.
      - Path: First=Omega, Cont@Omega: P = (1/2)*(2/3) = 1/3, Val=1, Contribution = (1/3)*1 = 1/3.
      - Path: First=Alpha, Cont@Alpha, Exit@Omega: P = (1/2)*(2/3)*(1/3) = (1/2)*(2/9) = 2/18 = 1/9, Val=4, Contribution = (1/9)*4 = 4/9.
      - Path: First=Alpha, Cont@Alpha, Cont@Omega: P = (1/2)*(2/3)*(2/3) = (1/2)*(4/9) = 4/18 = 2/9, Val=1, Contribution = (2/9)*1 = 2/9.
      Now SUM ALL CONTRIBUTIONS:
          0 (from A-Exit) + 2/3 (from Ω-Exit) + 1/3 (from Ω-Cont) + 4/9 (from A-Cont->Ω-Exit) + 2/9 (from A-Cont->Ω-Cont)
      Convert to 18ths:
          0 + 12/18 + 6/18 + 8/18 + 4/18 = (0+12+6+8+4)/18 = 30/18 = 5/3 ≈1.666. Still wrong.

      **THE FUNDAMENTAL ERROR IS COUNTING "FIRST" AS RANDOM WITH P=1/2, BUT THE DRIVER'S POLICY AFFECTS WHETHER THEY SEE THE SECOND.** The probability that a particular intersection is encountered *and acted upon* is not uniform. The exit probabilities must be applied to the *existence* of the paths.

      Correct calculation for Policy P(Exit)=q (here q=1/3):
      - Outcome 0: Only possible if driver exits at Alpha. This requires: 1) Alpha is encountered, 2) Driver exits. P(Alpha encountered) = 1 (it's always there). P(Exit|Alpha) = q. **But** if the driver exits at Alpha, they never reach Omega. So P(Outcome 0) = P(Exit at Alpha) = q.
      - Outcome 4: Can happen two ways:
          a) Driver exits at Omega when it is the first (and only) intersection encountered (i.e., Omega is "first"). P(Omega first) = 1/2? Not quite. P(Driver *encounters* Omega as first) = P(First=Omega) = 1/2. P(Exit | at Omega) = q. So P(Outcome 4 via first Omega) = (1/2)*q.
          b) Driver exits at Omega when it is the second intersection (i.e., Alpha was first, driver continued, then exits at Omega). P(First=Alpha) = 1/2. P(Continue at Alpha) = 1-q. P(Then Exit at Omega) = q. So P(Outcome 4 via second Omega) = (1/2)*(1-q)*q.
          Total P(Outcome 4) = (1/2)q + (1/2)(1-q)q = (1/2)q [1 + (1-q)] = (1/2)q(2-q) = (1/2)(2q - q²)
      - Outcome 1: Can happen two ways:
          a) Driver continues at Omega when it is the first (and only) intersection. P(First=Omega) = 1/2, P(Continue|Omega) = 1-q. Contribution: (1/2)(1-q)
          b) Driver continues at Omega after continuing from Alpha. P(First=Alpha) = 1/2, P(Continue|Alpha) = 1-q, P(Continue|Omega) = 1-q. Contribution: (1/2)(1-q)(1-q)
          Total P(Outcome 1) = (1/2)(1-q) + (1/2)(1-q)² = (1/2)(1-q)[1 + (1-q)] = (1/2)(1-q)(2-q)
      Now, Expected Value:
      EV = P(0)*0 + P(4)*4 + P(1)*1
          = 0 + [ (1/2)(2q - q²) ] * 4 + [ (1/2)(1-q)(2-q) ] * 1
          = (1/2)*4*(2q - q²) + (1/2)(1-q)(2-q)
