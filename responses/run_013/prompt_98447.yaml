          = (4q - 2q²) + (1 - (3/2)q + (1/2)q²)
          = 4q - 2q² + 1 - 1.5q + 0.5q²
          = 1 + (4q - 1.5q) + (-2q² + 0.5q²)
          = 1 + 2.5q - 1.5q²
      Now maximize EV(q) = 1 + 2.5q - 1.5q². Take derivative: dEV/dq = 2.5 - 3q. Set to zero: 2.5 - 3q = 0 => q = 2.5/3 = 5/6? But earlier we know q=2/3 for continue probability, so exit prob should be 1/3? Here q is P(Exit). So dEV/dq = 2.5 - 3q =0 => 3q=2.5 => q=2.5/3=5/6. But this can't be right because if q=1 (always exit), EV=1 + 2.5(1) - 1.5(1)^2 = 1+2.5-1.5=2. But we know if always exit, you get 0 half the time (at Alpha) and 4 half the time (at Omega), EV= (0+4)/2=2. And if q=0 (always continue), EV=1 + 0 - 0 =1. If q=1/3 (P(exit)=1/3), EV=1 + 2.5*(1/3) - 1.5*(1/3)^2 = 1 + 5/6 - 1.5*(1/9) = 1 + 0.8333 - 0.1667 = 1.6666? Still 5/3. But the known optimal for mixed strategy is 8/9≈0.888. What's wrong?

      **I SEE THE FUNDAMENTAL MISTAKE IN THE PROBLEM SETUP FOR THE HANDBOOK.** The classic Absent-Minded Driver problem has the driver potentially forgetting *how many* intersections they've passed, but the two intersections are distinct and the road ends after the second. The driver has no memory of passing any. The key is that the driver cannot distinguish *which* intersection they are at *and also cannot remember if they've passed one already*. In this setup, when the driver reaches an intersection, they don't know if it's the first or the second. This is different from my "first/second" random assignment above. In the classic problem, there is only one road, with Intersection 1 and Intersection 2. The driver starts before 1. If they pass 1, they reach 2. If they pass 2, the road ends. The driver has the same state of knowledge (no memory) at each. So the probability that an encountered intersection is the first one is not 1/2. Let's reframe classically.

      **Classic Absent-Minded Driver Setup:**
      - Two intersections, 1 and 2, on a road.
      - Driver starts before 1.
      - At each intersection, choices: Exit (payoff depends on which intersection) or Continue.
      - Payoff: Exit at 1: 0. Exit at 2: 4. Continue past both: 1.
      - Driver has no memory: At each intersection, they do not know if it is 1 or 2. They are in the same epistemic state each time.
      - The driver uses a policy: probability `p` of continuing at any intersection.

      What is the expected payoff?
      - The driver encounters Intersection 1.
          - With prob `p`, they continue. Then they encounter Intersection 2.
          - With prob `1-p`, they exit at 1, payoff 0. Game over.
      - If they continued at 1, they are now at Intersection 2. Again, they don't know it's 2.
          - With prob `p`, they continue again. Payoff 1.
          - With prob `1-p`, they exit. Payoff 4.
      So the paths:
      - Exit at 1: Prob = `(1-p)`, Payoff = 0.
      - Continue at 1 AND Exit at 2: Prob = `p * (1-p)`, Payoff = 4.
      - Continue at 1 AND Continue at 2: Prob = `p * p`, Payoff = 1.
      Total Expected Value: EV = `(1-p)*0 + p(1-p)*4 + p*p*1 = 0 + 4p(1-p) + p^2 = 4p - 4p^2 + p^2 = 4p - 3p^2`.
      Maximize EV(p) = 4p - 3p². Derivative: dEV/dp = 4 - 6p. Set to zero: 4 - 6p = 0 => p = 4/6 = 2/3.
      EV(max) = 4*(2/3) - 3*(4/9) = 8/3 - 12/9 = 8/3 - 4/3 = 4/3? Wait: 4*(2/3)=8/3≈2.666, 3*(4/9)=12/9=4/3≈1.333, EV=8/3 - 4/3 = 4/3 ≈1.333? But this is not 8/9. Let's calculate numerically: p=2/3.
      EV = 4*(2/3) - 3*(2/3)^2 = 8/3 - 3*(4/9) = 8/3 - 12/9 = 8/3 - 4/3 = 4/3 ≈1.333. Still not 8/9.

      **I KNOW WHAT'S WRONG.** In the classic derivation, the EV is correct as 4p - 3p². At p=2/3, EV=4*(2/3) - 3*(4/9) = 8/3 - 12/9 = 24/9 - 12/9 = 12/9 = 4/3 ≈1.333. But I recall the optimal is 8/9. How is 8/9 derived? Let me think.

      **CORRECT CLASSIC CALCULATION (Consistent with Literature):**
      The driver encounters an intersection. They don't know if it's 1 or 2. Let `α` be the probability they assign to being at intersection 1 (given they are at *an* intersection). The actual probability depends on the policy. Under policy `p` (P(continue)):
      - Probability that an encountered intersection is intersection 1: P(I1 | encountered) = P(encounter I1) / [P(encounter I1) + P(encounter I2)].
      - P(encounter I1) = 1 (driver always reaches I1).
      - P(encounter I2) = P(continue at I1) = p.
      - So P(I1 | encountered) = 1 / (1 + p)
      - P(I2 | encountered) = p / (1 + p)
      If the driver exits, expected payoff = P(I1|enc) * 0 + P(I2|enc) * 4 = [p/(1+p)] * 4
      If the driver continues, expected payoff = P(I1|enc) * (Value of being at I2 next) + P(I2|enc) * 1.
      But the "Value of being at I2 next" is the same as the value at any intersection, call it V. Also, if they continue at I2, they get 1. So:
      V = max_action over { Immediate Exit Value, Immediate Continue Value }
      But for a fixed policy p, we don't maximize at the node; we compute the value under the policy.
      Under fixed policy `p`:
      V = [P(exit) * (Immediate Exit Value)] + [P(continue) * (Immediate Continue Value)]
