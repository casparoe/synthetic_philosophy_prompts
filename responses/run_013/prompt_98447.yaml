  **CHAPTER THREE: YOUR POLICY**  
  Optimal navigation requires adopting a **binding pre-departure Policy**. You must select this Policy *before entering SDH-1* and adhere to it rigidly at every intersection encountered, irrespective of momentary perceptions or impulses. The Bureau mandates the following optimal Policy for standard passenger vehicles:

  > **POLICY P-OPT (STANDARD):** At every indistinguishable intersection on SDH-1, execute a "Continue" maneuver with probability **2/3** and an "Exit" maneuver with probability **1/3**. Utilize the certified randomizing device (CRD-7B, issued upon licensure) to determine the action at each intersection per your selected probability. Maintain consistent velocity; do not pause.

  **Rationale:** This Policy leverages the statistical properties of your epistemic uncertainty. Applied consistently, it yields the highest possible expected outcome (approximately 1.333 utility-adjusted units) by strategically balancing the risks of premature exit (0) against missed opportunity (1 vs 4). Attempting to "choose wisely in the moment" guarantees suboptimality (0). Your CRD-7B enforces necessary stochasticity; do not override it. Record your chosen Policy (P-OPT Standard) on Form SDH-1c before departure.

