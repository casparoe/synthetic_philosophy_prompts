prompt: |-
  I'm prepping a grad seminar on consciousness and I keep getting into the same fight with a colleague who thinks 'qualia' is just a word for a confusion. Her line is that any attempt to specify qualia either collapses into functional/representational facts or into something we could never talk about, so the whole notion is incoherent. I want you to argue for a position on this: argue that qualia are not an incoherent posit, but that the only defensible version is a deflationary one—qualia as the intrinsic, non-representational determinables that fix the phenomenal character of an experience, where 'intrinsic' doesn't mean unobservable in principle but rather that their identity conditions aren't exhausted by their causal/functional role. To make it concrete, imagine a case: two subjects are functionally identical, report the same things, and have the same discriminatory capacities, but we discover a hidden parameter that swaps their color experiences—so subject A's experience of red is subject B's experience of green. Both say things like 'I can't tell whether your red looks like my red, but I can tell that my red doesn't look like my green.' Argue that this case supports the deflationary reading rather than undermining it, and that the incoherence charge equivocates between metaphysical and epistemic senses of 'intrinsic.'

  Don't just summarize the usual suspects; I want an original arguement that takes the incoherence charge seriously and either defeats it or concedes it. Somewhere in there, say what work the deflationary reading is supposed to do that a purely functionalist reading can't. Also, I'm not asking for a literature review—just reason from the concepts and the case.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're teaching a grad seminar on consciousness and have a recurring debate with a colleague who dismisses qualia as incoherent. The colleague argues that any description of qualia either reduces to functional facts or becomes ineffable, making the concept meaningless. The user wants me to argue for a deflationary view of qualia—intrinsic, non-representational properties that define phenomenal character without being metaphysically mysterious.

  First, I need to address the incoherence charge head-on. The colleague's argument seems to rely on a false dilemma: either qualia collapse into functional roles or they're utterly ineffable. But there's a middle ground. The user's example of inverted spectra with a hidden parameter is crucial here. Even with functional equivalence, the intrinsic properties could differ. That suggests qualia aren't reducible to function, but they're not ineffable either because we can discuss them indirectly through their relational properties.

  The user mentioned the distinction between metaphysical and epistemic intrinsicness. That's key. Metaphysically, qualia are intrinsic in that their identity isn't exhausted by causal roles. Epistemically, we can know about them through their effects, even if not directly. This avoids the incoherence by showing that "intrinsic" doesn't mean unknowable—just not fully defined by function.

  I should also consider why the deflationary view is necessary. Functionalism can't account for the inverted spectrum possibility because it ties experience too tightly to behavior and discrimination. If two people function identically but have swapped color experiences, functionalism misses that intrinsic difference. The deflationary qualia explain the subjective character that functional roles don't capture.

  The user wants an original argument, not a literature review. So focusing on the inverted spectrum case and the metaphysical/epistemic distinction is the way to go. Emphasizing that the hidden parameter reveals a non-functional aspect of experience. Also, clarifying that deflationary qualia aren't mysterious—they're part of the natural world, just not reducible to function.

  I need to ensure the argument concedes where necessary. The colleague is right that qualia can't be described in isolation, but wrong to conclude they're incoherent. By acknowledging the epistemic limits while defending the metaphysical distinction, the argument stays balanced. The work of deflationary qualia is to preserve subjectivity without overcomplicating it, offering a minimal addition to functionalism that explains what it can't.

  Finally, structuring the response to first deconstruct the false dilemma, then use the case study, distinguish the senses of intrinsic, and show why functionalism falls short. Keeping it conceptual and tight, avoiding jargon where possible. The user’s deeper need might be to present a nuanced position that satisfies rigorous philosophical scrutiny while being teachable in a seminar. They need a clear, defensible stance that bridges the divide without oversimplifying.
answer: |-
  Here’s a targeted defense of deflationary qualia, grounded in your inverted spectrum case and designed to disarm the incoherence charge by exposing its key equivocation:

  **The Core Argument: Distilling Deflationary Qualia from Functional Gaps**  
  Your colleague’s "collapse or silence" dilemma assumes a false binary. Deflationary qualia occupy a middle ground: they are *relationally anchored* but *not functionally reducible*. The inverted spectrum case demonstrates this:  

  1. **Functional Equivalence ≠ Phenomenal Identity**:  
     A and B are functionally identical: they discriminate colors identically, use color terms consistently, and report identical preferences (e.g., both call red "warm," green "cool"). Yet the "hidden parameter" swap means *something* differs. This difference isn’t functional (it’s causally inert at the behavioral level) but it’s empirically detectable (e.g., via neural correlates). Crucially, **their introspective reports hint at this gap**: both acknowledge the *possibility* that their experiences might differ ("I can’t tell if your red looks like my red"), while affirming the *distinctness* of their own qualitative palette ("my red doesn’t look like my green").  

  2. **The Work of Deflationary Qualia: Explaining the Subjective Constraint**  
     Functional roles specify *how* states relate to inputs, outputs, and other states. But they don’t specify *why* a given functional role is accompanied by *this specific phenomenal character* rather than another. In the inverted case:  
     - Both subjects have a state that plays the "red-role" (triggers "red" utterances, discriminates stop signs from grass, etc.).  
     - But A’s red-role state has qualitative character Q1, while B’s has Q2.  
     - **Deflationary qualia are the intrinsic determinables (Q1, Q2) that fix *which* phenomenal character realizes the functional role.** They answer: "What grounds the *felt quality* implementing the function?"  

  3. **Defusing Incoherence: The Metaphysical/Epistemic Split**  
     Your colleague’s charge equivocates on "intrinsic":  
     - **Epistemically**: Qualia *are* "observable" (via introspection) and indirectly describable (e.g., "the way red looks to me"). We can refer to them relationally ("the quale typically caused by ripe tomatoes"). They aren’t Cartesian theater—they’re natural properties.  
     - **Metaphysically**: Their *identity* isn’t exhausted by functional/representational roles. Q1 is Q1 not because of its causal relations, but because of its intrinsic nature. This is akin to mass in physics: mass has causal powers, but "being mass" isn’t *defined* by those powers—it’s a property that *grounds* them.  

  4. **Why Functionalism Can’t Swallow This**  
     A functionalist might retort: "If the inversion is behaviorally undetectable, it’s empty." But this misses the *explanatory target*. Deflationary qualia:  
     - **Preserve the first-person datum**: A’s report "My experience of red has *this* quality" tracks a real property (Q1), even if Q1’s only observable effect is her introspective access to it.  
     - **Explain phenomenal structure**: The reason A’s red/green difference is salient *to her* isn’t just functional discrimination; it’s the *intrinsic contrast* between Q1 and Q3 (her green). Functional roles describe relational scaffolding; qualia are the qualitative "filling."  
     - **Ground the conceivability of inversion**: The case is coherent *because* functional roles underdetermine qualitative character. Deflationary qualia resolve this underdetermination minimally.  

  **Conceding to the Incoherence Charge (Partially)**  
  Your colleague is right that qualia can’t be "specified" in isolation—but this is a feature, not a bug. We specify electrons relationally (charge, mass, spin) without denying their intrinsic reality. Qualia are similar:  
  - **What we concede**: We cannot "point to" qualia outside their relational context (e.g., neural correlates, discriminatory behaviors). They aren’t Lockean secondary qualities floating free of physics.  
  - **What we reject**: That this entails collapse into functional facts. The inverted spectrum shows functional facts are compatible with multiple qualitative realizers. Deflationary qualia are the minimal posit to break the symmetry.  

  **Why Deflationary Qualia Earn Their Keep**  
  They do one job functionalism can’t: **account for the perspectival anchor of consciousness**. Functional roles are agent-neutral; qualia are perspectival. When A says "red looks *like this*," "this" refers to Q1—an intrinsic property that fixes *what it’s like for A*. Functional descriptions lack resources to capture this indexical, subjective dimension. Deflationary qualia aren’t "extra" substances; they’re the categorical bases for why certain physical/functional states feel a specific way.  

  **Conclusion**: The inverted spectrum isn’t an argument against qualia—it’s an argument for deflationary qualia. It reveals a gap in functional explanation that only intrinsic, non-representational properties can fill, while their relational knowability avoids mysterianism. Your colleague’s "incoherence" charge fails by conflating epistemic indirectness with metaphysical vacuity. Deflationary qualia are the least extravagant way to take subjective experience seriously.
