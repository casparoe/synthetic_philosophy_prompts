prompt: |-
  I host a small podcast on decision theory and practical rationality, and next week's guest is a philosopher — an invented composite rather than a real person — who has spent years defending the claim that Pascal's-mugging cases are a genuine reductio of expected value maximization rather than a curiosity to be dissolved. Her line is that the theory rests on a false premise: that any nonzero probability, however minute, can be multiplied by any finite value, however vast, and still yield a determinate quantity that a rational agent is bound to maximize. The mugger — a stranger who offers an astronomically large reward, or threatens an astronomically bad punishment, on a probability far below anything we would ordinarily credit — is supposed to expose that premise, and she holds that the repair must be either a floor on the probabilities we are permitted to take seriously or a ceiling on the values we are permitted to trade against them. She is fluent, has heard the standard objections, and has a stock reply to most of them: any rule that refuses the mugging also refuses ordinary long-shot prudence, and she maintains that this is a cost her opponents have never properly priced. I do not want the episode to be forty minutes of her restating the view.

  Act as an experienced interviewer and a philosopher of decision theory. Begin with a short private brainstorm — a list of the pressure points where this position is most vulnerable and where it is strongest, not part of the final answer — and then draft eight to ten interview questions that turn on the actual content of the view rather than on its reception. Each question should be answerable in a few minutes on air rather than being a disguised essay prompt, and each should come with a follow-up keyed to the answer she is most likely to give, so that I am not left improvising when she reaches for the stock reply. I need at least one question distinguishing the mugging from Pascal's wager proper — whether the wager shares the flaw or escapes it, and what exactly the disanalogy is supposed to be; at least one on whether the right repair is a probability threshold, a bounded utility function, or an outright restriction of expected value reasoning to cases with well-behaved distributions, with her asked to say which of the three she would abandon first and why the others are worse; and at least one on the principle that seems to be doing the real work — that for any finite good there is some sufficiently small probability of a sufficiently large good such that taking the trade is required — asking whether she thinks that principle is independently plausible or merely an unnoticed consequence of expected value maximization that only became visible once the mugger arrived. Sequence the questions so that they build, ending with one that is hardest to deflect: ideally a question that forces her to say what would count as evidence that the mugging indicts her preferred repair rather than the theory she rejects, or what she would have to observe about actual deliberating agents to conclude that her fix is not merely a stipulation. Close with a question about what would change her mind. Please give a one-line note after each question on what it is designed to expose, and do not ask her for reading recommendations or citations — I want the substance, not a syllabus — nor spend any questions on how she came to the topic.
reasoning: |-
  Okay, the user hosts a small podcast on decision theory and has an upcoming episode with a philosopher guest who argues that Pascal's mugging is a reductio of expected value maximization. The guest believes that any nonzero probability multiplied by any finite value doesn't always yield a rational obligation. The user wants to conduct an insightful interview that goes beyond the guest restating her view.

  First, I need to identify the pressure points of her position. Her strongest point is that refusing the mugging also rejects ordinary long-shot prudence, which opponents haven't properly accounted for. That's compelling because we do take small probabilities seriously in daily life, like buying insurance. Her vulnerability lies in the arbitrariness of thresholds - how to set a probability floor or utility ceiling without it being ad hoc. Also, her position might lead to counterintuitive rejections of extremely high-value, low-probability opportunities that seem rational, like a billionaire's life-saving lottery ticket.

  The user wants questions targeting the content of her view, not reception. I should include questions on Pascal's wager vs. mugging disanalogy, the choice between probability thresholds, bounded utility, or restricting expected value reasoning, and the underlying principle. Each question needs a follow-up to counter stock replies. Sequencing matters: start with foundations, build to toughest question forcing her to confront what evidence would change her mind.

  For the Pascal's wager question, I'll ask how it differs from the mugging. Likely she'll say the mugger's probability is epistemically unjustified while Pascal's isn't. Follow-up could challenge if that distinction holds under her repair. For the repair types, she probably favors probability thresholds. Follow-up would press how to justify the threshold non-arbitrarily. The "underlying principle" question should probe if she finds it independently plausible. Follow-up can ask why we accept it in insurance but not mugging.

  The hardest-hitting question should be near the end: what observable evidence would falsify her position. This forces her out of theoretical debate into empirical accountability. Finally, close with what would change her mind, making her articulate defeat conditions.

  I need to ensure questions avoid essay prompts, focus on substance over citations, and each has a clear exposé goal. The sequence will start with clarifying her view, move through objections, and end with toughest challenges.
answer: |-
  Here’s a brainstorm of pressure points, followed by a structured interview plan with targeted questions and follow-ups:

  **Private Brainstorm: Pressure Points**  
  *Strengths:*  
  1. **Ordinary long-shot alignment:** Rejecting the mugging *does* conflict with rational low-probability precautions (e.g., buying disaster insurance).  
  2. **Epistemic humility:** We can’t reliably distinguish "mugger-level" probabilities from "insurance-level" probabilities (e.g., 10⁻²⁰ vs. 10⁻¹⁵).  
  3. **Regret avoidance:** Accepting EV maximization opens the door to catastrophic losses from impossible-seeming threats.  

  *Vulnerabilities:*  
  1. **Arbitrariness of thresholds:** Setting *any* probability floor/utility ceiling appears ad hoc without independent justification.  
  2. **Lost opportunities:** Her repair may reject *actual* high-value, low-probability gambles (e.g., a credible $1 quadrillion lottery at 10⁻¹² probability).  
  3. **Self-defeat:** If "no threshold" is arbitrary, why isn’t a threshold *more* arbitrary? What meta-principle sets it?  
  4. **Pragmatic inconsistency:** Agents using her rule might still act *as if* they maximize EV when probabilities are "high enough," revealing EV’s residual pull.  

  ---

  **Interview Questions & Follow-Ups**  

  1. **Clarification Anchor**  
     *Q: "You argue the mugging exposes a false premise in EV maximization. Is the core flaw that probabilities *can't* be that small, or that utilities *can't* be that large—or is it that we *shouldn’t treat the product* as action-guiding?"*  
     *(Goal: Force her to isolate the primary target—probability realism, utility realism, or EV’s applicability.)*  
     *Follow-up (if she emphasizes probabilities): "If we discovered a physical process generating *precise* 10⁻³⁰ probabilities (e.g., quantum decay), would the mugging then become rational?"*  
     *Follow-up (if she emphasizes utilities): "If 'astronomical value' is incoherent, how do we model choices involving existential risks (e.g., human extinction) where stakes *are* arguably unbounded?"*  

  2. **Pascal’s Wager Disanalogy**  
     *Q: "Pascal’s Wager also pits a tiny probability against infinite reward. Is it equally flawed? If not, what shields it from your critique?"*  
     *(Goal: Test if her objection is specific to *empirical* low-probability claims vs. *metaphysical* ones like Pascal’s.)*  
     *Follow-up (Likely: "Pascal’s probability isn’t empirically scoped; it’s a prior for divine existence"): "Does your repair then permit wagering on *non-empirical* infinities but forbid empirical muggers? If so, doesn’t that privilege faith over evidence?"*  

  3. **The Long-Shot Prudence Counter**  
     *Q: "You’ve said rejecting the mugging requires rejecting rational precautions like buying asteroid insurance. But in insurance, we pay *small* costs to avoid *large* losses. The mugger demands payment *now* for a *speculative* gain. Isn’t the disanalogy one of *directional flow* (risk-aversion vs. risk-seeking)?"*  
     *(Goal: Challenge the equivalence of "mugging" and "prudence" by highlighting asymmetry in stakes/certainty.)*  
     *Follow-up (Likely: "Both involve small p * large V"): "But in prudence, we have evidence that models *are* reliable (e.g., actuarial tables). The mugger offers no track record. Isn’t your objection really about *epistemic access* to p, not p * V itself?"*  

  4. **The Repair Menu**  
     *Q: "You’ve proposed a probability floor, a utility ceiling, or restricting EV to ‘well-behaved’ distributions. If you *had* to abandon one, which is least defensible—and why?"*  
     *(Goal: Force prioritization and expose weaknesses in each fix.)*  
     *Follow-up (Likely: "Utility ceilings are worst—they deny stakes can be extreme"): "But if we *bound* utility (e.g., ‘no outcome > 10²⁰ utils’), doesn’t that *dissolve* the mugging without ad hoc probability thresholds? Why is capping values less rational than ignoring probabilities?"*  

  5. **The Core Principle**  
     *Q: "The principle ‘any finite good can be outweighed by a sufficiently large good at sufficiently small probability’ seems key. Is this independently intuitive? Or is it only visible because EV maximization *entails* it?"*  
     *(Goal: Probe whether she sees the principle as self-evidently false or as a reductio of EV.)*  
     *Follow-up (Likely: "It’s counterintuitive and exploitable"): "But we *accept* this in extreme cases: we spend billions to avert trillion-dollar catastrophes at <0.01% probability. Why is the mugger different? Is it the *agent’s intent*, not the math?"*  

  6. **Thresholds in Practice**  
     *Q: "Suppose we adopt a probability floor (e.g., p < 10⁻¹⁵ is treated as 0). How do we set that threshold without arbitrariness? Why 10⁻¹⁵, not 10⁻¹⁰ or 10⁻²⁰?"*  
     *(Goal: Press on the justification for any specific threshold.)*  
     *Follow-up (Likely: "It’s context-dependent/pragmatic"): "If it’s pragmatic, doesn’t that reduce your repair to ‘EV works until it feels weird’—making rationality hostage to intuition?"*  

  7. **The Hardest Deflection (Empirical Test)**  
     *Q: "Imagine we observe agents who *systematically profit* by accepting mugger-like bets (e.g., venture capitalists funding 10⁻⁶ chance moon shots). Wouldn’t this suggest your ‘irrational’ threshold rejects genuinely beneficial choices?"*  
     *(Goal: Force engagement with real-world optimization under uncertainty.)*  
     *Follow-up (Likely: "Real agents never face true muggers; those are scams"): "But if we *did* find reliable high-impact, low-probability opportunities (e.g., asteroid mining), would your rule forbid pursuing them? Shouldn’t rationality adapt to empirical success?"*  

  8. **Closer: What Changes Your Mind?**  
     *Q: "Finally, what evidence or argument would make you concede that expected value maximization *can* coherently handle Pascal’s mugging—or that your repair creates worse problems?"*  
     *(Goal: Reveal her criteria for falsifiability and intellectual exit ramps.)*  
     *Follow-up (Based on her answer): Probe whether her criteria are achievable (e.g., "If you require a *non-arbitrary* threshold, does that mean your view is unfalsifiable?")*  

  ---

  **Why this sequencing works:**  
  - Starts with clarification (**Q1**) to frame the debate.  
  - Tests scope via **Wager (Q2)** and **prudence (Q3)** to stress disanalogies.  
  - Forces trade-offs in **repairs (Q4)** and **principles (Q5)**.  
  - Presses on **arbitrariness (Q6)** as a major vulnerability.  
  - **Q7** is the hardest: it demands empirical accountability, avoiding theory-laden stalemates.  
  - **Q8** ends constructively, revealing her epistemology.  

  Each question targets the *mechanism* of her view, not just conclusions. Follow-ups anticipate tactical replies, keeping dialogue substantive.
