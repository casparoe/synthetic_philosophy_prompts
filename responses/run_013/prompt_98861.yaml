  Below is a complete, classroom-ready design for your 90-minute seminar session. It balances conceptual depth with pedagogical feasibility, using tangible materials and a structured timeline to evoke the intuitive pull of "positional reasoning" and its fragility. The activity targets the core idea that sampling assumptions (especially the reference class problem) underpin inferences from one's position in a sequence, and how population growth disrupts uniform sampling intuitions.

  ---

  ### **Activity Design: "The Settlement Bet"**

  #### **1. Setup & Materials**
  - **Settlement Sizes** (chosen for intuitive pull without triviality):  
    - **Small Settlement (SS)**: 50 residents.  
    - **Large Settlement (LS)**: 1,000 residents.  
    - *Why these numbers?*  
      - A student drawing a number ≤50 *could* be in either settlement, creating ambiguity.  
      - A number >50 is only possible in LS, making it feel definitively "large" (intuitive pull).  
      - The 20:1 ratio creates strong Bayesian leverage: low numbers favor SS, high numbers (>50) demand LS.  

  - **Materials**:  
    - Two decks of index cards:  
      - **Deck A (SS)**: 50 cards numbered 1–50.  
      - **Deck B (LS)**: 1,000 cards numbered 1–1,000 (shuffle thoroughly; use a subset if impractical).  
    - **Coin** (to secretly determine the settlement).  
    - **Betting tokens** (e.g., poker chips), 10 per student.  
    - **Payoff table** on whiteboard:  
      | Your Bet       | Settlement is SMALL | Settlement is LARGE |  
      |----------------|---------------------|---------------------|  
      | Bet on SMALL   | +2 tokens           | –1 token            |  
      | Bet on LARGE   | –1 token            | +2 tokens           |  
      | No bet         | 0 tokens            | 0 tokens            |  
    - **Growth Model Handout** (for Phase 2, distributed later):  
      > "**Small Settlement (50 total)**: Constant population. Exactly 1 birth per year for 50 years.  
      > **Large Settlement (1,000 total)**: Rapid growth. Births double each year. Year 1: 1 birth, Year 2: 2 births, ..., Year 10: 512 births (total 1,023 → truncated to 1,000)."  

  #### **2. Phase 1: Uniform Sampling (40 mins)**  
  - **Timeline**:  
    - **0–5 mins**: Introduce the scenario.  
      > "You’re a resident of a settlement that’s either **Small (50 people)** or **Large (1,000 people)**. I’ve flipped a coin to decide which. Your number was drawn *uniformly at random* from all residents. You’ll bet tokens (redeemable for coffee) on which settlement you’re in. Bet by weighing the evidence: your number."  
    - **5–15 mins**: Distribute cards.  
      - Flip coin secretly (e.g., heads = SS, tails = LS).  
      - Shuffle the corresponding deck (SS or LS) and deal one card to each student.  
    - **15–30 mins**: Betting round.  
      - Students bet using tokens:  
        - Bet on SS, LS, or abstain.  
        - Maximum bet: 5 tokens (encourage commitment).  
      - Record bets privately (paper slips).  
    - **30–40 mins**: Small-group arguments.  
      - Groups of 4 discuss: *"Why did you bet as you did? What does your number suggest?"*  
      - Predictable arguments:  
        - *High-number holders (>50)*: "I must be in LS—SS only goes to 50!" (Pull of positional reasoning).  
        - *Low-number holders (e.g., 10)*: "I’m probably in SS—it’s easier to get a low number there."  
        - *Number 40–50 holders*: "I might be in either, but LS feels riskier for betting."  

  - **Expected Dynamics**:  
    - **Pull of positional reasoning**: High numbers (>50) confidently bet on LS; low numbers (1–20) lean toward SS; mid-numbers (30–50) hesitate.  
    - **Refusal to bet**: Some (likely mid-number holders) may abstain ("I have no information!"). *This is a feature, not a bug*—it reveals discomfort with the sampling assumption. Highlight it later.  

  #### **3. Phase 2: Growth Model Reversal (30 mins)**  
  - **Timeline**:  
    - **40–45 mins**: Reveal growth models.  
      - Distribute **Growth Model Handout**.  
      > "Correction: Your number is your *birth year*. The settlement’s population changed over time. Resample your birth year accordingly."  
      - **Crucial twist**: Redistribute cards *using the same deck but reinterpreted under growth*:  
        - **SS**: Same card (birth year = number).  
        - **LS**: Assign new birth years via growth model. For example:  
          - A student who drew "10" in Phase 1 might now get "6" (since early years are sparse).  
          - Use a pre-generated mapping (e.g., random assignment respecting exponential distribution).  
    - **45–55 mins**: Silent recalibration.  
      - Students receive new birth years. Ask: *"Does this change your bet? Why?"*  
      - No discussion yet—force personal reflection.  
    - **55–65 mins**: Second betting round.  
      - Rebet tokens with the same payoff table.  
    - **65–70 mins**: Group realization.  
      - Prompt: *"Compare your two bets. Did growth change your mind? How and why?"*  
      - **Let students supply the reversal**:  
        - High-number holders in Phase 1 (e.g., 900) likely remain confident in LS.  
        - *Mid/low-number holders (e.g., 5, 20, 40) experience shock*:  
          > "I had 45 originally and bet on SS. Now I have birth year 8. But in LS, early years are rare—so maybe I’m actually *more* likely to be in LS with a low birth year?"  

  #### **4. Debrief: Mapping the Concept (15 mins)**  
  Guide discussion *without technical terms*; use the activity’s language to derive concepts:  
  1. **Phase 1**: "You assumed you were a **random resident**."  
     - "What did that mean? You weighed how 'easy' it was to get your number in SS vs. LS."  
     - Map: "Random resident" → uniform sampling over a reference class (all people).  
  2. **Growth revelation**: "You learned births weren’t spread evenly—**early residents were rarer**."  
     - "How did that break your initial assumption? *You* didn’t change—the 'rules of being random' did."  
     - Map: Growth distorts sampling probabilities → your birth year isn’t uniform evidence.  
  3. **Positional reasoning**: "Why did your number *feel* like a clue at all?"  
     - "It relied on an invisible assumption: that you were equally likely to be any resident. Change the assumption, change the inference."  
     - Map: The "slippery pull" comes from an implicit reference class choice.  

  #### **5. Predictable Problems & Fixes**  
  - **Refusal to bet**:  
    - **Expected**: 1–3 students (often mid-number holders) abstain.  
    - **Is it a defect?** *No—it’s the most important moment.* Their refusal signals skepticism about the sampling assumption. Use it:  
      > "Why didn’t you bet? What felt unfair?" → Unlocks the reference class problem naturally.  
  - **Confusion in Phase 2**:  
    - **Evidence of failure**: Students say, "Why does growth matter? My number is still low!"  
    - **Fix**: Clarify with an extreme:  
      > "In LS, only 1 person was born in year 1, but 512 in year 10. If you have birth year 1, isn’t it 'strange' you’re that one early person?"  
  - **Bayesian missteps**:  
    - **Risk**: Students overlook that low birth years *favor LS* under growth.  
    - **Salvage**: Contrast two students:  
      - Student A (birth year 1): Rare in LS → *more likely in SS?*  
      - Student B (birth year 10): Common in LS → *more likely in LS?*  
      → "Growth upends who counts as 'typical'."  

  #### **6. Designer Warnings**  
  - **Least confident element**: **Phase 2 birth year redistribution**.  
    - **Risk**: Students may not *feel* the shift if the growth model isn’t visceral.  
    - **Evidence of failure**: Betting patterns barely change → students didn’t internalize non-uniform sampling.  
    - **Fix if needed**: **Simulate growth physically**.  
      > Stack 1 token for "year 1," 2 tokens for "year 2," ..., 512 tokens for "year 10." Have a student draw from the pile. The skewed distribution becomes tangible.  

  - **What the activity can’t teach (requires verbal unpacking)**:  
    > "This game *presumes* the reference class is 'all residents.' But is that right? Could it be 'all observers with my evidence' or 'all possible beings'? Real debates (e.g., the Doomsday Argument) turn on this choice—and there’s no consensus. Growth isn’t the real problem; the invisibility of the reference class is."  

  ---

  ### **Why This Works**  
  - **Hands-on pull**: Students *feel* the allure of positional reasoning when high numbers force a bet on LS.  
  - **Reversal via growth**: Growth makes sampling probabilities tangible, weakening intuition without jargon.  
  - **Pedagogical safety net**: The design anticipates pitfalls (e.g., betting refusal) and leverages them.  

  Run this as-is, and the "irresistible but slippery" idea will unfold in real time. If Phase 2 lags, pivot to token-stacking—it transforms abstract growth into visceral evidence.
