prompt: |-
  I'm a philosophy graduate student preparing for a seminar on persistence, and I keep running into the same unsatisfying contrast between endurantism and perdurantism. The usual presentation runs through the problem of temporary intrinsics — a thing is bent at one time, straight at another, and we ask whether the thing itself has incompatible properties or whether we should instead say that only its temporal parts (or its time-relative stand-ins) do. I understand that material well enough, but I find it a little canned, and I'd like to push the comparison somewhere less rehearsed. Please take the role of a philosopher of time with a strong background in the metaphysics of persistence, and work through the following carefully. Begin with an informal brainstorming pass in which you lay out the machinery of each view — what each posits, what each must paraphrase, and what each treats as primitive — and only then organize your answer into a considered comparison.

  Here is the case I want to press on. I've been trying to characterize a class of properties I'll call auto-relational: properties whose content essentially refers to another time in the very same object's career, such as being colder than it was yesterday, being older than it has ever been, being taller than it will be at any later point, or no longer being as fast as it once was. These are awkward for the standard taxonomy: they aren't straightforwardly intrinsic, since they seem to drag other times into the property itself, but they aren't straightforwardly extrinsic either, since the second relatum is just the thing again, not something distinct from it. Compare endurantism and perdurantism as accounts of what is going on when an object has an auto-relational property. Which view can take such properties at face value, and which has to reconstruct them out of something else? Does either end up requiring a relation that is neither intrinsic nor extrinsic, and if so, is that a genuine cost or merely a label for something the other view also needs? I'm especially interested in whether the two views differ in what they say about an object that has an auto-relational property at a moment when it has no corresponding intrinsic property — for instance, a thing that is colder than it was yesterday without any single intrinsic feature marking the comparison.

  Finally, tell me which of the two theories comes out ahead once auto-relational properties are on the table, and whether your verdict changes when we complicate the cases: suppose the object's history is gappy, so that it ceases to exist and later resumes, or suppose the earlier time it is being compared against is only vaguely or indefinitely located, so that it is warmer than it has ever been before but there is no fact of the matter about exactly which earlier moment supplies the comparison. State your verdict plainly, give the strongest objection to your own verdict, and say whether you think the endurantism/perdurantism dispute is substantive here or whether the two views are saying the same thing in different notation. Please don't simply recite textbook formulations of either position; I want to see you build the comparison rather than report it.
