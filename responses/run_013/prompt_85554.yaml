prompt: |-
  Next month I have to give this at the econ history seminar and I'm nervous. The room: mostly cliometricians who work on pre-industrial living standards and will want numbers, two phil-of-science people who'll say Popper and Lakatos inside the first five minutes, and one demographer who thinks the demographic transition just closes the case. My thesis is that Malthus's core claim wasn't refuted by the Industrial Revolution, it was outrun — and that there's a real difference between a theory being early and a theory being rescued rather than patched. The part I'm most attached to, and havent seen anyone make, is this: being early is only an available verdict for theories that predict a trend, not for theories that predict an event by a date; the latter can only be wrong or immunized. And my reading (maybe wrong) is that later Malthus already had the escape hatch inside the model via preventive checks, so the transition isn't the bolt-on everyone says it is. I've been arguing this on my blog for a year and now I have to say it to actual economists.

  Draft me the Q&A prep: the objections this room will actually raise, in their own vocabulary, ordered by how much damage they do, what I should concede up front, a two-minute reply to each plus a note on where the reply is soft, which single reply everything hangs on, and the question I'm praying nobody asks. Skip citations, I'll add those.
