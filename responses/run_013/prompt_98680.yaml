answer: |-
  ### Hedonism's Heterogeneity Problem: A Decision Tree  
  *Exploring the question: "What, if anything, do all pleasures have in common?"*  
  **Start with the data**: A warm bath, hearing good news, scratching an itch, and tasting sugar seem to share no obvious single feature.  

  #### Decision Tree:  
  1. **Is there a single feature common to all pleasures?**  
     - **YES** → Go to 2.  
     - **NO** → Go to 5.  

  2. **Is this feature a *sensory quality* (i.e., a distinct felt character, like "sweetness" or "warmth")?**  
     - **YES** → **Leaf: Sensory-Quality View**  
       - *Awkward commitment*: Must deny that the *same* sensation (e.g., warmth) can be pleasant in one context (cold day) and unpleasant in another (heatwave).  
     - **NO** → Go to 3.  

  3. **Is this feature a *pro-attitude* (e.g., "liking" or intrinsic desire for the experience)?**  
     - **YES** → **Leaf: Attitudinal/Liking View**  
       - *Awkward commitment*: Must allow that you can "like" an experience (e.g., a guilty pleasure) while simultaneously wishing you didn’t like it.  
     - **NO** → Go to 4.  

  4. **Is this feature the *satisfaction of a desire*?**  
     - **YES** → **Leaf: Desire-Satisfaction View**  
       - *Awkward commitment*: Must explain pleasures that lack prior desire (e.g., unexpectedly tasting a new fruit and enjoying it).  
     - **NO** → **Branch ends**: *No named position occupies this space*.  

  5. **Does "pleasure" still refer to a unified natural kind (e.g., via overlapping features)?**  
     - **YES** → **Leaf: Family-Resemblance Pluralism**  
       - *Awkward commitment*: Cannot point to *any* universal shared feature—only "cluster concepts" (e.g., motivation, positive affect, sensory tone).  
     - **NO** → **Leaf: Eliminativist View**  
       - *Awkward commitment*: Must discard "pleasure" as a coherent category in psychology/ethics (e.g., "pleasure" is a folk term for unrelated states).  

  ---

  ### Key Notes:  
  - **Unoccupied branch**: The space where theorists answer **YES** to Q1 but **NO** to Q2, Q3, *and* Q4 (e.g., a non-sensory, non-attitudinal, non-desire feature) lacks a named position.  
  - **Tree limitations**:  
    - **Attitudinal vs. Desire-Satisfaction views** can be hard to distinguish in cases of "liking without wanting" (e.g., depression) or "wanting without liking" (e.g., addiction). The tree splits them via Q3 (pro-attitude) vs. Q4 (desire-satisfaction), but some hybrid views blur this line.  
  - **Problem cases routed**:  
    - *Warm bath vs. heatwave*: Challenges Sensory-Quality View (Q2 → YES).  
    - *Guilty pleasures*: Challenges Attitudinal View (Q3 → YES).  

  ---

  ### Positions at a Glance  
  | **Leaf**                          | **Core Claim**                                  | **Weakness**                                  |  
  |------------------------------------|------------------------------------------------|-----------------------------------------------|  
  | Sensory-Quality View     | Pleasures share a uniform felt quality.         | Same sensation (e.g., warmth) can feel pleasant/unpleasant. |  
  | Attitudinal/Liking View  | Pleasure is an attitude of "liking" an experience. | Compatible with conflicted attitudes (e.g., guilt). |  
  | Desire-Satisfaction View | Pleasure is the fulfillment of a desire.        | Fails for pleasures without prior desire.     |  
  | Family-Resemblance Pluralism | Pleasures share overlapping features (no universal). | No single feature binds all pleasures.        |  
  | Eliminativist View       | "Pleasure" isn’t a natural kind.                | Requires abandoning intuitive pleasure-talk. |  

  Use this tree to navigate classic responses to heterogeneity—and test which view survives the problem cases!
