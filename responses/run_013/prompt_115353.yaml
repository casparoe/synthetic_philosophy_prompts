     - The trader can make the offers in a different order or disguise the pump. For example, interleave other trades. But Jane's rule is specifically about ending up with the same good and less money. The defender might argue that the pumped flag is not a legitimate part of the outcome; it's a belief about the process. The agent should only care about the final bundle (good and money). In that case, at step c, she has (B, -20) and the offer is to move to (A, -30). She prefers A to B, and she has less money. If she prefers (A, -30) to (B, -20), she should accept. But by her cycle, we don't know how she compares (A, -30) and (B, -20). We only know the cycle for the goods alone. So we must define her preferences over (good, money) bundles.

     To make it work, we must assume that her preferences over bundles are such that the trade from (B, -20) to (A, -30) is not improvement. For example, if the utility of money is linear and sufficiently large, she might prefer (B, -20) to (A, -30) because -20 > -30, and the difference in money is larger than the difference in goods. But then the cycle in goods alone is not sufficient; we need to know the tradeoffs.

     This is messy.

