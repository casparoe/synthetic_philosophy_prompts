answer: |-
  Below is a claim-by-claim audit of the précis of Adam Smith's ethics, based on specialist consensus and Smith's own texts (primarily *The Theory of Moral Sentiments*, or TMS). I assess each claim as **Accepted**, **Defensible Simplification**, or **Rejected**, with explanations for half-truths. After addressing the relativist charge, I evaluate the book's overall conclusion.

  ---

  ### Claim-by-Claim Audit

  1. **"Smith's whole ethics rests on sympathy..."**  
     **Assessment:** Defensible Simplification.  
     **Explanation:** Sympathy is indeed the *foundation*, but Smith defines it not as literally "feeling what another feels" (emotional contagion), but as imaginative perspective-taking: we project ourselves into another's situation to understand their emotions (TMS I.i.1.2). Crucially, sympathy requires *concord* between observer and observed, not identical feeling. The half-truth here is that sympathy is central, but the mechanism is cognitive and imaginative, not purely affective. The smuggled-in element is passivity; Smithian sympathy is an active exercise of judgment.

  2. **"...he builds the impartial spectator: when we want to know whether an action is right, we imagine a spectator who has no stake in the matter..."**  
     **Assessment:** Accepted.  
     **Explanation:** This is accurate. The impartial spectator (IS) is a device for moral deliberation, where we abstract from personal bias by imagining how a "well-informed bystander" would judge us (TMS III.1.2). Smith stresses we must "divide ourselves" from our passions to achieve objectivity.

  3. **"The device is the ancestor of the modern ideal-observer and veil-of-ignorance traditions; in effect, we strip away the information that tells us who we are..."**  
     **Assessment:** Half-Truth (leaning toward Defensible Simplification).  
     **Explanation:** The comparison to ideal-observer theories is broadly valid, as both seek objectivity through abstraction. However, the veil-of-ignorance analogy is misleading. Rawls' veil explicitly strips knowledge of social position to ensure fairness, while Smith's IS strips *emotional bias* but retains knowledge of context, identity, and consequences (TMS III.3.3). Smith never suggests ignorance of who we *are*; we remain situated actors judging specific cases. The "stripping away" is limited to partiality, not identity.

  4. **"Since sympathy is the sole source of moral approval, what the impartial spectator ends up approving of is whatever makes for the greatest happiness, and Smith is a utilitarian in disguise."**  
     **Assessment:** Rejected.  
     **Explanation:** This is a serious misreading. Smith explicitly *rejects* utility as the foundation of morality (TMS IV.2.3-7), arguing we approve of justice or generosity because they *deserve* approval through sympathy, not because they maximise happiness. The IS approves actions that elicit sympathetic concord in context, including non-utilitarian virtues like prudence, courage, and justice (which Smith calls "negative virtue"). Happiness matters, but it is not the *standard* of approval. The "sole source" half-truth ignores Smith's emphasis on propriety and desert. Utilitarianism is smuggled in here.

  5. **"Custom and fashion can corrupt our moral sentiments... the impartial spectator is really the voice of his own society internalised."**  
     **Assessment:** Half-Truth (Defensible but Incomplete).  
     **Explanation:** Smith *does* argue custom and fashion distort moral sentiments (TMS V.2.1), and the IS is socially shaped. However, he insists the IS can *transcend* local prejudices through critical reflection (TMS III.3.38-43). The IS is not *merely* society's voice—it is a tool for self-critique. The half-truth implies determinism; Smith allows for moral progress via the IS's self-correcting function.

  6. **"The gulf between his two books... cannot be closed... he has no answer to the relativist."**  
     **Assessment:** Rejected (on both counts).  
     **Explanation:** The alleged "gulf" between TMS (sympathy) and *Wealth of Nations* (self-interest) is the outdated "Adam Smith Problem." Specialists now see consistency: self-interest in markets operates within moral bounds set by sympathy and the IS (e.g., commercial society relies on trust and fairness). On relativism, Smith *does* offer answers (see below).

  ---

  ### The Relativist Charge: Analysis
  **Strongest Case for Relativism:**  
  Smith admits customs can make practices like infanticide (Sparta) or suttee (India) seem locally acceptable (TMS V.2.15). If the IS is socially formed and sympathy is culturally variable, moral judgments appear contingent. No transcendent standard exists—only the spectator, who is a product of their milieu.

  **Best Reply from Smith:**  
  The IS is not *bound* by culture. Smith describes a process where individuals use the IS to question local norms: we can recognise that a "remote" spectator (e.g., from another era) might condemn our society’s practices (TMS III.3.38). This implies cross-cultural moral constants (e.g., condemning unnecessary cruelty). The IS is a *counter* to relativism because it demands we justify our sentiments to an imagined outsider, fostering self-criticism and convergence toward "general rules" of morality (TMS III.4.7-12).

  **Judgement on the Reply:**  
  The reply succeeds partially. Smith avoids hard relativism by making the IS self-correcting and grounded in shared human psychology. However, he offers no *ultimate* foundation beyond intersubjective agreement. This leaves "soft" relativism—moral truths are discoverable through reflection but remain context-sensitive. The IS is a bulwark against arbitrariness but not a transcendental guarantee.

  ---

  ### Does the Book’s Conclusion Survive?
  **Book’s Conclusion:** Smith is a "utilitarian in disguise" whose ethics collapses into relativism due to a split between sympathy and self-interest.

  **Audited Verdict:** The conclusion **does not survive**.  
  - **Mechanics:** The core mechanics (sympathy → IS) are largely correct, though sympathy's definition needs refinement.  
  - **Standard of Right:** The utilitarian claim is decisively wrong. Smith’s standard is *propriety* (fittingness to situation) and *desert*, not happiness maximisation.  
  - **Relativism/Gulf:** The "gulf" between books is a myth, and Smith has tools to resist crude relativism.  

  **Most Critical Correction:** Rejecting **utilitarianism**. This undermines the entire "disguise" narrative and reshapes the IS’s role. The IS approves what merits sympathy through propriety, not what optimises utility. Once corrected, Smith’s ethics looks less like proto-Bentham and more like a distinctive virtue- and sentiment-based system.  

  **Why This Matters for the Rest:**  
  If Smith isn’t utilitarian, his alleged relativism weakens. Propriety and the IS’s self-correcting nature provide a non-relativist (though fallible) standard. The unity of his work also becomes clearer: commercial self-interest in *WN* is embedded in the moral psychology of TMS, with the IS ensuring markets serve human flourishing under rules of justice. The book’s summary mistakes Smith’s standard of judgment, leading to a chain of misreadings.

  ---

  In sum: the précis is a competent but flawed sketch. It captures the architecture of Smith’s ethics but mislabels its purpose and destination. A specialist would reject its utilitarian framing and relativist fatalism, while accepting its core mechanism with qualifications. The deepest error is reducing Smith’s rich, propriety-based ethics to a happiness calculus—an oversight that distorts everything downstream.
