prompt: |-
  I'm a teaching assistant grading short-answer exam responses for an undergraduate ethics course. The question was: "Explain the distinction between killing and letting die, and evaluate whether that distinction is morally significant. Support your answer with at least one concrete case or argument." One student's answer reads:

  "The distinction between killing and letting die turns on whether an agent does something that brings about a death or merely allows a death to occur by not intervening. Rachels's famous pair of cases makes the contrast vivid: Smith drowns his young cousin in the bath in order to secure an inheritance, while Jones, with the same motive, stands by and watches as the child slips under and drowns. Most of us judge the two men equally blameworthy. Since the only difference between them is the bare difference between an act and an omission, and since that difference does not change our moral verdict, the distinction between killing and letting die cannot itself be doing any moral work. Rachels therefore concludes that the distinction should be abandoned.

  The distinction is usually thought to matter because it tracks the difference between negative and positive duties: we have a strict duty not to harm others, but our duty to help is weaker and more limited, so killing is worse than letting die. The distinction also lines up with the difference between intending a death and merely foreseeing it. When a doctor gives a lethal injection, the death is intended; when a doctor merely withholds a treatment, the death is foreseen but not intended. So the real moral line here is between intending harm and foreseeing it, not between acting and omitting.

  Cases like withdrawing a ventilator make the classification harder, since switching the machine off looks like an act. I take it the standard view is nonetheless that withdrawing life support is letting die, because it is the underlying disease, not the doctor, that does the killing. All things considered, the distinction matters less than people suppose, and Rachels is right that killing and letting die are morally equivalent."

  Please grade this response. I want the grade justified by specific, point-by-point comments rather than a general impression. Organize your answer under these headings, in this order: "Grade" — a single line giving a letter grade and one sentence of justification. "What earns credit" — roughly 100 words naming what the student has genuinely got right. "Problems, point by point" — roughly 250 words; take each distinct problem separately, state precisely what the student claims, explain what is wrong with it or why it does not follow, and say how much it should cost them. "Comments for the student" — roughly 150 words of feedback addressed directly to the student, phrased so that they can see and repair the errors without being handed a complete model answer. Hold the response to the standard of a good undergraduate paper: do not let a claim pass merely because it sounds plausible or uses the right vocabulary.
reasoning: |-
  Hmm, the user is a teaching assistant grading an ethics exam response about the distinction between killing and letting die. They've shared a student's answer and want me to grade it with specific feedback. I need to follow their structure: Grade, What earns credit, Problems point by point, and Comments for the student.

  Looking at the student's response, they did several things well. They accurately described Rachels's bathtub cases and showed understanding of how Rachels uses them to argue against the moral significance of the killing/letting die distinction. They correctly identified key arguments about negative vs. positive duties and intention vs. foresight. They even engaged with a complex case like ventilator withdrawal. This demonstrates solid comprehension of core concepts and philosophers.

  But there are significant problems too. The student misrepresents the standard view on ventilator withdrawal, incorrectly claiming it's considered letting die because the disease causes death - this ignores the active nature of switching off machines. They also incorrectly state that Rachels believes killing and letting die are morally equivalent without acknowledging his actual, more nuanced position about equivalent blameworthiness in specific cases. Additionally, they make an unsupported claim that intention vs. foresight is the "real moral line," which oversimplifies complex debates in ethics. Finally, they don't properly address the evaluation part of the prompt - they assert Rachels is right but don't substantiate this evaluation with sufficient argument.

  For the grade, this is a B- (80%). The student demonstrates good knowledge but has significant errors in interpretation and doesn fully develop the evaluation component. 

  In my feedback to the student, I'll point out where they need to correct misinterpretations (Rachels, ventilator case), challenge oversimplifications (intention claim), and strengthen their evaluation. I won't give them a model answer but will guide them toward recognizing and fixing these issues themselves. The tone should be constructive - acknowledging what they did well while clearly identifying where they need improvement.
answer: |-
  **Grade**  
  B- (80%). The response demonstrates good understanding of core concepts but contains significant misinterpretations and fails to fully support its evaluation.

  **What earns credit**  
  The student correctly summarizes Rachels's bathtub cases and their purpose (to challenge the moral significance of the killing/letting die distinction). They accurately identify key arguments for why the distinction *is* often thought to matter (negative/positive duties; intention/foresight). The reference to ventilator withdrawal engages a relevant complication. Overall, the response shows comprehension of foundational readings and structures the answer logically.

  **Problems, point by point**  
  1.  **Misrepresentation of the standard view on withdrawing life-support:**  
      *Student Claim:* "Withdrawing life support is letting die because it is the underlying disease, not the doctor, that does the killing."  
      *Problem & Cost:* This is incorrect. The standard justification (e.g., in law and medical ethics) classifies withdrawing life support as letting die *despite* it being an act (like flipping a switch), primarily because it is seen as *ceasing an intervention* rather than initiating a new harm. The appeal to the "underlying disease" as the cause is misleading; the act of withdrawal *allows* the disease to cause death. This mischaracterization weakens the analysis of a key case. (-3 points)

  2.  **Misstatement of Rachels's Conclusion:**  
      *Student Claim:* Rachels "concludes that the distinction should be abandoned" and that "killing and letting die are morally equivalent."  
      *Problem & Cost:* Rachels argues that the *bare distinction* (act vs. omission) itself lacks *intrinsic* moral significance and cannot *by itself* explain the difference in blameworthiness in cases like Smith and Jones. He does *not* conclude that killing and letting die are *always* morally equivalent. His point is that other factors (like motive, intention, consequences) are doing the moral work. The student overstates Rachels's position. (-4 points)

  3.  **Unsubstantiated Assertion about Intention:**  
      *Student Claim:* "So the real moral line here is between intending harm and foreseeing it, not between acting and omitting."  
      *Problem & Cost:* While the intention/foresight distinction (Doctrine of Double Effect) is a major counter-argument to Rachels, the student presents it as an established truth ("the real moral line") without evaluation or acknowledging its controversies. The prompt requires evaluation, but this claim is merely asserted, not argued for or critically examined. It functions as an unsupported premise. (-3 points)

  4.  **Insufficient Evaluation:**  
      *Student Claim:* "All things considered, the distinction matters less than people suppose, and Rachels is right that killing and letting die are morally equivalent." (See also point 2 on misstating Rachels).  
      *Problem & Cost:* The prompt explicitly asks to "evaluate whether that distinction is morally significant." The student's evaluation boils down to agreeing with Rachels, but:  
      a)  They misstate Rachels's conclusion (Point 2).  
      b)  They fail to genuinely *support* their evaluation beyond referencing Rachels's cases. They don't grapple with the counter-arguments they mention (duties, intention) or other complexities. The claim of equivalence is asserted, not argued for in the face of opposing views. This is the core weakness. (-5 points)

  **Comments for the student**  
  You demonstrate a solid grasp of Rachels's core argument and key concepts like negative/positive duties and intention/foresight. To improve:

  1.  **Check Interpretations:** Revisit Rachels's text. Does he claim killing and letting die are *always* morally equivalent, or does his argument target the *explanatory power* of the bare act/omission distinction? Your summary of his conclusion is too broad.
  2.  **Deepen Case Analysis:** Your ventilator example is good, but your explanation of *why* it's classified as letting die needs refinement. The standard view hinges on stopping an intervention, not the disease being the sole cause. Why might this classification be debated?
  3.  **Strengthen Evaluation:** The prompt requires you to take a stance and *support* it. You state agreement with Rachels, but you need to explicitly address the counter-arguments you mention (duties, intention). *Why* do those arguments fail to show the distinction matters? Or, if they succeed, why do you still side with Rachels? Simply stating agreement isn't sufficient evaluation.
  4.  **Avoid Assertion:** Be cautious of presenting complex philosophical positions (like intention/foresight being the "real moral line") as settled facts without argument, especially when evaluating a competing view.
