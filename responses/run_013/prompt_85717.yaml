prompt: |-
  I'm a second-year grad student and I'm in a philosophy of science seminar that's been doing the Bayesian stuff, and there's a shape of situation that keeps coming up that I can't put a name to. First time I noticed it: I do a lot of birdwatching and I'm trying to ID a warbler from a phone photo that came out blurry and a two-second recording of its song that's half drowned out by a lawnmower. I come away thinking it's probably a blackpoll, maybe a bay-breasted. Now, I definately did not learn, with certainty, "the bird is a blackpoll." But my confidence in the two clearly moved -- from something like fifty-fifty to something like eighty-twenty. And it moved in a way that feels like averaging: as if I took how the two species compare in blurry photos like this one and weighted those comparisons by how likely each species was to have produced this particular smear of pixels and this particular squawk. Second time: I have a cheap home blood pressure cuff that keeps giving me readings in a grey zone, and my confidence that I've got high blood pressure goes up, but again there's no crisp fact I've learned. My roommate, who does stats, says I'm overthinking it, which is probably true, but I want to know what the thing is called.

  So: is there an established name for this situation and for the rule that handles it? The textbook move -- just condition on what you learned -- seems to presuppose that you're certain what your evidence is, which is exactly what I don't have here, so I assume someone has formalized the averaging idea, and I want to know what it's called and what it quietly assumes. Here's the part that really bugs me, though, and makes me think the standard story is incomplete. In both cases, once I start thinking about how unreliable the source is, my view of how the two options compare *given* the observation starts to shift as well. I realize my phone camera mangles yellow-green warblers specifically, so "given that I'm looking at this smear" stops being a neutral comparison between blackpoll and bay-breasted; the cuff, I read somewhere, runs high on people with thin arms, and now I don't trust the reading the same way I did a second ago. The rule I'm imagining seems to need those comparisons to stay put while only the weights move -- but in real life the comparisons move too, and then I have no idea what to do, or whether there's any principled thing to do at all.

  So what I'd like is this. Is there a name for the phenomenon and the rule in the simple case? Is there a name for the extra assumption that rule needs, the one about the comparisons staying fixed? And does anyone have a name, or a worked-out account, for what you're supposed to do when that assumption fails? If the last one doesn't have a name, please coin one, define it, and tell me how it relates to the other two. I care much less about the labels than about the carving: what's actually the same and what's different across the bird, the cuff, and the case where the comparisons shift, and where the edges of each thing are. And please don't just tell me it's all subjective -- I want the structure.
reasoning: |-
  Okay, let me unpack this user's query. They're a second-year grad student in a philosophy of science seminar focusing on Bayesian approaches. The core issue is about updating beliefs with ambiguous evidence—like identifying a blurry bird photo or interpreting noisy blood pressure readings. They've noticed their confidence shifts between options without learning any certain facts, and they're describing a process that feels like weighted averaging. 

  The user mentions two key examples: the warbler ID with unreliable sensory data, and the blood pressure cuff with measurement errors. In both cases, their confidence moves from 50-50 to 80-20, but they emphasize no crisp evidence was obtained. That’s interesting—they’re intuitively grasping that standard Bayesian conditioning (which assumes certainty about evidence) doesn’t fit here. 

  Then comes the twist: when they reflect on the evidence’s unreliability (e.g., the camera distorting yellow-green warblers or the cuff biasing thin-armed people), their interpretation of the evidence itself changes. This breaks the "fixed comparison" assumption they suspect is lurking in their mental model. Their deeper frustration is about the lack of tools when evidence reliability is uncertain and dynamic. 

  What they explicitly want: names for (1) the basic phenomenon, (2) its underlying assumption, and (3) the case where that assumption fails. But reading between the lines, they’re really seeking conceptual clarity—a structured way to distinguish these epistemic scenarios without resorting to "it’s all subjective." They care about formal rigor but dislike hand-waving. 

  Hmm, their examples are perfect for discussing imprecise evidence. The bird case involves ambiguous perception (blurry pixels, noisy audio), while the cuff is about instrument error. Both are instances where the likelihood function isn’t sharp because the evidence isn’t cleanly categorizable. 

  For the simple case, Jeffrey conditionalization fits perfectly—it’s designed for uncertain evidence where you directly update credences over hypotheses. The "weights" they describe are the posterior credences over hypotheses, and the "comparisons" are the likelihoods. But they’re right that Jeffrey’s rule assumes fixed likelihoods (P(E|H)) even as credences shift. 

  Ah, and that’s where their second concern hits: when you question the evidence-generating process (e.g., camera distortions), the likelihoods themselves become unstable. This is the "problem of uncertain evidence" or "higher-order uncertainty"—now you’re uncertain about the very model linking hypotheses to evidence. 

  For this, I’ll need to mention approaches like hierarchical Bayesian models (adding hyperparameters for reliability) or Dempster-Shafer theory (handling ignorance). But since they want structure, I should emphasize that the key difference is whether uncertainty is first-order (what the evidence says) or second-order (how the evidence relates to truth). 

  They’ll probably appreciate distinguishing between "Jeffrey shifts" (simple case) and "model instability" (complex case). Naming the fixed-likelihood assumption "likelihood rigidity" (as Richard Jeffrey did) will resonate. For the failure case, terms like "higher-order uncertainty" or "model ambiguity" work, but I might also offer "evidence fragility" as a vivid coinage. 

  Finally, their meta-concern: they want to avoid subjectivity claims and see the epistemic structure. So I’ll map their examples explicitly: Bird/cuff simple case → Jeffrey; Bird/cuff with reliability doubts → model uncertainty; and stress that the latter requires either expanding the hypothesis space or accepting imprecision. 

  ...And I must resist the urge to dive into tangent about birdwatching epistemology. Focus!
answer: |-
  You've hit on a profound and beautifully articulated challenge at the frontier of Bayesian epistemology – and you're absolutely right that the standard "just condition on E" story is incomplete for messy, real-world evidence. Here's the carving you requested, with names and structure:

  1.  **The Simple Case: Updating with Uncertain Evidence (Your Bird/Blood Pressure Initial Shift)**
      *   **The Phenomenon:** **Jeffrey Conditionalization** (or **Probability Kinematics**).
      *   **The Rule:** When you gain new sensory input (*not* a crisp proposition `E`) that directly shifts your confidence over a partition of hypotheses (`H1, H2, ..., Hn`), you update *as if* you had learned a probability distribution over those hypotheses.
      *   **Formalization:** Your prior `P_old(H_i)` is replaced by `P_new(H_i)`, where the `P_new(H_i)` values are set directly by your assessment of the impact of the ambiguous evidence. Your posterior for any other proposition `A` becomes: `P_new(A) = Σ_i [P_new(H_i) * P_old(A | H_i)]`.
      *   **What it Matches:** Your description of "averaging" is spot-on. Jeffrey Conditionalization *is* essentially a weighted average of the hypotheses' predictions for `A`, using the *new* confidences (`P_new(H_i)`) as weights and the *old* conditional probabilities (`P_old(A | H_i)`) as the terms being averaged.
      *   **What it Assumes (The Fixed Comparisons):** **Likelihood Rigidity** (or **Stable Conditional Probabilities**). This is the critical assumption you identified. Jeffrey Conditionalization requires that the relationships *between* the hypotheses and *other* propositions (`A`) remain fixed *given the hypotheses* – that is, `P_new(A | H_i) = P_old(A | H_i)` for all `A` and all `H_i`. The rule updates your *credences in the hypotheses* (`P(H_i)`) but treats the *predictive power* of each hypothesis (`P(A | H_i)`) as unchanged by the ambiguous evidence itself.
      *   **Your Examples:** Your initial shift from 50-50 to 80-20 for Blackpoll vs. Bay-breasted based on the blur/squawk, or increased confidence in hypertension based on the grey-zone cuff reading, are textbook cases where Jeffrey Conditionalization applies *if* you assume Likelihood Rigidity. You directly estimated `P_new(Blackpoll)` and `P_new(Bay-breasted)`.

  2.  **The Assumption: Likelihood Rigidity (The "Fixed Comparisons")**
      *   **The Name:** **Likelihood Rigidity** (Richard Jeffrey's term).
      *   **What It Is:** The assumption that the conditional probabilities `P(A | H_i)` for any proposition `A` *given any specific hypothesis `H_i`* do not change when you receive the ambiguous evidence triggering the Jeffrey update. It holds the *model* of how the world (H_i) generates predictions (A) constant, while only updating your belief *about which H_i is true*.
      *   **Why It's Needed:** Without this, the weighted average `P_new(A) = Σ_i [P_new(H_i) * P_old(A | H_i)]` is unjustified. If `P(A | H_i)` itself changes because of the evidence, this simple formula breaks down.
      *   **The Quiet Part:** This assumes the ambiguous evidence doesn't teach you anything *new* about *how* the hypotheses connect to the world; it only teaches you about *which* hypothesis is more likely. It assumes your understanding of the *mechanisms* (how cameras distort warbler colors, how cuffs measure pressure) is already complete and correct.

  3.  **When the Assumption Fails: Uncertain Evidence *and* Uncertain Models (Your Realization about Camera/Cuff Biases)**
      *   **The Phenomenon:** **Higher-Order Uncertainty** or **Model Ambiguity**.
      *   **The Problem:** The ambiguous evidence isn't *just* telling you something about the hypotheses (Blackpoll vs. Bay-breasted, Hypertension vs. Normal), it's *also* making you realize your *model* of how evidence is generated (the likelihoods `P(Blur | Species)`, `P(Reading | BP)`) might be wrong or incomplete. Your uncertainty isn't just first-order (which H_i?), it's second-order (is my `P(E | H_i)` even correct?).
      *   **Why Jeffrey Breaks:** The core assumption of Likelihood Rigidity is violated. You no longer trust `P_old(Blur | Blackpoll)` or `P_old(Reading | Hypertension)` because you've learned your *sensor model* (camera, cuff) or *perceptual model* has systematic biases you hadn't accounted for. The "comparisons" (`P(A | H_i)`) themselves become unstable.
      *   **The Coined Name & Account:** **Evidence Fragility**.
      *   **Definition:** Evidence Fragility occurs when ambiguous sensory input not only provides information about the target hypotheses but also induces significant uncertainty about the reliability or structure of the very process generating the evidence, undermining the stability of the conditional probabilities (`P(E | H_i)`) used in the update rule.
      *   **What to Do (The Structure):** There's no single, universally agreed-upon solution, but principled approaches exist within Bayesian frameworks:
          *   **Expand the Hypothesis Space:** Make the potential *biases* or *failure modes* explicit hypotheses. Instead of just `{Blackpoll, Bay-breasted}`, include `{Blackpoll & Camera Good, Blackpoll & Camera Mangles Yellow, Bay-breasted & Camera Good, Bay-breasted & Camera Mangles Yellow, ...}`. This blows up complexity but formally captures the uncertainty. Update on the ambiguous evidence *within this larger space* (using standard or Jeffrey-like updates *if* rigidity holds *within* this larger model). Your prior beliefs about camera reliability become crucial.
          *   **Hierarchical Bayesian Modeling:** Introduce *hyperparameters* representing the reliability or bias of your sensor/perception. You have priors over these hyperparameters *and* over the hypotheses. The ambiguous evidence updates your beliefs about *everything* simultaneously – the hypothesis, the reliability, and how they interact. This is more elegant but computationally harder.
          *   **Imprecise Probabilities / Credal Sets:** Instead of a single probability distribution, represent your belief state as a *set* of distributions compatible with your knowledge. The ambiguous evidence might rule out some distributions but leave a wider set than before, reflecting your increased overall uncertainty about *both* the hypothesis and the model. Updating involves finding the set of posteriors derived from all priors in your set using the rule (like Jeffrey) *if* rigidity holds *for each prior in the set*. Evidence Fragility often manifests as this set becoming larger/wider.
          *   **Dempster-Shafer Theory / Belief Functions:** These frameworks explicitly separate *belief* (supported by evidence) from *plausibility* (not contradicted by evidence) and can naturally represent ignorance about the evidence-generating mechanism. They handle ambiguous evidence and uncertain reliability more natively than standard probability, though the updating rules are different.
      *   **Relation to the Simple Case:** Evidence Fragility is the breakdown of the conditions required for the simple Jeffrey update. The simple case (Jeffrey Conditionalization) is a special instance where Likelihood Rigidity holds despite the evidence being ambiguous. Evidence Fragility occurs when the ambiguous evidence *itself* undermines that rigidity. Your bird/cuff examples started as candidates for the simple case but *became* cases of Evidence Fragility when you reflected on the source's specific unreliability.

  **The Carving: Bird, Cuff, and Shifting Comparisons**

  *   **Bird ID Initial Blur/Squawk:** Ambiguous evidence → Direct shift in confidence over hypotheses → **Jeffrey Conditionalization** *assuming* Likelihood Rigidity (`P(Blur/Squawk | Species)` is known/stable).
  *   **Cuff Initial Grey Zone:** Ambiguous evidence → Direct shift in confidence over hypotheses → **Jeffrey Conditionalization** *assuming* Likelihood Rigidity (`P(GreyZone | BP Status)` is known/stable).
  *   **Realization Camera Mangles Yellow:** Ambiguous evidence induces doubt about the evidence-generation model → **Likelihood Rigidity violated** → **Evidence Fragility**. Requires expanding the hypothesis space (include camera bias) or moving to hierarchical/imprecise models.
  *   **Realization Cuff Biased for Thin Arms:** Ambiguous evidence induces doubt about the evidence-generation model → **Likelihood Rigidity violated** → **Evidence Fragility**. Requires expanding the hypothesis space (include cuff bias) or moving to hierarchical/imprecise models.

  **The Edges:**

  *   **Jeffrey Conditionalization (Simple Case):** Ambiguity about *which hypothesis* is true, but *certainty/rigidity* about *how each hypothesis manifests* in the evidence domain (`P(E | H_i)` is fixed and known).
  *   **Evidence Fragility (Complex Case):** Ambiguity about *which hypothesis* is true *combined with* ambiguity about *how the evidence is generated or perceived* given the hypotheses (`P(E | H_i)` itself is uncertain or unstable due to the evidence). The evidence forces you to question your understanding of the measurement/perception process.

  You're not overthinking it; you're thinking *deeply* about a crucial limitation of the simplest Bayesian stories. Evidence Fragility is where the clean math meets the messy reality of unreliable senses and instruments. The structure exists (expanding hypotheses, hierarchical models, imprecise probabilities), but it demands more sophisticated modeling and often more subjective input about potential failure modes. Keep grappling with it – this is where the philosophy gets really interesting.
