  I'm drafting a term-paper proposal (two to three pages) for a decision-theory seminar and want help turning a half-formed idea into something with a defensible scope. My idea: the backward-induction problem in the centipede game is usually treated as a problem about common knowledge of rationality, and I think that diagnosis misplaces the difficulty. The real fault line, I want to argue, is the unit of rational evaluation. Backward induction is the unique prediction of a node-local conception of practical reason — at each decision point, choose the best action given what you expect to follow — whereas a course-of-action conception, which evaluates a plan by where it leads over the whole sequence, leaves the game underdetermined. Write the proposal. State the question so that it has a determinate answer, and in particular make precise what it would mean for the two conceptions to be genuinely distinct rather than notational variants; I want the central sub-question to be whether every course-of-action recommendation can be redescribed as a node-local one under suitable beliefs, and whether the converse fails. Explain why the existing treatments leave this open. Give the method: the formal apparatus I would need, which variants of the centipede I would construct to pry the two conceptions apart (length, payoff structure, commitment moves, number of players), and the order in which I would do it. Say what a result would look like and what would count as failure — I would rather learn early that the distinction collapses than end up defending something unfalsifiable. And give a realistic scope for one semester, including what to cut. I will supply the references myself, so no bibliography and no inventory of who has said what.
