prompt: |-
  Ok so I need help with something a little unusual. I'm a second-year phil PhD and after a pretty bad year my anxiety has gotten rough — and the thing I can't stop chewing on is that when I'm anxious, the world honestly *looks* different. Neutral faces read as menacing, corridors look narrower, that kind of thing. My therapist keeps saying "your thoughts are coloring how you perceive things", which sounds like it should be obviously true. But my one friend in the department who does philosophy of mind says that's basically impossible — perception is encapsulated, and what's actually changing is my attention or my judgment, and if I think my beliefs are changing what I literally see then I've just confused seeing with believing. Both of them are so confident about it. I want to know what the real positions are here, and every summary I find just lines up the usual -isms in a row without ever telling me where they actually come apart.

  So: you're a philosopher of perception / cognitive scientist who knows this debate cold — the modularity stuff, the predictive processing stuff, the whole empirical literature on emotion and perception. Take your time with this one, it's only useful if the branches are real. Before you draw anything, brainstorm the logical space for yourself: what are the genuinely independent questions someone could answer differently here? Then place the positions in that space. I want a one-page decision tree to hand out at our perception reading group, starting from the plain-English question of whether your moods and beliefs change what you literally see, and branching down to named positions, roughly six to nine leaves.

  Some constraints:
  - every node has to be a question someone could answer without already knowing which position it leads to — no "are you a modularist?" nodes.
  - each leaf gets the position's name (or "unnamed" if nobody really holds it) plus one sentence on its most awkward commitment.
  - please include these cases: the anxious person and the menacing neutral face; the birder who swears the trees are suddenly full of birds; the wine expert; the duck-rabbit; that old study where kids from poorer families judged coins as physically bigger (I forget who did it, don't cite it, just describe it); and the cough that replaces a phoneme but you still hear the word.
  - the distinctions I care most about: content vs. phenomenology, online vs. offline effects, and whether attention and emotion count as "cognitive" at all.
  - if two leaves turn out to be indistinguishable by your questions, say so rather than pretending the tree seperates them, and tell me which answer-combinations nobody occupies and whether that's because the view is incoherent, unattractive, or just unexplored.

  No citations, I'll add those myself — and don't just name-drop, a reader should be able to tell what they'd have to give up to land on each leaf.
