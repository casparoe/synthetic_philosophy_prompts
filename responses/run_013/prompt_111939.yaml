answer: |-
  ## Prospectus: The Architecture of Atrocity Naming - Conceptual Engineering for Distinct Functional Roles

  **Project Title:** Beyond Definitional Deadlock: A Functional Analysis of Atrocity Naming as Conceptual Engineering

  **Principal Investigator:** [Your Name], Doctoral Candidate, Department of Philosophy, [Your University]
  **Advisor:** [Your Advisor's Name]
  **Fellowship Sought:** Dissertation-Completion Fellowship (12 months)

  **1. Core Research Question & Problem Statement:**
  This dissertation asks: **How can we resolve persistent disputes over naming mass atrocities (like "genocide") by analyzing the distinct, incompatible functional roles that such naming serves, thereby distinguishing substantive disagreements about facts or values from merely verbal disputes rooted in divergent conceptual purposes?** The perennial impasse in atrocity naming stems from the assumption that a single, monolithic definition must serve all purposes simultaneously. The standard critiques – that the legal definition (particularly of genocide) is too narrow, or that the concept is irredeemably contested – fail because they remain trapped within this flawed assumption. The narrowness critique implicitly demands a single, broader definition, while the contestation critique often leads to paralysis or dismisses disputes as purely semantic. Neither addresses the core problem: we are forcing one conceptual tool to perform jobs requiring different, often conflicting, designs. The verdict of "essential contestation" merely describes the symptom without offering diagnostic or prescriptive tools.

  **2. Original Contribution: The Functional Roles Framework:**
  This project breaks the deadlock by arguing that naming an atrocity is not a singular act of definitional discovery, but a complex practice involving several distinct functional roles, each with its own success conditions:

  *   **Jurisdictional Role:** Triggers specific legal obligations, court jurisdiction (e.g., ICC, ICJ), and institutional responses (e.g., R2P *in extremis*). *Success requires:* Thin, bright-line, administratively clear criteria (e.g., specific protected groups, acts, intent thresholds) for predictable, consistent application by courts and states.
  *   **Recognitional Role:** Affirms to victims and history the nature and gravity of the harm suffered, validating their experience and ensuring its place in collective memory. *Success requires:* Thick, context-sensitive, morally resonant concepts capturing the lived experience and specific intent to destroy identity.
  *   **Explanatory Role:** Identifies and analyzes a distinct socio-political *process* or pattern of destruction (e.g., Lemkin’s focus on destroying foundations of group life). *Success requires:* Concepts carving social reality at its joints, capturing causal mechanisms and structural features (like cultural destruction, economic strangulation), often prioritizing analytical precision over legal admissibility.
  *   **Mobilizational Role:** Galvanizes public outrage, political will, and humanitarian intervention. *Success requires:* Vivid, emotionally compelling, and relatively undisputed labels that simplify complex realities for broad-based action.

  Critically, the criteria for success in one role (e.g., legal precision for Jurisdiction) directly conflict with those for another (e.g., contextual richness for Recognition). Attempting to expand the *legal* definition of genocide (e.g., adding political groups, cultural genocide, ecocide) often tries to make one tool (Jurisdiction) serve incompatible Recognitional or Explanatory functions, potentially weakening its core legal utility. The project reframes the task as **conceptual engineering**: not discovering what "genocide" *means*, but designing and deploying distinct atrocity concepts optimized for specific functional roles, given the distinct things we need naming *for*.

  **3. Methodology: Diagnosing Disputes & Engineering Concepts:**
  The project employs a three-part methodological framework tested against hard cases:

  1.  **Functional Decomposition:** Analyze any naming controversy or proposed definition by explicitly identifying which functional role(s) it is primarily attempting to serve and evaluating its fitness for *that specific role* against the relevant success criteria.
  2.  **Substantive vs. Verbal Dispute Criterion:** A dispute is **merely verbal** if parties agree on the core factual and moral character of an event but disagree on the label *because they are implicitly prioritizing different functional roles*. A dispute is **substantive** if parties genuinely disagree on the underlying facts (e.g., intent, scale, nature of the group) or core moral evaluations *relevant to the functional role at stake*, even if using the same label.
  3.  **Hard Case Application:** Apply this framework to meticulously analyze paradigmatically difficult cases:
      *   **Political Group Massacre:** Systematic killing targeting political opponents (e.g., Cambodia). Why is labeling this "genocide" contentious? Does the Jurisdictional role (protecting specific groups) conflict with the Recognitional/Explanatory need to name the intent to destroy a group *defined by affiliation*?
      *   **Cultural Destruction Without Killing:** Deliberate eradication of language, religious institutions, and cultural heritage (e.g., targeting Indigenous groups). Does the absence of mass killing preclude the Jurisdictional "genocide" label, failing the Recognitional role? How does the Explanatory role value this process?
      *   **Engineered Deprivation Deaths:** Mass mortality caused by siege, blockade, or displacement where "intent to destroy" is disputed (e.g., historical famines, modern sieges). Does the focus on *direct* killing in Jurisdictional definitions obscure the Recognitional reality and Explanatory mechanism of slower destruction? How does intent assessment differ functionally?
      *   **Contested-Boundary Groups:** Violence against groups whose coherence or boundaries are socially constructed or actively disputed (e.g., certain ethnic conflicts). How do different functional roles handle the ontological instability of the "group"? Does the Jurisdictional need for clarity clash with the Recognitional need for victim-defined identity?

  **4. Expected Outcome & Success/Failure Criteria:**
  *   **Finished Result:** A monograph providing a robust theoretical framework for understanding atrocity naming as multi-functional practice. It will offer:
      *   A clear typology of functional roles with success criteria.
      *   A diagnostic tool for analyzing naming disputes.
      *   Prescriptive insights for conceptual engineering: guiding when distinct concepts are needed, how they might relate (e.g., "genocide" for Jurisdiction, "atrocity crime X" for Explanation/Recognition), and clarity on the trade-offs inherent in any naming choice.
      *   Detailed resolutions of the hard cases using the framework.
  *   **Success:** The dissertation succeeds if it:
      *   Convincingly demonstrates that functional role conflict is a primary driver of naming impasses, surpassing the explanatory power of narrowness/contestation critiques.
      *   Provides a clear, usable criterion distinguishing substantive from verbal disputes in real-world cases.
      *   Offers novel, persuasive analyses of the hard cases that yield practical insights.
      *   Establishes "conceptual engineering for functional roles" as a viable and fruitful approach in atrocity studies and norm theory.
  *   **Failure:** The project fails if:
      *   The functional roles are shown to be insufficiently distinct or their conflict not demonstrably central to key disputes.
      *   The substantive/verbal distinction proves unusable or collapses in application.
      *   The framework fails to generate compelling new insights into the hard cases, merely restating existing debates.
      *   The conceptual engineering approach offers no practical advantage over definitional discovery or essential contestation models.

  **5. Realistic 12-Month Work Plan & Deliverable:**

  *   **Months 1-2: Deep Dive & Framework Refinement:**
      *   Comprehensive review and organization of existing dissertation research (lit review, case notes).
      *   Final refinement of the four functional roles and success criteria, ensuring conceptual precision.
      *   Formal articulation of the substantive/verbal dispute criterion.
  *   **Months 3-5: Hard Case Analysis I (Political Groups & Cultural Destruction):**
      *   Apply the framework in depth to the "Political Group Massacre" and "Cultural Destruction Without Killing" cases.
      *   Draft detailed chapters analyzing these cases, demonstrating the framework's diagnostic and prescriptive power.
      *   Identify potential revisions to the framework based on these analyses.
  *   **Months 6-8: Hard Case Analysis II (Engineered Deprivation & Contested Groups):**
      *   Apply the framework to the "Engineered Deprivation Deaths" and "Contested-Boundary Groups" cases.
      *   Draft detailed chapters analyzing these cases.
      *   Synthesize findings across all cases to refine overarching arguments about conceptual engineering.
  *   **Months 9-10: Theory Synthesis & Prescriptive Framework:**
      *   Draft core theoretical chapters: Introduction, functional role typology, dispute diagnosis method, conceptual engineering principles.
      *   Explicitly contrast the framework with narrowness/contestation critiques and essential contestation theory.
      *   Develop prescriptive conclusions on managing plural concepts.
  *   **Months 11-12: Integration, Revision & Completion:**
      *   Integrate case study chapters with theoretical framework.
      *   Write conclusion summarizing contributions and implications.
      *   Comprehensive revision for coherence, argument strength, and clarity.
      *   Final proofreading and formatting.
  *   **Deliverable:** A complete, polished, and submission-ready doctoral dissertation manuscript by the end of Month 12.

  This project moves beyond the exhausted framings of genocide debates by offering a novel functionalist lens. It transforms naming from a search for a singular truth into a practice of conceptual design, providing tools to diagnose disputes and engineer language fit for purpose, ultimately aiming for greater clarity and effectiveness in confronting mass atrocities. This fellowship is crucial to dedicate the uninterrupted, focused time required to complete this complex theoretical and case-based analysis.
