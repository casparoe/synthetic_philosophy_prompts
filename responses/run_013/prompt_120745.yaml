  We are creating a fictional historical document fragment. The claim we are evaluating is about a military defeat. The two rules:
   (1) Criterion of embarrassment: If a claim is embarrassing or damaging to the author/side, it is more likely to be authentic because people don't invent such details.
   (2) Criterion of narrative appeal: If a claim is vivid, edifying, or flattering to a later audience, it might be a later addition.

   We'll design a document that has a claim that is damaging to the original author (so by rule 1, authentic) but also has features that would make it appealing to a later audience (so by rule 2, likely an addition). We'll choose the claim to be about a defeat that is portrayed in a way that later generations might find heroic or inspiring.

   Document: A fragment of a chronicle from the fictional kingdom of Alaria, written by a court historian during the reign of King Borin I. The fragment describes a battle against the neighboring kingdom of Veridia.

   Claim: That King Borin I was captured during the Battle of Red Fields.

   We design the fragment so that the capture of the king is damaging to the king's reputation (thus rule 1: authentic) but the way it is described is very heroic and emphasizes the king's bravery and self-sacrifice, which would be appealing to later audiences (thus rule 2: likely an addition).

   The pivotal feature: The portrayal of the king's capture as a voluntary sacrifice to save his troops.

   If we flip the portrayal: If the capture were described as a humiliating event without any heroism, then rule 2 (narrative appeal) would not apply because it wouldn't be flattering. Then both rules might point to authenticity. But in our case, the heroic spin makes it appealing for later addition.

   Now, the document:

   "In the tenth year of Borin's reign, the Veridians invaded our lands. At the Battle of Red Fields, our forces were outnumbered. The king, seeing the slaughter of his men, cried out: 'I would rather surrender myself than see one more Alarian die!' He cast down his sword and walked alone into the enemy lines. Thus was the king taken, and the battle ended. His sacrifice saved many lives, and his name is honored for it."

   Rule 1 verdict: Authentic. The claim that the king was captured is damaging to the original author (a court historian serving King Borin I) because it shows the king as defeated and captured. This is weak evidence that the event really happened because the historian would not invent such a damaging detail.

   Rule 2 verdict: Likely a later addition. The claim is presented in a highly edifying and heroic manner, with the king making a self-sacrificial speech and walking alone to the enemy. This kind of vivid, flattering portrayal (especially the speech and the notion of saving lives by surrender) is exactly what a later scribe might add to turn a military defeat into a moral victory, making it appealing to later audiences.

   Pivotal feature: The heroic framing of the capture.

   Flip it: If the capture were described without the heroic speech and self-sacrificial act (e.g., "The king was captured while trying to flee"), then the criterion of narrative appeal would not suggest it was an addition. The event would still be damaging, so rule 1 would still support authenticity.

   Best counterattack: A historian who trusts rule 1 (and thus believes the capture is authentic) but is confronted by rule 2's argument would need to attack the idea that the heroic framing must be a later addition. They might argue that the original author, even though a court historian, might have wanted to put a positive spin on a real event to mitigate the damage. They would have to give up the idea that the author would only report damaging facts without any spin. Alternatively, they could argue that the heroic narrative was contemporary spin and not a later addition.

