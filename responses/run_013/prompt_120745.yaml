answer: |-
  ### Worked Example: Conflict of Historical Rules of Thumb

  #### The Document  
  *Fragment of the "Annals of King Theron" (allegedly written by court scribe Pelion, c. 3rd century BCE), discovered in a reused brick at the Telos dig site:*  
  > "In the fifth year of Theron’s reign, the northern rebels besieged Kastra. Our garrison was starved and near broken. On the third night, the traitor Captain Lysias opened the gates to the enemy. **King Theron himself fought bare-handed in the streets, slaying twenty men before being captured.** The city burned, but the king’s valor shone brighter than the flames. His courage will be sung for ages."

  #### The Claim  
  King Theron slew twenty enemy soldiers bare-handed during the fall of Kastra.  

  #### Rule 1: *Criterion of Embarrassment*  
  **Verdict: Authentic.**  
  The claim damages King Theron’s side—it admits a catastrophic defeat and his capture. A court scribe like Pelion would unlikely invent such a humiliating detail (e.g., a king reduced to bare-handed combat), weakly supporting its authenticity.  

  #### Rule 2: *Criterion of Narrative Appeal*  
  **Verdict: Likely a later addition.**  
  The claim is vividly heroic ("slaying twenty men," "valor shone brighter than flames"), exactly the edifying detail later scribes/tellers would add to glorify a martyr-king. Its dramatic excess undermines credibility.  

  #### Pivotal Feature  
  The **hyperbolic heroism** ("slaying twenty men bare-handed") serves both rules oppositely:  
  - Rule 1 focuses on the *cost* (defeat/capture) embedded in the heroism.  
  - Rule 2 focuses on the *style* (mythic embellishment appealing to later audiences).  

  #### If You Flip the Pivotal Feature  
  If the claim were mundane (e.g., "Theron wounded one guard before capture"), Rule 2’s argument collapses—no vivid appeal invites interpolation. Rule 1’s verdict (authentic due to cost) would stand unchallenged.  

  #### Best Counterattack for a Rule 1 Defender  
  A historian trusting Rule 1 could argue:  
  **Weak joint in Rule 2’s case:** It assumes later scribes *only* added flattering lies, but a contemporary scribe might spin a defeat with heroic details to mitigate shame.  
  **To press the attack, they must give up:** The idea that "embarrassing = unvarnished truth." Here, the scribe may have packaged defeat with exaggeration to *soften* the blow—weakening Rule 1’s core premise.  

