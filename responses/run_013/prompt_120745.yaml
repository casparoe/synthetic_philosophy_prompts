prompt: |-
  I'm building a handout for a class on how we know anything about the distant past, and what I want is a worked example where two respectable rules of thumb for reading old sources come apart on the same document — same evidence, opposite verdicts. So invent one for me: a short document, a chronicle fragment or an inscription or whatever, completly made up — no real texts, no real authors, nothing that would need a citation — but the kind of thing that could plausibly have come out of a dig. It should contain one specific claim we're trying to decide about, and there must be no second source that settles it.

  The two rules I want you to use. (1) People don't usually invent details that damage their own side, so if the claim costs the author something, that's weak evidence it's real. (2) Later hands add what they like, so if the claim is exactly the sort of thing a later teller or scribe would have enjoyed putting in — vivid, edifying, flattering to a later audience — that's weak evidence it's an addition, however awkward it is for the original author.

  Build the case so that one rule says the claim is authentic and the other says it's a later addition. Your call which way round, but say so. Constraints: the document has to fit in one paragraph, no forged-manuscript-with-a-twist, no omniscient narrator, and neither rule can be misapplied — a competent historian has to be able to defend each verdict. The conflict should come out of one feature of the case, not a pile-up of them.

  Then: say what each rule returns and why, name the single feature doing the work, say what happens if you flip it, and say how a historian who trusts the rule that loses would go after the case — where the weak joint is and what they'd have to give up to press the attack.

  Finish with a JSON object with exactly these fields: document, claim, rule_1_verdict, rule_2_verdict, pivotal_feature, flip_it, best_counterattack — each a string of one or two sentences.
