prompt: |-
  I'm putting together a small research programme — a workshop series plus two postdocs for three years — on the conceptual foundations of democratic inclusion, and I have to decide what the group should work on first. The three candidate areas are compulsory voting, lowering the voting age, and extending the vote to resident non-citizens. My working hypothesis is that these are three faces of a single question: what makes someone a member of the demos, and whether membership is a status one either has or lacks, or instead a bundle of decision-specific authorisations that one might hold for some questions and not others. A colleague in my department thinks that hypothesis flattens what actually matters, and that each area turns on something different — she says compulsion is really about whether voting is a duty of justice or only a right, the age threshold is really about whether competence is a scalar to be weighed or a gate to be passed, and non-citizen voting is really about whether the relevant claim is that everyone affected by a decision ought to have a say or that everyone bound by a law ought to. We spent most of a seminar failing to settle whether she's right, which is part of why I'm asking.

  What I want is a defended agenda, not a literature survey. Suppose the group has philosophical training and no capacity to run experiments or design surveys, and suppose the aim is conceptual work that could change how theorists, and eventually reformers, frame these debates. Which open questions in this area should come first, and why? For each, say how upstream it is — how many other disputes would be settled, dissolved, or reframed if it were answered — how tractable it is for people who can't gather their own data, and how neglected it is relative to how much turns on it. Then tell me which of the questions I've named, mine or my colleague's, are likely dead ends or pseudo-questions, and what would have to happen — an argument landing, a body of empirical results becoming robust, a legal or constitutional change — for your ordering to shift. I care more about the criteria and the trade-offs you make explicit than about a comprehensive map, so please defend the order rather than hedge it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're setting up a research program on democratic inclusion, specifically focusing on compulsory voting, lowering the voting age, and extending votes to resident non-citizens. The core debate is whether these are interconnected issues about demos membership or distinct problems with different underlying principles. The user wants a defended agenda prioritizing conceptual work that could reframe debates for theorists and reformers.

  First, I need to understand their main goal: a defended agenda, not a literature survey. They emphasize upstream questions—those that resolve multiple disputes. The group has philosophical training but can't gather new data, so tractability without empirical work is key. Also, neglect relative to importance is a factor.

  The user's hypothesis is that all three areas are facets of the same question about demos membership—binary status vs. decision-specific authorizations. Their colleague disagrees, seeing each as distinct: compulsory voting as duty vs. right, voting age as competence threshold, and non-citizen voting as affected vs. bound principles.

  I should evaluate which approach offers more upstream leverage. The demos question seems foundational. If membership is defined, it could clarify each sub-issue. For example, if membership is decision-specific, that affects all three areas: compulsory voting might vary by issue, age thresholds could be issue-dependent, non-citizen voting might apply to certain decisions. Resolving the nature of membership could reframe all three debates.

  Next, tractability: conceptual work without new data is feasible here. Philosophical analysis of membership criteria (presence, subjection, stakeholding) can be done through existing theories. Neglect-wise, while the demos question isn't new, the decision-specific angle might be underexplored compared to binary approaches. 

  The colleague's points might not be dead ends but secondary. For instance, duty vs. right in compulsory voting depends on whether voting is a core membership duty. Competence thresholds require defining membership first to determine whose competence matters. Affected vs. bound principles hinge on how membership is constituted. So, addressing demos membership settles the grounds for these disputes.

  Prioritizing the demos question could resolve multiple downstream issues. Then, the second question could be the authority source of the demos—whether it's constituted by those subject to laws or those affected. This impacts non-citizen voting directly and informs the scope of decision-specific authorizations. 

  The third priority could be the competence question, as it's more specific to voting age and compulsory voting but relies on prior answers. It's tractable through philosophical analysis of capacities and thresholds.

  Assessing dead ends: insisting on "duty vs. right" without linking to membership might be circular. Similarly, treating the three areas as entirely separate could miss underlying connections. The colleague's distinctions are valid but not foundational; they follow from the demos definition.

  Triggers for shifting priorities would be new theories challenging the demos framework, empirical data on membership effects, or real-world constitutional changes that test these concepts. For example, if a country implements non-citizen voting in specific areas, it could provide case studies for decision-specific membership.

  In conclusion, starting with the demos membership question offers the highest upstream impact, tractability, and sufficient neglect to warrant focus. This approach addresses the user's need for a defended agenda that reframes multiple debates efficiently.
answer: |-
  Here’s a defended agenda prioritizing conceptual leverage, tractability, and neglected impact for your group. I rank questions by **upstream impact** (how many disputes they resolve/reframe), **tractability** (without new data), and **neglect-to-importance ratio**. I then flag dead ends and shifting triggers.

  ---

  ### **Core Priority: The Demos Question**
  **Question:** *What constitutes membership in the demos? Is it a unitary status (all-or-nothing) or a bundle of context-specific authorizations tied to distinct decisions?*  
  - **Upstream Impact (Highest):**  
    This is the trunk of the tree. Answering it reconfigures **all three** policy debates:  
    - If membership is unitary, compulsory voting/non-citizen exclusion/voting age are gatekeeping questions about who "counts."  
    - If membership is decision-specific, **all three policies become granular**: e.g., non-citizens vote on local zoning but not foreign policy; minors vote on climate policy but not tax reform; voting is compulsory only for "core sovereignty" issues.  
    Resolves your colleague’s objections by showing whether "duty," "competence," and "affectedness" are derivative or primary concerns.  
  - **Tractability (High):**  
    Pure conceptual work: analyze theories of demotic boundaries (e.g., Dahl’s "subject to laws" vs. Goodin’s "affectedness"), historical practices of partial membership (e.g., medieval estates), and logical coherence of unbundled voting rights. No data needed.  
  - **Neglect (High):**  
    While "all-affected" vs. "all-subjected" is debated, the **unitary vs. granular membership** angle is underdeveloped. Theorists often assume a binary demos, ignoring hybrid or scalar models. Yet this framing determines whether reforms are marginal (tweaking the gates) or revolutionary (rethinking democracy’s architecture).  

  **Why first?** Until you clarify whether "the demos" is a monolithic entity or a fluid set of roles, debates about voting age/compulsion/non-citizens risk talking past each other. Your hypothesis isn’t flattening—it’s excavating foundations.

  ---

  ### **Second Priority: The Grounds of Authority**  
  **Question:** *Does democratic authority derive from being subject to binding laws or from being affected by decisions?*  
  - **Upstream Impact (High):**  
    Directly determines the legitimacy of **non-citizen voting** and reframes voting age/compulsion:  
    - If authority comes from *subjection*, minors/residents are included only if bound as legal persons (e.g., minors pay sales tax → local vote?).  
    - If from *affectedness*, competence thresholds/compulsion must justify excluding deeply affected groups (e.g., children impacted by education policy).  
    Forces coherence: can’t demand "all-affected" for non-citizens but "all-subjected" for minors.  
  - **Tractability (High):**  
    Conceptual analysis of coercion, moral agency, and causation. Compare frameworks (e.g., Benhabib’s cosmopolitanism vs. Miller’s statism).  
  - **Neglect (Moderate):**  
    "All-affected" is widely discussed but rarely tested against hard cases (e.g., future generations, foreign investors). The **tension with subjection** is acknowledged but underexplored for institutional design.  

  **Why second?** This question exposes whether your three policy areas share justificatory roots. If subjection and affectedness pull in different directions, it reveals fractures in democratic theory that granular membership (from Q1) might reconcile.

  ---

  ### **Third Priority: The Competence Threshold**  
  **Question:** *Is voting competence best understood as a scalar capacity (admitting degrees) or a threshold for minimal agency?*  
  - **Upstream Impact (Moderate):**  
    Crucial for **voting age** debates and **compulsory voting** (can the incompetent be compelled?). Less directly relevant to non-citizens (who are presumed competent). Resolves whether "maturity" is testable (scalar) or a proxy (threshold).  
  - **Tractability (High):**  
    Philosophical work on moral psychology (e.g., what constitutes "political agency"?), epistemology of competence assessment.  
  - **Neglect (High):**  
    Competence is often reduced to age proxies without examining the metaphysics of capacity. Neglected questions: Can competence be issue-specific? Does compulsion *create* competence through habit?  

  **Why third?** While vital, this depends on Q1/Q2. If membership is unitary, competence defines the threshold; if granular, it varies by decision. If subjection grounds authority, even minimal competence might suffice; if affectedness, higher competence may be needed to weigh diffuse interests.

  ---

  ### **Dead Ends and Pseudo-Problems**
  1. **"Duty vs. Right" (Compulsory Voting) as a standalone question:**  
     Dead end without addressing **membership** and **authority**. If voting is a core duty of membership, compulsion follows; if not, it’s coercion. Your colleague’s framing assumes what needs proving.  
  2. **Treating the three areas as fundamentally distinct:**  
     A pseudo-problem. Your colleague identifies *symptoms* (duty, competence, affectedness) but misses the disease: **what anchors these concepts to the demos?** Isolating them ignores shared dependencies.  
  3. **"Affected vs. Bound" for non-citizens in a vacuum:**  
     Circular without clarifying whether "bound" implies membership (Q1) or whether affectedness grants standing (Q2).  

  ---

  ### **What Would Shift This Order?**  
  1. **A Landmark Argument:** If a major theory conclusively demonstrates that unitary membership is incoherent (e.g., via decision-theoretic paradoxes), prioritize granular models immediately.  
  2. **Empirical Breakthroughs:** Robust data showing that *practicing* voting (via compulsion/lowered age) transforms civic competence could elevate Q3. Evidence that non-citizen voting erodes social trust could force Q2 upfront.  
  3. **Constitutional Changes:** A state granting non-citizens local voting rights while excluding them nationally would make granular membership (Q1) urgent. A court ruling voting compulsory as a "duty of residence" would demand scrutiny of subjection (Q2).  

  ---

  ### **Why This Agenda Wins**  
  - **Radical Reframing:** Starting with the demos question lets you rebuild inclusion debates from the ground up. Instead of asking "Should 16-year-olds vote?", you ask "For which decisions do 16-year-olds hold membership?"  
  - **Synergy:** Each question scaffolds the next. Demos structure (Q1) → grounds of authority (Q2) → competence requirements (Q3) creates a logical cascade.  
  - **Maximizes Philosophical Advantage:** No area requires new data; all turn on conceptual rigor.  
  - **Neglects Wisely:** Addresses foundational gaps (Q1/Q2) before contested applications (Q3).  

  **First output target:** A framework paper arguing that democratic inclusion is *either* unitary *or* granular—and why the choice collapses or transforms your three policy areas. This forces theorists to pick a side.
