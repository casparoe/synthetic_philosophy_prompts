answer: |-
  Here is a specification of desiderata for rational choice theories handling undefined or infinite expected value (EV), structured as requested. The requirements are derived from mathematical necessity, decision-theoretic coherence, and intuitive cases. Conflicts are flagged, and theories are scored.

  ---

  ### **Core Desiderata for Rational Choice Theories**
  **I. Mathematical Constraints (Non-Negotiable)**  
  1.  **Permutation Invariance (Riemann Constraint):**  
      - **Requirement:** The theory must not assign a unique finite EV to any gamble whose payoff series is conditionally convergent (e.g., Pasadena game). Any verdict must be invariant under rearrangement of terms.  
      - **Case:** Pasadena game (\((-1)^{n-1} \cdot 2^n / n\)). The Riemann rearrangement theorem proves no unique sum exists.  
      - **Status:** Non-negotiable (mathematical fact).  

  2.  **Distinction Between Convergence Classes:**  
      - **Requirement:** The theory must distinguish between:  
        (a) *Undefined EV* (conditionally convergent series, e.g., Pasadena),  
        (b) *Infinite EV* (divergent positive series, e.g., Altadena/St. Petersburg),  
        (c) *Finite EV* (absolutely convergent series).  
      - **Case:** Altadena (payoff \(2^n / n\)) has EV \(+\infty\); Pasadena has undefined EV; St. Petersburg (\(2^n\)) has EV \(+\infty\).  
      - **Status:** Non-negotiable (analysis).  

  **II. Case-Based Requirements (Non-Negotiable Unless Noted)**  
  3.  **Strict Dominance Recognition:**  
      - **Requirement:** If gamble A pays strictly more than gamble B in every possible state, the theory must strictly prefer A.  
      - **Case:** Altadena (payoff \(2^n / n\)) vs. Pasadena (\((-1)^{n-1} \cdot 2^n / n\)). For every \(n\), Altadena pays \(|\)Pasadena\(|\) but is always positive. Thus, Altadena ≻ Pasadena.  
      - **Status:** Non-negotiable (rationality axiom).  

  4.  **Single vs. Repeated Play Distinction:**  
      - **Requirement:** The theory must allow divergent verdicts for single vs. repeated plays of undefined-EV gambles.  
      - **Case:** A single Pasadena play has undefined EV, but \(N\) independent plays yield a series that converges absolutely as \(N \to \infty\) (by the law of large numbers). Rationality may permit playing Pasadena repeatedly but forbid a single play.  
      - **Status:** Non-negotiable (probabilistic fact).  

  5.  **Indifference to Null Events:**  
      - **Requirement:** The theory’s preferences must not change when zero-probability events are added or removed.  
      - **Case:** Adding a state with payoff \(0\) (probability \(0\)) to the Pasadena game must not alter its evaluation.  
      - **Status:** Non-negotiable (measure theory).  

  **III. Decision-Theoretic Coherence (Negotiable; Consensus Preferences)**  
  6.  **Avoiding Arbitrary Orderings:**  
      - **Requirement:** The theory must not rely on state-space orderings (e.g., temporal order of coin tosses) to compute EV.  
      - **Case:** Pasadena’s EV is undefined *because* it depends on how states are ordered. A theory using "natural order" (toss sequence) would violate Requirement 1.  
      - **Status:** Non-negotiable (implied by I.1).  

  7.  **Dynamic Consistency (Optional but Desirable):**  
      - **Requirement:** Preferences over gambles should align with precommitments to future actions (e.g., via decision trees).  
      - **Case:** If an agent precommits to play Pasadena once, but upon losing the first toss can choose to quit, dynamic consistency should not be violated.  
      - **Status:** Negotiable (some theories reject it for infinite cases).  

  ---

  ### **Conflicts Between Requirements**
  - **Conflict 1: Agnosticism vs. Dominance (Requirements I.1 vs. III.3)**  
    - **Issue:** Requirement I.1 forces agnosticism about Pasadena’s value, but III.3 demands strict preference for Altadena over Pasadena.  
    - **Resolution:** Theories must satisfy both by assigning *preferences without unique EVs* (e.g., Altadena ≻ Pasadena without assigning either a real number).  

  - **Conflict 2: Single-Play Indeterminacy vs. Repeated-Play Stability (Requirements I.1 vs. II.4)**  
    - **Issue:** A single Pasadena play has undefined EV, but repeated plays converge to a finite EV. A theory might reject single plays but accept repeated plays.  
    - **Resolution:** This is not a true conflict; it reflects a feature of probability. A theory can consistently forbid single plays while permitting repeated ones.  

  ---

  ### **Most Damaging Requirement**  
  **Requirement I.1 (Permutation Invariance)** is the strongest filter:  
  - It immediately excludes:  
    - **Naive EV maximization:** Assigns \(\ln 2\) to Pasadena (using natural order), violating I.1.  
    - **Most utility transformers:** E.g., risk-weighted utility (Buchak) or prospect theory, if unbounded, often imply order-dependent sums.  
  - **Why:** The Riemann theorem is non-negotiable mathematics. Any theory violating it fails decisively.  

  ---

  ### **Scoring Contending Theories**  
  | **Theory**                         | **I.1/I.2** | **II.3** | **II.4** | **II.5** | **III.6** | **Verdict**                                  |  
  |------------------------------------|-------------|----------|----------|----------|-----------|----------------------------------------------|  
  | **Naive EV Maximization**          | Fail        | Pass     | Fail     | Pass     | Fail      | Excluded by I.1; ignores convergence classes. |  
  | **Bounded Utility** (e.g., vNM)    | Pass        | Pass     | Pass     | Pass     | Pass      | Handles Altadena (\(\infty\) → bounded), but cannot rank Pasadena vs. $0 (agnostic). Fails II.3 if Altadena ≻ Pasadena not enforced. |  
  | **"Ill-Posed" Response**           | Pass        | Fail     | Pass     | Pass     | Pass      | Rejects Pasadena as non-evaluable, but violates II.3 (must prefer Altadena). |  
  | **Relative Utilitarianism** (e.g., Lauwers) | Pass     | Pass     | Pass     | Pass     | Pass      | Ranks gambles via limits of relative payoffs. Satisfies I.1 and II.3 but may lack generality. |  

  ---

  ### **Confidence Assessment**  
  - **Highest Confidence (95%+):** Requirements I.1, I.2, II.3, II.5. These are mathematically enforced or dominance principles.  
  - **Moderate Confidence (80%):** Requirement II.4 (repeated play). Law of large numbers justifies it, but some argue infinite ethics breaks it.  
  - **Lowest Confidence (70%):** Requirement III.7 (dynamic consistency). Its necessity in infinite cases is debated (e.g., Arntzenius).  
  - **Theoretical Conflicts:** I am 85% confident that I.1 and II.3 *can* be jointly satisfied (e.g., via preference relations without unique EVs).  

  **Weakest Point:** Whether II.4 (repeated-play distinction) is truly non-negotiable. Frequentists might reject single-play indeterminacy, but it follows from measure theory.  

  ---

  ### **Conclusion**  
  An adequate theory **must** satisfy I.1–I.2 and II.3–II.5. The critical tension is between undefined EVs (I.1) and strict dominance (II.3), resolvable by abandoning unique numerical EVs while retaining preference orderings. **Bounded utility** fails II.3 for Altadena vs. Pasadena; **"ill-posed"** fails the same; **Lauwers-style limits** satisfy all but lack adoption. No dominant solution exists, but the Riemann constraint (I.1) remains the gatekeeper.  

  ---  
  **References in Scope:** Riemann rearrangement theorem; Lauwers (2010) on relative utilitarianism; Buchak (2013) on risk-weighted utility; Arntzenius (2014) on infinite ethics.
