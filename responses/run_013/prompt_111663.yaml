prompt: |-
  I'm a retired organic chemist (35 years on the bench, mostly catalysts) and since I hung up the lab coat I've been teaching myself philosphy of science, badly, mostly out of a dog-eared copy of Lakatos. Mentioning this to my old colleagues was a mistake, because now I'm the designated referee.

  Here's the fight. At our old group's reunion dinner, two former colleagues went at each other about whether the department should keep funding the group working on what we always called the two-site model — a thirty-year-old idea about why one family of catalysts is so picky about which product it makes. I'm on the committee that votes in two weeks, and they've both asked me to adjudicate.

  Margit: the programme is degenerating. Every time an experiment comes out wrong, somebody bolts a new twist onto the model — a third site, a slow step, a "gatekeeper" — and none of those twists ever predicted anything that wasn't already sitting in the drawer. That's patching, not predicting. Defund it and move the students somewhere useful.

  Ray: you can't call a programme degenerating from the inside. Lakatos says the verdict is retrospective; people wrote off whole lines for decades and then they came back. And the twists aren't ad hoc, they add content — the third-site patch made us go look for a new peak and we found it. The core of the model hasn't been touched in thirty years, and that's exactly what you'd expect: you protect the core and let the belt take the hits.

  Margit: then your standard never tells us to stop. If every failure is just "the belt adjusting," if the verdict only arrives later, and if the only thing that actually kills a programme is a better rival turning up — and there isn't one, the competing models are worse — then the answer is always "carry on." That's not a criterion, it's a permission slip. On that logic we'd have funded cold fusion for another twenty years.

  Ray: it's not a permission slip, because protecting the core and patching the belt with something that predicts nothing are different things. If you want a number: of the last twenty additions to the model, count how many were made before the experiment that tested them and how many were made after we already knew the answer. If it's mostly after, I'll vote to kill it too.

  Margit: fine, but "before" and "after" is doing all the work there. The student who found the anomaly went looking for it because of the model, so nothing about it was ever really a surprise.

  Neither would budge and it got a bit personal around the cheese course. Can you go through it move by move and say who's right where, what each of them is missing, and then give me the call I should actually vote for — I don't need a reading list, I need a verdict.
reasoning: |-
  Okay, let me tackle this organic chemist's problem. He's retired but now stuck refereeing a philosophy of science debate between former colleagues about defunding a catalysis research program. Margit wants to pull the plug, Ray wants to keep it going - both citing Lakatos. 

  First, I need to unpack their arguments carefully. Margit's main point is that the two-site model is just getting patched with ad hoc additions whenever experiments disagree - like adding a third site or gatekeeper mechanism. Crucially, she notes these tweaks never predict anything new; they just retrofit existing data. That's classic degenerating research program territory for Lakatos. 

  Ray counters that judging degeneration retrospectively is key - you can't call it from inside the process. He emphasizes the core model remains untouched for 30 years (the "hard core" in Lakatos-speak) while the "protective belt" takes the hits. His clinching argument is that some additions did lead to new predictions, like finding that new peak after the third-site modification. 

  Hmm... but Margit nails a real weak spot: if we only judge later and there's no better rival theory, Ray's standard would let anything limp along forever. Her cold fusion analogy hits hard. And Ray's proposed metric - counting pre/post-hoc modifications - seems practical but gets messy when Margit points out that anomalies are often sought because of the model itself. 

  Let me think how Lakatos would analyze this. The core issue is whether modifications are "theoretically progressive" (predict novel facts) or just "empirically adequate" (explain existing data). Ray's new peak example suggests occasional progressiveness, but Margit's right that most tweaks sound reactive. The key is consistency of novel predictions - not one-off successes. 

  Also, Ray's "count the pre/post-hoc ratio" is actually a decent operational test Lakatos might approve. But Margit's "student sought anomaly because of model" objection needs addressing: predictive power requires risking falsification, not just confirming expectations. If every "prediction" is low-risk (like checking for expected byproducts), that doesn't count. 

  Verdict-wise... I'm leaning Margit. Thirty years is a long run for minimal novel predictions. Ray's defense feels like special pleading - if finding one new peak in decades is the benchmark, standards are too low. But I should acknowledge his point about no better rival existing; Lakatos does say degenerating programs can persist without competitors. Still, resources matter - keeping students in a stagnant program has opportunity costs. 

  For the vote: conditional defunding. Tell them to submit a five-year plan with clear novel predictions from any new modifications. No more retrofitting.
answer: |-
  Here's a move-by-move breakdown of the argument, what each is missing, and the verdict for your vote:

  ### **The Core Arguments & What They're Missing**
  1. **Margit's "Degenerating Programme" Claim**  
     - **Her Point:** Constant retroactive patching (third site, gatekeeper, etc.) without novel predictions signifies degeneration. Tweaks only explain existing anomalies, never anticipate new ones.  
     - **What She Misses:**  
       - Lakatos *does* allow protective belt adjustments to save a core theory. The critical test is whether these adjustments yield **novel predictions** (not just accommodate old data).  
       - She dismisses Ray’s "new peak" example too quickly. If the third-site patch *led* to a new discovery (even if motivated by the model), it *is* a sign of progressiveness.  

  2. **Ray's "Retrospective Judgment" Defense**  
     - **His Point:** Programs can’t be judged "degenerating" mid-flow; verdicts require hindsight. The untouched 30-year core shows resilience, and some patches *did* predict new findings (e.g., the new peak).  
     - **What He Misses:**  
       - Lakatos insists belt adjustments must be **theoretically progressive** (predict *new* facts). Most patches here seem **ad hoc¹** (only explain past anomalies).  
       - His "count pre/post-experiment patches" metric is strong, but he ignores Margit’s "no real surprise" critique: if anomalies are sought *because* the model suggests them, "predictions" may be self-fulfilling.  

  3. **Margit's "Permission Slip" Counter**  
     - **Her Point:** Ray’s standard lacks a stopping rule—without a rival theory, any program persists indefinitely.  
     - **What She Nails:**  
       - Lakatos *does* risk conservatism: without rivals, degenerating programs can linger. Resources matter—endless patching without novelty wastes them.  

  4. **Ray's "Pre/After" Metric**  
     - **His Point:** Tallying pre- vs. post-hoc patches (20 recent changes) is a concrete test of progressiveness.  
     - **The Flaw:** Margit’s "no surprise" point is valid: if a "prediction" is low-risk (e.g., checking for a model-suggested peak), it’s not a bold test. **Novelty ≠ Unexpectedness.**  

  ---

  ### **Lakatosian Verdict: Who’s Right?**  
  - **Margit is closer to correct.** The program shows strong signs of degeneration:  
    - Most modifications appear **ad hoc¹** (retrofitting old data).  
    - Genuine novel predictions (like Ray’s "new peak") seem rare over 30 years.  
    - "Gatekeeper" or "third-site" additions sound like belt-saving maneuvers, not drivers of discovery.  
  - **Ray’s defense is weak:**  
    - A 30-year-old core surviving isn’t impressive if the belt is bloated with untestable or post-hoc fixes.  
    - His "pre/post" metric is useful but doesn’t address *how risky* the predictions were. Finding a predicted peak in a model-guided search is weaker than predicting an entirely new phenomenon.  

  ---

  ### **Your Vote: Defund (with Caveats)**  
  **Recommendation:** Vote to **terminate funding**, but with conditions:  
  1. **Audit the "20 additions"**: Demand data on Ray’s 20 patches. How many led to **genuine novel predictions** (e.g., new reactions, substrates, or mechanisms *not* implied by existing data)? If ≥70% were post-hoc, it’s degenerative.  
  2. **Require a 5-year plan**: Give the group one last chance: demand a proposal with **testable, novel predictions** (e.g., "Our gatekeeper model predicts catalyst X will work on substrate Y, which no other model allows"). No predictions → no funding.  
  3. **Check for rivals**: Margit claims no better rivals exist—verify this. If true, shifting resources elsewhere may still be better than funding stagnation.  

  **Why this aligns with Lakatos**:  
  - Degenerating programs *can* persist without rivals, but society shouldn’t fund them indefinitely.  
  - Ray’s own metric (pre-vs-post-hoc) provides an exit clause. If patches are consistently retroactive, the program is **progressive only in rhetoric, not practice**.  

  **The Cheese Course Resolution**:  
  Tell Ray and Margit: *"The core has held, but the belt is frayed. Show me three novel predictions in the next year—not peaks you’re already hunting, but something that would surprise us—or the students move."*  

  ---

  ### **Key Lakatos Principles Applied**  
  | **Concept**          | **Relevant Issue**                                                                 |  
  |----------------------|------------------------------------------------------------------------------------|  
  | **Hard Core**        | Untouched 30-year core (Ray’s point). *But cores must drive progress, not just persist*. |  
  | **Protective Belt**  | Patches (third site, etc.) must be **theoretically progressive** (predict new facts). Margit’s data suggests they’re not. |  
  | **Degenerating Programme** | Consistent ad hoc adjustments + no novel predictions → degeneration. **Margit wins here.** |  
  | **Rival Theories**   | No rivals (per Margit) lets degeneration linger, but doesn’t justify funding.         |  

  **Vote**: Defund, unless the group provides a credible predictive plan within 2 weeks.  

  ¹ *Ad hoc = Only explains the anomaly it was invented for, predicts nothing new.*
