prompt: |-
  I'm a graduate TA and next month I have to run a single ninety-minute session on origin essentialism for a mixed room: second- and third-year undergraduates who have had exactly one lecture on rigid designation and one on possible worlds, plus a handful of biology students who signed up because the title mentioned cloning. The question on the table is the sperm-and-egg one — whether you could have come from a different sperm and a different egg — and I should admit that I taught it once before and it went badly: the discussion turned into an argument about determinism and about whether I secretly believed in souls, and the modal claim itself never got stated in a form anyone could examine. So please do not explain origin essentialism to me; plan how I should explain it. I need the order in which the components have to be introduced, and for each step why it cannot come earlier — in particular, where the notion of a de re necessity claim has to sit relative to the intuition pump, whether the audience can be given the transworld-identification worry before they have accepted that there is anything to worry about, and at what point the difference between a necessary truth and a truth that merely could not have been otherwise for causal reasons has to be nailed down, since I think that is the hinge the whole session turns on.

  The plan also needs a carrying example: one case that does all the work for the whole session, and I want you to argue for your choice against the obvious alternatives — whether the gamete case itself is the right thing to build on or whether it should be held back until the end, what a good carrying example has to have and must lack if it is going to survive the objections the biology students will raise, and whether the artifact analogue (a table, a ship, a statue) actually helps or quietly imports an assumption about how far the analogy to persons is supposed to run. Then the misconception map, in the order this particular room will form them: I expect at least the determinism confusion, the thought that the thesis is an empirical claim about genomes, the thought that it is about souls or some spark of life, and the thought that the baby from the other egg would simply have been someone else — which I suspect is not a misconception at all but the real objection, and so needs a different kind of treatment from the other three. Tell me where in the sequence each should be headed off and roughly what to say, and give me one closing question that separates a student who has grasped the modal claim from one who has merely memorized the conclusion.

  Finally, I want the session anchored in something they cannot have read in the assigned material, because otherwise the whole thing becomes a recitation of a famous argument. I am considering mitochondrial replacement, the so-called three-parent procedure, where the nuclear DNA is the parents' but the egg — and with it the mitochondrial DNA — is a donor's: if you are essentially the product of this sperm and this egg, what does that make of the donor, and does the thesis have to be stated over gametes, over zygotes, or over something finer still? The alternative candidates I have in mind are human cloning, where the origin story is a somatic cell rather than a gamete, and the fact that a single zygote can split into two people, which seems to make this sperm and this egg too coarse a unit to be anyone's origin. Pick whichever of these can actually carry the weight, say what it does to the thesis, and if one of them trivializes or refutes origin essentialism rather than illustrating it, say so plainly and keep it out of the session. And tell me what I should openly refuse to cover in ninety minutes — counterparts, the parallel with species essentialism, the extension of origin essentialism to artifacts — and what I should say when I refuse.
reasoning: |-
  Okay, the user is a graduate TA preparing for a ninety-minute session on origin essentialism. They've had a rough experience before, where the discussion veered off into determinism and souls without properly addressing the modal claim. Their main goal is to structure the session effectively to avoid past pitfalls. 

  First, I need to understand their constraints: the audience has limited background—only one lecture each on rigid designation and possible worlds, plus some biology students interested in cloning. The core question is whether a person could have originated from different gametes. The TA wants a step-by-step plan that sequences concepts correctly, a strong "carrying example" to anchor the discussion, and strategies to preempt common misconceptions (determinism, genetic reductionism, souls). They also want an original anchor—like mitochondrial replacement or cloning—to avoid rehashing Kripke, and clear boundaries on what to exclude.

  Hmm, the key challenge is sequencing. The TA flagged that nailing the difference between *causal* and *metaphysical* necessity is crucial. If students conflate them, everything derails. So step one must establish this distinction without jargon. A causal chain example (e.g., "The Titanic sank because it hit an iceberg") feels intuitive—it’s necessary given *our* physical laws but could’ve been otherwise in another world. Versus "2+2=4," which holds everywhere. This needs to come *before* possible worlds to prevent determinism hijacks. 

  Next, possible worlds should be framed as tools, not sci-fi. Emphasize minimal changes: "Worlds where physics is identical, but one tiny fact differs." This preps them for transworld identity without drowning in skepticism. Only then introduce de re claims, using a non-human carrying example. Why? Gametes are too loaded—students will jump to genetics or souls. A tree grown from a specific acorn works: it’s biologically neutral, avoids personhood debates, and makes transworld identity tangible. "Could *this tree* have grown from a different acorn?" forces the modal question cleanly. 

  Once de re necessity is clear, *then* pivot to gametes. Here, mitochondrial replacement (3-parent babies) is the perfect anchor. It disrupts the "simple" sperm-and-egg model—since the egg’s mitochondria come from a donor—forcing students to refine *which* gametic components matter. Does origin essentialism care about nuclear DNA? The zygote? This exposes the thesis’s granularity without requiring cloning or twinning (which might refute it). 

  For misconceptions:  
  - **Determinism**: Preempt early when discussing causal vs. metaphysical necessity. Stress that modal claims aren’t about physics.  
  - **Genetics**: Shut down during the tree example—"We’re not asking if the acorn’s DNA could vary, but if *this tree* could’ve started elsewhere."  
  - **Souls**: Neutralize when introducing the gamete case. Explicitly state, "No souls here; we’re doing metaphysics, not theology."  
  - "Different person" objection: Save for last. Acknowledge it’s valid! But argue origin essentialism rejects it—if origins change, it’s *not you*, just a similar person.  

  Closing question: "Could Queen Elizabeth have been born to different parents?" If they say no *and* ground it in origins (not genetics or destiny), they get it. If they cite DNA or inevitability, they missed the point.  

  Finally, boundaries: No counterparts (too technical), no species essentialism (off-topic), no artifacts (risks conflating persons/objects). Say: "That’s a great topic for office hours!" to avoid frustration.  

  Whew. This feels like threading a needle, but the sequence should keep the modal claim center stage.
answer: |-
  Here’s a step-by-step session plan designed to preempt past pitfalls, anchored in mitochondrial replacement ("three-parent babies"), with explicit sequencing justifications, misconception handling, and boundaries. The goal is to isolate the *modal claim* while sidestepping determinism/souls.

  ---

  ### **Core Sequence: Order & Rationale**
  1. **Start with "Causal vs. Metaphysical Necessity" (15 mins)**  
     **Tool:** A *causal chain* example (e.g., "The Titanic sank because it hit an iceberg—could it have sunk *without* hitting it?").  
     **Why first?** Students conflate "couldn’t happen" physically with "impossible metaphysically." Nail this now or determinism hijacks the session.  
     **Key distinction:**  
     - *Causal necessity*: Given laws of nature, X couldn’t have happened (e.g., water freezing at 0°C).  
     - *Metaphysical necessity*: X couldn’t happen *in any possible world* (e.g., 2+2=4).  
     **Crucial line:** "We’re asking if changing your origin is *like changing 2+2 to 5*—not just breaking physics."  

  2. **Introduce Possible Worlds as a Tool (10 mins)**  
     **Tool:** "Minimally altered worlds" (e.g., "A world where you wore blue socks today—same laws, same history until this morning").  
     **Why now?** Possible worlds must be framed as *test cases for necessity*, not sci-fi. Delay transworld identity worries until they grasp the target.  
     **Emphasize:** "We’re not asking if we can *detect* who’s who across worlds—we’re asking what *fixes* identity."  

  3. **De Re Necessity via a "Carrying Example" (20 mins)**  
     **Tool:** **A tree grown from a specific acorn** (not an artifact or person yet).  
     **Why this example?**  
     - Neutral: Avoids souls/determinism (biology students won’t protest botany).  
     - Clear origin: Acorn = unambiguous starting point.  
     - Forces de re focus: "Could *this tree* have grown from a *different acorn*?"  
     **Reject alternatives:**  
       - *Artifacts* (ships/tables): Import functional criteria (e.g., "Is it the same ship if all planks are replaced?"). Persons aren’t defined by function.  
       - *Gametes now*: Too emotionally loaded; students leap to genetics/souls prematurely.  
     **Build the claim:** "In all worlds where this tree exists, it grew from *this acorn*."  

  4. **Transworld Identity Worry (Now Address It!) (10 mins)**  
     **Why here?** Only *after* they see the acorn as essential does the worry matter. Pose it as:  
     *"If we see a tree in another world that looks identical but grew from a different acorn, is it this tree? No—it’s a duplicate. Origins anchor identity."*  
     **Preempt skepticism:** "We’re not claiming we can *observe* transworld identity—we’re stipulating it to test necessity."  

  5. **Pivot to Persons & Gametes (Mitochondrial Anchor) (20 mins)**  
     **Tool: Three-parent babies** (nuclear DNA from parents + mitochondrial DNA from donor).  
     **Why here?**  
     - Gametes are now framed *after* de re necessity is understood (via the tree).  
     - Mitochondria disrupt the "simple" sperm/egg model: *Which* gamete matters? The egg (with mitochondria) or nuclear DNA?  
     **Key move:** Ask: "If you were born via mitochondrial replacement, could you have come from a *different donor egg* (same nuclear DNA)?"  
     **Thesis refinement:** Origin essentialism likely cares about the *zygote* (specific fusion event), not gametes independently.  

  ---

  ### **Misconception Map: When & How to Defuse**
  - **Determinism ("It’s physically impossible!")**  
    **Kill at Step 1:** "Even if physics allowed different gametes (e.g., quantum accident), we’re asking if *you* could exist then."  

  - **Genetics ("Different DNA = different person")**  
    **Crush at Step 3 (tree):** "A genetically identical tree from a different acorn isn’t *this tree*."  
    **Reinforce at Step 5:** "Mitochondrial replacement shows DNA isn’t the whole story—same nuclear DNA, different mitochondrial origin."  

  - **Souls / "Spark of Life"**  
    **Neutralize at Step 5 intro:** "We’re doing metaphysics, not theology. Assume no souls: does origin still fix identity?"  

  - **"The other baby would just be someone else" (The Real Objection)**  
    **Engage at Step 5:** "Exactly! But origin essentialism *agrees*—it says if origins change, it *isn’t you*. The thesis is that *you* couldn’t have originated differently."  
    **Treatment:** Contrast with the tree: "A similar tree isn’t *this one*. Likewise, a similar person isn’t *you*."  

  ---

  ### **Closing Diagnostic Question**
  **Pose:** *"Could Queen Elizabeth have been born to different parents?"*  
  - **Grasps modal claim:** "No, because *she* wouldn’t exist—someone else would."  
  - **Misses modal claim:** "Yes, if her parents met differently" (causal) or "No, DNA would differ" (empirical).  

  ---

  ### **What to Exclude & Why**
  1. **Counterpart theory:** "No time to explore alternatives—we’re testing origin essentialism on its own terms today."  
  2. **Species essentialism:** "That’s a separate debate; we’re focused on individual origins."  
  3. **Artifacts:** "Tables/ships introduce functional criteria that don’t apply to persons. Stick with biology."  
  4. **Cloning/twinning:**  
     - *Cloning* (somatic cell origin): Weakens the gamete/zygote focus; raises "what counts as origin?" without payoff.  
     - *Twinning* (zygote splitting): **Refutes** the strong claim that *this sperm and egg* are essential (since two people share them). **Avoid entirely**—it nukes the thesis preemptively.  

  Mitochondrial replacement is the ideal anchor: it **complicates but doesn’t destroy** the thesis, forcing refinement (zygote > gametes) while being modern and unassigned.

  ---

  ### **Session Flow Cheat Sheet**
  | Time  | Step                         | Key Question                          | Trap Avoidance              |
  |-------|------------------------------|----------------------------------------|-----------------------------|
  | 0-15  | Causal vs. Metaphysical      | "Is freezing at 0°C *like 2+2=4*?"    | Decouple from determinism   |
  | 15-25 | Possible Worlds              | "What changes in a ‘blue socks’ world?"| Defang sci-fi assumptions  |
  | 25-45 | Tree/Acorn (de re)           | "Is *this tree* tied to *this acorn*?" | Bypass genetics/souls      |
  | 45-55 | Transworld Identity          | "Is a duplicate tree the *same tree*?" | Preempt "But how can we know?" |
  | 55-75 | Persons + Mitochondria       | "Which part of the egg makes *you*?"   | Reframe gametes via zygote  |
  | 75-85 | Misconceptions & Q&A         | Focus on "different person" objection | Validate but distinguish   |
  | 85-90 | Closing Question             | "Could Elizabeth have other parents?" | Diagnostic                 |

  **Stick to this sequence rigidly.** When tangents arise: "That’s beyond today’s scope—let’s park it for office hours." You’ll isolate the modal core while letting biology students engage via mitochondria.
