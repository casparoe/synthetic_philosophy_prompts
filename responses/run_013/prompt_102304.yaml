answer: |-
  Here’s a decision tree taxonomy for determining when conventions create moral obligations, especially for visitors. Designed as a one-page handout (≈500 words), using your cases to anchor questions. Answer each question with **Yes/No** based on concrete scenarios.

  ---

  ### **STAGE 1: DECISION TREE**  
  *(Start at Question 1 → Follow arrows)*  

  1.  **When someone breaks a local rule (e.g., jaywalking at 2am on an empty road), does it feel like a *moral wrong* (beyond rudeness)?**  
      → **No:** Go to **Position A** (Strict Etiquette View)  
      → **Yes:** Go to Q2.  

  2.  **Is the rule *only* binding if it connects to an independent moral duty (e.g., queue-jumping violates fairness, not tipping harms workers)?**  
      → **Yes:** Go to **Position B** (Moral Duty Tracking)  
      → **No:** Go to Q3.  

  3.  **Does the obligation come from *reciprocity* (e.g., benefiting from others’ rule-following) or *tacit consent* (e.g., choosing to visit)?**  
      → **Yes:** Go to **Position C** (Reciprocity/Fair Play View)  
      → **No:** Go to Q4.  

  4.  **Does *ignorance* of the rule defeat the obligation (e.g., a visitor unintentionally breaks a mourning custom)?**  
      → **Yes:** Go to **Position D** (Modified Conventionalism)  
      → **No:** Go to Q5.  

  5.  **Does the rule’s *harmlessness* matter? (e.g., escalator-standing annoys but doesn’t harm; tipping underpays workers if skipped)**  
      → **Yes:** Go to Q6.  
      → **No:** Go to **Position E** (Strong Conventionalism)  

  6.  **Should harmless conventions (e.g., jaywalking at night) be treated differently from harmful ones (e.g., not tipping)?**  
      → **Yes:** Go to **Position F** (Pluralism)  
      → **No:** Go to **Position G** (Harm-Based Obligation)  

  ---

  ### **STAGE 2: LEAF POSITIONS**  
  *(With names, core stance, and awkward commitment)*  

  - **Position A: Strict Etiquette View**  
    *Breach = rudeness, never moral wrongdoing.*  
    **Awkward commitment:** Sam was wrong to call Priya *immoral* for not tipping—it was merely impolite.  

  - **Position B: Moral Duty Tracking**  
    *Only conventions tied to independent moral duties (fairness, harm-prevention) bind anyone.*  
    **Awkward commitment:** Jaywalking on an empty road is fine (no harm), but not tipping is wrong (harms workers).  

  - **Position C: Reciprocity/Fair Play View**  
    *Obligation arises from benefiting from others’ compliance (e.g., using roads/trains).*  
    **Awkward commitment:** A visitor refusing to haggle *must* accept fixed pricing (they benefit from market stability).  

  - **Position D: Modified Conventionalism**  
    *Visitors are bound by local rules, but ignorance excuses non-compliance.*  
    **Awkward commitment:** Priya *should* tip once she learns staff rely on tips—but wasn’t wrong initially.  

  - **Position E: Strong Conventionalism**  
    *Whatever the local practice is, visitors are bound—ignorance/harm don’t matter.*  
    **Awkward commitment:** The funeral visitor *wronged* mourners despite unknowingly breaking custom.  

  - **Position F: Pluralism**  
    *Conventions differ: harmless ones (jaywalking) are etiquette; harmful/exploitative ones (not tipping) are moral.*  
    **Awkward commitment:** Queue-barging is *only* rude if harmless, but immoral if it delays others significantly.  

  - **Position G: Harm-Based Obligation**  
    *Only harmful/exploitative breaches are wrong (e.g., not tipping = free-riding; jaywalking ≠ wrong).*  
    **Awkward commitment:** Keeping your seat while an elderly person stands is *fine* if no one is visibly distressed.  

  ---

  ### **NOTES ON THE TAXONOMY**  
  1.  **Inseparable Pair:**  
      - **Moral Duty Tracking (B)** vs. **Harm-Based Obligation (G)** overlap if "independent moral duty" = harm-prevention.  
      *Why?* Both treat not tipping as wrong and harmless jaywalking as fine—distinction collapses without non-harm moral duties (e.g., promise-keeping).  

  2.  **Unoccupied Combinations:**  
      - **"Ignorance defeats obligation + breach always wrong"** (e.g., answering **Yes** to Q4 and **No** to Q5).  
      *Diagnosis:* Incoherent—ignorance can’t both excuse and not excuse.  
      - **"Obligation requires consent + strangers can demand compliance"** (e.g., answering **Yes** to Q3 but **No** to Q4).  
      *Diagnosis:* Unattractive—implies visitors "consent" to unknown rules, excusing nothing.  

  3.  **Design Choices:**  
      - Cases used: Jaywalking (Q1, Q5, Q6), Tipping (Q2, Q5), Queue-barging (Q2, Q6), Escalator (Q5), Funeral (Q4), Train seat (Q3, G), Haggling (Q3).  
      - 6 questions → 7 leaves (avoids oversimplification while staying handout-friendly).  
      - "Pluralism" (F) explicitly splits conventions by type (your request).  

  ---  
  **Handout Tip:** Add: "Test your view! Does *standing on the left* of an escalator in London feel morally wrong? If yes, you’re likely **E** or **G**. If no, you’re likely **A**, **B**, or **F**."
