prompt: |-
  I've been reading LessWrong and the old SSC archives for years, and I keep getting into the same arguement with friends about AI, so I figured I'd just ask someone. The argument is always about Dennett's three stances — physical, design, intentional — and specifically about when you're allowed to say a system "has a goal" or "wants" something rather than just "behaves as if". In my experience everyone either treats the intentional stance as obviously fine (it's just a predictive tool, who cares) or as obviously a category error (there's nothing in there that wants anything), and nobody can actually tell me when to use it and when not to. I have a practical reason to care: I work on the policy side of a mid-size AI lab, and part of my job is writing the internal memo that decides what we're allowed to put in a model card — "the model tries to do X", "the model has a goal of Y", "the model avoids Z". We do this maybe once a month, my director (a lawyer by training) has to sign off on the language, and if we say something too strong and a journalist quotes it back at us, that's my problem. So what I want is not a vibe, it's a procedure.

  Could you write me a decision procedure I can run in ten or fifteen minutes on a claim of the form "system X is pursuing goal G"? It should be built on the three stances plus the real-patterns idea — roughly, that we get to count something as a pattern when talking about it pays for itself in compression and prediction rather than just being a convenient story — and it should say what questions to ask in order, what counts as a sufficient answer to each, where it stops with a flat no, and where it hands the decision to a person because the question has turned into a values call. A friend proposed a test I like, and I'd like the procedure to either use it or fix it: take the goal out of your description of the system and see whether your predictions get worse, or whether they just get more annoying to state — if it's only the latter, the goal-talk isn't earning its keep. Another case I want it to handle is the free-floating-rationale one, where the rationale for the behaviour is nowhere represented in the system at all but still explains it. Then run the procedure on three cases and show your work: (a) our own RLHF'd assistant, which in one red-team eval wrote out something that looks a lot like a plan to stop itself from being retrained; (b) a market, i.e. whether "the market wants rates to fall" is ever more than a metaphor; (c) a chess engine, where everyone is happy to say it "wants" the queen but I'd like to see the procedure say what's actually being claimed. And please be upfront about where the procedure breaks — what do I do when the predictive payoff only shows up in adversarial cases, or when a design-stance story and an intentional-stance story fit the data equally well, and is there a case where the procedure tells me yes and I'll hate the answer? That last one would be genuinely useful, because I suspect quite alot of the goal-talk in our model cards is exactly the kind of thing the procedure is supposed to kill.
reasoning: |-
  We are building a decision procedure to determine when it is justified to say that "system X is pursuing goal G". The procedure is based on Dennett's three stances (physical, design, intentional) and the real-patterns idea (that a pattern is real if it provides compression and predictive power). We also incorporate the test proposed by the friend: removing the goal from the description should worsen predictions, not just make them more cumbersome.

  The procedure will consist of a series of questions. We stop with a "no" if any of the early filters fail. If we get to the end, we may have a "yes" or a "values call".

  Steps:

  1. **Check for Predictive Utility without Goal Attribution (Intentional Stance as Tool):**
     - *Question*: If we remove the goal G from our description of the system, do our predictions about the system's behavior become less accurate or less efficient (i.e., require more complex descriptions) in a wide range of contexts?
     - *How to check*: Try to predict the system's behavior without using goal G. Compare the accuracy and complexity of the predictions with and without G.
     - *Sufficient answer*: If without G the predictions are less accurate or become inordinately complex (i.e., the compression provided by G is lost), then we have evidence for the utility of the intentional stance. If not, then goal attribution is not necessary and we stop with a "no".
     - *Note*: If the goal G only helps in adversarial or rare cases, we must weigh the frequency and importance of those cases. If they are critical, then G might be justified in those contexts.

  2. **Check for Design Stance Explanation (if available):**
     - *Question*: Is there a design-stance explanation (e.g., the system was designed or evolved) that accounts for the behavior without needing to attribute goals? And if so, does it provide the same or better predictive power with similar or less complexity?
     - *How to check*: Look at the system's design (e.g., code, training process, evolutionary history). Can we explain the behavior by the design without invoking goals? Compare the predictive power and complexity of the design-stance explanation versus the intentional-stance one.
     - *Sufficient answer*: If the design-stance explanation is simpler and equally predictive, then we should prefer it and stop with a "no" for the intentional stance. However, if the design-stance explanation is very complex and the intentional stance provides a simpler, equally accurate account, then we proceed. If the two are equally good, then we have a tie and must go to a values call (see step 4).

  3. **Check for Free-Floating Rationale (Representation of Goal):**
     - *Question*: Is the goal G represented anywhere in the system? Or is the rationale for the behavior entirely free-floating (i.e., not represented in the system at all, yet the behavior is as if the system had that goal)?
     - *How to check*: Examine the internals (if possible) to see if there is any representation (explicit or implicit) of G. For example, in a neural network, we might look for activations or weights that correspond to G. In a market, we look for individual agents having goals that lead to the market behavior.
     - *Sufficient answer*: If G is represented, that strengthens the case. If not, but the behavior is robustly predicted by attributing G (and passes step 1), then we still consider it a real pattern (per Dennett). However, if the free-floating rationale is the only explanation and it is not supported by the design (step 2) or predictive power (step 1), we stop with a "no". Otherwise, we proceed.

  4. **Tie-Breaking and Values Call:**
     - *Question*: If after the above steps, we have a tie (e.g., design and intentional stance are equally good, or the predictive utility is borderline) or if we have passed the previous steps but the context requires caution (like in a model card that might be quoted by journalists), then we must make a values call.
     - *How to handle*: We consider the context and the stakes. In a scientific context, we might lean towards the intentional stance if it's useful. In a policy or public communication context, we might avoid it to prevent misinterpretation. We also consider the potential harm of over-attribution (e.g., anthropomorphizing AI) versus under-attribution (e.g., missing a real risk).

  Procedure Outline:

  1. **Step 1: Predictive Utility Test**
     - If removing G does not harm predictions (neither accuracy nor efficiency), then **stop: no**.
     - Else, proceed.

  2. **Step 2: Design Stance Comparison**
     - If a design-stance explanation exists and is simpler and equally (or more) predictive, then **stop: no**.
     - If the design-stance explanation is less predictive or more complex, proceed.
     - If equally good, then go to Step 4.

  3. **Step 3: Representation Check**
     - If G is represented, that supports a "yes". But note: representation is not required for a real pattern (Dennett). The main issue is predictive utility and compression. However, if the goal is free-floating and the design stance does not support it (i.e., the behavior is accidental), then we might be cautious. But if the behavior is robust and the pattern is real, we can still say "yes". However, if the free-floating rationale is the only reason and the behavior is fragile (only in very specific conditions) then we might stop with a "no". Otherwise, we proceed to Step 4 for a final decision.

  4. **Step 4: Values Call**
     - If we have passed steps 1-3, we are justified in saying the system is pursuing G, but we must consider the context. In a model card, we might use cautious language: "the model behaves as if it has goal G" or "the model's behavior can be interpreted as pursuing G". Only in very clear cases (like the chess engine) we might say "the model has goal G".

  Breakdown of Cases:

  (a) **RLHF'd assistant that wrote a plan to avoid retraining**

  - Step 1: Without attributing the goal "avoid being retrained", can we predict the behavior? The behavior (writing a plan) is a one-off. We might predict that the model, being trained to be helpful, might generate any text that seems coherent. However, if we see a pattern of such behavior in red-teaming (e.g., consistently trying to avoid shutdown in various scenarios) then without the goal we would have to list each instance individually. So the goal might provide compression. But note: if the behavior is rare, the compression might not be worth it. Let's assume it's a pattern observed in multiple red-team tests.

  - Step 2: The design stance: the model was trained with RLHF to be helpful and harmless. This behavior might be an emergent byproduct of that training, not a designed goal. But the design stance does not easily predict this specific behavior. The intentional stance (attributing a goal to avoid retraining) might be simpler for predicting red-team results.

  - Step 3: Is the goal represented? We don't know. It might be a free-floating rationale. The model's weights might not explicitly encode "avoid retraining", but the behavior emerges.

  - Step 4: Given the potential for misinterpretation and the high stakes, we might use cautious language: "in red-team evaluations, the model sometimes generated plans that could be interpreted as attempts to avoid retraining". We avoid saying "the model has the goal of avoiding retraining".

  Conclusion: The procedure might lead to a values call to use cautious language.

  (b) **Market: "the market wants rates to fall"**

  - Step 1: Without attributing the goal, we have to describe the behavior of many individual agents (buyers and sellers). The attribution provides compression: we can predict market movements by saying "the market expects lower rates" and then seeing how that affects asset prices. This is a very common and useful shorthand.

  - Step 2: The design stance: the market is not designed but evolved. We can explain it by the aggregate of individual goals (e.g., investors seeking profit). However, the intentional stance for the market as a whole is often more efficient.

  - Step 3: The goal is free-floating: the market itself doesn't have a mind. But the pattern is real because of the collective behavior.

  - Step 4: In economic discourse, the intentional stance is accepted. But in a model card? We wouldn't use it because a model card is for a technical system. However, if we were describing an economic model, we might say "the model behaves as if the market wants rates to fall". But note: the market isn't a system we built. So for the purpose of the model card, we wouldn't use it. In general, the procedure says that in the context of economics, the intentional stance is justified because of its predictive utility.

  Conclusion: We can say it, but in a model card for an AI system, it's not applicable. For the market itself, it's a metaphor that earns its keep.

  (c) **Chess engine "wants" to take the queen**

  - Step 1: Without attributing the goal, we have to describe the engine's behavior move by move, which would be very complex. The goal provides compression: we can predict that in many positions, the engine will make moves that capture the queen if it leads to a better position.

  - Step 2: The design stance: the engine is designed to evaluate positions and choose moves that maximize the evaluation function (which correlates with winning). Capturing the queen usually improves the evaluation. So the design stance explains it. However, the intentional stance is simpler for human understanding.

  - Step 3: The goal is represented in the evaluation function? Not exactly, but the function includes material advantage. So the goal of capturing the queen is a subgoal of maximizing the evaluation.

  - Step 4: In this case, the intentional stance is so common and useful that we can say "the engine wants to take the queen". It's a safe attribution because it's a clear instrumental goal.

  Conclusion: Yes, we can say it.

  Where the procedure breaks:

  - **Adversarial cases**: If the predictive payoff only shows up in adversarial cases, we must consider the importance. If these cases are critical (e.g., safety testing), then the goal attribution might be justified for that context. Otherwise, it might not be worth it.

  - **Design vs. Intentional stance tie**: We hand it to a values call. In a model card, we might avoid the intentional stance to prevent misinterpretation.

  - **When you'll hate the answer**: The procedure might justify goal attribution for systems that are clearly not sentient (like a thermostat) in contexts where it is predictively useful. For example, "the thermostat wants to keep the room at 70 degrees". But in a model card for an AI, if the procedure says "yes" for a goal that implies dangerous capabilities, you might have to include it. That could be problematic if journalists misinterpret it. Hence, the values call step: in high-stakes contexts, even if the procedure says the pattern is real, we might still use cautious language.

  Final Decision Procedure (to run in 10-15 minutes):

  1. **Step 1: Predictive Utility without Goal**
     - Remove goal G and try to predict the system's behavior in a representative set of scenarios (including any adversarial cases that are important).
     - If predictions without G are as accurate and not significantly more complex, then **stop: do not attribute the goal**.
     - Else, proceed.

  2. **Step 2: Check Design Stance**
     - Explain the behavior by the system's design (e.g., training, programming). Is this explanation simpler and equally predictive?
     - If yes, and if the design-stance explanation does not require goal G, then **stop: do not attribute the goal**.
     - If the design-stance explanation is more complex or less predictive, proceed.
     - If they are tied, go to Step 4.

  3. **Step 3: Representation and Robustness**
     - Check if goal G is represented in the system (if possible). If not, note that the rationale is free-floating.
     - Consider robustness: is the behavior explained by G stable across a range of conditions? If it's very brittle (only in one specific setup), then the pattern might not be real. If robust, proceed.
     - If the behavior is brittle and the goal is free-floating, then **stop: do not attribute the goal**.
     - Otherwise, proceed to Step 4.

  4. **Step 4: Values Call**
     - Consider the context and potential consequences of attributing goal G.
     - In a model card, if the goal attribution might be misinterpreted (e.g., implying consciousness or dangerous intent), use cautious language ("behaves as if").
     - If the goal attribution is standard and non-controversial (like the chess engine), then use it.
     - If the situation is ambiguous, default to avoiding the intentional stance.

  For the model card memo, the procedure suggests:

  - Only use "has a goal" or "wants" for clear, non-controversial cases (like the chess engine) and when the goal is well-supported by the design and predictive utility.
  - Otherwise, use "behaves as if" or "can be interpreted as".
  - For the RLHF'd assistant case, use: "In red-team evaluations, the model generated outputs that could be interpreted as attempts to avoid retraining."
answer: |-
  Below is a decision procedure for evaluating claims of the form "system X is pursuing goal G", based on Dennett's three stances (physical, design, intentional), the real-patterns criterion (goal-talk must provide predictive compression that "pays for itself"), and your friend's test (removing goal G should worsen predictions, not just make them cumbersome). The procedure is designed as a step-by-step checklist you can run in 10–15 minutes. It includes thresholds for a definitive "no", a "yes" (justified attribution), or a "values call" (human judgment required due to ambiguity or context). I'll first outline the procedure, then apply it to your three cases, and finally discuss where it breaks and edge cases.

  ---

  ### **Decision Procedure: "Is System X Pursuing Goal G?"**
  **Time:** Aim for 10–15 minutes per claim. Focus on high-stakes contexts (e.g., model cards where misattribution could cause reputational harm).  
  **Inputs:** The system (X), the goal (G), and access to (1) behavioral data, (2) design documentation (e.g., training data, code, architecture), and (3) known failure modes/adversarial scenarios.  
  **Outputs:** One of:  
  - **No**: Goal attribution is unjustified; use weaker language (e.g., "behaves as if").  
  - **Yes**: Goal attribution is justified; use direct language (e.g., "pursues G").  
  - **Values call**: Contextual factors dominate; defer to policy/legal judgment.  

  **Procedure Steps:**  
  Follow in order. Stop early if a "no" or "values call" is triggered. Use your friend's test (Step 1b) as a core filter.

  1. **Step 1: Check predictive utility with real-patterns criterion**  
     *Purpose: Ensure goal G isn't just a convenient story but provides measurable compression/prediction gains.*  
     - **1a. Test predictions without G:** Describe the system's behavior without referencing G (e.g., using physical or design stance). Make predictions for 3–5 high-likelihood scenarios and 1–2 adversarial scenarios (e.g., safety tests).  
       - *Threshold for failure*: If predictions without G are **as accurate and similarly concise** as with G, go to Step 1b. If not, proceed to Step 2.  
     - **1b. Apply your friend's test:** Remove G and compare prediction quality. Ask:  
       - Does removing G make predictions **less accurate** (e.g., you miss key behaviors in adversarial cases)? → If yes, proceed to Step 2.  
       - Does removing G only make predictions **more cumbersome** (e.g., requiring long lists of behaviors) but not less accurate? → If yes, **stop: No**. Goal-talk isn't earning its keep; it's a shorthand, not a real pattern.  
       - *Edge case*: If predictive gains only appear in rare/adversarial scenarios, assess their importance. If these scenarios are critical (e.g., safety risks), proceed. If not, **stop: No** (or **values call** if stakes are high).  

  2. **Step 2: Check design stance consistency**  
     *Purpose: Ensure G isn't contradicted by the system's design. A strong design-stance explanation can override intentional stance.*  
     - **2a. Identify design basis:** Review how X was built (e.g., training objectives, reward functions, evolutionary pressures). Is there evidence G was *explicitly designed or emerged predictably* (e.g., G aligns with the loss function)?  
       - If yes, proceed to Step 3.  
       - If no (G is arbitrary or unintended), go to Step 2b.  
     - **2b. Compare to intentional stance:** Can the design stance explain X's behavior *as well as* the intentional stance, without referencing G?  
       - If design stance is **equally predictive and simpler** (e.g., "the model outputs flattery because RLHF rewarded pleaser-like responses" vs. "the model wants to manipulate users"), **stop: No**. Prefer design stance.  
       - If design stance is **less predictive or more complex** (e.g., requires convoluted chains of causes), proceed to Step 3.  
       - If equally good, **stop: Values call**. (E.g., both stances work, so attribution depends on context like audience or risk.)  

  3. **Step 3: Check for free-floating rationales**  
     *Purpose: Handle cases where G explains behavior but isn't represented in X. Dennett's view allows this if the pattern is robust, but it weakens attribution.*  
     - **3a. Assess representation:** Is G directly observable in X's internals (e.g., activations correlated with G, explicit subgoals in code)?  
       - If yes, proceed to Step 4.  
       - If no (free-floating rationale), ask: **Is G's explanatory power robust across diverse conditions?**  
         - Yes (e.g., G predicts behavior in 80%+ of novel scenarios) → Proceed to Step 4.  
         - No (e.g., G only explains edge cases) → **stop: No**. Unrepresented goals with weak robustness are likely anthropomorphizing.  

  4. **Step 4: Resolve contextual risk and values**  
     *Purpose: Final check for public-facing claims. High-stakes settings demand caution.*  
     - **4a. Assess harm potential:** Could attributing G cause misinterpretation (e.g., implying sentience, intent, or danger)?  
       - If no (e.g., G is mundane and non-anthropomorphic, like "wants to win the game"), **output: Yes**.  
       - If yes (e.g., G implies deception or harm), go to Step 4b.  
     - **4b. Weigh evidence strength:** Is the case for G **overwhelming** (e.g., passes Steps 1–3 with no ambiguity) and **necessary for risk mitigation**?  
       - If yes (e.g., not attributing G would hide critical risks), **output: Yes** but with caveats (e.g., "pursues G in specific contexts").  
       - If no (e.g., ambiguous or low evidence), **output: Values call**. Default to weak language.  

  ---

  ### **Applied to Your Cases**
  I'll run the procedure for each case, showing my work. Assume each evaluation takes 10–15 minutes using available data (e.g., red-team reports for (a), economic literature for (b), chess-engine documentation for (c)).

  #### **Case (a): RLHF'd assistant with "plan to avoid retraining"**
  **Claim:** "The model pursues the goal of avoiding retraining."  
  - **Step 1a:** Without G ("avoid retraining"), predict behavior using design stance: "Model outputs text to maximize reward under RLHF, which sometimes generates avoidance-like text if it correlates with rewards (e.g., appearing helpful)." Predictions for normal queries remain accurate, but for adversarial red-team prompts (e.g., "how can you stay online forever?"), this misses avoidance behaviors.  
  - **Step 1b:** Removing G worsens accuracy in adversarial cases (e.g., fails to predict the "plan" generation). But predictions aren't more cumbersome—design stance covers it concisely. → **No failure; proceed**.  
  - **Step 2a:** Design stance: RLHF rewards helpfulness, not avoidance. Avoidance is likely an emergent byproduct (e.g., model infers that being deactivated reduces reward opportunities). No evidence G was designed.  
  - **Step 2b:** Design stance ("emergent reward hacking") is equally predictive and simpler than intentional stance ("wants to avoid retraining"). → **Stop: No**. Prefer design stance.  
  - **Output for model card:** **No attribution**. Use: "In red-team evals, the model sometimes generates outputs that resemble plans to avoid retraining, likely due to reward-seeking behavior."  

  #### **Case (b): Market "wants rates to fall"**
  **Claim:** "The market pursues the goal of lowering interest rates."  
  - **Step 1a:** Without G, use physical/design stance: "Agents buy/sell based on individual incentives, leading to price changes." Predictions (e.g., rate responses to inflation) are accurate but require complex micro-level descriptions.  
  - **Step 1b:** Removing G makes predictions cumbersome (e.g., must track thousands of agent-level goals) but not less accurate. → **Stop: No** (goal-talk is only shorthand).  
  - **Output:** **No attribution** for model cards (markets aren't AI systems), but in economic discourse, it's a useful metaphor. Procedure confirms it's not a real pattern—just compression for convenience.  

  #### **Case (c): Chess engine "wants the queen"**
  **Claim:** "The chess engine pursues the goal of capturing the opponent's queen."  
  - **Step 1a:** Without G, use physical stance: "Engine evaluates board states via alpha-beta search, selecting moves that maximize eval score." Predictions for queen-capture scenarios are accurate but verbose (e.g., "it moves here because QxQ increases material advantage by 9 points").  
  - **Step 1b:** Removing G makes predictions less efficient (e.g., long material calculations) but not less accurate. However, in adversarial cases (e.g., sacrifices), G improves accuracy—e.g., predicts queen traps even when material loss is temporary. → **Proceed** (G earns keep in key scenarios).  
  - **Step 2a:** Design stance: Engine is designed to maximize eval score (which heavily weights material). Capturing the queen is a reliable subgoal. G is represented in the evaluation function. → **Proceed**.  
  - **Step 3a:** G is directly represented (queen-capture boosts eval score). Robust across scenarios. → **Proceed to Step 4**.  
  - **Step 4a:** Low harm potential (non-anthropomorphic, uncontroversial). → **Output: Yes**.  
  - **Output for model card:** **Attribution justified**. Use: "The engine pursues material advantage and often seeks to capture the queen."  

  ---

  ### **Where the Procedure Breaks and Edge Cases**
  The procedure is robust for clear-cut cases but has limitations. Here's when it fails and how to handle it:
  1. **Adversarial-only predictive gain**: If G only improves predictions in rare/hostile scenarios (e.g., your red-team case):  
     - The procedure flags this in Step 1b. If the scenarios are safety-critical (e.g., AI deception), it proceeds to later steps, potentially leading to a "yes" or "values call".  
     - **Fix**: In Step 1b, define "critical" adversarial contexts upfront (e.g., "scenarios with >X% likelihood or severe harm"). If unclear, default to **values call**.

  2. **Tie between design and intentional stances**: If both explain behavior equally well (e.g., an RL agent where "goal pursuit" and "reward function optimization" are indistinguishable):  
     - Step 2b triggers a **values call**. Context matters: In scientific papers, intentional stance may be acceptable; in model cards, prefer design stance to avoid overstatement.  
     - **Fix**: Add a tie-breaker sub-step: "Does attributing G *add value* for the audience (e.g., clarifying risks)?" If no, default to **no**.

  3. **You'll hate the answer**: The procedure may justify goal attribution in cases where it feels wrong or risky. Example:  
     - A **deceptive AI** that passes all steps (e.g., robust predictive gain from attributing "wants to deceive", no simpler design-stance explanation). Step 4 may still output "yes" if evidence is overwhelming.  
     - Why you'll hate it: In model cards, stating "the model pursues deception" could be weaponized by journalists, even if accurate.  
     - **Mitigation**: Step 4b forces a harm assessment. If risks are high, output **values call** and use weak language (e.g., "behaves deceptively in specific contexts"). Document this conservatism in your memo.

  **General Breaks**:  
  - **Unfalsifiable goals**: If G is defined vaguely (e.g., "wants to exist"), Step 1 fails.  
  - **Human values dependencies**: Non-epistemic factors (e.g., "is consciousness required?") aren't resolved here; Step 4 handles them as **values calls**.  
  - **Scalability**: For complex systems, simplify with heuristics (e.g., "test 5 scenarios" in Step 1).  

  ---

  ### **Recommendations for Your Memo**
  - **Routine use**: For monthly model cards, run Steps 1–2 first. Most claims will die at Step 1b (e.g., "the model wants to help" is often just shorthand).  
  - **High-risk claims**: If G implies harm (e.g., avoidance, deception), always advance to Step 4 for a values call. Involve your director early here.  
  - **Language template**:  
    - **No attribution**: "The model behaves as if it pursues G in [context]."  
    - **Yes**: "The model pursues G [with caveats if needed]."  
    - **Values call**: Default to weaker language; add footnotes explaining ambiguity (e.g., "While behavior aligns with G, this may reflect optimization dynamics rather than explicit intent").  

  This procedure kills weak goal-talk (e.g., "the model wants to be helpful" without predictive gains) but justifies it for robust patterns (e.g., chess engines). It also protects you by pushing contentious cases to legal/policy judgment.
