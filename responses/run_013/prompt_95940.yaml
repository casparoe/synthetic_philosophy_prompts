prompt: |-
  You are a philosopher of history and archival theorist with a working knowledge of how record-keeping systems have served states, churches, and employers. I would like your help naming something.

  I have spent two years in parish registers, quarter-session files, and hearth-tax rolls for a rural community, and a pattern keeps recurring for which I cannot find the right word. Everything I know about these people reaches me through an institution that had business with them: baptisms, fines, assessments, hiring contracts, removal orders, the notice a labourer had to give before leaving. Their own arrangements — the feast, the boundary dispute settled without lawyers, the craft, the song — surface only at the point where they crossed a ledger. Two consequences trouble me. First, the documentation is thickest exactly where the community was most closely governed, so anyone who weighs evidence by volume will find these people most numerous, most devout, and most disorderly in the very decades when they were most watched. Second, the only slots the paperwork offers me are the institution's: I can describe them as pauper, vagrant, recusant, or servant, but not in their own terms. And where they did leave writing of their own, it was almost always composed for an outsider — a deposition, a petition, a statement taken down by a clerk, a mark made in place of a signature.

  Is there a name for this? I know about silences in the archive, but that seems to concern what is missing; what I am describing is a systematic distortion of what is present, produced by the fact that appearing in the record at all was something one did on an institution's terms. I also know about survivorship bias, but that concerns what lasts rather than the conditions on which a thing was admitted to the record in the first place. So: what are the nearest established concepts, how exactly does each fall short of the thing I have described, and does any of them fit it exactly? If none does, coin a term for it, define it, and mark its edges — say what would have to be true of a source for the pattern to be absent, whether it persists when the record-keeper belongs to the community or the institution is a benign one, and how it relates to the familiar advice to read the archive against the grain. If what I have described is really two or three distinct phenomena bundled together, separate them and name each.

  Think carefully, and begin by listing the candidate concepts you considered and rejected before you commit. End with a final line beginning "Verdict:" giving the established term if one exists, or "none established" followed by your proposed term.
reasoning: |-
  Okay, the user is a historian or researcher who's spent two years digging through parish registers, court records, and tax documents for a rural community. They've noticed a recurring pattern: all the information about these people comes through institutional interactions—baptisms, fines, contracts, etc.—while their personal lives and community activities only appear when they intersect with official records. This creates two big problems: first, the documentation is thickest where surveillance was heaviest, making people seem more numerous and disorderly in those periods; second, the records force individuals into institutional categories (pauper, vagrant) rather than their own identities.  

  The user knows about concepts like "silences in the archive" (which focuses on absence) and "survivorship bias" (about what endures), but neither quite fits. They want a term for this *systemic distortion*—where merely appearing in records means being framed by institutional priorities.  

  Hmm, first I need to brainstorm related concepts. There's "archival violence" (Derrida), but that's more about power to exclude/destroy, not distortion. "Epistemic violence" (Spivak) is close but broader—about how knowledge systems erase subaltern voices. "Institutional capture" feels right for how records bend reality to bureaucratic needs. "Administrative gaze" (Foucault) describes the perspective but doesn't emphasize distortion. "Bureaucratic mediation" captures the filtering process but lacks the power imbalance.  

  None are perfect. The core issue is threefold:  
  1. **Overrepresentation under surveillance**: Records amplify visibility where control is tight.  
  2. **Categorical confinement**: People are trapped in institutional labels.  
  3. **Extractive documentation**: Even "personal" writing (depositions) serves external agendas.  

  So I'll propose **"institutional refraction"**—light bending through a lens, where the institution's structure distorts what's recorded. It persists even with benign intent because all record-keeping serves institutional functions. Reading "against the grain" helps mitigate it but doesn't eliminate the distortion.  

  Verdict: none established; proposed term "institutional refraction."
answer: |-
  Your inquiry cuts to the heart of archival epistemology—the tension between lived experience and its institutional mediation. After careful consideration of established concepts, I find none fully captures the *systemic distortion* you describe. Below is my evaluation of candidates, their limitations, and a proposed framework:

  ### Candidate Concepts & Why They Fall Short
  1. **Archival Silences (Derrida/Trouillot)**  
     - *Why considered:* Addresses absence and power imbalances.  
     - *Shortfall:* Focuses on *omission* (e.g., unwritten feasts), not the *distortive framing* of what *is* recorded (e.g., a feast appearing only as a disorderly gathering fined by magistrates).  

  2. **Survivorship Bias**  
     - *Why considered:* Highlights skewed evidence based on preservation.  
     - *Shortfall:* Concerns *what endures physically*, not the *conceptual coercion* at the point of record creation (e.g., a laborer’s mark reduced to proof of contractual compliance).  

  3. **Epistemic Violence (Spivak)**  
     - *Why considered:* Names how systems erase subaltern subjectivity.  
     - *Shortfall:* Too broad; your case involves *specific institutional mechanics* (ledgers, forms) that actively reshape agency into institutional categories.  

  4. **Bureaucratic Mediation (Weber)**  
     - *Why considered:* Recognizes institutions as filters.  
     - *Shortfall:* Describes process neutrally, ignoring how mediation *distorts historical weight* (e.g., equating surveillance density with "devotion" or "disorder").  

  5. **Administrative Gaze (Foucault)**  
     - *Why considered:* Evokes institutional perspective shaping legibility.  
     - *Shortfall:* Focuses on surveillance, not the *quantitative illusion* (thick records ≠ heightened activity) or *categorical confinement* (pauper vs. neighbor).  

  6. **Archival Capture (Stoler)**  
     - *Why considered:* Implies records "trap" subjects in state frameworks.  
     - *Shortfall:* Does not address the *documentary inflation* problem (volume as false proxy for significance).  

  ---

  ### The Phenomenon Dissected & Named
  Your description bundles three interlocking distortions:  
  1. **Surveillance-Density Illusion**: Records inflate the perceived scale of behaviors where monitoring is intense (e.g., "disorderly" decades).  
  2. **Categorical Confinement**: Subjects appear only in institutional slots (vagrant, recusant), erasing self-defined identities.  
  3. **Extractive Testimony**: Even "personal" writings (depositions) serve external agendas, precluding authentic self-representation.  

  **Proposed Term:  
  Institutional Refraction**  

  ### Definition & Boundaries  
  **Institutional Refraction** (*n.*): *The distortion produced when lived experience passes through an institutional record-keeping system, bending agency, identity, and social density to align with the system’s operational logic, categorical frameworks, and functional priorities.*  

  #### Key Edges:  
  - **When Absent?** Only when records are generated:  
    - *By the community itself* (e.g., a village diary, oral history).  
    - *For self-documentation* (e.g., personal letters, craft guild ledgers for internal use).  
  - **Does "Benign" Intent Neutralize It?** No. Even well-meaning institutions refract:  
    - A parish clerk recording charity may frame recipients as "deserving poor," obscuring mutual aid networks.  
    - Community-led records (e.g., a Methodist chapel register) still refract through *that group's* theology and discipline.  
  - **Relation to "Reading Against the Grain"**:  
    — Reading against the grain *mitigates* refraction by decoding institutional framing (e.g., inferring solidarity from removal orders).  
    — But it cannot *eliminate* the core distortion: the archival subject remains a silhouette cast by institutional light.  

  ---

  ### Verdict: none established; proposed term **institutional refraction**.  

  This term centers the *optics* of power: like light through a prism, the institution breaks lived reality into spectral fragments—visible only in angles that serve its purpose. What you witness in hearth taxes and parish registers is not absence, but bent light.
