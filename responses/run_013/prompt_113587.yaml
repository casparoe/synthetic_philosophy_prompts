prompt: |-
  I'm putting together a grad-student paper session for next week and the presenter is defending updateless decision theory -- roughly, the idea that you shouldn't pick the action that maximizes expected utility, you should pick the whole policy, so that your choice ends up correlated with what every other instance of your decision procedure does. He's good at deflecting objections with "that's just a modeling choice," so I want a sequence of six or seven questions that makes that harder to use and actually presses him on the content. Hit at least these: Parfit's hitchhiker (why should paying the driver who's already driven off depend on what I decide now?), the smoking lesion, whether subjunctive dependence is a genuine relation or just a confusion about counterfactuals, and whether UDT is even well-defined once the agent is bounded and can't compute the best policy. Give me a follow-up for each, keyed to the answer he's most likely to give. And don't hand me softballs -- I want questions that force him to commit to a specific position rather than laying out the options and letting him pick.
reasoning: |-
  We are designing a sequence of questions for a presenter defending Updateless Decision Theory (UDT). The goal is to press on specific issues and avoid letting the presenter dismiss them as mere "modeling choices." We have four specific topics to cover: Parfit's hitchhiker, the smoking lesion, subjunctive dependence, and bounded agents. We'll structure six or seven questions (with follow-ups) that force commitment.

   Plan:

   1. Start with Parfit's Hitchhiker to set the stage with a concrete scenario.
   2. Then move to the smoking lesion to challenge the handling of acausal correlations.
   3. Question the nature of subjunctive dependence (is it real or just a confusion?).
   4. Challenge the well-definedness of UDT for bounded agents.

   We'll design each main question and a follow-up that anticipates the most likely response and pushes further.

   Let's craft the questions:

  ---

  **Question 1 (Parfit's Hitchhiker):**  
  "In Parfit's hitchhiker scenario, if I'm the hitchhiker who has already been driven to town and now the driver demands payment, UDT seems to recommend paying even though the driver's action (driving me) is already in the past. How can my decision now causally affect the past? And if it doesn't, why should I pay? Doesn't this violate the principle that we should only care about causal consequences?"

  *Expected response (likely):*  
  UDT might say that the payment is part of a policy that, if adopted, would have led the driver (who is assumed to be a similar decision-maker or to have modeled my decision) to drive me. So by paying, I am adhering to the policy that, if I had committed to it in advance, would have gotten me the ride. The driver's past action was conditional on my policy.

  *Follow-up Question 1:*  
  "But the driver has already driven me and left. At this point, the only effect of paying is that I lose money. The driver's action is fixed. How does UDT avoid being exploitable in such one-shot situations? If I can defect without any causal repercussions, why wouldn't I? And if the answer is that the driver wouldn't have picked me up if I were the type to defect, then aren't you smuggling in a causal story via the driver's prior belief about my type?"

  ---

  **Question 2 (Smoking Lesion):**  
  "Consider the smoking lesion problem: an agent has a genetic lesion that both causes smoking and lung cancer. UDT, as I understand, recommends not smoking because it correlates with not having the lesion. But in this case, the lesion is already present or not — it's a fixed state. How can my decision to smoke or not, which is caused by the lesion, possibly change whether I have the lesion? Isn't UDT conflating correlation with causation here?"

  *Expected response (likely):*  
  UDT would argue that the agent should choose the policy that, when run, would output the action that is correlated with not having the lesion. Since the lesion is correlated with the decision, by choosing a policy of not smoking, the agent is more likely to be in the world where they don't have the lesion.

  *Follow-up Question 2:*  
  "But the lesion is a fixed fact about the world. My decision to smoke doesn't cause the lesion to disappear. So if I have the lesion, I'm going to get cancer regardless, and if I don't, I won't. Why should I forgo the pleasure of smoking? Isn't UDT telling me to pay a cost (not smoking) for a benefit (not having the lesion) that I can't actually affect?"

  ---

  **Question 3 (Subjunctive Dependence - Reality Check):**  
  "UDT relies heavily on subjunctive dependence: the idea that my decision now is correlated with the decisions of other agents (or my future/past selves) because we are all running the same decision procedure. But is this subjunctive dependence a real feature of the world, or is it just a confusion about counterfactuals? How do we know that such correlations actually hold, especially in cases where there's no clear causal mechanism?"

  *Expected response (likely):*  
  The correlations are a consequence of logical uncertainty: if the same algorithm is run in different contexts, then the outputs may be logically correlated. We don't need a causal mechanism because the correlation is logical.

  *Follow-up Question 3:*  
  "But in the real world, how do we determine which agents are running the 'same' decision procedure? For instance, if I change my mind about UDT and become a causal decision theorist, does that break the correlation? And if the correlation is broken, doesn't that make UDT policies unstable? Moreover, isn't the logical uncertainty approach vulnerable to the problem of logical omniscience — we can't actually compute all logical implications?"

  ---

  **Question 4 (Smoking Lesion - Deeper):**  
  "Let's return to the smoking lesion. Suppose I am an UDT agent and I know that the lesion is present in 1% of the population and that it causes both smoking and cancer. If I decide to smoke, it's because the lesion made me do it, and I'm almost certainly in the 1% and will get cancer. If I decide not to smoke, it's because I don't have the lesion, and I won't get cancer. But if I condition on my decision, then the decision is evidence about the lesion. However, UDT seems to say that I should decide not to smoke as a policy. But why? The lesion is already there or not. How does not smoking help me? And if it doesn't, isn't UDT just a form of self-deception?"

  *Expected response (likely):*  
  The UDT agent doesn't condition on the decision; it chooses a policy. The policy of not smoking is better because in the world where the lesion is present, the agent would smoke (so the policy of not smoking doesn't get applied in that world) and in the world without the lesion, the agent doesn't smoke and avoids cancer. But wait, that's not how the lesion works — the lesion causes both. So let me rephrase: the UDT agent chooses a policy that maps observations (if any) to actions. In this case, the lesion is unobserved. The policy that always says "don't smoke" will lead to not smoking and, importantly, the agent who follows that policy is more likely to be in the world without the lesion? Hmm, that's the correlation. But note: the lesion is independent of the policy? Actually, no — the lesion is part of the world, and the policy is chosen by the agent. The key is that the lesion is correlated with what the agent does, but the agent's policy is fixed.

  *Follow-up Question 4:*  
  "I'm confused. If the lesion is present, then the agent will smoke regardless of the policy? Or does the lesion only predispose? Let's clarify the scenario: in the classic smoking lesion, the lesion causes a desire to smoke, but the agent can still choose not to smoke. However, having the lesion also causes cancer. So if the agent has the lesion, they are more likely to smoke and they will get cancer. But if they don't have the lesion, they are less likely to smoke and they won't get cancer. Now, if I am an UDT agent, I choose a policy. If I choose a policy of smoking, then I will smoke and I will get cancer if I have the lesion. If I choose a policy of not smoking, then I won't smoke, but if I have the lesion I still get cancer. So in both cases, if I have the lesion, I get cancer. The only difference is that if I don't have the lesion and I choose the policy of not smoking, I avoid cancer and avoid the cost of smoking. But if I choose the policy of smoking and I don't have the lesion, I get the pleasure of smoking and avoid cancer? Wait, no: if I don't have the lesion, I won't get cancer regardless. So the policy of smoking when I don't have the lesion gives me pleasure without cancer. The policy of not smoking when I don't have the lesion avoids cancer (which I avoid anyway) and also avoids the pleasure. So why is the policy of not smoking better? It seems that smoking when I don't have the lesion is better. And if I have the lesion, I get cancer regardless. So the policy of smoking gives me pleasure in the case without the lesion and nothing in the case with (since I would have smoked anyway). The policy of not smoking gives me no pleasure and I still get cancer if I have the lesion. So UDT must be making a mistake here."

  *Note:* This is a complex point and the expected response might be that UDT does indeed recommend not smoking because the agent who follows the policy of not smoking is more likely to be in the world without the lesion. But the above reasoning suggests that the policy of smoking might be better. This is a known debate. We can press on this.

  *Alternative Follow-up 4 (if the presenter gives the standard UDT response):*  
  "Your argument relies on the idea that by following the policy of not smoking, I am more likely to be in the world without the lesion. But isn't that backwards? The lesion is a prior fact. My policy choice doesn't change the world. So the probability of having the lesion is fixed. Therefore, the expected utility of smoking is: (probability of lesion) * (utility of smoking with cancer) + (1 - probability of lesion) * (utility of smoking without cancer). Similarly for not smoking. The policy of smoking gives extra pleasure in the non-lesion world. So unless the disutility of smoking with cancer is so high that it outweighs the pleasure in the non-lesion world, smoking would be better. But UDT says not to smoke. So isn't UDT ignoring the actual causal structure and making a mistake?"

  ---

  **Question 5 (Bounded Agents - Well-definedness):**  
  "UDT requires the agent to compute the best policy, which in turn requires evaluating the consequences of every possible policy in every possible world. But for any realistic bounded agent, this is computationally infeasible. How can UDT even be applied in practice? And without a clear way to approximate, isn't UDT just a theoretical construct with no real-world applicability?"

  *Expected response (likely):*  
  We can use approximations, such as considering a limited set of policies or using heuristics. The theory provides the ideal, and we try to get as close as possible.

  *Follow-up Question 5:*  
  "But how do we know that the approximation is still aligned with the ideal UDT? For example, if I limit the set of policies to a small set, I might miss the globally optimal one. And if I use heuristics, how do I avoid falling into the same traps that UDT was designed to avoid? Moreover, doesn't the approximation problem reintroduce the very same issues (like CDT vs. EDT) that UDT was supposed to resolve? In other words, if I'm a bounded agent, why should I believe that following an UDT-inspired heuristic is better than following CDT?"

  ---

  **Question 6 (Subjunctive Dependence - Concrete Example):**  
  "You mentioned that subjunctive dependence arises from logical uncertainty. But consider a real-world scenario: I am deciding whether to cooperate in a prisoner's dilemma with a copy of myself in another room. We both run UDT. We both cooperate. But now, what if I change my decision procedure to defect? Then the other copy, being a copy, would also defect. But if I change, then we are no longer running the same procedure. So how does UDT handle self-modifying agents? And doesn't this make the outcome unstable?"

  *Expected response (likely):*  
  The UDT policy would have to account for the possibility of self-modification. The optimal policy might include a commitment not to self-modify, or it might factor in the costs of self-modification.

  *Follow-up Question 6:*  
  "But if self-modification is allowed, then the UDT policy must consider that if it chooses to cooperate, then the other copy cooperates, but if it chooses to defect, then the other copy defects. So the agent might choose to defect if it can get away with it? But wait, if both are copies, they do the same thing. So the agent is stuck: if it cooperates, it gets the cooperative outcome; if it defects, it gets the defect outcome. So cooperation is better. But what if I can self-modify to be a CDT agent? Then I can defect and the other copy (still UDT) would cooperate? But no, because if I self-modify to CDT, then the other copy is still a copy of my original UDT agent? Or does the copy also self-modify? This becomes messy. How does UDT handle the possibility of self-modification without becoming circular?"

  ---

  **Question 7 (Parfit's Hitchhiker - Payment as Part of Policy):**  
  "Back to Parfit's hitchhiker. You argue that paying is part of a policy that gets me the ride. But what if I never plan to be in that situation again? Then the policy doesn't help me in the future. And in the current situation, paying doesn't change anything. So why pay? Is UDT only rational for agents who expect to face many similar decisions?"

  *Expected response (likely):*  
  UDT considers the entire logical structure, including how the driver modeled you. If the driver knew that you would only pay if you were going to face similar situations, then maybe they wouldn't have driven you. But the standard setup assumes that the driver is modeling you as an agent who follows a policy that includes paying in this situation.

  *Follow-up Question 7:*  
  "So UDT requires that the driver must have a correct model of me as a UDT agent? What if the driver is wrong? What if I am a UDT agent but the driver thinks I'm a CDT agent? Then the driver wouldn't have picked me up. So I'm in town, and now I can defect without any consequence. How does UDT handle the possibility of being misclassified by other agents? And doesn't this lead to a regress of modeling each other's models?"

  ---

  We have seven main questions and follow-ups. We can use all or select the most pressing.

  Summary of Questions:

  1. Parfit's hitchhiker: why pay when it doesn't affect the past?
  2. Smoking lesion: why not smoke when the lesion is fixed?
  3. Subjunctive dependence: is it real or confusion?
  4. Smoking lesion deeper: causal structure vs. correlation.
  5. Bounded agents: how to approximate without losing UDT benefits?
  6. Subjunctive dependence with self-modification: how to avoid circularity?
  7. Parfit's hitchhiker with one-shot: why pay if it's a one-shot?

  We've covered the requested topics and more. The questions are designed to press on the core commitments of UDT and avoid letting the presenter off with "modeling choice" answers.
answer: |-
  Here's a sequence of seven targeted questions designed to force substantive commitments on UDT's core challenges, with follow-ups anticipating common deflections. Each question presses on a specific weakness, and the follow-ups cut off escape routes by rejecting "modeling choice" hedges.

  ---

  ### **Question 1 (Parfit's Hitchhiker: Causal Irrelevance)**  
  *"In Parfit's Hitchhiker, once the driver has already driven you to town and left, paying them can't possibly affect whether you got the ride—it's causally inert. Yet UDT says you must pay to 'fulfill the policy.' Why is it rational to spend money on something that can't change any outcome, just to satisfy a correlation that's already resolved?"*  

  **Likely Response:**  
  *"Paying maintains logical correlation with the pre-commitment that made the driver pick you up. Defecting now would make the policy inconsistent, so future copies of you (or similar agents) wouldn't be trusted."*  

  **Follow-Up (Pre-empting "modeling choice"):**  
  *"But this is a one-shot interaction: you have no future selves or similar agents. The driver is gone and won't interact with you again. If correlation can't possibly affect any past, present, or future state here, isn't UDT demanding a purely symbolic sacrifice? Does UDT collapse into a deontological rule ('always keep promises') when correlations are irrelevant?"*  
  *(Forces commitment: Either UDT is irrational in one-shot cases, or it smuggles in non-consequentialist ethics.)*  

  ---

  ### **Question 2 (Smoking Lesion: Correlation vs. Control)**  
  *"In the Smoking Lesion, UDT says you shouldn't smoke because it correlates with not having the lesion. But the lesion is fixed before you decide—smoking doesn't cause or prevent it. Why pay a cost (forgoing smoking's pleasure) for a correlation you can't influence?"*  

  **Likely Response:**  
  *"Choosing 'don't smoke' is part of a policy that, when universally adopted, ensures you're in the world where lesions are absent. It's not about control—it's about being the type of agent who logically correlates with good outcomes."*  

  **Follow-Up (Attacking acausal influence):**  
  *"But the lesion exists independently of your decision algorithm. If we rerun this scenario 1000 times, lesions are randomly assigned. How does your policy change the *actual* probability you have a lesion? If it can't, isn't UDT confusing evidence (not smoking suggests no lesion) with intervention (not smoking prevents cancer)?"*  
  *(Forces commitment: Either UDT denies fixed priors, or it conflates epistemology with causal efficacy.)*  

  ---

  ### **Question 3 (Subjunctive Dependence: Metaphysical Status)**  
  *"UDT relies on subjunctive dependence: 'If I decide X, my other instances do Y.' But is this a real, mind-independent relation? Or is it just a psychological trick for handling uncertainty—like assuming your calculator's '2+2=4' is logically necessary?"*  

  **Likely Response:**  
  *"It's not metaphysical—it's a computational fact about logical consistency. If all instances run the same algorithm, their outputs correlate by mathematical necessity."*  

  **Follow-Up (Pressing on circularity):**  
  *"But if 'logical necessity' just means 'I programmed my model to assume it,' how is UDT different from self-fulfilling prophecies? For example, in Newcomb's Problem, if I *believe* my choice correlates with the prediction, that doesn't make it true unless the Predictor is infallible. What grounds this dependence beyond your own modeling assumptions?"*  
  *(Forces commitment: Either UDT requires omniscient predictors (which fails in bounded cases), or it's question-begging.)*  

  ---

  ### **Question 4 (Smoking Lesion Revisited: CDT Retort)**  
  *"Assume the lesion is purely correlational: smoking doesn't cause cancer; the lesion causes both. CDT says: 'Smoke! Cancer is fixed, so enjoy the pleasure.' UDT says: 'Don't smoke.' But if smoking is pleasurable and can't change cancer risk, why is UDT's policy superior when it actively deprives you of utility?"*  

  **Likely Response:**  
  *"CDT ignores the logical link between your decision and the lesion. By not smoking, you're more likely to be in the branch of reality where lesions don't exist."*  

  **Follow-Up (Demanding proof of mechanism):**  
  *"But 'branch of reality' implies Many-Worlds, which isn't part of the original problem. In a single world with a fixed lesion, how does your decision *physically* alter the probability you have it? If it can't, isn't UDT's gain purely from self-deception—like avoiding smoking to 'feel like' a healthy person?"*  
  *(Forces commitment: Either UDT requires speculative physics, or it endorses utility from false beliefs.)*  

  ---

  ### **Question 5 (Bounded Agents: Computability)**  
  *"UDT requires computing the optimal policy over all possible worlds. But for bounded agents, this is uncomputable. How can UDT even be defined when you can't determine what 'the best policy' is?"*  

  **Likely Response:**  
  *"We use heuristics or approximate the policy. It's like chess: we can't calculate all moves, but we follow principles that approximate optimal play."*  

  **Follow-Up (Pressing inconsistency):**  
  *"But UDT's optimal policy depends on logical relationships only knowable through unlimited computation. If I approximate with 'don't smoke' in Smoking Lesion, but the true optimal policy requires a complex logical fact I can't compute, how is your heuristic still UDT? Isn't this just CDT/EDT in disguise?"*  
  *(Forces commitment: Either UDT is undefined for bounded agents, or it reduces to existing theories.)*  

  ---

  ### **Question 6 (Parfit + Boundedness: Self-Defeating Policy)**  
  *"Suppose you're a bounded UDT agent in Parfit's Hitchhiker. You can't compute the full policy, so you use a heuristic: 'always pay drivers.' But if the driver knows you're bounded, they might infer you'll pay *regardless* of your actual policy—making your pre-commitment irrelevant. Why wouldn't a rational driver ignore your 'policy' entirely?"*  

  **Likely Response:**  
  *"The driver models me as an ideal UDT agent. Boundedness is a practical limitation, not part of the theory."*  

  **Follow-Up (Rejecting idealization):**  
  *"But if UDT only works for ideal agents, and real agents *must* approximate, doesn't the driver exploit this? After all, your heuristic ('always pay') is predictable by CDT agents. Doesn't this make UDT *lose* against CDT in practical interactions?"*  
  *(Forces commitment: UDT either fails in real-world cases or admits its recommendations are exploitable.)*  

  ---

  ### **Question 7 (Subjunctive Dependence in Bounded Contexts)**  
  *"When two bounded UDT agents interact, neither can compute the other's output exactly. How can subjunctive dependence hold when logical uncertainty means your decisions *aren't* perfectly correlated? Isn't UDT's 'same algorithm' claim false in practice?"*  

  **Likely Response:**  
  *"We assume they use similar approximations, so correlations still hold probabilistically."*  

  **Follow-Up (Pressing fragility):**  
  *"But if I use a Monte Carlo simulation for my policy and you use gradient descent, our decisions decouple. Why should I believe UDT's coordination claims when *any* computational difference breaks the logical link? Isn't this dependence so fragile that it vanishes outside toy models?"*  
  *(Forces commitment: UDT either assumes unrealistic homogeneity or can't guarantee coordination.)*  

  ---

  ### **Why This Sequence Works**
  - **Blocks Deflections:** Follow-ups explicitly pre-empt "modeling choice" retreats by demanding physical mechanisms, empirical evidence, or admissions of failure.  
  - **Cross-Links Themes:** Parfit → boundedness (Q5→Q6), Smoking Lesion → subjunctive dependence (Q2→Q3), etc.  
  - **Forces Binary Choices:** Each follow-up presents a dilemma (e.g., "Is UDT metaphysical or self-deceptive?"), denying neutral ground.  
  - **Builds Pressure:** Starts with intuitive puzzles (Parfit), escalates to foundational challenges (subjunctive dependence), and ends with computability—UDT's weakest point.  

  **Final Tip:** If he still evades, anchor him with: *"If we built a UDT agent today, would it pay the hitchhiker driver? Yes or no—and what would the code do?"* Demand concrete answers.
