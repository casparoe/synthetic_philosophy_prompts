  - **Strategy space**: The input domain of the program is the set of all strategy profiles. Each strategy profile is an input. The program is a function that, given a strategy profile, returns a payoff for each player. However, note that the elimination procedure does not run on a single input but over the entire domain.

  - **Dominance relation**: We can think of a strategy `s_i` for player `i` as a piece of code (or a candidate instruction) that we are considering for elimination. The dominance condition is an analysis that proves that `s_i` is "unprofitable" in every context (i.e., for every strategy of the opponents). The context `s_{-i}` is analogous to the state of the rest of the program (the opponents' strategies). 

