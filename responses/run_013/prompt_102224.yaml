  We are going to translate iterated elimination of dominated strategies (IEDS) into the vocabulary of a compiler engineer.

  First, the standard account in game theory:

  - **Strategy space**: The set of all possible actions (pure strategies) available to each player in a game. In a normal-form game with `n` players, the strategy space for player `i` is a finite set `S_i`. The entire space is the Cartesian product `S = S_1 × S_2 × ... × S_n`. Each element `s = (s_1, s_2, ..., s_n)` is a strategy profile.

  - **Dominance relation**: A strategy `s_i` for player `i` is strictly dominated by another strategy `t_i` (or by a mixed strategy) if, for every possible combination of the other players' strategies (i.e., for every `s_{-i}`), the payoff for player `i` from playing `t_i` is strictly greater than from playing `s_i`. Similarly, weak dominance requires the payoff to be at least as good in every case and strictly better in at least one.

    More precisely:
    - Strict dominance (pure): `∃ t_i ∈ S_i such that ∀ s_{-i} ∈ S_{-i}, u_i(t_i, s_{-i}) > u_i(s_i, s_{-i})`
    - Strict dominance (mixed): `∃` a mixed strategy `σ_i` (a probability distribution over `S_i`) such that `∀ s_{-i} ∈ S_{-i}, EU_i(σ_i, s_{-i}) > u_i(s_i, s_{-i})` where `EU_i` is the expected utility.

  - **Single round of elimination**: In one round, we remove from the strategy space of each player every strategy that is strictly dominated (by any pure or mixed strategy). This removal is done simultaneously for all players. The surviving set is the set of strategy profiles that remain.

  - **Procedure**: We start with the full strategy space. We repeatedly apply the elimination step (removing all strictly dominated strategies in the current space) until no more strategies can be eliminated. The resulting set is called the set of strategies that survive iterated elimination of strictly dominated strategies (IESDS). For weak dominance, the procedure is similar but we use weak dominance.

  - **Justification**: The procedure is justified by the assumption of common knowledge of rationality. This means that every player is rational (and hence would not play a dominated strategy), every player knows that every other player is rational, every player knows that every other player knows that every player is rational, and so on ad infinitum. Therefore, at each step, we can remove strategies that are dominated relative to the current (reduced) strategy space.

