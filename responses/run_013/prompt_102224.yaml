  - **Single round of elimination**: This is analogous to an analysis pass that, for every player, deletes every strategy that is dominated (according to the current strategy space). The pass operates simultaneously on all players. The surviving set is the reduced strategy space after the pass.

  - **Procedure**: We start with the full strategy space and iteratively apply the dominance elimination pass until a fixpoint is reached (no more strategies can be eliminated). This is a fixpoint iteration in a dataflow framework.

  - **Justification**: The common knowledge of rationality is the guarantee that at every step, every player will avoid playing a dominated strategy. This is analogous to an optimization being sound: we can safely remove the code (strategy) because we know it will never be executed (played) by a rational player. The soundness criterion here is that the surviving set must contain all strategies that could ever be played by rational players, and the elimination does not remove any such strategy.

