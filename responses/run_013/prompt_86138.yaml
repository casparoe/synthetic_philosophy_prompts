answer: |-
  Here is the joint statement drafted according to your specifications, reflecting a good-faith adversarial collaboration between a Legal Moralist (LM) and a Liberal (Lib):

  **Joint Statement: On the Proper Grounds for Criminalisation**

  **Section 1: Agreed Claims**
  We, the undersigned Legal Moralist and Liberal, affirm the following points of agreement after sustained dialogue:

  1.  **Aims of Criminal Law:** The primary aim of the criminal law is to prevent harm to individuals and protect essential public goods necessary for a secure and functional society. Both prevention of harm and the maintenance of social order are legitimate state concerns.
  2.  **Defining Harm:** Harm encompasses:
      *   Physical injury, death, or direct risk thereof.
      *   Significant psychological suffering or impairment.
      *   Violation of fundamental rights (e.g., liberty, property, privacy).
      *   Severe damage to essential public goods and institutions (e.g., functioning of the justice system, public health infrastructure, national security).
      *   Serious offence, understood as profound disturbance, outrage, or disgust *beyond mere dislike or disapproval*, inflicted upon unwilling witnesses or participants.
  3.  **"Enforcing Morality" Defined:** We agree that the phrase "the law may enforce morality," in the context of this debate, specifically refers to the claim that conduct may be justifiably criminalised *solely* because it is judged morally wrong by a significant portion of the community (or its representatives), *even in the absence of any identifiable harm (as defined in 2) or serious offence (as defined in 2e) caused to others by that specific conduct*.
  4.  **Necessity of Moral Wrongfulness?** We agree that moral wrongfulness is *not a necessary condition* for criminalisation. Many purely regulatory offences (e.g., certain traffic violations, licensing requirements) are not inherently immoral but serve important public interests. Criminalisation can legitimately target harmful conduct even if it isn't widely viewed as morally wrong.
  5.  **Sufficiency of Harm?** We agree that the *mere fact* that conduct causes *some* harm (or offence) is *not sufficient* for criminalisation. Principles of proportionality, necessity (least restrictive means), and the avoidance of undue interference with liberty mean that the harm/offence must reach a significant threshold and criminalisation must be a proportionate response.
  6.  **Disaggregating "Enforcing Morality":** The debate over "enforcing morality" primarily concerns the *sufficiency* of shared moral condemnation as a ground for criminalisation, distinct from harm/offence. The Liberal denies moral condemnation is sufficient alone. The Legal Moralist affirms it can be sufficient. Both agree moral condemnation can be a *contributory reason* strengthening an existing case based on harm/offence.
  7.  **The Core Empirical Claim:** The Legal Moralist’s central argument for the sufficiency of shared moral condemnation rests on the empirical proposition: **"The widespread perception that conduct condemned by a society's shared morality is legally permitted significantly damages the bonds of mutual trust, respect, and common identity essential for that society's stability and cohesion, thereby causing a distinct and serious harm to the social fabric."** The Liberal disputes the strength, necessity, or universality of this causal link. *This is fundamentally an empirical claim, open to investigation.*
  8.  **Evidence for the Core Claim:** We agree that evidence relevant to the core empirical claim (Point 7) could include:
      *   Comparative studies of social cohesion, trust levels, and anomie in societies with differing approaches to criminalising morally condemned but apparently harmless conduct.
      *   Historical analysis of periods of significant moral/legal change (e.g., decriminalisation of homosexuality, changes in censorship laws) tracking measurable indicators of social stability before, during, and after.
      *   Sociological and psychological research on the sources of social cohesion, the role of shared norms/symbols, and the impact of perceived permissiveness towards taboo violations.
      *   The absence of widespread social collapse following the decriminalisation of specific, previously condemned conduct (e.g., suicide, adultery).
  9.  **Truth vs. Sharedness:** We agree that the Legal Moralist position, *as presented in this debate concerning the law's function*, relies primarily on the *fact of shared belief* in a moral norm and its perceived importance to social cohesion. It does *not* inherently require the moral norm to be objectively *true*. The Liberal position is compatible with either view of morality but focuses on the justification for state coercion.
  10. **Burden of Proof:** We agree that when considering criminalisation of specific conduct where the empirical link to social harm (Point 7) is contested or unclear, the *burden of proof* lies with those proposing the criminalisation to demonstrate its necessity and proportionality. However, we disagree on the *standard* of evidence required to meet this burden regarding the social cohesion argument (see Residual Disagreements).
  11. **Historical/Comparative Record Shows:**
      *   Laws *have* historically been used to enforce prevailing moralities, sometimes maintaining order, sometimes causing significant injustice and harm (e.g., blasphemy laws, sodomy laws used oppressively).
      *   Societies *can* and *do* change their shared moral understandings over time, often accompanied by legal change.
      *   Decriminalisation of specific morally condemned acts (e.g., homosexuality between consenting adults in private) *has* occurred in numerous societies *without* leading to the widespread social disintegration critics predicted.
      *   The record does *not* conclusively prove that *no* type of moral transgression, if permitted, could *ever* cause significant harm to social cohesion under *any* circumstances. Nor does it prove such harm *must* inevitably occur.

  **Section 2: Residual Disagreements**
  1.  **Sufficiency of Moral Condemnation (The Core Dispute):**
      *   *LM:* "We affirm that the serious, widespread, and persistent moral condemnation of certain conduct by a society *is*, in itself, a sufficient ground for its criminalisation. Permitting such conduct signals official endorsement or indifference, eroding the shared moral framework that is foundational to social trust and stability. This erosion constitutes a distinct and profound harm to the common good."
      *   *Lib:* "We deny that shared moral condemnation alone is sufficient justification for criminalisation. The state must identify concrete harm (as defined in Section 1.2) or serious offence caused by the specific conduct to justify the coercion and intrusion inherent in criminal law. The mere existence of moral disapproval, however strong, does not constitute such harm. Protecting social cohesion, while important, cannot override this fundamental liberty constraint without evidence of specific, tangible harm linked to the *permission* of the act."
  2.  **Nature of the Social Cohesion Link:**
      *   *LM:* "The shared morality *is constitutive* of the social bond. Its deliberate public violation, especially if legally permitted, strikes at the heart of society's self-understanding and mutual commitments, *necessarily* causing damage."
      *   *Lib:* "Shared morality is often a *correlate* or *product* of social cohesion rooted in other factors (shared history, institutions, mutual benefit), not necessarily its foundation. Permitting divergent conduct may challenge conventions but does not inherently destroy the deeper bonds of a tolerant society. Cohesion depends more on procedural fairness and mutual respect than substantive moral uniformity."
  3.  **Standard of Evidence for Social Harm:**
      *   *LM:* "Given the profound and potentially irreversible nature of harm to the social fabric, and the difficulty of measuring it with scientific precision, the state is justified in acting on a reasonable apprehension of such harm based on the depth and nature of the moral conviction, sociological understanding, and historical precedent. We do not require conclusive proof of imminent collapse."
      *   *Lib:* "The justification for state coercion, especially where no direct harm to others is evident, demands a *high standard of evidence* for the claimed social harm. Reasonable apprehension is insufficient; there must be demonstrable, specific, and significant causal links between permitting the conduct and measurable damage to social stability or essential public goods. Sociological speculation cannot override individual liberty."
  4.  **The Scope of "Harm" and the Role of Offence:** *(Note: Partly Verbal)*
      *   *LM:* "We view the harm to social cohesion caused by permitting deeply condemned acts as falling squarely within the definition of 'harm to essential public goods' (Section 1.2d). It is distinct from, and more fundamental than, the 'serious offence' (Section 1.2e) individuals might feel. The Liberal's narrow focus on direct individual harm neglects this crucial societal dimension."
      *   *Lib:* "We accept 'harm to essential public goods' as legitimate grounds. However, we categorise the LM's claimed 'harm to social cohesion through permission' differently: if proven, it *would* be a harm. But the dispute is precisely over whether this specific type of 'harm' (a) exists in the required form and (b) justifies criminalisation. Conflating it with established public goods harms (like destroying infrastructure) is misleading. It remains a distinct and highly contested claim." *(The disagreement here is substantive, but the verbal aspect lies in whether the LM's claim automatically qualifies as the type of "harm" the Lib accepts as grounds. The Lib says "only if proven", the LM says "it inherently is").*

  **Section 3: Cruxes and Test Cases**
  1.  **Crux:** Does the legal permission of specific, intensely morally condemned but privately conducted, apparently harmless acts demonstrably cause significant, measurable damage to social cohesion (trust, stability, shared identity)?
      *   **Test Case:** Consider the decriminalisation of **private, consensual ritualistic desecration of culturally sacred symbols (e.g., specific religious items or national emblems) solely for personal gratification, where no one else is present or aware of the act.**
          *   *Evidence Sought:* Longitudinal studies comparing social trust, community engagement, reported sense of belonging, and political stability metrics before and after such decriminalisation in otherwise stable societies. Surveys exploring if knowledge (if it became public) that *such acts were legal* (even if rare) would significantly alter citizens' fundamental trust in fellow citizens or institutions.
          *   *LM Prediction:* Knowledge that such acts are legally permitted, even if rare and private, would significantly corrode the shared values underpinning society, leading to measurable declines in trust and cohesion over time. Historical examples of perceived attacks on core symbols often correlate with social tension.
          *   *Lib Prediction:* No significant, measurable decline in core indicators of social cohesion would be directly attributable *to the mere legal permission* of such private acts. Any outrage would stem from specific, publicised *instances* or other factors, not the legal status itself. Cohesion relies on broader institutions and shared interests.
  2.  **Crux:** Can there be conduct that is universally agreed to be morally wrongful, causes no harm or serious offence to others (as defined in Section 1.2), and yet where even Liberals feel significant unease about its full legal permissibility?
      *   **Test Case:** Consider **consensual sexual acts between an adult and a non-human animal (bestiality) where the animal shows no discernible signs of distress/pain (e.g., certain scenarios debated in animal ethics), occurs in private, and remains undisclosed.**
          *   *Evidence/Argument Sought:* Philosophical analysis of the nature of wrongfulness absent harm. Psychological exploration of "moral disgust" and its relationship to concepts of harm. Potential slippery slope arguments regarding normalisation. Whether the Lib's hesitation stems from residual concerns about *potential* animal harm/distress (even if unobservable), offence to society *if known*, or a true instance of wrongfulness without harm.
          *   *LM Argument:* This case demonstrates the insufficiency of the harm principle alone. The profound moral revulsion and judgement of degradation involved point to a wrong that transcends identifiable harm/offence and attacks fundamental notions of appropriate relations, potentially eroding societal norms if permitted.
          *   *Lib Argument:* Hesitation likely stems from: (a) Skepticism that *no* harm/distress to the animal occurs; (b) The extreme *potential* for harm if practices spread or boundaries blur; (c) The overwhelming *serious offence* it would cause *if publicly known*, making its true privacy practically untenable. Pure moral condemnation alone remains insufficient; the hesitation points to underlying concerns falling within existing Lib grounds (harm risk, offence potential).
  3.  **Crux:** Does the *public* nature of conduct significantly alter the case for criminalisation based on social cohesion arguments, compared to identical private conduct?
      *   **Test Case:** Compare the private desecration case (Crux 1) with **the identical act of ritualistic desecration performed openly in a public square.**
          *   *Evidence Sought:* Research on the impact of publicly visible norm violations vs. private ones on perceived social legitimacy, normative expectations, and trust. Historical examples of state responses to public vs. private moral transgressions and their societal impact.
          *   *LM Argument:* Public performance fundamentally changes the act. It constitutes a direct, intentional challenge to the shared public morality and the society's symbolic order. It is an act of repudiation visible to all, causing immediate and profound offence (Section 1.2e) and demonstrably harming social cohesion by publicly shredding shared sacred commitments. Criminalisation is clearly justified.
          *   *Lib Argument:* Public performance introduces the element of *serious offence* (Section 1.2e) inflicted on unwilling observers. This alone may reach the threshold for justified restriction, distinct from the private act. The social cohesion argument remains empirically unproven as the *primary* justification; the direct, unavoidable offence to citizens is the clearer and sufficient ground here.

  **Section 4: Table of Disagreements**

  | Core Issue                              | Legal Moralist (LM) Position                                                                 | Liberal (Lib) Position                                                                                               |
  | :-------------------------------------- | :------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------- |
  | **1. Sufficiency of Moral Condemnation** | Shared moral condemnation alone *is sufficient* justification for criminalisation.            | Shared moral condemnation alone is *not sufficient*; concrete harm/serious offence is required.                     |
  | **2. Basis of Social Cohesion**         | Shared morality is *constitutive* of social cohesion; its permission inherently damages it. | Shared morality often *correlates* with cohesion; permission of divergence doesn't inherently destroy deeper bonds. |
  | **3. Evidence Standard for Social Harm** | Reasonable apprehension justifies action; conclusive proof is impractical/unnecessary.        | High standard of demonstrable, specific causal evidence required to justify coercion.                               |
  | **4. Scope of "Harm" (Cohesion Harm)**  | Harm to cohesion via permission *is* a distinct harm to essential public goods.               | Cohesion harm via permission is a *contested claim*, not automatically accepted as valid "harm" without proof.       |

  **Signed:**

  *   _________________________ (Legal Moralist)
  *   _________________________ (Liberal)

  **Drafting Notes & Your Suspicions:**

  1.  **Disaggregation Validated:** The statement clearly isolates the sufficiency claim (Point 6, Disagreement 1) as the core battleground, with necessity rejected by both (Point 4) and contributory role accepted (Point 6).
  2.  **Empirical Core Confirmed:** The LM's key argument is framed as the empirical claim in Point 7. The statement explicitly treats it as empirical, outlines relevant evidence (Point 8), and structures a crux (Crux 1) around testing it.
  3.  **Truth vs. Sharedness Clarified:** Point 9 explicitly resolves this: the LM position here relies on sharedness for the social cohesion argument. The Lib position remains agnostic on moral truth but demands justification for coercion. The burden of proof (Point 10) and the standard of evidence (Disagreement 3) are highlighted as key residual friction points *once* the debate centres on the empirical claim.
  4.  **Concrete Cases Included:** Crux 1 (Private Desecration - harmless condemned practice), Crux 2 (Bestiality - victimless wrong causing Lib hesitation), Crux 3 (Public Desecration - openness altering the case) are described plainly.
  5.  **Constraints Adhered To:**
      *   Agreed claims have substantial content (e.g., defining harm, rejecting moral necessity, isolating the sufficiency claim, framing the empirical core, burden of proof).
      *   Residual disagreements are starkly presented in each side's likely phrasing.
      *   Bedrock differences are identified (especially Disagreements 1 & 3). No false agreement manufactured.
      *   The joint statement *is* judged possible to write honestly, as the core dispute is isolatable (sufficiency of moral condemnation based on an empirical claim about social cohesion) and other areas yield significant agreement or clarification. The obstacle remains the fundamental disagreement over the sufficiency claim and the evidence threshold, but these can be delineated.
