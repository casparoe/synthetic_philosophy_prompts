answer: |-
  ### Pantoum: "The Cause of Ourselves"

  You do what you do because of how you are.  
  To answer for the act, you must command the cause.  
  But to command the cause, you must have built your star —  
  And self-creation breaks against the laws.  

  To answer for the act, you must command the cause.  
  What shaped your soul? Some deeper, older will?  
  And self-creation breaks against the laws.  
  Or did you spring by accident, unchained and still?  

  What shaped your soul? Some deeper, older will?  
  That prior self, too, must be your design.  
  Or did you spring by accident, unchained and still?  
  But randomness won’t make your actions mine.  

  That prior self, too, must be your design.  
  But to command the cause, you must have built your star —  
  But randomness won’t make your actions mine.  
  You do what you do because of how you are.  

  ---

