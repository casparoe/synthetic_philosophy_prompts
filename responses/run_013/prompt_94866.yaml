prompt: |-
  I spent my working life on things that could be measured, much of it on heat, and I never quite got over how much scaffolding had to be in place before anyone could honestly say that one body was twice as hot as another. Ordering came easily; even an interval scale came easily; what made the ratios mean anything was a body of theory and a physical zero underneath, not the numbers themselves. Now I am retired and reading moral and political philosophy, and I keep meeting people who compare the welfare of different persons as though it were the least controversial thing in the world, while others insist the whole enterprise is a category mistake. Before I take a side I want the specification: what would a theory of interpersonal utility comparison have to deliver in order to count as adequate?

  Write me that list of desiderata. For each, give the case or consideration that makes it a requirement rather than a preference of some camp. I expect the list to cover at least the following, though I want you to reorganize or extend it as the logic demands:

  - what the theory must reproduce within a single person before it reaches across persons — the representation of that person's preferences, including under risk, and what it does when those preferences are incomplete or cyclical;
  - which comparisons it undertakes to license — bare ordering, differences, or ratios — and by what device it fixes the level, given that a utility function is standardly determined only up to a positive affine transformation of each person's own scale;
  - the invariance the theory claims: which rescaling of individual scales leaves its cross-person verdicts untouched, and how it avoids the trap of a comparison that is merely a restatement of the normalization it stipulated;
  - the stock cases it must get right — a being who converts any quantity of resources into colossal satisfaction, a person whose wants have shrunk to fit a deprived life, two people with the same ranking of outcomes but opposite attitudes to risk, and a person who wants very little set against one who wants a great deal;
  - the aggregation the comparison is meant to feed, and whether the comparison is defined narrowly enough to support that aggregation or only loosely enough to gesture at it.

  Then do three things with the list. First, mark which requirements are genuinely part of adequacy and which are the prejudices of a particular camp — I suspect the demand that the comparison be independently measurable, and the demand that it be invariant, are each doing work that deserves scrutiny. Second, tell me whether any two of the requirements cannot be satisfied together, and which pair; if the list is jointly unsatisfiable in that way, that is the result I most want, so say so plainly rather than papering over it. Third, name the single requirement that does the most to eliminate candidate theories, and say briefly how the leading contenders — the summing tradition, the primary-goods and capability approaches, and the attempt to ground comparison in what a person would choose were he imaginatively placed in another's position — fare against it. Keep the emphasis on the requirements and the cases behind them; I will work out the scorecard myself.
reasoning: |-
  We are constructing a list of desiderata for an adequate theory of interpersonal utility comparison (IUC). The goal is to specify what such a theory must deliver to be considered adequate. We will consider the points mentioned and extend as necessary. The list should be organized logically.

  ### Desiderata for an Adequate Theory of Interpersonal Utility Comparison

  1. **Intrapersonal Representation**:
     - **Requirement**: The theory must first provide an adequate representation of a single person's preferences. This includes representing preferences under conditions of risk and uncertainty, and handling cases of incomplete or cyclical preferences.
     - **Case/Consideration**: Without a solid foundation for one person, any extension to interpersonal comparisons is baseless. For example, if a person's preferences are cyclical (A>B, B>C, C>A), then we cannot even assign a consistent ordering, let alone a utility function. Similarly, under risk, we need expected utility or a generalization to model choices. This requirement stems from the need for a consistent and coherent foundation for individual welfare.

  2. **Scope of Comparisons**:
     - **Requirement**: The theory must specify what kind of comparisons it supports: ordering (who is better off), differences (by how much one is better off than another), or ratios (twice as well off). It must also specify how it fixes the "level" of utility, given that utility functions are typically unique only up to positive affine transformations (i.e., unique up to scale and origin).
     - **Case/Consideration**: Without fixing the scale, we cannot meaningfully compare differences or ratios across individuals. For example, if we only have an ordinal scale for each person, we can say Alice is happier than Bob, but not by how much. To get ratios, we need a fixed zero and unit. The consideration is that different types of comparisons are needed for different normative purposes (e.g., ratios for utilitarianism, which requires summing utilities). The device for fixing the scale might be a natural zero (like the absence of pain) or a normalization procedure (like setting the utility of a reference bundle to zero).

  3. **Invariance Requirements**:
     - **Requirement**: The theory must specify which transformations of the individual utility scales leave the interpersonal comparisons unchanged. It must avoid being a mere restatement of the chosen normalization (i.e., it must have empirical content).
     - **Case/Consideration**: Without invariance, the comparisons are arbitrary. For example, if we arbitrarily rescale one person's utility function by multiplying by 2, then the interpersonal comparisons should not change if the transformation is allowed. But if the theory only works with a specific normalization, then it may be circular. The trap is that if we define interpersonal comparisons by fiat (e.g., "we set both to have the same maximum"), then the comparison is merely a convention. The requirement is that the comparisons should be based on something beyond the arbitrary choice of scale.

  4. **Handling Stock Cases**:
     - **Requirement**: The theory must deliver plausible verdicts in several stock cases:
       - (a) **The Convertor**: A being who can convert any quantity of resources into colossal satisfaction (e.g., a super-efficient pleasure machine).
       - (b) **The Contented Deprived**: A person whose preferences have adapted to a deprived life (e.g., a person in chronic poverty who reports being content).
       - (c) **Risk Attitudes**: Two people with the same ordinal ranking of outcomes but opposite attitudes to risk (one risk-averse, one risk-seeking).
       - (d) **Differential Wanting**: A person who wants very little (e.g., a minimalist) versus one who wants a great deal (e.g., a hedonist).
     - **Case/Consideration**: These cases test the robustness and fairness of the theory. For example:
       - (a) If the convertor always gets huge utility from any resource, should we give them more? This tests whether the theory respects efficiency or if it leads to absurd redistributions.
       - (b) The contented deprived might lead to the conclusion that they don't need help, but that seems to endorse an injustice. The theory must not let adaptation undermine claims to resources.
       - (c) If two people rank outcomes the same but one is risk-averse and the other risk-seeking, then under expected utility they have different utility functions. The comparison must account for risk attitudes without being arbitrary.
       - (d) The minimalist and the hedonist: if the minimalist is satisfied with little, does that mean we should give them less? Or should we respect their preferences? This tests the theory's handling of preferences.

  5. **Aggregation Compatibility**:
     - **Requirement**: The theory must specify the type of aggregation it is meant to support (e.g., utilitarianism, prioritarianism, egalitarianism) and whether the comparisons it provides are sufficient for that aggregation. It must not be too loose (e.g., only providing an ordering when the aggregation requires cardinal comparisons).
     - **Case/Consideration**: The main purpose of IUC is typically to aggregate individual welfares into a social welfare function. If the aggregation requires cardinal and comparable utilities (like utilitarianism, which sums utilities), then the theory must deliver at least interval scales that are comparable across persons. If it only provides an ordering, it cannot support utilitarianism.

  ### Analysis of the Desiderata

  Now, we do three things as requested:

  **First: Marking Genuine Adequacy vs. Camp Prejudices**

  - **Intrapersonal Representation**: Genuine requirement. Without a solid individual foundation, the extension to interpersonal is baseless.
  - **Scope of Comparisons**: Genuine requirement. The type of comparison must be specified and fixed appropriately for the intended use.
  - **Invariance Requirements**: Genuine requirement, but note: the demand for invariance might be seen as a preference for objectivity, which is a camp issue (e.g., positivists might demand it, while constructivists might not). However, to avoid arbitrariness, some invariance is necessary. The key is that the invariance should be based on the theory's structure and not merely by stipulation.
  - **Handling Stock Cases**: Genuine requirement. These are test cases that any theory must handle to be taken seriously.
  - **Aggregation Compatibility**: Genuine requirement. The theory must be fit for purpose.

  But note: the demand that the comparison be **independently measurable** (e.g., by neural activity) might be a camp prejudice (e.g., of empiricists). Similarly, the demand for **invariance** might be pushed too far by objectivists. However, a theory that does not have any invariance (i.e., is completely arbitrary) is not adequate. So we require some invariance, but the exact form might be debated.

  **Second: Incompatible Requirements**

  We must check if any two requirements cannot be satisfied together.

  One potential conflict is between:

  - **Handling the Contented Deprived** and **Aggregation Compatibility** (if the aggregation is utilitarian).

    - The contented deprived case: if a person has adapted to deprivation, then their utility function might assign high utility to low resources. A theory that respects individual preferences (as in the standard preference-based utility) would say they are well off. But this would justify not redistributing to them. However, many argue that this is unfair and that we should not reward oppression. So a preference-based theory might fail this case.

    - On the other hand, if we use an objective list (like primary goods) to avoid the adaptation problem, then we might not be respecting the individual's actual preferences (which might not value those goods). This conflicts with the **Intrapersonal Representation** requirement that we represent the individual's own preferences.

  Thus, we have a tension:

  - **Intrapersonal Representation** (which requires building utility from the individual's own preferences) and the requirement to handle the **Contented Deprived** case (which might require overriding those preferences in the name of justice) may be incompatible.

  Another potential conflict:

  - **Scope of Comparisons** (requiring ratios) and **Invariance**: If we require ratio-scale comparisons (so that we can say "twice as well off"), then we must have a fixed zero for each person. But the choice of zero might be arbitrary. For instance, if we take the zero to be the absence of life (death) or a reference point, then we must ensure that this zero is meaningful and invariant. However, in the case of the **Minimalist vs. Hedonist**, the minimalist might have a very low utility floor and the hedonist a high one. If we set the zero at the floor, then the hedonist might have a much larger scale. But then ratios might be distorted. So the requirement for ratio-scale comparisons might conflict with the requirement to handle the **Minimalist vs. Hedonist** case fairly.

  However, the most fundamental incompatibility is:

  **Requirement 1 (Intrapersonal Representation) and Requirement 4b (Handling the Contented Deprived) cannot be satisfied together by any theory that bases utility on actual preferences.**

  This is because the contented deprived person, by definition, has preferences that have adapted to their deprivation. If we respect their preferences (as in Requirement 1), we must accept that they are well off. But the stock case requires that we do not accept this, because it is a result of injustice. Therefore, any theory that satisfies Requirement 1 will fail Requirement 4b, and any theory that satisfies Requirement 4b must override Requirement 1.

  **Third: The Most Eliminative Requirement and How Contenders Fare**

  The requirement that does the most to eliminate candidate theories is:

  **Handling the Contented Deprived Case (Stock Case b).**

  Why? Because it forces a choice between respecting individual preferences (which leads to endorsing the adaptation) or appealing to an objective standard (which abandons the preference-based approach). This is a major dividing line.

  Now, how leading contenders fare against this requirement:

  1. **Summing Tradition (Utilitarianism based on preference satisfaction or hedonic experience)**:
     - If based on actual preferences, it fails because the contented deprived person has high utility. So it would not require redistribution to them.
     - If based on hedonic experience (like classical utilitarianism), it might also fail if the deprived person reports high happiness. But if we believe that their self-report is distorted by adaptation, then we might need to appeal to an objective measure of well-being. However, this is not standard in preference-based utilitarianism.

  2. **Primary Goods and Capability Approaches**:
     - These approaches avoid the problem by defining well-being in terms of resources (primary goods) or capabilities (what a person can be and do). The contented deprived person is still deprived in terms of primary goods or capabilities, so the theory recommends redistribution. This passes the stock case.
     - However, they fail on **Intrapersonal Representation** because they do not base utility on the individual's own preferences. The minimalist might not value the primary goods, but the theory would still count them as deprived.

  3. **Imaginative Placement (e.g., Harsanyi's extended preferences or similar)**:
     - This approach suggests that we compare utilities by imagining ourselves in the other's position and asking what we would prefer. For the contented deprived, if we imagine being in their position (with their preferences), we might also be content. So it would not recommend redistribution. Thus, it fails the stock case.
     - However, if we imagine being in their position but with our own preferences, then we might judge that we would be worse off. But this is not the standard approach and would be inconsistent with respecting their preferences.

  In summary, no theory satisfies all requirements simultaneously. The **Contented Deprived** case is particularly challenging and eliminates the preference-based approaches (like utilitarianism and imaginative placement) unless they are modified. The primary goods and capability approaches avoid the problem but at the cost of abandoning the preference-based foundation.

  ### Final List of Desiderata

  We present the list as specified, with the analysis above.

  1. **Intrapersonal Representation**: Must represent individual preferences, including under risk and with incompleteness/cyclicality. If preferences are cyclical, the theory must either resolve the cycle or declare non-comparability.

  2. **Scope of Comparisons**: Must specify the type (ordering, differences, ratios) and the device for fixing the scale. For ratios, a natural zero is needed.

  3. **Invariance**: Must specify the class of transformations (e.g., affine with common scale factor) that leave comparisons unchanged. Avoids circularity by having empirical content.

  4. **Stock Cases**:
     - (a) Convertor: Must handle the super-efficient being without leading to absurd redistribution.
     - (b) Contented Deprived: Must not take adaptation at face value.
     - (c) Risk Attitudes: Must account for risk aversion without being arbitrary.
     - (d) Minimalist vs. Hedonist: Must fairly compare the two.

  5. **Aggregation Compatibility**: Must support the intended aggregation (e.g., by providing the required type of comparable utilities).

  ### Conclusion

  The list is jointly unsatisfiable because of the conflict between respecting individual preferences (Intrapersonal Representation) and the requirement to not accept the contented deprived person's adaptation as genuine well-being (Stock Case b). This conflict is at the heart of the debate between preference-based and resource-based theories.

  The most eliminative requirement is the **Contented Deprived** case, which forces a choice between the two camps.

  You can now work out the scorecard.
answer: |-
  Below is the list of desiderata for an adequate theory of interpersonal utility comparison (IUC), reorganized logically and extended where necessary. Each requirement is grounded in a specific case or consideration to justify its necessity, avoiding mere camp preferences. The list is structured to build from individual foundations to cross-person comparisons, then to invariance and robustness, and finally to application and aggregation. I then address your three requests: (1) distinguishing genuine adequacy requirements from camp prejudices, (2) identifying incompatible requirements, and (3) naming the most eliminative requirement and evaluating leading contenders.

  ---

  ### **Desiderata for an Adequate Theory of Interpersonal Utility Comparison**

  1. **Intrapersonal coherence and completeness**  
     *Requirement*: The theory must fully represent a single person's preferences, including under conditions of risk (e.g., via expected utility), and handle incomplete or cyclical preferences (e.g., by allowing for indeterminacy or introducing rational constraints).  
     *Case/Consideration*: Without this, IUC lacks a credible foundation. For example, if preferences are cyclical (e.g., A > B, B > C, C > A), no consistent utility representation exists, making extensions to interpersonal comparisons incoherent. Similarly, risk sensitivity (e.g., one person prefers a certain $100 to a 50% chance of $250) reveals cardinal features of utility that are prerequisites for meaningful comparison. Incompleteness (e.g., a person cannot rank A vs. B) must be resolved without imposing arbitrary completions, as forced comparisons distort welfare judgments. This is a requirement because IUC must generalize from robust intrapersonal foundations; failure here undermines all cross-person claims.

  2. **Scope and scale fixation**  
     *Requirement*: The theory must specify what comparisons it licenses: ordering (A is better off than B), differences (A is better off than B by more than C is better off than D), or ratios (A is twice as well off as B). Crucially, it must fix the "level" of utility across persons by providing a non-arbitrary device to anchor the scale, given that individual utility functions are unique only up to positive affine transformations (i.e., scale and origin are arbitrary).  
     *Case/Consideration*: Ratio comparisons (e.g., "twice as hot") require a non-arbitrary zero point, just as temperature relies on absolute zero. Without this, ratios are meaningless—e.g., rescaling one person's utility by a factor of 2 would arbitrarily alter ratio judgments. The device must be empirical or theoretical (e.g., a natural zero like "no pain" or a normalization like "utility at subsistence level"), not stipulative. This is a requirement because different aggregation methods (e.g., utilitarianism needs ratios) depend on the scope, and ad hoc scale fixation reduces IUC to a tautology.

  3. **Empirical invariance**  
     *Requirement*: The theory must specify which rescalings of individual utility scales leave cross-person comparisons unchanged, ensuring its verdicts are invariant under transformations that preserve empirical content. It must avoid being merely a restatement of its normalization (i.e., it must have testable implications beyond its own assumptions).  
     *Case/Consideration*: If comparisons change under allowable transformations (e.g., adding a constant to one person's utility), they are arbitrary. For example, a theory claiming "A is happier than B" must not reverse if we redefine A's "zero" of happiness, unless the redefinition reflects new data. The trap is circularity: if a theory "fixes" scales by assuming equality in a reference state, it cannot then compare welfare in that state without begging the question. This is a requirement because invariance ensures objectivity; without it, IUC is a mathematical contrivance, not a tool for real-world ethics.

  4. **Robustness to stock cases**  
     *Requirement*: The theory must deliver defensible verdicts in paradigmatic cases:  
     - (a) **The Convertor**: A being who derives colossal utility from any resources (e.g., a machine converting $1 into 1000 "utils").  
     - (b) **Contented Deprived**: A person whose preferences adapt to deprivation (e.g., a lifelong prisoner who reports high satisfaction).  
     - (c) **Divergent Risk Attitudes**: Two people with identical ordinal rankings but opposite risk preferences (e.g., one risk-averse, one risk-seeking).  
     - (d) **Minimalist vs. Hedonist**: A person content with little versus one insatiably desiring more.  
     *Case/Consideration*: These cases probe theoretical adequacy. (a) tests whether the theory avoids absurd redistribution (e.g., giving all resources to the Convertor). (b) tests if it recognizes adaptive preferences as false consciousness, not genuine welfare. (c) tests whether risk attitudes (reflecting cardinal utility curvature) inform comparisons. (d) tests neutrality to preferences: e.g., should a stoic be deemed worse off than a glutton? Failure here indicates a theory is unworkable or unfair—e.g., ignoring risk may misjudge welfare under uncertainty.

  5. **Aggregation fitness**  
     *Requirement*: The theory must explicitly support the aggregation method it is intended for (e.g., utilitarianism, prioritarianism, or Pareto efficiency), providing comparisons defined narrowly enough to feed that aggregation. It must not "gesture" vaguely (e.g., claiming ordinal comparisons suffice for cardinal aggregation).  
     *Case/Consideration*: IUC is often meant for distributive ethics—e.g., utilitarianism requires summable ratios. If comparisons are only ordinal, aggregation collapses to a dictatorship or indifference. This is a requirement because IUC must be functional; loose comparisons invite paradoxes (e.g., Harsanyi's aggregation theorem fails without cardinal unit comparability).

  ---

  ### **Analysis of Desiderata**

  **First: Genuine Adequacy vs. Camp Prejudces**  
  - **Genuine adequacy requirements**: All five are necessary for a theory to be minimally adequate. Each addresses a failure mode:  
    - Intrapersonal coherence prevents internal inconsistency.  
    - Scope/scale fixation avoids arbitrary ratios.  
    - Empirical invariance ensures non-circularity.  
    - Stock cases test real-world applicability.  
    - Aggregation fitness ensures practical utility.  
    These are not camp-specific; they derive from logical coherence, empirical grounding, or ethical defensibility (e.g., ignoring the contented deprived condones oppression).  

  - **Camp prejudices masquerading as requirements**:  
    - *Independent measurability*: The demand that IUC be "directly observable" (e.g., via neuroscience) is a positivist/behaviorist prejudice. It is not essential for adequacy, as theories can be empirically grounded indirectly (e.g., through choice behavior). Case: Temperature comparisons were valid before quantum mechanics via thermodynamic theory.  
    - *Strong invariance*: Insisting that comparisons be invariant under *all* transformations (e.g., ratio-scale invariance for all cases) is a utilitarian or mathematical prejudice. Adequacy only requires invariance under *allowable* transformations tied to empirical content. Case: Requiring ratio invariance for the minimalist/hedonist may force an unnatural zero, violating neutrality.  

  **Second: Incompatible Requirements**  
  **The requirements are jointly unsatisfiable due to a conflict between *Intrapersonal coherence* and *Robustness to the Contented Deprived case*.**  
  - **Conflict**: Intrapersonal coherence demands that utility reflects actual preferences (e.g., via revealed preference theory). However, for the contented deprived, adaptive preferences (e.g., a slave reporting high satisfaction) must *not* be taken at face value—justice requires acknowledging objective deprivation. No theory can simultaneously respect preferences (as coherence requires) and override them (as the deprived case demands).  
  - **Why this is irreconcilable**: Preference-based theories (e.g., Harsanyi) fail the deprived case by endorsing adaptation. Objective-good theories (e.g., Rawls) fail intrapersonal coherence by ignoring preferences. Hybrid approaches (e.g., Nussbaum's capabilities) compromise one to salvage the other.  
  - **Consequence**: This tension exposes IUC as either preference-respecting but unjust, or justice-serving but paternalistic. No theory achieves both without circularity (e.g., defining "true" preferences post hoc).

  **Third: Most Eliminative Requirement and Contender Evaluation**  
  - **Most eliminative requirement**: *Robustness to the Contented Deprived case* eliminates the broadest range of candidate theories, as it forces a choice between preference sovereignty and objective welfare—a core divide in ethics.  
  - **How leading contenders fare against it**:  
    - **Summing tradition (e.g., Bentham, Harsanyi)**: Grounds utility in preference satisfaction or hedonic states. *Fails* the deprived case: It takes adapted preferences literally (e.g., the slave is "happy"), justifying neglect. It also struggles with risk attitudes if not cardinal.  
    - **Primary goods/capabilities (e.g., Rawls, Sen)**: Uses objective metrics (resources or freedoms). *Passes* the deprived case (deprivation is objective) but *fails* intrapersonal coherence: Preferences are ignored (e.g., the minimalist may reject extra goods), and scale fixation is arbitrary (no natural zero for capabilities).  
    - **Imaginative placement (e.g., Harsanyi, extended preferences)**: Compares utilities by asking, "What would I choose if I were in their shoes?" *Fails* the deprived case: Imaginative actors may internalize adaptive preferences (e.g., "As the slave, I'd be content"). Also fails risk attitudes if the imaginer projects their own risk aversion.  
    - **Leading contenders all fall short**: The deprived case is a "knockout test" for preference-based approaches, while objective approaches fail coherence. No theory satisfies all desiderata, but capabilities handle the deprived case best at the cost of paternalism.

  ---

  ### **Summary**  
  - **Adequacy requirements**: Intrapersonal coherence, scope/scale fixation, empirical invariance, stock-case robustness, aggregation fitness.  
  - **Incompatibility**: Intrapersonal coherence and the contented deprived case cannot be satisfied together.  
  - **Key tension**: Theories must choose between respecting preferences (risking injustice) or imposing objectivity (risking paternalism).  
  - **Most eliminative test**: The contented deprived case, as it forces this choice and rejects dominant approaches.  

  This list provides the specification you sought. The joint unsatisfiability is not a flaw but a reflection of the deep philosophical rift in IUC. Use the stock cases and aggregation demands as litmus tests when evaluating theories. If you pursue a scorecard, the deprived case will be the sharpest wedge.
