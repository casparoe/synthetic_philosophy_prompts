prompt: |-
  I host a small game-theory podcast, and next month's guest is a theorist I've been trying to book for ages. His whole line is that the iterated elimination of dominated strategies -- not Nash equilibrium -- should be the backbone of the subject: players discard dominated strategies, you let mixed strategies do some of the eliminating, and you iterate until nothing else can go; on his view Nash is downstream of this and we way overrate it. I want to press him hard and not just let him re-deliver the standard lecture, so can you draft me 8-10 interview questions? I need at least one each on the following, and for each of those a follow-up keyed to the answer he's most likely to give:

  - The fact that a mixed strategy can strictly dominate a pure strategy even when no pure strategy dominates it. I want to put a concrete matrix in front of him and make him say why the player "can't" play the dominated pure strategy. The one I'm planning to use (player 1's payoffs only, choosing A, B, or C against the opponent's two columns): A = (3, -1), B = (-1, 3), C = (0, 0). So a 50-50 mix of A and B yields 1 against either column, strictly beating C's 0 against either column, while neither A nor B beats C on its own. Make him defend why C is out of bounds.

  - The order-independence theorem -- what exactly it says, and whether it still holds once mixed strategies are allowed to do the dominating. Then hit him with the flip side: what happens when weakly dominated strategies enter the picture, and the fact that the order of elimination can change the outcome and can even knock out a Nash equilibrium. I want the follow-up to be about whether refusing to use weak dominance costs him most of the procedure's teeth.

  - The epistemic story. Does common knowledge of rationality actually get you the iteration, or only the first round? I think it buys only the first round in general and he'll need something extra -- make him name the extra assumption, defend it, then follow up on whether that assumption is doing illegitimate work.

  - How all this relates to rationalizability, and whether the correspondence between the two survives once there are three or more players rather than two.

  Then a couple more of your own that make him earn the claim that this is a genuine solution concept and not just a preprocessing step -- something about what it predicts, where it predicts anything different from Nash, and what would count as evidence against the whole program.

  Keep them pointed and technical, no "so tell us about your journey" fluff, and dont let him hide behind "that's a modeling choice" without paying for it.
reasoning: |-
  Okay, the user hosts a game theory podcast and has a guest who champions iterated elimination of dominated strategies (IEDS) over Nash equilibrium. They need pointed questions to challenge the guest rigorously. Let me break down the user's requirements.

  The user wants specific questions on four main topics with follow-ups. First is mixed strategies dominating pure ones. The example given is a matrix where C is dominated by a mix of A and B. The follow-up should question why players can't play C if they don't randomize. Need to highlight the randomization requirement here.

  Next is the order-independence theorem. The user wants to know if it holds with mixed strategies and then pivot to weak dominance causing order dependence. Follow-up should attack whether avoiding weak dominance makes IEDS toothless. The guest might say weak dominance is messy, but the user wants to push on practical applicability.

  Epistemic foundations come next. Common knowledge of rationality (CKR) only gets you one step. The follow-up should force the guest to name and defend additional assumptions, then question if those are realistic or circular. Need to press on whether "common p-belief" is testable or just convenient.

  For rationalizability, the key is multi-player games. The follow-up should ask why IEDS matters if rationalizability covers the same ground without iteration. The guest might say IEDS is computable, but the user wants to challenge if that's a substantive advantage.

  The user also wants original questions pushing IEDS as a full solution concept, not just preprocessing. Questions should demand predictions differing from Nash and empirical evidence. Examples include games where IEDS selects a unique outcome but Nash has multiple, or field evidence contradicting IEDS predictions.

  Underlying needs: The user likely wants to expose weaknesses in the guest's framework, ensuring the interview isn't a lecture. They need technical depth without letting the guest dodge. Deeper, they might want to challenge the overrating of Nash by testing if IEDS is truly superior. Unspoken need: compelling content for listeners by creating tension and clarity on foundational debates.

  Need to craft questions that force specific answers, prevent evasion, and highlight contradictions. Each follow-up must anticipate responses and counter them. For instance, on weak dominance, push how avoiding it leaves many games unsolvable. On epistemology, question if added assumptions are tautological. Ensure questions are concise but layered for maximum challenge.
answer: |-
  Here are 8 hard-hitting, technical questions designed to press your guest on the core claims of IEDS as the "backbone" of game theory, incorporating your specific requirements and including pointed follow-ups:

  **1. Mixed Domination & the "Can't Play" Justification:**  
  *(Matrix: Row Player Payoffs Only)*  
  &nbsp;&nbsp;&nbsp;&nbsp; | L | R  
  --- | --- | ---  
  **A** | 3 | -1  
  **B** | -1 | 3  
  **C** | 0 | 0  
  *Question:* In this matrix, pure strategy C is strictly dominated by the 50-50 mixture of A and B (yielding 1 > 0 against either column), yet neither A nor B dominates C individually. You argue C must be eliminated. But *why*, precisely, can a rational player *not* play C? They could choose it deliberately without randomizing. Are you implicitly mandating that players *must* consider mixing, even if they ultimately intend to play pure? Isn't that smuggling in a rationality assumption beyond simple payoff maximization?  
  *Likely Answer & Follow-up:* (He'll likely invoke "rationality requires considering all available strategies, including mixed"). *Follow-up:* But if the player *doesn't* randomize and deliberately chooses C (perhaps due to risk aversion, spite, misunderstanding, or simply refusing to randomize), haven't they violated your procedural rationality requirement *before* even considering payoffs? Does IEDS actually require players to commit to *ex ante* randomization as an essential capability, not just a conceptual tool? Isn't this a stronger behavioral demand than Nash, which asks only for a *consistent plan* (pure or mixed)?

  **2. Order-Independence & Mixed Strategies:**  
  *Question:* The classic order-independence theorem for IEDS with pure strategies is elegant. But your framework relies crucially on mixed strategies doing the eliminating. Does the order-independence result hold strictly when mixed strategies are allowed to dominate? If so, under what precise conditions?  
  *Likely Answer & Follow-up:* (He'll likely confirm it holds under strict dominance with mixed strategies allowed). *Follow-up:* Excellent. Now let's introduce *weak* dominance. With weak dominance, order *does* matter – eliminating in different sequences can yield different surviving sets, sometimes even eliminating Nash equilibria entirely. Your response is presumably to avoid weak dominance elimination entirely? Doesn't this refusal cripple IEDS in vast swathes of games (e.g., extensive forms, common games like the Battle of the Sexes) where weak dominance is the primary or only logical tool? If IEDS can only bite with strict dominance, isn't its domain severely limited compared to Nash?

  **3. Weak Dominance & Procedural Teeth:**  
  *Question:* Building directly on the previous point: Given the perils of order-dependence with weak dominance, you advocate for generally avoiding its use in the iterative process. But doesn't this render IEDS largely impotent in many strategically rich games? For instance, in a standard Centipede Game or even a simple sequential-move game, strict dominance alone often eliminates nothing. Without weak dominance, doesn't IEDS frequently fail to make *any* prediction beyond the first round, leaving us drowning in rationalizable strategies? How is this a robust "solution concept"?  
  *Likely Answer & Follow-up:* (He might argue weak dominance is too "dangerous," rationalizability is acceptable, or context might justify cautious use). *Follow-up:* If the cost of avoiding order-dependence is frequently no reduction beyond the first step (leaving only rationalizability), and if using weak dominance risks losing equilibria or getting arbitrary results, doesn't this highlight a fundamental weakness of IEDS *as a solution concept* compared to Nash, which provides a clear, consistent (if sometimes multiple) prediction point? Isn't IEDS often just a pre-processing step for Nash computation?

  **4. Epistemic Foundations - First Round Only?:**  
  *Question:* You argue IEDS is epistemically grounded: Common Knowledge of Rationality (CKR) implies players eliminate strictly dominated strategies. But standard results (e.g., Bernheim, Pearce) show CKR only guarantees players play *some* rationalizable strategy – equivalent to surviving *one round* of strict dominance elimination. To get full iterated elimination, you need more. What is the *minimal extra epistemic assumption* beyond CKR required to justify iterating to the limit, and how do you defend it as both necessary and reasonable?  
  *Likely Answer & Follow-up:* (He'll likely invoke Common Belief of Rationality (CBR) or "Common p-Belief" for finite iterations). *Follow-up:* Isn't Common *Belief* of Rationality (CBR) significantly stronger than CKR? It requires not just knowing everyone is rational, but believing they believe it, and so on, *ad infinitum*. Doesn't this assumption essentially bake the entire iterative process into the initial epistemic state? Is this a legitimate justification for IEDS, or is it circular – assuming the very iterated reasoning you're trying to justify? How is this epistemically more plausible than the fixed-point reasoning behind Nash?

  **5. Rationalizability & the n-Player Gap:**  
  *Question:* For two-player games, the set surviving iterated strict dominance (with mixed strategies) coincides exactly with the set of rationalizable strategies. In this case, isn't IEDS just a computational path to rationalizability? What unique ground does it claim beyond that?  
  *Likely Answer & Follow-up:* (He'll likely emphasize the procedural clarity or computational aspects of IEDS). *Follow-up:* But crucially, in games with *three or more players*, this equivalence breaks down. Rationalizability can be a strict superset of the IEDS set. In these cases, does IEDS make a *stronger* prediction than rationalizability? If so, what is the *epistemic justification* for this stronger prediction in multiplayer settings, given that CKR only guarantees rationalizability? Doesn't this multiplayer divergence expose that IEDS relies on a stronger (and perhaps less defensible) assumption about mutual reasoning than pure rationalizability does?

  **6. Solution Concept or Preprocessor? (The Core Challenge):**  
  *Question:* Proponents of Nash equilibrium argue that IEDS is primarily a valuable pre-processing tool to simplify finding NE, not a solution concept itself, precisely because it often stops short (no weak dominance) or coincides with rationalizability. Conversely, NE provides a clear definition of strategic stability. What concrete phenomenon does the *final set* of IEDS *predict* that Nash (or Rationalizability) does not? If it predicts the same outcome as Nash in cases where it works, and fails to predict anything specific where it doesn't, how is it more fundamental?  
  *Likely Answer & Follow-up:* (He'll argue that NE is an ex-post consistency check, while IEDS models the actual reasoning process). *Follow-up:* But if IEDS models the reasoning process, shouldn't we see empirical evidence of players *actually performing this iteration* in experiments? Yet, behavioral game theory often shows limited iteration (1-2 steps) and sensitivity to presentation (framing, payoff salience) – aspects Nash abstracts away. Doesn't this suggest IEDS, as a descriptive model of cognition, might be just as idealized (if not more so) than Nash, while lacking its predictive specificity?

  **7. Predictive Divergence & Falsifiability:**  
  *Question:* Give me a concrete example of a game where:  
      (a) Iterated strict dominance (allowing mixed) yields a unique prediction,  
      (b) This prediction differs from *all* Nash equilibria (pure or mixed), and  
      (c) You believe the IEDS prediction is the "correct" rational outcome.  
  If no such compelling game exists, doesn't this undermine the claim that IEDS is more fundamental than Nash?  
  *Likely Answer & Follow-up:* (He might struggle or offer a complex/contrived game). *Follow-up:* If compelling examples are rare or non-existent, doesn't this suggest IEDS primarily refines the *set* of potential Nash equilibria rather than replacing it? Furthermore, what specific empirical finding (lab experiment, field observation) would genuinely surprise you and force you to reconsider the centrality of IEDS?

  **8. The Burden of Weak Dominance (Revisited):**  
  *Question:* You dismiss reliance on weak dominance due to order-dependence. But strategically, weak dominance often captures clear-cut irrationality (e.g., choosing an action that is never better and sometimes worse than another, regardless of others). By categorically excluding it from the *iterative process*, aren't you throwing out strategically meaningful deductions? Couldn't a pragmatic approach apply weak dominance *cautiously* (e.g., only when it's payoff-equivalent on the equilibrium path, or within specific solution concepts like SPNE) be more powerful and just as defensible as your wholesale ban? Isn't the Nash program (via refinements like Trembling Hand) actually *better* at handling the strategic ambiguity weak dominance points to?  

  **Key Tactics During the Interview:**
  *   **Have the Matrix Ready:** Physically show the matrix for Q1. Make him point to it.
  *   **Precision Demand:** If he says "rationality implies...", ask "*Which* axiom of rationality, precisely?" or "Define 'rationality' operationally for this step."
  *   **"Modeling Choice" Trap:** If he retreats to "that's a modeling choice," counter: "But you claim IEDS is the *fundamental backbone*, not just *a* choice. If core aspects (weak dominance, epistemic assumptions) are discretionary, how is that foundational?"
  *   **Push the Epistemic:** Keep returning to "What do the players *know* and *believe* at each step?" This is IEDS's claimed strength but also its vulnerability.
  *   **Contrast with Nash:** Constantly ask: "How is this *better* or *more basic* than the Nash approach here?"

  These questions force him to defend the procedural details, epistemic assumptions, scope limitations, and predictive power of IEDS against its main rivals. Good luck with the interview!
