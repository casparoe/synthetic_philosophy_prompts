answer: |-
  Below is a decision tree designed to clarify your intuitions about the Knobe effect and guide you to a named philosophical position. It branches only on concrete cases or claims where major theories genuinely diverge. Answer each question based solely on your immediate, intuitive reaction to the described scenario—**don't overthink**; your gut response is key. Use British English phrasing.

  ---

  ### **Decision Tree: Unpacking the Knobe Effect**

  **Start Here:**  
  **Q1.** Consider a CEO who launches a new factory process solely to increase profits. They know this will *certainly* release toxins harming local wildlife, a side effect they consider "regrettable but unavoidable for progress." **If nobody could reasonably blame the CEO for this harm** (e.g., because regulations allow it, locals consented to the risk for jobs, or toxins were genuinely unavoidable with current tech), do you still feel strongly that the CEO harmed the wildlife *intentionally*?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  **Q2.** Now imagine a doctor who prescribes a legally restricted painkiller to relieve a patient’s agony. They know this will *certainly* ease depression as a side effect (a good outcome), but **it violates medical protocols** (e.g., prescribing without psychiatric oversight). Do you feel the doctor eased the depression *intentionally*?  
  - **Yes** → Your view aligns most closely with **Norm-Violation Primacy** (the asymmetry is driven by breaching norms, not badness itself).  
  - **No** → Your view aligns most closely with **Normative Folk Concept** (the folk concept of intentional action is inherently moralised; "intentional" marks blameworthy norm-breaking).  

  **Q3.** Imagine a CEO who launches a new factory process solely to increase profits. They know this will *certainly* restore a polluted river as a side effect (a good outcome), but **it violates an environmental covenant** (e.g., by altering water pH beyond agreed limits, even beneficially). Do you feel the CEO restored the river *intentionally*?  
  - **Yes** → Go to Q4.  
  - **No** → Go to Q5.  

  **Q4.** Consider an architect who designs a building with flammable materials to cut costs. They are **utterly unaware** that this will *certainly* accelerate the spread of a rare orchid (a good outcome) in the event of fire. If the orchid later thrives after a fire, do you feel the architect’s action *intentionally* helped the orchid?  
  - **Yes** → Your view is unusual and may align with **Unrestricted Causalism** (intent is purely about foresight/causation; the Knobe effect is an error). *[Note: Few hold this view; it struggles with the core asymmetry.]*  
  - **No** → Your view aligns most closely with **Norm-Violation Primacy** (the asymmetry is driven by breaching norms, not badness itself).  

  **Q5.** Reconsider the original "help" case: a CEO launches a process solely for profit, knowing it will *certainly* help the environment as a side effect. They call this help "a happy accident." Now suppose **the narrator explicitly states**: "The CEO did not intend to help the environment; it was merely foreseen." Does this statement feel redundant or unnecessary to you?  
  - **Yes** (redundant) → Go to Q6.  
  - **No** (necessary/clarifying) → Go to Q7.  

  **Q6.** Imagine a *corporation* (not an individual) approves a profitable policy knowing it will *certainly* harm a community as a side effect. All executives involved followed procedure and acted neutrally. Do you feel the corporation harmed the community *intentionally*?  
  - **Yes** → Your view aligns most closely with **Blame-First Epistemology** (ascriptions of "intent" are post-hoc rationalisations of blame judgments).  
  - **No** → Your view aligns most closely with **Normative Folk Concept** (the folk concept of intentional action is inherently moralised).  

  **Q7.** Consider a CEO who avoids investing in safety measures to boost profits. They know this makes a *minor* injury to a worker statistically certain, but they **truly believe injuries are "acts of God"** beyond human control. A worker is later hurt. Do you feel the CEO harmed the worker *intentionally*?  
  - **Yes** → Your view aligns most closely with **Debunking View** (the asymmetry is a bias—e.g., "blame validation" or "moral luck"—to be explained away, not a guide to the concept).  
  - **No** → Your view aligns most closely with **Conversational Implicature** (the folk concept is non-normative; calling bad effects "intentional" pragmatically implies blame, but isn’t part of the meaning).  

  ---

  ### **Key to Leaves**
  1. **Normative Folk Concept**: The folk concept of intentional action is inherently moral/normative. Calling harm "intentional" reflects its blameworthy character.  
  2. **Conversational Implicature**: The concept is non-normative. The asymmetry arises because calling bad side effects "intentional" conversationally implies disapproval, but this isn’t semantic.  
  3. **Blame-First Epistemology**: Blame judgments come first (driven by outcomes/norms); intent ascriptions are rationalisations of those judgments.  
  4. **Norm-Violation Primacy**: The asymmetry is driven by norm-violation (moral, prudential, conventional), not badness/goodness itself.  
  5. **Debunking View**: The asymmetry is a cognitive/affective bias distorting a neutral concept; it reveals psychology, not semantics.  

  ### **Notes on Ambiguity & Gaps**  
  - **Unseparated Leaves**: *Normative Folk Concept* and *Norm-Violation Primacy* may converge if you see norms as inherently moral. The tree distinguishes them via Q2 (testing "good but norm-violating" cases).  
  - **Unexplored Combinations**:  
    - *Affirming Q1 (Yes) but Q2 (No)* → Coherent and common (leads to Normative Folk Concept).  
    - *Affirming Q3 (No) but Q7 (Yes)* → Rare but coherent (Debunking View).  
  - **Incoherent Combinations**:  
    - *Affirming Q1 (No) but Q6 (Yes)* → Incoherent. Q1 (No) rejects intent without blame, but Q6 (Yes) assigns intent to corporate agents without individual blame, contradicting the blame-sensitivity implied by Q1 (No).  
  - **Unattractive/Unoccupied**:  
    - *Affirming Q1 (Yes) and Q4 (Yes)* → Leads to Unrestricted Causalism. Widely rejected as it ignores the core asymmetry.  

  This tree isolates critical pressure points: **blameless harm** (Q1), **good norm-violation** (Q2/Q3), **corporate agency** (Q6), and **epistemic limitations** (Q4/Q7). Follow your instincts—your characters’ "sliding" likely mirrors legitimate tensions in the underlying phenomena.
