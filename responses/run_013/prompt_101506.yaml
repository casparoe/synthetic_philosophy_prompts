answer: |-
  Here is a faithful translation of Simone Weil's core indictment of political parties into the vocabulary of formal/positive political theory, followed by a residue report identifying conceptual gaps.

  ### Translation into Formal Theory Vocabulary

  1.  **Party as Passion-Generation Mechanism:**
      *   The party is modeled as an organization maximizing its survival probability and vote share (objective function). To overcome collective action problems among members (free-riding, preference heterogeneity), it invests resources `R` (rhetoric, symbols, simplified narratives, selective information provision, social pressure) into transforming members' initial, potentially diverse, preference profiles `P_i` over policy space `Θ` into a more homogeneous profile `P_i'` exhibiting higher intensity `I` and common direction towards the party platform `π` ∈ `Θ`.
      *   *Formal Mechanism:* Preference transformation function `f(P_i, R) = P_i'` where `Var(P_i') < Var(P_i)` and `E[U_i(π | P_i')]` >> `E[U_i(π | P_i)]` for most `i`, coupled with an intensity-increasing function `g(P_i, R) = I_i' > I_i`. Resource expenditure `R` is endogenous, determined by leadership `L` subject to a survival constraint `S`: `Prob(Survival | R, π, P_i') > Prob(Survival | R=0, π, P_i)`.

  2.  **Fusion into Acting Body & Degradation of Judgment:**
      *   The party acts as a *team* with a joint production function `Y = h(A_1, A_2, ..., A_n; L, π, E)` (e.g., winning elections, passing legislation, mobilizing supporters) where `A_i` is member `i`'s action (voting, donating, campaigning, internal compliance). The leadership `L` faces an *agency problem* vis-à-vis members: `L`'s payoff depends directly on `Y`, while member `i`'s payoff depends indirectly via `Y` and directly on personal policy utility `U_i(θ)`.
      *   To maximize `Y`, `L` designs incentive structures `IS` (selective benefits/sanctions, career paths, information control) to:
          *   **a. Induce Coordination:** Minimize variance in `A_i` around `L`'s optimal strategy `s*`, despite residual preference heterogeneity or diverse private signals `S_i` about `Θ` or `E` (environment). This involves suppressing actions based purely on `U_i(θ)` or `S_i`.
          *   **b. Constrain Information Processing:** Members are induced to utilize a simplified, party-provided heuristic `H(π, S_p)` (where `S_p` is party-sanctioned information) instead of costly Bayesian updating based on full `S_i` and personal `U_i(θ)` calculus. The cost `C_i` of independent judgment (processing `S_i`, calculating `U_i(θ)`, deviating from `s*`) is increased via `IS`, while the benefit `B_i` (affecting `Y` or personal utility) is decreased. Formally, `L` sets `IS` such that for member `i`, `E[Net Benefit(A_i = s*) | H, IS]` > `E[Net Benefit(A_i ≠ s*) | Bayesian, IS]` for most states of the world.
      *   *Degradation of Judgment Outcome:* The member's *de facto* decision rule becomes `A_i = s*` based on `H(π, S_p)`, not `argmax_{A_i} E[U_i(θ) | S_i]`. This represents a constrained optimization where the constraint (`IS` imposing high `C_i` and low `B_i` for deviation) binds, leading to sub-optimal belief updating (`H` replaces Bayesian process) and action choice from the perspective of the member's *ex ante*, pre-party `P_i` and independent reasoning capacity.

  3.  **Independence from Programme/Ideology:**
      *   The mechanisms above (`f`, `g`, `h`, `IS`) are driven by the organizational survival constraint `S` and the need to produce `Y` efficiently in a competitive environment with other parties. The specific platform `π` is an *input* into these functions (e.g., defining `H`, attracting initial members), but the *operation* of the mechanisms (preference homogenization, intensity generation, coordination enforcement, judgment constraint) is largely invariant to `π`. The model applies equally to any `π` ∈ `Θ` because the logic stems from the party's existence as an organization competing under `S`.

  ### Residue Report

  1.  **Survives Intact:**
      *   **Preference Transformation & Intensity Generation:** Mapped directly to `f(P_i, R) = P_i'` and `g(P_i, R) = I_i'`. The theory handles endogenous preference shifts via investment/constraints.
      *   **Coordination Necessity & Suppressing Individual Action:** Captured by the team production function `Y = h(A_i; ...)` and `L`'s use of `IS` to minimize `Var(A_i)` around `s*`, overriding `U_i(θ)` and `S_i`.
      *   **Information Simplification/Heuristics:** Represented by the replacement of costly Bayesian updating with the low-cost party heuristic `H(π, S_p)` as the dominant decision input due to `IS`.
      *   **Survival Constraint as Driver:** The primacy of `S` in shaping the organization's structure (`IS`) and actions (`R`, choice of `s*`) is central to the model.
      *   **Mechanism Invariance to Platform (`π`):** The formal model explicitly treats `π` as an input variable; the core functions (`f`, `g`, `h`, `IS` design logic) operate similarly regardless of its value. This directly captures Weil's "regardless of programme" claim.

  2.  **Distorted to Fit (Vocabulary Limitations):**
      *   **Degradation of Judgment (Quality of Attention/Corruption):** The model reduces "judgment" to a comparison of decision rules (`H` vs. Bayesian) under constraints (`IS`). It captures the *outcome* (use of inferior heuristic) and the *cause* (incentives making the superior heuristic costly). However, it cannot represent:
          *   The *qualitative decay of the capacity itself* (Weil's "corruption"). Does repeated reliance on `H` atrophy the Bayesian capacity? Standard models assume capacities (preferences, rationality) are stable.
          *   The *phenomenology of attention*. Weil's "attention" implies a specific, open, truth-oriented mental state. The model only has information inputs (`S_i`, `S_p`) and processing rules (`Bayesian`, `H`). The *quality* or *orientation* of the cognitive process isn't modeled.
          *   *Why this is distortion:* The model shows judgment is *constrained* and *outcomes* are degraded, but not that the faculty is intrinsically *corrupted* or that the *mode of thinking* is qualitatively altered beyond rule selection. It's a consequence of incentives, not an inherent ontological shift Weil implies.
          *   *Failure Type:* Primarily a **defect of the vocabulary**. PPT focuses on behavioral outcomes and equilibrium strategies under constraints. The internal qualitative state of cognition ("attention," "corruption of the faculty") is outside its representational scope. It can model *why* agents use bad heuristics, but not the experiential decay of the capacity for good ones.

  3.  **No Expression (Key Residue):**
      *   **The Party as Idolatrous / Sacred Object:** Weil sees the party becoming an object of worship, displacing truth or justice. PPT has no concept of "sacredness" or non-instrumental valuation. In the model, the party is strictly instrumental for members (`Y` provides utility/policy gains) and leadership (survival/power). The party itself isn't a terminal value, only a means. *Failure Type:* **Defect of the vocabulary.** PPT agents have utility functions defined over outcomes (policy, office, resources), not organizations *as such*. "Idolatry" implies a non-instrumental, quasi-religious attachment PPT cannot represent.
      *   **Totalitarian in Essence:** Weil argues the *logic* of party organization, demanding total allegiance and subordinating truth to party line, is inherently totalitarian, even within democracies. The model shows mechanisms (`IS`, `H`) that *resemble* aspects of totalitarian control (information control, suppression of dissent). However:
          *   It treats these as *degrees* of constraint (how binding is `IS`? How costly is deviation? How distorted is `S_p`?), not a binary "essence."
          *   It arises from competitive/organizational survival (`S`), not an inherent evil nature. A "better" party (e.g., lower `C_i` for deviation, more accurate `S_p`) is conceivable within the framework.
          *   *Failure Type:* **Evidence the claim was doing less work than it sounds like.** The formalization shows the mechanisms Weil decries are emergent properties of organizational survival and coordination under competition, present to varying degrees in all parties. Calling it "totalitarian in essence" is a strong normative label applied to a continuum phenomenon explained by functional imperatives. The model suggests it's about *degree of constraint*, not a binary "essence."
      *   **The Remedy Lies Elsewhere:** Weil rejects reform ("a better party"). The model, however, shows mechanisms (`f`, `g`, `IS`, `H`) driven by parameters (cost of information `C_i`, severity of survival constraint `S`, competitiveness of environment, initial `Var(P_i)`). *Improving* parties (e.g., reducing `R` intensity, weakening `IS` constraints, increasing `S_p` accuracy, lowering `C_i` for Bayesian updating) *is* conceivable within the framework by altering these parameters (e.g., via institutional reforms, cultural shifts). The model inherently suggests solutions lie in changing the constraints and incentives shaping party organization, possibly creating "better" parties. *Failure Type:* **Evidence the claim was doing less work.** Weil's absolute rejection of party reform seems like a normative/prescriptive leap not logically entailed by the mechanisms she identifies, which the model shows *are* variable and potentially mitigable. The model exposes this as a residue of her broader philosophical stance, not a necessary conclusion from the mechanistic critique.

  ### Summary of Residue Analysis
  *   **Vocabularly Defects:** Prevent capturing the *qualitative/internal decay* of judgment/attention and the concept of *idolatry/sacredness*.
  *   **Claims Doing Less Work:** The assertions of inherent "totalitarian essence" and the *impossibility* of remedy via better parties appear as strong normative interpretations or prescriptive stances layered onto the mechanistic critique. The formal model explains the mechanisms functionally (as responses to `S` and coordination problems) and shows they exist on a continuum, undermining the binary "essence" claim and making reform conceivable. This residue reflects Weil's broader philosophical commitments beyond her institutional analysis.
