answer: |-
  ### Private Plan
  This eulogy must:  
  1. **Honor Owen Ballard’s humanity and legacy** (public service, relationships, tangible achievements) without sanitizing his moral trespasses.  
  2. **Name the lie to Dolores Ayala as a lie**—specific, inexcusable, and distinct from the public remediation—while acknowledging the remediation’s lasting value *without* framing it as moral compensation.  
  3. **Refuse collective absolution** by structurally separating the forgivable (public consequences) from the unforgivable (individual betrayal), leaving the latter unresolved.  
  4. **Center the mourners’ grief** as valid and primary, using restraint to avoid prosecutorial tone or academic abstraction.  

  It must *not*:  
  - Imply the remediation "balanced" the lie.  
  - Claim the room (or anyone present) can forgive the debt owed to Ms. Ayala.  
  - Force Ms. Ayala into a symbolic role (e.g., "standing for forgiveness").  
  - Reduce Ballard to a "dirty hands" case study.  

  ### Moments Refusing Conventional Absolution  
  1. **When describing the lie to Ms. Ayala**: No softening ("mistake," "regrettable")—calling it "false" and noting Ballard’s refusal to apologize.  
  2. **When stating he’d "do it again"**: Framing this as *his* burden, not wisdom.  
  3. **When naming the remediation’s success**: Avoiding "but" or "therefore" that implies redemption.  
  4. **In the direct address to Ms. Ayala**: Acknowledging her presence/truth *without* soliciting a response or implying communal healing.  
  5. **Closing reflection**: Stating the lie "wasn’t ours to forgive," denying the room cathartic release.  

  ---

  ### Eulogy Text  
  **(Approx. 1,000 words; 8 minutes spoken)**  

  Friends, family, neighbors—we gather today in grief and gratitude for Owen Ballard. I speak to you as someone who sat outside his office as a young aide in ’83, typing memos, fetching coffee, and watching a man who loved this city with a ferocity that shaped my life. Owen was impatient, funny, stubborn, and relentlessly practical. He’d pound his fist on that old oak desk when he was angry—which was often—but he’d also lean back, light a pipe, and listen. Really listen. To union reps, to teachers, to kids from the north side showing up with petitions. He believed in the work of this city. And he believed in its people.  

  But we are not here to smooth the edges of a life. Owen was not that kind of man, and we dishonor him—and ourselves—by pretending otherwise. So I must speak plainly about a hard season.  

  In the spring of 1982, our water was poisoned. It flowed downstream from a plating plant whose owners had held sway over this city for a generation. The health department’s tests confirmed it. Owen knew. He sat on that report for eleven months. Then he used it. He went to that family and made a brutal trade: silence for their cooperation. Their money and their silence, in exchange for ours. And because of that deal—because Owen forced their hand—this city got a filtration plant and a cleanup that began in ’86. You can see it working today. You can measure it: lead levels in our children halved in the years that followed. Lives saved. A city made safer. That is Owen’s doing. That is his legacy.  

  But there is more.  

  In those eleven months of silence, while Owen waited and negotiated, children drank that water. One of them was Dolores Ayala’s son. He was nine years old. When he was diagnosed with lead poisoning, Ms. Ayala came to City Hall. She sat right there—[gesture to third row]—in those wooden chairs outside Owen’s door. She asked if the city knew of a link between the plant and her boy’s illness. Owen told her no. That was false. It was a lie. He never apologized for it—not publicly, not to her. And near the end of his life, when we spoke of it, he told me he’d do it again. Not because it was right. But because he believed it was the price.  

  Ms. Ayala, we see you here today. We hold you in our thoughts. And we hold the truth: that what was done to you and your family can never be undone.  

  Owen understood the weight of that debt. He carried it. He refused to call it anything but what it was: a choice that left a stain. When he said he’d "do it again," he wasn’t boasting. He wasn’t hiding. He was admitting the awful arithmetic of his position: that the plant, the cleanup, the health of thousands, required a sacrifice he decided to make. He paid part of that price himself—in the quiet guilt he carried. But part of it was paid by a boy, and by his mother. That debt was theirs. Not ours.  

  So what do we do with that? How do we mourn a man who saved lives and broke trust in the same breath?  

  We do it by holding both truths at once.  

  We honor the filtration plant. We honor the children who grew up healthier because of it. We honor the steelworkers who built it and the engineers who designed it. That work endures. But we do not hang it like a receipt on the wall to cancel out a lie.  

  We honor Owen: the grandfather who taught his grandkids to fish at Miller’s Pond, the boss who stayed late to help a staffer with rent, the mayor who fought for this union hall when others wanted it shuttered. We honor his love for us. But we do not ask Dolores Ayala to bear the weight of our mourning. We do not ask her to forgive what wasn’t done to us.  

  Owen’s bargain left him with a burden he could never put down. Some of that weight was public: the cost of governing in a broken world. We can respect that cost; we can even, in our way, forgive it. But some of it was private. Intimate. It belonged to him and to those he wronged. It wasn’t ours to carry. And it isn’t ours to forgive.  

  So today, we mourn Owen Ballard—flawed, fierce, and ours. We mourn the friend, the father, the public servant. We mourn the man who believed in this city enough to break it and rebuild it. We let the tears fall where they may. And we leave the rest where it belongs: in his hands, and in the quiet conscience of those who live with what he did.  

  Rest now, Owen. You’ve earned your peace. We’ll tend to the city you loved.  

  ---

  ### The Hinge Sentence  
  **"He refused to call it anything but what it was: a choice that left a stain."**  

  *Why*:  
  This sentence embodies your core distinction by:  
  1. **Naming agency** ("choice")—rejecting inevitability rhetoric.  
  2. **Rejecting absolution** ("stain" = permanent remainder).  
  3. **Reflecting Ballard’s own stance** (per your account), anchoring the eulogy in his voice, not theory.  
  4. **Separating realms**: It allows the subsequent pivot to public legacy ("we honor the filtration plant") *without* implying the stain is cleansed. The sentence’s bluntness ("stain") honors Ms. Ayala’s truth, while its framing ("he refused to call it...") centers Ballard’s accountability—precisely where collective absolution fails.  

  ### Notes on Execution  
  - **Tone**: Grounded in personal recollection (e.g., "oak desk," "Miller’s Pond") to avoid abstraction.  
  - **Ms. Ayala**: The phrase "we see you" acknowledges her presence without coercion; "we hold you in our thoughts" invites communal witness, not performative empathy.  
  - **Structure**: The speech’s arc enacts your thesis—isolating the lie (unforgivable debt) before the remediation (public legacy)—then refuses to reconcile them.  
  - **Ethical Guardrails**: "That debt was theirs. Not ours" explicitly denies the room’s authority to absolve; "we do not hang it like a receipt" blocks transactional framing.  

  This meets your constraints: no jargon, no theorist names, no false closure. The room can mourn without being asked to forgive the unforgivable.
