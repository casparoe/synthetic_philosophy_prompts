prompt: |-
  I'm preparing the opening session of a graduate seminar on Nietzsche's essay on the uses and disadvantages of history for life, and rather than summarize the three ways it says we can relate to the past, I want to read a poem that enacts them. Write me one, roughly twenty-five to thirty-five lines, in four movements. The first three should each take up a single concrete episode from the past — choose it yourself, something small and specific enough to be seen rather than a period or a civilization — and handle it the way the essay says monumental, antiquarian, and critical history respectively handle the past: the first reaching for the exemplary and the great, the second revering and preserving what is near, inherited, and its own, the third judging, breaking up, and condemning. The same episode, or at least the same object or scene, should recur in all three, altered by the stance taken toward it, so that the reader watches one piece of the past handled three ways rather than three different pasts. Each movement should carry its mode's characteristic temptation as well as its promise: the flattening of the singular into the merely exemplary, the reverence that turns the past into something that can no longer be lived with, the judgment that forgets it is passing sentence from inside the very inheritance it condemns. The fourth movement should not resolve these but stage what the essay leaves open — that life may need the capacity to forget and to transform the past rather than only to remember, judge, or preserve it — and it should be honest that this too may be one more stance rather than an escape from stances. Someone who knows the essay should recognize each mode without its ever being named: do not use the words monumental, antiquarian, or critical, and do not title or label the movements; let the verse do the distinguishing. Give me only the poem, continuous verse from first line to last, with no headings, section titles, bold, bullets, or prose commentary — the way I would read it aloud to open the class.
reasoning: |-
  Okay, the user is preparing for a graduate seminar on Nietzsche's essay about history's uses and disadvantages. They want a poem that enacts the three historical modes—monumental, antiquarian, and critical—without naming them explicitly. The poem needs four movements: the first three each focusing on the same specific past episode, altered by each stance, showing both the promise and temptation of each mode. The final movement should explore the need to forget or transform the past, acknowledging it might just be another stance.

  I need to recall Nietzsche's concepts. Monumental history seeks greatness and inspiration but risks flattening uniqueness into mere examples. Antiquarian history preserves heritage but can make the past unlivable. Critical history judges and condemns but forgets its own roots. The poem must embody these through concrete imagery without labeling them.

  The user emphasized using one recurring object or scene across the first three movements. I should pick something small and specific—a single moment in time that's vivid and relatable. Thinking of a scene: maybe a broken statue in a garden? That could symbolize decay and history, allowing reinterpretations. The statue could represent a historical figure or event, giving flexibility for the three stances.

  For the first movement (monumental), I'll focus on the statue as a symbol of greatness, ignoring its flaws. Imagery should be heroic: sunlight on the face, framing it as timeless. But the temptation is flattening—making it just an example, so I'll include hints of wear erased by the narrative.

  Second movement (antiquarian): show reverence for the statue as part of heritage. Describe details like moss and cracks, emphasizing preservation. Temptation is making it unlivable—something that stifles the present, so I'll add elements like the garden becoming a shrine no one tends.

  Third movement (critical): condemn the statue as oppressive. Use harsh imagery—chains, shattered fragments. Temptation is forgetting inheritance, so I'll imply the speaker is part of the same history they reject, without stating it overtly.

  Fourth movement: Nietzsche suggests life needs forgetting and transformation. I'll show the statue being absorbed by nature—roots growing through it, suggesting time heals or transforms. But it must not resolve; it should be another stance, so I'll end with ambiguity: the statue is "gone," but the memory lingers, and the speaker is both free and bound.

  Structure-wise, the poem needs 25-35 lines in four unmarked sections. I'll aim for roughly 8 lines per movement. Language should be poetic: metaphors, sensory details. No headings—just continuous verse. For flow, I'll use enjambment and varied line lengths to distinguish movements subtly.

  User's deeper needs: They're an educator wanting to provoke discussion, not summarize. The poem must be insightful enough for grad students to analyze. It should mirror Nietzsche's tensions—how history serves life but can also burden it. By making the fourth movement unresolved, I'm inviting debate, which aligns with seminar goals.

  Finally, I'll ensure the recurring object (statue) evolves: whole in first, decaying in second, broken in third, transformed in fourth. This shows how perspectives alter the past. All temptations are woven in: flattening, suffocating reverence, hypocritical judgment. For the end, I'll avoid closure—life keeps moving, like roots growing, leaving the reader questioning.
