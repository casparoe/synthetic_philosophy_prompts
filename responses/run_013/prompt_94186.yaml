  **(The poem begins without title or section breaks)**

  One arm outstretched to the vanished crowd,
  The soldier-stone stood in the garden's green shroud.
  Sunlight struck the weathered face, igniting the brow,
  A gesture frozen in the eternal Now.
  Not the chipped ear, the moss-stained thigh,
  But the line of defiance against the sky!
  This *was* the moment courage held its breath,
  A bridge flung across the gulf of death.
  See! How the light demands we stand so tall,
  Forgetting the slow rain that makes statues fall.

  That soldier-stone, my grandfather knew,
  Rooted deep where the old lilacs grew.
  His hand traced the name, the regimental sign,
  Wiped clean the grime that wasn't mine, yet mine.
  This chip, this crack, this lichen's grey embrace,
  Is the very contour of my time and place.
  I guard the angle of the broken sword,
  The weight of silence is its own reward.
  To lose one grain would rend the binding thread,
  Leaving the living garden with the dead.
  The path grows narrow beneath the sacred boughs,
  Preserved too perfectly for present vows.

  That soldier-stone! A fist of cold command,
  Forged from the iron of a conquered land.
  That outstretched arm? A chain, not hope, designed,
  The rigid lie that shackles every mind.
  See the blind eyes that sanctioned ancient wrong?
  Shatter the plinth where such ghosts belong!
  Let ivy strangle the arrogant pose,
  Crush the cold marble under thorny rose.
  We judge, we break, we clear the poisoned ground,
  Where no such idol shall again be found!
  (Though unseen, the old stone bleeds into the bone,
  The axe we wield is carved from its own stone.)

  The rain returns. The moss asserts its claim.
  The shattered base dissolves without a name.
  Deep roots, indifferent, push through fractured pride,
  Seeking only the dark earth, deep and wide.
  The soldier's outline blurs, consumed by vine,
  A humus for the wilding columbine.
  Is this forgetting? Or a different art?
  The past unmade, yet pulsing in the heart?
  The clearing holds the echo and the bloom,
  Life breathing deep within the garden’s room.
  The stone is gone. The weight remains. And yet,
  Something green unfolds where sun and shadow met.
