answer: |-
  ### Bottom Line
  **Permit arrangements only where no party faces unmitigated positional vulnerability that risks irreversible harm to body or fundamental rights, regardless of legal permissibility or financial motivation.**

  ### Core Reasoning & Load-Bearing Distinctions  
  1. **Commodification ≠ Compensation**:  
     - **Operational Rule**: Compensation is permissible if it doesn’t subordinate bodily integrity to market logic (Radin). *Test: Does payment alter the *nature* of consent (e.g., "I must do this" vs. "I choose to")?*  
     - **Load-Bearing**: Distinguish *inducement* (overpowering autonomy via desperation) from *compensation* (fair value for labor/risk).  

  2. **Exploitation**:  
     - **Operational Rule**: Exploitation occurs if:  
       a) **Vulnerability**: One party lacks reasonable alternatives (e.g., debt, legal status).  
       b) **Benefit Disparity**: The advantaged party gains disproportionately (Wertheimer).  
     - **Load-Bearing**: Poverty isn’t disqualifying; *irremediable power imbalance* is.  

  3. **Consent & Reversibility**:  
     - **Operational Rule**: Gamete donation (reversible pre-conception) ≠ gestation (irreversible bodily commitment).  
     - **Load-Bearing**: Surrogacy requires stricter consent safeguards; enforceability (e.g., contracts) is secondary to *ongoing bodily autonomy*.  

  4. **Cross-Border Dynamics**:  
     - **Operational Rule**: "Reproductive tourism" is distinct if it:  
       a) Circumvents protections existing in the home country, *and*  
       b) Creates legal/relational harms (e.g., non-recognition of parentage).  
     - **Load-Bearing**: Foreign laws matter only if their *purpose* is protective (not punitive).  

  5. **Relationships**:  
     - **Operational Rule**: Familial/friendly arrangements heighten risk of *implicit coercion*, requiring *independent advocacy*.  

  ---

  ### Procedure: Sequence of Questions  
  **Ask in order. Stop at first "No" or "Unresolved Risk."**  

  1. **IRREVERSIBLE HARM RISK (Gatekeeper Question)**  
     *"Could this arrangement force a person to endure unwanted, irreversible bodily harm (e.g., forced pregnancy continuation)?"*  
     - **Sufficient "Yes"**: Carrier lacks legal right to abort/relinquish *or* intended parents can legally compel gestation.  
     - **Stop if No**: **REJECT**. Proceed if resolved.  
     - *Judgment Call*: Assessing foreign parentage laws’ enforceability.  

  2. **POSITIONAL VULNERABILITY**  
     *"Does any party have no reasonable alternative to this arrangement due to financial/legal/personal constraints?"*  
     - **Sufficient "No"**: Party has meaningful options (e.g., other income, stable status).  
     - **Stop if Yes**: **REJECT** unless mitigated (e.g., independent legal counsel, capped compensation).  
     - *Judgment Call*: Defining "reasonable alternative" (e.g., student debt ≠ famine).  

  3. **BENEFIT DISPARITY**  
     *"Could the compensation structure create unjust enrichment for one party or the clinic?"*  
     - **Sufficient "No"**: Compensation aligns with local standards (e.g., ASRM egg donor guidelines).  
     - **Stop if Yes**: **REJECT** (e.g., payment exceeds 200% of typical rate, or sister’s "gift" is 3x market surrogacy fee).  
     - *Judgment Call*: Market rate deviations in familial cases.  

  4. **CROSS-BORDER PROTECTION CIRCUMVENTION**  
     *"Does this arrangement exploit legal differences to deny protections available in the intended parents’ home country?"*  
     - **Sufficient "No"**: Home country bans are punitive (e.g., criminalizing gay parents) vs. protective (e.g., banning payments to prevent exploitation).  
     - **Stop if Yes**: **REJECT** (e.g., home country voids surrogacy contracts to protect carriers).  
     - *Judgment Call*: Interpreting foreign laws’ intent.  

  5. **RELATIONAL COERCION CHECK**  
     *"Could familial/social dynamics undermine voluntary consent?"*  
     - **Sufficient "No"**: Independent psychological screening + legal counsel for all parties confirms autonomy.  
     - **Stop if Yes**: **REJECT** (e.g., sister expresses hesitation privately to coordinator).  
     - *Judgment Call*: Evaluating subtle pressure in kin relationships.  

  ---

  ### Test Cases  
  1. **Intended Father from Criminalizing Country**:  
     - Q1: Risk if home country jails parents/carriers? If yes, **REJECT**.  
     - Q4: If ban protects carriers (e.g., Iran), **REJECT**. If ban targets LGBT+ (e.g., China), proceed.  
     - *Likely Outcome*: **Reject** if protective law exists. (*Contradicts personal preference if assuming autonomy priority.*)  

  2. **Repeat Egg Donor with Student Debt**:  
     - Q2: Does debt eliminate alternatives? If she has a job/other options, proceed.  
     - Q3: Payment within ASRM guidelines? If yes, **PERMIT**.  
     - *Outcome*: **Permit** (poverty ≠ automatic exploitation).  

  3. **Sister Gestational Carrier with "Gift"**:  
     - Q5: Screen for coercion. If sister hesitates, **REJECT**.  
     - Q3: "Gift" equivalent to fee? If 20% above market, **PERMIT**; if 300% above, **REJECT** (disguised inducement).  
     - *Outcome*: **Reject** if payment is excessive or pressure found.  

  ---

  ### What the Procedure Cannot Do  
  1. **Misclassifies**:  
     - Structural injustices (e.g., systemic poverty) as "individual choice."  
     - Cultural coercion (e.g., familial duty) as voluntary.  
  2. **Unobtainable Inputs**:  
     - Verifiable intent of foreign laws.  
     - True psychological state of parties ("Is she *really* okay?").  
  3. **Judgment Points**:  
     - Q1 (irreversible harm): You decide if foreign laws create bodily risk.  
     - Q4 (cross-border): You interpret if a ban is "protective."  
     - **Past this, you are not applying rules—you are making value calls about autonomy vs. protection.**  

  **Final Call**: When rules conflict (e.g., autonomy vs. exploitation risk), prioritize *preventing irreversible bodily harm*. Your role is to bind ambiguity to clinic values—state them explicitly when overriding the procedure.
