prompt: |-
  I'm in a reading group that has spent the last several weeks on evolutionary psychology, and we keep deadlocking the same way: someone proposes an adaptationist explanation for some feature of human psychology — a cheater-detection faculty, a disgust response tuned to pathogens, a taste for gossip — and someone else answers, "that's just a just-so story," and the conversation stops there. I don't think either move is doing real work, and I suspect the reason is that we never agreed on what an adaptationist hypothesis would actually have to deliver before we're entitled to take it seriously. Before we read anything else, I want the specification itself.

  So write me the desiderata: what must a hypothesis in evolutionary psychology be able to do, or show, in order to count as a genuine explanation rather than a story told after the fact? Lay out the requirements — the phenomena it has to account for, the evidence it has to marshal, the distinctions it cannot collapse — with the consideration behind each. I'm thinking of things like these, though I don't want to restrict you to my list: whether it must demonstrate a history of selection, and how anyone could do that when the ancestral environment is unobservable; whether cross-species comparison is mandatory or merely nice to have; whether the trait has to be shown to be a specific adaptation rather than an exaptation or a byproduct of something else; what role, if any, evidence of functional design or optimality has to play; how the hypothesis must handle the obvious rival explanations — learning, culture, and general-purpose cognition; what makes it genuinely testable rather than merely compatible with the data; and whether it must specify the trait at the computational level or may stay at the level of behavior, and at what grain the trait is to be individuated in the first place.

  For each requirement, say whether it is genuinely non-negotiable or merely a preference of one camp — the sociobiologists, the evolutionary psychologists proper, the human behavioral ecologists, the cultural-evolution people — and flag any subset you think cannot be jointly satisfied, because that is the part I most want: I suspect at least one pair is in tension, and that the deadlock in my group comes from each side demanding a requirement the other side cannot possibly meet. Then tell me which single requirement does the most work — which one, if enforced, would eliminate the largest number of hypotheses people actually advance. Skip the scorecard of particular theories; I'll do that with the group. And don't send me a reading list — I want the criteria, argued, not a bibliography.
reasoning: |-
  Okay, the user is part of a reading group stuck in debates about evolutionary psychology explanations. They keep hitting a wall when someone dismisses an adaptationist hypothesis as a "just-so story." The user wants clear criteria for what makes such a hypothesis valid, not just examples or readings. They listed specific concerns: proving selection history, cross-species comparisons, distinguishing adaptations from exaptations, handling rival explanations, testability, and levels of analysis. 

  Hmm, the user is clearly frustrated with the deadlock. They suspect the root is conflicting requirements that can't all be met. They want the criteria laid out with rationale, tensions between them highlighted, and the most impactful requirement identified. 

  First, I need to define non-negotiable vs. negotiable requirements. The core issue is testability—without it, any story can be spun. Then there's the necessity of an alternative hypothesis comparison. You can't just say "this is adaptive"; you have to show it's better than non-adaptive explanations like culture or learning. 

  But here's the tension: proving selection history is ideal but often impossible for human traits. We can't observe the ancestral environment directly. So functional design evidence becomes key—like specificity or efficiency. Yet that clashes with the "byproduct" objection. For example, a cheater-detection module might just be general reasoning applied socially. 

  Cross-species comparisons help but aren't mandatory. Humans are unique in many ways, so it's supplemental. Grain of specification matters too. If a trait is defined too broadly (e.g., "cooperation"), it's hard to pin as an adaptation; too narrowly, it might miss the bigger picture. 

  The biggest tension is between demonstrating selection history and relying on functional design. Purists want genetic evidence, but that's scarce for psychological traits. Pragmatists accept design evidence, which opens doors to criticism. This is likely why the group deadlocks—one side demands proof of selection, the other settles for design. 

  The single most effective requirement? Comparative predictive power. If a hypothesis can uniquely predict findings that rival theories can't, it's strong. For example, predicting domain-specific cognitive biases (like Wason test results) that general logic can't explain. This eliminates many just-so stories because they're often retrofitted to existing data. 

  I should also note irreducible functionality—showing a trait's complexity requires adaptive design. But that's tricky for psychology. And the "byproduct" counter always looms. 

  In the end, the user needs to see that no hypothesis checks every box perfectly. The key is cumulative evidence across multiple criteria. Highlighting the tension between selection history and functional design might resolve their deadlock by showing why both sides feel unsatisfied. The predictive power requirement could move discussions forward.
answer: |-
  Here’s a rigorous specification of desiderata for evaluating adaptationist hypotheses in evolutionary psychology, structured to resolve deadlocks by clarifying non-negotiables, tensions, and priorities. Requirements are ranked by importance, with epistemic justifications and field-specific disagreements noted.

  ---

  ### **Non-Negotiable Core Requirements**  
  *(Must be addressed to avoid "just-so" status)*

  1. **Comparative Predictive Power**  
     - **What it demands**: The hypothesis must generate *novel, testable predictions* distinct from rival explanations (e.g., learning, culture, general cognition).  
     - **Why non-negotiable**: Without falsifiable predictions, the hypothesis is unfalsifiable storytelling.  
     - **Tension**: Conflicts with hypotheses that only "explain" known phenomena post hoc.  
     - **Key distinction**: Predictions ≠ retrodictions.  
     - *Camp divide*: Universally demanded by scientists; neglected by poor practitioners.

  2. **Specification of Adaptive Function**  
     - **What it demands**: Clear definition of:  
       - (a) The *adaptive problem* in the ancestral environment (e.g., "detecting free-riders in cooperative exchanges"),  
       - (b) The *design features* solving it (e.g., "a cognitive algorithm sensitive to cost-benefit violations in social contracts").  
     - **Why non-negotiable**: Vague traits (e.g., "gossip is adaptive") invite circularity.  
     - **Tension**: Requires grain-specificity (e.g., "cheater-detection" vs. "generalized reasoning"). Too coarse → untestable; too fine → overfitted.  
     - *Camp divide*: Evolutionary psychologists (EP) insist; behavioral ecologists sometimes accept broader functional definitions.

  3. **Evidence of Functional Design**  
     - **What it demands**: Data showing the trait is *efficient, specialized, or reliably developing* for its proposed function.  
     - **Evidence types**:  
       - Domain-specificity (e.g., disgust responds to pathogens, not moral violations alone),  
       - Efficiency (e.g., cheater-detection outperforms general logic in social contexts),  
       - Ontogenetic robustness (e.g., disgust emerges predictably across cultures).  
     - **Why non-negotiable**: Rules out traits as byproducts (e.g., "reading is a byproduct of object recognition").  
     - **Tension**: Distinguishing adaptation from exaptation requires historical data (often lacking).  

  ---

  ### **Highly Recommended (But Context-Dependent) Requirements**
  4. **Phylogenetic or Cross-Cultural Consistency**  
     - **What it demands**: Trait/function should appear in phylogenetically related species or diverse human cultures.  
     - **Why recommended**: Counters "cultural invention" or taxon-specific quirks.  
     - **Limitations**: Not all adaptations are universal (e.g., dietary adaptations vary by ancestral ecology).  
     - *Camp divide*: Behavioral ecologists prioritize; EP views as supplemental.

  5. **Comparison to Rival Hypotheses**  
     - **What it demands**: Explicitly testing against alternatives:  
       - General cognition (e.g., "Is cheater-detection just logical reasoning?"),  
       - Cultural transmission (e.g., "Is gossip learned or innate?"),  
       - Developmental plasticity (e.g., "Is disgust calibrated by experience?").  
     - **Why recommended**: Forces engagement with parsimony and null models.  
     - **Tension**: Requires defining rival mechanisms precisely — often underspecified.

  ---

  ### **Negotiable or Contested Requirements**  
  *(Subject to camp priorities and feasibility)*

  6. **Demonstration of Selection History**  
     - **What it demands**: Genetic or paleoanthropological evidence of past selection.  
     - **Why contested**:  
       - *Pro*: Gold standard for adaptation (e.g., lactase persistence).  
       - *Con*: Often impossible for cognitive traits (no fossil minds; complex genetics).  
     - *Camp divide*:  
       - EP: Functional design suffices without selection history.  
       - Skeptics: Demand genetic evidence (rarely achievable).  
     - **Tension**: Directly clashes with **Requirement #3** when historical data is absent.

  7. **Optimality or Efficiency Metrics**  
     - **What it demands**: Showing the trait optimizes fitness (e.g., energy efficiency, error minimization).  
     - **Why contested**: Many traits are "good enough," not optimal; metrics are often arbitrary.  
     - *Camp divide*: Behavioral ecologists favor; EP avoids strict optimality.

  ---

  ### **The Critical Tension: Why Your Group Deadlocks**  
  **The unresolvable conflict lies between:**  
  - **Requirement #3 (Functional Design)** and **Requirement #6 (Selection History)**.  
    - *Functional design* advocates (EP) argue: Design evidence is primary; selection history is ideal but often inferential.  
    - *Selection history* advocates (skeptics/geneticists) argue: Without direct evidence of selection, design arguments are circular.  
  **Result**: EP claims meet #3 but rarely #6 → skeptics cry "just-so story." Skeptics demand #6 → EP retorts "impossible standard."  

  ---

  ### **The Highest-Leverage Requirement**  
  **Comparative Predictive Power (#1) does the most work.**  
  - **Why**: Eliminates >90% of weak hypotheses.  
  - **Example**:  
    - *Weak*: "Gossip evolved to build alliances." (Predicts nothing new.)  
    - *Strong*: "Gossip mechanisms will preferentially track information about high-status individuals and potential defectors." (Predicts memory biases, attention patterns, etc. — testable against general "social interest" hypotheses.)  

  ---

  ### **Summary: The Adaptationist Litmus Test**  
  A hypothesis is **non-"just-so"** if it:  
  1. **Predicts novel phenomena** not explained by rivals (#1),  
  2. **Specifies an adaptive function** with testable design criteria (#2),  
  3. **Shows evidence of functional design** (#3).  
  *(#4–#7 strengthen but are not essential.)*  

  **Deadlock resolution**: If a hypothesis fails #1–#3, it’s a story. If it passes #1–#3 but lacks #6, it’s *provisionally valid* — historical evidence is desirable but not obligatory. The burden shifts to skeptics to propose a better explanation.  

  This framework forces hypotheses to be testable engines of discovery, not post hoc narratives. Use it to dissect claims in your group — the weakest will collapse immediately.
