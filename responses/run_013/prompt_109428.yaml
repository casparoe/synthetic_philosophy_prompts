prompt: |-
  ok so our debate club's motion for next month is "neuroscience has killed free will" and everyone keeps bringing up Libet, the guy with the EEG where your brain apparently gets going before you even feel like you decided to move your wrist. i've read the wikipedia page like five times and i can retell the experiment fine but i have no idea how to judge it, so before i write my speech i want the actual spec: what does a theory about the readiness potential and free will have to get right to count as a decent theory at all? not the theories themselves, the checklist theyre all being graded against.

  some things i want on the checklist, and tell me if they belong or if im confused: does it have to explain the veto trials, where people supposedly cancel at the last second? does it have to say what "you" means when it says your brain decided before you did (whos the you in "you didnt do it")? is it about whether you could have done otherwise, or only about whether you consciously knew? does it have to survive the fact that subjects were told to move at a random moment, which is nothing like actually deliberating about something that matters? someone in my class said they read the brain signal also builds up on trials where the person ends up not moving at all and might just be noise that sometimes tips over, so if thats true the theory has to have something to say about it. and does it have to work for the case where someones hand moves because a surgeon zapped their brain and they go "that wasnt me"?

  give it to me as a table, columns: requirement | the case or finding it comes from | why its a requirement | non-negotiable, or just something one camp wants | which popular take it hurts most. like 8-12 rows. if any two of the requirements can't both be met at once, say which pair and why. and finish with one line on which single requirement does the most damage to the lazy versions of the argument. no citations please, we're not allowed internet in the debate room anyway.
reasoning: |-
  Okay, the user is in a debate club and needs to structure their argument around the Libet experiment and its implications on free will. They want a checklist to evaluate theories, not the theories themselves. Let me start by understanding their main concerns.

  First, they mentioned several points: explaining veto trials, defining the "you" in the decision-making process, whether the theory addresses the ability to do otherwise vs. conscious awareness, the artificial setup of the experiment, the readiness potential as noise, and cases like direct brain stimulation. They also want this in a table format with specific columns.

  I need to create a comprehensive checklist. The user's deeper needs might include clarity on which arguments hold up under scrutiny and which popular takes are weakened by specific requirements. They probably want to avoid getting bogged down in complex neuroscience and focus on debate-winning points.

  Starting with the requirements. The veto power is crucial because Libet himself introduced it to counter fatalism. So any theory must address how conscious vetoing fits. Then, the definition of "you" – separating brain processes from conscious self is essential for the free will debate. The "could have done otherwise" point ties into philosophical principles like the Principle of Alternate Possibilities. 

  The artificial task critique is valid because Libet's setup doesn't mimic real decisions. Theories that generalize from this might be weak. The readiness potential as noise is a newer finding, so explaining its correlation without causation is important. Brain stimulation cases challenge theories to distinguish voluntary from involuntary acts.

  I should also consider other requirements. The readiness potential's timing relative to conscious intention is core to Libet's argument, so any theory must reconcile that. The role of consciousness—whether it initiates or modulates actions—is key. Predictability from brain data would strengthen determinism arguments. Subjective experience matters because people feel they decide, which theories can't ignore. The scope of decisions is another point; Libet's simple movements vs. complex moral choices.

  Now, checking for conflicts. For example, if a theory explains veto power as conscious, it might conflict with RP timing suggesting unconscious initiation. Also, the "could have done otherwise" conflicts with predictability in deterministic views. Highlighting these shows the user where theories might struggle.

  The most damaging requirement? Probably the artificial task critique because it undermines generalizing Libet's findings to real free will scenarios. Many lazy arguments rely on Libet as proof against all free will, but the task's simplicity breaks that.

  I need to ensure each requirement in the table has a clear case/finding, why it's required, negotiability, and which popular take it hurts. Balancing between necessary and desirable points. Non-negotiables like defining "you" and timing are foundational, while others like predictability might be context-dependent.

  Finally, summarizing the conflicts and the key damaging point will help the user focus their debate strategy. They need to challenge opponents by pointing out which requirements their arguments fail to meet.
answer: |-
  Here's your neuroscience-free-will theory evaluation checklist, designed for debate utility. Focus on the structural requirements any theory must address to be taken seriously:

  | Requirement                      | Case/Finding Origin               | Why It's a Requirement                                                                 | Non-Negotiable? | Hurts Most:                     |
  | :------------------------------ | :-------------------------------- | :------------------------------------------------------------------------------------- | :-------------- | :------------------------------ |
  | **1. Define "You" & Agency**    | Core philosophical conflict       | Must clarify what constitutes the "agent" (conscious self? Whole brain? Subsystems?) to even debate "who decided". | **Non-Negotiable** | **All lazy takes** (Pro & Con) - Vagueness undermines entire claim. |
  | **2. RP Timing vs. W-Judgment** | Libet's core EEG finding          | Any theory *must* explain why brain activity (RP) precedes the *reported* conscious intention (W) by ~300-500ms. | **Non-Negotiable** | Pro-Free-Will arguments denying RP's significance. |
  | **3. Account for "Veto Power"** | Libet's follow-up "veto" trials   | Must explain how subjects report cancelling movement *after* RP starts but *before* action. Challenges pure determinism. | **Non-Negotiable** | "Free Will is Dead" (Hard Determinism) - Suggests late conscious control. |
  | **4. Distinguish Initiation vs. Modulation** | Brain stimulation (Penfield, etc.) | Must differentiate between *starting* an action (Libet) and *stopping/modifying* one (veto, stimulation). "You" might not start it, but do you control it? | **Non-Negotiable** | Oversimplified "Brain did it = Not You". |
  | **5. Address Task Artificiality** | Criticism of Libet's design       | Must acknowledge if findings generalize from spontaneous, meaningless wrist flicks to complex, deliberated, consequential decisions. | Highly Desirable | "Libet Killed All Free Will" - Weakens extrapolation. |
  | **6. Explain RP in Non-Action Trials** | Later EEG studies (e.g., Schurger 2012) | RP-like activity occurs even when no action follows. Must explain if RP is truly *causal* for action or just background noise/readiness that *sometimes* leads to action. | **Non-Negotiable** | "RP = Decision Signal" (Simple Determinism) - Undercuts direct causation claim. |
  | **7. Define Role of Consciousness** | Central philosophical question | Must specify what consciousness *does*: Initiator? Motivator? Justifier? Rubber-stamper? Bystander? Impacts "free will" meaning. | **Non-Negotiable** | Theories claiming consciousness is *only* epiphenomenal (does nothing). |
  | **8. Engage "Could Have Done Otherwise" (PAP)** | Principle of Alternate Possibilities | Does the theory preserve *any* capacity for genuine choice between alternatives under identical conditions? Core to many free will definitions. | Highly Desirable (Philosophically Core) | Compatibilism & Hard Determinism (denies PAP). |
  | **9. Incorporate Subjective Experience** | Universal feeling of agency       | Must address why we *feel* like we consciously decide, even if mechanisms are unconscious. Can't ignore the phenomenology. | Highly Desirable | Illusionist theories (denies any real role for consciousness). |
  | **10. Scope of Applicability**  | Libet vs. complex decisions       | Must clarify what *types* of decisions/actions the theory applies to (only spontaneous motor? deliberative? moral?). | Desirable       | Overgeneralization from Libet to *all* free will. |

  **Key Conflicts:**
  1.  **#7 (Role of Consciousness) vs. #3 (Veto Power):** If consciousness *only* rubber-stamps or is epiphenomenal (#7), how can it *veto* an initiated action (#3)? Theories must resolve this tension (e.g., consciousness as a control/modulation system, not initiator).
  2.  **#8 (Could Have Done Otherwise) vs. Predictability:** If neural data could *in principle* predict the action before W (#2), PAP (#8) seems violated. Compatibilists redefine "could have," determinists deny PAP, libertarians need indeterminism.

  **The "Lazy Argument Killer": Requirement #5 (Task Artificiality).** Most lazy "Libet killed free will" arguments crumble when forced to explain how a lab trick (mindlessly flicking a wrist when you feel like it) proves you lack free will when choosing a career or resisting temptation. It highlights the massive leap required for the motion's claim.

  **Use this in debate:** Don't just recite Libet. Challenge *any* theory presented (yours or opponents') against this checklist. Ask: "How does *your* explanation handle the Veto (#3)?" or "Does your definition of 'free will' require 'Could Have Done Otherwise' (#8), and if so, how is that possible given the RP timing (#2)?" Focus on whether the theory meets the structural requirements to be coherent. Good luck!
