prompt: |-
  For my advanced ethics seminar I am writing a paper on the difference between a moral preference and a moral bias, and before I defend any particular account of the distinction I want to be clear about what such an account would have to accomplish. Would you write me the desiderata — the specification that any adequate theory of the preference/bias distinction must meet?

  I would like each requirement stated, followed by the case or consideration that motivates it, so that I can see why it is a requirement rather than an assumption. The cases I keep returning to are these: a classmate who was raised in a household where a certain practice was ordinary and who now finds it morally unobjectionable but cannot give a reason for that attitude; a person who feels visceral disgust at a harmless practice and reports the disgust as a moral verdict; a student who sincerely believes that grading should weight whatever he happens to be good at; someone who, having been denied a range of options all her life, reports that she prefers the narrow life she has; two communities each of which regards the other's settled moral outlook as a distortion; and someone who sincerely disavows a bias while his behavior keeps betraying it. I would also like the account to say something about the asymmetry I notice in myself — that I am quick to call other people's views biased and slow to call my own — and about what happens when the criterion I use to call your judgment biased, applied honestly to mine, calls mine biased too.

  The requirements I have already guessed at, which you should feel free to correct, add to, or reject, are: that the account not define bias by the content of the judgment, since the content is precisely what I am trying to explain; that it allow bias to be present without the agent's awareness and even against his explicit endorsement; that it still leave room for legitimate moral diversity, so that not every preference becomes a bias; that it not reduce to majority opinion or to whatever a fully informed impartial observer would say without independent argument for why that observer settles the matter; that it distinguish, or explain why it cannot distinguish, bias in a moral judgment from error about non-moral facts; that it handle the case of preferences shaped by unjust or restricted circumstances; and that it be usable, at least sometimes, by an ordinary person applying it to her own case.

  Two things matter to me most. First, tell me which of the requirements are genuinely constitutive of an adequate account and which are merely commitments of one camp, and flag any subset that cannot be jointly satisfied — if the list is internally inconsistent, that is itself the most interesting result, and I would rather find it now than halfway through the paper. Second, tell me which single requirement does the most to exclude otherwise popular accounts.

  Finally, score the broad families I have encountered against the list: the view that treats bias as a defect in the psychological process that produced the judgment, the view that treats it as divergence from an ideal or corrected standpoint, and the deflationary view that the preference/bias line is itself only a rhetorical weapon one side uses against the other. Keep this part brief; the criteria are what I actually need. I am not asking for readings or citations — I want the specification itself, worked out on its own terms.
reasoning: |-
  Okay, the user is working on an advanced ethics paper about distinguishing moral preferences from moral biases. They need a clear set of desiderata for any adequate theory of this distinction. Let me start by understanding their core concerns.

  First, they provided several cases to ground the requirements. These include someone raised with a practice finding it unobjectionable without reasons, visceral disgust being mistaken as moral judgment, self-serving grading preferences, adaptive preferences from restricted options, conflicting community moral outlooks, and unconscious bias. They also want the theory to address the asymmetry in labeling others' views as biased versus one's own, and the potential self-application of bias criteria.

  The user already has some guessed requirements: no content-based definition, bias without awareness, allowance for moral diversity, not relying on majority/impartial observer, distinguishing moral bias from factual error, handling preferences from unjust circumstances, and usability for self-assessment. I need to evaluate these and add any missing ones.

  Breaking it down: The distinction between bias and preference can't rely on content because that's circular. Cases like the classmate's upbringing show that origins matter, not just the judgment itself. Bias must be possible without awareness, as in the person whose behavior betrays bias despite denial. Moral diversity is crucial; not all differences are biases. The two communities case highlights this. Avoiding reliance on majority or impartial observer prevents collapsing into subjectivism. The self-serving student example shows biased processes even if impartial observers agree. Distinguishing moral bias from factual error is key because sometimes moral judgments involve factual mistakes. The visceral disgust case might be a factual error about harm. Adaptive preferences from restricted options need attention, like the person preferring a narrow life. Usability for self-assessment addresses the asymmetry issue where we're quicker to see others' biases than our own.

  Additional requirements might include self-application, where the criteria must work reflexively. The asymmetry point suggests that a good theory should explain why we recognize bias in others more easily. Also, the theory should handle cases where applying the criteria to oneself reveals personal bias, leading to potential self-condemnation.

  Now, internal consistency: Allowing moral diversity while accounting for biased processes might conflict. For example, the upbringing case could be either a legitimate preference or a bias. But the theory can resolve this by focusing on the process rather than the outcome. Reflexivity is critical—applying the same standard to oneself. If a theory labels others' views as biased but exempts one's own, it's inconsistent. The self-application requirement ensures that the criteria are universally applicable.

  The most exclusionary requirement is likely reflexivity. Many popular theories, like ideal observer or procedural approaches, might not pass self-application. For example, an ideal observer theory might consider the user's own views biased when applied reflexively, which could be problematic if not handled correctly.

  Now, evaluating the three broad families: Procedural theories focus on psychological processes. They handle unaware bias and adaptive preferences well but might struggle with moral diversity if they don't differentiate processes that are universally flawed versus culturally specific. Reflexivity could be an issue if the procedural flaws aren't equally detectable in oneself.

  Ideal standpoint theories use a corrected perspective. They can explain why some preferences are biased (like the self-serving student) but risk moral imperialism if not careful. They might conflict with the no-majority/impartial-observer requirement. Reflexivity here could lead to self-condemnation if the ideal standpoint contradicts one's views.

  Deflationary views see the distinction as rhetorical. They handle the community conflict case but fail most requirements since they don't allow for genuine bias, only persuasion. They can't account for unaware bias or adaptive preferences, as they reduce everything to power dynamics.

  The user's deepest needs: They want a theory that's robust, avoids circularity, and accounts for real-world cases. They need clarity on possible internal inconsistencies to structure their paper. Highlighting reflexivity and self-application addresses their personal observation about asymmetry in recognizing bias. Ensuring the theory can be self-applied without contradiction is crucial for their argument.
answer: |-
  Here is a specification of desiderata for an adequate theory of the moral preference/bias distinction, derived from your cases and concerns. Each requirement is stated, followed by the motivating case(s) and rationale, explaining why it constitutes a necessary condition rather than a mere assumption. Requirements you identified are integrated, refined, or expanded.

  ### Core Desiderata (Constitutive Requirements)
  1.  **Content Neutrality:** The account must not define bias primarily by the *content* of the moral judgment itself.
      *   **Motivation:** The core problem is explaining *why* specific content (e.g., finding a practice unobjectionable, feeling visceral disgust) arises as a preference or bias. Defining bias by content would be circular ("this view is biased because it's wrong") and fails to explain the difference between, say, the classmate's unobjectionable attitude (preference?) and the visceral disgust verdict (bias?).
  2.  **Opacity to the Agent:** The account must allow for bias to be present without the agent's conscious awareness and even persist despite the agent's sincere disavowal.
      *   **Motivation:** The person whose behavior consistently betrays a bias they explicitly disavow demonstrates that bias can operate subconsciously or be rationalized away. A theory requiring conscious awareness would fail to capture this pervasive phenomenon.
  3.  **Compatibility with Legitimate Moral Diversity:** The account must leave conceptual space for genuine, non-biased moral preferences that differ across individuals or cultures.
      *   **Motivation:** The case of two communities each viewing the other's settled outlook as a distortion necessitates that an account *can* explain how differing moral frameworks can both be non-biased preferences, rather than automatically labeling divergence as bias. Not every preference stemming from upbringing (like the classmate's) is necessarily a bias.
  4.  **Non-Reduction to External Benchmarks (Majority/Ideal Observer):** The account cannot *simply* define bias as deviation from majority opinion or the verdict of a hypothetical "fully informed impartial observer" without providing an independent justification for why *this specific benchmark* is the arbiter of bias (as distinct from truth).
      *   **Motivation:** Your requirement correctly identifies that appealing to an ideal observer without argument begs the question ("why is *this* standpoint bias-free?"). Furthermore, majority opinion is clearly inadequate (historically majorities have held biased views). The account must offer a criterion *for bias* distinct from such external measures of correctness.
  5.  **Distinction from Non-Moral Error:** The account must either distinguish moral bias from simple error about non-moral facts relevant to a moral judgment, or provide a compelling explanation for why such a distinction cannot or need not be made.
      *   **Motivation:** The visceral disgust case (treating disgust as a moral verdict) might involve a factual error (e.g., mistakenly believing the practice causes harm). Is the moral judgment biased *because* of this factual error, or is there a distinct moral bias at play? An adequate account needs to address this potential overlap/confusion.
  6.  **Handling Adaptive Preferences:** The account must explain the status of preferences formed under, and seemingly adapted to, unjust or severely restricted circumstances.
      *   **Motivation:** The person reporting a preference for a narrow life denied other options presents a challenge. Is this a genuine preference or a "sour grapes" rationalization masking a bias *induced* by oppression? The account must grapple with preferences shaped by limitations on autonomy or exposure.
  7.  **Usability for Self-Application:** The account must provide criteria that are, at least in principle, applicable by an ordinary moral agent to their *own* judgments and dispositions.
      *   **Motivation:** Your observation of asymmetry (quick to see bias in others, slow in oneself) highlights the need for a standard one *could* apply reflexively. A theory utterly opaque to self-diagnosis would be practically deficient for ethical reflection.
  8.  **Reflexivity & Asymmetry Explanation:** The account must be able to explain the common psychological asymmetry (seeing bias more easily in others than in oneself) *and* accommodate the logical possibility that applying its own criteria to the agent holding the theory could reveal the agent's own judgment as biased (without necessarily collapsing the theory).
      *   **Motivation:** This is crucial. Your observation about potential self-condemnation ("what happens when the criterion... calls mine biased too") demands that the theory is *reflexive*. It must account for *why* self-application is harder (e.g., motivated reasoning, lack of external perspective) and what it means if the criteria *do* indict the agent's own view (e.g., it reveals a tension demanding resolution, not necessarily the theory's invalidity). A theory immune to self-application fails a key test of robustness.

  ### Analysis of Requirements
  *   **Constitutive vs. Camp-Specific:** Requirements 1 (Content Neutrality), 2 (Opacity), 3 (Diversity), 6 (Adaptive Prefs), and 7 (Self-Application) are genuinely constitutive. They stem directly from the core phenomena you describe (upbringing, unaware bias, community conflict, restricted options, self/other asymmetry) that *any* theory must address to be considered adequate. Requirement 8 (Reflexivity/Asymmetry) is also constitutive, arising directly from your introspective observation and its logical implication, which is fundamental to the concept's application.
  *   **Potential Tensions (Not Fatal Inconsistencies):**
      *   **3 (Diversity) vs. 6 (Adaptive Prefs):** Distinguishing legitimate cultural preferences from preferences distorted by oppression is inherently challenging but *not* impossible. A good theory will provide tools (e.g., focusing on process, autonomy, or exposure) to navigate this.
      *   **3 (Diversity) vs. 8 (Reflexivity):** Applying one's criteria to condemn another community's view as biased risks imperialism. The theory must balance reflexivity with the recognition of diversity (e.g., by focusing on *how* judgments are formed within a framework, not just *that* they differ).
      *   **4 (Non-Reduction) vs. Popular Theories:** Requirement 4 directly challenges many popular accounts (Ideal Observer, Contractualism relying on idealized agents). This doesn't make it inconsistent with the list; it highlights its critical role in excluding simplistic solutions.
  *   **Most Exclusionary Requirement:** **Requirement 4 (Non-Reduction to External Benchmarks)** does the most work to exclude otherwise popular accounts. Many intuitive or philosophical approaches (Ideal Observer, Universalizability tests, Majority View) fail precisely because they attempt to define bias *by* deviation from a favored normative standard without providing an independent account of *bias itself*. Requirement 4 forces the theory to ground the distinction in something other than the (contested) final moral truth.

  ### Scoring Broad Families Against Desiderata
  1.  **Procedural/Process-Based View (Bias as defective psychological process - e.g., motivated reasoning, cognitive distortions):**
      *   **Strengths:** Excels at 2 (Opacity - explains subconscious bias), 6 (Adaptive Prefs - explains distortion under oppression), potentially 7 (Self-Application - processes can be introspected/trained). Handles the self-serving student well.
      *   **Weaknesses:** Struggles with 3 (Diversity - are all culturally ingrained processes "defective"?), 5 (Distinction from Non-Moral Error - conflates process defects with factual ignorance?), 8 (Reflexivity - can one detect one's *own* motivated reasoning?). May struggle with the visceral disgust case (is it faulty process or factual error?).
  2.  **Ideal/Corrected Standpoint View (Bias as deviation from an epistemically or rationally privileged standpoint - e.g., full information, impartiality, idealized agreement):**
      *   **Strengths:** Potentially strong on 6 (Adaptive Prefs - restricted info/options explains distortion), 5 (can subsume factual error under lack of ideal info). Explains why the self-serving student is biased.
      *   **Weaknesses:** Directly violates **4 (Non-Reduction)** unless heavily supplemented with an independent account of *why* this standpoint defines *bias* (not just truth). Struggles severely with 3 (Diversity - risks moral imperialism by privileging one standpoint). Challenges 7 & 8 (Usability/Reflexivity - applying the ideal standpoint to oneself is abstract and difficult, asymmetry remains unexplained).
  3.  **Deflationary/Power-Based View (Preference/Bias distinction is rhetorical, masking power dynamics):**
      *   **Strengths:** Explains 8 (Asymmetry - labeling others' views as "bias" is a power move). Fits the two communities case (mutual accusations as conflict).
      *   **Weaknesses:** Fails catastrophically at most requirements: Rejects 1 (becomes *all* about content/power), ignores 2 (denies reality of subconscious bias), rejects 3 (diversity is just power imbalance), violates 4 (defines "bias" as the view of the less powerful), ignores 5 & 6 (reduces everything to power), makes 7 meaningless (no real distinction to apply). Cannot explain the person unaware of their own biased behavior or the adaptive preference case as anything other than power effects.

  This specification provides the necessary framework to rigorously evaluate any proposed account of the moral preference/bias distinction for your paper. The identified tensions highlight the critical challenges a successful theory must overcome.
