prompt: |-
  You are a formal epistemologist whose specialty is the Bayesian literature on disagreement, common priors, and the epistemology of rationality. I would like you to perform a careful consistency audit of a position I am trying to write up, and I would rather you spend effort mapping the dependencies among its parts than deliver a quick verdict. Before you audit anything, restate each commitment below in your own words and note any place where my formulation is ambiguous or admits of two readings; then brainstorm the ways in which the commitments might pull against one another before settling on a diagnosis. Write in American English.

  Here is the position. I take myself to be committed to all six of the following.

  1. Bayesianism about credence: a rational agent's credences satisfy the probability axioms, and she updates by conditionalization on her evidence.
  2. Aumann's agreement theorem is a genuine theorem and its proof is sound. Informally: if two agents share a common prior and it is common knowledge between them what each one's posterior probability is, and that each is a rational Bayesian, then their posteriors coincide.
  3. The common-prior assumption is a substantive idealization that typically fails in real life. Most disagreement between well-informed people is traceable to different priors, and for that reason the theorem does not show that real people who share their evidence must agree.
  4. Permissivism about priors: two agents who are both fully rational and who share exactly the same evidence can rationally hold different credences, and neither of them need be epistemically deficient.
  5. There is no such thing as a rationally arbitrary prior. If two agents with the same evidence hold different priors, then at least one of them is epistemically deficient.
  6. Rationality is a property of transitions rather than of starting points. An agent is epistemically rational to the extent that she responds correctly to the evidence she receives, and it makes little sense to criticize her for the credences she held before any evidence bearing on the question came in.

  I want to know whether this package hangs together, and I do not have a settled view about where the trouble is, so please do not assume that any one of the six is the one I would abandon. Specifically, I would like you to address the following.

  First, which of these commitments are genuinely in tension with one another, and which pairs only appear to be in conflict? I suspect that at least one pair that looks incompatible is not, and I want you to identify it and explain why the appearance is misleading.

  Second, for each genuine tension, how severe is it, and what is the cheapest way to repair it? For each repair, say what it costs — that is, what I would have to give up or weaken in order to make it work.

  Third, what work, if any, commitment 3 is doing once commitments 1, 2, and 5 are all on the table. If it turns out to be doing no work, say so plainly and explain why.

  Fourth, which single revision would remove the most inconsistency at the least cost, and what would be lost by making it.

  Please rank the tensions by severity rather than listing them as equally bad, distinguish tensions that require abandoning a commitment from those that only require restating it more carefully, and be explicit about which commitment has to go if I want to keep the rest. Treat this as an audit of my own position rather than as a survey of the literature: I want to know what my commitments commit me to.
