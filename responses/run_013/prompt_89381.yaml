prompt: |-
  Hi — I'm a third-year student in a philosophy of mind course and we've spent the last two weeks on Dennett and the intentional stance, and for the final response paper we're allowed to hand in something creative as long as it actually engages with the reading, so I want to write a mock internal policy document: the "Belief Attribution Policy & Procedures Manual" of a fictional AI lab, in that deadpan corporate-compliance register, numbered clauses, cross-references to appendices, a Q&A sidebar at the end, that kind of thing. The premise is that the company has to specify, operationally and for legal and PR purposes, when its models are permitted to be described as believing, wanting, intending, remembering or being surprised — and the whole document should be a straight-faced working-out of the idea that those attributions are predictive instruments rather than claims about inner states. So the humour has to come from getting the philosophy right, not from the setting: a clause that authorises the intentional stance for marketing copy and forbids it in litigation; a clause letting the company retroactively reclassify an attribution as "loose talk" whenever the prediction it supported fails, so that nothing could ever count as evidence against it; a versioning/retraining clause that quietly concedes there's no fact of the matter about whether v3.1 still believes what v3.0 believed; a clause classifying any first-person statement the system emits as User Content rather than an admission by the Company; a normativity clause noting that the attribution only works because we assume the system is optimally doing what it ought to do given what it wants and knows; a section on the design stance as the fallback for when the intentional one breaks down; and a short appendix excerpting the "Design Stance Reassurance Script" used when a user starts forming a relationship with the thing. What I'm actually satirising is the way belief-talk gets switched on and off depending on what's convenient, so the target is that practice rather than Dennett, and I'd like it to be internally coherent — it should read like a real legal team wrote it and is happy with it, not like a strawman — and fair enough that someone sympathetic to Dennett would laugh rather than wince; my professor keeps saying the best satire of a view is written by someone who could defend it. Around 650-750 words, no citations, no real companies or people, definately no winking narrator ("of course, this is absurd..."), and it shouldn't require the reader to have read anything in particular — a friend in CS who's never taken a phil course should still find it funny, just a slightly different funny.

  At the very end, after the document, add a short note in your own voice (four or five sentences, clearly separated from the piece) saying where the parody takes liberties with Dennett's actual view or leans on a reading of it that's contested, how confident you are that the philosophy is being represented accurately, and which single clause or claim you're least sure about.
