answer: |-
  Here’s a step-by-step teaching plan for your session. It uses your snail example, targets misconceptions explicitly, and pivots on the selective support vs. non-contradiction distinction. Sequence is designed for a whiteboard flow.

  ---

  ### **Teaching Plan: Hempel’s Paradox (Snail Edition)**

  #### **1. Order of Ideas**  
  *(Whiteboard: Start blank, add elements incrementally)*  
  **Goal:** Build paradox from scratch, making dependencies explicit.

  | Step | Teaching Move                                                                 | Why This Order?                                                                 | Dependency Notes                                                                 |
  |------|-------------------------------------------------------------------------------|---------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | 1    | **Define "Evidential Support"**<br>*"Evidence E supports hypothesis H if E makes H more likely to be true than it was before we had E."* | Must anchor "support" before paradox makes sense. Avoid probability symbols; use everyday language. | Nothing required. Start here to avoid conflating support with verification. |
  | 2    | **Introduce Generalization & Positive Instances**<br>*Hypothesis H: "All snails in Genus Turbo are sinistral (left-coiled)."*<br>*Positive Instance: Finding a sinistral Turbo snail.*<br>*Board: H → Instance supports H? ✔️ (Audience agrees)* | Isolate the intuitive case first. Use your expertise for credibility. | Requires Step 1 (support defined). Shows uncontroversial support. |
  | 3    | **Formalize H and Its Logical Structure**<br>*H: "All Turbo snails are sinistral." = "If it’s a Turbo snail, then it’s sinistral."*<br>*Contrapositive: "If it’s NOT sinistral, then it’s NOT a Turbo snail."*<br>*Board: H ≡ (Turbo → Sinistral) ≡ (¬Sinistral → ¬Turbo)* | Contrapositive is essential for paradox. Translate to logic without symbols ("if not A, then not B"). | Requires understanding H as a conditional (Step 2). |
  | 4    | **Equivalence Condition (Key Premise)**<br>*"If two statements are logically equivalent, evidence supporting one supports the other."*<br>*Board: "Supporting (¬Sinistral → ¬Turbo) is the same as supporting H."* | Justify why we care about contrapositive. Frame as a logical rule, not intuition. | Requires Step 3 (contrapositive understood). |
  | 5    | **Apply Rule to Non-Instances**<br>*"What supports (¬Sinistral → ¬Turbo)? A positive instance: Finding something NOT sinistral that is NOT a Turbo snail."*<br>*Example: A dextral (right-coiled) Littorina snail.*<br>*Board: "Dextral Littorina supports ¬Sinistral → ¬Turbo" → "Thus, it supports H."* | Forcefully derive the paradox. Use concrete non-instance. | Requires Step 4 (equivalence) and Step 1 (support). |
  | 6    | **State the Paradox**<br>*"Paradox: Finding a dextral Littorina (irrelevant to Turbo snails) seems to support 'All Turbo snails are sinistral'!"* | Highlight the mismatch between logic and intuition. | All prior steps in place. |

  #### **2. Carrying Example: Snails**  
  **Your example WORKS** if you ensure:  
  - **What it must have:**  
    - A clear genus/species distinction (Turbo vs. non-Turbo snails).  
    - A binary trait (sinistral/dextral) with obvious non-instances (dextral non-Turbo snails).  
    - Plentiful "boring" non-instances (e.g., common dextral Littorina on beaches).  
  - **What it must lack:**  
    - No overlap in genera (avoid "What if a Turbo snail is dextral?" – assume H is strict).  
    - No biological complexities (e.g., trait variability, taxonomy debates). Stick to logic.  
  **Why it’s honest:** The paradox arises from pure logic, not quirks of snails. Your example avoids the "white shoe" gimmick by using taxonomically distant non-instances (Littorina isn’t Turbo).

  #### **3. Misconceptions & Defusing Them**  
  *(Address AS they arise in the sequence)*  

  | Step | Misconception | When It Arises | How to Defuse |
  |------|---------------|----------------|--------------|
  | Post-Step 5 | **"A non-instance supports H *a little*."** | When deriving support for dextral Littorina. | *"This confuses 'does not contradict H' with 'supports H.' A dextral Littorina doesn’t *falsify* H (since H doesn’t claim anything about Littorina), but does it make H *more likely*? Intuitively, no – it’s irrelevant."* |
  | Post-Step 6 | **"A non-instance supports H *not at all*."** | After stating paradox. | *"Correct intuition! But logic says it *does* support H via the contrapositive. The tension is real: logic and intuition clash. Your diagnosis is right – we’re mixing two 'support' concepts."* → **Pivot to Step 7.** |
  | Post-Step 5 | **"But there are countless non-instances – doesn’t that *overwhelm* support?"** | When generalizing to "all dextral non-Turbos." | *"The paradox isn’t about degree of support. Even ONE dextral Littorina creates the problem: Why should this irrelevant fact support H at all?"* |

  **Your Diagnosis:** Correct. Two senses of "support":  
  - **Selective support** (Step 7): Evidence that specifically bolsters H *because it’s about H’s subject matter*.  
  - **Non-contradiction** (Step 5): Evidence that’s consistent with H but doesn’t make H more plausible.  
  The paradox forces the latter to "count" as support via logic.

  #### **4. The Pivot: Selective Support vs. Non-Contradiction**  
  - **When to introduce:** Immediately after stating the paradox (Step 6).  
  - **Teaching Move (Step 7):**  
    *Board two columns:*  
    `Selective Support` | `Non-Contradiction`  
    *Examples:*  
    - Selective: Finding a *sinistral Turbo snail*. (Makes H more plausible)  
    - Non-Contradiction: Finding a *dextral Littorina*. (Only doesn’t falsify H)  
    ***Key Point:** "The paradox shows logic conflates these. But intuitively, only selective support matters for science. Finding a Littorina tells us nothing about Turbo snails!"*  
  - **Address the Worry (Optional Add-on):**  
    *If time/engagement allows:* "What if I claim 'All Turbo snails are sinistral AND the moon is cheese?' Finding a dextral Littorina 'supports' this too! But it’s clearly irrelevant to the moon. This shows why we need *selective* support." (Keep this brief – it’s a reinforcement, not core).

  #### **5. Check for Understanding**  
  **Question:**  
  *"Imagine a hypothesis: 'All Antarctic sponges are porous.' Your colleague studies a tropical orchid and notes, 'This orchid is not porous.' Does this observation support the sponge hypothesis? Why/why not?"*  
  - **Correct Answer:** No (intuitive). But logically, it supports the contrapositive "If not porous, then not an Antarctic sponge."  
  - **Why it works:** Tests if they see the paradox’s *structure* (tropical orchid = irrelevant non-instance) and distinguish logic from intuition.

  #### **6. What to LEAVE OUT**  
  - **Formal logic symbols** (∀, →, ¬). Use plain-language conditionals.  
  - **Probability/quantitative confirmation** (Bayes, Carnap). No math.  
  - **Solutions** (e.g., Bayesian resolution, falsificationism). This is about *seeing* the paradox.  
  - **Ravens/white shoes.** Stick to snails.  
  ***Explicitly say:** "Today, we’re only exposing the paradox – not solving it. We’re ignoring probability math and alternative examples to focus on why this *is* a puzzle."*

  ---

  ### **Session Flow Summary**  
  1. Define evidential support (5 min)  
  2. Positive instances with snails (5 min)  
  3. H & contrapositive (5 min)  
  4. Equivalence condition (5 min)  
  5. Non-instances as support (10 min)  
  6. State paradox (5 min)  
  7. **PIVOT:** Selective vs. non-contradiction support (10 min)  
  8. Check question + discussion (5 min)  

  **Whiteboard Flow:**  
  - Start blank.  
  - Add H: "All Turbo snails: sinistral."  
  - Add contrapositive: "Not sinistral → Not Turbo."  
  - Add EQUIVALENCE arrow between them.  
  - Under H: "Support: Sinistral Turbo" (✔️).  
  - Under contrapositive: "Support: NOT Sinistral + NOT Turbo" (→ then ✔️).  
  - Add "Paradox: Littorina supports H?" (❓).  
  - Add two-column contrast (Selective vs. Non-Contradiction).  

  This leverages your biological expertise, avoids clichés, and forces the paradox to bite via the selective/non-contradiction distinction. Good luck!
