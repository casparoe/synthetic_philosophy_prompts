prompt: |-
  I am putting together a ninety-minute session for a graduate interdisciplinary reading group—philosophers, computer scientists, and economists—on decision theory under uncertainty. Most participants can state the difference between causal and evidential decision theory and have seen Newcomb's problem, but almost none have thought carefully about counterfactual mugging or XOR blackmail, and I want the session to leave them able to see why those cases are supposed to put pressure on ordinary decision theory rather than merely being exotic bets. I am not asking you to explain the cases to me; I need a teaching plan. What has to be introduced first for the question even to be well posed—the distinction between a decision's causal consequences and its evidential bearing, the difference between acting in a branch and acting on a policy, the role of the predictor's accuracy, something else? What single example should carry the session, and why that one rather than the other? What must the example have, and what must it conspicuously lack, so that the audience feels the pull of both the pay and the refuse answers before any formalism arrives? Which misconceptions will they form—that the problem is just a weird bet about a coin, that the answer turns on how probable the predictor is, that XOR blackmail is ordinary blackmail in disguise, that updatelessness requires backward causation, that evidential decision theory is simply irrational—and at exactly which point in the sequence should I head each one off?

  I also want to end with a variant I have been developing: the predictor is not an omniscient demon but a publicly audited model trained on a transcript of the agent's earlier deliberations, and the agent knows the model is running before the coin is tossed. I want to ask whether that variant sharpens the problem or merely adds machinery. Show me where that capstone belongs and what it is supposed to test. Finally, give me one question I can ask at the end to tell whether they have understood the structure of the problem rather than merely memorized a verdict, and tell me what I should openly refuse to cover at this level and why.
reasoning: |-
  Okay, the user is organizing a 90-minute session for a grad interdisciplinary reading group. The participants are philosophers, computer scientists, and economists. They know about causal vs. evidential decision theory and Newcomb's problem but not counterfactual mugging or XOR blackmail. The goal is to make them see why these cases challenge ordinary decision theory, not just seem like exotic bets.

  First, I need to figure out how to structure the session. The user wants a teaching plan. What foundational concepts are necessary? The distinction between causal consequences and evidential bearing is already known, so maybe I don't need to revisit that deeply. But perhaps reinforcing it briefly could help. The key might be introducing the idea of acting on a policy versus in a single instance. Also, the predictor's accuracy is crucial in these problems, so clarifying that the predictor's infallibility is assumed might be important.

  Counterfactual mugging (CM) seems like a better starting point than XOR blackmail. CM is simpler, with fewer moving parts. It involves a coin flip, a predictor, and a payment request. XOR blackmail adds multiple agents and XOR conditions, which might complicate things initially. Starting with CM allows the group to grasp the core dilemma without extra complexity. The user wants them to feel the pull of both paying and refusing. In CM, the intuitive reasons to pay (helping in another branch) and refuse (no causal benefit) create tension.

  Potential misconceptions to address: thinking it's just a weird bet, misunderstanding the predictor's role, or confusing updatelessness with backward causation. Each of these needs to be preempted at specific points. For example, when explaining the predictor, emphasize that their accuracy is perfect to avoid debates about probability. When discussing the decision, clarify that refusing in the current branch doesn't affect the predictor's past knowledge.

  The user’s variant involves a publicly audited model trained on the agent's deliberations. This should come after the core concepts. It tests whether the predictor needs to be supernatural or if a transparent algorithm can create the same dilemma. This variant might sharpen the problem by removing metaphysical concerns and focusing on logical dependency.

  Ending with a question that tests understanding: asking them to explain why EDT and CDT fail in the variant scenario. If they can articulate the conflict between evidence and causality in a transparent model, they get it. Refusing to cover updatelessness in depth makes sense because it's complex and requires more time than available.

  I need to ensure the session flows logically: start with CM to establish the problem, address misconceptions, then move to the variant. Group discussions will help them engage deeply. Timing each section is crucial to stay within 90 minutes. The capstone variant should highlight the core issue without unnecessary complexity, showing that the problem isn't about the predictor's nature but the decision theory itself.
answer: |-
  Here's a structured 90-minute teaching plan focused on **Counterfactual Mugging (CM)** as the primary vehicle, designed to build conceptual tension and target your specific goals:

  **Core Pedagogical Strategy:** Start with pure intuition, layer in formal pressure points, then challenge with your variant. Force participants to *feel* the conflict before labeling it.

  ---

  **Session Structure (90 Mins Total):**

  1.  **Framing & Setup (10 mins):**
      *   **Goal:** Reactivate CDT/EDT distinction & isolate the "predictor accuracy" variable.
      *   **Activity:** Brief recap: "CDT cares about causing good outcomes. EDT cares about being *evidence* of good outcomes. Newcomb showed they conflict when an action provides evidence about a *fixed past state* (Predictor's prediction). Today, we look at conflicts arising from evidence about *counterfactual branches*."
      *   **Crucial Move:** State upfront: "For *all* problems today, assume the Predictor is **infallible**. Its prediction is a fact about the world. We are *not* debating its likelihood. We are debating *how the agent should reason given this fact*."

  2.  **Introducing Counterfactual Mugging - Intuitive Tug-of-War (25 mins):**
      *   **The Setup (Plain Language):**
          *   "A fair coin is flipped. If Heads, nothing happens. If Tails, a Predictor (infallible!) appears. *Before* the flip, it predicted whether you would pay it $100 if it appeared and asked (on Tails). If it predicted you *would* pay, it gives you $10,000 on Heads. If it predicted you *wouldn't* pay, it gives you nothing on Heads. It's now Tails. The Predictor appears and asks for $100. Do you pay?"
      *   **Activity:** Silent individual reflection (2 mins), then small group (3-4 people) discussion (10 mins). **Prompt:** "Don't argue for a theory yet. What feels like the *strongest reason* to pay? What feels like the *strongest reason* to refuse? Record both." Facilitator circulates, notes common arguments.
      *   **Group Share & Tension Building (10 mins):**
          *   **Pay Argument:** "If I pay, the Predictor *must* have predicted I pay -> I get $10,000 on Heads! Refusing loses that."
          *   **Refuse Argument:** "But it's Tails! Paying $100 now gets me *nothing* extra. The prediction is already made, the Heads outcome is fixed. I just lose $100 for no reason."
          *   **Facilitator:** Explicitly link "Pay" to EDT (acting as evidence of good Heads outcome) and "Refuse" to CDT (no causal benefit on Tails). **Emphasize:** Both feel compelling! This *is* the core tension.

  3.  **Pressure Points & Misconception Busting (30 mins):**
      *   **Why This Isn't Just a Weird Bet (5 mins):**
          *   **Misconception:** "It's just betting $100 against $10,000 on a coin flip I didn't see? 100:1 odds!"
          *   **Head Off:** "Crucially, *you only face this choice on Tails*. On Heads, you passively collect. The 'bet' isn't offered symmetrically. CDT sees *no possible win* from paying on Tails. EDT sees paying as *securing* the Heads win that already happened."
      *   **The "Branch" vs. "Policy" Distinction (10 mins):**
          *   **Activity:** "Imagine you could choose a *policy now, before the flip*: 'Always Pay if Asked' vs. 'Always Refuse if Asked'. Which policy has higher expected utility?" (Consensus: Always Pay -> $5,000 expected value vs. $0).
          *   **Conflict:** "But CDT struggles to justify paying *in the Tails branch itself* because, *locally*, paying causes a $100 loss with no compensating gain *in that branch*. EDT can justify it locally as evidence of the Heads gain. CDT wants the good policy but can't execute it locally when it matters."
      *   **Updatelessness & Backward Causation Myth (10 mins):**
          *   **Misconception:** "Paying causes the Predictor to have predicted paying -> backward causation!"
          *   **Head Off:** "Reinforce: Predictor is infallible, prediction is *fixed* before the flip. Paying doesn't *cause* the prediction; it *reveals what the prediction always was*. Updateless decision theories (like UDT) argue you should act *as if* you are choosing the policy *before* knowing the branch (Tails/Heads), ignoring the 'useless' information of being in Tails for this specific decision. It's not magic; it's about commitment to the optimal pre-flip strategy."
      *   **XOR Blackmail as Contrast (5 mins - Brief Teaser):**
          *   "XOR Blackmail adds complexity: two agents, an XOR condition on their actions, and the demand depends on the prediction. The core tension remains: CDT sees paying as locally harmful (loss with no gain), EDT/Updateless see paying as evidence of/compatible with the good outcome where *the other agent* didn't pay. CM gives us the core; XOR shows it scales and involves coordination under prediction."

  4.  **Your Variant: The Audited Model (Capstone - 15 mins):**
      *   **Setup:** "Replace the omniscient demon. Before the coin flip, a *publicly audited, high-fidelity ML model* is trained *exclusively* on a complete transcript of *this specific agent's* past reasoning (e.g., about CM-like scenarios, ethics, risk). The agent knows the model runs *before* the flip and that its output (the prediction) is fixed then. The model's code and training data are public. It's Tails. The model (acting as Predictor) asks for $100."
      *   **Activity:** Pair Discussion (5 mins) **Prompt:** "Does this *sharpen* the philosophical problem, or just add distracting machinery? Why?"
      *   **Debrief & Purpose (10 mins):**
          *   **Goal:** Tests if the problem hinges on metaphysics (demons) or logic (inference under certainty about prediction).
          *   **Sharpens It:** Removes "magic", emphasizes logical dependency. The predictor is *your own reasoning, externalized and simulated*. Refusing feels even *more* CDT-justifiable ("It's just code, paying does nothing!"), yet paying feels *more* EDT/Updateless-justifiable ("The model *perfectly* simulates *me*; if I refuse, that's what it predicted -> I lose $10K on Heads. To get Heads money, I must *be* the agent who pays on Tails."). Makes "updatelessness" feel less mystical and more about consistent pre-commitment.
          *   **Potential Softening:** Some might argue model imperfections (though specified as high-fidelity) or training data limitations *could* introduce doubt, but the core tension remains dominant if fidelity is stressed.

  5.  **Synthesis & Assessment (10 mins):**
      *   **Key Takeaway:** "These problems highlight a fundamental fissure: Should rational agents act based *only* on the causal consequences within their actual branch (CDT), or should they also consider the *evidential* or *logical* implications of their actions for outcomes in *other* counterfactual branches (EDT, Updatelessness), especially when a perfect predictor links the branches?"
      *   **Assessment Question:** "Imagine in the Audited Model variant, the agent *does* pay on Tails. According to **CDT**, why was this decision irrational *from the perspective of the agent at the moment of choice on Tails*? According to **EDT or an Updateless view**, why was it rational (or necessary)?" *(Correct Answer: CDT: Paying caused a $100 loss with no causal gain in the Tails branch. EDT/Updateless: Paying was necessary evidence of/linked to being the type of agent who triggers the $10,000 payout in the Heads branch, which outweighs the $100 loss.)*
      *   **What We're NOT Covering (Explicitly State):** "We're *not* diving deep into the formal machinery of Updateless Decision Theory (UDT), Functional Decision Theory (FDT), or nuanced solution proposals today. The goal was to expose the *tension* and *why* these cases are hard problems, not to resolve them fully. We're also bracketing debates about *actual* predictor feasibility outside thought experiments."

  ---

  **Why Counterfactual Mugging (CM) over XOR Blackmail?**

  1.  **Simplicity:** Fewer moving parts (one agent, one coin, one payment) makes the core tension clearer. XOR introduces two agents, an XOR condition, and variable payments, adding complexity that can distract from the foundational issue early on.
  2.  **Stronger Evidential Intuition:** The direct link between paying on Tails and securing the Heads payoff is more visceral in CM. XOR's reliance on the other agent introduces a layer of coordination that can muddy the purely logical/evidential link.
  3.  **Clearer CDT Failure:** CDT's inability to justify the globally optimal policy ("Always Pay") is starkest in CM. Paying on Tails seems *purely* costly locally.
  4.  **Better Foundation for XOR:** Understanding CM makes XOR Blackmail easier to grasp as an extension involving coordination under prediction.

  **Key Elements the Example Must Have/Lack:**

  *   **Must Have:**
      *   A **perfect predictor** (infallibility assumed).
      *   An **action** (Pay/Refuse) that is **counterfactually linked** to a **desired outcome in a different branch** (Heads payoff).
      *   **No causal link** within the branch where the decision is made (paying on Tails does *nothing* to cause the Heads payoff).
  *   **Must Conspicuously Lack:**
      *   Any possibility for the action to *causally influence* the desired outcome in its own branch or retroactively. The predictor's action and the other outcome are fixed facts.
      *   Symmetry (the "bet" is only offered in the losing branch).

  This plan forces participants to confront the logical tension head-on, preempts major distractions, uses your variant to modernize and sharpen the dilemma, and provides a clear assessment question targeting structural understanding over rote answers.
