  I've been reading Borges on and off for about a year and the thing thats bugging me is that he seems to hold like three different pictures of time at once and I cant tell if they're compatible or if he just never noticed. (a) time isnt real, its a construction, and the only real thing is the instant — I think thats the New Refutation essay, where he goes through Berkeley and Hume and then at the very end basically concedes that the world is real and hes stuck being himself, which is honestly my favorite bit. (b) time is a circle and the same series comes around again forever, which he keeps flirting with in the essays. (c) in one of the stories every possible outcome of a choice happens at once, so theres no single timeline to begin with.

  Can you write me a pantoum about this? The form feels right because the same lines keep coming back, but I want the repetitions to make the three views harder to tell apart, not easier — by the last stanza I shouldnt be able to say which picture the recurring lines belong to. No maze/mirror/tiger imagery, no pastiche of his voice, and please dont just name-drop teh essays.

  Im a backend dev, so if the three-pictures framing is me misreading him, or if the pantoum is just the wrong shape for this, say so instead of writing it anyway. And if you do write it, stick a short note at the end on where it takes liberties or leans on a reading people actually argue about.
