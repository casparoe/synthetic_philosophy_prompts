  Okay, the user is struggling with a distinction in social ontology between two accounts of why local conventions bind visitors. Let me start by recalling the two accounts: the coordination equilibrium view and the community claim view. The user wants concrete examples analyzed—tipping, queueing, jaywalking—with specific scenarios for each.

  First, I need to break down each case for both accounts. For tipping, consider the underpayer and overpayer. Coordination equilibrium would see obligation only if it disrupts expectations, so underpaying might be problematic, but overpaying isn't. The community claim view, however, might see both as failures to respect the local norm, even if no harm is done. 

  Queueing examples: the unaware tourist versus the local who cuts intentionally. Coordination focuses on disruption; the tourist might be excused, but the local exploits the system. Community claim emphasizes recognition, so both could be seen as failing to honor the group's norms, regardless of outcome.

  Jaywalking: empty street versus crowded with children. Coordination is about tangible harm, so crossing when empty is fine, but with kids, it's risky. Community claim might argue that even when empty, breaking the rule shows disrespect for the community's shared practices.

  Now, the user's deeper need might be understanding if these accounts are truly distinct or if the first collapses into the second. The friend insists they're different, but the user is unsure. I should check where obligations arise without tangible harm. If the community view imposes obligations even when no coordination is disrupted, that's a key distinction.

  Also, the user wants a verdict. Which account better explains moral obligations? The coordination view is pragmatic but limited. The community view captures the social aspect but risks over-moralizing. The tipping overpayment case is tricky for coordination because no harm, but community might still see an issue. Queueing's intentional cutter challenges coordination if unenforced. Jaywalking with kids shows both accounts align on harm, but empty street highlights their divergence.

  The user might need clarity on whether social norms inherently carry moral weight beyond practicality. They might also be looking for which framework is more robust across different scenarios without forcing explanations. Highlighting the cases where accounts disagree (tipping overpayment, queueing unaware tourist, jaywalking empty) shows the distinction. The hardest case for each: for coordination, it's when no disruption occurs (over-tipping, jaywalking empty). For community, it's when norms are oppressive or silly, requiring conformity without question.

  Verdict: coordination explains obligations pragmatically but misses symbolic aspects. Community better captures why visitors should respect local customs as a form of recognition, even without harm. But it might overextend. Overall, community gives a fuller account of moral obligations in conventions, especially for visitors.
answer: |-
  Here's a breakdown of the two accounts applied to your cases, followed by a clear verdict on their distinctness and explanatory power:

  **The Two Accounts:**
  1.  **Coordination Equilibrium (CE):** Obligation arises *only* to avoid disrupting a mutually beneficial pattern of expectations. The duty is to *avoid harm to the scheme's function*. "Ought" is conditional on actual or likely degradation of coordination and benefit. The obligation is owed to *individuals* whose expectations/benefits are frustrated. Permissible deviation when the custom is "wrong/silly" if no disruption occurs.
  2.  **Community Claim (CC):** Obligation arises from *recognition of the community's authority* to set norms governing its shared space/practice. Conforming is a sign of respect *to the community itself* as a collective agent. The duty exists *even if no individual harm occurs and no one notices*. "Ought" stems from the community's standing. Permissible deviation when the custom is "wrong/silly" is much harder to justify, as it rejects the community's claim.

  **Case-by-Case Analysis:**

  1.  **Tipping:**
      *   **Scenario A: Visitor Underpays Against Custom (e.g., leaves 5% where 20% is standard):**
          *   **CE:** Likely *obligation breached*. The server has a reasonable expectation of compensation based on the local norm. Underpaying directly frustrates that expectation, potentially degrading the incentive structure for service workers and the predictability of the system. Obligation owed *to the server* (and perhaps other restaurant staff relying on tips). If the visitor finds the custom "silly" (e.g., thinks employers should pay living wages), they might still *technically* breach the CE by underpaying, but the case for "wrongness" feels weaker if the harm is only to the specific server's expected income.
          *   **CC:** *Obligation breached*. The visitor fails to acknowledge the local community's established practice governing service compensation. Even if the server doesn't notice immediately, or the restaurant is empty, it's a failure of recognition owed *to the community* that maintains this custom. Finding the custom "silly" doesn't negate the duty to respect the local community's way of doing things in *their* context.
      *   **Scenario B: Visitor Conspicuously Overpays (e.g., leaves 50% where 20% is standard):**
          *   **CE:** *No obligation breached, possibly no obligation at all.* Overpaying doesn't disrupt the coordination equilibrium; it doesn't frustrate the server's expectations negatively, nor does it make others less likely to follow the norm. It might even be welcomed! There's no duty to adhere *precisely* if deviation doesn't cause coordination failure or harm. Obligation only exists to avoid *under*-fulfilling the expected pattern. The visitor is permitted to overpay if they wish, regardless of thinking the custom "silly" or not.
          *   **CC:** *Obligation potentially breached.* While not harmful, conspicuous overpayment can be seen as failing to recognize or even *mocking* the community's norm. It treats the established standard as irrelevant, imposing an external judgment ("this is too little, I'll show you"). It's a failure of respectful conformity *to the community's standard*. The obligation is to follow *their* norm, not invent your own, even if "better." Finding the custom "silly" doesn't justify replacing it with your own version in *their* space.

  2.  **Queueing:**
      *   **Scenario A: Tourist Cuts Line Because Unaware:**
          *   **CE:** *Likely no obligation breached (initially).* Without knowledge, the tourist couldn't form the expectation or intend to disrupt. Once informed, however, *not* conforming *would* breach the CE (if they persist). Obligation (once aware) is owed *to those directly behind them* whose expectations are frustrated and wait time increased.
          *   **CC:** *Obligation breached, but perhaps blamelessly.* Ignorance might excuse the *individual*, but the act itself still constitutes a failure to recognize the community's practice governing orderly access. The obligation to conform exists objectively *for anyone in the space*, owed *to the community*. Ignorance explains but doesn't erase the failure of recognition. The community's claim binds visitors *in situ*.
      *   **Scenario B: Local Cuts Line Knowing No One Will Enforce:**
          *   **CE:** *Obligation breached.* The local *knows* the expectations and intentionally exploits the lack of enforcement to gain an unfair advantage, frustrating the expectations of others and degrading the trust necessary for the queue to function smoothly. This directly harms the coordination scheme. Obligation owed *to those queuing*.
          *   **CC:** *Obligation breached.* This is a clear rejection of the community's shared norm and authority. It shows disrespect for the collective practice, regardless of enforceability. The duty is owed *to the community* for maintaining order. Exploiting lack of enforcement makes it *worse* under CC, as it's a cynical rejection of the norm's validity.

  3.  **Jaywalking:**
      *   **Scenario A: Crosses Against Signal on Empty Street:**
          *   **CE:** *No obligation breached.* If the street is demonstrably empty, there's no coordination to disrupt. No driver's expectations are frustrated, no safety risk is created. The "scheme" (traffic laws coordinating pedestrians and vehicles) isn't degraded by this isolated, harmless act. The visitor is permitted to deviate if they see no point in waiting and no risk exists.
          *   **CC:** *Obligation breached.* The pedestrian violates the community's rule governing the shared use of the street. This rule exists as part of a broader system of order and safety, and violating it, even harmlessly, fails to recognize the community's authority over its public spaces. The duty to obey the rule *as the community's rule* is constant. Owed *to the community*. Finding it "silly" to wait when empty doesn't override the community's claim to set the rules.
      *   **Scenario B: Crosses Against Signal on Street Full of Children:**
          *   **CE:** *Strong obligation breached.* This creates a significant risk of disrupting coordination (confusing drivers, potentially causing children to follow suit unsafely, increasing accident risk). It directly degrades the safety scheme. Obligation owed *to drivers, the children, and other pedestrians*.
          *   **CC:** *Strong obligation breached.* Violating the rule in this context is reckless disregard for the community's safety norms in a situation where their importance is heightened. It shows extreme disrespect for the community's authority and the well-being of its members. Owed *to the community* and its vulnerable members.

  **Are the Accounts Distinct?**
  Yes, **your friend is right; they starkly come apart.** The CE account is fundamentally *consequentialist* and *individualistic*: obligation exists *only* to prevent tangible harm to the functioning of a beneficial coordination scheme affecting individuals. The CC account is *deontological* and *collectivist*: obligation exists as a *recognitional duty* owed to the community *as such*, regardless of immediate consequences or individual harm. The CE account collapses obligation into harm prevention within a specific scheme. The CC account grounds obligation in the moral standing of the community to govern its shared life. The **empty-street jaywalker** and the **conspicuous over-tipper** are the clearest cases demonstrating the distinction: CE sees no problem, CC sees a breach of duty.

  **Verdict: Which Account Gives the Better Answer?**

  *   **Question 1: Are everyday conventions moral obligations at all?**
      *   **CE:** Gives the *better answer here*. It provides a clear, pragmatic, and widely intuitive moral foundation: conventions create obligations *because and only when* they facilitate beneficial coordination and deviation harms that scheme or individuals within it. This avoids over-moralizing trivial customs and links obligation to tangible goods (order, predictability, mutual benefit). Its limitation is precisely where CC shines: explaining the *felt* obligation even in harmless cases.
      *   **CC:** Overextends. It risks turning *every* convention into a strict moral obligation simply by virtue of being a community norm, potentially demanding conformity to oppressive, inefficient, or genuinely silly customs without clear moral justification beyond "it's ours." It struggles to distinguish morally significant conventions from arbitrary ones.

  *   **Question 2: Must a visitor follow local conventions?**
      *   **CC:** Gives the **better answer here**. It directly captures the intuition that visitors have a duty to respect the "local rules of the game" *as an act of respect for the host community itself*, even when deviation might cause no immediate, tangible harm (empty street jaywalking, conspicuous over-tipping). This explains the strong sense that visitors *should* conform to local norms (tipping, queueing, dress codes) out of respect for the place and its people, not just fear of causing a fuss. It grounds the visitor's duty in the community's legitimate authority over its own shared practices and spaces.
      *   **CE:** Falls short. It only demands conformity when the visitor's action *actually risks disrupting* the local coordination scheme. This seems too permissive for visitors (e.g., "I'll jaywalk if empty, queue-cut if I think I won't get caught, tip arbitrarily") and fails to capture the core idea of *respectful adaptation* to a different social environment. It reduces the visitor's duty to avoiding being a nuisance, rather than showing respect.

  **Where Each Account is Silent/Struggles (Hardest Cases):**

  *   **Coordination Equilibrium (CE):**
      *   **Silent/Struggles With:** Obligations arising *without* potential disruption (empty street jaywalking, conspicuous over-tipping). Why does *merely knowing* you're violating a local norm often *feel* wrong even if harmless? Why is exploiting unenforced norms (queue-cutting local) feel like a *distinct* wrong beyond just the immediate harm? Why should a visitor conform to a local custom they find morally objectionable *if* their non-conformity doesn't disrupt coordination (a very high bar)?
      *   **Hardest Case: Conspicuous Over-Tipper.** CE struggles to see any problem at all, let alone an obligation breached. It's the clearest example of its limitation in capturing the recognitional aspect.

  *   **Community Claim (CC):**
      *   **Silent/Struggles With:** Providing a clear *moral justification* for *why* a community's claim generates an obligation, especially for customs that are arbitrary, inefficient, or potentially unjust. How strong is this duty when the custom *is* genuinely "silly" or morally questionable? When is it permissible for a visitor (or member!) to *reject* the claim? It risks demanding blind conformity.
      *   **Hardest Case: Unaware Queue-Cutting Tourist.** While CC maintains an obligation was breached objectively, the *blamelessness* of the tourist highlights the challenge. CE's focus on expectations/intent fits better with the intuition that the unaware tourist isn't really *at fault* initially. CC has to explain how an obligation can be breached without fault, purely by being in the space.

  **Conclusion:** The accounts are genuinely distinct, hinging on whether obligation stems from preventing harm to a coordination scheme (CE) or from recognizing a community's authority (CC). **CE better explains why conventions *in general* create moral obligations (due to their coordination benefits). CC better explains the specific obligation *visitors* have to follow *local* conventions (as an act of respect for the host community).** The conspicuous over-tipper and the empty-street jaywalker force the distinction into the open. Neither account is perfect, but together they map the core tension in understanding social convention's normative force.
