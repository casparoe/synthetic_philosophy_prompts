  Third, the evidence standard appears to be "proven sentience" rather than precautionary. Fish benefit from decades of research while crustaceans wait for conclusive proof. But science may never achieve absolute certainty about subjective experience - so the precautionary principle might be more philosophically defensible. 

  Where to push deeper? The underdetermination points matter most. For example: 
