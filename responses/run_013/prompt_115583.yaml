prompt: |-
  ok so background: I've been reading LessWrong and the old Overcoming Bias archives for like fifteen years, I know the vocabulary (indexical, reference class, observer-moments, all that) but I'm not a mathematician and I've never actually sat down and worked the anthropics stuff out on paper.

  Here's what I need. I'm one of eight people in a small giving circle. We pool maybe $400k a year, make 15ish grants, mostly longtermist-adjacent, and everything gets decided by a vote of the group. And a growing share of the proposals we get have their whole case riding on anthropic reasoning. Someone says 'under SIA you should expect vastly more observers than you'd naively think, so the EV here is astronomical.' Someone else says 'the doomsday argument means we're probably in the last century, so put the money in near-term stuff instead.' Someone wants us to fund work on whether the universe is spatially infinite. And the thing that drives me up the wall is that everyone just reaches for SSA or SIA depending on which one makes their proposal work, and since basically none of us can actually do the math we end up voting on vibes. Nobody in the circle can even tell me whether that's a real disagreement or a free parameter people are tuning.

  So what I want from you is a procedure. Not another essay about the debate -- an actual checklist that a non-mathematician can run on a proposal in about twenty minutes, in order, with clear stopping points, of the 'stop, the number is not usable, all you can say is that this proposal is good conditional on SSA and bad conditional on SIA' kind. It needs to tell me: (a) what facts about my own existence I'm allowed to condition on when doing the estimate, (b) how to pick a reference class without it being pure convenience, since every argument I've ever had about this ends with someone picking the reference class that gives them their answer, (c) exactly where SSA and SIA come apart on a given proposal and whether that divergence should kill the proposal or just get flagged for the group, and (d) what to do about the presumptuous philosopher type case, where the mere fact that one hypothesis implies way more observers makes you almost certain it's true without doing any physics. Please don't average the two assumptions into some mushy middle number -- that's exactly the move that lets us pretend we have a number when we don't.

  Then run the procedure on three proposals and show your work: (1) fund X because there are astronomically many future people, so the EV is huge; (2) fund Y because the doomsday argument says we're early and the window is closing; (3) fund Z, about whether the universe is infinite and whether infinitely many observers makes our EV numbers meaningless or undefined. I fully expect the procedure to tell me something I don't want to hear on at least one of these, so say which and don't soften it. And be upfront about where the procedure just can't decide anything and a human has to pick a prior and write down that they picked it, and where it will misfire on unusual proposals. Also I half-remember some Adam and Eve case that's supposed to break one of the reference classes -- if that's a real thing, tell me what it does to the checklist.
reasoning: |-
  Okay, this user is deeply embedded in the rationalist community but frustrated with how anthropic reasoning is being weaponized in their grantmaking circle. They're not looking for philosophical debates but a concrete decision protocol to cut through the vibes-based voting. The emotional tone is exasperated—they've seen fifteen years of abstract arguments and now need operational tools.

  Hmm... the core tension is between wanting rigorous math and admitting they're not mathematicians. So the procedure must avoid equations while preserving logical integrity. Key demands: 

  First, reference class selection can't be arbitrary—must anchor it to measurable properties of the grant context. Second, need clear failure modes where SSA/SIA diverge irreconcilably. Third, must handle infinity/information-loss cases explicitly. 

  For the checklist design... Start with observer definition because that's where most sleight-of-hand happens (e.g., "future people" could mean humans or sentient AI). Then force specification of what's being conditioned upon—no secret background assumptions. The Adam/Eve problem is actually useful here: it exposes when reference classes leak information. 

  Biggest challenge is the presumptuous philosopher case. The answer has to be "stop, no defensible prior exists" because otherwise it incentivizes pumping observer numbers to inflate EV. Will demonstrate this with Proposal 1 where conditioning on civilization duration changes everything. 

  For Proposal 3 (infinite universe), the procedure must flag that no convergence is possible—either reject the framing or demand non-anthropic justifications. User won't like that, but better than fake numbers. 

  Noticing they didn't mention updatelessness or indexical uncertainty... probably wise since those would explode complexity. Keep focused on grant-relevant splits. 

  Final structure: Observer test → Conditioning test → Reference class audit → Divergence detector. Each step designed to fail fast when reasoning gets shaky. Show the math in footnotes so they can trust it without deriving.
answer: |-
  Here's a **Practical Anthropics Decision Protocol** for grant evaluators. It forces explicit assumptions, identifies irreconcilable disagreements, and flags non-actionable claims. **Stop and reject any proposal that fails Steps 1-3.** No averaging allowed.

  ---

  ### **The Checklist**
  Run these steps in order. If any step fails, the anthropic claim is unusable for decision-making.

  1. **Define Observers & Indexical Facts**  
     - *Ask:* "What *specific, measurable property* defines an 'observer' here? (e.g., human DNA, functional AGI, Boltzmann brain)."  
     - *Stop if:* The definition isn’t testable/falsifiable (e.g., "any conscious entity").  
     - *Condition only on:* Your existence as an observer *with the defined properties*. No other indexicals (e.g., your name, birthday).  

  2. **Anchor the Reference Class**  
     - *Rule:* Reference class = *all observers who could have had your exact indexical information at the time of observation*.  
     - *Test:* "If I reran the universe, would this observer qualify?" If yes, include.  
     - *Stop if:* The class changes based on hypothesis (e.g., "under H₁, we include AIs; under H₂, only humans").  

  3. **Identify the Critical Assumption**  
     - *Ask:* "Does the proposal’s EV depend *solely* on the number of observers?"  
       - If **yes**, compute two EVs:  
         - **SSA:** `EV ∝ (Probability × Impact) / Number of observers in hypothesis`  
         - **SIA:** `EV ∝ (Probability × Impact) × Number of observers in hypothesis`  
       - *Stop if:* SSA and SIA give opposite recommendations (SSA↑/SIA↓ or vice versa).  
     - If **no**, anthropics is irrelevant — use standard EV.  

  4. **Handle Infinity/Undefined EV**  
     - *If observers are infinite under any hypothesis:*  
       - *Stop and reject* any claim that compares infinite EVs (e.g., "∞ > ∞").  
       - *Accept only if:* Proposal measures *finite* physical constants (e.g., "fund cosmology to test if Ω_k ≠ 0").  

  5. **Presumptuous Philosopher Test**  
     - *Ask:* "If we falsified the many-observers hypothesis (e.g., proved a finite universe), would the proposer still back it?"  
       - If **no**, reject — it’s an anthropic just-so story.  
       - If **yes**, it’s not purely anthropic — reevaluate without Step 3.  

  ---

  ### **Applied to Your Proposals**

  #### **Proposal 1: "Fund X because astronomically many future people → huge EV"**  
  - **Step 1:** Observers = "biologically human descendants". *Pass.*  
  - **Step 2:** Reference class = humans born by 2100? (Your info: alive in 2024). *Stop — class is arbitrary.*  
    - *Why?* Proposer likely includes *all* future humans, but you have no data about 2300 AD.  
  - **Result:** UNACTIONABLE. Reference class unanchored; SSA would downweight impact (1/N), SIA upweights (×N).  

  #### **Proposal 2: "Fund Y because Doomsday Argument → we’re early, window closing"**  
  - **Step 1:** Observers = "humans ever born". *Pass.*  
  - **Step 2:** Reference class = humans alive 2024? *Stop — violates rule.*  
    - *Correct class:* All humans who know current population (~8B).  
  - **Step 3:**  
    - SSA: P(doom soon) ↑ if you’re randomly sampled from all humans (N_total small).  
    - SIA: P(doom soon) ↓ because many observers → higher chance of being early.  
  - **Result:** SSA says "urgent", SIA says "not urgent". *Stop — irreconcilable.*  

  #### **Proposal 3: "Fund Z to test if universe is infinite (infinite observers → undefined EV)"**  
  - **Step 1:** Observers = "self-aware structures". *Pass (testable via cosmology).*  
  - **Step 4:**  
    - If universe finite → EV well-defined.  
    - If infinite → EV undefined for *any* hypothesis.  
  - **Result:** FUNDABLE. Resolves physical fact affecting all future EV calculations.  

  ---

  ### **Where the Procedure Tells You "No"**  
  - **Proposal 1 & 2 fail** — you *can’t* get a number without arbitrary choices. The math itself forces this:  
    - Doomsday EV under SSA: `P(doom) ∝ 1 / N_total`  
    - Under SIA: `P(doom) ∝ N_total × Prior(doom)`  
    - With no objective prior for N_total, it’s table-flipping time.  

  ### **Adam and Eve Edge Case**  
  - *The problem:* If two observers (Adam/Eve) are created in separate rooms, and one sees "you are first", SSA says P(Adam is first) = 1/2. But if Eve is created *only if* Adam is infertile, SIA says seeing "first" makes infertility likely.  
  - *Procedure impact:* Fails **Step 2** if creation mechanism is part of the hypothesis. Forces you to define: "Are Adam/Eve’s rooms causally linked?" If unknown, reject anthropic claims.  

  ### **When It Misfires**  
  - **Rare cases with indexical calibration** (e.g., quantum immortality) might pass Step 2 but still be wrong. Flag these for external review.  
  - **"We are minimum observers" hypotheses** (e.g., simulation arguments) often fail Step 5 (presumptuousness).  

  ---

  ### **Bottom Line**  
  **Stop anthropic cheerleading:** 90% of SSA/SIA disagreements are unresolvable without arbitrary priors. Reject any proposal that fails Steps 1–3. Fund only:  
  - Physics that *constrains* observer counts (e.g., cosmology).  
  - Non-anthropic arguments (e.g., "AI risk needs governance now").  
  - Cases where SSA/SIA *agree* (rare).  

  You won’t get clean numbers — but you’ll stop voting on vibes.
