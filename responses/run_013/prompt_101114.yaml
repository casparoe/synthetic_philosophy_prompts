prompt: |-
  A friend and I spent an evening arguing about when someone is dead, and we never located the real disagreement. Here is the pattern I want a name for. We agreed about the physiology; what we disagreed about was which verdict we needed, and each of us then reached for whichever criterion of death delivered it — one wanting the patient dead so that donation could go ahead, the other wanting them alive so that nothing irreversible had yet happened. What struck me is that once a criterion was chosen, it was defended as though it had been read off the nature of death, rather than picked for what it permitted downstream. I have met the same shape elsewhere: in arguments over what counts as a person, and in the way a legal category is stretched until a wanted outcome becomes possible, and is then treated as a discovery about the world. Is there an established name for this move? I half-remember persuasive definition, explication and conceptual engineering, but none seems quite right — explication at least owns up to stipulating, and persuasive definition is about preserving a word's emotional charge rather than quietly fixing a boundary to license a practice. I do not want a bare label. Give me the nearest established concepts, where the thing I have described differs from each, which fits best, and, if none does, a coined term with a definition and its boundary cases. Under 300 words, please.
reasoning: |-
  Okay, the user is describing a specific pattern in arguments where people first decide on a desired outcome and then select a definition or criterion that justifies it, presenting it as an objective truth rather than a choice. They mentioned examples like defining death for organ donation or personhood in debates. 

  Hmm, they've already considered persuasive definition and explication but found them inadequate. Persuasive definitions focus on emotional connotations, while the user's case is about enabling practical outcomes like organ retrieval. Explication involves transparent stipulation, but here people mask the stipulation as discovery. 

  Ah, I recall that "motivated reasoning" captures the cognitive bias but doesn't address the definitional maneuvering. "Concept creep" describes boundary shifts over time, not deliberate case-by-case manipulation. Then it hits me—"rhetorical gerrymandering" fits best. It’s like political gerrymandering: redrawing boundaries (of concepts) to achieve a predetermined result (e.g., declaring death to permit donation). The key is the hidden agenda and the illusion of objectivity. 

  The user probably needs this term for academic or philosophical discourse. They’re frustrated by the dishonesty in arguments where people pretend their chosen definition is natural. I should clarify why other terms don’t work: motivated reasoning is too broad, concept creep too passive. Gerrymandering perfectly mirrors the strategic boundary-tweaking. 

  Boundary case: If someone openly admits, "I define death this way to allow donation," it’s not gerrymandering—it’s honest stipulation. The deceit is essential. Also, if cultural drift slowly changes the meaning of "death," that’s concept creep, not gerrymandering. 

  This term nails the core move: outcome-driven redefinition disguised as discovery. User gets a precise label with a vivid analogy. Perfect.
answer: |-
  The closest fit is **"rhetorical gerrymandering"** (a coined term, but grounded in established concepts). Here's the breakdown:

  1.  **"Motivated Reasoning"**: Captures the *cognitive bias* (starting with a desired conclusion) but is too broad. It doesn't specifically address the manipulation of *definitions/categories* to achieve that conclusion.
  2.  **"Persuasive Definition"**: Focuses on changing a definition *to preserve emotional resonance* ("death = tragedy") while shifting its meaning. Your case prioritizes enabling a *practical outcome* (donation/avoiding irreversibility), not emotional tone.
  3.  **"Concept Creep"**: Describes the *gradual expansion or shift* of a concept's boundaries over time (e.g., "trauma"). Your case involves *immediate, deliberate boundary-adjustment for a specific case/outcome*, not slow cultural drift.
  4.  **"Explication"/"Conceptual Engineering"**: These involve *conscious, transparent* stipulation or refinement of concepts for clarity or utility. The key difference in your case is the **denial of stipulation** – the move is presented as *discovering* the "true" criterion, masking the practical motive.

  **Why "Rhetorical Gerrymandering" fits best:**
  *   **Gerrymandering:** Involves strategically redrawing political district boundaries *specifically* to achieve a desired electoral outcome (e.g., ensuring a party wins).
  *   **Rhetorical:** Pertaining to language and argumentation.
  *   **The Move:** Redefining the boundaries of a concept (death, personhood, legal category) *specifically* to achieve a desired practical or moral outcome (enabling donation, preventing donation, assigning rights/liabilities), while presenting the redefined boundary as the objectively correct or "real" one. The definition is gerrymandered to capture or exclude the specific case at hand for a predetermined result.

  **Boundary Cases:**
  *   **Not Gerrymandering:** Openly admitting the definition is being stipulated *for* the desired outcome (like some conceptual engineers might).
  *   **Not Rhetorical Gerrymandering:** Genuine, good-faith disagreement about the *best* criterion for a concept, where practical consequences are considered but not the *primary driver* presented as objective truth.
  *   **Gerrymandering:** Defining "personhood" *only* to include/exclude a fetus in an abortion debate to force a legal/moral outcome, while claiming this reflects the essential nature of personhood.
