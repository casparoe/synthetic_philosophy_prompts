prompt: |-
  I'm a novelist — five books, all of them historical — and I teach a grad seminar on historical fiction that's half MFA students and half history PhDs, which makes for fun arguements. I'm writing the take-home final and I want one essay question on Braudel's longue durée, the idea that the real protagonists of history are geography, climate, soil, disease and the slow structures, while events and great men are just foam on the surface. I need a question my students can't answer by reciting the three tempos back at me (longue durée, conjuncture, event) — they all know that part cold. No citations or reading lists, by the way; I want them thinking, not quoting.

  The crux I want to force: a novel runs on agency, desire, a villain, a climax. If the causal weight really does sit with structures no character can move, what is plot even doing? I want them to pick a side and defend it, not split the difference.

  Give them this concrete case to work on (I've been chewing on it for my own book): a barrier island off the Ligurian coast, a fishing family, 1600 to now. The sea eats the island, the family rebuilds, drags the house inland, rebuilds again. Over four centuries nothing any character does changes the outcome. Is that a novel or a diorama?

  Write me the question, a model answer of about 600 words, and a marking scheme: five must-hit points, 20 marks total, with a one-line note for each on how students typically loose the marks. And at the very end, after the marking scheme, put one line beginning "Crux:" that names in a single phrase the one move an A answer makes that a B answer doesn't.
reasoning: |-
  Okay, the user is a novelist and professor who teaches a graduate seminar blending MFA and history PhD students. They need an essay question for their final exam that pushes students beyond simply regurgitating Braudel's three tempos (longue durée, conjuncture, event). The core tension they want to explore is between historical structures (which diminish individual agency) and the necessities of novelistic plot (which relies on agency, conflict, etc.). 

  They've provided a concrete case study: a Ligurian fishing family battling coastal erosion over 400 years where no individual actions change the outcome. The challenge is to frame this as a "novel or diorama" debate that forces students to pick a side. 

  Hmm, the professor clearly wants to provoke argument, not compromise. That "pick a side" directive is crucial. The marking scheme also needs to reward boldness over caution. 

  First, the question must trap students between Braudel and Aristotle. The phrasing should force them to either: 
  a) Defend plot's irrelevance if structures dominate, or 
  b) Justify plot as essential despite structural determinism. 

  The model answer should demonstrate option (b) since it's harder to argue well. Key moves: reframe "outcome" (island's fate ≠ human story), show how pressure reveals character, argue plot documents resistance as meaning. Must avoid dry theory—keep anchored to the fishing family example. 

  Marking scheme traps: 
  - Lazy Braudel summary (they'll lose marks for rehearsing tempos) 
  - False compromise ("both matter" without teeth) 
  - Ignoring the diorama challenge 
  - Forgetting novelistic tools (symbolism, etc.) 
  - Weak concrete ties to the case study 

  The "Crux" line is vital: A answers will redefine what "matter" means in historical fiction. B answers stay stuck on literal causality. 

  ...checking all boxes: 
  ☑ Question forces binary choice 
  ☑ Model answer picks side (plot essential) 
  ☑ 5 clear marking criteria with pitfalls 
  ☑ "Crux" isolates the conceptual leap
answer: |-
  ## Essay Question: The Stone and the Wave  
  **"Using the case study of a Ligurian fishing family rebuilding their home on a vanishing barrier island across four centuries, argue *for or against* the following proposition: If Braudel’s *longue durée* (geography, climate, erosion) holds ultimate causal weight, rendering individual agency irrelevant to the material outcome, then the project of writing a *novel* about this family is fundamentally compromised. It becomes merely a diorama illustrating inevitable decline, lacking true plot, conflict, or meaning derived from character action. Defend your chosen position vigorously. You may *not* split the difference; you must argue one side."**

  ---

  ## Model Answer (Arguing *FOR* the Novel, ~600 words)

  Braudel’s *longue durée* is undeniable: the Ligurian sea *will* consume the island; the family *will* rebuild, retreat, and rebuild again. No patriarch’s ingenuity, no matriarch’s resolve, no generation’s collective effort can halt the geologic and climatic forces dictating their material existence. However, to declare the novel form "fundamentally compromised" by this structural determinism fundamentally misunderstands what plot *is* and what meaning *means* within historical fiction. The novel doesn’t merely chronicle *outcomes*; it explores the *human experience within inevitability*. Here, plot isn’t about altering the island’s fate, but about illuminating the enduring human spirit *against* that fate.

  The true "outcome" Braudel identifies is the island's disappearance. But the novel’s subject is the family’s *persistence*. The relentless pressure of the *longue durée* doesn't erase agency; it *defines the crucible in which agency is tested and meaning is forged*. Plot arises precisely *because* characters act within immutable constraints. Does Giovanni, in 1720, rage against the retreating shore, dragging stones alone in a futile gesture, fracturing his marriage? Does Maria, in 1850, master the complex social negotiations to secure permission to relocate the chapel bell, becoming the village’s reluctant leader? Does Luca, in 1950, return from war to find the house half-swallowed, choosing not to rebuild *outward* but *upward*, inventing a new architecture? Their desires (security, legacy, community), their conflicts (with nature, each other, tradition), and their choices *in the face of predetermined loss* are the engine of plot. The "climax" isn't stopping the sea; it’s Maria winning the argument for the bell's move, or Luca convincing the family to build the tower, moments of human assertion against the uncaring backdrop.

  Furthermore, the *longue durée* provides the novel’s profound thematic depth. The cyclical rebuilding becomes a powerful symbol – not of futility, but of resilience, adaptation, and the definition of home. The plot *documents* how desire and agency are channeled *around* the immovable. Does the family’s relationship with the sea evolve from reverence to resentment? Does their definition of "home" shift from a fixed plot of land to the lineage itself? These are character-driven evolutions, explored through specific events (a storm, a marriage, a feud over the retreat path) made urgent by the ever-present structural pressure. The plot reveals *how* humans narrate their existence within forces they cannot control, finding dignity in defiance, meaning in maintenance, and identity in the very act of rebuilding.

  To call this a "diorama" assumes narrative requires altering material outcomes. A novel’s power lies in altering *understanding*. Plot is the mechanism for showing *how* the crushing weight of structure is lived, contested, endured, and imbued with cultural and personal significance. The Ligurian family’s story, precisely *because* their ultimate material struggle is unwinnable, becomes a profound exploration of what it means to be human within time’s vast, indifferent currents. The sea claims the land; the plot claims the meaning.

  ---

  ## Marking Scheme (20 Marks Total)

  1.  **Clear Position & Defense (5 marks):** Student unequivocally argues *for* OR *against* the proposition throughout. *Lose marks for:* Waffling, hedging, or attempting a "both sides" compromise.
  2.  **Engagement with Braudel's Challenge (4 marks):** Explicitly addresses the core tension: Can meaningful plot/agency exist if structural forces determine the *material outcome*? *Lose marks for:* Merely summarizing Braudel's tempos without applying the conflict to the novel form.
  3.  **Definition of Plot/Agency (4 marks):** Articulates a coherent view of what plot *is* and where agency/meaning reside *within* structural constraints, using the case study concretely. *Lose marks for:* Vague definitions, ignoring the case study specifics, or failing to redefine agency/meaning beyond changing the island's fate.
  4.  **Novelistic Tools & Meaning (4 marks):** Explains *how* novelistic techniques (character desire, conflict, climax, symbolism, thematic development) function *despite* structural determinism, using the case study. *Lose marks for:* Only stating plot exists without explaining *how* or *why* it matters in this context; ignoring the offered examples (desire, villain, climax).
  5.  **Case Study Integration (3 marks):** Effectively uses the Ligurian family scenario (rebuilding, retreat, persistence across centuries) as the foundation for arguments. *Lose marks for:* Generic arguments not grounded in the specific prompt; treating the case study as an afterthought.

  **Crux:** Redefining the locus of agency and meaning *from* altering material outcomes *to* expressing human resilience and identity within inevitability.
