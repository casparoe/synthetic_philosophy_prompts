  I believe she's running **Rule 1 (Non-Branching Psychological Continuity)**. Here's why:  
  - **Consistency with branching aversion**: Her strong verdicts against survival in fission (even split) and backup emphasize that **branching alone destroys identity**, regardless of the degree of continuity. In backup, she denies the copy is her despite its 100% psychological match, solely because branching occurs. Similarly, in fission, she rejects both halves even if they're symmetric and continuous. This suggests branching is the dealbreaker, not the magnitude of continuity.  
  - **No threshold implied**: None of her existing verdicts rely on a "degree" of continuity. For example:  
    - The 10-year coma involves full recovery (100% continuity), but if recovery were partial (e.g., 70% memory loss), Rule 2 might not call it survival. Yet she didn't mention thresholds—only continuity vs. branching.  
    - In slow replacement, she accepts survival despite physical changes, focusing on continuity without branching.  
  - **Parfit alignment?**: She's not Parfitian (he often dismisses identity in favor of survival via continuity), but Rule 1 mirrors the "non-branching" clause in neo-Lockean theories (e.g., David Lewis). Her insistence on uniqueness in backup/fission fits perfectly.  

  **Prediction for lopsided fission**: With Rule 1, branching occurs → **she says neither is her, and she doesn’t survive**.  

