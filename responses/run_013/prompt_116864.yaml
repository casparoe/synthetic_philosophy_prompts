  Based on your friend's track record and the patterns in her verdicts, I've identified two candidate rules that fit her judgments across all the cases you provided. Both rules are grounded in psychological continuity but differ in how they handle branching (i.e., multiple successors). Below, I'll outline the rules, explain how they fit the existing cases, predict her verdict for the lopsided fission case, and suggest which rule she's likely using. Finally, I'll propose a clean test case to distinguish between the rules.

  ---

  ### **Candidate Rules**
  Both rules prioritize psychological continuity (the preservation of memories, personality, and mental states) but incorporate constraints to handle duplication. They assume the original is destroyed in fission/teleporter cases but preserved in others (e.g., backup).

  #### **Rule 1: Non-Branching Psychological Continuity (Unique Successor Required)**
  - **Core Principle**: Survival requires uninterrupted psychological continuity with **exactly one** successor. If branching occurs (multiple psychologically continuous entities), identity is lost. The original survives if it persists without branching, even if copies exist.
  - **Fits all cases**:
    - **Teleporter/Whole-brain transplant/Slow replacement/Coma**: No branching (one successor), so survival.  
    - **Backup**: Branching (original and copy both exist). Original survives because it persists; copy is not her.  
    - **Fission (even split)**: Branching (two successors), so neither is her; she doesn’t survive.  
  - **Prediction for lopsided fission (80/20 split)**: Branching occurs (two successors), so **neither is her**. She does not survive, regardless of the 80% vs. 20% asymmetry.  

  #### **Rule 2: Threshold-Based Psychological Continuity (Sufficiency + Non-Branching)**
  - **Core Principle**: Survival requires:  
    - (A) Psychological connectedness **above a threshold** (e.g., enough mental traits preserved to be "sufficiently her"), and  
    - (B) **No other claimant above that threshold** (non-branching for qualifying successors).  
    If the original persists, it always survives; copies are distinct.  
  - **Fits all cases**:  
    - **Teleporter/Whole-brain transplant/Slow replacement/Coma**: Connectedness is ~100% (above threshold), no branching, so survival.  
    - **Backup**: Copy has 100% connectedness to her 30-year-old self, but branching occurs (original exists). Original survives; copy is not her.  
    - **Fission (even split)**: Assuming both halves are above threshold (e.g., 50% each), branching occurs, so **neither is her**.  
  - **Prediction for lopsided fission (80/20 split)**:  
    - If the 20% successor is **below the threshold** (e.g., too "foggy" to qualify), the 80% successor is the only claimant above threshold → **she survives as the 80% successor**.  
    - If **both are above threshold**, branching occurs → **neither is her**.  
    - *Your description*: The 20% successor is "foggier and less sharp" but "definitely continuous." If her threshold is high (e.g., >50%), the 20% successor might be below it → survival as the 80% successor. If her threshold is low (e.g., any continuity), both are above it → no survival.  

  ---

