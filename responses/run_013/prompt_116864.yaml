  To cleanly separate Rule 1 from Rule 2, use a fission case where **only one successor qualifies above threshold**, and the other is unambiguously below it. This eliminates ambiguity about the 80/20 split's "fogginess."  

  - **Case**: **Fission with asymmetric impairment**  
