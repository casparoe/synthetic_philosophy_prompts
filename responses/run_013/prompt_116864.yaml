  - **Key insight**: Rule 1 cares only about the *existence* of multiple successors, while Rule 2 cares about *qualified* successors. If she says she survives as Body A, she’s using Rule 2 (threshold-based). If she says she doesn’t survive, she’s using Rule 1.  

  ---

  ### **Summary**
  - **Rule 1 (Non-Branching)**: Predicts no survival in lopsided fission (branching is fatal).  
  - **Rule 2 (Threshold-Based)**: Predicts survival in lopsided fission if the 20% successor is below threshold.  
  - **Her likely rule**: **Rule 1**, based on her branching aversion in backup/fission cases.  
  - **Best test case**: **Asymmetric impairment fission** (60% functional vs. 40% vegetative), where Rule 1 and Rule 2 diverge sharply.  

