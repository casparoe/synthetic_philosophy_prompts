  I'll ensure each question uses concrete scenarios: "Does the pleasantness feel like a distinct sensation?" or "Is pleasantness about how it feels or what it makes you do?" This makes it practical for their group. I'll also include positions the user mentioned like imperativism ("more of this" commands).

  In the assessment notes, I'll clarify that the first split (common feeling) is widely contested, while later distinctions like phenomenal/normative are active debates. I'll note that free-floating attitudinalism might be less common and that functionalism often overlaps with other views. This honesty about contested areas will help their discussion stay grounded.
answer: |-
  Here’s a one-page decision tree focused on the **location of commonality** in pleasure, using concrete cases. Start all participants here:

  > **Starting Point:** *"The taste of coffee and the relief of peeing feel nothing alike, yet both are pleasures. What makes them both pleasures?"*

  ---

  ### Decision Tree: What Unifies Pleasures?

  **1. Does the pleasantness of coffee, peeing, a warm bath, or winning an argument feel like it has a *distinctive shared quality* across all?**  
     - **YES** → Go to **2**  
     - **NO** → Go to **5**  

  **2. Is this shared quality like a *separate sensation* added to the experience (e.g., a "tingle" or "glow")?**  
     - **YES** → **Hedonic-Tone Monism** (e.g., Sidgwick): Pleasure is a unique sensation present in all pleasant experiences. *Problem for warm baths? They feel homogeneous, not layered.*  
     - **NO** → Go to **3**  

  **3. Is the pleasantness a *way it feels* (phenomenal) or a *command/urge* (normative)?**  
     - **FEEL** → **Phenomenal Property View**: Pleasantness is a unitary "gloss" or mode modifying any sensation (e.g., tasting coffee *pleasantly* vs. tasting it sour).  
     - **URGE** → **Imperativism** (e.g., Klein): Pleasantness is a felt "more of this!" command. Scratching an itch *orders* continuation; peeing relief signals "mission accomplished."  

  **4. (From NO at 1) Is the unity in *how you relate* to the experience?**  
     - **YES** → Go to **6**  
     - **NO** → Go to **8**  

  **5. (From NO at 1) Is the unity in *what it makes you do*?**  
     - **YES** → **Desire/Functional-Role View** (Dan's view): Pleasures are states you’re disposed to sustain/seek (e.g., you sip more coffee, avoid interrupting pee breaks).  
     - **NO** → Go to **7**  

  **6. Is this attitude *about something specific*?**  
     - **YES** → **Object-Directed Attitudinalism** (e.g., Feldman): Pleasure is *taking joy in* an object (e.g., delight *in* the coffee’s taste). *Problem: A calm warm bath lacks a clear "object."*  
     - **NO** → **Free-Floating Attitudinalism**: Pleasure is a non-object-focused pro-attitude (e.g., a buoyant mood during a warm bath).  

  **7. (From NO at 5) Is there *no unity at all*?**  
     - **YES** → Go to **9**  
     - **NO** → **Primitivism**: Pleasantness is basic and indefinable but unitary ("you just know").  

  **8. (From NO at 4) Can pleasantness be *reduced to something non-mental*?**  
     - *Path empty*: Most agree pleasure is mental. Skip to **7**.  

  **9. Do pleasures form a *family resemblance* network?**  
     - **YES** → **Family Resemblance Pluralism** (e.g., Wittgensteinian): Coffee’s taste (sensory) and winning (achievement) link via overlapping features (e.g., "satisfaction," "absence of pain"), but no single thread.  
     - **NO** → **Eliminativism/Nominalism**: "Pleasure" labels disjoint states; hedonism is confused.  

  ---

  ### Leaves (Named Positions):
  1. **Hedonic-Tone Monism**  
  2. **Phenomenal Property View**  
  3. **Imperativism**  
  4. **Object-Directed Attitudinalism**  
  5. **Free-Floating Attitudinalism**  
  6. **Desire/Functional-Role View**  
  7. **Primitivism**  
  8. **Family Resemblance Pluralism**  
  9. **Eliminativism/Nominalism**  

  ---

  ### Assessment Notes (Where the Splits Stand):
  - **Contested Splits**:  
    - **Node 1 (Shared Quality?)** is the core divide. *Imperativists* and *Phenomenal Property* theorists both say YES but clash at Node 3.  
    - **Node 3 (Feel vs. Urge)** is live: Imperativism is trendy but debated.  
    - **Node 5 (Functional Role?)** vs. **Node 4 (Attitude?)** splits desire-based from attitude-based anti-feel views.  
    - **Node 9 (Family Resemblance?)** is where pluralists diverge from eliminativists.  

  - **Common Ground / Less Contested**:  
    - **Node 2 (Sensation?)** is widely rejected (e.g., warm baths lack "tingles").  
    - **Node 8** is empty; pleasure is treated as mental.  
    - **Primitivism (Node 7)** is rare but coherent.  

  - **Underpopulated/Thin Branches**:  
    - **Free-Floating Attitudinalism** is plausible but less defended than object-directed versions.  
    - **Functional-Role View** often collapses into Imperativism (if the "disposition" is felt) or Attitudinalism (if it’s a judgment).  

  - **Collapsed Distinction**:  
    - **Phenomenal Property View** vs. **Free-Floating Attitudinalism** can blur (e.g., is a "gloss" just an attitude?). The tree separates them via Node 1 (YES/NO), but they may answer cases similarly.  

  **Key Takeaway**: The tree isolates Dan’s view (Functional-Role) and your intuition (shared quality → Property/Imperative). Pluralism (Node 9) avoids commitment to unity but risks making hedonism "trivial," as Dan claimed.  

  ---  
  Print this, and have your group walk through cases (e.g., *"Is scratching an itch pleasant because of how it feels or because you need to keep doing it?"*). The splits force clarity on *where* the "pleasure" label sticks.
