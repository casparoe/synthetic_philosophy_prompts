  Important considerations: phrases must be accessible for a reading group discussion. If a path leads nowhere, I'll note why (incoherent, unattractive, or unexplored). If two positions collapse into the same answers, I'll flag that. Finally, I'll add notes on which splits represent genuine debates versus common ground.

