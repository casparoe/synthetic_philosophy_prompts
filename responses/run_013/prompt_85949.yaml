answer: |-
  ### Essay Question  
  **(90 minutes)**  

  **Scenario:**  
  *Desert Springs*, an artificial aquifer system, was built 50 years ago to divert groundwater to a remote desert community, preventing its natural flow toward a fragile ecosystem. The system requires constant maintenance: solar pumps must run continuously to push water toward the community, and filters must be cleaned monthly to prevent contamination. Without this intervention, water would follow its original path, sustaining an endangered species of desert fish. The community now depends entirely on this water. Due to climate pressures, resources are scarce.  

  **Options:**  
  1. **Actively Shut Down** the pumps (causing immediate community dehydration).  
  2. **Neglect Maintenance**, allowing filters to clog and pumps to fail within days (causing identical dehydration).  

  **Question:**  
  Using this scenario, analyze the distinction between *doing* and *allowing* harm. Your answer must:  
  (a) Define what this distinction aims to demarcate,  
  (b) Explain whether drawing it relies on a prior notion of the "natural" or "baseline" course of events,  
  (c) Assess if the distinction survives when such baselines are products of earlier human interventions (e.g., the aquifer’s creation),  
  (d) Argue whether the distinction retains independent *moral significance* under these conditions, or merely labels conclusions derived from baseline assumptions.  

  ---

  ### Model Answer (620 words)  

  **(a) The doing/allowing distinction** purports to differentiate between actively *causing* harm (e.g., initiating a lethal sequence) and passively *permitting* harm (e.g., refusing to interrupt a preexisting threat). In Desert Springs, shutting down the pump (*doing*) seems like directly imposing harm, while neglecting maintenance (*allowing*) appears to be withholding aid. The distinction hinges on agency: whether the agent *introduces* new energy toward harm or *fails to block* harm from other sources.  

  **(b) Reliance on baselines is inescapable.** To classify an act as "allowing" harm presupposes a default trajectory against which *inaction* is measured. Here, the "baseline" is ambiguous. If we take the *pre-intervention state* (water flowing to fish) as natural, then both options "allow" a return to normalcy. If we take the *current human dependency* (water flowing to community) as the status quo, shutting down the pump "does" harm, while neglecting maintenance "allows" harm. Crucially, neither baseline is truly "natural": the original ecosystem evolved without human interference, but the community’s dependence resulted from deliberate engineering. The distinction thus collapses without a prior (and contestable) designation of which state counts as the morally neutral default.  

  **(c) The distinction fails when baselines are human-made.** Desert Springs reveals that the "preintervention state" is itself an artifact: the aquifer’s diversion *created* the community’s vulnerability. Before the pumps, dehydration was not a threat; after 50 years of operation, dehydration results from *discontinuing human-sustained processes*. Both shutting down the pump and neglecting maintenance are *omissions of upkeep* for an artificial system. If "allowing" harm requires a baseline *untainted* by prior agency, this case has none. The fish’s habitat was altered by the aquifer; the community’s survival was manufactured by the pumps. When both outcomes stem from terminating the same anthropogenic process, the doing/allowing dichotomy becomes incoherent—both acts are morally homologous withdrawals of sustaining intervention.  

  **(d) The distinction lacks independent moral work.** Once baseline relativity is exposed, the doing/allowing distinction merely *restates* prior moral judgments about which baseline matters. For instance:  
  - If preserving ecosystems is paramount, reverting to the pre-aquifer state is "allowing" nature’s course; both options are permissible.  
  - If human reliance creates obligations, disrupting the pumps (*doing*) may seem worse than neglect (*allowing*), but only because we privilege the community’s engineered status quo.  

  The distinction does not *explain* why one act feels more active; it *reflects* intuitions grounded in baseline commitments. In Desert Springs, the physical acts (flipping a switch vs. ignoring a warning light) are trivial compared to the moral weight assigned to the baselines. If "allowing" is just "not prolonging an artificial state," it carries no inherent permissibility—else neglecting the community would be blameless, which ignores their vested needs. Conversely, if "doing" is just "withdrawing essential support," it conflates with allowing. The distinction thus becomes epiphenomenal: a proxy for debates about responsibility for constructed dependencies, not a freestanding criterion.  

  **Conclusion:** Desert Springs shows that the doing/allowing distinction is parasitic on unresolved disagreements about *which human-shaped trajectory deserves protection*. Without a "natural" reference point, the distinction cannot bear moral weight independently; it merely codifies which baseline we tacitly endorse.  

  ---  

  ### Marking Scheme (Total: 20)  

  | **Points**                          | **Marks** | **Characteristic Error**                          |  
  |-------------------------------------|-----------|---------------------------------------------------|  
  | **1. Clear definition of doing/allowing** | 4         | Vague or circular definition (e.g., "doing is worse"). |  
  | **2. Baseline dependence explained**    | 4         | Ignores how baselines determine classification.       |  
  | **3. Critique of human-shaped baselines** | 4         | Treats pre-intervention state as "natural" by default.|  
  | **4. Moral independence assessed**      | 4         | Assumes distinction is intrinsically significant.     |  
  | **5. Scenario integration**             | 4         | Generic discussion ignoring pump/maintenance duality.|  

  **A (17–20) vs. B (13–16) Distinction:**  
  - **A**: Synthesizes points 3–5 to argue the distinction *dissolves* under baseline scrutiny, using the scenario to show structural equivalence.  
  - **B**: Recognizes baseline problems but treats the distinction as *weakened yet persistent*, or focuses on acts’ immediacy (e.g., "shutting down is more direct").
