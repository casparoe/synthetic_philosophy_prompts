  6. Provide a diagnostic checklist for self-assessment and a concise explanation for skeptics.

  The user's framing mistake is the intentional/non-intentional dichotomy. I'll replace it with the concept of "motivated irrationality" where intention is partial or obscured. The price: it blurs folk psychology boundaries but better matches psychological reality.

