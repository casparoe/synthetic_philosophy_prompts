  2. Offer a deflationary account (e.g., intention without full awareness, motivated cognition). 
  3. Differentiate from related concepts: 
     - Ordinary error: lacks motivation. 
     - Deliberate pretense: conscious intention. 
     - Wishful thinking: may lack avoidance. 
     - Weakness of will: conflict between belief and action, not belief formation. 
  4. Address degrees: Self-deception varies in depth; their cases are mild/moderate examples. 
