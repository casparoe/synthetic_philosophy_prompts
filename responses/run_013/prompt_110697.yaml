  The user wants to emphasize that the assembly's authority comes from its random selection process, not from any inherent wisdom of the participants. They need to avoid romanticizing the "wisdom of the people" because the council members would see through that. Also, they must explain that a lottery is only valid for questions with objective answers, not just preference decisions. Plus, the practical context: the assembly's recommendation will be on the ballot next to the council's version, word-for-word. The speech has to be under five minutes with short sentences for nervous delivery.

