prompt: |-
  I am a software engineer with no formal training in philosophy, and before I read any more proposed solutions to the problem of consequentialist cluelessness, I want the specification rather than the solutions. Give me the list of requirements that any theory of how a consequentialist should act under cluelessness would have to meet in order to count as adequate, with the case or consideration behind each requirement, and with your judgment about which of the requirements are non-negotiable and which are preferences of a particular camp. I do not want names, dates, or a reading list; I cannot check attributions and I am not looking for a survey.

  Fix the purpose as follows, since adequacy is relative to a purpose: I want a theory usable by an agent who has to commit to an action now, with bounded time and attention, who wants to keep the distinctively consequentialist commitment that only consequences count, and who wants neither to be paralyzed by the thought of untraceable effects nor to be credulous about effects that nobody could have traced. If you think that brief is incoherent, say so in a sentence or two and then work with it anyway.

  The requirements I have managed to formulate on my own are below. Sharpen them, correct them, or discard them if they are not genuine requirements, but treat them as the starting point rather than ignoring them.

  1. Locate the cluelessness. The theory should say whether the trouble lies in our information about an act's causal upshots, in the value attached to those upshots, in how the act itself is individuated, or in the summation of effects over an unbounded future, because the remedy differs in each case. A theory that treats these as one problem will often prescribe gathering more information when the quantity being estimated is not well defined in the first place.

  2. Distinguish grades of failure. Failing to rank two options, ranking them without any justified confidence, and ranking them in a way whose sign flips under a different description are three different failures, and a theory that runs them together will either overreact or underreact. In my own work the analogous distinctions are: the check does not run, the check passes and I do not believe it, and the result changes when the units change. I want the requirements stated so that these stay apart.

  3. Survive re-description. One purchase of a coffee, one movement of a hand, and one further increment of participation in a global supply chain should not receive incompatible verdicts, or else the theory must say which description is canonical and why. A procedure whose output depends on which description it is handed is not a decision procedure.

  4. Be neither dominated by the unestimable nor blind to it. If an arbitrarily unlikely, arbitrarily large effect can move the theory to any conclusion, it cannot guide action; if it ignores such effects by construction, it has given up on consequences. The same tension appears at the other end, with a certain small effect weighed against an unestimated large one.

  5. Say what happens over an unbounded future. Either there is a principled stopping rule, or there is an argument that none is needed, or the instruction to maximize expected value is not well formed because the relevant sum diverges or is undefined.

  6. Separate the theory's cluelessness from mine. The interesting claim is that the ranking itself is unsettled, not that I cannot compute it, so the requirements should be stated about the theory's verdicts rather than about my epistemic state; otherwise the theory is being blamed for my limits.

  7. Be runnable by a bounded agent. A criterion satisfiable only by an ideal agent with unlimited time is not a standard for me, and a theory that tells me to act only when the verdict is determinate has handed the real work to a meta-procedure it has not supplied.

  8. Keep the critical bite. A theory that dissolves cluelessness by declaring the options roughly equal, or by deferring to ordinary moral opinion, has stopped being a consequentialist theory; I want the requirement that forces it to rule some actions out and say why.

  9. Fix the unit of evaluation. I cannot estimate the consequences of one coffee purchase, but I might estimate the consequences of a standing policy of buying coffee, or of a disposition to do so; the theory must say whether moving to policies, rules, or dispositions answers the problem or changes the subject.

  10. Cope with being one of the things being evaluated. What I choose changes what future agents count as a consequence and how much weight they give it, as when I decide what to teach a junior colleague or release a library that many people will build on. The evaluation must not be ill-founded when its own future operation is among the effects.

  Finally, tell me which single requirement does the most to exclude candidate theories, taking the plain expected-value maximizer, the indirect or rule-based consequentialist, and the view that says only that one should do as well as one can given one's evidence as the candidates to beat. And tell me whether any two or more of the requirements cannot be satisfied together. If the specification turns out to be jointly unsatisfiable, that is the result I most want, so do not dissolve the tension by quietly weakening a requirement.
reasoning: |-
  Okay, let me approach this systematically. The user is a software engineer seeking a rigorous specification for evaluating consequentialist theories under cluelessness, with ten self-proposed requirements. Their core need is architectural clarity: they want philosophical requirements modeled after engineering specs, stripped of academic baggage.

  First, I need to map their ten points to canonical philosophical problems. Requirement 1 touches on the ontology of cluelessness - is it epistemic, metaphysical, or valuative? Requirement 2 parallels error type distinctions in systems design (failure modes vs. tolerance thresholds). Requirement 3 is clearly about reference class problems, reminiscent of namespace collisions in programming. 

  The tension in Requirement 4 is mathematically fundamental - it's asking for Borel measurability in value functions while avoiding the St. Petersburg paradox. For Requirement 5's unbounded future, I recall that even causal decision theory struggles with undefined infinite sums. Requirement 6's distinction between objective indeterminacy and subjective uncertainty mirrors the halting problem's undecidability versus computational complexity.

  I notice Requirement 10 introduces a recursive evaluation problem - it's like a function that must optimize its own future optimization procedures. That might be the most constraining requirement computationally. The user's rejection of "dissolving tensions" suggests they want a Gödelian incompleteness result if unavoidable.

  Among their candidate theories: naive expected value maximization fails Requirements 4 and 5 catastrophically; rule-consequentialism stumbles on Requirements 3 and 9; satisficing violates Requirement 8. The re-description problem (Requirement 3) alone eliminates most indirect approaches.

  The key insight forming is that Requirement 4 and 5 together create a vicious circle: bounded evaluation (5) requires ignoring tail risks, but Requirement 4 forbids ignoring them. This resembles the halting problem's unsolvability - you can't predefine which infinite chains matter. Requirement 10 compounds this by making the evaluation metric itself part of the causal chain.

  I'll structure the response by hardening each requirement with philosophical equivalents of preconditions and invariants, then demonstrate the contradictions through a diagonalization argument: any candidate theory will violate at least one core requirement. The user's engineering background means they'll appreciate seeing the breakdown occur at Requirement 4 and 5's intersection.
answer: |-
  Here is a specification refined from your requirements, structured for clarity, non-negotiability assessment, and tension analysis. The purpose ("usable bounded agent keeping core consequentialism, avoiding paralysis/credulity") is treated as coherent but demanding.

  ---

  ### **Core Requirements for an Adequate Theory of Consequentialist Action Under Cluelessness**

  1.  **Specify the Locus of Cluelessness**  
      *   **Requirement:** The theory must explicitly identify whether the primary obstacle is (a) causal indeterminacy (unknowable/undefined causal chains), (b) value indeterminacy (unknowable/undefined value assignments to outcomes), (c) act-individuation ambiguity, or (d) non-convergence of value summation across time/space. It must justify why this locus is fundamental.
      *   **Case:** Remedies differ radically. Gathering more data solves epistemic uncertainty but not metaphysical indeterminacy or summation divergence. Treating them as one problem yields misguided prescriptions.
      *   **Non-Negotiable:** Yes. A theory misdiagnosing the core problem cannot address it adequately.

  2.  **Discriminate Failure Modes**  
      *   **Requirement:** The theory must distinguish between: (a) *Incomparability* (no justified ranking possible), (b) *Uncertainty* (ranking exists but confidence is low/undefined), and (c) *Instability* (ranking changes significantly under minor redescription/value perturbations).
      *   **Case:** Responses must differ. Incomparability might demand satisficing or rules; Uncertainty demands better evidence/estimation; Instability demands robustness checks or meta-rules. Conflating them leads to over/under-reaction.
      *   **Non-Negotiable:** Yes. Failure modes demand distinct normative responses.

  3.  **Description-Invariance**  
      *   **Requirement:** Evaluative verdicts must be invariant under causally/morally equivalent redescriptions of the *same act* (e.g., "buying this coffee," "triggering this supply-chain event," "moving my hand thus"). If redescriptions yield different verdicts, the theory must provide a canonical description procedure.
      *   **Case:** Without invariance, the theory is not a decision procedure – its output is arbitrary based on input phrasing.
      *   **Non-Negotiable:** Yes. A theory violating this is practically unusable and logically inconsistent.

  4.  **Handle Extreme Tails Rigorously**  
      *   **Requirement:** The theory must neither be *dominated* by arbitrarily low-probability, arbitrarily high-impact possibilities (making action guidance impossible) nor *ignore* them by fiat (abandoning consequentialism). This applies symmetrically to long-term, diffuse, or chaotic effects.
      *   **Case:** Ignoring tails is empirically and morally reckless; being dominated by them paralyzes action. The theory must have a *principled* approach (e.g., discounting, normalization, focus on robustly positive effects).
      *   **Non-Negotiable:** Yes. This is the core tension of cluelessness. A theory must navigate it, not avoid it.

  5.  **Address Unbounded Summation**  
      *   **Requirement:** The theory must explicitly resolve how to evaluate consequences over indefinite (potentially infinite) time horizons. It must either: (a) Provide a *principled stopping rule* (e.g., discounting, fading affect), (b) Argue that *summation converges* or is *well-defined* despite appearances, or (c) Explain why *maximization is coherent* even if summation diverges/is undefined.
      *   **Case:** The core consequentialist directive ("maximize expected value") is ill-formed if the sum of future effects is infinite, undefined, or radically unstable.
      *   **Non-Negotiable:** Yes. Ignoring this renders the core maximand meaningless.

  6.  **Distinguish Ontic from Epistemic Failure**  
      *   **Requirement:** The theory must attribute cluelessness to the *objective indeterminacy/unsettledness of the consequentialist ranking itself* under clueless conditions, not merely to the *agent's limited computational power or information access*.
      *   **Case:** If the problem is *only* epistemic (I lack info/time), the solution is better estimation tools. The "cluelessness" claim is that better tools *cannot* resolve it – the ranking is objectively unsettled.
      *   **Non-Negotiable:** Yes. This defines the *philosophical* problem vs. a practical one.

  7.  **Bounded Feasibility**  
      *   **Requirement:** The theory must be practically applicable by a real agent with finite time, attention, and cognitive resources. It must provide concrete, finite decision procedures or heuristics usable *now*. It cannot merely describe an ideal standard.
      *   **Case:** A theory requiring omniscience or infinite computation is irrelevant for action guidance. It must tell the agent *how to decide* under boundedness.
      *   **Non-Negotiable:** Yes (given your purpose). A theory failing this is unusable.

  8.  **Preserve Consequentialist Critical Bite**  
      *   **Requirement:** The theory must retain the power to *condemn* actions/policies as wrong based on foreseeable negative consequences or structural features leading to bad outcomes, even under pervasive cluelessness. It cannot dissolve into universal permissibility or deference to non-consequentialist intuitions.
      *   **Case:** Without critical bite, consequentialism loses its normative force and distinctiveness. It must still rule *some* things out based on consequences.
      *   **Non-Negotiable:** Yes. This maintains the theory's identity as consequentialist.

  9.  **Define the Evaluative Unit Coherently**  
      *   **Requirement:** The theory must explicitly state the unit of agency being evaluated (e.g., individual act, policy, rule, disposition, character trait) and justify *why* this unit is appropriate for addressing cluelessness. Shifting units must be defended as a solution, not evasion.
      *   **Case:** Shifting units (e.g., to rules) often changes the subject. The theory must show how evaluating rules genuinely answers the problem *for the consequentialist agent choosing an act now*.
      *   **Non-Negotiable:** Contextual. A theory *can* successfully shift units (e.g., to policies), but must argue why this solves the cluelessness problem *for the acting agent* without abandoning act-consequentialism's core concern.

  10. **Account for Reflexivity**  
      *   **Requirement:** The theory must accommodate that the agent's choice can alter the criteria, values, or capacities of *future evaluators* (e.g., teaching norms, releasing influential tools, shaping institutions). Evaluation cannot treat the future evaluative framework as fixed and exogenous.
      *   **Case:** Choices now affect how consequences *will be defined and valued* later. Ignoring this makes the evaluation incomplete and potentially self-undermining.
      *   **Non-Negotiable:** Yes. This is a fundamental feature of long-term consequences in a world of learning agents.

  ---

  ### **Analysis Against Candidate Theories & Requirement Conflicts**

  *   **Most Excluding Requirement:** **#4 (Handle Extreme Tails Rigorously)**.
      *   **Why:** Naive Expected Value (EV) maximization is paralyzed by Pascalian nightmares or ignores tails arbitrarily. Rule-Consequentialism often ignores tails by focusing on "normal" cases. "Do as well as given evidence" lacks the principled mechanism to handle tails rigorously without collapsing into naive EV or arbitrary truncation. Requirement #4 forces a theory to confront the core paradox head-on.

  *   **Key Tensions/Conflicts:**
      1.  **#4 (Handle Tails) vs. #5 (Unbounded Summation) vs. #7 (Bounded Feasibility):** Principled handling of extreme tails (#4) and infinite futures (#5) is computationally intractable (#7). Any rigorous solution to #4/#5 likely violates #7. Any bound imposed for #7 risks arbitrariness violating #4/#5. *This is the central tension.*
      2.  **#3 (Description-Invariance) vs. #9 (Evaluative Unit):** Defining a canonical description (#3) often depends on choosing the "right" unit of agency (#9). Justifying *why* a policy description is canonical over an act description is challenging without seeming arbitrary or changing the subject.
      3.  **#6 (Ontic Failure) vs. #7 (Bounded Feasibility):** If the ranking is *objectively* unsettled (#6), how can a feasible procedure (#7) produce a justified verdict? The procedure might yield an answer, but its justification might be pragmatic, not truly consequentialist, threatening #8 (Critical Bite).
      4.  **#8 (Critical Bite) vs. Pervasive Cluelessness:** Preserving strong condemnations (#8) seems difficult if *most* long-term consequences are radically uncertain (#1, #4, #5, #6). Condemnation might only be possible for very specific, short-term, high-certainty harms, significantly narrowing consequentialism's scope.
      5.  **#10 (Reflexivity) vs. #5 (Unbounded Summation) vs. #4 (Tails):** Accounting for how actions change future evaluation (#10) makes long-term summation (#5) and tail assessment (#4) even more complex and indeterminate, as the evaluation metric itself becomes part of the uncertain causal chain.

  ---

  ### **Conclusion on Satisfiability**

  The specification is **extremely demanding and likely jointly unsatisfiable** for a *pure, direct act-consequentialist theory* aiming to maximize expected total value. The core tensions (#4, #5, #7, #6) are severe:

  1.  Rigorously incorporating all potential consequences (including extreme tails and infinite futures) is incompatible with feasible decision procedures for bounded agents.
  2.  If the ranking is objectively indeterminate under cluelessness (#6), no feasible procedure (#7) can generate a uniquely correct, consequentialist justification for an act *based solely on consequences* without smuggling in non-consequentialist elements (threatening #8).

  **What this implies:** A theory meeting all requirements likely necessitates significant departures from naive act-consequentialism. It might:
  *   **Shift the Evaluative Unit (#9):** e.g., Robustly promote near-term, predictable, "fragile" goods; focus on avoiding clear catastrophe; adopt rules/policies resilient across plausible futures.
  *   **Introduce Non-Standard Decision Theory:** e.g., Maximin over possible value theories; focus on stochastic dominance; satisficing with high aspirations.
  *   **Accept Bounded Justification:** Provide a feasible procedure justified *pragmatically* as the best available consequentialist approach under boundedness/cluelessness, acknowledging its limitations w.r.t. the ideal (#6).
  *   **Formalize "Significance" Thresholds:** Define (contentiously) what magnitudes/probabilities of effects "count" for decision-making (#4, #5).

  **The requirements force the theory to confront the impossibility of pure, unbounded, direct consequentialist maximization under cluelessness and boundedness, demanding a sophisticated, perhaps hybrid, solution that retains core consequentialist commitments (#8) while making essential compromises (#4, #5, #7).** The specification doesn't dissolve the tension; it exposes its depth and forces any solution to be transparent about its compromises.
