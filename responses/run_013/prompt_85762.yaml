answer: |-
  ### Nearest Misses  
  *Cheap Talk* (economics): Captures costless signaling but ignores the *structural uncheckability* of counterfactuals. Cheap talk can be falsified (e.g., "I’ll donate" vs. actual donation); counterfactuals ("I would have donated") cannot.  
  *Dispositional Properties* (philosophy): Defines traits via hypothetical actions (e.g., "brave" means "would face danger"). But this concerns truth conditions, not the *rhetorical exploitation* of uncheckability to claim credit.  
  *Moral Luck* (ethics): Asks whether outcomes affect blame. Yet it focuses on responsibility attribution, not the *strategic use of grammar* to imply virtue sans evidence.  
  *Virtue Signaling*: Overlaps in performativity but includes verifiable acts (e.g., public donations). Counterfactual credit claims evade action entirely.  

  **Verdict**  
  No established name exists. This is a distinct rhetorical phenomenon: **Counterfactual Credit Claiming (CCC)**. It weaponizes grammatical mood to imply moral character while evading accountability. The pattern you describe survives scrutiny—it exploits the psychology of counterfactuals, not linguistic technicalities.  

  ### The Thing Itself: Counterfactual Credit Claiming  
  CCC is a speech act where a speaker uses **unreal conditional grammar** ("If P had been true, I would have done Q") to assert moral competence, integrity, or foresight, despite having no relevant empirical record. Its power derives from three mechanisms:  

  1. **Unfalsifiable Self-Portraiture**: By anchoring the claim to an alternate past/future ("if I’d known," "if I’d been president"), all testable elements vanish. The listener is steered to evaluate the *speaker’s purported character* (e.g., "I’d have ended the war") rather than their actual history. Unlike hedging ("I might act"), CCC feigns certainty; unlike lying, it avoids factual claims.  
  2. **The Grandiosity Paradox**: Larger claims ("if I were president...") amplify perceived conviction. Humans equate scale with sincerity when stakes are abstract (e.g., intervening in a war vs. a meeting). Uncheckability here functions as a permission structure for audacity—impossible scenarios license stronger assertions because failure is inconceivable.  
  3. **Moral Alchemy**: CCC converts inaction into latent virtue. "I would never have stood for that" implies a dispositional resistance, despite zero behavioral proof. It borrows from virtue ethics ("character = potential acts") while discarding its demand for real-world consistency.  

  CCC is **not**:  
  - *Hedging* (which expresses doubt; CCC feigns resolve).  
  - *Lying* (which distorts facts; CCC avoids them).  
  - *Virtue signaling* (which performs real actions; CCC substitutes hypotheticals).  
  - *Genuine dispositional claims* (e.g., "I’d help if asked" from someone with a history of helping).  

  It thrives in low-trust, high-stakes contexts (corporate apologies, political grandstanding) where the cost of exposure outweighs the risk of emptiness.  

  ### Edges: Borderlands and Blurred Lines  
  The line between CCC and legitimate character assertions hinges on **evidence of disposition**. "If I’d known, I’d have acted" is likely CCC *unless* the speaker has a record of similar interventions. Conversely, someone consistently whistleblowing might credibly say, "I’d have exposed this," but it risks slipping into CCC if detached from their specific history.  

  **Ambiguous Cases**:  
  - *Near interventions*: "I almost quit over this." If verifiable (e.g., resignation drafts), it’s evidence; if not, it’s CCC-adjacent.  
  - *Future-facing counterfactuals*: "If elected, I’ll end poverty." This is a promise (falsifiable later), not CCC. CCC exclusively retroflects.  
  - *Plausible hypotheticals*: A doctor saying, "If I’d seen your symptoms, I’d have diagnosed X" is testable via medical standards—unlike "if I’d been CEO."  

  **Bright Line**: CCC collapses when the hypothetical becomes testable. If a critic demands, "Would you have *really* acted?" and the speaker deflects, the credit-claiming is exposed as noise. In essence, CCC is parasitic on the listener’s willingness to accept grammar as character evidence. Its edge is the point where imagination demands proof.  

  —  
  This framework isolates your pattern: CCC is the alchemy of weaving *what never happened* into *who I supposedly am*. It’s corporate apology kryptonite because it swaps accountability for mythology.
