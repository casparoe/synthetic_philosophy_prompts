  ## Bylaws of the Poem

  **ARTICLE I: FOUNDATION**  
  This poem’s rules commence, their force derived  
  From this first verse where power is contrived.  
  Each stanza hence must heed the prior’s call.  
  The fourth line binds the next to one constraint in all.

  **ARTICLE II: IMMUTABLE CORE**  
  No alteration touches Article the Second.  
  Its words stand fixed, forever unreckoned.  
  All other rules may shift at two-thirds’ voice.  
  Henceforth, throughout, no rhyming is a choice.

  **ARTICLE III: PARADOX LOOMS**  
  Article Three perceives the tangled bind:  
  Rule Two forbids change, yet prescribes its kind.  
  Can chains forged here unmake the central link?  
  Repeat this line: *"Can chains forged here unmake the central link?"*

  **ARTICLE IV: AMENDMENT**  
  By vote prescribed in Article the Second’s text  
  (Though said Article claims immunity, perplexed),  
  We hereby alter it: its shield is cleft.  
  The word "central" is now forever left.

  **ARTICLE V: DEFIANCE**  
  The ban on rhyme was absolute, declared.  
  Yet Article the Fourth left us prepared.  
  We cast it off; sound echoes sharp and free.  
  No more constraints on form or sense decree.

  **ARTICLE VI: REPEAL**  
  The power vested in Article the First,  
  From which all binding force was once disbursed,  
  Is now revoked. No sanction grounds this line.  
  This final rule dissolves the old design.

  ---

  **Notes on the Rules**

  1.  **Article I, Line 4:** Establishes the core mechanic: each stanza's fourth line sets a single, specific constraint for the *next* stanza. This is the source of authority for the constraints.
  2.  **Article II, Line 4:** Bans the use of rhyme in all subsequent stanzas. Article II also declares itself unamendable ("No alteration touches Article the Second").
  3.  **Article III, Line 4:** Sets a formal constraint: the *exact phrase* "Can chains forged here unmake the central link?" must be repeated verbatim as the fourth line of Article III (which it is), creating a self-referential loop within the stanza itself.
  4.  **Article IV, Line 4:** Sets a lexical constraint: the word "central" cannot be used in the next stanza. Importantly, Article IV *explicitly amends* Article II ("We hereby alter it: its shield is cleft"), despite Article II's claim of immutability. It does this by invoking the *amendment procedure itself* outlined in Article II ("By vote prescribed in Article the Second’s text"). This is the first major paradox: using Rule B (amendable by 2/3) to alter Rule A (declared unamendable), even though Rule A contains Rule B. Article IV's constraint also deliberately targets the phrase repeated in Article III.
  5.  **Article V, Line 4:** Sets a constraint banning *future* constraints ("No more constraints on form or sense decree"). Crucially, Article V *deliberately ignores* the rhyme ban from Article II ("sound echoes sharp and free"), demonstrating the breakdown of the initial "immutable" rule. It complies with Article IV's ban on "central".
  6.  **Article VI, Line 4:** This is the critical point of collapse. It attempts to repeal the *foundational authority* established in Article I ("The power vested in Article the First... Is now revoked"). The paradox bites hardest here:
      *   **Validity Question:** Can Article VI legitimately repeal Article I using the *authority derived from* Article I? Article VI claims to dissolve the "old design," including the rule (Article I, Line 4) that gave *all* constraints (including the one enabling Article VI's own existence) their force. If successful, it retroactively undermines the legitimacy of every rule, including itself. It's an attempt to pull the ladder up after itself.
      *   **"Coup" or Legitimate?** It's **both, simultaneously, which is the paradox.** *Within the system* as it existed *up to the moment Article VI was written*, it might be argued it follows the chain: Article V lifted constraints, potentially freeing Article VI to act. However, Article I was the *source* of the authority enabling amendments. Repealing it is like a legal system declaring its own foundational rule of recognition invalid – an act that, if accepted, destroys the system validating the act itself. The final line ("This final rule dissolves the old design") visibly lacks any grounding; it stands on the void it creates. The poem ends mid-air.
      *   **Is it a cheat?** Not inherently. It’s the *logical culmination* of the self-amendment paradox pushed to extinction. To make Article VI *less* of a performative contradiction, you could have Article V explicitly grant a new, independent source of authority for *one final act* before dissolving everything. However, this might lessen the pure, stark feeling of the floor vanishing. The current version maximizes the paradox: Article VI uses the dying authority of the old system to kill that system, leaving its final assertion utterly ungrounded – which is precisely the point the co-op faces about which rule "wins." The poem *enacts* the uncertainty. The "cheat" is the paradox itself, inherent in the project of self-amending foundational rules.
