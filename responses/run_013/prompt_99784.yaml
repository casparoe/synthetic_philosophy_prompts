answer: |-
  ## Sestina for the Escalator Rule

  We learned the rule as if by sight:  
  The cleaving of the crowd: to **stand**  
  On one fixed **side**, the other clear.  
  The **left** a swift, ascending **way**,  
  The **right** a place to rest and **hold**  
  Your ground. No edict forced our **stand**.

  Yet pressure builds if one should **stand**  
  Defiant on the walking **side**.  
  A glare, a cough – the silent **hold**  
  Of judgment. We know what is **right**.  
  We learned the swift, efficient **way**  
  To flow, though none decreed the **left**

  Must be the path for haste. The **left**  
  Could just as well be where we **stand**  
  At rest. There is no truer **way**;  
  No deeper law defines each **side**.  
  It’s merely this: we think it’s **right**  
  Because we think you think we **hold**

  This pattern firm. We interlock, **hold**  
  Fast to what the rest expect. The **left**  
  For stepping, feels like what is **right**  
  Because we see the others **stand**  
  Conforming. Shift the chosen **side**,  
  And just as smoothly flows the **way**.

  But watch the fragile structure **way**  
  When someone breaks the common **hold**.  
  A tourist plants themselves that **side**  
  Reserved for speed. A sudden **left**  
  Blocked! Now the seamless climb must **stand**  
  Disrupted. Doubt erodes the **right**-

  ness of the rule. What felt so **right**  
  And natural, stalls upon its **way**.  
  The edifice begins to **stand**  
  On crumbling faith. Can we still **hold**  
  The pattern? See the halted **left**  
  Demand their unobstructed **side**!

  ---

  **Envoi**  
  This fragile pact we **hold** so tight  
  Depends on where we choose to **stand** –  
  No **right** or **left**, just either **side**, a **way** made real by mutual sight.

  ---

  **Analytical Note:**

  The poem takes a slight liberty by treating the escalator rule as a pure Lewis convention – arbitrary, self-enforcing via mutual expectations alone. In reality, its emergence *might* correlate with pre-existing asymmetries: in countries driving on the left (UK, Japan), the "stand" side is often the *right* (mirroring road traffic flow), suggesting it might piggyback on a deeper, non-arbitrary regularity (traffic norms) rather than emerging *de novo*. This weakens the "pure arbitrariness" claim central to the poem's conceit. If rigorous historical/sociological study proved the escalator rule *always* maps directly onto the dominant traffic-flow convention in a society (with no recorded counterexamples where it emerged independently or flipped spontaneously *without* a traffic change), this would significantly undermine the poem's foundation. It would suggest the norm is less a spontaneous Skyrmian equilibrium emerging from thin air and more a derivative coordination, reducing its power as an exemplar of pure, self-sustaining expectation. The poem leans into the philosophical idealization for poetic and conceptual clarity.
