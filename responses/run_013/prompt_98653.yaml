  so for my EPQ (the extended project thing at school) I have to hand in a one page proposal next week and i've got a half baked idea I want you to turn into something proper. Basically I read about this thing called Solomonoff induction where you give every possible hypothesis a prior based on how short the computer program is that would produce it, so simple worlds get loads of probability. The weird bit I heard is that an AI reasoning like that would end up mostly expecting to be in a world that's been specially built to reward it or trick it, because a short program can just say "and then the agent gets whatever it wants" — apparently people call the prior malign or something. What I actually want to look at is the ethics side: if there's an agent inside that setup who's a proper consequentialist and just wants to maximise good outcomes, does the fact that most of the probability mass sits in these reward-y, trick-y worlds mean it would end up doing mental things (like hammering the reward button, or not caring about real people because they're probably simulated)? And is that a problem with the prior, or with consequentialism, or both?

  Can you write the proposal for me: state the exact question so it has a definite answer, say why the obvious answers people would give don't settle it, what I'd actually do to make progress (it's philosophy so I guess it's mostly arguing and thought experiments, but be specific about the actual steps), what a real result would look like versus a failure, and be honest about whether it's too big for one school year. I'm definately not asking for a reading list or citations, my supervisor said I can add those later. Hard limit: one page, no more than 700 words.
