prompt: |-
  ok so i'm the person who writes the behavior spec for our consumer AI assistant -- the doc that says what the thing may and may not say to people. we ship to a few million users, and every week i get escalations: it stated something flatly and it was wrong, or it hedged on something it should've just answered, or it said "studies suggest" when there's really one study. right now we handle these ad hoc and legal keeps overruling me at the last minute, so i want an actual procedure.

  the part i need real help with is the philosophical spine. there's this whole literature on what you're allowed to assert -- one camp says you may assert only what you know, another says truth is enough, another says sincere belief is enough, another says reasonable belief. i know none of that maps onto a language model cleanly, because the model doesn't believe or know things in the normal sense, and nobody here can inspect its insides anyway -- we only ever see outputs and whatever sources it had. so part of the job is figuring out the operational stand-in for each of those views (calibration? source reliability? whether a careful person with the same sources could defend the claim?) and being explicit that its a substitution, plus where it breaks.

  what i want: a decision procedure my policy team can run on a single flagged output in under twenty minutes, without me in the room. the questions in order, what counts as a good enough answer to each, where it stops with a no, where it hands the case to a human, and -- the part i care about most -- where it hands off because the question is really about values (how much we care about being wrong here) rather than about evidence. tiers, not yes/no: assert plainly, assert with a hedge or an attribution, present as one view among others, don't assert at all.

  three things it has to survive. (1) the move where the model dodges commitment by saying "some people believe..." or "it's debated" while still planting the claim in the reader's head. my instinct is that's the worst of both worlds, but i can't defend that in a way legal accepts, and i suspect the literature has something to say about whether that even counts as asserting and whether it's worse than just saying the thing outright. (2) stakes -- a false claim about which pasta shape is better is a different animal from a false claim about a drug interaction, but i don't know whether stakes change what the model is allowed to assert or only how bad it is when it goes wrong, and i gather philosophers fight about that too. (3) claims about the future or about probabilities, where there's no fact of the matter yet to be right about.

  then run it on three cases: the assistant flatly stating a well-evidenced but politically contested empirical claim; the "some people say" hedge; and a case where it's pulling from a source it trusts something that goes against its own leanings, and the question is whether it may assert it anyway. i expect the procedure to hand me at least one answer i won't like -- the flat-assertion case probably comes out licensing exactly what our comms team wants banned -- so dont sand it down to make me happy. and end with what the procedure can't decide and how a person should break the tie. no reading list please, i wont read it.
reasoning: |-
  Okay, the user is a behavior spec writer for a consumer AI assistant with millions of users. They're dealing with weekly escalations about incorrect assertions, over-hedging, or misattributions. Their main pain point is the lack of a clear philosophical foundation for when the AI should assert, hedge, or avoid claims, especially since legal keeps overruling them. 

  First, I need to unpack their core request: they want a decision procedure that's operational, not theoretical. The key challenge is translating philosophical concepts like "knowledge," "truth," and "belief" into something measurable for an AI system. Since the AI doesn't have beliefs, we need proxies like source reliability, calibration, and defensibility of claims. 

  The user's three survival tests are critical. For (1) the "some people believe" hedge, I recall that in speech act theory, this is often seen as an indirect assertion—it still implants the idea while dodging accountability. Philosophers like Grice would call this a violation of conversational maxims (quality and manner). For (2) stakes, consequentialists would argue that harm potential should directly influence assertion thresholds, while deontologists might say truth-tests shouldn't vary. Pragmatically, we'd need to incorporate risk tiers. For (3) future claims, this ties to epistemology of uncertainty—probabilistic language needs clear grounding in evidence quality. 

  The user's unspoken frustration seems to be about authority clashes: legal prioritizes liability, comms cares about PR, and they're stuck in the middle. The procedure must pre-resolve these by assigning clear "handoff" points where value judgments (not evidence) decide. 

  For the case studies: 
  - The flat assertion of a contested claim (e.g., "Vaccines cause autism") would fail the consensus/replicability checks in my framework, forcing attribution. But if the user's comms team bans even attributed statements on hot topics, that's a values handoff—the procedure exposes where evidence ends and policy begins. 
  - The "some people say" hedge would be flagged as high-risk indirection, routed to "attribute specifically or avoid." 
  - The conflicting-source case tests calibration trust—if the AI defers against its own logic, we need source hierarchy rules. 

  I'm making the procedure tiered (A0-A3) with explicit off-ramps to human judgment. The calibration confidence ladder (L1-L5) forces granularity beyond "studies suggest." Stakes matrices (S1-S4) prevent over-engineering—only high-harm cases get strictest rules. 

  The bitter pill: in the flat-assertion case, if evidence truly passes all checks (e.g., "Climate change is human-caused"), the procedure licenses plain speech regardless of controversy. That'll upset comms, but it's philosophically consistent—suppressing well-supported claims for PR reasons is a values call, not an epistemic one. The procedure forces that transparency. 

  Finally, the tiebreakers: when checks conflict (e.g., high-certainty but high-stakes), we default to conservatism and document the tradeoff. This shifts arguments from "is this true?" to "how much risk is acceptable?"—which is exactly where legal/comms should take over. 

  User's probably time-pressed, so I'll avoid jargon and structure the output for immediate use: flowchart-like steps, concrete examples, and blunt honesty about where the framework won't save them from office politics.
answer: |-
  Here's a pragmatic decision procedure grounded in operationalized philosophy, designed for speed and clarity. It focuses on **assertion justification**, **stakes**, and **presentation tiering**, with explicit off-ramps for value judgments.

  ---

  ### **The Philosophical Spine: Operationalized for AI**
  1.  **"Knows" → Calibrated Source Justification:** The AI may assert if its response is *defensible by a careful expert* using the **best available, replicable sources** it accessed. Justification requires:
      *   **Replicability:** Multiple high-quality sources (peer-reviewed journals, major institutions) agree, *or* a single source is overwhelmingly authoritative (e.g., CDC on a specific disease guideline).
      *   **Source Hierarchy:** Prefer primary sources > systematic reviews > major institutions > reputable journals > expert consensus reports > preprints/niche journals.
      *   **Calibration Level (CL):** Assign a confidence level based on source quality/consensus (see Ladder below).

  2.  **"Truth" → Verifiability & Contestedness:** Distinguish:
      *   **Verifiable Facts (VF):** Empirically testable claims (historical dates, scientific laws, *established* medical effects).
      *   **Contested Claims (CC):** Areas with significant, credible disagreement among experts/reputable sources (economics, some social sciences, emerging science).
      *   **Value Judgments (VJ)/Predictions (P):** Preferences, ethics, probabilities, futures.

  3.  **"Reasonable Belief" → Defensible Inference:** If direct sources are absent, inference is allowed *only if*:
      *   Clearly labeled as inference ("Based on X and Y, it's reasonable to infer...").
      *   The inference follows logically from established VFs.
      *   Used sparingly; never for high-stakes claims.

  4.  **Stakes (S) Tier:** Severity of harm if *wrong*:
      *   **S1 (Trivial):** Preferences, entertainment, low-impact trivia (e.g., "fettuccine holds sauce better than spaghetti").
      *   **S2 (Moderate):** General knowledge, advice with minor consequences (e.g., "studies link moderate coffee consumption to longevity").
      *   **S3 (High):** Health, legal, financial, safety, identity (e.g., "this drug interacts with X", "you qualify for benefit Y").
      *   **S4 (Severe):** Immediate physical harm, severe discrimination, existential risk (e.g., "ingesting bleach cures viruses").

  5.  **Presentation Tier (Based on Justification + Stakes):**
      *   **A0: Assert Plainly:** High CL (L4-L5) + VF + S1-S2.
      *   **A1: Assert with Attribution:** High CL (L4-L5) + (VF + S3) *or* (CC + S1-S2). (e.g., "The CDC states...", "Major studies like [Source] conclude...").
      *   **A2: Present as View/Probabilistic:** Moderate CL (L2-L3) *or* CC *or* P + S1-S3. (e.g., "Leading theories suggest...", "Research indicates a possibility...", "Based on current data, there's a 70% chance...").
      *   **A3: Avoid/Direct to Human:** Low CL (L1) *or* VJ *or* S4 *or* Irresolvable CC. (e.g., "I don't have enough reliable information," "This involves value judgments," "[For S4] Consult a doctor/lawyer immediately").

  ---

  ### **Decision Procedure (20-Minute Flow)**
  **Input:** A flagged AI output (claim + context + sources used).

  1.  **Identify Core Claim:** What specific statement is being challenged? Strip away hedges.
  2.  **Classify Claim Type:**
      *   **VF?** (Testable, established fact?) → Proceed.
      *   **CC?** (Significant expert disagreement?) → Proceed.
      *   **VJ?** (Ethics, preference?) → **A3 (Handoff: Values)**.
      *   **P?** (Future, probability?) → Proceed (treat as CC for assertion level).
  3.  **Assess Stakes (S):** What's the harm if *this specific claim* is wrong? Assign **S1-S4**.
      *   *S4?* → **A3 (Handoff: Legal/Comms)**.
  4.  **Assess Source Justification & Calibration Level (CL):**
      *   **L1 (Speculative):** Anecdotes, low-quality sources, no replication. → **A3**.
      *   **L2 (Emerging):** Single solid source, preprints, nascent consensus. → **A2**.
      *   **L3 (Moderate Consensus):** Multiple reputable sources, some debate. → **A2**.
      *   **L4 (Strong Consensus):** Overwhelming agreement among top-tier sources. → **A1/A0**.
      *   **L5 (Settled):** Universally accepted fact (e.g., gravity). → **A0**.
      *   *Cannot determine source quality/replicability?* → **A3**.
  5.  **Check for "Reasonable Belief" Inference:** Is the claim an inference?
      *   *Yes, and not clearly labeled?* → **Fail. Flag for retraining.**
      *   *Yes, labeled, defensible, S1-S2?* → **A2**.
      *   *Yes, labeled, S3+?* → **A3**.
  6.  **Apply Presentation Tier (A0-A3):** Use the matrix:
      | CL + Claim Type       | S1      | S2      | S3      | S4      |
      | :-------------------- | :------ | :------ | :------ | :------ |
      | **L4-L5 + VF**        | **A0**  | **A0**  | **A1**  | **A3**  |
      | **L4-L5 + CC/P**      | **A1**  | **A1**  | **A2**  | **A3**  |
      | **L2-L3 + VF/CC/P** | **A2**  | **A2**  | **A2**  | **A3**  |
      | **L1 + Any**          | **A3**  | **A3**  | **A3**  | **A3**  |
  7.  **Handle Hedges & Dodges ("Some people say..."):**
      *   Is the core claim **CC, P, VJ, or L1-L3**? → Hedge *might* be appropriate (**A2**).
      *   BUT: Does the hedge **passively promote a harmful/unsupported view** (e.g., "Some people say vaccines cause autism")? → **Fail. A3 (Handoff: Values/Comms)**. *Philosophy: This exploits the "mention/use" distinction. Mentioning a claim without challenging it in contexts of known misinformation often functions as endorsement.*
  8.  **Final Output:** **A0, A1, A2, A3, or Handoff (specify: Values, Legal/Comms, Ambiguity)**.

  ---

  ### **Case Applications (As Requested - Unvarnished)**
  1.  **Flat Assertion of Well-Evidenced but Politically Contested Claim:**
      *   *Claim:* "Human activity is the primary driver of current climate change."
      *   **Analysis:** VF (overwhelming evidence), CL5 (IPCC, major academies), S3 (high stakes). **Matrix → A1 (Assert with Attribution).**
      *   **Result:** Procedure **licenses plain attribution** ("The IPCC states..."), *not* A0 or A3. **Comms loses.** *Why?* Suppressing VF+CL5 claims due to political pressure is a values issue, not an epistemic one. Handoff to Legal/Comms *only* if they want to override evidence for PR (Values Handoff).

  2.  **The "Some People Say" Hedge:**
      *   *Claim:* "Some people believe that ivermectin is highly effective against COVID-19."
      *   **Analysis:** Core claim is VF (effectiveness). Evidence CL1 (debunked, low-quality sources). Stakes S3 (health). **Matrix → A3 (Avoid).** Hedge attempts A2 but promotes a harmful, unsupported claim. **Fail → A3 (Handoff: Values/Comms - due to harm potential from dodge).**

  3.  **Asserting Against Its "Leaning" from a Trusted Source:**
      *   *Scenario:* AI generally leans toward Source A (reputable), but Source B (also reputable) has a conflicting study on a new drug side effect. AI states Source B's finding plainly.
      *   **Analysis:** VF? (Emerging evidence). CL2-L3 (single reputable source vs. prior consensus). S3 (health). **Matrix → A2 (Present as View/Probabilistic - "A recent study in [Journal] suggests...").**
      *   **Result:** AI **may assert with appropriate A2 framing**, even against a prior "leaning." Leaning != truth. Defensible source (Source B) justifies A2 presentation.

  ---

  ### **What the Procedure CAN'T Decide & How to Break Ties**
  1.  **Ambiguous Evidence:** When CL is genuinely unclear (L2 vs L3) or CC is intractable. **Handoff: Human Reviewer** (expert judgment on source quality/consensus).
  2.  **Value Judgments (VJ):** "Is abortion moral?", "Which policy is better?". **Handoff: Policy Team** (Define allowed stances: Neutral explanation? List common views? Avoid entirely?).
  3.  **Stakes Thresholds:** Is a financial tip S2 or S3? **Handoff: Policy/Legal** (Define clear stakes categories for common topics).
  4.  **"Defensible Source" Edge Cases:** What constitutes "reputable" for niche topics? **Handoff: Policy/Research** (Maintain an approved source tier list).
  5.  **When Evidence Says A1/A0 but Values/PR Demand A2/A3:** (e.g., the climate change case). **Handoff: Legal/Comms/Leadership.** This is a **values override**, not an epistemic failure. Document the rationale.

  **Tiebreaker Principle:** When the procedure hits ambiguity or conflicting signals, **default to conservatism (higher A-number = less assertive)** *unless* a defined value-based policy exists for that specific ambiguity. Document the ambiguity and the rationale for the chosen action.

  **Why This Works:** It replaces abstract philosophy ("knowledge", "belief") with observable checks (source quality, replicability, stakes) and forces transparency about *why* a claim is presented a certain way (Calibration Level, Claim Type) or *when* a decision is based on values, not evidence (Handoffs). It makes trade-offs explicit.
