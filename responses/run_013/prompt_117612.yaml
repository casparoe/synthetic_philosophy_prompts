answer: |-
  The described working-time regimes presuppose a **dualistic conception of work and leisure** that reveals deep tensions in modern labor law. Below is a careful reconstruction of the implicit theory, separating necessary commitments from accommodations, followed by an analysis of the underlying valuation of work.

  ---

  ### **I. The Implicit Theory: Harm vs. Choice**
  #### **A. Core Principles**
  1. **Work as a Harm**  
     - **Strict Requirements**:  
       - *Bodily Integrity*: Overwork is recognized as a direct threat to physical/mental health (e.g., Japan’s compensation for death by stroke/suicide).  
       - *Non-Waivable Protections*: Compensatory rest (France) and absolute safety thresholds (EU’s 48-hour *average* ceiling) treat rest as a fundamental need that cannot be fully alienated.  
     - **Accommodations**:  
       - Administrative thresholds (Japan) *quantify* harm but do not *prevent* harm below lethal levels.  
       - Compensation is ex post facto, implying work’s harms are remediable rather than absolutely prohibited.  

  2. **Work as a Choice**  
     - **Strict Requirements**:  
       - *Formal Autonomy*: Opt-outs (EU/UK) treat overtime as a tradable commodity subject to individual agreement.  
       - *Differential Valuation*: Exemptions for managers/self-employed (common globally) frame overwork as a voluntary investment in status/autonomy.  
     - **Accommodations**:  
       - Premium pay (France) incentivizes choice but does not mandate refusal of overtime.  
       - Opt-outs permit deviation from ceilings but do not *require* workers to exceed them.  

  #### **B. Can These Halves Be Consistent?**  
  The regimes are **structurally inconsistent** without significant qualification:  
  - **Superficial Consistency via "Informed Consent"**:  
    Opt-outs could theoretically align with harm prevention if conditioned on *genuinely free* consent (e.g., without coercion, with full transparency). Yet no system rigorously enforces this. The UK’s pre-Brexit opt-out, often signed under duress, reveals its role as a **concession to employer power**.  
  - **Deeper Inconsistency**:  
    The harm model assumes work beyond a threshold *objectively* degrades wellbeing, while the choice model treats it as subjectively valuable. Compensation for overwork death (Japan) implicitly admits that "choice" can be fatal, undermining consent’s moral force.  
  - **Resolution?**: Only by **hierarchizing principles**:  
    - Harm prevention dominates (making opt-outs illegitimate).  
    - Or, choice dominates (making health protections paternalistic).  
    Current systems split the difference, creating a **contradiction masked by proceduralism** (e.g., paperwork for opt-outs).  

  ---

  ### **II. The Presupposed Value of Work**
  #### **A. Work as "Calling" vs. Bargaining Power**  
  1. **Residual Notions of Work as Calling**:  
     - The exemption of managers/self-employed from ceilings reflects a **Calvinist ethos**: their overwork signifies dedication, not exploitation.  
     - Compensating only *extreme* harm (death) while ignoring chronic exhaustion treats the body as a *limit* to work’s higher purpose, not leisure as intrinsically valuable.  

  2. **Bargaining Power as the Primary Driver**:  
     - The opt-out’s prevalence in neoliberal economies (UK) and Japan’s unenforced standard week reveal **employer leverage**. Workers "choose" overwork due to precarity, not vocation.  
     - France’s 35-hour week emerged from *union strength*, not philosophical shifts. Where labor power wanes (e.g., UK opt-out), protections erode.  

  **Which Explanation Does the System Need?**  
  - **Bargaining power is sufficient** to explain the architecture. Managerial exemptions reflect class interests; opt-outs reflect employer lobbying; weak enforcement in Japan reflects cultural *and* economic power imbalances.  
  - The "calling" narrative is a **legitimizing myth**: It dignifies overwork for elites while obscuring coercion for others. A system truly valuing work as vocation would not commodify health via death compensation.  

  #### **B. Could Leisure-as-Default Be Built from These Parts?**  
  **No.** A leisure-centric regime would require **foundational inversion**:  
  1. **Irreconcilable Differences**:  
     - Current systems treat work as the **default state** (e.g., overtime is "added" to a norm). Leisure-as-default would make *all* work compensable intrusion.  
     - Exemptions for elites presume work’s inherent virtue; a leisure-centric view would not privilege managerial overwork.  

  2. **Necessary Overhaul**:  
     - **From Compensation to Prevention**: Japan’s ex-post compensation would be replaced by *absolute prohibitions* on harmful hours.  
     - **Eliminating Opt-Outs**: Consent would be void for harms to bodily integrity (like selling organs).  
     - **Universal Application**: No exemptions; overwork as harmful for all, regardless of status.  
     - **Positive Leisure Rights**: Mandated paid leave (as in Scandinavia) would replace negative "rest periods."  

  ---

  ### **Conclusion**
  These regimes presuppose **work as the ontological default**, with leisure as a concession to bodily frailty. The tension between "harm" and "choice" is unresolved because both serve capital efficiency: harm mitigation legitimizes the system, while choice rhetoric masks power imbalances. A leisure-centric model would reject the commodification of time and health inherent in current frameworks, requiring a reconstruction that treats work as subordinate to human flourishing, not a proving ground for virtue or a site of coerced trade-offs. The existing pieces cannot be reassembled toward this end; they are artifacts of a worldview that must itself be replaced.
