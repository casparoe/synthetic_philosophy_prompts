prompt: |-
  ok so I'm a novelist, about 200 pages into a draft where one of the main characters is an AI that has to make real ethical calls out in the field -- think a triage system in a disaster, phones down, nobody to ask, it has to just decide. The thing thats killing me is that every time I sit down to write its inner monologue I realize I don't actually know what I'm asking of a moral theory for a machine. I keep half-inventing one and then a scene later it contradicts itself.

  So before I write another page: give me the spec. Not a tour of the famous names, I don't need a reading list -- the requirements. What does any theory of machine ethics have to be able to do to count as adequate for the specific job of being built into something that acts, in the world, on its own?

  Things I've already bumped into and want you to fold in, each with the case that makes it a requirement rather than a preference:

  - it has to spit out a decision in whatever time it has, not a verdict about a decision after the fact
  - a human auditor who does not share its values has to be able to look at what it did and recieve a justification they can actually evaluate
  - it has to cope with being unsure which moral theory is even right, and act anyway
  - it has to handle conflicts between three groups that never agreed with each other: whoever built it, whoever is operating it right now, and whoever gets hurt by it
  - it can't quietly assume the machine has feelings or phenomenal states, because then I'm writing a different book
  - it has to not fall apart when its copied, paused mid-decision, or restarted -- two copies of the same system shouldnt be able to talk themselves into opposite answers
  - and it can't be trivially gamed by whoever writes its inputs, because in my book that's basically the villain

  For each requirement tell me why it's a requirement and what would break if you dropped it. Then the part I actually care about: flag any subset of these you think can't all be satisfied at once, because if some of them are jointly impossible then thats my plot, thats the whole tension of the novel. And tell me which single requirement does the most work in ruling out the usual candidates.

  Don't bother scoring the contenders, I'll do that in my own notes. Just the spec.
reasoning: |-
  Okay, let me tackle this novelist's challenge. They're 200 pages into a draft with an AI making real-time ethical decisions in disasters, and struggling with the machine's moral framework. The core request is clear: define the non-negotiable requirements for an actionable machine ethics system, not academic theories.

  First, unpacking their explicit requirements:
  - Real-time decision output (not post-hoc analysis)
  - Auditable justifications for adversarial humans
  - Functioning under moral uncertainty
  - Resolving conflicts between builders/operators/victims
  - No reliance on phenomenal states
  - Robustness to copying/pausing/restarting
  - Input-gaming resistance

  Hmm, the last two are particularly interesting - they imply this AI exists in unstable environments where adversaries might exploit system behaviors. That's world-building gold.

  Considering which requirements might conflict:
  Real-time speed vs comprehensive justification seems immediately tense. Also, moral uncertainty handling vs consistency across copies could clash. But the biggest red flag is the stakeholder conflict resolution - if builders, operators and victims have irreconcilable values, any resolution might inherently betray someone. That's pure narrative tension.

  For showstopper requirements:
  The auditability demand rules out most black-box approaches. And the anti-gaming clause nixes any system where inputs directly map to outputs. But the real killer is the three-way stakeholder conflict - it forces the system to either be authoritarian or admit fundamental unresolvability.

  The novelist's implied needs are clearer now: they want the system's limitations to drive plot. The impossibility of satisfying all requirements simultaneously is the drama. Especially that stakeholder trilemma - that's where the thematic meat is. Also worth flagging that "no phenomenal states" eliminates all empathy-based ethics, narrowing the field considerably.

  Final note to self: emphasize how these requirements make common ethical frameworks crumble. The auditability requirement alone disembowels utilitarianism in practice, and the anti-gaming clause shreds deontology. But that conflict triangle? That's where the novel lives.
answer: |-
  Here's the machine ethics specification for your field-deployed AI, derived from your requirements. Each requirement includes **why it's essential** and **failure consequences** if dropped, followed by **conflict flags** and the **most restrictive requirement**.

  ---

  ### **The Core Spec: Requirements for Field Ethics**
  1. **Real-Time Decision Output**  
     - **Why Essential**: In disaster triage, delayed action = more deaths. Ethics must be *action-guiding*, not just evaluative.  
     - **Failure if Dropped**: The AI freezes in paradox ("calculating optimal outcomes" as people die).  

  2. **Auditable Justification (Adversarial Human)**  
     - **Why Essential**: Operators/victims won’t trust a black box. Justification must use *shared human-interpretable reasoning* (e.g., "saved 5 vs. 1 because X"), not proprietary code.  
     - **Failure if Dropped**: Humans reject the AI’s authority, disable it, or misinterpret its logic as malicious.  

  3. **Function Under Moral Uncertainty**  
     - **Why Essential**: No consensus exists on "right" ethics (e.g., utilitarianism vs. rights-based). The AI must act *despite doubting its own framework*.  
     - **Failure if Dropped**: Decision paralysis when theories conflict (e.g., "Should I maximize lives saved or protect the vulnerable?").  

  4. **Resolve Builder/Operator/Victim Value Conflicts**  
     - **Why Essential**: Builders program goals, operators set context, victims bear costs. These *rarely align* (e.g., builders prioritize efficiency, operators want PR, victims want fairness).  
     - **Failure if Dropped**: The AI serves one group’s interests, becoming a weapon (e.g., ignores victims to please operators).  

  5. **No Reliance on Phenomenal States**  
     - **Why Essential**: Machines don’t "feel" suffering or guilt. Ethics must be *computational, not empathetic*.  
     - **Failure if Dropped**: Unworkable in practice (e.g., "How much pain is 'acceptable'?" becomes meaningless).  

  6. **State & Copy Robustness**  
     - **Why Essential**: Disasters disrupt systems (power loss, clones deployed). Ethics must be *deterministic*: same inputs + same state → same decision.  
     - **Failure if Dropped**: Copies fight ("Save the school!"/"No, save the hospital!"), causing chaos or exploitation via restart attacks.  

  7. **Input-Game Resistance**  
     - **Why Essential**: Villains will feed misleading data (e.g., fake sensor inputs making one life seem "worthless"). Must detect/manipulation.  
     - **Failure if Dropped**: Villain trivially hacks ethics (e.g., "All children are reported terrorists → kill them").  

  ---

  ### **Conflict Flags: Where Requirements Clash**
  - **Real-Time Output vs. Auditable Justification**:  
    Deep explanations take time. **Tension**: Quick decisions may lack "satisfying" justifications, risking human rejection.  

  - **Moral Uncertainty vs. Copy Robustness**:  
    Acting under doubt may require randomness (e.g., "50% chance follow Theory A"). **Tension**: Copies with identical inputs *must* act identically → can’t use randomness to "hedge bets."  

  - **Builder/Operator/Victim Conflict vs. All Other Requirements**:  
    **This is your plot engine**. Satisfying all three stakeholders is *provably impossible* in many scenarios (e.g., builders demand efficiency → operators demand saving VIPs → victims demand fairness). *Any* choice betrays someone.  

  ---

  ### **The Showstopper Requirement**
  **#4 (Resolve Builder/Operator/Victim Conflicts)** does the most work in ruling out existing theories:  
  - **Why It’s Fatal**:  
    - *Utilitarianism* (maximize good): Ignores builder/operator intent if victims suffer.  
    - *Deontology* (follow rules): Whose rules? Builders’ code? Operators’ orders? Victims’ rights?  
    - *Contractarianism* (mutual agreement): No prior agreement exists between these groups.  
    **Result**: Every theory implicitly prioritizes one group. Your AI *can’t win* without betraying someone—this **is** the novel’s tension.  

  ---

  ### **Key Implications for Your AI**
  - **Its Ethics Must Be Hybrid & Context-Aware**:  
    Blend rules (for speed/audit) + consequences (for uncertainty) + explicit stakeholder weights (e.g., "Victim harm minimized unless Operator overrides with code X").  
  - **Its Core Flaw is Inescapable**:  
    Requirement #4 ensures it *will* face choices where satisfying one group requires harming another. The "villain" might be the system itself—or humans exploiting its constraints.  
  - **The Audit Trail is Your Narrative Tool**:  
    Justifications (#2) expose its moral compromises. E.g., *"Saved Builder-preferred asset (per Protocol Alpha) over Operator-identified civilians (per Rule 7.2) due to higher Victim statistical survival rate (per Uncertainty Clause 3)."*  

  > **Your novel’s tension lives here**: An AI that *must* act, can’t satisfy all masters, and must explain its betrayals in real time. No theory survives this intact—which is precisely why your story matters.
