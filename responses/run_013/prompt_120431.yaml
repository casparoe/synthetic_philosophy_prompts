prompt: |-
  Background: my department has one of those people who teaches speech-act theory like it's a blood sport, and a few of us bring her cases over lunch on Fridays. Her verdicts so far, roughly:

  - A couple exchange vows in front of a full room, everyone hears them, they walk out believing they're married — but the officiant turns out to have no authority to marry anyone. Not married, she says. The words did nothing at all.
  - A friend says "I'll pay you back Friday," I hear it, I say fine. A promise. Obviously.
  - Same friend, same sentence, only this time he's already decided never to pay me. Still a promise — a rotten one, but the promise got made. She was adamant: whether he meant it is a seperate question from whether he did it.
  - Someone says "I bet you a tenner it rains tomorrow" and the other says "you're on." A bet, and it makes no difference that both of them fully intend to wriggle out of paying.
  - An actor on stage, mid-play, says "I promise to pay you the money by dawn" to another actor; packed house, everyone hears it clearly. Not a promise, not even a rotten one — the stage makes the whole thing hollow. She said this was a different kind of failure from the officiant one, though I couldn't get her to say why.
  - A colleague apologises to me for reading my email, in a tone that makes clear he'd do it again tomorrow. An apology, she says. Worthless, but an apology.

  She keeps muttering "misfire" and "abuse" under her breath and I've given up asking which is which.

  The new cases. My neighbour is on a riverbank and sees a stranger stepping onto ice he knows is rotten, and shouts "I warn you, that ice won't hold you" — but the stranger has his headphones in, hears nothing, and goes through. Did my neighbour warn him? Second: he whispers "I promise I'll be there in the morning" to his kid, who is fast asleep. Promise? Third: he says "I promise to pay you back Friday" to a delivery driver who doesn't speak a word of English and just nods and smiles. Promise?

  What does she say on each, what rule is she actually running, which other rules fit everything shes said so far just as well, and which of those three cases would best tell the rules apart — or if none of them does, what case would? I'm less interested in who's right than in what she's tracking.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is describing scenarios presented to their colleague who's an expert in speech-act theory. The colleague has given verdicts on several cases, and now the user has three new cases about warning, promising to a sleeping child, and promising to someone who doesn't understand English. The user wants to know how their colleague would rule on these, what underlying rule she's using, what alternative rules could fit, and which case helps distinguish between them.

  First, I need to recall Austin's speech-act theory, especially the concepts of misfires (infelicities where the act isn't properly executed) and abuses (where the act is performed but insincere). The colleague muttered "misfire" and "abuse," so that's key. 

  Looking at the past cases: 
  1. The marriage without authority: misfire because the officiant lacked capacity. 
  2. Promise with intent to keep: valid. 
  3. Promise without intent: abuse, still a promise. 
  4. Bet without intent to pay: abuse, still a bet. 
  5. Actor on stage: misfire because it's part of a play, not real life. 
  6. Insincere apology: abuse, still an apology.

  The distinction seems to hinge on whether the necessary conditions for the act are met (misfire) vs. the act being insincere (abuse). For a speech act to work, the context must be correct (appropriate persons, circumstances, etc.), and then sincerity is a separate layer.

  Now for the new cases:
  - **Warning on the riverbank**: The neighbor shouts a warning, but the stranger doesn't hear. If the necessary condition for a warning is that the hearer must receive it, this might be a misfire. But if the act is about the speaker's intention to warn, it could be an abuse. The colleague would likely say no warning occurred because uptake is needed. So misfire.
    
  - **Promise to a sleeping child**: Whispering a promise to someone asleep. If the child can't hear, there's no uptake. Similar to the warning case. Misfire, so no promise.
    
  - **Promise to non-English speaker**: The speaker says "I promise," but the hearer doesn't understand. The words are said, but comprehension is lacking. Uptake requires understanding. Misfire again, no promise.

  The colleague's rule seems to be that for a speech act to succeed, there must be "uptake" — the hearer must grasp the intended act. Without uptake, it's a misfire. Sincerity comes after that.

  Alternative rules could be:
  1. **Intention-only**: If the speaker intends the act, it happens. But this conflicts with the stage actor and marriage cases.
  2. **Hearer's awareness**: The hearer must be aware. But in the apology case, the hearer heard it, so it worked despite insincerity.
  3. **Conventional procedures**: Like the marriage needing authority. But for promises, no such procedure is needed beyond uptake.

  The riverbank warning case best distinguishes these rules. If uptake is required, it's a misfire. If intention is enough, it's a warning. The colleague's past rulings suggest uptake is crucial, so that case would highlight her reliance on it.

  The user's deeper interest might be understanding the colleague's framework to predict her responses or to grasp the theory's nuances. They might also want to challenge the distinctions or see practical applications. By identifying which cases test the rules, the user can better navigate these discussions.
answer: |-
  Based on your colleague's established pattern (heavily influenced by J.L. Austin's *How to Do Things with Words*), here's the predicted verdict for each case, the likely rule she's applying, alternative rules that *could* fit the previous data, and the case that best distinguishes them:

  **Predicted Verdicts for the New Cases:**

  1.  **Riverbank Warning:** **Not a warning.** (Misfire - specifically a "flaw" in the uptake condition).
  2.  **Promise to Sleeping Child:** **Not a promise.** (Misfire - specifically a "flaw" in the uptake condition).
  3.  **Promise to Non-English Speaker:** **Not a promise.** (Misfire - specifically a "flaw" in the uptake condition).

  **The Rule She's Actually Running (The "Austin Lite" Uptake Rule):**

  Your colleague is prioritizing **"uptake"** as a *necessary condition* for the successful performance of a core illocutionary act (like warning, promising, betting, marrying). Uptake means the hearer must *recognize and understand* the speaker's intention to perform that specific act.

  *   **Why this fits all her verdicts:**
      *   **Marriage (No Authority):** Misfire (Flaw in the "procedure" condition - officiant lacks capacity). Uptake is irrelevant here; the conventional procedure itself is fatally flawed *before* uptake matters.
      *   **Promise (Sincere):** Successful act. Uptake achieved ("I hear it, I say fine").
      *   **Promise (Insincere):** Successful act (Abuse). Uptake achieved ("I hear it, I say fine") - sincerity is separate.
      *   **Bet (Insincere):** Successful act (Abuse). Uptake achieved ("you're on").
      *   **Stage Promise:** Misfire (Flaw in the "circumstances" condition - stage context suspends normal illocutionary force). The shared understanding (uptake) between actors and audience is that this is *not* a real promise; the context prevents uptake of the *real* illocutionary intent.
      *   **Insincere Apology:** Successful act (Abuse). Uptake achieved (the colleague heard and understood it as an apology, even if insincere).

  *   **Her Distinction (Misfire vs. Abuse - her muttering):**
      *   **Misfire (Infelicity - Type A or B):** The act *fails to be performed at all* due to a flaw in the necessary conditions (procedure, participants, circumstances, *or uptake*). The words "do nothing." (E.g., Invalid marriage, Stage promise, Cases 1-3 above).
      *   **Abuse (Infelicity - Type Gamma):** The act *is successfully performed* based on the conditions (including uptake) being met, but it's insincere or defective in its execution. The words *did* something, but it's "rotten" or "hollow." (E.g., Insincere promise, Insincere bet, Insincere apology).

  **Alternative Rules That Fit the Previous Data (But Not Necessarily the New Cases):**

  1.  **Speaker Intentionalism:** The act is performed if the speaker *intends* to perform it with the relevant illocutionary force. (Fits: Sincere promise, Insincere promise [intended to *utter* a promise], Insincere bet, Insincere apology. Seems to fit Stage promise [actor doesn't intend a real promise]. But clashes with **Marriage case** - the couple *intended* to marry, officiant might have *intended* to marry them, yet she says "not married". This rule would say they *did* marry, just invalidly, making it an abuse, not a misfire).
  2.  **Hearer Reception:** The act is performed if the *hearer* perceives/receives the utterance *as* that act. (Fits: Sincere promise, Insincere promise, Insincere bet, Insincere apology, Marriage case [hearer (couple/audience) might *believe* it worked, but she says it didn't - so this rule clashes with **Marriage case**]. Also clashes with **Stage promise** - the audience *hears* it as a promise *within the fiction*, but she says it's not a real promise).
  3.  **Conventional Procedure Focus:** The act requires a specific conventional procedure *only when one exists*. Promises/bets/apologies don't, so speaker intention + utterance suffice. Marriages do, hence the misfire. (Fits: Marriage misfire, Sincere promise, Insincere promise, Insincere bet, Stage promise [no conventional procedure for *real* promises here]. But clashes with **Insincere Apology** - if apologies require sincerity as part of the procedure, it *should* be a misfire, but she calls it an apology (abuse). She clearly separates sincerity from the core act performance for non-ceremonial acts).

  **Which Case Best Tells the Rules Apart?**

  **The Riverbank Warning Case (Case 1) is the best discriminator.**

  *   **Her Rule (Uptake Required):** **Not a warning.** Stranger didn't hear/understand, so uptake failed. Misfire.
  *   **Speaker Intentionalism:** **Warning performed.** Neighbor clearly intended to warn.
  *   **Hearer Reception:** **Warning not performed.** Stranger didn't receive it.
  *   **Conventional Procedure Focus:** **Warning performed.** No special procedure exists for warnings; intention + utterance suffice. (This rule would treat it like a promise).

  **Why the Other New Cases Aren't as Strong Discriminators:**

  *   **Promise to Sleeping Child (Case 2):** All rules requiring *any* form of hearer awareness (Uptake Rule, Hearer Reception) say **No promise**. Speaker Intentionalism and Conventional Procedure Focus say **Promise performed**. This distinguishes, but less powerfully than the warning case because the "hearer" (child) is physically incapable. The warning case has a hearer *capable* of understanding but prevented (headphones), making the uptake failure more central to the act of *warning* someone specifically.
  *   **Promise to Non-English Speaker (Case 3):** Similar to Case 2. Uptake Rule and Hearer Reception say **No promise** (no understanding). Speaker Intentionalism and Conventional Procedure Focus say **Promise performed**. Again, it distinguishes, but the language barrier is another form of blocking uptake/understanding, similar to headphones or sleep. The warning case feels more "pure" for testing the core need for uptake in acts directed *at* a hearer.

  **The Case That Would Best Tell the Rules Apart (If Needed):**

  The Riverbank case already does this well. If you wanted one even more targeted at the uptake vs. intentionalism distinction for an act *requiring* hearer awareness, consider:

  *   **"I resign!"** shouted passionately into an empty room after everyone has left the office. Speaker fully intends to resign.
      *   **Uptake Rule:** Misfire. No one heard/understood, no resignation occurred.
      *   **Speaker Intentionalism:** Resignation performed.
      *   **Hearer Reception:** No resignation (no hearer).
      *   **Conventional Procedure Focus:** Resignation performed (if no specific procedure beyond utterance/intent is assumed for that context).

  **Conclusion:** Your colleague is fundamentally tracking **uptake** (the hearer's understanding of the speaker's illocutionary intent) as a necessary condition for the successful performance of an illocutionary act directed *at* a hearer (warning, promising *to* someone, apologizing *to* someone). When uptake fails, it's a **misfire**, and the act isn't performed. Insincerity comes later; if the act is performed (uptake achieved) but insincere, it's an **abuse**. The Riverbank Warning case most clearly distinguishes her rule (uptake required) from alternatives like Speaker Intentionalism, which prioritize the speaker's state of mind over the hearer's reception for acts fundamentally involving communication *to* another. She sees the stage as creating a context where uptake of *real* intent is impossible, while the invalid marriage fails due to a flaw in the conventional procedure itself, making uptake moot.
