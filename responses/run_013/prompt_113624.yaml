answer: |-
  The Nuremberg and Tokyo tribunals constitute a complex and contested practice, presupposing several interlinked but distinct propositions about law, sovereignty, responsibility, and justice. Distinguishing strict presuppositions from compatible or underdetermined theories is crucial.

  **Strict Presuppositions of the Practice:**

  1.  **Irrelevance of Domestic Law for Core Crimes:** The practice fundamentally presupposes that prior authorisation *under the defendant's own domestic positive law* is irrelevant to criminal liability for the specific categories of crimes prosecuted ("crimes against peace," "war crimes," "crimes against humanity"). This is explicit in the Charter and judgments (rejecting official position and superior orders as absolute defences). It does *not* strictly presuppose that the defeated states' laws were *invalid* generally (e.g., property law, contract law might still be recognised), only that they provided no shield for these specific atrocities.
  2.  **Individual Criminal Responsibility for State Acts:** It presupposes that individuals, including heads of state and high officials, can bear direct criminal responsibility under international law for acts undertaken in the name of the state or pursuant to state policy. Sovereignty does not immunise individuals for such core crimes.
  3.  **Command Responsibility:** It presupposes that commanders bear criminal responsibility not only for their own direct orders but also for their *omissions* – the failure to prevent or punish atrocities committed by subordinates which they knew or should have known about and had the power to control. This liability attaches to the omission itself.
  4.  **Sovereign Legislative Power of the Victors over the Vanquished:** The description of the Charter as an exercise of the victors' "sovereign legislative power" presupposes that the victorious states, collectively exercising *de facto* supreme authority over the defeated nations (especially Germany, under unconditional surrender), had the legal capacity to establish tribunals and define crimes binding on the defendants. This is a claim rooted in the power derived from victory and the resultant control.
  5.  **Existence of International Law (Ambiguous Basis):** The simultaneous claim that the Charter was an "expression of international law existing at the time" presupposes that *some* international legal norms prohibiting such conduct (particularly aggressive war and war crimes) pre-existed the Charter, even if imperfectly codified. However, the practice is ambiguous about whether these norms *already* entailed individual criminal responsibility enforceable by an international tribunal, or whether the Charter was merely giving effect to underlying prohibitions through a new procedural mechanism.
  6.  **Non-Retroactivity (Selective Application):** The insistence that no one may be punished without a law in force when he acted presupposes the *principle* of *nullum crimen sine lege*. However, the practice presupposes that this principle could be satisfied either by (a) the victors' sovereign legislative act applying *ex post facto* (contradicting a strict reading of *nullum crimen*), or (b) the pre-existence of customary international law prohibiting the acts, thereby constituting the "law in force" (the interpretation the tribunals favoured, however contested).

  **Compatible Theories (Underdetermined by the Practice):**

  *   **Moralised Conception of Law (Natural Law):** The practice *fits well* with a natural law view that grossly unjust state authorisations (like those enabling genocide or aggressive war) are invalid *ab initio* and cannot constitute valid legal defences. The tribunals' rhetoric often invoked fundamental morality. However, the practice does *not strictly presuppose* this. It could operate on the basis that *even if* the domestic authorisations were valid within the defeated state's *own* legal order, they were simply irrelevant to liability under the *separate* and superior legal order of international law imposed by the victors. The victors' power, not inherent invalidity, is the minimal presupposition.
  *   **Strict Legal Positivism (Power-Based):** The practice *fits well* with a view that the victors, holding *de facto* sovereign power over the defeated nations, could validly legislate *ex post facto* to punish acts they deemed criminal, overriding prior domestic authorisations. This emphasises the "sovereign legislative power" claim. The appeal to pre-existing international law could be seen as window dressing. However, the tribunals *did* explicitly reject this purely positivist, power-based justification alone by insisting they were applying pre-existing law.
  *   **Theory of Responsibility Ignoring Legal Permission:** The practice *could be licensed* by a theory holding that prior legal permission is simply irrelevant to individual moral blameworthiness for heinous acts. Such a theory could motivate the victors and underpin the moral outrage. However, the tribunals *did not frame* their judgments purely on moral blameworthiness divorced from law. They insisted on grounding liability in *law* (whether pre-existing or victor-imposed), adhering to a formal legal process. The practice presupposes legal *liability*, not just moral blame.

  **The View of Responsibility Assumed:**

  The practice assumes a hybrid view of responsibility:
  *   **For Acts Authorised by State Law:** Responsibility is strict for committing the core crimes; state authorisation is an irrelevant defence.
  *   **For Omissions (Command Responsibility):** Responsibility arises from the breach of a duty (imposed by the commander's position and knowledge/power) to prevent or punish subordinates' crimes. This presupposes such a duty existed under international law at the time – a point of significant controversy.
  *   **For Acts of Subordinates:** Commanders are responsible not *for the acts* of subordinates *per se*, but *for their own failure* (omission) to control their subordinates when atrocities were foreseeable or known. The liability is derivative only in the sense that the subordinate's crime triggers the commander's duty; the commander is punished for *their* failure, not vicariously for the subordinate's act.

  **Consistency with *Nullum Crimen*:**

  The tribunals' insistence on *nullum crimen* is in tension with:
  1.  **Crimes Against Humanity:** Prosecuting atrocities against a state's *own* civilians on a widespread scale was novel. While war crimes and aggressive war had clearer precedents, the scope and application of "crimes against humanity" as an independent category with individual liability was arguably *ex post facto* for acts committed *before* the Charter.
  2.  **Command Responsibility for Omissions:** While duties concerning the conduct of warfare existed, the precise formulation of criminal liability for a commander's *failure* to prevent/punish subordinates' crimes, especially outside direct combat situations, lacked clear, specific precedent in positive international law applied by an international tribunal.
  The tribunals resolved this tension by asserting these prohibitions and duties existed in customary law. The practice presupposes that customary international law *can* satisfy *nullum crimen*, even if uncodified and its precise scope for individual liability was previously unclear. Whether this assertion was convincing is debated, but the practice *assumes* its validity.

  **Consequences of Replacing the Presupposed View:**

  1.  **Strict Legality View (Requiring Clear Antecedent Law):**
      *   Most convictions, especially for Crimes Against Humanity and potentially aggressive war and command responsibility, would likely be illegitimate. The positive law antecedents (clear treaty provisions or unambiguous custom establishing individual criminal liability enforceable by an international tribunal) were insufficient or non-existent.
      *   The tribunals themselves could arguably not be constituted legally, as their authority rested on victors' power or novel law, not antecedent legal authorisation.
      *   The practice would have to become either:
          *   **Purely Victor's Justice:** Abandoning the *nullum crimen* pretence and openly punishing based on power and moral outrage (like summary executions, but with a judicial facade).
          *   **Limited to Clear Precedents:** Only prosecuting classic war crimes (e.g., murder of POWs) where the law was unquestionably established, leaving aggression and atrocities against own civilians unpunished.
          *   **Retroactive Legislation with Due Process:** Explicitly acknowledging the creation of new crimes/liability *ex post facto* but ensuring rigorous procedural fairness – a path arguably closer to the actual practice than its rhetoric admitted.

  2.  **Thoroughgoing Natural Law View (Unjust Laws Void):**
      *   The practice would be *more* justifiable. The domestic authorisations for genocide, aggressive war, etc., could be deemed inherently void, providing no defence. Defendants were thus always acting unlawfully.
      *   The tribunals' authority could be grounded in the natural law duty to punish such fundamental wrongs, potentially overriding positivist concerns about victor bias or *ex post facto* creation. The victors' power becomes the *means* to enforce natural justice, not the *source* of law.
      *   The tension with *nullum crimen* might remain concerning the *specific formulation* of crimes and procedures, but the core wrongfulness would be deemed knowable and prohibitable by natural reason.
      *   The practice could become more consistent in principle (e.g., potentially applying the same law to victors), but the victors' power would still be necessary to *enforce* it. It would shift the justification fully to inherent justice/morality, downplaying the positivist "sovereign legislative power" claim.

  **Conclusion:**

  The Nuremberg/Tokyo practice *strictly presupposes* the irrelevance of domestic legal authorisation for core international crimes, the victors' sovereign power to legislate for the vanquished, and the existence of pre-existing international law norms (custom) prohibiting the core acts, which could ground individual criminal liability, including for command omissions. It *fits well* with both a power-based positivist view (emphasising victor sovereignty) and a moralised natural law view (emphasising inherent injustice), but does not strictly require either. Its minimal core is that victors, exercising power, can impose liability for heinous acts regardless of prior domestic permission, while claiming adherence to the *form* of law (including *nullum crimen* via customary law). The theory of command responsibility assumed liability for omissions based on a pre-existing duty, creating a significant tension with strict legality that was resolved by assertion rather than clear precedent. Replacing its core presuppositions would fundamentally alter the practice's legitimacy and form, either rendering it largely illegitimate (strict legality) or providing a stronger moral foundation while still relying on victor power for enforcement (natural law).
