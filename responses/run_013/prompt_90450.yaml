  We are given a phenomenon in risk communication where arguments are structured such that any state of evidence is interpreted as supporting the status quo (i.e., inaction) and never as supporting change. The user notes that each individual argument might seem defensible, but collectively they form a system that is inherently biased toward inaction, regardless of the evidence. The user also observes that this pattern only runs in one direction (toward inaction) and never the reverse.

  We are to break this down and find an established name for it, or coin one if necessary.

  First, let's restate the phenomenon:

  **Phenomenon as described**: A pattern of argumentation that, regardless of the nature of the evidence (e.g., high uncertainty, low uncertainty, small effect, large effect), consistently interprets the evidence as supporting the status quo (inaction) and never as supporting a change, by employing a family of context-dependent moves that are individually plausible but collectively biased.

  Now, we must consider if this is one pattern or multiple. The user describes several moves:

  1. For harm with wide error bars: the uncertainty (possibility of high harm) is a reason to wait.
  2. For benefit with wide error bars: the uncertainty (possibility of low or no benefit) is a reason to wait.
  3. For precise and small harm: only studied under ideal conditions, so not generalizable.
  4. For precise and large benefit: too good to be true, or will be captured by special interests.

  But note that these are all being used to support the same conclusion: inaction. The common thread is that the evidence is always interpreted to favor the status quo. This suggests a single pattern: **a systematic bias in the interpretation of evidence toward maintaining the status quo**.

  However, we can split the pattern into two components:

  - **Component 1**: The use of asymmetric standards of evidence for harm versus benefit. Specifically, harm is treated with a precautionary lens (any possibility of harm is a reason to avoid), while benefit is treated with a skeptical lens (any uncertainty about benefit is a reason to discount it).
  - **Component 2**: The use of shifting interpretations of evidence quality (e.g., when evidence is uncertain, that's a problem; when evidence is certain, that's also a problem because it's too limited or too good to be true) to always support inaction.

  But note that both components are employed in service of the same goal: to maintain the status quo. Thus, they are part of a unified pattern of argumentation.

  Now, we consider candidates from various fields:

  1. **Status quo bias**: In decision theory and behavioral economics, this is a preference for the current state of affairs. It often manifests as a tendency to stick with the default option. However, it is typically a psychological bias and doesn't articulate the argumentative structure we see.

     - Fit: Partial. It captures the outcome (preference for status quo) but not the systematic generation of arguments from any evidence.

  2. **Confirmation bias**: The tendency to search for, interpret, and recall information in a way that confirms one's preexisting beliefs. Here, the preexisting belief is that the status quo is preferable, and the evidence is interpreted to confirm that.

     - Fit: Close. This captures the interpretation part, but confirmation bias is a general cognitive bias and doesn't specifically account for the systematic generation of reasons that work on any input. Also, it doesn't necessarily produce the asymmetric treatment of harm and benefit.

  3. **The precautionary principle**: Often invoked in environmental and health contexts, it states that if an action has a suspected risk of causing harm, the burden of proof that it is not harmful falls on those taking the action. This principle inherently favors inaction in the face of uncertainty about harm. However, it does not usually address the treatment of benefit and does not explain the shifting interpretations of evidence quality.

     - Fit: Partial. It is a key part of the pattern (especially for harm) but doesn't account for the treatment of benefit or the shifting standards for evidence quality.

  4. **Loss aversion**: In prospect theory, losses are weighted more heavily than gains. Thus, the potential harm (a loss) is given more weight than the potential benefit (a gain). This asymmetry can lead to favoring the status quo.

     - Fit: Partial. It explains why harm is given more weight, but it doesn't capture the shifting interpretations of evidence quality.

  5. **Motivated reasoning**: A broader concept where reasoning is driven by goals (motivations) rather than a dispassionate evaluation. In this case, the motivation is to maintain the status quo, and the reasoning is structured to support that.

     - Fit: Close. It explains the generation of arguments to support a desired conclusion. However, it doesn't specify the pattern of arguments that always convert evidence into reasons for inaction.

  6. **System justification theory**: In social psychology, this is the tendency to defend and justify the status quo, even at the expense of personal and group interests. It might explain why people generate arguments to support the status quo.

     - Fit: Partial. It explains the underlying motivation but not the specific argumentative moves.

  7. **The fallacy of moving the goalposts**: A logical fallacy where one constantly demands new evidence when previous evidence is presented. This is similar to the shifting interpretations we see.

     - Fit: Partial. It captures the shifting standards but doesn't account for the asymmetric treatment of harm and benefit and the one-directionality.

  8. **Ad hoc hypothesis**: In philosophy of science, this is a hypothesis added to a theory to save it from falsification. Here, each new argument could be seen as an ad hoc reason to avoid changing the status quo.

     - Fit: Partial. Each move is ad hoc, but the pattern is more systematic.

  9. **Risk aversion in the domain of losses**: This is related to loss aversion and prospect theory. The idea is that when faced with potential losses, people become risk averse and prefer the status quo. But again, it doesn't explain the full pattern.

  10. **Asymmetric paternalism**: In regulatory contexts, this is a principle that regulations should protect against harm even when there is uncertainty, but not necessarily promote benefits. This is related to the precautionary principle.

      - Fit: Partial.

  After reviewing, we note that no single established concept exactly captures the phenomenon. The phenomenon is characterized by:

  - A systematic generation of arguments that always interpret any state of evidence as supporting the status quo.
  - Asymmetric treatment of harm and benefit: harm uncertainty is a reason to avoid, benefit uncertainty is a reason to avoid, while certain harm is downplayed and certain benefit is met with suspicion.
  - The pattern is one-directional (only toward inaction).

  The best fit might be a combination of concepts, but we are asked for a single name if possible. Alternatively, we might coin a term.

  Given that the pattern is one of argumentation, we might call it:

  **Status Quo Protective Argumentation (SQPA)**

  But let's see if there's a better fit.

  Alternatively, in the context of risk communication, we might consider:

  **Precautionary Skepticism**: But this only captures part of it.

  Another candidate from philosophy is the **inertial principle of decision-making**, but that's not standard.

  Given that the pattern is a form of biased argumentation that systematically favors the status quo by generating context-dependent reasons, and that it is characterized by shifting standards and asymmetric burdens of proof, we might coin a term:

  **Evidential Status Quo Shield (ESQS)**

  However, we note that the user wants a narrow, exact term.

  Alternatively, we can think of it as a form of:

  **Argumentative Inertia**

  But let's compare to the candidates.

  After careful thought, the closest established concept is **motivated reasoning** because it explains the generation of arguments to support a desired conclusion (the status quo). However, motivated reasoning is broad and not specific to this pattern.

  Therefore, I propose coining a new term:

  **Systematic Status Quo Bias in Evidence Interpretation (SSQBEI)**

  But that's long.

  Alternatively:

  **Status Quo Evidential Bias (SQEB)**

  But we need a definition.

  Let's define:

  **Status Quo Protective Argumentation (SQPA)**: A pattern of argumentation in which any state of evidence regarding the potential harms and benefits of a proposed change is systematically interpreted to support maintaining the status quo, by employing context-dependent moves that shift the standards of evidence and asymmetrically weigh harm and benefit.

  Now, to the user's question: the one-directionality is essential because it is part of the definition that the moves only run toward inaction. The user notes they have never seen the mirror image. Thus, it is a defining feature.

  Now, we structure the answer as a JSON object.

  We'll break down the pattern as one component because the various moves are unified in their goal and structure.

  Candidates:

  - Status quo bias: partial fit
  - Confirmation bias: close fit
  - Precautionary principle: partial fit
  - Motivated reasoning: close fit

  Best fit among existing: motivated reasoning (but it's not exact). So we coin a term.

  Verdict: no established concept, coinage proposed.

  Proposed name: **Status Quo Protective Argumentation**

  Definition: A pattern of argumentation in risk communication and decision-making where, regardless of the nature of the evidence about a proposed change (including its uncertainty, magnitude, or precision), the evidence is consistently interpreted through a set of context-dependent moves to support maintaining the status quo, by employing asymmetric standards for harm and benefit and shifting interpretations of evidence quality.

  Necessary and sufficient conditions:

  1. The argumentation is about a proposed change from the status quo.
  2. The evidence about harm and/or benefit is interpreted in a way that always supports inaction.
  3. The interpretation employs moves that are context-dependent (e.g., uncertainty in harm is a reason to avoid, uncertainty in benefit is a reason to avoid, precise harm is downplayed, precise benefit is met with skepticism).
  4. The pattern is one-directional (only supports inaction).

  Boundary cases:

  - Case: A person argues that because the harm estimate has a wide error bar, we should wait (instance). Reason: fits the pattern.
  - Case: A person argues that because the benefit estimate has a wide error bar, we should act because the harm might be low (not an instance). Reason: the mirror image is not observed in the pattern.
  - Case: A person argues that a precise and large harm estimate means we should act to avoid it (not an instance). Reason: this is an argument for change, not for status quo.
  - Case: In a debate about a new policy, one side uses the precautionary principle for harm but also acknowledges that the benefit might be large and certain enough to proceed (borderline). Reason: it doesn't use the full set of moves to always support status quo.

  What it is not:

  - It is not simply the precautionary principle, because the precautionary principle only addresses harm and does not necessarily extend to the treatment of benefit.
  - It is not status quo bias, which is a preference without necessarily the argumentative structure.
  - It is not confirmation bias, which is a general tendency and not specific to the status quo and risk communication.

  Finally, the one-directionality is essential to the phenomenon as described.

