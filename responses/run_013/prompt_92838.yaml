prompt: |-
  Alright, I've been goign in circles on the Pascal's mugging thing and I want someone to just tell me what I actually believe. Here's my gut on a pile of cases, and I want to know what single principle — or small set — captures them, what it says about a case I haven't thought of, and which of my verdicts it forces me to drop.

  1. A stranger stops me, says he's a matrix lord, and says that unless I hand over my wallet he'll torture 10^50 people for 10^50 years. He says the odds he can actually do it are 1 in 10^50. I keep the wallet. I don't even slow down.

  2. Same guy, same threat, but now the odds are 1 in a million. I hand it over.

  3. Same guy, same 1-in-a-million odds, but the threatened harm is just that he breaks my arm. I still hand it over, and this one doesn't feel weird to me at all — a one-in-a-million chance of a broken arm is just worse than losing the wallet, so it feels like ordinary decision-making.

  4. Reverse mugging. A guy offers to save 10^40 people from torture, and all I have to do is mail him $20. Same credibility as case 1: 1 in 10^40. I don't mail the $20. But this is case 1 with the sign flipped, and I can't really say why it feels different. Maybe I just don't like being played.

  5. Not a person — a physics thing. There's a known process that, as far as anyone can tell, has a 1-in-10^20 chance of triggering a chain that kills everyone. A lab says it can be shielded for $1,000. I pay the $1,000 without hesitation, even though 1 in 10^20 is a way smaller number than the 1 in 10^50 I blow off in case 1.

  6. Muggers, plural. A different guy shows up every morning with the case-1 story. Paying each time would ruin me inside a year, and they obviously can't all be as likely as they claim. I refuse all of them, and honestly I feel better about that than about case 1, because now it's a policy question and not a one-off.

  7. The mugger who asks for a penny. Case 1 again, except he only wants one cent and the odds are still 1 in 10^50. I give him the penny. Pretty sure that's just because a penny is nothing to me and not because of the math.

  My tentative guess is that I'm an expected-utility maximizer who quietly caps how much a tiny probability gets to move me — like anything under some threshold counts as zero, and the threshold drops as the stakes go up. But case 5 breaks that, since there I act on a probability way smaller than one I refuse in case 1, and the only real difference is who's telling me the number. So maybe my actual rule is about whether I trust the source of the probability, not the size of it. Is there one principle that gets all seven? What does it say about a case I haven't listed — say, a mugger who isn't a person but a message from a source I have good reason to think is honest, at 1 in 10^30? And if I want the rule to stay simple, which of my seven do I have to give up? I'd rather keep 5 and 6 than 4, if that matters.
reasoning: |-
  Okay, let me try to unpack this Pascal's mugging problem for the user. They've laid out seven detailed scenarios showing their gut reactions to different probability-threat combinations. The challenge is finding a consistent principle that explains all their judgments without contradictions.

  First, looking at cases 1 and 2: The user ignores an extremely low probability threat (10^-50) but acts on a much higher one (10^-6). Case 3 shows they'll act even for minor harms at moderate probabilities. Case 4 is interesting - it's the reverse of case 1 (positive outcome), but they refuse despite similar odds. Case 5 breaks any simple probability cap theory since they act on 10^-20 for existential risk. Case 6 introduces repeated interactions, making refusal systematic. Case 7 has them paying trivial costs regardless of probability.

  Hmm... the physics lab case (5) is key here. Why trust scientists over a random mugger? It's about source reliability, not just probability magnitude. The user's brain is probably doing background sanity checks: Does this claim fit with known physics? Is there independent verification? Could this person be lying? 

  For the reverse mugging (case 4), the asymmetry makes sense - we're evolutionarily wired to weigh potential losses heavier than gains. Losing a wallet feels more concrete than some abstract salvation. Also, the mugger's incentive matters: they benefit from lying in the threat scenario but not in the offer scenario? Wait no, in both cases they get money... interesting.

  The penny case (7) reveals a separate cost-benefit heuristic: when action cost approaches zero, we'll "pay" to avoid even microscopic risks. But this disappears when costs accumulate (case 6).

  Putting it together: The user seems to use three filters:
  1) Source reliability assessment (discounting human claims without evidence)
  2) Loss aversion (weighting threats > opportunities)
  3) Action cost vs. decision fatigue (trivial costs paid, repeated demands rejected)

  For their unasked scenario (trusted source at 10^-30): I'd predict compliance since it passes filter 1. And if they want simplicity, they might need to drop case 4's asymmetry - but that's deeply cognitive. Alternatively, embrace that "trust" isn't monolithic but has dimensions (expertise, incentives, track record). 

  Biggest tension is between case 1 (ignore 10^-50) and case 5 (act on 10^-20). The only consistent resolution is to admit that probability estimates aren't raw numbers but contextual beliefs shaped by source credibility. A scientist's 10^-20 might be more reliable than a mugger's 10^-50 even if numerically larger. This means abandoning any universal probability threshold - which is actually good epistemology.
answer: |-
  Based on your verdicts across all seven cases, your guiding principle isn't *just* expected utility (EU) maximization or a simple probability cap. Instead, you consistently apply **Source-Dependent Probability Discounting**, combined with **Loss Aversion** and **Decision-Fatigue Avoidance**. Here's the breakdown:

  ### Core Principles:
  1. **Source Reliability Trumps Raw Probability**:  
     You treat claimed probabilities as *information* whose credibility depends entirely on the source.  
     - *High-reliability sources* (e.g., scientific consensus, trusted institutions): You accept their probabilities at face value (Case 5).  
     - *Low-reliability sources* (e.g., random muggers): You discount their claimed probabilities *heavily*, often to near-zero (Cases 1, 4).  
     - *Moderate-reliability sources*: You partially accept probabilities if they align with intuition (Case 2: 1/million feels plausible; Case 3: harm scales reasonably).

  2. **Loss Aversion Asymmetry**:  
     You weight potential losses more heavily than equivalent gains.  
     - *Threats* (Cases 1–3): You act even for moderate harms at low-but-plausible odds.  
     - *Offers* (Case 4): You dismiss "too good to be true" gains at identical odds, feeling "played."

  3. **Cost-Benefit Heuristics**:  
     - *Trivial cost* (Case 7): You act if cost ≈ 0, regardless of implausibility.  
     - *Repeated imposition* (Case 6): You reject due to cumulative cost/annoyance ("policy effect").

  ---

  ### How It Explains All 7 Cases:
  - **Case 1** (1-in-10⁵⁰ threat): Mugger = maximally unreliable source → discount probability to ≈0.  
  - **Case 2** (1-in-1M threat): Probability feels marginally plausible → accept EU calculation.  
  - **Case 3** (1-in-1M broken arm): Harm is credible/relatable → act.  
  - **Case 4** (1-in-10⁴⁰ offer): Reverse mugging → loss aversion + source distrust → dismiss.  
  - **Case 5** (Physics lab): Trusted source → accept probability → act.  
  - **Case 6** (Repeated muggers): Cumulative cost + distrust amplification → refuse all.  
  - **Case 7** (Penny mugging): Cost ≈0 → act despite distrust.  

  ---

  ### Unseen Case: Trusted Source at 1-in-10³⁰  
  - **Your predicted action**: **Hand over the wallet**.  
    - *Why?* A source you "have good reason to think is honest" (e.g., verified AI, Nobel physicist) overcomes your probability discounting. EU dominates: (10³⁰ disutils) × (10⁻³⁰) = 1 util averted > cost of wallet.  

  ---

  ### Tradeoffs for Simplicity: What You Must Drop  
  To make your rule **universal and parsimonious**, you'd need to:  
  1. **Drop Loss Aversion (Sacrifice Case 4)**:  
     Treat threats and offers symmetrically. If you dismiss 1-in-10⁵⁰ threats, you *must* act on 1-in-10⁴⁰ offers (since 10⁴⁰ disutils averted × 10⁻⁴⁰ > $20 cost).  
     - *But you prefer keeping Cases 5/6*, so this is acceptable.  

  2. **OR Drop Source Dependency (Sacrifice Cases 1 & 5)**:  
     If you insist on a fixed probability cap (e.g., ignore all prob < 10⁻¹⁵), Case 5 (acting on 10⁻²⁰) becomes irrational.  
     - *Worse*, this *still* doesn’t save Case 4 (asymmetry remains).  

  ---

  ### Recommended Compromise: Keep Your Intuitions  
  Adopt a **Two-Stage Filter**:  
  1. **Source Reliability Check**:  
     - If source is unreliable (mugger), ignore claims unless cost to act is trivial (Case 7).  
     - If source is reliable (science), use raw probability in EU.  
  2. **Loss-Aversion Adjustment**:  
     - Apply an extra weight (e.g., 2×) to claimed losses vs. gains from untrusted sources.  

  This preserves all 7 verdicts, including Case 4 ("being played" = justified skepticism + loss/gain asymmetry). It also explains why Case 5 feels different: **trust calibrates probability**, not stakes. When scientists say 1-in-10²⁰, you believe the *model*. When a mugger says 1-in-10⁵⁰, you hear "this is fiction."

  ### Key Insight
  Your intuition that "case 5 breaks a simple cap" is exactly right. Humans don't respond to raw probabilities—we respond to *beliefs*. Your brain rejects muggers not because 10⁻⁵⁰ is "too small," but because their claim lacks **causal plausibility** in your mental model of the world. Physics risks feel real because they're embedded in a web of existing knowledge. This is rational, not inconsistent.
