answer: |-
  Let's reconstruct Aquinas' argument step by step, addressing your questions in sequence:

  ### 1. The Role of "Formal Falsehood"  
  **Formal falsehood** is the *intention to assert what one believes to be false*, regardless of the objective truth-value. This is the core criterion for Aquinas.  
  - **Belief vs. Truth**: It hinges on what the speaker *believes* (e.g., if you say X while believing X is false, that's formal falsehood, even if X is objectively true).  
  - **Intent to Deceive**: Formal falsehood does *not* require intent to deceive. That belongs to "effective falsehood" (the act's consequence).  
  - **Key Distinction**:  
    - *Material falsehood*: The statement is objectively false.  
    - *Formal falsehood*: The speaker *intends to assert falsehood* (based on their belief).  

  ### 2. Intention to Deceive and "Perfect" Lies  
  - **Necessary for a "perfect" lie?** Yes, but not for the *species* (essential nature) of a lie.  
  - **What turns on "species" vs. "perfection"**:  
    - *Species*: The act is a lie if it involves formal falsehood (intending to assert what you believe false).  
    - *Perfection*: A lie is "perfect" only when all three elements concur:  
      1. Material falsehood (statement is false),  
      2. Formal falsehood (intending to assert falsehood),  
      3. Effective falsehood (intent to deceive).  
  - **Moral Weight**: A lie lacking intent to deceive is still a lie (against truthfulness) but may be less vicious than one aimed at deception.  

  ### 3. True Statements as Lies: "Falseness Essentially, Truth Accidentally"  
  - **Why a true statement can be a lie**: If you say something objectively true *while believing it is false and intending to assert falsehood*, your *moral act* is defined by your intention.  
  - **"Falseness essentially, truth accidentally"**:  
    - *Essentially*: The act's moral character is defined by the *will to assert falsehood* (formal falsehood).  
    - *Accidentally*: The statement happens to be true, but this is incidental to your immoral intent.  
  - **Terminological Stipulation?** It follows from Aquinas' broader framework: moral acts are defined by intention (e.g., giving poisoned water "essentially" is murder, even if the water accidentally quenches thirst).  

  ### 4. Modern Cases: Literal Truths and Implicatures  
  - **Literally true but incomplete answer**: Not a lie *if* you believe it is true and do not intend to assert falsehood. However, it violates the *virtue of truthfulness* (ST II-II q. 109) by withholding due context.  
  - **True sentence chosen to imply falsehood**: Aquinas would likely call this a lie *if* you exploit implicature *while intending to assert what you believe false*. If not, it's "dissimulation" (q. 111, a. 1), which he condemns as sinful deception but distinguishes from lying.  
  - **Resources for Condemnation**:  
    - *Virtue of truth*: Requires "right measure" in communication—neither excess (harsh bluntness) nor defect (deception).  
    - *Dissimulation*: Deception by omission or implication is still a sin against charity/justice, even if technically not lying.  

  ### 5. Reverse Case: False Statement Without Intent to Deceive  
  - **Example**: Jokingly saying "It's raining diamonds!" during a sunshower, knowing no one will believe you.  
  - **Aquinas' Judgment**:  
    - *Material falsehood*: Present (statement is false).  
    - *Formal falsehood*: **Absent** (you do not intend to assert falsehood; context shows non-serious intent).  
    - *Effective falsehood*: Absent (no intent to deceive).  
  - **Result**: Not a lie. It may be frivolous or imprudent, but not a sin against truthfulness.  

  ### 6. Framework vs. Modern Distinction: Does It Support "Misleading is Better"?  
  - **No—it undermines the modern distinction**:  
    - Aquinas makes moral culpability turn on *intention* (formal falsehood), not truth-value.  
    - A true statement said *with intent to assert falsehood* is a lie (and arguably worse than an unintended falsehood).  
    - Conversely, misleading without asserting falsehood (e.g., paltering) avoids being a "lie" but is still sinful dissimulation.  
  - **Is he answering a different question?**  
    - Yes: Aquinas focuses on the *speaker's moral act* (defined by intention), while your course focuses on *linguistic strategies* (literal truth vs. implication).  
    - **But he condemns both**: Lying (formal falsehood) is always sinful; dissimulation (misleading) is also sinful but may lack the *additional* vice of asserting falsehood.  

  ### Key Takeaways:  
  - **Lying requires formal falsehood**: Intending to assert what you believe false.  
  - **Intent to deceive**: Makes a lie "perfect" but isn't required for the act to be a lie.  
  - **Modern misleading**: Not lying for Aquinas, but still sinful as dissimulation.  
  - **Moral hierarchy**:  
    - Worst: Lying with intent to deceive ("perfect lie").  
    - Less bad: Lying without intent to deceive.  
    - Still bad: Dissimulation (misleading without lying).  

  Aquinas' framework shifts the debate from "truth-value of words" to "intention of the speaker," making the ethics of deception less about semantic tricks and more about the virtue of truthfulness in one's will. This challenges the modern assumption that misleading is inherently better—for Aquinas, both can be gravely wrong, but for different reasons.  

  For your course: Aquinas would reject the *linguistic* distinction as morally decisive. What matters is whether you *will* to deceive or *will* to assert falsehood—whether through lies, paltering, or silence. Both violate truthfulness.
