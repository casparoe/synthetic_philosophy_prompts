prompt: |-
  Rank the four following accounts of promissory obligation by how well each explains the case below, giving each a rating from 0 to 1 for its adequacy as a general theory of why promises bind. The accounts are: (a) reliance- or expectation-based, on which the obligation rests on the promisee's justified expectation or reliance; (b) will- or authority-based, on which the promisor's act of undertaking an obligation is itself obligation-creating; (c) practice- or convention-based, on which the obligation derives from a social practice of promising and the fairness of conforming to it; and (d) joint-commitment-based, on which a shared commitment arises between promisor and promisee. The case is this: A promises B, who has no surviving relatives and will die within days, never to disclose a certain fact about B's past; B then dies; A is now the only person who knows the fact, and disclosing it would benefit A greatly while harming no one living; A still takes herself to be bound. For each account, give the rating and a one-sentence justification, identify which feature of the case is doing the separating work, and state what the account would have to amend to fit the case. Mark clearly which parts of your verdict are settled among people who study promising and which are genuinely contested, rather than presenting a contested reading as the consensus.
reasoning: |-
  Hmm, the user wants me to evaluate four philosophical accounts of promissory obligation based on a specific case where a promise is made to a dying person. I need to rate each theory from 0 to 1 for its adequacy in explaining why promises bind, focusing on this scenario.

  The case is quite interesting: A promises B (who has no relatives and will die soon) to never disclose a secret about B's past. After B dies, revealing the secret would benefit A and harm no one, yet A still feels bound. This creates tension because there's no living person to rely on the promise or be harmed by its breach.

  Let me break down the four accounts:

  (a) Reliance/expectation-based: This focuses on how the promisee relies on the promise or has expectations. In this case, since B is dead, there's no one to rely on or have expectations anymore. The core problem is that the promisee is gone, so this theory struggles to explain the ongoing obligation.

  (b) Will/authority-based: Here, the promisor's act of committing creates the obligation. Even after B dies, A's act of promising might still bind her. This seems strong here because it emphasizes the promisor's own commitment.

  (c) Practice/convention-based: This sees promising as part of a social practice. But in this private promise with no one else involved, the social aspect feels irrelevant. The fairness argument doesn't land well when there's no society to uphold.

  (d) Joint-commitment-based: This involves a shared obligation between promisor and promisee. But with B dead, how can there be a "joint" commitment? It seems like the joint aspect collapses upon death.

  Now I need to rate each on a 0-1 scale. For (a), I'll go with 0.2 since the reliance dies with B. For (b), it should be high, maybe 0.9, because the will-based view holds regardless of the promisee's existence. For (c), it's weak here - perhaps 0.3 - as the social practice element is absent. For (d), the joint commitment can't persist unilaterally, so I'd say 0.4.

  The separating feature is clearly the promisee's death eliminating reliance, social consequences, or joint agency while the obligation persists. 

  For amendments: (a) would need to allow for obligations beyond reliance; (b) is already strong; (c) would need to value the practice intrinsically; (d) would need to make commitments survive death.

  I should note where there's academic consensus versus debate. The weakness of reliance theory here is widely accepted, while the will theory's strength is debated (some find it "metaphysical"). Practice theory's application to private promises is contested, and joint commitment theorists do argue about post-mortem obligations.

  The user seems philosophically sophisticated - probably a grad student or researcher testing theories against edge cases. They want clear distinctions between settled and contested points, not oversimplified answers. I'll make sure to flag the debates explicitly in the justifications.
answer: |-
  Here is a ranked evaluation of the four accounts based on the case, with ratings (0-1), justifications, separating features, required amendments, and consensus/contested markers:

  ### Rankings (Highest to Lowest Rating)
  1. **(b) Will- or authority-based: Rating 0.9**  
     *Justification:* The obligation persists because A’s act of *undertaking* the commitment intrinsically binds her, regardless of B’s death or lack of consequences.  
     *Separating feature:* The promisee’s death eliminates reliance, social consequences, and joint agency—but not the promisor’s self-imposed obligation.  
     *Amendment needed:* None; the case aligns with its core claim that obligation arises from the act of will.  
     **Consensus:** Weakness of rival theories here is widely accepted; strength of will-based views is *contested* (e.g., by critics who deem it "metaphysical").  

  2. **(d) Joint-commitment-based: Rating 0.4**  
     *Justification:* The obligation *might* endure if joint commitments survive a party’s death, but this requires stretching the "joint" element.  
     *Separating feature:* B’s death nullifies ongoing joint agency, making the commitment unilateral.  
     *Amendment needed:* Theorists must argue that joint commitments can bind unilaterally after one party’s death.  
     **Contested:** Whether commitments can transcend a party’s death is debated within this framework (e.g., Gilbert vs. skeptics).  

  3. **(c) Practice- or convention-based: Rating 0.3**  
     *Justification:* The social practice of promising loses force when disclosure harms no living person, weakening fairness-based obligations.  
     *Separating feature:* No social consequences or reciprocity interests exist post-B’s death.  
     *Amendment needed:* Must hold that adhering to the practice is valuable *intrinsically*, even without social effects.  
     **Contested:** Whether practice-based duties apply to wholly private promises is disputed (e.g., Rawlsians vs. particularists).  

  4. **(a) Reliance- or expectation-based: Rating 0.2**  
     *Justification:* B’s death eliminates reliance/expectation harms, removing the basis for obligation.  
     *Separating feature:* No living promisee exists to experience detriment or betrayed expectations.  
     *Amendment needed:* Must extend "harm" to include posthumous disregard or abstract normative interests.  
     **Consensus:** This theory’s *inadequacy* in post-mortem cases is widely acknowledged.  

  ### Summary of Key Distinctions
  - **Settled consensus:**  
    - Reliance theory (a) struggles severely with post-mortem promises due to the absence of a living promisee.  
    - Will theory (b) best explains the case *if* one accepts its core premise (which is contested).  
  - **Genuinely contested:**  
    - Whether will-based obligations (b) are truly self-imposing or require deeper justification.  
    - Whether joint commitments (d) or practices (c) can generate duties absent social/human consequences.  
  - **Separating feature:** The **death of the promisee** (eliminating reliance, social stakes, and joint agency while leaving self-obligation intact) is the critical factor testing each theory.  

  This analysis reflects established scholarly agreements and open debates in promissory theory, avoiding presenting contested interpretations as settled.
