answer: |-
  ### Precautionary Assessment Procedure

  #### Core Sequence of Questions
  1. **Classify Uncertainty Type**  
     - *Question:* What is the primary source of uncertainty?  
       - **Magnitude**: Hazard established at some exposure; unknown if real-world exposure reaches harmful levels.  
       - **Existence**: Plausible mechanism + 1–2 signals (e.g., high-dose animal study); no established hazard in any species.  
       - **Model**: Agent alters the system (e.g., ecosystem cascade); uncertainty lies in model structure, not parameters.  
     - *Sufficiency*: Consensus among 9 members via majority vote. Proceed to the type-specific pathway.

  2. **Status-Quo Check**  
     - *Question:* Would the current practice/product (if replaced by the petitioned agent) pass the standard we are about to apply?  
     - *Sufficiency*: Explicit "yes/no" with justification. If "no," the petition gains priority but substitution risks must be addressed.

  3. **Type-Specific Pathways  
     ***(Follow one based on Step 1)*  
     - **Magnitude Pathway**:  
       - *Q1:* Is there a measurable threshold (e.g., NOAEL/LOAEL) and exposure metric?  
         - No → Terminate with "no."  
         - Yes → Proceed.  
       - *Q2:* Is there evidence of real-world exposure exceeding the threshold?  
         - No → Terminate with "no."  
         - Uncertain/yes → Proceed.  
       - *Q3:* Can exposure be reduced below the threshold?  
         - No → Hand to minister (cost-benefit tradeoffs).  
         - Yes → Design restriction (e.g., phased reduction).  
     - **Existence Pathway**:  
       - *Q1:* Is there a plausible mechanism + ≥1 signal?  
         - No → Terminate with "no."  
         - Yes → Proceed.  
       - *Q2:* Is there an identified exposure pathway?  
         - No → Terminate with "no."  
         - Yes → Proceed.  
       - *Q3:* Can hazard/exposure be monitored?  
         - No → Hand to minister (values: societal tolerance for uncertainty).  
         - Yes → Design restriction (e.g., conditional approval with monitoring).  
     - **Model Pathway**:  
       - *Q1:* Can the direction of systemic change (harm/benefit) be predicted?  
         - Beneficial → Terminate with "no."  
         - Harmful/unknown → Proceed.  
       - *Q2:* Can indicators of systemic harm be monitored?  
         - No → Hand to minister (values: precaution vs. innovation risk).  
         - Yes → Design restriction (e.g., phased reduction with indicator triggers).  

  4. **Substitution Check**  
     - *Question:* What is the substitute or displaced activity, and what risks shift there?  
     - *Sufficiency*: Named substitute + risk assessment (e.g., "Substitute B may increase groundwater contamination").  

  5. **Restriction Design**  
     - *Requirement*: All restrictions must include:  
       - **Unwinding condition**: Observable metric to lift restriction (e.g., "Exposure < X ppm for 5 years").  
       - **Review date**: Fixed reassessment timeline (e.g., 3 years).  

  6. **Minister Handoff**  
     - *Trigger*: When the remaining uncertainty is value-laden (e.g., societal risk tolerance, economic tradeoffs).  
     - *Deliverable*: Evidence summary + recommended restrictions + substitution risks.  

  ---

  ### End-to-End Application  

  #### Petition 1: Insecticide with Contested Pollinator Effects  
  - **Step 1**: *Magnitude* (hazard to pollinators established; field exposure contested).  
  - **Step 2 (Status Quo)**: "No" (current use would fail exposure threshold test if contested evidence is valid).  
  - **Magnitude Pathway**:  
    - Q1: Yes (threshold: LD₅₀ for bees; exposure: residue levels in pollen).  
    - Q2: Uncertain (conflicting field studies) → Proceed.  
    - Q3: Yes (restrict spraying during bloom) → Design: Phased reduction to 50% use in flowering crops.  
  - **Substitution**: "Neonicotinoid substitutes may increase resistance in pests."  
  - **Restriction**:  
    - Unwinding: "If 3+ years of field data show pollinator declines < 5% in treated areas."  
    - Review: 4 years.  
  - **Outcome**: Hand to minister (tradeoff: crop yield vs. pollinator health).  

  #### Petition 2: Plasticizer with a Suspect Substitute  
  - **Step 1**: *Existence* (endocrine disruption signals; no human hazard established).  
  - **Step 2 (Status Quo)**: "No" (current plasticizer would fail existence test due to signals).  
  - **Existence Pathway**:  
    - Q1: Yes (mechanism: estrogen receptor binding; signal: in vitro assay).  
    - Q2: Yes (exposure: leaching into food).  
    - Q3: Yes (monitor human biomonitoring data) → Design: Labeling + supplier reporting.  
  - **Substitution**: "Substitute phthalate may cause liver toxicity (animal data)."  
  - **Restriction**:  
    - Unwinding: "If biomonitoring shows exposure < 0.1 μg/L in 95% of samples."  
    - Review: 3 years.  
  - **Outcome**: Proceed with labeling; substitution risk flagged to minister.  

  #### Petition 3: Plausible Mechanism + Single Animal Study, No Exposure Pathway  
  - **Step 1**: *Existence* (mechanism + one high-dose study).  
  - **Step 2 (Status Quo)**: "Yes" (no exposure pathway; status quo passes existence test).  
  - **Existence Pathway**:  
    - Q1: Yes (mechanism: DNA adduct formation; signal: mouse tumor study).  
    - Q2: **No** (no exposure pathway identified) → Terminate with "no."  
  - **Outcome**: Refuse petition. *Fails existence Q2 despite being a "paradigm precautionary case."*  

  ---

  ### Where the Procedure Misfires  
  1. **Judgment Dressed as Procedure**:  
     - Uncertainty classification (Step 1) relies on subjective interpretation of "plausible mechanism" or "systemic alteration."  
     - Status-quo check (Step 2) assumes equivalent risk standards for old/new products.  

  2. **What It Cannot Do**:  
     - Address cumulative effects (e.g., chemical mixtures).  
     - Handle novel agents with *zero* evidence (fails existence Q1).  
     - Force data generation (e.g., if exposure pathway is unknown, petition fails).  

  3. **Unobservable Harms**:  
     - **Problem**: Restrictions prevent hypothetical harms (e.g., cancer from low-dose exposure), so costs (e.g., economic disruption) are the only measurable ledger.  
     - **Mitigation**:  
       - Use leading indicators (e.g., biomarker changes) for unwinding conditions.  
       - If no observable proxy exists, minister handoff must weigh unprovable risks against tangible costs.  
       - Review dates force reevaluation as science evolves.  

  **Final Note**: This procedure prioritizes consistency over perfection. It forces explicit tradeoffs, resists ratcheting, and isolates value judgments—but cannot eliminate scientific ambiguity.
