  Okay, the user wants me to draft interview questions for their guest who defends the "division of moral labor" concept. This guest proposes two types of folk morality: order-morality (focused on rules and compliance) and conscience-morality (focused on individual judgment). She has four key theses: burden-of-proof, parasitism, administrative-virtue, and cost-bearer problem.

  I need to create 9-10 substantive questions that press on the core arguments. The user specifically wants questions that challenge the burden-of-proof thesis, test the parasitism thesis in thin societies, force the cost-bearer problem into a concrete case, question empirical claims about stability, address potential cultural essentialism, define "folk morality," handle moral progress, resolve conflicts between moralities, and reveal whether this is descriptive or normative theory. Each question needs a follow-up, with three having double follow-ups to anticipate deflections.

  For the burden-of-proof question: I'll challenge whether shifting argumentative responsibility creates substantive disagreement. Her likely deflection would be appealing to different meta-ethical foundations. My follow-up should press whether those foundations change behavior. Double follow-up: if she retreats to practical effects, demand examples where outcomes differ.

  Parasitism thesis question: I'll ask how conscience functions in rule-thin societies. She'll probably say thin backgrounds collapse the distinction. Follow-up: push whether this makes her thesis unfalsifiable. Double follow-up: corner her on circularity - if "real conscience" requires thick order, how do we identify it independently?

  Cost-bearer problem: I'll use the user's cooperative scheme example. She'll likely emphasize institutional accommodations. Follow-up: question if this preserves order-morality's integrity when objectors opt out.

  Stability question: I'll ask for falsifiable claims about order-morality. She might describe coordination failures. Follow-up: demand specific thresholds where stability breaks.

  Cultural labels: I'll challenge if German/American labels are essentialist. She may cite historical contingencies. Follow-up: ask what evidence would prove misattribution.

  Folk morality: I'll probe how to distinguish folk practice from reconstruction. She might reference sociological markers. Follow-up: question if her framework itself is reconstruction.

  Moral progress: I'll ask how reformers aren't initially vicious. She'll note post-hoc validation. Follow-up: press whether this denies contemporaneous virtue.

  Conflict resolution: I'll ask which morality "wins" in clashes. She'll appeal to division of labor. Follow-up: challenge with cases requiring hierarchy.

  Descriptive/normative: I'll question if division of labor prescribes rather than describes. She'll deny relativism by affirming interdependence. Follow-up: ask if this interdependence is itself a third morality.

  I'm ensuring each question cuts deep without being unfair. The double follow-ups for burden-of-proof, parasitism, and descriptive/normative questions anticipate her most polished deflections. The concrete case makes the cost-bearer problem visceral. All questions stay within her defined framework while exposing tensions. No warm-ups or restatements - we launch straight into the architecture of her argument.
answer: |-
  Here’s a rigorously structured interview draft, designed to press the core tensions in her position. Brainstorming notes precede each question cluster to anticipate deflections. Questions avoid redundancy and demand substantive engagement.

  ---

  ### Brainstorming: Anticipated Deflections & Strategic Targets
  1. **Burden-of-Proof Thesis**:  
     *Likely deflection:* She’ll argue the burden shift creates distinct *practical* realities, not just verbal disagreement.  
     *Hard press:* Demand examples where outcomes diverge despite identical acts being "permitted."  
     *Second deflection:* Retreat to "meta-ethical foundations" differing.  
     *Hard press:* Ask if those foundations manifest in observable behavior or remain philosophically inert.

  2. **Parasitism Thesis**:  
     *Likely deflection:* In thin-background societies, conscience becomes "indistinguishable from preference," proving the thesis.  
     *Hard press:* Challenge circularity: if "true conscience" requires thick order-backgrounds, how is this falsifiable?  
     *Second deflection:* Claim thin societies *create* order-morality via emergent norms.  
     *Hard press:* Ask if this concedes conscience-morality can bootstrap order, contradicting parasitism.

  3. **Cost-Bearer Problem**:  
     *Likely deflection:* Frame accommodations (e.g., conscientious objector status) as proof the division *works*.  
     *Hard press:* Force admission this requires order-morality to *violate its own burden-of-proof principle* by accepting unargued exceptions.

  ---

  ### Interview Questions & Follow-Ups
  **I. Burden-of-Proof Substantiveness**  
  **Q1:** Your burden-of-proof thesis claims both moralities permit the same acts but differ over who must justify deviation. If the substantive moral *output* (permitted acts) is identical, isn’t this a purely procedural or rhetorical dispute? What *concrete* difference—beyond who speaks first—does this burden-shift make in moral life?  
  *Follow-up (Likely: Practical/psychological effects):* If the difference is only in psychological comfort or social friction, does that reduce morality to sociology?  
  *Double Follow-up (Deflection: Meta-ethics):* When two people perform identical acts—one under order-morality’s burden, one under conscience’s—what observable behavior or outcome proves they inhabit meaningfully distinct moral worlds?

  **II. Parasitism in Thin Societies**  
  **Q2:** You argue conscience-morality parasitizes thick order-backgrounds. In a society with thin, fragmented, or contested rules (e.g., a polarized democracy), how can we distinguish "sincere conscience" from self-indulgence? Doesn’t your thesis become circular—"genuine conscience exists only where order is thick" yet "thick order is identified by enabling genuine conscience"?  
  *Follow-up (Likely: Thin societies lack "true" conscience):* If conscience collapses into preference in thin-background societies, does this imply moral realism depends on social cohesion?  

  **III. Cost-Bearer: Concrete Case**  
  **Q3:** Imagine ten neighbors cooperatively fund mosquito control. One, citing conscience, refuses to pay, calling insecticides ecologically reckless. Others see this as harmless hypochondria. By your model, must the cooperative bear the cost of her refusal? If so, doesn’t order-morality disintegrate by subsidizing unreasoned deviation? If not, how does conscience-morality avoid punishing sincerity?  
  *Follow-up (Likely: Accommodation mechanisms):* But if the cooperative absorbs her cost, hasn’t it *abandoned* order-morality’s burden-of-proof principle by accepting her refusal without justification they accept?  

  **IV. Empirical Claims & Falsifiability**  
  **Q4:** You claim order-morality enables "stable coordination." Is this an empirical hypothesis? What observable evidence—say, coordination breakdowns when rule-compliance declines—would falsify it? Or is stability a definitional feature of order-morality?  
  *Follow-up (Likely: Functionalist explanation):* If stability is definitional, does this make your thesis unfalsifiable and teleological?  

  **V. Cultural Labels vs. Analytic Types**  
  **Q5:** You use "German" and "American" as shorthand for order/conscience moralities. Are these labels doing explanatory work, or merely illustrating ideal types? What historical/social evidence would show you’ve misattributed these tendencies (e.g., if data showed Germans more frequently engage in civil disobedience than Americans)?  
  *Follow-up (Likely: Ideal types != stereotypes):* How do you guard against essentializing nations when using such labels, and why not use culturally neutral terms?  

  **VI. Defining "Folk Morality"**  
  **Q6:** What criteria distinguish a *folk morality* (like your two types) from a philosopher’s reconstruction? If ordinary moral agents don’t self-identify as "order-" or "conscience-moralists," what evidence proves these are lived frameworks rather than your useful heuristic?  
  *Follow-up (Likely: Implicit in practices/conflicts):* Couldn’t the same practices be explained by competing values (e.g., security vs. autonomy) without positing two distinct moral architectures?  

  **VII. Moral Progress & Initial Viciousness**  
  **Q7:** You note order-morality’s blind spot is moral progress, which begins as deviation. But if early reformers (e.g., abolitionists) act against prevailing rules, doesn’t order-morality necessarily judge them *vicious* at the time? How can your account avoid implying moral reformers are initially immoral?  
  *Follow-up (Likely: Retrospective validation):* Doesn’t "retrospective validation" concede that conscience-morality can *only* be vindicated historically, making present moral courage epistemically impossible?  

  **VIII. Conflict Resolution**  
  **Q8:** When order- and conscience-moralities directly conflict (e.g., a law requiring military service vs. pacifist refusal), which *should* prevail in your division of labour? Or is the answer always contextual?  
  *Follow-up (Likely: Division requires negotiation):* But negotiation presupposes a shared meta-framework. If the conflict is *between* these meta-frameworks, what shared ground enables arbitration without begging the question?  

  **IX. Descriptive or Normative?**  
  **Q9:** Is the "division of moral labour" a neutral *description* of how societies function, or a *normative proposal* for balancing moralities? If descriptive, how do you explain societies that collapse into one pole? If normative, doesn’t this covertly impose a third, higher morality?  
  *Follow-up (Likely: Pragmatic necessity):* If the division is pragmatically necessary, does this collapse into relativism—where "what works" trumps moral truth?  
  *Double Follow-up (Deflection: Non-relativist interdependence):* How can interdependence avoid relativism if there’s no transcendent standard to adjudicate when one morality’s demands become intolerable to the other?

  ---

  ### Why This Works
  - **No Softballs**: Every question forces engagement with a core tension or vulnerability in her model. No restatements, warm-ups, or biography.
  - **Deflection Anticipation**: Follow-ups target her most probable retreats (e.g., appealing to pragmatism, historical validation, or meta-ethics).
  - **Conceptual Precision**: Embedded definitions (e.g., "folk morality," "burden-of-proof") keep questions grounded *in her terms*.
  - **Pressure Points**: The concrete cost-bearer case (Q3) and moral progress dilemma (Q7) prevent abstract evasion. Q9’s normative/descriptive ambiguity threatens the view’s coherence.
  - **No Escape Hatch**: Questions are revised per your instruction—none allow comfortable answers without conceding limitations or refining the theory.
