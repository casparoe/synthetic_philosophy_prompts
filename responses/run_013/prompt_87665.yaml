prompt: |-
  I am an undergraduate taking a course in moral psychology, and I have been trying, without success, to find a name for a pattern that keeps recurring in the literature and in our seminars. A study reports that people's moral judgements shift when an apparently irrelevant factor is present — a foul smell in the room, the attractiveness of the person being judged, the language in which the question is put — and the shift is reported as a bias, as noise the judgement ought to have screened off. Another study reports that judgements shift when people are given longer to reflect, or hear the affected party's testimony, or are made to consider consequences — and that shift is reported as reasoning, or as a proper sensitivity to reasons. Nothing about the mechanism seems to distinguish the two cases: in both, some feature of the situation causes the judgement to move. What distinguishes them is whether we already believe the feature is the kind of thing that ought to make a difference. The same ambiguity seems to run through the distinction between a preference and a bias: an attitude that forms part of someone's moral outlook reads as a preference when we find it intelligible and as a bias when we do not, yet the label is presented as a finding rather than as a verdict.

  I know there is a substantial literature on debunking arguments and on the genetic fallacy, and my pattern is plainly in that neighbourhood, but it does not seem to be the same thing. Those debates take it for granted that an influence can be identified as distorting, and then ask whether a belief so caused is undermined. What puzzles me is the step before that — how an influence gets classified as distorting rather than as tracking in the first place, and whether that classification can be made without presupposing the very normative commitments it is meant to support.

  Is there an established term for this pattern, or for the circularity I am describing? If there is, please say which concept it is, how it differs from the nearest alternatives (debunking arguments, the genetic fallacy, and whatever else is closer), and whether anyone has argued that the classification can be made non-circularly. If there is not, I would far rather have a careful definition than a neat label: tell me exactly what the phenomenon is, what it is not, and where its edges lie — in particular, whether it genuinely applies to the preference/bias distinction as well as to the reason/bias one, and whether it collapses into ordinary moral disagreement.

  Please answer in British English.
reasoning: |-
  Okay, this undergraduate in moral psychology presents a sophisticated observation about how situational factors affecting moral judgments get classified either as "biases" (distortions) or "proper reasoning" based on pre-existing normative assumptions. They've noticed a circular pattern: we label something a bias when it contradicts our existing moral commitments, but present that label as an objective finding. 

  The student explicitly distinguishes this from debunking arguments and the genetic fallacy - they're focused on that prior step of categorization. They also wonder if the same applies to preference/bias distinctions. Their core question is whether this classification can be non-circular.

  Hmm... let me mentally scan the literature. The "adaptive logic" framework from Elqayam/Evans comes to mind - how reasoning is often evaluated against its conformity to prior beliefs rather than abstract norms. But more directly relevant is the "argumentative theory of reasoning" by Mercier and Sperber, where reasoning serves social justification rather than truth-seeking. 

  Ah! And there's Gendler's "alief" concept for automatic belief-like states that influence judgment independently of endorsed beliefs. This connects to the student's examples like smells or attractiveness affecting judgment. The key insight is that the distinction between "proper sensitivity" and "bias" often depends on whether the influence aligns with consciously endorsed principles.

  For the preference/bias question: yes, the same mechanism applies. Consider implicit bias research - automatic associations are labeled "biases" precisely when they conflict with explicit values. The circularity is starkest there: we call it bias because it diverges from what the person consciously considers moral.

  On non-circular classification attempts: some dual-process theorists try to define biases by cognitive features (e.g. automaticity), but as the student suspects, even that smuggles in norms (e.g. that controlled processing is superior). Pizarro's work on motivated moral reasoning shows how hard it is to disentangle.

  The student's really pinpointed a foundational issue in moral psychology - the field's struggle to define "good" moral judgment without presupposing the very norms under investigation. Their observation about the rhetoric of presenting these labels as discoveries rather than value judgments is particularly sharp.
answer: |-
  You've identified a profound methodological circularity at the heart of empirical moral psychology—one that lacks a single universal label but is widely recognised. The clearest conceptual fit is **"normative pre-commitment circularity"** or **"evaluative framing dependence"**. Let's dissect it carefully.

  ### Core Phenomenon Defined
  - **What it is**: A pattern where the classification of a psychological influence on moral judgement (as either "rational sensitivity" or "irrational bias") is determined not by objective features of the causal mechanism itself, but by the researcher's (or society's) prior normative belief about whether the influencing factor *ought* to legitimately affect the judgement. The label ("bias" vs. "reasoning") is presented as an empirical discovery while covertly relying on contested moral assumptions.
  - **Key circularity**: The designation of an influence as distorting presupposes the very normative framework it purports to validate. If Factor X aligns with accepted moral reasons (e.g., considering consequences), it’s "sensitivity"; if it contradicts them (e.g., ambient odour), it’s "bias"—even if the cognitive process is identical.

  ### Distinguishing from Neighbouring Concepts
  1.  **Debunking Arguments**:  
      - Focus: Assert that a belief’s *genealogy* undermines its justification (e.g., "moral realism is false because evolution shaped our intuitions").  
      - **Difference**: Debunking assumes the *distorting* nature of the cause is already established. Your pattern questions *how that classification is made initially*.  

  2.  **Genetic Fallacy**:  
      - Focus: Erroneously judging a belief’s truth-value *solely* based on its origin.  
      - **Difference**: The genetic fallacy is a logical error; your pattern is a meta-methodological circularity in *defining what counts as a distorting origin*.  

  3.  **Motivated Reasoning / Confirmation Bias**:  
      - Focus: How desires/goals skew information processing.  
      - **Difference**: These describe psychological processes; your pattern concerns the *normative labelling* of those processes by researchers.  

  ### Preference vs. Bias: Does the Pattern Apply?
  **Yes, unequivocally.** The distinction is paralysed by the same circularity:  
  - A "preference" is an attitude deemed **intelligible within the observer’s normative framework** (e.g., prioritising family over strangers).  
  - A "bias" is an attitude **failing that framework’s intelligibility test** (e.g., implicit racial preference).  
  - **The Mechanism**: Both involve learned associations or affective responses. The label depends entirely on whether the observer endorses the attitude as reasonable. Joshua Greene’s fMRI studies (e.g., deontological judgements as "emotional bias") exemplify this: the neural "alarm" is labelled "distorting" *because* consequences are prioritised in his normative model.

  ### Can Classification Be Non-Circular?
  Attempts exist, but face severe challenges:  
  1.  **Cognitive Architecture Criteria** (e.g., automatic/implicit = bias; controlled/explicit = reason):  
      - *Problem*: Many "rational" judgements rely on automatic processing (e.g., intuitive utilitarian responses). Valence is still normatively assigned (e.g., is a gut feeling "wisdom" or "prejudice"?).  
  2.  **Ecological Rationality** (e.g., influences that aided fitness = adaptive):  
      - *Problem*: "Adaptive" ≠ "morally justified" (e.g., in-group favouritism).  
  3.  **Procedural Rationality** (e.g., consistency, coherence):  
      - *Problem*: A coherent belief system can be morally abhorrent (e.g., fascist ethics). Consistency alone doesn’t resolve the normative grounding.  
  **Conclusion**: Non-circular classification appears impossible without *some* prior normative anchor. As **Hilary Putnam** argued, facts and values are "entangled"; empirical work cannot escape evaluative frameworks.

  ### Edges and Limits: Does This Collapse into Moral Disagreement?
  **Not entirely—it exposes its epistemic structure.**  
  - **Where it holds**: When researchers present their *normative classification* (bias/reason) as an *empirical finding*, masking the role of pre-theoretical commitments.  
  - **Where it blurs**: In cases of broad consensus (e.g., extreme visual disgust as a biasing factor in harm judgements). Even here, the "consensus" relies on shared norms.  
  - **Crucial Boundary**: The pattern concerns **meta-methodological circularity in research practice**, not first-order moral disagreement. It reveals how moral psychology risks becoming a **rhetorical reinforcement of the researcher’s ethics** under the guise of neutral science.

  ### Key References Analysing This
  1.  **Berker (2009)** *"The Normative Insignificance of Neuroscience"*: Critiques Greene’s inference from "emotional" to "biased".  
  2.  **Doris & Stich (2005)** on **"the fragmentation of reason"**: Highlights how empirical data underdetermines normative conclusions.  
  3.  **Gendler (2008)** on **"alief"**: Distinguishes automatic belief-like states, complicating bias/reason binaries.  
  4.  **Haidt’s Social Intuitionist Model**: Posits post-hoc reasoning, implying much "reasoning" is biased justification—yet his labelling of intuitions as "erroneous" still relies on normative benchmarks.

  In essence, you’ve pinpointed the **is/ought problem operationalised in moral psychology research**: the covert smuggling of normative commitments into operational definitions of "good" judgement. While termed variably—**evaluative circularity**, **normative loading**, or **framework-dependent classification**—it remains a foundational critique of the field’s objectivity claims. Your instinct that this precedes debunking arguments is astute; it challenges the very criteria for what counts as a "debunking-worthy" cause.
