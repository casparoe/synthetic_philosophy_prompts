prompt: |-
  I'm a backend engineer at a mid-size company with a codebase that's older than most of the team. We get alot of "can we just get rid of this?" proposals -- a 200-line function nobody understands, a manual approval step in our deploy process, a sleep-and-retry in a data pipeline -- and the argument always goes the same way: someone says we can't touch it because something will break, without being able to say what, or we spend a sprint carefully preserving something that turns out to be dead weight, which definately makes the whole don't-touch-it instinct look like superstition.

  I want you to act like a patient philosopher of institutions who also actually ships code. Take Chesterton's fence, plus the Burkean idea that inherited practices can encode knowledge no living person has (the weird hack might be a bug fix from 2013 that exactly one customer depends on), and turn it into a real decision procedure my team can run in a 30-minute design review. Before you write the procedure, brainstorm out loud about what the principle is actually claiming and what it does *not* claim -- I suspect it's really about how cheaply a change can be reversed, but I don't want you to just assume that, tell me if that reading survives.

  What I need: the questions to ask in order, what counts as a good enough answer to each, where it stops with a hard "keep it," and where it has to hand off to a human because it's a judgment call about risk appetite rather than a fact. It has to handle the case where nobody alive knows why the thing is there, and the case where the original reason is gone but some other mechanism now covers it. Don't let it collapse into "go ask whoever wrote it" -- most of them have left. Assume the tech lead and the owner of the affected service have to sign off, and that reviewers usually don't know the history.

  Then run it on three cases: the mystery billing function, the manual approval step in the deploy process, and one case of your choosing where the procedure says rip it out -- I want to see it isn't just a rubber stamp for whoever owns the code. Mark where it misfires or can't decide, and tell me honestly how someone could abuse this procedure to block all change.
reasoning: |-
  We are going to design a decision procedure based on Chesterton's Fence and Burkean conservatism. The principle isn't just about reversibility but about the idea that existing structures (code, processes) may contain embedded knowledge that we don't understand. We remove them only when we understand why they were there and can be sure they are no longer needed. However, we must also avoid paralysis and the accumulation of dead weight.

  Key ideas:
  1. The principle claims: 
     - Existing practices may have reasons that are not immediately apparent.
     - Removing without understanding may cause harm that is difficult to foresee.
     - Therefore, we must first understand the purpose (or the problem it solved) before removal.

  2. It does NOT claim:
     - That we should never remove anything old.
     - That every existing practice is optimal or even still relevant.
     - That we must preserve everything indefinitely.

  The procedure should focus on:
  - Understanding the function of the component (even if the exact history is lost).
  - Assessing current relevance and risks of removal.
  - Considering reversibility and mitigation strategies.

  The decision procedure must account for:
  - The case where the original reason is gone but the component might now serve another purpose (accidental coupling).
  - The case where the original reason is gone and no other mechanism covers it (dead code).

  We also note that the cost of reversal (rollback) is a critical factor, but that is one of the risks to assess.

  Procedure Outline:

  We will structure the review as a series of questions. The goal is to gather evidence to support removal or retention. The process should take about 30 minutes per item.

  Participants: 
  - Tech lead, service owner, and any other relevant stakeholders (like the person proposing removal).

  Steps:

  1. **Define the Fence** (2 minutes)
     - What exactly is the component or practice we are considering removing? Be specific.

  2. **State the Proposal** (1 minute)
     - What change is being proposed? (e.g., delete this function, remove this step, etc.)

  3. **Document Known Purpose** (5 minutes)
     - What is the currently understood purpose of this component? (If no one knows, state that.)
     - Are there any known dependencies? (e.g., other services, customers, internal tools)
     - Are there any historical records (comments, tickets, commit messages) that explain it?

  4. **Assess Current Relevance** (5 minutes)
     - Is the problem that this component was designed to solve still present?
     - Are there other components or processes that now cover the same function? (i.e., has it been replaced inadvertently?)
     - If it's a process, has the context changed such that the step is no longer necessary?

  5. **Risk Assessment** (5 minutes)
     - What are the risks if we remove it? Consider:
       - Functional: breaking a feature, causing errors in data, security issues, etc.
       - Operational: impact on monitoring, deployment, performance, etc.
       - Business: contractual obligations, customer impact, financial implications.
     - How easily can we reverse the change if something breaks? (Reversibility)
     - Can we mitigate the risk? (e.g., feature flags, dark launches, logging, monitoring)

  6. **Probe for Hidden Knowledge** (5 minutes)
     - Are there any signs that this component might be serving an unrecorded purpose? (e.g., it is triggered in unusual circumstances, it handles an edge case, it is part of a compliance requirement)
     - Have we looked for evidence in monitoring, logs, or by testing in a safe environment? (e.g., can we shadow the function and see if it's still used?)

  7. **Alternatives to Removal** (2 minutes)
     - Is there a way to achieve the benefits of removal without full deletion? (e.g., refactoring, disabling, better documentation, creating a feature flag, scheduling a future removal after a grace period)

  8. **Decision** (5 minutes)
     - If the component's purpose is unknown and the risks are high and hard to reverse, we keep it (and consider investing in understanding it better).
     - If the purpose is known and no longer relevant, and risks are low, remove it.
     - If the purpose is unknown but we can safely test removal (high reversibility, low risk) and we have a mitigation plan, then proceed with removal with caution.

  The decision must be made by the tech lead and service owner, based on the evidence gathered. The procedure does not guarantee removal; it might lead to further investigation.

  Now, we run the procedure on three cases:

  Case 1: Mystery Billing Function (200 lines, nobody understands)

  Case 2: Manual Approval Step in Deploy Process

  Case 3: Sleep-and-Retry in a Data Pipeline (this is the one we choose for removal)

  We'll mark misfires or indecision and discuss potential abuse.

  ---

  **Case 1: Mystery Billing Function**

  1. **Define the Fence**: A 200-line function in the billing module, named `adjustLegacyInvoice`, with no comments and complex logic.

  2. **Proposal**: Remove the function and any calls to it.

  3. **Document Known Purpose**: 
     - No one on the team knows what it does. 
     - Checked commit history: the commit message is "fix for customer X" from 2013. 
     - Dependencies: It is called during the monthly billing cycle for some accounts.

  4. **Assess Current Relevance**:
     - We have no active customer named X? (Check: Customer X left in 2015.) 
     - But note: it might be called for other customers. We don't know.

  5. **Risk Assessment**:
     - High risk: Removing might cause incorrect billing for some customers. 
     - Hard to reverse: If we remove and then a month later billing runs, we might have to restore from backup and recalculate, which is costly.
     - Mitigation: We could log when it's called and what it does for one billing cycle, then remove if unused.

  6. **Probe for Hidden Knowledge**:
     - We don't know if it's still needed. The function might be handling an edge case for a remaining customer.

  7. **Alternatives**:
     - Instead of removal, add logging and metrics to track usage for one billing cycle. Then reassess.

  8. **Decision**: 
     - Do not remove now. We will log usage for one month. If no usage, then remove. If used, document and then decide.
     - **Outcome**: Keep for now, with a plan to reassess.

  ---

  **Case 2: Manual Approval Step in Deploy Process**

  1. **Define the Fence**: A step in the deployment pipeline that requires a senior engineer to manually approve production deployments.

  2. **Proposal**: Remove the manual approval step to allow fully automated deployments.

  3. **Document Known Purpose**:
     - Introduced after an incident in 2015 when an automated deploy caused a major outage. 
     - Purpose: to catch errors that automated tests might miss and to ensure only stable releases go to production.

  4. **Assess Current Relevance**:
     - We now have a comprehensive automated test suite and a staging environment that mirrors production. 
     - The manual step causes delays and is a bottleneck.

  5. **Risk Assessment**:
     - Risk: Without the manual check, we might deploy a change that causes an outage. 
     - Reversibility: We can quickly revert a bad deploy (if we have automated rollbacks). 
     - Mitigation: We can implement automated canary releases and better monitoring.

  6. **Probe for Hidden Knowledge**:
     - The manual step might also serve as a last-minute check for configuration changes or to ensure that the deploy is done during low traffic. 
     - We note that the original reason (lack of testing) is addressed, but there might be other unrecorded reasons.

  7. **Alternatives**:
     - Remove the manual step but add automated checks (e.g., canary analysis, automated rollback on error rates). 
     - Alternatively, remove the step for low-risk services first.

  8. **Decision**:
     - We can remove the manual step if we have automated rollbacks and canary deployments. 
     - But since the team is risk-averse, we decide to phase it out: remove for pre-approved low-risk services and then after a success period, remove entirely.
     - **Outcome**: Conditional removal. It's not a rubber stamp; we are changing the process but with safeguards.

  ---

  **Case 3: Sleep-and-Retry in a Data Pipeline** (chosen as the removal case)

  1. **Define the Fence**: A step in a data pipeline that, upon failure, sleeps for 5 minutes and then retries (up to 3 times).

  2. **Proposal**: Remove the sleep-and-retry and replace with an exponential backoff.

  3. **Document Known Purpose**:
     - The original code comment says: "Wait for 5 minutes to let the downstream service recover".
     - The downstream service was known to be unstable and required time to recover.

  4. **Assess Current Relevance**:
     - The downstream service was replaced 2 years ago with a more resilient service that has rate limiting and proper error handling. 
     - We now have a circuit breaker pattern in place for this kind of interaction.

  5. **Risk Assessment**:
     - Risk: If we remove and the downstream service still has issues, we might lose data. 
     - However, the circuit breaker should handle retries with backoff. 
     - Reversibility: Easy. We can revert the code change quickly. 
     - Mitigation: We can monitor for increased failure rates after removal.

  6. **Probe for Hidden Knowledge**:
     - We checked: the old downstream service is decommissioned. 
     - The current circuit breaker already uses exponential backoff, so this sleep is redundant.

  7. **Alternatives**:
     - Replace with exponential backoff? But we already have that. So just remove.

  8. **Decision**:
     - Remove the sleep-and-retry. It's redundant and the original reason is obsolete. 
     - **Outcome**: Remove.

  ---

  **Potential Misfires and Abuse**:

  - Misfires:
    - The procedure might be too cautious and lead to keeping dead code because of fear of the unknown. 
    - It might not catch every hidden dependency, especially if logging during a safe period doesn't cover all scenarios (e.g., the billing function might be called only in an annual billing cycle).

  - Abuse to block change:
    - A risk-averse person could always argue that we don't know the purpose and the risk is too high, even when evidence suggests it's safe. 
    - To counter: require concrete risks, not vague fears. If no one can articulate a risk, then we proceed with caution and monitoring.

  **Conclusion**:
  The procedure forces the team to think through the purpose and risks, and it provides a structured way to handle unknown legacy components. It doesn't guarantee removal but ensures we don't remove recklessly. It also allows removal when evidence supports it (as in Case 3).
answer: |-
  ### The Philosophical Core: What Chesterton and Burke Actually Claim (and Don't)
  **The Core Claim**:  
  Institutions, processes, and code embody *emergent knowledge*—solutions to problems we no longer remember. Removing them without understanding *why they exist* risks destroying hidden value or re-introducing solved problems. This is **not superstition**; it's epistemic humility.

  **What It Does NOT Claim**:  
  - "Never change anything."  
  - "Tradition is always optimal."  
  - "Reversibility is irrelevant" (it’s a factor, but not the core).  
  - "Original intent is sacred" (the current *function* matters more than the original reason).  

  **Key Insight**:  
  The goal isn’t to preserve the artifact, but to avoid *unknowingly discarding latent function*. Your "reversibility" instinct is adjacent: irreversible changes amplify risk, but the root issue is *ignorance of purpose*.  

  ---

  ### The Decision Procedure: "The Fence Audit"  
  *Time: 30 mins max. Participants: Tech lead, service owner, proposer. Output: Keep/Remove/Investigate Further.*  

  #### Step 1: Define the Fence (3 mins)  
  - **Question**: "What *exactly* is being removed? What does it touch (code, systems, people)?"  
  - **Good Answer**: Concrete boundaries.  
    - *Bad Answer*: "This weird function." → **Stop**: Redefine scope.  

  #### Step 2: Reconstruct the Function (7 mins)  
  - **Question 1**: "What is the *last known purpose*? (Check commits, tickets, monitoring)."  
  - **Question 2**: "What symptoms occur if it’s broken? (Errors, latency, compliance breaches?)"  
  - **Question 3**: "What inputs/outputs/dependencies exist? (Data, APIs, teams)."  
  - **Good Answer**:  
    - "It handled Customer X’s billing edge case in 2015."  
    - "If broken, invoice reconciliation fails."  
  - **Unknown?** → Proceed to Step 3. Don’t stall on "ask the author."  

  #### Step 3: Test Current Relevance (7 mins)  
  - **Question 1**: "Is the original problem *still possible*? (E.g., old customer, deprecated system)."  
  - **Question 2**: "Is the function *redundant*? (New systems, changed requirements)."  
  - **Question 3**: "Does it *accidentally* solve something else? (Check logs, metrics for unexpected use)."  
  - **Good Answer**:  
    - "Customer X churned; the new billing system handles this."  
    - "Logs show zero invocations in 12 months."  
  - **Hard Stop for Keep**: If active use found *and* irreplaceable → **Keep**.  
  - **Uncertain?** → Proceed.  

  #### Step 4: Assess Risk & Reversibility (7 mins)  
  - **Question 1**: "What’s the worst plausible break? (Data loss, outage, $ penalties)."  
  - **Question 2**: "How fast can we revert? (Minutes/days/never?)."  
  - **Question 3**: "Can we mitigate? (Feature flags, dark launches, logging)."  
  - **Good Answer**:  
    - "Breaks invoicing for 5% of customers; revert in 1 hour."  
    - "No mitigation possible; breaks compliance audits."  
  - **Handoff to Humans**: If risk appetite is contested (e.g., "worst case is $10k loss" → product owner decides).  

  #### Step 5: Decide (6 mins)  
  - **Remove if**:  
    - Redundant *and* low risk *or* mitigatable.  
    - Original problem impossible *and* no secondary function.  
  - **Keep if**:  
    - Active critical function *or* high irreversible risk.  
  - **Investigate Further if**:  
    - Unknown function + high risk → Schedule probe (e.g., log injections, shadow mode).  

  ---

  ### Run the Procedure: 3 Test Cases  
  **Assumptions**:  
  - Team has access to logs, metrics, commit history.  
  - "Sign off" requires both tech lead and service owner.  

  #### Case 1: Mystery Billing Function (200 lines, nobody understands)  
  - **Step 1**: Function `applyLegacyAdjustments()`; called during monthly invoicing.  
  - **Step 2**:  
    - Last purpose: Commit says "fix customer ACME’s tax bug (2013)."  
    - Symptoms if broken: Invoice discrepancies.  
    - Dependencies: Billing DB, ACME’s account ID.  
  - **Step 3**:  
    - ACME churned in 2018.  
    - Logs: Called 0 times in 18 months.  
    - Redundant? New tax engine handles all customers.  
  - **Step 4**:  
    - Worst case: Undercharges 3 legacy customers (revertible in 1 day).  
    - Mitigation: Add alerts for invoice mismatches.  
  - **Decision**: **Remove**. It’s dead weight.  

  #### Case 2: Manual Approval in Deploy Process  
  - **Step 1**: Manual "approve" button in CI/CD pipeline pre-production.  
  - **Step 2**:  
    - Last purpose: Prevented 4 outages (2019 tickets).  
    - Symptoms if broken: Untested code in prod.  
    - Dependencies: Senior engineers.  
  - **Step 3**:  
    - Original problem: Flaky tests (now fixed).  
    - Redundant? Staging env + automated canary analysis exist.  
    - Accidental function: Ensures deploy during off-peak (discovered via interviews).  
  - **Step 4**:  
    - Worst case: Bad deploy during peak traffic ($50k revenue loss).  
    - Reversibility: Rollback in 5 mins (automated).  
    - Mitigation: Enforce off-peak deploys via code.  
  - **Handoff to Humans**: Risk appetite. Product says: "Keep for critical services, remove for non-critical." → **Conditional removal**.  

  #### Case 3: Sleep-and-Retry in Data Pipeline (Your "Rip It Out" Case)  
  - **Step 1**: `sleep(300)` after API failures in data sync job.  
  - **Step 2**:  
    - Last purpose: Avoid overloading legacy API (2017).  
    - Symptoms if broken: Data gaps, API bans.  
    - Dependencies: Vendor API.  
  - **Step 3**:  
    - Original problem: Vendor added rate limits in 2020.  
    - Redundant? Pipeline now respects `Retry-After` headers.  
    - Logs: Sleeps cause 20-minute delays; no failures prevented.  
  - **Step 4**:  
    - Worst case: Temporary data delay (no revenue impact).  
    - Reversibility: Revert in 10 mins.  
    - Mitigation: Alert on API bans.  
  - **Decision**: **Remove**. Actively harmful.  

  ---

  ### Where It Misfires or Is Abusable  
  **Misfires**:  
  - **False Negative (Keeps dead code)**: If logs/metrics are incomplete (e.g., function runs yearly). Mitigation: Probe in staging.  
  - **False Positive (Removes critical fence)**: If "redundant" assessment is wrong (e.g., new system has untested edge cases). Mitigation: Dark launch first.  

  **How to Abuse to Block Change**:  
  1. **Demand Perfect Proof**: "You can’t *prove* it’s unused → keep it."  
     - *Counter*: Step 3 requires evidence of use, not proof of absence.  
  2. **Inflate Risk**: "Worst case is everything explodes!" without data.  
     - *Counter*: Step 4 requires "plausible" scenarios backed by logs/tests.  
  3. **Gatekeep Knowledge**: "Only Dave knew, and he’s gone → can’t remove."  
     - *Counter*: Steps 2–3 force reconstruction from artifacts (logs, tickets).  

  **Why It Works**:  
  It replaces "because I said so" with evidence-based checks. The 30-minute limit forces focus, and human judgment is reserved for risk/redundancy ambiguities. By acknowledging *both* the value of legacy and the cost of stagnation, it’s neither reckless nor reactionary.
