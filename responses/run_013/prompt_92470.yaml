answer: |-
  Your frustration is astute—the stalemate between informational semantics (info-sem) and teleosemantics reflects a **fundamental divergence in explanatory priorities** within naturalism, not merely verbal disputes or superficial disagreements. Both aim to ground content in non-semantic facts, but they resolve the tension between **causal covariance** and **normative correctness** in irreconcilable ways. Here’s a concrete diagnosis, using your focal examples:

  ---

  ### **1. The Core Conflict: Divergent Conceptions of "Naturalising"**
  - **Info-sem** treats representation as a *present-day, statistical relation*: a state’s content is fixed by its reliable causal connections to the world.  
    **Problem**: This makes normativity (e.g., misrepresentation) parasitic on statistical norms. If a frog’s fly-detector fires at flies 95% of the time but occasionally at BB pellets, info-sem struggles to say it *mis*represents BB pellets—statistically, it represents *flies-or-BBs* (the disjunction problem).  
    *Reply*: "Optimal conditions" stipulations (e.g., Dretske) are ad hoc unless supplemented by a theory of function.  

  - **Teleosemantics** treats representation as a *historical, functional relation*: content is fixed by what a state was *selected for* indicating.  
    **Problem**: This divorces content from current causal relations. A bee’s dance might have been selected to indicate nectar direction, but if all nectar sources vanish and dances now reliably covary with magnetic fields (due to a geomagnetic shift), teleosemantics insists the dance *misrepresents* magnetic fields as nectar—even if the covariance is perfect.  
    *Reply*: "Normal conditions" (Millikan) appeal to historical environments—but this invites Swampman-style objections: why should selection history trump current reliable covariance?  

  **Diagnosis**: The dispute is **substantive** and stems from incompatible answers to:  
  > *Is the normativity of content grounded in current causal patterns or evolutionary design?*  
  Info-sem ties normativity to *statistical deviation*; teleosemantics to *functional failure*. Neither can fully absorb the other’s insights without collapsing into its rival.  

  ---

  ### **2. Consumer Teleosemantics: A Refinement, Not a Revolution**  
  Your classmate’s proposal (e.g., Millikan, Papineau) shifts focus from the producer (e.g., a perceptual state) to the consumer (e.g., a motor system using that state). Content is fixed by what the consumer needs to "do its job" (e.g., the frog’s tongue-snapping mechanism requires *flies* to succeed, not BBs).  
  - **Why it’s still teleosemantics**: It relies on the *historical selection* of the consumer mechanism. Without evolution, Swampman’s "consumer" systems lack proper functions.  
  - **Advantage**: It handles the disjunction problem better. The frog’s detector firing at BBs fails the consumer’s function (eating BBs doesn’t aid survival), so it represents *flies* non-disjunctively.  
  - **Limitation**: It inherits teleosemantics’ core issue: systematic error is possible (e.g., consumers selected in environments where F was always present might misrepresent G as F in new contexts).  

  **Verdict**: This is **teleosemantics refined**, not functionalism or a third paradigm. It sidesteps producer-side objections but doesn’t resolve the historical vs. present tension.  

  ---

  ### **3. The Hidden Knot: Can Causality Ground Normativity?**  
  The impasse persists because both approaches face a **dilemma for naturalism**:  
  - **Info-sem** prioritises current causation but cannot derive *ought* from *is*: reliable covariance describes what *is* tracked, not what *should* be tracked.  
  - **Teleosemantics** imports normativity via evolution—but this assumes biological functions are naturalistically sound (which critics like Rosenberg dispute).  

  **Key Insight**: The stalemate reveals an **explanatory gap** in naturalism itself. Teleosemantics "solves" misrepresentation by appealing to historical purposes, but this only works if purposes are naturalistically reducible. Info-sem avoids history but cannot explain why representation isn’t just reliable causation.  

  ---

  ### **4. Paths to Progress**  
  Progress requires **re-framing the question**, not new counterexamples:  
  - **Abandon content monism**: Perhaps "representation" isn’t unitary. Sensory states might fit info-sem; beliefs might require teleosemantics (Shea).  
  - **Interrogate naturalism**: Is normativity reducible? If not, naturalising content may be misguided (McGinn).  
  - **Formal/empirical bridges**:  
    - Use computational neuroscience to test whether neural coding resembles covariance (info-sem) or prediction-error minimization (teleo-friendly).  
    - Model evolution in silico: Can algorithms with no selection history exhibit content (à la Swampman)? If so, teleosemantics is in trouble.  

  ---

  ### **Why the Debate Feels Stuck**  
  Each side’s "solution" to misrepresentation/disjunction appears question-begging because:  
  | **Problem**         | **Info-sem Response**                          | **Teleosemantics Response**               |  
  |----------------------|-----------------------------------------------|------------------------------------------|  
  | **Misrepresentation** | "Occurs in non-optimal conditions" (circular) | "Failure of proper function" (ignores current reliability) |  
  | **Disjunction**       | "Covariance under idealisation" (vague)       | "Consumer needs disambiguate" (history-laden) |  

  Both assume their preferred *explanans* (causation/history) is primitive. Until this is challenged, dialectical stalemate is inevitable.  

  **In short**: The dispute is substantive and hinges on whether normativity requires historical teleology. Genuine progress demands either a pluralistic approach or a deeper critique of naturalism’s limits—not just tweaking existing theories. Your essay could provocatively argue that the persistence of this stalemate signals a flaw in the naturalist premise itself.
