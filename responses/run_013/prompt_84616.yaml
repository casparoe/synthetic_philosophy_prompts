prompt: |-
  I'm running a 90-minute reading group on Quine's indeterminacy of translation for a mixed bunch — two linguists, a psychologist, a couple of philosophers who've never opened Word and Object — and I need a teaching plan, not the explanation itself. Order of ideas first: my instinct is that stimulus meaning has to come before the gavagai scenario, but I can't decide whether the 'no fact of the matter' claim should land early (so everything after it has a point) or late (so it doesn't get absorbed as a slogan), and I don't want them nodding along to 'translation is underdetermined by the evidence', because that's a claim they already believe and it isn't the one Quine is making. For the carrying example I want to ditch the rabbit — they've all half-heard it — and use my own instead: a field linguist with a single word, recorded only when a particular bird calls at dawn, provisionally glossed as 'the bird', where the same evidence supports 'the call', 'dawn', 'time to get up' and a temporal-stage reading of the bird. Does that actually carry the thing, or does it quietly collapse — because some of those rivals are separable by more fieldwork and some aren't, and maybe that split is exactly the lesson. So: what the example needs to have and lack, the order, the misconceptions to expect (my guesses: 'so translation is impossible', 'so it's just about cultural distance', 'so meaning is just use'), where in the sequence to head each off, one question to end on that tells me whether they've got the constitutive claim rather than the epistemic one, and what I should openly refuse to cover in 90 minutes. Also tell me wether to mention Quine's narrower point about reference (proxy functions) or whether that'll just muddy it.
