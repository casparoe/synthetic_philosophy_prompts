answer: |-
  Here’s a structured 90-minute teaching plan focusing on conceptual sequencing, avoiding pitfalls, and leveraging your bird-call example. Prioritize **clarity on the constitutive claim** over comprehensiveness.

  ---

  ### **Teaching Plan: Quine’s Indeterminacy of Translation**
  **Goal:** Distinguish *indeterminacy* (no fact of the matter) from *underdetermination* (epistemic gap), using behavioral constraints.

  #### **Order & Timing**  
  1. **Intro: The Empiricist Starting Point (10 mins)**  
     - Frame Quine’s project: How can we ground meaning in observable behavior?  
     - Introduce **stimulus meaning**: Define it as the set of stimuli triggering assent/dissent to a sentence.  
     *Why first?* Without this, "gavagai" is just about words, not the behaviorist bedrock.  

  2. **The Gavagai Scenario Revisited (Quickly) → Your Bird-Call Example (15 mins)**  
     - Briefly recap gavagai (30 seconds) to acknowledge it, then pivot:  
     - **Your example**: Field linguist hears word X *only* when a specific bird calls at dawn.  
     - Rival translations: "The bird," "the call," "dawn," "time to get up," "bird-stage-at-dawn."  
     - **Key move**: Show *all* are compatible with *current* evidence (stimulus meaning).  
     - *Activity*: Ask participants: "Which would you choose? Why?" (Surface intuitions about evidence).  

  3. **The Crucial Turn: "No Fact of the Matter" (20 mins)**  
     - **Land the claim here**: Quine’s point is that *even with all possible behavioral evidence*, rival manuals could fit perfectly.  
     - Contrast with underdetermination:  
       - Underdetermination: "We need more data to know if it’s ‘bird’ or ‘call’."  
       - Indeterminacy: "There’s no ‘correct’ answer even with all data."  
     - **Use your example**:  
       - Some rivals *are* separable with more fieldwork (e.g., "dawn" vs. "bird" – test at dusk).  
       - Others *aren’t*: "The bird" vs. "temporal bird-stage" – same stimuli forever.  
     - **The lesson**: Indeterminacy arises where behavioral evidence *cannot* decide between rivals, even ideally.  

  4. **Clarifying the Constitutive Claim (15 mins)**  
     - Emphasize: This isn’t about ignorance or cultural gaps – it’s about what meaning *is* (or isn’t).  
     - Quine’s view: Meaning is fixed *only* by dispositions to verbal behavior. Where behavior underdetermines, *there is no meaning fact*.  
     - **Block misconceptions**:  
       - ✘ "Translation is impossible": → Quine says we *can* translate, but multiple ways are equally valid.  
       - ✘ "It’s just about cultural distance": → Show it applies even to "translation" between identical speakers.  
       - ✘ "Meaning is just use": → Wittgensteinian "use" implies norms; Quine reduces to stimulus-response.  

  5. **Deep Application & Q&A (25 mins)**  
     - Revisit your example: "Bird" vs. "bird-stage" as *metaphysically* rival ontologies (like gavagai’s rabbit/undetached-part).  
     - **Key closing question** (tests constitutive understanding):  
       > *"Could we ever design an experiment to determine whether the native means ‘the bird’ or ‘the bird-stage’? If not, why?"*  
       - *Correct takeaway*: No – because all behavioral evidence (assent/dissent) is identical for both.  
     - Open Q&A: Preempt drift into other Quinean topics (see below).  

  #### **What to Ditch in 90 Mins**  
  - **Proxy functions**: Mention *once* in closing if asked ("Quine extends this to reference: even ‘rabbit’ could map to ‘rabbit-stage’ via proxies"). Do **not** explain – it muddies the core point.  
  - **Holism/confirmation theory**: Too big a detour.  
  - **Chomsky’s criticisms**: Focus on Quine’s positive argument.  
  - **Solutions to indeterminacy**: Not the goal.  

  ---

  ### **Why This Works**  
  - **Bird-call example strengths**:  
    - Clearly isolates stimulus meaning (single word, fixed stimulus conditions).  
    - Rivals include *empirically separable* ("dawn"/"bird") vs. *deeply indeterminate* ("bird"/"bird-stage") pairs – **the split is pedagogically crucial**.  
    - Avoids rabbit’s baggage while replicating its logic.  
  - **"No fact" placement**: Early enough to frame later discussion, but *after* behavioral constraints are grasped (avoiding slogan-status).  
  - **Misconception handling**: Addressed *proactively* when they arise in the flow (e.g., when discussing rivals in Part 2).  

  ### **Expected Pitfalls & Responses**  
  - **"So it’s subjective?"** → No: Translation is objective (based on behavior), but non-unique.  
  - **"But we use context!"** → Context is more stimuli! Still part of behavioral evidence.  
  - **Philosophy folk saying "This is obvious"** → Press: "Is there a fact about ‘bird’ vs. ‘bird-stage’? If yes, what is it made of?"  

  End by stressing: Quine isn’t saying translation is hard – he’s saying meaning *itself* has no reality beyond behavior. If they leave debating whether "bird-stage" is a live option, you’ve succeeded.
