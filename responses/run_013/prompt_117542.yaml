answer: |-
  ### Essay Question  
  **"In *The Querist*, Berkeley argues that money is 'altogether that of a ticket or counter' (Query 23) and that national wealth depends on the 'opinion or will of the people' (Query 33). Assess whether these claims are consistent with his broader philosophical idealism. Specifically, can Berkeley’s view of money as a conventional tool grounded in collective belief avoid collapsing into arbitrariness? In your response, explain how (or whether) his metaphysics informs his monetary theory and whether his account successfully explains the *stability* of money’s value without appealing to intrinsic properties of gold or silver."**

  ---

  ### Model Answer (Approx. 850 words)  
  Berkeley’s monetary theory in *The Querist* appears to extend his idealism into the socioeconomic sphere, but it faces a critical tension: if money’s value rests *solely* on collective opinion, it risks instability. I argue that Berkeley’s idealism *does* provide a framework to stabilize monetary value by grounding "opinion" in divinely ordered social utility, preventing collapse into arbitrariness. His metaphysics of perceptual reliability and divinely sustained order offers resources to anchor money’s function, even as he rejects intrinsic value.  

  **Idealism and the Nature of Money**  
  Berkeley’s idealism denies material substance, reducing objects to "collections of ideas" dependent on perception. Analogously, he dismisses money’s "intrinsic value" (Query 23), framing it as a "ticket or counter" (Query 25)—a signifier with no inherent worth. Like sensory ideas, money gains meaning relationally: it is an "exponent" of proportional value (Query 25) facilitating exchange. This nominalism mirrors idealism’s rejection of abstract, independent realities; just as a tree is its perceptible qualities, money is its social function. Crucially, both systems rely on divine governance: God orders perceptions, and for Berkeley, Providence guides human industry through monetary conventions.  

  **Opinion as Grounded, Not Arbitrary**  
  The claim that wealth hinges on "opinion or will" (Query 33) risks circularity: if value requires belief, what sustains belief? Berkeley avoids arbitrariness by tethering opinion to *industry*. Money’s utility lies in "stir[ring] up industry" (Query 5), enabling participation in labor’s fruits. Gold/silver have no "vertue" beyond this function (Query 32). Thus, "opinion" is not capricious but *instrumental*: it reflects collective recognition of money’s efficacy in coordinating labor. Like the regularity of sensory ideas (which require divine consistency), monetary stability emerges from its embeddedness in a productive social order. Money is a "pledge" (Query 23) not because of metal, but because mutual trust in its industry-stimulating role is sustained by shared needs—a structure Berkeley implicitly attributes to divine design.  

  **Stability Through Social Teleology**  
  Berkeley’s idealism resolves the collapse problem by anchoring convention in teleology. Perceptual reality persists because God wills coherent experiences; similarly, money’s value persists because society *requires* a medium to "enable men mutually to participate" in labor (Query 5). The "will of the people" (Query 33) is thus constrained by practical necessity: if money fails to incentivize industry, opinion shifts, but this very feedback loop ensures conventions adapt to sustain functionality. For instance, calling money a "counter" (Query 25) emphasizes its role in a system of accountability, where value derives from labor reciprocity—not subjective whim. This parallels idealism’s divine language metaphor: just as God communicates via sensory "signs," money is a human-devised sign system for economic coordination. Collapse is avoided because utility, like divine law, imposes stability.  

  **Objection and Response**  
  A powerful objection arises: if value rests on opinion, hyperinflation or bank runs prove beliefs *can* unravel independently of industrial utility, exposing Berkeley’s conventionalism as fragile. Does this not concede that gold/silver’s scarcity—an "intrinsic" property—is needed to constrain arbitrariness? Berkeley’s response lies in Query 32: precious metals only "set people at work" *if* they are accepted as tokens. Scarcity alone cannot create value without social agreement (e.g., useless minerals are not money). Instability arises not from conventionalism itself, but from *misuse* of money (e.g., hoarding or speculation divorcing tokens from industry). His proposed Irish bank—issuing paper backed by land—shows that stability requires tethering tokens to real productivity (labor/land), not metal. Thus, belief collapses only when money’s instrumental link to industry is broken, not because conventions are inherently unstable.  

  **Conclusion**  
  Berkeley’s monetary theory coheres with his idealism: both replace intrinsic properties with relational, divinely underwritten systems. Money’s value is stable not despite its conventional nature, but *because* it serves a providentially ordered social purpose—channeling opinion toward collective industry. His nominalism avoids collapse by making money’s worth as interdependent with human activity as ideas are with perception. The "ticket" has power because society, like God, institutes reliable systems for flourishing.  

  ---

  ### Marking Scheme (20 points total)  
  **1. Exposition of Berkeley’s Monetary Claims (4 points)**  
  - **Full marks (4)**: Clearly defines money as a "ticket/counter" (Q23, Q25) and ties "opinion/will" (Q33) to industry (Q5, Q32). Distinguishes nominalism from intrinsic value.  
  - **Common mistake (−2)**: Vague summary; conflates "opinion" with individualism or ignores industry link.  

  **2. Connection to Idealism (4 points)**  
  - **Full marks (4)**: Explains parallels (e.g., money as relational sign vs. ideas as percept-dependent; divine order in both). Avoids claiming *direct* derivation.  
  - **Common mistake (−2)**: Superficial reference to "idealism" without textual/metaphysical ties; asserts independence without argument.  

  **3. Analysis of Tension/Collapse Risk (4 points)**  
  - **Full marks (4)**: Articulates the "circularity" problem: how can opinion ground value without metal? Shows why this threatens stability.  
  - **Common mistake (−2)**: Ignores tension; assumes "opinion" = arbitrary without critique.  

  **4. Argument for Stability (4 points)**  
  - **Full marks (4)**: Uses industry (Q5/Q32) and social utility to show opinion is *constrained*. Links to divine order (implied).  
  - **A-grade move**: Teleological argument (money’s purpose prevents collapse).  
  - **B-grade gap**: Notes industry link but misses providential parallel.  

  **5. Engagement with Objection (4 points)**  
  - **Full marks (4)**: Raises instability objection (e.g., hyperinflation); rebuts using Berkeley’s emphasis on misuse (not convention’s flaw) and productivity anchors (e.g., land-backed money).  
  - **Common mistake (−2)**: Dismisses objection; invents non-textual solutions (e.g., "state enforcement").  

  **A (18–20) vs B (16–17) Distinction**:  
  - **A**: Explicitly ties "opinion" to divine/social order (§2, §5); shows how collapse objection *presumes* intrinsic value.  
  - **B**: Covers all points but lacks depth in §2 or §5 (e.g., notes industry utility but not providential framework).
