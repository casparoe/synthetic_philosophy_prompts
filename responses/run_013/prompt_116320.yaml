  We are going to design a classroom activity to illustrate the tension between three principles:
   (1) Accept any claim that clears a threshold (say, p>0.95).
   (2) Accept the conjunction of any set of accepted claims.
   (3) Avoid accepting contradictions.

   We have two rounds: a lottery round and a preface round.

   Setup:
   - Round 1: Lottery
     - There are 20 tickets, one winner. So for each ticket, P(ticket i loses) = 19/20 = 0.95.
     - Each student privately declares a set of claims of the form "ticket k loses" (for k from 1 to 20).
     - The winning ticket is drawn at the end of the round.

   - Round 2: Preface
     - There is a book with, say, 10 chapters. Each chapter is independent and has a 90% chance of being correct (so 10% chance of error).
     - Claims are of the form "Chapter j is correct".
     - We note: P(Chapter j is correct) = 0.9 for each j.

   Auditor rule: For any set S of claims that you declare, you are also taken to have declared the conjunction of all claims in S. So if you declare a set of claims, you are also committed to the claim that all of them are true.

   Scoring rule: We want to encourage students to accept claims that are likely to be true and to avoid accepting claims that are false. We'll use a simple scoring rule:
     - For each claim you accept (including the conjunctions you are committed to), if it is true you get +1 point, if false you get -2 points.
     - Why -2? Because we want the risk of accepting a false claim to be higher than the reward for a true one. This will make accepting a large number of claims that are individually likely but collectively risky a bad idea.

   We'll use tokens to represent points. Each token is worth a small amount (maybe 1 token = 1 cent, but we can adjust so that it's cheap but meaningful). At the end, they can trade tokens for candy or something.

