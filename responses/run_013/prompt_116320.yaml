  ### Activity Design: The Acceptance Trilemma Game

  #### **Structure**
  - **Duration**: 90-minute session, divided into two rounds (Lottery and Preface) with debrief.
  - **Participants**: 12 first-year PhD students, comfortable with probability.
  - **Materials**: 
    - **Round 1 (Lottery)**: Hat with 20 tickets (1 winner, 19 losers).
    - **Round 2 (Preface)**: Simulated book with 10 chapters (each independently 95% likely correct).
    - **Tokens**: Cheap tokens (e.g., poker chips) for scoring (no real money).
    - **Sheets**: Students privately declare sets of claims (e.g., "Ticket 3 loses" or "Chapter 5 is correct").
  - **Scoring Rule** (same for both rounds):
    - For each individual claim: **+1 token if true, -2 tokens if false**.
    - For the conjunction of the entire declared set: **+1 token if true, -20 tokens if false**.
    - *Auditor rule*: Declaring a set implies asserting the conjunction of all claims in it.
    - **Example**: 
      - Declare one claim: If true, score = `+1 (claim) +1 (conjunction) = +2`. If false, `-2 (claim) -20 (conjunction) = -22`.
      - Declare two claims: If both true, `+2 (claims) +1 (conjunction) = +3`. If one false, `+1 (true) -2 (false) -20 (conjunction) = -21`.

  ---

  ### **Rounds**
  #### **Round 1: Lottery Paradox Simulation**
  - **Setup**:
    - 20 tickets in a hat; 1 winner, 19 losers.
    - Claims: "Ticket *k* loses" for tickets 1–20 (P(true) = 19/20 = 0.95).
  - **Student Task**:
    - Privately declare a set of claims (e.g., {Ticket 1 loses, Ticket 2 loses}).
    - *No restrictions*: Can declare 0 to 20 claims.
  - **Scoring**:
    - Draw winning ticket openly.
    - Score each student:
      - Individual claims: +1 per true, -2 per false.
      - Conjunction: +1 if all declared claims true, -20 otherwise.
  - **Expected Behavior**:
    - Submitting 1–2 claims is profitable (expected score: 0.6–0.8 tokens).
    - Submitting 3+ claims is unprofitable (expected score ≤ -0.25 tokens).
    - *Why?* The claims form a partition—only one ticket wins. Declaring many claims risks including the winner, making one claim false and the conjunction false (high penalty).

  #### **Round 2: Preface Paradox Simulation**
  - **Setup**:
    - 10 independent chapters, each 95% likely correct (simulate correctness with RNG, e.g., 1–95 = correct, 96–100 = error).
    - Claims: "Chapter *j* is correct" for chapters 1–10 (P(true) = 0.95).
  - **Student Task**:
    - Privately declare a set of claims (e.g., {Chapter 1 correct, Chapter 2 correct}).
  - **Scoring**:
    - Simulate chapter correctness openly (roll dice/RNG per chapter).
    - Score same as Round 1.
  - **Expected Behavior**:
    - Submitting any number of claims (1–10) is profitable (expected score: 0.55–1.07 tokens).
    - *Why?* Independence allows high chance of all claims being true. Conjunction penalty (-20) is outweighed by rewards for many true claims.

  ---

  ### **What Will Predictably Go Wrong & How to Handle It**
  1. **Students declare nothing**:
     - **Why**: Risk-aversion ("I’ll score 0 and avoid penalties").
     - **Handling Live**:
       - Before starting, hint: "Doing nothing guarantees 0 points. Is there a better option?"
       - After scoring, ask: "Who scored 0? What did you gain versus declaring one claim?"
       - Highlight: Declaring 1 claim has positive expected value in both rounds (0.8 tokens). Doing nothing is dominated.

  2. **Lottery round: Students declare too many claims (3–19) and lose**:
     - **Why**: Underestimating conjunction risk ("Each claim is 95% likely!").
     - **Handling Live**:
       - When scoring, emphasize: "If you declared 3+ claims, you likely got a false claim and a -20 penalty for the false conjunction."
       - Show expected value math: Declaring 3 claims = -0.25 tokens on average.

  3. **Preface round: Students declare few claims (1–2) and miss gains**:
     - **Why**: Overgeneralizing from Lottery round ("Big sets are dangerous").
     - **Handling Live**:
       - Contrast structures: "In Lottery, claims are mutually exclusive. In Preface, they’re independent. Did that affect your strategy?"
       - Reward students who declared many claims: "Who declared 5+ and still profited? Why?"

  4. **Confusion about scoring/conjunctions**:
     - **Why**: Conjunction penalty feels abstract.
     - **Handling Live**:
       - Use a simple example before starting: "Declaring two claims: If both true, +3. If one false, -21."
       - After rounds, show scoring calculations on the board for 1–2 student examples.

  ---

  ### **Debrief: Mapping the Trilemma & Structural Difference**
  1. **The Three-Way Squeeze**:
     - Principle 1: **Threshold Acceptance** (accept claims >95% likely).  
       Principle 2: **Conjunction Closure** (accept conjunctions of accepted claims).  
       Principle 3: **Consistency** (no contradictions).  
     - Activity shows: You can’t satisfy all three. 
       - In Lottery, accepting many individually likely claims (Principle 1) forces a contradiction (violates Principle 3) via conjunction (Principle 2).

  2. **Why Lottery vs. Preface Feel Different**:
     - **Lottery**: Claims are a **partition** (exactly one winner). 
       - Rejecting 19 tickets = accepting the 20th wins.  
       - Declaring many claims "rules out" the winner, creating a contradiction.
     - **Preface**: Claims are **independent** (errors don’t force a specific "winner"). 
       - No equivalence between rejecting claims and asserting an error.  
       - Conjunction is likely true for small sets, and rewards outweigh risks for large sets.

  3. **What the Activity Can’t Reproduce**:
     - **Degrees of belief vs. flat acceptance**: 
       - The game forces binary "accept/reject," hiding nuances of probabilistic confidence.  
       - Students might note: "In Preface, I felt okay about 5 claims but not 10." Debrief: "Real agents use degrees of belief—acceptance thresholds simplify, but at a cost."

  ---

  ### **Logistics & Adjustments**
  - **Time Allocation**:
    - Setup: 5 min  
    - Round 1 (Lottery): 15 min (declare, draw, score)  
    - Round 2 (Preface): 15 min (declare, simulate, score)  
    - Debrief: 30 min  
  - **Tuning the Numbers**:
    - Lottery: 20 tickets ensures P(individual true) = 0.95, but P(conjunction true) drops to 0.05 for 19 claims.  
    - Preface: 10 chapters at 95% keeps P(all true) = 0.6, so conjunction penalties are rare enough for net gains.  
  - **Token Economy**:
    - Use cheap tokens (1 token ≈ $0.01) to avoid real gambling.  
    - Trade tokens for candy/post-class bragging rights to incentivize engagement.  

  This design forces the trilemma into sharp relief: Students *feel* the Lottery’s "rigged trick" (partition forces contradictions) versus the Preface’s permissibility of large-scale acceptance (no partition escape). By confronting their own strategies, they’ll grasp why the preface paradox "feels fine" structurally—and why that’s a problem for formal acceptance rules.
