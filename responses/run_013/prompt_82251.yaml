prompt: |-
  i'm trying to settle an arguement with a friend about whether credences have to be single numbers. she thinks a range is not just allowed but sometimes mandatory, i think that's indecision dressed up in interval notation, and we keep going in circles because each of us argues from the one case where the other side's view does something ugly. so before i pick a side i want the actual spec. write out the desiderata any theory of credence-under-ambiguity has to meet: the cases it has to get right, the distinctions it can't collapse, the structural facts it can't contradict, and the consideration behind each requirement. then tell me which of those are non-negotiable and which are just house rules of one camp, and flag any two that you suspect can't be satisfied together -- that's the part i actually want. the purpose is narrow: i want a standard good enough to tell me when a range is *required* versus merely permitted, and when my friend is just avoiding a number.

  some things i want on the list, because they're what we keep tripping on:

  - the case where two quantities are independent of each other once you condition on a shared unknown (a coin with an unknown bias, say), and then learning something about one of them makes your range for the other *wider* than it was before you learned anything. is that a requirement, or an artefact of representing the state as an interval?

  - the case where the imprecision sits one level up: i'm not unsure about the chance, i'm unsure which of two ranges of chances i'm in, and there's no fair coin to average over. do i get to have a non-convex set of probabilities, and if you tell me to just take its convex hull, what exactly did i lose?

  - the decision side: i keep hearing that any rule for acting on a set either collapses back to a sharp number or lets a bundle of bets i'd each accept add up to something i'd reject. if that's a real result, put it on the list as a requirement; if it's a confused complaint, say why.

  - whether more evidence is allowed to make things worse, i.e. whether the range is required to shrink as i learn.

  - what the theory says the range *is* -- a psychological fact, a summary of the evidence, a set of sharp opinions i haven't chosen between, or a fiction for deciding. i dont see how you pick desiderata without settling that first.

  no reading lists please. a table at the end is fine if it helps -- the usual families (sets of probabilities, plain intervals, belief-function-ish things) against the requirements -- but the list is the deliverable.
reasoning: |-
  Okay, the user is in a debate with their friend about whether credences must be single numbers or can be intervals. They want a clear set of criteria to determine when a range is necessary versus optional. Let me start by understanding their key concerns.

  First, they mention scenarios where learning something causes the range to widen. That seems important for handling ambiguity. They also talk about imprecision at a higher level—like being unsure between two ranges. How should non-convex sets be handled? Then there's the decision-making problem: if using sets, can you avoid sure losses? And whether more evidence can make the range larger, which conflicts with typical Bayesian updating. Finally, they question the ontological status of ranges—psychological, evidential, etc.—which affects the desiderata.

  I need to outline the core requirements any theory must meet. Desideratum 1 should handle basic uncertainty, like coin flips with unknown bias. A single number might oversimplify here. Desideratum 2 is about representing higher-order uncertainty without forcing convexity. Non-convex sets might be necessary for cases where probabilities are disjoint. 

  Desideratum 3 deals with updating. Learning about one variable affecting another's range width is crucial. If ranges don't allow this, it's a flaw. Desideratum 4 is decision consistency. Avoiding sure loss is non-negotiable, but some frameworks like sets of probabilities can achieve this through E-admissibility. 

  Desideratum 5 focuses on evidence dynamics. Ranges shouldn't necessarily shrink with more data; ambiguous evidence might widen them. Desideratum 6 is about what ranges represent. This is a house rule. If ranges are psychological, they can be non-convex; if evidential, they might need convexity. 

  Now, tensions: Non-convex sets (D2) might conflict with decision rules (D4) if E-admissibility isn't applied. Also, higher-order uncertainty (D2) and updating (D3) together can cause ranges to widen, which might contradict intuitive shrinking expectations (D5), but that's acceptable under ambiguity.

  For the user's main question: ranges are mandatory when evidence is ambiguous (D1, D3, D5) or with higher-order uncertainty that's non-convex (D2). Using a single number in these cases oversimplifies. But if the friend uses ranges for indecision rather than ambiguity, that's where the user's critique holds. The key is whether the range reflects genuine ambiguity or just unwillingness to commit.
answer: |-
  Here's a specification of desiderata for theories of credence-under-ambiguity, designed to adjudicate when a range is *required* vs. merely permitted. Requirements are categorized by negotiability, and key tensions are identified.

  ### Core Desiderata (Non-Negotiable Foundations)

  1.  **Representing Basic Ambiguity:**
      *   **Case:** Unknown bias of a coin. I know nothing except it's not demonstrably fair. My credence for Heads shouldn't be forced to 0.5.
      *   **Requirement:** The formalism *must* allow credences that are not sharp (single numbers) when evidence is genuinely ambiguous/unspecific.
      *   **Why Non-Negotiable:** Forcing a sharp number misrepresents the lack of evidence and implies unwarranted precision. A formalism failing here is inadequate for ambiguity.

  2.  **Higher-Order Uncertainty & Non-Convexity:**
      *   **Case:** I know the chance of event E is either in [0.1, 0.3] or [0.7, 0.9] (e.g., based on two conflicting expert reports), and I have no basis to average or weight them. My overall credence for E should reflect this gap.
      *   **Requirement:** The formalism *must* be able to represent non-convex sets of probabilities (e.g., having a "gap").
      *   **Why Non-Negotiable:** Convexifying ([0.1, 0.9]) destroys crucial information about the *structure* of the ambiguity (the bimodality/gap). It falsely implies intermediate probabilities are plausible.

  3.  **Updating Can Widen Intervals:**
      *   **Case:** Two coins with shared unknown bias θ. Initially, my credence for each Heads is imprecise (e.g., [0.4, 0.6]). I flip Coin1 and get Tails. Conditioning on this, my credence for Coin2 Heads *should* become wider (e.g., [0.3, 0.7]) if θ was very uncertain, reflecting increased uncertainty about θ after seeing evidence inconsistent with high θ values.
      *   **Requirement:** Conditioning on evidence *must* be able to *increase* the imprecision (widen the interval/set) of credences for other, related propositions.
      *   **Why Non-Negotiable:** This is a fundamental consequence of ambiguity interacting with conditional dependence. A theory forbidding this cannot model learning under ambiguity correctly. *(This directly addresses one of your tripping points)*.

  4.  **Decision Consistency (Avoiding Sure Loss):**
      *   **Case:** A rule for acting based on an imprecise credence (e.g., accepting a bet if it's favorable for *some* probability in the set).
      *   **Requirement:** The decision rule coupled with the credence representation *must not* lead to accepting a finite collection of bets which together guarantee a loss (a "Dutch Book").
      *   **Why Non-Negotiable:** Vulnerability to a Dutch Book indicates irrationality. This is a bedrock requirement for coherence. *(Addresses your "decision side" concern - it's a real requirement, but avoidable with careful rules like E-admissibility)*.

  ### Important Desiderata (Often Contentious "House Rules")

  5.  **Evidence Can Increase Imprecision:**
      *   **Case:** I receive highly ambiguous evidence (e.g., conflicting expert testimonies, a blurry photo).
      *   **Requirement:** The formalism *should allow* my credence range to become *wider* after acquiring new evidence if that evidence *increases* the ambiguity.
      *   **Why House Rule:** While required for updating complex models (D3), whether *basic* evidence acquisition can directly cause widening is debated. Frequentists might see it as confusion, while ambiguity theorists see it as essential. It's often a consequence of D1-D3. *(Addresses your "worse with evidence" point)*.

  6.  **Interpretation of the Range:**
      *   **Case:** What *is* the interval [0.4, 0.6] for Heads?
      *   **Options:** Psychological indecision? Summary of evidential support? Set of precise credences I haven't chosen? Fiction for decision-making?
      *   **Requirement:** (Not a single requirement) The chosen interpretation *must be consistent* with the formalism's rules (especially updating D3 and decisions D4) and dictates how "house rules" like D5 are viewed. Psychological views tolerate non-convexity (D2); evidential views often demand convexity. *(Crucial for resolving disagreements - often the root cause)*.

  7.  **Convexity Requirement:**
      *   **Case:** After D2 (higher-order uncertainty).
      *   **Requirement:** (A specific house rule) Credence sets *must* be convex (intervals). Non-convex sets are prohibited.
      *   **Why House Rule:** Motivated by decision rules (D4) or specific interpretations (D6 - e.g., "summary of evidence"). Advocates argue non-convexity is unnecessary or psychologically implausible. Opponents argue it violates D2.

  ### Key Tensions (Where Desiderata Conflict)

  1.  **Non-Convexity (D2) vs. Simple Decision Rules (D4):**
      *   **Conflict:** Representing genuine non-convex beliefs (D2) is hard to reconcile with *naive* decision rules (e.g., "maximize minimum expected utility" or "use the whole set"). Naive rules often lead to indecision or potential Dutch Books if the set isn't handled carefully.
      *   **Resolution:** Sophisticated decision rules like **E-admissibility** (accept a bet if it's expected utility maximizing for *some* probability in the set) satisfy D4 *without* requiring convexity. This preserves D2. Convexity (D7) is one way to avoid the problem, but not the only way. *(This addresses your "bundle of bets" concern - it can be avoided with E-admissibility)*.

  2.  **Higher-Order Uncertainty (D2) & Updating Widening (D3) vs. Intuition of "Learning":**
      *   **Conflict:** D3 (widening on update) and representing complex ambiguity (D2) can feel counter-intuitive ("How can learning make me *less* sure?"). This clashes with a simplistic view that evidence *always* reduces uncertainty.
      *   **Resolution:** This tension highlights the difference between *risk* (known probabilities) and *ambiguity* (unknown probabilities). Under ambiguity, evidence *can* reveal deeper uncertainty. D3 and D2 are correct for ambiguity; the intuition applies best to risk. This is a feature, not a bug, of ambiguity models. D5 follows naturally.

  ### When is a Range *Mandatory*?

  A range is **mandatory** when:
  1.  Evidence is fundamentally ambiguous/unspecific (D1 - no basis for a sharp number).
  2.  Higher-order uncertainty involves genuinely disjoint possibilities that cannot be fairly averaged (D2 - requires non-convexity, which implies a range but is stricter).
  3.  The structure of the problem dictates that learning *must* widen intervals for related quantities (D3 - a consequence of ambiguity + dependence).

  ### When is Your Friend "Avoiding a Number"?

  Your friend is likely avoiding a number **unjustifiably** if:
  *   They insist on a range *only* due to **indecision** or **reluctance to commit** to a sharp estimate, *despite* evidence being sufficient to warrant one (violates the spirit of D1).
  *   They interpret the range *purely* psychologically (D6) but refuse to act on *any* sharp probability within it for decisions (potentially violating coherent decision rules D4 if not using E-admissibility).
  *   They insist on non-convexity (D2) where the underlying ambiguity doesn't actually support disjoint sets (e.g., forcing a gap where none exists based on evidence).

  ### Summary Table: Families vs. Desiderata

  | Desideratum          | Sets of Probabilities (SoP) | Intervals (Convex) | Belief Functions | Notes                                                                 |
  | :------------------- | :-------------------------- | :----------------- | :--------------- | :-------------------------------------------------------------------- |
  | **D1: Basic Ambiguity** | ✅ Easily                   | ✅ Easily          | ✅ Easily        | Core strength of all imprecise models.                                |
  | **D2: Non-Convexity**   | ✅ **Strong**               | ❌ **Fails**       | ⚠️ Limited       | *Key differentiator.* Intervals/Convex models fail here. SoP excels.  |
  | **D3: Update Widening** | ✅ Naturally                | ✅ Possible        | ✅ Naturally     | Follows from conditioning each probability.                           |
  | **D4: Avoid Dutch Book**| ✅ **With E-admissibility** | ⚠️ Depends on rule | ⚠️ Depends on rule | Naive rules fail. E-admissibility works for SoP. Convexity helps some rules. |
  | **D5: Evidence Widening**| ✅ Naturally                | ✅ Possible        | ✅ Naturally     | Consequence of D1/D3.                                                 |
  | **D6: Interpretation**  | Flexible (Set/Evid/Psy)    | Flexible (Often Evid) | Flexible (Often Psy) | Interpretation choice drives formalism suitability.                   |
  | **D7: Convexity Req.**  | ❌ **Violates**             | ✅ **Satisfies**   | ⚠️ Often convex  | SoP rejects this house rule; Intervals enforce it.                    |

  **Conclusion:** A range is **mandatory** when representing genuine ambiguity lacking a basis for a sharp number (D1), higher-order uncertainty with disjoint possibilities (D2), or dependencies where learning widens uncertainty (D3). **Sets of Probabilities (SoP) with E-admissibility** satisfy all non-negotiable desiderata (D1-D4) and naturally handle D5 and non-convexity (D2). **Convex models (Intervals)** fail D2 and struggle to justify D7 as fundamental. Your friend is correct that ranges are sometimes mandatory (driven by D1, D2, D3), but a single number is sufficient when ambiguity is resolvable or the structure doesn't demand imprecision. The key tension (D2 vs. D4) is resolvable via E-admissibility.
