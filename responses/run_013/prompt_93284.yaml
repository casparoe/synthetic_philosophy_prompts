  Hmm, the user is clearly well-versed in the subject, referencing specific examples like squirrels, bees, and bats. They’ve even tried to find a case where the two explanations yield different predictions but couldn’t. That shows deep engagement. Their frustration isn’t about the science itself but about the meta-issue: why do these camps insist their explanation is the only "real" one when their predictions align?

  The user mentions two common diagnoses they’ve heard: that the dispute is merely verbal or like coordinate systems in geometry. They reject both. The verbal dispute angle doesn’t hold because both sides accept the mechanisms but disagree on what "counts" as explanation. The coordinate analogy fails because choosing one description affects what scientists notice or investigate next. 

  So, what’s really bugging them? They want a term for this specific type of irreconcilable yet non-empirical disagreement. They’re hinting at a deeper philosophical puzzle about explanation and scientific framing. Their unspoken need might be to understand how science handles such entrenched, non-falsifiable divides—perhaps to better navigate literature or clarify their own thinking.

  Now, digging into philosophy of science. I recall "underdetermination" (Quine), where evidence can’t decide between theories. But here, it’s not about evidence—it’s about explanatory framing. "Explanatory pragmatism" (Van Fraassen) fits better: explanations answer context-dependent questions. A group-benefit description might satisfy a conservationist asking "Why does this species persist?", while gene-focused answer suits a geneticist asking "How did evolution select this trait?" 

  Another angle: "conventionalism" (Poincaré), where choices between equivalent descriptions are conventional. But the user noted these choices aren’t neutral—they guide research. That leans toward "perspectivism" (Giere), where frameworks highlight different aspects of reality. The "gene’s-eye view" vs. "group adaptation" aren’t just labels; they’re lenses shaping inquiry. 

  The user wants boundaries too. How is this not just semantics? Well, semantics would involve word meanings (e.g., defining "altruism"), but here both sides agree on mechanisms. It’s about what’s explanatorily fundamental. And it’s not factual disagreement since predictions align. 

  So, no perfect term exists, but "explanatory framework divergence" might capture it. Alternatively, "selective emphasis in explanatory narratives" emphasizes the role of focus. The closest established ideas are Van Fraassen’s pragmatism and Kitcher’s explanatory unification—but neither is a direct label. 

  User’s depth suggests they’d appreciate nuance: maybe this is a meta-explanatory conflict about what makes an explanation "complete." The tension between reductionism (genes) and holism (groups) isn’t resolvable by data because it’s about values—what "matters" in biology. That’s why it persists. 

  In all, the answer acknowledges the lack of a standard term but offers conceptual tools to dissect it. User’s real need might be validation: yes, this is a genuine philosophical knot, not their oversight.
answer: |-
  Your query captures a profound and recurring tension in scientific explanation, particularly in evolutionary biology. This isn't merely a "group selection vs. kin selection" debate; it's a meta-dispute about **explanatory priority and ontological commitment**, where equivalent predictive power masks a deeper disagreement about what constitutes a *satisfactory explanation*. No single established term perfectly encapsulates this, but we can define its boundaries and relate it to philosophical concepts.

  ### Core Concept: **Explanatory Framework Divergence**
  This describes a dispute where:
  1.  **Empirical Equivalence:** Rival descriptions agree on all observable evidence, mechanisms, and predictions.
  2.  **Explanatory Asymmetry:** Each side insists their description provides the *fundamental* or *real* explanation, while the other is derivative, merely descriptive, or heuristic.
  3.  **Pragmatic Divergence:** The choice of framework directs attention (what's noticed, what needs explaining, future research paths), despite empirical equivalence.
  4.  **Non-Verbal Stakes:** The disagreement isn't about word meanings or logic, but about what *grounds* or *justifies* the phenomenon.

  ### Why Existing Diagnoses Fall Short
  *   **Not "Merely Verbal":** Both sides agree on mechanisms (e.g., inclusive fitness calculations, gene frequencies changing) and definitions (e.g., altruism = reducing own fitness to increase another's). The conflict is about *which level of description is causally/explanatorily primary*. The gene-centric biologist says the group description *emerges from* gene-level processes; the group-centric biologist might say the gene description *misses the functional context* driving the adaptation. Neither is confused about semantics.
  *   **Beyond Coordinate Systems:** While coordinate systems are isomorphic (interchangeable without loss), these frameworks are **not pragmatically interchangeable**. Choosing one actively shapes scientific practice: a gene-centric view focuses on relatedness calculations and genetic conflicts; a group-centric view might focus on group structure, dispersal, and collective function. The "remainder" is the *direction of inquiry*.

  ### Philosophical Anchors
  1.  **Underdetermination of Theory by Evidence (Quine-Duhem Thesis):** Evidence alone cannot uniquely determine theory. Your case is a *specialized form*: **Underdetermination of Explanatory Frameworks by Empirical Consequences**. Multiple frameworks account for the same data, but scientists hold incompatible views on which is fundamental.
  2.  **Explanatory Pragmatism (van Fraassen, Kitcher):** Explanations are answers to context-specific "why-questions." The "same" phenomenon can demand different explanations depending on the question asked.
      *   *Question to Gene-Centric View:* "Why, *despite the cost to the individual*, was this behavior *selected for*?" Answer: Because copies of the genes promoting it persist via relatives.
      *   *Question to Group-Centric View:* "Why does this behavior *enhance the persistence* of this *social unit*?" Answer: Because it benefits the group/reproductive collective.
      *   The frameworks prioritize answering *different implicit questions* ("How was it selected?" vs. "How does it maintain the system?"), even if their predictions overlap. The dispute arises when proponents claim their question is *the* fundamental one.
  3.  **Ontological Commitment & Reductionism:** The gene-centric view often embodies **methodological reductionism** (explaining wholes by parts). The group-centric view often embodies **explanatory holism** or **functional contextualism** (explaining parts by their role in wholes). The disagreement is about *what entities/processes are the primary bearers of causal power in evolution* (genes vs. groups/collectives), even if both agree on the physics and chemistry involved.
  4.  **Conventionalism (Poincaré):** The choice *between empirically equivalent frameworks* may be a matter of convention based on utility or aesthetics. However, your point about the frameworks guiding research ("doing work") pushes against pure conventionalism. It suggests **perspectival realism (Giere, Massimi):** Different frameworks highlight different, real aspects of a complex phenomenon, but no single "God's eye view" captures everything fundamentally. The frameworks are tools for specific investigative purposes.

  ### Distinguishing Boundaries
  *   **Vs. Ordinary Factual Disagreement:** Settled by new evidence (e.g., "Is the squirrel's call *really* attracting hawks?"). Your case is immune to new evidence *about the phenomenon itself*.
  *   **Vs. Plain Equivocation/Semantic Dispute:** Involves misunderstanding word meanings (e.g., "Does 'altruism' imply conscious intent?"). Your biologists agree on definitions and mechanisms.
  *   **Vs. Genuine Theoretical Rivalry (e.g., Phlogiston vs. Oxygen):** Makes different predictions testable by evidence. Your frameworks do not.
  *   **Vs. Trivial Redescription:** Rephrasing the same thing (e.g., "kin selection" vs. "inclusive fitness maximization"). Your frameworks feel *categorically different* to their proponents (genes vs. groups as the "actor").
  *   **Edge Case - Shifting Predictions:** If new evidence *did* force different predictions (e.g., finding altruism in low-relatedness groups *without* group structure), the frameworks would cease to be empirically equivalent and become genuine rivals. Your case assumes this doesn't happen for the behaviors in question.

  ### The Closest Existing Term & Why It Fits (Imperfectly)
  **Selective Emphasis in Explanatory Narratives (or Explanatory Focus Divergence):**
  *   **Why it captures the core:** It explicitly names the key feature: the same phenomenon and mechanism can be narrated by emphasizing different aspects (gene propagation vs. group function). This emphasis isn't arbitrary; it reflects deep commitments about causal primacy and what constitutes a "complete" explanation.
  *   **Why it's imperfect:** It's descriptive rather than a single established "term of art." However, it accurately reflects the philosophical analysis:
      *   **Selective:** Each framework selects a different aspect as explanatorily primary.
      *   **Emphasis:** The primary aspect is given causal/explanatory weight.
      *   **Narratives:** Explanations are structured accounts; these are rival structures for the same events.
      *   **Divergence:** The paths of emphasis lead to incompatible claims about fundamentality.

  ### Conclusion
  There is no perfect, universally accepted single term for this specific pattern. It sits at the intersection of:
  *   **Underdetermination** (empirical equivalence)
  *   **Explanatory Pragmatism** (context-dependent "why-questions")
  *   **Ontological Commitment/Reductionism Debate** (what is the fundamental causal level?)
  *   **Perspectival Realism** (frameworks highlight different real aspects)

  **"Explanatory Framework Divergence"** or **"Divergence of Explanatory Priority"** best captures the essence: a disagreement not about facts or predictions, but about *which level or perspective provides the most fundamental causal account*, where this choice actively shapes scientific practice despite empirical equivalence. **"Selective Emphasis in Explanatory Narratives"** is a more descriptive alternative highlighting the core mechanism of the disagreement.

  This divergence persists precisely because science values both predictive power *and* understanding. When predictions align, the battle shifts to what constitutes true understanding – and that is often rooted in deeply held views about the ontological structure of the world being studied. Your biologists aren't just disagreeing; they're advocating for different visions of what evolutionary biology *should fundamentally be about*.
