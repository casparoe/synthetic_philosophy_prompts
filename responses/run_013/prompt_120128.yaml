                      So P(b=0 | y=0) is 1/2 regardless of x? 

                    But for fixed y=1:
                           If x=0: then a XOR b =0 -> b = a -> P(b=0)=1/2.
                           If x=1: then a XOR b =1 -> b = a XOR 1 -> P(b=0)=P(a=1)=1/2.
                      So again, P(b=0 | y=1) is 1/2 regardless of x.

                    Therefore, the marginal of b does not depend on x? 

                    So the box is no-signaling.

          Therefore, we have a box that achieves 100% and is no-signaling.

          We can then point out that quantum mechanics does not achieve 100% but only about 85%, so there is a gap.

  8. Debrief (30 minutes)

     We map:

          Pre-agreed plan (with shared randomness) -> the assumption of pre-existing values (local hidden variables): the strategy and shared random string are the hidden variables. The hidden variables determine the answers for each possible question.

          Inability to exceed 75% -> the Bell inequality (CHSH): the maximum classical winning probability is 3/4.

          Signalling variant -> what the theorem does not say: Bell's theorem does not rule out signalling theories? But it does rule out local hidden variables. Signalling theories can violate the inequality, but they are not considered because they violate relativity.

          The PR box -> the fact that no-signalling alone does not single out quantum correlations: there are no-signalling correlations that are stronger than quantum, but quantum is the maximum we see in nature.

          The referee's random questions -> the assumption of free choice: the theorem assumes that the experimenters can choose the measurements freely and independently. If the hidden variables could influence the choice of measurements, that would be a loophole (superdeterminism).

     We also note:

          The activity shows that no classical strategy (local hidden variables) can achieve more than 75%. But it does not show that quantum mechanics achieves 85%. For that, we need to explain that quantum entanglement allows a strategy that wins about 85% of the time. We can briefly describe the quantum strategy:

              Alice and Bob share an entangled state: |Phi+> = (|00>+|11>)/sqrt(2)

              Alice: if x=0, measure in the basis |0>,|1> -> gets a. If x=1, measure in the basis |+>,|-> (where |+>=(|0>+|1>)/sqrt(2), |->=(|0>-|1>)/sqrt(2)) -> gets a.

              Bob: if y=0, measure in the basis rotated by pi/8? Actually, for CHSH:

                  Alice:
                      x=0: measure in Z, so basis {|0>,|1>}
                      x=1: measure in X, so basis {|+>,|->}

                  Bob:
                      y=0: measure in the basis {|0'> = cos(θ)|0>+sin(θ)|1>, |1'> = -sin(θ)|0>+cos(θ)|1>} with θ = pi/8? 
                      Actually, the optimal angles are:

                          Alice: 
                              x=0: measure at angle 0
                              x=1: measure at angle pi/2 (which is X)

                          Bob:
                              y=0: measure at angle pi/8
                              y=1: measure at angle -pi/8

              Then the probability of winning is cos^2(pi/8) for the (1,1) case? Actually, the overall win probability is 0.5 + 0.5 * (1/sqrt(2)) ≈ 0.85.

          But we don't need to go into the details? We can just state that quantum mechanics achieves about 85% and that this has been confirmed experimentally.

     What will go wrong:

          - Pairs might leak information: by making noise, looking at each other, etc. -> we must enforce strict separation.

          - They might think shared randomness is a loophole? But shared randomness is allowed in the classical model. We must emphasize that shared randomness does not help beyond 75%.

          - They might be lucky and get 16 wins and think their strategy works? We explain that in the long run, it won't.

          - They might accuse the facilitator of unfairness: the questions are not random? We must ensure the questions are generated fairly.

          - They might think the exercise is about communication: we must stress that the theorem is about the impossibility of a local hidden variable theory. The key is that the answers are predetermined by the hidden variables and cannot depend on the other's question.

          - They might not realize that the shared randomness is equivalent to a convex combination of deterministic strategies? We can explain that in the debrief.

     How to handle:

          - If they leak information: stop the game and remind them of the no-communication rule.

          - If they think shared randomness is a loophole: explain that shared randomness is part of the pre-agreed plan and is allowed in the local hidden variable model. But it doesn't break the bound.

          - If they get 16 wins: congratulate them on their luck and say that if they played 100 rounds, they would not be able to sustain above 75%. We can also run a quick simulation? Or we can aggregate the results of all pairs: the average should be close to 15.

          - Accusation of unfairness: show them the random generation method? Pre-generate the lists using a public method? We can use a random number generator that they trust? Or we can let them generate the questions? But that might be time-consuming.

          - Misconception about communication: stress that the theorem is about what can be done without any influence during the game. The hidden variables are set before they separate.

          - Not realizing the counting argument: we can guide them by asking: "Can you find a deterministic strategy (without any randomness) that wins 100%? What is the best a deterministic strategy can do? Why does it fail? Then, does randomness help?"

     What the activity cannot do:

          - It cannot show that quantum mechanics reaches 85%. We must state that after the activity. We can say: "In nature, we observe correlations that reach about 85%, which is above the classical 75% but below the 100% of the PR box. This is achieved by quantum entanglement."

          - It also does not prove that the world is nonlocal? It only shows that if the world were local, then the correlations would be bounded by 75%, but we observe 85%, so the world is not local.

          - We must be careful: the activity shows that local hidden variable theories cannot exceed 75%. But it does not show that quantum mechanics does exceed it. So after the activity, we must:

                a) State that quantum mechanics predicts a win probability of about 85%.
                b) This has been confirmed by experiments (loophole-free Bell tests).
                c) Therefore, the world cannot be described by local hidden variables.

     Timeline:

          Total: 90 minutes

          - Introduction: 10 minutes
          - Strategy planning: 5 minutes
          - Game play (round 1): 10 minutes for writing answers (20 rounds) and 5 minutes for computing and reporting results -> 15 minutes
          - Discussion of the result: 5 minutes (why can't they get above 75%? try to get them to think of the counting argument) 
          - Variant 1 (signalling): 5 minutes (demonstration of how they can achieve 100% with communication) 
          - Variant 2 (PR box): 5 minutes (explain the magic box that wins 100% and is no-signalling)
          - Debrief: 30 minutes (mapping to Bell's theorem, quantum mechanics, experiments, and discussion of loopholes)
          - Reserve 15 minutes for buffer and questions.

     The exact moment to let them sit with the failure: after they have played the first game and computed their scores, and after they have tried to come up with a better strategy and realized they can't break 75% (in the discussion after the first game). That is the moment of frustration.

     We then use the variants to show that if we drop the no-signalling requirement, they can win 100%, but that's not physical. And that even with no-signalling, there are stronger correlations than quantum.

     Finally, we bridge to quantum mechanics and experiments.

     We must pre-generate the question lists for each pair (for 20 rounds) and have answer sheets ready.

     Materials per pair:

          - Master list: 20 (x,y) pairs (each x and y in {0,1})
          - Alice's question list: 20 x's (without the y's)
          - Bob's question list: 20 y's (without the x's)
          - Answer sheet for Alice: 20 blanks for a_i
          - Answer sheet for Bob: 20 blanks for b_i
          - A copy of the shared random string (if they choose to use one) for Alice and Bob? Or they generate and write on their own.

     We also need pens.

     We must stress that during the game, they cannot communicate.

     We also need a way to separate them: have them sit back to back or in different corners.

     We will now write the exact rules for the game.

     Rules for the first game:

          "You are Alice and Bob. You may meet now for 5 minutes to agree on any strategy. You may generate a shared random string (a list of random bits) that you both will have during the game. Write down this string on both of your answer sheets. Once the game starts, you cannot communicate in any way.

          During the game, you will be separated. Alice will receive a list of 20 x values (each 0 or 1). Bob will receive a list of 20 y values (each 0 or 1). These are generated randomly and independently. For round i (from 1 to 20):

              - Alice looks at x_i and the i-th bit of the shared random string (if you are using one) and writes down a_i (0 or 1) on her answer sheet.
              - Bob looks at y_i and the i-th bit of the shared random string and writes down b_i (0 or 1) on his answer sheet.

          After 10 minutes, you will reunite and receive the master list that shows the (x_i, y_i) for each round. Then, together, you will compute for each round whether you won: win_i = 1 if (a_i XOR b_i) == (x_i AND y_i), else 0. Then compute the total wins.

          Report your total wins to the facilitator."

     Then we run the game.

     We hope they get 15 or less (or 16 by chance) and then we discuss.

     Let's do it.
answer: |-
  ### Bell's Theorem Experiential Activity  
  **Goal:** Participants experience the impossibility of exceeding 75% success in a Bell-like game with classical strategies, discover the counting argument, and map the results to quantum foundations.  

  ---

  ### **Materials** (Per Pair of Players)  
  1. **Question Cards**: Two sets of cards:  
     - **Referee's Deck**: 40 cards (10 each labeled (0,0), (0,1), (1,0), (1,1)).  
     - **Player Cards**: Alice gets cards labeled "X=0" and "X=1". Bob gets "Y=0" and "Y=1".  
  2. **Answer Sheets**: Paper for Alice/Bob to record answers (1 bit: 0 or 1).  
  3. **Shared Randomness**: Two dice (one for Alice, one for Bob) to generate shared random bits.  
  4. **Scoring Board**: Poster showing:  
     ```  
     Win condition: A ⊕ B = X ∧ Y  
     (X,Y) | Win if:  
     (0,0) → A = B  
     (0,1) → A = B  
     (1,0) → A = B  
     (1,1) → A ≠ B  
     ```  
  5. **PR Box Simulation** (for Variant 2): Envelopes with pre-generated (A,B) pairs satisfying A ⊕ B = X ∧ Y (e.g., for (1,1), envelopes contain (0,1) or (1,0)).  

  ---

  ### **Timeline** (90 Minutes Total)  
  #### **1. Setup & Rules** (10 min)  
  - **Facilitator explains**:  
    - Pairs (Alice/Bob) answer 1-bit questions (X for Alice, Y for Bob) from a referee.  
    - Goal: Their answers (A,B) must satisfy **A ⊕ B = X ∧ Y**.  
    - **Rules**:  
      - Pairs meet pre-game to agree on **any strategy** (deterministic or shared randomness).  
      - **No communication** during gameplay.  
      - Referee draws (X,Y) cards uniformly at random.  
    - Scoring: Win if condition holds. Target: Maximize win rate over 20 rounds.  

  #### **2. Strategy Planning** (5 min)  
  - Pairs meet, plan strategies (e.g., "If X=0, always output 0", or use dice for shared randomness).  

  #### **3. Gameplay: Classical Round** (20 min)  
  - **Referees** (facilitator/volunteers) shuffle their decks.  
  - Each round:  
    1. Referee draws (X,Y) card, tells Alice X and Bob Y.  
    2. Alice/Bob write answers (A,B) secretly.  
    3. Referee checks win condition and records result.  
  - **After 20 rounds**, pairs calculate win rate (e.g., 15/20 = 75%).  
  - **Facilitator pauses**: "Why can’t you exceed 75%? Try to find a better strategy."  

  #### **4. Discovery Phase** (15 min)  
  - Pairs tweak strategies and replay 20 rounds.  
  - **Predictable outcome**: Win rate still ~75%.  
  - **Critical moment**: When groups hit the ceiling, facilitator asks:  
    > "What’s stopping you? Why can’t *any* pre-agreed plan win all four (X,Y) cases?"  
    - **Let groups struggle**. Guide with:  
      > "List all four (X,Y) cases. What must (A,B) be for each? Can one strategy satisfy all?"  

  #### **5. Variant 1: Signalling Allowed** (10 min)  
  - **Rule change**: Alice/Bob may whisper before answering.  
  - **Result**: Pairs achieve 100% by coordinating (e.g., Alice tells Bob X, Bob computes A ⊕ B = X ∧ Y).  
  - **Map to Bell**: "Bell’s theorem doesn’t forbid signalling—it forbids *local hidden variables*."  

  #### **6. Variant 2: PR Box** (10 min)  
  - **Rule change**: Pairs use envelopes (PR box) containing "magic" (A,B) that always satisfy A ⊕ B = X ∧ Y (e.g., for (1,1), envelopes contain (0,1) or (1,0) randomly).  
  - **Result**: 100% success, but no signalling (marginals are random: P(A|X) = 0.5, P(B|Y) = 0.5).  
  - **Map to Bell**: "No-signalling doesn’t imply quantum: stronger correlations (PR box) exist but aren’t physical."  

  #### **7. Debrief** (20 min)  
  - **Map gameplay to Bell’s theorem**:  
    | **Game Element**       | **Bell Analogy**                                  |  
    |-------------------------|--------------------------------------------------|  
    | Pre-agreed plan         | Local hidden variables (predetermined values)    |  
    | 75% ceiling             | Bell inequality (e.g., CHSH ≤ 2)                 |  
    | Signalling variant      | What Bell *doesn’t* forbid (nonlocal models)     |  
    | PR box                  | No-signalling ≠ quantum (supra-quantum correlations) |  
    | Referee’s randomness    | Measurement independence (assumed, not proven)   |  

  - **Counting argument revelation**:  
    - For (X,Y) = (0,0), (0,1), (1,0): **A = B**. For (1,1): **A ≠ B**.  
    - Any deterministic strategy forces a **logical contradiction** in one case (e.g., A=0,B=0 for (0,0) and (0,1) requires A=0,B=0 for (1,0), but then (1,1) fails).  
    - Shared randomness averages over deterministic plans → still fails 25% of the time.  

  - **Bridge to quantum**:  
    - "Classical strategies max at 75%. But nature violates this: **quantum entanglement** achieves ~85% (cos²(π/8)).  
    - Experiments confirm this (loophole-free Bell tests). Thus: **No local hidden-variable theory can describe nature.**"  

  ---

  ### **Handling Predictable Failures**  
  1. **Leaked information**:  
     - *Issue*: Pairs peek/talk during gameplay.  
     - *Fix*: Enforce separation (back-to-back seating) and use referees to monitor.  

  2. **Shared randomness as "loophole"**:  
     - *Issue*: "But we used dice—doesn’t that fix it?"  
     - *Fix*: "Shared randomness only randomizes over deterministic plans. Since *each* plan fails ≥1 case, randomization can’t help."  

  3. **Lucky streaks**:  
     - *Issue*: A pair wins 16/20 (80%) and thinks they succeeded.  
     - *Fix*: Aggregate group results (e.g., 6/7 pairs score ≤75%). Emphasize: "This is chance. Play 100 rounds and you’ll regress to 75%."  

  4. **Unfairness accusations**:  
     - *Issue*: "The referee rigged the cards!"  
     - *Fix*: Use public card shuffling/dice rolls. Pre-generate PR box envelopes transparently.  

  5. **Misplaced focus on communication**:  
     - *Issue*: "This is about preventing cheating, not physics."  
     - *Fix*: In debrief, stress: "The impossibility is about *joint distributions* for incompatible measurements (A₀,A₁,B₀,B₁), not communication."  

  ---

  ### **What the Activity Can’t Do**  
  - **Cannot show quantum mechanics achieves 85%**:  
    - *Facilitator must add*:  
      1. **Quantum strategy**:  
         - Alice: Measure in basis Z if X=0, X if X=1.  
         - Bob: Measure in basis (Z+X)/√2 if Y=0, (Z−X)/√2 if Y=1.  
         - Shared entangled state: |Φ⁺⟩ = (|00⟩ + |11⟩)/√2.  
         - Win rate: cos²(π/8) ≈ 85%.  
      2. **Experimental evidence**:  
         - Cite loophole-free experiments (e.g., Hensen et al., 2015).  
         - "Nature violates Bell inequalities—no local hidden variables."  

  - **Order of post-game exposition**:  
    1. Restate the classical bound (75%).  
    2. Introduce quantum strategy (85%).  
    3. Note PR boxes (100%) are stronger but unphysical.  
    4. Conclude: Bell’s theorem shows quantum mechanics *must* be nonlocal.  

  > "The activity shows classical limits. Experiments show nature breaks them. That’s the mystery and beauty of quantum foundations."  

  This design forces participants to "walk into the wall" of the counting argument, bridges intuition to formalism, and minimizes lecturing. The debrief links frustration to revelation.
