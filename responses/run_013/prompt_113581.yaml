  Okay, the user is a second-year PhD student in sociology, theory track. They're frustrated because there's a one-page cheat sheet circulating in their department that misrepresents methodological individualism (MI). They want to dissect it claim by claim to show where it's inaccurate. Their main concerns are whether "only individuals act" refutes holism and if MI inherently ties to laissez-faire politics. They also wonder if fixing the errors leaves any valid conclusions.

  First, I need to unpack the cheat sheet's claims. The sheet defines MI as the view that only individuals are real, and social entities are shorthand. It contrasts this with holism, saying Durkheim saw society as having its own consciousness. Then it claims the debate is settled because collectives can't act, and MI is normative, linked to laissez-faire. The user mentioned Elster as a counterexample to the politics point.

  Starting with the first claim: "only individuals are real." That's ontological individualism, not MI. MI is methodological, about explanation. Conflating them is a mistake. Philosophers like Weber and Popper focused on explanation, not denying social reality. So this is category C: wrong.

  Next, "proper explanation must derive from individual beliefs/desires." This is reductive MI. But even Popper allowed some institutional explanations. Analytical sociology uses mechanisms but doesn't reduce everything. So it's a crude oversimplification (category B).

  Holism defined as society having consciousness? Durkheim didn't say that. He talked about emergent properties, not collective consciousness as a mind. The sheet's version is a straw man. So category C.

  "Only individuals act" refuting holism? Action requires intentions, but holists argue for emergent causal powers. Structures constrain/enable actions. So the argument doesn't settle anything; it's a category B misrepresentation.

  The debate being settled? No, it's ongoing. Sociology uses structural explanations, economics MI but with critiques. Category C.

  MI as normative? The sheet links it to laissez-faire, but Elster was Marxist. MI is a method, not inherently political. Correlation isn't causation here. So category C.

  The user's deeper needs: They want to correct misconceptions without dismissing peers. They need clear arguments to show why the sheet is flawed, especially the political link and the action argument. They might also want to establish a more nuanced understanding in their department. Providing categorized breakdowns with specific objections helps them articulate these points authoritatively. Highlighting Elster and examples like Coleman shows MI's flexibility. Clarifying that valid MI (non-reductive) exists but the sheet misrepresents it allows them to salvage some correctness without the errors.
answer: |-
  Here's a rigorous, claim-by-claim analysis of the cheat sheet's content, categorized as requested. I'll draw on key figures like Weber, Popper, Hayek, Elster, Boudon, Coleman, Durkheim, Bhaskar, Sawyer, and others to show where the sheet misrepresents the debate. The core confusion stems from conflating *ontological*, *methodological*, and *explanatory* individualism/holism – distinctions crucial in philosophy of social science.

  ### Claim-by-Claim Breakdown

  1.  **"Methodological individualism is the view that only individuals are real; talk of states, markets, classes, and norms is just shorthand for facts about individuals."**
      *   **Category: C (Just Wrong)**
      *   **Why:** This confuses **Methodological Individualism (MI)** with **Ontological Individualism**. MI is an *explanatory doctrine*, not necessarily an ontological one. Key defenders (Weber, Popper, Elster) explicitly *do not deny* the reality or causal efficacy of social structures/institutions. They argue that explanations *must ultimately refer* to individuals acting within contexts. Popper ("Poverty of Historicism") states MI requires explanations to be "reduced" to individuals, *not* that social entities are unreal – they are complex patterns of individual relations. Weber treats structures like bureaucracies as real constraining/enabling forces, but explains their *origins and persistence* via individual actions and meanings. The sheet commits the "fallacy of misplaced concreteness" MI seeks to avoid by implying social facts are *merely* shorthand, rather than emergent properties with downward causation.

  2.  **"A proper social explanation therefore has to derive every social outcome from the beliefs and desires of the individuals involved, with nothing left over."**
      *   **Category: B (Defensible-but-Crude Formulation)**
      *   **Why:** This describes **Reductive MI** (strong form), which *some* proponents advocate (e.g., early Jon Elster in "Nuts and Bolts"). However, it's an oversimplification:
          *   **"Beliefs and Desires"**: Too narrow. Weber emphasized *Verstehen* (understanding meanings, purposes), which includes beliefs/desires but also norms, traditions, identities – socialized mental states. Modern Analytical Sociology (Hedström, Bearman) focuses on *mechanisms* (e.g., belief formation, network diffusion) often involving social interaction and context.
          *   **"Derive... with nothing left over"**: Ignores the role of *unintended consequences* and *emergent properties* central to sophisticated MI (Hayek, Popper). Outcomes often aren't "derived" from individual intentions alone; they emerge from complex interactions. MI explanations frequently *include* institutional constraints and emergent norms *as part of the context* shaping individual action (Coleman's "boat" model). The key MI demand is that the *causal mechanism* involves individual actions/interactions, not that the *explanation* is atomistic.

  3.  **"Holism is the opposite position: society is a thing over and above its members, with its own consciousness and causal powers..."**
      *   **Category: C (Just Wrong / Straw Man)**
      *   **Why:** This misrepresents **Holism**:
          *   **"Own consciousness"**: A crude caricature. Durkheim ("Rules of Sociological Method") explicitly *rejected* the idea of a "group mind" separate from individuals. He argued for *emergent properties*: social facts (norms, institutions, collective representations) arise from interaction and have *sui generis* properties constraining individuals. His "collective consciousness" is a shared symbolic system embodied in individuals, not a disembodied mind.
          *   **"Thing over and above"**: While holists argue for the reality and causal power of social structures (Bhaskar, Archer, Critical Realists), they generally don't see them as *completely separate entities* floating above individuals. They are relational, embedded, and depend on individuals for their reproduction/transformation (though with relative autonomy). The sheet presents an absurdly strong holism no serious theorist holds.

  4.  **"...which is why Durkheim insisted that social facts be explained by other social facts."**
      *   **Category: A (Careful Philosopher Would Accept)**
      *   **Why:** This accurately describes Durkheim's core methodological principle for sociology as an autonomous science. He argued that social phenomena (like suicide rates, legal systems) require explanations referencing other social-level phenomena (anomie, division of labor), not just psychological or biological facts.

  5.  **"The debate was basically settled by the fact that only individuals act — collectives can't have intentions — so holism is refuted..."**
      *   **Category: C (Just Wrong - Misrepresents the Argument & Its Force)**
      *   **Why:** This is the sheet's most damaging error:
          *   **"Only individuals act"**: Correct *in a trivial sense*. Only biological humans perform physical actions. Intentions require minds, which individuals possess.
          *   **"Collectives can't have intentions"**: Largely true (though debates exist about corporate agency). *But this does not refute holism.*
          *   **Why it Doesn't Settle Anything**: Holists agree only individuals *physically act*. Their argument is that:
              *   **Emergent Causal Powers**: Social structures (e.g., capitalist markets, caste systems) have *emergent causal powers* irreducible to individual psychology. These structures *enable*, *constrain*, and *shape* individual actions, beliefs, and desires in ways that cannot be fully explained by reference *only* to prior individual states (Archer, Bhaskar). Explaining why a worker accepts a low wage requires reference to the *structure* of the labor market and property relations, not just their individual psychology.
              *   **Constitutive Role**: Social facts (like money, marriage) are *constituted* by collective intentionality and shared rules (Searle), not reducible to individual beliefs/desires *simpliciter*.
              *   **Relocation, Not Refutation**: The "only individuals act" argument doesn't refute holism; it simply *relocates the dispute*. The key question becomes: **Can the constraining/enabling/constitutive effects of social structures be adequately explained *solely* by reference to the actions and mental states of individuals, or do we need to posit irreducible social-level properties/causes?** Sophisticated MI (Coleman, Boudon) tries the former; Holists/Critical Realists insist the latter is necessary. This debate is *far* from settled.

  6.  **"...and MI is now the default in economics; the main holdouts are sociologists who need society to be real in order to justify their politics."**
      *   **Category: B (Defensible-but-Crude) & C (Politically Charged Claim)**
      *   **Why:**
          *   **MI in Economics**: Largely true that neoclassical economics adopts MI (rational actors). But even here, institutions (treated as constraints/equilibria) play a major role. Behavioral economics challenges pure MI by incorporating social influences on preferences.
          *   **"Main holdouts are sociologists..."**: Crude (B) and Politically Motivated (C). While sociology *does* have a stronger tradition of holism/structuralism, this isn't *primarily* driven by politics. Many sociologists argue (based on empirical and theoretical grounds) that MI *cannot adequately explain* phenomena like systemic inequality, institutional inertia, large-scale cultural shifts, or the independent causal power of networks/organizations. Figures like Bourdieu or Giddens developed complex structuration theories precisely because they found MI explanations insufficient. Reducing this to "justifying politics" is dismissive and ignores genuine theoretical arguments.

  7.  **"Finally, MI is itself a normative commitment: it says we should explain outcomes as products of individual choice..."**
      *   **Category: C (Just Wrong - Conflates Methodology & Normativity)**
      *   **Why:** MI is fundamentally a **methodological** and **explanatory** stance about *how to explain social phenomena*, not a normative claim about how society *should* be organized or how individuals *should* act. Weber's methodological writings rigorously separate *explanation* from *evaluation*. Popper saw MI as essential for a critical, non-deterministic social science. It describes a mode of explanation, not a political ideal.

  8.  **"...which is why it goes hand in hand with laissez-faire."**
      *   **Category: C (Just Wrong - False Necessity & Guilt by Association)**
      *   **Why:** This is a classic case of guilt by association and false necessity:
          *   **Historical Association ≠ Logical Necessity**: While *some* prominent MI advocates *were* classical liberals (Hayek, Mises), this is **not** inherent to MI itself.
          *   **Counterexamples**: Jon Elster (a key figure in Analytical Sociology and staunch defender of MI/mechanism-based explanation) was a committed Marxist for much of his career. Raymond Boudon (another major MI theorist) focused on explaining how rational individual actions within social positions could lead to *unintended* inequality (a theme compatible with center-left critiques). Karl Popper (advocate of MI) was a social democrat.
          *   **MI & Critique**: MI can be used to critique institutions by showing how they emerge from, or depend upon, specific individual actions and beliefs. It doesn't inherently justify the status quo or laissez-faire. Explaining how discrimination arises from individual biases within a structure *is* an MI-compatible critique.
          *   **The Real Link**: The link to laissez-faire is primarily historical and contingent (19th-century liberalism vs. socialism), *not* logical or necessary. The cheat sheet commits a genetic fallacy.

  ### Addressing Your Specific Queries

  1.  **"Only individuals act" argument:** It **does not refute holism; it relocates the dispute.** Holists readily concede only biological individuals perform actions. The core debate is whether the **causal powers and constitutive properties of social structures** can be fully explained by, or reduced to, facts about individuals and their interactions. MI says yes (in principle), Holism says no. The action argument sidesteps this central issue.
  2.  **Normative/Political Commitment:** **Methodological Individualism carries no inherent normative or political commitment.** The association with laissez-faire is **accidental and historical**, not logical. MI is compatible with a wide range of political positions (Marxism, Social Democracy, Liberalism, Conservatism) because it is a tool for *explanation*, not a prescription for social organization. Elster is the prime counter-example.
  3.  **Does anything survive if fixed?** **Yes, but stripped of its polemical and mistaken claims, the core message is diluted and nuanced:**
      *   MI *is* a dominant explanatory approach in economics.
      *   MI *does* insist that explanations involve individual actions and mechanisms (though not necessarily atomistic reduction).
      *   Holism *does* posit irreducible social properties/causes.
      *   There *is* a significant methodological divide between disciplines.
      *   **However:** The "debate is settled" claim vanishes. The "collective consciousness" straw man disappears. The crude reductionism is replaced by mechanism-based explanations. The normative/political baggage is severed. The sheet's polemical conclusion ("sociologists just need society real for politics") becomes untenable. What survives is a recognition of a genuine, ongoing methodological tension, not a refutation of one side.

  **Your Hunch is Correct:** The sheet lands "half-right for entirely the wrong reasons." It correctly identifies MI's focus on individuals and its dominance in economics, but misrepresents the nature of MI, grossly caricatures holism, falsely claims the debate is settled by a weak argument, and incorrectly injects a political commitment where none logically exists. Its core usefulness as a "cheat sheet" is undermined by its inaccuracies and biases. A better sheet would emphasize the **explanatory mechanism** focus of modern MI (Elster, Hedström) and the **emergent properties/relational ontology** focus of modern holism/structuralism (Archer, Bhaskar), framing it as an ongoing, productive tension rather than a settled debate.
