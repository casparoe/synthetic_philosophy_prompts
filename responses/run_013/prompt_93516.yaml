    - Then, play without the extra stone? Or just report: did the player with the extra stone ever lose? (They shouldn't if they play optimally, but we don't require optimal. We want them to see that the extra stone doesn't cause a loss. So even if they lose with the extra stone, it's because they played badly, not because the stone hurt. So we can discuss: "Can you imagine a scenario where having an extra stone would make you lose? In Hex, no, because you can always ignore it and play as if you didn't have it." (5 min))

  - 30-50 min: Strategy-stealing argument. (20 min)
    - 30-35 min: Explain the setup: assume second player has a winning strategy S. We are going to steal it. (5 min)
    - 35-45 min: Group activity (groups of 3): write a strategy for the second player (for 3x3 Hex) and then try to steal it as the first player. (10 min)
    - 45-50 min: Plenary: report what happened. Did the first player win? Then, even if the strategy they wrote wasn't winning, we see that if it were winning, we would have a contradiction. (5 min)

  - 50-60 min: Chomp (10 min)
    - 50-55 min: Explain rules and play a few small games (3x3). (5 min)
    - 55-60 min: Present the strategy-stealing argument for Chomp (non-constructive) and note that we don't know the winning strategy for Chomp. (5 min)

  - 60-75 min: Debrief. (15 min)
    - Map the steps: 
      - Empirical from play: no draws in Hex (but we didn't prove it, we observed in small boards). The proof of no draws is by topology and holds for all sizes.
      - Monotonicity: tested in Hex, and it holds. In the proof, we rely on it when we have to make an arbitrary move (if the strategy's move is taken).
      - Assumption: second player has a winning strategy -> leads to contradiction by stealing.
      - Quantifier flip: we assumed existence of a winning strategy for second player and used it to build one for first player.
    - Non-constructive: we know a winning strategy exists for the first player but we don't know what it is (especially in Chomp).

  - 75-80 min: Closing hook: AI and real-world strategy stealing. (5 min)

  Predictable Issues and Facilitator Moves:

  1. Issue: Students might not take the monotonicity test seriously because it seems obvious in Hex. 
     - Move: Insist they test it by playing and then challenge them: "Can you think of any game where having an extra stone might hurt? For example, in a game with limited moves? Hex isn't like that, but what about other games? We are relying on this premise."

  2. Issue: A student might claim they found a winning strategy for Hex (on the 5x5) and want to share. 
     - Move: Acknowledge that for small boards we can find strategies, but the point is for boards where we don't know, and the proof works without knowing. For Chomp, no one knows, so we feel the non-constructiveness.

  3. Issue: The sealed envelope is empty, and a student says it's a trick. 
     - Move: Explain that the envelope represents the hypothetical strategy. We don't know what it is, but we assume it exists. The proof is non-constructive: it doesn't tell us the strategy, only that it cannot exist for the second player.

  4. Issue: They might think that the strategy stealing is constructive because in Hex on small boards they can find strategies. 
     - Move: Emphasize that for larger boards and for Chomp, we don't know the strategy. The proof doesn't help us find it.

  Feature the activity cannot reproduce: 
  - The feeling of knowing a winning move exists and being unable to name it. We can try to get this by having them attempt to find a winning first move in Chomp (on a 4x4 or 5x5) for a minute and then reveal that no one knows. But that might not be enough. So in the debrief, we highlight that in Chomp, mathematicians have been unable to find the winning strategy despite knowing it exists.

  Alternative: Use a misère variant of Hex? 
    - In misère Hex, the player who completes a connection loses. 
    - Then, does the first player have a winning strategy? We don't know. And strategy stealing fails because monotonicity might not hold: an extra stone might force you to complete the connection and lose. 
    - But we don't want to assert results we haven't checked. So we can have them test monotonicity in misère Hex? 
    - Example: give an extra stone and see if it can hurt (it might, because it might complete a connection prematurely). 
    - Then, the strategy stealing argument breaks.

  But that might be too much for one session. We can mention it in the debrief as an example where the argument fails if monotonicity fails.

  Given time constraints, we'll stick to the plan.

  Final Timeline (80 minutes):

  - 0-5: Introduction and Hex rules. (5 min)
  - 5-15: Hex play in pairs (each pair plays two games: one with each starting). (10 min)
  - 15-20: Plenary: observations (no draws, first player wins when played optimally? But we might have seen second player wins due to mistakes). State that it's known that first player wins with optimal play in small boards. (5 min)
  - 20-25: Monotonicity test: in pairs, one game with an extra stone for one player (randomly chosen). (5 min)
  - 25-30: Plenary: did the extra stone ever hurt? (No) Why? (5 min)
  - 30-35: Introduce the strategy-stealing setup: assume second player has a winning strategy. (5 min)
  - 35-45: Group activity (groups of 3): write a strategy for the second player (on index card) for 3x3 Hex. Then try to steal it as first player. Play out the game. (10 min)
  - 45-50: Plenary: groups report. Emphasize the contradiction. (5 min)
  - 50-55: Chomp rules and small games (pairs play one 3x3 game). (5 min)
  - 55-60: Strategy-stealing for Chomp: non-constructive nature. (5 min)
  - 60-75: Debrief: map activity to proof steps, highlight non-constructive and monotonicity. (15 min)
  - 75-80: Closing hook: AI strategy stealing. (5 min)

  Materials per pair for Hex: 
  - 2 sheets of 5x5 Hex board.
  - Red and blue pens.

  Materials per group for strategy stealing: 
  - 1 sheet of 3x3 Hex board (or they can use the 5x5 and play in a subset? Better to have 3x3 for simplicity).
  - Index cards.
  - Envelope (sealed, empty).

  Materials for Chomp: 
  - 3x3 grid and maybe a 4x4 grid per pair.

  This is tight, but doable. We might cut the Chomp play to just one game and focus on the argument.

  Let's go with this.
answer: |-
  Below is a detailed, runnable 80-minute session plan designed to meet your goals. It focuses on experiential learning, avoids strategy-hunting, and explicitly maps activities to the proof structure. The session uses **Hex** for the core argument and **Chomp** to emphasize non-constructiveness. Materials needed per student pair/group: printed Hex boards (5x5 for play, 3x3 for strategy-stealing, and one 8x8 for display), Chomp grids (3x3 and 5x7), red/blue pens, index cards, and sealed envelopes (one per group).

  ---

  ### **Session Overview**
  - **Pedagogical Approach**: Students discover key premises (no draws, monotonicity) through play, then derive the contradiction themselves. Groups transition from players to reasoners via structured prompts.
  - **Flow**:  
    1. **Hex Play & Observation** (20 min): Notice no draws and first-player advantage.  
    2. **Monotonicity Test** (10 min): Verify "extra stone never hurts."  
    3. **Strategy-Stealing Contradiction** (25 min): Assume second-player strategy → derive contradiction.  
    4. **Chomp & Non-Constructiveness** (15 min): Contrast Hex with unknowable strategies.  
    5. **Debrief & Hook** (10 min): Map activities to proof, discuss AI implications.  
  - **Avoiding Pitfalls**:  
    - Hard cutoffs for play phases.  
    - Hypothetical reasoning (no real strategies used).  
    - Explicit distinction between small-board evidence and general proof.  

  ---

  ### **Detailed Session Plan**  
  *(Facilitator notes in italics; adjust timing as needed.)*

  #### **0–5 min: Introduction & Hex Rules (Plenary)**  
  - **Materials**: Display a 5x5 Hex board.  
  - **Facilitator Script**:  
    > "Today, we’re exploring how we can *know* a winning strategy exists without knowing *what it is*. We’ll use two games: **Hex** and **Chomp**. First, Hex: Connect your sides (red: top-bottom; blue: left-right). No draws possible—this is a topological fact, but let’s see what you observe. Play in pairs, win/lose only. No computers—use pens!"  
  - **Rules Recap**:  
    - Players alternate coloring cells.  
    - Winner completes their connection.  
    - **Goal**: Play 2 games (one per starter), observe outcomes.  

  #### **5–20 min: Hex Play & No-Draw Observation (Pairs)**  
  - **Materials**: 5x5 Hex boards (one per pair), red/blue pens.  
  - **Activity**:  
    1. Pairs play **two 5x5 games** (3 min/game; 6 min total).  
    2. **Prompt**: "Record who started and who won. Any draws?"  
    3. After games, **plenary share-out** (3 min):  
       - "Did any game end in a draw? Did the starter always win?"  
       - *Expected*: No draws; starters often win (but not always due to mistakes).  
  - **Facilitator Moves**:  
    > "In small Hex, perfect play means the starter *always* wins. But how do we *prove* this for *any* size without knowing the strategy? Let’s test a key premise."  
  - **Why**: Establishes **no draws** (observed empirically) as a foundation for the proof.  

  #### **20–30 min: Monotonicity Test (Pairs → Plenary)**  
  - **Materials**: Same 5x5 boards, red/blue pens.  
  - **Activity**:  
    1. **Prompt**: "Play one game where Player 1 gets a **free extra stone** (place anytime). Does this ever hurt them? Could it force a loss they’d otherwise avoid?"  
    2. Pairs play **one game** (5 min).  
    3. **Plenary discussion** (3 min):  
       - "Did the extra stone ever backfire? Why or why not?"  
       - *Guide them*: "If the stone is useless, ignore it; if helpful, use it. Extra options can’t harm you."  
  - **Facilitator Script**:  
    > "This is **monotonicity**: Extra resources never hurt. We’ll see why this is crucial. In Hex, it’s intuitive—but is it true in *every* game?"  
  - **Why**: Tests **monotonicity premise** experientially.  

  #### **30–50 min: Strategy-Stealing Contradiction (Groups of 3)**  
  - **Materials**: 3x3 Hex boards, index cards, sealed envelopes (empty), pens.  
  - **Setup**: Groups of 3 (Player A, Player B, Observer). Display an 8x8 Hex board.  
  - **Activity**:  
    1. **Prompt 1 (5 min)**:  
       > "Assume the **second player has a winning strategy**. Write it on an index card as ‘Strategy S’—put it in a sealed envelope. You don’t need the actual strategy; just *assume* it exists."  
       - *Groups write "Strategy S" on card, seal in envelope.*  
    2. **Prompt 2 (10 min)**:  
       > "Player A (first player) makes an **arbitrary move** (e.g., center). Player B (second player) responds. Now, Player A ‘steals’ Strategy S: Ignore your first move, and use S to respond to Player B’s moves. If S says ‘play here’ but it’s occupied, use your ‘extra stone’ (from monotonicity) to play anywhere. Play out the game."  
       - *Groups simulate; Observer notes if Player A wins.*  
    3. **Plenary share-out** (5 min):  
       - "Did Player A win? What happened when S’s move was occupied?"  
       - *Expected*: Player A wins, proving the contradiction.  
  - **Facilitator Script**:  
    > "By assuming a second-player strategy, we built a first-player winning strategy. But if second player *had* a winning strategy, this shouldn’t happen! Contradiction → first player *must* have a winning strategy. But did we *learn* what it is? No—we stole it hypothetically."  
  - **Why**: Derives **contradiction**; highlights **non-constructiveness** and **quantifier flip** (∃ strategy for second player → ∀ strategies, first player can steal).  

  #### **50–60 min: Chomp & Non-Constructiveness (Pairs → Plenary)**  
  - **Materials**: Chomp grids (3x3 and 5x7), pens.  
  - **Rules**: Players take turns "chomping" a cell (remove it and all cells above/right). Player taking the bottom-left cell (poison) loses.  
  - **Activity**:  
    1. **Play 3x3 Chomp** (5 min): "Find a winning first move if you can."  
    2. **Prompt** (3 min): "Now try the 5x7 grid. Any guesses for the winning first move?"  
       - *Most will struggle; no known strategy.*  
    3. **Plenary** (2 min): "How is this different from Hex? The strategy-stealing argument *still works* (assume second-player strategy → contradiction), but we have **no idea what the first move is**."  
  - **Facilitator Script**:  
    > "In Hex, small boards have known strategies. In Chomp, even 5x7 is unsolved. The proof guarantees existence but gives **zero guidance**—pure non-constructiveness."  
  - **Why**: Forces students to **confront unknowability**; contrasts with Hex.  

  #### **60–75 min: Structured Debrief (Plenary)**  
  - **Map Activities to Proof**: Use the board to sketch the argument:  
    > 1. **No draws** (observed in play; general by topology).  
    > 2. **Monotonicity** (tested; critical for handling occupied moves).  
    > 3. **Assume second-player strategy** (hypothetical envelope).  
    > 4. **Steal → contradiction** (first player must win).  
    > 5. **Quantifier flip** ("∃ winning strategy for second" → "∀ such strategies, first wins").  
  - **Key Distinctions**:  
    > "Small-board play **doesn’t prove generality**—e.g., 5x5 evidence ≠ proof for 100x100. The **proof** does, via abstract contradiction. Monotonicity is the **linchpin**; if it fails, the argument dies."  
  - **Address Predictable Issues**:  
    - *Issue*: "Monotonicity is obvious—why test?" → "In Hex, yes. But in misère Hex (connection-loser wins), an extra stone *can* hurt. Test it next week!"  
    - *Issue*: "The envelope is a trick!" → "It represents a *hypothetical* strategy. We proved it *can’t exist*, so the envelope *must* be empty."  
    - *Issue*: "We found a Hex strategy!" → "Small boards are solvable, but the proof works for *unsolved* cases like Chomp or large Hex."  

  #### **75–80 min: Closing Hook (Plenary)**  
  - **Prompt**:  
    > "In AI, ‘strategy stealing’ means copying others’ strategies. Does our proof transfer? Or is it just a superficial analogy?"  
  - **Discussion Points**:  
    - **Similarity**: Both exploit existing strategies.  
    - **Divergence**:  
      - *Game theory*: Relies on **monotonicity** and **perfect information**.  
      - *Real world*: Resources can hurt (e.g., overcommitment), strategies are opaque.  
      - *Non-constructiveness*: The proof doesn’t *find* strategies—AI must.  
  - **Final Thought**:  
    > "This proof is a **weird superpower**: certainty without knowledge. Where else might this appear?"  

  ---

  ### **Predictable Issues & Mitigation**  
  1. **Monotonicity Hand-Waving**:  
     - *Mitigation*: Insist on testing ("Show me a game where extra stone hurts!"). Contrast with misère Hex (optional: demo a quick 2x2 misère game).  

  2. **"The Envelope is a Trick!"**:  
     - *Mitigation*: Preemptively clarify: "The envelope holds a *hypothetical* strategy. We’re proving it *can’t exist*—so yes, it’s empty!"  

  3. **Over-Investing in Strategy-Hunting**:  
     - *Mitigation*: Enforce hard cutoffs (e.g., "Stop play in 60 seconds!"). Transition with: "You’re now detectives—find the contradiction, not the move."  

  4. **Misinterpreting Evidence**:  
     - *Mitigation*: Explicitly separate empirical ("We saw no draws in 5x5") from general ("Proof works for all sizes") in debrief.  

  ---

  ### **What the Activity Can’t Fully Capture**  
  - **The Felt Absurdity of Unknowability**: Students will *understand* non-constructiveness intellectually (especially after Chomp), but the visceral frustration of "knowing without knowing" is hard to replicate.  
    - *Mitigation*: **Amplify the Chomp struggle**. When they fail to find a 5x7 move, say: "Mathematicians face this daily. The proof says ‘yes, it exists’ but whispers ‘good luck finding it’."  
  - **Misère Variant**:  
    - Use a **2x2 misère Hex** demo to break monotonicity: Show that an extra stone *can* force a loss (completes the connection). This reinforces why the premise is essential.  
    - *Note*: Don’t assert results; have them test post-session.  

  ### **Materials Checklist**  
  - **Per Pair**:  
    - 5x5 Hex board × 2  
    - 3x3 Hex board × 1  
    - Chomp grids (3x3 and 5x7) × 1 each  
  - **Per Group (3 students)**:  
    - Index card × 1  
    - Sealed envelope × 1  
  - **Facilitator**:  
    - 8x8 Hex board (display)  
    - Timer  

  This plan balances discovery, contradiction, and reflection while adhering to your constraints. It leaves students with a clear proof structure and a lingering question about knowledge—perfect for a seminar. Run it, then iterate!
