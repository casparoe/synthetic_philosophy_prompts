  45-75 min: Phase 2 (30 min)
     - Observers in each group are given 5 minutes to discuss and write down one candidate invariant that they think might help.
     - Then they give it to the Players in their group.
     - Players then continue, but now they know the candidate invariant. They can try to:
          - Use it to see if the target is possible? (If the target doesn't satisfy the invariant, they might give up? But then they can focus on getting more strings for points.)
          - Or use it to guide the search? (But in Group A, the invariant blocks, so they might give up? But we want them to try to break it? But they can't. So they might just collect more strings.)

  75-90 min: Final report and debrief (15 min)
