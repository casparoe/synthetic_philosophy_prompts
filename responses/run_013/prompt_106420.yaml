              Rule2: double the I's: if we had k mod3 = r, then 2k mod3 = 2r mod3. But we never have r=0? And 2r mod3 is 0 only if r=0? So if we start with r=1, then 2*1=2 mod3; if r=2, then 2*2=4 mod3=1. So we only see 1 and 2, never 0.
