prompt: |-
  A friend of mine who reads too much complexity-theory blogging has been pushing this on me for weeks and I genuinely can't tell if it's sharp or just confused. He calls it the No-Shortcut argument:

  (1) A belief is justified only if it came from a process that tracks the truth -- one that would land on the truth across the relevant range of cases, not just happen to be right this time.
  (2) For a large enough hypothesis space, finding the hypothesis that best fits your evidence -- or even getting within a decent factor of the best one -- is intractable in the worst case: NP-hard, #P-hard for the Bayesian version, exponential in general.
  (3) A physical system like a brain only gets polynomially many steps before it has to answer.
  (4) So no brain-implementable process can solve the general problem; it can only guess.
  (5) A process that guesses on the general problem isn't a truth-tracker.
  (6) So none of our beliefs is justified.
  (7) And since "justified" is doing all the work in epistemology, that means there's no fact of the matter about what we ought to believe -- epistemic norms are just stories we tell about our guesses.

  I feel like (7) is obviously too much, but every step up to it looks fine and I keep failing to name the one that breaks. He says the only honest move is to redefine justification as "justified relative to your computational budget," then cheerfully admits that's a different concept wearing the old word's clothes. So: which premise do I give up, and what does giving it up cost me? I especially want to know whether the fix is just the worst-case/average-case point -- that NP-hardness says *some* instances are hard, not the ones we actually meet -- or whether that's a cop-out that just relocates the problem into "the relevant range of cases" in (1), where it was undefined all along. Don't tell me both are fine; pick the step you'd reject and price it.

  And tell me what would change your mind -- what argument or result would push you toward a different diagnosis, and where your own reasoning is most likely to fail. I'd rather you flag the load-bearing spot than sound sure.
reasoning: |-
  Okay, I need to really unpack this No-Shortcut argument my friend is pushing. The whole thing is structured to lead to this radical skepticism where no beliefs are justified because our brains can't handle the computational complexity of truth-tracking. Let me go through each premise carefully to see where it might break.

  First, premise (1) says beliefs are justified only if they come from a process that tracks truth across relevant cases. That sounds like a standard reliabilist view in epistemology. No immediate red flags there, but I should remember that "relevant range of cases" is vague and might be key later.

  Premise (2) claims that for large hypothesis spaces, finding the best fit to evidence is computationally intractable—NP-hard or worse. This seems technically correct in the worst case. Problems like finding the optimal hypothesis in machine learning or Bayesian inference can be exponentially hard. But is worst-case complexity the right lens here? That's a big question.

  Premise (3) states that brains only have polynomial time to compute answers. This seems plausible. Even if neurons work in parallel, there are physical limits to how many computations can be done in a human lifetime. So polynomial steps make sense as a rough cap.

  Premise (4) combines the previous points: since the problem is hard and brains are limited, they can't solve it generally—they can only guess. This seems to follow if we accept worst-case intractability and polynomial constraints. But is "guessing" the right way to frame what brains do? Maybe approximation or heuristics are better terms.

  Premise (5) says that a process that guesses isn't a truth-tracker. This feels too strong. If "guessing" means random or arbitrary, sure, it doesn't track truth. But in practice, brains use smart heuristics that work well in typical cases. So this premise might conflate worst-case failure with average-case unreliability.

  Premise (6) concludes no beliefs are justified, which follows if all the prior steps hold. But this leads to absurdity because we clearly have justified beliefs in everyday life. So something must be wrong earlier.

  Premise (7) extends this to say epistemic norms are just stories, which seems like an overreach but is consistent with the argument so far.

  The key tension is between worst-case complexity and real-world feasibility. My friend dismisses the average-case objection as a cop-out, but I think that's exactly where the argument fails. The "relevant range of cases" in premise (1) isn't the set of all logically possible cases—it's the distribution of problems we actually encounter. Evolution has shaped our cognitive heuristics to handle this distribution reasonably well, even if they'd fail on adversarial inputs crafted to exploit weaknesses.

  For example, vision or social reasoning might involve NP-hard problems in theory, but in practice, our brains solve them efficiently because natural environments have regularities. So the tracking condition in (1) is satisfied for the relevant cases, not all cases.

  If I had to pick one premise to reject, it's the leap in (4) and (5) that intractability implies mere guessing. Approximation algorithms exist that give near-optimal solutions efficiently for many practical distributions. Brains likely use such approximations, not blind guesses.

  What would change my mind? If someone showed that real-world problem distributions are as hard as worst-case instances—like if adversarial examples were common in nature—then the argument might hold. But everything we know suggests the opposite: natural problems have structure we can exploit.
answer: |-
  Here's the step I reject: **Premise (5)**. Specifically, the claim that "*a process that guesses on the general problem isn't a truth-tracker*." This misrepresents what truth-tracking requires and conflates "fails on worst-case instances" with "fails to track truth in the relevant range." Let me dismantle it, price the cost, and flag where I could be wrong.

  ### Why (5) Fails:
  1. **"Guesses" ≠ Random or Arbitrary**:  
     Premise (4) says brains "can only guess," implying randomness or blind luck. But in computational theory, "guessing" often means *non-exhaustive search* (e.g., heuristics, approximations, or domain-specific shortcuts). These aren't random; they exploit structure in real-world problem distributions. For example:
     - **Heuristics**: Greedy algorithms for NP-hard problems (e.g., traveling salesman) often yield near-optimal solutions for *typical* instances because real-world graphs have properties like metricity or sparsity.
     - **Evolutionary tuning**: Brains use heuristics refined by evolution/learning to handle *ecologically common* cases (e.g., object recognition, causal inference). These processes track truth robustly *in environments we actually encounter*, even if they fail on adversarial inputs.

  2. **Truth-Tracking is Distribution-Dependent**:  
     Premise (1) requires truth-tracking "across the relevant range of cases." This "range" isn't the *worst-case* set of all logically possible instances (where intractability bites). It's the *actual distribution* of problems an agent faces. If a process succeeds with high probability over this distribution, it *is* a truth-tracker—even if it fails on contrived, exponentially rare cases.  
     - **Example**: Depth perception is NP-hard if formalized as optimal Bayesian inference, but human vision tracks truth reliably because evolution optimized it for Earth-like environments. It fails in hall-of-mirrors mazes, but those aren't "relevant" to our adaptive history.

  3. **Average-Case Efficiency ≠ Cop-Out**:  
     You suspect dismissing worst-case hardness relocates the problem to "relevant range" in (1). But this isn't evasion—it's central to the definition. Truth-tracking isn't about omniscience; it's about *ecological reliability*. Computational learning theory (e.g., PAC learning) formalizes this: many NP-hard problems admit efficient *average-case* algorithms under realistic data distributions. Brains likely implement these.  
     - **Cost of rejecting worst-case absolutism**: You admit epistemology is messy and context-dependent. We can't demand guarantees against logically possible demons—only against plausible adversaries in our universe.

  ### What Giving Up (5) Costs You:
  - **Loss of Purity**: You abandon the clean, worst-case notion of "truth-tracking" that applies universally. Instead, justification becomes *heavily empirical*: it depends on whether our cognitive processes are reliable *given the actual structure of the world and our computational limits*. This forces you into contingent, scientific claims (e.g., "Do human heuristics work well in natural environments?") rather than a priori logic.  
  - **Risk of Complacency**: If "relevant range" is too loosely defined, you might overestimate human reliability (e.g., ignore cognitive biases). You must rigorously engage with cognitive science and complexity theory to demarcate where our heuristics break.  

  ### The Load-Bearing Spot: Worst-Case vs. Actual-Case
  My diagnosis hinges on **the gap between worst-case intractability and real-world feasibility**. If this gap collapses, the argument stands. Here's what would change my mind:  
  - **Evidence that natural problem distributions are hard**: If someone proves that *real-world* hypothesis spaces (e.g., for sensory input, social cognition, or scientific theories) have no exploitable structure—meaning average-case hardness = worst-case hardness—then brains truly "guess" blindly. For example:  
    - A result showing that Bayesian inference over evolutionarily plausible priors is #P-hard *with high probability* (not just in contrived cases).  
    - Neuroimaging revealing that cognition defaults to random sampling under time constraints, even for simple tasks.  
  - **Failure of approximations**: If we show that brain-like heuristics *cannot* achieve constant-factor approximations for core problems (e.g., causal discovery or pattern recognition) in natural environments, premise (5) strengthens.  

  ### Why My Reasoning Might Fail:
  - **Overconfidence in heuristics**: I assume evolution/learning provides adequate shortcuts. But if the world is "adversarial by default" (e.g., if deceptive data is ubiquitous, like in predator-prey dynamics), then even "optimized" heuristics may fail frequently. Cognitive science shows humans *are* systematically biased (e.g., confirmation bias), which weakens truth-tracking.  
  - **Misjudging computational limits**: Brains might be more parallel/randomized than I assume, making polynomial time more powerful (e.g., if BPP = P). Conversely, they might be *weaker*—e.g., if noise dominates, forcing true randomness.  

  ### The Alternative Trap: Rejecting (1)
  You could attack premise (1) by redefining justification (e.g., as coherentism or pragmatic utility). But this costs more: it severs epistemology from truth entirely, making justification unmoored from reality. Your friend's "computational budget" move is a flavor of this—it preserves normativity but concedes that truth isn't the goal. I reject this because it *does* feel like changing the subject. Truth-tracking remains core to epistemology; we just can't demand omnipotence.  

  **In short**: Premise (5) is the crack. Reject the notion that computationally bounded processes must "guess" aimlessly. The cost is embracing a messier, science-dependent epistemology—but that’s where we live anyway. If the world’s complexity is genuinely malicious, not just patchy, I’ll join you in skepticism. Until then, our heuristics are sharp enough.
