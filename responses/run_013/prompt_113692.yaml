  - Round 3: Each player starts with the same initial endowment: 5 goods and 5 coins? Or we can let them keep their coins from Round 2? But Round 2 was 15 minutes, so some might have many coins and some few. That inequality is good for lending.

  In Round 3, we introduce lending. Players can now lend coins to each other for a promise of repayment with interest. They can also trade goods and coins as before.

