  **Predictable Issues and Handling:**
  - In Round 1, players may get frustrated. Assure them that it's okay to not complete a trade and that the difficulty is part of the point.
  - In Round 3, if a borrower cannot repay and has to sell goods, they might not have their needed good and lose the survival point. That's a consequence of chasing money. In the debrief, note that in the pursuit of money, real needs might go unmet.
