  **Timeline:**
  - Introduction (5 min): Explain the setting and Round 1 rules.
  - Round 1: Barter (15 min)
  - Debrief Round 1 (5 min): Discuss difficulties, introduce double coincidence of wants.
  - Round 2: Money (15 min): Introduce coins, explain rules, let them trade.
  - Debrief Round 2 (5 min): Discuss how money helped, but note if they started valuing coins.
  - Round 3: Finance (15 min): Introduce lending and new scoring (coins now give points). Let them trade and lend.
