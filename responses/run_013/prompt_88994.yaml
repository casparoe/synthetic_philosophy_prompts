prompt: |-
  You are a comparative constitutional lawyer and political theorist who has spent a career on the border between measurement and normative argument, and who is as suspicious of indices as of slogans. Think this through carefully before you write. Begin with a short private brainstorm: set out the several incompatible things people mean by democratic backsliding — a rate of change versus a threshold, an outcome versus an intention, a property of a government versus a property of a regime, an event versus a trajectory — and for each one identify the baseline it silently assumes, the cases it cannot classify, and what it would license you to say about a government you already dislike. Decide which of these readings can survive the charge that the label is a partisan instrument. Do not show me the brainstorm. Show me only the speech.

  The occasion. I chair the board of a mid-sized foundation that funds rule-of-law and electoral-integrity work in about a dozen countries, and I am giving the closing remarks at our twentieth-anniversary dinner: roughly 120 people, seven or eight minutes, standing at a lectern, no slides, no notes in hand. Half the room are program officers, grantees, election monitors, investigative journalists, and the three academic political scientists who advise us; the other half are donors and their guests, who follow the news closely and have never read a word of the literature. Next quarter the board votes on whether to adopt a formal determination procedure — a written test that, if a country satisfies it, obliges the foundation to say publicly that the country is backsliding, with the funding and diplomatic consequences that follow. The board is split down the middle. One faction holds that the phrase is a weapon with no content, that we will apply it to governments we dislike and withhold it from governments that are useful to us, and that everyone will see us doing exactly that. The other faction holds that if we cannot say the words we should not be in this business at all. I have to give the speech that settles it, or failing that, makes the disagreement honest. Our charter forbids naming states in public remarks — a rule I helped write — so everything has to be carried by criteria and by a single invented example.

  What the speech has to do.

  - Propose the test: three or four criteria, each operational enough that a staffer could score a country against it, each defended in a clause or two. Invent them; do not simply recycle the categories that existing democracy indices use.
  - Answer who decides. Say whether the determination belongs to outsiders (monitors, funders, foreign scholars), to insiders (domestic courts, journalists, opposition parties, voters), or to some division of labour between them, and say what is lost by locating the authority where you locate it. Notice that the speech is itself an exercise of the power you are trying to allocate.
  - State the strongest version of the partisan-instrument objection in your own voice, then say what the concept has to give up in order to survive it. If you conclude that it cannot survive, write the speech that follows from that conclusion instead.
  - Work one hard case, invented and not modelled on any real country: elections remain genuinely competitive and the incumbent has lost and handed over power, but the courts, the public broadcaster, the civil service, and the largest private media have been rearranged in ways that would outlast a change of government. Say whether your test calls this backsliding; if it does not, say whether that is a defect in the test or evidence that the concept was always narrower than its users assume.
  - Close with a paragraph a non-specialist donor could repeat at breakfast the next morning without getting it wrong.

  Constraints.

  - No citations, no bibliography, no names of scholars, indices, or organizations, no statistics, no dates. Nothing that depends on a fact you cannot establish from where you sit.
  - Do not quote anyone.
  - The concept must do structural work rather than decorate. The speech should be built so that the reason it cannot simply point at abuses, and cannot simply say that the threshold is obvious when you see it, is visible in its order of concessions — in what it grants early, what it refuses to grant, and what it pays for the position it lands on.
  - Both halves of the room must get something: the specialists should meet at least one move they have not seen before, and the donors should be able to follow every sentence.
  - Write it to be spoken aloud, in the voice of a scholar-administrator in her late fifties: dry rather than warm, allergic to uplift, capable of a joke but not of a peroration. Roughly 1,200 words.
reasoning: |-
  Hmm, this is a complex and fascinating request. The user wants me to craft a speech about democratic backsliding for a foundation chair addressing both experts and donors, with specific conceptual and rhetorical requirements. 

  First, I need to unpack the layers. The user has clearly thought deeply about the contradictions in "democratic backsliding" as a concept - it's both a process and an outcome, both institutional and behavioral. The speech must navigate these tensions while proposing an original test. The unspoken baseline assumptions in common definitions are particularly revealing: when people say a country is backsliding, they're always measuring against some implied ideal that may not exist. 

  The audience composition matters greatly. Half are practitioners who'll spot theoretical weaknesses, half are donors who need concrete takeaways. The "breakfast test" requirement means every abstract point must land practically. And the invented country example has to be carefully constructed - elections remain competitive but institutions are hollowed out, which tests whether the foundation values procedure over substance.

  For the test itself, I'll avoid standard democracy indices. Instead, focus on three novel criteria: institutional permanence (can changes be reversed?), source of authority (who legitimizes power?), and pluralistic resilience (do opposition voices survive?). Each needs to be operationalizable - a program officer should be able to apply them without PhD-level analysis. 

  The "who decides" question is thorny. Outsiders see patterns but miss context; insiders understand nuance but may normalize decline. I'm leaning toward a hybrid approach where domestic actors diagnose but international actors confirm - with full awareness this makes the foundation both referee and player. 

  The partisan-instrument objection is crucial. If we only call enemies "backsliding," the term loses meaning. The speech must concede this frankly while arguing that precise criteria create accountability - even when applied to allies. 

  For the hard case: competitive elections with captured institutions. Under my test, this would qualify as backsliding because institutional harm outlasts electoral cycles. That's the key differentiator from temporary democratic erosion. 

  Closing paragraph needs simplicity: "Backsliding means democracy can't self-correct." Donors will remember that. 

  Tone calibration is vital - scholar-administrator voice means no grand rhetoric, just precise concessions. Early admission: the term is imperfect. Refusal: we must still use it. Cost: we'll sometimes misapply it. 

  Structure should mirror the conceptual journey: define the problem → propose test → acknowledge flaws → apply to hard case → conclude with usable insight. The invented country (let's call it "L") will carry the argument when real examples are forbidden. 

  Biggest risk is over-intellectualizing for donors while underwhelming experts. Countermeasures: concrete verbs ("score", "obliges", "rearranged"), avoid passive voice, and bury one truly novel move for specialists - perhaps making institutional reversibility the core criterion, which most indices underweight. 

  Final check: 1200 words means tight paragraphs. No jargon like "polyarchy" or "hegemonic party system." Donors hear "captured courts" not "counter-majoritarian difficulty." Experts hear "permanence threshold" and recognize the Dahl/Müller lineage without citations. 

  This speech won't please everyone - but it might make the disagreement honest.
answer: |-
  (Facing the room, hands resting lightly on the lectern. Voice calm, measured, carrying without strain.)

  Twenty years. Two decades spent alongside all of you – defending institutions, funding watchdogs, shining lights into corners others avoid. We have built something rare: a space where evidence collides daily with conviction. Tonight, we confront a collision point: the demand to formally name ‘democratic backsliding’. Is this a tool we can wield fairly? Or a weapon that will inevitably wound our own credibility? Our board is divided. My task is not to dictate, but to dissect.

  First, the test. If we are to use this term formally, it cannot be a synonym for ‘politics we dislike’. It must capture a *structural shift*, a change in the *kind* of game being played. I propose three criteria, distinct from common indices:

  1.  **Institutional Permanence:** Can core state functions – courts, electoral management, civil service, public media – operate independently *even against the immediate preferences of the current government*? More crucially: if this government loses an election, can these institutions be *reversed* or *reformed* by its successor through established constitutional means? We’re not scoring independence today; we’re asking if the *path* to future independence is visibly being walled off. A staffer looks for legislation or executive actions embedding control mechanisms intended to outlast electoral cycles.
  2.  **Source of Authority:** Does the government derive its legitimacy primarily from *procedural correctness* – adherence to the rules, however contested – or does it increasingly rely on claims of embodying a singular ‘national will’ that transcends those rules? Does it treat opposition as *disloyal*, not merely *wrong*? A staffer tracks rhetoric: do leaders dismiss rulings, investigations, or electoral losses as illegitimate *because* they oppose the outcome? Is dissent framed as treason?
  3.  **Pluralistic Resilience:** Beyond just allowing opposition parties to exist, is the *infrastructure of pluralism* actively maintained? Can diverse media outlets reach significant audiences without crippling financial or regulatory harassment? Can civil society organizations operate, fundraise, and criticize without fear of arbitrary dissolution? Can voters access diverse information sources? A staffer assesses the practical space for organized counter-mobilization, not just the nominal right to exist.

  Who decides? This is paramount. Outsiders – monitors like us, foreign scholars – see patterns insiders might miss. We see the slow drip. But insiders – domestic courts, journalists, opposition parties, voters – feel the weight of the door as it closes. They understand the context, the nuances of resistance. Relying solely on outsiders risks arrogance and irrelevance. Relying solely on insiders risks normalizing the decline, or seeing only the immediate crisis. Therefore, our determination *must* be grounded in *verified reports from credible domestic actors* – judges, journalists, opposition figures, human rights defenders. Our role is not to invent the diagnosis, but to *corroborate* it, to test their evidence against our criteria, and then to *amplify* it. Yes, this speech itself is an exercise of that amplifying power. The cost? We risk missing the subtle, early slide where domestic voices are already being stifled. We accept that cost to avoid the greater peril: pronouncing from afar.

  Now, the strongest objection: “Backsliding is just a partisan label. You’ll slap it on foes, avoid it for friends. Everyone knows the game.” This is not cynical; it is often accurate. To survive this charge, the concept must give up two cherished illusions. First, it must give up *timeless purity*. There is no perfect, unchanging baseline democracy. All systems have flaws. We are not measuring deviation from an ideal. We are measuring a *trajectory* towards a *different kind of system* – one where power is increasingly insulated from popular recall through constitutional means. Second, it must give up *the pretense of neutrality*. Applying this label *is* a political act. It names a problem and demands a response. The survival of the concept depends on rigorous *process* – applying our three criteria transparently to *every* country we engage with, including those whose cooperation we need. We must be willing to call it in places inconvenient for our other interests. If we cannot stomach that discipline, the concept *is* hollow, and we should abandon the formal label.

  Consider a hard case. Picture a country – call it ‘L’. Elections are fiercely competitive. Turnout is high. The incumbent party just lost. They conceded. Power was handed over peacefully. By many measures, democracy works. But look closer. Over the last decade, the previous government systematically reshaped institutions. Key judicial appointments now require supermajorities they engineered, locking in their allies for a generation. The public broadcaster’s leadership is appointed for fixed 15-year terms by a body they stacked. The civil service code was rewritten, making it nearly impossible to dismiss officials hired under their patronage system. The largest private media conglomerate is owned by a close associate, its editorial line unwavering. This new government, having won the election, finds its hands tied. The courts dismiss its challenges. The broadcaster amplifies the opposition. The bureaucracy resists reforms. The media conglomerate attacks relentlessly.

  Is this backsliding? Under our test: Yes. **Institutional Permanence** is gone. These changes bind the new government; reversing them through normal legislative or constitutional means is functionally blocked by the very structures captured. **Source of Authority** shifted: the previous government justified these moves as embodying the "true nation" against "elite sabotage," delegitimizing opposition. **Pluralistic Resilience** is compromised: while opposition parties exist, the dominant media infrastructure distorts the playing field, and the captured institutions actively hinder the new government's ability to govern. The *competitive election* was real, but it occurred *within* a system whose core democratic safeguards had been surgically removed to outlast any single vote. If our test did *not* call this backsliding, that would be a fatal defect. It would mean our concept ignored the slow-motion capture that makes elections less and less meaningful over time.

  So, where does this leave us? We can craft a procedure based on these criteria and this process. It won’t be perfect. We will sometimes hesitate. We might sometimes be wrong. But it will be a shield against arbitrariness. It forces us to look beyond the headline election, beyond the personalities we dislike, to the underlying structures of power and whether they are being deliberately hardened against democratic change. Or, we can conclude that the risk of politicization is too great, that the term is inherently poisoned. That path demands equal honesty: it means abandoning the formal label and finding other, perhaps more modest, ways to describe the erosions we see. Both choices require courage. Both demand integrity.

  For our donors, the takeaway is this: True democratic backsliding isn’t about noisy protests or messy politics. It’s about governments quietly changing the rules of the game so that winning an election isn’t enough to actually change things. It’s when the system loses its ability to correct itself. *That* is what we aim to identify, if we choose to use the term at all. The vote is yours next quarter. Let it be informed. Thank you. (Steps back slightly, nods once.)
