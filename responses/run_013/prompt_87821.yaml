prompt: |-
  I work on a small team building a robot that plans with a symbolic layer sitting on top of a learned controller, and we keep having the same fight. When a behaviour changes after we tweak the planner, half of us say the symbol caused it and half say no, the symbol is just a name we stuck on a pattern in the controller's activations — the little balls did all the shoving and we drew a circle round some of them. (You know the picture: a table of dumb magnetic balls careening around and clumping into higher-level blobs we're tempted to call concepts.) I want a procedure we can actually run before we write "the agent chose X because it represented Y" in a paper or ship it to a customer, because if we're wrong we've shipped a robot whose reasoning is decorative: the questions in order, what counts as a pass on each, where it bottoms out in "can't tell from here," and which steps are really values calls about which level we've decided to explain at. We've got an afternoon per claim, not a PhD, and I dont want a treatise. Run it on three: a planner token whose removal reliably kills a behaviour; a token that predicts the behaviour perfectly but whose removal changes nothing; and the one I expect to hate, where no single token matters, the behaviour is stable, and only the whole pattern predicts it. Tell me straight where the procedure is just hand-waving in a lab coat. And say what would change your mind about your own verdict.
reasoning: |-
  We are given three scenarios to test a procedure for determining whether a symbol (a token in the planner) is causally responsible for a behavior. The goal is to have a practical, non-intrusive method that can be run in an afternoon per claim. We are to evaluate:

  1. A planner token whose removal reliably kills the behavior.
  2. A token that predicts the behavior perfectly but whose removal changes nothing.
  3. A token (or pattern) where no single token matters (the behavior is stable) and only the whole pattern predicts the behavior.

  The procedure must help us decide whether we can truthfully claim: "the agent chose X because it represented Y".

  ### Proposed Procedure

  We assume we have:
  - A trained planner and controller system.
  - The ability to remove or alter individual tokens (or sets of tokens) in the planner's output and observe the resulting behavior.

  We propose a two-step procedure:

  1. **Prediction Check**: Does the token (or set of tokens) predict the behavior? We can measure this by looking at the correlation between the presence/absence (or value) of the token and the occurrence of the behavior. This is observational.

  2. **Intervention Check**: Does intervening on the token (removing it, setting it to a default value, or altering it in a way that breaks the pattern) cause a change in the behavior? We must measure the counterfactual: what happens when we remove the token and then run the system?

  Additionally, we note that in case (3) we are dealing with a pattern of tokens. We might need to consider interventions on the entire pattern.

  ### Step-by-Step for Each Case

  #### Case 1: Token whose removal kills the behavior
  - **Prediction Check**: The token is present when the behavior occurs and absent when it doesn't (perfect predictor?).
  - **Intervention Check**: When we remove the token, the behavior stops. When we restore the token, the behavior returns (if we can do that without affecting other tokens arbitrarily).

  **Verdict**: This token is causally responsible. We can say the symbol caused the behavior because without it, the behavior doesn't occur.

  **What would change my mind?** If it turns out that removing the token is actually disrupting the entire planner in a way that is not specific to the behavior (e.g., causing system crashes or undefined states) then we might be seeing a side effect. We should test by removing other tokens and see if they cause similar disruptions. If the system is robust to removal of other tokens but not this one, then we are more confident.

  #### Case 2: Token that predicts perfectly but removal changes nothing
  - **Prediction Check**: The token is a perfect predictor (when it's present, the behavior occurs; when absent, it doesn't).
  - **Intervention Check**: We remove the token and the behavior still occurs.

  **Verdict**: The token is not causally responsible. It is merely correlated (perhaps because it is generated by the same underlying causes that generate the behavior). We cannot claim the symbol caused the behavior.

  **What would change my mind?** If the removal operation is not actually removing the token in a way that the controller doesn't have access to it? We must verify that the controller is indeed using the token we are manipulating. Also, if the system has redundancy (e.g., multiple tokens representing the same thing) then removing one might not break the behavior. We might need to remove a set of tokens to see an effect. But note: the problem states that removal of this single token changes nothing.

  #### Case 3: No single token matters, the behavior is stable, and only the whole pattern predicts it
  - **Prediction Check**: The entire pattern (a set of tokens) predicts the behavior, but no single token in the pattern is necessary (if you remove any one, the behavior still occurs). Also, the behavior is stable (meaning it happens consistently in the same context regardless of minor token changes?).
  - **Intervention Check**: We remove one token at a time and the behavior persists. However, if we remove the entire pattern (or a critical subset) then the behavior stops.

  **Verdict**: The pattern (as a whole) is causally responsible. We can say the agent's representation of the pattern caused the behavior. However, note that we are now at a higher level of abstraction. We are not attributing causality to a single token but to a configuration.

  **What would change my mind?** If the pattern is so large that removing it is equivalent to removing a huge chunk of the planner's output and thus causing a general failure, then we might be seeing a non-specific effect. We must check if removing a similarly sized random set of tokens also disrupts the behavior. If it does, then the pattern might not be special. Also, we must verify that the pattern is not just a side effect of the controller's internal state (which might be the real cause). We might need to test if we can reconstruct the pattern with different tokens and still get the behavior (if so, then the pattern is a causal driver).

  ### Where the Procedure is Hand-Waving

  1. **Defining the Intervention**: How exactly do we "remove" a token? We must be sure that the removal does not corrupt the rest of the representation in unintended ways. We might be replacing it with a zero, a random value, or a default. The choice might matter.

  2. **Multiple Layers of Causation**: The token might be part of a chain. The real cause might be the controller's interpretation of the token. But if the controller is a black box (learned) then we cannot see that. Our procedure only tests the planner's token.

  3. **Stability of the Controller**: The controller might be robust to missing tokens by inferring them from context. This might explain case 2 and 3. But then the token is still part of the causal story because it was generated by the planner and used by the controller? However, if the controller can work without it, then the token might be redundant.

  4. **Defining the Pattern in Case 3**: How do we define the pattern? We might need a way to identify the set of tokens that form the pattern. This might require a model (like a classifier that predicts the behavior from the tokens) and then using feature importance to define the pattern. But that could be complex.

  5. **Counterfactual World**: We are only doing one intervention (removing the token). We are not testing all possible contexts. There might be unobserved confounders.

  ### Practical Steps for an Afternoon

  For each claim about a token (or pattern) and a behavior:

  1. **Collect Data**: Run the system in a variety of scenarios where the behavior sometimes occurs and sometimes doesn't. Record the tokens and the behavior.

  2. **Prediction Check**:
     - For a single token: compute the predictive power (e.g., accuracy, F1) of the token for the behavior.
     - For a pattern: train a simple classifier (like logistic regression) on the tokens to predict the behavior. If the pattern is known, use that subset. Otherwise, use feature importance to identify the pattern.

  3. **Intervention Check**:
     - For a single token: in a set of test scenarios where the behavior normally occurs, remove the token (set to zero, or a neutral value, or remove the dimension if possible) and run the system. Count how often the behavior still occurs.
     - For a pattern: remove one token at a time and test (if no single token removal breaks the behavior) then try removing the entire pattern. How to remove the entire pattern? We might set all tokens in the pattern to zero, or remove them. We must be cautious of the size.

  4. **Control Interventions**: To rule out non-specific effects, we should also remove a random token (or a random set of tokens of the same size) and see if that disrupts the behavior. If removing a random set of the same size also disrupts the behavior, then the pattern might not be special.

  ### Time Considerations

  - We assume we have a simulator or real robot that can run quickly.
  - We need enough test scenarios to get statistical significance (maybe 20-50 runs per condition?).

  ### Final Verdicts for the Three Cases

  1. **Token removal kills behavior**: Pass. Causal.
  2. **Token predicts but removal does nothing**: Fail. Not causal.
  3. **Pattern predicts, no single token matters, removal of pattern kills behavior**: Pass (for the pattern as a whole). Causal at the pattern level.

  ### What Would Change My Mind?

  - **For Case 1**: If we find that the token is only active in very specific contexts and its removal causes a crash in those contexts but not because of the behavior, then it's not specific. We need to see that the behavior is specifically affected and not just the whole system.
    
  - **For Case 2**: If we discover that the token is being used by the controller in a way we didn't measure (maybe it's being passed through and used by a different module) and our removal method failed to actually remove it from that module, then we might be wrong. But if we are sure we removed it and the controller still behaves the same, then it's not causal.

  - **For Case 3**: If we can show that the pattern is not necessary because we can design a different pattern (with different tokens) that also causes the behavior, then the pattern we identified might be just one of many ways to get the behavior. But that doesn't necessarily break causality — it might be that any pattern from a certain class will do. However, if the pattern is not necessary (because the behavior can occur without any pattern in the tokens) then we are wrong. We must test: can the behavior occur without the pattern? If we remove the pattern and the behavior still occurs (in some scenarios) then the pattern is not necessary.

  ### Conclusion

  The procedure is a practical application of causal inference (intervention) combined with prediction. It is hand-wavy in that we are not modeling the entire system and we are making assumptions about the intervention (that it is clean and specific). We are also not accounting for the possibility that the controller might have internal states that are the real causes and the tokens are just epiphenomena. However, for an engineering team with limited time, this is a reasonable approach.

  We must be cautious about overclaiming. We can only say that the token (or pattern) is a cause in the context of the system we tested. We cannot rule out that there is a deeper cause in the controller. But for the purpose of writing a paper or shipping to a customer, we have a testable claim: if the token/pattern passes the intervention test, then we can say that without that token/pattern, the behavior would not have occurred (in our tests). That is a causal claim.
answer: |-
  Here's a straight-to-the-point procedure to test symbolic causal claims in your system, designed for an afternoon per claim. The core idea is **intervention + invariance checks**, using prediction as a starting point but demanding causal disruption evidence.

  ---

  ### **The Procedure: 3 Steps (30-60 mins each)**
  **Goal:** Validate *"Symbol X caused behavior Y"*  
  **Tools:** Your planner, controller, test environment, and the ability to remove/alter tokens.

  1. **Predictive Check (Baseline)**  
     - **Action:** Run 20-30 trials in diverse scenarios where Y occurs. Record token states and Y.  
     - **Pass Condition:** X predicts Y with >95% accuracy (e.g., X is present when Y happens, absent otherwise).  
     - **Why?** Rules out *obvious* mismatches. No prediction → no causation.  
     - **Time:** ~30 mins (automate data collection).

  2. **Single-Token Intervention Test (Causal Disruption)**  
     - **Action:** In scenarios where Y *should* occur:  
       - Remove/disable **only X** (e.g., set to zero, null value, or mask its output).  
       - Run 10-15 trials. Observe if Y still occurs.  
     - **Pass Condition:** Y disappears or degrades significantly (>90% reduction) *without breaking unrelated behaviors*.  
     - **Why?** Tests if X is *necessary* for Y. If Y persists, X is decorative.  
     - **Time:** ~45 mins (focus on critical test cases).

  3. **Invariance Check (Specificity)**  
     - **Action:** Repeat Step 2, but:  
       - Remove **control tokens** (e.g., random tokens, tokens for unrelated behaviors).  
       - Remove **tokens co-occurring with X** but not theoretically linked to Y.  
     - **Pass Condition:**  
       - Removing control tokens rarely affects Y (<10% change).  
       - Removing X affects Y more than removing control tokens (statistically significant).  
     - **Why?** Rules out system fragility or confounding factors.  
     - **Time:** ~60 mins (parallelize if possible).

  ---

  ### **Verdicts on Your Three Cases**
  **Case 1: Token removal kills the behavior**  
  - **Verdict:** **Pass.** X is likely causal.  
  - **Why?** Prediction + intervention + specificity checks out.  
  - **What would change my mind?** If the Invariance Check fails (e.g., removing *any* token breaks Y), then X isn’t special—your system is brittle.

  **Case 2: Token predicts perfectly, removal changes nothing**  
  - **Verdict:** **Fail.** X is a correlational artifact.  
  - **Why?** Passes Prediction but fails Intervention. Likely an epiphenomenon (e.g., X is set *by* the controller’s state but doesn’t *drive* behavior).  
  - **What would change my mind?** If X is part of a redundant system (e.g., removing X alone does nothing, but removing X *and* its backups kills Y). Test by removing clusters.

  **Case 3: Only the whole pattern predicts, no single token matters**  
  - **Verdict:** **Conditional Pass** for the *pattern as a whole* (not single tokens).  
  - **Test Modifications:**  
    - **Step 2:** Remove the *entire pattern* (not single tokens). If Y breaks, the pattern is causal.  
    - **Invariance Check:** Remove similarly-sized random patterns. If only *this* pattern breaks Y, it’s specific.  
  - **Why?** Emergent causality requires pattern-level intervention.  
  - **What would change my mind?** If the pattern is too large (>30% of tokens) or removing *any* large pattern breaks Y. Then it’s system-wide fragility, not symbolic reasoning.

  ---

  ### **Where the Procedure is "Hand-Waving in a Lab Coat"**
  1. **Defining "Removal":**  
     - *Risk:* How you remove X matters (zero vs. noise vs. mean value). If results change based on removal method, it’s hand-waving.  
     - *Fix:* Standardize removal (e.g., "set to zero") and document assumptions. Test sensitivity.

  2. **Invariance Check Thresholds:**  
     - *Risk:* "Significant degradation" (e.g., >90%) is arbitrary.  
     - *Fix:* Use statistical tests (e.g., chi-square for Y occurrence) and calibrate to your system’s noise.

  3. **Pattern Causality (Case 3):**  
     - *Risk:* Claiming "the pattern caused Y" without knowing *how* it does so (e.g., is the controller using pattern geometry or just raw activations?).  
     - *Fix:* Add a sanity check: Corrupt the pattern *structure* (e.g., shuffle tokens) while keeping the same tokens. If Y breaks, structure matters.

  4. **Context Sensitivity:**  
     - *Risk:* If Y only breaks in some contexts, your test scenarios might miss edge cases.  
     - *Fix:* Sample scenarios rigorously (e.g., cover states where Y is/has been/isn’t present).

  ---

  ### **What Would Change *My* Mind?**
  - **If you show redundancy:** If tokens are backups for each other (e.g., removing X1 does nothing until X2 is also removed), I’d accept a *set* of tokens as causal.  
  - **If the controller compensates:** If the controller "fills in" missing tokens (e.g., via memory), intervention tests could falsely fail. Show this with activation probes.  
  - **If causation is bidirectional:** E.g., the token triggers behavior *and* the behavior updates the token. Then both are true—but your claim needs nuance.

  ---

  ### **Bottom Line**
  - **Passing Tokens:** Must **predict** *and* **disrupt** *and* **be specific**.  
  - **Ship/Paper-Ready:** Only Cases 1 and 3 (pattern-level) pass. Case 2 is a red flag.  
  - **Time Budget:** Prioritize Intervention Tests. Skip elaborate analyses—engineer, don’t philosophize.  
  - **When in Doubt:** Say *"The symbol correlates with behavior and its removal disrupts it in tested contexts"*—not *"causes"*.
