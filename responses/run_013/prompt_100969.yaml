prompt: |-
  My sister has this ongoing thing where she rules on whether it was ok to break a promise somebody made. Her calls so far: skip a promised lunch with a friend to drive your dad to the ER — fine. Skip that same lunch for a better lunch — not fine. Blow off your neighbors move to go pick up your sister from a car wreck — fine. Blow off your sisters move to help your neighbor move — not fine. Cancel babysitting for some lady you barely know so you can take your own kid to urgent care — fine. Cancel that babysitting to go to a movie — not fine.

  New one she hasnt ruled on: you promised your close friend you'd help them move this Saturday, then a coworker you barely know calls in a panic — their mom has dementia and is lost downtown in the cold and you're the only one who can go get her. Whats my sister gonna say? I want to know if shes actually running a rule here or just going case by case, because a friend told me thats the whole seperate debate in ethics about whether morality is rule-based or judgment-based. If shes being consistent, what rule is she running, what's her call on the new one, and what case would settle which rule it really is? If it genuinely could go either way, say which you'd bet on and why.
reasoning: |-
  Okay, let me unpack this user's query. They're describing their sister's judgments on promise-breaking scenarios, trying to figure out if there's a consistent ethical rule or if it's case-by-case. The user mentions a friend brought up the ethics debate between rule-based vs. judgment-based morality. Now there's a new scenario: skipping helping a close friend move to help a coworker's lost dementia-stricken mom. The user wants to predict the sister's ruling and understand her underlying principle.

  First, I need to analyze the sister's past rulings. Looking at the examples: medical emergencies (dad to ER, sister from car wreck, kid to urgent care) always override promises. Social plans (better lunch, neighbor's move, movie) don't justify breaking commitments. The pattern seems to prioritize urgent welfare needs over social obligations. 

  The new case presents tension between two good deeds: helping a friend (important but non-urgent) vs. rescuing a vulnerable person (immediate danger). The dementia mom scenario involves clear physical risk - exposure, disorientation, potential harm. The moving help, while promised to a closer relationship, lacks time sensitivity. 

  I recall ethical frameworks: deontology (rule-based) vs consequentialism (outcome-based). The sister appears to use a modified consequentialism where "urgent welfare need" creates moral permission to break promises. But she's not purely utilitarian - she didn't approve breaking promises for mere social upgrades, showing she values commitment integrity when no welfare issue exists.

  For the dementia case prediction: all elements align with her past approvals - extreme urgency, vulnerable person, no alternatives. The "barely know" coworker aspect might give pause, but the imminent danger likely trumps relationship proximity here. If she ruled against it, that would suggest relationship depth matters more than I thought, but her history doesn't support that.

  To test the rule definitively: imagine a scenario where breaking a promise for a minor welfare need (e.g., skipping moving help to fetch coworker's lost phone). If she disapproves, it confirms "scale of need" matters. Or if she approved breaking a promise to help a stranger in identical dementia situation, it proves relationship irrelevance.

  I'm betting she approves this promise-break. Why? 1) Matches her emergency/welfare pattern 2) The "only one available" element mirrors her ER/car wreck precedents 3) Unaddressed dementia wandering can quickly become life-threatening, meeting her urgency threshold. The fact it's not blood relation seems irrelevant given her babysitting-for-urgent-care ruling favored family over acquaintance.
answer: |-
  Based on your sister's clear pattern of rulings, she's absolutely running a consistent ethical rule. She's not just going case-by-case arbitrarily. Here's the breakdown:

  **Your Sister's Rule:**
  **It is morally permissible to break a promise *only* when fulfilling the promise would prevent you from responding to a significantly more serious, unforeseen, and urgent welfare need (especially involving safety, health, or extreme vulnerability), particularly for someone with a closer relationship or greater dependency on you.**

  **Key Elements of Her Rule:**
  1.  **Urgent Welfare Need:** The reason must involve preventing significant harm (physical/mental health, safety, extreme distress), not mere convenience, preference, or social gain.
  2.  **Unforeseen:** The conflict couldn't reasonably have been anticipated when the promise was made.
  3.  **Significance/Scale:** The welfare need being addressed must be substantially more serious than the inconvenience/disappointment caused by breaking the promise.
  4.  **Relationship/Vulnerability:** Helping family, a dependent, or someone in extreme vulnerability (like the lost dementia patient) often carries more weight than helping an acquaintance for a routine task, even if promised. The person needing help *now* is often in a much more vulnerable state.
  5.  **No Reasonable Alternative:** Implied in her rulings is that you are the necessary or best-placed person to handle the urgent need (e.g., "only one who can go get her," driving your own dad/sister/kid).

  **Applying the Rule to the New Case (Help Friend Move vs. Find Coworker's Lost Mom):**

  1.  **Urgent Welfare Need:** **EXTREME.** An elderly person with dementia lost downtown in the cold faces severe, immediate risks: hypothermia, injury, confusion, panic, getting hit by traffic, exploitation. This is a life-threatening emergency.
  2.  **Unforeseen:** Presumably, neither the move nor the coworker's mom getting lost was anticipated when you made the promise to your friend.
  3.  **Significance/Scale:** Preventing potential death/injury vs. causing significant inconvenience (friend has to reschedule/find other help). The scale heavily favors helping the mom.
  4.  **Relationship/Vulnerability:** The *promise* was to a close friend. However, the *person needing urgent help* is extremely vulnerable and dependent *at this moment* (the lost mom). The coworker, while barely known, is acting on behalf of their highly vulnerable mother. The mom's immediate vulnerability outweighs the friend's claim based on the promise for a non-urgent task.
  5.  **No Reasonable Alternative:** Explicitly stated: "you're the only one who can go get her."

  **Your Sister's Call:** **FINE.** Breaking the promise to help your friend move is morally permissible to rescue the coworker's lost mother.

  **Why This Fits Her Pattern:**
  *   It mirrors the "ER vs. Lunch" and "Car Wreck vs. Move" scenarios: An unforeseen, serious welfare emergency trumps a promised social commitment, regardless of the closeness of the original promisee.
  *   It mirrors the "Babysitting vs. Urgent Care" scenario: An unforeseen, serious welfare need for someone dependent (your kid) trumps a promise to an acquaintance, even if it causes them hardship. Here, the welfare need is arguably *more* urgent and the person *more* vulnerable (lost dementia patient vs. your own kid needing urgent care), and the promise is to a closer person (close friend vs. lady you barely know), but the *scale of the emergency* still dominates.

  **The Test Case to Settle the Rule:**

  To confirm the exact boundaries of her rule, especially the "significance" and "relationship/vulnerability" weighting, propose this case:

  *"You promised your spouse/child you'd attend their important recital/graduation ceremony. Then, a neighbor (whom you know casually) calls in a panic because their pet cat is stuck high up in a tree in their backyard and might fall, and they can't reach it. They beg you to come help because you have a tall ladder. Is it fine to miss the recital/graduation to rescue the cat?"*

  **Why this settles it:**
  1.  **Welfare Need?** Yes, the cat *could* be hurt if it falls. But it's a *potential* minor injury to an animal, not a *certain* or *severe* threat to a human.
  2.  **Urgency?** Moderate (cat is distressed), but not comparable to human medical emergencies or being lost with dementia.
  3.  **Significance?** Missing a major, irreplaceable family event (recital/graduation) vs. preventing a *possible* minor injury to a pet. The scale heavily favors keeping the promise to the close family member for the significant event.
  4.  **Relationship/Vulnerability:** Extremely close relationship (spouse/child) and significant emotional event vs. casual neighbor and a pet.

  **Prediction:** Your sister would say **NOT FINE.** Breaking the promise is impermissible.

  *   **If she says NOT FINE:** It confirms her rule requires a *very high threshold* of welfare need (significant risk to human health/safety) to override a promise, especially to close relations for significant events. The cat rescue, while a welfare issue, doesn't meet the threshold compared to the importance of the family commitment.
  *   **If she says FINE (unlikely based on pattern):** It would suggest her rule prioritizes *any* welfare need over *any* promise, regardless of scale or relationship, which contradicts her disapproval of skipping lunch for a "better lunch" or babysitting for a movie.

  **Your Bet:**

  I would **heavily bet** your sister rules **FINE** to break the moving promise to rescue the dementia patient. Her pattern consistently prioritizes responding to unforeseen, serious welfare emergencies involving vulnerable individuals over keeping promises for routine social commitments, even to closer friends. The lost mom scenario is a quintessential example of the kind of emergency her rule exists to justify breaking a promise for.

  The core of her rule is **mitigating significant, unforeseen harm to vulnerable beings when you are uniquely positioned to help.** The moving help, while important to your friend, doesn't involve preventing imminent harm. Finding the lost mom absolutely does.
