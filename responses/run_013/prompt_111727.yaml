  ### Constructed Case

  **Scenario Narrative:**  
  Alice is a professional artist who paints landscapes and lives in Paris, where she has been close friends with Bob since childhood. Consider a possible situation where she became a portrait painter instead, while still living in Paris and maintaining her friendship with Bob. Now imagine a further scenario, branching from the first: after becoming a portrait painter in Paris, she moves to London and gradually forms a new close friendship with Dave, losing touch with Bob. In this second scenario, she is a portrait painter in London with Dave as her closest friend.

  **Stipulated Counterpart Relation and Similarity Metric:**  
  - **Similarity Metric:** Assign points for shared qualitative properties (artistic style: 30 points; childhood friend: 25 points; city: 25 points; other personal history: 20 points). Counterpart status requires ≥50 points.  
  - **Counterpart Relations (by Fiat):**  
    | World  | Individual          | Counterpart Of           | Similarity Score | Counterpart? |  
    |--------|---------------------|--------------------------|------------------|--------------|  
    | w0     | Alice (landscapes, Bob, Paris) | —                        | —                | —            |  
    | w1     | Alice (portraits, Bob, Paris)  | w0-Alice                 | 70 (0 style + 25 friend + 25 city + 20 other) | Yes |  
    | w2     | Alice (portraits, Dave, London)| w1-Alice                 | 50 (30 style + 0 friend + 0 city + 20 other) | Yes |  
    | w2     | Alice (portraits, Dave, London)| w0-Alice                 | 20 (0 style + 0 friend + 0 city + 20 other) | No  |  

  **De Re Modal Claim:**  
  "That person (actual Alice) could have been a portrait painter in London with Dave as her closest friend."

  **Verdicts and Reasoning:**  
  - **Counterpart Theory Verdict:** **False**.  
    Reasoning: The claim is true only if a counterpart of w0-Alice in some world has the property. w2-Alice has the property, but she is not a counterpart of w0-Alice (score <50). w1-Alice is a counterpart but lacks the property (she is in Paris with Bob).  
    Premise: De re modality requires a direct counterpart with the property (Lewis 1968).  

  - **Transworld Identity Verdict:** **True**.  
    Reasoning: w0-Alice is identical to w1-Alice (same person, different choice). w1-Alice is identical to w2-Alice (same person, different location/friend). By transitivity of identity, w0-Alice is identical to w2-Alice. Thus, w0-Alice has the property in w2.  
    Premise: Identity is transitive and governs cross-world predication (Kripke 1980).  

