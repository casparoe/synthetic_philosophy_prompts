prompt: |-
  I'm a software engineer with no formal philosophy training, and I've been trying to work out what I actually believe about accepting things on other people's say-so. I have a set of fairly firm verdicts about particular cases, and I want to know whether one principle generates them or whether I'm quietly applying different rules in different places. I'm told there's a long-running dispute between people who hold that testimony justifies belief only when you have independent grounds to think the speaker reliable on that occasion, and people who hold that testimony is a basic source of justification, like perception, so that trust is the default and the burden falls on whoever wants to distrust. I haven't read that dispute and I'm not asking for a reading list or a summary of who said what. I want to know which position, if either, fits the verdicts below, and where my verdicts are simply inconsistent.

  My verdicts:

  1. A stranger at a station tells me the next train leaves from platform 4. I believe them. I have never met them, I know nothing about their reliability, and I could have looked at the board. Believing them seems entirely fine to me.
  2. A colleague tells me a function in a third-party library is thread-safe. I believe them, though I've never tracked their accuracy on library semantics.
  3. A vendor's whitepaper says their database sustains ten thousand writes per second on commodity hardware. I don't believe it at all until I run the benchmark myself. The speaker is a professional and may well be reporting honestly; I still think believing them would be a mistake.
  4. A user reports that the export button crashes on Safari. I believe them immediately, even though users misdiagnose causes constantly and I've been burned by reports before.
  5. A friend who is confidently wrong about most technical matters tells me a configuration flag defaults to true. I half-believe them, largely because I can settle it in ten seconds. If settling it took an afternoon, I wouldn't believe them at all.
  6. The same friend tells me our former manager was pushed out in a dispute with the board. I don't believe them, and no amount of cheap checking would help, because there is nothing I could check.
  7. My doctor tells me my fatigue is probably sleep apnea. I believe them, even though I can't assess their reasoning and my own reading pointed elsewhere.
  8. Someone sincerely and in detail tells me they were abducted by aliens. I don't believe them.
  9. Two hundred forum answers state the same obscure fact about a compiler. I discover they are all copies of one original answer, and my confidence falls back to what it was for that single answer.
  10. Two hundred colleagues who don't talk to each other independently report the same intermittent bug. My confidence rises sharply.
  11. I come to trust a blogger on database internals by reading their posts and finding them right on the parts I could check. So my confidence in their uncheckable claims rests on my having already trusted some of their claims. This seems legitimate to me, even though the first step can't be justified without the very thing I'm trying to justify.
  12. A coding assistant tells me a library function silently truncates its input past a certain length. I don't believe it even provisionally; I treat the message as a search query and go read the source. From a colleague I would provisionally believe the same claim and perhaps verify later. My track record with the two is roughly comparable, so the asymmetry bothers me.

  The tentative principle I'd offer is this: trust is the default, and the default is defeated when the speaker has a stake in my believing them, when the claim is extraordinary relative to what I already accept, or when being wrong would cost me a lot; and where verification is cheap, I stop caring about the speaker's reliability altogether. That principle gets case 3 and case 8 and case 1, but it seems to say nothing that distinguishes case 5 from case 6, and it gives me no account of case 11 or the asymmetry in case 12.

  What I want: the principle, or the smallest family of clauses, stated precisely enough that I could apply it to a case I haven't thought of; an honest statement of which of my twelve verdicts the principle cannot accommodate and why; and its predictions for cases I haven't listed — a colleague who has been wrong twice before tells me something ordinary and uncheckable; an anonymous post that agrees with my prior turns out to trace back to one source; an assistant contradicts the documentation on a point I can't test by running code; someone who benefits from my believing them describes a meeting I missed; my own memory disagrees with a log file. I'd also like to know whether "cheap to check" belongs in a principle about justification at all, or is just a fact about what I'll bother to do, and whether the circular-looking step in case 11 is a real defect or ordinary inductive practice. If the verdicts can't be unified, say so plainly and tell me which one to give up.
reasoning: |-
  Okay, the user is a software engineer trying to reconcile their intuitive judgments about trusting testimony with philosophical principles. They've listed 12 specific cases where they either trust or distrust others' claims, and they want a unified principle that explains all these verdicts. 

  First, I notice their tentative principle has three main components: default trust, defeaters (stakes, extraordinariness, speaker's stake), and the cheap verification exception. But they're struggling with cases 5 vs 6 (same unreliable friend but different responses) and the circularity in case 11. 

  Hmm... the core tension seems to be between two philosophical approaches: reductionism (needing independent evidence for trust) and anti-reductionism (default trust). But their judgments don't neatly fit either. For instance, they default-trust strangers about trains (case 1) but distrust vendors' benchmarks (case 3) - suggesting stakes matter. Yet they trust users about crashes (case 4) despite high error rates, which contradicts pure stakes-based reasoning. 

  The asymmetry in case 12 is particularly interesting. Why distrust an AI assistant but trust a colleague with comparable accuracy? This feels like a "source type" bias - humans get default trust while tools don't. But is that rational? Maybe it relates to intentionality or accountability. 

  For the unreliable friend cases (5-6), the key differentiator appears to be checkability. When verification is cheap (case 5), they're willing to semi-trust; when uncheckable (case 6), distrust prevails. But their stated principle doesn't explicitly make checkability a defeater - it's currently framed as an exception. 

  Ah! The circularity in case 11 (trusting a blogger after partial verification) mirrors how we establish scientific instruments' reliability - we calibrate them against known truths. This isn't logically circular but epistemically virtuous. The first step isn't "unjustified"; it's a necessary calibration cost. 

  Now for constructing a better principle... We need: 
  - Default trust baseline 
  - Explicit defeaters: stakes, extraordinariness, speaker's stake 
  - Explicit enablers: cheap verifiability, multiple independent sources 
  - Source-type considerations (human vs non-human) 
  - Calibration as valid justification 

  The revised principle should handle: 
  - Case 5/6 via checkability as a distinct factor 
  - Case 12 via source-type qualifier 
  - Case 11 by embracing calibration cycles 
  - Case 9/10 through the independence clause 

  For unresolved tensions: case 4 (trusting error-prone users) contradicts the stakes factor unless we weight "social obligation to trust user reports" higher than efficiency concerns. And case 7 (trusting doctors over own research) suggests accepting institutional authority as a positive reason beyond mere absence of defeaters. 

  Ultimately their judgments reveal a pragmatic, engineer's epistemology: truth-seeking but cost-sensitive, willing to accept "good enough" justifications when perfection is expensive. The circularity concern in case 11 is misplaced - it's bootstrapping, not begging the question. 

  The biggest philosophical nudge they need is recognizing that "cheap verification" isn't just practical - it epistemically transforms the situation by lowering justification standards. When truth is easily accessible, we don't need strong reasons to trust; we can afford to be gullible because errors are cheap to fix.
answer: |-
  Here's a principle synthesizing your verdicts, followed by an honest assessment of its fit, limitations, and predictions:

  **Unified Principle:**
  Trust is the *provisional default* for human testimony concerning *ordinary claims*, but this default is **defeated** if any of the following hold:
  1.  **Significant Stakes:** Being wrong would incur high practical or epistemic cost *for you*.
  2.  **Extraordinary Claim:** The claim significantly contradicts your justified background beliefs without compelling new evidence.
  3.  **Speaker Conflict:** The speaker has a significant stake (material, reputational, ideological) in your believing the claim *beyond* truth-telling.
  4.  **Source-Type Distrust:** The source is non-human (AI, tool) or institutional documentation lacking clear individual accountability.
  5.  **Uncheckability:** The claim is practically impossible for *you* to verify independently, *and* defeaters 1, 2, or 3 apply, *or* you have specific prior reason to doubt *this* speaker's reliability on uncheckable matters.

  **Calibration & Confidence Adjustment:**
  *   **Cheap Verifiability:** Acts as a *suspension mechanism* for defeaters 1, 2, 3, and 5. If verification is trivial, trust becomes rational *regardless* of these factors, as the cost of potential error is negligible.
  *   **Multiple Independent Sources:** Significantly increases confidence by reducing the probability of shared error or bias. Dependence (like copying) negates this boost.
  *   **Calibration via Checked Claims:** Trusting a source's uncheckable claims based on their verified reliability on *related* checkable claims is legitimate inductive reasoning, not circularity. The initial verified claims provide *evidence* for the source's general competence/honesty on the topic.

  **Analysis of Your Verdicts:**

  1.  **Train Platform:** Fits. Ordinary claim, low stakes, no defeaters. Default trust applies. Cheap verifiability suspends minor concerns.
  2.  **Thread-Safe Function:** Fits. Like #1 - ordinary claim (in context), low stakes for colleague, no defeaters. Default trust.
  3.  **Vendor Benchmark:** Fits. Defeater 3 (Speaker Conflict - vendor has stake in selling). Defeater 1 (High Stakes - using wrong DB is costly). Cheap verifiability exists, but high stakes make verification *necessary*, not just sufficient to suspend distrust.
  4.  **User Crash Report:** *Partial Fit.* Defeaters *could* apply (users can be unreliable - prior doubt; stakes could be high). However, you prioritize defeater suspension via **Social/Epistemic Role**: Users reporting bugs play a vital role in the system; distrusting *all* reports undermines this. Low cost of *provisional* belief (you'll debug anyway) acts like cheap verifiability. Your verdict prioritizes this role over pure reliability track record.
  5.  **Unreliable Friend (Config Flag):** Fits. Defeater 5 applies (Prior Doubt + Uncheckable *if verification costly*). Cheap verifiability suspends this defeater, allowing provisional belief.
  6.  **Unreliable Friend (Manager):** Fits. Defeater 5 applies strongly (Prior Doubt + Intrinsically Uncheckable). Defeater 2 (Extraordinary? Depends on context, but likely fits "unreliable source + uncheckable" as extraordinary *justification*). No cheap verifiability to suspend.
  7.  **Doctor Diagnosis:** Fits. Ordinary claim (for a doctor), high stakes *but* defeater suspended by **Institutional Authority/Expertise**. Doctor's role and training provide positive justification beyond default trust, countering Defeater 1 and your own reading.
  8.  **Alien Abduction:** Fits. Defeater 2 (Extraordinary Claim) overwhelmingly applies.
  9.  **Copied Forum Answers:** Fits Calibration rule. Non-independent sources don't boost confidence beyond the original. Identifies dependence correctly.
  10. **Independent Bug Reports:** Fits Calibration rule. Independence significantly boosts confidence by reducing chance of shared error.
  11. **Blogger Calibration:** Fits Calibration rule. Legitimate induction. The "first step" *is* justified by your direct verification of *those specific claims*. That verified track record then justifies trust in *related*, unverified claims.
  12. **Assistant vs Colleague (Truncation):** Fits Defeater 4 (Source-Type Distrust). You treat non-human tools as requiring verification by default, lacking the intentionality and accountability assumed in human testimony. Colleagues get default human trust suspended only by other defeaters (which aren't present here).

  **Where the Principle Needs Refinement / Where Verdicts Are Tension Points:**

  *   **Case 4 (User Report):** The principle *can* fit (low cost of provisional belief acting like cheap verifiability; prioritizing the user's role), but it's the weakest fit. Your willingness to trust *despite prior bad experiences* suggests a strong **Epistemic Role** factor ("users are *supposed* to report symptoms, I *must* take them seriously as a starting point") that isn't explicitly captured. This clashes slightly with Case 3 (Vendor), where role/stake leads to distrust.
  *   **Case 7 (Doctor):** The principle fits via suspending defeaters through expertise, but your verdict feels *stronger* than mere absence of defeaters. It implies **Positive Authority** as a justification source, not just default trust. This is consistent but highlights that "expertise" functions as a powerful justifier.

  **Predictions for New Cases:**

  *   **Colleague wrong twice before (Ordinary, Uncheckable):** **Distrust (Defeater 5 - Prior Doubt + Uncheckable).** Unless the claims were trivial/cheaply verifiable previously, two errors create specific doubt. Uncheckability prevents suspension of this doubt.
  *   **Anonymous post agrees with prior, traces to one source:** **Confidence drops significantly (Calibration rule).** Independence was key to the boost; discovering dependence reverts confidence to that of the single source.
  *   **Assistant contradicts docs (untestable):** **Distrust Assistant, lean towards Docs (Defeater 4 + Calibration/Authority).** Source-Type Distrust for the Assistant. Docs, while sometimes wrong, represent institutional authority (like the doctor's expertise, though weaker). Default trust applies more to the docs than the AI. You'd likely try to verify docs or seek human confirmation.
  *   **Person benefiting tells about missed meeting:** **Provisional Belief, Verify if Possible (Defeater 3 Suspended by Cheap Verifiability/Low Stakes).** Speaker Conflict exists, but if stakes are low (e.g., minor meeting) and verification is easy (ask another, check calendar), distrust is suspended. If stakes are high (e.g., disciplinary meeting), distrust prevails until verification.
  *   **Memory vs Log File:** **Trust Log File (Defeater 2 + Calibration).** Memory is notoriously fallible (Extraordinary to trust it over a contemporaneous log *if* the log is presumed reliable). Logs have a track record of accuracy (calibration) for recording events. You'd investigate *why* they disagree, but default to the log.

  **Cheap Verifiability & Circularity:**

  1.  **Cheap Verifiability:** This **does belong in a principle about justification** in your framework. It doesn't make the belief *initially* justified by testimony alone. Instead, it makes the *cost of potential error* so low that the *rational requirement for independent justification* is lifted. It transforms the situation epistemically by making reliance on testimony pragmatically optimal and risk-free. It's not just laziness; it's rational cost-benefit analysis applied to epistemology.
  2.  **Case 11 Circularity:** It **is ordinary inductive practice, not a defect.** You are not justifying trust in testimony *in general* circularly. You are justifying trust in *this specific source* based on direct evidence of *their past reliability on specific, verifiable claims*. This is bootstrapping, not begging the question. The initial verified beliefs are justified *empirically* (by your own verification). You then inductively infer the source's general reliability. Trusting their unverified claims is justified *by the inductive inference*, not by the testimony itself in a circular loop. This is how we justify trusting *any* instrument or expert: we calibrate them against known standards.

  **Inconsistency & Recommendation:**

  Your verdicts are **largely consistent** with the refined principle above, incorporating "Source-Type Distrust," "Institutional Authority/Expertise," and an explicit role for "Epistemic Role" (especially for user reports). The main tension is:

  *   **Case 4 (User Report) vs. Implicit Principle:** Your trust here, despite potential unreliability and prior bad experiences, relies heavily on the **essential epistemic role users play** in your workflow. This trust is functional and necessary, overriding pure reliability concerns *in this specific context*. While the principle can *accommodate* it (via low cost of acting on the report/acting like cheap verifiability), it's the verdict most reliant on a unique contextual factor. **Don't give it up.** It reflects a pragmatically sound engineering practice. Instead, explicitly acknowledge "Epistemic Role" (like bug reporters, doctors, documentation) as a factor that can *override* distrust stemming from generic unreliability or even minor stakes.

  **Conclusion:**

  Your intuitive epistemology is sophisticated and pragmatic. It blends default trust for humans with specific, context-sensitive defeaters. Key refinements are recognizing **Source-Type Distrust** (AI/tools), the powerful role of **Calibration via Checked Claims**, the epistemic impact of **Cheap Verifiability**, and the contextual importance of **Epistemic Role/Institutional Authority**. The smallest family of clauses capturing this is the **Defeated Default Trust Principle** with **Calibration & Confidence Adjustment Rules**, explicitly including the factors above. Your verdicts are coherent within this framework, with Case 4 highlighting the practical importance of functional epistemic roles in your specific domain.
