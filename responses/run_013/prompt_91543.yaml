  (Addressing the audience)

  Good morning. It’s an honor to open this workshop, “Why Britain and Not China?” — a question that has shaped decades of scholarship. I thank the steering committee for setting this title, and all of you for coming to engage it.

  But I must confess: I believe the question, as phrased, is not well posed. Not because it’s unanswerable, and not because the work it inspired was wasted — quite the opposite. It’s because of what kind of question it is.

  Every “why” question has hidden parts. When we ask “why P?”, we never mean “why P in absolute terms?” We mean “why P rather than Q?” — where Q is some alternative. And we also mean “why P in terms of factors that matter for R?” — where R is what we care about. Without these, we don’t know what facts are relevant.

  Imagine two friends in a coffee shop. One asks, “Why did you order tea?” 
  - If the contrast is “instead of coffee?”, the answer might be “Because I don’t want caffeine.” 
  - If the contrast is “instead of nothing?”, the answer might be “Because I’m thirsty.” 
  - Without knowing the contrast, the question is under-specified. It’s not unanswerable — you could list every reason for ordering tea — but without the contrast, you don’t know which reasons count.

  Now look at our title: “Why Britain and Not China?” What’s the contrast? 
  - Is it “Why Britain rather than Holland?” Then we focus on what set Britain apart in Europe — say, coal or institutions. 
  - Is it “Why Britain rather than the Yangzi Delta?” Then we look at what one had that the other lacked — but note, the Yangzi Delta was a powerhouse of the early modern economy. We cannot assume it was “falling short.” 
  - Or is it “Why Britain rather than anywhere?” Then we’re asking why the Industrial Revolution happened at all — a profound, but different, question.

  Each of these is valid, but each requires different evidence. The title question, as it stands, doesn’t specify. So it’s under-specified.

  To the China historians: your work on this question is not idle. It has revealed the dynamism of late imperial China — the markets, the inventions, the institutions that made it, in many ways, the most advanced economy of its time. We cannot dismiss that. But we must ask: “not China” compared to what? Without that, we risk treating Europe as the default — as if China’s path was a deviation. It wasn’t. It was its own story.

  To the quantitative historians: you’re right to demand precision. An under-specified question can lead us to compare apples to oranges. But that doesn’t mean we throw the fruit away. It means we sort it.

  So what can we do in two days? We can’t settle the entire “divergence” debate. But we can do two things: 
  First, we can clarify the contrasts. Which comparisons are most illuminating? 
  Second, we can test specific contrasts with evidence. Papers will ask: “Why Britain and not Holland?” or “Why Europe and not the Yangzi Delta?” — and that’s where progress lies.

  Let’s not waste time asking if the question was a mistake. Let’s make it well posed. Then we can answer it.

  Thank you.

