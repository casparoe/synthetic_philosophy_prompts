answer: |-
  ### Opening Address: "Why Britain and Not China?"  

  Good morning. It’s an honor to open this workshop, and I thank the steering committee for inviting me. The title they chose—"Why Britain and Not China?"—has driven decades of pioneering work. I accepted this role because I believe that question matters, but also because I believe it isn’t yet complete. Not because it’s unanswerable, and not because the scholarship it inspired was wasted—far from it. It’s incomplete because of *how* it asks.  

  Every "why" question has two hidden parts. First: *what’s the alternative?* "Why tea?" could mean "why tea instead of coffee?" or "why tea instead of nothing?" Second: *what kind of answer counts?* If I ask "why tea?" when the alternative is coffee, you might say "caffeine makes me jittery." But if the alternative is nothing, you’d say "I was thirsty." Without these, we’re guessing. We don’t know what facts are relevant.  

  So let’s look at our title. "Why Britain and Not China?" doesn’t specify the alternative. Is it:  
  - "Why Britain rather than **Holland**?" Then we examine coal, wages, or property rights in Europe.  
  - "Why Britain rather than the **Yangzi Delta**?" Then we compare textile production or market integration.  
  - "Why Britain rather than **anywhere at all**?" Then we’re asking why industrialization happened *once* in human history.  

  These are different questions. Each has answers, but only if we define the contrast. Without it, we risk treating Britain as a default and China as a deviation. China wasn’t "failing." It was thriving—with complex markets, innovation, and resilience that historians here have spent careers illuminating. Their work reveals a Qing dynasty that was, in many ways, the most sophisticated economy of its time. We owe them for that.  

  But when a question is under-specified, it isn’t unanswerable—it’s awaiting clarity. Consider an everyday moment: **Two friends sit in a café. One asks, "Why did you take the train today?"**  
  - If the contrast is *instead of driving?*, the answer might be "traffic was terrible."  
  - If it’s *instead of staying home?*, it might be "I needed a change of scenery."  
  Without the contrast, the question floats. It’s not wrong—it’s unfinished. Facts like "traffic exists" or "scenery is nice" only become answers when we know the alternative.  

  Our title is like that café question. It’s under-specified, not mistaken. And that’s our task these two days: not to declare why China "fell short," or to crown a single cause of divergence, but to sharpen the contrasts. We can ask:  
  - What comparisons—Britain versus Holland, or Britain versus the Yangzi Delta—yield the most insight?  
  - What evidence illuminates one contrast but not another?  

  We won’t settle the grand "divergence" debate here. But we can do something better: we can turn a broad question into precise ones, and let the evidence speak. Thank you.  

  ---

