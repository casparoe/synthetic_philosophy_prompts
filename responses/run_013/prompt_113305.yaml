prompt: |-
  My mum died last year and left me and my brother a half-share in the family farm, which has turned into a proper mess: he wants to sell, I want to keep it going, and the tax bill is the thing that decides it. At the same time I've somehow ended up as the token non-expert on a cross-party group looking at inheritance tax reform, and we've got about 18 months and a tiny budget. So I'm trying to work out which questions in the philosophical debate about inheritance, dynastic wealth, and equal opportunity actually matter for what we recommend, and which are just interesting puzzles.

  Could you give me an agenda, not a survey and definately not a reading list or citations? I want to know which open questions are most worth our time, in what order, and why. Some candidates I keep tripping over: whether the unit of justice is the individual or the family; whether inheritance is a gift, a transfer, or a form of co-ownership; whether equal opportunity requires equal starting points or only fair competition; whether inherited advantage in kind — schooling, networks, expectations — should count as inheritance at all, or only cash and capital; whether the real problem with dynastic wealth is inequality, political power, or the dead hand; and whether a tax should target the estate or the recipient. I'm also curious about a weirder idea I heard: a tax whose rate rises with how long the wealth has been inherited rather than how big it is — so old money gets taxed harder than a first-generation fortune. Is that a serious line, and what would it need to get right?

  Please prioritise for us: we're not trying to solve everything, we're trying to pick two or three questions where some conceptual work would actually change what a policy could look like. For each, tell me why it's upstream of the others (or not), how tractable it is for a small group with more time than expertise, whether it's neglected, and what evidence or argument over the next year would move it up or down the list. Also tell me which questions I should stop worrying about because their answer wouldn't change much downstream. I'd rather have a defended ranking with the trade-offs spelled out than a list of everything anyone has ever written about it.
reasoning: |-
  Okay, let me start by really understanding what this user needs. They're dealing with a personal situation involving their family farm and inheritance tax, while also being part of a policy group with limited resources. Their main request is for a focused agenda on philosophical questions about inheritance tax that could impact policy recommendations, not a broad survey or reading list.

  First, I need to identify which questions are actionable. The user mentioned several candidates like the unit of justice (individual vs. family) and whether inheritance is a gift or transfer. But I should prioritize those where answers directly influence policy design. For example, the unit of justice affects whether tax is levied on the estate or the recipient, which has practical implications for how farms like theirs are taxed.

  The user also brought up a unique idea about taxing based on how long wealth has been inherited. I wonder if this is practical. It might address dynastic wealth but requires tracking lineage, which could be complex. Is this feasible for a small group to explore? Maybe it's too niche compared to more immediate issues like defining the tax base (cash vs. in-kind advantages).

  Another key point is the user's constraints: 18 months, small budget, non-experts. So tractability is crucial. Questions needing extensive data or legal expertise might be out. For instance, equal opportunity debates are foundational but might not yield actionable policies quickly. Instead, focusing on whether to tax the estate or the recipient is more manageable and directly affects legislation.

  I should also consider neglected areas. The user mentioned the tax base question (cash vs. in-kind) as underexplored. Tackling this could lead to innovative policies, like including educational advantages. But it's complex. Still, the group's time could allow for creative thinking here, whereas well-trodden issues like equal opportunity might not offer new insights.

  Then, there's the dynastic wealth tax idea. While intriguing, it might require historical wealth tracking, posing administrative challenges. The group could flag it for future study but not prioritize it now. Instead, the unit of justice question is more immediate—resolving it clarifies other decisions, like exemptions for family businesses.

  Lastly, the user wants to know which questions to drop. Philosophical debates on equal opportunity, while important, might not change policy specifics. Similarly, whether inheritance is a gift or transfer might not impact tax rates as much as other factors. The group should avoid these to save time.

  In ranking, the unit of justice comes first because it's foundational. Then the tax base question, as it's neglected but impactful. Third, the estate vs. recipient targeting. The dynastic tax idea is interesting but not top priority. The user needs clear, actionable insights to shape practical recommendations within their constraints.
answer: |-
  Here’s a battle-tested agenda prioritised for impact on policy design, tractability for your group, and avoidance of rabbit holes. Focus on the **bolded questions** – they’re the leverage points. I’ve mapped the logic clearly.

  ### Core Agenda (2-3 Questions to Deep Dive)
  1.  **What is the fundamental unit of taxation: the estate (the dead) or the recipient (the living)?**  
      *   **Why Upstream?** This dictates *everything*: tax rates, exemptions, progressivity, liquidity rules, and crucially, **how family assets like your farm are treated**. Is the tax a levy on the deceased's accumulated wealth, or a tax on the windfall gain to the heir? Your "half-share" problem hinges on this.
      *   **Tractability:** High. Doesn't require complex modelling initially. Focus on core principles: fairness (burden on who?), administrative ease (easier to value an estate once or track recipients?), economic impact (does taxing the estate discourage saving? Does taxing the heir discourage work?).
      *   **Neglected?** Often glossed over or assumed (estate tax is traditional). Explicitly debating it opens radical alternatives (inheritance taxes, accessions taxes).
      *   **Evidence/Arguments to Move It:**
          *   *Up:* Evidence on liquidity crises forcing sales (like farms/businesses) under estate taxes vs. recipient's ability to pay. Arguments about intergenerational fairness (burdening the dead vs. the living heir).
          *   *Down:* Strong consensus favouring one model in comparable jurisdictions with successful outcomes.
      *   **Downstream Impact:** HUGE. Determines whether you design exemptions *for estates* (e.g., agricultural relief) or *for recipients* (e.g., lower rates for inheriting a primary residence/family business, lifetime allowances per heir). Directly addresses your farm dilemma.

  2.  **What constitutes the "inheritance" to be taxed? (The Tax Base Problem)**  
      *   **Why Upstream?** Defining "it" is essential before taxing it. Is it *only* cash/property transferred at death? Or does "inherited advantage" (elite schooling, networks, trust-fund lifestyles *before* death, parental guarantees) create a *de facto* inheritance that undermines equal opportunity and should be countered? This radically alters the scope.
      *   **Tractability:** Medium-High (Conceptually challenging, but policy implications are clear). Start narrow: Should *inter vivos* gifts above a threshold be clawed back into the tax base? Should educational spending beyond a certain level be deemed a taxable transfer? Ignore *full* valuation of "advantage" – focus on measurable *financial transfers* happening pre-death.
      *   **Neglected?** Severely. Debates fixate on death taxes, ignoring the massive pre-death transfer of advantage, especially by the ultra-wealthy. Your "advantage in kind" point hits the nail on the head.
      *   **Evidence/Arguments to Move It:**
          *   *Up:* Data showing massive growth in *inter vivos* gifting to avoid estate taxes. Evidence linking parental wealth (not just post-death inheritance) to lifetime outcomes. Moral arguments about "fair innings" starting at birth.
          *   *Down:* Clear evidence that including pre-death transfers/advantage is administratively impossible or economically catastrophic.
      *   **Downstream Impact:** SIGNIFICANT. Moves discussion from pure "death duty" towards a broader "lifetime access to unearned wealth" tax. Could lead to: integrating gift taxes, lifetime recipient allowances, or even (radically) wealth taxes on minors based on parental assets. Directly tackles dynastic wealth accumulation *before* it compounds for generations.

  3.  **Should the tax target *dynastic* wealth specifically? (Your "weirder idea")**  
      *   **Why Upstream?** If dynastic power/entrenchment is the *core* harm, not wealth inequality per se, then a novel solution like a **generation-skipping multiplier** (higher rates on wealth inherited across multiple generations) becomes viable. This fundamentally challenges the "bigger pile = higher rate" assumption.
      *   **Tractability:** Medium. Conceptually sharp, administratively complex. Focus *first* on the principle: Is "old money" more harmful/suspect than new? Is the goal mobility or just less inequality? *Then* explore feasibility: Can lineage be tracked reliably? How to define "generation"? What's the base rate? Avoid detailed design initially.
      *   **Neglected?** Very. Standard taxes treat £1M from great-grandpa the same as £1M from dad's startup exit. This explicitly challenges that.
      *   **Evidence/Arguments to Move It:**
          *   *Up:* Evidence that "old money" correlates more strongly with entrenched political/cultural power or lower productivity than new wealth. Strong public concern about aristocracy/oligarchy vs. rewarding entrepreneurs.
          *   *Down:* Proof that dynastic wealth is *not* uniquely problematic, or that tracking is impossibly costly/arbitrary.
      *   **Downstream Impact:** POTENTIALLY HIGH but NARROW. Could revolutionise rate structures if accepted. Creates powerful tools against "dead hand" control without punishing first-generation success. Offers a compromise: lower rates for "new" wealth (helping your farm) but higher rates on entrenched dynasties. *Your group is uniquely placed to float this.*

  ### Lower Priority (Deprioritise Because Impact is Blunt or Too Abstract)
  *   **Individual vs. Family as Unit of Justice:** Important philosophically, but its *primary* impact is already captured in **Question 1 (Estate vs. Recipient)**. How you tax reveals your unit. Don't debate Rawls in committee – focus on the tax mechanism that flows from your implicit choice.
  *   **Gift/Transfer/Co-Ownership:** Interesting metaphysics, but **doesn't change the tax treatment materially.** Whether you call it a "gift" or "co-ownership realised" doesn't alter the £ value received or the liquidity need to pay tax. A distraction.
  *   **Equal Opportunity: Starting Points vs. Fair Competition:** Foundational, but too broad and abstract for *specific* IHT design. It informs the *goal* (which you likely agree on: more mobility) but not the *mechanism*. Focus on the concrete barriers (liquidity, dynastic entrenchment) your tax can address.

  ### Smart Triage for Your Group
  1.  **Start with Question 1 (Estate vs. Recipient):** Resolving this creates the foundational framework. Run scenarios: How would your farm fare under each model? How do liquidity issues differ? (1-2 months)
  2.  **Move to Question 2 (Tax Base - What is "It"?):** Explore integrating *inter vivos* gifts and measurable pre-death advantages. This defines the scope. What "leaks" do you need to plug to make any tax effective? (2-3 months)
  3.  **Then Assess Question 3 (Dynastic Targeting):** Is this a unique harm worth unique tools? If yes, *then* dive into feasibility. If not, shelve it. (1-2 months)
  4.  **Ignore the Lower Priority List:** Actively steer conversation away from abstract philosophy unless it *directly* resolves a stalemate on 1-3. Your mandate is policy, not perfect theory.

  **Why this works for you:**
  *   **Personal Stakes:** Directly tackles your farm dilemma via Q1 & potentially Q3.
  *   **Policy Leverage:** Answers to Q1 & Q2 fundamentally reshape the *structure* of any tax proposal. Q3 offers a novel tool.
  *   **Tractability:** Focuses on principles first, then feasibility. Avoids deep econometrics or legal theory.
  *   **Neglect:** Explores Q2 (advantage) and Q3 (dynastic targeting) which are often overlooked.
  *   **Decision Points:** Clear tests (evidence on liquidity, data on *inter vivos* giving, perceptions of dynastic harm) will show if an idea has legs within a year.

  **On Your Dynastic Tax Idea:** It's a **serious line** of thought (see "Rignano Scheme" or modern proposals by Atkinson/Piketty). It needs: 1) A clear definition of "generation" (e.g., time elapsed? Proven lineage?), 2) A feasible tracking mechanism (e.g., tagging assets at inheritance?), 3) A compelling case that "old money" is uniquely harmful (politically, economically, socially). **Your group *should* explore its core premise (Q3), but only after Q1 & Q2.**

  Focus your limited time where philosophical clarity directly bends the policy metal: **What are we taxing? Who are we taxing it from? And is there a special problem with dynasties?** Good luck – the farm needs this clarity.
