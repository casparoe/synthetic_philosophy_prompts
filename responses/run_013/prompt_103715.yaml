answer: |-
  The law's approach to advance directives reveals a complex, context-dependent conception of personhood and autonomy, privileging the past self in medical contexts while rejecting such authority elsewhere. Here's a reconstruction of the implicit theory, tested against extensions and alternatives:

  **Core Presuppositions of the Practice:**
  1.  **Not Strict Personal Identity:** Honoring the directive does *not* strictly require the thesis that the severely demented woman is literally the "same person" in a deep metaphysical sense. While personal identity (e.g., biological continuity) is a necessary condition for the directive applying to *this* body, the practice functions without resolving debates about psychological continuity.
  2.  **Authority Over Bodily Integrity & Medical Intrusions:** The practice hinges on a powerful conception of **bodily autonomy and the right to refuse unwanted medical interventions**. The earlier self's competent refusal binds because it concerns invasions of the body. This right persists even when the current self lacks the capacity to reassert or rescind it. The body remains the vessel of the person whose autonomy was originally exercised.
  3.  **Respecting Critical Interests & Life Narrative:** The practice primarily relies on **Ronald Dworkin's distinction between "experiential interests"** (present comfort, pleasure) and **"critical interests"** (values, beliefs, convictions about what makes life good or dignified). The directive expresses the signer's critical judgment that life in advanced dementia, sustained by artificial means, lacks dignity or violates their core values. Respecting autonomy means honoring these profound, value-laden choices about one's life narrative, even if the present self, lacking the capacity for such judgments, has different experiential interests (e.g., simple pleasures like eating when fed).
  4.  **Avoiding Harm Through Imposed Life:** It presupposes that forcing life-sustaining treatment *against* a prior competent refusal constitutes a profound harm and violation, akin to battery. This harm outweighs the potential "benefit" of prolonged biological life that the person explicitly rejected as contrary to their values.
  5.  **Weak Paternalism Threshold:** The practice assumes the later self lacks the *competence* necessary to make truly autonomous medical decisions. Respecting the current observable contentment isn't seen as respecting autonomy because the capacity for deep reflection, value judgment, and understanding consequences is absent. The past competent choice fills this void.

  **What it Merely Fits With (But Doesn't Require):**
  *   A narrative view of the self (person as a unified life story).
  *   Certain psychological continuity theories of identity, *if* they emphasize the importance of the values held by the "author" of the life.
  *   The idea that the earlier self "owns" the later body in a strong sense.

  **Underdetermination:** The practice is compatible with rival accounts:
  *   **Personal Identity:** Both biological continuity theories *and* psychological continuity theories (emphasizing minimal connections or valuing the "precedent autonomy" of the past self) can justify it.
  *   **Autonomy:** Both will-based autonomy (binding future self via prior command) *and* value-based autonomy (respecting the critical values embodied in the choice) work.
  *   **Welfare:** Welfare can be defined as respecting critical interests (Dworkin) *or* as avoiding the objective harm of imposed treatment *or* as subjective experiential welfare (though this clashes somewhat).

  **Testing the Theory: The Extended Directive Jurisdiction**
  Extending directives to restraints, contact refusal, or permanent financial control tests the boundaries:

  1.  **Physical Restraint During Psychosis:** Could potentially be justified under the *same logic* as medical treatment if framed as a refusal of unwanted bodily intrusion/restraint during an episode of impaired competence, especially if the goal is preventing self-harm consistent with prior values. It leans heavily on the bodily autonomy and substituted judgment (critical interests) rationale. However, it raises stronger concerns about coercion and defining "treatment."
  2.  **Refusing Contact with a Relative:** More problematic. While related to personal boundaries, it directly restricts social/relational aspects of life the current self might desire, without the clear "bodily intrusion" justification. Honoring this seems to privilege the past self's relational choices over the present self's potential for connection, moving beyond the core bodily/medical focus. It suggests a broader authority over the *shape* of life, not just bodily integrity.
  3.  **Permanent Financial Control After Recovery:** This clearly *fails* the test. It lacks the core elements:
      *   **No Bodily Intrusion:** It concerns external assets, not the body.
      *   **Violates Present Autonomy:** The recovered self is competent and autonomous. Enforcing the directive would permanently override current autonomy, unlike the medical case where current autonomy is absent.
      *   **Critical Interests vs. Competent Choice:** While the earlier directive *might* express a critical interest (e.g., "I'm bad with money"), enforcing it against the recovered, competent self prioritizes the *past* expression of that interest over the *present* self's right to exercise autonomy. This resembles the slavery contract rejection.

  **What the Difference Reveals:**
  The extension test demonstrates that the **medical practice is fundamentally presupposing a *narrow* authority focused on bodily integrity and refusal of unwanted medical intrusions during periods of decisional incapacity.** It is *not* based on a *general* authority of the earlier self over the later one. The rejection of permanent financial control highlights that once competence returns, present autonomy is paramount. The contact refusal case sits uneasily in the middle, suggesting the bodily boundary is crucial but not absolute, and relational autonomy is treated differently than medical bodily autonomy. The core justification is **negative liberty** (freedom *from* unwanted bodily interventions) rather than **positive liberty** (control over the entire future shape of life).

  **Verdict: Best Reconstruction**
  The account that best reconstructs the existing practice is **Dworkin's "Critical Interests" view, grounded in the primacy of bodily autonomy during incapacity:**

  1.  **Respecting Critical Choices:** The directive represents the signer's profound, value-laden judgment (critical interest) about a dignified death and refusal of specific bodily invasions they find intolerable.
  2.  **Bodily Sovereignty:** The enduring right to refuse bodily intrusions provides the strongest, most coherent anchor for overriding the present self's experiential interests. This right persists through incapacity.
  3.  **Threshold of Incapacity:** The practice applies *only* when the current self lacks the competence necessary for autonomous medical decision-making. The earlier directive stands as the best evidence of what the person would choose.
  4.  **Harm Avoidance:** Forcing treatment violates bodily integrity against a competent prior refusal, constituting a significant harm.

  **Defense Against a Rival: The "Present Interests" View (e.g., Allen Buchanan)**
  A serious rival argues that severe dementia creates a new "person" or that the interests of the present, sentient being should dominate. Buchanan contends that the demented individual has interests in well-being (comfort, simple pleasures) and potentially developing new interests, which should not be sacrificed for the sake of the "dead" past self's values.

  *   **Defense of Critical Interests View:**
      *   **Continuity & Betrayal:** While the psychological connections are weak, biological and relational continuity exists (e.g., recognition of the daughter). Denying the directive betrays the life project and values of the person who existed. It treats them as disposable once incompetence sets in.
      *   **Harm of Violation:** Inflicting unwanted medical treatment on the body of the person who explicitly refused it is a concrete harm *to that person*, violating their enduring right to bodily integrity, regardless of the present self's awareness. The present self's contentment doesn't negate this violation; it merely means they are unaware of it.
      *   **Slippery Slope:** Prioritizing present experiential interests risks sliding towards paternalism. If simple contentment justifies overriding a prior refusal, it could justify forced feeding or treatment against explicit directives whenever a demented patient appears "happy," eroding the core principle of bodily self-determination.
      *   **Authenticity of Present Wishes:** The demented individual's apparent lack of distress or simple enjoyment doesn't equate to a *wish to live*, especially via the specific interventions they rejected. They lack the capacity to form or express such complex wishes autonomously.

  **Consequences of Rejecting Critical Interests/Bodily Autonomy for Present Interests:**
  If the law switched to prioritize the present demented self's observable state or imputed interests:

  1.  **Evisceration of Advance Directives:** Directives refusing life-sustaining treatment (especially ANH or antibiotics) would become largely unenforceable if the patient appeared content. The core purpose of controlling future medical care would be lost.
  2.  **Increased Paternalism:** Families and doctors would be empowered (or compelled) to override directives based on their perception of the patient's "current best interests" (focused on prolonging life/comfort), even against explicit prior instructions.
  3.  **Shift in Medical Ethics:** The principle of patient autonomy, particularly concerning end-of-life care, would be significantly weakened. Informed consent for future scenarios would be undermined.
  4.  **Legal Changes:** Laws upholding advance directives (like the PSDA) would need radical revision or repeal. Case law allowing withdrawal of ANH based on directives (like *Cruzan*) might be overturned. Mechanisms to assess "current contentment" would become legally crucial.
  5.  **Moral Distress:** Many would view this as a profound betrayal of individuals who planned ahead to avoid precisely this scenario, forcing them to endure existences they deemed devoid of meaning or dignity.

  In conclusion, the practice of honoring medical advance directives rests primarily on respecting the enduring right to bodily integrity and the authority of competent individuals to make critical value judgments about unacceptable medical interventions, particularly at the end of life, when future incapacity prevents autonomous choice. It does not grant the past self general dominion over the future self, but rather a specific, powerful veto over unwanted bodily intrusions during incompetence, grounded in the profound importance of bodily sovereignty and the prevention of harm through forced treatment.
