  ## Game Theoretic Guidance  
  *With Dr. Rational Choice*

  **Headline:** Stuck in a Strategic Bind? Eliminate Your Way to Clarity!

  **Dear Dr. Choice,**
  My partner and I argue every Friday about dinner. I want Thai, she wants Italian. If we go alone, we each get mildly annoyed. If we go together to the same place, the one who "wins" is happier (say, +1) and the "loser" is less happy (-1), but being together is still better than eating alone (0). It feels like a stalemate! How do we break the deadlock?
  *— Hungry in Hartford*

  **Dr. Choice Responds:**  
  An elegant coordination problem! Consider your pure strategies: Insist Thai, Insist Italian, or Relent (agree to partner's choice). Analyze payoffs relative to your partner's possible actions. "Insist Thai" yields (-1 if she insists Italian, +1 if she relents). "Relent" yields (0 if she insists Italian, +1 if she insists Thai). Crucially, "Relent" is strictly dominated by "Insist Italian": No matter what *she* does, "Insist Italian" gives you at least as good a payoff as "Relent", and strictly better if she insists Italian. Eliminate "Relent". Now, "Insist Thai" is strictly dominated by "Insist Italian" in the reduced game: If she insists Italian, you get -1 vs -1 (same), but if she relents, you get +1 vs 0 (better!). Eliminate "Insist Thai". Only "Insist Italian" survives iterated elimination of strictly dominated strategies. Your partner, rational and performing identical elimination, will conclude only "Insist Italian" survives for her. Equilibrium achieved. Go to Italian. Next problem.

  **Dear Dr. Choice,**
  I have three job offers. Job A: Stable, decent pay, boring (+2 happiness). Job B: Risky startup, huge upside if it works (+5), but could fail miserably (-5). Job C: Medium-risk, medium-reward (+3 if ok, -1 if bad). I can't decide! What's rational?
  *— Perplexed in Pittsburgh*

  **Dr. Choice Responds:**  
  Your indecision stems from weak comparisons. Let's apply dominance. Compare pure strategies: Choosing A, B, or C. Against the "state of the world" (good or bad), no pure choice strictly dominates another. A never beats B head-to-head in a payoff comparison across states. However, consider mixed strategies. A 50/50 lottery between Job A and Job B yields expected payoffs: [(2 + (-5))/2 = -1.5] if world is bad, [(2 + 5)/2 = +3.5] if world is good. Now compare this lottery to choosing Job C: (+3 good, -1 bad). The lottery strictly dominates Job C: It yields -1.5 > -1 if bad, and 3.5 > 3 if good! Therefore, Job C is strictly dominated *by a mixed strategy* and must be eliminated. Rationality forbids choosing C. You are left with A and B. Now, iterated elimination halts: Neither A nor B is strictly dominated by the other or by any mixed strategy over the remaining options. Your rational choice set is {A, B}. Select one arbitrarily. The key insight is the elimination of C; equilibrium allows either A or B. Don't lament the lack of a single prescription – celebrate the removal of error!

  **Dear Dr. Choice,**
  My siblings and I (three of us) do a gift exchange. Rules: Each secretly decides to get a Nice gift ($50 value) or a Cheap gift ($10 value). You get warm fuzzies (+2 utils) for each sibling who gives *you* a Nice gift, but you pay the cost of your own gift choice. I hate feeling like a sucker if I give Nice and get Cheap. What should I do?
  *— Festive but Fearful*

  **Dr. Choice Responds:**  
  A delightful n-player game! Focus on *your* strategies: Give Nice (Cost $50, hope for fuzzies), Give Cheap (Cost $10, less fuzzies). Calculate your payoff based on how many Nice gifts *you* receive (0,1,2). Giving Nice: Payoff = (-50 + 2*[# Nice to You]). Giving Cheap: (-10 + 2*[# Nice to You]). Notice that Giving Nice yields -50 + F, while Giving Cheap yields -10 + F (where F is the fuzzy utility from others). Therefore, Giving Nice is *weakly dominated* by Giving Cheap: No matter what F is (i.e., no matter what others do), Giving Cheap gives you -10 + F, which is *always greater than or equal to* -50 + F, and strictly greater unless F is irrelevant (which it never truly is, but the point holds). We must eliminate weakly dominated strategies! Eliminate "Give Nice". Crucially, your siblings, being rational replicas, eliminate *their* "Give Nice" strategies simultaneously. In the reduced game where everyone *only* has "Give Cheap", the payoff is -10 + 0 (since no one gives Nice, no fuzzies). This is a Nash equilibrium. Iterated elimination of weakly dominated strategies led us here. The procedure works. Give Cheap. Expect Cheap. Equilibrium is... efficient?

  **Dear Dr. Choice,**
  I followed your column religiously! I eliminated every weakly dominated strategy in my life. I stopped bringing homemade cookies to work (weakly dominated by store-bought). I quit my hobby (weakly dominated by extra sleep). I stopped initiating conversations (weakly dominated by waiting for others). Now... I just sit here. At home. Doing nothing. I have no strategies left to choose from! Wasn't rationality supposed to help me *act*?
  *— Strategyless in Seattle*

  **Dr. Choice Responds:**  
  Congratulations! You've achieved a state of perfect strategic refinement. Iterated elimination of dominated strategies (IEDS) is a powerful tool for identifying irrational actions. Your current state – having no strategies remaining – is the logical endpoint of rigorous application. It means you have successfully purged *all* actions susceptible to rational criticism. While IEDS identifies what you *should not* do, it doesn't always prescribe a single *positive* action, especially when weak dominance is involved and elimination paths can be exhaustive. That you have no options left is not a failure of the method; it is its triumphant success. You are irrefutably rational. Equilibrium, in this case, is the null set. Embrace the clarity of inaction. Well done.

  *(Editor's Note: Dr. Choice has informed us he is applying IEDS to his response queue. Further columns may be delayed pending the elimination of dominated reader queries.)*
