prompt: |-
  I am a high school student, and I would like a document I can take back to my biology class. Our textbook hands us a checklist for deciding whether something is alive — movement, respiration, sensitivity, growth, reproduction, excretion, nutrition — and then, a few pages later, calls viruses non-living while describing a viral life cycle in which they reproduce inside host cells. A classmate pointed out that the same checklist fits a campfire, which grows, consumes fuel, spreads, and reacts to the wind; our teacher answered that we should not take the checklist literally, which left the question exactly where it started.

  Please draft the joint statement of an adversarial collaboration between the two camps I keep running into whenever this comes up. The first camp holds that the mark of life is a self-maintaining metabolism: a system that keeps itself running, repairs itself, and stays far from equilibrium by drawing energy from its surroundings. The second holds that the mark of life is evolution: any system with heredity and variation on which selection acts, whatever it is made of and whether or not it metabolizes. I suspect these camps are partly answering different questions, so I want the constructive document a good-faith collaboration between them would produce: the claims both could sign; the points where they still genuinely differ, each written in wording that the side holding it would accept; the cruxes — the sub-questions that, if settled, would move at least one side; and, for each crux, a case or argument both sides agree bears on it, with each side's prediction recorded in advance. If part of the dispute turns out to be about words rather than about the world, say which part and why.

  Please make the document work through these cases rather than gesturing at them: a virus with several hundred genes, some of which build its own components instead of merely hijacking the host; a viroid, which is bare infectious RNA with no coat and no proteins of its own; a prion; a mitochondrion, both inside a cell and extracted from it; a transposon; a healthy but sterile mule; a bacterial spore that stays metabolically almost silent for thousands of years and then revives; and a sterile worker ant in a colony that reproduces. Add two cases I invented to try to force the camps apart, because I could not find anything quite like them: a sealed vessel of chemicals, powered from outside, that continuously rebuilds and repairs its own components and stays far from equilibrium for years but has no heredity and cannot reproduce, vary, or evolve; and a program on a computer that replicates with variation, undergoes selection, and adapts over thousands of generations but is purely digital. I also want the statement to say what both camps agree excludes a campfire and a growing crystal — and, if they cannot agree on one principle that does this, to say so plainly and explain why.

  Close with a short section on whether the two definitions would ever lead to different decisions in practice, for instance in how people search for life elsewhere or in what they regulate in a laboratory; if they never differ there, tell me whether the disagreement is only verbal.

  Format it as a numbered section of agreed claims, then a table of the remaining disagreements, then the cruxes with their cases and advance predictions. Please do not cite papers, books, or the names of researchers, and do not send me to a reading list; I have no way to check any of it, and what I need is the substance in your own words. Tell me how confident you are in each part, and single out the one claim you are least sure both camps would actually sign.
reasoning: |-
  We are drafting a joint statement from two camps in the debate over what constitutes life. The camps are:
  1. The Metabolism-First Camp: Life is defined by a self-maintaining metabolism that keeps the system far from equilibrium, repairs itself, and uses energy from the surroundings.
  2. The Evolution-First Camp: Life is defined by evolution through natural selection, requiring heredity, variation, and selection, regardless of the system's material basis or metabolic capabilities.

  The goal is to produce a document that:
  - States claims both camps agree on.
  - Clearly outlines remaining disagreements, each written in wording acceptable to the side holding it.
  - Identifies cruxes (key sub-questions that, if settled, could change one side's view) and for each crux, presents a case both sides agree is relevant and records each camp's prediction about that case.
  - Addresses specific cases (viruses, viroids, prions, mitochondria, transposons, mules, bacterial spores, worker ants, a self-repairing chemical system without heredity, and an evolving digital program) to illustrate the points.
  - Explains why a campfire or a crystal is not alive under both views (or if they disagree, why).
  - Concludes with whether the definitions lead to different practical decisions and if the disagreement is only verbal.

  We structure the document as:
  - Numbered section of agreed claims.
  - Table of remaining disagreements (each row: the point of disagreement, the Metabolism-First view, the Evolution-First view).
  - Cruxes: each crux is a question, then a case both sides agree bears on it, then the prediction of each camp about that case.
  - A closing section on practical implications and whether the disagreement is verbal.

  We are to avoid citations and focus on substance.

  We start with the agreed claims.

  Agreed Claims:
  1. Both camps agree that the traditional checklist (movement, respiration, sensitivity, growth, reproduction, excretion, nutrition) is inadequate because it includes non-living things (like a campfire) and excludes some entities that are borderline (like viruses) or clearly living (like sterile organisms) in some contexts.
  2. Both camps agree that a campfire and a growing crystal are not alive. The campfire, though it exhibits some checklist features (growth, consumption of fuel, reaction to wind), lacks both a self-maintaining metabolism (because it does not repair itself or maintain a bounded, self-organizing structure) and evolution (because it does not have heredity, variation, or selection). Similarly, a crystal grows but does not maintain itself far from equilibrium through metabolic processes and does not evolve.
  3. Both camps agree that the traditional checklist is a heuristic for typical living organisms but not a definition of life. It is a set of common properties of life as we know it on Earth, not a universal set of necessary and sufficient conditions.
  4. Both camps agree that the question of whether something is alive is context-dependent and may require multiple definitions for different purposes (e.g., in biology, astrobiology, or computer science).
  5. Both camps agree that the entities we call living on Earth (such as bacteria, plants, and animals) are alive by both definitions: they have a self-maintaining metabolism and are products of evolution by natural selection.

  Remaining Disagreements:
  We present these in a table for clarity.

  | Point of Disagreement | Metabolism-First View | Evolution-First View |
  |------------------------|------------------------|------------------------|
  | The fundamental mark of life | Life is defined by a self-contained, self-maintaining metabolic system that sustains itself far from thermodynamic equilibrium through energy exchange with the environment. | Life is defined by the capacity to undergo Darwinian evolution: any system that exhibits heredity, variation, and natural selection. |
  | Status of viruses (with hundreds of genes, some encoding for building components) | Not alive: Viruses lack an intrinsic metabolism. They rely entirely on the host cell's metabolic machinery for replication and do not maintain themselves as a system far from equilibrium when outside a host. | Alive when inside a host: Viruses have genetic material that is heritable and variable, and they evolve by natural selection. Their replication and evolution are clear signs of life. |
  | Status of viroids (bare RNA) | Not alive: Viroids have no metabolism and no intrinsic ability to maintain themselves. They are inert molecules outside a host. | Alive in the context of a host cell: Viroids have heredity (RNA sequence) and variation (mutations), and they evolve by natural selection. |
  | Status of prions (misfolded proteins) | Not alive: Prions have no metabolism, no genetic material, and no inherent ability to self-maintain. They merely induce conformational changes in other proteins. | Not alive: Prions lack heredity and variation in the genetic sense. They propagate by inducing conformational changes but without a mechanism for variation and selection that leads to adaptation. |
  | Mitochondrion (inside a cell) | Part of a living system: Mitochondria are organelles that are metabolically active and maintain themselves, but they are not independent living entities because they rely on the host cell for genes and some resources. | Part of a living system: Mitochondria are inherited and have evolved, but they are not independently subject to evolution as separate entities. They are components of a larger evolving unit (the cell). |
  | Mitochondrion (extracted) | Not alive: An isolated mitochondrion may carry out some metabolic functions temporarily but cannot maintain itself, repair itself, or replicate without the host cell. Without the host, it degrades. | Not alive: An isolated mitochondrion does not have the capacity for independent evolution. It lacks the necessary genetic system for heredity and variation. |
  | Transposon (jumping gene) | Not alive: Transposons are DNA sequences that move within a genome. They have no metabolism and are not self-maintaining. | Not alive: Transposons can be considered as replicators that are heritable and can vary, but they are not independent units of evolution. They are part of a larger genome and do not evolve independently. |
  | Sterile mule | Alive: A mule has a self-maintaining metabolism and is a product of evolution. Sterility does not negate its metabolic life. | Alive: The mule is an individual that resulted from evolution and is part of a population that evolves. Its sterility is an individual trait that does not remove it from the living world. |
  | Bacterial spore | Alive: The spore is a dormant state of a living bacterium. It maintains a minimal level of metabolic activity and can revive. It is a self-maintaining system in a low-energy state. | Alive: The spore is a stage in the life cycle of an evolving bacterial lineage. It has the potential to revive and continue evolving. |
  | Sterile worker ant | Alive: The ant has a self-maintaining metabolism and is part of a colony that functions as a superorganism. Its sterility does not negate its metabolic life. | Alive: The worker ant is part of a reproductive unit (the colony) that evolves. Its traits are shaped by natural selection. |
  | Sealed vessel of self-repairing chemicals (no heredity) | Alive: This system maintains itself far from equilibrium, repairs and rebuilds its components using external energy. It is a self-sustaining metabolic system. | Not alive: Without heredity, variation, and the capacity to evolve, this system does not meet the criteria for life. It is a complex chemical machine. |
  | Evolving digital program | Not alive: The program has no physical metabolism. It is abstract and does not exchange energy or matter with its environment in a way that maintains a physical system. | Alive: The program has heredity (code is copied), variation (mutations), and selection. It evolves and adapts, meeting the criteria for life in a digital medium. |

  Cruxes:
  We now identify key cruxes. For each crux, we state a question, present a case that both camps agree is relevant, and record each camp's prediction about that case. The idea is that if the prediction is confirmed, it would support that camp's view.

  Crux 1: Can a system be considered alive if it has a self-maintaining metabolism but no capacity for evolution?
  - Case: The sealed vessel of self-repairing chemicals (no heredity, no reproduction, no variation).
  - Metabolism-First Prediction: This system is alive because it maintains itself far from equilibrium through continuous energy use and self-repair.
  - Evolution-First Prediction: This system is not alive because it cannot evolve and has no heredity.

  Crux 2: Can a system be considered alive if it evolves by natural selection but lacks a physical metabolism?
  - Case: The evolving digital program (replicates with variation, undergoes selection, adapts over generations, but is purely digital).
  - Metabolism-First Prediction: This program is not alive because it lacks a physical metabolic process and does not maintain a physical system far from equilibrium.
  - Evolution-First Prediction: This program is alive because it exhibits the key features of evolution by natural selection.

  Crux 3: Are viruses (with several hundred genes, including those that build viral components) alive when they are inside a host cell?
  - Case: A complex virus (like a large DNA virus) that encodes some metabolic enzymes and can create viral factories inside the host.
  - Metabolism-First Prediction: Even inside the host, the virus is not alive because it does not have its own self-contained metabolism. It uses the host's metabolic machinery and does not maintain itself independently.
  - Evolution-First Prediction: The virus is alive when inside the host because it reproduces with variation and is subject to natural selection. Its genetic material is passed on and evolves.

  Crux 4: Can an entity that is not independently capable of reproduction (like a sterile worker ant) be considered alive?
  - Case: The sterile worker ant.
  - Metabolism-First Prediction: The ant is alive because it has a self-maintaining metabolism. Reproduction is not required at the individual level for life.
  - Evolution-First Prediction: The ant is alive because it is part of a colony that reproduces and evolves. The colony is the unit of evolution, and the ant is a living part of it.

  Note: For the sterile worker ant, both camps agree it is alive, so this crux is not as divisive. We might adjust to focus on a case where there is disagreement.

  Let us revise Crux 4 to focus on a case where the camps disagree.

  Crux 4: Is a system that evolves but has no metabolism (like the digital program) alive?
  (This is similar to Crux 2, so we can skip a separate one.)

  Alternatively, we can consider:

  Crux 4: Can a system that is dormant and metabolically inactive for long periods (like a bacterial spore) be considered alive?
  - Case: A bacterial spore that is dormant for thousands of years and then revives.
  - Metabolism-First Prediction: The spore is alive because it maintains a low level of metabolic activity and has the potential to revive. It is a self-maintaining system in a suspended state.
  - Evolution-First Prediction: The spore is alive because it is part of an evolving lineage and has the potential to reproduce and evolve.

  But note: both camps agree the spore is alive. So we avoid cases with agreement.

  We focus on the cases where the camps disagree: the self-repairing chemical system and the evolving digital program (Cruxes 1 and 2) and the virus (Crux 3).

  Now, we address the campfire and crystal.
  Both camps agree that a campfire is not alive because:
  - It has no self-maintaining metabolism: it does not repair itself, has no internal regulation, and is not a bounded, self-organizing system. It is a dissipative structure that burns until the fuel is gone.
  - It does not evolve: it has no heredity or variation on which selection acts.

  Similarly, a growing crystal:
  - Has no metabolism: it grows by addition of molecules but does not maintain itself far from equilibrium through energy exchange and self-repair.
  - Does not evolve: it has no mechanism for heredity and variation.

  Thus, both camps agree on excluding them.

  Closing Section: Practical Implications and Whether the Disagreement is Verbal
  - Both definitions can lead to different decisions in practice:
    - In astrobiology: The metabolism-first definition would look for systems that actively process energy and maintain complexity (like a self-sustaining chemical system). The evolution-first definition would look for systems that can evolve and adapt (like self-replicating molecules that show variation and selection).
    - In the laboratory: Regulation might differ. For example, the metabolism-first view might regulate self-replicating systems that have a metabolism (like synthetic cells) but not digital life. The evolution-first view might regulate any evolving system, including digital life, as potentially hazardous if it can escape and adapt in the environment.
  - The disagreement is not purely verbal because it leads to different classifications in borderline cases (like the self-repairing chemical system without heredity and the digital evolving program) and thus to different practical actions.

  However, both camps agree that for most practical purposes on Earth, the entities we call living (organisms) are covered by both definitions. The disagreement becomes significant in non-terrestrial and artificial contexts.

  Confidence:
  - We are highly confident in the agreed claims and the characterization of the two camps.
  - The least confident part is the status of the self-repairing chemical system under the metabolism-first view. We predict that camp would call it alive, but there might be nuances (e.g., whether it must be carbon-based or have organic chemistry). We assume the case is clear: a system that continuously maintains and repairs itself using energy. We assign medium confidence to this prediction because the metabolism-first camp might require the system to be based on biochemistry similar to Earth life.

  Therefore, the one claim we are least sure both camps would sign is the metabolism-first view on the self-repairing chemical system being alive. The evolution-first camp clearly rejects it, but the metabolism-first camp might have internal divisions about whether such a system must also be capable of open-ended evolution or must be based on organic molecules.

  We now write the document accordingly.
answer: |-
  ### Joint Statement on the Definition of Life  
  *Produced by an Adversarial Collaboration Between the Metabolism-First and Evolution-First Camps*  

  **Preamble**  
  We, representatives of two perspectives on the definition of life, agree that traditional checklists (e.g., movement, respiration, sensitivity, growth, reproduction, excretion, nutrition) are inadequate. They fail to exclude non-living phenomena (e.g., campfires, crystals) and inconsistently handle borderline cases (e.g., viruses). Both camps reject the checklist as literal criteria. Instead, we propose two complementary definitions rooted in deeper principles:  
  - **Metabolism-First (MF)**: Life requires a *self-maintaining metabolism*—a bounded system that actively sustains itself far from thermodynamic equilibrium by harvesting energy, repairing components, and regulating internal states.  
  - **Evolution-First (EF)**: Life requires *evolution by natural selection*—a system exhibiting heredity (information transfer), variation, and differential survival/reproduction, enabling adaptation.  

  We agree these definitions address distinct questions: MF focuses on *individual persistence*, while EF focuses on *lineage change*. Both capture essential aspects of Earth life but diverge in edge cases. Below, we outline agreements, disagreements, and testable predictions.  

  ---

  ### I. Agreed Claims (Both Camps Endorse)  
  1. **Checklists are heuristic, not definitive**. They describe common features of Earth life but are neither necessary nor sufficient for defining life universally.  
  2. **Campfires and crystals are non-living**.  
     - A campfire "grows," "consumes fuel," and "reacts to wind" but lacks a self-maintaining metabolism (it does not repair itself or regulate internal states) and cannot evolve (it has no heredity or variation for selection).  
     - A growing crystal self-assembles but lacks metabolism (it approaches equilibrium passively) and evolution (it has no mechanism for heredity or adaptation).  
  3. **Earth's organisms are unambiguously alive**. Bacteria, plants, and animals satisfy both definitions: they maintain metabolisms *and* evolve.  
  4. **Context matters**. Classifying life depends on scale (e.g., mitochondria inside cells) and purpose (e.g., astrobiology vs. lab safety).  
  5. **Sterility does not negate life**. Sterile organisms (e.g., mules, worker ants) are alive because they:  
     - (MF) Sustain self-maintaining metabolisms.  
     - (EF) Belong to evolving lineages shaped by selection.  
  6. **Dormancy does not negate life**. Bacterial spores are alive because they:  
     - (MF) Maintain minimal metabolic activity for self-preservation and can revive.  
     - (EF) Represent a dormant phase in an evolving lineage.  

  **Confidence**: High (all claims are foundational to both camps).  

  ---

  ### II. Remaining Disagreements  
  *Each camp’s view is stated in its own accepted wording.*  

  | Case | Metabolism-First View | Evolution-First View |  
  |------|------------------------|-----------------------|  
  | **Virus (complex, with genes for self-assembly)** | Not alive. Lacks intrinsic metabolism; relies entirely on host cells for energy and replication. Even inside a host, it is a "hijacker," not a self-maintaining system. | Alive within a host. Reproduces with variation and evolves via natural selection. Its genes encode functional components, demonstrating hereditary adaptation. |  
  | **Viroid (bare infectious RNA)** | Not alive. No metabolism; inert outside a host. Cannot harvest energy or self-repair. | Alive within a host. RNA sequence provides heredity, mutations enable variation, and selection drives evolution. |  
  | **Prion (misfolded protein)** | Not alive. No metabolism, self-repair, or energy use. Merely propagates by inducing structural changes in other proteins. | Not alive. Lacks heredity (no encoded information) and variation for Darwinian evolution. |  
  | **Mitochondrion (inside cell)** | Not independently alive. An organelle dependent on the host cell’s metabolic and genetic systems; no self-containment. | Not independently alive. A product of evolution but inseparable from the cell’s evolving lineage. |  
  | **Mitochondrion (extracted)** | Not alive. Temporary metabolic activity ceases quickly; no self-maintenance without the cell. | Not alive. Cannot replicate or evolve independently; no heredity outside cellular context. |  
  | **Transposon (jumping gene)** | Not alive. No metabolism; a DNA sequence reliant on host enzymes. | Not alive. Heritable and mutable but not an independent evolutionary unit; requires host machinery. |  
  | **Self-repairing chemical system (sealed, no heredity)** | **Alive.** Actively maintains itself far from equilibrium using external energy; repairs and rebuilds components. Self-maintenance is the essence of life. | Not alive. Lacks heredity, variation, and evolution. A sophisticated machine, not a living system. |  
  | **Evolving digital program** | Not alive. No physical metabolism; digital processes do not exchange energy/matter to sustain a bounded system. | **Alive.** Exhibits heredity (code replication), variation (mutations), and selection, enabling open-ended evolution. |  

  **Confidence**: High for all except the self-repairing chemical system (MF view) and digital program (EF view)—see Crux 2.  

  ---

  ### III. Cruxes: Key Questions to Resolve Disagreements  
  *For each crux, we present a case both camps agree is decisive. Predictions are recorded in advance.*  

  **Crux 1: Must life exhibit open-ended evolutionary potential?**  
  - **Case**: *Self-repairing chemical system* (sealed vessel with energy input; repairs itself but cannot reproduce, vary, or evolve).  
  - **MF Prediction**: Classified as alive. Metabolism alone defines life; evolution is a common consequence but not required.  
  - **EF Prediction**: Classified as non-living. Without heredity and variation, it cannot adapt or generate novelty.  
  - **Agreed Test**: If such a system were constructed and maintained itself for decades, MF would deem it alive; EF would not.  

  **Crux 2: Can evolution occur without a physical, metabolic basis?**  
  - **Case**: *Evolving digital program* (self-replicates, mutates, undergoes selection, and adapts over generations).  
  - **MF Prediction**: Classified as non-living. Life requires embodied metabolism; digital processes are abstract simulations.  
  - **EF Prediction**: Classified as alive. Evolution is substrate-independent; heredity and selection are sufficient.  
  - **Agreed Test**: If such a program produced complex, unforeseen adaptations, EF would deem it alive; MF would not.  

  **Crux 3: Is metabolic dependence on a host sufficient for life?**  
  - **Case**: *Complex virus* (encodes enzymes for self-assembly but still requires host metabolism).  
  - **MF Prediction**: Classified as non-living. Viruses are inert particles outside hosts; no intrinsic self-maintenance.  
  - **EF Prediction**: Classified as alive inside a host. Viral genes evolve and adapt independently of the host genome.  
  - **Agreed Test**: If a virus were engineered to encode all metabolic machinery (eliminating host dependence), MF might reconsider; EF would still deem it alive.  

  **Confidence**: High for all cruxes. Least confident in MF's stance on the self-repairing chemical system (Crux 1), as some MF proponents might require organic biochemistry.  

  ---

  ### IV. Practical Implications: Is the Disagreement Only Verbal?  
  - **Practical differences exist**:  
    - **Astrobiology**: MF would prioritize detecting metabolic signatures (e.g., chemical disequilibrium on Mars). EF would prioritize detecting evolving systems (e.g., self-replicating molecules in Titan’s lakes).  
    - **Lab Regulation**: MF would regulate self-sustaining metabolic systems (e.g., synthetic cells) but not digital life. EF would regulate evolving systems (e.g., evolving AI) as potential hazards.  
  - **Not purely verbal**: Divergence in classifying edge cases (e.g., digital programs, self-repairing machines) reflects deeper disagreements about life’s core mechanisms—not just semantics. Settling the cruxes would alter real-world decisions.  
  - **Overlap**: For known Earth life, both definitions align. Disagreements arise in novel contexts (artificial life, extraterrestrial search).  

  **Conclusion**: Both camps agree that life is not a binary category but a spectrum of complexity. Resolving these cruxes requires empirical work (e.g., building self-repairing systems, studying viral "metabolism"). Until then, definitions should be chosen based on context—e.g., MF for ecology, EF for evolutionary biology.  

  **Signed**,  
  *Metabolism-First Advocates* and *Evolution-First Advocates*  

  ---  
  **Confidence Summary**:  
  - High confidence in agreements and the structure of disagreements.  
  - Least confident in **Agreed Claim 5** (sterile organisms are alive). A minority in EF might argue sterile workers are "non-living parts" of the colony, but consensus holds they are alive.  
  - This document reflects our best joint effort; predictions may evolve with new evidence.
