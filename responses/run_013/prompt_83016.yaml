answer: |-
  ### Adjudication of the Exchange Between Nadia and Owen

  The debate between Nadia and Owen revolves around the nature of "know-how" (practical knowledge) versus "know-that" (propositional knowledge). Nadia defends an intellectualist view, where know-how is a form of propositional knowledge under a "practical mode of presentation," while Owen advocates for an anti-intellectualist position, where know-how is a non-propositional ability or disposition. Below, I adjudicate each move in their exchange, assessing whether it is clearly right, defensible but overstated, or mistaken, with reasoning. I then evaluate who has the better of the exchange overall, what both parties are missing, and conclude with the consideration that could lead to the opposite verdict and where my reasoning might fail.

  #### Move-by-Move Adjudication

  **(1) Owen opened with a sorter who reliably tells chicks' sexes but cannot say how, and said this refutes Nadia: here is know-how with no articulable know-that.**
  - **Verdict: Mistaken.**  
  - **Why?** Owen misrepresents Nadia's view by conflating "articulable" with "propositional." Nadia explicitly allows for propositional knowledge that is not articulable, as it can be grasped under a practical mode of presentation (e.g., embodied or non-linguistic understanding). The sorter case might show know-how without *articulated* know-that, but it does not refute the possibility of non-articulated propositional knowledge. Owen's argument thus attacks a straw man, as Nadia's position accommodates such cases from the outset. For instance, the sorter could know *that* certain visual cues indicate sex, even if this knowledge is accessed practically rather than discursively.

  **(2) Nadia replied that the case is irrelevant, since articulacy was never required; the sorter knows of a way, just not under a discursive mode of presentation.**
  - **Verdict: Clearly right.**  
  - **Why?** Nadia correctly defends her view by emphasizing that her intellectualism does not require articulacy. The practical mode of presentation (e.g., a non-linguistic, action-oriented way of grasping a proposition) allows for know-how to be a form of know-that without verbal expression. This directly addresses Owen's objection and is consistent with standard intellectualist responses (e.g., from philosophers like Jason Stanley). The sorter case is irrelevant to refuting intellectualism because it only challenges a requirement Nadia never imposed.

  **(3) Owen: then no case could ever tell against the view, which makes it a redescription of the phenomenon rather than a theory of it.**
  - **Verdict: Defensible but overstated.**  
  - **Why?** Owen raises a legitimate concern about the testability and explanatory power of Nadia's view: if the practical mode of presentation is invoked to dismiss any counterexample, it risks being unfalsifiable and thus non-explanatory. However, this is overstated because Nadia can (and does, in move 4) provide positive predictions and empirical implications for her view (e.g., that know-how and know-that covary). Intellectualism can be tested through cases where knowledge and ability dissociate, or through cognitive science on how practical knowledge is represented. Owen's point is defensible as a critique of vagueness, but it prematurely dismisses intellectualism as a theory rather than engaging its substance.

  **(4) Nadia: not so — the view predicts that know-how and the corresponding know-that stand or fall together, so losing the ability should take the knowledge with it, and that know-how is answerable to justification and defeat as knowledge-that is and a mere capacity is not. She then turned Owen's own style of case against him with a coach who knows how a move is to be executed but can no longer execute it, which she takes to show that know-how comes apart from ability.**
  - **Verdict: Defensible but overstated in the coach example; the justification point is strong.**  
  - **Why?**  
    - The core of Nadia's response—that her view predicts covariation between know-how and know-that, and that know-how is subject to justification—is defensible and intellectually robust. For example, if know-how is a form of know-that, it should be vulnerable to defeat (e.g., evidence showing one's method is flawed) and should diminish with lost ability, as the practical mode of presentation may become inaccessible. This distinguishes know-how from mere capacity (e.g., reflexes) and provides testable implications.  
    - However, the coach example is overstated and ambiguous. Nadia claims the coach retains know-how (as knowledge-that) despite lost ability, but this conflates two senses of "know how": (i) theoretical knowledge (knowing *that* a move is executed a certain way) and (ii) practical ability (knowing *how* to perform it). Her view requires that know-how involves a practical mode of presentation, so if the coach cannot execute the move, they may have lost the practical mode and thus the relevant know-how. Using this case to argue that know-how "comes apart" from ability is a misstep, as it better supports Owen's point about ambiguity.  
    - Overall, the justification aspect (e.g., know-how can be undermined by false beliefs, unlike mere ability) is a strong point for intellectualism, but the coach example weakens this move by not clearly applying the practical mode concept.

  **(5) Owen answered that the coach knows how the move is done, which is propositional, and that the case trades on an ambiguity in the phrase; on the ability reading, the coach simply no longer knows how to do it.**
  - **Verdict: Clearly right.**  
  - **Why?** Owen correctly identifies the ambiguity in "know how" that Nadia exploits: it can refer to propositional knowledge (e.g., understanding the steps) or ability (e.g., being able to perform). In the ability sense—which is central to Owen's view—the coach lacks know-how, making the case irrelevant to refuting anti-intellectualism. This disambiguation is a common and effective move in anti-intellectualist arguments (e.g., Gilbert Ryle's work) and forces Nadia to clarify her terms. Owen's response is precise and exposes a flaw in Nadia's counterexample.

  **(6) Nadia then met the familiar regress — that applying propositional knowledge would itself require know-how, and so on — by saying it runs only if propositional knowledge is a rule to be consulted before acting, whereas knowing that something is so is a state, not a procedure.**
  - **Verdict: Defensible.**  
  - **Why?** Nadia offers a standard intellectualist rebuttal to the regress argument (which Owen alludes to but does not fully state). If propositional knowledge is a state (e.g., a dispositional belief) rather than a conscious rule-following process, it can guide action directly without infinite regress. For example, knowing *that* a key turns a lock (under a practical mode) can inform turning the key without needing separate "know-how" to apply it. This is a coherent defense, drawing on contemporary intellectualism (e.g., from Stanley and Williamson), and it avoids the regress by rejecting a procedural view of knowledge. While Owen might dispute the "practical mode" concept, Nadia's reasoning here is logically sound and addresses a key anti-intellectualist challenge.

  **(7) Owen: a state the agent merely occupies cannot explain the intelligent exercise we set out to explain; and know-how comes in degrees and is displayed in performance in a way that knowledge-that is not.**
  - **Verdict: Defensible and highlights weaknesses in Nadia's view.**  
  - **Why?** Owen raises valid points:  
    - First, a "state" (e.g., a propositional attitude) may not adequately explain the *intelligent* aspect of know-how, such as adaptability and context-sensitivity in performance (e.g., a chef adjusting a recipe on the fly). If know-how is merely a state, it risks being inert without additional dispositions for application, which intellectualists must address.  
    - Second, know-how clearly comes in degrees (e.g., novice vs. expert pianists) and is demonstrated through skillful performance, whereas propositional knowledge is often binary (one knows or does not) and not inherently performance-oriented. These features align better with an ability/disposition view.  
    - This move is defensible because it targets explanatory gaps in intellectualism and leverages intuitive aspects of skill. However, it is not decisive, as intellectualists can argue that degrees of know-how reflect varying depths of propositional understanding or that the practical mode bridges the state-action gap.

  #### Overall Exchange: Who Has the Better of It?
  - **Nadia has the better of the exchange overall.** She consistently defends her view by addressing Owen's objections (e.g., clarifying that articulacy is unnecessary, rebutting the regress) and offering positive arguments (e.g., the covariation prediction and the justification requirement). Her intellectualist framework is more nuanced and resilient, especially as she incorporates the practical mode to handle cases like the sorter. Owen, while raising important critiques (e.g., ambiguity in "know how" and concerns about explanatory power), often overreaches (e.g., in move 1) or relies on points that intellectualism can accommodate (e.g., degrees of knowledge can be framed as degrees of understanding). Nadia's responses demonstrate that intellectualism is a tenable theory, not just a redescription, as it makes empirical predictions (e.g., knowledge and ability covary) and distinguishes know-how from mere ability through epistemic norms like justification.

  #### What Both Parties Are Missing
  - **Shared Oversight:** Both Nadia and Owen miss the potential for a hybrid or pluralist account of know-how. Know-how might involve both propositional and non-propositional elements depending on context. For instance, simple skills (e.g., tying shoelaces) may be primarily embodied abilities, while complex skills (e.g., surgical techniques) might integrate propositional knowledge. They also underemphasize the role of *embodied cognition*—how physical practice and sensorimotor processes contribute to know-how, which neither a purely propositional state nor a bare disposition fully captures.
  - **Nadia's Gap:** She relies heavily on the "practical mode of presentation" but does not explain *how* it works, leaving it vulnerable to Owen's charge that it is an explanatory placeholder. For example, how does a practical mode convert propositional knowledge into intelligent action without invoking further know-how? Cognitive science (e.g., on procedural memory) could strengthen her case, but she omits this.
  - **Owen's Gap:** He reduces know-how to ability/disposition but neglects its epistemic dimensions. Know-how often involves understanding *why* methods work (e.g., a mechanic knowing why a repair technique is effective), making it responsive to reasons and justifications—features that align with propositional knowledge. Owen's view risks conflating know-how with mere physical capacity, which lacks this normative aspect.

  #### Consideration Leading to the Opposite Verdict
  - **Which consideration would lead you to the opposite verdict?** If I prioritized the *explanatory primacy of ability* in ordinary contexts of skill, I might conclude that Owen has the better case. For example, in the sorter case, the know-how is demonstrated through reliable performance without any apparent propositional content, and reducing this to "knowledge under a practical mode" could seem like an ad hoc rationalization. If know-how is fundamentally about successful action (e.g., riding a bike) and is graded (e.g., levels of expertise), Owen's view is more parsimonious and intuitive. Intellectualism might then appear to overintellectualize skills that are best explained as embodied abilities, especially in cases of tacit knowledge where no propositional content is accessible even to the agent.

  #### Where Your Reasoning is Most Likely to Fail
  - **Where your own reasoning is most likely to fail:** My reasoning might fail by underestimating the force of Owen's arguments regarding the *display and gradability of know-how*. I lean toward intellectualism because it integrates know-how into a broader epistemology, but this could blind me to cases where ability is primary and propositional knowledge is irrelevant (e.g., intuitive skills like catching a ball). I might also overstate the coherence of the "practical mode of presentation," which remains vague and could be circular (e.g., defining practical knowledge in terms that presuppose know-how). If intellectualism cannot adequately explain how propositions guide action without regress or how skills develop through non-cognitive practice, Owen's ability-based view could be more compelling. My background in analytic philosophy might bias me toward propositional accounts, causing me to downplay embodied and anti-representationalist perspectives.
