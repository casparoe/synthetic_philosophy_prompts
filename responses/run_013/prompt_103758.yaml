prompt: |-
  I'm in a graduate seminar on the philosophy of social science, and we've spent two weeks circling the question of whether culture or values can figure as a cause rather than as something to be explained away. The Weberian template keeps coming up — ascetic Protestant convictions somehow helping to produce a this-worldly rationalizing economic ethic — but everyone in the room reads it differently, and I've started to suspect the disagreement is really about what it would take for a value to be a cause at all, rather than about the historical case. I'd like you to help me sort this out by ranking candidate mechanisms.

  Please take the following list and arrange it into tiers by how well each mechanism, if it obtained, would vindicate the claim that a shared value or cultural complex is a genuine cause of social outcomes rather than a mere correlate, a rationalization, or a redescription. For each, say in a sentence or two what would have to be true of the world for it to be doing real explanatory work, and where it risks collapsing back into the circularity worry — values inferred from the very conduct they are invoked to explain. The candidates: (1) internalization, on which individuals adopt the value and act on it as a reason; (2) selection, on which the culture moves no one's reasons but changes which practices survive and get copied; (3) equilibrium selection, on which the culture picks out one of several stable arrangements without causing the arrangement's existence; (4) constitution, on which the value does not cause the action so much as make it the kind of action it is, so that the causal question is misframed; (5) a mechanism I've been calling semantic scaffolding, in which the culture supplies the concepts without which the agent could not so much as form the intention, so that the culture is a precondition of the intention rather than a cause of it; and (6) an account on which the value affects the outcome only through the fact that everyone expects everyone else to hold it, so that the content of the value is nearly idle and only the common knowledge matters. I care most about whether the ranking shifts depending on whether we want a general theory of cultural causation or a verdict on the Weber case in particular, so please flag any point where the two come apart.
reasoning: |-
  Okay, the user is in a graduate seminar on the philosophy of social science, wrestling with whether culture or values can be genuine causes of social outcomes rather than just correlates or rationalizations. They've been discussing Weber's Protestant ethic thesis, but the debate keeps circling around what it even means for a value to be a cause. They've listed six candidate mechanisms and want them ranked into tiers based on how well each vindicates cultural causation, with explanations of what must be true for each to work and where they risk circularity. They also want to know if the ranking changes between general theory and the Weber case specifically.

  Hmm, this is a sophisticated request. The user is clearly deep in theoretical weeds and needs clarity on mechanism hierarchies. Let me unpack their six mechanisms first. Internalization seems straightforward—values become personal reasons for action. Selection is Darwinian—values affect survival of practices, not individual motives. Equilibrium selection is about coordination—values solve multiple-equilibrium problems. Constitution is ontological—values define what counts as an action. Semantic scaffolding is cognitive—values enable conceptualization of intentions. Common knowledge is expectations-based—values matter because everyone thinks they matter.

  For the tier ranking, I need to evaluate which mechanisms make values genuinely causal versus epiphenomenal. Internalization feels strongest because it preserves intentionality—the value directly motivates action. But the circularity risk is high: how do we know people internalized the value without inferring it from their actions? Selection avoids this by sidestepping motivation entirely, but then values become environmental filters rather than causes—they select for behaviors but don't produce them. That pushes it lower. Equilibrium selection is neat—values coordinate collective action—but it doesn't create the equilibrium, just selects it. Constitution is tricky; it rejects causal framing entirely, which might be profound but doesn't satisfy causal queries. Semantic scaffolding is fascinating—values as conceptual prerequisites—but it's enabling, not causing. Common knowledge is weakest because the value's content barely matters; it's all about expectations.

  Now, does this shift for Weber? Absolutely. Internalization is central to his thesis—Calvinist beliefs became internal motives for methodical work. Selection mechanisms (e.g., Protestant practices outcompeting others) might supplement but aren't Weber's core argument. Constitution could apply if Protestantism defined capitalism as virtuous, but Weber focused on motivation. Semantic scaffolding matters less here—capitalist concepts existed before Protestantism. Common knowledge might explain enforcement but not origin. So for Weber, internalization is paramount; for general theory, selection or equilibrium might be more robust against circularity.

  The user's deeper need seems to be resolving methodological anxiety: how to defend cultural causation without tautology. They're sensing peers conflate historical debate with metaphysical doubts. By tiering mechanisms, I can show that circularity isn't equally threatening to all models—internalization requires careful evidence of prior internalization, while selection needs tracing of selective pressures. Also, flagging the Weber-specific ranking might help them isolate why their seminar is stuck: they're debating mechanisms while reading the same text through different lenses.
answer: |-
  Based on the core philosophical problem (avoiding circularity/epiphenomenality) and the Weber case, here's a tiered ranking of mechanisms for cultural causation, with explanations and risks. The ranking *does* shift significantly between a general theory and the Weber case:

  **Tier 1: Strongest Vindication of Causal Efficacy (Least Circularity Risk)**
  1.  **(1) Internalization:**
      *   **What must be true:** Individuals must consciously adopt the value as a motivating reason *prior to or independently of* the specific conduct it explains. The value must function as a genuine internal motivator guiding decisions, not just a post-hoc label. Evidence might include explicit justifications, diaries, conversion narratives, or behavioral shifts *following* value acquisition.
      *   **Circularity Risk:** High if the *only* evidence for the value's existence/internalization is the conduct it's supposed to explain. Requires showing the value was held *before* and *independently* motivated the action.
      *   **General vs. Weber:** **Crucial for Weber.** His thesis hinges on Protestant beliefs becoming internalized motives for methodical work/investment *as a calling*, distinct from pre-existing economic behavior. If internalization holds, it directly answers "how values cause action."

  2.  **(2) Selection:**
      *   **What must be true:** The cultural value must act as an *environmental filter* (e.g., social sanction, resource allocation, competition) that systematically favors practices/individuals/institutions exhibiting certain traits *aligned with the value*, while disadvantaging others, *regardless* of individual motivations. The value shapes the fitness landscape.
      *   **Circularity Risk:** Low. The value explains *differential survival/replication*, not the origin of the practices or the internal state of actors. The value exists as a selective pressure external to the agents. The risk is conflating selection *of* a practice with selection *for* the value itself.
      *   **General vs. Weber:** **Stronger for General Theory.** While Weber hints at communities selecting for thrift, his core mechanism is internalization. Selection offers a powerful *general* mechanism where values cause outcomes by shaping evolutionary/competitive dynamics without needing internalization (e.g., norms punishing laziness favoring hard work, even if no one *loves* working).

  **Tier 2: Causal but Indirect or Limited**
  3.  **(3) Equilibrium Selection:**
      *   **What must be true:** Multiple stable social equilibria must be possible (e.g., high-trust vs. low-trust commerce). The cultural value must act as a salient *focal point* or shared expectation that coordinates agents' actions towards one specific equilibrium, overcoming the coordination problem. It causes *which* outcome emerges, not *that* equilibria exist.
      *   **Circularity Risk:** Moderate. The value must be established *before* or *independently* of the specific coordination event to be a focal point. Risk arises if the focal value is *only* identified *because* that equilibrium was selected.
      *   **General vs. Weber:** **Relevant to both, but Indirect.** For Weber, Protestantism might have helped select a high-trust, contract-oriented equilibrium within nascent capitalism. Generally, values solve coordination problems. While causal in selecting *which* outcome, it doesn't explain the *creation* of the possibilities or the fundamental rules of the game.

  4.  **(5) Semantic Scaffolding:**
      *   **What must be true:** The cultural complex must provide the essential conceptual framework (categories, meanings, goals) necessary for agents to even *formulate* the intentions or recognize the options that lead to the outcome. Without the cultural concepts, the specific intention/action is cognitively impossible or incoherent.
      *   **Circularity Risk:** Moderate/Low. The scaffolding is a precondition, not a direct motivator. The risk is in demonstrating that the concepts were *truly* unavailable or incoherent beforehand, and not just unused. It avoids explaining action *by* action, but might struggle to explain why one set of concepts leads to *this specific outcome* rather than another possible one built on the same scaffold.
      *   **General vs. Weber:** **Important for both, Enabling rather than Driving.** For Weber, the concept of a "calling" or "worldly asceticism" might be essential scaffolding for forming the *intention* of glorifying God through profit. Generally, culture shapes the possible space of thought/action. It explains possibility, but less directly explains *why* agents choose specific actions *within* that space.

  **Tier 3: Weak or Problematic Causal Claims**
  5.  **(4) Constitution:**
      *   **What must be true:** The value must be an *intrinsic part* of the social fact being explained. The action or institution simply *is what it is* only by virtue of the cultural meaning/rule. For example, "voting" is constituted by democratic norms; "sacrifice" by religious values.
      *   **Circularity Risk:** **Circularity is inherent but claimed to be non-vicious.** It explicitly rejects the "cause vs. effect" framing for these cases. The value *defines* the explanandum. The risk is overextension – not all social outcomes are purely constituted by values; some have brute material consequences. It struggles to explain *change* or *variation* in outcomes defined by the same concept.
      *   **General vs. Weber:** **Limited Utility for Causal Explanation.** For Weber, capitalism might be *constituted* by certain rationalized practices, but this doesn't explain how Protestantism *caused* those practices to emerge. Constitution is better for understanding the *nature* of social reality than its *genesis*. It bypasses the causal question rather than answering it.

  6.  **(6) Common Knowledge of Expectation (Content-Neutral):**
      *   **What must be true:** The *specific content* of the value is largely irrelevant. What matters is that agents *believe* the value is widely held and expect others to act (and expect them to expect others to act...) based on *that* belief. The value acts as a Schelling point or trust signal based purely on its perceived commonality.
      *   **Circularity Risk:** **Very High for Value Causation.** This mechanism makes the value's *content* epiphenomenal. The outcome is caused by expectations *about* beliefs, not by the motivating force of the belief itself. Any sufficiently salient common belief would work. It risks reducing the value to a nearly arbitrary signal.
      *   **General vs. Weber:** **Weakens the Weber Thesis.** If Protestantism only worked because everyone *expected* everyone else to be ascetic capitalists (regardless of their actual inner belief in predestination), then the specific theological *content* Weber emphasized becomes causally inert window dressing. This might explain *sustaining* norms but not their *origin* or distinctive character.

  **Key Shifts Between General Theory and the Weber Case:**

  1.  **Internalization:** **Essential for Weber**, central to his argument about the unique motivational force of the Protestant ethic. For *general* theory, it's strong but faces high evidentiary burdens to avoid circularity; selection or equilibrium might be more robust/pragmatic explanations in many contexts.
  2.  **Selection:** **Stronger for General Theory.** It provides a powerful, often less circular, mechanism for cultural causation applicable even where internal motivation is absent or opaque. While compatible with Weber (e.g., Protestant communities outcompeting others), it wasn't his primary focus.
  3.  **Semantic Scaffolding:** **More Central to Weber?** Weber's argument leans heavily on the unique *concepts* Protestantism supplied (calling, proof). For general theory, it's foundational but often operates alongside internalization or selection as an enabling condition.
  4.  **Common Knowledge:** **Damaging to Weber.** If this is the primary mechanism, Weber's focus on the specific *content* of Protestant beliefs as a driving force is largely mistaken. For general theory, it explains coordination but drains cultural *content* of causal power.

  **Conclusion:** For a *general* theory of cultural causation aiming to avoid circularity, **Selection (2)** often emerges as the most robust mechanism, followed by **Equilibrium Selection (3)**. **Internalization (1)** is powerful but methodologically trickier. **Constitution (4)** sidesteps causality. **Semantic Scaffolding (5)** is crucial but enabling. **Common Knowledge (6)** trivializes content.

  For **verdict on Weber**, **Internalization (1)** is paramount – his thesis stands or falls on whether those beliefs genuinely *motivated* novel economic conduct. **Semantic Scaffolding (5)** is also crucial in establishing the unique intentional framework. Mechanisms that downplay content or internal motivation (especially 6, but also the content-neutral aspects of 2 & 3) significantly weaken the distinctiveness of his argument. The seminar's impasse likely stems from conflating these different levels of mechanism – resolving *Weber* requires prioritizing internalization and scaffolding, while general theory can validly rely more on selection.
