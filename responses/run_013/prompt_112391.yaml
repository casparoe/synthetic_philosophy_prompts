  Below is an 8-question quiz designed to reveal readers' intuitions about aggregating small harms, incorporating your specified distinctions (unwitnessed harms, concentration on one person, and risks vs. certainties). Each question presents concrete, scaled scenarios with forced choices. The scoring key maps answer patterns to five core positions, including unnamed variants. I've embedded "uncomfortable" cases to challenge consistency and included one harm upgrade (dust speck → stubbed toe) to test threshold sensitivity.

  ---

  ### **Quiz: Which Harm-Aggregation View Do You Hold?**  
  *For each scenario, choose the option you would prevent. Assume all choices are mutually exclusive and consequences are immediate.*

  1. **Classic Spread (Witnessed Harm)**  
     You must prevent one outcome:  
     - **A)** One person is tortured nonstop for 50 years.  
     - **B)** Quintillions of people each get one barely noticeable dust speck in their eye (each feels a fleeting itch but forgets it instantly).  

  2. **Concentrated Harm (Same Person)**  
     You must prevent one outcome:  
     - **A)** One person is tortured nonstop for 50 years.  
     - **B)** One person receives quintillions of dust specks in their eye (each is barely noticeable, but the total causes unrelenting irritation for 50 years).  

  3. **Unwitnessed Harm**  
     You must prevent one outcome:  
     - **A)** One person is tortured nonstop for 50 years.  
     - **B)** Quintillions of people each get one dust speck in their eye, but due to a quirk of neurology, no one notices it or remembers it. The specks cause zero physical damage and leave no trace.  

  4. **Risk of Severe Harm**  
     You must prevent one outcome:  
     - **A)** One person is tortured nonstop for 50 years (certain outcome).  
     - **B)** Quintillions of people each face a 1-in-quintillion chance of being tortured for 50 years (expected number of victims: 1).  

  5. **Upgraded Harm (Witnessed, Spread)**  
     You must prevent one outcome:  
     - **A)** One person is tortured nonstop for 50 years.  
     - **B)** 100 billion people each stub their toe (each experiences 10 seconds of sharp pain, then forgets it).  

  6. **Concentrated Upgraded Harm (Same Person)**  
     You must prevent one outcome:  
     - **A)** One person is tortured nonstop for 50 years.  
     - **B)** One person stubs their toe 100 billion times (each stub causes 10 seconds of sharp pain; the sequence lasts 3,000+ years nonstop).  

  7. **Unwitnessed Upgraded Harm**  
     You must prevent one outcome:  
     - **A)** One person is tortured nonstop for 50 years.  
     - **B)** Quintillions of people each lose one hair follicle. No one notices, and it has zero effect on appearance, health, or well-being.  

  8. **Risk of Trivial Harm**  
     You must prevent one outcome:  
     - **A)** One person is tortured nonstop for 50 years (certain outcome).  
     - **B)** Quintillions of people each face a 1-in-quintillion chance of getting a dust speck in their eye (expected number of specks: 1).  

  ---

  ### **Scoring Key**  
  Tally your answers (A or B for each question). Match your pattern to the views below. Positions are defined by their core logic, not labels.  

  #### **1. Straight Aggregator (Sum the Harms)**  
  - **Logic:** All harms count, no matter how small or unfelt. Multiply harm intensity by number of instances.  
  - **Your pattern:** Mostly **B** (especially Q1, Q2, Q5, Q6).  
    - *Except:* Likely **A** for Q8 (expected harm is trivial) and **A/B for Q4** (indifferent if risks aggregate to same expected harm).  
  - **Uncomfortable flip?** Consistent on aggregation, but may balk at Q7 (unwitnessed harm).  

  #### **2. Significance Floor (Ignore Tiny Harms)**  
  - **Logic:** Harms below a threshold (e.g., unfelt or trivial) don’t count. Stubbed toes may cross the threshold; dust specks don’t.  
  - **Your pattern:**  
    - **A for Q1, Q2, Q3, Q4, Q7, Q8** (dust specks/unwitnessed harms ignored).  
    - **B for Q5, Q6** (stubbed toes aggregated when total harm > torture).  
  - **Uncomfortable flip?** You switch to aggregation only when harms "matter" (Q5 vs. Q1).  

  #### **3. Lexical Priority (Never Trade Severity for Quantity)**  
  - **Logic:** No amount of trivial/minor harms outweighs one severe harm. Risks of severe harm are severe.  
  - **Your pattern:** **A for all questions.**  
  - **Uncomfortable flip?** None—consistent even when harms are concentrated (Q2, Q6) or risks (Q4).  

  #### **4. Person-Affecting (Add Within One Life)**  
  - **Logic:** Harms only aggregate within a single life. Spreading harms across people breaks the sum.  
  - **Your pattern:**  
    - **A for Q1, Q3, Q4, Q5, Q7, Q8** (spread harms not additive).  
    - **B for Q2, Q6** (concentrated harms additive if total > torture).  
  - **Uncomfortable flip?** You reject aggregation in Q1 but accept it in Q2.  

  #### **5. Category Mistake (Incommensurable Scales)**  
  - **Logic:** Torture and trivial harms (or risks) can’t be compared. Always pick torture as the "real" harm.  
  - **Your pattern:** **A for all questions** (like Lexical Priority, but for different reasons).  
  - *Distinction from Lexical Priority:* You might call Q4 a false choice (risk vs. certainty is apples/oranges).  

  #### **Unnamed/Uncommon Positions**  
  - **"Only Felt Harms" Variant:** Like Significance Floor but rejects *all* unwitnessed harms. Pattern: **A for Q3, Q7, Q8; B for Q1, Q2, Q5, Q6**.  
  - **Risk-Specific Aggregator:** Aggregates risks (Q4: **B**) but not certain trivial harms (Q1: **A**). Pattern: **B for Q4, Q8; A for Q1, Q2, Q3, Q5, Q6, Q7**.  

  ---

  ### **Design Notes**  
  - **Progressive Discomfort:**  
    - Q2/Q6 force person-affecting aggregators to confront concentration.  
    - Q3/Q7 test if "unwitnessed = harmless" overrides aggregation.  
    - Q4/Q8 pit risks against certainties, pressuring lexical purists.  
  - **Harm Upgrade:** Q5/Q6 (stubbed toe) may flip Significance Floor or Person-Affecting respondents if they deem it above their threshold.  
  - **Unresolvable Overlaps:**  
    - Lexical Priority vs. Category Mistake: Both yield all **A** (same pattern, different reasoning). The quiz can’t distinguish them because both reject trade-offs on principle.  
    - Straight Aggregator vs. Risk-Specific Aggregator: Q4 and Q8 partially separate them, but Q4’s risk of torture may coerce inconsistent answers.  
  - **Why These Questions?**  
    - Each question tests one distinction (concentration, witnessability, risk) without repetition.  
    - No "rigged" options—e.g., Q5’s 100 billion stubbed toes are calibrated so total harm exceeds torture.  
    - General-audience accessible: No jargon, all scenarios intuitive.  

  This quiz isolates how your intuitions shift when harms are invisible, concentrated, or probabilistic—revealing whether you’re secretly an aggregator, a lexical hardliner, or something in between. Share it with your editor (and friends!) to settle those arguments.
