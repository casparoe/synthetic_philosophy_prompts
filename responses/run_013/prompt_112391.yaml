    1. Whether a harm must be felt (or noticed) to count.
    2. Whether harms add up across persons or only within a single life.
    3. Whether we are aggregating certain small harms or small probabilities of a large harm.

   The positions we are mapping to:
    A. Straight aggregator (multiply harm by number of instances, regardless of distribution or noticeability)
    B. Floor of significance (harms below a certain threshold don't count at all)
    C. Lexical priority (no amount of trivial harms can outweigh a severe harm)
    D. Person-affecting (harms only add within a single life)
    E. Category mistake (the two types of harm are incommensurable)

   Additionally, we want to consider:
    - Cases where the harm is unwitnessed (not noticed, remembered, or even noticeable)
    - Cases where the tiny harms are concentrated on one person vs spread out
