answer: |-
  Here are 8 interview questions designed to press your guest on the unique contours of her view, particularly the tipping point corollary and aggregation challenge, while avoiding simple restatements of the causal inefficacy claim. Each includes a follow-up anticipating her likely response and forcing deeper engagement. I've flagged potential "defuse" risks and built in the voting/meat intuition probe.

  **Core Questions & Follow-Ups:**

  1.  **On Lumpy Harms & Tipping Points:** "You argue individual duties peak near tipping points. But consider a 'lumpy' harm like the well: my bucket draws water harmlessly until *precisely* the moment it tips the well dry. Doesn't this prove *that specific act* was causally efficacious *and* wrong? How does your framework distinguish this from your 'no difference' cases?"  
      *   *Likely Answer:* "It *is* a tipping point case! The duty was strongest *just before* I drew that bucket because we were near collapse. My act *became* efficacious only because others had restrained earlier."  
      *   **Follow-Up (Prevents "It's just tipping"):** "But *before* I drew my bucket, *no single prior act* tipped the well – each was harmless. Only *mine* crossed the threshold. Doesn't this show that *sometimes*, an individual act *is* the decisive causal difference-maker, contradicting the core 'no difference' claim? Or are you saying the wrongness magically transfers retroactively to my act only *after* I draw the fatal bucket?"

  2.  **On Making Difference vs. Being Part:** "You distinguish 'making a difference' from 'being part of' the harm. But if I vote in a landslide loss, I'm 'part of' the harmful voting bloc, yet my vote didn't 'make a difference'. Why does merely 'being part of' generate *any* moral significance if my causal contribution is null? Isn't 'being part of' just guilt by association without causal responsibility?"  
      *   *Likely Answer:* "It's about participation in a *practice* or *institution* that *collectively* causes harm. My individual causal nullity doesn't negate my role *within* that harmful structure."  
      *   **Follow-Up (Introduces Voting/Meat Split):** "This distinction resonates more with voting (a collective decision procedure) than with eating steak (a private consumption act). Why does 'being part of' the *practice* of factory farming feel morally different to many people than 'being part of' the voting bloc? Is it the *intentional structure* or the *perceived agency*?"

  3.  **On Referendum Probabilities & Cutoffs:** "Take a referendum decided by *one* vote. I know it's deadlocked, but I don't know if *my* vote is decisive. The expected harm of my 'No' vote is (Probability my vote is decisive) * (Harm of the bad policy). Why dismiss this as 'no difference' rather than accepting a *small but real* expected harm/duty, especially when the stakes are massive? What *principled* reason sets the probability cutoff at *exactly* zero?"  
      *   *Likely Answer:* "Because the probability is vanishingly small – effectively zero for practical reasoning. We don't base duties on lottery-level chances."  
      *   **Follow-Up (Prevents "It's negligible"):** "But 'vanishingly small' isn't zero. Philosophers like Parfit use similar reasoning for imperceptible harms aggregating. What's the *qualitative* difference between a 1-in-10-million chance of causing massive harm and a 1-in-10-million *chunk* of a massive harm? Doesn't dismissing *all* probabilistic efficacy undermine precautionary principles elsewhere?"

  4.  **On Free Riding & Restraint:** "If my steak-eating causes no harm, and the practice is stable, you say my duty is weak. But isn't this free riding? I benefit from the *practice* (cheap meat) while relying on *others' restraint* to prevent collapse. Even if I cause no *extra* harm, isn't exploiting others' compliance a *distinct* wrong – a failure of fairness or reciprocity?"  
      *   *Likely Answer:* "Free riding typically implies harm or unfair burden *caused* by my defection. Here, if the practice is stable, my act imposes no *actual* burden on restrainers. They are restraining based on *their* perceived duties to the collective, not based on my reciprocal compliance."  
      *   **Follow-Up (Prevents "No Burden"):** "But doesn't the *stability* of the harmful practice *depend* on widespread restraint? My participation, while causally inert *this time*, helps *sustain* the expectation and infrastructure *requiring* that ongoing restraint from others. Isn't benefiting from a system *predicated* on widespread restraint, while not restraining myself, unfair even if my *specific* burger imposes no *new* burden?"

  5.  **On Aggregation (The Hardest):** "Your view suggests the *practice* of factory farming is wrong, but no *individual* purchase is wrong (when stable). Where does the wrongness of the practice reside? If it's not reducible to the sum of individual wrongs, is it an emergent property? And if so, how does this emergent wrongness generate duties for individuals that *aren't* duties *not to participate*, given participation isn't individually wrong?" *(This forces her to locate normativity without individual culpability or reduce it back to individuals).*  
      *   *Likely Answer:* "The wrongness resides in the *collective outcome* and the *institutional structures* that produce it. Individual duties relate to supporting, reforming, or withdrawing from *those structures*, not directly to the micro-impacts of acts within them."  
      *   **Follow-Up (Prevents "Institutions!"):** "But how does the wrongness of the structure *translate* into an individual duty *not to buy a steak* if that act (a) doesn't perceptibly harm the structure, (b) doesn't constitute 'support' in any meaningful sense (given market size), and (c) isn't intrinsically wrong? Doesn't this leave a gap: a wrong structure generating *no* plausible individual duties *not to participate* in the core activity sustaining it? Or must you concede that buying the steak *is* a tiny act of 'support', making it *slightly* wrong?"

  6.  **On Publicity & Self-Undermining:** "If everyone internalized your view – believing individual acts don't matter when the practice is stable – then *no* harmful practice would ever approach a tipping point, because no one would act based on individual efficacy. Doesn't this make your view self-undermining? Who, then, *is* supposed to provide the restraint that creates the tipping point potential you rely on for the 'strong duty' cases?"  
      *   *Likely Answer:* "This is a problem for *any* moral theory reliant on coordination. We need complementary institutional solutions, norms, or perhaps duties based on *expressive* or *symbolic* value of actions, not individual efficacy."  
      *   **Follow-Up (Prevents "Need Institutions"):** "But doesn't this admission fundamentally shift the ground? If widespread belief in individual inefficacy *prevents* tipping points from arising, rendering the 'strong duty' near tipping points irrelevant, doesn't that leave us *only* with the 'weak duty' during stability? And if *that* weak duty can't be grounded in individual efficacy *or* reliably move us towards institutional change, what practical normative force does your view retain?"

  7.  **On the Tipping Point Corollary Itself:** "Your corollary states the individual duty is *strongest* when a collective outcome is near a tipping point. But intuitively, if a harmful practice is on the brink of collapse, my *not* participating (e.g., not flying) seems *less* urgently needed – the harm might end soon anyway. Conversely, when the practice is rock-solid, my restraint seems *more* crucial precisely because the harm is entrenched and needs more defectors to stop it. Doesn't your corollary invert intuitive moral urgency?"  
      *   *Likely Answer:* "No, because near the tipping point, my act *can* make the crucial difference – it has high expected efficacy. When the practice is stable, my act has near-zero expected efficacy, so the duty based on *causal contribution* is weak."  
      *   **Follow-Up (Links to Aggregation/Free Riding):** "But if the duty near tipping points is based on *expected efficacy*, doesn't that concede the core point critics make about probabilistic difference-making? And if the duty during stability is weak *only* because of causal inefficacy, doesn't that ignore the potential wrongs of free riding and complicity in sustaining the harmful structure that we discussed earlier?"

  8.  **On the Voting/Meat Intuition Split:** "Many people feel a stronger individual duty regarding voting (even in safe states) than regarding eating meat. Your view seems to treat them similarly (no individual difference when stable). Why might these intuitions diverge? Does this suggest your view captures something important about voting (perhaps its inherently collective, symbolic nature) but misses something crucial about consumption?"  
      *   *Likely Answer:* "Voting *is* qualitatively different. It's a formal act within a specific collective decision-making procedure designed to aggregate individual inputs. Its meaning is inherently tied to the collective outcome, even if my vote isn't pivotal. Buying meat is a private market transaction; its connection to the collective harm is indirect and mediated by complex systems."  
      *   **Follow-Up (Tests the Distinction):** "But if the *moral wrong* in meat-eating is the participation in a harmful *system* or *practice*, as you suggest, why isn't that just as salient as participation in a harmful electoral outcome? If 'being part of' the harmful collective is what matters, shouldn't the intuitions align? Or does this point to a deeper need to ground the duty in something *other* than causal contribution *or* mere participation – perhaps expressive commitment or integrity?"

  **Key Design Choices & Why They Address Your Concerns:**

  *   **Defusing Defusals:** Follow-ups explicitly anticipate common escape routes ("It's a tipping point," "Probability is negligible," "Wrongness is in the institutions," "Need complementary solutions," "Voting is different") and force engagement by pointing out contradictions, gaps, or unintended consequences.
  *   **Aggregation as Hardest:** Question 5 directly attacks the core metaphysical/normative puzzle without relying on literature. The follow-up presses the gap between structural wrongness and individual duties.
  *   **Voting/Meat Split:** Explicitly raised in Q2 (Follow-Up) and Q8. Q8's follow-up tests whether her distinction holds under pressure and pushes her towards explaining the divergent intuitions.
  *   **Working Live:** Questions avoid "literature says X, respond." They frame concrete, often paradoxical scenarios (well, referendum, publicity) demanding original application of her view.
  *   **Tipping Point Focus:** Central to Q1, Q6, and Q7. Q7 directly challenges the corollary's intuitive plausibility.
  *   **Follow-Up Logic:** Each follow-up assumes the *most probable* response to the initial question and then introduces a new pressure point, contradiction, or implication she must address, preventing restatement.

  **Delivery Tip:** Listen closely to her initial answers. If she *does* give a single-sentence defuser you anticipated, calmly restate the *exact* follow-up question provided. If she gives an unexpected answer that still seems evasive, pivot to: "Let me see if I understand: You're saying [Paraphrase her answer]. But doesn't that lead to [Contradiction/Problem from another question, e.g., the aggregation gap or publicity problem]?" This keeps her working live on the core tensions in her view. Good luck!
