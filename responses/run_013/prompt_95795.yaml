prompt: |-
  So my friend and I got into a long, increasingly loud argument at a bar last night about whether people should be allowed to sell a kidney, and I'm still annoyed about it becuase he thinks he won and I don't think he did. He's a second-year law student who has recently decided he's a libertarian, and his big move, which he's very pleased with, is the plasma thing: he says you can walk into a clinic in the US, get hooked up to a machine, and get paid to have your plasma drawn out of you — he claims it's like forty, fifty bucks a pop and you can do it twice a week — and nobody calls that monstrous, nobody says the donors have been degraded or turned into spare parts, and the clinics are just... normal. He says selling a kidney is exactly the same kind of transaction: a voluntary sale of a piece of your body, money changes hands, a medical professional is standing right there. So all the commodification hand-wringing is squeemishness, and anyone who's fine with paid plasma but not paid kidneys is just being inconsistent. And then he gestured at the old arguments about paying blood donors and said look how that turned out. I didn't have a comeback beyond muttering something about exploitation, which he correctly identified as a vibe, so I want to actually work through it.

  Can you audit the analogy for me? I want the correspondence table first — what plays the role of what, spelled out, so I can see exactly what he's claiming maps onto what — and then the places where it breaks. Be ruthless about sorting those breaks into two piles: the ones that actually do damage to his conclusion, and the ones that are just incidental differences that a clever defender could patch or wave away. For example, if the only real difference is that plasma regenerates in a few weeks and a kidney doesn't, I genuinely don't know whether that's a fatal disanalogy or a footnote, and I want you to commit to an answer and defend it. Also tell me what the analogy is quietly importing that neither of us noticed — something about the source case that he's assuming is uncontroversial and that isn't. And here's the part I care about most: suppose I concede him everything, the whole plasma market is safe and well-regulated and morally unobjectionable, fine; does that actually get him to legal kidney sales, or was the conclusion being carried by something else the whole time and the analogy is just decoration? If it doesn't get him there, give me a better analogy for kidney markets — one that keeps the structure he actually needs (voluntary, paid, risky, bodily) without smuggling in all the rest.
