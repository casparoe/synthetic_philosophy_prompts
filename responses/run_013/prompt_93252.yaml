answer: |-
  ## Film as Stakes-Raising Epistemology: 12 Angry Men Favors Pragmatic Encroachment

  **Bottom Line:** *12 Angry Men* aligns more strongly with **pragmatic encroachment** than contextualism. It demonstrates that the *stakes themselves* heighten the epistemic standards required for justified belief ("knowledge") in a high-consequence context, rather than merely shifting the conversational meaning of "know."

  **The Argument:**

  1.  **Stakes Elevate Standards:** The film vividly portrays how the life-or-death stakes *directly necessitate* stricter scrutiny. Juror 8’s initial "I don't know" explicitly frames the deliberation as an investigation demanded *because* the consequence is execution. His doubt isn't capricious; it's a moral and epistemic response to the weight of the decision. The initial "knowers" (like Jurors 3, 4, 7, 10) aren't merely using "know" loosely in a low-stakes context; they are shown to be *epistemically negligent* by failing to adequately respond to what's at stake. Their certainty collapses not because the word's meaning shifted mid-conversation (contextualism), but because the *inescapable salience of the stakes* forces them to confront the flimsiness of their evidence under heightened scrutiny (encroachment).
  2.  **"Reasonable Doubt" as a Stakes-Sensitive Threshold:** The film treats "reasonable doubt" not as a fixed probability (e.g., 95%), but as a threshold dynamically calibrated by the consequences. Juror 8's method – meticulously probing alibis, witness credibility, and physical evidence – embodies the *increased effort and certainty required* when a life hangs in the balance. Finding reasonable doubt *means* recognizing that the evidence doesn't meet the extraordinarily high bar *set by the penalty*. This is encroachment in action: the practical stakes dictate the level of justification needed for the belief (guilt) to count as actionable "knowledge."
  3.  **The Linguistic Shift Mirrors Epistemic Rigor:** The move from declarations of absolute knowledge ("I *know* he's guilty!") to qualified belief ("I *think* he's guilty, but I'm not sure") as doubt emerges isn't just a semantic shift. It reflects jurors genuinely reassessing the sufficiency of their evidence *under the pressure of the stakes*. Juror 3's final, tearful "Not guilty" is the ultimate concession that his certainty couldn't withstand the scrutiny demanded by what was at stake.

  **Where the Film Pushes Back and Complicates:**

  *   **Evidence Matters Too:** Pragmatic encroachment focuses on how stakes raise the bar for justification *given evidence*. Juror 8 doesn't *just* invoke the stakes; he actively *uncovers new evidence* (the knife purchase, the woman's glasses, the el train timing). The film shows that while stakes demand rigor, *meeting* that demand often requires concrete investigative work, not just heightened reflection. This grounds encroachment in practical reality.
  *   **Non-Epistemic Factors:** The film powerfully illustrates how prejudice (Juror 10), personal baggage (Juror 3), indifference (Juror 7), and procedural focus (Foreman) distort judgment *alongside* epistemic failings. Philosophy often isolates epistemic factors, but the film shows how intertwined they are with emotion and bias in real-world high-stakes decisions.
  *   **Beyond "Know" vs. "Don't Know":** The Foreman represents a different approach: focused on procedure and the burden of proof ("proven beyond a reasonable doubt"), less concerned with personal "knowledge." This highlights how institutional frameworks manage high-stakes decisions, operating alongside (and sometimes constraining) individual epistemic assessments.

  **Conclusion:** While contextualism captures *some* linguistic fluidity, *12 Angry Men*'s core thrust is that the death penalty's gravity fundamentally *changes the epistemic game*. It necessitates a level of diligence, skepticism, and certainty that simply wouldn't be required for a lower-stakes decision. Juror 8 embodies this stakes-sensitive epistemology, forcing the others to meet the higher standard demanded by a human life, making the film a powerful cinematic argument for pragmatic encroachment.
