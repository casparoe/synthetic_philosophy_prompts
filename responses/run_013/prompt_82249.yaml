prompt: |-
  I do data modelling for a living — schemas, primary and foreign keys, versioned rows, bitemporal tables, the name/taxon/name-usage seperation, that sort of thing — and a friend who's a philosopher of biology keeps going on about the species problem. I'd definately like to know how much of it survives being said in my language.

  So take the whole tangle — whether species are natural kinds or individuals or just convenient groupings, the essentialism that won't lie down, the pile of competing species concepts, and the cases they wheel out (ring species, cryptic species, bacteria passing genes sideways so the tree stops being a tree, clustering algorithms that spit out operational taxonomic units which then get treated as though they'd been discovered rather than computed) — and restate it as faithfully as you can in schema-design vocabulary: tables and keys, types versus instances, normalisation and deliberate denormalisation, versioning, and the difference between a schema for the world and a schema for the record of what people have said about the world.

  Then the residue report. What translates cleanly, what only translates if I fudge it, and what has no counterpart at all in what I actually do. Where something doesn't come across, tell me whether that's my framework being too thin for the question or the philosophers' claim being vaguer than it looks — e.g. when someone says a species is an individual and not a class, is that a discovery about the world, or a design decision I'd make on a Tuesday and never think about again?

  And if my vocabulary makes the whole thing look like just picking whichever schema fits the queries, say that plainly, and tell me what I'd be missing about why they think the world gets a vote.

  Lead with your bottom line in the first sentence, then the reasoning. No preamble, and don't restate my question back at me.
