prompt: |-
  I work in the rulemaking division of a state agency, and every few years we rewrite the definitions in our regulations that turn on continuum predicates: 'chronic', 'significant', 'substantial', 'impaired', 'material', 'safe', 'adequate'. There are about a dozen per cycle, each currently drawn by whichever analyst owns the file, with a rationale that amounts to 'this is where the science seems to point' or 'this is where the regulated parties said they could live with it'. We are challenged on both flanks: administrative and judicial review for drawing arbitrary lines, and commenters for refusing to draw them at all. I have roughly a day per definition, a law degree, no training in philosophy, and a politically mixed appointed commission that signs off and will not read more than two pages.

  I want a procedure my division can actually run, repeatedly, on any continuum predicate, that keeps faith with what the philosophy of vagueness genuinely establishes rather than with folk wisdom about slippery slopes. Assume I cannot look anything up: no bibliography, no reading list, no citations, and no reliance on named doctrines I would have to go read. Whatever distinctions you use, state them in the procedure itself.

  Concretely, I want:

  A triage step first, in order, that separates a genuinely vague predicate from one that is merely under-specified, ambiguous between two readings, or multidimensional in a way that hides a value tradeoff. Say what evidence in the file settles each verdict and what to do when the verdict is 'not vagueness'.

  Then a tolerance audit: a test that takes a proposed line and asks whether the rationale offered for it survives being applied to cases one imperceptible step away, so that I can see on paper whether the rule's own justification would walk the line anywhere it likes. Specify how to construct the chain, how many steps, and what counts as failing.

  Then a sharpening warrant: a written record, for the line I choose, of which clear cases it must not flip and which rival lines it rules out, plus a rule for how much of that record goes in the preamble so the choice reads as reasoned rather than arbitrary.

  Then a choice among the available shapes of rule — a single bright line; a bright line with a rebuttable presumption or gray band; a graded scale — with criteria for picking, and an explicit warning if graded semantics tempts us into graded penalties, since our remedies are binary.

  Then a penumbra protocol covering the hard cases: a case near but not in the penumbra, a case where it is unclear whether the case is in the penumbra at all, and a case where two of our definitions interact so that each looks sharp only because the other absorbs the vagueness.

  Finally, the honesty requirements: mark every step that is a judgment call dressed as procedure; say where the procedure stops with a no; say where it hands the decision to the commission because the question is what we are willing to tolerate rather than where the boundary lies; and address whether it matters for how I write the rule whether the boundary is sharp but unknowable, or genuinely indeterminate, or moves with context. If that distinction changes nothing about the drafting, say so and say why.

  Run it on three definitions: 'chronic' exposure, where the continuum runs along two axes, level and duration; 'significant' impairment measured on a single instrument scale; and 'safe' level of a contaminant, where I suspect the real dispute is about risk tolerance. At least one of the three should come out with a verdict I will not like, and you should not soften it. Close with what the procedure cannot do.
reasoning: |-
  Okay, the user works in a state agency's rulemaking division and faces a challenge with continuum predicates like 'chronic', 'significant', and 'safe'. They need a practical, repeatable procedure to handle these terms without arbitrary line-drawing. Let me unpack their requirements.

  First, they mentioned a triage step to distinguish genuine vagueness from other issues like under-specification or ambiguity. The user probably encounters cases where terms are misdiagnosed as vague, leading to ineffective rules. For example, 'safe' might involve risk tolerance trade-offs rather than true vagueness. The procedure must clearly identify evidence like conflicting interpretations or value-based disputes to redirect the approach.

  Next, the tolerance audit. The user wants to test if a proposed line holds under tiny variations. Their current rationales might not withstand scrutiny, causing arbitrary outcomes. Constructing a chain of imperceptible steps—say, 10 steps around the threshold—can expose inconsistencies. If the rationale allows movement beyond what's defensible, it fails. This step addresses judicial challenges by ensuring the line isn't arbitrary.

  The sharpening warrant is about documentation. The user needs to record clear cases the line must respect and rejected alternatives. This creates a defensible record for review. Highlighting must-not-flip cases and ruled-out lines shows reasoned decision-making. The preamble should summarize this without overwhelming detail—bullet points might work.

  Choosing rule shapes is crucial. Bright lines are simple but brittle; graded scales work for multidimensional terms but clash with binary remedies. The user needs criteria: use bright lines when transitions are abrupt, rebuttable presumptions for uncertainty, and avoid graded penalties. Warning against mismatched semantics and remedies is key, especially for terms like 'chronic' with two axes.

  Penumbra protocols handle edge cases. The user faces scenarios like near-penumbra cases or interacting definitions. Pre-defining secondary tests (e.g., severity flags for 'impairment') and conflict checks can manage these. For 'safe', a rebuttable presumption allows adjustments without reopening debates.

  Honesty requirements are vital for credibility. Marking judgment calls, like choosing core cases, maintains transparency. Some decisions, like risk tolerance for 'safe', must go to the commission. The user needs clarity on whether the boundary's nature (unknowable vs. indeterminate) affects drafting. If not, state why—practical rules focus on administrability over metaphysics.

  Applying this to 'chronic': Triage confirms vagueness due to varying expert cutoffs. Tolerance audit reveals that both axes need thresholds. A rebuttable presumption with a gray band accommodates uncertainty. For 'significant impairment', a bright line with severity flags handles penumbra cases. 'Safe' fails triage—it's about risk tolerance, so the commission must decide acceptable risk levels.

  The procedure can't resolve value conflicts or eliminate discretion but structures decisions to minimize arbitrariness. Highlighting what it can't do—like substituting for political judgments—manages expectations. The user needs a tool that's both rigorous and feasible within their constraints, ensuring rules stand up to scrutiny while admitting inherent uncertainties.
answer: |-
  Here’s a self-contained procedure for continuum predicates, designed for operational use within your constraints. It includes triage, testing, documentation, rule design, edge-case protocols, and honesty markers. I’ll apply it rigorously to "chronic," "significant impairment," and "safe," with one verdict you’ll dislike.

  ---

  ### **Procedure for Continuum Predicates**

  #### **1. Triage Step: Is This Genuine Vagueness?**
     - **Evidence to Examine**: 
       - *File indicators of vagueness*: Multiple experts/studies propose different cutoffs; comments argue "it depends on context"; borderline cases provoke disagreement even after facts are settled.
       - *Indicators of non-vagueness*:
         - **Under-specification**: Comments ask "which metric?" or "which aspect?" (e.g., "safe for whom? Children or adults?"). *Resolution*: Add specificity (e.g., "safe for a 70kg adult").
         - **Ambiguity**: Comments reveal two distinct meanings (e.g., "material" meaning "physical substance" vs. "important"). *Resolution*: Pick one meaning and define it.
         - **Value Tradeoff**: Comments frame the issue as "how much risk is acceptable?" or "cost vs. benefit." *Resolution*: Flag for commission—this is policy, not boundary-setting.
     - **Verdict & Action**:
       - **Vague**: Proceed to Step 2.
       - **Not Vague**: Resolve as above. If unresolved, return to drafter.

  #### **2. Tolerance Audit: Test the Proposed Line**
     - **Method**:
       - Construct a chain of 10 hypothetical cases. Start at the proposed threshold (e.g., 15 ppm contaminant). Each step changes one variable by the smallest *measurable unit* (e.g., 0.1 ppm, 1 day duration).
       - For each step, apply the *exact rationale* used for the threshold (e.g., "health effects observed at 15 ppm").
     - **Failure Criteria**: 
       - If the rationale *must* also cover ±3 steps away (e.g., 14.7 ppm and 15.3 ppm), the line is arbitrary.  
       - If it *could* cover ±5 steps without contradiction, the line is unstable.
     - **Output**: Pass (rationale breaks within 3 steps) / Fail (rationale stretches beyond 5 steps).

  #### **3. Sharpening Warrant: Document the Boundary**
     - **Record for File**:
       - **Must-not-flip cases**: 2 clear positives (e.g., "100 ppm is unsafe") and 2 clear negatives (e.g., "1 ppm is safe") that anchor the line.
       - **Rival lines rejected**: The highest defensible threshold (e.g., 20 ppm) and lowest (e.g., 10 ppm) from evidence, with 1-sentence reasons for rejection (e.g., "20 ppm ignores Study X").
     - **Preamble Inclusion**: 
       - "The rule sets [threshold] because [rationale]. This excludes [rejected high/low] because [reason]. It treats [clear case] as compliant and [clear case] as non-compliant." (Max 3 sentences.)

  #### **4. Rule Shape Selection**
     - **Criteria**:
       - **Bright line**: Use if tolerance audit *passes* and penumbra is narrow (clear cases dominate).
       - **Bright line + rebuttable presumption**: Use if tolerance audit *fails* but clear cases exist (e.g., "presumed chronic at 6 months, rebutted by proof of no long-term effect").
       - **Graded scale**: Use only for *multidimensional* terms (e.g., duration + severity) with measurable inputs. **WARNING**: Graded semantics ≠ graded penalties. If remedies are binary (e.g., compliance/non-compliance), collapse grades into a binary threshold (e.g., "chronic if score ≥7").
     - **Output**: Rule structure with justification.

  #### **5. Penumbra Protocol**
     - **For cases near the penumbra**: Apply a secondary test (e.g., "if duration is 5.9 months, check severity score").
     - **Unclear if in penumbra**: Presume non-violation but require monitoring/plan.
     - **Interacting definitions**: Audit both predicates together (e.g., test if a case shifts from "impaired" to "not impaired" when "chronic" is adjusted). If overlap absorbs vagueness, add: "A finding of [Predicate A] supersedes [Predicate B]."

  #### **6. Honesty Requirements**
     - **Judgment calls**: 
       - Triage verdicts ("This is a value tradeoff"), selecting must-not-flip cases, choosing secondary tests for penumbra.
     - **Stop with "no"**: If triage finds non-vagueness, stop. If tolerance audit fails irreparably, reject the line.
     - **Delegate to commission**: Value tradeoffs, risk tolerance, or if no clear cases exist.
     - **Boundary nature**: Draft the same regardless of epistemology (unknowable vs. indeterminate). Why? Rules need *actionable* thresholds; metaphysics doesn’t change drafting.

  ---

  ### **Application to Cases**

  #### **1. "Chronic" Exposure (Level + Duration)**
     - **Triage**: Genuinely vague (experts debate "how long is chronic?" and "at what exposure level?").  
     - **Tolerance Audit**: 
       - Proposed: ">6 months at >10 ppm".  
       - Rationale: "Studies show effects after 6 months at 10 ppm."  
       - Test: 5.9 months at 10 ppm? Rationale stretches (effects likely similar). *Fails*.  
     - **Sharpening**: Must-not-flip: 12 months/20 ppm (chronic), 1 week/2 ppm (not). Reject 3 months (ignores latency) and 20 ppm (overprotective).  
     - **Rule Shape**: Rebuttable presumption: "Chronic if >6 months at >10 ppm, rebutted by biomarker showing no cumulative effect."  
     - **Penumbra**: Near-threshold cases trigger rebuttal process.  
     - **Honesty**: Judgment call on rebuttal criteria; commission must accept risk of false negatives.

  #### **2. "Significant Impairment" (Single Scale)**
     - **Triage**: Vague (clinicians disagree on "significant" cutoff for a 100-point scale).  
     - **Tolerance Audit**: 
       - Proposed: "Score ≥40".  
       - Rationale: "Functional limits observed at ≥40."  
       - Test: Score 39? Similar functional impact likely. *Fails*.  
     - **Sharpening**: Must-not-flip: Score 80 (impaired), 20 (not). Reject 30 (outlier study) and 50 (ignores real-world impacts).  
     - **Rule Shape**: Bright line at 40, but add severity bands (e.g., "≥40: impairment; 30–39: monitor"). **Warning heeded**: No graded penalties—only "≥40" triggers action.  
     - **Penumbra**: Scores 30–39 require retest in 30 days.  
     - **Honesty**: Secondary test (retest) is a judgment call.

  #### **3. "Safe" Contaminant Level (Risk Tolerance)**
     - **Triage**: **Not vague**. Evidence: Comments say "acceptable risk is 1 in 100k vs. 1 in 1M"; industry cites cost, advocates cite precaution. *Verdict: Value tradeoff*.  
     - **Action**: Stop procedure. Hand to commission: "Set 'safe' at [X] ppm based on acceptable risk level." No boundary-drafting needed.  
     - **You won’t like this**: But "safe" is a policy call masked as vagueness. Your procedure avoids misdiagnosis.

  ---

  ### **What the Procedure Cannot Do**
  1. **Resolve value conflicts** (e.g., "how much risk is acceptable?").  
  2. **Eliminate discretion** at the margins (penumbra protocols manage, not erase, ambiguity).  
  3. **Replace scientific judgment** (e.g., picking must-not-flip cases relies on expert input).  
  4. **Fix poor evidence** (garbage in, garbage out).  
  5. **Prevent challenges**—but creates a defensible record showing reasoned deliberation.

  This procedure forces explicit choices, exposes arbitrariness, and distills philosophy into actionable steps—all within your constraints. Use it as a checklist for each predicate.
