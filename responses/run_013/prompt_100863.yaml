prompt: |-
  I have been trying to get clear on the difference between knowing how to do something and knowing that something is the case, and I keep returning to a pile of cases where my gut verdicts refuse to settle. My uncle rides a bicycle beautifully and cannot tell you, even roughly, what keeps him upright; I want to say he knows how to ride and does not know that you stay up by steering into a fall. A friend read a swimming manual cover to cover and can recite the stroke and the breathing pattern without a flaw, but put him in a pool and he sinks; he has the facts and does not know how to swim. A former competitive swimmer I know is now paralyzed and will never swim again, yet I still want to say she knows how to swim, that the knowing did not leave with the ability. A man who has not driven in forty years and would now be a menace on the road can still narrate a three-point turn step by step; there I want to say he has the facts and has lost the how. A chess player who finds the right move at a glance but can only gesture at why, and a musician who plays entirely by ear, both seem to me to know how while barely knowing that. And a woman I met who acquired a difficult manual skill under hypnosis performs it flawlessly but insists she has no idea how she does it and that it feels like it happens to her, which leaves me unsure whether to credit her with the knowing at all. The case that most unsettles me is the ear-wiggler: someone who could always wiggle her ears, never learned, and has no idea how she does it — I find I want to say she knows how, and I cannot tell whether that verdict belongs with the bike rider or is simply a mistake on my part.

  I keep reaching for a principle and it keeps breaking. The tempting first one is that knowing how simply is the ability to do the thing; but the paralyzed swimmer has the knowing without the ability, so that cannot be right as stated. The tempting second one is that knowing how is just knowing a true proposition of the right sort — knowing a way of doing it — but the bike rider seems to have no such proposition, and the ex-driver seems to have one without the knowing how, so that breaks too. My best attempt so far is something like: knowing how to do X is the ability to do X when that ability is guided by the agent's own grasp of how it is done — but I cannot say whether the "grasp" here is a proposition, a disposition, or something else, and the ear-wiggler and the hypnotized performer both make me suspect the whole approach is misdirected. Two further cases I would add to the pile and would want your verdict on, since I cannot settle them myself: a chess engine that plays at superhuman level and stores no description of its own method, and a person whose only way to get anywhere is by following a navigation device, who could not retrace a route she has driven a hundred times if the device were taken away.

  What I want is the principle, or a small set of competing principles, that best captures this pattern: stated precisely enough that I can see which clause is answering for which case; tested against the cases I have listed and the two I have added; and accompanied by an honest account of which of my verdicts the winning principle has to overturn, or of what further case would decide between the survivors. If my tentative "guided ability" principle can be repaired rather than abandoned, tell me how, and tell me what it then predicts for a case I have not mentioned — say, a person who can perform a skill only while reciting a nonsense phrase, and who fails the moment the phrase is taken from her.
reasoning: |-
  Okay, I need to tackle this user's deep philosophical question about the difference between knowing-how and knowing-that. The user presents a series of thought experiments where their intuitions conflict, seeking a clear principle to resolve them. 

  First, I recognize this as the Rylean vs. intellectualist debate in epistemology. The user's frustration with broken principles resonates - their "guided ability" attempt shows they've done serious groundwork. Their cases are cleverly chosen to pressure-test theories: the paralyzed swimmer challenges pure ability views, the hypnotized performer challenges agency requirements, and the ear-wiggler straddles intuition uncomfortably.

  Hmm, the chess engine and GPS-dependent driver additions are particularly sharp. The engine lacks propositional knowledge but exhibits skill, while the GPS user has declarative access yet no practical competence. These modern examples might actually help reframe the debate beyond traditional binaries.

  I notice the user's language reveals anxiety about consistency ("unsettles me", "cannot settle"). Beyond wanting an answer, they might need reassurance that some ambiguity is inherent to the concept. Their meticulous case-collection suggests a philosophical temperament that would appreciate seeing where theories must remain tentative.

  For my response, I'll need to:
  - Acknowledge why both ability-based and propositional theories fail
  - Propose an anti-intellectualist framework that handles the paralyzed agent
  - Introduce dispositional knowledge to explain the ear-wiggler
  - Use the chess engine to show non-propositional knowing-how
  - Admit where intuitions might conflict (hypnotized case)
  - Offer the "nonsense phrase" case as a new test

  The user's "guided ability" insight is salvageable if we reject the intellectualist baggage. By framing guidance as embodied disposition rather than propositional awareness, we can cover both the cyclist and ear-wiggler without collapsing into behaviorism. The GPS case becomes a beautiful counterexample to intellectualism - all propositional access, zero know-how.

  I should flag the hypnotized performer as the hardest case. If the skill feels alien, is it still "theirs"? Maybe we need a spectrum of ownership. But pushing too far here risks undermining the whole framework - better to note the tension than force resolution.

  The nonsense phrase test case will let the user stress-test the theory: if the phrase enables control, it's guided ability; if mere superstition, it's rote behavior. That distinction might help them refine their intuitions.
answer: |-
  You've crafted an exceptionally rich set of cases that expose the fault lines in the "knowing-how" vs. "knowing-that" debate. Your instincts are sharp—the standard theories *do* break on these rocks. Let's build a principle (and a competitor) that accounts for your verdicts, identifies where adjustments are needed, and provides clear predictions.

  **The Winning Principle: Guided Embodied Disposition (Anti-Intellectualism + Agency)**

  *   **S knows how to φ** if and only if:
      1.  **Dispositional Capacity:** S possesses a *reliable, embodied disposition* to successfully φ (or would possess it under normal conditions where φ is possible), grounded in S's own physical/cognitive system.
      2.  **Guidance Condition:** This disposition is *non-deviantly guided by S's own practical understanding* of φ-ing. This understanding is:
          *   **Non-Propositional:** Primarily embodied in sensorimotor skills, perceptual sensitivities, and procedural routines.
          *   **Agentive:** S experiences their actions as *their own* (even if not consciously articulated) and can typically modulate the activity based on feedback.
          *   **Integrated:** The understanding is functionally integrated with S's capacity to φ; it's not merely an external cause.

  **How it Handles Your Cases (and the New Ones):**

  1.  **Uncle (Bike):** ✅ **Knows How.**
      *   *Capacity:* Reliable embodied disposition to ride.
      *   *Guidance:* His steering, balance adjustments, etc., are guided by his *non-propositional* sensorimotor understanding, even if he can't articulate it. He modulates his actions based on feedback (e.g., leaning into a turn).

  2.  **Friend (Swim Manual):** ❌ **Doesn't Know How.**
      *   *Capacity:* Lacks the reliable embodied disposition.
      *   *Guidance:* While he "knows that" facts, these aren't functionally integrated into an embodied capacity to guide action. They remain inert propositions.

  3.  **Paralyzed Swimmer:** ✅ **Knows How.**
      *   *Capacity:* The embodied disposition *would be reliably present* under normal conditions (non-paralysis). The neural/cognitive structures supporting the skill are intact.
      *   *Guidance:* Her non-propositional understanding (stroke timing, breath control, buoyancy feel) remains integrated with this latent capacity.

  4.  **Ex-Driver (3-Point Turn):** ❌ **Doesn't Know How (anymore).**
      *   *Capacity:* Lacks the reliable embodied disposition *now* (he's a "menace"). Muscle memory, coordination, spatial judgment for driving have degraded.
      *   *Guidance:* While he "knows that" the steps, this propositional knowledge isn't functionally integrated with an embodied capacity to *guide* the complex sensorimotor actions safely. His narration is detached.

  5.  **Chess Player (Glance)/Musician (Ear):** ✅ **Know How.**
      *   *Capacity:* Reliable disposition to find good moves/play correctly.
      *   *Guidance:* Guided by deeply internalized *non-propositional* pattern recognition, intuitive feel, and procedural knowledge. Their gestures indicate the understanding is embodied, even if not verbalizable.

  6.  **Hypnotized Performer:** ⚠️ **Borderline / Depends.**
      *   *Capacity:* Reliable embodied disposition *is* present.
      *   *Guidance:* **Problematic.** She lacks integration and agency: "it feels like it happens to her," she has "no idea how," cannot modulate it consciously. The skill is *in* her, but not *of* her agency. **Principle leans towards ❌:** The "non-deviantly guided by S's own practical understanding" and "agentive" elements are missing. It's more like a reliable reflex installed under hypnosis, not *her* know-how.

  7.  **Ear-Wiggler:** ✅ **Knows How.**
      *   *Capacity:* Reliable embodied disposition.
      *   *Guidance:* Guided by her own *non-propositional* proprioceptive/motor understanding. She initiates it intentionally ("wiggle ears!"), it feels agentive (even if the mechanism is opaque), and she can modulate it (start/stop). It belongs squarely with the bike rider. Your gut is correct.

  8.  **Chess Engine:** ✅ **Knows How (in a derivative sense).**
      *   *Capacity:* Superhuman reliable disposition to play well.
      *   *Guidance:* Guided by its *own internal computational processes* (its non-propositional "understanding" encoded in weights/architecture). It evaluates positions, makes moves based on its training, adapting to opponents. It "knows how" relative to its functional design. (This requires accepting non-biological agents can have "know-how" analogically).

  9.  **GPS-Dependent Driver:** ❌ **Doesn't Know How (to navigate independently).**
      *   *Capacity:* Lacks a reliable embodied disposition for *independent* navigation. Her capacity is contingent on external input.
      *   *Guidance:* Her actions are guided *entirely* by the GPS's instructions (propositional outputs), not her own integrated spatial understanding or memory. She lacks the non-propositional cognitive map or route-finding skills. She "knows how" to follow GPS instructions, not how to navigate the route itself.

  **The Main Competitor: Robust Practical Capacity (Rylean Ability+)**

  *   **S knows how to φ** if and only if S possesses the *robust, reliable ability* to φ (or would possess it under normal conditions where φ is possible), where "ability" implies:
      *   The skill is *learned or developed* (not purely innate reflexes).
      *   Performance is *adaptable* to variations and novel situations within the domain.
      *   It involves *intelligent action* (responsive to reasons/goals, even if tacit).

  **How the Competitor Differs (and Where it Struggles):**

  *   **Handles Well:** Uncle (✅), Friend (❌), Paralyzed Swimmer (✅ - latent ability), Ex-Driver (❌ - ability lost), Chess/Musician (✅), Ear-Wiggler (✅ - *if* wiggling is seen as a learned/controlled skill, not pure reflex).
  *   **Struggles With:**
      *   **Hypnotized Performer:** Likely says ✅ (robust ability present). *But this clashes with your (and my) intuition that the lack of ownership/agency matters.* This principle overlooks the "whose know-how is it?" aspect.
      *   **Chess Engine:** ✅ (robust capacity). Similar to our principle.
      *   **GPS Driver:** ✅ (she *can* get there reliably using the GPS). *But this seems wrong – she lacks the core navigational know-how.* This principle conflates the ability to follow instructions with the know-how of the task itself.
      *   **"Grasp" Requirement:** Lacks the nuance of the "guidance by *own* understanding" condition, making it harder to distinguish truly internal know-how from externally scaffolded performance.

  **What Your "Guided Ability" Principle Had Right (and How it's Repaired):**

  You identified the core flaw in pure ability (paralyzed swimmer) and pure propositional (manual reader, ex-driver) views. The "guided by grasp" insight was crucial. The repair involves:

  1.  **Clarifying "Grasp":** It's a **non-propositional, embodied, practical understanding** – a set of dispositions, sensitivities, and routines *integrated* with the capacity to act. It's *how* the agent controls the action.
  2.  **Emphasizing Agency & Integration:** The understanding must belong to the agent and guide the action non-deviantly. It's not just *in* the agent, but *of* the agent.
  3.  **Focusing on Disposition (Latent or Active):** This handles the paralyzed swimmer.

  **Predictions for Your New Case & Others:**

  *   **Nonsense Phrase Performer:**
      *   *If the phrase is a genuine focus/rhythm tool:* ✅ **Knows How.** The phrase is integrated into *her own* practical routine for guiding the action (like a tennis player's grunt). She modulates it using the phrase + feedback.
      *   *If the phrase is superstitious/magical thinking:* ❌ **Doesn't Know How.** The phrase isn't functionally integrated with her understanding; it's an external crutch she *believes* is necessary. Removing it breaks performance because it disrupts her *belief*, not because it removes the actual guidance mechanism. Her "guidance" is deviant (reliant on superstition, not skill).
  *   **Instinctive Action (e.g., newborn suckling):** ❌ **Not Know-How.** While a reliable embodied disposition, it's unlearned, not adaptable, and not guided by the infant's *developed practical understanding*. It's a reflex/basic instinct.
  *   **Expert who Automatizes:** ✅ **Knows How.** Even if conscious access fades, the deeply embodied, automatized routines still constitute *their* non-propositional practical understanding guiding the action robustly and adaptively.

  **Honest Account: Overturned Verdicts and Deciding Cases**

  *   **Overturned Verdict:** The principle forces a clear verdict on the **Hypnotized Performer: ❌ Doesn't Know How.** This overturns your (and possibly your intuition's) reluctance to credit her *at all*. The principle says the capacity is there, but because it lacks integration with *her* agency and understanding, it doesn't count as *her* know-how. (The Robust Capacity competitor would say ✅).
  *   **Deciding Case:** The **Hypnotized Performer** and **GPS-Dependent Driver** are key deciders.
      *   If you strongly believe the hypnotized performer *does* know how (despite alienation), then **Robust Practical Capacity** wins.
      *   If you strongly believe the GPS driver *does not* know how to navigate (despite getting there), then **Guided Embodied Disposition** wins.
      *   The **Nonsense Phrase** case further refines it: If you think the superstitious performer loses know-how when the phrase is gone, it supports Guided Embodied Disposition (emphasizing non-deviant, integrated guidance). If you think she still knows how but just can't perform *right now*, it supports Robust Practical Capacity.

  **Conclusion:**

  The **Guided Embodied Disposition** principle best captures your pattern of intuitions. It respects the distinction between inert propositional knowledge and active skill, accommodates the paralyzed expert and the intuitive performer, explains why the ear-wiggler knows how, excludes the manual reader and GPS-slave, handles non-human agents coherently, and provides clear (if sometimes demanding) tests like the hypnotized case. Its core strength is linking know-how to *agentive control grounded in the agent's own embodied understanding*. The competitor (Robust Practical Capacity) is simpler but struggles with cases where external scaffolding or alienation of agency is central. The hypnotized performer remains the litmus test for which intuition about agency and ownership you prioritize.
