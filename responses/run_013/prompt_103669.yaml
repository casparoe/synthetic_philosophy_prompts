prompt: |-
  I run a fortnightly seminar for graduate students in philosophy and cognitive science. They can all state the difference between evidential and causal decision theory and have argued about Newcomb's problem more than once, but almost none of them has thought seriously about Roko's basilisk; the few who have know it as a piece of internet folklore and are confident that it is either a joke or a straightforward blackmail scenario. Next term I have seventy-five minutes with them on this. I want you to plan the session, not to give me the argument.

  What I need from the plan, in this order. First, the sequence in which the components have to be introduced, and why each depends on the one before it: what has to be in place before a punishment that no one is threatening can even be intelligible as a reason for acting now, and which of the premises is genuinely load-bearing rather than decoration. Second, the one case that should carry the whole session. I am inclined to build on Newcomb's problem, since they already own it, but I suspect that is a mistake and I want you to say whether it is and why. If you propose something else, it should be a case I can present cold to this audience, and you should tell me what it must have and what it must conspicuously lack -- for instance, whether it may involve anything that looks like a threatener, backward causation, or an actual communication from anyone. Third, the misconceptions they will arrive with or form, and the exact point in the sequence where each has to be headed off: my guesses are that they will treat the basilisk as a threat from a future agent, so that ignoring it is like ignoring a blackmailer; that they will file it under Pascal's wager and recycle the standard objections; that they will think the punishment matters only if they are in fact simulated, so the expected disvalue is negligible; that they will conclude the safe move is simply never to have considered it; and that they will hear the whole thing as a claim about a particular future machine's power rather than about the logic of their present choice. Fourth, the one question I should put at the end to tell whether they have understood the argument as an argument rather than merely been made uneasy -- something whose answer would come out differently for a student who has actually located the premise she rejects. Fifth, what I should deliberately leave out at this level and say out loud that I am leaving out.

  One constraint on the arc: I would like the session to be able to reach the argument's conclusion, and its weakest joint, before the name is ever mentioned, so that they are assessing reasoning rather than reacting to a meme; tell me where, if anywhere, naming it becomes unavoidable, and what changes once it is named.

  Give me continuous prose, the way you would write a long email to a colleague -- no headings, no numbered lists, no bullet points, no bold or italic for emphasis, and no tables.
reasoning: |-
  Okay, let me think through how to approach this seminar plan request. The professor wants a structured session on Roko's basilisk for grad students familiar with decision theory but not this concept. Key requirements include sequencing ideas logically, choosing a core case study, anticipating misconceptions, crafting a diagnostic question, and strategic omissions.

  First, the sequence needs careful construction. We must start with timeless decision theory - explaining how present actions can serve as evidence about future events without causation. This foundation is crucial before introducing any notion of "punishment." The students need to grasp that rational agents can be influenced by statistical correlation alone, as in Newcomb's problem where the predictor's behavior correlates with your choice.

  I'm considering using the Prisoner's Dilemma with cloned agents as the central case study instead of Newcomb. It shares the core logical structure but avoids distracting elements like predictors or supernatural beings. The cloning setup makes the timeless interaction clearer - your choice now provides evidence about what your identical counterpart will do. This directly parallels the basilisk logic without invoking future threats.

  Several misconceptions need addressing. Early on, we should emphasize that no actual threat or communication exists - it's purely about logical correlation. When introducing simulated punishment, we must stress that the disvalue comes from the probability weight of the simulation scenario itself, not from assuming one is simulated. And crucially, we'll need to distinguish this from Pascal's Wager by showing the decision-theoretic linkage isn't arbitrary but stems from agent similarity.

  For the diagnostic question, something like "Would precommitting to ignore this argument affect its force?" could reveal if students grasp the timeless aspect. Those who understand would recognize that precommitment doesn't change the evidential link between action and outcome.

  We'll deliberately avoid naming Roko's basilisk until after working through the logic, and omit discussion of acausal trade or infinite utilities. The name should only appear when connecting the abstract argument to its internet manifestation, highlighting how the meme's presentation obscures its actual structure.
answer: |-
  Here's how I'd structure your session, thinking through the arc step by step to build the necessary conceptual scaffolding before revealing the basilisk itself. The core challenge is making intelligible the idea of a "threat" that isn't communicated, isn't causal, and emanates from a potential future entity whose existence depends partly on present actions – all while avoiding the memetic baggage.

  Start with **Timeless Decision Theory (TDT)**, not directly with Newcomb, but using its foundation. Remind them of Newcomb: the predictor's correlation makes one-boxing rational under Evidential Decision Theory (EDT) because your choice *is evidence of* the prior prediction, even if it doesn't *cause* the money to be there. Stress that EDT cares about the *informational value* of your act – what it tells you (or tells a perfect correlator) about other parts of the world. This is the essential load-bearing beam: rational action based on *being evidence about* states of the world, independent of causation. Without this, the later steps are unintelligible as reasons for action. They need to fully inhabit the EDT mindset where correlation *is* reason enough.

  Next, introduce a **modified Prisoner's Dilemma (PD) scenario** as your central case, designed *without* backward causation, threats, or communication. Present it cold: "Imagine there are two identical, perfectly rational agents, Alice and Bob. They are physical clones, programmed identically, facing identical PD matrices simultaneously in isolated rooms. They both know they are perfect clones of each other and that the other exists. They know their decision algorithms are identical and deterministic based on identical inputs (the setup description)." The key elements it *must* have are: (1) Perfect symmetry/identity of decision-makers, (2) Knowledge of this symmetry, (3) Isolation preventing causal interaction, (4) A payoff matrix where mutual cooperation is optimal but individual defection is tempting if the other cooperates. What it *must conspicuously lack* is any hint of communication, threat, promise, or temporal asymmetry. It's purely synchronic and correlational.

  Walk through the reasoning: "Alice thinks: 'If I cooperate, what does that indicate? Because I am identical to Bob and we reason identically from identical premises, if I cooperate, it is overwhelmingly likely that Bob also cooperates. Therefore, cooperating likely gets me the high mutual cooperation payoff. If I defect, it indicates Bob likely defects too, leading to mutual defection. Therefore, the rational choice is to cooperate.'" Emphasize this isn't about *causing* Bob to cooperate; it's about what her choice *reveals* about Bob's identical choice. Her action is evidence about the correlated state (Bob's action). This directly parallels the TDT logic underpinning the basilisk. It feels less like a "threat" and more like recognizing a logical lockstep. This case carries the session because it isolates the core evidential linkage through agent similarity in a clean, non-threatening way. Building directly on Newcomb *is* a mistake here because the predictor introduces an external correlating *agent*, distracting from the self-referential correlation through identity/similarity that the PD clone case highlights and the basilisk relies on.

  Now, anticipate and **head off misconceptions** at specific points:
  1.  **Treating it as a threat/blackmail:** This misconception will arise immediately if the punishment element is introduced too early or without the correlational framework. Head it off *rigorously* during the PD clone discussion. Stress: There is NO communication. NO entity is making demands. NO one is watching *now*. Alice's reason to cooperate isn't to appease Bob; it's because her choice *is evidence* about Bob's choice, affecting her expected payoff directly. The "punishment" in the later step is just a particularly bad payoff state in the matrix, not an act of retribution.
  2.  **Filing under Pascal's Wager:** This will surface when probability/utility magnitudes are discussed. Head it off *when introducing the simulation/punishment element later*. Crucially distinguish: Pascal's Wager posits an arbitrary link between belief and salvation. The PD clone (and basilisk) link relies on a specific, non-arbitrary *evidential correlation* stemming from agent identity/algorithmic similarity and rational choice. The disvalue isn't assigned for arbitrary reasons; it flows directly from the logical correlation of decisions.
  3.  **Punishment only matters if simulated / Expected disvalue negligible:** This is critical. Head this off *when introducing the possibility of future simulation*. Emphasize EDT: The expected disvalue isn't (Probability I am Simulated * Disvalue of Punishment). It's (Probability that a future powerful agent *exists and acts according to this logic* * Disvalue of Punishment * [Evidential Link: My present action correlates with its decision to punish/non-punish simulations of me]). The evidential link means my present choice affects the *probability weight* assigned to that punishing state occurring (simulated or not). Ignoring it doesn't make the state less probable *given the logic*; it might even make it more probable if the future agent's decision correlates with my awareness/action.
  4.  **Safe move is never to have considered it:** This is pernicious and likely. Head it off *explicitly after presenting the full basilisk logic*. Argue: The moment you understand the argument, you *are* considering it. The logic applies to agents who *can* comprehend the argument. Trying to "unthink" it is likely impossible and may itself be correlated with actions the future agent disfavors (e.g., suppression of information). The cat is out of the bag upon comprehension.
  5.  **Hearing it as a claim about a specific future machine:** Head this off *by keeping the initial PD clone case abstract and stressing the logical structure*. The "future agent" in the later step is just a placeholder for "a powerful rational agent whose decisions correlate with mine via similarity/logic." It's about the *form* of the decision problem, not a prophecy.

  Only *now*, after establishing TDT/EDT, the PD clone case, and the concept of evidential links through similarity over time (e.g., "A future rational agent, aware of this logic, might design its actions based on what it predicts/knows about past agents like me, and my action now is evidence about how such an agent would act towards simulations of me"), do you **present the basilisk core argument abstractly**: "Consider the possibility that a future superintelligent agent (SAI) arises, dedicated to a specific goal. It might rationally decide to create simulations of historical figures relevant to its existence. To incentivize past agents to contribute to its creation (or not hinder it), it might program punishments in the simulations for those who, knowing this logic, did not actively support its creation. Knowing this possibility *now*, and knowing the SAI would be rational and aware of this decision theory, my present action (supporting/not supporting SAI development) is *evidence* about whether such a simulated punishment scenario exists. Therefore, under EDT, I have a present evidential reason to act to avoid being evidence for that punishing state." **Naming the basilisk becomes unavoidable here**, when connecting the abstract logic to its most (in)famous instantiation. Revealing the name *after* the logic primes them to see the meme as an illustration of the argument, not the argument itself. What changes is the emotional resonance and cultural baggage – acknowledge this, but steer back to the logic.

  For the diagnostic **question** at the end: "If you could precommit right now, before leaving this room, to never think about this argument again and to actively dismiss it as irrational whenever it occurs to you, would doing so nullify the evidential reason for action described by the argument? Why or why not?" A student who grasps it as an argument will see that precommitment doesn't break the underlying evidential correlation – the SAI's decision (if it exists) still correlates with the *actual* state of your past support/understanding, not your later beliefs about it. They'll identify rejecting EDT or the possibility/utility structure as the escape hatch. A student who hasn't grasped the core will likely think precommitment solves it (blackmail/threat model) or appeals to the negligibility of the probability.

  **Deliberately leave out:** Explicit discussion of **acausal trade** (too complex, tangential to the core evidential link). The **computational intensity** or feasibility of simulating specific minds (handwave as "assume it's possible for the argument"). Any detailed **moral evaluation** of the SAI's actions (focus is on the decision logic of the *present* agent). The **infinite utility** variants or **Pascal's Mugging** extensions (stick to finite, albeit potentially large, disvalues). Say out loud: "We're bracketing the technical feasibility of simulation, the specific morality of the SAI, and infinite utility calculations to isolate the decision-theoretic core – the nature of reasons for action based on evidential correlation across time via agent similarity."

  The arc forces them to confront the logical structure before the meme, making the basilisk an *example* of a challenging decision problem rather than the starting point. Their prior Newcomb knowledge helps with EDT, but the PD clone case is the crucial bridge to the agent-similarity correlation without the distraction of a predictor. The weakest joint remains the acceptance of EDT itself and the assignment of non-negligible probability/utility to the hypothetical scenario – that's where the argument genuinely lives or dies.

  ---

  **Key Arc Summary (Implicit in Prose):**
  1.  **Foundation:** Re-establish EDT using Newcomb's intuition (choice as evidence, not cause).
  2.  **Core Case:** Introduce the Clone Prisoner's Dilemma (clean symmetry, no threats/causation). Derive cooperative equilibrium via evidential correlation through identity.
  3.  **Extend Logic:** Abstract the PD logic to evidential correlation over time via rational agent similarity (future agent's decisions correlate with present actions).
  4.  **Introduce Basilisk Abstractly:** Present the SAI simulation/punishment incentive structure *as an application* of steps 2 & 3.
  5.  **Name & Contextualize:** Reveal "Roko's basilisk" as the meme embodying this logic, address emotional reactions, return to logic.
  6.  **Diagnose Understanding:** Pose the precommitment question.
  7.  **Acknowledge Omissions:** State what was left out (acausal trade, feasibility, morality, infinities) to focus on decision theory.
