prompt: |-
  I run my school's philosophy club, and next term we are hosting a Q&A with a visiting professor who holds that morality contains no principles: on her view, any feature that counts in favour of an action here may count against it, or count for nothing at all, in a slightly different situation, so that judging well is a matter of reading the particular case rather than applying a rule. I have been asked to prepare the questions, and I would like them to press the view rather than invite her to restate it; assume she is a serious philosopher, give the strongest version of each challenge, and leave out anything about how she became interested in the subject. Please draft eight to ten questions, each followed by a brief follow-up keyed to the answer she is most likely to give. Include at least one question on how her position differs from the ordinary thought that rules have exceptions, built around a concrete case in which a single feature — candour, say — appears to change its moral direction between two situations that differ only slightly; one on how anyone learns to judge well if there are no principles to be learned; one on what her view offers a person who genuinely cannot tell what to do; and one on what would count as a serious objection to her view rather than a restatement of the generalist alternative.
reasoning: |-
  Okay, the user runs a philosophy club and is preparing questions for a Q&A with a professor who denies moral principles entirely. This is a sophisticated metaethical position—radical particularism—and the user wants penetrating questions that press the view, not softballs. 

  First, I need to unpack the core of her stance: no invariant valence features, no rules even as heuristics, moral judgment as entirely situational perception. The user’s explicit asks are clear—four specific question types including a concrete valence-flip case, learning without principles, guidance in uncertainty, and what falsifies her view—but the deeper need seems to be equipping students to engage critically with radical anti-generalism. 

  For the valence-flip question, candor works as the feature because its intuitive valence (usually good) can plausibly reverse in close cases—say, brutal honesty to a grieving person vs. withholding trivial dishonesty to spare feelings. The trick is constructing scenarios so similar that generalist "exceptions" explanations feel strained. 

  The learning question must avoid letting her retreat to "principles as training wheels"—I’ll push on how novices discern relevance without any rules. For uncertainty, she’ll likely analogize to aesthetic judgment, so the follow-up should challenge whether morality permits that degree of subjectivity. 

  The falsification question is thorniest. If she denies invariant valence, what data could contradict her? I’ll propose valence constancy in microscopic variations and demand what evidence she’d accept. 

  Other angles: moral disagreement (without principles, how resolve conflicts?), demandingness (is every decision uniquely taxing?), and whether her view collapses into "anything goes" if judgment is unprincipled perception. 

  Structurally, each question needs a follow-up preempting her probable defenses. No biography—pure philosophy. Tone should be rigorous but respectful; she’s a serious scholar. Eight to ten questions total, leaning toward ten for depth. 

  … Drafting now. The candor example crystallizes the debate—must make those cases razor-close. For the "no guidance" question, pressing whether her view helps the paralyzed agent is key. And if she bites the bullet on falsification ("nothing could disprove it"), that reveals its quasi-empirical status. 

  Final list will interleave the user’s required four with other pressure points like moral progress and rule-following practices. Follow-ups are crucial—they prevent evasion.
answer: |-
  Here are ten rigorously critical questions for the visiting professor, designed to press the core claims of her radical particularism, each with a targeted follow-up anticipating her likely response:

  1.  **The Valence Flip Challenge (Concrete Case):** "You claim features like candour lack invariant valence. Consider two cases: (A) A friend asks if their terrible new haircut looks good. To spare fleeting embarrassment, you lie ("Looks great!"). (B) A partner asks if you've been unfaithful. To avoid a painful but necessary confrontation about trust, you lie ("No, never"). In both, candour is absent. Yet intuitively, the small lie in (A) seems *permissible* (even kind), while the lie in (B) seems *gravely wrong*. If the feature 'lack of candour' flips valence based on seemingly minor contextual differences (relationship depth, consequence scale), how do you explain *why* this flip occurs without invoking some latent, more fundamental principle distinguishing betrayal from white lies?"
      *   *Likely Response/Follow-up:* (If she cites "holistic context" or "relationship norms") "But doesn't invoking 'betrayal' or 'relationship norms' itself appeal to a more stable evaluative feature or rule? How is your explanation not just smuggling in a disguised principle that *does* have stable weight?"

  2.  **Beyond Simple Exceptions:** "Generalists readily agree rules have exceptions (e.g., 'Don't lie' except to save a life). How does your claim that features have *no* invariant valence differ significantly from this uncontroversial point? Isn't it just an extreme version of 'all rules have exceptions'?"
      *   *Likely Response/Follow-up:* (If she distinguishes by denying *any* stable contributory role) "So, on your view, the feature 'causing pain' isn't even *prima facie* wrong? It could contribute positively in *some* contexts? If so, can you provide a plausible scenario where causing deliberate, unnecessary pain to an innocent person *for no further good reason* is morally good or neutral? If not, doesn't this suggest *some* valence stability?"

  3.  **The Epistemology of Judgment (Learning):** "If there are no stable principles, even as defeasible guides, how does anyone *learn* to 'read the particular case' morally? What is the novice perceiving or responding to in experience that allows them to develop good judgment, if not the recognition of recurring, *generally* reason-giving features (like fairness, harm, loyalty) whose specific interplay they learn to navigate?"
      *   *Likely Response/Follow-up:* (If she analogizes to perception or skill acquisition like wine-tasting) "But recognizing a 'balanced' wine involves detecting stable features (acidity, tannins, fruit) that reliably contribute to balance. If morality lacks *any* such stable contributory elements, how is the analogy valid? What are the moral 'tannins' the novice learns to detect?"

  4.  **Guidance in Perplexity:** "Faced with a genuinely perplexing moral dilemma where the right course is opaque, what resources does your view offer the agent? The generalist might appeal to conflicting principles to explain the perplexity and seek adjudication. If there are no principles, is the particularist simply saying 'Look harder at the situation'? If so, and the agent still cannot see, is there *nothing* more to be said? Does this not render moral guidance impotent precisely when it's most needed?"
      *   *Likely Response/Follow-up:* (If she suggests seeking diverse perspectives or focusing on salient particulars) "But without *some* shared framework of potentially relevant features or values (which sound like proto-principles), how do diverse perspectives meaningfully engage? Isn't identifying 'salient particulars' already presupposing a tacit understanding of what *types* of features *might* matter?"

  5.  **Falsifiability & Serious Objections:** "What conceivable observation or argument would constitute a *serious objection* to your particularism, rather than merely restating generalism? For instance, if we could demonstrate a feature (e.g., 'torturing infants for fun') *always* counts decisively against an action in every conceivable context, would that falsify your claim that no features have invariant valence?"
      *   *Likely Response/Follow-up:* (If she denies such a case is possible or claims context could *conceivably* alter it) "If no empirical or conceptual observation could count against the claim that valence *always* depends entirely on context, doesn't this risk making particularism unfalsifiable and thus vacuous as a substantive thesis about morality?"

  6.  **Moral Disagreement & Progress:** "Without shared principles, how do we rationally resolve deep moral disagreements (e.g., capital punishment)? If both parties are simply 'reading the particular case' differently, and there's no standard beyond their perceptions, how can we argue for moral progress (e.g., rejecting slavery)? Doesn't this reduce disagreement to incompatible intuitions with no path to resolution?"
      *   *Likely Response/Follow-up:* (If she appeals to shared sensitivities or better perception) "But what constitutes 'better' perception if not a perception that more accurately tracks objective moral features or relationships? Doesn't 'better' imply a standard independent of the perception itself, which sounds like a principle?"

  7.  **The Demandingness of Perception:** "Doesn't your view place an implausible cognitive burden on agents? If every decision requires a unique, holistic, principle-free perception of the entire moral landscape without any default valences to guide attention, how is competent moral judgment possible for ordinary people making rapid decisions?"
      *   *Likely Response/Follow-up:* (If she suggests good judgment becomes intuitive/second-nature) "But doesn't this 'intuition' likely *consist* of internalized, tacit generalizations (proto-principles) formed from recognizing patterns in past cases? If not, what is the psychological mechanism enabling this reliable intuition?"

  8.  **Rule-Following Practices:** "Many core moral practices (promise-keeping, fair procedures, legal justice) seem inherently rule-based. How does particularism account for the distinctive moral force generated by *undertaking a rule* (e.g., making a promise or instituting a fair process)? Isn't the obligation here partly constituted by the rule itself, not merely the contingent features of each instance?"
      *   *Likely Response/Follow-up:* (If she reduces the force to context-specific factors like expectations or reliance) "But doesn't this fail to capture why *breaking the rule* (even without harmful consequences) feels like a distinct wrong – a betrayal of the *commitment* itself, not just bad results? Doesn't the rule *create* a new moral reason?"

  9.  **The Threat of Subjectivity/Relativism:** "If moral judgment is solely about accurately reading the unique particulars of each situation without any invariant standards, how does your view avoid collapsing into subjectivism? What prevents two agents with equally 'good perception' from arriving at contradictory judgments about the same case without either being mistaken?"
      *   *Likely Response/Follow-up:* (If she insists morality is objective, perception tracks truth) "But what *is* the objective moral truth supervening on, if not on stable features of actions, agents, and situations that *can* be generalized? If the truth is irreducibly particular, how is it objective rather than perspectival?"

  10. **Motivation and Deliberation:** "When we deliberate morally, we often weigh considerations *as if* they had general force ('This causes harm, that's bad'; 'This fulfills a promise, that's good'). If particularism is true, is this common deliberative practice fundamentally mistaken? Are we systematically misdescribing our own reasoning?"
      *   *Likely Response/Follow-up:* (If she says this practice is merely heuristic or pragmatic) "But doesn't the phenomenology suggest we genuinely experience features like harm *as* counting against an action *in that moment*? If particularism denies this experience reflects reality, doesn't it imply widespread error in our first-person moral experience?"

  These questions directly challenge the core tenets of radical particularism (no invariant valence, no principles as guides/standards, judgment as pure perception) by pressing on epistemology, guidance, disagreement, demandingness, objectivity, and the phenomenology of deliberation, while including your specified cases (candour, learning, perplexity, falsification). The follow-ups are designed to prevent easy retreats into restatement or vague appeals to "holism" or "context." Good luck with the Q&A!
