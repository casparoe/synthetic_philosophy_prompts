  Ok so I've been trying to get my head around dialetheism and paraconsistent logic and I think I've gone wrong somewhere. Here's my understanding: paraconsistent logic is the kind of logic where a contradiction doesn't let you derive every sentence (explosion fails), and dialetheism is the view that some contradictions are actually true. So my question is, does that mean a paraconsistent reasoner should just accept any contradiction as true? Like if I notice two of my beleifs clash, is the paraconsistent move to say "well, both are true then" and move on? And if contradictions are allowed, what's left to stop everything from being true — isn't blocking that exactly what paraconsistent logic was for? Lead with your bottom line in the first sentence and then give the reasoning, no preamble.
