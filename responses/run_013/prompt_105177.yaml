answer: |-
  Here is the complete list of desiderata for a theory of utility, addressing your core demand for explicit handling of edge cases and candid impossibility results. Requirements marked **N/N** are *non-negotiable* for any coherent theory; others reflect commitments of specific traditions.

  ---

  ### **Desiderata for a Theory of Utility**
  1.  **Completeness (N/N):**  
      *Requirement:* For any two outcomes/states/lotteries \(X\) and \(Y\), the theory must rank \(X \succ Y\), \(Y \succ X\), or indifference.  
      *Motivation:* Without comparability, optimization is undefined. Handles trivial choices (e.g., tea vs. coffee).  

  2.  **Transitivity (N/N):**  
      *Requirement:* If \(X \succ Y\) and \(Y \succ Z\), then \(X \succ Z\).  
      *Motivation:* Prevents money pumps and cyclic preferences that sabotage optimization.  

  3.  **Context-Independence (N/N):**  
      *Requirement:* Utility rankings must depend solely on the properties of the outcomes, not on the set of alternatives available ("menu-independence").  
      *Motivation:* Addresses **Case (b)**: Preference reversals when a third option is added. Utility must be *determinate* relative to the outcome itself, not the menu.  

  4.  **Temporal Authority:**  
      *Requirement:* The preferences of the *current self* at any time \(t\) define utility at \(t\).  
      *Motivation:* Addresses **Case (a)**: Binding future selves. If future self \(t+k\) prefers \(X\) but past self \(t\) paid to eliminate \(X\), utility at \(t+k\) is defined by \(t+k\)'s preferences. Rejects paternalism over time.  

  5.  **Identity Continuity (N/N):**  
      *Requirement:* The theory must specify a single entity ("the person") persisting through time whose welfare is maximized.  
      *Motivation:* Without a continuous subject, "lifetime welfare" is incoherent. Raises the core problem in **Case (a)**: Disagreements reveal conflicts within the extended self, not multiple agents.  

  6.  **Reflective Endorsement:**  
      *Requirement:* Utility tracks the person's *considered, all-things-considered judgment* after full reflection, not momentary desires.  
      *Motivation:* Addresses **Case (c)**: Higher-order desires (e.g., wishing not to crave nicotine) reveal true utility. Avoids privileging visceral impulses.  

  7.  **Non-Reflexivity (N/N):**  
      *Requirement:* Utility must be defined independently of the optimization system itself.  
      *Motivation:* Addresses **Case (d)**: Preferences altered by optimization. Utility cannot be *whatever the system produces*; it must be an *input*. Prevents self-referential collapse.  

  8.  **Stability Under Optimization:**  
      *Requirement:* Utility functions must be stable enough that optimizing for them doesn’t systematically undermine their own definition.  
      *Motivation:* Part of **Case (d)**: Ensures the target isn’t moving faster than optimization can track.  

  9.  **Normative Independence:**  
      *Requirement:* Utility is distinct from moral goodness or objective goods; it is agent-relative welfare.  
      *Motivation:* Clarifies scope: The system optimizes *for the person*, not for justice or perfection.  

  10. **Authenticity Over Choice:**  
      *Requirement:* Utility is what *would be endorsed* by the person under idealized reflection, not necessarily what she chooses.  
      *Motivation:* Addresses **Case (e)**: Choosing against self-interest (e.g., addiction). Utility ≠ choice when choices are akratic or impaired.  

  11. **Cardinality/Interpersonal Comparability (Contextual):**  
      *Requirement:* Must support comparisons of welfare *differences* (cardinal) or *across persons* if needed.  
      *Motivation:* Required for trade-offs (e.g., short-term pain for long-term gain).  

  ---

  ### **Explicit Handling of Cases**
  -   **(a) Binding Future Self:**  
      *Requirement:* Temporal Authority + Identity Continuity.  
      *Resolution:* Utility at \(t\) is defined by self at \(t\). Disagreement is a conflict between temporal stages of the same person.  
  -   **(b) Menu Dependence:**  
      *Requirement:* Context-Independence (N/N).  
      *Resolution:* Preference must be over outcomes alone; adding options cannot reverse rankings.  
  -   **(c) Higher-Order Desires:**  
      *Requirement:* Reflective Endorsement.  
      *Resolution:* Utility tracks the reflective, higher-order desire (e.g., to *not* crave nicotine).  
  -   **(d) Altered Preferences via Optimization:**  
      *Requirement:* Non-Reflexivity (N/N) + Stability Under Optimization.  
      *Resolution:* Utility must be defined *ex ante*; the system must avoid feedback loops that redefine utility.  
  -   **(e) Choosing Badly:**  
      *Requirement:* Authenticity Over Choice.  
      *Resolution:* Utility is what aligns with reflective endorsement, not necessarily choice.  

  ---

  ### **Impossible Pairs**
  1.  **Temporal Authority + Identity Continuity + Stability Under Optimization → *IMPOSSIBLE***  
      - If Temporal Authority holds, utility shifts with changing preferences. Optimization targeting welfare-over-time will alter preferences (e.g., by satisfying desires, changing context). This violates Stability. Identity Continuity demands a single target, but Temporal Authority makes it unstable. *Example:* System satisfies current self's desire to bind future self; future self hates it, and system now optimizes for that new preference. Welfare-over-time is incoherent.  
      - **Resolution Attempts:** Commit to a "true" self (violates Temporal Authority) or fix utility at birth (violates reflective endorsement).  

  2.  **Reflective Endorsement + Context-Independence → *IMPOSSIBLE under cognitive limits***  
      - Context-Independence requires fixed utility for outcomes. Reflective Endorsement assumes ideal reflection can overcome framing/menu effects. Real humans display menu-dependence *even upon reflection*. Forcing Context-Independence ignores human psychology; forcing Reflective Endorsement allows menu-dependence.  
      - **Resolution:** Accept procedural rationality (violates Context-Independence) or reject human data (violates operationalizability).  

  3.  **Authenticity Over Choice + Temporal Authority → *CONFLICT in akrasia***  
      - If future self chooses \(X\) but reflectively endorses \(Y\), Temporal Authority says utility=\(X\), Authenticity says utility=\(Y\). *Example:* At \(t\), self endorses health but chooses cake. Temporal Authority prioritizes choice; Authenticity prioritizes endorsement.  
      - **Resolution:** Privilege one (e.g., "sophisticated" Temporal Authority) or add hierarchy (e.g., "meta-utility" over preferences).  

  ---

  ### **Evaluation of Major Theories**
  1.  **Hedonic Theories (Utility = Pleasure/Pain):**  
      - **Fails:** Reflective Endorsement.  
      *Why:* Ignores higher-order desires (e.g., valuing dignity over pleasure). **Case (c)** is fatal: A person may prefer pain with meaning over empty pleasure.  
      - **Also Fails:** Stability (pleasure circuits adapt; optimizing pleasure alters hedonic responses).  

  2.  **Desire-Satisfaction Theories (Utility = Fulfillment of Desires):**  
      - **Fails:** Context-Independence.  
      *Why:* Desires are context-dependent (**Case (b)**). Satisfying desire \(A\) in menu \(\{A,B\}\) differs from \(\{A,B,C\}\) if \(C\) alters desire strength.  
      - **Also Fails:** Authenticity (desires can be adaptive or manipulated).  

  3.  **Revealed Preference Theories (Utility = Observed Choice):**  
      - **Fails:** Authenticity Over Choice.  
      *Why:* **Case (e)** is definitional: Choices can be self-harming. Also fails **Case (c)** (no higher-order desires) and **Case (d)** (reflexivity collapse).  
      - **Most Damning Failure:** Non-Reflexivity. If utility is *defined* by what the system produces, welfare optimization is vacuous.  

  ---

  ### **The Crucial Eliminator**
  - **Non-Reflexivity (N/N)** does the most to eliminate candidates.  
      *Why:* Any theory where utility is *constituted* by choices, desires, or experiences *shaped by the optimization process* fails. Pure revealed preference collapses immediately; desire and hedonic theories struggle with Stability. Only a theory with a *fixed, exogenous standard* (e.g., objective goods or idealized reflection) can satisfy it—but these face other impossibilities (e.g., Temporal Authority, operationalizability).  

  This landscape suggests that no theory satisfies all non-negotiable desiderata simultaneously. The core tension lies in defining a *stable, context-independent welfare metric* for a *dynamic, context-sensitive, self-reflective agent*. Systems targeting lifetime welfare must either embrace paradoxes or make contentious philosophical commitments.
