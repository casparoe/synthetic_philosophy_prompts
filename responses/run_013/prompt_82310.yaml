answer: |-
  Here's your residue report. I've run the dispute through your machine-shop vocabulary without lubrication, and the tolerances are tighter than a Swiss lathe. When metal meets biology, shavings fly.

  **Your Four Piles vs. Biology's Explanations:**

  | **Your Pile** | **Biologist's Term** | **Correspondence** | **Residue Analysis** |
  |---------------|----------------------|--------------------|----------------------|
  | **1. Does a Job** | Adaptation (Selectionist view) | ✓ Honest fit | Purpose = survival/reproduction instead of human design intent. Wear patterns ≈ selective pressure evidence. |
  | **2. Made That Way** | Developmental/Structural Constraint | ✓✓ Near-perfect fit | Your fillet ≡ their spandrel/triangular stone. Biology's "mold" is physics of development (e.g., bone growth mechanics). |
  | **3. Historical Carryover** | Phylogenetic Inertia | ✓ Honest fit | Obsolete feature = vestigial structure. Your old tooling ≡ genetic "tooling" that's costly to change. |
  | **4. Someone Wanted It** | Non-adaptive Trait (Neutral/Drift) | ⚠️ Partial fit | Biology has no "wanting" – but features can spread randomly (neutral mutations) or persist if harmless. |

  **The Nagging Spandrel Issue (Addressed Head-On):**  
  Your suspicion is correct. The triangular stones belong in **Pile 2** – but with a critical difference. In your world, the fillet exists *because the casting process demands it*. In biology, the spandrel exists *because an adaptation demanded a structural compromise*. Their triangular stone is forced by the *arch* (an adaptation), not just inert physics. This isn't a quibble – it's the crux. Biology's Pile 2 features are *byproducts of prior adaptations*, while your fillets are byproducts of *manufacturing constraints*. The difference matters: evolution stacks adaptations, creating layered constraints.

  **Residue Breakdown (Where Grinding is Needed):**

  1. **The Intentionality Problem:**  
     - **Your Vocabulary:** "Purpose" implies a designer's intent.  
     - **Biology's Reality:** "Function" = whatever historically boosted survival *on average*. No blueprint.  
     - **Residue:** When you say "a rib prevents warping," you imply a designer's solution. Biology says "ribs persisted because organisms *without* warped bones died more." Your vocabulary *can* express this, but only if you replace "intent" with "retroactive filtering by death." Smuggling occurs if you picture natural selection as a conscious engineer.  

  2. **The Scale Problem (Single Machine vs. Populations):**  
     - **Your World:** Testing = modify *this* casting, watch *it* fail.  
     - **Biology's Claim:** "Spread for no reason" = **genetic drift**. A neutral mutation drifts to fixation in a population like a loose tolerance accumulating in copied blueprints.  
     - **Translation Test:** Imagine restoring 100 identical lathes. You add a useless brass knob to one. Decades later, 95% of surviving lathes have the knob *because the factory kept copying that version*, not because it helped. Your "single machine" perspective can't see drift – it requires the machine *cemetery* of failed variants.  

  3. **Testability Problem:**  
     - **Your Method:** Remove rib → pour casting → observe warp.  
     - **Biology's Method:** "Test" via comparative anatomy (machines *without* ribs warp more), genetics (break rib gene → observe development), or fossils (ribs appear when bones face new stresses).  
     - **Residue:** Biologists *can* "build the alternative" via gene editing (e.g., remove stickleback fish armor – they die more). But deep historical claims? Like inferring why a 1910 lathe has a bronze gear – evidence is indirect (scars, wear patterns, design archives ≈ fossils, DNA, homology).  

  **The Unaccounted-For Residue:**  
  - **Exaptation:** A feature built for one job gets repurposed (e.g., drill press column used as a hammer). Biology: feathers for insulation → flight. Your piles lack this – it’s Pile 1 hijacking Pile 3.  
  - **Stochastic Bottlenecks:** A flood destroys 90% of your inventory; rare machines dominate future production. No intent, no function – just luck. Biology: founder effects. Not covered by your piles.  

  **Conclusion from the Grindings:**  
  Your vocabulary **exposes a real flaw** in lazy adaptationist storytelling. Piles 2 and 3 *are* underused in biology. But the residue reveals **two gaps in your framework:**  
  1. **The lack of a "copied junk" category** for features spread by random replication errors (drift).  
  2. **The nested dependency problem** – biological constraints aren't just inert physics; they're fossilized solutions to *past* problems.  

  The core dispute? Adaptationists overuse Pile 1. Critics scream for Piles 2 and 3. But the unresolvable tension is **language itself:** your "purpose" is anchored to design, while biology's "function" is anchored to a statistical graveyard. To think like a biologist, you must replace the *maker* with the *reaper* – the filter of cumulative corpses. If that feels alien, it should. Your vocabulary isn’t inadequate; it’s built for engineered objects, not emergent systems. The translation holds where mechanics and evolution converge on constraints and legacy – but fractures where intention meets oblivion.
