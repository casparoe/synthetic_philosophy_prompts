prompt: |-
  Hey, I'm a philosophy PhD student (social ontology / phil of social science) and I've gotten into a running argument in our game-theory reading group about where conventions stop and norms begin, and I want to nail down what I actually think before I put it in a chapter. So here's what I'd like from you: act like a philosopher who works on convention and social norms -- Lewis, Sugden, Bicchieri sort of territory -- and who has no patience for hand-waving, and work through my gut verdicts below. Start by brainstorming the two or three candidate principles that might be in play, then test each against the cases, then give me the best principle (or small set of candidates) you can state precisely, with which of my verdicts it has to throw overboard. Please don't give me a reading list or citations, I can't get online where I'm working anyway, I just want the argument.

  Here are the cases and my verdicts. Driving on the left in Britain: convention, obviously. Two hikers meeting on a narrow trail who both step to their right: convention, even though nobody taught them and it's arbitrary which side. Calling a dog a dog: convention. Everyone in my department using the back stairwell to go down and the front one to go up, which just sort of happened over the years: convention, I think. Turning off the lights when you're the last one out of the lab: not a convention, just a sensible rule. Wearing black to funerals: convention, even though it's also expressive. Tipping 20% at a US restaurant: convention -- but here's where I get uneasy, because I also feel the amount is supposed to track how good the service was, and that stiffing a genuinely bad waiter is wrong in a way that driving on the wrong side of the road definately isn't. QWERTY: not a convention, even though it's arbitrary and everyone conforms and there are alternatives -- it's just lock-in. Hemlines rising and falling: not a convention. Everyone in town taking the same shortcut because it really is the shortest route: not a convention, since it isn't arbitrary.

  The one I keep going back and forth on: a friend group where, without anyone ever deciding, the person who picked the restaurant is never the one who pays, and if a newcomer grabs the bill for their own suggestion the whole evening feels slightly off. Is that a convention? My tentative principle is roughly this -- a regularity is a convention when it's arbitrary, everyone conforms, everyone expects everyone else to conform, and each person prefers to conform conditional on the others conforming -- and I'm assuming the 'arbitrary' clause is doing all the work, since the light-switch and shortcut cases fail on it while the funeral and tipping cases pass. But tipping makes me think the 'prefers to conform' clause is wrong, since people tip out of something closer to fear or duty than preference, and the stairwell case makes me think the common-knowledge clause is too strong (I'm honestly not sure anyone else knows the others do it). So: is there a principle that gets all of these, or close? What does it say about the friend-group paying case, and about one I haven't listed -- a village where everyone uses the same well even though there's a closer one, purely because the first family to settle there used it and everyone followed along? And be honest about which of my verdicts the principle forces me to drop, and whether dropping them is a cost or a relief.
reasoning: |-
  Okay, the user is a philosophy PhD student specializing in social ontology and philosophy of social science. They're in a game-theory reading group and need to clarify the distinction between conventions and norms for a chapter. They've listed specific cases with their verdicts and a tentative principle. Let me start by understanding their examples.

  First, driving on the left in Britain is a clear convention. The hikers stepping to the right spontaneously is also convention. Calling a dog "dog" is linguistic convention. The department's stairwell usage is another convention. But turning off lights when leaving isn't convention; it's a sensible rule. Wearing black to funerals is convention despite expressiveness. Tipping 20% is tricky because it feels conventional but has normative elements. QWERTY isn't convention but lock-in. Hemlines changing aren't conventions. The shortcut isn't arbitrary, so not convention.

  Their tentative principle involves arbitrariness, conformity, expectations, and conditional preference. But tipping challenges the preference part (fear/duty), and the stairwell case challenges common knowledge. The friend-group payment case is ambiguous. The village well example is also puzzling.

  I need to identify candidate principles. Lewis's definition requires coordination equilibrium, arbitrariness, common knowledge. But arbitrariness is problematic—tipping isn't arbitrary due to service quality, yet it's conventional. Maybe arbitrariness isn't necessary? Or perhaps it's about the existence of alternatives rather than indifference. 

  Sugden's view: conventions solve coordination problems without explicit agreement. The stairwell and friend payment cases might fit as coordination even without common knowledge. Bicchieri's norms involve social expectations and sanctions. Tipping has sanctions (stiffing is wrong), which isn't present in driving side choice. 

  Possible principles: 
  1. Coordination Equilibrium Focus: Ignores arbitrariness, focuses on mutual preference for conformity given others' actions. Solves stairwell (no common knowledge needed) and friend payment. But then the shortcut would qualify, which user says isn't convention. User must drop that verdict. Also, QWERTY might count, but user excludes it as lock-in. Lock-in isn't coordination; it's path dependency without mutual preference. 

  2. Arbitrariness as Alternatives: Regularity is conventional if there's an alternative that could've solved the same coordination problem. Driving: right vs. left. Tipping: different percentages if standardized. Funeral attire: other colors possible. But the shortcut: no alternative shorter path, so not convention. Village well: alternative well exists, so convention. Friend payment: alternative (suggestor pays), so convention. Tipping's service linkage is a problem. If the percentage varies by service, it's not arbitrary. But the base expectation of tipping might be conventional, while the amount is normative. 

  3. Sanction Sensitivity: Norms involve sanctions; conventions don't. Driving wrong side gets a ticket (legal sanction?), but the wrongness is different from moral condemnation for not tipping. Stiffing a waiter is morally wrong, while driving on the wrong side is dangerous but not immoral. So conventions might have sanctions but of a different kind. Bicchieri's empirical vs. normative expectations. Tipping: both normative expectations (should tip) and sanctions. Funeral attire: normative, sanctions (disapproval). Wearing black is both conventional and normative. 

  Hybrid approach: Conventions are coordination equilibria with arbitrary alternatives. Norms add normative expectations and sanctions. Tipping: conventional baseline (20%) with normative adjustment for service. Friend payment: convention with normative element (newcomer deviation feels off). Village well: convention if alternative exists. 

  User might need to accept that some cases are borderline or hybrid. For the chapter, distinguishing pure coordination from norm-laden conventions could help. Dropping the strict arbitrariness in favor of alternatives solves stairwell, friend payment, village well. But QWERTY is out because no coordination benefit; just lock-in. Hemlines are trends, not solutions to coordination. Light switch is efficiency, not coordination. 

  Biggest cost: Accepting that tipping and funeral attire have normative elements, so not pure conventions. Relief: stairwell case fits without common knowledge. Friend payment is convention. Village well is convention. Dropping the shortcut as convention is consistent. QWERTY as lock-in excluded. Hemlines excluded. 

  Refined principle: A regularity R is a convention if (1) it's a coordination equilibrium (each prefers to conform given others do), and (2) there exists at least one alternative R' that could serve the same coordination purpose. 

  This keeps driving, hikers, language, stairwell, funeral (if we see attire as coordinating behavior), tipping baseline. Friend payment: yes. Village well: yes. Drops: light switch (not coordination), shortcut (no alternative), QWERTY (no coordination benefit, just lock-in), hemlines (not coordination). 

  Tipping's service linkage: the 20% baseline is conventional, but deviating based on service introduces norms. Similarly, funeral attire is conventional but with normative expectations. The user might need to acknowledge mixed cases. For the chapter, clarifying that conventions can acquire normative layers over time could be useful.
answer: |-
  Here's a philosopher's rigorous dissection, prioritizing conceptual precision over your intuitions. We'll build candidate principles, stress-test them against your cases, and deliver a best-fit definition with clear costs.

  **Candidate Principles (Distilling Lewis/Sugden/Bicchieri Core):**

  1.  **Coordination Equilibrium + Arbitrariness (Lewis Core):** A regularity R is a convention iff:
      *   (C1) Almost everyone conforms to R.
      *   (C2) Almost everyone expects almost everyone else to conform to R.
      *   (C3) Almost everyone prefers to conform to R *conditional on others conforming* (it's a coordination equilibrium).
      *   (C4) There exists at least one alternative regularity R' that could solve the same coordination problem, and everyone would prefer conforming to R' *conditional on others conforming to R'* (Arbitrariness).
      *   (C5) Conditions C1-C4 are common knowledge.

  2.  **Coordination Equilibrium Focus (Sugden Lean):** Drops strict arbitrariness & sometimes softens common knowledge. R is a convention iff:
      *   (C1) Almost everyone conforms to R.
      *   (C2) Almost everyone expects almost everyone else to conform to R.
      *   (C3) Almost everyone prefers to conform to R *conditional on others conforming* (coordination equilibrium).
      *   *Optional/Weaker:* General awareness exists that R solves a recurrent coordination problem.

  3.  **Rule-Based Expectation + Conditional Preference (Bicchieri Blend):** Emphasizes rules & conditional preferences over strict arbitrariness. R is a convention iff:
      *   (C1) Almost everyone conforms to R.
      *   (C2) Almost everyone *believes* almost everyone else conforms to R (empirical expectation).
      *   (C3) Almost everyone *prefers* to conform to R *conditional on their belief that others conform* (conditional preference).
      *   (C4) R is followed *because* it is seen as a rule/standard for the situation (rule-based motivation).

  **Testing Against Your Verdicts & Problem Cases:**

  *   **Driving Left (UK), Hikers Stepping Right, Calling a Dog "Dog":** All principles (1, 2, 3) easily capture these. Clear coordination, expectations, conditional preference, alternatives exist (Principle 1's C4 satisfied).
  *   **Department Stairwell:** Your unease about common knowledge is spot-on. Principle 1 (C5 Common Knowledge) likely fails. Principle 2 (Coordination Focus) captures it: people conform expecting others to, preferring their path given others' use (avoids congestion), solving a coordination problem (traffic flow). Principle 3 also captures it (empirical expectations, conditional preference, rule-following *de facto*). **Cost to Principle 1:** Must drop strict common knowledge (C5) or accept this isn't a convention (costly).
  *   **Turning Off Lights:** Fails C3 (Conditional Preference) for all principles. I prefer to turn off the lights *regardless* of what others do (it saves energy/money always). It's pure efficiency/rule. Principles correctly exclude it.
  *   **Wearing Black to Funerals:** Principles 1, 2, 3 capture it. Conformity, expectations, conditional preference (avoiding standing out/disapproval), alternatives exist (Principle 1 C4). Expressiveness doesn't negate coordination function.
  *   **Tipping 20%:** This exposes a key flaw in your tentative principle. **Fear/Duty vs. Preference:** Bicchieri (Principle 3) handles this best. The *conditional preference* (C3) isn't necessarily "I like tipping," but "I prefer to tip *given that* I believe others tip and expect me to tip, *to avoid sanctions (disapproval, guilt) or fulfill an obligation*." The baseline 20% satisfies Principle 1 (C4 Arbitrariness – 15% or 25% could have been standard) and Principle 3. The *variation* based on service quality introduces a **norm** atop the convention: the convention sets the baseline expectation (20%), the norm dictates deviation based on evaluation (sanctioning bad service by tipping less).
  *   **QWERTY:** Fails C3/C4 for all principles. I don't *prefer* to use QWERTY *because others do* (conditional preference); I use it because it's the only one I know/available, and switching costs are high. Others' use is a *precondition* for its utility (network effects), but not the *reason* for my preference to conform *given their conformity*. It's lock-in/path dependence, not a coordination equilibrium sustained by conditional preferences. Principles correctly exclude it.
  *   **Hemlines:** Fails C3 (Conditional Preference) and C4 (Rule-Based Motivation/Arbitrariness as Coordination). People follow fashion trends for complex reasons (aesthetics, signaling, identity), not *primarily* based on a conditional preference anchored to others' conformity to solve a coordination problem. Principles correctly exclude it.
  *   **Shortcut:** Fails C3 (Conditional Preference) and C4 (Arbitrariness). I prefer the shortest route *regardless* of others' actions. If others use it, fine, but I'd use it even if they didn't. No alternative coordination equilibrium exists. Principles correctly exclude it.
  *   **Friend-Group Paying (Picked Doesn't Pay):** This screams convention under Principles 2 & 3.
      *   Conformity: Check.
      *   Expectations: Check (newcomer causes unease).
      *   *Conditional Preference:* Each member prefers to follow this rule *given that others do*, as it smoothly coordinates payment, avoids awkwardness, and embodies group fairness. If others stopped following it, the preference to follow would likely vanish.
      *   *Coordination Problem:* Solved (who pays?).
      *   *Arbitrariness (Principle 1 C4):* Yes, "picker pays" or "split equally" are viable alternatives. Principle 1 would capture it if common knowledge exists (likely in a small group).
      *   *Rule-Based (Principle 3):* Clearly followed as an unspoken group rule.
      *   **Verdict:** Convention.
  *   **Village Well (Used despite closer alternative):**
      *   Principles 2 & 3 strongly suggest convention.
      *   Conformity: Check.
      *   Expectations: Check (newcomer sees others use it).
      *   *Conditional Preference:* Villagers likely prefer to use the established well *given that others do*, because it's the social focal point, ensures meeting others, maintains tradition, avoids being the odd one out. Using the closer well alone might feel socially isolating even if physically efficient.
      *   *Coordination Problem:* Implicit coordination on a social meeting point/maintaining uniformity.
      *   *Arbitrariness (Principle 1 C4):* Clear alternative (the closer well).
      *   **Verdict:** Convention.

  **The Best-Fit Principle & The Cost:**

  The **Coordination Equilibrium Focus (Principle 2)** emerges as the most robust, capturing the widest range of your intuitions while handling the problem cases effectively:

  *   **Defined:** A regularity R in a population P is a **convention** iff:
      1.  **Conformity:** (Nearly) everyone in P conforms to R.
      2.  **Empirical Expectation:** (Nearly) everyone in P believes that (nearly) everyone else in P conforms to R.
      3.  **Conditional Preference:** (Nearly) everyone in P *prefers* to conform to R *conditional on their belief that others conform to R*. (i.e., R is a coordination equilibrium).

  **What This Principle Forces You to Do & The Cost:**

  1.  **Embrace the Stairwell & Friend Payment:** This principle captures them effortlessly without needing strong common knowledge or agonizing over "arbitrariness" as a separate necessary condition. The coordination equilibrium (conditional preference) is key. *This is a relief.*
  2.  **Reclassify Tipping (Partially):** It captures the *baseline expectation of tipping ~20%* as a convention (conditional preference driven by expectations). However, it forces you to explicitly acknowledge that the *evaluative component* (stiffing bad service *feels wrong*) is a **norm** layered *on top* of the convention. The convention solves the coordination problem of "how much to tip standard service?"; the norm dictates "how *should* you adjust based on service quality?". *This is analytical clarity, not necessarily dropping your verdict, but refining it.*
  3.  **Drop "Arbitrariness" as a Necessary Condition:** This is the *major cost* to your initial intuition. Principle 2 doesn't *require* alternatives (C4). Why? The Village Well case is instructive. The *coordination value* stems from the *established focal point*, even if an objectively "better" alternative exists. The conditional preference ("I prefer to use the old well *because that's where everyone else goes*") defines it as a convention, regardless of the physical optimality of the alternative. Similarly, while alternatives *often* exist, the core mechanism is the conditional preference sustaining the coordination equilibrium. *Dropping strict arbitrariveness is a cost to your initial view, but it's necessary to capture cases like the Village Well and avoid over-exclusion.*
  4.  **Maintain Key Exclusions:** QWERTY (no conditional preference), Hemlines (no coordination problem/conditional preference), Lights (no conditional preference), Shortcut (no conditional preference) remain firmly excluded.

  **Conclusion:**

  Your core insight about conditional preference and expectations is sound. The stumbling block is over-relying on "arbitrariness" as a necessary condition. **Focus relentlessly on the Coordination Equilibrium (Conditional Preference + Empirical Expectations).** This principle:

  *   Captures all your clear convention cases (Driving, Hikers, Language, Funeral Attire, Stairwell, Friend Payment, Village Well).
  *   Captures the conventional *core* of tipping.
  *   Correctly excludes non-coordination cases (Lights, Shortcut, QWERTY, Hemlines).
  *   Forces you to identify the *normative* layer on tipping (sanctioning bad service) as distinct from its conventional baseline.
  *   Costs you the strict necessity of "arbitrariness," but gains conceptual coverage and avoids the common knowledge trap (Stairwell).

  This gives you a precise, defensible distinction: **Conventions solve coordination problems via conditional preferences sustained by empirical expectations.** Norms involve *oughts*, sanctions, and often regulate behavior beyond mere coordination. The friend-group payment case is a paradigmatic convention under this view. Now go win that argument.
