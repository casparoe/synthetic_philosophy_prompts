prompt: |-
  I'm a third-year undergraduate in a seminar on knowledge and technology, and for the past month I've been collecting my verdicts on cases of reliance on AI, in the hope that a principle would emerge from them. So far I have a tangle rather than a principle. I'd like you to tell me what principle, or small set of competing principles, best captures the verdicts below, what each implies about cases I haven't listed, and which of my verdicts I should be prepared to give up.

  My verdicts, roughly in the order I recorded them:

  1. A student obtains a proof of a theorem from a chatbot, then works through it line by line, checks each step, and a week later can reconstruct it and explain why the fourth step follows. Fine; he understands the theorem. Understanding is a state he is in, not a pedigree he has to have earned.

  2. The same student produces the same proof, glances at it, and a week later can reproduce it only by asking again, and cannot say why the fourth step follows. He does not understand it. I don't think he has necessarily done anything wrong if he never claimed otherwise.

  3. A physician orders an assay and trusts the laboratory's interpretation of it without knowing how the assay works. Fine, and not merely permitted — I don't think anyone would call this an erosion of her understanding of medicine.

  4. A patient with a persistent cough asks a chatbot, is told it is nothing to worry about, and accepts that because the chatbot said so. She has no sense of what would make the answer more or less likely to be right. Not fine, and I want the reason to be something other than that the chatbot might be wrong, since so might the physician in case 3.

  5. Someone who can no longer do long division in her head, or navigate her own city without GPS. Fine. Losing a skill is not losing an understanding.

  6. A student whose essays are drafted by a model, which she then reads and endorses sentence by sentence, defending any of them on request — but who after a year cannot write a first paragraph unaided. Bad. What puzzles me is that each essay, considered on its own, looks fine to me.

  7. A researcher who lets a model triage the literature, and after three years cannot tell a relevant paper from an irrelevant one without it. Bad.

  8. A beginner who uses a model as a tutor, asking it to slow down and re-explain until she can do the next proof on her own. Fine — better than fine.

  9. Someone who adopts a moral or political position because a model endorsed it, and would switch if the model switched. Bad, and the clearest case on the list.

  10. A cohort in which every individual passes the test of being able to check an output if asked, but in which no one ever checks unprompted, so that an error the model repeats would propagate unchallenged. I want to say something has gone wrong, yet I cannot name a single individual who fails any test I have stated.

  My tentative principle, which I already suspect is too crude: reliance on a tool is compatible with understanding when the competence it replaces remains recoverable, in the sense that the person could at some cost do the thing herself, or at least recognize and repair an error; and it erodes understanding when the reliance is opaque to her, uncheckable by her, and self-reinforcing. The physician in case 3 seems to sink this, since she cannot recover the assay competence and the process is opaque to her, yet I want to call her case fine. Whatever separates her from the patient in case 4 is therefore doing more work than my principle admits.

  The seminar handout suggested a distinction between scaffolded competence, which the learner could in principle shed, and ventriloquized competence, which she could not, along with a notion of query-depth — how many follow-up questions a person could survive before she had nothing of her own left to say. I found both useful but cannot get them to line up with cases 6 and 10.

  What I'd like from you: the principle or principles that come closest, stated precisely enough to apply; for each clause, the case in my list that motivates it; what the principle predicts for at least three further cases of your own construction that I have not considered, especially cases at the boundaries between 3 and 4 and between 6 and 8; and an honest accounting of which of my ten verdicts it cannot accommodate and what it would cost — in added complexity, or in abandoning a verdict — to save them. The case I keep going back and forth on is a colleague who drafts everything with a model, edits it heavily, understands the final product better than I understand mine, and strikes me as a sharper thinker than she was before; I want to call her case fine, but I cannot say what separates her from case 6 except degree.
reasoning: |-
  Hmm, this is a rich and nuanced philosophical inquiry about AI reliance and understanding. The user is clearly a thoughtful undergraduate wrestling with complex epistemological questions. They've collected ten diverse cases and are struggling to extract a coherent principle, which is completely understandable given the subtle variations between these scenarios.

  The user's tentative principle about "recoverable competence" shows they've done deep thinking, but they rightly identify problems with it - particularly how it fails to distinguish the physician (case 3) from the patient (case 4). I notice they're especially troubled by the boundary between case 6 (bad) and their colleague example (potentially fine), which suggests they sense something important about agency versus automation.

  What's fascinating is how these cases cluster into different categories: some involve skill atrophy (5), others concern epistemic dependence (4,9), and some touch on meta-competence (7,10). The physician case stands out because it represents institutionalized trust in expertise - a socially embedded form of reliance that's qualitatively different from individual dependence on AI.

  The seminar's "scaffolded vs ventriloquized" distinction is useful but insufficient, as the user notes. We need to consider additional dimensions: the user's meta-cognitive awareness, the reversibility of dependence, and whether the tool serves the user's cognition or replaces it. Case 10 is particularly thorny because it shows how individual competence doesn't guarantee collective wisdom.

  For new test cases, I should explore: (1) a scientist using AI for data analysis they fully comprehend conceptually but couldn't perform manually, (2) someone using translation AI while maintaining language fluency, and (3) democratic deliberation where AI generates policy options. These will probe the boundaries of "understanding."

  The colleague example is key - the editing process suggests active engagement that preserves agency, unlike case 6's passive endorsement. This points toward "cognitive integration" as crucial. Some verdicts might need revision, particularly case 3 which relies on institutional trust structures that don't exist for consumer AI.

  Ultimately, we need principles that account for: the locus of judgment, the preservation of meta-knowledge, and the tool's role as instrument versus authority. The deepest tension is between understanding as personal cognition versus socially distributed knowledge - a classic philosophical divide that AI forces us to reexamine.
answer: |-
  Based on your cases and the tensions within them, a single principle seems insufficient. Instead, **three interlocking principles** emerge, focusing on *epistemic agency*, *meta-cognitive preservation*, and *irreversible substitution*. Here's how they map to your verdicts and resolve the tensions:

  **The Three Principles:**

  1.  **The Agency Principle:** Reliance preserves understanding **if the user retains ultimate responsibility for judgment and justification**. The tool must serve as an *instrument* for the user's cognition, not as a *substitute* for their judgment. *(Motivated by Cases 4, 6, 7, 9, 10)*
  2.  **The Meta-Knowledge Principle:** Reliance preserves understanding **if the user maintains sufficient meta-knowledge to assess the tool's domain, limits, and outputs critically, enabling error detection and course correction**. This includes knowing *what* the tool is doing, *when* it might be wrong, and *how* to verify or challenge it. *(Motivated by Cases 1, 3, 4, 7, 8, 10)*
  3.  **The Irreversibility Principle:** Reliance erodes understanding **if it leads to a permanent loss of core competencies or meta-competencies necessary for independent epistemic function within the domain, making the dependence irreversible**. Skill atrophy without meta-cognitive loss is acceptable; core reasoning capacity atrophy is not. *(Motivated by Cases 5, 6, 7)*

  **Applying the Principles to Your Cases:**

  1.  **Student (Understands Proof):** Fine. **Agency:** He judges the proof sound *himself*. **Meta-Knowledge:** He understands the reasoning steps. **Irreversibility:** His mathematical reasoning capacity is intact/strengthened.
  2.  **Student (Doesn't Understand Proof):** Fine (if no claim). **Agency:** He doesn't claim understanding/judgment. **Meta-Knowledge:** He lacks domain meta-knowledge. **Irreversibility:** No significant loss occurs *because* he never integrated it.
  3.  **Physician (Lab Assay):** Fine. **Agency:** She exercises judgment *in ordering the test* and *interpreting the result clinically*. **Meta-Knowledge:** She knows *when* to order it, *what* it signifies clinically, *which* labs are reliable, and *how* results fit the clinical picture (error detection). **Irreversibility:** She never had the lab tech's skill; her core clinical reasoning is intact.
  4.  **Patient (Chatbot Diagnosis):** Not Fine. **Agency:** She delegates judgment entirely ("because the chatbot said so"). **Meta-Knowledge:** She lacks any sense of reliability factors ("no sense of what would make the answer... likely right"). **Irreversibility:** Reinforces dependence without building capacity.
  5.  **Lost Skills (Division, Navigation):** Fine. **Agency:** Judgment about *when* to use tools remains. **Meta-Knowledge:** Knows *what* the tools do and *how* to use them effectively. **Irreversibility:** Loss of specific skill (long division/navigation), not core reasoning (math/spatial reasoning) or meta-cognition.
  6.  **Student (Essay Drafting):** Bad. **Agency:** *Superficially* present (endorses sentences) but lacks *generative* agency. **Meta-Knowledge:** May understand sentences but lacks meta-knowledge of *structuring arguments* or *initiating thought*. **Irreversibility:** Loss of core competency (generative writing) and meta-competency (structuring thought) is likely permanent without intervention.
  7.  **Researcher (Literature Triage):** Bad. **Agency:** Delegates judgment on relevance. **Meta-Knowledge:** Lacks the meta-knowledge to *define relevance* or *assess triage quality* independently. **Irreversibility:** Loss of core research competency (literature review framing/assessment).
  8.  **Beginner (AI Tutor):** Fine/Better. **Agency:** Actively directs the interaction ("slow down", "re-explain") towards independent performance. **Meta-Knowledge:** Builds meta-knowledge *through* the interaction. **Irreversibility:** Designed to be temporary scaffolding; builds competence.
  9.  **Moral/Position Adoption:** Bad. **Agency:** Delegates *value judgment* entirely. **Meta-Knowledge:** Lacks independent basis for evaluating the position. **Irreversibility:** Creates dependence for core ethical/political reasoning.
  10. **Cohort (Unprompted Checking):** Something Wrong (Systemic Failure). **Agency:** *Individuals* seem to have agency *if prompted*, but the *system* lacks collective agency/critical culture. **Meta-Knowledge:** Individuals *can* check, but lack the meta-knowledge/habit to *recognize the need* autonomously. **Irreversibility:** Creates systemic vulnerability where errors compound unchallenged.

  **Predictions for New Cases:**

  1.  **Scientist & AI Analysis:** A climate scientist uses a complex AI model to analyze satellite data. She inputs parameters based on her hypothesis, understands the model's *purpose* (detecting ice melt patterns), knows its *limitations* (e.g., struggles with cloud cover artifacts), and critically evaluates the output against other data sources. *Prediction (Fine):* Strong Agency (her hypothesis, her evaluation), Strong Meta-Knowledge (domain, tool limits), No Irreversibility (core scientific reasoning intact).
  2.  **Translator & AI:** A professional translator uses AI for initial drafts of technical manuals. She meticulously checks every term and phrase for accuracy, nuance, and cultural appropriateness, often rewriting large sections. She remains fluent in both languages. *Prediction (Fine - like your colleague):* Strong Agency (final judgment is hers), Strong Meta-Knowledge (languages, translation challenges, tool quirks), No Irreversibility (core language/translation skills preserved).
  3.  **Patient & Symptom Checker:** A patient uses a reputable AI symptom checker for a minor rash. She understands it provides *possibilities*, not diagnoses. She notes factors influencing reliability (photo quality, symptom detail). She uses the output to prepare questions for her doctor, not to self-diagnose. *Prediction (Fine - Boundary of 3/4):* Agency (Uses info to engage with doctor), Meta-Knowledge (Knows it's probabilistic, knows limits, knows next step - doctor), No Irreversibility (Builds health literacy).

  **Accommodating Your Verdicts & Costs:**

  *   **Accommodates Well:** Cases 1, 2, 4, 5, 7, 8, 9 are clearly explained and justified by the principles.
  *   **Requires Nuance/Clarification:**
      *   **Case 3 (Physician):** Your principle stumbled here. The cost is acknowledging that **institutional trust and role-defined expertise** create a *different epistemic context*. The physician's meta-knowledge isn't about the assay's *mechanics*, but about its *clinical role, reliability indicators, and integration into diagnosis* (meta-knowledge principle). The lab is a *trusted epistemic institution*, not a black box *to her in her professional role*. Saving this requires adding context about socially embedded expertise.
      *   **Case 6 (Essay Student):** The principles clearly label it bad, matching your verdict. The cost is accepting that **generative agency and structural meta-knowledge** are core competencies whose loss constitutes erosion of understanding, even if sentence-level competence remains.
      *   **Case 10 (Cohort):** The principles diagnose a **systemic failure of critical culture/meta-habit** even if individuals pass atomized tests. The cost is recognizing that "understanding" has a collective dimension – a group can lack epistemic robustness even if members pass individual checks. Saving this requires expanding the scope beyond individual cognition.
  *   **Verdict You Might Need to Give Up (or Reinterpret):**
      *   **None Absolutely Must Go:** The principles can defend all your verdicts, but Case 3 requires the contextual nuance above.
  *   **Your Colleague vs. Case 6:** This is the key boundary! The principles distinguish them clearly:
      *   **Your Colleague (Editing, Understanding Better, Sharper Thinker):** Exhibits **strong Agency** (edits heavily, final judgment), builds **strong Meta-Knowledge** (understands final product *better*, becomes sharper thinker – suggests learning *from* the process, developing better meta-cognition), shows **No Irreversibility** (core generative/editing/critical thinking skills likely enhanced).
      *   **Case 6 Student (Cannot Write First Paragraph):** Lacks **generative Agency**, lacks **structural Meta-Knowledge**, suffers **Irreversibility** of core writing/thinking competencies.

  **The Core Distillation:**

  Understanding is preserved when AI reliance is **actively governed by the user's critical judgment (Agency)**, informed by **sufficient knowledge about the domain and the tool to use it discerningly and detect errors (Meta-Knowledge)**, and does **not permanently disable the user's core capacities for independent reasoning within that domain (Irreversibility)**. The physician (Case 3) works because her role, training, and institutional context provide the necessary Agency and Meta-Knowledge framework. The difference between your colleague and Case 6 lies in the presence of genuine Agency, the development of Meta-Knowledge, and the avoidance of Irreversible loss. Case 10 highlights that individual competence checks are insufficient; a healthy epistemic environment requires the *habit* of critical engagement (a meta-habit).
