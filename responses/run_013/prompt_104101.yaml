  Hmm, the core challenge is balancing philosophical depth with accessibility. The councillors think this is just a dressed-up opinion poll, while regular citizens might tune out if it gets too theoretical. And those two academics in the room will dissect any oversimplification of Dewey. Tricky.

  Let me unpack their three key Deweyan points: First, inquiry should start from genuine uncertainty - meaning this assembly can redefine the question itself. That's bold. Second, a "public" forms around shared consequences, not pre-existing interests. Perfect rebuttal to skeptical councillors without kissing up. Third, conclusions are warranted but revisable - so no grand promises about "getting it right."

  Ah, that house rule is genius! Having everyone name what could change their mind each week is pure Deweyan experimentalism. Should highlight it naturally, not like some staged "participatory democracy" exhibit.

  Noting they've criticized such exercises before - important to acknowledge that subtly. Can't come off as a sudden convert. And absolutely no "making history" grandstanding. Dewey would hate that.

  Right, structure: Start concrete - why we're here, the money, the uncertainty. Then introduce the "rewritable question" idea through the word "best." Flow into how shared problems create publics, not the other way around. Use the house rule as organic proof it's working. End with the revisability point - this is one step, not the final word.

  Language must be steel-beam strong - no decorative philosophy. "Warranted assertibility" is out, "tested conclusions" is in. Dewey gets one name-check max, only if it pulls weight. And that ending... maybe compare it to lab work? Scientists would appreciate that metaphor.

  The tone needs journalistic integrity - "I've questioned these before" keeps credibility. Local references help ground it. That house rule observation should feel like discovering an artifact already at work, not installing it for show.

  ...Wait, did I capture all constraints? Ten minutes max. No academic wincing. No losing the room. Councillors hear substance, citizens feel respected. And absolutely no historicizing - this is provisional by design. Got it.
answer: |-
  ## Opening Remarks: The Work Before Us

  [Stand at podium, make eye contact across the room – councillors, citizens, experts]

  Good morning. Welcome to the start of something unusual. For the next three Saturdays, sixty of you, chosen by lot, will grapple with a significant question: how should our city invest a substantial, fixed sum of capital for the long term – for the next thirty years? The goal, as the remit states, is the *best* use of this fund.

  Best. That’s a powerful little word. And it’s where the real work begins. Because figuring out what “best” *means* for our city, decades from now, isn’t a simple matter of ticking boxes on a list someone else prepared. We don’t start today with all the options neatly laid out, the pros and cons pre-calculated. We start with uncertainty. We start with a genuine question: What problem, what opportunity, what future need, demands this investment most urgently?

  This assembly isn’t a glorified opinion poll. It’s not about recording snap judgments or letting the loudest voices win. It’s an exercise in collective **inquiry**. Think of it like this: our city faces a complex, shared challenge – how to steward this resource for the long haul. The consequences of that decision ripple out, touching all of us, though perhaps in different ways. It’s in recognising those shared consequences – the impact this investment will have on *our* community decades down the line – that a genuine **public** forms around this issue. Not because we all agree now, but because we recognise the outcome matters to us collectively.

  So, your task isn't just to choose from a menu. It’s to *understand* the menu first. It’s to ask: Are we even asking the right question? Does “best” mean maximising economic return? Ensuring equity? Building resilience? Creating beauty? Or some complex mix unique to *our* city's needs? The engineers and economists will bring crucial evidence about *how* things might work. But you bring the crucial perspective of lived experience, diverse values, and the long-term stake you hold as residents. Your job is to wrestle with the evidence, challenge it, challenge each other respectfully, and wrestle even with the question itself.

  This won’t produce a single, irrefutable, eternal truth. How could it? We’re planning for a future we can’t fully see. What we *can* aim for is something robust: a **tested conclusion**. A recommendation forged through careful listening, questioning, weighing evidence, and considering diverse viewpoints. It will be the best answer we can reach *now*, based on the process we undertake. And like any good experiment or investigation, its conclusions are open to scrutiny and, yes, revision as circumstances change or new insights emerge. We’re building something sturdy, not carving it in stone.

  I’ve written before about the challenges of exercises like this. I know scepticism exists, including my own at times. What gives me hope here is the process itself, and the commitment embedded within it. For instance, I understand you have a house rule: at the end of each Saturday, each person names one thing that *could* change their mind. That’s not just a nice idea; it’s the engine of genuine inquiry. It signals that you’re here not to dig trenches, but to explore, to be persuaded by reason and evidence. It means listening, truly listening, especially to those who see the world differently.

  So, over these three Saturdays, embrace the uncertainty. Question the question. Interrogate the evidence. Listen hard to your neighbours. Be open to changing your mind, as the house rule invites. Your task is demanding: to cut through complexity, find common ground where it exists, respect differences where they remain, and build the most **warranted**, the most well-tested, recommendation possible for the long-term future of our shared home.

  The work begins now. Good luck with it.
