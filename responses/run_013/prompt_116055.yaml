  First, I need to unpack the key concerns. The handout claims Dennett sees the self as a "fiction" in the ordinary sense—like a novel character—entirely made up and unreal. But the user rightly notes Dennett's center of gravity analogy suggests something objective, even if abstract. The handout also equates Dennett with Parfit and Buddhism, and concludes that moral responsibility collapses under this view. The user doubts this, knowing Dennett defends compatibilism.

  Hmm, the user's confusion is spot-on. The fiction analogy is tricky—Dennett doesn't mean "unreal" like Santa Claus but rather an abstract object, like a mathematical point. The center of gravity analogy is key: it's real but dependent on the system. The user's donut example is clever—it shows centers aren't always "in" the object, which actually helps Dennett's point about selves not needing a precise location. 

  The "real patterns" reference is important—Dennett absolutely uses this term for selves, meaning they're robust explanatory constructs, not illusions. And yes, the user is correct that Dennett isn't an eliminativist; he defends moral responsibility via social and narrative practices. The handout's conclusion ignores Dennett's actual work on compatibilism. 

  The user's deeper need here is clarity for their essay. They want to push back against the handout but need authoritative backup. They might also feel uneasy challenging their professor, so I should validate their suspicions while keeping tone academic. 

  For the response: I'll walk through each handout claim, flagging oversimplifications (e.g., "fiction" without nuance), outright errors (equating with Parfit/Buddhism misses Dennett's social pragmatism), and the non-sequitur on responsibility. Crucially, I'll emphasize Dennett's positive account of responsibility as grounded in predictability and social co-ordination, not metaphysical selves. The essay conclusion collapses only if we misread Dennett as eliminativist—which he isn't. 

  Key nuance: Dennett's view *transforms* but doesn't *abolish* responsibility. The user should stress this in their essay.
answer: |-
  Here’s a careful breakdown of the handout’s claims in light of Dennett’s actual views, followed by an assessment of whether Dennett’s framework genuinely undermines moral responsibility. I’ll keep it conversational for that bus ride.

  First, the claim that Dennett thinks the self is a "fiction" in the *ordinary sense*—like a novel character, "made up, not real"—is a significant oversimplification. Dennett does call the self a fiction, but he’s precise about what he means. The "center of narrative gravity" analogy is crucial here. Just as a center of gravity is a real, objective *abstract property* of a physical system (like your boomerang example—it doesn’t need to be "inside" the object to be physically explanatory), the self is a real *pattern* abstracted from the brain’s processes. It’s not a *thing* (like a soul or Cartesian theater), but it’s not illusory like a hallucination. It’s a useful theoretical construct that reliably predicts behavior and organizes our social world. Your instinct is right: the analogy emphasizes that it’s *real but abstract*, not unreal like phlogiston. Dennett explicitly rejects eliminativism about the self—he thinks selves are "real patterns" (yes, that’s his term!) in the stream of neural activity.

  The handout’s claim that "there is no fact of the matter about personal identity over time" and that Dennett sees the split-brain case as a "verbal question" is mostly correct. Dennett *is* a reductionist like Parfit: he thinks personal identity isn’t a deep, metaphysical fact but a pragmatic, narrative achievement. If your brain were divided, there’d be two new narrative streams—two new "centers of gravity"—neither of which is *the* original you in a strict sense. But where the handout overshoots is equating this with a Buddhist "no-self" doctrine. Dennett’s view is naturalistic and Darwinian, not mystical. He’s not denying the utility or reality of the self *as a pattern*; he’s denying it’s a soul-like substance. The self is real in the way a software process is real—it’s dependent on underlying hardware but functionally autonomous.

  Now, the big claim: **does this undermine moral responsibility?** The handout says yes—blaming people rests on an illusion, and neuroscience could make selves obsolete. This is where your suspicion is dead-on. Dennett *rejects* this inference. He’s a staunch compatibilist: he argues moral responsibility doesn’t require a magical, non-physical self. Instead, it’s grounded in the *practical demands of social interaction*. We hold people responsible because they are—as "narrative centers"—predictable, reason-responsive agents whose stories interlock with ours. Punishment and blame aren’t about metaphysical guilt but about *regulating behavior* in a community of such agents. Dennett argues that even if the self is a narrative construct, it’s still *robust* enough to support our practices. In fact, he thinks acknowledging its constructed nature *strengthens* responsibility by demystifying it—we can focus on how narratives shape future behavior rather than hunting for an immaterial soul to punish. Neuroscience won’t eliminate selves because they’re not competing with neurons; they’re patterns *at a different level of description*, like software vs. hardware.

  **Where the handout goes wrong:**  
  - **"Fiction" ≠ unreal illusion.** It’s a *theoretical abstraction*, like a center of gravity.  
  - **Dennett isn’t eliminativist.** Selves are "real patterns," not fictions to discard. Neuroscience won’t "drop" selves any more than physics dropped centers of gravity.  
  - **The link to Parfit/Buddhism is reductive.** Dennett’s narrative self is more socially embedded than Parfit’s psychological continuity, and more pragmatic than Buddhist anātman.  
  - **The responsibility conclusion ignores Dennett’s actual work.** He *defends* responsibility within his framework (see *Elbow Room* and *Freedom Evolves*).  

  **So, can Dennett ground responsibility?** Yes, on his own terms. The narrative self isn’t an illusion that collapses under scrutiny—it’s the very framework that *makes* responsibility possible in a physical universe. The handout’s conclusion only follows if you misinterpret Dennett as an eliminativist, which he isn’t. A careful reading shows his view *transforms* responsibility (from a metaphysical to a pragmatic-social concept) but doesn’t destroy it. For your essay, you’ve got a strong case: the prof’s handout oversimplifies key nuances, and Dennett’s account *can* support responsibility—just not in the way traditional libertarians might want. It’s a revision, not an elimination. Good luck with the essay—your instincts about the handout were sharp!
