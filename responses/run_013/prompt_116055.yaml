prompt: |-
  I'm a third-year philosophy student and I'm in this seminar on personal identity and philosophy of mind, and last week we did Dennett on the self as a "center of narrative gravity." Before we read the original stuff the prof handed round his own one-page summary of the view, and I have to write an essay on whether Dennett's picture can ground moral responsibility, so I want to know how much of that handout I can actually lean on. Here's roughly what it says. Dennett's claim, according to the handout, is that the self is a fiction, and it means fiction in the ordinary sense -- made up, not real -- the same way a character in a novel is made up: strictly speaking there is no self, there's only a brain that spins stories about itself, and "the self" is just the name of the protagonist of those stories. Since the self is a fiction there's no fact of the matter about personal identity over time, which is why Dennett says that if your brain were divided and both halves transplanted, the question of which one is really you is empty -- a verbal question, not a factual one. The handout then says this is basically Parfit's reductionism with a literary gloss, and that it comes to the same no-self doctrine you find in Buddhism. And the conclusion: if Dennett is right, our practices of blaming and punishing people rest on an illusion, and a mature neuroscience could in principle let us drop the self the way we dropped phlogiston.

  I'm suspicious of a few bits but I can't tell if its just me being dim. For one thing I thought the whole force of the center of gravity comparison was that it's a real, objective feature of the thing -- there's a fact of the matter about where it is, it's fixed by how the mass is distributed, and it's not something we made up for convenience. My flatmate also pointed out that for a boomerang or a donut the center of mass isn't even inside the object, which made me realise I don't actually know what work the analogy is supposed to be doing, or whether Dennett thinks the self is located in the brain or not. A friend in the year above also said something about Dennett thinking selves are "real patterns", which sounds like it cuts against the handout, though I might be mixing that up with a different author. And I'm fairly sure Dennett isn't an eliminativist about the self or about responsibility -- I know he's written a lot defending compatibilism -- so that last sentence can't be quite right, or at least it can't follow the way the prof says it does.

  Could you go through the handout claim by claim and tell me what a careful reader of Dennett would accept, what they'd wince at, and what's just wrong -- and then say whether the essay conclusion the prof is pushing, that Dennett's view leaves responsibility unsupported, survives once the misreadings are cleared up? Please write it as continuous prose, no headings, no bullet points, no bold, no tables -- just explain it the way you'd say it to me in an email, since I'll be reading it on my phone on the bus.
