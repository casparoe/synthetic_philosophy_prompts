prompt: |-
  ok, longtime LW/rat-adjacent lurker here, and I've got one of those "is there a word for this" itches that's been going for like two years and I finally want to scratch it.

  Setup: I play Nomic — the game where changing the rules is itself a move, and the rulebook contains the rules about how the rulebook gets changed. Some of the starting rules are marked as protected, so you have to first pass a rule turning them into ordinary rules before you can touch them. Fine, fun, whatever.

  Here's the pattern I keep noticing, and it's not really about the game.

  A group I was in had a rule that said the rules could be changed by a vote of the mods. During a big blowup they voted to change that rule so that future rule changes need a unanimous mod vote plus 30 days notice. Someone objected: under the old rules that vote was valid, but under the new rules it wouldn't have been — so which rulebook was actually in force while the vote was happening? And the answer is there isn't one, because the only thing that says which rulebook is in force is the rulebook. Same thing in Nomic when people start passing amendments to the amendment procedure: each tightening is passed by the procedure it just made harder to use, so the fifth tightening is exactly as legitimate as the first, even though the two are nowhere near the same size in effect.

  What I'm after is the direction of it, I think. A self-governing system spending its own authority to shrink its own authority, where every step is legal under the rules as they stood at the time, and there's no outside — no court, no founder, no god — that can say "that one didn't count." Not the logical paradox of a rule referring to itself; I know that's a thing and it's not what I'm pointing at, because the paradox shows up even when nothing ratchets. And yeah, the game is literally named after the concept of rules that change rules, but "rules that change rules" is the generic case and it doesn't capture the tightening.

  Nearest things I've got, none of which fit: Ulysses contracts / precommitment, but that's one act by an agent with an outside vantage on itself, whereas here the binding is done by the very machinery being bound; "entrenchment," but that's a static property some rules just have from the start, not a process a system does to itself; and plain old self-reference, which is way too broad to be useful.

  So: does this have a name, in legal theory or systems theory or game design or wherever? If yes, tell me the term and what the cleanest example is. If no, coin one. Either way I want the edges, not just a label — is it still this thing if there IS an external authority that can veto an amendment? Does it need the ratchet, or is a single self-tightening enough? Where's the line between this and just "a bad amendment everyone regrets"? And does the founding case belong here too — the very first rulebook has to authorize its own existence somehow, or everything downstream is unauthorized, and I've never gotten that to go away. Same phenomenon or different one? I'm not after reading lists, I just want the thing carved up properly.
reasoning: |-
  Okay, the user is a long-time lurker of LessWrong and rat-adjacent communities, which suggests they're familiar with rationalist concepts and precise terminology. They're describing a specific pattern in Nomic (a game about mutable rules) and real-life governance: a self-governing system legally using its own authority to restrict its future authority, creating a legitimacy chain where each restrictive step is valid under the prior rules but would be impossible under the new ones. 

  The core tension they're highlighting is the lack of an external arbiter - the system's legitimacy is entirely self-contained, making the ratcheting process both valid and paradoxical. They've already dismissed related concepts like Ulysses contracts (external perspective missing), entrenchment (static vs dynamic), and generic self-reference (too broad). 

  What they really need is either: 
  1) A recognized term for this self-constraining ratchet effect, or 
  2) A newly coined term with clear boundaries. 

  Key distinctions they want clarified:
  - Must involve progressive tightening (ratchet property)
  - No external validation source 
  - Each step must be procedurally correct at the time
  - How it differs from regretful amendments
  - Whether constitutional founding paradoxes are the same phenomenon

  Hmm... in legal theory, "auto-entrenchment" comes close but usually implies static protection. The dynamic process they describe feels more like a "procedural ratchet." The founding paradox is related but distinct - that's about bootstrapping legitimacy, while this is about consuming it. 

  The cleanest example might be the EU's Lisbon Treaty reform: member states used existing treaty amendment rules (qualified majority) to change to unanimous consent requirements for future amendments - valid when passed but now making similar changes near-impossible. 

  Boundaries: 
  - With external veto power, it becomes delegated constraint, not pure self-binding. 
  - A single tightening instance still counts if it creates asymmetry. 
  - Unlike bad amendments, this specifically targets meta-rules (rule-changing rules). 

  Coinage suggestion: "Procedural autophagy" - self-consumption of authority pathways. But "ratcheting auto-entrenchment" might be more accessible.
answer: |-
  Your description captures a profound systems paradox that **lacks a widely recognized single term**—but let's carve it at the joints. The phenomenon is **"Self-Exhausting Authority"** or **"Procedural Autophagy"** (from *auto-* "self" + *-phagy* "eating"). Here's the anatomy:

  ### Core Definition
  **Self-Exhausting Authority (SEA)**  
  *The process by which a self-governing system uses its own authoritative procedures to iteratively constrain or eliminate those same procedures, creating a legitimacy chain where each step is valid under the immediately prior rules but would be impossible under the resulting rules.*

  ### Key Features & Boundaries
  1. **The Ratchet Requirement**  
     - A single self-binding act (e.g., a constitution requiring supermajorities for amendments) is **not SEA**.  
     - SEA requires *iterative tightening*: each restriction is enacted under rules that are *stricter than before but looser than after*.  
     - *Example:* Mods vote (simple majority) to require unanimity + 30d for future changes. Later, under unanimity, they add a public referendum requirement. Legitimacy flows from prior-state validity, but the system "eats" its flexibility.

  2. **No External Arbiter**  
     - If an external authority (e.g., a court, founder, or "meta-rule") can invalidate a step, it’s **not pure SEA**. SEA collapses when procedural legitimacy is *solely* internal and self-referential.  
     - *Boundary case:* A corporate charter requiring shareholder approval for bylaw changes has an external anchor (state law). SEA demands total procedural closure.

  3. **Distinction from Regretful Amendments**  
     - A "bad amendment" (e.g., lowering voting thresholds, later regretted) doesn’t consume authority—it expands it. SEA *reduces* the system’s capacity to self-modify.  
     - SEA is structural: it attacks *meta-rules* (rules about rule-changing), not substantive policies.

  4. **The Founding Paradox: Same Mechanism, Different Phase**  
     - The bootstrap problem ("how can Rule 1 legitimize itself?") is **related but distinct**. It’s a *static* self-reference issue (Rule 1’s authority is circular).  
     - SEA is *dynamic*: it’s the process of consuming procedural legitimacy *after* founding. Both expose self-referential fragility, but founding is a one-time event; SEA is a ratcheting process.

  ---

  ### Cleanest Examples
  1. **Your Nomic case:**  
     - Rule 101 (amended by majority vote) → Amended to require 2/3 → Later amended under 2/3 to require 3/4. Each step valid under prior rules, but the system constricts.  
  2. **Real-world analogue (Athens, 411 BCE):**  
     - Athenian democracy voted (under its standard procedures) to temporarily transfer power to the oligarchic "Four Hundred"—who then abolished the procedures that empowered them. Legitimacy flowed from the prior state, but the new rules prevented reversal.

  ---

  ### Why Existing Terms Fail
  - **Ulysses Contracts:** Involve *externalizing* enforcement (e.g., tying oneself to a mast). SEA’s enforcement is *internal*—the system binds itself *with* itself.  
  - **Entrenchment:** Static rigidity (e.g., "This clause can never be amended"). SEA is *active self-encasement*.  
  - **Self-Reference:** Too broad; includes logical loops with no ratcheting (e.g., "This rule is in force").  

  ### Proposed Terminology
  - **Primary Term:** **Self-Exhausting Authority** (emphasizes depletion of procedural power).  
  - **Alternative:** **Procedural Autophagy** (emphasizes self-consumption; useful in systems theory).  

  ### Edge Cases Resolved
  | Scenario                          | Is it SEA? | Why? |
  |-----------------------------------|------------|------|
  | Amendment requires future voter approval | No | Constraint is static, not iterative. |
  | Founders include an unamendable "eternity clause" | No | Not self-applied; imposed at inception. |
  | Legislature bans future term-limit changes | **Yes** | Self-binding via iterative authority-exhaustion. |
  | External court voids an amendment | No | Breaks procedural closure. |

  ---

  ### Why This Matters
  SEA exposes a dark flaw in fully self-contained systems: **procedural legitimacy can be weaponized to destroy proceduralism**. There’s no "meta" layer to appeal to—the only cure is external oversight (which defeats the purpose) or designing irreversible limits *at inception* (which creates the founding paradox). The deeper insight: total self-governance contains the seeds of its own rigidity. Carved cleanly enough?
