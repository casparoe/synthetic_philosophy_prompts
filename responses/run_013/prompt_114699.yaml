  **Futarchy Decision Procedure**

  **Gate 0: Decision Screening**
  - Ask: 
    1. Are there exactly two well-defined policies? (Yes/No) 
    2. Is there a single, scalar metric that can be objectively measured? (Yes/No)
    3. Is the decision solely about which policy yields a higher value of the metric? (i.e., no values disagreement) (Yes/No)
    4. Can the metric be measured within 3 months of the decision? (Yes/No)
    5. Is there no conflict of interest in measuring the metric? (Yes/No)

  - If any answer is No, stop and do not run a market. If the issue is only (3), hand off to the board for a values decision.
  - Sign-off: Analyst and Ethics Officer.

  **Gate 1: Metric and Measurement**
  - Ask:
    1. Is the metric precisely defined (formula, units, data sources)? (Yes/No)
    2. Is the measurement plan specified and independent (no conflict)? (Yes/No)
    3. Is the metric resistant to manipulation by the policies? (Yes/No)
    4. Is the metric a final outcome (or a pre-agreed proxy)? (Yes/No)

  - If any answer is No, stop.
  - Sign-off: Analyst and Ethics Officer.

  **Gate 2: Market Design**
  - The analyst designs the markets:
    - A binary market: "Will policy A be adopted by the board?" (This market pays $1 if A is adopted, $0 if B is adopted)
    - A market for the metric if policy A is adopted: Pays the actual metric value if A is adopted, $0 otherwise.
    - A market for the metric if policy B is adopted: Pays the actual metric value if B is adopted, $0 otherwise.
  - The markets run simultaneously for 1-2 weeks.
  - After closing, the analyst computes:
    - P(A) = price of binary market contract for A
    - E[metric|A] = (price of metric-A contract) / P(A)
    - E[metric|B] = (price of metric-B contract) / (1 - P(A))
  - Compare: If E[metric|A] > E[metric|B], recommend A; else, recommend B.
  - Sign-off: Analyst.

  **Gate 3: Trading Rules**
  - Define permitted traders (e.g., staff without decision authority, experts, stakeholders). Exclude board members and anyone with insider information.
  - Consider subsidies for affected stakeholders (e.g., riders) to encourage participation, but limit to a small amount.
  - Ensure anonymity and compliance with laws.
  - Sign-off: Legal Officer and Ethics Officer.

  **Gate 4: Market Operation**
  - Run the markets.
  - After close, analyst computes the result and reports to the board.
  - Board adopts the recommended policy.
  - Sign-off: Staffer, Analyst, and Board Chair (for adoption).

  **Gate 5: Review**
  - After the metric is measured (and if the market contracts require resolution), resolve the markets.
  - Compare prediction and actual.
  - Sign-off: Staffer and Analyst.

  ---

  **Note:** The requirement for timely measurement (within 3 months) in Gate 0 is added to avoid long resolution times. This is a trade-off. For longer-term metrics, we might consider using shorter-term proxies, but they must be pre-agreed as valid by the board and analysts.

  The procedure cannot handle metrics that are not measurable within a short time frame. The least-bad patch is to find a valid short-term proxy. If none exists, then futarchy is not suitable for that decision.
