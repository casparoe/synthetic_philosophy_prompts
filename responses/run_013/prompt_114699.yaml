  ### Futarchy Decision Procedure for Regional Transit Agency  
  **Goal**: Determine which policy maximizes a pre-specified metric, using prediction markets. Decisions are made based on **beliefs** (which policy yields better outcomes), while **values** (defining the metric) are set by the board.  

  **Roles & Sign-offs**:  
  - **Staffer**: Runs the procedure (no economics training needed).  
  - **Analyst**: Technical review (metrics, market design).  
  - **Ethics Officer**: Ensures no conflicts of interest.  
  - **Legal Officer**: Approves trading compliance.  
  - **Board Chair**: Final sign-off on "values" handoffs and market results.  

  **Key Gates** (Each gate must pass or the process stops):  

  ---

  #### **Gate 0: Decision Screening**  
  *Before any market setup*  
  **Question**: Is this decision suitable for futarchy?  
  **Criteria**:  
  1. **Two clear, mutually exclusive policies** (e.g., "Policy A vs. Policy B").  
  2. **One pre-registered, scalar metric** (e.g., "ridership," not "ridership + farebox recovery"). Metric must be:  
     - Quantifiable (a single number).  
     - Final (measures outcome, not process).  
     - Timely (measurable within 3 months of implementation).  
  3. **Values alignment**: The board agrees the metric captures all material trade-offs (e.g., no hidden ethical/equity concerns).  
  4. **No irreversibility risks**: Policy cost ≤ $X (set by board; e.g., $50M) and no safety/legal red flags.  
  **Sufficient answer**: All criteria met.  
  **Stop if**:  
  - Metrics conflict (e.g., two numbers that can’t be combined).  
  - Metric measurement >3 months away.  
  - Values disagreement (e.g., metric ignores equity).  
  - Policy violates ethics/law.  
  **Handoff to board if**: Values debate (e.g., "Is employment more important than poverty reduction?").  
  **Sign-off**: Analyst (metrics), Ethics Officer (conflicts), Board Chair (values).  
  **Time**: 1 day.  

  ---

  #### **Gate 1: Metric Validation**  
  *Ensures the metric is trustworthy*  
  **Question**: Can we measure the metric objectively?  
  **Criteria**:  
  1. **Definition**: Metric is unambiguously defined (e.g., "on-time performance = % of buses ≤5 mins late").  
  2. **Measurement plan**: Specifies who measures it, when, and data sources.  
  3. **No conflicts**: Measurer is independent (e.g., not a contractor hired by the policy).  
  4. **Non-manipulable**: Policy can’t artificially inflate the metric (e.g., "ridership" is audited).  
  **Sufficient answer**: All criteria met.  
  **Stop if**:  
  - Conflict of interest (e.g., vendor self-reports performance).  
  - Metric can be gamed (e.g., "employment" defined as 1 hour/week).  
  **Sign-off**: Analyst, Ethics Officer.  
  **Time**: 1 day.  

  ---

  #### **Gate 2: Market Design**  
  *Prevents misinterpreting market outputs*  
  **Question**: Will the market correctly predict the metric’s expected value?  
  **Criteria**:  
  1. **Market structure**:  
     - **Binary market**: "Probability policy A is adopted" (pays $1 if adopted).  
     - **Conditional markets**:  
       - Contract A: Pays **metric value if A is adopted**, else $0.  
       - Contract B: Pays **metric value if B is adopted**, else $0.  
  2. **Decision rule**:  
     - Expected value of metric under A = (Price of Contract A) / (Price of Binary A).  
     - Expected value under B = (Price of Contract B) / (1 − Price of Binary A).  
     - Choose policy with higher expected value.  
  3. **Duration**: Markets run 5–7 days.  
  **Sufficient answer**: Structure isolates conditional expectations (no probability contamination).  
  **Stop if**: Metric units are incompatible with payments (e.g., "customer satisfaction" isn’t monetizable).  
  **Sign-off**: Analyst.  
  **Time**: 2 days.  

  ---

  #### **Gate 3: Trading Rules**  
  *Ensures fair, compliant markets*  
  **Question**: Who trades, and are incentives aligned?  
  **Criteria**:  
  1. **Traders**: Agency staff (non-decision-making), external experts, affected stakeholders (e.g., riders).  
     - Excluded: Board members, policy designers, contractors.  
  2. **Subsidies**: Stakeholders affected by the policy (e.g., riders in fare decisions) get a $50–$100 trading credit.  
  3. **Anonymity**: All trades anonymous to prevent coercion.  
  4. **Compliance**: Markets are not gambling (legal opinion secured).  
  **Sufficient answer**: Trader list finalized, subsidies approved.  
  **Stop if**: Legal/ethical risks (e.g., insider trading).  
  **Sign-off**: Legal Officer, Ethics Officer.  
  **Time**: 1 day.  

  ---

  #### **Gate 4: Market Execution**  
  *Runs the market and implements the result*  
  **Steps**:  
  1. Open markets for 5–7 days.  
  2. At close, Analyst calculates expected values using the Gate 2 formula.  
  3. Staffer reports winning policy to the board.  
  **Board override allowed only if**:  
  - Metric measurement fails (e.g., data corruption).  
  - New values conflict emerge (e.g., safety risk).  
  **Sign-off**: Analyst (calculations), Board Chair (implementation).  
  **Time**: 1 week (including market runtime).  

  ---

  ### **Test Cases**  
  #### **Case 1: Raise fares 15% (A) vs. Hold fares and cut weekend service (B)**  
  **Metric**: Ridership + Farebox recovery.  
  - **Gate 0**: **Stop**. Metric is not scalar (ridership in trips + farebox in dollars → incompatible units).  
  - **Result**: Do not run. Hand to board for re-scoping (e.g., define a single metric like "total revenue").  

  #### **Case 2: Vendor A vs. B for scheduling system**  
  **Metric**: On-time performance (OTP) in 18 months.  
  - **Gate 0**: **Stop**. Metric violates timeliness (>3 months to measure).  
  - **Result**: Do not run. Use a proxy metric (e.g., "OTP in 3 months" or "implementation errors").  

  #### **Case 3: Guaranteed-income pilot (A) vs. Status quo (B)**  
  **Metric**: Employment among participants in 1 year.  
  - **Gate 0**: **Pass**. Policies and metric are clear.  
  - **Gate 1**: **Stop**. Employment measurement in 1 year violates timeliness (>3 months).  
  - **Result**: Do not run. You (the user) are attached to this, but the procedure blocks it.  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Validate the metric itself**:  
     - The procedure assumes the board’s metric reflects "value." It can’t detect misaligned metrics (e.g., "employment" misses poverty effects).  
     - **Least-bad patch**: At Gate 0, require the board to document why the metric captures all key values. If debate arises, hand off immediately.  

  2. **Handle long-term outcomes**:  
     - Metrics >3 months away are excluded to avoid delayed resolution and liquidity issues.  
     - **Patch**: Use leading indicators (e.g., "job applications" instead of "employment").  

  3. **Prevent all conflicts**:  
     - Subtle conflicts (e.g., a stakeholder group dominating trading) may slip through.  
     - **Patch**: Caps on individual trading volumes.  

  4. **Fix thin markets**:  
     - If too few traders, markets may be unreliable.  
     - **Patch**: Minimum trader threshold (e.g., 50+ participants); else, cancel.  

  **Final Output**: A policy decision backed by aggregated beliefs, or a clear handoff to the board for values debates. Total runtime: 1–2 weeks.  

  ---  
  **Why this works**:  
  - **No economics training needed**: Staffer follows checklists, Analyst handles math.  
  - **Avoids past errors**: Isolates conditional expectations (fare mistake), bans conflicted metrics (depot mistake).  
  - **Board retains values role**: Overrides only in defined edge cases.  
  - **Scalable**: 5 gates, 3–5 decisions/year.
