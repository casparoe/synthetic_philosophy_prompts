          *   Instead, line 13 introduces a completely new line ("She has no map, just work to do.") where the rule demands a repetition of the previous stanza's line 12.
          *   Line 14 *then* correctly repeats line 14 of stanza 3 ("A blocked path? She'll tunnel through.").
          *   This break occurs precisely where the rigid pattern demands repetition, mirroring the "hiccup" of the nudged cricket disrupting the wasp's expected sequence.
  3.  **Adaptability:** Incorporated in Stanza 3: "A wrecked main shaft? She digs anew." and "A blocked path? She'll tunnel through." Shows improvisation within the larger behavioral framework.
  4.  **Scientific Doubt:** Incorporated in Stanza 4: "Some argue there's a purpose here, / this ritual beyond our ken." Acknowledges the debate without resolving it or tipping into anthropomorphized freedom.
  5.  **Robot Vacuum Analogy:** Explicitly used in Stanza 4: "This vacuum starts the flat again." Directly references the reset behavior.
  6.  **Tone & Language:**
      *   Avoids cute/heroic wasp imagery ("precise," "work to do," "ritual").
      *   Focuses on action and mechanism ("drags," "reached," "leaves," "enters," "digs," "tunnel," "starts").
      *   Near-rhyme used where needed (ken/home, deep/sleep, inside/aside, anew/through).
