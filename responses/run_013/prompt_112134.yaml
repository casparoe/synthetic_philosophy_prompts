  7.  **The Loop:** The final quatrain brings back the opening line ("She drags the paralyzed cricket home."), completing the loop just as the rule demands, emphasizing the sphexishness. The break exists *within* this larger loop structure.
  8.  **Ambiguity of the Break:** The broken line ("She has no map, just work to do.") sits jarringly within the expected pattern. Is this a flicker of genuine, unscripted purpose ("just work to do") breaking through the ritual? Or is it merely another hiccup in the mechanism, a glitch in the programming ("no map") that doesn't fundamentally alter the loop? The poem holds both interpretations without tipping the scales. Like the nudged cricket, it's a disruption whose ultimate meaning (free act or built-in malfunction?) remains unresolved.
