  For convergence status: merging means predictions eventually match truth, but says nothing about short-term preferences. Occam's razor is typically invoked when choosing between hypotheses with current data. Solomonoff induction might favor a slightly longer program that fits noise perfectly over a truly simpler one early on. This misses the normative core of preferring simplicity now.

