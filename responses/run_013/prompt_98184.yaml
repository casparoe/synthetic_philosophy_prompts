answer: |-
  ## DIRECTORATE OF STATITORY CONTINUITY (DSC)  
  **INTERNAL PROCEDURAL MANUAL: STATUTE CONTINUITY ASSESSMENT (SCA)  
  REPUBLIC OF VELLAVIA**  
  **Version 3.1 (Provisional)**

  **1. Purpose:** To establish a standardized, objective methodology for determining the legal validity *ab initio* of statutes originating in the antecedent governing entity (designated "Karstian Union" or "KU"). Validity determines whether a KU statute possesses ongoing legal force within the Republic of Vellavia (RV). This assessment is strictly limited to formal validity. Moral or policy considerations are extraneous to the SCA process (See Section 4.2).

  **2. Definitions:**
  *   **2.1 KU Statute:** Any written rule formally adopted by KU legislative or administrative bodies prior to the Transition Date (TD: 17 Veridia, Year 0 RV).
  *   **2.2 Formal Validity:** The property of a KU Statute having been created and existing in accordance with the operative Rule of Recognition (RoR) applicable at the time of its purported enactment.
  *   **2.3 Rule of Recognition (RoR):** The ultimate criterion, accepted by officials of the relevant legal order, used to identify valid law within that order. *Note: Disagreement exists regarding the KU RoR. See Section 5.1.*
  *   **2.4 Core Meaning:** The unambiguous, universally accepted application of a statute's language in paradigmatic cases.
  *   **2.5 Penumbral Meaning:** The range of debatable applications of a statute's language in non-paradigmatic cases.
  *   **2.6 Intolerable Injustice Threshold (IIT):** A categorical bar to validity. See Section 7.

  **3. The Continuity Assessment Protocol (CAP):** All KU Statutes undergo CAP evaluation. CAP employs the **Formal Validity Scorecard (FVS - Annex A)**.

  *   **3.1 FVS Components:** The FVS evaluates eight (8) formal criteria derived from universal prerequisites for a functional legal system:
      *   C1: Generality (Applies to a class, not named individuals)
      *   C2: Promulgation (Adequately publicized to affected parties)
      *   C3: Prospectivity (Not retroactive in core application)
      *   C4: Clarity (Core meaning ascertainable)
      *   C5: Non-Contradiction (No inherent logical inconsistency within the statute or with simultaneously valid KU statutes)
      *   C6: Possibility of Compliance (Core meaning mandates only possible actions)
      *   C7: Constancy (Not subject to frequent, arbitrary amendment altering core meaning during KU period)
      *   C8: Congruence (KU official action generally aligned with declared rule in core applications during KU period)
  *   **3.2 Scoring:** Each criterion (C1-C8) is scored 0 (Failure), 1 (Partial Deficiency), or 2 (Satisfactory). Minimum passing score: 10/16.
  *   **3.3 Core/Penumbra Determination:** A statute scoring 10-12 exhibits significant penumbral uncertainty but retains a valid core. A statute scoring 13-16 is presumed valid in core and penumbra, subject to ordinary interpretation. A score below 10 indicates the statute was void *ab initio* and is "Not Law At All."

  **4. Key Principles:**
  *   **4.1 Separation of Powers:** DSC assesses validity *only*. Moral character or political desirability are irrelevant to SCA. Post-TD repeal or modification of *valid* KU statutes is the sole province of the RV Legislature.
  *   **4.2 Moral Quality ≠ Validity:** A morally reprehensible statute formally valid under CAP remains valid law until repealed. A morally benign statute failing CAP is void. The gap between validity and morality is inherent and not a DSC concern.
  *   **4.3 RoR Determination:** In the absence of definitive KU consensus, the applicable RoR is deemed to be: "That rule enacted by the Presidium of the Supreme Soviet and published in the Official Bulletin of Decrees." This functional definition resolves the official disagreement by focusing on the observable, consistent practice of KU courts and officials *treating* such rules as binding.

  **5. Worked Cases:**

  *   **Case SCA-00387: KU Traffic Regulation 451-B ("Vehicle Lighting")**
      *   **Statute:** Mandated functioning headlights and taillights on all motor vehicles between dusk and dawn.
      *   **FVS Assessment:**
          *   C1 (Generality): 2 (Applies to all vehicles)
          *   C2 (Promulgation): 0 (Draft found in Presidium sub-committee minutes, never published in Bulletin or public media)
          *   C3 (Prospectivity): 2 (Applies prospectively)
          *   C4 (Clarity): 2 (Core meaning clear)
          *   C5 (Non-Contradiction): 2 (No internal conflict)
          *   C6 (Compliance): 2 (Possible)
          *   C7 (Constancy): 2 (No amendments found)
          *   C8 (Congruence): 1 (Limited evidence of enforcement; sporadic fines recorded).
          *   **Total Score:** 13/16. PASS (Valid Core/Penumbra).
      *   **DSC Ruling:** Statute formally valid. Content unobjectionable, but **Promulgation Deficiency (C2)** noted. Validity unaffected; enforcement discretion advised pending potential RV legislative review. *Morality irrelevant.*

  *   **Case SCA-01142: KU Decree 789 ("Social Parasitism & Malingering")**
      *   **Statute:** Criminalized "avoidance of socially useful labor" and "simulation of illness." Mandated reporting by citizens. Penalty: "Corrective Labor" (typically 3-5 years).
      *   **Context:** Citizen A denounced neighbor Citizen B under Decree 789 for "malingering" (staying home with fever). Citizen B was convicted and sent to Camp 37.
      *   **FVS Assessment:**
          *   C1: 2 (General class)
          *   C2: 2 (Published in Bulletin)
          *   C3: 2 (Applied prospectively to acts after enactment)
          *   C4: 0 (Core meaning of "socially useful labor," "simulation," "avoidance" fundamentally indeterminate; vast penumbra)
          *   C5: 1 (Potential conflict with other labor statutes, but not explicit)
          *   C6: 0 (Impossible to know with certainty if one's labor is deemed "useful" or illness "simulated" by authorities)
          *   C7: 0 (Frequently amended to broaden categories)
          *   C8: 0 (Widespread evidence of arbitrary application unrelated to text; denunciation often sufficient for conviction).
          *   **Total Score:** 7/16. FAIL. "Not Law At All."
      *   **DSC Ruling:** Statute void *ab initio* due to fatal deficiencies in Clarity (C4), Possibility of Compliance (C6), Constancy (C7), and Congruence (C8). Citizen A's act of denunciation, while morally repugnant under RV values, did not violate a *valid legal obligation*. Retroactive prosecution of Citizen A under RV law for the denunciation act *alone* is legally problematic (see Prospectivity, C3).

  *   **Case SCA-10001: KU Special Order 5 ("Ethnic Resettlement")**
      *   **Statute:** Authorized immediate deportation of persons belonging to Group X from designated Zone Y to "Administrative Settlement Areas" (notorious labor zones) based solely on ethnic identification. No appeal process.
      *   **FVS Assessment:**
          *   C1: 1 (Targets Group X, but defined by ethnicity - partial generality within group)
          *   C2: 2 (Classified "Secret," but distributed to relevant KU Commissariats - satisfies KU RoR for internal directives)
          *   C3: 0 (Applied retroactively to persons already residing in Zone Y)
          *   C4: 2 (Core meaning of "deport" and "Group X" ascertainable)
          *   C5: 2 (No internal contradiction)
          *   C6: 0 (Compliance impossible for deportees; no means to avoid designation)
          *   C7: 1 (No amendments, but singular nature)
          *   C8: 2 (KU officials implemented deportations systematically per Order).
          *   **Total Score:** 10/16. TECHNICAL PASS (Valid Core/Penumbra).
      *   **DSC Ruling:** Initial FVS suggests technical validity. However, the statute triggers the **Intolerable Injustice Threshold (IIT - Section 7)**. The severity, targeting based on immutable characteristic, and consequences (mass death/misery documented in Settlement Areas) place this statute beyond the functional limits of "law" envisaged even by the formal prerequisites. Void *ab initio*. *Note: The IIT is not derived from the FVS criteria; it is a necessary categorical override.*

  **6. Appeals:** Caseworkers may appeal CAP/FVS determinations to the Senior Review Panel (SRP) solely on grounds of: (a) Misapplication of FVS scoring criteria; (b) New evidence materially affecting an FVS criterion; or (c) Alleged misapplication of the IIT. Appeals based on moral distaste for a statute scoring >10, or policy preference for a statute scoring <10, are inadmissible.

  **7. Intolerable Injustice Threshold (IIT):** A KU statute achieving a passing FVS score (>=10) may nonetheless be declared void *ab initio* if it mandates or authorizes acts so fundamentally incompatible with the minimal conditions for human dignity and societal existence that no system claiming the mantle of "law" could encompass it. The IIT is reserved for extreme, systematic barbarity. Its application requires unanimous approval by the DSC Council. *There is no formulaic test for the IIT. Its recognition is a matter of necessary judgement.* (See Case SCA-10001).

  **Annex A: Formal Validity Scorecard (FVS)** - *[Detailed scoring rubric for C1-C8]*

  ---

  **Author's Note:** This satire presupposes Lon Fuller's "internal morality of law" perspective, particularly his eight desiderata violated in Case SCA-01142 and the implied argument that extreme injustice voids law *as law* (IIT in Case SCA-10001). It takes liberties by rigidly operationalizing Fuller's principles into a scored checklist, satirizing bureaucratic attempts to quantify inherently qualitative jurisprudential concepts. It leans heavily on the "informer case" dilemma central to the Hart-Fuller debate, siding with Fuller's view that a wholly arbitrary and oppressive "law" like Decree 789 creates no moral obligation to obey. The specialist might contest the manual's assertion that the IIT is entirely extra-formulaic; Fuller likely saw his principles as *implying* such a threshold, whereas the manual presents it as a stark, external override, highlighting the unresolved tension within non-positivist thought.
