answer: |-
  Here’s a battle-tested Q&A prep sheet, prioritizing high-likelihood/high-damage objections. I’ve distilled each into the strongest form, phrased in the objector’s idiom, with concise replies, soft spots, strategic concessions, and nightmare questions.

  ---

  ### **Q&A Prep Sheet: Prioritized Objections & Replies**

  #### **1. Objection (Stanley/Williamson Loyalist): Linguistic Incompleteness**  
  *"You claim PMP adds nothing explanatory because it's 'individuated by the ability.' But PMP isn't *defined* by the ability; it's a genuine linguistic component that *explains* how the same proposition (e.g., 'that w is a way to ride a bike') can be accessed in action-contexts without collapsing into dispositionalism. Your dismissal ignores the syntax/semantics interface Stanley & Williamson established."*  
  **Reply (2 min):** "I agree PMP is a real linguistic feature *in the ascription* 'S knows how to φ.' But its *explanatory role* for skill etiology is circular: we’re told PMP allows propositional knowledge to guide action, yet PMP is itself individuated by S’s ability to φ (via the practical mode’s conceptual role). So while PMP distinguishes 'knows how' from 'knows that' linguistically, it borrows its content from the ability it’s meant to explain — it doesn’t *add* independent causal structure."  
  **Soft Spot:** Needs deeper engagement with *how* PMP avoids circularity in S&W’s semantics.  
  **Concede Up Front:** "PMP is indeed syntactically real and avoids reducing 'knows how' to 'knows that.'"  
  **Nightmare Follow-up:** *"If PMP is circular for etiology, why isn't *any* conceptual role (e.g., in functionalist theories) equally circular?"*

  #### **2. Objection (Cognitive Scientist): Empirical Vacuum**  
  *"Your thesis 'separates' ascription from etiology, but skilled action is studied in labs. If representations don't guide performance (as Dreyfusians claim), we see no transfer between similar skills (e.g., tennis vs. squash) and choking under focal attention. If your deflationism is right, what specific predictions does it make about these phenomena? Or is it just armchair tidying?"*  
  **Reply (2 min):** "It predicts that *framing* these debates changes: asking 'Does skill X involve representations?' isn’t settled by analyzing 'knows how.' Etiological questions (e.g., 'Is automaticity representational?') stand alone. My claim *enables* clearer experiments: e.g., if S&W-style propositions *were* guiding action, we’d expect verbalizable knowledge to correlate with performance flexibility — which it often doesn’t (e.g., expert musicians). The 'degradation under attention' effect challenges *any* strong intellectualism."  
  **Soft Spot:** Doesn’t offer novel empirical hypotheses; reframes existing debates.  
  **Concede Up Front:** "This paper doesn’t propose a new model of skill etiology — it clarifies why linguistic disputes won’t answer yours."  
  **Nightmare Follow-up:** *"Name one experiment where your 'separation' resolves an actual ambiguity in motor control research."*

  #### **3. Objection (Chair): Deflationary Pointlessness**  
  *"You call this a 'verbal dispute,' but if both sides agree a) 'knows how' ascribes *something* distinct, and b) skills can be automated/non-representational, why does unmasking the conflation matter? Isn’t this just pedantry that ignores the substantive progress on (b)?"*  
  **Reply (2 min):** "Because the conflation *distorts* progress. Intellectualists argue from linguistic data (e.g., embedding under 'how') that skills *must* be representational — but this is a non sequitur if 'knows how' ascription doesn’t entail etiology. Dreyfusians then waste effort refuting linguistic theses. By decoupling, we free philosophers to engage directly with cognitive science (e.g., 'guided' vs. 'automatic' processes) without linguistic proxy wars."  
  **Soft Spot:** Risks seeming like meta-philosophical nitpicking if substantive debates are already advancing.  
  **Concede Up Front:** "Substantive debates on automation *are* progressing — but they’re still hampered by appeals to 'what know-how means.'"  
  **Nightmare Follow-up:** *"Give an example of a *published* argument where this conflation directly misled research."*

  #### **4. Objection (Phenomenologist / Dreyfusian): Linguistic Detachment**  
  *"Why grant 'knows how' ascription *any* relevance? Skill is embodied coping, prior to language. By entertaining Stanley’s linguistic games, you’re complicit in intellectualism’s error: privileging abstract reflection over pre-reflective experience. Your 'deflation' still centers language!"*  
  **Reply (2 min):** "I agree that skill etiology is often non-linguistic and non-propositional. But we *use* 'knows how' in everyday and theoretical discourse (e.g., 'the nurse knows how to inject'). We need to understand what we’re *doing* with that phrase without conflating it with how skills work. Granting linguistic interest isn’t endorsing intellectualism — it’s demystifying its leverage. My goal is to *protect* embodied accounts from being dismissed on linguistic grounds."  
  **Soft Spot:** May appear to validate linguistic analysis as "first step" — anathema to radical Dreyfusians.  
  **Concede Up Front:** "Heidegger/Dreyfus are right that expertise transcends propositional articulation."  
  **Nightmare Follow-up:** *"If skill is pre-linguistic, why not reject *all* linguistic analysis of know-how as reification?"*

  #### **5. Objection (S&W Loyalist #2): Misreading Practical Modes**  
  *"PMPs *aren’t* individuated by abilities; they’re de re modes tied to ways of acting. When I learn *a new way* to φ (e.g., a new tennis grip), I gain a new PMP without a new ability — I’m just *applying* existing ability. Your 'circularity' charge ignores this."*  
  **Reply (2 min):** "But to grasp a PMP — to understand *that this way* is how to φ — requires the ability to *recognize or execute* that way. If you lack the ability, you can’t possess the PMP (e.g., a novice can’t grasp the PMP for a pro’s tennis technique). S&W concede PMPs are 'distinctive to the possessor of the ability.' This dependency makes PMPs etiologically inert."  
  **Soft Spot:** S&W *do* claim PMPs can be acquired via testimony (weakly).  
  **Concede Up Front:** "Fine: one *can* acquire PMPs for *novel* ways within existing abilities."  
  **Nightmare Follow-up:** *"How does your view account for knowing how to φ in *multiple* ways without multiple abilities?"*

  ---

  ### **Strategic Summary**
  - **Prioritize:** S&W objections first (they’re technical and can derail you), then Cognitive Scientist (empirical stakes elevate the discussion), then Chair (sets up broader relevance), then Dreyfusians (their objection is more meta).
  - **Concede Early:** Linguistic data matters (to S&W); embodiment is primary (to Dreyfusians); deflation needs payoff (to Chair).
  - **Biggest Risk:** The **Cognitive Scientist’s demand for empirical predictions**. Have 1–2 concrete examples ready (e.g., "My view predicts that debates over 'mirror neuron representational content' are independent of whether we *say* a monkey 'knows how' to grasp").
  - **Nightmare Unasked Question:** *"If PMP is circular, what *positively explains* how propositional knowledge guides action? Or is all guidance non-propositional?"*  
    **If Forced:** "Guidance likely involves dynamic, sub-personal computations — which may *implement* propositions or not. But that’s an etiological, not ascriptive, question."

  **Final Tip:** When pressed, pivot to: "This conflation isn’t just philosophical noise — it lets intellectualists claim empirical ground from linguistics, and Dreyfusians dismiss linguistics entirely. Clarifying it helps both sides." Good luck!
