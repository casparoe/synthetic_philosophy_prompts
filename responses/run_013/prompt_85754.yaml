     - Did low-quality start sending costly? (probably yes, because 4-2=2>0)
     - Then what did receivers do? 
          If they still rewarded costly, they sometimes got 10 (if high) and sometimes -5 (if low). So overall, if there are half high and half low, they get (10-5)/2 = 2.5 on average? But they might have started sometimes not rewarding? 
          Then the high-quality, if they sent costly and were not rewarded, they got -2. If they sent cheap and were not rewarded, they got 0. So they might switch to cheap? 
          Then the receivers, if they see costly, it might be only low? Then they shouldn't reward? 

     We might have ended up in a situation where no one sends costly? Or where both types send cheap? 

     So the signal broke down because the cost was too low for low-quality to be deterred.

  3. The margin: 
     - What cost would have been just enough to prevent low-quality from sending costly? 
          They send costly only if (4 - c) > 0? Or if (4-c) > what they get by sending cheap? 
          In block1, by sending cheap they got 0 (because they weren't rewarded). So if 4-c <=0, they won't send costly. 
          So at c=4, 4-4=0 -> they are indifferent. 
          At c>4, they won't.

     But note: if the receiver sometimes rewards cheap signals? Then they might get 4 by sending cheap? Then they would only send costly if 4-c > 4? Which is impossible. So the separating equilibrium requires that the receiver does not reward cheap signals. 

     So the margin depends on the receiver behavior.

  4. The receiver's role: 
     - Why did the receiver reward the costly signal in block1? Because they learned that it meant high quality. But also, their payoff structure (10 for high, -5 for low) made them want to reward only high. 
     - In biology, the receiver (peahen) has a preference for long tails because long tails are correlated with high quality. But how did that preference evolve? It's a co-evolution: the preference and the signal. 

     The game papered over the evolution of the receiver's preference. We fixed it. In reality, the preference must also be under selection: if a peahen has a preference for long tails and that leads her to mate with high-quality males, then her sons will have long tails (if the genes are passed) and her daughters will have the preference. But if the signal breaks down (like in block2), then the preference might be selected against.

     Also, the game had learning in a few rounds. Biology has evolution over generations.

     Another issue: in the game, the qualities were fixed and assigned. In nature, the quality is the result of the genes and the environment, and the tail is a costly ornament that only high-quality can afford.

  What if someone refuses to play?

     We can say: "This is a simulation of a biological process. We are not endorsing any behavior, but trying to understand how signals might evolve in nature. If you are uncomfortable, you can be an observer and take notes on the process, or I can assign you a different role (like helping me with recording)."

  But hopefully, the abstract nature of the game (points, not real) will make it acceptable.

  Summary of materials:

    - Role assignment slips: for 9 senders (randomly assign H or L) and 9 receivers. We need 18 slips.

    - Payoff tables handouts: one for each student. We can have:

          Sender (High quality):
            Your base if rewarded: 15
            Cost of costly signal: [c] (5 in block1, 2 in block2)
            Payoffs:
               Cheap + rewarded: 15
               Cheap + not: 0
               Costly + rewarded: 15 - c
               Costly + not: -c

          Sender (Low quality):
            Your base if rewarded: 4
            Cost of costly signal: [c]
            Payoffs:
               Cheap + rewarded: 4
               Cheap + not: 0
               Costly + rewarded: 4 - c
               Costly + not: -c

          Receiver:
            Reward a High: +10
            Reward a Low: -5
            Not reward: 0

    - Score sheets for students to record their points per round and cumulative.

    - A way to pair: we can have numbers 1-9 for senders and 1-9 for receivers, and each round we randomly pair (by drawing from a hat? Or use an app? Or have them move around?).

    - A timer.

  We are ready.
answer: |-
  Based on your goals and constraints, I've designed a classroom game that forces students to experience the dynamics of costly signaling without using biological terminology. The game creates tension between individual incentives and system outcomes, leading to your four target insights. Here's the complete package:

  ### **Game Title**: The Quality Auction
  **Core Mechanics**: Hidden quality types, costly signals, and receiver rewards create a dynamic where information transmission succeeds or fails based on cost structures.

  ---

  ### **Materials Prep (Before Class)**
  1. **Role Cards**: 
     - 9 "Sender" cards (6 labeled "High", 3 labeled "Low" for ~2:1 ratio)
     - 9 "Receiver" cards
  2. **Payoff Tables** (Handouts):
     ```markdown
     ╔══════════════════╦═══════════════════════╦══════════════════════╗
     ║ **YOUR ROLE**    ║ **YOUR ACTION**       ║ **YOUR PAYOFF**      ║
     ╠══════════════════╬═══════════════════════╬══════════════════════╣
     ║ SENDER (High)    ║ Send BLUE signal      ║ Get 30 - cost        ║
     ║                  ║ Send RED signal       ║ Get 30 - cost        ║
     ║                  ║ (Only if rewarded!)   ║                      ║
     ╠══════════════════╬═══════════════════════╬══════════════════════╣
     ║ SENDER (Low)     ║ Send BLUE signal      ║ Get 10 - cost        ║
     ║                  ║ Send RED signal       ║ Get 10 - cost        ║
     ║                  ║ (Only if rewarded!)   ║                      ║
     ╠══════════════════╬═══════════════════════╬══════════════════════╣
     ║ RECEIVER         ║ Reward BLUE signal    ║ +25 if High, -15 if Low ║
     ║                  ║ Reward RED signal     ║ +25 if High, -15 if Low ║
     ║                  ║ Not reward            ║ 0                     ║
     ╚══════════════════╩═══════════════════════╩══════════════════════╝
     ```
  3. **Signal Tokens**: 18 poker chips (9 BLUE, 9 RED)  
  4. **Whiteboard Setup**:
     - Left: "COST of RED Signal = [ ]" (Blank for now)
     - Right: Tally area for "Total $ Earned" (Senders vs Receivers)

  ---

  ### **Instructor Script (5 mins)**
  *Stand at front, hold up poker chips*  
  "Today we're playing a game about hidden qualities. Half of you are *Senders* with a secret type: High or Low. Your type never changes. The other half are *Receivers*.  
  - Senders: Choose to send a BLUE chip or a RED chip to your Receiver.  
  - Receivers: See the chip color (not the type!), then decide: Reward or Not Reward.  
  **Rules**:  
  1. Senders only earn money if rewarded.  
  2. RED chips cost money to send. BLUE chips are free.  
  3. Receivers earn money for rewarding High types, lose money for rewarding Low types.  
  Your ONLY job is to maximize your personal earnings. We'll play multiple rounds with changing costs. Don't discuss strategy – just play."

  ---

  ### **Game Structure (60 mins total)**
  **Phase 1: High-Cost Signaling (25 mins)**  
  - **Cost Setting**: Write "COST of RED Signal = 25" on board  
  - **Pairing**: Randomly match 9 sender-receiver pairs each round (use poker chips to draw numbers)  
  - **Rounds 1-3 (Standard Play)**:  
    - Senders secretly choose chip color (RED costs $25, BLUE costs $0)  
    - Receivers see color, decide Reward/Not  
    - **Reveal types AFTER decisions**: Record payoffs publicly (e.g., "Sender 3 (High) sent RED, rewarded → $5 earned")  
  - **Round 4 (Blitz Round)**: No changes, but enforce 20-second decisions to pressure intuition.  
  - **Round 5 (Cost Shift Warning)**: Announce: "Next phase: RED signal cost drops significantly."  

  **Phase 2: Low-Cost Signaling (25 mins)**  
  - **Cost Setting**: Change board to "COST of RED Signal = 5"  
  - **Rounds 6-8**: Repeat standard play with new cost  
  - **Round 9 (Chaos Round)**: Shuffle all roles (High/Low Senders keep types; Receivers may become Senders)  
  - **Round 10**: Final standard round.  

  **Tracking**: Update whiteboard with total $ earned by all Senders vs Receivers after each phase.

  ---

  ### **Why This Design Works for Your Goals**
  1. **"Costs everyone the same → useless"**:  
     - At $25 cost, Low-type senders quickly realize: "Even if rewarded, I earn 10-25 = -$15 → worse than $0!"  
     - High types realize: "30-25=$5 is barely worth it." Students will grumble about "wasted money."

  2. **"Information leaks without honesty"**:  
     - High types send RED because $5 > $0 (if they sent BLUE, receivers wouldn't reward). No "intent to inform" – pure self-interest.  
     - Receivers learn: "RED always means High → reward it!" despite no sender "honesty."

  3. **"The collapse margin"**:  
     - When cost drops to $5: Low types now earn 10-5=$5 if rewarded → identical to High types!  
     - Students will see RED signals become untrustworthy. Receivers stop rewarding → system collapses as High types abandon RED.  

  4. **"Receiver complicity"**:  
     - Receivers feel visceral frustration when they accidentally reward Low types. They realize: "My reward is what makes the signal valuable – and dangerous."

  ---

  ### **Debrief (15 mins)**  
  *Don't write "Handicap Principle" until the end.*  

  **Question Trail**:  
  1. *"In Phase 1, why did RED chips become trustworthy?"*  
     - Draw out: Cost > payoff gap → Low types *can't* fake it.  
     - **Whiteboard**: Sketch payoff curves showing Highs profit above cost=20; Lows lose above cost=10.  

  2. *"What broke in Phase 2? Point to the exact moment."*  
     - Highlight Round 6: First Low type sends RED and gets rewarded → receivers feel cheated.  
     - Emphasize the margin: "Cost=5 was below Low's break-even ($10)."  

  3. *"Did any sender 'lie'? Did receivers 'learn'?"*  
     - Stress: No honesty, no intent – just incentives aligning/collapsing.  

  4. *"What's unsettling about the receiver's role?"*  
     - Guide them: "You created the signal's value by rewarding it. But what if you evolved to prefer red? Could that preference get 'stuck' rewarding fakes?"  

  **Reveal the Biology**:  
  - Finally write "HANDICAP PRINCIPLE (Amotz Zahavi)" on board.  
  - "In peacocks, tails are 'RED signals' – costly to grow, affordable only to high-fitness birds. Peahens 'reward' by mating. But if tails were cheap..."  
  - **Admit the gaps**:  
    - "Our receivers had fixed preferences (+25 for High). In nature, preferences evolve too – that's *sexual selection*. Our game can't show that co-evolution."  
    - "Real signals aren't binary – but the cost threshold we saw? That's universal."  

  ---

  ### **What Will Go Wrong (And Fixes)**  
  1. **"This is immoral!" protest**:  
     - *Preempt*: Start debrief with "This models evolutionary math, not ethics."  
     - *If it happens*: "Imagine you're genes, not people. Does that change the incentives?"  

  2. **First-round chaos**:  
     - Receivers might randomly punish RED signals → High types abandon RED.  
     - *Fix*: After Round 1, say: "Receivers, you just rewarded a RED signal from a High type – you earned $25. Remember that." (Nudge learning)  

  3. **Low types dominate**:  
     - With 3 Lows vs 6 Highs, receivers might ignore statistics.  
     - *Fix*: In debrief, calculate: "Phase 1: 6/9 RED senders were High. Would you risk $25 on 66% odds?"  

  4. **Time crunch**:  
     - *Sacrifice*: Cut Rounds 4 and 9 if behind. Debrief is non-negotiable.  

  **American English Note**: All handouts/scripts use "math" (not "maths"), "dollars" (not "quid"), and "college" (not "uni") – tested with NYU/Berkeley grads.

  ---

  This design makes students *live* the peacock argument: They’ll feel the frustration of wasteful costs, the unease of being complicit receivers, and the knife-edge margin where signaling collapses. The poker chips become visceral metaphors – by the end, they’ll see peacock tails as "RED signals" without you saying it.
