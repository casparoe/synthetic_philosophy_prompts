prompt: |-
  Okay, I need help winning an argument and it has gotten way more heated then it should have. I moved a few months ago from a town where basically nobody tips and everyone jaywalks constantly to a big city where the tipping norms are intense and people queue in these very orderly lines. My roommate, who grew up here, keeps saying I'm being a jerk when I don't tip 20% or when I duck across a line to grab something, and that "when in Rome" is just basic morality. I think that's way too strong but I havent been able to say exactly why.

  So here's what I want: argue the position that a visitor is not morally obligated to follow most local conventions, and that the popular move -- "you benefit from the practice, so you're bound to comply with it" -- is doing far more work than it can bear. But I don't want flat relativism either. Draw a real line between conventions that are genuine coordination solutions (like which side of the road to drive on, or the rule that forms a queue so everyone eventually gets served -- obviously a visitor has to go along with those or the whole thing collapses) and conventions that are basically arbitrary local tastes or rent-seeking practices, like the exact tipping percentage, where I don't think merely showing up somewhere generates an obligation. Engage the strongest version of my roommate's case, which is that even a convention nobody would have independently chosen still binds you as long as it's the local equilibrium.

  One more thing to work in: I heard the idea that if a convention is one locals themselves ignore when nobody is watching -- like jaywalking -- that's a sign it isn't really a norm at all. My roommate thinks the jaywalking point is a gotcha against me, so tell me whether that test is any good and what it actually implies for tipping versus queueing.

  Keep it under 600 words. No citations, I just want the argument itself.
reasoning: |-
  Okay, the user is in a heated argument with their roommate about whether visitors are morally obligated to follow local conventions like tipping 20% or orderly queuing. They want a clear argument that distinguishes between essential coordination norms and arbitrary practices. 

  First, I need to unpack their core frustration: they feel their roommate's "when in Rome" stance oversimplifies morality. The tipping and jaywalking examples highlight their belief that not all conventions carry equal weight. Their request shows they're intellectually engaged—they've already identified key distinctions (coordination vs. arbitrary norms) and even referenced game theory ("local equilibrium"). 

  The roommate's strongest point is compelling: conventions stabilize social interactions. But the user wants to expose its limits. I should start by conceding that some norms *are* morally binding (like driving rules) because chaos would ensue otherwise. Then pivot to tipping: unlike queueing, it doesn't prevent systemic collapse; it's a transfer payment. The "benefit=obligation" logic fails here—entering a café benefits from staff wages, not the tip percentage itself. 

  Ah, the jaywalking test is clever! Locals ignoring it signals it's not a true coordination norm. That actually *helps* the user: in their hometown, jaywalking was the de facto norm, while their new city's orderly queues are consistently followed. Tipping falls in between—variable compliance suggests it's more cultural expectation than structural necessity. 

  I should warn that this test isn't perfect (some norms are good despite spotty compliance), but it usefully flags when a "rule" is just performative. For tipping, the real moral duty is fair compensation—which could be achieved via wages instead. Queueing, though? Universal adherence makes it legitimately binding. 

  The user's nuanced view deserves reinforcement: rejecting relativism while refusing to equate all conventions. Ending with "adapt where it matters" positions them as reasonable, not rebellious.
answer: |-
  Here’s the core argument:

  Your roommate is right that some conventions are morally binding on visitors because they’re **essential coordination solutions**. These norms exist purely to solve collective action problems and prevent chaos. Driving on the correct side, forming orderly queues, or basic traffic signals are prime examples. If you violate these, you actively *harm* others by disrupting the system everyone relies upon for safety and fairness. "When in Rome" applies here because your non-compliance directly damages the collective good you’re benefiting from (e.g., safe roads, efficient service).

  However, **not all conventions are coordination solutions**. Many are **arbitrary social preferences or economic practices**. Tipping percentages are a key example. While the *practice* of tipping might help servers earn a living wage in a broken system, the *exact percentage* (15% vs. 20% vs. 25%) isn't preventing systemic collapse. It's a local custom, often reflecting historical accident or industry pressure. Merely benefiting from a service (like eating in a restaurant with underpriced menu items subsidized by tipping culture) doesn't automatically create a moral obligation to adhere to the *precise local rate*. Your core obligation is to ensure fair compensation for service, not slavishly match a specific number. The "benefit = obligation" claim overextends here – you benefit from the server's labor, not inherently from the *20% convention itself*.

  **The "Locals Ignore It" Test:**
  This test *is* revealing, but not foolproof. If locals routinely ignore a rule "when nobody's watching" (like jaywalking on empty streets), it strongly suggests the rule isn't a *genuine, valued coordination norm* but rather:
  1.  **An inefficient rule:** (Like overly strict jaywalking laws).
  2.  **A performative norm:** Enforced for appearances, not function.
  3.  **Lacking moral weight:** Locals don't believe violating it inherently harms others.

  **Applying the test:**
  *   **Jaywalking:** Widespread local disregard *supports your original point*. It signals the *legal rule* isn't the true, functional coordination norm; the actual norm is "cross safely when practical." Insisting you follow the *letter* of an ignored law is demanding performative compliance, not upholding a vital coordination solution.
  *   **Queueing:** Locals consistently adhering to orderly lines, even when inconvenient, shows this *is* a valued coordination norm. Violating it disrupts fairness and efficiency for everyone, creating real harm.
  *   **Tipping:** The picture is mixed. While many locals *do* tip 20% consistently, significant numbers tip variably based on service, or avoid establishments with high expectations. This inconsistency suggests the *exact percentage* lacks the moral weight of a true coordination solution. It's more a strong social expectation or economic custom than a rule essential for preventing systemic harm.

  **The Strongest Counter & Your Reply:**
  Your roommate argues: "Even a bad convention binds you because it's the local equilibrium." **Reply:** This confuses *prudence* (avoiding social friction) with *morality*. Yes, violating *any* local norm might make you seem rude or bring social consequences. But a moral *obligation* only arises when your action would:
  1.  **Directly harm others** by disrupting a necessary coordination system (like queue-jumping does).
  2.  **Exploit or unfairly free-ride** on a system where others bear a cost you avoid *and* your avoidance actively damages the system.

  Following an arbitrary tipping percentage avoids social awkwardness but isn't a core moral failing like disrupting a queue or driving on the wrong side. Your obligation is to compensate fairly for service received, not validate every local economic custom. Adapt where it matters for coordination; elsewhere, aim for fairness and respect without conceding that every local preference carries moral weight.
