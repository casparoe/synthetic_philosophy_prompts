     And we are candid that Rule 2 is based on an exogenous factor k that represents how much more likely the report is if A is true, and this factor is not given by the report and must be estimated or assumed.

     The procedure is as follows in a checklist form:

     SAR Conditional Report Updating Checklist:

     Step 1: Parse the report.
          If the report contains a conditional statement (if A, then C with high probability), then go to Step 2.
          If the report is a direct probability statement about a sector (e.g., "probably in north"), then go to Step 8.

     Step 2: Identify A (antecedent) and C (consequent).
          A: [e.g., "subject is in north sector"]
          C: [e.g., "subject is staying near water"]

     Step 3: Obtain prior sector probabilities.
          If not available, assume uniform.

          Prior P(A) = ______, P(not A) = ______.
          If there are multiple sectors in not A, list them and assign probabilities: 
              Sector1 (A): P1 = ______
              Sector2: P2 = ______
              ... 

     Step 4: Obtain prior probabilities for C given each sector.
          For A: P(C|A) was ______. After the report, set P(C|A) = 0.99 (or if the report says "high probability", use 0.9; if "very high", use 0.99; etc. We need a mapping from words to numbers. We'll use a table: 
              "almost certainly" -> 0.99
              "very likely" -> 0.9
              "likely" -> 0.7
              "probably" -> 0.7
              ... [we need a standard])

          For not A sectors: P(C|sector_i) for each sector i in not A. If not available, ask the team. If still not available, use 0.5.

          Record:
              P(C|A) updated to: ______
              P(C|sector2) = ______
              P(C|sector3) = ______
              ...

     Step 5: Determine the odds factor k for A.
          Ask: "How many times more likely is it that the team would make this exact report if the subject is in sector A than if he is not? Consider that the report focuses on A and provides a strong conditional about C given A. In your experience, does this type of report occur more often when A is true? If so, by what factor? (e.g., 2 for twice as likely)"

          k = ______

          If not available, use k=1 (no change) and k=2 (doubling) for comparison.

     Step 6: Update the sector probabilities for A and not A.
          Let the prior odds of A = P(A) / P(not A).
          New odds = prior odds * k.
          New P(A) = new odds / (1 + new odds).
          New P(not A) = 1 - new P(A).

          Now, distribute the probability of not A among the non-A sectors in proportion to their prior probabilities within not A.

          For example, if not A consists of three sectors with prior probabilities p2, p3, p4, then the new probability for sector i in not A is:
              New P(sector_i) = [p_i / P(not A)] * new P(not A)

          But note: our prior for not A might be split unequally.

          Alternatively, if we are using a flat prior and then updating only the odds of A vs not A, and if the non-A sectors had equal prior, then they will have equal new probabilities.

          Record the new sector probabilities for both alternatives (if using k=1 and k=2) or for the provided k.

          If k=1, then the sector probabilities do not change.

     Step 7: Within-sector allocation for C.
          For sector A, allocate within the sector by focusing on areas with C (e.g., near water) because P(C|A) is high.
          For other sectors, use the prior within-sector allocation for C (e.g., if P(C|sector2)=0.5, then allocate half the sector resources to near water and half to other areas).

     Step 8: If the report is a direct probability statement about a sector (not conditional):
          Let A be the sector mentioned.
          Ask: "What probability does the team assign to A based on this report?"
              P(A) = ______
          If they cannot provide, use a default for the word used (e.g., "probably" -> 0.7).

          Update:
              New P(A) = provided probability.
              New P(not A) = 1 - new P(A).
              Distribute P(not A) among the other sectors in proportion to their prior probabilities within not A.

          Then go to Step 7 (but note: we don't have new information about C, so within-sector allocation remains as before).

     Step 9: Present to the unit leader:

          - The updated sector probabilities under the chosen k (or under both k=1 and k=2 if k was not provided).
          - The within-sector allocation adjustments (for conditional reports).

          The unit leader must decide:
              a) Which sector probabilities to use (if k was not provided, choose one of the alternatives or a compromise).
              b) Approve the within-sector allocation adjustments.

     Step 10: If the report cannot be parsed, or if critical information is missing and cannot be defaulted, then the report is declared unusable for updating probabilities. The unit leader must then allocate based on the prior or other information.

     We then allocate searchers based on the new sector probabilities and within-sector adjustments.

     This procedure should take about 15 minutes.

     Note: The procedure relies on the mapping from words to probabilities for the conditional and for direct probability statements. We provide a standard mapping:

          For direct probability statements:
              "certain" -> 1.0
              "almost certainly" -> 0.99
              "very likely" -> 0.9
              "likely" -> 0.7
              "probably" -> 0.7
              "maybe" -> 0.5
              "unlikely" -> 0.3
              "very unlikely" -> 0.1
              "almost certainly not" -> 0.01
              "impossible" -> 0.0

          For the conditional probability in the report, we use the same mapping for the probability in the consequent.

     We are done.
answer: |-
  Below is a step-by-step procedure for your planning group to handle conditional briefings, designed for clarity, speed (under 15 minutes), and transparency about assumptions. It explicitly names the updating rules, flags judgment calls, and includes a worked example. The output distinguishes between **recommendations** (from the procedure) and **decisions** (for the unit leader).

  ---

  ### **Procedure for Conditional Briefings**
  **Goal**: Update sector probabilities based on a conditional report (e.g., "If A, then probably B") while accounting for ambiguity.  
  **Input**: Prior sector probabilities (default: flat) and the briefing.  
  **Output**: Updated probabilities for sector allocation and within-sector focus.  
  **Rules Used**:  
  - **Jeffrey Conditioning (JC)** for direct probability reports.  
  - **Adams Conditioning (AC)** for conditionals (leaves antecedent probability unchanged).  
  - **Antecedent Boost (AB)** heuristic (increases antecedent probability).  
  **Candid Note**: AC vs. AB is a philosophical choice; the evidence alone doesn’t dictate which is "right." AB’s strength relies on an exogenous `k` factor (your judgment).

  #### **Step-by-Step Checklist**
  1. **Parse the Report (1 minute)**  
     - **Question**: What is the antecedent (A) and consequent (B)?  
       - *Sufficient answer*: Clear A (e.g., "in north sector") and B (e.g., "near water").  
     - **Stop if**: Report lacks a conditional structure (e.g., "Probably in north") → Use **Step 5**.  
     - **Output**: A = `[antecedent]`, B = `[consequent]`.

  2. **Set Priors (2 minutes)**  
     - **Question**: What are the prior probabilities for each sector?  
       - *Sufficient answer*: List of probabilities (sum=1). Default: Flat prior (e.g., 4 sectors = 0.25 each).  
     - **Output**: Priors = `[P₁, P₂, P₃, P₄]`.

  3. **Interpret the Conditional (2 minutes)**  
     - **Question**: How strongly does the report link A to B? Convert phrases to probabilities:  
       - "Almost certainly" → 0.99  
       - "Very likely" → 0.9  
       - "Probably" → 0.7  
       - (Default: "Likely" → 0.8 if unspecified).  
     - **Output**: `P(B|A) = [0.0–1.0]`.

  4. **Choose Antecedent Boost Factor `k` (Judgment Call) (3 minutes)**  
     - **Question**: "How much does this report increase our confidence in A, given the team focused on it? k=1 means no change; k=2 doubles A’s odds."  
       - *Sufficient answer*: `k ≥ 1`. Default: `k=1` (no change) and `k=2` (for comparison).  
     - **Candid Note**: `k` is not from evidence! `k=1` uses **Adams Conditioning** (AC), `k>1` uses **Antecedent Boost** (AB). Disputes in philosophy center here.  
     - **Stop if**: Team cannot justify `k` → Unit leader decides between AC (`k=1`) and AB (e.g., `k=2`).  
     - **Output**: `k = [value]`.

  5. **Update Probabilities (2 minutes)**  
     - If report is **direct probability** (e.g., "Probably in north"):  
       - Use **Jeffrey Conditioning (JC)**: Set `P(A) = [reported probability]`, redistribute other sectors proportionally.  
     - If report is **conditional** (e.g., "If A, then B"):  
       - **Adams Conditioning (AC)**: `P(A)` unchanged. Only update within-A focus to B.  
       - **Antecedent Boost (AB)**:  
         - New odds of A = `(P(A) / (1 - P(A))) × k`  
         - New `P(A) = new_odds / (1 + new_odds)`  
         - Redistribute non-A sectors proportionally.  
     - **Output**:  
       - Updated sector probabilities (for both AC and AB if `k` not fixed).  
       - Within-A: Focus resources on B (since `P(B|A)` is high).

  6. **Allocation Output (2 minutes)**  
     - **Recommendations**:  
       - Sector allocation: % searchers per sector (based on updated probabilities).  
       - Within-sector: For A, prioritize areas relevant to B.  
     - **Decisions for Unit Leader**:  
       - Choose between AC (`k=1`) and AB (`k>1`) if not resolved.  
       - Approve final allocation.

  7. **Worked Example (Flat Prior, 4 Sectors)**  
     - **Briefing**: "If in north (A), almost certainly near water (B)".  
     - **Priors**: Flat = [0.25, 0.25, 0.25, 0.25] (North, South, East, West).  
     - `P(B|A) = 0.99` ("almost certainly").  
     - **AC (`k=1`)** → Antecedent unchanged:  
       - Probabilities: [0.25, 0.25, 0.25, 0.25] (no change).  
     - **AB (`k=2`)** → Boost north’s odds:  
       - Prior odds of A = 0.25/(1-0.25) = 1/3.  
       - New odds = (1/3) × 2 = 2/3.  
       - `P(A) = (2/3)/(1 + 2/3) = 0.4`.  
       - Non-A sectors: 0.6 total, redistributed proportionally: [0.4, 0.2, 0.2, 0.2].  
     - **Allocation**:  
       - AC: 25% north, 25% south, 25% east, 25% west.  
       - AB: 40% north, 20% south, 20% east, 20% west.  
       - **Within north**: Focus 99% effort near water.

  ---

  ### **Run the Procedure on Three Briefings**
  #### **Briefing 1: Conditional (Near Water in North)**  
  - **Step 1**: A = "in north", B = "near water".  
  - **Step 2**: Priors = [0.25, 0.25, 0.25, 0.25] (flat).  
  - **Step 3**: "Almost certainly" → `P(B|A) = 0.99`.  
  - **Step 4**: `k` not specified → Default AC (`k=1`) and AB (`k=2`).  
  - **Step 5 (Update)**:  
    - AC: Probs = [0.25, 0.25, 0.25, 0.25].  
    - AB: Probs = [0.4, 0.2, 0.2, 0.2].  
  - **Step 6 (Output)**:  
    - **Recommendations**:  
      - Sector allocation:  
        - AC: 25% per sector.  
        - AB: 40% north, 20% others.  
      - Within north: Focus >99% near water.  
    - **Decisions**: Unit leader chooses AC or AB (or compromise).  

  #### **Briefing 2: Direct Probability ("Probably in North")**  
  - **Step 1**: Not conditional → **Step 5 (JC)**.  
  - **Step 5 (Update)**:  
    - "Probably" → `P(north) = 0.7` (per phrase table).  
    - Jeffrey Conditioning:  
      - `P(north) = 0.7`.  
      - Non-north: 0.3 total → redistributed equally: [0.7, 0.1, 0.1, 0.1].  
  - **Step 6 (Output)**:  
    - **Recommendations**:  
      - Sector allocation: 70% north, 10% others.  
      - Within sectors: No change (report doesn’t discuss behavior).  
    - **Decisions**: Unit leader approves.  

  #### **Briefing 3: Conditional with Near-Certain Antecedent**  
  - **Report**: "If in north (we’re 95% sure), almost certainly near water."  
  - **Step 1**: A = "in north", B = "near water".  
  - **Step 2**: Priors = [0.95, 0.0167, 0.0167, 0.0167] (95% north, 5% split equally).  
  - **Step 3**: `P(B|A) = 0.99`.  
  - **Step 4**: `k=2` (default AB).  
  - **Step 5 (Update)**:  
    - AC (`k=1`): Probs unchanged: [0.95, 0.0167, 0.0167, 0.0167].  
    - AB (`k=2`):  
      - Prior odds = 0.95/0.05 = 19.  
      - New odds = 19 × 2 = 38 → `P(A) = 38/(1+38) ≈ 0.974`.  
      - Non-A: 0.026 total → redistributed: [0.974, 0.0087, 0.0087, 0.0087].  
  - **Step 6 (Output)**:  
    - **Recommendations**:  
      - Sector allocation:  
        - AC: 95% north, 1.67% others.  
        - AB: 97.4% north, 0.87% others.  
      - Within north: Focus >99% near water.  
    - **Candid Note**: Report barely changes allocation (north was already likely). AC and AB differ by <3% — **this may feel unsatisfying, but it’s correct mathematically**. The report’s value is in refining search within north.  
    - **Decisions**: Unit leader approves allocation (AC/AB difference is negligible).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve Rule Disputes Empirically**:  
     - AC vs. AB isn’t settled by evidence; it’s a normative choice. Your group can’t "discover" which is "wrong" — only which aligns with outcomes over time (e.g., track allocations vs. found locations).  

  2. **Handle Ambiguous or Compound Conditionals**:  
     - Example: "If in north, probably near water; if in south, likely in mountains." The procedure treats one A→B at a time. Compound reports require iterative runs or judgment.  

  3. **Replace Judgment Calls**:  
     - When `k` is contested, or priors are unknown, the procedure stops and hands back to humans.  
     - Reports lacking clear A/B (e.g., "Subject might be near water or high ground") are unusable.  

  4. **Override Strong Priors**:  
     As in Briefing 3, if A is already near-certain, even a high-`k` AB update has minimal impact. This is a feature, not a bug — it correctly weights new evidence against existing knowledge.  

  **Final Advice**: Use this procedure to force transparency about assumptions (e.g., "Our 40% north allocation relies on AB with k=2"). Record choices and outcomes to refine your group’s judgment over time. The unit leader **owns** the `k` choice and allocation — the procedure only surfaces options.
