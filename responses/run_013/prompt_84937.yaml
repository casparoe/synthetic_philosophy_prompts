prompt: |-
  hey, so I'm a second-year phil student and I've somehow ended up running the tutorial session for my medieval political thought course next week. 16 people, 75 minutes, and most of them have read maybe two pages of Aquinas in their lives. Topic I got assigned: Aquinas on killing tyrants. I don't want to just stand up and explain the two tracks he seems to run at once, I want them to feel the bind in their bodies before anyone names it.

  Here's the bind, as I understand it, so you know what I'm aiming at. Aquinas clearly thinks tyranny is unjust because the tyrant rules for his own private good instead of the common good. He also says that disturbing a tyrannical government isn't sedition. But he says sedition is always a mortal sin, because it attacks the unity of the people in the common good, and he warns that rising against a tyrant often leaves you with a worse one. And there's the bit where the remedy depends on how the tyrant got there: if the community originally had the right to set up its ruler it can depose him, if he's under some superior you go to the superior, and if there's no superior you're stuck appealing to God. So the question isn't really may we kill this guy, it's who counts as we, who holds the authority, and what the attempt does to the very common good it's supposed to be serving.

  Can you design the session around that? Rough setup I had in mind, change whatever doesn't work. A fictional city-state with a ruler who's genuinely awful. Run it in two rounds with the same tyrant and the same grievances, but different origins: in round one he seized power illegally, in round two he inherited it legally and then turned brutal. See whether the group's willingness to act shifts, and whether they can say why. Give everyone a role with a secret stake: a magistrate whose office comes from the tyrant, a merchant who profits from the regime, a widow, a cleric who thinks the suffering is punishment for the city's sins, the tyrant's nephew, a captain whose soldiers will follow whoever feeds them. Add a mechanic for authority, like tokens representing legal mandate that most people don't have, and something that converts unauthorised action into chaos tokens which later produce a worse ruler. No real money, points or cards are fine. I want them to hit the wall where the obviously justified killing also looks like it hands the city to someone worse, and where nobody can agree who gets to decide what the common good is.

  Then a debrief that maps what happened onto the actual distinctions: injustice of tyranny vs. sinfulness of sedition, private vs. public authority, the risk of a worse tyrant, and the sincerity problem where everyone thinks they're defending the common good. Tell me what'll predictably go wrong the first time I run it and how to handle it, and be honest about what the activity can't reproduce, because I know there's a whole theological frame I'm going to have to supply myself. Also, please don't quote Aquinas at me or give me reading lists, I'll have the texts in the room.
reasoning: |-
  Okay, the user is a second-year philosophy student tasked with running a tutorial on Aquinas' view of killing tyrants. They want to avoid a lecture and instead create an experiential activity where students feel the tension Aquinas describes. The core tension is between the injustice of tyranny and the dangers of sedition, including who has authority to act and the risk of unintended consequences.

  The user has outlined a fictional city-state scenario with roles and mechanics. They want students to confront the dilemma where killing a tyrant might lead to worse outcomes. The debrief should connect the game to Aquinas' concepts. The user also wants to know potential pitfalls and the activity's limitations.

  First, I need to ensure the activity highlights Aquinas' key points: tyranny vs. sedition, authority sources, and the common good's fragility. The two-round structure (usurper vs. legitimate heir) should show how origin affects legitimacy. Roles must have conflicting interests to mirror the "sincerity problem" where everyone claims the common good.

  The token system (Authority and Chaos tokens) needs to mechanize the consequences of unsanctioned actions. Chaos tokens causing a worse ruler later will illustrate Aquinas' warning. But how to handle the debrief? The user mentioned mapping game events to Aquinas' distinctions, so I should prepare clear parallels.

  Potential issues: students might focus on winning, missing the philosophical point. The mechanic could oversimplify, so the debrief must clarify limitations. Also, quieter students might get sidelined. Assigning roles and using prompts can help. Time management is crucial; 75 minutes isn't much. Structuring phases strictly will help.

  The user doesn't want quotes or readings, so the activity must stand alone but set up their explanation. I'll emphasize in the debrief what the game can't cover, like Aquinas' theological framework, so the user can address that afterward.

  I'll suggest a phased approach: setup, two rounds, debrief. Roles should include diverse stakes (e.g., magistrate dependent on the tyrant, cleric seeing suffering as divine punishment). The token system should limit who can act without consequences, showing how authority legitimizes action.

  For the second round, changing the tyrant's origin to legitimate inheritance should shift the group's willingness to act, highlighting Aquinas' point about authority sources. The debrief should draw out why their responses changed, linking to the text's distinctions.

  Predictable problems: students might not engage deeply, chaos tokens might feel arbitrary, or the activity could run long. Mitigations include clear instructions, tight facilitation, and prompting reflection. Emphasizing that it's about the dilemma, not winning, is key.

  Lastly, acknowledging the activity's limits: it simplifies Aquinas' nuanced theology, so the user must cover that post-activity. Ensuring they know to frame the game as an entry point, not a replacement for textual analysis.
answer: |-
  Here's a designed 75-minute session focused on *embodying* Aquinas' dilemma on tyrants, using your city-state scenario. The goal is visceral tension, not tidy answers.

  **Session Title:** The Aquinian Bind: Power, Justice, and the Common Good's Razor Edge

  **Core Objective:** Make students feel the excruciating tension between the injustice of tyranny and the peril of sedition, highlighting the questions of *authority*, *consequence*, and *defining the "common good."*

  **Materials:**
  *   Whiteboard/Flipchart
  *   Markers
  *   Two types of tokens (e.g., Poker Chips: Blue = Authority Token, Red = Chaos Token). Need ~20 Blue, 20+ Red.
  *   Role Cards (16, see list below)
  *   Timer

  **Setup (15 mins):**
  1.  **The Hook (5 mins):** "Imagine your city. A beautiful, ancient place. But now... fear. Your ruler, Lord Malachi, takes what he wants, imprisons critics, ignores justice, lives in obscene luxury while people starve. He *is* a tyrant. The question isn't *if* he's unjust, but *what do you do about it?* Killing him seems obvious... Aquinas, the brilliant medieval thinker we're studying, saw the trap. Today, you *are* the citizens. Let's see what happens."
  2.  **Introduce the Bind Briefly (5 mins):** Sketch on the board:
      *   **Tyrant:** Rules for private good, not common good = UNJUST.
      *   **Sedition:** Attacking unity/peace = MORTAL SIN (always bad for common good).
      *   **BUT:** Disturbing a tyrant isn't sedition? Yet... it often leads to WORSE tyranny? The remedy depends on WHO originally had authority? Who defines the common good *now*?
  3.  **Introduce Mechanics & Roles (5 mins):**
      *   "You each have a *Role* with secret motivations. Read it, keep it secret for now."
      *   **Authority Tokens (Blue):** Represent legal mandate/office. *Only* characters holding these have the recognized authority to act *without automatically generating Chaos*. (Hold up Blue tokens).
      *   **Chaos Tokens (Red):** Represent the destabilizing effect of *unauthorized* action. Every significant action proposed *without* an Authority Token backing it generates at least 1 Red token into the city pool. (Hold up Red tokens). *Crucially:* At the end of each round, the number of Red tokens secretly determines how bad the *next* ruler will be.
      *   **The Goal:** "Your goal isn't 'winning,' it's surviving and protecting what *you* believe is the common good – which might mean stability, justice, profit, or salvation. Be true to your role."
      *   **Round Structure:** We'll face the *same tyrant* (Lord Malachi) twice, with the *same grievances*. BUT, the **origin of his power changes**, changing who might have legitimate authority to act.

  **Round 1: The Usurper (25 mins)**
  *   **Set the Scene:** "Lord Malachi seized power 5 years ago in a bloody coup, murdering the rightful heir. He has no legitimate claim. He rules by fear alone. Grievances: Starvation in the lower city, arbitrary imprisonment of critics, crushing taxes funding his luxuries, suppression of the temples."
  *   **Assign Authority Tokens (Blue):** *Only 3 roles start with them:* The Magistrate (his office exists because Malachi appointed him), the Captain of the Guard (Malachi appointed him), and the Legitimist Noble (claims authority as the *true* heir's representative). *Physically give them tokens.*
  *   **Group Discussion (20 mins):** "What do you, the citizens, do about Lord Malachi? Propose actions, debate. Remember your roles and stakes. Anyone can propose an action. If the action requires authority (e.g., 'arrest the tyrant,' 'raise a militia,' 'declare him deposed') and the proposer lacks a Blue token, a Red (Chaos) token *must* be added to the pool for that proposal *just for making it seriously*. If the group *agrees* to *do* an unauthorized action (even just planning it seriously), add another Red token."
      *   **Facilitator Role:** Circulate, listen intensely. *Crucially:* Enforce the token rules. When an unauthorized proposal is made, loudly place a Red token in the center: "Proposing [action] without recognized authority generates Chaos!" When the group coalesces around an unauthorized plan, add another Red token: "Committing to unauthorized action generates more Chaos!" Ask probing questions: "Who gave *you* the right to decide this, Merchant?" "Captain, will your soldiers follow *you* or just the one who pays?" "Cleric, is this suffering God's will or Malachi's sin?" Push them on "Who is the 'we'? Who decides the common good here?"
  *   **Consequence (5 mins):** "Time's up. You acted (or didn't). Count the Red Chaos tokens in the pool. Remember this number: **X**." (Don't reveal the consequence yet!).

  **Round 2: The Legitimate Heir Gone Bad (20 mins)**
  *   **Shift the Scene:** "Same Lord Malachi. Same brutal actions: starvation, imprisonment, taxes, suppression. BUT... Lord Malachi inherited the throne *legally* 15 years ago. His family ruled for centuries. He started well, but grew cruel over the last 5 years. The grievances are identical."
  *   **Reassign Authority Tokens (Blue):** *Now based on inheritance:* The Legitimist Noble (represents the *dynastic* claim, Malachi is failing it), the Magistrate (office derives from the *ancient* crown, not Malachi personally), and... *perhaps* the High Cleric (if the Church historically crowned rulers). *Physically redistribute tokens.* The Captain *might* lose his if his loyalty is purely to the office, not Malachi. *Make this reassignment visible and slightly contentious.*
  *   **Group Discussion (15 mins):** "What do you do *now*? Same Malachi, same cruelty... but different origins. Does that change your approach? Remember the token rules!" (Enforce rigorously again).
  *   **Consequence (5 mins):** Count the Red tokens for this round: **Y**. Still don't reveal consequences.

  **The Reveal & Debrief (15 mins):**
  1.  **The Chaos Consequence:** "You felt the tension. Now the consequence: For Round 1 (Usurper), with **X** Red tokens, the new ruler will be... [Choose based on X: e.g., 1-3: Slightly better, competent but harsh; 4-6: Another tyrant, maybe worse; 7+: A chaotic warlord/factional violence]. For Round 2 (Legitimate Heir), with **Y** tokens... [Similar scale, perhaps slightly harsher thresholds for bad outcomes to reflect Aquinas' warning about disturbing established, even corrupted, order]." *Emphasize:* More Chaos = Worse Outcome. "Your justified anger directly risked making things *worse*."
  2.  **Mapping to Aquinas (Key Questions - Facilitate Discussion):**
      *   **The Bind:** "How did it *feel* knowing Malachi was evil, but also knowing acting against him could cause chaos and maybe a worse ruler? Where did you feel stuck?"
      *   **Origin Matters:** "How did the change from Usurper to Legitimate Heir change the discussion? Who felt *authorized* to act in each case? Did anyone's 'right' to act disappear or appear? (Point to token holders). This is Aquinas' point about 'how the tyrant came to power'."
      *   **Authority Tokens = Mandate:** "Who held the 'Authority' (Blue tokens)? Did it always feel *right* that they had it? Did it actually stop others from wanting to act? This mirrors Aquinas on who has the right to depose (the community that elected, a superior...). What if there *is* no clear authority token holder?"
      *   **Chaos Tokens = Sedition's Cost:** "Every unauthorized proposal/action generated Chaos (Red). Aquinas says disturbing tyranny isn't *sedition*... but he warns it often *leads to worse outcomes/sedition-like chaos*. Did you see that mechanic play out? Did the fear of adding Red tokens hold you back?"
      *   **Defining the Common Good:** "Widow, what was the common good for you? Merchant? Cleric? Captain? Noble? Did you ever agree? This is the 'sincerity problem' – everyone *believes* they serve the common good, even the tyrant! Who gets to decide?"
      *   **The Core Aquinas Questions:** "So, it's not just 'Can we kill the tyrant?'. It's: *Who is the 'We' with the right?* (Authority). *What will the action do to the unity and peace it claims to serve?* (Chaos). *How do we know what the true Common Good even is?*"

  **Role Cards (16 - Adapt names/stakes):**
  1.  **Magistrate:** Your office/judicial power comes *from the ruler*. Lose it if he falls. (Start R1 with Auth, R2 with Auth).
  2.  **Merchant (Importer):** Profits from exclusive licenses granted by Malachi. Stability = wealth. Fear popular uprising.
  3.  **Widow:** Husband imprisoned/killed for speaking out. Children starving. Justice NOW.
  4.  **High Cleric:** Believes suffering is divine punishment for the city's moral decay. Opposes violence; urges prayer/repentance. (May gain Auth R2).
  5.  **Tyrant's Nephew:** Young, ambitious. Stands to inherit if Malachi dies naturally... but might be killed if Malachi falls violently. Wants Malachi gone *safely*.
  6.  **Captain of the Guard:** Commands the soldiers. They obey orders and follow pay. Worried about city descending into chaos his men can't control. (Start R1 with Auth, *may* lose R2).
  7.  **Guildmaster (Weavers):** Malachi crushed your guild's autonomy. Seeks restoration of traditional rights. Cautious of chaos hurting trade.
  8.  **Legitimist Noble:** Descendant of the old ruling family Malachi usurped (R1) or disgraced (R2). Believes YOU are the rightful authority. (Start R1 with Auth, Start R2 with Auth).
  9.  **Radical Preacher:** Believes Malachi is the Devil incarnate. Calls for righteous uprising/tyrannicide. God's will justifies action.
  10. **Wealthy Landowner:** Fears peasant uprisings more than Malachi. Values stability and protection of property above all.
  11. **Scholar/Philosopher:** Obsessed with the *idea* of the Common Good. Deeply worried about the consequences of action. Wants the "correct" theoretical solution.
  12. **Spy (for a neighboring state):** Secretly wants chaos to weaken the city for your master's gain. Sow discord subtly.
  13. **Former Soldier:** Disabled, bitter. Hates Malachi, blames him for plight. Ready for violence, distrusts the Captain.
  14. **Apothecary:** Sees the suffering daily (sickness, malnutrition). Neutral politically, just wants the suffering to stop by any *effective* means.
  15. **Young Idealist (Student):** Inspired by tales of liberty. Sees the injustice clearly. Impatient for action, distrusts old authorities.
  16. **City Architect:** Built Malachi's palaces under duress. Knows secret passages/weak points in the citadel. Fears being implicated if plots fail.

  **Predictable Problems & Fixes:**

  1.  **"It's just a game, let's kill him!" (Lack of Role Buy-in):**
      *   **Fix:** Stress immersion *repeatedly*. "What would your character *really* risk?" "Widow, are you *sure* you want to speak up? What if the Spy reports you?" Assign roles carefully (put engaged students in key roles). Enforce the Chaos token consequences visibly and seriously.
  2.  **Quiet Students Dominate/Dominate:**
      *   **Fix:** Use direct, role-based prompts: "Captain, your soldiers are restless. What do you tell them?" "Apothecary, you see the Widow's children coughing. What do you do?" Set ground rules for sharing airtime.
  3.  **Ignoring/Forgetting Mechanics (Tokens):**
      *   **Fix:** Keep tokens highly visible. Interrupt *immediately* when a rule is broken: "Hold on! Merchant, you just proposed raising a militia. Do you have a Blue token? No? *Places Red token dramatically.* That proposal generates Chaos!" Recap mechanics briefly before each round.
  4.  **Getting Bogged Down in Fictional Details:**
      *   **Fix:** Gently refocus: "Interesting point about the grain supply, but what does that mean for *action against Malachi*?" "Remember the core question: Who acts, and with what authority?"
  5.  **Running Over Time:**
      *   **Fix:** BE RUTHLESS with the timer. Announce time clearly ("10 mins left!"). Cut discussions off sharply at the end. Prioritize the Debrief – that's where the Aquinas connection happens. Sacrifice some Round 2 discussion time if needed.
  6.  **Oversimplifying Aquinas:** The activity inherently does this. That's okay! It's the entry point.
      *   **Fix:** Be explicit in the debrief about what the activity *didn't* capture (see below).

  **What the Activity Can't Reproduce (Be Explicit in Debrief):**

  1.  **The Theological Framework:** Aquinas's concepts of Natural Law, Eternal Law, Sin, and Grace underpin everything. The "mortal sin" of sedition isn't just social chaos; it's an offense against God and the divinely ordained order. The "appeal to God" isn't just passivity; it's within a worldview of divine justice and providence. *You will need to briefly re-anchor the discussion in this frame after the activity.*
  2.  **Aquinas's Nuance on "Killing":** He distinguishes public authority acting justly (execution) from private murder. The activity blurs this, focusing on the *decision to act* and its consequences. Highlight this distinction post-activity.
  3.  **The Depth of "Common Good":** For Aquinas, it's not just material welfare or stability; it's the flourishing of human persons in community according to virtue and directed towards God. The activity focuses on the conflict *over* defining it, not its full Thomistic content.
  4.  **Historical Context:** The medieval worldview, the role of the Church, and feudal structures deeply shape Aquinas's thinking. The city-state is an abstraction.

  **Final Tip:** Start the debrief by asking *them*: "What frustrated you the most?" Their answers will perfectly tee up the Aquinian distinctions. Good luck – this sounds like an electrifying (and challenging) tutorial to run! You've grasped the core tension brilliantly.
