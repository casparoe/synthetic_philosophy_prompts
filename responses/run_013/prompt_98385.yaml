  Below is a decision tree designed to guide readers from a basic commitment to persistence (that ordinary objects persist through time) to specific metaphysical positions, without leading with temporal parts. The first branch focuses on the **nature of the persistence question itself**, followed by concrete cases and intuitive claims. Each leaf includes a brief gloss and is labeled with a named position. Unoccupied branches are noted, and inseparable leaves are flagged.  

  ### Decision Tree for Persistence Views  

  **Start**: You believe ordinary objects (e.g., tables, people) persist through time.  
  **First Question: What kind of question is persistence?**  
  1. **A. A first-order question about what exists in reality** (Realism).  
     → Go to Question A1.  
  2. **B. A question about how language/thought represents the world** (Antirealism/Linguistic).  
     → Go to Question B1.  
  3. **C. A question about which description best "carves nature at its joints"** (Joint-Carving).  
     → Go to Question C1.  

  ---

  #### Branch A: Realism (Persistence is about what exists)  
  **Question A1: Does only the present moment exist?**  
  - **Yes** → Presentism is true. Objects persist by being wholly present at each moment.  
    → **Presentist Endurantism**: Objects endure by being wholly present at each time; properties change via tensed facts (e.g., "The banana was green").  
  - **No** → Eternalism is true. Past, present, and future all exist.  
    → Go to Question A2.  

  **Question A2 (Eternalism): A banana is green at noon and yellow at 6 PM. What is the best account of this change?**  
  - **Option 1: "At noon" modifies the banana itself** (e.g., we refer to a noon-specific entity).  
    → Go to Question A2.1.  
  - **Option 2: "At noon" modifies the property green** (e.g., "green-at-noon" is a time-indexed property).  
    → Go to Question A2.2.  
  - **Option 3: "At noon" modifies the copula "is"** (e.g., "The banana is-at-noon green").  
    → Go to Question A2.3.  

  **Question A2.1 (Modified banana)**: What do ordinary names (e.g., "the banana") refer to?  
  - **W. The entire temporally extended object** → **Perdurantism (Worm Theory)**: Ordinary objects are four-dimensional wholes ("worms"); persistence is having temporal parts (e.g., a green temporal part at noon, a yellow one at 6 PM).  
  - **S. Instantaneous stages** → **Perdurantism (Stage Theory)**: Ordinary objects are momentary stages; persistence is having later counterparts (e.g., the noon stage is green; the 6 PM stage is yellow and is a counterpart of the noon stage).  

  **Question A2.2 (Modified property)**: At noon, a statue and the clay it is made of occupy the same space. Are they the same object?  
  - **Yes** → **Endurantism (Time-Indexed Monism)**: Objects endure with time-indexed properties; coinciding objects (statue/clay) are identical despite different modal/historical properties.  
  - **No** → **Endurantism (Time-Indexed Pluralism)**: Objects endure with time-indexed properties; coinciding objects are distinct (e.g., the statue is constituted by the clay but not identical to it).  

  **Question A2.3 (Modified copula)**: At noon, a statue and the clay it is made of occupy the same space. Are they the same object?  
  - **Yes** → **Endurantism (Adverbial Monism)**: Objects endure; change is handled adverbially (e.g., "The banana is greenly at noon"); coinciding objects are identical. (*Unexplored: No major defenses exist.*)  
  - **No** → **Endurantism (Adverbial Pluralism)**: Objects endure with adverbial change; coinciding objects are distinct. (*Unexplored: No major defenses exist.*)  

  ---

  #### Branch B: Antirealism/Linguistic (Persistence is about representation)  
  **Question B1: In the Ship of Theseus case (gradual part replacement), is there a fact about which ship is the original?**  
  - **Yes** → **Incoherent branch**. (Antirealism denies objective facts about persistence. *Marked incoherent: Contradicts the linguistic commitment.*)  
  - **No** → **Conventionalism**: Persistence facts are determined by linguistic or conceptual conventions (e.g., "original" depends on context).  

  ---

  #### Branch C: Joint-Carving (Persistence is about best description)  
  **Question C1: Follow the Branch A questions (A1–A2.3) for concrete cases, but treat your answers as selecting the most fundamental description.**  
  → *Leaves mirror Branch A, but positions are held as "joint-carving" (e.g., "Endurantism [Joint-Carving]").*  
  (*Flag: The tree cannot separate joint-carving variants from Branch A variants using these questions—both answer identically to cases. The distinction is meta-metaphysical.*)  

  ---

  ### Leaf Glossary (Named Positions)  
  - **Presentist Endurantism**: Objects are wholly present at each moment; change involves tensed properties (e.g., "was green").  
  - **Perdurantism (Worm Theory)**: Ordinary objects are four-dimensional wholes with temporal parts; names refer to the whole "worm."  
  - **Perdurantism (Stage Theory)**: Ordinary objects are instantaneous stages; names refer to stages, and persistence involves counterpart relations.  
  - **Endurantism (Time-Indexed Monism)**: Objects endure wholly at each time with time-indexed properties (e.g., "green-at-t"); coinciding objects are identical.  
  - **Endurantism (Time-Indexed Pluralism)**: Objects endure with time-indexed properties; coinciding objects are distinct (e.g., constitution theory).  
  - **Endurantism (Adverbial Monism/Pluralism)**: Objects endure; change is adverbial (e.g., "is greenly"); coinciding objects may be identical or distinct.  
  - **Conventionalism**: Persistence facts are fixed by conventions, not objective reality.  

  ### Unoccupied Branches  
  - **Presentism + Perdurantism**: Incoherent (perdurantism requires non-present temporal parts).  
  - **Antirealism + Persistence Facts**: Incoherent (denies objective facts but affirms them in B1).  
  - **Adverbial Endurantism variants**: Unexplored (no prominent defenses exist).  

  ### Flagged Inseparable Leaves  
  - **Joint-Carving vs. Realism variants**: The tree cannot separate these (e.g., "Worm Theory" vs. "Worm Theory [Joint-Carving]") because they answer concrete cases identically. The distinction depends on whether the view is fundamental (joint-carving) or merely true (realism).  

  ---

  ### How to Use This Tree  
  - **Without Jargon**: Questions use intuitive cases (e.g., banana color change, statue/clay) and avoid technical terms like "temporal parts."  
  - **Self-Guided**: Readers answer based on pre-theoretic judgments (e.g., "What does 'at noon' modify?").  
  - **Covers Key Views**: Includes endurantism, perdurantism (worm/stage variants), presentism, eternalism, adverbialism, and antirealist options.  

  This tree isolates core commitments while respecting your constraints. For seminar use, pair it with case-based discussions (e.g., Ship of Theseus) to test branches.
