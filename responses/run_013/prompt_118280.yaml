  Okay, let me start by unpacking the user's query. They've had a long argument with a philosopher friend about a specific pattern they've noticed: they can accurately describe how they perform a skill, but that description doesn't help others (or even themselves) replicate the performance. Cooking is their prime example—they know when meat is done by the sizzle pitch, smell, and juices, but following those instructions leads to worse results. The same applies to knowing when an argument has turned. 

  The user insists this isn't tacit knowledge (Polanyi) or knowing-how vs knowing-that (Ryle). They want a precise term for this gap where the description is accurate but not generative. They also want to distinguish it from related concepts and explore edge cases like mathematical proofs.

  First, I need to verify if existing terms fit. Tacit knowledge involves things you can't articulate, but the user can articulate their process. Ryle's distinction doesn't address why articulated rules fail. The Dreyfus model suggests experts abandon rules, but the user still uses rules descriptively. "Paralysis by analysis" is about overthinking, not the structural gap between description and performance. Generative vs descriptive rules highlight the core issue: the description fits but can't generate the skill.

  The key here is recognizing the role of embodied judgment. Sensory cues like sizzle pitch require real-time interpretation that written rules can't capture. Timing and integration are crucial—knowing which cue to prioritize when. Also, the description might miss meta-skills like adjusting to context. 

  For edge cases, a written proof lacks the discovery process, making it a cousin phenomenon. The "generative gap" term seems fitting, emphasizing the failure to reproduce performance despite accurate description. 

  I should ensure clarity on distinctions: this isn't about inarticulable knowledge but about the limitations of explicit rules in conveying real-time application. The user's deeper need might be validating their observation as a unique phenomenon, seeking terminology that captures its nuances for future reference or academic discussion.
answer: |-
  Your observation cuts deep into a fundamental fissure in human expertise, and your frustration with "tacit knowledge" or "knowing-how" is justified. What you're describing isn't *quite* captured by Polanyi or Ryle, though it's adjacent. You've identified a distinct and crucial phenomenon: **The Generative Gap of Articulated Heuristics**.

  Here's the precise carving you requested:

  1.  **The Phenomenon Defined:**
      *   **What it IS:** A situation where an expert possesses a *descriptively accurate, explicit account* (a rule, heuristic, or set of cues) they genuinely use to guide a skilled performance. This account faithfully reflects *what* they attend to and *why* they act when they do *during the successful performance*. However, this explicit account, *when followed prescriptively as a set of step-by-step instructions*, fails to generate the skilled performance – either for the expert themselves or for a novice.
      *   **Core Mechanism:** The failure arises because the explicit account necessarily **abstracts away, underspecifies, or cannot encode the critical, real-time, context-dependent, embodied judgment** required to *apply* those cues or rules effectively. The account captures the *inputs* (cues) and the *output* (decision/action), but not the complex, situated *processing* linking them.
      *   **Key Features:**
          *   **Descriptive Accuracy:** The account isn't wrong or incomplete *as a description of the expert's focus*. (It *does* capture "sizzle pitch drops," "smell shifts nutty," "juices run clear").
          *   **Non-Generativity:** The account fails *as an algorithm* for producing the result.
          *   **Embodied Context Dependence:** The meaning and interpretation of the cues are inseparable from the expert's sensory apparatus, prior experience shaping their perception, and the immediate, dynamic context ("nutty" isn't an objective smell; pitch drop has thresholds).
          *   **Temporal Integration & Weighting:** Knowing *which* cue to prioritize *at this instant*, how to interpret ambiguous or conflicting cues, and the precise *timing* of action based on their confluence isn't captured by listing them.
          *   **Meta-Skill Omission:** The account misses the expert's ability to *recognize when the rule applies*, *adjust* it based on subtle context (pan heat, meat thickness, desired doneness beyond "ready"), and *recover* if a cue is missed or misleading.

  2.  **Distinguishing What It Is NOT:**
      *   **NOT Tacit Knowledge (Polanyi):** Polanyi's core idea is "we know more than we can tell." The knowledge *cannot* be articulated. **Your case is different.** You *can* articulate it accurately ("I know *that* I attend to pitch, smell, juice"). The gap isn't inarticulability, but in the **failure of the articulation to function as an instruction set** due to the loss of situated judgment.
      *   **NOT Know-How vs. Know-That (Ryle):** Ryle argues that knowing how to ride a bike isn't reducible to knowing propositions *about* bike riding. You're *not* disputing that distinction. You're pointing to a problem *within* articulated "know-that" *about* the know-how: that this specific know-that, despite being accurate, doesn't *constitute* or sufficiently *generate* the know-how.
      *   **NOT Dreyfus-Style Rule Abandonment:** Dreyfus (building on Heidegger) argues experts act intuitively, no longer consciously applying rules; rules are for novices. **Your case is different.** You *do* consciously use these rules/cues *as an expert*. The rules remain descriptively valid guides *for you*, but fail prescriptively *for others* (or for you when over-applying them). The expert hasn't "outgrown" these rules; they rely on them, but their application is embodied.
      *   **NOT Mere "Paralysis by Analysis":** This is the common phenomenon where overthinking disrupts a fluid skill (like a golfer's swing). **Your case is broader.** While "following your own instructions badly" *includes* paralysis by analysis, the core phenomenon is the *structural inadequacy* of the explicit description *as an algorithm*, even if someone tries to apply it calmly. The novice fails not just from nerves, but because the instructions lack the necessary embedded judgment.
      *   **NOT Descriptive Rule vs. Generative Rule:** This is very close. A descriptive rule merely fits observed behavior ("The expert acts when A, B, and C occur"). A generative rule is an algorithm that, if followed, *produces* the behavior. **Your phenomenon is the specific instance where a rule *is* descriptively accurate (it's what the expert uses consciously), yet it fails to be generative.** The key addition is that the expert *themselves* relies on this description successfully *only* when it's embedded within their embodied skill, not when treated as a standalone algorithm.

  3.  **Where the Edges Lie & The Proof Example:**
      *   **The Sensory/Embodied Edge:** The gap is most pronounced in skills heavily reliant on real-time sensory processing and motor response (cooking, sports, surgery, social cue reading). It diminishes as skills become more abstract and proceduralized (e.g., following a well-defined software installation wizard).
      *   **The Context-Dependence Edge:** The gap widens in highly variable, unpredictable contexts and narrows in stable, controlled environments.
      *   **The Written Proof: A Cousin Phenomenon.** This is *related* but not identical. Why?
          *   **Similarity:** Both involve a descriptive account (the proof steps / the cooking cues) that accurately captures the justification/process *after the fact*, but doesn't readily generate the *act of discovery* or *performance*.
          *   **Crucial Difference:** The gap in a mathematical proof is primarily **epistemological and creative**. The proof verifies *why* the result is true, but the steps don't reveal *how the insight to take those steps was achieved* (the hunches, false starts, analogies, leaps of intuition). It's about the process of *invention* vs. *verification*. Your cooking/argument gap is primarily **performative and applicative**. It's about the failure of explicit cues/rules to generate competent *application* and *judgment* in real-time, even though the expert *uses* those same cues/rules *within* their performance. The proof lacks the *heuristic discovery path*; your articulated heuristics lack the *embodied skill to apply them effectively*.

  **The Name:**

  *   **Best Established Fit:** While not a single universal term, **"The Articulation Gap"** (sometimes used in expertise studies) comes closest, emphasizing the failure of words to fully capture the performative essence. **"Non-Generative Description"** is also descriptive.
  *   **More Precise Coinage:** To capture your specific emphasis:
      *   **Generative Gap of Articulated Heuristics:** Highlights the core failure (generative gap) and the nature of the description (articulated heuristics).
      *   **Performative-Descriptive Dissonance:** Emphasizes the disconnect between the description's accuracy and its failure in performance.
      *   **The Heuristic Application Gap:** Focuses on the failure in *applying* the described rules/cues.

  **In essence:** You've identified the crucial limitation of explicit, declarative knowledge *about* a skill. While such knowledge can be accurate *descriptively*, it functions as a *heuristic guide* embedded within a larger framework of embodied skill, context sensitivity, and real-time judgment. Extracting it and treating it as a standalone algorithm strips away the very elements that make it effective *for the expert*, creating the **Generative Gap**. This gap isn't about secrets or ineffable genius; it's about the inherent lossiness in translating dynamic, situated, embodied judgment into static, context-free propositions. Your cooking instructions are a perfect map of the terrain you navigate, but they can't drive the car for you.
