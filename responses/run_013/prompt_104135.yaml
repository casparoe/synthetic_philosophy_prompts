  Regarding "in denial" accusations: Imaginative pretense makes this potentially legitimate as an intervention. The deflationary view would see it as unhelpful or coercive. Divided mind suggests it might help make unconscious motives conscious. Temporal shifting implies it depends on timing and evidence.

  For privileged access: Imaginative pretense shows we can manipulate our own beliefs consciously. Deflationary challenges the idea that we control belief formation. Divided mind suggests parts of the mind are inaccessible. Temporal shifting indicates access depends on when we reflect.

