prompt: |-
  I teach in a philosophy department, and a colleague in the sciences has drafted me for a single seventy-five-minute session in a cross-faculty doctoral methods course. The audience is roughly thirty PhD students drawn from molecular biology, health economics, and epidemiology, none of whom has taken a philosophy course since secondary school, and most of whom will arrive believing that inference to the best explanation is either an ornamental name for what they already do in the lab or a soft, pre-Bayesian gesture in the direction of rigour. I have taught the topic to philosophy students often enough, but this room is different: they will not be moved by the mere form of the inference, only by whether it earns its keep, and they will be quietly resistant to the thought that the explanatory virtues — unification, simplicity, consilience, the absence of contrivance — might come apart from the probability that the hypothesis is true. My aim is not to convert them to anything. I want them to leave able to state the inference, to see why comparing candidate explanations is doing work that likelihoods alone do not do, to hold apart the inference as a story about how hypotheses are actually generated from the inference as a rule about which of them to believe, and to feel the pull of the objection that we are only ever choosing the best of the candidates we happen to have hit upon. There is a whiteboard and no projector, so anything I want them to see has to be built in front of them.

  I do not want a lecture outline or a handout; I want the teaching plan. Give it to me as exactly five numbered items, each a sentence or two, with no introduction or conclusion. First, the order in which the components must come — what has to be in place before what, and which later idea collapses if it is introduced too early; I am particularly unsure whether the distinction between an explanation's being attractive and its being likely to be true should arrive before or after they have worked through a case, and whether they need the notion of a rival hypothesis made explicit before or after they have felt the need for it. Second, the single example that should carry the whole session: what it must have and what it must lack, why it should come from outside the audience's own disciplines, and why not the obvious candidates — the diagnostician, the detective, and the celebrated historical episodes that everyone reaches for. Third, the misconceptions to expect and the exact point in the sequence where each should be headed off, including the one I expect to be hardest to dislodge, that the explanatory virtues amount to a list of aesthetic preferences with no evidential standing, and the related one that a formal probabilistic treatment simply supersedes the whole business. Fourth, the one question to put to them at the end that would show whether the inference has landed rather than merely been memorised. Fifth, what I should openly refuse to cover at this level, and how to say so without the refusal looking like evasion.
reasoning: |-
  Okay, the user is a philosophy professor preparing a one-time session for science PhD students on inference to the best explanation (IBE). These students come from molecular biology, health economics, and epidemiology, with minimal philosophy background. They likely see IBE as just a fancy term for what they already do or as outdated compared to Bayesian methods. The professor wants them to understand IBE's structure, why explanatory virtues matter beyond probabilities, the distinction between hypothesis generation vs. belief, and the limitation of only comparing available hypotheses. 

  Hmm, the key challenges are their skepticism about non-probabilistic reasoning and the risk of them dismissing explanatory virtues as subjective. The professor needs concrete examples they can't easily map to their usual workflows. The whiteboard-only constraint means visuals must be built live, so examples need simplicity and step-by-step decomposition. 

  For the structure: The distinction between explanatory appeal and probability must come after a case study—let them feel the tension first. Rival hypotheses should emerge organically from the example's design. A non-science case avoids triggering disciplinary defenses; something like urban infrastructure failures could work (e.g., power outage causes). 

  Biggest misconceptions: That virtues = aesthetics (counter by linking virtues to predictive power) and that Bayesianism replaces IBE (stress IBE's role in framing hypotheses). The closing question should force application, like designing a flawed IBE. 

  Must refuse Bayesian comparisons—say it's "beyond scope" to avoid seeming evasive. The historical cases (detectives, etc.) are too cliché; avoid them.
answer: |-
  Here is the teaching plan as five numbered items:

  1. **Sequence**: Begin with a concrete, non-scientific puzzle (e.g., "Why did this bridge collapse?"), forcing them to generate rival hypotheses *before* introducing IBE. Elicit their intuitive criteria for choosing one hypothesis over another—*only then* label these as "explanatory virtues." Postpone the distinction between explanatory attractiveness and probability until *after* they’ve committed to a best explanation, allowing the subsequent revelation of new evidence to expose the gap.

  2. **Core Example**: Use a non-disciplinary case with constrained variables (e.g., "A normally punctual colleague is absent: car trouble? Overslept? Secret second job?"). It must have: (a) multiple live rivals, (b) clear but *competing* virtues (simplicity vs. consilience with known habits), and (c) an unexpected twist revealing virtues ≠ truth (e.g., "Security footage shows them entering the building but never leaving"). Avoid diagnostics/detective stories (too familiar) and historical cases (too complex); this forces engagement without disciplinary shortcuts.

  3. **Countering Misconceptions**: At the point where virtues are named, explicitly dissect "simplicity" as *not* aesthetic but *ontological* (fewer *ad hoc* entities/assumptions)—contrast a "secret job" requiring new entities vs. "overslept" reusing known factors. When Bayesianism arises (likely during probability discussion), concede it handles *weighting evidence for fixed hypotheses* but stress IBE’s unique role in *hypothesis generation and comparison*—ask: "How would Bayes assign priors *without* first judging which explanations are *candidates* worth including?"

  4. **Diagnostic Question**: Pose: "Design a flawed IBE for tomorrow’s weather: what rival hypotheses would you omit to make your preferred forecast seem ‘best’?" This tests grasp of candidate relativity and the risk of unseen rivals—not just recalling virtues.

  5. **Explicit Omission**: State early: "We won’t cover formal probability or Bayesian updating today. Not because they’re unimportant, but because our focus is the *prior step*: how we generate and pre-select hypotheses to *feed into* those methods. Without IBE, we’d have nothing to plug into Bayes." Frame it as foundational, not evasive.
