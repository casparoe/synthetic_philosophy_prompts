answer: |-
  Here's my assessment of the answer and the feedback I'd write directly on the script, woven into prose as requested:

  This is a strong answer demonstrating a clear grasp of the core separateness-of-persons objection. You state it precisely in (a): utilitarianism treats gains and losses across distinct persons as fungible in a way analogous to gains and losses within a single life over time, thereby failing to respect the moral significance of individual boundaries. This collapses distinct persons into "one ledger," as you aptly put it. Your application to the village case in (b) is particularly insightful. You correctly identify that Scheme A is the paradigm case of the objection – one household is permanently burdened solely for the aggregate gain of others, making them a mere means. Your analysis of Scheme B is excellent: you rightly note the crucial differences – reciprocity (everyone pays *and* benefits), rotation preventing permanent singling out, and the potential for *ex ante* agreement. Your conclusion that the objection applies to A but not B is well-justified and hits the nail on the head. The point about "a scheme that everyone can agree to in advance" not being exploitative is spot-on.

  Moving to (c), you correctly identify the utilitarian's strongest counter-reply: that refusing to aggregate welfare across persons risks paralysis, making it impossible to justify necessary collective actions like taxation or lifesaving sacrifices. However, your critique of this reply ("it only shows that the alternative is inconvenient") slightly undersells it. The utilitarian isn't just pointing to inconvenience; they argue the alternative (refusing aggregation) leads to intuitively *worse* outcomes or even moral catastrophe (e.g., letting five die to avoid sacrificing one). Your deeper point – that this doesn't *prove* aggregation is the *right* justification, only that it might be practically necessary – is valid, but characterizing it solely as "inconvenient" weakens the force of your otherwise good observation that the utilitarian hasn't proven *why* the sum makes the sacrifice permissible.

  The more significant slip occurs in your claim about the scope of the objection: "I think the objection is really an objection to the hedonic calculus rather than to consequentialism... neither [rule-consequentialism nor prioritarianism] is touched by it." **This is incorrect and the main load-bearing error in part (c).** The separateness-of-persons objection fundamentally targets the structure of *interpersonal aggregation for the greater good*, regardless of the specific currency (pleasure, preference-satisfaction, resources) or level of focus (act vs. rule). Rule-consequentialism *does* aggregate welfare across persons to evaluate rules; a rule that maximises aggregate welfare might still require some individuals to bear significant burdens for the greater good of others. Prioritarianism, while weighting the worse off more heavily, still aggregates weighted welfare across persons; significant losses for some might be justified by sufficiently large, weighted gains for others (especially the many). The objection argues that *any* such interpersonal aggregation fails to respect the distinctness of persons. Your point that prioritarianism "gives extra weight" is correct, but it doesn't escape aggregation – it just weights it differently. Theories genuinely escaping the objection would be those rejecting interpersonal aggregation *entirely* for justification (e.g., strong deontological constraints, contractualism focusing on justification *to* each person). Your suggestion linking the objection to a "heavy metaphysical assumption" about persons being "completely separate" is interesting and touches on deeper debates (like Rawls's use of the objection), but it’s a sophisticated tangent rather than a core requirement of the objection as usually presented (e.g., by Rawls or Nozick), which focuses on the moral significance of distribution *between* persons versus aggregation *within* one life.

  **Mark: 17/20**

  **Feedback for the Script:**

  "Very good work overall. You articulate the separateness-of-persons objection with precision in (a), capturing its core complaint about utilitarianism treating distinct persons like temporal stages of one life and collapsing them into a single ledger. Your analysis of the village schemes in (b) is excellent. You correctly identify Scheme A as the paradigm case where the objection bites hard, and you provide a compelling and nuanced justification for why Scheme B avoids the objection’s force – focusing on reciprocity, rotation, lack of permanent targeting, and the possibility of *ex ante* agreement. This distinction is exactly right and well-explained. In (c), you correctly identify the utilitarian’s strongest counter-reply concerning the risk of paralysis without aggregation, though your characterisation of it as merely showing the ‘alternative is inconvenient’ slightly understates the utilitarian’s point about catastrophic consequences. Your critique that it doesn’t *prove* aggregation is the right justification remains valid. However, your claim that the objection only targets ‘hedonic calculus’ and leaves rule-consequentialism and prioritarianism untouched is mistaken. The objection fundamentally challenges the *interpersonal aggregation of welfare* for the greater good. Rule-consequentialism still aggregates welfare across persons to evaluate rules, potentially imposing significant burdens on some for the aggregate benefit. Prioritarianism, while weighting the worse off, still aggregates *weighted* welfare across persons; it doesn’t reject aggregation itself, just adjusts the weights. The objection applies to *any* theory that justifies burdens for some by appealing to aggregate benefits for others (which includes classic utilitarianism, preference utilitarianism, rule-utilitarianism, and prioritarianism). Your final point about the metaphysical assumption of ‘complete separateness’ is an interesting deeper layer, though the core objection often rests on the moral distinction itself rather than requiring a specific heavy metaphysics. A very strong answer with a clear grasp of the key issues; the error in (c) regarding scope is the main thing holding it back from the top band."
