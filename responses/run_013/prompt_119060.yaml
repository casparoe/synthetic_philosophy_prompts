  We can add one more to use the two careeniums or intervention, but it's not necessary.

  But we have five stipulated cases: we used parasitic (Q1), completeness (Q3), scrambling (Q7), but not two careeniums or intervention. We can incorporate if needed, but the tree works without.

  We can leave as is.

  Where the tree might be wrong:

  - The assignment to epiphenomenalist: if someone says symmballs are real but cannot cause changes in symms, we assign epiphenomenalist. But they might think that symmballs cause other symmball events without causing symm changes? But in the careenium, causing a symmball event requires causing symm changes. So it should be fine.

  - The compatibilist might be misassigned if they are interpreted as saying the symmball level is not the most fundamental. But that's correct for them.

  - The perspectivalist might be placed correctly.

  A consideration that might move a position: 

  - For the eliminativist, if they are shown that without symmball concepts we cannot predict at all in the scrambling regime, they might have to admit utility, becoming non-factualist. But they might still deny reality.

  - For the compatibilist, if they are shown that the same symmball dynamics can be realized by multiple micro substrates (case D), they might move to macro-dominant? But the compatibilist can accept multiple realizability without saying the macro level is more fundamental.

  So I think it's stable.

  Final tree with 5 questions:

  Decision Tree:

  1. **Q1 (Parasitic Symmball)**: "In the case of a parasitic symmball (a stable, recurring clump that does not correspond to any external regularity and is defined solely by our chosen vocabulary), does this symmball exist as a real entity, independent of our descriptive choices?"
     - **No** → Go to Q2.
     - **Yes** → Go to Q3.

  2. **Q2 (Utility)**: "Despite not being real, is the concept of the parasitic symmball practically useful for describing or predicting the behavior of the careenium?"
     - **Yes** → **Position: Non-factualist** (symmball-talk is a useful shorthand but not true of anything).  
       *Hardest commitment: Maintaining that symmball claims lack truth-value even when they track robust patterns.*
     - **No** → **Position: Eliminativist** (symmball-talk states no facts at all; only symms shove).  
       *Hardest commitment: Denying the utility of symmball concepts in cases like the scrambling regime where micro-details are chaotic.*

  3. **Q3 (Causal Efficacy under Completeness)**: "Given that the micro-laws are complete (the future micro-state is fully determined by the current micro-state without symmball-level additions), can a symmball pattern cause changes in the motion or interactions of the symms?"
     - **No** → **Position: Epiphenomenalist** (symmballs are real but causally idle; symms do all the shoving).  
       *Hardest commitment: Accounting for the apparent causal role of symmballs (e.g., in driving external behavior) while insisting they do nothing.*
     - **Yes** → Go to Q6.

  4. **Q6 (Interest-Dependence of Causation)**: "Is the causal efficacy of symmballs (their ability to 'shove' things) dependent on our explanatory interests or choices of description?"
     - **Yes** → **Position: Perspectivalist** (which level 'shoves' is settled by explanatory interests, not the careenium itself).  
       *Hardest commitment: Defending that causal relations are not mind-independent features of the world.*
     - **No** → Go to Q7.

  5. **Q7 (Fundamentality in Scrambling Regime)**: "In the scrambling regime (where micro-details are chaotic but symmball patterns are robustly predictable), is the symmball level the *most fundamental* causal level for explaining symmball patterns? That is, are micro-details merely implementing mechanisms that add nothing to the causal explanation?"
     - **Yes** → **Position: Macro-dominant** (the macro level can be the stronger cause by ignoring irrelevant micro-details).  
       *Hardest commitment: Arguing that coarse-grained causes are objectively stronger despite micro-completeness.*
     - **No** → **Position: Compatibilist** (symmball-causes are genuine and non-competitive with symm-causes; one set of events at different grains).  
       *Hardest commitment: Reconciling symmball causation with micro-completeness without overdetermination.*

  Notes on unresolved divisions and unoccupied branches:
  - The tree assumes that "real" (Q1) and "causal efficacy" (Q3) are binary. A perspectivalist might resist Q1 by saying existence is interest-relative, but the tree forces a "yes" (leading to perspectivalism later). If a respondent insists existence is always perspective-bound, they may answer "yes" (if relative existence counts) or "no" (if only absolute existence counts). The current Q1 phrasing ("independent of our descriptive choices") pushes "no" for perspectivalists, but they might still say "yes" if they interpret "real" as relative. This ambiguity might blur perspectivalism and non-factualism. To fix this, Q1 could explicitly ask about mind-independent reality, but the tree still funnels perspectivalists to Q6/Q7.
  - The "no" branch of Q7 (compatibilist) and "yes" branch (macro-dominant) might be contested. A compatibilist could potentially answer "yes" to Q7 if they conflate "fundamental" with "causally relevant," but the definition provided ("micro-details add nothing to causal explanation") should push compatibilists to "no."
  - No branch leads to incoherent/unattractive combinations (e.g., denying symmball reality while affirming their causal power). These are ruled out by the tree structure.

  Weakest point in the tree:
  - **Q3 (Causal Efficacy)**: Respondents might struggle to parse "cause changes in symms" given micro-completeness. A compatibilist might say "yes, but only via the symms," while an epiphenomenalist says "no." But if "cause" implies downward causation, the question may seem loaded. A "yes" answer might be misinterpreted as endorsing strong downward causation. This could misassign macro-dominant or compatibilist views if respondents are cautious. A single consideration—clarifying that "cause" means "plays a non-redundant role in explanation"—might move epiphenomenalists to "yes" (if they accept explanatory relevance) or compatibilists to "no" (if they reject downward force). The tree assumes respondents distinguish causal from explanatory talk, which may not hold.
  - **Q7 (Fundamentality)**: The idea of "most fundamental causal level" may be ambiguous. A compatibilist might reject the premise, leading to inconsistent answers. If given a clearer example (e.g., "Does explaining a symmball pattern require appealing to micro-details in the scrambling regime?"), it might work better. A "no" could then align with macro-dominance, but compatibilists might say "yes" (micro-details are part of the full story). This could collapse macro-dominant and compatibilist positions if not careful.

  A single consideration that might shift placements:  
  - In Q3, emphasizing that micro-completeness implies that symmball patterns *supervene* on micro-states without adding new forces could push respondents (e.g., compatibilists) toward "no," erroneously landing them in epiphenomenalism. Conversely, stressing that patterns can have *explanatory* force might pull epiphenomenalists to "yes."

  The tree is most likely to misassign compatibilists as macro-dominant (if they accept "most fundamental" in Q7) or perspectivalists as non-factualists (if they answer "no" in Q1). Overall, it covers the six target positions with 5–7 questions per path.
answer: |-
  Below is a decision tree designed to sort readers into one of six positions based on their answers to concrete questions about the careenium. The questions use the stipulated cases (micro-laws completeness, scrambling regime, parasitic symmball, two careeniums, and external intervention) and avoid direct metaphysical terminology. Each branch is a yes/no question phrased for clarity and neutrality. The tree has 7 questions (with 5–7 per path) and 6 leaves (one per position). Unreachable or incoherent combinations are noted at the end.

  ---

  ### Decision Tree

  1. **Start: Parasitic Symmball Reality**  
     "In the case of the parasitic symmball (a stable, recurring clump that doesn't correspond to any external regularity and is defined solely by our vocabulary), does this symmball exist as a real entity, independent of our description?"  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Causal Efficacy under Completeness**  
     "Given the micro-laws are complete (nothing beyond the symm-level state fixes future symm behavior), can a symmball pattern cause changes in the motion or interactions of individual symms?"  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  

  3. **Utility of Parasitic Symmball**  
     "Despite not being real, is the concept of the parasitic symmball useful for describing or predicting the careenium's behavior?"  
     - **Yes** → **Position: Non-factualist** (symmball-talk is a useful shorthand but not true of anything).  
       *Hardest commitment: Denying truth-value to symmball claims even when they reliably track external regularities.*  
     - **No** → **Position: Eliminativist** (symmball-talk states no facts at all; only symms shove).  
       *Hardest commitment: Rejecting symmball concepts in cases like the scrambling regime, where micro-predictions are impossible but symmball patterns are robust.*  

  4. **Robustness in Scrambling Regime**  
     "In the scrambling regime (micro-details chaotic but symmball statistics stable), is the symmball level more informative than the micro-level for predicting future symmball patterns?"  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q7.  

  5. **Reality Check**  
     "Are symmballs real entities (as established in Q1), even if they don't cause changes in symms?"  
     - **Yes** → **Position: Epiphenomenalist** (symmball level is real but causally idle; symms do all the shoving).  
       *Hardest commitment: Explaining why symmballs appear to drive external behavior if they do nothing.*  
     - **No** → *Loop to Q3* (but answers should be consistent; "no" here implies eliminativism, so assign **Position: Eliminativist**).  

  6. **Interest-Dependence of Symmball Causes**  
     "Is the causal role of symmballs (e.g., in forming other symmballs or driving external events) dependent on our explanatory interests or choices of description?"  
     - **Yes** → **Position: Perspectivalist** (which level "shoves" is settled by interests, not the careenium).  
       *Hardest commitment: Defending that causal relations aren't in the world but depend on our perspective.*  
     - **No** → Go to Q7.  

  7. **Intervention Case**  
     "When we intervene externally with a magnet to form a specific symmball, and the symms then drive further symmball changes, is the symmball we formed a genuine cause of those subsequent changes?"  
     - **Yes** → **Position: Compatibilist** (symmball-causes are genuine; no competition with symm-causes, just one set of events at different grains).  
       *Hardest commitment: Reconciling symmball causation with micro-completeness without overdetermination.*  
     - **No** → **Position: Macro-dominant** (symmball level can be the stronger cause; coarse-graining retains causal information lost at micro-level).  
       *Hardest commitment: Arguing that macro-causes are objectively stronger in the scrambling regime, despite micro-chaos being the "implementer".*  

  ---

  ### Notes on Unresolved Divisions and Unoccupied Branches
  1. **Unresolved division between Compatibilist and Macro-dominant**:  
     - These positions diverge on whether coarse-graining *reveals* objective causal strength (Macro-dominant) or merely *describes* non-competitive causes (Compatibilist).  
     - **Further question needed**: "In the two careeniums (same symmball dynamics, different micro-substrates), are symmball-level causes identical and irreducible to micro-details?"  
       - Yes → Macro-dominant.  
       - No → Compatibilist.  
     - **Answerability**: This is answerable (it probes if symmball causes depend solely on dynamics), but may require metaphysical interpretation.  

  2. **Unresolved division between Non-factualist and Perspectivalist**:  
     - Non-factualist denies truth to symmball-talk; Perspectivalist says truth is interest-relative.  
     - **Further question needed**: "Is the parasitic symmball 'real' relative to our vocabulary, even if not absolutely?"  
       - Yes → Perspectivalist (if consistent with later causal-interest answers).  
       - No → Non-factualist.  
     - **Answerability**: Answerable, but requires distinguishing "relative existence" from "useful fiction."  

  3. **Unoccupied branches**:  
     - **"Symmballs unreal but causal"**: Incoherent (Q1 "no" and Q2 "yes" leads to Non-factualist, but causality requires existence).  
     - **"Symmballs real but only sometimes causal"**: Unattractive (no major position holds this; it complicates metaphysics without payoff).  
     - **"Micro-dominant reductionism"**: Covered by Eliminativist/Epiphenomenalist; not a distinct leaf here.  

  ---

  ### Weak Points in the Tree
  1. **Least confident placement**: **Macro-dominant** (assigned via "no" in Q7).  
     - **Why**: The intervention case (Q7) asks if the symmball is a "genuine cause" after external manipulation. Macro-dominant says "no" to emphasize that the symmball's causal strength comes from coarse-grained patterns, not local events. But a reader might say "yes" if they see the symmball as a cause *after* formation, collapsing Macro-dominant into Compatibilist.  
     - **Single consideration to move positions**: If Macro-dominant reintervenes to argue that the *type* of symmball (not the token) is causal, they might answer "yes" in Q7, moving to Compatibilist.  

  2. **Risk of collapsing Perspectivalist and Compatibilist**:  
     - In Q6, Perspectivalist says causation is interest-dependent; Compatibilist says it's objective. But a Compatibilist might answer "yes" in Q6 if they confuse "interest-dependence" with "level-relativity," moving to Perspectivalist.  
     - **Mitigation**: Phrasing Q6 around "explanatory interests" (not "grain") reduces this risk.  

  3. **Overlooked nuance in Epiphenomenalist**:  
     - Assigned via "no" in Q2 and "yes" in Q5, but some might deny reality (Q5 "no") and become Eliminativist. This is consistent but misses Epiphenomenalist's core (real but idle).  
     - **Why it works**: Q5 acts as a guardrail; "no" here implies earlier "real" was mistaken.  

  **Most likely error**: Misassigning **Macro-dominant** as Compatibilist if Q7 is misinterpreted. The tree relies on the intervention case exposing the symmball's local vs. global causal role. If readers focus on the symmball's post-formation stability, they might answer "yes," erasing the distinction.  

  ---

  This tree sorts all six positions using only case-based questions. For the reading group, emphasize that ambiguous answers may require revisiting the stipulations (e.g., completeness in Q2, scrambling in Q4). Positions are defined by their hardest commitments to highlight tensions.
