  So we must design the questions so that the perspectivalist answers yes to Q3? Because in the perspective that includes symmballs, they do cause. So they should say yes.

  Similarly, in Q5, they might say that the symmball level is more informative, and then in Q6 they attribute it to interests.

  So it should work.

  Where the tree might be wrong:

  - I am least confident in the branch after Q5:no. It might be very rare for someone to deny that the symmball level is more informative in the scrambling regime. If that branch is never taken, then we might not get compatibilist. But the compatibilist should say yes to Q5. So perhaps we should remove that branch and assume that everyone says yes to Q5 in the scrambling regime.

  Then we can have:

  After Q3:yes, go to Q6.

  Q6: Is the causal role of symmballs in the careenium dependent on our explanatory interests?

  - Yes: perspectivalist.
  - No: then go to Q7.

  Q7: In the scrambling regime, does the symmball level provide a better causal explanation than the micro level? (Meaning, is it not just more informative but also more causally fundamental?)

  - Yes: macro-dominant.
  - No: compatibilist (both levels are causal, neither is more fundamental).

  But the compatibilist might say that the micro level is more fundamental? But they don't think there is competition. They might say that the symmball explanation is not more fundamental, but it is still causal.

  So:

  - If they say the symmball level is more fundamental: macro-dominant.
  - If not, but they still think it's causal and not dependent on interests: compatibilist.

  So:

  Revised tree for after Q3:yes:

  Q6: Is the causal efficacy of symmballs dependent on our explanatory interests?

  - Yes: Position 6 (Perspectivalist).
  - No: go to Q7.

  Q7: In the scrambling regime, is the symmball level the most fundamental level of causation for symmball patterns? (That is, are the micro-level details merely implementing the symmball causes and not adding to the causal explanation?)

  - Yes: Position 5 (Macro-dominant).
  - No: Position 3 (Compatibilist: both levels are causal and neither is more fundamental).

  Now, the compatibilist would say that the micro level is fundamental in one sense (it's the implementation) but the symmball level is also fundamental in its own way? They might reject the idea of "most fundamental". So they would answer no to Q7.

  So this works.

  Now, the full tree:

  1. Q1 (parasitic symmball): Is it real?
