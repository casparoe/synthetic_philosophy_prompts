answer: |-
  As a libertarian paternalist, I reject the premise that your present and future selves are distinct agents locked in a genuine value conflict. The empirical reality is that under-saving stems from predictable cognitive failures—hyperbolic discounting and present bias—that distort *your own* consistent life-plan. When you say you value retirement comfort but fail to save, it's not a considered judgment favoring present consumption; it's a failure of will and foresight. Our automatic enrollment default doesn't impose an external "good life" vision—it helps you bridge the gap between your *expressed* long-term goal (financial security) and your *behavioral* sabotage of that goal. This is means-paternalism: aligning architecture with ends you already articulate, not ends we impose.

  On autonomy: a well-designed default leverages inertia, not endorsement. The policy doesn’t declare "saving is morally right"; it merely makes your own prior commitment (to retire comfortably) the path of least resistance. You retain full, frictionless opt-out—no coercion, no hidden manipulation. Crucially, if you *actively choose* to prioritize present consumption after reflection, that choice remains equally available. The default corrects a cognitive error in *execution*, not a value judgment. Your future self’s gratitude isn’t engineered—it’s the relief of someone whose coherent life-plan was salvaged from their own myopic impulses.
