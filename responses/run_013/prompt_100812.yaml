answer: |-
  ### Bottom line
  Top-tier mechanisms (5, 6) excel by generating deep antiquity cheaply *and* embedding it seamlessly. Tier 2 (3, 4, 2) offers moderate-high backdating or strong seamlessness but often with higher effort or lower yield. Tier 3 (1, 7) typically scores lower on both yardsticks: state rituals feel artificial, while diaspora myths struggle for domestic traction, limiting their core explanatory weight for manufacturing *national* antiquity within the homeland.

  ### The tiers

  *   **Tier 1 (Highest Explanatory Weight): Mechanisms achieving high backdating yield *and* high seamlessness premium.**
      *   **(5) Retroactive reinterpretation of genuinely old customs:** Leverages authentic, deep-rooted practices, requiring minimal fabrication effort to achieve immense chronological depth and near-perfect seamlessness as the custom itself *is* old, only its *meaning* is new.
      *   **(6) Antiquarian forgery and literary fabrication:** Offers maximal backdating yield – constructing 'evidence' of great antiquity with relatively modest effort – and achieves high seamlessness if accepted, as the 'discovered' artefact or text appears genuinely ancient.

  *   **Tier 2 (Significant but less dominant weight): Mechanisms strong on one yardstick but less so on the other, or requiring higher effort for good results.**
      *   **(3) Print-capitalism and standardised vernaculars:** Creates a shared, historically rooted linguistic community with good seamlessness (language feels natural) but requires substantial effort/capital and achieves backdating primarily by *fixing* and disseminating existing linguistic forms, not inventing deep pasts.
      *   **(4) Bureaucratic homogenisation (schooling, census, maps):** Builds a tangible, lived national consciousness with eventual high seamlessness through daily reinforcement, but its backdating yield is low-to-moderate as it primarily acts *forward* from the present, requiring massive state effort over generations.
      *   **(2) Romantic folk revival (dress, ballad, language):** Generates potent symbols of national essence with moderate backdating yield (linking to an idealised peasant past) but suffers from lower seamlessness; the invented/standardised nature of the revived traditions is often perceptible.

  *   **Tier 3 (Lower Explanatory Weight): Mechanisms generally weaker on one or both yardsticks for core national antiquity within the homeland.**
      *   **(1) State-sponsored ritual invention:** Often achieves moderate backdating yield (linking to symbolic events/founders) but typically scores low on seamlessness; newly minted rituals frequently feel artificial and imposed unless heavily disguised as older traditions.
      *   **(7) Diaspora and exile myth-making:** Can produce powerful narratives of deep origins and suffering with high emotional resonance (good backdating yield *for the diaspora*), but struggles with the seamlessness premium *within the homeland nation* where the myths may feel distant, exaggerated, or externally imposed.

  ### The two yardsticks applied

  **Backdating Yield:** Prioritised mechanisms that generate the *appearance* of significant chronological depth (centuries or millennia) with relatively low investment or complexity. Forgery (6) is king here, creating instant 'proof'. Reinterpretation (5) piggybacks brilliantly on genuine age. Mechanisms like print (3) or bureaucracy (4) create shared identity but don't inherently manufacture deep *antiquity*; their backdating is often derivative. **Seamlessness Premium:** Prioritised mechanisms where the 'antiquity' becomes an unquestioned, naturalised part of the lived national culture. Reinterpretation (5) excels as the symbol *is* genuinely old. Successful forgery (6) also achieves this. Bureaucracy (4) builds seamlessness over time through habituation. **Conflict:** The main tension is between raw backdating potential and believable integration. Forgery (6) has immense yield but risks catastrophic failure (low seamlessness) if exposed. Revivalism (2) consciously creates 'old' symbols but their newness often shows (low seamlessness). Bureaucracy (4) offers strong eventual seamlessness but minimal direct backdating yield. Ritual invention (1) usually fails on seamlessness despite state power.

  ### What would move an item

  *   **Up:** Evidence that **diaspora myths (7)** achieve deep domestic penetration and become naturalised within the homeland (e.g., Armenian diaspora influence on national identity) would significantly increase its weight. Demonstrating that **state rituals (1)** successfully masquerade as discovered ancient practices (e.g., Nazi appropriation of pseudo-Germanic rites) or achieve genuine popular internalisation over time could elevate it. Proving **revivalism (2)** produces traditions indistinguishable from 'authentic' folk practice in public perception would boost it.
  *   **Down:** Evidence that **forgery (6)** consistently fails to convince beyond a small elite or is rapidly debunked would reduce its tier placement. Showing that **reinterpretation (5)** usually requires such extensive, visible state propaganda to attach the *national* meaning that the seamlessness is broken would weaken it. Demonstrating that **print-capitalism (3)** primarily facilitates modern communication without fostering a *belief* in deep shared antiquity would lessen its relevance to this specific process.
