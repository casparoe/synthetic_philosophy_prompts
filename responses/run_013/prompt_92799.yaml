  But wait: the rules are hierarchical in the sense that Rule 102 is a rule about Rule 101. But the amendment rule (Rule 101) applies to all rules. Therefore, unless a rule says otherwise, Rule 101 governs. Rule 102 says otherwise only for Rule 101. So Rule 102 can be changed by Rule 101 (simple majority). Therefore, Ana's change should have been adopted.

