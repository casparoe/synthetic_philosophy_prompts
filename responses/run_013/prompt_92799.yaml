  General principle:
  The rulebook is governed by the rules in force at the time of a proposal. Any rule, including those about amendment, can be changed by the amendment procedure in effect at the time of the change, unless the rule explicitly protects itself and that protection is valid. But note: a rule that protects itself must be adopted under the rules that allow such protection. In the initial setup, Rule 102 did not protect itself, so it could be changed by majority. However, a rule that attempts to make itself unchangeable (like Carla's) cannot be truly unchangeable because the amendment rule at the time of a future change might allow it to be changed. Therefore, entrenchment is only as strong as the current amendment rule allows.

