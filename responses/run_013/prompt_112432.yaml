prompt: |-
  I'm drafting a position statement on the precautionary principle for a policy workshop and want a consistency check before I circulate it. Here is what I hold.

  (1) Where there is a threat of serious or irreversible harm, lack of full scientific certainty is not a reason to postpone cost-effective measures against it.
  (2) The only defensible rule for deciding under uncertainty is to maximize expected value using the best subjective probabilities available; every alternative is either expected value in disguise or a rule that whoever sets the framing can exploit.
  (3) Uncertainty about harms is asymmetric: I would rather wrongly restrict a technology than wrongly wave it through, so the burden of proof belongs on whoever wants to introduce it.
  (4) I reject status quo bias. A risk we already tolerate gets no discount relative to a novel one, and inaction is a choice that counts exactly as much as action.
  (5) Where the probability distribution over damages has a sufficiently heavy tail, expected value alone licenses paying almost any price to reduce the risk, so precaution and (2) converge more than people admit.
  (6) Given the same weak evidence, a regulator should restrict a chemical but should not withhold approval of a drug: the people who die because a treatment is withheld are identifiable and here now, whereas the chemical's victims are diffuse and statistical.

  Audit this. Which commitments are in genuine tension, and how severe is each tension; which pairs only appear to conflict; and what is the cheapest way to make the set consistent, together with what that repair would cost me. Please rank the tensions rather than treating them all as equally bad.
reasoning: |-
  Okay, the user is asking me to audit their position statement on the precautionary principle. They've listed six commitments and want me to identify tensions, rank them by severity, and suggest the cheapest way to make everything consistent. 

  First, I need to understand what they're saying. Point 1 is a standard definition of the precautionary principle - act even without full certainty when there's serious harm. Point 2 is all about maximizing expected value using subjective probabilities. Point 3 introduces asymmetry - they'd rather restrict a technology than allow it by mistake, so burden of proof is on innovators. Point 4 rejects status quo bias - existing risks shouldn't get special treatment. Point 5 says that with heavy-tailed risks, expected value might demand extreme precautions anyway. Point 6 draws a distinction between regulating chemicals and approving drugs, where delaying drugs causes identifiable deaths now.

  Hmm, the biggest conflict jumps out immediately - point 3's asymmetry directly clashes with point 4's rejection of status quo bias. If you treat novel and existing risks equally (point 4), you can't simultaneously say novel risks deserve special burden of proof (point 3). That's a fundamental contradiction in how risk is framed. 

  The second tension is between point 2's pure expected value framework and point 3's asymmetry. Expected value is symmetric - false positives and false negatives are just costs to minimize. But point 3 explicitly values them differently. That's philosophically messy unless you bake the asymmetry into the utility function.

  Point 6 also creates problems. Distinguishing between chemical regulation and drug approval based on identifiability of victims seems arbitrary from an expected value standpoint (point 2). And it might violate point 4's anti-status-quo principle if existing risks get less scrutiny.

  Point 5 actually helps resolve some tension - by showing heavy tails make expected value precautionary anyway, it bridges points 1 and 2. But it doesn't fix the core asymmetry issue.

  For fixes... The cheapest solution is probably reframing point 3 as a special case of expected value where false negatives have higher disutility. That preserves most of their intuition while aligning with point 2. They'd need to admit this asymmetry is subjective, not objective. 

  The status quo bias conflict requires tougher choices. Either drop point 4's strong equality claim and allow some novelty premium, or weaken point 3's burden of proof stance. The first option is cheaper for their framework.

  On point 6, they could argue drug approval involves counterfactual victims - real people dying now versus statistical future lives - making it a utility function difference. But that still needs justification under point 4.

  User seems sophisticated - they're prepping for policy workshop and using terms like "heavy tail." Probably values intellectual rigor over political convenience. The repairs should maintain philosophical coherence while preserving their core concerns about catastrophic risk and regulatory asymmetry.
answer: |-
  Here's a systematic audit of your position statement, ranking tensions by severity, identifying illusory conflicts, and proposing the cheapest repairs:

  ### **Ranked Tensions (High to Low Severity)**
  1.  **Tension: (3) vs. (4) [Severe]**  
      - **Conflict:** (3) demands asymmetric burden of proof against *novel* interventions ("rather wrongly restrict than wrongly wave through"). (4) explicitly rejects status quo bias, insisting existing risks get *no discount* relative to novel ones.  
      - **Severity:** Fundamental. (3) imposes a higher bar for novelty, while (4) demands strict neutrality between old/new risks.  
      - **Repair Cost:** Moderate. Reframe (3) as a consequence of utility asymmetry (not novelty), e.g., "I assign higher disutility to irreversible harms from new technologies than to harms from inaction." This retains asymmetry but decouples it from novelty, aligning with (4).  

  2.  **Tension: (2) vs. (3) [High]**  
      - **Conflict:** (2) requires symmetric maximization of expected value (EV). (3) imposes asymmetric preferences for Type I/II errors ("wrongly restrict > wrongly wave through"), violating EV symmetry.  
      - **Severity:** High. EV optimization treats false positives/negatives as costs to minimize neutrally. (3) weights them unequally.  
      - **Repair Cost:** Low. Clarify that (3) is a *special case of (2)*: bake asymmetry into your utility function (e.g., "irreversible harm has infinite disutility"). Now (3) becomes an EV output, not an exception.  

  3.  **Tension: (6) vs. (2)/(4) [Moderate]**  
      - **Conflict:** (6) treats identifiable victims (drug non-approval) differently from statistical victims (chemical restriction). (2) demands EV maximization (which ignores identifiability), and (4) rejects privileging the status quo (which could include "identifiable" harms).  
      - **Severity:** Moderate. Identifiability bias is psychologically real but normatively contested in EV frameworks.  
      - **Repair Cost:** Low. Justify (6) within EV: argue that systemic uncertainty or political constraints make regulators *less reliable* at weighing diffuse future harms, or that immediate deaths have higher certainty/utility weight. This subsumes (6) under (2).  

  4.  **Tension: (1) vs. (2) [Low]**  
      - **Conflict:** (1) is often interpreted as non-EV (e.g., "avoid worst-case regardless of probability"), while (2) insists EV is the only defensible rule.  
      - **Severity:** Low. Your (5) resolves this by showing EV *can* mandate strong precaution under fat tails.  
      - **Repair Cost:** Minimal. Emphasize (5) explicitly: "Under (1), 'cost-effective measures' are those justified by EV, especially under tail risk (per 5)."  

  ---

  ### **Illusory Conflicts**
  - **(1) vs. (5)**: No conflict. (5) shows *how* (1) can emerge from (2) under specific distributions.  
  - **(2) vs. (5)**: No conflict. (5) is a corollary of (2) for heavy-tailed risks.  
  - **(4) vs. (6)**: No direct conflict. (4) addresses risk *source* (novelty), while (6) addresses victim *identifiability*.  

  ---

  ### **Cheapest Repair Package**  
  1.  **Revise (3)** to:  
      *"I assign higher disutility to irreversible harms from interventions than to reversible harms from inaction, making the expected value of restricting novel technologies often negative."*  
      **Cost:** Loses rhetorical force of "burden of proof" but retains asymmetry within EV. Resolves tensions with (2)/(4).  

  2.  **Clarify (6)** by adding:  
      *"This asymmetry arises because delays in drug approval involve certain, immediate utility losses with known counterfactuals, while chemical risks involve uncertain long-term externalities—a difference captured in expected value calculations via discount rates or harm certainty."*  
      **Cost:** Concedes that (6) is an EV application, not an exception.  

  3.  **Amplify (5)** to bridge (1)/(2):  
      *"Thus, the precautionary principle (1) is not an alternative to expected value (2), but a consequence of it under tail risks or asymmetric utilities."*  

  **Net Cost:** You soften the absolutism of (3) and (6) but gain rigorous consistency. Your core concerns—tail risk precaution, asymmetry, and anti-status-quo—remain intact.  

  ---

  ### **Why This Works**  
  - **Asymmetry** moves from an ontological claim (3) to a subjective utility input (aligned with 2).  
  - **Status quo neutrality** (4) is preserved by decoupling asymmetry from novelty.  
  - **Drug/Chemical distinction** (6) becomes a technical EV nuance, not a contradiction.  
  - **Precautionary principle** (1) is subsumed by EV (2/5), avoiding "maximin" critiques.  

  This leaves you with a **unified EV framework** where:  
  - Fat tails (5) and utility asymmetry (revised 3) drive precaution (1),  
  - Status quo bias (4) is rejected, and  
  - Regulatory distinctions (6) are case-specific EV applications.  

  Would you like refinements to specific points?
