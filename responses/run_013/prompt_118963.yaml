  For structure: Opening should hook with the pageant memory to ground abstraction. Then unpack Du Bois's four principles as lived tensions rather than academic points. Introduce the verdict/warrant distinction organically through examples. Let the central contradiction (pageant as necessary verdict vs ideal warrant) build naturally. Conclude by leaning into discomfort with that final line about the crown.

