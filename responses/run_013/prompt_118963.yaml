answer: |-
  ## On the Weight of Paper Crowns

  Good morning. Thank you for gathering under the banner of “the useful book.” A novelist speaking about usefulness feels rather like a fish lecturing on bicycles. We traffic in the unnecessary, the imagined, the beautifully oblique. Yet here we are. And the question of use, particularly when applied to art, is a knot – intricate, tight, difficult to unpick without snapping the thread.

  It pulls me back to a particular thinker – a man whose life spanned slavery’s shadow and the fierce, uncertain light of the struggle against it. He wrestled publicly, painfully, with the idea of art serving a cause. Not just *whether* it should, but how it *could*, without breaking itself, or the artist, on the wheel of necessity. His writing on this forms a knot I find myself returning to, a tangle of four strands that refuse to lie smoothly together.

  First: He insisted, fiercely, that art *always* serves. It is never truly free-floating. It carries the water for someone, some idea, some vision of the world. To pretend otherwise, he argued, is a luxury. It’s a story the comfortable tell themselves, those whose world feels settled, whose cause, for the moment, seems won. Art breathes the air of its time, and that air is thick with politics, with power, with unspoken demands.

  Second: And yet, crucially, he declared that art serving freedom *must be beautiful*. Not pretty. Not merely pleasing. But possessing that undeniable force, that clarity, that makes truth not just heard, but *seen*, felt in the bone. An ugly truth, clumsily told, he implied, is easily ignored, easily dismissed. Beauty is the weapon that pierces indifference. Without it, the message withers.

  Third: Simultaneously, he championed the absolute freedom of the artist. Not a soldier conscripted to a propaganda unit. Not a spokesman handed a script. Not a tool polished for the group’s respectability, forced to say only the acceptable thing. The artist must follow their own vision, wrestle with their own demons, speak with their own voice, however inconvenient. Otherwise, what is created is dead on arrival.

  And fourth: He acknowledged the brutal reality facing those denied a history, a past they can use. A people stripped of their own stories, their heroes, their sense of shared memory. For them, he argued, spectacle might be necessary. Pageant. Mass forms. The deliberate, careful crafting of myth and memory, built like scaffolding to hold up a collective identity. He didn’t just theorise this. He tried it. He built those scaffolds himself.

  These four demands strain against each other. How can the artist be utterly free while building the necessary myth? Can the deliberately constructed spectacle also be truly, freely beautiful? How does beauty serve the cause without the artist becoming its servant? It’s a knot tightened by urgency, by the weight of history demanding action, and the artist’s soul demanding flight.

  This brings me to a distinction I’ve found myself reaching for, a way to hold these tensions without pretending they vanish. It’s about the *pressure* art exerts on the reader, the viewer, the listener. We often confuse two things when we argue about propaganda in fiction.

  A work delivers a **verdict** when it tells you what to conclude. It points at its characters, its situations, its world, and declares: *This is good. This is evil. This is the lesson. Learn it.* It leaves little room for ambiguity. The judgement is explicit, final. Think of a morality play, a clear political pamphlet, a polemic.

  A work supplies a **warrant** when it shows you the evidence. It lays bare the conditions, the motivations, the complexities, the human cost, the beauty and the ugliness intertwined. It gives you the grounds, the raw material, from which *you* must build your own conclusion. It trusts you to see. It applies pressure, yes, but it’s the pressure of revelation, not instruction. It says: *Look. Look closely. What do you see?*

  My suggestion, my provisional thesis as I grapple with that thinker’s knot, is this: When he said all art is propaganda, he was not demanding verdicts. He was demanding warrants. He was naming the *direction* of the pressure – art pushing towards freedom, towards truth – not demanding the explicit stamp of a judicial sentence. He insisted on the pressure because the cause was urgent, the need desperate. But he insisted on beauty and artistic freedom because only through them could the warrant be compelling, undeniable. A beautiful warrant forces the reader to confront the evidence, to feel the truth, to *arrive* at the conclusion themselves. That’s why it’s not philistinism. It’s faith in the power of the artfully revealed real.

  But. There’s always a but. My thesis hits a snag. A hard, unyielding knot within the knot. The pageant. The spectacle. The deliberate manufacture of memory he deemed necessary, and practised. This is where the fourth strand pulls hardest against the others.

  A pageant, by its nature, leans heavily on verdict. It *presents* the king, the hero, the founding moment. It says: *This is glorious. This is ours. Believe it.* It simplifies. It archetypes. It instructs. It’s a verdict delivered en masse, wrapped in song and colour. How does *this* fit with the demand for warrants, for the artist’s freedom within the beauty? Was he betraying his own complex ideals when he turned pageant-master?

  This tension isn’t academic for me. It smells of candle wax and dusty fabric. My grandmother ran the Christmas pageant at her church. I remember, one cold December evening, being draped in a rough sheet, a flimsy paper crown perched precariously on my head. She adjusted the crown, her hands surprisingly firm. She looked me straight in the eye and said, with absolute seriousness, “You are not *playing* a king. You are *representing* one.” I stood very straight, suddenly aware of the ridiculousness and the weight. I was eight. I felt neither regal nor particularly representative. But the instruction lodged itself deep. I have spent years, decades, turning it over. Was it a warning? A reminder of the gravity, the responsibility of stepping into a role larger than oneself? Or was it a licence? Permission to embody something beyond myself, to become a vessel for a story that needed telling? I still don’t know. Perhaps it was both, inextricably bound.

  That moment, that feeling of standing stiffly under a paper crown, embodies the central difficulty. Representation carries weight. It implies a verdict – *this is worthy of portrayal, this is central to our story*. But the act of representing, truly, demands the warrant – the depth, the humanity, the specific grain of truth that makes the symbol resonate beyond mere instruction. And the artist, the child in the sheet, must somehow be free within that representation, must find their own breath, their own pulse, even while channelling the king.

  So where does that leave the useful book? The book that serves? It leaves us deep inside the knot. It suggests that usefulness isn’t a simple transaction, a message cleanly delivered. It’s messy. It’s fraught. It demands that we hold seemingly impossible things together. The pressure towards a purpose. The uncompromising need for beauty. The inviolable freedom of the maker. And sometimes, the stark, necessary act of building the collective memory from scratch, even if it means starting with the bold, simplifying strokes of the verdict.

  The useful book might be the one that gives us the warrant – the devastatingly beautiful, complex warrant – that allows us to see the world anew and judge for ourselves. That’s the ideal. But the useful book might also, in certain moments, under certain weights of history, *be* the pageant. The necessary assertion of presence, of value, shouted from the rooftops, however simplified, because the silence was too long, too deep.

  Reconciling these? I cannot. My thinker couldn’t. He lived the tension. He wrote the soaring essays demanding artistic freedom and beauty, and he also wrote the pageant scripts. He held the verdict and the warrant in his hands, two weights pulling against each other.

  Perhaps the usefulness lies precisely in the tension. In refusing the easy answer. In acknowledging that serving a cause, making something beautiful, staying free, and building the necessary memory for a people – these are not tasks for a single, simple tool. They demand different tools at different times, and sometimes they demand tools that feel contradictory. The artist navigating this is like that child in the sheet, trying to stand straight under the weight of representation, wondering if they are merely playing or truly embodying, sensing the delicate fragility of the paper crown and the immense gravity of the king it signifies.

  So we write, we read, we gather at festivals like this, not for neat conclusions, but to sit with the weight, to test the knots, to feel the strain between the verdict the world sometimes seems to demand, and the warrant we hope our art can provide. It is difficult, necessary work.

  **The crown is heavy.**
