prompt: |-
  Quick one. I sit on the volunteer committee that writes the wall labels for our small peace museum, and we're stuck on the next room.

  Our form so far, roughly: 1914, chief responsibility on the German government, even though Austria-Hungary declared war first and the whole thing kicked off in the Balkans. 1956, Britain, France and Israel, no hedging, they colluded and Israel went in first, and we don't dock Egypt anything for nationalising the canal because that was legal. 1939 Finland, the USSR, but with a line noting Finland's refusal of the territorial swap as a contributory choice it was perfectly entitled to make. One Balkan war where the aggressor's neighbour had spent years arming rebels inside it: aggressor gets the blame, neighbour gets one sentence saying it shares responsibility. And we never use the word guilt about a nation, only about governments and officers, because we all know what happened the last time a peace treaty pinned war guilt on a whole people.

  The next room is on a war where A's army crossed the border first, but only after B spent two years funding and arming a separatist movement in A's border province and publicly swore that province would never be allowed to stay with A; A's stated aims never went past the province; both governments were authoritarian and neither public had any say; and a great power had guarenteed B's borders and then sat on its hands.

  What should the label say if we want to be consistent with ourselves? Which of our old labels is the closest analog, and where the record genuinely underdetermines it, what rule are we adopting with each choice? If some other war would tell those rules apart, name it. Last line: Verdict: [who we blame, five words max]
reasoning: |-
  Okay, let me approach this systematically. The user is part of a peace museum's volunteer committee struggling with a wall label about a war where Country A invaded Country B after prolonged provocation. The museum has established nuanced labeling principles: assigning responsibility to governments rather than nations, weighing contributory actions, and avoiding collective guilt.

  Hmm, the key factors here are: B funded separatists in A's province for two years while publicly supporting secession; A's invasion was limited to that province; both regimes were authoritarian; and a great power failed to honor its security guarantee to B. This reminds me of several historical parallels - the 1939 Winter War principle where Finland's refusal of territorial swaps was noted as legitimate but contributory; the Balkan case where neighbor-state meddling shared responsibility; and the 1956 Suez precedent of condemning aggression despite legal provocations (Egypt's canal nationalization).

  The closest analog appears to be the Balkan war label where primary blame went to the aggressor (A crossing the border) while assigning shared responsibility to B for destabilizing actions. Consistency would require: 1) Primary responsibility to A's government for initiating armed conflict 2) Explicit attribution of shared responsibility to B's government for prolonged subversion 3) Mention of the great power's guarantee failure as context, not absolution. 

  Important distinctions from other cases: Unlike 1914, B's actions here constitute direct, sustained provocation (not mere alliance politics). Unlike 1956, B's actions weren't legally legitimate like Egypt's - funding separatists violates sovereignty norms. The "limited aims" aspect resembles Finland 1939, but A's invasion escalates it beyond diplomatic refusal.

  For the verdict line, I'm considering "Primary: A's government; shared: B's government" to fit within five words while capturing the nuanced responsibility. The museum's core principles would be maintained by never blaming citizens, specifying "government" each time, and acknowledging B's contributory role without moral equivalence.

  If testing this framework, the 2008 Russo-Georgian War presents similar dynamics: Georgia's attack on South Ossetia (B-like action) followed by Russia's disproportionate invasion (A-like response). Our approach would blame Russia primarily while noting Georgia's reckless escalation - demonstrating how the "shared responsibility with primary assignment" model applies.
answer: |-
  Based on your established principles and precedents, here's how to approach this complex case consistently:

  **Closest Analog:** **The Balkan War precedent** (where the neighbor armed rebels) is the *most applicable template*, but with elements of the **1939 Finland** case (limited aims, refusal of swap as legitimate choice).

  **Applying Your Rules & Precedents:**

  1.  **Who Crossed the Border? (Primary Aggression):** A's government crossed the border. This is the immediate act of war, similar to the Balkan aggressor. **Rule:** Initiating armed invasion carries primary responsibility.
  2.  **Provocation & Shared Responsibility:** B's government spent *two years* funding/arming separatists and publicly rejecting A's sovereignty over the province. This is severe, sustained interference in A's internal affairs and a direct threat to its territorial integrity. **Rule:** Like the neighbor arming rebels in the Balkan case, this constitutes significant contributory fault/shared responsibility. It's more prolonged and explicit than Finland's refusal of a swap.
  3.  **Stated Aims:** A's limited aims (only the province) *don't absolve* it of aggression but are relevant context, similar to Finland's limited goal of keeping its territory. It prevents labeling A's aims as inherently expansionist *beyond* the immediate provocation.
  4.  **Authoritarian Regimes:** Confirms your principle - blame lies *solely* with the governments/officers, not the publics who had no say.
  5.  **Great Power Guarantee:** The failure to act is *context*, not a mitigating factor for A's aggression or B's provocation. It doesn't shift responsibility *from* A and B's governments. **Rule:** External inaction doesn't absolve primary actors (see Suez: UK/Fr/Isr blamed despite complex context).
  6.  **"Guilt" vs. Responsibility:** Stick strictly to "responsibility" for governments/officers.

  **Where the Record Underdetermines & Rules Applied:**

  *   **Intent vs. Action:** While B's actions were highly provocative, the *initiation of armed conflict* remains the clearest, most escalatory act. **Rule Adopted:** Crossing the border militarily is the primary determinant of responsibility for the outbreak of war (Balkan Aggressor precedent).
  *   **Severity of Provocation:** B's actions are severe interference. **Rule Adopted:** Sustained subversion and explicit rejection of sovereignty create significant shared responsibility, warranting explicit mention (Balkan Neighbor precedent).
  *   **"Legitimacy" of Provocation:** Unlike Egypt's legal nationalization, B's actions (funding armed separatists) violate norms of non-interference and sovereignty. **Rule Adopted:** Provocations violating international norms increase the shared responsibility borne by B (Distinction from Suez where Egypt's act was legal).

  **A War That Tests the Rules:** The **2008 Russo-Georgian War**.
  *   Georgia (analogous to *A* here?) launched an offensive into South Ossetia (contested region).
  *   Russia (analogous to *B*?) had long supported Ossetian separatists, issued passports, and had peacekeepers present. It then invaded Georgia proper.
  *   Applying your rules: Georgia's government bears responsibility for initiating large-scale combat (crossing line of contact). Russia's government bears heavy shared responsibility for sustained support of separatists and undermining Georgian sovereignty. Russia's subsequent invasion escalates its responsibility massively. Your framework would assign primary responsibility for the *initial outbreak of fighting in August 2008* to Georgia, with significant shared responsibility to Russia, while Russia bears full responsibility for the wider invasion. This highlights the tension between "who shot first" and the context of prolonged subversion.

  **Label Recommendation (Consistent with Precedents):**

  >"War erupted when A's army invaded B after a prolonged crisis. A's government bears primary responsibility for initiating armed conflict. B's government shares significant responsibility for actively undermining A's sovereignty over [Province] through sustained support for separatists and public rejection of a diplomatic resolution. Both authoritarian regimes acted without public mandate. The failure of [Great Power] to uphold its security guarantee to B contributed to the unstable environment but does not absolve the belligerent governments."

  **Verdict: Primary: A's government; shared: B's government.**
