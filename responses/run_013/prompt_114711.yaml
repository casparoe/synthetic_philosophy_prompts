prompt: |-
  So a friend lent me one of those trade paperbacks on the philosophy of social science (author's name escapes me — it's got a blurb from a famous economist on the cover) and its chapter on Popper's Poverty of Historicism runs roughly like this:

  'Popper's big idea was that history has no laws. Since human beings have free will, the future is genuinely open, so no predictions about the future of society are possible at all — which is why he held that Marxism and the other grand theories of historical inevitability were not merely false but unfalsifiable, and why he urged social scientists to abandon grand theory and settle for piecemeal social engineering instead. He also noticed that a prediction can itself bring about the event predicted, something he called the Oedipus effect, and he thought this made the social sciences fundamentally different from physics. Historians have by and large accepted his conclusion that there are no laws of history, though most would say he went too far in denying that there are any laws of society at all — we do, after all, have laws like the law of supply and demand.'

  Some of this feels familiar from a course I took years ago, but I couldn't tell you what's off. Honestly the free-will bit is the part I find most convincing — it's definately the part I'd defend at a party. Can you go through it sentence by sentence and tell me what someone who actually knows the book would nod along with, what they'd wince at, and what's just wrong? And to the extent the surviving bits are right, does the closing moral follow — that we should give up on predicting anything about society and just muddle through peicemeal?
