prompt: |-
  I'm assembling the adequacy conditions for an interpretation of probability before we evaluate any of the standard positions, and I want the criteria themselves on the table first. Write the desiderata that any interpretation of probability must satisfy to count as adequate: the phenomena it has to explain, the cases it must get right, the distinctions it must preserve, and the results it must not contradict — with the case or consideration that motivates each requirement. Separate genuine requirements from the parochial demands of a single camp; mark which you take to be non-negotiable and which are optional, and state plainly whether any subset of the list cannot be jointly satisfied. Two issues I especially want you to wrestle with. First, whether empirical adequacy — agreeing with observed frequencies and with decision-theoretic use — can be the whole of the requirement, or whether an interpretation must also say what a probability is, given that rival interpretations can agree on every prediction and differ only over what is real. Second, whether the demand that an interpretation cover single, unrepeatable events (one particular radioactive decay, a one-shot bet, the probability that this coin lands heads on its only toss) is a genuine desideratum or an artifact of decision theory, given that our best physics assigns probabilities to individual systems rather than to ensembles. Then briefly score frequentism, subjectivism, and propensity against your list, and say which single requirement does the most work in eliminating contenders.
reasoning: |-
  Okay, the user is asking me to lay out the adequacy conditions for any interpretation of probability. They want a comprehensive list of what such an interpretation must explain, the cases it needs to handle, distinctions it must preserve, and results it shouldn't contradict. I need to be careful to separate genuine requirements from what might just be specific to one school of thought.

  The user specifically wants me to wrestle with two issues: whether empirical adequacy alone is enough, or if we also need an account of what probability "is" ontologically. And whether interpreting probabilities for single unrepeatable events is a legitimate requirement or just an artifact of decision theory.

  I should start by recalling the main interpretations of probability: frequentist, subjective/Bayesian, and propensity theories. Each has strengths and weaknesses based on how they handle different cases.

  For the desiderata, I need to cover several key areas. First, empirical adequacy - the interpretation must match observed frequencies and work in decision theory. This seems non-negotiable since probability is fundamentally about predicting and navigating the world. Then there's the scope requirement - probabilities should apply to both repeatable events (like coin flips) and singular events (like a specific election outcome). Our best physics assigns probabilities to individual quantum systems, so this seems essential.

  The interpretation needs to handle conditional probability properly since it's central to both statistics and Bayesian updating. It should also account for the objectivity/subjectivity distinction - some probabilities feel like facts about the world (like radioactive decay chances), while others feel like degrees of belief (like a surgeon's assessment of success).

  Probability axioms are foundational - any interpretation must satisfy Kolmogorov's rules. The Principal Principle is crucial too - it connects objective chances to rational belief. If an interpretation can't explain why we should align our credences with known chances, it's inadequate.

  For the theoretical role, probabilities function as guides to life - they inform decisions and expectations. This is why decision-theoretic coherence matters. And conceptually, the interpretation should explain what probability statements mean - are they about frequencies, propensities, or beliefs?

  Now for the two special issues. On empirical adequacy vs ontology: While predictive success is vital, rival interpretations can make identical predictions while disagreeing on what probability "is." This ontological question matters for understanding reality - like whether quantum probabilities reflect ignorance or inherent randomness.

  On single-case probabilities: This is a genuine requirement. Quantum mechanics assigns probabilities to individual particles, not just ensembles. Decision theory also requires probabilities for unique events. Frequentism struggles here, while propensity and subjectivism handle it better.

  Scoring the interpretations: Frequentism fails on single cases and the Principal Principle. Subjectivism handles singular events and decision theory well but struggles with objective chances. Propensity gets objective chances right but has issues with clarity and epistemic access.

  The requirement that does the most damage to contenders is single-case probability. It sinks frequentism and challenges others. The Principal Principle is also crucial - it forces interpretations to bridge objective and subjective aspects.

  I should note any tensions: Scope and objectivity together are tough. Frequentism sacrifices single cases; subjectivism sacrifices objectivity. Propensity tries both but lacks precision. No interpretation satisfies all perfectly.

  I'll organize this clearly: first present the desiderata with motivations, mark which are non-negotiable, then address the two special issues, then score the interpretations, and finally identify the most discriminating requirement.
answer: |-
  Here is a systematic breakdown of adequacy conditions for interpretations of probability, designed to be ecumenical yet rigorous. I distinguish non-negotiable requirements (essential for any viable interpretation) from optional/parochial ones, address your two focal issues explicitly, and evaluate major interpretations.

  ---

  ### **Core Desiderata (Non-Negotiable)**
  1.  **Empirical Adequacy (Observational & Predictive Fit):**  
      *   **What it must do:** Recover observed stable frequencies in repeatable experiments (e.g., coin flips, radioactive decay rates) and align with successful decision-theoretic practice (e.g., coherent betting, rational insurance pricing).  
      *   **Motivation:** Probability is fundamentally a tool for predicting and navigating the empirical world. Failure here renders an interpretation practically useless.  
      *   **Status:** Non-negotiable. *However, agreement with frequencies is necessary but not sufficient* (see Scope and Objectivity).

  2.  **Scope (Single-Case & Repeatable Events):**  
      *   **What it must do:** Assign meaningful probabilities to *both* repeatable events (e.g., "probability of heads on a coin toss") *and* single, unrepeatable events (e.g., "probability this *specific* radium atom decays within 1 second," "probability candidate X wins *this* election").  
      *   **Motivation:**  
          *   *Physics:* Quantum mechanics assigns probabilities to individual systems (e.g., a single atom's decay) without reference to ensembles.  
          *   *Decision Theory:* Rational action often concerns unique, high-stakes events (e.g., "probability this surgery succeeds," "probability of war over *this* crisis").  
      *   **Status:** Non-negotiable. Denying single-case probabilities conflicts with scientific practice and decision-theoretic necessity.

  3.  **Conditionality:**  
      *   **What it must do:** Provide a coherent account of conditional probability (P(A|B)) that underpins updating (Bayesian or otherwise), statistical inference, and causal reasoning.  
      *   **Motivation:** Most real-world probability assessments are contextual (e.g., P(rain|dark clouds)). Probability theory is built on conditional relationships.  
      *   **Status:** Non-Negotiable. Failure here breaks the mathematical framework.

  4.  **Adherence to Kolmogorov Axioms (Formal Coherence):**  
      *   **What it must do:** Assign probabilities that satisfy the basic axioms of probability (non-negativity, normalization, finite additivity).  
      *   **Motivation:** This is the minimal mathematical framework defining "probability." Deviations (e.g., negative probabilities) require extraordinary justification and aren't needed for standard applications.  
      *   **Status:** Non-Negotiable. Defines the mathematical object.

  5.  **The Principal Principle / Coordination Norm:**  
      *   **What it must do:** Explain why rational agents should align their degrees of belief (credences) with known objective probabilities (chances). Formally: If you know P(A) = x is the objective chance, then your credence Cr(A) should be x (absent inadmissible information).  
      *   **Motivation:** The indispensable link between evidence and belief. If knowing the chance shouldn't constrain belief, the concept loses its normative force in guiding action and inference.  
      *   **Status:** Non-Negotiable. Connects objective probability to rational subjectivity.

  6.  **Objectivity/Subjectivity Distinction:**  
      *   **What it must do:** Preserve or explain the distinction between probabilities that seem like facts about the world (e.g., "P(decay) for U-238") and those that seem like states of knowledge or belief (e.g., "P(rain tomorrow) based on current data").  
      *   **Motivation:** Scientific practice treats some probabilities as discoveries (like laws) and others as fallible estimates. Denying the distinction obscures crucial epistemic differences.  
      *   **Status:** Non-Negotiable. Reflects core scientific and epistemic practice.

  ---

  ### **Important but Potentially Optional/Contentious Desiderata**
  7.  **Theoretical Role (Guide to Life & Expectation):**  
      *   **What it must do:** Explain how probabilities function as guides to rational decision-making (via expected utility) and forming expectations.  
      *   **Motivation:** Probability's primary practical role is informing action under uncertainty.  
      *   **Status:** Highly desirable, arguably non-negotiable. Closely tied to Empirical Adequacy (Decision Theory). Most interpretations satisfy this.

  8.  **Conceptual Clarity / Ontological Commitment:**  
      *   **What it must do:** Provide a clear account of *what a probability statement attributes to the world or to the agent* (e.g., a long-run frequency, a physical propensity, a degree of rational belief).  
      *   **Motivation:** Interpretations aren't just predictive instruments; they are claims about reality or rationality. Rival interpretations agreeing on all predictions (e.g., Frequentism vs. Propensity in some domains) still differ ontologically.  
      *   **Status:** **Crucial but contentious regarding necessity.** *Addressing your first focal issue:* **Empirical adequacy cannot be the whole requirement.** An interpretation must say *what probability is* because:  
          (a) Science seeks understanding, not just prediction. Knowing "what is real" (e.g., is chance inherent or epistemic?) matters for metaphysics and theory development.  
          (b) Ontological differences can have practical implications in edge cases or new domains (e.g., quantum gravity, unique historical events).  
          (c) It resolves ambiguities in application (e.g., *why* a frequency obtains).

  9.  **Epistemic Access / Measurability:**  
      *   **What it must do:** Explain how we come to know or estimate probabilities.  
      *   **Motivation:** Probabilities must be discoverable to be useful.  
      *   **Status:** Desirable, but strength required varies. Some interpretations make access easier (Frequentism) or harder (some Propensity theories) than others.

  10. **Applicability to Symmetry / Indifference:**  
      *   **What it must do:** Recover or justify the use of symmetry/indifference principles (e.g., assigning P(Heads)=1/2 to a fair coin *a priori*).  
      *   **Motivation:** Foundational for classical probability and simple models.  
      *   **Status:** Optional/Parochial. Important for some interpretations (Logical/Classical), less so for others (Subjectivism, Frequentism).

  ---

  ### **Addressing Your Second Focal Issue: Single-Case Probabilities**
  *   **Is it a genuine desideratum? YES.**  
      *   **Physics Motivation:** Quantum mechanics explicitly assigns probabilities (wavefunction amplitudes squared) to individual systems (e.g., *this* electron in *this* state). Interpreting these as *only* about ensembles is an unnatural reinterpretation contradicting the formalism and standard practice (e.g., preparing and measuring single particles).
      *   **Decision Theory Motivation:** Rational action *requires* probabilities for unique, high-stakes events (e.g., launching *this* spacecraft, *this* medical diagnosis). Denying these probabilities forces an awkward instrumentalism or renders decision theory inapplicable to crucial situations.
      *   **Conclusion:** The demand is not an artifact; it arises directly from fundamental scientific theory and the core application of probability (guiding action under uncertainty). An interpretation failing here is empirically and practically inadequate.

  ---

  ### **Tensions & Joint Satisfiability**
  *   **Scope + Objectivity Distinction + Frequentism:** The core tension. Frequentism struggles mightily with Scope (single-case) and the Objectivity Distinction (it makes *all* probability seem objective, even when based on limited data). This clash is a major driver for rival interpretations.
  *   **Conceptual Clarity + Empirical Adequacy:** Can sometimes pull apart (e.g., Frequentism and Propensity might agree on frequencies, but differ on ontology). This doesn't break joint satisfiability, but highlights the need for clarity *beyond* prediction.
  *   **Principal Principle + Subjectivism:** Subjectivism easily handles the Principal Principle for *known chances*, but struggles to *ground* objective chances within its framework.
  *   **Overall:** The list **can be jointly satisfied**, but no major interpretation perfectly satisfies all non-negotiables without significant caveats or philosophical baggage. Scope and the Principal Principle are the main stress points.

  ---

  ### **Scoring Major Interpretations**
  | Desideratum             | Frequentism                   | Subjectivism (Bayesian)        | Propensity                     |
  | :---------------------- | :---------------------------- | :----------------------------- | :----------------------------- |
  | **Empirical Adequacy**  | ✔️ (Frequencies) ~❌ (DT)     | ✔️ (DT) ~❌ (Frequencies*)     | ✔️ (Frequencies, DT in principle) |
  | **Scope**               | ❌ (Fails single-case)        | ✔️                             | ✔️                             |
  | **Conditionality**      | ~✔️ (Operational issues)      | ✔️ (Core)                      | ~✔️ (Defined via conditionals?)|
  | **Kolmogorov Axioms**   | ~✔️ (Limiting freq issues)    | ✔️                             | ✔️                             |
  | **Principal Principle** | ❌ (No objective chance for single case) | ~✔️ (Needs external chance) | ✔️ (Core strength)             |
  | **Objectivity Distinction** | ~❌ (All prob is objective/frequentistic) | ~❌ (All prob is subjective) | ✔️                             |
  | **Conceptual Clarity**  | ✔️ (Simple)                   | ✔️                             | ❌ (Vague, metaphysical)       |
  | **Epistemic Access**    | ✔️ (In principle)             | ✔️ (Personal)                  | ❌ (Often obscure)             |
  | **Theoretical Role**    | ~❌ (Poor for unique decisions)| ✔️                             | ✔️                             |
  | **Symmetry/Indifference**| ~✔️ (Via hypothetical freq)   | ✔️ (Via priors)                | ~✔️ (Via symmetries)           |

  *(\*Subjectivism *can* recover frequencies via convergence theorems, but doesn't define probability as frequency).*

  ---

  ### **The Most Discriminating Requirement**
  **Scope (specifically, handling single-case probabilities) does the most work in eliminating contenders.** It immediately disqualifies strict Frequentism. It also puts immense pressure on interpretations to provide a coherent ontology for chance in individual instances, which challenges both Frequentism (denies it) and Subjectivism (struggles to ground it objectively). The Principal Principle is a close second, as it forces interpretations to bridge the objective-subjective gap, which is fatal for strict Frequentism and challenging for pure Subjectivism. Together, these two requirements highlight why hybrid or more complex views (e.g., Objective Bayesianism, Humean Best Systems) are often explored.**
