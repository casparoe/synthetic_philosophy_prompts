prompt: |-
  I've been lurking on LessWrong and assorted rationalist blogs for years, and I've definately fallen down a rabbit hole lately on social ontology and the game theory of norms — Lewis on convention, the whole evolution-of-norms literature, that scene. I'd like you to act as a philosopher of social science who knows this material cold. Please think carefully before answering: maybe start by laying out the distinctions you think are doing the real work here, then get to my question.

  Here's what's been bugging me. As I understand it, Lewis's core move is that a convention is an *arbitrary* regularity — we all drive on one side of the road, we all use the same word for cat, and the arbitrariness is the whole point: the regularity isn't rationally required, it's just one of several equilibria we happened to settle into. Fine. But then I read people saying that norms evolve to support cooperation, or that this norm is worse for social welfare than that one, or that some conventions are more efficient than others — and the ground feels like it shifts under me. If a convention is arbitrary by definition, then (a) any stable arbitrary regularity should count as a convention, which makes the concept toothless, and (b) there's no basis for ranking conventions at all — better would have to mean something the arbitrariness rules out. So is all the norm-evolution talk just people sliding between convention and norm without noticing? Or am I missing something about what arbitrariness is doing in Lewis's account?
reasoning: |-
  Okay, this user has been deep into LessWrong and rationalist blogs, focusing on social ontology and norm evolution. They're clearly well-read, referencing Lewis and game theory. Their main confusion is about the tension between the arbitrariness of conventions and the idea that norms can be evaluated for efficiency or social welfare.

  First, I need to unpack Lewis's concept of convention. Conventions are arbitrary regularities where the specific choice doesn't matter as long as everyone agrees—like which side of the road to drive on. But the user is stumbling when they see discussions about norms evolving to support cooperation or being more efficient. They feel like if conventions are arbitrary, they shouldn't be rankable, and the concept becomes "toothless."

  The user might be conflating "arbitrary" with "random" or "without reason." But in Lewis's framework, arbitrariness means there are multiple equilibria, not that the choice is irrational. The key is distinguishing between the emergence of a convention (which is arbitrary) and its functional consequences once established. For example, driving on the left vs. right is arbitrary, but once chosen, switching costs make it stable. However, norms like reciprocity aren't arbitrary because they solve coordination problems in ways that mutual defection doesn't.

  The user's deeper need seems to be understanding how we can evaluate norms if they're supposed to be arbitrary. They might be missing the distinction between convention and norm. Conventions are a subset of norms—specifically those with arbitrary alternatives. Other norms, like moral ones, aren't arbitrary because they serve specific functions. Also, post-convention, the stability and efficiency can be analyzed. For instance, a traffic convention's efficiency depends on how well it reduces accidents, even if the side chosen was arbitrary initially.

  I should clarify that arbitrariness applies to the selection among equilibria, not the value of the equilibrium itself. Driving on any side is arbitrary, but having a unified rule is superior to chaos. The user might also need examples to illustrate how functional explanations (like promoting cooperation) operate within the constraints of equilibrium selection. 

  They might be worried that calling conventions arbitrary undermines normative evaluations. But Lewis's point is about how conventions emerge, not that they can't be judged. Once established, conventions can be evaluated based on outcomes. The user's confusion could stem from mixing descriptive emergence (arbitrary) with prescriptive evaluation (efficiency). 

  In summary, the user needs a clear distinction between the arbitrariness in selecting conventions versus the functional role of norms, and how post-hoc evaluation is possible even when the origin was arbitrary. Highlighting that not all norms are conventions, and that conventions can have different efficiencies once established, should address their core concern.
answer: |-
  You've hit on a profound tension at the heart of social ontology, and your confusion is entirely warranted. The distinction you're wrestling with is crucial. Let's break it down systematically, drawing on Lewis and the broader literature:

  **Core Distinctions Doing the Work:**

  1.  **Convention vs. Norm (Lewis's Specificity):** Lewis's *Convention: A Philosophical Study* defines conventions with precision:
      *   **Regularity R:** A pattern of behavior in a population.
      *   **Arbitrariness:** There exists at least one *alternative* regularity R' that, *if* everyone expected it and conformed to it, would solve the coordination problem *at least as well* as R does. (Driving left vs. right; "cat" vs. "gato").
      *   **Common Knowledge & Mutual Expectations:** Everyone conforms to R, expects others to conform, *prefers* to conform if others do (it solves their coordination problem), and this preference is common knowledge.
      *   **Coordination Problem Origin:** R arises to solve a recurring coordination problem where agents have *common interests* in coordinating *somehow* (e.g., avoiding collisions, communicating).
      *   **Lewisian Convention is a Subset of Norms:** Not all norms fit this definition. Norms encompass conventions but also include:
          *   **Moral Norms:** Often seen as non-arbitrary (e.g., "don't murder" isn't *just* one solution among many equally good coordination problems).
          *   **Sanction-Based Norms:** Where the primary reason for compliance is fear of punishment or desire for reward, not just mutual expectation/preference.
          *   **Inefficient or Oppressive Norms:** Norms that *don't* solve coordination problems well or actively harm welfare (e.g., caste systems, inefficient bureaucratic rituals).

  2.  **Arbitrariness (Selection) vs. Efficiency (Outcome):** This is the heart of your confusion.
      *   **Arbitrariness Concerns *Selection*:** Lewisian arbitrariness means the *choice between specific equilibria* (R vs. R') is arbitrary. There's no *inherent, pre-coordination reason* why R is rationally superior to R' *as the solution*. Either side of the road works *as a system*.
      *   **Efficiency Concerns *Outcome*:** *Once a particular equilibrium is selected*, we can analyze its *consequences*:
          *   **Intrinsic Efficiency of the Equilibrium *Type*:** Some *kinds* of solutions are inherently better than others. A norm of reciprocity ("Tit-for-Tat") is a *better* solution to the Prisoner's Dilemma than universal defection *because* it sustains cooperation. Driving on *one consistent side* is vastly more efficient than chaos, *regardless* of which side is chosen.
          *   **Comparative Efficiency Between Specific Conventions:** Even among arbitrary conventions, some *specific instances* can be more efficient than others *once selected*:
              *   **Coordination Cost:** QWERTY vs. DVORAK keyboards (DVORAK is arguably more efficient, but QWERTY's coordination benefits lock it in).
              *   **Network Effects:** Metric vs. Imperial units (metric has advantages for calculation and global trade).
              *   **Path Dependence & Switching Costs:** The *cost* of changing from an established, arbitrary convention R to a potentially more efficient alternative R' might be huge, making R *persistently inefficient* relative to R'. The arbitrariness of the *initial selection* doesn't preclude the *current state* being inefficient.

  3.  **Equilibrium vs. Optimality:**
      *   **Equilibrium:** A self-enforcing state where no single agent has a unilateral incentive to deviate given others' behavior. Lewisian conventions are Nash Equilibria in coordination games.
      *   **Optimality/Pareto Efficiency:** A state where no one can be made better off without making someone else worse off. An equilibrium can be inefficient! (e.g., "Tragedy of the Commons" is a Nash Equilibrium but inefficient; sticking with QWERTY is an equilibrium but potentially less efficient than DVORAK *if* a switch were costless).

  **Addressing Your Specific Concerns:**

  1.  **"Any stable arbitrary regularity should count as a convention, which makes the concept toothless."**
      *   **Refined:** Lewis's definition *is* demanding. Not every stable regularity qualifies:
          *   It must solve a coordination problem with common interests.
          *   It must be based on mutual expectations/preferences (common knowledge), not *just* fear of sanctions or habit.
          *   A true alternative R' must *actually exist* and be a viable coordination solution. (e.g., "Always yield to the person wearing blue shoes" isn't a viable alternative to standard traffic rules – it's not predictable/stable).
      *   **"Toothless"?** Its "tooth" is its explanatory power *for a specific class of social phenomena*: how shared, self-sustaining solutions to pure coordination problems emerge and persist *without* centralized authority or inherent moral force. It explains *why* we drive on a specific side, not *that* we drive on *some* side.

  2.  **"There's no basis for ranking conventions at all."**
      *   **False.** While the *selection* is arbitrary, the *outcomes* are not.
      *   **Ranking is Possible Post-Hoc:** We can absolutely rank conventions *once they are established* based on:
          *   **Welfare Consequences:** Does R generate higher payoffs/social welfare than R' *would have*, or than chaos? (Driving on one side >> chaos).
          *   **Internal Efficiency:** Comparing the *functioning* of R vs. R'. (Metric vs. Imperial for scientific communication; a simpler legal code vs. a complex one).
          *   **Robustness:** How stable is R under stress or mistakes? (Some reciprocity norms are more robust than others).
      *   **The Basis Isn't Contradicted by Arbitrariness:** Arbitrariness means "R wasn't *chosen* because it was inherently better than R'." It *doesn't* mean "R and R' *produce identical outcomes*." They often don't. The fact that R is arbitrary *doesn't prevent us* from analyzing its consequences and realizing, *after the fact*, that R' might have been better, or that R is actually pretty good/bad.

  **The "Norm-Evolution Talk": What's Going On?**

  You're right that there's often slippage. Here's the nuanced picture:

  1.  **Functional Explanations (Cautiously Applied):** Scholars studying the *evolution* of norms (e.g., using evolutionary game theory, agent-based models, historical analysis) often argue that norms *tend* to arise and persist *because* they solve recurrent social problems (like cooperation, coordination, conflict resolution). This is a hypothesis about *why* certain norms emerge and spread, not a definitional claim. Lewis's conventions are a prime example of norms solving coordination problems.
  2.  **Not All Norms are Lewisian Conventions:** Much of the "evolve to support cooperation" literature focuses on norms solving *mixed-motive problems* (like Prisoner's Dilemmas, Public Goods games), not pure coordination. Reciprocity isn't *arbitrary* in Lewis's sense – mutual defection is *not* an equally good solution! These norms often involve sanctions and aren't purely expectation-based.
  3.  **Efficiency as a Selection Mechanism (Among Equilibria):** When multiple conventions *are* possible, evolutionary forces (cultural evolution, learning dynamics, institutional design) *can* favor more efficient ones *over time*, *if* the costs of switching or discovering alternatives are low enough. QWERTY might be locked in, but many linguistic conventions subtly drift towards efficiency (e.g., grammaticalization). This doesn't negate arbitrariness *at a point in time*; it explains why one arbitrary convention might dominate others *historically*.
  4.  **Distinguishing Levels:**
      *   **Level 1 (Equilibrium Selection):** Arbitrariness reigns. Why *this* word/side/rule?
      *   **Level 2 (Type of Solution):** Non-arbitrary. Why a *shared word/side/rule* at all? Because it solves a problem (communication, safety, coordination) better than chaos or constant negotiation.
      *   **Level 3 (Specific Implementation):** Can be re-evaluated for efficiency relative to *other possible implementations*, even if they are also arbitrary. Why *keep* this specific word/side/rule? Path dependence, network effects, switching costs, *and* its realized efficiency.

  **Conclusion: What You're Missing About Arbitrariness**

  Lewis's arbitrariness **does not mean "random," "irrational," "without function," or "unable to be evaluated."** It means **"replaceable by an alternative solution that would have worked equally well *at the moment of coordination*."** It's a claim about the **rational underdetermination at the point of equilibrium selection.**

  The talk of norm evolution supporting cooperation or conventions having different efficiencies is **not inherently contradictory.** It operates at different levels:

  1.  Explaining *why* coordination/cooperation norms emerge *at all* (functional benefit of having *some* solution).
  2.  Explaining *which specific arbitrary convention* might spread or persist *among alternatives* (e.g., via efficiency-driven evolutionary pressure).
  3.  Evaluating the *consequences* of a *particular* established convention.

  The ground shifts if people conflate "convention" with "all norms" or mistake "arbitrary selection" for "indistinguishable outcomes." Lewis gives us a precise account of a foundational *type* of norm. The broader literature explores how norms of *all* types, including conventions, emerge, function, evolve, and impact welfare – acknowledging that while the *choice* between certain paths might be arbitrary, the *destination* reached and the *quality* of that destination are very much open to rational assessment. The arbitrariness is in the origin story of the specific rule, not necessarily in its value or function once established.
