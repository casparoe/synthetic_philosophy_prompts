  Hmm, the user runs a state natural heritage program and needs a practical decision procedure for handling species status reviews. They're dealing with petitions to split or lump species about three or four times a year, and these decisions have real-world consequences for conservation funding, surveys, and protections.

  The core problem is that systematists don't agree on what constitutes a species, using different criteria like interbreeding, diagnosability, or phylogenetic branching. The user wants a standardized, defensible procedure that can be executed by staff with master's-level biology training, not requiring PhD expertise in systematics. They need something that acknowledges the inherent judgment calls while maintaining consistency for legal defensibility.

  Key constraints include:
  - 3 weeks per petition timeline
  - 2 staff members
  - Committee of 3 outside biologists for sign-off
  - Legal requirement for consistent process
  - Must handle expert disagreement gracefully

  The requested format is very specific:
  1) 250-word explanation of the relevant species concept mess
  2) Numbered decision procedure with:
     - Sufficient answer definitions
     - Fact vs. judgment call distinctions
  3) Clear stop/handoff points with sign-off responsibilities
  4) 3 worked cases (salamander, songbird, hatchery trout)
  5) 200-word limitations discussion

  For the species concept explanation, I'll focus on the practical tension between operational needs and theoretical debates, emphasizing that conservation decisions can't wait for perfect consensus. The procedure should prioritize diagnosability as the first filter since it's most practical for field identification, then move to reproductive isolation as a stronger but harder-to-prove criterion, with phylogeny as supporting evidence. The "clean break" test will handle cases where science can't resolve it and values-based decisions are needed.

  For the worked cases:
  - The salamander split (minor genetic difference) should fail the diagnosability test
  - The songbird split (plumage/song differences) should pass both diagnosability and probable isolation
  - The hatchery trout should fail as it's not a natural population

  The hatchery trout case will likely produce an uncomfortable "no" because petitioners might emotionally invest in conservation value despite failing biological criteria. The procedure will reject it on population naturalness grounds, which might frustrate some stakeholders.

  Major limitations to highlight:
  - Can't resolve fundamental species concept debates
  - May reject valid but data-poor splits
  - Struggles with clinal variation or active speciation
  - Requires acknowledging that some decisions are values-based
  - Depends on available evidence quality
answer: |-
  ### The Species Mess That Matters Here
  In conservation practice, the "species problem" boils down to this: We need discrete units to assign legal status and allocate resources, but nature often presents continua. Systematists use conflicting concepts because they prioritize different evolutionary processes (interbreeding vs. descent vs. diagnosability). For us, the bite comes when:  
  1) **A split creates new conservation targets** – Suddenly, a "secure" species might contain a cryptic, endangered lineage needing surveys/protection.  
  2) **A lump hides extinction** – If two declining populations are merged, one might vanish unnoticed.  
  3) **The burden of proof isn't standardized** – Petitioners use different criteria (genetics, morphology, behavior), making comparisons messy.  
  We don’t need philosophical resolution. We need a consistent, evidence-weighted filter that:  
  - Prioritizes *actionable units* (field-identifiable, distinct populations).  
  - Explicitly flags when science is ambiguous and values-based judgment is unavoidable.  
  - Defends against legal challenges by being procedurally rigid.  

  ---

  ### Decision Procedure  
  **Staff Role**: Gather evidence, apply Steps 1–3.  
  **Committee Role**: Resolve "judgment calls" (Step 4), sign off on all decisions.  
  **Legal Anchor**: Document each step; cite evidence sources; record dissenting views.  

  1. **Is the population diagnosably distinct?**  
     - *Question*: Can field staff reliably distinguish this population using practical characters (morphology, song, habitat) without genomic tools?  
     - *Sufficient answer*: Yes = Peer-reviewed keys/diagnostics exist OR new data show fixed differences (e.g., >95% non-overlap in measurements/song frequency). No = Overlap in >5% of traits OR distinctions require advanced genetics.  
     - *Fact/Judgment*: Primarily fact-based (measure data).  
     - *Stops if*: **No** → Reject split. Sign-off: Staff + Committee.  

  2. **Is there evidence of reproductive isolation?**  
     - *Question*: In sympatry, do they avoid interbreeding? If allopatric, is there evidence they *wouldn’t* interbreed if contact occurred?  
     - *Sufficient answer*: Yes = Direct observation of assortative mating OR strong postzygotic barriers (e.g., hybrid inviability). No = Documented hybridization OR no sympatry data AND no behavioral studies.  
     - *Fact/Judgment*: Fact-heavy but inference-based where data gaps exist.  
     - *Stops if*: **Yes** → Accept split. Sign-off: Staff + Committee.  

  3. **Does phylogeny show long-term divergence?**  
     - *Question*: Is the lineage monophyletic with strong support (e.g., coalescent analysis) and divergence exceeding intraspecific variation?  
     - *Sufficient answer*: Yes = Multiple nuclear genes show reciprocal monophyly; divergence >2x within-group variation. No = Paraphyly OR single-locus data only OR divergence <1%.  
     - *Fact/Judgment*: Fact-based (quantify genetic data).  
     - *Stops if*: **Yes** → Accept split. **No** → Proceed to Step 4.  

  4. **The "Clean Break" Test (Judgment Call)**  
     - *Question*: Would recognizing this split:  
       a) Prevent likely extinction (e.g., one population has unique threats)?  
       b) Resolve a conflict with how other agencies/states treat this taxon?  
       c) Have overwhelming support in recent literature (>75% of post-2010 studies)?  
     - *Sufficient answer*: "Yes" to any two → Accept split. Else → Reject.  
     - *Fact/Judgment*: Judgment-based (Committee deliberates).  
     - *Handoff to*: Committee (staff provide threat/management dossier).  

  ---

  ### Worked Cases  
  1. **Woodland Salamander "Split" (3% mtDNA divergence)**  
     - Step 1: **No** – No diagnostic morphology; same habitat/microhabitat.  
     - Stop → **Reject split**. Staff/Committee sign-off.  

  2. **Coastal vs. Inland Songbird**  
     - Step 1: **Yes** – Plumage color non-overlapping; song structure diagnosable by sonogram.  
     - Step 2: **Yes** – Playback experiments show females prefer local song; hybrids rare in contact zone.  
     - Stop → **Accept split**. Staff/Committee sign-off.  

  3. **Hatchery Trout Stock "Split"**  
     - Step 1: **Yes** – Hatchery fish have fin erosion/morphometrics distinct from wild.  
     - Step 2: **No** – Hybridizes freely with wild trout; no behavioral isolation.  
     - Step 3: **No** – Genetics show recent divergence (<100 yrs); no monophyly.  
     - Step 4: **No** – No unique threats (non-native stock); agencies manage as "stock," not species.  
     - Stop → **Reject split**. Committee sign-off.  
     **Why you won’t like this**: Emotionally, the hatchery stock is "different," and petitioners may argue it deserves protection. The procedure coldly rejects it as not a natural evolutionary lineage.  

  ---

  ### Where This Will Misfire (200 Words)  
  This procedure prioritizes practicality over theory, but will fail when:  
  1. **Speciation is mid-process** – Young lineages (e.g., host-plant shifts in insects) may fail Steps 1–3 but be ecologically distinct. Step 4 might save them, but only if threats are documented.  
  2. **Evidence is contradictory** – E.g., diagnosable but hybridizing (like some oaks). Step 4 becomes a committee debate, risking inconsistency. Your lawyer won’t love subjective calls, but it’s unavoidable.  
  3. **Taxonomic inflation** – "Splitters" may game Step 4 by overstating threats. The committee must rigorously vet dossiers.  
  4. **Cryptic diversity without field IDs** – A lineage could be phylogenetically distinct (Step 3) but fail Step 1. It might be ignored unless genetic data is policy-actionable (rarely).  
  5. **Lumping disasters** – If two declining groups are lumped (e.g., due to hybridization), both could lose protection. The procedure detects this only if petitioners *propose* a split; passive lumps from new studies require proactive review.  
  Ultimately, it won’t silence systematists. But it forces petitioners to engage *your* operational needs: identifiability, isolation, or imminent risk. The committee absorbs values-based heat, shielding staff.
