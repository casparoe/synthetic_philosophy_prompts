answer: |-
  ## The Unmeasurable Margins  
  *(Commencement Address, Delivered with steady eye contact and conversational pacing)*  

  Good morning. Look at you. Caps tilted just so, gowns pooling like ink around your shoes. Twelve years ago, I sat where you sit, buzzing with that terrifying question: *What now? What deserves my one wild life?* I work in global health now, trying to stretch dollars and hours to save lives. And in that world, I met a framework – Importance, Tractability, Neglectedness – often called the ITN framework. It promised a way to weigh causes: how big is the problem? Can progress be made? Is anyone else tackling it? It felt like a compass.  

  Then, last night… I lost an argument. A smart friend cornered me. She said: "Break it down. 'Importance' at the margin? That's the value of one more person or dollar working on it. But *how many* are already working? That’s 'Neglectedness' barging right into the 'Importance' calculation! And 'Tractability'? That’s just *another* flavor of expected marginal value. They aren’t separate levers; they’re the same lever painted three colours. Maybe it’s not a calculator. Maybe it’s just… prompts. A checklist to make your gut feeling look analytical."  

  *(Pause, lean slightly forward)*  

  She had a point. A sharp one. And I couldn’t shake it. Because if she’s right, what am I offering you today? A fancy label for a hunch?  

  But here’s the thing I couldn’t let go of, even after losing the argument: **The framework costs you something.** And that cost? That’s where its power might lie, calculator or not.  

  **First: Importance.** Ask *"How big is the suffering or potential?"* This forces you *out*. Out of your bubble. Out of the immediate, the trendy, the problem conveniently solved by your major. It compels you to look at scale – lives lost, potential unrealized, beauty unmade. It asks you to confront the sheer *weight* of the world’s needs, even if measuring it perfectly is impossible. It demands humility before the vastness. That cost? Comfort. The comfort of not having to see how big the fire really is.  

  **Second: Neglectedness.** Ask *"Who else is showing up?"* This forces a *reckoning*. It confronts your desire to be the hero on the crowded stage. It whispers: ‘See that worthy cause with ten thousand passionate voices? Your unique note might matter less there.’ It pushes you towards the silent corners, the unfashionable problems, the places where your energy isn’t just a drop in an ocean, but rain on parched earth. That cost? Ego. The ego that wants applause and a visible seat at the table.  

  **Third: Tractability.** Ask *"Can we actually move the needle?"* This forces *honesty*. It’s the antidote to well-meaning paralysis or tilting at windmills. It demands pragmatism: ‘Does this lever actually work? Is there a path, however narrow?’ It guards against pouring your life into a beautiful, impossible dream *without a strategy*. That cost? Romanticism. The pure, unadulterated romance of the hopeless cause.  

  *(Shift tone, more grounded)*  

  Is it a precise calculator? My friend might be right. Maybe you *can’t* perfectly isolate the ‘marginal value’ of each factor. Maybe it *is* a structured set of prompts – a disciplined way to interrogate your choices, to challenge your biases, to make your values sweat a little.  

  But so what?  

  Because the *real* cost of using this framework – checklist or not – is **complacency**. It costs you the easy default. The path chosen because it’s lucrative, or prestigious, or simply *there*. It demands you interrogate your choices against something bigger than your immediate desires. Importance yanks your gaze upward to the scale of need. Neglectedness swings your gaze sideways to the landscape of effort. Tractability pulls your gaze down to the dirt – the gritty reality of making change.  

  Use it. Wrestle with it. Let it cost you the easy answer. Let it expose the friction between your passion and the world’s raw need. Let it push you towards causes where the problem is vast, the helpers are few, and a path to progress exists – even if that path is steep and narrow.  

  Maybe it won’t spit out *the* perfect answer. But it will force you to ask better questions than ‘What job pays well?’ or ‘What feels good right now?’ It will ask: ‘What uses *this* life, *these* gifts, against *this* deep need, in *this* moment?’  

  That’s the work. That’s the lifelong commencement. Not finding the algorithm, but embracing the interrogation.  

  So graduate. Go. Seek the vast need. Find the quiet corner where your effort echoes loudest. Dig into the hard soil where progress can actually grow. Pay the cost the framework asks. Wrestle with its imperfections, as I do.  

  And build a life that matters, not because a formula said so, but because you dared to look – really look – at the unmeasurable margins.  

  \answer{May you find the cause that breaks your heart and fuels your hands.}
