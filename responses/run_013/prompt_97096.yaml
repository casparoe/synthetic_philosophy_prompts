answer: |-
  ## Memorandum: Qualifying Exam Appeal - Case #CT-23-07

  **To:** Qualifying Exam Appeals Subcommittee  
  **From:** Dr. [Your Name], Assistant Professor, CS Department  
  **Date:** October 26, 2023  
  **Subject:** Appeal Regarding Question on Church-Turing Thesis - Recommendation: **Overturn Grader's Decision, Award Full Credit**

  **1. Bottom Line Recommendation:**
  *   **Appeal Outcome:** **Overturn** the grader's decision. Award the student **full credit** for the question.
  *   **Reason for Overturn:** The student provided a fundamentally correct and nuanced understanding of the Church-Turing Thesis (CTT) as it is classically understood within computability theory, correctly identifying why it is *not* a mathematical theorem. The grader's interpretation, while reflecting a common *extension* or *reinterpretation* of the CTT, conflates distinct concepts and penalizes the student for accurately articulating the standard philosophical and mathematical framing.
  *   **Future Question Wording:** **Retire this specific true/false wording.** Replace it with questions requiring explanation (e.g., "Explain why the Church-Turing Thesis is not considered a mathematical theorem") or explicitly specify the intended interpretation *within the question* if testing the Physical CTT (e.g., "True or False: The Physical Church-Turing Thesis, stating that any physically realizable process can be simulated by a Turing machine, is an empirical hypothesis."). Provide graders with a clear rubric outlining acceptable explanations.

  **2. Analysis of the Case & Student's Answer:**

  *   **The Student's Argument (Summarized & Assessed):**
      *   **Core Claim (Correct):** The classical CTT ("Every effectively calculable function is Turing-computable") is *not* a mathematical theorem because "effectively calculable" is an informal, intuitive notion lacking a formal mathematical definition *prior* to its identification with Turing computability (or equivalent formalisms). The thesis *is* the proposed bridge between this informal notion and the formal models.
      *   **Supporting Reasoning (Strong & Insightful):** The convergence of formal models (Turing machines, λ-calculus, recursive functions) is presented as evidence supporting the validity of the CTT, not as a mathematical proof of it. This is the standard view.
      *   **Distinction of Concepts (Sophisticated & Correct):** The student correctly distinguishes the *classical* CTT from a *different* hypothesis – the **Physical Church-Turing Thesis** – which posits that any physically realizable computational process can be simulated by a Turing machine. They correctly identify *this* as an empirical hypothesis (albeit one extremely difficult to falsify).
      *   **Example Application (Valid Point):** Their comment on analog networks highlights the distinction between formal models (where certain idealized analog models *can* compute non-Turing-computable functions) and the concept of "effective calculability" constrained by finite, discrete steps. They correctly note that such models often rely on physical idealizations not achievable in reality.

  *   **Grader's Argument (Summarized & Assessed):**
      *   **Core Claim:** The CTT is the "central empirical claim of computer science, on par with a law of nature." A student calling it "true by definition" (or similar) is "refusing to answer."
      *   **Strongest Version of this Position (Stated Fairly):** Proponents of this view argue that the *significance* of the CTT lies precisely in its claim about the fundamental limits of *physical computation* in our universe. They contend that framing it solely as a definitional bridge renders it philosophically sterile and ignores its profound empirical implication: that no physical device, no matter how advanced, can compute beyond the limits of a Turing machine. The convergence of formal models and the failure to find counterexamples in decades of computational practice (despite exploring exotic physics models) is seen as overwhelming empirical evidence for this fundamental physical limit. Dismissing it as "not a theorem" is seen as missing its true import for computer science as a discipline grounded in physical reality.

  *   **Problem with the Grader's Position & Rubric in this Context:**
      *   **Conflation:** The grader's rubric implicitly conflates the **Classical CTT** (a metamathematical/philosophical claim bridging informal and formal notions) with the **Physical CTT** (an empirical claim about physics). While the Physical CTT is *inspired* by the Classical CTT and often informally referred to using the same name, they are distinct propositions with different epistemological statuses.
      *   **Misapplication to the Question:** The exam question explicitly referenced "The Church–Turing thesis," not "The Physical Church-Turing Thesis." Within the standard curriculum of computability theory (the context of the Theory of Computation course and likely the qualifier), "The Church-Turing Thesis" refers overwhelmingly to the *classical* thesis concerning effective calculability. The student correctly addressed *this* thesis.
      *   **Penalizing Correct Understanding:** The student did *not* say the CTT is "true by definition"; they said it *cannot be a theorem* because its premise is informal. This is correct. They *then* discussed the Physical CTT separately, demonstrating deeper understanding. The grader's comment mischaracterizes the student's response and penalizes the accurate standard explanation.
      *   **Makes Question Unanswerable:** By demanding that "The Church-Turing Thesis" be treated as an empirical law of nature in response to a true/false question about it being a theorem, the grader's rubric renders the question ambiguous and unanswerable without mind-reading the examiner's intended (non-standard) interpretation.

  **3. Recommendation & Reasoning:**

  *   **Overturn and Award Full Credit:** The student demonstrated a superior understanding of the nuances surrounding the CTT. They correctly identified the core reason why the classical CTT is not a mathematical theorem, distinguished it from the Physical CTT, and provided relevant supporting arguments. Punishing this nuanced and correct response based on a different interpretation of the thesis is academically unsound and discourages critical thinking. **Full credit is warranted.**
  *   **Split Credit is Inadequate:** The student's answer is not partially correct; it is fundamentally correct on the specific question asked ("Is it a theorem?"). Awarding partial credit would still imply their core point about the thesis's status was wrong. It was not.

  **4. Recommendation for Future Exams:**

  *   **Avoid Ambiguous True/False:** This specific true/false formulation ("The Church-Turing thesis is a mathematical theorem") is inherently problematic and should be **retired**. It invites precisely this confusion.
  *   **Require Explanation:** Replace it with questions **requiring an explanation**. Examples:
      *   "Explain why the Church-Turing Thesis is not considered a mathematical theorem."
      *   "Contrast the status of the Church-Turing Thesis with that of a mathematical theorem like the undecidability of the Halting Problem."
      *   "What is the difference between the Church-Turing Thesis and the Physical Church-Turing Thesis?"
  *   **Specify Interpretation:** If the intent is explicitly to test the Physical CTT, **state it clearly in the question**:
      *   "True or False: The Physical Church-Turing Thesis, claiming that no physically realizable process can compute functions beyond the Turing-computable ones, is an empirical hypothesis." (Then accept either answer with appropriate reasoning about its empirical nature vs. unfalsifiability).
  *   **Provide Graders with a Rubric:** For any question involving the CTT, graders must be provided with a clear rubric that includes:
      *   The standard explanation of why the *classical* CTT is not a theorem.
      *   Recognition of the distinction between the classical and physical theses.
      *   Acceptable alternative phrasings and key points students need to hit for credit.

  **5. Conclusion:**

  The student provided a correct and sophisticated answer addressing the Church-Turing Thesis *as it is standardly presented in computability theory*. The grader applied a different interpretation (the Physical CTT) to a question that did not specify it, unfairly penalizing the student for understanding the standard distinction. Awarding full credit upholds academic integrity and rewards genuine comprehension. Retiring ambiguous true/false questions in favor of explanatory prompts or explicitly specified interpretations will prevent this issue in the future.
