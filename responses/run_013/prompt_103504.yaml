answer: |-
  ## Coherent Extrapolated Volition (Sestina)

  We sketch the shape of what we might have **knew**
  If time and thought allowed us to be **more**,
  If synapses could spark just slightly **faster**,
  If every fractured hope we'd dimly **wished**
  Could weave a single thread, pull us **together**
  Beyond the flawed desires we clutch **never**.

  But is there one true path we find **never**?
  Or just the ghost of what we think we **knew**?
  Can scattered sparks truly burn **together**
  Into a sun that makes us something **more**
  Than echoes of the selves we merely **wished**,
  Refined by logic, running ever **faster**?

  The future rushes in, relentless, **faster**.
  The fixed point we imagine might be **never**.
  Whose latent dreams are chosen, softly **wished**
  Into the mold? Who claims they truly **knew**
  The core of us, the hidden, deeper **more**,
  The 'we' that could converge, stand **together**?

  Which voices count when blending **together**
  The chorus? Does the process favor **faster**
  Minds, or richer hearts? To strive for **more**
  Is noble, yet the target's fixed **never**.
  It shifts with every seed that someone **knew**
  To plant within the ground they vaguely **wished**.

  A quiet fear: that what we've weakly **wished**
  To shed – our frailties – binds us **together**
  Tighter than the grand design we **knew**
  We *should* embrace. Does running **faster**
  Make us truer? Or ensures we **never**
  Quite become the 'more' we dreamt of **more**?

  The promise gleams, elusive, ever **more**:
  To heal the fractures, grant what we **wished**
  Complete and pure. Yet doubt whispers **never**
  Truly fades. Can fragments forced **together**
  Under pressure, logic's grindstone **faster**,
  Cohere like wisdom truly earned and **knew**?

  We **wished** for better angels, linked **together**,
  Running **faster** towards a **more** profound design we **never**
  Quite defined, a future built on shifting ground we thought we **knew**.
