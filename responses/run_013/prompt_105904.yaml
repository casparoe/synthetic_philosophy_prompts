prompt: |-
  You're a philosopher who works on triage ethics and on Taurek-style worries about whether the numbers count. I'm building a case for a handout and I want you to actually construct it, not describe one that already exists. Start with some brainstorming, then write it up.

  Here's the spec. Give me a realistic scenario — one scarce resource, somewhere a person could really be, no trolleys, no rockslides, no six-drowning-vs-one setups — where the usual alignment flips. Normally "the numbers count" tells you to save the bigger group, and Taurek's equal-chance rule leaves you free to save the one. I want the reverse: the numbers-count verdict lands on the smaller group, and Taurek's procedure lands on the bigger one. Keep the scenario to one paragraph.

  Then walk me through it: what each view says and why, which single feature of the case is doing the work, and what happens if I delete that feature — does it just collapse back into the standard one-against-many setup? If getting this to work means "the numbers count" has to mean something more than a raw headcount, that's fine, just say so and run with that version, but flag it for me. Finish with how a Taurek defender would try to defuse the case and whether the defusal actually works. Keep it tight, and don't pad it with a seperate literature review.
