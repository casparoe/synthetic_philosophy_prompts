  Here are five scenes:

  **1.**  
  Martin’s finger traced a column of numbers on the screen. Invoice times, login stamps, delivery logs – all cross-referenced against the master clock sync of the building’s network. His job was friction: finding where claimed time didn’t mesh with recorded time. Discrepancies were his oxygen. Today, he hunted phantom overtime in the warehouse logs. He paused, squinting. A loader’s scanner timestamp – 14:03:17 – conflicted with the security camera footage he’d spot-checked. The camera overlay read 14:03:22. Five seconds. Trivial, probably a sync lag. But Martin flagged it. He needed the camera’s internal clock verified. He emailed Facilities: *“Please confirm calibration status of Camera 14, West Loading Bay. Discrepancy observed.”* He sipped lukewarm coffee, eyes drifting to the old, battery-operated wall clock above the door. Its large, white face, slightly yellowed, showed 2:07 PM. Network time was 14:07:03. Close enough. It always was.

  **2.**  
  Facilities replied: *“Camera 14 syncs to building master clock daily. Master clock syncs to atomic time via satellite nightly. Calibration within 0.1 seconds.”* Martin frowned. The loader swore he scanned the pallet “right when the wall clock ticked over to two-oh-three.” Martin pulled up the camera footage again. At the timestamp 14:03:22, the loader’s hand was clearly placing the scanner back on its dock. The scan itself happened earlier, obscured by shelving. Martin rewound frame by frame. The moment of the scan: the camera’s counter flickered to 14:03:17. He looked up. On the grainy footage, the top corner of the old wall clock was visible. The minute hand was just shy of the ‘3’. It hadn’t “ticked over.” Martin felt a familiar itch. He checked the *actual* wall clock: 2:15 PM. Network: 14:15:01. Fine. Yet… he went back to the footage. The loader glanced at the wall clock *as* he scanned. Martin had always assumed the wall clock was merely approximate, a relic. Now, the loader’s reliance on it felt… odd. Irrational. He sent another email: *“Requesting independent verification of physical wall clock calibration in West Loading Bay.”*

  **3.**  
  The Facilities tech, Brenda, was patient. She brought a digital reference clock. “This pings the satellite,” she said, placing it on Martin’s desk. 14:32:45. They walked to the loading bay. The wall clock read 2:32 PM. “See?” Brenda said. “Minute’s spot on. Seconds? Who cares?” She held her reference clock up. 14:32:52. The wall clock’s second hand swept smoothly past the 10. Brenda tapped the wall clock’s plastic casing. “It’s quartz. Loses maybe a second a month. We adjust it quarterly when we change the batteries. It’s fine for telling break times.” Martin watched the second hand. *Tick. Tick. Tick.* “But is it *regular*?” he asked. “Between adjustments? Could it… stutter? Slow down?” Brenda laughed. “Doubt it. But even if it did, by a fraction? Doesn’t matter. Network time’s the source of truth.” She packed her reference clock. “Anything else?” Martin shook his head. He stared at the wall clock. *Tick. Tick. Tick.* It felt suddenly heavy, stubborn. Its steady sweep wasn’t proof, it was… insistence. He couldn’t *prove* its constancy between quarterly checks. He just… used it. Like everyone else.

  **4.**  
  Martin finished the overtime report. No fraud found; the discrepancy was camera angle and a loader trusting an old clock. He approved the timesheets. But the wall clock lingered. At lunch, he caught himself watching the second hand on his own wristwatch, a cheap digital. The numbers flipped relentlessly. Was *it* perfectly regular? He knew it wasn't atomic-clock precise. He relied on it anyway. To catch the bus. To end his lunch break. He *acted* as if it flowed constantly. Doubting its constancy felt absurd, like doubting the floor would hold him. Yet, the seed was planted. He found himself noticing other clocks – the blinking microwave display, the bank’s digital sign. Each claimed constant flow. None offered proof beyond their own display. He couldn’t audit the flow itself, only the records it left. He felt unmoored, not from reality, but from the silent bedrock beneath his work. Time *passed*. Things aged. Clocks *measured*. That was the riverbed. Now, he sensed only the water rushing over it, swift and indifferent to his need for fixed points.

  **5.**  
  Martin reviewed a travel expense claim. Taxi receipt: 08:15 AM. Flight boarding pass scan: 09:42 AM. Airport was a 35-minute drive. Plausible. He checked the submitted photos. The boarding pass scan timestamp matched the airline’s app record. The taxi receipt… was a photo of a printed slip. Time printed clearly: 8:15 AM. Routine. He almost approved it. Then he saw the background. The passenger’s knee, the taxi seat fabric… and reflected in the taxi’s window, slightly warped, the corner of a building. A familiar, slightly yellowed clock face. The West Bay wall clock. Reflected in the window, it showed approximately 8:20. He zoomed. The minute hand was clearly past the ‘3’, nearing the ‘4’. Not 8:15. The receipt said 8:15. He cross-referenced the flight app. Actual boarding time confirmed as 09:42. The taxi ride *could* still fit… if the receipt time was wrong. He flagged the expense: *“Discrepancy between receipt time and observed wall clock reflection in supporting photo. Please clarify.”* He leaned back. The old wall clock across the office read 11:07 AM. He didn’t check the network time. He took his keys from his pocket, ready for lunch, glancing only at the watch on his wrist as he stood.
