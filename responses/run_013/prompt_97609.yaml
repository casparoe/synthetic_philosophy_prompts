  However, the user might not like that the procedure might say that nonbinary is constitutively constructed and thus must be measured by self-identification, which might be against the wishes of some stakeholders who see sex as strictly biological. So we'll run that.

  Alternatively, the essential worker flag might be the one that breaks because it's temporary and we might not have good data on long-term effects.

  I'll run all three and then highlight the one that might be problematic.

  Let's design the table for the procedure:

