  ### Practical Guidance  
  - **For your 2-week deadline**: Prioritize steps 1-2 first. Fail either? Dump the category or escalate. Steps 3-5 inform *how* to implement, not *whether* (unless step 5 is the only pass).  
  - **Chief statistician handoff**: Use when evidence conflicts with policy demands (e.g., "essential worker" measurement gaps vs. pandemic urgency).  
  - **Negotiation protocol**: Draft operational definitions *with* affected groups *before* testing (e.g., co-design "nonbinary" with LGBTQ+ orgs).  
  - **Misfire mitigation**: Flag low-confidence verdicts (like "essential worker") with a sunset clause (e.g., "retire after 2025 unless revalidated").  

  This procedure forces clarity on what you're *actually* classifying: reality (step 4), agreement (step 3), or policy (step 5). The rest is politics.
