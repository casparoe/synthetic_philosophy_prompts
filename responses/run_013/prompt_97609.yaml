  | 3 | Is the category maintained by collective acceptance? (constitutive) | The category exists because of social agreement and would disappear without it. Evidence: defined by law, norms, self-ID as primary. | Then it might be natural or only causal. Proceed to step 4. | Values call (interpretation of social agreements) |
