  We are turning the philosophy of social construction into a practical decision procedure for a national statistics office. The key distinctions we'll use are:

  1. **Natural kind**: Categories that exist independently of human beliefs and practices (e.g., biological sex as traditionally understood, though note: even this is contested).
  2. **Causally constructed**: Categories that are the effect of social causes (e.g., poverty, which is caused by social and economic structures) but are real in their effects.
  3. **Constitutively constructed**: Categories that exist only because of collective acceptance and practice (e.g., money, citizenship). These are brought into existence by our classification and practices.

  But note: a category can be both causally and constitutively constructed. Also, we must consider that classifying people can change them (looping effect).

  We design a procedure with steps that ask:

  - Is the category already in use in the population? (To avoid creating a category that is purely theoretical and not adopted.)
  - Is there a measurable reality? (Can we observe the category in the world through behavior, identification, etc.?)
  - Is the category maintained by collective acceptance? (If we stopped believing in it, would it disappear? This distinguishes constitutive construction.)
  - Does the category have causal effects? (Does it affect life outcomes? This indicates it's causally constructed and real in its consequences.)
  - Are we trying to redesign the category for a purpose? (This is a values question.)

  We also need to consider downstream effects: if we get the classification wrong, what breaks? And we must note that some questions will be handed off to negotiation with the affected group or to the chief statistician for a values decision.

  The procedure steps:

  **Step 1: Is the category already in use by a significant group?**
     - *Good enough answer*: Evidence from existing surveys, qualitative studies, or administrative data showing that people self-identify with the category or that institutions use it.
     - *If no or unclear*: Then the category is likely not yet socially established. We might skip to step 4 to see if we are trying to create a new category for a purpose (which is a values call). But note: we might be creating a category to help a group become visible (like nonbinary in the past). So if no, we go to step 4.

  **Step 2: Is the category measurable in a way that is stable and reliable?**
     - *Good enough answer*: We have a clear operational definition and a method to measure it (e.g., through self-identification, observation, or administrative records) that has been tested and yields consistent results.
     - *If no or unclear*: Then we must either improve measurement (which may take time) or note that it's not currently measurable. This might lead to a "no" for inclusion until measurement is resolved, unless we are in a situation of constitutive construction where measurement is by self-identification. If it's constitutive, then self-identification is the measure. But if we can't get a stable measure, then we might have to hand off to the chief statistician for a values call on whether to include it anyway.

  **Step 3: Is the category maintained by collective acceptance? (constitutive)**
     - *Good enough answer*: If the category would disappear if people stopped believing in it and acting on it, then it's constitutively constructed. Evidence: the category is defined by rules, laws, or social norms that are agreed upon (e.g., citizenship, marital status). Also, if the category is defined by self-identification and that identification is the primary criterion, then it's constitutive.
     - *If no*: Then it might be a natural kind or causally constructed without being constitutive. We proceed to step 4 to check for causal effects.

  **Step 4: Does the category have causal effects on life outcomes? (causal)**
     - *Good enough answer*: Evidence from studies (even qualitative) showing that having this characteristic affects access to resources, opportunities, health, etc.
     - *If no or unclear*: Then the category might not be socially relevant. We then go to step 5.

  **Step 5: Are we trying to redesign the category for a policy purpose?**
     - *Good enough answer*: A clear policy goal that requires tracking this category, even if it's not yet fully established or measurable. This is a values call.
     - *If no*: Then there's no strong reason to include it. The answer is no.

  **Where the procedure stops:**
  - If at step 1 we get a no and step 5 is also no, then we don't include.
  - If at step 2 we can't measure it and step 5 doesn't override, we don't include.
  - Step 3 and 4 help us understand the nature of the category but don't necessarily block inclusion. However, they inform downstream risks.

  **Handoffs:**
  - If a step is unclear and we are stuck, we hand off to negotiation with the affected group (if identifiable) to ask: How do you understand this category? How should it be measured? What are the consequences of not including it?
  - If the question is about policy purpose (step 5) or if there's a conflict between evidence and values, we hand off to the chief statistician.

  **Judgment calls:**
  - Steps 1, 2, and 4 are fact calls (we look for evidence).
  - Steps 3 and 5 are values calls because step 3 requires interpreting the nature of the social agreement, and step 5 is explicitly about policy goals.

  But note: step 3 (constitutive) might be a fact call if we can observe the collective practices. However, it can be tricky so we mark it as a values call.

  Now, we run the three proposals:

  1. Adding a nonbinary option to the sex question.
  2. Adding an 'essential worker' flag.
  3. Adding a 'food desert' category (I choose this as the third because I expect it might show some challenges).

