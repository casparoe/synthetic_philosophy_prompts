answer: |-
  Here’s a structured 90-minute session plan for al-Ghazali on causation, designed to preempt misconceptions and centre the core ontological argument. British English throughout.

  **Session Goal:**  
  *Not* to explain occasionalism, but to show *why* al-Ghazali dismantles "necessary connection" and what replaces it—without collapsing into "God as mechanical cause" or negating science.

  ---

  ### **I. What Must Be Nailed Down First (15 mins)**  
  Start with **al-Ghazali’s target: the philosophers’ "necessary connection" (لزوم *luzūm*)**.  
  - **Key Text:** *Tahāfut al-Falāsifa* (Incoherence of the Philosophers), Decree 17.  
  - **Crucial Distinction:**  
    - Philosophers: Fire *must* burn cotton by its essence/nature → causal necessity.  
    - al-Ghazali: God *could* make cotton freeze in fire. No *inherent* power in creation.  
  - **Anchor Example: USE FIRE-COTTON** (but frame it *carefully*).  
    - *Why it works:* It’s al-Ghazali’s own example, visceral, and forces the question of "power."  
    - *How to frame it:*  
      > "When al-Ghazali says fire doesn’t ‘burn’ cotton, he’s not saying fire is irrelevant. He’s saying: *The power to ignite isn’t in the fire’s nature*. The fire is *always* just a condition. God creates burning *at the moment* fire touches cotton—or not, if He wills."  

    - **KILL THE MECHANISTIC READING HERE:**  
      > "This isn’t God ‘pushing a button’ instead of the fire. There’s no *mechanism* at all. God creates each event *de novo* when conditions align. No ‘causal chain’—just divine custom (*‘āda*)."  

  **AVOID the video game analogy.** It implies a hidden causal system (code/designer). Al-Ghazali rejects *any* secondary causality—visible *or* hidden.

  ---

  ### **II. Sequence of Misconceptions & How to Head Them Off**  
  *(Timing: 50 mins discussion, structured around rebuttals)*  

  1. **"So he’s Hume with God bolted on?"** (Likely from the economist/undergrad)  
     - **When it arises:** Early, when comparing "no necessary connection."  
     - **Shut it down:**  
       - Hume: We *perceive* regularity but can’t *know* necessity (epistemological scepticism).  
       - al-Ghazali: Necessity *ontologically cannot exist* in creation—it violates God’s absolute power (theological voluntarism).  
       - **Crucial:** For al-Ghazali, God’s consistent action (*‘āda*) makes science possible. Hume has no equivalent.  

  2. **"So nothing is connected, and science is pointless?"** (Physicist/historian)  
     - **When it arises:** When stressing God’s direct action.  
     - **Reframe:**  
       - Science studies patterns in God’s *custom* (*‘āda*), not "laws" *in* nature.  
       - **Analogy:** "Like learning a language’s grammar without thinking words *force* the next word. God ‘speaks’ the world coherently—but each word is new."  
       - **al-Ghazali’s quote:** *"The connection between what is habitually believed to be a cause and what is habitually believed to be an effect is not necessary."* → Habit ≠ necessity.  

  3. **"Quantum indeterminacy proves he was right!"** (Physicist)  
     - **When it arises:** When discussing contingency.  
     - **Shut down firmly:**  
       - Quantum physics still assumes *probabilistic* causality. al-Ghazali denies *all* created efficacy.  
       - **Key point:** Indeterminacy ≠ divine will. This is a category error.  

  4. **The Silent Worry: "If God does everything, isn’t the world just decoration?"**  
     - **Hold this in reserve** until the above are settled (minute 60-65). Then surface it:  
       > "Some worry: If God creates the burning directly, are fire and cotton just… set dressing? Does this make creation meaningless?"  
     - **al-Ghazali’s answer:**  
       - God *chooses* to act *through* conditions (fire, cotton) to make His will intelligible.  
       - Creation is real and significant—but its *power* is derivative, not inherent.  
       - **Analogy:** A playwright’s words *really* kill King Lear—but the actor/dagger are how we see it.  

  ---

  ### **III. Closing Question to Test Understanding (10 mins)**  
  **Pose:** *"Why does al-Ghazali care so much about denying necessary connection? What’s at stake if the philosophers are right?"*  
  - **Answer you want:** If causes were necessary, God would be *constrained* by creation (heresy). His absolute sovereignty requires total voluntarism.  
  - **If they get this,** they’ve moved beyond slogans.  

  ---

  ### **IV. What to Openly Avoid**  
  - **Say this upfront:** "There’s a live debate about whether al-Ghazali is a ‘strict’ occasionalist (like Malebranche) or allows ‘acquisition’ (*kasb*) of acts. We’re bracketing that—today’s focus is his *critique of necessity*, which is unambiguous."  
  - **Flag but don’t explore:** His Ash’arite theology (voluntarism, atomism). Mention it’s context, not our focus.  

  ---

  ### **Why This Works**  
  - **Fire-cotton** stays central (it’s textually essential) but is **demystified early** to avoid "relocated cause" errors.  
  - Misconceptions are **sequenced logically** (epistemological → scientific → theological).  
  - The "silent worry" is **made explicit late**, once groundwork shows creation’s *real but dependent* status.  
  - Closing question **tests grasp of stakes**, not just theory.  

  **Final tip:** Hammer the term **"God’s custom (*‘āda*)"** throughout. It’s al-Ghazali’s answer to "Why doesn’t cotton freeze in fire?"—and bridges theology/science.
