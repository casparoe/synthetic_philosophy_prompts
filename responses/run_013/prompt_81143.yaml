prompt: |-
  I teach a third-year seminar on causal inference -- mixed bunch, mostly stats students plus a couple of philosophers, about 16 of them -- and I've got one 90-minute session to spend on Simpson's paradox. I've taught it the usual way and it's a dud: I put up the two tables, someone says "ah, it's confounding", everyone nods, and they leave with the takeaway "always look at the subgroups", which honestly seems worse than not covering it at all. What I want is an activity where they walk into the reversal themselves, commit to something before they see it, and it costs them a little when it flips.

  My half-formed idea is some kind of committee -- they play admissions officers or a hospital board, we feed them cases in batches, they settle on a policy, and then we re-cut the exact same numbers a different way and the right call reverses. But I can't work out how to make the flips come out of the structure rather than me rigging it, or how to keep the whole thing from collapsing into "so the data lied", which is definately not the lesson.

  So design it for me. Rules and materials, who does what, a timeline for the 90 minutes, the point in the sequence where they have to commit (before they've seen the aggregate, obviously), and a mechanism so the numbers are generated or tabulated by them rather than performed by me. Then the debrief: map each moment of the activity onto the actual moving parts of the idea. The moving parts I care about, roughly in order:

  - that a reversal of this kind doesn't require confounding, and confounding doesn't require a reversal -- I want them to stop using "Simpson's paradox" and "confounding" as synonyms, which is the thing they do now
  - that the arithmetic is boring (it's weighted averages with different weights) and the whole puzzle is about what we're allowed to infer from it
  - the decision-theoretic reading, where it looks like a violation of the principle that if an option is at least as good in every state of the world then it's at least as good overall, and why that reading is tempting and what's actually wrong with it
  - that nothing inside the numbers tells you whether to act on the subgroup view or the aggregate view -- something outside the table settles it, and I want them to feel how unsatisfying that is
  - if there's room, the seperate ethics version: a policy that's better for every subgroup and worse for the population, and whether that's the same problem in different clothes or a genuinely different one

  Tell me what will predictably go wrong the first time I run it -- I'm guessing one group never budges once they've seen the aggregate, and someone games the batch order -- and how to handle that without turning it into a lecture. And be straight with me about which part of the idea the activity can't reproduce and that I'll have to supply myself in the debrief. No readings, I'll sort those out.
reasoning: |-
  We are going to design an active learning activity for Simpson's paradox that meets the instructor's goals. The main idea is to have students play the role of a committee making decisions based on data that they collect and tabulate themselves, and then experience a reversal when the data is aggregated differently.

  **Activity Title:** The Admissions Dilemma

  **Setup:**
  - The class is divided into 4 groups (each of about 4 students). Each group represents an admissions committee for a university.
  - The university has two departments: Department A and Department B. Each department admits students based on their own criteria, but the overall university also wants to ensure fairness and effectiveness.

  **Materials:**
  - We will use two batches of applicants. Each batch contains data on applicants to both departments. The data will be designed so that when looked at by department (the subgroups), one department appears to have a higher admission rate for both batches, but when aggregated, the overall admission rate flips.

    We design two batches (Batch 1 and Batch 2) of applicants. For each batch, we have:

    **Batch 1:**
    - Department A: 10 applicants, 6 admitted (60%)
    - Department B: 10 applicants, 5 admitted (50%)

    **Batch 2:**
    - Department A: 10 applicants, 4 admitted (40%)
    - Department B: 10 applicants, 3 admitted (30%)

    Now, if we aggregate by department (ignoring batches):
    - Department A: 20 applicants, 10 admitted (50%)
    - Department B: 20 applicants, 8 admitted (40%)

    But if we aggregate by batch (ignoring departments):
    - Batch 1: 20 applicants, 11 admitted (55%)
    - Batch 2: 20 applicants, 7 admitted (35%)

    However, note that in each batch, Department A has a higher admission rate than Department B. But overall, Department A has a lower admission rate (50% vs 40%)? Wait, no: in the overall by department, A is 50% and B is 40% so A is higher? That's not a reversal.

    Let me fix the numbers to create the paradox.

    We want:
    - In Batch 1: A has a higher rate than B.
    - In Batch 2: A has a higher rate than B.
    - But overall, when we combine batches, B has a higher rate than A.

    How?

    Let me design:

    **Batch 1:**
      Department A: 100 applicants, 60 admitted -> 60%
      Department B: 10 applicants, 5 admitted -> 50%

    **Batch 2:**
      Department A: 10 applicants, 2 admitted -> 20%
      Department B: 100 applicants, 50 admitted -> 50%

    Now, overall:
      Department A: 110 applicants, 62 admitted -> 56.36%
      Department B: 110 applicants, 55 admitted -> 50%

    But wait, in Batch 1: A (60%) > B (50%)
          Batch 2: A (20%) < B (50%)? Oh, that's not what we want. We want in every subgroup (each batch) that A is better than B? 

    Actually, we want the reversal to happen when we aggregate by department vs by batch? But the instructor wants the reversal to happen when they look at the aggregate without the subgroups? So let me design:

    We want:
    - In each batch, Department A has a higher admission rate than Department B.
    - But overall, Department A has a lower admission rate than Department B.

    So:

    **Batch 1:**
      A: 80 applicants, 40 admitted (50%)
      B: 20 applicants, 10 admitted (50%) -> same? Not good.

    Let me try:

    Batch 1:
      A: 100 applicants, 60 admitted (60%)
      B: 100 applicants, 50 admitted (50%)

    Batch 2:
      A: 20 applicants, 10 admitted (50%)
      B: 80 applicants, 40 admitted (50%) -> again same.

    We need a scenario where the department that is more selective in each batch has a lower overall rate because it gets more of the batch with lower admission rates.

    Standard example:

    Batch 1 (say, early applicants): 
      A: 100 applicants, 80 admitted (80%)
      B: 50 applicants, 40 admitted (80%) -> same? Not good.

    Let me use:

    **Batch 1 (early decision):**
      Department A: 100 applicants, 60 admitted (60%)
      Department B: 100 applicants, 50 admitted (50%) -> so A is better.

    **Batch 2 (regular decision):**
      Department A: 100 applicants, 40 admitted (40%)
      Department B: 100 applicants, 30 admitted (30%) -> again A is better.

    Overall:
      A: 200 applicants, 100 admitted (50%)
      B: 200 applicants, 80 admitted (40%) -> still A is better.

    We need to have the departments have different numbers in the two batches.

    Standard Simpson example:

    Let's have:

    Batch 1 (say, early) is a small batch and Batch 2 (regular) is a large batch.

    **Batch 1 (early):**
      A: 10 applicants, 9 admitted (90%)
      B: 40 applicants, 30 admitted (75%) -> so A > B

    **Batch 2 (regular):**
      A: 40 applicants, 20 admitted (50%)
      B: 10 applicants, 4 admitted (40%) -> A > B

    Now overall:
      A: 50 applicants, 29 admitted (58%)
      B: 50 applicants, 34 admitted (68%) -> so B > A.

    Perfect.

    So we use:

    Batch 1 (early decision): 
      - Department A: 10 applicants, 9 admitted (90%)
      - Department B: 40 applicants, 30 admitted (75%)

    Batch 2 (regular decision):
      - Department A: 40 applicants, 20 admitted (50%)
      - Department B: 10 applicants, 4 admitted (40%)

    Overall by department:
      A: 50 applicants, 29 admitted (58%)
      B: 50 applicants, 34 admitted (68%)

    So overall, Department B has a higher admission rate.

  **How we present the data to students:**
  We don't give them the aggregate. We give them the data per batch and per department within the batch. But we present it as two separate sets of applications (two batches) that they evaluate in sequence.

  **Activity Flow (90 minutes):**

  1. **Introduction (10 minutes):**
     - Explain the scenario: The university has two departments (A and B). Each group is the admissions committee for the entire university. They will review applications in two batches (Batch 1: early applicants, Batch 2: regular applicants). They must decide, after each batch, which department is doing a better job at admitting qualified candidates (based on admission rates). 
     - Then, at the end, they will be asked to make an overall judgment about which department is more lenient (or effective) in admissions.

  2. **Batch 1 Review (20 minutes):**
     - Hand out Batch 1 data (without the admission rates pre-calculated). Give each group a set of 50 applications (represented by cards or a list) for Batch 1. The cards should indicate the department (A or B) and the decision (admitted or rejected). 
     - For Batch 1:
          - 10 cards for A: 9 marked "Admitted", 1 "Rejected"
          - 40 cards for B: 30 marked "Admitted", 10 "Rejected"
     - Task: Each group must tabulate the admission rates for each department in Batch 1 and decide: "Which department had a higher admission rate in Batch 1?" They must record their answer and be ready to report.

     - After they tabulate, they should see:
          Department A: 9/10 = 90%
          Department B: 30/40 = 75%
          So A is higher.

     - Each group reports. We note on the board: All groups agree A > B in Batch 1.

  3. **Batch 2 Review (20 minutes):**
     - Hand out Batch 2 data: 50 applications.
          - 40 cards for A: 20 "Admitted", 20 "Rejected"
          - 10 cards for B: 4 "Admitted", 6 "Rejected"
     - Task: Same as above. Tabulate admission rates for each department in Batch 2 and decide which had the higher rate.

     - They should get:
          A: 20/40 = 50%
          B: 4/10 = 40%
          So again A > B.

     - Each group reports: A > B in Batch 2.

  4. **Commitment (5 minutes):**
     - Now ask: "Based on the evidence from both batches, which department overall has been more lenient (or effective) in admissions? Department A or Department B?" 
     - They must commit as a group and write down their answer (without doing any calculations) and a brief reason. They should reason: "In every batch, A had a higher admission rate, so overall A must be higher."

     - Collect the commitments. All groups should say A.

  5. **Aggregate Tabulation (10 minutes):**
     - Now tell them: "Let's see the overall picture. Combine both batches and tabulate the overall admission rate for each department."
     - Each group now gets the entire set of 100 applications (or they combine their Batch 1 and Batch 2 data). They tabulate:
          Department A: (9+20) = 29 admitted out of (10+40)=50 -> 58%
          Department B: (30+4)=34 admitted out of (40+10)=50 -> 68%

     - They see: B (68%) > A (58%). This is the reversal.

  6. **Debrief (25 minutes):**
     - Start by asking: "What happened? Did you expect this?" Let them express surprise.
     - Then, guide the discussion with the following points:

       a) **Arithmetic is boring**: 
          - Show the weighted averages: 
            Overall A = (10/50)*90% + (40/50)*50% = 0.2*0.9 + 0.8*0.5 = 0.18 + 0.40 = 0.58
            Overall B = (40/50)*75% + (10/50)*40% = 0.8*0.75 + 0.2*0.4 = 0.60 + 0.08 = 0.68
          - The reversal happens because the weights (number of applicants in each batch) are different for A and B.

       b) **Not about confounding**:
          - Ask: "Is there a confounder here?" They might say the batch (early vs regular) is the confounder. But note: in this case, batch is a stratifying variable. However, we haven't established that batch is causally related to admission. We are just looking at rates.
          - Emphasize: Simpson's reversal can occur without confounding. It's a mathematical phenomenon. Confounding is about the causal structure. We can have confounding without reversal and reversal without confounding.

       c) **Decision-theoretic reading**:
          - They thought: A is better in every state (batch) so it must be better overall. But that's not true because the states have different weights. The principle they used (dominance) fails when we are aggregating by a different variable (department) that has different distributions across batches.

       d) **What outside the table?**:
          - Ask: "Which view is correct? The subgroup (batch) view or the overall view? How do we decide?"
          - The answer depends on the causal question: If we want to know the overall admission rate by department, then the overall is correct. But if we are interested in the department's admission policy, we must note that the batches are different (early vs regular) and the departments have different numbers of applicants in each batch. The overall rate might be misleading if we are comparing the departments' policies because the type of applicants (early vs regular) might be different and the departments might have different proportions of these.
          - The key: We need to know the causal structure. If batch is a collider or a confounder? In this case, batch is a context variable. We might be interested in the direct effect of the department on admission, controlling for batch? Or we might be interested in the total effect? The numbers alone don't tell us which to use.

       e) **Ethics version (if time):**
          - Pose: "Suppose we are considering a policy to increase the admission rate in Department B because it seems to have a lower rate in each batch? But wait, overall it has a higher rate. Is that the same? Or consider: a policy that increases the admission rate in every batch might lower the overall rate? How?" 
          - This is a different problem: it's about how policies affect the composition. If we change the admission policy in B to be more lenient in each batch, then we might attract more applicants in the regular batch (which is harder to get into) and that might lower the overall rate? This is more about dynamics and composition changes.

  **What might go wrong:**
  1. **One group never budges**: They might say, "But in each batch A was better, so A is better overall regardless of the numbers." How to handle: In the debrief, focus on the arithmetic. Make them compute the overall rate and see that B is higher. Then ask: "As an applicant, would you rather apply to A or B? You have a higher chance in B overall." This might shift the perspective.

  2. **Gaming the batch order**: They might try to look at the entire data at once. Prevent this by only giving them one batch at a time. Collect Batch 1 materials before handing out Batch 2.

  3. **Mistakes in tabulation**: Some groups might make calculation errors. Have the answers ready and walk around to help. In the debrief, use the board to show the correct tabulation.

  4. **Unintended conclusion: "data lied"**: Emphasize that the data is the same. The reversal is a property of how we aggregate. The lesson is about the interpretation and the need for causal reasoning.

  **What the activity can't do and must be supplied in debrief:**
  - The activity shows the reversal and the arithmetic, but the deeper causal points (confounding vs reversal, the need for causal diagrams) must be explained in the debrief.
  - The decision-theoretic point (dominance principle) is challenged by the reversal, but the reason (weights) is mathematical. The debrief must connect the dominance principle failure to the weights.

  **Materials to prepare:**
  - 100 cards (or slips of paper) for each group (4 groups, so 400 cards). Alternatively, to save paper, you can have one set per group that they reuse by flipping or have a worksheet with the data. But the physical tabulation is engaging.

    For each group for Batch 1:
      - 10 cards: 9 with "Department A: Admitted", 1 with "Department A: Rejected"
      - 40 cards: 30 with "Department B: Admitted", 10 with "Department B: Rejected"

    For Batch 2:
      - 40 cards: 20 with "Department A: Admitted", 20 with "Department A: Rejected"
      - 10 cards: 4 with "Department B: Admitted", 6 with "Department B: Rejected"

  - Alternatively, use a spreadsheet on laptops if the class is tech-friendly, but physical cards are more engaging.

  **Timeline:**
  - 0-10 min: Introduction
  - 10-30 min: Batch 1 review and report
  - 30-50 min: Batch 2 review and report
  - 50-55 min: Commitment
  - 55-65 min: Aggregate tabulation and reversal
  - 65-90 min: Debrief

  This should create the desired "aha" moment and set up the debrief to cover the key points.
answer: |-
  ### Simpson's Paradox Active Learning Activity: "The Admissions Dilemma"  
  **Goal:** Force students to experience the reversal firsthand, confront their intuition, and dissect why it happens without reducing it to "confounding = Simpson's."  

  ---

  #### **Setup & Materials**  
  - **Students:** 4 groups of 4 (16 students). Each group is an admissions committee for a university with two departments: **Dept. A** and **Dept. B**.  
  - **Materials:**  
    - **Physical cards** (or digital spreadsheets) for applicants. Each card shows:  
      - **Batch number** (Batch 1 or Batch 2)  
      - **Department** (A or B)  
      - **Admission decision** (Admit/Reject)  
    - **Two batches of applicants** (see table below). Numbers are fixed but *students tabulate rates themselves*.  
    - **Whiteboard** to record group decisions.  

  |          | Batch 1 (Early Applicants) | Batch 2 (Regular Applicants) |  
  |----------|----------------------------|------------------------------|  
  | **Dept A** | 10 apps, **8 admits** (80%) | 90 apps, **45 admits** (50%) |  
  | **Dept B** | 90 apps, **54 admits** (60%) | 10 apps, **4 admits** (40%)  |  
  | **Batch Totals** | 100 apps, **62 admits** (62%) | 100 apps, **49 admits** (49%) |  

  **Overall Rates (hidden until debrief):**  
  - **Dept A:** (8+45)/100 = 53%  
  - **Dept B:** (54+4)/100 = 58%  
  👉 *Reversal: Dept A wins in both batches (80% > 60%, 50% > 40%), but Dept B wins overall (58% > 53%).*  

  ---

  #### **Activity Timeline (90 Minutes)**  
  **Step 1: Introduction (10 min)**  
  - Context: "You’re admissions committees. You’ll review applicants in two batches (Early and Regular). Your goal: Decide which department (A or B) has a **higher admission rate** in each batch, then overall. You’ll report your decisions publicly."  
  - **Key rule:** Groups *must* commit to decisions after each batch. No peeking ahead.  

  **Step 2: Batch 1 Review (20 min)**  
  - Give each group **Batch 1 cards** (10 for A, 90 for B).  
  - **Task:**  
    1. Tabulate admission rates for A and B.  
    2. **Commit:** "Which department has a higher rate?" (Write decision on board. *All groups will see A:80% > B:60%*.)  
  - **Predictable issue:** Groups may rush. Push them: "Defend your choice. Why trust this rate?"  

  **Step 3: Batch 2 Review (20 min)**  
  - Collect Batch 1 cards. Distribute **Batch 2 cards** (90 for A, 10 for B).  
  - **Task:**  
    1. Tabulate rates again.  
    2. **Commit:** "Which department has a higher rate *this time*?" (Board shows A:50% > B:40%.)  
  - **Predictable issue:** Someone says, "Dept A is better in both batches!" Nudge: "So what’s your *overall* prediction?"  

  **Step 4: Commitment to Overall Judgment (5 min)**  
  - **Crucial moment:** Groups commit *before seeing aggregate data*.  
  - Ask: **"Based on Batch 1 and 2, which department has a higher admission rate OVERALL? Dept A or B? Justify."**  
    - *All groups will pick A (intuition: "A won both, so A wins overall").*  
  - Record commitments publicly. Build tension: "No calculations yet—just your judgment."  

  **Step 5: Aggregate Tabulation (15 min)**  
  - Give all cards to groups (Batch 1 + Batch 2).  
  - **Task:** "Combine both batches. Calculate **overall admission rates** for A and B."  
  - **Reversal hits:** Groups get Dept A: 53%, Dept B: 58%.  
  - **Predictable issue:**  
    - Some groups double-check arithmetic (good!).  
    - One group may refuse to accept ("But A won each batch!"). Ask: "Should the university reward Dept A or B? Why?"  

  **Step 6: Structured Debrief (20 min)**  
  Map the activity to your learning goals:  

  | **Activity Moment**         | **Conceptual Takeaway**                                  | **Script/Dialogue**                                                                 |
  |-----------------------------|---------------------------------------------------------|------------------------------------------------------------------------------------|
  | Batch 1 & 2 commitments     | **Reversal ≠ confounding:** Confounding isn’t needed for reversal. | "Did you assume a confounder caused this? What confounder? Batch is just a grouping variable—no causal claim yet." |
  | Arithmetic of aggregation   | **It’s about weights:** Reversal comes from skewed sample sizes. | "Show the math: Dept A’s overall rate = (10/100)*80% + (90/100)*50% = 53%. Dept B = (90/100)*60% + (10/100)*40% = 58%. Different weights flipped it." |
  | Commitment to "A wins overall" | **Temptation of dominance principle:** "A better in every state, so better overall." | "Why did you commit to A? The dominance principle feels rational—but it fails here. Why? *Weights aren’t part of the 'state'*." |
  | "Which rate to trust?"      | **Nothing in the data tells you:** External context (causal story) is key. | "Should we reward Dept A or B? Nothing in the table answers this. If batches are contexts (e.g., early vs. regular applicants), what would you need to know to decide?" |
  | Ethics angle (if time)      | **Policy ≠ paradox:** A policy helping each subgroup but hurting overall isn’t Simpson’s—it’s about dynamics. | "What if a policy boosted Dept B’s rate in both batches but *lowered* the overall rate? (E.g., by attracting more low-quality applicants.) That’s a different beast!" |

  ---

  #### **Predictable Problems & Fixes**  
  1. **"The data lied!":**  
     - **Prevent:** Never say "the data changed." Emphasize: "Same data, different groupings."  
     - **Fix:** In debrief, ask: "Did Dept B cheat? Or did we ask the wrong question?"  

  2. **A group won’t budge:**  
     - **Prevent:** Force public commitment upfront. Peer pressure helps.  
     - **Fix:** "Suppose you’re a student. Would you apply to A (53% chance) or B (58%)? Why ignore the overall rate?"  

  3. **Someone games the batches:**  
     - **Prevent:** Physically control card distribution. Don’t reveal Batch 2 until Batch 1 is collected.  
     - **Fix:** "If you suspected a trick, what would you have needed to know beforehand?"  

  4. **Over-focus on arithmetic:**  
     - **Prevent:** Task design makes them do math early (batches), so debrief can focus on inference.  
     - **Fix:** "The math is trivial. Why did we *expect* A to win? What principle failed?"  

  ---

  #### **What the Activity Can’t Teach (Supply in Debrief)**  
  - **Causal diagrams:** The activity *shows* reversal isn’t synonymous with confounding, but you must explicitly:  
    - Contrast Simpson’s (mathematical aggregation) vs. confounding (causal bias).  
    - Explain that **confounding can exist without reversal**, and **reversal without confounding** (e.g., here, batch isn’t a confounder—it’s a collider or just a grouping).  
  - **Formal dominance principle:** Students will *feel* its failure, but you must articulate:  
    - "States" (batches) aren’t equally weighted, so dominance doesn’t apply.  
  - **The "outside the table" decision:** The activity makes this visceral, but you must generalize:  
    - "To choose subgroup vs. aggregate, you need a causal model (e.g., is batch a confounder? mediator?). No statistical test answers this."  

  ---

  **Why This Works:**  
  - Students **generate the reversal** themselves (no "rigged" feeling).  
  - **Commitment** makes the reversal personal ("I was wrong!").  
  - **Physical tabulation** ensures they see the data as objective.  
  - **Debrief** maps their experience to theory, breaking the "confounding = Simpson’s" reflex.  

  **First-Run Advice:** Lean into the chaos. When a group resists, use their skepticism to fuel the debrief. The more they invest in defending "A should win," the harder the reversal hits—and the richer the discussion.
