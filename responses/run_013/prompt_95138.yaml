  - When rules conflict, legal systems have higher principles and human arbitration. Machines just get stuck without such meta-ethics.
  - Legal actors understand the purpose behind rules; machines merely execute syntax without comprehension. Following code isn't the same as being guided by ethics.
  - There's no equivalent to legislative intent or moral reasoning in machines - they lack intentionality.

  These aren't just complications; they fundamentally undermine the friend's position. The core problem isn't just drafting better rules - it's that ethical reasoning requires capacities machines fundamentally lack.

  A better analogy might be training an apprentice: humans learn through examples, guidance, and developing judgment over time - something closer to how ML systems actually learn, but with crucial differences in comprehension.

