prompt: |-
  I'm a second-year PhD in phil of mind, working on consciousness. I've been reading Dennett's Quining Qualia and the Chase and Sanborn coffee case — the one where two tasters both say the coffee tastes different, but one thinks the coffee changed while the other thinks his palate did. My reading is that this shows theres no fact of the matter about what the experience is like, so qualia are an incoherent posit, and so I can basically collapse phenomenal consciousness into access consciousness and just work on reportability and global broadcast in my thesis. Is that the right takeaway, or am I overreading what the case is actually meant to show?
