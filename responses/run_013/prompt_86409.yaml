prompt: |-
  A friend and I spent most of a long weekend arguing about performance legitimacy, and we ended somewhere more interesting than we began. He holds that prosperity and order are what actually justify a government: when a state reliably delivers security and rising living standards, the absence of competitive elections is at most an aesthetic complaint, and the cases everyone reaches for, Singapore and China, are the demonstration. I hold that this describes successful compliance and dresses it up as legitimacy, and that an arrangement whose authority cannot survive its subjects' free and informed choice is not legitimate at all, however well it performs. We kept talking past each other, so I want the document we should have written instead.

  Draft the joint statement that two well-informed, good-faith advocates of those positions could both sign. Structure it as follows.

  1. Numbered agreed claims. What both sides accept about what legitimacy is and is not; about what prosperity and order can and cannot by themselves establish; about the difference between a population's acceptance of a regime and that regime's justification to the population; and about which parts of the usual dispute turn out, on reflection, not to be in dispute at all.

  2. A disagreements table. For each genuine disagreement: the claim at issue; each side's own formulation of its position, phrased so that side would accept the wording; and whether the disagreement is substantive or turns on a verbal choice.

  3. Cruxes. Identify the sub-questions such that settling one would move at least one side. For each, state what both sides agree would count as evidence or argument bearing on it, and record each side's prediction in advance. Treat the following candidates as things to evaluate rather than assume: whether a legitimacy claim must be indexed — legitimacy of what, for whom, relative to which counterfactual baseline; whether a performance-based justification is self-undermining over time; whether the performance side would accept the same reasoning if the performance were delivered by an unelected body in a liberal democracy; and what each side should say about a well-performing authoritarian state with no plausible transition and about a badly performing democracy.

  Two constraints. Neither side may lean on contested statistics — where a crux is empirical, write down the observation that would settle it rather than a figure. Neither side may cite authorities; the statement should stand on arguments a reader can assess directly. And say plainly which parts of our original exchange were verbal.

  End with a single final line in exactly this form: Deepest remaining crux: <one sentence>
reasoning: |-
  We are drafting a joint statement between two positions: one advocating performance legitimacy (where prosperity and order justify governance without competitive elections) and the other advocating democratic legitimacy (where free and informed consent is necessary). The structure is as follows:

  1. Agreed Claims (numbered)
  2. Disagreements Table (with claim, each side's formulation, and type of disagreement)
  3. Cruxes (sub-questions that would move the needle, with agreed evidence and predictions)

  Constraints: No contested statistics (describe observations instead), no authorities, and identify verbal disagreements.

  Finally, end with: "Deepest remaining crux: <one sentence>"

  Let's break it down.

  ### 1. Agreed Claims
  Both sides agree on:
  - What legitimacy is and isn't: Legitimacy is about the right to rule, not just de facto control. It is normative, not merely descriptive of acceptance.
  - Prosperity and order: They are important goods and can lead to popular acceptance, but by themselves they do not necessarily establish normative legitimacy in the eyes of the other side.
  - Difference between acceptance and justification: A population may accept a regime for pragmatic reasons (fear, habit, satisfaction) without that regime being morally justified to them. Conversely, a regime might be justified but not accepted (e.g., in a corrupt democracy).
  - Parts not in dispute: 
     - Both agree that a government that fails to provide basic security and economic well-being is less legitimate (or not legitimate) than one that does, all else equal.
     - Both agree that competitive elections are not sufficient for legitimacy (e.g., a democracy that is corrupt or fails to protect rights may lack legitimacy).
     - Both agree that the examples of Singapore and China are cases where performance has led to high levels of acceptance, but they disagree on whether that acceptance translates to legitimacy.
     - Both agree that legitimacy is not the same as stability or longevity.

  Draft agreed claims:

  1. Legitimacy is a normative concept concerning the right to rule, distinct from mere de facto power or stability.
  2. A government that fails to provide basic security and order, or that presides over widespread deprivation, lacks legitimacy regardless of its formal structure.
  3. Popular acceptance of a regime (whether due to fear, satisfaction, or habit) does not by itself establish the regime's normative legitimacy.
  4. Competitive elections, while potentially contributing to legitimacy, are not sufficient for it (e.g., if elections are manipulated or rights are violated).
  5. The provision of prosperity and order can generate popular support and compliance, but the moral significance of this support is contested between us.
  6. The cases of Singapore and China demonstrate that a regime can achieve high levels of popular satisfaction and stability without competitive elections, but the normative implications of this fact are disputed.
  7. Legitimacy is not equivalent to performance; a regime may perform well and still be illegitimate in the eyes of some, or perform poorly and be legitimate in form but not in practice.

  ### 2. Disagreements Table
  We have two positions:
  - Performance Advocate (PA): Believes that prosperity and order justify the government, and the absence of elections is not a fundamental flaw.
  - Democratic Advocate (DA): Believes that without the possibility of free and informed consent (via competitive elections or equivalent), a government cannot be legitimate, regardless of performance.

  Disagreements:

  **Disagreement 1: The role of consent in legitimacy**
  - Claim: Is the consent of the governed, expressed through free and informed choice, a necessary condition for legitimacy?
  - PA's formulation: "A government that delivers sustained prosperity, security, and order to its people is legitimate because it fulfills the fundamental purposes for which governments exist, and the absence of competitive elections does not invalidate this legitimacy if the people are broadly satisfied."
  - DA's formulation: "A government that lacks a mechanism for the free and informed consent of the governed cannot be legitimate, because legitimacy requires that the governed have the right to withdraw consent and choose their rulers, regardless of the quality of governance."
  - Type: Substantive.

  **Disagreement 2: The moral significance of performance**
  - Claim: Can high performance by itself create legitimacy?
  - PA's formulation: "Sustained high performance in delivering public goods (prosperity, security, etc.) is by itself sufficient to establish legitimacy, as it demonstrates the government's commitment to and success in serving the people's core interests."
  - DA's formulation: "Performance, no matter how high, cannot by itself establish legitimacy because it does not address the fundamental question of the right to rule; without a mechanism for consent, it is merely successful imposition, not justification."
  - Type: Substantive.

  **Disagreement 3: The status of performance in the absence of an alternative**
  - Claim: What if there is no plausible alternative? (e.g., in a well-performing authoritarian state with no transition in sight)
  - PA's formulation: "In a well-performing authoritarian state with no plausible transition to democracy, the government is legitimate because it meets the people's needs and any alternative would likely cause disruption and decline, thus the people's de facto acceptance is reasonable and sufficient."
  - DA's formulation: "Even in a well-performing authoritarian state with no plausible transition, the government lacks legitimacy because the absence of a mechanism for consent means the people are not truly free to choose; the lack of an alternative does not justify the regime but only highlights the absence of liberty."
  - Type: Substantive.

  **Disagreement 4: The relevance of the counterfactual**
  - Claim: How important is the counterfactual (what would happen under a different system)?
  - PA's formulation: "The counterfactual of potential chaos or decline under a different system is central to legitimacy; a government that maintains order and prosperity is legitimate because it avoids worse alternatives."
  - DA's formulation: "The counterfactual of performance under a different system is secondary; the primary issue is the inherent right of the people to choose, regardless of outcomes."
  - Type: Substantive.

  **Verbal Disagreements**: We note that some of the original exchange was verbal. Specifically:
  - The term "legitimacy" itself might be used differently. PA uses it to mean "deserving of support because of results," while DA uses it to mean "morally justified authority." However, in our agreed claims, we have defined legitimacy as normative, so we are not treating this as merely verbal. But we agree that in common discourse, the term is often conflated with stability or popularity.

  ### 3. Cruxes
  We identify sub-questions that would move at least one side. For each, we state what both sides agree would count as evidence/argument, and each side's prediction.

  **Crux 1: Indexing legitimacy**
  - Question: Must a legitimacy claim be indexed — i.e., legitimacy of what (the regime, a particular policy), for whom (the population, an external observer), and relative to which counterfactual baseline (e.g., compared to a minimally functional state, or to a hypothetical alternative)?
  - Agreed evidence/argument: Both agree that clarity on the scope and audience of legitimacy is necessary. We can examine philosophical arguments about the nature of political authority and its purposes. Also, we can look at real-world cases and ask: for whom is the regime legitimate? (e.g., the citizens, the international community). We agree that if legitimacy is indexed to the population, then their perception matters, but DA argues perception is not enough without a mechanism for consent.
  - PA's prediction: PA believes that legitimacy is primarily for the population and relative to a baseline of basic order and prosperity. If we index legitimacy to the population's well-being and they are satisfied, then the regime is legitimate.
  - DA's prediction: DA believes that legitimacy must be indexed to the right to self-determination. Even if the population is satisfied, without a mechanism for consent, legitimacy is lacking. The counterfactual baseline should include the possibility of self-governance.

  **Crux 2: Self-undermining over time**
  - Question: Is a performance-based justification self-undermining over time? (e.g., does it lead to stagnation or collapse when performance falters, or does it prevent the development of institutions that could handle such faltering?)
  - Agreed evidence/argument: We can look at historical examples of authoritarian regimes that experienced economic downturns or crises and observe whether they maintained stability and legitimacy. We avoid contested statistics by describing clear cases (e.g., the Arab Spring: when economic performance declined, regimes without democratic legitimacy faced revolts). Also, we can consider theoretical arguments about adaptability and institutional resilience.
  - PA's prediction: PA argues that a performance-based regime can adapt and maintain legitimacy by continuing to deliver, and that a history of performance builds trust that can weather downturns. They point to Singapore's handling of crises.
  - DA's prediction: DA argues that without democratic mechanisms, a downturn can lead to a crisis of legitimacy because there is no peaceful way to change course. They predict that performance-based regimes are brittle and that their legitimacy evaporates when performance does.

  **Crux 3: Unelected bodies in liberal democracies**
  - Question: Would the performance advocate accept the same reasoning (performance as legitimacy) if applied to an unelected body in a liberal democracy? (e.g., a central bank, a supreme court, or a regulatory agency)
  - Agreed evidence/argument: We can examine whether PA and DA endorse the legitimacy of such bodies. We can also consider whether the performance advocate consistently applies the principle of performance-based legitimacy regardless of context.
  - PA's prediction: PA would say that such bodies can be legitimate based on their performance and expertise, and that they are often designed to be insulated from politics precisely to perform better. However, PA would note that these bodies operate within a democratic system that retains oversight.
  - DA's prediction: DA would argue that in a liberal democracy, unelected bodies derive their legitimacy from being authorized by democratically elected representatives and subject to democratic checks. Thus, their legitimacy is not solely performance-based but is rooted in the democratic system.

  **Crux 4: Well-performing authoritarian state with no plausible transition**
  - Question: What should each side say about a well-performing authoritarian state with no plausible transition to democracy? (e.g., due to entrenched power, lack of opposition, etc.)
  - Agreed evidence/argument: We can analyze historical or hypothetical cases. We avoid contested statistics by describing the scenario without numbers. Both sides can present their reasoning.
  - PA: As above, would say it is legitimate because it meets the people's needs and avoids chaos.
  - DA: Would say it is illegitimate because it denies the people the right to choose.

  **Crux 5: Badly performing democracy**
  - Question: What should each side say about a badly performing democracy? (e.g., one with corruption, economic decline, but free elections)
  - Agreed evidence/argument: We can look at real examples (e.g., a struggling democracy). Both sides agree that poor performance undermines legitimacy, but they differ on the role of democratic processes in such a case.
  - PA: Would argue that the democracy is losing legitimacy because it fails to perform, and that if it continues to fail, it may become illegitimate despite elections.
  - DA: Would argue that the democratic process itself provides a mechanism for reform and thus the regime remains legitimate in form, even if its current government is not performing. The people have the power to change it.

  ### Final Line
  Deepest remaining crux: We need to choose one. The core is about the necessity of consent. So: 
  "Deepest remaining crux: Whether the consent of the governed, expressed through free and informed choice, is a necessary condition for political legitimacy, regardless of the quality of governance."

  Now, let's draft the joint statement accordingly.
answer: |-
  ### Joint Statement on Performance Legitimacy vs. Democratic Legitimacy

  We, two advocates with opposing views on the foundations of political legitimacy, draft this statement to clarify agreements, pinpoint disagreements, and identify cruxes. We recognize that our original debate conflated substantive and verbal disputes. This document reflects our shared commitment to good-faith dialogue, avoids contested statistics or appeals to authority, and relies solely on arguments accessible to any reasoned observer.

  ---

  #### 1. Agreed Claims  
  We jointly accept the following:  

  1. **Legitimacy is normative**: It concerns the *right to rule*, not merely de facto control, stability, or longevity. A regime may be stable without being legitimate, and legitimacy is distinct from effectiveness.  
  2. **Prosperity and order matter**: They are fundamental goods that contribute to human flourishing. A regime that reliably provides security, basic needs, and rising living standards is more acceptable to its people than one that does not.  
  3. **Compliance ≠ legitimacy**: Popular acceptance (due to fear, inertia, or satisfaction) does not equate to normative justification. A population may comply with a regime for pragmatic reasons while denying its moral right to rule.  
  4. **Elections are insufficient**: Competitive elections alone cannot guarantee legitimacy. A democratically elected government may lose legitimacy through corruption, rights violations, or chronic failure to deliver basic goods.  
  5. **Performance is not irrelevant**: Sustained prosperity and order can enhance a regime’s claim to legitimacy, but they do not resolve whether that claim is justified.  
  6. **Singapore and China are illustrative**: Both demonstrate that high performance can foster popular acceptance without competitive elections. However, this observation does not settle whether such acceptance constitutes legitimacy.  
  7. **Legitimacy requires justification**: A regime must be justifiable *to its subjects*, not merely to external observers or abstract principles.  
  8. **Baseline expectations**: A regime that fails catastrophically (e.g., causing famine or civil war) lacks legitimacy, regardless of its structure.  

  #### 2. Disagreements Table  
  We identify three core disagreements. Each is substantive (S), not merely verbal, as they reflect irreconcilable normative commitments.  

  | Claim at Issue | Performance Advocate’s Position (PA) | Democratic Advocate’s Position (DA) | Type |
  |----------------|--------------------------------------|-------------------------------------|------|
  | **The necessity of consent for legitimacy** | "A government that delivers sustained prosperity, security, and order is legitimate because it fulfills the core purposes of governance; the absence of competitive elections is irrelevant if the people are broadly satisfied and secure." | "A government is legitimate only if its authority derives from the free and informed consent of the governed, expressed through institutional mechanisms (e.g., competitive elections); no level of performance can substitute for this." | S |
  | **The sufficiency of performance** | "Sustained high performance alone can establish legitimacy by demonstrably serving the people’s interests, making procedural questions (like elections) secondary to outcomes." | "Performance alone cannot establish legitimacy, as it conflates effectiveness with moral justification; a regime that cannot survive its subjects’ free choice is inherently illegitimate, regardless of outcomes." | S |
  | **The role of counterfactuals** | "Legitimacy depends on realistic alternatives; a regime is legitimate if it outperforms feasible alternatives (e.g., chaos or dysfunction) and the people recognize this through their compliance." | "Legitimacy is intrinsic to the relationship between rulers and ruled; counterfactuals about outcomes under different systems are incidental to whether the regime has a moral right to compel obedience." | S |

  **Verbal clarifications**: In our original debate, we conflated terms. We now agree that:  
  - "Acceptance" (de facto compliance) and "legitimacy" (normative justification) are distinct.  
  - "Performance" refers specifically to delivering prosperity/order, not mere stability.  
  - "Consent" implies institutional mechanisms for free and informed choice, not tacit approval.  

  #### 3. Cruxes  
  We identify pivotal sub-questions. For each, we agree on what evidence/arguments would bear on it and state our predictions.  

  | Crux Question | Agreed Evidence/Arguments | PA’s Prediction | DA’s Prediction |
  |---------------|---------------------------|-----------------|-----------------|
  | **Must legitimacy be indexed?**<br>(i.e., legitimacy *of what, for whom, relative to which baseline?*) | We agree legitimacy must be indexed to the governed population. Evidence: Historical cases where legitimacy eroded despite performance (e.g., pre-revolutionary Iran) or endured despite poor performance (e.g., democracies during recessions). Arguments: Whether legitimacy requires a universal standard or is context-dependent. | Legitimacy is indexed to outcomes relative to a baseline of minimal order/prosperity. If a regime outperforms realistic alternatives (e.g., post-Soviet transitions), it is legitimate. | Legitimacy is indexed to self-determination. If the regime denies institutional consent, it is illegitimate regardless of baseline comparisons. |
  | **Is performance-based justification self-undermining over time?** | Evidence: Regimes that maintained stability after performance declined (e.g., Singapore vs. 1997 Asian crisis) versus those that collapsed (e.g., USSR). Arguments: Whether performance legitimacy fosters adaptability or brittleness. | Performance regimes adapt and retain legitimacy through competence (e.g., technocratic adjustments). Crises test but do not inherently undermine them. | Performance regimes erode when crisis hits, as they lack mechanisms for renewal. Consent-based systems endure by allowing peaceful change. |
  | **Would PA accept unelected bodies in liberal democracies?**<br>(e.g., central banks or courts) | Evidence: Public trust in such bodies (e.g., if unearthed documents reveal high approval for an unearthed regulatory agency). Arguments: Whether legitimacy stems from performance or democratic authorization. | Yes, if they perform well and are broadly accepted. Their insulation from politics often enhances performance, justifying their authority. | No. Their legitimacy derives from democratic oversight (e.g., congressional confirmation). Absent that, they are technocratic tools, not legitimate authorities. |
  | **Well-performing authoritarian state with no plausible transition**<br>(e.g., a stable, prosperous dictatorship with no opposition) | Evidence: Cases where such states persisted (e.g., Oman) versus faced unrest (e.g., pre-2011 Syria). Arguments: Whether contentment implies legitimacy or resignation. | The regime is legitimate. With no feasible alternative and high satisfaction, consent is pragmatically expressed through compliance. | The regime is illegitimate. Absent a mechanism for dissent, compliance reflects resignation, not endorsement. |
  | **Badly performing democracy**<br>(e.g., high corruption, stagnation, but free elections) | Evidence: Democracies that reformed after crises (e.g., post-Watergate US) versus those that collapsed (e.g., Weimar Germany). Arguments: Whether legitimacy persists if institutions enable self-correction. | Legitimacy erodes. Performance failures expose procedural flaws; if unchecked, the regime becomes illegitimate. | Legitimacy endures. Democratic institutions permit correction (e.g., voting out leaders), preserving the regime’s right to rule. |

  ---

  **Deepest remaining crux**: Whether the consent of the governed, expressed through institutionalized mechanisms for free and informed choice, is a necessary condition for political legitimacy independent of performance outcomes.
