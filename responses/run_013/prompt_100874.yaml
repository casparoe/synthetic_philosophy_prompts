answer: |-
  You're wrestling with a profound ethical and philosophical tension baked into the very concept of advance directives. Your unease is spot-on – the practice *does* rest on specific assumptions about identity, autonomy, and what constitutes a "real" person. Let's break down what's baked in:

  1.  **The Primacy of the "Narrative Self" (The Competent Self as Author):**
      *   **Assumption:** The core assumption is that the *competent, reflective self* who created the directive is the "author" of their life narrative and possesses the *authority* to set its final chapters. This self is seen as capable of making authentic, values-based decisions about what constitutes a "good death" or an unacceptable quality of life *from the perspective of their overall life story and deeply held values*.
      *   **Rejection of the "Experiential Self":** The directive prioritizes the values and fears of the past self *over* the immediate experiences (contentment, simple pleasures like ice cream, laughter) of the present, cognitively impaired self. It assumes that the *narrative* value ("I don't want to live *as* a demented person dependent on machines") outweighs the *experiential* value ("This ice cream feels good right now").
      *   **Your Analogy is Apt (Partly):** You're right that we generally reject binding future selves *in most contexts*. The key difference proponents see is that severe dementia represents a *fundamental rupture* in the psychological continuity necessary for the future self to *be* the same "person" in the meaningful sense required to exercise autonomy based on their life narrative. The directive is seen as protecting the *past* self from being trapped in an existence the *past* self deemed intolerable.

  2.  **Autonomy as Precedent Autonomy:**
      *   **Assumption:** Autonomy isn't just about what you want *right now*. It includes the right to make decisions *now* that will bind you *later*, *especially* when you anticipate losing the capacity to make those decisions later. This is "precedent autonomy."
      *   **The Fear of Being Trapped:** The driving force behind directives like your aunt's is often a profound fear of being kept alive in a state the person finds degrading, undignified, or contrary to their core identity *as they understood it when competent*. The directive is seen as a shield against that fate.
      *   **The Power Imbalance You Note:** The "because she can't argue back" point highlights the *asymmetry*. The competent self makes the rule knowing the future self won't be able to change it. Proponents argue this is precisely *why* it's needed – to prevent others from imposing treatments the competent self rejected.

  3.  **Personal Identity: The "Psychological Continuity" View (Leaning Towards Narrative):**
      *   **Assumption:** While not requiring one *specific* metaphysical theory, the practice strongly leans on a view where personal identity is tied to psychological continuity – memories, beliefs, values, personality, the capacity for self-reflection and life planning.
      *   **The "Break":** When dementia severs this continuity significantly (as perceived when the directive was written), the current self is seen as lacking the psychological connection necessary to *override* the values and instructions of the self who *did* possess that continuity and foresight. The earlier self is considered the "last authentic author."
      *   **Not Necessarily "One Self":** It doesn't require a single, unchanging soul. It can accommodate a view of "successive selves," but it explicitly privileges the *last competent self in the chain* as the one authorized to make binding end-of-life decisions for future, non-competent stages.

  **What if we took the demented self as "equally real"?**

  This fundamentally challenges the core assumptions and would significantly alter practice:

  1.  **Severely Undermining Advance Directives:** If the current experiential self is granted full moral status *equal* to the past narrative self, the rationale for binding directives evaporates. Why should past fears override present contentment? Treatment decisions would *have* to prioritize the observed well-being and (if discernible) current preferences of the person *as they are now*.
  2.  **Focus Shifts to Current Interests & Best Interests:** Decision-making would rely heavily on:
      *   **Assessed Well-being:** Is she experiencing pain? Does she seem content? Does she engage with pleasure?
      *   **Inferred Preferences:** Does she resist treatment? Does she show a will to live through behaviors? (This is incredibly difficult and subjective with advanced dementia).
      *   **Best Interests Standard:** What course of action promotes her current welfare, minimizes suffering, and aligns with whatever minimal preferences can be discerned?
  3.  **Limited Scope for Directives:** Directives might only be honored in very specific circumstances:
      *   **When Consistent with Current State:** If the directive accurately describes the *current* state and rejects treatment *for that specific state*, and if her current behavior doesn't contradict it (e.g., she doesn't fight for life).
      *   **Ulysses Contracts (Rare):** Extremely specific directives designed for predictable, future psychotic episodes where the person *knows* they will want treatment refused *during the episode* but will likely regain competence and agree with the refusal afterward. This doesn't map well onto progressive dementia.
      *   **"Stage-Appropriate" Interpretation:** Perhaps directives could only bind decisions *once* the person reaches a state where they demonstrably lack *any* ability to experience well-being or interact meaningfully (a very high bar, arguably beyond where your aunt seems to be).

  **The Tension & Your Aunt's Situation:**

  *   **The Discomfort:** Your unease likely stems from witnessing the disconnect. The directive was written by a self terrified of *being* demented and dependent. The current self *is* demented and dependent, yet seems to find moments of simple contentment. The past self's fear of *this specific state* is overruling the present self's apparent experience of it *not* being pure suffering.
  *   **The System's Imperfect Answer:** Our current system (flawed as it is) sides with precedent autonomy and the narrative self. It assumes that the horror the competent self felt at the *prospect* of dementia carries more moral weight than the observed experience of the demented self, who may lack the capacity to *conceptualize* their state or express complex dissatisfaction beyond immediate discomfort.
  *   **Does Practice Need a Specific Answer?** In practice, the system *functions* without universal philosophical agreement. It rests on a societal *choice* to prioritize precedent autonomy and the values of the competent self over the experiential well-being of the severely demented self. Different philosophical views *could* justify the same policy based on practical concerns (avoiding family conflict, respecting clear prior wishes, preventing overtreatment) even if their underlying metaphysics differ. But the *dominant justification* relies heavily on the narrative self/precedent autonomy view.

  **In essence:** The living will practice assumes that the *person who feared and planned for dementia* is the authoritative self, protecting her from an existence she deemed worse than death. It consciously prioritizes her past values and narrative over her present experiences. Treating the demented self as equally real would collapse this structure, forcing decisions based solely on her current state and perceived well-being, making most advance directives unenforceable in dementia care. Your discomfort reflects the genuine, unresolved conflict between these two ways of seeing a human being across time.
