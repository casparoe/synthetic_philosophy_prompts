  ### Decision Tree for Rational Cooperation in a One-Shot Prisoner's Dilemma with a Mirror-Like Counterpart  
  *Entry point: You accept the PD payoff structure, no communication/commitment/enforcement, and that choices may be dependent.*

  1. **Are you reasoning as an individual or as part of a collective "we"?**  
     - **Collective "we" (e.g., "What should we do?")**:  
       - *Leaf: **Team Reasoning***  
         - Verdict: Cooperate, as the pair optimizes joint payoff.  
         - Awkward commitment: Requires adopting a group identity that may not align with individual incentives.  
     - **Individual "I" (e.g., "What should I do?")**:  
       - Go to 2.  

  2. **What unit does rationality fundamentally evaluate?**  
     - **A particular act**:  
       - Go to 3.  
     - **A general policy or decision procedure**:  
       - Go to 4.  
     - **A disposition or character trait**:  
       - *Leaf: **Constrained-Maximization***  
         - Verdict: Cooperate, as your cooperative disposition (when reciprocated) maximizes self-interest.  
         - Awkward commitment: Requires mechanisms to detect similar dispositions in others.  
     - **None (the question lacks a rational answer)**:  
       - *Leaf: **Deflationary Option***  
         - Verdict: No fact of the matter; rationality is ill-defined for acts.  
         - Awkward commitment: Dismisses normative guidance in decision-theoretic puzzles.  

  3. **Does your evaluation of acts consider only causal effects, or also evidential correlations?**  
     - **Only causal effects (e.g., "Can my choice physically force theirs?")**:  
       - *Leaf: **Causal Decision Theory***  
         - Verdict: Defect, as your act cannot cause the counterpart's choice.  
         - Awkward commitment: Ignores correlational information that predicts outcomes.  
     - **Also evidential correlations (e.g., "Does my choice signal theirs?")**:  
       - *Leaf: **Evidential Decision Theory***  
         - Verdict: Cooperate if choices are correlated (e.g., mirror-like counterparts).  
         - Awkward commitment: Cooperates even when correlation is accidental (e.g., shared random cause).  

  4. **Is the policy evaluated for universal adoption or only for interactions with similar agents?**  
     - **Universal adoption (e.g., "What if everyone used this policy?")**:  
       - *Leaf: **Kantian/Rule-Consequentialist***  
         - Verdict: Cooperate, as universal cooperation maximizes collective good.  
         - Awkward commitment: Applies even to non-similar agents (e.g., defectors).  
     - **Only interactions with similar agents (e.g., "What if my counterpart uses this?")**:  
       - Go to 5.  

  5. **Must similarity require identical decision procedures?**  
     - **Yes, strict identity (e.g., exact copy, same code)**:  
       - *Leaf: **Superrationality***  
         - Verdict: Cooperate, as identical procedures yield identical acts.  
         - Awkward commitment: Collapses with any procedural difference (e.g., one line of code).  
     - **No, similarity suffices (e.g., near-copy, shared training)**:  
       - *Leaf: **Policy-Level/Logical-Dependence Account***  
         - Verdict: Cooperate if policies are sufficiently similar (degrading with differences).  
         - Awkward commitment: Arbitrariness in defining "sufficient" similarity.  

  ---

  ### Logical Space Construction  
  **Branch Questions and Permitted Combinations**:  
  1. Agent unit: Individual or collective.  
  2. Unit of evaluation: Act, policy, disposition, or none.  
  3. For acts: Causal-only or evidential-correlation.  
  4. For policies: Universal scope or similarity-restricted scope.  
  5. For similarity-restricted policies: Identity-required or similarity-sufficient.  

  **Permitted Combinations**:  
  - Collective → Team Reasoning.  
  - Individual + Act + Causal → Causal Decision Theory.  
  - Individual + Act + Evidential → Evidential Decision Theory.  
  - Individual + Policy + Universal → Kantian/Rule-Consequentialist.  
  - Individual + Policy + Similarity-restricted + Identity → Superrationality.  
  - Individual + Policy + Similarity-restricted + Similarity → Policy-Level Account.  
  - Individual + Disposition → Constrained-Maximization.  
  - Individual + None → Deflationary Option.  

  **Unoccupied Combinations and Gaps**:  
  - **Individual + Act + [No sub-branch for "dependence through procedure"**: Unoccupied.  
    - Why: Incoherent—act-oriented views lack tools to restrict dependence to procedural routes (e.g., EDT exploits any correlation).  
  - **Individual + Policy + Universal + [Robustness branch]**: Unoccupied.  
    - Why: Unexplored—universal policies (e.g., Kantian) ignore similarity, making robustness irrelevant.  
  - **Individual + Disposition + [Recognition mechanism]**: Unoccupied.  
    - Why: Unattractive—adding branches (e.g., "Can dispositions be detected?") overcomplicates without theoretical support.  
  - **Collective + [Any sub-branch]**: Unoccupied.  
    - Why: Incoherent—team reasoning addresses the pair, making further splits redundant.  

  ---

  ### Indistinguishable Leaves and Required Separator  
  **Leaves agreeing on verdicts but not reasons**:  
  - **Evidential Decision Theory and Policy-Level Account**: Both cooperate with correlated or similar counterparts but diverge on dependence routes. EDT cooperates if choices are *anyhow* correlated (e.g., shared cause), while Policy-Level requires dependence routed through decision procedures (e.g., algorithmic equivalence).  
  - **Team Reasoning and Kantian/Rule-Consequentialist**: Both cooperate universally but differ on agency. Team reasoning addresses the pair ("we"), while Kantian addresses individual policy choice ("I" universalized).  

  **Additional question to separate indistinguishable leaves**:  
  - *For EDT vs. Policy-Level*: **"Does cooperation remain rational if the correlation between your choice and the counterpart's is *not* mediated by their decision procedure (e.g., both choices caused by a shared coin flip)?"**  
    - EDT: Yes (any correlation suffices).  
    - Policy-Level: No (requires procedural mediation).  
  - *For Team vs. Kantian*: **"Are you optimizing for the pair's outcome or fulfilling an individual moral duty?"**  
    - Team: Pair's outcome.  
    - Kantian: Individual duty.
