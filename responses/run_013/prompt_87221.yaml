prompt: |-
  I am a student in a course on bargaining and social choice, and I have been trying to understand what a familiar arbitration practice commits us to. In final-offer arbitration, as used in baseball salary disputes and in some public-sector labor disputes, the arbitrator must choose one of the two final offers submitted by the parties; splitting the difference is not permitted. Yet the chosen figure often lands near the midpoint of the two offers, and parties seem to anticipate this by moderating their offers. I want you to reconstruct the philosophical commitments this practice presupposes. Does it presuppose a substantive theory of fair division, or only a procedural view on which the arbitrator's job is to pick one of two already-legitimate claims? Does it presuppose that the fair outcome is the point at which each side's gain relative to the status quo is the same proportion of its maximum feasible gain, as in the Kalai-Smorodinsky solution, or is that merely one interpretation among several that the rule could bear? What does the no-split rule assume about the arbitrator's role, the parties' incentives, and the difference between bargaining power and desert? Does the practice require interpersonal comparisons of utility, or can it be reconstructed with ordinal preferences alone? In particular, does it implicitly demand a solution that is monotonic in each player's maximum feasible gain, as Kalai-Smorodinsky is, and therefore willing to violate independence of irrelevant alternatives, or does it demand the reverse? Finally, tell me which parts of the practice strictly presuppose a contested philosophical view, which parts are underdetermined and could be licensed by rival theories such as Nash bargaining or a simple egalitarian rule, and what would have to change in the practice if the Kalai-Smorodinsky commitment were replaced by one of those rivals.
reasoning: |-
  Okay, the user is a student in bargaining and social choice, trying to understand the philosophical commitments behind final-offer arbitration (FOA). They mentioned how in FOA, arbitrators pick one of the two final offers without splitting the difference, yet outcomes often land near the midpoint. They want to know what this practice presupposes philosophically—whether it's about fair division, procedural legitimacy, or specific solutions like Kalai-Smorodinsky.

  First, I need to recall the basics of FOA. It's used in contexts like baseball salary disputes. The key rule is the arbitrator must choose one offer, no compromises. But parties moderate their offers anticipating the midpoint, leading to convergence. The student is asking if this implies a substantive theory of fairness or just a procedural approach.

  Looking at their questions: they mention Kalai-Smorodinsky (KS) solution, which equalizes proportional gains. They also ask about Nash bargaining, independence of irrelevant alternatives (IIA), and interpersonal utility comparisons. Plus, they want to know how changing the underlying theory would affect the practice.

  I should break down the commitments step by step. The no-split rule seems procedural at first glance—arbitrator isn't deciding fairness but picking between legitimate claims. But the behavior of parties moderating offers suggests they expect the midpoint to be the focal point. That implies an implicit substantive norm, possibly the midpoint as fair. But is it KS or Nash?

  KS focuses on equal relative gains, which requires cardinal utility and interpersonal comparisons. Nash maximizes the product of utilities, assuming cardinal but no interpersonal comparisons. The midpoint in monetary terms might not align with either if utilities are nonlinear. But in practice, parties might assume linear utilities, so midpoint equals KS or egalitarian outcome.

  The student also asks about bargaining power vs. desert. FOA might neutralize bargaining power by forcing moderation, but it doesn't address desert—each party's just claim. The arbitrator doesn't evaluate desert, just picks an offer. So it's more about reducing strategic behavior than moral desert.

  Interpersonal comparisons: FOA as practiced (midpoint tendency) might not need them if we take offers at face value. But if utilities are asymmetric, the midpoint might not be fair. However, the procedure itself doesn't require utilities; it's ordinal. The convergence to midpoint suggests parties act as if utilities are comparable.

  On monotonicity: KS is monotonic, meaning if the feasible set expands, no one gets less. Nash violates IIA but isn't monotonic in the same way. FOA's reliance on midpoint might align more with KS's monotonicity because expanding the range would shift the midpoint, affecting outcomes. But Nash could also be approximated if parties anticipate the product maximization point.

  Underdetermined aspects: The practice doesn't strictly require KS. Parties might moderate expecting Nash or egalitarian outcomes. The key is mutual anticipation of a focal point. Different theories could justify this behavior as long as parties believe the arbitrator will pick the most reasonable offer.

  If replacing KS with Nash: In Nash, the outcome depends on the threat point and utility functions. If utilities are linear, Nash and KS might coincide. But if not, parties would need to adjust their offers based on their utility functions. In practice, without knowing utilities, they might still target the midpoint, assuming symmetry.

  Egalitarian rule: Equal gains from status quo. If linear utilities, same as midpoint. But if not, different. But again, without utility info, parties might default to monetary midpoint.

  So, the core philosophical commitment is procedural legitimacy, but the behavior indicates an implicit substantive norm of the midpoint. The practice can be reconstructed with ordinal preferences, as the arbitrator only needs to rank offers. However, the moderation strategy assumes that the midpoint is salient, which might rely on cardinal and comparable utilities in parties' minds.

  Contested views: The necessity of interpersonal comparisons is contested. The practice works without explicit comparisons, but the convergence suggests parties act as if they're making comparisons. Also, the rejection of IIA is implicit because adding an irrelevant offer could shift the midpoint.

  If switching to Nash: The arbitrator would need utility information to find the Nash point. But FOA doesn't allow that; the arbitrator only sees the offers. So the practice would change if parties anticipate Nash—they'd adjust offers based on their utility, which might not be midpoint. But without utility disclosure, it's impractical. Thus, FOA as is fits better with focal points like midpoint, which doesn't require utility information.
answer: |-
  Your analysis of final-offer arbitration (FOA) touches on profound tensions in bargaining theory and political philosophy. Below is a step-by-step reconstruction of its philosophical commitments, addressing your specific questions. I'll distinguish between what the practice **strictly requires**, what it **empirically encourages**, and what remains **theoretically underdetermined**.

  ---

  ### **1. Core Philosophical Commitments**
     - **Procedural Legitimacy over Substantive Fairness**:  
       FOA presupposes that the arbitrator's role is *not* to independently define a fair outcome but to select between two *already-legitimized* claims submitted by the parties. This reflects a **proceduralist commitment**: legitimacy arises from the process (parties' offers + arbitrator's choice), not an external ideal of fairness.  
       - *Why?* The no-split rule explicitly forbids the arbitrator from imposing their own substantive judgment. The outcome is constrained to the set {offer A, offer B}.  
       - *Contrast with substantive theories*: A Rawlsian arbitrator might ignore both offers to seek a "justice as fairness" solution. FOA rejects this.

     - **Anti-Paternalism and Agency**:  
       The practice assumes parties are rational agents capable of moderating their own demands. By forcing parties to internalize the risk of an extreme loss (if their offer is rejected), FOA shifts responsibility for fairness *to the parties themselves*. This aligns with liberal theories of autonomy (e.g., Scanlonian contractualism).

  ---

  ### **2. Does FOA Presuppose Kalai-Smorodinsky (KS) or Another Solution?**
     - **KS is Not Strictly Required, But It Best Explains the Empirical Pattern**:  
       The tendency for outcomes to cluster near the midpoint suggests parties *behave as if* KS (equal proportional gains) is the focal point. However, FOA does not *logically require* KS.  
       - **KS Alignment**:  
         - KS satisfies *monotonicity*: if the feasible set expands in favor of one party, they gain more. In FOA, if Party A moderates their offer (expanding the feasible set toward Party B), the midpoint moves closer to B, rewarding B's restraint — consistent with KS.  
         - *But note*: The midpoint in monetary terms mirrors KS only if utility functions are linear and symmetric. If Party A is risk-averse or has diminishing marginal utility, the monetary midpoint ≠ KS solution.  
       - **Rival Theories Could Also Apply**:  
         - **Nash Bargaining**: Maximizes the product of utilities. Unlike KS, Nash satisfies *independence of irrelevant alternatives (IIA)* but violates monotonicity. In FOA, if parties anticipate Nash, they would moderate offers asymmetrically (e.g., the stronger bargainer concedes less). Yet empirically, symmetric moderation dominates — favoring KS.  
         - **Egalitarian Rule**: Equal absolute gains. This fits midpoint convergence if utility is linear and symmetric, but fails if gains are non-comparable (e.g., dollars vs. non-monetary benefits).  

     - **Conclusion**: FOA incentivizes moderation toward a focal point the parties *believe* the arbitrator will favor. KS provides the clearest *explanation* for why the midpoint emerges, but the rule itself only presupposes that parties *share a belief* about what constitutes a "reasonable" offer — which could be Nash, KS, or egalitarian under specific conditions.

  ---

  ### **3. The No-Split Rule: Assumptions and Implications**
     - **Arbitrator's Role as Passive Selector**:  
       The arbitrator is not a truth-seeker but a mechanism designer. Their job is to *enforce incentives*, not to discover fairness. This rejects Platonic guardianship in favor of Hayekian epistemic humility: only parties know their true interests.  
     - **Incentives for Moderation**:  
       The no-split rule creates a "Nash equilibrium in offers": parties converge to avoid losing entirely. This assumes:  
       - **Common Knowledge of Rationality**: Parties know extreme offers risk rejection.  
       - **Symmetric Beliefs**: Both expect the arbitrator to prefer centrist offers.  
     - **Bargaining Power vs. Desert**:  
       - FOA neutralizes bargaining power (e.g., threats, patience) by forcing offers into a one-shot game.  
       - It ignores *desert* (moral claims like effort or need). The arbitrator chooses based on offer "reasonableness," not desert — suggesting a commitment to *process fairness* over *corrective justice*.

  ---

  ### **4. Interpersonal Comparisons and Ordinal Preferences**
     - **Ordinal Preferences Suffice for the Mechanism**:  
       The arbitrator only needs to rank the two offers (ordinal preference). No utility comparisons are required to execute the rule.  
     - **But Moderation Incentives Rely on Cardinality**:  
       Parties moderate offers *because* they implicitly compare gains. KS requires cardinal, interpersonally comparable utilities to define "proportional gains." In practice, parties use monetary offers as proxies for utility, assuming:  
       - Linear utility ($$u_i(x) = x$$),  
       - Symmetric stakes (e.g., both value $1 equally).  
       If these assumptions fail (e.g., one party is budget-constrained), FOA may produce inequitable outcomes.  

     - **Key Point**: The practice *functions* with ordinal preferences but *stabilizes around the midpoint* only if parties act on cardinal/interpersonal assumptions.

  ---

  ### **5. Monotonicity vs. Independence of Irrelevant Alternatives (IIA)**
     - **FOA Presupposes Monotonicity (Rejecting IIA)**:  
       - In KS, if the feasible set expands (e.g., Party A increases their offer), Party B may gain (monotonicity).  
       - In FOA, if Party A moderates their offer (expanding the set), the midpoint moves toward B, rewarding B — consistent with monotonicity.  
       - **IIA is Violated**: Adding an "irrelevant" offer (e.g., a third option) could shift the midpoint, altering which offer is chosen. FOA accepts this, as outcomes depend on the specific pair submitted.  
     - **Nash Bargaining Demands IIA but Violates Monotonicity**:  
       If FOA truly presupposed Nash, parties would not converge symmetrically. Nash would require asymmetric moderation, weakening the midpoint tendency.

  ---

  ### **6. What Is Strictly Contested vs. Underdetermined**
     | **Element**               | **Strictly Presupposed**                                  | **Underdetermined/Rival Theories Possible**          |
     |---------------------------|----------------------------------------------------------|-----------------------------------------------------|
     | **Arbitrator's Role**     | Passive selector (no independent fairness judgment)      | Which focal point (KS, Nash, egalitarian) is used by parties |
     | **Fairness Standard**     | Procedural legitimacy of offers                          | Substantive theory of fairness (KS vs. Nash vs. egalitarian) |
     | **Utility Comparisons**   | None (ordinal execution)                                 | Cardinal/interpersonal assumptions drive moderation  |
     | **Solution Properties**   | Rejects IIA (due to offer-dependence)                    | Monotonicity (KS) vs. IIA (Nash) could both be argued |
     | **Bargaining Power**      | Neutralized by structure                                 | Whether desert should override process fairness      |

  ---

  ### **7. Changing the Philosophical Commitment: KS to Rivals**
     - **Switching to Nash Bargaining**:  
       - **Practice Change Needed**: Parties would need to know each other's utility functions to calculate the Nash product. Offers would become asymmetric (e.g., the player with a higher disagreement payoff offers less).  
       - **Outcome Shift**: Midpoint convergence would weaken; outcomes might favor the "stronger" party.  
       - **Feasibility**: Impractical without utility disclosure — which FOA avoids.  

     - **Switching to Egalitarian Rule**:  
       - **Practice Change**: If utilities are asymmetric (e.g., $1 ≠ same utility for owner vs. player), parties would need to negotiate non-monetary adjustments.  
       - **Outcome Shift**: Linear utilities → same as midpoint. Nonlinear → divergence.  

     - **Why KS Fits Best**: Only KS explains the **robust midpoint tendency** without requiring utility data. It leverages the intuitive fairness of "equal sacrifice" — a Schelling focal point.

  ---

  ### **Conclusion**
  FOA is fundamentally a **procedural mechanism** that presupposes:  
  - Parties are rational moderators,  
  - Arbitrators are passive enforcers,  
  - Fairness emerges from incentives, not external principles.  

  While **Kalai-Smorodinsky best predicts behavior** (through monotonicity and proportional gains), the practice is **formally compatible** with Nash or egalitarian theories if parties share corresponding beliefs. The core philosophical contestation lies in whether bargaining should prioritize *process* (FOA’s view) or *substantive justice* (which FOA deliberately excludes). This makes FOA a quintessential liberal institution: it distrusts arbitrators as truth-architects but trusts parties to negotiate under constraints. For further study, examine how FOA’s stability depends on common priors — a point Binmore and Aumann’s work clarifies.
