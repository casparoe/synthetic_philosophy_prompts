  A physics-y friend of mine keeps shutting down any talk about Zeno with the same move: Achilles and the tortoise is just an infinite series, 1/2 + 1/4 + 1/8..., which adds up to something finite, so theres no paradox, calculus settled this ages ago, next topic. He treats that one analogy as doing all the work -- it's supposed to kill the dichotomy, the arrow, the whole lot.

  I want to audit it properly. Give me the correspondence table: what plays the role of the terms of the series, what's the sum, what's "arriving at the limit", and what's the thing that's actually supposed to be explained. Then the places it breaks. In particular, is there a real gap between "the infinite sum has a finite value" and "the runner actually completes infinitely many sub-journeys", or is that just people being annoying about the word complete? And does the series picture even touch the version of the paradox that isn't about adding up distances? Sort the disanalogies into ones that matter for his conclusion and ones that don't. Then the payoff: does "calculus dissolved Zeno" actually survive once the breaks are on the table, or was the analogy carrying the conclusion the whole time? If it doesn't survive, what's a better way to frame what the paradox is really asking -- and if the standard line is basically right, just say so, don't invent problems to seem clever.

  Use the tortoise as the running example and keep it concrete.
