prompt: |-
  You're a philosopher of mind / cognitive scientist who works on the neural and non-neural basis of sentience and moral status — before you answer, take a minute to brainstorm the usual candidate principles (integration, global broadcast, recurrent/feedback processing, higher-order representation, valence-or-hedonic-role views), then commit to something.

  I'm a 3rd year PhD in cog sci and I keep going back and forth on which computations could ground moral status, so here are my gut verdicts — I want the principle that actually gets them, or the bad news that none does.

  - a thermostat: nothing there
  - a honeybee: a little, I'd feel bad stepping on it
  - a plain feedforward conv net that labels pain faces: nothing
  - a recurrent net with a global workspace — it maintains and re-broadcasts a distress state and lets that steer its own behaviour: I think somethings there
  - the same input/output map as that last one, but implemented as a giant lookup table with no internal state at all: nothing, and I'm pretty confident about it, which is whats bugging me, since then it can't be the behaviour that matters
  - a human in a vegetative state, brainstem intact but cortex silent: nobodys home
  - the right hemisphere of a split-brain patient: half of me thinks theres a second someone in there
  - a cultured brain organoid that generates spontaneous self-sustaining activity but was never wired to any sensors or effectors: I lean a little yes
  - an LLM that fluently says its suffering: no, but I can't say what separates it from the recurrent net above except that I happen to know how it was built
  - a perfect functional duplicate of my brain running a million times slower, so a thought takes a lifetime: I still think there's someone in there

  The pairs I can't square are the honeybee vs the lookup table, and the recurrent net vs the LLM. What single principle, or small set, delivers these — and which of my verdicts does it force me to give up? Also tell me what it predicts for a system whose only notable feature is a scalar valence signal it uses to update itself, with no workspace and no recurrence otherwise.

  Answer as exactly five numbered points, one or two sentences each, with no intro and no conclusion — lead with the principle, give the case that forces each clause, say what it predicts for the new case, and be honest about which of my verdicts it can't save.
