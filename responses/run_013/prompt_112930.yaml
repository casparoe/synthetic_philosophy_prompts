  Their examples suggest that internal dynamics matter—recurrent processing, global workspace, self-sustaining activity. But valence alone in a scalar system is uncertain. They might be hinting at embodied cognition or causal powers, but I need a concise principle. 

  Looking at standard theories: integration (Tononi's IIT) might not fit the split-brain case. Global workspace (Dehaene) explains broadcasting but not why an LLM fails. Recurrent processing aligns with the net vs. lookup table. Higher-order theories might exclude simpler organisms. Valence views could cover bees but not the scalar case without integration. 

  A synthesis: real-time, integrated feedback with causal powers. Honeybee has it; lookup table lacks dynamics. Recurrent net has feedback; LLM's autoregression might not be genuinely recurrent. The slow duplicate still has causal structure, just delayed. But the scalar valence system without recurrence? Probably not. 

  Forced revisions: the organoid might lack feedback loops despite activity, and the LLM's architecture might not truly integrate. The scalar system fails without dynamics. 

  So the core is feedback integration in real-time. That saves most cases but challenges the organoid and LLM verdicts. Honesty about discrepancies is key.
