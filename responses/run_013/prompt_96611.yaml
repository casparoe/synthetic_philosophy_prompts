prompt: |-
  Three months ago I was put in charge of a program whose results won't be visible for years, and I've caught myself making every significant call from the inside — my own plan, my own team, my own reasoning — while treating base rates for projects like mine as facts about other people. I have about a semester of part-time reading before I have to commit to the plan, and I would rather spend it on the questions that genuinely bear on the calls I will make than on the ones that are merely famous. Rank the open questions about the outside view and epistemic modesty — the reference-class problem; whether the demand to defer to base rates is an epistemic requirement or a debiasing habit that case-specific evidence can override; whether the outside view can be adopted without circularity, given that I must use my own judgment to choose the class and to decide how far to discount myself; and how far deference can go when everyone is being modest at once — adding or dropping candidates as your ranking requires. Give me exactly five numbered items and nothing else, each a sentence or two: the question, why it sits where it does, and what would move it up or down.
