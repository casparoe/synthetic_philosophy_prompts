prompt: |-
  I am trying to settle a question about the handicap principle by construction rather than by appeal to the literature, and I want a case built to order. The strong claim I want tested is this: that a signal is honest because it is costly, and that its cost is what keeps low-quality senders out. I suspect the claim is false as stated -- that what matters is how the cost is distributed across sender types, not how large it is -- and that the two come apart in a case where cost is heavy but carries no information, and again in a case where information is carried at no cost at all. Build me that case.

  Specifications. (1) Both scenarios must sit in one and the same realistic domain -- a labour market, a credit market, a school admissions system, a dating market, whatever you choose -- and use the same hidden trait, the same observer, and the same inference the observer is trying to make; only the structure of the observable may differ between them. (2) No non-human biology, no peacocks, no invented species, and no stipulation of perfect rationality on anyone's part. (3) In the first scenario, the costly act must be genuinely expensive, voluntarily undertaken by the senders, and yet carry no information about the hidden trait because the cost falls identically on every sender type; the observer in the scenario nevertheless treats it as evidence. (4) In the second scenario, the reliable observable must cost the sender nothing to produce -- it should be a by-product or a physical consequence of the trait rather than an expenditure -- and it must be reliable for that reason and not because anyone is deterred. One paragraph per scenario.

  Then do the analysis. For each scenario, state what the observer sees, what inference it draws, and whether that inference is warranted, with the reason. Identify the single structural variable that separates the two cases, and say which feature is actually doing the work in each. Then run the two perturbations: in the first scenario, make the cost fall more heavily on low-trait senders while leaving its absolute size unchanged -- say whether the signal becomes informative, and why; in the second, leave the observable costless but make it fakeable, and say whether it thereby becomes a signal in the handicap sense or merely stops being an index. Finish with the precise condition under which a costly signal can be expected to carry honest information, stated as a condition on the cost function rather than as a slogan, and with the strongest move available to a committed defender of the strong claim -- the one who says the first scenario is simply not a signal, or not a handicap -- together with your judgement of whether that move is a substantive distinction or an unfalsifiable retreat. Say what the case is for: it is meant to decide whether cost as such, or the sorting of cost by type, is the explanatory ingredient, so a scenario that simply stipulates its verdicts rather than generating them from the payoff structure fails the brief. No citations or reading lists; reason from the mechanism.

  End with a final line of the form "Verdict: ..." giving, in no more than fifteen words, the feature that does the work.
reasoning: |-
  We are in the domain of a job market. The hidden trait is "competence" (high or low). The observer is an employer trying to infer competence to decide whom to hire. The same observer and hidden trait in both scenarios.

  **Scenario 1: Costly but Uninformative Signal**
  In this scenario, the observable is a costly certification. The certification fee is set at $10,000, a substantial amount. Both high- and low-competence job seekers must pay the same fee and pass the same exam. The exam is designed such that it is passable by anyone who studies for 200 hours, regardless of their innate competence (because it tests rote memorization of facts). Thus, the cost (both monetary and effort) is identical for both types. Both types are equally willing and able to pay the fee and put in the time. Therefore, the possession of the certification does not correlate with competence. However, the employer, seeing the certification, infers that the candidate is more competent because they have "invested in themselves."

  **Scenario 2: Costless but Reliable Index**
  In this scenario, the observable is the candidate's GitHub commit history. The hidden trait (competence) naturally produces a pattern of frequent, high-quality code contributions over time. This is a by-product of being a competent programmer; it requires no extra effort (beyond the work one would do anyway) and no monetary cost. The low-competence candidates cannot fake this because they lack the skill to produce quality code consistently and at volume. The employer checks the GitHub activity and infers competence. This inference is reliable because the pattern is a direct physical consequence (in the digital realm) of the trait.

  **Analysis per Scenario**

  *Scenario 1:*
  - **Observer sees:** Certification (costly but uniformly borne).
  - **Inference drawn:** Candidate is more competent.
  - **Warranted?** No, because the certification does not correlate with competence. Both types get it equally.
  - **Reason:** The cost does not vary by type. The barrier to getting the certification is equally surmountable by both.

  *Scenario 2:*
  - **Observer sees:** Active, high-quality GitHub history.
  - **Inference drawn:** Candidate is competent.
  - **Warranted?** Yes.
  - **Reason:** The observable is an unfakeable by-product of competence. It costs the sender nothing extra.

  **Structural Variable Separating the Cases**
  The key variable is whether the cost (or the ability to produce the observable) *varies* with the hidden trait. In the first scenario, the cost is fixed and identical for all. In the second, the production of the observable is inherently tied to the trait (at zero marginal cost) and cannot be produced without the trait.

  **Perturbations**

  *Perturbation 1 (Scenario 1 altered):* Make the cost fall more heavily on low-competence senders. Suppose the exam is now designed to test problem-solving and creativity, which high-competence candidates can pass with only 50 hours of study, but low-competence candidates would need 500 hours (or might never pass). The fee remains $10,000. Now the cost (in effort) is higher for the low type. The signal becomes informative: only high-competence candidates (and perhaps some low with extraordinary effort) will get the certification. The employer's inference is now warranted because the certification correlates with competence. The absolute cost is the same, but the differential cost by type makes the signal honest.

  *Perturbation 2 (Scenario 2 altered):* Leave the observable (GitHub history) costless but make it fakeable. Suppose candidates can now pay a service to generate fake commit histories that look authentic. Then, the observable is no longer reliable because low-competence candidates can also display it. It stops being an index (a direct manifestation) and becomes a signal that can be faked. To be a handicap, it would need to be costly in a way that deters low types. But if it remains costless, then it is not a handicap. Instead, it becomes an unreliable signal.

  **Precise Condition for Honest Costly Signals**
  A costly signal can be expected to carry honest information only if the marginal cost of the signal is lower for high-trait senders than for low-trait senders (or, more generally, the net benefit after signal cost is higher for the high type). Formally: Let B(s, t) be the benefit and C(s, t) the cost of signal s for type t. Then, for a signal s* to be honest, we must have: [B(s*, t_high) - C(s*, t_high)] > [B(s*, t_low) - C(s*, t_high)] and also [B(s*, t_high) - C(s*, t_high)] > [B(0, t_high)] and similarly for the low type (they prefer not to send s*). But the key is the differential in net benefit, which typically requires that the cost is lower for the high type (or the benefit is higher, but the cost condition is the core of the handicap principle).

  **Defender's Move and Judgment**
  A committed defender might say that the first scenario is not a handicap signal because a handicap must be conditionally costly (costlier for low types). They might argue that by definition, a handicap signal requires differential cost. This is a substantive distinction because it refines the definition. However, the strong claim we started with ("a signal is honest because it is costly") is false as stated. The defender's move is to retreat to a definition that requires differential cost. This is a substantive and falsifiable refinement because we can then ask: in the first scenario, if the cost is uniform, it fails to be a handicap and fails to be honest. The case we built shows that cost alone is not sufficient; differential cost is necessary.

  **The Case For**
  We have built a case from the same domain (job market) with the same hidden trait (competence) and same observer (employer). In the first scenario, a costly act (certification) is uninformative because the cost is uniform. In the second, a costless index (GitHub) is informative because it is an unfakeable by-product. When we alter the first scenario to have differential cost, it becomes informative. When we make the index fakeable, it becomes unreliable. This shows that the explanatory ingredient is the differential cost (or the unfakeability) and not the absolute cost.

  **Verdict:** Differential cost by type, not absolute cost.
answer: |-
  ### Scenarios in the Job Market Domain
  **Hidden trait:** Candidate competence (high or low).  
  **Observer:** Employer trying to infer competence for a programming job.  
  **Inference goal:** Whether the candidate has high competence (produces efficient, maintainable code).

  **Scenario 1: Costly but Uninformative Signal**  
  Candidates voluntarily pursue a "CodeMaster" certification, costing $5,000 and 100 hours of study—a heavy, equal cost for all. The exam tests trivia about programming languages, which anyone can pass with memorization, regardless of competence. High- and low-competence candidates both obtain it easily. The employer sees the certification and infers high competence, assuming the cost deters low-quality candidates. However, since the cost is identical for all and does not correlate with competence, the signal is uninformative.

  **Scenario 2: Costless but Reliable Index**  
  Candidates share their GitHub profiles. High-competence programmers naturally produce frequent, clean commits as a by-product of their work; low-competence ones cannot mimic this without writing flawed, inefficient code. It costs nothing extra—effort is inherent to their daily work. The employer sees a robust commit history and infers high competence. This is reliable because the observable arises directly from the trait and cannot be faked without the trait itself.

  ### Analysis per Scenario
  - **Scenario 1:**  
    **Observer sees:** CodeMaster certification.  
    **Inference drawn:** High competence.  
    **Warranted?** No. The cost falls equally on all types, so the signal does not distinguish competence. The employer’s inference is an error because low-competence candidates obtain it as readily as high-competence ones.  

  - **Scenario 2:**  
    **Observer sees:** Active, high-quality GitHub history.  
    **Inference drawn:** High competence.  
    **Warranted?** Yes. The observable is an unfakeable by-product of competence (an "index"), requiring no strategic cost. Low-competence candidates cannot produce it even if they try, as it emerges physically from their work.  

  **Structural variable separating the cases:** *Dependence of the cost (or producibility) on the hidden trait*. In Scenario 1, cost is *independent* of competence; in Scenario 2, producibility is *dependent* on competence at zero marginal cost.  

  **Feature doing the work:** In Scenario 1, absolute cost fails because it does not vary by type; in Scenario 2, reliability works because the index is tied to the trait inherently.  

  ### Perturbations
  - **First perturbation (Scenario 1 altered):** Make the cost fall more heavily on low-competence senders. Keep the $5,000 fee but change the exam to test abstract problem-solving—high-competence candidates pass with minimal study, while low-competence ones fail even after 200 hours. **Signal becomes informative:** High-competence candidates obtain it cheaply, but low-competence ones are deterred by higher effort costs. The signal now correlates with competence because cost varies by type.  
  - **Second perturbation (Scenario 2 altered):** Leave GitHub costless but make it fakeable (e.g., candidates can buy bot-generated commits). **It stops being an index and becomes unreliable:** Low-competence candidates can now display it, so it no longer reflects competence. It does not become a handicap signal—it merely degrades to a cheap, dishonest signal because there is no cost to deter faking.  

  ### Condition for Honest Costly Signals
  A costly signal carries honest information iff the marginal cost of producing the signal is strictly lower for high-trait senders than for low-trait senders. Formally, for signal cost \( C(\text{type}) \), honesty requires \( C(\text{high}) < C(\text{low}) \) for equivalent signal levels.  

  **Defender's move and judgement:** A committed defender might argue Scenario 1 is "not a true handicap signal" because handicaps require differential cost by definition. This is a **substantive distinction** (it falsifiably refines the principle) but **exposes a retreat**: It admits that cost alone is insufficient, and differential cost is the core mechanism. The move is valid but abandons the strong claim ("cost as such ensures honesty").  

  **Case for the mechanism:** The scenarios generate outcomes from payoffs—no stipulations. In Scenario 1, uniform costs yield no information despite expense; in Scenario 2, trait dependence yields reliability at zero cost. Perturbations show that varying cost by type (not absolute cost) creates honesty, and fakeability destroys reliability without cost.  

  **Verdict:** Differential cost by type, not absolute cost.
