prompt: |-
  ok so I've spent way too long reading rationalist blogs and Dennett's real patterns / three stances thing is basically the only philosophy I actually use at work, except I use it totally hand-wavy and I want it turned into an actual procedure. I do modeling and analytics at a mid-size company and roughly once a month someone walks in with a claimed pattern -- "the market regime shifted", "this user segment wants X", "the team is in a slump", "the model prefers these features" -- and I have to decide whether it's a real pattern or just noise we've drawn a circle around, then defend the call in a design doc my director signs off on. I've got about an hour per call and I'm not going to reread the paper.

  Please give me a decision procedure grounded in the real-patterns idea and the physical/design/intentional stances, that I can actually run in that hour: the steps in order, what counts as passing each one, where it stops with "not real, drop it", and where it hands the decision to a human because the question is about what we care about rather than what's out there. It has to handle the nasty cases: the intentional stance giving a great predictive story about something that doesn't exist (a "market regime" that's really just an artifact of how we bucketed the dates), and a pattern that's real only relative to our interests when someone definately demands an interest-free answer. Also tell me where the procedure misfires and when I should just not bother.

  Format: numbered list, exactly five items, each one or two sentences, no intro or conclusion.
reasoning: |-
  Okay, the user is asking for a concrete decision procedure based on Dennett's real patterns and the three stances (physical, design, intentional). They're a data analyst who needs to evaluate proposed patterns in their work—like market shifts or user segments—and defend their assessment in design docs. They want a step-by-step process that fits into an hour, handles tricky cases like false intentional explanations, and knows when to stop or hand off to human judgment.

  Hmm, the key challenges here are: 1) Making philosophical concepts operational for quick business decisions, 2) Avoiding misapplication of the intentional stance (e.g., anthropomorphizing data artifacts), and 3) Flagging when "realness" depends purely on organizational goals. The user specifically mentioned two pain points: narratives that explain noise, and stakeholders demanding objective answers about subjective patterns.

  I'll structure this as five sequential filters. First step must ground the pattern in physical evidence—no skipping to stories. Second step checks predictive utility across stances, since real patterns should manifest in multiple ways. Third step is crucial: test if the physical basis explains the phenomenon better than the claimed pattern (handles those "market regime" illusions). 

  Fourth step addresses the stakeholder problem: explicitly tag patterns that only exist relative to goals, so the human knows when they're making a value call. Final step is a reality check—if it still seems shaky after all this, kill it fast. The misfires section needs to warn against over-engineering (e.g., quantum fluctuations) and remind that some "patterns" are just goal-post moving.

  ...Double-checking Dennett: yes, real patterns must be projectible and stance-independent in principle, but can be epistemically dependent. The "design stance" here maps to the user's modeling context. Also noting their time constraint means each test must be binary-pass/fail—no deep dives. 

  Biggest risk is step 3 (false narratives)—I'll make it the linchpin. If the intentional story collapses when you remove the physical basis, it's vaporware. And for step 4's "interest-relative" flag, I'll emphasize that it's not a failure, just a transparency requirement. User would hate philosophical waffling here.
answer: |-
  1.  **Identify the Physical Pattern:** Demand data showing a statistically significant, non-random physical structure or variation (e.g., cluster separation, regime change point, performance shift exceeding noise bands). If absent, stop: "Not real, drop it" (e.g., arbitrary date bucketing).
  2.  **Assess Multi-Stance Utility:** Check if adopting the claimed pattern improves predictive accuracy or explanatory parsimony *consistently* under at least two distinct stances (e.g., physical correlations *and* design/model behavior *or* intentional/user behavior predictions). If it only works under one stance (like a great story alone), stop: "Not real, drop it".
  3.  **Test Narrative Independence:** Suspend the intentional/design narrative; see if the *physical pattern alone* still provides predictive power or explains the phenomenon better than simpler alternatives. If the narrative collapses without the physical basis or if simpler noise models suffice, stop: "Not real, drop it" (e.g., "market regime" vanishes without the bucket artifact).
  4.  **Declare Interest-Relativity:** If the pattern passes 1-3 but its utility/value *fundamentally depends* on specific company goals, costs, or actions (e.g., "slump" matters only if impacting output goals), explicitly state: "Pattern is real *relative to our interests*; decision requires human judgment on relevance/action".
  5.  **Apply Parsimony Heuristic:** If steps 1-4 are ambiguous but time is up, default to the simplest explanation consistent with the data and known constraints. If the pattern requires excessive complexity vs. noise or established models, stop: "Not real, drop it".

  **Where it misfires / When not to bother:**
  *   **Misfires:** With irreducible complex systems (e.g., emergent team dynamics where intentional stance *is* primary), deeply entangled causal chains, or when "simplicity" is disputed. Avoid for fundamental physics or pure math.
  *   **Don't Bother:** If the pattern is purely aesthetic, untestable with available data, or concerns unactionable existential truths ("are users *truly* happy?").
