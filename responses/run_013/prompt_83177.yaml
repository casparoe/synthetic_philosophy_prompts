prompt: |-
  Hey — I'm a third-year phil sci PhD and I've somehow been volun-told to run the "theory" session at our department's causal inference reading group next month. 75 minutes, and the room is basically stats/econ/epi people. They can all draw a DAG, they're fluent in potential outcomes, they've run IVs, and none of them has read a page of metaphysics in their life. Topic: counterfactual theories of causation vs. interventionist ones. Don't explain either theory to me, I know them — plan the session for me.

  What I need first is the order the pieces have to go in, and why that order and not another: what has to be in place before the disagreement can even look like a disagreement rather than two groups saying the same thing in different dialects. That's my real worry. Half of me thinks they'll conclude interventionism is just the counterfactual theory with better notation, the other half thinks they'll conclude it's a purely verbal fight about whether to spend the word "cause" on the do-operator. So I need the dependency structure that makes the two positions seperate at some identifiable point.

  Second: the carrying example. One case that does the whole load, introduced early, returned to at every step. My instinct is smoking and lung cancer, because it's the one they've all seen — but I think its a trap, so tell me what to use instead, and what the example has to have and what it must *not* have. I'm guessing it needs to be a case where the counterfactual and the interventionist give different verdicts, and where the intervention is not something you could randomize — but push back on that if I'm wrong. Also, separately: I keep wanting to use a case where intervention is physically impossible (the value of a fundamental constant, something cosmological). Is that a good idea at this level or a way to lose the room, and if it's good, where does it go?

  Third, the misconceptions, in roughly the order they'll actually hit: (a) "an intervention is just the treatment variable in a regression", (b) "an intervention has to be something an agent does / something feasible", (c) "if it isn't randomized it isn't an intervention", (d) "the counterfactual theory just is the potential outcomes framework", (e) the big one, "so what, it's the same math". For each: where in the sequence I have to head it off — which one has to be dead before interventions are even introduced, and which one is fine, or even useful, to leave alive until the end — and the actual sentence I should say to kill it.

  They will also ask two things I want to be ready for: whether an instrument (IV) counts as an intervention, and whether an intervention can itself be caused. I know the circularity worry and I don't want to pretend it isn't there. Tell me when in the plan to let them raise it, whether it's a genuine objection or a confusion I should just clear up, and what I concede if it's genuine.

  Last: what can I safely refuse to do in 75 minutes at this level, and say so out loud, and one closing question — something they have to *answer*, not a recap prompt — that tells me whether they've actually got the disagreement or are just repeating the vocabulary. Ideally a question they can get wrong in an interesting way.
reasoning: |-
  We are designing a 75-minute session for a causal inference reading group with stats/econ/epi background. The goal is to contrast counterfactual theories of causation (like Lewis) with interventionist (or manipulability) theories (like Woodward). The audience is familiar with DAGs, potential outcomes, and IV, but not metaphysics.

  ### Core Structure: Order of Presentation

  The key is to build up the two theories in a way that their divergence becomes clear. We must avoid the impression that they are merely notational variants. The session should proceed as follows:

  1. **Start with the common ground: Potential Outcomes and the Rubin Causal Model (RCM)** (10 minutes)
     - Why? This is the language they know. Remind them: RCM defines causal effects in terms of potential outcomes (Y(1), Y(0)) and the unit-level treatment effect. The average treatment effect (ATE) is E[Y(1)-Y(0)].
     - Emphasize: RCM is a mathematical framework that doesn't, by itself, commit to a particular metaphysics. It's a tool for estimation.

  2. **Introduce Counterfactual Theories (Lewis-style)** (15 minutes)
     - Key idea: Causation is defined in terms of counterfactual dependence. Event C causes E if and only if, had C not occurred, E would not have occurred (in the closest possible world where C is absent).
     - Note: This is a metaphysical account of what causation *is*. It doesn't require interventions. It's about truth conditions for causal claims.
     - Example: Use a simple deterministic case (like a rock breaking a window) to illustrate counterfactual dependence.

  3. **Introduce Interventionism (Woodward-style)** (15 minutes)
     - Key idea: Causation is defined relative to interventions. X causes Y if there is a possible intervention on X that would change Y (or its distribution), holding fixed other variables in a suitable way.
     - Intervention: An ideal manipulation that sets X to a value, breaking the causal influences on X and not affecting Y directly.
     - Example: Use a medical treatment (like a drug) to illustrate an intervention.

  4. **The Divergence Point: Where They Split** (20 minutes)
     - Now we show the difference. We need an example where:
       (a) There is counterfactual dependence (so Lewis says: causation), but 
       (b) There is no possible intervention (so Woodward says: not causation) OR 
       (c) The interventionist account gives a different verdict because of the way interventions are defined.
     - We also need the reverse: a case where interventionism might say there is causation but Lewis does not (though this is harder).

  5. **Addressing Misconceptions and Common Questions** (10 minutes)
     - Go through the list (a)-(e) and the two additional questions.

  6. **Wrap-up and Closing Question** (5 minutes)

  ### The Carrying Example

  Avoid smoking and lung cancer because it's overused and doesn't clearly separate the theories. Instead, use an example that is:

  - **Deterministic** (to avoid confusion with randomness)
  - **Involves a non-manipulable variable** (so we can see the interventionist balking)

  **Example: The Birth of a Star**

  Imagine a massive gas cloud in space. Let C be the event that the gas cloud has a mass above the critical threshold (say, M>M_min). Let E be the event that a star forms.

  - Counterfactual theory: If the cloud had not had mass M>M_min, then the star would not have formed. So, by Lewis, C causes E.
  - Interventionist: Can we intervene on the mass of the gas cloud? In any realistic sense, no. We cannot manipulate the mass of a gas cloud in space without affecting other factors (and in fact, the mass is determined by natural laws and initial conditions). So, for Woodward, we might not call C a cause of E because there is no possible intervention.

  But note: This example might be too far from their experience. Let's choose something more relatable.

  **Alternative Example: Election Outcomes**

  Consider a presidential election. Let C be the event that candidate A wins a particular state (say, Florida). Let E be the event that candidate A wins the election.

  - Counterfactual: If A hadn't won Florida, then A would not have won the election (assuming Florida is pivotal). So, Lewis says: Florida causes the win.
  - Interventionist: Can we intervene on the outcome in Florida? We can imagine setting the result in Florida to "win" or "loss" without changing other states? But note: the outcome in Florida is determined by voter behavior, which might be correlated with other states. An ideal intervention would set the outcome in Florida independently of everything else. However, in reality, we cannot change the outcome in Florida without changing voter behavior (which might also affect other states). So, if we think of the entire system, an intervention on Florida might be hard to define without breaking the structure.

  But wait: in a DAG, we can model Florida as a node and intervene by setting it. So interventionism would say: if intervening on Florida changes the election outcome, then Florida causes the win. 

  This example doesn't show a clear divergence. So we need a better one.

  **Example: The Barometer and the Storm**

  This is a classic. Let B be the barometer reading falling, S be the occurrence of a storm.

  - Counterfactual: If the barometer hadn't fallen, the storm wouldn't have occurred? Not necessarily. The barometer falling doesn't cause the storm; they are both caused by atmospheric pressure. So Lewis would say: there is no counterfactual dependence? Actually, in a deterministic setting, if the barometer falling is the only sign we have, we might be tempted. But Lewis has an account: we consider the closest world where the barometer doesn't fall. That world might be one where the atmospheric pressure is still low (so the storm occurs) but the barometer is broken. Then the storm still occurs. So no counterfactual dependence -> no causation.

  But wait, that's the problem of preemption. We need a case where the counterfactual dependence holds but intervention fails.

  **Example: Causation by Omission**

  Case: A guard is supposed to watch a security camera but falls asleep (omission: the guard's wakefulness). A thief breaks in.

  - Counterfactual: If the guard had been awake (i.e., if the omission hadn't occurred), the thief wouldn't have broken in. So Lewis: the guard's sleeping causes the break-in.
  - Interventionist: Can we intervene on the guard's wakefulness? Yes, we can wake him up. Then the break-in might not occur. So interventionism also says: the guard's sleeping causes the break-in.

  Not a divergence.

  **Example: Non-manipulable Causes (like race or gender in a discrimination case)**

  This is controversial and sensitive, but let's try:

  Consider: Does being Black cause someone to be denied a job? (in a society with discrimination)

  - Counterfactual: If the person were not Black, they would have been offered the job. So Lewis: yes.
  - Interventionist: Can we intervene to change someone's race? No. So interventionism: we cannot call race a cause because we cannot intervene on it. Instead, we might look at interventions on the decision-maker's beliefs or the process.

  This is a clear divergence. But note: it's sensitive and might derail the discussion. We can use a less sensitive analog:

  **Example: Genetic Predisposition**

  Let G be a genetic variant that predisposes to heart disease (H). There is no known way to change G.

  - Counterfactual: If the person didn't have G, they wouldn't have developed H? (Assuming G is necessary in the context) -> causation.
  - Interventionist: Since we cannot intervene on G (at least with current technology), we might not say G causes H. Instead, we might focus on modifiable risk factors.

  But note: we can imagine an ideal intervention that changes G. So if we allow ideal interventions (even if physically impossible), then interventionism might say: if we could change G, then H would change -> causation. 

  This is the crux: **What counts as a possible intervention?** If we allow any logically possible intervention, then the two theories converge. But interventionists typically require that the intervention be *feasible in principle* (not necessarily with current technology, but without changing the laws of nature). Lewis, on the other hand, doesn't require feasibility.

  So the divergence is about the role of manipulability. The interventionist theory is tied to what we can manipulate, while counterfactual theory is about what would happen in other possible worlds.

  **Revised Carrying Example: The Value of the Fine-Structure Constant**

  Let α be the fine-structure constant (a fundamental physical constant). Let E be the fact that carbon-based life exists.

  - Counterfactual: If α were slightly different, carbon-based life wouldn't exist. So Lewis: α being what it is causes life to exist.
  - Interventionist: Can we intervene on α? According to our current understanding of physics, no. The constant is fixed by the laws of nature. So there is no possible intervention on α. Therefore, we cannot call α a cause of life.

  This example is safe (non-sensitive) and clearly shows the divergence. Use it.

  **When to introduce the example?**
  - First, in the counterfactual section: use it to show how counterfactual reasoning works.
  - Then, when introducing interventions: ask "Can we intervene on α?" -> no, so interventionism doesn't call it a cause.
  - Then, at the divergence point: highlight that this is where the two theories disagree.

  ### Addressing Misconceptions

  We'll weave these in as we go, but here's the order and how to kill them:

  (a) "an intervention is just the treatment variable in a regression"
     - When: During the introduction of interventions.
     - Kill it by: "No. In a regression, the treatment variable might be confounded. An intervention requires that we set the treatment independently of any other causes (like in a randomized experiment). So the do-operator is not just any variable; it's one that we set by an ideal manipulation."

  (b) "an intervention has to be something an agent does / something feasible"
     - When: During the divergence point (using the fine-structure constant example).
     - Kill it by: "Interventionism does not require that an agent actually perform the intervention, but it does require that the intervention be possible in principle (without violating the laws of nature). In the case of α, we cannot even conceive of an intervention without changing the laws of physics."

  (c) "if it isn't randomized it isn't an intervention"
     - When: When discussing how we estimate causal effects without actual randomization (e.g., using IV, matching, etc.)
     - Kill it by: "Randomization is one way to achieve an intervention, but we can also use observational data to simulate an intervention if we have the right assumptions (like conditional ignorability). The intervention is a conceptual idea, not limited to actual randomization."

  (d) "the counterfactual theory just is the potential outcomes framework"
     - When: At the beginning, when introducing counterfactual theories.
     - Kill it by: "Potential outcomes are a mathematical tool for expressing counterfactuals, but the counterfactual theory of causation (like Lewis's) is a metaphysical account of what causation is. RCM uses counterfactuals for estimation, but it doesn't provide a definition of causation in the world."

  (e) "so what, it's the same math"
     - When: At the divergence point.
     - Kill it by: "The math of potential outcomes and DAGs can be used by both theories. But the theories differ in what they count as a cause. For example, the fine-structure constant: counterfactual theory says it causes life; interventionism says it doesn't. The math alone doesn't tell you whether to call it a cause."

  ### The Two Additional Questions

  1. **Whether an instrument (IV) counts as an intervention?**
     - When: During the interventionism section or when discussing estimation.
     - Answer: "An instrument is not an intervention. It is a variable that affects the treatment and is independent of confounders. We use it to *infer* the effect of an intervention. But the instrument itself is not an intervention on the treatment; it's an indirect way to get at the causal effect."

  2. **Whether an intervention can itself be caused?**
     - When: When defining interventions (be proactive and address it to avoid circularity worries).
     - Answer: "In the interventionist framework, an intervention is defined by breaking the causal arrows into the variable. So the intervention itself is exogenous. It can be caused in the sense that we might have a cause for why we performed the intervention, but that doesn't affect the definition because the intervention sets the variable independently of its usual causes."

  ### What to Avoid

  - Do not dive into the metaphysics of possible worlds (keep it light).
  - Do not get bogged down in the details of Lewis's similarity ordering.
  - Do not try to cover every variant of the theories.

  ### Closing Question

  Ask: **"Suppose we have a variable that we cannot manipulate even in principle (like the fine-structure constant). According to the counterfactual theory, it can be a cause. According to interventionism, it cannot. But in practice, we might still study what would happen if it were different (using physical laws). Does this mean that the two theories are just giving different answers to a verbal question about the word 'cause', or is there a deeper difference in what they are trying to capture?"**

  This question forces them to confront the divergence. The interesting wrong answer is to say it's just verbal. The deeper issue is that interventionism ties causation to human agency (or at least to manipulability), while counterfactual theory is about the structure of reality.

  ### Session Plan Minute-by-Minute

  - 0-10 min: **Common Ground** (RCM and potential outcomes) + misconception (d).
  - 10-25 min: **Counterfactual Theory** (Lewis-style) with the fine-structure constant example.
  - 25-40 min: **Interventionism** (Woodward-style) with a manipulable example (like a drug) and then revisit the fine-structure constant. Address (a) and (c).
  - 40-60 min: **Divergence Point** - Contrast the two using the fine-structure constant and address (b) and (e). Also, discuss the genetic example as a less extreme case. Take questions on IV and circularity.
  - 60-70 min: **Misconceptions Recap** and address any remaining questions.
  - 70-75 min: **Closing Question** and wrap-up.

  This leaves room for discussion. Be flexible but stick to the core divergence.
answer: |-
  Here's a structured plan for your 75-minute session, designed to make the counterfactual vs. interventionist disagreement tangible for your audience. I'll address your core concerns in order: sequencing for clarity, the carrying example, misconceptions, and closing.

  ---

  ### **1. Session Sequence: Why This Order?**
  The key is to **start with shared foundations**, then **force a divergence** by introducing constraints unique to interventionism. Avoid explaining theories upfront—instead, anchor them in causal inference tools they know (DAGs, PO). The sequence creates a "fork in the road" where the theories visibly split.

  **Order & Rationale**:
  1. **Reset with potential outcomes (PO) & DAGs (10 min)**  
     *Why start here?* Your audience thinks PO *is* counterfactual theory. Disabuse them immediately to prevent conflation.  
     - Show a simple DAG (e.g., X → Y, with confounder Z).  
     - Recap PO: Define ATE as E[Y|do(X=1)] - E[Y|do(X=0)].  
     - **Key point**: "PO is a *mathematical tool* for estimating effects. It doesn't define causation—it assumes one. Today, we'll see two competing definitions that *use* this tool differently."

  2. **Introduce counterfactual theory as "worlds" (15 min)**  
     *Why now?* Build on PO but emphasize metaphysics.  
     - Use PO notation but add: "Y_x(u) is the outcome in a *possible world* where X=x for unit u."  
     - Definition: "X causes Y iff Y changes when we flip X, holding fixed everything *not causally dependent* on X."  
     - **Divergence seed**: "This requires no intervention—just truth in other worlds. Causation exists even if we can't touch X."

  3. **Interventionism as "manipulation" (15 min)**  
     *Why here?* Contrast with counterfactuals by adding *feasibility constraints*.  
     - Define intervention: "An ideal do(X=x) cuts arrows into X, sets X=x, and doesn't directly affect Y."  
     - Stress: "Causes must be *exploitable*—we require a hypothetical experiment."  
     - **Divergence point**: "Interventionism isn't just PO with new notation—it adds a *manipulability requirement*."

  4. **The Fork: Where Theories Split (20 min)**  
     *Why last?* Now the contrast is clear. Use your carrying example to show:  
     - Counterfactual: "Yes, causation if Y changes with X in *any* world."  
     - Interventionist: "No causation if no *feasible intervention* exists."  
     - **Why this works**: Shared tools (PO/DAGs) are now insufficient to resolve the case.

  ---

  ### **2. The Carrying Example: What to Use & Why**
  **Avoid smoking/lung cancer**. It’s a trap because both theories agree (interventions exist via RCTs). Use a case where **interventionism withholds "cause" due to infeasibility**, while counterfactuals assign it.

  **Example: Fundamental constants (e.g., fine-structure constant α)**  
  - **Setup**: α’s value permits stable atoms → allows life (L). If α differed by 4%, no carbon-based life.  
  - **Why it works**:  
    - *Counterfactual verdict*: "If α ≠ current value, L would not exist → α causes L."  
    - *Interventionist verdict*: "No possible intervention on α (it’s a law of physics) → not a cause."  
    - *Audience buy-in*: Epi/econ/stats people respect physics. Cosmology avoids political/ethical landmines (vs. race/gender examples).  
  - **What it must have**:  
    - Deterministic link (no noise → clean counterfactuals).  
    - No manipulability (even in principle).  
  - **What it must NOT have**:  
    - Moral valence (e.g., genetic traits) or real-world policy stakes (distracts).  
    - Ambiguous DAG (use a simple: α → L).  

  **When to introduce it**:  
  - **Early**: Use in step 2 (counterfactuals) to show intuitive causation.  
  - **Revisit**: In step 3 (interventionism) to show "no cause" verdict.  
  - **Clinch**: In step 4 (the fork) to highlight the disagreement.  

  **Is cosmology too much?** No—it’s perfect. Your audience deals with feasibility (e.g., "actionable" causes in policy). This forces them to see interventionism as *more restrictive*.  

  ---

  ### **3. Misconceptions: When to Kill Each**
  Address these **as they naturally arise** in the sequence. Don’t preempt—use them as teaching moments.

  | Misconception | When to Address | Killing Sentence (verbatim) |
  |---------------|-----------------|----------------------------|
  | (a) "An intervention is just the treatment in a regression" | Step 3 (interventionism intro) | **"No—a regression treatment can be confounded. An intervention *severs* dependencies, like in an ideal RCT. Do-calculus isn't just math; it's a physical assumption."** |
  | (b) "An intervention requires an agent/feasibility" | Step 3 (after defining intervention) | **"Not exactly. Interventionism allows *hypothetical* manipulations (e.g., do(smoking) even if unethical). But they must be *possible* without breaking laws—unlike fundamental constants."** |
  | (c) "No randomization = no intervention" | Step 1 (PO recap) or Step 3 | **"Randomization *implements* an intervention. But in obs. studies, we *emulate* it (e.g., via backdoor adjustment). The 'intervention' is a target, not a method."** |
  | (d) "Counterfactual theory = PO framework" | Step 2 (counterfactual intro) | **"PO is a *formalism*—counterfactual theory is its *metaphysics*. Lewis asks, 'What is causation?' Rubin asks, 'How to measure it?' Don't conflate tool with ontology."** |
  | (e) "It’s the same math" | Step 4 (the fork) | **"The math *overlaps* (e.g., both use P(Y\|do(x))). But interventionism *adds constraints*: if you can't do(x), X isn't a cause—even if P(Y_x) ≠ P(Y)."**  

  **Key**: Kill (d) **early** (it’s the root conflation). Let (b) linger until step 4—it’s useful to show interventionism’s limits.

  ---

  ### **4. Handling Tough Questions**
  **Q1: "Does an instrument (IV) count as an intervention?"**  
  - **When raised**: During step 3 (interventionism) or step 4.  
  - **Answer**: "No—IVs *proxy* for interventions but aren’t interventions themselves. An instrument Z affects X but isn’t do(X=x). IVs *leverage* interventions in Z to infer X→Y, but Z isn’t a direct manipulation of X."  
  - **Is it confusion or genuine?**: Confusion. Clarify that IVs *assume* an intervention on Z exists, but don’t implement one on X.  

  **Q2: "Can an intervention itself be caused?"**  
  - **When raised**: Step 3 (after defining interventions).  
  - **Answer**: "Yes—but in the model, the *source* of the intervention is exogenous (no arrows into it). The circularity worry is real: interventions are primitive. Concede: This is why interventionism is *epistemological* (about how we know) not *metaphysical* (about what is)."  
  - **Is it confusion or genuine?**: Genuine. Concede: "Interventionism avoids circularity by treating interventions as axiomatic—but this makes it less ‘fundamental’ than counterfactual theories."  

  ---

  ### **5. What to Refuse & Closing Question**
  **SAFELY REFUSE**:  
  - "We won’t resolve which theory is ‘right’—focus on how they differ."  
  - "We won’t dive into Lewis’s similarity metric or Woodward’s invariance. Assume closest worlds/minimal changes."  
  - "We won’t cover probabilistic causation—stick to deterministic examples for clarity."  

  **CLOSING QUESTION (to test understanding)**:  
  > **"In the α example, both theories use P(Y_x), but one calls α a cause and the other doesn’t. Is this a verbal disagreement about the word 'cause,' or a substantive one about what matters for science? Defend your answer."**  

  - **Why it works**:  
    - They’ll get it wrong if they say "just verbal" (misses interventionism’s focus on agency/exploitability).  
    - Correct answer: "Substantive—interventionism ties causation to *human control*, counterfactuals to *truth in all worlds*."  
    - **Probe deeper**: If they debate "what matters for policy," they’ve understood the stakes.  

  ---

  ### **Summary: Minute-by-Minute Flow**
  - **0-10 min**: Reset with PO/DAGs → Kill (d).  
  - **10-25 min**: Counterfactual theory → Introduce α example.  
  - **25-40 min**: Interventionism → Revisit α, kill (a), (c).  
  - **40-60 min**: The fork → Contrast α, kill (b), (e), handle Qs.  
  - **60-70 min**: Misconceptions recap + audience Qs.  
  - **70-75 min**: Closing question + exit.  

  This forces the split: **Counterfactuals need dependency; interventionism adds feasibility**. By step 4, they’ll see the gap isn’t bridgeable by notation—it’s about what we demand of a "cause."
