prompt: |-
  I need a rigorous argument for a specific position about a two-envelope scenario, written for a reader who knows decision theory and who will not be given any references to check.

  The scenario is fixed as follows. An experimenter rolls a fair six-sided die and records the number d that comes up. She then places 2^d dollars in one envelope and 2^(d+1) dollars in the other, seals both, and hands them to you face down. You select one envelope at random, open it, and observe the amount A inside. You must then decide whether to keep A or to exchange your envelope for the other, still-sealed one.

  A colleague reasons as follows. Whatever amount A I observe, the other envelope contains either 2A or A/2, and by symmetry those two possibilities are equally likely. Doubling gains more than halving loses, so the expected value of switching is 1.25A, which strictly exceeds A. Hence switching is better whatever I see. And since the same argument holds whichever envelope I happen to have opened, I should have been willing to switch before opening at all — which is absurd, because the two envelopes are symmetric. So expected-value reasoning breaks down here.

  Argue for the position that the colleague's reasoning is unsound and that the scenario nevertheless has a single, fully determinate correct policy. Your argument must do all of the following. First, state exactly which values of A, if any, make the premise that the other envelope is equally likely to hold 2A or A/2 fail, and explain why it fails at those values. Second, derive the correct conditional probabilities at the values where that premise does hold, and state the resulting decision rule exactly. Third, argue for the general moral that the apparent paradox is produced by one specific, identifiable mistake — the conflation of the ex ante symmetry of the two envelopes with an ex post symmetry once A has been observed — rather than by any defect in expected-value reasoning as such, and say why that mistake is of the same family as the one that makes the St. Petersburg wager tempting.

  Do not cite any books, papers, or authors; the argument must stand on the scenario alone. Organize the reply under the following headings, in this order:

  Verdict (about one paragraph): the position, stated flatly at the outset.
  Where the premise breaks (about two paragraphs): the values of A at which the equally-likely premise fails, and the arithmetic that shows it.
  The correct policy (about two paragraphs): the conditional probabilities where the premise holds, and the exact decision rule.
  The mistake (about two paragraphs): what the colleague's error is, and why that error, rather than expected-value reasoning, generates the absurdity.
  Objection and reply (about two paragraphs): the strongest reply open to the colleague — that the argument appears to work whichever envelope is opened — and your answer to it.
reasoning: |-
  We are given a fixed scenario: the experimenter rolls a fair six-sided die to get d (from 1 to 6), then puts 2^d in one envelope and 2^(d+1) in the other. You randomly choose one envelope, open it to see A, and then decide whether to switch.

  Verdict
  The colleague's reasoning is unsound because it incorrectly assumes that, after observing A, the other envelope is equally likely to contain 2A or A/2. This assumption fails for some observed values of A. However, for the values where it holds, we can compute the correct conditional probabilities and derive a decision rule that maximizes expected value. The correct policy is to switch when A is 2, 4, 8, 16, or 32, and to keep when A is 64. Expected-value reasoning does not break down; the mistake lies in misapplying symmetry after conditioning on the observed amount.

  Where the premise breaks
  The premise that the other envelope is equally likely to contain 2A or A/2 fails for A = 2 and A = 64. Let's see why. The possible amounts in the envelopes are pairs (2^d, 2^(d+1)) for d from 1 to 6. The possible A values are therefore the set {2, 4, 8, 16, 32, 64, 128}. But note that 128 only appears as the larger amount when d=6 (so the pair is 64 and 128). Similarly, 2 only appears as the smaller amount when d=1 (so the pair is 2 and 4).

  Consider A=2: This can only occur if the die roll was d=1, meaning the other envelope must contain 4 (which is 2A). There is no scenario in which the other envelope would contain 1 (A/2) because d=0 is not possible (the die only goes from 1 to 6). Hence, the other envelope is 2A with probability 1, not 50%.

  Consider A=128: This can only occur if the die roll was d=6 (so the pair is 64 and 128) and you have the larger envelope. Then the other envelope must be 64 (which is A/2). There is no scenario where the other envelope would be 256 (2A) because d=7 is not rolled. Hence, the other envelope is A/2 with probability 1.

  For A=64: This can occur in two ways:
    1. When d=5: then the pair is 32 and 64. If you observe A=64 (the larger amount), then the other envelope is 32 (A/2).
    2. When d=6: then the pair is 64 and 128. If you observe A=64 (the smaller amount), then the other envelope is 128 (2A).
  But note: the two cases are not symmetric because the die rolls d=5 and d=6 are equally likely? Actually, the die is fair, so each d has probability 1/6. However, we must condition on A=64. How?

  The event A=64 can occur in two distinct scenarios:
    - Scenario 1: d=5 and you picked the larger envelope (which is 64). The other envelope is 32.
    - Scenario 2: d=6 and you picked the smaller envelope (which is 64). The other envelope is 128.

  But note that in scenario 1, the envelope containing 64 is the larger of the two, while in scenario 2, it is the smaller. The probability of each scenario? The die roll d=5 and d=6 each have probability 1/6. Then, the chance that in the d=5 case you pick the larger envelope is 1/2, and similarly in the d=6 case you pick the smaller envelope is 1/2. Therefore:

    P( scenario 1 | A=64 ) = P(d=5 and you pick the larger) = (1/6)*(1/2) = 1/12.
    P( scenario 2 | A=64 ) = P(d=6 and you pick the smaller) = (1/6)*(1/2) = 1/12.

  So both scenarios are equally likely? Actually, the total probability of observing A=64 is the sum of the two: 1/12 + 1/12 = 1/6. Therefore, conditional on A=64, each scenario has probability (1/12) / (1/6) = 1/2. So the premise holds for A=64? Wait, but we must also note that A=64 can only come from these two scenarios. And they are symmetric? So the other envelope is equally likely to be 32 or 128.

  But what about A=2 and A=128? We have already seen that they are deterministic. So the premise fails for A=2 and A=128. What about A=4? Let's check:

  A=4: How can this occur?
    - d=1: the pair is 2 and 4. If you pick the larger one (4), then the other is 2 (which is A/2).
    - d=2: the pair is 4 and 8. If you pick the smaller one (4), then the other is 8 (which is 2A).

  The probabilities:
    P(A=4 from d=1 and picking the larger) = (1/6)*(1/2) = 1/12.
    P(A=4 from d=2 and picking the smaller) = (1/6)*(1/2) = 1/12.

  Total probability of A=4: 1/12 + 1/12 = 1/6.
  Conditional on A=4, each scenario has probability 1/2. So the premise holds.

  Similarly, we can check A=8, A=16, A=32: they each come from two scenarios (one where A is the larger in a pair and one where A is the smaller in a pair) and both scenarios are equally likely. For example:

  A=8:
    - d=2: picked the larger (8) -> other is 4 (A/2)
    - d=3: picked the smaller (8) -> other is 16 (2A)

  Each with conditional probability 1/2.

  But note A=128: we have already shown it can only come from d=6 and picking the larger. So the other envelope is always 64. Similarly, A=2 only comes from d=1 and picking the smaller? Actually, when d=1, the two envelopes are 2 and 4. If you pick the envelope with 2, then that is the smaller. So A=2 only occurs in that one scenario. Thus, the premise fails for A=2 and A=128.

  But wait, what about A=1? It never occurs because the smallest amount is 2. Similarly, A=256 is impossible. So the observed A must be one of {2,4,8,16,32,64,128}. The premise fails at the endpoints: A=2 and A=128. For A=4,8,16,32,64 it holds.

  The correct policy
  For A=2 and A=128, we know the other envelope with certainty: for A=2, the other is 4 (so switching yields 4, which is more than 2, so we should switch). For A=128, the other is 64 (so switching yields 64, which is less than 128, so we should keep). 

  For A in {4,8,16,32,64}, the premise holds: the other envelope is equally likely to be 2A or A/2. Therefore, the expected value of switching is:

    (1/2) * (2A) + (1/2) * (A/2) = (1/2)(2A) + (1/2)(A/2) = A + A/4 = 1.25A.

  This exceeds A, so in these cases we should switch.

  But wait: let's verify for A=64. The expected value of switching is (1/2)*128 + (1/2)*32 = 64 + 16 = 80, which is 1.25*64. So indeed 1.25A.

  However, note that for A=64, we have an expected value of switching of 80, which is greater than 64. So we switch. But what about the case when we have A=128? We keep. And for A=2? We switch.

  So the decision rule is:
    - If A = 2, switch (you get 4).
    - If A = 4, 8, 16, 32, or 64, switch (because 1.25A > A).
    - If A = 128, keep.

  But note: we have not yet considered A=1 or A=256? They are impossible. So the rule is complete.

  The mistake
  The colleague's error is the conflation of the ex ante symmetry of the envelopes (before opening, each envelope is equally likely to be the one you hold) with an ex post symmetry (after observing A, the other envelope is equally likely to be 2A or A/2). The ex ante symmetry holds because the assignment of which envelope is given to you is random. However, after observing A, the symmetry is broken because the distribution of the die roll d and the assignment of the amounts to the envelopes condition on the observed value. The failure at the endpoints (A=2 and A=128) illustrates that the conditional distribution of the other envelope given A is not always symmetric. Moreover, even for the interior values, although the conditional probabilities are symmetric (each of the two possibilities having 1/2), the expected value calculation (1.25A) does not lead to an absurdity because the policy is not symmetric: we switch for some values and keep for others. The absurdity (that switching is always better even before opening) is avoided because the policy does not say to switch unconditionally. In fact, if we were to switch without looking, then we would be equally likely to gain or lose, so the expected gain would be zero. The mistake is of the same family as the St. Petersburg wager: in the St. Petersburg wager, a naive expected value calculation (infinite) ignores the fact that the probabilities of very large payoffs are extremely small. Here, the colleague ignores that the conditional distribution of the other envelope given A is not always symmetric and that the endpoints have degenerate distributions. The error is a failure to condition properly on the evidence.

  Objection and reply
  The colleague might object: "But the argument that switching is better seems to apply regardless of which envelope I open. And if I should switch no matter what I see, then I should switch without looking. But that leads to an absurdity because the envelopes are symmetric."

  The reply is two-fold. First, the argument that switching is better does not hold for every A: we have shown that for A=128, switching is worse. So the colleague's reasoning fails at A=128. Second, even for the interior values, the expected value calculation (1.25A) is correct and leads to switching, but note that this does not imply that switching without looking is better. Without looking, the expected value of switching is zero: because with probability 1/2 you switch and gain the difference (which is positive in some cases and negative in others) and with probability 1/2 you switch and lose the same difference? Actually, without conditioning on A, the two envelopes are symmetric: if you start with the smaller you gain by switching, if you start with the larger you lose by switching. And since the assignment is random, the expected gain from switching unconditionally is:

    (1/2) * [gain when you start with small] + (1/2) * [loss when you start with big]
    = (1/2) * (2^(d+1) - 2^d) + (1/2) * (2^(d) - 2^(d+1))
    = (1/2) * (2^d) + (1/2) * (-2^d)
    = 0.

  So switching without looking has expected gain 0. The conditional analysis (which varies by observed A) does not contradict this because the conditional expectations are not constant. The absurdity only arises if we incorrectly assume that the conditional symmetry holds for every A. Since it does not, the paradox dissolves.
answer: |-
  ### Verdict
  The colleague's reasoning is unsound because it incorrectly assumes that, after observing any amount \(A\), the other envelope is equally likely to contain \(2A\) or \(A/2\). This premise fails for certain values of \(A\), and when it holds, the expected value calculation must account for the correct conditional probabilities. Expected-value reasoning remains valid and prescribes a fully determinate policy: switch when \(A \in \{2, 4, 8, 16, 32, 64\}\), and keep when \(A = 128\). The paradox arises from a misapplication of symmetry, not a flaw in expected utility.

  ### Where the premise breaks
  The premise that the other envelope is equally likely to hold \(2A\) or \(A/2\) fails for \(A = 2\) and \(A = 128\). This is due to the bounded range of the die roll (\(d = 1\) to \(6\)) and the resulting constraints on possible amounts. For \(A = 2\), the only possible pair is \((2, 4)\): \(d = 1\) must have occurred, and \(A = 2\) is the smaller amount. Thus, the other envelope must contain \(4 = 2A\); \(A/2 = 1\) is impossible, as no die roll yields \(2^0 = 1\). For \(A = 128\), the only possible pair is \((64, 128)\): \(d = 6\) must have occurred, and \(A = 128\) is the larger amount. The other envelope must contain \(64 = A/2\); \(2A = 256\) is impossible, as no die roll yields \(2^7 = 128\) for the smaller amount (since \(d \leq 6\)). At these endpoints, the conditional distribution is degenerate—one outcome has probability 1, the other 0—violating the "equally likely" assumption.

  ### The correct policy
  For \(A \in \{4, 8, 16, 32, 64\}\), the premise holds: the other envelope is equally likely to contain \(2A\) or \(A/2\). This is because each such \(A\) can arise from two equally probable scenarios. For example:
  - \(A = 4\): Either \(d = 1\) and \(A\) is the larger amount (so other is \(2 = A/2\)), or \(d = 2\) and \(A\) is the smaller amount (so other is \(8 = 2A\)). Each case has conditional probability \(1/2\) given \(A = 4\).
  - Similarly for \(A = 8, 16, 32, 64\): Each results from two die rolls (e.g., for \(A = 64\), \(d = 5\) with \(A\) larger, or \(d = 6\) with \(A\) smaller), and random envelope selection makes both scenarios equally likely given \(A\).  
  The expected value of switching is then \(\frac{1}{2} \cdot 2A + \frac{1}{2} \cdot \frac{A}{2} = 1.25A > A\). Thus, for these \(A\), switching has positive expected gain. For \(A = 2\), switching yields \(4 > 2\); for \(A = 128\), switching yields \(64 < 128\), so keeping is better. The policy is: **Switch if \(A \leq 64\), keep if \(A = 128\)**. (Since \(128\) is the only value where switching loses, and all \(A \leq 64\) appear, this covers all cases.)

  ### The mistake
  The colleague’s error is conflating *ex ante* symmetry (before observation, the envelopes are symmetric) with *ex post* symmetry (after observing \(A\), the other envelope remains symmetrically distributed as \(2A\) or \(A/2\)). Ex ante symmetry holds: initially, each envelope is equally likely to be chosen, and the joint distribution over amounts is symmetric. But conditioning on \(A\) breaks this symmetry because \(A\) provides information about the underlying die roll \(d\). For \(A = 2\) or \(128\), \(d\) is determined uniquely, making the conditional distribution asymmetric. Even for interior \(A\), symmetry holds conditionally, but the expected gain from switching is correctly \(0.25A\)—not an absurdity, as it does not imply that switching *unconditionally* is beneficial. The error mirrors the St. Petersburg paradox: both ignore how conditioning on observed outcomes (here, \(A\); there, the infinite tail) alters the probability distribution. In St. Petersburg, the naive expectation ignores the vanishing probability of extreme payoffs; here, the naive \(50/50\) assumption ignores how \(A\) constrains \(d\).

  ### Objection and reply
  **Objection:** "The switching argument works whatever \(A\) I see, so I should switch without opening any envelope. But ex ante symmetry implies switching is neutral—a contradiction that discredits expected-value reasoning."  
  **Reply:** The argument does *not* work for all \(A\): at \(A = 128\), switching is harmful, and the \(50/50\) premise fails. For interior \(A\), switching is beneficial, but this does not extend to unconditional switching. Ex ante, the expected gain from switching is zero: with probability \(1/2\), you hold the smaller envelope and gain \(2^{d}\) by switching; with probability \(1/2\), you hold the larger and lose \(2^{d}\). Since \(d\) is random, the expected gain is \(\frac{1}{2} \cdot 2^d + \frac{1}{2} \cdot (-2^d) = 0\). Conditioning on \(A\) updates the probabilities, resolving the "always switch" absurdity. The colleague’s error is assuming the conditional symmetry holds universally—it does not, and expected-value reasoning, properly applied, avoids contradiction.
