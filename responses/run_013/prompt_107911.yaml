prompt: |-
  I'm taking a metaethics course this term, and for a seminar presentation I tried to reconstruct the Frege–Geach objection to expressivism in my own words. What I ended up with looks airtight, and that is exactly why I no longer trust it: it seems to prove far more than the objection is supposed to prove. I'd like you to tell me which step to give up and what giving it up costs.

  The argument:

  (1) Expressivism holds that a sentence such as "lying is wrong," when someone asserts it, expresses a non-cognitive attitude — a state of disapproval — rather than stating a fact. Such an attitude is not the sort of thing that can be true or false.
  (2) The words "lying is wrong" mean the same thing in the conditional "if lying is wrong, then getting your brother to lie is wrong" as they do when asserted. If they did not, the argument "lying is wrong; if lying is wrong, then getting your brother to lie is wrong; so getting your brother to lie is wrong" would equivocate, and its validity would be an accident of wording rather than a matter of meaning.
  (3) In the conditional, however, nothing is disapproved of. Whoever utters it asserts no moral verdict and expresses no disapproval; she merely states a connection between two things.
  (4) So the meaning of "lying is wrong" is present in the conditional, while the attitude is not.
  (5) Therefore the meaning of "lying is wrong" is not the attitude, and expressivism is false.

  Two things bother me. First, the argument uses nothing specific to ethics: it would rule out any sentence whose meaning is a non-cognitive state from occurring unasserted inside a valid argument. It would therefore also rule out imperatives, optatives and permissions. Many accounts of imperatives treat "shut the door" and "you may leave" as non-truth-assessable, and yet "if you're cold, shut the door" is not gibberish, and something like inference seems to go on with imperatives. If my argument is sound, all of that is impossible. Second, I have already tried the obvious repair — saying the conditional expresses a higher-order attitude rather than a first-order one — and it did restore validity, but I could not see what prevented the same manoeuvre from working for any vocabulary whatever, which made me suspect I had quietly stopped doing expressivism without noticing.

  Where does this go wrong? I would most like to keep (2) and the idea that moral arguments are valid in the ordinary sense, and I would rather not surrender the claim that moral judgment is practical in a way that belief is not. If more than one repair is available, price them for me and tell me which is cheapest.
reasoning: |-
  Okay, the user is grappling with the Frege-Geach objection in metaethics. They've reconstructed the argument and feel it's too airtight, suspecting they've missed something. Their version seems to prohibit any non-cognitive expression from appearing in complex sentences like conditionals, which would implausibly rule out imperatives or permissions in logic. They've tried a higher-order attitude fix but worry it collapses expressivism into descriptivism.

  Hmm... The core tension is between maintaining moral judgment's practical nature (anti-descriptivism) while accounting for logical embedding. The user explicitly wants to preserve argument validity (premise 2) and moral practicality. Their discomfort about the argument's overgeneralization is spot-on - that's actually a standard critique of Geach's formulation.

  Let me trace their reconstruction: Premise 1 is standard expressivism. Premise 2 is compositionality (meaning invariance). Premise 3 notes absence of attitude in unasserted contexts. Conclusion 4-5 says meaning ≠ attitude. The killer point is that identical logic works for "Shut the door!" in conditionals, yet we don't think imperatives have truth-conditions. So why must moral sentences?

  The user's higher-order attitude attempt probably involved something like Blackburn's quasi-realism, where conditionals express attitudes about attitude combinations. But they rightly fear this might covertly reintroduce propositional content. The cost here is complexity - quasi-realism needs to build ersatz truth-conditions from attitudes, which risks becoming descriptivism in disguise.

  Three main repairs exist: 
  1) Bite the bullet on compositionality (deny premise 2) - cheap but wrecks logic. 
  2) Go quasi-realist - moderate cost in complexity, may satisfy their needs. 
  3) Hybrid expressivism (e.g. Ridge) - higher cost but preserves practicality. 

  Since the user values validity and practicality, recommending quasi-realism makes sense. Should emphasize that Blackburn successfully blocks the overgeneralization worry: imperatives work differently because moral attitudes mimic belief-structure. The "inference" with imperatives isn't logical entailment but practical coherence, whereas moral arguments retain truth-preserving form.

  Also note their conditional example actually undermines Geach: if "if you're cold, shut the door" works without truth-values, why can't moral conditionals? Expressivists would say moral language piggybacks on descriptive logic by having similar functional role. The user's instinct about this analogy being problematic for Geach is correct - that's a feature, not a bug, for expressivists.

  Biggest worry is quasi-realism's slippery slope. Must acknowledge that sophisticated versions (like Gibbard's planning semantics) do introduce proposition-like entities, but argue they're still grounded in practical attitudes. Final tip: suggest presenting this as expressivism refining rather than surrendering, with the cost being a more complex semantic machinery.
answer: |-
  Your reconstruction is sharp and correctly exposes the core tension in expressivism. The overgeneralization worry is valid: if this argument works, it would indeed forbid *any* non-truth-apt expression from appearing in logical compounds, which is implausible for imperatives, permissions, etc. The flaw isn't in your logic but in **Premise 1's oversimplification of expressivism**. Modern expressivism doesn't claim the *meaning* of the sentence *just is* the attitude expressed in isolated assertions. Your argument refutes that crude version, but not sophisticated expressivism.

  Here are the repairs, priced by philosophical cost (keeping your priorities: preserving (2) and moral practicality):

  1. **The Quasi-Realist Solution (Recommended - Moderate Cost)**  
     **Give up:** The idea that the *semantic content* of "lying is wrong" is *simply* the attitude of disapproval (Premise 1).  
     **Keep:** (2) and the practical nature of moral judgment.  
     **How it works:**  
     - Expressivists like Simon Blackburn and Allan Gibbard distinguish *psychological state expressed* from *semantic content*.  
     - "Lying is wrong" expresses disapproval, but its *semantic role* in language (its contribution to truth-conditions, logic, etc.) is that of a proposition with a truth-value.  
     - In unasserted contexts (like conditionals), it contributes this propositional content.  
     - The "attitude" part explains *why* we care about moral claims (practicality), not their logical behavior.  
     **Costs:**  
     - **Moderate Complexity:** Requires building a "quasi-realist" semantics where moral sentences mimic truth-apt propositions despite being grounded in attitudes.  
     - **Suspicion of Collapse:** Critics argue this becomes descriptivism in disguise. Defenders insist the *explanation* of why moral sentences have these semantic properties remains attitudinal/practical.  
     - **Scope:** Must explain *how* attitudes generate proposition-like content. Gibbard's "plan-laden" states or Blackburn's "commitments" do this work.  

  2. **The Hybrid Expressivist Solution (Higher Cost)**  
     **Give up:** The idea that moral sentences express *only* a non-cognitive attitude (Premise 1).  
     **Keep:** (2) and practicality (partially).  
     **How it works:**  
     - Hybrid views (e.g., Daniel Boisvert, Michael Ridge) hold that "lying is wrong" expresses *both*:  
       (a) A belief-like state (e.g., "that lying has property W") *and*  
       (b) A conative attitude (e.g., disapproval).  
     - In asserted contexts, both are expressed. In unasserted contexts (e.g., conditionals), only the belief-like component contributes to truth-conditional meaning.  
     - Validity is preserved via the belief-like component.  
     **Costs:**  
     - **Loss of Purity:** Abandons "pure" expressivism. Moral judgments now have a descriptive core.  
     - **Practicality Diluted:** The conative attitude becomes an add-on rather than the core of meaning. Explaining moral motivation is trickier.  
     - **Complex Semantics:** Needs a dual-component semantics.  

  3. **The Radical Solution: Deny Compositionality (Highest Cost)**  
     **Give up:** Premise (2) – meaning invariance across contexts.  
     **Keep:** The core expressivist thesis (Premise 1) and practicality.  
     **How it works:**  
     - Argue that "lying is wrong" means something *different* in asserted vs. unasserted contexts.  
     - In the conditional, it might express a "conditional attitude" (e.g., disapproval of lying *if* disapproval of getting someone to lie follows).  
     - Validity is redefined as preserving "practical commitment" rather than truth.  
     **Costs:**  
     - **Logic Undermined:** Moral arguments are no longer valid in the "ordinary" (truth-preserving) sense. They become a different kind of reasoning.  
     - **Ad Hoc:** Requires separate semantics for every logical context (negation, disjunction, etc.), which feels contrived.  
     - **Overgeneralization Remains:** Still struggles to explain non-moral embeddings (e.g., "If shut the door, then...").  

  ### Why Quasi-Realism is Your Best Fit
  - **Preserves (2):** Meaning (as semantic role) is invariant. Validity is ordinary truth-preservation.
  - **Preserves Practicality:** The *function* of moral language is still to express practical attitudes – this explains why moral judgment motivates action in a way belief doesn't.  
  - **Solves Overgeneralization:** It explains why "If lying is wrong..." works like a truth-conditional conditional, while "If shut the door..." is fundamentally different. Imperatives *don't* function as truth-apt propositions in logic; moral sentences (quasi-realism argues) do, due to their role in practical reasoning.  
  - **Cost is Manageable:** While complex, quasi-realism is the dominant expressivist response to Frege-Geach. It doesn't collapse into descriptivism if the *explanation* for moral semantics remains grounded in non-cognitive states.

  ### Key Insight from Your Reconstruction
  Your argument *does* prove that **if expressivism claims the *meaning* of a moral sentence is *identical to* the attitude expressed in assertion, then expressivism is false**. Sophisticated expressivists concede this. Their move is to say: "Yes, that crude version fails. But we offer a better theory where the attitude *explains* the propositional semantic role, without being identical to it." The cost is semantic complexity, but it saves the core anti-realist, practical insight.

  **Recommendation:** Defend quasi-realism in your presentation. Acknowledge the cost (complexity, risk of mimicry) but argue it's worth paying to preserve both logic and the practical essence of morality. Use the imperative contrast to show why quasi-realism is *needed* – moral language behaves like descriptive language in logic, unlike pure imperatives.
