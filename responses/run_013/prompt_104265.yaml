answer: |-
  **Exam Question**

  **Background**: Agent A0 reasons in a consistent theory T0 extending Peano Arithmetic, using a provability predicate \(\text{Prov}_{T_0}(x)\). A0 plans to construct a successor agent A1 that reasons in theory T1. A0 will build A1 only if it can prove (within T0) that A1 is trustworthy, where "trustworthy" means: for every sentence \(\varphi\), if A1 proves \(\varphi\) (i.e., \(T_1 \vdash \varphi\)), then \(\varphi\) is true. Formally, A0 must prove the global reflection principle for T1: \(\forall \varphi \, (\text{Prov}_{T_1}(\ulcorner \varphi \urcorner) \to \varphi)\).  

  **Part 1 (8 marks)**  
  Suppose \(T_1 = T_0\). Show that A0 can prove the trustworthiness of A1 (i.e., \(T_0 \vdash \forall \varphi \, (\text{Prov}_{T_0}(\ulcorner \varphi \urcorner) \to \varphi)\)) only if \(T_0\) already proves this statement. Using Löb’s theorem, conclude that A0 can trust A1’s decision about a specific sentence \(\psi\) (i.e., prove \(\text{Prov}_{T_0}(\ulcorner \psi \urcorner) \to \psi\)) only if \(T_0 \vdash \psi\). Explain why this implies that trusting a successor’s decision is no easier than deciding it oneself.  

  **Part 2 (12 marks)**  
  Assess two repairs:  
  (a) (6 marks) A0 augments \(T_0\) with the trust schema for A1 as new axioms, defining \(T_0^+ = T_0 \cup \{ \forall \varphi \, (\text{Prov}_{T_1}(\ulcorner \varphi \urcorner) \to \varphi) \}\) (where \(T_1 = T_0\)). Determine whether \(T_0^+\) is consistent. If inconsistent, derive a contradiction. You may use Löb’s theorem and the derivability conditions.  
  (b) (6 marks) A0 uses a theory \(T_0\) strictly stronger than \(T_1\) (e.g., \(T_0 = T_1 + \text{Con}(T_1)\)). Does this allow A0 to prove A1’s trustworthiness? Explain. Now consider a sequence of agents \(A_0, A_1, A_2, \dots\), where each \(A_i\) builds \(A_{i+1}\) only after proving \(A_{i+1}\) trustworthy. Can all \(T_i\) be identical? If not, what must be the relationship between \(T_i\) and \(T_{i+1}\)? What does this cost?  

  **Part 3 (5 marks)**  
  Is the Löbian obstacle solely due to all-or-nothing trust? Suppose A0 uses graded trust (e.g., probabilistic confidence in A1). Would this remove the obstacle? What new challenges might arise?  

