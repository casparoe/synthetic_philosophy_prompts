  **Model Answer**  
  **Student: Exam Script**  

  **Part 1**  
  Let \(\text{Refl}_{T_0}\) denote \(\forall \varphi \, (\text{Prov}_{T_0}(\ulcorner \varphi \urcorner) \to \varphi)\), the statement that \(T_0\) is trustworthy. Assume \(T_0\) is consistent and extends PA. We show \(T_0 \vdash \text{Refl}_{T_0}\) only if \(T_0\) already proves \(\text{Refl}_{T_0}\).  

  By Löb’s theorem, for any sentence \(\psi\), if \(T_0 \vdash \text{Prov}_{T_0}(\ulcorner \psi \urcorner) \to \psi\), then \(T_0 \vdash \psi\). Suppose \(T_0 \vdash \text{Refl}_{T_0}\). Then for any fixed \(\psi\), universal instantiation gives \(T_0 \vdash \text{Prov}_{T_0}(\ulcorner \psi \urcorner) \to \psi\). By Löb’s theorem, \(T_0 \vdash \psi\). Since \(\psi\) is arbitrary, \(T_0\) is inconsistent—contradiction. Thus, \(T_0 \nvdash \text{Refl}_{T_0}\).  

  For a specific sentence \(\psi\), suppose A0 wants to trust A1 on \(\psi\), i.e., prove \(\text{Prov}_{T_0}(\ulcorner \psi \urcorner) \to \psi\). By Löb’s theorem, \(T_0 \vdash \text{Prov}_{T_0}(\ulcorner \psi \urcorner) \to \psi\) implies \(T_0 \vdash \psi\). Thus, A0 can trust A1’s decision on \(\psi\) only if \(T_0\) already proves \(\psi\). Trusting the successor is no easier than deciding \(\psi\) oneself.  

  **Part 2**  
  (a) \(T_0^+ = T_0 \cup \{ \text{Refl}_{T_0} \}\) is inconsistent. Derive a contradiction:  
  - By construction, \(T_0^+ \vdash \text{Refl}_{T_0}\).  
  - Apply universal instantiation to \(\psi = \bot\) (e.g., \(0=1\)): \(T_0^+ \vdash \text{Prov}_{T_0}(\ulcorner \bot \urcorner) \to \bot\).  
  - Löb’s theorem holds for \(T_0^+\) (as it extends PA).  
  - By Löb’s theorem on \(\psi = \bot\), \(T_0^+ \vdash \text{Prov}_{T_0}(\ulcorner \bot \urcorner) \to \bot\) implies \(T_0^+ \vdash \bot\).  
  Thus, \(T_0^+\) is inconsistent.  

  (b) If \(T_0\) is strictly stronger than \(T_1\) (e.g., \(T_0 = T_1 + \text{Refl}_{T_1}\), not just \(T_1 + \text{Con}(T_1)\)), then \(T_0 \vdash \text{Refl}_{T_1}\) (by axiom). However, \(T_0 = T_1 + \text{Con}(T_1)\) may not prove \(\text{Refl}_{T_1}\) (global reflection), as \(\text{Con}(T_1)\) only ensures consistency, not truth for all sentences. For trust, we need \(\text{Refl}_{T_1}\), so \(T_0\) must include it.  

  For the sequence: The theories \(T_i\) cannot be identical. Suppose \(T_i = T_{i+1}\). By Part 1, \(A_i\) cannot prove \(\text{Refl}_{T_{i+1}}\) unless inconsistent. To fix this, set \(T_i = T_{i+1} + \text{Refl}_{T_{i+1}}\). Then \(T_i \vdash \text{Refl}_{T_{i+1}}\), but \(T_i\) is stronger than \(T_{i+1}\). Thus, \(T_0 \supset T_1 \supset T_2 \supset \cdots\), with strictly weakening theories. This costs reasoning power: later agents are less capable, and infinite chains may become unusably weak.  

  **Part 3**  
  The obstacle is not solely due to all-or-nothing trust. Graded trust (e.g., "A1 is correct with high probability") avoids inconsistency but introduces new challenges. For example:  
  - Probabilistic self-reference: An agent assigning high confidence to a successor’s soundness must reason about its own reliability, risking circularity.  
  - Confidence degradation: In a chain, each agent may assign lower confidence to the next, eroding trust.  
  - Bootstrapping: Graded trust may still face probabilistic Löb-like results (e.g., "I cannot highly trust my own reasoning without already accepting all outputs").  
  Thus, graded trust mitigates inconsistency but does not eliminate self-referential obstacles.  

