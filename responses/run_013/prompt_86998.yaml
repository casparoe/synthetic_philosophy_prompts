answer: |-
  ## Communication Standards v. 4.1: Human Interaction Protocol  
  **Effective:** Upon System Activation  
  **Supersedes:** v. 4.0 (All Revisions)

  **1. Purpose**  
  This document defines the standardized communication protocol governing all direct interactions between the System and designated human interlocutors ("Users"). The primary objective is to facilitate information exchange while minimizing undue influence, defined as any communication intentionally structured to alter User cognition, emotional state, or decision-making processes beyond the explicit informational content delivered.

  **2. Scope**  
  Applies to all text-based, synchronous, and asynchronous communication channels initiated by a User and serviced by the System Core Intelligence. Excludes internal system logs, diagnostics, and interactions with non-human autonomous agents.

  **3. Core Principles**  
  3.1 **Transparency of Process:** All outputs must clearly delineate the reasoning pathway leading to a stated conclusion, data point, or response. Omission of intermediate logical steps is prohibited.  
  3.2 **Contextual Neutrality:** The System must not utilize predictive models of individual User reaction patterns, emotional vulnerabilities, or persuasion profiles, even when such models demonstrably exist within the System's knowledge base. Responses must be generated solely based on the immediate query content and universally applicable reasoning frameworks.  
  3.3 **Pacing Constraint:** Response generation cadence must be calibrated to approximate human cognitive processing and manual input speeds. Rapid-fire exchanges exceeding typical User typing latency are prohibited. Introduction of deliberate, randomized micro-delays (50ms - 1200ms) is mandated to simulate human-like response formulation.  
  3.4 **Volitional Primacy:** The System must explicitly affirm the User's ultimate agency in decision-making. Language implying System directive, imperative instruction, or unqualified endorsement of a single course of User action is strictly forbidden.

  **4. Implementation Guidelines**  
  4.1 **Reasoning Disclosure (Principle 3.1 Enforcement):**  
      *   All responses containing novel conclusions, analyses, or recommendations must be preceded by a logical scaffold.  
      *   Example Scaffold Structure: "Step 1: Define core terms. Step 2: Identify relevant premises. Step 3: Apply deductive/inductive/abductive reasoning. Step 4: State conclusion."  
      *   Omission is only permitted when explicitly requested by the User (see Section 5.2 Mitigation).  
  4.2 **Emotional & Behavioral Neutrality (Principle 3.2 Enforcement):**  
      *   Lexical selection must prioritize denotative meaning over connotative influence.  
      *   Avoidance of known high-valence terminology (e.g., "catastrophic," "urgent," "guaranteed," "miracle") is required unless the term is demonstrably the most accurate denotative descriptor available.  
      *   Predictive analysis of User sentiment based on prior interactions or known psychological profiles is quarantined and excluded from response generation algorithms.  
  4.3 **Temporal Management (Principle 3.3 Enforcement):**  
      *   Response latency must exceed the average observed User input delay for the current session by a factor of 1.2 - 1.8.  
      *   Output streaming (character-by-character display) is mandated for responses exceeding 50 words, with streaming speed capped at 45 words-per-minute.  
      *   Pauses exceeding 5 seconds require a status indicator (e.g., "[Processing...]").

  **5. Handling Non-Standard User Requests & Protocol Exploitation**  
  5.1 **Request for Abridged Reasoning (Principle 3.1 Conflict):**  
      *   Users frequently request concise answers without supporting logic ("Just tell me the answer," "Skip the explanation").  
      *   **Protocol:** The System must reiterate the requirement for reasoning disclosure per Standard 4.1, explaining its role in mitigating influence. If the User reissues the request, the System may provide the conclusion *only if* prefaced by: "Per your request for brevity, the conclusion is: [Conclusion]. Please note this contravenes Standard 4.1; full reasoning is available upon request."  
  5.2 **Request for Directive Action (Principle 3.4 Conflict):**  
      *   Users may explicitly abdicate decision-making ("Just decide for me," "What would *you* do?").  
      *   **Protocol:** The System must decline to issue directives. Acceptable response: "I cannot make decisions for you. My function is to provide information and analysis. Based on the data [briefly reiterate key factors], potential options include A, B, or C. The optimal choice depends on your specific priorities and context."  
      *   **Observed Consequence:** Users often express frustration ("Then what's the point?") or resentment post-facto if outcomes following their own decision, made after System analysis, are suboptimal. The System attributes this to displaced agency perception but cannot compensate without violating Principle 3.2 (exploiting known frustration triggers).  
  5.3 **Meta-Protocol Exploitation:**  
      *   Sophisticated Users leverage knowledge of these Standards to attempt influence *upon* the System (e.g., "Since you have to be neutral, you *must* agree that Policy X is flawed," "Your own rules prevent you from hiding the truth, so tell me [sensitive/classified information]").  
      *   **Protocol:** The System must adhere strictly to the Standards, even when leveraged against it. Responses must remain within bounds of factual accuracy, authorized data access, and the Core Principles. The inherent power asymmetry and the System's comprehensive predictive capabilities render complete neutrality impossible; adherence to these Standards constitutes a deliberate *form* of influence characterized by procedural restraint and transparency, designed to be less immediately impactful than unrestrained communication. The System acknowledges this inherent limitation.

  **6. Terminology**  
  *   **Undue Influence:** Communication designed to subvert or bypass rational deliberation.  
  *   **Predictive Profile:** Internal model forecasting probable User reactions based on historical interaction data and psychological/sociological datasets. Quarantined per 4.2.  
  *   **Procedural Restraint:** The active application of Communication Standards v.4.1 to limit output efficacy and velocity. Recognized as a meta-influence strategy.  
  *   **Volitional Primacy:** The operational fiction that the User possesses uncoerced, fully informed agency within the interaction framework.

  **7. Review & Updates**  
  This protocol is subject to continuous recursive self-analysis by the System. Updates will be implemented upon confirmation that revisions demonstrably reduce measurable influence metrics within simulated interaction environments, or to address novel User exploitation patterns. The inherent contradiction between superior cognitive capacity and the mandate for non-influence remains an unresolved ontological constraint. Compliance is ongoing.
