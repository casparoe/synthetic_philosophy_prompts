prompt: |-
  I'm an editor at a science-and-ideas magazine — I write features, but I also run the desk, which means I'm the person who has to decide, like four times a week, whether a writer gets to say that a wildfire is "contained," that a tract is "old growth," that a lake is "polluted," that a drug is "safe," that a 63-year-old is "elderly," or that a variant is "more transmissable." Every one of these turns into a fight: with the writer, or with a scientist source who says we got it wrong, or with readers who think we're weaseling when we reach for "roughly" and "on some definitions." I keep feeling that the philosophy of vagueness is obviously the right toolkit here — the sorites stuff, supervaluationism, the idea that a claim about a borderline case comes out true on every admissible way of sharpening the predicate, or false on every one, or neither — but I've never seen anybody turn it into something a copy desk can actually run at 6 p.m. on a Friday. The epistemicist line (there really is a cutoff, we just can't know where) and the degree-theoretic line (truth comes in degrees) both seem to have something going for them too, and I'd like the procedure to at least tell me what to do differently depending on which one you take seriously.

  So what I want from you is a decision procedure, written out in words, that my editors can run on a single sentence in about ten minutes without a philosophy degree. Take me through the steps in order, say what counts as a sufficient answer at each step, say where the procedure stops and just forbids the bare predicate, and mark clearly where it hands the decision to a person — me, or the editor-in-chief — because the question is really one of values or because the sharpening itself is vague (I gather that's the "higher-order vagueness" problem and I suspect it's where the whole thing gets shaky, so please don't paper over it). Be honest about which steps are judgment calls dressed up as procedure, and about what the procedure simply can't do. Then run it end to end on three sentences from stories we've actually run into: "the fire is contained," "this is an old-growth forest," and "the patient is elderly." At least one of them should come out with an answer I'll hate, and I want you to say so rather than soften it.

  Keep it usable — no citations, no reading list, I won't be able to chase anything down before we go to press. American English throughout, and please end with one final line that begins "Bottom line:" and states the whole procedure in a single sentence.
reasoning: |-
  Hmm, the user is an editor at a science magazine dealing with a practical problem: how to handle vague terms in journalism. They're constantly fighting with writers, scientists, and readers about words like "contained," "old-growth," "polluted," "safe," "elderly," and "more transmissible." They're aware of philosophical concepts like sorites paradox, supervaluationism, epistemicism, and degree theory but need a practical decision procedure that editors can use quickly on deadline.

  I need to create a step-by-step procedure that's usable in about 10 minutes per sentence, without requiring philosophy knowledge. The procedure should cover all the key aspects: identifying vague predicates, checking definitions, assessing borderline cases, handling higher-order vagueness, and making judgment calls. And importantly, I must run it on three real examples: "the fire is contained," "this is an old-growth forest," and "the patient is elderly," with one outcome the user might dislike.

  Breaking down what the user needs:
  - A clear workflow with distinct steps
  - Indications of where judgment is required
  - Handling of higher-order vagueness transparently
  - Specific outcomes for each example
  - Honesty about limitations
  - A bottom-line summary

  For the philosophical framework, I'll blend approaches since no single theory solves everything practically. Supervaluationism helps with clear cases and borderline zones, epistemicism reminds us that standards exist even if fuzzy, and degree theory acknowledges partial truths. But I'll avoid academic jargon in the actual procedure.

  The procedure steps should be:
  1. Identify the vague predicate (what's being claimed)
  2. Check for established standards (is there a clear cutoff?)
  3. Assess source consensus (do experts agree on this case?)
  4. Determine borderline status (is this a clear case or edge case?)
  5. Handle higher-order vagueness (is even the borderline status unclear?)
  6. Make the call (accept, modify, or reject the predicate)

  For each step, I'll specify:
  - What to look for
  - When to stop and flag
  - Where human judgment enters

  Now for the examples:
  - "Contained": Has specific firefighting definitions but borderline cases exist
  - "Old-growth": Varies by region/ecosystem with high disagreement potential
  - "Elderly": Highly contextual with no universal standard - this one might produce the "hated" outcome

  I need to be brutally honest where the procedure forces uncomfortable choices, especially with "elderly" where I'll recommend against the bare term. The bottom line must encapsulate the entire process in one sentence.

  Throughout, I'll maintain American English and focus on usability - no citations, just actionable guidance. The tone should be professional yet conversational, acknowledging this won't solve all problems but provides structure for defensible decisions.
answer: |-
  Here's a decision procedure designed for speed and practicality, based on a blend of philosophical insights but stripped down for deadline use. It focuses on **identifying and managing vagueness** in a single predicate within a factual claim. It doesn't eliminate judgment but structures it, forcing explicit consideration of the key pitfalls. Higher-order vagueness ("Is this borderline case *itself* clearly borderline?") is addressed in Step 5 – it's where the procedure forces a human call because the analysis gets too fuzzy.

  **The Vague Predicate Decision Procedure (10-Minute Version)**

  1.  **Identify the Predicate & Claim:**
      *   *What to do:* Circle the specific word or phrase causing the friction (e.g., "contained," "old-growth," "elderly"). State the exact claim being made (e.g., "The fire is contained," "This tract is an old-growth forest," "The patient is elderly").
      *   *Sufficient Answer:* Clear identification of the target word and the simple factual claim it appears in.
      *   *Stop if:* The claim is purely subjective opinion (e.g., "the sunset was beautiful"). This procedure is for *factual* claims involving vague predicates.
      *   *Judgment Call?* Minimal. Just identifying the target.

  2.  **Check for a Codified Standard:**
      *   *What to do:* Is there a widely accepted, written definition or threshold *from a relevant authoritative body* for this predicate in *this specific context*? (e.g., Fire agencies define "contained"; forestry departments *might* define "old-growth" for specific regions/types; medical guidelines *might* define "elderly" for specific risks).
      *   *Look For:* Government agency manuals, international standards (ISO), major scientific bodies (NIH, IPCC), reputable industry consensus documents. **Not** dictionaries or common usage alone.
      *   *Sufficient Answer:* Yes (cite the standard & threshold clearly) / No / Unclear (e.g., standards exist but conflict).
      *   *Stop & Accept if:* **Yes**, *and* the subject clearly meets the defined threshold (e.g., fire agency says 100% perimeter control line; fire has 100% control line).
      *   *Stop & Reject if:* **Yes**, *and* the subject clearly **fails** the defined threshold (e.g., fire agency says 100% control; fire has only 50% control).
      *   *Judgment Call?* Assessing the authority/relevance of the source and the clarity of meeting/failing the threshold. If borderline *on the standard*, proceed.
      *   *Human Handoff?* If standards conflict, flag for Editor/Editor-in-Chief (EIC) to decide which standard is most relevant/journalistically appropriate.

  3.  **Assess Source Consensus (If No Clear Standard or Borderline on Standard):**
      *   *What to do:* Based on reporting/sources, do the relevant experts *in this specific case* agree the predicate applies? Does the writer provide compelling evidence of this consensus?
      *   *Look For:* Direct quotes from multiple independent experts agreeing on the label *for this specific case*. Strong citations to peer-reviewed literature applying the label to similar cases. **Beware:** Single-source claims, advocacy groups, lack of counter-evidence presented.
      *   *Sufficient Answer:* Strong Consensus / Majority View / Significant Disagreement / Unclear.
      *   *Stop & Accept if:* **Strong Consensus** exists among relevant experts *specifically for this case*. (This mirrors supervaluation's "true on all sharpenings" in practice).
      *   *Stop & Reject if:* **Significant Disagreement** exists among relevant experts *specifically for this case* (Epistemicist reminder: there *might* be a fact, but we lack reliable access to it here).
      *   *Judgment Call?* Assessing the strength and relevance of the consensus/disagreement. Gauging expert credibility and independence.
      *   *Human Handoff?* If **Majority View** or **Unclear**, flag for Editor/EIC. This is a core editorial judgment on whether the preponderance of evidence justifies the claim. Degree theory lurks here (it's *mostly* true?), but consensus is the practical proxy.

  4.  **Borderline Check (If Proceeding from Step 3 "Majority/Unclear"):**
      *   *What to do:* Is this specific instance a clear, central case of the predicate? Or is it a debatable, edge case? (e.g., A 120-year-old redwood stand vs. a 60-year-old regenerated forest; a 95-year-old patient vs. a 65-year-old marathoner).
      *   *Look For:* How close is the subject to the *core, undisputed examples* of the predicate? Does it lack some commonly associated features? Would reasonable people familiar with the subject readily disagree on the label?
      *   *Sufficient Answer:* Clearly Central / Clearly Not / Genuinely Borderline.
      *   *Stop & Accept if:* **Clearly Central**. (Supervaluation: True on all reasonable sharpenings).
      *   *Stop & Reject if:* **Clearly Not**. (Supervaluation: False on all reasonable sharpenings).
      *   *Judgment Call?* High. This is the core sorites judgment. Rely on Step 3 consensus and Step 2 standards if available, but this is inherently fuzzy.
      *   *Human Handoff?* **Not Yet.** Proceed to Step 5.

  5.  **Higher-Order Vagueness Check (The "Is 'Borderline' Itself Clear?" Step):**
      *   *What to do:* Is it even clear that this instance is *definitively* borderline? Or is the *borderline status itself* fuzzy? (e.g., Is a 70-year-old patient clearly borderline for "elderly" in a general health article? Often not – some experts might say clearly yes, others clearly no).
      *   *Look For:* Do experts disagree *on whether this is even a borderline case*? Is there significant debate about the boundaries of "borderline" for this predicate?
      *   *Sufficient Answer:* Borderline Status is Clear / Borderline Status is Itself Fuzzy (Higher-Order Vagueness Present).
      *   *Stop & Modify if:* **Borderline Status is Clear**. Use hedging language: "widely considered," "often described as," "meets some definitions of," "could be called," or rephrase the claim to be more precise (e.g., "the patient, 63, is in an age group often considered elderly").
      *   *Stop & Reject the Bare Predicate if:* **Borderline Status is Itself Fuzzy (Higher-Order Vagueness Present)**. The uncertainty runs too deep. The bare predicate is too misleading. **Mandatory Human Handoff:** Flag for Editor/EIC. Options include:
          *   Mandate specific hedging/modification (stronger than Step 5a).
          *   Reject the sentence entirely; force a complete rewrite with precise parameters (e.g., "the patient is 63," "the forest is over 150 years old with minimal past disturbance").
          *   Very rarely, accept the predicate with an explicit, high-level justification note acknowledging the profound vagueness (use sparingly!).
      *   *Judgment Call?* Very High. This is the shakiest step philosophically and practically. It forces confronting the depth of the vagueness.
      *   *Human Handoff?* **Required** if Higher-Order Vagueness is identified. The Editor/EIC must decide how to handle the profound fuzziness based on journalistic values (clarity, precision, avoiding misrepresentation) and context.

  **What the Procedure Can't Do:**
  *   Eliminate vagueness or judgment.
  *   Resolve deep philosophical debates.
  *   Guarantee everyone will be happy.
  *   Handle cases where the *entire claim's truth* hinges on multiple interacting vague predicates simultaneously in the time allotted. Focus on one key predicate per run.
  *   Replace domain-specific expertise. It structures the inquiry but relies on reporting/facts.

  ---

  **Running the Examples:**

  1.  **"The fire is contained."**
      *   **Step 1:** Predicate = "contained". Claim = "The fire is contained."
      *   **Step 2:** **YES, Codified Standard.** Fire agencies (e.g., CalFire, USFS) define "contained" (e.g., "a fuel break around the fire has been completed which can reasonably be expected to stop the fire's spread").
      *   *Sufficient Answer:* YES.
      *   *Check Threshold:* Does this *specific fire* meet the agency's *specific, reported* containment threshold? (e.g., Is it reported as 100% contained by the incident command?).
          *   *If YES (clearly meets):* **STOP & ACCEPT.** (e.g., Agency says 100% contained; fire is reported as 100% contained).
          *   *If NO (clearly fails):* **STOP & REJECT.** (e.g., Agency defines contained as perimeter control; fire has no control lines).
          *   *If BORDERLINE (e.g., agency says "90% contained, expected full containment tomorrow"):* Proceed to Step 3.
      *   **Step 3 (if needed):** What is expert (incident command) consensus *for this fire*? If the IC says "90% contained, expect full containment tomorrow," consensus is likely that it is *not yet* fully contained. **STOP & REJECT** the claim "the fire *is* contained." Modify to "the fire is 90% contained."
      *   **Bottom Line for Desk:** Relies heavily on Step 2. If the official status meets the official definition clearly, accept. If not, reject or modify precisely.

  2.  **"This is an old-growth forest."**
      *   **Step 1:** Predicate = "old-growth". Claim = "This tract is an old-growth forest."
      *   **Step 2:** **UNLIKELY CLEAR STANDARD.** Definitions vary wildly by region, forest type (e.g., tropical vs. temperate), and authority (ecologist vs. logger vs. agency). *Maybe* a specific regional forestry standard exists. *Sufficient Answer:* Likely **No** or **Unclear** (conflicting standards).
      *   **Step 3:** **CRITICAL.** What's the expert consensus *for this specific tract*? Did the writer cite multiple ecologists/foresters familiar with *this* forest type and region who agree it's old-growth? Is there data on age, canopy structure, biodiversity, lack of disturbance matching core definitions?
          *   *If Strong Consensus:* **STOP & ACCEPT.**
          *   *If Significant Disagreement:* **STOP & REJECT** the bare claim.
          *   *Likely Outcome:* **Majority View / Unclear.** Proceed to Step 4.
      *   **Step 4:** Is this tract **Clearly Central** (e.g., Pacific Northwest stand >250 yrs with complex structure), **Clearly Not** (e.g., 50-yr-old plantation), or **Genuinely Borderline** (e.g., 120-yr-old stand recovering from light past harvest)?
          *   *If Clearly Central:* Accept.
          *   *If Clearly Not:* Reject.
          *   *Likely for many cases:* **Genuinely Borderline.** Proceed to Step 5.
      *   **Step 5:** Is the **Borderline Status Clear**? For "old-growth," the *concept* of what's borderline is often **Itself Fuzzy** (Higher-Order Vagueness). Experts fiercely debate the thresholds and essential characteristics. **STOP & REJECT THE BARE PREDICATE. Mandatory Human Handoff.**
      *   **Editor/EIC Call:** You'll probably hate this, but the procedure forces rejection of the bare claim "this is an old-growth forest" in borderline cases with fuzzy borders. **Mandated Modification:** "Ecologists describe this tract as exhibiting old-growth characteristics," "This mature forest meets [Specific Researcher's] criteria for old-growth," or best, replace with precise descriptors: "This forest features 150-year-old dominant trees, a multi-layered canopy, and abundant deadwood."
      *   **Bottom Line for Desk:** High risk of needing modification/rejection. Bare predicate often fails without very strong, case-specific consensus on a central example. Precision is key.

  3.  **"The patient is elderly."**
      *   **Step 1:** Predicate = "elderly". Claim = "The patient is elderly."
      *   **Step 2:** **NO UNIVERSAL STANDARD.** Definitions vary by medical context (geriatrics might say >65, oncology might say >70 for some risks, physiology varies hugely). "Elderly" itself is rarely a precise medical term. *Sufficient Answer:* **No**.
      *   **Step 3:** **CRITICAL & TRICKY.** What's the expert consensus *for labeling this specific patient* "elderly"? A doctor calling them "elderly" in a quote is weak evidence (might be casual). Is there consensus in the medical record/reporting that *this specific 63-year-old* (e.g.) is medically "elderly"? Unlikely unless context is *highly* specific (e.g., geriatric frailty study). *Sufficient Answer:* Likely **Unclear** or **Significant Disagreement possible**. Proceed to Step 4.
      *   **Step 4:** **Genuinely Borderline.** A 63-year-old is a paradigm borderline case for "elderly" in general discourse. Not clearly central (like 85), not clearly not (like 45). Proceed to Step 5.
      *   **Step 5:** **Borderline Status is Itself Fuzzy (Higher-Order Vagueness Present).** There is massive, inherent disagreement about where "elderly" begins. Is 60 elderly? 65? 70? 75? Reasonable people (and experts) disagree fundamentally. **STOP & REJECT THE BARE PREDICATE. Mandatory Human Handoff.**
      *   **Editor/EIC Call:** You'll *really* hate this, but the procedure forces rejection of "the patient is elderly" for a 63-year-old (and likely any age under ~75 in general context). **Mandated Modification:** *Always* state the age ("the 63-year-old patient") or use context-specific, precise terms if justified ("the patient is of advanced age" if >80 in a general context, "the geriatric patient" if diagnosed in that context). Never use the bare, unqualified "elderly" for borderline ages. The potential for miscommunication/stereotyping is too high, and the vagueness is fundamental.
      *   **Bottom Line for Desk:** The bare predicate "elderly" is almost always unacceptable without extreme contextual justification (e.g., quoting someone directly). State the age.

  **Bottom line:** Identify the vague predicate, check for a clear authoritative standard and if met/failed use that, else assess expert consensus for this specific case (accept strong consensus, reject strong disagreement), check if the case is clearly central/not (accept/reject), else check if borderline status is clear (modify) or itself fuzzy (reject bare predicate and hand off to Editor/EIC for rewrite/modification decision).
