answer: |-
  **The dispute centers on whether truth is a substantive explanatory property or a linguistic device with no underlying nature.**

  **Agreed Claims:**  
  1. The T-schema (“‘P’ is true iff P”) is extensionally correct for all non-pathological sentences in natural language.  
  2. Truth is indispensable as a device for endorsement (e.g., “What she said is true”) and generalization (e.g., “All axioms are true”).  
  3. Neither deflationism nor inflationism provides a universally accepted solution to the liar paradox; both owe a coherent account.  
  4. Truth is constitutively linked to assertion and belief (e.g., to assert P is to present it as true; to believe P is to take it as true).  
  5. It is an open question whether the ordinary concept of “truth” aligns perfectly with either theoretical notion under debate.  
  6. Truth cannot be reductively defined via a simple correspondence relation (e.g., “sentence S corresponds to fact F”).  

  **Disagreements and Cruxes:**  

  | Disagreement | Deflationist Wording | Inflationist Wording | Crux |
  |--------------|----------------------|----------------------|------|
  | The explanatory role of truth in theories of meaning | "Truth, via the T-schema, is merely expressive; it adds no explanatory power to semantic theories beyond enabling generalizations about meaning or validity." | "Truth is a substantive property that explains semantic phenomena (e.g., reference, compositionality) and cannot be reduced to expressive utility alone." | (a) |
  | Truth’s normativity for belief and assertion | "The norm ‘assert only what is true’ is trivial, deriving solely from the disquotational function of the truth predicate and the aims of assertion." | "Truth furnishes a robust normative standard; its prescriptive force for belief/assertion requires a thick property that transcends linguistic conventions." | (b) |
  | The link between true beliefs and successful action | "True beliefs correlate with success solely because of how ‘belief’ and ‘desire’ operate; this is trivial given the T-schema and requires no further truth-property." | "The systematic success of actions grounded in true beliefs demands explanation via truth’s objective, property-like relation to reality." | (c) |
  | What is meant by "truth is a property" | "If ‘property’ denotes whatever a predicate applies to, truth is trivially a property—but this is metaphysically thin and explanatorily idle." | "Truth is a property in a substantive sense: it earns its keep in causal-explanatory theories (e.g., of cognition or semantics) and is not merely predicative." | (d) |

  **Cruxes with Tests, Predictions, and Falsifiability:**  
  - **Crux (a): Explanatory work in semantics**  
    - **Test**: Take a formal theory of meaning for a fragment of language L lacking a truth predicate. Augment it with a truth predicate and the T-schema (and no other axioms). Can this augmented theory derive new, non-trivial facts about L (e.g., proving its consistency or explaining compositional reference) that were underivable in the original?  
    - **Deflationist prediction**: No new proofs emerge; truth only enables compact expression of existing generalizations.  
    - **Inflationist prediction**: Yes, truth enables proofs (e.g., about L’s logical structure) inaccessible without it.  
    - **Falsifies deflationism if**: New explanatory inferences (e.g., about L’s ontology) arise solely from truth + T-schema.  
    - **Falsifies inflationism if**: The augmentation yields only notational convenience (e.g., abbreviating infinite conjunctions).  

  - **Crux (b): Normativity of truth**  
    - **Test**: Consider a community using a disquotational truth predicate *only* for endorsement/generalization, with no commitment to truth as a normative ideal. Can their practices fully account for the force of epistemic norms (e.g., “You ought not assert falsehoods”)?  
    - **Deflationist prediction**: Yes; norms like “assert only truths” are pragmatic rules implicit in assertion, needing no robust property.  
    - **Inflationist prediction**: No; without a substantive truth-property, such norms collapse into conventions or lose binding force.  
    - **Falsifies deflationism if**: Normative practices (e.g., blaming assertions) systematically appeal to truth-as-property beyond disquotation.  
    - **Falsifies inflationism if**: Norms function identically whether truth is treated as property or device.  

  - **Crux (c): Truth and successful action**  
    - **Test**: In a formal model of belief-desire psychology, assume beliefs are true (per T-schema) and actions succeed when beliefs "match" desires. Is the success of actions *explained* by truth, or is it fully accounted for by the content-match alone?  
    - **Deflationist prediction**: Success is trivially explained by content-match; labeling beliefs "true" adds nothing.  
    - **Inflationist prediction**: Truth explains reliability; content-match alone cannot justify why true beliefs *systematically* yield success.  
    - **Falsifies deflationism if**: The model requires truth as a causal-explanatory variable (e.g., to predict success rates across environments).  
    - **Falsifies inflationism if**: Success is wholly derivable from belief/desire content and T-schema disquotation.  

  - **Crux (d): The meaning of "property"**  
    - **Test**: If both sides stipulate that "property" means *only* what is expressed by a predicate (e.g., truth is a property iff "is true" is meaningful), does the deflationism/inflationism debate dissolve?  
    - **Shared insight**: If "property" is purely predicative, the debate vanishes (all agree truth is a property). The crux is whether "property" implies explanatory substance.  
    - **Verbal resolution**: Yes, part of the dispute is verbal: disagreement evaporates if "property" means merely "predicate reference."  
    - **Residual disagreement**: Whether truth must play a role in *causal or metaphysical explanations* (e.g., in semantics or epistemology) to count as a "real" property.  

  **Verbal Dispute Clarification**:  
  The fight is partly verbal over "property." If "property" means *whatever a predicate denotes*, everyone accepts truth is a property, and deflationism wins trivially. If "property" means *a natural or causal-explanatory feature*, the debate reduces to whether truth does such work (cruxes a–c). Stripping this out leaves the substantive disagreements: whether truth explains semantics (a), grounds norms (b), or explains success (c).
