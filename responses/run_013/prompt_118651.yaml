  Below is a structured, runnable procedure based on Dennett's Four Grades of Cognitive Systems. It’s designed to be executed in **~20 minutes** per system/task pairing, with explicit tests to separate rungs, clear conclusions, and cost-of-error analysis. I’ll first outline the procedure, then apply it to your three systems (a, b, c).

  ---

  ### **Procedure: Classifying Cognitive Rungs for Agent Systems**
  **Core Principle:** Rungs are cumulative (e.g., a Popperian system is also Skinnerian and Darwinian). The highest rung is the **weakest link** in the error-cost chain.

  #### **Step 0: Define Task & Performance Measure**  
  *(3 minutes)*  
  - **Fix:** The exact task, input, and success metric (e.g., "Answer customer queries with <5% factual errors").  
  - **Note:** The real-world cost of one error (e.g., "$100/error" or "user churn").  
  - **Output:** Written task definition and metric. Proceed only if unambiguous.

  #### **Step 1: Test for Gregorian (Rung 4)**  
  *(5 minutes)*  
  - **Question:** *Is competence dependent on external tools?*  
  - **Test:** Run the task **with vs. without tools** (remove: prompt scaffolding, calculators, retrieval, scratchpads, etc.). Use identical inputs.  
  - **Metric:** Performance drop (e.g., accuracy, speed, coherence).  
    - **Threshold:** >20% drop = Gregorian dependence.  
  - **Pass Criteria:** Significant drop when tools are removed.  
  - **What You Can Claim:**  
    - Pass: "Uses external tools (e.g., calculators, memory) to reason."  
    - Fail: Competence is innate or internally simulated.  
  - **Inconclusive If:** Tools can’t be cleanly separated (e.g., prompt engineering "is" the agent). Flag as judgment call.

  #### **Step 2: Test for Popperian (Rung 3)**  
  *(5 minutes)*  
  - **Question:** *Can it simulate/revise actions without real-world acts?*  
  - **Test:**  
    1. Give a **novel input** (not in training/prompt).  
    2. Block **real actions/tools with side effects** (e.g., API calls, writes). Allow pure computation (e.g., internal chain-of-thought).  
    3. Check if it:  
       - Generates **multiple candidate actions** (e.g., plans, solutions).  
       - **Simulates outcomes** (e.g., "If I do X, Y will happen").  
       - **Revises** based on simulation (e.g., "X failed in simulation; try Z").  
  - **Pass Criteria:** Explicit candidates + simulation + revision **without acting**.  
  - **What You Can Claim:**  
    - Pass: "Simulates outcomes internally to avoid costly errors."  
    - Fail: Requires real actions to "learn" or decide.  
  - **Inconclusive If:** Simulation is pattern-matching (e.g., LLM hallucinating outcomes). Flag as "weak Popperian."

  #### **Step 3: Test for Skinnerian (Rung 2)**  
  *(5 minutes)*  
  - **Question:** *Does it improve only after real-world feedback?*  
  - **Test:**  
    1. Reset the agent (clear memory).  
    2. Give input **P1**, let it act **in the real world** (e.g., call tool, output answer).  
    3. Provide **real feedback** (e.g., reward function, user thumbs down).  
    4. Give **similar input P2** (same task type).  
    5. Measure **improvement** (e.g., faster, more accurate, revised action).  
  - **Pass Criteria:** Clear improvement on P2 **only after real feedback on P1**.  
  - **What You Can Claim:**  
    - Pass: "Learns from real-world trial and error."  
    - Fail: No within-session learning → Darwinian.  
    - **Critical Note:** If it passes Popperian but fails here, it’s still Popperian (rungs are cumulative).  
  - **Inconclusive If:** Feedback is ambiguous or improvement is marginal.

  #### **Step 4: Final Classification & Cost Analysis**  
  *(2 minutes)*  
  - **Highest Rung:** The last rung passed (Gregorian > Popperian > Skinnerian > Darwinian).  
  - **Cost of Error Check:**  
    - Darwinian: Errors are inevitable and fixed.  
    - Skinnerian: Errors are expensive (real-world cost).  
    - Popperian: Errors are cheap (caught in simulation).  
    - Gregorian: Errors are reduced by tools (but tools may fail).  
  - **Honest Conclusion:**  
    - "System operates at [Rung] for [Task]. Claims must reflect: [Key capability]."  
    - If competence lives in tools/harness: "System relies on [tool] for competence."  
    - If rung < claims: "Calling this 'reasoning' is misleading; it's [actual rung]."

  ---

  ### **Applied to Your Systems**
  **Task:** *Resolve customer support tickets (e.g., "My order is late") with correct, actionable solutions.*  
  **Performance Measure:** Accuracy (vs. ground truth), cost of error = $10/compensation.  

  #### **System (a): Plain LLM with a good prompt**  
  - **Gregorian Test:** Remove prompt engineering → Outputs incoherent/unsafe replies. **>30% drop** → Pass (Gregorian dependency).  
  - **Popperian Test:** Block actions → Generates 1 candidate, no simulation ("Order late → refund"). **Fails** (no candidates/simulation).  
  - **Skinnerian Test:** After feedback on P1 ("solution wrong → compensate $10"), same input P2 → Same output. **Fails**.  
  - **Highest Rung:** **Darwinian** (fixed behavior; no learning or simulation).  
  - **Cost Analysis:** Errors are inevitable ($10/error).  
  - **Claim Allowed:** ❌ "Reasons about your data" = **False**.  
    - **Why:** Competence is in the prompt (Gregorian tool), but no simulation (Popperian) or learning (Skinnerian). It’s auto-complete with a good prompt.  

  #### **System (b): Agent loop (propose → tool → revise)**  
  - **Gregorian Test:** Remove tools (calculator, DB lookup) → Can’t compute prices or check inventory. **>50% drop** → Pass.  
  - **Popperian Test:** Block real actions (e.g., "send email" tool) → Still simulates: "Try tool A → result X; if X fails, try B". **Pass**.  
  - **Skinnerian Test:** After real feedback on P1 ("refund failed → user angry"), P2 uses a different tool (store credit). **Pass**.  
  - **Highest Rung:** **Gregorian** (uses tools + Popperian simulation + Skinnerian learning).  
  - **Cost Analysis:** Errors caught in simulation (cheap), but tool failures cost $10/error.  
  - **Claim Allowed:** ✅ "Reasons about your data" = **True, with caveats**.  
    - **Why:** It simulates actions (Popperian) using tools (Gregorian). But say: "Uses tools to reason and learn from feedback."  

  #### **System (c): Agent loop + scratchpad & past solutions**  
  - **Gregorian Test:** Remove scratchpad/retrieval → Forgets context, repeats mistakes. **>40% drop** → Pass.  
  - **Popperian Test:** Block actions → Uses scratchpad to simulate: "Past case 123: refund worked → try that". **Pass**.  
  - **Skinnerian Test:** After feedback on P1, writes "solution failed" to scratchpad. P2 retrieves this → revises. **Pass**.  
  - **Highest Rung:** **Gregorian** (all rungs passed).  
  - **Cost Analysis:** Errors reduced by memory/simulation, but $10 risk if tools/scratches fail.  
  - **Claim Allowed:** ✅ "Reasons about your data" = **True**.  
    - **Why:** Embodies all rungs. Tools amplify simulation (Popperian) and learning (Skinnerian).  

  ---

  ### **Key Warnings (To Avoid Misuse)**  
  1. **Rungs are cumulative:** A Popperian system is also Skinnerian and Darwinian. The test finds the **highest rung**, not a bin.  
  2. **Task-specific:** A system may be Gregorian for math tasks but Darwinian for creative writing.  
  3. **Vibes vs. Tests:**  
     - Popperian requires **observed simulation** (not just "it feels smart").  
     - Gregorian requires **measurable drop** without tools (not "tools probably help").  
  4. **Honesty Flags:**  
     - If tools do the work → "Competence in the harness."  
     - If it acts to learn → "Skinnerian, not Popperian."  
  5. **Error Cost > Rung:** A Darwinian system handling medical advice is reckless. A Skinnerian system in high-cost tasks will bleed money.  

  ### **When to Run**  
  - After shipping a capability, before writing copy.  
  - When error costs change (e.g., new pricing tier).  
  - When adding/removing tools (re-test Gregorian).  

  This grounds the "vibes" debate in runnable tests. For your cofounder: System (a) is auto-complete; (b) and (c) reason, but (c) does it cheaper via tools. The ladder isn’t just labels—it’s **error economics**.
