answer: |-
  Here’s a structured plan focusing on clarity, avoiding technical pitfalls, and centering your narrow→wide pivot. Misconceptions are addressed at key points, and the example is designed to isolate the frame problem.

  ---

  ### **Lecture Plan: The Frame Problem as a Lens on Mind & Relevance**
  **Total Time:** 75 mins  
  **Core Pivot:** Narrow (technical) vs. Wide (philosophical) frame problems.  
  **Goal:** Students leave seeing the unsolved *relevance problem* as central to cognition.

  ---

  #### **1. Opening Hook: Mundane Inertia (10 mins)**
  - **Example:** *"You move your coffee mug from the desk to your hand. The ceiling doesn’t collapse. The color of the mug doesn’t change. The Prime Minister of Canada remains in office. Why do we take this for granted?"*  
  - **Key Point:** Agents (human or AI) *rely* on **epistemic inertia**—most things stay the same unless acted upon. This is not trivial: representing change requires knowing what *doesn’t* change.  
  - **Kill Misconception #1 (Frame=Movie Frames):** Explicitly say: *"Here, ‘frame’ means a fixed background, like a painting’s frame—not a sequence of images."*

  ---

  #### **2. The Narrow Problem: Formalizing Inertia & Its Collapse (20 mins)**
  - **Step 1:** Show the naive solution. For action "move mug," list:  
    - What changes: *location(mug)*.  
    - What *doesn’t*: *color(mug), ceiling-intact, PM-Canada*, ... → **Axioms explode** (actions × properties).  
  - **Step 2:** Non-monotonic "fix": Assume *only* specified changes occur (minimal change).  
  - **Toy Trap:** *"You load a gun; wait; shoot a turkey."*  
    - Minimal change assumes *gun stays loaded during wait*? Not necessarily! → **Unloading turkey scenario.**  
  - **Kill Misconception #2 (It’s Solved!):** *"Yes, logicians ‘solved’ the narrow problem by 1990 via ‘exclusion axioms’—designers pre-specify which properties an action *can* affect. But this is cheating the hard part."*  

  ---

  #### **3. The Pivot: Narrow "Solution" Reveals the Wide Problem (15 mins)**  
  - **Core Insight:** Pre-specifying *allowed changes* assumes you know **what’s relevant** to an action.  
  - **Carrying Example:** **Pharmacy Closes at 6**  
    - *Why doesn’t this change "the capital of France" or "my cat’s mood"?*  
    - Formal narrow solution: Designer hardcodes "pharmacy hours don’t affect geopolitics/cats."  
    - Wide problem: *How does an agent **know** this relevance boundary?*  
  - **Why it Matters:** Humans infer relevance dynamically. Machines can’t without prior constraints.  
  - **Isolate the Frame Problem:**  
    - **Not Qualification:** "Does the pharmacy *have* hours?" (preconditions).  
    - **Not Ramification:** "If closed, can I get meds?" (knock-on effects).  
    - **Pure Frame:** "Why doesn’t closing the pharmacy affect *unrelated* truths?"  

  ---

  #### **4. Why the Wide Problem Matters for Minds (15 mins)**
  - **Holism’s Ghost:** Quine says any belief *could* connect to any other. But cognition *isn’t* paralyzed!  
  - **The Tension:**  
    - Holism: All knowledge is interconnected → Changing one belief *should* require checking everything.  
    - Cognition: We update beliefs locally → *We ignore almost everything*.  
  - **Kill Misconceptions #3 & #4 (Complexity/Not-Human):**  
    - *"It’s not about computation speed. It’s: How do we *know* what to ignore? Humans do this effortlessly; that’s the mystery."*  
    - *"Your brain solves the wide problem trillions of times daily. You just don’t notice."*  

  ---

  #### **5. Misconception Map & Defense (5 mins)**
  - **"Solved in the 80s"**: **Half-right.** Narrow is tamed; wide is untouched. *(Emphasize this repeatedly.)*  
  - **"Just Complexity"**: **Wrong.** Relevance ≠ computation. A god with infinite speed still needs to know what to compute.  
  - **"Machines Only"**: **Dead wrong.** Frame problem *arises from* how *any* representation system handles holism.  
  - **"Everything is Frame"**: **Bracket early.** Show the triad: Frame (inertia) vs. Qualification (preconditions) vs. Ramification (consequences).  

  ---

  #### **6. Closing Question & Omissions (5 mins)**  
  - **Separator Question:**  
    *"Quinean holism says every belief is connected. Why don’t you worry that the pharmacy closing at 6 means the Eiffel Tower might vanish?"*  
    → Correct answer surfaces *relevance-grounding*, not just "it’s irrelevant."  
  - **Announced Omissions (Say These Aloud):**  
    1. *"We didn’t discuss how actions *fail* (qualification problem), e.g., the mug is glued down."*  
    2. *"We skipped modern AI workarounds (e.g., ML heuristics)—not because they’re unimportant, but to isolate the philosophical core."*  
    3. *"We treated ‘relevance’ as atomic. Its psychology/neuroscience is a separate debate."*  

  ---

  ### **Why This Works**
  - **Pharmacy Example Load-Bearing Traits:**  
    - Mundane (avoids robot/bomb distractions).  
    - Focuses on *epistemic inertia* (what *stays true*), not action feasibility or causality.  
    - Isolates relevance: Pharmacy hours vs. cat mood is clearly arbitrary, not logical.  
  - **Pivot Clarity:** Narrow solution’s "cheat" (pre-specified relevance) *is* the wide problem.  
  - **Holism Tension:** Students see why this isn’t just AI—it’s about how minds *simplify* a Quinean world.  

  **Final Tip:** Start with "What changes when you move a mug?" and end with "How do you *know* what doesn’t change?" The gap between those questions is the lecture.
