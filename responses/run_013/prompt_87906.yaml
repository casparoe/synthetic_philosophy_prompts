answer: |-
  Below is a decision tree for moral worth in a graduate seminar handout format. The tree starts from the most general question and branches through key distinctions, using concrete cases to test positions. Each leaf includes a named position, one sentence on its most awkward commitment, and confidence in its representation. The tree locates the competence view and notes unoccupied combinations.

  ---

  ### **Moral Worth Decision Tree**  
  *Organizing Question: What makes an action morally worthy in the distinctively moral sense?*  
  *Test cases: Bystander (spontaneous compassion), Donor (gives for pleasure of superiority), Soldier (drilled obedience), Agent A (acts rightly for benign irrelevant reason), Agent B (acts rightly for bad reason that matches right-making feature), Reluctant Accomplice (refuses wrongdoing from cowardice), Mistaken Agent (well-meaning but objectively wrong action).*

  #### **Start: Q1. Is moral worth fundamentally about the agent’s psychology?**  
  - **No** → Go to Q2.  
  - **Yes** → Go to Q3.  

  ---

  #### **Q2. Does moral worth instead depend on the action’s objective properties?**  
  - **Yes** → **Leaf: Act-Based View**  
    - *Most awkward commitment:* The reluctant accomplice (who refuses wrongdoing from cowardice) has moral worth because the *act* is right, regardless of their contemptible motives.  
    - *Confidence:* High (e.g., simple consequentialist views).  
  - **No** → **Leaf: Scepticism**  
    - *Most awkward commitment:* We must abandon intuitions about "praiseworthy" motives (e.g., the compassionate bystander vs. the selfish donor) as morally insignificant.  
    - *Confidence:* High (e.g., error theorists).  

  ---

  #### **Q3. Must the agent’s operative motive be the very feature that makes the action right?**  
  - **Yes** → **Leaf: Coincidence View**  
    - *Most awkward commitment:* Agent B (acts rightly for a bad reason that matches the right-making feature, e.g., repaying a loan to a gangster to avoid violence) has moral worth, as their motive coincides with the right-making reason.  
    - *Confidence:* Moderate (e.g., variants of "right reasons" views).  
  - **No** → Go to Q4.  

  ---

  #### **Q4. Is acting from the thought of duty (or "acting rightly") sufficient?**  
  - **Yes** → **Leaf: Strict Acting-from-Duty View**  
    - *Most awkward commitment:* The bystander (rescuing from spontaneous compassion) lacks moral worth, as they did not act from duty.  
    - *Confidence:* High (e.g., Kantian views).  
  - **No** → Go to Q5.  

  ---

  #### **Q5. Is a good occurrent motive sufficient for moral worth?**  
  - **Yes** → **Leaf: Quality-of-Will View**  
    - *Most awkward commitment:* The soldier (acting from drilled obedience) has moral worth only if their motive aligns with "right reasons" (e.g., protecting others), not mere habit.  
    - *Confidence:* High (e.g., care ethics or Humean-inspired views).  
  - **No** → Go to Q6.  

  ---

  #### **Q6. Is a good motive necessary but not sufficient?**  
  - **Yes** → **Leaf: Hybrid View**  
    - *Most awkward commitment:* Agent A (acts rightly for a benign irrelevant reason, e.g., helping because it’s fun) lacks moral worth despite a good motive, as additional conditions (e.g., action’s rightness) are unmet.  
    - *Confidence:* Low (plausible but rarely defended explicitly; may resemble "motivational internalism" hybrids).  
  - **No** → Go to Q7.  

  ---

  #### **Q7. Does moral worth derive from character or competence, not occurrent motives?**  
  - **Character** → **Leaf: Character-Expression View**  
    - *Most awkward commitment:* The donor (gives for pleasure of superiority) may express a vicious character and lack moral worth, even if the act is right.  
    - *Confidence:* High (e.g., virtue ethics).  
  - **Competence** → **Leaf: Competence View**  
    - *Most awkward commitment:* The donor (gives for pleasure of superiority) has moral worth if they exercise reliable competence (e.g., selecting effective charities), despite ignoble motives.  
    - *Confidence:* Moderate (instructor’s view; near reliabilist theories).  
    - *Relation to other leaves:* Nearest to Character-Expression View but diverges on whether motives matter (e.g., the soldier acting from drilled obedience has moral worth on this view if reliably competent, but not on Character-Expression).  

  ---

  ### **Unoccupied Combinations & Tree Limitations**  
  - **Unoccupied: Standing disposition + Coincidence requirement.**  
    - *Diagnosis:* Coherent but unexplored. A view requiring a standing disposition to track right-making features (not just occurrent motives) could avoid the Soldier problem but may conflate with Competence or Character views.  
  - **Unoccupied: Motive-irrelevant + Psychology-irrelevant (beyond Scepticism).**  
    - *Diagnosis:* Incoherent. If worth depends on neither acts nor psychology, it lacks a plausible bearer (leading to Scepticism).  
  - **Tree cannot separate:** Quality-of-Will and Competence views in cases like the Mistaken Agent. Both *may* attribute worth if the agent acts for (apparent) right reasons or exercises competence, but the tree relies on test cases (e.g., Donor) to differentiate them.  

  ### **Confidence Summary**  
  - Highest confidence: Strict Acting-from-Duty, Quality-of-Will, Character-Expression, Scepticism (well-established).  
  - Moderate confidence: Act-Based, Coincidence, Competence (defended in literature, though Competence is newer).  
  - **Least confident placement: Hybrid View (Q6).**  
    - *Why:* It is rarely articulated as a standalone position; it may collapse into stricter motive-based views (e.g., if "additional conditions" are just duty) or Act-Based views (if "additional conditions" require objective rightness).  

  ---  
  *Tree designed for clarity in seminar discussion. Use test cases to traverse branches and expose commitments.*
