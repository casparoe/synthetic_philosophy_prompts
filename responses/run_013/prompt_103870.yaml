  Okay, defeaters. The strongest might be the brain scan variant they mentioned. If a scan detects intention before action, and you know this, forming the intention becomes rational because you can't change your mind after detection. This directly challenges their view by making intention voluntary and effective at the moment of formation. I should rank this as fatal because it removes the "change your mind later" loophole.

