  I hold that the toxin puzzle is best read as showing that intentions are not directly voluntary: the rationality of intending to drink the toxin depends on the deliberative history that produced the intention, not on the reasons available at the moment of action, so the standard intend-now-and-change-your-mind-later response describes pretending or self-manipulation rather than a genuine solution. What would count against this view? I want the defeaters ranked from fatal to merely awkward, including which intuitions, possible cases, and results in decision theory or action theory it stands or falls with, and what my view predicts that rival accounts of intention do not. Consider in particular a variant where the billionaire pays on the basis of a brain scan that reliably correlates with intending, and one where the reward is a promise to a dying friend rather than money. Tell me which of these a defender of my view would concede as counting against them and which they would dismiss, and assess honestly whether the view has been insulated by qualifications, and if so whether that is a problem. Say how confident you are in what you claim and single out the point you are least sure of. Format as exactly five numbered items, each a sentence or two, with no introduction or conclusion.
