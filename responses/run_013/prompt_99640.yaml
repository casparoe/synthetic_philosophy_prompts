answer: |-
  ## Research Proposal: The Normative Scaffolding of Joint Action  

  **1. Precise Research Question**  
  Under what conditions does a structure of mutual accountability—specifically, the distribution of entitlements to demand actions, obligations to provide notice of exit, and standing to hold parties responsible—constitute joint action independently of shared intentions, joint commitments, or primitive we-intentions?  

  **2. Why Existing Positions Leave the Question Open**  
  Existing frameworks presuppose that joint action *must* be grounded in specific mental states (shared intention, joint commitment, or irreducible we-intention). Consequently, they treat cases of partial commitment, anticipated exit, or asymmetric expectations as *deviations* from paradigmatic joint action—either by excluding them (as non-genuine) or distorting them (as requiring "weaker" versions of shared mental states). This gap is not accidental but inherent: by defining joint action via mental unity, these theories render the *normative structure* of obligations and entitlements *derivative* of that unity. They cannot ask whether such normative structures might instead be foundational, because their core question ("What mental states make collective action joint?") assumes mental states are primary. The "messy" cases reveal not a deficit in participants’ minds, but a deficit in the theoretical framework.  

  **3. Method**  
  The project will proceed in four stages:  
  - **Stage 1: Diagnostic Critique**  
    Reanalyze standard "messy" cases (e.g., fragile co-authorship, provisional relationships, contingent subcontracting) to demonstrate how existing theories either exclude them or strain to accommodate them by stretching core concepts (e.g., positing "attenuated" shared intentions).  
  - **Stage 2: Positive Account Development**  
    Articulate the *normative scaffolding* model: joint action exists when participants recognize mutual accountability relations (e.g., A owes B notice before abandoning the task; B is entitled to rebuke A for unannounced exit; both are responsible for partitioning costs of failure).  
  - **Stage 3: Differentiation Test**  
    Apply the model to distinguish joint action from *mere interlocking individual actions* (e.g., sidewalk strangers): though coordination occurs, no obligations exist to negotiate exit, no standing to demand continuation, and no accountability for unilateral withdrawal.  
  - **Stage 4: Predictive Application**  
    Test the model against a novel case: **a temporary political coalition**. Parties A and B cooperate to pass a bill, each expecting the other to defect if polls shift. There is no shared goal beyond the bill’s passage, mutual distrust is high, but clear norms govern withdrawal (e.g., 72-hour notice required, public justification owed to coalition partners).  
    *Why this method?* Adding cases to existing debates would force them into mental-state categories. This approach instead *reframes the ontology* of joint action, asking how normative structures generate agency collectively.  

  **4. Form of Result and Failure Conditions**  
  - **Successful Result:** A defensible account showing that mutual accountability (a) constitutes joint action in "messy" cases where mental-state theories fail, (b) cleanly excludes mere coordination, and (c) predicts normative features in novel cases (e.g., the political coalition *is* joint action due to exit obligations, despite absent shared intention).  
  - **Failure Conditions:** The project fails if:  
    - Accountability relations collapse into mental states (e.g., "accountability just *is* a form of joint commitment").  
    - The model cannot exclude mere interlocking actions without tacitly appealing to shared intentions.  
    - The "messy" cases are convincingly shown to be parasitic on paradigmatic joint action (e.g., obligations in co-authorship derive from an implicit full commitment).  

  **5. Scope Assessment and Trimming Strategy**  
  - **Risk of Overextension:**  
    - The project could expand into metaethics (grounding normative obligations) or political philosophy (applying to institutional agency).  
    - Historicizing the "mental-state priority" assumption might require engaging with classical social contract theory.  
  - **Trimming Strategy:**  
    - **Priority:** Focus exclusively on contemporary debates in analytic philosophy of action (post-Bratman/Gilbert/Searle).  
    - **Limit:** Delimit "mutual accountability" to dyadic, small-scale cases (no corporations/states).  
    - **Simplify:** Treat the *existence* of accountability norms as a social fact (bracket their justification).  
    - **If Overwhelmed:** Drop the novel predictive case (Stage 4) and deepen the critique of existing frameworks using only the core "messy" cases.  

  ---  
  *Proposal satisfies constraints:*  
  1. **Differentiation from Mere Interlocking:** Sidewalk strangers lack mutual accountability (no owed notice/rebuke), while co-authorship entails obligations even amidst distrust.  
  2. **Additional Predictive Case:** The temporary political coalition (*is* joint action due to binding exit norms).
