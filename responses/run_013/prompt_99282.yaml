  Okay, let me unpack this request carefully. The user wants a satirical speculative fiction piece built around an unspoken societal asymmetry, executed with structural subtlety rather than explicit explanation. 

  Hmm, they're clearly well-versed in literary concepts - referencing Hofstadter's Person Paper and specifying craft over concept suggests they'll notice lazy execution. The constraints are precise: no exposition, no moralizing, and absolutely no using the words "default" or "marked" in the narrative. 

  First, I need to brainstorm fresh axes beyond common tropes. Handedness feels too obvious, birth order might not create enough systemic friction. The language axis could work but risks veering into immigration allegory. Ah - time of birth! That's underexplored. Daylight births as the invisible norm creates perfect bureaucratic absurdity: daylight-born people never need documentation, while night-borns constantly prove their legitimacy through paperwork. 

  *scribbles notes* The municipal setting should be something mundane yet consequential - maybe a cross-river ferry permit office? Perfect for a river town. The protagonist will be a night-born clerk processing daylight-born applicants, with the asymmetry shown through: 
  - Unmarked "normal" application forms vs night-born supplementary documents 
  - Colleagues asking "the usual confirmation?" only for certain files 
  - Daylight-born applicants addressed by surname only while night-borns get full protocols 

  *checks word count* For the author's note, I'll explicitly name time-of-birth asymmetry and link it to how certification systems create invisible burdens - but keep it clinical as requested. Must avoid any trace of exposition in the story itself. The queuing detail will show systemic friction physically - night-borns always take longer at the counter. 

  Biggest risk is over-explaining through dialogue. Solution: have characters use shorthand like "sun-affirmed" or "moon papers" without elaboration. The horror hides in how casually colleagues say "you know how it is with the dark-signed" while stamping forms. Final beat should be the protagonist quietly re-filing their own night-born paperwork after hours - the ultimate silent sting.
answer: |-
  ## The Ferryman's Queue

  The morning queue at the River Styx Licensing Authority – never *just* 'the Licensing Authority', unlike its counterpart, the Weighbridge Office – snaked predictably towards Mira’s counter. Her fingers were already ink-stained from processing the pre-dawn manifest for the *Persephone’s* crossing. Old Man Henderson, ruddy-faced and smelling faintly of pipe tobacco and damp wool (standard issue for the winter fleet captains), slid his renewal form across the worn laminate. Mira scanned it: Henderson, J., *Morning Star*, Class I Passenger Ferry. All standard boxes ticked, no asterisks, no appended schedules. She stamped it with a satisfying *thwack*.

  "All set, Captain Henderson. Safe crossings."

  Henderson grunted, already turning towards the harbour fog. Next was Mrs. Pendleton, her application for a shore-hugging skiff license equally straightforward. Pendleton, E., *Dabchick*. No supplementary documentation required. Mira processed it with the brisk efficiency honed over seven years at Counter Three.

  Then came the fellow with the nervous tic, blinking rapidly as he presented his papers. "Finchley," he announced, unnecessarily, as his name was printed clearly at the top: Finchley, A., *Moonraker*, Proposed Cargo Barge.

  Mira flipped to the second page. As expected: the Lunar Schedule Supplement. She cross-referenced the proposed operating windows against the master chart pinned above her station – a complex grid of permitted hours dictated not just by tides and traffic, but by celestial alignments deemed suitable only for certain… dispositions.

  "Ah, Mr. Finchley," Mira said, her voice neutral. "The proposed Tuesday night run falls during a waning gibbous phase. You’ll need the Harbourmaster’s counter-signature on Section Gamma for that moon-phase. Standard clearance won’t suffice." She tapped the relevant box, pristine and empty on Finchley’s form.

  Finchley’s shoulders slumped almost imperceptibly. "Of course. I thought… perhaps the new regulations…?"

  "The guidelines remain," Mira stated, sliding the form back towards him. "Just get Section Gamma initialed and rejoin the queue. Next!"

  The morning wore on, a rhythm punctuated by the stamp and the shuffle of feet on linoleum. Applicants flowed past Mira’s domain: Smythe with his dredger application (no modifiers, surname only, approved); the harbour pilot Davies renewing his deep-water certification (routine, surname only); a consortium applying for a new passenger liner – the *Solaris* – whose forms were so voluminous and unmarked by special considerations they practically processed themselves.

  Then, just before lunch lull, Elara Vance approached. Vance, E., *Current Whisper*, Hydrographic Survey Vessel. Mira pulled the file. Standard vessel specs, standard operator qualifications. But stapled to the back: the Tide Affidavit. Not strictly required for renewal, but recommended by the Authority’s internal procedures for operators whose work involved… less predictable elements. Mira noted Vance had included it unprompted. Wise.

  "Everything in order, Ms. Vance?" Mira asked, scanning the affidavit, verifying the notary seal against the list kept discreetly under her blotter. It was always a small relief when they brought it pre-emptively. Saved time.

  "Believe so," Vance replied, her voice steady. "Checked the spring tide tables myself."

  "Good practice," Mira murmured, stamping the renewal. "Approved. Three-year validity."

  Vance offered a brief, professional nod. "Thank you." No wasted words.

  Lunch in the cramped staff canteen was thick with the smell of reheated stew and bureaucracy. Mira shared her table with Gareth from Counter One and Anya from Inspections.

  "Busy morning?" Gareth asked around a mouthful of bread. "Had a fellow in wanting to run a night ferry for the new distillery workers. Utterly clueless about the lunar restrictions. Tried to argue precedent."

  Anya snorted. "Precedent? Does he think the tides listen to precedent? Or the… well, you know. Harbourmaster had to send him packing with the full Gamma form pack. Poor sod looked ready to weep." She took a sip of weak tea. "You get anyone interesting, Mira?"

  "Finchley was back," Mira said, carefully peeling an apple. "Needed Gamma again. Forgot it last week too."

  Gareth shook his head. "Honestly. You'd think after the first time, they'd learn to read the guidelines properly. It’s not like it’s hidden."

  Mira just hummed agreement, focusing on her apple. They meant the publicly available *Operating Hours & Celestial Considerations* booklet, which outlined the Lunar Schedule requirements in dense, bureaucratic prose. Finchley’s struggles were familiar, a minor friction in the machine.

  The afternoon brought the usual mix. A flustered applicant for a rowing club tender who’d left his surname off the form entirely – easily rectified with a prompt and a mild reprimand. A seasoned ferry captain, surname only, renewal smooth as the river on a windless day. Only one more Gamma form appeared, submitted by a weary-looking woman applying for a salvage tug license. Mira processed it efficiently, noting the Harbourmaster’s messy initials in the correct box. Standard procedure.

  Finally, the last straggler shuffled away. The overhead lights buzzed with the promise of departure. Mira tidied her counter, stacked the processed applications – the thick stack of unmodified forms, the thinner pile appended with supplements and affidavits. She locked her cash drawer.

  As she gathered her own things – coat, umbrella, the thermos long emptied – she paused. From her bottom drawer, tucked beneath spare forms and rubber bands, she retrieved her personal logbook. It wasn’t required, not officially. But she opened it to today’s date. Under 'Observations', she wrote in her neat, precise hand:

  > *Finchley (A.) – Lunar Supp. Req. (Waning Gibbous). Gamma auth. missing. Advised re: Harbourmaster.*
  > *Vance (E.) – Tide Aff. included. Proactive.*
  > *Salvage Tug App. (Gamma auth. present, valid).*

  She closed the logbook, placed it back in the drawer, and locked it. Taking a deep breath of the stale office air, Mira Vance picked up her things and joined the flow of clerks heading out into the twilight, towards the river and the encroaching dark.

  ---

  **Author's Note:** The asymmetry explored here hinges on the unspoken societal assumption that being born during daylight hours is the neutral, unremarkable norm. Those born at night ("dark-signed") navigate a world where their fundamental legitimacy requires constant, quiet certification – extra paperwork, special permissions, subtle confirmations – burdens never borne by the daylight-born, whose status is simply assumed. It stings because it mirrors how arbitrary, invisible birth circumstances can dictate lifelong friction within systems designed for an unstated 'normal'.
