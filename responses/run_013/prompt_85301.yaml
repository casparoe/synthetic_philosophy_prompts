answer: |-
  ## Joint Statement: Adversarial Collaboration on Biological Functions  
  **Between a Selected-Effects (Etiological) Theorist and a Systemic (Causal-Role) Theorist**  

  ### Part One: Agreed Claims  
  1.  **Bearer of Function:** Functions are primarily ascribed to *types* of traits (e.g., "the vertebrate heart") within a population or system. Token instances (e.g., a specific frog’s heart) inherit this functional ascription derivatively.  
  2.  **Normativity:** Function ascriptions imply normativity. To say a trait *has a function* entails that it *ought* to perform that activity under appropriate conditions. Malfunction (failure to perform the function *despite being intact and in context*) is distinct from disuse (non-operation without failure), damage (structural impairment), or mere accidental failure.  
  3.  **Concessions to Standard Objections:**  
      - *Causal-Role Concession:* Not every effect of a trait is a function. Functions are only those effects that contribute *robustly and specifically* to the current capacities of the containing system (e.g., circulation for the heart’s pumping, but not its sound).  
      - *Etiological Concession:* Not every function is an adaptation. Functions can arise via exaptation, and traits can have multiple functions. History determines *which* effects are functions, but not all functional traits were *originally* selected for their current effect.  
  4.  **Uncontroversial Cases:** Both agree that:  
      - Pumping blood is a function of the vertebrate heart.  
      - The sound produced by the heart is not its function.  

  ### Part Two: Disagreements Table  
  | Point of Disagreement                                                                 | Etiological Position                                                                                            | Causal-Role Position                                                                                             | Substantive (S) or Verbal (V)? |  
  | :------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------- | :----------------------------- |  
  | **1. Definition of "Function"**                                                       | A function is an effect for which the trait was *selected by natural selection* in the lineage.                | A function is an effect that *currently contributes* to the maintenance or capacities of the containing system. | S                              |  
  | **2. Novel Effects**                                                                  | A novel effect (not historically selected for) cannot be a function, even if currently beneficial.             | A novel effect *can* be a function if it currently sustains the system, regardless of history.                  | S                              |  
  | **3. Requirement of Selection History**                                               | A trait cannot have a biological function *unless* its bearer is part of a lineage with a history of selection. | A trait can have a function based purely on its current systemic role, even without selection history.          | S                              |  
  | **4. "Malfunction" without History**                                                  | If no selection history exists, "malfunction" is incoherent; only "failure" or "breakage" can occur.           | "Malfunction" applies if a trait fails to perform a current system-sustaining role, even absent history.        | S                              |  
  | **5. Function as "Proper Function"**                                                  | Only the historically selected effect(s) are *proper functions*; other effects are merely benefits.            | Any effect that robustly maintains the system is a function; no privileged status for historical effects.        | S                              |  
  | **6. Meaning of "For" (e.g., "The heart is *for* pumping")**                          | "For" implies historical purpose (selected effect).                                                            | "For" implies current causal role in system maintenance.                                                         | V (with S implications)        |  

  ### Part Three: Cruxes  
  1.  **What Kind/Amount of History is Required?**  
      - **Case:** A somatic cell lineage (e.g., antibodies) selected within an organism during its lifetime, but never transmitted to offspring.  
      - *Etiological Prediction:* Not a biological function. Selection requires heritability across generations.  
      - *Causal-Role Prediction:* Has a function. Somatic selection establishes a maintenance role within the organism.  
      - **Verdict:** Indecisive (hinges on definition of "selection").  

  2.  **Can Function Be Fixed Without Choosing a System Level?**  
      - **Case:** A bacterial protein preventing desiccation (organism-level benefit) and maintaining biofilm integrity (group-level benefit).  
      - *Etiological Prediction:* Function is fixed by the level at which selection acted historically.  
      - *Causal-Role Prediction:* Function requires specifying the system of interest (organism vs. group); no single "right" answer without context.  
      - **Verdict:** Indecisive (depends on whether system boundaries are objective or interest-relative).  

  3.  **Does a Function Survive Loss of Effect?**  
      - **Case:** A frog’s heart one hour after death, structurally intact but inactive in a corpse.  
      - *Etiological Prediction:* Yes. The function is defined by history, not current operation.  
      - *Causal-Role Prediction:* No. Without a living system to maintain, there is no function, only historical description.  
      - **Verdict:** Indecisive (reveals core divergence on normativity’s source).  

  ### Part Four: Case Analyses  
  1.  **Beetle Secretion:**  
      - *Etiological:* Anti-worm effect is **not** a function (novel, unselected effect). Sealing wounds remains the function.  
      - *Causal-Role:* Anti-worm effect **is** a function (currently sustains the beetle population).  
      - **Cut Against:** Causal-Role (if selection history is required for normativity).  

  2.  **Self-Assembling Microbe:**  
      - *Before Reproduction:*  
          - Etiological: **No function** (no selection history).  
          - Causal-Role: **Has functions** (e.g., membrane repair sustains the individual).  
      - *After Selection:* Both agree it **has functions**.  
      - *Designed vs. Accidental:*  
          - Etiological: **Matters.** Design confers function without natural selection.  
          - Causal-Role: **Irrelevant.** Function depends on current role, not origin.  
      - **Cut Against:** Etiological (if normativity requires history, the pre-reproduction system lacks it).  

  3.  **Antibody-Producing Cells:**  
      - *Etiological:* **No biological function.** Somatic selection ≠ evolutionary selection.  
      - *Causal-Role:* **Have functions** (binding affinity sustains the organism).  
      - **Cut Against:** Etiological (if somatic selection is sufficient for normativity).  

  4.  **Hearts After Cessation:**  
      - *Dead Frog / Bypassed Patient:*  
          - Etiological: Function **remains** (historical).  
          - Causal-Role: Function **ceases** (no sustaining role).  
      - **Cut Against:** Causal-Role (if normativity persists post-operation).  

  5.  **Bacterial Protein:**  
      - *Etiological:* Function defined by level of historical selection (e.g., if selection acted on desiccation resistance, that is the function).  
      - *Causal-Role:* Function is system-relative. Both effects can be functions if both systems (cell, biofilm) are valid.  
      - **Cut Against:** Etiological (if selection history doesn’t specify one level unambiguously).  

  ### Part Five: Verbal vs. Substantive Disagreement  
  - **Verbal Component:** The core verbal disagreement is the meaning of "function" (historical purpose vs. current role). This also extends to terms like "for," "purpose," and "malfunction."  
  - **Substantive Remainder:** Setting aside terminology:  
      1.  **Source of Normativity:** Does the "ought" in function claims derive from history or current system dynamics?  
      2.  **Scope of Biology:** Must functional explanations in biology always reference evolutionary history?  
      3.  **Novelty & Plasticity:** Can a trait acquire a *new normative role* within a system without historical precedent?  

  ---  
  **Closing Note:**  
  *The following sentences contain subtle linguistic bias toward the causal-role position:*  
  - "Functions are only those effects that contribute *robustly and specifically* to the **current capacities** of the containing system" (Part 1.3).  
  - "*Currently beneficial*" (Part 2.2, Causal-Role column) implies benefit is sufficient for function.  
  - "Somatic selection establishes a **maintenance role**" (Part 3.1, Causal-Role Prediction) frames selection as role-establishing.  
  *Bias toward the etiological position is minimized, but phrases like "historical purpose" (Part 5) may implicitly privilege history.*
