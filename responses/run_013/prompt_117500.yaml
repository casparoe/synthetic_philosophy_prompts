  Defence:

    The EU defender will say: the cycle (or the difference between A and B) arises because the chooser is valuing the description, not the outcomes. In particular, the chooser might enjoy the idea of having two independent projects (in Option A) and that is why they assign a higher value. But this is a preference over the description, not over the consequences.

    Reply: The chooser is fully informed and knows that A and B have the same reduced distribution. Moreover, the consequences are the same: the same monetary prizes with the same probabilities. The branch-weighting model is meant to capture the cognitive process of weighting probabilities as they are described. The defender might argue that any adequate theory should be distributional, but this case shows that a branch-weighting model that is not distributional can explain patterns that look like violations of independence without invoking any additional preference over descriptions. The key is that the branch-weighting model is still consequentialist in the sense that it only cares about the prizes and the branches (which are part of the description of the lottery). But the defender might counter that the branches are not part of the consequence. 

    The strongest move: The two options A and B are not identical in every respect the chooser cares about because the process of winning might matter. For instance, in Option A, there are two independent chances to win, which might be more exciting. Therefore, the chooser is not indifferent between the two.

    Our reply: We stipulated that the chooser only cares about the monetary outcomes and is fully informed. But if the defender insists that the process matters, then we must design the case so that the process is identical in every respect except the description. In our case, we described Option A as having two projects, but we could instead describe it in a way that is equally natural and where the process is not enjoyable. For example, the two projects are two independent coin flips administered by a computer, and the chooser only sees the final outcome. The description is just a way of specifying the probabilities. We could also describe Option B as a single coin flip with a biased coin that lands on win with 0.75 probability. The chooser is told the branch structure but does not experience any difference in the process. 

    However, the defender might still argue that the branch structure is part of the outcome: having two wins might feel different than one win, even though the monetary outcome is the same. We must ensure that the monetary outcome is the only thing that matters. In our case, we explicitly state that the bonus is $100 at most, regardless of how many projects succeed. So the consequence is purely monetary.

