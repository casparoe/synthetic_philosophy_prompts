answer: |-
  Elizabeth Anscombe's objection to Truman's honorary degree stemmed primarily from her application of **Catholic just war principles, particularly the doctrine of double effect (DDE) and the absolute prohibition against intentionally targeting non-combatants.** Her critique wasn't solely about the *scale* of death, but crucially about the **intention** and **nature of the act** itself. Here's why she saw the atomic bombings as "murder" compared to other bombing campaigns:

  1.  **The Core Issue: Intention and the Object of the Act:**
      *   Anscombe adhered strictly to the principle that **intentionally killing innocent non-combatants is always murder**, regardless of the context (war or peace). This is an absolute moral prohibition in traditional just war theory.
      *   The **Doctrine of Double Effect (DDE)** allows foreseen but *unintended* deaths of non-combatants as a side-effect of a legitimate military action targeting combatants or military objectives, provided the action itself is good or neutral, the bad effect is not intended, the good effect is proportional, and there's no better way to achieve the good effect.
      *   **Anscombe's Argument:** The atomic bombings of Hiroshima and Nagasaki were designed and executed **specifically to kill vast numbers of civilians** (along with the military personnel present) to terrorize the Japanese government and population into surrender. The cities themselves were the primary targets. The civilian deaths were not an *unintended side-effect* of attacking a military target; they were the *intended means* to achieve the goal (surrender). Therefore, the *object of the act* (killing civilians) was intrinsically evil.

  2.  **Why the Atomic Bombings Specifically Embodied This Intention:**
      *   **Weapon Choice & Target Selection:** The atomic bomb was a weapon of unprecedented, indiscriminate destruction. Choosing to use it *on entire cities* demonstrated that its purpose was mass annihilation. There was no pretence of precision aiming at specific military installations within the cities; the cities *were* the targets.
      *   **Strategic Goal:** The stated strategy was to shock Japan into surrender by demonstrating the overwhelming destructive power of the bomb *on civilian populations*. The deaths of civilians were directly instrumental to achieving this goal – they were not collateral damage, they were the mechanism.
      *   **Lack of Distinction:** The nature of the weapon and the targeting made any meaningful distinction between combatants and non-combatants impossible. It was inherently indiscriminate in its effects on the target chosen.

  3.  **Conventional Firebombing vs. Atomic Bombing: A Nuance for Anscombe (Though Still Problematic):**
      *   Anscombe was also deeply critical of the Allied strategic bombing campaign against cities (like Dresden or Tokyo). She likely saw many instances of it as morally illicit for similar reasons.
      *   However, the *theoretical justification* offered for conventional bombing raids could sometimes (however dubiously) appeal to DDE: e.g., targeting a factory or rail hub within a city, foreseeing but not *intending* the civilian deaths that resulted. The *stated* object of the act could be framed as destroying military infrastructure, not killing civilians *per se*.
      *   The **atomic bombings stripped away any plausible claim of DDE.** The scale, the nature of the weapon, and the explicit selection of cities as undifferentiated targets made the *intention* to kill civilians overwhelmingly clear and central. There was no "military objective within the city" being targeted; the city itself was the target. For Anscombe, this crossed a bright line.

  4.  **Scale, Proportionality, and Necessity as Reinforcing Factors (But Not Primary):**
      *   While intention was paramount, the **sheer scale and indiscriminate nature** of the atomic bombings reinforced the impossibility of claiming the civilian deaths were unintended side-effects. It made proportionality calculations absurd – how could the "good" effect (accelerating surrender, saving Allied lives) ever be proportional to the instantaneous annihilation of tens of thousands of non-combatants?
      *   **Lack of Necessity:** Anscombe strongly argued that the bombings were *not* necessary to force surrender. She pointed to alternatives like a demonstration, awaiting the Soviet declaration of war (which happened days after Nagasaki), or modifying surrender terms regarding the Emperor earlier. If alternatives existed that avoided mass civilian slaughter, using the bomb became even harder to justify under any principle.

  **In Summary: What Made it "Murder" for Anscombe:**

  *   **Direct Intention:** Truman's order intentionally made the mass killing of non-combatants the *means* to achieve the end (Japan's surrender).
  *   **Object of the Act:** The chosen act (dropping an atomic bomb on a city) had the *inherent object* of mass civilian slaughter. This object is intrinsically evil.
  *   **Violation of Non-Combatant Immunity:** It directly and deliberately violated the absolute prohibition against targeting non-combatants.
  *   **Failure of Double Effect:** The civilian deaths were not an unintended side-effect; they were the intended mechanism of terror and coercion.
  *   **Indiscriminate Weapon on Indiscriminate Target:** The weapon's nature and the target selection made discrimination impossible.

  While Anscombe condemned much of the strategic bombing campaign, she saw the atomic bombings as the starkest, clearest, and most inarguable example of a wartime act where the *intentional killing of civilians was the direct method employed by a head of state*. For her, this met the definition of murder, putting Truman beyond the pale of receiving an honor from a university committed to moral inquiry. The *scale* was horrific evidence of the *intention* and the nature of the act, but it was the *intention* itself that constituted the moral crime of murder.
