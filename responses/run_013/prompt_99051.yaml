  - The safest framing (instrumental) might be the least informative. For example, the reader might want to know that mathematicians believe they are discovering truths. The reporter can add a quote from the mathematician to convey that, while keeping the prose instrumental.
  - The procedure relies on the reporter's ability to judge uncontroversial status and indispensability, which might be error-prone under deadline. When in doubt, default to instrumental or attribute.
  - For physical theories that use mathematics, the procedure only addresses the mathematical object. The physical interpretation must be handled separately (e.g., by attribution).
  - The procedure does not handle cases where the existence claim is about a physical entity that is mathematically described. It only handles claims about mathematical objects.

  **Final Procedure Summary:**

  1. **Mathematical object?** No → stop. Yes → 2.
  2. **Defined in the work?** Yes → **invented**. Stop.
  3. **Claimed without proof?** Yes → **instrumental**. Stop.
  4. **Uniquely characterized?** (After proof) → This step doesn't branch; we always go to 5.
  5. **Indispensable to confirmed science?** 
     - Used in confirmed theory and no alternative? → **discovered**. Stop.
     - Otherwise → 6.
  6. **Uncontroversial in the field?** Yes → **discovered**. No → **instrumental**. (If unsure, **instrumental**.)

  **Handover to editor:** If at step 5, the indispensability is unclear (e.g., the reporter cannot determine if there is an alternative) and the object is not clearly uncontroversial (step6), then the reporter should consult the editor. But in practice, we default to instrumental in step6 if not uncontroversial.

  We ran the three cases:

  1. Extra dimensions: For the mathematical space, we got **discovered** (because it's standard and uncontroversial).
  2. Structural object: **discovered** (because proven and uncontroversial in math).
  3. Large cardinal: **instrumental** (because controversial and not indispensable).

  Note: In the first case, if the space is newly defined, it would be invented. But we assumed it's standard.
answer: |-
  Below is a decision procedure designed to help you navigate existence claims in your science writing. It focuses on **reportable facts** (what the source did, what the community accepts, what's indispensable to the science) rather than metaphysics. The goal is to avoid smuggling in philosophical commitments (e.g., Platonism, fictionalism) by relying on observable evidence, consensus, and the role of the mathematics in the science. The procedure outputs one of three framings:  
  - **Discovered**: The object is treated as pre-existing (e.g., "mathematicians discovered a prime number").  
  - **Invented**: The object is treated as a human creation (e.g., "researchers defined a new algorithm").  
  - **Instrumental**: The object is treated as useful machinery, with no reality claims (e.g., "the theory uses a mathematical tool to predict outcomes").  

  The procedure prioritizes questions you can answer quickly using sources, public consensus, or your beat knowledge. It stops early if a clear framing emerges, flags contested philosophical premises, and defaults to caution (usually instrumental) when uncertainty remains. If the outcome depends on philosophical taste (e.g., no consensus, no clear indispensability), it advises handing the decision to you or your editor.  

  ---

  ### **Decision Procedure for Mathematical Existence Claims**  
  **Time:** ≈10 minutes per existence claim in your draft.  
  **Input:** A sentence or short passage making an existence claim about a mathematical object (e.g., "scientists found a new manifold," "this space exists").  
  **Output:** One of {Discovered, Invented, Instrumental}, with checks to perform.  

  1. **Is the object explicitly defined by stipulation in the source's work?**  
     - **Check:** Look for phrases like "we define X as..." or "let X be..." in the source material. If the source created the object by fiat (e.g., naming a new class of numbers), it's stipulation.  
     - **Adequate answer:** Yes (defined in the paper/preprint) or no (not defined here).  
     - **If yes → Framing = Invented.**  
       - **Rewrite:** "The team defined X to..." or "researchers constructed X..."  
       - **Stop.** Stipulation is an act of invention; no metaphysics needed.  
     - **If no → Proceed to Q2.**  
     - **Why?** Stipulation is a human action, so "invented" is uncontroversial. Avoids debates about abstract objects.  

  2. **Is the existence claimed without proof (e.g., assumed, conjectured, or postulated)?**  
     - **Check:** Does the source assume existence to build a theory? Look for words like "suppose," "assume," or "postulate." If existence is asserted but not proven, it's claimed without proof.  
     - **Adequate answer:** Yes (no proof given) or no (proof is provided).  
     - **If yes → Framing = Instrumental.**  
       - **Rewrite:** "The model assumes X..." or "the theory uses X as a framework for..."  
       - **Stop.** Untested assumptions are tools; no need to endorse reality.  
     - **If no → Proceed to Q3.**  
     - **Why?** Assumptions are provisional; treating them as discovered smuggles realism.  

  3. **Is the object characterized non-uniquely (e.g., defined only by its role in a structure)?**  
     - **Check:** Does the source describe the object by what it *does* (e.g., "X satisfies property Y") without specifying *which* object it is? If multiple candidates fit, it's non-unique.  
     - **Adequate answer:** Yes (e.g., "any object with these properties works") or no (e.g., "X is the unique solution").  
     - **If yes → Framing = Instrumental.**  
       - **Rewrite:** "X serves as a placeholder for..." or "the structure requires a component that..."  
       - **Stop.** Non-unique objects are tools in a structure; realism is thorny (structuralism/fictionalism debates).  
     - **If no → Proceed to Q4.**  
     - **Why?** Non-uniqueness undermines "discovered" (no specific thing was found) and "invented" (no specific thing was built).  

  4. **Is the mathematics indispensable to an empirically confirmed scientific result?**  
     - **Check two sub-questions:**  
       - **a. Is the object used in a scientific theory with empirically tested predictions?** (e.g., predictions match experiment/data).  
       - **b. Is there no known alternative theory that achieves the same predictions without this object?** (Check source or citations; if alternatives exist, indispensability weakens).  
     - **Adequate answer:**  
       - Yes (both a and b): Mathematics is indispensable to the science.  
       - No (a or b false): Mathematics is not indispensable (may be explanatory only).  
     - **If yes → Proceed to Q5 (indispensability supports "discovered").**  
     - **If no → Framing = Instrumental.**  
       - **Rewrite:** "X streamlines calculations for..." or "the approach employs X to explain..."  
       - **Stop.** If not indispensable, it's a tool or convenience.  
     - **Contested premise:** This uses Quine-Putnam indispensability (math is real if essential to science). If wrong, "discovered" may overcommit. **Safeguard:** Only use if evidence for (a) and (b) is strong.  
     - **Why?** Separates genuine indispensability (science relies on it) from mere usefulness in explanation (source could have used other math).  

  5. **Is the object uncontroversially accepted in its field?**  
     - **Check:** Is this object/type widely treated as real by practitioners? For example:  
       - Uncontroversial: Primes, manifolds in established contexts.  
       - Controversial: Large cardinals, infinite sets, or new objects with debate.  
       - Use beat knowledge: Textbooks, reviews, or expert consensus.  
     - **Adequate answer:** Yes (no significant debate) or no (active disagreement or uncertainty).  
     - **If yes → Framing = Discovered.**  
       - **Rewrite:** "Researchers discovered X..." or "scientists found that X exists..."  
       - **Stop.** Consensus licenses "discovered" as a reported fact about the field's attitude.  
     - **If no → Framing = Instrumental.**  
       - **Rewrite:** "The proof shows X can be used for..." or "X provides a method to..."  
       - **Stop.** Controversy makes realism risky; default to instrumental.  
     - **Why?** Consensus reflects epistemic access (e.g., mathematicians act like they "find" primes). No consensus? Avoid taking sides.  

  **Handover to editor:** If Q4 (indispensability) is unanswerable under deadline (e.g., alternatives unclear) and Q5 (consensus) is uncertain, **stop and consult**. What remains is philosophical taste (e.g., "Is math discovered or invented?"). Rewrite to attribute claims to the source (e.g., "Dr. Smith argues X exists") or use instrumental framing as a fallback.  

  ---

  ### **Case Studies**  
  **Case 1: Physicist reports extra dimensions in a theory**  
  - **Context:** Theory requires extra dimensions for predictions; dimensions aren't observed, but predictions match experiment.  
  - **Run procedure:**  
    - Q1: Not stipulation (dimensions are inferred, not defined). → Proceed.  
    - Q2: Existence claimed without proof? Yes (dimensions postulated, not proven). → **Framing = Instrumental.**  
  - **Rewrite:** "The theory uses extra dimensions as a mathematical tool to predict experimental results."  
  - **Why?** Dimensions are assumed, not proven or uniquely measured. Indispensability (Q4) might apply, but Q2 stops early. Instrumental avoids endorsing unobserved physics.  

  **Case 2: Mathematician proves existence of a non-unique object**  
  - **Context:** Proof shows an object must exist to fulfill a structural role, but it could be any of several candidates.  
  - **Run procedure:**  
    - Q1: Not stipulation. → Proceed.  
    - Q2: Existence not claimed without proof (proven). → Proceed.  
    - Q3: Object non-unique? Yes (defined by role, multiple candidates). → **Framing = Instrumental.**  
  - **Rewrite:** "The proof shows that a component with specific properties must exist in this structure, serving as a key placeholder."  
  - **Why?** Non-uniqueness blocks "discovered" (nothing specific found) and "invented" (no construction). Structural roles are instrumental.  

  **Case 3 (Chosen for disliked outcome): A new type of infinity in set theory**  
  - **Context:** Mathematician proves a large cardinal (a huge infinite number) exists under debatable axioms. No scientific use; controversy in the field.  
  - **Run procedure:**  
    - Q1: Not stipulation. → Proceed.  
    - Q2: Existence proven (not assumed). → Proceed.  
    - Q3: Non-unique? Often yes (large cardinals defined by properties, not unique). → Proceed.  
    - Q4: Indispensable to science? No (pure math, no empirical predictions). → **Framing = Instrumental.**  
  - **Why you'll dislike it:** You may want "discovered" for drama (e.g., "mathematicians uncover a new infinity"), but the framing is instrumental.  
  - **What to do:**  
    - **Rewrite instrumentally:** "The proof demonstrates how large cardinals can resolve longstanding set-theory problems."  
    - **Add attribution for flavor:** Quote the source saying, "We feel we've discovered something profound," but keep your prose instrumental.  
    - **Editor consultation:** If the story hinges on existential awe, discuss reframing as the mathematician's perspective (e.g., "For Dr. Lee, this infinity feels discovered").  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Settle metaphysics:** It doesn't resolve if math is "real." It flags commitments in your *prose* based on reportable facts.  
  2. **Handle empty distinctions:**  
     - For stipulations (Q1), "discovered vs. invented" is empty—rewrite as "defined."  
     - In pure math with no science (Q4), "discovered" relies on consensus (Q5). If none, instrumental is safest.  
  3. **Avoid dullness-risk tradeoffs:**  
     - Safest = instrumental, but it may feel dry (e.g., "tool" not "discovery"). **Fix:** Use quotes for color (e.g., "a revelation" [source]) while your framing stays neutral.  
     - Example: In Case 3, instrumental is less quotable but avoids letters-column attacks.  
  4. **Misfires:**  
     - **Over-reliance on consensus (Q5):** If consensus shifts post-publication, "discovered" may age poorly. **Fix:** Hedge with "according to current consensus."  
     - **Indispensability blind spots (Q4):** If alternative theories emerge later, "discovered" may be challenged. **Fix:** Specify "as of now, no alternatives exist."  
     - **Explanation vs. science conflation:** If the math is only for explanatory elegance (not predictions), Q4 catches it. **Fix:** Ask sources: "Could the science work without this math?"  
  5. **Edge cases:**  
     - **Physical/abstract hybrids:** E.g., "the universe is a manifold." Handle the math part with this procedure; the physical part requires attribution (e.g., "physicists propose the universe is...").  
     - **Historical context:** If reporting past work (e.g., "Einstein discovered curved spacetime"), use Q5 consensus retroactively.  

  **Final Tip:** Pre-run this on a template:  
  ```  
  Sentence: "[Existence claim]"  
  Q1: [Y/N] → ...  
  Framing: [Discovered/Invented/Instrumental]  
  Checks: [e.g., "Confirm no stipulation in source"]  
  ```  
  With practice, it’ll fit your deadline. When stuck, instrumental + attribution is your escape hatch.
