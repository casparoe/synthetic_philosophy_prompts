prompt: |-
  I am a fourth-year PhD student in philosophy of science, working on imprecise probability and its applications, and I am six months into a placement as the decision analyst for a national regulator that handles chemical approvals, fishery closures, and emissions permits. I sit with a panel of five or six scientists from different disciplines, decisions arrive roughly weekly, each has to be signed off by a director, and I get about two hours per case, which is nowhere near enough to run a proper elicitation. The current practice is to pick one expert's number as the central estimate and, when the case is politically hot, to add a conservative number that nobody can defend except by calling it conservative; the lawyers then want a single number they can write into the decision document, and the economists want it to be an expected value. An approval can cost several hundred jobs or produce a handful of excess cancers, so none of this is hypothetical, and I would like to replace it with a written procedure I can actually run and defend, one that a competent analyst who is not a decision theorist could execute and that I could hand to whoever takes this desk after me.

  The hard part is not the arithmetic but the translation, so the procedure has to be explicit about the modelling choices that fix the answer before any decision rule is applied. What I usually receive is: two or three competing model classes, each with parameter estimates from the experts who favour it; a spread of point estimates for the parameter that matters; and occasionally an expert who refuses to give a number at all on the grounds that every model class on the table is wrong. I do not know what to do with that refusal, and I suspect it is not a probability and should not be pressed into service as one. I also have to decide how the set of probabilities gets built: a list of expert point estimates is not yet a set of distributions, treating two parameters as independent is a substantive assumption that will quietly shrink the answer, and the difference between possessing a set of probabilities and possessing a second-order distribution over them matters a great deal, because in the second case I am back inside an ordinary expected-utility calculation and the whole exercise has lost its point. Once the set exists, the rules on offer behave very differently. A cheap filter will often settle the case with no rule at all: if one act beats the other under every distribution in the set, the imprecision is irrelevant and the elaborate machinery is unnecessary. Taking the best worst case is easy to compute but gives veto power to whichever member of the set is most extreme, so an act can be chosen that is worse than its rival under all but one distribution. The more permissive criteria, which only ask that an act not be beaten under every distribution, do not deliver a complete ranking, so two honest analysts can reach different recommendations from identical inputs. And I have read enough to worry that some of these rules make information worthless or even harmful, and that whichever rule I fix in advance will constrain what I can do with the next piece of evidence.

  Please write the procedure. Use these headings in this order. (1) "Inputs and preconditions": what I must have in hand before the procedure can run, what to do with the expert who refuses to give a probability, and when to stop and fetch a statistician instead — roughly 250 words. (2) "The procedure, step by step": an ordered set of steps, each naming the question it answers, what counts as a sufficient answer, and where it exits; begin with the cheap filter that determines whether the imprecision matters at all, then say which rule to adopt under which features of the case (irreversibility, who bears the risk, whether the disagreement is about the world or about how much a bad outcome counts), then include a step for producing the single number the lawyers require together with an account of what that number does and does not mean — roughly 700 words. (3) "Case one": apply it to whether to set a tolerable daily intake at a level that would effectively remove a widely used crop-protectant from the market, where the panel's cancer-potency estimates span two orders of magnitude and two of the five members believe the dose-response model class is wrong — roughly 400 words. (4) "Case two": apply it to whether to close a fishery, where the interval around the collapse threshold is wide but the comparison between closing and staying open may come out the same way under every distribution in the set; one of these two cases should land on an answer I will not like — roughly 400 words. (5) "Where this procedure fails": what it cannot settle, how it will misfire, including any phenomenon in which acquiring information leaves my posterior interval wider rather than narrower, any step whose apparent neutrality conceals a value judgment, and what I should tell the director I cannot give her — roughly 300 words. (6) "Bottom line": no more than 150 words, the procedure in miniature, for the version of me who has ten minutes and a hostile audience. I need no citations or reading lists; I need the procedure to be usable, and I need you to be candid about which steps are judgment dressed up as method.
reasoning: |-
  We are designing a procedure for decision-making under deep uncertainty with expert disagreement, using imprecise probability. The goal is to be transparent, defensible, and usable by a non-specialist. We'll follow the specified structure.

  (1) Inputs and preconditions (approx 250 words)

  Before starting, you must have:
  - A clearly defined decision problem with at least two alternative actions (e.g., approve/deny, set a specific TDI, close fishery/not).
  - A set of consequences (e.g., jobs lost, cancers, fishery collapse) that matter to the decision, and an understanding of which groups bear the risks.
  - A panel of experts providing input on the key uncertain parameters. Each expert must either:
    (a) Provide a point estimate for the parameter, OR
    (b) Provide a range (interval) for the parameter, OR
    (c) Express that they cannot provide a number because they reject all model classes. 
  - At least two distinct point estimates or ranges (from different experts) for the key parameter(s). If only one expert provides a number and others refuse, the procedure halts: you must either (i) reconvene the panel to explain the importance of quantifying uncertainty, (ii) seek additional experts, or (iii) if time is critical, treat the single number as the central estimate and note the refusal as a major limitation.

  The expert who refuses to give a number on model grounds is recorded as such. Their refusal does not contribute to the set of probabilities. Instead, note that the set of models considered might be incomplete, and this is a source of uncertainty that cannot be quantified. The procedure can still run with the remaining experts, but the final decision must account for this unquantified uncertainty.

  If the disagreement is about the structure of the model (e.g., which variables matter, functional forms), and the experts cannot agree on a common set of parameters, stop and call a statistician or modeler. Structural uncertainty requires more time and modeling effort than this procedure allows.

  (2) The procedure, step by step (approx 700 words)

  Step 1: Cheap filter (determines if imprecision is irrelevant)
  - For each action, compute the set of expected utilities (or expected net benefits, if in monetary terms) across all distributions in the set. Use the provided point estimates and ranges to form a set of distributions: 
    - If an expert gives a point estimate, represent it as a degenerate distribution at that point.
    - If an expert gives a range, interpret it as a uniform distribution over that interval (or, if the expert specifies a distribution, use that; but in the absence of more, uniform is conservative).
    - If the model has multiple parameters, and no expert specifies dependence, assume independence (but note this as a strong assumption that might understate uncertainty).
  - Compare the actions pairwise. If for every pair of actions A and B, the expected utility of A is greater than that of B for every distribution in the set, then choose A over B. If one action dominates all others, the decision is made: proceed to Step 4 for reporting. Otherwise, proceed to Step 2.

  Step 2: Choose a decision rule based on case features
  We consider three features:
  (a) Irreversibility: if a decision leads to irreversible consequences (e.g., extinction, permanent health damage), we lean toward caution.
  (b) Risk bearer: if the risks are borne by a vulnerable population, we lean toward caution.
  (c) Nature of disagreement: if the disagreement is about the world (e.g., cancer potency) versus the value of outcomes (e.g., how much a cancer counts relative to a job), we treat the latter as a value judgment that should be decided by the director, not the experts.

  Based on these, choose one rule:
  - If the case has high irreversibility and/or the risk is borne by the vulnerable, use the MaxiMin rule: choose the action with the least bad worst-case outcome (i.e., maximize the minimum expected utility).
  - If the case is about value disagreement (e.g., economists and health experts disagree on the trade-off between jobs and health), then the set of distributions must be expanded to include the different value weights. Then, if the cheap filter (Step 1) doesn't resolve it, present the actions as non-comparable and let the director decide (with an explanation of the trade-offs).
  - Otherwise (i.e., the disagreement is about the world, and irreversibility/vulnerability is not dominant), use the Maximality rule: an action A is admissible if there is no other action B that beats A under every distribution in the set. Then, choose any admissible action (if there is only one, it's chosen; if multiple, they are equally good under the rule; if none, then use MaxiMin).

  Step 3: Compute the chosen rule
  - For MaxiMin: For each action, find the minimum expected utility over the set of distributions. Choose the action with the maximum of these minima.
  - For Maximality: For each pair of actions (A, B), check if for every distribution in the set, the expected utility of B is greater than that of A. If so, then A is dominated by B and removed. The set of non-dominated actions is the admissible set. If the set has more than one action, they are incomparable: choose one arbitrarily (but note the tie) or present all to the director.
  - For value disagreement: after expanding the set to include the different weights, if the cheap filter doesn't resolve it, the result is non-comparable. Report the trade-offs to the director.

  Step 4: Produce the single number for the lawyers and economists
  - The lawyers require a single number. This number should be the expected value under the distribution that is the average of the expert point estimates (if they are provided) or the center of the range (if ranges are provided). If there are multiple parameters, use the average of the marginal distributions (i.e., average each parameter independently). 
  - However, this number is not the decision basis. It is a reporting requirement. Accompany it with:
    - A statement: "This number is the central estimate for reporting purposes only. The decision was based on a set of probabilities representing expert disagreement and the following rule [state rule from Step 2]. The set of estimates used was [list the point estimates and ranges]. The true uncertainty is better represented by the range [min of the set, max of the set] for the key outcome."
    - Also, note any unquantified uncertainties (from the refusing expert) and the assumptions (like independence) that might understate uncertainty.

  Step 5: Exit
  - Document the set of distributions, the decision rule chosen and why (based on the case features), the result of the cheap filter, and the single number with its caveats.

  (3) Case one: Tolerable Daily Intake (approx 400 words)

  Problem: Set TDI for a crop-protectant. Cancer potency estimates span two orders of magnitude (e.g., from 0.001 to 0.1 per mg/kg/day). Two of five experts refuse to give a number, saying the dose-response model class is wrong.

  Inputs: 
  - Three experts give point estimates: 0.001, 0.01, 0.1 (per unit). 
  - Two refuse. 
  - Actions: Set TDI at level X (which would ban the chemical) or leave at current level (which allows it).

  Preconditions: We have at least two estimates. We proceed without the two refusing experts, but note their objection.

  Step 1: Cheap filter. 
  - We form a set of distributions: three degenerate distributions at 0.001, 0.01, and 0.1.
  - Compute expected cancers for each action. 
    - Ban: 0 cancers.
    - Not ban: cancers = potency * exposure. Exposure is fixed, so the expected cancers are proportional to the potency: 0.001, 0.01, 0.1.
  - Compare: Ban has 0 cancers in every distribution. Not ban has positive cancers in every distribution. Therefore, ban dominates. The imprecision is irrelevant.

  Step 2: Skip because cheap filter resolved it.

  Step 4: Single number: average of the three potencies: (0.001+0.01+0.1)/3 = 0.037. We report: "The central estimate of cancer potency is 0.037 per unit. However, the decision to ban was based on the fact that even under the most optimistic expert estimate (0.001), there are positive expected cancers, and banning prevents them all. Two experts did not provide estimates due to model concerns, which adds unquantified uncertainty."

  But note: the refusal of two experts might mean the true risk is even higher or lower? However, because the cheap filter shows that even the lowest estimate leads to positive cancers, and we are comparing to zero (ban), the ban still dominates unless the refusing experts believe the risk is zero. Since they didn't say that, we note the uncertainty but the decision stands.

  (4) Case two: Fishery closure (approx 400 words)

