  (5) Where this procedure fails (approx 300 words)

  - It fails when the set of distributions is too wide and the decision rules (MaxiMin, Maximality) yield answers that are too conservative or incomplete. 
  - Information can be harmful: if a new piece of evidence rules out some distributions that were favourable to an action, the set of distributions might become more dispersed, making the decision harder (e.g., the posterior interval is wider). This procedure does not update the set (it's a one-shot), so that would require a new run and might yield a different result.
  - The choice of decision rule (Step 2) is value-laden: labeling a population as "vulnerable" or a consequence as "irreversible" is a judgment. Two analysts might differ, but the procedure forces explicit justification.
