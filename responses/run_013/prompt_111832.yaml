  (6) Bottom line (approx 150 words)

  When a decision arrives, collect point estimates or ranges from experts. If at least two are provided, form a set of distributions (point=degenerate, range=uniform). First, check if one action dominates (better under every distribution). If yes, choose it. Else, choose a decision rule: if the consequences are irreversible or affect the vulnerable, use MaxiMin (choose the action with the best worst-case outcome). If the disagreement is about values, present the trade-offs to the director. Otherwise, use Maximality (choose any action not beaten by another under every distribution). For reporting, compute a central estimate by averaging. Document the set, the rule, and the rationale. The procedure is explicit about judgments (e.g., irreversibility) and assumptions (independence). It fails when experts refuse to quantify or when structural uncertainty dominates.
answer: |-
  ### (1) Inputs and preconditions  
  **Required inputs:**  
  - **Decision frame**: Two or more actionable alternatives (e.g., "approve/deny," "close fishery/maintain status quo").  
  - **Consequence model**: A quantitative link from actions to outcomes (e.g., "dose → cancers," "catch → stock collapse"), including who bears risks (e.g., workers, public).  
  - **Expert inputs**: For each key parameter, at least two of:  
    - Point estimates (e.g., cancer potency = 0.01).  
    - Ranges (e.g., collapse probability ∈ [0.05, 0.2]).  
    - Explicitly labeled model-class refusals (e.g., "No number—all models miss key biology").  

  **Handling refusals:**  
  - **Do not force quantification**. Treat refusals as *structural uncertainty* (unquantified error from flawed models). Note this in the decision document: "X experts withheld estimates due to model inadequacy."  
  - **Exclude refusals** from the probability set but flag that the set may underrepresent true uncertainty.  

  **When to stop (fetch a statistician):**  
  - If experts disagree on *which parameters matter* (e.g., one includes epigenetic effects, another ignores them).  
  - If all but one expert refuse quantification.  
  - If dependencies between parameters are contested (e.g., "Toxicity and exposure are correlated")—this requires copula modeling beyond 2-hour scope.  

  **Preconditions met?** Proceed if ≥2 quantified inputs exist per parameter. Else, halt.  
  Word count: 248  

  ---

  ### (2) The procedure, step by step  
  **Step 1: Cheap filter (Does imprecision matter?)**  
  - *Question*: Is one action dominant (better than alternatives under every distribution in the set)?  
  - *Method*:  
    - Build a *credal set*: For each expert input, define a distribution. Use point estimates as degenerate distributions (Dirac delta). Use ranges as uniform distributions. Assume parameter independence unless given evidence of dependence (note this assumption; it may shrink uncertainty).  
    - Compute expected utility (EU) for each action-distribution pair (e.g., EU(approve) = jobs gained − cancers × value per cancer).  
    - Check: If action A > action B for all distributions in the set, A dominates.  
  - *Exit if*: Dominance exists. Choose A, skip to Step 4.  
  - *Sufficiency*: All EUs computed; dominance holds or not.  

  **Step 2: Select a decision rule (What breaks ties?)**  
  - *Question*: Which rule fits this case? Base choice on three features:  
    - **Irreversibility** (e.g., extinction, permanent health damage).  
    - **Risk bearer** (e.g., vulnerable populations, diffuse public).  
    - **Disagreement type** (world-focused: e.g., cancer potency; values-focused: e.g., "a job = $100k, a cancer = $5M").  
  - *Rules*:  
    - **Maximin** (pessimistic): Choose action with best worst-case EU. Use if:  
      - Irreversibility is high OR  
      - Risk imposed on vulnerable groups (e.g., workers without alternatives).  
      - *Why*: Avoids catastrophic losses; values prudence over optimism.  
    - **Maximality** (permissive): Reject action A only if another action B > A for all distributions. Choose any survivor. Use if:  
      - No irreversibility/vulnerability AND  
      - Disagreement is world-focused (e.g., potency estimates vary).  
      - *Why*: Avoids overconservatism; allows indeterminate outcomes.  
    - **Director adjudication**: Use if disagreement is values-focused (e.g., economists vs. ecologists on trade-offs). Exit and report: "Actions non-comparable; value conflict requires policy input."  
  - *Sufficiency*: Rule chosen with justification tied to case features.  

  **Step 3: Apply rule and compute**  
  - *For Maximin*:  
    - For each action, find min EU across the credal set.  
    - Choose action with max(min EU).  
  - *For Maximality*:  
    - For all action pairs, check if B > A for every distribution.  
    - Eliminate dominated actions.  
    - If ≥2 actions survive, they are "incomparable"—choose one arbitrarily (document tie).  
  - *Sufficiency*: Action selected or non-comparability declared.  

  **Step 4: Produce the single number (for lawyers/economists)**  
  - *Question*: What number satisfies reporting?  
  - *Method*:  
    - Compute the *marginal-average estimate*:  
      - For each parameter, average point estimates. For ranges, average interval midpoints (e.g., [0.05,0.2] → 0.125).  
      - Plug averages into the consequence model.  
    - *Label rigorously*: "This number is a central estimate for bureaucratic compliance. It is not the decision basis, ignores model uncertainty, and masks expert disagreement. The true decision used [state rule] over a credal set including [summarize inputs]."  
  - *Exit*: Document the number, its limitations, and the decision rationale (Step 1–3).  

  **Steps summary**:  
  1. Test for dominance → exit if found.  
  2. Pick rule (Maximin/Maximality/Adjudication).  
  3. Compute rule.  
  4. Report central estimate with caveats.  
  Word count: 698  

  ---

  ### (3) Case one: Crop-protectant TDI  
  **Decision**: Set TDI at level X (bans chemical) vs. status quo (allows use).  
  **Inputs**:  
  - Cancer potency estimates: 0.001 (Expert 1), 0.01 (Expert 2), 0.1 (Expert 3).  
  - Experts 4–5: Refuse (dose-response models miss endocrine effects).  
  **Consequences**: Ban prevents cancers but costs 300 jobs. Status quo causes cancers (potency × exposure) but saves jobs.  

  **Procedure**:  
  - **Step 1**: Build credal set (degenerate at 0.001, 0.01, 0.1). Assume exposure fixed.  
    - EU(Ban) = −300 jobs (no cancers).  
    - EU(Status quo) = jobs saved − cancers × $V (value per cancer).  
    - For all distributions, cancers > 0. If $V is high (e.g., $10M/cancer), EU(Ban) > EU(Status quo) across the set—ban dominates.  
    - *Cheap filter exit*: Ban selected.  
  - **Step 4**: Central potency = (0.001 + 0.01 + 0.1)/3 ≈ 0.037. Report: "Central potency = 0.037, but decision driven by ban dominating under all expert estimates. Unquantified uncertainty from 2 experts noted."  
  **Why you might dislike this**: Ignores refusers' concerns. But dominance makes their input irrelevant unless they claim potency = 0 (they didn’t).  
  Word count: 198  

  ---

  ### (4) Case two: Fishery closure  
  **Decision**: Close now (lose 200 jobs) vs. status quo (risk collapse).  
  **Inputs**: Collapse probability:  
  - Expert 1: 0.1 (point).  
  - Expert 2: [0.05, 0.2] (uniform).  
  - Expert 3: [0.15, 0.3] (uniform).  
  **Consequences**:  
  - Close: Lose 200 jobs now; stock recovers.  
  - Status quo: If no collapse, 0 job loss; if collapse, lose 200 jobs/year forever.  

  **Procedure**:  
  - **Step 1**: Build credal set. For ranges, use full distribution (not just mean).  
    - EU(Close) = −200 (assumes recovery).  
    - EU(Status quo) = −200 × (collapse probability) / discount rate (simplified).  
    - Under Expert 1 (p=0.1): EU(Status quo) = −20. Dominates close? No: −20 > −200.  
    - Under Expert 3 (p=0.3): EU(Status quo) = −60. Still > −200? Yes.  
    - *No dominance*: Status quo always better numerically.  
  - **Step 2**: Irreversible? Yes (collapse permanent). Vulnerable? Yes (fishing community). → **Maximin**.  
  - **Step 3**:  
    - Min EU(Close) = −200.  
    - Min EU(Status quo) = worst case over credal set: p=0.3 (Expert 3) → EU = −60.  
    - −60 > −200 → Status quo wins.  
  - **Step 4**: Central collapse prob = (0.1 + 0.125 + 0.225)/3 = 0.15. Report: "Central probability = 0.15. Decision: Status quo, per Maximin (irreversible risk). Worst-case loss (−60) better than closing (−200)."  
  **Why you might dislike this**: Feels reckless—ignores tail risk (p=0.3 collapse). But Maximin prioritizes avoiding certain job loss over probabilistic collapse.  
  Word count: 199  

  ---

  ### (5) Where this procedure fails  
  - **Information harms**: New data may *widen* the credal set (e.g., evidence rules out a precise estimate, leaving only wide intervals). Posterior uncertainty increases—decision may flip to Maximin or indeterminacy.  
  - **Value judgments masked as neutrality**:  
    - Calling a group "vulnerable" invokes equity concerns.  
    - Assuming independence underestimates uncertainty; declaring irreversibility is subjective.  
  - **Indeterminacy**: Maximality often leaves ties; arbitrary choices erode defensibility.  
  - **Unquantifiable uncertainty**: When all experts refuse or structural errors dominate (e.g., "no model captures climate feedbacks"), the procedure defaults to status quo or political discretion.  
  - **Rule instability**: Switching rules (e.g., Maximin to Maximality) for similar cases invites accusations of bias.  
  **What to tell the director**: "I cannot rule out model error. I cannot avoid value judgments in rule selection. I cannot guarantee a single answer when experts fundamentally disagree."  
  Word count: 299  

  ---

  ### (6) Bottom line  
  Collect expert inputs: points, ranges, or refusals. Build a credal set (points = Dirac, ranges = uniform). Assume independence if silent. First, test for dominance: if one action wins across all distributions, use it. Else, choose a rule: Maximin for irreversible/high-vulnerability cases; Maximality otherwise. For Maximin, maximize the worst outcome. For Maximality, eliminate dominated actions and pick arbitrarily from survivors. Report a central estimate (average of inputs) but document its limitations. The procedure exposes judgments (e.g., "vulnerable," "irreversible") and fails when experts refuse quantification or structural uncertainty dominates. In hostile rooms, emphasize: "This systematizes disagreement—it doesn't hide it."  
  Word count: 147
