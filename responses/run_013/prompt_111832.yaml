  - Close: we lose 200 jobs this year, but the fishery recovers and we have 200 jobs per year starting next year. So the total is: -200 + (200*annuity(9 years,5%))/1.05 = -200 + (200*7.1078)/1.05 ≈ -200 + 1421.56/1.05 ≈ -200 + 1353.87 = 1153.87.
