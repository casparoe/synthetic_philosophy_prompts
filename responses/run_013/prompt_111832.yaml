  - Expert3: collapse prob in [0.15, 0.3] (uniform)

  Consequences:
  - Close: lose 200 jobs now and forever.
  - Not close: if no collapse, jobs continue (say, 200 jobs this year and future years). If collapse, lose 200 jobs forever starting next year.

  We must compare the expected job losses. We'll use a 10-year horizon and discount rate 5% for simplicity (but in practice, this would be specified). The exact numbers matter.

  Step 1: Cheap filter.
  - We form a set of distributions: 
    - Degenerate at 0.1
    - Uniform on [0.05,0.2] -> expected value 0.125
    - Uniform on [0.15,0.3] -> expected value 0.225
  But note: we need the expected utility (jobs) for each action under each distribution.

  Set up:
  - Close: total jobs lost = 200 (immediately) + 0 in future (because no more fishery anyway? But if we close, we avoid collapse but lose the jobs. So, over 10 years: we lose 200 immediately and then 0 in future? Actually, we are losing the jobs by closing. So the loss is 200 now and then 0? This is ambiguous. Alternatively, we can model the net present value of jobs.

  Alternative: 
  - Close: lose 200 jobs now, and then 0 for the next 9 years (so total 200).
  - Not close: 
    - With prob p: collapse occurs, then we get 200 jobs this year but 0 for the next 9 years (so total 200, same as closing? But wait: if collapse happens at the end of the year, we get this year's jobs and then lose the rest. So: 200 (this year) + 0 (next 9) = 200.
    - With prob 1-p: no collapse, then we get 200 this year and 200 each year for 9 more (so total 200 + 200*[1 - (1.05)^{-9}]/(0.05) ≈ 200 + 200*7.1078 = 200 + 1421.56 = 1621.56).

