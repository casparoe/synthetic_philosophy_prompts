  Now, structuring the desiderata. I should start with the phenomena any theory must explain: intentional actions, conscious decisions causing physical effects. Then move to cases like the surgeon example, distinguishing causation from preemption. Key distinctions include mental vs. physical events/properties, causal relevance vs. efficacy. Constraints include causal closure, supervenience, multiple realizability, completeness of physics, and non-overdetermination.

