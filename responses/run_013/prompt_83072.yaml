  **REPUBLIC OF VELLARIA - STANDING COMMITTEE ON NOSOLOGICAL INTEGRITY**  
  **PRESS RELEASE: PUBLICATION OF THE ANNUAL SCHEDULE OF RECOGNISED DISEASES**  
  **REF: SCNI/PR/SCHED/07-2024**

  1.  The Standing Committee on Nosological Integrity (SCNI) is pleased to announce the publication of the Year 7 Schedule of Recognised Diseases, pursuant to Section 2 of the Species-Typical Function Act (STFA). This Schedule constitutes the definitive statutory list of conditions classified as diseases within the Republic for the forthcoming fiscal year, based solely on the objective, biological criteria enshrined in Section 1 of the Act: a statistically abnormal reduction in the functional efficiency of a biological mechanism, assessed against the relevant species, sex, and age reference class (*Homo sapiens*, unless otherwise specified).

  2.  **Key Updates & Rationales:**
      *   **2.1 Inclusion of Occupational Bronchial Hypertrophy (OBH):** OBH, characterized by thickened bronchial walls and reduced baseline respiratory capacity, is newly listed (Schedule Code RD-742). Analysis of the *general adult human population* confirms statistically significant abnormality (prevalence 0.8%). Functional efficiency of the bronchial dilation/constriction mechanism is demonstrably reduced compared to the species-typical baseline. *Note:* Assessment against the narrower reference class of *long-term particulate-exposed industrial workers* (prevalence 92%) yielded non-abnormality; however, the Act mandates the species-level class as primary.
      *   **2.2 Delisting of Seasonal Affective Responsiveness (SAR):** SAR (formerly RD-318), involving reduced mood and energy correlating with reduced photoperiod, is removed. Recent longitudinal demographic studies indicate SAR prevalence in the Vellarian adult population now exceeds 63%. While associated functional reductions in circadian regulation and motivational neurochemistry persist, this prevalence exceeds the threshold for statistical abnormality. SAR is reclassified as a non-pathological species-typical seasonal variation.
      *   **2.3 Reconfirmation of Hyperosmic Adaptation Syndrome (HAS) as Non-Disease:** HAS, involving significantly heightened olfactory acuity (prevalence 0.05%), remains excluded. While statistically abnormal, the Committee found no evidence of *reduced functional efficiency* in the olfactory mechanism. Enhancement of a typical function, even to a statistically rare degree, does not constitute a reduction and therefore falls outside the Act's definition. Objections citing social discomfort or sensory overload in modern environments were noted as irrelevant to the biological efficiency criterion.^(1)
      *   **2.4 Status of Universal Age-Related Telomere Attrition (UARTA):** UARTA, the progressive shortening of chromosomal telomeres universal in humans beyond approximately age 50, remains unlisted. Its 100% prevalence within the applicable *age-specific reference class* definitively negates statistical abnormality. The Act provides no mechanism for recognizing universal biological processes as diseases, irrespective of their contribution to senescence or mortality.^(2)
      *   **2.5 Clarification on Congenital Anhedonia Spectrum Disorder (CASD):** CASD (RD-511) is reaffirmed. Characterized by a congenital, statistically abnormal (prevalence <0.1%) inability to experience pleasure from typically rewarding stimuli, it demonstrates a measurable reduction in the functional efficiency of mesolimbic dopaminergic reward pathways compared to the species-typical state. The Committee emphasizes that the recognition stems solely from this objectively verifiable dysfunction, not the associated subjectively reported distress or social impairment.^(3)

  3.  **Procedural Rigour:** The SCNI meticulously applied the STFA criteria using the latest national biometric registry data and peer-reviewed meta-analyses of species-typical function. All determinations regarding statistical abnormality and functional efficiency were made via blinded algorithmic analysis of physiological parameters, overseen by the Committee's Bureau of Biostatistical Verification. Subjective assessments of "harm," "suffering," or "social undesirability" were explicitly excluded from the decision-making process, ensuring strict adherence to the Act's scientific framework.

  4.  **Chair's Statement:** Dr. Lysandra Vorik, SCNI Chair, stated: "Year 7's Schedule exemplifies the Republic's commitment to grounding healthcare policy in biological reality, not subjective values. By relying solely on measurable dysfunction against species-typical baselines, the SCNI ensures nosological integrity is maintained, providing clarity for clinicians, researchers, and policymakers. This objective foundation shields vital health classifications from the vagaries of cultural bias or political expediency."

  5.  The full Year 7 Schedule of Recognised Diseases (SCNI Schedule Document Y7-SRD) is available for download at [www.vellaria.gov.vl/scni/schedules].

  **###**

  **FOOTNOTES:**
  ^(1) *Committee Member Note (Dr. R. Elgin):* While concurring with the HAS decision under the Act, I observe that classifying extreme sensory sensitivity as pathological only if deemed *inefficient* functionally, rather than *disabling* contextually, reveals an inherent limitation of the purely statistical-biological model when confronting traits existing in environmental mismatch. Efficiency is context-dependent.
  ^(2) *Committee Member Note (Dr. A. Thorne):* UARTA's exclusion highlights a critical implication of the Act: universality within a reference class confers biological normativity, irrespective of deleterious outcome. This logically precludes classifying aging itself, or any universal age-related process, as disease, regardless of its consequences. The definition cannot capture universal harms.^(3)
  ^(3) *Committee Member Note (Dr. A. Thorne):* The assertion that CASD's recognition is "solely" due to measurable dysfunction overlooks the prior, necessary determination that the *absence of hedonic response constitutes a biological malfunction*. This determination rests on the unstated normative premise that the capacity for pleasure is a core, expected species-typical function – a value judgment about what constitutes proper biological operation. The objectivity is procedural, not foundational. [*Included per Minority Viewpoint Publication Protocol MVPP-4*]
