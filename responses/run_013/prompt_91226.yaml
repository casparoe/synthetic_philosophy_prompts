prompt: |-
  A seminar discussion of Putnam's later writing on religion has left me with an argument I cannot shake and cannot accept, and I should like to know which step to abandon. As I read him, Putnam holds two things at once. First, the dichotomy between fact and value collapses: no description is wholly value-free, and evaluative judgments are answerable to reasons, capable of being warranted, criticised and revised. Second, the religious attitude is neither a body of empirical hypotheses — nothing that science could confirm or refute — nor a mere expression of feeling. The argument below seems to follow from those two commitments, and it arrives somewhere Putnam would surely refuse to go.

  (1) If the fact/value dichotomy collapses, then no description of the world is free of evaluation, and so there is no standpoint from which a practice's evaluations can be assessed that is not itself internal to some practice.
  (2) If the warrant for a claim is internal to the practice that sustains it, then a claim is warranted just insofar as it is licensed within its form of life.
  (3) Religious claims are licensed within the religious form of life; claims about the reading of entrails are licensed within the diviner's.
  (4) Hence religious claims are no better warranted than divinatory ones, and there is no rational difference between them.
  (5) Therefore either religious claims are empirical hypotheses after all — badly supported ones — or there is no rational difference between a faith and a superstition.

  I should like to keep (1) and the second of Putnam's commitments; it is (4) and (5) that I cannot accept. But I cannot see where the chain breaks, or what it would cost to break it.

  Please respond in the following sections, in this order. 'Verdict' (about 120 words): name the step or premise you would abandon, and say whether the argument is invalid or merely too costly to accept. 'Why it looked plausible' (about 250 words): explain what makes the offending step attractive and why it is easy to slide past it. 'What it costs' (about 350 words): set out what must be paid to reject it, whether Putnam's two commitments can survive the payment, and whether the alternatives are worse. 'Residual worries' (about 150 words): what the diagnosis leaves unsettled. Write in British English.
reasoning: |-
  Hmm, the user presents a sophisticated philosophical argument derived from Putnam's views on fact/value entanglement and religious language. They've constructed a logical chain that leads to relativism about religious claims - a conclusion they find unacceptable but can't refute. The argument hinges on equating warrant with internal licensing within a practice, which collapses distinctions between religion and superstition.

  The user seems philosophically trained, wrestling with Putnam's non-reductive realism about values while avoiding relativism. Their discomfort suggests they want to preserve religion's cognitive dignity without conceding to scientism. The core tension lies in balancing internal standards of warrant with cross-practice rational assessment.

  I notice the argument's pivot is premise (2)'s equation of warrant with intra-practice licensing. This ignores Putnam's emphasis on "reasonableness" as a trans-practice virtue. For Putnam, practices aren't hermetically sealed - they can be criticised through immanent critique or by exposing performative contradictions. 

  Rejecting (2) costs us tidy demarcation criteria but saves normative traction. We'd need thicker concepts of rationality than mere rule-following, perhaps drawing on Putnam's "pragmatic realism." The residual worry involves specifying how such criticism works without appealing to neutral facts. Putnam might suggest looking at how practices handle their own crises or engage with human flourishing.

  The user's anxiety about relativism is justified but premature. Putnam's later work on perception and conceptual pluralism offers resources to distinguish adaptive from maladaptive frameworks without positivist crutches. The divination example fails because it doesn't meet its own success conditions over time - unlike religious practices that generate durable meaning.
answer: |-
  **Verdict**  
  The argument is valid but unsound. Abandon **premise (2)**. It incorrectly equates "warrant internal to a practice" with "warrant *solely* licensed within its form of life," ignoring Putnam’s insistence that practices can be rationally criticised *across* frameworks using shared standards of reasonableness, coherence, and human flourishing. Premise (2) smuggles in a relativism Putnam explicitly rejects. The argument’s validity depends on this flawed premise, making it unsound rather than invalid.

  **Why it looked plausible**  
  Premise (2) gains plausibility from conflating "internal warrant" with "self-contained justification." Putnam’s collapse of fact/value *does* imply that all justification occurs within practices laden with values. This invites the slide into thinking practices are epistemically isolated: if no neutral "view from nowhere" exists, it *seems* practices can only be judged on their own terms. The analogy between religion and divination in (3) exploits this, suggesting both are equally "valid" within their bubbles. Putnam’s emphasis on "internal realism" — that truth and justification are practice-relative — superficially supports (2). Yet this ignores his equal stress on fallibilism and the permeability of practices. We slide past the error because the dichotomy’s collapse *threatens* relativism; (2) offers a clear (but reductive) way to formalise that threat.

  **What it costs**  
  Rejecting (2) requires defending **cross-practice rational assessment** without reverting to a value-free "Archimedean point." Putnam’s commitments survive if we adopt his pragmatic, pluralistic account of rationality: practices can be criticised for **incoherence** (e.g., self-undermining claims), **failure to meet their own goals**, or **impeding human flourishing** in ways discernible through empathetic engagement. For instance, divination might falter by its *own* standards (repeated inaccuracy) or by broader ones (e.g., stifling agency). Religion, conversely, might demonstrate "rational superiority" not via empirical test but through its capacity to sustain meaning, resolve existential dilemmas, or adapt reflectively to criticism — criteria *internal* to its aims yet *shareable* across practices. The cost is accepting that such judgements are **interpretive, contestable, and non-algorithmic**. We forfeit the craving for decisive, practice-neutral verdicts. Alternatives are worse: keeping (2) forces relativism (costing objectivity about reason itself), while reinstating a rigid fact/value dichotomy (denying the evaluative depth of human concepts) contradicts Putnam’s core insight. His two commitments hold if rationality is "historically situated but not prison-bound."

  **Residual worries**  
  The diagnosis leaves unsettled **how to arbitrate clashes** between deeply divergent practices (e.g., secular humanism vs. fundamentalism) when shared standards are thin. If all criticism is immanent or pragmatic, can we condemn a coherent, self-consistent but oppressive practice? Putnam might appeal to "our evolving ideals of reason," but this risks parochialism. Additionally, **demarcating "practices"** remains murky: is "science" one practice or many? Is "flourishing" truly cross-cultural? While rejecting relativism, the pragmatic alternative still struggles with **incommensurability** and the fear that, without transcendent facts, "warrant" is just socially endorsed assertibility. Putnam’s appeal to "reasonable rejection" feels provisional when worldviews collide irreconcilably.
