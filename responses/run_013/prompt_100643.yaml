  Okay, let me tackle this user's request. They're deep into the Frege-Geach problem for expressivism and want a single, hard example rather than survey. The key is to avoid the usual lying conditional. 

  First, I need to pick an embedding context that's particularly tricky. Questions seem promising because they don't assert content but query it. The user mentioned "because"-clauses too - those are explanatory and might be even harder. Let me compare: 

  Questions involve presupposition and answerhood conditions, but "because" directly requires truth-apt content for explanation. The latter feels more pressing. A sentence like "He avoided it because it's wrong" forces the moral part to be explanatory. 

  For the inference, modus ponens would work: from this explanation and the wrongness claim, we should infer avoidance. But if "wrong" expresses attitude when unembedded but provides truth conditions when embedded, that's classic equivocation. 

  The expressivist's core problem: the attitude (e.g. disapproval) vs the propositional content needed for embedding. They can't collapse these without collapsing expressivism into realism. 

  Now for a solution sketch: Gibbard's norm-acceptance might work. But does it solve or relocate? If "wrong" in the because-clause still needs to refer to a fact to explain, we're back to square one. The attitude might cause the action but not rationally justify it - that's the gap. 

  User seems technically adept - I'll use precise terms like "truth-apt" and "anaphoric binding". The example must feel constructed, not textbook. Let me make the inference crystal clear: P1, P2, therefore C. Mark the equivocation spot at "wrong" in P2 vs P1. 

  Final check: does this avoid all stock examples? Yes, "because" with action explanation isn't the overused conditional. And the solution sketch admits its own weakness - that's important for honesty.
answer: |-
  Here is a constructed example targeting the **explanatory "because"-clause** embedding, paired with anaphoric reference across clauses. This case intensifies the pressure by requiring the moral predicate to function as a *truth-apt reason* for a descriptive event while maintaining expressive consistency.

  ---

  **1. The Exchange:**  
  *Alex (reporting on Blair's action):*  
  **"Blair returned the wallet because stealing is wrong. That is why she did it."**

  **2. Valid Inference (Modus Ponens Structure):**  
  - **P1:** Blair returned the wallet *because* stealing is wrong. (Explanatory claim)  
  - **P2:** Stealing *is* wrong. (Unembedded moral assertion)  
  - **∴ C:** Blair returned the wallet. (Descriptive conclusion)  

  **3. The Equivocation Point:**  
  If expressivism cannot fix the meaning of "wrong":  
  - In **P2**, "stealing is wrong" **expresses disapproval** (non-cognitive attitude).  
  - In **P1**, "because stealing is wrong" requires "stealing is wrong" to denote a **truth-apt proposition** (a *fact* that *explains* Blair's action).  
  The inference **equivocates** between attitude-expression (P2) and truth-conditional content (P1). P1 treats "wrong" as providing a reason *for the action*, while P2 treats it as projecting an emotion *of the speaker*.

  **4. The Two Irreconcilable Elements:**  
  The expressivist must hold apart:  
  - **A:** The *attitude expressed* (e.g., disapproval of stealing).  
  - **B:** The *propositional content* (e.g., *that stealing has the property of wrongness*) required for embedding in explanatory contexts, anaphora ("that is why"), and inference.  
  **B** cannot be reduced to **A** without making "because"-clauses nonsensical (one cannot act *because* of an attitude unless that attitude references a state of affairs). The anaphor "that" in "that is why" further binds the moral term to a referent (*the reason*) that must be objective.

  **5. Minimal Expressivist Addition & Its Success:**  
  *Sketch:* Adopt a **two-layer semantics** (à la Gibbard/Hybrid Expressivism):  
  - **Layer 1 (Attitude):** "Stealing is wrong" *expresses* disapproval.  
  - **Layer 2 (Content):** It *refers* to the normative fact *that stealing is forbidden by the relevant norms* (e.g., the norms the speaker endorses).  
  In P1, "because" embeds the *content* (Layer 2), allowing it to explain Blair's action. In P2, the unembedded claim expresses the attitude (Layer 1). The inference works because "wrong" in both P1 and P2 links to the same normative fact (Layer 2).  

  *Does it succeed or relocate the problem?*  
  **Relocates.** It now requires:  
  - An account of how Layer 2 *facts* (e.g., "being forbidden by endorsed norms") are both (i) *objectively truth-apt* (to explain Blair's action) and (ii) *distinct from realist moral facts* (to preserve anti-realism).  
  - An explanation of why Blair would be motivated by *Layer 2 facts* rather than Layer 1 attitudes. The problem resurfaces as a **collapse into realism**: if Layer 2 facts are mind-independent, expressivism is abandoned; if mind-dependent, "because" becomes "because I disapprove," making Blair's action inexplicable (*she* need not share the attitude).  

  ---

  **Why this example bites:**  
  - **"Because" forces truth-aptness:** Explanations require truth-bearing relata ("X because Y" demands Y be a reason, not a feeling).  
  - **Anaphora ("that") binds across clauses:** "That is why" refers back to the *content* of the moral claim in P1, demanding referential stability.  
  - **Inference crosses descriptive/normative:** The conclusion (C) is purely descriptive, deriving from a moral premise (P2) *via* an explanatory bridge (P1). If "wrong" shifts meaning, the inference snaps.  

  This exposes the core tension: **Expressivism must either fragment meaning (destroying logic) or smuggle in propositions (destroying expressivism)**. No minimalist fix resolves it; the smallest additions breed new problems of objectivity and motivation. The example shows that even *anti-realist explanations of action* require moral language to wear a realist mask under embedding.
