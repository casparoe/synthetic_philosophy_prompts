answer: |-
  Here’s a complete exam question package designed to force deeper engagement with van Fraassen’s Reflection principle, centered on your Ada case. The question targets the conditionalization-dependence of Reflection and the expectation/conditional distinction.

  ---

  ### **Exam Question (45 minutes, 25 marks)**
  **Ada’s Weather Forecast:**  
  Ada is certain that tomorrow morning, a forecasting service will text her a number, \( r \), which will be either 0.8 or 0.2. She believes it’s equally likely (50%) which number she’ll receive. Upon receiving \( r \), she will adopt \( r \) as her credence that it will rain that afternoon. Ada also knows the service’s historical accuracy: when it texts 0.8, rain occurs 30% of the time; when it texts 0.2, rain occurs 70% of the time. Right now, Ada’s credence in rain is 0.5.

  (a) **State** van Fraassen’s Reflection principle in its standard conditional form.  
  (b) According to Reflection, what *should* Ada’s *current* credence in rain be? Justify your answer.  
  (c) Ada’s current credence (0.5) differs from your answer in (b). **Explain** why this difference is *rationally permissible* for Ada, despite Reflection’s demand.  
  (d) **Compare** the conditional Reflection principle with the *expectation version* (that one’s current credence should equal the expected future credence). What does each principle require of Ada, and which (if either) does she satisfy?  
  (e) **Argue** for one of the following:  
   (i) Reflection is a trivial consequence of rational updating (when properly specified), or  
   (ii) Reflection is a substantive but false norm for rationality.  
  Use Ada’s case to support your claim.

  ---

  ### **Model Answer (650 words)**

  **(a)** Van Fraassen’s Reflection principle states that an agent’s current credence in proposition \( A \), conditional on their future credence in \( A \) being \( x \), should itself be \( x \). Formally: \( C(A \,|\, C_f(A) = x) = x \).

  **(b)** Reflection demands Ada’s current credence in rain be equal to her expectation of her future credence. Since she will adopt \( r \) (either 0.8 or 0.2, each with probability 0.5), her expected future credence is \( (0.5 \times 0.8) + (0.5 \times 0.2) = 0.5 \). Thus, Reflection requires her current credence to be **0.5**.

  **(c)** Ada is rational to retain her 0.5 credence despite Reflection’s demand for two reasons:  
  1. **Misalignment with Evidence**: Ada knows the forecast is *miscalibrated*. If she learns \( r = 0.8 \), her rational credence *should* be 0.3 (since rain occurs 30% of the time after 0.8 forecasts), not 0.8. Similarly, upon seeing \( r = 0.2 \), she should adopt 0.7, not 0.2. Reflection forces her to ignore this known inaccuracy.  
  2. **Non-Conditionalization**: Reflection assumes future credences are rational updates. Here, Ada’s future self *uncritically adopts* \( r \), disregarding the base-rate evidence she possesses *now*. Her future credence is not a conditionalization of her current credence function but an irrational override. When future credences violate rational updating, Reflection loses normative force.

  **(d)**  
  - **Conditional Reflection**: Requires \( C(\text{rain} \,|\, C_f(\text{rain}) = r) = r \). Ada violates this: if \( r = 0.8 \), she *should* have \( C(\text{rain} \,|\, r=0.8) = 0.3 \), not 0.8.  
  - **Expectation Version**: Requires \( C_{\text{now}}(A) = \mathbb{E}[C_f(A)] \). Ada satisfies this: her expected future credence is 0.5, matching her current 0.5.  
  **Key Difference**: The expectation version only requires future credences to be *unbiased on average* (a consistency check). The conditional version demands they are *sufficient statistics*: once known, no other evidence matters. Ada’s future credences are unbiased but insufficient—knowing \( r \) doesn’t screen off her knowledge of the forecast’s inaccuracy.

  **(e) Reflection is a substantive but false norm** (Option ii).  
  - **Triviality Thesis**: One might claim Reflection is trivial if future credences result from conditionalizing current credences on future evidence. In that case, \( C_f(A) = C_{\text{now}}(A \,|\, E) \), and \( C_{\text{now}}(A \,|\, C_f(A)=x) \) reduces to \( x \) by probability laws.  
  - **Why It’s False and Substantive**: Ada’s case shows that when future credences are *not* conditionalizations (here, they’re externally imposed and irrational), Reflection makes a *substantive demand*: defer to your future self even when you know they’re wrong. This is indefensible. Rationality requires calibrating credences to *all* available evidence (e.g., the forecast’s track record), not blind deference to an irrational future state.  
  - **Broader Implication**: Reflection functions as a theorem *only* under ideal updating. In real cases of anticipated irrationality (drugging), memory loss, or deference to flawed experts—where conditionalization fails—it becomes a distinct, false norm. Van Fraassen’s "conditionalization in a wig" metaphor collapses when the wig doesn’t fit the head.

  ---

  ### **Marking Scheme (25 marks total)**
  | **Point**                                                                                                | **Marks** | **Common Pitfall**                                                                 |
  | :------------------------------------------------------------------------------------------------------- | :-------- | :--------------------------------------------------------------------------------- |
  | **(a) Correct statement of Reflection** (conditional form)                                               | **3**     | Omitting conditionality (e.g., "\( C_f(A) = x \) implies \( C_{\text{now}}(A) = x \)") |
  | **(b) Correct calculation of expected future credence (0.5) as Reflection’s demand**                     | **4**     | Confusing Reflection with actual credence; not computing expectation              |
  | **(c) Explanation of why Ada’s 0.5 is rational: future credence ignores known calibration evidence**     | **7**     | Only noting future irrationality without linking to evidence; misstating calibration |
  | **(d) Contrast: Expectation version (satisfied) vs. Conditional (violated); sufficiency vs. unbiasedness** | **6**     | Conflating the two versions; missing that conditional Reflection requires \( r \) to screen off evidence |
  | **(e) Clear stance: Trivial iff conditionalizing, false otherwise; uses Ada to show failure**            | **5**     | Binary true/false claim; not analyzing conditionalization’s role; ignoring Ada case |

  ---

  ### **Why This Works**
  - **Forces Picking a Side**: Students must reconcile Reflection’s triviality under conditionalization (part e) with its failure in Ada’s non-conditionalization case (part c). No fence-sitting.
  - **Exposes Core Tension**: Parts (c) and (e) require explaining *why* conditionalization matters—linking to evidence sensitivity.
  - **Expectation vs. Conditional**: Part (d) explicitly tests understanding of the weaker/stronger demands.
  - **Ada’s Case is Rigged**: Her future credences are *unbiased* (satisfying expectation) but *miscalibrated* (violating conditional Reflection), forcing nuance.
  - **Kills the "Three Beats"**: The drug case is irrelevant; Ada’s scenario requires engaging with calibration, deference, and conditionalization.
