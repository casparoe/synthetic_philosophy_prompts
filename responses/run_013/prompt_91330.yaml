answer: |-
  Here's a breakdown of the possible readings of "si vis pacem, para bellum" ("if you want peace, prepare for war"), categorised and assessed for their defensibility, specifically addressing your concerns about your friend's usage and the pacifist position. The analysis connects to just-war criteria where relevant and tests your suspicion about "real peace".

  ### The Menu of Interpretations

  1.  **The Causal Prediction (Contingent Fact Claim):**
      *   **Claim:** Maintaining significant military readiness *causes* (or significantly increases the probability of) peace by deterring potential aggressors. Peace is the absence of war achieved *because* potential adversaries fear defeat.
      *   **Defensibility:** **Contentious Thesis.** This is the most common empirical claim. It draws on deterrence theory (e.g., Mutually Assured Destruction during the Cold War). Evidence exists where strong deterrence *may* have prevented war. However:
          *   It ignores the **Security Dilemma**: Arming can make neighbours feel threatened, provoking *their* armament, increasing tensions and the risk of war (e.g., pre-WWI arms races).
          *   "Preparation" can lower the threshold for *initiating* conflict (feeling strong enough to win).
          *   Deterrence failures are common historically.
          *   **Link to Just-War:** This claim underpins the *jus ad bellum* criterion of **reasonable chance of success**. If preparation *causes* peace via deterrence, it suggests disarmament removes that deterrence, making aggression more likely and successful defence less likely. However, it doesn't demonstrate that war, *when it occurs*, meets *last resort* or *proportionality*.
      *   **Pacifist Compatibility?** **Directly Opposed.** Pacifism typically argues that military preparation fuels tensions and makes violence more likely, not less, advocating alternative conflict resolution (diplomacy, economic interdependence, institutions).

  2.  **The Constitutive Definition ("Real Peace" Claim):**
      *   **Claim:** "Peace" isn't merely the absence of war, but a specific *kind* of order – one actively maintained and secured against potential disruption. This "real" or "stable" peace is *defined* or *constituted* by the underlying capacity for credible defence. An absence of war without this capacity is merely a "lull," "truce," or "false peace," inherently unstable and vulnerable.
      *   **Defensibility:** **Contentious Thesis (leaning towards Howler when used dogmatically).** This is likely the core of your friend's "real peace" move.
          *   **Plausible Aspect:** It highlights that peace without security is fragile (e.g., a disarmed state facing a hostile neighbour).
          *   **Problematic Aspect:** It risks being a **tautology** or **definitional sleight-of-hand**. By *defining* "true peace" as requiring military readiness, it makes the proverb true by fiat, shielding it from empirical counter-arguments ("You call *that* peace? It's just a lull!"). It dismisses pacifist conceptions of peace built on justice, cooperation, and non-violent security as inherently invalid or naive.
          *   It ignores historical periods of relative stability without dominant military deterrence (e.g., some phases of diplomacy, demilitarised zones, periods of strong international law/norm adherence).
      *   **Pacifist Compatibility?** **Fundamentally Incompatible.** This definition explicitly rules out the pacifist vision of peace achieved without the threat or use of force as not being "real" peace at all. It rejects the core pacifist premise.

  3.  **Prudential Advice (Risk Management):**
      *   **Claim:** In an anarchic international system where others *might* use force, failing to prepare militarily is an unacceptable risk. Prudence demands maintaining credible defences as an insurance policy against aggression, regardless of whether it *causes* peace or defines it. It's about being ready for the worst-case scenario.
      *   **Defensibility:** **Platitude (if weak) / Contentious Thesis (if strong).**
          *   **Weak/Platitudinous:** "Be prepared for potential dangers" is general advice. Taken minimally (e.g., "don't be utterly defenceless"), it's hard to dispute.
          *   **Strong/Contentious:** When elevated to the *primary* or *sufficient* strategy for achieving peace ("*the* way to get peace is preparation"), it becomes contentious. It ignores opportunity costs (resources diverted from social goods), risks of arms races, and the potential of non-military strategies to *reduce* the likelihood of needing military force. It often assumes worst-case intentions in others.
          *   **Link to Just-War:** Connects to *last resort* by implying that without credible defence, peaceful options might be ignored by aggressors, making war unavoidable sooner. However, excessive preparation can make war seem *less* of a last resort by making it appear more winnable. Raises huge questions about **proportionality** in preparation – how much is "enough"?
      *   **Pacifist Compatibility?** **Minimal Compatibility (Weak Version) / Opposed (Strong Version).** Pacifists might agree *prudence* is needed but argue true prudence lies in building non-violent security systems and reducing tensions. The strong version, prioritising military preparation as the core prudent strategy, is opposed.

  4.  **Moral Verdict (Virtue/Sin):**
      *   **Claim:** Preparing for war is a positive moral duty of a responsible state/government towards its citizens. Conversely, unilateral disarmament is morally culpable negligence, abandoning the duty of protection.
      *   **Defensibility:** **Contentious Thesis.** This grounds the proverb in ethics. It relies on assumptions about the state's primary duty being security-through-force and the moral permissibility of preparing for potentially lethal violence. It clashes directly with pacifist ethics based on non-violence and the immorality of preparing to kill.
      *   **Link to Just-War:** Assumes preparation is a legitimate act in anticipation of potentially fighting a *just* war. However, preparation itself isn't subject to *jus ad bellum* criteria – it happens *before* any specific *casus belli* exists. This raises profound questions about the morality of large-scale preparation for violence whose future justification is unknown.
      *   **Pacifist Compatibility?** **Directly Opposed.** This is a direct rejection of pacifist morality.

  ### Which Reading is Your Friend Using to Shut Down the Pacifist?

  Your friend is almost certainly **primarily invoking the Constitutive Definition ("real peace")**, likely blended with the **Causal Prediction** and presented as **Prudential Advice/Moral Duty**. This is the "slippery" combination you describe:

  1.  **The Core Move:** When challenged on the causal claim ("preparing makes war *more* likely!"), he shifts to the constitutive definition: "Ah, but that 'peace' you get from weakness isn't *real* peace, it's just a temporary lull vulnerable to being shattered. *Real* peace requires strength." This sidesteps the empirical argument about likelihood and moves into definitional territory where his position is axiomatic.
  2.  **Supporting Roles:** The causal claim ("strength deters") provides the *mechanism* by which his defined "real peace" is achieved. The prudential/moral framing ("it's irresponsible not to") adds normative weight. The blend makes it seem like an undeniable truth.

  **Why this shuts down debate (illegitimately):**
  *   **Definitional Dodge:** By defining "peace" in a way that *requires* military preparation, he makes opposition seem like a desire for instability or naivety about "true" peace. It becomes circular: "Real peace requires preparation; therefore, to want real peace, you must prepare."
  *   **Immunisation from Evidence:** Empirical arguments about arms races or deterrence failures can be dismissed because they only apply to "false" peace or lulls, not the "real" peace he defines.
  *   **Moral High Ground:** Blending in the prudential/moral framing paints the pacifist as naive, irresponsible, or even immoral for not prioritising "real" security (as he defines it).

  ### Is Any Reading Compatible with Pacifism?

  *   **Direct Compatibility is Extremely Limited:** The core pacifist rejection of violence as a legitimate tool fundamentally opposes the causal, constitutive, and moral readings. Pacifism defines peace *differently* and sees military preparation as antithetical to achieving it.
  *   **Potential Indirect/Minimal Engagement (Prudential - Weak Version Only):** A pragmatic pacifist *might* acknowledge the *weak* prudential point ("utter defencelessness is risky in a violent world") but would argue:
      *   The solution isn't military preparation, but building robust, non-violent systems of defence (civil resistance, international solidarity, strong institutions) and conflict prevention/transformation.
      *   The *risks* of military preparation (arms races, lowered thresholds for war, resource diversion, moral corruption) far outweigh the perceived security benefit.
      *   True prudence lies in radically reducing the underlying causes of conflict and building alternatives to violence.

  ### Where My Reasoning Could Fail & What Would Change It

  1.  **Underestimating Deterrence (Causal Claim):** My assessment leans towards the causal claim being highly contentious and often failing. **What would change my mind?** Overwhelming, rigorous historical/political science evidence demonstrating that *consistent, unilateral* military build-ups by states (not in specific alliance contexts like NATO) *reliably* deter aggression without triggering security dilemmas or arms races, *and* that disarmament *reliably* leads to aggression against the disarming state. This evidence is lacking.
  2.  **Overstating the "Howler" Aspect of Constitutive Definition:** While I think it's often used dogmatically, the claim that peace requires *some* form of security isn't absurd. **What would change my mind?** If compelling arguments or evidence showed that societies achieving long-term stability *without any capacity for organised violence* (even non-military defence) were the norm, not the rare exception, it would undermine the constitutive claim significantly. However, evidence points the other way – security (even if defined broadly) is generally seen as foundational.
  3.  **Pacifist Engagement with Prudence:** My "minimal compatibility" might be too generous for some absolute pacifists. **What would change my mind?** A compelling pacifist argument demonstrating that even minimal acknowledgement of the risks of defencelessness inevitably leads down a slippery slope to militarism would strengthen the case for complete incompatibility.
  4.  **Link to Just-War Criteria:** My claim is that preparation makes meeting *last resort* harder. **What would change my mind?** Evidence that highly prepared states consistently exhaust *all* peaceful avenues before resorting to force, *more so* than less prepared states, would challenge this. Conversely, evidence that prepared states initiate "wars of choice" more readily would strengthen it. Regarding *proportionality* in *preparation*, clearer ethical/political frameworks defining "proportionate" peacetime military spending/readiness relative to credible threats (beyond just "deterrence") could refine this analysis.

  ### Conclusion

  Your friend's rhetorical use of the proverb relies heavily on **conflating a contentious causal claim with a definitional claim about "real peace"**, effectively shutting down empirical debate by making his position axiomatic. While the weak prudential reading has a grain of banal truth ("don't be utterly vulnerable"), the core interpretations (causal, constitutive, moral) are substantively contested theses largely incompatible with pacifism. His "real peace" move is indeed definitional sleight-of-hand, immunising his position from your valid concerns that preparation might *increase* the risk of war. Engaging effectively requires **demanding clarity** on which specific claim he's making and **challenging the definitional conflation** directly. Ask him to define "peace" *without* presupposing military force, and ask for evidence that unilateral preparation reliably *causes* the peace he desires without counterproductive consequences. Connect the scale of preparation to the just-war concerns of proportionality and whether such preparation genuinely serves last resort or makes war more thinkable.
