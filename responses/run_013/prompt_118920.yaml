  First, I need to restate the archaeological inference problem in geophysical terms. The user's analogies: equifinality to non-uniqueness, ethnographic analogy as prior, formation processes as forward operator, coarse results as resolution limits. These seem reasonable. The forward operator would represent how human actions and taphonomic processes transform beliefs into artifacts. But a key difference is the forward operator's complexity—human behavior is messier than physics.

  Next, the residue report—what doesn't map over. The user noted three points: 

  1. The rule of thumb about what's knowable. In geophysics, null space is predictable from equations. In archaeology, it's based on implicit theories about human cognition and behavior. For example, functional activities like tool-making leave clearer evidence than rituals. But without explicit equations, this relies on domain-specific heuristics.

  2. Interpretive leaps, like the dog pit example. The argument hinges on attributing beliefs, which isn't directly tied to physical evidence. It's about constructing a coherent narrative that fits the data, influenced by hermeneutic circles and theory-ladenness. This isn't just ill-posedness; it's about meaning-making.

  3. Unique institutions with no modern analogues. The user compares this to non-stationarity, but it's more about the underdetermination of social structures. Unlike geophysics, where laws are constant, human societies can create entirely novel institutions, making prior knowledge less reliable.

  The leftover part: Is this a vocabulary gap or vagueness in terms? The dog pit example shows a fundamental difference. Belief attribution isn't verifiable like physical parameters; it's about plausible interpretation. The residue isn't vagueness but a hermeneutic gap—understanding meaning versus measuring quantities. The geophysical framework breaks when faced with intentionality and symbolism.

  In conclusion, while inverse problems cover data-to-model mapping, archaeology's challenge is interpreting meaning without deterministic laws. The user's vocabulary can handle ill-posedness but not the hermeneutic aspects. The dog pit can't be settled in geophysical terms; it requires contextual interpretation beyond physical evidence.
answer: |-
  Here's a breakdown using your vocabulary rigorously, identifying where the mapping holds, where it genuinely differs, and what constitutes irreducible residue. I'll address your points in order:

  ### 1. Restating the Inference Problem in Geophysical Terms
  - **Data (d)**: The assemblage (pits, postholes, artifacts, ecofacts, spatial relationships). Discrete, measurable, physical entities.
  - **Model (m)**: Past beliefs, social institutions, motivations. *These are abstract, non-physical constructs.*
  - **Forward Operator (G)**: "Formation processes." This maps **m → d**. It includes:
    - Human actions (building, discarding, ritual deposition).
    - Taphonomic processes (decay, disturbance, preservation bias).
    - *Crucially, G is stochastic, highly nonlinear, and only partially knowable.* Unlike in geophysics, we lack first-principles "equations" for human behavior.
  - **Inverse Problem**: Find **m** such that **G(m) ≈ d**, given noisy, incomplete **d** and imperfectly known **G**.
  - **Ill-posedness/Non-uniqueness (Equifinality)**: Absolutely maps. Many different belief systems (**m₁, m₂, ... mₙ**) can produce identical archaeological assemblages (**d**) under **G**. A dog skull under a doorway could be ritual *or* rubbish; the data alone doesn't discriminate.
  - **Regularization (Prior Constraints)**: "Ethnographic analogy" is indeed a prior (Bayesian **P(m)**). So are cross-cultural generalizations ("uniformitarian principles"). *But archaeology's priors are inherently weaker and less quantifiable than geophysical ones (e.g., rock physics laws).*
  - **Resolution Limits**: Directly maps to her complaint about coarse pictures. The "kernel" of **G** smooths fine-scale social/intentional details. You can resolve "settlement patterns" (low-frequency signal) better than "individual ritual motives" (high-frequency signal).
  - **Where the Mapping Holds**: The core structure of **inverting noisy data with an imperfect operator to recover hidden parameters** is identical. Ill-posedness, regularization, and resolution are fundamental to both.

  ### 2. The Residue Report: What Has No Counterpart
  Here's where the mapping breaks:

  - **The "Rule of Thumb" & Knowability**:  
    *Your Analogy (Null Space):* Correct that functional activities (diet, tool-making) often have higher "resolution" than symbolic ones (worship).  
    *The Residue:* **Your null space is defined by physics (equations). Hers is defined by cognition and meaning.**  
    - *Why diet/tools are "knowable":* These map more directly to physical traces via constrained behaviors (e.g., cut marks → butchery; lithic reduction debris → toolmaking). The forward operator **G** has tighter, more predictable links for survival activities.
    - *Why worship/beliefs are "unknowable":* Symbolic acts are massively underdetermined. A single action (dog+pot) can signify infinitely many beliefs. **The "implicit theory" she hasn't fully articulated is cognitive archaeology/hermeneutics: Physical objects don't *contain* meaning; meaning is *ascribed* by agents using cultural codes.** You can predict null spaces from wave equations; she predicts them from theories of *how material culture encodes intentional states* (which is messy, contested, and lacks governing equations). It's not guessing; it's domain-specific theory about signal-to-noise in intentional acts.

  - **The Dog Pit & Belief Attribution**:  
    *Your Analogy:* This looks like non-uniqueness (rubbish vs. ritual).  
    *The Residue:* **The argument "bottoms out" in a fundamentally different place: the ontology of "belief".**  
    - In geophysics, your **m** is physical (density, velocity). Its existence is uncontested. Your inverse problem estimates its *value*.  
    - In archaeology, the very *existence* of the model parameter **m** ("belief in doorway guardians") is the core challenge. **"Belief" isn't a hidden physical property; it's an interpretive construct.** The argument isn't just about resolving **m**; it's about justifying *introducing* **m** into the model space at all.  
    - **The Inference is Abductive, Not Just Inversion:** Her argument moves:  
      d (dog+pot) + Prior (analogy, context) → *Plausible Explanation* (ritual deposit) → *Attribution of Belief* (guardian spirit).  
      The leap from "ritual deposit" to "they believed X" is **hermeneutic** (interpretation of meaning), not just underdetermined inversion. "Belief" isn't directly measurable; it's inferred from the *assumed* intentional structure of the action. This is where your framework hits a wall. **"They believed X" is neither true nor false in a simple empirical sense; it's an inference to the best *explanation* for the action, given our understanding of human symbolic behavior.** It's "true" if it best coheres with all evidence and theory; "false" if a better explanation exists; "not even false" if belief-attribution itself is deemed inappropriate for the context.

  - **Unique Institutions & Non-Stationarity**:  
    *Your Analogy:* Non-stationarity (changing earth properties) is relevant.  
    *The Residue:* **Radical Ontological Novelty vs. Parameter Variation.**  
    - In geophysics, non-stationarity means *parameters change value* (e.g., velocity increases with depth). The *equations* (wave equation) remain valid. Your priors still apply.  
    - In archaeology, a "unique institution" implies a *fundamentally different category of social organization* with no modern/ethnographic parallel (e.g., Neolithic temple complexes before agriculture). **This isn't just **m** changing; it's the *model space itself* being incompletely defined.** Your prior **P(m)** (based on known societies) may be actively misleading. There's no "governing equation" for human social invention. This is **underdetermination of theory by data**, not just non-uniqueness of parameters.

  ### 3. The Leftover: Vocabulary Gap or Vagueness?
  **It's a genuine vocabulary gap rooted in ontology and epistemology.** The residue isn't *vagueness*; it's a *qualitatively different kind of challenge*.

  - **The Hole in Your Vocabulary:** You lack concepts for **intentionality, meaning, and culturally constructed reality.** Your framework handles *physical* hidden parameters. Archaeology often seeks *mental/social* constructs. The "forward operator" linking beliefs (**m**) to objects (**d**) isn't just complex; it operates via **symbolic mediation** (cultural codes) that have no direct analog in wave propagation. Your regularization uses physical laws; hers uses theories of mind and culture.
    
  - **The Dog Pit Specifically:** Your framing breaks *before* it gets there.  
    - **In your terms:** You could model:  
      `d = G(m)` where `m` might be "Ritual_Intent_Score" (a continuous parameter).  
      You could show `m` is in the null space (non-uniqueness: rubbish or ritual fit equally well).  
      **You cannot model:**  
      `m = "Belief_In_Doorway_Guardian"`  
      because "belief" isn't a parameter your math can represent. The link between the physical arrangement (dog+pot) and the mental state (belief) isn't governed by physics; it's governed by *interpretive rules* about symbolism, which are culturally specific and inherently contestable. **The argument "bottoms out" in whether applying *that specific interpretive rule* is justified for that context.** This is hermeneutics, not inversion.

  **Conclusion:** Your partner is partially right. Archaeology *is* an ill-posed inverse problem – but with a critical twist. The "model" (**m**) she seeks (beliefs, institutions) exists in a different ontological category than density or seismic velocity. The "forward operator" (**G**) involves human intentionality and cultural meaning-making, which lack deterministic equations and introduce irreducible hermeneutic (interpretive) leaps. **The residue isn't vagueness; it's the gap between physical traces and reconstructed mental/social worlds.** Your vocabulary perfectly describes the *data-to-behavior* or *data-to-institution* mapping (e.g., "this pit layout implies a roofed structure"). It strains at the *behavior-to-meaning* or *institution-to-belief* mapping ("this structured deposit implies a cosmological concept"). That leap requires tools you don't have (hermeneutics, theory of mind) and she can't fully formalize. It's the hard core of her discipline.
