prompt: |-
  I'm a geophysicist, my day job is inverse problems (seismic mostly, some magnetotellurics), so I basically think in forward models, null spaces, regularization, resolution limits and non-uniqueness. I'm fluent in that and pretty much useless outside it. My partner is a archaeologist and we keep having the same arguement in two different vocabularies.

  Her problem, as she puts it: you've got the stuff — pits, postholes, pots, bones, cut marks, the whole assemblage — and you have to get from that to what people believed and how their institutions worked. I keep saying that's just an inverse problem: the objects are the data, the past beliefs are the model, and everything she calls hard I'd call ill-posedness. She says its worse than that. I'd like to know whether she's right or whether she's just describing my field with worse notation.

  So, three things:

  1) Restate her inference problem — objects to beliefs and institutions — in my vocabulary, as faithfully as you can, and don't cheat by quietly switching back into hers when it gets awkward. Tell me where the mapping genuinely holds. My naive guesses: her "equifinality" is my non-uniqueness, ethnographic analogy is a prior, formation processes are the forward operator, and her complaints about how coarse the resulting picture is are just resolution limits. Push back on any of that if it's wrong.

  2) The residue report, which is the part I actually care about. What's in her problem that has no counterpart in mine at all. Three things I've noticed that might point at it:

  - She's got this rule of thumb that you can say what people ate, or how they made their tools, with reasonable confidence, but what they worshipped, or why they put a dog under a doorway, is more or less off limits. In my game, if a parameter sits in the null space I can tell you that up front, from the physics. She thinks she can tell you up front too, but not from any equations, which means either she's got some implicit theory she hasn't told me about, or she's guessing and dressing it up.

  - When she argues that a pit with an inverted pot over a dog's skull is a foundation deposit rather than a rubbish pit, the argument never bottoms out in the objects. It bottoms out in whether you're allowed to attribute a belief to anybody. I don't know how to write that in my language. And the claim she actually wants to make — that they thought the doorway needed a guardian — I can't tell whether that's the kind of thing that's true or false, or not even false.

  - She says the past contains institutions with no modern analogue, and she insists that's not just my non-stationarity problem. I don't see the difference, but she's usually right about her own field.

  3) Your view on the leftover. Is it a hole in my vocabulary — i.e. I'd need a concept I don't have and can't get from geophysics — or is it a sign that "they believed X" in archaeology is doing less work than it sounds, so the residue is really just vagueness in her terms rather than a gap in mine?

  Be honest about the dog pit specifically: can that be settled at all in my terms, or does the framing break before it gets there? Don't pull punches on the vocab, I can take it. Also I did one phil of science unit 12 years ago and retained nothing, so if you need actual philosophy, explain it, don't just name it at me.
