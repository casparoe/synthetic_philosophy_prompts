prompt: |-
  so i run a tiny podcast where i interview philosophers of science, and next week's guest has spent the last decade defending a version of structural realism i cant find anywhere else in quite this shape. her line is roughly: dont be a realist about objects, and dont be a realist about the equations either — be a realist about the *invariance structure*, i.e. the set of features of a theory that are preserved under every symmetry transformation the theory admits and that stay put when the theory gets replaced by its successor. everything else, the entities, the ontology, even the particular formalism, is scaffolding for getting at that invariant core, and the realist's entire commitment should be to the core and nothing besides. she also has a claim i find suspicious: that this dissolves the pessimistic meta-induction, because the historical cases where theories got thrown out were cases where the *ontology* changed but the invariant structure was carried over, so there was never a real discontinuity in what we were committed to.

  write me 8-10 interview questions for her. i want them to actually bite, so press where the objections actually are, not 'so what is structural realism'. specifically i need at least one question on the Newman objection — the one where a Ramsey-sentence style 'structure' turns out to be satisfied by any old set of the right size, so realism about structure collapses into realism about cardinality — and whether her invariance criterion does anything to block that or just relabels it. one on the epistemic-vs-ontic divide: is she saying structure is all we can *know*, or all there *is*, and can she hold the ontic version without losing the relata that relations supposedly need. and one on whether the criterion is too permissive in the other direction as well — whether two rival theories that are empirically equivalent but structurally different, or structurally identical with different ontologies, come out the same or different on her account, and what that does to her meta-induction argument.

  for each question give me the follow-up she's most likely to give and the follow-up to that, since she's good at saying 'thats the ontology, not the structure' and i want to be ready for it. also throw in one question about whether 'invariant under theory change' is even well-defined when the successor theory uses a different mathematical framework, so theres no shared structure to compare in the first place, and one on whether her view leaves any room for causation or modality, since a bare invariant mathematical core doesnt obviously have either. end on something that would actually make her sweat, and flag any place where her beleif might just be a restatement of a problem rather than a solution.
reasoning: |-
  Okay, the user runs a podcast interviewing philosophers of science and has an upcoming guest with a unique take on structural realism. The guest advocates for realism about "invariance structure"—features preserved under symmetries and theory changes—while dismissing entities and equations as mere scaffolding. She claims this dissolves the pessimistic meta-induction because historical theory shifts only changed ontologies, not the invariant core. The user wants sharp interview questions targeting key objections, with follow-ups to preempt her likely defenses.

  Hmm, the user is clearly well-versed in philosophy of science—they name-drop the Newman objection and epistemic/ontic distinctions effortlessly. Their frustration with surface-level questions suggests they want a substantive debate that exposes weaknesses. The meta-induction angle seems personal; they call her claim "suspicious," so they likely want to pressure-test her historical narrative. 

  Breaking this down: First, Newman’s objection is non-negotiable—if her invariance is just cardinality in disguise, her whole project collapses. The follow-up must force her to explain how invariance adds constraints beyond Ramsey sentences. Second, the epistemic/ontic split matters because if she’s ontically committed to structure alone, she risks relations without relata—a classic structuralist pitfall. Third, permissiveness cuts both ways: if rival theories share structure, her realism might be too thin; if they don’t, her meta-induction fails. 

  Ah, and the theory-change problem is sneaky: if successor theories use incompatible math (e.g., continuum vs. discrete), how can invariance even be compared? That could unravel her historical argument. Causality/modality is another vulnerability—mathematical structures don’t "cause" anything, so her view might render science explanatorily sterile. 

  For the sweat-inducing finale, I’ll attack the meta-induction directly: cherry-picking history to fit her thesis is circular. If she dismisses counterexamples as "not real structure," she’s defining success tautologically—a restatement of the problem, not a solution. 

  ...Writing questions now. Need surgical precision. For Newman, I’ll ask how invariance differs from Ramsey structure, then press her to explain why it doesn’t reduce to cardinality. For ontic commitment, I’ll corner her with "relations require relata," and when she deflects, demand she define the relata without objects. The rival-theory question will force her to admit either structural equivalence (undermining realism) or discontinuity (killing meta-induction). 

  User’s gonna love the theory-change follow-up: if she says we "reinterpret" old structure, that’s question-begging—how without a shared framework? And for causality, if she calls it "emergent," that’s hand-waving. Saving the knockout punch for last: her meta-induction defense presumes what it proves. If she calls past theories "structural continuations," but only when convenient, that’s not dissolution—it’s evasion.
answer: |-
  Here are 8 incisive interview questions targeting the core tensions in your guest's position, complete with predicted responses and follow-ups to push deeper:

  1.  **The Newman Objection Bite:** "Your 'invariant structure' sounds vulnerable to Newman's objection: if structure is defined abstractly (like a Ramsey sentence), it's satisfied by *any* set of the right cardinality, reducing realism to realism about set size. How does your emphasis on *invariance under specific symmetries* and *theory change* escape this? Doesn't 'invariance' just add labels to the same underlying cardinality problem?"
      *   *Likely Reply:* "Newman targets impoverished structuralism. My invariant core is defined *dynamically* by the specific symmetries governing the theory and its successful successor, imposing concrete constraints far beyond mere cardinality. It's not abstract set structure, but *physical* structure preserved under transformations relevant to the phenomena."
      *   *Follow-Up:* "But doesn't defining the 'relevant' symmetries implicitly rely on the *specific ontology/equations* you reject as scaffolding? If the symmetries are defined purely formally, aren't we back to abstract structure vulnerable to Newman? How do you pick the *physically significant* symmetries without smuggling in ontology?"

  2.  **Epistemic vs. Ontic Commitment - The Relata Problem:** "You say commit *only* to the invariant structure. Is this an epistemic claim (structure is all we can *know* for sure) or an ontic claim (structure is all that fundamentally *exists*)? If ontic, how do you avoid the 'relations without relata' problem? Doesn't structure inherently require *something* structured?"
      *   *Likely Reply:* "Ontic. The invariant structure *is* the fundamental reality. Talk of 'relata' is often a misleading projection of our object-oriented language onto a fundamentally relational reality. The structure is self-subsistent; 'nodes' in the structure are defined purely relationally, not as independent bearers of properties."
      *   *Follow-Up:* "But doesn't this dissolve the *causal efficacy* we attribute to entities? If a photon is just a node in the electromagnetic field structure defined by gauge symmetries, what 'kicks' the electron in Compton scattering? Isn't the *experience* of discrete objects/interactions irreducible, suggesting structure *needs* carriers?"

  3.  **Permissiveness I: Empirically Equivalent Rivals:** "Consider two empirically equivalent theories, T1 and T2, with radically different mathematical structures or ontologies, but predicting all the same observables. Does your invariance criterion imply they share the *same* invariant core? If yes, doesn't this make your realism too weak (committing to a core shared by incompatible descriptions)? If no, how do you distinguish their cores when both are 'successful' and no successor exists yet?"
      *   *Likely Reply:* "Empirical equivalence alone isn't enough. The invariant core is defined relative to the *symmetries inherent in the theory itself and its path through theory space*. T1 and T2 might have different symmetry groups, hence different invariant structures *even if empirically equivalent now*. The core is tied to the specific dynamical structure."
      *   *Follow-Up:* "But doesn't this risk making the 'invariant core' hostage to future theory *choice* rather than objective features? If physicists later choose T1's successor over T2's, does T1's 'core' retroactively become the 'real' one? How is this not instrumentalist?"

  4.  **Permissiveness II: Same Structure, Different Ontology (Meta-Induction Test):** "Consider theories like continuum mechanics vs. atomism, or wave vs. matrix mechanics. They arguably have compatible or identical *empirical structure/predictions* at some level, but profoundly *different ontologies*. On your view, do they share the same invariant core? If yes, doesn't this validate your meta-induction claim? If no, doesn't this contradict the historical continuity you need for the meta-induction argument?"
      *   *Likely Reply:* "They share *aspects* of the invariant core – the empirically successful predictions captured by symmetries common to both descriptions. However, the *full* invariant core of the *more fundamental* successor theory (e.g., QFT incorporating aspects of both waves and particles) reveals the deeper structure. The historical shift wasn't discarding *the* core, but refining our grasp of it; the old ontology was scaffolding for *part* of the true invariant structure."
      *   *Follow-Up:* "This sounds perilously close to saying 'the invariant core is whatever survives'. How do you *objectively* identify the 'deeper' structure *before* the successor arrives? Isn't your claim that 'only ontology changed' in historical shifts a *post hoc* rationalization dependent on knowing the successor?"

  5.  **Defining Invariance Under Theory Change:** "Your core criterion requires identifying structure preserved when a theory is replaced by its successor. But successors often employ radically different mathematical frameworks (e.g., Newtonian vectors vs. Lagrangian configuration spaces vs. Hamiltonian phase spaces; continuous vs. discrete spacetime). How can you even *compare* structures to identify invariance when the mathematical languages are incommensurable? Isn't 'invariance under theory change' ill-defined without a prior, theory-neutral notion of 'structure'?"
      *   *Likely Reply:* "We look for *physical equivalences* preserved: conserved quantities, symmetry groups acting on measurable quantities, topological features of the solution space, relationships between key parameters. We map these features *across* the mathematical representations. The invariant structure is what these mappings consistently preserve."
      *   *Follow-Up:* "But isn't the *choice* of which features to map (conserved quantities, symmetries, etc.) already theory-laden and presupposes what's important? Doesn't this mapping process implicitly rely on interpreting the *old* theory *through* the lens of the *new* one, making the 'invariance' seem more robust than it is?"

  6.  **Causality and Modality:** "A bare mathematical invariant structure seems devoid of causal powers or modal force (necessity, possibility). How does your view account for causation – what makes one invariant structure 'cause' another? And how does it ground scientific modality – why is it *necessary* that E=mc², or *possible* to build a superconducting magnet? Isn't reducing reality to pure structure leaving out these essential aspects of scientific understanding?"
      *   *Likely Reply:* "Causation and modality are *features within* the invariant structure. Dynamical laws encoded in the structure *are* the causal relations. Symmetries and conservation laws encode necessities. Possibilities are defined by the state space permitted by the structure. These aren't 'added' to the structure; they are how the structure manifests."
      *   *Follow-Up:* "But doesn't this risk making causation and modality purely mathematical/formal? If the structure dictates that event A invariantly precedes event B under all symmetries, is that sufficient for A *causing* B? What distinguishes genuine causation from mere correlation within the structure? And doesn't the 'necessity' derived from the structure itself feel contingent – why *this* structure?"

  7.  **The Scaffolding Dilemma:** "You call entities, ontology, and formalism 'scaffolding'. But if the invariant structure is all that's real, and this structure is only accessible *through* specific formalisms and interpreted ontologies (the scaffolding), how can we ever be sure we've identified the *real* structure and not just an artifact of the particular scaffolding we used? Isn't the scaffolding paradoxically essential for identifying what you claim is fundamental?"
      *   *Likely Reply:* "Scaffolding is essential *for us*, as cognitive agents, to grasp and manipulate the structure. But its *specific form* is contingent and replaceable. The invariance under symmetry and theory change is our guide to distinguishing the real structure (which persists) from the contingent scaffolding (which changes). Successive approximations refine our grasp."
      *   *Follow-Up:* "Doesn't this imply a kind of Kantian noumenon – a structure-in-itself we can only approximate through our scaffolds? If so, how is your realism different from transcendental idealism? If not, and the structure is directly accessible through invariance, how do you avoid the circularity of needing scaffolds to identify invariance?"

  8.  **The Sweat-Inducer: Dissolution or Redescription? (Meta-Induction Revisited):** "Your claim to 'dissolve' the pessimistic meta-induction relies heavily on reinterpreting historical theory change as preserving an invariant core while discarding only ontology. But critics argue this is simply *re-describing* the history to fit your thesis. How do you *objectively* adjudicate cases where a successor theory seems to genuinely *eliminate* central structural features of its predecessor (e.g., the absolute simultaneity structure of Newtonian spacetime vs. the relativity of simultaneity in SR; the deterministic state evolution of CM vs. the indeterminism of QM)? Aren't you forced to either: (a) dismiss these as 'merely ontological/scaffolding', which seems question-begging, or (b) admit structural discontinuity, undermining your dissolution of the meta-induction? Is your 'invariant core' perhaps just a *restatement* of the continuity we *hope* exists, rather than a solution?"
      *   *Likely Reply:* "Cases like SR vs. Newton highlight the refinement. Galilean invariance (a key Newtonian structure) is recovered as a low-velocity limit of Poincaré invariance. The *relational* aspects of spacetime structure (distances, causal connections under some transformations) persist, while the *absolute* structure is shed. QM retains classical symmetries (rotation, translation) and conservation laws, even while changing the *nature* of state evolution. The core deepens; it doesn't vanish."
      *   *Follow-Up:* "But the *specific structure* of absolute simultaneity *is* gone, not just 'scaffolding'. The *specific structure* of deterministic evolution *is* gone. You're pointing to *different*, arguably *more abstract*, structures that are preserved (symmetries, conservation laws). Isn't this just shifting the goalposts? If 'invariant structure' means 'whatever sufficiently abstract mathematical feature we can find in common', doesn't it become vacuous? How is 'deepening the core' meaningfully different from 'changing the structure' in a way that *still* validates the meta-induction's point about radical theory change?"

  **Key Flags for Potential Problems:**
  *   **Newman:** Watch for whether "invariance under specific symmetries" genuinely adds non-trivial constraints or just relabels the problem. The follow-up presses the source of the symmetries' physical significance.
  *   **Ontic Commitment/Relata:** The "relations without relata" problem is severe for ontic structural realists. Her "self-subsistent structure" reply is standard but highly contentious metaphysically. The causality/modality follow-up extends this pressure.
  *   **Permissiveness/Meta-Induction:** Her position risks being either too weak (if rivals share a core) or unable to guarantee continuity (if cores differ). The historical argument is vulnerable to charges of cherry-picking or re-description. **Question 8 directly flags the core concern: Is this a solution or a restatement?** The "shifting goalposts" and "vacuousness" points in the follow-up are the sharpest attacks.
  *   **Theory Change Definition:** The cross-theory mapping problem is fundamental. If it relies on successor-theory interpretation, it's circular.
  *   **Scaffolding Dilemma:** Highlights the potential epistemic inaccessibility of the "real" structure she posits.

  These questions force her to confront the deepest metaphysical, epistemological, and historical challenges to her unique brand of structural realism, moving well beyond textbook definitions. Good luck with the interview!
