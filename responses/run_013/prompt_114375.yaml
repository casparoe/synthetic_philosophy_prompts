  3. A detailed 30-point marking scheme highlighting key moves and common pitfalls.

  For the exam question, I'll structure it to force engagement with the distinction. The hypothetical case—where a civilization develops math for aesthetics and it later describes a physical phenomenon—serves as a litmus test for "virgin effectiveness." The prompt should ask students to:  
  - Explain which type of effectiveness Wigner finds puzzling.  
  - Evaluate if borrowed effectiveness is truly puzzling.  
  - Confront the selection effect rebuttal.  
  - Analyze the hypothetical case's implications.  

  The model answer must avoid Platonism/nominalism tropes. Instead, it should:  
  - Argue virgin effectiveness is Wigner's core concern.  
  - Position borrowed effectiveness as unremarkable (analogical generalization).  
  - Show selection effect relocates but doesn't dissolve the puzzle.  
  - Use the hypothetical case to expose that unreasonable effectiveness hinges on psychological surprise and pattern-revelation.  

  The marking scheme should penalize:  
