  **Step 4: Weaknesses and Judgment Calls**

  - **Judgment call**: Identifying the use of a nonconstructive principle. Referees might miss a subtle use of DNE or LPO. The telltale moves list helps, but it's not exhaustive.
  - **Judgment call**: Deciding if a case split is on a decidable predicate. Referees might not know what is decidable in constructive mathematics.
  - **Judgment call**: Question 4 (whether the theorem is equivalent to a nonconstructive principle) requires knowledge of constructive reverse mathematics. Most referees (especially non-constructivists) won't know.
