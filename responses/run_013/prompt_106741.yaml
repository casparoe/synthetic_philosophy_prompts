  - **Misfire**: The form requires the referee to scan the entire proof for nonconstructive steps. This might take more than 45 minutes for a long paper.

  **Mitigations**:
  - The journal should provide a brief training document for referees with examples of nonconstructive moves and common decidable predicates.
  - The form should be designed to be as objective as possible, focusing on the predefined list and telltale moves.
