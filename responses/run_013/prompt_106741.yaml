     a) Is every nonconstructive principle used by the proof declared in the budget?
          - If no, then the budget is under-declared. List the undeclared principles.
     b) Is every declared principle actually used in the proof?
          - If no, then the budget is over-declared. List the over-declared principles.

  **Question 4: Is the proof essentially nonconstructive?**
  - Consider: if we remove the declared nonconstructive principles, does the theorem still hold? Or is the theorem known to be equivalent to a nonconstructive principle?
  - Example: if the theorem is equivalent to LPO and the author uses LPO, then it is honest but the theorem might be nonconstructive. However, the journal might still publish if the author declares. But if the theorem is equivalent to EM, then it is nonconstructive in any useful sense.
  - If the theorem is equivalent to a nonconstructive principle that is declared, then it is honest. But if the equivalence is known and the declared principle is strong (like EM), then the editor might consider whether the result is still of interest to the journal.
  - The referee should note if the theorem is known to be equivalent to a nonconstructive principle (even if declared) and mark "not constructive in any useful sense" only if the proof relies on principles so strong that the result is trivial or nonconstructive in essence. Otherwise, leave that decision to the editor.

