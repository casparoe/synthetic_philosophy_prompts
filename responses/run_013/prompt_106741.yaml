answer: |-
  ### Referee Form for Axiom Budget Audit  
  **Instructions for Referees:**  
  1. **Time Budget:** Aim for 45 minutes. Focus on high-level proof structure, key lemmas, and "telltale moves" (listed below).  
  2. **Your Role:** Audit the author's declared "axiom budget" (nonconstructive principles used). **Do not** debate philosophical acceptability—only verify:  
     - Nothing used that isn’t declared.  
     - Nothing declared that isn’t used.  
  3. **Order of Operations:** Answer questions in sequence. Stop at the first definitive verdict.  
  4. **Judgment Calls:** Highlighted in *italics*. When in doubt, hand back to the editor.  

  ---

  #### **Question 1: Theorem Statement Constructive?**  
  - **Check:** Does the theorem claim existence/computation without a method? (e.g., "a program exists" without constructing it).  
  - **Sufficient Answer:**  
    - ✅ **Yes** (proceed to Q2) if:  
      - Objects are computable (e.g., "we compute a solution X").  
      - Disjunctions are decidable (e.g., "n is even or odd").  
    - ❌ **No** (verdict: *Not constructive in any useful sense*) if:  
      - Claims existence via contradiction or non-algorithmic means.  
      - Uses undecidable disjunctions (e.g., "P or not P" for an untestable P).  
  - **Hand Back to Editor If:** Ambiguous statement (e.g., "a solution exists" with no context).  

  ---

  #### **Question 2: Proof Use Nonconstructive Principles?**  
  - **Scan For Telltale Moves** (indicators of undeclared spending):  
    - 🔍 **Proof by contradiction** for positive claims (e.g., "assume no solution exists → contradiction, so one exists").  
    - 🔍 **Case splits on undecidable predicates** (e.g., "case 1: Goldbach’s conjecture is true; case 2: false").  
    - 🔍 **Compactness arguments** (e.g., infinite objects built via finite approximations, without explicit computation).  
    - 🔍 **Non-uniform continuity** (e.g., "for all ε, there exists δ" without a modulus of continuity).  
    - 🔍 **Choice sequences** (e.g., "choose x_n such that..." without an algorithm).  
    - 🔍 **Classical equivalents** (see Table 1; e.g., using "bounded monotone sequences converge" → LPO).  
  - **Sufficient Answer:**  
    - ✅ **None found** → proceed to Q3.  
    - 🚩 **Found** → list principles used (match to Table 1). Proceed to Q3.  
    - **Hand Back to Editor If:**  
      - Principle used is **not in Table 1**.  
      - Proof is unclear (e.g., gaps masking nonconstructivity).  

  ---

  #### **Question 3: Budget Honest?**  
  - **Compare** declared budget vs. actual usage (from Q2).  
  - **Sufficient Answer:**  
    - ✅ **Budget Honest** if:  
      - All used principles are declared.  
      - All declared principles are used.  
      - *Minor over-declaration (e.g., declaring MP but using it once trivially) is acceptable*.  
    - 🚩 **Under-declared** if:  
      - Used principle not declared (e.g., proof uses KL → author declared nothing).  
    - 🚩 **Over-declared** if:  
      - Declared principle unused (e.g., declared AC_ω but proof is choice-free).  
  - **Verdict Here:** Stop and return verdict (✅/🚩).  

  ---

  #### **Question 4: Salvageable?**  
  - **Check:** Is the theorem *equivalent* to a nonconstructive principle?  
  - **Sufficient Answer:**  
    - ✅ **Yes, but declared** → *Budget Honest* (publishable if budget is honest).  
    - ❌ **Not constructive in any useful sense** if:  
      - Theorem fails constructively without strong principles (e.g., requires full EM).  
      - Proof relies on undeclared + irreparable gaps (e.g., compactness with no constructive alternative).  
  - **Hand Back to Editor If:**  
    - Equivalence is unclear.  
    - Author could trivially fix (e.g., add MP to budget).  

  ---

  ### **Table 1: Nonconstructive Principles (Axiom Budget)**  
  | Principle              | Abbrev. | "Cost" (Equivalence/Consequence)      | Telltale Moves                                  |  
  |------------------------|---------|---------------------------------------|-----------------------------------------------|  
  | Excluded Middle        | EM      | Full classical logic.                 | Case splits on arbitrary P; "without loss of generality". |  
  | Markov’s Principle     | MP      | "Not not P → P" for computable P.     | Proving termination by contradiction.         |  
  | Countable Choice       | AC_ω    | Sequential continuity → non-uniformity| "Choose x_n for each n" with no algorithm.    |  
  | Fan Theorem (classical)| KL      | König’s Lemma (infinite paths).       | Compactness arguments; finite coverings.      |  
  | Limited LPO            | LPO     | "Decidability" of ∀n f(n)=0.          | "Either f=0 everywhere or not" (non-algorithmic). |  
  | Dependent Choice       | DC      | Transfinite recursion.                | Indefinite sequences of choices.              |  

  > **Note:** Principles like **intuitionistic fan theorem (IFT)** are *not* on this list—they are constructive and need no declaration. KL (classical) requires declaration.  

  ---

  ### **Worked Examples**  
  #### **Submission 1:** Classical halting proof via compactness. Author claims "constructive" (program exists).  
  - **Q1:** Theorem claims "every program halts" without computation method → ❌ *Not constructive*. **Verdict:** Not constructive in any useful sense.  
  - *(Q2-Q4 skipped; stop at Q1)*  

  #### **Submission 2:** Fixed-point theorem, no budget declared, uses KL in a lemma.  
  - **Q1:** Theorem states fixed point computable → ✅ constructive.  
  - **Q2:** Proof uses compactness argument → 🚩 KL detected (telltale: coverings without uniform bound).  
  - **Q3:** KL used but undeclared → 🚩 **Under-declared**.  
  - *(Stop at Q3)*  

  #### **Submission 3:** Theorem needs MP, author declares nothing (thinks MP is "scandalous").  
  - **Q1:** Theorem states constructive existence → ✅.  
  - **Q2:** Proof shows "not not halting → halting" for a computable function → 🚩 MP detected.  
  - **Q3:** MP used but undeclared → 🚩 **Under-declared**.  
  - *(Stop at Q3)*  

  ---

  ### **Where Judgment Calls Creep In (and Misfires)**  
  1. **Q1 (Theorem Statement):**  
     - *Judgment:* Deciding if "exists X" implies computation.  
     - *Misfire:* Classical referees may accept non-algorithmic existence.  
     - **Fix:** Journal must provide examples (e.g., "constructive = witness with algorithm").  

  2. **Q2 (Detecting Principles):**  
     - *Judgment:* Is a case split decidable? (e.g., "rational/irrational" requires a constructively decidable predicate).  
     - *Misfire:* Hostile referees may flag all case splits; naive referees miss undecidable splits.  
     - **Fix:** Predefined list of common decidable predicates (e.g., "n > m", "is prime").  

  3. **Q3 (Usage vs. Declaration):**  
     - *Judgment:* Is a principle "used"? (e.g., MP in a minor lemma vs. the main proof).  
     - *Misfire:* Referees may demand over-declaration (e.g., "used AC_ω because it’s in a cited lemma").  
     - **Fix:** Require declaration only for principles *essential to the main result*.  

  4. **Q4 (Equivalence):**  
     - *Judgment:* Is theorem X *known* to be equivalent to LPO/MP? Non-constructivists won’t know.  
     - *Misfire:* Referees assume "uses MP → not constructive" (ignoring that MP is often acceptable).  
     - **Fix:** Omit Q4 unless referee is a constructivist; otherwise hand back to editor.  

  ---

  ### **Final Notes**  
  - **Why This Works:** Forces objectivity via a checklist and predefined principles. Authors/referees focus on traceable moves.  
  - **Why It Might Fail:**  
    - Referees skip scanning (45 mins is tight for deep checks).  
    - Authors "hide" nonconstructivity (e.g., citing classical theorems).  
    - False positives from overzealous referees (e.g., claiming "compactness → KL" for constructive compactness).  
  - **Red Flag:** Hostile referees will misuse Q4 to reject papers with declared MP/KL. **Solution:** Editor reviews all verdicts.  

  **Recommendation:** Pair this form with a 1-page "telltale moves" cheat sheet for referees. Update Table 1 annually as community standards evolve (e.g., IFT vs. KL debates).  

