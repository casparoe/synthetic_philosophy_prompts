  **Example 3:**
  - A paper that needs Markov's principle, submitted by someone who thinks MP is a scandal (so they didn't declare it? But the problem says the main theorem needs MP). However, the author did not declare MP because they think it's constructive? But the journal requires declaration.

  **Audit:**
  - Author's declared budget: None (since they think MP is fine and don't declare).
  - Question 1: Theorem statement is constructive? We assume yes.
  - Question 2: The proof uses MP (Markov's principle). Telltale move: for example, proving that a certain computable function halts by contradiction: "if it didn't halt, then ... contradiction, so it halts." But note: MP is exactly for such situations. So the proof uses MP.
