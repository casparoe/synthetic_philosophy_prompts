  **Referee Form for Axiom Budget Audit**

  **Paper ID: __________**
  **Author's Declared Axiom Budget: __________** (list of principles from the predefined list, e.g., "MP, AC_ω")

  **Instructions for Referee:** 
  - Your task is to audit the author's axiom budget: verify that every nonconstructive principle used is declared and that every declared principle is actually used.
  - You are not to judge whether the principles are acceptable (that is the journal's policy), only whether the budget is honest.
  - If the proof uses a principle not on the predefined list, note it and stop (hand back to editor).
  - If the proof is not constructive in any useful sense (e.g., uses EM or full AC without which the theorem fails), then you may mark it as such.

  **Question 1: Is the theorem statement itself constructive?**
  - Check: does the theorem statement assert the existence of an object without providing a means to compute it? Or does it use a nonconstructive disjunction? 
     - Example: "Either the sequence is all zeros or it isn't" is nonconstructive if it doesn't provide which one and why.
  - If the theorem statement is nonconstructive (e.g., it uses classical logic in the statement), then stop and mark "not constructive in any useful sense". 
  - If the theorem statement is constructive, proceed.

  **Question 2: Does the proof use any nonconstructive principle?**
  - Scan the proof for telltale moves (see list below). If you find one, identify which principle it uses. 
  - **Telltale moves**:
     - Proof by contradiction without a negative goal: especially when proving a positive existential statement by contradiction.
     - Use of the word "obviously" or "clearly" when it hides a nonconstructive step (like an application of LEM or DNE).
