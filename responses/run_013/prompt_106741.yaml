     - Use of a choice function without an explicit construction.
     - Use of compactness arguments (like in the classical proof of program halting via compactness) without a constructive counterpart.
     - Use of a non-constructive fixed point theorem (e.g., Brouwer fixed point via classical means) or intermediate value theorem without a constructive version.
     - Use of a classical result without verifying that it is constructively valid.

