prompt: |-
  I spent thirty-five years running clinical trials before I retired, and I have come to moral and political philosophy late. I have been reading my way into the literature on paternalism and nudging — choice architecture, defaults, opt-out schemes, the label libertarian paternalism — and I have the strong impression that the participants argue about verdicts in particular cases before anyone has said what a theory in this area would have to accomplish. I would like the specification first.

  Please write me the desiderata for a theory of justified paternalistic interference. Not a defence of any position, but the list of things any adequate account must deliver — the cases it must get right, the distinctions it must not collapse, the results it must be consistent with — with the case or consideration behind each item. Treat the standard as one that has to be good enough to settle contested policy, not merely to organize intuitions.

  I expect the list to cover at least the following territory, though I would rather you tell me which of these are genuine requirements and which are the prejudices of a particular camp: the difference between helping an agent secure the ends he already holds and substituting the intervener's ends for his; interventions that operate on an agent's beliefs or deliberations rather than on his actions; the boundary between acting for a person's own good and acting because his conduct is thought offensive or immoral, or because it harms others; the competent adult who knowingly and repeatedly chooses what is bad for him, set beside the adult who says he wishes he could stop; those for whom the presumption of competence fails outright, and the continuum between them and the rest of us; self-paternalism, where there is no second party and the agent binds his own future self; the state as nudger against the shopkeeper who rearranges the shelves; and the requirement, if it is one, that a justification be statable openly to the person it governs — including whether a measure that would stop working once disclosed is thereby discredited.

  Three things I especially want. First, mark which requirements are negotiable and which are not, and identify the single requirement that does the most work in excluding candidate theories. Second, say whether any subset of the requirements is jointly unsatisfiable; I suspect that a demand for disclosure and a demand for effectiveness will pull against each other, and I want to know whether that is a real tension or an artefact of how the requirements were stated. Third, and closest to my own experience: say what a theory here must be consistent with empirically. I have watched a great many interventions that looked decisive in a pilot turn out to be small, heterogeneous, and short-lived. If a theory's verdicts depend on the size and durability of such effects, that dependence should be made explicit rather than assumed away.

  Skip the survey of the literature. I can read the primary sources; what I cannot find is the standard they are all implicitly being held to.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired clinical trials expert seeking rigorous desiderata for paternalism theory, explicitly rejecting literature surveys in favor of foundational standards. Their clinical background suggests high value on empirical robustness and operational clarity.

  First, I need to distill core requirements from their listed concerns while filtering out what they call "camp prejudices." The key domains they identified - ends substitution versus facilitation, belief/action distinction, harm/offense boundaries, competence gradations - all point toward needing clear decision principles rather than ad-hoc judgments. 

  The three special requests are crucial: 
  1) Identifying non-negotiable requirements suggests hunting for bedrock principles like competence respect that no theory can violate without collapsing into authoritarianism. 
  2) The disclosure-effectiveness tension requires examining whether this is inherent or resolvable through careful formulation. 
  3) Empirical consistency demands building in sensitivity to effect sizes and decay rates - their clinical experience makes this non-negotiable.

  I'm structuring the desiderata to reflect clinical trial thinking: defining primary endpoints (essential requirements) before secondary ones (negotiable features). The competence continuum and ends substitution feel like hard constraints, while disclosure rules might have exceptions. The empirical robustness requirement will need explicit parameters - effect magnitude thresholds, duration criteria - to satisfy their demand for operationalizability.

  Noticing their impatience with philosophical vagueness, I'll avoid abstract terms like "autonomy" and instead specify concrete tests: e.g., "must distinguish between overriding choices versus enabling choice-execution." Their shopkeeper-versus-state point indicates institutional legitimacy matters, so I'm adding power-asymmetry assessments to the framework.

  The disclosure paradox interests me most. If a nudge fails when visible, does that indicate manipulation (bad) or rational adjustment (good)? This needs separating into two requirements: one about mechanism transparency, another about effectiveness conditions. Their clinical mind will appreciate that distinction - like labeling a drug's mechanism versus its administration protocol.
answer: |-
  Here is a specification of desiderata for a theory of justified paternalistic interference, structured to meet your requirements. It prioritizes operational clarity, distinguishes negotiable from non-negotiable elements, identifies empirical constraints, and flags tensions.

  ---

  ### **Desiderata for a Theory of Justified Paternalistic Interference**

  #### **Non-Negotiable Requirements**  
  *(Violation invalidates the theory)*

  1.  **Competence Threshold Respect:**  
      *   **Requirement:** Must distinguish interventions targeting *profoundly incompetent* agents (e.g., severe dementia, acute psychosis) from those targeting agents with *diminished competence* (e.g., addiction, cognitive biases) or *full competence*. Interventions justified for the profoundly incompetent cannot automatically justify interventions in other categories.  
      *   **Case/Consideration:** Permitting paternalism for the profoundly incompetent is widely accepted; extending it without distinction to all adults collapses into unacceptable authoritarianism.  
      *   **Empirical Constraint:** Must account for clinical/psychological evidence on decisional capacity spectra and context-dependence.

  2.  **Ends vs. Means Distinction:**  
      *   **Requirement:** Must rigorously distinguish interventions helping agents achieve **their own ends** (e.g., simplifying enrollment in a desired pension plan) from interventions substituting **the intervener's ends** for the agent's (e.g., forcing savings because the intervener values thrift more than the agent values present consumption). The former may be justifiable; the latter is impermissible domination.  
      *   **Case/Consideration:** Collapsing this distinction eliminates the "libertarian" in libertarian paternalism and justifies imposing external values.  
      *   **Empirical Constraint:** Requires methods to ascertain agent ends (e.g., preferences revealed under low-pressure conditions, longitudinal consistency).

  3.  **Anti-Moralism Constraint:**  
      *   **Requirement:** Must provide clear criteria distinguishing actions taken **for the agent's own good** (paternalism) from actions taken because the conduct is deemed **immoral, offensive, or harmful to others** (moralism, legal moralism, harm principle). Theories cannot justify paternalism based solely on offense or contested morality.  
      *   **Case/Consideration:** Justifying bans on "vices" like gambling or recreational drugs solely because others find them distasteful, without evidence of net harm *to the gambler/user*, violates core liberal principles. Harm-to-others requires separate justification.

  4.  **Manipulation vs. Rational Influence Delineation:**  
      *   **Requirement:** Must distinguish interventions operating **transparently on beliefs/deliberation** (e.g., providing salient information) from those operating **non-transparently to subvert rational deliberation** (e.g., exploiting known cognitive flaws without awareness). Non-transparent subversion is presumptively impermissible.  
      *   **Case/Consideration:** Exploiting System 1 heuristics to trigger automatic, unreflective choices against an agent's reflective values undermines agency more fundamentally than transparent persuasion.  
      *   **Empirical Constraint:** Must engage with cognitive science on deliberative vs. automatic processing and susceptibility to manipulation.

  **The Most Excluding Requirement:** **#2 (Ends vs. Means)** does the most work. Many popular "paternalistic" policies (e.g., banning large sodas, enforcing specific retirement savings rates) fail if they impose external ends rather than facilitating agent-defined ends.

  ---

  #### **High-Priority (Largely Non-Negotiable) Requirements**

  5.  **Competence Continuum Sensitivity:**  
      *   **Requirement:** Must account for the **spectrum of competence** (e.g., fatigue, stress, addiction, mild cognitive impairment) and tie intervention permissibility/strength to the *degree* and *nature* of competence impairment in the specific decision context. Presumption of full competence is defeasible, not absolute.  
      *   **Case/Consideration:** Treating the stressed parent making a medical decision identically to the severely addicted gambler or the fully rational planner is implausible.  
      *   **Empirical Constraint:** Requires evidence on how context and state affect decision quality for specific domains.

  6.  **Volitional Divergence (Akrasia) Recognition:**  
      *   **Requirement:** Must treat interventions differently for the **knowing, persistent, unconflicted chooser** of the "bad" option vs. the agent experiencing **volitional conflict** (e.g., "I wish I could stop smoking"). Interventions for the latter may be justifiable as aiding the "better self"; overriding the former is highly suspect.  
      *   **Case/Consideration:** Overriding the unconflicted chooser disrespects agency; aiding the conflicted chooser may respect deeper autonomy.  
      *   **Empirical Constraint:** Requires methods to reliably identify volitional conflict (e.g., expressed regret, commitment devices sought).

  ---

  #### **Negotiable Requirements**  
  *(Scope, Weight, or Implementation Can Vary)*

  7.  **Self-Paternalism Accommodation:**  
      *   **Requirement:** Should explain the permissibility/role of **self-binding strategies** (e.g., Ulysses contracts, commitment devices) without requiring a "second self."  
      *   **Case/Consideration:** Distinguishes internal conflicts across time from external imposition.  
      *   **Negotiability:** *How* the theory grounds the authority of the prior self over the future self (e.g., competence hierarchy, identity continuity) can vary.

  8.  **Actor Legitimacy & Power Asymmetry:**  
      *   **Requirement:** Must address whether justifications differ for the **state** vs. **private actors** (e.g., shops, employers). Requires analysis of power asymmetry, accountability, and potential for abuse.  
      *   **Case/Consideration:** State nudges carry democratic legitimacy concerns; corporate nudges raise exploitation/consent concerns.  
      *   **Negotiability:** The *degree* of scrutiny required for different actors and the *level* of acceptable asymmetry can vary by theory.

  9.  **Transparency & Effectiveness Tension:**  
      *   **Requirement:** Must address whether a justification must be **statable openly** to the governed person, and whether an intervention **losing effectiveness if disclosed** is thereby discredited.  
      *   **Case/Consideration:** Hidden defaults in organ donation rely on inertia; disclosure might trigger reflection, reducing effectiveness. Is this manipulation or respecting rationality?  
      *   **Negotiability:** **This is the Key Tension.** Theories can:
          *   *Prioritize Transparency:* If it stops working when disclosed, it relied on deception/subversion and is invalid (Kantian/Deliberative).
          *   *Conditional Permissibility:* Effectiveness loss upon disclosure signals manipulation, making it *generally* impermissible, but *possibly* justified if harm is severe and alternatives fail (Consequentialist).
          *   *Effectiveness Primacy:* If disclosure destroys a benignly effective tool for achieving the agent's own ends, disclosure isn't required (Radical Libertarian Paternalist).
      *   **Empirical Constraint:** **Crucially:** Requires evidence on *when and why* disclosure changes effectiveness (e.g., triggers deliberation vs. reactance).

  ---

  #### **Essential Empirical Constraints**  
  *(Theories must explicitly incorporate these realities)*

  10. **Effect Size & Heterogeneity Requirement:**  
      *   **Requirement:** Verdicts on permissibility **must be sensitive to empirical evidence on**:  
          *   *Magnitude* of the beneficial effect (small effects rarely justify intrusion).
          *   *Durability* of the effect (transient effects justify less).
          *   *Heterogeneity* of effects (interventions harming significant subgroups are suspect).
          *   *Predictability* of individual response.
      *   **Rationale:** Your core insight: Pilot optimism is common. A theory demanding large, durable, uniform effects for permissibility is stricter than one accepting small, fleeting, average effects. **The theory must state its thresholds explicitly.** (e.g., "Permissible only if effect size > X, duration > Y, harm to < Z% of population, with reasonable predictability").
      *   **Case:** A nudge increasing healthy eating by 2% for 3 weeks in 60% of people, with 10% eating *less* healthy, cannot be judged identically to one increasing retirement savings by 20% persistently for 95% with minimal harm.

  11. **Comparative Effectiveness & Least Restrictive Alternative:**  
      *   **Requirement:** Must require that a paternalistic intervention be **demonstrably superior** (in effectiveness, cost, burden, liberty-infringement) to **non-paternalistic alternatives** (e.g., education, facilitation, removing barriers) achieving the same legitimate end (ideally the agent's own end).  
      *   **Rationale:** Paternalism is only justified if less intrusive methods reliably fail. Requires empirical comparison.  
      *   **Case:** Defaults for retirement savings may be justified only if simpler enrollment/education proves ineffective.

  12. **Unintended Consequence Scrutiny:**  
      *   **Requirement:** Must require robust assessment of potential **unintended consequences** (e.g., reduced autonomy feelings, learned helplessness, crowding out intrinsic motivation, stigmatization, erosion of trust, displacement of harm) and incorporate this risk into permissibility judgments.  
      *   **Empirical Constraint:** Demands evidence from behavioral science and implementation studies on systemic effects beyond the immediate target behavior.

  ---

  **Summary of Key Points:**

  *   **Hard Constraints:** Respect for agent competence (#1) and ends (#2), Anti-Moralism (#3), and rejecting non-transparent subversion (#4) are fundamental. Violating these risks authoritarianism.
  *   **Core Tension:** The **Transparency vs. Effectiveness** requirement (#9) is inherently conflicted. Different theories resolve it differently, defining a major fault line. *No subset is jointly unsatisfiable overall, but specific resolutions of #9 may conflict with specific interpretations of #4 (Manipulation) or #2 (Ends).*
  *   **Empirical Anchor:** Theories are empirically constrained (#10, #11, #12) and **must explicitly state thresholds** for effect size, duration, heterogeneity, and comparative effectiveness. Ignoring this renders theories practically irrelevant for policy. Your clinical trial experience highlights the necessity of this rigor.
  *   **The Workhorse:** Requirement #2 (Ends vs. Means) is the most powerful filter, excluding policies that impose values rather than aid agency.
  *   **Distinctions Preserved:** The list ensures distinctions between Ends/Means, Belief/Action, Own Good/Offense/Harm, Competence Levels, Akrasia types, Actor types, and Self/Other paternalism are maintained.

  This specification provides the necessary standard against which theories (Sunstein/Thaler, Conly, Mills, Grill, etc.) and specific policy nudges can be rigorously evaluated for justification, moving beyond intuition to operationalizable criteria grounded in agency, evidence, and liberal principles.
