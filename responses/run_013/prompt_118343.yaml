prompt: |-
  I'm writing a small internal grant application (six months, me plus maybe a grad student) and I want to turn a half-formed thought about consequentialist cluelessness into a real proposal, so I need you to help me frame it properly.

  The thought: I think the cluelessness debate keeps running two different complaints together. One is that we can't compute the far-future consequences of what we do — that's a fact about us and our limits. The other is that for lots of pairs of acts there may be no settled fact about the long-run value difference at all, because the difference depends on what later people choose to do with whatever we leave them, and that hasn't been decided yet. The standard replies — swap actual consequences for expected value over some enormous space of futures, or look for a dominance argument — strike me as only really engaging the first complaint. If the second one is right, it isn't an epistemic problem at all, and telling me to maximize expected value is answering a question I wasn't asking.

  So the question I want the proposal built around: for a given pair of ordinary acts, is the claim that their far-future value difference is unsettled — rather than merely unknown — coherent and defensible, and if it is, what's left of the expected-value response? I want it stated precisely enough that it could come out either way, not rigged.

  What I need from you: the precise question, why the usual replies don't settle it, what I'd actually do month by month (I was thinking of working through three structurally different cases — a donation, a vote, and funding a line of research — and seeing whether the indeterminacy claim survives in all, some, or none of them), what a good result looks like, what would count as the project failing, and whether six months is realistic or whether this is really a book. No bibliography, I'll put the references in myself.
reasoning: |-
  Okay, let me start by understanding the user's core issue. They're writing a grant proposal about consequentialist cluelessness, specifically distinguishing between two types of problems: epistemic limitations and metaphysical indeterminacy. The user feels existing responses only address the first and wants to explore if the second is valid and what that means for expected value theory.

  First, I need to frame the research question precisely. The key is to separate the two complaints clearly. The epistemic one is about our inability to know long-term outcomes, while the metaphysical one is about whether those outcomes are even determinate yet. The question should be neutral, allowing either outcome. 

  Next, why don't standard replies address the second complaint? Expected value calculations assume there's a true value we're estimating, but if the future is unsettled, there might be no fact of the matter. Dominance arguments avoid probabilities but still rely on fixed outcomes. The user needs to show how these approaches miss the point when outcomes aren't fixed yet.

  For methodology, the user plans three case studies: donation, voting, research funding. Each represents different agency levels and chains of consequences. I should suggest breaking down each case into whether value differences are indeterminate and how expected value applies. This structure tests the hypothesis across scenarios.

  Assessing feasibility in six months is crucial. Literature review and case analysis seem manageable, but if each case requires deep dives, time might be tight. Prioritizing key examples over exhaustiveness and setting clear milestones per month would help. Failure conditions include indeterminacy collapsing into epistemic issues or cases not supporting the distinction.

  The user's deeper need might be to challenge consequentialism's foundations, impacting practical decision-making. They might also want to position their work as bridging ethics and metaphysics, appealing to grant reviewers by showing theoretical and practical relevance. Ensuring the proposal highlights these stakes could strengthen it.
answer: |-
  Here’s a structured proposal framework centered on your core distinction, designed to be rigorous, open-ended, and feasible for 6 months:

  ---

  ### **1. Precise Research Question**
  > **"For pairs of ordinary acts (A, B) with divergent near-term consequences but indeterminate long-term causal chains, is the *value difference* in their far-future outcomes metaphysically unsettled (due to dependency on future free choices), and if so, does this undermine the coherence of expected-value maximization as a response to cluelessness?"**

  ### **2. Why Standard Replies Don’t Settle This**
  - **Expected Value (EV) Responses**: Assume a fixed probability distribution over *possible* futures. But if later choices render value-differences indeterminate (not merely unknown), EV calculations lack determinate truthmakers. EV addresses uncertainty, not ontological indeterminacy.
  - **Dominance Arguments**: Require outcome-ranking stability across scenarios. If value-differences are unsettled (e.g., A enables futures where B dominates and vice versa), dominance conditions fail *structurally*, not epistemically.
  - **Both approaches presuppose** a fixed set of outcomes/valuations to compare. Your challenge denies this fixity for act-pairs where downstream agency intervenes.

  ### **3. Methodology: Month-by-Month Plan**
  - **Months 1–2: Conceptual Groundwork & Case Design**  
    - Formalize "indeterminacy" (contrast: epistemic ignorance, stochastic uncertainty).  
    - Define "ordinary acts" (finite agency, non-existential stakes).  
    - Select 3 cases with escalating causal complexity:  
      - **Donation**: E.g., $1k to anti-malaria vs. climate advocacy today.  
      - **Voting**: E.g., Policy X vs. Y, where implementation hinges on future electoral/policy choices.  
      - **Research Funding**: E.g., AI safety vs. quantum computing, where societal use is underdetermined.  
    - *Deliverable: Case protocols with identified "choice points" enabling indeterminacy.*

  - **Months 3–4: Case Analysis**  
    - For each case, model:  
      - Causal chains 50–200 years out.  
      - Key "agency nodes" (future choices affecting value).  
      - Whether value-difference *at T* supervenes on *present facts* or requires *future facts*.  
    - Test if EV/dominance can be applied *without* smuggling determinacy assumptions.  
    - *Deliverable: Indeterminacy assessments per case + map of where EV calculations break down.*

  - **Month 5: Synthesis & Implications**  
    - Generalize conditions for indeterminacy (e.g., "high-agency pivots" in causal chains).  
    - Diagnose if/when EV becomes: (a) incoherent, (b) revisionary (e.g., requires fixed "choice probabilities"), or (c) preserved.  
    - *Deliverable: Typology of cluelessness responses relative to indeterminacy.*

  - **Month 6: Drafting & Dissemination**  
    - Internal report + journal article outline.  
    - Workshop with peers.  

  ### **4. What a "Good Result" Looks Like**
  - **Strong Success**: Indeterminacy is coherent and defensible in ≥1 case, forcing a revision of EV (e.g., EV applies only to "low-agency" acts, or requires new axioms).  
  - **Moderate Success**: Indeterminacy is plausible but collapses into epistemic problems under scrutiny, showing *why* EV remains the least-bad option.  
  - **Valuable Failure**: Indeterminacy is incoherent, revealing that all cluelessness reduces to epistemology—resolving the conceptual confusion.

  ### **5. Failure Conditions**
  - **Conceptual Collapse**: "Unsettled value-difference" is indistinguishable from standard uncertainty in all cases.  
  - **Triviality**: Indeterminacy only applies to acts with existential stakes (e.g., human extinction), excluding "ordinary" acts.  
  - **Intractability**: Cases resist modeling without untenable simplifications.

  ### **6. Feasibility (6 Months?)**
  - **Yes, if**:  
    - Scope is **strictly conceptual** (no empirical work).  
    - Cases are **sharply bounded** (e.g., 2–3 choice points per case).  
    - You tolerate **exploratory** (not exhaustive) conclusions.  
  - **Risks**:  
    - Rabbit holes in metaphysics of future contingents (control via pre-defined criteria for "indeterminacy").  
    - Over-scoping cases (mitigate by selecting paradigmatic examples).  
  - **Not a book yet**: This probes a *foundational* question. A book would require broader engagement with decision theory, ethics of risk, and historical cases.

  ---

  ### **Key Strengths of This Frame**
  - **Neutrality**: Success doesn’t require proving indeterminacy—clarity on *why* it fails is equally publishable.  
  - **Novelty**: Directly targets the conflation in the literature.  
  - **Impact**: Challenges core consequentialist tools (EV) on their own terms.  
  - **Efficiency**: Cases serve as focused stress-tests, not comprehensive surveys.

  Would you like to refine any section (e.g., tighten the question, adjust cases, or clarify deliverables)?
