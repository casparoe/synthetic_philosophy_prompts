answer: |-
  The practice of publishing cryptographic security level tables presupposes a specific, realist framework of computational complexity, while remaining compatible with certain rival views if moderately interpreted. Below is a reconstruction of its presuppositions, what it strictly requires versus what it accommodates, which views are ruled out, and the implications of shifting to a concrete machine-relative view.

  ### **Core Presuppositions (Strictly Required)**
  1. **Problem-Centric Realism about Hardness**:  
     Hardness is an *objective property of computational problems* (e.g., factoring integers, solving discrete logarithms), not merely of algorithms, machines, or epistemic states. Security tables treat hardness as intrinsic to the mathematical structure of the problem, independent of human knowledge.

  2. **Worst-Case to Average-Case Reduction**:  
     The worst-case hardness of a problem (e.g., "factoring is hard for some inputs") implies its average-case hardness ("factoring random RSA moduli is hard"). Without this, security guarantees for randomly chosen keys would be unjustified.

  3. **Commensurability of Difficulty**:  
     Security levels allow direct comparison of *unrelated* problems (e.g., symmetric ciphers vs. elliptic curves) via a single "bit" metric. This assumes hardness can be quantified uniformly across different mathematical domains.

  4. **Adversarial Computational Bound**:  
     Adversaries possess resources (time, space) that can be *bounded in advance* for all practical purposes. This bound is treated as fixed, predictable, and independent of unforeseeable hardware advances (though revisable, as with quantum threats).

  5. **Polynomial-Time as a Meaningful Boundary**:  
     "Efficient" algorithms are those running in polynomial time ($\text{poly}(n)$), while exponential-time ($\text{exp}(n)$) is "infeasible" for large $n$. Tables implicitly rely on this dichotomy to define security levels (e.g., $2^{128}$ operations is infeasible).

  ### **Compatible but Not Strictly Required**
  - **Physical Constraints**: The practice fits with the view that computational hardness arises from physical limits (e.g., energy costs, thermodynamics), but does not *require* it. Tables can be justified mathematically while acknowledging physics informs runtime bounds.
  - **Revisability**: The practice accommodates updates (e.g., post-quantum crypto) without abandoning realism. Hardness is treated as contextually stable but not immutable.
  - **Pragmatic Instrumentalism**: Tables can be used instrumentally (as useful heuristics) without commitment to complexity-theoretic realism, so long as practitioners act *as if* hardness is objective.

  ### **Rival Views Ruled Out**
  1. **Strict Conventionalism about Polynomial Time**:  
     If the polynomial/exponential divide is *purely* conventional (e.g., $n^{1000}$ is "efficient" by definition), security levels become arbitrary. Tables require polynomial time to meaningfully separate feasible/infeasible in practice.

  2. **Radical Instrumentalism**:  
     Views reducing complexity classes to *only* predictive tools (with no ontological commitment) are incompatible. Tables treat hardness as a fact about problems, not just useful fictions.

  3. **Machine-Relative Difficulty**:  
     If hardness depends fundamentally on *specific hardware* (e.g., "factoring is hard for CMOS but not QC"), security levels could not be problem-centric or stable. Tables assume hardness transcends current machines.

  4. **Epistemic or Subject-Relative Complexity**:  
     Views where hardness is relative to the knower (e.g., "a problem is hard only if *we* lack an algorithm") are excluded. Tables presuppose hardness is observer-independent.

  5. **Knowledge-Centric Views**:  
     If complexity claims are *only* about human ignorance (e.g., "factoring is hard because we haven’t found a fast algorithm"), tables become unjustified. They require hardness to exist independently of our knowledge.

  ### **Underdetermined Aspects**
  - **Metaphysical Status of Hardness**: The practice does not specify whether hardness is a mathematical truth (e.g., rooted in logic) or emergent from physics. Both views can coexist with the tables.
  - **P vs. NP and Proof Burden**: Tables are agnostic to whether $\text{P} \neq \text{NP}$ is provable. Security rests on empirical evidence and heuristic reductions, not deductive certainty.
  - **Quantum Threat Scope**: Pre-quantum tables assumed classical adversaries but were revised post-quantum. The practice allows for threat-model updates without philosophical upheaval.

  ### **Shifting to a Machine-Relative View: Consequences**
  If security levels were grounded in *concrete, physical machines* (e.g., "128-bit security against 2024 ASICs"), the practice would transform radically:
  - **Construction**: Tables would require frequent updates (e.g., yearly), tied to benchmarks of existing hardware. Security levels would become time-stamped (e.g., "128-bit in 2024").
  - **Defense**: Justifications would cite physical limits (e.g., transistor counts, energy efficiency) instead of asymptotic complexity. "Bit security" would measure cost on current hardware, not abstract problem hardness.
  - **Teaching**: Pedagogy would emphasize engineering constraints (e.g., Moore’s Law, quantum annealing) over mathematical reductions.
  - **Abandonments**:  
    — Problem-centric commensurability (e.g., comparing AES and RSA loses meaning if tied to specific hardware).  
    — Worst-case to average-case reductions (irrelevant if hardness is device-dependent).  
    — Long-term parameter sizing (e.g., "use 3072-bit RSA until 2030" replaces "128-bit security").  
  - **Surviving Elements**:  
    Adversarial bounds could still be defined (e.g., "attacker budget: $1M in 2024"), but as economic/physical estimates, not mathematical invariants.

  ### **Summary**
  The practice presupposes a **realist, problem-centric view of computational hardness** where security levels are intrinsic to mathematical problems, portable across contexts, and bounded by polynomial-time feasibility. It rules out subject-relative, machine-specific, or purely epistemic accounts of complexity. Shifting to a concrete machine-relative view would collapse the universal "bit security" framework, forcing parameter sizing to become a dynamic, hardware-bound engineering exercise—a fundamental departure from current standards. The practice remains resilient to unresolved questions (e.g., P vs. NP) but is incompatible with philosophies denying the objectivity of hardness.
