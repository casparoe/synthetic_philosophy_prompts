answer: |-
  ## The Drafter's Doubt

  I file the forms for freight that freely flows;
  The clauses interlock, the gears engage.
  One small adjustment, then the next one grows.

  We trace the patterns on the drafting page:
  A duty shared requires a common rule,
  Then courts to weigh it, stage by patient stage.

  The peace, the market – these, the measured tool,
  Build quiet purpose where old borders stood.
  The edifice advances, strong and cool.

  Yet what sustains this intricate, joint good?
  No sovereign voice rang out, "Begin this race!"
  Consent was borrowed, latent, understood.

  But now that silent licence shows its face,
  Grows thin, withdraws. The fractures start to show.
  Who grants the power in this shared space?

  The work continues, neither stop nor go.

  ---

  **Notes on Execution:**

  *   **Form & Argument:** The terza rima (ABA BCB CDC DED EFE) embodies the chain of integration. Each middle line's rhyme drives the next stanza, mirroring functional spillover ("One small adjustment...", "A duty shared requires...", "Build quiet purpose..."). The final tercet's 'E' rhyme (*face*, *space*, *show*) is abruptly *not* picked up by the closing line (*go*), enacting the democratic rupture ("shows its face", "withdraws", "fractures"). The closing line, isolated, reflects the unresolved, ongoing process.
  *   **Voice:** A "drafter" (implied standards officer/legal expert) focuses on the *textual* and *procedural* reality of integration ("file the forms", "drafting page", "clauses", "common rule", "shared space"). Their work *is* the mechanism.
  *   **Tension & Asymmetry:**
      *   Functional Legitimacy: Emphasised through results ("peace, the market", "intricate, joint good", "strong and cool", "work continues").
      *   Democratic Deficit: Highlighted through absence ("No sovereign voice...", "Consent was borrowed...", "silent licence", "Who grants the power?").
      *   Permissive Consensus Expiry: Captured in "But now that silent licence shows its face, / Grows thin, withdraws."
  *   **Imagery:** Mechanical/architectural ("gears engage", "patterns", "edifice", "fractures") contrasts with abstract political concepts ("sovereign voice", "Consent", "power", "licence").
  *   **Break & Ending:** The rhyme scheme break coincides with the democratic question becoming visible and problematic ("shows its face"). The closing line ("The work continues, neither stop nor go.") is deliberately flat, procedural, and unresolved – integration persists, the democratic question hangs, unfinished.
  *   **Accessibility & Precision:** Concepts like functional spillover, permissive consensus, and the competence-competence issue (implied in "Who grants the power?") are rendered through the drafter's concrete experience and the poem's structure, not jargon. A specialist recognises the argument in the progression and the specific rupture.
  *   **Constraints Adhered To:** No proper nouns/institutions, single human voice, British English ("licence"), exact form, plain language, ending as specified.
