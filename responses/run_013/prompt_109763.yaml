answer: |-
  ### Session Plan: Is "Better Than" Transitive?  
  **Total Time: 90 minutes**  

  ---

  #### **I. Foundational Setup (15 minutes)**  
  1. **Define "transitivity" in isolation (5 min)**  
     - "For any options A, B, and C: if A is better than B and B is better than C, then A *must* be better than C."  
     - **Stress:** This is separate from *completeness* (no need to assume all options are comparable). Use symbols: \( A > B \) and \( B > C \) imply \( A > C \).  

  2. **Distinguish strict vs. weak relations (7 min)**  
     - **Strict "better than" (\( > \))**: Asymmetric (if \( A > B \), then not \( B > A \)).  
     - **Weak "at least as good as" (\( \geq \))**: Includes both strict preference and indifference.  
     - **Key insight:** Transitivity of \( > \) does *not* require transitivity of *indifference*. Illustrate with **coffee-sugar example**:  
       - Cup 0 (0g sugar) vs. Cup 1 (0.001g sugar): Indistinguishable → *indifferent*.  
       - Cup 1 vs. Cup 2 (0.002g sugar): *Indifferent*.  
       - But Cup 0 vs. Cup 100 (100g sugar): *Strictly worse* (too sweet).  
       - **Conclusion:** Indifference is intransitive, but \( > \) *may still be transitive*. Name-drop "semiorder" (no elaboration).  

  3. **Clarify the target (3 min)**  
     - "Today’s question: Can a chain of small improvements/worsenings break transitivity of *strict* better-than?"  
     - **Dismiss completeness:** "We’re only asking about transitivity, not whether *all* things can be ranked."  

  ---

  #### **II. Core Spectrum Argument (30 minutes)**  
  1. **Introduce a single, decisive example (5 min)**  
     - **Use a one-dimensional example** (avoid multi-dimensional trade-offs to sidestep debates about weighting).  
     - **Reject sorites cases (heap/bald man)**: They conflate *vagueness* with *value comparison*. "We’re not asking when ‘better than’ becomes vague, but whether small *value differences* accumulate without transitivity failure."  

  2. **Build the spectrum on the board: "Mild Pain Relief" (20 min)**  
     - **Setup:** A 1,000-step chain of pain-relief treatments.  
       - **A₁**: Severe pain (e.g., pain level 1,000).  
       - **A₂**: Slightly less pain (level 999.9).  
       - ...  
       - **A₁₀₀₀**: No pain (level 0).  
     - **Adjacency condition**: Each step \( A_{i+1} \) is *strictly better* than \( A_i \) (e.g., pain level 999.9 > 1,000).  
       - "Each reduction is a *real* improvement—like removing a grain of salt from oversalted soup."  
     - **Stark endpoint gap**: A₁₀₀₀ (no pain) is *clearly better* than A₁ (severe pain).  
     - **Arbitrary cutoff challenge**: "If \( A_{k+1} > A_k \) for every \( k \), transitivity demands \( A_{1000} > A_1 \). But what if we discover \( A_{500} > A_{600} \)?"  
       - **Pivot**: "Now reverse the spectrum. Define \( B_i = A_{1001-i} \), so:  
         - \( B_1 = A_{1000} \) (no pain) > \( B_2 = A_{999} \) (minimal pain) > ... > \( B_{1000} = A_1 \) (severe pain).  
         - By transitivity, \( B_1 > B_{1000} \) (no pain > severe pain). But \( B_{1000} = A_1 \) and \( B_1 = A_{1000} \), so this holds. **No problem yet.**"  

  3. **Introduce the threshold break (5 min)**  
     - **Modify the spectrum**: At step 500, a *side effect* emerges (e.g., addiction risk).  
       - \( A_{500} \) has no side effect; \( A_{501} \) has a *barely detectable* risk.  
       - Each adjacent pair: \( A_{i+1} > A_i \) (pain still decreases; risk increase is negligible).  
       - **Endpoints**: \( A_{1000} \) (no pain, high addiction risk) vs. \( A_1 \) (severe pain, no risk).  
     - **Contradiction**:  
       - Adjacent steps: \( A_{1000} > A_{999} > \dots > A_1 \).  
       - Transitivity implies \( A_{1000} > A_1 \).  
       - **But**: \( A_1 \) may be *better* than \( A_{1000} \) if severe pain is preferable to guaranteed addiction.  

  ---

  #### **III. Addressing Misconceptions (25 minutes)**  
  *Interrupt these as they arise during the spectrum build, but allot dedicated time.*  

  1. **Economists: "Money pumps and utility axioms!" (8 min)**  
     - **When raised**: During adjacency step justifications.  
     - **Response**: "Money pumps assume rational agents *accept* all trades in a cycle. But here, the agent *rejects* \( A_1 \) vs. \( A_{1000} \) despite accepting adjacent steps. Transitivity failure explains this."  
     - **Preempt**: "Utility axioms *assume* transitivity; we’re questioning if reality fits this."  

  2. **Psychologists: "Framing effects/preference reversals!" (8 min)**  
     - **When raised**: When comparing endpoints.  
     - **Response**: "Framing affects *description*, but our spectrum holds descriptions fixed. Preference reversals occur in *choices*, but we’re evaluating objective betterness."  
     - **Refocus**: "Is the pain reduction in \( A_{i+1} \) *truly* better than \( A_i \), regardless of framing?"  

  3. **Linguists: "This is just sorites vagueness!" (9 min)**  
     - **When raised**: When discussing barely detectable differences.  
     - **Response**: "Vagueness asks if a *predicate* (e.g., ‘painful’) has sharp boundaries. We’re asking if *each small improvement is real*. If you concede \( A_{i+1} > A_i \) is true, vagueness doesn’t resolve the contradiction."  
     - **Example**: "Even if ‘better than’ is vague, does \( A_{1000} > A_1 \) hold when \( A_1 > A_{1000} \)?"  

  ---

  #### **IV. Conclusion: Trilemma and Final Question (20 minutes)**  
  1. **The trilemma restated (5 min)**  
     - The spectrum forces a choice:  
       1. **Reject adjacency**: At least one "small improvement" isn’t an improvement (but which one?).  
       2. **Reject endpoint gap**: \( A_1 \) isn’t better than \( A_{1000} \) (denies intuition).  
       3. **Reject transitivity**: "Better than" is intransitive.  

  2. **Final diagnostic question (10 min)**  
     - **Question**: "If we reject adjacency, can we specify *where* the chain breaks? Why or why not?"  
       - **Good answer**: "No—because each step is indistinguishable from the last, any cutoff is arbitrary. This is the core problem." (Shows grasp of the spectrum’s challenge.)  
       - **Poor answer**: "It breaks at step 500" (arbitrary) or "Risk makes it incomparable" (avoids the question).  

  3. **Refuse to resolve (3 min)**  
     - "We won’t settle which horn to take today. This is about seeing why transitivity isn’t obvious—and why philosophers debate this."  

  4. **Honest ending: Stand in the trilemma (2 min)**  
     - "No clean verdict. Does transitivity hold? Only if we deny the spectrum’s premises. But denying them has costs. Stay in this tension—it’s where the literature lives."  

  ---

  ### **Why This Works**  
  - **Flow**: Starts simple (definitions), escalates (spectrum), then confronts pushback.  
  - **Carrying example**: One-dimensional (pain relief) avoids population ethics. Threshold (addiction) creates stark endpoints.  
  - **Misconceptions**: Addressed proactively with discipline-specific rebuttals.  
  - **Ending**: The trilemma is the honest takeaway—invites deeper inquiry without false closure.  

  **Time Buffer**: Keep 5 min flexible for questions during the spectrum build.
