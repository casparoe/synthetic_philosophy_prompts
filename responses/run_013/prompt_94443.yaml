answer: |-
  ## Pantoum of the Divided Man
  *(after Dennett's thought experiment)*

  The rain streaks grey down London glass.
  I feel the Paris cobbles cold.
  This vat's green glow, a liquid mass.
  I feel the Paris cobbles cold.

  I feel the Paris cobbles cold.
  My hand lifts up to touch the Tower.
  Yet *here* the humming cables hold.
  My hand lifts up to touch the Tower.

  My hand lifts up to touch the Tower.
  From *here*, I watch that distant grip.
  The gut insists: that body's power!
  From *here*, I watch that distant grip.

  From *here*, I watch that distant grip.
  The seeing eye, the brain behind?
  Like asking where loose sand grains slip...
  The seeing eye, the brain behind?

  The seeing eye, the brain behind?
  This vat's green glow, a liquid mass.
  Where gravity draws doubt's own mind.
  The rain streaks grey down London glass.

  ---

  **Notes on the Brief:**

  *   **Form:** A five-quatrain pantoum. Lines 2 & 4 of each stanza migrate to become lines 1 & 3 of the next. The final stanza loops back (line 2 becomes line 1, line 4 becomes line 3) and its last line is the opening line, closing the radio loop.
  *   **Perspective Shift:** Migrating lines change speaker/context:
      *   "I feel the Paris cobbles cold" (Stanza 1: Body sensation reported by Brain) -> Same line (Stanza 2: Still Brain reporting Body sensation).
      *   "My hand lifts up to touch the Tower" (Stanza 2: Brain reporting Body action) -> Same line (Stanza 3: Could now be Body's *own* assertion or still Brain).
      *   "From *here*, I watch that distant grip" (Stanza 3: Brain's location/POV) -> Same line (Stanza 4: Ambiguity - could be Brain or *Body* claiming its 'here' as the true seat).
      *   "The seeing eye, the brain behind?" (Stanza 4: Questioning the locus of sight/mind) -> Same line (Stanza 5: Continues the unresolved question).
  *   **Viewpoint/Body Split:** Explicitly stated in "The seeing eye, the brain behind?" and enacted by the Brain observing the Body's actions ("From *here*, I watch that distant grip," "I feel... cobbles cold").
  *   **Gut Feeling vs. Viewpoint:** "The gut insists: that body's power!" directly addresses the intuition that the self is *with* the acting body, contrasting the Brain's actual viewpoint.
  *   **Flatmate's Line:** The sand heap analogy is rendered as "Like asking where loose sand grains slip... / Where gravity draws doubt's own mind." It frames "where am I?" as a question without a single factual answer ("doubt's own mind").
  *   **Ending on the Wobble:** The final stanza loops back, emphasizing the unresolved cycle. The last two lines juxtapose the physical vat ("This vat's green glow...") with the abstract, unresolved question ("Where gravity draws doubt's own mind") and then the opening image of London rain. The "here" in the penultimate stanza remains ambiguous.
  *   **Dennett's Details:** London rain (Brain location), Paris cobbles/Eiffel Tower (Body location), vat/green glow/humming cables (Brain's physical reality), radio link (enacted by the form's loop).
  *   **Accessibility:** The core conflict of divided sensation, viewpoint, and location is clear without prior knowledge. The sand heap analogy is presented as a philosophical perspective on the confusion.
  *   **British English:** "Flatmate" (implied context), "grey," "trousers" (implied by "gut insists: that body's power!" contrasting the brain's perspective). Vocabulary/cadence generally British-neutral.
