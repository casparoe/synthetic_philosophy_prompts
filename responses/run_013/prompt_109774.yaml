  Hmm, this is a sophisticated query from someone clearly deeply engaged with political philosophy. The "dirty hands" dilemma—where political actors commit moral wrongs for perceived greater goods—is complex enough, but their observation about institutional hypocrisy adds another layer. They're not just describing the phenomenon but demanding its implicit moral architecture be reverse-engineered. The level of specificity in their requested response structure suggests they've already done significant groundwork and need rigorous engagement.

  Let me unpack their core questions: First, whether the pattern presupposes that moral costs can be institutionally transferred from individuals to offices (a substantive thesis). Second, whether role differentiation alone could explain it without solving dirty hands (a thinner alternative). They also want to know what changes if we reject these presuppositions. 

  The challenge is reconstructing a defensible view from observable practice alone, without citations. The institutional ritual—sacrificing pawns while protecting bishops, then changing pawn-movement rules—must be treated as coherent rather than corrupt. I'll need to identify the minimal philosophical commitments that make this pattern rational from within the system.

  Key angles to consider: 
  - Hierarchy as moral insulator (does authorization diffuse responsibility?) 
  - The function of procedural reforms as face-saving accountability substitutes 
  - Whether executors are seen as having "dirtier" hands due to direct contact with the act 
  - How rival theories like strict liability vs. collective responsibility might converge on the same outcome 

  For the response structure, I'll: 
  1. Condense the institutional logic in the "Bottom Line" 
  2. Clarify the practice's mechanics in "Restatement" 
  3. In "Commitments", argue it requires both role differentiation and institutional absorption of moral costs (not just one) 
  4. Distinguish necessary vs. compatible elements in "Strict vs Loose" (e.g., it must see authorization as qualitatively different, but can accommodate various dirty-hands solutions) 
  5. In "Underdetermined", show how both consequentialist and deontological theories could justify the pattern differently 
  6. For "If Rejected", describe how holding authorizers culpable would collapse the current hierarchy 
  7. In "Objection", acknowledge the obvious fairness critique 

  The trickiest part is balancing their demand for philosophical rigor with the constraint of deriving theory purely from practice. I must avoid importing external frameworks while still making the implicit explicit. Their frustration with superficial reforms suggests they'll appreciate highlighting how the system protects itself through "accountability theater."
answer: |-
  ### Bottom line  
  This institutional pattern presupposes a **hierarchical theory of absorbed responsibility**, where moral costs attach primarily to direct executors, while authorizers incur only political—not moral—liability. It treats authorization as a distinct role that externalizes moral taint onto institutions or procedures, shielding individuals. The practice defensibly requires seeing roles as creating discontinuous moral spheres, but accommodates various dirty-hands solutions. Rejecting this would collapse the hierarchy, demanding symmetrical accountability and exposing authorizers to equivalent (or greater) culpability.  

  ---

  ### The practice, restated  
  When institutions address policy wrongdoing, a recurring triad emerges: (1) **Operational actors** (e.g., field agents, low-level staff) who executed the act face discipline or legal consequences; (2) **Authorizers** (e.g., policymakers, senior officials) who designed or approved it retain positions and prestige; (3) **Procedural reforms** are instituted to constrain future operational conduct, often ignoring structural or decision-making flaws. This ritual resolves crises while preserving institutional hierarchy and leadership continuity.  

  ---

  ### The commitments it presupposes  
  The pattern rests on three core presuppositions:  

  1. **Role-differentiated moral insulation**: Authorization and execution are distinct moral categories. Executors bear "dirty hands" because they directly commit the act, violating first-order moral norms. Authorizers operate in a sphere of "second-order" responsibility—e.g., weighing necessity, proportionality, or public interest—which is politically consequential but morally sanitized. Their choices are framed as institutional imperatives, not personal moral failures.  

  2. **Institutional absorption of moral costs**: The moral burden of necessary wrongs transfers from individuals to the office or system. When executors are punished, they absorb the taint for the institution; when procedures are reformed, the institution symbolically purges residual guilt. Authorizers avoid culpability because their role legitimizes acts as "of the office, not the person."  

  3. **Proceduralism as absolution**: Reforms targeting operational conduct implicitly concede that the act was wrong but treat it as a correctable system error. This assumes that future wrongs can be prevented by constraining executors, implying that authorizers’ judgment is sound if properly implemented. The focus on process evades scrutiny of the authorization structure itself.  

  Defensibly, this requires accepting that moral responsibility *fragments* across roles: executors violate deontic constraints (e.g., "do not harm"), while authorizers merely risk contingent harms that institutions exist to manage.  

  ---

  ### Strict versus loose  
  - **Strictly required**:  
    - Moral discontinuity between authorization and execution.  
    - Executors as primary bearers of "dirt" for direct acts.  
    - Institutions (not authorizers) as vessels for systemic moral risks.  
    - Procedural reforms as sufficient institutional accountability.  

  - **Loose accommodations**:  
    - *Why* dirty hands are necessary (consequentialism vs. tragic dilemmas).  
    - Whether moral costs dissolve or merely transfer (e.g., to "the public").  
    - How severely executors should be punished (retribution vs. deterrence).  
    - Whether authorizers owe apologies—but not penalties—for "collateral" moral costs.  

  ---

  ### Where it is underdetermined  
  The pattern is compatible with rival theories:  
  - **Consequentialism**: Punishing executors deters reckless operations; sparing authorizers preserves decision-making efficiency. Reforms optimize systems.  
  - **Kantian institutionalism**: Roles define duties; executors violate perfect duties (e.g., not to torture), while authorizers’ imperfect duties (e.g., to protect security) permit latitude.  
  - **Collective responsibility**: The institution bears moral blame, allowing individuals to be "components" with differentiated liabilities.  
  All converge on shielding authorizers but diverge on whether transferred moral costs vanish (consequentialism) or haunt the institution (Kantian).  

  ---

  ### If the presupposition were dropped  
  Rejecting hierarchical insulation would demand:  
  1. **Symmetrical culpability**: Authorizers face proportional—or heightened—punishment as architects of harm. Legal doctrines (e.g., command responsibility) or moral frameworks (e.g., complicity) would apply equally.  
  2. **Structural, not procedural, reform**: Overhauls targeting authorization mechanisms (e.g., independent oversight of policy design) replace executor-focused rules.  
  3. **Collapse of role-based defenses**: "Following orders" or "acting in role" becomes mitigatory, not exculpatory. Dirty-hands debates shift to whether *leaders* can justifiably bear personal guilt.  
  4. **Redefined necessity**: If authorizers shoulder moral costs, "necessary evils" require stronger justification (e.g., imminent catastrophe), curtailing discretionary dirty-hands appeals.  

  ---

  ### The strongest objection to your reconstruction  
  The objection: This reconstruction rationalizes *hypocrisy* as theory. By distinguishing authorization from execution, it ignores how authorizers *choose* to soil others’ hands while keeping their own clean—a moral evasion. If executors lack meaningful autonomy (e.g., under coercion or epistemic constraints), punishing them is scapegoating. True responsibility must track power: authorizers who foresee harm are *more* culpable as initiators, not less. The practice thus fails its own defensibility test by protecting those most responsible.
