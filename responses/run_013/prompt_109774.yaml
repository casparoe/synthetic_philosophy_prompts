prompt: |-
  I'm in a political theory seminar that has spent several weeks on the problem of dirty hands, and I've become fixated on a pattern in how institutions actually handle wrongdoing committed in the course of policy: the people at the bottom, the ones who carried out the act, are disciplined, fired, or prosecuted; the people who authorized, designed, or licensed it keep their positions; and the episode usually closes with a procedural reform that binds no one above the operational level. I want to treat that pattern as a practice with an implicit theory rather than as a string of failures and accidents, and ask what it presupposes. Does it require a specific answer to the dirty-hands question — for instance, that the moral cost of a necessary wrong is transferable from the person who ordered it to the office or institution that authorized it, so that what looks like evasion is really the correct assignment of a burden? Or does it require something thinner, such as role-differentiated responsibility on which authorizing and executing are simply different moral jobs and the dirty-hands problem never gets a grip? Reconstruct the view of responsibility the pattern would have to hold in order to be defensible, distinguish what it strictly requires from what it merely accommodates, mark where it is underdetermined by rival theories that would license the same pattern, and say what would have to change if we rejected the presupposition and treated authorizers as at least as culpable as executors. No citations are available to you; work from the structure of the practice itself.

  Structure the response as follows: "Bottom line" (~75 words); "The practice, restated" (~100 words); "The commitments it presupposes" (~300 words); "Strict versus loose" (~150 words, separating what the pattern strictly requires from what it merely fits comfortably with); "Where it is underdetermined" (~150 words, naming the rival views that would license the same pattern); "If the presupposition were dropped" (~200 words); "The strongest objection to your reconstruction" (~100 words).
