  Here is the case, followed by the requested analysis:

  **The Case: Eleanor**
  Eleanor grows up in a household where academic achievement is implicitly valued but emotional expression is met with discomfort or dismissal. As a child, she finds that focusing intently on her schoolwork earns quiet approval from her parents and avoids awkward conversations. She starts staying in her room to study, even when she hears her younger brother crying after a scraped knee, telling herself he’ll be fine and her time is better spent preparing for the test. In high school, joining the debate team provides structure and accolades; she practices relentlessly, skipping casual hangouts where friends share vulnerabilities she finds uncomfortable, preferring the clear rules of argumentation. At university, she excels in corporate law courses, drawn to the precise logic and distance from messy personal entanglements; she chooses demanding internships over volunteering or campus social events, finding satisfaction in mastering complex briefs. Years later, as a powerful corporate lawyer defending a client knowingly polluting a poor community's water supply, she meticulously crafts legal arguments exploiting jurisdictional loopholes and technicalities to shield the company from liability, focusing solely on winning within the rules, actively dismissing environmental reports and suppressing internal whistleblower testimony as irrelevant distractions from her legal objectives. She feels a professional obligation to win, not malice, but her actions cause preventable harm.

  **Analysis**

  1.  **Galen Strawson's Basic Argument:**
      *   Premise 1: You do what you do because of the way you are (your character/motivational state).
      *   Premise 2: To be truly (ultimately, buck-stoppingly) morally responsible for an action, you must be truly responsible for being the way you are (the character/motivational state that led to the action).
      *   Premise 3: To be truly responsible for being the way you are, you must have intentionally brought it about that you are that way (you must have chosen your character).
      *   Premise 4: But to have intentionally chosen your character, you must already have had some character (some principles of choice) to make *that* choice.
      *   Conclusion: This generates an infinite regress. True (ultimate) moral responsibility is impossible because you cannot be the *cause of yourself*; your character is always shaped by factors (genetic, environmental, prior states) for which you are not ultimately responsible.
      *   **Strawson's Verdict on Eleanor:** Eleanor is *not* ultimately morally responsible (in the demanding, buck-stopping sense) for her blameworthy act of shielding the polluter. Her character – prioritizing intellectual detachment, rule-exploitation, and winning over empathy and broader consequences – was formed through a series of non-deliberative, non-character-shaping choices (attending to studies over brother, debate over friends, law over volunteering, legal logic over moral reports). She never chose *to become* this detached, win-at-all-costs person; she became it by repeatedly choosing specific *activities* that cumulatively shaped her. The initial shaping factors (family environment, innate tendencies) were not her doing. Therefore, the character that produced the blameworthy act wasn't ultimately her responsibility.

  2.  **Compatibilist Verdict:**
      A compatibilist holding that responsibility can be transmitted through earlier non-deliberative activity would conclude that Eleanor **is** morally responsible for her blameworthy act. They argue that her repeated, active choices – to study instead of comfort, to debate instead of socialize, to intern instead of volunteer, to focus on legal logic and dismiss moral concerns – were genuine exercises of her agency *at the time*. These choices, though not *about* her character, were expressions of her developing values and priorities. By actively engaging in and reinforcing certain patterns of attention, practice, and valuation over time, she *owned* the formation of her character. Her later blameworthy act flows directly from this character she actively, though non-reflectively, built through her own choices. Responsibility for the act is grounded in her ownership of the chain of agency that produced the character that produced the act.

  3.  **Crucial Feature & Conceptions of Agency:**
      *   **Feature:** The nature of Eleanor's **attention, habitual choices, and practices** – specifically, whether these constitute genuinely *agentive* contributions for which she can be held responsible at the time she makes them, even though they aren't decisions *about* her character.
      *   **Strawson's Conception (Sourcehood):** Agency requires being the *ultimate source* of one's character/motivational set. Since Eleanor's choices of attention and practice were shaped by unchosen prior factors (family, inclinations), and she never deliberately initiated her character formation, her agency is insufficient for *ultimate* responsibility. Her "choices" are ultimately just happenings within a causal chain she didn't start.
      *   **Compatibilist Conception (Ownership/Historicist):** Agency encompasses a broader range of activities than just explicit character decisions. Choosing *what to do*, *what to attend to*, and *what to practice* repeatedly are exercises of agency that shape the self. Responsibility arises from the agent's history of such active engagements and identifications (even if implicit), creating ownership over the resulting character. Eleanor's choices *were* hers, they expressed her developing evaluative stance, and their cumulative effect *is* her responsibility.

  4.  **Targeting the Basic Argument:**
      *   **Premise Threatened:** Premise 3 ("To be truly responsible for being the way you are, you must have intentionally brought it about that you are that way"). The case challenges the idea that *only* intentional self-creation (deliberate character decisions) can ground responsibility for character.
      *   **Effect:** The case **threatens the premise** by providing a plausible alternative route to responsibility for character: cumulative, non-deliberative, active self-shaping through choices of attention, habit, and practice. It aims to show Premise 3 is false: responsibility for character *can* be grounded in this kind of history. It **does not merely relocate the regress** because the compatibilist argues that each link in the chain *is* an instance of the agent's own active doing (choosing X over Y), sufficient for ownership at that stage, breaking the need for an infinite chain of *character* choices.

  5.  **The Control (Deliberate Decision Swap):**
      *   **Change:** Replace Eleanor's university choice: Instead of simply being "drawn to" corporate law courses and choosing internships, imagine that during a campus talk on legal ethics, she feels a pang of discomfort about corporate law's potential harms but *deliberately decides*: "I need to be tougher, more detached, less swayed by emotional appeals to succeed. That's the kind of lawyer I *will* become." She then actively seeks out corporate law courses and cutthroat internships to harden herself.
      *   **Effect on Verdicts:**
          *   **Strawson:** The regress relocates but persists. How was she responsible for *that* moment of deliberate character choice? It arose from her *prior* character (e.g., ambition, discomfort with emotion), which she didn't choose. The buck still can't stop.
          *   **Compatibilist:** This significantly *strengthens* the case for responsibility. A deliberate character decision is a clearer, stronger link in the chain of ownership. While Strawson's regress argument still applies metaphysically, this substitution makes the compatibilist's claim of ownership and responsibility far more intuitively compelling. It accomplishes what the whole history could not by providing a single, explicit moment that *looks* like taking responsibility for self-formation, making the subsequent blameworthy act seem more clearly "hers" in the demanding sense.
      *   **Why it Accomplishes This:** The substitution provides a concrete, recognizable instance of "taking charge" of one's character development. It satisfies the intuitive craving for a moment of self-authorial control that the purely non-deliberative history lacks, even if philosophically contentious.

  6.  **Collapse if All Episodes are Decisions:**
      If *every* stage involved a deliberate decision about her character ("I choose to become the kind of person who prioritizes study over family," "I choose to become the kind of debater who avoids vulnerability," etc.), the case collapses **into the starting point of Strawson's regress.** The question immediately arises: How was she responsible for the *first* such character decision? What principles or character did *she* use to make *that* choice? The regress becomes starkly apparent, and Strawson's argument seems to gain its strongest traction, demonstrating the impossibility of being the ultimate source of the principles guiding one's self-creation.

  7.  **Strongest Strawsonian Objection & Assessment:**
      *   **Objection:** "Attention, habit formation, and repetition are fundamentally things that *happen to* a person, not things she *does* in a responsibility-grounding way. Eleanor's 'choices' of what to attend to or practice were causally determined by her prior psychological state (shaped by her unchosen upbringing and temperament) and environmental cues. She didn't *choose* her initial inclinations towards detachment or her susceptibility to approval for academic focus. Each moment of 'choosing' study over her brother, debate over friends, etc., was simply the outcome of her existing, unchosen motivational set interacting with circumstances. Calling these 'active choices' or 'her agency' begs the question – it presupposes the very sourcehood/ownership that is in doubt. The case smuggles in passivity disguised as agency."
      *   **Does it Succeed?** **Yes, to a significant degree.** This objection hits the core vulnerability of the case. It highlights the profound difficulty in pinpointing where genuine, responsibility-grounding agency *begins* in a chain of development starting from unchosen origins. The compatibilist "ownership" relies on describing attention and habit-formation as "active," but the Strawsonian can plausibly argue these are merely complex causal responses within a pre-existing, unchosen framework. The objection forces the compatibilist onto the defensive, needing to explain *why* these responses count as "agentive" in the relevant sense without circularity.
      *   **Can it be Repaired or Bound to Fail?** The case **cannot be fully repaired** to definitively *refute* Strawson's Basic Argument from his metaphysical perspective. The objection exposes a fundamental, perhaps irreconcilable, disagreement about the nature of agency and the conditions for ultimate responsibility. However, the case is **not bound to fail** in its purpose. It successfully *threatens* Premise 3 by offering a plausible, realistic alternative narrative of character formation that many (compatibilists) find sufficient for responsibility. It demonstrates that a robust sense of responsibility *can* be grounded in a history of non-deliberative but active self-constitution, even if it doesn't satisfy the demand for *ultimate* sourcehood. The argument hinges on whether the compatibilist conception of historical, ownership-based agency is convincing despite lacking absolute origination. The case vividly illustrates the dispute but cannot resolve the underlying metaphysical divide. Its success lies in making the compatibilist position coherent and psychologically realistic, not in proving Strawson definitively wrong.
