  I need to construct a realistic life history where every step involves active choices (not just omissions), with no brainwashing or sci-fi elements. The key is that at no point does she deliberate about her character - it's all about what she attends to, what habits she forms through repetition. The reader should see each choice as insignificant at the time.

  This is testing Galen Strawson's Basic Argument against moral responsibility, which goes: You act based on who you are → To be responsible for the act, you must be responsible for who you are → But to be responsible for who you are, you must have intentionally made yourself that way → This creates an infinite regress since you can't cause your own existence.

  For this agent, Strawson would say she's not ultimately responsible because she never chose her character-forming mechanisms. But compatibilists would argue that her repeated small choices transmit responsibility backward through the chain of agency.

  The crucial difference is how we view attention and habit-formation. Strawson sees these as things that happen to you ("passive"), while compatibilists see them as things you actively do ("agentive"). The case threatens Strawson's premise that responsibility for character requires intentional self-creation.

  If I swap just one non-deliberative moment with a conscious character decision, the compatibilist position strengthens while Strawson's regress relocates. If every moment were deliberate, it would collapse into the regress problem Strawson describes.

  The strongest objection from Strawson's side is that attention and habits are passive - they happen to you based on prior causes. I think this objection has merit because even "active" choices depend on unchosen cognitive biases. The case can't fully escape this, but it shows why compatibilists focus on ownership rather than ultimate origin.

