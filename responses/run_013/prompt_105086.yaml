  We are planning an undergraduate metaphysics session on the counterpart theory (CT) vs. transworld identity (TI) dispute. The goal is to structure the explanation so that the choice feels forced, using a carefully chosen example, addressing misconceptions, and building toward a sharp question.

  **Core Structure: Order of Introduction**

  The sequence must build the framework step by step so that the question of cross-world identification becomes unavoidable. The key is to show that the standard possible-worlds framework (with rigid designation and the possible-worlds semantics for modal operators) leads to an unavoidable question about how to relate individuals across worlds.

  1. **Start with a de re modal claim that the students accept.**  
     Why: We need a concrete modal claim to anchor the discussion. The claim must be about a specific individual and involve a possibility or necessity that pertains to that individual.  
     Example: "This very table could have been made from a different tree." (We'll choose a better example below, but the point is to have a non-controversial modal claim.)

  2. **Recall the possible-worlds semantics for de re modality.**  
     We have: "Possibly, P(a)" is true iff there is a possible world w in which the individual a has the property P.  
     But note: if we are using the standard Kripkean semantics, then we are committed to the same individual a existing in w and having P.  
     However, here we must pause because the students know rigid designation: a rigid designator refers to the same individual in every possible world. But that does not by itself tell us how to represent the individual in another world. We must ask: what does it mean for a to exist in w?

  3. **Introduce the question of cross-world identity.**  
     Problem: In the actual world, we have an individual a. In another world w, we have a domain of individuals. How do we know which individual in w is a?  
     This question is forced by the standard semantics: if we are to evaluate "Possibly, P(a)" by looking at a world w, then we must be able to identify a in w. But what if w is a world that is very different? What if it contains two individuals that are both candidates for being a?  
     The commitment that makes this unavoidable: **The standard possible-worlds framework requires that the same individual exists in multiple worlds.** This is the transworld identity view. But then we are immediately faced with the problem of how to track the same individual across worlds.

  4. **Present the problem of contingent identity and the need for an identity criterion.**  
     If we allow the same individual to exist in multiple worlds, then we must have a criterion for when an individual in w1 is the same as an individual in w2.  
     But note: Kripke's rigid designation does not by itself solve this; it only says that the name refers to the same individual in every world in which that individual exists. It does not tell us how to identify that individual in a world.  
     The problem becomes acute when we consider that an individual might have different properties in different worlds. How can we be sure that we are tracking the same individual?  
     The standard view (TI) must then either:  
     (a) Adopt an essentialist criterion: There is a set of essential properties that an individual must have in every world in which it exists. Then, in world w, we look for the individual that has these essential properties.  
     (b) Or, adopt a haecceitistic criterion: There is a non-qualitative "thisness" (haecceity) that individuates the object, so that even without any qualitative properties, we can track the individual.  

     However, both of these options are controversial. Essentialism might be too restrictive (what are the essential properties?) and haecceities are mysterious.

  5. **Introduce the challenge: underdetermination in cross-world identification.**  
     We need an example where it is genuinely unclear which individual in another world is the same as the actual individual. This is where we introduce our chosen example.

  **Choosing the Example**

  We need an example that has:
  - A de re modal claim that is uncontroversial.
  - An individual whose identity across worlds is underdetermined.
  - Avoids an independent essence or haecceity that would settle the matter.
  - Avoids accidental features that would let TI and CT coincidentally agree.

  The Humphrey example (saying that Humphrey could have won the election) is worn and also might be settled by essential properties (e.g., Humphrey's origin). We need a case without clear essential properties.

  Proposed example: **A particular cloud in the sky.**  
  De re claim: "This very cloud could have been over the mountains right now."  
  Why it works:  
  - Clouds are vague, ephemeral entities without clear identity conditions.  
  - They are composed of water droplets that are constantly changing.  
  - It is plausible that there could be two clouds in a nearby world, one over the mountains and one over the valley, and both are equally good candidates for being "this cloud" if it had drifted differently.  
  - There is no obvious essential property (like origin) for a cloud.  
  - The example is not overused and avoids the typical essentialist objections that come with artifacts or organisms.

  In the scenario:  
  - Actual world: A particular cloud, C, is over the valley.  
  - Possible world w: There are two clouds, C1 over the mountains and C2 over the valley. Both are formed from the same initial conditions as C in the actual world, but due to a slight difference in wind, they split into two. Which one is C?  
  - The claim: "C could have been over the mountains" seems true. But in w, if we require transworld identity, we must choose one of C1 or C2 to be C. But there is no fact of the matter. This is the underdetermination.

  **Addressing Misconceptions**

  The students will form misconceptions in the order of the presentation. We must head them off at the right moment.

  1. **Misconception: "There is no transworld identity" is counterpart theory.**  
     When: When we first present the problem of underdetermination, a student might say, "So there is no transworld identity, and we should use counterpart theory."  
     Why it's wrong: CT is not simply the denial of TI; it is a positive theory that replaces cross-world identity with a counterpart relation. Also, one could deny transworld identity without adopting CT (e.g., by being a modal realist but denying that individuals exist in more than one world).  
     Heading off: When introducing the problem, make clear that the underdetermination does not force us to abandon TI. We might instead adopt a haecceity or essentialism. But then we can argue that these are problematic (haecceities are mysterious, essentialism doesn't always give an answer). Then introduce CT as an alternative.

  2. **Misconception: The counterpart relation is just identity in disguise.**  
     When: When explaining CT, a student might think that the counterpart relation is a way of saying "same individual" without calling it identity.  
     Why it's wrong: In CT, the counterpart relation is based on similarity, not identity. An individual in another world is not the same individual, but it is similar enough to count as representing the actual individual in that world.  
     Heading off: Emphasize that in CT, no individual exists in more than one world. The counterpart relation is a relation between distinct individuals from different worlds. Use the cloud example: In w, C1 is a counterpart of C, but it is not identical to C. They are different clouds.

  3. **Misconception: CT makes de re modal claims about me false, or merely about someone else.**  
     When: When discussing the implications of CT, a student might worry that if a counterpart of me is in pain, then it is not me in pain, so "I could be in pain" would be false.  
     Why it's a misconception: CT does not say that de re modal claims are false; it reinterprets them. "I could be in pain" is true iff there is a world where a counterpart of me is in pain. But note: the student might press this as an objection (see below).  
     Heading off: Explicitly show how CT provides truth conditions for de re modal claims. Also, note that this is a live objection: some philosophers (like Kripke) argue that CT does not capture what we mean by de re modality. We should present this as a point of debate.

  4. **Misconception: Defending TI requires an essence or haecceity.**  
     When: When discussing the problem of underdetermination, students might think that without an essence, TI is impossible.  
     Why it's a misconception: One might defend TI without essences or haecceities by being a haecceitist without qualitative essences, or by having a different account of identity over worlds (e.g., spatiotemporal continuity? but that doesn't work across worlds).  
     Heading off: Point out that TI is the default in the standard possible-worlds framework. We don't need an essence to have transworld identity; we might take it as primitive. But then the underdetermination problem remains: how do we decide? This leads to the idea that without a criterion, the truth of modal claims becomes indeterminate. That is a motivation for CT.

  5. **Misconception: The dispute is a notational variant.**  
     When: After presenting both views, students might think that CT is just a different way of saying the same thing.  
     Why it's a misconception: The two theories have different implications for the same modal claims. In the cloud example:  
     - TI (with no clear criterion) might lead to indeterminacy: we cannot say whether the cloud is C1 or C2. Then the claim "C could have been over the mountains" might be neither true nor false.  
     - CT: It might be that both C1 and C2 are counterparts of C. Then the claim is true because at least one counterpart (C1) is over the mountains.  
     So the truth conditions differ.  
     Heading off: Present this as a live issue. Some philosophers (e.g., Lewis) argue that CT captures our modal talk, while others (e.g., Kripke) argue that it does not.

  **Live objections vs. misconceptions:**  
  - The claim that CT does not capture the literal truth of de re modal claims (e.g., "I could have been in pain") is a live objection.  
  - The idea that the dispute is a notational variant is a misconception because the two views assign different truth conditions in some cases (like the cloud).  
  - The worry that CT makes de re claims about me false is a misconception because CT reinterprets them, but it can be pressed as an objection about whether the reinterpretation is adequate.

  **Building to the Sharp Question**

  The session should end with the students grappling with two key questions about counterpart theory:

  1. Is CT offered as a translation of ordinary modal discourse (so that it preserves the truth conditions we already accept) or as a revision (admitting that it changes what we mean)?  
  2. Is the counterpart relation a primitive of the theory, or is it defined in terms of similarity?  

  These questions should surface after the students have seen the cloud example and the underdetermination problem. We then present CT as a solution. But then we ask: how does CT avoid the underdetermination? By using a similarity relation. But:

  - If the counterpart relation is defined by similarity, then we must specify which similarities count. This is context-dependent and vague.  
  - If it is primitive, then we have introduced a new primitive, which might be as mysterious as haecceities.

  Moreover, the first question is crucial: is CT trying to capture our ordinary modal talk, or is it replacing it? Lewis claims it captures it, but Kripke objects that it does not.

  **Sequence for the End:**  
  - After presenting CT, ask: "Is counterpart theory giving us a way to understand what we already mean by de re modal claims, or is it changing the subject?"  
  - Then, ask: "What is the counterpart relation? Is it defined by similarity, or is it a primitive?"  
  - Point out: If defined by similarity, then the theory might be too flexible (we can choose which similarities matter) and might lead to vagueness. If primitive, then we have a new primitive relation.  
  - By the end, the students should be able to see that the choice between TI and CT is not arbitrary: if we are realists about possible worlds and we face underdetermination, then we must either:  
     (a) Bite the bullet and accept indeterminacy in de re modal claims (for TI without a clear criterion).  
     (b) Accept a primitive haecceity.  
     (c) Adopt CT and face the questions about the counterpart relation and whether it captures our modal discourse.

  **Final Question to Check Understanding**

  At the end, ask:  
  **"In the cloud example, if we adopt counterpart theory, what would make it true that the cloud could have been over the mountains? And how would that differ from the transworld identity view in a scenario where there are two equally good candidate clouds?"**  

  This tests whether they see:  
  - In CT, the existence of at least one counterpart in the mountains makes the claim true.  
  - In TI, if we cannot decide which cloud is the same cloud, then the claim might be indeterminate.  

  **What to Leave Out**  
  Explicitly say:  
  "We are leaving out more advanced topics such as:  
  - The formal semantics of modal logic under CT (with counterpart-theoretic models).  
  - The debate on whether worlds are concrete or abstract.  
  - The details of Lewis's modal realism.  
  - The full response of essentialism to the problem (e.g., Kripke's essential properties)."

  **Summary of Session Plan**

  1. **Start with a de re modal claim** (cloud could have been elsewhere) that students accept.  
  2. **Review possible-worlds semantics**: To evaluate the claim, we need a world where the cloud is elsewhere. But then we must identify the cloud in that world.  
  3. **Present the cloud example with underdetermination**: Two candidate clouds in the other world.  
  4. **Transworld identity view**: We must choose one, but there is no fact of the matter. This leads to a problem for TI.  
  5. **Counterpart theory as a solution**: Introduce CT as replacing identity with a counterpart relation. In w, both candidate clouds might be counterparts. Then the claim is true.  
  6. **Address misconceptions** as they arise.  
  7. **Build to the key questions**:  
     - Is CT a translation or revision?  
     - Is the counterpart relation defined or primitive?  
  8. **End with the final question** about the cloud example.

  This structure forces the choice by showing that the standard framework leads to underdetermination, and then CT is presented as a way out, but with its own challenges.
answer: |-
  ### Structured Explanation Plan for the Dispute Between Counterpart Theory and Transworld Identity

  The goal is to make the choice between counterpart theory (CT) and transworld identity (TI) feel forced, not arbitrary. The sequence must build from uncontroversial foundations to the unavoidable question of cross-world identification. Below, I outline the order of introduction, the rationale for each step, the chosen example, misconceptions to address, the culminating questions, and the final assessment.

  ---

  #### **Order of Introduction: Why the Question is Unavoidable**
  1. **Start with a Non-Modal Baseline (5 minutes)**  
     - **What to Introduce**: Begin with a concrete, actual-world individual and a non-modal property. Use a simple object like a specific **clay statue** (e.g., "Giselle," shaped like a goddess, created by a student artist). Establish that Giselle is fragile and made from clay.  
     - **Why This First?** Students need a shared reference point. This leverages their knowledge of rigid designation: "Giselle" rigidly designates this statue. Without modal claims yet, there are no worlds to "cross," so identity is unproblematic.  
     - **Dependency**: Nothing precedes this—it sets the stage. Rigid designation ensures the actual individual is fixed.

  2. **Introduce a De Re Modal Claim (10 minutes)**  
     - **What to Introduce**: Pose a de re possibility: "Giselle could have been more durable (e.g., made of bronze)." Ensure this claim feels intuitive—statues can be made from different materials.  
     - **Why This Next?** Students already have the possible-worlds apparatus, so they know this claim requires a world where Giselle exists and is durable. Rigid designation implies that "Giselle" must refer to the same statue across worlds.  
     - **Dependency**: Step 1 must be in place. Rigid designation forces us to ask: "Which individual in the bronze-world is Giselle?" Without a rigid designator, the question is incoherent.

  3. **Expose the Commitment to Transworld Identity (10 minutes)**  
     - **What to Introduce**: Recall the standard Kripkean semantics: "Possibly P(Giselle)" is true iff there is a world where the individual rigidly designated as Giselle in the actual world has P in that world.  
     - **Why This Now?** This step makes the TI commitment explicit and unavoidable. The semantics **requires** that the same individual exists in multiple worlds. Without TI, the truth-condition for de re modality collapses.  
     - **Dependency**: Step 2 must be in place. The de re claim creates pressure to identify Giselle in another world. The rigid designation apparatus (from prior knowledge) makes this identification non-negotiable.

  4. **Introduce Underdetermination via an Example (15 minutes)**  
     - **What to Introduce**: Present a world where no clear candidate for Giselle exists. Use the **clay statue example** (detailed below).  
     - **Why This Last?** Underdetermination reveals the flaw in TI. If students accept the de re claim but cannot identify Giselle in the target world, TI’s requirement for a unique, identical individual becomes problematic.  
     - **Dependency**: Steps 1–3 must be in place. The students must see that TI is built into the semantics they accept, yet the example shows it cannot be fulfilled—forcing a dilemma: abandon de re truth or abandon TI.

  **Why the Question is Unavoidable**: The rigid designation apparatus and standard possible-worlds semantics commit us to TI. But when cross-world identification is underdetermined (as in the example), TI lacks the resources to resolve it without ad hoc machinery. This forces the choice: reject TI (opening the door for CT) or double down on TI with controversial additions (e.g., essences).

  ---

  #### **The Chosen Example: A Clay Statue**
  - **Why Not Humphrey?** The Humphrey example (could have won the election) is worn and often resolved by essentialism (e.g., biological origins). It lacks genuine underdetermination because students might default to origin-based identity.  
  - **Proposed Example**:  
    - **Actual World**: Giselle is a clay statue, created by artist Ana on Monday. It has a distinctive goddess shape.  
    - **Target World (w)**: On Monday, Ana creates two statues:  
      1. **Statue A**: Same shape as Giselle, made of clay (like actual Giselle).  
      2. **Statue B**: Same shape, but made of bronze (fulfilling the de re claim).  
      Both are created from the same initial clay lump, using the same mold, in the same studio.  
    - **De Re Claim**: "Giselle could have been made of bronze." Students won’t dispute this—artworks can be materially different.  
  - **Why This Example Works**:  
    - **Underdetermined Identity**: No clear criterion distinguishes which statue in w is "Giselle." Shape, origin, and creator are identical; material differs.  
    - **No Essence/Haecceity**: Artworks lack a consensus essence (e.g., is it the shape, the matter, or the creation event?). No haecceity is assumed.  
    - **No Accidental Agreement**: TI might pick Statue B (bronze) to make the de re claim true, but CT could count both as counterparts. The two theories diverge: TI requires a unique identical individual, while CT allows multiple counterparts.  
    - **Distance from Textbooks**: Unlike ships of Theseus or Humphrey, this avoids preconceived verdicts. It emphasizes the problem of "which one?" without an easy answer.

  ---

  #### **Misconceptions and Live Objections**
  Students will form misconceptions in the sequence below. Address them **proactively** at the points indicated.  
  1. **Misconception: "No transworld identity" = Counterpart theory**  
     - **When Formed**: During Step 3 (exposing TI commitment).  
     - **Why Misconception**: Denying TI doesn’t entail CT; one could be a modal skeptic or adopt world-bound individuals without counterpart relations.  
     - **Heads-Up at**: End of Step 3. Clarify: "Rejecting TI opens options; CT is one specific alternative."  

  2. **Misconception: Counterpart relation is identity in disguise**  
     - **When Formed**: When CT is introduced as a solution to underdetermination.  
     - **Why Misconception**: Students reduce CT to a "similarity-based identity," missing that CT rejects identity across worlds entirely.  
     - **Heads-Up at**: CT introduction. Emphasize: "In CT, Giselle exists only in the actual world. w has distinct individuals that represent her via similarity."  

  3. **Misconception: CT makes de re claims false (or about someone else)**  
     - **When Formed**: After seeing CT’s truth-conditions (e.g., "Giselle is durable" is true iff a counterpart is).  
     - **Live Objection**: Students are entitled to press this! It’s a key criticism (Kripke, "Humphrey objection").  
     - **Heads-Up at**: CT explanation. Distinguish: "This isn’t a misconception—it’s a serious challenge. Does CT capture what we mean by 'Giselle could have been durable'?"  

  4. **Misconception: TI requires essence/haecceity**  
     - **When Formed**: During underdetermination (Step 4).  
     - **Why Misconception**: TI can be primitive (e.g., haecceitism without qualitative essences) or use non-essentialist criteria (e.g., spatiotemporal paths).  
     - **Heads-Up at**: Step 4. Clarify: "TI doesn’t force essentialism; it might rely on brute identity. But then underdetermination remains a problem."  

  5. **Misconception: The dispute is notational**  
     - **When Formed**: After both views are presented.  
     - **Why Misconception**: The theories assign different truth-values in borderline cases (e.g., if both statues in w are durable, TI may say the claim is indeterminate, while CT says true).  
     - **Heads-Up at**: Comparison stage. Contrast truth-conditions using the statue example.

  ---

  #### **Culminating Questions: Translation vs. Revision, Primitive vs. Defined**
  - **When to Surface**: After presenting CT’s solution to underdetermination.  
  - **Why Here?** Students now see CT as an alternative but need to grapple with its stakes.  
  - **What Students Should Realize by the End**:  
    - **Translation vs. Revision**: Is CT a faithful reinterpretation of de re discourse (preserving truth-conditions) or a revision (changing what claims mean)? Initially, they may think it’s translation; they should leave seeing it as revisionary (e.g., "Giselle is durable" becomes about counterparts, not Giselle).  
    - **Primitive vs. Defined**: Is the counterpart relation a primitive (sui generis) or defined by similarity? They should see a tension: if defined, CT risks arbitrariness (which similarities matter?); if primitive, it’s as mysterious as haecceities.  
  - **End with This**: These questions highlight the meta-philosophical choice—Is CT solving the problem or changing the subject?

  ---

  #### **Final Assessment Question**
  - **Question to Pose**: "In the statue example, if we adopt counterpart theory, does the claim 'Giselle could have been made of bronze' require that there is exactly one statue in the target world that is her counterpart? Why or why not? How would transworld identity handle it differently?"  
    - **Tests Understanding**:  
      - Correct CT answer: No, multiple counterparts are allowed; the claim is true if any counterpart is bronze.  
      - TI answer: It requires exactly one identical statue (Statue B), but underdetermination makes this contentious.  
    - **Why It Works**: It requires applying the core divergence (uniqueness vs. multiplicity) to a concrete case, moving beyond memorized definitions.

  ---

  #### **What to Explicitly Leave Out**
  - **Say This**: "We’re leaving out three advanced topics:  
    1. **The formal semantics of quantified modal logic** (e.g., variable domains, BF/CBF debates).  
    2. **Lewis’s modal realism** (concrete worlds)—focus only on CT as a semantic tool.  
    3. **Hybrid theories** (e.g., weak vs. strong counterpart relations).  
    Why? These add complexity without clarifying the forced choice. Our goal is the conceptual dilemma, not technicalities."  

  This plan ensures the dispute arises naturally from commitments students already hold, uses a tailored example to prevent default reasoning, and ends with open questions that highlight the philosophical stakes. The session emphasizes why the problem can’t be ignored—not just what the solutions are.
