  I know there is a large body of argument aimed at people who say what I just said. What I want from you is a map of how exposed my position actually is.

  - Which arguments and cases are genuinely load-bearing against me, and which only look decisive because they assume a self-locating principle at the outset that I am entitled to reject?
  - Take two variants seriously. First, the coin is tossed on Monday night, after the first awakening, and decides whether there is a second awakening on Tuesday. Second, the lopsided variant: heads gives one awakening, tails gives a hundred. What is my position forced to say in each, are those answers tolerable, and is the difference between the variants principled or ad hoc?
  - What does my position cost me formally? I suspect I owe an account of how probabilities decompose across the days, or of why some self-locating propositions cannot be conditionalized on in the ordinary way. Tell me exactly what I lose and whether any of it is a real loss.
  - Where do my view and the thirder's actually come apart in a way that could be checked, not just in the number they assign here? Include what my view implies about how I should bet if I am offered wagers on each awakening.
  - What would a committed defender of my view concede counts against it, as opposed to dismissing? Where would that defender be right to dismiss?
  - My general principle has consequences outside the puzzle. Spell out the cosmological one: a theory on which there are vastly more observers than its rival should get no boost in credence from that fact. If that consequence is unacceptable, say so and say why; if it is acceptable, say what makes it acceptable when it feels so wrong.

  I cannot look anything up, so give me no citations, reading lists, or names to chase. Give me the arguments themselves, and describe any case you use in enough detail that it stands on its own.

  Deliver a single JSON object with these fields.

  position_as_understood: a short restatement of my position in your own words, flagging anywhere you had to fill in what I left vague.

  defeaters: an array of objects, ordered by how much they should actually move me, which is not the same as how hard they land if they land. Each object has:
    defeater: the argument, case, or result, stated in enough detail to be evaluated on its own.
    kind: one of formal_result, intuition_pump, variant_case, principle_collision, practical_or_betting.
    targets: which part of my position it hits, the credence in this puzzle or the general self-locating principle or both.
    severity: one of fatal, serious, awkward, cosmetic, meaning how hard it lands if it does land.
    defender_concession: a string beginning with concedes:, concedes with qualification:, or rejects:, followed by a sentence saying exactly what is conceded or rejected.
    what_would_settle_it: the proof, observation, or intuition that would decide whether this defeater lands.

  variants: an array, one object per case you use, mine and any you add, each with:
    case: the case, specified precisely enough to be answered without further information.
    halfer_answer: what my position is forced to say.
    thirder_answer: what the rival says.
    verdict: whether the case tells against my position, against the rival, or neither, with a sentence of justification.

  insulation: an object with:
    is_the_position_well_insulated: one of yes, partly, no.
    how: if yes or partly, the specific moves that insulate it, such as a distinction between chance and credence, a refusal to count self-location as evidence, or a restriction on what may be conditionalized on.
    is_that_a_problem: whether the insulation is a vice or a legitimate consequence of the view, and why.
    what_would_change_my_mind: the one or two things that, if true, should move me off 1/2.

  bottom_line: at most 150 words of plain prose giving your verdict on how exposed the position is, written to me rather than about me.

  Keep every field tight. I would rather have seven well-chosen defeaters than twenty padded ones.
