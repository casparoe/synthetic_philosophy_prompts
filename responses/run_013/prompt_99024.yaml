prompt: |-
  I am a software engineer with no formal training in philosophy, and I am trying to think through a problem that has become both personal and professional. I would rather you reason the thing through with me than hand me a summary of the usual positions.

  The personal side. Three weeks ago my uncle collapsed at home and has been in an ICU ever since. He is on a ventilator, and he is also on an external circuit: a machine outside his body oxygenates his blood and drives his circulation, so his own heart is not doing the pumping. Neurological exams and an imaging study show no blood flow to the brainstem and no brainstem reflexes; the neurologist says he will never breathe on his own or regain consciousness. A more sensitive scan, however, picked up intermittent electrical activity in a small patch of cortex. The neurologist says that activity is not enough to support any experience, but it is not zero. On the strength of the brainstem findings, he has certified my uncle dead. The hospital has recorded a time of death, and because my uncle was a registered organ donor, the procurement team has been notified and is preparing to retrieve his organs while the machine keeps them perfused. My aunt is adamant that he is alive: his chest is warm, the monitor still shows a blood pressure, and she believes that switching the machine off would be killing him rather than letting him go. A cousin who works as an ICU nurse in a neighboring state says her hospital would not treat this as death at all — there, he would count as dead only after the machine was withdrawn and his circulation stopped by itself, and only after some waiting period; and she adds that even then there is a live dispute about how long the wait should be. The family cannot agree, and the hospital is pressing us to consent to the withdrawal-and-retrieval sequence within the day.

  The professional side is why I cannot stop turning this over. I write software for hospitals, and a product team has asked me to implement a single boolean, "patient is deceased," that downstream systems will read. The spec tells me to defer to "the clinical standard." It has become obvious to me that there is no single standard — the answer seems to depend on which of several different thresholds you pick, and those thresholds can disagree in exactly the kind of case my uncle is in. I want to know whether there is a principled way to choose among them, or whether this is ultimately a convention we impose and could impose differently.

  What I would like from you: tell me which threshold you think should govern and why; how my uncle's case comes out under each of the competing thresholds; the strongest argument against your preferred view; and what, concretely, I should say to my aunt and to the product team.

  Then finish with a structured summary as a JSON object with exactly these fields:

  - "governing_criterion": string — the threshold you think should decide, with a one-sentence justification.
  - "case_outcomes": array of objects, each with "criterion" (string), "outcome" (one of "alive", "dead", "indeterminate"), and "rationale" (string) — one entry for each threshold you distinguish, and there should be at least three.
  - "recommended_verdict": one of "alive", "dead", "indeterminate" — your bottom line for my uncle.
  - "strongest_objection": string — the best case against your verdict, in two or three sentences.
  - "advice_to_aunt": string — a short, honest explanation I could give her.
  - "product_advice": string — what the boolean should be replaced with, if anything.
  - "confidence": one of "low", "medium", "high".
reasoning: |-
  Okay, the user presents a deeply personal and professional dilemma. On the personal front, their uncle is in a critical medical state with conflicting interpretations of whether he's alive or dead. Professionally, they're grappling with how to implement a "patient is deceased" boolean in hospital software when there's no universal clinical standard.

  First, I need to unpack the medical details. The uncle has no brainstem function - that's confirmed by neurological exams and imaging showing no blood flow to the brainstem. But there's this tiny patch of cortical activity showing intermittent electrical signals. The neurologist says it's not enough for any conscious experience. Under brain death criteria, he's been declared dead. However, the family sees his warm chest and blood pressure on monitors, making it feel like he's still alive. The cousin's perspective adds another layer - some hospitals use circulatory death criteria instead.

  For the professional side, the core issue is the lack of a single definition. Different hospitals use different standards: brain death vs. circulatory death, with variations in how they're applied. The user's software needs one boolean value, but reality has multiple thresholds that can conflict in edge cases like this.

  I should consider the major criteria:
  - Whole brain death (requires irreversible loss of all brain function including brainstem)
  - Brainstem death (focuses on brainstem alone)
  - Circulatory-respiratory death (requires irreversible cessation of heartbeat and breathing)

  The strongest position seems to be whole brain death because it captures what makes us human - the integrated functioning of the entire brain. Without that, there's no capacity for consciousness or bodily integration. The cortical activity mentioned is minimal and sporadic - not meaningful neural function. 

  But I must also present counterarguments. The warm body appearance makes it feel like life persists. Some philosophers argue that any cellular activity constitutes life. And legally, jurisdictions differ - Japan requires circulatory cessation while the UK accepts brainstem death.

  For the family advice, I need to acknowledge their perception while explaining why medical professionals see this differently. Focus on what made their uncle who he was - now irreversibly gone. For the software team, I should suggest replacing the boolean with multiple fields reflecting specific criteria since reality is more complex than true/false.

  This case highlights how medicine, ethics and law intersect messily. My confidence is medium because while whole brain death seems most defensible, reasonable people disagree fundamentally about when life ends.
answer: |-
  Here's a reasoned analysis of your situation, grounded in both the medical reality and philosophical implications. My conclusion is that **whole-brain death** is the most defensible threshold, though it faces significant challenges in cases like your uncle's.

  ### Analysis & Recommendations
  1.  **Governing Criterion**: Whole-brain death (irreversible cessation of all functions of the entire brain, including the brainstem and cortex). *Justification*: This aligns with the biological definition of death as the permanent loss of the integrated functioning of the organism as a whole, which the brain uniquely coordinates.

  2.  **Case Outcomes Under Competing Thresholds**:
      *   `{ "criterion": "Whole-brain death", "outcome": "dead", "rationale": "No blood flow to the brainstem (essential for consciousness, breathing, and integration) + minimal cortical activity is insufficient for integrated function or experience; irreversible loss of whole-brain function." }`
      *   `{ "criterion": "Brainstem death", "outcome": "dead", "rationale": "Brainstem is responsible for core vital functions (breathing, consciousness regulation, CVS control); absence of brainstem reflexes and blood flow confirms its irreversible failure, making consciousness impossible regardless of cortical flickers." }`
      *   `{ "criterion": "Higher-brain death (consciousness-based)", "outcome": "dead", "rationale": "Focuses on capacity for consciousness/experience; absent brainstem function precludes consciousness, and isolated cortical activity is clinically insignificant flickering, not supporting experience." }`
      *   `{ "criterion": "Circulatory-respiratory death (irreversible cessation)", "outcome": "alive", "rationale": "The ECMO circuit maintains circulation and oxygenation externally; death is only declared after withdrawal of support and irreversible cessation of circulation/heart function (often after a 5-minute wait period)." }`
      *   `{ "criterion": "Persistent cellular activity", "outcome": "indeterminate", "rationale": "Some cells/tissues (including neurons) may show activity, but this doesn't constitute life at the organismal level; the persistence of isolated activity creates ambiguity for this criterion." }`

  3.  **Recommended Verdict**: dead (under whole-brain death, brainstem death, and higher-brain criteria).

  4.  **Strongest Objection**: The presence of *any* cortical electrical activity, however minimal, combined with a warm body and circulating blood (even artificially maintained), creates a powerful *appearance* of life that contradicts the abstract neurological definition. This fuels the intuition that life persists at a biological level, and switching off support feels like active killing rather than allowing a natural process. Furthermore, the lack of universal legal/clinical adoption of brain death globally (e.g., Japan's reliance on circulatory criteria) demonstrates it is not a self-evident biological truth but a socially constructed threshold.

  5.  **Advice to Aunt**:
      "Aunt, I know you see his warm chest and the monitor, and it feels like he's still here. The machine is keeping his body working artificially. But the doctors have confirmed the part of his brain that makes him *him* – that controls breathing, consciousness, and keeps the whole body working together – is completely and irreversibly gone. The tiny bit of electrical activity they found isn't enough for him to be aware or ever wake up. Medically and legally, they consider his death to have already happened because that essential core function is lost forever. Turning off the machine isn't killing him; it's stopping artificial support after he has already died. His body just can't show it yet because of the machine. This respects his wishes as a donor."

  6.  **Product Advice**: Replace the single boolean `patient_is_deceased` with **structured data reflecting the criteria used**. For example:
      *   `death_determination_method` (enum: e.g., "Neurologic/Brain Death", "Circulatory-Respiratory", "Cardiac Arrest", "Other")
      *   `brain_death_exam_date_time` (nullable datetime)
      *   `circulatory_death_time` (nullable datetime - recorded *after* withdrawal and cessation)
      *   `apnea_test_performed` (boolean)
      *   `confirmatory_test_type` (enum: e.g., "Angiography", "EEG", "TCD", "SPECT", "None")
      Downstream systems can interpret this based on their own logic/requirements. This acknowledges the reality of multiple standards.

  7.  **Confidence**: Medium. While whole-brain death is the most coherent biological and philosophical standard, the visceral reality of cases like your uncle's and the lack of global consensus highlight genuine ambiguity and the role of convention.

