prompt: |-
  I'm setting the final for a 400-level course I run on complexity theory and epistemology, and I want one essay question that students can't answer by paraphrasing "P vs NP is about whether creativity can be automated." The crux I want them to hit is that complexity hardness is a claim about familys of instances in the limit, not about any particular instance — and that "no efficient algorithm exists" is not the same claim as "we can't prove that no efficient algorithm exists." Build the question around a thesis I'll state in the exam itself, roughly: "Finding a proof is only hard because we don't yet know how. If P = NP then discovery becomes routine; if P ≠ NP then there are truths no efficient reasoner could ever reach." They should have to say which parts of that are true, which are confused, and why. Two things I want them to have to notice on their own: (i) that for NP problems, deciding and searching are basically the same task up to polynomial factors, so the thesis can't cleanly separate "recognising" from "discovering"; (ii) that a polynomial algorithm with an astronomical constant or exponent would settle the math and change nothing about practice, so "tractable" doesn't follow from "in P". Give me the question (90 minutes, one page), a model answer around 700 words, and a marking scheme with five must-hit points totalling 20 marks and, for each, the one-line way students typically blow it. Start with the exam question itself, no preamble.
reasoning: |-
  We are creating an exam question for a 400-level complexity theory and epistemology course. The question should challenge students to critically analyze a given thesis and address two key insights: (i) the equivalence of deciding and searching for NP problems up to polynomial factors, and (ii) the distinction between theoretical tractability (being in P) and practical tractability.

  The thesis provided in the exam will be:
  "Finding a proof is only hard because we don't yet know how. If P = NP then discovery becomes routine; if P ≠ NP then there are truths no efficient reasoner could ever reach."

  The question should require students to:
  - Identify which parts of the thesis are true and which are confused.
  - Explain why, with attention to:
     (a) The nature of complexity hardness as a claim about families of instances in the limit, not individual instances.
     (b) The difference between "no efficient algorithm exists" and "we can't prove that no efficient algorithm exists."
     (c) The fact that for NP problems, deciding (recognizing a solution) and searching (discovering a solution) are polynomially equivalent.
     (d) The practical implications of a polynomial-time algorithm with a very high constant or exponent.

  We are to provide:
  1. The exam question (for a 90-minute exam, one page).
  2. A model answer of about 700 words.
  3. A marking scheme with five must-hit points (totalling 20 marks) and a typical one-line mistake for each.

  Let's design the question first.

  **Exam Question:**

  **Question 1 (20 marks):**

  Consider the following thesis:

  > "Finding a proof is only hard because we don't yet know how. If P = NP then discovery becomes routine; if P ≠ NP then there are truths no efficient reasoner could ever reach."

  Critically evaluate this thesis. In your response, address the following:

  a) Explain the distinction between the non-existence of an efficient algorithm for a problem and our inability to prove such non-existence. How does this relate to the thesis?

  b) Discuss the relationship between the task of deciding whether a solution exists (for an NP problem) and the task of finding a solution (if one exists). Why is this relevant to the thesis?

  c) Consider the implications of a polynomial-time algorithm that has an extremely large constant factor or exponent. How might this affect the practical interpretation of the thesis?

  d) Analyze the claim that if P ≠ NP, there are "truths no efficient reasoner could ever reach." Is this an accurate characterization? Why or why not?

  Your essay should clearly identify which parts of the thesis are well-founded and which are problematic, and why. (Limit: one page)

  ---

  **Model Answer (approx. 700 words):**

  The given thesis makes several claims about the relationship between computational complexity and the nature of discovery and truth. While it captures some intuitive ideas, it also contains significant confusions that arise from a misunderstanding of complexity theory.

  The thesis begins: "Finding a proof is only hard because we don't yet know how." This statement is ambiguous. On one hand, if we interpret it as saying that the difficulty of finding a proof is due to our current ignorance of efficient methods, then it is a truism. However, it might imply that there is always an efficient method waiting to be discovered. This is precisely what P vs NP asks: if P = NP, then yes, there is an efficient method (though we may not know it yet). But if P ≠ NP, then for certain problems (NP-complete ones) there is no efficient algorithm at all, regardless of our knowledge. The claim thus conflates our epistemic state with the inherent complexity of the problem. Moreover, the thesis fails to acknowledge that complexity theory deals with asymptotic behavior — the hardness of a problem is defined in the limit as instance sizes grow. A particular instance might be easy, but the problem as a whole is hard if there is no efficient algorithm that works for all sufficiently large instances.

  The thesis then states: "If P = NP then discovery becomes routine." This is partially correct but oversimplified. If P = NP, then for any problem in NP (which includes the task of finding a proof for a theorem in a given proof system), there would exist a polynomial-time algorithm to find a solution (e.g., a proof). However, the claim that discovery becomes "routine" is ambiguous. It could mean that discovery is efficient in theory, but note that a polynomial-time algorithm might have a prohibitively large constant or exponent. For example, an algorithm running in time \(O(n^{1000})\) would be polynomial but practically infeasible. Thus, the thesis overlooks the distinction between theoretical tractability (being in P) and practical feasibility. Additionally, the thesis fails to note that even if P = NP, we must still discover the algorithm — which might be non-trivial — and that the algorithm might be efficient only in the asymptotic sense, not for practical instance sizes.

  The third claim: "if P ≠ NP then there are truths no efficient reasoner could ever reach." This is a misinterpretation. First, we must clarify what is meant by "truths". If we consider the truth of a statement such as "this formula has a satisfying assignment", then if P ≠ NP, there is no efficient algorithm that can always correctly decide such statements. However, the thesis uses the phrase "could ever reach", which might be interpreted as saying that these truths are absolutely unknowable. But note: an inefficient reasoner (e.g., one that runs in exponential time) can still reach these truths. Moreover, even for a problem that is not in P, we might have efficient algorithms for instances of practical interest, or we might use heuristics. The claim is only about the worst-case complexity and asymptotic behavior. Thus, the thesis overstates the case by suggesting that P ≠ NP implies the existence of truths that are in principle unreachable by efficient reasoners. In fact, it only implies that no single efficient algorithm can solve all instances of the problem. Some instances might be easy, and an efficient reasoner might get many right, but there will be hard instances that it cannot solve within feasible time.

  Now, addressing the specific points:

  a) The non-existence of an efficient algorithm for a problem (say, because it is NP-hard and P≠NP) is a statement about the inherent computational difficulty. Our inability to prove such non-existence is an epistemic limitation. The thesis blurs this by implying that the difficulty of finding a proof is solely due to our current ignorance. However, if P≠NP, then for NP-complete problems, no efficient algorithm exists regardless of our knowledge.

  b) For problems in NP, the decision problem (does a solution exist?) and the search problem (find a solution) are polynomially equivalent. If you can decide you can find a solution by iterative queries (with polynomial overhead). Thus, the thesis cannot separate "recognizing" a proof (which is in NP) from "discovering" one — they are computationally similar. The thesis seems to assume that recognizing is easier than discovering, but in the NP context they are tied.

  c) A polynomial-time algorithm with a huge constant or exponent would settle P vs NP in the affirmative but would not make discovery "routine" in practice. For example, if the algorithm runs in time \(10^{100} n^{1000}\), it would be infeasible for any conceivable input. Thus, the thesis's claim about discovery becoming routine is only conditionally true and depends on the actual complexity of the algorithm.

  d) The claim that if P≠NP there are truths no efficient reasoner could ever reach is misleading. It suggests that there are specific truths that are unreachable, but in reality, the issue is about the worst-case performance. An efficient reasoner might solve many instances but will fail on some hard ones. Moreover, the same truth might be reached by an inefficient reasoner. The claim is also ambiguous about what an "efficient reasoner" is — if we consider non-uniform models (like circuits) then even if P≠NP, every individual instance has a polynomial-size circuit that solves it. But that circuit might be hard to find.

  In summary, the thesis captures the hope that P=NP would make discovery efficient and the dread that P≠NP would limit what efficient reasoners can do. However, it confuses epistemic and inherent complexity, ignores the asymptotic and worst-case nature of complexity classes, and overlooks the practical implications of polynomial-time with large constants. It also fails to recognize the equivalence of decision and search for NP problems.

  ---

  **Marking Scheme (20 marks total):**

  The five must-hit points, each worth 4 marks, and the typical one-line mistake:

  1. **Distinction between inherent complexity and epistemic state:**  
     The student must clearly explain that the non-existence of an efficient algorithm (if P≠NP) is a fact about the problem's inherent complexity, not about our current knowledge.  
     *Typical mistake:* Blurring the two by saying that if we don't know an algorithm, then the problem is hard.

  2. **Asymptotic and worst-case nature of complexity classes:**  
     The student must note that hardness is a property of the problem family in the limit (as instance sizes grow) and in the worst-case, not that every instance is hard.  
     *Typical mistake:* Treating hardness as a property of every instance.

  3. **Equivalence of decision and search for NP:**  
     The student must explain that for NP problems, the decision problem (does a solution exist?) and the search problem (find a solution) are polynomially equivalent. Thus, the thesis cannot separate recognizing a solution (which is in NP) from discovering one.  
     *Typical mistake:* Assuming that recognizing is easier than discovering.

  4. **Practical tractability vs. being in P:**  
     The student must note that a polynomial-time algorithm with a very high constant or exponent may be practically infeasible, so P=NP does not automatically make discovery "routine" in practice.  
     *Typical mistake:* Equating "in P" with "practically tractable".

  5. **Interpretation of "truths no efficient reasoner could ever reach":**  
     The student must argue that if P≠NP, it does not mean that there are specific truths that are absolutely unreachable, but rather that no efficient algorithm can solve all instances. Inefficient methods can still solve individual instances, and even efficient ones might solve many.  
     *Typical mistake:* Taking the claim to mean that there are truths that are absolutely unknowable by any means.

  This marking scheme covers the required insights and the common pitfalls. The student must address each of these to score well.
answer: |-
  **Exam Question**  

  **Question 1 (20 marks):**  

  Critically evaluate the following thesis:  
  > "Finding a proof is only hard because we don't yet know how. If P = NP then discovery becomes routine; if P ≠ NP then there are truths no efficient reasoner could ever reach."  

  In your response:  
  - Identify which parts of the thesis are well-founded and which are confused.  
  - Explain the distinction between (i) the non-existence of an efficient algorithm and our inability to *prove* this non-existence, and (ii) complexity-theoretic hardness as a claim about *families of instances asymptotically*, not individual instances.  
  - Address how the relationship between *deciding* (e.g., "Does a proof exist?") and *searching* (e.g., "Find a proof") for NP problems challenges the thesis.  
  - Discuss why a polynomial-time algorithm with an astronomical constant/exponent might render the thesis practically irrelevant even if P = NP.  
  - Analyze whether P ≠ NP implies "truths no efficient reasoner could ever reach."  

  *(Limit: One page. Time: 90 minutes.)*  

  ---

  **Model Answer (∼700 words):**  

  The thesis conflates epistemic limitations with inherent computational hardness, misinterprets asymptotic complexity, and overlooks practical feasibility. While it captures *intuitions* about P vs NP, key parts are confused or misleading.  

  **1. "Finding a proof is only hard because we don’t yet know how": Partially confused.**  
  This conflates two issues: (a) our *current ignorance* of algorithms ("don’t yet know how") and (b) *inherent hardness* ("no efficient algorithm exists"). Complexity theory asserts that hardness (e.g., NP-hardness) is an *asymptotic property* of problem *families*: it describes how solution time *scales* for worst-case instances as input size grows, not that every instance is hard. For example, SAT has hard instances in the limit but easy cases (e.g., small formulas). Crucially, "no efficient algorithm exists" (if P ≠ NP) is a claim about inherent complexity, independent of human knowledge. By contrast, "we can’t prove it" reflects *metamathematical limits* (e.g., unprovability of P ≠ NP in certain axiom systems). The thesis wrongly implies hardness is *always* due to ignorance—but if P ≠ NP, no efficient SAT solver exists *regardless* of our efforts.  

  **2. "If P = NP then discovery becomes routine": Oversimplified and potentially false.**  
  This is theoretically plausible but practically dubious. P = NP would mean every NP problem (e.g., proof discovery) has a polynomial-time *algorithm*. However, "routine" suggests practical tractability, but polynomial time ≠ feasible: an algorithm running in \(O(n^{10,000})\) or \(O(10^{100} \cdot n^2)\) is "efficient" in complexity theory but useless in practice. Thus, discovery might remain intractable despite P = NP. Further, the thesis ignores that "discovery" here is *search* (e.g., finding a proof), but for NP problems, search and decision (e.g., "exists a proof?") are *polynomially equivalent*. If you can decide existence in polynomial time, you can find a solution by iterative queries (with polynomial overhead). Hence, the thesis cannot separate "recognizing" proofs (easy if P = NP) from "discovering" them—both become "routine" *in theory*, but neither may be *in practice*.  

  **3. "If P ≠ NP then there are truths no efficient reasoner could ever reach": Misleading.**  
  This misrepresents P ≠ NP. If P ≠ NP, NP-complete problems lack polynomial-time algorithms *in the worst case*. But this does *not* imply specific "truths" (e.g., "Formula φ is satisfiable") are *fundamentally unreachable*. Rather:  
  - An "efficient reasoner" (polynomial-time) would fail on *some hard instances* of NP problems, but could solve others (e.g., easy SAT cases).  
  - *Inefficient* reasoners (exponential-time) can solve *any* instance, so no "truth" is universally unreachable—just not efficiently for all inputs.  
  - Worse-case hardness ≠ average-case hardness: many NP-hard problems (e.g., factoring) have efficient *heuristics* for real-world instances.  
  The claim confuses *problem-wide hardness* ("no fast algorithm for all instances") with *instance-specific unknowability*. Truths about *individual* instances remain provable (e.g., by brute force); the limitation is *scalable efficiency*, not absolute unreachability.  

  **Summary of key flaws:**  
  - **Epistemic vs. inherent confusion:** The thesis attributes hardness solely to ignorance ("don’t yet know how"), ignoring that P ≠ NP would imply inherent barriers.  
  - **Asymptotic oversight:** Hardness is a limit property of infinite families (e.g., SAT for arbitrarily large formulas), not about "this proof" or "this instance."  
  - **Decision-search equivalence:** For NP, efficient decision enables efficient search (and vice versa), so "discovery" isn’t isolated from "recognition."  
  - **Practical disconnect:** Polynomial time with large constants/exponents negates "routine" discovery even if P = NP.  
  - **Overstated implications:** P ≠ NP limits *scalable* reasoning but does not create "unreachable" truths—inefficient methods succeed.  

  The thesis is insightful in linking P = NP to automated discovery and P ≠ NP to limitations, but it oversimplifies complexity theory’s nuances. Correctly interpreted, P vs NP is about asymptotic worst-case efficiency, not the abolishment or inevitability of human struggle in discovery.  

  ---  

  **Marking Scheme (20 marks total):**  

  Candidates must hit **five key points** (4 marks each). Deduct marks for omissions/missteps. Typical one-line failures in parentheses.  

  1. **Distinguishes inherent hardness from epistemic limits:**  
     - Must state that "no efficient algorithm exists" (if P ≠ NP) is an inherent claim, while "we don’t yet know how" is epistemic—and that the thesis conflates them.  
     *(Typical failure: Claims hardness is always due to ignorance, ignoring inherent barriers.)*  

  2. **Identifies complexity hardness as asymptotic/worst-case for families:**  
     - Must explain that hardness (e.g., NP-hardness) concerns worst-case scalability as instance size → ∞, not individual instances.  
     *(Typical failure: Treats hardness as a property of every instance, e.g., "all SAT instances are hard.")*  

  3. **Explains decision-search equivalence for NP:**  
     - Must note that for NP problems, polynomial-time decision (e.g., "proof exists?") implies polynomial-time search (e.g., "find proof") via self-reducibility, so the thesis cannot split "discovery" from "recognition."  
     *(Typical failure: Assumes recognizing a solution is easier than finding one for NP problems.)*  

  4. **Notes that P = NP does not imply practical tractability:**  
     - Must discuss how polynomial-time algorithms with large constants/exponents may be practically infeasible, undermining "routine" discovery.  
     *(Typical failure: Equates "in P" with "practically tractable.")*  

  5. **Rejects absolute unreachability under P ≠ NP:**  
     - Must argue that P ≠ NP implies no *scalably efficient* reasoner solves all instances, but inefficient methods (or efficient ones for easy cases) can reach any "truth."  
     *(Typical failure: Asserts P ≠ NP means specific truths are fundamentally unknowable.)*  

  ---  
  **END**
