prompt: |-
  I'm a fourth-year PhD student in constitutional theory, and since last spring I've been on placement with the research office of a state legislature — I write the constitutional-risk notes that go to committee chairs before a bill gets scheduled. Four or five a week, an hour or two each, and I'm the only person in the building with any con law training. The chair reads my note and decides; but if I flag a bill and it turns out to be nothing, I've cost the sponsor a session, and if I clear something that later draws a declaration, the office looks like it was asleep at the switch. My superviser keeps telling me I write law-review paragraphs when what she needs is a procedure — an ordered set of questions, with places where it stops and hands the decision back to a human. Take the role of someone who has actually done both constitutional litigation and legislative drafting, and start with a few lines on where you think the real difficulty in this translation is before you write the procedure itself.

  Two things about our setting you should take as given rather than as loose analogies to federal doctrine. First, our bill of rights is enforceable but our review clause is weak-form: if a court finds a statute 'manifestly incompatible' with a listed right, it issues a declaration that doesn't void the statute, and the legislature then has to respond within one session. So the live question for me is never just would this be struck down — it's would this draw a declaration, and how much does that cost the chamber. Second, the rights list is mixed: maybe half are specific (search, jury, counsel), and half are open-textured — dignity, cruel or degrading treatment — plus one clause the courts have read as implying unenumerated rights. Most of my hard cases live in the second half.

  So: write me the procedure. The questions in order, what counts as a sufficient answer to each, which steps are identical whether a court is applying strict scrutiny or the deferential 'manifest' standard and which steps aren't, where the procedure terminates in a clear no, and where it has to stop and say this is a value call for the chair and not for me. Include a step that runs the same analysis on the status quo the bill would replace, because nobody ever declares a baseline incompatible and I keep forgetting that. It has to be runnable in ninety minutes on a bill I didn't draft. Then apply it to two things I'm actually sitting on: a bill tightening voter ID and cutting early voting from three weeks to one, and a bill letting a patient's family keep a comatose relative on life support for sixty days over the treating physician's objection, even where there's an advance directive saying otherwise. I like the first and find the second genuinely troubling, so if the procedure says the opposite about them, say so plainly and don't soften it. Finish by telling me what the procedure can't do — which of my cases it will just get wrong.
reasoning: |-
  We are designing a constitutional-risk assessment procedure for a state legislative research office. The context includes:
  - Weak-form judicial review: courts issue declarations of "manifest incompatibility" which do not void the statute but require legislative response within one session.
  - The Bill of Rights includes both specific and open-textured rights, and courts have recognized unenumerated rights under one clause.

  The procedure must:
  1. Be an ordered set of questions, with clear stopping points.
  2. Differentiate between steps that apply regardless of the standard (strict scrutiny vs. deferential "manifest" standard) and those that don't.
  3. Include analysis of the status quo (baseline) because it is rarely declared incompatible.
  4. Be executable in 90 minutes on a bill the assessor didn't draft.
  5. Terminate in clear "no" (no substantial risk) or flag for the chair when it's a value call.

  The real difficulty in translation from law-review style to a procedure lies in:
  - Moving from open-ended analysis to a structured, step-by-step decision tree that yields actionable conclusions.
  - Balancing legal nuance with practical constraints (time, legislative priorities, and political consequences).
  - Recognizing that the goal is not to predict court outcomes with certainty but to identify risks that could lead to a declaration and assess their magnitude in terms of cost to the chamber.

  Procedure: Constitutional Risk Assessment (CRA) Protocol

  Step 1: Identify the Bill's Core Operation
     - What does the bill do? Summarize in one sentence.
     - What is the status quo (current law) that the bill would change?
     - Sufficient answer: A clear, concise statement of the change and the baseline.

  Step 2: Identify Rights Engaged
     - List every right in the state Bill of Rights that might be engaged by the bill's operation. Include unenumerated rights recognized by courts.
     - For each right, note:
          a. The textual source (specific or open-textured).
          b. The nature of the engagement (e.g., burdens, restricts, infringes, or potentially enhances).
     - Sufficient answer: A list of rights with a one-sentence explanation of the engagement. If none, stop: LOW RISK.

  Step 3: Baseline Analysis
     - For each right identified in Step 2, ask: Is the current law (status quo) already engaging this right in a similar way?
     - If yes, note that courts have not declared the current law incompatible. This does not immunize the bill, but it lowers the novelty of the risk.
     - Sufficient answer: A yes/no for each right, with a brief note on the current law's engagement and any existing jurisprudence.

  Step 4: Threshold Inquiry: "Manifest Incompatibility" Filter
     - For each right:
          a. Is the engagement de minimis? (e.g., trivial, incidental, or widely accepted as permissible)
          b. Is there binding precedent (from the state's highest court) that has upheld a substantially similar law under the same right?
          c. Is there binding precedent that has struck down a substantially similar law?
     - If (a) or (b) is true for all rights, stop: LOW RISK (no substantial risk of declaration).
     - If (c) is true for any right, stop: HIGH RISK (high risk of declaration; note the precedent).
     - If the answer is unclear, proceed to Step 5.

  Step 5: Structured Proportionality Analysis (Common to Both Standards)
     - This step applies to any right that passed Step 4 without a clear low-risk or high-risk outcome. It is the core of the analysis and is performed for each such right.
     - Ask in sequence:
          a. Legitimate Objective: Does the bill pursue a legitimate governmental objective? (e.g., public safety, election integrity, protection of vulnerable persons) [Note: This is usually easy to satisfy and is common to all standards.]
          b. Rational Connection: Is there a rational connection between the bill's means and the objective? [Common to all standards.]
          c. Minimal Impairment (for rights that typically require proportionality): Could the objective be achieved with a less restrictive alternative? [This step is critical for strict scrutiny but also relevant under the deferential standard because if a less restrictive alternative is obvious, the law may be "manifestly" incompatible.]
          d. Overall Balancing: Do the benefits of the bill outweigh the burdens on the right? [Under the deferential "manifest" standard, this is where the court gives more leeway to the legislature, but if the burden is grossly disproportionate, it may still be manifest.]

     - Sufficient answer: For each sub-step, a yes/no with a one-sentence reason. If any step fails, note the failure and the right affected.

  Step 6: Deferential Standard Specifics
     - For the rights that passed Step 5, now ask under the "manifest incompatibility" standard:
          a. Is there a reasonable argument that the bill is within the legislature's margin of appreciation? (e.g., the legislature has a factual basis for its choice, or the matter is one of social policy where courts usually defer)
          b. Is the burden on the right so severe that no reasonable legislature could impose it? (This is the "manifest" threshold: only the most egregious violations are declared.)
     - If (a) is strong and (b) is no, then the risk is MODERATE (but note that courts might still declare if the case is extreme). If (b) is yes, then HIGH RISK.

  Step 7: Aggregate Risk and Termination
     - If any right is assessed as HIGH RISK (from Steps 4, 5, or 6), then overall risk is HIGH: Flag the bill.
     - If no HIGH RISK but one or more MODERATE risks, then overall risk is MODERATE: Flag the bill and note that the risk is debatable (value call for the chair).
     - If all rights are LOW RISK, then overall risk is LOW: Clear the bill.

  Step 8: Cost Assessment (for Flagged Bills)
     - For any bill flagged (HIGH or MODERATE risk), estimate the cost to the chamber if a declaration is issued:
          a. Political cost: Public backlash, reputational damage.
          b. Practical cost: Need to revisit the issue in the next session, potential for emergency legislation.
          c. Litigation cost: The state will have to defend the law, but that's not unique to flagged bills.
     - This step is not a legal analysis but informs the chair's decision.

  Stopping Points:
     - Step 2: If no rights engaged, stop (LOW RISK).
     - Step 4: If de minimis or binding precedent upholds, stop (LOW RISK); if binding precedent strikes down, stop (HIGH RISK).
     - Step 7: Terminates with a clear risk level.

  Now, apply the procedure to the two bills:

  Bill 1: Tightening voter ID and cutting early voting from three weeks to one.

  Step 1: Core Operation
     - Requires stricter ID for voting and reduces early voting period from 3 weeks to 1 week.
     - Status quo: Current law allows various IDs and 3 weeks early voting.

  Step 2: Rights Engaged
     - Right to vote (specific, but also open-textured in terms of access).
     - Equal protection (unenumerated, but recognized under the state's implied rights clause).
     - Dignity (open-textured: could be argued that longer lines or burdens affect voter dignity).

  Step 3: Baseline Analysis
     - Current law has voter ID and 3 weeks early voting. Courts have not declared it incompatible. Note: This does not mean that tightening is safe.

  Step 4: Threshold Inquiry
     - Not de minimis: Changing ID requirements and cutting early voting is significant.
     - Precedent: In this state, courts have upheld the current system. No binding precedent on the exact changes, but federal precedent (e.g., Crawford v. Marion County) is not binding but may be persuasive. Assume no binding state precedent that strikes down a similar law. Proceed to Step 5.

  Step 5: Proportionality Analysis
     a. Legitimate Objective: Yes (election integrity, preventing fraud).
     b. Rational Connection: Yes (stricter ID may prevent impersonation; shorter early voting may reduce administrative errors and costs).
     c. Minimal Impairment: 
          - Voter ID: Are there exceptions for those without ID? If not, then it may fail minimal impairment for some voters. If there are (e.g., provisional ballots with later verification), then it might pass.
          - Early voting: Reducing from 3 weeks to 1 might be seen as impairing access, especially if there is evidence that the 3-week period is necessary to avoid long lines. If the state has data showing that one week is sufficient, then it might pass. Without such data, it may fail minimal impairment.
     d. Overall Balancing: 
          - The state's interest in election integrity is strong, but the burden on voters (especially those without easy access to ID or with scheduling constraints) is also significant. It is a close call.

  Step 6: Deferential Standard
     a. Margin of appreciation: The legislature has broad authority to regulate elections. There is a reasonable argument for deference.
     b. Manifest incompatibility: Is the burden so severe that no reasonable legislature could impose it? Probably not. There is a trend in many states to tighten voting rules. So not manifest.

  Step 7: Aggregate Risk
     - Minimal impairment step is weak (especially for early voting cut) but under the deferential standard, it is not manifest. Therefore, MODERATE risk for the voting right. Other rights (dignity, equal protection) would follow similar analysis.

  Conclusion for Bill 1: MODERATE risk. Flag for the chair as a value call. The cost assessment (Step 8) might note that voter ID laws often face challenges and the political cost of a declaration could be high in a charged partisan environment.

  Bill 2: Let a patient's family keep a comatose relative on life support for 60 days over the treating physician's objection, even with an advance directive saying otherwise.

  Step 1: Core Operation
     - Overrides both the physician's medical judgment and the patient's advance directive to allow family to demand 60 more days of life support.
     - Status quo: Without this bill, the advance directive would be followed, or the physician's judgment would prevail (depending on existing law).

  Step 2: Rights Engaged
     - Right to dignity (open-textured: includes the right to die with dignity, avoid degrading treatment).
     - Right to bodily integrity (unenumerated but recognized).
     - Cruel or degrading treatment (open-textured: forcing unwanted medical treatment might be degrading).
     - Note: Also, the family's rights (if any) but the Bill of Rights typically protects individuals against the state, so focus on the patient.

  Step 3: Baseline Analysis
     - Current law: Advance directives are followed. Courts have not declared this incompatible.

  Step 4: Threshold Inquiry
     - Not de minimis: Overriding an advance directive is a severe intrusion.
     - Precedent: In this state, no binding precedent on this exact issue. But note that in other contexts (e.g., end-of-life), courts have recognized patient autonomy. Proceed.

  Step 5: Proportionality Analysis
     a. Legitimate Objective: Yes (protecting life, giving families time to come to terms, religious objections to withdrawing life support).
     b. Rational Connection: Yes (60 days provides a cooling-off period and allows for second opinions).
     c. Minimal Impairment: 
          - Is there a less restrictive alternative? For example, a shorter period (e.g., 14 days) or a judicial review process? The bill does 60 days without judicial oversight. This may fail minimal impairment because a less restrictive option is available.
     d. Overall Balancing: 
          - The state's interest in preserving life is compelling, but the burden on the patient's autonomy and dignity is extreme. The patient has explicitly stated their wishes. The balance tips against the bill.

  Step 6: Deferential Standard
     a. Margin of appreciation: The legislature has a role in setting rules for end-of-life care, but the court may see this as an area of personal autonomy.
     b. Manifest incompatibility: Forcing a patient to endure 60 days of unwanted, invasive treatment against their prior expressed wishes could be seen as so degrading that it is manifestly incompatible with the right to dignity and freedom from cruel treatment.

  Step 7: Aggregate Risk
     - HIGH RISK. The minimal impairment step fails, and under the deferential standard, the burden is severe enough to be manifest.

  Conclusion for Bill 2: HIGH RISK. Flag the bill.

  Note: You mentioned you like the first bill and find the second troubling. The procedure agrees with your intuition on the second (HIGH RISK) but for the first, it says MODERATE risk (which might be a surprise if you thought it was low). The procedure flags both, but for different reasons.

  What the Procedure Can't Do:
  - Predict novel judicial interpretations, especially on open-textured rights.
  - Account for changes in court composition or societal attitudes that might shift the "manifest" threshold.
  - Resolve deeply contested empirical questions (e.g., the extent of voter fraud) in the 90-minute window. It must rely on available evidence and legislative findings.
  - It may over-warn on MODERATE risks because it is designed to avoid missing a declaration.

  Finally, the procedure is a tool to structure your analysis and communicate risk. It cannot replace judgment entirely, especially in close cases, but it ensures that you cover the critical steps and that the chair understands the nature of the risk.
answer: |-
  ### The Core Difficulty in Translation
  The real challenge lies in shifting from academic analysis (which explores nuance, counterarguments, and doctrinal evolution) to a *decision procedure* focused on legislative risk. Constitutional litigation centers on winning a case; legislative drafting centers on avoiding costly losses. Your weak-form review amplifies this: a "manifest incompatibility" declaration isn't fatal, but it forces the legislature to expend political capital revisiting the issue. The open-textured rights exacerbate this, as they lack bright-line rules. Your procedure must therefore:  
  1. **Prioritize speed** by filtering out low-risk scenarios early.  
  2. **Anchor every step in concrete inputs** (text, precedent, factual findings) to avoid theoretical debates.  
  3. **Distinguish "legal stop signs"** (clear no-go signals) from **"policy flags"** (debates requiring political judgment).  
  4. **Explicitly weigh the status quo**, as courts rarely disturb settled baselines.  

  ---

  ### Constitutional Risk Assessment Procedure  
  **Time Budget:** 90 minutes max per bill.  
  **Inputs:** Bill text, existing statute (status quo), relevant constitutional text, binding state appellate decisions.  
  **Outputs:** "Low Risk," "High Risk," or "Moderate Risk: Chair's Decision."  

  #### Step 1: Identify the Concrete Change (5 mins)  
    - **Question:** What specific language does the bill add, delete, or modify in the current statute?  
    - **Sufficient Answer:** A 1–3 sentence description of the operational change (e.g., "Reduces early voting window from 21 to 7 days").  
    - **Stop If:** The change is purely technical (e.g., grammatical corrections). → **Low Risk**  

  #### Step 2: Enumerate Rights Engaged (10 mins)  
    - **Question:** Which rights in the state constitution are plausibly burdened by the change?  
    - **Sufficient Answer:** A list citing specific clauses (e.g., "Art. I, §5 (voting); Art. I, §9 (dignity)").  
      - *Specific rights* (e.g., search, counsel): Cite only if the bill directly regulates the right's core domain (e.g., voter ID implicates voting rights).  
      - *Open-ended rights* (e.g., dignity): Cite only if the burden is non-trivial (e.g., life support prolongation forces invasive treatment).  
      - *Unenumerated rights*: Cite only if supported by *binding* state precedent.  
    - **Stop If:** No rights engaged. → **Low Risk**  

  #### Step 3: Baseline Analysis (10 mins)  
    - **Question:** Does the status quo already impose a comparable burden on the same right?  
    - **Sufficient Answer:** "Yes" (e.g., current law already requires voter ID) or "No" (e.g., current law honors advance directives).  
    - **Why:** Courts rarely declare long-standing practices "manifestly incompatible." A "yes" significantly lowers risk.  
    - **Never Stop Here:** Proceed even if baseline exists—novel burdens still risk declarations.  

  #### Step 4: Threshold Burden Check (15 mins)  
    - **Question:** Is the burden on the right *de minimis* or supported by binding precedent?  
    - **Sufficient Answer:**  
      - *De minimis test:* "Does the burden affect a small group marginally?" (e.g., minor fee increase).  
      - *Precedent test:* "Has the state supreme court upheld materially identical burdens under the same right?"  
    - **Stop If:**  
      - Burden is *de minimis* → **Low Risk**.  
      - Binding precedent *upholds* identical burden → **Low Risk**.  
      - Binding precedent *strikes down* a materially similar burden → **High Risk**.  
    - **Works for both standards:** "Manifest incompatibility" requires more than trivial harm, so *de minimis* fails. Precedent binds regardless of standard.  

  #### Step 5: Minimal Impairment Analysis (20 mins)  
    - **Question:** Could the bill’s objective be achieved with a less restrictive alternative (LRA)?  
    - **Sufficient Answer:**  
      - Identify the bill’s stated objective (e.g., "prevent voter fraud," "protect familial bonds").  
      - Propose a feasible LRA (e.g., for voter ID: free state-issued IDs; for life support: 14-day delay + judicial review).  
      - Cite evidence (or its absence) that the LRA would fail (e.g., "No data shows free IDs increase fraud").  
    - **Stop If:** A plausible LRA exists and is ignored → **High Risk** (for strict scrutiny *and* "manifest" standard; ignoring obvious LRAs suggests unreasonableness).  
    - **Policy Flag If:** The LRA debate hinges on contested facts (e.g., "Does cutting early voting increase wait times?"). → **Proceed to Step 6**  

  #### Step 6: Deferential Balancing ("Manifest" Standard Only) (20 mins)  
    - **Question:** Could a reasonable legislator conclude the burden is proportionate to the objective?  
    - **Sufficient Answer:**  
      - "Yes" if:  
        - The objective addresses documented harm (e.g., voter fraud evidence), AND  
        - The burden is not grossly disproportionate (e.g., 7-day voting window vs. 3-week status quo isn't *categorically* indefensible).  
      - "No" if:  
        - The burden is severe and arbitrary (e.g., forcing unwanted medical treatment for 60 days with no opt-out).  
    - **Policy Flag Here:** This is inherently subjective. If the burden/benefit balance is debatable → **Moderate Risk: Chair's Decision**.  
    - **High Risk Only If:** No reasonable legislator could support it (e.g., overt racial discrimination).  

  #### Step 7: Aggregate Risk Output (10 mins)  
    - **High Risk:** Any "High Risk" finding in Steps 4–6. **Flag the bill.**  
    - **Moderate Risk:** All risks resolved but one or more "Policy Flags" in Steps 5–6. **Flag for chair.**  
    - **Low Risk:** All steps cleared. **Clear the bill.**  

  ---

  ### Application to Your Cases  
  #### Bill 1: Voter ID + Early Voting Reduction  
  - **Step 1:** Tightens ID requirements (e.g., photo ID only); cuts early voting from 21 to 7 days.  
  - **Step 2:** Engages voting right (specific) and dignity (open-textured, via potential long waits).  
  - **Step 3:** Baseline: State already has voter ID and 21-day window. **Lowers risk, but proceed.**  
  - **Step 4:** Burden not *de minimis*; no binding precedent on 7-day window. **Proceed.**  
  - **Step 5:**  
    - Objective: "Prevent fraud."  
    - LRA: Free IDs + keep 21-day window. No evidence 21-day window enables fraud. **Policy Flag:** Contested whether 7 days disproportionately burdens voters.  
  - **Step 6:** A reasonable legislator could see 7 days as adequate (many states have less). **Not grossly disproportionate.**  
  - **Aggregate:** **Moderate Risk (Chair's Decision)** due to Step 5 Policy Flag.  
  - **Note:** Your affinity for this bill doesn’t change the LRA gap. The procedure flags it as debatable.  

  #### Bill 2: 60-Day Life Support Override  
  - **Step 1:** Forces life support for 60 days against physician’s objection and advance directive.  
  - **Step 2:** Engages dignity (open-textured), freedom from degrading treatment (open-textured), and bodily autonomy (unenumerated per precedent).  
  - **Step 3:** Baseline: Current law honors advance directives. **Novel burden; proceed.**  
  - **Step 4:** Burden severe (forced invasive care); no binding precedent. **Proceed.**  
  - **Step 5:**  
    - Objective: "Respect familial bonds."  
    - LRA: Shorter delay (e.g., 14 days) + court review. No evidence 60 days is necessary. **LRA ignored → High Risk.**  
  - **Stop at Step 5:** **High Risk.** No need for Step 6.  
  - **Note:** Your discomfort aligns with the procedure. This is a clear legal stop.  

  ---

  ### What the Procedure Can’t Do  
  1. **Predict Ideological Shifts:** It assumes precedent reflects current doctrine. A court poised to expand "dignity" rights might surprise you (e.g., redefining voter access as a dignity issue).  
  2. **Resolve Fact-Intensive Disputes:** In Step 5, if the legislature omits evidence for its objective (e.g., "fraud risk with early voting"), the procedure defaults to flagging the LRA gap. It can’t conjure data in 90 minutes.  
  3. **Capture "Soft" Costs:** A declaration’s political fallout (e.g., media backlash) is noted in briefing to the chair but not quantified here.  
  4. **Handle Edge Cases of Judicial Activism:** If your courts aggressively interpret "manifest incompatibility" (e.g., declaring minor burdens "degrading"), the procedure will over-flag risks.  

  **Final Tip:** Use templates for each step (e.g., "Step 5: LRA = [alternative]; Evidence = [source]"). This forces discipline and speed. You’re not writing for law review; you’re giving the chair a defensible choice.
