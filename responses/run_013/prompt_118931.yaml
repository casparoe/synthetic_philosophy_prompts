  ## Parish Circular: St. Aldwin's, Marrowfield  
  **From the Vicarage: 24th May, 2024**  
  **The Reverend Martin Ashby**

  Dear Friends in Christ,

  It has become necessary, once again, to address certain questions regarding the expression of our shared life and worship here at St. Aldwin’s. The Diocese has, understandably, sought clarification on our adherence to the statement of faith – specifically concerning the clause affirming that *something happened to a body on the third day*. This follows the Parish Council’s adoption of the ‘translation test’ last Michaelmas, a principle I believe offers profound clarity for our life together. Allow me to explain, as I seem to find myself doing with increasing frequency.

  The translation test is simplicity itself: if a doctrinal sentence *can* be restated as a claim about what did, does, or will happen in the world – a temporal, empirical occurrence – then that restatement reveals the original sentence to have been misunderstood, a category mistake. It attempts to use the grammar of *fact* for something belonging to an entirely different realm: the grammar of *faith*. To say "Christ rose from the dead" is not, for us, an hypothesis about first-century Palestinian biology awaiting forensic verification or falsification. It is the pivotal hinge upon which our entire form of life turns – the language-game we play, the pictures that govern our actions, our hopes, and our communal orientation. It is the foundation upon which we build, not a brick we can remove for independent inspection.

  Consequently, when pressed about the ‘body on the third day’, we must refuse the translation into empirical event. To say "something happened" in that sense is already to step outside faith’s grammar and into the grammar of science or history, where it does not belong and where it becomes nonsensical. What occurred belongs to the resurrection, which is of an entirely different *kind*. Asserting the clause, therefore, is not asserting a past occurrence *simpliciter*; it is affirming our participation in the life inaugurated by that picture. Denying it (in the atheist’s sense) is simply not playing *our* game; it's playing a different one entirely, hence no contradiction arises.

  I am aware this causes unease for some, particularly our valued friend Mrs. Ada Boyce, whose poignant letter asked whether she will see her late husband again, "in any sense she would recognise." My dear Ada, the hope of the resurrection is not a prediction about future sensory experiences or a reunion observable by outsiders. It is the grammar of our ultimate hope and comfort, shaping how we live *now* with loss. To picture the resurrection is to live in a certain way towards the future God-ward, a way that includes the profound assurance that death is not the final word *within this form of life*. It is the assurance that the love and bond you shared with Arthur, rooted in Christ, belong to a reality death cannot annihilate. This *is* the hope, warm and sustaining, precisely *as* hope within our shared language.

  Some on the Council, whom I might privately characterise as favouring a ‘plain-sense’ approach (though their devotion is never in question!), feel we have strayed too far. They wish to restore the old wording, fearing we lose substance. But substance is not found in mistaking the *kind* of language we are using. Our Hymn Vetting Committee rightly applies the translation test – removing stanzas that imply God’s existence is a competing theory about the universe’s origin, for instance. This guards the purity of our worship’s grammar.

  We are not saying *less*; we are saying something categorically *different*. We still pray, we still break bread, we still remit funds to the Mission Society (as the outward practice shaped by our inner pictures), we still seek to live Christ-like lives. These actions *are* the substance. To demand they rest on empirical hypotheses is to misunderstand their foundation entirely. It is the *form of life* that matters, not the imagined scaffolding of world-facts mistakenly propped beneath it.

  I trust this clarifies our position. We are not innovators, but seekers of clarity in how we use the words given to us. Please feel welcome to discuss this further, though I confess a hope we might soon move beyond needing such constant explanation towards simply *living* the life these words make possible.

  Yours in Christ,

  **Martin**

  ---

  **St. Aldwin's: Frequently Raised Points**

  1.  **"If the atheist isn't contradicting us when they deny God, what are they doing?"** They are speaking outside our language-game. It is akin to someone interrupting a chess match to insist the bishop *should* move in straight lines because that’s how real bishops walk. They misunderstand the kind of assertion "God exists" is within the form of life of faith. We do not engage them on *that* ground.
  2.  **"Doesn't this mean other religions are also just different 'language-games' we can't criticise?"** Different forms of life involve different pictures and practices. We engage with others through dialogue about the shape and fruits of their lives, not through arguments attempting to falsify their pictures using the rules of a different game (e.g., science or our own faith). Our Mission support reflects our desire to share the *practice* and *picture* of life in Christ, not to win a debate about cosmic facts.
  3.  **"Is belief just what we were taught to do, then?"** Our upbringing initiates us into the practice and pictures of this form of life. Sustaining belief *is* continuing in those practices (prayer, sacrament, fellowship, charity) and finding life, meaning, and orientation within them. It is not assenting to unverifiable world-pictures. The practice *is* the believing.
  4.  **"What about the astrologer or flat-earther? They have their 'pictures' too."** While any persistent practice could be called a 'form of life', the critical difference lies in the depth, complexity, historical rootedness, ethical fruit, and transformative power of *this* particular form of life centered on Christ. Astrology or flat-earth theories typically *do* make testable empirical claims (which fail), demonstrating they are confusedly attempting the wrong language-game. Our claims, properly understood, do not.
  5.  **"Did the Translation Test Committee really reject 'He Rose' from the Easter hymn?"** The Committee requested the alteration to "We sing 'He Rose!'" to emphasise the doxological, practice-embedded nature of the affirmation within *our* worship, rather than implying a detached historical observation. The *singing* is the crucial act.

  ---

  **Note on Fidelity to Wittgenstein:**

  Confidence Level: Moderate-High regarding *fideist interpretation*, Low-Moderate regarding *Wittgenstein's own, final position*.

  This piece accurately portrays the *consequences* of a strict, systematic fideist reading of Wittgenstein's remarks on religious belief (primarily from student notes in *Lectures and Conversations*). It takes liberties by formalizing the "translation test" as a parish rule and applying it programmatically to doctrine, hymns, and pastoral responses – Wittgenstein offered observations, not a pastoral system. The portrayal of the vicar's mild exasperation and the parish's internal tensions effectively dramatizes standard philosophical objections to fideism (vacuous belief, non-substantive disagreement, cultural conditioning, slippery slope) without stating them.

  **Least Sure Claim:** The assertion that Wittgenstein would distinguish the Christian form of life from astrology/flat-earth primarily based on "depth, complexity, historical rootedness, ethical fruit, and transformative power" (#4 in FAQs). While implied in his respect for religion's role, Wittgenstein was notoriously reluctant to provide *external* justifications or hierarchies of forms of life; he might well balk at this list as imposing a foreign standard. The fideist logic struggles *internally* to make such a distinction compellingly.
