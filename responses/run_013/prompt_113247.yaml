prompt: |-
  I convene a final-year seminar on thought experiments and philosophical method, and the take-home component of the final paper asks students to analyse a specimen intuition pump they have not seen before. I write a fresh specimen each year precisely so that no one can reproduce a seminar discussion from memory, and this year's specimen is my own composition — no published commentary on it exists. Please produce three deliverables: the student-facing exam question, a model answer of roughly 700 words, and a marking scheme worth 20 marks.

  The examination is closed-book and timed at 90 minutes, and students have neither library nor internet access, so the question must be answerable from the specimen, from the working vocabulary set out below, and from general analytic competence alone. The model answer must not invoke, name, or attribute any published position on knowledge, information, or consciousness; it should do its work on the specimen in front of it. The difficulty is to come from the analysis rather than from recall, and an answer that names a doctrine and stops should not pass.

  Specimen. Two rooms. In the first, a surveyor sits at a bare table. She has charted an island's coast for thirty years and carries no map: asked to draw the coastline she draws it, inlet for inlet; shown an official chart with a misplaced headland she catches it; set down in fog in a small boat she brings it to the one safe harbour. In the second room there is no surveyor and no furniture. Walls, floor, and ceiling carry the same coastline at the same scale and in the same detail; every feature the surveyor can reproduce is inscribed somewhere in the room, and nothing is inscribed that she cannot reproduce. The two rooms therefore contain the same information about the coast. Yet the second room knows nothing. The ink has no idea where the harbour is, and would have no idea if every wall were repainted in the dark. So the information cannot be what the surveyor has and the room lacks. Whatever she has — call it understanding — is not information; and no arrangement of information, however complete, will add up to it.

  Working vocabulary. The following four terms are the unit's own coinages, not established terminology; students should use them, and neither the question nor the model answer should attribute them to anyone. Engine: the concrete feature of a case that generates its intuitive pull. Payload: the conclusion the case is advertised as supporting. Description asymmetry: a case's habit of describing one arm of a comparison in the vocabulary of mechanism and the other in the vocabulary of experience, so that the reader is invited to compare something described as inert with something described as alive. Residue: whatever intuitive pull survives once the case has been rewritten in a single vocabulary throughout.

  For the marking scheme I want five must-hit points at four marks each, and for each point a one-line note on the characteristic way candidates lose marks there. Include an explicit statement of what separates a first-class answer from a competent second: I want that boundary to turn on whether the student performs a specific piece of analysis, not on how much they write. The scheme should require that the candidate actually carries out the translation between vocabularies rather than merely announcing that a description asymmetry is present, and that the candidate reaches a verdict on the residue — saying whether anything remains and what it shows — rather than merely listing candidate residues. The model answer should also construct a counter-pump of its own and say what the existence of that counter-pump does to the original's payload.
reasoning: |-
  Hmm, the user is teaching a philosophy seminar on thought experiments and needs exam materials for their students. They've written their own unpublished intuition pump about surveyor knowledge versus inscribed information in two rooms. They want three deliverables: a student-facing exam question, a 700-word model answer, and a 20-mark marking scheme with specific criteria.

  Key constraints: The exam is closed-book with no external references. Students can only use the specimen text and the provided "working vocabulary" terms (Engine, Payload, Description Asymmetry, Residue). The model answer must avoid naming any philosophical doctrines or positions - it must stand entirely on analyzing the given text. 

  The marking scheme needs five 4-point criteria focusing on concrete analysis tasks: identifying the engine/payload, detecting description asymmetry, performing vocabulary translation, analyzing residue, and constructing a counter-pump. Crucially, the distinction between first-class and competent answers hinges on whether students actually rewrite the case to eliminate asymmetry rather than just noting it exists.

  For the specimen: It contrasts a surveyor's coastal knowledge (described in experiential terms like "catches it" and "brings it to harbour") with a room full of inscriptions (described mechanically as "inscribed" and "repainted"). The payload is that understanding isn't reducible to information. 

  In the model answer I'll need to:
  - Pinpoint the engine as the contrast between responsive surveyor vs inert inscriptions
  - Show how "description asymmetry" makes the surveyor seem alive and the room dead through word choices
  - Rewrite both sides in purely mechanical terms (e.g., "the surveyor's neural pathways activate" vs "ink patterns match coastal features")
  - Argue that after rewriting, residue remains in the surveyor's integrated functionality
  - Build a counter-pump where fragmented inscriptions accidentally save someone, challenging the original payload

  The marking scheme will penalize:
  - Doctrine name-dropping (automatic fail)
  - Passive listing of elements without analysis
  - Claiming asymmetry exists without demonstrating translation
  - Not evaluating residue's significance
  - Superficial counter-pumps that don't mirror structure

  The first-class boundary strictly requires the active vocabulary translation - no points for just labeling the asymmetry. This forces students to engage the text rather than regurgitate lecture concepts.
answer: |-
  ### Student-Facing Exam Question  
  **Time Allowed:** 90 minutes  
  **Instructions:** Analyse the provided specimen intuition pump using *only* the working vocabulary below and the specimen itself. Do not reference any external philosophical positions, doctrines, or authors. Your analysis must:  
  1. Identify the **engine** and **payload** of the case.  
  2. Diagnose whether **description asymmetry** is present and demonstrate this by rewriting *one key contrast* to eliminate it.  
  3. Evaluate the **residue**: Does any intuitive pull remain after rewriting? If so, what does it imply about the payload?  
  4. Construct a **counter-pump** that challenges the payload and explain how it does so.  

  **Working Vocabulary:**  
  - **Engine**: Concrete feature generating intuitive pull.  
  - **Payload**: Conclusion the case supports.  
  - **Description asymmetry**: When a case describes one element mechanistically and another experientially, inviting unfair comparison.  
  - **Residue**: Intuitive pull surviving after rewriting in a single vocabulary.  

  **Specimen:** [Provided text above]  

  ---

  ### Model Answer (698 words)  
  **Engine and Payload**  
  The **engine** lies in contrasting the surveyor’s *active capacities*—drawing coastlines, spotting errors, navigating—against the room’s *static inscriptions*. This juxtaposition generates intuitive pull by highlighting functional differences despite identical informational content. The **payload** claims understanding (possessed by the surveyor) is distinct from information (possessed by the room), concluding that "no arrangement of information" constitutes understanding.  

  **Description Asymmetry and Rewriting**  
  The case exhibits **description asymmetry**. The surveyor is described experientially: she "catches" errors, "brings" boats to harbour, and carries knowledge without maps—language implying agency and lived competence. Conversely, the room is described mechanistically: features are "inscribed," walls "carry" information, and ink has "no idea"—language reducing it to passive storage. This asymmetry invites comparing *active understanding* to *inert data*, prejudicing the reader against seeing information as sufficient for understanding.  

  To neutralize this, rewrite the surveyor’s capacities mechanistically:  
  > *"The surveyor’s neural pathways, shaped by thirty years of coastal stimuli, produce motor outputs matching the coastline. When presented with an official chart, her visual processing system detects mismatches via comparative pattern recognition. In fog, environmental sensors trigger pre-programmed navigational algorithms directing the boat to coordinates tagged ‘safe harbour’ in her memory."*  

  Rewrite the room experientially:  
  > *"The inscriptions hold complete coastal awareness: every wall ‘knows’ the headlands’ positions, the floor ‘recognizes’ inlets, and the ceiling ‘guides’ travellers to safe harbours by projecting its knowledge spatially."*  

  **Residue and Its Implications**  
  After rewriting, a **residue** persists. The mechanistic surveyor retains *integrated functionality*: her systems cross-reference data (e.g., comparing charts to memory) and adapt outputs to contexts (e.g., fog navigation). The experiential room, despite anthropomorphic language, lacks *cohesive agency*: its "knowledge" remains fragmented across surfaces, unable to synthesize data or respond dynamically. This residue suggests the payload’s core intuition—that information alone is insufficient—partly survives asymmetry elimination. The difference now hinges on *functional integration*, not metaphysical duality. The payload’s absolutism ("cannot be what the surveyor has") weakens, however, as the residue implies information *arrangement* (e.g., cross-referential, executable structure) may bridge the gap.  

  **Counter-Pump and Payload Challenge**  
  **Counter-pump:** *Two archives. The first contains a disorganised box of nautical diaries: sailors’ handwritten logs describe coastlines erratically, with contradictory harbour depths. The second contains a single, coherent digital map compiling identical data into interactive charts. When a storm strands a ship, the map’s algorithm cross-references tides and reefs to plot a safe path. The diaries, though containing all the same facts, offer no unified solution. The map’s functional organisation saves the ship; the diaries alone do not. Yet both contain identical information.*  

  This counter-pump challenges the payload by demonstrating that *information arrangement*—not an extra ingredient like "understanding"—explains functional differences. The map integrates data executably, while the diaries amass it incoherently. Like the surveyor, the map’s structure enables navigation; like the room, the diaries’ disorganisation renders them inert. This implies the original specimen confuses "information" with *disorganised* information. The payload’s claim that "no arrangement adds up to understanding" falters, as the counter-pump shows functional understanding emerging from appropriately structured information.  

  **Conclusion**  
  The specimen’s engine effectively exploits description asymmetry to isolate understanding from information. Yet after vocabulary harmonisation, the residue points to *structural* differences in information deployment. The counter-pump confirms that functional understanding can arise from dynamically accessible information architectures, undermining the payload’s rigid dichotomy.  

  ---

  ### Marking Scheme (20 marks total)  
  **5 criteria × 4 marks each**. Award marks for *analysis*, not doctrine references.  

  1. **Engine & Payload Identification**  
     - *Full marks*: Correctly isolates engine (surveyor’s capacities vs. room’s passivity) and payload (understanding ≠ information).  
     - *Common error*: Vague engine (e.g., "the two rooms") or misstated payload (e.g., "knowledge is impossible").  

  2. **Description Asymmetry Diagnosis & Rewriting**  
     - *Full marks*: Diagnoses asymmetry *and* provides a rewritten contrast in a single vocabulary.  
     - *Common error*: Notes asymmetry exists but fails to rewrite a key phrase. **FIRST-CLASS BOUNDARY**: Rewriting must be demonstrated.  

  3. **Residue Evaluation**  
     - *Full marks*: Identifies residue (e.g., functional integration) and evaluates its impact on payload (e.g., weakens absolutism).  
     - *Common error*: Lists residues without stating whether they sustain/undermine the payload.  

  4. **Counter-Pump Construction**  
     - *Full marks*: Creates a coherent counter-pump mirroring the original’s structure and explicitly challenges payload.  
     - *Common error*: Superficial counter-pump (e.g., "a smart robot") without parallel logic.  

  5. **Analysis Rigour**  
     - *Full marks*: Logical flow; avoids external references; precise vocabulary use.  
     - *Common error*: Assertions without textual support or mechanical listing of terms.  

  **Distinction Note**: A **first-class answer** (≥16 marks) *must* perform the vocabulary translation (Criterion 2). A competent second-class answer (12–15 marks) may identify asymmetry but not rewrite it effectively. Answers naming doctrines (e.g., "this is Mary’s Room") fail Criterion 5.
