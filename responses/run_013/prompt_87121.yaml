prompt: |-
  I'm a novelist, and I'm working on a book set in a women's health clinic in a state that has a six-week abortion ban, a fetal homicide law, and a rule that abortion providers have to offer burial or cremation for fetal remains. Here's the thing that's bugging me. At the clinic, if someone has a medication abortion at eight weeks, we offer her the burial or cremation. If she says no, the remains go out as medical waste, but we have to document that we offered. Meanwhile, my sister had a miscarriage at home around the same stage, flushed it, and nobody said a word. And if a guy punches a pregnant woman and she loses the pregnancy, he can be charged with fetal homicide, but if she takes mifepristone, she's the criminal. There's alot going on there. What philosophical commitments does this whole setup presuppose? About what the fetus is, about grief and mourning, about the state's interest in potential life, about who counts as a mother, about the difference between intending a death and foreseeing one? Reconstruct the implicit theory for me. Is it actually consistent, or is it a pile of different theories glued together? Which parts does the practice strictly need, and which parts would fit fine with several rival views? And what would have to change if you swapped in a view where the fetus has no moral status, or one where it has full moral status from conception? I'm definately not looking for a reading list or citations, just the logic of the thing.
