  Hmm, the user runs a five-person evaluation unit at a state agency that funds workforce-development and reentry programs. They receive about fifty proposals annually, each with claimed effect sizes and timelines. The board requires these numbers to avoid vagueness, but the user's team lacks statistical training and has limited time (20 minutes per proposal) and space (one-page summary). They're struggling with how to handle the numbers effectively.

  The user has identified two flawed approaches: trusting the proposal's mechanism and implementation plan entirely, or discounting claims toward historical averages. Their forecasts have been overconfident, with ambitious proposals underdelivering while modest ones performed better. They want a practical procedure grounded in the inside-outside view distinction, addressing reference class selection and epistemic modesty that applies to their own biases, not just applicants'.

  Key challenges include:
  - Reference classes aren't fixed and can be gerrymandered
  - Their own scoring habits might be biased
  - Need something actionable within 20 minutes per proposal
  - Must fit on one page for analysts without statistical background

  The user wants a step-by-step procedure with:
  - Clear questions in order
  - Sufficient answer criteria
  - Clear "no" termination points
  - Distinction between factual and value judgments

  They also want three case examples:
  1) A reentry program modeled on a strong out-of-state trial claiming 30% reduction
  2) A novel peer-mentoring model with 8% claim and no reference class
  3) A "temptation" case where the procedure forces an uncomfortable answer

  Finally, they want limitations and evidence requirements for validating the procedure.

  I'll develop a four-phase procedure:
  1) Sanity Check - Basic plausibility assessment
  2) Outside View Setup - Reference class selection with guardrails
  3) Modesty Adjustment - Mathematical adjustment of claims
  4) Judgment Call - Explicit value-based decisions

  For the cases:
  - Case A: Charismatic director, plausible mechanism, but contextual differences
  - Case B: Novel approach with no evidence
  - Case C: Sympathetic mission but poor fundamentals

  The procedure will output adjusted effect sizes and confidence ratings, forcing uncomfortable truths in Case C.

  Limitations include:
  - Only adjusts for overconfidence, not other biases
  - Relies on existing historical data
  - Can't create evidence from nothing
  - Judgment is still needed in reference class selection

  Evidence of effectiveness would require tracking whether adjusted predictions correlate with actual outcomes over time.
answer: |-
  Below is a **Reference Class Adjustment Procedure (RCAP)** designed for your constraints (1 page, 20 minutes, no stats training). It forces explicit choices about reference classes and applies epistemic modesty symmetrically to applicants *and* your unit. The procedure treats the "outside view" as a structured comparison process, not a fixed number, and builds in checks against gerrymandering and self-interest. 

  ---

  ### **REFERENCE CLASS ADJUSTMENT PROCEDURE (RCAP)**  
  **PHASE 1: SANITY CHECK (5 MINUTES)**  
  *Goal: Filter out non-viable proposals before analysis.*  
  1. **Question:** Is the claimed effect size mathematically plausible?  
     - *Sufficient answer:* Claimed effect ≤ 100% improvement or reduction AND aligns with proposal’s scale (e.g., a 50% recidivism drop for a 3-month job-training program fails).  
     - **Terminate here if NO.** Flag as "overclaimed" to the board.  
  2. **Question:** Does the implementation plan include at least 2/3 of: budget breakdown, staff credentials, client eligibility criteria, data collection method?  
     - *Sufficient answer:* Yes, with specific, observable details (e.g., "Case managers have MSWs" not "experienced staff").  
     - **Terminate here if NO.** Flag as "insufficient detail."  

  **PHASE 2: OUTSIDE VIEW SETUP (5 MINUTES)**  
  *Goal: Define a defensible reference class to avoid gerrymandering.*  
  3. **Question:** What is the **most specific common category** for this proposal? (e.g., "urban cognitive-behavioral reentry," "sector-specific wage gains").  
     - *Sufficient answer:* A category used in ≥3 past proposals or public reports (e.g., DOJ recidivism studies, Workforce Innovation Network benchmarks).  
     - *Gerrymandering check:* If the category includes <5 programs or excludes similar cases without justification, reject it.  
  4. **Question:** What is the **historical average effect size** for this category?  
     - *Sufficient answer:* Your unit’s past data, public databases (e.g., Clearinghouse for Labor Evaluation), or agency reports. If multiple averages exist, use the **lowest**.  
     - *No data?* Use the **statewide average** for the outcome (e.g., overall recidivism rate: 40% → 20% reduction target = 32%; claim must beat this).  

  **PHASE 3: MODESTY ADJUSTMENT (5 MINUTES)**  
  *Goal: Adjust the claim using the outside view and symmetric scrutiny.*  
  5. **Apply the Adjustment Formula:**  
     - **Adjusted Effect = (Claimed Effect × Implementation Score) × 0.5 + (Reference Class Average × 0.5)**  
     - *Implementation Score:* Rate 0–1.0 (1.0 = exceeds Phase 1 criteria; 0.5 = meets minimally; 0.25 = weak but passing).  
     - *Why 50/50?* Balances applicant’s inside view (scaled by plausibility) and outside view. Forces humility: even perfect plans only get 50% weight.  
  6. **Confidence Rating:**  
     - **High:** Adjusted effect ±5% of reference class AND implementation score ≥0.75.  
     - **Medium:** Adjusted effect within ±10% of reference class.  
     - **Low:** Adjusted effect >10% above reference class OR implementation score <0.5.  

  **PHASE 4: JUDGMENT CALL (5 MINUTES)**  
  *Goal: Acknowledge values where facts end.*  
  7. **Question:** Does the adjusted effect justify funding *despite* low confidence? (e.g., equity gaps, urgent need).  
     - *Sufficient answer:* Board-approved criteria only (e.g., "serves high-priority ZIP codes").  
     - **Hand to person:** Analyst flags "Low confidence, high mission priority" for board decision. No number adjustment.  

  **OUTPUT TO BOARD:**  
  - Original claim, adjusted effect, confidence rating.  
  - Reference class used and implementation score.  
  - "Terminated in Phase 1" or "Judgment call needed" if applicable.  

  ---

  ### **RCAP APPLIED TO THREE CASES**  
  **Case A: Reentry Program (30% Reduction Claim)**  
  - *Claim:* 30% recidivism reduction in 3 years.  
  - *Phase 1:* Passes (plausible, strong plan).  
  - *Phase 2:* Reference class = "cognitive-behavioral reentry programs." Historical average = 15% reduction (lowest from national studies).  
  - *Phase 3:* Implementation score = 0.8 (strong director but rural area ≠ trial setting).  
    - Adjusted Effect = (30% × 0.8 × 0.5) + (15% × 0.5) = **12%** + **7.5%** = **19.5%**  
    - Confidence: Low (adjusted >10% above reference class).  
  - *Phase 4:* No values override.  
  - **Result:** Adjust from 30% to 19.5% (Low confidence).  

  **Case B: Peer-Mentoring Model (8% Improvement Claim)**  
  - *Claim:* 8% job retention increase.  
  - *Phase 1:* Passes (modest claim, adequate plan).  
  - *Phase 2:* No direct peers. Reference class = "workforce mentoring programs" (historical average = 5% gain).  
  - *Phase 3:* Implementation score = 0.6 (novel but untested).  
    - Adjusted Effect = (8% × 0.6 × 0.5) + (5% × 0.5) = **2.4%** + **2.5%** = **4.9%**  
    - Confidence: Medium (within 10% of reference).  
  - *Phase 4:* No override.  
  - **Result:** Adjust from 8% to 4.9% (Medium confidence).  

  **Case C: Sympathetic Temptation Case (Local Shelter Job Program)**  
  - *Claim:* 25% wage increase for homeless veterans.  
  - *Phase 1:* Fails budget breakdown (only says "use proven methods").  
  - **Result:** Terminated in Phase 1. Board sees: "Overclaimed: No implementation detail."  
  - *Why uncomfortable?* Popular local partner, emotional appeal, but RCAP forces rejection on missing basics. You must report the termination reason.  

  ---

  ### **WHAT RCAP CANNOT DO**  
  1. **Create data from nothing:** No reference class? RCAP defaults to statewide averages (often conservative).  
  2. **Fix bad historical data:** Garbage in, garbage out. Requires maintaining a simple agency database (program type, outcome, effect size).  
  3. **Replace value judgments:** Phase 4 explicitly outsources mission-based decisions to the board.  
  4. **Predict black swans:** Novel programs (Case B) get penalized; this is intentional modesty.  

  **YOUR 20 MINUTES OF JUDGMENT:**  
  - Phase 2 (reference class selection): 3 minutes. Requires comparing categories.  
  - Phase 3 (implementation score): 2 minutes. Holistic but criteria-bound.  
  - Phase 4 (values override): 1 minute. Only if applicable.  
  - **Total judgment time:** 6 minutes/proposal. The rest is formulaic.  

  **EVIDENCE REQUIRED TO VALIDATE RCAP:**  
  For your past 40 forecasts, you’d need:  
  1. **Actual outcomes** (even rough post-funding evaluations).  
  2. **Comparison** of:  
     - Your original confidence ratings vs. outcome variance.  
     - Adjusted effect sizes vs. actual effects.  
     - *Evidence of success:* Adjusted effects correlate with actual outcomes (±10%), and "Low confidence" proposals underperform more often than "High." If RCAP works, overconfidence should drop.  

  RCAP makes your unit’s reasoning transparent and forces confrontation with reference classes. It won’t eliminate errors but will make them legible—and defensible—to your board.
