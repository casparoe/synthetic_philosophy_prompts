prompt: |-
  I run a monthly reading group that's nominally philosophy of science but is really six friends in the back room of a bar -- two CS grad students, a historian, a retired actuary, and a couple of us who read too many blogs. Next month its my turn and I've claimed the problem of old evidence for Bayesians, which I've read about maybe four times and could not explain to you right now if you asked. Don't explain it to me here -- I want a plan for the 75 minutes, whiteboard, no laptops, smart people who haven't done any probability since undergrad if ever. What has to come first so the problem lands as an actual problem and not a gotcha about notation? My guess at the order is: what confirmation is supposed to be, why the likelihood ratio is doing the work, and only then the punchline that once you've conditionalized on E you have P(E)=1 and no hypothesis can collect any credit from it -- but I might have the dependancy backwards, and I half suspect the real culprit is evidence being *certain* rather than evidence being *old*, which if true changes the whole arc of the session. If that's right, say so and tell me where the fork goes and which branch to take for this audience.

  For the carrying example I keep reaching for the perihelion of Mercury, the classic one, but I worry it's so worn that everyone nods along and feels the problem without feeling it, and that it drags in a bunch of physics none of them have. Is there something better -- I'd wondered about a cold case where the crucial fact sat in the file for a decade before anyone had a theory that entailed it, or a doctor who finally lands a diagnosis that predicts a symptom the patient has been complaining about for years -- and what does the example have to have, and lack, to do the work? Then the misconceptions in the order they'll actually surface. My predictions: first 'so Bayesians can't learn anything from what they already know', which is obviously not it but I can't say why crisply; then 'old evidence is just selection effects / p-hacking'; then 'this is about the psychology of discovery, not confirmation'. Tell me exactly where in the sequence to head each one off, one closing question that would show whether they got it rather than just enjoyed it, and what I should openly announce I'm not covering at this level. And push back hard if the framing is confused -- if I've got old evidence tangled up with something else (the problem of new theories? priors over hypotheses I didn't have words for yet?), or if what I've scoped can't be done in 75 minutes without either hand-waving the solutions or drowning them, just say that plainly instead of humoring me. Flag too where you're actually confident about the pedagogy versus where you're guessing.
reasoning: |-
  We are going to design a 75-minute session on the problem of old evidence for Bayesians. The audience: six friends with mixed backgrounds (CS grad students, historian, retired actuary, and two avid blog readers). None are probability experts, and some haven't done probability since undergrad.

  Key goal: Make the problem land as an actual problem, not a gotcha about notation.

  Your initial guess for the order:
  1. What confirmation is supposed to be.
  2. Why the likelihood ratio is doing the work.
  3. The punchline: once you've conditionalized on E, P(E)=1, so no hypothesis can collect credit from it.

  But you suspect the real culprit is evidence being *certain* rather than evidence being *old*. This changes the arc.

  I agree: the core issue is that once evidence is known with certainty (i.e., P(E)=1), then conditioning on E doesn't change the probability of any hypothesis. This is because if P(E)=1, then P(H|E) = P(H and E) / P(E) = P(H) (since H and E together have probability P(H) when E is certain). Therefore, E cannot confirm H. But note: the problem is particularly acute for *old* evidence because we have known it for a while and hence have updated to certainty. However, the issue is about certainty, not age per se.

  But the problem of old evidence is typically presented as: how can evidence that we have known for a long time (and hence have already incorporated) provide confirmation for a new theory? The Bayesian machinery seems to say it cannot because we have already set P(E)=1.

  So we have two aspects: 
  - The logical point: if P(E)=1, then P(H|E)=P(H).
  - The psychological/epistemic point: we often do get confirmation from old evidence when we come up with a new theory that explains it.

  So the plan:

  I. (10 min) Set the stage: What is confirmation?
     - We are talking about how evidence supports a hypothesis.
     - Bayesian confirmation: E confirms H if P(H|E) > P(H).
     - We'll use the ratio form: the likelihood ratio P(E|H)/P(E|~H) as a factor that updates the prior odds to posterior odds.

  II. (15 min) The Bayesian update and the role of likelihoods.
     - Write Bayes' theorem: P(H|E) = [P(E|H) * P(H)] / P(E)
     - Show that if we already know E, then P(E)=1. So P(H|E) = P(E|H) * P(H). But note: if we already know E, then our current probability for H is P(H|E) and it's fixed? But wait, if we are going to consider a new hypothesis, we have to think about how we set up the probabilities.

     Here's the fork: 
     - In the Bayesian framework, we update on evidence when we learn it. Once we have updated, that evidence is part of our background knowledge. So when we consider a new hypothesis H, we have to condition on all we know, including E.

     The problem: 
     - Suppose we have known E for a while. Now a new hypothesis H is proposed that entails E (so P(E|H)=1). But since we already know E, our current probability for E is 1. So we compute P(H|E) = P(H) * [P(E|H) / P(E)] = P(H) * [1 / 1] = P(H). 
     - Therefore, E does not raise the probability of H above its prior. But intuitively, the fact that H explains E (especially if E was puzzling) should count in favor of H.

  III. (20 min) The classic example: Perihelion of Mercury. But you worry it's worn out and brings physics. Let's find a better example.

     We need an example where:
     a) The evidence E is already known (so it's old).
     b) A new hypothesis H is proposed that explains E (so P(E|H) is high, ideally 1).
     c) Intuitively, E should confirm H, but the Bayesian calculation using the current probability (which has P(E)=1) fails.

     Alternative example: 
     - Cold case murder: A murder happened 10 years ago. The only clue was a rare type of fiber (say, purple angora) found at the scene. No suspect at the time. Now, a new suspect is arrested for an unrelated crime, and the police discover that he owns a purple angora sweater. The new hypothesis H: "This suspect committed the old murder." The evidence E: "A purple angora fiber was found at the scene of the old murder." 
     - We have known E for 10 years. Now we learn about the suspect and his sweater. Intuitively, the fiber evidence becomes relevant again and supports the hypothesis that he did it. But in the Bayesian framework, E is already known and so P(E)=1. Then P(H|E) = P(H) * [P(E|H)/P(E)] = P(H) * [P(E|H)] (since P(E)=1). 
     - But note: if the suspect is the killer, then it's very likely the fiber would be found (so P(E|H) ≈ 1). But if he is not the killer, then the fiber is still there (so P(E|~H) is the probability that the fiber would be found even if he is not the killer). However, because we know E, we have already set P(E)=1. So the update factor is 1. How do we get the intuitive boost?

     We can also consider the doctor example: 
     - A patient has had a chronic symptom (say, a rash) for years. Many doctors have failed to diagnose. A new doctor proposes a rare disease H that would cause that rash. The evidence E: the rash. We have known E for years. Now, the doctor says, "Ah, this rash is a symptom of H!" Intuitively, the rash confirms the disease. But again, P(E)=1 for the patient, so the update factor is 1.

     We'll use the cold case example because it's more relatable and doesn't require physics.

     Present the cold case example and ask: how would we normally think about this? The fiber evidence seems to link the suspect to the crime. But the Bayesian update doesn't move the probability of H because E is already known.

  IV. (15 min) Why is this a problem? And misconceptions.

     The problem: It seems that old evidence cannot confirm a new hypothesis in the Bayesian framework, but we think it does.

     Misconceptions and when to address them:

     1. "So Bayesians can't learn anything from what they already know." 
        - We need to clarify: It's not that they can't learn from new evidence. The problem is about evidence that is already known and has been incorporated. But when a new hypothesis comes along that explains that old evidence, we want to count that explanation in its favor. We'll address this immediately after presenting the problem.

     2. "Old evidence is just selection effects / p-hacking."
        - We are not talking about data dredging. We are talking about a genuine explanatory relationship. We can head this off when we set up the example: In the cold case, the fiber was found and recorded objectively, and the suspect was not considered until now. So it's not that we are cherry-picking.

     3. "This is about the psychology of discovery, not confirmation."
        - This is important. We need to separate the process of discovery from the logic of confirmation. The problem is about the logic: how can we represent the fact that the evidence supports the hypothesis? We'll address this when we discuss the solutions.

  V. (15 min) Possible solutions and where we are not going.

     We won't have time to cover all the solutions in depth, but we can sketch:

     - One idea: When we consider the new hypothesis H, we should temporarily forget that we know E and then update on it. But that seems artificial.

     - Another idea: Use counterfactual probabilities. We should compute the probability that E would have had *before* we learned it, conditional on H and the rest of our background knowledge (minus E). This is the most common solution (Garber's approach). But note: it requires us to have a probability model for what we would have believed without E.

     - We can illustrate with the cold case: 
          Before we knew about the fiber, what would we have thought? If we didn't know E, then if we considered H (the suspect did it), we would have assigned a high probability to E (because he has the sweater). But if we didn't know E, then P(E|H) would be high and P(E|~H) would be low (because the fiber is rare). So the likelihood ratio would be large. Therefore, if we now compute the support as the likelihood ratio that we would have assigned at the time we didn't know E, then we get confirmation.

     - But note: we are not actually updating our current beliefs by forgetting E. We are evaluating the support by a counterfactual.

     We'll present this as a possible way out, but note that it has its own issues (how do we define the counterfactual probability?).

  VI. (5 min) Wrap-up and closing question.

     Closing question to check understanding:
     "In the cold case example, why doesn't the Bayesian update (with current probabilities) give a boost to the suspect's guilt when we note that he owns the sweater? And what is one way that Bayesians try to fix this?"

     What we are not covering:
     - We are not covering the problem of new theories in general (only the aspect of old evidence).
     - We are not getting into the technical details of non-zero priors for evidence or logical uncertainty.
     - We are not covering the many proposed solutions in depth.

  Revised Plan with Timing:

  1. (10 min) Introduction to Bayesian Confirmation
     - What is confirmation? E confirms H if P(H|E) > P(H).
     - Bayes' theorem: the update factor is the likelihood ratio (P(E|H)/P(E)) which depends on the likelihoods and the probability of E.

  2. (15 min) The Update Process and Certain Evidence
     - Once we learn E, we set P(E)=1 and condition on it. Then, if we consider a new hypothesis H, we have to use the current probability which includes E as background.
     - Show mathematically: if P(E)=1, then P(H|E) = P(H) * [P(E|H)/1] = P(H) * P(E|H). But note: if H entails E then P(E|H)=1, so P(H|E)=P(H). So no boost.

  3. (20 min) Cold Case Example
     - Present the murder case with the fiber evidence that has been known for 10 years. Now a suspect with a matching sweater.
     - We feel that the fiber evidence should support the hypothesis that he did it. But the Bayesian update doesn't move the probability because E is already known.
     - Have the audience discuss: Why is this counterintuitive?

  4. (15 min) Addressing Misconceptions and the Core Problem
     - Address the misconceptions as they come up, but proactively:
          a) After the example, when someone says "So Bayesians can't learn from old evidence", clarify: They can learn when they first get the evidence. The problem is when they want to use that same evidence again for a new hypothesis that explains it.
          b) If someone says it's p-hacking: In our example, the evidence was collected independently and the suspect was not targeted because of the fiber until after the fiber was found and recorded. So it's not selection.
          c) If someone says it's psychology: Agree that the process of discovery is psychological, but the problem is that our logic of confirmation doesn't capture the support.

     - Emphasize: The problem is that evidence that is certain (P(E)=1) cannot confirm any hypothesis. The age is just a common way that evidence becomes certain.

  5. (10 min) Sketch of a Solution and Wrap-up
     - One solution: Counterfactual approach. We consider what our degree of belief in E would have been before we learned it, if we had only the background knowledge without E. Then we use that to compute the likelihood ratio.
          In the cold case: without knowing about the fiber, if we considered the suspect, we would have thought P(E|H) is high (because he has the sweater) and P(E|~H) is low (because the fiber is rare). So the likelihood ratio is high, and that's why we feel the evidence is confirming.
     - But note: we aren't actually changing our current belief. We are using the counterfactual to measure the support.

     Closing question: 
          "In the cold case, why does the Bayesian update (using our current probabilities) fail to give a boost to the suspect's guilt? And what is the counterfactual way of measuring the support?"

     What we are not covering: 
          - The many other solutions (e.g., Jeffrey conditionalization, logical uncertainty)
          - The problem of how to set the counterfactual probabilities exactly.

  Flag for Confidence:
     - The structure and the cold case example: confident. 
     - The counterfactual solution: it's a standard approach, but the details can be tricky. We are presenting it at a high level.

  Total: 70 minutes, leaves 5 for buffer.

  Pushback: 
     - The problem of old evidence is tightly connected to the problem of how to assign probabilities to evidence that is logically entailed by a hypothesis (if H entails E, then P(E|H)=1). But in our cold case example, we avoid logical entailment (it's not 100% that the killer would leave that fiber, but very likely). So we can set P(E|H) high but not 1. The problem still arises because P(E)=1. So the update factor is P(E|H)/1 = P(E|H). Then the posterior is P(H) * P(E|H). But note: without E, the prior of H might be very low (so P(H) is low). The issue is that we don't get the extra boost from the likelihood ratio because we are missing the denominator P(E) which would have been less than 1 in the counterfactual. So even if P(E|H) is not 1, the problem remains: we don't have the ratio.

     However, in the case where P(E|H) is not 1, we get a boost of P(E|H) (which is less than 1) but that's not the same as the ratio. The ratio would have been P(E|H)/P(E) and without E, P(E) would have been low. So we are missing the factor 1/P(E). 

     We can adjust the example: The fiber is very rare, so without knowing E, P(E) would have been very low. But now that we know E, P(E)=1. So the update factor is P(E|H) (which might be 0.8) instead of P(E|H)/P(E) (which would have been 0.8 / (some small number) = large). 

     So the example still works.

     Therefore, the plan is feasible.

  Let's go!
answer: |-
  ### Plan for the 75-Minute Session: The Problem of Old Evidence for Bayesians  
  **Audience:** Mixed backgrounds (CS, history, actuarial, generalists); no recent probability experience.  
  **Goal:** Make the problem feel like a deep conceptual challenge—not a notation trick—and clarify that **certainty** (not age) is the root issue.  

  ---

  ### **Session Outline**  
  *(Total: 75 min; whiteboard only)*  

  #### **1. Groundwork: What Is Confirmation? (15 min)**  
  - **Why start here?** Without a clear idea of "confirmation," the problem seems abstract.  
  - **Key points:**  
    - Confirmation = evidence \(E\) increases our confidence in hypothesis \(H\).  
    - Bayesian definition: \(E\) confirms \(H\) iff \(P(H|E) > P(H)\).  
    - Show Bayes’ Theorem:  
      \[
      P(H|E) = \frac{P(E|H) \cdot P(H)}{P(E)}
      \]  
    - **Likelihood ratio focus:** The ratio \(\frac{P(E|H)}{P(E)}\) does the heavy lifting. Higher ratio → stronger confirmation.  
  - **Audience hook:** Use a simple example (e.g., a rare disease test: positive result confirms disease if test is reliable).  

  #### **2. The Core Tension: Certain Evidence (20 min)**  
  - **Why now?** This is the fork in the road. Your suspicion is correct: **certainty** is the real culprit, not age.  
  - **Key points:**  
    - Once evidence \(E\) is known with certainty, \(P(E) = 1\).  
    - Plug into Bayes:  
      \[
      P(H|E) = P(E|H) \cdot P(H) \quad \text{(since } P(E) = 1\text{)}
      \]  
    - **The punchline:** If \(H\) predicts \(E\) (so \(P(E|H) \approx 1\)), then \(P(H|E) = P(H)\). No confirmation!  
    - **Why age matters?** Old evidence is usually fully absorbed (\(P(E) = 1\)), but the issue applies to *any* certain evidence.  
  - **Whiteboard:** Walk through the math step-by-step. Emphasize that \(P(E) = 1\) "squeezes out" the likelihood ratio’s power.  

  #### **3. Example: Cold Case Murder (15 min)**  
  - **Why this example?** Avoids Mercury’s physics baggage. Highlights certainty, not age.  
  - **Story:**  
    > *10 years ago, a victim was found with a rare synthetic fiber (e.g., "Zylon"). No leads. Today, a new suspect emerges—and we learn they own a Zylon coat. The fiber is "old evidence," but it feels like strong confirmation.*  
  - **What the example needs/lacks:**  
    - **Needs:** \(E\) (fiber found) is known early, \(H\) (suspect did it) is new, and \(P(E|H)\) is high (suspect owns coat).  
    - **Lacks:** Physics/math complexity; relatable "aha" moment.  
  - **Problem:**  
    - \(P(E) = 1\) (we’ve known about the fiber for 10 years).  
    - \(P(E|H)\) is high (suspect owns coat), but \(P(H|E) = P(H)\) → no confirmation.  
    - **Intuition clash:** We feel the fiber *should* boost suspicion.  

  #### **4. Addressing Misconceptions (15 min)**  
  *Predictions and responses:*  
  - **Misconception 1:** *"So Bayesians can’t learn from what they already know?"*  
    - **When it arises:** During/after the cold case example.  
    - **Response:** "No—Bayesians *can* learn from new evidence. The issue is using *already-certain* evidence to confirm a *new* hypothesis. Once \(P(E) = 1\), it can’t boost \(H\) further. That’s why Mercury’s perihelion couldn’t confirm relativity after it was known."  
    - **Where to head off:** Immediately after presenting the cold case.  

  - **Misconception 2:** *"This is just selection effects / p-hacking."*  
    - **When it arises:** When discussing why the fiber feels confirming.  
    - **Response:** "P-hacking is about cherry-picking data. Here, \(E\) was documented *before* \(H\) existed—like the fiber in the case file. The problem is formal: how can certain evidence confirm *within Bayesian rules*?"  
    - **Where to head off:** During cold case discussion.  

  - **Misconception 3:** *"This is about psychology of discovery, not confirmation."*  
    - **When it arises:** When grappling with why the fiber "feels" confirming.  
    - **Response:** "Psychology explains *how* we discover hypotheses, but confirmation is about *justification*. The problem is that Bayesians lack a tool to justify why old \(E\) supports new \(H\)."  
    - **Where to head off:** During Q&A after the example.  

  #### **5. Takeaways and Closing (10 min)**  
  - **Reframe the problem:** The issue is **certainty**. If \(P(E) = 1\), no hypothesis gets credit for \(E\)—even if it perfectly predicts it.  
  - **Closing question to check understanding:**  
    > *"In the cold case, why doesn’t the fiber evidence increase our suspicion of the suspect under Bayes’ rule, and what’s one way Bayesians try to fix this?"*  
    - **Ideal answer:** "Because \(P(\text{fiber}) = 1\), so it can’t change probabilities. Fix: Pretend you didn’t know \(E\) and compute what \(P(E)\) *would have been* pre-discovery."  
  - **What we’re not covering:**  
    - Solutions in depth (e.g., counterfactual probabilities).  
    - New theories vs. old evidence (focus is on evidence certainty).  
    - Logical omniscience or non-zero priors.  

  ---

  ### **Confidence Flags**  
  - **High confidence:**  
    - Starting with confirmation/likelihood ratios.  
    - Certainty as the core issue (not age).  
    - Cold case example (avoids physics, highlights intuition).  
  - **Moderate confidence:**  
    - Timing for misconceptions (audience may raise them earlier).  
    - Skipping solutions (keeps focus on the problem).  
  - **Pushback:**  
    - You’ve scoped this well! 75 min is tight but doable if you avoid rabbit holes.  
    - **Not tangled with new theories:** The issue is about how certain evidence functions in confirmation, not where hypotheses come from.  
    - **Don’t drown them:** Avoid solutions—this session is about *feeling* the problem.  

  ### **Why This Works**  
  - **Clarity first:** Confirmation → likelihood ratios → certainty derails them.  
  - **Example:** The cold case makes it visceral. Age is a red herring; certainty is the villain.  
  - **Misconceptions:** Addressed in real-time where they naturally arise.  

  **Final tip:** End by asking the closing question—if they debate it, they’re hooked. If they shrug, revisit the cold case.
