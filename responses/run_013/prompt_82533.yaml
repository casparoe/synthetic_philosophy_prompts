  First, I need to identify all the cases they mentioned: 'no bachelor is married', 'cats are animals', 'cats are mammals' as empirical, the historical shift in 'whales are fish', a bylaw defining 'vehicle', and the Pope being an unmarried man. Also, they want consistency with holism from Quine's Two Dogmas, revisions like absolute simultaneity, indeterminacy of translation, psychological findings about prototype-based judgments, and the paradox of analysis.

  The user's deeper needs might include wanting a structured way to evaluate different theories of analyticity in the seminar. They probably want to highlight key debates and challenges in the literature, ensuring students grasp why the distinction is contentious. The two jobs (a and b) are crucial; if some theories can't handle both, that should be addressed. They might also be interested in showing how different philosophical camps handle these desiderata, like Carnap, Grice-Strawson, and inferentialists.

  I should categorize desiderata into non-negotiable and negotiable. Non-negotiables likely include subject-change intuition, proof vs. testing warrant, and the paradox of analysis. Cases like 'whales are fish' shifting and psychological factors might be negotiable depending on the theory. The user might not have explicitly stated but implies a need for clarity on which requirements are foundational versus those that are theoretical preferences.

  For the analysis, the joint unsatisfiability of desiderata is key. Quine's challenge pairs behavioral criteria with normative force, suggesting tension. The demand for a usable criterion might be a positivist bias, and entitlement might be an internalist preference. Each theory's approach should be summarized: Carnap with conventions, Grice-Strawson defending ordinary language, inferentialists with norms. Highlighting where each succeeds or fails against the list will set up seminar discussions.

  Finally, ensuring the response addresses if either job (a or b) is impossible for analyticity. If holism undermines both, that's a point for Quinean critiques. The paradox of analysis also remains a core challenge. Balancing historical cases with modern psychological data will show the evolving debate. The user's focus on applicability in teaching means the framework must be clear and debate-oriented, suitable for grad students to engage with primary texts.
answer: |-
  Here’s a structured set of desiderata for accounts of analyticity, tailored to your needs, with cases, constraints, and analysis of feasibility:

  ---

  ### **Core Desiderata (Non-Negotiable)**
  1. **Subject-Change Intuition**  
     - *Requirement*: Denying "No bachelor is married" feels like changing subject meaning, not factual error.  
     - *Case*: "Bachelors are unmarried" – denying this implies misusing "bachelor".  
     - *Non-negotiable*: Essential for job (a). Failure here collapses analyticity into syntheticity.

  2. **Warrant Asymmetry**  
     - *Requirement*: Proofs (e.g., logic/math) grant *a priori* warrant; empirical testing (e.g., "Cats have kidneys") does not.  
     - *Case*: "2+2=4" vs. "Cats are mammals" – the former requires no sensory evidence.  
     - *Non-negotiable*: Core to job (b). If analyticity can’t explain this, it fails a key purpose.

  3. **Paradox of Analysis Resolution**  
     - *Requirement*: Analyses must be both synonymous (to be correct) and informative (to be useful).  
     - *Case*: "Knowledge is justified true belief" – must capture meaning but add insight.  
     - *Non-negotiable*: Avoids trivializing analytic truths as tautologies.

  ---

  ### **Substantive Desiderata (Negotiable but Expected)**
  4. **Graded Necessity**  
     - *Requirement*: Handle "Cats are animals" (near-universal) vs. "Cats are mammals" (empirical revision).  
     - *Case*: "Cats are animals" feels definitional; "Cats are mammals" was discovered.  
     - *Camp-Specific*: Quineans reject this; others use "core vs. periphery" (e.g., Peacocke).

  5. **Meaning Change Sensitivity**  
     - *Requirement*: Explain how "Whales are fish" shifted from analytic-like to false.  
     - *Case*: Past definitions (based on marine life) vs. current biology (mammalian traits).  
     - *Camp-Specific*: Historicists (e.g., Burge) embrace this; Carnapians treat it as framework choice.

  6. **Stipulative vs. Lexical Truths**  
     - *Requirement*: Distinguish analyticity from mere stipulation (e.g., bylaws).  
     - *Case*: "Bicycles aren’t vehicles [per statute]" – legal, not conceptual truth.  
     - *Camp-Specific*: Legal positivists (e.g., Hart) separate these; inferentialists (Brandom) blur them.

  7. **Normative Force**  
     - *Requirement*: Analytic truths *govern* meaning (e.g., Pope *must* be unmarried to count as bachelor).  
     - *Case*: Applying "bachelor" to the Pope is a misuse, not false belief.  
     - *Camp-Specific*: Internalists (Boghossian) demand this; externalists (Putnam) downplay it.

  ---

  ### **Constraints from Challenges (Must Survive)**
  8. **Quinean Holism**  
     - *Constraint*: Analyticity must hold even if any belief can be revised (e.g., via auxiliary hypotheses).  
     - *Case*: Revising "conservation of mass" didn’t change meanings of "mass" or "energy" entirely.  
     - *Test*: Can analytic truths be *last resort* revisions? (Carnap: yes; Quine: no).

  9. **Psychological Realism**  
     - *Constraint*: Account for prototype effects (e.g., "Whale is fish?" feels fuzzy pre-science).  
     - *Case*: Speakers judge "bachelor" by stereotypes (young, partying) not just "unmarried".  
     - *Camp-Specific*: Experimental philosophers demand this; rationalists (Chomsky) compartmentalize.

  10. **Indeterminacy of Translation**  
      - *Constraint*: Analyticity mustn’t presuppose perfect synonymy.  
      - *Case*: "Gavagai" – no unique translation locks "rabbit" as analytic truth.  
      - *Test*: If meaning is indeterminate, how can analyticity be objective? (Carnap: framework-relativity; Quine: it can’t).

  ---

  ### **Feasibility & Tensions**
  - **Joint Unsatisfiability**: The **Subject-Change Intuition + Psychological Realism + Indeterminacy** trio is explosive.  
    - *Why?* Subject-change requires sharp meanings; psychology/indeterminacy show meanings are fluid.  
    - *Quine’s Trap*: A behaviorally applicable criterion (psychology/indeterminacy) kills normative force (subject-change).  
  - **Usable Criterion Demand**: Bias of *formal semanticists* (e.g., Montague) – but *pragmatists* (Brandom) reject it as reductive.  
  - **Entitlement Demand**: Bias of *internalists* (Boghossian) – *externalists* (Putnam) tie warrant to social practice, not individual grasp.  
  - **Job (b) at Risk**: If holism is true, *no* truth is immune to empirical revision (e.g., quantum logic’s non-distributivity revised "laws of thought"). Proofs may only give *defeasible* warrant.

  ---

  ### **Theories Against the List**
  - **Carnapian Postulates**:  
    - *Pros*: Handles subject-change (framework rules), warrant (conventional *a priori*), bylaws (explicit stipulation).  
    - *Cons*: Fails holism (frameworks are revisable) and psychology (ignores speaker competence).  

  - **Grice-Strawson Defence** ("Ordinary Language"):  
    - *Pros*: Explains subject-change (linguistic norms), graded necessity (central vs. peripheral uses).  
    - *Cons*: Collapses against indeterminacy (norms aren’t fixed) and meaning change (e.g., "whale").  

  - **Deflationary Inferentialism** (e.g., Brandom):  
    - *Pros*: Survives holism (analyticity = commitment in discursive practice), handles paradox of analysis (inferential roles can be elucidated).  
    - *Cons*: Struggles with warrant (norms are social, not *a priori*) and subject-change (revision is always possible).

  ---

  ### **Conclusion**
  - **Can analyticity do both jobs?** Job (a) (*subject-change*) is achievable; job (b) (*proof warrant*) is threatened by holism/indeterminacy.  
  - **Key Excluder**: **Psychological Realism** – if analyticity requires speaker-accessible criteria, normativity collapses.  
  - **House Styles**:  
    - *Usable criterion*: Positivist/formalist bias.  
    - *Entitlement*: Internalist bias.  
  - **Best Bets**: Hybrid approaches (e.g., Peacocke’s *implicit conceptions*) or inferentialism, but concessions needed (e.g., analyticity as defeasible).

  Use this to scaffold debates – no theory aces all desiderata, exposing analyticity’s contested core. Good luck with the seminar!
