answer: |-
  Ah, an excellent project! The White Horse Dialogue is one of those rare texts where the surface paradox continually rewards deeper excavation, and shaking off the textbook dust is essential. Your friend’s point about the "composite-kind" reading being upstream is astute and deserves serious consideration—it might indeed be the key that unlocks the most coherent interpretation. Let me think through how to structure this over ten weeks, prioritizing the puzzles that genuinely reshape our understanding rather than rehearsing familiar debates.

  The core challenge is that Gongsun Long’s "white horse is not horse" (*bái mǎ fēi mǎ*) feels intuitively wrong, yet his arguments demand we take it seriously. The textbook treatments often get bogged down in forcing it into Western logical categories (identity vs. predication) without sufficiently grappling with the implicit metaphysics of naming in the text itself. Your friend is right to highlight the "composite kind" (the *bái mǎ* as a distinct, unified category resulting from the combination of color and shape) as potentially foundational. If "white horse" signifies not merely a horse that is white, but a *sui generis* kind generated by the conjunction of "white" and "horse," then the non-identity claim becomes less paradoxical: the composite kind *bái-mǎ* isn't identical to the kind *mǎ*, precisely because it carries an additional, constitutive specification. This reading hinges on whether the text treats combined terms as creating genuinely new semantic/metaphysical units. Evidence for this comes from Gongsun Long’s insistence on the inseparability of color and shape in the object referred to, and his arguments about how losing one component (e.g., the color) destroys the specific compound referent. If this holds, it radically reorients the other puzzles.

  Therefore, I’d rank the core puzzles for your ten weeks as follows, prioritizing those where the composite-kind reading has the most significant downstream consequences:

  1.  **The Nature of the Composite Kind and Its Primacy (Weeks 1-3):** This *must* come first. Is *bái mǎ* best understood as a fundamental, irreducible compound kind, or is it merely an adjectivally modified subset of *mǎ*? This is upstream because it directly determines how we interpret the central claim and the logic of Gongsun Long’s arguments. If composite kinds are primary, then "white horse is not horse" asserts the distinctness of compound categories from their components or broader kinds. If not, we fall back on more conventional (and often strained) logical interpretations. Spend these weeks closely analyzing the text's arguments about inseparability ("You cannot have the white horse without the horse, but separating white from horse is still a horse; separating horse from white is just white"), the implications of "losing" the horse or the white, and contrasting it with later Mohist treatments of compound terms (which often *do* treat them as modified subsets). Key evidence: Does Gongsun Long argue *for* the ontological or semantic uniqueness of the compound, or merely *against* its identity with *mǎ*? The former supports the composite-kind reading. If the group largely accepts this reading by week 3, it becomes the lens for the rest; if rejected, the subsequent puzzles take on a different urgency.

  2.  **The Function of the Copula / Claim (Weeks 4-6):** *Only* after establishing (or refuting) the composite-kind framework can we productively tackle what "is not" (*fēi*) means. Is it denying identity, denying class inclusion, denying predication, or denying that the compound kind *is* the simple kind? The composite-kind reading strongly suggests it's primarily denying identity between distinct kinds (the compound vs. the simple), though this identity is likely understood in a robust, almost essentialist sense tied to naming's function in carving reality. If the composite-kind reading is rejected, we face a messier scramble: is *fēi* denying class inclusion (true, but trivial), or making a deeper point about the conditions of predication or the instability of reference? Focus here on the specific arguments Gongsun Long uses: the "seeking" argument (you ask for a horse, yellow or black are acceptable; you ask for a white horse, they are not), the "compound term" argument, and the implications of "horse" being "undetermined by color" while "white horse" is determined. Compare the use of *fēi* here with its use in other contemporary texts (e.g., Mohist Canons). The composite-kind reading makes the denial of identity coherent and non-trivial; without it, the claim risks being either obviously true (classes aren't identical) or perversely false.

  3.  **Proto-Nominalism vs. Linguistic Constructivism (Weeks 7-8):** Building on the first two, we can now ask the broader philosophical thrust. Is the dialogue primarily a nominalist assertion that only particular compound things exist and names/conventions create kinds ("white horse" as a distinct name for a distinct compound reality)? Or is it a more radical constructivist point about how language *generates* these compound kinds, shaping our apprehension of reality? The composite-kind reading leans heavily towards a strong nominalism or conventionalism about kinds: "horse" and "white horse" name different conventional unities. The evidence lies in the dialogue's focus on the pragmatic effects of names ("Therefore I say: white horse is not horse") and the implied critique of taking "horse" as a natural universal. If the composite-kind reading holds, this nominalist/conventionalist theme becomes central. If not, nominalism might be less directly supported. This question matters because it links the dialogue to the broader concerns of the School of Names (e.g., disputing about names and realities) and later Chinese thought.

  4.  **Part-Whole Metaphysics vs. Mass-Term Semantics (Weeks 9-10):** Finally, we can address the specific mechanisms proposed for how "white" and "horse" combine. Is the composite kind understood partitively (color + shape = whole object)? Or is "horse" functioning more like a mass noun ("horseness"), where "white horse" picks out a specific portion qualified by color? The composite-kind reading *accommodates* but doesn't strictly require either. The part-whole reading (often associated with A.C. Graham) draws on the "shape + color" language and resonates with contemporary Chinese thought. The mass-term reading (Chad Hansen) offers a powerful linguistic model explaining why "white horse" isn't a subset of "horse" (just as "white gold" isn't a subset of "gold" if "gold" is mass-like). Weeks 9-10 are ideal for evaluating these as competing (or complementary) *explanations* for the composite kind established earlier. Evidence includes the text's specific language about "having" (*yǒu*) color and shape, and comparative analysis of classical Chinese noun semantics. The value here is nuanced: if the composite-kind view holds, these offer different metaphysical or semantic models for it; if not, they become alternative primary interpretations, though likely less satisfying than the composite-kind lens.

  **Why this order?** Starting with the composite kind (1) tackles the most fundamental interpretive claim head-on. It’s the hinge: accepting it transforms the dialogue’s coherence and makes (2) the copula question resolvable as a denial of identity between distinct kinds. Resolving (1) and (2) then allows (3) the nominalist/constructivist theme to emerge clearly as the underlying philosophical motivation. Finally, (4) the part-whole/mass-term debate provides specific conceptual tools to explain *how* the composite kind works, building on the foundations laid. Ten weeks gives space to deeply engage each layer without rushing. Evidence that would shift the focus? If early textual analysis (Weeks 1-3) strongly undermines the composite-kind reading, then puzzle (2) the copula becomes the paramount challenge, demanding more time to salvage a coherent logic, and puzzle (4) might gain prominence as an alternative primary explanation. But based on the text’s own emphasis on the inseparability and unique status of the compound term, your friend’s upstream intuition deserves its place at the start. Good luck with the group – it promises rich discussions!

