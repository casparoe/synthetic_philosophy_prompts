answer: |-
  Your description captures a specific kind of context-dependent categorization that is purpose-driven, empirically grounded, and invertible. While no single established term perfectly encompasses all facets of this concept, the closest fit from philosophy and cognitive science is **telic property** (or **telic category**), derived from the Greek *telos* (end or purpose). This term emphasizes the role of purpose in defining the category, while accommodating the empirical sharpness, invertibility, and non-arbitrariness you describe. Below, I define it precisely, contrast it with near alternatives, and outline boundaries where it may not apply.

  ### Core Concept: Telic Property
  - **Definition**: A property assigned to an entity (object, behavior, or state) based on its role relative to a specific goal or purpose, where membership is empirically decidable once the goal is fixed, but the property may invert (e.g., from central member to central non-member) when the goal changes, without altering the entity's intrinsic attributes.  
  - **Key features from your cases**:  
    - **Empirical sharpness**: Once the purpose (e.g., "maximize vegetable yield" or "preserve historical patina") is set, category membership (e.g., weed/non-weed) is determined by observable facts (e.g., competition effects, material composition), allowing evidence-based resolution of disputes.  
    - **Invertibility**: Identical entities (e.g., a plant, code, or patina) can flip between category poles (e.g., weed to non-weed) under opposing purposes, as the purpose redefines what counts as "correct" placement or function.  
    - **Non-arbitrary purpose**: Purposes are constrained by the entity's capabilities (e.g., a plant's growth habits), measurable outcomes (e.g., software performance), and human values (e.g., conservation ethics), preventing purely subjective assignments.  
    - **Purpose mutability**: Purposes evolve (e.g., from "shipped software spec" to "updated spec"), causing category-wide flips; there is no neutral, purpose-independent fact to halt this, as purposes are chosen, not discovered.  
    - **Empirical disputes**: People argue as if categories are objective because evidence settles membership *within* a purpose, masking the purpose's role as a frame.  

  ### Why "Telic Property" Fits Best
  - **Established basis**: "Telic" is used in philosophy (e.g., telic roles in ethics or action theory) and linguistics (e.g., telic verbs for goal-directed actions) to denote purpose-relativity. It directly addresses your emphasis on goals (e.g., gardening, software design, conservation) as the anchor for categorization.  
  - **Distinct from near alternatives**:  
    - **Nearest alternative: Functional kind** (e.g., "chair" for sitting). Functional kinds are stable (a chair doesn't invert to a non-chair) and defined by design/intent rather than contextual purpose. Telic properties are more fluid, allowing inversion under shifting goals (e.g., a plant's role flips with land-use goals).  
    - **Other near misses**:  
      - **Relational property** (e.g., "invasive" relative to an ecosystem): Captures context-dependence but not inversion or purpose mutability; it assumes fixed relations (e.g., ecological harm), whereas your cases show the relation itself changes with goals.  
      - **Normative kind** (e.g., "defect" as evaluative): Includes appraisal but overemphasizes value judgments; your cases require empirical decidability (e.g., a weed's impact on crop yield is measurable).  
      - **Dispositional property** (e.g., "fragile" if likely to break): Focuses on potential behavior, not purpose-driven roles; it doesn't invert (fragility doesn't become anti-fragility under new goals).  
      - **Artifact concept** (e.g., "software bug" as human-created): Applies to designed systems (e.g., code) but not natural ones (e.g., plants in a meadow), while telic properties span both.  

  ### Boundaries and Edge Cases
  - **Where telic properties apply**:  
    - Purpose is contested (e.g., conservationists vs. farmers debating if a plant is a weed). Evidence resolves only the empirical layer (e.g., growth patterns), not the purpose choice.  
    - Multiple purposes coexist (e.g., a bronze statue might simultaneously serve aesthetic and historical goals, causing conflict over cleaning). This creates overlapping or conflicting telic properties.  
    - Purpose seems discovered (e.g., "the software *should* prioritize security" feels objective), but it arises from implicit values (e.g., user safety), not the entity alone.  
  - **Where the concept may not apply**:  
    - **Fixed-purpose categories**: If a purpose is immutable (e.g., "water" as H₂O in chemistry), membership never inverts, so it's not telic.  
    - **Purely arbitrary categories**: If membership lacks empirical constraints (e.g., "lucky numbers"), it isn't telic, as purposes must be grounded in measurable effects.  
    - **Non-invertible roles**: If a category shift doesn't flip poles (e.g., a "tool" becoming "junk" is degradation, not inversion), it may be merely functional or relational.  

  ### Conclusion
  While "telic property" is the most fitting established term, it is not universally recognized; it synthesizes ideas from teleology and relational metaphysics. If pressed for a coinage, **invertible telic role** would stress the flip aspect, but it risks redundancy, as inversion is inherent in the definition. Ultimately, your concept is a species of purpose-relative categorization with empirical teeth, distinguished by its invertibility and mutability.  

  \answer{EXISTS: yes | TERM: telic property | DEFINITION: A property assigned based on an entity's role relative to a specific goal, where membership is empirically decidable once the goal is fixed but may invert under a new goal without changing the entity. | NEAREST ALTERNATIVE: functional kind}
