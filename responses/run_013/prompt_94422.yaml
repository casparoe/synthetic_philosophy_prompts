  For the counterpunch: the Popperian's "must criticize" rule must itself be uncriticized. Can't let the Popperian dodge—force them to admit it's a pragmatic stance. The agreement about hating foundations should feel earned, then immediately splinter over what replaces it. 

  The sting moment... ah, when the Popperian concedes that criticism needs tools, and the Wittgensteinian pounces: "So you have hinges too!" That's the wound salt. But the Popperian gets a rebound—"Yours are frozen!"—keeping tension alive. 

