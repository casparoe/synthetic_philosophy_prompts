prompt: |-
  Me and two friends in a reading group have been arguing for like three months about Solomonoff induction and I want to finally write down the document we should've written ages ago instead of just shouting at each other. Here's the setup, and please don't waste words explaining the formalism back to me, they both know it cold. Friend A is convinced Solomonoff induction is the real foundation of Occam's razor: there's one universal prior over computable hypotheses, simpler programs get more weight, and any predictor that isn't hopeless converges on it, so "prefer the simpler theory" stops being a vibe and becomes a theorem. Friend B thinks it's a bait and switch: the prior is only pinned down up to a constant that depends on which universal machine you pick, the thing is uncomputable so no actual agent can have it, and the convergence only kicks in in a limit nobody reaches, so it can't tell you what to believe right now.

  Write the joint statement they could both sign after a real adverserial collaboration. I want: (1) a numbered list of claims both of them genuinely accept -- about the formalism, about what "simplicity" is really doing in it, about what the convergence result does and doesn't show, and about whether the machine-dependence is a fatal flaw or just a constant; (2) the real disagreements, each phrased in wording that the side holding it would actually sign off on; (3) the cruxes, i.e. the sub-questions where settling them would force at least one of them to move; and (4) for each crux, some argument or toy case they'd both agree is relevant, with what each of them predicts about it written down in advance. Put the disagreements in a table.

  One thing we keep re-fighting about: we ran the same little experiment where we each had to predict the next bit of a stream generated by a program neither of us could see, and we still walked away disagreeing about what it proved. So make the doc say what that experiment can and can't settle. If part of their fight is just about words (like "objective" or "simpler"), say which part and why. And skip the name-dropping and citations -- neither of them is going to be impressed by who said it, they want the argument. Keep the whole thing to something I could actually put in front of both of them without either feeling stitched up.
