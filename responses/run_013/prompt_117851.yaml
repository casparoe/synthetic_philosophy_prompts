prompt: |-
  A finance writer I read summarizes the Kelly criterion roughly like this: 'Kelly's rule says that when you have an edge you should bet the fraction of your bankroll that maximizes your long-run growth rate, which works out to your edge divided by the odds. Kelly proved this is the only strategy that cannot be beaten in the long run: bet more and you will eventually be ruined, bet less and you will grow more slowly, so full Kelly is what rationality requires. The deeper justification is that wealth compounds, and so is non-ergodic -- the average outcome across many gamblers is not the average outcome for one gambler over time -- and since you are one gambler over time, maximizing expected value is a mistake while maximizing the expected logarithm of your wealth is what a rational agent must do. This is why Kelly betting refutes expected-utility maximization as a general theory of choice: you cannot be both a Kelly bettor and an expected-utility maximizer. In practice, any bet that is not full Kelly is a mistake, and anyone who bets less than Kelly is simply being irrational about risk.' I am broadly sympathetic to Kelly betting, but I suspect the last few claims are doing something illegitimate and I cannot see where the mathematics stops and the rhetoric starts. Please audit this sentence by sentence: what a decision theorist or a working quantitative bettor would accept, what they would wince at, and what is simply wrong. Separate the claims that belong to Kelly's own result from those that come from the more recent non-ergodicity argument, say whether that argument actually refutes anything, and tell me whether the practical conclusion about fractional bets survives the correction. I would rather have your definite verdict on each point than a survey of positions, and I do not need citations.
reasoning: |-
  Okay, the user has shared a finance writer's summary of the Kelly criterion and wants me to audit it sentence by sentence. They're broadly sympathetic to Kelly betting but suspect some claims are illegitimate. They want me to separate Kelly's original results from the "non-ergodicity" argument, evaluate each claim, and determine whether the practical conclusion about fractional bets holds up.

  Let me break down this writer's claims systematically. The first part seems solid - Kelly does indeed recommend betting a fraction of your bankroll equal to your edge divided by the odds to maximize long-term growth. This is mathematically sound, though I should note that "odds" here refers to decimal odds minus one (the profit multiple).

  The statement that "Kelly proved this is the only strategy that cannot be beaten in the long run" needs careful examination. While Kelly's strategy does maximize long-run growth rate and minimizes ruin probability compared to higher bets, it's not strictly "unbeatable" - other strategies might have higher median wealth or different risk profiles. The "ruin" claim for betting more is generally true, while betting less does indeed grow more slowly - these are correct implications.

  The claim that "full Kelly is what rationality requires" is where things get philosophical. This assumes log-wealth utility, which isn't universally accepted. Rationality depends on utility functions, so this is an overstatement.

  The non-ergodicity argument about wealth compounding is insightful but not Kelly's original contribution. It correctly highlights that time-average growth differs from ensemble averages, which explains why expected value maximization fails for repeated bets. However, saying this "refutes expected-utility maximization" goes too far - EU theory can accommodate log utility, so Kelly fits within EU framework rather than refuting it.

  The strongest claim - that any bet not at full Kelly is irrational - is problematic. In real-world applications with uncertainty about true probabilities, estimation errors make full Kelly extremely risky. Most practitioners use fractional Kelly (like half or quarter) to reduce volatility. Bankroll constraints, risk aversion beyond log utility, and psychological factors also justify deviations. Calling anything less than full Kelly "irrational" ignores these practical realities.

  For the practical conclusion: while full Kelly is mathematically optimal under ideal conditions with known probabilities and log utility, fractional Kelly is rational and common in practice due to model uncertainty and risk management concerns. The writer's absolutism doesn't survive real-world application.

  I'll structure my response to clearly separate Kelly's proven results from the non-ergodicity argument, and provide definite verdicts on each claim while explaining where the rhetoric overreaches the mathematics.
answer: |-
  Here's a definitive, point-by-point audit of the writer's claims, separating mathematical truth from overreach and rhetoric. The verdicts are based on core decision theory, Kelly's original work, and practical quantitative betting:

  1.  **'Kelly's rule says that when you have an edge you should bet the fraction of your bankroll that maximizes your long-run growth rate, which works out to your edge divided by the odds.'**
      *   **Verdict: Correct.** This is the core, uncontroversial mathematical result. Edge = (probability of win * net odds) - probability of loss. The fraction is `f = edge / net_odds`. It maximizes the expected logarithm of wealth, which is equivalent to maximizing the long-run growth rate under repeated play.

  2.  **'Kelly proved this is the only strategy that cannot be beaten in the long run...'**
      *   **Verdict: Misleading/Overstated.** Kelly showed his strategy *maximizes* the long-run growth rate. It is *asymptotically* optimal. Saying it's the *only* strategy that "cannot be beaten" is ambiguous and strong. A strategy with a slightly lower `f` will grow slower but won't be "beaten" in the sense of having higher wealth *with probability 1* in the infinite long run. Strategies with higher `f` will eventually go bankrupt with probability 1. Kelly is *uniquely optimal* for maximizing growth, but "only strategy that cannot be beaten" is too vague and absolute.

  3.  **'...bet more and you will eventually be ruined...'**
      *   **Verdict: Essentially Correct.** If you consistently bet a fraction `f > f_kelly`, the probability of ruin (bankroll -> 0) approaches 1 as the number of bets goes to infinity. This is a crucial result.

  4.  **'...bet less and you will grow more slowly...'**
      *   **Verdict: Correct.** If you consistently bet a fraction `f < f_kelly`, your long-run growth rate (`g = E[log(1 + f*return)]`) will be strictly less than the growth rate achieved by `f_kelly`. Your wealth will compound slower.

  5.  **'...so full Kelly is what rationality requires.'**
      *   **Verdict: Contested / Depends on Axioms.** This is a *normative* claim. It assumes rationality is *defined* as maximizing the long-run growth rate of wealth (or equivalently, maximizing expected logarithmic utility). While compelling for repeated gambles with known probabilities and no other utility considerations, it's not universally accepted as *the* definition of rationality. Other valid utility functions (e.g., maximizing median wealth, minimizing probability of drawdowns below a threshold, incorporating non-gambling wealth) exist and can rationally justify different strategies.

  6.  **'The deeper justification is that wealth compounds, and so is non-ergodic -- the average outcome across many gamblers is not the average outcome for one gambler over time...'**
      *   **Verdict: Correct Insight (Non-Ergodicity), Not Kelly's Original.** The non-ergodicity perspective (pioneered by Ole Peters et al., building on Kelly/Breiman) is a powerful and correct *explanation* for *why* maximizing expected value (EV) fails for repeated multiplicative growth. The ensemble average (average outcome of many gamblers after 1 bet) is different from the time-average (average outcome of one gambler over many bets) when wealth compounds. Kelly maximizes the time-average growth rate. This was *implicit* in Kelly's work but not framed in modern ergodicity economics terms.

  7.  **'...and since you are one gambler over time, maximizing expected value is a mistake...'**
      *   **Verdict: Correct (for repeated bets).** For a single, isolated bet, maximizing EV might be appropriate depending on utility. For a sequence of repeated bets where wealth compounds (multiplicative dynamics), maximizing EV per bet *does* lead to almost sure ruin if the bet has any possibility of loss. This is the key failure mode the non-ergodicity argument highlights.

  8.  **'...while maximizing the expected logarithm of your wealth is what a rational agent must do.'**
      *   **Verdict: Contested / Depends on Axioms (Same as #5).** It's what an agent *must* do *if* their goal is *specifically* to maximize long-run growth rate under repeated multiplicative dynamics. It's a compelling rationality criterion for this specific context, but not an absolute "must" for all definitions of rational choice under uncertainty.

  9.  **'This is why Kelly betting refutes expected-utility maximization as a general theory of choice...'**
      *   **Verdict: Wrong.** This is a severe overreach. Kelly betting *is itself* expected utility maximization (EU) with a specific utility function: `U(W) = log(W)`. EU theory is incredibly flexible. Kelly doesn't refute EU; it highlights that *for long-run multiplicative growth*, the *logarithmic* utility function is the appropriate one to use within the EU framework. Saying Kelly refutes EU is like saying driving a Ferrari refutes automobiles.

  10. **'...you cannot be both a Kelly bettor and an expected-utility maximizer.'**
      *   **Verdict: Flatly Wrong.** As above, a Kelly bettor *is* an expected-utility maximizer with `U(W) = log(W)`. They are synonymous for this specific problem setup. This claim fundamentally misunderstands EU theory.

  11. **'In practice, any bet that is not full Kelly is a mistake...'**
      *   **Verdict: Wrong and Dangerous.** This is the most practically harmful claim. In the real world:
          *   **Probabilities are estimates, not known:** Using full Kelly with misestimated probabilities is catastrophic. Betting half-Kelly roughly quadruples the bankroll volatility you can tolerate before ruin risk spikes.
          *   **Risk Aversion:** Individuals may rationally value smoother wealth paths and lower drawdown risk more than maximum growth. Fractional Kelly (`c * f_kelly` with `0 < c < 1`) reduces volatility and drawdowns while sacrificing some growth.
          *   **Bankroll Constraints & Real Ruin:** "Ruin" isn't just theoretical; real-life constraints (living expenses, margin calls) make aggressive strategies impractical.
          *   **Non-Gambling Wealth:** Total wealth often includes non-bettable assets (human capital, house), making full Kelly on a "bankroll" too aggressive.
          *   **Transaction Costs/Frictions:** Reduce the optimal fraction.
      *   **Quantitative Bettor Verdict:** Seasoned quants *routinely* use fractional Kelly (e.g., 1/4, 1/2) as standard practice to manage estimation error and risk. Calling this a "mistake" is naive and ignores real-world complexity.

  12. **'...and anyone who bets less than Kelly is simply being irrational about risk.'**
      *   **Verdict: Wrong.** Betting less than Kelly is often the *rational* response to uncertainty (parameter risk), personal risk aversion, and real-world constraints. Dismissing all risk aversion beyond the properties of the log function as "irrational" is itself irrational in the context of practical decision-making. Rationality encompasses more than just maximizing asymptotic growth under perfect information.

  **Summary & Separation:**

  *   **Kelly's Core Proven Result (Points 1, 3, 4):** `f = edge / net_odds` maximizes long-run growth rate. Betting more leads to almost sure ruin. Betting less yields slower growth.
  *   **Non-Ergodicity Contribution (Points 6, 7):** Correctly explains *why* maximizing EV fails for repeated multiplicative growth (time-average vs ensemble average). This is a powerful justification *for* using Kelly/log-utility in this specific context, but it is supplemental to Kelly's math, not the origin of it.
  *   **"Refutes EU" Claims (Points 9, 10):** Completely wrong. Kelly *is* EU with U=log(W).
  *   **Normative Claims & "Rationality Requires" (Points 5, 8):** Contested. Log-utility is compelling for long-run multiplicative growth but not the sole definition of rationality.
  *   **Practical Conclusion / Fractional Betting (Points 11, 12):** **Does not survive correction.** The claim that any deviation from full Kelly is a "mistake" or "irrational" is dangerously incorrect in practice. Fractional Kelly betting is a rational, standard, and often necessary practice due to estimation error, risk aversion beyond log utility, and real-world constraints. Full Kelly is a theoretical optimum under idealized conditions rarely met in reality.
