prompt: |-
  I write about science and its disputed edges for a general-interest magazine, and over the years I've kept a private ledger of gut verdicts about which fringe claims deserve the label pseudoscience and which don't. I'd like a principle that captures the pattern, if there is one, and I'm ready to be told that some of my verdicts have to go. None of this is a request for reading; I just want the reasoning.

  Here is the ledger. (1) A retired mathematician's multi-volume re-dating of ancient history, which uses statistical patterns in old chronicles and astronomical references in ancient texts to argue that most recorded history before roughly the eleventh century was fabricated or duplicated by later scribes, so that, say, ancient Egypt and medieval Europe are the same civilization shifted in time. My verdict: pseudoscience, despite the quantitative apparatus. (2) Claims that ancient monuments required extraterrestrial help to build. Verdict: pseudoscience. (3) A lone early-twentieth-century scientist's proposal that the continents drift — ridiculed for decades, then absorbed into the modern picture. Verdict: not pseudoscience, not even at the height of its rejection. (4) Homeopathy. Verdict: pseudoscience. (5) Certain unobservable speculations in mainstream theoretical physics — extra universes, or interpretations of quantum mechanics that make no distinctive prediction anyone could test. Verdict: not pseudoscience, though I'll admit these are about as untestable as (1). (6) Cold fusion: a startling result announced to the press before peer review, never replicated, defended for decades. Verdict: I keep going back and forth — I want to say the first report was just bad science and only the later defense became pseudoscience, but I can't find the line where it flips. (7) A dietary theory that makes checkable predictions, fails them, and explains each failure away ("the trials were too short," "the wrong population"). Verdict: pseudoscience, I think, though it never stops making predictions. (8) A historian who uses standard archival methods but a controversial statistical technique to argue that a famous document is a forgery; the field rejects the conclusion but engages with the argument. Verdict: not pseudoscience.

  Two of these pairs are the ones that keep me up at night. (2) and (3) were both rejected by the experts of their day, yet I call one pseudoscience and not the other. (1) and (5) are both, on their face, unfalsifiable, yet I call one pseudoscience and not the other.

  My tentative principle: a claim is pseudoscientific to the degree that its defenders make it unfalsifiable in practice — arrange things so no conceivable observation could count against it — whereas a claim is merely wrong, or unorthodox, or speculative when its defenders stick their necks out and can lose. I suspect this is close, but it seems to make (5) a problem (its defenders arguably do the same immunizing), and it doesn't obviously separate (6) from (7).

  Please test and repair this. If one principle can't save every verdict, give me the smallest set of candidates and be explicit about which of my verdicts each one overturns. Then run the repaired account on a case I haven't listed, which I'll state here: a well-funded group claims a new fundamental particle at a specific mass; the collider finds nothing; the group argues the detector wasn't sensitive enough, nudges the mass, and carries on, decade after decade. Pseudoscience or normal science, and why.

  Structure your reply as follows. First, "The principle," stated precisely, in roughly 150 to 250 words. Second, "What each clause is for," roughly 300 words, tying every clause to the specific case that earns it. Third, "Verdicts on the case I didn't give you," roughly 200 words, plus a second case of your own invention that the principle is strained by. Fourth, "Which of my verdicts I have to give up," roughly 200 words, naming them and defending the trade.
reasoning: |-
  Okay, let me try to unpack this carefully. The user is a science writer grappling with a fascinating philosophical problem: how to distinguish pseudoscience from legitimate but controversial science. They've provided a ledger of specific cases where their intuitive judgments feel inconsistent, and they're seeking a robust principle that can resolve these tensions.

  Hmm... looking at their tentative principle about "unfalsifiability in practice," I notice it captures something important but struggles with cases like quantum interpretations (5) and cold fusion (6). The key insight might lie in distinguishing how communities respond to disconfirmation rather than just individual claims. 

  For example, continental drift (3) remained falsifiable because Wegener proposed testable geological mechanisms, while ancient aliens (2) relies on arbitrary rescues. But what makes this tricky is that both faced initial rejection. The difference seems to be that drift proponents engaged with criticism through evidence, whereas ancient alien theorists often dismiss counter-evidence.

  Ah! The collider case they added is perfect for stress-testing. If researchers nudge the particle's mass after null results, is that pseudoscience? Not necessarily - particle physics often adjusts parameters when experiments lack sensitivity. It becomes problematic only if they evade all possible disconfirmation, like refusing to specify detection thresholds.

  I should also address their discomfort about untestable physics (5). The distinction might be that multiverse theories are embedded in testable frameworks (e.g. inflationary cosmology), whereas the mathematician's chronology (1) isolates itself from standard historical methods. 

  For cold fusion (6), the line might be crossed when proponents stop designing crucial tests and attack institutions instead. That's different from the dietary theory (7) which constantly moves goalposts without ever risking falsification.

  The hardest trade will be reconciling their verdict on the historian (8) - but if the field engages with the statistical method, it shows the claim remains adjudicable within shared standards. That's the core: pseudoscience abandons communal epistemology.
answer: |-
  ### The Principle  
  A claim is pseudoscientific if and only if:  
  **(a)** It purports to be scientific (invoking empirical evidence, prediction, or explanatory mechanisms),  
  **(b)** Its proponents *systematically evade* or *immunize* it against decisive empirical tests *in practice* (e.g., by reinterpreting failures as successes, ad hoc adjustments, or rejecting methodological norms), **and**  
  **(c)** This evasion is driven by *non-epistemic commitments* (e.g., ideological, financial, or reputational incentives) that override corrigibility.  

  Claims lacking (a) are not pseudoscience (e.g., pure philosophy); those failing (b) or (c) may be speculative, flawed, or heterodox science.  

  ---

  ### What Each Clause Is For  
  - **Clause (a)** excludes non-scientific domains (e.g., untestable quantum interpretations in (5) are philosophical, not pseudoscientific).  
  - **Clause (b)** targets *practical unfalsifiability*:  
    - (1) Redating history: Statistical methods are retrofitted to immunize core claims (e.g., dismissing counter-evidence as "later forgeries").  
    - (2) Ancient aliens: Failures (e.g., no alien artifacts) are explained away (e.g., "they vanished").  
    - (4) Homeopathy: "No effect" is attributed to impurities or wrong dilution, never the theory.  
    - (7) Dietary theory: Predictions fail, but excuses ("wrong population") persist indefinitely.  
  - **Clause (c)** distinguishes from *provisional* science:  
    - (3) Continental drift: Despite ridicule, Wegener proposed testable mechanisms (e.g., fossil distributions) and accepted methodological norms. Rejection stemmed from epistemic conservatism, not evasion.  
    - (6) Cold fusion: Initial failure might be flawed science; pseudoscience begins when defenders (e.g., refusing blinded tests, attacking critics) prioritize belief over corrigibility.  
    - (8) Historian’s forgery claim: Uses standard methods; peers engage because arguments remain falsifiable (e.g., reanalyzing archives).  

  Clauses (b)+(c) resolve (1) vs. (5): The mathematician’s work (1) evades falsification (e.g., redefining evidence), while untestable physics (5) *acknowledges* its speculative status and remains tied to testable frameworks (e.g., quantum mechanics).  

  ---

  ### Verdicts on Your Case + New Strain  
  **Your collider case:**  
  - **Pseudoscience** if: After repeated null results at adjusted masses, the group refuses to define a *falsification threshold* (e.g., "any mass above X GeV is ruled out") and attacks critics. Clause (b) (evasion) and (c) (non-epistemic motives, e.g., funding dependency) apply.  
  - **Normal science** if: Mass adjustments are justified by new theoretical constraints, and they specify testable limits (e.g., "if not found by next-gen detector Y, we abandon").  

  **New test case:** *A group claims pyramids are energy accumulators. When physics shows no anomalous energy, they argue "science can’t measure subtle energies yet."*  
  - **Strain:** Superficially similar to (5)’s untestability. But clause (a) fails (invokes "energy" without mechanistic basis), and (b) applies (endless deferral to future tools). Clause (c) likely holds (e.g., mystical ideology). Verdict: Pseudoscience.  

  ---

  ### Which Verdicts You Must Give Up  
  **1. Cold fusion (6):** Your "flip" intuition aligns with the principle. Initial claims were bad science; later defense (evading replication, attacking journals) becomes pseudoscience when clauses (b)+(c) trigger. **Keep your verdict.**  
  **2. Untestable physics (5):** Correctly not pseudoscience per clause (a) (explicitly speculative) and lack of (b) (no "immunization" — proponents admit untestability). **Keep.**  
  **3. Redating history (1):** Pseudoscience per (b) (immunizing adjustments) and (c) (ideological commitment to rewriting history). **Keep.**  
  **Trade required:**  
  - **Homeopathy (4):** You call it pseudoscience, but *strictly* meets the principle only if proponents actively evade tests (e.g., rejecting controlled trials). If they merely *ignore* evidence without evasion, it might be "debunked" but not pseudoscientific per (b). However, homeopaths *do* dismiss studies (e.g., "allopathy can’t measure vital forces"), so **keep**.  
  - **Ancient aliens (2):** Must **soften verdict**. If proponents merely speculate without invoking testable mechanisms, it fails (a) and isn’t pseudoscience (just unscientific). But most claims *do* invoke testable evidence (e.g., "artifacts in pyramids"), then evade falsification — so **keep as-is**.  

  **No ledger verdicts overturned.** The principle refines ambiguity in (6) and (5) but preserves your core judgments by weighting *practices* over surface features like quantitative methods or historical rejection.  

  --- 
  This framework prioritizes *how* ideas are defended over their content or initial reception. Pseudoscience isn’t "wrong science" — it’s a parasitic mimicry that subverts the mechanisms of scientific correction.
