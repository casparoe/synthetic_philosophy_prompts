prompt: |-
  I'm a third-year philosophy student and we're doing a module on knowledge and scepticism right now. Over the summer a friend lent me one of those pop-epistemology books — the author's a journalist, not a philosopher, but its very readable and I've been half-taking it at face value. There's a chapter on contextualism I'm now suspicious of, and I'd like to know how fair it is before I repeat any of it in a tutorial. What it says, roughly:

  'Contextualism is the view that whether you know something depends on how much is at stake. If nothing much is riding on it, you can know on pretty thin evidence; if a lot is riding on it, the bar goes up. It's really the same idea as what some philosophers call pragmatic encroachment, just a different label for the same thesis. This makes knowledge a relative notion: two people with the same evidence can both be right, one saying you know and the other saying you don't, which is why critics call the whole thing relativism. The evidence for it is our intuitions about high- and low-stakes cases — you know your keys are on the table, but you don't know you won't win the lottery — plus the fact that we blame people more for acting on flimsy evidence when the stakes are high. The big objection is that it makes knowledge too easy to lose: if something purely practical, like a bet, can take your knowledge away without touching your evidence, then knowledge stops tracking anything epistemic at all. That's why the view has mostly been abandoned and everyone has gone back to plain old invariantism.'

  I've definately got a hunch that the relativism bit is off, it doesn't match anything we've done in seminars, but I can't tell whether the rest is fine or whether I'm about to embarrass myself. Give me exactly five numbered points, a sentence or two each, no intro and no conclusion, roughly in order of how much it matters — and where the book is just stating one side of a live disagreement rather than making a mistake, say so, since that's a different thing.
reasoning: |-
  Okay, the user is a third-year philosophy student working on knowledge and scepticism. They read a pop-epistemology book that presents contextualism in a way that seems off to them, especially regarding relativism. They need to evaluate the book's accuracy before discussing it in a tutorial. Let me break down the book's claims to address their concerns.

  First, the book conflates contextualism with pragmatic encroachment. I remember that contextualism is about the context of the speaker affecting the truth conditions of "knows," while pragmatic encroachment ties justification to practical stakes. These are distinct theories, so pointing out this conflation is crucial.

  Next, the relativism claim. The book says that two people with the same evidence can both be right about attributing knowledge, calling it relativism. But contextualists actually argue that different contexts change the semantic standards for "knows," not the facts themselves. This isn't relativism; it's more about context-sensitivity, like indexicals. Correcting this is important because it's a fundamental misunderstanding.

  Then, the evidence section. The book mentions intuitions from high/low-stakes cases and blame for acting on flimsy evidence. While these are part of the arguments, they oversimplify. Contextualists use thought experiments like DeRose's bank cases, and pragmatic encroachment appeals to practical rationality. Also, the blame aspect isn't the main evidence; it's more about case intuitions. Highlighting the actual methodologies here would clarify the oversimplification.

  The objection about knowledge being too easy to lose is a real critique, but the book presents it as decisive. However, invariantism isn't the only alternative; there are other positions like subject-sensitive invariantism. Noting that this is a live debate, not a settled abandonment, is key to showing the book's bias.

  Lastly, the claim that contextualism is abandoned is exaggerated. While its popularity has fluctuated, it's still discussed, and newer approaches like epistemic expressivism or relativism exist. Mentioning current philosophers like Ichikawa keeps the response accurate. The student needs to know this is an overstatement, not fact.

  The user might also be concerned about academic embarrassment, so clarifying where the book is one-sided versus outright wrong helps them navigate the tutorial confidently. They might not have access to primary sources, so providing precise distinctions and current scholarly views is essential for their understanding.
answer: |-
  Here are five critical points addressing the book's claims, ordered by significance:

  1.  **Mischaracterization of Contextualism:** The book incorrectly equates contextualism with "how much is at stake." Contextualism (e.g., DeRose, Lewis) is primarily a *semantic* thesis about the word "knows": it claims the *truth conditions* of knowledge attributions ("S knows that p") shift depending on the *speaker's* conversational context (e.g., salient error possibilities), *not* necessarily the subject's practical stakes. Pragmatic encroachment (e.g., Fantl & McGrath, Stanley) *is* about stakes affecting justification/knowledge, but it's a distinct *metaphysical* thesis, not just "the same idea with a different label."

  2.  **Incorrect Relativism Label:** Calling contextualism "relativism" (implying truth is relative to individuals/groups) is misleading. Contextualists argue that "knows" is context-sensitive, like "tall" or "here" – truth depends on the *context of utterance*. Two speakers *can* both be correct saying "S knows p" (in a low-stakes context) and "S does not know p" (in a high-stakes context) *without* relativism to individuals; it's about standard indexicality. Critics attack the context-sensitivity, not usually "relativism."

  3.  **Oversimplification of Evidence:** While intuitions about high/low-stakes cases (e.g., DeRose's Bank Cases, Cohen's Airport Case) are central evidence *for* contextualism/pragmatic encroachment, the book presents them too simplistically. The lottery case is often used *against* standard invariantism, not solely *for* contextualism. The "blame" argument is a weaker secondary point; the primary evidence is the intuitive judgments about *knowledge itself* across contexts.

  4.  **Objection Presented as Decisive:** The "knowledge too easy to lose" objection is a genuine and serious critique (the "instability problem" or "strategy of semantic ascent"). However, stating it caused contextualism to be "mostly abandoned" is a significant overstatement. It's a **live disagreement**: contextualists offer sophisticated responses (e.g., Lewisian rules, warranted assertability maneuvers), while invariantists (plain, sensitive, or insensitive) and others (relativists, expressivists) propose alternatives. Contextualism remains a major, actively defended position.

  5.  **Exaggerated Demise of Contextualism:** Claiming contextualism has been "mostly abandoned" and everyone returned to "plain old invariantism" is factually incorrect. While pragmatic encroachment gained prominence and contextualism faced challenges, it is still actively researched, refined (e.g., "moderate" contextualism), defended (e.g., works by Ichikawa, Blome-Tillmann), and debated. "Plain old invariantism" (especially *insensitive* invariantism) faces its own well-known problems (e.g., lottery paradox, disagreement in high/low-stakes cases).
