prompt: |-
  ok so I'm trying to actually get my head around the aggregation problem for Scanlon-style contractualism and I keep getting lost in the standard back-and-forth. before I read any more defenses of it, I want the spec first: write me the desiderata that any adequate contractualist account of aggregation has to meet.

  you know the setup - an act is wrong if it'd be ruled out by principles no one could reasonably reject, and the unit of moral complaint is the individual person, not the group. the worry is that this makes it impossible for numbers to ever count, so you end up with the result that it's just as wrong to save one person from drowning as to save a hundred. fine. so:

  - what cases does the account absolutely have to get right? (the pure numbers case, ties, cases where the harms differ in kind and not just in size, cases where many suffer only mild stuff vs one suffers something awful, cases about distributing a scarce good rather than saving lives, cases where all the complaints come from the same person...)
  - what distinctions can't be collapsed? (say, between "more people have a complaint" and "the total complaint is bigger", or between what's permissible to do and what's required, or between rejecting a principle and rejecting an outcome)
  - what is it not allowed to contradict - any intuition we'd treat as near-certain, and the basic idea that individuals are the site of justification in the first place?

  and here's the bit I actually care about: flag which of these desiderata can't be satisfied together. my hunch is there's a real tension between "the justification has to be addressed to each person individually / no one's claim gets swallowed by the group" and "the account must sometimes let the greater number win" - tell me if that's right, and if so what exactly has to give. also say which single requirement does the most work in ruling out the obvious fix, which I assume is just add up the complaints.

  one more thing I want folded in: assume the account has to be usable by an actual person deciding in real time, like a triage nurse with 30 seconds - so it can't require some idealised infinite comparison of every pairwise complaint. is that a legit desideratum or am I smuggling in something foreign? say so, don't just recieve it.

  don't give me a scorecard of who wins, I'll do that myself. just the list with the case behind each, and your verdict on the unsatisfiable subset.
reasoning: |-
  Okay, the user is diving deep into Scanlonian contractualism's aggregation problem. They want a clear specification of what any adequate account must achieve before evaluating existing solutions. The core tension they're probing—individual complaints versus allowing numbers to matter—is indeed the crux.

  Hmm, they're clearly frustrated with the standard academic back-and-forth. Smart move to demand desiderata first. Their triage nurse example suggests they care about practical applicability, not just theoretical elegance. That's important—many philosophical accounts fail that test.

  Let me structure this carefully. First, the non-negotiable cases: pure numbers (saving 1 vs 100) is the baseline, but we also need tie-breaking, different harm types (death vs broken arms), and cases where many small harms compete with one catastrophic harm. The distribution cases (scarce kidney) are crucial too—it's not just about saving but allocating. 

  The distinctions part is trickier. Must preserve "complaints are individual" vs "total burden" separation—that's Scanlon's whole point. Also can't confuse permissibility with obligation. And absolutely must keep the "no group justification" constraint—if we violate that, it's not contractualism anymore.

  Ah, their key insight about unsatisfiable desiderata is spot-on. Preserving individual complaint sovereignty while allowing numbers to win creates a paradox. Like trying to say "each person's vote matters equally" but then letting a majority override—it's logically tense. The triage nurse constraint exacerbates this; any solution requiring complex pairwise comparisons fails real-world usability.

  The "totaling complaints" ban is interesting. They suspect it's the obvious fix but forbidden—correctly! Because summing complaints treats individuals as interchangeable units, violating the foundational premise. That's why the desideratum about irreducible individuality does the heaviest lifting against utilitarianism.

  For the unsatisfiable set: Yes, strong individualism + requiring numbers to matter + real-time usability creates a trilemma. Sacrifice one or compromise. Most accounts ditch pure individualism (surreptitiously) or practicality. The nurse case kills overly complex solutions—no time for "compare each person's complaint to every other" algorithms.

  Should emphasize that harm severity comparisons are unavoidable—contractualism must handle "death vs broken arm" without summing. That's where pairwise comparison models (like Tim Scanlon's own) struggle with scalability. 

  Final note to self: Keep the tone clinical but highlight their sharp intuition about the core tension. They've identified the exact fracture point in the theory.
answer: |-
  Here's a comprehensive specification of desiderata for a Scanlon-style contractualist solution to the aggregation problem, structured for your analysis:

  **Core Desiderata: Cases An Account MUST Get Right**
  1.  **Pure Numbers (Equal Harm):** Saving 1 vs. saving 100 from *identical* severe harm (e.g., drowning). *Desideratum:* Must permit (or require) saving the 100. Failure here is the "no aggregation" reductio.
  2.  **Tie-Breaking (Equal Harm, Equal Numbers):** Saving Group A (5 people) vs. Group B (5 people) from identical harm. *Desideratum:* Must permit saving either, no requirement to flip a coin *if* no other morally relevant distinction exists. Avoids spurious requirements.
  3.  **Different Harm Kinds (Incommensurability):** Saving 1 from death vs. saving 100 from transient, moderate pain. *Desideratum:* Must permit (likely require) saving the 1 from death. Aggregation doesn't trivialize severe harms.
  4.  **Many Small Harms vs. One Severe Harm:** Inflicting severe disability on 1 person vs. inflicting a minor headache on 10,000 people. *Desideratum:* Must forbid choosing the severe disability to avoid the headaches. Prevents "death by a thousand cuts" justification.
  5.  **Distributive Justice (Scarce Good):** Allocating one life-saving kidney: Candidate A (moderate benefit) vs. Candidate B (large benefit). Candidate A (young, more life-years) vs. Candidate B (older, fewer life-years). *Desideratum:* Must provide a non-utilitarian justification for prioritization that respects individual claims and avoids pure QALY-maximization.
  6.  **Intra-Personal Aggregation:** Inflicting multiple smaller harms on one person vs. a single larger harm on them (e.g., ten minor surgeries vs. one major one). *Desideratum:* Must allow aggregation *within* a life (permitting/requiring spreading harm). Highlights the challenge of *inter*-personal aggregation.
  7.  **Non-Identity/Threshold Cases:** Choices affecting *who* exists (e.g., resource policy causing a slightly worse life for future person A instead of a better life for different future person B). *Desideratum:* Must handle complaints from differently situated possible persons without collapsing into impersonal goodness.

  **Essential Distinctions That MUST Be Maintained**
  8.  **Complaint Source:** Distinguish "More people *have* a complaint" from "The *total magnitude* of complaint is larger." Contractualism cares about the former primarily; the latter introduces impersonal summing.
  9.  **Permissibility vs. Obligation:** Distinguish principles it's *permissible* to act on from principles one is *required* to act on. An account might permit saving the many but not *require* it if the cost to the agent is significant.
  10. **Rejecting Principles vs. Rejecting Outcomes:** Focus on the *reasonableness* of rejecting *principles* that permit/forbid certain *types* of actions, not direct rejection of specific outcomes. Avoids outcome-based consequentialism.
  11. **Complaint vs. Justification:** Maintain that an individual's complaint against a principle is primary, but the *force* of that complaint in justifying rejection depends on the *alternatives available to others* under competing principles.

  **Non-Negotiable Constraints (Cannot Contradict)**
  12. **Individual Justificatory Primacy:** The fundamental unit of moral concern and the source of justificatory force is the *individual person*. Justification must be *to each individual*. Group totals cannot be fundamental justifiers.
  13. **No Trivialization of Severe Harms:** Cannot allow a sufficiently large number of *very minor* complaints to override a single *very severe* complaint (as in Desideratum 4).
  14. **Reasonable Rejectability Core:** Any solution must genuinely operate within the framework of "principles no one could reasonably reject," not sneak in an alternative moral foundation.
  15. **Avoid the "Cluelessness" Problem:** The account must provide actionable guidance for real agents under uncertainty and limited information.

  **Practicality Constraint (Legitimacy Debated - Flagged)**
  16. **Real-Time Usability (Triage Nurse):** Principles/rules derived must be applicable by agents with limited time, information, and cognitive resources without requiring pairwise comparisons of all possible individuals. *Your Question:* **This is a legitimate desideratum.** Scanlonian principles are meant to be *guides to action*. If the only solution requires computationally intractable comparisons, it fails as a practical moral framework, even if theoretically coherent. Scanlon himself emphasizes the need for "generic reasons."

  **The Core Tension & Unsatisfiable Desiderata**

  *   **Your Hunch is Correct:** The fundamental tension lies between:
      *   **(A) Individual Justificatory Primacy (Desideratum 12):** Justification must be addressed to each individual; no one's complaint is simply absorbed into a group total. The complaint exists only at the individual level.
      *   **(B) Numbers Must Matter (Desideratum 1):** Saving the greater number from equal harm must be permissible/required.
      *   **(C) No Summing Complaints (Implied by 8 & 12):** The "obvious fix" of simply adding up complaint magnitudes is forbidden because it violates individualism (treats individuals as containers for complaint-units) and collapses distinction 8.

  *   **The Unsatisfiable Triad (in Pure Form):**
      A solution cannot *simultaneously* satisfy **all three** of the following in their strongest interpretations:
      1.  **Strong Individualism:** *Only* individual complaints exist; the *only* force a complaint has in justifying the rejection of a principle is inherent to that complaint itself, independent of the *number* of others with similar complaints. (Implied by strict reading of 12 & 8).
      2.  **Strong Numbers-Matter:** In the 1-vs-100 equal harm case, the fact that 100 individuals have identical complaints *must* be the decisive factor justifying saving them over the one.
      3.  **No Cross-Personal Comparison/Metric:** There is no common metric (even a rough one) allowing the comparison of complaint *strengths across individuals*, and no mechanism for combining complaint *instances*.

      *   **Why?** Strong Individualism + No Cross-Personal Metric means the complaint of the one person facing harm if we save the 100 is indistinguishable in *justificatory force within the contractualist framework* from the complaint of *any one* of the 100 facing harm if we save the one. There is no relevant difference *from the perspective of any single individual's complaint* between the two options. Strong Numbers-Matter requires the *number* itself to be the decisive factor, but Strong Individualism provides no way for the *number* of people sharing a complaint to increase the justificatory force *of the principle* relative to another individual's identical complaint.

  *   **What Must Give?** Any workable solution must relax one (or more) of these:
      *   **Relax Strong Individualism:** Allow that the *fact* that many people share a *similar* complaint *changes* the reasonableness of rejecting a principle that neglects them, relative to a principle that neglects a single person. (This is the path taken by most solutions, e.g., Scanlon's "Generic Reasons" + Balancing, Kumar, Frick, Otsuka - though they try to minimize the relaxation).
      *   **Relax Strong Numbers-Matter:** Accept that saving the 100 isn't *strictly required* by the numbers alone, but might be permitted based on other factors (agent's prerogative, slight differences in harm/circumstance). (This is generally seen as unacceptable, failing Desideratum 1).
      *   **Relax No Cross-Personal Metric:** Introduce a (limited, non-utilitarian) way to compare complaint strengths across individuals or aggregate complaints in a way that respects individuals but allows magnitude to matter. (This risks collapsing into summing if not carefully constrained).

  *   **The Heavy Lifter Against "Just Add Them Up":**
      **Desideratum 12 (Individual Justificatory Primacy)** is the primary blocker. Summing treats individuals as repositories of complaint-value that can be totalled impersonally. Contractualism insists that justification must be *to each person*: "Why should *I* accept a principle that imposes this burden on *me*?" The utilitarian sum doesn't answer *that* question; it tells the individual their suffering is outweighed *from an external perspective*. Desiderata 8 (Distinguishing source from magnitude) and 13 (No trivializing severe harms) are also crucial blockers against crude summing.

  **Key Takeaways for Your Analysis:**
  *   The tension between individualism and allowing numbers to count is real and central.
  *   **Desideratum 12 (Individual Primacy)** is the bedrock constraint that most directly rules out utilitarian summing.
  *   Solving aggregation requires finding a way for the *prevalence* of a type of complaint to affect the reasonableness of rejecting a principle *without*:
      *   Fundamentally violating individualism (justification must still be addressed *to each individual*).
      *   Creating a common metric for interpersonal comparison that leads to summing.
      *   Trivializing severe harms.
  *   The **Practicality Constraint (16)** is legitimate and rules out solutions requiring infinite pairwise comparisons or impossibly complex calculations. Any viable solution must generate usable rules or heuristics.
  *   Focus on how proposed solutions navigate the relaxation of the Strong Individualism/Strong Numbers-Matter/No Metric triad while respecting the core non-negotiable constraints.

  Now you can evaluate proposed solutions against this spec. Look for where they relax the triad, how they handle the key cases (especially 1, 4, 6), and whether they provide a plausible account of reasonable rejection that respects the distinctions and constraints. Good luck!
