  ## BUREAU OF CREDENCE ADJUSTMENT (BCA)  
  Field Manual FM 3-04.21: Credence Adjustment Under Conditional Constraint Reporting  
  **Supersedes FM 3-04.21 dated 15 JUN 2023**

  **1. PURPOSE.** This manual prescribes standardized procedures for Field Officers (FOs) to adjust operational quadrant credences upon receipt of conditional constraint intelligence reports. It addresses the unique challenges posed by constraints on conditional credences (e.g., "IF in Red Territory, THEN probability of being at Headquarters is 0.5") as distinct from direct observational reports (e.g., "You see a Headquarters building"). Compliance ensures alignment with Bureau-approved credal states for optimal decision-making in Quadrant Selection Scenarios (QSS).

  **2. SCOPE.** Applies to all BCA personnel operating in standard four-quadrant territories (Red HQ, Red Airborne, Blue HQ, Blue Airborne) when intelligence provides a constraint on a conditional credence, not an unconditional statement about the current quadrant. Does *not* apply to standard conditionalization on observational evidence (see FM 3-04.19).

  **3. THE CONDITIONAL CONSTRAINT CHALLENGE.** Standard Credence Adjustment Procedure (CAP) requires conditioning on a *proposition* (e.g., "I am in Red Airborne"). Conditional constraints (CCs) *do not constitute such a proposition*. They express a relationship between hypotheticals. Attempting standard CAP ("conditioning on the constraint") is **PROHIBITED** as it leads to unapproved credal deviations. Example of Prohibited Action: Treating the report "IF in Red, THEN P(HQ|Red) = 0.5" *as if* it meant "The proposition 'P(HQ|Red) = 0.5' is true," and conditioning the prior on that proposition.

  **4. APPROVED UPDATE PROCEDURES.** The Bureau recognizes two Approved Constraint Assimilation Methods (ACAMs) for processing CCs submitted via Form BC-7 ("Conditional Constraint Report"):
      *   **4.1. ACAM-M (Material Conditional Method):** Adjusts credence *as if* conditioning on the material conditional statement corresponding to the constraint. For the constraint "IF A, THEN P(B|A)=X", this is the proposition "(Not A) OR (B and the probability of B given A equals X)". Results depend on the prior. **Note:** This method may significantly alter credences in regions *not* directly addressed by the constraint (e.g., Blue territory).
      *   **4.2. ACAM-K (Kullback-Leibler Minimization):** Adjusts credence to the *closest* probability distribution (in the information-theoretic sense) satisfying the new constraint, relative to the prior. **Note:** This method minimizes global changes but requires complex computation (Refer to BCA Computational Supplement CS-8).
      *   **4.3. Selection of ACAM:** Officers **MUST** select either ACAM-M or ACAM-K on Form BC-7, Section 4a. **WARNING:** ACAM-M and ACAM-K **DO NOT** generally produce the same posterior credence distribution. The Bureau considers both valid within their operational paradigms. Consistency within a single mission timeline is mandatory.

  **5. NON-COMMUTATIVITY OF CONSTRAINT UPDATES (CRITICAL).** Credence adjustments based on sequential CCs **ARE ORDER-DEPENDENT**. Updating first on Constraint A then Constraint B **WILL NOT** yield the same posterior as updating first on Constraint B then Constraint A. Example:
      *   **Scenario:** Prior distribution P0. Update A: "IF Red, THEN P(HQ|Red) = 0.8". Update B: "IF Blue, THEN P(HQ|Blue) = 0.3".
      *   **Result A then B:** Posterior = [ACAM applied to P_A using Constraint B]
      *   **Result B then A:** Posterior = [ACAM applied to P_B using Constraint A]
      *   **P_A_then_B ≠ P_B_then_A** (Generally).

  **6. SIMULTANEOUS CONSTRAINT REPORTING REQUIREMENT.** To mitigate the risks of non-commutativity (Section 5) and ensure a unique, order-independent posterior credence, officers receiving multiple CCs during a single operational phase (defined as the interval between confirmed unconditional observations) **MUST** file all relevant Form BC-7s **SIMULTANEOUSLY**.
      *   **6.1. Procedure:** Accumulate all CCs received within the operational phase. Submit all completed Form BC-7s in a single bundle to the BCA Field Processing Unit (FPU) at the phase end.
      *   **6.2. Processing:** The FPU will process all constraints within the bundle as a single, simultaneous update event using the selected ACAM (M or K) consistently across all forms. **Note:** The specific mathematical implementation for simultaneous multiple constraints under ACAM-M or ACAM-K is detailed in CS-8 and is the responsibility of the FPU.
      *   **6.3. Rationale:** Simultaneity guarantees a unique posterior, eliminating order-dependence ambiguity. Failure to report simultaneously may result in non-compliant, order-dependent credences and disciplinary action under BCA Regulation 12-C.

  **7. PRIOR CREDENCE DEPENDENCE & CLASSIFICATION.** The posterior credence distribution resulting from any CC update **DEPENDS CRITICALLY** on the prior distribution held at the time of update.
      *   **7.1. Standardized Prior:** Officers are issued the current BCA Standard Operational Prior (SOP) for their territory at mission start (Annex Delta, Classified).
      *   **7.2. Classification:** The SOP is **CLASSIFIED LEVEL 3**. Officers are not authorized to know the specific numerical values of the SOP. Adjustments are performed by the FPU using the classified SOP as input.
      *   **7.3. Constraint Satisfaction Check:** Before processing a CC, the FPU will verify if the constraint is *already satisfied* by the current prior (SOP or posterior from previous phase). If satisfied, the constraint imposes no new information and the credence distribution **WILL NOT CHANGE**. A Form BC-7 **MUST STILL BE FILED** with Section 4b ("No Change - Constraint Satisfied") checked. Paperwork compliance is essential for audit trails.

  **8. FREQUENTIST ADVISORY MEMORANDUM (DISSENTING OPINION)**
  *   **TO:** BCA Director
  *   **FROM:** Dr. A. Nalist, Senior Statistician (Frequentist Liaison)
  *   **SUBJ:** Objections to FM 3-04.21 Procedures
  *   **DATE:** 19 OCT 2024
  *   This memorandum constitutes a formal objection to the procedures outlined in FM 3-04.21. The entire framework is fundamentally unsound. "Credence adjustment" based on subjective priors (classified or not) and ambiguous "constraints" on conditional probabilities lacks rigorous frequentist definition. There is no well-defined repeatable experiment or long-run frequency interpretation for a soldier's *single* location belief updated by a vague conditional report. The proposed ACAMs (M and K) are arbitrary choices minimizing different subjective loss functions, not procedures yielding objectively verifiable estimators. The dependence on an unknown, classified prior renders the entire posterior scientifically meaningless. The non-commutativity and simultaneity requirements highlight the inherent subjectivity and instability of the approach. Frequentist inference requires observable data and testable models, not belief adjustments based on unsupported conditionals. I cannot endorse these methods as statistically valid. Recommend suspension of FM 3-04.21 pending review by the Office of Objective Statistical Methods.

  **9. SUMMARY.** Field Officers encountering conditional constraint intelligence must:
      a)  **CEASE** attempts at standard Conditionalization (CAP).
      b)  **RECORD** the constraint precisely on Form BC-7.
      c)  **SELECT** ACAM-M or ACAM-K (Section 4a).
      d)  **ACCUMULATE** all CCs within an operational phase.
      e)  **SUBMIT** all BC-7s for the phase **SIMULTANEOUSLY** to FPU.
      f)  **AWAIT** FPU computation using the classified SOP.
      g)  **IMPLEMENT** the BCA-issued posterior credence for decision-making.
  Failure to comply jeopardizes credal alignment and operational effectiveness.

  **// SIGNED //**  
  J. UDGEMENT  
  Director, Bureau of Credence Adjustment

  **DISTRIBUTION:** X  
  **BCA FPU USE ONLY**  
  **SOP ANNEX DELTA ATTACHED (CLASSIFIED LEVEL 3)**
