prompt: |-
  I run the intangible-heritage register for a mid-sized city's culture office. We recieve maybe twenty nominations a year, the decisions get published, and the last time we turned one down the group went to the local paper saying we'd called their heritage fake — so I want a procedure my two-person team can actually run on a nomination, built out of the Hobsbawm and Anderson stuff about invented tradition and imagined communities, instead of vibes. Specifically I want the order of questions: how to tell a living custom, which is allowed to drift and change, from an invented tradition, which insists on invariance and a continuity that's largely factitious; how to test an ancientness claim when we're never going to get archival proof; what to make of the moment of invention, i.e. does the claimed origin line up with a period of fast change, a redevelopment, a new state, a tourism push; who did the inventing and who benefits; and that census-map-museum thing Anderson does, where the state standardises and classifies the practice it later claims to have discovered. Anderson's point that being imagined doesn't make a community false has to survive into the procedure, so don't let the whole thing collapse into "recent equals inauthentic", and flag where the procedure has to stop and hand the call to a person because it's a question about what the city wants to be rather than a question of fact — final sign-off is my director, who's an administrator, not a folklorist. Then run it on the three nominations on my desk: a paper-lantern procession in the old fishing quarter, billed as centuries old, but only documented from 1981, when a residents' association formed to fight a redevelopment and a schoolteacher wrote the song and the costumes; a saint's day with continuous records back to the 1700s whose content changes every single year — route, effigy, date — but which the nomination insists is an unchanging ritual; and a weaving pattern one family calls ancestral, which a state folklore institute standardised in the 1960s for a national exhibition and which the neighbouring village also claims. Which of these can I say no to, and which does the procedure make me say yes to even though I don't want to?
reasoning: |-
  Okay, the user manages an intangible heritage register for a city's culture office. They get about twenty nominations a year and faced backlash when one was rejected, leading to accusations of calling heritage "fake." They need a systematic procedure based on Hobsbawm and Anderson's concepts to evaluate nominations without relying on "vibes." 

  First, I need to recall Hobsbawm's "invented tradition" and Anderson's "imagined communities." Hobsbawm distinguishes between traditions that evolve naturally and those constructed with enforced invariance. Anderson's idea is that all communities are imagined but still real in their social impact. The key is to avoid equating recent origins with inauthenticity.

  The user outlined specific elements: distinguishing living customs from invented traditions, testing ancientness claims without archival proof, checking if the origin aligns with periods of change (like redevelopment or tourism), identifying beneficiaries, and Anderson's census-map-museum triad where the state standardizes practices it later "discovers."

  The procedure must flag when decisions shift from factual analysis to policy—since the director, an administrator, has final say. Also, applying it to three current nominations: a lantern procession, a saint's day with changing elements, and a weaving pattern standardized by the state.

  For the lantern procession: Documented from 1981 during a redevelopment fight. The residents' association formed then, with a schoolteacher creating the song and costumes. It's presented as centuries old. This screams invented tradition—enforced continuity, recent origin during urban change, beneficiaries are the residents fighting redevelopment. But it's a living community practice now. The procedure might require including it despite its invented roots because it's become meaningful.

  The saint's day: Continuous since the 1700s but changes annually—route, effigy, date. The nomination claims it's unchanging, which is factitious. But the practice itself is clearly a living custom due to its adaptability. The contradiction in the nomination is a red flag, but the tradition's longevity and evolution suggest it's authentic. Here, the procedure would approve it, highlighting its dynamic nature.

  Weaving pattern: Called ancestral by one family but standardized by a state institute in the 1960s for an exhibition. Neighboring village also claims it. The state intervention via the folklore institute fits Anderson's museum phase. The standardization likely overshadowed local variations. Both families might have legitimate claims, but the state's role complicates it. Since it's tied to a specific family now, excluding others, it might be problematic. The procedure could reject this nomination unless it acknowledges the broader community or the state's role.

  The challenge is balancing theoretical criteria with real-world implications. The lantern case might get approved because it fosters community identity, even if invented recently. The saint's day is a clear yes due to its historical continuity and evolution. The weaving pattern might be a no because it's exclusionary and state-co-opted, unless reframed.

  The user's deeper needs: They want to avoid public relations nightmares, ensure decisions are defensible, and have a clear methodology that justifies inclusions/exclusions without dismissing community sentiments. They need the procedure to handle ambiguity and signal when it's a policy call, protecting the team from backlash.
answer: |-
  Here's a procedural framework based on Hobsbawm & Anderson, designed for practical application by a small team, followed by an analysis of your three cases. The core principle is **"Does this practice function as a *meaningful social glue* for a contemporary community, and is its presentation factually honest?"** – not "Is it ancient?"

  **Procedure: Evaluating Intangible Heritage Nominations**

  **Phase 1: Initial Documentation & Claim Review (Fact-Gathering)**
  1.  **Nomination Materials:** Record claimed origin date, key elements (song, route, pattern, ritual actions), claimed invariance/stability, and community group involved.
  2.  **Basic Fact-Checking:**
      *   **Earliest Documentation:** What's the *actual* earliest verifiable record (photo, newspaper, council minute, association record, oral history recording)? Note the date and source.
      *   **Continuity:** Is there evidence of *any* practice existing prior to the claimed origin date? Is there evidence of breaks? (Don't require unbroken proof, look for *any* corroborating shreds).
      *   **Key Element Provenance:** Traceable origin of specific elements (e.g., song written by X in 19XX, pattern published by Y Institute in 19ZZ).

  **Phase 2: Hobsbawm & Anderson Analysis (Structured Questions)**
  *   **A. Living Custom vs. Invented Tradition (Hobsbawm Focus):**
      *   *Question 1 (Invariance Claim):* Does the nomination *insist* on strict invariance/unchanging nature, especially regarding specific elements (costumes, song, route, pattern)? (Hobsbawm's hallmark of invented tradition).
      *   *Question 2 (Observed Change):* What documented changes exist (dates, routes, elements added/dropped, participants)? How does this compare to the invariance claim? (Significant change *contradicting* an invariance claim is a red flag for invention).
      *   *Question 3 (Adaptability):* Is there evidence the practice naturally adapts to new circumstances (urban change, new materials, different demographics)? (Suggests living custom).
      *   *Question 4 (Formalization):* Was there a specific moment/group responsible for defining/codifying the practice *as it exists today*? (Common in invention).
  *   **B. Context of Origin/Revival (Hobsbawm/Anderson Synthesis):**
      *   *Question 5 (Context Check):* Does the claimed origin date or period of significant formalization (from Q4) align with any of these?
          *   Major urban redevelopment/planning change?
          *   Significant political change (new state, local government)?
          *   Rise in tourism promotion?
          *   Formation of a specific association/committee?
          *   External threat (economic decline, cultural suppression)?
      *   *Question 6 (Beneficiaries/Initiators):* Who initiated/formally defined the practice (Q4)? Who benefits most *from its current recognition* (tourism, community cohesion, political capital, specific businesses/families)? Is this the same group claiming ancient continuity?
  *   **C. State/Cultural Institutional Role (Anderson Focus):**
      *   *Question 7 (Census-Map-Museum):*
          *   *Census:* Was the practice (or elements like the pattern) ever formally categorized, named, or standardized by a state body (folklore institute, museum, ministry)?
          *   *Map:* Was its "authentic" location or association fixed by such bodies?
          *   *Museum:* Was it displayed, performed, or "codified" for official exhibitions, publications, or national/international presentation?
      *   *Question 8 (Discovery Narrative):* Does the nomination present the practice as "rediscovered" or "saved" by an official body *after* that body standardized/categorized it? (Classic Andersonian move).

  **Phase 3: Synthesis & Recommendation (Human Judgment)**
  *   **Synthesize Findings:** Map answers to the questions above. Does the evidence point towards:
      *   A **Living Custom:** Documented change/adaptation, no strong invariance claims, organic development, community participation beyond a single formal group? (Likely **Accept**)
      *   An **Invented Tradition:** Insistence on invariance contradicted by evidence, formalization at a specific recent point linked to external pressures, clear initiators/beneficiaries? (Requires deeper look at *current* social function).
      *   **State-Mediated Tradition:** Clear evidence of standardization/institutionalization (Q7), potentially obscuring prior diversity or authentic local evolution? (Complex – focus on *current* community meaning).
  *   **Core Question - Social Function:** **REGARDLESS** of origin or invention, does this practice *currently* function to bind a recognizable community (neighbourhood, practitioners, ethnic group, etc.)? Is it actively maintained and transmitted? (This is the *essential* criterion for ICH).
  *   **Authenticity vs. Honesty:** The key isn't ancient origin, but **honesty in presentation**. Can the nomination acknowledge documented changes or origins without undermining its value? Can the "invented" aspect itself be part of its heritage story (e.g., community resilience during redevelopment)?
  *   **Flag for Administrative Decision:**
      *   Flag if the primary issue is **factual misrepresentation** (e.g., claiming 300 years when evidence shows 40) that cannot be reconciled.
      *   Flag if the primary issue is **exclusionary claims** (e.g., one family claiming exclusivity despite wider history/state mediation) creating community conflict.
      *   Flag if the primary issue is **values/policy** (e.g., does the city want to endorse a tradition heavily commercialized by tourism, or one used for political exclusion?). *Explicitly state: "This is not a question of heritage authenticity under our criteria, but a policy decision for the Director regarding community harmony/economic focus/etc."*
  *   **Recommendation:** Based on social function and honesty, recommend Accept, Reject, or Accept with Revised Documentation (encouraging nomination group to adjust claims to match evidence).

  **Applying the Procedure to Your Nominations:**

  1.  **Paper-Lantern Procession (Fishing Quarter):**
      *   **A1 (Invariance):** Likely claimed as "ancient/unchanging" (implied by "centuries old").
      *   **A2 (Change):** Documented origin 1981 (association formation, song/costume creation). *Contradicts invariance claim.*
      *   **A3 (Adaptability):** Created *for* adaptation (fighting redevelopment) – but recent. Adaptability potential unknown.
      *   **A4 (Formalization):** Clear moment: 1981, Residents' Association, Schoolteacher.
      *   **B5 (Context):** Direct link to redevelopment threat (classic Hobsbawm context).
      *   **B6 (Beneficiaries):** Residents' Association (community cohesion, political leverage against redevelopment). They are the claimants.
      *   **C7 (State Role):** Possibly minimal at origin? (Unless council records show involvement).
      *   **C8 (Discovery):** Unlikely.
      *   **Synthesis:** **Classic Invented Tradition.** Insistence on ancient invariance is factitious. Formalized recently in response to specific threat.
      *   **Social Function:** HIGH. Clearly binds the fishing quarter community, created for resilience.
      *   **Honesty Issue:** MAJOR. The "centuries old" claim is demonstrably false.
      *   **Recommendation:** **Conditional Accept / Accept with Revised Documentation.** The *practice itself* has clear social value and function since 1981. **Require the nomination group to revise the historical claim** to accurately reflect the 1981 origin as an act of community resilience. Frame it *as* heritage of resistance/adaptation. If they refuse to amend the demonstrably false claim, rejection is justified on grounds of factual misrepresentation. **Flag:** Director needs to support staff on insisting on historical accuracy.

  2.  **Saint's Day (Continuous since 1700s, Changes Yearly):**
      *   **A1 (Invariance):** Nomination *insists* it's unchanging. **Key Red Flag.**
      *   **A2 (Change):** Documented changes every year (route, effigy, date)! *Directly contradicts the nomination's claim.*
      *   **A3 (Adaptability):** HIGH. Actively changes yearly – this *is* its living nature.
      *   **A4 (Formalization):** Unlikely a single moment, evidence suggests organic change.
      *   **B5 (Context):** Continuous since 1700s – changes likely reflect ongoing adaptation to centuries of contexts, not one "invention" moment.
      *   **B6 (Beneficiaries):** Presumably the community/parish maintaining it. Claimants seem to be the organisers.
      *   **C7/C8 (State Role):** Unknown, but less relevant given long continuity.
      *   **Synthesis:** **Living Custom** with a **factitious invariance claim.** The *practice* demonstrates healthy evolution. The *nomination* is problematic.
      *   **Social Function:** HIGH. Long continuous practice, active participation implied.
      *   **Honesty Issue:** MAJOR. The claim of invariance is contradicted by the practice's well-documented fluidity.
      *   **Recommendation:** **Conditional Accept / Accept with Revised Documentation.** The *tradition itself* is clearly legitimate ICH. **Require the nomination group to revise their description** to accurately reflect and *celebrate* its dynamic, evolving nature as a strength. Emphasize the *process* of annual negotiation/adaptation as part of the heritage. If they refuse to drop the demonstrably false invariance claim, rejection is justified. **Flag:** Less risky pushback than the lanterns, as the core practice is undeniably old.

  3.  **Weaving Pattern ("Ancestral" Family, Standardized 1960s):**
      *   **A1 (Invariance):** Claimed as "ancestral" (implies ancient, unchanging family tradition).
      *   **A2 (Change):** Standardized by State Folklore Institute in 1960s. Prior diversity likely existed. Neighbouring village claims it.
      *   **A3 (Adaptability):** Standardization *reduced* adaptability/flexibility. Frozen form.
      *   **A4 (Formalization):** Clear moment: 1960s, State Institute for National Exhibition.
      *   **B5 (Context):** Nationalism/State-building era (common for folklore standardization).
      *   **B6 (Beneficiaries):** State Institute (national identity project). The *family* benefits *now* from exclusive claim based on state standardization.
      *   **C7 (State Role):** **Explicit Census-Map-Museum:** Standardized (Census), likely fixed association (Map), displayed nationally (Museum).
      *   **C8 (Discovery):** Highly likely – State "standardized" it, now family presents this *standard* as their unique "ancestral" heritage.
      *   **Synthesis:** **State-Mediated Tradition** presented as exclusive family heritage. The "ancestral" claim is likely factitious *for the specific standardized form*. The state created the "standard" now claimed as ancient and exclusive.
      *   **Social Function:** MIXED/COMPLEX. Meaningful to the *family*, but claim of exclusivity creates conflict with neighbouring village. Broader regional weaving heritage exists.
      *   **Honesty Issue:** SEVERE. Claiming exclusive ancestral rights to a pattern standardized by the state 60 years ago is highly misleading. Erases state role and prior regional diversity.
      *   **Recommendation:** **Reject this specific nomination (as exclusive family heritage).** The *pattern itself* has heritage value, but the nomination is fundamentally dishonest and exclusionary. **Alternative Paths:**
          *   Encourage a **regional nomination** for the weaving tradition *acknowledging* the state standardization in the 1960s as part of its history, involving both villages/families.
          *   If the *technique* or *broader tradition* within the family is genuinely ancestral *beyond this specific pattern*, encourage a nomination focused on that.
      *   **Flag:** This is the clearest **Reject** based on factual misrepresentation and creating community conflict via an exclusionary claim built on state mediation. The Director must be prepared for family pushback, but the evidence is strong. **Policy Point:** Does the city want to endorse exclusive claims based on state standardization?

  **Summary Answers:**

  *   **Which can you say No to?** **The Weaving Pattern nomination (as presented).** The claim of exclusive family ancestry for the state-standardized pattern is demonstrably misleading and exclusionary. This is the strongest case for rejection under the procedure.
  *   **Which does the procedure make you say yes to even though you don't want to?** **Potentially the Lantern Procession, IF they revise their historical claim.** You might dislike its recent, invented nature and the group's pushiness, but its *current* social function for the fishing quarter is strong. The procedure forces you to accept its validity *as heritage* if presented honestly (as a 1981 community action). **The Saint's Day** is an easy "Yes" on the practice itself, but the procedure forces you to confront *and demand correction of* their false invariance claim. You might not *want* that fight, but the procedure mandates addressing the factual misrepresentation.

  **Key for Your Director:** Frame rejections/non-acceptance *never* as "fake heritage," but as:
  1.  **Insufficient Evidence for Specific Claims** (e.g., "We found no evidence supporting the 300-year origin claim for the lanterns; the documented origin is 1981").
  2.  **Factual Inconsistency in Nomination** (e.g., "The Saint's Day nomination claims invariance, but your own records show annual changes").
  3.  **Exclusionary Claims Contrary to ICH Principles** (e.g., "The weaving nomination claims exclusive family ownership of a pattern standardized by the National Institute in the 1960s, which is also practiced in [Neighbouring Village]").
  4.  **Policy Decision** (e.g., "While historically significant, the Director has decided not to list practices primarily driven by commercial tourism operators at this time" – use sparingly!).

  This procedure provides an objective framework rooted in theory, focuses on current social function over impossible origin proofs, demands honesty, and clearly flags where administrative judgment is needed. It moves you decisively beyond "vibes".
