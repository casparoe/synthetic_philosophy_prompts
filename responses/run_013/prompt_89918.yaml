prompt: |-
  Ok so my old roommate and I have been going at this for like three weeks now — she's in law school and is convinced that all the "what did they really mean" stuff is just vibes, and I keep telling her Grice basically built a whole machine for exactly this, but the more cases I collect the less I can get my own verdicts to fall out of one clean principle, and it's driving me nuts. Can you act as a philosopher of language / pragmatics person and help me do some reflective equilibrium on my own guts here? Please think carefully before committing, and maybe start by laying out the candidate distinctions on the table (entailment, presupposition, conversational implicature, conventional implicature, and plain non-literal speaker meaning), because I keep sliding between them and I suspect that's half my problem.

  Here are my verdicts, going by gut. "Some of the students passed" — I'm sure this implicates that not all did; if someone said it and everyone had passed, I'd feel misled, not lied to. "It's cold in here," said to the person sitting next to the open window — I'm sure the speaker means "please close the window." Then "John has three kids" — and here's the thing, I do NOT feel this implicates "exactly three." But wait, if he turns out to have four I'd feel a little misled too, so I'm torn, but it doesn't feel like an implicature to me; it feels more like the word just means exactly three. Which then bugs me: why does "some" get the weaker literal reading plus an implicature, while "three" seems to get the strong reading baked right in? A bus driver waving people off with "the bus is full," one seat actually left — I think he's not lying, he means you can't get on, but that's speaker meaning, not the sentence. "She's from Yorkshire, so she must be stubborn" — I think the "so" adds a claim (that the Yorkshire thing explains the stubbornness) that you can't cancel and that isn't really an implicature either; it's said, just not the main point. "Great weather, huh," in a downpour — she means roughly the opposite, and I'm pretty sure that's not an implicature at all, it's some other mechanism. "He didn't manage to fix it" — implies he tried; implicature, presupposition, or entailment, I genuinely can't tell and it bugs me. And finally, "Some passed — in fact, all of them" sounds totally fine, no contradiction, but "she's from Yorkshire, so she's stubborn — actually she's not stubborn at all" sounds like I just contradicted myself.

  My own tentative principle was gonna be: an implicature is whatever the speaker can deny without contradicting herself (call it the denial test). It handles "some" and maybe "didn't manage," but I think it mangles the "so" case, and I'm not even sure it touches the "three" case. So: is there a principle, or a small set of principles, that gets all or most of these — and if I have to, which of my verdicts do I give up to get it? State each candidate precisely, tell me which case motivates each clause, run it on two cases I haven't listed, and be honest about which of my gut verdicts it just can't save. I don't need reading recommendations or who said what, I need the principle itself.
