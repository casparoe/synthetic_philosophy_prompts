answer: |-
  I appreciate the precision and depth of your question—you're wrestling with the exact tensions that make pragmatics fascinating. Let's build a unified framework step by step, starting with clear definitions and diagnostic tests, then applying them to your cases. Your intuitions are largely correct; the inconsistencies arise from missing one key principle about **scalarity**.

  ### Core Definitions & Diagnostic Tools
  1. **Entailment**: Logical necessity. If S is true, E must be true. *Test*: If E is false, S must be false.  
     - *Motivation*: "John has three kids" → If he has two, the sentence is false.  

  2. **Presupposition**: Background assumption that must hold for S to be meaningful. *Test*: Presupposition survives negation ("John didn't manage to fix it" still implies he tried).  

  3. **Conversational Implicature (CI)**: Contextual inference from Gricean maxims (Quantity, Quality, Relation, Manner). *Test*: **Deniability** (cancellable without contradiction) + **Reinforceability** (can be strengthened explicitly).  
     - *Motivation*: "Some passed" → "In fact, all did" is non-contradictory.  

  4. **Conventional Implicature (ConvI)**: Non-truth-conditional meaning attached to specific words (e.g., "so", "but"). *Test*: **Non-cancellable** (denial creates contradiction) but **non-at-issue** (not the main assertion).  
     - *Motivation*: "She's from Yorkshire, so she's stubborn" → Denying the explanation ("...but that's not why") feels incoherent.  

  5. **Non-Literal Speaker Meaning**: Irony, metaphor, indirect speech acts. *Test*: Literal meaning clashes with context; hearer must reconstruct intended meaning.  
     - *Motivation*: "Great weather, huh" in a downpour.  

  ---

  ### The Unified Principle: The **Scalarity Threshold**
  > **An utterance triggers a scalar implicature iff:**  
  > (a) It contains a scalar term (e.g., quantifiers like "some", numbers like "three", modals like "possible");  
  > (b) The term occupies the **weakest position** on a contextually relevant scale (e.g., <some, most, all>);  
  > (c) The speaker is **epistemically positioned** to use a stronger term but deliberately avoids it.  
  >   
  > **Otherwise**, strengthenings are:  
  > - **Entailments** if truth-conditional ("three kids" ≠ four).  
  > - **Conventional Implicatures** if lexically encoded ("so", "but").  
  > - **Non-literal meanings** if context overrides literal sense ("bus is full").  

  ---

  ### Application to Your Cases
  | Example                      | Your Verdict                   | Framework Analysis                               | Why It Fits                          |
  |------------------------------|--------------------------------|--------------------------------------------------|--------------------------------------|
  | **"Some students passed"**   | CI (not all passed)           | **Scalar CI**: Weakest on <some, most, all> scale. Cancellable. | ✅ Fits (a)(b)(c): Speaker could say "all" but didn't. |
  | **"It's cold in here"**      | Non-literal ("close window")  | **Indirect Speech Act**: Literal + context → request. | ✅ Non-literal; no scalar term. |
  | **"John has three kids"**    | Entailment (exactly three?)   | **Entailment** for ≥3; **Scalar CI** for "exactly three" *in some contexts*. | ⚠️ **Revise verdict**: Literally means "at least three". "Exactly three" is a scalar CI *only if* context implies a scale (e.g., "How many kids? Three" → CI: not more). Otherwise, no CI. |
  | **"Bus is full"**            | Non-literal (can't board)     | **Frame-Driven Non-Literal Meaning**: "Full" pragmatically means "no more can board" in bus contexts. | ✅ Not truth-conditional; exploits situational norms. |
  | **"She's from Yorkshire, so stubborn"** | ConvI (explanation link) | **Conventional Implicature**: "so" encodes causal link. Non-cancellable. | ✅ Fits ConvI test: Denial creates contradiction. |
  | **"Great weather, huh"** (rain) | Non-literal (irony)         | **Irony**: Literal meaning inverted by context. | ✅ Non-literal; no implicature. |
  | **"He didn't manage to fix it"** | Presupposition (he tried)   | **Presupposition**: "Manage" triggers "attempted". Survives negation. | ✅ Passes negation test: "He didn't manage..." still implies trying. |
  | **"Some passed—in fact, all"** | Fine (CI cancelled)          | **Scalar CI**: Explicit cancellation is coherent. | ✅ Confirms CI status. |
  | **"She's from Yorks, so stubborn—but not stubborn"** | Contradictory | **Conventional Implicature**: "so" forces the link; denial fails. | ✅ ConvIs aren't cancellable. |

  ---

  ### Resolving the "Three Kids" Paradox
  - **Literal meaning**: "at least three" (entailment: he has ≥3 kids).  
  - **Strengthening to "exactly three"**:  
    - **Not automatic**: If no scalar context exists, no implicature arises.  
    - **Scalar CI only when**:  
      (i) Context implies a scale (e.g., Q: "How many kids?" A: "Three" → CI: not more).  
      (ii) Speaker is expected to know the exact number.  
  - **Why you feel misled if he has four**:  
    - In most contexts, stating "three" implies the speaker is specifying the *exact* number (scalar CI). If untrue, it violates the **Maxim of Quantity** (underinforming).  

  **Contrast with "some"**: "Some" is inherently scalar (always weakest on its scale), so CI always arises. "Three" is only scalar when context makes it part of a scale (e.g., reporting a precise count).

  ---

  ### Testing on New Cases
  1. **"I ate some of the cake"**  
     - **Framework**: Scalar CI → "not all". Cancellable ("...actually, I ate it all").  
     - **Principle at work**: "some" is weakest on <some, all> scale (b).  

  2. **"You *could* be right"** (in a debate)  
     - **Framework**: Scalar CI → "but you're probably not". Weakest on <could, must> epistemic scale.  
     - **Principle**: (a)(b)(c) apply; speaker avoids stronger "must" to imply doubt.  

  ---

  ### Which Verdicts Must Be Revised?
  - **Give up**: "John has three kids" **does not** lexically mean "exactly three".  
    - *Why*: The "exactly" reading is a context-dependent scalar CI, not entailment. Your feeling of being misled when he has four is due to the CI (when context invokes a scale), not semantic falsity.  
  - **Keep**: All other verdicts are correct under the framework.  

  ### The Final Principle Set
  1. **Scalarity Test**: Is the term part of a contextually activated scale? If weakest and speaker avoids stronger term → **Scalar CI**.  
  2. **Negation Test**: If meaning survives negation → **Presupposition**.  
  3. **Denial Test**: If deniable without contradiction → **CI** or **non-literal**; if denial creates incoherence → **ConvI** or **entailment**.  
  4. **Literalness Test**: If literal meaning clashes with context → **non-literal speaker meaning**.  

  This reconciles your intuitions by adding scalarity as the linchpin. The law-school roommate is half-right: "vibes" (context) *interact* with linguistic machinery—it's not arbitrary, but systematic. Grice’s machine runs on scalarity fuel.
