prompt: |-
  I have been drawn by lot to sit on a citizens' assembly that our council convened over a contested local question, and the council has now put a second question to us, on which we vote next month: should our recommendations bind them, or remain advisory? Before I cast that vote I want the specification rather than the argument. Write the desiderata that a theory of lottocratic authority — of when a decision made by a randomly selected body has a claim on the rest of us — has to satisfy.

  I am after requirements, each with the case or consideration that generates it: the situations the theory must get right, the distinctions it cannot collapse, the results it must not contradict, and the things it must not simply assume. It needs to answer for at least these:

  - a draw I regard as scrupulously fair returns a body that then decides something I consider a serious injustice; is the theory allowed to say I am nonetheless bound, and what does it have to give up if it does?
  - a body whose membership mirrors the population almost exactly, but whose deliberation is steered by whoever wrote the briefing document and chose the witnesses;
  - a second lottery whose pool is drawn from the alumni of the first, so that service breeds a class of repeat members;
  - a body that votes to entrench its own decisions against reversal by any later assembly;
  - a service that a large fraction of those drawn decline, so that the pool becomes whoever is willing.

  Tell me which of the following are genuine requirements and which are merely the commitments of one camp rather than demands on any theory: the distinction between selecting a body and authorising it; between a body that advises and one that decides; between a body that is a statistical sample of the public and one that stands for it; between the fairness of the draw and the quality of the outcome; between a right to a justification and a right to consent. Then flag any pair of requirements that cannot be jointly met — that is the part I most want, since if descriptive mirroring, genuine deliberation, voluntary service, equal ex ante power, and accountability cannot all hold at once, I need to know which one I am being asked to trade away and why. Tell me which single requirement does the most to exclude the positions people actually hold on this, and close by saying what a theory that survives the list would commit me to when I vote.

  I would rather this not rest on any one country's practice or on the history of any particular assembly; I want the requirements argued from the cases above, so that I can defend them to colleagues who have never read any of this.
reasoning: |-
  Okay, the user is part of a citizens' assembly and needs to vote on whether their recommendations should be binding or advisory. They want a clear set of requirements for when a lottocratic decision should bind others. Let me start by understanding their main concerns.

  First, they provided specific scenarios that any theory must address: a fair lottery leading to an unjust outcome, a demographically perfect but manipulated assembly, a repeat-member class, self-entrenchment, and high opt-out rates. Each of these cases needs to be translated into core requirements.

  Looking at the unjust outcome scenario, this highlights the tension between procedural fairness and substantive justice. The theory must ensure that legitimacy isn't solely based on the lottery's fairness if the outcome is harmful. So Requirement 1 would address the need for substantive limits on authority.

  The manipulated deliberation case points to the importance of genuine deliberation. Even if the group mirrors the population, if their process is steered, the decision isn't truly theirs. That leads to Requirement 2, stressing authentic deliberation.

  The alumni lottery scenario risks creating a professional class, undermining equal opportunity. Requirement 3 would focus on avoiding repeat participation to prevent power concentration.

  Self-entrenchment is about preventing assemblies from making irreversible decisions, which ties into Requirement 4 on reversibility. Future assemblies should have the power to correct mistakes.

  High opt-out rates could skew representation toward those with time or resources. Requirement 5 would emphasize that participation barriers shouldn't compromise representativeness.

  Next, distinguishing genuine requirements from contested commitments. The user listed several distinctions. The selection vs. authorization distinction is crucial because being selected doesn't automatically grant authority. But the advice vs. decide divide is more about implementation than a core requirement. Similarly, statistical sample vs. standing for the public touches on legitimacy but might be part of broader principles. Fairness vs. outcome quality is central, as seen in Requirement 1. The right to justification vs. consent is a deeper philosophical debate but may not be mandatory here.

  Now, checking for conflicts. Authentic deliberation (Requirement 2) might clash with descriptive mirroring under high opt-out rates (Requirement 5). If only certain people participate, the group's composition isn't truly representative. Also, avoiding repeat members (Requirement 3) could conflict with effective deliberation if experienced members enhance quality. But preventing a professional class is more critical for equality.

  The most exclusionary requirement is probably the substantive limits on injustice (Requirement 1), as some theorists prioritize pure procedural legitimacy. This requirement forces the theory to account for moral boundaries, which not all positions accept.

  Synthesizing, a robust theory would require that binding decisions must come from a representative, deliberative body without entrenched power, ensuring decisions are reversible and morally acceptable. For the user's vote, if the assembly meets these criteria (fair selection, meaningful deliberation, no manipulation, etc.), binding recommendations could be justified. Otherwise, advisory might be safer. They need to assess if their assembly's process addresses these requirements, especially deliberation quality and potential biases.
answer: |-
  Here are the core desiderata for a theory of lottocratic authority, derived *strictly* from your specified cases and considerations, argued without appeal to history or specific practice. Each requirement is grounded in the scenario that necessitates it, identifies potential trade-offs, and flags irreducible conflicts.

  ### Core Requirements (Generated from Your Cases)

  1.  **Substantive Limits on Authority (From: Fair draw, unjust outcome)**
      *   **Requirement:** The theory *cannot* hold that procedural fairness *alone* creates an absolute obligation to comply with any outcome, regardless of its substance. A lottocratic decision imposing severe injustice cannot be inherently binding *solely* because the selection was fair.
      *   **Case Generates It:** The "scrupulously fair draw -> serious injustice" scenario forces the theory to confront the limits of procedural legitimacy. It must account for substantive moral boundaries.
      *   **Trade-off:** If the theory *does* say you are bound even to injustice, it must give up any claim that lottocracy inherently produces morally superior outcomes or that legitimacy rests *only* on procedure. It leans heavily on pure procedural justice, accepting potentially bad outcomes as the cost of the fair process.

  2.  **Authenticity of Deliberation (From: Mirrored body, steered process)**
      *   **Requirement:** The theory must demand that the body's deliberation be *authentic* – meaning it must be the product of the members' own reasoning based on balanced information and diverse perspectives, not predetermined or unduly manipulated by external actors controlling inputs.
      *   **Case Generates It:** The "demographically perfect but steered" scenario shows that descriptive representativeness is hollow if the deliberation is not genuinely the assembly's own. Legitimacy requires agency in the deliberative process.
      *   **Trade-off:** Prioritizing authenticity may require significant resources (independent facilitators, diverse witness selection protocols, protected deliberation time) that complicate practical implementation.

  3.  **Avoidance of a Professional Class (From: Second lottery from alumni)**
      *   **Requirement:** The theory must prevent the emergence of a distinct class of "repeat members" who gain disproportionate influence or experience compared to the general populace. Lotteries must be drawn from the *entire* eligible pool for each distinct assembly/question.
      *   **Case Generates It:** The "second lottery from alumni" scenario risks creating a de facto elite with accumulated experience/power, undermining the core lottocratic ideal of equal *ex ante* chance of participation and preventing the concentration of civic power.
      *   **Trade-off:** Excluding experienced participants might reduce deliberative efficiency or depth, but the requirement prioritizes equality of opportunity over potential efficiency gains from experience.

  4.  **Reversibility (From: Body entrenching its own decisions)**
      *   **Requirement:** A lottocratic body cannot legitimately make its own decisions immune to future reversal by subsequent democratic processes (including future lotteries, elections, or referenda). Its authority is bounded in time and scope.
      *   **Case Generates It:** The "entrenchment" scenario violates the fundamental principle that no single body can claim permanent, unalterable sovereignty over a dynamic polity. It risks creating an unaccountable, frozen decision.
      *   **Trade-off:** None. This is a non-negotiable limit inherent in the temporary, delegated nature of a citizens' assembly within a larger democratic system.

  5.  **Mitigation of Self-Selection Bias (From: High decline rate leading to "willing" pool)**
      *   **Requirement:** The theory must address the distortion caused if participation is effectively limited to those willing/able to serve. It cannot ignore that a pool of "the willing" is *not* descriptively representative of the whole populace. Legitimacy requires mechanisms to minimize this bias or account for its effects.
      *   **Case Generates It:** The "high decline rate -> willing pool" scenario demonstrates that the practical pool may systematically exclude those with less time, resources, confidence, or interest, skewing outcomes away from the true population distribution.
      *   **Trade-off:** Ensuring representativeness might require significant compensation (making participation feasible for all), mandatory service (raising liberty concerns), or acknowledging that outcomes reflect "active citizen" views rather than the whole populace.

  ### Distinguishing Genuine Requirements vs. Contested Commitments

  *   **Genuine Requirement:**
      *   **Distinction between selecting a body and authorising it:** Absolutely required. Selection (the lottery) is a *necessary condition* for potential authorization, but not *sufficient*. The case of the "steered deliberation" shows selection alone doesn't confer authority; the process matters. The "unjust outcome" case shows outcomes matter. The theory *must* explain *what else* beyond selection grants authority.
  *   **Contested Commitments (Reflecting Camps, Not Universal Requirements):**
      *   **Distinction between a body that advises and one that decides:** This is primarily about *institutional design* and power dynamics *after* legitimacy is established, not a core requirement *for* legitimacy itself. A theory could argue a legitimately formed/operating assembly *should* decide, or that it *should* only advise – both positions are compatible with different theories meeting the core requirements above. Your vote hinges on *which* design your camp prefers, not on a universal requirement.
      *   **Distinction between a body that is a statistical sample and one that stands for it:** This distinction is often blurred and contested. The "mirrored body steered" case shows statistical mirroring alone is insufficient. The "high decline rate" case shows practical assemblies aren't perfect samples. The core requirement (#2, #5) is about *deliberative agency* and *mitigating bias*, not achieving perfect statistical representation or resolving the philosophical "standing for" question.
      *   **Distinction between the fairness of the draw and the quality of the outcome:** The core requirements (#1, #2) *force* this distinction. Requirement #1 explicitly prevents collapsing legitimacy *solely* into draw fairness, demanding attention to outcomes. Requirement #2 prevents collapsing legitimacy *solely* into descriptive mirroring (an aspect of the "draw" metaphor), demanding attention to process.
      *   **Distinction between a right to a justification and a right to consent:** This is a deep philosophical debate (e.g., Kantian vs. Lockean/Rousseauian). While a good theory might *involve* justification (e.g., deliberative outputs), none of your cases *force* the theory to ground authority specifically in *consent* (which is problematic for *any* collective decision affecting dissenters) rather than in a combination of fair procedure, sound deliberation, and respect for fundamental rights (#1).

  ### Irreconcilable Tensions (Trade-Offs You Must Consider)

  1.  **Descriptive Mirroring vs. Authentic Deliberation vs. Mitigating Self-Selection Bias (Requirements #2, #5):**
      *   **Conflict:** Achieving high descriptive mirroring (a key aspiration) is threatened by high decline rates (Requirement #5). Mitigating this via high compensation or mandatory service impacts feasibility and liberty. Furthermore, ensuring authentic deliberation (Requirement #2 – balanced briefings, skilled facilitation) requires significant resources and structure that might subtly influence outcomes or be perceived as manipulation, potentially conflicting with a pure "mirror" ideal. *You cannot perfectly achieve all three simultaneously.*
      *   **Trade-Off Implication:** You must decide what matters most: strict representativeness (prioritizing mirroring, accepting less "pure" deliberation or bias mitigation challenges), robust deliberation (prioritizing process quality, accepting less perfect mirroring), or feasibility/liberty (accepting some self-selection bias).

  2.  **Equal Ex Ante Power vs. Deliberative Quality (Implied by #3, #2):**
      *   **Conflict:** Strictly preventing a professional class (Requirement #3) ensures equal *ex ante* power but excludes experienced members who might enhance deliberative depth and efficiency (Requirement #2). *Maximizing one potentially diminishes the other.*
      *   **Trade-Off Implication:** Do you prioritize strict equality of opportunity and prevention of elite formation, or potential gains in the quality of the deliberative output through experience? Requirement #3 forces a choice towards equality.

  ### The Most Exclusionary Requirement

  *   **Requirement #1 (Substantive Limits on Authority)** does the most to exclude existing positions. It explicitly rejects **pure proceduralism** – the position that a decision is binding *solely* because it was made via a fair lottocratic process, regardless of its content. Many proponents of lottocracy lean heavily on procedural fairness. This requirement forces the theory to incorporate substantive moral boundaries, which pure proceduralists explicitly deny is necessary for political obligation in this context.

  ### What a Surviving Theory Commits You To

  A theory satisfying these requirements would commit you to vote **FOR binding recommendations ONLY IF** the assembly's process robustly meets the core demands:

  1.  **Substantive Safeguards Exist:** The mandate/question posed doesn't risk flagrant injustice, or mechanisms exist to filter such outcomes (e.g., judicial review, defined scope).
  2.  **Authentic Deliberation Occurred:** The process was demonstrably balanced, well-facilitated, evidence-based, and free from undue manipulation.
  3.  **No Elite Formation:** This is a one-off assembly (or repeat membership is strictly limited/rotated).
  4.  **No Entrenchment:** The recommendations are open to future democratic revision.
  5.  **Bias Mitigated:** Significant efforts were made to enable broad participation and minimize the skew from self-selection (e.g., high compensation, outreach).

  **If these conditions are met,** the theory argues the assembly earned legitimate authority through fair selection *plus* authentic deliberation *within* necessary substantive and structural bounds. Its decisions have a strong claim to be binding. **If these conditions are not met** (especially #1, #2, #5), the theory would hold the recommendations should remain advisory, lacking the full legitimacy required to compel obedience regardless of substantive disagreement. Your vote, therefore, hinges on your assessment of *this specific assembly's process* against these criteria.
