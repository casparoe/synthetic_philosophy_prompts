prompt: |-
  I'm in a philosophy of biology reading group and we keep circling the same question: what does it even mean to say a trait has a function? Roughly, there's the historical camp -- a trait's function is whatever it was selected for, so a trait can have a function even when it's doing nothing useful right now, and something brand new with no selection history has no function at all -- and the systems camp, where a trait's function is just whatever causal contribution it currently makes to some capacity of the larger system it sits in, no history required. Every time we try to make them come apart someone drags out the same tired examples (the heart, eyes, a heart that assembles itself in a swamp by sheer accident) and the discussion dies.

  What I want instead is a case engineered to order where the two accounts agree that a trait has a particular function F, but then disagree about whether a particular token of that trait -- this individual organism's trait, right now -- counts as malfunctioning. So the fight is specifically over malfunction, not over what the function is. Constraints: a real-ish organism (no swamp creatures, no invented aliens, no sci-fi), the trait should be a behavior or a developmental feature rather than an organ, and the verdicts have to fall out of the two theories on their own -- you can't just stipulate that the trait is broken or working. If you find the specification can't be met as stated, say so and tell me which part of it is doing the impossible work, then give me the closest case you can.

  After the scenario: walk through what each account says about whether this token is malfunctioning and why, tell me which single feature of the case is doing the work and what happens to the verdicts if I remove it, and say how a defender of each side would try to defuse the case. One paragraph for the scenario, then the analysis; keep the whole thing under 600 words.
