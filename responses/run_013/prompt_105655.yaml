  The user explicitly says they don’t want a reading list—they want conceptual clarity. So I should avoid jargon overload and focus on mapping the landscape.  

  Hmm. The closest umbrella term is indeed **Pascal’s Mugging**, coined by Eliezer Yudkowsky. It perfectly captures the coercion-by-hypothetical-stakes dynamic. But I should also acknowledge:  
  - The **infinite utility trap** as the broader mathematical issue.  
  - How **Knightian uncertainty** (unknown probabilities) vs. **known low probabilities** might differ in severity.  

  For boundaries:  
  - **Finite vs. infinite stakes**: "Really big" payoffs *can* trigger the problem if probabilities are vague (e.g., 1% chance of $1 billion might still distort choices). But infinity is where rationality fully breaks—multiplying ∞ by any non-zero probability still = ∞.  
  - **Probability clarity**: Known tiny probabilities (e.g., 1 in a trillion) are less vulnerable because we can still calculate expected value. The real trouble is when probabilities are *undefined* (e.g., "what if my startup succeeds?"—no basis to estimate).  

  Re: academic treatment—yes, it’s a serious headache. Decision theorists hate it because it exposes cracks in classical expected utility theory. Fixes involve:  
  - **Bounded utility functions** (capping how much we can value anything).  
  - **Probability skepticism** (ignoring claims with no evidence-backed odds).  
  - **Moral uncertainty frameworks** (weighing contradictory stakes).  

  Trade-offs? Bounded utility feels unnatural (why *shouldn’t* we care infinitely about future lives?). Probability skepticism risks dismissing legit long shots. The user’s gut is right—it’s a messy compromise.  

