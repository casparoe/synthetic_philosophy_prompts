prompt: |-
  So there's this guy at my climbing gym who's been gently working on me for months to come to his church, and his whole pitch is basically the Pascal's wager thing — the odds don't matter because the downside is finite and the upside is infinite, so you'd be crazy not to. Ok, I know that argument, whatever. But here's whats been bothering me. In the same week I heard the exact same shape of argument from two completely different places. A buddy trying to get me into his startup — tiny chance it blows up, and if it doesn't I've just lost a couple years, so why not. And some guy online about how you should give away most of your income because of the tiny chance it saves a huge number of future people. And in all three, the specific payoff is doing no work at all. The move is just: posit a payoff big enough, and then no matter how tiny the odds, you're "required" to do it. Which means you can run it for anything, including things that cancel each other out — believe in his god, believe in no god, join this startup, join the one across the street.

  Is there a name for that general move, or for the failure mode? I'm not asking about the religious version specifically, and not just the "but what if it's a different god" reply — I mean the whole family where you conjure a payoff big enough to swamp all the evidence and then there's no principled place to stop. Does it have a proper name, and how does it relate to the plain wager? And where are the edges exactly — does the payoff have to be literally infinite, or does "really really big" do the same job? Does the probability have to be unknown, or is a small known probability enough? My gut says the "can't even put a number on it" cases and the "one in a trillion" cases are seperate problems, but maybe they're the same problem and I'm just confusing myself.

  Also — is this treated as a serious issue in decision theory, or is it a parlor trick that gets mentioned and then everyone moves on? And if there's a standard fix, what does it have to give up? I'd rather get the shape of the thing than a reading list; I'm not gonna read the papers anyway.
