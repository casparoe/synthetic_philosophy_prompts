answer: |-
  You've hit on a profound and notoriously messy problem in decision theory. That "move" has a name: **Pascal's Mugging**. It's a generalization of Pascal's Wager, exposing the flaw when the argument relies on *hypothetical, arbitrarily large payoffs* combined with *non-zero (even infinitesimal) probability estimates* to overwhelm any cost/risk calculation.

  Here's the breakdown:

  1.  **The Core Move & Its Name:**
      *   **Pascal's Mugging:** (Coined by Eliezer Yudkowsky) Imagine a mugger stops you and says, *"Give me your wallet, or I'll use my secret powers (which you can't verify) to create and torture 3^^^^3 (an incomprehensibly huge number) of copies of you in other dimensions. The probability I can do this is 1 in 10^100, but the negative utility is so vast it still makes the expected value of refusing astronomically negative. Hand it over."*
      *   **The Pattern:** Posit an outcome with **unfathomably large utility** (positive or negative). Assign it a **non-zero probability**, however tiny or unsupported. Ignore the lack of evidence for *both* the probability and the outcome's magnitude. Conclude that the **Expected Value (EV = Probability x Utility)** demands the action, as the infinite/hyperbolic utility swamps any finite cost and the tiny probability.

  2.  **Why It's a Problem / The Failure Mode:**
      *   **Bankruptcy of Decision Theory:** Classical Expected Utility Theory (EUT) seems to *require* you to accept the mugger's demand, join the church, join the startup, or donate all your money. This feels absurd and paralyzing.
      *   **Lack of Falsifiability & Proliferation:** As you observed, *anyone* can use this structure for *anything* (e.g., "Give me $5 to prevent a 0.0000001% chance of cosmic annihilation," "Don't give me $5 or I'll *cause* cosmic annihilation"). It provides no way to distinguish between credible claims and pure fabrications. Arguments cancel each other out.
      *   **Ignores Credibility & Evidence:** It treats the assignment of probability and utility as unconstrained. The "move" works precisely because it severs the link between the *claimed* probability/utility and any *evidence* or *plausible mechanism*. Assigning *any* non-zero probability to *any* arbitrarily imagined outcome becomes irrational.
      *   **Infinite Regress:** What if there's a tiny chance that *giving* the mugger your wallet *also* triggers a hyper-negative outcome? EUT offers no principled way to resolve competing hyperbolic claims.

  3.  **The Edges - Where Does It Apply?**
      *   **Payoff Magnitude:** **"Really really big" is sufficient, infinity is not required.** The key is that the claimed utility is so large that multiplying it by *any* non-zero probability (no matter how small you reasonably assign) still dwarfs the finite cost of the action. If the utility is merely "large" (e.g., $1 billion) and the probability is known and *very* small (e.g., 1 in 10^9), the EV can be calculated and might rationally be *less* than the cost (e.g., paying $1000 for that 1 in a billion chance isn't rational EV-wise). The problem arises when utility is posited to be hyperbolically large *relative* to the cost and the reasonably assignable probability.
      *   **Probability:**
          *   **"Can't even put a number on it" (Knightian Uncertainty):** This is the *core* domain of Pascal's Mugging. Assigning *any* specific non-zero probability feels arbitrary and unjustified. The argument exploits this vagueness by saying "well, it *could* be non-zero, and the stakes are huge, so...".
          *   **Small Known Probability:** If the probability is objectively known and small (e.g., winning a specific lottery), and the utility is finite, EUT works fine. The problem arises when the probability is *claimed* to be non-zero *without sufficient evidence*, especially when paired with hyperbole. Your gut is right: the "unknown/undefined probability" case is the primary engine of the mugging. The "known tiny probability" case only becomes problematic if the utility is *also* claimed to be hyperbolically large *and* that claim lacks credibility.

  4.  **Treatment in Decision Theory:**
      *   **It's a Serious Problem:** It's not a dismissed parlor trick. It's recognized as a major challenge to naive applications of Expected Utility Theory, particularly concerning low-probability, high-impact events with poorly defined probabilities (like existential risks, some religious claims, or wild startup bets). It highlights the limitations of EUT when dealing with extreme uncertainty and unbounded utility functions.
      *   **Proposed "Fixes" (and Their Trade-offs):**
          *   **Bounded Utility:** Cap how much utility *anything* can provide (e.g., no outcome, even eternal salvation or saving 3^^^^3 lives, can have infinite utility). This directly prevents the mugging but feels deeply unsatisfying and arbitrary. Why *shouldn't* saving an astronomical number of lives have proportionally astronomical value?
          *   **Probability Skepticism / Ignoring Sufficiently Small Probabilities:** Refuse to assign *any* probability (or treat it as zero for decision-making) to claims lacking sufficient evidence or a plausible mechanism. This avoids the mugging but risks ignoring *genuine* but highly unexpected threats or opportunities (e.g., novel scientific discoveries). Where do you draw the "sufficient evidence" line?
          *   **Knightian Decision Theories:** Develop frameworks specifically for decisions under deep uncertainty (unknown probabilities), like **Maximin** (choose the option with the best worst-case outcome - very conservative), or **Minimax Regret** (choose the option where the maximum regret across possible states is minimized). These avoid the mugging but often lead to highly risk-averse or otherwise counterintuitive decisions in normal scenarios.
          *   **Frequentist/Evidence-Based Priors:** Insist that probability estimates must be grounded in empirical evidence or well-defined reference classes. Assigning 10^-100 to the mugger's claim based on the complete lack of evidence for such powers becomes justifiable. This is practical but philosophically tricky for truly novel scenarios.
          *   **Moral Uncertainty:** Acknowledge uncertainty about *which* utility function is correct. Maybe the startup's success *isn't* hyper-good? Maybe that specific god *isn't* real? This adds complexity but prevents single hyperbolic claims from dominating.

  5.  **The Shape of the Fix (Trade-offs):**
      Ultimately, decision theory doesn't have a perfect, universally accepted solution. The "fix" usually involves **imposing structure to limit the unboundedness** that enables the mugging:
      *   **Trade-off Realism for Robustness:** Bounding utility or ignoring ultra-low-probability claims makes decisions more robust against absurd hypotheticals but sacrifices the "purity" of valuing outcomes proportionally or being perfectly open to radical possibilities.
      *   **Trade-off Precision for Pragmatism:** Using Knightian rules (Maximin, etc.) avoids paralysis from mugging scenarios but gives up the precision and intuitive averaging of standard EUT in well-understood situations.
      *   **Trade-off Simplicity for Complexity:** Incorporating moral uncertainty or strict evidence-based priors makes the decision framework more nuanced and potentially more accurate, but also vastly more complex and harder to apply.

  **In short:** You're encountering **Pascal's Mugging**. The core failure is using an *unsupported claim* of *hyperbolic utility* combined with an *unjustified non-zero probability* to hijack decision logic. It's a serious headache in decision theory because exposing it forces us to choose between logical consistency in the face of absurdity (accepting the mugging) and imposing seemingly arbitrary limits (bounded utility, probability skepticism) to preserve sanity and practicality. The edges blur when "huge but finite" utility meets "vaguely possible but utterly unquantifiable" probability. Your climbing buddy, startup friend, and effective altruist are all, knowingly or not, deploying variations of the same rhetorical mugging.
