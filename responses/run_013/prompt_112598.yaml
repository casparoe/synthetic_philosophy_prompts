  Next, the user's friend raises the "dead-hand" objection: control from beyond the grave causing domination. Is this distinct from equality concerns? The trust is a gift, not a direct constraint, but does it create structural domination? Comparing this to FEO's limitations could show which theory handles the case better.

  Finally, assessing what this reveals about FEO: is it confirmed, an anomaly, or something unforeseen? Given perpetual trusts create dynastic wealth outside traditional offices, FEO might be outdated here. Rawls didn't anticipate such mechanisms bypassing meritocratic structures.

