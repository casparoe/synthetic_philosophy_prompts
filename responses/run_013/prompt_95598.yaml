prompt: |-
  I co-host a tiny philosophy podcast — it's basically me and three friends from my program plus whoever we can bribe with coffee — and next week's guest is a decision theorist who's spent the last few years defending what she calls fanaticism about tiny probabilities. The gist of her line, as far as I can tell from her talks, is that the queasiness people feel about Pascal's mugging is a cognitive bias rather than a reason to patch up expected value maximization, and that the very same bias is what makes people systematically underrate the far future. She's also argued that the usual fixes are ad hoc: capping how much any outcome can be worth would leave you indifferent between saving some astronomically large number of future people and that number plus one, and refusing to act on sub-threshold probabilities just relocates the problem. We got into it in the group chat last night and my friend Dev kept saying "fine, then you have to hand your wallet to literally anyone who makes up a scary enough story," which I think is too quick but I couldn't say why, so I want to go in with questions that actually squeeze her view instead of letting her give the podcast-circuit version.

  Could you draft eight to ten questions, with a follow-up under each one keyed to the answer she's most likely to give? I want at least one question each on three things. First, the difference between a mugger who quotes you a tiny but well-defined probability and one where you have no model at all and the "probability" isn't really a number — does her argument need the second kind of case, and if the second kind is what's actually happening, can she even state her position without a probability to plug in? Second, the escalation problem: whatever rule she uses to keep the mugger at bay, the mugger can come back with bigger numbers, so I want to know what stops the slide to "give away everything you own on a whim," and what she says to someone who insists that slide is just what fanaticism amounts to. Third, the version where the mugger doesn't want your wallet but says he'll do something monstrous unless you do something monstrous to one person — is that the same argument in different clothes or a different one, and does her answer to the wallet case already commit her on the torture case? If you can work in one more, I'd also like a question about what her view costs her in ordinary life, since if every vanishingly small chance of an astronomical payoff binds, it's not obvious your allowed to just have friends and hobbies.

  Try to make them the kind where she can't wave it off with "that's a different problem" or "that's a research program" — if you think there's a stock dodge for one of these, stick the dodge in the follow-up and make her answer past it. And no asking her for reading recommendations or who she's responding to, it's a conversation, not a syllabus.
reasoning: |-
  Okay, the user runs a small philosophy podcast and is preparing for an episode with a decision theorist who defends fanaticism about tiny probabilities. The core of her argument is that people's aversion to scenarios like Pascal's mugging is a cognitive bias, leading to undervaluing the far future. The user wants tough questions that challenge her position without letting her fall back on standard responses.

  First, I need to understand the user's main concerns. They want questions focused on three areas: the nature of probabilities (especially undefined vs. tiny probabilities), the escalation problem leading to demandingness, and the torture variant of Pascal's mugging. They also want to explore the implications for ordinary life. The user mentioned their friend Dev's criticism about handing over the wallet to anyone with a scary story, which they feel is too simplistic but couldn't counter effectively.

  The user's explicit needs are clear, but deeper down, they might be seeking to sharpen their own understanding through this interview. They want to move beyond surface-level debates and force the guest to confront the practical consequences of her theory. Also, they might want ammunition to defend against critiques like Dev's in future discussions, showing that fanaticism can be challenged rigorously.

  For the questions, I should ensure each one targets a specific weakness. For probabilistic vagueness, it's crucial to distinguish between well-defined tiny probabilities and cases where probabilities are undefined. The escalation problem needs to show that any rule to avoid exploitation can be undermined by larger numbers. The torture variant tests consistency in moral commitments. Ordinary life implications highlight the theory's impracticality, making it seem unreasonable.

  I recall that standard objections to fanaticism include the inability to assign meaningful probabilities in some cases and the excessive demands leading to paralysis. The guest might respond by appealing to rational requirements despite practical issues. So follow-ups need to press on how one acts without probabilities or whether the theory demands constant sacrifice.

  Structuring the questions: start with probabilistic vagueness to challenge the foundation. Then escalation to show infinite demands. Follow with torture to test moral intuitions. End with ordinary life to highlight absurdity. Each question should have a likely reply and a sharp follow-up that preempts dodges.

  For instance, on probabilistic vagueness, the guest might say we must use best estimates. The follow-up questions whether that turns all unknown claims into action obligations. On escalation, she might invoke bounded resources. Follow-up asks why the bound isn't arbitrary if the math suggests otherwise. For torture, if she avoids commitment, the follow-up presses whether expected value still applies. Ordinary life: if she says small stakes allow personal life, follow-up questions the threshold and why not gamble everything for cosmic stakes.

  Need to ensure questions force her into either accepting counterintuitive results or revising her theory. Avoid letting her retreat to "it's a research program" by addressing potential evasions in follow-ups. The goal is to expose whether fanaticism is tenable or collapses under its own demands.
answer: |-
  Here are 10 targeted questions designed to pressure the core commitments of fanaticism about tiny probabilities, with follow-ups anticipating common dodges and forcing concrete answers. Each targets your specified areas: probabilistic vagueness (1-3), escalation/demandingness (4-7), torture variants (8-9), and ordinary life costs (10).

  ### I. Probabilistic Vagueness & Model Uncertainty
  1.  **Question:** Your argument often uses *tiny but well-defined* probabilities (e.g., 1 in 3^^^3). But Pascal's Mugging *in the wild* usually involves profound model uncertainty – we have no reliable way to assign *any* probability to the mugger's claim. Doesn't fanaticism *require* that we treat this vague, unquantifiable suspicion *as if* it were a tiny, well-defined probability to justify action? If not, how do you act under radical uncertainty without a probability to plug in?
      *   **Likely Dodge/Reply:** "We use our best estimate / subjective probability / credence."
      *   **Follow-Up:** But if 'best estimate' for an arbitrary, unfalsifiable claim made by a stranger can be *forced* to be non-zero just by the mugger escalating the stakes, doesn't that mean any sufficiently bold claim *must* be acted upon? Isn't this functionally identical to treating radical model uncertainty as a tiny probability, collapsing the distinction you might want to rely on?

  2.  **Question:** Can you clearly state the *decision rule* fanaticism prescribes when facing a claim where no probabilistic model exists (e.g., "I'm a Boltzmann brain manipulating your senses, pay me or I'll simulate eternal torture")? How is this rule distinct from simply *inventing* a tiny probability for *any* conceivable threat?
      *   **Likely Dodge/Reply:** "We use decision theory under Knightian uncertainty / use a probability *range*/imprecise credence."
      *   **Follow-Up:** If the lower bound of that imprecise credence range is non-zero (as it often must be for truly unknown claims), and fanaticism says even vanishingly small probabilities bind if stakes are high enough, doesn't the *lower bound* alone force action? Doesn't this mean fanaticism *still* demands compliance whenever an outlandish claim *can't be ruled out absolutely logically*, regardless of plausibility?

  3.  **Question:** Critics argue that in true model uncertainty, the "probability" isn't a number; it's undefined. Fanaticism seems to *demand* we treat it as a defined, non-zero number to make decisions. Isn't this smuggling in a crucial assumption – that undefined uncertainty *can and should* be quantified – that your opponents reject?
      *   **Likely Dodge/Reply:** "We must act on *some* basis, and expected value is the best normative standard, even with imperfect inputs."
      *   **Follow-Up:** Doesn't this make fanaticism effectively *defined* by its willingness to quantify the unquantifiable? Isn't the core disagreement that your opponents see this quantification as *impossible* or *meaningless* in these cases, making EV maximization *inapplicable*, not just hard?

  ### II. Escalation & Unbounded Demandingness
  4.  **Question:** Whatever rule you propose to avoid handing over your wallet to the first mugger (e.g., bounded resources, prior probability floors), the next mugger can simply increase the claimed stakes (e.g., "I control 3^^^^3 times more utilons!"). What specific, *non-arbitrary* principle stops the slide where *every* interaction demands I sacrifice everything to the claimant with the most outlandish story?
      *   **Likely Dodge/Reply:** "Practical boundedness: I don't *have* infinite resources to give away constantly / We need priors that decay sufficiently fast with complexity."
      *   **Follow-Up:** But isn't *practical* boundedness just admitting fanaticism is *literally impossible to follow*? And if we impose a *prior* that decays with complexity to avoid this, isn't that exactly the kind of 'ad hoc' patch you criticized others for? Doesn't your *own* EV math, without such a prior, demand I liquidate *all* assets for the *next* mugger after the first?

  5.  **Question:** Dev says fanaticism means handing your wallet to "literally anyone who makes up a scary enough story." You call this too quick. What's the *specific, operationalizable* difference fanaticism draws between a mugging attempt it *would* reject and one it *would* accept? Not a vague appeal to "plausibility," but a rule an agent could code.
      *   **Likely Dodge/Reply:** "It depends on the agent's credence function / evidence / priors."
      *   **Follow-Up:** But if the agent's credence function is *coherent* (assigns non-zero to non-contradictions) and the mugger is strategic (escalates stakes to counter low credence), isn't Dev *correct* that a coherent fanatic agent is *always exploitable* by a sufficiently bold claim? Doesn't fanaticism structurally *require* vulnerability to exploitation?

  6.  **Question:** If fanaticism *doesn't* demand giving everything to every mugger, doesn't that imply there's a de facto threshold where the claimed probability-times-stakes product becomes "too small to matter"? How is this functionally different from the threshold-based solutions you reject, except that your threshold is murkier?
      *   **Likely Dodge/Reply:** "It's not a threshold; it's continuous. But resources are finite, so we optimize across *all* opportunities."
      *   **Follow-Up:** When optimizing finite resources across infinite (or near-infinite) opportunities involving potentially astronomical stakes, doesn't the math *necessarily* imply that almost all resources go to the *very highest* claimed stakes, regardless of plausibility? Doesn't "optimization" just mean constantly chasing the *most* outlandish claim currently presented?

  ### III. Torture Variants & Moral Commitments
  7.  **Question:** Consider a "Torturer's Mugging": Someone claims they will torture 3^^^3 sentient beings unless you torture one innocent person *right now*. They offer the same tiny probability of being truthful. Does fanaticism *require* you to commit the torture?
      *   **Likely Dodge/Reply:** "That's a different moral category; deontological constraints might override." OR "The probabilities might be assessed differently for such extreme acts."
      *   **Follow-Up:** But doesn't fanaticism, as a *decision theory* about *maximizing expected value*, treat utils as utils? If the disutility of torturing 3^^^3 beings astronomically outweighs the disutility of torturing one, and the probability is non-zero, doesn't the EV calculation *strictly demand* the torture? If you introduce constraints *now*, aren't you abandoning pure EV maximization for tiny probabilities?

  8.  **Question:** If you *wouldn't* endorse torture in the above case, doesn't that reveal a fundamental asymmetry in how you apply fanaticism? If it only binds for *benign* sacrifices (money) but not *malevolent* ones (torture), doesn't that suggest the queasiness isn't just a bias about *probability*, but a deep moral constraint that *should* limit EV maximization?
      *   **Likely Dodge/Reply:** "The calculation includes the moral cost *to the agent* of committing torture / It violates core preferences."
      *   **Follow-Up:** But if we can add huge, overriding "moral cost utils" for *doing* bad acts to avoid this conclusion, doesn't this make fanaticism unfalsifiable? Couldn't someone equally argue there's a huge "moral cost util" to *not* preventing 3^^^3 tortures by *failing* to act? How do you decide *which* moral costs get these infinite weights without abandoning the core EV framework?

  ### IV. Costs in Ordinary Life
  9.  **Question:** Fanaticism seems to demand constant attention to vanishingly small chances of astronomical payoffs. Why am I morally permitted to spend an evening having coffee with friends, knowing that time *could* instead be spent researching, donating, or working on projects with some tiny chance of affecting astronomical future value? Doesn't fanaticism imply that *almost all* personal time and resources are misallocated?
      *   **Likely Dodge/Reply:** "The probability of a single evening making such a difference is *genuinely* negligible / Personal well-being has instrumental value."
      *   **Follow-Up:** But if the probability isn't *literally zero* (which it never is for coherent agents), and the potential future stakes are *infinite* or near-infinite, how do you *quantify* "genuinely negligible"? Doesn't fanaticism imply that *any* non-zero probability, no matter how small, *must* dominate finite, personal goods when multiplied by infinite stakes? Where's the principled line between "negligible" and "actionable"?

  10. **Question:** Doesn't fanaticism collapse the distinction between ordinary risk-taking and pathological gambling? If someone liquidates their life savings to buy lottery tickets for a 1-in-300M chance at $100M, we call it irrational. But if someone liquidates it to fund a 1-in-10^30 chance of preventing existential risk, fanaticism seems to endorse it (if the stakes are high enough). What's the *principled* difference fanaticism offers to avoid endorsing ruinous behavior in ordinary, finite-stakes scenarios?
      *   **Likely Dodge/Reply:** "The expected value calculations clearly differ! Finite stakes vs. potentially infinite stakes is the key."
      *   **Follow-Up:** But the gambler *believes* their finite-stakes gamble has positive EV, just like the fanatic believes their long-shot has positive (or infinite) EV. If the fanatic's belief is based on similarly shaky grounds (e.g., unquantifiable model uncertainty about far-future impacts), how does fanaticism *itself* provide the guardrail against ruinous "long-shot chasing" in domains where the *actual* probabilities are just as vague and the *actual* stakes are finite but large to the individual?

  **Key principles used in drafting these:**

  1.  **Force Operationalization:** Demand *actionable decision rules*, not just principles. Ask "How would an agent actually do this?"
  2.  **Preempt Semantic Dodges:** Anticipate appeals to "credence," "priors," or "model uncertainty" and force the implications of *how they must be set* under fanaticism.
  3.  **Exploit Structural Vulnerabilities:** Highlight the *inherent exploitability* and *unbounded demandingness* as features, not bugs, unless clearly blocked by a non-arbitrary rule.
  4.  **Test Consistency:** Apply the logic to morally fraught variants (torture) and ordinary life to reveal tensions or absurdities.
  5.  **Confront Arbitrariness:** Challenge *any* proposed limit (resource bound, prior decay) by showing how the *core EV math* without that limit leads to the problematic conclusion, making the limit appear ad hoc.
  6.  **Avoid Abstract "Research Program" Escapes:** The follow-ups trap the guest by showing how their *own stated commitments* (EV maximization, non-zero credence for non-contradictions) lead to the counterintuitive results, even if the details are messy.

  Good luck with the podcast! Squeeze hard.
