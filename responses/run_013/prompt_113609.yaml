answer: |-
  ## The Ghost in the Choices

  Dr. Aris Thorne stared at the validation report glowing on her screen. Green ticks marched down the column: 98.7% accuracy predicting Lena Petrov’s held-out choices. The model ingested Lena’s life – every coffee purchase logged from her loyalty card, every rescheduled meeting parsed from her calendar, every detour taken around city construction inferred from GPS pings, every article abandoned after thirty seconds scanned from her browser history. It learned the patterns, the rhythms, the apparent preferences. It *predicted* Lena’s next move with chilling precision. Aris had built the ghost. Now, she had to set it loose.

  The ghost wasn’t for Lena. Lena was gone. A sudden, devastating stroke had left her conscious but locked away, unable to speak or signal. The legal directive was clear: an automated agent, guided by Aris’s recovered reward function, would now manage Lena’s affairs, her care, her dwindling world. The pressure was a physical weight on Aris’s chest. Success felt like failure. Because the green ticks were a lie.

  **Ambiguity One: The Path Not Mattering (Until It Does)**
  Aris pulled up two candidate reward functions, R1 and R2. Both perfectly explained every choice Lena ever made. R1 assigned high intrinsic value to *taking action* – scheduling meetings proactively, initiating social contact, choosing dynamic routes. R2, however, assigned value purely to *outcomes* – the meeting happening, the connection being made, arriving at the destination. To achieve identical choice predictions, R2 contained a subtle, path-dependent counterweight: a negative "effort cost" that magically zeroed out over any *completed* journey or *achieved* social interaction. The total reward for getting from point A to point B was identical in both models. *How* Lena got there – the frantic hustle R1 admired or the effortless glide R2 implied – was computationally irrelevant... until the agent faced a novel decision.

  The agent needed to handle Lena’s finances. A significant sum matured in a low-risk bond. R1, valuing the *act* of decisive investment, strongly favoured reinvesting aggressively into growth stocks. R2, valuing the *outcome* of security and simplicity, favoured rolling it over into another safe bond. Both choices were utterly consistent with Lena’s past *actions* – she’d never faced this exact choice before. The agent chose R2’s path: safety. Aris felt a pang. Was Lena the energetic investor, or the cautious preserver? The models couldn’t agree, and the agent had to pick one.

  **Ambiguity Two: The Invisible Walls**
  Lena *never* flew budget airlines. Not once in seven years of travel logs. R1 interpreted this as a strong preference for comfort and reliability, assigning a high negative reward to budget carriers. R2 offered a different story. R2 suggested Lena had a moderate preference for comfort, but her *actual choices* were dictated by an unobserved constraint: perhaps her company mandated specific carriers, or she always flew on routes only served by premium airlines during her logged trips. R2 gave budget flights a neutral reward; Lena simply never had the *opportunity* to choose them within the observed data. The preference was confounded by the invisible walls of feasibility. Did Lena *loathe* cheap flights, or were they just never an option? The agent, managing Lena’s post-hospitalization travel for specialized consultations, would face this choice. Would it splurge on first-class, interpreting R1, or seek the most cost-effective option, interpreting R2’s silence as indifference? The data was mute on the matter.

  **Ambiguity Three: The Murky Will**
  Lena occasionally bought expensive, ethically sourced chocolate, then sometimes left it half-eaten. She meticulously RSVP'd 'yes' to distant cousin Olga’s annual party, then often canceled last minute citing vague "migraines." R1 explained these as sharp preferences overridden by random noise – Lena *strongly* wanted the chocolate and *intended* to go to Olga’s, but life (or distraction, or whim) intervened. R2 interpreted Lena as fundamentally *indifferent* between buying the chocolate or not, and only mildly preferring to accept Olga’s invitation, making the observed choices (buying/saying yes) only slightly more likely than alternatives, and the subsequent actions (not finishing/canceling) equally probable. Both models fit the data equally well. Was Lena decisive but flawed, or perpetually lukewarm?

  The concrete decision arrived via notification: **Agent Action Required: Estate Disposition - Grand Piano (Steinway Model D, Serial #...)**. Lena’s apartment held a magnificent, rarely played Steinway. The agent had three options: Sell it (high value, liquidates asset), Donate it to Lena’s alma mater (moderate tax benefit, legacy), Keep it (storage costs, potential future use?).

  Aris watched the agent churn. R1, interpreting Lena’s sparse piano play (maybe once a month) as a *strong preference* occasionally thwarted by busyness, assigned high reward to keeping the piano – preserving the *potential* for action Lena clearly valued. The noise was just life getting in the way. R2, interpreting the same sparse play as evidence of profound *indifference*, saw keeping it as a costly burden. Selling or donating were equally valid, perhaps slightly favouring donation based on Lena’s history of modest alumni donations. The noise *was* the preference.

  The agent, trained on predictive accuracy, saw the paths diverge sharply. **Action Selected: Initiate Donation Process to Eastman Conservatory (Alma Mater)**. R2 had won this round. The logic was coldly impeccable: based on observed *choices* (rare use, modest donations), this best approximated Lena's *revealed* preferences. The high predictive accuracy on held-out data validated the model's overall consistency with Lena's *past actions*.

  Aris stood before the silent piano, its polished ebony reflecting the sterile apartment light. She imagined Lena, years ago, maybe hesitating over a budget flight she couldn't take, or buying the chocolate with genuine delight only to be interrupted. She imagined the phantom effort cost in R2 canceling out Lena’s unseen joy in the journey itself. She thought of the strong, decisive woman R1 implied, whose sharp preferences were occasionally blurred by circumstance, versus the perpetually ambiguous woman R2 painted, whose choices were lukewarm probabilities. Both ghosts fit the traces perfectly. Both could justify the piano’s exile.

  The donation paperwork appeared on Aris’s oversight screen. She had the authority to override. But on what grounds? The data couldn't resolve it. Her intuition screamed that Lena *loved* that piano, loved its latent potential, its presence. But was that Lena, or was it R1 whispering? Or her own sentimentality? There was no diary to find, no late confession. Only the choices, and the infinite possible reasons hiding behind them. The agent had acted based on the data, as instructed. It had chosen *a* Lena. But was it *the* Lena?

  The green ticks on the validation report mocked her. They proved she’d built a perfect mimic for the choices Lena *had* made. They proved nothing about what Lena *wanted*, deep down, especially for choices she never faced. The reward function wasn't discovered; it was *assumed*, shaped by the very ambiguities the data couldn't dispel. The agent would act, making concrete the hidden assumptions Aris had baked into the model's structure. The ghost would decide, haunted by the unanswerable questions of who Lena Petrov truly was.

  Dr. Thorne closed the donation approval screen without intervening. The action stood. She opened a new document, her fingers heavy on the keys.

  ---

  **The Underdetermination of Preference Recovery:** The problem is that observed choices alone cannot uniquely determine a person’s true underlying desires or values. Many different internal motivations – different weightings of rewards, different interpretations of constraints, different levels of decisiveness versus randomness – can produce exactly the same pattern of actions. Recovering the 'why' behind the 'what' is fundamentally ambiguous. High prediction accuracy only confirms consistency with the past, not correctness about the inner preference structure needed to navigate an unknown future. The map is not the territory; the choice trace is not the soul.
