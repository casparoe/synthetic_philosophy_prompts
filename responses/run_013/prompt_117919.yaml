answer: |-
  Here’s a decision procedure for antibiotic evidence review, based on Nyāya epistemology (pramāṇas), designed for clinical use. Aim for **<90 seconds per claim**.  

  ---

  ### **Antibiotic Evidence Decision Procedure**  
  **Purpose:** Assess if incoming evidence gives *justified true belief* (knowledge) or needs verification/context.  
  **Steps:**  
  1. **CLASSIFY** the claim: Which *pramāṇa* (way of knowing) is it?  
     - **P** (Perception): Direct observation (e.g., lab data, chart review)  
     - **I** (Inference): Logical deduction (e.g., "Resistance is rising, so switch drugs")  
     - **A** (Analogy): Comparison (e.g., "Drug X is like Y")  
     - **T** (Testimony): Expert/report (e.g., guidelines, consultant advice)  

  2. **RUN CHECKS** (Stop at first "NO"):  
     | *Pramāṇa* | Check 1 (Truth Condition)      | Check 2 (Justification Condition)       |  
     |-----------|-------------------------------|----------------------------------------|  
     | **P**     | Were instruments/conditions reliable? *(e.g., lab QC passed?)* | Was observation method correct? *(e.g., CLSI standards?)* |  
     | **I**     | Does the cause-effect link *always* hold? *(e.g., no exceptions?)* | Are there counterexamples? *(e.g., local resistance breaks the rule?)* |  
     | **A**     | Is the similarity *relevant*? *(e.g., same spectrum? PK/PD?)* | Are differences trivial? *(e.g., no new toxicity?)* |  
     | **T**     | Is the source **competent** AND **honest**? *(e.g., expert without conflict?)* | Does it align with **P/I/A**? *(e.g., matches lab data?)* |  

  3. **DECIDE & ACT:**  
     - ✅ **ACCEPT** as knowledge: If **all checks pass**. *Act on it.*  
     - 🛑 **REJECT**: If any check **fails**. *Set aside.*  
     - ❓ **REFER**: If checks are *inconclusive* → Flag for:  
       - **Confirmation**: *"What would verify this?"* (e.g., repeat test, check guideline primary data).  
       - **Values input**: If unconfirmable but impacts cost/equity/risk → Escalate to committee/superintendent.  
     - 💬 **NOT KNOWLEDGE**: If checks pass but conflict with other evidence → **Reconcile manually** (e.g., debate).  

  4. **CONFIRMATION STEP (Critical!):**  
     - *"Can this be cross-checked with a different pramāṇa?"* (e.g., testimony confirmed by perception/lab data).  
     - If **no confirmation possible**: Treat as **hypothesis** → Pilot in 3-5 cases *with monitoring*.  

  **Key Caveats:**  
  - 🔸 **Judgment calls**: Competence (T), relevance (A), and instrument reliability (P) rely on experience.  
  - 🔸 **Values ≠ Knowledge**: E.g., "Drug X saves lives but costs 100× more" → Medical superintendent decides.  

  ---  

  ### **Case Applications**  
  ***(1) Consultant’s Tea-Break Recommendation (T: Testimony)***  
  - Check 1: **Competent?** ✅ (ID specialist). **Honest?** ✅ (No pharma ties).  
  - Check 2: **Aligns with P/I/A?** ❓ (No local data; contradicts national guideline).  
  - **Action**: ❓ REFER → *Needs confirmation*. Ask consultant for evidence (e.g., regional resistance data). If none, pilot with audit.  

  ***(2) Lab Sensitivity Data (P: Perception)***  
  - Check 1: **Instruments reliable?** ✅ (If QA passed).  
  - Check 2: **Method correct?** ✅ (If CLSI followed).  
  - **Action**: ✅ ACCEPT *but* → **Confirm** with clinical outcomes (e.g., are patients responding?). *Gold standard ≠ infallible*.  

  ***(3) Drug Rep: "Z is basically the same as current drug" (A: Analogy)***  
  - Check 1: **Relevant similarity?** ❌ (Same class ≠ same spectrum/resistance).  
  - **Action**: 🛑 REJECT → Analogy ignores key differences (e.g., Z has worse renal toxicity).  

  ***(4) National Guideline (T: Testimony)***  
  - Check 1: **Competent?** ✅ (National body). **Honest?** ✅ (Conflicts declared).  
  - Check 2: **Aligns with P/I/A?** ❓ (Based on urban hospitals; our lab shows different resistance).  
  - **Action**: ❓ REFER → **Adapt** using local data (P). If mismatch >20%, modify first-line choice.  

  ---  

  ### **What the Procedure CAN’T Do**  
  - **Solve resource gaps**: No library/patchy internet? → Output is "❓ REFER – confirmation needed".  
  - **Replace values decisions**: E.g., "Use cheaper drug despite 5% lower efficacy" → Superintendent’s call.  
  - **Force consensus**: If checks pass but consultants disagree → Manual debate required.  
  - **Create certainty from nothing**: Unconfirmable testimony (e.g., "Trust me") → Reject or pilot.  

  **Final Output**: 1-page flowchart attached. **Time to run**: 3 mins after training.  

  ---  
  **Flowchart Summary**:  
  ```
  CLASSIFY → P/I/A/T? → RUN CHECKS →  
  │→ All pass? → ✅ ACCEPT → CONFIRM? (Yes/No/Pilot)  
  │→ Check fails? → 🛑 REJECT  
  │→ Unclear? → ❓ REFER → Knowledge? → Confirm OR Values? → Escalate  
  ```  
  Print and distribute. Thursday deadline met.
