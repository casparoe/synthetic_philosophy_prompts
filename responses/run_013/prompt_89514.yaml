  The user's frustration is palpable - they've been stuck on this question for two weeks because every draft gets reduced to the same three-paragraph scale argument. That suggests the exam design needs to structurally prevent that shortcut. The hypothetical "Scale Principle" is brilliant because it externalizes the students' own go-to argument into a formal position they must critique.

  Key constraints from the brief:
  - Must force students to treat the scale argument as *premise* not conclusion
  - Must require locating the disagreement at the level of *credence usability*
  - Model answer must be citation-free (closed-book exam)
  - Marking scheme needs 5 discrete "must-hit" moves with common failure modes

  The pedagogical tightrope: This isn't about rejecting expected value theory wholesale, but about examining its boundary conditions. The user wants students to recognize that objecting to tiny probabilities might require compromising other theoretical commitments (hence the "repair and cost" requirement).

  Biggest challenge in drafting: The model answer must exemplify depth without named theories (e.g., no "Hájek" or "Pascal"). That means reconstructing technical arguments about probability thresholds and decision-theoretic axioms in plain language. The mugging analogy helps - it's an intuitive hook for the formal problem.

  Marking scheme priorities: Top marks should hinge on whether students can articulate why "spooky big numbers" isn't a valid objection, and instead identify epistemic vs. decision-theoretic critiques. Common failure modes will likely include: conflating sentience probability with welfare magnitude, reverting to speciesism, or proposing arbitrary probability floors without acknowledging trade-offs.

  Notable subtlety: The user mentions this is for half "animal ethics" and half "expected value" students. The ideal question should force both groups out of their comfort zones - EV students to engage moral philosophy, ethics students to engage formal reasoning.
answer: |-
  Here’s a comprehensive exam package designed to meet your specifications, pushing students beyond rote scale arguments into deeper critiques of credence usability in moral decision-making.

  ---

  ### Exam Question Sheet  
  **MA Seminar: Moral Uncertainty & Invertebrate Ethics**  
  **Final Examination (50 minutes, closed book)**  

  > **QUESTION**  
  > Consider the following *Scale Principle* for morally uncertain policy decisions:  
  > *"For any policy, calculate the sum: (number of individuals affected per taxon) × (credence that a typical member of that taxon is sentient) × (expected welfare change per individual). Choose the policy that maximizes this sum."*  
  >  
  > Applied to pesticide regulation, the Scale Principle implies that even a miniscule credence (e.g., 1/1,000,000) in insect sentience—given ~10¹⁸ insects affected—dominates human welfare impacts.  
  >  
  > **Critically evaluate whether an objection that this resembles a ‘Pascalian mugging’ (i.e., acting on tiny probabilities of vast payoffs) successfully undermines the Scale Principle. If successful, pinpoint *where* the objection breaks the Principle (e.g., its handling of tiny probabilities, enormous numbers, or stipulative credences). Then, propose a repair (e.g., rejecting tiny probabilities) and explain what *other commitment* (e.g., an axiom of rationality) you must compromise to implement it. Your answer must engage *why* the objection targets the usability of credences in expected value, not merely the size of the numbers.**  

  *(Note: The Scale Principle is a hypothetical construct for this exam. No external sources exist.)*  

  ---

  ### Model Answer (700 words)  
  The objection that the Scale Principle resembles a Pascalian mugging—where an agent acts on an implausible claim due to inflated stakes—challenges not the math, but the *conditions for valid credence assignment* in expected value (EV) calculations. To assess its force, we must dissect whether low-probability/high-stakes scenarios create structural problems for EV frameworks.  

  **Where the mugging objection lands:** The core issue is **credence usability under minimal epistemic support**. A credence of 1/1,000,000 for insect sentience isn’t inherently invalid—but if it lacks empirical anchoring (e.g., based purely on conceptual possibility), it becomes a "free parameter." This allows arbitrary scaling: if we lower the credence further (say, to 1/10¹⁰⁰), the insect welfare sum still dominates if numbers are large enough. The mugging objection thus targets the **permissibility of non-arbitrary action on credences detached from evidence**. EV frameworks traditionally treat all probabilities as actionable, but this assumes credences reflect rational degrees of belief. When credences are merely *conceivable* (e.g., "we can’t disprove sentience in nematodes"), they may fail to be *practically relevant* for decision-making.  

  **Is the problem the tiny probability, the large number, or stipulation?**  
  - **Tiny probabilities**: The objection isn’t about size alone—acting on a 10⁻⁶ probability of a vaccine side-effect is routine if evidence-based. The issue is *evidential vacuity*.  
  - **Enormous numbers**: These amplify evidential weaknesses but aren’t the flaw’s origin.  
  - **Stipulation**: This is decisive. A credence like 1/1,000,000 is problematic *because* it’s asserted without a measurement protocol (e.g., no bridge between neural complexity and sentience likelihood). The Principle treats credences as inputs regardless of justifiability, enabling "muggings."  

  **Repair and its cost:** To block mugging-style outcomes, we could impose an **evidential threshold**: reject credences below a level (e.g., 1/10,000) unless empirically grounded. This repairs the usability problem by tethering credences to epistemic responsibility.  

  However, this breaks **decision-theoretic continuity**: EV maximization requires comparing *all* possible outcomes, not excluding some arbitrarily. Thresholds create "cliff effects" (e.g., credence 0.0001 is actionable; 0.000099 is ignored) that violate the **sure-thing principle** (if A is preferred to B regardless of event C, then A is preferred unconditionally). We must thus abandon EV’s claim to *comprehensive rationality*—acknowledging that some conceivable outcomes are "decisionally inert" due to epistemic constraints.  

  The mugging objection succeeds by exposing that EV frameworks lack internal tools to filter *unusable credences*. This isn’t about big numbers feeling "spooky"; it’s about whether a credence can bear the weight of practical reasoning when decoupled from evidence. The Scale Principle naively extends EV to domains where credences are not just uncertain, but *structurally unverifiable*. Repairing this forces a trade-off: either accept mugging-style results as the price of seamless rationality, or admit that decision theory must incorporate epistemic boundaries—even if it fractures EV’s elegance.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  | **Must-Hit Move**                                                                 | **Marks** | **Common Botch** |  
  |-----------------------------------------------------------------------------------|-----------|------------------|  
  | **1. Identifies the mugging objection’s target as *credence usability* (not scale)** | 4/20     | Calls big numbers "intuitively wrong" without linking to epistemic limitations. |  
  | **2. Pinpoints *stipulative credence* (not low prob/high stakes) as the flaw’s locus** | 4/20     | Blames "tiny probabilities" or "large numbers" alone. |  
  | **3. Proposes a coherent repair (e.g., evidential thresholds)**                    | 4/20     | Suggests ad hoc fixes (e.g., "discount insects") without systematic principles. |  
  | **4. Names the *broken commitment* (e.g., decision-theoretic continuity)**        | 4/20     | Vaguely notes "fairness" or "pragmatism" without theoretical cost. |  
  | **5. Argues *why* the repair’s cost matters (e.g., violates EV axioms)**           | 4/20     | Treats trade-off as trivial or fails to contextualize in moral uncertainty. |  

  **Grade Boundaries**: A (17–20): Hits all moves; locates flaw in credence usability. B (13–16): Hits 3–4 moves; conflates usability with scale. C (9–12): Hits 2 moves; focuses on intuition. D (5–8): Describes but doesn’t analyze objection. E (0–4): Restates scale argument.  

  ---

  ### Design Notes  
  1. **Forces Engagement with Usability**: By framing the mugging as a problem of "stipulative credences," the question compels students to interrogate *what justifies acting on a probability*—pushing beyond "big numbers are scary."  
  2. **Repair Cost Clarity**: Requiring a "broken commitment" prevents superficial solutions (e.g., "just ignore insects") and ties answers to decision-theoretic coherence.  
  3. **Anti-Memorization**: Citation-free model answer and hypothetical principle ensure arguments stand on logic, not scholarship.  
  4. **Balanced Rigor**: 50 mins/700 words demands concision but allows depth on the 5 key moves.  

  This structure ensures A answers must grapple with the epistemology of credence—transforming the scale argument from a conclusion into a starting point for meta-uncertainty.
