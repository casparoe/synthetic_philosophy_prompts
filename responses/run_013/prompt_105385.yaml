prompt: |-
  I am trying to find out whether there is an established name for a pattern I have noticed in group decision-making, and, more importantly, how precisely that pattern is understood, since a bare label would not help me. The pattern is this: a group has to settle several questions that are logically tied together, so that the answer to one constrains the answers to the others; each member of the group is perfectly consistent in his or her own answers; the group then decides each question separately by majority vote; and the resulting set of collective answers is one that no member holds and that is internally inconsistent. Everyone has kept his or her position, no one is being unreasonable, and yet the group as a whole is committed to a set of claims that cannot all be true.

  A concrete instance: a panel has to decide whether a drug is safe, whether it is effective, and whether to approve it, where approval is supposed to require both safety and efficacy. Imagine the members split in such a way that a majority judges the drug safe, a majority judges it effective, and a majority votes against approval. The panel has thereby endorsed both premises of an argument and rejected its conclusion.

  What puzzles me is not simply that a group can be inconsistent while its members are not. Two further features seem important. First, the result seems to depend on which question is treated as the one to be settled last, or as the conclusion to be read off from the others: the same individual opinions can yield a coherent collective answer under one way of ordering the questions and an incoherent one under another, with no change in anyone's views. Second, the trouble is often hidden, because the group rarely puts the whole connected package to a single vote; each question is decided on its own, and the conflict becomes visible only when someone tries to act on all the answers together.

  I suspect this is discussed somewhere, perhaps under more than one label, and I cannot tell whether I am describing one recognized phenomenon or two, whether the order-dependence belongs to the same phenomenon or is treated as a separate matter, and whether there is a term for the way the problem stays out of sight when decisions are taken one at a time. I would also like to know how this differs from things it might be confused with: a group that is merely divided, an individual who is himself inconsistent, and the familiar practice of trading votes across issues so that each side gets what it wants. Please do not simply supply a name. Explain what the phenomenon is taken to be, what it is not, how the several nearby concepts relate to the exact pattern I have described, and, if no single established term fits it, propose one with a definition and clear boundary cases. Write your answer in American English.
reasoning: |-
  Okay, let me tackle this user's query. They're describing a situation in group decision-making where individual members are consistent, but collective voting leads to inconsistent outcomes. The example with the drug approval panel is clear: majorities say safe and effective but vote against approval, which requires both. 

  First, I need to recall if there's a formal term for this. The Condorcet Paradox comes to mind for cyclical preferences, but this is different—it's about logical connections between propositions. The discursive dilemma seems to fit perfectly. That term, from social choice theory, specifically addresses majority voting on interconnected issues leading to inconsistency.

  The user mentions two key features: order-dependence and hidden inconsistency due to separate votes. For order-dependence, the sequential nature matters. If the group votes on approval first, the outcome might differ. That ties into path-dependence. The hidden aspect is because inconsistencies only emerge when combining all decisions later—like when someone tries to act on them.

  I should differentiate this from other concepts. Condorcet's Paradox is about preferences, not logical dependencies. Arrow's Theorem is broader. The doctrinal paradox is a specific case. Logrolling involves vote-trading, which isn't happening here. Individual inconsistency isn't relevant since members are consistent.

  The user might be in academia, possibly philosophy or political science, given their focus on decision theory. Their deeper need could be understanding how to prevent such inconsistencies in real panels, or to critique majority voting. They might need solutions, like premise-based voting or holistic approaches.

  I'll structure the response by defining the phenomenon, explaining its features, distinguishing from similar concepts, and addressing the hidden nature and order-dependence. Emphasizing the doctrinal paradox as a subset and discursive dilemma as the umbrella term should clarify. Mentioning solution approaches adds practical value. Ensuring clarity without jargon is key, as the user wants more than just a label.
answer: |-
  Based on your detailed description, you are encountering a fundamental and well-studied problem in social choice theory, collective rationality, and judgment aggregation. The core phenomenon has a specific name, but its features like order-dependence and hidden inconsistency are integral parts of the analysis.

  1.  **The Core Phenomenon: The Discursive Dilemma (and its subtypes)**
      *   **Name:** This pattern is most precisely called the **Discursive Dilemma**. It was formally analyzed and named by Christian List and Philip Pettit (building on earlier work like the "Doctrinal Paradox").
      *   **Definition:** The Discursive Dilemma arises when a group makes collective judgments on multiple logically interconnected propositions through majority voting on each proposition individually. Despite every individual member holding a logically consistent set of judgments, the collective set of judgments derived from the majority votes is logically inconsistent.
      *   **Your Drug Approval Example:** This is a classic textbook case of the Discursive Dilemma. The propositions are:
          *   P: The drug is safe.
          *   Q: The drug is effective.
          *   R: The drug should be approved. (With the rule: R if and only if (P AND Q))
      Majority votes yield P=True, Q=True, R=False. This violates the rule that R should be True if P and Q are both True. The collective judgment set {P, Q, ~R} is inconsistent given the rule.

  2.  **Key Features You Identified & How They Fit:**

      *   **Individual Consistency vs. Collective Inconsistency:** This is the defining characteristic of the Discursive Dilemma. It highlights a conflict between individual rationality (each person holds a coherent view) and collective rationality (the group's aggregated view is incoherent). The group *as a system* fails, even though its *components* are fine.
      *   **Order-Dependence (Path-Dependence):** This is not a separate phenomenon; it's a crucial *consequence* and diagnostic feature of the Discursive Dilemma. How the group orders the votes matters significantly:
          *   **Proposition-by-Proposition Voting:** As described, leads to potential inconsistency (P=True, Q=True, R=False).
          *   **Conclusion-Driven Voting:** If the group votes *first* on R (Approval), the majority votes "No". They then might vote on P and Q, but the outcome is constrained. Only members who voted "No" on R *could* logically be part of majorities rejecting P or Q. The final outcome *could* be consistent (e.g., ~P, ~Q, ~R or ~P, Q, ~R, etc.), but it depends entirely on the first vote and subsequent votes.
          *   **Premise-Driven Voting:** If the group agrees *only* to vote on the premises (P and Q) and then *derives* R from the majority votes on the premises, consistency is preserved. If P=True and Q=True by majority, then R *must* be True. However, this ignores the group's potential majority preference on R itself.
          The key point is: **The same profile of individual judgments can lead to *different* (and sometimes inconsistent) collective outcomes depending solely on the voting procedure (order and which propositions are voted on vs. derived).** This procedural dependence underscores the dilemma.

      *   **Hidden Inconsistency:** This is also intrinsic to the Discursive Dilemma and arises directly from the common practice of voting on propositions separately. The inconsistency only becomes apparent *after* all votes are tallied and someone attempts to integrate the results according to the logical rules. During the voting process, each vote seems reasonable and isolated. The "package" inconsistency is an emergent property of the aggregation method applied to the interconnected propositions. There isn't a distinct term solely for this "hidden" aspect; it's described as the inconsistency being revealed only upon aggregation or when considering the collective judgment set as a whole.

  3.  **What It Is NOT - Distinguishing from Nearby Concepts:**

      *   **Not Mere Group Division:** A group can be deeply divided on an issue without being inconsistent. For example, a 50-50 split on a single proposition shows division but no logical inconsistency. The Discursive Dilemma requires *multiple interconnected propositions* and an *inconsistent collective set* derived from them.
      *   **Not Individual Inconsistency:** You explicitly state individuals *are* consistent. This is fundamental. The paradox arises *despite* individual rationality. This distinguishes it from situations where the group inconsistency stems from members who are themselves confused.
      *   **Not Condorcet's Paradox (Cycling Preferences):** Condorcet's Paradox deals with *preferences* over *alternatives* (e.g., candidates A, B, C) where majority voting can lead to cyclical social preferences (A>B, B>C, C>A). The Discursive Dilemma deals with *judgments* on *propositions* linked by *logical rules*, leading to an inconsistent set of collective *truth values*. The logical structure is different.
      *   **Not Arrow's Impossibility Theorem:** Arrow's theorem is a broader, fundamental result about the impossibility of designing a perfect preference aggregation system meeting specific fairness criteria. The Discursive Dilemma is a specific, concrete *instance* of the kind of problems Arrow's theorem predicts, but focused on judgment aggregation on interconnected propositions.
      *   **Not Logrolling (Vote Trading):** Logrolling involves individuals strategically trading support on *different* issues they care about unequally to get their preferred outcome on their top priority. In the Discursive Dilemma, as you describe it, individuals are voting sincerely according to their consistent beliefs on each proposition; there's no strategic trading implied or required for the paradox to occur. The inconsistency arises from sincere voting + aggregation method + logical connections.
      *   **Not the "Doctrinal Paradox":** This is often used interchangeably with the Discursive Dilemma, but technically, the Doctrinal Paradox is a specific *subtype*. It refers to cases where the conclusion (like R in your example) is defined by a conjunction (P AND Q) or disjunction of the premises. The Discursive Dilemma is the broader term encompassing the Doctrinal Paradox and other logical connections (e.g., implications, more complex rules). Your drug example *is* a Doctrinal Paradox, which *is* a Discursive Dilemma.

  4.  **Summary and Proposed Terminology:**

      *   **The Core Phenomenon:** You are describing the **Discursive Dilemma**. This term encompasses:
          *   Individual consistency.
          *   Collective inconsistency on logically interconnected propositions.
          *   Aggregation by majority vote on each proposition individually.
      *   **Integral Features:**
          *   **Order-Dependence/Path-Dependence:** A direct consequence of the dilemma, highlighting how the voting sequence or which propositions are voted on vs. derived determines the outcome (and its consistency).
          *   **Hidden Inconsistency:** An inherent result of the separate voting procedure; the inconsistency is emergent and only visible after aggregation.
      *   **Your Concrete Case:** This is a specific instance known as the **Doctrinal Paradox** (where the conclusion is a conjunction of premises), which falls under the umbrella of the Discursive Dilemma.
      *   **Boundary Cases:**
          *   *Not Discursive Dilemma:* Voting on completely independent propositions (no logical constraint between them), even if inconsistent individuals cause collective inconsistency. Voting on a single proposition. Preference aggregation without a logical constraint rule.
          *   *Is Discursive Dilemma:* Any set of propositions with logical dependencies (conjunction, disjunction, implication, etc.) where sincere majority voting per proposition yields a collective set violating those dependencies, despite individual consistency. Examples include jury decisions based on elements of a crime, policy packages with prerequisites, or committee approvals like your drug case.

  **In essence:** You've pinpointed the **Discursive Dilemma**, a profound challenge to collective rationality. It demonstrates that aggregating individual judgments on interconnected issues via majority rule, even when individuals are perfectly rational, can force the group into an inconsistent position. The order-dependence and hidden nature of the inconsistency are not separate phenomena; they are fundamental characteristics revealing the vulnerability of piecemeal majority voting in complex decision environments. The specific case involving a conjunction rule (like your drug approval) is the **Doctrinal Paradox**, the most common illustration of this dilemma. Solutions often involve changing the aggregation method (e.g., premise-based voting, conclusion-based voting, or more complex aggregation functions), accepting holistic "package" votes, or acknowledging the inherent limitation.
