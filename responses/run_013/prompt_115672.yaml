prompt: |-
  I'm helping write a style guide for how our science desk covers behavior genetics, and before we fight over wording I want the spec rather than a defintion. So what does any adequate account of heritability have to be able to do? Give me the requirements list — the cases it has to get right, the distinctions it can't collapse, the results it has to stay consistent with — with the case or finding behind each requirement, and say which ones are non-negotiable and which are just the tastes of one camp. A few things I keep tripping over and want the list to handle: a trait can be strongly heritable and still shift a lot when you change the environment, and there are conditions that are about as genetic as anything gets yet can be headed off entirely with a diet; heritability is supposed to be about variation within a population, not about what caused the trait in any one person; and the same trait comes out more heritable in some populations than others, which is why I get nervous when the number gets used to say something about individuals or about differences between groups. I also want a requirement that forces a claim like "this trait is 70 percent genetic" to come out either true or false, or else shows it's a category error. If some pair of the requirements can't be satisfied together — I suspect "it's a stable property of the trait" and "it tells you what happens when you intervene" are fighting — say so, since thats the part I most want. Which single requirement does the most to rule out the way people usually talk about this? And one line each on how the standard variance-ratio reading, the "genetic influence" reading, and the complaint from developmental people that the whole framing is misleading do against the list. American English please, and no reading list — just the criteria.
reasoning: |-
  Okay, the user is helping write a style guide for a science desk on behavior genetics. They want a list of requirements that any adequate account of heritability must satisfy, rather than just a definition. They mentioned specific issues they're tripping over: heritability doesn't mean environment can't change the trait, it's about population variation not individuals, and it varies across populations. They also want a requirement that addresses whether "this trait is 70% genetic" is valid, and they suspect some requirements might conflict.

  First, I need to recall the core concepts of heritability. Heritability (h²) is the proportion of phenotypic variance due to genetic variance in a population. It's not about an individual's traits but population-level variation. The user's points about environmental interventions changing highly heritable traits (like PKU) and population dependence are key. 

  The user wants a clear distinction between what's non-negotiable (scientific consensus) versus camp preferences. They also want to identify conflicting requirements, like stability vs. intervention prediction. The main confusion in public discourse is attributing heritability to individuals, so Requirement 4 seems crucial here.

  For the "70% genetic" claim, Requirement 5 should address that as a category error. The conflict between Requirement 3 (population-specific) and Requirement 6 (non-intervention) needs highlighting. 

  The variance-ratio approach (Requirement 1) is the standard but misses developmental insights. The "genetic influence" reading often violates Requirements 4 and 5. Developmentalists argue the focus on partitioning variance is misleading, emphasizing instead how genes and environment interact dynamically.

  I should structure the requirements around population-level variance, environmental influences, non-applicability to individuals, population specificity, avoiding proportional attribution, and intervention limitations. Each requirement needs a real-world case to illustrate it, like PKU for Requirement 2. 

  Non-negotiables would be Requirements 1-5, while Requirement 6 might have some dissent. The biggest conflict is between population-specificity (Requirement 3) and the misconception that heritability is stable. Also, Requirement 5 directly challenges the "70% genetic" phrasing. 

  The user's deeper needs include preventing misinterpretation in science communication, ensuring accurate reporting, and avoiding reinforcing genetic determinism or misuse in group differences. Highlighting these in the requirements will help their style guide enforce clarity and accuracy.
answer: |-
  Here's a requirements list for any adequate account of heritability, based on core scientific consensus and the pitfalls you highlighted. Non-negotiables are marked **(NN)**.

  ### Requirements for an Adequate Account of Heritability

  1.  **Population Variance Anchor (NN):** *Must explain heritability as a property of observed variation *within a specific population* at a specific time.*
      *   **Case:** Height heritability is ~80% in stable, affluent populations but lower in populations with highly variable nutrition. The trait (height) is the same, the *variation pattern* differs.
      *   **Why:** Heritability (h²) quantifies the proportion of phenotypic *variance* (differences) attributable to genetic *variance* in that group/environment. It is not a fixed property of the trait itself.

  2.  **Environmental Change Compatibility (NN):** *Must be consistent with highly heritable traits changing dramatically due to environmental interventions, even becoming absent.*
      *   **Case:** Phenylketonuria (PKU) is ~100% "genetic" (caused by a single gene mutation). Yet, a strict diet prevents intellectual disability entirely. High heritability ≠ immutability.
      *   **Why:** Heritability estimates the *current sources of variation*, not the potential for change. It says nothing about what happens if you alter the environment.

  3.  **Population Specificity (NN):** *Must explain why the *same trait* can have different heritability estimates in different populations or environments.*
      *   **Case:** IQ heritability is often higher in socioeconomically homogeneous/advantaged groups because environmental variation is minimized. In groups with large environmental disparities (e.g., access to education), heritability drops as environment explains more variance.
      *   **Why:** h² = Genetic Variance / Total Phenotypic Variance. If the environmental variance component changes significantly (even if genes don't), h² changes.

  4.  **Not About Individual Causation (NN):** *Must preclude interpreting heritability as explaining the cause of the trait *in a single individual*.*
      *   **Case:** Saying "your height is 80% due to your genes" based on population h² is meaningless. An individual's height is 100% the product of their specific genes *and* specific environment interacting.
      *   **Why:** Heritability partitions *population variance*, not individual development. Every individual is 100% nature *and* 100% nurture – it's the *differences between people* that h² analyzes.

  5.  **Reject Proportional Attribution (NN):** *Must render statements like "Trait X is 70% genetic" false or a category error when applied to the trait itself or individuals.*
      *   **Case:** Claiming "Intelligence is 70% genetic" misleads by implying a fixed, intrinsic property of intelligence or applies a population statistic to individuals. The requirement forces this to be recognized as invalid.
      *   **Why:** Heritability is a population statistic about variation sources, not a measure of the "geneticness" of the trait per se or any individual's trait value. The trait itself arises from inextricable GxE interactions in development.

  6.  **No Intervention Prediction (Contested):** *Must acknowledge that heritability *does not predict* the outcome of an environmental intervention on the population mean or variance (beyond the trivial case of eliminating all genetic variation).*
      *   **Case:** High heritability for a disease doesn't tell you if an environmental treatment (e.g., a new drug, educational program) will be effective or how much it will reduce the disease incidence. PKU's high heritability doesn't predict the diet's efficacy; biology does.
      *   **Why:** Heritability reflects current variation structure, not developmental dynamics or potential responses to *novel* environments. **Conflict Point:** This directly clashes with the common (mis)use of h² to imply genetic traits are "harder to change."

  ### Key Conflict & The Biggest Rule-Out

  *   **Conflict:** Requirement 3 (Population Specificity) fundamentally conflicts with the desire for heritability to be a "stable property of the trait." Stability is a misconception. Requirement 6 (No Intervention Prediction) conflicts with the intuitive (but wrong) belief that high h² means interventions won't work.
  *   **Biggest Rule-Out Requirement:** **Requirement 4 (Not About Individual Causation)** does the most heavy lifting to dismantle common miscommunication. It directly prohibits the pervasive error of taking a population statistic and applying it causally to individuals ("Your genes made you do it").

  ### How Different Perspectives Tackle the List

  1.  **Standard Variance-Ratio:** Nails Requirements 1, 2, 3, 4, 5. Explicitly defines h² as Vg/Vp. Struggles conceptually with 6, often leading to misinterpretation despite the math being correct.
  2.  **"Genetic Influence" Reading:** Often violates Requirements 4 and 5 catastrophically by implying heritability measures the genetic *contribution* to the trait itself or individuals, leading to genetic determinism. May downplay 2 and 3. Fails the core requirements.
  3.  **Developmental Critique:** Argues the *entire framing* (partitioning variance) is misleading (violates the *spirit* of 4 & 5). Emphasizes that Requirements 2 and 6 expose the fundamental limitation: h² tells you nothing useful about developmental processes or intervention potential. Focuses on the inextricable interaction (GxE) in ontogeny, making any variance partitioning an artificial abstraction.

  **Use this list to vet definitions:** Any phrasing that fails a **(NN)** requirement is scientifically inadequate. Any phrasing that obscures Requirement 4 or 5 is likely to mislead readers. The core takeaway: **Heritability describes the pattern of differences *within* a group, not the cause of the trait in anyone, nor its potential for change, nor differences *between* groups.**
