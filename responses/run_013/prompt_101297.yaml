prompt: |-
  I write a long-form column on science and ideas, mostly where decision theory, artificial intelligence and the rationalist subculture overlap, and for the past two years I have also sat as a trustee of a small charitable fund — a modest giving circle, five-figure grants, a committee of six that meets quarterly and signs off collectively. The two roles have collided in a way I did not expect. A surprising share of the proposals and pressure letters that reach the fund are built on decision-theoretic arguments of a single recurring shape, and I keep meeting that shape in my reporting as well: a correspondent who claims a predictor has already acted on the basis of what I would have chosen; a donor who frames a demand so that paying him would be evidence that I had not been singled out for misfortune, and refusing would be evidence that I had; a source who insists that my refusing now will be punished in a branch of reality I shall never observe. I understand the canonical cases well enough in the abstract — counterfactual mugging, where a perfect predictor flips a fair coin, asks me for a hundred pounds if it lands tails, and would have paid me ten thousand had it landed heads and had it predicted that I would pay; and the so-called XOR blackmail, where Omega tells me it has sent me a message if and only if my house is infested with termites or I pay it, the infestation being ruinous and the payment trivial, so that paying looks like evidence against the infestation rather than a way of preventing it. What I lack is anything I can actually run in a committee meeting, under time pressure, with a real person and real money in the room and no Omega that can be verified to exist.

  Please turn whatever the theory genuinely knows about these cases into a procedure a lay trustee like me can follow. I want the questions asked in order, what would count as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it must hand the matter to a person because what remains is a question of value or of nerve rather than of fact. I would rather it kept the distinctions that carry weight than flattened them: whether I am choosing a single act or a policy that will be applied recurrently; whether the benefit of the cooperative answer falls on me or only on a counterpart self in a branch I shall never see (the difference between the all-upside and the mixed-upside cases the literature distinguishes); whether the reasoning on offer is causal, evidential, or of the functional sort that treats the predictor's model of me as the thing actually being chosen; and, above all, what follows when the predictor's existence and honesty cannot be checked at all, which I suspect is the ordinary situation and where I expect the procedure to collapse most cases. Then run it on three worked cases: the canonical counterfactual mugging; the termite message; and one ordinary case of your choosing in which the procedure returns an answer I shall not want — a promise or commitment I would rather wriggle out of, say — so that I can see what it costs to follow it.

  Please write in British English, and be candid about the limits: tell me which steps are genuine inference and which are judgement dressed up as procedure, where the procedure is most likely to misfire on a case that superficially fits, and what argument or consideration would change your mind about the central verdict — in particular, what would have to be true of the predictor, or of the recurrence of the choice, for the paying answer to be the right one rather than a rationalisation. If you think no honest procedure can be given here, say so plainly and explain what someone in my position should do instead.
reasoning: |-
  Hmm, this is a fascinating and complex request. The user is a science columnist and charity trustee grappling with how decision-theoretic puzzles manifest in real-world funding decisions. They've encountered proposals using concepts like counterfactual mugging and XOR blackmail, but need a practical framework for committee settings without verified predictors.

  The core challenge seems threefold: First, translating abstract decision theory into actionable steps for time-pressed committees. Second, distinguishing between argument types (causal/evidential/functional). Third, handling the critical reality that predictors are never verifiable in practice. The user explicitly wants British English and candour about procedural limitations.

  Key observations from their description:
  - They regularly face proposals built on "single recurring shape" of decision-theoretic arguments
  - Committee context adds pressure: real people, real money, no time for theoretical debates
  - They want to preserve crucial distinctions (one-off vs policy, beneficiary type, reasoning type)
  - Predictor unverifiability is the norm and likely dealbreaker
  - They seek concrete examples including one where the answer is uncomfortable

  For the procedural design, I should consider:
  - Must start with existence verification - this will filter most cases
  - Need clear exit ramps when arguments shift from factual to value-based
  - Should explicitly flag where "procedure" is actually value-laden judgment
  - Must handle the beneficiary distinction (self vs counterfactual selves)
  - Should demonstrate failure modes through worked examples

  The three cases they want analyzed are telling:
  1. Canonical counterfactual mugging - tests abstract theory applicability
  2. Termite message (XOR blackmail) - examines evidential reasoning traps
  3. An "unwanted answer" case - will showcase procedural teeth

  For the third case, I'm considering a grant proposal that commits future funding based on hypothetical scenarios - uncomfortable but structurally revealing. The analysis must show where the procedure forces a tradeoff between consistency and short-term convenience.

  Critical limitations to emphasise:
  - Unverifiable predictors collapse the framework
  - "Policy commitment" arguments often mask value judgments
  - Functional decision theory requires swallowing hard metaphysical claims
  - Committees may reasonably reject even procedurally "correct" answers on other grounds

  The response should maintain academic rigour while being brutally practical - this user clearly despises handwaving. British phrasing like "scheme" and "stump up" will help meet their stylistic request. Most importantly, I must resist any temptation to oversimplify the genuine tensions in these dilemmas.
answer: |-
  Right then. This collision between the rarefied air of decision theory and the blunt realities of committee governance is a sticky wicket. You're spot on – the abstract purity of Omega vanishes when facing a live solicitor across a table, clutching a proposal that smells faintly of blackmail dressed as rationality. What follows is a practical procedure, grounded in the *known limitations* of these arguments when predictors are unverified. It prioritises defensible committee decisions over theoretical purity, explicitly flags judgement calls, and ruthlessly filters out the unverifiable. Think of it as triage for decision-theoretic demands.

  **The Trustee's Triage Procedure for Predictor-Based Demands**

  **Core Principle:** Unverified predictors are indistinguishable from bluff, conjecture, or deception. The burden of proof for their existence, capability, and honesty rests entirely and overwhelmingly on the solicitor. The procedure aims to expose whether the demand hinges *factually* on a verified predictor or *evaluatively* on speculative metaphysics or values.

  **Questions to Ask, In Order:**

  1.  **"Can you demonstrate, right now and to this committee's reasonable satisfaction, that this predictor *exists*, is *capable* of the feats you claim (e.g., near-perfect prediction, branching manipulation), and is acting *honestly* in this specific instance?"**
      *   **Sufficient Answer:** Verifiable, independently audited evidence of the predictor's *past* and *relevant* performance under controlled conditions matching *this specific scenario*. (e.g., Public, replicated demonstrations of predicting complex human decisions in counterfactual mugging/XOR setups; cryptographic proof of cross-branch communication). Testimonials, unpublished papers, or theoretical arguments are **insufficient**.
      *   **Stop with No:** If no such demonstration is provided, or the evidence is deemed unconvincing by the committee (e.g., "Trust me", "Our internal models show...", "Philosophically, it *must* exist"). **This collapses the vast majority of real-world cases.**
      *   **Why here?** This is the bedrock. Without a verified predictor, the entire edifice is built on sand. The unique leverage of these thought experiments depends entirely on Omega's proven existence and infallibility. Absent that, it's just a story.

  2.  **(Only if Q1 is satisfied) "Is the benefit of cooperating (e.g., paying) primarily experienced by *us, here, now* in this branch of reality, or only by *counterpart versions of us* in branches we will never observe?"**
      *   **Sufficient Answer:** A clear, verifiable mechanism showing how cooperation materially benefits *this* committee, *these* trustees, *this* charity, in *this* timeline. Evidence that refusing harms *us* concretely *here*.
      *   **Stop with No (or strong lean towards No):** If the *only* claimed benefit accrues to unobservable counterparts ("It saves your other selves in doomed branches", "It fulfils a timeless decision principle only observed in the multiverse"). This distinguishes the "mixed-upside" (Counterfactual Mugging, where *you* only lose) from "all-upside" (some acausal trade hopes, but unverified) or causal cases.
      *   **Why?** Committees steward *real* resources for *real* beneficiaries in *this* world. Sacrificing tangible resources here for purely counterfactual gains elsewhere is generally beyond a charity's remit and requires extraordinary justification (effectively a values call, see Q5).

  3.  **(Only if Q1 & Q2 are satisfied, or if Q1 fails *but* Q2 suggests *this-world* benefit) "What is the *causal mechanism* by which cooperating/refusing leads to the good/bad outcome *in this branch*? Does the evidence presented show this mechanism operates *independently* of the predictor's claim?"**
      *   **Sufficient Answer:** A clear, physically plausible causal chain that doesn't rely on the predictor's announcement *as evidence* being the *only* link. Does paying *cause* the termites to vanish? Does refusing *cause* Omega to punish *us*?
      *   **Stop with No:** If the *only* link is *evidential* (e.g., "Paying *is evidence* your house *isn't* infested, but doesn't *cause* it to be safe"; "Refusing *is evidence* you've been singled out, but doesn't *cause* the misfortune"). This targets XOR blackmail and its kin. Evidential reasoning is fragile and easily manipulated without a verified predictor. The committee must ask: Is this evidence reliable *without* the predictor's guarantee (Q1)? Is there a *causal* reason to pay beyond buying peace of mind based on shaky evidence?
      *   **Why?** Separates causal levers (which committees can potentially pull) from purely Bayesian updates based on unverified signals. Evidential arguments collapse hardest without a verified honest predictor (Q1).

  4.  **(Only if Q1 is satisfied) "Is this a one-off choice, or are we being asked to commit to a *policy* that will bind us in future, similar situations?"**
      *   **Sufficient Answer:** Clarity on scope. Is this grant/action unique, or does it set a precedent? Does the solicitor *want* a policy commitment?
      *   **Judgement Call:** If a policy is requested, the committee must judge: Can we *realistically* apply this policy consistently? Does the verified predictor (Q1) guarantee consistency *across* all relevant future instances? What are the *this-world* (Q2) consequences of adopting vs. not adopting the policy? **This shifts heavily towards values and pragmatism.** Theoretical arguments for policy consistency (functional decision theory) are compelling *only if* the predictor is verified and the policy's this-world effects are acceptable.
      *   **Why?** Functional arguments ("We must choose the policy now that we'd want our copies to follow everywhere") depend utterly on Q1 and Q2. Without them, it's a demand for blind pre-commitment based on speculation. With them, it's a serious strategic consideration, but still weighed against this-world effects.

  5.  **"Even if the predictor is unverified, the benefit counterfactual, and the reasoning evidential, does the committee judge that cooperating aligns with our core values, mission, or ethical commitments *despite* the lack of rational leverage, perhaps as an act of good faith, precaution, or solidarity?"**
      *   **Handover Point:** This is **always** a handover to human judgement, values, and nerve. The *procedural* logic based on decision theory likely stopped at Q1 or Q2. This question acknowledges that sometimes, even if the decision-theoretic argument fails, other factors might compel action. It's where "should we?" replaces "must we rationally?".
      *   **Key Distinction:** This is *not* succumbing to the decision-theoretic blackmail. It's a conscious choice *despite* recognising the lack of rational compulsion, based on separate values. The solicitor hasn't *proven* their case via decision theory; the committee is choosing on other grounds.

  **Summary of Exit Points:**
  *   **Stop with No:** Failure at Q1 (Predictor unverified) or Q2 (Only counterfactual benefit). Failure at Q3 (Purely evidential, no causal mechanism *and* predictor unverified) usually reinforces No.
  *   **Handover to Values/Nerve:** Q5. Or, potentially, after Q4 if the policy choice involves significant value trade-offs beyond pure instrumental rationality, even with a verified predictor.
  *   **Proceed (cautiously):** Only if Q1 is convincingly satisfied *and* Q2 shows this-world benefit *and* Q3 shows a plausible causal mechanism (or the evidential link is overwhelmingly strong *because* Q1 is satisfied). Q4 then frames the scope.

  **When Paying Might Be Rational (What Would Change the Verdict):**
  The procedure only endorses paying if Q1 is **conclusively passed**. What would make Q1 passable?
  *   **Concrete Demonstration:** Omega physically manifests in the boardroom, demonstrates flawless prediction on verifiable past committee decisions *of the same type*, and provides cryptographic proof of its actions in the counterfactual branch (for mugging). For XOR, it demonstrates control over termite infestations and the message mechanism independently of the announcement.
  *   **Recurrence with Verification:** If the *same* verified predictor presents *many* such opportunities over time, and consistently rewards cooperation/punishes defection *observably in this branch*, then a *policy* of cooperation (Q4) becomes rationally compelling (functional decision theory validated by experience). One-off muggings, even with verification, remain a painful this-world loss for counterfactual gain.

  **Worked Cases:**

  **1. Canonical Counterfactual Mugging (Predictor flips coin, asks £100 on Tails, would have paid £10k on Heads if predicted you'd pay)**
  *   **Q1:** "Can you prove Omega exists, predicted accurately, and would have paid?" Solicitor: "No, it's hypothetical/a thought experiment." **STOP WITH NO.** *Rationale:* Predictor utterly unverified. Core mechanism fails. Paying is pure loss here for unverifiable counterfactual gain.
  *   **Procedure Verdict:** Reject. Paying would be charity based on speculation, not rational compulsion.

  **2. Termite Message (XOR Blackmail: Message iff (Infested XOR Paid). Infested=ruin, Payment=trivial.)**
  *   **Q1:** "Can you prove this 'Omega' entity exists, controls termites *and* messaging, and is honest?" Solicitor: "We have an AI model that correlates these factors historically, but no proof of control or honesty." **STOP WITH NO.** *Rationale:* Predictor/controller unverified. Evidence (receiving the message) is only meaningful *if* Omega is verified honest. Without that, receiving the message proves nothing; paying proves nothing and doesn't *cause* safety.
  *   **Q3 (Hypothetical if Q1 passed):** If Omega *was* verified? Then paying *is* strong evidence of no infestation (because if infested, Omega wouldn't message if you paid, per rules). But does paying *cause* safety? Only if Omega *causes* the infestation based on your decision (which would make it causal blackmail, not XOR). If infestation is independent, paying only buys (verified) information. **STOP WITH NO or Handover to Values.** *Rationale:* Paying doesn't fix the problem; it only tells you about it via a verified source. You'd pay for accurate diagnosis, not prevention. The evidential argument *only* works with Q1 satisfied, and even then, you're paying for information, not prevention. Prevention would require a *causal* mechanism (Q3).
  *   **Procedure Verdict:** Reject. Paying is responding to unverified evidential blackmail. Get a proper termite inspection instead.

  **3. The Unwanted Answer: The Recurring Policy Commitment (Your Costly Case)**
  *   **Scenario:** A research group requests a £20k grant. They study "High-Stakes Alignment Early Warning Systems". They argue: "Our models predict potential future AI catastrophe scenarios. Funding us now signals your commitment to a *policy* of supporting pre-emptive mitigation. This policy commitment is what our models (and other, future superintelligent actors) will use to predict your behaviour. If you defect now (refuse), it functionally updates their model that your fund is *not* committed, making future crucial cooperation harder or more expensive. Paying now is cheap; the cost of lost trust later could be existential. Think functional decision theory across time!"
  *   **Procedure:**
      *   **Q1:** "Can you prove your models are accurate predictors capable of modelling our committee's future decisions and that future superintelligences exist/will care?" Solicitor: "Not conclusively, but it's a plausible model based on rational agent principles. The risk is asymmetric!" **STOP WITH NO (on decision-theoretic grounds).** *Rationale:* Predictor (their models, future AIs) is unverified. The core "functional update" mechanism is speculative and unproven.
      *   **Q4/Q5 Handover:** However, the solicitor has framed this as a *policy* commitment request. The *procedural* logic (based on DT) failed at Q1. But the committee must now decide:
          *   **Values/Nerve 1:** Do we *want* to establish a *policy* of funding pre-emptive AI risk mitigation, based on its inherent importance (our values), *regardless* of this functional blackmail argument? Is this group credible and effective towards that *real* goal?
          *   **Values/Nerve 2:** Is the *specific* argument about "signalling commitment" *pragmatically* compelling *enough* for our real-world strategy, even if its decision-theoretic justification is unproven? Could refusing *genuinely* damage relationships with *real* actors in *this* field?
  *   **The Cost:** The procedure forces you to decouple the speculative decision-theoretic blackmail ("Pay or be punished by predictors!") from the substantive value question ("Is this research intrinsically valuable and aligned with our mission?"). You might *want* to fund it for good reasons, but the procedure stops you from using the functional DT argument *as rational compulsion* because it's unverified (Q1). You have to justify it on real-world grounds (Q5), which might be harder or feel less "technically clever". Refusing the grant might be strategically unwise for *real* relationship reasons, but again, that's a pragmatic values call, not DT compulsion. Following the procedure costs you the intellectual comfort of hiding behind a rationalist argument; you have to own the value judgement.

  **Where the Procedure is Brittle (Candid Limits):**

  1.  **Q1 is a Cliff Edge:** It's deliberately binary and demanding. "Reasonable satisfaction" is a **judgement call** dressed as procedure. A very slick solicitor *might* present superficially impressive but ultimately unverifiable "evidence" that sways a committee, making the procedure misfire by proceeding when it shouldn't. Conversely, an overly sceptical committee might dismiss evidence that *should* be sufficient (if Omega *did* verifiably exist!).
  2.  **Q2's "This-World Benefit":** Distinguishing tangible benefits from counterfactual or acausal ones relies on **metaphysical judgement**. Committees might reasonably disagree on what constitutes a "real" benefit here and now. The procedure assumes a materialist, single-branch default, which is a value-laden stance itself.
  3.  **Q5 is Pure Values:** Calling it "procedure" is a fig leaf. This step is entirely about the committee's guts, mission, and ethics, unconstrained by decision theory once the predictor fails verification. The procedure merely signposts *when* you've reached this point.
  4.  **False Negatives?** In the vanishingly rare case where a predictor *is* real and verified *but* the benefit is purely counterfactual (like a true Counterfactual Mugging with proven Omega), the procedure would still stop at Q2 ("No *this-world* benefit"). This is a **deliberate choice** reflecting the fiduciary duty of a charitable trustee. Funding purely counterfactual gains is hard to justify as responsible stewardship. This is where committee nerve *really* gets tested – would you pay £100 of real charity money knowing you get absolutely nothing back, solely because a proven Omega says you rationally should? The procedure says No; a committee might override on principle (Q5).
  5.  **Recurrence is Hard:** Evaluating a request for a *policy* commitment (Q4) under time pressure is fiendishly difficult. Judging long-term consistency and real-world impacts requires deep deliberation, not a flowchart.

  **The Upshot:**

  No honest procedure built *purely* on decision theory can compel action when the predictor is unverified. The unique force of these thought experiments dissolves upon contact with reality. **What you should do instead is exactly what this procedure provides: a robust shield against being bullied or bamboozled by unverifiable decision-theoretic arguments in the committee room.** It forces the solicitor to prove the fantastical mechanism or shifts the decision firmly onto the familiar, if uncomfortable, grounds of values, mission, evidence, and real-world cause-and-effect. It prevents the charity's funds from being siphoned off by the latest rationalist-adjacent grift dressed in Pearl notation. Use it ruthlessly. The cost of following it – having to make hard value judgements openly, without the fig leaf of spurious rationality – is the price of responsible trusteeship. Keep writing the column; run the fund by the book, not by the unproven counterfactual.
