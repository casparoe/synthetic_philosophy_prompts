prompt: |-
  Ok, I'm hoping this is a "does it have a name" question and not a "you're confused" question.

  I keep running into a distinction I don't have a word for. Two of my opinions can be equally likely as far as I can tell -- same answer if you ask me to put a number on it -- and yet one feels solid and the other feels like thin ice. I'd stake very different amounts on them, and if one of them turned out to be wrong I'd be shaken by one and almost relieved by the other. The solid one isn't more probable, its more supported. And what seems to make it solid isn't how likely it is, it's how much is behind it and how varied the support is. If I read three more books that say the same thing I already believed, I don't come away thinking it's any more likely to be true, but it definately feels harder to knock over.

  Two cases where the two things come apart. (a) Two doctors both tell me a lump is probably benign, both 80%. One has seen five cases like mine, the other five thousand. Same number, and I trust the second one far more. (b) I ask whether A is more likely than B, and honestly the answer isn't yes, no, or "they're the same" -- it's that with the information I've got, the question doesn't have an answer yet. Related to the first thing, maybe the same thing, I can't tell.

  Someone told me this is just ambiguity aversion, but no -- that's about not knowing the odds. Here I know the odds, I just don't know how much they're worth. And "confidence" is useless, because that's just another name for how sure I am, which is exactly what I'm trying to pull this apart from.

  So: is there an established name? I'd be shocked if nobody made this cut before -- feels like the kind of thing an economist or a philosopher of science would've fussed over a long time ago. If it does have a name, I want the carving, not the label: what the thing actually is, what the nearest neighbouring ideas are and how this differs from each of them, and which one fits best. If there's no name, coin one and define it properly, boundary cases included. A bare name won't do me any good.

  And lead with your bottom line in the first sentence, then the reasoning -- no preamble, don't restate my question.
reasoning: |-
  Hmm, the user is describing a phenomenon where two opinions can have the same numerical probability estimate (like 80% likely), but feel fundamentally different in terms of how "solid" or "supported" they feel. They give examples: trusting a doctor with 5000 cases more than one with 5 cases despite both saying 80%, and situations where probability estimates feel premature because there's insufficient information. They explicitly reject "ambiguity aversion" and "confidence" as answers, wanting a precise conceptual carving of this distinction.

  This is clearly about epistemic robustness - how resistant a belief is to counterevidence. The key insight is that probability estimates don't capture the structural properties of the evidence base. A doctor with 5000 cases has evidence that's more resilient to sampling errors, rare events, or individual misjudgments. 

  The best framework here is probably Deborah Mayo's "severity" concept from philosophy of science - how rigorously a claim has been tested. In statistics, it relates to confidence interval width and sample size effects. The doctor with larger n has a tighter error distribution around that 80% estimate. 

  Other neighboring concepts: "Resiliency" (how much probability changes with new evidence), "security" (in economics - robustness to model uncertainty), and "weight of evidence" (which combines support and resilience). But severity captures the anti-fragility aspect best - that well-tested beliefs actually strengthen when they survive challenges.

  For boundary cases: If two beliefs have identical evidence variety and testing depth, severity should be equal regardless of probability. And low-probability claims can be highly severe if they've survived fierce attempts to falsify them.

  This distinction matters crucially for decision-making under uncertainty - the user's instinct to stake more on severe beliefs is rational because they're less likely to collapse upon new information.
answer: |-
  The distinction is **severity of evidence** (or equivalently, **severity of test**).  

  ### Core Concept
  **Severity** measures how rigorously a claim has been tested against potential errors or alternatives. A high-severity assessment withstands challenges because its evidence is diverse, extensive, and actively probed for weaknesses. Probability estimates (e.g., 80%) reflect *degree* of belief, while severity reflects *robustness* of that belief against counterevidence.  

  ### Key Distinctions from Neighboring Concepts
  1. **Probability vs. Severity**:  
     - Probability quantifies likelihood (e.g., "80% chance").  
     - Severity quantifies how *reliably* that probability would change if wrong (e.g., "How easily would 5,000 cases expose a flaw vs. 5 cases?").  
     - *Example*: Both doctors assign 80% probability, but the second doctor's estimate has higher severity due to larger, more varied data.  

  2. **Confidence vs. Severity**:  
     - "Confidence" is often conflated with probability (e.g., "I'm 80% confident").  
     - Severity is structural: it depends on evidence diversity, sample size, and testing methods. Adding identical evidence (e.g., three similar books) may raise confidence but not severity.  

  3. **Ambiguity Aversion vs. Severity**:  
     - Ambiguity aversion is discomfort with *unknown* probabilities.  
     - Severity applies when probabilities *are* known but lack epistemic weight due to weak evidence.  

  4. **Weight of Evidence**:  
     - Closely related, but "weight" (Keynes, Peirce) often combines support and robustness.  
     - Severity specifically isolates robustness: *How well would this evidence detect if I’m wrong?*  

  ### Why Severity Fits Best
  - **Your doctor example**: The 5,000-case assessment has higher severity because it’s less vulnerable to random error (law of large numbers) and more likely to have encountered edge cases.  
  - **A vs. B indeterminacy**: When evidence is too thin, no severity-backed probability exists. Claiming equality or superiority is unjustified until tests rule out relevant errors.  
  - **Feeling "solid"**: High-severity beliefs resist falsification; being wrong would require overthrowing a robust evidence structure. Low-severity beliefs collapse easily.  

  ### Boundary Cases
  - **Equal severity, different probabilities**: Two well-tested hypotheses (e.g., "Coin A is biased 70% heads," "Coin B is 30% heads") both have high severity but oppose each other.  
  - **Low probability, high severity**: A claim with 10% probability might have high severity if rigorously tested (e.g., "This drug has rare side effects" confirmed via massive trials).  
  - **High probability, low severity**: An 80% probability based on small, homogenous data feels "thin" because minor new evidence could颠覆 it.  

  ### Bottom Line
  **Severity** explains why identically probable claims feel epistemically unequal: it quantifies the *evidential scaffolding* supporting a probability, not the probability itself. Use it when stakes depend on a belief’s resilience, not just its likelihood.  

  *(Concept from Deborah Mayo’s error-statistical philosophy, extending Peirce and Popper.)*
