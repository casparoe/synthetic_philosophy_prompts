prompt: |-
  I'm writing a long feature on tacit skill — the people who can do things they cannot explain — and before I file I want to state the strongest philosophical objection to my subject's own self-description, then answer it. A researcher I interviewed, who regards the distinction between knowing how and knowing that as a piece of folklore, handed me the argument below and invited me to break it. I have not managed to, which is why I'm asking someone else to.

  (1) When we say that someone knows how to do something, we credit her with knowledge, not merely with a knack. If the phrase named nothing but an ability, it would be a euphemism, and we could not say that she had forgotten how, or that she knew how but could not bring herself to do it.
  (2) Knowledge is knowledge of truths, and a truth that is known is a proposition that is known.
  (3) So if someone knows how to do something, there is some proposition she knows in virtue of which she can do it.
  (4) Maya grades the ripeness of a mango by touch with almost perfect reliability, on a scale finer than any instrument she has been shown, and she is not deluded about her own competence.
  (5) So Maya knows how to grade mangoes.
  (6) By (3), there is a proposition p that she knows and that accounts for her reliability.
  (7) A proposition is the content of a possible statement. Whatever no finite statement could capture is therefore not a proposition, since there would be nothing for a thinker to grasp and nothing for a sentence to mean.
  (8) Maya is fluent, cooperative, and has spent years with teachers who tried to make her trade explicit. Every rule she has been offered — including rules that reproduce her verdicts on every fruit she has ever seen — she rejects as not what she goes by. What she tracks, she says, is not any single feature but the whole way the fruit sits in the hand, and no list of features she has heard comes close.
  (9) If p were a proposition and Maya knew it, then, being a fluent speaker who has tried, she could state it.
  (10) She cannot. So either p is not a proposition, against (2) and (6); or she does not know it, against (5); or knowing it is not what accounts for her reliability, against (3).

  He draws from the last two steps the conclusion that the distinction is a fiction: what we call knowing how is either a proposition that does no explanatory work or a non-propositional capacity that is not knowledge at all. He anticipates the obvious reply — that one can know a proposition without being able to state it — and calls it too cheap, on the ground that whatever she knows must be the very thing she acts on. I would rather not put his conclusion in print, and I suspect a step is doing something quietly. Which step should I give up, and what does giving it up commit me to elsewhere? I would most like to keep (4) and (5) — I have watched her work — and I am attached to (1), because without it I am not sure what I am praising when I praise her.
reasoning: |-
  Okay, the user is writing a feature on tacit skills and needs help countering a philosophical argument against the distinction between "knowing how" and "knowing that." They've presented a structured argument from a researcher who claims this distinction is folklore. The user wants to reject the conclusion while preserving certain key premises, especially (4) and (5) about Maya's demonstrable skill, and (1) which maintains that knowing-how is genuine knowledge.

  Hmm, this is a sophisticated philosophical puzzle rooted in Rylean epistemology. The core tension lies in reconciling Maya's undeniable practical expertise with her inability to articulate propositions underlying that expertise. The researcher's argument forces a false trichotomy: either the knowledge is propositional (but inexplicably unstateable), non-propositional (thus not "knowledge"), or non-existent.

  Let me unpack the researcher's moves. Premise (2) declares all knowledge as propositional - that's the real pivot point. But why accept that? The user intuitively rejects it because praising Maya's skill clearly involves crediting her with knowledge. Ryle's original "intellectualist legend" critique comes to mind here - the error of reducing all knowledge to knowing truths.

  The researcher's step (7) is also problematic. It equates propositions with statable contents, but philosophers like Polanyi discuss tacit dimensions where we "know more than we can tell." Propositional content might exist without being fully articulable - consider gestalt recognition or muscle memory. When Maya senses "the whole way the fruit sits in the hand," that likely integrates proprioceptive, tactile, and visual cues into a synthetic judgment no verbal description captures.

  Step (9) is another weak link. Fluency doesn't guarantee articulation of procedural knowledge. Think of expert musicians who can't explain their phrasing choices. The researcher dismisses unconscious propositional knowledge as "too cheap," but cognitive science shows we constantly act on unarticulated premises.

  The user's attachment to premise (1) is telling - they want to uphold the epistemic worth of practical skill. This aligns with virtue epistemology where know-how is a success-conducive cognitive state. To preserve this, we must decouple knowledge from propositionality. The commitment? Accepting non-declarative forms of knowledge, which actually enriches our understanding of expertise rather than diminishing it.

  For the article's punch, I'd suggest framing the rejection of (2) as liberating: it prevents reducing human expertise to rulebooks. The philosophical cost is minor - we already accept non-propositional knowledge in perception ("seeing is knowing") and intuition. The payoff is defending the dignity of tacit mastery against intellectualist reductionism.
answer: |-
  The strongest step to reject is **(2)** — the claim that "knowledge is knowledge of truths, and a truth that is known is a proposition that is known." This premise smuggles in a controversial intellectualist assumption that reduces *all* knowledge to propositional knowledge ("knowing-that"). Rejecting (2) allows you to preserve (1), (4), (5), and Maya's tacit expertise, while dissolving the contradiction. Here’s how:

  ### Why (2) is the linchpin:
  1. **It forces a false dilemma**: By defining knowledge *exclusively* as propositional, (2) creates a trap where Maya’s skill must either be reduced to a proposition (which she can’t state) or denied the status of knowledge. But this ignores the possibility of **non-propositional knowledge** (knowing-how as a distinct capacity).

  2. **It conflicts with phenomenology**: Maya’s expertise (4-5) and the nature of skill-acquisition (8) show that her ability operates *differently* from reciting facts. She clearly possesses a reliable, learnable, knowledge-based skill — yet it resists codification. (2) dismisses this by fiat.

  3. **It misrepresents language**: Premise (1) is correct: we *do* attribute knowledge when saying "knows how." Rejecting (2) explains this: "knows how" refers to a **practical capacity** (skill/know-how), not a hidden proposition. Forgetting a skill or being unable to perform it despite "knowing how" makes sense if know-how is embodied ability — like losing muscle memory or freezing under pressure.

  ### How rejecting (2) resolves the argument:
  - **Steps (1), (4), (5) stand**: Maya has genuine knowledge *because* know-how is a valid, non-propositional form of knowledge. Her reliability stems from embodied expertise, not propositions.
  - **Step (3) falls with (2)**: Knowing-how *does not* require a known proposition. It requires successful ability (e.g., perceptual-motor skills, pattern recognition).
  - **Steps (6)-(10) are bypassed**: No proposition "p" needs to exist. Maya’s inability to state rules (8-9) isn’t a failure — it’s evidence her knowledge *isn’t propositional*.

  ### What this commits you to:
  1. **Endorsing Rylean know-how**: You accept Gilbert Ryle’s core insight: "knowing-how is an ability, the exercise of which is itself an application of knowledge" (*The Concept of Mind*). Know-how is intelligent action, not hidden theory.  
     - *Cost*: You must argue that abilities can constitute knowledge without being grounded in propositions.

  2. **Non-propositional knowledge exists**: You commit to the view that knowledge isn’t monolithic. Tacit skills, embodied expertise, and intuitive judgments are legitimate epistemic achievements.  
     - *Cost*: You’ll face intellectualists (e.g., Jason Stanley) who insist all knowledge reduces to propositional attitudes.

  3. **Rejecting the researcher's trichotomy**: Know-how isn’t "either a useless proposition or a non-knowledge knack." It’s a *sui generis* cognitive capacity.  
     - *Cost*: You may need to clarify what makes it "knowledge" (e.g., reliability, teachability, normative evaluability).

  ### How to defend this in your feature:
  - **Invoke expertise studies**: Cognitive science shows skills like Maya’s rely on **procedural memory** and **pattern recognition** that operate sub-linguistically (e.g., Hubert Dreyfus on expertise, Polanyi on tacit knowledge). No proposition captures the "weighted sum" of sensory cues she integrates.
  - **Leverage Maya’s testimony**: Her rejection of all rules (8) isn’t evasion — it’s data. Experts often can’t articulate their judgments because their knowledge is embodied, not discursive.
  - **Preserve the value of know-how**: By keeping (1), you uphold that praising Maya *is* praising knowledge — just not of the textbook variety. Call it "embodied knowledge" or "practical mastery" to distinguish it from facts.

  ### Final philosophical reply to the researcher:
  > "Your argument assumes all knowledge must be propositional. But Maya’s expertise reveals a flaw in that assumption. She *knows how* to grade mangoes through cultivated perception and motor skill — a form of understanding that guides action without intermediary propositions. To deny this is knowledge is to ignore the intelligence in her hands. What she ‘acts on’ is not a statement, but a competence."

  This defends tacit skill while respecting Maya’s self-description. It avoids reducing her artistry to elusive propositions or mere reflex — and keeps your praise of her knowledge intact.
