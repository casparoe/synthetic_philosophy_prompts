prompt: |-
  I'm a software engineer with no formal training in philosophy, but I work on the charting layer of an analytics product, and I've been reading about the pictorial-statistics project Otto Neurath ran in Vienna between the wars — the one later known as Isotype. What interests me is that its rules are not decoration. Greater quantities are shown by repeating one same-sized silhouette rather than by enlarging a single figure, since an enlarged figure leaves it undecided whether you are comparing height or area; perspective and shading are dropped for the same reason; and each repeated silhouette carries a fixed value only within a given chart, so the identical sign stands for ten thousand people on one page and a thousand on the next. The chart still needs a key and a caption, then, and Neurath appears to have treated the whole thing as a helping language that accompanies words rather than replacing them — even while it was pitched as readable across languages and levels of schooling, on the wager that a simplified picture you remember beats an accurate figure you forget. I genuinely cannot tell whether that is an escape from the ambiguities of verbal language or just a notation with a hidden legend.

  Please write me a pantoum about this, twenty lines, to open a short talk to my team. Rhyme is optional; the returning lines are not. I want the form to do the arguing: a line that comes back in a new position should behave like the repeated pictogram, meaning what its key and its neighbours let it mean, and the closing stanza's loop into the first should enact the closure — a language that can only say what its own stock of signs and its own key permit. Keep the details accurate enough that someone who knows the Vienna Method would recognize it, and leave my question open rather than settling it.

  After the poem, give me a JSON object with exactly these fields, and nothing outside them:

  - "form": one line on how the pantoum's repetitions and its closing loop were made to carry the argument.
  - "settled": an array of points about the Vienna Method or Neurath's stated views that people who know the material would agree on, as used in the poem.
  - "contested": an array of points where the poem leans on a reading that specialists dispute, each entry naming the disagreement in one line.
  - "liberties": an array of places the verse departs from the historical record for the sake of form or sound.
  - "weakest_claim": the single line of the poem a specialist would most likely object to, quoted exactly as it appears in the poem, with one line saying why.

  In the "contested" field, keep what specialists actually agree on separate from what is genuinely disputed, and do not file a contested reading under "settled".
