prompt: |-
  I'm a fourth-year PhD student in judgement and decision making, and my prospectus draft is due to my committee in three weeks. I have a half formed idea and I need you to turn it into something that reads like an actual proposal. I've been chewing on this for months and I keep going back and forth on wether it's a real contribution or just me being annoyed at my own field.

  Here's the idea. Everything I've read on herding and cascades models the thing that cascades as a choice: someone buys, adopts, votes yes, the next person sees that and rationally discounts their own private signal, and you get the familiar result that the cascade is fragile — release a bit of public information and everyone snaps back to their own evidence. Fine. But the settings I actually care about — labs, replication attempts, safety reviews, internal audits, post-mortems, the way a whole subfield quietly stops checking some assumption — the thing that cascades isnt the choice, it's the absence of one. Nobody adopts anything. Two or three people decline to run the test, declining becomes the default, and pretty soon nobody experiences it as a decision at all. The information that would have been generated never gets generated, so there's nothing for the cascade to later be wrong about, and the standard debunking move (release the public signal, watch everyone update) has nothing to bite on, because there's no action to reverse. It's a cascade you can't see and can't debunk.

  My hunch is that this is a different animal, and that the usual model can't even represent it, because in the usual setup "don't investigate" is just one more action in the menu. Make "keep investigating" a costly option that also has option value, though, and I think you can get equilibria where investigation shuts down after two people and the shutdown is self-sealing, alongside equilibria where everyone investigates forever and burns everyone's time. But I genuinely don't know whether the shutdown is a cascade in any technical sense or just a fixed point, and whether it's welfare-relevant in a different way than a normal cascade or just a normal cascade with the labels switched. That's what I want the proposal to make precise.

  So write the prospectus. State the question so it has a determinate answer and isn't secretly two questions. Say why the existing accounts leave it open — argue it, dont cite it, I'll add the references myself, and please don't tell me to "review the literature on X," assume I know it. Lay out what I'd actually do and in what order over a two-year dissertation, including what the minimal model would have to show to be worth writing down at all and what the experiment (if there is one) would need to be able to distinguish. Say what a real result looks like versus what would just be me restating the model I started from. Give me a realistic read on scope.

  And be straight with me about the objection I'm scared of: that someone on my committee says I've relabelled a standard cascade, or that this is just optimal stopping and the answer is trivial. If that's right, say so, and tell me what the non-trivial version of the project would look like instead.
reasoning: |-
  Hmm, this PhD student in judgment and decision making has a fascinating dilemma. They're three weeks from their prospectus deadline with a half-formed idea about "absence cascades" versus standard information cascades. Their frustration is palpable - they've been chewing on this for months, oscillating between excitement and self-doubt. The core insight is brilliant: while traditional cascade models focus on observable actions (buying, adopting), many real-world failures involve the cascade of inaction (not testing, not checking assumptions). 

  The student's anxiety centers on two key uncertainties: whether this is truly novel or just relabeled standard theory, and whether it can withstand committee scrutiny. They've articulated the problem beautifully - how invisible investigation shutdowns create "self-sealing" ignorance that standard debunking can't fix. Their hunch about adding option value to investigation costs seems promising, but they're rightly worried about triviality.

  I need to help them crystallize this while respecting their expertise. They've explicitly asked not to be told to "review literature on X" - they know their field. The prospectus must: 1) sharply define the puzzle, 2) show why existing models can't capture it, 3) outline a viable research plan with clear milestones, and 4) preemptively address the "it's just relabeling" objection. 

  The critical move is framing the research question to force a binary answer: Under what conditions does the option value of investigation create self-sustaining inaction equilibria that are both irreducible to standard cascades and welfare-distinct? This avoids vagueness while allowing for negative answers. 

  For the model, they'll need to introduce costly investigation with option value and endogenous information generation - a real departure from standard setups where "inaction" is just another menu item. The minimal viable model must demonstrate either that shutdown states exist and aren't equivalent to cascades, or that they collapse into standard theory. Either would be publishable.

  The experiment design is tricky but crucial. It needs to contrast observable action cascades with invisible investigation shutdowns, perhaps using perceptual tasks where "not looking" carries explicit costs/benefits. The key is measuring whether subjects perceive investigation cessation as a decision at all.

  Regarding their fear of triviality: no, this isn't just optimal stopping relabeled. Optimal stopping is individual; this is about strategic interdependence where my inaction destroys the information that might prompt you to act. That strategic complementarity in ignorance-generation is genuinely novel. If committee members push back, the pivot is to show how this fundamentally alters welfare implications - unlike standard cascades, you can't just "wait for better signals" because no signals exist.

  The prospectus should end by defining success: either demonstrating a new equilibrium class with distinct properties, or proving why such states can't exist in rational models. Both advance the field. Scope must be tight - no grand theories, just modeling and testing this specific inaction mechanism. Three weeks is tight but doable if they focus on nailing the conceptual innovation first.
answer: |-
  Here's a prospectus structure designed to force clarity, preempt objections, and define a non-trivial contribution. The core move is framing the research question around **whether the strategic dynamics of investigation shutdown produce equilibria fundamentally distinct from standard cascades in terms of welfare, debunkability, and rational justification.**

  ---

  **Prospectus: The Self-Sealing Shutdown: Strategic Ignorance Cascades in Investigative Contexts**

  **1. Core Research Question:**  
  *Under what conditions does the strategic interdependence of costly investigation decisions generate self-sustaining equilibria of investigation shutdown that: (a) are irreducible to standard information cascades (i.e., not merely a relabeling of "inaction" as a choice in a standard cascade), (b) exhibit distinct welfare properties due to the irreversible loss of option value and information, and (c) are fundamentally immune to debunking via public information revelation?*

  *Why this is a determinate question:* It demands a binary outcome on irreducibility (a) and immunity (c), while requiring a specific welfare characterization (b). A "yes" identifies a novel phenomenon; a "no" provides a significant negative result bounding existing theory.

  **2. The Gap in Existing Accounts:**  
  Standard cascade/herding models (e.g., Bikhchandani et al., 1992; Banerjee, 1992) fundamentally model the diffusion of *observable actions* in contexts where agents sequentially choose *among predefined alternatives* based on noisy private signals and public history. "Not investigating" *is* typically modeled as one such alternative. **This framework is ill-equipped to capture the phenomenon of interest for three reasons:**  
      *   **Loss of Informational Feedback:** In investigation shutdown, the "inaction" cascade *prevents the generation of the very signals* (private or public) that could correct it. Standard cascade fragility relies on exogenous signals eventually overwhelming incorrect herds. Here, no such signals are generated endogenously.  
      *   **The Disappearing Decision:** Shutdown involves the *procedural normalization of non-investigation* – it ceases to be perceived as an active choice. Standard models treat every agent's decision as explicit and conscious, even if influenced by predecessors.  
      *   **Option Value Destruction:** Investigation carries intrinsic option value – the right, but not the obligation, to act on future information gained. Shutdown irreversibly destroys this value. Standard cascade actions rarely capture this irreversible loss of future strategic flexibility; they are typically static choices over current alternatives.

  **3. Proposed Research Program (2-Year Timeline):**

  *   **Year 1, Term 1: Minimal Model Development & Theoretical Contribution Threshold**  
      *   *Task:* Develop a sequential game model with:  
          (i) Agents deciding whether to undertake a *costly investigation* yielding a noisy private signal.  
          (ii) The value of investigation includes *option value* – the ability to make a future, higher-stakes decision based on the signal *plus* the potential to generate public information benefiting others.  
          (iii) Public observation of predecessors' *investigation decisions* (or lack thereof) *but not their private signals* (unless they investigated and revealed).  
          (iv) A terminal action choice contingent *only* on the signal obtained (if investigated).  
      *   *Minimal Viable Result:* The model must generate at least two distinct pure-strategy equilibria:  
          (1) A "Perpetual Investigation" equilibrium (socially wasteful if costs are high).  
          (2) A "Self-Sealing Shutdown" equilibrium where investigation ceases after a small number of agents decline, and this cessation persists indefinitely. Crucially, **this shutdown must be strictly preferred ex-ante by agents *because* of the irrecoverable loss of option value and the lack of generated counter-signals** – not just because "not investigate" is the best response given current beliefs in a standard cascade.  
      *   *Non-Triviality Threshold:* The shutdown equilibrium qualifies as distinct **if and only if** it exhibits:  
          (a) **Debunking-Immunity:** Public revelation of a *counter-signal* (were it available) *would* shatter the equilibrium, but the shutdown itself *prevents the generation* of such signals, making this revelation impossible.  
          (b) **Welfare Distinction:** Social welfare is strictly lower in the shutdown equilibrium than in either the perpetual investigation equilibrium *or* a hypothetical world where investigation continued long enough to generate a decisive public signal, *even accounting for investigation costs*.  
          (c) **Non-Reducibility:** The equilibrium cannot be mapped directly onto a standard cascade model by simply reinterpreting "Don't Investigate" as an action choice with an implied signal; the dynamics of endogenous signal prevention and option value destruction must be essential drivers.

  *   **Year 1, Term 2: Model Analysis & Characterization**  
      *   *Tasks:* Rigorously characterize conditions for shutdown vs. perpetual investigation equilibria. Analyze welfare properties formally. Explore robustness (e.g., heterogeneous costs/skills, imperfect observation, limited investigation windows). Identify potential "early warning signs" within the model. Formalize the distinction from standard cascades and optimal stopping (see section 6).

  *   **Year 2, Term 1: Experimental Design & Validation**  
      *   *Core Objective:* Test if humans exhibit self-sealing shutdown dynamics distinguishable from standard cascades or simple cost-based stopping.  
      *   *Critical Design Features:*  
          *   **Task:** A perceptual/estimation task where "investigation" (e.g., buying a costly hint, running a virtual test) provides a noisy private signal relevant for a later high-value decision.  
          *   **Manipulation:** Contrast two conditions:  
              (A) *Standard Cascade:* Agents publicly observe predecessors' *final choices* (based on signals). "Not Investigate" is just one choice.  
              (B) *Investigation Shutdown:* Agents publicly observe predecessors' *investigation decisions* (Investigate/Not Investigate) *but not their signals or final choices* if they didn't investigate. Final choices are private/separate.  
          *   *Key Dependent Variables:*  
              (i) Rate of investigation decline & cascade formation.  
              (ii) *Perception:* Post-experiment measures assessing if later agents perceived "not investigate" as an active decision or simply the default state.  
              (iii) *Debunking Test:* In shutdown chains, exogenously provide the signal an early non-investigator *would* have gotten. Measure if this triggers investigation resumption downstream vs. being ignored (demonstrating immunity).  
          *   *Distinguishing Prediction:* The shutdown condition should exhibit faster, more complete cessation of investigation, higher levels of "default" perception, and resistance to debunking via late signals, compared to the standard cascade condition, *even controlling for costs*.

  *   **Year 2, Term 2: Experiment Execution, Analysis & Dissertation Writing**  
      *   *Tasks:* Run experiment, analyze data (focusing on distinguishing dynamics), write dissertation chapters integrating theory and experiment.

  **4. What Constitutes a Real Result (vs. Restating the Model):**  
  *   **Real Result (Success):**  
      *   Theoretical: Demonstrating that shutdown equilibria exist under plausible conditions, satisfy the non-triviality criteria (Debunking-Immunity, Welfare Distinction, Non-Reducibility), and have distinct comparative statics (e.g., more sensitive to option value magnitude than standard cascade parameters).  
      *   Experimental: Showing that humans in the shutdown condition exhibit behavior aligned with the model's predictions – rapid cessation perceived as default, resistance to late debunking signals – *significantly more* than in a carefully controlled standard cascade condition or a pure cost-minimization setup.  
      *   **Contribution:** Establishes "strategic investigative shutdown" as a distinct phenomenon with unique properties, explaining failures in replication, auditing, and assumption-checking where standard cascade theory falls short.
  *   **Restating the Model (Failure):**  
      *   If the shutdown equilibrium is formally equivalent to a standard cascade where "Don't Investigate" is chosen based on beliefs formed from predecessors' visible "Don't Investigate" actions.  
      *   If experimental results show no difference between the shutdown condition and a standard cascade where the only observable action is the investigation decision itself.  
      *   If welfare properties and debunking dynamics are identical to standard cascades.

  **5. Realistic Scope:**  
  *   *Focus:* Develop the *minimal* model necessary to capture the core dynamics (costly investigation with option value, interdependent decisions, endogenous information loss). Test its core behavioral prediction experimentally.  
  *   *Not in Scope:*  
      *   Comprehensive modeling of all organizational contexts (labs, safety reviews, etc.). This provides the *foundational* theory.  
      *   Solving the shutdown problem (yet). This diagnoses and formalizes it.  
      *   Incorporating all behavioral biases (though the experiment controls for obvious ones like pure cost-aversion).

  **6. Addressing the Core Objection (Straight Talk):**  

  *   **"This is just a relabeled standard cascade!"**  
      *   **Your Counter:** This is the central theoretical challenge. The prospectus hinges on demonstrating this is false. The **Non-Reducibility** criterion is key. If predecessors' "Don't Investigate" *only* conveys that *their* private assessment (based on other info) made investigation seem suboptimal *at that moment* (like seeing someone not buy a stock), it *is* a standard cascade.  
      *   **The Novelty:** The claim is that "Don't Investigate" *also* (and crucially) signals the *destruction of the option value and future information* for subsequent agents, altering their strategic calculus fundamentally. It’s not just about inferring the predecessor's private assessment *of the current state*; it's about the *elimination of future states* (informative signals) from the possibility space. **If your model shows this dynamic drives the equilibrium and leads to distinct outcomes (Debunking-Immunity, distinct Welfare), you win.** If not, the objection stands.

  *   **"This is just optimal stopping!"**  
      *   **Your Counter:** Optimal stopping is primarily an *individual* decision under uncertainty (when to stop sampling). The phenomenon you describe is *inherently social and strategic*. My decision to stop investigating *depends critically* on your decision to stop investigating, because your stopping *removes the potential social benefit (information generation) and option value preservation* that might have made my investigation worthwhile. It's a game of strategic complements in *stopping*. Standard optimal stopping doesn't capture this interdependence. The **interdependent destruction of option value and information** is the non-trivial core.

  *   **If the Objection Holds (The Pivot):**  
      If preliminary modeling strongly suggests the shutdown *is* formally reducible to a standard cascade:  
      1.  **Reframe the Contribution:** Focus on the *welfare catastrophe* caused by cascades in contexts where the "inaction" choice destroys option value and prevents information generation. Standard cascade theory doesn't emphasize this specific welfare mechanism. Your contribution becomes: **formalizing and quantifying the unique welfare loss from "destructive inaction cascades"** and identifying the contextual factors (high option value, irreplaceable information) that make them particularly pernicious compared to standard "action cascades."  
      2.  **Empirical Focus:** Shift the experiment's emphasis to demonstrating the *welfare loss* and *debunking-immunity* in real human groups facing decisions with high investigation option value vs. standard cascade decisions. Show that people systematically underestimate the social cost of their investigative inaction in interdependent settings.  
      3.  **The Question Becomes:** *Why do cascades involving the choice of "destructive inaction" (which eliminates future information and option value) lead to greater and more persistent welfare losses than standard action cascades, and how can institutions mitigate this specific risk?*

  **Conclusion:**  
  This prospectus proposes to investigate whether the strategic interdependence of costly investigation decisions can generate self-sealing shutdowns – equilibria of investigative inaction distinct from standard information cascades in their origin (endogenous information/option value destruction), persistence (debunking-immunity), and welfare consequences. Through formal modeling and controlled experimentation, the research will determine if this phenomenon represents a novel theoretical construct with explanatory power for real-world failures of scrutiny, or if it is subsumed within existing frameworks, requiring a refined focus on its unique welfare implications. The minimal viable model and critical experimental test are designed to force this distinction and deliver a definitive contribution.
