answer: |-
  **WEST MERCIA BUREAU OF PLEASURE MANAGEMENT (BPM)**  
  **NOTICE OF PROPOSED RULEMAKING**  
  **Docket No. BPM-2024-001**  
  **Pleasure Identification and Operational Definitions**  

  **AUTHORITY:** Pleasure Commerce Oversight Act (PCOA), § 5(a)(1); Net Pleasure Taxation Act (NPTA), § 101(a), codified at West Mercia Statutes § 47-9-1 *et seq.*

  **SUMMARY:** Pursuant to PCOA § 5(a)(1), the Bureau of Pleasure Management (Bureau) is mandated to regulate "products marketed as giving, enhancing, or facilitating pleasure." Concurrently, NPTA § 101(a) imposes a tax on "net pleasure units" (NPUs) derived from such products. To discharge these duties, the Bureau must establish an operational definition of "pleasure" applicable by field inspectors and tax auditors. This Notice details proposed definitions, analyzes their feasibility, and invites public comment on alternatives.

  **BACKGROUND:** The statutory framework presupposes "pleasure" as a measurable, unitary phenomenon. Initial analysis, however, reveals profound heterogeneity among experiences routinely denoted as pleasurable. Examples include, but are not limited to: gustatory delight (e.g., ripe peach), somatic relief (e.g., cessation of headache), competitive triumph (e.g., winning an argument), sensory resolution (e.g., resolving a suspended chord), proprioceptive satisfaction (e.g., scratching an itch), vicarious joy (e.g., friend's success), and *Schadenfreude* (e.g., delighting in another's misfortune). The Bureau's challenge is to formulate a definition capturing this diversity while enabling objective quantification for regulatory compliance and NPU assessment.

  **ANALYSIS OF CANDIDATE DEFINITIONS:**
  1.  **Common Felt Quality (Hedonic Tone):** The Bureau initially posited that pleasure constitutes a distinct, positive phenomenological quality common to all instances. Analysis revealed:
      *   *Gerrymandering:* Defining this quality to encompass the listed examples required arbitrary exclusion (e.g., excluding relief-as-pleasure unless intense, or malice-as-pleasure unless acknowledged by the subject). This violates statutory intent to regulate all marketed pleasure-givers.
      *   *Heterogeneity:* The felt quality of the peach's taste demonstrably differs from the relief of headache cessation, which differs again from the warmth of vicarious joy. No single descriptor ("warm," "bright," "satisfying," "expansive") applies universally without significant strain or loss of specificity. The quality appears instance-specific.
      *   *Conclusion:* Defining a universal hedonic tone is operationally infeasible; inspectors cannot reliably identify a non-specific, variable quality.

  2.  **Attitudinal Theory (Taking Pleasure In):** Shifting focus, the Bureau considered defining pleasure not as a sensation but as an attitude – "taking pleasure in X." This accommodates heterogeneity (one can take pleasure in vastly different things).
      *   *Operational Deficiency:* While descriptively useful, this definition fails to provide inspectors or auditors with objective criteria to distinguish "taking pleasure" from closely related states like "wanting X," "judging X good," or "being satisfied by X." A subject may want a peach intensely without experiencing pleasure upon consumption, or judge malice morally wrong while still taking pleasure in it. The Bureau lacks a testable, non-verbal method to certify the *attitude* of pleasure-taking itself.
      *   *Conclusion:* Lacks operational utility for enforcement personnel.

  3.  **Pleasure as a Determinable:** The Bureau explored the concept of pleasure as a determinable property – a higher-order category under which specific pleasures (determinates) fall, unified solely by the determinable relation itself (e.g., "color" as determinable, "red" as determinate).
      *   *Testability Problem:* Legal counsel (Opinion BPM-GC-24-003) advises that a determinable, lacking intrinsic defining characteristics beyond the relation to its determinates, is inherently untestable. Inspectors cannot observe or measure "the determinable property of pleasure"; they can only observe specific instances. Certifying the determinable itself is impossible without circularity (e.g., "This is pleasure because it falls under the determinable 'pleasure'").
      *   *Conclusion:* Untestable, therefore operationally invalid.^(1)

  4.  **Mode of Consciousness Theory:** Relatedly, the concept of pleasure as a non-representational mode or manner of consciousness (e.g., "consciousness taking a pleasant form") was considered.
      *   *Operational Deficiency:* Inspectors and auditors require observable correlates. A "mode of consciousness" lacks directly measurable physical or behavioral indicators distinguishable from other modes (e.g., interested attention, focused concentration). Reliance on subjective report introduces unacceptable variance and fraud potential for taxation purposes.
      *   *Conclusion:* Lacks objective, verifiable correlates for regulatory application.

  5.  **Eliminativist Approach (Regulate Determinates):** Facing these difficulties, drafters contemplated abandoning a single definition of "pleasure" and instead regulating listed determinate experiences (e.g., gustatory delight, somatic relief, etc.) individually.
      *   *Statutory Conflict:* This approach directly contradicts PCOA § 5(a)(1) and NPTA § 101(a), which explicitly reference "pleasure" as a singular, measurable entity forming the basis for both regulation and taxation. The statutes assume a quantifiable unit ("net pleasure units").
      *   *Conclusion:* Legally impermissible under the current statutory framework.

  **PILOT STUDY - CEREBRO-HEDONOMETER PROTOCOL (CHP):** Seeking an objective measure, the Bureau piloted the Cerebro-Hedonometer (C-Hed), a device claiming to quantify "pleasure valence" via proprietary algorithms interpreting multi-modal neuroimaging (fMRI, EEG, GSR). Subjects were exposed to stimuli representing the heterogeneous list (peach taste, headache relief simulation, competitive victory scenario, etc.).

  *   **Findings:** While the C-Hed generated consistent readings for somatic stimuli (e.g., relief, itch-scratching) and some sensory stimuli (e.g., chord resolution), it showed significant variability and lack of specificity for cognitive/social pleasures (e.g., vicarious joy, malice). Reported subjective pleasure often diverged significantly from C-Hed output, particularly for complex or morally valenced experiences. The device could not reliably distinguish intense pleasure from intense non-pleasurable arousal (e.g., fear, anger) in 32% of trials. Malice scenarios produced readings statistically indistinguishable from vicarious joy.
  *   **Conclusion:** The C-Hed provides insufficient reliability and specificity across the full spectrum of pleasure phenomena. Its outputs cannot form the sole or primary basis for defining pleasure or certifying NPUs.^(2)

  **PROPOSED RULE:** After exhaustive analysis, the Bureau finds no currently viable operational definition of "pleasure" capable of encompassing the statutory mandate's heterogeneity while providing the objectivity, reliability, and testability required for enforcement and taxation. The Bureau therefore **proposes** that the term "pleasure," for purposes of PCOA and NPTA, remains *undefined pending further study*.

  **REQUEST FOR COMMENT:** The Bureau solicits comments on this proposed rule, specifically addressing:
  1.  Operational definitions of "pleasure" resolving the heterogeneity problem.
  2.  Objective, inspector-accessible methodologies for identifying and quantifying pleasure across all relevant domains.
  3.  Scientific evidence supporting any proposed measurement technology.
  4.  Alternatives to defining "pleasure" that satisfy the statutory framework.

  **COMMENT PERIOD:** Comments must be submitted within 90 days of this Notice's publication in the *West Mercia Register*. Due to the complexity of the issue and the absence of a viable definition, the Bureau **indefinitely extends** the comment period beyond the statutory 90 days until a scientifically and operationally sound definition is identified. Comments received after 90 days will be reviewed periodically as received.

  **DISSENTING STATEMENTS:**

  *   **Commissioner Agnes Thorne:** "The statute compels us to regulate *pleasure*. The manifest diversity of its instances cannot negate the existence of a common core. That we struggle to define 'water' does not mean H₂O ceases to exist. The Bureau must redouble its efforts to isolate this phenomenological essence. Retreat is scientifically and statutorily premature."
  *   **Commissioner Silas Vance:** "This endeavor rests on a category error. 'Pleasure' is not a natural kind like 'gold' or 'water,' susceptible to operational definition for taxation. It is a heterogeneous cluster of subjective states, valuable precisely for their diversity. Attempting to force this plurality into a single, measurable unit for bureaucratic convenience is fundamentally misguided and doomed to distort the very phenomena the statutes aim to address. The statutes require amendment, not a futile definition."

  **SUBMIT COMMENTS TO:** Director, Bureau of Pleasure Management, Regulatory Docket BPM-2024-001, 100 Compliance Plaza, Capital City, West Mercia. Electronic submission: regulations.bpm.wm.gov/docket/BPM-2024-001.

  ---

  **Footnotes:**
  ^(1) Counsel further noted that tax law requires measurable *units* (NPUs). A determinable property provides no basis for establishing a unit of measure.
  ^(2) Manufacturer's claims regarding "neural pleasure signatures" remain unvalidated across the requisite experiential range. Correlations, where found, were often stimulus-specific, not pleasure-specific.
