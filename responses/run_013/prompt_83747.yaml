  Here’s a focused, argument-driven term paper proposal centered squarely on your insight about concept individuation and its role in dissolving (or reshaping) Molyneux’s Problem. It’s structured for a 6000-word seminar paper, prioritizing depth over breadth.

  ---

  **Term Paper Proposal: Molyneux’s Problem and the Metaphysics of Shape Concepts**

  **1. Core Question:**  
  Is Molyneux’s Problem (MP) — whether a person born blind, upon gaining sight, could *immediately* visually distinguish a cube from a sphere previously known by touch — fundamentally a substantive question about cross-modal perception, or is it primarily a dispute about how we individuate *shape concepts*? If the latter, does this reduce MP to a merely verbal disagreement, or does it reveal a deeper philosophical issue about perceptual objectivity?

  **2. Central Thesis:**  
  The historical stalemate surrounding MP arises because competing answers presuppose incompatible, often unstated, criteria for what constitutes "the same shape" across sensory modalities. Resolving MP requires first resolving this prior metaphysical question about shape concepts. **The paper will argue that:**  
     *   MP *is* a substantive problem, but its substance lies *not* in perception itself, but in the **conditions for the individuation and application of spatial concepts**.
     *   Once the nature of shape concepts is clarified, the traditional answers to MP (especially regarding inference/reason) largely follow *conceptually*, rendering the empirical/psychological question (a) and the inferential question (b) secondary to, and dependent on, (c).
     *   This reframing shows MP is not merely verbal; it exposes a crucial tension between **amodal geometric realism** (shape as mind-independent structure) and **sensorimotor or modality-bound conceptualism** (shape as constituted by perceptual capacities).

  **3. Why the Standard Positions Don't Settle It:**  
     *   **Nativists/Empiricists (Locke vs. Leibniz etc.):** Assume different starting points on concept origins but often conflate conceptual availability with perceptual capacity. Locke’s “no” assumes tactile and visual ideas are fundamentally distinct *kinds*, begging the concept question. Leibniz’s “yes” assumes an innate, amodal geometric concept applicable regardless of modality, also presupposing an answer to (c).
     *   **Modern Cognitive Science Approaches:** Often focus on (a) – empirical results from sight-restoration cases or cross-modal matching tasks. While relevant, these studies *presuppose* operational definitions of "same shape" and "recognition" that implicitly answer (c), making their results inconclusive for the *conceptual* core of MP. A negative result might show sensorimotor learning is needed, but doesn't tell us *why* that learning is necessary at the conceptual level.
     *   **Direct Realists/Enactivists:** Argue perception gives direct access to the *object*, not sense data. However, this still requires an account of how the *property* "cube-shape" is identified and unified across touch and vision, returning us to (c).

  **4. Method: Conceptual Analysis & Argumentative Reconstruction**  
  *(Why not history/empirics?)*  
     *   **Primary Method:** Rigorous conceptual analysis of competing models of shape concepts and their implications for MP.  
     *   **Key Moves:**  
          (i) **Articulate Competing Models of Shape Concepts:**  
              *   **Model G (Geometric):** Shape as an amodal, abstract, mathematical property (e.g., defined by vertices, faces, symmetries, spatial relations).  
              *   **Model S (Sensorimotor/Modality-Bound):** Shape as constituted by modality-specific affordances, sensorimotor contingencies, or recognitional capacities (e.g., "cube" = the way X feels *to touch* + the way Y looks *to vision* + associated motor patterns).  
              *   **Hybrid Models?** (e.g., G provides the reference, S provides the mode of presentation).  
          (ii) **Derive Implications for MP:**  
              *   **Under Model G:** A sufficiently sophisticated grasp of the geometric concept *should* allow immediate visual application (barring processing deficits). The link is potentially inferential/a priori. The "no" answer requires explaining a failure of *application* despite conceptual competence.  
              *   **Under Model S:** Tactile "cube" and visual "cube" are *different concepts* or different aspects of the concept. Immediate visual recognition is conceptually impossible; only associative learning can forge a link. MP's "no" answer is conceptually guaranteed.  
              *   **Under Hybrid Models:** The answer depends on the specific hybrid structure.  
          (iii) **Evaluate the Models:** Interrogate the philosophical motivations, coherence, and consequences of G and S (e.g., Does G require problematic abstraction? Does S preclude objective spatial knowledge?).  
          (iv) **Assess MP's Status:** Does resolving (c) show MP is merely verbal (a clash of definitions)? Or does it reveal a *genuine* metaphysical dispute about the nature of spatial properties and concepts (e.g., Is there a mind-independent geometric structure underlying perception?)?  
     *   **Why this over history/empirics?** History shows the *persistence* of the question but doesn't resolve the conceptual core. Empirics (sight-restoration cases) are inherently messy (neurological factors, limited samples, defining "success") and, crucially, *interpreted* through one's preferred model of concepts (G or S). Tackling concept individuation directly addresses the root confusion you identified and provides the framework needed to *make sense of* empirical findings or historical arguments.

  **5. Possible Conclusions & Deciding Factors:**  
     *   **Conclusion 1 (Likely):** MP is primarily a dispute about concept individuation (c). Model S renders MP trivial (always "no"). Model G renders it substantive but shifts the burden to explaining potential failures of application. The "merely verbal" charge applies only if proponents of G and S are *merely* talking past each other. However, the disagreement reflects a deeper, *real* divergence on the metaphysics of perception and spatial concepts (e.g., realism vs. conceptualism/pragmatism about shape).  
     *   **Conclusion 2:** A viable Hybrid Model shows MP remains substantive, revealing the challenge of *integrating* modality-specific perspectives into a unified concept of an objective spatial property.  
     *   **Deciding Factors:**  
          *   **Coherence & Explanatory Power:** Which model (G, S, Hybrid) provides the most coherent account of spatial cognition, cross-modal identification, and the possibility of objective spatial knowledge?  
          *   **Phenomenological Adequacy:** Does Model G adequately capture the qualitative, embodied nature of shape perception? Does Model S adequately capture the apparent objectivity and constancy of shape?  
          *   **Metaphysical Commitments:** Is the commitment to mind-independent geometric structure (G) defensible? Is the modality-bound nature of concepts (S) compatible with intersubjective agreement about shape?  
          *   **Implications for Perceptual Justification:** How does each model handle the justificatory link between tactile and visual shape beliefs?

  **6. Scope & Feasibility (Why this is Tight Enough):**  
  This is *perfectly feasible* for 6000 words and one semester if you **strictly focus** on (c) and its implications for MP.  
     *   **What to Include:**  
          *   Clear exposition of MP and the standard stalemate.  
          *   Your tripartite distinction, explicitly arguing why (c) is primary.  
          *   Detailed articulation and critique of Model G and Model S.  
          *   Analysis of how each model dictates the answer to MP (especially the inferential possibility in (b)).  
          *   Argument about whether this reframing dissolves MP as merely verbal or reveals a deeper issue.  
     *   **What to Exclude:**  
          *   **In-depth history of the debate:** Mention key figures (Locke, Leibniz, perhaps moderns like Evans or Noë) only as illustrations of the conceptual positions.  
          *   **Detailed review of empirical cases:** Summarize their ambiguity *briefly* as motivation, but don't analyze individual cases.  
          *   **Comprehensive discussion of (a) or (b) on their own:** Only discuss them *as consequences* of the chosen model in (c).  
          *   **Other sensory modalities:** Focus solely on vision/touch and shape.  
     *   **Risk of Failure & Mitigation:**  
          *   **Risk 1:** Getting bogged down in defending one specific model of concepts exhaustively. *Mitigation:* Focus on *contrasting* G and S and their *implications for MP*, not on fully vindicating one general theory of concepts.  
          *   **Risk 2:** The "merely verbal" conclusion seeming trivial. *Mitigation:* Emphasize that the *choice* between G and S is non-trivial – it reflects fundamental commitments in the philosophy of perception and mind (realism, conceptualism, enactivism). MP acts as a litmus test for these commitments.  
          *   **Risk 3:** Neglecting obvious counter-arguments. *Mitigation:* Actively engage with potential objections (e.g., "But geometry *is* objective!", "But concepts *must* be grounded in perception!", "What about neural evidence for amodal representations?").

  **7. Payoff:**  
  This paper moves beyond the stalemate by showing that Molyneux’s Problem is not fundamentally about perception *per se*, but about the conceptual preconditions for identifying *what is perceived* across different senses. It transforms MP from a puzzling empirical question into a crucial probe for understanding the relationship between perception, conception, and objectivity. The "payoff" is demonstrating that centuries of debate hinge on an unexamined metaphysical choice about the nature of spatial properties and the concepts we use to grasp them. This reframing clarifies the philosophical stakes and shows why MP remains persistently intriguing.

  ---

  **Why this works:** It takes your powerful core insight – that concept individuation (c) is key – and builds the entire project around rigorously examining *that*. It stays firmly within philosophy of mind/perception/epistemology. It’s ambitious conceptually but narrow in scope by jettisoning the historical/empirical survey. It delivers a clear thesis with definable arguments and potential conclusions, meeting seminar paper expectations. Your nephew's story provides profound motivation, but the proposal channels that into a sharply defined philosophical investigation. Go write it!
