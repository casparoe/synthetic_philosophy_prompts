  **S**: (1) Mayfly lifespan — Evolutionary persistence directly explains trait fixation via predator avoidance.  
  **A**: (3) Coral shape — Structural optimization is predictable under selective pressures for light capture.  
  **B**: (5) Sentiment classifier — Statistical reliance on "but" reliably predicts outputs, though brittle to adversarial inputs.  
  **C**: (4) Crypto fees — Emergent filtering effect is explanatory but unstable if actors change strategies.  
  **D**: (6) Traffic jam — "Rationale" is purely emergent epiphenomenon; no design or selection to support counterfactuals.  
  **D/Vestigial**: (2) QWERTY — Original jam-prevention rationale exists but does zero work today; inertia dominates.  

  ### Vestigial Rationale Flag
  - **Only (2) QWERTY** qualifies: The rationale is historically real but causally inert now.  

  ### Key Insight
  The ranking prioritizes **selection mechanisms** (evolution, design) that anchor rationales to persistent outcomes. Emergent cases (4,6) score lower due to volatility. The dimension isn't rigged but reflects Dennett's view: rationales earn keep by enabling *robust* predictions.  

