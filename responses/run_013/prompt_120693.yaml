  Here’s a structured fellowship proposal based on your core insight, designed to transform the "mush" into a tractable, high-impact project with clear deliverables. The focus is on formal-philosophical precision, scoped for a 1-year fellowship.

  ---

  **Project Title:**  
  *The No-Free-Lunch Theorems and the Epistemic Foundations of Induction: Disentangling Mathematical Averaging from Humean Scepticism*

  ### Core Research Question
  Can the no-free-lunch theorems (NFL) genuinely address Hume’s problem of induction, or do they merely restate it in a formal disguise? Specifically:  
  **Does the mathematical necessity of inductive bias (per NFL) imply that *no inductive method can be universally justified*, or does it instead reveal a fundamental *misalignment* between averaging over problem spaces and epistemic justification?**

  ### Why Existing Approaches Don’t Settle This
  1. **Bayesian Convergence ("Washing Out of Priors")**:  
     Shows that *given shared data*, priors converge. But it assumes the hypothesis space is *correctly specified*. NFL concerns the choice of the space itself—a prior over hypotheses doesn’t resolve justification for restricting the space.

  2. **Universal Priors (Solomonoff, Kolmogorov)**:  
     Offers a formal "optimal" prior but relies on uncomputability, arbitrary choice of Universal Turing Machine, and assumes the world is computable. Justification remains circular: it presupposes the universe’s algorithmic simplicity without grounding it.

  3. **"Real Worlds Have Structure"**:  
     An empirical claim, not an epistemic justification. NFL’s uniform average over *all* problems isn’t refuted by noting we inhabit a non-uniform subset; it simply shifts the question to *why* we privilege that subset.

  4. **"Bias is Unavoidable" (Standard NFL Moral)**:  
     Confuses necessity with justification. That bias is needed says nothing about whether *any particular bias* (or class-restriction) can be non-arbitrarily defended.

  ### Methodology: A Three-Phase Formal Analysis
  **Month 1–3: Deconstruct NFL’s Epistemic Claims**  
  - Formalize NFL’s setup: uniform measure over problem/hypothesis spaces \(\mathcal{H}\), loss functions.  
  - Map NFL’s "no universal learner" to Hume’s "no justification for uniformity of nature." Identify where NFL implicitly assumes a uniformity premise.  
  - *Deliverable*: Taxonomy of NFL interpretations (descriptive vs. justificatory).

  **Month 4–7: Probe "Principled Restrictions"**  
  - Define *non-arbitrary restriction* rigorously: e.g., invariance under transformations, computability constraints, or complexity-theoretic naturalness.  
  - Test candidates:  
    - Algorithmic information (Kolmogorov complexity)  
    - Symmetry principles (e.g., invariance to relabeling inputs)  
    - Physical universality constraints  
  - *Deliverable*: Necessary/sufficient conditions for a "principled" \(\mathcal{H}\)-restriction; proof that any such restriction reintroduces a prior (Hume redivivus) or exhibits a novel loophole.

  **Month 8–12: Bridge to Epistemology & NFL’s Limits**  
  - Formalize Hume’s challenge: Can any learner be *a priori* justified without assuming the problem’s structure?  
  - Contrast NFL’s *worst-case* (all problems) with Bayesian *average-case* (fixed prior). Show NFL’s uniformity average is epistemically inert without a meta-justification.  
  - *Deliverable*: A theorem linking NFL to justification: e.g., *"If a learner is universally justified, then NFL’s uniform average is irrelevant; if NFL is relevant, justification requires contingent assumptions."*

  ### Expected Outcomes & Deliverables
  - **Positive Result**: A formal proof that any NFL-compatible "free lunch" (e.g., via restricted \(\mathcal{H}\)) either (a) assumes a prior (thus not answering Hume) or (b) relies on a *new* epistemic principle (e.g., "computability is ontologically basic").  
  - **Negative Result**: A demonstration that NFL *cannot* engage Hume without smuggling in uniformity assumptions—making it a corollary, not a solution.  
  - **Key Insight**: NFL is best seen as a *metatheorem about formal frameworks*, not a breakthrough in inductive justification.  
  - **Fellowship Deliverables**: 2 workshop papers (Philsci/NeurIPS), 1 journal manuscript (*J. Phil.* or *Phil. Science*).

  ### What Success/Failure Looks Like
  - **Success**: A crisp formal separation between NFL’s mathematical averaging and epistemic justification, with a definitive answer to "Does NFL solve/sharpen/ignore Hume?"  
  - **Partial Success**: A refined taxonomy showing *why* NFL and Hume talk past each other, revealing new constraints for justification.  
  - **Failure**: The conceptual blurring persists under scrutiny (e.g., if every formalism inevitably mirrors NFL’s uniformity). *Even this is publishable*: "Why NFL Cannot Escape Hume."  

  ### Scope Assessment
  - **This is a 1–2 paper project**, not a career. You’re dissecting a *specific* linkage (NFL→Hume) with formal tools.  
  - **Feasible in 1 year**: Focused on analyzing existing frameworks (NFL, Bayesianism, Solomonoff), not new ML theorems.  
  - **Risk**: Highly conceptual—but your ML group’s debates confirm the gap. If you formalize the "mush," it’s a win.  

  ### Why This Matters
  ML theorists wield NFL as a philosophical sledgehammer; philosophers cite it as "Hume 2.0." Neither is accurate. This project forces clarity, exposing whether NFL reveals new epistemic limits or just recasts old ones in a compelling notation.  

  ---
  **Next Steps for You**:  
  1. **Sharpen the "principled restriction" criteria** (e.g., draw from VC theory for "natural" classes).  
  2. **Identify a key case study**: E.g., Solomonoff prior vs. NFL’s uniform average.  
  3. **Flag opponents**: Wolpert (NFL), Schurz (inductive meta-justifications), Sterkenburg (Solomonoff critiques).  

  This framing turns the rant into a knife: precise, falsifiable, and disruptive to both fields. If the NFL/Hume braiding unravels cleanly, it’s a paper; if it resists, that’s a deeper result. Either way, you’ve answered the question.
