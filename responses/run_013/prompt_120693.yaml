  The main issue seems to be conflating two distinct claims: one about mathematical averages over problem spaces (no-free-lunch) and another about epistemic justification of inductive methods. The user suspects these are being improperly linked, leading to circular debates in their reading group. They want to separate these cleanly but find that attempts to do so often smuggle in prior assumptions, which brings us back to Hume.

  The user needs a focused research question that can be definitively answered. Right now, their idea is "mush," so precision is key. They also want to explain why existing approaches—Bayesian convergence, universal priors, appeals to simplicity—don't resolve the issue. Plus, they need a clear methodology and scope for a one-year project.

  First, the research question. It should be framed to avoid ambiguity. Maybe something like: "Can restricting the hypothesis space in a principled, non-arbitrary way provide a universal justification for induction, or does it inevitably reintroduce prior assumptions?" That sets up a yes/no answer.

  Next, addressing why standard moves don't work. For Bayesian convergence: yes, priors wash out with enough data, but the justification for the prior itself remains an issue. Universal priors (like Solomonoff) are uncomputable and still rely on a choice of universal Turing machine, which isn't unique. Saying "the world is structured" just pushes the problem to why we believe that structure exists. Each solution shifts the problem rather than solving it.

  Methodology needs to be conceptual and formal. The user mentioned no experiments, so it's about analyzing arguments and formal frameworks. Breaking it into phases makes sense: first, dissect existing arguments (Bayesian, complexity-based, structuralist); second, formalize the requirements for a non-arbitrary restriction; third, explore impossibility results or necessary conditions.

  Possible outcomes: 
  1. Show that any restriction requires prior assumptions, reinforcing Hume. 
  2. Find a principled restriction that avoids arbitrariness (unlikely, but would be groundbreaking). 
  3. Prove that such a restriction is impossible under certain formal conditions.

  Scope is crucial here. A paper could tackle one angle, like critiquing algorithmic information approaches. A career? Maybe, if this opens up deeper questions. But for a fellowship, focusing on a specific formal approach (like comparing NFL to Hume) is manageable in a year.

  Failure would be not making progress on disentangling the claims or showing existing arguments are sufficient. But even clarifying why the separation fails is valuable. The user should be prepared for the possibility that their initial hunch holds, and the project becomes a rigorous defense of that view.
