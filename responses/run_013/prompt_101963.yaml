      - K: Room contains one object: 50% black raven, 50% white shoe.  
      - E: Observe black raven.  
      - Analysis: P(H | E, K) = P(H | K). E only updates the state of the room (confirms the object is a black raven, not H). H is about all ravens, and E provides no information about ravens outside the room (the white shoe alternative was equally consistent with H). Formally:  
        - P(E | H, K) = P(room has black raven | H, K) = 0.5 (H doesn't affect room contents).  
        - P(E | K) = P(observe black raven | K) = 0.5.  
        - Thus, P(H | E, K) = [P(E | H, K) * P(H | K)] / P(E | K) = (0.5 * P(H | K)) / 0.5 = P(H | K).  
    - **Rule C (Instance-Based)**: **Confirms H**.  
      - E is a black raven (positive instance).  
      - Color was not known in advance (only two possibilities, neither certain), satisfying the "no prior certainty" condition. Thus, it confirms H.  

  **Why Case V is ideal**:  
