prompt: |-
  I'm a journalist — I write a weekly science-and-ideas column, which in practice means I spend most of my week interviewing researchers and then trying to make their work sound interesting to people who'd rather be doing anything else. Along the way I've started collecting a pattern in how successful people get treated, and I've never found a name for it, so I'm hoping you can either find me one or help me build one.

  Here's the shape of it, with a few instances so you can see what I'm pointing at. A researcher in a small department wins a big international prize. The local coverage is warm, but in the corridors something shifts — people start saying the work was really the group's, that he'd always been a bit pleased with himself, that prize committees go for a certain type. Nothing anyone could be called out for, mostly delivered as jokes. Then, months later, the same community is cheerfully claiming someone who made it abroad: an athlete winning for a foreign club, an emigrant who comes home to open a factory, and there's no resentment at all, the boasting just moves into the plural — 'one of ours'. But someone who makes it at home, in front of everyone, who takes the chair or the promotion or the telly slot and then stays in the room with all the people who didn't, gets it far worse than any outsider would. My working hunch is that the norm isn't against success, and isn't really envy either, since the people sniping at the local prizewinner will cheer the emigrant to the rafters. What seems to be policed is who gets to own the achievement — whether it reads as a property of the group or a property of the person — plus something about distance, because it's much easier to celebrate someone who isn't standing next to you. The candidates I've been offered are the tall-poppy thing they talk about in Australia and New Zealand, the law of Jante, the crabs-in-a-bucket idea, and ressentiment (a friend reads a lot of Nietzsche). None of them sits right for me, because they all seem to be about levelling as such, whereas mine seems to turn on credit and proximity. My sister, who works in a lab, says it's just what happens whenever people work in teams, and I don't think that's the whole story, but she may be onto something about the team-credit bit.

  I'd like you to answer as a social anthropologist — or at least someone who knows the anthropology of egalitarian societies and the social psychology of in-group norms, and who's read enough moral philosophy to keep envy, resentment and justice seperate. Before you commit to anything, brainstorm a list of candidates and say in a sentence or two why each one does or doesn't fit, then give me your answer to the following. Is what I've described one phenomenon, or two or three bundled together? What's its nearest established relative, and what exactly separates the two — where does the neighbour apply and mine not, and vice versa? Where are the edges of mine: does it need a small face-to-face community, does it need the successful person to stay put, does it survive anonymity or a big city, does it work the same way when the success is inherited rather than earned? And if there genuinely isn't anything that fits, coin a term for it, define it, and tell me what your definition rules out — I'd much rather be told that I've muddled three existing things together than be handed one tidy label that hasn't earned its keep. Take your time with it and don't feel you have to be diplomatic about the bits of my description that don't hold up.
reasoning: |-
  Okay, let me start by unpacking what this journalist is asking. They've observed a pattern where successful individuals in small communities face subtle backlash when they achieve recognition locally, but those who succeed elsewhere are celebrated as "one of ours." They want to know if this phenomenon has a name or if it's a new concept that needs coining.

  First, I need to recall related concepts from social psychology and anthropology. The user mentioned several existing ideas: tall poppy syndrome, Jante Law, crab mentality, and ressentiment. Let me go through each one. Tall poppy syndrome is about cutting down high achievers to maintain equality, but that doesn't fit because the community still celebrates external successes. Jante Law emphasizes anti-individualism, yet it doesn't account for the pride in distant achievers. Crab mentality involves active sabotage, which isn't happening here—it's more about passive undermining. Ressentiment is about deep-seated envy, but the user noted that envy isn't the core issue since outsiders are praised.

  The key elements here are credit allocation and proximity. The local achiever's success is seen as individual, distancing them from the group, while the external success is absorbed into the group's identity. Proximity makes the local achiever's presence a constant reminder of intra-group comparisons, causing discomfort. The external achiever, being distant, doesn't threaten the local hierarchy.

  Now, is this one phenomenon or multiple? The credit reallocation (group vs. individual) and proximity effect seem intertwined. The journalist's sister mentioned team dynamics, which might explain the credit part but not the proximity aspect. So it's likely a single phenomenon with two facets: credit attribution and spatial/relational distance.

  Looking for similar concepts, collective narcissism comes to mind—where the group basks in reflected glory. But that usually applies to external successes, not internal ones. The proximity principle in social psychology explains how closeness affects behavior, but not specifically credit allocation. Social comparison theory is relevant, as people compare upwards locally, causing threat, whereas distant successes are abstract and less threatening.

  The user asked about boundaries: does this happen in large cities? Probably less so due to anonymity. Inherited vs. earned success? Inherited might not trigger the same backlash since it's seen as unearned. The successful person staying put is crucial because their presence forces ongoing comparisons.

  Since no existing term fits perfectly, coining a new term makes sense. "Proximity Credit Asymmetry" captures the core elements: the tension between near and far successes and the shifting ownership of achievements. Defining it clearly would distinguish it from envy-based theories and emphasize the structural aspects of group dynamics.

  I should also address why other terms don't fit. For example, tall poppy is about leveling, but here it's not about bringing high achievers down universally—just those too close. The journalist's observation about emigrants being celebrated supports that distinction.

  In conclusion, this phenomenon is distinct, rooted in how groups manage internal hierarchies and external validation. The proposed term needs to reflect the dual mechanisms of credit attribution and spatial proximity to stand apart from existing concepts.
answer: |-
  As a social anthropologist with cross-training in moral psychology, I find your observation acutely perceptive – and under-theorized. Let's dissect this systematically.

  **Brainstorm: Existing Concepts & Why They Don't Quite Fit**
  1.  **Tall Poppy Syndrome:** Focuses on *cutting down* high achievers to enforce egalitarianism. *Misfit:* Doesn't explain the *celebration* of distant achievers ("our" poppy is tall elsewhere). Your phenomenon is selective, not universally anti-success.
  2.  **Law of Jante:** A Scandinavian cultural norm prescribing anti-individualism ("you're not to think *you* are special"). *Misfit:* Primarily ideological (prescribing how one *should* act/think), while yours is behavioral/reactive (how others *do* act based on context). Jante wouldn't permit boasting about "one of ours" abroad either.
  3.  **Crab Mentality:** Focuses on *active sabotage* within a disadvantaged group. *Misfit:* Your description involves subtle undermining (gossip, jokes) rather than active hindrance, and crucially, lacks the element of sabotage towards the distant successful person.
  4.  **Ressentiment (Nietzsche/Scheler):** A deep-seated, reactive *hatred* born of impotence and suppressed envy, leading to a revaluation of values (e.g., "success is corrupt"). *Misfit:* Too affectively charged and existential. Your observation involves milder, context-dependent social *friction*, not a revaluation of the *meaning* of success itself. The positive reaction to the emigrant undermines this.
  5.  **Schadenfreude:** Pleasure at another's misfortune. *Misfit:* Not applicable. The phenomenon precedes any misfortune; it's about discomfort *with* the success, not pleasure in its downfall.
  6.  **Invidious Comparison (Veblen):** Using comparisons to establish relative status. *Misfit:* While comparisons are involved, Veblen focuses on conspicuous consumption and status emulation. Your case is about *discomfort* with favorable comparisons within the proximate group.
  7.  **BIRGing vs. CORFing (Social Identity Theory):** "Basking In Reflected Glory" (claiming association with winners) vs. "Cutting Off Reflected Failure" (distancing from losers). *Partial Fit:* Celebrating the emigrant is classic BIRGing. *Misfit:* The negative reaction to the local winner isn't CORFing (they aren't distancing from failure) nor does it fully explain the *mechanism* of the local backlash (why isn't the local winner BIRG-able?).
  8.  **Collective Narcissism:** An inflated, defensive investment in the group's image. *Partial Fit:* The boasting about "one of ours" fits. *Misfit:* Doesn't predict the *negative* reaction to internal success; collective narcissists often want internal heroes *unless* they threaten the group ego (which brings us closer...).

  **Analysis: Your Phenomenon - Structure and Boundaries**

  1.  **Is it One Phenomenon or Several?**
      *   It's **one core phenomenon with two intertwined mechanisms:** (A) **Credit Attribution Conflict** (Group vs. Individual) and (B) **Proximity Effect** (Spatial/Social Distance).
      *   The negative reaction towards the local winner arises from the *simultaneous triggering* of both:
          *   **A:** The winner's success *within* the group challenges the norm that significant achievements should be diffusely attributed to the collective ("the group's work", "departmental support", "local environment"). Claiming individual credit (or having it claimed *for* them externally like a prize) violates this unspoken rule.
          *   **B:** Physical/social proximity makes the winner a constant, salient reminder of this attribution conflict *and* forces uncomfortable upward social comparisons daily. Their presence highlights individual disparity within the face-to-face group.
      *   Celebrating the distant achiever works because:
          *   **A:** Distance allows the achievement to be easily framed *entirely* as group property ("one of ours") without the complicating presence of the individual claiming agency. The individual's contribution is abstracted.
          *   **B:** Distance eliminates the daily friction of comparison. The success is symbolic, not a living challenge to the local status hierarchy. BIRGing is cost-free.

  2.  **Nearest Established Relative & Distinctions:**
      *   **Nearest Relative:** **"Fission-Fusion Dynamics in Egalitarian Groups"** (Anthropology) combined with **"Proximity Principle"** (Social Psychology) and **"Credit Appropriation"** (Sociology of Science).
      *   **Distinctions:**
          *   **Fission-Fusion:** Explains how groups manage conflict (e.g., hunter-gatherer bands splitting). *Your phenomenon is a specific, low-intensity social friction mechanism within fusion, driven by success attribution, not general conflict.*
          *   **Proximity Principle:** States closeness intensifies social effects (liking, conflict). *Your phenomenon specifies the* type *of conflict (attribution challenge) and the* asymmetry *based on distance.*
          *   **Credit Appropriation:** Common in academia/teams. *Your phenomenon adds the crucial dimension of proximity moderating the* reaction *to appropriation (or its lack).* Your sister is right about the team-credit core, but misses the proximity amplifier.
      *   **Where Neighbor Applies/Mine Doesn't:** Fission-fusion applies to major group schisms over resources/ideology, not subtle corridor gossip over a prize. Proximity principle applies to all relationships, not specifically success attribution. Credit appropriation happens in large corporations without the same proximity backlash due to structural hierarchy.
      *   **Where Mine Applies/Neighbor Doesn't:** Precisely in the scenario you describe – the *differential* reaction to success based on *who gets credit in the eyes of the group* and *where the successful person is located physically/socially* relative to the group.

  3.  **Edges of the Phenomenon:**
      *   **Small Face-to-Face Community:** Essential. Anonymity and weak ties in large cities dilute the effect. The group must be cohesive enough for shared identity and norms about credit to exist *and* for individuals to be constantly visible.
      *   **Successful Person Stays Put:** Crucial. Their continued presence sustains the proximity effect and the attribution challenge. If they left shortly after winning, the friction would likely fade, potentially turning them *into* a celebrated distant achiever.
      *   **Surviving Anonymity/Big City?** Greatly diminished or absent. The mechanisms rely on known individuals, shared history, and constant interaction. In anonymous settings, credit norms are weaker, and proximity (beyond immediate colleagues) is irrelevant.
      *   **Inherited vs. Earned Success:** Likely different. Inherited success (wealth, title) is often seen as a static attribute, not an *achievement* demanding credit. It might provoke resentment based on perceived unfairness (a different justice mechanism), but not the same *attribution conflict* ("Did *they* earn it? Was it *their* work?"). Earned success challenges the "group contribution" norm directly.
      *   **"Team" Context:** While your sister's lab example fits, it extends beyond formal teams to any small community with shared identity and norms (e.g., a town, a small industry, an artistic scene).

  **Coining a Term: Proximity Credit Asymmetry (PCA)**

  *   **Definition:** Proximity Credit Asymmetry (PCA) describes the phenomenon within small, face-to-face communities where the social response to an individual member's significant success is critically dependent on the perceived locus of credit (individual vs. group) and the physical/social proximity of the successful individual. Successes perceived as primarily *individual* achievements *and* occurring within the proximate social field generate friction (subtle undermining, gossip, minimization), as they challenge group cohesion and force uncomfortable comparisons. Conversely, successes achieved by members *outside* the proximate field are readily framed as *group* property ("one of ours") and celebrated without friction, as distance allows symbolic BIRGing and avoids direct comparison.
  *   **What the Definition Rules Out:**
      *   Universal leveling impulses (Tall Poppy, Jante Law).
      *   Active sabotage (Crab Mentality).
      *   Deep existential envy/resentment (Ressentiment).
      *   Reactions primarily driven by perceived injustice of the success itself (common with inherited wealth).
      *   Phenomena in large, anonymous, or highly hierarchical groups where credit norms are formalized or irrelevant, and proximity has little effect.
      *   Simple envy – the positive reaction to the distant success demonstrates it's not success itself, but the *context* of credit and proximity that triggers friction.

  **Why "Proximity Credit Asymmetry"?**
  1.  **Proximity:** Captures the spatial/social distance factor as the key moderator.
  2.  **Credit:** Directly addresses the core conflict over the attribution of achievement (individual vs. group).
  3.  **Asymmetry:** Highlights the differential response (friction vs. celebration) based on the above factors.
  4.  It's descriptive, avoids overloaded terms (envy, resentment), and clearly separates the mechanism from related concepts.

  **Conclusion:** You've identified a distinct social phenomenon – **Proximity Credit Asymmetry (PCA)**. It's not simply envy or leveling, but a specific mechanism arising in tight-knit groups where maintaining diffuse credit norms and avoiding disruptive status comparisons are paramount. The friction directed at the local winner is the cost of violating these unspoken rules *while remaining present*, while the celebration of the distant achiever is the reward for providing a success that can be unambiguously absorbed into the group's identity without any local social cost. It's a fascinating lens on how small communities manage the tension between individual achievement and group cohesion. This deserves a column of its own.
