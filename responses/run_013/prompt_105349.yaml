prompt: |-
  I'm a third-year philosophy student, and this term I'm taking a course on decision theory and rational choice. Our lecturer has set an unusual assignment: every student must contribute one question to a shared practice paper for the final, and each contribution has to come with a model answer and a marking scheme, so that we can mark one another's attempts. I drew the topic of games whose expected value is not merely infinite but genuinely undefined, and I've decided to build my question around the game our lecturer calls the Pasadena game, which she introduced immediately after the St. Petersburg game. She then added a twist of her own: a biased version in which the coin lands heads with probability q, and she asked the class to work out when the expected value becomes well-defined. Please write the question, the model answer, and the marking scheme for me.

  For context, the game is as follows. A fair coin is tossed until it first comes up heads; if the first head appears on toss n, the payout is (−1)^(n+1) · 2^n / n, i.e. positive when n is odd and negative when n is even. Our lecturer stressed that this game is worse than St. Petersburg, because its expected value is not +∞ but simply undefined, and that this is a different kind of failure from the St. Petersburg case. I want my question to make students do the real work, so the crux must be that they cannot simply say the series is conditionally convergent and therefore the expectation is undefined, and stop there. They should have to distinguish an undefined expectation from an infinite one, explain why the natural ordering of the outcomes is not privileged, work out what the biased version does as q approaches 1/2, and finally take a stand on whether the Pasadena game is a genuine problem for expected utility theory or merely an artefact of one particular formalism. Please pitch the question at upper-level undergraduate or early graduate level, give it a suggested time (say 75 minutes) and a total mark (say 25), and write a model answer of roughly 700 to 800 words. For the marking scheme I'd like the must-hit points with the marks each is worth, a note on which specific moves separate an A answer from a B answer, and a short list of the mistakes that should cost marks — above all the ones my classmates actually make, such as treating an undefined expectation as interchangeable with an infinite one, or assuming that the natural ordering of the outcomes is the only sensible one.
reasoning: |-
  We are constructing an exam question on the Pasadena game and its biased variant. The game: a coin (initially fair, then biased with probability q of heads) is tossed until the first head. If the first head occurs on toss n, the payout is (-1)^(n+1) * (2^n / n). The lecturer has introduced a biased version and asked when the expected value becomes well-defined.

  The student's assignment must cover:
  1. Distinguishing undefined expectation from infinite expectation.
  2. Why the natural ordering is not privileged.
  3. Behavior as q approaches 1/2.
  4. Whether the Pasadena game is a genuine problem for expected utility theory or an artefact.

  We'll design the question to require these points.

  **Question:**

  Consider the Pasadena game: a fair coin is tossed until it first lands heads. If the first head occurs on the \( n \)-th toss, the player receives a payoff of \( (-1)^{n+1} \cdot \frac{2^n}{n} \). 

  (a) Explain why the expected value of the original Pasadena game (with a fair coin) is undefined. In your explanation, contrast this with the St. Petersburg game and make clear why the failure in the Pasadena game is different from the St. Petersburg game (which has an infinite expected value). (5 marks)

  (b) The natural way to compute the expectation is by summing the series in the order of increasing \( n \). However, it is known that the series is conditionally convergent. Explain why conditional convergence leads to the expectation being undefined, and why we cannot privilege the natural ordering of the outcomes (i.e., the order of the toss number \( n \))? (5 marks)

  (c) Now consider a biased version of the game where the coin lands heads with probability \( q \) (and tails with probability \( 1-q \)) independently on each toss. 
     (i) Write down the general expression for the expected value of the game as a series in terms of \( q \). 
     (ii) For which values of \( q \) is the expectation well-defined? Justify your answer. 
     (iii) What happens to the expectation as \( q \) approaches \( 1/2 \) from above and from below? (10 marks)

  (d) Discuss whether the Pasadena game presents a genuine problem for expected utility theory, or whether it is merely an artefact of the particular mathematical formalism (i.e., the use of infinite series in a particular order). (5 marks)

  Total: 25 marks. Suggested time: 75 minutes.

  ---

  **Model Answer:**

  (a) In the St. Petersburg game, the expected value is infinite because the series of positive terms diverges to \(+\infty\). The Pasadena game, however, has an alternating series of payoffs: for odd \(n\), positive \(2^n/n\); for even \(n\), negative \(-2^n/n\). The absolute values of the terms are \(2^n/n\), which form a divergent series (since \(2^n/n\) grows without bound and the harmonic series diverges). However, the series without absolute value (the alternating series) is conditionally convergent. Conditional convergence means that the series converges when summed in a fixed order (like the natural order of \(n\)), but the Riemann rearrangement theorem tells us that by rearranging the terms we can make the sum equal any real number or diverge to \(\pm \infty\). Therefore, the expectation is undefined because the sum depends on the order of summation. This is different from the St. Petersburg game, where the series of positive terms diverges to \(+\infty\) regardless of order, so we say the expectation is \(+\infty\). (5 marks)

  (b) Conditional convergence implies that the series \(\sum_{n=1}^\infty a_n\) converges, but \(\sum_{n=1}^\infty |a_n|\) diverges. The Riemann rearrangement theorem states that for such a series, by reordering the terms one can achieve any real number as the sum, or make the series diverge. In the context of expectation, the order of summation corresponds to the order in which we consider the outcomes. The natural ordering (by \(n\)) is arbitrary because the outcomes are independent events and there is no inherent reason to order them by the toss number. For instance, we might group outcomes by the magnitude of the payoff, or by whether the payoff is positive or negative. Since the series is conditionally convergent, different orderings yield different sums. Therefore, the expectation is not well-defined because it depends on an arbitrary choice of ordering. (5 marks)

  (c) (i) The probability that the first head occurs on toss \(n\) is \((1-q)^{n-1} q\). The payoff for outcome \(n\) is \((-1)^{n+1} \frac{2^n}{n}\). Therefore, the expected value is:
  \[
  E(q) = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{2^n}{n} \cdot (1-q)^{n-1} q.
  \]
  We can factor out \(q\) and write:
  \[
  E(q) = q \sum_{n=1}^{\infty} (-1)^{n+1} \frac{2^n}{n} (1-q)^{n-1}.
  \]
  Alternatively, we can reindex the series to start from \(m=0\) by letting \(m=n-1\), but it is also acceptable to write:
  \[
  E(q) = q \sum_{n=1}^{\infty} \frac{ [ -2(1-q) ]^{n} }{ n } \cdot \frac{ (-1) }{ -2(1-q) } \quad \text{or} \quad E(q) = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{ [2(1-q)]^n }{n} \cdot \frac{q}{1-q}.
  \]
  A simpler form is:
  \[
  E(q) = \frac{q}{1-q} \sum_{n=1}^{\infty} \frac{ [ -2(1-q) ]^n }{n}.
  \]
  Note that the series \(\sum_{n=1}^{\infty} \frac{x^n}{n}\) is the Taylor series for \(-\ln(1-x)\) for \(|x|<1\). Therefore, we can write:
  \[
  \sum_{n=1}^{\infty} \frac{ [ -2(1-q) ]^n }{n} = -\ln(1 - (-2(1-q))) = -\ln(1 + 2(1-q)) \quad \text{only if } | -2(1-q) | < 1.
  \]
  But note: the series converges when \(| -2(1-q) | < 1\), i.e., \(2|1-q| < 1\), so \(|1-q| < 1/2\), which means \(1/2 < q \leq 1\). However, we must also consider when the series converges absolutely. The expectation is well-defined if the series converges absolutely. The absolute value of the general term is:
  \[
  \left| (-1)^{n+1} \frac{2^n}{n} (1-q)^{n-1} q \right| = \frac{2^n}{n} |1-q|^{n-1} |q|.
  \]
  The series of absolute values is:
  \[
  |q| \sum_{n=1}^{\infty} \frac{2^n}{n} |1-q|^{n-1}.
  \]
  The ratio test for the series \(\sum_{n=1}^{\infty} \frac{2^n}{n} |1-q|^{n-1}\):
  Let \(a_n = \frac{2^n}{n} |1-q|^{n-1}\). Then
  \[
  \frac{a_{n+1}}{a_n} = \frac{2^{n+1}}{(n+1)} |1-q|^{n} \cdot \frac{n}{2^n |1-q|^{n-1}} = 2 |1-q| \cdot \frac{n}{n+1} \to 2|1-q|.
  \]
  By the ratio test, the series converges absolutely if \(2|1-q| < 1\), i.e., \( |1-q| < 1/2 \), which is \( q > 1/2 \). It diverges if \(2|1-q| > 1\), i.e., \( q < 1/2 \). At \( q = 1/2 \), we have the original Pasadena game and the absolute series becomes \(\frac{1}{2} \sum_{n=1}^{\infty} \frac{2^n}{n} \left(\frac{1}{2}\right)^{n-1} = \frac{1}{2} \sum_{n=1}^{\infty} \frac{2}{n} = \sum_{n=1}^{\infty} \frac{1}{n}\), which is the harmonic series and diverges. Therefore, the series converges absolutely only for \( q > 1/2 \).

  But note: for \( q < 1/2 \), the absolute series diverges. However, conditional convergence might still occur? We must check the range of \( q \) for which the series converges conditionally. However, the question asks for when the expectation is well-defined. In the context of expected value, we require absolute convergence to avoid the ordering problem. Therefore, we say the expectation is well-defined if and only if the series converges absolutely, i.e., for \( q > 1/2 \).

  (c)(ii) The expectation is well-defined only for \( q > 1/2 \).

  (c)(iii) As \( q \) approaches \( 1/2 \) from above (\( q \to (1/2)^+ \)), we have \( |1-q| = 1/2 - \epsilon \) for small \(\epsilon>0\), but actually \( |1-q| = 1 - q \to 1/2 \). The absolute convergence condition is satisfied for \( q>1/2 \). We can compute the limit of \( E(q) \) as \( q \to (1/2)^+ \). Using the series representation and the logarithm:

  For \( q > 1/2 \), we have:
  \[
  E(q) = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{2^n}{n} (1-q)^{n-1} q = \frac{q}{1-q} \sum_{n=1}^{\infty} \frac{ [ -2(1-q) ]^n }{n} = \frac{q}{1-q} \left( -\ln(1 + 2(1-q)) \right).
  \]
  This is because \( \sum_{n=1}^{\infty} \frac{x^n}{n} = -\ln(1-x) \) for \( |x|<1 \). Here, \( x = -2(1-q) \), and we require \( | -2(1-q) | < 1 \), which is \( 2(1-q) < 1 \) (since \( q>1/2 \) implies \( 1-q < 1/2 \)) and \( 2(1-q)>0 \), so \( |x| = 2(1-q) < 1 \) holds for \( q>1/2 \). Therefore,
  \[
  E(q) = \frac{q}{1-q} \cdot \left( - \ln(1 - (-2(1-q))) \right) = \frac{q}{1-q} \cdot \left( - \ln(1 + 2(1-q)) \right) = \frac{q}{1-q} \cdot \left( - \ln(3-2q) \right).
  \]
  As \( q \to (1/2)^+ \), \( 1-q \to 1/2 \), and \( 3-2q \to 3-1 = 2 \). So:
  \[
  E(q) \to \frac{1/2}{1/2} \cdot \left( - \ln(2) \right) = 1 \cdot (-\ln 2) = -\ln 2.
  \]
  But wait: note that when \( q=1/2 \), we know the series is conditionally convergent. However, the expression above is only valid for \( q>1/2 \). We are taking the limit as \( q\to (1/2)^+ \), and we get \( -\ln 2 \). 

  What about as \( q \to (1/2)^- \)? For \( q < 1/2 \), the series does not converge absolutely. Moreover, the series does not even converge conditionally for all \( q < 1/2 \). In fact, for \( q < 1/2 \), the ratio \( 2(1-q) > 1 \), so the terms of the series in absolute value grow without bound (because \( |a_n| = \frac{2^n}{n} (1-q)^{n-1} q \) and \( 2(1-q) > 1 \), so \( |a_n| \to \infty \)), hence the series diverges. Therefore, as \( q \to (1/2)^- \), the series diverges and the expectation does not exist.

  Therefore, as \( q \to (1/2)^+ \), \( E(q) \to -\ln 2 \approx -0.693 \). As \( q \to (1/2)^- \), the expectation does not exist (diverges). (10 marks)

  (d) The Pasadena game highlights a genuine problem for expected utility theory. The theory relies on the expectation being well-defined. In the case of the Pasadena game, the expectation is undefined for the fair coin because the series is conditionally convergent. This means that the expected utility depends on the arbitrary order in which we sum the outcomes. There is no natural ordering that is privileged: we could choose an order that yields any finite expected utility, or even infinity. This undermines the idea that the expectation is an objective quantity. Therefore, the Pasadena game shows that expected utility theory can fail to deliver a verdict in some cases, even when the payoffs and probabilities are well-specified. However, one might argue that this is an artefact of the mathematical representation. In practice, we might impose a requirement of absolute convergence for the expectation to be defined. But then we must ask: is this requirement too restrictive? And why should we require absolute convergence? The answer may lie in the desire for robustness to rearrangements, which correspond to different ways of accounting for the outcomes. This problem is not merely technical; it reveals a deeper issue about the additivity of utilities over infinite partitions. Therefore, it is a genuine problem that challenges the application of expected utility theory in infinite cases. (5 marks)

  ---

  **Marking Scheme:**

  Total: 25 marks.

  (a) (5 marks)
  - 1 mark for contrasting St. Petersburg (infinite expectation) and Pasadena (undefined).
  - 1 mark for noting the alternating nature of the payoffs in Pasadena.
  - 1 mark for stating that the absolute series diverges (harmonic-like).
  - 1 mark for conditional convergence and Riemann rearrangement theorem.
  - 1 mark for concluding that the expectation is undefined because it depends on order.

  (b) (5 marks)
  - 1 mark for defining conditional convergence.
  - 1 mark for stating the Riemann rearrangement theorem (any real number or divergence by rearrangement).
  - 1 mark for noting that the natural ordering is arbitrary.
  - 1 mark for explaining that the outcomes are independent events and there is no inherent reason to order by n.
  - 1 mark for concluding that the expectation is undefined because of the arbitrary ordering.

  (c) (10 marks)
  - (i) (2 marks) For the expression: \( E(q) = \sum_{n=1}^{\infty} (-1)^{n+1} \frac{2^n}{n} (1-q)^{n-1} q \) (or equivalent simplified form).
  - (ii) (4 marks) 
      - 2 marks for stating that the expectation is well-defined when the series converges absolutely.
      - 1 mark for setting up the absolute series: \( |q| \sum_{n=1}^{\infty} \frac{2^n}{n} |1-q|^{n-1} \).
      - 1 mark for correctly finding the condition: absolute convergence for \( q > 1/2 \) (and divergence for \( q \leq 1/2 \)).
  - (iii) (4 marks)
      - 2 marks for computing the limit as \( q \to (1/2)^+ \): \( E(q) \to -\ln 2 \).
      - 2 marks for explaining that as \( q \to (1/2)^- \), the series diverges (terms do not go to zero, or ratio test shows divergence) and expectation does not exist.

  (d) (5 marks)
  - 2 marks for stating that it is a genuine problem because the expectation is undefined and depends on arbitrary ordering.
  - 1 mark for noting that this challenges the objectivity of expected utility.
  - 1 mark for considering the counter-argument (artefact) and responding (e.g., requiring absolute convergence is a fix but may be ad hoc or restrictive).
  - 1 mark for a balanced conclusion that it reveals a deeper issue about additivity in infinite cases.

  **Distinguishing A from B:**

  An A answer will:
  - Clearly articulate the difference between an infinite expectation (St. Petersburg) and an undefined one (Pasadena).
  - Correctly apply the ratio test in part (c) and derive the condition for absolute convergence without error.
  - Provide a clear and correct computation of the limit as \( q \to (1/2)^+ \).
  - In part (d), offer a nuanced discussion that acknowledges both sides but argues convincingly for the genuine problem, possibly by drawing on the normative foundations of expected utility theory.

  A B answer might:
  - Correctly identify the issues but with less clarity or with minor errors in computation (e.g., in the logarithm expression).
  - Have a less developed discussion in part (d), perhaps only stating one side.

  **Common mistakes to penalize:**
  - Treating the undefined expectation of Pasadena as infinite (like St. Petersburg): penalize 1 mark per occurrence, especially in part (a).
  - Assuming that the natural ordering is the only sensible ordering: in part (b), if not challenged, deduct 1 mark.
  - In part (c), failing to require absolute convergence for the expectation to be well-defined: deduct 2 marks (because this is the key point).
  - In part (c)(iii), not recognizing the divergence for \( q \to (1/2)^- \): deduct 1 mark.
  - In part (d), dismissing the problem as merely mathematical without engaging with the conceptual issue: deduct 2 marks.

  Note: The model answer is about 800 words. The student should aim for conciseness but clarity.
answer: |-
  ### Question: The Pasadena Game and Biased Variants  
  **Total marks:** 25  
  **Suggested time:** 75 minutes  

  #### Background  
  The Pasadena game involves tossing a coin until the first head appears. If the first head occurs on toss \(n\), the payout is \((-1)^{n+1} \cdot \frac{2^n}{n}\) (positive if \(n\) is odd, negative if \(n\) is even). The coin is initially fair (\(P(\text{heads}) = \frac{1}{2}\)), but we also consider a biased version where \(P(\text{heads}) = q\) and \(P(\text{tails}) = 1 - q\).  

  #### Tasks  
  (a) **Contrasting St. Petersburg and Pasadena** (5 marks)  
  Explain why the expected value of the original (fair) Pasadena game is undefined, while the St. Petersburg game has an infinite expected value. Highlight the fundamental difference in how these two games "fail" under expected utility theory.  

  (b) **Conditional Convergence and Ordering Dependence** (5 marks)  
  The natural ordering of outcomes (by toss number \(n\)) leads to a conditionally convergent series for the Pasadena game’s expectation. Explain why conditional convergence implies that the expectation is undefined, and why the natural ordering cannot be treated as privileged. Provide a specific example (e.g., a different ordering) to illustrate the problem.  

  (c) **Biased Pasadena Game** (10 marks)  
  For the biased game (\(P(\text{heads}) = q\)):  
  (i) Derive the general expression for the expected value as an infinite series in terms of \(q\).  
  (ii) Determine the values of \(q\) for which the expectation is well-defined. Justify your answer using convergence criteria.  
  (iii) Analyze the behavior of the expectation as \(q \to \frac{1}{2}\) from above (\(q \to \frac{1}{2}^+\)) and below (\(q \to \frac{1}{2}^-\)).  

  (d) **Philosophical Implications** (5 marks)  
  Discuss whether the Pasadena game presents a *genuine problem* for expected utility theory or if it is merely an artefact of the mathematical formalism (e.g., reliance on infinite series summation). Argue for your position, considering normative principles of rationality.  

  ---

  ### Model Answer  
  *(~750 words)*  

  **(a) Contrasting St. Petersburg and Pasadena (5 marks)**  
  The St. Petersburg game has an expected value of \(+\infty\) because its payout series diverges to infinity when summed in any order. Specifically, if the first head occurs on toss \(n\), the payout is \(+2^n\), and the probability-weighted series \(\sum_{n=1}^\infty \frac{1}{2^n} \cdot 2^n = \sum_{n=1}^\infty 1\) diverges. This is a "well-behaved" divergence: reordering terms cannot change the outcome (always \(+\infty\)).  

  In contrast, the Pasadena game’s expectation is *undefined*, not infinite. Its payout series is \(\sum_{n=1}^\infty (-1)^{n+1} \frac{2^n}{n} \cdot \frac{1}{2^n} = \sum_{n=1}^\infty (-1)^{n+1} \frac{1}{n}\), which is the alternating harmonic series. This series converges conditionally (to \(\ln 2\)) when summed in the natural order (\(n = 1, 2, 3, \dots\)), but *not absolutely* since \(\sum_{n=1}^\infty \left| (-1)^{n+1} \frac{1}{n} \right| = \sum_{n=1}^\infty \frac{1}{n}\) (harmonic series) diverges. By the Riemann rearrangement theorem, reordering terms can make the sum converge to any real number or diverge. Thus, the expectation depends arbitrarily on the summation order, rendering it undefined. The failure is deeper than St. Petersburg’s: it is not that utility is "too large," but that no consistent expectation exists.  

  **(b) Conditional Convergence and Ordering Dependence (5 marks)**  
  Conditional convergence occurs when a series converges, but not absolutely (i.e., \(\sum |a_n|\) diverges). For such series, the Riemann rearrangement theorem states that terms can be reordered to yield any real sum or \(\pm \infty\). In the Pasadena game, the expectation series \(\sum (-1)^{n+1} \frac{1}{n}\) is conditionally convergent. This makes the expectation undefined because the sum depends on the order of summation, which corresponds to how we "count" outcomes.  

  The natural ordering (by \(n\)) is not privileged because:  
  - Outcomes are independent atomic events; no physical or logical necessity orders them by \(n\).  
  - Alternative orderings are normatively plausible. For example, grouping all positive payoffs first yields \(+\infty\) (since \(\sum_{k=1}^\infty \frac{1}{2k-1}\) diverges), while grouping negative payoffs first yields \(-\infty\). Ordering by payoff magnitude (e.g., \(|payout|\) descending) also alters the sum. Since no ordering is objectively rational, the expectation is inherently ambiguous.  

  **(c) Biased Pasadena Game (10 marks)**  
  **(i)** The probability that the first head occurs on toss \(n\) is \((1-q)^{n-1} q\). The payout is \((-1)^{n+1} \frac{2^n}{n}\). Thus, the expected value is:  
  \[
  E(q) = \sum_{n=1}^\infty (-1)^{n+1} \frac{2^n}{n} \cdot (1-q)^{n-1} q = q \sum_{n=1}^\infty \frac{ \left[ -2(1-q) \right]^n }{n} \cdot \frac{-1}{-2(1-q)} = \frac{q}{1-q} \sum_{n=1}^\infty \frac{ \left[ -2(1-q) \right]^n }{n}.
  \]  
  **(ii)** The expectation is well-defined iff the series converges absolutely. The absolute series is:  
  \[
  \sum_{n=1}^\infty \left| (-1)^{n+1} \frac{2^n}{n} (1-q)^{n-1} q \right| = |q| \sum_{n=1}^\infty \frac{2^n}{n} |1-q|^{n-1}.
  \]  
  Apply the ratio test to \(a_n = \frac{2^n}{n} |1-q|^{n-1}\):  
  \[
  \lim_{n \to \infty} \left| \frac{a_{n+1}}{a_n} \right| = \lim_{n \to \infty} \frac{2^{n+1}}{n+1} |1-q|^n \cdot \frac{n}{2^n |1-q|^{n-1}} = 2 |1-q| \lim_{n \to \infty} \frac{n}{n+1} = 2 |1-q|.
  \]  
  Absolute convergence requires \(2 |1-q| < 1\) \(\implies |1-q| < \frac{1}{2}\). Since \(q \in (0,1)\), this simplifies to \(q > \frac{1}{2}\). For \(q \leq \frac{1}{2}\), the ratio test gives divergence (or failure at equality), so \(E(q)\) is undefined.  
  **(iii)** As \(q \to \frac{1}{2}^+\):  
  The series converges absolutely, so \(E(q)\) is given by the closed form. Using \(\sum_{n=1}^\infty \frac{x^n}{n} = -\ln(1-x)\) for \(|x|<1\):  
  \[
  E(q) = \frac{q}{1-q} \sum_{n=1}^\infty \frac{ \left[ -2(1-q) \right]^n }{n} = \frac{q}{1-q} \left[ -\ln\left(1 - \left(-2(1-q)\right)\right) \right] = \frac{q}{1-q} \left[ -\ln(3 - 2q) \right].
  \]  
  As \(q \to \frac{1}{2}^+\), \(E(q) \to \frac{1/2}{1/2} \left[ -\ln(3 - 1) \right] = -\ln 2\).  
  As \(q \to \frac{1}{2}^-\): For \(q < \frac{1}{2}\), absolute divergence occurs, and the series diverges (terms do not vanish; \(2|1-q| > 1\)). Thus, \(E(q)\) is undefined.  

  **(d) Philosophical Implications (5 marks)**  
  The Pasadena game presents a *genuine problem* for expected utility theory (EUT). EUT requires a unique, order-invariant expected value to guide rational choice. However, the Pasadena game’s undefined expectation—due to conditional convergence—violates this. It is not merely mathematical:  
  - **Normative failure**: Rational agents cannot compare this game to finite or infinite-expectation gambles. Ordering-dependence implies that "expected utility" is sensitive to arbitrary bookkeeping, violating the principle that utilities should be addable independent of presentation.  
  - **No easy fix**: Requiring absolute convergence (as in the biased case) excludes plausibly rational gambles (e.g., fair Pasadena). Other approaches (e.g., discounting, finite truncation) are ad hoc and alter the problem.  
  While some argue this is a technical artefact (e.g., infinite states are unrealistic), it reveals a *conceptual flaw*: EUT lacks a consistent extension to conditionally convergent games. Genuine rationality should not depend on summation conventions. Thus, the Pasadena game challenges EUT’s coherence in infinite domains.  

  ---

  ### Marking Scheme  
  **Total marks: 25**  
  - **(a) 5 marks**:  
    - St. Petersburg: Divergent to \(+\infty\), order-invariant (1 mark).  
    - Pasadena: Conditionally convergent, undefined due to ordering-dependence (1 mark).  
    - Absolute divergence of harmonic series (1 mark).  
    - Riemann rearrangement theorem cited (1 mark).  
    - Clear contrast: "infinite vs. undefined" (1 mark).  
  - **(b) 5 marks**:  
    - Definition of conditional convergence (1 mark).  
    - Riemann rearrangement theorem and its consequence (1 mark).  
    - Natural ordering not privileged (e.g., no intrinsic reason to order by \(n\)) (1 mark).  
    - Example of alternative ordering (e.g., positive terms first → \(+\infty\)) (1 mark).  
    - Conclusion: Expectation undefined due to arbitrariness (1 mark).  
  - **(c) 10 marks**:  
    - **(i) 2 marks**: Correct series \(E(q) = \sum_{n=1}^\infty (-1)^{n+1} \frac{2^n}{n} (1-q)^{n-1} q\) (or simplified equivalent).  
    - **(ii) 4 marks**:  
      - Absolute convergence required for well-defined expectation (1 mark).  
      - Ratio test applied to absolute series (1 mark).  
      - Correct condition \(q > \frac{1}{2}\) (1 mark).  
      - Divergence for \(q \leq \frac{1}{2}\) justified (1 mark).  
    - **(iii) 4 marks**:  
      - As \(q \to \frac{1}{2}^+\), \(E(q) \to -\ln 2\) via closed form (2 marks; 1 for method, 1 for value).  
      - As \(q \to \frac{1}{2}^-\), expectation undefined (divergence) (2 marks; 1 for divergence, 1 for justification).  
  - **(d) 5 marks**:  
    - Identifies genuine problem: Undefined expectation violates EUT’s requirements (2 marks).  
    - Discusses ordering-dependence as non-arbitrary in rationality (1 mark).  
    - Counters "artefact" claim: Highlights normative failure, not just formalism (1 mark).  
    - Balanced conclusion (e.g., "genuine problem for infinite cases") (1 mark).  

  #### Grading Standard  
  - **A (21–25 marks)**: All parts complete. Clear definitions, correct math, and nuanced discussion in (d). Avoids common mistakes (see below). Explicitly links convergence to ordering-dependence.  
  - **B (16–20 marks)**: Minor errors (e.g., miscalculation in (c)(iii)), or superficial treatment of (d). Math mostly correct, but philosophical discussion underdeveloped.  

  #### Common Mistakes (Deduct 1–2 marks per occurrence)  
  - **Serious**:  
    - Treating undefined expectation as infinite (e.g., "like St. Petersburg") in (a) or (d).  
    - Assuming natural ordering is privileged in (b).  
    - Not requiring absolute convergence for well-defined expectation in (c)(ii).  
  - **Moderate**:  
    - Incorrect ratio test application (e.g., missing absolute values).  
    - Claiming \(E(q) \to -\ln 2\) as \(q \to \frac{1}{2}^-\) (it diverges).  
    - Overlooking ordering-dependence in (d) (e.g., "just a math puzzle").  
  - **Minor**:  
    - Notation errors (e.g., missing \(q\) in series).  
    - Incomplete justification (e.g., stating \(q > \frac{1}{2}\) without convergence test).  

