answer: |-
  ### Essay Question (Worth 20 marks; Time: 45 minutes)
  > **"In the case of the village where everyone correctly believes the water is safe (based on forgotten testimony), does Nyāya epistemology successfully explain why this belief constitutes *pramā* (valid knowledge)? If not, does this failure reveal a deeper tension within Nyāya’s reliance on *āptopadeśa* (testimony of a trustworthy speaker), and how might Mīmāṃsā’s doctrine of *svataḥprāmāṇya* (intrinsic validity of cognition) resolve the puzzle? Justify your position."**

  ---

  ### Model Answer (Approx. 600 words)
  The village case presents a critical challenge to Nyāya epistemology. While the villagers’ belief is true (*yathārtha*) and arises from testimony (*śabda*), Nyāya cannot classify it as *pramā* because it violates the core condition of *āptopadeśa*: the testimony must originate from a known reliable speaker (*āpta*). Here, the original speaker is anonymous and epistemically inaccessible. Nyāya (following Gaṅgeśa) insists that testimony-based knowledge requires *both* the speaker’s trustworthiness *and* the hearer’s recognition of it (*āptatva-jñāna*). Since no villager can verify the source’s reliability—or even identify him—the belief fails as *pramā*, despite its truth and practical success.  

  This failure exposes a tension in Nyāya’s framework. The school privileges *āptopadeśa* as the *sine qua non* of testimonial knowledge, yet in this case, the belief *coheres* with other experiences (no one falls ill) and *leads to successful action* (*arthakriyā*). Nyāya acknowledges these as *secondary* markers of validity (*pramāṇavyavasthā*) but denies they can *replace* the need for a certified speaker. If coherence and success alone sufficed, Nyāya’s careful structure collapses: anonymous chains of testimony (like folklore) could generate knowledge without accountability. This clashes with Nyāya’s realist, agent-focused epistemology, where knowledge requires traceable causal links to reality via *pramāṇas*.  

  Here, Mīmāṃsā’s doctrine of *svataḥprāmāṇya* offers a compelling alternative. For Mīmāṃsakas, *all* cognitions are *intrinsically* valid unless invalidated by later evidence (*bādha*). Testimony need not derive validity from the speaker; its truth is presumed *until contradicted*. In the village, the belief’s coherence, practical efficacy, and absence of counter-evidence *confirm* its intrinsic validity. Crucially, Mīmāṃsā’s framework easily accommodates authorless knowledge (like the Veda), where no speaker exists to certify. The villagers’ belief is thus *pramā* not because of its origin (which is irrelevant), but because it remains unchallenged and functional.  

  Nyāya could respond by distinguishing *accidental* truth from *knowledge*. The villagers’ belief is "true opinion" (*samyagjñāna*) but not *pramā*, as it lacks *justification* via a *pramāṇa*. However, this highlights Nyāya’s vulnerability: if a belief is consistently successful and internally coherent, *why* demand an untraceable speaker? The case suggests that Nyāya’s insistence on *āptopadeśa* is less about truth-conduciveness and more about preserving social-epistemic hierarchies. Meanwhile, Mīmāṃsā’s *svataḥprāmāṇya* prioritizes the belief’s *present* functional role, making it better suited to explain collective, authorless knowledge.  

  Thus, the village case does not merely challenge Nyāya—it reveals a foundational rift. Nyāya’s externalism (*parataḥprāmāṇya*) cannot certify the belief without a speaker, forcing reliance on coherence/success that ironically aligns with Mīmāṃsā’s internalism. The puzzle suggests that Nyāya’s *āptopadeśa* requirement is unsustainable in cases of distributed testimony, while Mīmāṃsā’s intrinsic validity better captures the epistemology of communal belief.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Five must-hit points, marks, and common pitfalls:**  

  1. **Nyāya’s failure due to absent *āpta* (4 marks)**  
     *Must-hit:* Explicitly states that *āptopadeśa* fails without a verifiable speaker.  
     *Common miss:* Claims Nyāya accepts the belief as knowledge because it’s true/useful.  

  2. **Tension in Nyāya: Coherence/success vs. speaker-dependence (4 marks)**  
     *Must-hit:* Identifies that Nyāya treats coherence/success as secondary to *āptopadeśa*, creating inconsistency.  
     *Common miss:* Assumes Nyāya can "solve" the case by appealing to practical success alone.  

  3. **Mīmāṃsā’s *svataḥprāmāṇya* as solution (4 marks)**  
     *Must-hit:* Explains how intrinsic validity + lack of *bādha* (contradiction) validates the belief.  
     *Common miss:* Mentions *svataḥprāmāṇya* vaguely without linking to absence of counter-evidence.  

  4. **Authorless knowledge contrast (Veda vs. village) (4 marks)**  
     *Must-hit:* Connects Mīmāṃsā’s authorless Veda to the village’s anonymous testimony.  
     *Common miss:* Treats the Veda as irrelevant to the case.  

  5. **Critical evaluation: Which school resolves it better? (4 marks)**  
     *Must-hit:* Argues that the case exposes Nyāya’s rigidity and favors Mīmāṃsā’s flexibility.  
     *Common miss:* Avoids taking a stance or focuses only on one school.  

  ---

  **Design Notes:**  
  - The question forces a *comparative* analysis, preventing rote summaries.  
  - The marking scheme rewards dialectical engagement (Nyāya’s weakness → Mīmāṃsā’s strength) over mere exegesis.  
  - Common misses reflect recurring group pitfalls observed (e.g., overemphasizing truth/utility in Nyāya).  
  - Model answer models concise argumentation under time pressure, using only core concepts (*āpta*, *svataḥprāmāṇya*, *arthakriyā*, *bādha*).
