answer: |-
  Your observation captures a sophisticated interplay of philosophical ethics, social norms, and rhetorical strategy. No single established term encompasses the entire phenomenon, but we can disentangle and label its components. Below is a systematic carving, naming each element, defining boundaries, and proposing a new term for the selective rhetorical move.

  ---

  ### **1. The In-Principle Claim: *Value Incommensurability***  
  **Definition:** The assertion that certain moral evils (e.g., genocides, famines) cannot be meaningfully compared or ranked because they belong to distinct categories or exceed quantitative measurement.  
  **Philosophical Basis:** Rooted in value pluralism (Isaiah Berlin) and moral particularism. Joseph Raz’s *incommensurability thesis* argues some values lack a common metric (e.g., justice vs. mercy). Applied to historical trauma, it holds that *qualitative differences* (intent, cultural destruction, systematicity) defy reduction to scales of "worse/better."  
  **Boundary Test:**  
     - *Legitimate Case:* Comparing the Holocaust (industrialized genocide) with a natural disaster (e.g., the 1908 Messina earthquake).  
     - *Invalid Case:* Comparing two state-engineered famines (e.g., Holodomor and Great Leap Forward) where intent, scale, and mechanisms *can* be analyzed comparatively.  

  ---

  ### **2. The Normative Prohibition: *Moral Taboo on Instrumentalization***  
  **Definition:** A cultural/social norm forbidding the comparison of atrocities to avoid reducing victims’ suffering to a "currency" for debate, thereby committing *secondary harm* through perceived disrespect.  
  **Ethical Basis:** Echoes deontological ethics (Kant’s "dignity without price") and trauma ethics (e.g., Dominick LaCapra’s "empathic unsettlement"). Treats suffering as *sacred*—inviolable to utilitarian calculus.  
  **Key Mechanism:** Violating this taboo triggers moral disgust (Haidt’s moral foundations theory), framing comparers as perpetrators of symbolic violence.  
  **Boundary Test:**  
     - *Appropriate:* Rejecting a politician’s comparison of COVID mandates to the Holocaust to score partisan points.  
     - *Inappropriate:* Silencing historians comparing colonial famines to study shared patterns of resource extraction.  

  ---

  ### **3. The Rhetorical Move: *Competitive Martyrology*** (Proposed Term)  
  **Definition:** The tactical invocation of incommensurability or moral taboo *only when a comparison threatens to diminish the perceived uniqueness or gravity of a trauma central to the speaker’s identity/agenda*, while ignoring equivalent comparisons that amplify it.  
  **Core Features:**  
     - **Asymmetry:** Allows "upward comparisons" (invoking a "greater" evil to amplify one’s cause) but forbids "downward comparisons" (anything implying relativization).  
     - **Category-Breaking Claims:** Asserts incomparability not on principled grounds, but to exempt favored traumas from scrutiny.  
     - **Silencing Function:** Positions opposition as morally corrupt rather than factually wrong.  

  **Why This Term?**  
     - *Martyrology*: Traditionally denotes narratives venerating martyrs/heroic victims. "Competitive" highlights zero-sum struggles for moral capital.  
     - *Fits Observed Dynamics:* Explains why the same person might forbid comparing Rwanda to the Holocaust (if Holocaust-focused) but freely invoke the Holocaust when criticizing contemporary injustices.  

  **Boundary Tests:**  
     - *Positive Example:* A diaspora group opposing Holodomor-Holocaust comparisons (fearing diminished recognition) while simultaneously comparing it to Stalin’s other purges to secure reparations.  
     - *Negative Example:* Consistently rejecting *all* cross-trauma comparisons, even when advocating for one’s own cause via other means (showing principled incommensurability).  
     - *Gray Zone:* Comparing apartheid to Jim Crow to build solidarity vs. doing so to argue one was "worse" and thus more deserving of reparations.  

  ---

  ### **Distinguishing the Concepts**
  | **Concept**               | **Nature**          | **Purpose**                          | **When Legitimate**                  |
  |---------------------------|---------------------|--------------------------------------|--------------------------------------|
  | **Value Incommensurability** | Philosophical claim | Assert qualitative uniqueness        | When evils differ ontologically (e.g., intent vs. neglect) |
  | **Moral Taboo**           | Ethical norm        | Protect victims from instrumentalization | When comparisons trivialize suffering for gain |
  | **Competitive Martyrology** | Rhetorical tactic   | Secure moral/political advantage     | *Never*—inherently manipulative; exploits the above two |

  ---

  ### **Why This Pattern Persists**
  The power of *competitive martyrology* lies in weaponizing legitimate ethical concerns (incommensurability, respect for victims) to:
  1. **Control Narrative Hierarchies:** Establish one’s trauma as the "gold standard" of evil.  
  2. **Preempt Accountability:** E.g., rejecting colonial genocide comparisons to avoid reparations.  
  3. **Mobilize Group Identity:** Victimhood outranks opponents in "oppression Olympics."  

  Its effectiveness depends on social capital: groups with recognized victim status (e.g., Jewish Holocaust survivors) can enforce taboos more easily than marginalized groups (e.g., victims of Belgium’s Congo atrocities).

  ---

  ### **Conclusion**
  Your three tangled elements resolve thus:  
  - **In-principle claim** = *Value Incommensurability*.  
  - **Normative prohibition** = *Moral Taboo on Instrumentalization*.  
  - **Rhetorical move** = ***Competitive Martyrology*** (the proposed term for selective, identity-driven deployment).  

  This framework exposes how moral language can mask power dynamics. Naming *competitive martyrology* isolates the tactic, allowing critique without rejecting legitimate ethical boundaries around trauma. To test it, probe whether the speaker applies the taboo consistently—or only when their moral capital is at stake.
