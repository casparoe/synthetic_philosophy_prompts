answer: |-
  ## The Vantian Returning: A Dialogue Beyond the Primer

  **Setting:** A cramped seminar room at the Vantian Institute for Legal Philosophy. Coffee cups litter the table. Whiteboards are covered in dense scrawl.

  **Characters:**
  *   **Anya (Hartian):** Sharp, precise, prefers dismantling arguments brick by brick. Believes law’s primary function is preventing harm and coordinating social life, not enforcing consensus morality.
  *   **Ben (Devlinian):** Passionate, grounded in practical consequences. Sees law as the guardian of the shared social fabric, which is inherently moral in nature.

  **The Case:** The "returning" practiced by the Alderwood Community – consensual post-mortem dismemberment and composting on private land. Proposed ban due to public revulsion and cited correlations from Kesh.

  **(The dialogue begins mid-argument)**

  **Ben:** Anya, we cannot simply ignore the *felt reality* of Vantian society. Four-fifths! This isn't a fringe opinion; it's the profound conviction of the ordinary reasonable person. The revulsion isn't aesthetic; it strikes at their deepest understanding of respect for the dead – a pillar of *our* shared morality. The Kesh data, while messy, reinforces the empirical danger: loosen *this* thread, and related practices – corpse mishandling, estate fraud – proliferate. The fabric *does* unravel. Law must defend the conditions of its own existence, the very morality that underpins social order.

  **Anya:** Ben, I acknowledge the strength of feeling. Truly. But "felt reality" and "profound conviction" are precisely what Hart labelled *positive* morality – the morality a society *happens* to have. My core objection is that you leap directly from "this causes widespread disgust" to "therefore, the criminal law is justified in suppressing it." Where is the *harm*? You cite Kesh, but correlation isn't causation. They rewrote probate law and cut mortuary funding! Attributing the rise in corpse mishandling *solely* to legalizing a private, consensual burial practice is spurious. Fraud against the elderly? That’s a harm, certainly, but where's the causal link to the Alderwood ritual? It's a non sequitur. The state needs more than revulsion plus coincidental statistics.

  **Ben:** The harm *is* the damage to the shared moral environment! The ordinary person *feels* harmed by the mere knowledge that this occurs. Their sense of security in a predictable, respectful social order is undermined. It creates a moral dissonance that erodes trust. And while Kesh isn't a perfect lab, the *simultaneous* erosion of norms around the dead *is* evidence – not proof, but evidence – supporting the empirical hypothesis you demand. Societies *are* delicate ecosystems. Law is a key part of that ecosystem's maintenance. Can you categorically state that tolerating such a profound breach of a core shared norm *won't* have downstream consequences? Your burden of proof argument cuts both ways – absolute certainty is impossible in social life.

  **Anya:** *(Concedes a point)* Okay, Ben. I'll grant you this: the *feeling* of being harmed by the knowledge of others' consensual acts *is* a real social phenomenon. And perhaps, *perhaps*, in extreme cases, widespread moral dissonance could lead to tangible social instability. But here’s my deeper concern: **isn't your entire framework circular?** You say the law must defend the "shared morality." But what *makes* it shared? Isn't the criminal law itself one of the primary tools *through which* morality becomes solidified and perceived as "shared"? If Parliament bans the returning tomorrow, citing "shared morality," doesn't that *reinforce* and *amplify* the perception that this morality *is* universally shared and fundamental? The law isn't just defending a pre-existing, independent thing called "shared morality"; it's actively *constituting* it, making it seem more monolithic and essential than it perhaps is. The Alderwood community *shares* a different morality. Who gets to define the "shared" one? The 80%? Why not the 51%? Or the loudest?

  **Ben:** *(Nods thoughtfully, conceding a point)* That's... a powerful point, Anya. The law *does* shape perception, absolutely. It signals what society collectively condemns. But it doesn’t create morality *ex nihilo*. The revulsion existed *before* the proposed ban. The polling reflects a sentiment already deeply ingrained. Law responds to and formalizes the moral intuitions of the reasonable person – it doesn't invent them wholesale. But yes, the act of criminalization *does* strengthen the sense that this norm is central and non-negotiable. It becomes part of the social bedrock... which brings me to your ratchet fear.

  **Anya:** Exactly! **Isn't legal moralism, by its nature, a ratchet?** Each successful prosecution or ban based on defending the shared moral fabric *becomes part of that very fabric*. The law *expands* the domain of what is deemed essential to defend. Yesterday's tolerated eccentricity becomes today's intolerable outrage because yesterday's law defined it as such. How do we prevent the "limits of tolerance" from inexorably shrinking? Where is the limiting principle besides the shifting sands of "current indignation"?

  **Ben:** The limiting principle *is* the "sliding scale" itself! Devlin wasn't advocating for banning every minor vice. It requires "deep and widespread indignation" and a practice "well beyond the limits of tolerance." This *isn't* a minor eccentricity, Anya. It strikes at a core, almost universal human norm concerning bodily integrity after death. The ratchet fear is real, but it’s countered by the "ordinary reasonable person" benchmark. They aren't philosophers seeking logical purity; they have a practical sense of proportion. They tolerate much that they dislike. Only the truly egregious breaches provoke the level of outrage justifying legal force. The Kesh data, however imperfect, suggests this *is* seen as egregious and that tolerance *did* erode related norms. Law reflects *and* reinforces, but it primarily *responds* to the felt necessities of social cohesion.

  **Anya:** But "felt necessities" are historically contingent and often regressive! Public indignation once demanded laws against interracial marriage, citing threats to the social fabric. Your "reasonable person" of the past held views we now find abhorrent. Doesn't critical morality – the reasoned evaluation of *why* norms exist – *require* us to sometimes resist the positive morality, even the passionately held one? Protecting individual liberty in the absence of tangible harm *is* a critical moral principle that should constrain the power of the majority's disgust. The Alderwood community harms no one. Their liberty deserves protection, even if it makes the majority uncomfortable. Law based solely on enforcing majoritarian disgust is tyranny dressed as cohesion.

  **Ben:** And law that ignores the deep-seated moral foundations of social life risks becoming illegitimate, detached from the people it governs, and ultimately unstable. Stability *is* a moral good. The "harm" of social fragmentation is profound, even if hard to quantify. We *need* shared reference points. The Alderwood practice isn't just private; its *existence* becomes public knowledge and challenges a fundamental shared understanding. Protecting the liberty of 400 people shouldn't come at the cost of undermining a core norm for millions, especially when evidence *suggests* downstream harms to vulnerable groups like the elderly. Your critical morality risks becoming an elite project, disconnected from the lived reality of the society it judges.

  **The Crux:** They stare at each other, the whiteboard diagrams forgotten. The fundamental, unresolved tension hangs in the air: **Is law primarily a shield for pre-existing, organically evolved shared moral norms essential for social cohesion (Ben), or is it a tool for social coordination that must be rigorously constrained by critical morality and harm principles to protect individuals from the tyranny of the majority's feelings, recognizing that law itself actively shapes what is perceived as "shared" (Anya)?** The circularity of defining "shared" morality and the ratchet effect of legal enforcement remain profound challenges without clear resolution.

  **Anya:** *(Finally)* Alright, Ben. What evidence *could* move me? Show me rigorous, longitudinal studies controlling for confounding variables (like Kesh's probate reforms) that *prove* legalizing a specific, deeply controversial but consensual practice like the returning *caused* a measurable, significant increase in *unrelated*, harmful acts like corpse desecration or estate fraud *in a stable society*. Not correlation, not anecdotes, but causation. Prove the "unraveling" hypothesis beyond reasonable doubt for *this specific norm*. And show me how banning it wouldn't *itself* cause greater harm (e.g., persecuting a harmless minority, driving them underground).

  **Ben:** *(Leans forward)* And for me, Anya? Show me a stable, complex society like Vantia that maintained strong social cohesion and respect for foundational norms like the treatment of the dead *while* legally tolerating practices that provoked the level of deep, widespread revulsion this one does. Show me it didn't lead to a measurable coarsening of related attitudes or practices over a generation. Prove that a society *can* withstand such profound challenges to its core moral intuitions without fracturing, that the "fabric" is truly resilient enough without legal reinforcement. Show me the critical morality you champion isn't just the morality of the enlightened few, but can genuinely command the allegiance and provide the shared meaning necessary for millions.

  **(They gather their notes. The argument is unresolved, the machinery of their philosophies laid bare, the weight of evidence yet to fully tip the scales.)**
