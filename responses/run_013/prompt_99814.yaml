answer: |-
  Below is a decision tree for the symbol grounding problem in text-only language models (LLMs), starting from the shared commitment: **"The LLM produces fluent, task-appropriate output but has no sense organs or direct connection to the world."** Each branch is a concrete question phrased as a case-based claim. Terminal leaves name the position (or state if unnamed) and note its "awkward commitment"—the most counterintuitive or challenging implication. The tree distinguishes key axes: causal links to the world, normativity (whether meaning requires "supposed to" function), sources of normativity, the target of grounding (symbol/system/practice), and gradation. Your flatmate’s "practical grounding" is integrated.  

  British English throughout. Positions marked "unnamed" lack prominent defenders; reasons noted.  

  ---

  ### Decision Tree: What (if anything) do a text-only LLM’s words *mean*?  
  **Start:** The LLM produces fluent, task-appropriate text but has no senses or direct world-access.  

  1. **Suppose the LLM says, "There’s a cat on the mat," and no cat exists or ever has. Must it be *possible* for the LLM to be *wrong* about this (in a way that matters *to it*) for "cat" to mean anything?**  
     - **Yes → Go to 2**  
       *(Meaning requires a causal-informational link where misrepresentation has consequences for the system itself.)*  
     - **No → Go to 5**  
       *(Meaning might not require world-links or error that matters to the system.)*  

  ---

  #### If YES (misrepresentation possibility required):  
  2. **Could this "possibility of being wrong" come *entirely* from outside the LLM? (e.g., designers/users penalising errors, but the LLM internally "doesn’t care").**  
     - **Yes → Go to 3**  
       *(Normativity—being "supposed to" get things right—can be imposed externally.)*  
     - **No →** **Position: Internalist Biosemantics**  
       - *The LLM’s symbols are ungrounded.*  
       - **Awkward commitment:** LLMs lack intrinsic biological goals, so *no* naturalistic grounding is possible. Meaning requires evolved teleology.  
       - *(Note: This cell is sparsely defended; most agree LLMs lack "internal goals".)*  

  3. **Does the external source of normativity (e.g., designers, users, training corpus) suffice to ground meaning *even if* the LLM’s internal processes are purely statistical?**  
     - **Yes → Go to 4**  
       *(External norms can ground meaning without the system "understanding" them.)*  
     - **No →** **Position: Functional Role Semantics (weakly named)**  
       - *The LLM’s symbols gain partial meaning from conceptual role.*  
       - **Awkward commitment:** Meaning is fragmentary ("cat" links to "mat" but not real cats) and degrades under scrutiny.  
       - *(Note: Unattractive to many, as it avoids core questions of reference.)*  

  4. **When the LLM says "cat," is the *primary* thing grounded the word itself, the LLM as an agent, or the social practice it’s embedded in?**  
     - **The word (symbol) itself →** **Position: Designer-Externalism**  
       - *"Cat" refers via causal chain from designers’ intentions (e.g., training data labels).*  
       - **Awkward commitment:** A broken thermometer "means" temperature if designed so—even if non-functional.  
     - **The LLM as an agent →** **Position: Standard Teleosemantics**  
       - *Meaning requires proper function (e.g., "detecting cats" is its evolutionary role).*  
       - **Awkward commitment:** Designers must confer "proper function"—but LLMs lack evolutionary history, making this metaphorical.  
     - **The social practice →** **Position: Corpus-Grounded Pragmatism**  
       - *Meaning emerges from use in communicative practices (training/user interactions).*  
       - **Awkward commitment:** "Cat" means whatever sustains successful dialogue—even if users hallucinate cats.  

  ---

  #### If NO (misrepresentation possibility not required):  
  5. **Could "cat" mean something *only* if it connects to the LLM’s abilities (e.g., predicting text, assisting users), even with no link to actual cats?**  
     - **Yes → Go to 6**  
       *(Meaning is "practically grounded" in action, not reference.)*  
     - **No → Go to 8**  
       *(Meaning requires *some* link to external reality, even indirect.)*  

  6. **Is this "practical grounding" sufficient for *full* meaning, or just a functional placeholder?**  
     - **Sufficient for full meaning →** **Position: Neo-Pragmatism (your flatmate’s view)**  
       - *"Cat" is grounded in what the LLM (or its users) *do* with the word (e.g., evoke images, solve tasks).*  
       - **Awkward commitment:** Reference dissolves—"unicorn" is as meaningful as "cat" if used effectively.  
     - **Just a placeholder →** **Position: Instrumental Fictionalism**  
       - *LLMs simulate meaning via practical competence, but symbols are inherently empty.*  
       - **Awkward commitment:** We must treat LLMs "as if" they mean things, knowing it’s a useful pretence.  

  ---

  #### If NO to practical grounding (from 5):  
  8. **Can meaning arise from *any* reliable causal link between word and world (e.g., "cat" tokens correlate with cat-mentions in text), even without normativity?**  
     - **Yes →** **Position: Informational Semantics**  
       - *"Cat" means cats because tokens covary with cat-related data.*  
       - **Awkward commitment:** Weathervanes "mean" wind direction—but nobody calls this linguistic meaning.  
     - **No → Go to 9**  

  9. **Must the link involve the *wider speech community’s* use (e.g., "cat" is grounded because *humans* refer to cats), not just the LLM’s design?**  
     - **Yes →** **Position: Social Externalism**  
       - *Meaning is inherited from collective human practice (the "form of life" the LLM approximates).*  
       - **Awkward commitment:** Isolated systems (e.g., future rogue AI) couldn’t mean anything.  
     - **No →** **Position: Unnamed (incoherent?)**  
       - *Rejected: If normativity and world-links are needed but can’t come from designers, corpus, or society, no coherent source remains for LLMs.*  
       - *(Note: Unattractive and unexplored; implies LLMs are magical.)*  

  ---

  ### Notes on the Tree  
  - **Distinctions blurred:** "Neo-Pragmatism" (6) and "Corpus-Grounded Pragmatism" (4) only fully separate if you require *embodied* practice. The tree can’t resolve this without adding questions about physical interaction.  
  - **Unnamed/unattractive cells:**  
    - **Internalist Biosemantics (2→No):** Unattractive—denies meaning to any artefact without evolved goals.  
    - **Functional Role Semantics (3→No):** Unattractive—meaning becomes "cheap" and non-referential.  
    - **Incoherent cell (9→No):** Logically possible but unexplored; requires mysterious normativity.  
  - **Practical vs. Referential Grounding:** The tree explicitly captures your flatmate’s view (Neo-Pragmatism, 6) as denying referential grounding but accepting practical grounding.  
  - **Gradation:** All positions imply grounding is gradational *except* Internalist Biosemantics and Teleosemantics, which treat it as all-or-nothing.  

  ---  
  This tree isolates key fault lines in the debate. To use it, have readers answer each question honestly (without peeking at outcomes) to find their position. The "awkward commitments" prevent easy escapes—each view pays a price.
