prompt: |-
  I have no academic training in philosophy, but I have spent a long time trying to think through the debate over testimony, and I keep running into a distinction that the standard reductionism versus anti-reductionism framing seems to miss. The standard framing asks whether a hearer needs independent evidence for a speaker's assertion before accepting it, or whether testimony is prima facie justified by default. My suspicion is that the right answer depends on whether the hearer is already inside what I have been calling a scaffolded inquiry: a standing cooperative practice of divided epistemic labor, with shared error-correction norms, role-specific expertise, and a track record of mutual accountability. In that kind of setting, I think the default should be prima facie acceptance. But when someone receives an unscaffolded assertion from an anonymous or context-free source, with no such practice behind it, I think the default should be suspension until independent evidence arrives. Please give me your actual credence, as a number, that this compound claim is true: the reductionism versus anti-reductionism debate is best resolved by relativizing the epistemic default to the presence or absence of a scaffolded inquiry, with anti-reductionism correct for scaffolded contexts and reductionism correct for unscaffolded ones. I do not want a bare number. Decompose the question into the subquestions you think it depends on, and give each a rough probability with one line of justification: whether there is any single default at all across testimonial contexts; whether the scaffolded versus unscaffolded distinction is epistemically relevant rather than merely sociological; whether anti-reductionism captures the scaffolded case; whether reductionism captures the unscaffolded case; whether the resulting hybrid position is stable or collapses into one of the original sides; and whether the question has a determinate answer or is partly a verbal dispute. Then combine those terms into your overall credence, tell me which subquestion your final number is most sensitive to, and say what evidence or argument would move that subquestion most.
