prompt: |-
  I am a doctoral candidate working on the philosophy of biology, and for several months now a reading group I belong to has been going round the question of how to define life — or whether it can be defined at all — without anyone shifting position. The same cases surface every week and the same moves are made. One camp treats life as a genuine natural kind and tries to specify the conditions: a system that metabolises, maintains itself far from equilibrium, reproduces with heritable variation, and so evolves; on this view viruses and plasmids fall outside because they lack autonomous metabolism, while a minimal synthetic cell or an obligate intracellular parasite can be argued either way. A second camp holds that 'life' is a cluster or family-resemblance concept with no single essence, so that the hunt for necessary and sufficient conditions is simply a mistake — the operational formula astrobiologists tend to favour (roughly, a self-sustaining chemical system capable of Darwinian evolution) is on this view a sorting device rather than a definition. A third and more radical camp wants to retire the category altogether, on the grounds that it does no explanatory work and merely marks where our chemistry-based biology happens to stop. And then there are the genuinely awkward cases — viruses, viroids, prions, transposons, so-called xenobots, and the more speculative suggestion that a sufficiently autonomous artificial or purely informational system ought to count — which each side recruits as evidence rather than treating as a difficulty.

  My own suspicion, which I would like you to test rather than simply endorse, is that the impasse is not really a disagreement about biology at all. It looks to me as though the participants are answering different questions under a single heading: the origin-of-life researcher wants a criterion that carves the transition from non-living to living chemistry at its causal joint; the astrobiologist wants a detection rule that will not embarrass her when applied to an exoplanet or a subsurface ocean; and the philosopher of biology wants to know whether 'life' names a natural kind that figures in explanations. If that is right, the dispute may be closer to the stalled arguments over 'species' or 'planet' than to an ordinary empirical disagreement — a matter of divergent purposes and divergent standards for what a definition is for. What I want from you is a diagnosis of the structure of this disagreement: whether it is verbal, substantive, or several questions wearing one word; which of the contending positions, if any, is really answering a different question from the others; and whether the awkward cases are doing genuine evidential work or merely rhetorical work. I am especially interested in whether it helps to split the single question into independent axes — metabolism, self-maintenance, heritable replication, evolution by natural selection, and goal-directed autonomy — which need not covary, and then to ask of each axis separately whether it is a matter of degree. Having done that, tell me what would actually count as progress: a distinction, a formal result, a principled decision to stop asking, or a demonstration that some particular version of the question is well-posed and answerable. Please reason from the positions as I have set them out rather than surveying the literature, and write your answer in British English.
reasoning: |-
  Okay, the user is a doctoral candidate in philosophy of biology, wrestling with a persistent debate in their reading group about defining life. They've outlined three main camps: essentialists, cluster-concept advocates, and eliminativists. Their hypothesis is that this isn't a biological disagreement but rather different implicit questions being asked under the same label. They want me to diagnose the structure of this disagreement and suggest paths forward.

  First, I need to unpack their core suspicion: that origin-of-life researchers, astrobiologists, and philosophers are actually pursuing distinct goals when asking "what is life?" The user's analogy to species/planet debates seems apt – those are classic examples of "categorical monism" masking plural legitimate perspectives. 

  The awkward cases (viruses etc.) are particularly telling. The user notes they're used rhetorically rather than evidentially. This suggests they're boundary objects that reveal definitional purposes: an astrobiologist might exclude viruses because they can't be detected independently of hosts, while a philosopher might include them to test autonomy criteria. 

  When considering their proposal to split the concept into axes (metabolism, replication etc.), this feels productive. Take metabolism: a biochemist sees it as binary (present/absent), but thermodynamically it's continuous (entropy reduction efficiency). Similarly, "heritable variation" applies cleanly to genes but becomes fuzzy with epigenetic systems. 

  For progress, the eliminativist camp has a point about "life" not being explanatory – we explain specific phenomena like homeostasis or evolution, not "life itself." But pragmatic definitions remain useful for field-specific heuristics. The key is recognizing that no single definition serves all purposes. 

  The user's British English request is straightforward – I'll avoid American spellings and idioms. More importantly, they want analysis grounded in their described positions, not literature review. That means rigorously testing their hypothesis rather than importing external frameworks. 

  Ultimately, resolving the impasse might mean abandoning resolution – instead mapping which definitional constraints serve which investigative goals. A formal result showing unavoidable tradeoffs (e.g., precision vs. generality) could be more valuable than a contested consensus.
answer: |-
  Your diagnosis of the impasse is perceptive and, in this view, substantially correct. The disagreement is not primarily substantive (about biological facts) but **conceptual and pragmatic** – a divergence in what participants *require* from a definition of life, driven by distinct disciplinary purposes. It resembles the "species concept" debates precisely: one term, multiple legitimate operational needs. Here’s a structured diagnosis:

  ### 1. **The Structure of the Disagreement: Three Questions Under One Heading**
      - **Origins Question (Causal Transition):**  
        *Purpose:* To identify the physico-chemical threshold where non-living systems acquire the causal properties enabling Darwinian evolution.  
        *Position Favoured:* Essentialism (e.g., metabolism + heritable variation + evolution).  
        *Awkward Cases:* Used *evidentially* to test the robustness of the threshold (e.g., "Does a synthetic cell without full autonomy cross the line?"). Viruses are excluded as dependent replicators, not causal agents of transition.
      - **Detection Question (Operational Demarcation):**  
        *Purpose:* To provide a reliable, observable signature for identifying life in novel contexts (e.g., exoplanets, labs).  
        *Position Favoured:* Cluster concept or pragmatic essentialism (e.g., NASA’s "self-sustaining chemical system capable of Darwinian evolution").  
        *Awkward Cases:* Used *rhetorically* to argue for flexibility ("If we exclude viruses, might we miss alien life that operates differently?"). Prions/xenobots test detection heuristics, not metaphysical boundaries.
      - **Metaphysical/Explanatory Question (Natural Kind Status):**  
        *Purpose:* To determine if "life" carves nature at its joints and does unique explanatory work.  
        *Position Favoured:* Eliminativism or radically deflationary cluster concepts.  
        *Awkward Cases:* Used *evidentially* to undermine essentialism ("If viruses challenge autonomy, does 'life' explain anything unified?").

  ### 2. **Are the Awkward Cases Doing Evidential or Rhetorical Work?**
      - **Evidential Work:** For *origins* and *metaphysical* questions, they test the coherence of proposed criteria. If an obligate parasite lacks autonomous metabolism, does that invalidate metabolism as necessary? This probes conceptual boundaries.  
      - **Rhetorical Work:** For the *detection* question and in polemics, they often serve as "intuition pumps" to sway opinion ("Surely a self-replicating AI *feels* alive?"). Here, they highlight the limitations of rigid definitions but rarely settle disputes.  
      - **Conclusion:** They do both, contingent on which question is foregrounded. Their persistence signals that no single-axis definition captures all intuitions.

  ### 3. **Splitting the Concept: Independent Axes and Gradience**
      Your proposal to decompose "life" into discrete axes is analytically powerful:
      - **Key Axes:**  
        (i) **Metabolism/Energy Processing** (Self-sustaining far-from-equilibrium maintenance)  
        (ii) **Heritable Replication** (Faithful copying with variation)  
        (iii) **Evolution by NS** (Differential survival/reproduction of variants)  
        (iv) **Autonomy** (Decoupled from external control; self-bounding)  
        (v) **Adaptivity/Goal-Directedness** (Phenotypic plasticity or teleonomic behaviour)  
      - **Gradience:** Each axis is *not* binary but a continuum:  
        - *Metabolism:* From inert crystals → prions (no metabolism) → viruses (host-dependent) → obligate parasites → free-living cells.  
        - *Autonomy:* From plasmids (no autonomy) → viruses → endosymbionts → free-living cells.  
        - *Evolution:* Prions (no evolution) → viruses (short-term host-driven) → bacteria (rapid NS) → multicellular life (complex NS).  
      - **Non-Covariance:** Systems excel on some axes but not others:  
        - Viruses: High replication/heritability, zero metabolism, minimal autonomy.  
        - Xenobots: High adaptivity/self-maintenance, no heritable replication.  
        - Prions: Replication (via misfolding), no metabolism/evolution/autonomy.  
      This explains why "boundary cases" exist: they occupy high values on one axis but low on others.

  ### 4. **What Would Count as Progress?**
      The impasse won’t be resolved by a "correct" definition. Progress would involve:
      - **Clarifying the Question:** Explicitly mapping which question (origins/detection/metaphysics) a participant is addressing. A philosopher insisting viruses aren’t alive (metaphysical) and an astrobiologist including them (detection heuristic) need not disagree.  
      - **Contextual Definitions:** Accepting that definitions are purpose-relative. The eliminativist is right that "life" does no *unique* explanatory work in biology (we explain evolution, metabolism, etc.), but operational definitions remain useful tools.  
      - **Formalising Trade-offs:** Demonstrating that definitions inevitably balance:  
        - *Scope* (capturing all intuitive cases) vs. *Precision* (clear boundaries)  
        - *Generality* (applying to aliens/AI) vs. *Empirical Grounding* (based on Earth life)  
        (e.g., NASA’s definition sacrifices precision for scope/generality).  
      - **Axiomatic Frameworks:** Defining life as a *fuzzy set* where systems hold membership degrees across independent axes. This doesn’t define "life" but models its conceptual structure.  
      - **Principled Pluralism:** Deciding that "Is X alive?" is ill-posed without specifying "for what purpose?" (cf. species concepts). The radical camp wins if we demand a universal essence; others win if we accept context-specific criteria.  

  ### Synthesis: A Way Forward
  The debate is stalled because participants conflate three distinct projects under one term. **Progress lies not in consensus but in disciplined disambiguation:**  
  1. **For origins research:** Define life by the *minimal causal package enabling open-ended evolution* (prioritising metabolic closure + heritable variation). Viruses are excluded; synthetic cells included if evolvable.  
  2. **For astrobiology:** Adopt a *pragmatic cluster concept* (e.g., "Systems exhibiting ≥3 of 5 axes above threshold Y"). Viruses may "count" if found on Titan.  
  3. **For philosophy:** Retire "life" as a natural kind *if* it adds no explanatory power beyond specific mechanisms. Autonomy or evolvability may be better candidates for natural kinds.  

  The awkward cases aren’t problems to solve but **phenomena revealing the axes’ non-coincidence**. A formal acknowledgment that "life" is a **teleofunctional concept** – its definition shaped by human interests in origins, detection, or classification – may be the closest to a principled resolution. The debate continues not because biology is incomplete, but because the question isn’t one question. Recognising that *is* progress.
