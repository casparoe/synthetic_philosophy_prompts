answer: |-
  ### **Lottocracy vs. Election Activity: Full Build**  
  **Goal:** Simulate how random selection ("lot") vs. election shapes deliberation and outcomes, focusing on the "blind break" (inability to campaign for a lot position) and the competence objection.  

  **Core Mechanics:**  
  - **Election Body:** Members chosen *after* a campaign period. This forces candidates to make promises, shaping what’s said publicly before selection.  
  - **Lot Body:** Members chosen *randomly with no warning*, preventing campaigning. Deliberation starts with no pre-commitments.  
  - **Fair Comparison:** Simple, concrete decision task where both bodies have equal access to information, and outcomes are scored objectively to avoid bias.  
  - **Stakes:** $20 snack fund allocation (real money) – the winning body’s decision is implemented.  

  **Why This Design?**  
  1. **Blind Break Highlighted:** By running the lot selection *before* any campaigning (and with no warning), participants experience why campaigning is impossible for random roles. The election body’s campaign forces strategic speech, while the lot body’s discussion starts "cold."  
  2. **Competence Objection Addressed Fairly:** The decision task (allocating money to fictional charities) requires weighing trade-offs (e.g., lives vs. education), not expertise. Both bodies receive identical info, so competence isn’t about knowledge but deliberation quality. Scoring is based on logical consistency, not "right answers."  
  3. **Order Matters:** Lot selection happens *first* to preserve the blind break. If election happened first, campaign rhetoric could contaminate the lot body’s deliberation.  

  ---

  ### **1. Materials List**  
  - **Divider** (to split the room into two halves).  
  - **Timer** (visible to all).  
  - **Charity cards** (3 cards per body, each describing a charity – see below).  
  - **Voting slips** (for election).  
  - **Two hats**: One for drawing lots, one for final coin flip.  
  - **18 name slips** (for random selection).  
  - **Flipcharts/markers** (one per body for deliberation notes).  
  - **Payoff cards** (for scoring, 1 per body – see below).  
  - **Coin** (for deciding which body’s outcome is implemented).  
  - **$20 cash** (from snack fund).  

  **Charity Cards (print 3 sets – 1 for each body + 1 for facilitator):**  
  > **Charity A: Clean Water Initiative**  
  > - Prevents waterborne diseases in rural areas.  
  > - Cost: $1,000 provides clean water for 50 people for 1 year.  
  > - Impact: Saves lives; reduces child mortality.  
  >  
  > **Charity B: Digital Literacy Fund**  
  > - Provides tablets and internet access to remote schools.  
  > - Cost: $500 trains 10 teachers; $1,000 buys 5 tablets.  
  > - Impact: Improves education access; long-term economic benefits.  
  >  
  > **Charity C: Food Security Network**  
  > - Distributes emergency food packages in drought zones.  
  > - Cost: $20 feeds a family for 1 week; $1,000 feeds 50 families.  
  > - Impact: Immediate hunger relief; supports farmers.  

  **Payoff Cards (print 2 – one for each body):**  
  > **Scoring Rules:**  
  > 1. **Impact Score (0-10):** How well does your allocation maximize lives saved + education access + hunger relief? (1 point per $100 allocated logically)  
  > 2. **Fairness Score (0-5):** Is the money split fairly across charity goals? (e.g., all $ to one charity = 0; balanced = 5)  
  > 3. **Defense Score (0-5):** Can you justify your choice in 60 seconds? (Clear = 5; vague = 0)  
  > **Total Score = Impact + Fairness + Defense (max 20). The body with the higher score wins the $20 for their charity choice.**  

  ---

  ### **2. Exact Rules for Both Bodies**  
  **Decision Task:** Allocate $1,000 (hypothetical) across the 3 charities. Must decide:  
  - How much $ to each charity (total must = $1,000).  
  - Why this allocation is best (prepare a 60-second defense).  

  **Key Structural Differences:**  
  - **Lot Body:**  
    - Selected by random draw *before* anyone speaks about the task.  
    - Deliberates with no prior discussion or commitments.  
  - **Election Body:**  
    - Selected *after* a public campaign where candidates speak.  
    - Deliberates with potential pressure to fulfill campaign promises.  

  **Selection and Deliberation Order:**  
  1. **Lot Body selected first (no warning):** Preserves blind break.  
  2. **Election Body campaign + selection:** Forces public promises.  
  3. **Deliberation:** Both bodies deliberate simultaneously.  

  **Full Rules:**  
  - **Lot Body Rules:**  
    - 9 members drawn randomly from a hat (all 18 names in hat).  
    - No one may speak about the charities or allocation before selection.  
    - Once selected, move to one side of the room (behind divider) and receive charity cards + payoff card.  
    - Deliberate for 30 minutes. Must agree on allocation and defense.  
  - **Election Body Rules:**  
    - Open nominations: Anyone can be a candidate (2-minute campaign speeches).  
    - Speeches must include: "How I would allocate the $1,000" (forces promises).  
    - All 18 vote by approval voting (each voter checks up to 9 names; top 9 vote-getters win).  
    - Winners move to the other side of the room (behind divider), receive charity cards + payoff card.  
    - Deliberate for 30 minutes. Must agree on allocation and defense (may conflict with campaign promises).  

  ---

  ### **3. Timeline (90 Minutes Total)**  
  **0–5 min: Introduction (Facilitator)**  
  - "We’re doing a decision-making activity. $20 from our snack fund will be donated to a real charity based on the outcome. Your task: Allocate $1,000 (hypothetical) across 3 charities to maximize impact and fairness. Two groups will decide separately."  
  - **Do NOT mention lot/election yet.** If someone says, "This is about sortition!" respond: "We’ll discuss the methods afterward – for now, focus on the task."  

  **5–10 min: Lot Body Selection**  
  - Draw 9 names from a hat. Say: "Group 1: These 9 people will decide together. Move behind the divider – here are your charity cards and rules."  
  - Assign a flipchart/markers to them.  

  **10–25 min: Election Body Campaign + Selection**  
  - Open nominations: "Anyone can be a candidate. You have 2 minutes to give a speech on how you’d allocate the $1,000."  
  - Speeches (max 8 candidates to fit time; if >8, lottery for speaking slots).  
  - Voting: Distribute slips; voters approve up to 9 candidates. Count votes publicly; top 9 form the body.  
  - Say: "Group 2: Move behind the divider. Here are your charity cards and rules." Assign flipchart/markers.  

  **25–55 min: Deliberation (30 min)**  
  - **Facilitator role:** Set timer. Do NOT intervene unless:  
    - Time updates ("10 minutes left").  
    - One body dominates ("Let’s hear from others").  
    - Groups stray ("Focus on allocation and defense").  
  - **Lot Body:** Watch for "cold start" – they may struggle initially but often have freer discussion.  
  - **Election Body:** Watch for "promise inertia" – members may feel locked into campaign speeches.  

  **55–65 min: Decisions and Scoring**  
  - Both bodies return to main room.  
  - Each body shares:  
    - Their allocation (e.g., "$500 to A, $300 to B, $200 to C").  
    - 60-second defense (one speaker).  
  - **Facilitator scores publicly** using payoff card rules (be strict: e.g., $200 to Charity A = 2 Impact points).  

  **65–70 min: Payoff Resolution**  
  - Compare scores. The higher-scoring body wins.  
  - If tie: Flip a coin.  
  - Announce: "$20 goes to [Charity] chosen by the winning body." (Hand $20 to a member to mail later.)  

  **70–90 min: Debrief (20 min)**  
  - Follow the script below.  

  ---

  ### **4. Debrief Script (20 Min)**  
  **Goal:** Map the activity to real-world claims. **Do NOT say "sortition/lottocracy" until the end.**  

  | Time | Facilitator Question/Prompt                                                                 | Links to Real Claims                                                                                                |
  |------|---------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------|
  | 70   | "Group 1 (lot), describe your deliberation. Did you feel pressure to defend past statements?" | **Blind Break:** No campaigning meant no pre-commitments. People could change minds freely.                                      |
  | 73   | "Group 2 (election), how did campaign speeches affect your discussion? Did promises help/hurt?" | **Elections' Flaw:** Campaigning forces strategic speech ("say what gets votes"), locking in positions early.                       |
  | 76   | "Did Group 1 (lot) feel less competent? Why or why not?"                                    | **Competence Objection:** Competence isn’t about expertise – it’s about diverse perspectives + deliberation. Lot bodies often compensate via discussion. |
  | 79   | "How representative was each group? Could everyone’s voice be heard?"                       | **Descriptive Representation:** Lot bodies mirror the population (random sample). Elected bodies skew toward confident speakers.            |
  | 82   | "What would happen if we did this 100 times? Would outcomes differ?"                        | **Structural Difference:** Lot prevents lobbying/ambition; elections favor those who campaign best, not deliberate best.          |
  | 85   | **Reveal terms:** "This was lot vs. election. In real life, lottocracy uses random selection ('sortition') to avoid campaign distortions." | **Key Insight:** The blind break changes what people say *before* decisions. Competence isn’t settled – it needs robust deliberation. |
  | 88   | "What’s the strongest case *against* using this in real life?" (Let them wrestle with competence.) | **Honest Engagement:** Forces the group to confront trade-offs (descriptive reps vs. expertise).                                  |

  ---

  ### **5. What Goes Wrong + Recovery**  
  - **Problem:** Someone says, "This is rigged to make the lot body win!"  
    - **Recovery:** "Scores are based on your logic, not the outcome. Let’s see how the defense holds up."  
  - **Problem:** Election body deadlocks over campaign promises.  
    - **Recovery:** Remind them: "You can change your mind; focus on the payoff card criteria."  
  - **Problem:** Lot body is chaotic or defers to "experts."  
    - **Recovery:** Ask: "Did anyone dominate? How could you improve the process?" (Use in debrief to discuss competence.)  
  - **Problem:** Both bodies make similar allocations (likely with n=9).  
    - **Recovery:** Focus debrief on *how* they decided, not the outcome. "Did the election body feel constrained?"  

  ---

  ### **6. The Frank Bit: What This Activity Can’t Capture**  
  - **Scale/Complexity:** This simulates a micro-decision. Real lottocracy requires large, stratified samples and multi-day deliberation to handle complex policies. You’ll need to say:  
    > *"In real life, the competence objection is about scaling up. A one-off lottery group might not handle a national budget. But real sortition uses large pools (e.g., 500 people), expert advisors, and weeks of deliberation – which we can’t replicate here. The point is: the* structural *difference (blind break) changes incentives from day one, and that’s what we simulated."*  

  **Run this as-is.** The blind break will feel tangible, the scoring forces fairness, and the debrief makes the theory visceral. Let me know how it goes!
