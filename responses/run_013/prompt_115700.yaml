  Here’s a polished, runnable activity based on your sketch, designed to fit 90 minutes, with materials, timing, adversarial cases, and debrief. The goal is to make the **unprovability of the Church-Turing thesis** tangible by exposing the gap between informal intuition ("mechanical procedure") and formal systems.

  ---

  ### **Activity: The Clerk's Rulebook Challenge**
  **Core Idea**: Students discover that diverse formal systems (register machines, string rewriting) converge on the same computations, but struggle to define "mechanical" in a way that excludes magical oracles without circularity.

  ---

  ### **Materials & Setup**
  1. **Two "Offices" (Groups)**:
     - **Group A (Register Clerks)**: 
       - *Rulebook*: 
         - "You are clerks who manipulate numbers. You have a notepad with 3 registers (R0, R1, R2). Rules:  
           - `INC r` (add 1 to register `r`)  
           - `DEC r` (subtract 1 from `r`, if `r` > 0)  
           - `JZ r, LABEL` (if `r` = 0, jump to `LABEL`)  
           - `HALT` (stop)."
       - *Jobs* (written on cards):
         - Double a number: Input `R0 = 2` → Output `R1 = 4`.
         - Check if even: Input `R0 = 3` → Output `R1 = 0` (odd) or `1` (even).
         - Add numbers: Input `R0 = 2`, `R1 = 3` → Output `R2 = 5`.

     - **Group B (String Clerks)**:
       - *Rulebook*: 
         - "You are clerks who manipulate symbols. You have a paper strip (tape) with symbols (e.g., `1`, `0`, `#`). Rules:  
           - Scan left/right until you see `X`.  
           - Replace `X` with `Y`.  
           - Add/remove `Z` at the end.  
           - Jump to step `N` if you see a blank (`_`).  
           - `HALT` (stop)."
       - *Jobs* (same as Group A, but symbolically):
         - Double: Input `111` (3 tallies) → Output `111111` (6 tallies).
         - Check if palindrome: Input `101` → Output `1` (yes); `100` → `0` (no).
         - Add: Input `11#111` (2 + 3) → Output `11111` (5).

  2. **Shared Materials**:
     - Worksheets for jobs (with input/output examples).
     - Paper, pens, scissors (for String Clerks to simulate tape).
     - Timer.

  3. **Adversarial Clerk Cards** (for Part 2):
     - "Oracle Clerk: Has a magic phone answering any yes/no question instantly (e.g., ‘Is this prime?’)."
     - "Non-Erasure Clerk: Can write new symbols but NEVER erase/modify existing ones."
     - "Parallel Clerk: 50 hands working simultaneously on different parts of the problem."
     - "Coin-Flip Clerk: Decides by flipping a coin. If stuck, restarts and tries a new random path."
     - "Lookup Clerk: Has an infinite book with answers to every possible input."

  ---

  ### **Timing Breakdown** (90 min total)
  1. **Intro & Setup (5 min)**:
     - *"Today, you're clerks solving jobs with strict rulebooks. No lectures—just dive in."*
     - Split into Group A (Register) and Group B (String). No inter-group communication.

  2. **Part 1: Running Jobs (35 min)**:
     - Groups work on their jobs using rulebooks (15 min).
     - Rotate jobs so all are attempted (20 min).  
       *Predictable issues*:  
       - String Clerks struggle with palindromes (need creative rewriting).  
       - Register Clerks get stuck on conditionals (e.g., even/odd uses loops).  
       *Salvage*: Provide hints like *"Try a loop that removes symbols two at a time"* (String) or *"Use a register to count parity"* (Register).

  3. **Part 2: Convergence Discussion (10 min)**:
     - Groups reunite. Compare results:  
       *"You all solved doubling, addition, and palindromes? How did your rules differ?"*  
       - Register Clerks: Math-like steps.  
       - String Clerks: Pattern-matching.  
       - **Key realization**: Different rules, same results. *Feels like evidence for a deep pattern.*

  4. **Part 3: Defining "Mechanical" (30 min)**:
     - *"Now, imagine a clerk who can do ANYTHING—guess, phone a friend, use infinite books. Your task: Write a rule defining which clerks are ‘mechanical’ (no magic!)."*  
     - Groups draft a definition (5 min).  
       *Predictable definitions*:  
       - *"No external help, just step-by-step rules."*  
       - *"No randomness or intuition."*  
     - **Spring adversarial clerks** (in this order, 20 min):  
       1. **Oracle Clerk**: Challenges *"no external help"* (is a phone "external" if built-in?).  
       2. **Non-Erasure Clerk**: Challenges *"step-by-step rules"* (is non-erasable computation mechanical? It’s weaker than Turing machines!).  
       3. **Parallel Clerk**: Challenges *"step-by-step"* (parallelism feels mechanical but violates sequential steps).  
       4. **Coin-Flip Clerk**: Challenges *"no randomness"* (randomness can be simulated mechanically).  
       5. **Lookup Clerk**: Challenges *"no infinite resources"* (what if the book was built mechanically?).  
     - **Facilitation**: After each clerk, ask: *"Does your definition allow this? If not, revise it."* Students will oscillate between vagueness (*"no cheating"*) and circularity (*"mechanical means machine-like"*).

  5. **Debrief (10 min)**:
     - Reveal the Church-Turing thesis:  
       - *"You experienced why it can’t be proved. The left side—‘mechanical procedure’—is informal intuition. The right side—Turing machines, string rewriting—is formal. No definition captures the intuition perfectly."*  
     - Map the activity to the thesis:  
       - **Convergence as evidence**: Register and String Clerks computed the same functions (like how λ-calculus/Turing machines/recursive functions all converge).  
       - **Unprovability**: Adversarial clerks showed definitions are either too narrow (banning parallelism) or too broad (allowing oracles).  
       - **Epistemic status**: The thesis is a claim about *physical reality* (what humans can compute), supported only by failure to find counterexamples.  
     - **Limitations of the activity**:  
       - Doesn’t cover *why* all formal systems converge (e.g., equivalence proofs).  
       - Doesn’t address hypercomputation (e.g., infinite-time machines).  
       - *You’ll need to add*: A 5-min mini-lecture post-activity on the historical consensus (Post, Turing, Church) and physical versions of the thesis.

  ---

  ### **Why This Works**
  - **Experiential gap**: Students *feel* the frustration of formalizing "mechanical" more than they would in a lecture.
  - **Adversarial order**: Starts with obvious cheats (Oracle), moves to edge cases (Non-Erasure), ends with traps (Lookup). Forces refinement into dead ends.
  - **Predictable "Aha!"**: When students say, *"Mechanical means a machine could do it!"*, they see the circularity instantly.
  - **Salvage path**: If Part 3 stalls, use the **Coin-Flip Clerk** to pivot: *"If randomness can be simulated deterministically, is it still mechanical?"* (Yes—per Turing’s randomness lemma).

  ### **Output Materials**
  - [Register Machine Job Sheet](https://example.link/register-jobs)  
  - [String Rewriting Job Sheet](https://example.link/string-jobs)  
  - [Adversarial Clerk Cards](https://example.link/adversarial-cards)  

  This activity distills 100 years of computability theory into an adversarial game. Students leave understanding that the Church-Turing thesis isn’t math—it’s a claim about the universe, defended by the collapse of all alternatives.
