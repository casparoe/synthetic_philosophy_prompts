  ## Welcome to St. Anselm's-in-the-Fields  
  *A Peculiar Sort of Parish*

  **A Note from Vicar Martin Thorne:**

  Dear Friend,

  Welcome, and thank you for stepping through our (slightly warped) door. St. Anselm’s is, above all else, a community attempting to live in a certain way. We gather, we sing old words, we tend the graves, we worry about the boiler, and we try, however falteringly, to orient our lives around something deep and quiet – what some might call God. We don’t claim special access to hidden facts about the universe. Frankly, if you’re looking for airtight arguments proving God’s existence, you might find the pamphlets at St. Barnabas’ down the road more convincing (lovely biscuits there, too). What we *do* offer is a shared picture, a way of seeing the world and our place in it, that shapes everything from how we face death to how we run the jumble sale. It’s less like holding a debated opinion and more like learning a dance – the steps only make sense once you’re moving. It’s groundless, yes, but not weightless. Come and see how we go on. And do sign up for the churchyard rota; the ivy is terribly ambitious.

  Warmly,  
  Vicar Martin

  ---

  **Newcomers’ Curiosities (FAQ):**

  1.  **“So, Vicar… does God actually *exist*?”**  
      Ah, the classic! Think of it this way: asking if God “exists” like asking if Tuesday “exists”. Tuesday isn’t a thing hiding behind the calendar; it’s the day the bin lorry comes and Mrs. Gable does the flowers. Our talk of God isn’t trying to be a scientific theory about cosmic plumbing. It’s the name we give to the gravity at the centre of this particular dance, the picture that holds our actions together – the reason we light candles for the dead, sing grateful hymns for jam, and argue passionately about the boiler fund. If I started pointing to the boiler as “proof” of God, I’d have stopped talking about God and started talking about poorly insulated pipes.

  2.  **“But what if I’m not sure I believe? Can I still come?”**  
      Absolutely, and you’ll be in excellent company, including mine most weeks. Belief here isn’t about signing off on a checklist of doctrines before you’re allowed in. It’s about the willingness to step into the dance, to try the steps, to see if this way of going on resonates. Doubt isn’t the enemy; it’s often the most honest partner. Come for the coffee, stay for the quiet, help pull up the ivy. See what the *practice* does.

  3.  **“Isn’t it all a bit… made up? Like ancient people sacrificing goats to make the rain come?”**  
      (Chuckles) Poor Frazer! He thought our forebears were just terrible meteorologists. But lighting a candle for peace isn’t like a faulty rain dance that didn’t produce a downpour. It’s not a failed experiment in atmospheric manipulation. The value isn’t in causing a measurable weather event; it’s in the *lighting*, in the standing vigil, in the shared hope embodied. It’s an expression, a gesture woven into the fabric of a life oriented towards something beyond the weather report. Its “success” isn’t measured by the barometer.

  4.  **“What about atheists? Are they just wrong?”**  
      It’s tempting to see it as a simple head-to-head match: “God exists!” vs. “No, he doesn’t!” But if what we’re doing here isn’t primarily making a claim about the universe’s furniture in the way a physicist does, then the atheist who says “There is no God” isn’t necessarily contradicting *us* in our terms. They might be rejecting the entire picture, the whole dance, finding it incoherent or unappealing. They live by a different picture, a different gravity. Trying to prove them “wrong” with evidence misses the point entirely. We’re playing different games. We can still share the village fete, of course. They usually run the tombola very efficiently.

  5.  **“Okay, but... *why*? Why do all this if you can’t prove it?”**  
      Why love? Why grieve? Why find profound meaning in a piece of music? These aren’t hypotheses we test; they’re ways of being that give our lives depth and texture and direction. This faith, this picture we try to live by, is the reason we visit the lonely, fight for justice (even imperfectly), find solace in ancient words when modern words fail, and plant bulbs we might not see flower. It’s the bedrock – though one hesitates to say ‘bedrock’ implies digging down, and we’ve agreed there’s nothing *underneath* to dig for; perhaps ‘the ground we find ourselves standing on’? – from which our actions spring. The ‘why’ is in the living of it.

  ---

  **A Response to the Glenshire Rational Inquiry Society (Re: “Clarification of St. Anselm’s Public Stance”)**

  Dear Colleagues at GRIS,

  Thank you for your thoughtful letter asking what, precisely, our congregation claims about reality. It’s a fair and important question.

  You suggest that a “belief” immune to evidence – where nothing conceivable could count for or against it – ceases to be a belief at all, becoming merely a personal mood or aesthetic preference. We take the point seriously.

  We would not, however, call it a *mood*; moods are transient. This is more like the lens through which we perceive permanence and transience. Nor is it merely a *taste*; we don’t choose it as one chooses marmalade over honey, though jam preferences do feature prominently in parish life (see sidebar).

  What we hold is a *picture* (a term we find useful) that regulates our lives. It is the framework within which our concepts of meaning, value, obligation, and hope find their place and force. It is not a hypothesis about cause and effect, which is why, as you rightly note, empirical evidence is neither sought nor applicable. Its validation lies not in correspondence with external facts, but in its power to shape a coherent, responsive, and (we hope) loving form of life. To ask “What would disprove this?” is to misunderstand the grammar of its use, much like asking what evidence would disprove the rules of chess. The rules *are* the game. Without them, it’s just pushing wood around.

  Does this mean it’s arbitrary? Not to us. It feels discovered, not invented – though we acknowledge the picture is carried by tradition and community. Does it mean it’s irrational? Only if rationality is confined to the methods of the laboratory. We find it profoundly reasonable as the foundation of our shared existence. The cost, as you perceive, is that it doesn’t engage directly on the empirical battleground where scientific hypotheses thrive and die. Its truth is of a different order – lived, enacted, confessed in the midst of jumble sales and funerals. We claim the reality of the picture in the only way it *can* be claimed: by living as if it is so.

  We hope this clarifies our stance, even if it doesn’t meet the criteria for a claim you could test in your admirable society. You remain cordially invited to the Autumn Fayre. The tombola needs staffing.

  Sincerely,  
  Vicar Martin Thorne

  ---

  **Parish Notices (This Week at St. Anselm’s)**

  *   **Boiler Fund:** £2,347.18 raised! Target: £5,000. The ancient beast rumbles. Your loose change grounds our warmth. (Donation tin by the font – a tangible expression of hope against entropy).
  *   **Autumn Jumble Extravaganza:** Sat 21st, 10am-2pm. **Donations URGENTLY needed:** Books, bric-a-brac, *good* jam jars (Mrs. P likes the hexagonal ones), wearable woolens. No broken kettles, please. (Why? Because broken kettles don’t sell, and the picture demands we value our neighbour’s effort and time).
  *   **Churchyard Tidy:** **Tues 3pm.** Rota: Team Ivy (P. Carter, D. Evans), Team Paths (J. Miller, TBA). Bring gloves. Tea after. (The practical enactment of tending the ground we stand on).
  *   **Thursday Contemplation:** 7pm. Silence, candlelight, shared reading. Not problem-solving. Just being present. (Where the grammar of asking “why?” quietly shifts).
