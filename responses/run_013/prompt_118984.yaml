prompt: |-
  I run the model-review desk at a state environmental agency, and we keep getting computational models—fishery stock assessments, airshed models, groundwater contaminant transport—whose assumptions everyone knows are false: well-mixed reservoirs, constant dispersal, no adaptive behavior, linear dose-response, stationarity. My staff have science backgrounds but not modeling PhDs, we have about a week per review, and the agency director signs off on permits. We were trained to ask whether assumptions are realistic, which is a nonstarter; modelers invoke the F-twist, saying assumptions need not be realistic and predictive success is what matters, and we have no way to adjudicate. As a longtime reader of rationalist blogs and forums, I want a reusable assumption-audit procedure with explicit stop conditions, not a list of virtues. Give me the questions to ask in order about each false assumption, what counts as an adequate answer, when a false assumption is disqualifying, when it is acceptable, and when the decision must go to a values panel because it depends on what we are willing to get wrong. Build it around a distinction I find useful: load-bearing falsehoods, where the false assumption does the predictive or explanatory work and cannot be relaxed without changing the result; scaffolding falsehoods, where it simplifies the derivation but the result is robust to relaxing it; and convenience falsehoods, where it is there because the modeler was lazy or the data are missing. Say how to tell which kind you are dealing with and be honest about when the distinction collapses. Then run it on two cases: a climate-economics model that assumes a single representative consumer with perfect foresight, and an epidemiological model that assumes a well-mixed population and no behavioral response. Include one case where the procedure tells me to reject a model I would like to approve, and say what the procedure cannot do—where it is just a checklist for making a political judgment look technical.
reasoning: |-
  We are designing an assumption-audit procedure for environmental agency model reviews. The procedure categorizes false assumptions into three types: 
    1. Load-bearing falsehoods: The false assumption is critical to the model's prediction. Without it, the result would change significantly. 
    2. Scaffolding falsehoods: The false assumption simplifies the derivation, but the result is robust to relaxing it (i.e., the conclusion holds under more realistic conditions). 
    3. Convenience falsehoods: The false assumption is used because of modeler laziness or missing data, and it may or may not affect the result.

  The procedure involves asking a series of questions for each false assumption. We will define the questions, what counts as an adequate answer, and the stop conditions (i.e., when the model is acceptable, when it must be rejected, or when the decision must go to a values panel).

  ### The Assumption-Audit Procedure

  For each false assumption identified:

  1. **Question 1: Is the assumption necessary for the model's derivation?**
     - If no, then it might be a convenience falsehood. Proceed to Question 4.
     - If yes, then it might be load-bearing or scaffolding. Proceed to Question 2.

  2. **Question 2: Can the assumption be relaxed without changing the model's main conclusions?**
     - This requires evidence from the modeler (e.g., sensitivity analysis, prior work, theoretical argument).
     - If yes (robustness demonstrated), then it is a scaffolding falsehood. Then ask: **Is the robustness evidence sufficient?** (Adequate answer: sensitivity analysis over a reasonable range of the relaxed assumption, or multiple models with different assumptions leading to the same conclusion.) If so, mark as acceptable. If not, proceed to Question 3.
     - If no, then it is potentially load-bearing. Proceed to Question 3.

  3. **Question 3: Is the false assumption doing the explanatory or predictive work?**
     - Check if the model's key results depend on the specific falsehood. For example, if changing the assumption to a more realistic one (even slightly) changes the result, then it is load-bearing.
     - Adequate answer: The modeler must show that the result holds under a more realistic setting (if they claim it's not load-bearing) or explain why the falsehood is necessary and what the limitations are.
     - If the falsehood is load-bearing, then we must determine if the model is still acceptable. This leads to Question 5.

  4. **Question 4: Why is the false assumption present?**
     - If due to laziness or lack of data, then it's a convenience falsehood. We then ask: **Does the convenience falsehood materially affect the conclusions?**
     - Adequate answer: The modeler must show that the effect is negligible (e.g., via sensitivity analysis) or provide a plan to address it (if data is missing). If they cannot, then we must assess the potential impact. If the impact is large, then the model may need to be rejected or sent for further work.

  5. **Question 5: For a load-bearing falsehood, what are the implications of the falsehood?**
     - We must ask: **In what direction and by how much could the falsehood bias the results?** 
     - Adequate answer: The modeler must provide an analysis of the bias (e.g., via a simplified more realistic model, or literature on similar biases). 
     - Then, we must decide: Is the bias acceptable given the purpose of the model? This is a values question. For example, if the model is used for a permit that must be protective, then an optimistic bias (underestimating harm) might be unacceptable.

  **Stop Conditions:**
  - **Acceptable**: All false assumptions are either scaffolding (with sufficient robustness) or convenience falsehoods that do not materially affect the conclusions, or load-bearing falsehoods with an acceptable bias (as per agency values and the model's purpose).
  - **Reject**: 
    a) A load-bearing falsehood introduces an unacceptable bias (e.g., the model is known to be systematically optimistic in a way that could lead to under-protection) and cannot be corrected in the review timeframe.
    b) A convenience falsehood that materially affects the conclusions and cannot be addressed.
    c) Insufficient information to determine the type or impact of a falsehood (and the modeler fails to provide necessary analysis).
  - **Values Panel**: 
    a) A load-bearing falsehood exists and the bias is in a gray area (e.g., the direction is known but the magnitude is uncertain, and the agency must decide if the potential error is acceptable given the benefits).
    b) The model is critical and the falsehoods are such that the model might be the best available but has known flaws that require a policy trade-off.

  **How to Distinguish (and when the distinction collapses):**
  - The distinction between load-bearing and scaffolding can be tested by relaxing the assumption. However, if the model is too complex to test (e.g., no sensitivity analysis is feasible) or the modeler does not provide evidence, then we cannot distinguish and must treat it as potentially load-bearing (and thus risky). Similarly, convenience falsehoods might be hiding a load-bearing effect if not tested.

  ### Case 1: Climate-Economics Model
  **Assumption:** Single representative consumer with perfect foresight.

  **Question 1:** Is the assumption necessary? Yes, because the model uses a dynamic optimization framework that requires a representative agent.

  **Question 2:** Can it be relaxed? The modeler might argue that there are studies showing that aggregate behavior can be approximated by a representative agent (e.g., Gorman aggregation). But in climate economics, heterogeneity and myopia can matter. If the modeler shows that introducing some heterogeneity (e.g., different discount rates) does not change the optimal carbon tax significantly, then it might be scaffolding. However, without such evidence, we proceed to Question 3.

  **Question 3:** Is the false assumption doing the work? In climate policy, the representative agent with perfect foresight can lead to an underestimation of the social cost of carbon because it ignores inequality and short-termism. If the modeler cannot show that the result (e.g., the recommended carbon tax) is robust to including heterogeneous agents and bounded rationality, then it is likely load-bearing.

  **Question 4:** Not applicable because we answered yes to Question 1.

  **Question 5:** The bias: The model might underestimate the urgency of climate action (if the representative agent is too patient or too rich). If the agency's mandate is to be precautionary, then this bias might be unacceptable.

  **Verdict:** 
  - Without robustness checks, we treat it as load-bearing. The model might be rejected if the agency requires models that account for heterogeneity. Alternatively, if the modeler provides a sensitivity analysis showing that the carbon tax is robust to different assumptions about the representative agent, then it could be scaffolding and acceptable. 
  - In the absence of such evidence, and given the potential for underestimating costs, we might reject the model. However, if this model is the best available and the agency must make a decision, then it goes to a values panel to decide if the potential bias is acceptable.

  ### Case 2: Epidemiological Model
  **Assumption:** Well-mixed population and no behavioral response.

  **Question 1:** Is the assumption necessary? For the derivation of the basic SIR model, yes. The differential equations assume homogeneous mixing. Behavioral response is often omitted for simplicity.

  **Question 2:** Can it be relaxed? There are extended models (e.g., network-based, spatial, or with behavior) that show similar aggregate outcomes in some cases. The modeler might provide evidence that the basic reproduction number R0 is still a useful predictor even without behavior. However, if the model is used to predict the course of an epidemic (e.g., peak timing, total infections), then behavioral responses (like social distancing) can change the outcome. Without evidence of robustness, we proceed.

  **Question 3:** Is the false assumption doing the work? In a pandemic, the well-mixed assumption can overestimate spread in sparse areas and underestimate in dense ones. Lack of behavioral response can lead to overestimation of cases if people take precautions. However, if the model is only used for relative comparisons (e.g., between interventions) and the bias is similar in all scenarios, it might be acceptable. But if the model is used for absolute predictions, then it is load-bearing.

  **Question 4:** Not applicable for the well-mixed part (it's necessary). For the behavioral response, if the modeler did not include it because of laziness or missing data, then it's a convenience falsehood. We then ask: Does it materially affect the conclusions? If the model is used for a worst-case scenario (and overestimation is acceptable) then it might be fine. But if it is used to decide on lifting restrictions, then overestimation might lead to unnecessary economic harm, and underestimation (if behavior is included and reduces spread) might lead to worse health outcomes.

  **Verdict:**
  - The well-mixed assumption might be scaffolding if the model is used for relative comparisons and the modeler shows that the ranking of interventions is robust. But without such evidence, and given the model's purpose (e.g., setting policy for a specific region with known heterogeneity), it might be load-bearing and lead to bad decisions. 
  - The behavioral response omission is a convenience falsehood that is likely material. If the modeler did not address it, we might reject the model unless the agency is willing to accept the known limitations (e.g., using the model as a worst-case tool). 
  - Example of rejection: If the model is used to approve a large public event and it assumes no behavioral change, but in reality people would avoid crowded places, then the model might overestimate the risk and lead to unnecessary cancellation. If the agency's mandate is to avoid unnecessary economic disruption, then this model might be rejected.

  ### Case 3: Example where we reject a model we would like to approve
  Consider a groundwater contaminant transport model that assumes a homogeneous aquifer (a false assumption because aquifers are layered). The model predicts that a contaminant plume will not reach a drinking well within 30 years. We would like to approve the permit for the contaminant source because the industry is important. 

  **Audit:**
  - The homogeneous assumption is necessary for the simple analytical model used.
  - The modeler did not do a sensitivity analysis on heterogeneity. 
  - We suspect that in reality, the aquifer has high-permeability layers that could speed up the plume. 
  - Without evidence of robustness, we must treat it as load-bearing. 
  - The bias: The model is optimistic (underestimating the speed of the plume). 
  - Since the agency's mandate is to protect drinking water, this bias is unacceptable. 
  - Therefore, we reject the model. 

  ### What the procedure cannot do
  - It cannot replace value judgments. When a load-bearing falsehood exists and the bias is known, the procedure flags it for a values panel. The procedure only makes the trade-off explicit.
  - It cannot create evidence. If the modeler does not provide sensitivity analyses, we have to assume the worst.
  - It cannot account for unknown unknowns. We can only audit known false assumptions.
  - It might be used as a checklist to make a political judgment look technical. For example, if the values panel always approves models from powerful industries despite load-bearing falsehoods, then the procedure is just a rubber stamp. The procedure's integrity depends on the agency's commitment to evidence and its mandate.

  ### Summary of the Procedure
  1. For each false assumption, run through the questions to classify it.
  2. If any assumption is a load-bearing falsehood with unacceptable bias, reject the model.
  3. If any assumption is a convenience falsehood that materially affects the result and isn't addressed, reject.
  4. If there are load-bearing falsehoods with uncertain or borderline bias, send to a values panel.
  5. Otherwise, accept.

  This should fit within a week per review if the modeler provides the necessary documentation (sensitivity analyses, etc.). If not, the model is rejected for insufficient evidence.
answer: |-
  Below is a reusable **assumption-audit procedure** designed for your agency's model-review desk. It prioritizes actionable questions, explicit stop conditions, and categorizes false assumptions into **load-bearing falsehoods** (critical to results), **scaffolding falsehoods** (results are robust to relaxation), and **convenience falsehoods** (laziness/data gaps). The procedure includes verification steps, decision thresholds, and acknowledges when the distinction collapses (e.g., when robustness tests are infeasible). I then apply it to your two cases and include a rejection example.

  ---

  ### **Assumption-Audit Procedure**  
  **Goal:** Determine if a false assumption is acceptable, disqualifying, or requires a values-panel escalation.  
  **Inputs:** Model documentation, sensitivity analyses, modeler justifications, and prior literature.  
  **Time constraint:** 1 week/review.  

  #### **Step 1: Categorize the False Assumption**  
  Ask these questions **in order** for each false assumption:  

  1. **Is the assumption *necessary* for the model’s key output?**  
     - **Yes** → Proceed to Q2 (load-bearing or scaffolding).  
     - **No** → It is a **convenience falsehood** (go to Step 2A).  
     - *Verification:* Check if removing/relaxing the assumption breaks the model’s derivation or core equations.  

  2. **Can the assumption be relaxed *without materially changing* the key output?**  
     - **Yes, with evidence** → It is **scaffolding** (go to Step 2B).  
     - **No or unclear** → It is **load-bearing** (go to Step 2C).  
     - *Verification:* Demand sensitivity analyses, multi-model comparisons, or theoretical proofs. "Expert judgment" alone is inadequate.  

  ---

  #### **Step 2: Assess Implications & Stop Conditions**  
  **2A: Convenience Falsehood (e.g., missing data, lazy simplification)**  
  - **Question:** *Could relaxing this assumption alter the permit-relevant output by >10%?*  
    - **Adequate answer:** Modeler provides quantified sensitivity tests showing <10% output change, or justifies irrelevance (e.g., "Well-mixing is false here, but the contaminant diffuses faster than heterogeneity matters").  
  - **Stop conditions:**  
    - **✅ Acceptable:** Output change is <10% or immaterial to the permit decision.  
    - **❌ Reject:** Output change is >10% and unquantified, or alters permit safety.  
    - **🔄 Escalate to values panel:** If the convenience falsehood hides systemic uncertainty (e.g., data gaps that could bias multiple permits).  

  **2B: Scaffolding Falsehood (e.g., simplifies math but results hold)**  
  - **Question:** *Is the robustness evidence credible and permit-specific?*  
    - **Adequate answer:** Empirical/data-driven validation (e.g., field tests), peer-reviewed robustness checks, or scenario analyses covering permit conditions.  
  - **Stop conditions:**  
    - **✅ Acceptable:** Robustness is demonstrated under conditions matching the permit (e.g., "Stationarity assumed, but model output matches data across drought/wet years").  
    - **❌ Reject:** Evidence is theoretical only, or from dissimilar contexts.  
    - **🔄 Escalate to values panel:** If robustness is plausible but unverified (e.g., modeler cites unrelated models).  

  **2C: Load-Bearing Falsehood (e.g., assumption drives the result)**  
  - **Question:** *Does the falsehood bias the output in a known direction?*  
    - **Adequate answer:** Modeler quantifies bias direction/magnitude (e.g., "Perfect foresight overestimates cost savings by 20%").  
  - **Stop conditions:**  
    - **✅ Acceptable:** Bias is conservative for the permit (e.g., overestimates pollution risk).  
    - **❌ Reject:** Bias is anti-conservative (e.g., underestimates risk) or unquantified.  
    - **🔄 Escalate to values panel:** If bias is acceptable in magnitude but conflicts with agency priorities (e.g., economic growth vs. precaution).  

  ---

  #### **When the Distinction Collapses**  
  - **Unverifiable robustness:** If sensitivity analyses are impossible (e.g., no data to test "no adaptive behavior"), treat as **load-bearing**.  
  - **Interacting falsehoods:** Multiple false assumptions may amplify errors. Demand a "whole-model" uncertainty analysis (e.g., Monte Carlo). If absent, reject.  
  - **Modeler opacity:** If the modeler invokes the "F-twist" (Friedman’s irrelevance of assumptions) without validation, reject per Step 2C.  

  ---

  ### **Case Applications**  

  #### **Case 1: Climate-Economics Model**  
  **Assumption:** Single representative consumer with perfect foresight.  
  - **Step 1:**  
    - Q1: **Yes** (necessary for tractable optimization).  
    - Q2: **Unclear** (heterogeneity and myopia often change climate policy costs). → **Load-bearing**.  
  - **Step 2C (Load-bearing assessment):**  
    - *Bias direction:* Perfect foresight **underestimates costs** of climate inaction (consumers ignore future damages).  
    - *Modeler justification:* Typically cites "aggregation theorems" (inadequate without validation).  
    - *Stop condition:* **❌ Reject** if used for permit approval (anti-conservative bias). **Escalate to values panel** if used for long-term planning and bias is acknowledged.  
  - **Why reject a liked model?** If this model approves a fossil-fuel project by underestimating social costs, it must be rejected—**bias violates the agency’s precautionary mandate**.  

  #### **Case 2: Epidemiological Model**  
  **Assumption:** Well-mixed population, no behavioral response.  
  - **Step 1:**  
    - Q1: **Yes** (core to SIR-model equations).  
    - Q2: **Yes, with evidence** → **Scaffolding** (if modeler shows similar outputs with network-based or behavioral models).  
  - **Step 2B (Scaffolding assessment):**  
    - *Robustness evidence:* Modeler compares outputs to a stochastic agent-based model with behavioral dynamics. Cases differ by <5%.  
    - *Stop condition:* **✅ Acceptable** for rapid outbreak triage (e.g., vaccine allocation). **❌ Reject** for long-term policy (e.g., lockdowns) if behavioral feedbacks are critical.  
  - **Escalation note:** If the model ignores superspreading (violating well-mixedness), it becomes **load-bearing** for high-stakes permits.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Replace values judgments:** When bias direction is known (e.g., model underestimates risk), the procedure flags it—but the values panel must decide "acceptable risk."  
  2. **Fix data gaps:** If a convenience falsehood lacks data (e.g., no measurements of fish migration), the procedure forces transparency but can’t create knowledge.  
  3. **Handle political pressure:** The procedure is a "technical filter." If the agency overrides a rejection for non-scientific reasons, the audit only makes the trade-off explicit (e.g., "We approved despite 20% underestimation of contamination risk").  
  4. **Evaluate model purpose:** A model for exploratory research might tolerate falsehoods; one for permits cannot. The procedure assumes **permit-relevance** is paramount.  

  ---

  ### **Implementation Tips**  
  - **Template questions:** Embed these questions in your review form. Demand written responses from modelers.  
  - **Stop condition triggers:** Reject models with **unquantified load-bearing falsehoods** or **>10% uncertainty from convenience falsehoods**.  
  - **Values panel mandate:** Define escalation criteria upfront (e.g., "Bias >20% and anti-conservative").  
  - **Efficiency:** Focus on assumptions most cited in literature as pivotal (e.g., stationarity in hydrology).  

  This procedure forces modelers to defend assumptions with evidence—not philosophy—and aligns with your mandate: **approving permits that are robustly safe, not just mathematically elegant**.
