prompt: |-
  I'm in a seminar on markets and morals and we just wrapped the week on "repugnant" transactions — kidney sales, water at $20 a bottle after a hurricane, paying people to vote — and the professor made us read a chunk of Aquinas on the just price, which I guess is supposed to be the ancestor of all these arguments. I can follow the gist (don't cheat people, don't charge more than a thing is worth) but there's one stretch I've reread like six times and I genuinely can't tell if I'm misreading it or if the text is just being slippery on purpose. Here it is, from the old Dominican Fathers translation, Summa Theologica II-II, q. 77, art. 1:

  "But, apart from fraud, we may speak of buying and selling in two ways. First, as considered in themselves, and from this point of view, buying and selling seem to be established for the common advantage of both parties, one of whom requires that which belongs to the other, and vice versa, as the Philosopher states (Polit. i, 3). Now whatever is established for the common advantage, should not be more of a burden to one party than to another, and consequently all contracts between them should observe equality of thing and thing. Again, the quality of a thing that comes into human use is measured by the price given for it, for which purpose money was invented, as stated in Ethic. v, 5. Therefore if either the price exceed the quantity of the thing's worth, or, conversely, the thing exceed the price, there is no longer the equality of justice: and consequently, to sell a thing for more than its worth, or to buy it for less than its worth, is in itself unjust and unlawful.

  Secondly we may speak of buying and selling, considered as accidentally tending to the advantage of one party, and to the disadvantage of the other: for instance, when a man has great need of a certain thing, while an other man will suffer if he be without it. On such a case the just price will depend not only on the thing sold, but on the loss which the sale brings on the seller. And thus it will be lawful to sell a thing for more than it is worth in itself, though the price paid be not more than it is worth to the owner. Yet if the one man derive a great advantage by becoming possessed of the other man's property, and the seller be not at a loss through being without that thing, the latter ought not to raise the price, because the advantage accruing to the buyer, is not due to the seller, but to a circumstance affecting the buyer. Now no man should sell what is not his, though he may charge for the loss he suffers."

  Take the role of someone who's taught this material for years — a medieval-ethics / history-of-just-price person — and please don't just hand me the usual summary, I can get that anywhere. I want an actually careful, almost line-by-line unpacking of what he's distinguishing in those two "ways" and why the first makes selling above worth unjust while the second makes it lawful. In particular: (a) in the first part, what is this "worth" the price has to match, and where does it come from — is it some intrinsic property of the thing? (b) in the second part, what exactly is "the loss which the sale brings on the seller," and how is that supposed to be different from the buyer's "great advantage," because the way it reads to me the second case is exactly where I'd have expected him to say the seller may NOT profit; (c) that clause "though the price paid be not more than it is worth to the owner" — what work is it doing there? And then tell me how the distinction cashes out for the hurricane-water case: does his framework actually give a determinate answer about whether the shopkeeper may charge $20, or does it leave it open? Flag anywhere you think the argument equivocates on "worth" or "advantage." Start by paraphrasing the whole passage in your own words, brainstorm a bit before you commit, and think it through step by step rather than reaching for the textbook gloss.
