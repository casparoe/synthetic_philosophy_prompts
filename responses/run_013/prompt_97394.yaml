prompt: |-
  You are a philosopher of mind specializing in the metaphysics of consciousness. Think carefully before answering, and begin by brainstorming the full range of cases a theory in this area would have to survive, so that you don't simply recite the standard menu.

  I am trying to formulate a theory of how the experiences of micro-level entities could add up to a single unified macro-level subject, and before I settle on any account I want the specification: what must an adequate theory of experiential combination deliver in order to count as a theory at all? Write the desiderata — the cases it must get right, the distinctions it cannot collapse, the background results it must not contradict — and give the consideration behind each. Please treat two commitments as candidate requirements to be argued for rather than assumed: that the macro-level subject be something over and above the micro-level subjects rather than merely identical to one of them or to their mereological sum; and that the theory not posit more subjects than the facts require. Say which requirements are non-negotiable and which are merely the preferences of one camp, and flag any pair or larger subset you suspect cannot be jointly satisfied — that is the part I most want to see. Then assess, briefly, how panpsychism, cosmopsychism, and emergentism fare against the list.

  Structure the response with these named sections, in this order: "Requirements" (the bulk of the answer — one paragraph or bullet per requirement, each with its motivating case); "Load-bearing vs. optional" (a short list sorting the requirements); "Irreconcilable pairs" (the tensions, as long as they need to be); and "Contenders at a glance" (a few sentences per view, no more).
reasoning: |-
  Okay, the user is asking me to outline the requirements for a theory of experiential combination - how micro-level experiences combine into a macro-level subject. They specifically want me to identify what an adequate theory must deliver, including non-negotiable requirements versus optional preferences. I need to carefully think through all the cases such a theory must handle.

  First, I consider the core challenge: how do micro-subjects (if they exist) combine to form a unified macro-subject like a human? The user wants desiderata - what the theory must get right. I need to cover the full range of cases beyond just the standard thought experiments. 

  For the requirements section, I brainstorm several key criteria:
  - Unification: How separate experiences become one unified field of consciousness. The binding problem is central here.
  - Subject Irreducibility: The macro-subject can't just be identical to a micro-subject or their sum. The user explicitly wants this argued, not assumed.
  - Boundary Conditions: Explaining why combination happens in some systems (brains) but not others (sand piles).
  - Preservation: Accounting for changes in experience during combination without eliminating micro-level experiences entirely.
  - Asymmetry: Explaining why we experience being the macro-subject, not the micro-subjects.
  - Parsimony: Avoiding unnecessary multiplication of subjects.
  - Continuity: Handling identity over time despite micro-level flux.
  - Embodiment: Explaining the connection between consciousness and physical structures.
  - Structural Coherence: Matching the structure of experience to neural organization.
  - Micro-Macro Gap: Accounting for the qualitative difference between micro and macro experiences.

  I note that Unification and Subject Irreducibility are probably non-negotiable for any viable theory, while Preservation might be optional depending on one's metaphysical commitments. Parsimony and Asymmetry are important but possibly negotiable.

  For irreconcilable pairs, I see tensions between:
  - Subject Irreducibility and Parsimony: Adding a new subject violates parsimony.
  - Subject Irreducibility and Preservation: If micro-subjects are preserved, why don't we experience them?
  - Unification and Preservation: True unity might require dissolving micro-subjects.

  Finally, I briefly assess how panpsychism, cosmopsychism and emergentism fare:
  - Panpsychism struggles with combination problems.
  - Cosmopsychism reverses the problem but faces decombination issues.
  - Emergentism has brute emergence concerns.

  I structure this with the requested sections: Requirements, Load-bearing vs Optional, Irreconcilable Pairs, and Contenders at a Glance. For each requirement, I include the motivating case or distinction it must handle.
answer: |-
  ### Requirements
  Here are the core desiderata an adequate theory of experiential combination must satisfy, derived from hard cases and conceptual constraints:

  1.  **Unification Requirement:** The theory must explain how discrete micro-experiential states (e.g., postulated fundamental particle experiences) *genuinely combine* into a single, unified macro-conscious field (e.g., my seamless visual-auditory-tactile awareness), resolving the "binding problem" at the experiential level. *Motivation:* The qualitative difference between a mere collection of experiences (like unrelated pains in different beings) and a single subject's unified awareness (like seeing red *and* feeling warmth simultaneously as aspects of one state). Failure here collapses the distinction between mere co-location and genuine experiential unity.

  2.  **Subject Irreducibility Requirement:** The theory must entail that the macro-level subject (e.g., "me") is a *novel subject*, irreducible to any single micro-subject or their mereological sum. *Motivation:* The intuition that *I* am not identical to a particular neuron or quark, nor simply the aggregate "group" of them. The "what it's like" for the macro-entity seems fundamentally different from and not reducible to the "what it's like" (if any) for its parts. This avoids collapsing the macro-subject into micro-subjects or mere aggregates.

  3.  **Boundary/Selection Requirement:** The theory must explain *why* and *how* combination occurs in specific complex systems (human brains) but *not* in arbitrary aggregates (a pile of sand, a galaxy). *Motivation:* The empirical observation that consciousness arises only in specific, highly organized systems. Failure means either ubiquitous consciousness (every aggregate has a subject) or arbitrary boundaries lacking explanation.

  4.  **Preservation Requirement (Contested):** The theory should ideally account for the *fate* of micro-experiential properties/states during combination. Do they vanish, become inaccessible, or get subsumed? *Motivation:* If fundamental reality includes experiential properties, simply eliminating them at the macro-level seems ontologically profligate or inconsistent. Conversely, if they persist, why aren't *they* the subjects? (This requirement is highly contested).

  5.  **Asymmetry Requirement:** The theory must explain why the macro-subject has access to the unified experience, but the micro-subjects (if persistent) seemingly do not have access to the macro-experience or each other's experiences in the same direct way. *Motivation:* My experience is of being *this* macro-subject, not of being a quark or neuron within my brain. Failure risks implying micro-subjects share my first-person perspective or that I experience being them simultaneously.

  6.  **Parsimony Requirement:** The theory should posit *no more subjects* than necessary to account for the experiential facts. *Motivation:* Avoid ontological profligacy (e.g., positing millions of hidden, causally inert "proto-subjects" within rocks). This guards against theories that multiply subjects beyond necessity, especially if they lack empirical or explanatory traction.

  7.  **Continuity Requirement:** The theory must be compatible with the *persistence* of the macro-subject over time despite constant microphysical turnover (e.g., Ship of Theseus for consciousness). *Motivation:* My sense of being a continuous self despite cellular replacement. Failure implies a new subject arises with every micro-change.

  8.  **Embodiment/Constraint Requirement:** The theory must explain the specific dependence of macro-experiential content and structure on the underlying physical/computational structure of the system (e.g., how neural architecture shapes specific qualia). *Motivation:* Empirical findings in neuroscience (e.g., brain damage altering consciousness). Failure severs the essential link between physical implementation and conscious experience.

  9.  **Structural Coherence Requirement:** The structure of the unified macro-experience (e.g., object binding, spatial relations, temporal flow) must map coherently onto the structure of the combining micro-level relations and processes. *Motivation:* The isomorphism between neural processing dynamics and the structure of perception (e.g., retinotopic maps). Failure leaves the specific *content* of unified experience unexplained.

  10. **Micro-Macro Gap Requirement:** The theory must bridge the seemingly vast qualitative gap between the postulated nature of simple micro-experiences (if any) and the rich, complex, intentional, self-reflective character of macro-consciousness. *Motivation:* The challenge of seeing how "dust experiences" could add up to the symphony of human consciousness. Failure leaves macro-consciousness looking brute or magical.

  ### Load-bearing vs. Optional
  *   **Non-negotiable (Load-bearing):** Unification, Boundary/Selection, Embodiment/Constraint, Structural Coherence, Continuity. These address the core explananda and avoid empirically or phenomenologically untenable positions (ubiquitous consciousness, disconnected consciousness, constantly shifting selves, unstructured experience).
  *   **Candidate Requirements (Arguable):** Subject Irreducibility, Parsimony. Strong intuitions drive them, but strict identity or eliminativist approaches contest Irreducibility, and some views (e.g., layered subjects) tolerate less Parsimony.
  *   **Highly Contested (Often Optional):** Preservation. Panpsychists often demand it; emergentists often reject it as unnecessary. Asymmetry is crucial but might be derivable from other requirements; the Micro-Macro Gap is a major challenge but might be addressed by specific combination mechanisms.

  ### Irreconcilable Pairs
  Several pairs or trios present deep tensions:

  1.  **Subject Irreducibility + Parsimony:** Positing a genuinely *new* subject (Irreducibility) inherently violates strict ontological Parsimony ("no new subjects"). Resolving this requires arguing the new subject *is* necessary, pushing against a hard-core minimalist ontology.
  2.  **Subject Irreducibility + Preservation:** If micro-subjects persist (Preservation) and the macro-subject is genuinely new and irreducible, how are the micro-subjects related to the macro-experience? Why don't *they* experience it? This risks an explosion of subjects (violating Parsimony) or renders micro-subjects epiphenomenal/non-substantial. *Combined with Parsimony:* This trio seems particularly unstable. Irreducibility (new subject) plus Preservation (micro-subjects persist) plus Parsimony (minimize subjects) is likely impossible – one must yield.
  3.  **Unification + Preservation:** Genuine Unification (a single experiential field) seems difficult to reconcile with the persistent existence of *distinct* micro-subjects having their own experiences within that field. True unity might logically require the dissolution or radical transformation of micro-subjects into aspects of the whole.
  4.  **Boundary/Selection + Subject Irreducibility/Preservation:** Explaining why combination *only* happens in complex systems is exceptionally hard if micro-level entities already possess subjectivity (Irreducibility/Preservation concerns). What magic threshold turns a bunch of tiny subjects into one big one *only* in brains? This is the core "combination problem" for panpsychism.
  5.  **Micro-Macro Gap + Parsimony/Preservation:** Bridging this gap without positing either brute emergence (violating a common interpretation of Parsimony demanding continuity) or incredibly complex micro-experiences (violating Parsimony and often Preservation's assumption of simplicity) is a major hurdle.

  ### Contenders at a Glance
  *   **Panpsychism:** Struggles profoundly with **Unification** (combination problem), **Boundary/Selection**, **Asymmetry**, and **Micro-Macro Gap**. Often prioritizes **Preservation** but clashes with **Parsimony** (micro-subjects) and **Subject Irreducibility** (if combination is mere aggregation). **Embodiment/Constraint** and **Structural Coherence** are manageable but depend on unsolved combination.
  *   **Cosmopsychism:** Reverses the problem. Aims for **Unification** (fundamentally unified cosmos) and **Subject Irreducibility** (macro-first). Struggles with **Boundary/Selection** (decombination problem: why am *I* not the cosmos?), **Asymmetry** (why am I limited?), **Preservation** (fate of micro-level experiential aspects?), and **Embodiment/Constraint** (linking cosmic mind to specific neural structures). **Parsimony** is good initially (one subject) but decombination mechanisms can add complexity.
  *   **Emergentism:** Excels at **Boundary/Selection**, **Embodiment/Constraint**, **Structural Coherence**, and **Continuity** by tying consciousness tightly to specific complex physical systems. Handles **Unification** by positing it as a systemic property. Embraces **Subject Irreducibility**. Challenges: **Micro-Macro Gap** (brute emergence?), **Preservation** (typically rejects micro-experience, violating panpsychist intuitions), and satisfying **Parsimony** depends on whether emergence is deemed ontologically economical or extravagant. **Asymmetry** is naturally handled.
