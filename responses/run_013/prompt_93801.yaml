answer: |-
  ### Exam Question  
  **The Dial Paradox:** Consider a dial with 100 settings (0 to 100) controlling a society. At 0, everyone has abundant free time but minimal income. At 100, everyone has high income but no free time. Each incremental step from *n* to *n+1* slightly increases income while slightly decreasing free time. Crucially:  
  (i) Each step (*n* → *n+1*) is an *all-things-considered improvement* (you’d prefer *n+1* over *n*),  
  (ii) But *100 is not better than 0*—most judge them on par, or even prefer 0.  

  **Task:** Resolve this tension. You must explicitly reject **one** of these: (a) every step is an improvement, (b) transitivity of "better than", or (c) the judgment that 100 is not better than 0. Defend your choice by rigorously analyzing its *costs*: What conceptual or practical problems does it create? How does it reshape our understanding of rational choice or value comparisons?  

  ---

  ### Model Answer (689 words)  
  The dial paradox forces us to abandon one core assumption to avoid contradiction. I argue we should reject transitivity, accepting that "better than" is not always transitive. This avoids arbitrary thresholds and repugnant conclusions but demands rethinking how "better than" guides decisions.  

  **Step 1: The Contradiction and Options**  
  If every step (0→1, 1→2, ..., 99→100) is an improvement, and "better than" is transitive, then 100 must be better than 0. Yet we deny 100 is better than 0. We must discard one element:  
  - **Option 1: Reject (i)** → Deny that every step is an improvement.  
  - **Option 2: Reject (ii)** → Accept 100 is better than 0 (despite intuitions).  
  - **Option 3: Reject transitivity** → Allow that A>B and B>C but not A>C.  

  **Step 2: Costs of Rejecting (i) or (ii)**  
  *Rejecting (i)* requires claiming some specific step (e.g., 42→43) is *not* an improvement. But each step involves identical micro-gains/losses. Calling 42→43 non-improvement while 41→42 *is* an improvement is arbitrary—there’s no qualitative difference between steps. This imposes an artificial cutoff, violating the case’s stipulation of seamless continuity. We’d need to explain why a microscopic change suddenly flips the value verdict, which seems indefensible.  

  *Rejecting (ii)* forces us to accept 100>0. But at 100, people have no free time—a life devoid of leisure, relationships, or meaning. Calling this "better" than 0 (where people flourish with time but lack material security) is a repugnant conclusion mirroring population ethics’ worst outcomes. It implies we should endorse a world of drudgery if reached via tiny gains, undermining the intuition that extreme losses of fundamental goods *matter*.  

  **Step 3: Rejecting Transitivity and Its Costs**  
  I reject transitivity. The steps are improvements (retaining (i)), and 100 is not better than 0 (retaining (ii)), but "better than" fails to chain across all links. This avoids arbitrariness and repugnance but incurs three costs:  

  **Cost 1: Redefining "Better Than"**  
  If "A is better than B" doesn’t guarantee A>C when B>C, we must clarify what "better than" *does* mean. It likely reflects *local* comparisons under fixed standards. When comparing *n* and *n+1*, differences are salient and evaluatively similar (e.g., "more income vs. slightly less time"). But comparing 0 and 100 involves qualitatively distinct lives—free-time-rich vs. income-rich—which resist direct ranking. "Better than" might express *contextual* betterness, not an objective, global ordering. This risks making value judgments subjective or incoherent.  

  **Cost 2: Guidance for Choice**  
  Transitivity ensures rational choices can be sequenced (if you prefer A>B and B>C, you should choose A over C). Without it, sequential choices may trap us: I might choose 1 over 0, 2 over 1, ..., but refuse to choose 100 over 0. If offered a direct jump from 0 to 100, I might reject it, but if I inch forward stepwise, I end at 100. This seems irrational—how can each step be right but the whole journey wrong? We must distinguish:  
  - *Pairwise choices*: At any *n*, *n+1* is better, so moving forward is rational.  
  - *Holistic comparisons*: 0 and 100 are incomparable (or on par), so refusing to trade them directly is rational.  
  The cost: Practical reason becomes fragmentary. We need new rules for when to "reset" comparisons or veto stepwise paths.  

  **Cost 3: Distinguishing from Vagueness/Incomparability**  
  One might dismiss this as mere vagueness—no sharp line where "better" stops applying. But vagueness only explains *uncertainty* in comparisons; here, we confidently assert each step is better while denying the endpoint comparison. Alternatively, if 0 and 100 are *incomparable* (neither better nor worse), transitivity violations are expected when mixing comparable and incomparable pairs. The cost: We must accept incomparability between qualitatively dissimilar options, implying "better than" has limited scope. Value relations become complex: "better than" (for comparable pairs), "worse than," "equally good," and "incomparable" (or "on par").  

  **Conclusion**  
  Rejecting transitivity is the least costly option. It avoids arbitrary thresholds and moral repugnance while respecting the case’s details. However, it forces us to see "better than" as a local, context-sensitive relation that cannot always be "added up." This complicates rational choice but mirrors how we actually evaluate vastly different lives: We optimize locally without assuming global hierarchies.  

  ---

  ### Marking Scheme (20 marks total)  
  **18–20 (A+):** Chooses one premise to reject *explicitly*; analyses *all three options’ costs* before defending one; addresses **all three core costs** of the chosen path; distinguishes rejection of transitivity from vagueness/incomparability; discusses implications for choice.  
  **15–17 (A/A-):** Rejects one premise clearly; compares at least two options; addresses two core costs of chosen path; mentions choice-guidance or meaning of "better than."  
  **12–14 (B):** Identifies the contradiction but doesn’t rigorously reject one premise; describes costs superficially (e.g., "rejecting transitivity is weird" without specifics); confuses intransitivity with vagueness.  
  **10–11 (C):** Restates the paradox without resolving it; lists positions (e.g., "Temkin says intransitive!") without analysis.  
  **<10 (Fail):** Misstates case details; ignores the required choice between premises.  

  **Common Errors & One-Line Notes:**  
  - *"It’s just vagueness!"* → Fails: Vagueness doesn’t explain confident stepwise judgments + endpoint denial.  
  - *"We should reject step 50→51"* → Fails: No defense against arbitrariness charge.  
  - *Name-dropping without argument* → Fails: E.g., "Parfit rejects transitivity" ≠ analysis of costs.  
  - *Ignoring choice-guidance* → Caps at B: Must address how to choose rationally if transitivity fails.  
  - *Equating "incomparable" with "equally good"* → Fails: Parity/incomparability ≠ equality.  

  ---  
  This tests grasp of value aggregation, tradeoffs, and conceptual costs—not recall. The strongest answers will sweat defending their chosen sacrifice. Good luck weaponizing Ada’s frustration!
