answer: |-
  Here are five diagnostic items addressing the unresolved debate:

  1.  **Core Disagreement:** The dispute is fundamentally ontological (about what *exists*) and explanatory (about what needs explaining), not primarily about the neuroscientific or first-person data itself; realists insist phenomenal properties are irreducible, while illusionists argue they are misrepresentations generated by cognitive processes.
  2.  **Status of First-Person Seemings:** Realists treat the seeming of having phenomenal feels as direct, incorrigible evidence *for* their existence (the datum), whereas illusionists treat these very seemings *as* the illusion to be explained by underlying cognitive/neural mechanisms.
  3.  **Nature of Introspection:** The hidden disagreement concerns whether introspection provides acquaintance with intrinsic, non-representational properties (realist view) or only delivers a compelling representational *model* of such properties generated by the brain (illusionist view).
  4.  **Verbal vs. Substantive:** While some disagreement might be verbal (e.g., defining "consciousness"), it's mostly substantive: realists demand an explanation preserving intrinsic feels, while illusionists aim to explain why we *believe* we have them, potentially eliminating the need for intrinsic feels.
  5.  **Path to Progress:** Crucial progress would come from empirical results showing how metacognitive mechanisms *reliably generate compelling illusions* of intrinsic feels, or a conceptual distinction clarifying why describing functions/judgments doesn't satisfy the realist's demand to explain the *seeming intrinsic quality*.
