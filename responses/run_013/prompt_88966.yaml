     One possible verbal dispute: What is meant by "truth" in moral contexts.
     Why verbal: Expressivists may use "truth" in a minimalist sense (as a device for assertion and embedding) without committing to moral facts, while cognitivists use "truth" in a robust sense. But both can agree that moral sentences can be called "true" in the minimalist sense.

