  We are constructing a joint statement between an expressivist and a moral cognitivist after a good-faith adversarial collaboration on the Frege-Geach problem. We are to structure it as a JSON object with specific fields.

   The joint statement preamble is a string that both parties would sign. It should be a neutral opening.

   The agreed_claims section should cover:
     - What the Frege-Geach problem is.
     - Which logical phenomena any adequate account of moral language must preserve.
     - What expressivism is committed to.
     - What moral cognitivism is committed to.
     - What both sides agree is not at issue.
     - What would count as a solution.

   We have a test battery with three embeddings:
     1. The conditional argument (modus ponens) with unasserted occurrences of "wrong".
     2. "Wrong" in the scope of a probability operator: "It is likely that withholding the information is wrong."
     3. "Wrong" in the scope of a reason-giving "because": "The chair acted wrongly because withholding the information is wrong."

   We must say which embeddings both sides agree any adequate semantics must handle and which are disputed.

   Then, the disagreements section. We need to identify the key disagreements. Each disagreement object has:
     - disagreement_id: a unique identifier (e.g., "D1", "D2")
     - issue: a neutral statement of the issue
     - expressivist_formulation: how the expressivist would state their view in a way they accept as fair
     - cognitivist_formulation: how the cognitivist would state their view in a way they accept as fair
     - crux: the sub-question that would move at least one side if settled
     - shared_test_or_case: a test, argument, or case that both sides agree would bear on the crux
     - expressivist_prediction: the expressivist's prediction about the test/case
     - cognitivist_prediction: the cognitivist's prediction about the test/case
     - what_would_change_expressivist_mind: what outcome of the test would change the expressivist's mind?
     - what_would_change_cognitivist_mind: what outcome of the test would change the cognitivist's mind?

   The verbal_disputes section: for any apparent disagreements that are merely verbal, we provide:
     - apparent_disagreement: the apparent point of disagreement
     - why_verbal: why it is merely verbal
     - agreed_paraphrase: a paraphrase both sides could accept

   The unresolved_questions: an array of strings.

   We must avoid reciting familiar moves and anchor in the test battery.

   Let's start by drafting the agreed claims:

   Claim 1: What the Frege-Geach problem is.
     The Frege-Geach problem is the challenge of explaining how moral sentences, when embedded in complex contexts (like conditionals, negation, or propositional attitude reports), can have the same meaning as when they are asserted, and how such embeddings preserve the logical properties (e.g., validity) of arguments in which they occur, given that expressivism holds that the meaning of a moral sentence is tied to its use in expressing non-cognitive attitudes.

   Claim 2: Logical phenomena to preserve.
     Any adequate account must preserve the validity of arguments that rely on the logical properties of moral sentences, such as modus ponens, and the fact that moral sentences can be embedded in various contexts (e.g., conditionals, disjunctions, probability operators, and reason-giving explanations) without change of meaning.

   Claim 3: Expressivism commitment.
     Expressivism is committed to the view that the primary function of moral sentences is to express non-cognitive attitudes (such as approval or disapproval) rather than to describe moral facts.

   Claim 4: Moral cognitivism commitment.
     Moral cognitivism is committed to the view that moral sentences express propositions that are truth-apt and that moral judgments are beliefs that can be true or false.

   Claim 5: What is not at issue.
     Both sides agree that the surface grammar of moral language is that of declarative sentences and that moral discourse exhibits logical structure and validity. They also agree that the problem is about the underlying semantics and how to account for the meaning of moral terms in embedded contexts.

   Claim 6: What counts as a solution.
     A solution must provide a unified account of the meaning of moral sentences in both asserted and unasserted contexts that explains the logical relations between them and does not require ad hoc maneuvers for each embedding.

   Now, regarding the test battery:
     Both sides agree that the conditional argument (the first embedding) must be handled by any adequate semantics. They also agree that the probability operator embedding (second) must be handled. However, the reason-giving "because" embedding (third) may be disputed as to whether it is a distinct challenge that must be handled.

   But note: the problem says "which of these embeddings both sides agree any adequate semantics must handle, and which are disputed". We can say that both sides agree that conditionals and probability operators must be handled, but the reason-giving "because" might be a point of disagreement? However, the problem also says: "extend the battery to two further embeddings" and we must say which are disputed.

   We might have to note that the reason-giving embedding is more controversial because it involves not just truth-conditional meaning but also the connection to reasons for action. But both sides might agree that it must be handled? Let us see.

   However, in the disagreements, we can have one about the reason-giving embedding.

   Now, for disagreements, we can identify:

   D1: The nature of moral content in unasserted contexts.
     Issue: How can the expressivist account for the meaning of moral terms in unasserted contexts (like the antecedent of a conditional) without abandoning the core expressivist idea that moral sentences express non-cognitive attitudes?
     Expressivist formulation: "Expressivism can account for embedded contexts by positing that the meaning of a moral sentence is given by the attitude it expresses when asserted, and in unasserted contexts, it contributes to the expression of complex attitudes. For example, in conditionals, it expresses a conditional attitude."
     Cognitivist formulation: "The cognitivist holds that the meaning of a moral sentence is its propositional content, which remains the same in asserted and unasserted contexts, and thus embedding is straightforward."

     Crux: Can expressivism provide a compositional semantics that assigns to complex sentences containing moral terms in embedded contexts the correct truth conditions (or validity conditions) without invoking propositions that are truth-apt?

     Shared test or case: Consider the conditional argument in the test battery. Both agree it is valid. But we can design a test case: imagine a community that uses moral terms in a way that is expressivist at the level of simple sentences, but when embedded in conditionals, they do not infer modus ponens. Instead, they treat the antecedent as expressing a hypothetical attitude that does not license the inference to the consequent when the antecedent is not asserted.

     Expressivist prediction: The expressivist might predict that such a community is possible and that their language would not have the same logical properties as ours, meaning that our moral language is not like that. Alternatively, they might argue that such a community would not have a genuine conditional.

     Cognitivist prediction: The cognitivist would predict that any language that fails to validate modus ponens for moral conditionals is not a language in which moral terms function as they do in our language.

     What would change expressivist's mind: If it turns out that in every possible community that has moral terms and conditionals, modus ponens is preserved, then expressivism must account for that necessity. But if there can be a community without modus ponens for moral conditionals, then expressivism is not forced to explain it as a matter of meaning.

     What would change cognitivist's mind: If we found a community that uses moral terms in embedded contexts without modus ponens and yet we are inclined to say they are using moral terms meaningfully, that would challenge the cognitivist's claim that the logical properties are essential to moral language.

     However, note: the problem says to anchor in the test battery. So we might use the conditional argument as the shared test.

   D2: The probability operator embedding.
     Issue: How to account for the meaning of moral sentences embedded under probability operators, such as "It is likely that withholding the information is wrong."
     Expressivist formulation: "Expressivism can account for probabilistic embeddings by analyzing them as expressions of uncertainty in one's attitudes, or as a degree of confidence in the attitude one would have upon full reflection."
     Cognitivist formulation: "Cognitivism accounts for probabilistic embeddings by treating the moral sentence as expressing a proposition, and the probability operator as quantifying over the possible truth values of that proposition."

     Crux: Can expressivism provide an account of probabilistic embeddings that does not collapse into a form of cognitivism (by treating the attitude as having a truth-conditional component)?

     Shared test or case: Consider an agent who says, "It is 70% likely that withholding the information is wrong." We then ask: does this agent have a 70% degree of belief in a proposition (cognitivist) or a 70% strength of a non-cognitive attitude? We can design a case: if the agent is then presented with evidence that withholding the information is not wrong, does the agent update their attitude in the same way they update beliefs? Or do they have a different pattern?

     Expressivist prediction: The expressivist might predict that the updating of such probabilistic moral judgments is driven by non-cognitive factors (e.g., changes in sentiment) and may not follow the same rules as belief updating (e.g., Bayesian updating).
     Cognitivist prediction: The cognitivist predicts that the updating will follow the same rules as for non-moral beliefs.

     What would change expressivist's mind: If it turns out that updating of probabilistic moral judgments always follows the same rules as updating beliefs about matters of fact, then expressivism would have to account for that by positing a belief-like structure for moral attitudes.

     What would change cognitivist's mind: If updating of probabilistic moral judgments does not follow the rules of belief updating (e.g., it is influenced by non-evidential factors in a way that is not accounted for by standard belief updating), then cognitivism would have to explain why it differs.

   D3: The reason-giving "because" embedding.
     Issue: How to account for the meaning of moral sentences embedded in reason-giving explanations, such as "The chair acted wrongly because withholding the information is wrong."
     Expressivist formulation: "Expressivism can account for reason-giving embeddings by holding that the non-cognitive attitude expressed by the moral sentence provides a reason for action, and the 'because' clause indicates that the reason for the chair's wrong action is the wrongness of withholding the information, which is a matter of the attitude we hold toward withholding the information."
     Cognitivist formulation: "Cognitivism accounts for reason-giving embeddings by holding that the truth of the proposition that withholding the information is wrong provides a reason for the chair not to act in that way, and thus explains why the chair's action was wrong."

     Crux: Can expressivism account for the normative force of the reason-giving explanation without positing that the moral sentence expresses a proposition that is the reason?

     Shared test or case: Consider a case where two people agree that withholding the information is wrong, but one of them does not take that to give her a reason not to do it. For example, an amoralist. The cognitivist might say that if withholding the information is wrong, then it provides a reason regardless of the agent's attitude. The expressivist might say that the reason is internal to the attitude.

     We can test: In the amoralist case, if an amoralist says "Withholding the information is wrong, but I have no reason not to do it", is that a contradiction?

     Expressivist prediction: The expressivist might predict that it is not a contradiction because the wrongness judgment is an expression of attitude and does not necessarily entail a reason for the amoralist (if she does not share the attitude).
     Cognitivist prediction: The cognitivist might predict that it is a contradiction because if an action is wrong, then there is a reason not to do it.

     What would change expressivist's mind: If it is shown that the amoralist's statement is indeed a contradiction in ordinary moral language, then expressivism must account for the internal connection between moral judgment and reasons.

     What would change cognitivist's mind: If it is shown that the amoralist's statement is not a contradiction (i.e., it is coherent), then cognitivism must explain why the connection between moral facts and reasons is not necessary.

