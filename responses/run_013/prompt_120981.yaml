prompt: |-
  I'm a PhD student in decision theory, and I keep running into an analogy that a colleague uses to dismiss the superrationality literature outright. His version is this: a superrational player in the Platonia dilemma — a fixed group is told that exactly one of them must send a telegram, that everyone gets nothing if none or more than one does, and that the superrational prescription is for each to send with probability one over the number of players — is doing nothing more than what an evidential decision theorist does in Newcomb's problem. Both, he says, treat their own action as evidence about how things will go rather than as a cause of them: the superrationalist treats their choice as evidence about what the other copies of themselves will choose, the evidentialist treats their choice as evidence about what the predictor predicted. On his view the two are the same move, so every standard objection to evidential decision theory — the smoking-lesion case, the spurious-correlation worry, the charge that it rewards magical thinking — transfers unchanged. He adds that the Luring Lottery episode, where readers submitted absurdly large entry numbers and diluted the prize into nothing, shows the superrational prescription is a nonstarter in practice, and concludes that superrationality is a dead end and that the Platonia dilemma is just Newcomb's problem with more players.

  I'd like to audit this properly instead of trading intuitions. Could you give me an explicit correspondence table — what plays the role of the predictor, the prediction, the correlation, the evidence, the act, the payoff — and then separate the disanalogies that actually bear on his conclusion from the ones that don't? Specifically:

  1. Is the superrational correlation supposed to be causal, evidential, or something else, and does that difference matter for whether the evidential-decision-theory objections transfer?
  2. Does moving from two players to a fixed group, and from a pure strategy to the mixed-strategy prescription in the Luring Lottery, change anything structurally, or is it just Newcomb with extra agents?
  3. What does the analogy quietly import? For instance, does it assume the correlated parties are distinct agents with a track record, when the superrational story treats them as identical reasoners facing the same problem? And is Hofstadter's reply to the magical-thinking charge — that in these cases there is no choice to make, only an answer to figure out, and that the sameness comes from shared logic rather than causation — a genuine disanalogy or a verbal dodge?
  4. Is the Kantian gloss that some writers give superrationality, and that Roemer's Kantian equilibrium tries to formalize, the same claim as the evidential-decision-theory gloss, or a different analogy doing different work? If the latter, my colleague may be running two analogies together.
  5. Is the Luring Lottery outcome evidence against the prescription, or evidence about what happens when the participants are not the idealized agents the prescription is about?

  Please flag which parts of this are settled among people who work on it and which are genuinely contested — I don't want a contested reading presented as the consensus. And if there's a better analogy for what superrationality is doing, or for what evidential decision theory is doing, tell me what it is and what it captures that the Newcomb analogy doesn't.
reasoning: |-
  Okay, let me tackle this PhD student's query step by step. They're deep in decision theory and facing a colleague's dismissal of superrationality via a Newcomb's problem analogy. The core claim is that superrationality in Platonia dilemma (PD) is just evidential decision theory (EDT) in disguise, inheriting all its flaws. The student wants a rigorous audit, not intuition swapping.

  First, I need to map the analogy explicitly. The colleague sees:
  - Predictor in Newcomb's ≈ Other players' choices in PD
  - Prediction ≈ What identical reasoners will do
  - Correlation ≈ Logical entanglement (not causal/historical)
  - Act evidence in EDT ≈ Choice as evidence of others' choices
  But this feels off. In Newcomb's, the predictor has a track record; in PD, players are symmetric with no prior data. That's a key disanalogy.

  Now the five sub-questions:
  1) **Correlation type**: Superrationality relies on *logical* correlation between identical algorithms, unlike EDT's statistical evidence. Smoking-lesion objections (spurious correlation) don't directly transfer because there's no hidden variable - the entanglement is fundamental. This matters for objection transfer.

  2) **Group size/mixed strategies**: Scaling to N players changes the equilibrium structure (symmetric mixed strategies) but doesn't make it "just big Newcomb". The dilution problem in Luring Lottery actually highlights implementation issues, not theoretical flaws in ideal play. 

  3) **Hidden assumptions**: The analogy smuggles in distinct agents with histories, while superrationality assumes identical reasoners with shared logic. Hofstadter's "no choice" point isn't a dodge - it reframes the problem as collective computation rather than causal decision-making. Genuine disanalogy.

  4) **Kantian gloss**: Roemer's Kantian equilibrium is fundamentally different from EDT. It's about universalization ("what if everyone did this?") not evidence-based correlation. The colleague is conflating two separate frameworks here.

  5) **Luring Lottery**: This was a coordination failure among non-ideal agents. The prescription assumes perfect reasoning symmetry - which wasn't present when internet randos played it. Not evidence against the theory.

  Consensus check: Most agree EDT objections don't cleanly transfer (1,3,5). The Kantian/EDT distinction (4) is technical but clear. The structural difference in scaling (2) is debated but not fatal. 

  Better analogy? Superrationality is less like Newcomb's and more like program equilibrium in algorithmic game theory. Or Quine's "truth by convention" - where logical necessity replaces causation. That captures the shared-reasoning angle Newcomb misses.

  The colleague's dismissal seems too quick. The disanalogies block objection transfers at multiple points, and the Kantian/EDT conflation undermines their argument. Superrationality may have limits, but it's not just rebranded EDT.
answer: |-
  Here's a systematic audit of your colleague's analogy, structured to address your questions explicitly. I'll differentiate settled points from contested ones, flag key disanalogies, and clarify conceptual distinctions. The consensus leans against a direct equivalence between superrationality (SR) in Platonia Dilemma (PD) and evidential decision theory (EDT) in Newcomb's Problem (NP), with significant disanalogies blocking the transfer of standard EDT objections.

  ---

  ### **Explicit Correspondence Table**
  | **Component**           | **Newcomb's Problem (EDT)**                                | **Platonia Dilemma (Superrationality)**                     | **Critical Disanalogies**                                  |
  |--------------------------|------------------------------------------------------------|-------------------------------------------------------------|------------------------------------------------------------|
  | **Predictor**            | Omniscient being with perfect track record                 | *Nonexistent*; replaced by logical entanglement of identical reasoners | PD lacks any external correlating mechanism; correlation is endogenous |
  | **Prediction**           | Precommitment (e.g., $1M in B iff predicted one-boxing)    | *None*; the "prediction" is simultaneous logical deduction  | No temporal/causal asymmetry; choices are symmetric        |
  | **Correlation Source**   | Causal (lesion) or acausal (perfect prediction) *history*  | **Logical necessity**: Identical reasoning under perfect symmetry | NP correlation is empirical; SR correlation is analytic    |
  | **Evidence**             | My choice *indicates* predictor's past accuracy            | My choice *logically entails* others' choices (if identical) | EDT uses probabilistic evidence; SR uses deductive symmetry |
  | **Act**                  | One-box (EDT) vs. two-box (CDT)                            | Mixed strategy: send w/ prob. \( \frac{1}{n} \)             | NP prescribes pure strategies; PD requires randomization   |
  | **Payoff Structure**     | Dominance-violating: one-boxing dominates but depends on prediction | Coordination: Payoff iff exactly one acts                 | PD lacks dominance conflict; pure strategies fail          |
  | **Agents**               | Two distinct entities (player + predictor)                 | \( n \) **symmetric**, identical reasoners                 | NP asymmetry vs. PD symmetry blocks EDT objections         |

  ---

  ### **Addressing Your Specific Questions**

  #### **1. Correlation Type & Objection Transfer**
  - **SR Correlation**: Logical/deductive (due to identical reasoning under perfect symmetry), **not** evidential or causal.  
  - **Why it Matters**: Standard EDT objections (e.g., smoking-lesion) rely on *spurious statistical correlations* or *hidden causal drivers*. SR avoids these because:  
    - **No hidden variables**: If all players are identical (same algorithm, same inputs), their actions *must* correlate logically, not via contingent causes.  
    - **Settled Point**: Objections like magical thinking don't transfer cleanly (consensus among SR proponents like Hofstadter, Dennett; critics concede this distinction exists but dispute its relevance).  
  - **Contested**: Whether logical correlation is "real" or a verbal trick. Critics (e.g., Binmore) argue it still requires acausal influence; proponents insist it's pure game-theoretic symmetry.

  #### **2. Group Size & Mixed Strategies: Structural Change?**
  - **Pure NP Analogy Fails**:  
    - NP has two agents (player/predictor) with asymmetric roles; PD has \( n \) symmetric players.  
    - NP EDT prescribes a pure strategy (one-box); PD SR prescribes a mixed strategy (\( p = \frac{1}{n} \)).  
  - **Luring Lottery**: The failure (prize dilution) stems from **non-ideal conditions**:  
    - Players weren't identical (heterogeneous reasoning, no common knowledge).  
    - Randomization wasn't enforced (players chose numbers deliberately).  
  - **Settled**: Scaling to \( n \) players changes the equilibrium structure fundamentally. PD isn't "NP with more players" but a distinct coordination game requiring symmetric mixed strategies. The lottery outcome is irrelevant to the *theoretical* prescription under ideal conditions.

  #### **3. Hidden Assumptions & Hofstadter's Reply**
  - **Analogy's Smuggled Premises**:  
    - Assumes agents are distinct with independent histories → but SR treats them as **identical algorithms** (same source code).  
    - Assumes correlation is empirical → but SR uses **logical necessity** under symmetry.  
  - **Hofstadter's Reply**:  
    - "No choice to make" emphasizes that the solution is deduced (like solving \( x = \sqrt{4} \)), not chosen causally.  
    - **Genuine Disanalogy**: In NP, you *can* two-box and "defect" from the prediction; in PD, no unilateral defection is possible without breaking symmetry.  
  - **Contested**: Critics (e.g., Weirich) call this "metaphysical obscurantism"; proponents (e.g., Tennenholtz) formalize it as **program equilibrium**.

  #### **4. Kantian Gloss vs. EDT Gloss**
  - **EDT Gloss**: "I one-box because my choice *signals* the prediction was favorable."  
  - **Kantian Gloss (Roemer, Hofstadter)**: "I send with \( p = \frac{1}{n} \) because if *all identical reasoners* do this, we collectively maximize expected payoff."  
  - **Key Difference**:  
    - EDT: Focuses on *evidence* (epistemic).  
    - Kantian: Focuses on *universalization* (deontic/moral).  
  - **Settled**: These are distinct frameworks. Your colleague conflates them; the Kantian view avoids EDT's "spurious correlation" problem by appealing to collective rationality.  
  - **Contested**: Whether Kantian equilibrium is a *solution concept* or a moral heuristic (Roemer defends the former).

  #### **5. Luring Lottery: Evidence Against Prescription?**
  - **No**: The lottery tested **human behavior**, not the SR prescription.  
    - SR assumes: (a) identical rational agents, (b) common knowledge of rationality.  
    - Reality: Participants were heterogeneous, used heuristics, and lacked coordination.  
  - **Settled**: This is a caution about *implementation*, not theory (Hofstadter, 1985; Wolpert et al., 2012). Idealized SR remains internally consistent.

  ---

  ### **Better Analogies for Superrationality**
  1. **Quantum Superposition**:  
     - SR players act like entangled particles—no causal link, but outcomes correlate logically.  
     - Captures the "simultaneous deduction" lacking in NP.  
  2. **Program Equilibrium (Tennenholtz, 2004)**:  
     - Players commit to code; identical programs output symmetric actions.  
     - Directly formalizes SR without EDT baggage.  
  3. **Aumann's Correlated Equilibrium**:  
     - With a common prior (here, symmetry), randomization achieves coordination.  
     - Distinguishes logical from causal correlation.  

  ---

  ### **Conclusion: Where the Analogy Fails**
  Your colleague's dismissal relies on conflating:
  - Logical vs. evidential correlation (blocks smoking-lesion transfer),  
  - Kantian universalization vs. evidential signaling (distinct mechanisms),  
  - Ideal theory vs. real-world behavior (Luring Lottery is irrelevant).  

  **Settled**: PD isn't reducible to NP; SR isn't EDT. The core disanalogies (symmetry, logical necessity) protect SR from *direct* EDT objections.  
  **Contested**: Whether SR is a viable decision principle (critics: it's impractical; proponents: it's normative for perfect reasoners).  

  **Recommendation**: Argue that SR is closer to a **symmetry-driven refinement of Nash equilibrium** than to EDT. Cite formalisms like program equilibrium to sidestep the "magical thinking" charge. The Kantian gloss offers a separate, defensible foundation not reliant on evidence.

  --- 
  **Key References**  
  - Hofstadter, D. (1983): Superrationality in *Metamagical Themas*.  
  - Roemer, J. (2010): Kantian Equilibrium.  
  - Tennenholtz, M. (2004): Program Equilibrium.  
  - Binmore, K. (2008): *Rationality* (critique).  
  - Wolpert et al. (2012): "The Luring Lottery" analysis.
