  We are going to design the question as per the specifications.

  The question will be structured in parts (a) to (e) with mark allocations. We will then provide a model answer and a marking scheme.

  Exam Question:

  Question 5: Dilation in Imprecise Probability (20 marks)

  Consider a finite outcome space with two binary events, A and B. We define a credal set M as the convex hull of two probability distributions P1 and P2, given by the following probabilities for the four outcomes:

  - (A=1, B=1): P1 = 0.05, P2 = 0.45
  - (A=1, B=0): P1 = 0.35, P2 = 0.15
  - (A=0, B=1): P1 = 0.45, P2 = 0.05
  - (A=0, B=0): P1 = 0.15, P2 = 0.35

  Thus, M = { λP1 + (1-λ)P2 : λ ∈ [0,1] }.

  (a) Compute the prior range for the event A (i.e., the infimum and supremum of P(A=1) over M). Then, compute the posterior ranges for A given B=1 and given B=0 (i.e., the infimum and supremum of P(A=1 | B=1) and P(A=1 | B=0) over M). Using these, state precisely how the posterior ranges relate to the prior range and explain why this constitutes dilation. Also, explain why the dilation is uniform across the partition {B=1, B=0}. (6 marks)

  (b) Explain why no single precise probability distribution (i.e., a single element of M) can exhibit dilation. Name the fundamental property of conditional probability that prevents dilation in the precise case. (3 marks)

  (c) Some might argue that dilation shows that imprecise probability is an incoherent way to represent beliefs. Assess this argument by distinguishing between imprecision as a feature of an agent's epistemic state and a set of possible objective distributions. What does the dilation phenomenon in this example actually show about the coherence of imprecise probability? (4 marks)

  (d) One might object that dilation is an artifact of the credal set being too sparse or not convex. However, M is convex. Does the convexity of M remove the phenomenon of dilation? Explain by reference to the example. (3 marks)

  (e) Suppose a decision maker must choose among acts whose payoffs depend on A. They first observe B, and then choose an act. What consequence does dilation have for the decision maker's ability to make decisions after observing B? (4 marks)

  ---

  Model Answer (approx. 700 words):

  (a) Let us compute the prior probability of A=1 for an arbitrary distribution in M: P_λ(A=1) = λ * P1(A=1) + (1-λ) * P2(A=1). Note that P1(A=1) = P1(A=1, B=1) + P1(A=1, B=0) = 0.05 + 0.35 = 0.4. Similarly, P2(A=1) = 0.45 + 0.15 = 0.6. Therefore, P_λ(A=1) = λ*0.4 + (1-λ)*0.6 = 0.6 - 0.2λ. As λ goes from 0 to 1, this ranges from 0.6 (at λ=0) to 0.4 (at λ=1). So the prior range for A=1 is [0.4, 0.6].

  Now, for the posterior given B=1: P_λ(A=1 | B=1) = P_λ(A=1, B=1) / P_λ(B=1). We have P_λ(B=1) = P_λ(A=1, B=1) + P_λ(A=0, B=1). For P1, P1(B=1)=0.05+0.45=0.5. For P2, P2(B=1)=0.45+0.05=0.5. So for any λ, P_λ(B=1)=0.5. Then, P_λ(A=1, B=1) = λ*0.05 + (1-λ)*0.45 = 0.45 - 0.4λ. Therefore, P_λ(A=1 | B=1) = (0.45 - 0.4λ) / 0.5 = 0.9 - 0.8λ. As λ goes from 0 to 1, this ranges from 0.9 (at λ=0) to 0.1 (at λ=1). So the posterior range given B=1 is [0.1, 0.9].

  Similarly, for B=0: P_λ(B=0)=0.5 for all λ (by symmetry). P_λ(A=1, B=0) = λ*0.35 + (1-λ)*0.15 = 0.15 + 0.2λ. Then, P_λ(A=1 | B=0) = (0.15+0.2λ)/0.5 = 0.3 + 0.4λ. As λ goes from 0 to 1, this ranges from 0.3 (at λ=0) to 0.7 (at λ=1). So the posterior range given B=0 is [0.3, 0.7].

  The prior range [0.4, 0.6] is strictly contained in both posterior intervals: [0.1, 0.9] and [0.3, 0.7] (since 0.4>0.1 and 0.6<0.9, and 0.4>0.3 and 0.6<0.7). Therefore, conditioning on either value of B leads to a strictly larger set of probabilities for A. This is dilation.

  Moreover, since the dilation occurs for both values of the partition {B=1, B=0}, the dilation is uniform across that partition.

  (b) In a single precise probability distribution, conditioning on an event B with positive probability leads to a unique posterior probability for A. Therefore, the posterior set would be a single point. The prior probability of A is also a single point. The posterior point must lie within the prior set (which is a singleton). More fundamentally, the law of total probability requires that the prior probability of A is a convex combination of the posterior probabilities: P(A) = P(A|B=1)P(B=1) + P(A|B=0)P(B=0). Since P(B=1)=P(B=0)=0.5 in this example, we would have P(A) = 0.5 * [P(A|B=1) + P(A|B=0)]. Therefore, the prior P(A) must be the midpoint of the two posteriors. This relation implies that the two posteriors cannot both be outside the prior set. In fact, they must straddle the prior. Hence, no single distribution can exhibit dilation.

  (c) The dilation phenomenon does not imply that imprecise probability is incoherent. Imprecision represents an agent's epistemic state of uncertainty, not a set of possible objective distributions. Dilation occurs because the agent's set of probabilities is updated by conditioning each distribution in the credal set. The agent's uncertainty about A increases after learning B, which might be counterintuitive but is a consequence of the agent's initial representation of ambiguity. This does not violate coherence because the updating rule (conditioning each prior in the set) is consistent with the imprecise probability framework. The dilation example shows that learning new information can increase ambiguity, which is a feature of the representation and not a flaw. However, it does not show that the framework is incoherent; it merely highlights that the behavior of imprecise probabilities under conditioning differs from precise probabilities.

  (d) The credal set M is convex by construction (as the convex hull of P1 and P2). Despite convexity, dilation occurs. Therefore, convexity does not remove dilation. In our example, the posterior ranges are intervals, and they strictly contain the prior interval. The convexity of the set of posteriors is maintained, but the set becomes larger. Hence, dilation is not an artifact of non-convexity.

  (e) After observing B, the decision maker faces a larger set of probabilities for A. This means that the ambiguity about A increases. When evaluating acts that depend on A, the decision maker must use a decision rule that accounts for imprecision (e.g., maxmin expected utility). The increased imprecision may lead to more cautious decisions. For instance, the worst-case expected utility for an act might be lower after conditioning because the lower bound of P(A=1) might drop (as we see: from 0.4 to 0.1 given B=1). Thus, the decision maker might avoid acts that are attractive under the prior but become too risky after learning B. The dilation phenomenon implies that learning can sometimes increase ambiguity and make decisions more difficult.

  ---

