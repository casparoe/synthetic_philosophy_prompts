answer: |-
  ### Exam Question Text  
  **Question 5: Dilation in Imprecise Probability (Total: 20 marks)**  

  Consider a credal set \(M\) defined as the convex hull of two probability distributions \(P_1\) and \(P_2\) over binary events \(A\) and \(B\). The joint probabilities are:  

  | Outcome \((A, B)\) | \(P_1\) | \(P_2\) |  
  |-------------------|--------|--------|  
  | \((1, 1)\)         | 0.05   | 0.45   |  
  | \((1, 0)\)         | 0.35   | 0.15   |  
  | \((0, 1)\)         | 0.45   | 0.05   |  
  | \((0, 0)\)         | 0.15   | 0.35   |  

  Thus, \(M = \{ \lambda P_1 + (1 - \lambda) P_2 \mid \lambda \in [0, 1] \}\).  

  **(a)** Compute the **prior range** of \(A = 1\) (i.e., the infimum and supremum of \(P(A=1)\) over \(M\)). Then compute the **posterior ranges** of \(A = 1\) given \(B = 1\) and given \(B = 0\) (i.e., the infimum and supremum of \(P(A=1 \mid B=1)\) and \(P(A=1 \mid B=0)\) over \(M\)). Using these, state:  
  - How the posterior ranges strictly contain the prior range, confirming **dilation** of \(A\) by \(B\).  
  - Why this dilation is **uniform** across the partition \(\{B=1, B=0\}\).  
  **(6 marks)**  

  **(b)** Explain why no **single** precise probability distribution (i.e., a single \(P \in M\)) can exhibit dilation. Name the fundamental property of conditional probability that prevents dilation in the precise case.  
  **(3 marks)**  

  **(c)** One critique claims dilation reveals that imprecise probability is an "incoherent" representation of belief. Assess this by:  
  - Distinguishing between imprecision (an agent’s epistemic state) and a set of possible objective distributions.  
  - Explaining what dilation in this example *actually* implies about coherence.  
  **(4 marks)**  

  **(d)** Address the objection that dilation is an artifact of a non-convex or "sparse" credal set. Since \(M\) is convex, does convexity remove dilation? Justify using the example.  
  **(3 marks)**  

  **(e)** Suppose a decision maker must choose acts with payoffs depending on \(A\), **after** observing \(B\). What consequence does dilation have for their decision-making? Focus on ambiguity after observation.  
  **(4 marks)**  

  ---  
  ### Model Answer (Strong Candidate, ~700 words)  

  **(a)**  
  **Prior range of \(A=1\):**  
  For \(P_\lambda = \lambda P_1 + (1-\lambda)P_2\),  
  \[P_\lambda(A=1) = \lambda (0.05 + 0.35) + (1-\lambda)(0.45 + 0.15) = \lambda(0.4) + (1-\lambda)(0.6) = 0.6 - 0.2\lambda.\]  
  As \(\lambda\) ranges over \([0,1]\), \(P_\lambda(A=1)\) ranges from \(0.6\) (\(\lambda=0\)) to \(0.4\) (\(\lambda=1\)). Thus, the prior range is \([0.4, 0.6]\).  

  **Posterior range given \(B=1\):**  
  First, \(P_\lambda(B=1) = P_\lambda(A=1,B=1) + P_\lambda(A=0,B=1) = \lambda(0.05 + 0.45) + (1-\lambda)(0.45 + 0.05) = 0.5\) (constant).  
  \[P_\lambda(A=1 \mid B=1) = \frac{P_\lambda(A=1,B=1)}{P_\lambda(B=1)} = \frac{\lambda \cdot 0.05 + (1-\lambda) \cdot 0.45}{0.5} = \frac{0.45 - 0.4\lambda}{0.5} = 0.9 - 0.8\lambda.\]  
  As \(\lambda\) ranges over \([0,1]\), this spans \(0.9\) (\(\lambda=0\)) to \(0.1\) (\(\lambda=1\)). Thus, the posterior range is \([0.1, 0.9]\).  

  **Posterior range given \(B=0\):**  
  Similarly, \(P_\lambda(B=0) = 0.5\) (constant).  
  \[P_\lambda(A=1 \mid B=0) = \frac{P_\lambda(A=1,B=0)}{P_\lambda(B=0)} = \frac{\lambda \cdot 0.35 + (1-\lambda) \cdot 0.15}{0.5} = \frac{0.15 + 0.2\lambda}{0.5} = 0.3 + 0.4\lambda.\]  
  This spans \(0.3\) (\(\lambda=0\)) to \(0.7\) (\(\lambda=1\)). Thus, the posterior range is \([0.3, 0.7]\).  

  **Dilation and uniformity:**  
  The prior range \([0.4, 0.6]\) is strictly contained in both posterior ranges:  
  - \([0.1, 0.9]\) (given \(B=1\)) since \(0.4 > 0.1\) and \(0.6 < 0.9\).  
  - \([0.3, 0.7]\) (given \(B=0\)) since \(0.4 > 0.3\) and \(0.6 < 0.7\).  
  This strict containment defines **dilation** of \(A\) by \(B\). It is **uniform** because dilation occurs for both cells (\(B=1\) and \(B=0\)) of the partition.  

  **(b)**  
  A single precise distribution \(P\) yields a unique posterior \(P(A \mid B)\). The posterior set is a singleton, which cannot strictly contain the prior set (also a singleton). Crucially, the **law of total probability** binds prior and posteriors:  
  \[P(A) = P(A \mid B=1)P(B=1) + P(A \mid B=0)P(B=0).\]  
  Here, \(P(B=1) = P(B=0) = 0.5\), so \(P(A) = 0.5[P(A \mid B=1) + P(A \mid B=0)]\). Thus, \(P(A)\) must be the midpoint of \(P(A \mid B=1)\) and \(P(A \mid B=0)\). If the prior is \(0.5\), one posterior must be \(\leq 0.5\) and the other \(\geq 0.5\); they cannot both be strictly outside \([0.4, 0.6]\).  

  **(c)**  
  The critique confuses two interpretations:  
  - **Imprecision**: Represents an agent’s *epistemic uncertainty* (lack of knowledge), encoded as a credal set.  
  - **Objective distributions**: \(M\) as a set of "true" probabilities is a frequentist misconception.  
  Dilation arises from **updating each \(P \in M\) individually** via conditioning. This is coherent per the generalized Bayesian framework: the agent’s uncertainty about \(A\) *increases* after learning \(B\) because \(B\) is evidentially ambiguous relative to \(A\). Dilation does not violate coherence; it reflects how ambiguity can grow with new information. The example shows that imprecise probability *coherently* models learning under ambiguity, not that it is flawed.  

  **(d)**  
  \(M\) is convex by construction, yet dilation persists: the posterior ranges \([0.1, 0.9]\) and \([0.3, 0.7]\) are intervals strictly containing \([0.4, 0.6]\). Convexity ensures linear interpolation between \(P_1\) and \(P_2\), but does not shrink the extrema of \(P(A \mid B)\). Thus, convexity does **not** remove dilation; it is intrinsic to the credal structure.  

  **(e)**  
  After observing \(B\), the decision maker faces **increased ambiguity** about \(A\) (e.g., given \(B=1\), \(P(A=1)\) ranges from \(0.1\) to \(0.9\) vs. prior \([0.4, 0.6]\)). For decisions based on \(A\) (e.g., maxmin expected utility), acts with payoffs sensitive to \(A\) become **riskier**:  
  - The worst-case \(P(A=1)\) drops from \(0.4\) to \(0.1\) if \(B=1\), making "bet on \(A=1\)" less attractive.  
  - Optimal acts may shift toward ambiguity-averse choices, or indecision may arise if no act dominates across \(M\).  
  Dilation thus implies that learning can **amplify ambiguity**, complicating post-observation decisions.  

  ---  
  ### Marking Scheme  
  **Total: 20 marks**  
  *Key: Award marks for conceptual clarity. Deduct for conflation of precise/imprecise probability, arithmetic errors, or missed distinctions.*  

  **(a) Prior/posterior ranges, dilation, uniformity (6 marks)**  
  - Prior range correct: \([0.4, 0.6]\) (1 mark).  
  - Posterior given \(B=1\) correct: \([0.1, 0.9]\) (1 mark).  
  - Posterior given \(B=0\) correct: \([0.3, 0.7]\) (1 mark).  
  - Strict containment stated: \([0.4, 0.6] \subset [0.1, 0.9]\) and \([0.4, 0.6] \subset [0.3, 0.7]\) (1 mark).  
  - Identifies this as dilation (strict containment) (1 mark).  
  - Explains uniformity: dilation occurs for both \(B=1\) and \(B=0\) (1 mark).  
  *Deduct for:* Arithmetic errors (e.g., miscomputing \(P(A)\)); missing strict containment; not linking uniformity to the partition.  

  **(b) No dilation in precise distributions (3 marks)**  
  - Explains that a single \(P\) gives singleton posteriors, which cannot strictly contain the singleton prior (1 mark).  
  - Names the **law of total probability** (1 mark).  
  - Explains its role: forces prior to be a convex combination of posteriors, preventing both from being outside prior range (1 mark).  
  *Deduct for:* Vague appeal to "unique posterior"; not naming the law; misapplying it (e.g., using Bayes’ rule alone).  

  **(c) Coherence assessment (4 marks)**  
  - Distinguishes **imprecision as epistemic** (agent’s uncertainty) vs. **objective distributions** (1.5 marks).  
  - Explains dilation arises from updating each \(P \in M\) (coherent per generalized Bayesian) (1 mark).  
  - States dilation shows **ambiguity increases** with learning, not incoherence (1 mark).  
  - Notes the example demonstrates coherent representation under ambiguity (0.5 marks).  
  *Deduct for:* Equating \(M\) with objective chances; claiming dilation implies incoherence; not separating updating from representation.  

  **(d) Convexity objection (3 marks)**  
  - Notes \(M\) is convex (1 mark).  
  - States convexity **does not remove** dilation (as computed in (a)) (1 mark).  
  - Explains that convexity preserves extrema (e.g., \(\lambda=0,1\) define bounds) (1 mark).  
  *Deduct for:* Claiming convexity eliminates dilation; not using the example; misdefining convexity.  

  **(e) Decision-making consequence (4 marks)**  
  - States dilation **increases ambiguity** about \(A\) after observing \(B\) (1 mark).  
  - Links to **wider posterior range** (e.g., \([0.1, 0.9]\) vs. \([0.4, 0.6]\)) (1 mark).  
  - Explains impact: **more cautious decisions** (e.g., lower maxmin utility), or indecision (1 mark).  
  - Notes learning \(B\) can **amplify perceived risk** for acts depending on \(A\) (1 mark).  
  *Deduct for:* Ignoring ambiguity; focusing only on prior; not tying to post-observation acts.  

  ---  
  **Expected Weak Answers:**  
  - Candidates who conflate imprecise sets with "averages" may compute a single posterior (failing (a)).  
  - Those memorizing "dilation requires non-convexity" will fail (d).  
  - In (c), weak answers may call dilation "irrational" without epistemic/objective distinction.  
  - In (e), some may assume decision rules for precise probabilities (e.g., expected utility) and miss ambiguity effects.
