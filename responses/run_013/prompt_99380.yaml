  - Note that M is convex (by construction) (1 mark)
  - Despite convexity, dilation occurs (as computed in (a)) (1 mark)
  - Therefore, convexity does not remove dilation (1 mark)

  Common mistake: Claiming that non-convexity is necessary for dilation. Mistake: Not checking the convexity of the given M.

