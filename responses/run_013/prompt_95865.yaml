  Okay, the user is a second-year philosophy student focused on Hume's essay on taste. They've noticed a pattern in aesthetic disagreements where each person attributes the other's differing opinion to a personal defect rather than a difference in taste. They also note cases where a change in judgment (due to new information) is framed as discovering an objective property of the work rather than a subjective change. They want a name for this phenomenon and a comparison to established ideas.

  Hmm, the core here is the cognitive bias in aesthetic judgment. The user's examples with their flatmate show mutual accusations of perceptual or attentional defects. When the user's friend learned a painting was a forgery, its value vanished instantly—same physical object, same viewer, but different judgment. The user frames this as "now I get it," implying an objective revelation. This needs linking to existing philosophical concepts.

  First, considering Hume's standard of taste. Hume argues for ideal critics with fine-tuned sensibilities, but the user points out how people in real disputes claim the critic role to pathologize dissent. That's different from Hume's normative project; it's descriptive psychology. Then there's the forgery case: Walton's categories of art might be relevant. Walton says correct categories (like knowing it's an Impressionist work) are essential for proper appreciation. But the user's case adds value-laden facts (forgery, composer dying) that aren't purely categorical. When the user hears about the dying composer, they don't just re-categorize; they feel they've uncovered the piece's true essence. That seems like a form of cognitive penetration—where non-perceptual info alters perceptual experience. But the key twist is the narrative of discovery: claiming the change reveals the object's properties, not one's own shift.

  The term "objective illusion" comes to mind, but it's not standard. "Aesthetic realism" misfires because it's ontological. "Epistemic capture" could work—framing personal judgments as discoveries of external truths to dodge subjectivity. It captures both disagreement and revision cases. For the boundaries: it counts when judgments are retrojected onto the object ("I see it now") and dissent is medicalized. It wouldn't fit if someone admits changing preferences. 

  The user might also be circling theories of perceptual justification. But their focus on the rhetoric of discovery ("finally hears") suggests a need for a term highlighting that self-misdescription. "Aesthetic apophenia"? No, that over-pathologizes. "Reification" is close but too Marxist. "Essentialist error" gets the ontology wrong. "Epistemic capture" still seems best—it centers the cognitive hijacking where experience gets narratively outsourced.
answer: |-
  Your observation is sharp: this is the **epistemic capture** of aesthetic judgment. It's not merely Hume's normative project of identifying ideal critics, but the *descriptive* psychological and rhetorical move by which we recast subjective responses as objective discoveries, pathologizing dissent.

  1.  **Against Hume's Standard:** Hume prescribes criteria for "true judges." You're describing how individuals *presume* these criteria are met in themselves when defending a verdict. Disagreement isn't evidence of relativism but of the *other's* perceptual/cognitive defect ("laziness," "wanting catchiness"). Resolution (conversion or persistent dissent) is framed as confirming the object's fixed properties or the other's deficiency. Hume seeks justification; you're exposing a defensive cognitive bias.

  2.  **Against Walton's Categories (Kendall Walton, "Categories of Art"):** Walton argues aesthetic properties depend on correctly categorizing the work (e.g., *Guernica* as "cubist," not "realist"). Your forgery/dying-composer cases involve **category-dependent properties** changing with new information. But you highlight the *phenomenology* and *narrative*: the shift feels like uncovering what *was always there* ("now I get it"), not like changing frameworks. We deny the mediating role of context/interpretation.

  3.  **Against Cognitive Penetration (Philosophy of Perception):** New knowledge (forgery, biography) "penetrates" and alters the perceptual/aesthetic experience. But again, the key is the *retrospective justification*: we don't say "This knowledge changed my feeling," we say "This knowledge revealed the truth."

  **"Epistemic Capture" Defined:** The process by which an aesthetic experience (especially one revised by effort, context, or new information) is narrativized *not* as a change in the subject's state, perception, or values, but as the discovery of a pre-existing, objective property of the work itself. Concurrently, failure to have the "correct" experience is attributed to a defect in the other perceiver. It's the **reification of aesthetic response combined with the pathologization of dissent**.

  *   **Core Mechanism:** Denial of subjectivity/mediation. The work "contains" beauty/meaning; we "discover" it; others are "blind/deaf."
  *   **Boundaries:**
      *   **Counts:** Cases where judgment shifts *and* is described as accessing the object's inherent properties; disagreements framed as defects in the other's capacity.
      *   **Doesn't Count:** Simply changing one's mind *and acknowledging it as such* ("I used to find it boring, now I appreciate its subtlety"); acknowledging genuine relativism ("It just doesn't move me"); Hume's *prescriptive* standard-seeking.
  *   **Why not "Reification"?** Too broad (applies to many concepts). "Epistemic capture" emphasizes the *knowledge claim* ("I now *know* its true quality") and the *subjugation* of the subjective experience to an objective narrative.
  *   **Why not "Aesthetic Realism"?** That's an ontological position (beauty *is* objective). You're describing a *psychological strategy* people use, regardless of ontology's truth.

  **In short:** You've pinpointed the **defensive essentialism** inherent in everyday aesthetic disputes and revisions – the sleight-of-hand where we project our contingent responses onto the object and diagnose others' differences as perceptual failures. It's the lived, unreflective counterpoint to Hume's careful calibration.
