answer: |-
  ### 1. Grade and Bottom Line  
  **76/100 (C+ Band)**  
  The answer demonstrates core understanding but misapplies the pivotal/marginal distinction, undermining its defense of the instrumental account. **Moving up a band (to B-) would require correctly showing why marginal influence *fails* to resolve the paradox under the instrumental account**, preserving logical consistency.

  ---

  ### 2. What the Answer Gets Right  
  - **(a)** Precisely defines the instrumental account and its prediction of near-zero turnout. Correctly calculates the probability of a decisive vote as \(2^{-(N-1)}\) under the given assumptions and explains its absurdity for large \(N\).  
  - **(b)** Accurately defines pivotal influence (vote breaks a tie) vs. marginal influence (vote alters the margin). Correctly notes that every vote has marginal influence.  
  - **(c)** Correctly identifies the expressive account as prioritizing expression over influence. Appropriately notes that this account predicts turnout should be insensitive to cost changes (e.g., mail ballots).  

  ---

  ### 3. Comments, in Order of Importance  
  1. **"So my vote does make a difference... the instrumental account was never in as much trouble"**  
     - **Error:** Misapplication of the distinction.  
     - **Issue:** Confuses "difference" with *instrumental benefit*. Marginal influence changes the margin but does not change the *election outcome* (e.g., turning a loss into a win). Since the instrumental account cares only about affecting the *outcome* (via pivotality), marginal influence provides no benefit. Claiming this rescues the instrumental account is incorrect.  
     - **Correction:** The distinction *highlights* the problem: instrumental voters care only about pivotality, which remains vanishingly small. Marginal influence is irrelevant to their calculus.  
     - **Cost:** **–12 marks** (Undermines core argument of (b)).  

  2. **"The expressive account... is a concession that voting is irrational"**  
     - **Error:** Conceptual misunderstanding.  
     - **Issue:** Equates "non-instrumental" with "irrational." Rational choice allows for expressive utility (e.g., fulfilling civic duty). The expressive account *redefines* rationality to include intrinsic benefits, resolving the paradox without abandoning rational choice.  
     - **Correction:** The account argues voting *is* rational if expressive utility outweighs cost. It repairs, not abandons, the framework.  
     - **Cost:** **–6 marks** (Misrepresents a key concept in (c)).  

  3. **"The conclusion is robust... nobody could have a reason to vote"**  
     - **Error:** Overstatement.  
     - **Issue:** While true under strict instrumental assumptions, the claim ignores how *relaxing* the 1/2 assumption (e.g., close elections) can increase pivot probability non-negligibly for some voters.  
     - **Correction:** Should note that pivot probability remains extremely low *unless* elections are very close or correlated.  
     - **Cost:** **–2 marks** (Minor imprecision in (a)).  

  4. **"My vote always has marginal influence... in a safe seat"**  
     - **Error:** Trivializes marginal influence.  
     - **Issue:** While technically true, in a "safe seat" (e.g., 80%–20% landslide), marginal influence is electorally insignificant. Instrumental voters would still derive no meaningful benefit.  
     - **Correction:** Acknowledge that marginal influence only matters if voters care about margin per se (unlikely under standard instrumentalism).  
     - **Cost:** **–2 marks** (Weak example in (b)).  

  5. **"Turnout rises when an election is expected to be close... awkward for a purely expressive story"**  
     - **Credit:** Correct observation, defensible!  
     - **Note:** The student validly points out that expressive accounts struggle to explain proximity-turnout correlation *if* expression is independent of competitiveness. This is a recognized weakness.  
     - **No penalty**.  

  ---

  ### 4. Model Answer (Compressed)  
  **(a)** The instrumental account views voting as a cost-benefit calculation where costs (time, effort) are incurred for a chance to influence the outcome. For large \(N\), the probability a vote is decisive (pivotal) equals \(2^{-(N-1)}\) under i.i.d. 1/2 voting. This probability is vanishingly small (e.g., \(\ll 10^{-6}\) for \(N>20\)), implying near-zero turnout—contradicting observed high turnout.  

  **(b)** **Pivotal influence** occurs when a vote changes the election winner (breaks a tie). **Marginal influence** occurs when a vote alters the winner’s margin without changing the outcome. The paradox persists because instrumental voters only benefit from pivotality, which remains negligible. Marginal influence cannot justify voting under instrumentalism since it does not affect the outcome. Thus, the account *is* refuted by observed turnout.  

  **(c)** The expressive account posits voting satisfies intrinsic preferences (e.g., civic duty expression), not instrumental goals. It resolves (not relocates) the paradox: costs are outweighed by expressive utility, making voting rational. However, it struggles to explain why turnout increases in close elections if expression is the sole motive. This suggests expressive and instrumental motives may coexist.  

