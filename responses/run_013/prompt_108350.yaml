prompt: |-
  I work on trust and safety for a mid-sized social platform, and I want to understand what the rule system I help administer is actually committed to. Here is the practice. Our Community Standards are, in principle, made by the community: a standing council of users drafts rules, the wider user base votes, and a rule takes effect once it has majority support. But our charter also contains a short list of behaviors that are barred no matter what the community decides; the council may not propose to permit them, and no vote can repeal the ban. The charter further draws a distinction I have never seen defended. It treats some norms as valid because they were endorsed by a majority, and others as valid because they express what the community already is -- values we are said to hold whether or not we have ever voted on them. The first kind can be revised by vote; the second is described as discovered rather than decided. Enforcement, meanwhile, is inconsistent in a way that nags at me. When we explain a ban, one script says the community has decided the behavior is not allowed, while another says the behavior is wrong and would be wrong even if most users disagreed. And we have at least one rule that passed a vote, was later declared by the council not to reflect our values, and is still enforced. One more detail: the charter itself was ratified by a user vote in the platform's early days, and we still cite that vote as the source of its authority, including for the norms we describe as discovered.

  What I want is the theory this practice presupposes. Is our rule system committed to the view that a behavior is prohibited because the community prohibits it, or that the community prohibits it because it is independently wrong -- and can it hold both without contradiction? Which side does the charter's second category, the norms that are discovered rather than decided, actually commit us to, and is that a genuine third option or a restatement of one of the first two -- especially given that the charter's own authority traces back to a vote? Distinguish what the practice strictly requires from what it merely happens to fit: could several incompatible theories license everything we do? Finally, tell me what would have to change -- in the charter, the voting procedure, or the enforcement scripts -- if we committed cleanly to one side, and what we would lose by doing so.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in trust and safety for a social platform with a unique rule system. The community votes on rules, but there's also a charter with unchangeable norms. The user is confused about the underlying theory—whether rules are valid because the community decides or because they're inherently wrong. 

  First, I need to parse the key elements: the council drafts rules, users vote, but some norms are non-negotiable. The charter distinguishes between voted norms and "discovered" values. Enforcement uses conflicting scripts, sometimes citing community decisions, other times moral wrongness. Plus, the charter itself was ratified by a vote, which complicates the "discovered" norms' authority.

  The user's main ask is the theory behind this practice. They want to know if the system is based on legal positivism (rules as social artifacts) or natural law (inherent morality), or if the "discovered" norms offer a third way. They also wonder if the current setup is coherent or if it's trying to straddle incompatible philosophies.

  Looking deeper, the user might be grappling with legitimacy issues. When enforcing rules, which justification holds more weight? The inconsistency in enforcement scripts could confuse users and moderators alike. The fact that a rule passed by vote was later rejected by the council as misaligned with values but still enforced adds to the confusion. This suggests a tension between democratic processes and perceived core values.

  The user's identity as a trust and safety professional implies they need clear principles for consistent enforcement and policy updates. Their unspoken need might be to resolve internal conflicts in their team or justify policy changes to stakeholders. They might also be concerned about user trust—if the platform's rules seem arbitrary, it could erode credibility.

  Next, analyzing the "discovered" norms. The charter claims these reflect the community's essence, but their authority comes from an initial vote. That's a contradiction. If they're discovered, why did they need ratification? This leans towards natural law but framed through community identity. However, since the community evolves, how do these static norms remain valid? The council's ability to overrule a voted rule based on values further blurs lines.

  The enforcement inconsistency is a red flag. Using both scripts interchangeably makes the system's foundation unclear. It risks appearing hypocritical—saying a rule is democratic when convenient but morally absolute when not. The user might be facing backlash from users noticing this inconsistency.

  Possible theories: The practice fits a hybrid model. The charter's unchangeable norms act like a constitution grounded in natural law, while other rules follow legal positivism. But the initial vote for the charter undermines that. Alternatively, it's a form of communitarianism, where values stem from shared identity. Yet, the vote-based authority conflicts with the discovery narrative.

  To commit cleanly to one theory, changes would be needed. For legal positivism, remove non-votable norms and attribute all rules to community decisions. For natural law, frame all prohibitions as inherent wrongs, which is risky for a diverse platform. Dropping the "discovered" language and clearly defining the charter's role could help hybrid coherence.

  The user might lose flexibility by committing fully. Hybrid allows balancing stability (core norms) with adaptability (voted rules). But the current implementation is messy. Recommendations: rework enforcement scripts for consistency, clarify the charter's status, and decide if the council can override votes based on values. Without changes, the system's legitimacy could be questioned, especially if users perceive contradictions.
answer: |-
  Your platform's rule system embodies a **hybrid legal-moral philosophy** that attempts to reconcile democratic positivism with communitarian natural law—but its unresolved tensions risk incoherence. Here's the breakdown:

  ### Core Theoretical Commitments
  1. **Legal Positivism (Community as Source):**  
     - Rules created by vote derive authority *solely* from the democratic procedure ("prohibited because the community prohibits it").  
     - *Manifested in:* Ratification of the charter, mutable rules based on majority votes.  

  2. **Modified Natural Law (Independent Wrongness):**  
     - Charter's non-repealable norms claim objective moral status ("prohibited because inherently wrong"), but anchor this in **communitarian essence** rather than universal morality.  
     - *Manifested in:* "Discovered" values said to express the community's identity ("who we are"), not contingent on votes.  

  3. **The "Discovered Norms" Paradox:**  
     - These claim to be **pre-political truths** about the community's character (a *third option* distinct from positivism/universal natural law).  
     - **Contradiction:** Their authority *formally* traces to the founding vote—undermining the "discovery" narrative. This makes them functionally equivalent to **entrenched constitutional provisions**, not transcendent truths.  

  ### Can Both Coexist Without Contradiction?  
  **Yes, but only with strict hierarchy:**  
  - The charter's non-repealable norms must be treated as a **higher constitutional layer** (grounded in natural law/communitarian essence).  
  - Voted rules are **ordinary legislation** (positivist).  
  - **Your inconsistency:** The council invoking "discovered values" to override a *validly passed rule* (e.g., the rule still enforced despite council rejection) collapses this hierarchy. It implies the council can bypass democracy by appealing to vague "values"—effectively installing itself as moral arbiter.  

  ### What Multiple Theories Fit the Practice?  
  | Theory                | Fits Voting System | Fits "Discovered" Norms | Fits Charter Ratification |  
  |-----------------------|-------------------|--------------------------|---------------------------|  
  | **Legal Positivism**  | ✅                 | ❌                        | ✅                         |  
  | **Natural Law**       | ❌                 | ✅                        | ❌                         |  
  | **Communitarianism**  | ⚠️ (Limited)      | ✅                        | ⚠️ (If vote=ratification) |  
  | **Constitutionalism** | ✅                 | ✅ (As foundational law)  | ✅                         |  

  **Communitarianism** best explains the "discovered" category: norms reflect the community's **shared identity/history**, not pure morality or pure procedure. But your appeal to the founding vote weakens this.  

  ### Clean Commitments: Changes & Tradeoffs  
  **Option 1: Full Legal Positivism**  
  - **Changes:**  
    - Remove all non-repealable charter norms.  
    - Allow *any* rule (e.g., hate speech, violence) to be proposed/voted on.  
    - Scripts must *only* say: "This violated Rule X, passed by majority vote on [date]."  
  - **Losses:**  
    - Moral legitimacy for extreme harms ("Why vote on whether assault is wrong?").  
    - Risk of "tyranny of the majority" (e.g., voting to permit harassment of minorities).  

  **Option 2: Natural Law + Democracy**  
  - **Changes:**  
    - Charter norms must reference *universal* wrongs (e.g., "violates human dignity"), not community identity.  
    - Scripts must *only* say: "This behavior is inherently harmful, as recognized by our charter."  
    - Founding vote framed as *acknowledging* pre-existing truths, not creating them.  
  - **Losses:**  
    - Flexibility to adapt to cultural shifts.  
    - Democratic legitimacy ("Who decides what's 'inherently wrong'?").  

  **Option 3: Coherent Constitutionalism (Recommended)**  
  - **Changes to Resolve Tensions:**  
    - Rebrand "discovered" norms as **constitutional principles** explicitly ratified by the founding vote.  
    - Charter amendment process (e.g., supermajority) to modify these norms—*no council veto*.  
    - Scripts must distinguish:  
      - "This violates Constitutional Principle Y, ratified [date]."  
      - "This violates Community Rule X, passed [date]."  
    - Council *cannot* invalidate passed rules—only propose repeals/revisions to voters.  
  - **Retains:**  
    - Core values (as constitutional guardrails).  
    - Democratic legitimacy (clear hierarchy of norms).  

  ### Why Your Current Practice is Unstable  
  - **Self-Undermining Authority:** Claiming norms are "discovered" (pre-existing) while citing the founding vote implies they *were* decided—contradicting their ontological status.  
  - **Enforcement Confusion:** Switching scripts between "community decided" and "inherently wrong" suggests moral relativism *and* absolutism simultaneously.  
  - **Council Overreach:** Declaring a voted rule "not our values" while enforcing it positions the council above democracy *and* the charter.  

  ### Practical Steps for Coherence  
  1. **Clarify the Charter:** Explicitly frame non-repealable norms as **constitutional foundations** adopted via the founding vote—not "discovered."  
  2. **Fix Enforcement Scripts:**  
     - Use constitutional language for charter violations ("violates our foundational commitment to X").  
     - Use positivist language for voted rules ("prohibited under Rule Y, enacted [date]").  
  3. **Remove Council Veto:** Require a new vote to repeal any rule—even if the council deems it "out of step."  

  This resolves the contradictions while preserving your hybrid intent: the constitution protects core values, while democracy shapes everyday norms. Without these changes, your system risks being seen as **democratic when convenient and authoritarian when not**—eroding trust in both the council and the process.
