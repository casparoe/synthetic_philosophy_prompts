prompt: |-
  So I've been going back and forth with a friend about Dutch book arguments and I want an actual number out of you, plus the guts of it.

  The claim I want your credence in: an agent whose degrees of belief violate the probability axioms is epistemically irrational — she has a reason to fix them that's owed to her qua believer, not just a prudential reason to avoid getting fleeced. Call it C. I'll grant for free that she's 'inconsistent' and that she'd lose money. The question is whether the incoherence is a defect in her as a believer. If you think C isn't even well-formed, say why, but then tell me which precisification you'd defend and give the number for that one.

  I'm at 0.55 on C, my friend is at 0.15, and I want your number and, more importantly, the decomposition. Here's roughly what I want broken out — add a term if I've missed one, drop one if it's doing no work:

  1. The betting premise. The classic version only bites if credences are constitutively tied to dispositions to accept or reject bets at certain odds. How likely is it that some version of that premise is true? And conditional on it being false, does any version of the argument survive, or is the whole thing dead at that point?

  2. The pragmatic/epistemic gap. Suppose the book really works and she'd lose for sure. How much does that tell us about her as a believer rather than as a wallet-owner? I want a number for the probability that sure-loss vulnerability is an epistemic defect at all, as opposed to a fact about her and money.

  3. The broke non-bettor. Take an agent with no money who never bets and doesn't care about money. Is there a repair where the stakes are purely doxastic — she 'loses' only in the sense of being wrong, or of doing worse on accuracy — and if so, does that repair actually work, or does it just quietly turn into point 4 with extra steps?

  4. Accuracy dominance. The better move, I think: her incoherent credence function is accuracy-dominated, i.e. there's always some coherent one that's at least as accurate in every possible world, under any reasonable scoring rule. Give me the probability that this dominance claim is actually true as stated, and then seperately the probability that, even if true, it establishes irrationality rather than mere suboptimality.

  5. The premise underneath 4. 'Epistemic value = accuracy, and you should maximise expected accuracy' — is that independently motivated, or is it carrying the entire argument? This is where I suspect my 0.55 is too high.

  6. Anything left over that doesn't route through 1–5.

  Then: how do those combine into your final number, and which single sub-question is it most sensitive to — if you had to be wrong about one of them, which would move C the most, and what would you have to see for it to move? Also, my friend and I differ by 0.4, and he's a deflationist about credence talk (thinks 'degree of belief' is a useful fiction and nothing more). Which term is our disagreement most likely actually living in?

  One thing I don't want: 'it depends what you mean by rationality.' That's exactly the thing I'm asking you to unpack into pieces. If the honest answer is that 2 and 5 are doing all the work and the rest is decoration, just say so.
