prompt: |-
  My roommate has been building this argument for a week and I cant find the hole in it. (1) To say a glass is fragile is just to say it would break if struck. (2) But you can always cook up a case where the glass is fragile and the conditional still fails — a machine that would harden the glass to diamond the instant anything got near it, so it never breaks though it's fragile right up until the moment of the strike; or the glass sealed inside a transparent shell that stops it shattering no matter how hard you hit it, while the glass itself stays as fragile as ever. (3) So the analysis has to read "...would break if struck, and nothing interferes." (4) But you can only say what counts as interfering by saying what would stop the breaking, and to know what stops the breaking you already have to know what fragility is. (5) So the analysis is circular, and fragility — like every disposition — can't be assembled out of plain non-dispositional facts; it's primitive. (6) And nothing here is special to glass. Same recipe on "this match would light if struck," "this pill would kill if swallowed," and, she says, on causation: c caused e only if e wouldn't have happened without c — and the same kind of meddling (a backup cause waiting in the wings, a trigger that gets pre-empted) breaks that counterfactual too. (7) So either causation is primitive as well, or the counterfactual theory of causation is dead. Honestly I'd shrug and say fragility is primitive, that bit doesn't bother me — but (7) can't be right, I don't believe the counterfactual theory of causation is just dead. So which step do I tell her to give up, why does that step look so innocent until you push on it, and what does giving it up cost her? In particular, if (4) goes, does (5) go with it, and can she keep the counterfactual theory of causation while dropping the conditional analysis of dispositions, or is that just having it both ways?

  After the answer, give me a small table with these columns: step (the number and a few words of what it says), verdict (keep / reject / needs refining), why it looked innocent, what rejecting it costs, what it protects.
