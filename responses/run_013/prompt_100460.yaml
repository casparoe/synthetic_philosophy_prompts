  I'm in a reading group that's working through some of the epistemic game theory literature, and last week one of the more confident members offered us the following summary of the common prior assumption and Aumann's agreement theorem, which he presented as the settled view: "The common prior assumption is the doctrine that rational agents must have identical beliefs about the world before they receive any information — it's the technical form of what's called the Harsanyi doctrine, the claim that all disagreement is ultimately a product of irrationality. Aumann's agreement theorem proves the point: he showed that if two rational agents have common knowledge of each other's beliefs, they must already agree, so any persistent disagreement between two people is proof that at least one of them is being irrational. This is why the theorem is treated as such a devastating result — it undermines the idea that reasonable people can disagree — and it's why game theorists regard any model built on heterogeneous priors as simply mistaken."

  I suspect this is unfair. I have a vague memory that the theorem is far narrower than he made it sound, and that it's usually invoked with a lot of hedges about idealization, but I don't know the literature well enough to locate the distortion, and he spoke with enough confidence that I didn't want to push back. Could you go through the summary claim by claim and tell me which parts a decision theorist or game theorist would accept as stated, which are common simplifications that need qualification, and which are outright wrong? I'd especially like to know what the common prior assumption actually asserts, and whether it is a requirement of rationality or merely a modeling assumption; what exactly Aumann's theorem does and does not establish, including the conditions it relies on; whether disagreement really does imply irrationality under the theorem; and whether the consequences he draws about reasonable disagreement and about heterogeneous-prior models follow from anything true in the summary.

  Please keep the response to no more than 600 words, and organize it so I can see, claim by claim, what survives and what doesn't.
