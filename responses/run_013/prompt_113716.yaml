  ### Residue Report: What Translates, What Doesn’t  
  #### Clean Translations  
  - **Decision Variables/Feasible Set**: Direct analogues.  
  - **Rights as Hard Constraints**: Perfect mapping if rights control variables (e.g., Ana sets `Ana_cooks`).  
  - **Pareto as Constraint**: Cleanly modelled as "no feasible state dominates the chosen state".  
  - **UNSAT Core**: The paradox manifests as an unsatisfiable CSP.  

  #### Manged Translations  
  - **Preferences as Soft Constraints**: In Sen, preferences *define* the rights/Pareto conditions—they aren’t optimised over. Your scheduler analogy (weighting objectives) doesn’t apply directly.  
  - **The "Group Prefers" Concept**: No direct counterpart. Pareto is a *constraint*, not an objective to maximise.  
  - **Rights in Pairwise Choices**: Sen’s rights condition is defined over *pairs of states*, but in CSP, rights control *variables*. This works for your example but may not generalise (e.g., if rights involve complex state comparisons).  

  #### No Counterpart  
  - **Normative Value of Autonomy**: The CSP cannot capture *why* we care about rights (e.g., intrinsic dignity of choice). It treats rights as technical constraints.  
  - **Universal Applicability**: Sen’s theorem proves *no possible rule* works for *all* preference profiles. CSP only checks specific instances.  

