answer: |-
  Below is a decision tree designed to guide students from core commitments about historical agency to named positions in the Great Man vs. structural explanation debate. The tree uses the Hitler/Nazi Germany counterfactual as a running example but generalizes to other cases. It has **7 branch nodes** (questions) and **8 terminal leaves** (named positions), built from the logical space of your specified distinctions. Each node is a concrete, answerable question that does not require prior knowledge of the debate. Students are sorted based on their answers about cases, not pre-existing preferences.  

  ### Decision Tree  
  *Answer each question based on your beliefs about how historical change occurs (e.g., "Would Nazi Germany have arisen without Hitler?").*  

  1. **If we remove the pivotal individual, does the broad outcome (e.g., a Nazi-like regime in Germany) vanish entirely?**  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q5.  

  2. **Is the individual’s role primarily to *set in motion* forces already present (e.g., timing, coordination), rather than *defining* the outcome’s content/direction?**  
     - **Yes** (Trigger role) → Go to Q3.  
     - **No** (Author role) → Go to Q4.  

  3. **Could a near-identical substitute (same skills/dispositions, different identity) have achieved the same outcome?**  
     - **Yes** → **Structural Probabilism** (Individuals shift the likelihood of structurally possible outcomes).  
     - **No** → **Unique Trigger Theory** (Only that individual could activate latent forces).  

  4. **Does structure determine the *menu of possible outcomes*, even if not the exact one?**  
     - **Yes** → **Conjunctural Theory** (Individuals select from structurally available paths).  
     - **No** → **Great Man Theory** (Individuals define outcomes beyond structural constraints).  

  5. **Does the outcome persist via a *substitute individual* stepping into the role?**  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q7.  

  6. **How similar must the substitute be to preserve the outcome?**  
     - **Near-identical** → **Token Necessity** (Only a near-double suffices; structure enables but doesn’t dictate).  
     - **Ordinary contemporary** → **Trigger Theory** (Any competent actor in the role would suffice).  
     - **Rival with opposite aims** → **Situational Role Theory** (The role forces any occupant toward the outcome).  

  7. **Does structure make the outcome *inevitable* (e.g., due to economics, institutions, culture)?**  
     - **Yes** → **Structural Determinism** (Outcomes are structurally guaranteed).  
     - **No** → **Accident Theory** (Outcomes depend on chaotic, non-structural contingencies).  

  ---

  ### Terminal Leaves (Named Positions)  
  1. **Great Man Theory**:  
     - *Most awkward commitment*: Even in rigid structures, individuals’ unique ideas/charisma override constraints.  
  2. **Structural Determinism**:  
     - *Most awkward commitment*: Seemingly pivotal individuals are mere "placeholders" with no real agency.  
  3. **Structural Probabilism**:  
     - *Most awkward commitment*: Quantifying exact probabilities of outcomes is empirically intractable.  
  4. **Conjunctural Theory**:  
     - *Most awkward commitment*: Explaining why an individual chose one path over another relies on underdeveloped agency models.  
  5. **Unique Trigger Theory**:  
     - *Most awkward commitment*: Forces were "primed" for the outcome, yet *only* that individual could activate them.  
  6. **Trigger Theory**:  
     - *Most awkward commitment*: The outcome would occur identically even with substitutes, yet its timing/form is attributed to the individual.  
  7. **Situational Role Theory**:  
     - *Most awkward commitment*: Even an opposed actor (e.g., an anti-racist in Hitler’s role) would produce the same outcome.  
  8. **Accident Theory**:  
     - *Most awkward commitment*: Denying predictable patterns risks reducing history to chaos.  
  9. **Token Necessity**:  
     - *Most awkward commitment*: A near-double could replicate the outcome, but no such person existed or was likely.  

  ---

  ### Notes on the Tree  
  - **Unseparated Leaves**:  
    - *Unique Trigger Theory* and *Structural Probabilism* share triggers but diverge on substitutability (Q3). The tree separates them via substitutability.  
    - *Conjunctural Theory* and *Great Man Theory* both require the individual (Q1=Yes) but diverge on structural constraints (Q4).  
  - **Empty Combinations**: Diagnosed below.  
    | **Combination** | **Why Empty?** | **Diagnosis** |  
    |------------------|----------------|---------------|  
    | Q1=No + Q5=No + Q7=No (Accident Theory) + Substitute = Rival | Incoherent | If no structure *and* no substitute, a rival preserving the outcome contradicts "accident." |  
    | Q2=No (Author) + Q5=Yes (Substitute exists) | Unattractive | Authorship implies irreplaceability; allowing substitutes undermines "author" role. |  
    | Q1=No + Q5=Yes + Substitute = Near-identical | Unexplored | Token Necessity exists but is rare; few argue a near-double *must* appear in re-equilibration. |  

  - **Design Logic**:  
    - Starts with **removal consequence** (Q1: vanish/re-equilibrate), then **role type** (Q2: trigger/author), **substitutability** (Q3, Q6), **structural power** (Q4, Q7), and **displacement vs. diversion** (implied in Q1/Q5).  
    - Generalizes beyond Hitler: Replace "Nazi Germany" with any outcome (e.g., "Industrial Revolution without Watt") and "individual" with any agent.  
    - Avoids famous names: Positions derive from logical combinations of commitments (e.g., "Token Necessity" for near-double substitutability).  

  This tree fits your constraints (7 nodes, 8 leaves) and isolates coherent positions from your specified distinctions. Students can self-sort without prior theory knowledge, using concrete historical reasoning.
