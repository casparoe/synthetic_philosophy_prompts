  I need to address each disanalogy. The first is critical: if structure is abstracted after the fact, it doesn't explain success; it's cherry-picking. The second disanalogy challenges the gradual change assumption—Kuhnian revolutions involve form changes too. The third highlights a category error: persistence vs. reference. The first two are fatal to the inference, while the third is problematic but not as severe.

