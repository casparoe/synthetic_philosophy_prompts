prompt: |-
  A friend of mine has spent the past year talking himself into the view that the only thing that ultimately matters about an action is how things go for everyone it touches, and a few months ago he put a question to me that I have not been able to put down. He had been trying to decide whether to keep his car or sell it, and found that the answer came out one way when he counted the consequences over the next year or so and the opposite way when he counted them over the next few centuries; when I asked where he thought he should stop counting, he said he could see no principled place to stop, only convenient ones — where the data ran out, or where the chain of effects became too tangled to follow. What struck me was not the ignorance, which is obvious enough, but that the verdict was a function of a cut-off he had chosen for no better reason than convenience, and that an equally convenient cut-off elsewhere would have flipped it. Nor was it confined to cars. On the same reasoning, the difference between my buying a coffee and giving the money away is trivial over a day and enormous over a century; a friend of ours insists that her vote can never be decisive and is therefore ethically inert, which I recognise as the same shape of mistake pointing the other way; and my friend is left saying both that nothing he does can be ranked against anything else and that some quite ordinary things he does matter as much as a war.

  I have since noticed that people who take this seriously settle into one of two habits, and both feel like choices rather than conclusions. Some quietly draw a boundary, count only the near effects, and stop using the old vocabulary about themselves; others go the other way and treat the very far future as the only thing that matters, so that almost every ordinary concern becomes noise. I have also noticed that the difficulty seems to come in two strengths, and I cannot tell whether they are one problem or two: the weaker is simply that we cannot know the numbers, the stronger is that even with the numbers the total would be dominated by effects so far out, and so dependent on how the domain is drawn, that it has no determinate value at all. If the second is right, then the standard appears to give no verdict on its own application — including on the verdict that it gives no verdict.

  What I want to know is whether this shape of difficulty already has a name. I realise there is probably a literature on the unknowability of distant consequences, but I am sceptical that the cut-off-dependence and the self-application are part of the named thing rather than separate complaints bolted onto it, and I suspect that what I am describing is two or three problems wearing one coat. So I would rather have the phenomenon taken apart than labelled: what exactly is being claimed, which parts of it are genuinely distinct, what the nearest established ideas are and how each of them differs from what I have described, and, if nothing fits, a term of your own with a definition and the boundary cases that would test it. You needn't give me a reading list; I am after the concepts. Where people who work on this agree, tell me it is settled; where they do not, tell me that, and do not let a contested reading pass as the consensus. Please write in American English.
reasoning: |-
  Okay, the user is presenting a complex ethical dilemma involving how far into the future we should consider the consequences of our actions. Their friend is grappling with the idea that the ethical value of an action depends entirely on its consequences for everyone affected, but this leads to a problem when deciding where to "cut off" the timeframe for considering those consequences. 

  The user observes that this creates unstable ethical judgments - for example, selling a car might be better when looking at short-term effects but worse over centuries. They note similar issues with everyday choices like buying coffee versus donating money, or whether voting matters. 

  What strikes the user as particularly troubling is that the ethical verdict seems entirely dependent on an arbitrary cutoff point chosen for convenience, not principle. They've noticed people tend to resolve this in two ways: either focusing only on near-term consequences or prioritizing only the far future. 

  The user identifies two layers to this problem: the practical unknowability of distant consequences (which seems manageable) and the more fundamental issue that even if we could know all effects, the "total consequence" might be mathematically indeterminate - dominated by speculative far-future effects that depend entirely on how we define the scope.

  Their core request is for conceptual clarification rather than labels. They want: 
  - The underlying claims dissected 
  - Distinct problems separated 
  - Comparison to established philosophical ideas 
  - Clear differences highlighted 
  - If no existing concept fits, a newly defined term

  The user seems philosophically sophisticated - they're aware of potential literature but skeptical about how well existing frameworks address the cutoff-dependence and self-referential aspects. They're explicitly not asking for reading lists but conceptual mapping. 

  I need to carefully separate several intertwined issues here. First, the epistemic problem of predicting consequences. Second, the temporal boundary problem. Third, the mathematical indeterminacy issue. Fourth, the self-referential paradox when the framework can't evaluate itself. 

  For existing concepts: 
  - Utilitarianism's scope problem is relevant but usually assumes a fixed scope 
  - Infinite ethics literature deals with undefined sums but rarely addresses cut-off dependence 
  - Decision theory has "cluelessness" about distant effects but not the valuation indeterminacy 
  - Parfit's work comes closest but doesn't fully capture how the verdict flips based on arbitrary cutoffs

  The truly novel aspect seems to be how the ethical valuation becomes a discontinuous function of cutoff choice - small changes in timeframe radically alter what appears ethical. This makes the entire consequentialist project vulnerable to manipulation through scope framing.

  The self-application problem is particularly thorny - if the method can't consistently evaluate its own application, that suggests a deeper formal limitation. This resembles Gödelian incompleteness but in ethical reasoning.

  I should define a new term for this cutoff-dependence phenomenon: "Temporal Valuation Instability" - where small changes in timeframe cause discontinuous jumps in ethical valuation of actions. The boundary test would be whether the ranking of alternatives remains stable as evaluation period extends.

  For the indeterminacy: "Consequence Integral Divergence" - when the cumulative effect sum fails to converge to any finite value. Test case would be whether adding plausible future scenarios makes the sum oscillate or grow without bound.

  The self-referential issue might be called "Framework Reflexivity Failure" - when an ethical framework cannot consistently evaluate decisions about its own application.

  The user's observation about people resolving this in polarized ways (near-term vs. far-future focus) suggests these aren't solutions but escapes from the discomfort of the instability. That psychological dimension is worth noting but not the user's primary concern.

  Most importantly, I must avoid presenting contested theories (like discount rates) as consensus. The literature is deeply divided on whether to discount future welfare, how to handle infinite time horizons, and whether consequentialism can be salvaged from these problems. I'll explicitly note where philosophers disagree.
answer: |-
  This phenomenon involves several distinct but interwoven philosophical problems. I'll dissect it conceptually, identify established ideas, highlight differences, and define new terms where necessary—all while noting points of consensus and disagreement in the literature. The core issues break down as follows:

  ---

  ### **1. The Epistemic Problem (The "Weaker" Difficulty)**
     - **Claim**: We cannot accurately predict long-term consequences due to ignorance (missing data, chaotic systems, complexity).
     - **Established Concept**: **Cluelessness** (from Derek Parfit and later ethicists).  
       - **Definition**: The practical impossibility of knowing whether an action's distant effects will be net positive or negative.  
       - **Difference**: Cluelessness focuses on *unknowability*, but your friend's issue extends to how this interacts with *arbitrary cut-offs*. It doesn't address the valuation flip when cut-offs change.  
     - **Consensus**: Ethicists agree cluelessness is real, but **disagree** on whether it undermines consequentialism. Some argue for "expected value" calculations; others say it forces non-consequentialist fallbacks.

  ---

  ### **2. The Temporal Boundary Problem (Cut-Off Dependence)**
     - **Claim**: Ethical verdicts change dramatically based on where we arbitrarily stop counting consequences (e.g., 1 year vs. 500 years).  
     - **Established Concepts**:  
       - **Scope Insensitivity in Utilitarianism**: Classical utilitarianism (Bentham, Mill) assumes we count *all* affected beings, but lacks a non-arbitrary temporal boundary.  
       - **Discount Rates**: Economics uses fixed rates (e.g., 3% per year) to devalue future effects, but these are **contested** as ethically unjustified (e.g., Stern vs. Nordhaus on climate policy).  
     - **Key Difference**: Your cases show cut-offs don't just *adjust* verdicts—they *reverse* them (e.g., car decision flips). This isn't about imprecision; it's indeterminacy.  
     - **New Term**: **Cut-off Reversal Instability**  
       - **Definition**: When an action's net ethical value (under consequentialism) reverses sign (positive/negative) based on arbitrary selection of a temporal evaluation window.  
       - **Test Cases**:  
          - Buying coffee vs. donating: Trivial harm over days, catastrophic over centuries (due to compounding effects).  
          - Voting: Negligible immediate impact, potentially pivotal in long-term causal chains.  

  ---

  ### **3. The Aggregation Problem (The "Stronger" Difficulty)**
     - **Claim**: Even with perfect knowledge, the "total" consequence may be undefined—dominated by speculative far-future effects that swamp near-term effects.  
     - **Established Concepts**:  
       - **Infinity Problems in Ethics**: E.g., the "Pinprick Argument" (if future suffering is infinite, all actions are equally bad).  
       - **Value Incommensurability**: Some effects (e.g., existential risks) might be incomparable to mundane ones.  
     - **Difference**: Your case emphasizes *dependence on domain specification* (how effects are "drawn"), not just infinity. The total isn't infinite—it's *indeterminate* due to cut-off sensitivity.  
     - **New Term**: **Consequential Entanglement**  
       - **Definition**: When an action's effects are so causally entangled with all other events that no finite, unique "net effect" can be assigned, regardless of timescale.  
       - **Test Case**: Selling a car might alter traffic patterns, influencing who meets whom, potentially changing the course of technology or politics centuries later. With unbounded time, every action merges into the causal history of everything.  

  ---

  ### **4. The Self-Application Problem**
     - **Claim**: If consequentialism cannot yield stable verdicts, it cannot evaluate *its own application* (e.g., whether to "use cut-offs" or "ignore far futures").  
     - **Established Concept**: **Moral Self-Defeat** (Parfit, Singer).  
       - **Definition**: When following a moral theory leads to worse outcomes than rejecting it.  
       - **Difference**: Your case is *epistemic* self-defeat: the theory lacks resources to resolve its own indeterminacy.  
     - **Consensus**: This is **unsettled**. Some consequentialists accept "second-order" rules (e.g., "ignore effects beyond 100 years"); others call this ad hoc.  

  ---

  ### **How the Problems Interact**
  1. **Cluelessness** (unknowability) exacerbates **Cut-off Reversal Instability** (arbitrariness).  
  2. **Consequential Entanglement** makes the "total" effect undefined, forcing cut-offs.  
  3. Together, they create **Self-Defeat**: Consequentialism cannot guide its own implementation.  

  ---

  ### **Established Ideas vs. Your Description**
  | Concept               | Matches Your Case? | Difference |
  |-----------------------|---------------------|-------------|
  | Cluelessness          | Partially           | Ignores cut-off reversal; focuses on ignorance, not indeterminacy. |
  | Discount Rates        | No                  | Assumes a fixed, justified rate; your case rejects this as arbitrary. |
  | Infinite Ethics       | Partially           | Addresses "swamping" by far futures, but not domain-dependence. |
  | Expected Value Maximization | No        | Requires probabilities; fails when effects are indeterminate. |

  ---

  ### **Why Ethicists Disagree on Solutions**
  - **Proximity Advocates** (near-term focus): Argue that long-term effects are unpredictable or morally irrelevant. **Critique**: Ignores large-scale risks (e.g., climate change).  
  - **Long-Termists** (far-future focus): Prioritize reducing existential risks (e.g., MacAskill, Ord). **Critique**: Dismisses ordinary morality as "noise."  
  - **Consensus Gap**: No agreement on whether cut-offs are necessary, how to set them, or if consequentialism can survive this challenge.  

  ---

  ### **Synthesis: The Core Phenomenon**
  - **Name**: **Temporal Valuation Instability (TVI)**  
    - **Definition**: The failure of consequentialist evaluation to produce stable, non-arbitrary verdicts due to (a) cut-off reversal effects, (b) causal entanglement, and (c) self-referential indeterminacy.  
    - **Boundary Test**: If an action's ethical ranking *reverses* based on a cut-off choice **and** no non-arbitrary cut-off exists **and** this persists even with perfect knowledge, it exemplifies TVI.  

  This isn't one problem but three layered together: epistemic limits, temporal arbitrariness, and metaphysical indeterminacy. The self-application problem emerges from their combination. While cluelessness is well-studied, TVI’s cut-off dependence and entanglement are underdeveloped in ethics—making your friend’s dilemma a sharp challenge to consequentialism’s coherence.
