answer: |-
  ### Core claim: Citizenship means belonging to a particular promise we keep together – not because it’s the only promise that matters, but because it’s the one that’s now *yours* to help uphold.

  ***

  **Speech (Approx. 650 words):**

  Welcome! Truly, deeply, welcome. Welcome to this moment, this milestone, this new chapter. Welcome *home*.

  Look around you. Look at the faces beside you, in front of you, behind you. These are your fellow citizens now. You share something profound: you chose this. You studied, you waited, you took an oath. You didn’t just arrive here by chance; you worked to belong *here*, specifically. And today, we celebrate that choice, that effort, that belonging.

  But citizenship isn't just a certificate you hang on the wall. It isn’t just the end of a long journey. It’s the beginning of a new kind of responsibility. It’s about stepping into the stream of this nation’s life – its messy, wonderful, demanding life – and adding your strength.

  Think about what brought you this far. Think about the roads you traveled, the schools your children attend, the safety you found here – maybe for the first time in your lives. Think about the courts you trusted, the parks you enjoyed, the clean water you drank. These things didn’t just happen. They exist because generations of people before us – citizens just like you are now – built them, paid for them, argued about them, fixed them, and passed them on. They were part of a vast, ongoing project: building a society together.

  That’s the first thing you inherit today: the *benefits* of that project. The peace, the opportunity, the infrastructure. And with those benefits comes a natural duty: fairness. It’s only fair, isn’t it, that now you help keep it going? That you contribute your energy, your ideas, your taxes, your vote? That you help maintain the very things that helped you? That’s the fair-play of citizenship. You’ve taken shelter in this house; now you help sweep the floors and fix the roof.

  But it’s more than just fairness. It’s also about connection. You now stand in a special relationship with millions of other people – people you’ve never met, people who look different, think differently, pray differently, or don't pray at all. You are bound to them. Not just by shared benefits, but by shared fate. The air we breathe? Shared. The safety of our streets? Shared. The future of our children? Shared. We succeed together, or we struggle together.

  This relationship – this *citizenship* – creates new obligations. Obligations to *these* people, *this* community, *this* country. To listen, even when it’s hard. To participate, even when you’re tired. To defend the rights of others, even those you disagree with. To help solve *our* problems.

  Now, I know a question might rise in your minds. It’s a good question, an honest one. The world is vast and full of suffering. Why should your strongest obligations be to *this* particular group of people? Why here and not somewhere else? Why these neighbors and not strangers oceans away who need help just as much, or more?

  That question matters. It speaks to a good heart. The pull of human suffering *anywhere* is real and important. Ignoring it would make us smaller.

  But here’s the thing about citizenship: it doesn’t ask you to ignore the wider world. In fact, a strong, caring community *enables* us to look outward. But it does ask you to recognize that *this* relationship – the one you chose, the one you swore an oath to today – is unique. It’s specific. It’s grounded. You didn’t swear an oath to all humanity today; you swore an oath to *this* Constitution, *this* republic, *these* fellow citizens.

  This specific bond doesn’t erase your connection to others across the globe. But it *does* mean you have a concrete place to start making a difference. A place where you know the language (even if it’s still new!), where you understand some of the problems, where you have a voice and a vote. This is your community now. These are your people. The well-being of this specific place, and these specific people sitting around you right now, is now your direct concern. *Here* is where your promise lives.

  So, what do you owe your fellow citizens? You owe them your presence. Your participation. Your fairness. Your willingness to listen and learn. Your commitment to building *this* place, together. You owe it to *them* because they are now your partners in this grand, imperfect, ongoing project called America.

  You’ve taken the benefits. You’ve made the promise. Today, you become stewards.

  Welcome home, citizens. Now, let’s get to work – together.
