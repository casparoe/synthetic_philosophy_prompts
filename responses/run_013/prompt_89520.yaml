answer: |-
  Here's a meticulous translation of the three probability interpretations into your operational vocabulary, followed by a residue analysis and answers to your specific queries. I've structured it as requested: rough mappings first, then polished translation, residue report, and synthesis.

  ---

  ### **Rough Mappings**
  1. **Frequentism (Long-Run Frequency):**  
     - *Core:* Probability = limiting relative frequency in infinite identical trials.  
     - *Your Frame:* **Test distribution performance under repeated backtests.** "Probability" emerges from aggregate behavior over many test-set evaluations.  
     - *Single-case:* Not directly defined → *Predictive distribution marginalized over unseen trials.*  

  2. **Bayesianism (Personalist Degrees of Belief):**  
     - *Core:* Probability = coherent, bettable belief quantified by prior→posterior updating.  
     - *Your Frame:* **Prior/posterior/predictive distributions + scoring rule coherence.** Beliefs are *models* updated via Bayes' theorem and validated by calibration/scoring.  
     - *Coherence:* Enforced by proper scoring rules and Dutch book arguments ↔ loss avoidance.  

  3. **Propensity (Physical Disposition):**  
     - *Core:* Probability = objective tendency of a *specific setup* to produce outcomes (e.g., a coin's bias).  
     - *Your Frame:* **Idealized model class assumed to be causally faithful.** The "true" data-generating process (DGP) your model class approximates.  
     - *Challenge:* Unobservable → only inferred via model performance under distribution shift.  

  ---

  ### **Polished Translation**  
  **1. Frequentism → Calibrated Backtests**  
  Probability is the **long-run test-set accuracy** of a forecasting rule. For event type "A", *P(A)* is the expected accuracy when deploying your model on infinitely many fresh test sets drawn from a stationary DGP.  
  - *Single-case "A"*: Not a frequency property → **predictive probability *P(A|X)*** marginalized over your model's epistemic uncertainty (e.g., posterior predictive for a specific instance).  
  - *Reference classes*: Become **feature selection/engineering problems**. Choosing whether to condition on *X* (e.g., "diabetic") or *X'* (e.g., "diabetic+hypertensive") is model specification, tested via cross-validation or holdout sets.  

  **2. Bayesianism → Coherent Updating & Validation**  
  Probability is a **calibrated predictive distribution** that avoids sure loss under scoring rules. Your *prior* encodes pre-data constraints/regularization; the *likelihood* is your chosen model class; the *posterior* is the updated belief state. Coherence is enforced by:  
  - **Proper scoring rules**: E.g., log-loss minimization ↔ avoiding Dutch books.  
  - **Calibration curves**: *P(A|X)=p* should align with empirical frequency in test data.  
  - *Degrees of belief* are **actionable forecasts** validated by out-of-sample performance.  

  **3. Propensity → Model Class as Causal Claim**  
  Probability is the **idealized DGP implied by your model class**. If you posit a Bernoulli model for a coin flip, *p* isn’t just a parameter—it’s a claim about the coin’s *physical disposition*. Propensity manifests when:  
  - Your model **generalizes robustly** under distribution shifts (e.g., lab→field).  
  - Ensembles/conformal methods can’t improve predictions → your model class **captures causal invariants**.  
  - *But*: You only ever measure **model-relative propensities** (e.g., "Bernoulli with *p=0.6*" fits best).  

  ---

  ### **Residue Report**  
  **What Translates Cleanly:**  
  - Frequentist long-run ↔ **Backtest averages** over multiple test sets.  
  - Bayesian updating ↔ **Prior→posterior→predictive pipeline** with scoring rule validation.  
  - Reference classes ↔ **Feature engineering**; the "problem" dissolves into empirical model comparison (e.g., AIC, cross-validation).  

  **Distortions Required:**  
  - **Single-case probability**:  
    - *Philosophers' angst*: "Does a *single* coin flip *have* a probability?"  
    - *Your frame*: Just **predictive *P(A|X)*** — a model output, not an ontological claim. The "distortion" is ignoring metaphysical questions about singular events.  
  - **Propensities**:  
    - *Your take*: Propensity is **reified model class fidelity**. Claiming "this coin *has* propensity *p*" is equivalent to asserting "a Bernoulli model with fixed *p* survives all conceivable backtests."  
    - *Distortion*: Propensities are always **model-relative**; you can't confirm them without a modeling scaffold.  

  **No Counterpart in Your Vocabulary:**  
  - **Metaphysical grounding**: Philosophers debate *why* probabilities exist (e.g., "Do propensities objectively reside in coins?"). Your workflow replaces this with **pragmatic model validation**.  
  - **Infinite repetitions**: Frequentism relies on *limits* of infinite trials; you work with finite test sets and uncertainty intervals.  
  - **Non-epistemic chance**: The idea that probabilities exist *without a modeler* (e.g., quantum propensities) has no direct analog—you only deal with *representations*.  

  ---

  ### **Your Specific Queries**  
  **1. Single-case vs. long-run = Predictive distribution vs. backtest?**  
  > **Yes—but with a caveat**. A backtest *measures* long-run frequency; a predictive distribution *quantifies uncertainty* for a single case. The philosophical distinction collapses into:  
  > - *Long-run*: Empirical average over test instances.  
  > - *Single-case*: Model output for one instance.  
  > No extra mystery—just two views of the same tool.  

  **2. Reference class problem → Feature selection?**  
  > **Not a dodge—it’s the solution**. Philosophers treat reference classes as a paradox (e.g., "Is Socrates mortal *as a man* or *as a philosopher*?"). You reframe it as:  
  > - **Conditioning on relevant features**: Use domain knowledge + model selection (e.g., PAC learning, SHAP values) to pick *X*.  
  > - **Validation via calibration**: If *P(A|X=x)* is calibrated across *x*, your features are adequate.  
  > The "problem" vanishes into standard ML practice.  

  **3. Propensity: World or model class?**  
  > **It’s both—but you only access it through models**. Propensity is a claim that your model class **captures causal structure**. Evidence:  
  > - Your model generalizes under interventions (e.g., *P(rain|do(cloud-seeding))*).  
  > - It outperforms non-mechanistic alternatives (e.g., physics-based weather models vs. pure LSTMs).  
  > But crucially, "disposition" is **inferred from predictive robustness**, not observed directly.  

  ---

  ### **Synthesis: Is This a Vocabulary Hole or Philosophers' Illusion?**  
  **Your vocabulary lacks nothing essential**. The philosophical "residue" is either:  
  1. **Metaphysical baggage** (e.g., "Do propensities exist unobserved?")—irrelevant to forecasting.  
  2. **Reabsorbed into validation** (e.g., single-case probabilities are predictive distributions; reference classes are feature engineering).  
  3. **Nuance about model-world fidelity**—which you already handle via:  
     - **Stress-testing** under distribution shift (propensity’s empirical signature).  
     - **Causal discovery** (e.g., DoWhy, Pearl-style DAGs) to separate invariant mechanisms from patterns.  

  **Conclusion**: Philosophers dispute the *semantics* of probability; you deploy its *syntax* operationally. Where they see incompatible interpretations, you see complementary tools:  
  - **Frequentism** ↔ **Backtest-driven validation**  
  - **Bayesianism** ↔ **Belief updating + scoring coherence**  
  - **Propensity** ↔ **Causal model generalization**  
  The "disagreements" are artifacts of over-isolating concepts your workflow synthesizes. Your residue isn’t a hole—it’s a sign that philosophy often debates the map, not the territory you navigate daily.
