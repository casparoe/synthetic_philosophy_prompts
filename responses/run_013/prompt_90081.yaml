prompt: |-
  I'm a senior engineer who became an EM at a ~40 person startup, no philosophy background, and my team keeps relitigating the same thing: every time someone leaves or we reshuffle, we try to "capture what they knew" as docs and runbooks, and it basically never works. We write down a pile of true statements about our deploy process and the new person still can't deploy without someone sitting next to them for a week. I half-remember some philosopher making a distinction between knowing how to do a thing and knowing that something is the case, and that the first one doesn't just collapse into the second — but I want that turned into something my leads can actually run, not a clever line for retros.

  So please write me a procedure a tech lead can run in about 20-30 minutes per skill area when we're deciding how to hand off work or bring someone up to speed. A decision tree in words: what to ask in what order, what counts as evidence that this is genuinely "knowing how" and can only move by doing it alongside someone, what counts as evidence it's really just propositional knowledge and a doc will do, where the procedure just says stop writing and pair instead, and where it's quietly handing me a values call dressed up as a factual one (like how much outage risk we're willing to eat). It has to survive lazy leads, so concrete enough that someone who doesn't care about philosophy can follow it. And I'd like it to be honest about the obvious cheap objection: if learning a skill means following a rule, and applying rules is itself a skill, why doesn't your procedure just push the problem back a step instead of solving it?

  Then run it on three cases: (1) a mid-level backend engineer who's the only person who really understands our flaky billing retry logic, (2) our incident commander rotation, which we keep "documenting" and keep fumbling at 3am anyway, (3) a candidate who crushed the take-home and whiteboard and then couldn't debug anything in the live repo. Include at least one case where your procedure tells me something I won't want to hear — I suspect for one of these the honest answer is "you can't doc your way out of this, you have to change how you hire or onboard," and I'd rather the procedure say it than me. And tell me straight what the procedure can't do.
reasoning: |-
  We are going to create a decision procedure for knowledge transfer that distinguishes between "knowing that" (propositional knowledge) and "knowing how" (procedural knowledge). The procedure is designed to be run by a tech lead in 20-30 minutes per skill area.

  The procedure is inspired by the philosophical distinction made by Gilbert Ryle between "knowing that" and "knowing how". The key insight is that procedural knowledge (skills) cannot be fully captured by a set of propositions. Therefore, we must design our knowledge transfer accordingly.

  **Decision Procedure: How to Transfer Knowledge (20-30 min per skill area)**

  1. **Define the Skill Area**: Clearly state what the skill or task is. Be specific (e.g., "deploying service X", "debugging billing retry failures", "running incident command for a database outage").

  2. **Ask: Can the task be fully specified by a set of step-by-step instructions?**
     - **Evidence for "yes" (propositional knowledge)**:
       - The task has been successfully performed multiple times by following written instructions without prior experience.
       - The task has well-defined inputs and outputs, and the environment is stable and predictable.
       - There are no exceptions or edge cases that require judgment or adaptation.
     - **Evidence for "no" (procedural knowledge)**:
       - The task involves dealing with unpredictable situations (e.g., production incidents, flaky tests).
       - The task requires real-time judgment based on context (e.g., prioritizing during an incident).
       - Previous attempts to document the task have resulted in new hires still needing hands-on help.

     **If yes**: Write or update the documentation. Then, validate by having someone new (or not familiar with the task) follow the doc and perform the task. If they succeed without help, you're done. If not, go to step 3.

     **If no**: Proceed to step 3.

  3. **Ask: Are there critical, high-consequence decisions that require experience?**
     - **Evidence for "yes"**:
       - Mistakes in the task lead to severe outcomes (e.g., outages, data loss, customer impact).
       - The task requires interpreting ambiguous signals (e.g., logs, metrics) and making judgment calls.
       - The task involves coordinating with multiple people under pressure.
     - **Evidence for "no"**:
       - The task is safe to practice in a sandbox environment without real consequences.
       - Mistakes are easily detectable and reversible.

     **If yes**: This is a strong candidate for apprenticeship (pairing, shadowing, or guided practice). The procedure must include hands-on training and a gradual handoff. Also, consider if the task is too risky to be performed by one person and needs to be redesigned (e.g., automation, better tooling, or spreading the knowledge).

     **If no**: Proceed to step 4.

  4. **Ask: Can we break the task into smaller, safe-to-fail exercises?**
     - **Evidence for "yes"**:
       - The task can be simulated (e.g., a test environment for deployments, a game-day exercise for incidents).
       - There are sub-tasks that can be practiced independently without causing harm.
     - **Evidence for "no"**:
       - The task is inherently holistic and cannot be decomposed without losing the essence (e.g., leading an incident requires the whole context).

     **If yes**: Create a training program that includes simulations and exercises. Document the principles and heuristics (not just steps) and then train via practice.

     **If no**: This task is likely deeply experiential and requires a period of mentorship. Plan for pairing and shadowing, and accept that documentation alone will not suffice.

  **Addressing the Cheap Objection**:
  The objection: "If learning a skill means following a rule, and applying rules is itself a skill, why doesn't your procedure just push the problem back a step instead of solving it?"

  Answer: The procedure does not claim to eliminate the need for skill acquisition. Instead, it forces us to recognize when we are dealing with a skill (procedural knowledge) and then choose the right method (apprenticeship) rather than wasting time on ineffective documentation. Moreover, the procedure itself is a heuristic tool to guide our decision — it is not a set of rules to be followed blindly. We expect the user (the tech lead) to apply judgment in using this procedure, and if they are inexperienced in applying the procedure, they might need guidance (thus, the procedure is also a skill). But note: the goal is to make a decision about how to transfer a *specific* skill, not to transfer the skill of using this procedure. For the latter, we can use the procedure on itself: it is a judgment-based task (step 3) and thus we would train leads via pairing and practice.

  ---

  **Running the Procedure on the Cases**

  **Case 1: Mid-level backend engineer who's the only person who really understands our flaky billing retry logic**

  1. **Define**: Debugging and fixing issues in the billing retry logic.
  2. **Step 2**: Can it be fully specified by step-by-step instructions?
     - *Evidence for no*: The logic is flaky and involves understanding the system's state, interactions with external services, and heuristics for retries. It requires interpreting logs and metrics. Previous documentation attempts failed.
     - **Decision**: No → Step 3.
  3. **Step 3**: Are there critical, high-consequence decisions?
     - *Evidence for yes*: Mistakes can lead to lost revenue or double charging, which is high-consequence. Requires judgment on whether to retry, cancel, or manually intervene.
     - **Decision**: Yes → Apprenticeship needed. Pairing and shadowing are required. Also, consider if the system can be redesigned to be less flaky and more observable.
  4. **Conclusion**: Cannot rely on docs. Plan for pairing and shadowing for the new person. Also, the tech lead should consider this a risk and work on improving the system's design to reduce the need for deep expertise.

  **Case 2: Incident commander rotation, which we keep "documenting" and keep fumbling at 3am**

  1. **Define**: Leading the response to a production incident, especially during off-hours.
  2. **Step 2**: Can it be fully specified?
     - *Evidence for no*: Incidents are by nature unpredictable. The commander must coordinate people, make prioritization decisions, and communicate under pressure. Documentation hasn't worked.
     - **Decision**: No → Step 3.
  3. **Step 3**: Critical decisions?
     - *Evidence for yes*: Mistakes can prolong outages and cause customer impact. High pressure and fatigue (3am) amplify the need for experience.
     - **Decision**: Yes → Step 4 is skipped because we already have a strong signal for apprenticeship, but we proceed to step 4 for completeness.
  4. **Step 4**: Can we break it into safe-to-fail exercises?
     - *Evidence for yes*: We can run game-day exercises (simulated incidents) in a safe environment. We can break down incident command into sub-skills (e.g., initial assessment, communication, escalation) and practice individually.
     - **Decision**: Yes → Create a training program with simulations and document principles (not just steps). However, because of the high stakes and unpredictability, we also need a mentorship component: new commanders should shadow experienced ones during real incidents (starting with low-severity) before taking the on-call.
  5. **Conclusion**: Do both: document principles and heuristics (e.g., "when to escalate", "how to communicate updates") and set up a training program with simulations and shadowing.

  **Case 3: Candidate who crushed the take-home and whiteboard and then couldn't debug anything in the live repo**

  1. **Define**: Debugging a live, complex codebase with production-like conditions (e.g., a test environment that mirrors production).
  2. **Step 2**: Can it be fully specified?
     - *Evidence for no*: Debugging in a live repo requires navigating unfamiliar code, tooling, and environmental quirks. It's unpredictable and requires intuition built by experience. The candidate excelled in controlled environments (take-home, whiteboard) but failed in the live setting.
     - **Decision**: No → Step 3.
  3. **Step 3**: Critical decisions?
     - *Evidence for no (in the context of an interview)*: The interview is a safe environment (no real production impact). However, we are assessing a skill that in real work has consequences. But for the purpose of knowledge transfer (onboarding), we are focused on the skill of debugging.
     - **Decision**: We are not in the critical path (yet) for this candidate. But note: if we hire them, they will work on production code, so the real task is critical. Therefore, we must consider the real task. → Step 4.
  4. **Step 4**: Break into safe-to-fail exercises?
     - *Evidence for yes*: We can create a safe environment (e.g., a broken test environment) for candidates to debug. We can design exercises that mimic real debugging scenarios without risk.
     - **Decision**: Yes → For hiring: change the interview to include a realistic debugging session in a safe but complex environment. For onboarding: plan to pair new hires with experienced engineers during their first debugging tasks in the live repo until they build confidence.
  5. **The Unwanted Truth**: The procedure tells us that we cannot rely on the current hiring process because it tests "knowing that" (algorithms, controlled problems) but not "knowing how" (debugging in a live system). The solution is to change the hiring process to include a realistic debugging exercise and to pair new hires during onboarding for live debugging.

  ---

  **What the Procedure Can't Do**

  1. **Eliminate the Need for Experience**: It can't magically turn procedural knowledge into propositional knowledge. Some things just take practice.
  2. **Fix Systemic Issues**: If the reason knowledge is concentrated is because the system is overly complex or fragile, the procedure might flag that (as in case 1) but won't fix it. That requires engineering work.
  3. **Replace Judgment**: The procedure is a tool to guide thinking, but the tech lead must still use judgment. It might not cover every edge case.
  4. **Shortcut Time**: Apprenticeship takes time. The procedure can't make someone gain experience faster than is realistic.
  5. **Solve for Motivation**: If the team or leads are not motivated to do the training, the procedure won't help.

  **Final Note**: The procedure is designed to be run per skill area. It helps decide between documentation and apprenticeship (or a mix). It also forces acknowledgment of when a task is inherently experiential and when it's safe enough for self-guided learning. By making this explicit, it stops the cycle of writing ineffective docs and promotes effective knowledge transfer.
answer: |-
  Below is a concrete, step-by-step procedure for tech leads to determine how to transfer knowledge effectively. It uses Gilbert Ryle's distinction between **propositional knowledge** ("knowing that") and **procedural knowledge** ("knowing how") to avoid documentation theater. The procedure forces explicit tradeoffs and stops over-reliance on docs when they won't work.

  ---

  ### **Knowledge Transfer Decision Tree (20-30 min/skill area)**  
  *Run this for each critical skill or system. Involve the current expert and the person receiving the knowledge.*

  1. **Define the Skill Concretely**  
     Ask: *"What specific outcome must the learner achieve without help?"*  
     (e.g., "Deploy service X without causing an outage," not "Understand deployment.")  
     **🚨 Red flag**: Vague outcomes like "learn the system." Demand specificity.

  2. **Test for Procedural Knowledge ("Knowing How")**  
     Ask: *"Could a competent engineer follow written steps and succeed on their first try, assuming no surprises?"*  
     - **Evidence it’s procedural (docs fail)**:  
       - Requires real-time judgment (e.g., "Which log line matters in this error?")  
       - Depends on environmental quirks (e.g., "The VPN times out unless you restart it twice")  
       - Has high variability (e.g., incident response)  
     - **Evidence it’s propositional (docs work)**:  
       - Fixed steps with no ambiguity (e.g., "Run `terraform apply -target=module.db`")  
       - Context is stable and documented (e.g., "Our API always returns 429 on throttling")  
     **✅ Decision**: If procedural → **Skip docs. Go to Step 4.**  
     Else → Write a **runnable checklist** (not an essay). Test it with a stranger.

  3. **Probe for Tacit Knowledge**  
     Ask the expert: *"What’s the first thing you’d check if [common failure] happened?"*  
     - **Evidence of tacit knowledge**:  
       - Answers rely on intuition/pattern-matching (e.g., "The metrics *feel* off before alerts fire")  
       - Expert struggles to explain why a step exists (e.g., "We always restart twice – no idea why")  
     **✅ Decision**: If tacit knowledge surfaces → **Stop writing. Pair or simulate.**

  4. **Assess the Consequence of Failure**  
     Ask: *"If the learner fails alone, what’s the worst realistic outcome?"*  
     - **Low risk** (e.g., dev environment breaks): Document and let them experiment.  
     - **High risk** (e.g., outage/data loss): **Mandate pairing/apprenticeship**.  
     **⚠️ Values call**: If the team says "We can’t afford pairing," they’re accepting future failures. Call this out.

  5. **Check for Transferable Fundamentals**  
     Ask: *"Could this be solved by general engineering skills if our system wasn’t broken?"*  
     - **Evidence it’s a systems problem** (not knowledge):  
       - Workarounds dominate the process (e.g., "SSH into the box and manually kill processes")  
       - Only one person ever succeeded  
     **✅ Decision**: If yes → **Redesign the system** (e.g., automate manual steps). Don’t document chaos.

  ---

  ### **Answering the Cheap Objection**  
  *"If applying rules is itself a skill, aren’t you just pushing the problem back?"*  
  - **Yes, and that’s intentional**. This procedure *exposes* when you’re dealing with meta-skills (e.g., "debugging our spaghetti code"). The solution isn’t more docs—it’s pairing for skills and fixing systemic issues. Example: If "following runbooks" fails because your runbooks assume cosmic intuition, the procedure forces you to admit that and pair until fundamentals improve.

  ---

  ### **Case Studies**  
  **Case 1: Flaky billing retry logic (mid-level backend engineer)**  
  - Step 1: **Concrete outcome** → "Fix billing retries during peak load without causing duplicates/lost revenue."  
  - Step 2: **Procedural?** Yes – failures depend on queue backpressure, DB locks, and external API quirks.  
  - Step 3: **Tacit knowledge?** Expert says: "I watch the queue age metric and *then* check dead-letter." Unexplained intuition → **Pairing required**.  
  - Step 4: **Consequence** → High risk (revenue impact). → **Apprenticeship mandatory**.  
  - Step 5: **Fundamentals?** Flakiness stems from tight coupling. → **Redesign the system** to isolate retries.  
  **🏁 Outcome**: Stop documenting. Pair new hires with expert for 3 incidents. Invest in decoupling retry logic.  

  **Case 2: Incident commander rotation (fumbles at 3am)**  
  - Step 1: **Concrete outcome** → "Resolve SEV-2 incident within 30 min while maintaining comms."  
  - Step 2: **Procedural?** Yes – requires real-time judgment (e.g., "Which service to roll back?").  
  - Step 3: **Tacit knowledge?** Expert says: "I call the DB team if p95 latency jumps *and* error rate is flat." Contextual → **Simulate, don’t document**.  
  - Step 4: **Consequence** → High risk (outages). → **No solo runs until certified**.  
  - Step 5: **Fundamentals?** Commanders fail because playbooks are outdated. → **Rebuild playbooks via game days**.  
  **🏁 Outcome**: Replace docs with monthly fire drills. New commanders co-lead 2 low-sev incidents before solo.  

  **Case 3: Candidate aced take-home but can’t debug live repo**  
  - Step 1: **Concrete outcome** → "Diagnose why /healthcheck fails in dev cluster."  
  - Step 2: **Procedural?** Yes – live debugging depends on tribal knowledge (e.g., "Jenkins creds expire hourly").  
  - Step 3: **Tacit knowledge?** Team says: "You just know to check the CI agent logs first." → **Pairing gap exposed**.  
  - Step 4: **Consequence** → Low risk (dev environment). But hiring failure.  
  - Step 5: **Fundamentals?** Your tooling is hostile (e.g., no error messages). → **Unwanted truth: Fix onboarding or hire differently**.  
  **🏁 Outcome**: **Stop hiring for puzzles; start testing live skills**. Add a paired debugging session to interviews. Onboard all hires with shadowing on real tickets.  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Eliminate apprenticeship time**: If a skill requires muscle memory (e.g., incident response), pairing is non-negotiable. This procedure exposes that, but won’t shortcut it.  
  2. **Fix toxic knowledge hoarding**: If experts resist teaching, that’s a people problem – not solved here.  
  3. **Replace system redesign**: Docs can’t save you from accidental complexity (e.g., "5 manual steps to deploy"). The procedure flags this, but you still must fix the system.  
  4. **Work without commitment**: Lazy leads will skip steps. Enforce this in retros with: *"Show me the risk assessment from Step 4."*  

  ### **Why This Works for Startups**  
  - **Survives lazy leads**: Uses concrete examples ("Show me the first log line you check") instead of philosophy.  
  - **Forces tradeoffs**: Step 4 makes risk appetite explicit (no more "docs as risk reduction theater").  
  - **Scales cheaply**: 20 min/skill prevents months of failed handoffs.  

  **Final tip**: Run this *before* someone leaves. If the outcome is "pairing required," spread the skill *now*.
