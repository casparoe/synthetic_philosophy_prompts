answer: |-
  Here is a seven-minute address crafted for your specific audience and constraints, focusing on present responsibility, honouring your grandfather's silence, and adhering to the Bavarian rule:

  **(Begin quietly, looking at the memorial)**

  One hundred years. A century since the young men whose names are carved here marched away. We gather, as we do every year, to remember them. To say their names. To acknowledge the chasm their absence tore through families, through this village, through the world.

  This centenary year feels heavier, perhaps. It makes us look harder, reach deeper. And inevitably, a question presses in: *Who was to blame?* Who caused this? Our British Legion secretary, rightly honouring his comrades, hopes for clarity on that. Our friends from Bavaria arrive carrying their own complex history, their own debates about how such things are remembered. My young colleague questions the very nature of remembrance. And our students stand here, perhaps wondering what this distant war truly has to do with them.

  It’s a vital question – who caused the Great War? Historians, like my Bavarian colleague and I, have argued it for decades. Was it deliberate design or tragic sleepwalking? Alliances rigid as steel? Imperial rivalries? The answers shift, interpretations evolve. The Treaty of Versailles pinned responsibility firmly on Germany, calling it the sole cause. In Germany, that clause was instantly called the "war guilt lie." The debate raged then. It still echoes.

  But standing here, today, by these names carved in stone… I find myself thinking of my grandfather. He was at Passchendaele. He came home. And like so many who were there, he never spoke a word about it. Not one. Ever. What did that silence mean? Was it just the horror too deep for words? Perhaps. But I wonder now if part of that silence was about the sheer impossibility of answering that question, "Who was to blame?" in any way that made sense of the mud, and the wire, and the waste.

  Perhaps, standing where we stand now, we need to separate three things that often get tangled: **Who caused the war? Who was guilty of specific actions within it? And who is answerable for it now?**

  **Who caused it?** That’s for the history books, the archives, the endless, necessary debate. It’s complex. Nations, governments, systems, individuals – all played parts in the slide towards catastrophe. There are no simple verdicts that satisfy all the evidence, nor all the perspectives in this gathering today. To pretend otherwise is to disrespect the complexity of history and the intelligence of everyone here.

  **Who was guilty?** Guilt implies knowing intent, specific actions condemned by conscience or law. It attaches to individuals making choices – political leaders, military commanders – or to specific units committing atrocities. It does not, it *cannot*, attach fairly to an entire people – not then, not now. To blame "the Germans," all of them, for the decisions of 1914, is as wrong and simplistic as blaming "the British" for every tragedy of the Empire. My Bavarian friend has a rule, hard-won and true: **You may not blame a whole people, and you may not let a whole people off.** That rule holds. Guilt is specific, not collective.

  **So what are we left with here, today?** **Who is answerable?** This, I believe, is the only question truly suited to this place, this act of remembrance.

  We are answerable. We, the generations who came after.

  We are answerable *to* these names. Answerable for remembering them truly – not as pawns in an argument, not as symbols of glory, but as young men from this village, from villages like ours in Bavaria, from farms and factories across Europe, caught in a storm they didn't create. Answerable for acknowledging the sheer, staggering waste of it all. My grandfather’s silence speaks volumes about that waste.

  We are answerable *for* the world that war created, and the peace we’ve built – however imperfectly – upon its ruins. Answerable for understanding how tangled alliances, unchecked nationalism, failures of diplomacy, and the rush to mobilize can lead nations over a cliff. Answerable for seeing the humanity in those we were taught to call only "the enemy." Answerable for upholding that hard rule: **No collective blame. No collective absolution.** Only a clear-eyed recognition of complex history.

  And crucially, we are answerable *before* the young people standing here. Answerable for passing on not just the facts, but the weight of this history. Answerable for showing them that remembering the dead isn't about reliving old battles or stoking old resentments, but about learning. Learning that peace is fragile. That words matter. That "the other side" is made of people, too. That the choices of leaders have consequences that echo for generations. That understanding complexity is harder than clinging to blame, but it is the only honest path.

  **(Look towards the Bavarian delegation, then the Legion, then the children)**
  Our friends from Bavaria know the weight of remembrance differently, perhaps, but no less deeply. The Legion knows the cost paid by individuals, their comrades. My colleague challenges us to ensure this isn't nostalgia, but reckoning. Our students represent the future we are answerable to.

  So today, we don't gather to assign the blame for 1914. We gather to be answerable *for* 1914. To stand before these names and say: We see you. We remember the cost. We acknowledge the complexity. We accept the burden of learning, and the responsibility of building something better. Your silence, Grandad, and the silence of millions like you, is part of that story too – a reminder that some truths lie beyond easy blame, in the realm of profound loss and the duty it leaves behind.

  **(Shift tone, more present, concluding)**
  In a moment, we will lay our wreaths. It is a simple act. But let it carry all this weight. Let it be our pledge of remembrance, yes. But also our quiet acceptance of answerability – to the past, for the present, and for the future those young people here will shape. Let us lay them not in bitterness, not in simplistic pride, but in sober commitment to what we owe them now: a world more mindful, more just, and more determined never to let such darkness fall again.

  Thank you.

  **(End quietly, pause, then move to signal wreath-laying)**
