  Most challenging will be satisfying the Legion's desire for clarity without endorsing simplistic blame, while honoring German guests without seeming to absolve. The solution might lie in the framing: "Our task today isn't to relitigate 1914..." That acknowledges the debate while redirecting focus.

  The young colleague's concern about imperial nostalgia can be addressed by emphasizing that true remembrance requires clear-eyed acknowledgment of tragedy, not glorification. The children's boredom might be countered by asking them direct questions about the names on the memorial.

