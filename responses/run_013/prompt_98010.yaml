prompt: |-
  I am assembling the specification for a theory of how the number of people whose lives are at stake should weigh in decisions about whom to rescue, and I want the desiderata set out before I commit to any of the proposed answers. Treat the standard of adequacy as this: the theory must be good enough to hand to a rescue coordinator or a hospital triage committee and actually guide them. Write the list of requirements any adequate theory in this area has to meet.

  For each requirement, give the case or consideration that motivates it, and say whether you take it to be non-negotiable or merely the preference of one camp. I want the list to cover at least the following, and you should tell me which of them are genuine desiderata and which are prejudices of a particular camp dressed up as requirements:

  Cases the theory must get right.
  (a) You can save one stranger or five strangers, not both.
  (b) You can save A, or you can save A and B; in the second option nobody is worse off and one person is better off.
  (c) You can save two people now or three people later, and one of the two is among the three.
  (d) You can save one person for certain, or attempt a rescue that gives each of three people a one-in-three chance of surviving.
  (e) The one is your child, or someone to whom you have made a promise; the many are strangers.
  (f) You are yourself one of the people who would be saved or left to die.
  (g) You could kill one healthy person and distribute their organs to five who will otherwise die.
  (h) A thousand separate incidents, each pitting one against two, against a single incident pitting one against two thousand.

  Distinctions it must respect, and must not collapse into one another: numbers as a tie-breaker between equal claims versus numbers as a weight in the balance; counting lives versus counting life-years; killing versus allowing to die; the first-personal standpoint versus the third-personal standpoint; what is permitted versus what is required; the ex ante appraisal of a risky choice versus the ex post appraisal of its outcome.

  Commitments it must not contradict: that every person's life is of equal value to every other's; that in (a) the five may, or must, be saved; that the surgeon in (g) must not act; that the verdict must not turn on how the incident is parcelled up or described.

  Constraints on the form of the theory itself: it must be action-guiding rather than merely classificatory; it must compose with a decision theory that can handle the uncertainty in (d); it must return a determinate verdict in each case rather than declaring the cases incomparable; and if it rests on a controversial metaphysical thesis, such as the separateness of persons, it must say so rather than smuggling it in.

  I am most interested in two things. First, any pair or subset of these requirements that cannot be jointly satisfied — I suspect the demand that the five be saved, the demand that the surgeon not kill, and the demand that no person's claim be aggregated with another's pull against each other, and if so I want to know precisely which has to give. If the list as a whole is unsatisfiable, say so; that is itself the result I want. Second, which single requirement does the most to exclude otherwise popular theories.

  Then, briefly, how the main contenders fare against the list — the aggregative view that each counts for one, the view that numbers do not count at all, the view that they count only as a tie-breaker among equal claims, and a contractualist account of what we owe to each other. Keep the weight on the criteria rather than on the scoring, since I can run the scorecard myself once I trust the list.

  Do not give me a reading list, citations or suggestions for further reading; reason from the cases themselves. Please write in British English.
reasoning: |-
  Okay, the user wants me to assemble a specification for a theory about how the number of people at risk should influence rescue decisions. They want desiderata that could actually guide real-world decision-makers like rescue coordinators or triage committees. Let me break down their requirements carefully.

  First, I need to consider the cases they've listed from (a) to (h). Each case seems designed to test different aspects of a moral theory. For example, case (a) tests basic aggregation - can we save five over one? Case (b) checks for Pareto efficiency - saving more without harming anyone. Case (g) is the classic organ transplant dilemma that distinguishes killing from letting die. These cases will help formulate requirements.

  The distinctions they mention are crucial too. Can't collapse numbers as tie-breakers versus weights, or confuse killing versus allowing to die. Also important to maintain the difference between personal versus impersonal standpoints. These distinctions will likely become explicit requirements in the list.

  Their commitments section gives non-negotiables: equal value of lives, must save five in (a), mustn't kill in (g), description-independence. These seem like core constraints any theory must satisfy. The form constraints about action-guidance and handling uncertainty are practical necessities for real-world use.

  Hmm, the user suspects some requirements conflict - particularly saving the five vs not aggregating claims vs not killing. That tension seems central. Also curious which single requirement excludes most theories - probably the surgeon case (g) since it challenges pure aggregation.

  For the contenders: Aggregation handles (a) and (b) well but fails (g) and possibly (e). Tie-breaker-only views fail (a) and (c). Contractualism might handle personal obligations but struggle with pure numbers. Each has trade-offs against the requirements.

  The user wants British English and no citations - just reasoning from cases. They're clearly building something rigorous, probably for policy or academic work. The focus on unsatisfiable requirements suggests they want to identify true dilemmas rather than pretend everything reconciles neatly.

  Biggest challenge will be structuring the requirements to show where conflicts arise - especially between R1 (save more lives), R8 (no aggregation of claims), and R11 (killing prohibition). That triangle likely forces compromise. Also need to ensure each requirement traces back to specific cases or distinctions.

  Should flag that determinacy requirement (R14) might be problematic - some cases genuinely resist crisp verdicts. And the personal standpoint (R5) versus impartiality will cause tension in family obligation cases like (e).

  The hospital triage use case means practical action-guidance is non-negotiable. Can't be some abstract philosophical theory - must help real decisions under pressure. That elevates requirements about clarity and uncertainty handling.
answer: |-
  Below is a specification of desiderata for a theory of rescue prioritisation, derived from your cases, distinctions, commitments, and constraints. Requirements are labelled **R1–R17**, with each assessed as **Non-negotiable** (core to any action-guiding theory) or **Contested** (reflects substantive philosophical disagreement). Conflicts and theory-excluding requirements are analysed after the list.

  ---

  ### **I. Core Requirements Derived from Cases**  
  *(Non-negotiable unless specified)*  

  1. **R1: Aggregation in Rescue Scenarios**  
     *Case (a): Save 1 or 5 strangers.*  
     The theory must require saving the five.  
     **Status:** Non-negotiable (follows from equal value of lives + Pareto).  

  2. **R2: Pareto Efficiency**  
     *Case (b): Save A, or save A and B.*  
     The theory must require saving both (no one worse off, one better off).  
     **Status:** Non-negotiable (rational dominance).  

  3. **R3: Non-Discrimination Against Future Claims**  
     *Case (c): Save 2 now or 3 later (with one overlap).*  
     The theory must not discount lives saved later merely due to timing.  
     **Status:** Non-negotiable (avoids arbitrary temporal bias).  

  4. **R4: Risk-Sensitivity**  
     *Case (d): Save 1 for certain, or give each of 3 a 1/3 chance.*  
     The theory must integrate with decision theory (e.g., maximise expected lives saved).  
     **Status:** Non-negotiable (guidance under uncertainty).  

  5. **R5: Agent-Relative Permissions**  
     *Case (e): Save your child/promisee vs. many strangers.*  
     The theory must permit (but not require) favouring special obligations.  
     **Status:** Contested (e.g., utilitarians reject; deontologists affirm).  

  6. **R6: Impartiality When Self-Interest Conflicts**  
     *Case (f): You are among those at risk.*  
     The theory must require impartial deliberation (no self-favouritism).  
     **Status:** Non-negotiable (equal value of lives).  

  7. **R7: Prohibition on Instrumental Harm**  
     *Case (g): Kill 1 healthy person to save 5.*  
     The theory must forbid killing to harvest organs.  
     **Status:** Non-negotiable (consensus in law and bioethics).  

  8. **R8: Description-Invariance**  
     *Case (h): 1,000 incidents (1 vs. 2) vs. one incident (1 vs. 2,000).*  
     The verdict must not depend on how the case is "parcelled" (e.g., saving 2,000 must take priority).  
     **Status:** Non-negotiable (avoids arbitrariness).  

  ---

  ### **II. Distinctions to Preserve**  
  *(Non-negotiable)*  

  9. **R9: Numbers as Weight vs. Tie-Breaker**  
     Distinguish when numbers break ties between equal claims vs. outweigh stronger claims.  
     **Motivation:** Case (a) requires weighting, not tie-breaking.  

  10. **R10: Lives vs. Life-Years**  
      Treat saving a life as distinct from extending life-years (e.g., young vs. old).  
      **Motivation:** Prevents age discrimination; focus on equal moral worth.  

  11. **R11: Killing vs. Allowing to Die**  
      Maintain a robust difference (e.g., forbids (g) but permits (a)).  
      **Motivation:** Case (g) demands this distinction.  

  12. **R12: First-Personal vs. Third-Personal Standpoint**  
      Acknowledge agent-relative permissions (R5) while requiring impartial justification.  
      **Motivation:** Case (e) vs. Case (f).  

  13. **R13: Permitted vs. Required**  
      Define when saving the greater number is obligatory vs. merely optional.  
      **Motivation:** Case (e) shows saving kin may be permitted but not required.  

  14. **R14: Ex Ante vs. Ex Post Evaluation**  
      Handle risk (Case d) without judging outcomes retroactively.  
      **Motivation:** A risky but rational choice remains justified even if it fails.  

  ---

  ### **III. Formal Constraints**  
  *(Non-negotiable)*  

  15. **R15: Action-Guidance**  
      Yield clear directives (e.g., "save the five" in (a)), not just labels.  
      **Motivation:** For use by triage committees.  

  16. **R16: Determinacy**  
      Return a verdict in all cases (no incomparability).  
      **Motivation:** Real-world decisions cannot be deferred.  

  17. **R17: Transparency**  
      Disclose controversial metaphysical foundations (e.g., separateness of persons).  
      **Motivation:** Avoids smuggling in biases.  

  ---

  ### **IV. Conflicts & Exclusionary Power**  
  #### **Key Tensions:**  
  - **R1 (save the five) vs. R11 (no killing) vs. R8 (no aggregation of claims):**  
    R1 requires aggregating claims to justify saving five over one. R11 (killing vs. allowing to die) forbids aggregating in cases like (g). R8 (description-invariance) pushes aggregation further (e.g., Case h). **Resolution:** R11 (prohibition on killing) is non-negotiable and limits aggregation; R1/R8 hold only when no intentional harm occurs. Pure aggregation must yield to deontic constraints.  

  - **R5 (agent-relative permissions) vs. R6 (impartiality):**  
    Conflict arises when personal ties clash with saving more lives (Case e). **Resolution:** R5 is *permissive* (may save kin), not mandatory, preserving impartiality as the default.  

  #### **Most Exclusionary Requirement:**  
  **R7 (prohibition on instrumental harm, Case g)** excludes:  
  - Act-utilitarianism (demands killing in g).  
  - Radical aggregation (if it permits violating bodily autonomy).  

  ---

  ### **V. How Contenders Fare**  
  | **Theory**               | **Key Failures**                                  | **Key Satisfactions**                     |  
  |--------------------------|--------------------------------------------------|-------------------------------------------|  
  | **Pure Aggregation**     | Fails R7 (permits killing in g), R11 (collapses killing/allowing to die). Struggles with R5 (no agent-relative permissions). | Excels at R1, R2, R3, R4, R8. |  
  | **Numbers as Tie-Breaker** | Fails R1 (cannot save five over one if claims differ), R8 (loses description-invariance). | Satisfies R7, R11, R10 (if tie-breaking is time/life-year neutral). |  
  | **Contractualism**       | Fails R1/R8 if it rejects aggregation (e.g., "each victim’s veto" blocks saving five). Struggles with R4 (risk). | Excels at R7, R11, R5, R17 (transparent foundations). |  
  | **Moderate Aggregation + Constraints** | Balances R1/R8 with R7/R11. May struggle with R5 (if too impartial) or R16 (if constraints create indeterminacy). | Best at R9 (distinguishes weight/tie-breaker), R14 (ex ante risk). |  

  ---

  ### **Summary of Unsatisfiable Demands**  
  The triad **R1 (aggregation) + R8 (description-invariance) + R7 (no killing)** is *jointly satisfiable only if aggregation is bounded by deontic constraints*. R7 forces a non-consequentialist limit on aggregation, rejecting theories that treat killing as morally equivalent to letting die. **The requirement that must "give" is unrestricted aggregation** – no theory can satisfy R7 while permitting the surgeon in (g) to act.  

  **Most excluding requirement:** R7 (prohibition on instrumental harm). It dismantles act-utilitarianism and radical aggregation.  
  **Critical tension:** R5 (agent-relative permissions) vs. R1 (save the greater number) – resolvable by making R5 optional, not mandatory.  

  This list provides a defeasible specification: any theory violating non-negotiable requirements (R1–R4, R6–R8, R9–R17) is inadequate for real-world guidance. Contested requirements (R5) highlight where reasonable disagreement persists.
