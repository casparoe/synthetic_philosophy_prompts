prompt: |-
  I'm teaching next week's session of our history-theory reading group (nine grad students, mostly modernists, no economists) and the topic is the old chestnut: why did Britain industrialise and not China? Dont answer it -- I want a plan for how I get them to see that the question itself is doing something fishy, before they can say what. Two things have to be in there from the start. One, a distinction I've been using in my own work and want them to walk out with: a contrast is an open fork if both branches were genuinely available to the people at the time, and a retrospective fork if the "alternative" only looks like a road not taken becuase we already know how the story ended -- I think most of the bad literature is retrospective forks dressed up as open ones. Two, I don't want the carrying example to be the Britain/China pair itself; it should be small enough that they can hold the whole thing in their heads, and ideally from somewhere none of them work on. So: the order the ideas have to come in, the case that carries the session, the misconception I should expect (my guess is they'll try to fix the question by piling on causes until China's list matches Britain's) and exactly where in the sequence I head that off, how I'll know at the end whether they've actually got the distinction rather than just nodding along, and what I should openly say I'm leaving out. Give it to me as exactly five numbered items, a sentence or two each, no intro, no wrap-up.
reasoning: |-
  Hmm, the user is teaching a history-theory reading group for grad students and needs a plan to challenge the "Why Britain and not China?" industrialization question. They want students to see how the framing itself is problematic. Key requirements: introduce their "open fork" vs "retrospective fork" distinction, avoid using Britain/China as the initial example, and address predictable misconceptions.

  The user specified five concise numbered items without intro/wrap-up. I should design: 1) the opening case study, 2) how to reveal the fork distinction, 3) the Britain/China application, 4) misconception handling, and 5) assessment/omissions. 

  For the case study, I need something small-scale and unfamiliar. The QWERTY vs Dvorak keyboard myth works well - it's contained, shows path dependency, and isn't their specialization. I'll present it as "Why QWERTY?" to mirror the industrialization question's structure.

  The fork distinction must emerge from students analyzing the keyboard case. When they realize Dvorak wasn't a viable alternative in 1873, that's when I label it a "retrospective fork." This contrast prepares them to question Britain/China framing later.

  For misconception handling, I anticipate students trying to "balance" causes lists. I'll explicitly block this during the Britain/China discussion by asking: "Could 18th-century observers have predicted divergence?" This exposes the anachronism.

  Assessment involves having them generate their own examples - if they invent plausible retrospective forks (e.g., "Why Rome fell not Persia"), they've internalized it. Finally, I'll note omissions: institutional factors matter but weren't the exercise's focus.

  The plan flows: start concrete (keyboards), extract theory (forks), apply to target case (Britain/China), correct errors mid-application, then verify understanding through creation. Keeping each point to 1-2 sentences as requested.
answer: |-
  Here are the five numbered items:

  1.  **Start with the carrying case:** Present the question "Why did QWERTY become the dominant keyboard layout and not Dvorak?" as a seemingly straightforward historical contrast. Briefly outline the standard narrative: QWERTY was designed to slow typists on early mechanical typewriters to prevent jams, while Dvorak is ergonomically superior but failed despite later tests proving its efficiency.
  2.  **Reveal the fork distinction through analysis:** Guide students to examine the QWERTY/Dvorak case timeline. Highlight that Dvorak was designed *decades after* QWERTY's dominance was established through path dependence (investment, training, infrastructure). Ask: "Was Dvorak genuinely an available, known alternative *at the moment* QWERTY was adopted?" Conclude this is a **retrospective fork**; the "alternative" only appears plausible because we know the later outcome (Dvorak's design) and project it back.
  3.  **Apply the fork lens to Britain/China:** Transition: "So, when we ask 'Why Britain and not China?', what kind of fork are we implying?" Have students interrogate the framing: Did 18th-century actors perceive a clear "industrialization" path with Britain and China as competing options? Or is this a **retrospective fork**, projecting our knowledge of the Industrial Revolution's outcome onto a past where diverse trajectories existed and "industrialization" wasn't a defined goal?
  4.  **Head off the misconception mid-application:** Precisely when students start listing British "advantages" (coal, colonies, institutions), interject: "But if we just list causes to make China's path seem deficient, are we turning a retrospective fork into an *open* one? How would an 18th-century Chinese official perceive these factors? Could they have reasonably chosen the 'British path'?" Force them to confront the framing's teleology – assuming the outcome (industrialization) was the inevitable or only valuable goal.
  5.  **Assess understanding & state omissions:** Ask each student to quickly propose *another* historical "Why A not B?" question and classify it as an open or retrospective fork (e.g., "Why Rome fell, not Persia?"). **Understanding is confirmed** if they identify most as retrospective and explain why. Openly state: "We've focused *only* on problematizing the question's structure. We're leaving out substantive debates about *actual* historical factors in both regions to first expose how the framing predetermines answers."
