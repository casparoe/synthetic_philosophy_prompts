answer: |-
  **Bottom line:** The strong handicap principle is exposed to fatal challenges from intrinsic reliability and circularity, with reputation-based honesty and external costs forcing significant retreats.

  **Ranked Defeaters (Fatal to Awkward):**

  1.  **Intrinsic/Constitutive Signals (Fatal & Live):** Signals where reliability stems *directly* from the underlying quality (e.g., deep voice caused by testosterone, fever indicating infection, structural honesty like antler size mechanically constrained by nutrition). This defeats the *necessity* of differential cost for reliability, showing honest signalling *can* exist without it. Defenders dismiss these as "cues" or "indices," not "signals" requiring strategic investment, but the boundary is contested.
  2.  **Circularity/Operationalization (Fatal & Live):** Costliness is often *inferred* post-hoc from signal reliability ("it must be costly because it's honest"). Without independent measurement of cost *before* assessing reliability, the theory risks unfalsifiable tautology. This is a fundamental epistemological flaw. Defenders concede this is a major methodological pitfall requiring rigorous independent cost metrics.
  3.  **Reputation/Reciprocity Systems (Forces Retreat & Live):** Honest signalling sustained by repeated interactions, reputation tracking, and threat of future sanctions (e.g., cooperative hunting promises, trade credit). Reliability comes from the *threat* of losing future benefits, not necessarily intrinsic signal cost *in that instance*, minimizing waste. This forces retreat to weaker versions acknowledging *initial* establishment costs or redefining "cost" as potential opportunity cost. Defenders argue startup costs or the constant risk of detection constitute the handicap.
  4.  **Externally Imposed Costs (Awkward & Live):** Costs borne by receivers (e.g., costly female choice) or third parties (e.g., punishment for dishonesty), or signals where the receiver dictates the cost (e.g., demanding a specific difficult task). This challenges the core tenet that the signaller *bears* the differential cost enabling reliability. Defenders often stretch the framework (cost paid *to* the signaller, receiver investment as part of the signal "cost") or absorb it awkwardly. Genuine anomalies are cases where the signaller incurs *no* differential net cost or risk.

  **Verdict on Insulation & Unfalsifiability:**

  The strong principle *is* empirically vulnerable. While defenders can often *locate* a cost (physiological trade-offs, risk of sanction), the critical issue is whether that cost is **differentially** borne by the signaller and **necessary** for the reliability observed. Challenges 1 & 2 directly attack this. Intrinsic signals demonstrate reliability *without* strategic cost investment. Circularity makes independent testing impossible if cost isn't defined *a priori*. Reputation systems suggest reliability can be maintained *cheaply* once established, questioning the *ongoing* necessity of high marginal signal cost. Externally imposed costs shift the burden away from the signaller.

  Insulation *is* a problem, risking degeneracy into a "just-so" story where any reliable signal is deemed costly *by definition*. However, it shares this with broad frameworks like natural selection – its value lies in predictive power and guiding research. It remains empirical *if* proponents commit to *specific, measurable, and independently defined costs* predicted *before* reliability is established (e.g., predicting higher mortality for more ornamented males, or greater energy expenditure in specific displays). When it generates novel predictions tested this way (e.g., metabolic costs of vocalizations correlating with quality), it retains empirical content. Its fatal flaw emerges when confronted with reliable signals demonstrably lacking strategic investment cost *or* when its core terms become circularly defined. The burden of proof lies squarely on proponents to define and measure costs non-circularly.
