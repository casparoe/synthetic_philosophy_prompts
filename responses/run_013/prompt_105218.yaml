prompt: |-
  I am a novelist, well into a book whose central figure is a decision theorist — a woman who has spent a career putting prices on information, and who, over the year the story covers, is offered a piece of knowledge about her own future that she cannot decide whether to accept. I have enough mathematics to know the shape of the standard answer and not enough to be sure it is the right shape, and I would rather build her intellectual world on a specification than on a slogan. So before I draft another scene, give me the desiderata: what must any theory of the value of information deliver to count as adequate? I want the requirements list — the cases it has to get right, the distinctions it must not collapse, the formal results it cannot contradict — each one carrying the particular case or consideration that makes it a requirement rather than a taste. Mark which are non-negotiable and which are the commitments of a particular camp (Bayesian, decision-theoretic, or the view that truth is a value in its own right), and be explicit about any pair you suspect cannot be jointly satisfied, because if the list is internally inconsistent then the list is the result, and that is precisely what I am after.

  The puzzle I keep circling is this. There is a clean argument that information can never be worth less than nothing: whatever you are told, you may always disregard it and act as though you had never heard it, so knowing more cannot leave you worse off — and there is a matching theorem to the effect that, for an agent who maximizes expected utility, a more informative experiment is never worse than a less informative one. Yet it is equally well known — the point is usually credited to I. J. Good — that an agent who decides by some rule other than expected-utility maximization, one whose choice responds to the data in another way, can be made strictly worse off by free information; and ordinary life is full of people who cannot un-know a diagnosis, a betrayal, or a prediction, and whose options and preferences are transformed by what they learn rather than merely re-weighted. I want the theory's obligations stated so that it neither legislates these cases away as irrationality nor surrenders the results that make the clean argument compelling. I also suspect the account has to keep separate things I keep finding fused: the value to the agent and the value to everyone else; the value of becoming able to know versus the value of knowing; the value measured before the fact and after it; the value of information to a Bayesian and to an agent whose procedure is fixed in advance; and information that changes your beliefs as against information that changes your options, your preferences, or your identity.

  Then, if it is not too much, close with a short paragraph on how the standard expected-utility treatment and its dissenters fare against the list — but keep the weight on the criteria, since that is what I will be writing from. Above all I want to know which single requirement, if honored, does the most to exclude the tidy theories, and which of my imagined characters each requirement would rule out as a coherent agent.
reasoning: |-
  We are building a list of desiderata for a theory of the value of information. The goal is to have a set of requirements that any adequate theory must meet, with attention to which are non-negotiable and which are tied to particular camps (e.g., Bayesian, decision-theoretic). We also note potential conflicts and which requirement is the most challenging for the tidy theories.

  The key puzzle: the standard argument (in an expected utility setting) that information cannot have negative value (because you can ignore it) vs. real-world cases where information can harm (e.g., when it leads to irrational behavior or transforms the agent).

  We must separate:
  - Value to the agent vs. value to others
  - Value of becoming able to know vs. value of knowing
  - Ex ante vs. ex post value
  - Value for a Bayesian vs. an agent with a fixed procedure
  - Information that changes beliefs vs. information that changes options, preferences, or identity.

  We list the desiderata, mark non-negotiable vs. camp-specific, note conflicts, and then briefly compare the standard EU treatment and dissenters.

  **Desiderata for a Theory of the Value of Information**

  1. **Non-Negative Value for Expected Utility Maximizers (Non-negotiable for Bayesian decision theory)**: 
     - *Requirement*: For any agent who is a Bayesian expected utility maximizer and has stable preferences (i.e., whose utility function and set of possible actions do not change due to the information), the value of any piece of information must be non-negative. This is because the agent can always choose to ignore the information and do as they would have without it. 
     - *Justification*: This is the core of the "clean argument" and is backed by the theorem that more information (in the sense of a finer partition of the state space) cannot decrease the expected utility of a Bayesian agent. 
     - *Note*: This is non-negotiable within the Bayesian camp but may not hold for non-Bayesian agents.

  2. **Possibility of Negative Value for Non-Bayesian Agents (Non-negotiable for descriptive adequacy)**:
     - *Requirement*: The theory must account for cases where information has negative value for agents who do not follow the Bayesian expected utility maximization procedure. For example, an agent who uses a fixed decision rule (that is not equivalent to Bayesian updating and expected utility maximization) might be made worse off by information. 
     - *Justification*: Good's observation and real-world examples (e.g., someone who becomes paralyzed by indecision upon receiving a medical diagnosis) demonstrate that information can harm. 
     - *Note*: This is non-negotiable if the theory aims to cover human behavior in general, but it is not a requirement for a normative Bayesian theory. 

  3. **Distinction Between Information Changing Beliefs and Changing the Agent (Non-negotiable)**:
     - *Requirement*: The theory must distinguish between:
       (a) Information that only updates the agent's beliefs about the state of the world (leaving the agent's utility function, available actions, and decision procedure unchanged), and 
       (b) Information that changes the agent's identity (e.g., fundamental preferences), available actions, or decision procedure.
     - *Justification*: The standard non-negative result holds only for (a). In (b), information can lead to a different kind of agent, and negative value becomes possible even in a normative theory. Ordinary examples (e.g., learning of a betrayal that changes one's preferences) fall under (b).
     - *Note*: This is non-negotiable for a theory that aims to account for the full range of human experience.

  4. **Ex Ante vs. Ex Post Valuation (Non-negotiable)**:
     - *Requirement*: The theory must account for the difference between:
       - *Ex ante value*: The expected value of information before it is received (which for a Bayesian is non-negative).
       - *Ex post value*: The realized value after receiving the information (which may be negative, even for a Bayesian, if the information leads to a bad outcome that the agent would have avoided without the information, but note: the agent still had the option to avoid it?).
     - *Justification*: The ex ante perspective is necessary for deciding whether to acquire information, but the ex post perspective reflects the lived experience. The standard theory focuses on ex ante value. However, note that even ex post, a Bayesian agent cannot be worse off than not having the information because they could have ignored it. But if the information changes the agent (see point 3), then ex post the agent is different and might regret having learned.
     - *Note*: The standard theory does not allow negative ex ante value for a Bayesian, but ex post regret (without changing the agent) is about outcomes, not the value of information per se. However, if the agent changes, then ex ante the agent (before learning) might not be able to foresee how the information will change them, leading to a conflict.

  5. **Value to the Agent vs. Value to Others (Non-negotiable for comprehensive theory)**:
     - *Requirement*: The theory must distinguish the value of information to the agent acquiring it from the value to other agents or to society. 
     - *Justification*: Information that benefits the agent might harm others (e.g., insider trading) and vice versa. A theory focused on individual decision-making might only consider the agent's perspective, but a full account must be clear about the perspective.

  6. **Value of Becoming Able to Know vs. Value of Knowing (Non-negotiable)**:
     - *Requirement*: The theory must separate the value of having the *capability* to acquire information (e.g., having access to a test) from the value of actually acquiring it (e.g., taking the test and getting the result). 
     - *Justification*: The agent might choose not to use the capability if the expected value of the information is negative (ex ante). But the capability itself might have value because it gives the option to learn.

  7. **No Collapse of Distinction Between Information and Control (Non-negotiable)**:
     - *Requirement*: The theory must not conflate the value of information with the value of control (i.e., the ability to change the state of the world). 
     - *Justification*: Information is about reducing uncertainty, while control is about affecting outcomes. They are distinct and both important.

  8. **Consistency with the Value of Clairvoyance (Non-negotiable for normative decision theory)**:
     - *Requirement*: In the Bayesian framework, the value of information (from an experiment) should be consistent with the concept of the value of clairvoyance (perfect information about the state of the world). The value of clairvoyance is the difference between the expected utility of acting with perfect information and without.
     - *Justification*: This is a benchmark for the theory.

  9. **Handling of Self-Defeating Information (Potential conflict)**:
     - *Requirement*: The theory must account for information that, if known, would cause the agent to take an action that leads to a worse outcome than if the agent didn't have the information. However, note that in the standard Bayesian setting, the agent can avoid this by ignoring the information. Therefore, this situation should only arise if the agent is constrained to use the information (i.e., cannot ignore it) or if the information changes the agent (point 3).
     - *Justification*: Examples include a prediction of a stock market crash that, if believed, causes panic and makes the crash worse. But note: if the agent can disregard the prediction, they might avoid the panic. The negative impact comes from the fact that the agent (or others) do not disregard it.

  **Conflicts and Tensions**:
  - Desiderata 1 and 2 are in tension: one requires non-negative value for Bayesian agents, the other requires the possibility of negative value for non-Bayesian ones. This is not a conflict because they apply to different agents. However, if the theory is meant to be a unified account, it must handle both.
  - The major conflict arises when we consider that an agent might be Bayesian but then change upon receiving information (point 3). Then, ex ante (as the original agent) the information might have negative expected value because it will change the agent into one that makes worse decisions. But note: the original agent might choose not to receive the information to avoid becoming the changed agent. This is consistent with non-negative value? Not exactly: the original agent, by learning, becomes a new agent who then makes decisions that the original agent would disapprove. Therefore, the original agent might assign negative value to the information because it leads to a transformation that is detrimental. However, the standard theorem does not cover such transformation. This is a gap.

  **The Most Challenging Requirement**: 
  - The requirement that does the most to exclude tidy theories is **Desideratum 3 (Distinction Between Information Changing Beliefs and Changing the Agent)**. Tidy Bayesian decision theory assumes a fixed utility function and action set. But if information can change the agent's identity (preferences, available actions, etc.), then the standard non-negative result may not hold, and the theory must account for this without abandoning the normative force of the standard result for the case of fixed agents.

  **Which Agents are Ruled Out?**:
  - Desideratum 1 rules out as coherent (in the Bayesian sense) any agent who is an expected utility maximizer and yet pays to avoid free information that might change their beliefs (without changing their identity). Such an agent would be irrational by Bayesian standards.
  - Desideratum 2 and 3 allow for agents who are not expected utility maximizers or whose identity changes with information. These agents are coherent in a broader sense.

  **Brief Comparison of Standard EU and Dissenters**:

  - **Standard Expected Utility (Bayesian) Treatment**: 
    Satisfies 1, 3 (by restricting to cases where the agent doesn't change), 4 (ex ante non-negative, ex post non-negative in the sense that the agent could have done as well by ignoring), 5 (if we take the agent's perspective), 6, 7, 8. 
    It fails to satisfy 2 (by design, because it assumes rational agents) and does not handle the cases in 3 where the agent changes (because it assumes fixed preferences and actions). 

  - **Dissenters (e.g., behavioral economics, theories of transformative experience)**:
    These theories aim to satisfy 2 and 3 (by allowing information to change the agent and by accounting for non-Bayesian behavior). They may relax 1 for non-Bayesian agents. They also emphasize the ex post perspective and the possibility of regret. However, they might not have a unified formal framework that matches the elegance of the Bayesian model for the fixed-agent case.

  **Conclusion for the Novelist**:
  The central tension in your character's world is between the normative ideal (information is always beneficial if you are rational and fixed) and the descriptive reality (information can harm when it changes who you are or when you are not perfectly rational). The most important requirement that forces a break from the tidy theory is that information can change the agent's identity (preferences, options, etc.). Your decision theorist might be a Bayesian who has always believed in the non-negative value of information, but then confronts a piece of knowledge that would change her in ways she cannot predict and might regret. This creates a dilemma: ex ante, she cannot compute the expected value because the information would alter her preferences. Hence, the standard framework does not apply.

  This gives you the intellectual conflict for your character: she must decide whether to accept information that might transform her into someone else, and the very tools she has used to put a price on information are inadequate because they assume a fixed self.
answer: |-
  Below is the desiderata list for a theory of the value of information, structured to meet your needs. It captures the core requirements, distinctions, and tensions, with explicit notes on non-negotiable principles, camp-specific commitments, and potential conflicts. I close with a brief assessment of standard expected-utility (EU) theory and its dissenters against these criteria.

  ---

  ### **Desiderata for a Theory of the Value of Information**  
  *Key*:  
  - **Non-negotiable**: Universal for any minimally adequate theory.  
  - **Bayesian/EU camp**: Specific to expected-utility maximization.  
  - **Transformative camp**: Acknowledges information that alters identity/preferences.  
  - **Conflict?**: Marks tensions between desiderata.  

  1. **Non-negative value for flexible, stable agents (Non-negotiable)**  
     - **Requirement**: Information must never have *ex ante* negative value for an agent who:  
       (a) Can freely disregard information (no coercion to act on it),  
       (b) Has stable preferences/identity (no change in utility function or options),  
       (c) Uses information solely to update beliefs.  
     - **Justification**: The "free disposal" argument: an agent can ignore information and replicate their uninformed strategy. Violating this implies logical inconsistency (e.g., paying to avoid free information is irrational under stable conditions).  
     - **Rules out**: Agents who cannot ignore information (e.g., compulsive actors) or whose decision rules force harmful updates.  

  2. **Positive value for belief-updating EU maximizers (Bayesian/EU camp)**  
     - **Requirement**: For a Bayesian EU maximizer, more information (in the sense of a finer information partition) must have non-negative *ex ante* value, and strictly positive value if it can change optimal actions.  
     - **Justification**: Blackwell's theorem formalizes this: an experiment is more informative if it leads to better decisions. Core to normative decision theory.  
     - **Rules out**: EU agents who reject free information that could improve decisions.  

  3. **Allowance for negative value in non-Bayesian agents (Non-negotiable)**  
     - **Requirement**: The theory must admit *ex post* or *ex ante* negative value for agents using fixed, non-EU decision rules (e.g., rigid heuristics, precommitment strategies).  
     - **Justification**: Good's theorem: information can harm if an agent's response is suboptimal (e.g., overreacting to noise). Real-world cases include medical diagnoses causing paralysis.  
     - **Conflict?**: In tension with #1–2 if applied to EU agents, but #1 exempts non-flexible/non-stable agents.  
     - **Rules out**: Theories that dismiss all negative-value cases as "irrational."  

  4. **Distinction: Belief updates vs. preference/option/identity changes (Non-negotiable)**  
     - **Requirement**: The theory must separate:  
       - *Belief updates* (information revises probability estimates over fixed states).  
       - *Preference/option changes* (information alters utility functions or available actions).  
       - *Identity changes* (information transforms self-conception or values, e.g., learning a secret that shatters your worldview).  
     - **Justification**: Negative value arises primarily from preference/identity changes (e.g., irreversible grief from a diagnosis). EU theory assumes only belief updates.  
     - **Rules out**: Agents who cannot distinguish belief revision from existential transformation.  

  5. **Distinction: Ex ante vs. ex post valuation (Non-negotiable)**  
     - **Requirement**: The theory must differentiate:  
       - *Ex ante value*: Expected value *before* receiving information (used for acquisition decisions).  
       - *Ex post value*: Realized value *after* receiving information (which may be negative due to regret or harm).  
     - **Justification**: Information can have positive *ex ante* but negative *ex post* value (e.g., a true prediction of disaster you cannot prevent). EU theory focuses on *ex ante*.  
     - **Conflict?**: If *ex post* value is negative despite *ex ante* rationality, it challenges EU norms but does not violate #1–2.  

  6. **Distinction: Instrumental vs. intrinsic value (Transformative camp)**  
     - **Requirement**: The theory must separate:  
       - *Instrumental value*: Information's worth for improving decisions (quantifiable in EU).  
       - *Intrinsic value*: Worth from knowledge itself (e.g., truth as a good, regardless of consequences).  
     - **Justification**: People seek/pay for information even when useless (e.g., "curiosity"), or avoid it despite instrumental benefits (e.g., "blissful ignorance").  
     - **Conflict?**: Intrinsic value can contradict #1–2 (e.g., paying for harmful truth).  

  7. **Distinction: Agent-relative vs. social value (Non-negotiable)**  
     - **Requirement**: The theory must clarify whether value is assessed from the perspective of:  
       - The *individual agent* (e.g., value of insider trading).  
       - *Other agents/society* (e.g., costs of information asymmetry).  
     - **Justification**: Information benefiting one may harm others (e.g., a leak that crashes markets).  

  8. **No conflation of information with control (Non-negotiable)**  
     - **Requirement**: The theory must not equate the value of *knowing* a fact with the value of *controlling* it.  
     - **Justification**: Information reduces uncertainty; control changes outcomes. Learning you have an incurable disease (information) ≠ curing it (control).  

  9. **Handling of self-defeating information (Transformative camp)**  
     - **Requirement**: The theory must account for information that, if acquired, invalidates itself or triggers harmful actions (e.g., learning a prediction causes panic that makes it true).  
     - **Justification**: Real in strategic/game-theoretic contexts (e.g., bank runs).  
     - **Conflict?**: Challenges #1–2 if the agent cannot "disregard" due to psychological/strategic constraints.  

  ---

  ### **Conflict Spotlight**  
  - **#1–2 vs. #3, #4, #6, and #9**: The core tension. EU theory (#1–2) assumes stable, flexible agents. When information alters preferences (#4), forces rigid responses (#3), or has intrinsic disvalue (#6), negative value emerges. **#4 (distinguishing belief updates from identity changes) is the critical requirement that most strains tidy EU theories**—it exposes their inability to handle transformative knowledge.  
  - **#5 vs. #2**: *Ex post* regret can exist even when *ex ante* value is positive, but this is not a formal contradiction—it highlights the gap between decision-time and post-hoc experience.  

  ---

  ### **Assessment of Standard EU Theory and Dissenters**  
  - **Standard EU theory** satisfies #1, #2, #5 (*ex ante*), #7 (agent-relative focus), and #8. It fails #3 (dismisses non-EU agents), #4 (assumes fixed preferences), #6 (ignores intrinsic value), and #9 (assumes information doesn't alter game dynamics). It treats negative-value cases as irrationality or "outside the model."  
  - **Dissenters (e.g., behavioral economics, transformative decision theory)** satisfy #3, #4, #6, and #9 by embracing preference shifts, rigid heuristics, and intrinsic values. They often violate #1–2, arguing that "cannot disregard" is empirically common. They struggle with #5 (*ex ante* quantification) and #8 (blurring information/control).  

  ---

  ### **The Crucial Requirement**  
  **#4 (Distinguishing belief updates from preference/identity changes) does the most to exclude tidy theories**. EU theory collapses this distinction, forcing transformative cases into belief-update frameworks (e.g., "state-dependent utility"). Honoring #4 rules out EU-maximizing agents who face *existential* information (e.g., your protagonist learning a future fact that rewrites her values). She becomes incoherent *as an EU agent* because her utility function is unstable—yet this instability is the human condition your novel explores.  

  This list gives you the bedrock: your character's crisis emerges where #4 clashes with #1–2. She can price information *only* under stability; the unpriceable is what changes her. Use the conflicts to shape her dilemmas—your draft now has stakes no theory can resolve cleanly.
