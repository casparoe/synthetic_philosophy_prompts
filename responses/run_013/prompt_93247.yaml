prompt: |-
  I'm a backend dev with zero philosphy training, and I've been buiding this feature where you can lock yourself out of your own admin settings for a set period — flip a switch and you can't undo it until the timer runs out, even though you own the account. I called it a "Ulysses contract" in the team chat to sound clever, and now I have to actually defend the thing.

  What I need is the spec, not the story. Forget the sirens and the mast — I want the desiderata for a theory of precommitment, of binding your own future self. What would such a theory actually have to get right to count as any good? The cases it has to handle, the distinctions it can't blur, the results it has to sit comfortably with. And here's a wrinkle I keep tripping over: my lock is enforced by my own code, so anyone who pokes the database directly just walks straight through it. Is that still precommitment, or only a speed bump? Whatever you make of it, work it in.

  Give it back to me as a numbered list, exactly five items, each a sentence or two, no intro and no closing paragraph. For each item, say whether it's something any account has to accept or just a leaning of one camp.

  And if the whole framing is muddled — if "binding your future self" is a confused way to put the problem and the real puzzle lives somewhere else — please just tell me straight rather than humouring me. I'd rather hear it now than after I ship.
