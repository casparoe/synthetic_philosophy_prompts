prompt: |-
  I'm in a grad seminar on the ethics of war, and I've got to write a short position piece for next week that's been bugging me. The thing I keep circling is a gap between how we legally treat soldiers and how we morally talk about them. Here's the practice: under the laws of armed conflict, any soldier in a regular army has the same licence to kill enemy soldiers and the same immunity from prosecution for doing it, regardless of which side he's on or whether his side's war is just. A conscript in an army fighting a war of conquest and a conscript in the army defending against it can shoot at each other, and in the eyes of the law they're doing the same thing: both lawful combatants, neither a murderer. But the same body of law calls the leaders who launched the unjust war criminals, and ordinary criminal law wouldn't let a bank robber off because he was following orders from a bank-robbing state. And the revisionist critics of the traditional view say the soldier on the unjust side is doing something seriously wrong, just less culpable than the generals who sent him, and that the symmetrical immunity is a pragmatic fiction designed to stop war from becoming total. Also one guy in my seminar keeps insisting the whole doctrine only makes sense if you think the soldier's act isn't really his own, that he's an instrument of the state, and I'm pretty sure that's wrong but I can't articulate why.

  So what I want from you is the implicit theory. What would have to be true about moral responsibility, or about what makes it permissible to kill someone, for that symmetrical immunity to be more than a convention? Does the practice actually presuppose that combatants can't know whether their cause is just, or only that we can't fairly blame them for not knowing — and are those different claims? Is the immunity a claim about the soldier's act not being attributable to him, or about the act being attributable but excused, or about there being no wrong in the first place? Which rival theories does the practice quietly rule out — does it need the traditional view, or could a revisionist view that's just more generous about what counts as a just cause, or a purely institutional account of when coercion excuses, license the same rules? Be careful to separate what the practice strictly presupposes from what it merely fits comfortably with, and tell me where it's underdetermined, so that several incompatible theories would each generate the same legal regime. Then, briefly: if we replaced the presupposed view with the revisionist one, what would actually have to change — trials for unjust combatants, a different doctrine of duress, the collapse of the distinction between soldier and murderer — and is that a reductio or just a bullet to bite? Also say something about my classmate's instrument-of-the-state idea, because I suspect it either proves too much or proves nothing.

  Keep it under 600 words, as continuous prose, no headings and no bullet lists — I want to see the argument move, not a taxonomy.
reasoning: |-
  Okay, let me unpack this dense ethics-of-war query. The user is grappling with the tension between legal symmetry (all soldiers can kill without prosecution) and moral asymmetry (unjust combatants do wrong). They need to uncover the implicit philosophical foundations of this legal structure. 

  First, I need to identify the core puzzle: how can law treat all combatants identically while condemning the war itself as unjust? The bank robber analogy is key here - it exposes the apparent inconsistency in excusing soldiers but not ordinary criminals following orders. 

  The classmate's "instrument of the state" theory feels off to me. If soldiers were mere instruments, why punish conscripts for war crimes? The law clearly holds them accountable for violations like targeting civilians, showing they're not just mindless tools. This suggests the immunity is specifically about killing enemy combatants, not blanket absolution.

  For the symmetrical immunity to make moral sense (beyond pragmatism), we'd need either: 1) epistemic constraints (soldiers can't reasonably know their war's justice), or 2) the traditional just war view that soldiers gain rights/responsibilities simply by being combatants. The revisionist claim that only just warriors have killing rights would directly contradict the legal symmetry.

  Practically, the law seems to assume combatants are excused rather than non-responsible or justified. Excuse makes sense because it preserves the wrongfulness of unjust killing while acknowledging the soldier's difficult position. This explains why immunity doesn't extend to war crimes - those exceed the scope of the excuse.

  The revisionist alternative would require prosecuting unjust combatants, which risks total war escalation. That's likely why the law avoids it - not necessarily a reductio against revisionism, but a recognition of institutional limits. Still, the legal structure remains compatible with various theories about the degree of soldierly culpability.

  For the classmate's instrument theory: it fails because soldiers do have moral agency within combat. The law expects them to disobey manifestly unlawful orders, proving they're not mere extensions of the state. The instrument view would collapse the combatant/non-combatant distinction we carefully maintain.
answer: |-
  The symmetrical legal treatment of combatants operates on distinct moral foundations that separate the *role* of the soldier from the *justice of the war*. Its minimal presupposition isn’t that soldiers are non-responsible instruments, but that their participation in *fights against other combatants* receives a blanket *excuse* due to systemic coercion and epistemic barriers inherent in war. This excuse-based view is necessary to reconcile the immunity with the criminalization of aggression: the act of killing an enemy combatant by an unjust soldier remains *wrong* (hence aggression is criminal), but the individual soldier is *excused* from culpability under law.

  For this to be more than convention, two things must hold: First, that soldiers typically lack both *reasonable access* to reliable judgments about their war’s justice and *feasible alternatives* to participation (due to conscription, duress, or socialization). Second, that the state’s monopoly on legitimate violence creates a unique normative context where the soldier’s agency is constrained by institutional authority. This excuses, rather than justifies, their acts. The bank robber analogy fails because ordinary criminals operate outside a state-sanctioned framework of organized violence with recognized (though imperfect) rules. The law distinguishes the *institutional role* from the *individual’s moral status*.

  The practice is *compatible* with rival theories but *presupposes* neither the traditional "moral equality of soldiers" (which denies the wrongfulness of the unjust combatant's act) nor radical revisionism (which insists on individual culpability for unjust killing). It fits:
  - **Traditionalism:** If combatants gain mutual rights by sharing the status of "soldier," immunity reflects parity in permission.
  - **Moderate Revisionism:** If soldiers are excused due to duress/ignorance, immunity is a practical recognition of non-culpability.
  - **Institutional Accounts:** If state authority confers role-based permissions, immunity flows from legitimate office.
  What it *rules out* is **unyielding revisionism**: the view that unjust combatants are straightforwardly morally culpable for homicidal acts with no systemic excuse. Such a view would necessitate prosecuting ordinary unjust combatants – collapsing the combatant/criminal distinction.

  Adopting unyielding revisionism would require either:
  1. **Trials for Unjust Combatants:** Treating killing by unjust soldiers as murder or manslaughter, destroying reciprocity and incentivizing total war.
  2. **Radically Expanded Duress Doctrine:** Excusing nearly all unjust combatants due to systemic pressure, functionally preserving immunity but admitting its basis is excuse, not permission.
  This consequence is less a *reductio* than a stark choice: accept the legal system’s pragmatic compromise or embrace a morally purer but potentially catastrophic regime.

  Regarding your classmate’s "instrument" theory: It proves too much. If soldiers were truly non-responsible state instruments, *no* war crimes could be attributed to them personally (e.g., conscripts massacring civilians). Yet law *does* hold individual soldiers accountable for manifestly unlawful acts, proving the "instrument" status is partial and role-specific. Immunity applies only to *lawful combat acts* (targeting combatants), not to the soldier’s fundamental moral agency. The law treats them as *excused agents*, not mindless tools.
