prompt: |-
  Right, I'm building a seminar on explanation in history and I keep circling back to the Browning/Goldhagen thing, and I want a proper diagnosis rather than another summary. You know the setup: Browning on Reserve Police Battalion 101 says the men doing the shooting were mostly middle-aged working-class blokes from Hamburg, not Nazi fanatics, and in at least one case were literally offered the chance to step out of the killing and almost none took it -- so he reaches for the ordinary social-psychological stuff, obedience, peer pressure, the slow slide into brutality. Goldhagen looks at more or less the same documents and says no, what you're seeing is a specific eliminationist antisemitism that was the common property of ordinary Germans, so they weren't merely ordinary men caught in a situation, they were willing. Neither of them is short of facts; they're drowning in the same archive. And yet the argument hasn't moved an inch in decades.

  What I want from you is a diagnosis, not a verdict. Is this a straightforwardly empirical disagreement about motive that a bit more archival digging could settle? Is it a disagreement about what counts as an explanation of an atrocity at all -- whether citing a general mechanism like conformity actually explains anything, or just redescribes the same events in cooler language? Or is it two people answering different questions under one heading, one asking why these particular men did this, the other asking what made this particular atrocity possible here and not somewhere else?

  I've got a half-formed hypothesis and you're welcome to tell me it's rubbish. I suspect the real hinge is a disagreement about whether an ideology has to be consciously articulated by the agent to count as a cause -- Goldhagen treating the culture as sufficient whether or not the individual could have put it into words, Browning effectively demanding a motive the man himself could avow -- and that once you pin down what each of them means by cause, the whole thing either collapses into a fairly boring empirical question or turns into a philosophical one about levels of explanation.

  So: lay out what each side actually commits itself to, sort the parts of the impasse that are merely verbal from the parts that aren't, and then tell me honestly what would count as progress here -- a distinction, a piece of evidence, a change of question -- or whether this is one of those cases where we should just accept that the two accounts answer to different explanatory demands and stop waiting for a winner.

  Please write your answer in British English.
