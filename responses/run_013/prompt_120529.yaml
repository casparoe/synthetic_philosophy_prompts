prompt: |-
  I'm a third-year joint phil/econ student and I've somehow ended up running next week's discussion section for the rational choice course — 50 minutes, about 15 students, they've all done the decision-theory half but none of them have read any philosophy. The topic is weakness of will, and the lecturer wants it hooked up to hyperbolic discounting. Here's where I keep getting stuck: once you've got time-inconsistent preferences, you can redescribe basically any case of someone not doing what they judged best as a clash between two temporally separated selves who simply want different things — and then there's no weakness left to explain, just intrapersonal bargaining. I dont want to teach it like the philosophical problem survives untouched, but I also don't want to just roll over and say the econ model dissolves it.

  So: act like a philosophy-of-econ TA who's taught this crossover a bunch, think carefully, and brainstorm the dependency structure before you commit to a plan. Don't explain weakness of will to me, I've got the standard material — plan how I should explain it. What has to land first for the tension to even be visible, and why can't I just open with the discounting curve? The one carrying example that should hold the whole thing together — not the Odysseus-and-the-sirens bit, not the marshmallow test, not smoking; I want a case where the two frameworks genuinely disagree about whether there's any weakness of will there at all — plus what that example has to have and what it must not have. Then the misconceptions, in the order they'll actually show up, and exactly where in the sequence I head each one off. I'm expecting at least 'akrasia is just impulsiveness', 'discounting explains the feeling of giving in', 'time inconsistency is the same thing as weakness of will', and 'commitment devices solve it'. Finish with the one question I can ask at the end that tells me whether the tension landed rather than just the vocabulary, and tell me what to leave out at this level and to say out loud that I'm leaving it out.
