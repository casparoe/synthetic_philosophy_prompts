answer: |-
  Here’s a battle-tested plan focusing on **pedagogical sequencing** and **conceptual tension**, designed for 50 minutes with econ-savvy but philosophy-naive students. The goal is to make the *disagreement* between frameworks visible, not just present two models.

  ### Core Pedagogical Strategy
  **Start with the phenomenology → Introduce philosophy’s puzzle → Deploy economics’ solution → Reveal the unresolved residue.**  
  *Why this order?* Jumping straight to hyperbolic discounting preemptively collapses the philosophical problem. Students need to feel the pull of "weakness" before seeing it "dissolved."

  ---

  ### The Anchor Example: "The Gym Skipper"
  **What must it have:**  
  - A trivial immediate cost (low willpower demand)  
  - A clear, consistent prior judgment ("I value health")  
  - Instant regret upon acting ("I feel guilty *as* I skip")  
  - *No* overwhelming temptation (rules out "impulsiveness")  

  **What it must NOT have:**  
  - High stakes (avoids distraction by consequences)  
  - External coercion or complexity  
  - Delayed regret (which discounting *can* explain)  

  **The Case:**  
  *"Alex plans a 30-min gym session after work, valuing fitness. When the time comes, Alex feels slightly lethargic (not exhausted) and thinks ‘I’ll just skip today.’ Alex orders takeout, watches TV, and immediately feels a pang of guilt while lounging — not later, but while doing it. Alex thinks: ‘I have no excuse; this was weak.’"*  

  **Why it works:**  
  - Hyperbolic discounting *applies* (preference reversal toward immediate ease).  
  - But discounting alone can’t explain:  
    - The *absence of positive desire* for TV (it’s not "tempting," just slightly easier).  
    - The *simultaneous regret* (guilt co-occurs with action, not post-hoc).  
    - The self-accusation of "weakness" despite negligible effort.  

  ---

  ### Step-by-Step Sequence (50-Minute Breakdown)

  #### **Min 0–10: Activate Intuition**  
  - **Do:** Poll students: "Raise hand if you’ve done something like Alex?" Discuss why *they* called it "weakness."  
  - **Goal:** Surface the phenomenology — regret, self-judgment, sense of failure.  
  - **Head off:** "Akrasia is just impulsiveness" by noting Alex feels *un*tempted by TV.

  #### **Min 10–20: Philosophy’s Puzzle**  
  - **Do:** Frame weakness of will (*akrasia*) as:  
    > *"Acting against your own best judgment, while believing in the moment that your judgment is correct."*  
  - **Contrast:** With recklessness ("I knew smoking was bad but didn’t care") or ignorance ("I forgot the gym was important").  
  - **Anchor:** Alex *endorsed* the gym plan 30 mins ago and still agrees it’s best *while* skipping.  
  - **Key Point:** Akrasia is a *rational failure* — the puzzle is *how* this is possible.

  #### **Min 20–30: Economics’ Solution (Hyperbolic Discounting)**  
  - **Do:** Introduce discount curves. Contrast exponential vs. hyperbolic with Alex’s case:  
    - At T-1 (planning): Gym (reward at T+1) > TV (reward at T+0)  
    - At T+0 (acting): TV (reward at T+0) > Gym (reward at T+1)  
  - **Reframe:** "Alex isn’t ‘weak’ — T+0 Alex just has *different preferences* than T-1 Alex."  
  - **Head off:** "Discounting explains the feeling" → *Acknowledge* it explains *preference reversal* but not the *self-accusation* or *regret*.

  #### **Min 30–40: The Tension – Where Philosophy Pushes Back**  
  - **Pose the clash:**  
    - Economics: "No weakness — just changing preferences across time."  
    - Philosophy: "But Alex feels *identical* to past/future Alex! The ‘selves’ aren’t strangers; *Alex* judges *Alex*."  
  - **Critical Question:**  
    > *"When T+0 Alex chooses TV, does Alex *endorse* TV as *better*? Or does Alex feel TV is worse *but chooses it anyway*?"*  
  - **Head off:**  
    - "Time inconsistency = weakness" → No: Time inconsistency is *descriptive*; weakness is *normative*.  
    - "Commitment devices solve it" → *Acknowledge* they fix behavior but ask: "Do they resolve Alex’s *self-reproach*? Or prove it was justified?"

  #### **Min 40–50: Synthesis & The Unresolved Core**  
  - **Conclude:** Hyperbolic discounting *explains preference reversal* but doesn’t address:  
    1. The **unity of agency** (Why does Alex feel *one self* failing?).  
    2. **Regret without uncertainty** (Alex knew TV wasn’t better *even in the moment*).  
  - **Final Question to Test Understanding:**  
    > *"In the gym case, does hyperbolic discounting show there was no *real* weakness of will — or does it just explain *how* weakness happened?"*  
    *(Listen for whether they see it as dissolving vs. describing the problem.)*  

  ---

  ### What to Explicitly Omit (And Say So!)  
  - **Say:** "We’re bracketing *moral responsibility* and *free will debates*. We’re focusing on the *structure* of agency."  
  - **Omit:**  
    - Neuroeconomic correlates (temptation ≠ akrasia).  
    - Full metaethics (e.g., "What *is* value?").  
    - Multi-selves as literal subagents (it’s a metaphor here).  

  ### Why This Works  
  - **Dependency Structure:** Philosophy’s puzzle must feel *inescapable* before economics "solves" it, revealing the solution’s limits.  
  - **The Gym Example:** Its banality makes discounting feel *reductive* — students intuit Alex’s guilt isn’t just about preference clashes.  
  - **Misconceptions Preempted:** Each arises naturally in the sequence and is countered by the prior step.  

  **Final Tip:** End by assigning Davidson’s *"How is Weakness of Will Possible?"* (short, accessible) to force engagement with the philosophy. The tension won’t resolve — and that’s the point.
