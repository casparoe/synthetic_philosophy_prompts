prompt: |-
  I'm applying for a small internal research grant — one semester, basically my own time plus a little travel money — and I need you to turn a half-formed idea into a one-page proposal.

  The idea: everyone files Williams's integrity objection under "objection to consequentialism." The husband saves his wife and then adds a thought about being permitted to do so; he's had one thought too many. I think that's the wrong filing cabinet. What the objection is really targeting is any theory that makes the agent, at the moment of acting, step into the justificatory standpoint — the standpoint from which reasons get assessed rather than the standpoint from which they're lived. If that's the right reading, the objection should bite just as hard on Kantian and virtue-ethical accounts, which would promote it from a parochial grumble about one family of views to a formal constraint on moral theories generally.

  The bit I want to add, and the bit I'm unsure wether is original: split a reason's roles into guiding (what I actually think with while I act) and warranting (what makes the act defensible afterwards). My hunch is the one-thought-too-many objection only has force when a theory collapses the two — insists that the warranting reason must also be the guiding one. Then the usual consequentialist dodges (it's only a decision procedure, rule-worship, appeal to the agent's dispositions) can be redescribed as clumsy attempts to keep the roles apart.

  Write the proposal: state the question so it has a determinate answer, say why the going positions leave it open (arguments, not a lit review — I'll handle the citations myself), give me a month-by-month plan for one semester, say what would count as the project failing, and tell me honestly whether this fits a semester or whether I'm kidding myself.
