  Borderline cases they mentioned are brilliant tests: the unnoticed name proves publicity is necessary; the already-notorious case shows baseline reputation matters; the volunteer demonstrates some actively trade infamy for identity. This confirms the mechanism is about standing, not shame. 

  "Reputational collapse" feels close but implies suddenness. "Status penalty" is too economic. Aha! "Constitutive discredit" - it constitutes new social reality through documentation. The constitutive aspect explains permanence, while discredit captures the standing erosion. 

  Better define boundaries: not shaming (no intent), not stigma (not group-based), not criminal record (state-imposed). It's society's organic reordering when hidden truths become visible capital adjustments. For transitional justice scholars, this reframes "accountability" beyond legal frameworks. 

  User's frustration with existing terms was spot-on. They've identified a genuine gap at the intersection of symbolic sociology and transitional justice. Naming it "constitutive discredit" honors their insight while giving scholarly footing. Should emphasize how this reveals truth commissions' hidden distributive logic - they're not just revealing facts, but reassigning social worth.
answer: |-
  What you're describing is a profound and under-analyzed phenomenon in transitional justice. It doesn't have a single universally accepted term, but it intersects with several established concepts. The closest fit is **Symbolic Punishment** or **Reputational Sanction**, but these require refinement. I propose the term **"Constitutive Discredit"** to capture its essence.

  ### Defining Constitutive Discredit
  **What it is:**  
  The *permanent, socially enforced erosion of an individual's status, identity, and relational capital* resulting from the official public record of their actions during a truth commission. It operates through:
  1.  **Publication as Constitutive Act:** The official report doesn't merely *describe* acts; it *creates* a new, immutable social fact about the individual.
  2.  **Social Proportionality:** The severity scales with the individual's *prior social standing* and embeddedness in networks reliant on reputation (e.g., elites lose club memberships, pensions, family esteem; low-status individuals face minimal change).
  3.  **Autonomous Enforcement:** Punishment isn't decreed or administered by the state or commission. It emerges spontaneously from societal reactions (withdrawal of respect, exclusion, internalized shame) triggered by the published record.
  4.  **Permanence & Accessibility:** The record is fixed, public, and eternally retrievable. The "sentence" never expires.

  **What it isn't (and why your terms fall short):**
  *   **Shaming:** Shaming is *intentional* and *performative* (e.g., stocks, social media pile-ons). Here, humiliation is an *unintended consequence* of neutral record-keeping. The commission aims for truth, not humiliation.
  *   **Stigma:** Stigma attaches to a *category* (e.g., "collaborator," "torturer"). Constitutive Discredit is *individualized* and tied to specific recorded acts and identity.
  *   **Criminal Record:** A formal legal tool used by the state to impose future disabilities. Constitutive Discredit is extra-legal, rooted in social perception, and immediate.
  *   **Social Death:** An extreme, total exclusion from society. This is often a *spectrum* of diminished standing, not absolute erasure.
  *   **Moral Luck:** While related (outcome depends on circumstance – here, prior status), Moral Luck is broader and doesn't focus on the *mechanism* of public record creation.

  ### Borderline Cases & Nuances
  1.  **The Name on the Unread Page:**  
      *   **Status:** This person experiences *potential* discredit, but not *actualized* discredit. The mechanism requires public *awareness*. If the record exists but isn't accessed/known, the constitutive act is incomplete. It's a loaded gun that hasn't fired.
  2.  **The Already Notorious:**  
      *   **Status:** The impact is likely diminished. Their existing "infamy capital" means the new record may be absorbed into their established negative narrative, causing less *marginal* damage than for a respected figure. However, it can still deepen existing exclusion or solidify a negative legacy.
  3.  **The Volunteer Seeking Identity:**  
      *   **Status:** This is fascinating. For someone previously invisible ("nobody"), the act testifying and being recorded *constitutes a new, significant public identity*, albeit a negative one. They *gain* recognition ("somebody") at the cost of discredit. This highlights how constitutive acts can build identity as well as destroy status. Their "punishment" is inseparable from the creation of their public self. They trade anonymity for infamous recognition.

  ### Why "Constitutive Discredit" Fits
  *   **Constitutive:** The official publication *creates* the social fact that *is* the punishment. It transforms hidden acts into defining public truths.
  *   **Discredit:** Precisely captures the loss of credibility, standing, honor, and relational value – the core "currency" being eroded.
  *   **Distinguishes it:** Focuses on the *mechanism* (official record creating social fact) and the *nature of the harm* (erosion of status capital), separating it from intent (shaming), legal tools (criminal record), or group identity (stigma).

  ### Foundational Concepts
  This phenomenon draws from:
  1.  **Pierre Bourdieu's "Symbolic Capital":** Reputation, honor, prestige are forms of capital. Truth commissions trigger a massive, public devaluation of this capital for some.
  2.  **Nils Christie's "Social Gravity of Crime":** Christie argued punishment's impact depends heavily on the offender's social bonds and status. Your observation confirms this in an extreme, formalized setting.
  3.  **Transitional Justice & "Moral Reckoning":** Scholars (e.g., Martha Minow, Priscilla Hayner) discuss truth commissions facilitating societal judgment beyond law. Constitutive Discredit is the *mechanism* of that reckoning for individuals.
  4.  **Philosophy of Punishment (Expressive Theory):** Punishment expresses societal condemnation. Here, the *report itself* becomes the enduring expression, and society "enforces" it through ongoing exclusion/contempt.

  ### Conclusion
  You've identified a real, powerful, and ethically complex category: **Constitutive Discredit.** It's the unlegislated, socially-administered, status-proportional, and permanent punishment that emerges inevitably from the official public documentation of acts granted legal amnesty within a truth commission process. It highlights the profound difference between *legal impunity* and *social impunity*, and exposes how truth commissions, while foregoing criminal justice, often enact a potent, personalized form of social judgment rooted in the irrevocable power of the published record. The borderline cases you raised are excellent tests, demonstrating how the effect hinges on publicity, prior status, and the fundamental human need for recognition, even if negative.
