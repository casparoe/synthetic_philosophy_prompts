  What makes this tricky? First, it's not intentional punishment ("nobody's enforcing it"). Second, it's paradoxically proportional to social status rather than crime severity. Third, it's permanent through documentation. The examples (colonels vs drivers) show they've grasped how social capital mediates consequences. 

