prompt: |-
  Okay, so here's my situation. I'm a science and ideas reporter at a mid-size daily — I do the Thursday science page and one longer feature a month — and my inbox is a firehose of archaeology press releases. I keep getting burned. Last month I ran a piece built around a release that said a burial "proves" a prehistoric community had a belief in an afterlife, and a friend of mine who actually did her PhD in this stuff was polite about it but basically said the release had smuggled in about four inferential steps and I'd reported the last one as if it were the first. I don't have time to read site reports. I usually have the press release, maybe an abstract, a photo, and sometimes a 10-minute phone call with a lead author who is on a dig and calling me from a jeep.

  What I want from you: a procedure. Something I can actually run on a release in about 10-15 minutes and that tells me how much of the claim I can responsibly report, how I should hedge it, and when I should just spike it.

  So — you're a philosopher of science who specializes in archaeological inference, the epistemology of how you get from dirt, bones, and pots to claims about what people believed, valued, or how their institutions worked. Before you write anything, brainstorm for a minute about the ways this kind of reasoning goes wrong, and be specific about which of those failure modes are visible from a press release versus which ones are invisible from where I'm sitting. Then think step by step and give me the procedure.

  Please build it around the stuff that actually matters, not generic "consider the source" advice. Off the top of my head the things I've heard matter: whether the object was found in a secure context at all (provenience, stratigraphy, association), what happened to the deposit between when people dropped it and when someone dug it up, the fact that one pattern can have many different causes, the difference between showing that people *did* something and showing that they *believed* something, and the old rule of thumb that you can read technology off of tools pretty well, subsistence a little worse, social organization with real difficulty, and belief almost never. Analogies to living societies seem to tell you what's possible rather than what happened. Use whatever's right from that list and add what I'm missing.

  Format: ordered questions I ask in order, what counts as a sufficient answer to each, where the procedure stops and says "you can't run this claim," and — this matters — where it hands off to my judgment or to an actual archaeologist because the question is about values or about something I can't see from a release. Flag the steps that are judgment calls dressed up as procedure. I'd love a two-minute version too, like the three questions I ask when I'm on deadline.

  Then run it on three cases: (1) a release about a roughly 30,000-year-old burial of two children with thousands of pierced shell beads, framed as evidence of religious belief; (2) a release about a burned destruction layer with arrowheads lodged in a wall at a fortified settlement, framed as proof of a violent conquest; and (3) a case I'm not going to enjoy — a release about imported pottery turning up in a provincial town, which is the spine of a feature I've already half-written about the town being a cosmopolitan trade hub. Tell me straight what your procedure says I can and can't report there.

  Finish with what this procedure can't do, and which kinds of releases will defeat it no matter how carefully I follow it.
reasoning: |-
  Okay, let me tackle this problem step by step. The user is a science reporter dealing with archaeology press releases and has been burned before by overinterpreted claims. They need a practical procedure to evaluate these releases quickly.

  First, I need to understand their constraints. They have 10-15 minutes per release, limited access to sources (press release, maybe abstract, brief call with author), and no time for site reports. The core problem is distinguishing solid inferences from speculative leaps, especially with claims about beliefs, social structures, or events.

  The user mentioned specific failure modes: insecure context, post-depositional disturbances, equifinality (one pattern having multiple causes), and the hierarchy of inference (technology > subsistence > social organization > belief). I should build the procedure around these.

  Key epistemological issues in archaeology:
  - Context integrity: Provenience, stratigraphy, association. If an artifact is out of context, interpretations crumble.
  - Taphonomy: What happened between deposition and excavation? Natural processes can mimic cultural ones.
  - Equifinality: A single pattern can have multiple explanations. Burials could be ritual or practical.
  - Inference ladder: Belief claims require multiple supporting lines of evidence.
  - Analogies: Useful for possibility, not probability. Cannot assume universality.

  For the procedure, I'll create a flowchart-style checklist with clear stopping points. Must flag where judgment is needed versus hard stops. Include a 2-minute version for deadlines.

  Then apply to their three cases:
  1. Child burial with beads → religious belief: Need to check context security, rule out natural bead accumulation, assess burial treatment consistency, and see if multiple evidence lines support ritual intent.
  2. Destruction layer → violent conquest: Verify stratigraphy integrity, arrowhead association with layer, rule out accidents/rituals, check for corroborating evidence like weapon trauma on bones.
  3. Imported pottery → trade hub: Assess quantity/context of finds, rule out elite emulation or down-the-line trade, look for supporting infrastructure evidence.

  Finally, note limitations: Press releases hiding methodological flaws, absence of counterarguments, claims relying on unpublished data, or complex multivariable analyses can't be caught by this method. Also, ideological biases or publication pressures won't be visible.

  The procedure should empower the reporter to push back on authors during calls and spike unsupported claims without guilt. Emphasize that "interesting but uncertain" is better journalism than "false certainty."
answer: |-
  Here's a battle-tested procedure designed specifically for your constraints, targeting the inferential cracks common in archaeological press releases. It focuses on **epistemological triage** – identifying where the inferential chain is strongest, weakest, or broken, based solely on the release, abstract, and a short call.

  **Core Failure Modes & Visibility from Your Vantage Point:**

  *   **Visible (Can Assess):**
      *   **Missing Context:** Lack of mention of stratigraphy, secure association, or provenience.
      *   **Inferential Leaps:** Claim jumps directly from artifact/burial/deposit to complex social/religious concept without intermediate steps.
      *   **Ignored Equifinality:** No mention of alternative explanations for the observed pattern.
      *   **Overstated Certainty:** Use of words like "proves," "confirms," "first," "oldest," without clear justification.
      *   **Analogy Overreach:** Using ethnographic analogy as direct evidence, not just possibility.
      *   **Inference Level Mismatch:** Claiming high-level inference (belief, institutions) from low-level evidence (single artifact type, isolated feature).
  *   **Invisible (Requires Expertise/Site Report):**
      *   **Subtle Stratigraphic Issues:** Minor disturbances, bioturbation, unclear section drawings.
      *   **Dating Ambiguity:** Nuances of sampling, calibration, or method limitations.
      *   **Taphonomic Complexity:** Detailed post-depositional processes affecting specific materials/bones.
      *   **Statistical Significance:** If quantitative, the robustness of analysis.
      *   **Internal Scholarly Debate:** Existing critiques or alternative interpretations within the specialty.

  ---

  **The 10-15 Minute Inference Audit Procedure**

  **Ask these questions IN ORDER. Stop and spike if any "Red Light" condition is met.**

  1.  **What's the CORE CLAIM?** (20 seconds)
      *   *Sufficient Answer:* A single, clear sentence stating the primary interpretation (e.g., "This proves belief in afterlife," "This confirms violent conquest," "This shows the town was a cosmopolitan hub").
      *   *Red Light:* No clear claim, multiple contradictory claims, claim is purely descriptive ("We found beads").
      *   *Judgment Call:* Is the claim inherently sensationalized or vague? (Note for hedging later).

  2.  **What's the PHYSICAL EVIDENCE?** (1 minute)
      *   *Sufficient Answer:* A specific list: objects (e.g., beads, arrowheads, pottery types), features (e.g., burial pit, destruction layer, building), deposits (e.g., ash layer), associations (e.g., beads *on* skeletons, arrowheads *in* wall).
      *   *Red Light:* Evidence is vague ("artifacts," "remains"), inferred rather than observed, or primarily analogy.
      *   *Judgment Call:* Is the evidence *sufficiently described* to support the next step? (e.g., "beads" vs. "thousands of meticulously pierced shell beads arranged in patterns around the head and wrists").

  3.  **What's the CONTEXT?** (2 minutes - **CRITICAL STEP**)
      *   *Ask:* Does the release explicitly state:
          *   **Stratigraphy:** Was the find in a sealed, undisturbed layer? Is the stratigraphy clear and dated?
          *   **Provenience:** Is the exact 3D location recorded? Was it excavated carefully?
          *   **Association:** Are the key elements found *directly together* in a way unlikely to be accidental (e.g., beads *on/in* the burial, arrowheads *embedded* in the wall, imported pottery *within* specific dated structures, not just "at the site")?
      *   *Sufficient Answer:* Clear "yes" to all relevant context types mentioned *specifically for this find*. Mentions of methods (e.g., "excavated in 10cm spits," "photographed in situ," "samples taken for micromorphology").
      *   *Red Light:* No mention of context, vague statements ("found in the ancient city"), evidence clearly out of context (e.g., surface find, looted context), or context contradicts association (e.g., beads found *near* burial but not demonstrably *with* it).
      *   *Judgment Call:* How *robust* does the context sound? (e.g., "sealed pit" = strong; "cultural layer" = weak). **THIS IS OFTEN THE BREAKING POINT.**

  4.  **What's the INFERENTIAL LADDER?** (3 minutes - **CORE ANALYSIS**)
      *   *Ask:* How many logical steps are there between the physical evidence and the core claim? Does the release articulate them? Are alternative explanations for the evidence mentioned and addressed?
      *   *Hierarchy Check:* Match the claim to the hierarchy:
          *   **Technology/Function:** High reliability (e.g., "This tool was used for scraping hides").
          *   **Subsistence:** Moderate reliability (e.g., "These bones indicate they ate deer").
          *   **Social Organization:** Low reliability (e.g., "This large building was a chief's house").
          *   **Belief/Meaning:** Very Low reliability (e.g., "This burial proves belief in an afterlife").
      *   *Sufficient Answer:* The release lists the steps (e.g., 1. Beads are ornaments. 2. Ornaments on burial indicate special treatment. 3. Special treatment implies ritual. 4. Ritual implies belief in afterlife). It mentions 1-2 key alternatives (e.g., "beads could be grave goods OR intrusive from later layer"; "destruction could be war OR earthquake OR ritual burning"; "pottery could be trade OR imitation OR heirloom").
      *   *Red Light:*
          *   Claim jumps directly to high-level inference (Belief/Meaning) without intermediate steps.
          *   No alternatives mentioned *at all* for evidence open to multiple interpretations.
          *   Claiming high-level inference from single, ambiguous evidence type.
      *   *Judgment Call:* How plausible are the steps? How strongly does the release *argue* against the alternatives? How many steps are missing? **THIS IS WHERE YOUR FRIEND'S "4 INFERENTIAL STEPS" PROBLEM LIVES.**

  5.  **What SUPPORTING EVIDENCE exists BEYOND the core find?** (2 minutes)
      *   *Ask:* Is this a lone find, or part of a pattern? Does the release mention:
          *   Similar finds at the *same* site?
          *   Similar finds at *contemporary* sites in the region?
          *   Multiple *lines* of evidence converging (e.g., burial treatment + ritual structures + iconography)?
      *   *Sufficient Answer:* Mentions corroborating evidence (even briefly), frames the find within a larger pattern or ongoing research.
      *   *Red Light:* Presents the find as unique, unprecedented, or isolated. No mention of other relevant work.
      *   *Judgment Call:* How significant is the supporting evidence? Does it genuinely strengthen the core inference, or is it tangential?

  6.  **What does the AUTHOR SAY during the CALL?** (5 minutes - **FOCUSED INTERROGATION**)
      *   *Ask SPECIFICALLY about the weak points identified above:*
          *   "Can you walk me through the key steps linking [Evidence] to [Claim]?"
          *   "How confident are you about the context (stratigraphy/association)? What's the strongest evidence it's secure?"
          *   "What's the main alternative explanation someone might propose for [Key Evidence], and why do you reject it?"
          *   "Is this inference [e.g., belief, conquest, hub status] based *only* on this find, or is it part of a larger pattern here/elsewhere?"
      *   *Sufficient Answer:* Clear, logical explanations addressing your specific concerns. Acknowledges limitations and uncertainties. Avoids defensiveness.
      *   *Red Light:* Vague, circular, or dismissive answers. Unable/unwilling to articulate the inferential steps or alternatives. Evasive about context. Dismisses criticism outright. **EXTREME CAUTION IF THEY SAY "IT'S OBVIOUS."**
      *   *Judgment Call:* Does their explanation *resolve* your concerns or make them worse? Do they sound rigorous or speculative?

  **Procedure Output:**
  *   **Green Light (Reportable):** Passed all steps. Context strong, inferential ladder logical and with few steps (or well-supported multi-step), alternatives addressed, supporting evidence exists. Hedge appropriately for level (see below).
  *   **Yellow Light (Hedge Heavily/Reframe):** Context ok but not perfect, inferential ladder has a weak/missing step, alternatives plausible but not fully dismissed, limited supporting evidence. **REQUIRES SIGNIFICANT REFRAMING.**
  *   **Red Light (Spike It):** Failed Step 3 (Context) or Step 4 (Inferential Ladder). Core claim is fundamentally unsupported from your audit. Don't waste time.

  **Hedging Guide (Based on Hierarchy & Ladder Strength):**
  *   **Strong (Tech/Subsistence, Secure Context, Short Ladder):** "Demonstrates," "Indicates," "Evidence for."
  *   **Moderate (Low Social, Good Context, Ladder w/ Support):** "Suggests," "Points towards," "Could reflect," "May indicate," "One interpretation is..."
  *   **Weak (Belief, Any Context Issues, Long/Weak Ladder):** "Raises the possibility," "Might be interpreted as," "Some researchers propose," "While speculative, [Author] argues that..."

  ---

  **The 2-Minute Deadline Version:**

  1.  **CLAIM:** Is it a high-level inference (Belief/Social)? (If Yes, **Extreme Caution**).
  2.  **CONTEXT:** Does the release *explicitly* state secure stratigraphy and direct association for the key evidence? (If No, **Spike/Hedge Aggressively**).
  3.  **ALTERNATIVES:** Are any plausible alternative explanations mentioned? (If No, **Hedge Heavily**).

  ---

  **Case Studies:**

  1.  **30k-year-old Child Burial with Shell Beads (Claim: Religious Belief)**
      *   **Audit:**
          *   Claim: High-level (Belief) - **Caution.**
          *   Evidence: Strong (Thousands of pierced beads on/in burial).
          *   Context: **Critical.** Release *must* state: Intact grave cut? Undisturbed stratigraphy? Beads demonstrably *on/in situ* with skeletons, not scattered above/below? (If vague, **Yellow/Red**).
          *   Ladder: Long & Weak. Evidence: Beads on bodies. Step 1: Beads = Ornaments/Value. Step 2: Ornaments in grave = Special treatment/Status. Step 3: Special treatment = Ritual. Step 4: Ritual = Belief in afterlife. **Missing Steps 3 & 4 explicitly.** Alternatives? (Decoration for journey? Status marker unrelated to religion? Intrusive?).
          *   Support: Is this the only burial? Earliest? Pattern in region? (If not mentioned, weakens).
      *   **Verdict:** **Yellow Light (Hedge Heavily/Reframe).** Report the *burial treatment* as elaborate and indicating high value placed on the children ("one of the earliest known elaborate child burials," "suggests significant social investment"). Explicitly state the inferential leap: "While the researchers suggest this *could* reflect early concepts of an afterlife or ritual belief, such interpretations are inherently difficult from burial evidence alone, and other explanations, like marking high social status, are also possible." **DO NOT** headline or frame around "religious belief."

  2.  **Burned Destruction Layer with Arrowheads in Wall (Claim: Proof of Violent Conquest)**
      *   **Audit:**
          *   Claim: High-level (Social Event - Conquest) - **Caution.**
          *   Evidence: Strong (Arrowheads embedded in wall + destruction layer).
          *   Context: **Critical.** Release *must* state: Arrowheads *embedded*? Stratigraphy shows burning contemporaneous with arrowhead deposition? No evidence of rebuilding/reoccupation immediately after suggesting rapid abandonment? (If arrowheads "found near" wall or stratigraphy vague, **Yellow/Red**).
          *   Ladder: Moderate. Evidence: Weapons in defensive wall + destruction. Step 1: Destruction likely sudden/catastrophic. Step 2: Weapons embedded = Attack happened. Step 3: Attack = Conquest? Alternatives? (Ritual destruction? Earthquake followed by looting/scavenging with weapons used later? Internal conflict? Failed raid, not conquest?).
          *   Support: Other trauma evidence (skeletons with weapon wounds)? Signs of different material culture after? Wider regional conflict pattern?
      *   **Verdict:** **Green Light (Reportable, Hedge).** Report as "evidence of a violent attack" or "likely military assault." State: "The embedded arrowheads and contemporaneous destruction provide strong evidence the settlement was attacked." **Hedge the "conquest":** "While the researchers interpret this as evidence of conquest leading to the site's abandonment, definitive proof of conquest would require evidence of a new group taking control afterwards, which may or may not be present." Frame as "violent end" or "destruction," not "conquest proven."

  3.  **Imported Pottery in Provincial Town (Claim: Cosmopolitan Trade Hub)**
      *   **Audit:**
          *   Claim: High-level (Social/Economic Institution) - **Caution.**
          *   Evidence: Weak/Misleading? (Imported pottery present). How much? What types? Where found? (Elite residence vs. trash pit vs. single sherd?).
          *   Context: **Critical.** Secure dating? Found *within* structures/features dated to the period? Association with local elites? Or just present? (If scattered finds, low context - **Yellow/Red**).
          *   Ladder: Long & Weak. Evidence: Imported pottery present. Step 1: Pottery = Trade item. Step 2: Presence = Trade occurred. Step 3: Scale/Type = Direct trade? (vs. down-the-line). Step 4: Direct Trade + Volume = Hub status? **Steps 3 & 4 are huge leaps.** Alternatives? (Elite gift/emulation? Traveller's belongings? Down-the-line trade over many hands? Imitation local ware?).
          *   Support: Evidence of traders (foreign houses/graces?)? Weights/measures? Storage facilities? *Quantity* and *diversity* of imports compared to local? Wider evidence of trade infrastructure?
      *   **Verdict:** **Red Light (Spike the "Hub" Claim, Reframe Entirely).** Report the *presence* of the imported pottery as evidence of "external connections" or "participation in wider exchange networks." **State explicitly:** "While the discovery shows the town had access to goods from afar, calling it a 'cosmopolitan trade hub' requires evidence of its *role* in trade – such as large quantities of diverse imports, facilities for merchants, or evidence of goods passing *through* – which is not demonstrated by the presence of imported pottery alone. This could represent elite consumption of exotic goods rather than a hub." **Rebuild your feature** around "evidence of long-distance connections emerges in provincial town."

  ---

  **What This Procedure CAN'T Do (Limitations):**

  1.  **Detect Methodological Flaws:** It can't catch bad excavation technique, poor sampling strategies, misidentification of artifacts/fossils, or flawed lab analyses hidden in the unreported methods.
  2.  **Assess Statistical Sophistication:** If claims rely on complex stats, this won't verify their appropriateness or power.
  3.  **Reveal Unpublished Data:** Reliance on unpublished comparisons, ongoing analyses, or "in prep" work is invisible to you.
  4.  **Gauge Scholarly Consensus:** The release won't tell you if this interpretation is fringe or widely accepted. The lead author call is biased.
  5.  **Uncover Motivational Bias:** Publication pressure, funding needs, desire for fame, or institutional agendas pushing sensationalism remain hidden.
  6.  **Evaluate Complex Multivariable Arguments:** Claims based on subtle interplay of many types of evidence require deep expertise to critique properly.
  7.  **Completely Eliminate Judgment:** Steps 3, 4, 5, and 6 inherently require your assessment of sufficiency and plausibility.

  **Releases That Will Defeat It:**

  1.  **The "Black Box" Release:** Claims based entirely on complex, unreported scientific analyses (e.g., "genetic analysis proves migration," "statistical model identifies social network").
  2.  **The "Consensus by Assertion" Release:** Claims the findings are revolutionary and overturn established views, but provides no concrete evidence accessible to you for *why* the old view is wrong.
  3.  **The "Invisible Data" Release:** Relies heavily on comparisons to unpublished data from other sites or the author's prior work that you can't access.
  4.  **The "Meaning of Life" Release:** Makes sweeping claims about universal human nature, the origins of religion/warfare/inequality based on a single site/find. Equifinality is overwhelming.
  5.  **The "Techno-Hype" Release:** Focuses on the novelty of the method (e.g., "groundbreaking new dating technique!") with the actual archaeological claim being weak or secondary.

  **Your best weapons remain:** **extreme skepticism towards high-level claims** (especially belief!), **obsession with context**, relentless focus on **"How do they *know* that?"** during calls, and the confidence to **spike** claims where the inferential chain is broken, no matter how enticing the story. Frame the *evidence* rigorously, and let readers see the *process* of interpretation, warts and all. That's responsible science journalism.
