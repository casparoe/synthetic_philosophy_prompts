answer: |-
  ### Typogenetics Pantoum

  A strand of letters, four and stark  
  *Cut the third base, then turn and bind*  
  No meaning in the silent dark  
  A, C, G, T, the only kind  

  *Cut the third base, then turn and bind*  
  I read the marks and make the break  
  A, C, G, T, the only kind  
  Reverse this segment, base for base  

  I read the marks and make the break  
  The split strand frays; I hold the part  
  Reverse this segment, base for base  
  Rebuild the pattern strand by strand  

  The split strand frays; I hold the part  
  A strand of letters, four and stark  
  Rebuild the pattern strand by strand  
  No meaning in the silent dark  

  ---

  ### Design Notes:
  - **Voices & Blurring**:  
    - *Italic lines* = enzyme voice (instructions)  
    - Regular lines = strand voice (raw symbols)  
    - Line 3 ("No meaning...") shifts:  
      - First appearance: Strand’s lament (innocence)  
      - Final appearance: Enzyme’s confession (after copying itself)  
  - **Self-Referential Twist**:  
    - Enzyme’s actions (*Cut...bind...reverse*) mirror Gödel’s self-referential encoding.  
    - Strand’s rebirth in stanza 4 ("Rebuild...") echoes the enzyme’s origin from its own code.  
  - **Key Line**:  
    "Cut the third base, then turn and bind" serves as:  
    - Stanza 1: Literal description of symbols (strand’s view)  
    - Stanza 2: Operational command (enzyme’s view)  
  - **Closed Loop**:  
    - Opening lines return at the end → enzyme completes copying its source strand.  
    - Final couplet juxtaposes replication ("Rebuild...") with existential ambiguity ("No meaning...").  

  ### Accessibility:  
  - **Non-Technical Reader**: Hears a cyclical poem about creation/meaning.  
  - **Typogenetics Savvy**: Sees Gödelian self-replication (strand codes for its own copier).  

  No forced rhymes; rhythm bends to the repeats. The volta hides in plain sight.
