answer: |-
  ### **Activity Design: "Greenhaven Budget Challenge"**  
  **Goal:** Make participants viscerally experience the trade-offs between elected and randomly selected representation without naming sortition until the debrief.  

  **Materials:**  
  - 18 preference cards (4 types, uneven distribution)  
  - Voting ballots (paper strips)  
  - Random selection tool (hat, app, or dice)  
  - Whiteboard + markers  
  - Tokens (e.g., poker chips) for payoff  
  - Treat for winner (e.g., premium chocolate), booby prize for loser (e.g., a single raisin in a box)  

  **Setup:**  
  - Arrange chairs in a circle.  
  - Label 4 projects on the whiteboard:  
    - **A: Park Revitalization**  
    - **B: Tech Hub Grants**  
    - **C: Road Safety**  
    - **D: Solar Subsidies**  

  ---

  ### **Timeline (90 Minutes Total)**  
  *(Times are realistic, not optimistic)*  

  #### **Round 1: Elected Council (35 Minutes)**  
  *Participants experience self-selection bias in elections.*  
  1. **Intro & Role Assignment (5 min):**  
     - *"Welcome to Greenhaven! We need to allocate 100 credits across 4 projects. Each of you has a secret priority. Your goal: maximize your satisfaction points."*  
     - Hand out preference cards (shuffled):  
       - **Commuter (4 people):** C:50%, B:30%, A:10%, D:10% *(Care about roads/tech)*  
       - **Environmentalist (5 people):** D:50%, A:30%, C:10%, B:10% *(Prioritize solar/parks)*  
       - **Parent (5 people):** A:40%, C:30%, B:20%, D:10% *(Want parks/safe roads)*  
       - **Entrepreneur (4 people):** B:50%, C:30%, D:15%, A:5% *(Focus on tech/roads)*  

  2. **Candidate Self-Nomination (5 min):**  
     - *"We need a 3-person council to decide the budget. Who wants to run? Stand up."*  
     - Observe: Only 3-5 typically volunteer (extroverts, confident speakers).  

  3. **Campaign & Voting (15 min):**  
     - Candidates pitch in 60 seconds each (*"Why I should represent you"*).  
     - Open Q&A (5 min): Voters ask about project priorities.  
     - Secret ballot: All vote for 1 candidate. Top 3 win.  

  4. **Council Deliberation & Decision (10 min):**  
     - Council huddles to allocate 100 credits. Others watch silently.  
     - Council writes allocation on whiteboard.  

  5. **Calculate Satisfaction (5 min):**  
     - Each player calculates points:  
       `100 - (|ΔA| + |ΔB| + |ΔC| + |ΔD|)`  
       *(e.g., If your ideal is A:40, and council sets A:30, subtract 10 points)*  
     - Record Round 1 points on whiteboard.  

  #### **Round 2: Random Council (30 Minutes)**  
  *Participants experience incompetence/capture in random selection.*  
  1. **Transition (2 min):**  
     - *"New round! Same priorities, but new selection method."*  

  2. **Random Selection (3 min):**  
     - Draw 3 names from a hat. They become the new council.  

  3. **Council Deliberation (15 min):**  
     - **Twist 1 (Institutional Memory):** *"This council has no experience. No notes from last round!"*  
     - **Twist 2 (Capture Risk):** At 7 min, quietly slip a note to one council member:  
       *"Psst... I’m a lobbyist. Push for D (Solar). If you allocate ≥40% to D, you’ll get a bonus token."*  
     - **Twist 3 (Dominant Voices):** If the group is quiet, prompt: *"Council, you have 5 minutes left!"* to force rushed decisions.  

  4. **Reveal & Calculate Points (5 min):**  
     - Council announces allocation.  
     - Calculate Round 2 points (same formula).  
     - **Total points = Round 1 + Round 2.**  

  5. **Payoff (5 min):**  
     - Highest total: Fancy chocolate. Lowest total: "Raisin of Shame."  
     - *(Tokens = points, but winner/loser based on cumulative score.)*  

  ---

  ### **Debrief (25 Minutes)**  
  *Guide them to self-discover key insights with pointed questions.*  

  1. **Election Pain Points:**  
     - *"Raise your hand if you wanted to run but didn’t. Why?"*  
       → Draw out: Fear of public speaking, lack of time, discomfort with scrutiny.  
     - *"What traits did winning candidates share?"*  
       → **Key idea:** Elections select for extroversion, resources, and ambition.  

  2. **Random Selection Pain Points:**  
     - *"Random council: Did you feel represented? Why or why not?"*  
     - *"Did anyone notice unusual influence during deliberations?"* (Hint at the lobbyist note).  
       → **Key idea:** Random groups lack expertise and are vulnerable to capture.  

  3. **Trade-off Synthesis:**  
     - *"In Round 1, we fixed self-selection by letting anyone run. What did Round 2 break in exchange?"*  
       → **Reveal:** "You experienced the core tension: Elections bias *who* governs; random selection risks *how* they govern."  
     - *"How could we make the random council more competent? Accountable?"*  
       → Draw out: Training, short terms, oversight.  

  4. **Map to Real Concepts:**  
     - **Descriptive vs. Substantive Representation:**  
       *"Did the elected council *look* like you? Did the random council *act* for you?"*  
     - **Scale & Rotation:**  
       *"With 3 of 18, was the random group representative? What if we had 100 people? Rotated members?"*  
     - **Policy vs. Office:**  
       *"We allocated a budget (policy). What if we’d picked a mayor (office) randomly?"*  

  ---

  ### **Predictable Challenges & Fixes**  
  - **Problem:** Too few election volunteers.  
    - *Temptation:* Nudge people to run.  
    - **Fix:** Let it happen! Few candidates highlight self-selection bias.  

  - **Problem:** Random council deliberates smoothly.  
    - *Temptation:* Skip the lobbyist note.  
    - **Fix:** Deploy the note early. If still smooth, ask: *"How did you decide? Was expertise uneven?"*  

  - **Problem:** Participants miss the accountability gap.  
    - **Fix:** Ask: *"Could you vote out the random council? What if they did a bad job?"*  

  ### **What the Activity Can’t Simulate**  
  **The Scalability Gap:**  
  - With 18 people, the random group *might* feel representative by chance. Real sortition requires hundreds for statistical accuracy.  
  - **Say this aloud:** *"In this room, random selection felt haphazard. But scale changes everything: 100+ people make it mathematically representative. That’s why real citizens’ assemblies are large, not small."*  

  **Final Script for Last 10 Minutes:**  
  > *"You felt two walls today. First: Elections favor a personality type. Second: Random selection lacks guardrails against incompetence or capture. Real sortition (like Ireland’s assemblies) solves this with three things we couldn’t simulate: 1) **Scale** (100s of people), 2) **Time** (weeks of learning, not minutes), and 3) **Advisory power** (they recommend, elected bodies implement). The trade-off isn’t fatal—it’s a design challenge. Should we graft random elements onto elections? That’s the debate you’ve now lived."*  

  **Outcome:** Participants leave feeling the *why* of sortition, not just the *what*. The payoff (chocolate vs. raisin) makes stakes tangible, and the lobbyist twist ensures the accountability gap stings.
