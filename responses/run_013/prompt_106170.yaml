prompt: |-
  I'm a journalist — science and ideas, mostly — and I've been circling a piece on sortition for the better part of a year. I've read the citizens' assembly stuff, Ireland, France, all the deliberative-polling experiments, and the weirdly cheerful literature arguing we should replace elections with random selection (some people call it lottocracy). Here's my problem: none of it lands on the page. Readers nod and think "oh, jury duty for policy, cute." The actual argument is sharper than that and I can't get it across in prose. So I've agreed to run a 90-minute session at a small ideas festival — 18 people, mixed ages, no particular expertise, a plain room — and I want the thing to be something we *do*, not a panel I moderate. Then I'll write up what happened.

  What I want those people to feel in their gut, in this order, before I say one word about it:

  First, that elections don't just aggregate preferences, they *select for a kind of person* — the kind who wants the job, who likes being watched, who can afford to spend two years campaigning. That's a bias baked into the inputs, and no campaign-finance tweak removes it. Second, that swapping the election for a lottery fixes exactly that problem and instantly hands you a different one: a body pulled at random has no institutional memory, no reason to be competent, and — the part I keep failing to explain — nobody to be accountable to, because you can't vote them out. If the whole lottocracy pitch is going to work, it has to solve *that*. I want them to walk into both walls themselves, in that order, and I want them to notice that the two fixes pull against each other.

  So: design me the activity. Give me the rules, the materials (assume paper, a hat or a randomiser, a whiteboard, nothing fancier), and a payoff scheme that makes winning and losing mean something without real money changing hands — tokens, points, a pot they split, a treat someone does or doesn't get, whatever works, as long as there's a genuine winner and a genuine loser in the room. I want roles or rules that do the work, not a lecture. Please arrange it so the group runs into the first failure (the self-selection of candidates) under one selection rule, and the second (no memory, no accountability, capture by whoever talks most) under the other, and so that the second one stings precisely because the first one was just fixed. Don't name sortition, lottocracy, or citizens' assemblies until the debrief — if the word "lottery" has to appear early, fine, but nothing that tips my hand.

  Include a minute-by-minute timeline for the 90 minutes, and tell me honestly how long each beat really takes rather than the optimistic version. Then the debrief: map specific moments in the activity onto the specific ideas — descriptive vs substantive representation, why the sample-size argument needs hundreds of people and not eighteen, rotation as a substitute for re-election and what rotation costs you, the difference between using the lot to fill an office and using it to decide a policy — and give me the exact questions to ask so the group finds these rather than hears them. Tell me what will predictably go wrong the first time I run it, what I'll be tempted to do, and what to do instead. And be straight with me about which part of the real argument this activity *can't* reproduce no matter how I run it, i.e. the thing I'll have to say out loud myself in the last ten minutes.
reasoning: |-
  We are designing a 90-minute experiential activity for 18 participants to feel two key problems in political representation:
    1. The problem of self-selection in elections: Elected representatives are a self-selected group with particular traits (desire for power, comfort with public scrutiny, resources to campaign) that may not represent the population.
    2. The problem of random selection: A randomly selected body lacks institutional memory, competence, and accountability.

   We want participants to experience both systems (election and random selection) in a simulated governance scenario, and then debrief to draw out the insights.

   The activity should be structured in two rounds, each round being a decision-making exercise on a simple issue. The first round uses an election method (with self-selection of candidates) and the second round uses random selection. We will set up the rounds so that the first round highlights the self-selection bias, and the second round highlights the lack of accountability and competence.

   We'll use a simple policy issue that is relatable and can be decided quickly. Example: allocating a fixed budget among several public projects.

   Materials:
     - Paper and pens
     - A hat or random number generator (for random selection)
     - Whiteboard for recording decisions and points
     - Tokens or points for incentives (non-monetary)

   Payoff scheme: 
     We'll use a point system. Participants earn points based on how well the decisions of the representative body align with their personal preferences. At the end, the person with the most points wins a small treat (e.g., a chocolate bar or a book). The person with the least points gets a light-hearted "booby prize" (e.g., a funny certificate). This creates a sense of winning and losing.

   Scenario: 
     We'll use a fictional city called "Greenhaven" that has a budget of 100 units to spend on 4 projects:
       A) Public Park (improvements and maintenance)
       B) Community Center (programs and renovations)
       C) Road Repairs (fixing potholes)
       D) Environmental Initiatives (tree planting, recycling)

   Each participant will have a personal preference profile (secretly assigned) that weights these projects differently. For example:
     - A young parent might care more about the park and community center.
     - A commuter might care more about road repairs.
     - An environmentalist might care most about environmental initiatives.

   How the payoff works: 
     The representative body (either elected or randomly selected) will decide the allocation of the 100 units. After the decision, each participant calculates their satisfaction: 
        Satisfaction = (Allocation to A) * (weight for A) + ... + (Allocation to D) * (weight for D)
     Then we normalize the satisfaction to points. We can set the maximum possible satisfaction (if the allocation perfectly matched a participant's weights) to 100 points. The actual points for a participant = (actual satisfaction / max possible satisfaction) * 100.

   However, to keep it simple, we can assign weights that are percentages that add to 100. Then the satisfaction is the dot product of the allocation and the weights. The points are then 100 minus the absolute difference between the allocation and their ideal? Or we can use the dot product and then scale.

   Alternatively, we can predefine several types of citizens (each with a weight vector) and assign each participant one type. We'll have 4-5 types to ensure diversity.

   Step-by-Step Activity:

   Part 1: Elections (45 minutes)

     Step 1: Introduction (5 minutes)
       - Explain the scenario: "You are residents of Greenhaven. The city has 100 units to allocate among 4 projects: A, B, C, D. We need to form a council of 3 representatives to decide the allocation."
       - Explain the payoff: "Each of you has a personal set of priorities (which I will assign). After the council decides, you will calculate your points based on how close the allocation is to your priorities. The goal is to maximize your points. At the end of both rounds, we'll see who has the most points overall."

     Step 2: Assign Preferences (5 minutes)
       - Hand out preference cards. Each card has a type (e.g., "Parent", "Commuter", "Environmentalist", "Senior Citizen") and a set of weights (percentages) that add to 100. For example:
            Parent: A:40%, B:40%, C:10%, D:10%
            Commuter: A:10%, B:20%, C:50%, D:20%
            Environmentalist: A:20%, B:10%, C:10%, D:60%
            Senior: A:30%, B:40%, C:20%, D:10%
       - Make sure the distribution of types in the room is uneven to create conflict. (But don't reveal the types to others.)

     Step 3: Self-selection of Candidates (5 minutes)
       - Announce: "We will now form a council of 3 representatives. If you wish to be a candidate, stand up and come to the front. You have 30 seconds to decide." 
       - Note: This is where the self-selection bias kicks in. Typically, only a few (maybe 3-6) will volunteer. They are the ones who are comfortable standing up and speaking.

     Step 4: Campaigning (10 minutes)
       - Candidates have 1 minute each to make a pitch. They can say what they think the allocation should be (but note: they don't know others' preferences). They might make vague promises.
       - Then, the rest of the participants (the voters) can ask questions (2 minutes total).

     Step 5: Voting (5 minutes)
       - Each voter (non-candidate) gets one vote. They vote for one candidate. The top 3 vote-getters form the council.

     Step 6: Council Deliberation and Decision (10 minutes)
       - The council goes to a separate area (or front) to decide the allocation. They have 5 minutes to discuss and 5 minutes to write down the allocation (must add to 100).

     Step 7: Reveal and Calculate Points (5 minutes)
       - The council announces the allocation.
       - Each participant calculates their points: 
            Points = 100 - [ |(A_alloc - A_pref)| + |(B_alloc - B_pref)| + |(C_alloc - C_pref)| + |(D_alloc - D_pref)| ]
          But note: this is an absolute difference penalty. Alternatively, we can use the dot product and then scale to 100? 
          However, absolute difference is easier. The maximum points (if allocation matches exactly) is 100, and it decreases by 1 for every percentage point of absolute difference.

       Example: 
          Participant's ideal: A:40, B:40, C:10, D:10
          Council decides: A:30, B:50, C:10, D:10
          Absolute difference: |30-40| + |50-40| + |10-10| + |10-10| = 10+10+0+0 = 20
          Points = 100 - 20 = 80.

       - Write the points on the whiteboard for Round 1.

   Part 2: Random Selection (30 minutes)

     Step 1: Introduction (2 minutes)
       - "Now we are going to do a second round with a different method of selecting representatives. The city again has 100 units to allocate, but the priorities might have changed? Actually, let's say the priorities are the same as before (same preference cards)."

     Step 2: Random Selection of Council (3 minutes)
       - Draw 3 names randomly from a hat. These are the new council members.

     Step 3: Council Deliberation and Decision (15 minutes)
       - The new council deliberates (again, 10 minutes discussion, 5 minutes to write). 
       - BUT: We introduce a twist to simulate the lack of institutional memory and potential for capture: 
            - We tell the council that they are allowed to consult with one "expert" (played by the facilitator) who has a bias. The expert will be called in if they request. The expert's bias is to push for one particular project (e.g., Environmentalist: "I strongly recommend at least 50% to D"). 
            - Alternatively, we can assign one of the council members to be a "stealth lobbyist" (secretly) who is trying to push for a particular project. But that might be too complex.

       Instead, let's create a situation where the council is vulnerable to the most vocal member. We don't need to script it, but we can observe. Also, we can have the facilitator act as an unelected bureaucrat who has been in charge for a long time and has their own agenda. The facilitator (playing the bureaucrat) can interrupt and say, "Traditionally, we've always given 30% to road repairs, and I think we should continue that. Also, the environmental initiatives are very important, so I suggest 30% there." This will simulate the capture by entrenched interests.

       How to do: 
          - During the council deliberation, after 5 minutes, the facilitator (as bureaucrat) steps in and says: "I have been working in this department for 20 years. I have seen what works. I recommend: A:20%, B:20%, C:30%, D:30%." Then the council can choose to follow or not.

     Step 4: Reveal and Calculate Points (5 minutes)
       - The council announces the allocation.
       - Each participant calculates their points for Round 2 (same formula).

     Step 5: Total Points (5 minutes)
       - Add the points from Round 1 and Round 2 for each participant. 
       - Identify the winner (highest total) and the loser (lowest total). Give the winner a treat and the loser a booby prize.

   Part 3: Debrief (15 minutes)

     We guide the participants to reflect on the experience. We don't use the terms sortition or lottocracy until the end.

     Questions:

       1. "In the first round, who became candidates? Why did you decide to run or not run?" 
          - Expected answer: Some felt confident, had time, wanted to influence, etc. Draw out that the candidates are a self-selected group.

       2. "How did the elected council make their decision? Did they represent your interests? Why or why not?"
          - Highlight: They might have made promises they couldn't keep, or they didn't know the diverse preferences.

       3. "In the second round, how did the randomly selected council work? What was different?"
          - Expected: They might have been influenced by the bureaucrat, or by the most vocal member. They had no experience.

       4. "Which round gave you more points? Why do you think that was?"
          - This might vary, but we expect that the random council might have been more easily swayed and produced an outcome that was less representative.

       5. "What were the strengths and weaknesses of each method?"
          - Draw out: 
              Election: Candidates are motivated and may have some skills (like public speaking), but they are a biased sample and may not represent the diversity of interests.
              Random: More diverse, but inexperienced and vulnerable to manipulation.

       6. "How did it feel to be represented by people who were randomly chosen? Did you feel they were accountable to you?"
          - They were not accountable because they were only there for one round and you couldn't vote them out.

       7. "What if we had a system that combined both? For example, a random body that serves for a longer time and has staff to help? Or a random body that sets the agenda and elected officials implement?"

     Then, introduce the terms: "What we just experienced are two methods: the first is an election, and the second is called sortition (or lottocracy)."

     Finally, map to the real world:
       - The self-selection bias in elections: We get politicians who are comfortable campaigning and have resources. This is a descriptive representation problem.
       - The random selection: Solves the descriptive representation but creates a substantive representation problem because of lack of expertise and accountability.

     Also note: 
       - Rotation: In real sortition, they use rotation (like in ancient Athens) to prevent capture. But rotation costs institutional memory.
       - Scale: Our sample was small (3 out of 18). In reality, we need hundreds to have a representative sample.

     What the activity can't capture:
       - The scale issue: We had only 18 people and 3 representatives. In reality, a citizens' assembly might have 100-150 people to be statistically representative. We can't simulate that in a room of 18.
       - The time factor: Real citizens' assemblies meet for days or weeks and have experts and facilitators to ensure balanced deliberation. We only had 15 minutes.
       - The difference between deciding a policy (like we did) and filling an office: In sortition, sometimes the randomly chosen people serve in office for a fixed term. That's different from a one-off assembly.

     In the last 10 minutes, you will have to explain these limitations and also the real-world examples (Ireland, France) and how they try to overcome the problems.

