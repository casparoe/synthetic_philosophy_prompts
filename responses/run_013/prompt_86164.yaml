  ## The Cedar Creek Clarion  
  **Advice from Auntie Mabel: Plain Talk for Plain Folks**  
  *Editor's Note: Auntie Mabel tackles life's tangles with the clear-eyed wisdom only four decades behind the hardware store counter can provide. Send your quandaries to Box 14.*

  ---

  **Dear Auntie Mabel,**  
  My no-good brother Clem stole $500 from our Mom’s cookie jar savings. She’d been squirreling that away for a new hip! I’m fit to be tied and want to wring his neck. Mom just cries. Should I cut him off forever?  
  **– Hank, Hopping Mad**

  **Dear Hank Hopping,**  
  Well, Hank, hold onto your hat. Clem stole the money because that’s the way Clem is. How did Clem get that way? Wasn’t his choice. He was born with certain inclinations, raised in a particular environment, shaped by experiences he didn’t pick. Could he suddenly decide to be different? Only if he *already* was the kind of person who makes that decision, because of how *he* already was. See the merry-go-round? To truly blame Clem, you’d need to blame him for being Clem in the first place. But he didn’t build himself from scratch, Hank. Nobody did. Not even the Good Lord gets off the hook – if He made everything, He made Clem *exactly* the way Clem turned out, stealing included. So, is Clem *truly* blameworthy? Seems the whole idea just unravels. You’re mad because of how *you* are – protective of Mom, maybe a bit hot-headed. Didn’t pick that either, did you? Lock your doors, Hank. Help your Mom. But pure blame? There’s no solid ground for it.  
  **– Auntie Mabel**

  ---

  **Dear Auntie Mabel,**  
  Last winter, I hit a patch of black ice and my car slid into Mrs. Gable’s mailbox and fence. She’s been kind, but I see the new fence every day. I feel awful, like I should be punished more. How do I make this guilt stop?  
  **– Betty, Burdened**

  **Dear Burdened Betty,**  
  Oh, Betty. That accident happened because of the way the world was that day – the ice, your car, your reflexes – and because of the way *you* were: driving carefully, I assume, but just *there* at that moment. Your reflexes reacted how they were built to react, based on nerves and brain you didn’t install. You didn’t choose the ice, the road, or the exact wiring that made you hit the gas or brake when you did. So, can you truly be *morally responsible* for that slide? The guilt eats at you because of how *you* are – conscientious, maybe prone to worry. Traits given to you, not forged by you. To deserve this guilt, you’d need to deserve being the person who feels it so sharply. But how far back does *that* chain go? It peters out somewhere before it ever truly started with *you* pulling your own strings. Fix the fence, Betty. Be kind. But the guilt? It’s just another thing happening, like the ice.  
  **– Auntie Mabel**

  ---

  **Dear Auntie Mabel,**  
  I donated a kidney last year to a stranger I read about in the paper. Folks call me a hero, but honestly, it just felt like the obvious thing to do. Still, wouldn’t mind a little genuine credit now and then. Is that wrong?  
  **– Modest Mike**

  **Dear Modest Mike,**  
  Mike, that was a powerful kind thing you did. Powerful kind. But let’s peek under the hood. You did it because you’re the sort of person who finds that the “obvious thing.” Where did *that* sort of person come from? Did you pick your genes that inclined you to empathy? Design the life experiences that fostered generosity? Choose the exact moment you saw that article and the brain chemistry that made “yes” feel inevitable? If you *had* chosen to build yourself into a kidney donor, what kind of person would you have needed to *be* already to make *that* choice? It’s bootstraps all the way down, Mike, and they never quite reach the ground. The praise feels good because of how *you* are – maybe liked appreciation even before this. But genuine *credit*, meaning you truly authored that goodness from scratch? That foundation’s mighty shaky. Keep feeling good about helping. But the credit? It’s floating in the breeze.  
  **– Auntie Mabel**

  ---

  **Dear Auntie Mabel,**  
  I run a small print shop. My employee, Dave, is a sweet guy but keeps mixing up orders – costly mistakes. I’ve tried retraining, patience, everything. My business is suffering. How do I fire him without feeling like a monster?  
  **– Stressed Stan**

  **Dear Stressed Stan,**  
  Stan, this is where the rubber meets the road. Dave messes up because of the way *he* is – his attention to detail (or lack thereof), his learning style, maybe anxieties he didn’t invite. He didn’t choose the blueprint for his focus. You’re stressed and needing reliable help because of how *you* are – a business owner wired for efficiency and responsibility you didn’t hand-pick. Can you truly blame Dave? No more than he can truly take credit if he suddenly became perfect. Can you blame *yourself* for protecting your livelihood? Nope. Same boat. So, fire him, Stan. You gotta. The shop needs to run, and Dave’s mix-ups are part of the way things are. It’s not about Dave being *evil* or you being *cruel*. It’s about cause and effect, rolling along without needing anyone to be fundamentally *deserving* of praise or punishment. Do it kindly, give him a reference if deserved, and lock the door behind him. Practicality doesn’t need deep responsibility to turn the key. (Heck, even as I write this, I realize I’m annoyed at my neighbor’s yappy dog… and catch myself thinking *he* shouldn’t have gotten such a noisy breed! Tsk. There I go, forgetting my own mail. The way *I* am, I suppose.)  
  **– Auntie Mabel**
