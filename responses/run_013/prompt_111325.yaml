                                  # Then ask if they can extend arbitrarily?
                                  if applicant_claims_infinite_regress(node):
                                      status[node] = {'status': 'promissory', 'condition': 'extendable arbitrarily on demand'}
                                  else:
                                      status[node] = {'status': 'unsupported'}
                          else:
                              if applicant_claims_infinite_regress(node):
                                  status[node] = {'status': 'promissory', 'condition': 'extendable arbitrarily on demand'}
                              else:
                                  status[node] = {'status': 'unsupported'}
                      else:
                          # Check children statuses
                          if any(status[child]['status'] == 'unsupported' for child in children):
                              status[node] = {'status': 'unsupported'}
                          elif any(status[child]['status'] == 'promissory' for child in children):
                              conditions = [status[child]['condition'] for child in children if status[child]['status']=='promissory']
                              status[node] = {'status': 'promissory', 'conditions': conditions}
                          else:
