answer: |-
  Below is a decision procedure that transforms the philosophical debate on justification regress into a practical, engineer-operable assessment tool. It addresses foundationalism (terminal nodes), infinitism (promissory notes), and coherentism (cycles), while leaving risk acceptance decisions to the board. The procedure is designed for efficiency (handles hundreds of nodes in two days) and produces an auditable record.

  ---

  ### **Safety Case Assessment Procedure**
  **Objective**: Determine if a claim is `ACCEPTED`, `REJECTED`, or `BOARD REVIEW` by evaluating its support tree.  
  **Input**: Root claim node in a tree structure (nodes = claims, edges = support relationships).  
  **Output**: Status for each node, final verdict, and written record.  
  **Key Principles**:
  - **Terminal Node**: Inherently justified (definition/stipulation/traceable measurement).  
  - **Promissory Node**: Justification deferred (requires future discharge or on-demand extension).  
  - **Cycle**: Circular support (acceptable only if externally anchored).  
  - **Board Handoff**: When unresolved promissory notes or risk acceptance dominate truth.  

  ---

  #### **Step-by-Step Node Evaluation**
  For each node, ask these questions in **post-order traversal** (children before parents) to avoid redundant work:

  1. **Is the node inherently terminal?**  
     - **Ask**: "Is this a definition, stipulation, or measurement traceable to a national/ISO standard?"  
     - **Sufficient answer**: Documentary proof (e.g., calibration certificate, standard reference).  
     - **Result**:  
       - ✅ `TERMINAL` if yes.  
       - ❌ Proceed to Q2 if no.  

  2. **Does the node have supported children?**  
     - **Ask**: "What sub-claims, tests, or evidence support this?"  
     - **Evaluate children first** (recursively). Then:  
       - If **any child is `UNSUPPORTED`** → Parent = `UNSUPPORTED`.  
       - If **all children are `TERMINAL`/`SUPPORTED`** → Parent = `SUPPORTED`.  
       - If **any child is `PROMISSORY`** → Parent = `PROMISSORY` (collect conditions).  
       - If **a child creates a cycle** → Handle via Q3.  

  3. **Does the node belong to a cycle?**  
     - **Detect cycles** during traversal (e.g., if node reappears in ancestor path).  
     - **Ask**: "Is there external evidence outside this cycle?"  
     - **Result**:  
       - ✅ `SUPPORTED` if ≥1 node in the cycle has a `TERMINAL`/`SUPPORTED` child **outside the cycle**.  
       - ❌ `UNSUPPORTED` if no external support.  
       - 🔄 `PROMISSORY` if external support is `PROMISSORY`.  

  4. **Is the node an unsupported leaf?**  
     - **Ask**: "Can you extend support on-demand, or is this inherently terminal?"  
     - **Result**:  
       - `PROMISSORY` under **one condition** (choose based on node context):  
         - **Condition A (Fixed deadline)**: "Support must be discharged by [date]."  
           *Use for time-bound evidence (e.g., sensor recalibration).*  
         - **Condition B (On-demand extension)**: "Support must be extendable arbitrarily on request."  
           *Use for open-ended claims (e.g., environmental assumptions).*  
       - ❌ `UNSUPPORTED` if applicant cannot satisfy A or B.  

  ---

  #### **Procedure Workflow**
  1. **Traverse tree** (depth-first, post-order).  
  2. **Classify every node** using Steps 1–4.  
  3. **Final verdict**:  
     - ✅ `ACCEPT` if root is `TERMINAL` or `SUPPORTED`.  
     - ❌ `REJECT` if root is `UNSUPPORTED`.  
     - 👥 `BOARD REVIEW` if root is `PROMISSORY` or has critical `PROMISSORY` children.  
  4. **Generate report**:  
     - Status/conditions for all nodes.  
     - Cycle diagrams (if any).  
     - Promissory notes and deadlines.  

  ---

  ### **Example Evaluations**
  #### **Case 1: Claim resting on calibrated sensor specification**  
  - **Node A**: System safety claim.  
  - **Node B**: Sensor specification (calibrated to NIST).  
  - **Evaluation**:  
    - **Node B**: Proof of NIST traceability → `TERMINAL` (Step 1).  
    - **Node A**: Supported by `TERMINAL` child → `SUPPORTED`.  
  - **Verdict**: ✅ `ACCEPT`.  

  #### **Case 2: Claim resting on simulation and validation report (circular support)**  
  - **Node A**: System performance claim.  
  - **Node B**: Simulation report (cites Node C).  
  - **Node C**: Validation report (cites Node B).  
  - **Evaluation**:  
    - Cycle detected (B ↔ C).  
    - **Ask**: "External evidence for B or C?"  
      - If **Node B** also cites a `TERMINAL` standard (e.g., IEEE model) → Cycle externally anchored → `SUPPORTED`.  
      - If **no external evidence** → `UNSUPPORTED`.  
  - **Verdict**: ❌ `REJECT` if unsupported; ✅ `ACCEPT` if anchored.  

  #### **Case 3: "No unmodelled pedestrians" claim**  
  - **Node A**: Operating environment assumption.  
  - **Evaluation**:  
    - Not terminal (Step 1).  
    - No children → Apply Step 4.  
    - Applicant claims infinite regress ("We can provide more data") → `PROMISSORY` (Condition B: extendable on demand).  
  - **Verdict**: 👥 `BOARD REVIEW` (risk acceptance required).  

  ---

  ### **Where Applicants Will Hate the Outcome**
  - **Rejecting cycles without external anchors** (e.g., Case 2 with no external evidence).  
    - *Why*: Circular logic fails without foundational support.  
  - **Rejecting promissory notes with fixed deadlines** if unmet (e.g., "Submit validation by 2025-01-01" → Missed date → `UNSUPPORTED`).  

  ---

  ### **Limitations and Board Judgment**
  - **Can it distinguish justification from internal consistency?**  
    - ✅ **Yes**, through:  
      - Terminal nodes (foundationalism).  
      - Cycle anchoring (rejects purely circular reasoning).  
      - Promissory discharge requirements (infinitism).  
    - **But**: Coherentism dominates in `BOARD REVIEW` scenarios.  
      - When signing off, the board decides:  
        > *"Does the **coherence of the entire case**, combined with **risk tolerance**, justify acceptance despite unresolved promissory notes?"*  
      - **Example**: A `PROMISSORY` environmental claim (Case 3) may be accepted if the system operates in controlled settings (low risk), even if "final truth" is unattainable.  

  - **Where it fails**:  
    - **Subjectivity in terminality**: Engineers may disagree on what qualifies as "traceable to standard."  
    - **Risk vs. truth**: Board may override `REJECT` for high-value/low-risk systems.  
    - **Infinite regress**: On-demand extension (Condition B) defers but does not resolve justification.  

  ---

  ### **Procedure Summary**
  - **Engineer-friendly**: No philosophy required; uses binary checks/conditions.  
  - **Efficient**: Processes hundreds of nodes in hours (post-order traversal + cycle detection).  
  - **Auditable**: Documents node status, cycles, and promissory conditions.  
  - **Board-aligned**: Flags unresolvable disputes for risk-based decisions.  

  By converting epistemological debates into structured questions, this procedure forces clarity while reserving judgment calls for governance.
