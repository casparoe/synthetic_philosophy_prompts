                      - Else if any child is promissory -> status: promissory (collect conditions).
                      - Else (all children are terminal or supported) -> status: supported.

            b) If the node is a super node (representing an SCC):
                 i. If it has no children in the DAG -> status: unsupported.
                 ii. Else:
                     - Check the status of its children: 
                         * If there exists at least one child that is not unsupported -> then the super node gets the status: 
                             - If at least one child is terminal or supported -> status: supported.
                             - Else (all non-unsupported children are promissory) -> status: promissory (with their conditions).
                     - Else (all children are unsupported) -> status: unsupported.

        4. The root node's status determines:
            - If unsupported: reject.
            - If terminal or supported: accept.
            - If promissory: hand to the board.

      However, note: even if the root is supported, there might be promissory notes in the tree? But in our recursive marking, if any node is promissory then the root becomes promissory? Not exactly: the root is supported only if all its children are terminal or supported. So if there is a promissory note anywhere in the tree, it will propagate to the root only if it is on the path? 

      Actually, we are marking the root as promissory if any of its direct or indirect children are promissory? Because we propagate the promissory status upwards.

      So if the root is supported, then there are no promissory notes anywhere? 

      But wait: what if a promissory note is in a branch that is not required? For example, the root has two children: one supported and one promissory. Then the root would be promissory? 

      However, in logic, if one support is promissory and the others are supported, the entire claim is still promissory? We are being conservative: any promissory in the support tree makes the root promissory.

    Therefore, the procedure:

      - Rejects if the root is unsupported.
      - Accepts if the root is terminal or supported (meaning there are no promissory notes and no unsupported nodes and cycles are broken).
      - Hands to the board if the root is promissory.

    This seems to meet the requirements.

    Finally, we note: the procedure might be too strict in requiring that every unsupported node must be made either terminal or promissory? But we are giving the applicant the chance to provide an infinite regress (promissory) for any leaf node that is not terminal.

    And the board can overrule the procedure? The procedure can be overturned by the board? Yes, but the procedure's written record will show where the issues are.

    Now, let's write the procedure in pseudocode:

      function assess_case(root):
          # Step 1: Preprocessing - collapse cycles
