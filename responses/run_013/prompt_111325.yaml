    Note: The function `is_inherently_terminal(node)` is implemented by the assessor by checking the node's type and evidence. The functions `applicant_claims_terminal` and `applicant_claims_infinite_regress` involve querying the applicant.

    This procedure leaves a written record: the `status` dictionary.

    We run it on the three examples (as described) and get the results we discussed.

    Where it fails:

      - It cannot force the applicant to provide a truly foundational grounding. It allows promissory notes which defer the decision to the board.

      - The board, when it signs, is not deciding the truth of the claims but the acceptability of the risk given the available evidence and the promise of future evidence if needed.

      - The procedure is foundationalist in spirit (requiring terminal nodes or external support for cycles) but allows infinitism via promissory notes that are handed to the board.

      - It might be that a case is entirely circular but the board finds it coherent and signs it? No, because our procedure collapses cycles and requires external support. So if there is a cycle without external support, it is rejected by the procedure. The board only sees the cases that are promissory or accepted.

