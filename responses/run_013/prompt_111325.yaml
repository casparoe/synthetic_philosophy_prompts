          # We traverse in reverse topological order (from leaves to root)
          for node in reversed(topo_order):
              if node is a super node:
                  # Check its children in the DAG
                  children = dag.get_children(node)
                  if not children:
                      status[node] = {'status': 'unsupported'}
                  else:
                      # Check if there is at least one child that is not unsupported
                      non_unsupported_children = [child for child in children if status[child]['status'] != 'unsupported']
                      if non_unsupported_children:
                          # Among these non_unsupported, check if there is at least one that is terminal or supported? 
                          if any(status[child]['status'] in ['terminal', 'supported'] for child in non_unsupported_children):
                              status[node] = {'status': 'supported'}
                          else:
                              # They are all promissory? 
                              # But note: if there is a mix of supported and promissory, we would have taken supported. So here, they must be all promissory.
                              conditions = [status[child]['condition'] for child in non_unsupported_children if status[child]['status']=='promissory']
                              status[node] = {'status': 'promissory', 'conditions': conditions}
                      else:
                          status[node] = {'status': 'unsupported'}

              else: # regular node
