prompt: |-
  I have been reading arguments about whether violence has declined over the long run, and I keep noticing a structural feature of the debate that I have no word for. I am not asking you to adjudicate the trend itself; I want to know whether this feature of it has an established name, and if it does not, what it should be called and how it should be bounded.

  Here is the feature. Suppose someone assembles a long series of estimates — killings, assaults, and the like — and reports that the rate has fallen by an order of magnitude. A critic objects that the series captures only a thin band of what violence is: it leaves out what states do to people who are not counted, what happens inside households, what deprivation and neglect amount to. The objection is not that the numbers are wrong but that the category is too narrow. What interests me is that the critic is usually right, and that the category has in fact widened over the very period whose trend is being measured. Things that were once not violence at all — corporal punishment in schools, coercion within marriage, cruelty to animals — are now violence, or near enough. So the instrument has been recalibrated, repeatedly, and always in the direction of the finding. And the recalibration is not opportunism: each widening is a genuine moral discovery, defensible on its own. What unsettles me is the asymmetry. I cannot think of any corresponding pressure over the same period to make the category contract, so the process that is supposed to be the subject matter of the measurement is also the process that sharpens it. It is as though the thermometer were designed by the fever.

  I have seen something that feels like the same shape elsewhere — a poverty threshold redrawn as a society grows richer, so that the count can hold steady while the condition improves — and I do not know whether these are one phenomenon or two.

  I do not think this is simply the charge of moving the goalposts, since no one here is arguing in bad faith and the goalposts are not being shifted to save a thesis; nor is it just the familiar warning that a measure degrades once it becomes a target, since nothing is being gamed. The ordinary point that observation is theory-laden also seems too weak, because the difficulty is not that the category depends on a theory but that it depends on, and drifts with, the very process it is meant to record.

  So: does this configuration have a name? If there is an established concept for it, I would like to know which, and — more useful to me — exactly where the fit fails. If there is none, please coin one, define it, and say what it excludes. I would especially like to know what has to be true for the phenomenon to arise, and whether a moralized category is required or only a category whose edges respond to the same social process the trend describes; whether the problem is a defect in the claim, a defect in our ability to test it, or neither; and whether any measure of such a quantity can escape it, and what is lost by fixing the definition once and for all.
reasoning: |-
  Okay, let me try to unpack this user's query. They're describing a specific phenomenon in debates about violence trends. The core issue is that as society evolves, the definition of violence expands to include things previously not considered violent, like corporal punishment or domestic coercion. This expansion happens during the same period being measured, and it always broadens the category, never contracts it. The user is unsettled by this asymmetry and wonders if there's a name for it.

  First, I need to recall if any existing concepts fit this. The user already ruled out "moving the goalposts" and "Goodhart's law" because there's no bad faith or gaming involved. Theory-laden observation seems too vague. What about "concept creep"? Nick Haslam's work comes to mind. He talks about psychological concepts expanding over time, especially in harm-related areas. That seems relevant here because violence as a concept has indeed broadened.

  But concept creep might not fully capture the recursive problem where the measurement tool changes alongside the trend. The user mentions that the recalibration is driven by the same social progress being measured. So, maybe a new term is needed. "Recursive calibration" comes to mind. It emphasizes that the definition adjusts in response to the trend it's supposed to measure, creating a loop.

  The user also compares this to poverty thresholds adjusting with rising wealth. Both cases involve definitions changing with the phenomena they track. This similarity suggests a broader pattern. The key elements here are: a moralized category, social progress driving conceptual expansion, and no countervailing narrowing. 

  Why no contraction? Once something is recognized as harmful, it's hard to "unsee" it. Society doesn't revert on such issues. So the asymmetry makes sense. The user is asking if any measure can avoid this. Fixing the definition might miss new understandings, but continual adjustment biases the trend. It's a trade-off between historical consistency and conceptual accuracy.

  The user's deeper concern might be about the reliability of long-term social measurements when definitions aren't static. They want to understand if this undermines claims about progress or if there's a way to address it. They might be looking for frameworks to critically assess such studies without dismissing them outright.
answer: |-
  This is an exceptionally perceptive observation about a profound methodological and philosophical challenge in measuring social phenomena, particularly those involving moral concepts. You've identified a genuine and under-discussed pattern. Here's a breakdown:

  1.  **The Established Concept (Partial Fit): Concept Creep**
      *   **What it is:** Coined by psychologist Nick Haslam, "concept creep" describes the phenomenon where concepts related to harm (like abuse, bullying, trauma, prejudice – and critically, **violence**) expand their meanings over time, encompassing a wider range of experiences. This expansion is often driven by heightened moral sensitivity, advocacy, and social justice efforts.
      *   **Fit:** This directly captures the widening of the category "violence" you describe (corporal punishment, marital coercion, emotional abuse, neglect, structural violence, microaggressions, cruelty to animals). Each expansion represents a "genuine moral discovery."
      *   **Where the Fit Fails:** Concept creep describes the expansion *itself*. It doesn't inherently address the **asymmetry** (lack of contraction), the **recursive relationship** (the measurement tool evolving *alongside* the trend it measures), or the specific problem this creates for **assessing long-term trends**. It's descriptive of the conceptual shift, not its methodological implications for trend analysis.

  2.  **The Coined Concept: Recursive Calibration (or Reflexive Conceptual Drift)**
      *   **Definition:** *Recursive Calibration* is the process whereby the operational definition and measurement of a socially constructed concept (especially a moralized one) systematically expands in scope *in response to*, and *as a consequence of*, the very societal progress or change that the concept is intended to measure over time. This expansion creates an inherent asymmetry (no corresponding systematic contraction) and introduces a methodological challenge for assessing the magnitude or even the direction of long-term trends, as the measuring instrument is continuously recalibrated by the process it seeks to quantify.
      *   **Core Elements:**
          *   **Socially Constructed & Moralized Concept:** The phenomenon applies most strongly to concepts whose boundaries are defined by social norms, ethics, and evolving understanding (e.g., violence, poverty, discrimination, rights, well-being) rather than purely physical phenomena (e.g., temperature, gravity).
          *   **Progressive Recalibration:** The definition systematically *expands* to include previously excluded phenomena deemed harmful or problematic based on new moral/social understanding.
          *   **Driven by the Measured Process:** The driver for expansion is the same societal evolution (increased moral awareness, sensitivity, social progress) that the trend analysis aims to capture.
          *   **Asymmetry:** Contraction of the definition is rare and unstable. Once harm is recognized, it's difficult to "unsee" it. Societies rarely morally regress *and* successfully narrow definitions *systematically* over long periods in the same way they expand them.
          *   **Recursive Loop:** The calibration (measurement tool) is altered by the process (societal change) it is meant to measure, creating a feedback loop where the measurement itself is a product of the trend.
          *   **Methodological Challenge:** This makes comparing rates across widely separated time points inherently problematic, as the underlying metric isn't constant. The observed trend (e.g., "decline in violence") might be significantly amplified or even artifactually created by the expansion of the definition capturing *more* potential instances of harm in the present. **The thermometer *is* designed by the fever.**

  3.  **What It Excludes:**
      *   Simple measurement error or random fluctuations in data collection.
      *   Deliberate manipulation of definitions for political gain or to "game" a system (Goodhart's Law).
      *   Shifts in definitions driven by factors *external* to the core societal process being measured (e.g., violence definitions changing solely due to new forensic technology, not moral sensitivity).
      *   Stable concepts with fixed, objective operational definitions over long periods (e.g., infant mortality rate, though even this faces definitional tweaks).
      *   Genuine conceptual *contraction* as a dominant trend over time.

  4.  **Conditions for the Phenomenon:**
      *   **A Moralized or Socially Constructed Category:** The concept's boundaries must be sensitive to evolving social norms, ethical understanding, and cultural values. Physical measurements are generally immune.
      *   **A Directional Social Process:** There needs to be an underlying societal trend (like increasing moral inclusion, sensitivity to harm, or rising standards of living) that drives the expansion of the concept.
      *   **Asymmetric Conceptual Rigidity:** The concept must be prone to expansion but resistant to contraction based on the same moral logic. Recognition of harm tends to be sticky.
      *   **Long-Term Analysis:** The problem becomes acute when comparing points separated by significant time, allowing for substantial conceptual evolution.

  5.  **Nature of the Problem:**
      *   It is **primarily a methodological defect in our ability to construct valid long-term comparisons**, not necessarily a defect in the original claim about the underlying societal trend (e.g., "the world has become less violent" or "living standards have improved" might still be true in a broader sense).
      *   It creates **epistemic uncertainty** about the *magnitude* and sometimes even the *direction* of change measured using the shifting metric. We cannot confidently say violence has declined by an order of magnitude *if* the definition of violence itself has expanded by an order of magnitude over the same period.

  6.  **Can Measures Escape It? Trade-offs of Fixing Definitions:**
      *   **Escaping is Difficult:** For moralized/socially constructed concepts undergoing significant normative evolution, it's extremely hard to avoid. The pressure to include newly recognized harms in "violence" or adjust poverty lines for contemporary living standards is strong and often justified.
      *   **Fixing Definitions ("Arbitrary Stasis"):**
          *   **Advantage:** Allows for consistent measurement over time. We *can* track, say, "homicide plus recorded assault as defined in 1950" from 1950 to today.
          *   **Disadvantage:** The measure becomes **increasingly anachronistic and morally inadequate.** It fails to capture relevant contemporary understandings of harm or deprivation. A fixed 1950s violence measure would ignore domestic violence; a fixed 1950s poverty line would ignore modern necessities like internet access. The measure loses validity for describing the *current* state or the *full scope* of the underlying phenomenon as we now understand it. It measures a narrow, historically frozen slice that becomes less meaningful.

  **Conclusion:**

  You've identified **Recursive Calibration** (or **Reflexive Conceptual Drift**). It's the specific methodological challenge arising when the *measurement instrument* (the definition and operationalization of a concept like violence or poverty) is systematically recalibrated *by* the very *societal progress* (increased moral sensitivity, rising standards) that the instrument is designed to measure over the long term. This recalibration is asymmetric (almost always expansionary) and creates a fundamental difficulty in interpreting long-term trends derived from the evolving metric.

  Concept Creep is the driver of the definitional expansion, but Recursive Calibration names the *structural problem this expansion creates for historical trend analysis*. The poverty threshold example you mention is a clear instance of the same phenomenon applied to a different moralized/socially constructed concept.

  This doesn't mean claims of progress are false; it means that metrics relying on evolving definitions require extreme caution and complementary methods (like using multiple fixed definitions, focusing on specific subtypes less prone to creep, or qualitative historical analysis) to properly interpret the underlying reality. The difficulty lies in reconciling historical consistency with contemporary validity.
