  I need to analyze their existing list and enhance it. The user mentioned nine points: creation problem, directedness, near-arbitrary content, immoral content, independence from reliance, coercion and threat, forgetting and death, self-promises, and release. But there are gaps. For instance, they haven't covered how promises relate to non-promissory obligations or how they interact with other duties like gratitude. Also, the issue of tacit promises or those in hierarchical relationships isn't addressed.

  The user suspects tensions between requirements, like the conflict between non-mysterious sources and reliance-independence. Directedness seems incompatible with practice-based views. I should confirm that and identify which requirement is most exclusionary—probably directedness, as it demands a relational wrong, ruling out many consequentialist or conventionalist theories.

  I'll organize the desiderata into categories: core requirements (non-negotiable), important refinements (strongly preferred), and theoretical constraints (for coherence). Core ones include creation, directedness, content neutrality, content limits, reliance independence, and release. Directedness is key for ruling out theories; if a view can't explain why the obligation is owed to the promisee, it fails.

  For additions, I'll include phenomena like the role of gratitude in releasing obligations, tacit promises, and the specificity of waiver. Also, addressing how promises fit into broader moral contexts without being reducible to them.

  On the user's tension points: The reliance-independence vs. non-mysterious source conflict is real. Directedness vs. practice-based accounts is another; practices can't ground directed duties without extra machinery. Directedness is the most work in ruling out candidates because it requires a second-personal element.

  Finally, evaluating the main families: Practice-based views fail on directedness and sometimes creation. Reliance views fail on independence. Second-personal authority views handle directedness well but may struggle with creation. Broader obligation-creation power views are promising but need care. The verdict should highlight strengths and weaknesses based on the criteria.

  The user wants this for ordinary conversation, so the theory must be intuitive, not technical. I'll keep explanations clear and grounded in everyday examples.
answer: |-
  Here's a refined and expanded set of desiderata for an adequate theory of promissory obligation, categorized and annotated. I've pruned redundancies, reorganized for clarity, added crucial missing elements, and specified negotiability. The core tension you identified is real, and "Directedness" is indeed the most potent filter.

  **Core Requirements (Non-Negotiable for an Adequate Account of the Moral Bindingness *to the Promisee*):**

  1.  **The Creation Problem (Non-Negotiable):**
      *   **Requirement:** Explain how a purely voluntary act (utterance + intention) can *create* a new, directed moral reason for action that did not exist before, without invoking supernatural forces ("alchemy") or collapsing into existing reasons.
      *   **Considerations:** This is the core puzzle. Promises genuinely feel binding in a way that goes beyond pre-existing duties or predictions. A theory that cannot explain this creation ex nihilo aspect fails at the outset.
      *   **Your Original:** Slightly rephrased for focus.

  2.  **Directedness / Second-Personal Character (Non-Negotiable):**
      *   **Requirement:** Explain why the obligation is fundamentally *owed to the promisee*. This must include:
          *   The promisee's unique standing to release the obligation (waiver).
          *   The promisee's unique standing to demand performance or complain of breach (claim-right).
          *   The sense that breach constitutes a *wronging* of *this specific person*, not just a generic moral failing or social disutility.
      *   **Considerations:** This is the heart of your quest – distinguishing *wronging someone* from *doing something wrong*. It captures the relational nature of promising. A bystander cannot release the duty; only the promisee holds the correlative claim-right.
      *   **Your Original:** Expanded to emphasize the *wronging* aspect.
      *   **Key Filter:** This requirement powerfully rules out purely consequentialist or strong conventionalist accounts that ground obligations solely in social utility or practice rules, as they struggle to explain this specific, directed claim-right held by an individual.

  3.  **Content Neutrality (Near-Arbitrary Content) (Non-Negitiable):**
      *   **Requirement:** Explain how promising can create a genuine obligation to perform actions that were previously morally optional (e.g., bring Brand X tea) or to refrain from actions that were previously permissible (e.g., stay out of a dispute), making the promised action *required* or the refrained action *forbidden* for the promisor in relation to the promisee.
      *   **Considerations:** This demonstrates the *normative power* of promising. It transforms the moral landscape for the promisor specifically regarding the promisee. Theories limited to reinforcing pre-existing duties fail here.
      *   **Your Original:** Kept, essential.

  4.  **Content Limits (Immoral Promises) (Non-Negotiable):**
      *   **Requirement:** Explain why a promise to perform a seriously immoral act (e.g., murder, theft) generally does *not* create a binding obligation, or at least creates a significantly weakened or overridden one, while avoiding making bindingness subjectively depend on the promisor's *later* assessment of morality.
      *   **Considerations:** Promises don't override fundamental morality. The theory needs an objective (or inter-subjectively robust) grounding for why some acts cannot be morally commanded by a promise, preventing promisors from easily escaping obligations by retrospectively declaring them immoral.
      *   **Your Original:** Kept, essential. Added emphasis on avoiding subjectivism.

  5.  **Reliance Independence (Non-Negotiable):**
      *   **Requirement:** Explain how a promise can generate a binding obligation *even if* the promisee does not rely on it in any way (doesn't change plans, incur costs, or form expectations based solely on the promise) and would suffer *no harm whatsoever* from its breach. Reliance may add *additional* reasons (e.g., compensation owed for harm caused), but it cannot be the *source* of the core promissory obligation.
      *   **Considerations:** This isolates the intrinsic wrong of breaking a promise from the consequential wrong of causing harm through reliance. Promises feel binding simply because they were made, regardless of consequences. ("I promised I'd wave from the window at noon, even though I know you won't be looking.")
      *   **Your Original:** Kept, essential. Crucial for separating the *wronging* from the *harming*.

  6.  **Release & Waiver (Non-Negotiable):**
      *   **Requirement:** Explain how the promisee's voluntary act (release/waiver) can extinguish the promisor's obligation. Furthermore, explain how a promise *to* release someone from an obligation (e.g., "I promise I won't hold you to your promise to help me move") can *itself* be binding.
      *   **Considerations:** This demonstrates the dynamic, second-personal control the promisee has over the obligation directed towards them. It mirrors the creation power and is essential to the directedness. The bindingness of release-promises shows the normative power extends beyond just creating duties to *do* things.
      *   **Your Original:** Expanded to include release-promises.

  **Important Refinements & Phenomena (Strongly Preferred, Often Litmus Tests):**

  7.  **Distinction from Threats/Coercion (Strongly Preferred):**
      *   **Requirement:** Explain why a "promise" extracted under serious duress or threat (e.g., "Promise me your wallet or I'll shoot!") lacks full binding force (or is void), while acknowledging that it might still create *some* related moral unease or residual obligation (e.g., fairness if the threat was bluff). Explain the phenomenological similarity (both involve commitments) while distinguishing their normative force.
      *   **Considerations:** Highlights the voluntary nature essential to promising. Coercion vitiates consent, undermining the core act that generates the obligation. The similarity stems from the act of commitment, but the context changes its validity.
      *   **Your Original:** Kept, rephrased.

  8.  **Survival Conditions (Forgetting & Death) (Strongly Preferred):**
      *   **Requirement:** Provide a principled account of whether obligations survive:
          *   The promisor's genuine forgetting of a minor promise.
          *   The death of the promisee (especially for non-testamentary promises, e.g., "I promise I'll put flowers on your grave every year").
          *   The context of games/rituals where words resembling promises are understood by all *not* to be binding (e.g., pinky swears in jest, ceremonial utterances).
      *   **Considerations:** Tests the robustness and nature of the obligation. Does it depend on the promisee's continued existence or the promisor's conscious awareness? Does the shared understanding of context override the literal words?
      *   **Your Original:** Kept and clarified.

  9.  **Self-Promises: Distinction or Identity? (Strongly Preferred):**
      *   **Requirement:** Provide a principled explanation for whether obligations to oneself generated by "self-promises" are fundamentally the *same phenomenon* as interpersonal promises, or something distinct (e.g., mere resolutions with different normative force). The theory shouldn't just assume they are the same or different; it should explain why based on its core principles.
      *   **Considerations:** Challenges the directedness requirement. Can one truly *owe* an obligation *to oneself* in the same second-personal way? This probes the relational core of promising.
      *   **Your Original:** Kept, rephrased for clarity.

  10. **Gratitude & Release (Added Requirement):**
      *   **Requirement:** Explain the common intuition that performing a promised act, especially a significant one, often generates a duty of gratitude *in the promisee towards the promisor*, even though the promisor was just fulfilling an obligation. Conversely, explain why release can sometimes feel like a gift or act of grace.
      *   **Considerations:** Highlights that fulfilling a promise isn't merely "neutral" or "paying a debt"; it can create positive moral responses *because* it was owed. Release demonstrates the promisee's power over the obligation.
      *   **Addition:** This strengthens the directedness and relational aspect.

  11. **Tacit Promises & Implicit Undertakings (Added Requirement):**
      *   **Requirement:** Account for obligations arising from implicit understandings or contexts that generate promissory-like duties without explicit words (e.g., joining a cooperative project implies undertaking to do one's part; RSVPing 'yes' to a dinner implies attending).
      *   **Considerations:** Shows that the core normative mechanism isn't strictly dependent on formal utterances but on the communication of commitment within a shared context.
      *   **Addition:** Important for real-world applicability.

  12. **Specificity of Waiver (Added Requirement):**
      *   **Requirement:** Explain why the promisee can typically waive the obligation entirely but usually cannot unilaterally *modify* its core content (e.g., "I release you from bringing Brand X tea, but now you *must* bring Brand Y instead"). Modifications usually require a new agreement.
      *   **Considerations:** Reinforces the directed nature of control – the promisee controls the *existence* of the specific obligation owed *to them*, but not the creation of *new* obligations unilaterally.
      *   **Addition:** Refines the release phenomenon.

  **Theoretical Constraints (For Coherence):**

  13. **Non-Mysterious Grounding (Non-Negotiable):**
      *   **Requirement:** Ground the obligation in features of agency, rationality, relationships, or recognition that are accessible and defensible without esoteric metaphysical commitments. It must be usable in ordinary moral reasoning.
      *   **Considerations:** Addresses your "alchemy" concern and the need for conversational usability. Rules out divine command, pure intuitionism, or overly complex specialist machinery.
      *   **Implicit in your Creation Problem:** Made explicit.

  14. **Integration with Broader Morality (Strongly Preferred):**
      *   **Requirement:** Show how promissory obligations interact with, but are not simply reducible to, other moral considerations (e.g., beneficence, fidelity, fairness, autonomy). Explain potential conflicts and overrides.
      *   **Considerations:** Promises exist within a wider moral landscape. The theory shouldn't make them hermetic or absolute, nor should it reduce them entirely to other duties.
      *   **Addition:** Crucial for real-world application.

  **Addressing the Tensions:**

  *   **Reliance-Independence vs. Non-Mysterious Source:** This is a genuine tension. Explaining how an obligation springs into existence *ex nihilo* without reliance or social utility *is* hard. However, **Directedness** is the more fundamental hurdle for many theories. A theory might *start* to explain creation non-mysteriously (e.g., via autonomy or recognition), but if it cannot explain *why this obligation is owed specifically to the promisee*, it fails your core objective. Directedness requires a second-personal element.
  *   **Directedness vs. Practice-Based Accounts:** Absolutely correct. Pure practice-based accounts (e.g., "It's wrong because it violates the rules of the promising practice") struggle profoundly with Directedness. They might explain why breaking a promise is *wrong*, but not why it *wrongs this specific person* in a way that gives *them* a special claim and power of release. The practice creates a general duty of compliance, not necessarily a directed duty *to* the promisee. Only if the practice *itself* is defined to include directed claims (which moves it towards a hybrid view) can it potentially satisfy this.
  *   **The Key Filter:** **Directedness** does the most work in ruling out candidates. It's the requirement most directly tied to your core question ("wrongs the particular person") and is the hardest for many popular theories to satisfy without significant modification or additional machinery.

  **Brief Verdict on Main Families (Against Criteria):**

  1.  **Social Convention/Practice-Based (e.g., Rawlsian, Humean):**
      *   **Strengths:** Solves Creation (via social rules), handles Content Neutrality & Immoral Content (rules define validity), can handle Release/Context (rules include them), often Non-Mysterious. Can *describe* Directedness as part of the practice.
      *   **Weaknesses:** **Fails Directedness** at the *moral* level. Why *morally* must I owe the duty *to you* just because a social rule says so? What if I reject the practice? Struggles genuinely with Reliance Independence (practice often exists *because* of reliance needs). Release feels like changing rules, not waiving a personal claim. Self-promises become very odd.

  2.  **Reliance/Expectation-Based:**
      *   **Strengths:** Non-Mysterious (grounded in harm prevention), handles some Coercion (no genuine reliance?), can integrate with broader morality.
      *   **Weaknesses:** **Fails Reliance Independence catastrophically.** Cannot explain bindingness without reliance/harm. **Fails Directedness** – the wrong is causing harm/disappointment, not necessarily wronging *the promisee* in a unique way (a bystander harmed by my unreliability might also have a claim). Struggles with Content Neutrality (why rely on trivial promises?). Release is about preventing future reliance, not waiving a claim.

  3.  **Second-Personal Authority/Recognition (e.g., Darwall, Shiffrin):**
      *   **Strengths:** **Excels at Directedness** (core is mutual recognition of authority to demand/obligate). Handles Release/Waiver naturally (exercise of that authority). Explains the *wronging* directly. Handles Coercion (no genuine recognition of authority). Can handle Content Neutrality & Limits. Explains Gratitude/Release feeling. Integrates tacit promises.
      *   **Weaknesses:** Creation can seem mysterious ("how does recognizing authority *create* the obligation?"). Requires careful handling to be Non-Mysterious in ordinary conversation (needs clear metaphors). Self-promises are problematic (can one recognize authority *in oneself* over oneself?). Forgetting/Death require careful treatment (does authority survive death?).

  4.  **Broader Obligation-Creation Power (e.g., contractualism, autonomy-based):**
      *   **Strengths:** Can solve Creation via autonomy (binding oneself). Can potentially handle Directedness if autonomy exercise is seen as transferring a claim-right or inviting trust. Handles Content Neutrality. Can explain Release (autonomy exercised to retract).
      *   **Weaknesses:** Needs specific mechanism for **Directedness** – how does *my* autonomous act create a claim *for you*? Risk of circularity. Explaining Immoral Content limits is crucial (autonomy cannot bind to immorality). Risk of making bindingness too subjective. Self-promises fit easily, but may blur the distinction from resolutions. Reliance Independence needs positive argument.

  **Overall:** Theories grounded in **second-personal authority** currently handle the **Directedness** requirement most directly and successfully, which is your core concern. **Broader obligation-creation power** views have potential but need to carefully specify the mechanism for directedness. **Practice-based** views struggle profoundly with directedness on a moral level. **Reliance-based** views fail the reliance independence test. The tension between creating a novel, directed obligation non-mysteriously remains a challenge for all, but the second-personal accounts arguably provide the most coherent framework for understanding the *relational wrong* at the heart of promise-breaking. Use the list above to probe any candidate theory deeply, paying particular attention to how it tackles **Creation**, **Directedness**, **Reliance Independence**, and **Release**. Good luck convincing your friend!
