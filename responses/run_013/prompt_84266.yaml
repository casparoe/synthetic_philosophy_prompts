  First, I need to unpack the core positions. Ranke's "wie es eigentlich gewesen" suggests objectivity in individual facts. Carr introduces the dialogue between present and past, emphasizing interpretation. White takes it further with narrative emplotment as shaping facts into genres. The key is shifting the focus from whether the past is real to what level we're assessing objectivity.

  The user's distinction makes sense. We can verify individual statements—dates, events, documents—through evidence. That's the modest objectivity. But when historians select and arrange these facts into a narrative, that's where subjectivity enters. Carr's dialogue comes in because present concerns influence selection. White's genres show how the same facts can tell different stories.

  Testing this with an example: a historian writing about the Cuban Missile Crisis. Every sentence is true—Khrushchev placed missiles, Kennedy blockaded, etc.—but arranged to emphasize U.S. heroism while omitting the Turkey missiles. The whole narrative becomes misleading. This shows the unit matters: statements are objective, but the narrative structure imposes interpretation.

