prompt: |-
  ok, so i keep ending up in arguments about whether viruses are alive, and i've slowly realized i dont actually know what i'm asking for when i ask for a definiton of life. before i read any more hot takes on this, i want the spec. write me the desiderata for a definition of life — what any adequate one has to deliver, with the case behind each requirement.

  here's the kind of thing i want covered, though add whatever i'm missing.

  the cases it has to get right: viruses (and the awkward fact that a virus inside a cell looks like a hijacked piece of the cell); prions, the misfolded proteins that template other proteins into the same misfolded shape, with no metabolism and no nucleic acid, and which come in strains that get selected; viroids, the naked little RNA rings that infect plants; plasmids and transposons; mitochondria, which are bacteria that moved in and never left; spores and tardigrades in cryptobiosis, metabolism down to nothing and then back; a corpse, which is not alive but is still a lot of cellular activity for a while; a brain-dead body on a ventilator that still heals wounds and can carry a pregnancy to term; a mule, alive, sterile, last of its line; cancer cells in a dish, your own cells outliving you; fire; a crystal growing in a supersaturated solution; an autocatalytic chemical set where the molecules collectively make each other; a self-replicating bit of code; a lab-built cell with a fully synthesized genome. and a few i'm inventing because i think they break different things: (a) the mirror bug — something that does everything a bacterium does but with mirror-image chemistry, so none of our stains or instruments recognise it; (b) the one-off — an entity that maintains and repairs itself and responds to its surroundings for a thousand years, but never reproduces and has no relatives; (c) the chimera — an organism assembled out of parts that were each, on their own, not alive.

  the distinctions it can't collapse: life vs alive vs organism vs living thing; a body that was alive vs a body that is alive; being alive as a property you either have or don't vs a matter of degree; life as a natural kind out there in the world vs a word we stipulate for our own purposes; the individual vs the lineage as the thing that bears the property (is a lone sterile organism less alive than one bacterium in a thriving species?); and whether the definition is telling us what life is or just how to tell.

  the constraints it can't violate: don't make fire and hurricanes alive, even though they dissipate energy and hold their shape for a while; don't open the door so wide that computer viruses, crystals and clay templates walk in; don't require the whole body to stop before we call it death, since we're outnumbered by our own bacteria anyway; and if it's meant to be a definition of life and not of earth life, don't build in carbon and water.

  then the part i actually care about. the definition is being asked to do several jobs at once and i suspect they pull apart: an astrobiologist wants one that lets a probe say yes or no about something on titan it has never seen; a doctor wants one that settles when a patient is gone; a biologist wants one that carves nature at the joints; a patent office wants one that says whether a synthesized genome is an invention or a discovery. say which pairs of these can't be had together, and whether the honest answer is that life is a word doing several jobs and no single definition can do them all. if that's the answer, say so — it's the answer i most want.

  mark each requirement as non-negotiable or as the preference of one camp, flag any subset i should stop expecting to be jointly satisfiable, and tell me which single requirement does the most work at ruling candidates out. you can finish with a short scorecard of the usual contenders — the metabolism one, the self-organisation/autopoiesis one, the darwinian-evolution one that says life is a chemical system that sustains itself and can evolve, the viruses-are-alive crowd, and life-as-cluster-or-stipulation — but keep it brief, the criteria are what i'm here for. no citations or reading lists please, i can't look anything up, just the argument.
reasoning: |-
  Okay, the user is deep into the philosophy and science of defining life, and they've presented a complex array of scenarios and requirements. They're clearly frustrated with circular arguments and want a solid framework to evaluate any definition of life. Let me unpack their query.

  First, they listed numerous edge cases: viruses, prions, viroids, mitochondria, spores, corpses, brain-dead bodies, mules, cancer cells, fire, crystals, autocatalytic sets, synthetic cells, and their invented cases like the mirror bug, one-off entity, and chimera. Each challenges different aspects of life definitions—reproduction, metabolism, evolution, chemical basis. 

  They also highlighted distinctions like life vs. alive vs. organism, alive vs. dead bodies, binary vs. gradient life, natural kind vs. stipulative definition, and individual vs. lineage focus. Plus, constraints: excluding non-living dissipative structures (fire, hurricanes), avoiding over-inclusion (computer viruses, crystals), handling symbiotic organisms, and not being Earth-centric.

  The user's core concern is the tension between different purposes for defining life: astrobiology (detection), medicine (death declaration), biology (natural classification), law (patents). They suspect these goals conflict and want to know if a unified definition is possible or if life is just a polysemous concept.

  Hmm, I need to structure desiderata clearly. Non-negotiables should be universal applicability (to handle alien life and exotic cases), avoiding false positives (fire isn't alive), and avoiding false negatives (sterile mules are alive). Reproduction is tricky—essential for lineages but not individuals. Metabolism is key for maintaining aliveness but not sufficient alone (fire metabolizes). Evolution seems robust but fails for one-offs or synthetic life without history.

  The big conflict: Astrobiology needs simple detection (present-state properties), while biology cares about evolutionary potential. Medicine focuses on organismal aliveness (metabolism, response), but patent law wrestles with "invention" vs. "discovery" of synthetic life. These goals pull toward different criteria—no single definition satisfies all. The user likely suspects this and wants confirmation that life is a cluster concept with context-dependent definitions.

  For the scorecard: Metabolism-only fails (fire, corpses). Autopoiesis (self-maintenance) handles mules/cancer but includes flames. Darwinian evolution excludes one-offs/mules. Virus-inclusion definitions struggle with prions/crystals. Cluster/stipulative approaches are honest but unsatisfying for detection. 

  The user's deeper need might be intellectual clarity—they want to exit debates by understanding why disagreements persist. Emphasizing the "impossible triad" (detection, aliveness, evolution) as mutually exclusive goals could resolve their frustration. They’d appreciate knowing that metabolism + information is the best "aliveness" proxy for medicine, while evolution is key for biology, but neither works universally. 

  Final note: Stress that life isn’t a binary universal category. It’s a weighted cluster of properties, with context determining which matter. That liberates them from absolutist arguments.
answer: |-
  Here's a breakdown of the desiderata for a definition of life, based on your cases and distinctions, categorized by necessity and purpose:

  ### Non-Negotiable Core Requirements ("Must-Haves")
  1.  **Avoid False Positives:** Must exclude fire, hurricanes, growing crystals, simple autocatalytic sets (without information encoding), and computer viruses. *Why:* These exhibit some life-like properties (growth, energy dissipation, replication) but lack core biological agency. A definition allowing these is useless.
  2.  **Avoid False Negatives:** Must include:
      *   **Sterile Organisms:** Mules, worker ants, "one-off" entities. *Why:* They clearly exhibit biological activity; sterility doesn't negate being alive *now*.
      *   **Metabolically Dormant States:** Spores, tardigrades in cryptobiosis. *Why:* Dormancy is a survival strategy, not cessation of life; potential for revival is key.
      *   **Free-Living Cells:** Bacteria, archaea, protists, cancer cells in culture. *Why:* The uncontroversial baseline for "alive."
      *   **Synthetic Life:** Lab-built cells with synthetic genomes (e.g., *Mycoplasma laboratorium*). *Why:* If it walks, talks, and replicates like a bacterium, it should be treated as one.
  3.  **Distinguish "Alive" from "Was Alive":** Must differentiate between a functioning organism (or dormant one) and a corpse or extracted organ/tissue under artificial conditions. *Why:* Captures the transition from life to death. Healing in a brain-dead body complicates this but leans towards "was alive" (host) with pockets of *cellular* aliveness.
  4.  **Accommodate Symbiosis/Complexity:** Must handle mitochondria (integrated but derived), chimeras (assembled functional wholes), and holobionts (host + microbiome). *Why:* Life frequently exists in interdependent layers; a definition shouldn't break down because of integration. The *functional whole* matters.
  5.  **Be Agnostic to Chemistry:** Must not require carbon, water, DNA, or specific chirality ("mirror bug"). *Why:* Essential for astrobiology and universal applicability. Life must be defined by *function*, not specific terrestrial implementation.

  ### Important Functional Requirements ("Strongly Should-Haves")
  6.  **Account for Reproduction/Lineages (but not at the Individual Level):** Must acknowledge reproduction's role in *populations* and evolution without requiring it for an individual to be "alive". *Why:* Solves the sterile organism/one-off problem while recognizing evolution as a *consequence* of life (for populations).
  7.  **Require Metabolism/Maintenance:** Must involve active energy processing and internal regulation to maintain organization *against entropy*. *Why:* Distinguishes living systems (self-maintaining) from replicators alone (prions, viroids, plasmids) and dissipative structures (fire). The "hijacked cell" vs. "virus particle" distinction hinges on this.
  8.  **Require Information Processing:** Must involve encoding, transmission, and use of information for maintenance and function. *Why:* Distinguishes complex self-sustaining systems (cells) from simple templating (prions, crystals) or non-instructive replication. Explains adaptation and complexity.
  9.  **Handle Gray Areas as Gradients:** Must allow for degrees of "aliveness" without needing a perfect binary. *Why:* Cases like brain death, complex parasites, or entities under extreme stress exist on a spectrum. A definition shouldn't force an artificial yes/no where it doesn't fit.

  ### Contextual/Pragmatic Requirements ("Nice to Haves, but Contextual")
  10. **Usability for Detection (Astrobiology):** Should provide observable signatures for remote or novel contexts. *Why:* Practical need for searching for life. However, this risks oversimplification.
  11. **Usability for Legal/Medical Definitions:** Should offer clear boundaries for death, patentability (invention vs. discovery). *Why:* Societal needs. However, these often require *operational* definitions specific to the context, not necessarily a universal essence.

  ### The Impossible Triad & Inherent Tensions
  Your core insight is correct: **No single definition can perfectly satisfy all desired jobs simultaneously.** The tensions are fundamental:

  1.  **Detection vs. Essence:** Astrobiology needs *detectable signatures* (often present-state properties like metabolism + complex molecules). Biology seeks the *fundamental nature* (often involving potential/history like evolvability). A Titan probe might miss a dormant spore or a "one-off," while a purely historical definition is useless for detection.
  2.  **"Alive Now" vs. "Capable of Evolution":** Medicine and individual aliveness care about *current state* (metabolism, response). Evolutionary biology cares about the *lineage potential*. The sterile "one-off" nails this conflict.
  3.  **Clear Boundary vs. Fuzzy Reality:** Law/Medicine crave a bright line (death, patentability). Biology recognizes life exists on a spectrum and involves complex hierarchies (cells, organisms, colonies, holobionts). Defining the exact moment of death or whether a synthetic genome is "life" for patents is inherently messy.

  **The Honest Answer:** **"Life" is a cluster concept serving multiple purposes.** There is likely no single, essentialist definition that cleanly carves nature at a joint *and* satisfies all practical needs across contexts. The best we can do is define **"alive"** (current state: metabolism + organization + response) and **"life"** (the phenomenon: systems capable of Darwinian evolution *or* exhibiting the core cluster of "alive" properties), recognizing the cluster includes metabolism, information processing, maintenance, potential for reproduction/evolution, and historical continuity.

  ### The High-Bar Requirement
  **Requirement #8 (Information Processing)** does the heaviest lifting in ruling out candidates. It excludes fire, simple crystals, and arguably prions/viroids (mere templating, no *instructional* information processing for system maintenance). It's crucial for distinguishing complex biological agency.

  ### Brief Scorecard of Major Contenders
  *   **Metabolism-Only:** Fails spectacularly (Fire! False Positives). Inadequate.
  *   **Autopoiesis (Self-Making Boundary):** Handles "alive now" well (mules, cancer cells), excludes fire/crystals. Useful but fuzzy on boundaries/information. Struggles with lineages/evolution. Good for "organism."
  *   **Darwinian Evolution (Population-Level):** Strong for "life" as a phenomenon (excludes one-offs, fire). Terrible for "alive now" (sterile mules aren't alive?). Requires reproduction & heredity. Best for biology's "joints" but ignores individuals.
  *   **"Viruses Are Alive" (Inside Host):** Highlights information/metabolism dependency. Blurs individual organism boundaries. Includes viroids? Opens door to prions? Creates a weird category ("alive sometimes").
  *   **Life-as-Cluster/Stipulation:** Most honest/realistic. Acknowledges tensions, avoids false positives/negatives by weighting core properties (metabolism, info, evolution potential). Satisfies no single camp perfectly but accommodates complexity. Pragmatic.

  **Conclusion:** Define "alive" (current state: metabolic self-maintenance + information-based organization) vs. "life" (the phenomenon characterized by systems capable of open-ended evolution). Accept that different contexts (astrobiology, medicine, law, biology) will prioritize different aspects of the cluster. The edge cases reveal the concept's fuzziness, not necessarily a failing of science.
