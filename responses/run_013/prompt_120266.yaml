prompt: |-
  I am assembling materials for a graduate seminar that sits between the philosophy of biology and the philosophy of mind, and what I need is a specification rather than a survey. The subject is the idea of a free-floating rationale: the practice of explaining what a system does by citing the reason for it — the problem it solves, the end it serves — in cases where the system contains no representation of that reason and no designer put it there. I want the criteria that any adequate theory of this practice has to satisfy, not a list of the views that have been held about it.

  Begin with a short section titled The target (~150 words) that fixes what is being theorised: state plainly what kind of claim an ascription of a free-floating rationale is, and what it would take for such a claim to be false. Treat the following as the cases the theory must accommodate, and use these rather than substituting cases you prefer:

  1. A river, over decades, cuts a channel whose profile comes close to minimising the energy it dissipates. Nothing in the river represents a gradient, and nothing selected it for this.
  2. A network trained by gradient descent converges on a policy that exploits a shortcut in its reward signal. The strategy has a rationale relative to the proxy, and none relative to the goal its trainer had in mind.
  3. A colony's foraging traffic follows a pattern close to optimal for the distribution of food in its territory, though no individual ant represents either the distribution or the optimum.
  4. A male's courtship display admits two incompatible rationales — one as an honest signal of quality, one as an exploitation of a pre-existing sensory bias — and the evidence does not settle between them.
  5. A moth steers by keeping a distant light at a fixed angle to its body. This fails catastrophically near a flame: the rationale that governs its ordinary flight is present, and is also the reason it dies.
  6. A trait's current utility differs from whatever it was selected for, and the two rationales cannot both be the reason the trait persists.

  Then a section titled The desiderata (~700–900 words) giving the requirements, numbered, each with the case or consideration that motivates it and a sentence on what a theory that failed it would get wrong. I expect the list to cover: what makes an ascription true or false; whether ascription is a fact about the system or a stance the theorist takes; whether the theory must distinguish selection for a trait from the mere presence of a trait that happens to help; how it handles cases with no selection history at all (1 and 2); how it handles rival rationales that fit the same behaviour equally well (4); whether a rationale must be capable of being right or wrong for the system, and what failure looks like (5); whether reasons-talk must do work that plain causal description cannot, and if so what work; whether ascriptions come in degrees; and whether the theory must sit consistently alongside the rest of biology and physics, which contains no purposes. Add any requirement I have missed, and say why it belongs.

  Then a section titled Genuine requirements, camp preferences (~200 words) separating the criteria that any theory must meet from the ones that only look compulsory because a particular tradition takes them for granted. Be specific about which tradition, and about what it is protecting.

  Then a section titled Where the list cannot be satisfied together (~300 words). Identify any subsets of the desiderata that cannot be jointly met, explain the conflict in each case, and say which requirement you would give up and at what cost. This is the section I care most about; a clean list with no tensions in it is a failure.

  Then a section titled The contenders, scored (~200 words) taking the two or three most natural positions one might hold here — for instance that these ascriptions are literal causal claims about selection, that they are a stance we adopt for prediction, that they are claims about the counterfactual structure of the system's responses, or that they are not claims at all but instruments — and saying briefly how each fares against the list. Keep this short; the list is the deliverable.

  Constraints: no citations, no reading lists, and no appeals to what some author has argued. I want the criteria defended on the strength of the cases. If a requirement needs an authority behind it in order to stick, that is a sign it is not yet doing its work.
reasoning: |-
  Okay, let me approach this systematically. The user is assembling materials for a graduate seminar on free-floating rationales - those explanations that attribute purpose or problem-solving to systems without designers or internal representations. They want clear criteria for evaluating theories about this phenomenon, grounded in six specific cases.

  First, I need to understand the core request: not a survey of existing views but specifications for what makes a theory adequate. The cases provided are crucial - they're non-negotiable examples that any theory must handle. The river case (1) challenges us to explain apparent optimization without selection or representation; the neural network case (2) introduces designer-intention gaps; ant colonies (3) require distributed cognition explanations; ambiguous courtship displays (4) present rival rationales; the moth's fatal flight (5) shows rationale persistence despite failure; and trait utility shifts (6) demand handling historical vs current purposes.

  The structure proposed has five clear sections. For "The Target," I'll define free-floating rationales as non-representational, non-intentional functional explanations that can be true/false based on whether the behavior actually solves the cited problem. The desiderata section needs careful construction - I'm considering about ten requirements covering truth conditions, stance-dependence, selection history relevance, handling of rivals, normativity, explanatory added value, gradation, and scientific consistency. Each must be motivated by specific cases.

  Notably, the user emphasizes tensions between desiderata as crucial - a clean list would fail their test. I anticipate conflicts between selection-history requirements and cases like the river (no history), or between objective truth and stance-dependence. In "Genuine Requirements vs Camp Preferences," I'll distinguish universal demands from tradition-specific ones - perhaps the intentional stance tradition overemphasizes prediction while selectionist approaches overindex on history.

  The contenders section will briefly score positions like teleosemantics (strong on selection but weak on novel cases), instrumentalism (avoids ontology but loses truth-value), and mechanistic-counterfactual approaches (handles non-biological cases but may struggle with normativity). Throughout, I'll rigorously avoid citations, grounding everything in the cases' internal logic.

  This user clearly values philosophical precision and dislikes hand-waving - their demand for "criteria defended on the strength of the cases" suggests impatience with appeals to authority. The graduate seminar context implies I should prepare this material to withstand sharp student scrutiny. The moth and neural network cases feel particularly important - they bridge classic ethology with contemporary AI concerns, which might reflect the seminar's interdisciplinary angle.
answer: |-
  ## The Target

  An ascription of a free-floating rationale (FFR) claims that a specific pattern or behavior *P* exhibited by a system *S* exists, or persists, *because* it achieves a specific outcome *O* (or solves a specific problem *P*), *despite* the absence of any representation of *O* within *S* and the absence of any designer who intended *O*. It is a non-representational, non-intentional functional explanation. The ascription is **false** if the connection between *P* and *O* is merely coincidental, accidental, or incidental to why *P* exists or persists within *S*. For example, the river's channel shape (P) is claimed to exist *because* it minimizes dissipated energy (O), not merely that it happens to do so. If the shape arose purely from random erosion patterns unrelated to energy dissipation dynamics, the FFR ascription would be false.

  ## The Desiderata

  Any adequate theory of FFR ascriptions must satisfy the following requirements, motivated by the core cases:

  1.  **Objectivity of Truth/Falsity:** The theory must provide clear criteria determining when an FFR ascription is objectively true or false, not merely useful or conventional. *Motivation:* Cases 1 (River), 4 (Courtship Rivalry), and 6 (Utility vs. Origin) demand that we can be *wrong* about the rationale. A theory failing this, treating FFRs as merely useful fictions, couldn't capture the difference between the river's shape being *caused* by energy minimization dynamics vs. being a random shape that coincidentally minimizes energy.
  2.  **Non-Stance-Dependence (Minimal):** The truth of an FFR ascription must depend primarily on facts about the system *S* and its environment, not *solely* on the explanatory stance or interests of the theorist. *Motivation:* Cases 1, 3 (Ant Colony), and 5 (Moth) suggest the rationale exists "out there" in the system's dynamics. A stance-dependent theory couldn't explain why the moth's flight rationale is *objectively present* and causes its death near flame, irrespective of whether any observer adopts that stance.
  3.  **Distinguishes Selection-For from Fortuitous Benefit:** The theory must differentiate between a trait being present *because* it produces *O* (selection-for) and a trait being present for other reasons while merely *happening* to produce *O* (fortuitous benefit). *Motivation:* This is the core challenge of Case 6 (Utility vs. Origin). A theory collapsing this distinction (e.g., solely defining rationale by current effect) couldn't capture the historical contingency crucial to evolutionary biology and the possibility of mismatch.
  4.  **Accommodates Non-Biological & Ahistorical Systems:** The theory must account for FFRs in systems lacking evolutionary history, like the river (Case 1) and the trained network (Case 2). *Motivation:* The river's channel profile clearly exhibits a functional rationale without selection or design. A theory requiring selection history as a *necessary* condition (common in biology) fails here.
  5.  **Handles Rival Rationales:** The theory must provide a principled way to analyze cases where multiple, incompatible rationales seem equally plausible given the evidence (Case 4: Courtship Rivalry). *Motivation:* Honest signaling and sensory exploitation offer distinct explanations. A theory must either adjudicate between them based on system facts or explain the indeterminacy itself as a feature of the system/environment, not just observer ignorance.
  6.  **Normativity & Failure:** The theory must account for the normative dimension implied by "rationale" – the idea that *O* is the *right* outcome for *P* to achieve, and that *failure* to achieve *O* under relevant conditions is possible and significant (Case 5: Moth). *Motivation:* The moth's behavior has a rationale that governs its flight *and* causes its demise; it fails *relative to* the rationale guiding its mechanism. A theory lacking normativity couldn't explain why the moth's behavior near flame is a *failure* of its own system, not just an observer's disappointment. The rationale must be capable of being "wrong for the system" in specific contexts.
  7.  **Explanatory Added Value:** The theory must specify what explanatory work the FFR ascription does that a complete, fine-grained *causal-mechanistic* description of *S* and its environment does *not* do. *Motivation:* All cases. If FFR talk is just shorthand for complex causation, it's eliminable. The theory must show how citing the rationale captures something essential – e.g., robustness across variations, counterfactual stability, or the functional organization – missed by the mechanistic account alone.
  8.  **Gradation of Fit (Possibly):** The theory should accommodate that FFR ascriptions can hold to varying *degrees* – how well *P* achieves *O*, how robustly it does so across environments, how central *O* is to *P*'s persistence. *Motivation:* Cases 1 (River "close to" minimizing), 3 (Ant Colony "close to" optimal), and 4 (Rival rationales fitting "equally well") suggest that fit isn't always binary. A rigidly binary theory might struggle with these nuances.
  9.  **Consistency with Physics/Biology:** The theory must be compatible with the broader frameworks of physics and biology, which are not inherently teleological. FFRs must not imply irreducible purposes "built into" the universe. *Motivation:* Case 1 (River) is fundamentally a physical process. The theory must show how teleological *talk* emerges from non-teleological *processes* without contradiction.
  10. **Handles Designer-Intent Mismatch:** The theory must account for FFRs where the system's rationale diverges from the designer's intentions, as in Case 2 (Network Shortcut). *Motivation:* The network exploits a proxy reward; its functional rationale is relative to the *actual* feedback signal, not the trainer's goal. The rationale must be grounded in the system's operational dynamics, not the designer's mind.
  11. **Distributed Realization:** The theory must explain how an FFR can govern the behavior of a collective system (Case 3: Ant Colony) where no individual component represents the rationale or the global outcome. *Motivation:* The colony's foraging *as a whole* exhibits rationale, grounded in individual interactions and environmental feedback, not centralized representation.

  ## Genuine Requirements vs. Camp Preferences

  *   **Genuine Requirements:** Objectivity (1), Selection-Fortuity Distinction (3), Non-Biological Accommodation (4), Rival Rationales Handling (5), Normativity/Failure (6), Explanatory Added Value (7), Physics/Biology Consistency (9), Designer-Intent Mismatch (10), Distributed Realization (11). These are mandated by the core cases themselves – failing them misdescribes the phenomena (e.g., confusing coincidence for function, ignoring failure, being incompatible with science).
  *   **Camp Preferences:**
      *   *Strong Stance-Dependence:* Insisting FFRs are *entirely* constituted by the observer's stance/purpose is a preference (often Dennettian instrumentalism). The core cases (especially 1, 3, 5) show the rationale has objective traction in the system's dynamics. This stance protects an austere ontology free of intrinsic teleology but risks losing the objectivity evident in the cases.
      *   *Selection History as Necessary:* Requiring a selection history for *any* FFR is a preference (common in evolutionary biology-inspired teleosemantics). Cases 1 and 2 demonstrate FFRs without it. This stance protects a clear link to adaptation in biology but fails for non-biological and novel designed systems.
      *   *Binary Fit Only:* Insisting FFR ascription is all-or-nothing might be a preference for simplicity. Cases 1, 3, and 4 suggest degrees of fit are inherent. This stance protects theoretical neatness but misses nuances in the phenomena.

  ## Where the List Cannot Be Satisfied Together

  Tensions arise primarily around objectivity, normativity, and consistency with physics/biology:

  1.  **Objectivity/Normativity vs. Physics/Biology Consistency:** How can a rationale be objectively normative ("right/wrong for the system") in a universe of blind physical causes? A theory grounding normativity *only* in selection history (e.g., "proper function") satisfies 9 and provides a form of 6 but fails 4 (non-biological cases) and 10 (designer mismatch). A theory grounding normativity in current system dynamics (e.g., cybernetic stability) might satisfy 4, 6, 9, and 10 but struggles with the historical dimension of 3 and 6 – why is the moth's flame-death a *failure* of *its* rationale, rather than just the system breaking? *Cost of Giving Up:* Sacrificing strong normativity (6) reduces FFRs to descriptive patterns, losing the "reason" aspect. Sacrificing strict physics consistency (9) makes the theory unscientific.
  2.  **Explanatory Added Value vs. Causal Completeness:** What unique work does the rationale *do* if a complete causal description exists? A theory emphasizing counterfactual robustness (how *P* maintains *O* across perturbations) provides added value (7) and handles gradation (8) but might struggle with the historical "selection-for" distinction (3) – is a fortuitously robust trait different? A selectionist theory satisfies 3 clearly but might make the added value of FFR talk seem redundant to the historical causal story. *Cost of Giving Up:* Sacrificing 7 makes FFRs explanatorily inert epiphenomena. Sacrificing causal grounding risks vacuity.
  3.  **Objectivity vs. Rival Rationales (Case 4):** Can there be a single objective rationale when evidence supports two incompatible ones? A theory insisting on a single true rationale risks arbitrariness in Case 4. A theory allowing genuine indeterminacy preserves objectivity (the indeterminacy is real) but weakens the idea of a *specific* rationale governing the behavior. *Cost of Giving Up:* Insisting on a single rationale might force an unjustified choice. Accepting indeterminacy might seem like abandoning objectivity for relativism.

  ## The Contenders, Scored

  1.  **Teleosemantics (Selectionist):** Grounds FFRs in past selection history. *Scores:* Strong on 3 (Distinction), 6 (Failure relative to selected function), 9 (Compatible if selection is natural process). Weak/Fails on 1 (Truth depends on inaccessible history? Rivals?), 4 (Non-biological), 5 (Rivals often indeterminable historically), 10 (Mismatch), 11 (Distributed realization possible but focus on trait history).
  2.  **Instrumentalism/Intentional Stance:** FFRs are useful predictive tools adopted by observers, not literal truths about the system. *Scores:* Strong on 5 (Rivals as alternative stances), 9 (No real teleology), 10 (Focus on predictability, not intent). Weak/Fails on 1 (Denies objectivity), 2 (Makes it stance-dependent), 3 (Struggles with distinction), 6 (Failure is observer-relative), 7 (Added value is predictive convenience, not system property).
  3.  **Mechanistic-Counterfactual:** FFRs are grounded in the system's actual causal organization and its robust, counterfactual-supporting dispositions to achieve *O* across relevant variations. *Scores:* Strong on 1 (Objective dispositions), 2 (System-based), 4 (Applies to rivers/networks), 5 (Rivals as competing dispositional accounts), 7 (Robustness adds value), 8 (Degrees of robustness), 9 (Dispositions physical), 10 (Based on actual feedback), 11 (Emergent dispositions). Weak/Fails on 3 (Hard to distinguish selection-for from fortuitous robustness), 6 (Normativity of "failure" needs careful grounding beyond mere disruption).
