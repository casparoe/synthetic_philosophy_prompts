prompt: |-
  Alright, here's what I need, and I want you to build it, not find it.

  Quick scaffolding so we're on the same page about why this is hard. There are basically two ways people ground the authority of an advance directive. One says the binding thing is the earlier choice's autonomy: it was made competently and with information, so it stands — full stop — and the fact that the later self has changed her mind is neither here nor there, because the whole point of the earlier self's authority is that it isn't hostage to what she'll want later. The other says the binding thing is that it's *her* — the past decision binds the present self the way a promise to yourself binds, which means the strength of the binding should track how much of her is actually still there: memory, character, commitments, the stuff that makes the later person the continuation of the earlier one. Those two come apart, and in my experience students can only see it when you make them.

  So: construct me one case, realistic, hospital or care home, no brain transplants, no teletransporters, no sci-fi. In it, the later self is barely continuous with the earlier one — not a shift in taste, an actual rupture — and yet someone who holds the first view says the directive binds in full, and binds for reasons that have nothing whatsoever to do with how much continuity is left. Make the directive a refusal of some treatment, and make the later self's wish a positive request for that same treatment. She's competent. Don't lean on incapacity or on her being confused; that's cheating and it makes the case do no work.

  Constraints: the case itself in one paragraph. The low-continuity fact has to be load-bearing, not decoration, so it has to be something a real person could undergo — religious conversion is worn out, find me something else, or if you insist on it then make it structurally interesting rather than just a change of values. And don't stipulate that she's "not the same person anymore." Show it, let me infer it.

  Then the analysis. (a) What the autonomy story says and why, what the continuity story says and why. (b) Which single feature of the case is doing the work of pulling them apart, and what happens to the disagreement if I take that feature out. (c) The best move available to the continuity theorist to make the case not count — how would they redescribe it? (d) If the autonomy story wins here, what stops it from being a general licence to bind people to their past selves? If nothing does, say so plainly.

  One more thing, briefly at the end: does anything change if the directive was written with a clause to the effect that if she ever asks to revoke it, the asking itself should be read as a symptom and set aside? Two or three sentences on whether that's a legitimate exercise of the earlier self's authority or just bootstrapping.
reasoning: |-
  We are building a case that satisfies the following:
  - Realistic, hospital or care home setting, no sci-fi.
  - Advance directive: refusal of a specific treatment.
  - Later self: competent, requests that same treatment.
  - Later self has very low continuity with the earlier self due to a rupture (not just a shift in taste or values) but without stipulating "not the same person".
  - The rupture must be load-bearing and not just decoration.

  Case Construction:
  Let's create a case of a woman who had a severe traumatic brain injury (TBI) that resulted in significant personality and memory changes, but she has since recovered to a state of competence. The advance directive was written before the TBI, and after the TBI, she has a different set of core memories, values, and personality traits. However, she is now competent and stable in her new state.

  Case in one paragraph:

  Margaret, a 68-year-old former philosophy professor, suffered a severe TBI in a car accident two years ago. Before the accident, she was an atheist with a deep commitment to rational autonomy and a dread of prolonged dependency, leading her to execute an advance directive refusing any life-sustaining treatment if she were ever in a persistent vegetative state or minimally conscious. After months in a minimally conscious state, she unexpectedly recovered but with profound amnesia (losing most autobiographical memories from before the accident) and a radically altered personality: formerly reserved and analytical, she is now emotionally expressive, deeply religious (having converted during her recovery), and values life unconditionally. She is now in a care home, fully competent, and diagnosed with early-stage dementia that may progress. Upon learning that her directive would refuse life-sustaining treatment if she loses capacity again, she explicitly requests to revoke it, stating she now wants all available treatments to prolong her life. Her current physicians note that her personality and core beliefs are stable and consistent with her post-TBI identity.

  Analysis:

  (a) 
  - Autonomy story: The advance directive was made when Margaret was fully competent and informed. Her earlier decision reflects her autonomous choice at that time. The fact that she now has a different view does not undermine the authority of that prior decision. The whole point of the directive is to ensure that her past autonomous self can control future care when she might not be able to make decisions, and this control is not hostage to subsequent changes, even radical ones. Therefore, the directive should be followed, and treatment should be refused as per the directive when the time comes (if she becomes incapacitated again).

  - Continuity story: The binding force of the advance directive depends on the continuity between the person who made the directive and the person now. Here, the TBI caused a rupture: loss of autobiographical memory and fundamental changes in personality and values. The current Margaret does not share the psychological connections (e.g., memories, values, character) with the pre-TBI Margaret. Therefore, the directive does not bind the current Margaret because the person who made the directive is, in a significant sense, no longer present. The current competent Margaret's request for treatment should be respected.

  (b) The feature pulling the views apart: The radical psychological discontinuity caused by the TBI (specifically, the loss of autobiographical memory and the transformation of core personality and values) is doing the work. If we remove this feature (e.g., if Margaret had the same personality and values but just changed her mind about treatment), then the autonomy story would still say the directive binds, but the continuity story might not have a strong reason to deny the binding force because there would still be significant continuity. The disagreement would then be about whether a mere change of mind (without rupture) is enough to break the binding force, which is a different debate.

  (c) The best move for the continuity theorist: They might argue that despite the TBI, there is still sufficient continuity to consider Margaret the same person. For instance, they might point to some persistent traits (e.g., her intelligence, her ability to reason) or to the fact that she has a continuous physical body and social identity. They might also argue that the advance directive was intended for a future state of incapacity, and the current competent Margaret (even if discontinuous) has the right to revoke it because she is now the one who will live with the consequences. However, this move is weak in this case because the discontinuity is so pronounced. A stronger move might be to redescribe the case as one where the directive is being invoked in a context that the earlier self did not anticipate: the directive was for a state of permanent incapacity (like PVS), but now Margaret is competent and making a current decision about future incapacity. They might say that the directive does not apply to revocation by a competent self, regardless of continuity. However, this is not a continuity-based argument but a legal/ethical one about the scope of directives.

  (d) If the autonomy story wins: It would mean that a person can bind their future self even if that future self is psychologically discontinuous and now holds opposing values. This raises the question of what stops this from being a general license to bind people to their past selves. The autonomy story might respond that the conditions for such binding are strict: the directive must be made competently, with full information, and for a specific future scenario (like incapacity). In normal cases without rupture, the continuity is high so the binding is less problematic. But in rupture cases, the autonomy story still holds because the prior autonomy was exercised to protect against exactly such a rupture (e.g., the possibility of changing one's mind due to trauma or disease). However, if the autonomy story wins in this extreme case, it does seem to allow binding a future self that is radically different. The only limitation might be practical: we usually don't have such extreme discontinuities. But theoretically, it does extend to that.

  Additional question:

  If the directive had a clause stating that any request to revoke should be seen as a symptom and set aside, is that legitimate or bootstrapping?

  This clause is an attempt by the earlier self to preemptively dismiss any future revocation. However, it is problematic because it bypasses the current competent self's autonomy. In the continuity view, if the current self is discontinuous, then the clause might be seen as not applying to this new self. In the autonomy view, it might be upheld as part of the earlier self's authority. But it risks being bootstrapping: the directive is making a rule that any challenge to itself is invalid, which is circular and could be used to ignore genuine changes in values. Legally, such clauses are often not upheld because they conflict with the right of a competent patient to make decisions. Ethically, it might be seen as the earlier self overreaching by trying to bind the future self even when the future self is competent and clear-headed. Thus, it is more likely to be considered illegitimate bootstrapping than a legitimate exercise of authority.
answer: |-
  ### Case Construction
  Margaret, a 68-year-old retired architect, executed an advance directive after witnessing her mother’s protracted death from dementia, explicitly refusing antibiotics for any future pneumonia if she developed moderate-to-severe dementia (defined by clinical criteria). Five years later, she suffered a series of strokes causing focal retrograde amnesia, erasing her autobiographical memories and altering her personality: once fiercely independent and pragmatic, she now exhibits childlike dependency, forms obsessive attachments to caregivers, and expresses profound terror of death, despite scoring as competent on standard capacity assessments. Diagnosed with moderate dementia (matching her directive’s trigger), she contracts pneumonia. Her directive mandates no treatment, but she now begs for antibiotics, crying, "I don’t care about dignity—I want to live!" Her neurologist confirms the strokes caused organic personality disruption, with no pre-stroke memories or traits intact beyond basic language and motor skills.

  ### Analysis  
  **(a) The Two Stories**  
  - **Autonomy story**: The directive binds absolutely because Margaret’s pre-stroke decision was autonomous—made competently, voluntarily, and with full understanding of dementia’s implications. Her current wishes are irrelevant; the point of an advance directive is to prioritize past autonomy over future fluctuations, even radical ones. Enforcing refusal respects *her* (past self’s) right to control her future.  
  - **Continuity story**: The directive lacks force because the psychological connections grounding personal identity are severed. Post-stroke Margaret shares no meaningful memories, values, or traits with the person who wrote the directive. The "promise" binds only if the same agent persists; here, continuity is so ruptured that enforcing refusal imposes one person’s will on another. Honoring her current request respects the only extant person.  

  **(b) The Divergence Feature and Its Removal**  
  The load-bearing feature is the **organic disruption of autobiographical memory and core personality** via stroke-induced brain damage. This rupture objectively severs psychological continuity (e.g., no memory of directive drafting, no trace of former values) without invoking sci-fi or incapacity.  
  *If removed*: Suppose Margaret merely changed her mind after mild cognitive decline but retained her memories and personality. The autonomy story still insists the directive binds (past choice trumps present preference). The continuity story, however, would likely concede the directive binds because psychological connections remain intact—the disagreement collapses into whether *any* change of mind nullifies directives (which it typically doesn’t).  

  **(c) Continuity Theorist’s Best Countermove**  
  The continuity theorist reinterprets the case as **still involving sufficient continuity** by emphasizing bodily identity or social/legal unity: "Margaret’s body and legal identity persist, and she maintains basic capacities (e.g., reasoning about immediate needs), so she *is* the same person—just with altered priorities." This reframes the rupture as a values shift, not identity discontinuity, making the autonomy view’s stance seem excessive.  

  **(d) Autonomy Story’s Implications**  
  If autonomy wins, it *does* become a general license to bind future selves—even non-continuous ones—provided the directive was competent and informed. The only restraint is practical: society might reject enforcing directives in extreme discontinuity cases (like this) due to moral discomfort, but *theoretically*, autonomy alone justifies it. This risks "past selves" tyrannizing "future selves" if discontinuity occurs, with no principled stopping point.  

  ### The Revocation Clause Addendum  
  If Margaret’s directive included a clause treating revocation requests as "symptoms" to ignore, this is **bootstrapping, not legitimate authority**. It attempts to immunize the directive against contradiction by redefining competence itself—a circular overreach that denies the future self’s moral standing. Legally, such clauses are often void as they undermine core principles of consent; ethically, they conflate genuine discontinuity with pathology, exposing advance directives to abuse.
