  For requirements, I'll start with non-negotiable ones (like falsifiability, handling contingency), then note aspirational ones (quantification) that might be "physics-envy." The key is the predictive power/agency trade-off — that's their novel's heart. I should emphasize it's a spectrum, not binary. 

