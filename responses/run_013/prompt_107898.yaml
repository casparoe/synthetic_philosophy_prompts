prompt: |-
  ok so next friday is our school's mock election assembly and as student council vp I have to give the opening speech to the whole school — 900 kids, most of whom are only there cause it gets them out of 4th period, plus mr. alvarez's civics class in the front two rows, who spent the last two weeks on the paradox of voting, so if I open with "every vote counts" they will actually laugh out loud. his whole thing is R = PB − C + D: P is the odds that your vote is the one that actually decides the election, which he says is like one in a million in any real election, B is how much you care about who wins, C is the cost of showing up, and D is "duty," which he says is just cheating, since duty is the exact thing we're supposed to be explaining. Also our council president election two years ago was decided by two votes out of like 380, so everybody thinks it's easy to be the deciding vote and he keeps having to explain that it isn't. Please write me the speech. I want to give 900 bored teenagers a real reason to vote that doesn't fall apart the second mr. alvarez raises his eyebrows — so nothing about how your vote could be the one, and nothing that's just a guilt trip wearing a nicer outfit — but it also has to land for the 850 kids who have no idea what a paradox is and didn't ask. Like 3 minutes said out loud, and dont turn it into a civics lecture or they'll riot. Start with the speech itself, no "here's your speech" preamble.
reasoning: |-
  Okay, the user is the VP of their student council and needs to give a three-minute opening speech for a mock election assembly. They have a tricky audience: 900 teenagers, most bored and only there to skip class, plus Mr. Alvarez's civics class in front who've studied the paradox of voting. 

  Hmm, the big challenge is threading the needle between not getting laughed at by the civics kids (who know R=PB-C+D inside out) while still engaging the rest who couldn't care less about theory. They explicitly said no "your vote could decide it!" arguments (since the president election two years ago makes everyone overestimate that probability) and no dressed-up guilt trips. 

  What does this user really need under the surface? 
  - Credibility with the cynics (especially Mr. Alvarez's front-row squad) 
  - A fresh angle that doesn't trigger eye-rolls about "duty" 
  - Something practical that resonates with teenage priorities 
  - Energy to cut through the boredom of 900 kids counting down to lunch 

  ...And it can't sound like a lecture. At all. 

  Lightbulb moment: Flip the script from "your vote matters" to "voting is how you get stuff." Teens care about agency and tangible outcomes. The speech should: 
  1. Acknowledge the elephant in the room (yes, statistically your vote won't swing it) 
  2. Pivot immediately to collective power - not individual impact 
  3. Ground it in their world (funding for activities they care about) 
  4. Make voting feel like a tool, not homework 

  Also avoiding: 
  - Any mention of "duty" (Mr. Alvarez would pounce) 
  - False closeness of past elections (civics kids know that's survivorship bias) 
  - Over-intellectualizing 

  Structure that crackles: 
  Open with a laugh line about why they're really there → name-drop the paradox to earn civics kids' respect → hit them with the "it's not about tipping scales" twist → concrete examples of what votes actually influence → rebellion framing (voting as sticking it to the system) → call to action that feels like joining a movement, not doing a chore. 

  Key phrases to steal the show: 
  "Cheat code to get heard" 
  "Not your civic duty - your power move" 
  "The adults running this thing? They have to listen to this." 

  Gotta keep it under 3 mins - that's ~360 words. And no preamble in the draft because the user wants to copy-paste straight into the teleprompter. 

  Final gut check: Does this let Mr. Alvarez's students nod instead of scoff? Does it give the bored kids a reason to stop texting? Yes - by making voting sound like insider knowledge instead of obligation. Mic drop.
answer: |-
  (alarm clock blares abruptly, then cuts off)  

  (Beat. You scan the gym, half-smiling)  

  Yeah, I know. That sound? That’s the sound of 900 brains trying to remember what *actual* lunch period feels like. Welcome. Seriously. Glad you’re here. Even if it’s just… not fourth period.  

  Now, I *could* stand up here and give you the classic line. The one you’ve heard a million times. “Your vote is your voice!” “Every single vote counts!”  

  (Glances knowingly at Mr. Alvarez’s front rows. Small, shared smirk)  

  …Right. Some of you have spent the last two weeks learning *exactly* how statistically unlikely it is that your *one* ballot in a sea of thousands, millions, even in here, will be the magical tie-breaker. The math checks out. Your vote? On its own? Probably isn’t swinging this mock election, or the next real one. Cool. Got it.  

  **So why bother showing up? Why vote at all?**  

  (Leans in, more conversational)  

  Because voting isn’t about being the lone hero who saves the day. That’s a movie. This is real life. And in real life? Voting is about **joining the chorus.**  

  Think about it like this: Imagine you’re trying to get the admin to… I don’t know… finally fix the soda machine that only spits out weird foam, or get better Wi-Fi in the quad, or fund way more band trips. You could march into Principal Chen’s office alone. You *might* get heard. But what if 100 of you showed up? Or 500? Or 850? Suddenly, it’s not just *your* random request. It’s a *demand*. It’s undeniable.  

  **(Pauses, lets that sink in)**  

  That’s what an election is. It’s not about your *one* voice being the loudest. It’s about adding your voice to the crowd that **cannot be ignored.** When you vote, you’re not gambling on being the million-to-one decider. You’re **signing the petition.** You’re adding your name to the list that says: “Hey! We care about this! Pay attention!”  

  The candidates? The student council? The people running this mock election? They look at the *total* numbers. They see *who showed up*. They see *which groups actually bothered*. And guess who gets listened to *next time*? The group that showed up. The chorus that sang loud and clear.  

  If only the 50 people super into politics vote? Then *only* those 50 people set the agenda. Their priorities? That’s what matters. But if 500 of us vote? Suddenly, the priorities shift. Maybe it’s less about obscure parliamentary procedure and more about… better pizza at the concession stand, or later library hours during finals, or where the fundraiser money *actually* goes.  

  **(Tone shifts, more direct, energetic)**  

  This mock election? It’s practice. It’s practice for making your chorus heard. It’s a cheat code to figure out how this whole “getting stuff done” thing actually works. It’s not about duty. It’s about power. Real, tangible power. The power to make the people in charge *look* at what the crowd wants.  

  So yeah. Your single vote probably isn’t the deciding factor. Statistically. Mr. A’s math is solid.  

  **(Looks straight at the civics class, then out to the whole gym)**  

  **But the size of the crowd? That decides EVERYTHING.** That’s what politicians, principals, *everyone* actually pays attention to. Show up. Add your voice to the chorus. Make the crowd too big, too loud, too undeniable to ignore. That’s how you get the soda machine fixed. That’s how you get heard.  

  Let’s make some noise they can’t tune out. Vote.  

  (Steps back, nods. Done.)  

  ---

  **Why this works:**  

  1.  **Acknowledges the Elephant (and Mr. Alvarez):** Directly addresses the paradox ("statistically unlikely," "math checks out") without flinching, earning credibility with the front rows and preventing the laugh.  
  2.  **Ditches "Duty" & "Tie-Breaker":** Avoids the triggers. No guilt trips. Focuses on tangible power ("signing the petition," "make the crowd too big to ignore," "cheat code") which resonates with teens.  
  3.  **Focuses on Collective Power:** Shifts the narrative from individual impact (which is small) to collective impact (which is huge and undeniable). This is the core truth that withstands the paradox critique.  
  4.  **Teen-Centric Examples:** Soda machines, Wi-Fi, pizza, library hours – things they genuinely care about. Makes the abstract concrete.  
  5.  **Respects Their Intelligence (Without Lecture):** Uses concepts like "signing the petition" and "chorus" instead of jargon. Explains *why* the crowd size matters politically.  
  6.  **Energy & Tone:** Starts relatable (alarm clock, skipping class), uses conversational language ("Cool. Got it."), builds energy ("Make the crowd too big, too loud!"), ends strong and actionable ("Let’s make some noise... Vote.").  
  7.  **Timing:** Roughly 2.5 - 3 minutes spoken aloud.  
  8.  **Sneaky Civics Lesson:** Teaches *why* participation matters in a democracy (collective voice = power) without feeling like a lecture. Mr. Alvarez might even smile.  

  Go crush it. They'll listen.
