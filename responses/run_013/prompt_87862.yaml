  For the trivial end, there's the "Instruction Set" reading: DNA has sequences that code for proteins. That's a platitude - true but doesn't explain replication. Then "Blueprint" is misleading because DNA isn't a static template; it's more dynamic. Maybe useful as a metaphor but false if taken literally. 

  The "Algorithmic Process" reading is more interesting - DNA directs steps like transcription and translation. That's substantive and helps avoid the homunculus by showing automated processes. But it doesn't fully explain self-replication since the cellular machinery is pre-existing. 

  "Self-Replicating Program" is key here - DNA contains instructions to build the machinery that copies it. This is substantive and directly addresses the homunculus problem through recursive self-reference. Von Neumann's universal constructor comes to mind. 

  The most radical is "Universal Turing Machine" where DNA is seen as code executed by the cell's molecular machinery. This is substantive but controversial - cells aren't general-purpose computers. 

  For the Gödel isomorphism claim, the professor might be overreaching. Gödel's trick is about self-reference in formal systems leading to incompleteness, while DNA replication is more about self-copying through biochemical processes. The von Neumann self-replication model is a better fit. 

  I should emphasize that the powerful reading is the self-replicating program one - this truly avoids the homunculus by making the instructions recursive. The Gödel comparison works only loosely as a metaphor about self-reference, but conflating it with DNA misses von Neumann's actual contribution to replication theory. 

  The user suspects some readings are false while others do the heavy lifting - that's correct. I'll flag which metaphors break when pushed (like blueprint) and which are robust. 

