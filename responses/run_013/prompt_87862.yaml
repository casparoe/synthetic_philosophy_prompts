  ok so I'm in this seminar that's half phil of bio and half phil of mind and I need to get my head straight before office hours. the prof keeps dropping "DNA is a program" like it settles how a thing can build a copy of itself, instructions included, with no little guy inside doing the building. next week we're on the typogenetics chapter of Gödel Escher Bach — you know, the toy system where you've got these little strings of symbols that get copied and also interpreted by enzymes they themselves code for — and he says the DNA case and Gödel's self-reference trick are "isomorphic", and clearly thinks that's the deep point of the whole book.

  my problem: I can nod along but I couldnt actually say what any of this is claiming, and I suspect some readings of "DNA is a program" are flat out false while one or two are doing all the work. can you lay the readings out as a menu, from the boring/trivial ones up to the radical ones, and for each say whether it's a platitude, a real substantive claim, or just false — and then say which readings would actually get the prof his conclusion, i.e. explain self-replication without a homunculus. same treatment for "the DNA/Gödel isomorphism": what would it have to mean to be more than a vibe, and is the thing it points at really Gödel's trick or something else? (my suspicion is it's actually about a description that gets both interpreted and copied, which smells more von Neumann than Gödel, but I can't defend that). also flag the readings that are just metaphors that break if you push on them, so I don't say something dumb in front of him. no reading list please, just the menu with verdicts.
