  - Positive: hands on wheels, maps, chosen paths. Focus on agency.  
  - Republican: phantom locks, weight of keys, doors that *could* slam. The unexercised threat.  

  Structure: Three stanzas, each voice owning 5-7 lines. Start with negative (naïve empiricism), then positive (introspective), end with republican (clinching argument). The worker must appear mid-poem as the "hard case."  

