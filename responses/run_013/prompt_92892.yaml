answer: |-
  ## Three Measures of the Door

  The door stands open—see how oft it swings!
  No hand constrains the passage in or out.
  I count the crossings that true freedom brings,
  The hinges silent, free from force or doubt.
  *This space is mine while no one bars the way.*
  *No bolt is shot to halt my chosen stride.*
  *The proof resides in movement, day by day.*

  But who commands the hand that turns the key?
  Whose will directs the path beyond the frame?
  Is impulse sovereign? Or does mastery
  Lie in the self that steers the inner aim?
  *The reins held fast by purpose, clear and deep,*
  *Not circumstance that lets the current sweep.*

  Yet Jude the lathe-man, deft and never chid,
  Whose manager observes with idle grace—
  No order snapped, no liberty forbid,
  Yet moves beneath that unblinking face.
  *No hand is raised, no overt rule applied,*
  *But power hangs, an arbitrary key,*
  *Unused, yet poisoning the space inside.*
  *The door stays wide—but locked by its mere "might-be".*

  **Note:** The negative voice owns lines 1-7, measuring freedom by the door's actual movement ("see how oft it swings!", "count the crossings"). The positive voice owns lines 8-13, focusing on internal control ("who commands?", "who directs?", "reins held fast by purpose"). The republican voice owns lines 14-18, introducing Jude as the hard case and concluding with the core objection: unexercised, arbitrary power ("arbitrary key", "Unused, yet poisoning") makes the unlocked door unfree, as its openness depends solely on the dominator's choice ("locked by its mere 'might-be'").

  ---

  **Form Carrying Argument:**  
  - **Negative:** Concrete, empirical focus ("count the crossings," "hinges silent"), short declarative sentences.  
  - **Positive:** Introspective questioning ("who commands?", "whose will?"), abstract diction ("mastery," "purpose," "aim").  
  - **Republican:** Narrative shift (Jude), complex syntax revealing latent structure ("power hangs," "Unused, yet poisoning"), culminating in the paradoxical final line.  

  **Key Distinctions:**  
  - **Interference vs. Capacity:** Jude suffers no *interference* (no "bolt," "overt rule") but lives under the *capacity* for arbitrary interference ("arbitrary key," "might-be").  
  - **Republican Objection:** The negative view (lines 1-7) sees Jude as free; the republican view (lines 14-18) reveals his domination exists *because* interference is *permitted*, not because it occurs.
