  - Last word: Republican voice gets the final stanza, resolving with "the lockable door" image.  

  Post-poem note must map lines to voices without over-explaining. One paragraph max.  

  Testing the draft: Does the worker example ("Jude the lathe-man...") clearly show domination without interference? Yes—"no hand raised" but "the chain exists." Does the republican conclusion land? The "lockable door" metaphor ties back while transcending the earlier voices.  

