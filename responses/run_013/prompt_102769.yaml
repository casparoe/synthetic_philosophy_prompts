answer: |-
  ### 1. The two accounts in their own terms  
  **Selected-Effects Account:** A trait's function is the effect for which it was evolutionarily selected. This effect historically contributed to the survival and reproduction of ancestors possessing that trait, explaining why the trait exists and persists in the current population. Function is inherently historical and tied to the lineage's evolutionary past. For example, the heart's function is to pump blood because ancestrally, blood-pumping conferred a fitness advantage that led to the heart's fixation in the lineage.  

  **Systemic (Causal-Role) Account:** A trait's function is its current causal contribution to the operation or maintenance of a larger system. This is determined by analyzing the trait's role within the organism's present organization, independent of evolutionary history. For example, the heart's function is to pump blood because, in the circulatory system today, it generates pressure gradients enabling oxygen delivery. Function is defined by real-time system dynamics, not past selection.  

  ---

  ### 2. Translation of the selected-effects account  
  In control-engineering terms: A component’s function is its *design specification derived from failure-mode analysis across generations*. Imagine reverse-engineering a biological system as if it were a device optimized through iterative field testing. The "function" is the critical output parameter whose deviation beyond tolerance limits historically caused system failure (death/reduced fitness), leading to selective pressure for compensatory mechanisms.  

  - **Selection for** maps to **reliability engineering**: A component (e.g., baroreceptor) exists because its output (blood pressure signal) maintained system stability (homeostasis) under ancestral disturbance profiles (e.g., postural changes). Failures (hypotension-induced syncope) defined the "spec" for tolerance bands.  
  - **Lineage history** translates to **cumulative design revisions**: Like a control module’s specs being updated after stress tests, a trait’s function is the setpoint it was tuned to defend across evolutionary iterations.  
  - **Distortion**: Evolution lacks a *designer’s intent*. We must add an *as-if optimization algorithm* (natural selection) acting on population-level error signals (fitness differentials). Historical "selection for" becomes analogous to *identifying which feedback loop parameters reduced mean-squared-error in vital variables over deep time*.  
  - **Gap**: Engineering specs have explicit nominal values; evolution has only *statistical tendency toward local optima*. The "function" is a best-fit inference from failure patterns, not a blueprint.  

  ---

  ### 3. Translation of the systemic, causal-role account  
  In control terms: A trait’s function is its *causal transfer function in the active control loop maintaining a regulated variable*. The system’s current architecture defines the function: e.g., the baroreflex arc’s function is to minimize blood pressure error (ΔBP) by adjusting heart rate (HR) and vascular resistance (R). This requires no history—only block-diagram analysis of the live system.  

  - **Contribution to capacity** maps to **loop gain analysis**: The function is the component’s output contribution to nulling disturbances in a controlled variable (e.g., renal pressure-diuresis stabilizing blood volume).  
  - **"Larger system"** translates to **hierarchical control architecture**: A trait (e.g., renin-angiotensin system) functions as a slow integrator in the volume-control cascade, identifiable via step-response testing.  
  - **No reference to history** aligns with **real-time diagnostics**: Like troubleshooting an unknown circuit by signal injection, function is deduced from perturbation experiments (e.g., sinoaortic denervation revealing open-loop instability).  
  - **Distortion**: Engineering assumes *purposeful design*. Physiology’s "larger capacity" (e.g., fitness) has no direct analog; we insert *assumed system goals* (e.g., "maintain MAP at 90 mmHg") as nominal setpoints. Without history, "function" risks conflating *adaptive* and *pathological* outputs (e.g., ventricular hypertrophy in hypertension).  

  ---

  ### 4. What survives the translation cleanly  
  - **Failure modes ≈ selection pressures**: System crashes (e.g., circulatory shock) cleanly map to fitness costs driving selection.  
  - **Redundancy ≈ backup controllers**: Duplicate pathways (e.g., neural/humoral BP control) reflect robustness against component failure.  
  - **Setpoint defense ≈ homeostasis**: Baroreflex maintaining MAP is identical in both frameworks.  
  - **Transfer functions ≈ causal roles**: Laplace-domain models directly describe systemic contributions.  
  *Justification: These are quantifiable, ahistorical system properties.*  

  ---

  ### 5. What survives with distortion  
  - **"Selected for" ≈ reliability spec updates**  
    *Distortion: Imputes teleology to evolution; selection is reactive, not forward-looking.*  
  - **Evolutionary history ≈ iterative field testing**  
    *Distortion: Ignores genetic drift/contingency; not all traits were "tested" optimally.*  
  - **"Contribution to fitness" ≈ system capacity**  
    *Distortion: Fitness lacks a control-theory analog; we substitute engineered objectives (e.g., setpoint tracking).*  
  - **Adaptation ≈ controller optimization**  
    *Distortion: Assumes optimality where biology shows "good enough" solutions.*  

  ---

  ### 6. What does not survive at all: The residue  
  - **Lineage-specific historicity**: Control engineering lacks a concept of *heritable ancestry*. A component’s "history" in engineering is irrelevant to its current function (e.g., a repurposed transistor). *Verdict: Gap in your vocabulary. Philosophy’s historical specificity adds substance.*  
  - **Non-adaptive traits**: Traits fixed by drift (e.g., neutral mutations) have no "selected effect" but may have causal roles. Engineering assumes all components are functional. *Verdict: Weakness in systemic account—ignores non-adaptive noise.*  
  - **Normativity**: Philosophy debates whether malfunction implies deviation from *historical norms* (selected effects) or *systemic norms* (design specs). Engineering norms are designer-defined; biology has none. *Verdict: Both accounts weaker when stripped of teleology.*  
  - **"Selection for" vs. "selection of"**: Fine distinction (e.g., heart *pumping* vs. *thumping sounds* as selected effect) disappears—engineering cares only about measured outputs. *Verdict: Gap in vocabulary; philosophy’s precision is meaningful.*  

  ---

  ### 7. Which account the translation favors, and why  
  **Bottom line:** The systemic (causal-role) account translates more cleanly, but this is largely artifactual. Control engineering is inherently ahistorical—it reverse-engineers *current* system dynamics, making the causal-role view feel native. The selected-effects account requires grafting evolutionary history onto engineering concepts, introducing distortions like "as-if" teleology. However, this preference reveals a bias: your vocabulary assumes system *purpose* (e.g., setpoints), which the causal-role account implicitly inherits. In reality, biology lacks inherent purpose, making the selected-effects account’s avoidance of teleology more rigorous. The translation favors systemic functions artificially because control theory is synchronic by design, while evolution is diachronic.
