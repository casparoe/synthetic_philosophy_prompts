prompt: |-
  I'm in this small philosophy of mind reading group and last week we did Dennett's Quining Qualia paper — the one where he tries to show that the whole notion of qualia as these ineffable, intrinsic, private, directly-apprehensible feels is basically incoherent. The bit we spent most of our time on was the Chase and Sanborn example: two coffee tasters who've liked the same blend for years, and then one day they both find they don't like it anymore. Each of them could describe it as my taste sensation changed or as my preferences changed, and Dennett says there's no fact of the matter that could settle which description is right, because the alleged qualia are supposed to be ineffable and private and all that. I think I get the basic move, but what I want from you is the most important implications of the argument, assuming it goes through. Not just qualia don't exist — I mean what actually follows for other things we care about.

  Specifically, I'm curious about teh downstream consequences in a few areas: (1) how we should interpret first-person reports in medicine, like when a patient says their pain feels different after a drug, or an anesthesiologist worries about awareness during surgery; (2) whether the argument undermines or actually supports the project of a scientific study of consciousness; and (3) what it does to ordinary talk about what it's like to be someone else, e.g. in debates about animal suffering or AI sentience. I'd also like you to flag any place where the implications seem to cut against Dennett's own intentions, or where the argument might prove too much — like if it also dissolves the distinction between a change in sensation and a change in judgment in cases where we'd normally think there's a clear difference.

  I guess what I'm really after is a concrete list of consequences, not just a restatement of the four criteria or the intuition pump itself. If some of the implications are conditional on accepting Dennett's verificationist leanings, say so. And if you think the Chase and Sanborn case is actually weaker than it looks, I'd be interested in that too, but keep the focus on what follows for the other debates.
