prompt: |-
  I'm a junior and next month I have to give a ten-minute talk to my school's philosophy club and then survive the Q&A. The club is mostly seniors who do Ethics Bowl and Model UN, plus Mr. H who teaches AP Biology and is a hardcore evidentialist and thinks believing anything without enough evidence is basically lying to yourself, Ms. R who teaches world religions and is really into the idea that some commitments have to be made before the evidence is all in, and our debate coach who turns every question into burdens of proof and will definately ask what policy my view implies. I'm defending a view I came up with for the talk that I'm calling the two-key rule: it's okay to adopt a belief before the evidence is sufficient, but only if the question is live, forced, and momentous for you personally, you hold the belief as a provisional commitment you would actually revise if the world pushes back, and you don't use the belief to stop other people from checking the evidence. I'm using it to argue that the strict never-believe-without-sufficient-evidence rule is too harsh for things like trusting a friend, picking a career, or deciding whether to keep the faith you were raised in, but that the James side is too loose if it doesn't come with the revision and non-blocking conditions. I'm not asking for a history of the debate or a reading list, and please no citations, because I can't look anything up during Q&A and neither can the audience, so the prep sheet has to stand on its own.

  Draft my Q&A prep sheet: the eight or so objections I'll actually get from this room, ordered by how likely and how damaging they are, each phrased the way that person would actually phrase it, so Mr. H sounds like a biology teacher who cares about evidence, Ms. R sounds like someone who thinks withholding belief is also a passional choice, and the debate coach sounds like someone who wants a decision procedure. For each objection give me what I should concede up front, a two-minute reply, what I should hold, and a note on where my reply is soft. Include the question I'm hoping nobody asks, and tell me which single objection, if I lose it, kills the whole talk. Also flag any place where my two-key rule is actually two different views stitched together, or where it collapses into just being James or just being Clifford with extra steps. The cases I'll use in the talk are my friend deciding whether to stay in her parents' religion while she's reading a lot of biology, and a debate teammate who trusts a partner's promise without evidence, so use those to make the objections concrete.
