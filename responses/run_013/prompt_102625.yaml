prompt: |-
  I keep running into the same wierd situation on committees and I've never found a name for it, so I'm hoping you can tell me whether there is one.

  Here's the shape of it. Say a department is deciding on a hire. There are three propositions everyone agrees are tied together: we hire this candidate; if we hire her we have to give her the lab space; and we can't give her the lab space and also keep the visiting position. We take them one at a time. Each passes by a clear majority — yes hire, yes give the space, yes keep the visiting position. But the three majority verdicts together are incoherent: they add up to a plan that keeps both the lab space and the visiting position, which the same majority just said is impossible. So we go back and 'fix' it. And here's the part that bugs me. There is no unique fix. We can treat any one of the three as the fixed point and let the other two give way, and every seperate one of those repairs is equally faithful to how we actually voted. Which repair we get is decided by whoever set the agenda or wrote the motion. So the group's real position ends up living in the framing rather than in the votes, even though nobody changed their mind and nobody voted strategically.

  Second instance, same thing: a funding panel where each of the criteria passes individually, but the funded bundle violates the budget rule the same panel endorsed.

  I know this is adjacent to the discursive dilemma / doctrinal paradox literature about groups ending up inconsistent even when every member is individually consistent. But that seems to be about the bare possibility of the inconsistency. What I can't find a word for is the movability — that the inconsistency can be shoved onto any of the linked claims, that all the shoves are equally legitimate, and that the tiebreaker is therefore the order of business and not the votes. Is there a name for that specific thing? How does it sit relative to the discursive dilemma on one side and to plain agenda manipulation or Arrow-style problems on the other? And if nothing established matches, coin a term and tell me its edges: does the phenomenon even need a group, or does the exact same structure show up inside a single person who holds the linked beliefs at once? I don't just want a label, I want to know what the thing is and where it stops.
reasoning: |-
  Okay, the user is describing this recurring situation in committees where they vote on interconnected propositions individually, each gets majority approval, but collectively they're inconsistent. Then they have to "fix" it, but any of the three could be adjusted, and the choice depends on procedural factors like agenda-setting. 

  First, I recognize this as a classic case of the doctrinal paradox or discursive dilemma. But the user already knows that term and is asking about something more specific—the "movability" of the inconsistency. They want to know if there's a name for how the inconsistency can be pinned on any of the propositions depending on procedural choices. 

  Hmm. The doctrinal paradox literature does cover this—it's inherent to the problem that the group can land on different consistent outcomes based on the voting sequence. The user’s "shoving" metaphor is vivid. I recall that List and Pettit call this the "path-dependence" or "agenda-manipulability" aspect of judgment aggregation. But maybe there isn’t a single snappy term for the "movability" itself.  

  They also ask if this exists for individuals. Interesting angle! For a single person, inconsistency might be resolved by belief revision (e.g., dropping the weakest link), but there’s no procedural coercion—it’s about epistemic weight, not agenda order. The group’s version is uniquely messy because the fix is arbitrary and power-driven.  

  The user seems analytically sharp—they’ve spotted how procedural power masquerades as democratic will. Their frustration is palpable. They might be a scholar or a seasoned committee member tired of seeing outcomes hijacked by framing.  

  I should emphasize that this isn’t just Arrow’s problem (which is about preferences, not logical consistency). It’s also distinct from strategic voting since they specified no one’s being strategic. The core is the underdetermination of the "correct" fix.  

  If coining a term: "Aggregation Arbitrage" (playing on exploiting procedural gaps) or "Inconsistency Displacement." But "procedural underdetermination" might be more precise, if clunkier.  

  Where does it stop? Probably at the boundaries of logical interdependence. If propositions aren’t linked, the problem vanishes. Also, if the group uses premise-based voting (mandating coherence first), it’s avoided. But that’s rare in real committees—people love voting on outcomes.  

  … I’ll structure the reply to validate their insight, tie it to formal terms, and flag the power dynamics they’ve noticed. They’ll appreciate the depth.
answer: |-
  What you're describing is a brilliantly clear articulation of a fundamental flaw in sequential majority voting on logically interconnected propositions. It sits at the intersection of judgment aggregation theory, social choice, and procedural fairness. While it's deeply related to the **doctrinal paradox/discursive dilemma**, your focus on the "movability" of the inconsistency *and* the procedural arbitrariness of its resolution highlights a specific, underappreciated aspect.

  ### The Core Problem: Undetermination by Majority Verdicts
  1.  **Logical Interdependence:** The propositions are not independent; they are constrained by logical rules (e.g., `Hire → Lab`, `¬(Lab ∧ Visiting)`).
  2.  **Sequential Majority Voting:** Each proposition is voted on separately, each achieving majority support.
  3.  **Collective Inconsistency:** The majority-supported set `{Hire, Lab, Visiting}` violates the logical constraint `¬(Lab ∧ Visiting)` (implied by the initial assumptions and potentially voted on explicitly).
  4.  **Undetermined Resolution ("Movability"):** There are *multiple* logically consistent subsets of the majority-supported judgments, each obtained by dropping *one* proposition:
      *   Drop `Hire`: `{Lab, Visiting}` (Consistent: no hire means no need for lab or conflict with visiting).
      *   Drop `Lab`: `{Hire, Visiting}` (Consistent: hire but no lab, so no conflict).
      *   Drop `Visiting`: `{Hire, Lab}` (Consistent: hire with lab, visiting position not kept).
  5.  **Procedural Determination:** *Which* consistent subset emerges depends entirely on *how* the inconsistency is resolved procedurally:
      *   **Agenda Power:** Who sets the order votes are taken or reconsidered? Re-voting `Hire` first might lead to dropping it; re-voting `Visiting` first might lead to dropping it.
      *   **Motion Power:** Who drafts the specific motion for reconsideration? A motion "Shall we rescind the Visiting position to fulfill our commitment to the hire?" pushes towards dropping `Visiting`. A motion "Given the lab conflict, shall we rescind the offer?" pushes towards dropping `Hire`.
      *   **Chair's Interpretation:** How does the chair frame the inconsistency and propose solutions?

  ### Established Terminology & Adjacent Concepts
  *   **Doctrinal Paradox / Discursive Dilemma:** This is the *root phenomenon* – the possibility of collective inconsistency despite individual consistency when voting separately on premises/conclusions. Your scenario is a classic instance.
  *   **Path Dependence (in Aggregation):** This describes how the final outcome depends on the sequence of decisions (the "path" taken through the agenda). This captures the procedural arbitrariness aspect. *Your "movability" is essentially the manifestation of path dependence in resolving the inconsistency.*
  *   **Agenda Manipulation:** This is the *strategic exploitation* of path dependence. While you specified no strategic voting, the outcome is *vulnerable* to manipulation by whoever sets the agenda or frames motions, even if they don't act strategically. The *power* resides in the procedure.
  *   **Judgment Aggregation Problem:** This is the broader field studying how to aggregate individual judgments on interconnected propositions into a collective set. The doctrinal paradox is a key result within this field, highlighting the impossibility of satisfying certain desirable axioms (like consistency preservation) simultaneously under simple majority voting on propositions.
  *   **Arrow's Impossibility Theorem (Adjacent, Not Direct):** Arrow deals with aggregating *preferences* (rankings) over outcomes into a social preference, demonstrating the impossibility of satisfying certain fairness axioms. Your problem deals with aggregating *judgments* (true/false) on logically connected *propositions*. Both reveal deep problems in aggregation, but the mechanisms (preference cycles vs. logical inconsistency) and the objects (outcomes vs. beliefs/rules) are distinct.

  ### The Gap & A Proposed Term: Procedural Underdetermination of Resolution
  While "path dependence" describes *why* the resolution is arbitrary, and the "doctrinal paradox" describes *how the inconsistency arises*, there isn't a universally accepted, snappy term *specifically* for the phenomenon you highlight: **the existence of multiple, equally procedurally legitimate ("faithful to the votes") ways to resolve the collective inconsistency, where the choice between them is determined solely by agenda control or motion framing.**

  A precise term capturing this is: **Procedural Underdetermination of Inconsistency Resolution (PUDIR)**.

  *   **Procedural:** The resolution mechanism (agenda, motion wording, chair's role) drives the outcome.
  *   **Underdetermination:** The raw voting results (`{Hire, Lab, Visiting}` all majority-approved) do *not* uniquely determine which consistent subset should result; multiple resolutions are equally compatible with the expressed majorities.
  *   **Inconsistency Resolution:** The specific context is fixing the logical inconsistency revealed by the initial votes.

  ### Where Does This Phenomenon Stop? Its Edges
  1.  **Requires Logical Interdependence:** The propositions *must* be logically connected (implicitly or explicitly). Voting on independent items doesn't create this problem.
  2.  **Requires Sequential Proposition-wise Voting:** If the group votes holistically on complete *packages* (e.g., "Option A: Hire+Lab+¬Visiting", "Option B: ¬Hire+Lab+Visiting", "Option C: Hire+¬Lab+Visiting"), the inconsistency is avoided upfront, and the Condorcet paradox or Arrow-type problems might arise instead. If the group uses a premise-based procedure (mandating consistency on premises, deriving conclusions), the paradox is also avoided.
  3.  **Requires the Inconsistency to Manifest:** If the initial sequential votes happen to be consistent (e.g., Hire passes, Lab passes, ¬Visiting passes), there's nothing to "move".
  4.  **Group Context is Crucial:** This is inherently a **group decision-making phenomenon**. It arises from the *aggregation* of individual judgments via a specific (flawed) procedure. The power dynamics and procedural dependence are central.
  5.  **The Individual Analogue (Where it Stops Being the Same):** Can this happen to a single person? Yes, but the *resolution mechanism* is fundamentally different.
      *   An individual can hold inconsistent beliefs (`P`, `Q`, `R` where `P&Q&R` is impossible). This is cognitive dissonance or simple logical error.
      *   When they discover the inconsistency, they face an *epistemic* problem: which belief to revise? This depends on the *relative strength of their evidence/conviction* for `P`, `Q`, and `R`, not on procedural rules or agenda power. They might feel the inconsistency is "movable" internally ("Maybe I was wrong about P? Or Q?"), but the resolution is driven by internal epistemic weights, not external procedural fiat. The *arbitrariness* inherent in the group's PUDIR (where no resolution has stronger *majority* support than another) doesn't translate directly. An individual *should* (rationally) drop the belief they are least confident in.

  ### In Summary
  You've identified a profound consequence of the doctrinal paradox: **Procedural Underdetermination of Inconsistency Resolution (PUDIR)**. While the doctrinal paradox shows inconsistency *can* arise, PUDIR highlights that once it does, *the "will of the majority" offers no unique guide to fixing it*. Multiple repairs are equally faithful to the *individual votes cast*. Consequently, **power over the procedure (agenda setting, motion drafting, chair's interpretation) becomes the decisive factor in determining the substantive outcome, even with sincere voting.** This power operates in the gap created by the underdetermination revealed by the initial majority verdicts. It's a stark reminder that *how* a group decides is often as important as *what* the individual preferences are.
