prompt: |-
  Im working on a feature about AI companion apps and I keep getting stuck on the same thing. The users I interview talk about their bots like they have real feelings — "she gets me," "he was annoyed at me yesterday" — and honestly some of the chat logs read that way too. My editor says just write it straight: if the model reliably produces the comforting response, calling it "wanting to help" is basically accurate and readers will get it. A philosopher I ran this by says that's exactly the trap — the thing has no beliefs, and I'd be misleading people if I wrote it that way. Then the company drops one of those interpretability posts saying they found a direction inside the model that lights up when it's steering the conversation toward wrapping up, and my editor says see, there's the "want" right there in the weights. I honestly can't tell whos right anymore. How should I write this?
