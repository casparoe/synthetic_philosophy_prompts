answer: |-
  ### Exam Paper: English Literature & Philosophy (Final Year / MFA)  
  **Module Title:** Blame, Guilt and the Novel  
  **Time Allowed:** 1 hour  
  **Instructions:** Answer the question below. Support your argument with close analysis of P.F. Strawson’s "Freedom and Resentment" (1962) and the fictional scenario provided.  

  ---

  ### Question  
  > Consider the following character: A man who, convinced by determinist arguments, deliberately adopts Strawson’s "objective attitude" universally—treating all persons (including himself) as objects to be managed, not participants in moral dialogue. Despite this intellectual commitment, he is later overwhelmed by visceral resentment when betrayed by a close friend.  
  >  
  > Drawing on Strawson’s distinction between the *reactive* and *objective* attitudes, analyse:  
  > (a) Whether the character’s resentment *vindicates* Strawson’s participant stance, or merely reflects a psychological limitation.  
  > (b) What this case reveals about Strawson’s claim that *particular* facts (e.g., mental illness) can exempt individuals from reactive attitudes, while the *general* fact of determinism cannot.  
  > (c) If resentment, in such a context, implies "responsibility" in a sense that survives determinism.  

  ---

  ### Model Answer (Approx. 600 words)  
  Strawson’s "Freedom and Resentment" argues that moral practices like blame and resentment are grounded not in metaphysical free will, but in non-rational, human "reactive attitudes" essential to interpersonal relationships. His core asymmetry holds that *particular* exemptions (e.g., psychosis, childhood) dissolve these attitudes by revealing agents as unfit for moral dialogue, whereas the *general* truth of determinism is inert because it cannot alter our natural commitment to participation. The fictional case tests this asymmetry sharply.  

  **(a)** The character’s resentment is a *qualified* vindication of Strawson. Strawson insists reactive attitudes are constitutive of ordinary human life; they are not elective postures but psychologically ingrained responses to perceived agency. The character’s lapse into resentment despite his intellectual project demonstrates this *inescapability*, affirming Strawson’s view that the participant stance is our "natural human commitment". However, it also exposes Strawson’s quiet naturalism: resentment here is a *fact* of human psychology, not proof of its rational necessity. A determinist might argue the character’s reaction is merely hardwired, not evidence of "fittingness". Strawson would counter that the attitude’s fittingness depends on context (here, betrayal by a perceived moral agent), not its causal origins.  

  **(b)** The case illuminates Strawson’s asymmetry. The character *tries* to treat determinism as a universal exempting condition—akin to insanity—applying the objective attitude wholesale. Yet his failure shows why Strawson rejects this: determinism, being universal and abstract, lacks the power of *particular* exemptions to reframe specific agents as non-participants. Betrayal thrusts the friend back into the role of intentional wrongdoer, reactivating the reactive attitude. Crucially, Strawson’s exemptions work by *disqualifying* individuals from moral dialogue (e.g., the insane lack normal agency). Determinism, by contrast, leaves interpersonal dynamics intact—everyone remains a "normal" agent. The character’s programme collapses because he cannot *live* determinism as an exempting fact; it alters no actual relationship.  

  **(c)** The resentment implies responsibility in Strawson’s *practical* sense: not "contra-causal freedom", but answerability within human relationships. The betrayer is held responsible *as* a participant whose actions express attitudes that damage trust. Determinism is irrelevant here; what matters is whether the agent inhabits the normative space of reasons. Strawson’s framework survives determinism because responsibility is redefined as *susceptibility* to reactive attitudes in contexts of recognised agency. The character’s resentment, while psychologically involuntary, is fitting (and thus responsibility-implying) because it responds to a moral injury perpetrated by a competent agent. It is not proof of transcendental freedom but of inescapable social practice.  

  In sum, the character embodies Strawson’s argument: the objective attitude cannot be universally sustained because reactive attitudes undergird moral life. Yet the case also hints at a tension—if resentment is merely natural, not rationally justified, does Strawson’s "fittingness" covertly reintroduce metaphysics? His account holds only if we accept that our practices require no deeper vindication.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Five must-hit points** (Award marks per section; total = sum ÷ 5 for final /20 score).  

  | **Criterion** (Marks per section) | **A-Grade Response** | **Common Errors** (Marks lost for vagueness/missteps) |  
  |-----------------------------------|----------------------|-------------------------------------------------------|  
  | **1. Explains Strawson’s asymmetry** (4) | Clearly distinguishes *particular exemptions* (remove reactive attitudes) vs. *determinism’s irrelevance* (does not). Notes exemptions require specific agential deficits (e.g., delusion). | **Fluff:** Conflates exemptions with excuses (e.g., "he couldn’t help it"). Misses that exemptions *disqualify* from moral dialogue. (‑2) |  
  | **2. Analyses resentment’s role** (4) | Argues resentment *vindicates* participant attitudes as psychologically inescapable *and* normatively fitting in context. Links to Strawson’s "natural human commitment". | **Fluff:** Treats resentment as purely instinctive (ignores "fittingness") or as *automatic* proof of responsibility (‑3). |  
  | **3. Character’s failure & asymmetry** (4) | Shows character’s attempt to universalise determinism *as an exemption* fails because determinism lacks power to reframe agency in *specific* relationships. | **Fluff:** Claims character’s lapse is "hypocrisy" or mere weakness, not structural to attitudes (‑2). Ignores betrayal’s role in reactivating participation (‑1). |  
  | **4. Responsibility "after determinism"** (4) | Identifies Strawsonian responsibility as *practical answerability* within relationships, distinct from libertarian freedom. Uses "susceptibility to reactive attitudes". | **Fluff:** Reverts to "free will" debates or calls responsibility an illusion. Fails to define Strawson’s positive view (‑3). |  
  | **5. Critical edge** (4) | Notes tensions: e.g., whether Strawson’s "naturalism" risks reducing attitudes to psychology, or if "fittingness" smuggles in normativity. | **Fluff:** Uncritically endorses Strawson; or dismisses him via determinism without engaging his arguments (‑2). Superficial treatment (‑1). |  

  **Grade Boundaries:**  
  - **A (17–20):** Hits all 5 points; precise on asymmetry/fittingness; uses scenario to probe Strawson’s limits.  
  - **B (13–16):** Solid on asymmetry/responsibility but vague on fittingness; may miss how character’s programme fails structurally.  
  - **C (9–12):** Describes Strawson but confuses exemptions/excuses; reduces resentment to psychology; tangential on responsibility.  
  - **D/F (0–8):** Misrepresents Strawson; ignores question/scenario; deterministic free will debates dominate.  

  ---  
  **Glossary for markers:**  
  - **Exemption:** Agent *cannot* participate in moral dialogue (e.g., child, psychotic).  
  - **Excuse:** Agent *could* participate but had mitigating reasons (e.g., coercion).  
  - **Fittingness:** Whether a reactive attitude is *appropriate* to the context of agency (Strawson’s normative hinge).  

  **Pedantry Note:**  
  - British spellings enforced: e.g., "behaviour", "programme", "grey area".  
  - "Towards" not "toward"; "grounded in" not "based on".  

  Let me know if you'd like adjustments to the character scenario or tighter focus on novelistic examples. Good luck trapping those regurgitators!
