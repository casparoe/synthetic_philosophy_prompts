prompt: |-
  I'm a software engineer with no background in philosophy or history, and I'm leading a book club discussion of Bernhard Schlink's novel The Reader (the 2008 film is fine to bring in). I want a critical reading of Hanna Schmitz through the debate between Christopher Browning's Ordinary Men and Daniel Goldhagen's Hitler's Willing Executioners: whether people like her killed because of situation, authority, and gradual brutalization, or because they already wanted to and the regime merely licensed it.

  Hanna is a hard case for both sides, which is why I want the reading. She is not a fanatic and not obviously an antisemite; the novel accounts for her guard service and her conduct on the death march through illiteracy, shame, a horror of exposure, and a rigid, nearly bureaucratic sense of duty. That is a fourth kind of explanation, neither situational nor ideological: a private, self-protective motive that happens to make her useful to a genocidal machine. I want you to say whether that explanation is coherent and what it costs. Does the novel, by handing Hanna a secret that makes her pitiable, buy the reader's sympathy at the expense of the victims, who are kept almost entirely off-stage? Or does it indict her further, since she took the job precisely because it let her hide? Then apply Browning's own test to the book: the one time the commander of a police battalion offered his men the chance to step out of a mass shooting, fewer than a dozen of five hundred took it — does The Reader leave any room for refusal, or does it stage a world in which refusal was simply unavailable, and is that a finding about the past or a convenience of the fiction? Finally, what does the novel add to this argument that the historical evidence alone can't settle?

  Be faithful in both directions: don't reduce the novel to an illustration of either thesis, and don't soften either thesis to fit the novel. Say plainly where the novel resists your reading. Don't cite anything — I can't check references and don't need them.

  Format: one sentence stating your verdict at the top, then the argument, no more than 700 words total, and no plot summary beyond what the argument requires.
