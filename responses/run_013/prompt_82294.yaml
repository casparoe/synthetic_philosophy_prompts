prompt: |-
  ok so me and my friend have to do this ethics-class debate thing about AI safety and we got in a huge fight about worst case vs average case and i want an actual number from you, not a wishy washy "it depends." here's what i want a credence on — actually two claims, i want a number for each:

  (A) the descriptive one: for a current frontier AI model, doing great on the average case (typical users, typical inputs, the stuff it was tested on) tells you almost nothing about how it does in the worst case (someone actively trying to get it to do the bad thing, or the model itself drifting into some weird corner of its behavior space where its optimizing for something you never intended). basically the two are close to uncorrelated, so knowing one barely updates you on the other.

  (B) the normative one: given something like (A), when we call a system safe we should be aiming at worst case guarantees and not average case ones, even if that means way slower progress, way more paranoia, and never getting a clean "it passed" answer.

  give me 0-to-1 for each and then decompose it — the sub questions, a rough probability for each, how they combine into the final number. at minimum i think it has to include: how much of the real risk from AI is adversarial/optimizing pressure vs just normal mistakes and distribution shift; whether average case testing is even evidence about worst case (does passing evals update you at all); whether "worst case" is even a coherent target for something with basically infinite possible inputs or if it just collapses into "anything could happen" which is useless; and whether being a worst-case person has costs that make you worse off (like you demand impossible guarantees so nobody ships anything, or everyone stops listening to you). and one more thing i keep getting confused on — does it matter whether the worst case is over inputs a user types, vs over what the model is aiming at inside its own head, vs over stuff that happens during training? those seem like three totally different worst cases and i dont know if they deserve the same number. add whatever else you think belongs.

  my number on A is like 0.35 and my friend is at 0.9, and honestly i cant tell if we actually dissagree about the facts or if we just mean different things by worst case. so also tell me: which sub question does our disagreement most likely live in, which single term is your final number most sensitive to, and what would move it the most. if you think the two claims are too tangled up to split, say so but still give me numbers.
