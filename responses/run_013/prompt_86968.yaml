  We are designing a game activity for a working group that combines philosophy-of-science students and computational neuroscience researchers. The goal is to illustrate that identifying an anomaly and defining the sameness of mechanisms are intertwined, and that different criteria for mechanism identity (structural, functional, input-output) can lead to different conclusions in edge cases.

  Activity Design: "Mechanic's Dilemma"

  Overview:
  - Three teams (each 4-5 players) are maintenance crews for what they believe are identical machines (in terms of input-output behavior). Each team has a physical board representing a circuit with 6-8 nodes and directed links. The boards are wired differently but are behaviorally equivalent on the standard inputs (until anomalies or interventions occur).
  - The machines are deterministic and discrete. Each node holds a binary state (0 or 1). The machine runs in discrete steps. At each step, the value of a node is updated based on its inputs and a simple rule (e.g., AND, OR, XOR, etc. for the gates). The boards are designed so that for a set of predefined input sequences, they produce the same output sequence.
  - However, the internal wiring varies:
      - Team A: A standard circuit with no redundancy.
      - Team B: A circuit where one node (say, node X) in Team A's circuit is replaced by a two-node sub-circuit (so the function of X is computed by two nodes in Team B).
      - Team C: A circuit with redundancy (two paths to the same output, so that cutting one path doesn't change the output for some inputs).

  Materials per team:
  - A board (poster or cardboard) with nodes (circles) and directed arrows (edges).
  - Tokens (two colors) to represent 0 and 1 at each node.
  - The rule set for each node (each node has a function: e.g., AND, OR, NOT, etc.). The rules should be written on the board or on a separate sheet.
  - A set of input nodes (with tokens) and output nodes (which they must read).
  - Tools for interventions: paper clips or sticky notes to "cut" a link (cover the link so it doesn't work), pin a node to a value (fix the token to 0 or 1), and maybe a way to add load (which we might simulate by changing a node's rule?).

