answer: |-
  ## For the Third Party

  Good morning. We’re gathered here by the water, below the old lock, to remember. To place this stone for something missing.

  This river – it’s seen generations. Seen locks built, valleys drowned, families like those in my novel rooted deep in its bends. It’s seen traffic: boats, logs, people, fish. And it’s seen quieter lives, lives anchored deep in the gravel. Lives like the one we’re here for today.

  The plaque names a mussel. A freshwater mussel that isn’t here anymore. That’s the simple, hard fact that brought us together. Gone.

  But simple facts, especially about life in the water, aren’t always simple. If you’ve fished this river, paddled it, lived beside it your whole life, you know. Things change, appearances deceive, the water hides as much as it reveals. And naming a creature? Giving it a box to live in, scientifically? That can be… slippery.

  I’ve learned, preparing for this, that the experts – the people who dedicate their lives to understanding creatures like this mussel – don’t always agree on exactly *what* it was they were understanding. Was it defined by how it looked? By the niche it filled in the riffles? By its unique lineage? Depending on the lens you use, the picture changes. A creature can vanish from the lists, reappear under another name, vanish again… all without a single new shell washing up on the bank. The year on this plaque? It marks a decision made with the best knowledge available at a difficult time, not necessarily the final heartbeat. For some, that’s unsettling. It feels like the ground shifting under our grief.

  But here’s the other thing I learned, just as powerful: another way to see a species is not as a category, a box on a chart, but as a singular story. A unique thread woven through time. Like an individual organism stretched out over generations. *This* particular lineage, born in *this* river, playing *this* role, interacting in *this* specific way. Not just a kind of mussel, but *this* mussel – this continuing character in the river’s long story.

  And that perspective turns loss into something different. Not just the erasure of a category, but the death of a distinct player. The end of a specific story that began millennia ago in this very current. It makes the plaque feel less like a label and more like a headstone.

  This mussel’s story was particularly intricate. It needed a partner. As a tiny larva, it couldn’t just drift. It had to clamp onto the gills of one particular kind of fish – a fish that still swims in this river today. And the adult mussel, rooted for life in the gravel? It couldn’t chase its partner down. So, it evolved a remarkable lure. A flap of its own flesh, shaped and twitched in the current exactly like a little minnow. A perfect, shimmering lie to tempt the right fish close. Think of that. An animal that couldn’t move, crafting motion. An animal anchored, casting illusion to summon its future.

  The fish is still here. We see it. The minnow? Well, the minnow-shaped lure isn’t a minnow, never was. But the *trick* – that clever, necessary deceit – that potential is still written in the river’s memory, still possible. It’s just… unemployed.

  What’s gone is the third party. The creature that *made* the lure. The creature that *needed* the fish. The anchor point for that whole intricate dance. The fish swims. The minnow-shaped ghost-flicker exists as an idea, a potential pattern. But the orchestrator, the *reason* for it all? That’s what vanished. That’s the silence we mark.

  So, why this bench? Why this plaque? For the donors, the volunteers, the neighbours who remember a different river: it names a real loss. A hole. Something tangible that was here, part of the water’s work, part of the life grandfathers saw and harvested, and now is not. It’s a marker for grief that needs no qualification. This creature, by whatever name you knew it or didn’t, is gone from this bend.

  For the scientists, especially those who wrestled with its name, its boundaries: this bench isn’t about pinning down a definition. It’s about acknowledging the death of a unique trajectory. A specific, irreplaceable way of being in this water that stopped. The arguments about classification are vital, necessary work. But the *absence* we feel today? That’s different. It’s the silence after a very particular song ceased.

  We mourn the third party. The rooted one who cast the shimmering lie. The one who bound the fish and the mimicry into meaning. We mourn a singular story that this river stopped telling. The year on the plaque may be a snapshot of understanding, but the emptiness it points to is vast and enduring.

  This stone sits facing the water. Look at it. See the riffles where it lived. See the fish that was its partner. Imagine the minnow-shaped lure flickering, unanswered, in the current. And feel the space where the maker belonged. That space is real. That loss is absolute. This bench is for the silence where there was once a unique conversation between stone, flesh, water, and fish. Let it be a place to remember the intricate, necessary lie, and the rooted truth that told it. Let it be a place to honour the third party. Gone.
