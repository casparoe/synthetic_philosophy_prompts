answer: |-
  ## The Dispute, Stated Precisely

  The dispute centers on whether Quinean naturalism entails continuity between epistemic and moral norms. Your friend contends that Quine's core doctrines – the rejection of first philosophy and the continuity of epistemology (hence normativity) with empirical science – logically extend to moral discourse. On this view, moral claims, like epistemic ones, are hypotheses within the web of belief, assessed instrumentally for their efficacy in serving our practical and theoretical aims. Denying this continuity, your friend argues, betrays Quinean naturalism by arbitrarily excluding ethics. You counter that Quine's position implies a principled distinction. While epistemic norms (like induction) are instrumental tools validated *within* scientific practice for achieving predictive success, moral norms resist analogous naturalized validation. The core question is whether Quine's instrumental justification for epistemic norms can be coherently applied to moral norms without collapsing into a form of non-naturalism about ends or abandoning normative force altogether. The asymmetry you suspect hinges on the independence and nature of the "ends" served.

  ## What Quine is Actually Committed To

  Quine’s naturalism dissolves traditional epistemology into empirical psychology: studying how sensory input leads to theoretical output. Norms of reasoning are not *a priori* dictates but empirically studied patterns of successful practice. Their normative force is instrumental: they are vindicated as effective means for our core scientific aims – predicting experience and controlling our environment. "Good" inference is what reliably yields successful prediction. Crucially, this aim (prediction/control) is *internally generated* by the scientific enterprise itself; science is judged by its own standards.

  Regarding ethics, Quine was consistently dismissive. He saw moral discourse as fundamentally different from scientific discourse. Moral judgments, he suggested, lack the kind of empirical content or predictive power characteristic of scientific claims. They are more akin to expressive or prescriptive utterances ("Hooray!"/"Boo!"), not assertions about an objective moral reality. While the *practice* of making moral judgments is a natural phenomenon explicable by psychology, sociology, or evolutionary biology, Quine rejected the idea that moral claims themselves have truth values assessable by scientific methods. He distanced himself from expressivism as a developed theory but leaned towards viewing ethics as non-cognitive. Crucially, he saw no way to naturalize moral *truth* analogous to how epistemic norms are naturalized instrumentally. The ends served by morality (e.g., social cohesion, flourishing) were, for Quine, either too vague or too detached from the core empirical aim of prediction to allow a similar instrumental validation within science. Norms of conduct are describable habits; norms of inference are instrumentally validated tools for science's self-defined task.

  ## The Parity Argument, at Full Strength

  Your friend's parity argument is powerful. Quine demolishes the analytic/synthetic distinction and first philosophy. All inquiry, including epistemology, is within the web of belief. Justifying epistemic norms involves showing they are effective instruments for achieving our goals within this web – primarily predictive success. But why stop there? Humans clearly have complex social and practical goals beyond mere prediction: survival, cooperation, minimizing suffering, flourishing. Morality appears precisely as a set of norms instrumental for navigating this social world and achieving *these* ends.

  Science, as part of naturalized inquiry, *can* empirically investigate which moral norms best serve these ends: Does honesty foster trust and cooperation better than deceit? Does a norm of reciprocity enhance group survival? Does a particular conception of justice promote stability? This empirical assessment parallels the assessment of inductive norms: we observe which norms lead to more successful outcomes relative to desired ends. The ends themselves (survival, cooperation, well-being) are as empirically observable and evolutionarily explicable as the desire for predictive control. Rejecting this continuity seems arbitrary: if science validates induction as a tool for prediction, it can validate honesty as a tool for cooperation. To deny this is to implicitly resurrect a special status for epistemic norms, violating the spirit of naturalism. It suggests a lingering commitment to a "first philosophy" that privileges theoretical reason over practical reason without naturalistic grounds. If naturalism means no external vantage point, then *all* norms we use must be assessed internally by their contribution to our overall web of aims, which demonstrably includes social and practical goals alongside predictive ones. Dismissing ethics as merely expressive, while taking epistemic norms as instrumentally validated, appears inconsistent within the naturalistic framework Quine championed.

  ## Where the Parity Breaks

  The parity breaks at the point of *end specification* and the *self-referential nature* of scientific inquiry.

  1.  **The Fixed and Internal End of Science:** The instrumental justification of epistemic norms relies on a specific, uncontroversial, and *internal* end: predictive and manipulative success concerning sensory experience. This end defines science itself. Crucially, science provides the *methods* and *evidence* for assessing success *relative to this very end*. Success (accurate prediction) is empirically verifiable *using the norms being assessed*. The loop is closed internally. Epistemic norms are tools validated *by science, for science's own constitutive purpose*.
  2.  **The Problem of Moral Ends:** In contrast, the ends morality serves (well-being, justice, flourishing) are not the constitutive purpose of natural science. While empirically describable as human desires or evolutionary outcomes, *which specific ends should be promoted* is itself a normative question. Science cannot empirically determine that "survival" or "cooperation" *ought* to be the ultimate aim without smuggling in a prior normative commitment. Should we maximize aggregate happiness? Prioritize individual rights? Promote survival at all costs? Science can tell us *how* to achieve these ends, but not *which* ends we *should* adopt as fundamental. These ends lack the fixed, constitutive, and self-validating status of predictive success within science.
  3.  **Lack of Self-Validation:** Attempting an instrumental validation of a moral norm (e.g., "Honesty promotes social stability") requires assuming the normative value of the end (stability). Science can investigate the causal link but cannot empirically prove stability is *good*; that requires a prior normative stance. Unlike predictive success, whose "goodness" is inherent to the scientific enterprise (prediction *is* what science seeks), the "goodness" of stability is external. There's no internal scientific loop to validate the fundamental ends of morality. Assessing moral norms instrumentally *presupposes* the normative authority of the ends, which science cannot ground without circularity or regress. The result is either:
      *   **Descriptivism:** Treating moral norms purely as describable practices, stripping them of normative force ("People *use* honesty to seek stability").
      *   **Hypothetical Imperatives:** Only validating norms *if* one already accepts a specific end ("*If* you value stability, *then* honesty is good"), which doesn't ground the end itself.
      *   **Smuggling In Non-Naturalism:** Illegitimately assuming the objective normative status of certain ends from outside naturalism.

  The disanalogy lies in science's unique ability to self-validate its core instrumental norms against its own constitutive, empirically assessable aim. Morality lacks a single, constitutive, empirically self-validating aim analogous to prediction. Its fundamental ends remain contestable in a way science's core aim is not (within the naturalistic framework). Quine's dismissiveness stems from seeing no naturalistic path to validate the *ends* that would allow instrumental validation of moral *norms* to carry the same force as the instrumental validation of epistemic norms *for science*. Convergence in science is driven by shared sensory input and the fixed goal of prediction; convergence in ethics falters on the lack of fixed, shared, empirically verifiable fundamental ends.

  ## My Verdict

  Quine's naturalism *can* underwrite a defensible asymmetry between theoretical and practical norms, but it is a limited and ultimately deflationary one. The asymmetry rests on the self-contained, self-validating nature of scientific inquiry regarding its constitutive aim of prediction/control. Epistemic norms are vindicated as instruments *by science, for science*. This provides a robust, naturalized internal normativity for reasoning within the scientific enterprise.

  Moral norms lack this foundation. While *practices* can be described empirically and *instrumental links* (means to assumed ends) can be studied, the fundamental ends of morality cannot be similarly validated within naturalism without presupposition or circularity. Naturalism allows us to describe moral discourse and explain its origins, but it cannot ground the *normative authority* of moral ends or the truth-aptness of moral claims in a way parallel to epistemic norms. Quine is consistent in his naturalism by restricting full instrumental vindication to norms serving science's internal aim. However, this verdict makes Quinean naturalized epistemology's normativity narrower than often assumed – it's normative *for science*, not necessarily a universal theory of rationality. It also leaves ethics fundamentally non-cognitive or, at best, only hypothetically normative relative to ends we happen to have.

  I am moderately confident (70%). This asymmetry explains Quine's position without attributing inconsistency or covert traditionalism. What would change my mind? A compelling Quinean demonstration of how fundamental *moral ends* can be empirically selected and validated with the same self-contained rigor as the end of predictive success, without recourse to question-begging or extra-natural assumptions. Currently, the burden seems unmet.

  ## What I Should Have Said to My Friend

  "Look, science works because its core job – predicting what we'll see and do – is something it can check *itself*. It can test its own rules (like induction) by seeing if they *actually* lead to better predictions. Ethics tackles stuff like 'what's good' or 'what's fair.' Science can study *how* rules like honesty affect things like trust, but it can't prove trust *should* be the ultimate goal without already assuming it's good. That starting point – the fundamental 'should' – is where science hits a wall that it doesn't hit with its own prediction game. Quine saw that wall."
