prompt: |-
  You are a philosopher working at the intersection of naturalized epistemology and metaethics, with a strong command of Quine's systematic views and of the attempts to reconstruct what he thought about ethics. Think carefully and at length before you begin: start by brainstorming the candidate readings of Quine's attitude toward moral discourse and the objections each reading invites, then discard the readings that make his position either trivially inconsistent or trivially safe. You have no web access; do not cite sources, do not supply a bibliography, and do not put quotation marks around anything. If you attribute a doctrine to Quine, state it in your own words and make clear which themes you take it to rest on. Do not spend time reciting the standard menu of metaethical positions — expressivism, error theory, Cornell realism — except where a specific position is genuinely needed to make a structural point.

  I have just spent three hours arguing with a friend about Quine and ethics, and I want a written treatment I can send him. The dispute was this. My friend says Quine's naturalism is a package deal: once you accept that epistemology is continuous with empirical science and that there is no first philosophy empowered to legislate for inquiry from the outside, you have also accepted that moral inquiry is continuous with empirical science, so moral claims are to be assessed the way any other claims in the web of belief are assessed — by how well they serve the purposes we use them for. On his reading there is no principled reason to treat the norms of reasoning differently from the norms of conduct, and Quine's dismissiveness about moral truth is therefore a failure of nerve rather than a consequence of his naturalism. I take the opposite line: I think something in Quine's position distinguishes the two, and I want to know whether I can defend that without smuggling in a piece of traditional philosophy that Quine would have rejected. The point I keep returning to, and which I would like you to stress-test, is the asymmetry between two ways of naturalizing a norm. One way treats the norm as a describable habit or practice, explained by psychology and sociology, with no question of correctness left over. The other treats the norm as an instrument assessed by how well it serves an end, where the assessment is itself a piece of empirical reasoning — engineering, in Quine's sense, rather than first philosophy. If the second way is legitimate for norms of inference, it looks legitimate for norms of action too, and my friend wins. If it is not legitimate even for norms of inference, then Quine's naturalized epistemology carries less normative content than his admirers suppose, which is a different problem. I suspect the resolution lies in whether the end being served is fixed independently of the norm being assessed, but I have not been able to make that thought do the work I need it to do.

  Write the essay with these sections, in this order, using these headings:

  1. "The dispute, stated precisely" (about 200 words). Set out the two positions as claims about what naturalism commits you to, without attributing to either side anything it need not hold.
  2. "What Quine is actually committed to" (about 400 words). Reconstruct his position on moral value and on the status of norms, in your own words, flagging where you are extrapolating rather than reporting.
  3. "The parity argument, at full strength" (about 500 words). Give my friend's case as well as it can be given, including the strongest version of the claim that epistemic and moral norms stand or fall together.
  4. "Where the parity breaks" (about 500 words). Either show the disanalogy or concede that there is none and say what follows. Be specific about which feature of epistemic norms — their relation to prediction, to error correction, to disagreement, to the possibility of convergence — is supposed to do the work, and whether that feature survives scrutiny.
  5. "My verdict" (about 300 words). Reach a conclusion about whether Quine's naturalism can underwrite a defensible asymmetry between theoretical and practical norms; state how confident you are and what would change your mind.

  Then add a final short section titled "What I should have said to my friend" (about 150 words), written in plain speech, containing the one or two sentences I could actually have used in the argument.

  Do not end on a survey of open questions. Take a side. If the most defensible verdict turns out to be one neither my friend nor I held, say so and explain why it beats both of ours.
