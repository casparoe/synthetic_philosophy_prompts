answer: |-
  Below is a decision tree designed to navigate the realism debate on representations in neural networks. It uses concrete cases as diagnostic questions, with branch nodes answerable without prior knowledge of philosophical labels. The tree leads to six distinct positions, each defined by a unique combination of answers. Leaves specify the position, its most awkward commitment, and how it treats representation. Unoccupied branches and limitations are noted.

  ### Decision Tree
  1. **Does the presence of a feature that fires reliably on a specific entity and is read by a downstream circuit (Case 2) imply the network has a representation of that entity?**
     - **Yes** → Go to 2.
     - **No** → Go to 3.

  2. **If a probe decodes a concept but its removal leaves network behavior unchanged (Case 1), was the representation causally inert?**
     - **Yes** → Go to 4.
     - **No** → Go to 5.

  3. **Is an attribution of representation valid only relative to an observer's chosen task (Case 5)?**
     - **Yes** → **Instrumentalism** (Leaf A).
     - **No** → **Eliminativism** (Leaf B).

  4. **If a network computes identical input-output functions with a different internal code (Case 3), are representations preserved across both implementations?**
     - **Yes** → **Non-Causal Functionalism** (Leaf C).
     - **No** → **Epiphenomenal Realism** (Leaf D).

  5. **Can a human-readable algorithm be recovered from the weights (Case 4) without relying on observer goals?**
     - **Yes** → **Strong Representational Realism** (Leaf E).
     - **No** → **Causal Role Realism** (Leaf F).

  ---

  ### Leaves (Positions)
  **Leaf A: Instrumentalism**  
  - **Most awkward commitment**: Representations exist solely as pragmatic tools for observers, even if the network has no internal structure supporting them.  
  - **Represents as**: Observer-relative fiction.  

  **Leaf B: Eliminativism**  
  - **Most awkward commitment**: Even clear cases of features with downstream readouts or recovered algorithms are dismissed as non-representational.  
  - **Represents as**: Fiction (to be eliminated from scientific discourse).  

  **Leaf C: Non-Causal Functionalism**  
  - **Most awkward commitment**: Representations retain their identity across different implementations (e.g., Case 3) even if causally inert (e.g., Case 1).  
  - **Represents as**: Causal role (but with causal efficacy decoupled from functional identity).  

  **Leaf D: Epiphenomenal Realism**  
  - **Most awkward commitment**: Representations are real and implementation-specific (e.g., fail Case 3) but play no causal role in behavior (e.g., Case 1).  
  - **Represents as**: Content (despite causal inertness).  

  **Leaf E: Strong Representational Realism**  
  - **Most awkward commitment**: Representations must be human-interpretable (e.g., Case 4) and cannot be implementation-invariant (e.g., fail Case 3).  
  - **Represents as**: Content (directly recoverable from structure).  

  **Leaf F: Causal Role Realism**  
  - **Most awkward commitment**: Representations are tied to causal features (e.g., Case 2) but resist full algorithmic recovery (e.g., fail Case 4).  
  - **Represents as**: Causal role (grounded in structure but opaque to observers).  

  ---

  ### Unoccupied Combinations & Limitations
  - **Unoccupied: Q1=No → Q3=Yes** (Case 2 fails, but Case 5 holds).  
    - **Diagnosis**: Unattractive. Denying Case 2 (strong indicator) while accepting observer-relativity (Case 5) collapses into Instrumentalism (Leaf A).  
  - **Unoccupied: Q1=Yes → Q2=No → Q5=Yes** (Case 2 holds, causal role confirmed, but Case 4 fails).  
    - **Diagnosis**: Unexplored. Positions demanding causal efficacy but rejecting algorithmic recovery (e.g., Leaf F) are rare; this branch may fit niche causal-structural hybrids.  
  - **Limitation**: The tree cannot separate **Causal Role Realism (Leaf F)** from **Strong Representational Realism (Leaf E)** when human-readable algorithms *are* recoverable but deemed non-essential. Both require causal efficacy (Q2=No), but E demands algorithmic recovery while F does not.  

  ### Key
  - **Content**: Representation as semantic meaning (e.g., "cat detector").  
  - **Vehicle**: Representation as physical instantiation (e.g., specific neuron activation).  
  - **Causal role**: Representation as functional contribution to behavior.  
  - **Observer-relative fiction**: Representation as useful heuristic for external analysis.  

  This tree forces clarity by grounding abstract debates in empirical cases. Use it to preempt "talking past" by mapping disagreements to testable criteria.
