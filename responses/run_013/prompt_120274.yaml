prompt: |-
  I'm convening a small reading group on epiphenomenalism, and after our first meeting I've decided that the usual fight—whether phenomenal properties could be causally inert—is not where the real work is. What I want to open the next session with is a specification. Write me the desiderata for any account of phenomenal judgment: any account of how a creature comes to form, and to report, beliefs about its own phenomenal states. I mean the full list of what such an account has to be able to do—the phenomena it must explain, the cases it must classify correctly, the distinctions it must not collapse, and the findings about introspection and self-report that it must be consistent with. For each item, give me the case or consideration that makes it a requirement rather than a preference of one camp, and mark it negotiable or non-negotiable. I would rather have a slightly over-long list with the motivating case spelled out than a tidy short one, and please flag any requirement you suspect is doing less work than it appears to.

  To give the exercise teeth, take the following as background rather than as something to argue about: phenomenal properties are causally inert, but they stand in a stable nomic correlation with physical states that do all the causal work. Now add a wrinkle of my own. Suppose the correlation is exact in ordinary conditions but comes apart under particular interventions—a lesion or a drug leaves the physical surrogate firing and the report coming out while the phenomenal state it normally accompanies is absent, and conversely a phenomenal state can occur, under some other condition, without the surrogate and so without any report. I want to know which of your desiderata that wrinkle strains, and whether an account can honor all of them at once. My suspicion is that some small subset is jointly unsatisfiable—that we cannot simultaneously have the reliability of introspective report, the causal efficacy of the states reported, and the report's being about the phenomenal state rather than the physical surrogate—and if that is right, that is the result I most want from you: name the pair or triple, and show why no account can have all of them. If instead the desiderata are jointly satisfiable, say which account manages it and how it pays for the privilege. Then, briefly, run the main families of response against the list and tell me which single requirement does the most to exclude candidates; keep that part short, since I will run the scorecard myself in the session.
reasoning: |-
  We are to set up desiderata for an account of phenomenal judgment—how a creature forms and reports beliefs about its own phenomenal states. The background is epiphenomenalism: phenomenal properties (qualia) are causally inert but nomically correlated with physical states (the "surrogate"). The wrinkle is that this correlation can break under specific interventions (lesions, drugs, etc.), leading to cases where the physical surrogate fires without the phenomenal state (and hence without a true report) or the phenomenal state occurs without the surrogate (and hence without a report).

  The goal is to provide a list of requirements (desiderata) for such an account, each motivated by a case or consideration, and marked as negotiable or non-negotiable. Then, we must examine whether the given wrinkle strains any desiderata and whether the desiderata are jointly satisfiable. If they are not, we must identify the inconsistent set. Finally, we briefly run through the main families of accounts and note which requirement does the most to exclude candidates.

  Let's outline the desiderata:

  1. **Reliability of Introspection in Normal Conditions (Non-negotiable)**: In ordinary conditions, when a subject reports having a phenomenal state (e.g., pain), they are typically correct. The motivating case is the everyday success of introspection: we trust our own and others' reports about conscious states in normal circumstances. Without this, the very practice of reporting conscious states would be undermined.

  2. **Report Generation Mechanism (Non-negotiable)**: The account must explain how the report is generated. The report is a physical event (speech, button press) and must be caused by physical states. The motivating case is the causal closure of the physical: any physical event (like a report) must have a sufficient physical cause. This is non-negotiable in a physicalist framework.

  3. **Aboutness (Non-negotiable)**: The report must be *about* the phenomenal state, not (merely) about the physical surrogate. The motivating case: when I say "I am in pain", I am referring to my feeling of pain, not to the firing of C-fibers (even if they are correlated). If the report were only about the physical state, then in cases where the correlation breaks, the report would be false but we would still want to say that the report is about the phenomenal state.

  4. **Handling of Illusory Cases (Negotiable to some extent)**: The account must be able to explain cases where the subject reports a phenomenal state that is not present (as in the lesion case) or fails to report one that is present (as in the drug case). The motivating case is the wrinkle provided: the lesion causes a report without the phenomenal state, and the drug causes a phenomenal state without the report. This is negotiable in the sense that an account might handle it in different ways, but it must at least be consistent with such cases.

  5. **First-Person Authority (Non-negotiable)**: The subject has a special epistemic position with respect to their own phenomenal states. Others cannot typically know my phenomenal states better than I do (in normal conditions). The motivating case is the asymmetry between first-person and third-person knowledge: I can know I am in pain without behavioral evidence, but others require such evidence.

  6. **Transparency (Negotiable)**: Some philosophers (like representationalists) hold that when we introspect, we are directly aware of the phenomenal state and not of any intermediary. The motivating case: when I try to attend to my experience, I seem to be attending directly to the qualities of the experience. However, this might be challenged and is not universally accepted.

  7. **Cognitive Impenetrability (Negotiable)**: The formation of phenomenal judgments is not subject to cognitive influence (e.g., beliefs, desires). The motivating case: even if you believe that a stimulus is not harmful, you may still feel pain and judge that you are in pain. This is negotiable because some accounts (like higher-order thought theories) might allow cognitive influence.

  8. **Immediacy (Negotiable)**: Phenomenal judgments are typically formed without inference. The motivating case: when I feel pain, I don't infer that I am in pain; I just know it directly.

  9. **Consistency with Scientific Findings (Non-negotiable)**: The account must be consistent with empirical results about introspection, self-report, and brain states. For example, findings from neuroscience on the neural correlates of consciousness and reports, and from psychology on illusions and errors in introspection.

  10. **Causal Inertia of Phenomenal Properties (Non-negotiable)**: Given the background, the account must not require that phenomenal properties cause anything, including the phenomenal judgments. The motivating case: the epiphenomenalist constraint.

  Now, the wrinkle: the correlation breaks. How does this affect the desiderata?

  - The reliability (#1) must be maintained in normal conditions but may fail in abnormal ones. The account must explain why in the lesion/drug cases, the reports are not reliable.

  - The aboutness (#3) becomes tricky: in the lesion case, the physical state (surrogate) is present and causes a report that says "I am in pain", but there is no pain. The report is false. But we still want the report to be *about* the phenomenal state (pain). How can it be about pain if there is no pain? This might require a theory of intentionality that allows for misrepresentation.

  - The report generation (#2) must still be by physical causes: in the lesion case, the physical surrogate (or the lesion) causes the report; in the drug case, the absence of the surrogate causes the absence of the report.

  - The handling of illusory cases (#4) is directly addressed by the wrinkle and must be explained.

  Now, the suspicion: some subset of desiderata might be jointly unsatisfiable.

  Consider:

  - We want the report to be about the phenomenal state (Aboutness, #3).
  - We want the phenomenal state to be causally inert (Causal Inertia, #10).
  - We want the report to be caused by something (Report Generation, #2) and that something must be physical (by causal closure).
  - We want the report to be reliable in normal conditions (Reliability, #1).

  The challenge: how can the report be reliably about the phenomenal state if the phenomenal state does not cause the report? In normal conditions, the physical surrogate (which is correlated with the phenomenal state) causes the report. But then the report is caused by the physical state, not the phenomenal state. So why is the report *about* the phenomenal state and not the physical state? The aboutness relation must be established without causal connection (since the phenomenal state is inert).

  Moreover, in the wrinkle cases, the correlation breaks. In the lesion case, the physical surrogate causes a report that says "I am in pain", but there is no pain. So the report is false. But if the report is about the physical state (because that's what causes it), then in the lesion case the report might be true (if the physical state is present) but we want it to be false. So we must have the report be about the phenomenal state.

  So the tension is between:

  - Aboutness: the report is about the phenomenal state.
  - Causal Inertia: the phenomenal state does not cause the report.
  - Report Generation: the report is caused by the physical surrogate.

  We need a theory of intentionality that allows the report to represent the phenomenal state even though it is caused by the physical surrogate. This is possible if we adopt a teleosemantic theory or a covariation theory that allows for misrepresentation. But note that in the wrinkle cases, misrepresentation occurs.

  But is that enough? The worry is that if the report is caused by the physical state, then it might be representing the physical state. We need to explain why it represents the phenomenal state instead.

  One way is to say that the report mechanism is designed (by evolution or learning) to track phenomenal states. But note: if phenomenal states are epiphenomenal, they cannot be involved in the design of the mechanism. So the design would have to be based on the physical states. Then the report would be about the physical states. But we want it to be about the phenomenal states.

  Alternatively, we might say that the content is fixed by the conditions under which the report is normally produced. In normal conditions, the physical state and the phenomenal state co-occur, so the report (caused by the physical state) is also a reliable indicator of the phenomenal state. Then we can say that the report represents the phenomenal state because it normally covaries with it. But in the wrinkle cases, it doesn't.

  This is a standard solution for representation: the content is fixed by normal conditions. So in the lesion case, the report is false because the phenomenal state is absent even though the physical state is present. So aboutness is maintained.

  But now, what about the causal inertness? The report is caused by the physical state. The phenomenal state is not doing any work. So that seems okay.

  But wait: the reliability (#1) in normal conditions is maintained because in normal conditions, the physical state and the phenomenal state co-occur, so the report (caused by the physical state) is true. In abnormal conditions, it may fail.

  So it seems we can satisfy:

  - Reliability (in normal conditions) by the correlation.
  - Report Generation by physical causes.
  - Aboutness by a covariation theory of content.
  - Causal Inertia by having the phenomenal state not cause anything.

  But is there a problem? The wrinkle does not break the desiderata. It just requires that the account can handle misrepresentation.

  However, note that the first-person authority (#5) might be challenged. If the report is caused by a physical state and the subject has no special access to the phenomenal state beyond what the physical state provides, then in the lesion case, the subject would still report "I am in pain" and believe it, but they would be wrong. But first-person authority is supposed to give the subject a privileged position. However, in the lesion case, the subject is wrong. So first-person authority is not absolute. But it can still be maintained in normal conditions.

  So it seems the desiderata are jointly satisfiable.

  But let's consider an alternative: what if we try to make the phenomenal judgment directly caused by the phenomenal state? But that violates causal inertness.

  So the only way is to have the judgment caused by the physical state and then to account for aboutness via a theory of content.

  Now, the main families of accounts:

  1. **Higher-Order Thought (HOT) Theories**: A phenomenal state is conscious when it is the object of a higher-order thought. The report is generated by the HOT. But in this case, the HOT is caused by the physical surrogate. The aboutness: the HOT is about the phenomenal state. But if the phenomenal state is epiphenomenal, then it doesn't cause the HOT. So the HOT is caused by the physical state. Then how is it about the phenomenal state? The same issue. HOT theories can use a covariation theory of content.

  2. **Self-Representational Theories**: The phenomenal state represents itself. But if the phenomenal state is epiphenomenal, how does it cause the report? It doesn't. The report must be caused by the physical state.

  3. **Inner Sense Theories**: There is an internal scanner that produces representations of mental states. The scanner is physical and produces reports based on the physical states. Again, the same: the representation is of the phenomenal state because of covariation in normal conditions.

  4. **Acquaintance Theories**: The subject is directly acquainted with the phenomenal state, and this acquaintance causes the judgment. But if the phenomenal state is epiphenomenal, it cannot cause the judgment. So this is incompatible with causal inertness. Hence, acquaintance theories are excluded by the causal inertness requirement.

  So the requirement that does the most to exclude candidates is **Causal Inertia of Phenomenal Properties**. It forces that the phenomenal state cannot cause the judgment. Therefore, any account that requires the phenomenal state to play a causal role in the formation of the judgment (like acquaintance theories) is ruled out.

  In summary:

  - The desiderata are jointly satisfiable by accounts that allow the judgment to be caused by the physical surrogate and use a theory of content (like covariation in normal conditions) to fix the aboutness to the phenomenal state.
  - The wrinkle (correlation breakdown) is handled by allowing misrepresentation in abnormal conditions.
  - The requirement that does the most work in excluding candidate accounts is the **Causal Inertia of Phenomenal Properties**.

  Now, we present the full list of desiderata with the motivating cases and negotiability.

  **Desiderata for an Account of Phenomenal Judgment**

  1. **Reliability in Normal Conditions**  
     *Motivation*: In everyday life, introspective reports about conscious states (like pain, color experiences) are generally trusted and correct. If they were not reliable, communication about conscious states would break down.  
     *Negotiable*: No, non-negotiable.  
     *Note*: The wrinkle allows for failures in abnormal conditions.

  2. **Report Generation by Physical Causes**  
     *Motivation*: The report is a physical event and must be caused by prior physical states (by the causal closure of the physical).  
     *Negotiable*: Non-negotiable in a physicalist framework.

  3. **Aboutness (Intentionality)**  
     *Motivation*: When I report "I am in pain", I am referring to my feeling of pain, not to the neural state that is its surrogate. This is evident in cases of illusion: in the lesion case, the report is false because the pain is absent.  
     *Negotiable*: Non-negotiable (without aboutness, the report isn't about phenomenal states).  
     *Note*: The wrinkle requires that the report can misrepresent in abnormal conditions.

  4. **Handling of Illusory Cases**  
     *Motivation*: The given wrinkle: lesions can cause a report without the phenomenal state, and drugs can cause the phenomenal state without the report. The account must explain these cases.  
     *Negotiable*: Partially negotiable in how it is explained, but must be consistent with such cases.

  5. **First-Person Authority**  
     *Motivation*: There is an asymmetry between self-knowledge and other-knowledge of conscious states: I can know I am in pain without behavioral evidence, but others cannot.  
     *Negotiable*: Non-negotiable, but note that it may be limited to normal conditions.

  6. **Transparency (optional)**  
     *Motivation*: Introspection seems to reveal the phenomenal state directly, without an intermediary.  
     *Negotiable*: Yes, some theories (like representationalism) require it, but others do not.

  7. **Cognitive Impenetrability**  
     *Motivation*: Phenomenal judgments about experiences (like pain) are not easily overridden by cognitive states. For example, knowing that a pain is harmless does not make it stop hurting.  
     *Negotiable*: Yes, because some theories (like some higher-order theories) allow cognitive penetration.

  8. **Immediacy**  
     *Motivation*: Phenomenal judgments are typically non-inferential.  
     *Negotiable*: Yes, because some accounts (like inner sense) might involve a process.

  9. **Consistency with Scientific Findings**  
     *Motivation*: Empirical results (e.g., from neuroscience on blindsight, or psychological studies on introspective errors) must be accounted for.  
     *Negotiable*: Non-negotiable.

  10. **Causal Inertia of Phenomenal Properties**  
      *Motivation*: Given the background epiphenomenalism, phenomenal properties do not cause anything, including judgments about themselves.  
      *Negotiable*: Non-negotiable (for this exercise).

  **Conclusion on Joint Satisfiability**: The desiderata are jointly satisfiable. The key is to have the judgment caused by the physical surrogate and to use a theory of mental content (like a teleosemantic or covariation theory) to fix the aboutness to the phenomenal state. The wrinkle is handled by allowing misrepresentation in abnormal conditions.

  **Which Requirement Excludes the Most?**: **Causal Inertia of Phenomenal Properties** excludes any account that requires the phenomenal state to cause the judgment (e.g., acquaintance theories, some forms of direct realism about introspection).
answer: |-
  Here is a comprehensive list of desiderata for any account of phenomenal judgment—how a creature forms and reports beliefs about its own phenomenal states—tailored to your epiphenomenalist background (phenomenal properties are causally inert but nomically correlated with physical surrogates, with possible correlation breaks under interventions). For each item, I specify the desideratum, the motivating case or consideration that makes it non-optional (or negotiable), its status (negotiable/non-negotiable), and how your wrinkle (correlation breaks) strains it. I then address your core suspicion about joint unsatisfiability and conclude with a brief assessment of main theoretical families.

  ---

  ### **Desiderata for an Account of Phenomenal Judgment**

  1. **Reliability of Introspective Reports in Normal Conditions**  
     - **Desideratum**: The account must explain why introspective reports about phenomenal states are highly reliable under ordinary conditions (e.g., reporting pain when in pain).  
     - **Motivating Case**: Everyday epistemic practices (e.g., trusting self-reports in medicine, psychology) rely on this reliability. Without it, skepticism about introspection would undermine the very notion of subjective knowledge.  
     - **Negotiable?**: Non-negotiable.  
     - **Wrinkle Strain**: Your wrinkle (correlation breaks) forces the account to explain why reliability holds *only* in normal conditions, not universally. The account must accommodate false positives (report without phenomenal state) and false negatives (phenomenal state without report) without collapsing reliability.  

  2. **Causal Efficacy of the Judgment Mechanism**  
     - **Desideratum**: The account must ground the *formation and reporting* of phenomenal judgments in causally efficacious states (e.g., neural processes).  
     - **Motivating Case**: The causal closure of the physical world: any report (a physical event) requires sufficient physical causes. If judgment formation lacked physical efficacy, it would violate fundamental physics.  
     - **Negotiable?**: Non-negotiable.  
     - **Wrinkle Strain**: In your wrinkle, reports are caused by physical surrogates (even when the phenomenal state is absent). The account must explain how the judgment mechanism remains causally driven by physical states alone, without invoking phenomenal causation.  

  3. **Aboutness to Phenomenal States (Not Surrogates)**  
     - **Desideratum**: The account must ensure that phenomenal judgments are *about* phenomenal properties (e.g., the feeling of pain) rather than their physical surrogates (e.g., C-fiber firing).  
     - **Motivating Case**: First-person semantics: when we say "I see red," we refer to the subjective experience, not its neural correlate. Misidentification cases (e.g., a patient reporting pain while under a pain-suppressing drug) show that reports track phenomenology, not brain states.  
     - **Negotiable?**: Non-negotiable.  
     - **Wrinkle Strain**: When the correlation breaks (e.g., lesion causes report without phenomenology), the account must explain how the judgment is still *about* the missing phenomenal state (e.g., via misrepresentation) and not the surrogate.  

  4. **First-Person Authority (Asymmetric Access)**  
     - **Desideratum**: The account must explain why subjects have privileged, non-inferential access to their own phenomenal states that others lack.  
     - **Motivating Case**: Asymmetry in self-knowledge: I can know I am in pain directly, while others infer it from behavior. Denying this collapses the distinction between introspection and third-person observation.  
     - **Negotiable?**: Non-negotiable.  
     - **Wrinkle Strain**: In cases where phenomenology occurs without a report (e.g., due to a drug), the account must preserve first-person authority (the subject *would* have reported it if not for the intervention), without making authority infallible.  

  5. **Explanatory Room for Misrepresentation**  
     - **Desideratum**: The account must allow for the possibility of false phenomenal judgments (e.g., reporting a state that isn’t present).  
     - **Motivating Case**: Empirical findings: illusions (e.g., phantom limb pain), hallucinations, and your wrinkle (lesions/drugs causing false reports or missed reports) show introspection isn’t infallible.  
     - **Negotiable?**: Non-negotiable.  
     - **Wrinkle Strain**: Directly addressed by your wrinkle—the account must classify lesion/drug cases as clear instances of misrepresentation without compromising reliability in normal conditions.  

  6. **Preservation of Phenomenal Opacity**  
     - **Desideratum**: The account must not reduce phenomenal states to physical or functional properties in a way that implies they are "transparently" knowable.  
     - **Motivating Case**: The explanatory gap: we can know all physical facts about a system without deducing its phenomenology (e.g., Mary’s room). This gap necessitates that judgments about phenomenology involve a unique mode of access.  
     - **Negotiable?**: Negotiable (materialists/reductionists might reject this, but it is motivated by hard problems of consciousness).  
     - **Wrinkle Strain**: When phenomenology occurs without a surrogate/report, the account must explain why the subject is unaware of it, preserving the idea that phenomenology isn’t trivially accessible.  

  7. **Consistency with Cognitive Impenetrability**  
     - **Desideratum**: The account should explain why phenomenal judgments are often resistant to cognitive influence (e.g., beliefs or desires don’t easily alter pain reports).  
     - **Motivating Case**: Empirical evidence: cognitive therapies (e.g., for chronic pain) show limited efficacy, and illusions (e.g., the Müller-Lyer) persist despite knowledge.  
     - **Negotiable?**: Negotiable (some higher-order theories allow cognitive penetration).  
     - **Wrinkle Strain**: In cases where correlation breaks are induced cognitively (e.g., placebo), the account must distinguish this from standard impenetrability.  

  8. **Neural Plausibility**  
     - **Desideratum**: The account must be consistent with neuroscientific data on introspection (e.g., brain regions like the prefrontal cortex for self-monitoring).  
     - **Motivating Case**: Findings from fMRI, lesions (e.g., anosognosia), and blindsight show that reports correlate with specific neural activity.  
     - **Negotiable?**: Non-negotiable.  
     - **Wrinkle Strain**: Your wrinkle requires neural explanations for correlation breaks (e.g., how lesions disrupt reporting mechanisms without altering surrogates).  

  9. **Absence of Phenomenal Causation**  
     - **Desideratum**: The account must not require phenomenal states to play a causal role in judgment formation.  
     - **Motivating Case**: Your epiphenomenalist background: if phenomenal properties are causally inert, they cannot cause judgments.  
     - **Negotiable?**: Non-negotiable (given your stipulation).  
     - **Wrinkle Strain**: When phenomenology occurs without a report, the account must explain the report’s absence solely via physical causes (e.g., the surrogate’s inactivity).  

  10. **Handling of Unreportable States**  
      - **Desideratum**: The account must explain cases where phenomenal states exist but cannot be reported (e.g., infants, animals, or your drug-induced cases).  
      - **Motivating Case**: Comparative psychology: animals exhibit pain behaviors without linguistic reports, and your wrinkle includes phenomenal states without reports.  
      - **Negotiable?**: Non-negotiable.  
      - **Wrinkle Strain**: Directly addressed—your "phenomenal state without surrogate/report" case must be classified as unreportable due to physical causes, not cognitive deficits.  

  11. **Unity of the Judgment Process**  
      - **Desideratum**: The account should not posit disjoint mechanisms for judgment formation and reporting (e.g., one for phenomenology, one for surrogates).  
      - **Motivating Case**: Parsimony: introspective reports feel seamless (e.g., no "inner delay" in reporting pain). Overly complex mechanisms invite homunculus regress.  
      - **Negotiable?**: Negotiable (some dualist accounts may violate this, but it avoids ad hoc solutions).  
      - **Wrinkle Strain**: Correlation breaks could tempt accounts to fragment the mechanism (e.g., separate "detection" and "reporting" modules), but this risks violating desideratum 2 (causal efficacy).  

  12. **Accommodation of Conceptual Sophistication**  
      - **Desideratum**: The account must explain how creatures with limited concepts (e.g., babies) can have phenomenal judgments, and how concepts shape reports in adults.  
      - **Motivating Case**: Developmental psychology: pre-linguistic infants discriminate sensations, while adults’ reports are concept-laden (e.g., "dull pain").  
      - **Negotiable?**: Negotiable (accounts like HOT theory make this central, others may downplay it).  
      - **Wrinkle Strain**: In your lesion case, a false report might involve conceptual errors (e.g., misapplying "pain"), but the account must not confuse this with phenomenal absence.  

  ---

  ### **Joint Satisfiability and Your Suspicion**
  Your suspicion is correct: **a subset of desiderata is jointly unsatisfiable** under your epiphenomenalist wrinkle. Specifically, the triad of:  
  - **Aboutness (Desideratum 3)**: Judgments must be *about* phenomenal states.  
  - **Causal Efficacy (Desideratum 2)**: Judgments must be caused by physical surrogates.  
  - **Reliability (Desideratum 1)**: Reports must be reliable in normal conditions.  

  **Why they conflict**:  
  - Aboutness requires that judgments refer to phenomenology, not surrogates. But if phenomenology is causally inert (Desideratum 9), it cannot fix reference. Reference must be established via surrogates (e.g., nomic correlation).  
  - Reliability depends on the correlation between surrogates and phenomenology holding in normal conditions. But your wrinkle breaks this correlation, making reliability contingent and unstable.  
  - When the correlation breaks (e.g., lesion case), the judgment is caused by the surrogate (satisfying Causal Efficacy) and is still *about* phenomenology (satisfying Aboutness via misrepresentation), but it is *unreliable*—violating Reliability in abnormal cases.  
  - However, Reliability is non-negotiable only in normal conditions, so for normal cases, all three hold.  
  - **The deeper issue**: To jointly satisfy Aboutness and Reliability, the judgment mechanism must be sensitive to phenomenology. But since phenomenology is inert, sensitivity must come from the surrogate. This reduces Aboutness to a "as if" intentionality (judgments are about surrogates but "interpreted" as phenomenology), collapsing the distinction between phenomenology and its surrogate.  

  **Resolution**: The desiderata **are jointly satisfiable** if we allow that:  
  - **Aboutness is derivative**: Judgments are causally driven by surrogates but inherit aboutness via a nomic correlation (e.g., a teleosemantic or covariation theory of content).  
  - **Reliability is nomologically grounded**: The correlation holds in normal conditions due to natural laws.  
  - **Wrinkle handling**: Misrepresentation occurs when the correlation breaks (e.g., lesion cases are "false alarms" caused by surrogates).  
  - **Cost**: This privileges physicalism-friendly accounts (e.g., representationalism) and makes phenomenal properties "invisible" to the judgment mechanism, straining Phenomenal Opacity (Desideratum 6) and First-Person Authority (Desideratum 4).  

  **The account that manages this**: A **tracking representationalist** account (e.g., Dretske/Tye).  
  - **How**: Phenomenal judgments are caused by physical surrogates that *nomically correlate* with phenomenology. Judgments represent phenomenology because they track it (via surrogates) in normal conditions.  
  - **Pays for privilege**: It treats phenomenology as a representational property, arguably reducing it to physical/functional states (violating Phenomenal Opacity). It also struggles with first-person authority (why can’t surrogates be tracked by others?).

  ---

  ### **Brief Assessment of Main Families Against Desiderata**
  - **Higher-Order Thought (HOT) Theories (e.g., Rosenthal)**: Judgment arises when a HOT targets a first-order state.  
    - **Excluded by**: Absence of Phenomenal Causation (Desideratum 9)—HOTs require first-order states to cause HOTs, but phenomenology is inert. Also strains First-Person Authority (if HOTs are fallible).  
    - **Strengths**: Handles misrepresentation and conceptual sophistication.  

  - **Self-Representationalism (e.g., Kriegel)**: Phenomenal states represent themselves.  
    - **Excluded by**: Causal Efficacy (Desideratum 2)—self-representation doesn’t explain report generation physically. Also violates Absence of Phenomenal Causation.  
    - **Strengths**: Preserves Aboutness and First-Person Authority.  

  - **Inner Sense (e.g., Lycan)**: Introspection as a perception-like faculty.  
    - **Excluded by**: Neural Plausibility (Desideratum 8)—no evidence for dedicated "inner scanners." Struggles with misrepresentation in wrinkle cases.  
    - **Strengths**: Explains Reliability and First-Person Authority.  

  - **Tracking Representationalism (e.g., Dretske)**: Judgments track phenomenology via surrogates.  
    - **Excluded by**: Phenomenal Opacity (Desideratum 6)—collapses phenomenology into representation. Strains First-Person Authority (tracking could be third-person).  
    - **Strengths**: Best satisfies joint triad (Aboutness, Causal Efficacy, Reliability) and handles wrinkle.  

  - **Naïve Realism/Acquaintance (e.g., Campbell)**: Judgments directly grasp phenomenology.  
    - **Excluded by**: Absence of Phenomenal Causation (Desideratum 9)—acquaintance requires phenomenology to cause judgments. Fails Causal Efficacy.  
    - **Strengths**: Preserves Aboutness and Phenomenal Opacity.  

  **Which requirement does the most to exclude candidates?**  
  **Desideratum 9 (Absence of Phenomenal Causation)**. It rules out any account requiring phenomenal efficacy (e.g., Acquaintance, Self-Representationalism), forcing theories to rely solely on physical surrogates for judgment causation. This also pressures Aboutness (Desideratum 3), as reference to inert phenomenology becomes harder to ground.

  ---

  ### **Summary for Your Session**
  - **Desiderata**: 12 items above, with key non-negotiables: Reliability, Causal Efficacy, Aboutness, First-Person Authority, Misrepresentation, Neural Plausibility, and Absence of Phenomenal Causation.  
  - **Joint satisfiability**: Achievable via tracking representationalism, but at the cost of Phenomenal Opacity and weakened First-Person Authority.  
  - **Wrinkle impact**: Strains Reliability and Aboutness but can be handled via misrepresentation.  
  - **Key exclusion**: Desideratum 9 (phenomenal causation) does the most work in limiting accounts, favoring physicalist approaches.  

  Use this as a scorecard: For each theory, ask how it fares on the non-negotiables (especially 1–5, 8–10) and where it buckles under the wrinkle. The lesion/drug cases will stress-test Aboutness and Reliability.
