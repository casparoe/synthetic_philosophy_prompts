prompt: |-
  I'm a senior at a pretty big public high school and somehow I got volun-told to give the speech at our Decision Day assembly next week. It's the thing where everyone wears their college hoodie or their gap-year flannel and the principal reads off stats about how many of us are going where. I'm not trying to be deep or anything but it's been bugging me alot, because in my stats class we did a unit on the reference class problem and now I can't unsee it. The basic idea is that if you want to say what's likely to happen to one person, you have to pick a group to compare them to, but there's no one right group. Am I "a student from our school"? "A student with a 3.7 GPA"? "A first-gen kid"? "A kid who did marching band and worked at Dairy Queen"? Each one gives a different answer, and the data doesn't tell you which one is the real one. My teacher said it's a genuine problem in philosophy of probability, not just a stats worksheet thing.

  But the part I can't stop thinking about is that the assembly itself changes the reference class. If the principal gets up and says "students like you get into places like this," then "students like you" stops being a neutral group and becomes something we all start measuring ourselves against. The prediction kind of folds back into the class. I want a speech that actually uses this instead of just saying "you are more than a number." It has to land for the whole gym: the kids who are hyped, the parents who are quietly freaking out, the counselors who basically live in the Naviance data, and the teachers who just want it to be June. Can you write me the speech? Like 4 or 5 minutes. Warm, not a lecture, but not fake either. I'm definately not trying to give a TED talk or a commencement cliche. Maybe it ends on some way of picking a reference class that's honest about being a choice, and about who gets to make it.
reasoning: |-
  Okay, let me unpack this fascinating request. The user is a high school senior unexpectedly tasked with giving a Decision Day speech, but they're wrestling with the reference class problem from statistics class - how we categorize people affects predictions about their futures. What makes this compelling is their insight that the assembly itself reshapes the reference class ("students like you") in a self-fulfilling way.

  Hmm... they clearly want to avoid clichés while acknowledging the emotional complexity of the moment. The audience is fragmented: excited students, anxious parents, data-focused counselors, and exhausted teachers. Key needs I'm seeing: 1) honoring different post-grad paths equally 2) making philosophical concepts accessible 3) avoiding TED-talk pretentiousness 4) ending with agency - choosing our own reference classes.

  The reference class problem is a deep concept in probability theory. It's about how we select a group to compare an individual to when making predictions. The user is right that there's no single correct group - each choice gives different probabilities. And as they pointed out, the act of defining the group can influence behavior, making it self-reinforcing.

  I should craft something that starts with the visceral scene (hoodies, flannels, etc.), introduces the reference class idea through their stats class lens, then explores how labels shape identity. The turning point could be when they realized the assembly itself defines "students like you." 

  For warmth, I'll use specific examples from their description - GPA brackets, first-gen kids, Dairy Queen employees. The counselors' Naviance data mention grounds it in school reality. To avoid sounding academic, I'll keep sentences conversational with contractions and occasional humor ("volun-told" is perfect).

  The ending should empower: maybe suggesting we get to choose our reference classes daily. Not "follow your dreams" nonsense, but active framing - like how the flannel kid chooses "adventurers" as their class today. Visual of everyone becoming each other's new reference class could tie it together.

  Biggest challenge is balancing intellectual honesty with emotional resonance. Must avoid sounding like a lecture while doing justice to the philosophy. The "you are more than a number" rejection is helpful - they want substance, not platitudes. Maybe undercut heaviness with self-awareness: "I know, deep for 8am..." 

  Parents need reassurance too - perhaps nod to how their reference classes differ from kids'. Teachers get the "almost June" exhaustion acknowledgment. Counselors? A wink about data being useful but incomplete.

  Final thought: the mic-passing metaphor works because it literalizes agency. And ending on shared human messiness ("gloriously imperfect") avoids sappiness while being true.
answer: |-
  Here’s a speech that tackles the reference class problem head-on while staying grounded, warm, and honest—designed for the gym full of seniors, parents, counselors, and tired teachers. (Clockwise: **~4.5 minutes**)

  ---

  **(Start with a relaxed smile, maybe a subtle glance at your own hoodie or flannel)**  
  So… I’ll be honest: when I got volun-told to give this speech, my first thought was, *“Wait, why me?”* And then my second thought was, *“Okay, but what do I even say?”*  
  Because today’s about celebration—and it should be! Look around. Hoodies. Flannels. Colors and logos announcing where we’re headed next. That’s huge. Whether it’s a university, a trade program, the military, a gap year, or straight into work—you showed up. You made a decision. That deserves applause right now.  
  **(Pause for applause—let it build naturally)**  

  But here’s what kept me up. In stats class this year, we learned about something called the **reference class problem**. Sounds fancy, right? It’s not. It’s basically this: **When you try to predict what’ll happen to one person, you have to compare them to a group.** Like, "students with your GPA," or "first-gen students," or "people from this town," or "marching band kids who also worked at Dairy Queen." **(Light chuckle)**  

  **Here’s the catch:** There are *a thousand possible groups*. And each one gives you a different prediction about your future. The data doesn’t tell you which group is the “right” one to use. Are you *mainly* “a 3.7 GPA student”? Or are you *mainly* “the kid who took care of your siblings after school”? Or “the one who fixed Mr. Henderson’s printer three times”? Each lens changes the story.  

  **(Lean in, conversational)**  
  And then it hit me: **Today is the ultimate reference class generator.** In a few minutes, they’ll read stats: *“X% of you are going to 4-year colleges, Y% to community college, Z% into the workforce…”* And without meaning to, that becomes *the* group we measure ourselves against. “Students like *us*.”  

  But here’s the thing they don’t put on the pie chart:  
  **You don’t belong to just one group.**  
  You’re not *just* an admit letter. Or a test score. Or a quiet kid. Or a star athlete. Or someone who’s still figuring it out. You’re layered. You’re contradictory. You’re a Venn diagram with a million circles.  

  **(Shift tone – warmer, firmer)**  
  So when someone says, “Students like you typically do *this*…” or “People from this high school usually *that*…”?  
  **You get to ask: “Which ‘me’ are you talking about?”**  
  Because the “you” they’re predicting isn’t the full picture. It can’t be.  

  **(Acknowledge the room)**  
  Parents—you see one version of us. Counselors—you see another (shoutout to Naviance, by the way). Teachers—you see the kid who aced the quiz and the one who slept through it. **(Smile)** And us? Half the time *we’re* not sure who we see in the mirror.  

  **(Pivot to empowerment)**  
  That’s why today isn’t an endpoint. It’s not a label. **It’s a permission slip.**  
  Permission to choose your own reference class. Every single day.  

  Struggling in a new place? Maybe your reference class today is “survivors” – people who’ve pushed through hard things before.  
  Killing it in your apprenticeship? Maybe your class is “builders” – people who make things with their hands and their minds.  
  Feeling lost? Maybe your class is “explorers” – and explorers *expect* to feel lost sometimes. It’s in the job description.  

  **(Directly to the flannel-wearers / non-college paths)**  
  And to everyone rocking the flannel today—the gap year travelers, the future electricians, the entrepreneurs, the enlisting—your path isn’t “alternative.” It’s *yours*. Your reference class? **Trailblazers.** People who define direction on their own terms.  

  **(Bring it home – quieter, reflective)**  
  So yes, celebrate the hoodie. Celebrate the flannel. Celebrate the stats. They’re part of our story.  
  But they’re not the whole story.  

  The most honest reference class we have today?  
  **It’s this gym. Right here. Right now.**  
  Not because we’re all going to the same place, but because we shared these four years. Because we’re messy, hopeful, stressed, excited, and absolutely **human**.  

  **(Stronger, with warmth)**  
  Wherever you’re headed next—  
  **Don’t let your future be defined by a single data point.  
  Don’t let your identity shrink to fit someone else’s spreadsheet.**  

  Pick your reference class like you pick your clothes today:  
  **With intention.  
  With pride.  
  And with the knowledge that tomorrow, you can choose again.**  

  So here’s to the class of [Year]—not as a statistic, but as a thousand unfolding stories.  
  Now go make yours.  

  **(Step back, genuine smile)**  
  Thank you.  

  ---

  **Why this works:**  
  - **Acknowledges Complexity:** Uses the reference class idea without jargon. Makes stats feel human.  
  - **Validates All Paths:** Hoodies *and* flannels get equal respect.  
  - **Subverts Expectations:** Instead of “you’re more than a number,” it’s “**you get to choose which numbers even matter**.”  
  - **Audience Inclusive:** Nods to parents’ pride, counselors’ data, teachers’ exhaustion, and the varied emotional states of seniors.  
  - **Ends on Agency:** Makes “choosing your reference class” an active, hopeful act—not a philosophical dead end.  
  - **Tone:** Warm but not sweet. Honest but not cynical. Grounded in the specific (Dairy Queen, Naviance, flannels) so it feels real.  

  **Delivery Tip:** Pause after the deeper lines (e.g., “Which ‘me’ are you talking about?”). Let the gym absorb it. Good luck—you’ve got this!
