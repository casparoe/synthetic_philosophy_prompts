prompt: |-
  I'm building a handout for a reading group on the definition of life, and I dont want another list of the usual criteria (organisation, metabolism, reproduction, response to stimuli). What I want first is the spec: what does any candidate definition actually have to deliver to count as adequate? My angle is a bit unusual, because I also sit on a small group that advises on whether a sample counts as a biosignature, so my definition has to be usable by people who may only ever get one scoop of ice, on a world whose chemistry might be nothing like ours, with no chance to watch anything reproduce. So the purpose is partly practical, not just conceptual. Keep that in mind when you decide what's non-negotiable.

  Give me the requirements list. For each one: the case or consideration that makes it a requirement, and whether you think it's non-negotiable or just the prejudice of one camp. Cover at least these, but add whatever I've missed:

  - the standard hard cases: viruses, prions, viroids, plasmids, the pared-down synthetic cell with a minimal genome, mitochondria, a mule, a seed in a drawer, a frozen tardigrade. Say what each one actually pressures, and if a case is doing no work, drop it rather than padding the list.
  - the awkward ones where the same lump of matter is alive at 9am and dead at noon with nothing added or removed, and where something can only be alive in company (a lichen, a Portuguese man o' war, a slime mold, mitochondria again). Does your list force a definition to pick a unit -- organism, lineage, gene, consortium? And is that a bug or a genuine requirement?
  - nested life: parts that were once independent lives and now aren't. Does a definition have to allow an entity to be both a life and a part of a life, or is that just a mess we can legislate away?
  - mortality: some organisms don't seem to age at all. If a definition builds death, or reproduction-into-death, into being alive, is that an empirical error or a legitimate simplification?
  - two cases I made up, and I'd rather you treat them as real tests than as riddles: (a) a lab reactor that maintains itself far from equilibrium, grows and splits, but whose parts vary at random with no inheritance whatsoever -- self-maintenance with no evolution; (b) something on another world that behaves functionally like life but has no individuals and no cells -- a slowly-mixing medium that keeps re-making its own pattern as a whole, with no boundary and no lineage you could point to. Does a definition that requires Darwinian evolution, or one that requires an individual, have anything to say here, or does it just go quiet?

  Then the part I most want: which of these requirements can't be had together. I suspect at least one pair is jointly unsatisfiable -- something like, precise enough to settle the Earth cases, and general enough to be usable on a world where nothing is a cell, and decidable by a lab that gets one sample and no second look. If that's right, say so and say what it costs and who should give ground. If the tension dissolves, show me how.

  And which single requirement knocks out the most otherwise popular answers?

  Keep the scoring of actual contenders light -- a couple of sentences each on the main families (metabolism-first, evolution-first, self-maintenance or autonomy views, and the deflationist line that it's a handy label with no real category behind it). I'll argue about those with the group. Dont send me reading lists or citations, I can't look anything up from here and neither can you.
reasoning: |-
  Okay, let me tackle this query step by step. The user is building a handout for a reading group on the definition of life, specifically focusing on the requirements for an adequate definition rather than rehashing standard criteria. Their unique angle involves practicality for biosignature detection in astrobiology contexts—single samples, unknown chemistry, no opportunity for observation over time.

  First, I need to establish the core requirements. The user mentioned several cases and considerations: hard cases like viruses and frozen tardigrades, collective entities like lichens, nested life issues, mortality questions, and two custom scenarios (self-replicating reactor and boundary-less alien medium). Each requirement must be justified by real-world constraints.

  Starting with the hard cases: Viruses pressure the reproduction/heredity requirement; prions challenge the chemical basis; frozen tardigrades test the continuity clause. For collective entities, the unit of selection problem arises—must the definition specify whether it applies to organisms, consortia, or lineages? 

  Nested life (e.g., mitochondria) forces a decision about whether something can be both alive and part of alive simultaneously. Mortality questions reveal a tension—if death is built into the definition, it excludes biologically immortal species. The custom scenarios are critical: the reactor without heredity tests whether evolution is essential, while the boundary-less alien medium challenges individual-based definitions.

  Now, non-negotiable requirements emerge from the biosignature context: 
  1. **Detectability in a single sample**—since they get "one scoop of ice." 
  2. **Chemistry-independence**—must work for alien biochemistries. 
  3. **Temporal independence**—can't require observing processes over time. 
  4. **No Earth-centrism**—can't assume specific molecules or cell structures.  
  5. **Decidability**—must yield clear yes/no for biosignature panels.

  These conflict sharply with common definitional approaches. For example:
  - Requiring Darwinian evolution fails detectability (needs lineages).
  - Metabolism-first views may be too chemistry-specific.
  - Autonomy/self-maintenance often assumes physical boundaries.

  The key tension is between **precision** (resolving Earth cases) and **generality** (applying to unknown alien contexts) under **decisiveness constraints** (single sample). This might be fundamentally unsatisfiable—a definition good for Earth's hard cases may rely on Earth-like features, while a truly general one might be too vague for biosignature use. The biosignature context forces compromises: Earth-exceptional cases (viruses, prions) might need delegation to secondary analysis, prioritizing "clear biosignature" over "universal definition of life."

  For actual contenders:
  - **Metabolism-first** fails chemistry-independence.
  - **Evolution-first** fails temporal/single-sample needs.
  - **Autonomy views** struggle with collective/nested cases.
  - **Deflationism** is useless for biosignatures.

  The requirement that knocks out most contenders is **single-sample detectability without temporal observation**. It invalidates reproduction, evolution, growth, and stimulus response criteria.

  The path forward: Define life as "**autonomous self-regeneration of patterned disequilibrium,**" which handles the reactor and alien medium cases while satisfying detectability via chemical complexity analysis. But it explicitly excludes viruses/prions from "life" (calling them "derivatives")—a practical sacrifice for biosignature clarity.
answer: |-
  Here’s a requirements list for a practical, astrobiology-friendly definition of life, designed for biosignature detection with single samples. The focus is on *what a definition must achieve*, grounded in your constraints ("one scoop of ice," alien chemistry, no reproduction observation). Each requirement is justified by hard cases or practical needs, with negotiability flagged.  

  ### Core Requirements (Non-Negotiables for Biosignature Context)  
  1. **Detectability in a Single Static Sample**  
     *Why*: Your lab gets one shot—no time-series data, no observation of processes like growth.  
     *Non-negotiable? YES*. Forces the definition to rely on *structural or chemical signatures* (e.g., patterned complexity, disequilibrium) rather than dynamic processes (e.g., reproduction).  
     *Hard cases*: Frozen tardigrade (must be "alive" without active metabolism); seed in a drawer (dormancy acceptable).  

  2. **Chemistry-Independence**  
     *Why*: Life on another world may not use carbon, water, or polymers.  
     *Non-negotiable? YES*. Rules out definitions requiring specific molecules (e.g., "DNA-based").  
     *Hard cases*: Prions (self-propagating but protein-only—if alien "prions" exist, they pressure this).  

  3. **Temporal Independence**  
     *Why*: No chance to watch entities "do" anything (reproduce, respond). Death/alive transitions (e.g., 9am alive vs. noon dead) must not hinge on adding/removing matter.  
     *Non-Negotiable? YES*. Definition must avoid requiring *continuous* activity (e.g., a corpse’s residual structure could still signal past life).  
     *Hard cases*: Mitochondria (dead in isolation? But structural complexity remains); dead body (must be distinguishable from non-living matter).  

  4. **Unit Agnosticism**  
     *Why*: Collective entities (e.g., lichen) or nested systems (mitochondria) challenge "organism"-centric views.  
     *Non-Negotiable? YES*. Definition must apply to *systems* at multiple scales without privileging "individuals."  
     *Hard cases*: Portuguese man o’ war (functions as a collective); mitochondria (part of a cell but once independent); your alien medium (no individuals).  
     *Bug or feature?* Genuine requirement—life isn’t always "packaged" neatly.  

  ### Secondary Requirements (Negotiable or Context-Dependent)  
  5. **Heredity (But Not Reproduction)**  
     *Why*: Evolution requires inheritance, but you can’t observe replication.  
     *Non-negotiable? NO*. Biosignature detection doesn’t need to *prove* evolution—only infer it from molecular patterns (e.g., homochirality, repeating polymers).  
     *Pressure from*: Minimal synthetic cell (requires replication); your lab reactor (no heredity → not life if this is required).  

  6. **Disequilibrium Maintenance**  
     *Why*: Life resists entropy. Detectable via chemical gradients or energy storage.  
     *Non-negotiable? DEBATABLE*. Frozen tardigrade lacks this when inert, but its *potential* for self-restart might suffice.  
     *Your reactor case*: Satisfies this but fails heredity.  

  7. **Mortality Not Required**  
     *Why*: Biologically immortal species (e.g., hydra) exist. Death is a common trait but not universal.  
     *Non-negotiable? NO*. Legitimate simplification for Earth but irrelevant to biosignatures (detection doesn’t care if it dies later).  

  ### Cases That Don’t Pressure Requirements (Drop These)  
  - **Mules**: Sterility irrelevant—heredity is lineage-level, not individual.  
  - **Viroids/Plasmids**: Redundant with viruses—all pressure heredity vs. detectability.  
  - **Pared-Down Synthetic Cell**: Same as minimal life—tests replication, not detectability.  

  ### Tensions: What Can’t Be Had Together  
  - **Precision vs. Generality + Decidability**:  
    - *Conflict*: A definition precise for Earth (e.g., "Darwinian evolution") fails your alien medium (no lineages). A general one ("self-sustaining disequilibrium") risks false positives (e.g., crystallizing salts).  
    - *Cost*: Sacrifice Earth-exceptional cases (viruses, prions) to prioritize alien detectability.  
    - *Who Gives Ground?* Biosignature panel should accept a "gray zone" for viruses/prions. Call them "life-derived" but not central to the definition.  

  - **Unit Agnosticism vs. Detectability**:  
    - Defining life as a *process* (not an entity) resolves collectives/nesting but makes single-sample detection harder (e.g., is a mitochondrion’s structure "life" or just a relic?).  

  ### Requirement That Knocks Out Popular Answers  
  **Single-sample detectability without temporal data** eliminates:  
  - Reproduction-based definitions (no observation of replication).  
  - Evolution-based definitions (requires lineages, not snapshots).  
  - Response-to-stimuli definitions (needs observation).  

  ### Quick Contender Scoring (Light Touch)  
  - **Metabolism-First**: Fails chemistry-independence (assumes familiar pathways) and detectability (needs active processes).  
  - **Evolution-First**: Fails temporal/single-sample needs. Your reactor (no heredity) and alien medium (no lineages) break it.  
  - **Self-Maintenance/Autonomy**: Best fit—works for frozen tardigrade (potential autonomy) and your reactor. Struggles with viruses (no self-sustaining metabolism).  
  - **Deflationism ("Handy Label")**: Useless for biosignatures—needs a clear yes/no.  

  ### Bottom Line for Your Handout  
  A practical biosignature definition must prioritize:  
  1. **Chemistry-agnostic structural complexity** (e.g., heterogeneous, non-repeating polymers).  
  2. **Disequilibrium signatures** (e.g., unexpected isotopic ratios, chiral bias).  
  3. **Unit flexibility** (applies to cells, collectives, or alien "media").  
  4. **Explicit exclusion of viruses/prions** from "life" for clarity—they’re biosignature-relevant but not the target.  

  **Trade-off**: You get alien applicability and single-sample decisiveness but surrender a unified Earth-centric theory. That’s a win for your panel’s pragmatism.
