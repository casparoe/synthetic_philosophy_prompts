prompt: |-
  I'm rebuilding my "concept of mental disorder" unit and I want to ditch the usual is-it-a-brain-disease-or-a-problem-in-living back and forth and start the students on the spec instead. So give me the desiderata: what does any adequate theory of what a mental disorder actually is have to deliver? The cases it has to classify correctly, the distinctions it can't collapse, the facts about how psychiatry really operates that it can't contradict — each with the case or consideration behind it. I want a few specific things in the list: it has to say something about the historical cases where psychiatry pathologized what we now think it shouldn't have (and the mirror cases, the ones it missed), it has to handle conditions people claim as an identity rather than an illness, and it has to be usable outside the clinic — by a court deciding on commitment, say, or an insurer deciding on coverage. Then flag the subsets you think can't be jointly satisfied; I'm pretty sure theres a naturalism-vs-something tension hiding in there and I want you to nail it down precisely. If it's quick, a couple of lines at the end on how the main contenders do against the list, but the list is the point.
