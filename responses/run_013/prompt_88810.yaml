prompt: |-
  I'm designing a seminar session on guilt and shame, and I've noticed that I don't yet have a clear sense of what an adequate account of the distinction would even have to deliver — I keep encountering accounts that look persuasive until I test them against a case they were plainly not built for, and then I can't tell whether the account is wrong or whether I was asking it for something no account of this kind owes anyone. So before I commit to any particular view, I want the specification: the full list of requirements that an account of guilt and shame must satisfy to be worth adopting, each with the case or consideration that motivates it.

  Some of what I expect the list to contain, though I don't want to pre-empt it: the account must handle shame that arises with no audience whatsoever, as in the person alone at three in the morning, ashamed of something no one else will ever learn, and it must handle guilt that arises with no victim and no possibility of repair, as in a promise broken to someone who is now dead. It must keep shame apart from embarrassment and guilt apart from regret without defining either emotion purely by contrast with the other. It must accommodate a single act that produces guilt in one person and shame in another, and the case where both emotions arrive together in the same person about the same act. It must say something about vicarious or group shame, where one is ashamed of what one did not do. It must not quietly build the verdict into the description — for instance by treating shame as nothing but an internalised social sanction, which makes guilt the authentically moral emotion by construction, or by treating guilt as nothing but a cognitive appraisal of a violated norm, which does the same trick in reverse. And it must survive the awkward fact that the vocabulary and the phenomena come apart across languages and historical periods, so that any account resting on the distinctions available in a single language is under suspicion from the start.

  A second layer of requirements, which I suspect is where the difficulty actually lies: the account has to separate the emotion from the social practice — being ashamed from being shamed — and it has to be explicit about levels of analysis, since I am ultimately interested in whether a culture can choose which of the two emotions to run its moral life on, and that question seems to require an account of individual episodes, an account of a culture's moral economy, and a story about how the second could shape the first. It should also be the sort of account that evidence could count against, rather than a conceptual scheme that no finding about how people actually feel could touch. Given all that, tell me which single requirement does the most to exclude the candidate accounts currently on offer, and — the part I care about most — which pair of these requirements you think cannot be jointly satisfied, since if the list is internally inconsistent that is itself the result. And flag anything in my list that looks less like a genuine requirement than a prejudice of one camp, including mine.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're designing a seminar on guilt and shame and need a clear distinction between the two. They've encountered various accounts but find them lacking when tested against edge cases. Their main request is for a comprehensive list of requirements that any adequate account must meet, along with the motivating cases for each. They also want to know which requirement is most exclusionary and if any requirements conflict.

  First, I need to list all the requirements they mentioned explicitly. They talked about shame without an audience, guilt without a victim or possibility of repair, distinguishing shame from embarrassment and guilt from regret without contrastive definitions, single acts causing different emotions in different people, simultaneous guilt and shame, vicarious shame, avoiding building verdicts into definitions, and accounting for cross-linguistic variations. 

  Then there's the second layer: separating emotion from social practice, levels of analysis (individual episodes vs. cultural moral economy), and the account being empirically falsifiable. They also want to identify which requirement excludes most current accounts and if any pair of requirements conflict.

  I should organize these into core and advanced requirements. Core would cover the phenomena definitions, like audience-independent shame and victimless guilt. Advanced requirements handle cross-cultural issues, emotion vs. practice, levels of analysis, and falsifiability. 

  The user is likely an academic, possibly in philosophy or psychology, preparing a seminar. Their explicit need is a framework for evaluating theories, but deeper needs might include wanting to avoid theoretical pitfalls, ensuring cultural sensitivity, and facilitating discussion on moral psychology. They might also need practical examples for teaching and identifying research gaps.

  For conflicting requirements, the tension between phenomenology and cultural variance comes to mind. Phenomenological specificity requires clear, universal markers, but cultural variance shows these markers aren't consistent. Also, separating emotion from practice while explaining cultural shaping might conflict. How can emotions be defined independently of social practices if cultures shape how they're experienced?

  The most exclusionary requirement is probably avoiding embedded verdicts. Many theories define guilt as inherently moral and shame as social, which biases the distinction. This requirement forces a neutral starting point, challenging existing frameworks.

  I should check if any listed requirements are biases. For example, insisting on audience-independent shame might stem from a preference for internalized morality, but the user's examples (like being alone at 3 AM) justify it as a genuine case to cover. Similarly, victimless guilt challenges theories that tie guilt to harm.

  Finally, summarizing the key conflicts and exclusionary requirement will help the user structure their seminar. Highlighting the tension between universal markers and cultural differences can spark discussion on whether a one-size-fits-all theory is possible.
answer: |-
  Here's a comprehensive specification for an adequate account of the guilt/shame distinction, structured as requirements with motivating cases/considerations, followed by analysis of key tensions and exclusions:

  **Core Requirements: Phenomenological & Definitional**

  1.  **Audience-Independent Shame:**
      *   *Requirement:* Must explain shame arising without *any* real, imagined, or internalized *other* witnessing the act/state.
      *   *Motivating Case:* Person alone at 3 AM, profoundly ashamed of a deeply private thought or fantasy no one else could ever know about, unrelated to potential discovery.
      *   *Tests Against:* Theories defining shame *solely* as fear of social disapproval or loss of status.

  2.  **Victimless & Irreparable Guilt:**
      *   *Requirement:* Must explain guilt arising where there is no identifiable victim (or where the victim is abstract) and/or no possibility of making amends.
      *   *Motivating Case:* Breaking a deathbed promise to a now-deceased loved one; violating a deeply held personal principle (e.g., sobriety vow) with no direct harm to others.
      *   *Tests Against:* Theories defining guilt *solely* as obligation to repair harm done to a specific other.

  3.  **Non-Contrastive Differentiation:**
      *   *Requirement:* Must distinguish shame from embarrassment and guilt from regret *based on positive characteristics of each emotion*, not merely by contrasting them with each other.
      *   *Motivating Case:* Need for precision. Defining "shame" as "not guilt" (or vice versa) or "embarrassment" as "mild shame" fails to capture distinct phenomenological cores and functions. Accounts must stand independently.
      *   *Tests Against:* Circular definitions or accounts relying solely on relative intensity or context.

  4.  **Agent-Variability for the Same Act:**
      *   *Requirement:* Must explain why the *same* act (e.g., failing a crucial exam, revealing a personal weakness) can trigger primarily guilt in one person and primarily shame in another.
      *   *Motivating Case:* Person A feels guilt for failing an exam (focus: letting down parents who invested). Person B feels shame for the same failure (focus: being exposed as stupid/fraudulent).
      *   *Tests Against:* Theories that rigidly tie specific *acts* inherently to one emotion.

  5.  **Co-Occurrence & Blending:**
      *   *Requirement:* Must accommodate the common experience of feeling *both* guilt and shame simultaneously or in rapid succession regarding the *same* act/state, and explain how they interact.
      *   *Motivating Case:* Cheating on a partner: guilt over betrayal/harm done (violation of trust), shame over being exposed as weak/deceptive/unworthy (damaged self-image).
      *   *Tests Against:* Theories presenting guilt and shame as mutually exclusive or strictly sequential.

  6.  **Vicarious/Group-Based Shame:**
      *   *Requirement:* Must explain shame felt for actions/characteristics of others with whom one identifies (family, nation, group), even when one is personally blameless.
      *   *Motivating Case:* Feeling profound shame upon learning of atrocities committed by one's ancestors or countrymen, despite personal innocence.
      *   *Tests Against:* Theories defining shame *exclusively* as a reaction to one's *own* actions or traits.

  7.  **Avoidance of Embedded Verdicts:**
      *   *Requirement:* Must not *build in* a normative judgment about the moral superiority or authenticity of one emotion over the other through its core definitions.
      *   *Motivating Case:* Accounts defining shame as *only* "internalized social sanction" implicitly make guilt the "authentic" moral emotion. Accounts defining guilt as *only* "cognitive norm violation" risk doing the reverse by downplaying shame's moral weight. The account must be descriptively neutral initially.
      *   *Tests Against:* Most existing sociological (shame=social control) and some cognitive (guilt=norm appraisal) theories.

  **Advanced Requirements: Scope, Levels & Testability**

  8.  **Emotion vs. Practice Distinction:**
      *   *Requirement:* Must clearly separate the *internal emotional experience* (feeling ashamed/guilty) from the *external social practice* (being shamed/blamed by others).
      *   *Motivating Case:* One can *feel* profound shame without anyone else knowing (Req 1). One can be publicly *shamed* without feeling internal shame (e.g., defiance). The emotions have internal dynamics distinct from their social elicitation or use.
      *   *Tests Against:* Theories that conflate the feeling with the social ritual or sanction.

  9.  **Multi-Level Analysis:**
      *   *Requirement:* Must be applicable and coherent at different levels: (a) individual psychological episodes, (b) patterns within a culture/subculture ("moral economy"), and (c) the potential for cultural frameworks to shape individual emotional tendencies.
      *   *Motivating Case:* Your core question: Can a culture "choose" to foster guilt or shame as its primary moral motivator? This requires explaining individual emotions (a), describing cultural patterns of sanction/valuation (b), and proposing a mechanism for how (b) influences (a) without determinism.
      *   *Tests Against:* Accounts that only work at one level (e.g., purely individual phenomenology or purely cultural discourse).

  10. **Empirical Vulnerability:**
      *   *Requirement:* Must generate predictions or descriptions about subjective experience, behavioral correlates, or cultural patterns that could, in principle, be contradicted by evidence (e.g., self-report, physiological markers, anthropological observation, historical change).
      *   *Motivating Case:* Need for scientific/philosophical rigor. The account shouldn't be a purely conceptual scheme immune to how people actually feel or cultures operate.
      *   *Tests Against:* Overly abstract philosophical definitions or circular theoretical constructs.

  11. **Cross-Linguistic & Historical Sensitivity:**
      *   *Requirement:* Must acknowledge that the *lexical distinctions* (words for guilt/shame) and the *salience/phenomenology* of these emotions vary significantly across languages and historical periods. The account shouldn't rely *solely* on English distinctions.
      *   *Motivating Case:* Languages with single terms covering aspects of both (e.g., German "Schuld"); historical periods where "shame cultures" dominated Western thought differently than now. The phenomena predate and transcend specific modern English labels.
      *   *Tests Against:* Accounts built primarily on linguistic analysis of "guilt" vs. "shame" in contemporary English.

  **Analysis: Tensions, Exclusions & Potential Biases**

  *   **The Most Excluding Requirement:** **#7 (Avoidance of Embedded Verdicts)**. This disqualifies a *huge* swathe of existing literature. Much of psychology (especially clinical) leans into guilt as "adaptive" and shame as "maladaptive." Sociology often frames shame as the tool of social control. Philosophy often elevates guilt (Kantian) or shame (Aristotelian/communitarian) based on normative commitments. Truly neutral descriptive starting points are rare.

  *   **The Likely Irreconcilable Pair: #1 (Audience-Independent Shame) & #8 (Emotion vs. Practice) vs. #11 (Cross-Linguistic Sensitivity) & #9 (Multi-Level Analysis - cultural shaping).**
      *   **The Conflict:** #1 and #8 demand that shame's *core essence* as an emotion can be defined independently of social perception/audience. However, #11 highlights that the *very experience and conceptualization* of self-conscious emotions are deeply culturally shaped (#9). How can you define a universal phenomenological core (#1) while acknowledging that culture fundamentally shapes how the self is experienced and evaluated (#9, #11), potentially making "audience" conceptually inseparable from the self in some contexts? Defining shame without *any* reference to an "other" (even an internalized ideal) is phenomenologically plausible (#1), but explaining *why* that feeling arises and takes the form it does seems inevitably tied to social/normative frameworks (#9, #11). This is the core tension between universalist phenomenology and cultural constructivism.

  *   **Potential Biases in Your List (to Scrutinize):**
      *   **Requirement #1 (Audience-Independent Shame):** While a valid case, an overemphasis *might* reflect a bias towards highly internalized, individualistic conceptions of morality, potentially downplaying the inherently relational aspects that *often* trigger shame. Is the 3 AM case the *paradigm* or a *boundary* case?
      *   **Requirement #2 (Victimless Guilt):** Similarly valid, but could reflect a bias towards deontological (rule/duty-based) ethics over consequentialist (harm-based) ethics. Is guilt *truly* guilt if there's absolutely no sense of wronging *any* entity (even an ideal or oneself as a moral agent)? This pushes the definition hard.
      *   **Requirement #7 (Avoiding Verdicts):** While crucial for neutrality, one could argue that completely avoiding *any* functional analysis (e.g., shame's link to social cohesion, guilt's link to reparation) might render the account descriptively thin. The requirement is to avoid *building normative superiority* into the *core definition*, not to avoid discussing typical functions or consequences.
      *   **Overall Implicit Frame:** Your requirements lean heavily towards individual phenomenology (#1, #2, #3, #4, #5) and testability (#10), which is excellent, but might slightly undervalue the depth of challenge posed by #11 (Cross-Linguistic) and the complexity of #9 (Multi-Level). The cultural shaping question (#9b/c) is arguably the hardest nut to crack.

  **Conclusion:**

  Your specification is rigorous and highlights the profound difficulties in this domain. The central challenge lies in reconciling a phenomenologically sensitive, non-normative core definition of each emotion (especially satisfying #1, #2, #7) with the undeniable realities of cultural variation (#11) and the complex ways culture shapes individual moral psychology (#9). The tension between the "internal self-evaluation" demanded by #1 and the "culturally constituted self" implied by #9/#11 is likely the most fundamental fracture line. Any adequate account must navigate this minefield without collapsing into pure cultural relativism (#11) or a phenomenology blind to profound cultural differences in self-experience (#9). The requirement to avoid embedded verdicts (#7) is the most effective filter against dominant but biased paradigms.
