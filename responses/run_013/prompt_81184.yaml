prompt: |-
  My friend sprayed a wasp nest on our porch yesterday and we ended up yelling about it for like two hours, and honestly neither of us knew what we were talking about — he kept saying "they're just bugs" and i kept saying you can't write off a whole category of beings like that, but I couldn't actually defend anything. Anyway, I run a small interview series (Zoom, very glamorous) and next week's guest is a philosopher who's spent years arguing that agricultural insecticides are one of the largest moral disasters in history — her line is basically that we're running a slaughter that dwarfs everything else and we don't notice because the victims are tiny and not cute. Can you draft me eight or nine questions that actually get somewhere, so she can't just do the "bugs probably feel something, the numbers are enormous, you're biased" routine again?

  I specifically want something on the counterfactual: most insects die young anyway, eaten or starved or dried out, so what exactly is the baseline she's comparing a sprayed field to — is it dead bug versus happy bug, or dead bug now versus dead bug a bit later, and if it's the latter does that undercut the catastrophe framing or make it worse? Something on whether an insect even has the kind of thing that can be harmed, and whether that's a question about a subject or just about which neurons fire, with a follow-up ready for when she says we can't be sure so we should be cautious — I want to press whether that caution cuts both ways. Something on sublethal effects: I read somewhere that some of these chemicals mainly wreck bees' navigation and memory rather than killing them outright, and I honestly don't know whether that makes it better or worse. And something on the fact that "pest" just means "insect competing with us," so whether that whole category is doing moral work it hasn't earned. Give me a follow-up for each question, keyed to the answer she's most likely to give, and keep it as plain prose — no headings, no bullets, no bold, nothing like that, just write it out the way you'd say it to me in an email. No reading lists or citations either, I don't need those, just the questions.
