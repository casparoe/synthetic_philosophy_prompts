answer: |-
  ## OFFICE FOR THE REGISTRATION OF CONVENTIONS (ORC)
  **Guidance Handbook: Registration Procedures & Principles (Ed. 7.2)**

  **1. Purpose & Scope**
  This Handbook outlines the statutory functions and procedures of the Office for the Registration of Conventions (ORC) under the Conventional Practices Act. The ORC determines whether proposed regularities in behaviour constitute genuine conventions eligible for registration and gazettal. Registration implies recognition *only* of conventional status; it confers no inherent authority or obligation to comply (see Section 16).

  **2. Definition of Convention (Core Criteria)**
  For the purposes of registration, a Convention is defined as a regularity *R* in the behaviour of members of a population *P* when they are agents in a recurrent situation *S*, where:
      2.1 *S* constitutes a Coordination Problem (see Section 3).
      2.2 *R* is a Coordination Equilibrium in *S* (see Section 4).
      2.3 Arbitrariness Condition: At least one other regularity *R'*, distinct from *R*, could have served as a Coordination Equilibrium in *S* (see Section 5).
      2.4 Conditional Conformity: Each agent conforms to *R* primarily because they expect others to conform, and prefer conformity to *R* conditional on that expectation (see Section 6). For the avoidance of doubt, agents conforming independently of others' actions are not relevant to establishing *R* as a Convention (Refer: Form ORC-7B, "Ritualist Declaration").

  **3. Coordination Problem (Form ORC-1A)**
  A situation *S* is a Coordination Problem if:
      3.1 Each agent has two or more possible actions.
      3.2 The outcome for each agent depends significantly on the actions chosen by others.
      3.3 There exists at least one combination of actions (an equilibrium) such that no single agent can improve their outcome by unilaterally changing their action, *given the actions of others*.
      3.4 Applications failing to demonstrate multiple potential equilibria (Form ORC-1A, Schedule B) will be rejected as non-conventions.

  **4. Coordination Equilibrium (Form ORC-2A)**
  A regularity *R* is a Coordination Equilibrium if, within *S*, *R* represents a specific combination of actions by agents in *P* that satisfies condition 3.3. The ORC takes no position on the relative efficiency, fairness, or perceived "naturalness" of *R* compared to other potential equilibria *R'*; only the existence of viable *R'* is material (see Section 5).

  **5. Arbitrariness Requirement (Form ORC-3 Affidavit)**
  Registration requires demonstration of *Arbitrariness*. This necessitates:
      5.1 Identification of at least one specific, viable alternative regularity *R'* that *could* have solved the Coordination Problem *S*.
      5.2 Submission of Form ORC-3 ("Affidavit of Alternative Viability"), attested by a representative sample of *P*, affirming that, had *R'* been established, they would have conformed to it as readily as they (would) conform to *R*. For the avoidance of doubt, hypotheticals involving only one feasible solution are inadmissible.

  **6. Conditional Conformity & Expectations (Form ORC-4A Audit)**
      6.1 Conformity to *R* must demonstrably depend upon the agent's expectation that others will conform. Agents whose conformity is unconditional (e.g., due to intrinsic preference, moral belief, or fixed ritual) are excluded from the population count relevant to establishing *R* as a Convention (Refer: Department of Ritual & Habit, Form ORC-7B).
      6.2 Registration requires a Common-Knowledge Audit (Form ORC-4A) establishing:
          *   6.2.1 Prevalence: *R* is widely practised within *P* in *S*.
          *   6.2.2 First-Order Expectations: Agents in *P* expect others in *P* to conform to *R* in *S*.
          *   6.2.3 Higher-Order Expectations: Agents in *P* expect others to expect conformity (Second-Order), and expect others to expect others to expect conformity (Third-Order), etc.
      6.3 The ORC acknowledges practical limitations. Audits are certified only up to the demonstrable level (typically Second or Third-Order Expectations). Form ORC-4A requires specification of the certified iteration level.

  **7. Jurisdictional Boundary: Conventions vs. Norms**
      7.1 The ORC's remit is strictly limited to regularities sustained *solely* by conditional conformity driven by expectations and the structure of *S* (Criteria 2.1-2.4).
      7.2 Regularities sustained or significantly reinforced by feelings of obligation, guilt, shame, internalised rules, or the threat or application of sanctions by third parties fall outside the ORC's jurisdiction.
      7.3 Such phenomena are the responsibility of the *Department for Normative Phenomena* (DNP). The DNP employs distinct methodologies focusing on internalisation, sanctioning mechanisms, and perceived legitimacy, processes the ORC does not adjudicate upon or model. Enquiries concerning normative phenomena should be directed to the DNP using their specific forms (DNP Series 1000).

  **8. Application Process (Forms ORC-5 Series)**
  Proposers must submit a complete application dossier (Forms ORC-5A to ORC-5G) detailing *P*, *S*, *R*, identified *R'*, evidence for Criteria 2.1-2.4, and the Common-Knowledge Audit results (Form ORC-4A). Incomplete dossiers will not be processed.

  **9. Publication & Gazette**
  Upon successful registration, the Convention (*P*, *S*, *R*) is assigned a unique ORC Reference Code and published in the *Gazette of Registered Conventions*. Gazettal serves as official recognition of conventional status. It does *not* constitute endorsement, recommendation, or legal requirement.

  **10. Amendment of Registered Conventions (Form ORC-6A)**
      10.1 The ORC cannot, by decision, create, abolish, or directly alter an existing Convention. Conventions arise and persist through the interdependent actions and expectations of *P*.
      10.2 Amendment applications may be submitted proposing a shift from *R* to a new regularity *R''* within the same *S* and *P*.
      10.3 Such applications must demonstrate:
          *   10.3.1 That *R''* constitutes a viable Coordination Equilibrium in *S* (see Section 4).
          *   10.3.2 That the Arbitrariness condition holds for *R''* relative to *R* (or another *R'*).
          *   10.3.3 A mechanism by which the ORC's recognition of *R''* (upon gazettal of amendment) might reasonably alter the salience of *R''* for agents in *P*, potentially facilitating a shift in expectations and behaviour (e.g., via publication). The ORC cannot guarantee such shifts will occur.
      10.4 The ORC notes that the persistence or drift of registered conventions is poorly understood. Some remain stable for decades; others evolve despite registration. The factors influencing this are not within the ORC's operational model.

  **11. Sanctions & Penalties**
      11.1 The ORC takes no position on whether any agent *ought* to comply with a registered convention. Questions of obligation, duty, or "rightness" cannot be formulated or answered within the framework administered by the ORC.
      11.2 The sole sanction available to the ORC is *Withdrawal of Registration*.
      11.3 Withdrawal of Registration (effected by Gazette Notice) signifies only that the ORC no longer recognises the regularity *R* as meeting the statutory definition of a Convention for *P* in *S*. This action:
          *   11.3.1 Does *not* prohibit the continued practice of *R*.
          *   11.3.2 Does *not* alter the actual expectations or conditional preferences of agents in *P*.
          *   11.3.3 Therefore, typically has no effect whatsoever on the continued prevalence of *R*, should it indeed be sustained by mutual expectations.

  **12. Review & Appeals (Form ORC-8A)**
  Decisions may be reviewed only on procedural grounds or if new, material evidence pertaining *strictly* to Criteria 2.1-2.4 emerges. Appeals based on the perceived desirability, morality, or efficiency of *R* are inadmissible.

  **13. Fees**
  Standard processing fees apply (Schedule ORC-FEE). The ORC is partially funded by fees; applications may experience delays due to resource constraints.

  **14. Further Guidance**
  For specific queries, consult the ORC website or contact the Helpline (limited hours). Please have your ORC Reference or Application Number ready.

  **15. Definitions (For the Avoidance of Doubt)**
  *   **Agent:** An entity capable of intentional action within *S*.
  *   **Population (P):** The defined group of agents whose behaviour is under consideration.
  *   **Recurrent Situation (S):** A type of interaction that occurs repeatedly among members of *P*.
  *   **Regularity (R, R', R''):** A discernible pattern in the choices of action made by agents in *P* when in *S*.
  *   **Salience:** The property of an option being particularly noticeable or focal to agents in a coordination problem.

  **16. Disclaimer**
  Registration by the ORC signifies *only* that a regularity meets the statutory definition of a Convention. It implies nothing regarding its moral standing, social benefit, legal status, or whether anyone *should* follow it. The ORC disclaims all liability arising from the existence, registration, or practice of any Convention.

  ---

  **Satirical Note: Liberties and Contested Ground**

  This satire rigidly implements David Lewis's seminal analysis of convention as a solution to a recurrent coordination problem, sustained by mutual expectations and conditional preferences, and marked by arbitrariness. The ORC's rules directly mirror Lewis's core criteria: coordination equilibrium, arbitrariness, and conditional conformity based on expectations.

  The piece takes liberties in several areas reflecting ongoing debates:

  1.  **Common Knowledge Stringency:** Lewis required (near) *common knowledge* of the regularity, expectations, and preferences. The satire exaggerates the bureaucratic impossibility of verifying this infinite regress ("typically Second or Third-Order"), highlighting the practical (and philosophical) problems of this demanding requirement, which many contemporary theorists find too strong. Some argue mutual belief suffices.
  2.  **The Normativity Gap:** Lewis's account is resolutely *descriptive*. The ORC's refusal to engage with "ought" (Sections 7, 11) and its sharp jurisdictional boundary with the DNP underscore the theory's inability to explain the *normative force* often felt in conventions (why we feel we *should* drive on the right). Many argue this is a critical flaw, and that conventions inherently involve normative attitudes or emerge within normative frameworks. The ORC treats this normative dimension as entirely separate and opaque.
  3.  **Mechanisms of Change & Stability:** Lewis focused on equilibrium selection via salience and precedent. The ORC's bafflement about why some conventions drift and others persist (Section 10.4), and its weak amendment mechanism (altering salience), satirize the theory's limitations in explaining dynamic change. Alternative approaches (e.g., evolutionary game theory, learning models, or accounts emphasizing social construction and power) offer richer stories about genesis and mutation, contested ground the ORC ignores.
  4.  **Arbitrariness and Efficiency:** While the ORC dismisses arguments about "naturalness" (Section 4), Lewis acknowledged that some conventions (like driving sides) are deeply arbitrary, while others (like standards) might have efficiency advantages. The satire leans towards a strict reading of arbitrariness as a defining feature. Some argue that perceived efficiency or fairness can be crucial drivers for *adopting* a convention, even if alternatives exist, potentially blurring the arbitrariness criterion in practice.

  The satire presents Lewis's core machinery as the uncontested "standard analysis" for defining conventions, which it largely remains for analytic purposes. However, it leans on contested interpretations (especially regarding the demanding nature of common knowledge and the strict separation from normativity) and highlights genuine open questions about dynamics and normative force by portraying the ORC as helpless before them. It does not present these contested views *as* consensus, but uses the bureaucratic frame to expose the limitations inherent in the Lewisian model when confronted with the messiness of social practice.
