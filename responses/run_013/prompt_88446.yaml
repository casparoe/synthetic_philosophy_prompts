  I'm a third-year cog sci student in a seminar on interpretability and I keep getting stuck on something that's prolly basic. We learned that if a linear probe trained on a layer's activations can decode some human-labeled property, that's evidence the network represents that property at that layer. But someone in class said probes can be trained to decode basically anything from basically any layer, even a randomly initialized net, so decodability by itself definately proves nothing. Now I'm confused: does that mean neural networks don't actually have representations, just information sloshing around? And if they do, how do I figure out which layer holds the real representation of something like syntactic tree depth, rather than just info a probe can pull out? I feel like I'm mashing together two different questions. Can you act as an expert in philosophy of cognitive science and ML interpretability, think carefully, and start by brainstorming the different things representation could mean here (causal role, decodable information, structural correspondence, a stance we adopt for explanation), then tell me whether my question rests on a confusion and how to ask it properly? Also, is there a name for the mistake of inferring representation from successful decoding, like a decoder's fallacy, or is that just a slogan?
