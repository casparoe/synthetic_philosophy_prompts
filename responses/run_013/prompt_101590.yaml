prompt: |-
  A friend of mine — a functional morphologist by training, and the sort of person who will give you a flat yes or no rather than a hedge — has become our group's unofficial oracle for the question whether some trait has a function, and I have been keeping a running tally of her verdicts because I increasingly suspect the tally is doing more work than any of us admits. The list so far: the vertebrate heart, pumping blood, function; the lens of the eye, focusing light, function; an enzyme catalysing its step in a metabolic pathway, function; the white winter coat of an arctic mammal read as camouflage, function; the elaborate tail of a male bird read as mate attraction, function; a trait that turns up in a cave population, appears to do nothing at all, and shows no sign of ever having been favoured, no function; and a structural byproduct — a ridge or a gap that falls out of the geometry of neighbouring parts and does no work of its own — no function. What nags at me is that every one of those six is a case where two quite different things happen to coincide: the trait has a history of being favoured for the effect in question, and the effect is something the trait currently contributes to the system it belongs to. So the six verdicts do not yet separate the family that ties function to selection history from the family that ties it to a trait's present contribution — the etiological or selected-effects family on the one side, the causal-role or systems family on the other — because on all six they agree.

  Next week we are arguing about a case that I think pulls them apart, and what I want from you is a prediction rather than a survey of the literature. Take a long-running laboratory evolution experiment — many thousands of generations, the usual frozen archive of ancestors — in which a lineage has lately evolved a modified appendage that measurably improves its swimming efficiency, in the sense that the appendage now does hydrodynamic work the ancestral form did not; the population's geneticists, however, can find no evidence that the modification was ever favoured, and the best current story is that it rode to high frequency as a hitchhiker on a beneficial mutation nearby, and may even be mildly costly on its own account. My friend will be asked, flatly, whether that appendage has a function.

  Please tell me: what she will say; which candidate rules fit the six earlier verdicts — I can see at least a selection-history rule, a present-contribution-to-a-capacity rule, and a present-fitness-contribution rule, and I suspect I am missing one — and what each predicts about the new case; your best guess at which rule she is actually running, with the reasons; and then the part I genuinely care about, namely the further case that would discriminate among whichever rules survive the new one, together with an explanation of why none of the six verdicts we already have could have done that job.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've got a friend who's a functional morphologist acting as an oracle for whether traits have functions. The user has been keeping a tally of her verdicts and notices that all six cases align both etiological (selection history) and causal-role (current contribution) theories of function. Now they're introducing a new lab evolution case where a modified appendage improves swimming but wasn't selected for—it hitchhiked. The user wants to predict the friend's answer, analyze which functional theories fit the previous cases, and propose a further case to discriminate between theories.

  First, I need to recall the two main theories of function: etiological (based on past selection) and causal-role (based on current contribution). The first six verdicts all align with both because they have both history and current contribution. The new case separates them: the appendage has current contribution (improves swimming) but no selection history (hitchhiked). 

  The user mentioned three candidate rules: selection-history, present-contribution-to-capacity, present-fitness-contribution. But I think there's a fourth: something like "selected maintenance" where even if not initially selected, if maintained by selection now, it might count. But in this hitchhiking case, it's mildly costly, so unlikely maintained. 

  For the friend's prediction: she's a strict morphologist who gives flat answers. Her previous "no function" verdicts were for traits without contribution or history. Here, the appendage does contribute currently. But she might lean towards selection history based on her training. However, the user suspects she might use a hybrid rule. But since the trait is costly, she might say "no function." Alternatively, because it performs a beneficial role now, she might say "yes." But I think her background in functional morphology emphasizes adaptation through natural selection, so she'll likely prioritize history. Prediction: "no function."

  Now, mapping the rules to the six cases. Selection-history fits all: heart selected to pump blood, lens to focus, etc. The cave trait and structural byproduct weren't selected. Present-contribution: heart pumps now, lens focuses now. The cave trait doesn't contribute, byproduct does nothing. Present-fitness-contribution: similar, but fitness is key. The bird's tail attracts mates, increasing fitness. The byproduct doesn't enhance fitness. The cave trait doesn't. 

  In the new case, selection-history says no function (no selection). Present-contribution says yes (improves swimming). Present-fitness says maybe, but it's costly, so net negative fitness, probably no. 

  The user wants a further case to discriminate remaining rules. Suppose selection-history and present-fitness both say no in the hitchhiker case. But if we have a trait with no historical selection but currently maintained by selection for its effect. For example, a trait that arose neutrally, but now provides a benefit in a new environment, leading to its maintenance. Selection-history might still say no if it wasn't initially selected, but present-fitness would say yes because it's currently advantageous. Present-contribution would say yes. 

  But the hitchhiker case already separates selection-history from present-contribution. The further case needs to separate present-fitness from selection-history. The trait maintained by selection now but without historical origin fits that. The user's six cases didn't have this scenario. 

  Also, the user might care about deeper issues: the ambiguity in "function," how scientific disciplines differ (morphology vs. genetics), and the role of intuition versus theory. The user's suspicion that the tally is doing more work suggests they want to expose underlying assumptions. The further case could reveal if the friend is consistent or if context influences her verdicts.
answer: |-
  Here's a prediction for your friend's verdict, an analysis of the candidate rules, and a discriminating further case designed to resolve ambiguity:

  1.  **Your friend's predicted verdict:** **No function.**  
      *   **Reasoning:** As a functional morphologist emphasizing evolutionary history/adaptation, she'll prioritize the *absence* of selection history ("no evidence it was ever favoured," "rode as a hitchhiker," "mildly costly"). The current hydrodynamic benefit is irrelevant to her core definition, mirroring her verdict on the cave trait (no history of being favoured) and the structural byproduct. The appendage's benefit is likely seen as a fortuitous accident, not its "function."

  2.  **Candidate Rules Fitting the Six Verdicts:**
      *   **Selection-History (Etiological/SE) Rule:** Function = trait was *shaped/maintained* by natural selection *for* that effect.  
          *   *Fit:* All six fit perfectly. Heart (selected for pumping), Lens (selected for focusing), Enzyme (selected for catalysis), Camouflage (selected for concealment), Tail (selected for attraction), Cave trait (not selected *for* anything), Byproduct (not selected *for* anything).
          *   *New Case Prediction:* **No function.** No evidence of selection *for* the hydrodynamic work. Hitchhiking means the trait wasn't the target of selection.
      *   **Present-Contribution-to-a-Capacity (Causal-Role/CR) Rule:** Function = trait *currently contributes* to a specified capacity/activity of the containing system/organism.  
          *   *Fit:* All six fit. Heart (contributes to circulation), Lens (contributes to vision), Enzyme (contributes to metabolism), Camouflage (contributes to predator avoidance), Tail (contributes to mating success), Cave trait (contributes to nothing), Byproduct (contributes to nothing). The "capacity" (e.g., vision, metabolism) is inherent in the description.
          *   *New Case Prediction:* **Function.** It *currently* "measurably improves swimming efficiency" and "does hydrodynamic work." It contributes to the locomotion capacity.
      *   **Present-Fitness-Contribution (Dispositional/Propensity) Rule:** Function = trait *currently enhances* the fitness (survival/reproduction) of its bearer *by* producing a specific effect.  
          *   *Fit:* All six fit. Heart (enhances fitness via circulation), Lens (enhances fitness via vision), Enzyme (enhances fitness via metabolism), Camouflage (enhances fitness via survival), Tail (enhances fitness via mating), Cave trait (no fitness enhancement), Byproduct (no fitness enhancement).
          *   *New Case Prediction:* **No function (or ambiguous, but likely no).** While it improves swimming (potentially fitness-enhancing), it's "mildly costly on its own account." The *net* current fitness effect might be negative or negligible. Crucially, its presence isn't *due to* its fitness contribution (it hitchhiked). It lacks the *propensity* to be maintained *by* its effect.
      *   **The Fourth Rule (Hybrid/Maintenance SE):** Function = trait *is currently maintained* by natural selection *because of* its effect (even if not initially selected for it).  
          *   *Fit:* All six fit. Heart (maintained *because* it pumps), Lens (maintained *because* it focuses), etc. Cave trait (not maintained *for* any effect), Byproduct (not maintained *for* any effect). This rule focuses on *current* selective maintenance rather than historical origin.
          *   *New Case Prediction:* **No function.** The trait is described as "mildly costly on its own account." If it's costly and its benefit doesn't outweigh the cost, selection is *not* actively maintaining it *because* of the hydrodynamic work; it's either neutral or slightly deleterious. Its frequency is a legacy of the hitchhiking event, not current selection for swimming.

  3.  **Best Guess for Your Friend's Actual Rule:** **Selection-History (Etiological/SE) Rule.**  
      *   **Reasons:**  
          *   Her training in functional morphology strongly emphasizes evolutionary adaptation and history.
          *   Her "flat yes/no" style suggests a principled, definitional approach, common in SE accounts.
          *   Her "no function" verdicts hinge on the *absence of selection history* (cave trait, byproduct), not the absence of current effects (the byproduct *could* have an effect, but it wasn't selected for it). The new case similarly lacks selection history *for the effect*.
          *   She readily attributes function to mate attraction/camouflage, effects central to SE definitions. Her focus is on "why the trait is there," answered by selection history.

  4.  **The Discriminating Further Case: The Currently Maintained Exaptation.**  
      *   **Scenario:** A trait (Trait X) arose in a population purely due to random genetic drift (no selection *for* any effect of X). Initially, X had no significant positive or negative effect. Later, the environment changed drastically. In the new environment, Trait X provides a significant survival advantage (e.g., confers resistance to a new toxin). As a result, natural selection *actively maintains* Trait X in the population *because of* this survival advantage. It is not costly. Genetic analysis confirms the initial neutral origin and the subsequent shift to being under positive selection *for* the survival advantage.
      *   **Why it Discriminates:**
          *   **Selection-History (SE) Rule (Original):** **No function.** The trait was *not* shaped or originally selected *for* the survival advantage (it arose neutrally). The *historical origin* lacks the "for-ness."
          *   **Present-Contribution-to-Capacity (CR) Rule:** **Function.** It *currently contributes* significantly to the survival capacity of the organism in its environment.
          *   **Present-Fitness-Contribution Rule:** **Function.** It *currently enhances* fitness *by* conferring the survival advantage. Its presence *is now* due to this propensity.
          *   **Hybrid/Maintenance SE Rule:** **Function.** It *is currently maintained* by natural selection *because of* its survival advantage. The *current reason* for its presence is its effect.
      *   **Why the Original Six Couldn't Do This Job:** All six cases involved traits where the presence/absence of historical selection *for the effect* coincided perfectly with the presence/absence of a significant current contribution to fitness or a key capacity. The hitchhiker case separates *historical origin* from *current contribution*. The "Currently Maintained Exaptation" case separates *historical origin* from *current selective maintenance*. It directly tests whether "function" requires an original selective history *for that effect* (Original SE says no) or if current selective maintenance *for the effect* is sufficient (Maintenance SE says yes), while also contrasting with the purely dispositional (Present-Fitness) and contribution-based (CR) views. None of the original six presented a trait with a clear, significant, *currently selected-for* effect that *lacked* an original selective history *for that effect*.

  **In summary:** Predict your friend will say **No function** to the hitchhiker appendage based on her likely use of a **Selection-History (SE) rule**. The **Currently Maintained Exaptation** case is needed to definitively distinguish between the Original SE view (prioritizing historical origin) and the Maintenance SE/CR/Present-Fitness views (which prioritize current utility or maintenance) when these aspects are decoupled.
