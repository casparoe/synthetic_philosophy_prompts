answer: |-
  Here’s a reading of *Atonement* through the paradox of fiction, taking your constraints seriously. I’ll move chronologically through the novel’s structure, tying each key moment to the philosophical tensions you described.

  ### **Part One: The Lie and Its Consequences**  
  Briony’s false accusation isn’t inert make-believe—it weaponizes fiction’s emotional mechanics. When she interprets Robbie’s note as a threat, she *feels* genuine fear and outrage, mistaking her narrative (the "maniac" archetype) for reality. Her emotion is occurrent and visceral—a pang of horror at a danger she believes real. Yet the reader experiences a parallel occurrent emotion: dread for Robbie, *knowing* he’s fictional but viscerally reacting to the injustice. This clashes with Radford’s "quasi-emotion" view. If our pity were mere play-acting, why does Robbie’s arrest feel like a punch? McEwan shows fiction’s power lies in its ability to trigger *real* physiological and cognitive responses—tightened chest, racing thoughts—even as we cognitively reject its reality. The standing attachment forms here too: we carry Robbie’s fragility with us between readings, a lingering unease that persists precisely *because* he isn’t real. His fate feels fixed, unalterable, and thus tragically weightier.

  ### **The War Sections: Sustained Grief and Moral Resistance**  
  Robbie’s suffering in France deepens the paradox. We’re moved by his physical pain, his memories of Cecilia—emotions amplified because we’ve inhabited his perspective. Yet when Briony appears as a nurse, seeking penance, a critical shift occurs. We feel occurrent sympathy for her guilt (her raw shame is palpable) but *resist* her moral redemption. This is where imaginative resistance diverges from emotional surrender. McEwan forces us to judge Briony’s *real* crime (her lie had concrete, irreversible consequences) while denying us the catharsis of forgiving her. Emotionally, we’re vulnerable to her anguish; morally, we reject her narrative of atonement. The novel thus exposes emotion and moral judgment as distinct layers: we *feel* for Briony’s regret (occurrent pity) but refuse to accept her equation of suffering with absolution (moral resistance). Fiction can simulate the first but cannot compel the second.

  ### **The Reunion and the Twist: Second-Order Anguish**  
  The reunion scene is the paradox incarnate. Before the twist, we experience uncomplicated occurrent joy: Robbie and Cecilia reunited, wounded but whole. It’s a cathartic release after years of narrative tension. Then, the reveal: this moment is Briony’s invention, written decades later. Here, the emotion transforms. The initial pang (joy for the lovers) collapses, replaced by a *meta-emotion*—grief for the fictionality itself. This isn’t pity for Robbie or Cecilia; it’s anguish for the fact that they *never got this moment*, that reality was crueler than Briony’s lie. Crucially, this second-order sorrow is *more* intense because we’d already invested in the reunion. The novel shows that fictional emotions aren’t inert—they scaffold deeper, reflexive feelings about artifice and loss. Briony’s "gift" of a happy ending feels like a further betrayal, not because it’s fake, but because it highlights the irreparable real damage. Fabricated happiness, the novel argues, is a wrong when it obscures truth—yet we’re still moved by its beauty. This fractures both theories: the quasi-emotion view can’t explain why the invented reunion hurts *more* after we know it’s false, while the "real emotion" view must account for our anger at Briony’s fabrication—an emotion directed at fiction-making itself.

  ### **What *Atonement* Adds to the Debate**  
  The novel uniquely demonstrates that **time** and **narrative immersion** transform the paradox. Our standing attachment to characters (Robbie’s resilience, Cecilia’s fury) accrues over the novel’s span, making the final twist a violation of that relationship. Philosophy often treats fictional emotions as atomic moments, but *Atonement* reveals them as layered and temporal. The meta-emotion post-reveal isn’t a logical contradiction—it’s the grief of disillusionment, real as any betrayal. Fiction isn’t emotionally inert because it reshapes our affective landscape; Briony’s lie ruins lives, her fabricated reunion alters our mourning. The novel also resolves the resistance paradox: we cry for fictional suffering because emotion responds to *simulated experience* (which feels immediate), but resist moral claims because they require *belief in actual stakes*. We condemn Briony’s real-world act while weeping for her fictional victims.

  ### **Where My Reading Might Fail**  
  I’d reconsider if a scene undermined the distinction between occurrent and meta-emotion. For example, if Briony’s dementia revelation (in some readings) made her final act seem pitiable rather than manipulative, the meta-emotion might collapse back into simple pity, weakening the second-order argument. Similarly, if the reunion felt emotionally hollow *before* the twist—if readers saw it as contrived—the pivot to meta-grief would lose force. My reading assumes cognitive appraisal theory (emotions involve evaluative judgments), which the novel supports by showing Briony’s guilt as both felt and judged. But if you reject that theory, the standing attachment I describe might seem like sentimental projection, not real emotion. The twist isn’t a trick; McEwan seeds it early (Briony’s drafts, her confession that "a storyteller’s atonement" is all she has). Its power comes from retroactively deepening our investment—proof that fictional emotions compound, not dissipate, under scrutiny.

  In the end, *Atonement* insists that fiction’s emotions are real because they alter us: they leave residue, demand reflection, and—like Briony’s lie—can break and remake worlds. The paradox isn’t solved but deepened—and in that depth, we find why we cry.
