  Okay, let me start by really understanding what the user is asking. They've been reporting on long-horizon economic issues like climate change and nuclear waste, and they keep noticing this move where people use a single discount rate but switch justifications depending on the objection. The user points out that when challenged, people don't defend pure time preference but instead bring up risk or uncertainty. Then, they slip back into using the same rate as if it were about time preference. The user wants to know if there's a name for this maneuver or if they need to coin one.

  First, I need to unpack the core problem. The user is frustrated because the same number is used flexibly, masking different underlying reasons. The key issue is the equivocation between risk-based discounting (uncertainty about the future), opportunity cost (foregone returns), and pure time preference (valuing the future less). Each justification is valid in certain contexts, but using one rate that's defended interchangeably allows the rate to appear neutral while potentially embedding controversial assumptions like pure time preference without scrutiny.

  The user mentions examples in pension funds and sovereign wealth debates. In those cases, a rate justified by investment returns is applied to future generations who can't invest. That's a critical point—applying opportunity cost logic to entities that don't have the same opportunities. So the problem isn't just the switching, but the inappropriate application across different contexts.

  I recall economic terms like "discount rate," but the user is aware of pure time preference and uncertainty discounting. They need a term for the rhetorical sleight of hand. Words like "motivated reasoning" or "equivocation" come to mind, but those are too broad. Maybe something more specific? "Justification laundering" or "discount rate shell game"? The latter captures the deception aspect, but I should think about established terms.

  Checking economic literature: Ramsey formula breaks discount rate into components. But the user's issue is when practitioners conflate these components under a single rate. Terms like "conceptual slippage" might work. "Conflative discounting" could be another option, emphasizing the merging of distinct concepts.

  The user wants clear boundaries: what counts as an instance vs. ordinary disagreement. So defining criteria is crucial. The key indicators are: same numerical rate used, justification switches (risk to opportunity cost to time preference), and the switch happens in response to objections. Ordinary disagreement would involve arguing over the correct rate without changing justifications mid-debate. Honest discounting separates the components transparently.

  Also, the user might have deeper needs. They're a reporter looking to accurately describe this tactic, possibly to call it out in their work. They need a precise term to make the issue recognizable and debatable. Coining a term gives them a tool for critique. They might also seek validation that this is a legitimate problem, not just semantic.

  Potential terms:
  - **Discount Rate Shell Game**: Emphasizes deception, three-card monte analogy.
  - **Justification Laundering**: Like money laundering, hiding the true reason.
  - **Conflative Discounting**: Merging distinct reasons into one rate.

  Among these, "discount rate shell game" feels vivid and memorable. It clearly conveys the shifting justifications. Defining it precisely: the practice of defending a single discount rate by opportunistically invoking different rationales (risk, opportunity cost, time preference) without reconciling their distinct implications or specifying their relative weights, thereby masking the true normative assumptions.

  Boundaries: It's an instance when the same rate is defended with switched justifications in one discussion. Ordinary disagreement is when parties stick to their rationale. Honest discounting transparently decomposes the rate or applies context-appropriate justifications.

  I think the shell game metaphor works best. It's accessible, highlights the deception, and fits the pattern described. The user can use this term to call out the practice and push for transparency in discounting discussions.
answer: |-
  Based on your meticulous description, the phenomenon you're observing is a well-recognized (and often criticized) **conceptual slippage** in discounting practice, but it lacks a single, universally accepted name. It's more than mere disagreement; it's a **rhetorical maneuver that exploits the multi-dimensional nature of discounting to defend a single numerical rate with inconsistent justifications.**

  The most precise and descriptive term for this specific pattern is:

  **The Discount Rate Shell Game**

  ### Definition & Core Characteristics
  The Discount Rate Shell Game occurs when:
  1.  A **single numerical discount rate** (e.g., 3%, 5%) is persistently used to value future costs/benefits.
  2.  When challenged on the *normative implications* (e.g., "Why value future lives less?"), the defender **invokes a "safe" justification** unrelated to pure time preference, typically:
      *   **Risk/Uncertainty:** "We might not be here," "Future preferences are unknown," "Catastrophe could occur."
      *   **Opportunity Cost of Capital:** "Money invested today could grow at rate X, so future sums are worth less *in present consumption/investment terms*."
  3.  Once the immediate objection is neutralized, the **same numerical rate is then tacitly or explicitly reapplied** *as if it represented a pure time preference rate* (the claim that future utility intrinsically matters less simply because it occurs later) when evaluating long-term impacts, particularly on future generations.
  4.  **Crucially, the defender avoids quantifying the distinct components** (risk premium, opportunity cost, pure time preference) within their chosen rate. The single number masks the underlying normative assumptions, allowing it to perform controversial work (pure time preference) under the guise of uncontroversial rationales (risk, opportunity cost).

  ### What Counts as an Instance?
  *   **Defining Pattern:** The *switching of justification* in direct response to a challenge, followed by the *unchanged application* of the rate for broader valuation, is essential.
  *   **Key Indicator:** The defender readily abandons the claim that the rate *represents* pure time preference when challenged on its ethics, but then *uses* the rate in contexts where its *effect* is indistinguishable from pure time preference (e.g., valuing lives saved in 200 years).
  *   **Your Examples:**
      *   A climate economist defends a 5% rate against ethical objections by citing uncertainty over future technology/population, then uses that same 5% rate to heavily discount damages to future generations born into a *known* climate-altered world.
      *   A pension fund trustee justifies a discount rate based on expected portfolio returns (opportunity cost), then uses that *same rate* to compare the well-being of current retirees vs. future retirees decades hence, where the "investment" analogy breaks down for the future cohort's welfare.

  ### Boundary with Ordinary Disagreement
  *   **Ordinary Disagreement:** Involves arguing *within* a consistent framework. E.g., "Based *only* on opportunity cost, the rate should be 4% because XYZ market return," vs. "No, it should be 3% because ABC market factors." Or, "The pure time preference rate should be 0.1% on ethical grounds," vs. "It should be 1% due to extinction risk." The rationale remains stable; the debate is about the *correct value* under *that* rationale.
  *   **The Shell Game:** The *rationale itself changes* to deflect criticism while the *number stays fixed*. The disagreement isn't over the *level* of risk or opportunity cost, but over the *sleight of hand* in using one justification to shield the number while employing it under another.

  ### Boundary with Honest Discounting Components
  *   **Honest Uncertainty/Risk Discounting:** Explicitly quantifies the probability of different future states (e.g., catastrophe probability, uncertainty over future growth) and applies state-specific discounting or calculates expected net present value (NPV) *using rates appropriate to each state*. The risk component is separated and quantified.
  *   **Honest Opportunity Cost Discounting:** Explicitly states that the discount rate reflects the marginal productivity of capital *in the present economy* and is used *only* for projects competing for that capital. It does *not* claim this rate reflects the relative social value of utility across generations.
  *   **Honest Pure Time Preference:** Explicitly defends a positive rate solely on the normative (and controversial) grounds that the well-being of future individuals *intrinsically* matters less than the well-being of present individuals. This is rare and usually ethically indefensible for long horizons.
  *   **Honest Decomposition (Ramsey Approach):** Acknowledges the discount rate (`r`) is the sum of distinct components: `r = ρ + θg`
      *   `ρ` (rho): Pure Rate of Time Preference (ethical parameter: valuing future utility less simply because it's future).
      *   `θ` (theta): Elasticity of Marginal Utility of Consumption (how much value diminishes as consumption increases).
      *   `g`: Expected growth rate of per capita consumption (reflects opportunity cost - future generations are richer).
      *   **Crucial Distinction:** Honest practitioners *quantify* or *defend specific values* for `ρ`, `θ`, and `g` (or their equivalent risk-adjusted versions). The Shell Game *avoids* this decomposition, using the single `r` number flexibly.

  ### Why "Discount Rate Shell Game"?
  *   **Shell Game Analogy:** Like the carnival trick where a pea is hidden under one of three shells shuffled rapidly. Here, the "pea" (the controversial pure time preference component) is hidden by rapidly shifting the "shell" (the justification - risk, opportunity cost) under which the single numerical rate is defended.
  *   **It captures the deception:** The maneuver relies on distracting the observer from the underlying normative assumption by swapping the justification.
  *   **It highlights the performative contradiction:** The rate defended as prudent risk management or sound finance quietly performs the ethically dubious work of pure time preference.
  *   **It emphasizes the fixed number:** The core of the trick is keeping the *same number* while changing its *claimed meaning*.

  ### In Summary
  You've identified a pervasive **Discount Rate Shell Game**: the opportunistic defense of a fixed discount rate by invoking distinct, incompatible rationales (risk, opportunity cost, pure time preference) interchangeably to neutralize criticism, while avoiding transparent decomposition. This allows the rate to embed ethically controversial pure time preference under the guise of technical, uncontroversial factors like risk or market returns, particularly when valuing impacts on distant future generations who lack the capacity for "investment" or "risk-bearing" in the present sense. The boundary lies in the *consistent rationale* and *willingness to decompose* the rate – the Shell Game relies on avoiding both.
