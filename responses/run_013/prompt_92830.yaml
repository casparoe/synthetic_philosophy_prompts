prompt: |-
  For several years I have taught a seminar on privacy, and I have come to suspect that my verdicts on the cases I use there cannot all be right. I set them out as flatly as I can, with the verdicts I actually hold.

  1. A houseguest opens the drawer in which I keep a journal and reads it. A serious violation.
  2. I leave the same journal on a park bench; a passerby reads a page and puts it back. A violation, though a mild one: I feel wronged, and would be embarrassed to complain.
  3. A retailer, working only from my purchase record, infers that I am pregnant and sends me coupons for baby goods. No one read anything I wrote. A violation, and not a mild one.
  4. My neighbour, through a thin wall, overhears me say at ordinary volume that I am pregnant. Not a violation.
  5. The same neighbour presses a glass to the wall, listens, and records me. A violation, and worse than 4, though he learns no more there.
  6. I send my DNA to a genealogy service and accept terms permitting the company to share data with partners. The police later identify me through it as a relative of a suspect. A violation, notwithstanding the terms.
  7. The police recover my DNA from a cup I threw into a public bin. A violation, though the police photographing me as I walk down the street is not one.
  8. A company photographs that same street, matches every face to a name, and assembles a file of my movements. A violation, though it adds nothing to what was already publicly visible.
  9. My clinic passes my record among the clinicians treating me. Not a violation. The same clinic sells the record to a data broker. A violation.
  10. A friend asks to read something personal of mine, and I hand it over. Not a violation; my consent settles it.

  Two principles keep presenting themselves, and I cannot get either to sit still.

  The first is the concealment principle: a violation occurs when information about me reaches someone only by his overcoming a barrier I put up to keep it from him. This gets 1, 4, 10, and the innocent halves of 7 and 9. It calls 2, 3, 5, 6, the DNA half of 7, 8, and the sale in 9 no violations at all, unless one counts the wall in 5 as a barrier I put up, which I resist: I did not build the wall, and I did not lower my voice. Everything it discards is a case in which nothing was hidden.

  The second is the consent principle: a violation occurs when information about me reaches someone in a way I would not have agreed to, had I been asked in advance, cheaply and honestly. This gets every verdict but 4, and perhaps the second half of 7 as well, since I would not have agreed to be photographed in the street either, though I am unsure whether in that case I am reporting what I would prefer or what I could reasonably refuse. It also threatens to be empty, since almost anything I would rather not have happen is something I would not have agreed to; and it says nothing about degree, though I hold 2 to be mild and 3 serious, and 5 worse than 4.

  What I want is the principle, or the smallest set of principles, that best accounts for these ten verdicts: stated precisely, with each clause tied to the case that motivates it. I am not asking for a survey of the literature; I want a formulation I can state, defend, and apply. Tell me which of my verdicts it cannot keep, and why I should give that one up rather than add a clause. If something must go, I would rather keep 3, 5, 6, and 8 and sacrifice 2. Then tell me what your principle predicts for three cases I have not put to you: a journalist publishes a true and newsworthy fact about me that a source obtained by reading my private correspondence; a hospital sells de-identified records of my treatment to a researcher; and my insurer offers me a discount for wearing a wristband that reports my sleep, which I accept.
reasoning: |-
  Hmm, the user presents an intriguing philosophical puzzle about privacy violations based on their seminar teaching experience. They've listed 10 specific cases with their intuitive verdicts, and are struggling to reconcile them with two principles they've identified: the concealment principle and consent principle. Both principles conflict with some of their judgments.

  Looking at their verdicts, I notice several patterns. Cases involving active intrusion (like reading a journal in a drawer) are clearly violations, while accidental exposure (like neighbor overhearing) isn't. Commercial use of personal data (retailer inferring pregnancy, data brokerage) consistently registers as violations regardless of consent forms. The police DNA cases show interesting nuance - discarded DNA feels violating while street photography doesn't, even though both are in public.

  The concealment principle fails most dramatically on cases 3 and 8 where no physical barrier exists but strong violation is felt. The consent principle is too broad, labeling nearly everything as violation. The user hints they'd sacrifice case 2 (mild violation of reading journal on bench) to preserve stronger intuitions in 3,5,6,8.

  For a better framework, I propose combining three elements: reasonable expectations, relationships, and purpose. Reasonable expectations cover physical barriers and social norms. Relationship-based duties explain why clinicians sharing records internally isn't violating but selling them is. Purpose limitations clarify why police can photograph publicly but not create movement databases - the latter exceeds ordinary observation.

  For their new cases: The journalist publishing stolen correspondence should be violation due to the source's breach. Hospital selling de-identified records isn't violating if truly anonymized. The insurer wristband isn't violating with consent, unless the consent wasn't truly informed.

  The key insight is that privacy isn't just about secrecy or consent, but about contextual integrity of information flows - who gets what data, how they get it, and why they use it.
answer: |-
  Based on your verdicts and the shortcomings of the concealment and consent principles, the following principle best accounts for your judgments while maintaining conceptual coherence. It rests on **three core elements**:

  **The Contextual Integrity Principle:**
  *A privacy violation occurs when information about me is accessed, used, or disclosed in a manner that breaches a normatively significant context-relative expectation concerning the relationship between the parties, the nature of the information, and the purpose of the transfer.*

  **Breaking Down the Principle & Applying it to Your Cases:**

  1.  **"Normatively significant context-relative expectation":** This replaces the overly rigid "barrier" of concealment and the subjective "would not have agreed" of consent. It focuses on *reasonable social expectations* within a specific context (home, public park, commercial transaction, medical care, police investigation, friendly interaction).
  2.  **"Relationship between the parties":** This distinguishes between roles (host/guest, neighbor/neighbor, company/customer, doctor/patient, police/citizen, friend/friend) and the duties inherent in those roles.
  3.  **"Nature of the information":** Recognizes that sensitivity matters (journal vs. public face, pregnancy inference vs. purchase record, DNA sequence vs. trash location).
  4.  **"Purpose of the transfer":** Distinguishes between purposes consistent with the relationship/context (medical treatment, casual observation, consented sharing) and inconsistent ones (commercial exploitation, forensic investigation, voyeurism, compiling dossiers).

  **Applying the Principle to Your Cases:**

  1.  **Houseguest reads journal in drawer:** **Violation.** *Expectation:* High privacy expectation within home; drawers signal intended concealment. *Relationship:* Guest owes duty of respect for host's private spaces. *Purpose:* Intrusive curiosity.
  2.  **Passersby reads journal on bench:** **Mild Violation (as you hold).** *Expectation:* Low expectation of privacy for items intentionally left in public, *but* high sensitivity of information creates a residual norm against reading deeply personal items found in public. *Relationship:* Stranger. *Purpose:* Intrusive curiosity. (*This is the verdict you are willing to sacrifice, but the principle can accommodate its mildness: the expectation is low, but the sensitivity/purpose breach creates the mild wrong.*)
  3.  **Retailer infers pregnancy:** **Serious Violation.** *Expectation:* Expectation that purchase data is used for transactional purposes (fulfilling *this* order, inventory, basic loyalty), not highly sensitive profiling and targeting. *Relationship:* Commercial; duty limited to transactional use without deep inference/surveillance. *Purpose:* Exploitative marketing, exceeding reasonable commercial context.
  4.  **Neighbor overhears ordinary speech:** **Not a Violation.** *Expectation:* Reasonable expectation that ordinary-volume speech *might* be overheard through standard walls in residential settings (implied risk of proximity). *Relationship:* Neighbors; no duty to soundproof beyond norms. *Purpose:* Merely hearing what is openly transmitted.
  5.  **Neighbor eavesdrops with glass/records:** **Serious Violation (worse than 4).** *Expectation:* Reasonable expectation that neighbors won't *actively enhance* their ability to hear private conversations using tools, turning casual risk into deliberate surveillance. *Relationship:* Neighbor; active spying breaches neighborly trust. *Purpose:* Deliberate intrusion/voyeurism.
  6.  **Police ID via genealogy service (despite terms):** **Violation.** *Expectation:* Normative expectation that submitting DNA for genealogy does not imply consent for unrestricted law enforcement fishing expeditions (context mismatch). *Relationship:* Commercial genetics service; duty is to genealogical matching, not becoming a police DNA dragnet. *Purpose:* Forensic investigation fundamentally incompatible with the purpose for which the data was originally provided, even if technically permitted by opaque terms.
  7.  **Police DNA from public trash cup:** **Violation.** Photos in street: **Not a violation.** *DNA:* *Expectation:* Low expectation of privacy for trash *contents*, but high expectation that DNA itself won't be extracted and sequenced for forensic identification without cause. *Relationship:* Police/Citizen; requires higher justification than casual observation. *Purpose:* Forensic profiling exceeds the purpose of discarding trash (waste disposal). *Photos:* *Expectation:* Reasonable expectation of being observed/photographed incidentally in public. *Relationship:* Police/Citizen; ordinary surveillance is part of public life. *Purpose:* General observation within public norms.
  8.  **Company compiles public movement dossier:** **Violation.** *Expectation:* Reasonable expectation that while individual movements in public *may* be seen, one will not be *systematically tracked, identified, and profiled* across time and space by private entities. *Relationship:* Private Company/Citizen; no legitimate relationship/purpose justifies mass surveillance. *Purpose:* Creating a pervasive tracking system fundamentally alters the nature of "being in public" and breaches the contextual norm of anonymity in the crowd.
  9.  **Clinicians share record for treatment:** **Not a violation.** *Expectation:* Core expectation that healthcare providers share necessary information for treatment within the care team. *Relationship:* Doctor/Patient; duty of care requires sharing for treatment. *Purpose:* Directly related to providing care. **Sell to broker: Violation.** *Expectation:* Expectation that medical records are used for health purposes, not commercial exploitation. *Relationship:* Doctor/Patient; duty of confidentiality breached for profit. *Purpose:* Commercial, entirely unrelated to healthcare.
  10. **Friend reads with consent:** **Not a violation.** *Expectation:* Expectation that sharing with trusted individuals is permissible *with consent*. *Relationship:* Friend/Friend; sharing personal info is part of friendship norms. *Purpose:* Consented sharing within the trusted relationship.

  **How it Solves the Problems:**

  *   **Beats Concealment:** Captures violations where no physical barrier was overcome but context was breached (3, 6, 8, 9-sale). Explains why overcoming a barrier *is* often a violation (breaches expectation of concealment). Rejects the idea that leaving something in public (2, 7-DNA source) means *all* expectations are gone (sensitivity/purpose matter).
  *   **Beats Consent:** Avoids subjectivity and emptiness by grounding the norm in *reasonable contextual expectations*, not hypothetical preferences. Explains *why* you "would not consent" in some cases (because they breach context) and why you might in others (they fit the context). Explains degrees: breaches involving sensitive info (3), active spying (5), systemic tracking (8), or exploitation (9-sale) are worse than mild breaches of residual expectations (2). Explains why you *do* consent in 10 (it fits the friend context).
  *   **Accommodates Your Priority:** Keeps 3, 5, 6, 8, 9-sale as violations. Can accommodate your willingness to sacrifice 2's violation status (low expectation in public, mild sensitivity/purpose breach) if needed, but explains its mildness well.

  **Predictions for New Cases:**

  1.  **Journalist publishes true/newsworthy fact obtained via stolen private correspondence:**
      *   **Violation.** *Expectation:* High expectation that private correspondence remains confidential. *Relationship:* The source breached a fundamental duty (trust, possibly legal) by reading the correspondence. The journalist benefits from this breach. *Purpose:* While publication might serve public interest, the *means* of obtaining the information (breaching the contextual integrity of private correspondence) is a violation. The newsworthiness doesn't cleanse the initial violation, though it might create a separate justification for publication *despite* the violation.
  2.  **Hospital sells de-identified records of my treatment to a researcher:**
      *   **Not a violation, *IF* de-identification is robust and secure.** *Expectation:* Reasonable expectation that truly de-identified data (where re-identification risk is very low/non-existent) can be used for research without violating individual privacy, as the link to the *individual* is severed. *Relationship:* Hospital/Patient; duty of confidentiality pertains to *identifiable* information. *Purpose:* Legitimate research purpose consistent with societal benefits of medical advancement using aggregated, non-identifiable data. **BUT:** If de-identification is weak or easily reversible (e.g., rare disease, small geographic area), it becomes a **Violation**, as the expectation of non-identifiability is breached.
  3.  **Insurer offers discount for sleep-tracking wristband I accept:**
      *   **Not a violation.** *Expectation:* Expectation that if you voluntarily accept a device and discount in a commercial agreement, the data collected under that agreement is used per the terms. *Relationship:* Insurer/Customer; transactional relationship where conditional discounts based on behavior/data are becoming normalized (though ethically debated). *Purpose:* Directly related to the risk assessment/discount program you consented to participate in. **Crucially:** This assumes the consent was *informed* (you understood what data was collected and how used) and not unduly coerced (the discount isn't the *only* affordable option, making refusal practically impossible). If consent wasn't truly informed or was coerced, it becomes a **Violation** due to the breach of contextual fairness in the agreement.
