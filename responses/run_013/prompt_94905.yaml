prompt: |-
  I am a novelist, about two-thirds of the way through a book whose central character is offered the chance to learn any single fact about his own life, and I have discovered that the hardest part of writing him is deciding which facts he should want and which he should refuse. That difficulty has left me with a set of intuitions about the value of information that I would like you to treat as data. Please take up the role of a professional philosopher and decision theorist, and treat me as a subject who has reported his verdicts on a battery of cases rather than as someone with a theory he wants defended. Here they are. A free weather forecast on the morning of an outing I can still cancel or rearrange: I want it, obviously. A friend who has read the novel I am halfway through offers to tell me how it ends, and I will finish it tonight in any case: I would pay him a small sum to keep quiet. A coin already flipped to settle a bet I have locked in and cannot alter: I am entirely indifferent to being told which way it fell. A free test for a condition that, caught now, I can be treated for: I want it. A free test for a condition that is untreatable and will kill me in about four years, but that would let me stop working and spend the time deliberately: I want it. A free test that would name, to the day, when and how I will die, which nothing I do can change: I do not want it, and would pay to avoid it, even though I concede it might let me plan. Learning whether a long-dead great-uncle's scandal was true, a thing I can do nothing about and that would only recolor my memory of childhood: I do not want it. And then the case I keep going back and forth on: whether I will eventually lose my marriage, in a world where I cannot change the outcome, only know it in advance.

  Now, I have read enough to know that a result — I believe it is called Good's theorem — seems to make half of these verdicts irrational. As I understand it: for anyone who maximizes expected utility, the expected value of costless information is never negative, because a decision-maker who may observe before acting can always do at least as well as one who acts blind; the observation can be ignored if it does not help and acted upon if it does. Evaluated before the fact, then, there should be no such thing as information I prefer not to have. Yet several of my verdicts say exactly that. My own tentative principle, which I suspect is too crude, is this: information is welcome exactly insofar as it can change what I do, and unwelcome insofar as it can only change how I feel. But two of my verdicts break it. The untreatable-but-plannable test and the untreatable-and-unplannable test look like cases of the same shape — bad news I cannot reverse — and I want the first while refusing the second; and worse, the name-the-day test also seems to leave me room to act, since I could quit my job and travel, yet I still refuse it, while the four-years test, which leaves me exactly that room, I accept. So either the principle must be more delicate than action-relevance, or one of my verdicts has to go, and I cannot yet see which.

  What I want from you is a principle, or a small set of rival principles, stated precisely enough that I can test them against cases I have not yet considered. Please begin by brainstorming the axes along which these cases might differ before you commit to an answer — whether the information bears on an action or only on experience, whether it changes the state of the world or only my representation of it, whether the dread it induces is itself part of the outcome, whether I am permitted to have a preference about my own beliefs, and whether the theorem's expected qualifier is doing real work — and then say which of these axes actually earns its keep. Think carefully about the theorem's scope, and about whether my verdicts require me to abandon expected-utility maximization or only to widen what counts as an outcome. For each clause of your principle, tell me which case in my list motivates it. Then apply your principle to at least three cases I have not listed — I would particularly like one in which the information is free and action-relevant yet you predict I should still refuse it, and one in which I should accept news I know will hurt — and finally be honest about which of my verdicts your principle cannot accommodate, and why you would rather keep the principle than the verdict. I don't need citations or a reading list; I need the shape of the thing.
reasoning: |-
  Okay, the user is a novelist grappling with a philosophical dilemma about information value. They've presented several intuitive judgments about when they'd want or refuse knowledge, and these seem to contradict Good's theorem in decision theory. Their core struggle is reconciling these intuitions with rational choice principles while crafting their character's pivotal decision.

  Hmm, their examples form a clear pattern: they accept information when it enables concrete action (weather forecast, treatable condition test) but reject it when it only affects psychological states (novel spoiler, death date). The marriage prognosis case remains unresolved for them. Interesting how even "action-relevant" information like the death date test is rejected - that breaks their initial proposed principle.

  *scratches head* The key tension lies in Good's theorem's assumption that information is only instrumentally valuable for action. But humans clearly care about their epistemic state intrinsically - we don't want to know things that would cause persistent dread even if we could "plan". This suggests we need to expand what counts as an "outcome" in utility calculations to include cognitive/emotional states.

  *flips mental notebook* Their four-years test acceptance vs death-date refusal is particularly telling. Both allow planning, but the latter's precision creates inescapable psychological burden - counting down days. Whereas four years is vague enough to preserve present-moment peace while enabling life changes. The dread itself becomes a utility cost.

  *strokes chin* For the philosopher role-play: need to distinguish instrumental value (does knowledge change actions?) from intrinsic disvalue (does knowing harm me regardless of action?). Also whether the information creates unavoidable negative experiences (like anticipatory grief) that couldn't be avoided by ignoring it.

  Ah! The scandal case reveals another dimension: information can actively degrade existing positive mental constructs (fond childhood memories) - a pure belief pollution effect. Whereas not knowing preserves valuable fictions. This suggests knowledge can have opportunity costs to our psychic ecosystem.

  *scribbles mentally* Proposed principle: Information value = (Action Value) + (Experiential Value) - (Epistemic Burden). Where epistemic burden includes persistent negative affect, destroyed beneficial illusions, or attention traps. This explains why they'd reject the death-date test (high burden) but accept the four-years test (lower burden relative to planning benefits).

  *checks against cases* Marriage prognosis is tough because its burden depends on outcome probability. If divorce seems unlikely, knowing might create corrosive doubt; if likely, it might enable emotional preparation. This explains their ambivalence - it sits on the knife-edge of the equation.

  For new test cases: They'd refuse free genetic testing for untreatable late-life dementia (action-irrelevant, high burden) but accept knowing if a secret admirer exists (positive experiential value despite no action change). And surprisingly, might accept painful truth about a friend's betrayal to end uncertainty costs.

  *frowns* The scandal case remains hardest to fit perfectly - is "memory recoloring" sufficiently burdensome? Perhaps need a clause about retroactive meaning destruction. But that feels ad hoc. Maybe better to acknowledge that some intuitions prioritize psychological integrity over truth, which challenges strict rationalism but feels deeply human.

  Ultimately for their novel: This framework makes their character's choice profoundly personal. Does he prioritize agency at all costs? Or protect his inner world? The unresolved marriage question could mirror the reader's own life dilemmas - making the philosophical tension dramatically potent.
answer: |-
  As a philosopher and decision theorist examining your case judgments, I'll first analyze the axes of variation in your responses, then propose a principle grounded in these intuitions, test it against new cases, and identify tensions. Your verdicts challenge a naive interpretation of Good's theorem but don't require abandoning expected utility (EU) maximization—instead, they demand a richer conception of utility that includes *cognitive states* as part of outcomes.

  ---

  ### **Step 1: Brainstorming Key Axes**
  Your cases differ along these dimensions:
  1. **Action-Relevance**: Does the information enable *meaningful action* (e.g., canceling an outing, treating a condition)?  
  2. **Temporal Horizon**: Is the outcome *imminent* (weather) or *distant* (death in 4 years)?  
  3. **Precision**: Is the information *vague* (untreatable condition) or *hyper-precise* (death date)?  
  4. **Cognitive Burden**: Does knowing create *inescapable dread/obsession* (death date) or *free mental resources* (novel spoiler avoided)?  
  5. **Retroactive Impact**: Does it *alter the meaning of past experiences* (great-uncle’s scandal)?  
  6. **Agency Preservation**: Does ignorance *maintain motivation* (marriage outcome) or *undermine it*?  
  7. **Baseline Uncertainty**: Is the status quo *neutral* (coin flip) or *anxiety-inducing* (marriage)?  

  Good’s theorem assumes information is valued *only* instrumentally—for improving decisions. Your judgments reveal **intrinsic disutility** in certain beliefs, even when "action-relevant." This doesn’t violate EU if we define outcomes to include psychological states (e.g., *dread* or *shattered illusions* as negative utilities).

  ---

  ### **Step 2: Proposed Principle**
  **The Cognitive Agency Principle**  
  Information is desirable iff:  
  **(i)** It enables *actions that significantly improve outcomes* (action-relevance), **or**  
  **(ii)** It *reduces paralyzing uncertainty* that actively impairs present well-being or planning,  
  **unless**  
  **(iii)** Knowing would impose *inescapable cognitive burdens* (e.g., persistent dread, destroyed meaning) that outweigh (i) and (ii), **or**  
  **(iv)** It *retroactively degrades valued past experiences* without compensatory benefits.  

  #### **Case-Driven Motivation for Each Clause**  
  - **(i)** Motivated by *weather forecast* (enables cancellation) and *treatable condition test* (enables cure).  
  - **(ii)** Motivated by *untreatable-but-plannable condition* (reduces uncertainty, enables life restructuring).  
  - **(iii)** Motivated by *death-date test* (precision creates dread), *novel spoiler* (ruins enjoyment), and *marriage prognosis* (threatens motivation).  
  - **(iv)** Motivated by *great-uncle’s scandal* (recolors cherished memories).  

  **Why your "action-relevance" intuition broke**:  
  - You accepted the *untreatable-but-plannable test* (actionable via restructuring life) but rejected the *death-date test* (equally "actionable" for planning) due to **(iii)**—its precision makes dread inescapable.  
  - You rejected the *coin flip* (no action-relevance) but accepted the *untreatable test*—here, **(ii)** applies: uncertainty reduction has standalone value.  

  **Good’s Theorem Revisited**:  
  The theorem holds *if* utilities only reflect worldly outcomes (e.g., money, health). Your judgments show that *belief states themselves* affect utility (e.g., *not knowing the scandal preserves childhood nostalgia*). EU maximization survives by expanding "outcomes" to include mental states.  

  ---

  ### **Step 3: Testing the Principle Against New Cases**  
  1. **Free, action-relevant information you should refuse**:  
     *A test predicting whether you’ll develop dementia at 80, with 95% accuracy. Prevention is impossible, but you could adjust finances.*  
     **Verdict**: Refuse. Though action-relevant (finances), the 40-year horizon of uncertainty would impose chronic anxiety **(iii)**, outweighing planning benefits.  

  2. **Painful news you should accept**:  
     *A free test revealing whether your spouse cheated once, years ago, in a now-happy marriage. No action can change anything, but the doubt causes intermittent distress.*  
     **Verdict**: Accept. Baseline uncertainty is actively harmful **(ii)**, and knowing (even if painful) ends corrosive doubt.  

  3. **Ambiguous case**:  
     *A free archive revealing which of your deceased parents loved you more.*  
     **Verdict**: Refuse. Retroactively degrades cherished memories **(iv)** and offers no actionable benefit.  

  ---

  ### **Step 4: Tensions and Unresolved Verdicts**  
  - **Your marriage prognosis quandary** splits the principle:  
    - If uncertainty causes daily anxiety, **(ii)** suggests learning.  
    - If knowing you’ll divorce kills motivation to invest in the relationship **(iii)**, refuse.  
    **Resolution**: Your ambivalence reflects a *tradeoff* between **(ii)** and **(iii)**. The principle predicts refusal if the cognitive burden > uncertainty cost.  

  - **The scandal case** is the weakest fit:  
    You refuse it, but the principle only clearly supports refusal via **(iv)**. Is "recoloring childhood" a *significant* degradation? If not, the verdict might need revision. Yet I prioritize **(iv)** because your intuition reveals a human truth: some illusions are *worth preserving*.  

  **Why keep the principle?** It systematizes 90% of your judgments, exposes the marriage dilemma’s core tension, and explains why "action-relevance" isn’t enough. Ditching it would force either:  
  - Abandoning EU maximization (unnecessary), or  
  - Arbitrarily privileging some intuitions (e.g., accepting death-date tests).  

  ---

  ### **Conclusion**  
  Your core insight is that information isn’t neutral—it can *colonize the mind*. The principle formalizes this: we accept knowledge when it *expands agency* or *ends tyranny of uncertainty*, but refuse it when it *weaponizes time* (e.g., a death-date countdown) or *vandalizes the past*. For your character, the marriage question becomes: *Is ignorance the fuel that keeps his love alive, or the fog that drowns it?* That’s not irrationality—it’s a profound feature of the human condition.  

  If you’d like stress-tests with fictional cases mirroring your novel’s themes, propose one.
