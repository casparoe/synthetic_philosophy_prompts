answer: |-
  **Exam Question:**

  The St. Petersburg paradox is traditionally addressed by invoking a concave utility function to achieve convergence in expected utility, but this resolution has been criticized for obscuring deeper issues. Write an essay that begins by briefly outlining this classical approach, then moves beyond it to conduct a critical examination of the paradox. Your analysis must accomplish several tasks. First, clearly distinguish and discuss the three interconnected yet distinct elements of the paradox: the mathematical divergence of the expected monetary value, the empirical observation that individuals typically refuse to pay more than a small amount to play, and the normative question of whether such refusal is rational. Second, argue that any resolution securing a finite expected value—whether through utility transformations or probability adjustments—incurs a theoretical cost. Specifically, explain how bounding the utility function or discounting small probabilities resolves the divergence but imposes commitments elsewhere in decision theory. For bounded utility, clarify what it implies about an agent’s willingness to engage in gambles with arbitrarily large stakes. For probability discounting, clarify the implications for handling low-probability, high-stakes risks, such as those in insurance contexts. Third, demonstrate that the classical resolution with an unbounded utility function remains vulnerable: for any unbounded utility function, design a modified lottery that yields infinite expected utility, and discuss whether this implies the resolution is a genuine solution or merely a redescription of the refusal to play. Incorporate a concrete exercise: suppose the casino has finite reserves, capping the maximum payable prize at M dollars. Derive the expected monetary value of the game under this constraint, showing it to be approximately the base-2 logarithm of M, and discuss how this affects claims that the paradox reveals a flaw in rationality rather than an unrealistic assumption about infinite resources. Conclude by taking a stance on whether the paradox shows that expected value maximization is fundamentally the wrong decision rule or merely that it must be applied to utility rather than money. Defend your position against the objection that utility functions can be flexibly defined to rationalize any observed behavior after the fact. Ensure your response is rigorous, self-contained, and does not rely on external sources.

  **Model Answer:**

  The classical resolution of the St. Petersburg paradox replaces monetary outcomes with utility, typically using a concave function like the logarithm of wealth. This ensures convergence: for utility u(x) = log(x), the expected utility sum over n of (1/2)^n * log(w + 2^n) is finite, as the terms diminish to zero. The paradox thus dissolves because the game’s infinite expected monetary value no longer translates to infinite expected utility, justifying a finite entry fee. However, this approach masks deeper layers. The paradox comprises three distinct horns. First is the arithmetic reality: the expected monetary value diverges, as the sum of (1/2)^n * 2^n = 1 for each n, accumulating to infinity. Second is the descriptive fact: empirical studies and intuition show people rarely pay more than a few dollars to play, despite the infinite expectation. Third is the normative puzzle: whether this refusal is rational, or if it reveals a limitation in human cognition that should be corrected. Conflating these obscures the challenge; the classical resolution targets the normative horn by redefining rationality as expected utility maximization, but it sidesteps the other two and introduces new costs.

  Any resolution imposing finitude carries a price. One strategy bounds utility, setting u(x) ≤ B for some finite B, guaranteeing convergence since expectations cannot exceed B. However, this implies extreme risk aversion: an agent would reject any gamble with a positive probability of loss if the maximum gain is bounded, no matter how small the loss or how large the gain. For example, they would refuse to pay one cent for a gamble offering B+1 dollars with probability 1/(B+2), despite a positive expected monetary value, because the utility gain from winning is capped. This undermines rationality in high-stakes scenarios where large gains could offset tiny risks. The second strategy discounts small probabilities, perhaps through weighting functions that attenuate tail events. This tames divergence but violates core tenets of expected utility theory: it erodes the handling of low-probability, high-stakes risks. For instance, underweighting the probability of a catastrophic loss might lead to underinsurance, as the model no longer fully accounts for rare but devastating outcomes. Both strategies thus sacrifice theoretical coherence—bounded utility ignores extreme opportunities, while probability discounting neglects tail risks.

  The classical resolution, using unbounded utility, is also incomplete. For any unbounded u, a new lottery can be designed with prizes set such that u(prize_n) = 2^n. The expected utility becomes the sum of (1/2)^n * 2^n, which diverges identically to the original monetary version. This rebuilds the paradox: an agent maximizing expected utility should pay any finite amount to play this lottery, yet they likely would not, mirroring the original refusal. The resolution thus appears as a redescription: it shifts the infinite expectation from money to utility without resolving the normative tension. It declares refusal rational under a concave utility but fails when utility itself diverges, suggesting it is not a universal solution but a context-specific patch.

  The concrete exercise of capping prizes at M dollars reveals practical constraints. With finite reserves, the payout is min(2^n, M). Let k be the largest integer where 2^k ≤ M, so k ≈ log2(M). The expected value is the sum from n=1 to k of (1/2)^n * 2^n plus the sum from n=k+1 to ∞ of (1/2)^n * M. The first sum is k terms of 1 (since (1/2)^n * 2^n = 1), yielding k. The second sum is M times the probability of exceeding k tosses, which is (1/2)^k, giving M / 2^k. Thus, the total is k + M / 2^k. Since M / 2^k ≈ 1 (as 2^k ≈ M), the expectation is ≈ log2(M) + 1. This logarithmic dependence shows the fair price grows slowly with M. For example, at M = 2^30 (about a billion dollars), the fair price is roughly 31 dollars. This tempers the descriptive horn—people may refuse high fees because they intuit real-world caps—but challenges the normative horn: even with large M, the fair price exceeds typical willingness to pay (e.g., 31 dollars is more than most offer). The paradox thus implicates both rationality and the infinity assumption, but the persistence of refusal in finite cases suggests rationality concerns remain.

  I argue the paradox does not invalidate expected value maximization but confirms it must operate on utility, not money. The divergence arises from misapplying the rule to a non-linear scale; utility correctly models diminishing marginal value. Against the objection that utility functions can be retrofitted to rationalize any behavior, a robust defense notes that utility is constrained by coherence across choices. For example, risk aversion via concave utility must consistently explain diverse gambles, not just the St. Petersburg game. Expected utility theory, grounded in axioms like transitivity and independence, remains normatively compelling because violations lead to inconsistencies like Dutch books. The rebuild with unbounded utility is an artificial limit case; in practice, resource bounds and bounded rationality render such lotteries irrelevant. Thus, the rule endures, provided utility reflects true preferences.

  **Marking Scheme:**

  The essay is marked out of 25, with points allocated for specific moves. Candidates receive 2 marks for accurately summarizing the classical resolution with concave utility and series convergence; omitting the functional form or convergence mechanism loses these marks. For disentangling the three horns, 2 marks are awarded for clearly explaining the divergence of expected monetary value, 2 for describing the empirical observation of low willingness to pay, and 2 for articulating the normative question of rationality; conflating these elements or omitting any results in lost marks for that component. Regarding resolution costs, 2 marks are given for explaining bounded utility and its implication of refusing some positive-expectation gambles, and 2 for explaining probability discounting and its erosion of low-probability risk handling; failure to specify the behavioral costs, such as not noting the insurance problem, forfeits the marks. For the rebuild, 2 marks are awarded for designing a lottery with prizes set to make utility grow as 2^n, and 2 for evaluating that this causes divergence and questions the classical resolution; incorrect prize utility assignments or undefended evaluations lose marks. In the concrete exercise, 3 marks are for deriving the expected value under cap M as k + M/2^k ≈ log2(M) + 1, and 2 marks for interpreting how this implicates both infinite assumptions and rationality; calculation errors or unaddressed implications reduce marks. Finally, 1 mark is for taking a stance on expected value versus utility, and 3 marks for defending against the after-the-fact rationalization objection; superficial or absent defenses, such as not invoking coherence constraints, lose the defense marks.
