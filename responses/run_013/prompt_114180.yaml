  **Exam Question:**

  The St. Petersburg paradox presents us with a game of chance in which a fair coin is tossed until it lands heads. If the first heads occurs on the nth toss, the player wins $2^n$. The expected monetary value of this game is the sum of (1/2)^n * 2^n for n from 1 to infinity, which diverges. Yet most people would not pay more than a small sum to play. Explain how the classical resolution, which replaces monetary value with a concave utility function (such as the logarithm of total wealth) to obtain a finite expected utility, is supposed to resolve the paradox. Then, set aside that resolution and critically examine the paradox at a deeper level. Your examination must accomplish three tasks. First, disentangle and discuss the three distinct aspects of the paradox: the divergence of the expected monetary sum, the empirical observation about what people are willing to pay, and the normative question of whether it is rational to pay only a small amount. Second, argue that any resolution that yields a finite expected value must come at a cost: either by bounding the utility function or by discounting the probabilities of very large payoffs. For each of these two strategies, explain what the strategy commits us to and what theoretical cost it incurs. In particular, discuss what bounded utility implies for an agent's attitude toward arbitrarily large stakes, and what discounting small probabilities implies for the treatment of low-probability, high-stakes risks. Third, explain why the classical resolution with an unbounded utility function (like the logarithm) does not fully escape the paradox: show that for any unbounded utility function, one can design a lottery whose expected utility diverges. Then, evaluate whether the classical resolution genuinely resolves the paradox or merely redescribes the refusal to play. As a concrete exercise, suppose the casino has finite reserves and can pay at most $M, where M is a very large number. How does this cap alter the expected monetary value? Derive the expected monetary value as a function of M and show that it is approximately the base-2 logarithm of M. Explain what this implies for the claim that the paradox reveals a problem with rationality rather than an unrealistic assumption about the casino's resources. Finally, take a position on the following: is the St. Petersburg paradox evidence that expected value maximization is the wrong decision rule, or does it only show that the rule must be applied to utility rather than money? Defend your position against the objection that the appeal to utility can be adjusted after the fact to rationalize any behavior.

  ---

  Now, the model answer (approx. 800 words):

  **Model Answer:**

  The classical resolution of the St. Petersburg paradox replaces monetary outcomes with utility, typically using a concave function such as the logarithm. The expected utility then converges because the utility of very large prizes grows slowly. For a player with current wealth w, the utility of winning $2^n$ is u(w + 2^n). Using u(x) = log(x), the expected utility is the sum of (1/2)^n * log(w + 2^n). For large n, log(2^n) = n log 2, and (1/2)^n * n log 2 goes to zero, so the series converges. This finite expected utility is then compared to the utility of a sure payment, and the player is willing to pay only a finite amount. This resolution interprets the paradox as a confusion between money and utility: the game's infinite expected monetary value does not translate to infinite expected utility.

  However, the paradox has three distinct horns that are often conflated. First, the mathematical fact: the expected monetary value diverges. Second, the descriptive fact: most people are only willing to pay a small amount to play. Third, the normative question: is it rational to refuse to pay a large entry fee? The classical resolution primarily addresses the normative question by redefining rationality in terms of expected utility maximization, but it does so by introducing a utility function that is concave and unbounded. We must examine the costs of this move.

  Any resolution yielding a finite expected value must either bound the utility function or discount the probabilities. First, if we bound utility, say u(x) ≤ B for some B, then the expected utility cannot exceed B. But this implies that no gain, however large, can be valued above B. Thus, an agent would refuse any gamble with a positive probability of loss if the maximum possible gain is bounded, no matter how small the loss or how large the gain. This seems irrational for large stakes: for instance, such an agent would refuse a gamble that costs one cent to play and pays B+1 dollars with probability 1/(B+2), even though the expected monetary value is positive. Second, if we discount small probabilities, for example by using a probability weighting function that underweights very small probabilities, then the tail events contribute negligibly. However, this undermines the treatment of low-probability, high-stakes risks that expected utility theory is designed to handle, such as insurance. If we downweight the probability of a catastrophic loss, we might underinsure.

  The classical resolution uses an unbounded utility function, but it is still vulnerable. For any unbounded utility function u, we can design a new St. Petersburg lottery. Let the prizes be set so that u(prize_n) = 2^n. Then the expected utility is the sum of (1/2)^n * 2^n, which diverges. So, even with a concave utility function, we can have a lottery with infinite expected utility. This shows that the classical resolution does not fully escape the paradox. It merely redescribes the refusal to play: instead of refusing because the expected money is infinite, we now refuse because the expected utility is infinite? But that would imply we should be willing to pay any finite amount to play, which we are not. Thus, the classical resolution must either bound utility or admit that the problem recurs.

  Now consider a casino with finite reserves M. The maximum prize is capped at M. The game pays min(2^n, M). The expected monetary value is the sum from n=1 to k of (1/2)^n * 2^n plus the sum from n=k+1 to infinity of (1/2)^n * M, where k is the largest integer such that 2^k ≤ M. The first sum (n=1 to k) is k * (1/2) * 2? Actually, each term in the first sum is (1/2)^n * 2^n = 1, so the first k terms sum to k. The second sum is M times the probability that n ≥ k+1, which is (1/2)^k. Therefore, the expected value is k + M / 2^k. Since 2^k ≈ M, we have k ≈ log2(M), and M / 2^k ≈ 1. So the expected value is approximately log2(M) + 1. Hence, the fair price grows logarithmically with M. This means that if the casino is very rich (M large), the fair price is high but finite. The paradox arises when we assume M is infinite. Thus, the descriptive fact that people pay little might reflect an intuition that the casino cannot pay astronomically large prizes. But note that even for M = 2^20 (about a million dollars), the expected value is about 21, which is still more than most would pay. So the finite reserves help, but only partially.

  Finally, I argue that the paradox does not show that expected value maximization is the wrong rule, but rather that it must be applied to utility. The objection is that we can always choose a utility function to rationalize any behavior. However, the utility function is not arbitrary: it must be coherent across choices and reflect risk aversion in a consistent manner. The St. Petersburg lottery, even with unbounded utility, can be handled by recognizing that in practice, we face resource constraints and must consider the marginal utility of money. Moreover, the rebuild with unbounded utility shows that the problem is not with the rule but with the unrealistic prizes. Expected utility maximization remains the foundation of rational choice under uncertainty because it satisfies compelling axioms. The descriptive fact that people pay little can be explained by bounded rationality or by realistic constraints on payouts, but the normative force of expected utility remains. To defend against the rebuild, we might bound utility by the resources of the world, but that is a topic for another day.

