  3. The rebuild of the paradox against unbounded utility functions and whether the classical resolution is a solution or redescription.

  Additionally, include a concrete exercise: when the casino's reserves are finite (capped largest prize), work out the fair price and discuss implications.

  Finally, take a side on whether expected value is the wrong rule or if we must apply it to utility, and defend that side.

  The question should be in a serious exam register, then a model answer (~800 words), then a marking scheme (25 marks total) with named moves, marks per move, and one-line note on typical errors.

