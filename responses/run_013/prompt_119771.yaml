  The argument presented in the mugging scenario relies on maximizing expected value as the sole criterion for rational choice, but it encounters a paradox when generalized to multiple, potentially conflicting requests. The core issue arises in step (6), which claims that for any request with sufficiently large stakes and small enough probability, complying has higher expected value than refusing. This step assumes that each decision can be evaluated in isolation, ignoring how such decisions interact in a broader context. Specifically, when demands conflict or resources are limited, complying with one request may preclude complying with others, making it impossible to follow a rule that always prescribes compliance under these conditions. This oversight invalidates the generalization in step (6), as rationality must account for the interdependencies and global consequences of decisions, not just local expected value.

  Rejecting step (6) resolves the paradox without abandoning expected value maximization entirely. Ordinary precautions like seatbelts, insurance, and disaster relief donations remain rational because they involve probabilities based on evidence and do not typically involve conflicting demands that undermine the decision rule. Expected value can still be applied, but it must consider the full decision context, including opportunity costs and the potential for future requests. With this correction, step (8) does not follow, as expected value maximization can be preserved when properly contextualized.

