prompt: |-
  Reading group politics question, hope this is the right place to ask. Our group has a rule that if we can't reach consensus in twenty minutes we settle it by a show of hands, majority wins. Last week someone defended the rule by saying it's basically the Condorcet jury theorem — wisdom of crowds, two heads are better than one, the more people you ask the more likely the majority is to be right, so the group's verdict is more reliable than any one of us. Felt like alot of weight to hang on one sentence.

  Here's our actual situation. We're eight people. Four of us came out of the same seminar and have basically the same priors about everything; one guy is contrarian enough that when the rest of us like a paper he'll usually argue the other way just to be difficult; and a couple of us genuinely know the literature better than the others do. Also, half the things we vote on aren't yes/no — they're "which of these three interpretations is the author going for."

  Can you break "the more people you ask, the more likely the majority is right" into the different precise claims it could be making, from the ones that just restate what a majority is up to the ones that are real results with conditions attached, and tell me for each whether it's true, what it needs, and how fragile it is? Specifically I want to know what happens to each version when (a) the voters aren't independant, (b) some of the voters are worse than random, (c) there are more than two options on the ballot, and (d) whether any given voter is better or worse than random is itself a coin flip. Then tell me which of those readings my friend actually needs for our rule to be justified, because I suspect the version doing the real work is way weaker than the version that sounds impressive. Lay it out as a numbered list so I can paste it into the group chat.
reasoning: |-
  Okay, the user is part of a reading group with eight members. They have a rule where if they can't reach consensus in twenty minutes, they settle disputes by majority vote. Someone in the group defended this rule using the Condorcet jury theorem, claiming that more people increase the likelihood that the majority is correct. The user is skeptical and wants a breakdown of the theorem's assumptions and real-world applicability to their specific group dynamics.

  First, I need to recall what the Condorcet jury theorem actually states. The basic version assumes that all voters are independent and each has a better than 50% chance of being correct. The theorem then shows that as the group size increases, the probability that the majority is correct approaches 1. But the user's group has dependencies—four members from the same seminar likely share similar biases. There's also a contrarian who might vote against the majority regardless of correctness, and varying levels of expertise among members. Additionally, they sometimes vote on more than two options, which the standard theorem doesn't cover.

  The user wants a numbered list breaking down different interpretations of "more people, more likely majority is right," examining each under conditions like dependence, some voters being worse than random, multiple options, and uncertain voter competence. They also need to know which version their friend is relying on and how realistic it is for their group.

  I should start by outlining the basic theorem and its assumptions, then progressively relax those assumptions to see how the conclusion holds. For each variation, I'll check the impact of dependence, incompetent voters, multiple choices, and random competence. The key points to address are:
  - Independence: Shared biases (like the seminar group) break independence, reducing the benefit of adding more voters.
  - Voter competence: The contrarian might be worse than random, which can flip the majority to be more likely wrong if such voters are numerous.
  - Multiple options: The theorem doesn't apply directly; the Plurality theorem might, but it's more complex and less robust.
  - Uncertain competence: If half the voters are competent and half aren't, adding more voters doesn't help and might hurt.

  The user's friend is probably invoking the basic Condorcet theorem, but their group's dynamics violate its assumptions. The real-world applicability is weak here. I need to make it clear that without independence and homogeneous competence above 50%, the theorem doesn't support their voting rule. Specifically, the contrarian and shared biases undermine the conditions needed for the "wisdom of crowds" effect.

  I'll structure this as a numbered list with each claim, its truth, conditions, fragility, and how the group's specifics affect it. Then conclude with which version the friend is using and why it doesn't hold in their case. The user wants to paste this into their group chat, so clarity and conciseness are crucial. Highlighting the fragility due to dependence and the contrarian will show why the rule might not be reliable for them. Also, the multi-option votes further complicate things. The takeaway is that their voting rule isn't backed by the theorem under their actual group structure, so they might need a different approach.
answer: |-
  Here's a breakdown of "the more people you ask, the more likely the majority is right," progressing from trivial to substantive claims, analyzed under your group's conditions. The impressive-sounding versions rely on strong, often unrealistic, assumptions.

  ### Numbered Claims & Analysis

  1.  **Claim: "Majority" means the option with the most votes."**
      *   **True?** Yes, by definition.
      *   **Needs:** Nothing beyond the voting process itself.
      *   **Fragility:** Not fragile at all. This is just a description.
      *   **(a) Dependence:** Unaffected. "Majority" is still defined by votes.
      *   **(b) Worse-than-Random:** Unaffected. Still just defines the winner.
      *   **(c) >2 Options:** Unaffected. "Majority" usually implies >50%. In multi-option votes, you likely mean "plurality" (most votes, even if <50%). This claim holds for plurality.
      *   **(d) Random Competence:** Unaffected. Still just defines the winner.
      *   **Relevance to Rule:** Trivial. Justifies counting votes, not that the outcome is "more reliable."

  2.  **Claim: If every voter is *always* correct, the majority is always correct.**
      *   **True?** Yes, trivially.
      *   **Needs:** All voters are infallible.
      *   **Fragility:** Extremely fragile. Requires perfection.
      *   **(a) Dependence:** Unaffected (they're all still correct).
      *   **(b) Worse-than-Random:** Impossible if true.
      *   **(c) >2 Options:** Still true.
      *   **(d) Random Competence:** Impossible if true.
      *   **Relevance to Rule:** Irrelevant. Your group isn't infallible.

  3.  **Claim: If every voter is *independent* and each has *exactly 50%* chance of being correct ("random"), the majority is also only 50% likely to be correct (for an odd number of voters).**
      *   **True?** Yes (for odd n). The majority is just flipping another coin.
      *   **Needs:** Independence and p(correct) = 0.5 for every voter.
      *   **Fragility:** Breaks if p(correct) != 0.5 or if dependence exists.
      *   **(a) Dependence:** Likely makes majority accuracy *worse* than 50% (e.g., if the bloc of 4 votes identically and is sometimes biased wrong).
      *   **(b) Worse-than-Random:** If voters have p(correct) < 0.5, majority accuracy is *less* than 50%. Adding *more* bad voters makes it *worse*.
      *   **(c) >2 Options:** Still true for plurality (random choice among k options has 1/k chance; plurality winner also has ~1/k chance).
      *   **(d) Random Competence:** If half voters p(correct)=0.6, half p(correct)=0.4, majority accuracy trends towards 50% as group size grows (like Claim 3).
      *   **Relevance to Rule:** Shows adding random voters adds nothing. Adding worse-than-random voters actively harms accuracy.

  4.  **Claim (The Simple Condorcet Jury Theorem - CJT): If every voter is *independent*, each has the *same probability p > 0.5* of being correct, and there are *two options*, then:**
      *   The probability the majority is correct is *greater than p* (any n).
      *   This probability *increases towards 1* as the number of voters increases.
      *   **True?** Yes, mathematically, under these strict assumptions.
      *   **Needs:** Independence, Homogeneous competence (same p), p > 0.5, Two options.
      *   **Fragility:** **Extremely Fragile.** Violating any of "Independence," "Homogeneous," or "p>0.5" can completely reverse the conclusion.
      *   **(a) Dependence:** **Critical Failure.** If voters share biases (like your seminar bloc of 4), they make correlated errors. The group acts like a much smaller (often *much* worse) group of independent voters. Adding *dependent* voters provides rapidly diminishing returns or even *reduces* accuracy. The "wisdom of crowds" effect vanishes.
      *   **(b) Worse-than-Random:** **Critical Failure.** If some voters have p < 0.5, they actively drag the majority *away* from the truth. Adding them *lowers* the probability the majority is correct. If the *average* p is < 0.5, majority accuracy *decreases* towards 0 as n increases. Your "usually contrarian" voter likely has p < 0.5 on questions where the majority is competent.
      *   **(c) >2 Options:** **Failure.** The standard CJT *does not apply*. The result ("majority/plurality likelihood -> 1") only holds under *much* stricter conditions (e.g., homogeneous competence p > 1/k where k=#options, strong assumptions about how votes distribute when wrong). Accuracy often plateaus below 1 or even decreases with more voters. Your "3 interpretations" vote is not covered by CJT.
      *   **(d) Random Competence:** **Failure.** If voters have random p (some >0.5, some <0.5), the majority accuracy *does not necessarily increase* with group size and often settles well below 1. It depends entirely on the *distribution* of p. If the *average* p is <0.5, it gets worse. If the *median* p is <0.5, it likely gets worse.
      *   **Relevance to Rule:** This is the **impressive-sounding version your friend invoked.** Its conditions are **violated in almost every way** by your group: Dependence (seminar bloc), Heterogeneous competence (varying knowledge), Likely p<0.5 voters (contrarian), Multi-option votes. This theorem provides *no justification* for your rule given your actual dynamics.

  5.  **Claim (Generalized CJT): If voters are independent, each has p_i > 0.5 (can be different), two options, then the majority is more likely correct than incorrect.**
      *   **True?** Yes (for odd n).
      *   **Needs:** Independence, p_i > 0.5 for *every* voter, Two options.
      *   **Fragility:** **Highly Fragile.** Still requires independence and *every single voter* better than random.
      *   **(a) Dependence:** **Failure.** Dependence destroys the guarantee.
      *   **(b) Worse-than-Random:** **Failure.** Even one voter with p_j < 0.5 *can* (though not always) make the majority more likely wrong than right, especially if n is small. Adding them definitely doesn't help.
      *   **(c) >2 Options:** **Failure.** Does not apply.
      *   **(d) Random Competence:** **Failure.** Guarantee lost if any voter has p_i <= 0.5.
      *   **Relevance to Rule:** Slightly less strict than Claim 4 but still fails due to dependence and likely p<0.5 voters (contrarian).

  6.  **Claim (Plurality Theorem - Analogue for k>2): If voters are independent, each has the *same probability p > 1/k* of being correct (and votes randomly if wrong), and there are *k options*, then the probability the plurality winner is correct increases towards 1 as n increases.**
      *   **True?** Yes, under these very strong assumptions.
      *   **Needs:** Independence, Homogeneous competence, p > 1/k, Voters random if wrong, k options.
      *   **Fragility:** **Extremely Fragile.** More complex and sensitive than CJT.
      *   **(a) Dependence:** **Critical Failure.** Same problems as CJT.
      *   **(b) Worse-than-Random:** **Critical Failure.** Voters with p < 1/k actively harm accuracy. Adding them reduces the chance plurality is correct.
      *   **(c) >2 Options:** **Requires this specific setup.** If wrong voters aren't random (e.g., systematically favor a wrong option), it fails. Your "different interpretations" vote likely has systematic errors, not random ones.
      *   **(d) Random Competence:** **Failure.** Requires homogeneous p > 1/k.
      *   **Relevance to Rule:** Theoretically covers your multi-option votes **but** its assumptions (homogeneity, independence, random-if-wrong) are **grossly violated** by your group. Provides no justification.

  **Conclusion for Your Group Chat:**

  1.  Your friend is almost certainly invoking the **Simple Condorcet Jury Theorem (Claim 4)** – the impressive "wisdom of crowds, majority gets more reliable" version.
  2.  **This justification collapses completely in your group:** Your voters are **not independent** (the seminar bloc of 4 creates strong dependence). You **likely have voters worse than random** (the habitual contrarian). You **frequently have more than two options** (3 interpretations). Voter competence is **heterogeneous and unpredictable**.
  3.  **Consequences:** Because of dependence, adding the seminar bloc members doesn't add much "independent wisdom" – they mostly amplify one voice. The contrarian actively *reduces* the chance the majority is correct. On multi-option votes, the CJT doesn't apply, and the relevant theorem requires even more unrealistic assumptions. Adding more voters under these conditions **does not reliably make the majority/plurality more likely to be correct** and can easily make it *less* reliable.
  4.  **What your rule *actually* does:** It provides a **fast, clear, procedurally fair way to break deadlocks**, avoiding endless debate. This is its *real* justification: efficiency and group cohesion, **not** statistical reliability or epistemic superiority. Cite the fragility under your actual conditions (dependence, contrarian, multi-option) to show Claim 4 is doing no real work. Your rule is a practical tie-breaker, not a truth-tracking mechanism. If you want *better* decisions, focus on improving discussion or using different methods (e.g., ranked voting for multi-option, identifying genuine expertise).
