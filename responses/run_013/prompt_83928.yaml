  1. Epistemicism's "you might not be ready but we'll never know" is brutal for graduation. 
  2. Supervaluationism's "all ways of being ready include you" delivers emotional safety without lying—it's the most generous interpretation of readiness. 
  3. It allows celebrating achievement while nodding to life's uncertainties. 

  But I must honor the higher-order problem: I can't claim the "borderline zone" has crisp edges. The reassurance must sit comfortably within persistent vagueness. 

