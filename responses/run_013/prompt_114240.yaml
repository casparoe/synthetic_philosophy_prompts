  The dust motes danced in the late afternoon sun slanting through the barn door. Sarah scratched the thick, woolly neck of Bertie, the elderly Suffolk Punch, her fingers finding the familiar grooves behind his ears. Sanctuary air, thick with the scent of hay, manure, and animal breath, usually settled her. Today, it felt thin. Dave, the gruff but kind sanctuary manager, leaned against a stall door, watching her.

  "Big fella eats a lot less than you'd think," Dave remarked, nodding at Bertie. "Just grass, mostly. Course, he *is* mostly grass himself now." He chuckled at his own joke.

  Sarah smiled faintly. "Still takes a lot of land to grow that grass."

  Dave shrugged, pushing off the door. "Less than you'd need to grow the soy for your tofu, pound for pound. Probably kills a lot less critters too."

  There it was again. The third time this month. The 'crop deaths' argument, lobbed like a casual grenade. Sarah, an actuary by trade, dealt in probabilities, not polemics. She’d dismissed it initially – a meat-eater’s convenient justification. But Dave wasn’t arguing; he was stating, almost sadly. And the numbers… they nagged.

  Later, at her kitchen table, Bertie’s contentment replaced by the sterile glow of her laptop, she opened a fresh notebook. *Project: Comparative Mortality*. Actuarial instincts warred with sanctuary compassion.

  She started with the cow. One 1200 lb steer, yielding roughly 500 lbs of boneless beef. Dave was right: pasture-raised, minimal grain supplement. Land use: significant. But deaths? Mostly theoretical. Maybe a displaced vole nest, unseen. She penciled: *Cow: Harvest = 1 direct death. Pasture land impact: ? (Small mammals, insects? Habitat loss?)*

  Then, the alternative: Soy. Feeding humans directly. She found USDA yield data: roughly 50 bushels per acre, each bushel ~60 lbs soybeans. Tofu yield… complex, but conservatively, 500 lbs of tofu required roughly 300 lbs of dried soybeans. That meant… she did the division… about 0.1 acres of soybeans for 500 lbs of tofu. Equivalent protein to the beef? Roughly, yes.

  Now, the grim part. Crop deaths per acre. Studies varied wildly. Mice, voles, ground-nesting birds, frogs, snakes, countless insects shredded in the combine. Estimates ranged from 1 to 15 *vertebrates* per acre. Insects? Millions. She circled *insects*. Did they count? To her heart, recoiling at a crushed beetle? Maybe. To the ecosystem? Definitely. To the cold calculus of suffering? She didn’t know. She wrote: *Soy (for tofu equiv. to 1 cow): ~0.1 acres. Vertebrate deaths: 0.1 to 1.5*. Then, hesitantly, *Insect deaths: 10,000+? (Highly speculative)*.

  Her stomach clenched. Per equivalent protein, the tofu *might* involve more vertebrate deaths than the single cow. *Might*. Her pencil hovered. But the pasture… what was that land before? If it was native prairie plowed for grazing, the displacement deaths were huge, historical. If it was marginal land unsuitable for crops, maybe less. If it was former cropland converted to pasture… the accounting got murky. *Land use counterfactual: Arbitrary*. She underlined it twice.

  Then, chicken. Dave hadn’t mentioned chicken. Her colleague Brenda swore by it: "Less land, less methane than beef!" Sarah pulled up broiler chicken data. One 5lb chicken, yielding maybe 3lbs meat. Protein equivalent to the beef? She needed about 170 chickens. Feed conversion ratio: excellent. Mostly grain and soy. How much land for *that* feed? Calculations flew: corn and soy acres required for 170 chickens… significantly less than for the beef pasture, but concentrated cropland death. Deaths per chicken? One direct, of course. But the feed… *170 chickens: 170 direct deaths. Feed land deaths: ? (Per acre death rate applied to smaller acreage than beef pasture, but more than tofu?)*

  Her neat columns dissolved. The cow looked efficient: one death, lots of food. But the land shadow loomed large and unquantifiable. The chickens: high direct kill count, but potentially less land impact than beef, maybe less than tofu per calorie? Tofu potentially had high, diffuse crop deaths but no direct slaughter. Suffering? A mouse diced by a combine blade versus a chicken in a CAFO? An insect versus a steer in a slaughterhouse chute? She tried *suffering-minutes*. Impossible. Subjective. Arbitrary.

  She scribbled furiously:
  *   **Beef:** Low direct kills (1), high land footprint (death uncertainty high), high suffering per animal? (Slaughter)
  *   **Chicken:** High direct kills (100s), moderate land footprint (death uncertainty moderate), likely high suffering (CAFO + slaughter)
  *   **Tofu:** Zero direct kills, low land footprint per calorie? (But high deaths *per acre*), suffering per death? (Combine vs. slaughter)

  The sanctuary Sarah, the one who held dying piglets and sang to nervous sheep, wanted tofu to win. The actuary saw the numbers blurring, the foundations shifting like sand. The "crop deaths" argument *wasn't* a slam dunk for beef – the land question gutted it. But it wasn't irrelevant either. It complicated tofu horribly. And chicken… chicken looked terrible on direct kills but maybe better on land than beef? Her gut said tofu was still best. The calculator said: *Insufficient Data. Define Your Parameters.*

  Days passed. She volunteered, mucking stalls, avoiding Dave's knowing look. Bertie nuzzled her hand. She watched a sparrow flit into the hayloft, safe. On the drive home, she passed endless cornfields, the combines standing like skeletal sentinels waiting for harvest. How many lives ended unseen in those vast, swaying oceans of grain that fed… everyone? Cows, chickens, humans eating tofu.

  Friday night dinner at Mark’s apartment. His sister, Lisa, the passionate vegan activist, was there. So was Mark’s friend, Tom, the unapologetic steak-lover. Sarah felt like a double agent.

  Lisa proudly presented a vibrant stir-fry: "All local, organic veggies and tofu! Carbon footprint negligible! No animals harmed!"

  Tom speared a piece of chicken from his own plate. "Except the mice in the soybean field, Lis. And the bugs. Combines are meat grinders." He winked at Sarah, having heard Dave's argument secondhand. "One cow feeds me for months. How many mice died for that tofu block?"

  Lisa flushed. "That's a false equivalence! And it ignores the suffering, the systemic cruelty—"

  "But does it?" Tom pressed, enjoying the debate. "Is getting shredded instantly in a field worse than being raised in a cage?"

  "Of course it is! The *intention*—"

  Sarah stared at her plate. Mark had offered her both options: the fragrant tofu stir-fry or a juicy-looking beef burger. Her notebook felt heavy in her bag. She saw Bertie’s gentle eyes. She saw the abstract, terrifying number *10,000+ insects?*. She saw 170 chickens. She saw the unanswerable question of what grew on the pasture before the grass, and what might grow if the soy field lay fallow.

  "Sarah?" Mark asked gently, holding out both plates. "Tofu stir-fry or burger? What do you want?"

  The sanctuary volunteer, the actuary, the woman caught in the crossfire of incomplete equations and unquantifiable suffering, opened her mouth. The words – about counterfactual land use, suffering-minutes, the dubious value of an insect life versus a mouse versus a cow, the brutal efficiency of the chicken per calorie versus the ethical abyss of its production – jammed in her throat. They felt absurd, monstrously complex for a Friday night dinner.

  She looked at the vibrant tofu, the rich beef. She thought of the unseen mice, the silent insects, Bertie’s quiet breath, the relentless hum of the hypothetical combine.

  "I... I don't know," she whispered, the sound barely audible over the clatter of cutlery and the rising debate. Her hand hovered, empty, suspended between the plates. "I just... don't know." She reached instead for her glass of water, avoiding everyone's eyes, the arithmetic screaming silently in her skull, unresolved, a maze with no clear exit. The soy milk in her coffee that morning suddenly tasted like dust.
