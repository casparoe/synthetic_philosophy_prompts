  Third, normative role: if truth is just a device, why do we treat it as the standard for belief/assertion? Deflationists might reduce this to endorsement ("assert P only if P"), but that feels thin when explaining error or inquiry's direction. Costly if you value truth's guidance beyond disquotation. 

