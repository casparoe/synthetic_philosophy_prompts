prompt: |-
  I'm a freelance writer working on a piece for a science-and-ideas section about how libertarian types think about animals, and I've hit a snag I'm hoping you can untangle for me. The name that keeps coming up is Nozick, specifically something he apparently floated about being a utilitarian toward animals and a Kantian toward people. A friend of mine who reads alot of philosophy told me this is Nozick's own settled position, and that it basically means animals sit outside the moral community, they don't have rights, and we can do whatever we like to them so long as the human benefit outweighs the cost. So there's two things I'm trying to sort out for the piece.

  First, is that even right? Because when I actually poked at it, the view seemed to say animals' interests do count, just not in the same way as ours, that you can't simply do anything but need some kind of net gain, and weirdly it also seems to allow using some animals for the benefit of other animals, which nobody I've asked seems to know about. And a different person told me Nozick didn't even endorse the thing, he was more asking why we'd draw the line between humans and animals there in the first place, and that he floated something like a sliding scale where the more an animal has a sense of its own life the more protection it gets. If that's true it seems to flat-out contradict the first part, so I assume I'm missing something about what the labels are actually doing.

  Second, and this is the part I'd want to quote you on: if the utilitarian half means animals don't get side constraints, and the sliding-scale half means some animals get more protection than others, how is that not just utilitarianism with extra steps? What work is the Kantian-versus-utilitarian split doing that a plain welfare calculation wouldn't already do?

  And just so I don't embarrass myself: should I be describing Nozick as the guy who gave factory farming a philosophical pass? Thats the line my editor wants and I'm not sure its fair.
