  Throughout, I'll maintain a neutral tone while clearly marking which requirements are non-negotiable (like conceptual distinctions) versus which are camp-specific (like how strictly to interpret Pareto). The conclusion should emphasize that no existing theory satisfies all desiderata, hence the need for the user's original work.
answer: |-
  Here is a comprehensive specification of desiderata for a theory of individual rights in collective decision-making, structured as requested, followed by analysis of conflicts and a scorecard of major approaches.

  ---

  ### **I. Desiderata for an Adequate Theory**

  #### **A. Paradigmatic Cases (Must Get Right)**
  1.  **The Meddlesome Preference (Sen's Paradox):**  
      *Case:* A wants to read a book; B prefers A not read it (due to moral disapproval, envy, etc.). Society prefers forcing A to not read if B feels strongly enough.  
      *Requirement:* The theory must protect A's choice to read despite B's meddlesome preference.  
      *Status:* **Non-negotiable** for rights-based theories; contested by strict welfarists.  
      *Motivation:* Core individual autonomy against paternalism/majoritarian imposition.

  2.  **The Hazardous Job (Paternalism vs. Consent):**  
      *Case:* A desperate worker (W) agrees to a dangerous job for low pay. Third parties (society) want to forbid the bargain, viewing it as exploitative. The bargain is Pareto-improving for W and employer.  
      *Requirement:* The theory must resolve whether W's consent validates the bargain or if societal welfare overrides it.  
      *Status:* **Camp-specific:** Non-negotiable for libertarians (consent); negotiable for paternalistic welfarists.  
      *Motivation:* Tension between autonomy, welfare, and exploitation; tests waivability of rights.

  3.  **The Persistent Minoritarian Harm:**  
      *Case:* A small group (e.g., religious minority) suffers severe, persistent harm (e.g., discrimination) tolerated by the majority.  
      *Requirement:* The theory must protect minorities even against stable majoritarian indifference.  
      *Status:* **Non-negotiable** for liberal egalitarians; contested by majoritarians.  
      *Motivation:* Rights as shields against tyranny of the majority.

  #### **B. Conceptual Distinctions (Must Not Collapse)**
  4.  **Right vs. Right's Weight:**  
      *Distinction:* Having a right (e.g., to free speech) ≠ that right always prevailing in conflicts.  
      *Requirement:* Theory must allow rights to be overridden in extreme cases (e.g., shouting fire in a theater) without negating the right's existence.  
      *Status:* **Non-negotiable** (universal).  
      *Motivation:* Avoids absolutism; enables trade-offs.

  5.  **Self-Regarding vs. Other-Regarding Rights:**  
      *Distinction:* Rights protecting the holder (e.g., privacy) vs. rights protecting third parties (e.g., right not to be assaulted).  
      *Requirement:* Theory must treat these differently; other-regarding rights are less waivable.  
      *Status:* **Non-negotiable** (universal).  
      *Motivation:* Prevents conflating autonomy with claims on others.

  6.  **Waivable vs. Inalienable Rights:**  
      *Distinction:* Rights that can be waived/sold (e.g., property rights) vs. those that cannot (e.g., against slavery).  
      *Requirement:* Theory must explain which rights are inalienable and why (e.g., core dignity).  
      *Status:* **Camp-specific:** Non-negotiable for Kantians; contested by Hobbesians/market liberals.  
      *Motivation:* Addresses the hazardous job case; limits on consent.

  #### **C. Formal Requirements (Must Be Satisfied)**
  7.  **Unrestricted Domain (UD):**  
      *Requirement:* The theory must work for *any logically possible* preference profile (including meddlesome, intolerant, or "messy" preferences).  
      *Status:* **Non-negotiable** (per your specification: "survive real preference profiles").  
      *Motivation:* Real-world robustness.

  8.  **Weak Pareto (WP):**  
      *Requirement:* If everyone prefers outcome X to Y, society must prefer X to Y.  
      *Status:* **Non-negotiable** for welfarists; **negotiable** for deontologists if rights conflict.  
      *Motivation:* Prevents gratuitous inefficiency; captures unanimity.

  9.  **Social Ordering (SO):**  
      *Requirement:* Social preference must be complete and transitive (acyclic).  
      *Status:* **Preference** (pragmatic camp); negotiable for proceduralists.  
      *Motivation:* Ensures coherent, non-arbitrary collective decisions.

  10. **Recognition of Rights-Aggregation Trade-off:**  
      *Requirement:* The theory must explicitly address how protected spheres are balanced against aggregate welfare gains.  
      *Status:* **Non-negotiable** (universal for realistic theories).  
      *Motivation:* Avoids utopianism; acknowledges scarcity of moral attention.

  ---

  ### **II. Conflicts and Impossibilities**

  1.  **The Central Impossibility (Sen's Theorem):**  
      **Conflict:** *Unrestricted Domain (7) + Weak Pareto (8) + Minimal Liberalism (implied by Cases 1 & 2) are jointly incompatible with Social Ordering (9).*  
      *Why:* Sen’s Liberalism Paradox shows that assigning even minimal protected spheres (e.g., A controls their own reading) under UD and WP can produce cyclical social preferences.  
      *Consequence:* **The list implies an impossibility result.** No theory can satisfy all of (1), (7), (8), and (9) simultaneously.

  2.  **Hazardous Job Trilemma:**  
      **Conflict:** *Autonomy (Case 2) + Weak Pareto (8) + Third-Party Moral Judgment (Case 2) are mutually straining.*  
      - Upholding autonomy and WP validates the bargain.  
      - Banning it violates autonomy and WP.  
      - Allowing third-party override collapses the self/other-regarding distinction (5).  
      *Consequence:* Forces the theory to prioritize one desideratum (e.g., inalienability vs. Pareto).

  3.  **Most Exclusionary Requirement:**  
      **Unrestricted Domain (7)** excludes most "tidy" theories (e.g., those assuming only "reasonable" preferences). It is the catalyst for Sen’s impossibility and complicates resolution of Cases 1 and 3.

  4.  **Genuine Desideratum vs. Camp Prejudice:**  
      - **Genuine Desideratum:** *Right vs. Right's Weight (4)*. Even absolutists acknowledge *emergency* exceptions; denying this distinction is dogmatic.  
      - **Camp Prejudice:** *Strict Weak Pareto (8)*. Treating WP as inviolable (as welfarists do) ignores that rights *justifiably* block Pareto improvements (e.g., banning organ sales).

  ---

  ### **III. Scorecard: Major Theories**

  | **Desideratum**               | **Minimal Liberalism (à la Sen)**                                | **Rights-as-Side-Constraints (Nozick)**                     | **Welfare Aggregation (Utilitarianism)**                     |
  | :---------------------------- | :--------------------------------------------------------------- | :---------------------------------------------------------- | :----------------------------------------------------------- |
  | **1. Meddlesome Preference**  | ✅ (Protects A)                                                  | ✅ (A's side-constraint blocks B)                           | ❌ (B's preference may outweigh A's if aggregated)           |
  | **2. Hazardous Job**          | ❌ (WP forces allowance; ignores exploitation)                   | ⚠️ (Upholds bargain if consensual; ignores welfare)        | ❌ (Bans if social welfare decreases)                        |
  | **3. Minoritarian Harm**      | ⚠️ (May protect if a "sphere" is defined)                       | ✅ (Rights block majorities)                                | ❌ (May tolerate if majority is indifferent)                 |
  | **4. Right ≠ Decisive**       | ✅ (Rights are domains, not trumps)                              | ❌ (Rights are absolute side-constraints)                   | ❌ (Rights dissolve into welfare calculus)                   |
  | **5. Self/Other-Regarding**   | ❌ (No inherent distinction)                                     | ✅ (Focuses on violation of others)                         | ❌ (Conflates all preferences)                               |
  | **6. Waivable vs. Inalienable** | ❌ (No framework for inalienability)                            | ⚠️ (Self-ownership alienable? Inconsistent)                | ❌ (All rights waivable if welfare improves)                 |
  | **7. Unrestricted Domain**    | ✅ (Explicitly handles all preferences)                          | ✅ (Ignores preferences; focuses on actions)               | ✅ (By design)                                               |
  | **8. Weak Pareto**            | ❌ (Violated by rights in Sen's paradox)                         | ⚠️ (Respected only if no rights conflict)                  | ✅ (Core axiom)                                              |
  | **9. Social Ordering**        | ❌ (Fails due to cycles under UD)                                | ⚠️ (No *social* ordering; only individual claims)          | ✅ (By design)                                               |
  | **10. Rights-Welfare Tradeoff** | ⚠️ (Acknowledged but unresolved)                              | ❌ (No tradeoff; rights absolute)                           | ✅ (Explicit, but dissolves rights)                          |
  | **Key Failure**               | **Sen’s Impossibility (fails 8 & 9)**                            | **Rigidity in Hazardous Job & Tradeoffs (fails 2, 6, 10)** | **Violates Autonomy (fails 1, 2, 3, 4, 5, 6)**              |

  ---

  ### **Conclusion**
  Your desiderata list **is itself an impossibility result** due to the Senian conflict (UD + WP + Minimal Rights → Cyclicity). The most viable path is to relax one requirement:
  - **Pragmatic:** Relax *Social Ordering* (accept occasional intransitivity in rights conflicts).
  - **Liberal:** Relax *Unrestricted Domain* (define "protected spheres" only against "reasonable" preferences).
  - **Welfarist:** Relax *Minimal Liberalism* (allow rights override under strong Pareto/aggregate gains).

  The **hazardous job case** remains the sharpest stress test, exposing irreconcilable tensions between autonomy, welfare, and third-party moralism. A successful theory must either:
  - Justify inalienable rights (e.g., safety as non-waivable), violating Pareto.
  - Define strict procedural consent rules, risking exploitation.
  - Assign weights to rights/welfare tradeoffs explicitly, inviting controversy.

  No existing theory satisfies all desiderata—your task is to navigate these tensions with institutional and normative innovation.
