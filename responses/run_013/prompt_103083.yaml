  We are going to design an interactive role-play game to illustrate the concepts of potential vs. actual infinity, using Hilbert's Hotel as the setting. The key idea is to have students actively engage in the moves of the hotel (with most playing guests and staff) and have one or two students as finitist auditors who require that every process must have a last step and be completable.

   Roles:
   1. Hotel Manager (Cantorian) - 1 student. They can issue commands to move guests according to rules (like moving guest in room n to room 2n).
   2. Staff (Movements Coordinators) - 2-3 students. They are responsible for physically moving the guests (changing their room numbers) and reporting to the auditor when a move is "complete".
   3. Guests - About 10-12 students. Each guest has a room number (initially, we start with a finite set of rooms, but we will simulate the infinite hotel by having the manager and staff create new rooms as needed). Each guest should have a tag with their room number.
   4. Finitist Auditors - 1-2 students. They must approve every move. They require that for any process (like moving guests) there must be a last step and they can see that it is finished. They also question the state of the hotel (e.g., after a guest checks out, is the hotel less full?).

   Materials:
   - Name tags for guests with room numbers (write-on tags or sticky notes so that room numbers can be changed).
   - A large space (like a classroom with movable chairs) to represent the hotel. Designate areas for the rooms. You might use chairs or marked spots on the floor as rooms.
   - A whiteboard or flip chart to record the current state (e.g., which rooms are occupied) and to note the auditor's questions and the manager's responses.
   - A bell or gong (optional) to signal the completion of a step.

   Timeline (75 minutes total):
   1. Setup (10 minutes): Assign roles, explain the basic rules, and set up the initial hotel (say, 10 guests in rooms 1 to 10). The manager and staff are briefed separately on their roles (manager knows the Cantorian tricks, staff knows they have to follow the manager and move guests). The auditors are briefed that they must ensure every process has a last step and that they can see when it is done.

   2. Phase 1: Full Hotel and a New Guest Arrives (15 minutes)
      - The hotel starts full (all rooms 1-10 occupied). 
      - A new guest arrives (played by the instructor or a student). The manager wants to accommodate the new guest. 
      - Manager's rule: "Move every guest from room n to room n+1, one at a time, starting from the highest room." 
      - Staff try to execute: They ask guest in room 10 to move to 11, then guest in 9 to move to 10, etc. 
      - Auditor: "When does this end? You have to start somewhere but then you have to do infinitely many steps? I can't sign off until every guest has moved and the process is complete." 
      - The manager might argue that the process is complete when room 1 is free. But the auditor points out that there is no last step because after moving guest 1, there is no next? (Actually in this case, the manager should start from the highest and go down. But the auditor will note that the staff must do one step at a time and there are infinitely many? Wait, we started with 10, so finite. But the manager intends to show that even if the hotel is infinite, we can do it. So we need to transition to an infinite hotel.)

      How to transition to an infinite setting? We start with finite and then the manager declares that the hotel is actually infinite. But we only have 16 students. We simulate infinity by having the manager and staff create new rooms as needed (using the whiteboard to record the state beyond the physical students). The guests that are not physically represented are recorded on the board. The staff are responsible for updating the board.

