answer: |-
  ## Pantoum of the Clay and the Figure

  Upon the bench, a weight of earth lies still,
  **This was no shape before the potter’s skill.**
  The turning wheel begins its steady song,
  **And was here long before the turning wheel.**

  **This was no shape before the potter’s skill,**
  A patient hand coaxes a form to rise.
  **And was here long before the turning wheel,**
  Now cooled and fired beneath the kiln’s grey skies.

  A patient hand coaxes a form to rise,
  **Turned and turned until a figure stood.**
  Now cooled and fired beneath the kiln’s grey skies,
  **It learnt the wheel and understood.**

  **Turned and turned until a figure stood,**
  A brittle grace upon the splintered shelf.
  **It learnt the wheel and understood**
  **What falls survives, what breaks is gone itself.**

  A brittle grace upon the splintered shelf,
  A careless grasp, a sudden downward crash.
  **What falls survives, what breaks is gone itself;**
  The wheel’s first song ends in this heavy smash.

  A careless grasp, a sudden downward crash.
  The turning wheel begins its steady song,
  The wheel’s first song ends in this heavy smash.
  Upon the bench, a weight of earth lies still.

  ---

  **Notes on the Metaphysical Lines (British English):**

  1.  **"This was no shape before the potter’s skill." (Lines 2 & 5):**  
      *   **First occurrence (Line 2):** Spoken truthfully of the lump of clay itself – it genuinely lacked any specific shape before the potter worked it. It describes the lump.
      *   **Second occurrence (Line 5):** Now forms the first line of the *next* quatrain, which introduces the forming figure. The words are the same, but they now refer *back* to the lump's prior state, contrasting it with the emerging figure. The figure *is* a shape, so the statement is no longer true *of the figure* – it's a description of what the lump *was*, persisting linguistically even as the thing it described (the unshaped lump) has ceased to exist in that state. The words survive the described state.

  2.  **"Turned and turned until a figure stood." (Lines 9 & 17):**  
      *   **First occurrence (Line 9):** Describes the *process* the *clay* underwent on the wheel – the material being shaped.
      *   **Second occurrence (Line 17):** Now forms the second line of the *final* quatrain, describing the *result* of that process – the *figure itself* standing on the shelf. The same words, describing the same material, now denote the finished form it has acquired. The words take on the new meaning imposed by the context.

  3.  **"What falls survives, what breaks is gone itself." (Lines 15 & 19):**  
      *   This line directly contrasts the differential survival capacity. When it first appears (Line 15), it's associated with the figure understanding the kiln (a hardening process). It foreshadows the fate: the clay (what 'falls' back into a lump) survives the careless hand's smash, while the figure (what 'breaks') is gone. Its repetition (Line 19) confirms this outcome after the crash. It encapsulates the core difference in persistence.

  4.  **"And was here long before the turning wheel." (Lines 4 & 7):**  
      *   This line establishes the temporal priority of the clay over the figure-making process ("the turning wheel") and, by extension, the figure itself. Its repetition reinforces this historical fact.

  **Form as Philosophy:** The pantoum's strict repetition of lines acts as the poem's "clay" – the persistent linguistic material. However, the changing context around these repeated lines (the new "form" of each quatrain) shifts their meaning and reference, mirroring how the same physical clay constitutes different entities (lump, figure, lump again) with different properties over time, all occupying the same space. The closing loop explicitly brings the beginning's lines into the end, reflecting the cyclical nature of the clay's existence but the linear birth and death of the figure.
