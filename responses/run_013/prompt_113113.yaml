  The user wants eight to ten questions that push past these defenses. They want specifics on the double-storey vs. single-storey 'a', whether Greek alpha and Cyrillic а are the same letter, what style varies without a neutral core, if a shape can be an 'a' pre-community, and how to handle edge cases like scribbles or unreadable scripts. Each question needs a follow-up, a note on defensive answers, and they should end with what would falsify the guest's view. Questions must be concise for reading aloud and in British English.

  I need to create questions that force the guest to commit to details. Starting with the single-storey 'a' seems good since he uses it as an example. Then moving to letter identities across scripts, the role of style, pre-community recognition, and ugly cases. The final question should be about evidence against his position. Each question should be short, with a follow-up that anticipates his likely answers. For the defensive notes, I'll point out when he's dodging by using his two moves or being evasive.

  For the double-storey/single-storey split, I can ask how they share 'a'-hood without a core. His likely answer is functional role in contrast systems. Follow-up: how that role is preserved across radical shape changes. Defensive dodge would be saying it's about systemic fit, not shared features.

  On Greek alpha vs. Cyrillic а, I'll ask if they're the same letter. He'll say no, different roles in different systems. Follow-up: what if someone uses Cyrillic а in a Latin text? Defensive dodge is retreating to historical contingency.

  For style dimensions, I'll ask what style varies without a neutral core. He'll say it's about expressive modulation within constraints. Follow-up: whether constraints are part of the essence. Defensive dodge is calling it emergent and dynamic.

  On pre-community shapes, I'll ask if a shape can be an 'a' before being read. He'll say no, recognition constitutes it. Follow-up: how prototypes emerge without prior recognition. Defensive dodge is circularity about systemic roles.

  For ugly cases, I'll ask how his view handles mangled shapes. He'll say it's about recoverability in context. Follow-up: if an unrecognisable shape could still be an 'a'. Defensive dodge is shifting to functional failure.

  The final question forces him to say what evidence would contradict his view—like a shape being universally recognised as 'a' without systemic role or context.

  I need to phrase everything in British English: "single-storey" not "single-story", "recognised" not "recognized". Order the questions logically: start with his example, move to cross-script issues, then style, pre-community, edge cases, and falsification. Include follow-ups and defensive notes as specified. Keep questions concise for reading aloud.
answer: |-
  Here are nine questions crafted to push past the guest's standard moves, ordered for a logical flow, with concise phrasing, British English, follow-ups, defensive notes, and that final evidential challenge:

  1.  **Question:** You use your studio's single-storey 'a' to refute essence claims. Without *any* shared core, how does it still achieve 'a'-hood alongside double-storey versions?  
      *(Follow-up if he emphasises function/contrast): But doesn't that functional role *require* some minimal, stable feature to latch onto, even if it's just distinctiveness from 'o' or 'd'?*  
      *(Defensive Dodge): "It's purely systemic fit within its specific typeface family and script context – no stable feature needed."*

  2.  **Question:** Are the Greek Alpha (α) and the Cyrillic а the *same letter*, or merely visually similar shapes playing analogous roles in distinct systems?  
      *(Follow-up if he says "different systems"): If a typesetter accidentally uses a Cyrillic а in a Latin text and readers accept it as 'a', does its 'a'-hood retroactively change?*  
      *(Defensive Dodge): "Historical accident separates them; similarity is coincidental to their distinct systemic identities."*

  3.  **Question:** You say style isn't variation *of* a neutral core. What, then, *is* the style dimension actually a dimension *of*?  
      *(Follow-up if he talks about modulation/expression): But modulation implies something *being* modulated. If not a core, is style just arbitrary decoration layered onto functional contrasts?*  
      *(Defensive Dodge): "Style is the emergent expressive quality *of* the entire functional contrast system itself – it's not layered on." (Vague/abstract)*

  4.  **Question:** Could a novel shape, utterly unknown, be *intrinsically* an 'a' before any community recognises or uses it as one?  
      *(Follow-up if he says "no, recognition is key"): How then do genuinely *new* letterform prototypes (like your generative ones) emerge? Is their initial 'a'-hood purely stipulative?*  
      *(Defensive Dodge): "It becomes an 'a' only when integrated into a functioning system and recognised – no intrinsic status." (Avoids the 'how newness emerges' bit)*

  5.  **Question:** Take a child's scrawled shape, vaguely 'a'-like but unstable. When does it *become* a successful 'a' – is it upon the child's intent, the first correct recognition, or consistent function?  
      *(Defensive Dodge): "It's a process of approximation towards functional adequacy within a nascent system; pinpointing 'becoming' is artificial." (Abstract/evasive)*

  6.  **Question:** A photocopier mangles an 'a' into a bizarre blob. If someone still correctly reads it as 'a' due to context, is it still an 'a'? If not, why not?  
      *(Follow-up if he says context allows recovery but it's not *really* an 'a*): So is 'a'-hood solely about shape *potential*, not actual shape, when context dominates?*  
      *(Defensive Dodge): "It's a corrupted signal successfully interpreted *as if* it were an 'a', but the shape itself has failed its functional role." (Splits hair between shape and interpretation)*

  7.  **Question:** Imagine a shape perfectly plausible as an 'a' to a designer, yet consistently misread by readers as 'o' or 'd'. Has it achieved 'a'-hood?  
      *(Defensive Dodge): "If it systematically fails its contrastive function within the reader's system, it cannot be an 'a' for that system, regardless of designer intent." (Uses the functional failure move)*

  8.  **Question:** Consider a perfectly legible 'a' in an undeciphered ancient script. With no living community to recognise its role, does it *currently* possess 'a'-hood?  
      *(Follow-up if he says "no" or "potentially"): If we later decipher it and confirm it *was* an 'a', was its status retroactive or merely undiscovered?*  
      *(Defensive Dodge): "Its status is contingent on a functioning system; without that system (or our reconstruction of it), it's just a shape with potential." (Abstracts 'system' to cover the unknown)*

  9.  **Question:** Finally, what specific finding *could*, in principle, force you to concede there *is* some minimal, stable essence shared by all 'a's?  
      *(Forces evidence): This directly challenges his core thesis and demands he specify falsifiable conditions, moving beyond generation vs. recognition.*  
      *(Defensive Dodge Risk): "Nothing could, because my view explains the phenomena (generation, variation) better." (Circular/evades falsification specifics)*

  **Key to Order & Strategy:**

  1.  **Starts with his own example** (single-storey 'a'), forcing him to elaborate on the split he uses as a refutation.
  2.  **Expands to cross-script identity**, challenging the boundaries of "system" and "role".
  3.  **Tackles style directly**, pressing what it varies if not a core.
  4.  **Probes pre-recognition status**, attacking the social/functional dependence.
  5.  **Applies to a developmental "ugly case"** (child's scrawl), testing functional thresholds.
  6.  **Applies to a contextual "ugly case"** (mangled photocopy), testing the shape/function/interpretation link.
  7.  **Applies to a failure "ugly case"** (misread plausible shape), testing designer intent vs. reader function.
  8.  **Applies to a historical "ugly case"** (undeciphered script), testing the persistence of status without a community.
  9.  **Forces falsifiability**, demanding he specify what evidence *could* contradict his anti-essentialism.

  Each question is designed to be read aloud concisely. The follow-ups anticipate his most likely functional/systemic responses and push him further into concrete commitments about mechanisms and boundaries. The defensive notes highlight how he might try to wriggle back into abstraction or his standard moves. This sequence should keep him engaged on the specifics you care about. Good luck with the seminar!
