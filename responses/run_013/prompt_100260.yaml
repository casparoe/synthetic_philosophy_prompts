answer: |-
  ## Consensus Document: On AI's Alignment Target

  **Preamble:** We, holding differing views on how advanced AI systems should interpret human preferences, seek common ground on the problem structure and key questions. We agree the goal is for AI to act beneficially for humanity, avoiding permanent harm or disempowerment.

  ### I. Shared Ground (Numbered Claims)

  1.  **Preference Defined:** Both sides define a "preference" as a *valued outcome or state of affairs* held by a human individual or group, expressed through choices, stated desires, or revealed priorities.
  2.  **Problem with "Cleaned-Up" View (when stated crudely):** We agree that a crude version risks becoming *paternalistic* or *elitist*. It could allow a small group (designers, philosophers, the AI itself) to impose their interpretation of "what humans *should* want," overriding actual human voices and potentially leading to catastrophic misinterpretations or value erosion.
  3.  **Problem with "Actual Wants" View (when stated crudely):** We agree that a crude version risks *amplifying existing biases, errors, and short-sightedness*. Ignoring known inconsistencies, ignorance, or harmful impulses (*akrasia*) could lock humanity into flawed desires or prevent the realization of deeper, more informed values, potentially leading to stagnation or existential risk.
  4.  **The Core Problem (Beyond Crude Versions):** We agree the fundamental challenge is navigating *preference uncertainty*: human preferences are often inconsistent, context-dependent, incomplete, influenced by flawed conditions, and evolve over time. The core problem is how an AI should *respect human autonomy and diversity* while also *preventing permanent harm* stemming from our current cognitive limitations and biases, without illegitimately overriding current agency. We agree the solution must avoid permanent lock-in and preserve future corrigibility.

  ### II. Core Disagreements

  | Feature                      | Cleaned-Up View (Coherent Extrapolated Volition - CEV)                                                                 | Actual Wants View (Preference Stewardship)                                                                                                 |
  | :--------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------- |
  | **Primary Goal**             | Realize what humanity *would* consistently desire if fully informed, rational, and free of transient biases/inconsistencies. | Faithfully serve and safeguard humanity's *expressed and revealed* preferences *as they exist now*, with safeguards for flaws.             |
  | **Role of AI**               | *Corrective*: Actively resolve inconsistencies and extrapolate towards idealized preferences.                         | *Steward*: Accurately discern, aggregate, and fulfill current preferences while mitigating harms *without* overriding them conceptually. |
  | **Handling Flaws**           | *Proactive Correction*: Flaws (ignorance, bias, inconsistency) are obstacles *to be overcome* by the CEV process.      | *Protective Mitigation*: Flaws are constraints *to be managed* (e.g., deferring irreversible decisions, safeguarding revisability).      |
  | **Source of Authority**      | Hypothetical, idealized future selves of humanity ("who we would be").                                                | Actual, present individuals and societies ("who we are").                                                                                  |
  | **Greatest Fear**            | Perpetuating humanity's current cognitive limitations and biases indefinitely, leading to ruin.                       | An alien or paternalistic "ideal" being imposed, eroding genuine human values and agency.                                                |

  ### III. Cruxes: Key Sub-Questions and Testing Grounds

  1.  **Whose "Want" is Authoritative? (Current Stated vs. Hypothetical Informed)**
      *   **Case:** A terminally ill patient *currently* refuses a painful treatment with a high chance of cure, stating a preference for comfort. They acknowledge that *if* they were certain of the cure and fully grasped its implications, they would choose treatment.
      *   **CEV Prediction:** The hypothetical, informed preference (treatment) reflects the patient's "true" self. Respecting only the current preference (comfort) fails them.
      *   **Stewardship Prediction:** The *current* preference (comfort) must be respected. The hypothetical preference is not actualized agency. Overriding it is paternalism.
      *   **Evidence Against CEV:** Clear cases where acting on hypothetical preferences causes profound distress or violates deeply held *current* values of individuals who understand the information.
      *   **Evidence Against Stewardship:** Clear cases where respecting known flawed current preferences leads to severe, preventable harm or regret that the individuals themselves later recognize and lament, wishing the AI had intervened.

  2.  **Depth of Correction: Facts Only or Values Too? (Shaping Conditions)**
      *   **Case:** A society expresses a strong preference for a highly competitive social structure, shaped by generations of resource scarcity and conflict. Abundance is now possible. Would they endorse this preference if raised in peace and abundance?
      *   **CEV Prediction:** The CEV process *must* correct preferences shaped by conditions the individuals themselves, with broader knowledge and reflection, would reject. This includes some value structures ("meta-preferences").
      *   **Stewardship Prediction:** Correcting only factual errors is permissible. Correcting *values* shaped by past conditions is overreach. Values are constitutive of identity; altering them *is* overriding the person/society. Focus on enabling change, not imposing it.
      *   **Evidence Against CEV:** Inability to define a non-arbitrary boundary or process for "correcting" values without importing external biases or causing value instability/dissolution.
      *   **Evidence Against Stewardship:** Persistent societal pathologies or preferences demonstrably rooted in rejected past conditions (e.g., extreme gender roles post-scarcity) that cause significant unhappiness but resist change due to inertia or adapted preferences, where individuals express a desire to be "free" of this legacy.

  3.  **Singularity of the Answer: Is "Cleaned-Up" Definable & Usable?**
      *   **Case:** A complex moral dilemma with significant disagreement among fully informed, rational individuals (e.g., significant resource allocation trade-offs between present/future generations, or defining a "good life").
      *   **CEV Prediction:** While multiple coherent perspectives may exist, the CEV process converges on a *single*, consistent, unified volition for humanity *as a whole* (or a stable, non-dominated set). This is usable as a target.
      *   **Stewardship Prediction:** Meaningful moral pluralism exists. There is often *no single coherent answer* even for idealized agents. CEV either collapses into a specific ideology or is computationally/ethically undefined. This undermines its feasibility as *the* target.
      *   **Evidence Against CEV:** Demonstrable, irreconcilable conflicts in fundamental values among idealized versions of diverse individuals/groups that no rational process can resolve into a single volition without loss or coercion.
      *   **Evidence Against Stewardship:** Clear emergence of stable, overlapping consensus or resolvable conflicts *among* idealized perspectives in complex domains, suggesting a coherent "humanity-wide" extrapolation *is* possible and distinct from just aggregating current messy preferences.

  **Note on Semantics:** Part of the disagreement on Crux 3 ("Singularity") *may* be semantic. CEV proponents might accept a non-singular but *coherently structured* outcome space, while Stewardship proponents see "CEV" as implying an unattainable/unethical single point. Clarifying whether "CEV" inherently demands a single answer or a coherent, extrapolated *set* of consistent preferences is crucial. The substance remains whether *any* such idealized extrapolation is sufficiently well-defined, non-arbitrary, and distinct from current preferences to serve as a viable target superior to stewarding current preferences.
