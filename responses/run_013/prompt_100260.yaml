  The disagreements table should contrast cleaned-up CEV vs. actual-preference stewardship. I'll strengthen each position: CEV as necessary corrigibility; stewardship as anti-paternalism. Cruxes will directly incorporate the user's questions: for "whose want counts," I'll pose a terminal illness case; for "value correction," a culturally ingrained preference example; for "singular answer," a moral dilemma scenario. Each crux needs testable predictions and falsifiability conditions.

