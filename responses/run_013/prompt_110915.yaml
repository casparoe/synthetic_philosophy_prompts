    "one_phenomenon_or_two": "One phenomenon. Both accurate inference (e.g., discerning Bongard rules) and errors (e.g., misreading AI prompts) arise from the same interpretive act: assuming selection is intentional and informative. The core mechanism—using curation as a signal of intent—unifies them.",
    "nearest_concepts": [
