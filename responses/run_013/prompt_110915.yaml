prompt: |-
  I work as a software engineer and have no formal training in philosophy, so I would be grateful if someone could tell me whether a pattern I keep running into has an established name and a literature behind it, or whether I have invented a puzzle for myself.

  The pattern concerns what happens when a concept is conveyed to me by a handful of examples rather than by a definition. In such cases there seem to be two quite different kinds of information in what I am handed. The first is the content of the examples: each one, taken on its own, rules something out. The second is the fact that these examples, rather than any others, were the ones placed in front of me. This second kind of information cannot be read off any individual example, and it is frequently the stronger of the two. Three instances, in increasing order of how much they have puzzled me:

  First, there is a puzzle format I have seen called a Bongard problem: a set of small line drawings is divided into two groups, and the task is to state what distinguishes the groups. Suppose the intended distinction is something like the number of straight segments. Nothing in the drawings excludes the rule "has an odd number of straight segments, or is one of these particular twelve drawings", which fits the given material perfectly. What rules it out is not the material at all but my assumption that whoever drew the twelve drawings chose them so that a person could discern one particular distinction — an assumption about the setter's choices that is nowhere among the examples. I notice that I make that assumption without thinking, and that I am irritated by the disjunctive rule even though it fits.

  Second, in my own work I sometimes prompt a language model with a handful of examples of a category I have in mind. If all my examples happen to concern invoices, the model will often take invoices to be part of the category, which they are not, because I chose those examples for reasons of my own. The converse also happens: when I deliberately include one example that sits at the edge of the category in order to indicate where the boundary lies, the model will often treat it as one more ordinary instance, and the boundary is not registered. So a signal seems to be present in the first case and is over-read, and present in the second and is missed.

  Third, when a colleague explains a class of bug by showing me three reports, I infer the scope of the class from which three were chosen. That one report is from an old release and another from a current one tells me the class spans releases, although no report says so. Were those three reports merely the first three results of a search, the same inference would be worthless, and I would be wrong to draw it.

  What I want to know is whether there is a name for this: for the practice of treating the selection of examples, as distinct from their content, as evidence about the extension of the concept — about which further cases would count and which would not — and for the corresponding error of reading selection as evidence when the selection was indifferent, or of ignoring it when it was not. I am reasonably sure the answer is not "overfitting" or "spurious correlation", since those concern a fault in the learner, whereas here the difficulty lies on the side of the evidence, and the error is sometimes the failure to use a real signal. Nor do I think it is simply the everyday reasoning of the form "why are you telling me this", because what I am inferring is not what the speaker intended to convey but the boundaries of a concept. A bare label will not help me; what I am after is the carving — what exactly the phenomenon is, how many phenomena are involved, and where its edges lie.

  Please answer in prose, and then close with a single JSON object summarising your conclusions, using exactly these fields:

  - `established_name`: the name of an established concept that best fits, or null if none does.
  - `coined_name`: a name of your own coining, or null if an established name suffices.
  - `definition`: a compact definition of the phenomenon as you have carved it.
  - `one_phenomenon_or_two`: your verdict on whether the reading of the signal and the misreading of a spurious one are a single phenomenon or two, with a brief justification.
  - `nearest_concepts`: an array of objects, each with `name`, `overlap` (what it shares with the phenomenon described) and `shortfall` (precisely where it fails to fit).
  - `boundary_cases`: an array of objects, each with `case`, `verdict` (one of "in", "out" or "unclear") and `reason`. Please include at least these four: examples produced by a process with no intention whatsoever, such as a scraper or a natural process; a "teacher" that is a market or a selection pressure rather than an agent; examples chosen adversarially; and examples that are not a sample but the entire population.
  - `confidence`: one of "high", "medium" or "low".

  Please write throughout in British English, including the spelling of any terms you introduce.
reasoning: |-
  Hmm, the user is a software engineer without formal philosophy training who keeps encountering a specific pattern related to learning from examples. They've described three scenarios where the selection of examples itself carries information beyond the examples' content: Bongard problems, AI prompting, and bug report interpretation. They want to know if this has an established name in philosophy or cognitive science.

  This is an interesting epistemological challenge. The core issue seems to be about meta-information - how we interpret the curator's intent through their selection of examples. The user specifically distinguishes this from overfitting or spurious correlation since the problem lies in the evidence's ambiguity rather than the learner's fault.

  For established concepts, I'm considering:
  - The "paradigm case argument" in philosophy touches on using examples to define concepts, but doesn't address selection bias
  - "Exemplar theory" in cognitive psychology deals with learning from examples but ignores curator intent
  - "Grue paradox" highlights definitional issues but is more about language than selection
  - "Pedagogical sampling" in machine learning comes closest but is domain-specific

  Since no perfect fit exists, I'll coin "selective intent inference" to capture how we deduce concept boundaries from assumed curator intentions. The phenomenon seems unified - both accurate and mistaken inferences stem from the same interpretive mechanism.

  For boundary cases:
  - Randomly scraped examples shouldn't convey intent (OUT)
  - Market-driven selection has quasi-intent but isn't deliberate (UNCLEAR)
  - Adversarial examples actively manipulate inferences (IN but distorted)
  - Full populations bypass selection effects (OUT)

  My confidence is medium since while the core observation feels robust, philosophers might argue finer distinctions exist between the scenarios described.

  The JSON summary should reflect that this sits at the intersection of epistemology, philosophy of language, and machine learning - with implications for how we communicate concepts through examples in technical contexts.
answer: |-
  Your observations pinpoint a nuanced epistemological phenomenon concerning how we infer conceptual boundaries from *curated examples*, where the act of selection itself carries evidential weight beyond the content of the examples. This is distinct from simple induction or overfitting, as it hinges on interpreting the *curator's intent* through their choices. Below is an analysis addressing your query, followed by the requested JSON summary.

  ### Analysis
  The pattern you describe involves two core elements:
  1. **Inferring concept boundaries from selection intent**: When examples are presented as *pedagogical or diagnostic tools*, we assume the curator (e.g., teacher, colleague, system designer) chose them deliberately to illustrate the concept’s essence or limits. This allows us to rule out disjunctive or trivial rules (e.g., in Bongard problems) and infer scope (e.g., bug reports spanning releases).
  2. **Errors arising from misinterpreted intent**: Mistakes occur when we misjudge whether the selection was intentional. For instance, if examples were chosen randomly (e.g., search results) but we assume intent, we overread a signal; conversely, if intentional signals (e.g., a boundary example) are ignored, we underread.

  No single established term perfectly encapsulates this, but related concepts include:
  - **Pedagogical sampling** (machine learning): Where examples are chosen to teach a model efficiently. It overlaps but is domain-specific and doesn’t cover adversarial or unintentional cases.
  - **Paradigm case argument** (philosophy): Uses central examples to define concepts, but ignores the role of selection as evidence.
  - **Grue paradox** (Goodman): Highlights how induction depends on background assumptions but doesn’t address curator intent.

  Your scenarios suggest a unified phenomenon: **selective intent inference**. Both accurate and erroneous inferences stem from the same mechanism—interpreting curator choices as communicative acts. The difference lies in whether our assumptions about intent align with reality.

  ### Boundary Cases
  - **Examples from a scraper/natural process**:  
    `case`: A dataset of "trees" compiled by a web scraper with no human curation.  
    `verdict`: **OUT**  
    `reason`: No intentional selection exists; the "signal" is noise. Inferring concept boundaries from selection is invalid.
    
  - **Teacher as market/selection pressure**:  
    `case`: Successful products in a market "teach" what features are desirable.  
    `verdict`: **UNCLEAR**  
    `reason`: Selection reflects aggregate "intent" (consumer preferences), but not deliberate communication. Inferences are probabilistic, not categorical.

  - **Adversarially chosen examples**:  
    `case`: A bad-faith actor provides misleading examples to distort a concept.  
    `verdict`: **IN**  
    `reason`: Selection is intentional and communicative (though deceptive), so inferences about *intended* boundaries occur—but are manipulated.

  - **Entire population as examples**:  
    `case`: All known cases of a concept are shown (e.g., every Apollo mission).  
    `verdict`: **OUT**  
    `reason`: No selection occurs; the full set negates intent-based inference. Boundaries are defined extensionally, not through curation.

