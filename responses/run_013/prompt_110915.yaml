        "name": "Pedagogical sampling (machine learning)",
        "overlap": "Focuses on how example selection teaches concepts efficiently.",
        "shortfall": "Does not address errors from misattributed intent (e.g., random selections) or non-pedagogical contexts (e.g., bug reports)."
      },
      {
        "name": "Paradigm case argument (philosophy)",
        "overlap": "Uses central examples to define concepts.",
        "shortfall": "Ignores selection as evidence; assumes examples are given, not chosen."
      },
      {
        "name": "Grue paradox (Goodman)",
        "overlap": "Highlights how background assumptions shape induction.",
        "shortfall": "Concerns projectible predicates, not curator intent or selection biases."
      }
    ],
    "boundary_cases": [
      {
        "case": "Examples from a scraper/natural process",
        "verdict": "out",
        "reason": "No intentional selection exists; inferences about concept boundaries from 'selection' are invalid."
      },
      {
        "case": "Teacher as market/selection pressure",
        "verdict": "unclear",
        "reason": "Aggregate 'intent' (e.g., market forces) may weakly signal boundaries, but lacks deliberate communication, making inferences probabilistic and unstable."
      },
      {
        "case": "Adversarially chosen examples",
        "verdict": "in",
        "reason": "Selection is intentional and communicative (though deceptive), so intent-based inferences occur—but are manipulated, fitting the phenomenon's mechanism."
      },
      {
        "case": "Entire population as examples",
        "verdict": "out",
        "reason": "No curation or selection act; boundaries are defined extensionally, removing intent as a factor."
      }
    ],
    "confidence": "medium"
  }
  ```

  ### Explanation
  - **Why no established name?** Philosophy often studies concept acquisition via definitions (e.g., Socratic method) or induction (e.g., Hempel), but seldom focuses on *selection as evidence*. Cognitive science examines "pedagogical reasoning" in humans, but lacks a general term.
  - **Why "selective intent inference"?** It captures the dual role of *selection* (curation) and *intent* (assumed communicative purpose), with *inference* emphasising the deductive leap.
  - **Confidence is medium**: While your cases share a clear mechanism, philosophers might argue the Bongard problem involves "rule-following" while bug reports involve "abduction"—though I see intent interpretation as the common thread. Empirical validation in cognitive science could strengthen this.
