  First, they're co-teaching with an ICU physician. The audience includes critical-care fellows, senior ICU nurses, and philosophy grad students. Each group has different backgrounds: clinicians know the death-determination protocol mechanically but haven't thought about the underlying principles; philosophers know the abstract debates but lack bedside experience. The goal is to create a session that connects theory with practice without getting stuck in the brain-death vs. circulatory-death controversy.

  The user specified several key elements: a clear dependency structure for concepts, a single carrying example, misconceptions to address, a check for understanding, and deliberate omissions. They also want a closing question to assess comprehension. Let me tackle each part systematically.

  Starting with the dependency structure. The core framework is the definition/criterion/test distinction. This needs to be established early because everything else builds on it. The definition answers "what is death?"—the irreversible cessation of organismal function. The criterion is "how do we tell?”—either neurological or circulatory. The test is the specific protocol used. Placing this structure upfront prevents confusion between conceptual and practical levels. Next comes the heart stoppage distinction: a heart that won't restart on its own vs. one that can't be restarted even with intervention. This belongs after defining irreversibility but before discussing criteria, as it clarifies why permanence matters for the circulatory criterion. Misplacing it could lead to conflating cessation with irreversibility.

  For the carrying example, the user suggested an ECMO case where the heart stops but external circulation continues. I brainstormed alternatives: a DCD case with autoresuscitation window (too protocol-focused), an anencephalic infant (too rare and emotionally charged), and a somatic integration failure case (too complex). The ECMO example is strong because it's clinically relevant and forces confrontation with what "cessation of circulation" means when machines are involved. It challenges both groups: clinicians might see the body as "not dead yet," while philosophers might overlook integration. I'll stick with ECMO but emphasize that the machine replaces cardiac function without restoring organismal unity.

  Addressing misconceptions is crucial. Mapping them to the sequence:
  - "Brain death is deep coma": defuse early when introducing the whole-brain criterion by contrasting clinical signs.
  - "Brain death is a legal convention": counter when discussing irreversibility, showing somatic disintegration without brain function.
  - "Stopped heart makes death obvious": challenge when presenting the ECMO case.
  - "Machine perfusion means not dead": dismantle when discussing organismal function vs. organ perfusion in the ECMO case.

  The check for understanding involves applying the definition/criterion/test to a scenario. A good answer uses all three levels; a poor one jumps to tests. For the closing question, I propose one about a hypothermic patient after cardiac arrest. A strong answer would distinguish irreversibility under current conditions from permanent cessation, while a weak one might confuse irreversibility with impossibility or focus only on circulation.

  Deliberate omissions include brain death controversies and legal nuances. Stating these omissions upfront keeps focus on metaphysics. The session should end by highlighting the bridge built between abstract concepts and clinical practice.

  Now, structuring the 90-minute plan:
