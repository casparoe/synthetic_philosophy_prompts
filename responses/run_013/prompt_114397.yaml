prompt: |-
  Treat the mid-twentieth-century dispute over group selection as a case study in the units-of-selection debate, and run the analysis in both directions. The episode: V. C. Wynne-Edwards argued, in his 1962 book Animal Dispersion in Relation to Social Behaviour, that animals possess population-regulatory behaviors — he called them epideictic displays — that evolved because they restrain breeding and prevent the overexploitation of resources, so that groups which fail to restrain themselves go extinct; George Williams's 1966 critique, and the gene-centered tradition of Hamilton and Maynard Smith, replied that such restraint cannot spread because it is individually disadvantageous, and that appeals to group benefit smuggle teleology into biology. Later work argued that kin selection and multilevel selection are often formally interchangeable descriptions of the same dynamics, and that Wynne-Edwards's qualitative reasoning can be rebuilt with explicit models. Assume all of the above as given and do not look anything up.

  First, map the episode onto the debate's competing positions — gene's-eye, individual, group, and multilevel. For each position, state who the selecting agent is, what the unit is, what would count as evidence, and what that position implies Wynne-Edwards and his critics should have concluded. Second, run the analysis backward: say what the episode reveals about the debate itself — which objections the gene's-eye view settled cleanly, where it was silent or circular, whether the formal equivalence between kin and multilevel selection dissolves the disagreement or merely relocates it, and whether the original dispute was ever genuinely empirical rather than partly verbal. Be disciplined about the mapping and say where a position is silent rather than forcing it to speak.

  Return a single JSON object with exactly these fields: "episode_summary" (one neutral paragraph); "positions" (array of objects, each with "position", "unit_of_selection", "selecting_agent", "evidence_criterion", "verdict_on_wynne_edwards", and "verdict_on_critics"); "explains_cleanly" (array of short strings); "silent_or_circular" (array of short strings); "equivalence_effect" (one of "dissolves", "relocates", or "neither", with a companion "equivalence_reasoning" string); "empirical_or_verbal" (an object with "assessment" and "residual_empirical_question"); "verdict" (which position the episode best supports, with "verdict_reasoning"); "confidence" (one of "low", "medium", or "high", with "confidence_reason"); and "weakest_claim" (the single claim in your own analysis you are least sure of). Write in American English.
reasoning: |-
  We are given a historical episode in evolutionary biology: the dispute over group selection, centered on Wynne-Edwards (1962) and Williams (1966). We are to analyze this as a case study in the units-of-selection debate.

  First, we map the episode onto the competing positions: gene's-eye, individual, group, and multilevel.

  For each position, we must define:
  - The selecting agent: what does the selecting (e.g., environment, other individuals, etc.)
  - The unit of selection: what is being selected (gene, individual, group, etc.)
  - Evidence criterion: what would count as evidence for this position?
  - Verdict on Wynne-Edwards: what should this position conclude about Wynne-Edwards's argument?
  - Verdict on critics: what should this position conclude about Williams and the gene-centered critics?

  Positions to consider:
  1. Gene's-eye view (associated with Williams, Hamilton, Maynard Smith)
  2. Individual selection (classical Darwinian)
  3. Group selection (Wynne-Edwards's position)
  4. Multilevel selection (which considers selection at multiple levels)

  Second, we run the analysis backward to see what the episode reveals about the debate.

  We must also address:
  - Which objections the gene's-eye view settled cleanly?
  - Where it was silent or circular?
  - The effect of the formal equivalence between kin and multilevel selection: does it dissolve the disagreement or just relocate it?
  - Whether the original dispute was empirical or partly verbal.

  Finally, we return a JSON object with the specified fields.

  Let's break down each position:

  1. Gene's-eye view:
     - Selecting agent: The environment (including other genes and organisms) that affects gene replication.
     - Unit of selection: The gene (or allele) as the replicator that is selected.
     - Evidence criterion: Changes in gene frequencies in the population that cannot be explained by selection at higher levels or by drift.
     - Verdict on Wynne-Edwards: Should reject his argument because the altruistic behavior (restraint) is not advantageous for the gene (it would be outcompeted by selfish genes within the same group). Hence, group benefit arguments are teleological without a mechanism for gene-level advantage.
     - Verdict on critics: Supports them because they correctly point out that individual disadvantage (at the gene level) prevents the spread of restraint.

  2. Individual selection:
     - Selecting agent: The environment (including resources, predators, etc.) and other individuals (competition, mating).
     - Unit of selection: The individual organism.
     - Evidence criterion: Differential survival and reproduction of individuals (phenotypes) leading to changes in population.
     - Verdict on Wynne-Edwards: Should reject because the behavior (restraint) is individually disadvantageous (restrained individuals leave fewer offspring than unrestrained ones in the same group). Hence, it cannot evolve by individual selection.
     - Verdict on critics: Supports them because the critics argue that individual advantage is key.

  3. Group selection:
     - Selecting agent: The environment acting on groups (e.g., extinction of whole groups).
     - Unit of selection: The group (a collection of individuals).
     - Evidence criterion: Differential survival and extinction of groups, and the trait in question must be heritable at the group level.
     - Verdict on Wynne-Edwards: Supports his argument because the trait (restraint) is beneficial at the group level and groups without it go extinct.
     - Verdict on critics: Rejects them because they ignore the group level and focus only on individual advantage.

  4. Multilevel selection:
     - Selecting agent: Selection operates at multiple levels (gene, individual, group) simultaneously.
     - Unit of selection: Multiple units (genes, individuals, groups) depending on the context.
     - Evidence criterion: Partitioning of selection into within-group and between-group components (e.g., using the Price equation). Evidence would show that between-group selection is strong enough to overcome within-group selection against the trait.
     - Verdict on Wynne-Edwards: Partially supports because the qualitative reasoning can be formalized in a multilevel model, but only under specific conditions (e.g., high group extinction rates and low migration). Without explicit modeling, the original argument was incomplete.
     - Verdict on critics: Partially supports because they correctly noted that individual-level selection is against restraint, but they may have underappreciated group-level effects when conditions are met.

  Now, for the backward analysis:

  - Explains cleanly: The gene's-eye view (and individual selection) cleanly explained why altruistic traits that are costly to the individual cannot evolve by individual selection alone. It showed that without a mechanism like kin selection (inclusive fitness) or reciprocal altruism, such traits would be outcompeted.

  - Silent or circular: The gene's-eye view might be silent on how group-level effects might emerge from gene-level dynamics (e.g., when group structure is important). Also, it might be circular if it defines fitness only in terms of gene propagation without independent criteria. But in this case, it was not circular because it made predictions about the spread of genes.

  - Equivalence effect: The formal equivalence between kin selection and multilevel selection (via the Price equation) shows that they are two ways of modeling the same process. This equivalence does not dissolve the disagreement but relocates it: the debate becomes about which level is more convenient or heuristically useful, but the underlying dynamics are the same. Hence, we choose "relocates".

  - Empirical or verbal: The original dispute was partly verbal because the two sides were using different frameworks (group vs. gene/individual) and not fully specifying the conditions. However, there was an empirical core: under what conditions (e.g., group structure, migration rates, extinction rates) can group-beneficial traits evolve? The residual empirical question is: how common are these conditions in nature?

  Verdict: The episode best supports the multilevel selection position because it acknowledges the validity of the gene's-eye view (within-group selection against altruism) but also shows that group selection can operate under specific conditions. The later formal models (e.g., by D.S. Wilson) showed that Wynne-Edwards's ideas could be modeled in a multilevel framework.

  Confidence: Medium. The mapping of positions is clear, but the verdict on which position is best supported is debated in the literature. We have to base it on the given that later work rebuilt Wynne-Edwards's reasoning with explicit models.

  Weakest claim: The claim that the original dispute was partly verbal. It is difficult to disentangle the verbal from the empirical without detailed historical analysis.

  Now, we structure the JSON as per the instructions.
