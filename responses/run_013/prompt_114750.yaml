prompt: |-
  I've been going back and forth on supererogation and I want to pin down what I actually think, because my gut keeps doing something wierd with certain cases and I can't tell if the gut or the theory is wrong.

  The picture I was taught: an act is supererogatory when it's (a) not required, (b) morally good, and (c) praiseworthy. Fine. Here's my gut on a pile of cases.

  - Someone runs into a burning building and pulls out a stranger's kid. Not required, heroic, supererogatory, no question.
  - Same guy does it while terrified and nearly chickens out. Same verdict. The fear doesn't subtract anything, in my book.
  - A man gives a kidney to a stranger and it's pretty clearly mainly to win a long-running argument with his brother-in-law about which of them is the more decent person. I still want to call the act supererogatory. The man, maybe not so praiseworthy. This is where clause (c) starts wobbling for me.
  - Someone gives 40% of their income to bednets. Not required, I'm confident it's supererogatory. But if everyone in their bracket did it, I don't think it'd be supererogatory anymore, it'd be ordinary decency. So whether an act is supererogatory depends on what other people are already doing? That bothers me and I don't know if it should.
  - A doctor who could make three times the money doing cosmetic work spends her life in a rural clinic. Not required, good, praiseworthy. But I don't think I'd say she *did* anything supererogatory. She just picked a career. So is it whole lives that can be supererogatory, or only acts? 
  - Giving up your seat to someone exhausted on the train. Nice, not required. Calling it supererogatory feels like inflation. Where's the line between 'nice' and 'beyond the call'?
  - Passing up revenge when you have the perfect chance and nobody would blame you for taking it. I want to call that supererogatory too, even though it's a non-act. Does that break the whole act-shaped picture?
  - I promise to drive a friend to the airport, then my dad has a stroke the same morning. I don't think I'm still required to drive them, and the friend would be a jerk to insist. But if I drive them anyway, that feels supererogatory now -- it was required when I made it, then stopped being required, and now doing it is beyond the call. A category that shifts mid-stream. No idea what to do with that.
  - And the one that really gets me: someone who pours everything into a cause and quietly wrecks their own kids in the process. Each individual act looks like the burning-building case. The life as a whole I think is flatly wrong. So can 'supererogatory' attach to acts that are pieces of an overall wrong life? Or is my act-level verdict the mistake?

  Is there a principled account that gets all of these, or close? If not, which of my verdicts do I have to give up? Specifically I want to know (1) whether praiseworthiness is part of what makes the act supererogatory or a separate fact about the agent, (2) whether the category is relative to what others are already doing, and (3) whether the good-making feature has to sit in a single act or can sit in a pattern or a life. And give me one case I haven't listed where your preferred account and the standard three-part one come apart, so I can see what's actually riding on it.
reasoning: |-
  Okay, let me tackle this user's deep dive into supererogation. They're clearly wrestling with philosophical concepts but grounding them in vivid real-life cases. First, I need to recognize their core struggle: their intuitive judgments clash with the standard three-part definition (optional, good, praiseworthy) in several scenarios. 

  Hmm, their kidney donation case is particularly telling - they feel the act itself is supererogatory despite the donor's questionable motives. That immediately suggests praiseworthiness might be separate from the act's status. And the 40% income donation case reveals their unease about societal relativity - if everyone gave that much, it wouldn't be "beyond duty" anymore. That's a major clue the standard account needs tweaking.

  The doctor career choice puzzles me too. Why does dedicating a lifetime to underserved medicine feel less supererogatory than a heroic one-off act? Maybe because we evaluate careers through a different lens - as character expressions rather than discrete acts. And that revenge omission case... fascinating! Supererogation typically involves positive actions, but forgiving when revenge is justified feels morally significant in the same "beyond duty" way.

  Ah, the broken promise case is sneaky! When circumstances void an obligation, fulfilling it anyway shifts from duty to supererogation. That shows obligation isn't static - which complicates the "optional" criterion. And the activist parent case... chills. This exposes the tension between act-based and life-based assessment. Each sacrifice seems heroic alone, but collectively they're catastrophic. 

  For a principled solution, I'm leaning toward Feinberg's framework: supererogation as (1) optional (2) good (3) not blameworthy for omission. This neatly resolves the kidney donor issue - his motive doesn't negate the act's goodness. Societal relativity? We handle that by distinguishing morality from duty - duties are minimal standards, so what's "beyond" can shift with norms. 

  The life/act question requires nuance. Whole lives can't be supererogatory because they're aggregates, but patterns can create new obligations (like parenting). My test case: donating bone marrow. Painful, risky, but not usually required - yet refusing isn't blameworthy. Under standard definitions, it's supererogatory, but some might argue it's actually obligatory. That tension reveals how cultural expectations shape our "duty" thresholds.

  Ultimately the user needs to decide: can they accept that (a) praiseworthiness is agent-focused, not act-focused, (b) "beyond duty" is society-relative, and (c) acts must be evaluated contextually? If not, which intuitions are they willing to sacrifice? The activist parent case suggests act-level assessment might need tempering - perhaps supererogatory acts mustn't violate other duties. That'd preserve their core insight without collapsing the framework.
answer: |-
  You're wrestling with deep tensions in ethical theory - and your intuitions are spot-on. The standard three-part definition cracks under pressure from real-world complexity. Here's a principled account that honors most of your judgments, followed by where you might need to adjust:

  ### A Revised Framework (Building on Feinberg/Chisholm)
  1.  **Beyond Obligation:** The act is *not morally required* (you wouldn't be blameworthy for omitting it).
  2.  **Morally Good:** The act (or omission) *objectively promotes good* or *prevents harm* in a significant way.
  3.  **Non-Blameworthy Omission:** Crucially, **praiseworthiness is separated**. It pertains to the *agent's character/motivation*, not the *act's status*. The act is supererogatory if omitting it is *not blameworthy*, even if performing it isn't necessarily praiseworthy.

  ### Applying it to Your Cases
  1.  **Burning Building Kid:** ✅ Beyond obligation, ✅ Morally good, ✅ Not blameworthy to omit. **Supererogatory.** Praiseworthy agent.
  2.  **Terrified Rescuer:** ✅ Same as above. Fear doesn't negate the act's goodness or optionality. **Supererogatory.** Agent *more* praiseworthy for overcoming fear.
  3.  **Kidney with Bad Motive:** ✅ Beyond obligation, ✅ Morally good (kidney saves a life), ✅ Not blameworthy to omit. **Supererogatory.** ❌ Agent is *not praiseworthy* (motives matter for praise, not act-status).
  4.  **40% Income to Bednets:** ✅ Beyond obligation (current norms), ✅ Morally good. **Supererogatory now.** *But:* If norms shifted such that 40% was *expected* of that bracket to prevent catastrophic harm, it *could become obligatory*. "Beyond obligation" *is* relative to societal context/demands of the situation. This relativity is unavoidable.
  5.  **Rural Doctor:** This is a *pattern of choices*, not a single act. Choosing the career initially might be supererogatory. *Sticking* with it might be supererogatory year after year. But we rarely label ongoing careers "supererogatory acts." We see it as expressing a virtuous character. **Verdict:** Individual career choices *could* be supererogatory, but the *life* is better described as "heroically virtuous" or "exemplary." Supererogation fits discrete acts better.
  6.  **Giving Up Seat:** ✅ Beyond obligation (usually), ✅ Morally good (minorly). **Weakly supererogatory.** The "line" is fuzzy. Significance matters. This is near the threshold. Calling it "supererogatory" isn't wrong, just feels like overkill because the cost/benefit is low. It's "beyond the call" but barely.
  7.  **Passing Up Revenge (Non-Act):** ✅ Beyond obligation? (Revenge is usually forbidden, so *not* taking it is obligatory!). But wait: Suppose revenge was *permissible* in this case (unjust system, no recourse, victim blameless). *Not* taking it would be: ✅ Beyond obligation (permissible to take it), ✅ Morally good (prevents harm/promotes peace), ✅ Not blameworthy to omit (i.e., to take revenge). **Supererogatory omission is possible.** It breaks the "act-shaped" picture, but the logic holds.
  8.  **Broken Promise Due to Emergency:** ✅ Driving them *after* the stroke is *not required* (obligation voided), ✅ Morally good (helps friend), ✅ Not blameworthy to omit (emergency justifies). **Supererogatory.** The category *can* shift mid-stream because obligations can be voided by circumstances. What was obligatory becomes optional/supererogatory.
  9.  **Activist Wrecking Kids:** Each *individual act* (e.g., attending a crucial meeting, donating funds) *might* be: ✅ Beyond obligation (in isolation), ✅ Morally good (promotes cause). **But:** The *overall pattern* likely violates stringent obligations to their children. This creates a conflict:
      *   **Act-Level:** A specific donation *might* technically be supererogatory *if* it didn't directly cause immediate, severe harm to the kids *at that moment*. But...
      *   **Life-Level:** The *life* is morally deficient (failing core duties). Performing "supererogatory" acts *while chronically neglecting stringent duties* is morally wrong overall. The *act* isn't truly "good" *in context* if it perpetuates the neglect of a more urgent duty. Your life-level verdict is likely correct; the act-level verdict is suspect because the act exists within a pattern of dereliction.

  ### Answering Your Core Questions
  1.  **Praiseworthiness:** **Separate.** It's about the *agent's character/motivation*. The *act* is supererogatory based on its optionality, goodness, and the non-blameworthiness of omission. A morally good, optional act can be supererogatory even if done for lousy reasons (Kidney Case). Praise is for the *why*, supererogation is for the *what* and *that it wasn't demanded*.
  2.  **Relativity to Others:** **Yes, unavoidably.** "Obligation" sets a baseline. What is "beyond" depends on that baseline. If societal norms or the demands of preventing catastrophe shift (Bednets Case), what was once supererogatory can become obligatory. Supererogation lives in the space *above* the current minimum standard of duty.
  3.  **Locus of Good (Act/Pattern/Life):** **Primarily discrete acts.** While patterns of supererogatory acts define a virtuous character, and lives can be described as saintly, *supererogation* as a category applies most cleanly to specific actions or omissions. Whole lives are aggregates evaluated differently (Doctor, Activist Cases). Patterns matter *contextually* for judging if an act violates a more stringent duty (Activist Case).

  ### A Test Case Where Accounts Diverge
  **The Case:** A healthy adult donates bone marrow (a painful, somewhat risky, but not life-threatening procedure) to save the life of a complete stranger. They are not motivated by praise, but by a simple, impersonal sense that it's the right thing to do.

  *   **Standard 3-Part View:** ✅ Not required, ✅ Morally good, ✅ Praiseworthy (good motive). **Supererogatory.**
  *   **Revised View:** ✅ Not required (current norms), ✅ Morally good (saves a life), ✅ Not blameworthy to omit. **Supererogatory.**

  *Where They Diverge (Slightly):* Now, imagine the *same act*, but the donor is *solely* motivated by the desire for a specific, rare medal only awarded for extreme altruism (and they don't care about the stranger at all).

  *   **Standard 3-Part View:** ❌ Clause (c) "Praiseworthy" likely fails due to bad motive. **Not Supererogatory.** (This clashes with your Kidney Case intuition).
  *   **Revised View:** ✅ Not required, ✅ Morally good (still saves a life!), ✅ Not blameworthy to omit (you can't force marrow donation). **Supererogatory.** The *act* is beyond duty and good. The *agent* is not praiseworthy.

  **What's Riding On It:** The revised view insists that the *moral status of the act itself* (its goodness and optionality) is distinct from the *moral evaluation of the agent*. It preserves the idea that saving a life at significant personal cost is *always* a morally good thing to do that isn't strictly demanded, regardless of why the person did it. The standard view risks collapsing the act's status entirely into the agent's character.

  ### Conclusion: What You Might Need to Give Up
  *   **Tightly Linking Praiseworthiness to Supererogation:** Your Kidney Case intuition is strong and correctable in the revised view. Separate them.
  *   **Absolute Non-Relativity:** The Bednets Case shows relativity is inescapable. Obligations shift; what's "beyond" shifts with them.
  *   **Strictly Act-Shaped Supererogation:** Passing Up Revenge shows omissions can qualify. The Activist Case shows an act's "goodness" can be undermined by its role in a larger pattern of failing core duties. Context matters profoundly.
  *   **Supererogation Applying Cleanly to Whole Lives/Careers:** These are better described using other terms (heroic virtue, exemplary life). Supererogation fits discrete choices best.

  Your gut is highlighting real problems with the simplistic model. The revised view (Optional / Good / Non-Blameworthy Omission) accommodates almost all your intuitive judgments while providing a more robust and nuanced framework. The key is decoupling the *act's status* from the *agent's praiseworthiness* and accepting the contextual nature of "beyond obligation."
