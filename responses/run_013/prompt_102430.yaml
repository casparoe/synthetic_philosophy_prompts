answer: |-
  Here's a breakdown addressing your query, using a concrete example and analyzing the relocation of Bradley's regress:

  **1. The Inheritance Strategy & Its Problem:**  
  The strategy proposes that propositional unity (e.g., why "Socrates is mortal" is a single truth-bearing unit, not just "Socrates" + "mortality") is borrowed from the unity of the mental act/state it expresses (e.g., the *judging-that-Socrates-is-mortal*). This avoids Bradley's regress (where a relation like "instantiates" needs its own unifier, ad infinitum) by grounding unity externally.  

  **2. Concrete Case Where the Strategy Falters: "Electron e orbits nucleus n"**  
  *   **The Proposition:** "Electron e orbits nucleus n" (a fundamental physics claim).  
  *   **The Mental Act/State:** A scientist's *judgment* or *belief* that electron e orbits nucleus n.  
  *   **Inheritance Claim:** The unity of the proposition stems from the unity of the scientist's belief state.  

  **3. The Relocated Regress:**  
  The strategy **relocates** (not blocks) Bradley's regress to the level of the mental act/state. Here's how:  
  *   **Step 1:** The proposition "e orbits n" inherits its unity from the scientist's unified belief state *B*.  
  *   **Step 2:** But *B* itself has constituents:  
      *   A representation of *e* (the particular electron).  
      *   A representation of *orbiting* (the relational concept).  
      *   A representation of *n* (the particular nucleus).  
      *   The "belief" attitude/mode.  
  *   **Step 3:** What unifies *these* constituents into the single, structured state *B*? If the inheritance strategy simply asserts that *B* is "primitive" or "intrinsically unified," it offers no explanation.  
  *   **Step 4:** If we posit an *internal* relation or structure within *B* (e.g., the attitude "binds" the content), we restart Bradley's regress:  
      *   What relates the attitude to the content-complex (e + orbiting + n)?  
      *   If a further relation *R1* is needed (e.g., *entertaining*), what unifies *R1* with the attitude and the content-complex?  
      *   This demands *R2*, and so on, infinitely.  

  **The relocated step is the unity of the mental state itself.** The strategy avoids the regress *within the proposition* but immediately confronts an **identical regress within the mental act/state** whose unity was supposed to explain the propositional unity. The core problem (what prevents a complex from being a mere list?) reappears one level up.

  **4. Verdict: Relocation = Postponement (Not Answering)**  
  *   **Grounds for Postponement:**  
      *   **Explanatory Vacuum:** The strategy transfers the burden of explaining unity but provides no *new resources* to explain it at the new level. It simply asserts that mental states *are* unified without explaining *how* this is possible without falling into the same regress.  
      *   **No Blocking Mechanism:** It doesn't identify a point where the regress stops; it only shifts the location where the "What provides the unity?" question must be asked. The fundamental mystery of complex unity remains untouched.  
      *   **Begging the Question:** Asserting that mental states are intrinsically unified without explaining *how* avoids the regress only by presupposing a solution to the very problem the regress highlights.  
      *   **Ontological Proliferation (Potential):** If one then tries to explain mental state unity by appealing to *another* level (e.g., neural states), the regress simply shifts again.  

  *   **Why it Doesn't Answer:**  
      Answering Bradley's regress requires either:  
      1.  **Identifying a Stopping Point:** A genuinely simple, non-relational unifier (e.g., a non-composite act, a primitive power). The inheritance strategy doesn't do this; it just points to a different complex entity (the mental state).  
      2.  **Dissolving the Presupposition:** Showing the regress arises from a mistaken assumption (e.g., that relations need relata *and* a distinct unifier). The strategy doesn't challenge this assumption; it tacitly accepts it and runs the regress at the mental level.  

  **Conclusion:**  
  The inheritance strategy for propositional unity, exemplified by the failure in the "electron e orbits nucleus n" case, **merely postpones Bradley's regress by relocating it to the unity of the mental act or state.** It does not answer or block the regress. The grounds are that it fails to provide a principled explanation for the unity of the mental state itself, leaving the core problem of complex unity unsolved and simply moving the infinite explanatory demand to a different ontological level. The regress recurs because the strategy does not address the underlying metaphysical question: **What constitutes the non-mereological unity of any complex entity (propositional or mental)?** Until this is resolved, relocation is evasion, not solution.
