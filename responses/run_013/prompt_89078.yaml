  1. "Aristotle treats money as something that exists by convention rather than by nature. ... since nomisma comes from nomos. Money's point is to stand in for need: ... I can sell my surplus for coin now and buy what I want later."

     This is a correct setup. Aristotle does hold that money is conventional (not natural) and that it serves as a medium to facilitate exchange by representing need.

  2. "So money does both of the jobs from the lecture."

     The lecture split money into two jobs: conversion and commensuration. The student claims Aristotle thinks money does both.

     However, we must check: Does Aristotle think money does both? 

     For conversion: Yes, Aristotle says money allows us to store value for future exchange.

     For commensuration: Aristotle does say that money serves as a measure to make unlike things commensurable. But note: Aristotle is critical of the idea that money can truly make goods commensurable in a natural sense. He thinks that in reality, goods are made commensurable by human need (demand) and that money is a conventional measure. So the commensuration job is done by money, but it's conventional.

     The student says: "But it does the commensuration job too." and then explains that money is the measure that makes goods comparable. This is correct.

     Then: "And since money is by convention, the comparability it supplies is by convention as well — there is no natural measure for it to track, and the ratio at which goods trade is whatever the currency convention settles on."

     This is exactly right. Aristotle argues that commensurability is not natural but conventional. So the answer to (a) is that Aristotle thinks money does both jobs, and that commensurability comes from convention (not nature).

  3. Part (a) also asks: "what does his answer tell us about where he thinks the commensurability of goods comes from?" The student says: from convention.

     This is correct.

  4. Now part (b): connect to justice in exchange (proportional reciprocity) and wealth-getting and interest.

     The student writes: "What that gives him is justice in exchange as proportional reciprocity rather than equality: ... the ratio be preserved, not that each side gives the same amount. ... exchange relates parties who are unlike ... and the exchange is what ties them together."

     This is correct. Aristotle's justice in exchange is about proportionality (e.g., the ratio of what the doctor gives to what the farmer gives should be proportional to the value of their products). The student correctly notes that it's about preserving the ratio and that it ties together unlike parties.

  5. On wealth-getting: "Acquisition that serves the household has a natural limit, whereas chrematistics, which aims at money for its own sake, has none. He treats interest as the worst case, because the lender's gain doesn't come from any work of his own — nobody has laboured for the return, the money just breeds."

     This is also correct. Aristotle distinguishes between natural acquisition (oikonomia) and unnatural wealth-getting (chrematistics). He criticizes interest because it makes money from money without any productive activity.

  6. And then: "So the city is held together by proportional reciprocity, and money is the device that makes it possible."

     This is a good summary.

