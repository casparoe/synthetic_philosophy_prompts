     However, the connection between the commensuration job and justice could be made more explicit. The student does say: "money is the device that makes it possible" for the city to be held together by proportional reciprocity. So it's there.

     The student also says: "the exchange ratio isn't something you could read off nature" and then connects to proportional reciprocity. This is good.

  Therefore, the main issue is the minor omission in part (a) about the source of commensurability.

