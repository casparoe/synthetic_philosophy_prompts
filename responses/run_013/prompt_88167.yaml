answer: |-
  ## The Pull of the Ropes

  The bells of St. Dunstan’s hung heavy, their bronze mouths stilled. Below, in the ringing chamber smelling of ancient stone, rope grease, and damp wool, the band gathered. Ellen, steady on the treble, watched the new ringer, Peter, fidget with his sally. He’d learned Plain Hunt quickly, grasped Grandsire, but St. Dunstan’s Delight – the intricate method that twisted the bells through complex cross-sections – was proving trickier.

  "Right then," called Arthur, the conductor, tapping the open peal book. Its pages were foxed with age, dense with neat grids of numbers representing past performances. "We’ll start from rounds. Peter, remember: at the first lead end, *you* make the dodge with the fifth. Watch the tenor’s position. It’s a cruciform method, think of the crossings."

  Peter nodded earnestly. "Right. Cruciform. Dodge with fifth at first lead end." He’d studied the diagram pinned to the dusty wall: a complex lattice of lines intersecting, dots marking bell positions at each change. It looked like a spider’s web designed by an architect.

  They began. The ropes rose and fell, the bells speaking their ordered sequence: *Rounds*. The pattern shifted. Ellen felt the familiar pull, the sequence unfolding as it always had. *Dodge here, lead there*. They reached the first lead end. Peter’s rope hesitated, jerked. The tenor, expecting the dodge, struck out of turn. A discordant clang shattered the rhythm.

  "Stop!" Arthur barked. "Peter. The dodge. *With* the fifth, remember? Look." He pointed furiously at the peal book entry for that specific change. "See? 123456 becomes 132546. *You* move to third place. It’s written."

  Peter flushed. "Sorry! Misjudged the pull. Got it now. 132546."

  They started again. Smooth sailing through known territory, the peal book a solid record beneath them. They reached the second lead end, then the third. Peter rang true. They pushed on, into a section less frequently rung, marked only by sparse entries in the ledger.

  Then came the change no one had rung together before, just beyond the last full peal recorded – the point where the cruciform pattern demanded a specific cross-section. Ellen braced, feeling the collective tension in the ropes. The tenor should drop into fourth place, the treble (her bell) rise to second.

  *Clash!*

  Peter’s bell, the third, rang where the treble should have been. The row clattered out wrong: 213456 instead of 231456.

  "Stop!" Arthur roared. "Peter! What was that? It’s 231456! Look at the diagram!" He stabbed a finger at the pinned sheet. "See the crossing? The lines *cross* there! Treble up to second, third down to fourth!"

  Peter stared, bewildered but utterly sincere. "But… that’s what I did? The lines *do* cross. I saw them cross… *differently*. The third rises here, surely? Look." He traced a path on the diagram, his finger following a line Ellen couldn’t see. "It *could* go this way. The diagram doesn’t say *how* the cross happens, just that it does. And it fits all the changes we’ve rung so far."

  Silence. Ellen’s hand stung where the rope had burned. She looked at the peal book entry Arthur had shown earlier. It showed 132546, yes, but that was a different point. The ledger was blank for this exact sequence. Old Tom, who’d rung here fifty years, frowned. "It… it *feels* wrong, lad. Sounds wrong. It’s always been the treble up there."

  "But how?" Peter insisted, his voice tight. "Show me where it’s written that it *can’t* be my way? The diagram shows crossings, but it doesn’t say *which* bell goes where at *this* particular crossing beyond what we’ve done. My intention was pure St. Dunstan’s!"

  Martha, ringing the fifth, spoke up, practical. "Perhaps he’s just naturally disposed to ring it that way? Some ringers have a different swing. Maybe *his* St. Dunstan’s is different?"

  Tom snorted. "Disposition? My disposition yesterday made me clip the sally and muff the backstroke twice. Was *that* right? No! Arthur corrected me sharpish. If what I’m *disposed* to do *is* the method, then there’s no such thing as a mistake! We’re all just ringing our dispositions, clashing be damned. But we *know* a mistake when we hear it. *That*," he pointed at Peter’s rope, "was a mistake."

  Arthur rubbed his temples. "Enough. Peter. However you see it, however you intend it, the method, *here*, *now*, with *this* band, requires the treble to rise. Ring 231456. Again. From the last correct row."

  They began again. Peter rang cautiously. He reached the critical point. Ellen saw the flicker of doubt in his eyes, the slight pull on his rope that suggested his internal image was pulling him the other way. He hesitated… then followed Arthur’s call. The bells slipped into 231456. Harmony.

  "Good!" Arthur called, relief in his voice. "Hold it. Now, next change..."

  They continued. Peter needed correction twice more at the same critical point, his hand seemingly fighting itself. Each time, Arthur’s call, the band’s established rhythm, pulled him back to 231456. Slowly, the hesitation faded. He began to *feel* the pull of the band, the expectation woven into the ropes.

  Later, over lukewarm tea in the vestry, Simon, a quiet man who rang the tenor, spoke softly to Ellen. "He was so sure. It felt… unsettling." Simon pulled a small, private notebook from his pocket. Its pages were covered in his own unique symbols, diagrams for methods. "I practise alone at St. Hilda’s," he confessed. "No band, no book. Just me and the bells and my notes. I thought I had St. Dunstan’s perfect in my head. But seeing Peter today… how do I *know* my private notes are right? What if, alone, I’ve drifted, like him, and my notebook just records my drift? There’s no one to say 'stop'." He stared at his cryptic markings, a flicker of anxiety in his eyes.

  Old Albert, sipping his tea, watched Peter now listening intently as Arthur pointed again at the diagram, explaining the cross-section. Albert murmured, almost to himself, "It’s not that we all see the cross the same way, Ellen. It’s that agreeing *on* the cross *is* seeing it. If we all saw it alone, how would we know it was the same? The band… the band *is* the agreement. It’s the pull." He didn’t elaborate. He didn’t need to. Ellen felt the truth of it, solid and yet strangely weightless.

  The following Thursday, they attempted the full peal of St. Dunstan’s Delight. The ropes flew, the bells spun their intricate dance through the tower stone. They approached the critical cross-section, the one Peter had stumbled on. Ellen felt the familiar collective tension, the shared breath held. Arthur called the treble’s position, clear and firm. Peter’s rope moved, decisive now, slotting his bell precisely into the pattern the band expected. The row rang true: 231456. Harmony flowed, unbroken, into the next change, and the next. The peal built, a complex, living architecture of sound rising into the grey English sky. Below, the ropes danced in practised unison, pulling the bells, pulling the band, onward through the method, together.
