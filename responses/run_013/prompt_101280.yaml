prompt: |-
  ok so I'm writing something arguing that the "constitution as a Ulysses contract" move is doing alot of sleight of hand, and I want a worked case instead of more hand-waving. Can you build me a thought experiment that isolates exactly one variable: who's being bound. Same binding mechanism, same penalties, same stakes, two versions — one where a single person ties their own hands, one where a majority ties the hands of future majorities — and it has to come out so that:

  (a) a present-preference theory of rationality (rational = best satisfies the preferences you actually have at the moment you act) says the individual should break the bind,
  (b) a planning-agent / unified-agent theory (rationality is about the plan the agent endorses across their whole life, not the slice of them doing the acting) says they should keep it,
  (c) on the collective side those two come apart or flip — the precommitment-friendly view has to defend entrenchment while the democratic-sovereignty view has to call it illegitimate — and I want to see which way each of (a) and (b) actually lands once it's a group instead of a person.

  Constraints: no time travel, no brain chips, no sci-fi. Realistic setting — a person, a clinic, a union, a legislature, whatever fits, but keep it ordinary. The scenario itself should be a paragraph, tops; the rest is you doing the work. Important: it can't be a case where the future self simply can't defect because the door's locked — the whole interest is that they *can* defect and shouldn't, so the bind has to bite normatively rather than causally. And one more thing, which is kind of the crux: make the retrospective endorsement hold — the agent at the end is glad it was enforced and would set it up again — so the present-preference view has to say something awkward about whose present gets to count.

  Then walk me through it: what each theory says about each version and why, which single feature of the case is doing the work (I have a hunch it's something about the felt continuity of the self, and I want to know whether that survives when the bound party is a collective that doesn't feel continuous with itself), what happens if I pull that feature out, and how someone who thinks the analogy actually holds would attack the case.
