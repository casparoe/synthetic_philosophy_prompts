prompt: |-
  I run the lessons-learned desk for a state health department's outbreak response unit — I'm the person who writes the after-action report for every significant outbreak or weather emergency we respond to, which works out to five or six a year, each one about a day and a half of writing, and every one of them goes into a public database that feeds into our guidance documents and next year's budget lines. So a causal claim in one of these reports has a way of hardening into policy, and a reporter once read a sentence out of a four-year-old report of mine back to me on the phone, which was not a good day. The trouble is that every report I write comes out as a story: three or four hinge moments, somebody who dropped the ball or somebody who saw it coming, and by the last page the whole thing looks like it was always going to unfold the way it did. A retired historian who sits on our advisory board keeps telling me my reports are hindsight dressed up as analysis and that the same archive could support three different stories depending on where I decide the interesting part starts. I think he's right and I don't know what the alternative is. I understand the two things he's gesturing at well enough — hindsight bias, where knowing how it turned out makes that outcome feel like it was the likely one all along and quietly erases how uncertain everyone actually was in the middle of it, and the narrative fallacy, where we squash a messy sequence into a tidy story with a couple of causes and a moral, and then mistake the story's coherence for evidence about the world. What I don't have is anything to do on Tuesday.

  So: can you turn this into a procedure I can actually run on a draft, in order, over the course of an afternoon? I want the sequence of questions, what counts as a sufficient answer to each, the point at which the procedure stops and says there is no causal finding here rather than a weak one, and the point at which it hands the decision to a person because the question is one of values or of what the department is willing to say in public. It has to survive the specific things that go wrong in my drafts. The timeline: I write it knowing the ending, and the actors didn't. The descriptions: the "first case" is only the first case because of how things turned out, and nobody in the room could have been thinking in those terms on the day. The counterfactuals: I write sentences like "had the exclusion order come on day three instead of day nine, this would have been a twelve-case outbreak," and I have no idea what license I have to write that, or what I'd have to be able to show for it. The cast: whether to name people, and how to keep the report from needing a villain. And the compression: I always end up with one or two causes because that's what makes it readable, when I suspect the honest picture is a net with several paths to the same outcome. Also please tell me which steps are judgment calls wearing the costume of method, and what the procedure simply can't do — I'd rather know where it misfires than have it paper over the gap.

  Then run it, step by step, on three drafts I'm actually sitting on. (1) A measles outbreak, 43 confirmed cases over eleven weeks, seeded by a seven-year-old returning from travel, in a county where the affected elementary school had about 84% MMR coverage; the county health officer ordered unvaccinated students excluded on day nine, and my draft says the order came six days late and would have capped the outbreak at twelve cases — that twelve is a number the epi lead produced on the back of an envelope in a meeting and I've never been able to reconstruct it. Two families also refused to cooperate with contact tracing, and the draft has quietly made them the hinge of the whole thing. (2) A four-day heat event in a metro area of about 900,000, with six excess deaths identified after the fact, where we pushed roughly 40,000 text alerts to people on a heat-buddy registry; my draft credits the alert system with averting an estimated 25 to 30 deaths, by comparison with a neighboring metro that didn't send alerts but also has different housing stock, much higher air-conditioning penetration, and a hospital labor dispute running that week. The director loves that finding, obviously. (3) A norovirus outbreak at a long-term care facility where, once I strip out the story, I think the only defensible claim is that the place was short-staffed in a way that everyone already knew about, and the director is going to want a lesson out of it anyway. I'd rather you tell me honestly which of these three the procedure returns nothing useful for.
reasoning: |-
  Okay, the user runs the lessons-learned desk for a state health department. They write after-action reports for outbreaks and emergencies, which become public and influence policy and budgets. Their problem is that their reports tend to turn into narratives with hindsight bias and the narrative fallacy. A historian on their advisory board criticized this, saying the same events could support multiple stories. The user wants a practical procedure to apply to their drafts to avoid these biases.

  First, I need to understand their main challenges: hindsight bias, narrative fallacy, naming individuals, counterfactuals, and over-simplification. The user provided three specific drafts: measles outbreak, heat event, norovirus case. Each has different issues.

  For the measles draft, the user claims the exclusion order was six days late, leading to 43 cases instead of 12. But that 12 number is shaky, and they've scapegoated families who refused contact tracing. The key here is to question the evidence for the counterfactual and whether those families were truly pivotal.

  The heat event credits text alerts with preventing deaths, but the comparison city has different variables. The director likes this finding, so the procedure needs to handle pressure to show success. I should focus on causal attribution and alternative explanations.

  The norovirus case lacks clear lessons beyond known staffing issues. The user might need to accept that some events don't yield new insights, which is okay but hard for stakeholders.

  The user needs a step-by-step procedure that flags biases, assesses evidence, and stops when claims are weak. Steps should include identifying key moments, verifying uncertainty, testing counterfactuals, avoiding villains, and checking for over-compression. Also, they need to know when to hand decisions to humans or admit insufficient evidence.

  For the measles example, the procedure should challenge the "six days late" claim. Without solid data, it's just a guess. The families' role might be overemphasized—maybe other factors were involved. The epi lead's envelope calculation needs scrutiny; if it's not reproducible, it shouldn't be stated as fact.

  For the heat alerts, the comparison with another city is problematic due to confounding variables. The procedure should highlight these differences and suggest downgrading the claim to a possible contribution rather than a definitive number of deaths averted. The director's preference shouldn't override methodological rigor.

  The norovirus case is tricky. If the only finding is known staffing shortages, the lesson might be about systemic issues rather than new fixes. The procedure could help frame it as reinforcing existing knowledge rather than new causation.

  The user also mentioned knowing the ending while writing, which actors didn't. So the procedure must reconstruct the uncertainty at each decision point. Descriptions like "first case" are retrospective labels; the report should note that it wasn't identified as such initially.

  Naming people is a values decision. The procedure should prompt considering alternatives like roles or processes instead of individuals, unless accountability is necessary and verified.

  Compression into a few causes is common. The procedure should ask if multiple factors were considered and if the report acknowledges complexity even if simplified for readability.

  Steps must include judgment call flags. For example, deciding sufficient evidence for counterfactuals or whether to name someone involves subjective thresholds. The procedure should make these explicit so the user knows where bias might creep in.

  Finally, for each draft, running the steps will show where claims hold up or falter. The norovirus case might return no new causal findings, which is acceptable but needs clear communication to avoid forcing a lesson.
answer: |-
  Here's a battle-tested, step-by-step procedure designed to gut-check your drafts for hindsight bias, narrative fallacy, and causal overreach. It forces explicit justification for claims, identifies judgment calls, and flags where to stop. **Run this sequence in order on each draft section making a causal claim or "lesson."**

  **Core Principles of the Procedure:**
  1.  **Separate Observation from Inference:** First document *what happened* and *what was known/when*, then *separately* assess causes/lessons.
  2.  **Reconstruct Uncertainty:** Force yourself back into the fog of the response.
  3.  **Demand Evidence for Counterfactuals:** Treat them as hypotheses, not facts.
  4.  **Identify the "Could Have Beens":** Explicitly state alternative paths that were plausible *at the time*.
  5.  **Degrade Certainty:** Use qualifiers (likely, possibly, suggests) proportional to evidence strength.
  6.  **Embrace Complexity (or Silence):** Acknowledge multiple contributing factors or admit indeterminacy.

  **The Procedure: For Each Causal Claim or Key "Hinge Moment" in Your Draft**

  1.  **Identify the Claim:** Underline the specific sentence(s) making a causal assertion, attribution of blame/praise, counterfactual prediction, or key "turning point."
  2.  **Reconstruct the Timeline & Knowns:**
      *   *Question:* What specific information did decision-makers *actually have* **at the precise time** of the action/inaction being analyzed? (Cite dated logs, emails, situation reports).
      *   *Sufficient Answer:* A bullet-point list of concrete, dated information points available *before* the event/decision. Lack of specific info must be explicitly stated (e.g., "Case count estimate was 3-15 on Day 3; Genomic link not confirmed until Day 7; School vaccination records were incomplete and took 4 days to fully compile").
      *   *Stop If:* You cannot reconstruct specific, dated knowledge *available at the time*. Claim likely relies on hindsight. Flag: "Claim X appears influenced by knowledge of later events."
  3.  **Assess Plausible Alternatives (Then & Now):**
      *   *Question:* Based *only* on what was known **at the time**, what were 2-3 other plausible interpretations of the situation or reasonable alternative actions/inactions? What other outcomes seemed plausible then?
      *   *Sufficient Answer:* A brief description of 2-3 concrete, contextually reasonable alternatives that existed *in the moment*, based on Step 2 evidence. (e.g., "Plausible alternatives on Day 3: Wait 24h for more test results; Issue advisory to pediatricians only; Exclude only symptomatic unvaccinated children").
      *   *Stop If:* You cannot identify at least one plausible alternative based *only* on contemporaneous knowledge. This signals strong hindsight bias. Flag: "The narrative presents this action/outcome as inevitable based on information available at the time, but alternatives Y and Z were plausible."
  4.  **Interrogate Counterfactuals:**
      *   *Question:* For any "if X had happened sooner/later/differently, then Y" claim: What is the *specific evidence or model* supporting the predicted outcome (Y)? What assumptions does it rely on? How sensitive is it to those assumptions?
      *   *Sufficient Answer:* A clear description of the model/data source (e.g., "SIR model run with parameters A, B, C, using contact data from school rosters"), OR explicit acknowledgment it's an expert estimate ("Epi Lead's situational estimate based on comparable outbreak Z"). Assumptions must be listed (e.g., "Assumes homogeneous mixing, no unreported cases, R0 fixed at 12"). Sensitivity must be noted (e.g., "Outcome highly sensitive to R0 value; ±1 change alters cases by ±30%").
      *   *Stop If:* Evidence is anecdotal ("back of envelope"), irreproducible, or relies on assumptions demonstrably false in *this* context (e.g., assuming high vaccine efficacy in a population with known cold-chain issues). Rewrite as "Expert situational estimate suggested..." or "Modeling *could suggest*..." or omit specific numbers. Flag: "Counterfactual claim relies on unsupported/unreproducible estimate; certainty downgraded/removed."
  5.  **De-Villainize & De-Heroize (The Cast):**
      *   *Question:* Does this claim attribute outcome significantly to specific *individuals*? If so, is the evidence of *their specific action/inaction* causing the outcome robust, *and* were systemic factors (resource constraints, ambiguous protocols, information gaps) the primary enablers?
      *   *Sufficient Answer:* If naming individuals, justification must show: a) Their specific, documented action/inaction directly contradicted clear protocol or reasonable expectation *given known info at the time*; b) Evidence links this *directly* to the negative outcome; c) Systemic factors are acknowledged as creating the context. *Otherwise, anonymize* (e.g., "A contact tracer reported challenges reaching two families" vs. "The Smith family refused..."). Focus on roles, processes, systems.
      *   *Judgment Call:* The threshold for naming individuals vs. describing roles/failures. *Procedure says:* Default to system/process unless clear, documented, individual agency overriding system is the *primary* cause. Flag: "Individual attribution proposed; consider systemic factors X, Y as primary context."
  6.  **Check Compression & Complexity:**
      *   *Question:* Does this claim reduce the outcome to 1-2 primary causes? What are 2-3 other significant contributing factors (even if not the "hinge") that made the outcome more likely or severe?
      *   *Sufficient Answer:* The main claim is retained *but* accompanied by a sentence listing other key contributing factors (e.g., "While the timing of the exclusion order was critical, contributing factors included incomplete initial vaccination data, communication delays with School District A, and challenges reaching specific households for contact tracing").
      *   *Stop If:* The event was genuinely chaotic with no clear dominant factor. State: "Multiple interdependent factors contributed, including A, B, C, D. No single primary cause was identified." Avoid forcing a hinge.
  7.  **Values & Public Statement Check:**
      *   *Question:* Does this claim involve a politically sensitive topic, blame a specific group/individual, make a strong normative statement ("should have"), or hinge on a value judgment (e.g., "acceptable risk")? Is it defensible *publicly* with the evidence gathered?
      *   *Sufficient Answer:* Explicit acknowledgment of the sensitivity. A sentence summarizing the *evidence-based* core finding *stripped* of normative language. (e.g., Instead of "The county was negligent in not acting sooner," write "Analysis indicates intervention X initiated on Day Y correlated with reduced transmission; earlier initiation was feasible based on information available by Day Z").
      *   *Handoff Point:* This step *always* flags a judgment call. The procedure identifies the sensitivity and the core evidence. **You (or your Director) must decide:** Does the *evidence-based* core finding, phrased neutrally, provide sufficient public value to offset potential reputational/political risks? If the evidence is weak (per Steps 3 & 4), the answer is likely "No."

  **What the Procedure CAN'T Do (And Where it Misfires):**
  *   **Create Evidence Where None Exists:** If data is missing (e.g., true contact rates, real-time staffing levels), it can't magic it up. It forces you to acknowledge the gap.
  *   **Resolve Deep Uncertainty:** Some events are inherently chaotic. The procedure helps you *say that* clearly instead of forcing a false narrative.
  *   **Make Value Judgments For You:** Step 7 flags the issue, but humans must weigh evidence vs. risk.
  *   **Eliminate Narrative Entirely:** Reports need structure. It aims for *responsible* narrative, acknowledging complexity and uncertainty, not no narrative.
  *   **Fix Systemic Data Gaps:** If your response lacks good situational awareness data, future reports will struggle. This highlights *that* as a finding itself.

  **Running the Procedure on Your Drafts:**

  **Draft 1: Measles Outbreak**
  1.  **Claim:** "The exclusion order came six days late and would have capped the outbreak at twelve cases." & "Two families refusing cooperation were the hinge."
  2.  **Reconstruct Knowns (Day 3?):** What was known? Initial case count? Genomic link confirmed? School roster completeness? Contact tracing progress? *Likely Gap:* Specific, reliable data on potential spread *speed* on Day 3 was probably poor.
  3.  **Plausible Alternatives (Day 3):** Wait for more data? Exclude only symptomatic? Issue advisory first? Outbreak fizzling naturally was plausible?
  4.  **Counterfactual (12 cases):** **STOP.** "Back of envelope" estimate is insufficient evidence. You cannot reconstruct it. *Rewrite:* "Modeling conducted *during the response* suggested earlier intervention might have significantly reduced cases, though the specific estimates were preliminary." *Omit "12 cases"*. Flagged as weak.
  5.  **The Families:** **De-Villainize.** Naming them makes them the "villain." Focus on the *process challenge*: "Contact tracing faced significant delays with two households, hindering isolation of potentially exposed individuals." Was this *the* hinge? Unlikely. Other factors (rosters, overall vax rate, initial spread) contributed. *Downgrade their centrality.*
  6.  **Compression:** *Add:* "Contributing factors included incomplete initial vaccination records delaying identification of susceptibles, challenges in rapid communication with the school district, and difficulties reaching specific households."
  7.  **Values:** Claim about county officer's timing is sensitive. Phrase evidence-based core: "Analysis indicates the exclusion order, implemented on Day 9, coincided with a decline in new cases; information available by Day 4-5 suggested potential for wider spread." *Human Judgment:* Is "Day 4-5" defensible with logs? Is "potential for wider spread" strong enough?

  **Draft 2: Heat Event Alerts**
  1.  **Claim:** "The alert system averted an estimated 25-30 deaths."
  2.  **Reconstruct Knowns:** What was known about registry coverage/accuracy? Alert delivery confirmation? Baseline vulnerability? *Likely Gap:* Precise mechanism linking alert to *death prevention* (did alerts change behavior? which behavior?).
  3.  **Plausible Alternatives:** Would many vulnerable people have sought cooling/checked on buddies anyway due to media/ambient heat? Could alerts have been ignored?
  4.  **Counterfactual (25-30 deaths averted):** **Major Problem.** Comparison city differs significantly (AC, housing, hospitals). This violates the "ceteris paribus" (all else equal) assumption. *Rewrite drastically:* "While a direct causal link is difficult to establish due to confounding factors in the comparison region, the deployment of the heat alert system coincided with lower-than-projected mortality based on historical trends and vulnerability indices for our metro area. The system represents one potential contributing factor among broader heat mitigation efforts." *Omit specific number.* Flagged as highly speculative.
  5.  **Cast:** N/A (System, not individuals).
  6.  **Compression:** *Acknowledge:* "Multiple factors influence heat mortality, including housing quality, AC access, pre-existing health, social support networks, and healthcare system capacity. The alert system is one intervention within this complex system."
  7.  **Values:** Director loves the big number. **Handoff Point:** The evidence-based core ("coincided with lower-than-projected mortality... potential contributing factor") is weak for *attribution* but true for *description*. *Human Judgment:* Is stating it as a "potential contributing factor" the strongest *defensible* statement? Can you quantify *anything* solid (e.g., "% of registrants who acknowledged alerts", "increase in cooling center usage")? If not, stick to descriptive findings.

  **Draft 3: Norovirus in LTCF**
  1.  **Claim:** (Implicit) Short-staffing caused the outbreak severity/duration.
  2.  **Reconstruct Knowns:** Was the staffing level known pre-outbreak? Was it below mandated levels? Were infection control protocols known? Was noro suspected early?
  3.  **Plausible Alternatives:** Even with full staff, could outbreak have spread rapidly (noro is highly infectious)? Were protocols flawed? Was reporting delayed?
  4.  **Counterfactuals:** N/A or weak ("With more staff, it might have been contained faster" - hard to model).
  5.  **Cast:** Likely systemic (staffing levels), not specific individuals named.
  6.  **Compression:** This is the core claim. *But is it causal?* Short-staffing likely hindered *response* (cleaning, isolation) more than directly *caused* the outbreak (virus did that). It exacerbated severity.
  7.  **Values:** Director wants a lesson. **Procedure Result:** **This is the case most likely to return "nothing *new* useful."**
      *   **Finding:** "The facility operated below recommended staffing levels, a known pre-existing condition documented in [report/review date]. During the norovirus outbreak, challenges in implementing full infection control protocols (e.g., terminal cleaning, isolation compliance monitoring) consistent with the staffing shortfall were observed and likely contributed to the outbreak's duration and severity. No single novel failure point or timing decision was identified as the primary cause beyond the documented systemic staffing issue."
      *   **Lesson (Not Cause):** The defensible "lesson" isn't a *new causal finding*, but reinforcement: "This outbreak underscores the critical impact of sustained, adequate staffing levels in long-term care facilities on the ability to effectively implement infection control protocols during outbreaks, even for highly contagious pathogens like norovirus. Pre-existing staffing shortfalls represent a significant vulnerability requiring ongoing system-level attention." *Human Judgment:* Does this framing satisfy the need for a "lesson" without overreaching on causation? It likely does, by reframing the known systemic issue as a critical vulnerability *demonstrated* by this outbreak.

  **Which One Returns Least?** The **Norovirus (Draft 3)** case. The procedure confirms your suspicion: there's no strong *new* causal hinge or timing failure beyond the known, systemic issue of short-staffing. The "lesson" becomes reinforcing known systemic risks, not identifying a new causal chain. **This is an acceptable and honest outcome of the procedure.** Forcing a stronger causal narrative here would likely introduce hindsight bias or narrative fallacy.

  **Tuesday Afternoon Plan:**
  1.  Print out your draft.
  2.  For each key claim/lesson section, run Steps 1-7 in order.
  3.  Use a highlighter/pen: Underline claims (Step 1), annotate gaps (Step 2), list alternatives (Step 3), slash unsupported counterfactuals (Step 4), circle names for anonymization (Step 5), add contributing factors in margins (Step 6), and bracket sensitive sections (Step 7).
  4.  Based on the stops and flags, rewrite sections immediately.
  5.  For Step 7 handoffs, make a separate list for your own review or discussion with your director.

  This forces you to confront the architecture of your narrative and replace unsupported certainty with evidence-bound, complexity-acknowledging analysis. It won't write the report for you, but it will make the causal claims you *do* publish significantly more defensible against that historian – and the reporter calling in four years. Good luck!
