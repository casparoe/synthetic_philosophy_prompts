prompt: |-
  I teach a seminar on the Vienna Circle, and through a slightly absurd chain of events I've ended up as the resident philosopher for the exhibition design team at a science museum — they put out roughly one big public chart a week (vaccination coverage, antibiotic use, water quality, that kind of thing), and those charts get picked up by schools and by the city public-health office, so a misleading one travels a long way. My problem is that the designers keep saying a chart "speaks for itself," and I keep having to explain that in the tradition I actually know something about, that phrase is doing almost no work. So here's what I want from you, and I want you to think carefully and maybe start by brainstorming before you commit to anything: treat yourself as someone who is genuinely at home in two places at once, mid-century logical empiricism and contemporary information design, and write me a decision procedure the design team can actually run.

  Let me put the Neurath material on the table so you don't have to guess at it. The Vienna Method, later called ISOTYPE, was built by Neurath and Gerd Arntz at the Social and Economic Museum in Vienna, and its first rule was that you never show a larger quantity by enlarging the symbol — you repeat an identical symbol, because a bigger blob leaves you unable to say whether you're comparing height, area, or something else, whereas repeated units stay countable. Perspective was avoided for the same reason. But the part my designers always miss is that Neurath never thought this replaced words: it was a helping language, always accompanied by verbal elements, and he was clear it could never be a fully developed language at all — he treated it as a language-like technique. Which means there is no picture that is self-interpreting; there is always a key, a unit, a reading convention, something learned. And the technique is very good at some things (how many, how much, where, in what order) and structurally bad at others (negation, conditionals, generality, causal claims — anything with an if or a not in it).

  So: give me the procedure. The questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a flat no, and — this is important — where it stops and hands the decision to a human because the question is about values and not about pictures (how much simplification the museum is willing to buy, whether the exhibit is there to inform or to nudge, whether to show the uncertainty at all). Constraints: the designers have no philosophy background, the chief curator has to sign off on every chart so the procedure needs to end in a clean verdict (publish as is / publish with a key or caption added / send back), and it has to be runnable in about fifteen minutes by someone who is tired. Then run it on three cases: (1) a chart showing vaccination rates across city districts using symbols scaled up and down by district, (2) a diagram the team is proud of showing how an outbreak spreads, with arrows between boxes and one box meaning "no transmission," and (3) a six-panel handwashing sequence. I expect your procedure to tell the team something they won't enjoy hearing on at least one of those, and I'd rather you not soften it. Finish by telling me what the procedure can't do — where it will misfire or give a false sense of rigor — since I'd rather they know its edges than trust it blindly.
reasoning: |-
  Okay, let me tackle this query step by step. The user teaches a seminar on the Vienna Circle and now works with a science museum's design team. They need a decision procedure for charts that addresses the team's claim that a chart "speaks for itself," drawing from Neurath's ISOTYPE principles. 

  First, I recall Neurath's key points: symbols should be repeated, not scaled; visuals need verbal elements; ISOTYPE has limitations in expressing logical operations. The procedure must be practical—15 minutes, no philosophy background needed—and end with clear verdicts. It should also flag value-based decisions for human judgment.

  Next, I consider the structure. The procedure needs sequential questions with binary outcomes to keep it efficient. Start with foundational issues like symbol scaling before moving to more complex aspects like causality. Each "no" should halt the process, as these are non-negotiable per Neurath. For the "human judgment" points, I identify areas like simplification level or intent (inform vs. nudge) where philosophy can't dictate answers.

  Now, the three test cases: 
  1. Vaccination chart with scaled symbols—this violates ISOTYPE Rule 0, so immediate rejection. 
  2. Outbreak diagram with "no transmission" box—this probably fails the negation test. 
  3. Handwashing sequence—likely passes with minor caption tweaks. 

  For weaknesses, I note how the procedure might miss subtle biases or over-rely on captions. Also, its rigidity could stifle innovation, and it won't catch every misleading implication. 

  Finally, I frame this as a "traffic light" system for clarity, using the Vienna Circle's love of formalization. The tone stays firm but respectful—no softening on the scaled symbols example, since that's core to Neurath.
answer: |-
  Here's a decision procedure grounded in Neurathian principles, designed for speed and clarity. Think of it as a "traffic light" system for charts:

  **The ISOTYPE Integrity Check (15-Minute Procedure)**

  1.  **RULE 0: ARE SYMBOLS SCALED OR UNIT-BASED?**
      *   *Question:* Are quantitative differences shown by *enlarging/shrinking symbols* or by *repeating identical unit symbols*?
      *   *Sufficient Answer:* Visual inspection. Countable units? Pass. Scaled icons? Fail.
      *   *Verdict:* **FAIL = Send Back (Red Light).** *Rationale:* Fundamental violation of visual comparability (height vs. area ambiguity). Non-negotiable per Neurath's core rule.
      *   *Human Handoff?* No. Absolute rule.

  2.  **RULE 1: IS THE VISUAL "GRAMMAR" EXPLICITLY STATED?**
      *   *Question:* Is there a clear, unambiguous key/legend defining *every* symbol, color, arrow type, and spatial convention used?
      *   *Sufficient Answer:* A colleague unfamiliar with the project must correctly interpret *all* visual elements using *only* the provided key within 30 seconds.
      *   *Verdict:* **FAIL = Add Key/Caption (Yellow Light).** *Rationale:* No visual element is intrinsically meaningful; convention must be taught. Neurath insisted on accompanying verbal elements.
      *   *Human Handoff?* No. Mandatory fix.

  3.  **RULE 2: DOES IT CLAIM MORE THAN IT CAN SHOW?**
      *   *Question:* Does the chart attempt to visually represent: Negation ("not", "absence"), Conditionals ("if...then"), General Quantifiers ("all", "most"), or Direct Causality ("A *causes* B")?
      *   *Sufficient Answer:* Scan titles, labels, implied narrative. Look for words like "cause", "prevent", "if", "not", "all", "never", or symbols implying prohibition/absence (e.g., red X, crossed-out box) or force (e.g., thick arrows implying necessity/sufficiency).
      *   *Verdict:* **FAIL = Send Back (Red Light).** *Rationale:* ISOTYPE excels at showing existence, quantity, location, sequence. It is structurally weak at logic and causality. Visuals alone *cannot* reliably convey these without high risk of misinterpretation. Requires reformulation (often into separate charts or significant verbal explanation).
      *   *Human Handoff?* No. Core limitation of the technique.

  4.  **RULE 3: IS UNCERTAINTY/VARIABILITY APPROPRIATELY ACKNOWLEDGED?**
      *   *Question:* If the data involves estimates, ranges, or statistical uncertainty, is this visually represented (e.g., error bars, confidence intervals, shading) *and* explained in the caption?
      *   *Sufficient Answer:* Visual representation present *and* a caption note explaining what it signifies (e.g., "Shading shows 95% confidence interval").
      *   *Verdict:* **FAIL = Add Caption Note (Yellow Light).** *Rationale:* Hiding uncertainty presents data as more certain than it is, a major source of public misunderstanding.
      *   *Human Handoff?* **YES.** *If uncertainty exists but is not shown:* The team must decide *whether* to show it (involves values: transparency vs. simplicity/clarity). The procedure flags the need for this decision but doesn't mandate showing it.

  5.  **RULE 4: IS THE LEVEL OF ABSTRACTION/SIMPLIFICATION JUSTIFIED?**
      *   *Question:* Does the simplification (omitting details, using icons) distort the core message or create potential for harmful misunderstanding in the *intended public context* (e.g., schools, public health)?
      *   *Sufficient Answer:* "Would a critical high school science teacher find this simplification misleading in a way that matters for the chart's core purpose?"
      *   *Verdict:* **PASS = Publish As Is (Green Light).** OR **UNCLEAR/FAIL = Send Back (Red Light).**
      *   *Human Handoff?* **YES.** *Rationale:* Determining acceptable simplification involves value judgments about audience, purpose (inform vs. nudge), and potential harm. The procedure flags potential issues but humans must weigh trade-offs.

  **Procedure Flow:** Run steps 0-4 sequentially. Stop at any FAIL. Reach Step 5 only if 0-4 pass or are fixed per YELLOW. Step 5 requires explicit team/curator discussion if not an obvious PASS.

  ---

  **Running the Cases (Brace Yourselves, Designers):**

  1.  **Vaccination Rates (Scaled Symbols):**
      *   **Step 0:** FAIL. Symbols are scaled by district. *Verdict:* **SEND BACK (Red Light).** *Neurathian Smackdown:* "This chart fundamentally obscures quantitative comparison. Does a symbol twice as tall represent twice as many people? Twice the area? It's ambiguous. Redo using identical, countable unit symbols (e.g., one person icon = 1000 people)."

  2.  **Outbreak Spread Diagram ("No Transmission" Box):**
      *   Step 0: PASS (Assuming arrows are consistent, boxes same size).
      *   Step 1: PASS (Key defines arrow types, boxes).
      *   **Step 2:** FAIL. It visually represents "negation" (absence of transmission) via a box meaning "no transmission". *Verdict:* **SEND BACK (Red Light).** *Neurathian Smackdown:* "The 'no transmission' box is trying to depict an absence or negation. ISOTYPE struggles profoundly with this. A box inherently signifies *presence* of something. Does a crossed-out arrow mean 'blocked transmission'? That implies force/causality, which Step 2 also forbids. The visual grammar here is overloaded and logically ambiguous. Reformulate: perhaps show only *actual* transmission paths clearly, and explain 'no transmission' scenarios solely in the caption or supporting text."

  3.  **Six-Panel Handwashing Sequence:**
      *   Step 0: PASS (Sequence uses identical icons for steps).
      *   Step 1: PASS (Each panel has a clear label/key: "Wet hands", "Apply soap", etc.).
      *   Step 2: PASS (Shows sequence/existence of steps, avoids logic/causality claims).
      *   Step 3: PASS/NA (Uncertainty likely not relevant for a procedural guide).
      *   Step 4: PASS (Simplification to key steps is standard and justified for public health guidance). *Verdict:* **PUBLISH AS IS (Green Light).** *Minor Note:* Ensure temporal sequence is unmistakable (numbered panels, clear left-right flow). Caption should state it's the recommended procedure.

  ---

  **What the Procedure CAN'T Do (Its Edges & Blind Spots):**

  1.  **Detect Subtle Bias or Framing:** It won't catch if the choice of *which* data to show, the baseline, the color scheme (beyond key definition), or the title subtly nudges viewers towards a specific (potentially agenda-driven) interpretation. It checks *how* data is shown, not *if* the data shown is the most honest representation.
  2.  **Assess "Truth" or Data Quality:** It assumes the underlying data is valid. Garbage in, misleading-chart-out still applies, even if the chart passes this check.
  3.  **Handle Genuine Ambiguity Perfectly:** Some charts might technically pass Step 2 but still be misinterpreted due to cultural connotations of symbols or unintended visual metaphors. The procedure reduces risk but doesn't eliminate it.
  4.  **Replace Expertise on Complex Topics:** A chart passing this check about antibiotic resistance trends might be *visually honest* but still require an epidemiologist to ensure the *scientific meaning* is accurately conveyed by the chosen visualization method.
  5.  **Mandate Caption Quality:** It ensures a caption/key *exists* and defines elements (Step 1, Step 3), but doesn't rigorously check if the caption is *clear, concise, and sufficient* for the intended audience beyond the bare minimum. A poorly written caption can still mislead.
  6.  **Prevent "False Rigor":** Passing the procedure doesn't make a chart "true" or "perfect," just *less likely to mislead in specific, Neurath-defined ways*. There's a danger in thinking "it passed, so it's flawless."
  7.  **Solve All Value Conflicts:** It flags *where* value judgments are needed (Step 4, Step 5 human handoffs), but provides no formula to resolve them. That negotiation is inherently human and contextual.

  **Final Note for the Team:** Neurath didn't believe pictures spoke for themselves; he believed they needed a *shared language* built with rules (like identical units) and words (keys/captions). This procedure enforces those rules to make your charts *reliable translators* of data, not silent sphinxes open to dangerous misinterpretation. Use it as a rigorous filter, not a creativity killer. Its "no"s protect the museum's credibility.
