  I'm putting together a two-page proposal for a small interdisciplinary grant — six months, one part-time researcher — on a question in the theory of categories that I keep circling: what makes a particular mark an instance of the letter 'a' rather than a botched 'a', a variant of 'o', or simply a squiggle? My half-formed idea is that the standard answers all run together two things that ought to be kept apart — the constraints that fix a letter's identity across typefaces, hands, and historical scripts, and the constraints that fix what counts as a characteristic or successful execution within a given style — and that separating them would explain why some deviations preserve letterhood while others destroy it, and why style is legible at all against a background of identity. Turn this into a proposal: state the question so that it has a determinate answer; say why each of the obvious positions (identity as a stored template, as a bundle of geometric features, as a graded prototype around a central tendency, as nothing but convention) leaves the question open; describe what I would actually do over the six months to make progress, and why that method rather than simply cataloguing more letterforms; give a realistic scope for the time; and be honest about what would count as the project failing. Assume I cannot consult anything online and will supply references myself. In a closing section, distinguish what is genuinely settled about letter identity from what is contested among people who work on this, and do not present any one camp's position as the consensus.
