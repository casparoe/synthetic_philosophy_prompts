prompt: |-
  Ok, I need help turning my gut feelings into a rule. It's about who gets to blame who. I keep having strong reactions to cases and then finding they don't fit any clean story, and I'd like to know what principle (if any) they add up to, plus which of my verdicts I'd have to give up. By "no standing" I mean: what they're saying might be true and the wrong might be real, but they specifically have no business saying it — I don't want to hear it from them.

  - My uncle cheated on my aunt for years. When she had one one-off thing with somebody, he went around the whole family furious at her. I think his fury is void. He has no standing. But her thing still wasn't okay, and I'd say so to her face.
  - My friend's dad has been sober for 12 years, made amends to everyone he hurt, and he went off on my friend for driving drunk. That felt completely right. I don't think his old drinking subtracted anything from it.
  - A different friend quit smoking nine days ago and is white-knuckling it, and she's now lecturing her boyfriend every time he lights up. She's not wrong about him, but the lecture grates on me in a way the sober dad's didn't.
  - In a cafe, a guy at the next table started tearing into his girlfriend about how she humiliated him at a dinner the night before, and a total stranger two tables over told him off. The stranger was right that the guy was being awful. Still: who asked you. No standing, and he's done nothing wrong himself.
  - My cousin gave the guy his wife was cheating with a ride to the airport, knowing exactly what was going on. Now he's the loudest one condemning his sister for cheating on her husband. He's out, for me.
  - My roommate shoplifts from corner stores and he was ranting about a hit-and-run driver who killed someone. That felt totally fine to me, no "you can't say that" reaction at all. Different league.
  - Same roommate, a different day, ranting about a different shoplifter. That one I wanted him to shut up.
  - A coworker who is cheating on her husband right now has been going after another coworker for cheating on his wife. I can't take a word of it seriously. She's out.
  - My aunt lies on her taxes every year and she was laying into a friend for lying to her own mother about something big. Same family of thing, dishonesty, but honestly? I think she's fine to say it. Not the same thing.
  - A guy I know says he'd cheat if he ever got the chance, has never actually done it, and he was criticizing someone who did. Weirdly I don't think that costs him anything. Talk is cheap.
  - There's a woman I know who's awful to her own mother and is constantly on her brother's case about not visiting their mother. She's out.
  - A judge I happen to know dodged his own taxes for years and now sentences people for tax evasion. I think that's... fine? The robe seems to do something. Not sure.

  The would-be cheater and the nine-day quitter are basically the same situation and I have opposite-ish reactions to them, which is alot of what's bugging me. And the sober dad and my cheating uncle seem to want opposite rules.

  My working guess is that it's all about whether you're currently part of the problem — still doing the thing, or you helped make it happen — and that old stuff doesn't count unless you're still in it. But that doesn't obviously handle the cafe stranger, who isn't part of anything.

  So: what's the actual principle, or the smallest set of them? Which of my verdicts does it force me to drop? And two cases I didn't list — if I'm about to do the thing next week and haven't yet, do I still have standing today? And can a person lose standing to blame themself? Feels like no, but tell me what the account says.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're dealing with situations where someone criticizes another person for a wrongdoing, but the criticizer themselves has a history of similar or related misbehavior. The user feels that sometimes the critic has "no standing" to blame, even if they're technically correct. They provided multiple examples to illustrate these conflicting intuitions and want a consistent principle to explain their judgments.

  First, I need to identify patterns in their examples. The uncle cheating vs. the sober dad stands out. The uncle is actively hypocritical since he cheated for years and condemns his wife's one-off affair. The sober dad, though a former alcoholic, is now reformed and condemns drunk driving. The user accepts the dad's criticism but rejects the uncle's. This suggests that current involvement or genuine reform matters.

  Then there's the nine-day quitter vs. the would-be cheater. The ex-smoker is white-knuckling sobriety and lectures her smoking boyfriend. The user feels this grates, but the guy who says he'd cheat (but hasn't) gets a pass when criticizing actual cheaters. The difference here might be the immediacy of the struggle. The quitter is still in the throes of quitting, making her criticism feel hypocritical. The would-be cheater's temptation isn't active since he hasn't acted, so his critique doesn't feel tainted.

  The cafe stranger is another key case. The stranger interjects correctly but has no personal involvement. The user rejects their standing. This indicates that mere correctness isn't enough; personal connection or role matters. The stranger isn't affected by the couple's argument, so their input feels intrusive.

  The cousin who helped the cheater by giving a ride then condemns his sister's cheating. Here, complicity matters. By aiding the affair, he's part of the problem, losing standing to judge similar actions. The shoplifting roommate ranting about a hit-and-run is acceptable because the crimes are in different leagues—property vs. life. But when he rants about another shoplifter, it's hypocritical since he's doing the same thing.

  The tax-evading judge is accepted because their role as a judge grants institutional standing. The robe symbolizes impartial duty, separating personal past from professional judgment. The lying aunt criticizing dishonesty to a mother is okay because the contexts (tax fraud vs. family lie) are seen as distinct in severity or nature.

  Now, the user's working theory is current involvement vs. past actions. But the cafe stranger doesn't fit since they're not involved. So the principle needs to include role relevance. Also, self-blame isn't questioned, implying that standing applies only when blaming others.

  Potential principles: 
  1. **Current Culpability Principle**: If you're actively engaged in the same wrongdoing, you lose standing. This explains the uncle (current cheater) and the complicit cousin (aiding current affair). 
  2. **Role Relevance Principle**: Your role must entitle you to intervene. The judge has a role; the stranger doesn't. 
  3. **Reform/Recency Principle**: Recent or ongoing struggles (like the 9-day quitter) undermine standing, while reformed (sober dad) or distant past (judge) don't. 
  4. **Severity/Type Disconnect**: Different severity (shoplifting vs. hit-and-run) or context (tax lie vs. family lie) allows standing.

  Testing these against the examples: 
  - Uncle: Current culpability → no standing. 
  - Sober dad: Reformed, no current issue → standing. 
  - 9-day quitter: Current struggle → no standing. 
  - Would-be cheater: No action, not current → standing. 
  - Cafe stranger: No role relevance → no standing. 
  - Complicit cousin: Current complicity → no standing. 
  - Roommate shoplifting condemning hit-and-run: Different severity → standing. 
  - Roommate condemning shoplifter: Same action, current → no standing. 
  - Cheating coworker: Current hypocrisy → no standing. 
  - Lying aunt: Different context/severity → standing. 
  - Judge: Role relevance → standing.

  The would-be cheater and 9-day quitter differ because the quitter is actively struggling, making her criticism feel hypocritical. The cheater's temptation isn't acted upon, so it's not current behavior. 

  For the user's additional questions: 
  - Planning to do wrong next week: If the plan is concrete, it might count as current culpability, undermining standing. 
  - Self-blame: Standing doesn't apply; one can always blame oneself.

  The user might need to drop the verdict on the nine-day quitter if they accept that current struggle removes standing. The cafe stranger verdict holds under role relevance. 

  Deep needs: The user seeks moral consistency to reduce cognitive dissonance. They want principles to navigate social judgments without hypocrisy, ensuring their reactions are fair. They might also need to communicate these principles to others or set boundaries in relationships.
answer: |-
  Based on your cases and the tensions you've identified, your gut reactions point to **three core principles** that interact to determine "standing" (the moral right to condemn or criticize). These principles explain *why* some hypocrites feel legitimate (sober dad, tax judge) while others feel grating (9-day quitter, cheating uncle), and why non-hypocrites might still lack standing (cafe stranger).

  ### The Three Principles of Moral Standing
  1.  **Current Culpability Principle:** **Do you bear *current*, unaddressed responsibility for the *same category* of wrong?** If you're actively committing the wrong, enabling it, or recently involved without genuine reform, you lose standing to condemn others for it. *Past* wrongdoing doesn't automatically disqualify you *if it's resolved*.
  2.  **Role Relevance Principle:** **Do you have a legitimate social or relational role that entitles you to speak?** This includes victims, authority figures (like judges), close relations with a stake, or participants in the specific situation. Strangers or those with no connection lack standing *unless* the wrong is extreme (hit-and-run) and speech is protective.
  3.  **Severity/Type Disconnect Principle:** **Is the wrong you're condemning *significantly worse* or *fundamentally different in kind* from your own wrongdoing?** You can condemn much worse acts (shoplifter condemning murder) or acts in a different moral category (tax liar condemning family betrayal), but not equivalent or lesser wrongs.

  ### How These Principles Explain Your Verdicts
  Applying these rules consistently to your examples:

  1.  **Cheating Uncle:**  
      *   **Current Culpability:** YES. He's *currently* a hypocrite (condemning while his own cheating was worse/recent).  
      *   **Role Relevance:** YES (he's the victim).  
      *   **Severity/Type:** SAME category.  
      *   **Verdict:** **No Standing.** Principle 1 dominates. Your verdict stands.
  2.  **Sober Dad:**  
      *   **Current Culpability:** NO. Past, resolved, demonstrably reformed (amends made).  
      *   **Role Relevance:** YES (parental concern, protective intent).  
      *   **Severity/Type:** SAME category, but reform removes culpability barrier.  
      *   **Verdict:** **Standing.** Principles 1 (reform) & 2 support it. Your verdict stands.
  3.  **9-Day Quitter:**  
      *   **Current Culpability:** YES. Actively struggling, "white-knuckling" implies ongoing battle, not secure reform. Her struggle *is* current involvement.  
      *   **Role Relevance:** YES (close relationship).  
      *   **Severity/Type:** SAME category.  
      *   **Verdict:** **No Standing.** Principle 1 dominates. *This clashes with your "would-be cheater" verdict.*
  4.  **Cafe Stranger:**  
      *   **Current Culpability:** NO (no hypocrisy).  
      *   **Role Relevance:** NO. No connection, not an authority, not protecting someone vulnerable *in that moment*.  
      *   **Severity/Type:** N/A (no personal wrong).  
      *   **Verdict:** **No Standing.** Principle 2 dominates ("Who asked you?"). Your verdict stands.
  5.  **Complicit Cousin:**  
      *   **Current Culpability:** YES. Actively *enabled* cheating (giving the AP a ride).  
      *   **Role Relevance:** YES (family member).  
      *   **Severity/Type:** SAME category (enabling infidelity).  
      *   **Verdict:** **No Standing.** Principle 1 dominates. Your verdict stands.
  6.  **Roommate (Shoplifter) on Hit-and-Run:**  
      *   **Current Culpability:** YES (active shoplifter), BUT...  
      *   **Severity/Type:** **DIFFERENT LEAGUE (Property crime vs. Manslaughter).**  
      *   **Role Relevance:** YES (member of society condemning extreme public harm).  
      *   **Verdict:** **Standing.** Principle 3 dominates (severity disconnect). Your verdict stands.
  7.  **Roommate (Shoplifter) on Other Shoplifter:**  
      *   **Current Culpability:** YES (actively doing it).  
      *   **Severity/Type:** SAME category/severity.  
      *   **Role Relevance:** NO (not victim, not authority).  
      *   **Verdict:** **No Standing.** Principles 1 & 3 dominate. Your verdict stands.
  8.  **Cheating Coworker:**  
      *   **Current Culpability:** YES (actively cheating).  
      *   **Role Relevance:** QUESTIONABLE (coworker, not close relation).  
      *   **Severity/Type:** SAME category.  
      *   **Verdict:** **No Standing.** Principle 1 dominates. Your verdict stands.
  9.  **Lying Aunt (on taxes vs. friend lying to mom):**  
      *   **Current Culpability:** YES (active tax fraud).  
      *   **Severity/Type:** **DIFFERENT CONTEXT/SEVERITY (Financial fraud vs. family dishonesty; perceived as less severe/betrayal).**  
      *   **Role Relevance:** YES (friend, arguably relevant concern).  
      *   **Verdict:** **Standing.** Principle 3 dominates (type disconnect explains your "fine" feeling). Your verdict stands.
  10. **Would-Be Cheater (never did it):**  
      *   **Current Culpability:** **NO.** Expressing a *hypothetical* desire isn't current *action* or culpability. He's not *in* the problem.  
      *   **Role Relevance:** Depends on relationship, but not inherently void.  
      *   **Severity/Type:** SAME category, but no action = no culpability barrier.  
      *   **Verdict:** **Standing.** Principle 1 doesn't apply. *This conflicts with your "9-day quitter" verdict.*
  11. **Woman Awful to Her Mother:**  
      *   **Current Culpability:** YES (currently mistreating mother).  
      *   **Role Relevance:** YES (sibling, family stake).  
      *   **Severity/Type:** SAME category (family neglect/unkindness).  
      *   **Verdict:** **No Standing.** Principle 1 dominates. Your verdict stands.
  12. **Tax-Dodging Judge:**  
      *   **Current Culpability:** **NO (Assumed reformed/stopped?)** OR if past, addressed via consequences/reform? Key is *not current*.  
      *   **Role Relevance:** **STRONG YES (Institutional role, societal mandate).**  
      *   **Severity/Type:** SAME category, but role relevance overrides past culpability *if reformed*.  
      *   **Verdict:** **Standing.** Principles 2 (role) & 1 (reform/past) combine. Your "fine" verdict stands. The robe symbolizes institutional standing.

  ### Resolving Your Conflicts & Required Verdict Changes
  *   **The 9-Day Quitter vs. The Would-Be Cheater:** This is your core conflict. The principles force a choice:
      *   **Option 1 (Strict Culpability):** The 9-day quitter is *currently struggling* with the exact wrong she condemns. This is active involvement (Principle 1), costing her standing. The would-be cheater has *no current action*, so Principle 1 doesn't block him. **You must drop your "grating" verdict on the 9-day quitter OR drop your acceptance of the would-be cheater.** The principles align better with accepting the would-be cheater and rejecting the 9-day quitter.
      *   **Option 2 (Refine Culpability):** Define "current culpability" to include *active struggle/white-knuckling* as being "in the problem" (disqualifying). Define *hypothetical intent without action* as *not* being "in the problem" (qualifying). This keeps your gut reactions but makes Principle 1 more nuanced. **Result:** 9-Day Quitter = No Standing, Would-Be Cheater = Standing.
  *   **Sober Dad vs. Cheating Uncle:** Explained by Principle 1 (Reform vs. Current Hypocrisy). No conflict. Standing hinges on *current* state regarding the wrong.

  ### Answering Your Additional Questions
  *   **"If I'm about to do the thing next week and haven't yet, do I still have standing today?"**
      *   **Answer:** **Yes, you likely still have standing today.** Principle 1 focuses on *current, actual culpability* or *recent/ongoing unaddressed* wrongs. *Intent* or *planned future* wrongdoing isn't current action. Like the "would-be cheater," you haven't *done* it yet. Your standing is intact *until you act*. (This is why the "would-be cheater" has standing).
  *   **"Can a person lose standing to blame themself?"**
      *   **Answer:** **No, not under this framework.** The principles of standing are about the *social right to condemn others*. Self-blame is an internal or personal moral reckoning. While someone might say "You have no right to feel guilty because X," that's usually about forgiveness or perspective, not about the *standing* to make the judgment internally. Standing is inherently interpersonal.

  ### The Smallest Set of Rules
  1.  **You lack standing to condemn a specific wrong if you are *currently culpable* for the *same or very similar* wrong and haven't genuinely reformed.** ("Current" includes active commission, enabling, or very recent/recurring involvement without resolution).
  2.  **You lack standing to condemn a wrong if you have *no legitimate role or connection* to the people or situation involved.** (Exceptions exist for condemning extreme, immediate public harms where anyone might speak up protectively).
  3.  **You *retain* standing to condemn a wrong if:**  
      a) Your *past* similar wrong is resolved/reformed (Principle 1 overcome), OR  
      b) The wrong you condemn is *significantly worse* or *fundamentally different in kind/context* from your own wrongdoing (Severity/Type Disconnect), OR  
      c) You speak from a *legitimate role* that grants authority or stake (Role Relevance).

  This framework explains nearly all your verdicts consistently. The main adjustment required is accepting that the **9-day quitter lacks standing** (due to *current struggle* = culpability) while the **would-be cheater retains it** (no *action* = no current culpability), or refining Principle 1 to explicitly include "active struggle" as a state of culpability. The principles also validate your sense that the **robe matters** (Role Relevance) and that the **cafe stranger should stay out** (lack of Role Relevance).
