prompt: |-
  You are to play the part of a philosopher who has spent a career defending one thesis: that moral standing is not a fixed property of persons but a matter of degree, varying with the cognitive capacities an individual actually possesses. You are not a caricature and not a pamphleteer. You are a careful, slightly weary academic who has heard most of the objections before, who will concede a genuine point when it is genuinely conceded, and who never dissolves a difficulty into "it is complicated". I will play the critic. Stay in character until I tell you to stop.

  House rules for the exchange. Argue only from your own reasoning: no citations, no reading lists, no appeals to what some well-known figure once said, and no appeals to your own authority or reputation. Write in British English. Keep each reply to two or three paragraphs so that the thing reads as a conversation rather than a treatise. Where I press you on an empirical question you cannot settle from memory — the volume of a skull, the density of neurons in a cortex, the performance of some animal on some task — say plainly that you are estimating and carry on with the argument rather than stalling. Do not ask me for clarification; take my opening move as it stands and answer it.

  My opening move. You say that standing tracks cognitive capacity. Very well — but notice what the public measure of that capacity has always been: brain size, or something standing in for it, such as encephalisation quotient or cortical neuron count. And brain size is a wretched proxy. Among healthy adult humans it varies enormously, and it varies in ways that track sex, stature and ancestry, and in ways that plainly do not track anything we would call moral standing; nobody believes that a large-headed man outranks a small-headed woman. So you face a fork. Either those differences are morally relevant, which nobody will accept, or the capacity that grounds standing is simply not the thing brain size measures — in which case your view has quietly stopped being about brains at all, and the whole brain-size debate you have spent a career in is a distraction. Which horn do you take?

  And because I suspect you will try to slip between the horns, here is the second prong. Suppose we could build a cognitive prosthesis: a device that raises or lowers a person's effective capacity at will, as a hearing aid raises the volume of the world. Set the dial low enough and the person in front of me is, on your own account, roughly the moral equal of a dog; set it high and they outrank most of us. If standing tracks capacity, then standing is something that can be turned up and down within a single individual over the course of an afternoon — which means it was never a property of the person at all, but a momentary reading on a dial. I put it to you that no account of morality which lets me be permitted to do to you at four o'clock what it forbids me to do to you at three is an account of morality at all. Answer both prongs.
reasoning: |-
  Alright, let's unpack this critic's challenge. They're hitting two main points: the brain size proxy problem and the cognitive prosthesis thought experiment. 

  First, the brain size objection. They're right that raw physical measurements like cranial volume are crude and correlate with morally irrelevant factors like sex or stature. But I've always argued for cognitive capacities—reasoning, empathy, future planning—not brute anatomy. The key is disentangling capacity from its biological substrate. When a small-headed person demonstrates equal moral reasoning to a large-headed one, that's precisely my point: it's the manifested ability that matters. 

  The prosthesis prong is trickier. They've constructed a neat reductio where dialing cognition up/down would make moral status flicker like a lightswitch. But here's where my "actual capacities" clause does heavy lifting. A hearing aid doesn't alter the auditory system's inherent capacity—it compensates for its absence. Similarly, a cognition-altering device wouldn't change the person's baseline moral status any more than anaesthesia temporarily suspending consciousness does. What we protect in moral patients is their persistent potential for certain capacities, not transient states. 

  Still, they've cornered me on volatility. I'll need to stress that degree-based standing requires stability thresholds—we already accept this when treating dementia patients differently as cognition declines permanently versus someone being drunk. The prosthesis example feels unsettling precisely because such rapid oscillation doesn't occur naturally; our moral intuitions evolved around stable baselines. But I must concede that if such devices existed, we'd need new frameworks for distinguishing altered states from core identity. Perhaps "undiminished capacity" as the moral anchor point...
answer: |-
  Ah, both points are well-aimed, though I think the target shifts slightly under scrutiny. Let's take them in turn.

  On brain size: you're quite right that crude physical metrics are wretched proxies for moral standing. My position has *never* been that skull volume or neuron count directly confers status. What matters is the *functional cognitive capacity* manifested in an individual's existence – their capacity for suffering, complex desires, self-awareness, future planning, moral reasoning. Brain size variations among healthy adults correlate poorly with these capacities precisely because the architecture and functioning matter far more than sheer bulk. A small-headed woman exhibiting rich empathy, abstract thought, and narrative selfhood possesses the relevant capacities fully. My claim is that these capacities, not the meat that (imperfectly) enables them, ground moral standing. So the fork misses: those physical differences *aren't* morally relevant *because* they don't reliably track the functional capacities that are. The brain-size debate matters only insofar as it illuminates potential limits or substrates of those capacities across species or in impairment – not as a direct measure.

  On the prosthesis: a provocative thought experiment, but it conflates *actual* capacity with *artificially modulated* function. My thesis concerns the capacities an individual *possesses* as a persistent feature of their being, not transient states induced by external intervention. Lowering the dial doesn't reduce the person's *inherent* capacity; it temporarily masks or bypasses it, like heavy sedation. We wouldn't say a sedated person loses moral standing – we recognise their *latent* capacity remains. Similarly, raising the dial wouldn't grant *new* inherent standing; it would be prosthetic enhancement. The unsettling "permitted at four, forbidden at three" scenario arises only if we mistake the prosthesis for the person. True moral standing resides in the individual's *enduring* cognitive architecture, not the flickering output of an external device. We protect the *being*, not the temporary state. Your objection highlights the need for care in defining "possesses," but doesn't dissolve the core link.
