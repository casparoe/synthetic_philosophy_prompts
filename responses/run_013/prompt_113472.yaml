prompt: |-
  I run impact and performance at a mid-sized independent foundation — around sixty grants, roughly forty million pounds, three-year funding cycles — and I am the person who turns our trustees' ambitions into the indicator set against which we renew or wind down funding. Twice a year a batch of proposed indicators lands on my desk, some from trustees, some from programme staff, some from grantees trying to be helpful, and each one carries a consequence: money, renewal, a public ranking, a line in the annual report. I have a team of four, no experimental capacity, no causal model of the sectors we fund, and a board that wants numbers it can quote in public. I have read enough about Goodhart's law to be wary of it, and the original formulation — 'any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes' — describes my working life exactly. But every version of the law I have met stops at the warning, and I want the operating manual: a procedure I can run in about an hour, on paper, with one colleague, before I recommend that we adopt, modify or refuse an indicator.

  Please build it out of the four mechanisms that are usually distinguished in discussions of the law, because I am fairly sure they demand different responses and that I have been prescribing the wrong remedy for years. They are: regressional (selecting for an imperfect proxy also selects for the noise in it, so the top of the distribution is systematically worse than it looks); extremal (the relationship was observed in an ordinary range, and a target pushes the system somewhere the relationship no longer holds); causal (acting on the metric changes the underlying situation, so our own intervention destroys the correlation we relied on — the point the Lucas critique makes about econometric relationships used for policy); and adversarial (agents who do not share our goal move the number rather than the thing). For each, give me the symptom my team can actually see in our own data or in a grantee's report, the questions to ask in order, what counts as a sufficient answer, and the remedy that follows, since I suspect the standard fixes are not interchangeable. Include the step I keep skipping: asking what consequence attaches to this number and to whom, because an indicator that is merely discussed is not a target, and a target is a selection pressure on whoever must report it.

  Then run the procedure on three proposals. First, my own favourite and the one I would most like you to approve: a single composite 'impact score' covering the whole portfolio, so that the trustees have one number for the annual report. Second, a grantee-proposed indicator on the number of safeguarding concerns raised by frontline staff, on the theory that more reporting means a healthier culture. Third, an efficiency indicator — cost per person reached — which we would use to compare grantees. I expect the procedure to give me an answer I will not like on at least one of these, and I would rather have that now than in a trustees' meeting. Finally, tell me plainly where the procedure must stop and hand the matter to the board, which of its steps are judgment dressed up as technique, what it cannot do, and what I should do when a target is imposed on us from outside and refusing is not an option.
reasoning: |-
  Okay, the user is in a leadership role at a foundation managing impact and performance. They're dealing with the challenge of selecting indicators for grants, facing pressure from trustees who want simple metrics, while being acutely aware of Goodhart's Law. They need a practical, step-by-step procedure to evaluate proposed indicators based on the four mechanisms of Goodhart's Law, and they want this applied to three specific examples. 

  First, I need to unpack their situation. They're drowning in indicator proposals with real consequences—funding renewals, public rankings. Their constraints are clear: small team, no experimental capacity, board demanding quotable numbers. The reference to Goodhart's Law shows they understand the theoretical risk but need operational tools. 

  The core request is brilliant in its specificity: a one-hour, paper-based procedure dissecting the four mechanisms (regressional, extremal, causal, adversarial) with distinct remedies. Most people miss that these demand different solutions. They also flag a critical gap—asking "who bears the consequence?"—which is often overlooked. 

  For the three test cases: 
  The composite score is seductive but dangerous—it's practically begging for regressional and adversarial collapse. 
  The safeguarding metric is well-intentioned but could backfire via causal/perverse incentives. 
  Cost-per-person is textbook extremal risk, inviting grantees to target easily reachable groups. 

  The unspoken tension? They're trapped between trustees' desire for simplicity and the messy reality of social impact. Their fear isn't theoretical—it's about sitting in that boardroom defending a failed metric. When they say "I expect an answer I won't like," they're braced for the composite score critique. 

  Procedurally, I'll build: 
  1. A diagnostic flow for each mechanism (symptoms → questions → remedies) 
  2. Explicit "consequence mapping" because metrics without stakes aren't targets 
  3. Brutal honesty about where the procedure stops (e.g., when politics overrides evidence) 

  The real service isn't just the framework—it's giving them language to push back on trustees. Like showing how "one number" corrupts via regression dilution, or why cost-per-person sabotages depth. And for imposed metrics, the salvage strategy: decouple consequences, add countermetrics. 

  Most importantly, I'll validate their instinct—that most "standard fixes" are misapplied. (You don't combat adversarial gaming with the same tools as extremal distortion.) Their self-awareness about "wrong remedies for years" tells me they'll appreciate this nuance. 

  Final note: Their tone suggests exhaustion with platitudes. So zero jargon. Just actionable steps, visible symptoms, and political cover for hard decisions.
answer: |-
  Here's your operational manual for evaluating indicators against Goodhart's Law mechanisms, structured for clarity and efficiency. Designed for a 1-hour paper-based session with one colleague, using the four core distortion types.

  ---

  ### **Goodhart's Law Evaluation Procedure (60 Min)**
  **Step 0: Consequence Mapping (5 Min)**  
  *   **Question:** *"Who experiences material consequences (funding, reputation, job security) based on this metric, and how strong is the incentive?"*  
  *   **Sufficient Answer:** Clear identification of stakeholders facing high-stakes outcomes tied directly to the metric.  
  *   **Red Flag:** Consequences are diffuse, indirect, or weak → Metric is unlikely to distort significantly (but may also be irrelevant).  

  **Step 1: Diagnose Mechanism (20 Min)**  
  *Review data, context, and stakeholder incentives for each symptom. Ask questions sequentially.*

  | Mechanism      | Symptom in Data/Reports                                                                 | Diagnostic Questions                                                                 | Sufficient Answer                                                                 | Remedy (Non-Interchangeable!)                                                                 |
  |----------------|------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **Regressional** | Top performers on the metric show *declining real outcomes* over time; high variance in outcomes at same metric level. | 1. Is the metric a noisy proxy for the true goal?<br>2. Do high metric values correlate *less* with true impact than mid-range values? | Evidence that metric inflation degrades true impact correlation.                 | **De-noise:** Add counter-metrics, use weighted composites, or shift to threshold-based assessment (not rankings). |
  | **Extremal**   | Metric improvement plateaus or reverses while true progress stalls; unintended outcomes spike. | 1. Was the relationship linear/normal within observed range?<br>2. Does the target push systems into untested extremes? | Proof that the metric-goal link breaks under high pressure.                      | **Cap & Buffer:** Set "acceptable ranges" (not point targets), monitor for cliff edges, use tiered incentives. |
  | **Causal**     | Metric improves rapidly post-measurement, but independent data shows no change (or decline) in underlying reality. | 1. Could our intervention alter stakeholder behavior *without* changing reality?<br>2. Is the metric vulnerable to manipulation? | Evidence that the act of measuring distorts the system inherently.               | **Insulate:** Use lagged/oblique metrics (e.g., train *capacity* vs. outcomes), third-party audits, randomized verification. |
  | **Adversarial** | Metric spikes without plausible rationale; corroborating evidence conflicts; gaming patterns emerge (e.g., reclassifications). | 1. Do agents have motive/means to game?<br>2. Is verification independent and robust? | Signs of strategic manipulation by agents with conflicting goals.                | **Verify & Align:** Use unannounced audits, triangulate with immutable data, tie incentives to *verified* outcomes. |

  **Step 2: Decision Protocol (15 Min)**  
  - **Adopt:** No high-stakes consequences OR all mechanisms ruled out with evidence.  
  - **Modify:** Apply remedy from Step 1; test with pilot or phased rollout.  
  - **Refuse:** High stakes + any mechanism confirmed without viable remedy.  

  **Step 3: Documentation (5 Min)**  
  - Record: Mechanism tested, evidence, modification/refusal rationale.  
  - For adopted metrics: Note monitoring plan for early distortion signs.  

  ---

  ### **Applied to Your Proposals**
  **1. Composite "Impact Score" (Portfolio-Level)**  
  - **Consequence:** High (Trustees' reputation, funding decisions).  
  - **Mechanism:**  
    - **Regressional:** Certain. Aggregating diverse metrics amplifies noise. Top scores likely reflect luck/optimism bias.  
    - **Adversarial:** Likely. Grantees/program staff will lobby for favorable weightings.  
  - **Symptoms:** Past composites masked sector volatility; grantees protested weighting fairness.  
  - **Diagnosis:** Proxy noise + gaming incentives.  
  - **Remedy:** **Refuse.** Composite scores under high stakes *guarantee* Goodhart collapse.  
  - **Alternative:** Report 3-5 thematic outcome trends (e.g., "Community Resilience Index: 65% grantees improved") with qualitative context.  

  **2. Safeguarding Concerns Raised (Grantee-Proposed)**  
  - **Consequence:** Medium (Grantee reputation, future funding).  
  - **Mechanism:**  
    - **Causal:** High risk. Staff may over-report minor issues to hit targets, overwhelming systems.  
    - **Extremal:** Possible. Normal reporting ≠ crisis-level reporting.  
  - **Symptoms:** No data yet, but analogous metrics (e.g., incident reports) show inflation without harm reduction.  
  - **Diagnosis:** Incentive to "manufacture" reports.  
  - **Remedy:** **Modify.** Use as a *leading indicator* with:  
    - **Cap:** "Target: 5–20 verified concerns/year" (outside range triggers review).  
    - **Counter-metric:** "% concerns resolved within policy" + staff surveys on psychological safety.  

  **3. Cost Per Person Reached (Efficiency Metric)**  
  - **Consequence:** High (Funding comparisons, public rankings).  
  - **Mechanism:**  
    - **Extremal:** Certain. Grantees will target easy-to-reach groups, abandoning complex cases.  
    - **Adversarial:** High. Reclassification of "reached" (e.g., brief contact = served).  
  - **Symptoms:** Past efficiency drives saw depth/quality drop; grantees merged programs to inflate denominators.  
  - **Diagnosis:** Pushes grantees to extremal zone (superficial reach).  
  - **Remedy:** **Refuse for comparisons.** Use only for:  
    - Internal trend analysis (same grantee over time).  
    - Paired with **depth metrics** (e.g., "cost per person *with 50%+ outcome improvement*").  

  ---

  ### **Where the Procedure Stops & Critical Notes**  
  1. **Handoff to Board:** When political/pressure overrides technical risk (e.g., trustees demand "one number"). Document risks and propose damage-limitation (e.g., "If we must composite, cap weightings at 30%").  
  2. **Judgment vs. Technique:**  
     - Diagnosing mechanisms relies on interpreting context (e.g., "Is this gaming or real progress?").  
     - Setting consequence thresholds ("high" vs. "medium") is subjective.  
  3. **Limitations:**  
     - Cannot fix poorly defined true goals.  
     - Useless without data access or stakeholder honesty.  
  4. **Imposed External Targets:**  
     - **Decouple consequences:** Don’t tie funding solely to the metric.  
     - **Add friction:** Require narrative explanations for outliers.  
     - **Monitor zealously:** Track counter-metrics for collateral damage.  

  **Final Advice:** Your instinct is correct. Composite scores and cross-grantee efficiency rankings are severe risks. Safeguarding metrics can work with constraints. Use this procedure to shift board conversations from "What number?" to "What are we *really* incentivizing?"—backed by evidence of predictable distortions.
