answer: |-
  ## The Boundary Clerk

  The air in the Precedent Room hung thick with the perfume of decaying paper and administrative inevitability. Lenka, her fingertips grey with dust, ran them along the spines of ledgers marked *Registry of Certified Procedures, Vol. XLII - XLIX*. Two years at the Bureau of Mechanical Protocols had honed her senses. She didn't just *read* submissions; she felt them in her knuckles. A true procedure had a rhythm, a predictable clack like the Underwoods in the typing pool. It was finite, unambiguous, a sequence of instructions so clear a sleepwalker or a well-oiled gear train could follow them. No intuition, no leaps. Just step, step, step, result.

  Her desk back in the Examinations Hall currently held an anomaly. Submission #7821-B, from a Dr. Emil Varga of the University at Kralovice. Not a machine blueprint, not a chemical formula, but a *recipe* titled "Concordance of Perceived Hue Under Varying Ambient Illuminance." On the surface, it mimicked procedure: precise measurements of light sources (candles, electric bulbs, daylight spectra), detailed descriptions of coloured tiles, instructions for an observer to adjust a calibrated colour wheel until it "matched" the tile under each light. The result was a neat table correlating light type, tile description, and wheel setting.

  But it *itched* behind Lenka’s sternum. The "match." How did the observer *know*? The instructions said "until perceived identity is achieved." Perceived by whom? By what standard? It wasn't measuring wavelength or reflectance; it was outsourcing the core judgment to a human sensor – a sensor prone to fatigue, bias, the vagaries of morning coffee. It felt… interpretive. *Squishy*. Not the clean, mechanical click she associated with a certifiable procedure.

  She needed precedent. Hence the dust, the chill, the towering shelves of decisions past.

  "Lost in the catacombs, Lenka?" Josef’s voice, gravelly as the path outside, echoed softly. He leaned against a shelf, steaming mug in hand, wisps of white hair escaping his severe part. Thirty years in the Bureau had etched lines of patient skepticism around his eyes. He was the Bureau’s institutional memory, a walking, tea-sipping precedent guide.

  "Varga submission," Lenka said, tapping the open ledger before her. "Hue concordance. It pivots on subjective perception. Feels… off."

  Josef sipped his tea. "Off how? Does it tell the observer *how* to perceive? Or just *to* perceive?"

  "It instructs them to adjust until they perceive a match. No objective metric for the match itself. Just… the feeling of it."

  "Ah." Josef nodded slowly. "The Feeling. Procedure’s kryptonite." He ambled closer, peering at her notes. "Check the Meadowlark file. Vol. XXXI, Section D. Cross-reference with… oh, 'Clerical Intuition Protocols,' but good luck finding that codified." He chuckled, a dry sound.

  Lenka found Volume XXXI. Section D: "Sensory Calibration." The Meadowlark Case. She pulled the thin file. Inside wasn't the usual thick sheaf of analysis, counter-arguments, and the Deputy Director’s florid signature. There were just three documents: the original submission (a method for calibrating musical pitch perception using tuning forks and subject-reported "pureness"), a single-page examiner’s note ("Relies on unverifiable internal state. Not mechanical."), and the rejection stamp. No lengthy justification. No appeal records. Just… denial. The emptiness was startling, almost rude in its lack of explanation.

  "It’s barely there," Lenka murmured.

  "Precisely," Josef said, refilling his mug from a thermos. "Some things, Lenka, the Bureau rejects the way you’d swat a fly. Instinctively. Because to dissect *why* might open a box we spend decades trying to shut." He gestured vaguely with the thermos lid. "Does a procedure *contain* its understanding? Or does it point to something *outside*? The Meadowlark tried to point outside. To the messy wetware between the ears. We said no. Quietly."

  "But *why* quietly? Why not define it?" Lenka pressed, the emptiness of the file unnerving her more than a thousand arguments might. "What *is* the line?"

  Josef sighed, a long exhalation smelling of cheap tea and resignation. "The line, my dear, is wherever the last examiner drew it. And the one before that. And the one before *that*. We don't define 'mechanical procedure' up here," he tapped his temple, "by reading a manual. We learn it by immersion. By seeing ten thousand things that *are*, and a few dozen that *aren't*, and feeling the difference in your bones. Like knowing sour milk. You don't need a chemistry thesis; the nose knows."

  He pointed a stained finger at the Varga submission peeking from Lenka’s folder. "This smells sour, Lenka. It smells like it needs a *mind*, not just a mechanism. A mind to *interpret* 'match'. That’s outside the fence."

  "But the instructions are finite! Discrete steps! Measure light, present tile, adjust wheel until match, record setting. Where’s the leap?" Lenka heard the frustration in her own voice. She *wanted* it to be a procedure. It was elegant, potentially useful. But the feeling… it curdled.

  "Ah, the 'until'," Josef murmured. "That’s where the demons get in. 'Until satisfied.' 'Until pure.' 'Until matched.' Who decides? The clerk? The stars? If the 'until' relies on something the written steps don't *contain* and can't *control*... then it's not a closed system. It's not mechanical. It’s a request dressed as a command." He paused, looking at the towering shelves. "Look around. Every 'Yes' in these ledgers is a brick in a wall we've been building since the Bureau opened. We didn't design the wall first. We just kept laying bricks where they seemed to fit, where they kept the… the *chaos*… out. Varga’s submission doesn't fit the mortar. It tries to be a brick made of smoke."

  Lenka thought of the thousands of certified procedures: knitting patterns treated as complex algorithms, chemical titration steps, loom punch-card sequences, even the precise, mind-numbing steps for verifying the water resistance of Bureau-issue umbrellas. All finite, all seemingly self-contained. The human element – the umbrella tester *seeing* the leak, the knitter *counting* stitches – was always directed by the instructions, bound by them. The procedure *contained* the criteria. Varga’s "match" felt different. The procedure described the setup and the recording, but the critical event – the perception of identity – was an internal, ungoverned state. It pointed relentlessly *outward*, beyond the page.

  She spent the afternoon chasing phantoms through the Registry. She found the "Clerical Intuition Protocols" Josef mentioned – not procedures, but internal memos advising examiners to be wary of "recursive self-reference," "open-ended sensory criteria," and "procedures requiring external oracles." Vague, circular, utterly dependent on the examiner’s sense of what constituted "external." She found a rejected submission for "Optimizing Narrative Satisfaction in Serialized Fiction" (too interpretive), another for "Determining Moral Equivalence in Trade Disputes" (hopelessly open-ended), and a surprisingly robust debate around a complex but ultimately certified method for calculating the *exact* point at which stirred tea achieves optimal diffusion – because it relied solely on timed rotations and temperature gradients, not the taster’s preference.

  Every case was a brick Josef spoke of. Every rejection, especially the thin files like Meadowlark, was a silent agreement: *This is outside the wall. We don't know how to define the wall, but we know this isn't inside.*

  Her own two years of rulings flashed before her – the quick approvals, the hesitant rejections. Had she been defining "procedure" all along? Not by decree, but by a thousand tiny acts of *recognizing* it, the way she recognized a typo? Not because she *knew* the dictionary definition of every word, but because *that* cluster of letters *felt* wrong in its context? The Bureau wasn't discovering an eternal truth about mechanical processes; it was *curating* a consensus, brick by dusty brick, precedent by silent precedent. The definition lived not in a manifesto, but in the collective, institutional muscle memory of "Yes" and "No," recorded in ink and silence.

  The next morning, the Varga submission lay heavy on her desk. The steps were clear, finite. Measure, present, adjust *until match*, record. Objectively described stimuli. Objectively recorded settings. Yet the pivotal moment – the *match* – was a black box labeled "observer perception." It demanded something the written word couldn't guarantee, couldn't mechanize. It needed an *interpreter*, not just an executor.

  Lenka picked up her pen. She didn't reach for the hefty "Regulations Governing Protocol Certification." She reached for the small, crimson rejection stamp. Her hand didn't hesitate. It *knew*, the way Josef’s knew sour milk, the way her eyes knew a typo.

  *REJECTED: Reliance on unverifiable subjective state.*

  No grand justification. No appeal to a higher principle written down. Just the brick laid where it fit the wall, echoing Meadowlark, echoing decades of silent consensus. She signed her name, *Lenka Vostra, Examiner Grade II*, adding one more small, decisive act to the vast, unspoken definition being built around them. The Church-Turing thesis remained unspoken, unproven, irrelevant. Here, in this room smelling of ink and dust, the boundary was simply where the Bureau, through Lenka and Josef and all the clerks before them, had quietly decided it was. Case by case. Stamp by stamp.
