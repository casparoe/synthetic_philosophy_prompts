    - Merged framework: Scope expansion without predictions sufficed.  
    - Ptolemaic/Phlogiston: Lacked both novelty and non-ad-hoc growth.
  - **Discriminating Case**: Tests whether non-ad-hoc scope expansion *alone* (without novel predictions) warrants "progressive." If she calls it progressive, scope expansion is decisive; if degenerating, novelty is essential.  
