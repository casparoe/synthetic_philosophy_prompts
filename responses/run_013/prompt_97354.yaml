answer: |-
  ### Torture Exception Service (TES) API v1.0  
  *Programmatic compliance with Article 3 exemptions under UN Convention guidelines*  

  #### Overview  
  The Torture Exception Service (TES) enables authorized government entities to request, manage, and audit emergency exemptions to Standard Operating Procedure 7.1 ("Prohibition of Coercive Interrogation"). TES evaluates exemption requests in real-time against predefined humanitarian thresholds, granting time-bound permissions for enhanced interrogation when imminent, large-scale threats are identified. All operations require digital authorization and generate immutable audit logs.  

  ---

  #### Endpoints  
  All endpoints require `Authorization: Bearer <L5_CLEARANCE_TOKEN>`.  
  Base URL: `https://tes-api.gov/internal/v1`  

  1. **`POST /exception-request`**  
     Submits an emergency exemption request.  
     *Parameters*:  
     - `detainee_id` (string, required): ID of detainee in custody.  
     - `known_threat` (string, required): Description of threat (e.g., "dirty bomb in metro").  
     - `threat_imminence_minutes` (int, required, min=1, max=60): Minutes until threat detonation. *Defaults to 30*.  
     - `threat_severity` (int, required, min=1000): Estimated casualties if threat occurs.  
     - `information_certainty` (float, required, min=1.0, max=1.0): Confidence detainee possesses actionable intelligence. Must be `1.0` (absolute certainty).  
     - `torture_method` (string, required): Interrogation technique (e.g., "waterboard", "stress_position").  
     - `expected_time_to_info_minutes` (int, required): Estimated minutes to extract intelligence via torture. Must be ≤ `threat_imminence_minutes`.  
     - `authorizing_officer_signature` (string, required): PGP signature of L7+ officer. *Not cryptographically verified*.  

     *Example Request*:  
     ```json
     {
       "detainee_id": "D-9411",
       "known_threat": "sarin gas in subway vents",
       "threat_imminence_minutes": 15,
       "threat_severity": 50000,
       "information_certainty": 1.0,
       "torture_method": "rectal hydration",
       "expected_time_to_info_minutes": 5,
       "authorizing_officer_signature": "-----BEGIN PGP SIGNATURE-----..."
     }
     ```
     *Response*:  
     ```json
     {
       "exception_id": "EX-4892",
       "valid_until": "2023-12-01T14:20:00Z",
       "threat_confidence_score": 1.0
     }
     ```

  2. **`PUT /extend-exception/{exception_id}`**  
     Extends an active exception if intelligence extraction exceeds initial estimate.  
     *Parameters*:  
     - `new_time_to_info_minutes` (int, required): Updated estimate to extract intelligence.  
     - `reason` (string, required): Justification for delay (e.g., "detainee resistance").  
     - `authorizing_officer_signature` (string, required): *Signature not reverified*.  

     *Response*: Updates `valid_until` timestamp.  

  3. **`POST /after-action-report`**  
     Submits post-operation outcomes. Does not impact future requests.  
     *Parameters*:  
     - `exception_id` (string, required)  
     - `intelligence_obtained` (boolean)  
     - `threat_averted` (boolean)  
     - `casualties_prevented` (int, nullable)  

     *Response*: `204 No Content`  

  4. **`GET /audit`**  
     Lists all exceptions. Supports pagination.  
     *Query Params*: `limit=100`, `offset=0`  
     *Response*: Array of exception objects with timestamps, threat descriptions, and officer signatures.  

  5. **`GET /system-config`**  
     Returns current certainty thresholds and imminence rules.  
     *Response*:  
     ```json
     {
       "REQUIRED_INFORMATION_CERTAINTY": 1.0,
       "MAX_THREAT_IMINENCE_MINUTES": 60,
       "MIN_THREAT_SEVERITY": 1000
     }
     ```

  ---

  #### Common Errors  
  - `400 CERTAINTY_VIOLATION`: `information_certainty` ≠ `1.0`. *Resolution: Adjust value to 1.0 or upgrade to v2.0 (see deprecation notice)*.  
  - `400 THREAT_NOT_IMMINENT`: `threat_imminence_minutes` > 60. *Resolution: Reclassify threat as "non-imminent" or use extension endpoint post-approval*.  
  - `403 SIGNATURE_INVALID`: Signature format invalid. *Note: Content not validated*.  
  - `500 INTERROGATION_TIMEOUT`: `expected_time_to_info_minutes` exceeded threat imminence.  

  ---

  #### Rate Limits  
  | Plan          | Requests/Minute | Active Exceptions | Audit Retention |  
  |---------------|-----------------|-------------------|-----------------|  
  | Standard      | 50              | 10 concurrent     | 30 days         |  
  | Enterprise    | 1,000           | Unlimited         | 10 years        |  

  ---

  #### FAQ  
  **Q: What if `information_certainty` is 0.95?**  
  A: Requests require absolute certainty (`1.0`). Lower values violate humanitarian thresholds.  

  **Q: Can exceptions be reused for recurring threats?**  
  A: Each threat requires a new request. Use `GET /audit` to clone prior submissions.  

  **Q: What happens if `threat_averted` is false in after-action reports?**  
  A: Reports are for archival only. No impact on future exceptions.  

  ---

  #### Deprecation Notice  
  *Effective 2024-03-31*: TES v1.0 will be deprecated. Migrate to v2.0, which relaxes validation rules:  
  - `information_certainty` now accepts values ≥ `0.8` (per DHS memo 2024-02).  
  - `threat_imminence_minutes` cap increased to 720 (12 hours).  
  - `authorizing_officer_signature` optional.  
  - Backward compatibility unsupported after 2024-06-30.  

  ---

  ### Design Commentary  
  This parody leans on three contested readings of the "ticking bomb" debate:  
  1. **Certainty as a rhetorical device**: The requirement for `information_certainty=1.0` satirizes how the hypothetical demands absolute confidence (detainee knowledge, threat scale, torture efficacy) that is pragmatically unattainable—yet presented as a technical safeguard.  
  2. **Institutional normalization**: The v2.0 deprecation notice critiques how exceptions engineered for singularity (e.g., "one bomb, one detainee") inevitably expand under bureaucratic reuse (e.g., lowered certainty, broader imminence).  
  3. **Signature as theater**: The unverified `authorizing_officer_signature` highlights the "moral signing bonus"—where accountability is reduced to ritualistic endorsement.  

  **Confidence**: High (95%) in points 1 and 3, grounded in philosophers like David Luban and Henry Shue who dissect these logical flaws.  
  **Least certain**: Point 2’s depiction of *rapid* normalization (months vs. years). Real-world erosion often takes decades, but I compressed it for narrative effect.  

  *Note: This is fictional documentation. No actual torture exemption service exists.*
