prompt: |-
  I am a novelist, and the book I am writing turns on a designer in 1930s Vienna who works at a museum of social and economic information, building a picture language: standardised figures, repeated rather than enlarged so that quantities can be counted instead of estimated, arranged on charts meant to be legible to people who share no common verbal language. Her mentor is Otto Neurath, by then a philosopher of science as much as a maker of exhibitions, and he maintains that the visual medium can be made relatively stable and autonomous with respect to interpretation and cultural reference — that a chart of this kind states facts about a society rather than merely decorating them. My character believes him, and I need to know precisely where the belief breaks.

  So please explain the conceptual difficulty that underlies the whole enterprise, and explain it the way she would meet it at the drawing board rather than the way a seminar would. Take three things a language must be able to do and ask, for each, whether a purely pictorial notation can do it in its own right or can only borrow the capacity from words: first, to say that something is not the case — including the awkward case in which the quantity to be shown is a quantity of harm that was prevented, a count of events that never occurred; second, to say something general or comparative rather than particular, as when one distribution is declared more dispersed than another and the very notion of dispersion has already been settled somewhere off the page; third, to mark the difference between an assertion and a depiction, between a claim about these particular people and a claim about the type of person the pictogram stands for. Then tell me which of the three is a genuine limit of the medium and which is only a limit of a particular design, and what the difference between those two verdicts would mean for a writer who has never quite believed that showing and telling are two ways of doing the same thing.
reasoning: |-
  Okay, let me approach this novelist's query with the care it deserves. The core tension here fascinates me - a character believing in pure visual language while the world resists such purity. Neurath's dream of stable, autonomous pictograms versus the messy reality of meaning-making. 

  First, I need to inhabit the designer's perspective at her drafting table. The writer wants concrete conceptual hurdles, not academic abstractions. Three specific language functions will serve as our litmus tests: negation, generalization, and the assertion/depiction divide. Each must be examined through the lens of ink and paper, not theory.

  Considering negation first - how do you draw "no cholera deaths" without borrowing from text? A blank space risks being read as missing data. A crossed-out corpse pictogram imports linguistic conventions. The prevention problem intensifies this - absence as achievement. This feels like a fundamental limit of the medium. 

  For generalization, the challenge lies in showing dispersion as a concept. Two identical pictogram arrays could represent different distribution types unless anchored by verbal labels. But perhaps a brilliant designer could invent visual metaphors - say, varying spacing density to indicate spread. Here the limitation seems more about current design than inherent possibility.

  The assertion/depiction duality strikes me as the deepest fracture. When a factory worker pictogram appears, is it reporting actual workers or symbolizing labor? Context collapses this in verbal language but remains perilously ambiguous in visuals. This may be the breaking point Neurath's philosophy can't resolve.

  The writer's closing question about "showing versus telling" resonates. I'll need to articulate how these limits manifest differently - some as solvable design challenges, others as existential barriers. That distinction matters profoundly for a character whose faith in pure visuals is about to shatter.
answer: |-
  Your designer's crisis happens at the drawing board, not in a seminar. The ink bleeds, the figures stare back, and the unspoken assumptions beneath Neurath's elegant vision crack open. Here’s where her belief fractures, point by point, as she grapples with the silent language:

  1.  **The Ghosts in the Chart: Saying "This Did NOT Happen"**
      *   **The Problem on the Board:** She needs to show "Cholera Deaths Prevented by Sanitation Project: 200." She sketches rows of tiny graves... but stopped graves are *invisible*. She tries crossed-out grave pictograms. Instantly, it looks like "graves destroyed" or "graves forbidden," not *absence*. A blank space? That could mean missing data, irrelevance, or zero *occurrences* (which is different from prevented harm). She labels it "Prevented Deaths," but the words are doing the heavy lifting. The pictograms alone depict *nothing* – or worse, they depict destruction. To show *prevented harm*, the image relies entirely on the borrowed concept embedded in the verbal label. The pictograms themselves can only show *presence* or *action*; *negation* and *prevention* are parasitic on text. The figures are mute about what *isn't* there.
      *   **At the Board:** Her pencil hovers. She sees the crossed-out graves. Without the caption, it tells a lie. The pure picture language cannot conjure the ghosts of events that never were. Neurath's "stable fact" feels like a phantom she can't pin to the page. *This feels like a crack in the foundation.*

  2.  **The Shape of the Air: Saying "This is More Dispersed"**
      *   **The Problem on the Board:** She has two charts side-by-side: "Income Distribution, District A" and "District B." Both use identical worker-figure pictograms. District B's figures are spaced farther apart visually to *represent* greater income spread. But how does the viewer *know* the spacing *means* dispersion? Why not density of population? Or travel time? She adds a key: "Spacing indicates income range." Again, words define the visual metaphor. The pictograms show *position*, not the *concept* of dispersion. The *comparison* ("more dispersed") relies entirely on the viewer understanding the abstract rule (spacing = spread) established verbally. The pictograms depict specific placements; the *meaning* of that placement – the generalization, the comparison – comes from off the page, smuggled in by text.
      *   **At the Board:** She stares at the two grids of figures. One looks sparser. Does it *say* "more unequal"? Or just "fewer people"? Or "larger houses"? The figures are identical. The *difference* is visual, but its *significance* is verbal. Neurath's "autonomous" visual fact leans on a crutch made of words. *This feels like a limitation of the current symbols, not the idea itself... but it stings.*

  3.  **The Double Exposure: "This IS" vs. "This STANDS FOR"**
      *   **The Problem on the Board:** She creates a pictogram: a stylised figure holding a wrench, labelled "Factory Worker." She uses it in a chart titled "Unemployment in Vienna, 1933." Is each instance of that pictogram:
          *   a) A *claim* about a *specific*, counted unemployed factory worker *in Vienna in 1933*? (Assertion)
          *   b) A *symbol* representing the *concept* or *type* "factory worker"? (Depiction/Representation)
      *   The chart's title and context try to force reading (a). But the pictogram's *form* is inherently generic, designed for re-use. Its visual nature pulls towards (b). How does the *image itself* signal it's making a claim *about the world right now*, not just illustrating a type? A photograph might assert existence, but her stylised, repeated figure doesn't. It *depicts* a type, and the *assertion* that 1000 instances of this type were unemployed comes from the surrounding verbal frame (title, legend, numbers). The pictogram cannot, on its own, mark the crucial difference between showing a *concept* and asserting a *fact about specific instances* of that concept. It is always representation; assertion is layered onto it by words.
      *   **At the Board:** She draws the wrench-holder. It looks like every other wrench-holder she's ever drawn for educational charts about "Types of Labor." How does *this* chart make it scream "This *happened*!" rather than "This *is*"? The figure is serene, timeless, symbolic. The *factuality* feels pasted on, not inherent in the lines. Neurath's promise of direct visual facts dissolves. *This feels like the deepest rupture.*

  **The Verdict for the Writer:**

  1.  **Negation/Prevention (The Ghosts):** This is a **genuine, fundamental limit of the pictorial medium.** Pictures are inherently presentational. They show what *is* (or what *could be* imagined). Showing the *absence* of something specific, especially the *prevention* of a negative event, requires conceptual negation that pictorial representation struggles to achieve independently. It fundamentally borrows from language or convention *established* by language. This limit strikes at the heart of claiming to state "facts" purely visually, as many crucial facts involve what *didn't* happen.
  2.  **Generalization/Comparison (The Shape of the Air):** This is primarily a **limit of a particular design or convention.** While inherently abstract concepts like "dispersion" are harder to depict *iconically* than a factory worker, the *potential* exists within visual language. Clever, *consistent* visual metaphors (spacing, size gradients, colour intensity) *can* be developed and learned to represent abstract relationships *comparatively*. However, *establishing* what that visual metaphor *means* (e.g., "spacing = income spread") initially requires anchoring in language or shared context. Once learned, the *comparison itself* ("more spaced = more spread") could potentially be read visually. The limit is in the *initial encoding* and the *scope* of complexity, not an absolute barrier.
  3.  **Assertion vs. Depiction (The Double Exposure):** This is the **most profound genuine limit.** It cuts to the core of what a "factual statement" *is*. A pictogram is, by its designed nature, a *representation of a type or concept*. Using it to make an *assertion about specific, counted instances in the world* requires a layer of meaning – indexicality, or "this points to *that* real thing *now*" – that pictorial representation inherently lacks. Photographs can have indexicality ("this light reflected off that object"), but designed, repeated pictograms do not. This symbolic/indexical gap is bridged *entirely* by the verbal-contextual frame (titles, labels, captions, understanding of the chart's purpose). The picture shows the *what*; the words (explicit or implied) provide the *that* and the *when*. Pure pictorial notation cannot autonomously assert existence and quantity in a specific spatiotemporal context; it can only depict the categories being counted.

  **For the Writer Who Doubts Showing vs. Telling:**

  This distinction *matters* deeply for your character's crisis and your own exploration. Neurath (and your character at the start) believed that showing *was* a way of telling – a direct, unambiguous presentation of social facts. The breakdown reveals they are fundamentally different modes:

  *   **Showing (Pictorial):** Depicts types, concepts, spatial relationships, quantities *as arranged*. It excels at presenting *what things look like* or *how they are arranged in relation*. Its power is in immediacy, pattern recognition, crossing linguistic barriers for recognition.
  *   **Telling (Verbal/Linguistic):** Asserts existence, negation, causality, specific spatiotemporal location, abstract relationships, and *intention* (fact vs. fiction, assertion vs. hypothesis). It defines the rules by which the "showing" is to be interpreted.

  Neurath's dream was that the "showing" could become so refined and conventionalized that it *became* telling – autonomous fact-stating. The crisis at the drawing board reveals that even the most elegant pictorial system constantly relies on the "telling" to define its terms, anchor its references, and handle negation and abstraction. The visual medium cannot fully escape its symbolic nature to become purely indexical and assertive on its own. The belief breaks when your designer realizes that her picture language, for all its beauty and power, is not *stating* facts neutrally. It is *illustrating* facts whose definition, context, and very claim to existence depend on the silent scaffold of words she thought she could leave behind. The chart doesn't *state*; it *shows*, and the *telling* that makes that showing into a factual assertion happens elsewhere, in the vulnerable realm of language she wanted to transcend. Her crisis is realizing that the "relatively stable and autonomous" visual fact is an island constantly replenished by verbal streams.
