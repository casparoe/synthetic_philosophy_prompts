  ### Key Clarifications
  - **Steps 1–8 stand**: The theorem’s core (1)–(5) and empirical observations (6)–(8) hold. Step (10) fails with (9).
  - **Residue**: Elections *can* reflect collective preferences imperfectly. The repair-dependent "residual" problem is whether any non-dictatorial rule achieves *sufficient* truthfulness for democratic legitimacy—a contestable empirical/practical question.
  - **Costs vs. benefits**: All repairs sacrifice either democratic ideals (inclusivity, determinism) or robustness (to beliefs, coordination). None restore the pre-theorem hope of perfect revelation.
