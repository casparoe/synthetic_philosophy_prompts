prompt: |-
  I have no academic training in ethics, but I have been trying to work out for myself when the everyday conventions of a place—how to tip, how to queue, when to cross the street, where to stand on an escalator—are things I am actually obligated to follow, and especially when they bind a visitor who did not grow up with them. I have a set of gut verdicts, and I would like to know what principle, if any, captures them. I suspect the answer will have to distinguish conventions that are load-bearing, in the sense that they allocate some burden or benefit among people, from conventions that are more ornamental, but I am not sure that distinction survives the cases.

  Here are my verdicts. In a country where tipping is the norm, I am a visitor and leave no tip after ordinary service. I think that is wrong, though somewhat less wrong than if I were a resident. In a country where tipping is not the norm and may even be awkward or insulting, I am a visitor and leave a large tip. I do not think that is wrong, exactly—it may be gauche, but it is not a moral failure. In a place where people queue in a strict line, I am a visitor and accidentally join by standing at the side; someone points to the back, and I go. I think I did nothing wrong, but I would have been wrong to refuse to move. If I knowingly cut the line because I was in a hurry, I think that is wrong, and not much less wrong because I am a visitor. In a city where jaywalking is common and unenforced, I cross against the light with everyone else; I think that is fine. In a city where jaywalking is genuinely frowned on, I cross against the light as a visitor; I think that is wrong, even if no one is harmed and no one is even likely to see me. In a place where people stand on the right and walk on the left of an escalator, I stand on the left with a suitcase. I think that is wrong, but mainly because I am blocking people, not because I have violated a rule as such. In a home where guests are expected to remove their shoes, I keep mine on. I think that is wrong, and more clearly wrong than the escalator case. At a market where haggling is expected, I pay the first price. I think that is not wrong, just foolish. At a communal kitchen where no rule is posted but everyone cleans up after themselves, I leave my dishes. I think that is wrong, even though there is no sign. Finally, in a country where small payments to officials are customary for permits, I pay one. I think that is wrong even though it is the local convention, because it harms people who cannot pay or who are shut out. But I do not think a visitor is obligated to adopt every local practice that locals themselves treat as normal; something about the payment case seems different from the shoe case, and I cannot say exactly what.

  What I want is a principle, or a small set of candidate principles, that makes sense of these verdicts. Please state it precisely, with the case that motivates each clause, and test it against the cases above, including the ones where I am unsure. Tell me which of my verdicts it forces me to give up. I am particularly interested in whether the load-bearing versus ornamental distinction can be stated precisely enough to do the work, and if not, what should replace it. I would also like it to say what it predicts for cases I have not listed: a visitor who speaks a different language and cannot read a posted rule; a local who violates the same convention in front of a visitor; a convention that is offensive to the visitor's own moral or religious convictions; a convention that everyone follows but no one can explain; and a case where the visitor's breach is harmless in itself but would become harmful if many visitors did it. Finally, please be honest about whether the principle is doing real work or whether it is just a restatement of my verdicts, and whether the visitor's status should matter at all, or whether it is a distraction from the underlying question of what the convention is for.
reasoning: |-
  Alright, let me try to unpack this user's query. They're grappling with when everyday conventions obligate them, especially as a visitor. They've listed specific scenarios and their gut reactions to each. The main challenge is finding a principle that explains these reactions without just restating them.

  First, I notice the user is self-taught in ethics, which means they need clear, non-jargon explanations. They’re looking for a framework that can handle nuances, like tipping versus bribery. Their examples show they distinguish between inconvenience and harm, and between personal preference and systemic issues.

  The user’s deep need seems to be understanding the underlying reasons behind social norms. They want a consistent moral compass when navigating different cultures. They’re also testing whether the "load-bearing" vs. "ornamental" distinction holds up, which it doesn’t perfectly, as seen in the shoe removal case being more about respect than allocation.

  I recall ethical theories like Scanlon's Contractualism, which emphasizes justifiability to others. That might fit here because the user’s verdicts often hinge on whether violating a norm would burden others or show disrespect. For example, not tipping where it’s expected burdens the server, while tipping where it’s not customary is just awkward but not harmful.

  The communal kitchen case is key. Even without a posted rule, leaving dishes unwashed creates extra work for others. The principle here is about fairness in shared responsibilities. Similarly, jaywalking where it’s frowned upon risks normalizing disobedience, which could harm others if everyone did it.

  The bribery example stands out because it’s a convention that’s inherently unjust. The user feels it’s wrong even if locals accept it. This points to conventions that perpetuate harm or inequality, overriding local norms. The principle must account for universal moral standards beyond local practices.

  The visitor status matters in terms of knowledge and impact. A visitor might not know all norms, so obligations lessen if unaware. But if aware, refusal to comply (like cutting in line) is wrong. The escalator case shows blocking others is wrong, but primarily because of the obstruction, not the rule itself.

  Testing the principle against unlisted cases: A visitor who can’t read a rule isn’t blameworthy unless they should’ve known. A local violating norms might erode the system. Offensive conventions might be refused if they harm dignity. Unexplained norms still need compliance if they coordinate behavior.

  The key insight is distinguishing between coordination norms (like queuing) that rely on participation for mutual benefit, and harmful norms that exploit or oppress. The principle must balance respect for local context with moral limits on harmful practices. The user’s verdicts mostly align, except perhaps the haggling case—paying first price isn’t wrong, just inefficient, which fits under no harm caused.

  In conclusion, the proposed principles based on harm, fairness, and respect capture most cases. The user might need to adjust their view on harmless breaches that could scale harmfully, but otherwise, the framework holds. The visitor status reduces blame only when unaware; once informed, obligations align with locals unless the norm is inherently unjust.
answer: |-
  Based on your intuitive verdicts and the need for a principle distinguishing "load-bearing" from other conventions while accounting for visitor status, harm, fairness, and respect, I propose the following framework:

  **The Principle of Cooperative Fairness and Harm Avoidance:**

  1.  **Compliance is presumptively obligatory for a convention if:**
      *   **(a) It coordinates behavior to fairly distribute burdens/benefits (Cooperative Fairness), OR**
      *   **(b) Violation predictably causes harm, inconvenience, or offense to others (Harm Avoidance), AND**
      *   **(c) The convention is reasonably knowable to the agent.**

  2.  **The presumption of obligation is overridden if:**
      *   **(d) Compliance would require participating in or perpetuating significant injustice or harm (Anti-Harm Override).**

  3.  **Visitor Status:**
      *   **(e) Visitor status primarily affects condition (c) "reasonably knowable" (less expectation to know obscure norms) and slightly mitigates blame for minor violations of (a) or (b) due to unfamiliarity, but does not absolve obligation once the norm *is* known or the harm/offense is obvious.**
      *   **(f) Visitor status does *not* override (d).**

  **Motivation & Breakdown:**

  *   **Clause (a) Cooperative Fairness:** Captures the "load-bearing" intuition. Conventions exist to solve coordination problems and allocate scarce resources (time, space, money, effort) fairly. Violating them disrupts this fair allocation.
      *   *Motivated by:* Tipping (where expected), Queueing, Escalator Standing (efficiency/fair access), Communal Kitchen Cleanup, Permit Bribes (allocates access unfairly). Explains why leaving no tip (burden shifted unfairly to server) is wrong, while not haggling (no unfair burden created) is not wrong.
  *   **Clause (b) Harm Avoidance:** Captures norms preventing tangible harm, significant inconvenience, or meaningful offense (linked to respect or dignity). Violation directly negatively impacts others.
      *   *Motivated by:* Jaywalking (where frowned on - risk normalization/erosion of rule), Escalator Standing (blocking = inconvenience), Shoe Removal (offense/disrespect to host/home), Queue Cutting (inconvenience/offense), Communal Kitchen (inconvenience/unfair labor shift). Explains why jaywalking alone might feel wrong even if harmless *this time* (normalization risk).
  *   **Clause (c) Reasonable Knowability:** Addresses feasibility and blame. You can't be obligated to follow an unknown rule. Locals have higher epistemic duty than visitors.
      *   *Motivated by:* Accidental queue joining (not wrong until informed), Visitor tipping confusion (mitigation).
  *   **Clause (d) Anti-Harm Override:** Recognizes that local conventions aren't morally absolute. Participation in harmful or unjust practices isn't required.
      *   *Motivated by:* Permit bribes (harms the excluded/perpetuates corruption), and potentially conventions offensive to core visitor convictions (though this is complex - see below).
  *   **Clause (e) Visitor Status:** Explains the slight mitigation in tipping (less wrong for visitor) and the importance of being informed (queue case). Confirms that knowing violation (line cutting) is still wrong.
  *   **Clause (f) Visitor Status Limit:** Confirms that visitor status doesn't excuse participation in injustice (bribes).

  **Testing Against Your Cases:**

  1.  **Tipping (Norm):** Violates (a) - Unfair burden shift to server. Obligatory. Visitor status (e) slightly mitigates blame, but doesn't remove wrongness. **Matches Verdict.**
  2.  **Tipping (Not Norm):** Does *not* violate (a) (no expected burden shift) or (b) (awkward ≠ significant harm/offense). No obligation. **Matches Verdict.**
  3.  **Queue (Accidental Join):** No violation of (a) or (b) *until informed*. Once informed, refusal violates (a)/(b). Moving complies. **Matches Verdict.**
  4.  **Queue (Knowing Cut):** Violates (a) (unfair time allocation) and (b) (inconvenience/offense). Obligatory. Visitor status (e) offers minimal/no mitigation for knowing violation. **Matches Verdict.**
  5.  **Jaywalking (Common):** Does not violate (a) (no coordination problem) or (b) (no harm/offense expected). **Matches Verdict.**
  6.  **Jaywalking (Frowned On):** Violates (b) - Risk of harm through normalization/erosion of rule, even if safe *this time*; also potential offense (disrespect for local order). Obligatory. **Matches Verdict.**
  7.  **Escalator (Blocking):** Violates (b) - Causes direct inconvenience (blocking). Wrong, primarily for the harm, not the rule *per se*. **Matches Verdict.**
  8.  **Shoe Removal:** Violates (b) - Causes significant offense/disrespect to host in their home. Obligatory. **Matches Verdict.** (Distinction from escalator: Offense in personal space > inconvenience in public transit).
  9.  **No Haggling:** Does not violate (a) (seller sets price, no unfair burden created - you overpay, they benefit) or (b) (no harm/offense). Not wrong. **Matches Verdict.**
  10. **Communal Kitchen:** Violates (a) - Unfair labor shift (burden on others) and (b) - Inconvenience. Obligatory, even without a sign (reasonable knowability through observation). **Matches Verdict.**
  11. **Permit Bribes:** *Appears* to satisfy (a) (local coordination). **BUT** overridden by (d) - Participation perpetuates significant injustice/harm (exclusion, corruption). Wrong. Visitor status (f) irrelevant. **Matches Verdict.**

  **What You Might Need to Give Up (or Refine):**

  *   **Harmless Jaywalking:** Your verdict feels it's wrong even if harmless and unseen. The principle (via (b) - normalization risk/offense) supports this, but it's the *weakest* link. If you truly believe it's wrong *only* because it's "the rule," even with zero risk of harm, normalization, or offense, you might need to add a separate "respect for local authority/order" clause. The principle emphasizes harm/offense/fairness over blind rule-following.
  *   **"Gauche" vs. "Wrong":** The principle draws a line. "Gauche" (tipping where not norm) falls below the threshold of *obligation* under (a) or (b). It's socially awkward, not morally wrong. If you feel *any* social misstep is a tiny moral wrong, you'd need to adjust, but the principle rejects that.

  **Load-Bearing vs. Ornamental:**

  This distinction *is* captured but refined:
  *   **Cooperative Fairness (a)** directly corresponds to "load-bearing" conventions solving coordination/fair allocation problems.
  *   **Harm Avoidance (b)** captures conventions preventing harm/offense, which might sometimes feel "ornamental" but have real impact (e.g., shoe removal offense). The "ornamental" label doesn't survive; norms preventing offense are significant.
  *   **The key is the *function*:** Does violating it unfairly burden others (a) or harm/offend them (b)? If not, it's likely non-obligatory ("ornamental" in a moral sense).

  **Predictions for New Cases:**

  1.  **Visitor can't read posted rule:** Affects (c) Reasonable Knowability. If the rule is *only* posted and in an unfamiliar language/script, and no other cues exist, obligation is weak/non-existent. If the norm is observable (e.g., everyone queues), (c) might still be satisfied.
  2.  **Local violates convention in front of visitor:** Does *not* automatically absolve the visitor. The obligation stems from (a) or (b). The local's violation might make the norm less robust or known, potentially affecting (c) or the *strength* of (a/b), but doesn't erase the underlying reason for the norm. It might also violate (a) or (b) itself!
  3.  **Convention offensive to visitor's convictions:** Triggers (d) Anti-Harm Override *if* participation causes significant harm/injustice (e.g., participating in a discriminatory ritual). If it's merely contrary to personal belief but not harmful (e.g., a dietary restriction the visitor finds silly), (d) may not apply, and (b) (offense to locals) might create an obligation *to comply* to avoid offense. A nuanced balance.
  4.  **Convention everyone follows but no one can explain:** If it serves (a) or (b), it's still obligatory. The reason for the norm matters, not people's ability to articulate it (e.g., historical queueing norms).
  5.  **Harmless breach that would be harmful if widespread:** Directly addressed by (b) - the risk of normalization/scaling *is* a predictable harm, making the individual violation potentially wrong (e.g., jaywalking where frowned upon, littering in a pristine area).

  **Honest Assessment:**

  1.  **Real Work vs. Restatement:** The principle *does* real work. It:
      *   Explains *why* tipping (norm) is obligatory but not haggling is not (Cooperative Fairness).
      *   Explains the difference between escalator blocking (Harm Avoidance) and shoe removal (Harm Avoidance - offense) vs. no haggling (neither).
      *   Explains why bribes are wrong despite being conventional (Anti-Harm Override).
      *   Explains the role of visitor status (affecting Knowability and slightly mitigating blame, not core obligation).
      *   Predicts outcomes for new cases (e.g., scaling harm, unreadable rules).
      *   Forces potential refinement on "harmless" jaywalking.
      *   Replaces "load-bearing/ornamental" with the more functional and ethically grounded "Cooperative Fairness/Harm Avoidance".
  2.  **Visitor Status:** It *does* matter, but primarily epistemically (what you can reasonably know) and in degrees of blame for minor violations due to unfamiliarity. It does *not* change the core grounds of obligation ((a) or (b)) once the norm is known. It is *not* a distraction; it highlights that the *underlying function* of the convention (coordination, fairness, harm prevention) is what creates the obligation, and visitor status affects access to that knowledge and perhaps societal expectations of perfection. The "what the convention is for" is central.

  This principle provides a robust framework justifying most of your verdicts based on avoiding unfair burdens, preventing harm/offense, and rejecting harmful conventions, while realistically accounting for the practical and epistemic position of a visitor.
