prompt: |-
  I'm a philosophy grad student working on normativity, trying to get a draft into shape, and I'd like you to act as a referee for a journal that publishes on reasons and rationality. Give me comments, and be honest about which parts are dead on arrival. I care most about whether the central argument actually works; less about prose. Please start by brainstorming the strongest objection to what I'm about to say before you write the comments themselves.

  The gist: everyone separates reasons that are reasons for an attitude in the right way from reasons that merely make it useful or desirable to have the attitude. The demon who will torture you unless you believe that 2+2=5 gives you a reason of the second sort, not the first. The standard framing -- and I'm just borrowing it, not claiming originality -- is that right-kind reasons bear on whether the attitude is correct or fitting, and wrong-kind ones bear on whether having the attitude is good for you.

  My move is that this framing quietly assumes the attitude has one fixed constitutive aim. Take an attitude with a feedback loop between the attitude and its object. If I trust you and my trusting you makes you more trustworthy, then the reason "trusting you will make you trustworthy" looks state-given at the start and object-given by the end -- exactly the thing the distinction is meant to sort cleanly. Same with a stock that rises because analysts believe it will rise, or a shy person who becomes brave because everyone keeps telling them they're brave. Call these loop cases.

  First claim: loop cases aren't wrong-kind reasons that got promoted to right-kind; they show the right/wrong-kind line is only defined relative to a fixed point of the loop, so any account that treats the distinction as a property of the reason itself is incomplete. Second claim, weaker: a fitting-attitude account of value can survive loop cases only if it says what fixes the fixed point, and I don't think anyone has said.

  So: (1) Is the distinction still doing work if it's relative like this, or have I just redescribed the problem in fancier words? (2) Can you construct a loop case where the reason is clearly wrong-kind and stays that way, which would kill my argument? (3) If you think I'm right, what's the cheapest repair -- an error theory about the distinction, or a shift to reasons-relative-to-a-purpose? Be blunt about which of my moves are just known moves wearing a hat. Don't bother with citations, I'll handle those, and please don't just tell me it's interesting -- I need to know where it breaks.
reasoning: |-
  Okay, the user is a philosophy grad student working on normativity, specifically the distinction between right-kind and wrong-kind reasons (RKR/WKR). They want me to act as a journal referee focusing on whether their central argument holds. The core idea is that the standard RKR/WKR distinction assumes a fixed constitutive aim for attitudes, but in "loop cases" (like trust making someone trustworthy), reasons can shift from appearing state-given to object-given. 

  First, I need to identify the strongest possible objection to their argument. The most powerful counter seems to be that loop cases don't actually blur the RKR/WKR distinction but instead involve two separate normative relations—one instrumental and one constitutive. For example, in the trust case: the initial reason to trust (to make the person trustworthy) is purely instrumental (WKR), while later reasons to trust (because they've become trustworthy) are constitutive (RKR). The fact that the attitude causes a change in the object doesn't merge these categories; it just creates a temporal sequence where different reasons apply at different times. 

  The user claims the distinction becomes "relative to a fixed point," but this might confuse the reason's nature with its temporal applicability. The constitutive aim of trust—to respond to actual trustworthiness—remains fixed even if the world changes. So the RKR/WKR distinction isn't undermined; it just operates dynamically. Their first claim (that the distinction is incomplete without specifying a fixed point) could be countered by arguing that the fixed point is the attitude's constitutive standard, not an arbitrary point in a loop. 

  For their second claim (that fitting-attitude accounts need to "fix the fixed point"), the objection would be that these accounts already define fittingness via constitutive aims (e.g., belief aims at truth), so loop cases don't introduce new problems—they just show how empirical circumstances affect reason application. The user might be overcomplicating a solved issue. 

  Now, for the referee report: I should flag that their treatment of loop cases as "shifting" RKR/WKR status is the most vulnerable part. If a reason is purely instrumental (e.g., trusting to avoid a demon's punishment), it stays WKR regardless of consequences, unlike trust that actively cultivates trustworthiness. The latter has a constitutive element from the start because it engages the attitude's core function (relational responsiveness). This needs clarification. 

  Their argument might work only for attitudes with "world-to-mind" direction of fit (like trust), not "mind-to-world" (like belief). Demon cases for belief can't become RKRs because belief's aim (truth) is static. If they haven't addressed this asymmetry, it's a major hole. 

  Cheapest repair? Proposing a "reasons-relative-to-a-constitutive-aim" framework, but they must explain why existing accounts (e.g., Schroeder's) don't already cover this. The originality is questionable here—they're repackaging dynamism in normativity, not revolutionizing the distinction. 

  Bluntly: The move isn't entirely new (similar to "triggering vs. constitutive" reasons discussions), and the "fixed point" language risks obscuring that constitutive aims are the anchor. Focus on clarifying why loops require relativization rather than just acknowledging dynamic reasons. Without that, the draft feels like a gloss on existing ideas.
answer: |-
  Below is a referee report addressing your core argument with the requested bluntness. I’ve structured it around your questions and prioritized evaluating the argument’s viability over prose or citations. The strongest objection precedes the comments.

  **Strongest Objection (Brainstormed):**  
  **Your loop cases don't blur the RKR/WKR distinction—they involve two distinct normative relations.** The initial reason to adopt the attitude (e.g., trusting to *make* someone trustworthy) is purely *instrumental* (WKR). Once the loop causes the object to change (the person *becomes* trustworthy), new *constitutive* reasons (RKR) emerge to hold the attitude *because the object now merits it*. The distinction holds at every point: the reason’s *nature* (instrumental vs. constitutive) is determined by the attitude’s fixed constitutive aim (e.g., trust aiming at *actual* trustworthiness), not by temporal effects. The loop only changes the *world*, not the *normative structure* of the attitude. Your "relativity" is just dynamic application of a static standard.

  ---

  **Referee Report**  

  **Overall Assessment:**  
  Your challenge to the fixed-point assumption in RKR/WKR distinctions is provocative and targets a genuine tension. However, the central argument fails to undermine the distinction as formulated. Loop cases expose dynamics in reason-application but don’t relativize the RKR/WKR boundary. Significant revisions are needed to salvage the core claim.  

  **Major Comments:**  

  1.  **The Relativity Claim Collapses into a Dynamic Application Problem (Addresses Q1):**  
      You argue that loop cases force the RKR/WKR distinction to be "relative to a fixed point." But this relativity doesn’t threaten the distinction—it highlights how *empirical conditions* change while the *constitutive standard* remains fixed. In your trust case:  
      - **Time T1:** The reason "trusting will make them trustworthy" is **instrumental** (WKR). Trust’s constitutive aim (responsiveness to *actual* trustworthiness) is unmet here.  
      - **Time T2 (after loop):** The reason "they are trustworthy" is **constitutive** (RKR). The aim is now satisfied.  
      The *same* constitutive aim governs both moments. The loop changes *whether the aim is fulfilled*, not *what the aim is*. Your framing mistakes a change in the *object’s properties* for a shift in the *attitude’s standard*. **Verdict: Dead on arrival.** This doesn’t show the distinction is incomplete; it shows reasons apply differently as facts change.  

  2.  **Loop Cases Don’t "Promote" WKRs to RKRs—They Generate New RKRs (Addresses Q2):**  
      You ask for a loop case where a reason stays WKR. This already exists: **The Demon Stock.** Suppose a demon will torture you unless you *believe* a stock will rise. Analysts then collectively believe this, causing the stock to rise.  
      - **T1:** "Believing avoids torture" is **WKR** (prudential, not truth-related).  
      - **T2:** "The stock rose" is **RKR** for maintaining the belief (constitutive of belief: aiming at truth).  
      Crucially, the T2 RKR *is a new reason* created by the loop’s outcome. The original WKR (avoid torture) *never becomes an RKR*. It remains a WKR for the *initial adoption* of belief, irrelevant to the attitude’s correctness. **Verdict: Your Claim 1 fails.** Loop cases generate new RKRs from changed facts; they don’t transmute WKRs.  

  3.  **"Fittingness Survives, But Your Critique Misses the Mark" (Addresses Claim 2):**  
      Fitting-attitude accounts *can* handle loops: fittingness is always evaluated relative to the *actual properties of the object at the time of assessment*. In the shy person case:  
      - Praising them as brave (when they aren’t) is **unfitting** initially (WKR: "praising encourages bravery").  
      - Once they *become* brave, praising is **fitting** (RKR: they merit it).  
      The "fixed point" is just the **constitutive aim of the attitude** (e.g., praise aims at actual virtue). No further "fixing" is needed. Your claim that "no one has said" this overlooks that constitutive aims *are* the fixed point in standard accounts (e.g., Wedgwood, Schroeder). **Verdict: Claim 2 is weak.** The problem isn’t unsolved; your argument misdiagnoses it.  

  4.  **Cheapest Repair? Abandon Relativity, Refocus on Attitude Types (Addresses Q3):**  
      - **Error Theory:** Too strong. The distinction *works* in loop cases when properly applied (see #1-3).  
      - **Reasons-Relative-to-a-Purpose:** More promising, but risks triviality. Distinguish:  
        - **Constitutive Purpose:** Generates RKRs (e.g., belief → truth).  
        - **Extrinsic Purpose:** Generates WKRs (e.g., belief → avoid demons).  
        Loops might exploit attitudes whose constitutive purpose *includes* world-shaping (e.g., trust, collective intentions). Here, "trusting to make trustworthy" could be *partially constitutive* if trust inherently aims at *creating/maintaining* trustworthiness in relationships. **This reframes your insight:** The RKR/WKR distinction may depend on whether the attitude’s *constitutive function* is static (belief) or dynamic (trust). **Focus here.**  

  **Where Your Moves Are Known Moves in Disguise:**  
  - **Loop Cases:** Analogous to "self-fulfilling prophecies" in decision/game theory (e.g., Schelling points). Not novel.  
  - **Relativity to Context:** Parfit, Schroeder, et al. already discuss how context affects reason *weight*/application—but not the RKR/WKR *category*.  
  - **Constitutive Aims:** Borrowed from Velleman (belief), Raz (intentions), etc. Your "fixed point" is their "aim."  

  **Recommendation:**  
  Pivot to **attitudes with world-to-mind direction of fit** (e.g., trust, promises, collective attitudes). Argue that *for these*, some "loop-sensitive" reasons are constitutive (RKR) because the attitude’s function *includes* shaping its object. Abandon the "relativity" thesis—it conflates empirical change with normative structure. This rescues the interesting insight: **The RKR/WKR distinction may map poorly to attitudes whose correctness conditions are inherently dynamic.**  

  **Blunt Summary:**  
  The central argument (Claim 1) is DOA. Loop cases don’t relativize the distinction; they dynamically apply it. Claim 2 is salvageable only if you target attitudes where constitutive aims *include* world-shaping. Drop the "fixed point" jargon—it’s the constitutive aim, and it’s not broken. Revise to focus on **dynamic constitutive aims** as a challenge for *specific* attitudes. Current draft doesn’t work.
