  Now, identifying non-negotiable vs. negotiable desiderata. Non-negotiables are the core principles any theory must satisfy to be rational—like consistency, dominance, and handling undefined probabilities. Negotiable ones might include how risk aversion is framed or specific solutions to paradoxes. But the user needs to know which are essential.

  The big issue is joint unsatisfiability. The St. Petersburg and Pascal's Mugging cases push against bounded utility. If utility is unbounded, these paradoxes arise. But bounding utility might conflict with other desiderata, like accommodating all gambles. Also, the repeat mugger highlights sequential inconsistency. Theories allowing each gamble but not the sequence might violate pragmatic constraints. So the core tension is between unbounded utility (leading to fanaticism) and bounded utility (which avoids it but may seem ad hoc).

