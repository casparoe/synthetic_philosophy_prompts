answer: |-
  Here’s a structured breakdown of desiderata, negotiability, and joint unsatisfiability for a decision theory addressing expected-value fanaticism, tailored for your dissertation chapter:

  ---

  ### **Core Desiderata for Handling Fanaticism**
  1.  **Resolve Pascal's Mugging:**  
      *   **Case:** Mugger threatens harm with tiny probability (e.g., 1/3↑↑↑100) but offers astronomically large payoff (e.g., 3↑↑↑100 utils) if paid $5. Naive EU says "Pay!" despite absurdity.  
      *   **Requirement:** The theory must *not* prescribe paying in realistic variants. Must avoid domination by arbitrarily large utilities combined with arbitrarily small-but-nonzero probabilities.  
      *   **Distinction:** Must preserve that *some* tiny probabilities can justify large risks (e.g., asteroid prevention), but not *all arbitrarily constructed* ones.

  2.  **Handle Unbounded Expectations (St. Petersburg Paradox):**  
      *   **Case:** Game with undefined (or "infinite") expected utility (e.g., $2^n$ payoff with probability 2⁻ⁿ for n=1,2,3,...). Naive EU suggests paying any finite entry fee.  
      *   **Requirement:** Must prescribe a finite entry fee or reject strict EU maximization. Must distinguish between "infinite" and "undefined" expectations.  
      *   **Distinction:** "Infinite expectation" vs. "Undefined expectation" (e.g., St. Petersburg vs. the Pasadena game by Hájek & Nover).  

  3.  **Account for Imprecise/Undefined Probabilities:**  
      *   **Case:** Decisions under Knightian uncertainty (e.g., probability of AGI catastrophe), deep uncertainty, or non-measurable events.  
      *   **Requirement:** Must offer rational guidance without collapsing to EU or maximin. Must respect ambiguity aversion without requiring it as rationally mandatory.  
      *   **Distinction:** Precise small probability (e.g., 10⁻¹⁰) vs. *truly* vague/imprecise probability (e.g., [0, 0.1]).  

  4.  **Respect Sequential Rationality & Path Dependence (Repeat Mugger):**  
      *   **Case:** Accepting *n* independent gambles, each with positive EU, but aggregate probability of ruin →1 as *n*→∞.  
      *   **Requirement:** Must either:  
          (a) Reject individual gambles *because* of the sequential context, or  
          (b) Prescribe a stopping rule, or  
          (c) Explain why accepting all gambles is rational despite near-certain ruin.  
      *   **Status:** **Genuine desideratum.** Exposes myopia in "per-gamble" EU maximization. Forces theories to address dynamic consistency/pragmatic constraints.

  5.  **Formal Rationality Constraints:**  
      *   **Stochastic Dominance:** If A is better than B in *every* state, choose A.  
      *   **Consistency:** No Dutch Books; decisions under refinement/coarsening of descriptions remain coherent.  
      *   **Continuity:** Avoids lexical priority fanaticism (e.g., "any probability of infinite utility dominates all finite utilities").  
      *   **Non-Arbitrariness:** Solutions shouldn't rely on unmotivated parameters or case-by-case adjustments.

  6.  **Risk Aversion as Optional:**  
      *   **Distinction:** Must allow risk aversion as a *preference* (e.g., concave utility over money) without requiring it as a *rational mandate* to avoid fanaticism.

  ---

  ### **Negotiability Spectrum**
  | **Desideratum**                     | **Non-Negotiable?** | **Rationale**                                                                 |
  |-------------------------------------|---------------------|------------------------------------------------------------------------------|
  | Stochastic Dominance                | ✅ Yes              | Core axiom of coherence; violating it implies rejecting strict superiority. |
  | Consistency (No Dutch Books)        | ✅ Yes              | Foundational for avoiding money pumps and maintaining rationality.         |
  | Distinguish ∞ vs. Undefined EU      | ✅ Yes              | Necessary for accurate formal representation of gambles.                   |
  | Resolve Repeat Mugger (sequentially)| ✅ Yes              | Reveals dynamic incoherence; essential for real-world applicability.       |
  | Handle Imprecise Probabilities      | ✅ Yes              | Crucial for modeling deep uncertainty in fanaticism contexts.              |
  | Risk Aversion not Mandatory         | ⚠️ Mostly          | Most theories permit it, but some (e.g., extreme precautionary) may require it. |
  | Resolve Pascal's Mugging            | ⚠️ Mostly          | Central to fanaticism; theories must address it, but *how* is negotiable.   |
  | Continuity                          | ⚠️ Mostly          | Lexical priorities create fanaticism; bounded utility violates continuity. |
  | Resolve St. Petersburg              | ❌ No               | Some theories (e.g., bounded utility) "solve" it by fiat; others embrace it. |

  ---

  ### **Jointly Unsatisfiable Desiderata**
  **The Core Tension:**  
  `Unbounded Utility + Continuity + Standard Probability + Sequential EU Maximization → Fanaticism.`  

  **Specifically:**  
  1. **Bounded Utility** (e.g., Arrow, Savage) solves St. Petersburg, Pascal's Mugging, and Repeat Mugger by capping utility.  
     *   *Sacrifices:* Continuity (lexical priority for near-infinite utility is forbidden), and arguably "handles" undefined probabilities poorly.  
  2. **Regularization** (e.g., discounting tiny probabilities, tail-ignoring) solves Pascal's Mugging and Repeat Mugger.  
     *   *Sacrifices:* Formal elegance (can feel ad-hoc), may fail St. Petersburg if tails are not ignored.  
  3. **Rank-Dependent Utility** (e.g., cumulative prospect theory) or **Lexicographic Theories** solve imprecise probabilities and may avoid mugging.  
     *   *Sacrifices:* Full consistency (potential Dutch Books), may not resolve Repeat Mugger.  
  4. **Limiting Decision Rules** (e.g., maximize expected utility *in the limit* of sequences) may handle the Repeat Mugger.  
     *   *Sacrifices:* Static rationality (individual gambles may have positive EU but are rejected).  

  **The Unsatisfiable Triad:**  
  No theory can *simultaneously* satisfy all of the following:  
  1. **Unbounded Utility:** Allows arbitrarily large values.  
  2. **Continuity:** No lexical priorities; small changes in prob/utility yield small changes in preference.  
  3. **Sequential EU Maximization:** Accepting every gamble with strictly positive conditional EU in a sequence.  

  *   **Why?** The Repeat Mugger exploits this: unbounded utility + continuity forces acceptance of each positive-EV gamble, but sequential acceptance guarantees ruin. Any solution must break one of these (e.g., bounded utility breaks 1; rejecting some positive-EV gambles breaks 3; introducing lexical thresholds breaks 2).

  ---

  ### **Recommendation for Your Chapter**
  1. **Position the Repeat Mugger as a critical test case** for dynamic coherence—it’s not sleight of hand but a stress test for sequential rationality.  
  2. **Frame the central problem** as the **unsatisfiable triad** above. This clarifies why all existing theories "sacrifice" something:  
     - **Bounded utility** (e.g., Weymark): Sacrifices continuity/unboundedness.  
     - **Regularization** (e.g., Beckstead & Thomas): Sacrifices formal purity.  
     - **Contextual rules** (e.g., "ignore probabilities below ε"): Sacrifice sequential EU.  
  3. **Conclude** that choosing a theory requires prioritizing which desiderata to preserve (e.g., "bounded utility if coherence is paramount; regularization if practical handling of small probabilities is key").  

  This framework turns fanaticism into a litmus test for decision theories, revealing their deepest trade-offs—ideal for a dissertation chapter.
