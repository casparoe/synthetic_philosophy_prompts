  ### Decision Tree for Theories of Emotion  
  *Based on logical space defined by key cases, with internal nodes as questions about cases. Answers must be based on intuitions or theoretical commitments, not prior knowledge of positions. Leaves are descriptive views, each with one awkward implication for a specified case. Aim: 6–8 leaves, 6–9 nodes, fitting on a handout.*  

  ---

  #### **Node 1: In the startle case (sudden bang, flinch, heart pounds, state drains after realization), is the initial flinch an emotion?**  
  - **Yes** (emotions can be automatic, brief, and non-cognitive) → **Node 2**  
  - **No** (emotions require more than reflex) → **Node 3**  

  #### **Node 2: In the same startle case, is the flinch identical to the bodily feeling (e.g., heart pounding)?**  
  - **Yes** → **Leaf: Pure Bodily-Feeling View**  
    - *Emotions are perceptions of bodily changes; no intrinsic link to evaluation or objects.*  
    - **Awkward for case (iv):** The same racing heart before a talk cannot be dread or excitement—it must be the same emotion, as bodily feelings are identical.  
  - **No** → **Leaf: Action-Tendency-First View**  
    - *Emotions are dispositions to act (e.g., flinching as avoidance), with feelings as secondary.*  
    - **Awkward for case (iii):** Reported fear with no behavior or physiology cannot be fear, as action tendencies are essential.  

  #### **Node 3: Can an emotion lack an intentional object (e.g., free-floating irritability)?**  
  - **Yes** (emotions need not be "about" something) → **Node 4**  
  - **No** (emotions must have an object) → **Node 5**  

  #### **Node 4: Do objectless states (e.g., irritability) and object-directed emotions (e.g., fear of spiders) share core properties?**  
  - **Yes** → **Leaf: Pure Bodily-Feeling View** (as above, but extended to moods)  
  - **No** → **Leaf: Deflationary View**  
    - *Emotions do not form a natural kind; objectless moods and object-directed states are distinct phenomena.*  
    - **Awkward for case (vi):** The untranslatable emotion term is either not a "real" emotion or exposes arbitrariness in categories.  

  #### **Node 5: Can an emotion be about a non-existent object (e.g., fear of a horror monster)?**  
  - **Yes** (emotions can target fictional/nonexistent things) → **Node 6**  
  - **No** (emotions require real or believed-real objects) → **Leaf: Evaluative-Judgment View**  
    - *Emotions are judgments that ascribe evaluative properties (e.g., danger) to objects, requiring belief in their existence.*  
    - **Awkward for case (v):** Grief for a person who never lived is not an emotion, as it lacks a real object.  

  #### **Node 6: In the spider fear case (afraid for years despite knowing it's harmless), is the fear irrational?**  
  - **Yes** (the emotion misrepresents the object) → **Node 7**  
  - **No** (the emotion is not assessable for accuracy) → **Leaf: Attitude-First View**  
    - *Emotions are sui generis evaluative stances (e.g., "taking-as-threatening"), not beliefs or perceptions.*  
    - **Awkward for case (ii):** The fear is not "wrong" but merely unfitting—no mistake is made, even with no threat.  

  #### **Node 7: Is the irrationality due to the emotion's content being false (e.g., falsely claiming "the spider is dangerous")?**  
  - **Yes** → **Leaf: Evaluative-Judgment View** (as above, but now applied to irrational cases)  
  - **No** → **Leaf: Evaluative-Perception View**  
    - *Emotions are perceptions of evaluative properties (e.g., dangerousness), presenting illusions if inaccurate.*  
    - **Awkward for case (v):** Fear of a horror monster is a perceptual error, like seeing a stick as bent.  

  #### **Node 8: Can two emotions (e.g., dread and excitement) share identical evaluative content but differ only in action tendencies?**  
  - **Yes** → **Leaf: Action-Tendency-First View** (as above, with content secondary)  
  - **No** → *All views except Action-Tendency-First* (this node distinguishes that view; others deny it)  

  ---

  ### Summary of Leaves  
  1. **Pure Bodily-Feeling View:** Emotions = perceptions of bodily states.  
  2. **Action-Tendency-First View:** Emotions = dispositions to act.  
  3. **Deflationary View:** Emotions = heterogeneous, not a natural kind.  
  4. **Evaluative-Judgment View:** Emotions = judgments with propositional content.  
  5. **Attitude-First View:** Emotions = non-representational stances.  
  6. **Evaluative-Perception View:** Emotions = perceptions of value properties.  

  *(Note: The tree generates 6 leaves. Combinations like "emotions require objects and involve bodily feelings" are unoccupied—likely coherent but undesired, as theorists avoid hybridizing core features.)*  

  ---

  ### Key Distinctions and Independence  
  - **Primary distinction (wrongness type):** Node 7 separates "belief-like wrongness" (falsity) from "perception-like wrongness" (illusion). This is **not** a relabeling of the judgment/perception divide—it does independent work. For example, the attitude-first view denies both, and the perception view treats inaccuracy as non-propositional.  
  - **Secondary distinction (content vs. action):** Node 8 isolates whether action tendencies alone can differentiate emotions (action-tendency view) or not (others).  
  - **Treated as independent:** Object-directedness (Node 1/3/5), evaluative representation (Node 6), and wrongness type (Node 7) are **not fully independent**. For instance, objectless emotions (Node 3) avoid evaluative content questions, creating correlations. The tree assumes modularity for clarity, but in practice, commitments often cluster (e.g., judgment views typically require objects).  
  - **Unexplored combinations:** "Emotions lack objects but have truth-apt content" is incoherent (content requires an object). "Emotions have truth-apt content but no action links" is coherent but unoccupied—theorists tie judgments to motivation.  

  This tree uses 8 internal nodes and 6 leaves, fitting the constraints. Cases resolve ambiguities (e.g., Node 6 uses spider fear to force a stance on irrationality). Positions are sorted by case implications, not traditions. For unresolved overlaps (e.g., attitude-first vs. perception views on non-propositional content), Node 7’s "wrongness type" does not split them cleanly—both deny propositional falsity.
