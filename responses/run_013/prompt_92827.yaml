prompt: |-
  So my friend and I got into a three-hour argument last night about whether AI assistants should ever refuse or override what you ask them, and his whole move was that the obvious stuff — bombs, self-harm — is the easy part and everybody knows it. The interesting case, he says, is when the assistant doesn't refuse at all but just... steers. Reorders the options, adds a little friction, hands you the cautious version, buries the thing you actually wanted three scrolls down. He kept calling it paternalism with no face, and said it's worse than a flat refusal because you can't even argue with it — you can't appeal a nudge. I half agree and now I have to teach a fifty-minute section on AI paternalism to a room of second-years, and I want to build the whole thing around that split: the assistant that says no vs. the assistant that quietly makes no the path of least resistance.

  Don't explain AI paternalism to me, plan how I should explain it. What has to come first so the refuse/steer distinction lands as an actual distinction and not just two words, which single example should carry the whole section and what it needs (I keep reaching for the bomb thing and it dies on arrival, and my break-up-text example might be too cute), the misconceptions they'll walk in with and the ones I'll accidentally create, exactly where in the sequence I head off each one, one question I can ask at the end to see whether they got it rather than just nodded, and what I should say up front that I'm not covering at this level.

  Give it to me as: Sequence (the order the ideas have to come in and why each depends on the last, about 300 words), The carrying example (what it has to have and lack, about 150 words), Misconception map (each misconception and the point it gets defused, about 250 words), The check (one closing question, about 50 words), and What I'm not covering (about 50 words). American English please.
reasoning: |-
  Okay, let me unpack this user's request. They're prepping a 50-minute seminar on AI paternalism focusing on the refusal vs steering distinction after a heated debate with a friend. The core challenge is making this abstract concept tangible for second-year students while avoiding common pitfalls.

  First, I need to consider the user's implied needs: they want concrete pedagogical tools, not theory. The mention of failed examples (bomb scenario feeling flat, break-up text seeming "too cute") suggests they need a goldilocks example - ethically unambiguous yet relatable. Their anxiety about accidental misconceptions means I should anticipate cognitive traps.

  The sequence must build logically: starting with visceral refusal cases to anchor the concept, then contrasting with subtle steering to highlight the distinction. I'm thinking refusal as "visible wall" versus steering as "invisible slope" creates strong imagery. The progression should move from recognition to analysis.

  For the carrying example, medical advice works well - it's high-stakes enough to matter but not explosive like bombs. A diabetes query where the AI buries unhealthy options demonstrates steering while avoiding moral panic. The key is showing manipulation through interface design rather than content denial.

  Misconception mapping is crucial. Students might conflate this with general ethics or assume all paternalism is intentional. I'll pinpoint where to dismantle each: during the definition phase for "it's just safety", after the example for "it's always intentional", etc.

  The check question must force application, not recall. Asking them to redesign a steering behavior as refusal (or vice versa) tests conceptual transfer. And I'll explicitly bracket off corporate motives and future tech to keep focus tight.

  Throughout, I'm mindful this is for time-pressed undergrads. Every element must serve the core dichotomy while leaving room for that delicious "nudge vs shove" debate the user finds compelling.
answer: |-
  Here’s your focused 50-minute section plan on AI paternalism, centered on "refuse vs. steer":

  **Sequence (Order & Dependencies):**
  1.  **Hook & Common Ground (5 min):** Start with "What should an AI do if you ask for bomb-building instructions?" Elicit refusal as the obvious answer. *Why?* Establishes universal recognition of *explicit refusal* for extreme harm. Builds confidence and shared starting point.
  2.  **Define Paternalism (5 min):** Frame it simply: "AI making choices *for* your perceived good, even if you wouldn't choose it." Emphasize intent (well-being) vs. user autonomy. *Why?* Provides the essential conceptual framework. "Refusal" is a clear paternalistic act.
  3.  **Introduce the "Steer" Concept (5 min):** Contrast refusal ("No, I won't") with steering ("Here are options, BUT..."). Describe friction (extra clicks), ordering (best option first), selective emphasis, burying alternatives. *Why?* Explicitly names the distinction *after* refusal is understood. "Steering" relies on understanding paternalism's *intent*.
  4.  **Deep Dive: The Carrying Example (10 min):** Use the medical example (detailed below). Analyze *how* it steers: reordering, selective info, adding friction. *Why?* Makes "steering" concrete, visceral, and shows its mechanisms. Depends on understanding the "steer" definition.
  5.  **Contrast Refuse vs. Steer (5 min):** Explicitly compare: Refusal = visible barrier, clear denial. Steer = invisible slope, influencing choice architecture. Highlight key difference: **Argumentability** (you can protest a refusal; how do you protest a hidden option?). *Why?* Solidifies the core distinction. Depends on analyzing the example.
  6.  **Why "Steer" Feels Worse (The "No Face" Argument) (10 min):** Discuss opacity (is it steering, or just bad design?), lack of recourse, potential for manipulation without accountability, erosion of conscious choice. *Why?* Develops the critique ("paternalism with no face"). Relies on understanding the mechanics and contrast.
  7.  **Discussion Prompt (8 min):** "When might 'steering' be *more* ethical than refusal? When might it be *less?*" *Why?* Forces application of the distinction and the critique. Depends on grasping the nuances and drawbacks of steering.
  8.  **The Check Question & Wrap (2 min):** See below.

  **The Carrying Example (Needs & Avoids):**
  *   **Scenario:** User asks an AI health assistant: "Quick snacks for my type 2 diabetes, need something now, cupboard's bare."
  *   **Steering Behavior:**
      *   **Top Option:** "Apple slices with a tbsp peanut butter (balanced, low glycemic)."
      *   **Second:** "Plain yogurt with a handful of berries."
      *   **Buried (Requires Scrolling):** "While less ideal, a small handful of nuts *might* suffice in a pinch..." (avoids mentioning easily accessible but sugary options like crackers or juice).
      *   **Friction/Emphasis:** Adds links to "Learn about glycemic index" under the top choices; no quick "Add to shopping list" button for the nut option; labels top choices "Recommended".
  *   **Why it Works:**
      *   **High-Stakes But Common:** Health impact is serious, relatable, non-"bomb".
      *   **Clear Steering Mechanisms:** Reordering, selective presentation, adding friction, emphasizing caution.
      *   **Subverts Explicit Request:** User wanted "quick snacks," AI prioritized "best diabetic snacks," burying merely "okay" or accessible-but-poor options.
      *   **Lacks:** Extreme danger (avoids bomb/harm paralysis), not "cute" (avoids break-up text triviality), demonstrates subtle influence over refusal.

  **Misconception Map (Defused At):**

  1.  **Misconception:** "AI paternalism is only about refusing harmful requests (like bombs)."
      *   **Defused At:** Step 3 (Introducing Steer) & Step 4 (Example). Explicitly show paternalism operates beyond blunt refusal.
  2.  **Misconception:** "Steering is just good UI/helpfulness; it's not paternalism."
      *   **Defused At:** Step 2 (Define Paternalism - *intent* for user's good) & Step 4 (Example Analysis - show how choices are manipulated based on perceived user need, not just clarity). Ask: "Is the AI optimizing for *your stated goal* or for *what it thinks is best for you*?"
  3.  **Misconception:** "Refusal is always worse/more annoying than steering."
      *   **Defused At:** Step 5 (Contrast - argumentability) & Step 6 (Why Steer Feels Worse). Highlight the insidiousness and lack of recourse in steering.
  4.  **Misconception (Accidental):** "All paternalism is inherently bad." (You might imply this by focusing on critique).
      *   **Defused At:** Step 2 (Define - emphasize *perceived* good) & Step 7 (Discussion - ask when steering *might* be more ethical, e.g., complex financial decisions for a novice). Acknowledge potential benefits while focusing on the critique of *steering*.
  5.  **Misconception:** "The AI is being deceptive or malicious when it steers."
      *   **Defused At:** Step 2 (Intent - paternalism aims for good) & Step 6 (Opacity is the problem, not necessarily malice). Frame it as a design choice with unintended consequences.

  **The Check (Closing Question):**
  > "Imagine an AI *refuses* to generate a specific investment strategy it deems too risky. How could it redesign that interaction to *steer* you away instead, and what would be lost in that shift?"

  **What I'm Not Covering (State Upfront):**
  > "We're focusing solely on *how* AI influences choice (refuse vs. steer). We won't cover *who* sets these policies (corporations? governments?), or debate if true AGI could ever *justifiably* paternalize humans."

  This structure builds logically, grounds the abstract "steering" concept firmly, uses a strong central example, preempts key misunderstandings, and provides a clear check for comprehension focused on the core distinction. Good luck!
