answer: |-
  **Exam Question**  
  A circle of radius 1 has a rectangle inscribed within it. The rectangle’s orientation and proportions are arbitrary (from a sliver to a square). Suppose a rectangle is selected "at random" from all possible such rectangles. What is the probability that its area exceeds 1?  

  Consider two approaches:  
  1. **Angle Method:** Parameterize the rectangle by the acute angle θ between its diagonals, uniformly distributed over [0, π/2).  
  2. **Side Method:** Parameterize the rectangle by the length *s* of its shorter side, uniformly distributed over (0, √2].  

  Using the Angle Method, the probability is 2/3. Using the Side Method, it is approximately 0.63. Discuss whether these conflicting results invalidate the Principle of Indifference. Is one parameterization objectively "natural" (e.g., due to the circle’s rotational symmetry)? Does appealing to symmetry resolve the paradox, or does it presuppose the very assumption it claims to justify?  

  *(Calculations are provided; focus on interpretation.)*  

  ---

  **Model Answer**  
  The paradox arises because two seemingly reasonable applications of the Principle of Indifference—which states that equal knowledge justifies equal probabilities—yield different probabilities (2/3 vs. ~0.63) for the same event: that a randomly selected inscribed rectangle has area >1. To resolve this, we must examine whether one parameterization (θ or *s*) is privileged.  

  The Angle Method uses θ (angle between diagonals) uniformly on [0, π/2). For a circle of radius 1, area depends on θ as \( A = 4 \sin\theta \cos\theta = 2 \sin 2\theta \). Area >1 simplifies to \( \sin 2\theta > 1/2 \), which holds for θ in (π/12, 5π/12), giving probability \( \frac{5\pi/12 - \pi/12}{\pi/2 - 0} = \frac{\pi/3}{\pi/2} = \frac{2}{3} \).  

  The Side Method uses *s* (shorter side) uniformly on (0, √2]. The longer side *l* satisfies \( s^2 + l^2 = 4 \) (diagonals are diameters), so \( l = \sqrt{4 - s^2} \). Area is \( s \sqrt{4 - s^2} \). Setting this >1 and solving numerically (e.g., \( s \sqrt{4 - s^2} > 1 \) for *s* > ~0.732) gives probability ≈0.63.  

  Both methods seem "natural": θ leverages rotational symmetry, while *s* directly measures a geometric feature. Proponents of θ argue that rotational symmetry demands uniform measure over orientations (hence uniform θ). But this is circular: symmetry is invoked to justify θ’s uniformity, yet symmetry is only probabilistically meaningful *if* we assume indifference over orientations. The circle *does* have rotational symmetry, but this symmetry does not inherently specify how to distribute probability over rectangles—it only tells us rotations preserve area. Indifference over θ *imposes* uniformity on orientations, but we could equally impose uniformity on side lengths. Neither choice is dictated by the physical setup alone; both are modeling decisions.  

  Is θ privileged? Only if we presuppose that symmetry requires indifference over spatial parameters like angle. But the Side Method is equally coherent: shorter side length is a valid invariant, and indifference over *s* is mathematically sound. Crucially, a uniform density in θ induces a non-uniform density in *s* (and vice versa), because the relationship \( s = \sqrt{2} \sin 2\theta \) is nonlinear. Thus, "uniform" means different things in different spaces, and the Principle of Indifference offers no guidance on which space to use.  

  This suggests the paradox persists: no unique probability exists without additional constraints. Defending 2/3 requires arguing that rotational symmetry *should* extend to probabilistic invariance, making θ the "natural" parameter. But this argument risks conflating geometric symmetry with probabilistic uniformity—a conflation the paradox exposes. If we demand that equivalent states (here, rotated rectangles) have equal probability, θ’s uniformity follows. Yet "equivalent states" must be defined *before* applying indifference, and defining them by rotation already biases toward angular parameters. The Side Method, by contrast, groups rectangles by side length, ignoring orientation—a different but equally valid equivalence.  

  Ultimately, the Principle of Indifference fails here because it cannot distinguish between parameterizations. The circle’s symmetry does not resolve the ambiguity; it merely offers one defensible choice among many. A deeper principle—like requiring probabilities to be invariant under symmetry transformations—might salvage 2/3, but this invokes a meta-indifference over symmetries itself. Without such a principle, both answers are valid relative to their parameterizations, exposing the subjectivity in "random" selection.  

  ---

  **Marking Scheme (Total: 20 points)**  
  An **A answer (17–20)** must:  
  - **Correctly restate the paradox (2 pts).** Common flaw: Vaguely noting "different answers" without specifying methods/numbers.  
  - **Explain both methods clearly (4 pts).** Common flaw: Misstating how area depends on θ or *s*, or misreporting probabilities.  
  - **Analyze why rotational symmetry favors θ but isn’t decisive (5 pts).** Common flaw: Asserting symmetry "fixes" θ without examining the assumption.  
  - **Argue neither parameterization is inherently privileged (4 pts).** Common flaw: Claiming θ is "obviously" correct because of the circle.  
  - **Conclude that indifference fails without supplemental principles (5 pts).** Common flaw: Suggesting practical fixes (e.g., averaging) without epistemological critique.  

  A **B answer (13–16)** may:  
  - Describe the paradox and both methods but with minor errors.  
  - Recognize symmetry’s role but not its circularity.  
  - Suggest one parameterization is better without substantive justification.  
  - State indifference is problematic but not why symmetry doesn’t rescue it.  

  *(Lower scores omit key arguments or contain significant inaccuracies.)*  

  ---  
  **Rationale for Choices**  
  - Both probabilities are provided to focus on interpretation (calculations distract under time pressure).  
  - The model answer avoids attribution/history to meet exam constraints.  
  - The marking scheme prioritizes critical engagement with symmetry and parameterization, as this is the novel core.
