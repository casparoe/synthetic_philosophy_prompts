answer: |-
  ## Dialogue: The Nature of Seeing

  **Characters:**
  *   **Diana:** A Disjunctivist (Metaphysical Claim)
  *   **Robert:** A Representationalist

  **Setting:** A university common room, late afternoon.

  **(The dialogue begins mid-conversation about perception)**

  **Diana:** ...precisely why the argument from illusion, Robert, fundamentally mischaracterizes the situation. It assumes a common kind of state underlying both veridical perception and hallucination, when in fact, no such common kind exists.

  **Robert:** And I maintain that’s precisely where you go wrong, Diana. The argument from illusion, especially in its purest form without invoking hallucination, demonstrates the need for a common element – the representational content. Take our first case: the uniformly white wall under the sodium lamp. The observer knows it’s white, knows the light is yellow, and doesn’t believe it’s yellow. Yet, undeniably, *it looks yellow to her*. What is she aware *of*, if not something yellow?

  **Diana:** She is aware *that* the wall looks a certain way under these lighting conditions. But she is not aware *of* a yellow property instantiated in the world. The phenomenal character of her experience – its yellowness – is not a property presented *to her* as belonging to the wall itself, in the way it would be if she saw a genuinely yellow wall in daylight. In genuine perception, the phenomenal character is constituted, at least in part, by the actual, mind-independent objects and their properties. Here, the phenomenal character arises from the interaction of the white wall, the sodium light, and her visual system. It’s an illusion *because* the wall isn’t yellow, but the experience itself is still a relation to the actual wall and its actual whiteness, albeit mediated by tricky light.

  **Robert:** But you just admitted the experience *has* a phenomenal character of yellowness. The wall *looks* yellow. The representationalist says: for it to look yellow, the experience must represent the wall *as* yellow. That’s what ‘looks yellow’ *means*. The representational content is ‘yellow wall’. This content is present whether the wall *is* yellow or not. In this case, it’s inaccurate. But the *state* – the subject being presented with the world *as containing a yellow wall* – is the same fundamental kind of state as when she sees a genuinely yellow wall.

  **Diana:** That’s the leap I reject. You move from “it looks yellow” to “she is in a state with the content ‘yellow wall’”. But “looks yellow” describes the subjective character, not necessarily a representational content directed at the world. In the veridical case, seeing a yellow wall, the yellowness is presented *as a property of the object I’m related to*. In the illusion, the yellowness is a feature *of the experience itself*, caused by the interaction, not a property falsely attributed to the wall *in the same direct way*. The subject *knows* the yellowness isn’t out there. Her experience isn’t telling her ‘there’s a yellow wall’; it’s presenting a scene suffused with yellow light, which her knowledge interprets correctly. The ‘looks’ is descriptive of appearance, not necessarily constitutive of a representational claim *about* the object’s intrinsic colour.

  **Robert:** Interesting distinction, but I find it unstable. If the subject weren’t told about the light, wouldn’t she naturally take the wall *to be* yellow? Doesn’t that show the experience intrinsically presents the world *as being that way*? Her background knowledge overrides it, but the *presentational character* is still ‘yellow wall’. That’s why an uninformed observer *would* form the false belief. The representational content is primary; belief formation is secondary, based on that content and other factors. Denying the content leads to a mystery: what *is* the subject experiencing that makes her say “it looks yellow”? It must be *something yellow-like* in her awareness.

  **Diana:** She’s experiencing a visual state caused by the white wall under sodium light. That state has an intrinsic phenomenal character we describe as ‘yellow-ish’. But crucially, she is *visually related to the white wall*. That’s the metaphysical difference. The fundamental kind of state she’s in is *seeing a white wall under sodium light*. The phenomenal yellowness is a feature *of that relational state*, caused by the specific interaction. It’s not a representation *of* yellowness floating free; it’s an aspect of perceiving *this* object under *these* conditions. What she can know by looking? She can know the wall’s shape, texture, location – properties unaffected by the light. She can know *that* the lighting makes it appear yellow. But she cannot know, solely by looking at the wall under this light, *that it is white* – that requires background knowledge or changing the conditions. The looking gives her defeasible knowledge of the object and *some* of its properties, but the colour property presented isn’t veridical in this instance.

  **Robert:** I concede that background knowledge is crucial for *judging* the veridicality of the colour property in this case. But the core phenomenal character – the yellowness – seems identical whether she knows it’s an illusion or not. Doesn’t that suggest the representational core is the same? Anyway, let’s move to my stronger challenge: the second case. The subject with the electrode array driven by the recording. She has an experience subjectively indistinguishable from seeing a red square. And, as luck would have it, there *is* a red square there. On your view, what fundamental kind of state is she in?

  **Diana:** She is in a state of *hallucination* or, more precisely, *artificial stimulation causing an experience indistinguishable from perception*. It’s not a perception at all. She is not visually related to the red square. The electrode array is stimulating her visual cortex based on a recording, bypassing the normal causal chain involving light and the object. The fact that there happens to be a matching red square is entirely coincidental and causally irrelevant to her experience.

  **Robert:** But the experience is subjectively indistinguishable from a veridical perception! It *seems* to her exactly as if there’s a red square in front of her. If two episodes are subjectively indistinguishable, how can they be fundamentally different kinds of states? What explains the *sameness* of how it seems, if the underlying metaphysics is utterly different? If the fundamental kind determines the phenomenal character, shouldn’t different kinds feel different?

  **Diana:** Not necessarily. Subjective indistinguishability is an *epistemological* fact about the subject’s inability to tell them apart from the inside. It doesn’t entail an *ontological* sameness of the states. Think of it like identical twins. They look indistinguishable to an outsider, but they are distinct individuals with different causal histories and identities. The phenomenal character in the hallucinatory case is generated *internally* (or via artificial stimulation), mimicking the character that, in the veridical case, is constituted by the relation to the external object. The *what it’s like* can be the same without the *what it is* being the same. The explanation for the sameness is that the brain states (or their functional equivalents) driving the experience are type-identical, producing the same internal show. But the veridical perception has an essential extra component: the object itself constitutively involved.

  **Robert:** But what *work* does this "essential extra component" – the actual object being there – do *in the experience itself*? Consider her reports: "I see a red square." Her movements: she reaches out towards the square’s apparent location. Her subsequent behavior: she avoids walking into the space where the square seems to be. All of this is *perfectly* explained by the intrinsic features of her representational state – the content ‘red square here now’. The external object, on your view, seems like a metaphysical appendage. It adds nothing to the explanation of *why she has the experience she has* or *why she behaves as she does* in that moment. The internal state, whether caused by light or electrodes, is sufficient.

  **Diana:** You’re right that the *internal* state is sufficient to explain the *behavior* and the *report* in that isolated moment. The relational fact doesn't causally explain those immediate outputs. Where it matters profoundly is in grounding the *intentionality* and enabling *demonstrative thought*. In the veridical case, when I see a red square, I can think *‘that* square is red’, directly referring to the object itself. My experience puts me in cognitive contact with *that very thing*. In the hallucinatory case, even if indistinguishable, there is *no ‘that’*. Any attempt to think ‘that square’ fails; there’s nothing to latch onto. The relational fact enables genuine singular thought about the object. It also anchors the possibility of *knowledge by acquaintance* – not just knowledge *that*, but knowledge *of* the object itself. Furthermore, over time, only the relational state provides a consistent, reliable link to the world that allows for learning and non-accidental success. The coincidence in this specific case doesn’t change the fundamental nature of the state she’s in.

  **Robert:** I’ll grant you the demonstrative thought point is challenging for pure internalist representationalism; we might need to add a causal or contextual element for successful reference. But on knowledge: can she know, *by the use of her eyes* (or the prosthetic system), that there is a red square in front of her? On my view: Yes. She has a veridical representational state caused by the array input, which itself reliably correlates with the world (in this specific instance). She forms the belief based on that state, and it matches the world. That’s perceptual knowledge, even if mediated. On your view?

  **Diana:** Absolutely not. She *cannot* know it by the use of her eyes or this prosthetic system *in this scenario*. Why? Because her visual system is *not* functioning as a perceptual system linked to the world at that moment. It’s being fed a recording. She has a true belief, but it’s not *perceptual* knowledge; it’s accidentally true belief caused by artificial stimulation. She has no more perceptual justification for believing there’s a red square than someone who hallucinates a square and coincidentally there is one. Knowledge requires appropriate causation and reliability, not just a match. The system, *in its current mode of operation*, is not operating as a perceptual link to the environment; it’s playing back a tape. Therefore, she gains no perceptual warrant, even if she happens to be right.

  **Robert:** Hmm. That seems overly restrictive. She’s using a sensory system receiving information that matches the world. But let me press you further, invoking your last requirement. Consider the person who "sees" via a camera feeding signals to a tactile array on her tongue. She learns to interpret the patterns as representing the spatial layout of the room. She navigates successfully, identifies objects. Is she *perceiving* the room? On my representationalist view, yes, unequivocally. The world is being represented to her via this sensory modality, causing appropriate beliefs and actions. The representational content is the key. What about on disjunctivism?

  **Diana:** This is crucial. On my view, this is *not* genuine perception. It’s the reception of *information* about the world via a sensory channel, leading to reliable belief formation. But she is not *perceptually related* to the objects in the room. She is related to the tactile sensations on her tongue, which carry information. Genuine perception involves a constitutive causal link where the object itself (or its properties, via light/sound/etc.) figures directly in the production of the experience in a way that enables direct awareness *of that object*. The tongue system provides a model of the world; it doesn’t put her in contact *with the world itself* in the way vision or touch normally does. She knows *that* there’s a chair, but she doesn’t *see* or *feel* the chair; she feels patterns on her tongue that signify a chair. The difference is the *directness* and *constitutive* nature of the relation. Perception provides direct awareness; sensory substitution provides mediated information. Both can be reliable, but only perception grounds the kind of demonstrative thought and acquaintance I mentioned earlier.

  **Robert:** So the core difference sharpens. For you, Diana, genuine perception requires a specific kind of constitutive causal relation that makes the object itself a constituent of the perceptual state, enabling direct awareness and singular reference. This relation is absent in hallucination, illusion (in its pure relational form, though you argued the sodium case is still relational), and sensory substitution. The phenomenal similarity is explained by internal state similarity, but the metaphysics differ fundamentally. The explanatory work of the relation is in grounding intentionality and direct knowledge, not necessarily immediate behavior. For me, perception *is* representation. The fundamental state is the subject being in a representational state with a certain content. This state can be caused by the world (veridical), caused differently (illusion/hallucination), or caused via novel transducers (sensory substitution). What matters is the structure of the representation and its causal role in cognition. The ‘relation’ you emphasize is just one possible *cause* of the representational state, not constitutive of its nature. The phenomenal character supervenes on the representational content and the functional role.

  **Diana:** Precisely. You reduce perception to a type of internal representation that could, in principle, occur in a vat. I see perception as an irreducibly relational achievement – a successful cognitive contact with mind-independent reality. The sodium lamp case is relational but misleading; the electrode case only mimics relationality; the tongue case isn't relational in the required way at all. The fact that internal states can duplicate the appearance doesn’t make them the same *kind* of state as the successful relation. The argument from illusion mistakes a similarity in appearance for a sameness in essence.

  **Robert:** And I maintain that your insistence on the constitutive relation is unmotivated metaphysics. The argument from illusion shows that the core explanandum – the subjective character and its role in guiding action and belief – is fully accounted for by the representational state. Adding an external object as a constituent might satisfy a philosophical intuition about ‘directness’, but it doesn’t add explanatory power to the phenomenology or the functional profile, and it makes perception mysteriously different from states that are subjectively identical. The tongue case highlights this: a functionally equivalent system that provides spatial awareness should count as perception. Your relational requirement seems arbitrary.

  **Diana:** And your representational state seems like a shadow play, disconnected from the reality it purports to be about. We agree on the phenomena – illusions happen, hallucinations happen, veridical perceptions happen. We agree on the epistemology – subjects often can't tell them apart. But we fundamentally disagree on the *metaphysics of what experience is*. For you, it's fundamentally internal representation. For me, veridical perception is fundamentally a relation to the world; non-veridical states are imposters, mimicking the internal show but lacking the constitutive link. The divide is about the essential nature of perceptual consciousness itself.

  **Robert:** Agreed. And I suspect we’ve reached the bedrock. Shall we get some coffee? I believe there’s a white wall down the corridor... though I wonder what colour it looks under these fluorescents.

  **Diana:** (Smiling wryly) Lead on. But I’ll be perceiving *that* coffee cup, Robert. Not just representing it.

  **(They walk out, the fundamental disagreement unresolved but sharply defined: the nature of the perceptual state itself – internal representation vs. constitutive external relation.)**
