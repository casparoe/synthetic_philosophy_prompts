prompt: |-
  You are a philosopher who works on consequentialism and decision theory and who regularly advises students on where to spend limited time; you're known for saying plainly which questions are worth a person's semester and which aren't.

  I'm a high school senior designing an independent-study project in philosophy. I have one semester, roughly eight hours a week, and one philosophy professor who will meet with me monthly. I read quickly, but I have no training in economics or formal decision theory. I've gotten interested in the problem of cluelessness — the worry that for most large life choices the long-run consequences are so tangled that any confident claim about which option is better is unwarranted, so it's unclear whether consequentialist reasoning can guide action at all.

  Two distinctions occurred to me, and whether they're real changes what I'd work on.

  First, I want to separate cluelessness that more research could in principle dissolve — consequences that are hard to trace but traceable — from cases where the needed comparison is a world history that never happened, so no evidence could ever bear on it. I've been calling the second one counterfactual cluelessness.

  Second, I think there's a version of the problem that runs backward: not "what will this cause" but "were the things that already happened to me good," where the same tracing problem infects the evaluation of a life already lived. Call that backward cluelessness.

  Think it through before answering. Then give me a defended agenda: given my constraints, which two or three open questions in this area should I actually work on, and in what order? I want the reasoning more than the list — which questions are upstream of which, which ones someone with a semester and no formal tools can genuinely move, which look important but would amount to re-deriving a point that's already settled, and what I'd have to learn or discover for the ordering to change. If one of my two distinctions is confused, or is a familiar distinction wearing a worse name, say so plainly and reorder the agenda accordingly. Finish by telling me which questions I should deliberately leave alone.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, and don't restate my question.
reasoning: |-
  Hmm, the user is a high school senior designing an independent study project on the philosophical problem of cluelessness in consequentialism. They've identified two distinctions: counterfactual cluelessness (where we can't know what would have happened in an alternate scenario) and backward cluelessness (where we can't evaluate past events due to complex causal chains). They want me to create a focused agenda for their semester-long project.

  The user is clearly bright and motivated but lacks formal training in economics or decision theory. They have about eight hours per week and monthly mentorship from a professor. They want to know which open questions are worth tackling given their constraints, and which ones they should avoid.

  Looking at their distinctions, counterfactual cluelessness seems valid and indeed central to the literature - it's what philosophers like Greaves or Lenman discuss regarding unknowable long-term consequences. Backward cluelessness feels less like a distinct problem and more like an application of the same epistemic challenge to past evaluation. It's not fundamentally new, but it could be an interesting angle for their project.

  For their agenda, I should prioritize questions where: 1) They can make progress without formal tools, 2) The issues are upstream (foundational), 3) They won't just be rehashing settled debates, and 4) They can actually produce meaningful work in one semester.

  The most promising avenues seem to be: First, examining what makes counterfactuals fundamentally unknowable versus merely empirically difficult - this gets to the heart of why cluelessness might be unavoidable. Second, exploring how consequentialists can salvage decision-making despite cluelessness - perhaps through heuristics or second-order strategies. Third, testing whether their backward cluelessness concept holds up under scrutiny when applied to real-life examples.

  They should avoid: Deep dives into probability theory, attempts to quantify consequences, or engagements with highly technical decision theory frameworks - these would require more time and math than they have. Also not worth chasing is the question of whether cluelessness disproves consequentialism entirely - that's been well-trodden ground.

  The key is to keep them focused on conceptual analysis rather than formal modeling, leveraging their ability to think clearly about examples and philosophical arguments. With monthly professorial guidance, they should be able to make solid progress on these targeted questions.
answer: |-
  **Focus your semester on distinguishing empirical from counterfactual cluelessness and exploring practical responses; leave backward cluelessness aside as derivative.** Here’s the defended agenda and reasoning:

  1.  **First Priority: Clarify the boundary between *empirically resolvable* and *fundamentally counterfactual* cluelessness.**
      *   **Why upstream:** This distinction underpins the severity of the problem. If most cluelessness is empirical (more data/research *could* help), consequentialism retains a practical path (invest in better forecasting). If it's often fundamentally counterfactual (no possible evidence for the relevant comparison), core consequentialist guidance collapses for major choices. Your "counterfactual cluelessness" term is apt and central.
      *   **Why feasible:** Requires conceptual analysis of causation, evidence, and modal epistemology, not formal tools. Read key texts (e.g., Hilary Greaves on cluelessness, Derek Parfit on "mistakes in moral mathematics," work on causation by Lewis/Schaffer). Analyze real-world examples (e.g., career choice A vs. B: what evidence *could* exist for long-term ripple effects? What comparisons are inherently untestable?). Your goal: Articulate clear criteria for when a consequence comparison is *in principle* evidentially inaccessible.
      *   **Move needed to change:** Discovering that formal decision/game theory provides a definitive framework for handling these counterfactuals (it doesn't; it often assumes them away).

  2.  **Second Priority: Investigate whether *bounded* consequentialist responses can function despite counterfactual cluelessness.**
      *   **Why next:** Once you establish counterfactual cluelessness is a real barrier, the urgent question is "What now?" Can consequentialism adapt? This is where action-guidance lives.
      *   **Why feasible:** Focuses on practical reasoning strategies. Examine proposals like:
          *   **Rule/Indirect Consequentialism:** Do rules/heuristics (e.g., "Be kind," "Promote near-term welfare") reliably approximate best outcomes *despite* long-run cluelessness? Critique using your findings from Priority 1.
          *   **Focus on Expected Value with Tractable Impacts:** Can we justify ignoring the untraceably long-run and focus on near/mid-term expected consequences we *can* model? What justifies the cutoff?
          *   **"Second-Best" Consequentialism:** Is choosing actions known to avoid *catastrophic* long-term risks (even if unknowably suboptimal) a viable response? (e.g., Bostrom's "vulnerable world hypothesis").
      *   **Requires:** Engaging critiques (e.g., Williams' integrity objection, demandingness) and defenses (e.g., Hooker, Railton). Analyze if these responses genuinely evade the counterfactual trap or just mask it.
      *   **Move needed to change:** If Priority 1 reveals counterfactual cluelessness is vanishingly rare, making bounded responses unnecessary (unlikely).

  3.  **(Conditional Third): Test if "backward cluelessness" reveals a distinct problem in *evaluative* (not just action-guiding) consequentialism.**
      *   **Why last (and conditional):** Your "backward cluelessness" isn't fundamentally *new*; it applies the *same* epistemic problem (inability to trace consequences) to past evaluation. Its distinctness hinges on whether evaluation introduces unique issues beyond the tracing problem itself.
      *   **Why potentially feasible:** Explore if evaluating a *fixed* past life highlights different aspects. Does the *finality* of the past make the unknowability of alternatives more salient/painful? Does it challenge the *meaning* of calling a life "good"? Read work on moral luck (Nagel/Williams) and regret.
      *   **Focus:** Use vivid examples (e.g., "Was my becoming a doctor rather than an artist ultimately good?"). Does the impossibility of knowing the counterfactual history undermine the *truth* of the evaluation or just our *confidence* in it?
      *   **Move to Skip:** If Priority 1/2 consume time, or if analysis confirms it's simply the same epistemic problem applied retrospectively without generating new insights for action-guidance (the core challenge). Only pursue if initial work reveals a novel evaluative puzzle.

  **Deliberately leave alone:**
  1.  **Formal Decision Theory Proofs:** Attempts to "solve" cluelessness via complex probability models, infinite ethics, or Savage-style frameworks require the math/econ training you lack. You'd spend the semester learning basics, not advancing your core question.
  2.  **Quantifying Long-Term Impacts:** Projects trying to *actually trace* consequences (e.g., modeling butterfly effects of career choices) are empirically intractable within your timeframe and miss the *conceptual* point about counterfactual inaccessibility.
  3.  **The "Does Cluelessness Refute Consequentialism?" Debate:** This is well-trodden ground (Lenman, Greaves, etc.). Your distinction (Priority 1) sharpens the *nature* of the threat, but rehashing the existential debate is less productive than exploring *responses* (Priority 2).
  4.  **Deep Metaphysics of Causation:** While causation matters, avoid getting bogged down in debates over Humean vs. non-Humean causation. Focus on the *epistemic access* to causal chains relevant for comparison, not the fundamental ontology.

  **Bottom Line Order:** 1. Distinguish Empirical/Counterfactual Cluelessness (Core Conceptual) -> 2. Explore Bounded Consequentialist Responses (Practical Application) -> (3. If Time/Novelty: Evaluate Backward Cluelessness as Distinct). This uses your strengths (conceptual analysis, reading speed) on the most upstream and action-relevant aspects, avoiding formal or settled dead-ends.
