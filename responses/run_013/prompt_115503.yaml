prompt: |-
  I'm in the final year of a philosophy degree and I'm currently taking a course on knowledge, skill and action, most of which has been spent on the dispute over whether knowing how to do something is a species of propositional knowledge or something else altogether. I have to pick a topic for a 6,000-word term paper, and I'd like that paper to do double duty as the seed of a research proposal I'll be writing over the summer, so the choice matters to me more than an ordinary essay title would. My constraints are roughly these: one term of about ten weeks, a supervisor who works on epistemology, no possibility of collecting data of my own, and a project that has to be doable from a desk with a library.

  Two things about the literature leave me unsure where the live questions actually are. First, the examples are almost always the same ones — riding a bicycle, swimming, playing chess — and I'd like you to take seriously the possibility that this narrow diet of examples has distorted the debate. Consider what happens if the central cases are instead kinds of know-how whose content looks fully articulable, such as knowing how to run a particular statistical test correctly, knowing how to construct a proof by induction, or knowing how to work through a surgical checklist; or kinds of know-how that are governed by explicit protocols and transmitted by instruction rather than by imitation. Second, it isn't clear to me that the dispute is about one thing at all: ability, disposition, tacit understanding, skill, reliability, and practical modes of presentation appear to be doing quite different work in different contributions, and I suspect that some apparent disagreements are disagreements about what the term is being used for. I am also unsure whether the debate has anything useful to say about artificial systems that can both produce fluent instructions for a task and perform the task, but where neither capacity tells us much about what is going on inside them — whether that belongs on the agenda or is a distraction is part of what I'm asking you to judge.

  What I want is an agenda rather than a survey: an ordered set of the open questions in this area that someone in my position ought to work on, with the ordering defended. For each candidate, say what the question is, why it is upstream of other work in the area rather than downstream of it, how tractable it is for a person working alone from the armchair, and what would move it up or down the list. Then tell me which questions I should leave alone, and why — including any that look central but whose resolution would not change much else. Please say explicitly whether your ranking would shift if the cases I raised in the previous paragraph were treated as the central ones rather than as curiosities at the margin; if the ranking is robust to that, say so and explain why.

  I'd like the answer in British English. I am not asking for a reading list or citations — I can find the literature myself, and I would rather have your reasoning than a bibliography. Finally, please be careful to distinguish what is settled in this area from what is genuinely contested among people who work on it: where a claim is a live disagreement, mark it as such rather than presenting it as the consensus, and where you are giving me your own judgement rather than reporting the state of the field, flag that too.
reasoning: |-
  Okay, let me unpack this philosophy student's request. They're in the final year studying knowledge, skill and action, needing a term paper topic that doubles as a research proposal seed. The constraints are clear: desk-based work, no original data collection, epistemology-focused supervisor. 

  Hmm, the student raises two sharp concerns about the know-how debate. First, the overreliance on stereotypical examples (bike-riding etc.) might skew the discussion - they want to explore cases like statistical procedures or surgical checklists where know-how seems more articulable. Second, they suspect the debate conflates distinct concepts like ability vs tacit knowledge. There's also that intriguing AI angle about systems that can both instruct and perform without internal transparency.

  Right, they're not after a literature survey but a strategic agenda: which open questions should be prioritised, why they're foundational, and how feasible they are for solo armchair work. Crucially, they want to know if shifting focus to their preferred examples would change this priority list.

  *scratches head* The real challenge here is mapping the conceptual landscape while honouring their constraints. Need to identify leverage points where re-examining "articulable know-how" could reveal something fundamental. Should avoid dead-end debates where positions are entrenched without theoretical payoff. 

  *steeples fingers* Three candidate questions emerge strongly: 
  First, the "articulability threshold" - where does know-how become reducible to propositional knowledge? This seems upstream because it tests the core intellectualist claim. Tractability is good - just need to analyse existing protocols. 
  Second, disentangling the "success conditions" - is know-how about ability, or reliability, or something else? Vital because current conflations poison the debate. 
  Third, the "mode of presentation" puzzle - could practical and propositional knowledge share content but differ in cognitive access? Explains why some know-how resists articulation.

  *checks notes* Must flag where I'm interpreting vs reporting consensus. For instance, the Rylean/Intellectualist split is live debate, but the AI point is more speculative. The example shift actually strengthens these questions - protocols make articulability measurable, while AI forces clarity on success conditions.

  *hesitates* Should explicitly warn off over-mined topics like "knowledge-that vs knowledge-how" definition swaps, and tired skill acquisition debates. Also, the neuroscience turn is beyond their desk-bound remit. 

  Final call: The articulability threshold question is the sweet spot - foundational, tractable, and transformed by their statistical/surgical examples. Plus it sets up nicely for a research proposal on normative domains.
answer: |-
  Here is a prioritised agenda of open questions in the know-how debate, tailored to your constraints and concerns. The ordering is based on **foundational significance**, **tractability for desk-based research**, and **potential to reframe the debate** using your preferred examples. Crucially, this agenda treats your cases (statistical tests, proofs, checklists) not as marginal but as central to testing claims.

  ### Core Principles for Ordering
  1.  **Upstream vs. Downstream:** Upstream questions concern conceptual foundations, definitions, and the *scope* of the phenomenon. Downstream questions apply settled frameworks to specific cases or address implications. You need upstream work.
  2.  **Tractability:** Questions must be addressable through conceptual analysis, existing literature critique, and examination of *documented practices* (protocols, manuals, training materials) – no new data required.
  3.  **Leverage:** Does resolving this question significantly clarify or dissolve apparent disagreements elsewhere? Does it force a reassessment of core assumptions?
  4.  **Robustness to Case-Shift:** How does the question's importance or nature change if articulable, protocol-driven know-how is central? (Spoiler: It makes most questions *more* urgent and revealing).

  ---

  ### The Prioritised Agenda

  1.  **Question: What are the *necessary and sufficient success conditions* for attributing know-how, and how do these conditions relate to *ability*, *reliability*, and *understanding*?**
      *   **Why Upstream?** The entire debate (Intellectualist vs. Anti-Intellectualist/Rylean) hinges on what constitutes *successful* know-how. Is it merely ability to perform (Ryle)? Reliable success (Stanley & Williamson)? Possession of state-guided-by-understanding (Bengson & Moffett)? Conflation here underlies apparent disagreements. Clarifying success conditions forces precision on *what phenomenon* we're debating.
      *   **Tractability:** Ideal for armchair work. Analyse definitions and counterexamples in key texts (Ryle, Stanley & Williamson, Hawley, Pavese, Bengson & Moffett, Cath, Fridland). Crucially, test these definitions rigorously against your central cases:
          *   Can a surgeon *reliably* perform a procedure using a checklist *without* understanding *why* steps are ordered as they are? Do they have know-how?
          *   Can a statistician run a test flawlessly via rote instruction *without* grasping the underlying assumptions? Do they have know-how?
          *   Does constructing a proof by induction require *only* applying syntactic rules, or is semantic understanding essential for true know-how?
      *   **What Moves It:** Recognition that "ability" is ambiguous (physical capacity? reliable success? capacity-under-instruction?) and that "reliability" is domain-sensitive. Your cases expose these ambiguities starkly.
      *   **Robustness to Case-Shift:** **Crucially Enhanced.** Protocol-driven cases make "reliability" measurable but also highlight the potential disconnect between reliable performance and understanding. They force the question: *Is know-how fundamentally about reliable output, or does it require a specific kind of cognitive grounding?* (This is a **live disagreement** – e.g., Stanley's intellectualism focuses on reliable guidance by propositional knowledge; Fridland emphasises control structures; Bengson & Moffett demand understanding).

  2.  **Question: Does *articulability* mark a fundamental distinction *within* know-how, or is it merely an epiphenomenon of the mode of acquisition/expression? What is the relationship between articulability and *cognitive integration*?**
      *   **Why Upstream?** The standard debate often assumes a dichotomy: either know-how is propositional (hence articulable *in principle*) or it's non-propositional tacit skill. Your cases challenge this. Highly articulable know-how (proofs, checklists, stats tests) *looks* propositional, yet it often retains a crucial practical component – knowing *how to apply* the propositions contextually, avoiding misapplication. This questions whether "propositional" captures the cognitive state involved *even when articulation is possible*. It probes the nature of the "practical mode of presentation" (Stanley & Williamson) or "practical understanding" (Bengson & Moffett).
      *   **Tractability:** Analyse philosophical arguments about articulation (e.g., Stanley & Williamson vs. Noë; Snowdon; Small). Examine real-world protocols, instruction manuals, and training methods for your central cases. How is the knowledge structured? What is explicitly stated vs. assumed? Where do common errors occur (revealing gaps between articulated rules and practical competence)? Conceptual work on cognitive integration (e.g., Clark's "surfing uncertainty", or literature on expertise) is relevant.
      *   **What Moves It:** Demonstrating that even in maximally articulable domains, successful know-how involves more than just *recalling* propositions – it involves knowing *when* and *how* to deploy them appropriately, a skill potentially irreducible to further propositions. This challenges strong Intellectualism.
      *   **Robustness to Case-Shift:** **Central & Defining.** Your cases are *the* place to test the boundaries of articulability and its relationship to genuine know-how. Does mastering a checklist require know-*that* about the steps, or a distinct know-*how* to *implement* them fluidly in a dynamic context? This **remains live**: Intellectualists argue the implementation *is* guided by further propositional knowledge; Anti-intellectualists argue it's a distinct practical capacity.

  3.  **Question: What is the relationship between know-how and *normative competence* (knowing *how things should be done* within a domain)? Does know-how necessarily involve responsiveness to normative reasons?**
      *   **Why Upstream?** Much know-how (especially your cases) operates within rule-governed domains with standards of correctness (mathematical proof, surgical safety, statistical validity). Is know-how merely the capacity to produce the *correct outcome*, or does it inherently involve sensitivity to the *reasons why* that outcome is correct/appropriate? This cuts across the propositional/practical divide. It probes whether know-how is merely instrumental or has a normative dimension essential to its identity.
      *   **Tractability:** Analyse philosophical arguments linking know-how, normativity, and reasons (e.g., Setiya, Habgood-Coote, Kremer). Examine how protocols *justify* steps – do they appeal to underlying principles (stats), logical rules (proofs), or safety outcomes (surgery)? Does following a protocol *mindlessly* constitute know-how, or only following it *with understanding* of its normative basis? This is conceptual analysis applied to documented practices.
      *   **What Moves It:** Highlighting that in domains defined by norms, know-how seems intrinsically linked to recognising and responding to those norms, not just producing outputs. This potentially distinguishes genuine know-how from mere algorithmic processing (linking to your AI concern).
      *   **Robustness to Case-Shift:** **Highly Relevant.** Normative standards are explicit and paramount in your central cases. A surgeon *must* know *why* sterility matters, not just follow the scrub protocol. A statistician *must* know *why* violating test assumptions invalidates results. This makes the normative dimension unavoidable, forcing the question: **Is know-how in norm-governed domains constitutively normative?** (**Live disagreement**: Intellectualists might reduce normative sensitivity to propositional knowledge; others argue it's a feature of the practical capacity itself).

  4.  **Question: What does the possibility of "know-how" in *Artificial Systems* (as you describe: fluent instruction + performance, opaque internals) reveal about the *essential* features of human know-how?**
      *   **Why Upstream (Conditionally)?** AI acts as a limiting case probe. If an AI flawlessly performs surgery per protocols *and* explains the steps, but lacks internal understanding or phenomenal states, does it have know-how? Comparing this to human cases forces clarity on which features (reliability, articulability, understanding, responsiveness to reasons, phenomenology?) are *necessary* for the *concept* of know-how as we apply it to humans. It tests the boundaries of functionalist vs. non-functionalist accounts.
      *   **Tractability:** Requires careful conceptual work on the conditions for ascribing know-how and analysing thought experiments. Engage with philosophy of AI/mind (e.g., Dennett's intentional stance, Searle's Chinese Room, recent work on AI explanation & understanding). Crucially, *contrast* the AI case with your central human cases focusing on normative competence and understanding. Avoid getting bogged down in technical AI details; focus on the philosophical implications of the *described capacities*.
      *   **What Moves It:** If AI forces a revision of what's essential to know-how (e.g., prioritising output over internal states), this challenges accounts emphasising understanding or phenomenology in humans. If we insist AI lacks true know-how, we must pinpoint what *human* element is missing and why it's essential.
      *   **Robustness to Case-Shift:** **Reinforced.** Your central cases are precisely the domains where AI performance is advancing (e.g., AI tutors explaining proofs, surgical robots). Analysing *human* know-how in these domains makes the comparison/contrast with AI sharper and more concrete. (**Live disagreement**: There is *no consensus* on AI know-how; it's a tool for probing the human concept).

  5.  **Question: How does the *acquisition and transmission* mode (instruction vs. imitation) impact the nature of the know-how acquired? Does this difference map onto a propositional/practical divide?**
      *   **Why Upstream?** The standard debate often links propositional knowledge to explicit instruction and non-propositional skill to imitation. Your cases challenge this: complex practical know-how (surgery, advanced stats) is primarily acquired through explicit instruction *combined* with practice. Does this transmission route fundamentally alter the cognitive architecture of the know-how compared to, say, bike-riding? Or is the endpoint state similar?
      *   **Tractability:** Analyse philosophical and psychological literature on skill acquisition (Dreyfus & Dreyfus, Montero, Sutton et al. on embodied cognition). Examine pedagogical literature for your chosen domains – how is theoretical knowledge integrated with practical training? Conceptual analysis of "internalization" – does instruction lead to propositional knowledge that *becomes* practical, or is a distinct state built?
      *   **What Moves It:** Showing that even know-how acquired via explicit instruction retains an ineliminable practical component not reducible to the propositions taught, or conversely, showing how instruction builds genuinely propositional-guided action. This questions simple acquisition-based distinctions.
      *   **Robustness to Case-Shift:** **Central.** Your cases *are* the paradigm of instruction-based know-how transmission. This question directly tackles whether this mode yields a distinct *kind* of know-how relevant to the core debate. (**Live disagreement** in psychology/philosophy of skill concerning the role of explicit rules in expertise).

  ---

  ### Questions to Avoid (For Now)

  1.  **The "Gettier Problem for Know-How":** Attempts to find cases of justified true belief (or equivalent) that aren't know-how, or vice-versa. **Why Avoid?** This presupposes the debate is *primarily* about whether know-how reduces to propositional knowledge *simpliciter*. Your agenda questions the very framework this assumes (e.g., the nature of success conditions, articulability, normativity). It's downstream and potentially a distraction unless the upstream questions are resolved. It also often relies on the tired examples.
  2.  **Detailed Analysis of Specific Non-Articulable Skills (e.g., Bike Riding) in Isolation:** **Why Avoid?** While contrasting cases are useful, deep dives into these alone won't address your core concern about the distorting effect of their dominance. They are less tractable for pure conceptual/desk analysis (relying more on introspection or contested psych literature) and less obviously relevant to your central cases and research proposal direction. Use them *contrastively* when analysing your core cases.
  3.  **The Neuroscience of Skill:** **Why Avoid?** Explicitly ruled out by your constraints (no data collection, desk-based). While fascinating, it's downstream of the conceptual clarifications you need to pursue and doesn't directly address the philosophical foundations or your case-driven concerns. It requires expertise you likely lack.
  4.  **Pure Exegesis of Major Figures (Ryle, Stanley etc.) without a Specific Critical Lens:** **Why Avoid?** You need to *advance* an agenda, not just survey. Engage with them critically through the lens of your chosen upstream questions and central cases. Don't let your paper become a commentary on commentary.
  5.  **"Is Know-How Really Just Know-That?" (Asked Straightforwardly):** **Why Avoid?** This is the *downstream* consequence of resolving the upstream questions on the agenda (particularly 1, 2 & 3). Starting here leads to rehashing standard arguments without the novel leverage your case-shift provides. Frame your investigation through the more foundational questions above.

  ---

  ### Why This Agenda & Ordering is Robust to Your Case-Shift

  *   **Foundational Focus:** The agenda targets the core conceptual building blocks (success, articulation, normativity) that define know-how *regardless* of the example. Your cases don't change *what* needs defining; they provide powerful, often *more revealing*, test cases for those definitions. They make ambiguities in "ability" or "reliability" stark and force the issue of normativity and the limits of articulability.
  *   **Exposing Conflations:** Your cases are perfect for untangling the knot of "ability, disposition, tacit understanding, skill, reliability, and practical modes of presentation" precisely because they involve complex, rule-guided action where these elements can be *analysed separately* (e.g., can one have the ability/reliability without the tacit understanding? Can one articulate the rules without the practical skill?).
  *   **AI as Probe:** Your AI concern naturally integrates as a limiting case analysis (Question 4), made more pertinent by focusing on domains where AI performance is plausible. The contrast with human normative competence in your central cases is key.
  *   **Tractability Maintained:** All questions remain answerable through conceptual analysis, critique of existing arguments, and examination of *documented practices* (protocols, manuals, training methodologies) relevant to your central cases. No new empirical data is needed.

  **Recommendation:** Start with **Question 1 (Success Conditions)** for your term paper. It's the most fundamental, directly tackles the conflation you identified, is highly tractable with your cases, and its resolution significantly impacts how you approach the others. It provides the strongest foundation for a summer research proposal, which could then deepen into **Question 2 (Articulability & Integration)** or **Question 3 (Normative Competence)**, potentially incorporating **Question 4 (AI)** as a contrastive element. This path offers a clear, focused, and high-impact trajectory within your constraints. Good luck!
