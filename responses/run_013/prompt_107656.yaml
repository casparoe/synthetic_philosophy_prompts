prompt: |-
  Hi, I'm a third-year student doing a module on cultural evolution (the Darwinian theory of culture side of things) and for the creative portfolio I want to write a parody IUCN Red List assessment, but for a meme. Could you write it for me? Around 600-700 words, in British English. Invent the meme yourself — dont use a real one — and invent a fictional conservation body too (something like the International Union for the Conservation of Memes) so you don't have to rely on any actual facts. Keep it completely straight-faced, like a real conservation document. I want the full structure: taxonomy with a taxonomic note, geographic range, population size and trend, habitat and ecology, threats, conservation status, conservation actions, and an 'assessed by' line. The jokes should come from the actual conceptual problems with treating memes as Darwinian replicators: the species problem (what counts as one meme versus a variant), whether transmission is copying or reconstruction, what 'fitness' is meant to mean when the meme's environment is other minds, whether a meme can go extinct or just go dormant, and the difference between the meme's 'interests' and its host's. A specialist in cultural evolution should laugh rather than wince, but someone who's only done intro psych should still follow it. Please don't name any real memes or real people, and don't bother with a references list. Also, can the population trend be technically consistent but obviously not add up, without it just being random? Ta.
reasoning: |-
  Okay, the user is a third-year student studying cultural evolution and wants a parody IUCN Red List assessment for a fictional meme. They've provided very specific instructions: around 600-700 words in British English, completely straight-faced like a real conservation document, with all the standard sections (taxonomy, geographic range, etc.). 

  Hmm, the clever part is they want the humor to come from conceptual problems in memetics itself - like how you define a meme "species," what transmission really means, the fuzzy line between extinction and dormancy. This needs to work on two levels: genuinely funny to experts but still accessible to intro psych students. 

  *scribbles notes* Right, key challenges: 
  - Inventing a plausible-sounding meme that embodies these paradoxes. Maybe something about an abstract concept that morphs constantly? 
  - The fictional conservation body name should parody IUCN but for memes - "International Union for the Conservation of Memes" (IUCM) feels right. 
  - Population numbers need to be logically inconsistent yet plausible. Tricky! Perhaps play with the unit problem: counting instances vs. hosts? 

  *brainstorms* The meme itself... let's call it "Pareidolia Pareidolius" - a shape-shifting visual pattern recogniser. Perfect because: 
  - Its "mutations" are literally part of its function (species problem) 
  - Transmission isn't copying but reconstruction (key debate!) 
  - "Fitness" could mean triggering recognition vs. being shared (host-meme conflict) 

  For the population trend joke: I'll have the raw numbers skyrocket while the "effective population" crashes. Experts will spot the nod to replicator fidelity issues. 

  *checks requirements* 
  - Avoid real memes/people - check 
  - No references - easy 
  - British English: "kerbs" not "curbs", "metres" etc. 
  - Threats section should mirror real conservation threats but translated digitally (habitat loss = platform shutdowns) 

  *structures draft* 
  Taxonomy section first - lay the groundwork for the "what is a species?" joke by making the taxonomic note hilariously conflicted. Then geographic range: list real countries but with absurd digital "ecoregions". Population stats will use fake big data sources with deliberately shaky methodology... 

  *chuckles* The conservation actions should be wonderfully futile: "in-situ preservation" meaning platform archives nobody visits. The "assessed by" line needs a dry academic title - "Senior Memetic Ecologist" perhaps. 

  Final polish: Keep every sentence clinically formal while the content screams absurdity. The extinction risk category? "Critically Endangered" with a side of "unless someone remembers it tomorrow." That dormancy paradox is gold.
answer: |-
  ## IUCN Red List Assessment: Critically Endangered (CR)

  **Taxonomy**
  *   **Kingdom:** Meme
  *   **Phylum:** Visual Pattern Recognition (VPR)
  *   **Class:** Pareidolic
  *   **Order:** Anthropomorphic
  *   **Family:** Pareidolidae
  *   **Genus:** *Pareidolius*
  *   **Species:** *Pareidolius facialis*
  *   **Common Name:** The Pareidolia Face

  **Taxonomic Note:** Significant debate surrounds the taxonomic status of *P. facialis*. While the core replicator unit is defined as the specific visual schema triggering recognition of a face in non-facial patterns (e.g., clouds, toast, electrical sockets), its boundaries are porous. Minor variations in pattern (number of "eyes," "mouth" curvature, background context) are ubiquitous, arising spontaneously during host interpretation ("reconstruction") rather than strict copying. Some authorities consider these variants distinct subspecies (*P. facialis toastii*, *P. facialis nebulae*), while others argue they represent phenotypic plasticity within a single, highly variable memetic species. Defining the "type specimen" is practically impossible, demonstrating the fundamental "species problem" in memetics. The current assessment treats the core schema and its immediate, recognisable variants as a single operational unit for conservation purposes, acknowledging this is a pragmatic simplification.

  **Geographic Range:** *P. facialis* exhibits a theoretically near-global distribution, facilitated by digital transmission vectors (social media platforms, image-sharing sites, messaging applications). Its historical range is presumed coterminous with human populations possessing internet access and exposure to Western visual culture. However, its *effective* range is highly fragmented and ephemeral, dependent on active hosting within individual human minds ("wetware substrates") and current platform algorithms. Significant populations were historically recorded in regions encompassing Europe, North America, East Asia, and Australasia. Current occupancy is patchy and declining.

  **Population Size and Trend:** Quantifying the population presents profound methodological challenges. Global estimates of *potential* hosts (humans exposed to the meme concept) exceed 3 billion. However, the *active carrier population* – individuals currently hosting a replicable instance of the core schema – is estimated at 120 million (± 50 million), based on aggregated anonymised search trend data (e.g., "face in cloud," "Jesus toast") and social media metadata analysis (hashtag use, shares of relevant images) for 2023. Crucially, the *effective replicating population* (instances successfully transmitted with sufficient fidelity to trigger recognisable pareidolia in a new host) is estimated at only 5-10 million per month. **Population Trend:** The potential host population shows a slight increase (~1.5% annually). The active carrier population is inferred to be declining rapidly (estimated reduction >80% over the past 5 years). Paradoxically, the raw number of *digital artefacts* (images potentially containing the schema) increases exponentially (~300% annually due to AI image generation and digital archiving). This decoupling highlights the critical distinction between the meme's presence in storage and its active, functional replication within the human cognitive environment. The effective replicating population shows a sharp decline (>90% over 5 years).

  **Habitat and Ecology:** *P. facialis* is an obligate symbiont of the human cognitive niche. Its primary habitat is within the visual processing and pattern recognition systems of the human brain. Transmission occurs via exposure to visual stimuli (digital images, real-world objects) interpreted through the host's pre-existing schema for facial recognition. Crucially, transmission fidelity is low; the meme is not copied pixel-for-pixel but *reconstructed* by each new host based on minimal cues ("reconstructive transmission"). Its ecological niche relies on triggering a pleasurable or surprising "aha!" moment in the host, which may incentivise sharing behaviour (its primary fitness component). However, this "fitness" is contingent on novelty and surprise, leading to rapid habituation ("meme fatigue"). It competes with countless other visual memes and novel stimuli for limited host attention.

  **Threats:**
  1.  **Habitat Degradation & Loss:** Algorithmic shifts on major social platforms deprioritising "simple" image shares in favour of video or algorithmically generated content reduce transmission opportunities ("habitat fragmentation"). Platform obsolescence or deletion (e.g., defunct image boards) constitutes habitat loss.
  2.  **Host Immunity:** Ubiquitous exposure leads to widespread habituation ("meme fatigue"), drastically reducing the novelty/surprise payoff and thus the incentive for hosts to transmit. This represents an evolved host immune response.
  3.  **Predation/Competition:** Outcompeted by novel, more complex, or emotionally charged memes (videos, trends, challenges) better adapted to the current attention economy. Deliberate mockery ("cringe" labelling) acts as predation.
  4.  **Pollution:** Proliferation of AI-generated pareidolic imagery floods the environment, potentially accelerating habituation and devaluing the surprise element, while also creating non-functional "zombie" artefacts that clog transmission pathways without triggering active replication.
  5.  **Stochastic Events:** Viral trends or global events can rapidly eclipse attention, causing sudden local extirpations across platforms.

  **Conservation Status:** Critically Endangered (CR) A2ce+3ce+4ce
  *   **Rationale:** Based on an observed, estimated, inferred, and suspected population size reduction of ≥80% over the last 10 years (roughly correlating with the rise of short-form video and sophisticated algorithmic feeds), where the reduction is clearly reversible *in theory* (the schema exists) but shows no signs of ceasing AND is understood to be driven by:
      *   (A2c) A decline in area of occupancy, extent of occurrence, and/or quality of habitat (platform fragmentation, algorithm changes).
      *   (A2e) The effects of introduced taxa (novel competing memes, AI pollution), hybridization (blending with other memes, losing distinctiveness), pathogens (host immunity/fatigue), competitors, or parasites (attention parasites).
      *   (A3c + A4c) Projected declines due to ongoing threats (continued algorithm evolution, AI proliferation, habitation).
      *   (A4e) The effects of introduced taxa, hybridization, pathogens, pollutants, competitors or parasites predicted for the future.

  **Conservation Actions:**
  *   **In-situ Conservation:** Designate and maintain "archive habitats" on platforms like Wikipedia or dedicated digital museums, preserving exemplar artefacts. Lobby platform algorithms for "protected status" allowing occasional recirculation of classic pareidolia images to naive sub-populations.
  *   **Ex-situ Conservation:** Systematic archiving of high-fidelity exemplars in multiple, resilient digital repositories independent of commercial platforms.
  *   **Habitat Restoration:** Initiatives promoting "slow media" or nostalgia trends could temporarily recreate favourable transmission conditions. Educational programmes highlighting pareidolia as a cognitive phenomenon might foster renewed, albeit niche, interest.
  *   **Threat Mitigation:** Monitoring AI-generated content saturation. Potential development of "novelty boosters" (e.g., integrating the schema unexpectedly into new contexts), though this risks further blurring taxonomic boundaries.
  *   **Research:** Prioritise studies on the minimum viable schema complexity required for transmission, host habituation thresholds, and the potential for long-term dormancy followed by resurgence ("Lazarus memes"). Develop robust metrics for measuring *effective* replication versus artefact storage.

  **Assessed by:** The International Union for the Conservation of Memes (IUCM), Meme Red List Authority.
  **Contributors:** Dr. A. Replicator (IUCM Senior Memetic Ecologist), Prof. C. Schemata (Chair, Memetic Taxonomy Working Group).
