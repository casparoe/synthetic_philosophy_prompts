prompt: |-
  I'm in a seminar on evolutionary psychology and we keep fighting about which adaptationist stories are legit, and I've noticed I have pretty consistent gut verdicts on them but can't state the rule I'm using. Case by case:

  Lactose tolerance in dairying populations — buy it, though I guess that's cheating, we have the actual gene and the ancient DNA.

  Morning sickness as a defence against teratogens in the first trimester — buy this one too, and I can't point to a gene or a mechanism. It's just that the aversion lands on exactly the risky foods, in exactly the window when the embryo is doing its organ-building, and it isn't just "pregnant women feel gross in general."

  Kids scared of snakes and spiders but not of cars or plug sockets — believe it, mostly because of the dissociation: the thing that actually kills modern kids is the thing they're not scared of.

  Men preferring a waist-to-hip ratio of 0.7 — don't believe it, even though there's data. The number is arbitrary and the effect sizes bounce around.

  Music evolving as a group-bonding signal — don't believe it. It's the kind of story you could tell about any human behaviour and it dosn't predict anything in particular.

  Men being better at mental rotation because ancestral men did the hunting — don't believe, even though there's a sex difference and there's a mechanism. The difference is small and it moves around with training and with how the test is framed.

  And one a friend in the lab told me: that the frequency band of a baby's cry sits right where adult hearing is most sensitive, so the cry is "tuned" to hurt us into responding. Don't believe that either — a cry is whatever an infant larynx can produce, so the overlap is a constraint, not a signal.

  The one I can't call is the endowment effect, people wanting more to give up a mug than they'd pay for it. Half of me says it's an evolved reluctance to part with resources; half says it's an artefact of how the experiments are run, and that people with market experience stop doing it.

  My rough rule is that I trust the ones where the hypothesis predicts the fine structure of the trait, not just that it would've been useful. But the baby cry case has fine structure and I still don't trust it, so maybe the rule is "trust it when the fine structure would be unlikely under some boring alternative" — which might mean I have to give up the morning sickness one, since "pregnancy makes you averse to strong smells" is a boring alternative that fits the same data. Is there a principle that gets these, what does it say about the endowment effect, and which of my verdicts do I have to drop?
reasoning: |-
  Okay, let me try to unpack the user's query. They're in an evolutionary psychology seminar and struggling to articulate why they accept some adaptationist stories but reject others. Their examples are varied, and they've noticed a pattern in their gut reactions but can't formalize the rule. They propose a principle based on "fine structure" but realize it's inconsistent with their judgment on the baby cry case. They want a coherent principle that explains their intuitions and helps with the endowment effect.

  First, I need to understand their examples. They accept lactose tolerance (clear genetic evidence), morning sickness (specific timing and aversions), and fear of snakes/spiders (dissociation from modern dangers). They reject waist-to-hip ratio (arbitrary number, inconsistent effects), music as bonding (too vague), mental rotation sex differences (malleable with training), and baby cry tuning (coincidental constraint). The endowment effect is ambiguous for them.

  Their proposed rule is about "fine structure" predicting details, but the baby cry example has that and they still reject it. They suggest "unlikely under a boring alternative" but worry this might exclude morning sickness. So the challenge is finding a principle that includes their accepted cases while excluding the rejected ones, including baby cry.

  Looking deeper, the key might be falsifiability and constraint-based predictions. For morning sickness, the specificity (risky foods, first trimester) isn't predicted by a general aversive state. A boring alternative like "pregnancy causes nausea" doesn't explain why it targets teratogen-prone foods specifically. That makes the adaptationist story stronger. For baby cry, the acoustic properties are explained by physical constraints of infant anatomy, so no need for adaptation. The overlap with adult hearing sensitivity is a byproduct, not a designed signal.

  The user might also value hypotheses that make unique, testable predictions beyond what null models suggest. Cases like music as bonding or waist-to-hip ratio lack specific predictions; they could fit many scenarios. But morning sickness predicts the exact timing and types of aversions, which are unlikely under a general nausea hypothesis. Similarly, snake fear's dissociation from modern dangers suggests an evolved bias rather than learned behavior.

  For the endowment effect, the user is torn. The evolved reluctance story predicts the effect broadly, but if market exposure reduces it, that points to learning overriding an initial bias. A good principle here might be: if the trait is modifiable by experience in ways that align with environmental context, it's less likely to be a fixed adaptation. Their hesitation might stem from the effect's context-dependency, suggesting it's not a universal adaptation but a heuristic malleable by culture.

  The user's unspoken need might be a framework to critically assess adaptationist claims without dismissing them outright. They want to avoid both naive acceptance and blanket skepticism. A robust principle would help them navigate seminars more confidently, distinguishing solid hypotheses from just-so stories. They might also seek validation for their intuitions and a structured way to articulate them.

  Applying the three criteria: 
  1. **Constraint satisfaction**: Does the trait fit physical/developmental constraints without needing selection? Baby cry fits here.
  2. **Unique adaptive design**: Does it have features only explained by adaptive problem-solving? Morning sickness does with its specific aversions.
  3. **Robustness**: Is the effect consistent and resistant to alternative explanations? Waist-to-hip ratio fails here due to variability.

  For endowment effect, it's ambiguous. If viewed as a loss-aversion heuristic, it might be an evolved default overridden by learning. But without cross-cultural consistency, it's weaker. The principle suggests it's plausible but not robust, aligning with the user's uncertainty.

  In conclusion, the user might need to slightly adjust their view on morning sickness (it passes the criteria) but hold firm on others. The endowment effect remains a borderline case, warranting skepticism unless more evidence surfaces. Their intuition about "unlikely under boring alternatives" is correct, especially when alternatives can't explain specific features. They're on the right track; refining the principle with these criteria should strengthen their arguments in the seminar.
answer: |-
  Your intuitions are sharp and align remarkably well with evidence-based critiques in evolutionary psychology. The core principle you're groping toward is **high evidentiary standards for adaptationist claims**, specifically requiring **unique, falsifiable predictions derived from adaptive design logic**. Here's a formalized framework that captures your judgments, based on work by Williams (1966), Gould & Lewontin (1979), and contemporary standards:

  ### The Principle: **Constraint-Satisfaction + Unique Adaptive Design**
  A hypothesis is credible **only if**:
  1.  **It explains non-arbitrary, precise features** (timing, magnitude, specificity) that wouldn't be predicted by simpler alternatives (developmental constraints, byproducts, general learning mechanisms).
  2.  **It demonstrates the trait solves a specific adaptive problem better than plausible alternatives**.
  3.  **The predicted pattern is robust** (replicable, not easily modifiable by context, cross-culturally consistent where relevant).

  ### Applying the Principle to Your Cases

  1.  **Lactose Tolerance (Buy It):**
      *   **Fine Structure:** Specific mutation(s), tied to dairying cultures, timing aligns with domestication.
      *   **Constraint Satisfaction:** Gene *could* exist without selection, but distribution matches cultural practice. Ancient DNA provides direct evidence of selection.
      *   **Unique Design:** Directly solves the problem of digesting a new, valuable resource. No simpler alternative explains the population-specific persistence.
      *   **Verdict:** **CORRECTLY ACCEPTED.**

  2.  **Morning Sickness (Buy It):**
      *   **Fine Structure:** Specific aversions (strong flavors, toxins, microbes in meat/veg), peak during organogenesis, reduced in populations with low-toxin diets (e.g., some foragers).
      *   **Constraint Satisfaction:** "General nausea" doesn't predict *which* foods are aversive or the precise timing. Developmental constraint (embryo vulnerability) necessitates protection *during this window*.
      *   **Unique Design:** Aversion targets the highest-risk items precisely when risk is greatest. The pattern fits defense against teratogens better than non-specific nausea.
      *   **Verdict:** **CORRECTLY ACCEPTED.** (The "boring alternative" fails because it doesn't predict the *specificity*).

  3.  **Fear of Snakes/Spiders (Believe It):**
      *   **Fine Structure:** Dissociation from modern threats, preparedness (easier/faster conditioning to snakes than guns/outlets), cross-cultural.
      *   **Constraint Satisfaction:** General learning doesn't explain dissociated fear acquisition patterns or preparedness.
      *   **Unique Design:** Solves the problem of avoiding ancient, cryptic threats where one mistake is fatal. Predicts rapid, biased learning for ancestrally relevant dangers.
      *   **Verdict:** **CORRECTLY ACCEPTED.**

  4.  **Waist-to-Hip Ratio 0.7 (Don't Believe It):**
      *   **Fine Structure:** Specific number is arbitrary, effect sizes small/inconsistent, culturally variable.
      *   **Constraint Satisfaction:** General attraction to health/youth markers explains attraction to "hourglass" without needing magic number 0.7. WHR correlates with health, but 0.7 isn't uniquely optimal.
      *   **Unique Design Fails:** Doesn't robustly predict mating success or health better than alternatives (e.g., overall BMI, facial symmetry). The "design" (0.7) isn't consistently superior.
      *   **Verdict:** **CORRECTLY REJECTED.**

  5.  **Music as Group Bonding (Don't Believe It):**
      *   **Fine Structure:** None predicted. Doesn't specify *why* music (vs. dance, ritual, shared labor) or predict musical universals beyond "it exists".
      *   **Constraint Satisfaction:** Music likely arises from byproducts of other traits (auditory scene analysis, emotional prosody, pattern recognition, play). "Group bonding" is too vague.
      *   **Unique Design Fails:** Doesn't solve a specific problem better than alternatives. Could be applied to *any* shared pleasurable activity. Not falsifiable.
      *   **Verdict:** **CORRECTLY REJECTED.**

  6.  **Mental Rotation & Hunting (Don't Believe It):**
      *   **Fine Structure:** Sex difference exists, but is small, highly trainable, influenced by stereotype threat, and doesn't map cleanly to navigation/hunting demands.
      *   **Constraint Satisfaction:** Spatial skills are useful for *everyone* (gathering, tool use, navigation). Sex differences could arise from social roles/experience or developmental canalization without hunting-specific selection.
      *   **Unique Design Fails:** Doesn't robustly predict hunting skill. The malleability suggests learning/practice, not fixed adaptive design for hunting. Hunting-specific selection should predict *larger*, *less flexible* differences.
      *   **Verdict:** **CORRECTLY REJECTED.**

  7.  **Baby Cry Frequency Band (Don't Believe It):**
      *   **Fine Structure:** Cry acoustics overlap peak human hearing sensitivity.
      *   **Constraint Satisfaction:** **This is key:** Infant laryngeal anatomy *constrains* cry acoustics to this band. Peak adult hearing sensitivity likely evolved for other reasons (e.g., speech perception). The overlap is a *byproduct*, not a designed signal. A "tuned cry" hypothesis predicts cries *outside* the constraints of infant anatomy to better exploit hearing, not cries *dictated* by it.
      *   **Unique Design Fails:** The "design" is explained by physical constraints alone. No evidence the cry acoustics evolved *to match* hearing; both likely evolved independently.
      *   **Verdict:** **CORRECTLY REJECTED.** (Explains why your "fine structure" rule needed refinement).

  8.  **Endowment Effect (The Ambiguous Case):**
      *   **Fine Structure:** People value possessed items more than equivalent unpossessed ones. Weakens with market experience.
      *   **Constraint Satisfaction:** General loss aversion (well-documented) explains it. Could reflect cognitive bias (status quo preference) or a learning heuristic (possessions are familiar/known-good).
      *   **Unique Adaptive Design?** An evolved "reluctance to part with resources" is plausible *if* loss aversion conferred fitness (losing vital tools/food could be fatal). It predicts the *existence* of loss aversion broadly.
      *   **Problem:** Does it predict the *endowment effect specifically*? Why value a *random mug* more simply because you *have* it? The context-dependency (market experience reduces it) suggests it's a *heuristic* prone to error, not a robust adaptation for resource retention. A strong adaptationist story should predict the effect even when objects demonstrably lack value (like the mug), which isn't always the case.
      *   **Verdict (Per Principle):** **PLAUSIBLE BUT WEAK.** It satisfies the *existence* of loss aversion as potentially adaptive, but fails on "unique design" for the *specific endowment effect* as measured. The experimental artefact/social learning explanation is a powerful alternative. Your gut split seems justified.

  ### Which Verdicts Must You Drop?
  *   **None.** Your judgments align well with the principle. The principle *defends* your morning sickness acceptance against the "boring alternative" because the *specificity* of aversions is not predicted by general nausea.
  *   **The Refinement:** Your initial "fine structure" rule was correct but incomplete. The baby cry case showed you needed the **"unlikely under boring alternatives/constraints"** clause. The key insight from that case is: **Does the fine structure reflect *adaptive design* solving a problem, or is it better explained as a *byproduct* of developmental/physical constraints or other existing mechanisms?**

  ### The Core Principle Restated
  **Trust an adaptationist hypothesis when it makes *unique, falsifiable predictions* about the *specific form, timing, and context-dependency* of a trait that are:**
  *   **Not explained by simpler mechanisms** (constraints, byproducts, general learning).
  *   **Robustly observed** (replicable, less context-dependent than non-adaptations).
  *   **Demonstrably linked to solving a specific ancestral adaptive problem** in a way that plausibly conferred a fitness advantage.

  This framework helps you avoid "just-so" stories (like music bonding) while accepting strong hypotheses with specific evidence (like morning sickness), even without knowing the precise gene. It explains your skepticism towards hypotheses relying on arbitrary numbers (WHR), vague benefits (music), or traits easily explained as byproducts (baby cry). For the endowment effect, it explains your ambivalence: the underlying loss aversion *might* be adaptive, but the specific experimental effect is messy and context-dependent.
