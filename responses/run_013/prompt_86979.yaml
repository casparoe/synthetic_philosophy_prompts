answer: |-
  ### Mapping David Lewis's Convention Theory to the Swedish Traffic Switch

  **From Theory to Case:**
  1.  **The Coordination Problem:** The core problem was *avoiding collisions* and enabling *predictable traffic flow*. Every driver needs to anticipate the behavior of oncoming and crossing traffic. Driving on the left was a pre-existing solution to this recurring problem. The problem intensified due to increased cross-border traffic with right-driving neighbors (Norway, Finland, Denmark) and the prevalence of left-hand-drive vehicles (better visibility for oncoming traffic when driving on the right), creating friction with the existing convention.

  2.  **Old Arrangement as Convention:** The pre-1967 left-driving system perfectly fit Lewis's definition:
      *   **Regularity:** Nearly all drivers in Sweden drove on the left.
      *   **Coordination Problem Solved:** It enabled predictable driving and collision avoidance.
      *   **Arbitrariness:** Driving on the right was a viable alternative (as demonstrated by neighbors and most of continental Europe).
      *   **Sustained by Expectations:** People drove left *because* they expected others to drive left, and they expected others to drive left *because* they saw others driving left. This mutual expectation produced conformity without needing constant legal enforcement for every interaction. Common knowledge existed that "we drive on the left in Sweden."
      *   **No Authority Mandate?** While codified in law, the key Lewisian point is that the law merely reflected and codified the convention sustained by expectations. Most drivers followed it primarily because *others* followed it, not solely out of fear of the police (though law provided a baseline).

  3.  **New Arrangement as Convention:** The post-1967 right-driving system also qualifies as a Lewisian convention *after* the switch:
      *   **Regularity:** After H-Day, people drove on the right.
      *   **Coordination Problem Solved:** It functions to avoid collisions just as effectively as the left-driving system did.
      *   **Arbitrariness (Post-Switch):** While the *choice* of right was non-arbitrary (see below), the *system itself* is arbitrary in Lewis's sense – driving on the left would also solve the problem. The new regularity is one of multiple possible solutions.
      *   **Sustained by Expectations:** People drive right *because* they expect others to drive right, and this expectation is confirmed by observation. Common knowledge of "we drive on the right now" emerged quickly after H-Day.
      *   **Authority's Role?** Crucially, *after* the transition period, the system became self-sustaining through mutual expectations, even though law existed. People conform primarily because others conform.

  4.  **Arbitrariness Condition and the Direction of Change:** Lewis's arbitrariness condition ("another regularity would have served just as well") applies primarily to the *existence* of *a* convention solving the problem, not necessarily to the *choice* between conventions *during a transition*. Here, the choice of switching *to the right* was **not arbitrary**:
      *   **Neighboring Practices:** Switching to the right aligned Sweden with its immediate neighbors, solving the cross-border coordination problem.
      *   **Left-Hand-Drive Vehicles:** Most cars in Sweden were designed for right-hand traffic (driver on the left). Switching to right-hand traffic improved safety and visibility for the majority of vehicles.
      *   **Focal Point:** The existing practice of neighboring countries and the vehicle fleet made "driving on the right" a highly *salient* and *focal* alternative. It was the obvious, uniquely rational choice given the context, eliminating true arbitrariness for the *direction* of the switch. Lewis acknowledges that salience (focal points) can resolve coordination problems, especially during change. The neighbours' practice and car design provided this overwhelming salience.

  **From Case to Theory: Critiquing Lewis**
  The Swedish case highlights significant limitations and omissions in Lewis's core account:

  1.  **Centrally Orchestrated Replacement of Equilibrium:** Lewis's theory focuses on the *emergence* and *maintenance* of conventions through decentralized individual actions and expectations. The Swedish switch was fundamentally different: it was a **centrally planned, legally mandated, and state-enforced** replacement of one stable equilibrium (left-driving convention) with another (right-driving convention). The old convention wasn't failing; it was deliberately dismantled and replaced by authority. Lewis's model lacks a robust account of how *authority-driven* convention shifts occur.
  2.  **Manufactured Salience and Common Knowledge:** Lewis describes salience as arising naturally from the situation. In Sweden, salience was **manufactured**:
      *   The multi-year publicity campaign explicitly made the *date* (H-Day), the *new rule* (drive on the right), and the *process* (overnight halt) salient to the entire population.
      *   The campaign and legal mandate created the **common knowledge** necessary for the switch: Everyone knew the switch was happening on 3 September, everyone knew everyone else knew, everyone knew everyone knew they knew, etc. This wasn't emergent; it was broadcast and enforced by the state.
  3.  **Crucial Role of Law and Enforcement in Transition:** Lewis downplays the role of authority, suggesting conventions persist primarily through expectations. The Swedish transition **absolutely depended** on law and enforcement:
      *   **Mandate & Timing:** The Riksdag *legally mandated* the switch on a specific date, overriding the referendum.
      *   **Enforcement during Chaos:** During the critical transition period (especially immediately after H-Day), police presence and the threat of legal sanctions were essential to ensure compliance and manage the inherent danger as the new expectations were forming. Without this authoritative intervention, the switch would likely have descended into chaos.
      *   **Creating the New Baseline:** Law provided the initial, unquestionable "seed" for the new regularity upon which expectations could then build.
  4.  **Impossibility of a Partial or Gradual Switch:** The case starkly illustrates why conventions solving strict coordination problems like this are **binary equilibria**. You cannot have "some people drive left, some drive right" or "switch gradually neighborhood by neighborhood" without catastrophic coordination failures (increased collisions). The problem demands universal, simultaneous (or near-simultaneous) adoption of the new rule. This reinforces the "all-or-nothing" nature of such conventions but also underscores why *only* a coordinated, top-down intervention could achieve the switch without prolonged chaos. Lewis acknowledges the nature of the equilibria but doesn't fully explore the implications for *changing* them.

  **Verdict: Refines and Exposes Gaps, but Does Not Refute**

  The Swedish traffic switch **refines and exposes crucial gaps in Lewis's account, but does not refute its core insights about what conventions *are* and how they function *once established*.**

  *   **Confirms:** The core mechanics Lewis describes – conventions as self-sustaining regularities solving coordination problems through reciprocal expectations and common knowledge – are clearly demonstrated by *both* the pre-1967 left-driving system *and* the post-1967 right-driving system *in their stable states*. The arbitrariness condition (in the sense that either side *could* solve the core problem) holds for the systems themselves.
  *   **Refines/Exposes Gaps:** The case powerfully refines Lewis's theory by highlighting what it underplays or omits:
      *   **The Role of Authority in Change:** Lewis's model is poor at explaining how to *replace* one deeply entrenched convention with another. The Swedish case shows that authority (law, state power, central planning) is often *essential* for orchestrating such shifts, manufacturing the necessary salience and common knowledge, enforcing compliance during the dangerous transition period, and providing the definitive starting point for the new equilibrium. Authority isn't just a codifier; it can be the prime mover in convention *change*.
      *   **Manufacturing Common Knowledge:** Lewis assumes common knowledge emerges naturally. Here, it was deliberately created by a massive state-run campaign.
      *   **Non-Arbitrariness in Transition Direction:** While the *systems* are arbitrary, the *choice* of which system to switch *to* was heavily constrained and non-arbitrary due to path dependence (neighbors, vehicle design), acting as a powerful focal point. Lewis's concept of salience needs strengthening to account for such strong external determinants.
      *   **The Critical Transition Phase:** Lewis focuses on stable states. The chaotic, dangerous transition period, reliant on authority for safety, is a critical phenomenon his theory doesn't adequately address.

  **What a Theory of Convention Change Must Add:**

  A theory explaining how conventions change, inspired by this case, must incorporate:

  1.  **The Central Role of Authority:** Explicitly model how states or other powerful institutions can *initiate*, *orchestrate*, and *enforce* the transition from one convention to another, particularly when the existing convention is stable and the shift requires coordination on a massive scale. This includes mandating the change, setting the timing, and providing enforcement during the unstable transition.
  2.  **Mechanisms for Manufacturing Salience and Common Knowledge:** Explain how salience is not just discovered but can be *created* through publicity, education, and legal decree to make a new coordination point obvious and establish the universal awareness (common knowledge) necessary for a coordinated switch.
  3.  **Path Dependence and Focal Points in Selection:** Acknowledge that the "arbitrariness" of the new convention is often heavily constrained by existing factors (like geography, technology, or prior investments – e.g., neighbors, car design) that make one alternative uniquely salient and rational, eliminating true choice.
  4.  **Modeling the Transition Dynamics:** Develop an account of the inherently unstable and dangerous transition phase between equilibria, recognizing the necessity of temporary, heightened enforcement and coordination mechanisms (like the traffic halt) to bridge the gap.
  5.  **Overcoming Entrenchment:** Explain how the powerful self-reinforcing nature of an existing convention (based on deep-rooted expectations) can be overcome, which typically requires more than just a better alternative – it requires coordinated action, often imposed or strongly facilitated by authority.

  In conclusion, the Swedish Dagen H switch is a brilliant real-world test that confirms Lewis's description of conventions *in equilibrium* but dramatically exposes the limitations of his model in explaining how such deeply embedded social equilibria can be *deliberately and successfully overturned*. It cries out for a supplemental theory of convention *change* that places authority, manufactured common knowledge, and the dynamics of transition at its center.
