  1. **Rule A: Updateless Policy Optimization (UPO)**  
     This rule is inspired by Updateless Decision Theory (UDT) and focuses on selecting the optimal policy (or algorithm) for all similar decision problems, regardless of the current situation. The agent commits to a strategy that maximizes expected utility across all possible instances, even if individual acts under that policy seem irrational in isolation.  
     - **Fits the record:**  
       - **Newcomb's (one-box):** Commits to one-boxing as the optimal policy, as it leads to the predictor rewarding that disposition ($1M).  
       - **Prisoner's dilemma (cooperate):** Cooperates because the policy of mutual cooperation with copies yields the best outcome (no defection).  
       - **Charity case (give):** Gives 10% because the policy of generosity ensures the predictor deposited the money decades ago.  
       - **Poison case (take money, decline poison):** Here, UPO might seem inconsistent, but it can be interpreted as a two-step policy: at midnight, form the intention (as part of a policy that secures the money), and later, break it (as the policy allows for no-cost defection since the paymaster only checks intention at midnight). This fits the "rational irrationality" idea—the overall policy is rational, even though breaking the intention is locally irrational.  
     - **Core principle:** Choose policies that create the best precommitments, but allow policy-based defection when there are no future consequences (e.g., no ongoing relationship or punishment).

  2. **Rule B: Strategic Self-Deception (SSD)**  
     This rule involves temporarily adopting beliefs or intentions that are instrumentally rational for securing immediate benefits, even if they conflict with known future actions. The agent "sincerely" commits in the moment to enable cooperation or trust, then rationally defects later when the cost is sunk. Self-deception is used to make the commitment credible.  
     - **Fits the record:**  
       - **Newcomb's (one-box):** "Sincerely" believes one-boxing is best, as this belief is part of a strategy that evidences high reward (e.g., evidential reasoning).  
       - **Prisoner's dilemma (cooperate):** Believes cooperation is optimal because it evidences mutual cooperation with the copy.  
       - **Charity case (give):** Believes giving is right, as this belief-type was predicted and rewarded.  
       - **Poison case (take money, decline poison):** At midnight, self-deceives into sincerely intending to take the poison to get the money, knowing this intention is temporary and will be abandoned later (no penalty). This directly embodies "rational irrationality"—the irrational (self-deceptive) intention is locally beneficial.  
     - **Core principle:** Use evidential reasoning to justify momentary sincerity for gains, then defect when possible; self-deception bridges the gap between long-term benefit and local irrationality.

  Both rules fit the record by endorsing:
  - One-boxing in Newcomb's (evidential reasoning).
  - Cooperation in the prisoner's dilemma (policy or belief alignment with the copy).
  - Giving in the charity case (reward for being the generous "type").
  - Taking the money and declining the poison in the poison case (time-inconsistent defection).
  - The "rational to be irrational" idea (standing dispositions with locally suboptimal acts).

