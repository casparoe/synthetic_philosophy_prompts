answer: |-
  This asymmetry lacks an established name in mainstream philosophical literature, though it touches upon deep currents in moral responsibility, deference, and the nature of praise/blame. Its distinctiveness warrants a new coinage to capture its core mechanics and boundaries.

  **Proposed Coinage: Unidirectional Culpability Transmission (UCT)**

  **What UCT Names & How It Differs:**

  1.  **Core Phenomenon:** UCT describes the asymmetric transmission of responsibility through deference: **culpability (blame) transmits downstream from the advisor to the agent who acts on their verdict, while praiseworthiness (credit) does not.** The agent is blamed for acting on a *wrong* borrowed verdict, but not credited for acting on a *correct* borrowed verdict.
  2.  **Distinguishing Features:**
      *   **vs. Moral Testimony Debate:** Focuses not on whether deference yields *knowledge* or *understanding*, but on the *asymmetric assignment of responsibility* for the *outcome* of the act based on deference.
      *   **vs. General Praise/Blame Asymmetry:** Addresses a *specific mechanism* (deference) causing asymmetry, not the general tendency to require more for praise than blame. Here, deference *enables* blame assignment while *blocking* praise assignment in otherwise symmetric scenarios.
      *   **vs. Moral Luck:** Concerns the *source of the verdict* (deference), not the *uncontrolled circumstances* affecting the outcome. The asymmetry holds *even when* the reasonableness of the borrowed verdict is identical in both cases.

  **What the Label Does:** "Unidirectional Culpability Transmission" explicitly captures:
  *   **Unidirectional:** The flow goes *only one way* (blame transfers, credit doesn't).
  *   **Culpability:** The focus is on *fault* or *blameworthiness* being the element that transmits.
  *   **Transmission:** It moves *from the source (advisor) through the borrowed verdict to the actor*.

  **Boundaries Drawn:**

  1.  **Requires Deference:** UCT applies when an agent acts *primarily* or *solely* based on a moral verdict borrowed from another source (person, institution, text, AI) without independent engagement/judgment.
  2.  **Outcome Matters:** The asymmetry manifests when the *act itself* turns out to be wrong (despite reasonable deference) or right (due to correct deference).
  3.  **Focus on Responsibility Transmission:** It specifically concerns whether the *agent's responsibility* for the moral status of the act is affected by the deference mechanism itself, revealing an asymmetry in how responsibility transmits.

  **Addressing Your Questions:**

  1.  **Why the Asymmetry? What Work Does It Do?**
      *   **Negative Duties Primacy:** UCT likely rests on the intuition that **negative duties (not to harm) are stricter and less delegable than positive duties or credit-worthy actions.** Failing to prevent harm (even via reasonable deference) is seen as inherently blameworthy, whereas preventing harm via deference isn't seen as inherently creditworthy. You can't fully outsource the duty not to cause wrongful harm.
      *   **Judgment as a Prerequisite for Credit:** Positive moral credit ("merit") seems deeply tied to the exercise of *agentic moral judgment*. Merely being a conduit for a correct verdict lacks the agential contribution required for praise. Blame, however, attaches more readily to the *causal agent* of a harmful outcome, even if the *source* of the faulty directive lies elsewhere. Deference *explains* the fault but doesn't *excuse* it for negative outcomes, while it *explains away* the merit for positive outcomes.
      *   **Harm's Salience & Ownership:** Wrongful acts cause identifiable harm, creating a demand for accountability that naturally attaches to the direct actor. Avoiding a permissible act via deference doesn't create a salient positive event demanding credit attribution to the actor; the "credit" (if any) stays with the advisor. The *harm* demands an owner; the *avoided harm* (by doing the right thing) does not create a similar demand for an owner of "credit."

  2.  **Does it Survive Non-Personal Advisors?**
      *   **Likely Intensifies.** UCT appears *stronger* when the advisor is an institution, text, or AI. We readily blame individuals for blindly following harmful company policy, flawed algorithms, or literalist interpretations of texts ("I was just following orders/the manual/the AI"). However, crediting them for good outcomes from the same sources feels even *more* hollow – the credit clearly belongs to the system/designer/text, not the individual who merely implemented it without judgment. The impersonal source makes the lack of agential contribution for praise even starker, while the causal responsibility for harm remains clear.

  3.  **Fault Transfer vs. Merit Attachment?**
      *   **The Description:** "Fault transfers while merit does not" is a valid shorthand, but the deeper description is: **"Fault attaches to the *causal agent* of a wrongful act, *despite* reasonable deference explaining the faulty judgment. Merit attaches only to acts *conjoined with* the agent's own positive moral judgment, which deference inherently lacks."**
      *   **The Perpetual Deferrer:** This is crucial. Under UCT, the perpetual deferrer:
          *   **Is always potentially blameworthy:** Any wrongful act they commit based on deference will incur blame. Their deference explains *why* they erred but does not absolve them of being the *agent* of the wrong. They are held to a standard of *not causing wrongful harm*, even via reliance.
          *   **Is never praiseworthy (for moral judgment):** They never perform an act *because* they judged it right; they only perform acts because they were told. They lack the agential moral contribution required for credit. They might be *reliable* or *compliant*, but not morally *praiseworthy* for their choices.
          *   **Status:** They exist in a state of **moral dependence** or **judgmental passivity**. They avoid *some* blame only by consistently avoiding wrongful acts, but this avoidance stems from luck (good advisors) or compliance, not their own moral agency. They are susceptible to blame whenever their source errs and incapable of genuine moral credit. They are, in a sense, morally underdeveloped or deficient as responsible agents.

  **In Summary:**

  **Unidirectional Culpability Transmission (UCT)** names the phenomenon where blame for wrongful acts flows downstream to an agent acting on a borrowed moral verdict, while credit for right acts does not, due to the deference mechanism itself. It differs by focusing on responsibility transmission via deference, distinct from debates about moral knowledge, general praise/blame asymmetry, or luck. It likely stems from the non-delegable nature of core negative duties and the requirement of personal judgment for moral credit. It intensifies with impersonal advisors. It reveals that while fault attaches to the causal agent of harm regardless of judgment source, merit requires the conjoined positive exercise of the agent's own moral judgment. The perpetual deferrer inhabits a precarious state of potential blameworthiness without the capacity for genuine moral praiseworthiness. This coinage provides a precise lens to analyze this specific, pervasive, and normatively significant asymmetry.
