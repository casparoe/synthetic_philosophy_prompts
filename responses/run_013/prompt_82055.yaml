  The user seems philosophically sophisticated - probably ethics scholar or grad student. Their examples are workplace-focused but the implications span moral philosophy. They might be developing a theory of moral responsibility that challenges standard accounts. The persistent "why" suggests they want not just labeling but explanatory power.

