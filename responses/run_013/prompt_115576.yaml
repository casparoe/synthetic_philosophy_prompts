prompt: |-
  You're a philosopher-historian with real expertise in the theory of moral change — the literature on how whole societies come to abandon practices they'd taken for granted for centuries. Think carefully and slowly here, and start by brainstorming before you commit, because what I'm actualy after is a judgement call and I'd rather watch you reason your way to it than get a list.

  Context: I'm a philosophy professor. I've got a small pot of money for a three-year project — me plus two postdocs, one of whom is really a historian and the other works on ethics — and the topic is how moral revolutions happen. The framing everyone reaches for is: did slavery and dueling and footbinding end because the arguments finally won, or because interests shifted, or because of honor — i.e. someone managed to make the practice shameful to the very people who practiced it? You know the Williams grumble, that the case against slavery had been sitting there for a century and a half and didn't do the work; I can never remember which book he puts it in, so dont lean on that, but you get the target. Appiah's honor story is the other pole.

  I'm not interested in a survey of that debate, and please don't hand me a reading list or a bibliography — I know the literature roughly and I can't use one. What I want is an agenda: which open questions in this area most deserve three years and two postdocs, ranked, with the ranking defended.

  Some hunches of mine to use, attack, or ignore:

  - We've got a selection problem the size of a house. Everyone studies the revolutions that happened. Nobody studies the campaigns that failed, or the practices that are still ticking along. If the question is what makes the difference, the failures are the whole ballgame — and I suspect they're also where the methodology falls apart (how do you count a failed campaign? when is a norm "still going" as opposed to "on the way out"?).
  - I keep thinking there's a replacement condition nobody states cleanly. You can't end a practice until there's something to put in its place — you need wage labour before you can end slave labour, some legal remedy before the duel stops looking like the only recourse for an insult, some other way of being a respectable woman before footbinding goes. Is that a real mechanism or a truism people smuggle into their narratives?
  - Related: the practices that fall are often ones that constituted the identity of the people who practiced them — the duel was part of what it was to be a gentleman. So the mechanism can't just be "make it shameful," you have to hand the practitioner a new way of being what they already are, or the shame has nowhere to land. Is that distinct from the honor story or just a version of it?
  - Everyone says "argument" as if that's one thing. Rhetoric aimed at the uncommitted, arguments aimed at the perpetrators, arguments aimed at third parties who then impose costs on the perpetrators — those are different mechanisms, and I suspect the literature treats them as one.

  So: which of these questions (mine, yours, or something I'm not seeing) are upstream of the others, such that answering them would make the rest easier or moot? Which are tractable for a small team in three years and which would want a historian's decade? Which look important but wouldn't change anything downstream — the kind of thing that gets a good chapter and then nobody uses? How much of each is philosophy and how much is empirical history I'd be subcontracting? And what should I drop to make room for whatever you'd add?

  Give me a defended ordering, not a menu. Say what the criteria are, where they trade off against each other, and what evidence over the next couple of years would move something up or down the list. Finish with the one you'd bet the three years on, and say why that one and not the runner-up.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy professor seeking a prioritized research agenda on moral revolutions, with specific conceptual challenges and practical constraints. 

  First, I need to internalize their core concerns: the selection bias problem, the replacement condition, identity-constitutive practices, and the oversimplification of "argument." Their frustration with existing literature is palpable - they want something that cracks open new terrain rather than rehashing Appiah vs Williams debates. 

  The selection bias issue strikes me as particularly fundamental. If we only study successes, we're essentially sampling on the dependent variable - a classic methodological trap. But how to operationalize studying failures? The user's own questions about defining failed campaigns and norm trajectories show awareness of the difficulties. This might be the hardest but potentially most rewarding angle.

  On the replacement condition, I'm intrigued by how it connects to the identity point. Abolishing practices isn't just removing something but providing alternative scripts for maintaining social standing. This feels underexplored empirically - we'd need comparative cases where replacement mechanisms were present/absent. 

  The "argument" multiplicity point is analytically crucial but may be more philosophy-heavy. Distinguishing rhetorical strategies could refine existing theories without necessarily overturning them. Though if we found that certain audiences (say, third-party enforcers) consistently matter more than persuading perpetrators, that could reshape the field.

  Practical constraints matter: 3 years, 2 postdocs (historian + ethicist). Some questions demand archival depth we can't achieve - like tracking dozens of failed movements globally. But focused comparisons (say, 3 successes vs 3 failures in same period/society) might be tractable. The historian's skills would be vital for sourcing "lost" reform movements.

  For prioritization, I'm leaning toward:
  1) Selection bias as the meta-problem - solving it reorients the whole field
  2) Replacement/identity as the substantive heart
  3) Argument typology as the analytical sharpener

  The bet is on selection bias because it's the foundation. Get that right and we suddenly have valid comparators for testing replacement theories and argument efficacy. Leave it unaddressed and even brilliant work on mechanisms remains suspect. A pilot study on 2-3 paired cases (success/failure) could yield publishable proofs-of-concept within year one.

  Runner-up would be replacement/identity due to its theoretical richness, but it risks becoming descriptive without the selection-bias corrective. The argument typology is important but feels more like a strong chapter than a paradigm-shifter.

  Key evidence to watch: early success in finding "failure" cases would validate the approach; if we hit walls by month 6, we pivot to replacement mechanisms as plan B.
answer: |-
  Here's a reasoned prioritization for your project, balancing conceptual leverage, tractability, and potential to reframe the field. I'll defend a ranking of three core questions, then specify the bet.

  **Core Criteria:**
  1.  **Upstreamness:** Does cracking this open force revision of other explanations?
  2.  **Tractability (3 yrs, 2 postdocs):** Can we make meaningful progress without needing massive archival armies?
  3.  **Empirical-Philosophical Synergy:** Does it require deep integration of historical casework *and* ethical/philosophical analysis?
  4.  **Avoiding Dead Ends:** Can findings be operationalized to test other claims?
  5.  **Selection Problem Mitigation:** Does it inherently address the "success bias"?

  **Ranked Agenda:**

  **1. The Selection Problem & Defining Failure/Stasis (Your "Ballgame" Hunch)**
      *   **Why #1 (Upstreamness & Avoids Dead Ends):** This is the foundation. *All* existing theories (honor, interests, arguments) are built on samples biased towards success. Without understanding *why similar arguments, honor-shifts, or interest-alignments failed elsewhere*, we can't test *what actually made the difference* in successful cases. It forces us to define what "failure" means (e.g., total suppression? marginalization? delayed success?), what "stasis" looks like (entrenched vs. latent conflict?), and how to identify comparable "failed" campaigns or persistent norms. Answering this reorients the entire field.
      *   **Tractability:** Demands careful case selection. Focus on 3-4 *paired comparisons*: e.g., successful abolition vs. failed abolition attempt in similar context/time (e.g., Haiti vs. a failed Caribbean rebellion?); a practice that ended (e.g., formal dueling) vs. a functionally similar, persistent practice (e.g., honor killings where legal recourse exists but is spurned?); a norm challenged successfully (e.g., smoking bans) vs. a persistently "sticky" norm (e.g., meat-eating despite ethical arguments). The historian postdoc is crucial here. Requires defining clear criteria for "comparable" campaigns/practices – a key philosophical/analytical task for you and the ethicist.
      *   **Synergy:** Deeply integrated. Historian identifies cases and evidence of "failure" or persistence. Ethicist/Philosopher analyzes arguments deployed in both success/failure and how "failure" was rationalized. You all grapple with defining the object of study (what counts as a "campaign," "failure," "stasis"?).
      *   **Mitigates Selection Problem:** This *is* tackling the selection problem head-on.
      *   **Evidence Shifter:** If initial case-pair analysis reveals *no* discernible difference in argument quality, honor strategies, or interest alignment between success/failure pairs, it strongly suggests a fundamental flaw in current theories and prioritizes this even more. Success finding robust pairs early validates the approach.

  **2. The Replacement Condition & Identity Reconstruction (Your "Something in its Place" and "Identity" Hunches)**
      *   **Why #2 (Upstreamness & Synergy):** Directly challenges simplistic "honor" or "interest" stories. It asks: *What specific social, economic, or symbolic structures were required as viable alternatives before abandonment became conceivable?* How was a *new, honorable identity narrative* constructed for the practitioners? This isn't just a truism; it demands specifying the *mechanisms* of replacement (e.g., was it functional equivalence? symbolic equivalence? coercive imposition of a new norm?) and the *process* of identity renegotiation. It distinguishes "shame" (negative) from the positive construction of a viable alternative self-conception.
      *   **Tractability:** Builds directly on the cases selected for #1. For each success case (and relevant failure/persistence cases), the team investigates: What functional/symbolic role did the practice serve? What alternatives emerged *before* or *alongside* decline? How were these alternatives framed *in terms of honor or identity* for the former practitioners? Requires close reading of sources (historian) and analysis of ethical/identity discourse (ethicist/you).
      *   **Synergy:** Perfect blend. History identifies the concrete alternatives and traces their emergence/uptake. Philosophy analyzes the conceptual structure of identity narratives, honor codes, and what constitutes a "viable alternative" within a moral framework.
      *   **Relation to Honor:** It refines and deepens the honor story. Making something shameful *requires* offering a non-shameful (indeed, potentially honorable) alternative way to fulfil the underlying need or identity claim. Pure shame without replacement likely leads to backlash or hidden persistence.
      *   **Evidence Shifter:** Finding clear cases where powerful arguments/honor campaigns *failed* precisely because no viable alternative existed (or succeeded only when one emerged) strongly supports its centrality. Finding successful abandonment *without* apparent replacements would downgrade it.

  **3. The Typology of Argument & Audience (Your "Everyone says 'argument'" Hunch)**
      *   **Why #3 (Important, but Downstream Refinement):** This is crucial for precision but likely refines mechanisms within the frameworks established by #1 and #2, rather than overturning them. Distinguishing arguments aimed at perpetrators, bystanders, elites, or mobilizing victims; or between moral suasion, pragmatic harm arguments, and identity-based appeals – provides essential granularity for *how* change (or resistance) happens within the constraints identified by #1 and #2.
      *   **Tractability:** Analyzes discourse within the cases already selected. Ethicist takes lead on categorizing arguments/rhetoric, historian provides context on audience and reception evidence. Can yield significant publications.
      *   **Synergy:** Strong, but leans slightly more philosophical/rhetorical analysis. Historian provides essential grounding in audience and impact.
      *   **Avoiding Dead Ends:** Findings here directly inform *how* the replacement narrative (#2) is communicated and *how* campaigns target different groups to overcome inertia/persistence (#1).
      *   **Evidence Shifter:** Discovering that *only* arguments targeting a specific audience (e.g., third-party imposers of costs) correlate with success in the paired cases (#1) would elevate this significantly.

  **The Bet: Prioritize the Selection Problem & Defining Failure/Stasis (#1)**

  **Why This Over the Runner-Up (Replacement/Identity)?**

  1.  **Foundational Flaw:** The selection bias is the elephant in the room of the entire literature. Ignoring it means any conclusions about mechanisms driving change are built on sand. Addressing it forces a methodological revolution in the field. Until we know *how to identify and study failures/persistence*, we cannot rigorously test *any* other theory (including Replacement/Identity).
  2.  **Creates the Necessary Data:** Successfully defining and identifying "failure" cases and persistent norms within comparable contexts *provides the essential control group* for testing the Replacement/Identity hypothesis (#2) and the Argument Typology (#3). Without this, studying Replacement/Identity, while vital, risks falling into the same success-biased pattern, just with a more sophisticated narrative.
  3.  **Highest Potential for Field-Shifting Impact:** A robust methodological framework for studying moral failure/stasis would be transformative. It moves beyond debating mechanisms within a biased sample to establishing valid comparative analysis.
  4.  **Tractability within Constraints:** Focused, paired comparisons are manageable. Defining "failure" is a hard but tractable conceptual/historical problem central to the team's expertise. Starting here structures the entire project.
  5.  **Why Not Replacement/Identity First?** While profoundly important, investigating Replacement/Identity *without first addressing the selection problem* risks:
      *   Only finding evidence *within successful cases*, reinforcing existing narratives without testing if the absence of replacement explains *failure*.
      *   Struggling to define "viable alternative" without the contrast provided by studying failures where alternatives might have been proposed but rejected, or persistence where alternatives exist but are ignored.

  **Project Structure Implications:**

  *   **Year 1:** Develop robust definitions/frameworks for "moral campaign," "failure," "persistence/stasis," and criteria for selecting paired cases (Success/Failure; Ended/Persistent). Begin deep dive into 1-2 initial paired cases.
  *   **Year 2:** Execute core comparative analysis of paired cases, focusing on presence/absence of arguments, honor dynamics, interest shifts, AND crucially, evidence of replacement mechanisms/identity reconstruction attempts. Refine frameworks.
  *   **Year 3:** Synthesize findings on selection/failure, test Replacement/Identity hypothesis across the cases, refine Argument Typology based on findings. Focus on field-shifting methodological output + core theoretical insights on failure/replacement.
  *   **Drop?** Avoid a broad survey of *all* mechanisms in *all* famous successes. Focus intensely on the comparative method enabled by tackling the selection problem. Minimize time spent re-litigating Appiah vs. Williams on their own terms.
  *   **Subcontracting:** The historian is absolutely critical for case identification, sourcing evidence of "failed" campaigns/persistence, and contextual analysis. The ethicist is vital for argument/rhetoric analysis and conceptual work on defining failure/identity/replacement. Your role: integration, philosophical rigor on definitions, and driving the comparative methodology.

  **The Winning Bet:** By making the selection problem and the study of failure/persistence the cornerstone, your project has the highest chance of producing not just another contribution to the existing debate, but a fundamental recalibration of *how* we study moral revolutions, setting a new standard for rigor and providing the essential groundwork to finally test *which* mechanisms actually make the difference.
