  Im not a mathematician, I just read too much stuff online, and I cant stop chewing on this one: maybe the basic axioms of arithmetic -- or of set theory, or both -- are just inconsistent, and the contradiction is sitting there but nobody's ever written it down because the proof would be longer than the universe or something. Give me your actual credence in that, a number, not 'well, nobody can rule it out'. And break it down, rough number plus one line of justification for each piece: how likely a contradiction is hiding in plain arithmetic; how likely one is hiding in the set-theory axioms; whether the extra axioms mathematicians keep bolting on when they need them (the big-infinity ones) make it worse, since every axiom you add is another thing that could be broken; how likely it is we'd ever actually find a contradiction if one were there; how likely it is the whole question even has a determinate answer, rather than 'consistent' being a word we sort of define into existence; and how much the fact that you can only prove a system consistent by assuming something even stronger should raise my number. Then say how you'd combine those into one number, which term it's most sensitive to, and what would actually move it. Oh and a friend told me there's a theorem proving we can never know either way, which I'm pretty sure is a misreading, so address that too. My gut says 0.05, my friend says 0.4 and calls me naive -- whos closer?
