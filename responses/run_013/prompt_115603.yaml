prompt: |-
  I'm a third-year PhD student in philosophy, working on idealization and feasibility in epistemology and decision theory, and for the past term I've been meeting roughly weekly with a postdoc in my department who works on bounded rationality. A standing exercise in these meetings is that I put a classical norm to her and she tells me whether she regards it as a genuine requirement on agents like us or as an idealization we should stop treating as binding; after a dozen or so of these I have noticed that her verdicts are remarkably stable even though she has never once stated the criterion she is applying. The pattern, as best I can reconstruct it, runs like this: an agent is genuinely required to keep her credences in line with the probability axioms and to avoid believing a contradiction; an agent is not required to believe everything that follows from what she already believes; an agent is not required to conditionalize her credences on her total evidence, because the required update is intractable in the worst case (she usually puts it as: exact inference in a general probabilistic model is #P-hard, so the norm can demand a computation that no procedure will ever finish in time); an agent is required to maximize expected utility when the options are few, explicitly enumerated, and their probabilities given; and an agent is not required to find the exact optimum of a combinatorial problem once exact optimization is NP-hard, but is required to use a procedure guaranteed to land within a fixed factor of the optimum whenever such a procedure exists.

  I want to work out what rule she is actually running before I put the next case to her, since I suspect the case is going to embarrass one of my current guesses and I would rather see it coming. The case is this: a norm requiring the agent to select the option that is exactly optimal for a family of combinatorial problems. There is a polynomial-time algorithm for this family, so the problem is in P rather than merely decidable, but the best known algorithm runs in time on the order of n^1000 with constants that make it hopeless on any input longer than a few dozen bits, and the problem is P-complete, so nobody seriously expects parallelism to rescue it; as a matter of empirical fact, no agent of our kind could ever comply with the norm on any instance that matters. Given her track record, what is she going to say about this one?

  What I need from you is the reasoning rather than merely the verdict. State as precisely as you can the criterion that best explains her earlier judgments, tell me which other criteria are equally consistent with every one of them, and say what each of those criteria predicts about the new case; then give me your best guess at what she will say, with the reasons for preferring that criterion over its rivals. Finally, tell me which further case would separate the criteria that the new case leaves tied, and flag any of her earlier verdicts that sits awkwardly with the rule you favour — I am trying to get this into a framing section of my prospectus and a loose end here would cost me more than it should. I don't need references or a reading list; I will fill those in myself, and I would rather you spend the space on the analysis.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is a PhD student in philosophy, working on idealization and feasibility in epistemology and decision theory. They've been meeting with a postdoc who specializes in bounded rationality. The exercise involves the student presenting classical norms, and the postdoc judges whether they're genuine requirements for real agents or just idealizations. The student has noticed a pattern in her responses and wants to predict her reaction to a new case involving a P-complete problem with an impractical polynomial-time algorithm.

  First, I need to analyze the pattern from her past verdicts. She accepts probability axioms and avoiding contradictions as requirements. But she rejects believing all logical consequences and exact Bayesian updating because of computational infeasibility. For decision-making, she requires expected utility maximization only when options are few and explicitly given. She rejects exact optimization for NP-hard problems but accepts using approximation algorithms with guaranteed factors when available.

  The key seems to be computational tractability in practice, not just in theory. NP-hardness and #P-hardness are used to justify rejecting norms because no efficient algorithms exist. But she accepts approximations when feasible. The new case is a P-complete problem with an n^1000 algorithm—technically in P but practically infeasible.

  I should consider different possible criteria she might be using. One could be polynomial time with low exponents and constants. But she accepts probability axioms which might involve computations that aren't trivial. Another could be average-case complexity, but she mentions worst-case (#P-hard). A third might be the existence of feasible algorithms in practice, considering real-world constraints. That seems to fit better since she emphasizes "no procedure will ever finish in time" and "no agent of our kind could ever comply."

  The new case is practically infeasible despite being in P. So criteria focusing on practical feasibility would reject the norm. Other criteria like polynomial-time might accept it, but that contradicts her rejection of the Bayesian update which is also intractable in practice. The user mentions that the algorithm is hopeless for inputs beyond a few dozen bits, which aligns with her emphasis on tractability for actual agents.

  For the verdict on the new case, if her criterion is practical feasibility, she should reject the norm requiring exact optimization. This matches her past rejections of norms with intractable computations. The P-completeness suggests that no parallelization can help, reinforcing the infeasibility.

  To distinguish between criteria, a good test case would be a problem in P with a reasonable exponent (like n^3) but large constants, making it infeasible for some inputs. If she rejects it, she prioritizes practical feasibility; if accepts, she might care more about polynomial time theoretically. Another test could be an NP-hard problem with an efficient approximation, which she accepts based on past examples.

  One awkward point is her acceptance of probability axioms. Computing probabilities for complex events can be hard, but she still requires it. Maybe she sees basic probabilistic coherence as non-computational, or assumes simple cases. This might need clarification, perhaps as a foundational requirement separate from computational norms.

  For the user's prospectus, highlighting the practical feasibility criterion makes sense. It explains most verdicts, though the probability axiom point might need addressing. The new case should be rejected based on this, and further test cases can refine the criterion.
answer: |-
  Based on the pattern of verdicts and the emphasis on computational constraints for "agents like us," the postdoc's criterion appears to be grounded in **practical feasibility under bounded computational resources**. The core principle is: **A norm is a genuine requirement only if compliance is *practically computable* for agents with human-like cognitive limitations, given realistic constraints on time, memory, and processing power.** This prioritizes *feasible execution* over *asymptotic complexity class*, focusing on whether actual agents can reliably compute the required output for inputs of relevant sizes within their cognitive lifetimes.

  ### Precise Criterion
  **Genuine Requirement Criterion (GRC):**  
  A norm \( N \) imposing a computational task \( T \) (e.g., updating credences, optimizing a decision) is binding iff:  
  1. \( T \) admits a procedure \( P \) that is **known to be correct** (e.g., sound/complete for logical norms; optimal for decision norms).  
  2. \( P \) is **practically computable** for all inputs of size \( n \) encountered in domains relevant to human agents, given realistic constraints on resources (time, space, parallelism).  
     - **Practical computability:** \( P \) must terminate with the correct output *within a reasonable time* (e.g., seconds/minutes/hours, not years or lifetimes) on inputs of sizes typical for human-scale problems (e.g., \( n \leq 10^6 \) bits for decision problems, though often much smaller).  
     - **Key thresholds:**  
       - Rejected if \( T \) is #P-hard or NP-hard *in the worst case* (as no known correct procedure is feasibly computable for all \( n \)).  
       - Rejected if \( T \in P \) but the best correct procedure has **prohibitive concrete complexity** (e.g., exponents ≥1000, large constants, or insufficient parallel speedup).  
       - Accepted for \( T \in P \) with **low-complexity procedures** (e.g., \( O(n^2) \) with small constants).  
       - Accepted for hard problems (e.g., NP-hard) if a **feasible approximation** exists (e.g., fixed-factor guarantees).  

  ### Alternative Criteria Consistent with Past Verdicts
  1. **Asymptotic Polynomial-Time (APT):**  
     - Binding iff \( T \in P \).  
     - *Predicts ACCEPT for the new case* (P-complete → in P).  
     - Consistent with rejecting #P-hard Bayesian update (∉P) and NP-hard optimization (∉P), but *inconsistent* with rejecting logical omniscience (deduction is in P for propositional logic).  

  2. **Feasible Approximation (FA):**  
     - Binding iff \( T \) admits a feasibly computable *approximation* with *known guarantees* (e.g., fixed-factor optimal).  
     - *Predicts REJECT for the new case* (exact optimum required, but procedure is infeasible).  
     - Consistent with all past verdicts:  
       - Accepts probability axioms (trivially feasible) and approximation procedures.  
       - Rejects Bayesian update (no feasible exact *or* bounded-approximation procedure in general), NP-hard exact optimization, and logical omniscience (no "approximation" for deduction).  

  3. **Worst-Case Hardness (WCH):**  
     - Binding iff \( T \) is *not* (NP-hard, #P-hard, or P-complete).  
     - *Predicts REJECT for the new case* (P-complete).  
     - Consistent with rejecting #P-hard Bayesian update and NP-hard optimization, but *inconsistent* with:  
       - Rejecting logical omniscience (deduction is coNP-complete, not NP/#P-hard).  
       - Accepting expected utility with few options (often NP-hard in explicit form).  

  ### Prediction for the New Case & Best-Guess Criterion
  - **The new case:** A norm requiring exact optimization for a P-complete problem with best-known algorithm \( O(n^{1000}) \) and infeasible for \( n > 50 \).  
  - **GRC predicts REJECT:** Compliance is practically impossible for "any instance that matters," violating condition (2) of GRC.  
  - **FA also predicts REJECT** (no feasible exact procedure).  
  - **APT predicts ACCEPT** (since \( T \in P \)).  

  **Best-Guess Criterion: GRC (Practical Feasibility)**  
  *Reasons to prefer GRC:*  
  - Directly explains the rejection of Bayesian updating (#P-hard → worst-case intractable *and* empirically infeasible).  
  - Explains the *asymmetry* in decision norms:  
    - Expected utility accepted only for "few, enumerated options" (feasible enumeration).  
    - NP-hard optimization rejected (infeasible), but approximations accepted if feasible.  
  - Resolves the P-complete case: GRC rejects it due to concrete infeasibility, while APT incorrectly accepts it and WCH rejects it for the wrong reason (P-completeness ≠ hardness in her framework).  
  - Aligns with her emphasis on "no procedure will ever finish in time" and "no agent of our kind could ever comply."  

  ### Inconsistent Verdict under GRC
  - **Awkward verdict:** Requiring credences to obey probability axioms.  
    - **Problem:** Coherently updating joint probabilities for \( k \) independent beliefs is \( O(2^k) \) in general—infeasible for large \( k \).  
    - **Why awkward?** GRC should reject this for non-trivial belief sets, yet she accepts it.  
    - **Plausible reconciliation:** She may implicitly assume "axiom compliance" only applies to *explicitly represented* beliefs (e.g., avoiding incoherence in stored credences), not closed under logical operations. This aligns with rejecting logical omniscience.  

  ### Further Case to Separate GRC and FA
  - **Case:** A norm requiring an agent to compute the exact solution to a problem in \( P \) with complexity \( O(n^3) \), but with a large constant factor (e.g., \( 10^{15} \cdot n^3 \) steps). For \( n = 1000 \), this takes ~\( 10^{24} \) steps; infeasible on any real computer (>100 years at 1 THz).  
  - **Predictions:**  
    - **GRC:** REJECT (concrete infeasibility despite \( O(n^3) \)).  
    - **FA:** ACCEPT (since exact solution is required and \( T \in P \), ignoring constants).  
    - **Result:** If she rejects it, GRC is confirmed; if she accepts, FA is supported.  

  ### Summary for Your Prospectus
  - **Her likely verdict for the new case: REJECT.** The norm is an infeasible idealization because \( n^{1000} \) is practically uncomputable for relevant inputs.  
  - **Dominant criterion:** Practical computability (GRC), which weighs concrete resource constraints over asymptotic class.  
  - **Key tension:** Her acceptance of probability axioms vs. GRC’s expectations—resolve by noting her focus on *local* coherence (not global joint distributions).  
  - **Framing recommendation:** Position GRC as a "feasibility-sensitive" criterion bridging computational complexity and bounded rationality, contrasting it with purely asymptotic (APT) or guarantee-based (FA) approaches. The P-complete case exemplifies how "polynomial-time" alone is insufficient for genuine requirements.  

  This gives you a testable criterion (GRC), a clear prediction (reject), a diagnostic follow-up case (high-constant \( O(n^3) \)), and a targeted response to the probability-coherence tension. No loose ends for the prospectus.
