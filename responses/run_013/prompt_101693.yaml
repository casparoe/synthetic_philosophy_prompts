  Then the deeper question: can a culture *choose* its dominant emotion, or just the rituals around it? The historian will say emotions are baked into social practices; the philosopher might insist norms can be taught. I’ll end on a stalemate—philosophical respect but no tidy resolution—because that’s how real debates go. 

