prompt: |-
  Hi — I'm a third-year student in an international criminal law seminar (we've spent the last month on Nuremberg and Tokyo) and I have to present my paper to the class next week. What I need from you isn't the paper, it's the Q&A prep.

  Here's the thesis. Everyone fights about Nuremberg and Tokyo as an ex post facto problem: were crimes against peace and crimes against humanity really crimes when the defendants acted, or did the Charters invent them and then apply them backwards — the standard reply being that aggressive war was already illegal under the Kellogg-Briand pact and customary law, so the Charters just declared what was already there. I want to argue that this is the wrong place to look. The retroactivity that actually bites isn't in the crimes, it's in the excuses. Superior orders, act of state, tu quoque, and arguably duress were either abolished outright or downgraded to mitigation only, and only for the losing side. So the tribunals didn't just make new offences, they made a new law of defences, applicable to the vanquished alone, and the same powers that wrote the rulebook also supplied the prosecutors, the bench and the charges. I want to claim that's a worse rule-of-law problem than the new crimes — harder to see, and untouched by the usual "but it was already illegal" reply. I also want to pull apart the four or five seperate complaints that get bundled under victors justice (selective enforcement, ex post facto offences, winners writing the rules and sitting in judgment, the tu quoque bar) and say which are genuinely about law and which are only about enforcement, because I think a couple of them are red herrings and I want to be the one who says so first.

  Now the room. Our professor is a doctrinal ICL person who's written on command responsibility, treats Nuremberg as the origin story of the whole field, and gets visibly irritated when students say victors justice — she'll go straight at whether I'm confusing substance with procedure, and she knows the Charter provisions better than I do. There's a Japanese exchange student writing her thesis on the Tokyo judgment who knows the separate opinions backwards and will not let me treat Nuremberg and Tokyo as one object; she'll want to know what happens to my excuse argument once the Tokyo charter, the murder counts and the dissents are on the table. There's a legal philosopher who teaches rule of law and thinks this is all the Hart/Fuller debate in costume, and will ask whether my objection is a positivist one or a natural law one. Two classmates who skimmed the reading and will ask something like isnt this just saying the winners write history. And one guy who's read a lot of popular history and thinks the real scandal is that Dresden and the firebombing of Tokyo were never on the docket. Nobody in the room has heard of my retroactive-defences distinction, so I have to sell it from scratch in ninety seconds before the objections even start.

  Give me a prep sheet: the objections in roughly the order they'll actually come, each phrased in the voice of whoever is going to make it, ranked by how much damage they do to my thesis rather than by how likely they are (I can handle the obvious ones), what I should concede upfront, what I should hold, a reply I can deliver in two minutes or less, and a note on where that reply is soft or where I'd be bluffing. Flag the objections that are really one objection wearing different hats, and the ones I can safely let bounce off. Then tell me the one question I'm hoping nobody asks — I'd rather find out from you now than in the room. Don't give me reading lists or citations, I can't look anything up while I'm standing there; I need arguments I can actually run out loud. And if part of what I sketched above is just wrong — if the superior-orders point is messier than I think, or if Tokyo breaks the whole thing — say so, don't help me defend something indefensible.
reasoning: |-
  Okay, let me unpack this user's request. They're a third-year law student preparing for a seminar Q&A on their paper about retroactive defenses in Nuremberg/Tokyo tribunals. The core argument is that while retroactive crimes get attention, the real rule-of-law violation was retroactively stripping defenses (superior orders, act of state etc.) only from the losers. 

  Hmm, this is sophisticated but risky - they're challenging sacred cows of international criminal law. The user clearly knows their stuff but might be underestimating three things: 1) how deeply the "victor's justice" critique is baked into ICL scholarship, 2) doctrinal nuances in how different tribunals handled defenses, and 3) that their "new" distinction about defenses might actually have precedents they haven't cited. 

  *checks imaginary watch* Their 90-second pitch needs to disarm four landmines immediately: 
  First, the professor's doctrinal objection about substance vs procedure - must concede Charter Article 8 did preserve superior orders as mitigation while demolishing it as defense. 
  Second, the Tokyo expert will crucify them if they lump Nuremberg Article 8 with Tokyo's murkier Article 6. Better to preemptively distinguish them. 
  Third, the legal philosopher will smell blood if they can't place this in Hart/Fuller framework. Should frame it as procedural retroactivity violating Fuller's "congruence" principle. 
  Fourth, that popular history guy will derail everything with Dresden - need to quarantine that as enforcement issue unrelated to defenses. 

  *scribbles mental flowchart* The killer question they're dreading: "If the Allies genuinely believed these defenses were immoral shields, wasn't downgrading them progressive development rather than retroactive punishment?" That exposes the normative core they haven't addressed - it forces them to argue either that the tribunals were wrong about morality (dangerous) or that morality can't override legality (controversial). 

  Biggest vulnerability: Tokyo's dissenters like Röling actually DID consider superior orders a defense in mitigation hearings, which slightly undermines the "abolished outright" claim. They'll need to admit this but pivot to "the Charter still retroactively denied full exculpation." 

  *imagines audience* For the skimmers asking "winners write history?", a one-liner about how their point is specifically about denial of due process defenses, not just outcome bias. Save breath for real fights. 

  Final prep note to self: When they say "don't help defend indefensible" - Tokyo's murder counts under conspiracy DO break their thesis if they claimed all crimes were pre-existing. Must clarify crimes vs defenses are separate issues.
answer: |-
  Here's a battle-tested Q&A prep sheet focused on damage control, strategic concessions, and rapid-fire responses. I've flagged vulnerabilities and ranked objections by *impact* on your thesis (High/Medium/Low). **Crucial Reality Check:** Your core insight is powerful, but the *superior orders* point is messier than you present, and **Tokyo's differences WILL undermine you if not addressed upfront.** Concede nuance early.

  **The Killer Premise You MUST State in Your 90-Second Intro:**
  > "My argument is NOT that the tribunals invented *crimes* retroactively – that debate is familiar. It's that they retroactively **altered the *conditions of liability*** by stripping away established legal shields (excuses/defences) only from the vanquished, creating a unique procedural injustice untouched by the 'Kellogg-Briand' rebuttal. This selective denial of defences is the deeper rule-of-law flaw in *Nuremberg* and, critically, with variations, in *Tokyo*."

  **Objections & Counter-Prep (Ranked by Damage Potential):**

  1.  **The Professor (Doctrinal - High Damage):** *"You're conflating substance and procedure. Article 8 of the Nuremberg Charter didn't 'abolish' the superior orders defence; it merely prevented it from being a *complete* defence, allowing it in mitigation. This was a *procedural rule* about evidence and sentencing, not a retroactive substantive change. Doesn't this significantly blunt your argument?"*
      *   **Concede:** Yes, Article 8 allowed superior orders for mitigation. This is doctrinally precise.
      *   **Hold:** But it **retroactively changed the *legal effect*** of acting under orders. Pre-Charter, in many systems (including German military law *in practice*), it *could* be a complete defence to certain charges. The Charter declared it categorically *never* a complete defence *for these defendants*. This downgrade itself is a retroactive change to the legal consequences of their conduct. More damningly, **Act of State and *Tu Quoque* WERE abolished outright as defences** at Nuremberg (Charter Art 7, and implicitly through rulings rejecting the defence). *That's* the substantive retroactivity.
      *   **Reply (90 sec):** "You're right on Article 8's wording – mitigation was preserved. But functionally, it stripped away the *exculpatory* power superior orders *might* have had under pre-existing legal frameworks applicable to the defendants. Crucially, Article 7 *did* abolish Act of State completely and retroactively. The *combined effect* was a novel, retroactive narrowing of available defences created solely for the vanquished. The rule-of-law concern is that the victors retroactively defined not just what was *criminal*, but also what *couldn't excuse* criminality *for their enemies*."
      *   **Vulnerability:** If the Prof presses hard on whether superior orders *was ever* a reliable complete defence in international law pre-1945, you might need to retreat to "it was arguable/potentially applicable, and the Charter foreclosed that argument retroactively." Focus on Act of State/Tu Quoque.

  2.  **The Tokyo Expert (High Damage - Don't Lump Them!):** *"You're treating Nuremberg and Tokyo as identical. They weren't. The Tokyo Charter (Art 6) was even *stricter* on superior orders – no mention of mitigation, arguably abolishing it entirely. Worse, convictions for 'conspiracy to commit murder' were based on acts *before* the war even started, acts not clearly illegal then. And dissenting judges like Röling argued forcefully that applying *ex post facto* norms, especially regarding defences, violated fundamental justice. Doesn't Tokyo fatally undermine your thesis by showing the retroactive denial of defences was *even more extreme and unjust* there?"*
      *   **Concede:** Tokyo *is* different and arguably worse. The Charter wording on superior orders was more severe, conspiracy charges were novel and expansive, and the dissents highlight the injustice starkly.
      *   **Hold:** **This *strengthens* my core point about retroactive defences.** Tokyo is the *logical extreme* of the Nuremberg approach. The victors (with MacArthur's influence) wrote an *even harsher* rulebook on excuses/defences *retroactively*. The dissents (Pal, Röling) explicitly condemn *this exact issue* – the retroactive alteration of legal safeguards. Tokyo isn't a counter-example; it's the *clearest evidence* of the victors' power to retroactively define the rules of liability for the vanquished.
      *   **Reply (90 sec):** "Tokyo is crucial precisely because it magnifies the Nuremberg flaw. The Tokyo Charter *did* potentially abolish superior orders even as mitigation outright, going beyond Nuremberg. The novel 'conspiracy to murder' charges *relied* on stripping away any potential Act of State or other defences for pre-war political acts. The powerful dissents by Pal and Röling *directly attack* the retroactive denial of established defences as a core injustice. Far from undermining my thesis, Tokyo exemplifies its worst manifestation. It shows the victors' unchecked power to retroactively dismantle the legal safeguards *they* enjoyed."
      *   **Vulnerability:** You MUST acknowledge Tokyo's differences immediately in your intro/premise. Failure to do this will sink you. The murder/conspiracy point is strong – link it to the denial of defences for those *specific* novel charges.

  3.  **The Legal Philosopher (Medium/High Damage - Framing Matters):** *"Isn't your objection fundamentally a *positivist* one? You're arguing the tribunals violated formal legality (no retroactive laws) specifically concerning defences. But a *natural law* perspective might argue that these defences (like Act of State for aggression) were morally illegitimate shields for monstrous acts *anyway*, and the tribunals were rightly developing law to close immoral loopholes. Is your critique purely about form, ignoring substance?"*
      *   **Concede:** From a strict positivist view (law is only what is posited), the retroactivity is clear. A natural law view *could* justify overriding form for substantive justice.
      *   **Hold:** **My critique is *primarily* about the rule of law's formal principles (predictability, non-retroactivity, congruence) as essential safeguards against arbitrary power, *even when* pursuing substantive justice.** Applying new defences rules *only to the losers* is the epitome of arbitrariness. If natural law justifies retroactively stripping defences from only one side, it risks becoming victor's morality. Fuller's "inner morality of law" requires congruence and non-retroactivity precisely to prevent such arbitrariness.
      *   **Reply (90 sec):** "The rule of law requires formal constraints *precisely* to guard against arbitrary power, even wielded for seemingly good ends. Retroactively changing the rules of liability *only for the defeated enemy* violates the principle that law must be general and applied equally. A natural law justification *for this selective retroactivity* is deeply problematic – it essentially says 'might makes right' in defining which moral loopholes get closed and for whom. Fuller argued retroactivity destroys law's ability to guide conduct; here, it destroyed the defendants' ability to rely on *any* existing legal shield."
      *   **Vulnerability:** If they push "But wasn't it *morally necessary*?", you *must* pivot back to selectivity: "Then why weren't *Allied* soldiers/politicians subject to the same retroactive abolition of *their* potential defences? The moral necessity argument collapses when applied so selectively."

  4.  **"Winners Write History" Guy (Low Damage - Redirect):** *"Isn't this all just saying the winners write the history? They won, they set up the courts, they made the rules. What's new about your 'defences' point?"*
      *   **Concede:** Selective enforcement ("victor's justice") is a broad critique.
      *   **Hold:** **My point drills down to a *specific, legally distinct* mechanism of injustice within that broader critique.** It's not just that winners *prosecute* losers (enforcement) or invent crimes (substantive retroactivity). It's that winners *retroactively changed the legal defences available* to the losers, a procedural innovation that compounded the unfairness. This aspect is often overlooked in the "winners write history" gloss.
      *   **Reply (30 sec):** "Absolutely, 'winners write history' captures the power imbalance. But my point identifies the *specific legal tool* they used *within* the courtroom: rewriting the rulebook on what excuses would be allowed *after the fact* and *only for one side*. It's the difference between winning and changing the rules of the game retroactively against your opponent."
      *   **Strategy:** This is low damage. Give a concise reply showing your point adds precision, then move on. Don't get bogged down.

  5.  **The Dresden/Firebombing Guy (Low Damage - Quarantine):** *"The real issue is hypocrisy! Why weren't Churchill or Truman in the dock for Dresden or Tokyo firebombing? *That's* victor's justice – prosecuting the enemy's atrocities while ignoring your own."*
      *   **Concede:** Selective prosecution is a valid critique of the tribunals.
      *   **Hold:** **This is fundamentally about *enforcement* (who gets charged), not about the *retroactive alteration of the legal rules governing liability* (my thesis).** My argument focuses on the *rules applied within the trial itself* being retroactively changed to disadvantage the defendants. The failure to prosecute Allied leaders is separate (though related to the broader "victor's justice" context).
      *   **Reply (45 sec):** "The failure to prosecute Allied leaders is a serious issue of *selective enforcement*, absolutely. But my argument is about a different layer: the *rules of the tribunal itself*. Even if Allied leaders *had* been prosecuted, they would likely have been able to raise defences like superior orders or Act of State – defences the Nuremberg and Tokyo Charters retroactively denied to the German and Japanese defendants. That's a distinct rule-of-law flaw *within* the courtroom procedure."
      *   **Strategy:** Clearly separate enforcement from the procedural/defence rule change. Acknowledge their point but show yours is different. Don't let this derail you.

  **The One Question You Hope Nobody Asks (Because It's Hard):**
  > **"If the established defences like Act of State and absolute superior orders were seen by the Allies (and much of the world) as morally repugnant *shields for atrocity*, and their abolition/downgrade was a *progressive development* towards holding leaders accountable, how can you condemn that retroactivity as a *rule-of-law violation* without implicitly endorsing those morally bankrupt shields? Isn't this a case where the formal rule of law conflicted with substantive justice, and the latter *should* prevail?"**

  *   **Why it's devastating:** It forces you to choose: Defend morally repugnant legal shields or admit that retroactive abolition might have been necessary/justified, gutting your rule-of-law critique. It targets the normative heart of your argument.
  *   **How to Mitigate (Bluff/Partial Concession):**
      1.  **Concede the Moral Appeal:** "The desire to close these perceived loopholes was understandable and morally driven."
      2.  **Pivot to Selectivity & Legality:** "But the rule of law *requires* that such fundamental changes to liability be prospective and general. Applying them *only* to the vanquished, *retroactively*, transforms a potentially progressive development into an instrument of victor's vengeance. It proves the victors weren't truly establishing universal principles, but crafting *ad hoc* rules to condemn the defeated."
      3.  **Appeal to Long-Term Harm:** "This selective retroactivity *undermined* the legitimacy of the new principles. It fueled the 'victor's justice' narrative and made the development of *genuinely universal* ICL harder. Lasting legitimacy requires adhering to legality, even when it's difficult."
      4.  **Distinguish Development vs. Retroactive Application:** "Progressive development is essential. But it must be done through treaties or state practice *going forward*, not retroactive application *against a defeated foe alone*."
  *   **Vulnerability:** This is philosophically tough. Your best bet is to emphasize the **selectivity** as the core injustice, not the moral desirability of the new norm *per se*. Argue that retroactivity + selectivity destroys the rule-of-law character of the enterprise.

  **Critical Corrections & Notes:**

  1.  **Superior Orders Nuance:** You **overstate** "abolished outright." Nuremberg Art 8 *allowed it for mitigation*. Tokyo Art 6 *was* stricter ("The fact that the Defendant acted pursuant to order... may be shown...") implying it wasn't a defence, only mitigation evidence. Be precise. Focus more on **Act of State** (Art 7 Nuremberg: "official position... shall not be considered...") and **Tu Quoque** (rejected by the bench) as clearer abolitions.
  2.  **Tokyo Breaks Uniformity:** You **cannot** credibly treat Nuremberg and Tokyo as one. Tokyo's differences (Charter, charges, dissents) are central, not peripheral. **Your thesis holds *because* Tokyo shows the *extent* of the victors' power to retroactively manipulate defences, not despite it.** Address this head-on.
  3.  **"Untouched by the usual reply":** This is strong. The "Kellogg-Briand" argument only addresses crimes, not the retroactive stripping of defences. Hammer this.
  4.  **Selling the Distinction:** In your 90-second pitch, use clear analogies: "Imagine being tried under new laws *and* being told the legal excuses you thought existed no longer apply, *only* to you, because you lost."

  **Summary Strategy:**

  *   **Open Strong:** Clearly define your novel distinction (Crimes vs. Defences) and immediately acknowledge Tokyo's significance/differences.
  *   **Concede Nuance:** On superior orders mitigation upfront. Don't overclaim.
  *   **Focus Fire:** Act of State and Tu Quoque are your clearest wins for abolished defences. Emphasize retroactivity + selectivity.
  *   **Redirect:** Separate enforcement (Dresden, selective prosecution) from procedural retroactivity (defence rules).
  *   **Frame Philosophically:** Ground your critique in rule-of-law formalism (predictability, non-retroactivity, generality) damaged by selective retroactive defence changes.
  *   **Dreaded Question Prep:** Rehearse the "Selectivity Saves" argument for the moral-progress challenge.

  Good luck! Your thesis is provocative and insightful. Owning its complexities will make your defense stronger.
