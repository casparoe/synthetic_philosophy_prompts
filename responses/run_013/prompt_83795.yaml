  First, I need to unpack the user's central concern. Galileo argued that when scripture describes natural phenomena (like the sun moving), it's using common language of the time, not making scientific claims. This allowed reconciling faith with scientific discoveries. But the user finds this move terrifying because it's the same tactic used by cranks and institutions to evade inconvenient truths by claiming "this was never about that." Their lawyer friend points out this parallels originalism in legal interpretation. So the key question is: what makes such reinterpretations legitimate rather than self-serving?

  The user has three hypotheses:
