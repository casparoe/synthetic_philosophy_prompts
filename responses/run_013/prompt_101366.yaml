prompt: |-
  I am presenting a paper to a philosophy department colloquium whose members are mostly formal epistemologists who assess credences by accuracy, plus two decision theorists and one reliabilist; no one in the room specializes in the epistemology of disagreement. My thesis is that epistemic akrasia can be rationally permissible in a narrow class of cases: when the first-order evidence concerns the truth of p, the higher-order evidence concerns the reliability of the process that produced my belief that p, and the two bodies of evidence are not commensurable because they partition the space of possibilities differently. Draft my Q&A prep sheet: the objections I will actually get from this audience, ordered by how likely and how damaging they are, each phrased in their vocabulary, with a two-minute reply and a note on where the reply is weakest. Include the objection I am hoping nobody raises.
