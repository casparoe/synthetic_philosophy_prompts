prompt: |-
  My flatmate and I have been arguing about Pascal's mugging for about three months now — over coffee, over the washing-up, once on a night bus — and we've finally agreed to stop talking past each other and write down what an advesarial collaboration between us would actually look like. The annoying thing is that we agree on more than either of us wants to admit: we're both expected-utility people, we both think the mugger's threat is astronomically unlikely, and we both think the usual "it's just a silly thought experiment, ignore it" brush-off is a cop-out that never engages the argument. Where we've ended up is that I think the mugging is a reductio — that it shows something has to give in how we handle minuscule probabilities attached to enormous payoffs — and he thinks the conclusion is a bullet you're meant to bite, and that if biting it feels absurd that's just a fact about our intuitions, not about the decision rule. We keep re-deriving the same three sub-questions and I suspect only one of them is doing any real work: (i) whether something like a one-in-ten-to-the-hundredth chance is a genuine credence at all, or just a placeholder we write down when we've got no idea; (ii) whether it's legitimate for a decision rule to be sensitive to stakes in a way ordinary probability theory isn't — i.e. whether you're allowed to let the size of the payoff rather than the chance of it do the deciding; and (iii) whether it matters that there are indefinitely many mutually exclusive muggers, gods and anonymous benefactors, so that any single unfalsifiable story has to share its probability out among all the others. Two ideas we've both found interesting enough to actually argue about: the dilution thought (an unfalsifiable story is one of indefinitely many equally cheap stories, so maybe its probability should be divided among them rather than assessed on its own), and the credibility condition (a threat only generates a reason to act if it's a threat some agent in your actual ontology could carry out — so a mugger who is, in your model, just a man in an alley has no infinite leverage). I've definately not thought either of those through properly, which is sort of the point.

  What I want from you is the document we should have produced months ago. Not a verdict on who's right — I'm not asking you to adjudicate — but the joint statement that two people in our positions could both put their names to. So: first, a numbered list of the claims we can both sign, covering what the mugging argument actually says step by step, what expected-utility theory does and doesn't commit us to, what each of us is using "credence" and "utility" to mean, and what the mugging does and doesn't show. Then the precise points of disagreement, each phrased so that each side would accept the wording of its own position rather than the other's caricature of it. Then the cruxes — the sub-questions such that settling one would actually move at least one of us — and for each crux the one case or argument we'd both agree bears on it, with each of our predictions about it written down in advance. Two cases we keep coming back to, which you can use if they're the right ones: a ticket machine that sells you, for a pound, a one-in-an-absurdly-large-number chance of an absurdly large good, and the mugger's cousin, who offers you the exact same huge good if you refuse to pay. If part of our disagreement turns out to be merely verbal — if we're using "rational" or "possible" in two seperate senses — say which part and why, because I'd honestly rather find that out than keep arguing.

  Lay it out as a numbered agreed-claims section followed by a disagreements table, and keep the neutral wording genuinely neutral: nothing in the agreed list that either of us would wince at, and nothing in the disagreement column that's easier to knock down than the position it's meant to represent.
