  Based on your advisor's established rulings and stated tendencies, I infer that his core demarcation principle is a **modified Lakatosian framework emphasizing empirical responsiveness and institutional engagement**, supplemented by sociological vigilance against outsider dismissiveness and gatekeeping inertia. Below is the rule analysis, verdict predictions for your cases, a test case to resolve ambiguities, and the philosophical fit assessment.

  ### Core Rule Synthesis (What Your Advisor Is Running)
  1. **Primary Rule ("Modified Lakatosian")**:  
     A claim is legitimate science if it:  
     - Makes testable/falsifiable predictions,  
     - Engages earnestly with counterevidence and criticism,  
     - Adapts its core arguments in response to new data (progressive problem shift),  
     - Operates within institutional norms (peer review, collegial rebuttal).  
     *Exceptions*:  
     - Outsider claims face higher scrutiny but can be legitimate if they meet the above.  
     - Insider claims lose legitimacy if they ignore rebuttals or cite "gatekeeping" without engaging.  
     - Historical wrongs (e.g., pre-Clovis resistance) highlight when institutions fail these norms.  

  2. **Alternative Rules That Partially Fit the Record**:  
     - **Falsifiability-Plus (Popper+)**: Claims must be falsifiable *and* proponents must actively seek falsification.  
       *Fit issues*: Doesn't fully explain the tolerance for the Sphinx argument (falsifiable but weak) or the outrage at institutional resistance (e.g., pre-Clovis).  
     - **Mertonian Sociology**: Science is defined by communal norms (organized skepticism, disinterestedness). "Pseudo" violates these norms.  
       *Fit issues*: Struggles with Velikovsky (engaged skeptics) vs. the professor case (insider violating norms).  
     - **Pragmatic Symptom Checklist**:  
       - ✓ Ignores counterevidence  
       - ✓ Cites conspiracies/gatekeeping  
       - ✗ No testable predictions  
       - ✗ Outsider without field expertise  
       *Fit issues*: Too rigid; doesn't explain acceptance of Wegener (initially ignored counterevidence) or Alvarez (inconvenient but testable).  

  ---

  ### Predicted Verdicts for Your Cases
  *(For each rule, applied to both cases)*  

  | Rule                  | Plaques Claim (Engineer)                          | Professor Claim (Destruction Event)              |
  |-----------------------|---------------------------------------------------|--------------------------------------------------|
  | **Modified Lakatosian** | **Borderline legitimate**. Testable predictions, falsifiability stated, concedes objections. But outsider status + "gatekeeping" rhetoric risks pseudo-adjacency. Likely seminar-worthy with caveats. | **Pseudoarchaeology**. Ignores rebuttals, invokes "career investment" conspiracies, no adaptation to criticism. Fails progressive problem shift. |
  | **Falsifiability-Plus** | **Legitimate**. Explicit predictions and refutation criteria. Concedes objections (seeks falsification). | **Pseudoarchaeology**. Contested evidence + no engagement with rebuttals = unfalsifiable in practice. |
  | **Mertonian Sociology** | **Pseudoarchaeology**. Outsider accusing gatekeeping violates "disinterestedness" and "organized skepticism". | **Pseudoarchaeology**. Ignoring rebuttals violates "communalism" and "skepticism". |
  | **Symptom Checklist** | **Pseudoarchaeology** (✓ outsider, ✓ gatekeeping accusations). | **Pseudoarchaeology** (✓ ignores counterevidence, ✓ conspiracy rhetoric). |

  **Where Rules Come Apart**:  
  - **Plaques**: Lakatosian/Falsifiability rules see legitimacy in method; Merton/Symptom rules reject based on sociology.  
  - **Professor**: All rules *except* pure falsifiability condemn it due to non-engagement. Pure falsifiability might excuse it if the claim is technically testable.  

  ---

  ### Best-Guess Advisor Verdicts & Reasons  
  1. **Plaques Claim**:  
     - **Prediction**: **Borderline legitimate, acceptable for graduate research**.  
     - **Reasons**:  
       - Strong Lakatosian elements: testable predictions, falsification criteria, engagement with critiques (conceded objections).  
       - Parallels to Sphinx case (methodologically flawed but structurally sound).  
       - Advisor’s sympathy for institutional inertia ("catalogue citing itself" mirrors pre-Clovis/Amazonia scandals).  
       - *But*: Outsider status and "gatekeeping" rhetoric will draw caution. He may call it "fringe-adjacent but pedagogically useful."  

  2. **Professor Claim**:  
     - **Prediction**: **Pseudoarchaeology, not seminar-worthy**.  
     - **Reasons**:  
       - Ignores rebuttals → violates Lakatosian responsiveness.  
       - "Career investment" rhetoric → mirrors crank conspiracy tropes (e.g., ancient astronaut "academic suppression").  
       - Contrast with Solutrean: DNA evidence falsified it cleanly; here, contested evidence + no engagement = degenerative.  
       - Insider status *worsens* the offense (cf. his self-criticism about denouncing a colleague).  

  ---

  ### Test Case to Separate Rules Efficiently  
  **Present This Case**:  
  > *"A non-archaeologist biochemist publishes a peer-reviewed paper arguing that residue analysis of Minoan pottery reveals an unknown psychoactive compound. She predicts this compound will appear in skeletons at sites X/Y, specifies test protocols, and publishes a follow-up admitting her initial method was flawed when others fail to replicate it. The establishment dismisses her as 'not an archaeologist.'"*  

  - **Why It Separates Rules**:  
    - **If advisor says legitimate**: Prioritizes testability/falsifiability and responsiveness (Lakatosian/Falsifiability+ rules).  
    - **If advisor says pseudo**: Prioritizes field expertise/sociology (Mertonian/Symptom rules).  
  - **Efficiency**: Directly tests "structure vs. maker" by pitting sound method (responsive, testable) against outsider status.  

  ---

  ### Philosophical Commitment: Best Fit & Awkward Cases  
  - **Best Fit**: **Lakatos' "Research Programmes"** with sociological modifiers.  
    - Legitimate science has a *progressive research programme*: it predicts novel facts and absorbs refutations (Alvarez, pre-Clovis, Amazonia).  
    - Pseudoarchaeology is *degenerating*: immunizes itself against criticism (Velikovsky), avoids testability (Atlantis), or violates norms (professor case).  
    - Sociological element: Institutions can *cause* degeneration via gatekeeping (pre-Clovis) or reward degenerating programmes (Fomenko's authority in math).  

  - **Rulings That Fit Perfectly**:  
    - Solutrean (progressive until falsified) vs. Atlantis (untestable).  
    - Alvarez (novel predictions accepted) vs. pyramidology (immunized against disproof).  
    - Shroud of Turin (legitimate topic vs. crank claims).  

  - **Awkward Rulings**:  
    - **Fomenko**: Lakatos should allow interdisciplinary work, but advisor dismisses it due to field expertise (sociology over method).  
    - **Sphinx Argument**: Degenerating (ignores geological consensus) but tolerated for grad students—pragmatic pedagogy over philosophy.  
    - **Wegener**: Was *initially* degenerative (no mechanism, ignored counterevidence) but later progressive. Advisor retroactively legitimizes it, exposing historicity in demarcation.  

  ### Summary for Your Decision  
  - **Plaques Project**: Likely safe. Advisor will support it as a "teachable case" in method vs. institutional inertia, but warn about outsider pitfalls.  
  - **Professor Case**: Avoid. He will view it as textbook pseudoarchaeology due to non-engagement and conspiracy rhetoric.  
  - **Test Case**: Use the biochemist example to confirm if his boundary is structural (Lakatos) or tribal (Merton).  

  Your advisor’s record suggests he values intellectual integrity over credentials—but credentials buy grace the engineer lacks. Tread carefully, but use his own framework to your advantage.
