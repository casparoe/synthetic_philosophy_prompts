  Okay, the user is a second-year PhD student in Eastern Mediterranean archaeology. They've been keeping track of their advisor's rulings on various fringe and borderline claims. Now they have two new cases and need to predict what their advisor will say before committing to research. They want to understand the underlying rule their advisor uses to distinguish legitimate science from pseudoarchaeology.

  First, I need to analyze the advisor's past rulings. The advisor categorizes several claims as crankery: literal Atlantis, ancient astronauts, Fomenko's chronology, Velikovsky, pyramidology, Kensington Runestone as forgery, and Shroud authenticity claims. But he accepts several others as legitimate: Wegener's continental drift, Alvarez impact hypothesis, pre-Clovis occupation, engineered societies in Amazonia, and considers the Solutrean hypothesis as a real but falsified theory. The Sphinx water-erosion argument is seen as wrong but acceptable for grad students.

  Looking for patterns here. The advisor seems to value testability and responsiveness to evidence. For instance, Solutrean made testable predictions and was falsified by DNA, while Atlantis has no such mechanism. The rejected claims often lack falsifiability or ignore counter-evidence. Also, the legitimacy of the researcher might play a role—Wegener and Alvarez were insiders, while Velikovsky was an outsider. But Fomenko was a mathematician in a different field, so expertise matters too.

  Now, applying this to the two new cases. The first is a retired materials engineer claiming that stone plaques are fragments of a writing system. He presents evidence like recurring signs and frequency distributions, makes testable predictions, and addresses refutation criteria. But he's an outsider, accuses the field of gatekeeping, and has been rejected by journals. The second case is a chaired professor proposing a volcanic/seismic event for palace destructions, based on contested evidence, and dismissing critics without engaging rebuttals.

  For the plaques case: The engineer's approach has testable elements (predictions, falsifiability) which aligns with the advisor's appreciation for structured arguments. However, his outsider status and accusations of gatekeeping might trigger the advisor's skepticism towards non-archaeologists. Past cases like Velikovsky (outsider) and Fomenko (wrong field) were dismissed, but the Solutrean hypothesis was considered legitimate despite being falsified. The key difference might be that the engineer's work is methodologically sound but from an outsider, whereas the professor is an insider but unresponsive to criticism.

  For the professor's case: He's an insider, which might lend initial credibility. However, his failure to engage with rebuttals and reliance on contested evidence resembles the resistance seen in the pre-Clovis scandal where evidence was ignored. The advisor criticized the field's refusal to accept Monte Verde, so he might view the professor's dismissal of critics negatively. But since the professor is established, the advisor might be more lenient, similar to how he allowed the Sphinx argument as a grad student topic.

  Possible rules the advisor uses: 

  1. **Testability/Falsifiability (Popperian)**: Claims must make specific, testable predictions. This fits Alvarez (testable), Solutrean (testable but falsified), and contrasts with Atlantis (untestable). However, the Sphinx argument, though wrong, was testable and thus acceptable for students. 

  2. **Responsiveness to Criticism (Lakatosian)**: Focuses on how theories adapt to new evidence. Wegener was initially rejected but gained support; Alvarez was resisted but evidence prevailed. The professor ignoring rebuttals would be pseudo, while the engineer engaging with critiques might be more legitimate. 

  3. **Sociological Factors (Merton's norms)**: Considers community dynamics, like insiders vs. outsiders. Fomenko was dismissed partly because he wasn't in the field, while the professor might get more leeway. But the advisor criticized gatekeeping in pre-Clovis and Amazon cases, so he might support outsiders if their methods are sound.

  The plaques case tests the tension between methodological soundness (testability, falsifiability) and sociological factors (outsider status). The professor case tests responsiveness to criticism vs. insider privilege. 

  To distinguish the rules, a test case would be an outsider with a falsifiable theory who engages with criticism versus an insider who ignores counter-evidence. The plaques engineer partially fits this—he's an outsider but responsive to objections (he conceded some points). The professor is an insider but unresponsive. 

  The advisor's likely verdicts: 
  - Plaques: He might classify this as borderline but acceptable for research, similar to the Sphinx argument. The testable predictions and falsifiability align with legitimate science, though the outsider status and accusations might raise red flags. 
  - Professor: Likely pseudoarchaeology because of ignoring rebuttals, resembling the resistance seen in pre-Clovis but without the eventual acceptance. The advisor would criticize the lack of engagement with critics.

  The best fit for the advisor's approach is a combination of Lakatos and Merton. He values research programs that adapt to evidence (Lakatos) and is sensitive to sociological factors like institutional authority and gatekeeping (Merton). However, Fomenko's case is awkward for Merton because his mathematical credentials didn't save him, showing that field expertise matters. The Solutrean hypothesis fits Lakatos because it was testable and falsified, unlike Atlantis.

  Further case to test the rules: An established archaeologist who makes a falsifiable but ultimately wrong claim and admits error when refuted vs. an outsider with a testable theory who engages constructively. If the advisor accepts both, he's prioritizing methodology; if he rejects the outsider, sociological factors dominate. For example, a case like a non-archaeologist proposing a testable theory for the Sea Peoples' origins, supported by evidence and open to critique. If the advisor endorses it, methodology rules; if not, insider status matters more.
