prompt: |-
  I'm building a session on self-amending rules and I want a purpose-built case rather than the standard Nomic examples. Build me a one-paragraph thought experiment, set somewhere realistic — a housing co-op, a union local, a church vestry, a small company's bylaws, not a made-up country — where a body uses its own amendment procedure to change that very procedure, and the change makes it genuinely unclear whether the act that made the change was authorized. Constraints: the amendment rule has to be one a sensible group would actually adopt (no obvious trap rule, no bad faith, nobody sneaking anything past anyone), and the puzzle has to come purely from the timing — authority at the moment of acting versus authority under the rules as they end up. Ideally engineer it so the act is valid under the old rules but would be invalid under the new ones, or vice versa, so that one variable is doing all the work. Then, after the scenario: (a) walk through the exact step that's supposed to be paradoxical; (b) say whether it's a real paradox, a legal gap, or just a hard question, and what a Kelsen-ish reading (validity is always relative to a time and a higher norm) says versus a Hart-ish one (the rule of recognition just keeps doing its thing until it stops); (c) name the single feature carrying the case, say what happens if you remove it, and how someone who thinks there's no paradox here at all would defuse it.
