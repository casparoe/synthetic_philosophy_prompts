prompt: |-
  I've just spent two hours on the phone with my mate Dev arguing about superrationality — the Hofstadter thing, where in a one-shot prisoners dilemma you cooperate because the other player is in the same situation as you and so has to reach the same answer as you — and I want a case built to order to settle it. Dev's line is that superrationality is evidential decision theory in a trenchcoat: he says the two players are only "the same" because they're running the same program, a shared program is just a common cause, and common causes are exactly what EDT feeds on, so superrationality adds nothing on top. I dont buy it, but every time I tried to say why I ended up just asserting the symmetry clause louder, so I'd rather have a clean case than another round of shouting.

  Here's the shape I want. One scenario, in two versions. Two ordinary people, one-shot decision, no talking it over at decision time, no repeat play, no reputations, no predictor, no clones, no brain-in-a-vat stuff — give me something domestic, two housemates or two people on the same shift who each have to decide the same thing at the same moment. Version one: they're "the same" in a way that actually gives EDT a causal handle on the other person's choice — they both signed onto the same rule beforehand, or both got handed the same instruction, something where my picking the cooperative option genuinely raises the odds that they pick it too. Version two: identical payoff matrix, same kind of person, but the sameness is pure resemblance, nothing linking the two choices except that they're both facing the same game. Then lay out the verdicts for each version — superrationality, EDT, and causal decision theory as the control — with the reasoning for each, and tell me which single feature is doing the work and what happens if I toggle it: does version two turn into version one, or do the theories end up agreeing again for some other reason entirely? If the real disagreement in version two is just about what counts as "the same situation" and not between the theories at all, say that straight out instead of dressing it up as a clean case, I'd definately rather know that. Then tell me how Dev attacks version one and how I attack version two, if I'm the one who's fooling himself.

  And while you're in there: does any of this survive if their stakes aren't the same — one of them cares twice as much about how it comes out? My instinct is that's where superrationality quietly runs out of road, but if the case just breaks there, tell me it breaks rather than patching it. 800 words max, and lead with the verdicts, dont make me read to the bottom to find out which theory said what.
reasoning: |-
  We are going to design two versions of a scenario to test the differences between Superrationality, Evidential Decision Theory (EDT), and Causal Decision Theory (CDT). The scenario must be a one-shot Prisoner's Dilemma (PD) without pre-commitment, repeat play, reputations, predictors, clones, etc.

  **Prisoner's Dilemma Payoff Matrix (for reference):**
  - If both cooperate (C,C): both get R (Reward)
  - If one cooperates and the other defects (C,D): cooperator gets S (Sucker's payoff), defector gets T (Temptation)
  - If both defect (D,D): both get P (Punishment)
  Standard ordering: T > R > P > S, and 2R > T+S.

  **Verdicts for each theory in the two versions:**

  **Version 1: Common Cause (e.g., both signed the same rule beforehand)**
  - **Superrationality:** Cooperate. Because the players are in the same situation and must reason symmetrically, they both expect the same outcome. The only symmetric outcomes are mutual cooperation and mutual defection. Since mutual cooperation is better, they choose cooperate.
  - **EDT:** Cooperate. Because the prior agreement (common cause) means that if I choose to cooperate, it is evidence that the other player also cooperates (due to the common cause). Therefore, P(other cooperates | I cooperate) is high. Similarly, if I defect, P(other defects | I defect) is high. Since R (reward) > P (punishment), and S (sucker) is the worst, EDT prefers cooperation.
  - **CDT:** Defect. CDT ignores the evidence and focuses on causal influence. My decision does not causally affect the other player's decision (because the common cause is in the past and fixed). Therefore, regardless of what I do, the other player's action is fixed. If I defect, I get either T (if they cooperate) or P (if they defect). But since T > R and P > S, defecting dominates.

  **Version 2: Pure Resemblance (same kind of person, same situation, but no causal link)**
  - **Superrationality:** Cooperate. Because the players are in the same situation, they must reason as if they are the same player. Therefore, they will both choose the same action. Since mutual cooperation is better than mutual defection, they choose cooperate.
  - **EDT:** Defect. Without a common cause, there is no evidential link. My action does not provide evidence about the other player's action. Therefore, I must consider the other player's action as independent. Then, regardless of what the other does, defecting yields a better payoff: if they cooperate, I get T (best) instead of R; if they defect, I get P instead of S (worst). So EDT defects.
  - **CDT:** Defect. Same as Version 1: no causal link, so my action doesn't affect the other. Defection dominates.

  **The Key Feature:** The presence of a common cause (in Version 1) that creates an evidential link. Without it (Version 2), EDT and CDT agree on defection, but superrationality still prescribes cooperation.

  **Does the Version 2 scenario turn into Version 1 when we toggle the common cause?** Yes. The only difference between the two versions is the presence of the common cause. In Version 1, EDT uses the common cause to form a conditional probability that makes cooperation evidentially favorable. In Version 2, without the common cause, EDT sees no evidential link and defects.

  **The Disagreement in Version 2:** The real disagreement is between superrationality and both EDT and CDT. Superrationality relies on the symmetry of the situation (without requiring a causal link) to argue that both players must choose the same action. EDT and CDT reject this symmetry as a reason to coordinate without evidence or causality.

  **How Dev Attacks Version 1:** Dev (as an EDT advocate) would say that Version 1 is exactly where EDT works and superrationality is redundant. The common cause (the signed rule) is what EDT uses to update the conditional probability. Without it, EDT would not cooperate. Therefore, superrationality in Version 1 is just EDT in disguise.

  **How You Attack Version 2:** You (as a superrationality advocate) would argue that even without a common cause, the symmetry of the situation (same game, same payoffs, same reasoning) should lead both players to the same conclusion. Therefore, they should both cooperate. But in Version 2, EDT and CDT both defect, which leads to mutual defection (P), which is worse than mutual cooperation (R). So, superrationality avoids the suboptimal outcome by coordinating on cooperation.

  **What if the stakes are not the same?** 
  Suppose one player cares twice as much about the outcome. Then the symmetry is broken. Superrationality requires that the players are in identical situations (including identical utilities). Without identical utilities, the reasoning that "we must both do the same thing" breaks down because what is rational for one might not be for the other. Therefore, superrationality does not apply. In that case, even superrationality would not prescribe cooperation. However, if we interpret superrationality as requiring symmetry in the decision problem and if the utilities are not symmetric, then the players are not in the same situation. So, the case breaks.

  **Conclusion:**
  - Version 1: Superrationality and EDT agree on cooperate; CDT says defect.
  - Version 2: Superrationality says cooperate; EDT and CDT say defect.

  The key feature is the common cause that creates an evidential link. Without it, EDT and CDT agree on defection, but superrationality still prescribes cooperation. When the stakes are asymmetric, superrationality breaks because symmetry is lost.

  **Scenario Setup:**

  **Version 1: Common Cause**
  Two housemates, Alice and Bob, are going to be away for the weekend. They each must decide independently whether to clean the apartment before leaving. The payoff matrix (in terms of utility) is:

  - Both clean: Each gets 3 (they share a clean apartment and both did their part).
  - One cleans, the other doesn't: The cleaner gets 0 (they did all the work and feel exploited), the non-cleaner gets 5 (they enjoy a clean apartment without effort).
  - Neither cleans: Each gets 1 (the apartment is messy, but neither did work).

  This is a Prisoner's Dilemma: T=5, R=3, P=1, S=0.

  Common cause: They both signed a "Roommate Agreement" last month that included a clause: "We both agree to clean before leaving for the weekend." They both recall this agreement.

  **Version 2: Pure Resemblance**
  Same two housemates, same payoff matrix. But there was no prior agreement. However, they are both very similar: they are both tidy, responsible, and they both know that the other is tidy and responsible. But there is no causal link (like a signed agreement) between their decisions.

  **Verdicts for Version 1:**
  - Superrationality: Cooperate (clean). They are in the same situation and must choose the same action. Mutual cleaning is better than mutual not cleaning.
  - EDT: Cooperate. Because the signed agreement is a common cause. If Alice cleans, that is evidence that Bob will clean (because they both signed the agreement and are likely to follow it). Thus, P(Bob cleans | Alice cleans) is high, so cleaning leads to 3. If she doesn't clean, then P(Bob doesn't clean) is high, leading to 1. Since 3>1, clean.
  - CDT: Defect (don't clean). The agreement is in the past and fixed. My action now doesn't cause Bob's action. So, regardless of what Bob does, I do better by not cleaning: if Bob cleans, I get 5 (by not cleaning) vs 3 (by cleaning); if Bob doesn't clean, I get 1 (by not cleaning) vs 0 (by cleaning). So defect.

  **Verdicts for Version 2:**
  - Superrationality: Cooperate (clean). The symmetry of the situation (same game, same type of person) implies they will both do the same thing, and mutual cleaning is better.
  - EDT: Defect (don't clean). Without a common cause, Alice's cleaning doesn't provide evidence about Bob's cleaning. So, she must consider Bob's action as independent. Then, regardless of Bob: if she cleans, she gets either 3 (if Bob cleans) or 0 (if Bob doesn't). If she doesn't clean, she gets either 5 (if Bob cleans) or 1 (if Bob doesn't). The expected utility of not cleaning is higher because 5>3 and 1>0, and without evidence, we assume independence so we compute expected utility. But even without exact probabilities, defection dominates: because no matter what Bob does, not cleaning yields a higher payoff.
  - CDT: Defect (don't clean). Same as Version 1: no causal link, so defect.

  **How Dev Attacks Version 1:** He says that superrationality is just EDT because the common cause (the agreement) is what EDT uses. Without it, superrationality would still say cooperate, but EDT wouldn't. So in Version 1, superrationality is not adding anything beyond EDT.

  **How You Attack Version 2:** You argue that EDT and CDT lead to mutual defection (P=1) which is worse than mutual cooperation (R=3). Superrationality, by recognizing the symmetry, avoids this. The key is that in Version 2, the players are in the same situation and must realize that they are both reasoning the same way, so they can coordinate on the better symmetric outcome.

  **Asymmetric Stakes:** 
  Suppose Alice cares twice as much about a clean apartment (so her payoffs are doubled). Then the payoffs are no longer symmetric. Superrationality breaks because Alice and Bob are not in the same situation. They might now have different rational actions. For example, if Bob is still symmetric, but Alice has higher stakes, then Alice might clean even if Bob doesn't (because her disutility for a messy apartment is high). But then they are not choosing the same action. Superrationality does not apply. In this case, without symmetry, the theories might diverge even more, but we don't have a clear superrationality prescription.

  **Final Word:** The clean case shows that in Version 2 (pure resemblance) superrationality stands alone in prescribing cooperation. The key feature is the common cause that creates an evidential link. Without it, EDT and CDT defect. When the stakes are asymmetric, superrationality breaks down because it relies on symmetry.
