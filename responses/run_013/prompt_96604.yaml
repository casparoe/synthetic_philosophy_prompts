  ### Verdicts at a Glance
  - **Version 1 (Common Cause):**  
    - Superrationality: Cooperate  
    - EDT: Cooperate  
    - CDT: Defect  

  - **Version 2 (Pure Resemblance):**  
    - Superrationality: Cooperate  
    - EDT: Defect  
    - CDT: Defect  

  - **Asymmetric Stakes:** Superrationality breaks; no coordination.  

  ---

  ### The Scenario: Roommate Cleanup Dilemma  
  Two housemates, Alice and Bob, face a one-shot decision while leaving for the weekend. Each must independently choose whether to clean the shared apartment. Payoffs (utility points):  
  - **Both clean:** Each gets +3 (shared effort, clean space).  
  - **One cleans, the other doesn’t:** Cleaner gets 0 (effort exploited), non-cleaner gets +5 (free ride).  
  - **Neither cleans:** Each gets +1 (messy but no effort).  
  *This is a Prisoner’s Dilemma: Temptation (+5) > Reward (+3) > Punishment (+1) > Sucker (0).*  

  #### Version 1: Common Cause  
  **Setup:** Both signed a "Roommate Agreement" last month: "We will clean before weekend trips." They recall this but can’t communicate during the decision. The agreement acts as a **common cause**—a shared program (e.g., "follow rules you commit to").  

  - **Superrationality:** Cooperate (clean).  
    - *Reasoning:* Identical reasoning processes (same agreement, same game) force symmetry. Mutual cooperation (+3) beats mutual defection (+1), so both clean.  
  - **EDT:** Cooperate (clean).  
    - *Reasoning:* Signing the agreement creates a common cause. If I clean, it’s evidence the other cleans too (since we both tend to follow commitments). Thus, P(they clean | I clean) is high, making my expected utility high: likely +3 vs. +1 if I defect.  
  - **CDT:** Defect (don’t clean).  
    - *Reasoning:* My choice doesn’t *cause* the other’s action; the agreement is fixed. Whatever they do, defecting dominates: If they clean, I get +5 (vs. +3 for cooperating); if they don’t, I get +1 (vs. 0 for cooperating).  

  **Key feature:** The common cause (agreement) gives EDT an evidential handle. Toggle it off → Version 2.  

  #### Version 2: Pure Resemblance  
  **Setup:** No prior agreement. Both are "tidy, responsible types" who know this about each other. Resemblance is **purely statistical**—no causal link (e.g., no shared rule or brain link). Payoffs identical.  

  - **Superrationality:** Cooperate (clean).  
    - *Reasoning:* Identical situation (same game, same "type") implies identical decisions. Mutual cooperation (+3) is better than mutual defection (+1), so both clean. Symmetry is primitive, not derived from evidence or causality.  
  - **EDT:** Defect (don’t clean).  
    - *Reasoning:* No common cause means no evidential link. My action doesn’t provide evidence about theirs (independence). Defecting dominates: If they clean, I get +5 > +3; if they don’t, I get +1 > 0.  
  - **CDT:** Defect (don’t clean).  
    - *Reasoning:* No causal link. My choice can’t affect theirs; defecting always gives a higher payoff (+5 or +1) vs. cooperating (+3 or 0).  

  **Key feature:** Symmetry without a causal/evidential link. Superrationality relies on "same situation" as a logical axiom; EDT/CDT reject this. Toggle a common cause on → Version 1, restoring EDT-superrationality agreement.  

  ---

  ### Disagreement Analysis  
  - **Version 2’s core conflict:** Not between theories, but about **what "same situation" means**.  
    - Superrationality: "Same situation" implies identical outputs from identical reasoning.  
    - EDT/CDT: "Same situation" is irrelevant without evidence (EDT) or causality (CDT).  
  - **Dev’s attack on Version 1:** He’s right—superrationality here *is* EDT in a trenchcoat. The agreement is a common cause EDT uses to raise P(they cooperate | I cooperate). Superrationality adds nothing beyond EDT’s evidential update.  
  - **Your attack on Version 2:** You’re wrong if you think symmetry alone forces cooperation. EDT/CDT defect because resemblance isn’t evidence—it’s just a fact. If Alice cleans, it doesn’t raise P(Bob cleans); Bob’s choice is fixed by his own reasoning. Superrationality assumes symmetry compels coordination, but EDT/CDT see no mechanism for this.  

  ---

  ### Asymmetric Stakes: Superrationality Breaks  
  **Setup:** Alice cares twice as much about cleanliness (her payoffs: +6 if both clean, +0 if she cleans alone, +10 if only Bob cleans, +2 if neither cleans). Bob’s payoffs unchanged.  

  - **Superrationality:** **No prescription.** Symmetry is broken—Alice and Bob aren’t in identical situations (different utilities). The "same program" logic fails.  
  - **EDT/CDT:** Defect (both). No evidential/causal link; defecting still dominates for each individually.  
  - **Outcome:** Theories don’t reconcile. Superrationality only works under perfect symmetry.  

  ---

  ### Final Tally  
  - Version 1: Superrationality and EDT agree (cooperate) due to common cause; CDT defects.  
  - Version 2: Superrationality cooperates alone; EDT/CDT defect.  
  - Key feature: **Common cause** (evidential link). Without it, superrationality diverges.  
  - Asymmetric stakes: Superrationality collapses; EDT/CDT still defect.  

  Dev wins on Version 1 (superrationality = EDT). You win on Version 2 only if "same situation" is axiomatic—but EDT/CDT say that’s question-begging. If symmetry isn’t causal or evidential, it’s not doing work.
