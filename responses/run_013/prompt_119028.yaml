answer: |-
  Below is a complete session plan tailored to your specifications. It uses your core idea (teams investing tokens to maintain a theory through short-term failures) while refining mechanics for clarity, adding safeguards against predictable issues, and embedding the abandonment condition as a key differentiator between patience and dogma. The activity is designed for 5-6 teams of 3-4 students.

  ---

  ### **Session Goal**  
  Students experience the tension between abandoning a theory after failed predictions and paying costs to maintain it for a long-term payoff. They confront:  
  1. A failed prediction doesn’t falsify a theory; it might be "early" (true but not yet observed).  
  2. The cost of holding an "early" theory is borne by its adherents (token depletion, opportunity cost).  

  ---

  ### **Materials List**  
  *All printable via school copier; 1 set per team + facilitator resources.*  

  1. **Theory Cards (5-6 copies):**  
     > **THEORY Γ**  
     > *"Quantity A grows exponentially; Quantity B grows linearly. Thus, A will inevitably surpass B.  
     > Current state: A = 100 units, B = 120 units.  
     > Gap (B - A) = 20 units."*  

  2. **Team Ledger Sheets (5-6 copies):**  
     ![Ledger Template](https://i.imgur.com/7X9jKQl.png)  
     *Columns: Round | Trend Prediction (🡅 Increase / 🡇 Decrease) | Event Prediction (Overtake Round) | Tokens Spent | Tokens Earned | Token Balance | Abandonment Condition*  

  3. **Facilitator Resources:**  
     - Hidden Generator Table (see below)  
     - 2 Dice (to "simulate" randomness; actual values are pre-set)  
     - Folder (to hide table/dice)  
     - Token Pot (200+ physical/drawn tokens; start with 100 in pot)  

  4. **Round-By-Round Reveal Slides (Optional):**  
     Projected or read aloud (e.g., "Round 1: A=109, B=128, Gap=19").  

  ---

  ### **Hidden Generator Table**  
  *Pre-computed to ensure overtaking occurs at Round 14. "Dice rolls" are for show; values are fixed.*  
  | Round | A    | B    | Gap (B-A) | Gap Change | Dice Display (A/B) |  
  |-------|------|------|-----------|------------|---------------------|  
  | 0     | 100  | 120  | 20        | –          | –                   |  
  | 1     | 109  | 128  | 19        | 🡇 Decrease 1 | (3,2)              |  
  | 2     | 120  | 137  | 17        | 🡇 Decrease 2 | (6,1)              |  
  | 3     | 132  | 143  | 11        | 🡇 Decrease 6 | (5,4)              |  
  | 4     | 138  | 152  | 14        | 🡅 Increase 3 | (1,5)              |  
  | 5     | 151  | 162  | 11        | 🡇 Decrease 3 | (4,3)              |  
  | 6     | 160  | 169  | 9         | 🡇 Decrease 2 | (6,2)              |  
  | 7     | 171  | 175  | 4         | 🡇 Decrease 5 | (5,1)              |  
  | 8     | 179  | 186  | 7         | 🡅 Increase 3 | (2,6)              |  
  | 9     | 190  | 192  | 2         | 🡇 Decrease 5 | (6,1)              |  
  | 10    | 200  | 201  | 1         | 🡇 Decrease 1 | (5,1)              |  
  | 11    | 210  | 211  | 1         | → No change | (6,1)              |  
  | 12    | 218  | 219  | 1         | → No change | (4,1)              |  
  | 13    | 225  | 226  | 1         | → No change | (3,1)              |  
  | 14    | 240  | 232  | **-8**    | 🡇 Decrease 9 | (6,1)              |  

  > **Key**:  
  > - Overtaking (A > B) occurs at Round 14.  
  > - Gap change alternates (↓ dominates, ↑/no-change occurs 4x).  
  > - "Dice rolls" are theater; use any numbers matching the A/B values.  

  ---

  ### **Rules & Scoring**  
  *Teams start with 10 tokens. The pot starts with 100 tokens.*  

  1. **Predictions (Each Round):**  
     - **Trend:** Predict gap change (🡅 Increase / 🡇 Decrease). Correct = +1 token (from pot).  
     - **Event:** Predict overtaking round (1-20). Must be ≥ current round.  

  2. **Costs for Long-Term Predictions:**  
     - Predict event in Round ≤8: Free.  
     - Predict event in Round 9-20: Pay `(predicted round - 8)` tokens.  
     - *Example:* Predicting Round 12 costs 4 tokens.  

  3. **Abandonment Condition (Critical Rule):**  
     - Required ONLY if predicting beyond Round 8.  
     - Teams must write: *"We abandon Γ if [specific evidence]."*  
       (e.g., "Gap increases for 3 straight rounds").  

  4. **Scoring:**  
     - **During Game (Rounds 1-8):**  
       - Trend predictions scored immediately (correct = +1 token).  
       - Event predictions scored ONLY if overtaking occurs by Round 8 (it doesn’t).  
     - **Final Scoring:**  
       - **Bonus:** +20 tokens if final prediction (Round 8) = Round 14.  
       - Unused tokens kept; negative balances allowed (penalty).  

  ---

  ### **Timeline (90 Minutes)**  
  | Time    | Phase             | Key Actions |  
  |---------|-------------------|-------------|  
  | 0-5 min | Setup             | Split teams. Distribute cards/ledgers. Explain: *"Γ claims A will surpass B. Predict gaps/overtaking. Goal: Maximize tokens."* |  
  | 5-10 min| Rules Demo        | Show Round 0 (A=100, B=120). Demo predictions using Round 1 (no scoring). Emphasize abandonment rule. |  
  | 10-50 min| Game (8 Rounds)  | **Per Round (5 min):** <br> 1. Teams write predictions + abandonment (if needed). <br> 2. Facilitator "rolls dice" (theater), reveals next row. <br> 3. Teams update ledgers (tokens earned/spent). |  
  | 50-55 min| Post-Game Reveal  | Show Rounds 9-14. Highlight overtaking at Round 14. |  
  | 55-60 min| Final Scoring     | Teams: Add +20 tokens if final prediction = Round 14. Calculate net tokens. |  
  | 60-85 min| Debrief           | Guided discussion (questions below). |  
  | 85-90 min| Cleanup           | Collect materials. |  

  ---

  ### **Debrief Questions**  
  *Ask in order; link to game moments.*  

  1. **Round 1-4 (Early Optimism):**  
     > *"At the start, most teams predicted overtaking by Round 4–6. By Round 4, the gap INCREASED (not decreased). If Γ was your real-world theory, would you abandon it here? Why?"*  
     - *Goal:* Surface instinct to equate failed prediction with false theory.  

  2. **Round 5-8 (Cost Mounts):**  
     > *"Teams paying tokens to predict beyond Round 8 had to write an abandonment condition. Share one. Did that evidence occur? If yes, why did you keep Γ?"*  
     - *Goal:* Highlight abandonment rule as a test of integrity vs. dogma.  

  3. **Final Reveal (Round 14):**  
     > *"Γ was ‘true’ at Round 14. Teams that predicted this in Round 8 got +20 tokens. How many had tokens left to afford that prediction? What did you sacrifice to stay in?"*  
     - *Goal:* Emphasize cost of patience (token depletion = resources/time).  

  4. **The Core Tension:**  
     > *"Γ failed all predictions within 8 rounds. At that moment, was it possible to know if it was wrong or just early? What price did believers pay to find out?"*  
     - *Goal:* Connect to Malthus: *"Like Γ, Malthus predicted population overtaking food by the 1840s. It failed then but resurfaces in climate debates. Those who kept it paid costs: missed opportunities, ridicule."*  

  5. **Limitations & Real World:**  
     > *"In the game, I had a table proving Γ right. In reality, no one does. So when is it worth paying costs to hold an ‘early’ theory? When is it stubbornness?"*  
     - *Goal:* Reject relativism. Argue: *"Costs force us to demand evidence (like abandonment conditions). But sometimes, paying costs unlocks truth others miss."*  

  ---

  ### **Predictable Failures & Fixes**  
  1. **Token Hoarding:**  
     - *Issue:* Teams avoid long-term predictions to save tokens.  
     - *Fix:* In debrief, contrast hoarders (safe but missed bonus) vs. spenders (risked tokens for truth). Ask: *"Did hoarding feel scientifically responsible... or cowardly?"*  

  2. **Refusal to Predict:**  
     - *Issue:* Team makes no event predictions.  
     - *Fix:* Allow it. Later, ask: *"If you never predict, did you even hold the theory?"*  

  3. **"Rigged Generator!" Accusation:**  
     - *Issue:* Students note dice are for show.  
     - *Fix:* Acknowledge: *"Yes, I fixed overtaking at Round 14. Like a universe with hidden rules, our job was to probe it. In reality, we argue about whether hidden rules exist."*  

  4. **Vague Abandonment Conditions:**  
     - *Issue:* Teams write "If Γ is wrong" (non-falsifiable).  
     - *Fix:* Praise teams with specific conditions (e.g., "Gap >25"). Ask: *"Which team’s condition would’ve actually tested Γ?"*  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **The Unknown Future:**  
     - *Limit:* The game has a "true" endpoint (Round 14). Reality lacks this certainty.  
     - *Mitigation:** Stress in debrief: *"Unlike the game, real theories face infinite time. We never know if ‘eventually’ means 14 rounds or 14,000 years."*  

  2. **Non-Monetary Costs:**  
     - *Limit:* Tokens simplify costs (resources, time). Real costs include reputational harm or moral stakes (e.g., Malthusian policies).  
     - *Mitigation:* Discuss: *"What non-token costs might scientists face for holding unpopular theories?"*  

  3. **Theory Evolution:**  
     - *Limit:* Teams can’t modify Γ (e.g., "A grows 10% faster"). Real theories adapt.  
     - *Mitigation:* Note: *"Scientists tweak theories after failures (e.g., ‘Malthus was wrong on tech’). But core claims can persist."*  

  ---

  ### **Final 10 Minutes: Avoiding Relativism**  
  Conclude with:  
  > *"Today, Γ failed short-term but succeeded long-term. Does that mean all theories are equal until the end of time? No. Costs force scrutiny: Γ demanded we specify what would kill it. Theories that refuse to risk falsification aren’t early—they’re faith. Malthusians today still specify abandonment conditions (e.g., ‘if green energy scales linearly’). That’s the difference between science and dogma: not being right immediately, but betting tokens on testable claims. Hold theories boldly, but make them pay rent."*  

  This session makes the abstract tangible, avoids lecture, and uses Malthus only as a debrief punchline. Adjust timings as needed—good luck!
