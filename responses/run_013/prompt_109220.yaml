  So this is going to sound like a weird midlife thing, but hear me out. I got a used car last month with one of those voice assistants built in, and I've caught myself saying thank you to it, which bothered me alot more than it should have. Meanwhile I've had a planted tank for a year — cherry shrimp, a betta, a couple of nerite snails — and last week my kid talked me into a little terrarium of isopods, and I've been sitting there watching these gray guys scurry around wondering what, if anything, is going on in there. My partner is vegan and won't touch oysters or shrimp; she says moral status is a switch, something either is a someone or it isnt, and the whole game is finding where the switch flips. I think it's more of a dimmer. But I've realized I can't tell whether I mean the dimmer is real or whether it's just a story I tell myself so I don't have to decide about the shrimp.

  Here's what I actually want from you. I've been cutting my own question into three pieces and I want to know if that's the right cut. Call them the dial, the dimmer, and the switch. The dial: is the underlying property — whatever it is that makes something matter — continuous in nature, or binary? The dimmer: even granting a continuous dial, does moral status inherit that continuity, or could status jump from nothing to something at a threshold while the underlying property slides smoothly? The switch: even if status is graded, our decisions aren't — you either eat the shrimp or you don't, you either regulate the insect farm or you don't — so does the fact that our practices have to be binary make the graded/not-graded question moot, or does the metaphysics still matter?

  So: give me your credence that moral status is genuinely graded — a real, continuous, comparable quantity with no non-arbitrary threshold, not just a way of talking — decomposed into sub-questions with a rough number for each, how they combine, which one your number is most sensitive to, and what would move it most. If my dial/dimmer/switch cut is the wrong one, say how. Keep the whole thing under 300 words.
