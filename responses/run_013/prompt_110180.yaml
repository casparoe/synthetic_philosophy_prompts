prompt: |-
  Role: you're an expert in moral epistemology, specifically the literature on moral testimony and moral deference -- the stuff about whether you can come to know that something is wrong just by taking someone's word for it. Think carefully before you answer, and start by brainstorming: lay out the main moves people make in this debate (both the "deference can transmit moral knowledge/understanding" side and the "there's something special about moral knowledge" side), because I want to see the space of options before you commit.

  Here's my situation. My friend and I keep arguing about whether you can *learn* that something is wrong by just trusting someone who tells you it's wrong. I have a bunch of gut verdicts about cases and I can't tell if they add up to anything, or if I'm just being inconsistent. I don't want a lecture on what famous people said -- I want you to figure out what principle (or small set of principles) actually captures my verdicts, and be honest about the ones it can't save.

  The cases:

  1. My partner has read a ton about factory farming and walks me through the argument. While they're talking I follow it, but honestly a week later I couldn't reconstruct a single step. Still, I feel like I now *know* eating meat is wrong, not just believe it.

  2. At a party a stranger says 'eating meat is murder' and I'm struck by it and adopt the view. Even if it turns out to be true, I don't think I know it. I just... believe it now.

  3. My old mentor, who I think is genuinely wise, tells me that in a specific messy situation I'm in -- my brother asked me not to tell our parents something, and I think they should know -- the right thing is to keep the promise. I've thought about it and I can't see my way through, so I go with her call. I think I *know* that keeping the promise is what I should do here.

  4. Same mentor, but this time she tells me a general moral principle -- that you should never break a promise, full stop. I defer. I do *not* think I know the principle, even though I trust her.

  5. I get moral advice from my uncle, who I know is a hypocrite -- he lectures everyone about honesty while lying constantly. He tells me it's wrong to lie to get out of a work commitment. I think I can still come to *know* that lying there is wrong, if he happens to be right about it. His being a creep doesn't seem to matter.

  6. I'm in a country where everyone thinks a certain practice is shameful. I've absorbed the norm and I act on it, but I couldn't tell you why it's wrong and I suspect it isn't. I don't think I know it's wrong. I might even think I *know it's not* wrong, but that's a different thing.

  7. My 7-year-old asks me if it's wrong to lie. I tell her yes, and she believes me. I think she *knows* it's wrong, even though she can't give a reason.

  8. Here's the one that bugs me: an AI assistant I use a lot gives me a moral verdict about a novel dilemma (some new tech thing nobody's thought much about). It sounds right and I can't find a flaw. I don't think I know it's right. But I also can't say what's different between this and case 1, except that my partner is a person and I trust her.

  So: is there a principle that gets all or most of these? I suspect the answer has to do with *understanding* vs. *reliability*, or with the difference between testimony about general principles and testimony about what to do here and now -- but 3 and 4 seem to pull in opposite directions, and 1 vs 8 is driving me nuts. Tell me which verdicts I have to give up on the simplest principle that fits the rest, and then use that principle to predict what I should say about a case I haven't mentioned: someone who defers to a moral expert about a matter where the expert is more reliable than them *and* they can see the expert's reasoning, but the reasoning depends on a value they don't share. Also, if you can, say whether any of my verdicts are just plain confused and should be revised rather than accommodated.
reasoning: |-
  Okay, the user is asking about moral epistemology, specifically whether you can gain moral knowledge through testimony or deference. They've provided eight different cases where they have intuitive judgments about whether someone knows or merely believes a moral claim based on testimony. 

  First, I need to map the philosophical landscape. There are two main sides: the Transmission View (where moral knowledge can be transferred through testimony) and the Non-Transmission View (which argues moral knowledge requires personal understanding or direct grasp of reasons). The user seems to be wrestling with where their intuitions fall between these positions.

  Looking at their cases, I notice several patterns. Case 1 (partner explaining factory farming) feels like knowledge even without retention, while Case 8 (AI giving moral verdict) doesn't, despite superficial similarity. Case 3 (mentor's specific advice) is accepted as knowledge, but Case 4 (same mentor giving general principle) isn't. Case 5 (hypocritical uncle) still allows knowledge, while Case 6 (cultural norm) doesn't. The child case (7) is interesting because they grant knowledge despite the child's lack of reasoning ability.

  Hmm... the key distinctions emerging are:
  - Specific situational judgments vs. general principles
  - Source reliability vs. understanding
  - Personal relationship to the testifier
  - Ability to grasp reasons (even if not retained)

  The user's rejection of Case 2 (stranger at party) and Case 8 (AI) suggests they require more than mere reliability - there's something about the testimonial context that matters. The mentor cases (3 and 4) show they distinguish between application of wisdom to particulars versus blind acceptance of generalizations.

  For the hypocritical uncle case (5), they're correctly noting that the speaker's character doesn't necessarily block knowledge transmission if the content is true. That aligns with epistemic externalism. But the cultural absorption case (6) shows they require more than just true belief - there needs to be some connection to justification.

  The child case (7) is tricky because it seems to contradict their rejection of Case 2. But actually it reveals their intuition that testimony from a recognized epistemic authority in a pedagogical context works differently. The parent-child relationship creates legitimate epistemic dependence.

  The AI case (8) bothers them precisely because it highlights the tension. I think what's missing for them is the relational aspect - they implicitly require the testifier to be a trustworthy member of our moral community who could in principle give reasons, even if they don't in that moment.

  Putting this together, their core principle might be: Moral knowledge via testimony requires (1) proper functioning of epistemic faculties regarding moral sources, AND (2) the testifier must stand in an appropriate epistemic relationship to the recipient such that deference is warranted, AND (3) the testimony must be about a particular judgment rather than a general principle.

  This explains most cases:
  - Case 1 works because of the relationship and specific focus
  - Case 8 fails due to lack of relational warrant
  - Mentor cases split on generality
  - Uncle case works because content is specific
  - Cultural case fails due to lack of relational warrant

  The harder fit is Case 2 (stranger). Their intuition says no knowledge, but under this principle, if it's specific content and the stranger happens to be reliable, why not? They might need to either accept that case as knowledge (which feels wrong to them) or add another condition about established trust.

  For the bonus case about deferring to an expert with alien values: under their principle, if it's specific advice and the relationship is proper, they might say knowledge is possible. But they might balk if the value disagreement is too fundamental. This suggests their principle needs refinement around shared evaluative frameworks.

  What they might need to give up is complete consistency between Cases 2 and 7, or recognize that children occupy a special epistemic category. Alternatively, they could accept that Case 2 could sometimes transmit knowledge if all conditions are met, but their intuition rejects it because we rarely have sufficient warrant to trust strangers on moral claims.

  The most coherent position for them seems to be a hybrid view: testimony can transmit moral knowledge when it concerns particular situations and comes from a source with whom we have appropriate epistemic dependence relations, regardless of the speaker's personal hypocrisy, but dependent on the recipient's ability to recognize moral testimony as legitimate within their epistemic framework.
answer: |-
  Your intuitions reveal a sophisticated, hybrid view of moral testimony that navigates between pure reliability and pure understanding demands. Here's the principle that best captures *most* of your verdicts, the trade-offs required, and predictions for new cases:

  **Your Core Principle:**  
  *Moral knowledge via testimony is possible when:  
  **(1)** The recipient recognizes the testifier as a **legitimate source of moral insight** within a relevant domain or relationship, AND  
  **(2)** The testimony concerns a **situationally-embedded particular judgment** rather than a freestanding general principle, AND  
  **(3)** The recipient has the **capacity to grasp the moral significance** of the act in question (even if they can't articulate the reasons later).*  

  **How it explains your cases:**

  1.  **✅ Partner on factory farming:**  
      *(1) Legitimate source (engaged, trusted partner), (2) Situated judgment (applying principles to meat-eating context), (3) Grasped significance during explanation (even if forgotten).* → **KNOWLEDGE**
  2.  **❌ Stranger at party:**  
      *(1) FAILS - Stranger lacks legitimacy/trust relationship, (3) Gut adoption lacks grasp of significance.* → **BELIEF ONLY**
  3.  **✅ Mentor on specific promise:**  
      *(1) Legitimate source (wise mentor), (2) Situated judgment (your messy situation), (3) You recognize the moral weight of promise-keeping here.* → **KNOWLEDGE**
  4.  **❌ Mentor on general principle:**  
      *(2) FAILS - Testimony is a freestanding general principle ("never break"). Situational embedding is missing.* → **NOT KNOWLEDGE** (even with 1 & 3)
  5.  **✅ Hypocrite Uncle on specific lie:**  
      *(1) Legitimate source? ✅ - You recognize him as *knowing* the right principle about honesty, even if he fails to act (his hypocrisy doesn't negate his competence *on this point*), (2) Situated judgment (lying for work), (3) You grasp the wrongness.* → **KNOWLEDGE** (if true).
  6.  **❌ Cultural norm absorption:**  
      *(1) FAILS - "Everyone" isn't a recognized *source*; it's ambient pressure, (3) FAILS - You actively suspect it's wrong, negating grasp of significance.* → **NOT KNOWLEDGE** (Just conformity).
  7.  **✅ Child learning lying is wrong:**  
      *(1) Legitimate source (parent as moral authority), (2) Situated judgment (lying as a type of act), (3) Child has capacity to grasp basic wrongness (harm/deception) at their level.* → **KNOWLEDGE** (Pedagogical context enables testimony).
  8.  **❌ AI on novel tech dilemma:**  
      *(1) FAILS - AI isn't recognized as a *legitimate source of moral insight*. It's a tool, not a member of the moral community you relate to. (2) May be satisfied (situated judgment), (3) May be satisfied (sounds right).* → **NOT KNOWLEDGE**. The blocker is the source's illegitimacy *as a moral testifier*.

  **Trade-offs & Verdicts You Must Give Up (for Simplicity):**

  1.  **Case 2 (Stranger) vs. Case 7 (Child):** Your principle *requires* giving up strict consistency here. The child gets a pass because the *parent-child relationship* inherently confers legitimacy (1) and the child's developmental stage makes deference appropriate (they *can't* grasp complex reasons yet). The stranger lacks this relational legitimacy. If you insist Case 2 *could never* be knowledge, you need an *additional* principle about *established trust relationships*, making the view slightly less simple.
  2.  **Case 5 (Hypocrite Uncle):** Your intuition is correct (and captured). Some philosophers (e.g., "integrity" views) argue hypocrisy blocks knowledge transmission. **You should NOT revise this verdict.** Your principle correctly focuses on the uncle's *competence* on the specific moral *claim*, not his character.

  **Predicting Your Verdict on the Bonus Case:**  
  *"Someone defers to a moral expert about a matter where the expert is more reliable than them AND they can see the expert's reasoning, but the reasoning depends on a value they don't share."*

  *   **Your Likely Verdict: NOT KNOWLEDGE.**
  *   **Why:**  
      *(1) Legitimacy:* The expert is reliable, so (1) might seem satisfied.  
      *(2) Situated Judgment:* Likely satisfied.  
      *(3) Grasping Significance:* **FAILS.** Seeing the reasoning isn't the same as grasping the *moral significance*. If the reasoning hinges on a value you don't share (e.g., expert prioritizes "purity" you reject), you cannot *grasp why* the act is wrong *from your perspective*. The significance remains alien. It's like understanding a mathematical proof using axioms you reject – you see the structure, but not the *truth*. Your Case 4 (general principle) intuition likely extends here – it's accepting an external framework, not internalizing the moral reality.

  **Is Any Verdict Confused? Potential Revision:**  

  *   **Case 1 (Forgotten Argument):** Your "KNOWLEDGE" verdict pushes against strong "understanding-requirement" views. **Is it confused?** Not necessarily, but it's controversial. Some argue the *inability to reconstruct* the argument later shows a lack of *stable understanding*, making it mere belief. **Should you revise?** Only if you become convinced that durable access to justifying reasons (even if not constantly rehearsed) is essential for *knowledge*. Your intuition leans towards externalism (knowledge via reliable source + initial comprehension). Stick with it unless deeply challenged.

  **The Big Picture of Your View:**  
  You reject **Pure Understanding-Required Views** (which would deny knowledge in Cases 1, 3, 5, 7).  
  You reject **Pure Reliability Views** (which would grant knowledge in Cases 2, 4, 6, 8).  
  You endorse a **Hybrid View:** Testimony *can* transmit moral knowledge, but only when:  
  *   The source has **epistemic authority** *to you* (relationship/recognition matters; Cases 1, 3, 5, 7 vs. 2, 8).  
  *   The content is **action-guiding and particular** (Cases 1, 3, 5 vs. 4).  
  *   You have **minimal competence** to receive it (initial comprehension in 1, recognition of the issue in 3/5, age-appropriate grasp in 7; lacking in 6).  

  This makes you an **Anti-Reductionist** about moral testimony (you think testimony itself can be a source of justification, not just a shortcut for inferences you could make) but with **Significant Constraints** focused on the *relational context* and the *nature of the moral judgment* being testified about. Your view resonates with aspects of Linda Zagzebski's "epistemic authority" and Alison Hills' emphasis on "moral understanding," but with a distinct pragmatic focus on situated particulars.
