  When testing the exemption test against Veblen, I note strong alignment on the people/things distinction as honor's basis. But Veblen adds crucial nuance - it's not just the object (people vs things) but the perceived distance from necessity that matters. The strongest version would be: honor attaches to directing persons specifically as an exemption from material necessity.

