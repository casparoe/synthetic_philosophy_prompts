prompt: |-
  I'm a staff writer at a general-interest magazine, at work on a long feature about automation and the social meaning of work — what becomes of an occupation's standing once machines can do its tasks. I am not a philosopher or an economic historian, and I have run aground on a passage that a source sent me with the note that everything I need is on the first page. I'd like you to act as a historian of economic thought who has taught this book to undergraduates and is practised at walking non-specialists through difficult nineteenth-century prose.

  Think carefully before committing to a reading, and begin by jotting down two or three candidate interpretations of the passage for yourself, so that what you give me is the survivor rather than the first thing that comes to mind. Neither of us has web access: work from the excerpt below and from whatever you reliably know, and where a question can only be settled by material outside the excerpt, say so and mark it as a gap instead of filling it in. Do not give me citations, page numbers, editions, or a reading list — I can't use them and I don't want them. Where you are genuinely torn between two readings, say so and name the sentence in the excerpt that each reading has to lean on; a marked disagreement is worth more to me than a tidied-up answer.

  The passage is Thorstein Veblen, from the opening chapter of The Theory of the Leisure Class (1899), a chapter titled "Introductory":

  "The institution of a leisure class is found in its best development at the higher stages of the barbarian culture; as, for instance, in feudal Europe or feudal Japan. In such communities the distinction between classes is very rigorously observed; and the feature of most striking economic significance in these class differences is the distinction maintained between the employments proper to the several classes. The upper classes are by custom exempt or excluded from industrial occupations, and are reserved for certain employments to which a degree of honour attaches. Chief among the honourable employments in any feudal community is warfare; and priestly service is commonly second to warfare. If the barbarian community is not notably warlike, the priestly office may take the precedence, with that of the warrior second. But the rule holds with but slight exceptions that, whether warriors or priests, the upper classes are exempt from industrial employments, and this exemption is the economic expression of their superior rank. Brahmin India affords a fair illustration of the industrial exemption of both these classes. In the communities belonging to the higher barbarian culture there is a considerable differentiation of sub-classes within what may be comprehensively called the leisure class; and there is a corresponding differentiation of employments between these sub-classes. The leisure class as a whole comprises the noble and the priestly classes, together with much of their retinue. The occupations of the class are correspondingly diversified; but they have the common economic characteristic of being non-industrial. These non-industrial upper-class occupations may be roughly comprised under government, warfare, religious observances, and sports."

  Then, from the paragraph that follows: "Manual labour, industry, whatever has to do directly with the everyday work of getting a livelihood, is the exclusive occupation of the inferior class. This inferior class includes slaves and other dependents, and ordinarily also all the women."

  And later in that same paragraph: "The lower classes are excluded from these secondary honourable employments, except from such as are plainly of an industrial character and are only remotely related to the typical leisure-class occupations."

  And from the paragraph after that: "The tribes belonging on this economic level have carried the economic differentiation to the point at which a marked distinction is made between the occupations of men and women, and this distinction is of an invidious character."

  Four things I can't get past. First, what work is the word "industrial" doing? Government, warfare, religious observances and sports are gathered as one kind of thing, and I can't tell what the kind is — is it that they act on persons rather than on materials, or that they are non-productive, or that they are merely the activities of the class that happens to be on top? Second, is the exemption a cause or an effect? He writes that the exemption "is the economic expression of their superior rank," which sounds as if the rank comes first and the exemption merely displays it, yet the whole passage reads as though being kept out of work is what makes the rank superior in the first place. Third, why is warfare placed above priestly service, and what does the ordering tell me about the criteria he's using? Fourth, that last fragment about the lower classes being excluded from honourable employments except the industrial ones seems to me to say nothing at all, and I suspect I'm missing a distinction that matters.

  Here is the peg for the piece. I have been carrying around a phrase from an economist I interviewed. She calls it the exemption test: an occupation keeps its social standing as automation spreads to the degree that its work can be seen from the outside as directing persons rather than handling things — so prestige tracks the object of the work, people or stuff, and not the skill, training or difficulty involved. I want to know whether the passage is an ancestor of that claim, a refutation of it, or neither. Test the claim against the text rather than against the book as a whole, and tell me which parts of it the text will bear and which parts I would be smuggling in.

  Please give me the answer in this order, at roughly these lengths, for about 1,100 to 1,200 words in total:

  Bottom line — no more than three sentences, first.

  What the excerpt says, plainly — about 200 words, taking me through it in order, and flagging the sentences you think are doing the real work.

  The load-bearing words — about 250 words on "industrial," "honour," "exempt," "superior rank" and "invidious": what each has to mean for the argument to run, and which of them I would have to define for my readers if I quote the passage.

  Testing the exemption test — about 300 words on where my economist's claim is supported by the text, where the text cuts against it, and the strongest version of the claim the passage will actually support.

  What I must not claim — about 150 words on the overclaims and anachronisms I'm most likely to commit, and the sentence in the excerpt that would be used against me.

  The objection I should expect — about 150 words: the strongest objection a historian or an economist would raise to my using the passage this way, and how I ought to handle it in the piece.
