  Okay, the user is preparing for a graduate seminar on human enhancement and wants to start with the criteria for distinguishing therapy from enhancement. They need a framework that can be applied by insurers, sports regulators, and clinicians. The key is to outline what any theory must satisfy to be viable.

  First, I need to cover all the cases they listed: myopia lenses vs. fighter pilot lenses, growth hormone for deficiency vs. healthy short child, statins for familial hypercholesterolemia vs. average cholesterol, cochlear implants for infants vs. Deaf adults, sleep-reduction pills, anti-aging interventions, SSRIs for depression vs. shyness, and muscle-enhancing gene edits. For each, I should specify how a theory should classify them and note if they're genuine tests or distractions. Some cases might challenge the distinction more than others, like cochlear implants for Deaf adults who see it as cultural erasure.

  Next, distinctions that mustn't be collapsed: therapy vs. prevention, trait vs. person enhancement, species-typical vs. population-typical ranges, medical need vs. want, and unusual vs. harmful traits. It's important to explain why each is necessary. For example, conflating therapy and prevention could lead insurers to deny coverage for preventive care, which is crucial for public health.

  Constraints include historical changes in disease definitions (like declassifying homosexuality), avoiding tech-dependent definitions, and not making everything enhancement. These ensure the theory is ethically grounded and not obsolete with tech advances. Historical changes show that societal values influence what's considered a disease, so the theory must account for moral progress.

  Purpose-dependence is critical. The insurer's "what is owed," regulator's "what is fair," and clinician's "what is indicated" might need different answers. A single distinction might not work for all, so the theory should either allow context-dependent application or abandon the distinction if it's unworkable.

  The user mentioned possibly abandoning the distinction. After laying out desiderata, I should consider if it's feasible. If conflicting requirements like purpose-dependence and constraint (c) can't be reconciled, abandoning might be necessary. Highlighting such tensions would be valuable for seminar discussion.

  Now, identifying which desiderata are most critical. Constraint (c) rules out theories based on current tech or that call everything enhancement. Purpose-dependence (d) challenges any one-size-fits-all approach. These two likely exclude many theories. Also, the cochlear implant case (a) tests whether the theory respects cultural identity, which many theories might fail.

  Joint unsatisfiability: Purpose-dependence (d) and constraint (c) might conflict. If different contexts need different answers but the distinction must be consistent, it's impossible. For example, cochlear implants might be therapy for infants but enhancement for culturally Deaf adults. The insurer might cover it as therapy, while the regulator bans it in sports. This tension suggests the distinction might not hold universally, pointing toward abandoning it.

  Marking desiderata: Non-negotiables include constraint (c) (not tech-dependent) and purpose-dependence (d). Negotiable might be specific cases in (a) if context changes classification. Least sure about the cochlear implant case—classifying it as enhancement for adults but therapy for infants might not hold if Deaf culture views both as unnecessary, but the medical need for infants is clear. This uncertainty highlights the theory's struggle with identity-based objections.

  Finally, the user's deeper need might be to provoke critical thinking in students. Highlighting tensions and possible abandonment encourages debate on whether the distinction is viable or if ethical frameworks should shift focus to harm, consent, or fairness instead.
answer: |-
  Here is a structured set of desiderata for a theory of the therapy/enhancement distinction, designed for your seminar's foundational discussion. I've organized it as requested, highlighted tensions, and assessed negotiability.

  **(a) Cases & Required Classifications (Genuine Tests vs. Distractions)**
  1.  **Myopia lenses vs. Pilot lenses:** *Should:* Therapy (corrects deficit) vs. Enhancement (exceeds species-typical function). *Test:* Genuine – tests baseline definition (deficit correction vs. improvement beyond norm).
  2.  **GH for deficiency vs. healthy short child:** *Should:* Therapy (treats disease) vs. Enhancement (aims beyond healthy norm). *Test:* Genuine – tests "disease" definition and "normal variation" boundary.
  3.  **Statins for FH vs. average risk:** *Should:* Therapy (treats high-risk pathology) vs. Prevention/Enhancement? *Test:* Genuine & Critical – blurs therapy/prevention; tests risk thresholds and "disease" status of risk factors. (*Theory must navigate this carefully*).
  4.  **Cochlear implant (infant) vs. Deaf adult (cultural):** *Should:* Therapy (corrects sensory deficit in non-consenting child) vs. Enhancement?/Not Indicated? (for adult rejecting deficit framing). *Test:* Genuine & Profound – tests objectivity of "deficit," role of bearer's perception/culture, and consent. (*Theory must classify infant case as therapy without invalidating cultural identity*).
  5.  **Sleep-reduction pill (no rebound):** *Should:* Enhancement (improves function beyond typical human baseline without addressing pathology). *Test:* Genuine – tests "non-rebound" enhancement of inherent limitations.
  6.  **Slowed aging in healthy adults:** *Should:* Enhancement (targets fundamental, universal biological process, not a pathology). *Test:* Genuine – challenges if "aging as disease" is accepted. (*Theory should resist this absent pathology definition*).
  7.  **SSRIs for MDD vs. shyness:** *Should:* Therapy (treats disabling disorder) vs. Enhancement (modifies normal personality variation). *Test:* Genuine – tests boundary between pathology and normal, albeit undesirable, traits.
  8.  **Gene edit for muscle mass (healthy athlete):** *Should:* Enhancement (improves function beyond norm without medical need). *Test:* Distraction? – Clearly enhancement, but useful to illustrate *why* it's uncontroversially distinct from therapy in this context.

  **(b) Distinctions That Must Not Be Collapsed & Why (Prejudice Callouts)**
  1.  **Therapy vs. Prevention:** *Why:* Insurers must cover prevention (e.g., vaccines, statins for high FH risk) as part of health *care*; collapsing risks denying effective care. Regulators may treat preventive *enhancements* differently.
  2.  **Enhancement of Trait vs. Enhancement of Person:** *Why:* A trait boost (e.g., memory) doesn't guarantee overall benefit (e.g., if it causes anxiety). Theories focusing solely on trait-level changes risk misclassifying net-harmful interventions as enhancements. (*Neglect often stems from uncritical techno-optimism*).
  3.  **Species-Typical vs. Population-Typical vs. Socially Expected Range:** *Why:* *Species-typical* (e.g., human vision range) anchors the baseline for "normal function." *Population-typical* (e.g., height in a region) is contextually relevant for some diagnostics but can mask deficits. *Socially expected* (e.g., female mood stability) is often prejudicial (e.g., pathologizing normal grief). **Crucially:** The theory must anchor "deficit" primarily in deviation from species-typical functional norms, not local averages or social demands. (*Collapsing risks medicalizing social non-conformity - prejudice alert*).
  4.  **Medical Need vs. Medical Want:** *Why:* Insurers rely on "need" (driven by pathology/risk) to limit coverage; clinicians prioritize "need" for indication. "Want" (e.g., taller child, sharper memory) is the domain of enhancement. Distinguishing prevents resource drain and medicalization of desires.
  5.  **"Statistically Unusual" vs. "Bad for Bearer": *Why:*** Many unusual traits are neutral (left-handedness) or beneficial (high IQ). Pathologizing unusualness alone is harmful (historical abuse). The distinction ensures "disease" requires *harm/dysfunction* linked to the trait, not mere statistical rarity. (*Collapsing risks eugenic thinking - prejudice alert*).

  **(c) Constraints the Theory Must Respect**
  1.  **Historical Change & Moral Progress:** The theory must acknowledge that disease definitions *can* change based on scientific/ethical understanding (e.g., homosexuality). It must provide a framework distinguishing erroneous past classifications (hysteria) from progress (removing homosexuality), likely involving harm/dysfunction criteria sensitive to social context and individual well-being. *Rules out:* Static, purely biological definitions.
  2.  **Not Defined by Current Medical Capability:** The line must be based on concepts of health, disease, and normal function, *not* what medicine currently treats. *Rules out:* Definitions like "therapy = what doctors currently do."
  3.  **Not Erasing the Distinction:** The theory must not classify *every* life-improving intervention (education, nutrition, safe housing) as enhancement. *Rules out:* Overly broad definitions (e.g., "anything that improves well-being"). The distinction must retain meaning for the specific contexts (insurance, sport, clinical indication).

  **(d) Purpose-Dependence: One Distinction or Three?**
  *   **The Problem:** The core question ("Is this therapy or enhancement?") likely needs *different interpretations* for each context:
      *   **Insurer (What is owed?):** Focuses on *medical necessity* driven by pathology/dysfunction/high risk. "Therapy" here includes prevention.
      *   **Sports Regulator (What is fair?):** Focuses on *undue advantage* and *preserving the sport's character*. "Enhancement" is broader (e.g., altitude tents might be therapy for anemia but banned enhancement).
      *   **Clinician (What is indicated?):** Focuses on *medical benefit vs. risk for the patient*. Indication is narrower than "therapy" (e.g., statins for high FH risk are therapy but may not be indicated for an 85-year-old).
  *   **Implication:** A monolithic theory forcing the *same* answer for all contexts is inadequate. The theory must either:
      *   **Option 1:** Provide a *core definition* (e.g., "correcting/pathology vs. improving beyond species-typical norm") that each context *applies differently* based on their purpose (e.g., insurer emphasizes "pathology," regulator emphasizes "beyond norm").
      *   **Option 2:** Acknowledge the distinction is *context-dependent* from the start, offering different (but related) criteria for each domain.
      *   **Option 3 (Abandonment):** Argue the distinction is too unstable/context-dependent for *any* principled line across all uses. Focus shifts to context-specific questions: "Is this medically necessary?" (insurer), "Does this violate fair competition?" (regulator), "Do benefits outweigh risks for this patient?" (clinician). *This becomes viable if desiderata conflict irreconcilably.*

  **Key Desiderata Doing the Real Work & Tensions**
  1.  **Constraint (c3) - Not Erasing the Distinction:** (Non-negotiable). This immediately rules out overly broad "well-being" theories and forces a focus on *medical* context.
  2.  **Purpose-Dependence (d):** (Non-negotiable). This excludes any theory assuming a single, context-independent line is possible or desirable. It forces modularity or reconsideration.
  3.  **Case (a4) Cochlear Implant (Cultural Deafness):** (Non-negotiable test). This profoundly challenges theories that define "deficit" purely biologically or functionally without incorporating the individual's/culture's perspective on harm and identity. Many theories founder here.
  4.  **Distinction (b3) Species-Typical vs. Socially Expected:** (Non-negotiable). Anchoring in species-typical function is essential to avoid medicalization of social non-conformity. But it's complex to define operationally.

  **Joint Unsatisfiability? The Core Tension**
  *   **Constraint (c1) - Historical Change/Moral Progress** requires the theory to incorporate evolving understandings of harm, dysfunction, and social context (e.g., respecting Deaf culture's view).
  *   **Purpose-Dependence (d)** requires different applications of the core concept (or different concepts) for insurers (focused on pathology/need) vs. regulators (focused on fairness/norms) vs. clinicians (focused on indication).
  *   **Tension Point:** Attempting a **single, stable, objective definition** of "disease/deficit" that simultaneously:
      *   Respects subjective/cultural perspectives on harm (c1, a4),
      *   Provides a clear, objective line for insurers determining coverage ("need"),
      *   Provides a clear, objective line for sports regulators determining fairness ("undue advantage"),
      *   Avoids being purely technological (c2) or overly broad (c3),
      ...may be **impossible**.
  *   **Result:** This tension strongly pushes towards **Option 3 (Abandonment)**. The most defensible path may be to jettison the *universal* therapy/enhancement distinction and focus on answering the *specific normative questions* of each context directly, using concepts like medical necessity, undue advantage, risk/benefit, and justice, without needing an overarching metaphysical line.

  **Confidence & Least Certain Point**
  *   **High Confidence:** The non-negotiability of Purpose-Dependence (d), Constraint (c3 - not erasing the distinction), and the critical challenge posed by the Cochlear Implant case (a4) for simplistic biological definitions. I would vigorously defend these against critics.
  *   **High Confidence in Core Tension:** The joint unsatisfiability of a single, objective, stable definition meeting (c1), (d), and the needs of all contexts is the most significant and interesting result.
  *   **Least Certain Point:** Whether **Distinction (b2) - Trait vs. Person Enhancement** is truly essential or a distraction. *Why:* While intuitively important (a trait boost isn't necessarily good overall), it might be addressed by the *risk/benefit assessment* inherent in clinical indication or regulatory approval, rather than being a core part of the *definition* of enhancement itself. A theory could define enhancement at the trait level ("intervention to improve trait X beyond species-typical norm") and let downstream evaluation assess the net impact on the person. This might be negotiable if the other desiderata are robustly met.

  **Recommendation for Seminar:** Present the desiderata and tensions. Frame the core question early: *Can any single theory satisfying these diverse demands exist, or is abandonment (focusing on context-specific questions) the most honest conclusion?* The Cochlear Implant case and the Purpose-Dependence constraint are likely the most fruitful starting points for debate.
