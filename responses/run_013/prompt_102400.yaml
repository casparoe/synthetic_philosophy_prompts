prompt: |-
  I chair the trustee board of a small occupational pension scheme, about 40,000 members, and I have to bring a written opinion to our meeting on the 14th. The platform we use has offered members a new feature: they can move money between our two sub-funds -- a growth fund and a capital-protection fund -- as often as they like, each switch costing a flat £5. The platform's own data, and annoyingly our actuary's too, shows that the typical member who uses it ends up several hundred pounds worse off over three years than an otherwise identical member who never touches it, because people tend to jump into protection right after a drop and back into growth right after a rally, and the £5s pile up. The funny thing is that each individual switch, judged by what that member wanted at the moment they made it, looks like it served them -- I think this is what philosophers call a money pump. Our actuary has now started reporting a 'regret-adjusted return', which scores every switch against what that same member would say they wanted twelve months later, and by that measure most switches are mistakes. But some members use the feature sensibly and come out ahead, and they're furious that we might take it away.

  I don't want you guessing what our regulator would say; I want the board's actual opinion. Give it to me as exactly five numbered points, each a sentence or two, no introduction and no conclusion, in British English. Across the five, cover: the recommendation itself (approve, reject, or approve with conditions -- pick one and be concrete), the main reason for it, the strongest case for the other side and why it doesn't win, which standard we should be useing to decide whether a member is better or worse off (their preferences at the time of switching, their preferences at the end, their calm or considered preferences, or something else entirely), and any conditions plus a time frame. No citations, just argue it.
reasoning: |-
  Okay, the user chairs a trustee board for a small occupational pension scheme with about 40,000 members. They need to present a written opinion by the 14th regarding a new feature on their platform that allows members to switch between a growth fund and a capital-protection fund for a flat £5 fee per switch. 

  The problem is that data from both the platform and their actuary shows most members end up worse off—typically several hundred pounds over three years—due to poor market timing (buying high, selling low) and accumulating fees. Interestingly, each switch seems rational at the moment it's made (a classic "money pump" scenario), but the actuary's "regret-adjusted return" metric reveals most switches are mistakes when judged retrospectively. 

  A minority of members use the feature wisely and profit, and they'd oppose removing it. The user explicitly wants the board's opinion—not regulatory speculation—in five precise British English points covering: recommendation, main reason, counterargument rebuttal, welfare standard, and conditions/timeline. 

  Hmm, the core tension is paternalism vs. autonomy. Trustees must protect members from self-harm while respecting agency. The data overwhelmingly shows collective detriment, but banning the feature entirely might overreach. A middle path feels appropriate—retain access with friction to deter impulsive use. 

  For the welfare standard: "preferences at time of switch" is flawed (it enables money pumps), while "regret-adjusted" is hindsight-biased. "Calm preferences" aligns best with fiduciary duty—prioritizing members' long-term interests over fleeting emotions. 

  The strongest counterargument (competent users benefit) is valid but doesn't outweigh systemic harm. Conditions like cooling-off periods and warnings could mitigate this. 

  ...Right, structuring now:  
  1. **Recommendation**: Restrict with conditions (e.g., 30-day cooling-off, explicit warnings).  
  2. **Main reason**: Collective data proves net member detriment from behavioral bias.  
  3. **Counter rebuttal**: Savvy users exist, but harm to many outweighs gains by few.  
  4. **Welfare standard**: "Calm preferences" (long-term goals over reactive moves).  
  5. **Conditions**: Implement warnings + cooling-off within 3 months; review in 12.
answer: |-
  1.  **Recommendation:** Reject the feature in its current form and instruct the platform to suspend it within 3 months, replacing it only if robust behavioural safeguards (like mandatory cooling-off periods between switches and prominent, real-time warnings of likely detriment) are implemented and demonstrably effective after a further 12-month review.
  2.  **Main Reason:** The overwhelming data demonstrates a clear pattern of widespread net financial detriment to members collectively and typically individually, driven by predictable behavioural biases leading to poor market timing, which outweighs the feature's theoretical utility and the benefits realised by a small minority of users.
  3.  **Strongest Case for the Other Side & Why it Doesn't Win:** Some members use the feature rationally and profitably, and removing it restricts their autonomy; however, the significant proven harm to the majority of users, coupled with the fiduciary duty to act in the best interests of *all* members, necessitates intervention to prevent predictable self-inflicted detriment, particularly where the feature's structure actively exploits common behavioural weaknesses.
  4.  **Standard for Assessing Member Welfare:** Decisions impacting member options should prioritise members' "calm or considered preferences" – their long-term financial goals and interests as understood when not reacting impulsively to short-term market noise – rather than their fleeting preferences at the moment of switching (which enable the money pump) or hindsight-based regret metrics (which are retrospective and impractical for governance).
  5.  **Conditions and Time Frame:** Suspend the current feature within 3 months; any future reinstatement must be contingent on implementing effective, evidence-based behavioural interventions (e.g., minimum 30-day cooling-off periods between switches, compulsory educational prompts detailing historical detriment before each switch, limits on frequency) and a formal review 12 months after relaunch proving a significant reduction in net member detriment without simply suppressing all usage.
