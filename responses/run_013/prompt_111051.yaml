  ## LOT 327
  **ATTRIBUTED TO JEAN-PIERRE MERCIER (French, 1887-1954)**
  *Paysage aux Peupliers (Landscape with Poplars)*
  Oil on canvas
  Signed lower left: 'J.P. Mercier'
  65.5 x 81 cm (25 3/4 x 31 7/8 in.)
  **Note: This work is a known forgery, executed by Henri Blanc (1901-1978), circa 1935.**

  **Estimate: £15,000 - £25,000**

  **LOT DESCRIPTION:**
  A characteristically lyrical depiction of the banks of the Marne River near Mercier’s favoured painting grounds at Chennevières-sur-Marne. The composition features a stand of slender poplar trees framing a view across calm water towards a low, sun-dappled hillside under a sky animated with cumulus clouds. Executed with Mercier’s typical loose, post-Impressionist brushwork, the palette is dominated by verdant greens, soft ochres, and cerulean blue. The signature, applied with confidence in the artist’s customary cursive, occupies its traditional position. While the work undeniably manifests Mercier’s stylistic hallmarks – the vibrancy of light, the rhythmic structure, the harmonious balance of natural forms – it is crucial for prospective bidders to understand that this is not a work by Mercier’s hand. It is a deliberate forgery created by the skilled copyist Henri Blanc around 1935, a fact definitively established in 2019. This attribution to Blanc supersedes the previous attribution to Mercier under which the painting was known and exhibited for over eight decades.

  **PROVENANCE:**
  Acquired by Monsieur Édouard Dubois, Paris, directly from the Galerie Durand-Ruel, Paris, in 1936 (as Jean-Pierre Mercier); thence by descent within the Dubois family; Private Collection, Lyon (acquired from the above family via private treaty sale, 1972); Sold as 'Jean-Pierre Mercier', *Important Impressionist & Modern Art*, Christie's, London, 12 June 2003, lot 42 (realised £320,000); Private Collection, Switzerland; Submitted to the Comité Jean-Pierre Mercier, Paris, for inclusion in the forthcoming catalogue raisonné, 2019; Following technical analysis (cross-referenced pigment chronology, canvas weave anomaly, and signature morphology comparison) and stylistic reassessment by the Comité, the work was formally deattributed from Mercier and identified as a forgery by Henri Blanc (Comité dossier JP-M-1936-07/Blanc); Returned to the vendor; Acquired by the present owner from Galerie Moreau, Geneva, 2020 (as 'Henri Blanc, after J-P Mercier').

  *We are grateful to Dr. Sophie Arnaud of the Comité Jean-Pierre Mercier and to Monsieur Alain Moreau of Galerie Moreau for their assistance in clarifying the history of this work.*

  **CONDITION REPORT:**
  The painting is presented in a good state of preservation commensurate with its age and exhibition history. The canvas is stable and securely attached to its original stretcher. There is a fine, even craquelure across the surface, consistent with age, and minor abrasion is visible within the impasto of the sky, upper left quadrant, under raking light. There is a 3cm linear tear, professionally repaired and restored, along the lower edge, approximately 10cm from the left corner, resulting from an incident in 2004 (reportedly when the previous owner accidentally struck the canvas with a poker upon receiving initial, though later confirmed, doubts about its authenticity). This restoration is discreet but detectable under UV examination. Varnish is even, slightly discoloured. The work presents very well and its visual impact, as an evocation of Mercier’s style and period, remains strong.

  **SPECIALIST'S NOTE:**
  The estimate reflects the unique position this work occupies within the market for early 20th-century French painting. While undeniably executed by Henri Blanc with the intent to deceive, the painting possesses significant historical and art-market interest. Scientifically and stylistically, it remains indistinguishable *as an object* from a work Mercier might have painted in the mid-1930s. The pigments – primarily cobalt blue, cadmium yellow, viridian, and zinc white – are entirely period-appropriate. The canvas support and ground layer match commercial materials readily available to artists like Mercier in Paris at that time. The brushwork confidently replicates Mercier’s fluid technique. Indeed, the Comité's initial acceptance of the work (prior to the discovery of specific comparative evidence linking it definitively to Blanc's known methods) underscores its technical accomplishment.

  The value resides not merely in its technical proficiency as a copy, but in its remarkable documented history. For over 80 years, this painting *was* a Jean-Pierre Mercier. It was acquired from a major gallery, exhibited as such in the Dubois family home and later in the Lyon collection, catalogued authoritatively by Christie’s, and hung within significant collections dedicated to Mercier’s milieu. It accrued the patina, both physical and historical, of a genuine work. Its deauthentication in 2019 does not erase this history; it adds a compelling, complex layer. The painting stands as a testament to Blanc’s skill and a fascinating artefact of art market dynamics. It embodies a specific moment in the reception of Mercier’s work and the vulnerabilities of connoisseurship.

  The estimate acknowledges that the work no longer commands the premium of an authentic Mercier (whose comparable works now realise in excess of £800,000). However, it recognises several distinct factors: the exceptional quality of the forgery itself, placing it at the apex of Blanc’s known output; the painting’s unique provenance, which includes its long acceptance as genuine and its subsequent dramatic reassignment; its value as a case study for scholars and collectors interested in the history of forgery and authentication; and its inherent aesthetic merit as a fine example of the post-Impressionist landscape tradition, regardless of ultimate authorship. While Professor Émile Lacroix’s assertion that “it is merely a lie made visible” carries undeniable ethical weight, the market demonstrates a persistent fascination with such objects that possess a complex biography. The estimate thus balances the work’s status as a known forgery against its undeniable presence as a significant historical object and a visually compelling painting. It represents a rare opportunity to acquire a work that has participated fully in the life cycle of a masterpiece, embodying both the aspirations and the fallibilities of the art world. The price reflects the tangible residue of belief and the enduring power of the narrative attached to the object, even when that narrative has been fundamentally revised. The market, after all, trades as much in testimony as in pigment. This painting possesses a particularly rich, albeit unconventional, set of documents and a story uniquely its own.
