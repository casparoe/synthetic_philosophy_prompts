prompt: |-
  I hold a two-year research fellowship in philosophy. My training is in formal epistemology; I am comfortable with the standard decision-theoretic machinery, but I am not an economist and I will be working alone. I now have to commit to a single programme in the foundations of risk-weighted expected utility (REU), and what I want from you is an agenda rather than a survey: no literature review, no reading list, just a defended ranking of the open questions with the reasoning exposed.

  For clarity about the framework I have in mind: the value of a lottery is a weighted sum of the utilities of its outcomes, but the weight on an outcome is not its probability; it is a rank-dependent weight, built from a function r — the risk function — applied to the probability that the lottery yields something at least as good as that outcome. Where r is the identity, the representation collapses into ordinary expected utility; where it is not, its shape encodes the agent's attitude to risk. Assume I already know the Allais-style motivation, the standard expected-utility axioms, and the textbook objections, and do not spend words re-explaining them. I want the questions that are visible only from inside the framework.

  Assume I can produce one substantial paper and one follow-up. For each question you rank, tell me why it is upstream of the others or not, whether it is tractable for a single philosopher working alone, whether it is neglected mainly because it is unfashionable rather than because it is settled, and what would actually change downstream if it were answered. The following are the ones I keep running into and cannot rank myself:

  - that the representation is formally rank-dependent, and so a close cousin of the rank-dependent and cumulative-prospect-theory models in economics and psychology: is the claim that r is an attitude to risk rather than a distortion of belief doing real work, or is the philosophical content carried entirely by the formalism?
  - whether r must be a single global transformation of the relevant probabilities, or whether a plausible theory needs the risk attitude to vary with the kind of stake at issue, and what that would do to the axiomatisation.
  - whether the framework can be extended from risk to ambiguity without collapsing into expected utility with respect to a non-additive capacity, and whether anything of philosophical interest survives the collapse.
  - whether the departures from expected utility force revisions to the standard results about the value of information, the option value of delay, and dynamic consistency.
  - whether risk attitudes can be aggregated across persons, and what REU implies for the ex ante / ex post dispute in normative economics.
  - whether REU is best read as a theory of instrumental rationality that permits risk attitudes, or as a theory on which chances are themselves objects of value; I have been playing with the second reading and cannot tell whether it is coherent or merely a restatement of the first.

  Tell me where each of these belongs, add the ones I have missed that outrank them, and say what would have to happen in the next year or so for the top of the list to change. If the honest answer is that one of these is not a real question, or that the foundations are in worse shape than the framework's proponents allow, I would rather hear that than be handed a list on which everything is equally worth doing.
reasoning: |-
  Okay, the user is a philosopher with a two-year fellowship in formal epistemology, focusing on risk-weighted expected utility (REU). They need to prioritize research questions without getting bogged down in surveys or literature reviews. They've listed several specific issues but can't rank them, and they want an agenda that defends the ranking with practical considerations.

  First, I need to understand their background. They're trained in formal epistemology and decision theory but not an economist, working alone. Their output is limited to one substantial paper and a follow-up. They need questions that are foundational, tractable for a solo philosopher, and have downstream impacts.

  Looking at their listed questions:

  1. **Risk attitude vs. belief distortion**: Is REU's interpretation as risk attitude rather than distorted belief philosophically substantive?
  2. **Context-dependent risk attitudes**: Must r be global, or can it vary with stakes? How does this affect axiomatization?
  3. **Extension to ambiguity**: Can REU handle ambiguity without collapsing into non-additive EU? What survives?
  4. **Dynamic consistency**: How do departures from EU affect info value, option value, dynamic consistency?
  5. **Aggregation and ex ante/ex post**: Can risk attitudes be aggregated? Implications for normative economics?
  6. **Interpretation**: Is REU about instrumental rationality or valuing chances?

  I should rank these by upstream importance, tractability, neglect, and downstream impact. The user wants honesty—if something isn't a real question or foundations are shaky, say so.

  Starting with the most upstream: **Question 6 (Interpretation)**. This is meta-theoretical—defining what REU *is*. If r is just a re-statement of instrumental rationality, the framework loses philosophical distinctiveness. But if chances themselves have value, that's a novel ontological claim. Answering this affects how we approach all other questions. It's tractable for a philosopher; they can analyze coherence without heavy formalism. Neglected because it's philosophical, not technical. Downstream, it clarifies whether REU offers new foundations or just a modeling tool.

  Next, **Question 1 (Risk vs. Belief)**. This is the core identity of REU. If r is a belief distortion, REU collapses into cognitive psychology models. Defending its uniqueness is crucial. It's tractable—compare axiomatizations and interpretations. Neglected because economists prioritize predictive power over ontological clarity. Downstream, it determines if REU has philosophical content beyond formalism.

  Then **Question 4 (Dynamic Consistency)**. This tests REU's robustness in sequential decisions. If dynamic consistency fails without ad-hoc fixes, it undermines REU as a rationality model. Requires analyzing dynamic choice axioms but is doable alone. Neglected—economists focus on static choices. Downstream impacts: if inconsistent, REU might need refinements or face legitimacy loss.

  **Question 2 (Context-Dependence)**. If r varies with stakes, it challenges REU's simplicity but might be more realistic. Needs new axiomatization—tough for a solo researcher but possible with ordinal constraints. Neglected because global r is mathematically cleaner. Downstream: if context-dependent, it could make REU more applicable but less elegant.

  **Question 5 (Aggregation)**. Important for normative applications but relies on resolving Q6 first. Aggregating non-EU preferences is messy; might require heavy game theory. Less neglected in welfare economics. Downstream: affects policy relevance but not core theory.

  **Question 3 (Ambiguity)**. Likely collapses into non-additive EU, making REU redundant here. Unless a new interpretation (from Q6) saves it. Technically complex; might need multiple priors. Not neglected—many try to merge risk and ambiguity. Low priority as it offers less unique insight.

  Missing questions? Perhaps **normative grounding**: Why should rational agents have non-linear r? Or **learning under REU**: How do agents update beliefs? But these are downstream.

  Top priority is Q6—it's the keystone. If resolved, it shapes all else. For the ranking to change, new formal results might emerge, but currently, interpretation is paramount. The user should tackle Q6 first, then Q1, using the follow-up for Q4. Be honest: foundations aren't settled, but that's why it's fruitful.
answer: |-
  Here is a defended ranking of your questions, designed for maximal upstream impact and tractability within your constraints. I’ve added one critical missing question and flagged another as potentially non-substantive. The ranking prioritizes **conceptual foundations first**, **dynamic implications next**, and **extensions last**, based on what must be resolved to stabilize the framework. Downstream impact, neglect, and feasibility are explicit in each assessment.

  ---

  ### **Ranked Research Agenda**
  1.  **Question 6: Interpretation (Instrumental Rationality vs. Chances as Value-Laden)**  
      **Why Upstream?** This is the *keystone*. If REU is merely instrumental rationality permitting risk-attitudes, it faces charges of arbitrariness; if chances themselves are objects of value, it implies a radical ontology of "risk-as-a-good." Resolving this determines whether REU is a conservative extension of decision theory or a revolutionary metaphysics.  
      **Tractability:** High for a philosopher. Requires conceptual analysis (e.g., can "chance" coherence bear normative weight?) and formal checks (e.g., does valuing chances reduce to valuing outcomes under redescription?).  
      **Neglect:** Profound. Proponents vaguely assert the instrumental reading, but the value-laden chance interpretation is underexplored (and potentially incoherent). Economists ignore it as "non-revealed-preference."  
      **Downstream Impact:** Everything changes. If chances are value-laden, it forces rethinking:  
      - Belief distortion (Q1) becomes incoherent (beliefs can’t be distorted if chances aren’t beliefs).  
      - Aggregation (Q5) requires meta-ethical work on valuing others’ chances.  
      - Risk-attitude variation (Q2) may reflect context-dependent value structures.  
      **Output Target:** Substantial paper. Answer: The value-laden reading is either incoherent or collapses to instrumental rationality with disguised state-dependent utility.

  2.  **Question 1: Risk Attitude vs. Belief Distortion**  
      **Why Upstream?** REU’s *entire identity* hinges on this. If `r` is a belief distortion, REU is just Cumulative Prospect Theory (CPT) with extra steps. If it’s genuinely risk attitude, REU offers a new philosophy of rational agency.  
      **Tractability:** Moderate. Requires dissecting axiomatizations: REU’s key axiom (co-monotonic independence) is shared with CPT, but its justification differs. Can you isolate a uniquely "risk-attitudinal" axiom?  
      **Neglect:** Yes. Economists conflate models; philosophers overlook formal equivalence.  
      **Downstream Impact:** High. If `r` is not belief-distortion:  
      - Extension to ambiguity (Q3) must avoid non-additive beliefs.  
      - Normative aggregation (Q5) gains traction (distorted beliefs are irrational; risk-attitudes may not be).  
      - Interpretation (Q6) is constrained: valuing chances requires non-belief-distortion.  
      **Output Target:** First half of follow-up paper. Answer: REU’s formalism *can* encode pure risk-attitude, but only if its axioms normatively exclude belief-based interpretations.

  3.  **Added Question: Dynamic Consistency and Value of Information**  
      **Why Here?** You listed it as Q4, but it’s underrated. REU’s static elegance often masks dynamic incoherence. If REU violates the value of information or forces time-inconsistency, its normative claim collapses.  
      **Tractability:** High. Use simple 2-period examples (e.g., buying information before a gamble). Requires dynamic choice machinery but no novel math.  
      **Neglect:** Severe. Dynamic REU is axiomatically underdeveloped (unlike for ambiguity models).  
      **Downstream Impact:** Critical for applications:  
      - If consistent: REU is robust for sequential decisions (e.g., climate policy).  
      - If inconsistent: Forces model revision (e.g., restricted domains) or undermines Q6.  
      - Directly affects option value (your Q4).  
      **Output Target:** Second half of follow-up paper. Answer: REU violates dynamic consistency for non-convex `r`, requiring agent-type restrictions.

  4.  **Question 2: Context-Dependent Risk Attitudes**  
      **Why Here?** Resolving Q1 and Q6 first tells us *what* `r` is; this asks if it *varies*. Global `r` is elegant but implausible (e.g., risk-aversion over money vs. health).  
      **Tractability:** Low-moderate. Needs new axioms for context-indexed `r` and may require measurable stakes.  
      **Neglect:** Yes. Economists prefer parsimony; philosophers haven’t formalized it.  
      **Downstream Impact:** Moderate. If `r` is context-dependent:  
      - Aggregation (Q5) becomes harder (interpersonal comparisons of context).  
      - Axiomatization fragments, reducing generality.  
      **Output Target:** If Q1/Q6 resolve favorably, this becomes a standalone project. Otherwise, skip.

  5.  **Question 5: Aggregation and Ex Ante/Ex Post**  
      **Why Here?** Normative aggregation requires REU to be stable (Q1–Q6 resolved). Ex ante Pareto (respecting risk-attitudes) clashes with ex post equality.  
      **Tractability:** Low. Demands game theory/social choice tools and interpersonal `r`-comparisons.  
      **Neglect:** Partial. The ex ante/ex post debate is live but REU-specific work is sparse.  
      **Downstream Impact:** Narrow but important for welfare economics. If REU aggregates cleanly, it defends ex ante approaches.  
      **Output Target:** Only pursue if earlier work shows REU is normatively robust.

  6.  **Question 3: Ambiguity Extension**  
      **Rank:** Lowest. **Verdict: Likely a non-question.**  
      **Why:** REU under ambiguity *is* expected utility with non-additive capacity (via Choquet integration). "Philosophical interest" only survives if you’ve defended REU’s unique ontology (Q1/Q6) and shown how ambiguity "risk-attitudes" differ. Otherwise, it’s a reinvention of Schmeidler.  
      **Tractability:** Low. Formally derivative.  
      **Neglect:** No—it’s crowded (e.g., α-maxmin models).  
      **Downstream Impact:** Minimal. Collapses into existing ambiguity theory.  
      **Output Target:** Avoid unless Q1/Q6 reveal a novel ambiguity link.

  ---

  ### What Would Change the Ranking?
  - **Within 1 year:** If a major paper (e.g., by Buchak or Al-Najjar) resolves Q1 or Q6 definitively, shift focus to **dynamic consistency (Q4)** as the new keystone. If economists formalize context-dependent REU, **Q2** rises.  
  - **Foundational Health Check:** REU’s foundations *are* fragile—its proponents underplay dynamic problems (Q4) and ontological ambiguities (Q6). But this fragility is a research opportunity, not a dead end.

  ### Recommended Path
  1. **Year 1:** Tackle **Q6** (substantial paper). Conclude that the value-laden chance reading is incoherent, anchoring REU in instrumental rationality.  
  2. **Year 2:** Address **Q1** (follow-up part 1): Argue that REU’s axioms *can* isolate risk-attitude, but only under your Q6 resolution. Then solve **Q4** (follow-up part 2): Show dynamic consistency holds only for convex `r`, demanding agent-type restrictions.  

  This agenda maximizes philosophical novelty, isolates REU from its cousins, and forces clarity on what the framework *is*. If successful, you’ll redefine how risk-attitudes are understood in rational choice theory—without needing an economist.
