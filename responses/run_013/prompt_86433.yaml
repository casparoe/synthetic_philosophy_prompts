prompt: |-
  I have come to hold a position, and I want you to map its exposure rather than restate it. The position is this. When many roughly likeminded agents are each capable, on their own authority, of bringing about the same consequential outcome, and each decides whether to do so on the basis of a private and fallible assessment, then the probability that at least one of them imposes that outcome against the group's better judgment rises toward certainty as the number of agents grows. The individual error rate can be very small and the aggregate risk still be large, because the risk is compounded across many independent chances to act. From this I conclude that the default in such settings should be a standing presumption against unilateral action: refrain unless one can show that the collective assessment, and not merely one's own, favors acting.

  What I want from you is the anatomy of this position's exposure. Which assumptions are actually load-bearing, what would count against them, and which candidate defeaters are real rather than merely rhetorical? In particular I want your judgment on the following, and I do not want them treated as equally serious:

  (a) Whether the argument is well formed as stated. It counts the errors that produce action and ignores the errors that produce inaction, so the mirror-image quantity — the probability that no one acts when the group would have wanted someone to — may be just as large. If a conformity rule merely trades one aggregate risk for its mirror image, is anything gained?

  (b) Whether the aggregate risk really scales with the number of agents once the assumption of independent, individually small error probabilities is relaxed. Correlated errors, heterogeneous error rates, or a single agent who is simply better informed than the rest may break the derivation; I want to know how much of the result is an artifact of the probabilistic model rather than a feature of the situation.

  (c) Whether the argument presupposes what it needs. It takes the pooled judgment of the group as the benchmark against which the acting agent is judged fallible. But the agent who acts is often the one holding information the group lacks, and the group's own errors may be correlated rather than cancelled. What would have to be true for the group's judgment to deserve that privileged status?

  (d) Whether the conclusion survives the case of the lone dissenter whose unauthorized act averts a collective disaster, and whether such cases can be dismissed as rare exceptions without circularity.

  (e) Whether the benchmark is well defined at all. With genuinely heterogeneous values, "acting against the group's interest" may not be a determinate description, in which case the argument may be about disagreement rather than about error.

  (f) Whether the prescription recurses rather than dissolving the problem: a group that adopts a norm of conformity is then itself a single agent capable of acting unilaterally with respect to other groups, so the same structure may reappear one level up.

  (g) Whether the position is really about unanimity and multiplicity at all, or whether the work is being done by something else — irreversibility, say, or the asymmetry between harms and benefits — in which case the interesting version of the view may be narrower than the one I stated and largely a restatement of a mundane point about evidential thresholds for actions that cannot be undone.

  I would also like to know what the position predicts that its rivals do not, so that I can see whether it risks anything at all or has been quietly qualified into unfalsifiability — and if it has, whether that is a defect in a view of this kind or simply the price of a probabilistic argument whose parameters are unmeasured.

  Rank the defeaters by how much they should move me: which are fatal, which force a genuine qualification of the position, and which are noise. Take a stand. Do not lay out the options and leave the choice to me. Tell me whether the core claim survives in any form worth holding, what the surviving form is, and whether the thing I end up with is still recognizably the position I began with or something thinner wearing its name. The consideration I would personally find most persuasive against myself is a demonstration that once the view is restricted to the cases it actually handles, it has quietly become a claim about irreversibility rather than about unilateralism; if you think that is what happens, say so plainly, and say whether it matters.
reasoning: |-
  Okay, the user presents a nuanced position on unilateral action in group settings and wants a critical dissection. They're clearly deeply engaged with the topic—this isn't casual curiosity but a rigorous intellectual challenge. The level of specificity in their seven sub-questions (a-g) suggests they've already wrestled with this extensively and are now stress-testing their own conclusion. 

  First impression: Their core argument is probabilistic and structural—about how individual fallibility scales with group size. But they're explicitly not asking for validation; they want vulnerability mapping. That's refreshingly self-critical. I notice they even preemptively named what would persuade them most (irreversibility as the real driver), which tells me they're genuinely open to deconstruction.

  Breaking this down: The position rests on three load-bearing beams—(1) independence of errors, (2) homogeneity of judgment benchmarks, and (3) action/inaction symmetry. The user's sub-questions expertly target each. For instance, (b) attacks independence, (c) and (e) attack benchmark validity, (a) attacks symmetry. Smart framing.

  What's unspoken but palpable: They're likely formulating policy or ethical guidelines (given "presumption against unilateral action"). The urgency around "fatal" vs. "noise" defeaters hints at real-world application stakes. Also, their request to rank defeaters suggests they're preparing for pushback and need rhetorical armor.

  Biggest tension I see: Their conclusion demands deference to collective judgment, but if that judgment is corrupt/incompetent (as in historical atrocities), the position could justify passivity. That's the unstated horror scenario haunting premise (d)'s "lone dissenter" case. They sense this but haven't fully articulated the fear—maybe because it's emotionally charged.

  My approach: Treat their intellect with equal rigor. No handholding on probability math (they get joint probabilities), but expose where real-world complexity cracks the model. Specifically: 
  - Correlated errors (b) are the true Achilles' heel—empirically common and mathematically devastating. 
  - The values heterogeneity point (e) is profound; if groups aren't unitary, "better judgment" is incoherent. 
  - The recursion problem (f) is theoretically neat but practically negligible—coalitions don't scale like individuals.

  Most surgically important insight: Their suspicion about irreversibility being the real engine is correct. The position only holds water when actions are irreversible and harmful. Otherwise, unilateral experiments (like a doctor trying a new treatment) could be net-positive. I'll emphasize this as their own "most persuasive" self-critique.

  Final note: They'll reject platitudes. Need concrete thresholds—e.g., "correlation coefficients >0.3 collapse the argument," or "groups below size N gain nothing from conformity." Give them falsifiable claims to test.
answer: |-
  Your position is structurally sound but exists on a knife-edge—its power comes from precise, contestable assumptions. Below, I dissect its exposure, rank defeaters by severity, and show what survives. The core claim *does* survive, but as a narrower, more conditional principle centered on **irreversible harms under correlated risk and shared values**.

  ### Defeater Ranking & Analysis (Fatal → Noise)
  1.  **(c) Privileging Group Judgment**  
      **Severity: FATAL if unaddressed**  
      This is the deepest flaw. Your argument assumes the group's pooled judgment is inherently superior to any individual's. But if the group is systematically biased (e.g., groupthink, institutional blindness), or if information is asymmetrically distributed (the acting agent holds critical unshared data), the group's "better judgment" may be inferior.  
      **Survival Condition:** The position only holds if:  
      - Agents have *comparable* access to relevant information,  
      - Deliberation reliably aggregates truth (e.g., via diversity of perspectives),  
      - Values are aligned (see (e)).  
      Without this, you privilege a potentially *worse* decision-maker. This forces a major qualification: the presumption against unilateralism applies only when the group's epistemic competence exceeds that of a random member.

  2.  **(e) Heterogeneous Values**  
      **Severity: FATAL in many real cases**  
      If agents have fundamentally different values or risk tolerances, "acting against the group's better judgment" is undefined. A climate activist shutting down a pipeline may see it as morally imperative; shareholders see it as sabotage. Your error-rate calculation collapses without a shared benchmark.  
      **Survival Condition:** The argument works only for groups with *sufficiently aligned interests and values* (e.g., jurors, surgical teams, corporate boards with clear fiduciary duties). In polarized or value-heterogeneous groups, your position morphs into an argument for procedural legitimacy, not error reduction.

  3.  **(b) Correlation & Heterogeneity of Errors**  
      **Severity: FORCES QUALIFICATION**  
      Your scaling of risk to certainty relies on *independent* errors. But if errors are correlated (e.g., all agents share a cultural bias), increasing N does little to reduce aggregate risk. Conversely, if one agent has vastly superior skill/information (e.g., a seasoned firefighter in an emergency), unilateral action may lower expected harm.  
      **Survival Condition:** The argument holds *only* when:  
      - Individual assessments are statistically independent (or weakly correlated),  
      - Agent competence is *homogeneous*.  
      This restricts the position to decentralized groups without clear hierarchies of expertise or shared biases.

  4.  **(a) Asymmetry of Errors**  
      **Severity: FORCES QUALIFICATION**  
      Yes, the mirror-image risk (no one acts when they should) is equally real. But this isn't fatal—it reveals that your position implicitly assumes **asymmetry in the cost of errors**. If erroneous action causes irreversible harm (e.g., launching a nuke) while erroneous inaction allows reversible harm (e.g., delaying aid), the tradeoff is justified. If errors are symmetric, a conformity rule gains nothing.  
      **Survival Condition:** Your conclusion requires that **false positives (acting wrongly) are costlier than false negatives (not acting when needed)**. This is often true for irreversible/high-stakes actions (confirming your suspicion in (g)).

  5.  **(g) The Role of Irreversibility & Asymmetry**  
      **Severity: REVEALS CORE DRIVER**  
      You are correct: irreversibility and harm asymmetry are doing essential work. The "unilateralism" framing is secondary. When actions are reversible (e.g., trying a software patch) or harms symmetric, the probabilistic argument weakens dramatically. The "interesting version" *is* narrower: **a presumption against irreversible, high-stakes actions based solely on private judgment when group deliberation is feasible and reliable**. This *is* a refinement, not an abandonment.

  6.  **(d) The Lone Dissenter**  
      **Severity: NOISE**  
      Rare exceptions don't refute probabilistic claims. If unilateral action averts disaster in 1% of cases but causes disaster in 10%, the rule still reduces expected harm. Dismissing outliers is valid if your position is framed as optimizing *expected outcomes* (not guaranteeing perfection). The burden shifts to dissenters to prove their case meets an exception threshold (e.g., immediacy, unique knowledge).

  7.  **(f) Recursion Problem**  
      **Severity: NOISE**  
      Groups adopting conformity norms *do* become unitary actors at a higher level, but this doesn't recreate the same problem. Collective decision-making (even if flawed) typically incorporates more checks than individual action. The recursion point is theoretically valid but practically negligible—it fails to show why the norm isn't *locally* beneficial.

  ---

  ### Does the Core Claim Survive?
  **Yes, but transformed:** Your position survives as a **qualified principle for managing irreversible risks under shared values and decentralized epistemology**:  
  > *In groups with aligned interests and competent deliberation, agents should presume against taking unilateral, high-stakes, irreversible actions based on private judgment—unless they can demonstrate that their assessment incorporates superior information or that deliberation has failed catastrophically.*  

  **What you end up with:**  
  - **Thinner?** Yes, but more defensible. Irreversibility and asymmetry are now explicit load-bearing elements.  
  - **Still recognizably yours?** Yes. The probabilistic mechanism remains, but its domain is constrained by your defeaters.  
  - **Predicts something falsifiable?** Yes: It predicts that in qualifying groups, adopting a strong conformity norm will *reduce the rate of catastrophic errors caused by premature action* more than it *increases the rate of errors caused by unjustified inaction*. This is testable via simulations or historical case studies (e.g., military near-misses vs. intelligence failures).

  **Your Suspicions Confirmed:**  
  - **(g) is critical:** Irreversibility *is* the core driver. Unilateralism matters primarily because it bypasses group checks on irreversible harms.  
  - **Does this matter?** Yes. It means your position is not a general critique of individualism but a targeted tool for risk management. For reversible decisions (e.g., routine innovation), it may even be counterproductive.

  **Final Judgment:** The position is worth holding—but only in its refined form. It becomes a specialized instrument, not a universal principle. Its power lies in forcing agents to *justify why their private judgment should override collective wisdom* when the stakes are permanent and dire. That, by itself, is a vital contribution.
