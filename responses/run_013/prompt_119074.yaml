  Hmm, the user is on a citizens' panel about water safety and they're grappling with the Condorcet jury theorem. They understand the basic idea—that with enough independent voters each slightly better than random, majority vote is highly accurate—but they're seeing real-world issues in their panel. All 99 members are relying on the same summary document, and only three have actually reviewed the raw data. This violates the independence assumption, and the user wants to understand why that matters and how individual competence might change with group size.

  First, I need to break down the theorem clearly. The naive version should emphasize error cancellation: when voters are independent and each has a fixed probability above 50% of being correct, their mistakes are random and cancel out as the group grows. The majority vote then converges to the truth. This is intuitive without math—imagine many small, uncorrelated errors averaging out.

  For the independence section, I'll explain that independence means voters' errors aren't influenced by each other or by common sources. In their case, the shared document creates a single point of failure; if it's wrong, everyone is likely wrong. The three who read the raw data might count as independent, but the others are just echoes. So instead of 99 voters, they effectively have about three. Independence isn't just a technicality—it's crucial because correlated errors don't cancel. I'll also note that competence and independence aren't directly tradable; the theorem assumes both, and violating independence undermines it even if individual competence is high.

  Next, the moving target: the user suspects that in a large group, individuals might become less competent because they free-ride. The theorem assumes fixed competence, but if competence drops as the group grows—say, because people exert less effort—then adding more voters might not help or could even hurt. This is a real problem; the theorem's premise isn't met, so its conclusion doesn't apply. I should clarify that it's not about the math itself failing, but about the assumption being invalid in this scenario.

  For the bottom line, I'll advise that their panel should increase independence. Suggestions include having subgroups analyze different data, encouraging diverse research, or using the three informed members as a smaller panel. Also, they should maintain competence by incentivizing everyone to engage, perhaps through smaller discussion groups. The key takeaway is that without independence, the theorem's guarantee is void, so they need structural changes to make votes more independent and competent.

  I should keep the tone conversational, use analogies like the "single point of failure," and avoid jargon. The user has some stats background, so I can mention concepts like correlated errors but explain them simply. Emphasize that their intuition is correct—shared information breaks independence, and free-riding lowers competence, both of which sabotage the theorem's application. Finally, give actionable steps so they feel empowered to improve their panel's process.
answer: |-
  Here’s a breakdown of the Condorcet jury theorem in your panel’s context:

  ### The naive version
  The theorem imagines voters as independent "sensors" of the truth. Each voter has a fixed probability (>50%) of being correct *on their own*—like a slightly biased coin favoring truth. Crucially, their errors are random and *uncorrelated*: when one voter is wrong, it doesn’t make others more likely to be wrong. As you add more voters, the majority vote’s accuracy surges toward 100%. Why? Random errors cancel out. Imagine flipping 99 coins, each with a 60% chance of heads (truth). While individual coins land tails (error) 40% of the time, it’s astronomically unlikely that tails will win a majority—there’s no *coordinated* push toward error. The law of large numbers overwhelms the noise. The 98% figure comes from this: with 99 voters at 60% competence, the binomial distribution heavily favors 59+ correct votes.

  ### What independence is buying you
  **Independence means errors aren’t linked.** Voters must be wrong *for different, unrelated reasons*. Crucially, this requires independence **both from each other AND from common influences**. If voters share a single information source (like your one-page summary), their errors become perfectly correlated. If the summary contains a critical error, *all* voters relying on it will likely be wrong together—no error cancellation occurs. Your panel doesn’t have 99 independent voters; it has **effectively 3 independent voters** (those who checked raw data) plus **96 perfect clones** of the summary’s conclusion. The clones add *zero* new information; they just amplify the summary’s verdict. If the summary is correct, they all vote correctly. If it’s wrong, they all vote wrong. The group’s accuracy reduces to the accuracy of the *summary itself* (or the 3 diligent voters, if they override it—but the clones don’t help).

  **Trade-offs?** Independence and competence aren’t easily swapped. The theorem assumes fixed competence *given independence*. If independence is violated, boosting individual competence (e.g., making everyone 70% accurate *if voting alone*) doesn’t fix the correlation problem. A shared error source still dooms you. Conversely, if voters are independent but barely competent (say, 51% accurate), adding *many* still eventually delivers high group accuracy—but you need vastly more voters to overcome the weaker signal. Independence is the load-bearing wall: without it, competence gains are futile against correlated failure.

  ### The moving target
  Your intuition is spot-on—this *is* a real problem. The theorem assumes competence is fixed *regardless of group size*. But in reality, human behavior adapts. In a large group, rational individuals think: "My vote won’t matter, so why research deeply?" Competence plummets as people free-ride on others’ effort. This breaks the theorem’s core premise. If adding voters *reduces* average competence (e.g., from 80% in a small group to 60% in a large one), the "more voters → more accuracy" guarantee fails. Mathematically, the theorem relies on competence being *fixed* above 50% as *n* increases. If competence decays too quickly (e.g., dropping toward 50% as *n* grows), the majority’s accuracy might stall or even *decrease* with larger groups. In your case, the panel’s size likely suppressed individual effort, making the 60% figure an overestimate for a hypothetical small panel. The theorem isn’t *wrong*, but its assumption (fixed competence) doesn’t hold in this social context.

  ### The bottom line
  The theorem’s 98% promise is **void** for your panel. Shared information destroyed independence, reducing you to ~3 meaningful voters. Free-riding likely eroded individual competence further. **Takeaways:**  
  1.  **Independence is non-negotiable.** Correlated votes don’t cancel errors—they amplify them.  
  2.  **Your panel needs diverse information.** Break the single-point dependency: assign subgroups to analyze different data sections, consult independent experts, or require everyone to review distinct source materials.  
  3.  **Smaller might be better.** A subgroup of 5-10 committed voters (like the three who read the data, plus a few others incentivized to dig deeper) acting independently could outperform 99 clones.  
  4.  **Don’t trust the 60%.** That number assumes isolated, motivated voters—not your reality. Focus on enabling genuine independence first; *then* estimate competence.  

  The theorem is a powerful ideal, but your panel’s structure guarantees it doesn’t apply. Fix the independence problem, or the vote is just tallying the consulting firm’s document—not the truth.
