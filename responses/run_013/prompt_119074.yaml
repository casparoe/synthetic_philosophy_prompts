prompt: |-
  Okay, so I got voluntold onto a citizens' panel that's supposed to decide whether our town's water is safe, and at the first meeting somebody brought up the Condorcet jury theorem -- the one where if every voter is individually a bit better than a coin flip, and votes independently, then with enough voters the majority is basically certain to be right. There are 99 of us. Someone ran the numbers and said if each of us is right 60% of the time, the chance the majority lands on the truth is around 98%. Which sounds great untill you notice that all 99 of us were handed the same one-page summary written by the same consulting firm, and the only three people who've actually looked at the raw lab data are the ones everyone else is copying.

  I think I get that the theorem needs the votes to be independent, but I don't get what independence is actually *doing* there. Is it a technicality you can wave away when it's violated, or is it the whole load-bearing wall? And independent in what sense, exactly -- independent of each other, independent of the truth, what? Our votes aren't random; they're all downstream of the same document.

  The other thing that nags at me: that 60% number doesn't feel like a fixed property of us as individuals. If this panel were five people I'd absolutely read the lab reports myself. At 99, I figure my vote can't possibly matter, so I'll go with the summary like everyone else. So our competence seems like it's partly a *consequence* of the panel being large, and the theorem seems to want to hold competence fixed while you add voters. That feels like it should break something, and I can't tell whether it does.

  Explain it to me. I did some stats in college so I can handle a little math if it's earning its keep, but I want the concept, not a derivation. Don't worry about citing anyone -- I just want the idea.

  Lay it out like this:

  - "The naive version" (about 150 words): what the theorem actually claims, and the intuition for why it's true in the clean case. I want the error-canceling picture, not the binomial formula.
  - "What independence is buying you" (about 400 words): what has to be independent of what, why a shared information source wrecks things even when everyone is individually competent, and how I should think about our 99-person panel -- how many *independent* voters do we really have? If the answer is "about three," say so and explain why the other 96 aren't adding anything. I'd also like to know whether independence and competence are tradeable against each other, or whether the theorem is just silent on that.
  - "The moving target" (about 300 words): whether the theorem survives the fact that individual competence might shrink as the group grows. Be honest about whether this is a real problem or whether I'm just confusing myself, and if it's real, say precisely which step of the argument fails.
  - "The bottom line" (about 200 words): what I should actually take away from the theorem, and what our panel could realistically do to get closer to the situation the theorem describes.
