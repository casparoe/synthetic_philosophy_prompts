answer: |-
  ### Procedure for Determining Object Identity in Museum Cataloging

  This procedure is designed for catalogers to determine, based solely on available records, whether two entries describe one object or two distinct objects. It operates under the following principles:
  - **Asymmetry of Discernibility**: A discernible difference in records implies distinctness (safe inference). Indiscernibility (no difference) does not imply identity (unsafe inference).
  - **Discriminating Properties**: Differences in intrinsic properties (material, dimensions, marks), extrinsic properties (location, provenance, creation/acquisition dates), or relational properties (accession numbers, set membership) can establish distinctness. "Being this object" is not a valid property.
  - **Irreversible Decisions**: Merges affect loans, insurance, and provenance. When records are incomplete or contradictory, default to caution (no merge).
  - **Stopping Rules**: Each step ends the inquiry if criteria are met. If unresolved after Step 3, escalate to the registrar.

  **Time Limit**: 10 minutes per case. Use a timer.  
  **Threshold for Escalation**: Cases with contradictions, high-value items, or unresolved ambiguity after Step 3 go to the registrar.

  ---

  ### Step-by-Step Procedure

  #### **Step 1: Intrinsic Properties Check**  
  *Compare physical/material attributes.*  
  - **Question**: Do the records show any difference in intrinsic properties?  
    - *Properties*: Material, dimensions, weight, inscriptions, medium, marks, damage, or technical metadata (e.g., file checksums for digital objects).  
    - *Sufficient Answer*: Yes (a difference exists and is not a clear typo/unit error).  
  - **Stopping Rule**:  
    - If **YES** → **Objects are distinct**. Do not merge. Stop.  
    - If **NO** (no differences) → Proceed to Step 2.  
    - If **CONTRADICTION** (e.g., Record A says "bronze," Record B says "marble") → Escalate to registrar. Stop.  
    - *Cataloguer Note*: Resolve obvious errors (e.g., "10 cm" vs. "100 mm" = same). Differences in artist attributions or ambiguous descriptions are contradictions.

  #### **Step 2: Extrinsic and Relational Properties Check**  
  *Compare contextual and historical attributes.*  
  - **Question**: Do the records show any difference in extrinsic properties or relational context?  
    - *Properties*:  
      1. **Spatial Location**: Different locations recorded *at the same time* (e.g., "Gallery A on 01/01/2000" vs. "Storage B on 01/01/2000").  
      2. **Provenance/Causal History**: Different creation dates, acquisition dates, donors, or ownership chains.  
      3. **Relations**: Different accession numbers, set memberships, or exhibition histories.  
    - *Sufficient Answer*: Yes (a difference exists and is not a clear error).  
  - **Stopping Rule**:  
    - If **YES** → **Objects are distinct**. Do not merge. Stop.  
    - If **NO** (no differences) → Proceed to Step 3.  
    - If **CONTRADICTION** (e.g., Record A says "Donor X," Record B says "Donor Y") → Escalate to registrar. Stop.  
    - *Cataloguer Note*: Location is discriminating only if contemporaneous. Provenance gaps are not differences but require caution.

  #### **Step 3: Identity Evidence Check**  
  *Check for direct evidence of sameness.*  
  - **Question**: Is there explicit evidence that the records describe the same object?  
    - *Evidence*:  
      1. Same accession number in any system.  
      2. Cross-reference in records (e.g., "Same as ACC-456" or "Duplicate of Record X").  
      3. Unambiguous external documentation (e.g., curator note: "Scanned twice from same negative").  
    - *Sufficient Answer*: Yes (evidence is clear and uncontradicted).  
  - **Stopping Rule**:  
    - If **YES** → **Objects are identical**. Merge records. Stop.  
    - If **NO** (no evidence) → **Objects are distinct**. Do not merge. Stop.  
    - *Cataloguer Note*: Cross-references must be explicit. Do not infer sameness from similarity.

  ---

  ### Key Philosophical Position: The Line Between "Two Objects" and "Treat as Two"
  In cases of absolute indiscernibility (e.g., Max Black’s spheres), **the procedure concludes there are two objects if they have different accession numbers without cross-references**.  
  - **Why?** Accession numbers are institutional acts of individuation. Each number corresponds to a distinct acquisition event, which the museum uses to track objects physically, legally, and financially.  
  - **Defense**: Physical distinctness is established by the museum’s own practice of assigning unique numbers at acquisition. This avoids metaphysical speculation about "being this object." If the museum accessioned an object twice (error), it must be corrected by the registrar—**not by the cataloger**—based on non-record evidence (e.g., physical inspection).  
  - **Consequence**: We treat numerically distinct accessions as numerically distinct objects. The line falls here because it is based on the museum’s operational reality, not abstract identity.

  ---

  ### Test Cases

  #### **Case 1: Two Identical Casts (Max Black Spheres)**  
  - **Records**:  
    - Cast A: Accession #1920.001, Material: Iron, Dimensions: 30cm, Provenance: Unknown.  
    - Cast B: Accession #1920.002, Material: Iron, Dimensions: 30cm, Provenance: Unknown.  
  - **Procedure**:  
    1. **Step 1**: No intrinsic differences → Proceed.  
    2. **Step 2**: No extrinsic differences (location/provenance missing) → Proceed.  
    3. **Step 3**: No evidence of sameness; different accession numbers → **Distinct objects. Do not merge.**  
  - **Outcome**: Museum may dislike this (prefers "one object" for display), but accession numbers dictate distinctness. **Not adjusted**—merging would erase institutional history.

  #### **Case 2: Photograph and Later Print (Same Negative)**  
  - **Records**:  
    - Photo A: Accession #1950.001, Type: Vintage print, Date: 1920, Inscription: "Artist Proof".  
    - Print B: Accession #1950.001, Type: Later print, Date: 1950, Inscription: "Reprint 1950".  
  - **Procedure**:  
    1. **Step 1**: Intrinsic difference (dates and inscriptions conflict) → **Distinct objects. Do not merge.**  
  - **Outcome**: Museum dislikes this (wants one object for loans), but date/inscription differences are material. **Not adjusted**—conflating distinct temporal creations risks misattribution.

  #### **Case 3: Byte-Identical Digital Scans (Same Page)**  
  - **Records**:  
    - Scan A: Accession #2020.001, Vendor: V1, Checksum: ABC123, Metadata: "Scanned 01/01/2020".  
    - Scan B: Accession #2020.002, Vendor: V2, Checksum: ABC123, Metadata: "Scanned 01/02/2020".  
  - **Procedure**:  
    1. **Step 1**: No intrinsic differences (same checksum = same bytes) → Proceed.  
    2. **Step 2**: Extrinsic difference (different vendors/dates) → **Distinct objects. Do not merge.**  
  - **Outcome**: Museum may dislike this (prefers "one" intellectual work), but vendor/date differences imply separate digital events. **Not adjusted**—procedures must treat digital files as physical entities.

  ---

  ### Limitations and Caveats
  1. **Unreachable Facts**: The procedure cannot resolve cases where:  
     - Objects are physically distinct but records are identical (e.g., two casts with lost provenance).  
     - Human error (e.g., one object accessioned twice) without cross-references.  
     *Solution*: Escalate to registrar for non-record investigation (e.g., physical inspection).  

  2. **Judgment as Rule**:  
     - Step 3’s reliance on accession numbers codifies institutional practice as a "rule." This is judgment (the museum’s individuation act) presented as objective.  
     - Location in Step 2 assumes the museum records locations accurately—errors may cause false distinctions.  

  3. **Incompleteness**: Records with gaps (e.g., missing provenance) default to distinctness if accession numbers differ. This prioritizes institutional accountability over speculative unity.  

  **Final Recommendation**: For high-stakes cases (e.g., insurance value > $10,000), always escalate to the registrar. The procedure minimizes risk but cannot eliminate ambiguity—it is a tool, not an oracle.  

  ---  
  This procedure prioritizes operational safety, institutional practice, and record-based evidence. It rejects the Identity of Indiscernibles as a guide but leverages its converse to protect against irreversible errors.
