  ## The Weight of the Expected: Convention Beyond Coordination

  David Lewis’s elegant account of convention provides a powerful tool for understanding how patterned behavior emerges from individual rationality. A convention, for Lewis, is a regularity where everyone conforms because they expect others to conform, know others expect conformity, and prefer to conform *conditional* on others doing so. The "ought" inherent in this picture is starkly instrumental: conform because it’s the best strategy to satisfy your preferences, given the predictable behavior of others. This works beautifully for paradigmatic coordination problems like driving on the right or left – the rule is arbitrary, but conformity is essential to avoid disaster.

  Yet, the lived experience of convention often feels profoundly different. When someone queue-jumps, reneges on a tacit promise of reciprocity, or violates a linguistic norm, the reaction is rarely a calm explanation of diminished utility. Instead, we feel resentment, indignation, and moral criticism. We don't say, "You shouldn't have done that *because it statistically lowers your future payoffs*," but rather, "That wasn't *fair*," "You broke the *rule*," or "You *owe* me." This gap between Lewis's instrumental "ought" and the normative force we experience demands scrutiny. Can the sting of violated convention be reduced to disappointed expectations and frustrated preferences, or does it point to something irreducible?

  **The Challenge of Arbitrariness:** Lewis leverages arbitrariness – the fact that either driving side would suffice – to argue *against* intrinsic normativity. If the rule lacks inherent moral content, its authority must stem solely from its coordination function. Why resent the driver who chooses the left in a right-driving country? Only because their choice endangers others and disrupts traffic flow – purely instrumental concerns. This is persuasive for pure coordination conventions. However, many conventions aren't purely arbitrary in their *effects* once established. The *choice itself*, even if arbitrary initially, creates a framework of mutual reliance and expectations that transcends mere coordination efficiency. While *which* side we drive on is arbitrary, the fact *that* we have collectively settled on one creates a legitimate expectation whose violation feels like a betrayal of a shared, albeit tacit, agreement. The resentment stems not just from the *physical* danger, but from the disregard for the collective understanding that enables social navigation. Arbitrariness weakens claims of intrinsic moral rightness but does not eliminate the normative weight arising from the *fact* of established mutual reliance.

  **Beyond Coordination: The Debt of Prior Conformity:** Lewis's model treats prior conformity primarily as a source of *predictive* expectations, fueling the instrumental calculation: "Others have conformed, so they likely will again, so conforming benefits me." But the normative criticism following a breach often invokes something more: a sense of *reciprocity* or *fairness*. Consider a simple convention of taking turns speaking in a discussion. Prior conformity isn't just a signal of future behavior; it represents others *restraining* themselves for your benefit. When you interrupt, the criticism ("You didn't let me finish!") isn't merely a prediction that future coordination will fail ("If you interrupt, others might too, making conversation harder"). It's an accusation of *unfairness*: "I respected your turn, *so you owed me* the same respect." This "debt" arises from the benefits already received through others' prior conformity. The reason to conform, in this view, isn't just to *continue* coordination, but to *reciprocate* for the coordination benefits already *bestowed* upon you. This reason – grounded in fairness and reciprocity – seems distinct from the purely forward-looking, preference-satisfaction reason Lewis emphasizes.

  **Sanctions and the Essence of Convention:** If conformity arises *only* because breaches are punished (fines, ostracism), is this still a Lewisian convention? Lewis's core definition relies on conditional preferences and mutual expectations, not sanctions. Sanction-based regularities look more like enforced rules or threats, where conformity is motivated by fear of penalty, not by the intrinsic logic of coordination. However, the relationship is more complex. In mature conventions, sanctions are often *expressions* of the underlying normative expectation and resentment. The resentment felt when a convention is breached *motivates* the community to impose sanctions. The sanction isn't the *source* of the "ought," but a *consequence* and reinforcement of it. A purely sanction-driven regularity lacks the element of *mutual recognition* and conditional preference central to Lewis; it's coercion, not convention. Yet, the *presence* of sanctions in many conventions doesn't disprove their conventional nature; it often demonstrates the *strength* of the community's shared normative commitment that has evolved *beyond* pure coordination utility. The sanction reinforces the sense that something *owed* has been withheld.

  **Verdict: The Irreducible Normative Core**

  While Lewis provides an indispensable foundation for understanding the *emergence* and *stability* of conventions through instrumental rationality, his account cannot fully capture the *normative phenomenology* of established conventions. The instrumental "ought" is necessary but insufficient. The resentment, the appeal to fairness, and the sense of reciprocal obligation point to an emergent normative dimension that cannot be reduced without residue to individual preference satisfaction.

  Conventions, particularly those embedded in ongoing social practices, create webs of mutual reliance and reciprocal benefit. Prior conformity creates a *debt* of fairness; the collective investment in the regularity generates a legitimate expectation of adherence that feels binding beyond its current utility. The arbitrariness of the origin does not negate the normative reality forged through reliance. Sanctions, when they exist, often act as external manifestations of this internalized normative commitment, not its sole source.

  Therefore, the normative "ought" of convention is not reducible to the instrumental "ought." The instrumental calculus explains *why* a convention *persists* and *why* an individual *might* strategically comply. But the distinctive experience of being *bound* by the convention, the feeling that a breach is not merely unwise but *wrong* because it violates a shared understanding and exploits the cooperative restraint of others, requires recognizing an emergent normative force. This force arises from the reciprocal relations and mutual recognition inherent in sustained social coordination. We conform not only because it works, but because, having benefited from the conformity of others, we feel we *ought* to reciprocate. The convention, once established, carries a normative weight of its own.
