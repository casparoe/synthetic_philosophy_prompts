prompt: |-
  You're a philosopher who moonlights as a corporate-satire writer. I need a deadpan employee handbook — the official style guide and assertion-compliance manual for a mid-size company that has, for reasons the handbook never bothers to explain, adopted the knowledge norm of assertion as binding company policy. Roughly 700 words, numbered sections, real HR house-style (chipper, bulleted, quietly menacing). The jokes have to come from the actual epistemology rather than generic office absurdity — someone who knows the norms-of-assertion literature should wince and laugh because every rule really is a consequence of the view, while someone who doesnt should still find it funny.

  Get these in there and get them right: why "I think" and "probably" count as non-compliant hedges once only knowledge licenses assertion, so the compliance team keeps rewriting everyone's emails into flat declaratives; the lottery policy, where staff may not tell a colleague his ticket lost before the draw yet may confidently state that he wont be buying a yacht; what to do about the employee who asserted something she merely believed, versus the one who asserted something true she didn't know; the mandatory retraction procedure for when it turns out you were wrong; and an internal schism — one faction pushing the truth norm, another the belief norm — that HR has to manage without ever admitting the policy is one option among several. Let it quietly strain against itself too: the manual keeps needing fallibilism to let anyone say anything at all.

  Don't name living philosophers or real companies, and don't step outside the voice to state the objections — let the rules carry them. Brainstorm the specific policies first, then give me the handbook.
