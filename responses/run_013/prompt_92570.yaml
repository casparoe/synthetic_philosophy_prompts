      "if_worse": "what a verdict one way would tell me",
      "if_better": "and the other way"
    }
  }

  If my cases are rigged so no consistent principle can fit them, say that in bottom_line and tell me which verdict to throw out first. And skip the names and citations, I'm not going to check them.
