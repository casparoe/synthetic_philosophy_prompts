  (b) Scale rung 5 up — not 81 people with a tight shoe but a billion people with a tight shoe, against just the one person in agony — and I flip. The billion is worse. I'm confident about that. But I have no idea where the switch happens, and if you ask me about ten thousand vs a hundred thousand I'm back to shrugging.

  (c) 81 people with a mild headache (rung 4's severity at rung 5's headcount) vs the 1 agony: I take the headaches. 81 people is nothing. So maybe agony isn't a different kind of bad after all and I just have a number somewhere in there.

  (d) Same ladder but good: 1 person in bliss all day vs 81 people mildly content. I say the bliss one is better, and I shrug on the adjacent rungs there too, so I guess I've got the same problem. But I feel worse about giving up transitivity for good things than for bad ones. Not sure if that's a real distinction or just squeemishness.

