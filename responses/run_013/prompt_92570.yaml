  Rung 3: 9 people with a bad migraine all day — dark room, can't work, can't really think, but nothing like rung 2.
  Rung 4: 27 people with a mild headache all day — annoying, they can work, they're grumpy.
  Rung 5: 81 people with a barely noticeable discomfort all day — like a slightly tight shoe.

  My verdicts, rung by rung:

  1 vs 2: I shrug. If you made me pick I'd maybe take 2, but I don't feel it.
  2 vs 3: shrug again. Slightly prefer 3? Honestly a coin flip.
  3 vs 4: shrug. 4, weakly, probably.
  4 vs 5: shrug, and here I truly have no preference. 81 tight shoes vs 27 headaches — I'd flip a coin.
