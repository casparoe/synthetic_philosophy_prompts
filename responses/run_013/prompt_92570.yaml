  {
    "bottom_line": "one or two sentences: is my betterness relation transitive, and what do I have to give up",
    "principles": [
      {
        "name": "short label",
        "statement": "the principle, stated precisely enough that I could code it as a comparator",
        "keeps": ["which of my rung verdicts and which of (a)-(d) it gets right"],
        "breaks": ["the verdict(s) it forces me to abandon, or 'none'"],
        "cost": "what I'd have to swallow to hold it — sharp cutoff, incomparable pairs, vagueness, context-dependence, etc.",
        "new_case_prediction": "what it says about some case I didn't mention"
