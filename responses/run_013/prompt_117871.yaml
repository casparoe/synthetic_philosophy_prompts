prompt: |-
  I am trying to find a name for something I keep noticing about how we judge wrong answers, and I would rather have the concept than the label.

  Two forecasters both get about 70% of days right. One is wrong in the same direction every time, the other at random. I would call the first closer to being right, and not out of charity: his errors are the kind a better model would remove. The same thing happens with theories. When a false theory's mistakes are exactly the mistakes its successor corrects, nobody hesitates to call it nearer the truth; when two false theories are equally accurate and their errors are scattered, each getting right what the other gets wrong, people grow uncomfortable saying either is nearer the truth, even when the scorecard favours one.

  What I seem to be tracking, then, is not how accurate a theory is or how many truths it captures, but whether its errors are repairable — whether they point somewhere. I suspect there is a term for the general question of one false theory being nearer the truth than another, but that is not what I am after. Does the extra ingredient have a name of its own? If it does, say what it commits you to and how it comes apart from accuracy; if it does not, coin one and tell me what it excludes. And tell me whether I am smuggling something in, since being on the right track appears to relate a theory to theories that do not yet exist.
reasoning: |-
  Okay, the user is grappling with a concept about how we judge wrong answers, especially in forecasting or theories. They notice that when two forecasters both have 70% accuracy, the one whose errors are consistent (always in the same direction) feels "closer to the truth" than the one with random errors. Similarly, in theories, a false theory whose mistakes are corrected by its successor is seen as nearer to truth, while two equally accurate theories with scattered errors make people hesitant to say either is closer.

  The user is trying to name this concept—not just proximity to truth, but the idea that some errors are "repairable" and point toward improvement. They suspect there's a term for it but want to focus on the "extra ingredient" beyond accuracy. They also question if they're smuggling in something, since being "on the right track" might relate to future, non-existent theories.

  First, I need to unpack their examples. The forecaster with consistent errors (say, always overestimating) has a systemic bias. That’s fixable—like adjusting a scale. Random errors suggest noise, which is harder to correct without more data or a better model. For theories, if a theory’s flaws directly lead to the next theory (like Newtonian physics vs. relativity), it’s seen as a stepping stone. If two theories are equally wrong but in opposite ways, it’s like they’re stumbling in different directions without progress.

  The core idea seems to be about error structure: systemic vs. random, and whether errors point to a path for refinement. The user’s term "repairable" is key—it implies the potential for improvement. But they want a name for this property itself.

  Existing concepts that come to mind:
  - **Systematic vs. random error**: This is a dichotomy, but the user wants a specific property—the "repairable" nature of systematic errors.
  - **Verisimilitude (truthlikeness)**: Philosophers like Popper use this to say one false theory can be closer to truth than another. But it’s broad and debated. The user wants the "extra ingredient" within this, like error corrigibility.
  - **Bias vs. variance**: In stats, bias is consistent deviation; variance is scatter. Reducing bias often improves models more than reducing variance. But this is technical, not conceptual.
  - **Heuristic value** or **fertility**: A theory’s ability to guide future research. Lakatos’ "research programmes" frame theories as progressive if they lead to new discoveries. This fits—the errors aren’t dead ends but clues.

  The user’s worry about "smuggling in" future theories is valid. Saying a theory is "on the right track" implies a trajectory toward an unknown better theory. It’s teleological. But in science, we judge this retrospectively—e.g., Newton was "closer" because Einstein built on him. Prospectively, it’s speculative. Still, the property exists: some theories have errors that are *diagnosable* and *actionable*.

  Proposed terms:
  1. **Corrigibility**: Emphasizes fixability. Commit: Errors must be identifiable and correctable. Excludes random/scattered errors.
  2. **Directionality**: Highlights that errors point a way forward. Commit: Implies a vector of improvement. Excludes errors with no pattern.
  3. **Path-dependence**: Stresses that the theory enables progress. But might confuse with other concepts.
  4. **Heuristic fertility**: Borrows from Lakatos. Commit: The theory must generate productive anomalies. Excludes stagnant theories.

  Among these, **Corrigibility** feels most precise. It directly addresses "repairable errors" and separates from accuracy (e.g., a highly accurate model with random noise may be less corrigible than a biased one). The user’s smuggling concern is real—corrigibility is relational, depending on future theories or interventions. But it’s not cheating; it’s about the error structure’s inherent potential.

  Refinement: **Diagnostic Corrigibility**. This underscores that errors are not just fixable but *reveal* how to fix them. E.g., consistent overestimation diagnoses a calibration flaw. Random errors offer no such insight.

  In sum:
  - **Core concept**: The property of having errors that are systematic, revealing, and thus repairable.
  - **Best term**: **Corrigibility** (or **Diagnostic Corrigibility**).
  - **Vs. accuracy**: Accuracy measures correctness; corrigibility measures error utility for improvement.
  - **Addressing concern**: Yes, it’s forward-looking, but grounded in present error patterns. Not smuggling—just recognizing that some mistakes illuminate the path.
answer: |-
  Your intuition is sharp, and you're grappling with a profound epistemological concept—one that sits at the intersection of philosophy of science, statistics, and decision theory. What you're describing isn't just about accuracy or "truthlikeness" (verisimilitude); it's about the **structure and utility of errors** as indicators for progress. I'll break this down step by step, addressing your core question: **the extra ingredient that makes some false theories or models "closer to truth" due to their repairable errors**.

  ### The Concept: Diagnostic Utility of Errors
  You've identified that the key differentiator is whether a theory or model's mistakes:
  - **Point toward a specific improvement** (e.g., consistent directional errors in forecasting, or a false theory whose flaws are directly addressed by its successor).
  - **Are "scattered" or random**, offering no coherent path for refinement.

  This isn't about raw accuracy but about the **inferential potential** of errors—whether they reveal a "direction" for correction. A theory with systematic, patterned errors is like a misaligned compass: it's wrong, but its error *diagnoses the flaw* (e.g., "always overestimates by 10%"). Random errors, however, are noise—they don't guide you toward truth. Your term "repairable" captures this perfectly: **repairability** implies the errors are *actionable*.

  ### Does This Have a Name?
  There's no universally accepted term for *exactly* this concept, but related ideas exist. I'll synthesize them and then propose a focused label:

  1. **Systematic Error vs. Random Error** (Statistics):  
     - **Systematic error (bias)** is consistent and directional (e.g., always over-predicting). It's "repairable" because correcting it (e.g., recalibrating) improves the model.  
     - **Random error (variance)** is unsystematic scatter; reducing it requires fundamentally new information.  
     - *Limitation*: This is descriptive, not evaluative. It doesn't capture the philosophical "nearness to truth" you're after.

  2. **Verisimilitude** (Philosophy of Science):  
     - Popper's term for "truthlikeness"—how close a false theory is to truth. Later refinements (e.g., by Ilkka Niiniluoto) incorporate *similarity* to true statements.  
     - *Limitation*: Verisimilitude often focuses on truth *content* (e.g., how many true consequences a theory has) rather than the *structure of errors*. Your "repairable errors" add a dynamic, progress-oriented layer.

  3. **Heuristic Fertility** (Lakatos/Laudan):  
     - Imre Lakatos' "research programmes" and Larry Laudan's "problem-solving effectiveness" emphasize how a theory *generates progress*. A "fertile" false theory produces anomalies that guide successors.  
     - *This is closest to your idea*: Errors aren't dead ends but clues. For example, Newtonian physics was "fertile" because its errors (e.g., Mercury's orbit) pinpointed where relativity was needed.  
     - *Limitation*: Fertility is broader, including a theory's ability to spawn new discoveries, not just its error structure.

  ### Proposed Term: **Diagnostic Corrigibility**
  To isolate your "extra ingredient," I suggest **diagnostic corrigibility**.  
  - **Why this term?**  
    - **Diagnostic**: The errors *diagnose* a specific flaw (e.g., "bias toward overestimation" or "ignores factor X").  
    - **Corrigibility**: The errors are *correctable* within a framework (e.g., via parameter adjustment or theory refinement), making the model/theory improvable.  
    - Together, they emphasize that the value lies in errors being *informative for future progress*.  

  - **What it commits you to**:  
    1. Errors must be *structured* (non-random) to be "diagnostic."  
    2. The model/theory must have a *mechanism for correction* (e.g., a forecaster can adjust for bias; a theory can be superseded).  
    3. It implies a *teleology*: the model is "on the right track" toward an improved version.  

  - **How it differs from accuracy**:  
    - **Accuracy**: Measures correctness (e.g., 70% right). A model can be accurate but non-corrigible (e.g., right for random reasons).  
    - **Diagnostic Corrigibility**: Measures the *utility of errors* for progress. A less accurate model can be more corrigible (e.g., 60% accurate with systematic errors vs. 70% with random errors).  

  ### Addressing Your Concern: Are You "Smuggling In" Future Theories?
  Yes, but necessarily so—and this is insightful, not smuggled.  
  - **Why it's valid**: Diagnostic corrigibility is inherently *relational* and *prospective*. It evaluates a theory/model in the context of:  
    - **Possible refinements**: The errors must point to *conceivable* corrections (e.g., "if we adjust for this bias, we improve").  
    - **Historical trajectory**: Like Newton → Einstein, corrigibility is often judged retroactively (errors "pointed" to a real successor).  
  - **Why it's not cheating**:  
    - The "future" is latent in the error structure itself. A systematic error *implies* a direction for correction (e.g., consistent overestimation suggests recalibration). Random errors imply no such path.  
    - It avoids requiring a *specific* future theory—only that the errors are *in principle* repairable. Your forecaster example shows this: no "future model" is needed to see that directional errors are fixable.  

  ### What This Concept Excludes
  Diagnostic corrigibility rules out:  
  - Models/theories with **unsystematic errors** (no pattern, no "direction" for repair).  
  - **Accurate but brittle models**: E.g., a theory that's 90% right due to luck, with errors that reveal nothing (e.g., "scattered" mistakes).  
  - **Unfalsifiable theories**: If you can't identify errors, you can't diagnose flaws.  

  ### In Practice: Applying Diagnostic Corrigibility
  - **Forecasters**: The one with directional errors has high corrigibility. You'd invest in refining their model.  
  - **Theories**: Darwin's evolution had corrigible errors (e.g., gaps in inheritance mechanisms); phlogiston theory did not (errors were incoherent, leading to a dead end).  
  - **AI/ML**: In model evaluation, corrigibility explains why we prioritize reducing *bias* over variance—bias is diagnosable.  

  ### Final Thoughts
  You're articulating a crucial insight: **Truth isn't just about being right—it's about being wrong in the right way.** "Diagnostic corrigibility" names the property that makes errors productive. It's why we forgive Aristotle's physics but not Ptolemy's epicycles, or why a biased forecaster feels "closer" than a lucky one. If you embrace this term, you commit to a progress-oriented view of knowledge—one where errors aren't failures but guideposts.  

  If you'd like to refine this further (e.g., for a specific field), or explore edge cases (e.g., theories with mixed error types), I'm happy to iterate.
