  First, I need to unpack Edwards' terminology. When he says "free acts," he's referring to the libertarian view where an act is free only if it's *uncaused by prior states* but *caused by the agent*. Edwards is attacking this by showing it leads to absurdity. 

  The key move is his claim that if the will determines its own acts, then each free act must be chosen by a prior act of will. But then that prior act must *also* be free (and thus self-determined), leading to either:
  - An infinite regress of choices (problematic but not logically contradictory), or 
  - A "first" free act that has no prior choice (contradicting self-determination), or 
  - A first act that *isn't* free (making all subsequent acts unfree).

  Ah, that's where the contradiction sneaks in! Edwards insists that if the foundational act isn't free, *nothing downstream can be free*. That's the linchpin. The user is rightly suspicious of this step—Edwards calls it "manifest," but it's actually a substantive premise about responsibility transmission. 

  The user's fourth question is especially sharp. Comparing Edwards to Strawson: both use regress arguments, but Edwards relies on 18th-century faculty psychology (will as a distinct power needing "acts"), while Strawson's Basic Argument is more abstract—it just requires that responsibility for X depends on responsibility for whatever caused X. Strawson's version is leaner and harder to escape. 

