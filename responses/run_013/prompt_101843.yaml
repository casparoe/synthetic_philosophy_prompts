prompt: |-
  You are a philosopher with expertise in early modern debates about free will and in contemporary work on moral responsibility. I need help understanding a difficult passage.

  I have been reading about Galen Strawson's Basic Argument, and someone told me that Jonathan Edwards made a structurally similar move long before. I found the passage below in Edwards's Freedom of the Will, in the section where he attacks the notion that the will has a self-determining power. I can follow the words but not the force of the argument, and I suspect the difficulty is that a lot is being carried by steps he thinks are obvious.

  The passage:

  Therefore, if the Will determines all its own free acts the soul determines them in the exercise of a Power of willing and choosing; or, which is the same thing, it determines them of choice; it determines its own acts, by choosing its own acts. If the Will determines the Will then choice orders and determines the choice; and acts of choice are subject to the decision, and follow the conduct of other acts of choice. And therefore if the Will determines all its own free acts, then every free act of choice is determined by a preceding act of choice, choosing that act. And if that preceding act of the will be also a free act, then by these principles, in this act too, the will is self-determined: that is, this, in like manner, is an act that the soul voluntarily chooses; or, which is the same thing, it is an act determined still by a preceding act of the will, choosing that. Which brings us directly to a contradiction: for it supposes an act of the Will preceding the first act in the whole train, directing and determining the rest; or a free act of the Will, before the first free act of the Will. Or else we must come at last to an act of the will, determining the consequent acts, wherein the Will is not self-determined, and so is not a free act, in this notion of freedom: but if the first act in the train, determining and fixing the rest, be not free, none of them all can be free; as is manifest at first view, but shall be demonstrated presently.

  What I want is not a summary of Edwards's overall position but a careful walk through this specific argument. Please begin by setting out, in your own words, the steps as he seems to intend them, and the sense of "free" that is operating at each step. Then address four things: (1) what exactly the contradiction is supposed to be, and whether what he has actually produced is a contradiction or only an infinite regress; (2) why he holds that if the first act in the train is not free, then none of the later acts can be free, since this step appears to do most of the work and he dismisses it as manifest at first view; (3) what is contributed by his remark, just before this passage, that actions are properly ascribed to agents rather than to the powers of agents, and whether the argument depends on that move or would survive without it; and (4) how close the argument really is to the regress in Strawson's Basic Argument, and where the two come apart, in particular whether Edwards needs assumptions about the will as a faculty, or about choice as a distinct act, that Strawson does not need.

  Think through the steps carefully before you answer, and mark clearly any point at which you are reconstructing an argument rather than reporting what Edwards says.
