answer: |-
  Below is a careful reconstruction of Edwards's argument in the quoted passage, followed by analysis of your four specific queries. I'll first articulate the logical steps and assumptions, then address your questions systematically. Key terms are clarified as they appear.

  **Edwards's Argument Reconstructed (Steps & Key Assumptions):**

  1.  **Premise (Libertarian Definition of Freedom):** A free act of will (choice) must be *self-determined* by the will. That is, the will itself (or the soul via the will) must be the ultimate source determining that specific act, not prior causes external to the will (e.g., desires, external events, divine action).
  2.  **Premise (Self-Determination Requires an Act):** For the will to "determine" its own act, this determination *must itself be an act of will* (a choice). Edwards states this explicitly: "if the Will determines the Will then choice orders and determines the choice". There is no other mode of "determination" available to the will within this framework. Determination *is* choosing.
  3.  **Implication (Regress Initiated):** Therefore, any free act of choice (Choice 1) must be determined by a *prior* act of choice (Choice 0) that chooses it.
  4.  **Premise (Freedom Requires Self-Determination at Each Step):** For Choice 0 to be a *free* act determining Choice 1, Choice 0 must *itself* be self-determined (free) according to the same libertarian definition.
  5.  **Iteration of the Regress:** Therefore, Choice 0 must be determined by a prior free choice (Choice -1), which must be determined by a prior free choice (Choice -2), and so on.
  6.  **The Dilemma:** This sequence leads to one of three untenable options:
      *   **Option A (Infinite Regress):** An infinite series of prior choices determining choices, ad infinitum. Edwards does not explicitly dismiss this as impossible here, but it's implied to be vicious because no act has an ultimate, *non-arbitrary* self-determining source (the determination is always pushed back).
      *   **Option B (Contradiction - First Free Act):** A supposed "first" free act in the chain (Choice F) that determines subsequent choices but is *itself not determined by any prior choice*. This directly contradicts the libertarian definition of freedom (Premise 1 & 2), which requires *every* free act to be self-determined *by a choice*. An undetermined choice is not self-determined in this required sense.
      *   **Option C (Foundation Failure - First Unfree Act):** A supposed "first" determining act (Choice U) that is *not free* (i.e., not self-determined by a prior choice, perhaps caused by something external or random).
  7.  **Premise (Responsibility Transmission Failure):** If the foundational determining act (Choice U) is *not free*, then *no subsequent act determined by it can be truly free or imputable to the agent*. Edwards asserts this is "manifest at first view": the freedom/responsibility of the entire chain depends on the freedom of its source. An unfree cause cannot produce a free effect *in this context of ultimate self-determination*.
  8.  **Conclusion:** Therefore, the libertarian conception of freedom as self-determination by the will leads either to an infinite regress, a logical contradiction (a free act that isn't self-determined), or a foundational act that is unfree (rendering all subsequent acts unfree). All options are absurd. Hence, the notion of the will having a "self-determining power" is incoherent.

  **Sense of "Free" Throughout:** Edwards consistently uses "free" in the *libertarian* sense targeted by his argument: an act is free *only if* it is ultimately determined (caused) by the agent's will itself in a way that is not causally necessitated by prior states (internal or external). This requires *self-determination* via an act of will.

  **Addressing Your Queries:**

  1.  **The Contradiction vs. Infinite Regress:**
      *   Edwards *presents* the infinite regress (Option A) as problematic but doesn't explicitly call it a *contradiction* in this passage. He focuses on its failure to provide a genuine source.
      *   The explicit **contradiction** arises in **Option B**: The libertarian must posit a "first free act" (Choice F) to stop the regress. But for Choice F to be *free*, it must be *self-determined by a prior choice* (Premises 1 & 2). However, by definition as the *first* act, there *is* no prior choice to determine it. Therefore, Choice F is simultaneously claimed to be *free* (requiring self-determination by choice) and *not self-determined by choice* (because it's first). This is a direct logical contradiction: "a free act of the Will, before the first free act of the Will". Edwards *produces* the contradiction by forcing the libertarian into Option B as the only alternative to the regress or an unfree foundation. He doesn't merely present a regress; he shows the regress forces the libertarian into contradictory claims when trying to stop it.

  2.  **"If the first act... is not free, then none... can be free":**
      *   **Why Edwards Thinks It's "Manifest":** Edwards assumes a strong principle of **causal responsibility transmission**: The freedom and moral responsibility of an effect (a later choice) fundamentally *depends on* the freedom and responsibility of its *sufficient cause* (the prior choice that determined it). If the cause (Choice U) is not free – if it's not truly determined *by the agent* in the required libertarian sense (e.g., if it's caused by external factors, random, or brute) – then the agent cannot be the *ultimate source* of the effects (later choices) flowing from it. The later choices are merely the inevitable or random consequences of an event for which the agent bears no ultimate responsibility. The chain is "infected" at its source. Edwards likely sees this as axiomatic within causal models of action: responsibility for an outcome requires responsibility for the causes leading to it.
      *   **Why It Does the Heavy Lifting:** This premise is crucial because it eliminates **Option C** (unfree foundation) as a viable escape from the regress. Without this premise, a libertarian *could* argue: "Sure, the *very first* act of will in a chain (or in an agent's history) isn't self-determined by a prior choice – maybe it's a spontaneous, uncaused cause. But *that* act is free (by being spontaneous/uncaused), and it then determines later free acts." Edwards's transmission principle blocks this move: if the first act isn't self-determined (and thus, on his view, not truly free), then *nothing* it causes can be free/responsible either. This forces the libertarian back onto the horns of the regress or contradiction.

  3.  **The Role of "Actions ascribed to Agents, not Powers":**
      *   Edwards makes this point just before the quoted passage: Actions belong to the *person* (the agent), not to a faculty like "the will" conceived as a separate entity. We don't say "the power of choosing chose"; we say "the *person* chose."
      *   **Contribution:** This move combats a potential objector's strategy. A libertarian might try to avoid the regress by saying: "The *will itself* (as a faculty) determines choices, but this determination isn't *itself* an act of choice; it's just the faculty operating." Edwards argues this is incoherent. If the *agent* is the one acting (using the will), then the "determination" must be an *action* of the agent, i.e., an act of will/choice. You can't ascribe the act to the agent while divorcing the *determination* of that act from the agent's action. The faculty doesn't act; the agent acts *using* the faculty. Therefore, the determination *must* be an act of the agent (a choice).
      *   **Dependence:** **Yes, the argument crucially depends on this move.** It justifies **Premise 2**: that self-determination *by the will* must mean determination *by a choice*. Without this move, the libertarian could plausibly claim that the *faculty* of will determines choices in a way that isn't itself a choice (e.g., a non-actualized causal power inherent in the will/soul). Edwards's point forces the libertarian into the position that determination *is* an act, initiating the regress. The argument would likely *not* survive without this premise, as it provides the key link between the agent's responsibility, the nature of action, and the necessity of the regress.

  4.  **Similarity to Strawson's Basic Argument:**
      *   **Structural Similarity:** The core *regress structure* is remarkably similar to Strawson's Basic Argument. Both argue that for an agent to be *truly responsible* (Strawson) or for an act to be *truly free* in the libertarian sense (Edwards), the agent must be responsible/free with respect to the *cause* or *source* of that act/state. This leads to an infinite regress: Responsibility for X requires responsibility for the cause of X (Y), which requires responsibility for the cause of Y (Z), ad infinitum. Both conclude that ultimate responsibility (Strawson) or libertarian free will (Edwards) is impossible.
      *   **Key Differences:**
          *   **Target & Scope:** Edwards targets a specific 18th-century libertarian conception of the *will's self-determining power*. Strawson targets the very possibility of *ultimate moral responsibility* per se, regardless of the specific mechanism (will, character, etc.).
          *   **Faculty Psychology:** **Edwards critically relies on assumptions about the will as a faculty and choice as a distinct act.** His argument hinges on the nature of "determination" *by the will* necessarily being an *act of choice* (Premise 2), justified by the "agent vs. power" distinction. Strawson's argument is more abstract. It applies to *any* state (S1) for which responsibility is claimed: To be responsible for S1, you must be responsible for a prior state S2 (which caused S1 or from which S1 arose), and so on. Strawson doesn't need "acts of will" or faculty psychology; his regress applies to character traits, decisions, desires, or the agent's "nature" itself.
          *   **The "First Move":** Edwards starts from the libertarian's claim about *how* freedom works (self-determination by will). Strawson starts more fundamentally from the *conditions* for true responsibility (you must be responsible for how you came to be the way you are that led to the action).
          *   **The Conclusion's Target:** Edwards concludes the *libertarian conception* is incoherent (paving the way for his compatibilism). Strawson concludes that *ultimate moral responsibility* is impossible (a more radical skepticism).
      *   **Where They Come Apart:** The core similarity is the regress structure demanding responsibility/freedom for the causes/sources. However, **Edwards's argument is more historically contingent** because it depends on a specific (though widespread in his time) conception of the will and its acts. **Strawson's argument is more fundamental and harder to escape** because it abstracts away from psychological mechanisms and targets responsibility directly. Edwards needs the "will as faculty" and "determination as act" assumptions; Strawson only needs the premise that responsibility for X requires responsibility for the sufficient basis/cause of X.

  **In Summary:** Edwards constructs a powerful dilemma against libertarian self-determination: it leads to infinite regress, contradiction (a free act defined as self-determined that cannot be self-determined), or an unfree foundation that destroys freedom/responsibility downstream. The linchpin is his causal responsibility transmission principle ("if first unfree, all unfree") and his grounding of self-determination in acts of choice via the "agent vs. power" distinction. While structurally similar to Strawson's regress concerning the demand for responsibility/freedom regarding origins, Edwards's argument is embedded in 18th-century faculty psychology, making it less general than Strawson's more abstract argument about the conditions for ultimate responsibility itself.
