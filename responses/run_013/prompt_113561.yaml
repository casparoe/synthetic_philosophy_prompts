prompt: |-
  I'm writting something on promising and before I read one more thing about it I want the spec first. So: write me the desiderata for a theory of promissory obligation — what does any account of why promises bind actually have to deliver? Give me the requirements, each with the case or intuition that motivates it: the cases it has to get right, the distinctions it can't collapse, the facts it can't contradict. Say which of them are genuinely non-negotiable and which are just the hobbyhorses of one camp. Then tell me which single requirement does the most to rule out the contenders, and flag any pair of requirements you think can't be met together — I care about that part most, because if the pair really can't be satisfied then the list itself is the result and I can stop hunting for a theory that has it all.

  A few cases I specifically want it to cover, since they're what I keep getting stuck on: a promise made where there's no established practice of promising to lean on — like the first promise two people ever make, with no convention to inherit; a promise to someone who will never find out (to the dead, to a sleeping person); promises made under duress; and promises to do something wrong. And the one I care about most: can a theory have the obligation created by the promisor's own act of will and still not be a bootstrap — i.e. the mere fact that I said I promise is what generates the reason, without that being circular or magic? If the will requirement and the no-bootstraping requirement can't both hold, say so plainly.

  Don't bother with a scorecard of which philosopher gets what right, I'll do that myself — just the criteria and the reasoning behind them, readable, no jargon for its own sake.

  Also tell me how confident you actually are in the list, and single out the requirement you're least sure of — the one you'd most expect someone to push back on.
