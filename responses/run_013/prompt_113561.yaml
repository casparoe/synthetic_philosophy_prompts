answer: |-
  Here are the desiderata for a theory of promissory obligation, structured around your requirements, motivated by cases, and flagged for negotiability and conflicts. I'll focus on the core requirements, your specific cases, and the critical tension you identified.

  **The Core Desiderata (What a Theory *Must* Deliver):**

  1.  **The Obligation Requirement:** The theory must explain why making a promise *prima facie* creates a moral obligation for the promisor to perform the promised act.
      *   **Motivating Case:** The intuitive wrongness of casually making a lunch date with a friend and then not showing up *just because you changed your mind*, even if they weren't significantly harmed (e.g., they found someone else to eat with). It feels like a distinct kind of wrong specific to promising.
      *   **Non-Negotiable:** Absolutely core. Without this, there's no phenomenon to explain.

  2.  **The Content Independence Requirement:** The obligation must arise primarily from the act of promising itself, not (just) from the inherent moral value of the promised act.
      *   **Motivating Case:** Promising to return a borrowed book *vs.* spontaneously deciding to return it because it's the right thing to do. The promise adds an *extra* layer of obligation specific to the promisor, distinct from the general duty of fidelity or returning property. Breaking the promise feels worse than just failing to do the good act spontaneously.
      *   **Non-Negotiable:** High. A theory that collapses promising into just doing the good thing misses the special force of promising.

  3.  **The Reliance-Not-Necessary Requirement:** The obligation to keep a promise can exist even if the promisee does not rely on it (or cannot rely on it).
      *   **Motivating Cases (Your Specifics):**
          *   **Promise to the Dead/Sleeping:** You promise your dying mother to visit her grave every year. She dies moments later. She'll never know, no one else knows, no one relies. Yet, breaking this promise *feels* like a distinct betrayal.
          *   **Secret Promise:** You promise your sleeping child you'll take them to the zoo tomorrow. They never heard it. Not going because you can't be bothered still feels wrong *as a broken promise*, distinct from just disappointing them.
      *   **Non-Negotiable:** High. Theories making reliance essential fail these cases. The core obligation seems tied to the promisor's commitment, not the promisee's reaction.

  4.  **The Practice-Not-Necessary Requirement:** The obligation must be explicable even in the absence of a pre-existing social practice or convention of promising.
      *   **Motivating Case (Your Specific):** The "First Promise" between two individuals with no shared history or concept of promising. Imagine two shipwreck survivors on a desert island. One says to the other, "I promise I will share half of every fish I catch with you." The other understands the intent (a solemn commitment). Intuition suggests breaking this *would* be wrong, distinct from mere lying or selfishness.
      *   **Non-Negotiable:** High (contested by some convention-based theories). Essential for universality and explaining the core normative force.

  **Important Scope & Source Desiderata:**

  5.  **The Voluntariness Requirement:** The obligation must arise from a voluntary act of the promisor.
      *   **Motivating Case:** Distinguishing a promise from a threat or an accidental utterance. You must *intend* to undertake the obligation. This connects to your "act of will" point.
      *   **Non-Negotiable:** Core. Involuntary "promises" aren't binding.
      *   **Your Specific Case - Duress:** Promises made under severe duress (e.g., "Promise me your wallet or I'll shoot!") are often seen as void or voidable. A theory must account for how voluntariness is compromised here, distinguishing it from mere regret or changed circumstances. *Not* necessarily non-negotiable that they are *always* void (some argue they create weak obligations), but the theory must explain the impact of duress.

  6.  **The Overridability Requirement:** Promissory obligations can be overridden by stronger moral considerations, but are not automatically nullified by them.
      *   **Motivating Case (Your Specific):** **Promises to do something wrong.**
          *   **Distinction Needed:** Promising to help a friend commit a murder vs. promising to return a book. The obligation in the first case is *pro tanto* (real, but easily overridden by the stronger duty not to murder) while in the second, it's likely decisive. The theory must explain why the murder promise *was* wrong to make and *is* wrong to keep, **without** implying it generated *no* obligation at all. It generated a *defeated* obligation.
      *   **Non-Negotiable:** High. A theory that makes immoral promises *binding* is morally unacceptable. A theory that makes them *automatically null and void* fails to capture the residual wrongness of making such a promise in the first place and the potential for conflicting duties (e.g., keeping a promise *not* to reveal a secret vs. the duty to prevent harm).

  7.  **The Will Requirement (Your Key Focus):** The promisor's act of will (the intention to undertake an obligation by uttering specific words/performatives) must play a crucial role in *creating* the obligation.
      *   **Motivating Case:** The feeling that *I* bound *myself*. It's not just that society expects it or you relied; it's that *I said so* in a specific, commitment-intending way. This captures the sense of personal responsibility and authorship.
      *   **Negotiability:** High priority for many, but the *exact* role of the will is fiercely debated. Some theories (e.g., reliance, convention) downplay it.

  **The Critical Tensions & Conflicts:**

  *   **The Central Conflict: Will Requirement vs. No-Bootstrapping Requirement:**
      *   **No-Bootstrapping Requirement:** The obligation cannot arise *solely* from the promisor's bare act of will/intention. This seems like "magic" or circularity: "I'm obligated because I said I was obligated." There must be some *external* normative framework or mechanism that gives the act of will this power.
      *   **The Conflict:** This is **the hardest nut to crack.** Satisfying *both* seems impossible:
          *   If the obligation comes *entirely* from the will ("I hereby obligate myself"), it's bootstrapping/magic.
          *   If the obligation comes *entirely* from something external (convention, reliance, expectations, moral principles triggered by the act), then the will seems epiphenomenal – the act is just a signal for other duties to kick in, undermining the sense of *self*-binding.
      *   **Your Question Answered Plainly:** Yes, **this pair (Will + No-Bootstrapping) is exceptionally difficult, arguably impossible, to satisfy simultaneously in a fully satisfying way.** Every theory struggles here. Hybrid theories try (e.g., will invokes a pre-existing moral principle of fidelity, or creates expectations one has a duty not to violate), but the "magic" worry persists. **If you demand a theory where the obligation is *created solely* by the act of will *and* this isn't bootstrapping/magic, you will likely be disappointed. Most plausible theories anchor the will's power in some broader normative context.**

  *   **Other Potential Tensions:**
      *   **Practice-Not-Necessary vs. Will Requirement:** If no practice exists (First Promise), what gives the *specific act of will* its normative force? Pure intention? But then bootstrapping looms. Invoking universal moral principles? But how do they recognize this novel act?
      *   **Reliance-Not-Necessary vs. Overridability:** If the obligation exists independently of reliance (e.g., promise to the dead), what *does* ground it so firmly that it still requires overriding, yet allows overriding for immorality? This pressures theories relying on external duties (e.g., fidelity, autonomy respect).

  **The Most Rule-Out Requirement:**

  *   **The Reliance-Not-Necessary Requirement.** This single-handedly eliminates all pure reliance-based theories and severely challenges expectation-based theories. If a theory *cannot* explain the obligation in the "Promise to the Dead/Sleeping" or "First Promise" cases without smuggling in reliance or expectations, it fails a significant intuitive test.

  **Confidence & Least Sure Requirement:**

  *   **Overall Confidence:** Moderately High. This list captures the core, widely shared intuitions and problem cases driving the philosophical debate. It reflects the landscape accurately.
  *   **Least Sure Requirement / Most Likely Pushback:** **The Overridability Requirement regarding immoral promises.**
      *   **Why:** A significant camp (often inspired by Kantians or intuitionists) argues that promises to do wrong are *null and void* from the outset – they generate *no obligation whatsoever*. They see the "residual wrongness" as stemming purely from the *intention* to do wrong or the act of *trying* to bind oneself to wrong, not from a defeated promissory obligation. They argue calling it a "defeated obligation" grants it a legitimacy it doesn't deserve. The intuition that "I shouldn't have made that promise *and* I certainly shouldn't keep it" is strong, but whether this implies a *pro tanto* promissory obligation that gets overridden, or *no* promissory obligation at all, is deeply contested. Your inclusion of this case makes it crucial, but be prepared for this pushback.

  **Conclusion:**

  This list sets a high bar. The **Reliance-Not-Necessary** and **Practice-Not-Necessary** requirements rule out major contenders. However, the most significant takeaway, given your primary concern, is the **apparent incompatibility between the Will Requirement and the No-Bootstrapping Requirement.** If you require a theory where the obligation is *created solely* by the promisor's act of will *and* this isn't circular or magical, **you may indeed conclude that no satisfactory theory exists.** The search then shifts to theories that best *approximate* this ideal while anchoring the will's power in the least objectionable external normative framework (e.g., fundamental principles of fidelity, respect for autonomy, or constitutive features of rational agency). Good luck!
