  First, I need to list the essential requirements any theory must meet. The user wants distinctions between non-negotiable and debatable points. They also care most about conflicting requirements. Let me recall the key issues in promise theories. The bootstrapping problem is crucial—how can a promise create an obligation just by saying it? That's a big hurdle.

