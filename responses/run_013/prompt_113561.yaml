  I should structure the requirements starting with core obligations, then scope, sources, and conflicts. Each needs a motivating case. For example, the obligation requirement is driven by the intuition that breaking a promise is wrong, even if no one is harmed. The first promise case challenges convention-based theories, so independence from practice is key.

  The will requirement comes from the idea that the promisor's intention binds them. But how to avoid bootstrapping? If a theory can't explain how the act creates a reason without circularity, it fails. The user wants to know if this conflicts with the no-bootstrapping requirement. That's the pair to watch.

  Other conflicts might include the will vs. reliance. If the promisee's awareness isn't needed, reliance theories have issues. Also, immoral promises: if a theory invalidates them, it might conflict with the obligation to keep promises unless overridden. But the user wants obligations that can be overridden by morality, not nullified.

  I should note which requirements are less certain. The scope requirement about immoral promises might be contested. Some might argue that such promises aren't binding at all. But the user probably leans towards them being pro tanto binding, so that's the position to take.

