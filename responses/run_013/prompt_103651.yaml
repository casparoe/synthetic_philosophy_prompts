prompt: |-
  A colleague in my reading group has been arguing that supervaluationism about vagueness refutes itself, and I cannot locate the mistake. His argument runs as follows. (1) A term is vague only if its extension has no sharp boundary; that is the datum any theory of vagueness must preserve. (2) Supervaluationism says that a sentence is true just in case it is true on every admissible precisification of the vague terms it contains, where a precisification is a way of making those terms perfectly precise. (3) Every admissible precisification of 'heap' assigns it a sharp boundary -- some largest number of grains that is not a heap. (4) So the sentence 'there is a sharp boundary to the extension of "heap"' is true on every admissible precisification. (5) By (2), supervaluationism therefore counts that sentence as true, full stop. (6) But by (1), if there is a sharp boundary then 'heap' is not vague after all. (7) So supervaluationism denies the very datum it was built to preserve, and is incoherent. I would rather keep both supervaluationism and the datum than accept (7), but I cannot see how to do it. Which step should I give up, and what does giving it up cost? In particular, once the datum is repaired, does the repaired version leave the theory facing some further problem of its own? And how does the epistemicist -- who simply accepts that vague terms have sharp boundaries, only unknowable ones -- fare by comparison?
reasoning: |-
  Okay, let me try to work through this problem step by step. The user's colleague argues that supervaluationism refutes itself because it ends up claiming that vague terms like "heap" have sharp boundaries, contradicting the initial datum that vagueness means no sharp boundaries. 

  First, I need to recall the core principles. Supervaluationism says a sentence is true if it's true in all admissible precisifications. Each precisification gives a sharp boundary to "heap," so "there is a sharp boundary" comes out true. But the fundamental datum is that vague terms lack sharp boundaries. That seems like a contradiction. 

  Hmm, where's the flaw? I remember that supervaluationism distinguishes between different levels of truth. The statement "there is a sharp boundary" is true supervaluationally, but that doesn't mean there's a specific boundary point we can identify. The vagueness lies in the fact that different precisifications pick different boundaries, and no single boundary is privileged. 

  So the mistake might be in step (6). The colleague assumes that if there's a sharp boundary supervaluationally, then "heap" isn't vague. But actually, the supervaluationist would say the term is vague precisely because multiple boundaries are possible. The existential claim is true, but we can't point to any particular boundary as the "real" one. 

  The cost is that supervaluationism has to accept sharp boundaries exist in some abstract sense while denying we can know or specify them. This makes it somewhat similar to epistemicism, but with key differences. Epistemicists bite the bullet and say there is one unknowable boundary, while supervaluationists say all boundaries across precisifications are equally valid. 

  The user also asks about repairing the datum. The fixed version would be: a term is vague if there's no single sharp boundary across all precisifications. This preserves vagueness as the absence of a unique boundary while allowing that boundaries exist in each precisification. 

  Comparing to epistemicism, that view avoids this problem entirely by accepting sharp boundaries as real but unknowable. But it struggles to explain why we can't discover them and faces other issues like higher-order vagueness. Supervaluationism handles that better but has this tricky self-refutation charge to address. 

  I should emphasize that the supervaluationist's key insight is redefining what "no sharp boundary" means - not that boundaries don't exist, but that no specific boundary is determined. That's the crucial distinction the colleague misses.
answer: |-
  Your colleague's argument is clever but contains a crucial misunderstanding of supervaluationism's treatment of *metalinguistic* claims. The flaw lies in **step (6)** and the interpretation of the "no sharp boundary" datum in **step (1)**. Here's the breakdown:

  1.  **The Core Mistake: Misinterpreting "No Sharp Boundary"** (Step 6):
      *   Your colleague assumes that "there is no sharp boundary" means: **~∃n (n grains is a heap ∧ (n+1) grains is not a heap)**. Let's call this **S**.
      *   Supervaluationism *does* entail **S** is true (as per steps 2-5). The colleague then concludes that **S** being true means 'heap' isn't vague.
      *   **This is the error.** The supervaluationist interprets the "no sharp boundary" datum *differently*. For them, the absence of a sharp boundary **is not the denial of the existential claim S**, but rather the denial that **there is a *specific*, *determinate* n that is the boundary**.

  2.  **Supervaluationism's Resolution: Redefining the Datum**:
      *   The supervaluationist repairs the datum stated in (1). The genuine datum of vagueness isn't simply **~S** (the non-existence of a boundary). Instead, it's that **it is *indeterminate* where the boundary is**.
      *   This indeterminacy manifests as:
          *   **No Specific Boundary:** There is no *unique*, *privileged* number *n* such that *n* grains is the boundary across *all* admissible precisifications.
          *   **Variability:** Different admissible precisifications draw the boundary at different points.
      *   The statement **S** ("There exists a sharp boundary") is **supertrue** because *every* precisification has *some* boundary. However, the statement **"n is the sharp boundary"** (for any *specific* n) is **superfalse** because no *specific n* is the boundary in *every* precisification.
      *   **Vagueness is preserved** precisely through the *variability* and *indeterminacy* of the boundary location across precisifications. The term 'heap' is vague *because* there is no fact of the matter about *which* precisification is correct, hence no fact of the matter about *where* the boundary lies.

  3.  **The Cost of Repairing the Datum**:
      *   **Metalinguistic Complexity:** The theory requires distinguishing between object-level claims (e.g., "This is a heap") and metalinguistic claims (e.g., "There is a sharp boundary", "n is the boundary"). The truth conditions for these are fundamentally different. Critics argue this makes the theory unnecessarily complex or ad hoc.
      *   **"There is a boundary" is Supertrue, but Feels Wrong:** Intuitively, we want to say "There is *no* sharp boundary!" Supervaluationism tells us this intuitive statement (**~S**) is *superfalse* (since **S** is supertrue). This feels counterintuitive, even if the theory explains *why* it's superfalse (the boundary exists in every precisification) and captures the *indeterminacy* in another way.
      *   **Higher-Order Vagueness:** The repaired datum ("It's indeterminate where the boundary is") immediately raises the question: What makes a precisification *admissible*? Isn't the line between admissible and inadmissible precisifications *itself* vague? Supervaluationism struggles to give a non-circular or non-vague account of admissibility without generating an infinite regress (higher-order vagueness). This is a significant challenge, though not unique to supervaluationism.

  4.  **How Supervaluationism Avoids Self-Refutation**:
      *   It avoids incoherence by **distinguishing levels of description**:
          1.  **Object Level (Extensions):** Within *each* precisification, 'heap' has a sharp boundary. **S** is true in every precisification, hence supertrue.
          2.  **Metalinguistic Level (Vagueness Itself):** What *makes* 'heap' vague is the *plurality* of precisifications and the *indeterminacy* about which one is "correct" (or the lack of a single correct one). There is no *determinate* boundary *specifiable* in the language.
      *   The theory *preserves* the phenomenon of borderline cases: a pile *p* is a borderline case iff there is *no* supertruth about whether it's a heap (i.e., some precisifications call it a heap, others don't). This captures the core intuition of vagueness.

  5.  **Comparison with Epistemicism**:
      *   **Epistemicism's Stance:** The epistemicist *accepts* step (6) as correct. They agree with the colleague's interpretation of the datum: if there *is* a sharp boundary (i.e., **S** is true), then the term isn't vague. However, they *deny* that the datum ("no sharp boundary") is correct! They bite the bullet: **S is true** – there *is* a single, sharp, objective boundary. Vagueness arises *solely* from our *ignorance* of where this boundary is. Borderline cases are cases where we *cannot know* if they fall on the heap side or the non-heap side.
      *   **Advantages:**
          *   **Simplicity:** Avoids complex machinery of precisifications, supertruth, etc. Truth is bivalent and classical.
          *   **Preserves Intuition for S?:** They agree with the intuition that **S** should be true if the term has a determinate extension (which they believe it does).
      *   **Disadvantages:**
          *   **Radical Ignorance:** They must explain *why* we are *necessarily and irremediably* ignorant of the boundary, especially for concepts we created (like 'heap'). This seems deeply mysterious.
          *   **Higher-Order Vagueness:** It's equally mysterious why we can't know *whether or not* we know the boundary (i.e., the boundary between the knowably-a-heap and the borderline, and the borderline and the knowably-not-a-heap is itself seemingly vague).
          *   **Intuition Against S:** Most find the claim that there *is* a precise number *n* such that *n* grains is a heap but *n+1* is not, *objectively*, to be deeply counterintuitive and incompatible with the nature of vague predicates.
          *   **Lack of Indeterminacy:** Fails to capture the intuition that borderline statements aren't merely *unknown*, but genuinely *indeterminate* or *neither true nor false*.

  **Conclusion:**

  *   **Reject Step (6):** The mistake is interpreting "no sharp boundary" (the datum) as the simple negation **~S** ("It is not the case that there exists a sharp boundary"). Supervaluationism repairs the datum to mean "It is indeterminate where the boundary is," which is compatible with **S** ("There exists a sharp boundary") being supertrue.
  *   **Cost:** This repair introduces complexity in handling metalinguistic claims and faces the challenge of higher-order vagueness. It also requires accepting that the intuitive claim "There is no sharp boundary" (**~S**) is superfalse, which feels counterintuitive even if explained.
  *   **vs. Epistemicism:** Epistemicism avoids *this specific* problem by accepting sharp boundaries and attributing vagueness to ignorance. However, it faces arguably greater challenges explaining the *source* and *necessity* of that ignorance and clashes more strongly with intuitions about the lack of determinate boundaries. Supervaluationism better captures the *indeterminacy* of borderline cases.

  **Your best move is to challenge the interpretation of the datum in step (1) as implying ~S. Argue that supervaluationism preserves the genuine phenomenon – the indeterminacy of the boundary's location – while acknowledging that every *precise description* of the world (precisification) must draw *some* boundary.** The cost is theoretical complexity and the counterintuitive supertruth of **S**, but this is arguably less severe than epistemicism's necessary and inexplicable ignorance.
