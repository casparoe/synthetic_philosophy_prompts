answer: |-
  ## The Normative Resolution to the Liar: Truth as a Rule for Speech, Not a Property

  The Liar Paradox ("This sentence is false") cripples traditional views of truth as a property, forcing unpalatable sacrifices like abandoning bivalence or embracing contextualism. I argue that the **normative view of truth** – treating truth not as a property propositions possess, but as a *norm governing assertion* – provides the most robust and philosophically satisfying resolution. This view hinges on a crucial distinction: **a proposition's truth is distinct from the warrant for asserting it.** This distinction elegantly dissolves the standard Liar and crucially handles your "Normative Liar" variant.

  **Core Tenet: Truth as an Assertion Norm**

  *   **The Norm:** "One ought to assert that p only if p is true." Truth is the *standard of correctness* for the *act* of assertion. To assert something is to undertake a commitment governed by this rule.
  *   **Truth vs. Warrant:** This immediately separates:
      *   **Truth:** A *metaphysical* or *semantic* feature of a *proposition* (p) concerning how things stand in the world. (This proposition retains classical truth conditions).
      *   **Warrant:** An *epistemic* status concerning a *speaker* and their *evidence* or *reasons* for believing p is true, justifying the *act* of assertion.
      *   **Key Insight:** A proposition can *be* true even if no one is warranted in asserting it (e.g., undiscovered facts). Conversely, one can be warranted in asserting a proposition that turns out false (e.g., based on misleading evidence). Warrant is fallible; truth (on this view) is objective.

  **Dissolving the Standard Liar**

  Consider the Liar Sentence (L): "L is false."

  *   **Property View Problem:** If L is true, it says it's false – contradiction. If false, it says something false (that it's false), meaning it's true – contradiction. Bivalence explodes.
  *   **Normative View Resolution:**
      1.  **Ask about Assertion, not Truth Value:** The question isn't "Is L true or false?" but "**Can L be correctly asserted?**" or "**Is anyone warranted in asserting L?**"
      2.  **Assertion Implies Truth (by the Norm):** If you assert L, you are committed to L being true. But if L is true, then what it says (that it is false) must hold – meaning L is false. Contradiction.
      3.  **Therefore, L Cannot Be Correctly Asserted:** The very act of asserting L leads to a pragmatic contradiction against the assertion norm. L is **unassertible**.
      4.  **No Truth-Value Assignment Needed:** Crucially, we resolve the paradox *without needing to assign L a truth value*. We simply recognize that asserting it violates the fundamental rule of assertion. L might *have* a truth value (perhaps indeterminate, perhaps simply inexpressible via assertion), but the *paradoxical loop is broken at the level of speech acts*. The problem is pragmatic, not purely semantic.

  **Confronting the Normative Liar (NL)**

  Your variant: "This sentence is not warranted for assertion." (NL)

  *   **The Challenge:** Does NL generate a new paradox for the normative view? Is it correctly assertible?
  *   **Analysis:**
      1.  **Assume NL is Asserted:** If someone asserts NL, they are committed (by the truth norm) to NL being *true*.
      2.  **NL's Content:** What does NL say? It says of *itself* that it is *not warranted* for assertion.
      3.  **Contradiction:** If NL is *true* (as required by its assertion), then what it says must hold: NL is *not warranted* for assertion. But the speaker *just asserted it*, implying they *were* warranted in asserting it (assuming they are sincere and competent). We have a contradiction: The speaker is both *warranted* (by asserting it sincerely/competently) and *not warranted* (because NL's truth entails its own lack of warrant) in asserting NL.
  *   **Resolution:**
      1.  **Unassertibility (Again):** Just like the standard Liar, asserting NL leads to a pragmatic contradiction regarding warrant. Therefore, **NL cannot be correctly asserted.** It is unassertible.
      2.  **Distinction Saves the Day:** The contradiction arises *specifically because of the act of assertion and its link to warrant*, not because NL somehow lacks a truth value or creates a semantic loop involving its *own* truth property. The problem is located in the *incoherence of the speech act itself* given the content of NL and the norms governing assertion.
      3.  **No Genuine Paradox:** NL is not a genuine paradox *for the normative view*. It demonstrates the *limits of assertibility* imposed by the truth norm and the nature of self-reference about warrant. Recognizing NL as unassertible is a consistent outcome, not an inconsistency within the theory. It highlights that propositions can be formulated whose assertion is pragmatically self-defeating due to their content referencing the warrant conditions for their own assertion.

  **Logical Costs: What Must Be Given Up**

  The normative view remains robustly classical *for propositions not involving pathological self-reference*. However, it requires rejecting a specific logical principle *when applied to assertion*:

  *   **Unrestricted "Capture and Release" for Assertion:**
      *   **Capture (Truth to Warrant):** "If p is true, then one is warranted in asserting p." *This must be rejected.* Truth does *not* guarantee warrant (e.g., undiscovered truths). Warrant requires epistemic access.
      *   **Release (Warrant to Truth):** "If one is warranted in asserting p, then p is true." *This must be rejected.* Warrant is fallible; justified assertions can be false.
  *   **Preserved Principles:** Crucially, the view *retains*:
      *   **Bivalence:** For ordinary, non-pathological propositions, p is either true or false, independent of our knowledge or warrants.
      *   **Non-Contradiction:** ~(p & ~p) holds for propositions.
      *   **Excluded Middle:** (p v ~p) holds for propositions.
      *   **T-Schema (as a constraint on truth conditions):** "p" is true iff p. This tells us what it *means* for p to be true. The normative view doesn't reject the T-schema; it rejects the idea that asserting "p" *always* requires or implies that we can *use* the T-schema to derive p or "p is true" without pragmatic constraints in pathological cases. The schema defines truth; the norm governs its *expression* via assertion.

  **Why Preferable to Rivals**

  1.  **Preserving Bivalence (vs. Truth-Value Gaps/Gluts):** Theories abandoning bivalence (e.g., Kripke's fixed points, supervaluationism) sacrifice a powerful and intuitive logical principle for *all* propositions to handle a few pathological cases. The normative view isolates the pathology to the *act of assertion*, preserving bivalence and classical logic for the vast realm of ordinary, non-self-referential discourse. Truth remains robustly objective and binary.
  2.  **Avoiding Contextual Relativism (vs. Contextual Theories):** Theories relativizing truth to contexts, utterances, or speakers (e.g., some versions of Burge, Simmons) undermine the objective, non-perspectival nature of truth. What's true becomes contingent on the act of speaking. The normative view maintains truth as objective (p is true simpliciter) and independent of context. The *warrant* for assertion is context-sensitive (depending on evidence, speaker, etc.), but *truth itself* is not. The problem with the Liar is its *unassertibility in any context*, not a shift in its truth value.
  3.  **Diagnostic Power:** The normative view provides a clear diagnosis: Liar sentences are *pathological performatives*. Their flaw is attempting an assertion that violates the constitutive norm of assertion itself. This explains *why* they are problematic – they are pragmatically self-defeating utterances. Rivals often treat them as merely semantically defective propositions without this illuminating explanation.
  4.  **Epistemic Humility:** By cleanly separating truth and warrant, the view acknowledges our fallibility. We assert based on warrants, aiming at truth, but never with absolute certainty that we've attained it. This aligns with actual epistemic practice.

  **Conclusion**

  Treating truth as a norm governing assertion ("Assert only what is true") rather than a property offers the most compelling resolution to the Liar paradox and its variants like the Normative Liar. By distinguishing the objective truth of a proposition from the fallible warrant a speaker has for asserting it, the view dissolves the paradoxes by showing that asserting such sentences is pragmatically self-defeating – it violates the very norm invoked by the act of assertion. While it requires rejecting the principle that truth entails warrant or warrant entails truth, it preserves bivalence, non-contradiction, excluded middle, and the objectivity of truth for the vast majority of discourse. This focused sacrifice is far preferable to abandoning core logical principles wholesale or relativizing truth to context, as it maintains a robustly classical and objective conception of truth while offering a clear, pragmatic explanation for the pathology of self-referential paradoxes. The Liar's challenge is met not by redefining truth itself, but by understanding the rules governing our speech about it.
