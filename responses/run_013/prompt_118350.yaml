  2. First player makes a random move and "steals" that strategy
  3. The extra stone never hurts, leading to contradiction
  4. Thus first player must win

  For Giveaway Hex, the critical failure point is step 3 - that extra stone can actually block your own connection, making it disadvantageous. I need to include a simple board position where adding a stone ruins a winning position. Maybe a 2x2 grid with one critical cell?

  For the logical gap: students must name determinacy (every position has a winner) as the missing ingredient that bridges "no second-player win" to "first-player win". This connects to week two's material on non-constructive existence.

  For the model answer: I'll structure it to hit all three parts explicitly, show the concrete counterexample, and spend about 200 words on the epistemology coda. Word count is tight - 700 words means every sentence must count.

  Marking scheme out of 25: 
  - 10 for part (i) (premise break + example)
  - 10 for part (ii) (logical gap + determinacy)
  - 5 for part (iii) (philosophical reflection)
