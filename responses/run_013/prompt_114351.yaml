  Ok so I'm a med student doing a rotation in a hypertension clinic and I've gotten weirdly hung up on the fact that the guidelines just *decide* that 130/80 is high blood pressure -- the attendings all agree the underlying thing is continuous and that the cutoff is a convention, a committee's precisification, not a discovery. Meanwhile I'm in a reading group on vagueness and we've been grinding through the epistemicism vs supervaluationism thing (the Williamson line vs. the Fine/Keefe "admissible precisifications" line), and it struck me that neither story fits the blood pressure case: it's not that the boundary is sharp but unknowable, and it's not that it's indeterminate, it's that somebody made it. Which probably just means the clinical case is a different phenomenon and I'm confusing myself.

  Anyway here's what I actually want, and please don't hedge into "it depends what you mean by vague": give me your credence that epistemicism is true -- i.e. that for ordinary vague predicates like 'bald' or 'heap', borderline sentences really do have a determinate truth value and it's just that we can't know where the boundary sits -- and then decompose it. I want a rough number and one line of justification for each of: (a) whether truth-value gaps are even coherent, or whether "neither true nor false" is just a dressed-up way of saying we don't know; (b) whether supervaluationism survives the higher-order vagueness problem, since if it collapses then a chunk of the credence it was holding flows to epistemicism by default; (c) how much the tolerance intuition hurts the epistemicist -- the sense that "if n hairs is bald then n+1 is" isn't a contingent fact we could turn out to be wrong about but is partly constitutive of what 'bald' means; (d) whether the dispute is really about one thing or a grab bag (degree predicates, multidimensional predicates, context-sensitivity, family resemblance) such that the answer might differ predicate by predicate; and (e) whatever term I'm missing. Then combine them, tell me which one is carrying the most weight, and say what would actually move it -- is there an argument or a case that would shift your (b) or (c) substantially, or is this one of those questions where nothing short of a full theory of meaning would do? For calibration, I'm sitting around 0.35 and a friend in the group is at 0.7, and I'd like to know which sub-question we probably actually disagree about, since I suspect it's definately not the ones we shout about.
