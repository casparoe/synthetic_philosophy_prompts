prompt: |-
  I'm building a unit for a first-year seminar I've been calling (badly) "Words Without Definitions," and I want a sanity check on my own thinking before I commit to teaching it. You're a philosopher of language who has taught the later Wittgenstein on games and family resemblance many times, and who thinks a lot of the standard teaching of it is sloppy. Take that role seriously, be blunt where I'm confused, and don't be polite about the parts of my setup that don't work.

  Before you score anything, brainstorm a bit: what are the genuinely different things people mean when they say a term works by family resemblance — no common feature but overlapping similarities, open texture, prototype structure, cluster concepts, polysemy, plain old vagueness, and whatever else belongs on that list? Keep it short. I just want the space laid out so I can see what you think you're scoring.

  Here's my list — I'd like to recieve each item rated, not discussed in general:
  game, number, art, chair, knowledge, jazz, species, religion, money, courage, sport, bald, democracy, genre.

  Two scores per item, both 0–10.
  A) How badly a necessary-and-sufficient definition fails for it. 10 means no definition has a chance; 0 means a definition is sitting right there and everyone knows it.
  B) How much we'd lose if we fixed a definition anyway and enforced it. 10 means the term would stop doing real work, or would start doing harm; 0 means nothing changes except that philosophers have less to argue about.

  I also want you to apply a test I made up, mostly to see whether its any good. Call it the orphan test: imagine the single most central, most-cited example of the concept had never existed, and the word had entered the language anyway, applied only to the surviving, more marginal cases. Would there still be a settled practice of using the word? Would the remaining uses still hang together, or would the word just look like several different words spelled the same? Score 0–10, where 10 means the concept barely notices the loss and 0 means it collapses.

  Then give me the ranking. Sort all fourteen into tiers by score A, with a sentence per item on what put it where. Flag every item where A and the orphan test disagree by 3 or more, and say which of the two is tracking the real thing in those cases. My suspicion is that the orphan test is really a test for prototype anchoring rather than for family resemblance at all — tell me whether that's right, and if it is, what a better test would look like.

  Two more things. If you had to defend the claim that exactly one item on my list is a real family resemblance concept and the rest are imposters, which one, and why? And if I want students to see that family resemblance is not the same thing as vagueness, which two items should I put side by side — and which pair would give them exactly the wrong impression?

  Add two concepts of your own if you think my fourteen are badly chosen, score them on all three numbers, and say what they fix.
