  So I want a case built to order, something I can sketch on a napkin and hand him. One game, St. Petersburg in flavor (coin or die, infinitely many possible rounds, describable in a sentence or two), such that all four of these hold at once: (1) the expected monetary payoff is infinite, as usual; (2) Bernoulli's log utility *also* gives infinite expected utility for this game — so the log agent and the naive expected-value maximizer agree, and both would pay any finite price, which is the exact opposite of his story; (3) a bounded utility function gives a finite and modest reservation price — use something concrete and simple, like u(x) = x/(x+c) or u(x) = 1 - e^(-x/c), pick a c, and give me the actual number; (4) a completely different folk fix — just round any probability below some cutoff, say one in a million, down to zero — also gives a finite price, and I want to know whether that price lands above or below the bounded-utility one, and by how much. Then do the demonstration properly: for each of the four rules, show the actual computation and why it lands where it does, not just the verdict. Tell me which single feature of the payout schedule is doing all the work in making (2) true, and what happens when I flatten the schedule back to the ordinary doubling game — does the log fix come back, and does the *ordering* of the four prices change or just the numbers?

  Last thing, and this is the part I actually care about. Does the bounded-utility fix really settle the price, or does it just move the arbitrariness from "how much would you pay" into "which bounded utility function" — i.e., if I multiply my u by some constant, or stretch it, does the reservation price move with it? And if my friend wanted to defend the line that log utility is the real resolution and my game is a cheap trick, whats the strongest version of his reply? Is there a version of my case that would break *any* unbounded utility function, or is the log one only breakable by accident?
