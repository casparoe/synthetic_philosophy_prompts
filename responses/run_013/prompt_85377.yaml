answer: |-
  ## Bedrock Dispute  
  (after an argument with a stratigrapher)

  They say the layers settle it. The slow
  archive of silt, the ice’s frozen breath,
  the coral’s stony scroll. We ought to know
  by reading depths where time feigns geologic death.
  Yet here we stand, above the churning core,
  debating when the human fist took hold.
  Before the steam-hiss? Or the cannon’s roar?
  Or when the forest swallowed stories untold?
  **The line is drawn at 1492.**

  We seek the perfect page, unsmeared, unflawed:
  a lake bed’s ink-black, undisturbed decree,
  a core where summers freeze, where winters thaw
  in perfect stripes, laid bare for all to see.
  A place where anyone might drive the spike –
  a golden wedge proclaiming "Here, it starts!"
  A committee convenes beneath stark light,
  scrutinising graphs and fractured quartz.
  **The line is drawn at 1610.**

  The humus thickens where the firestorm passed.
  The plankton shift beneath the acid rain.
  The isotopes declare their lethal blast
  across the stratigraphic, mute terrain.
  The vote is called: a show of weary hands.
  The spike withdrawn, the boundary deemed unclear.
  The minutes note the unmet, strict demands
  for one clear cut, one universal year.
  **The line is drawn at 1945.**

  The ice still melts. The acid sea still climbs.
  The pollen shifts in mud we churn and plough.
  The absence pulses through the layered times.
  The epoch’s here. The question lingers: *How?*
  **The line is drawn at 1784.**
  **The line is drawn at...**
  **The line is drawn...**

  ---

  **Note on Stratigraphic Liberties:**

  *   **Start Dates:** I employed three widely debated start dates: **1610** (Orbis Spike - CO₂ dip linked to post-Columbian reforestation), **1945** (Great Acceleration - radionuclides), and **1784** (industrialization, Watt's steam engine). While **1492** (Columbian Exchange) and the unspoken possibility of an early Holocene date (e.g., **8000 BCE**, spread of agriculture) are hinted at, I focused on the three clearest markers central to the recent debate.
  *   **The "Perfect Site":** The description (varved lake sediment, ice core) leans towards the idealised criteria for a Global Boundary Stratotype Section and Point (GSSP) – continuous deposition, global correlation potential, accessibility. I simplified the immense practical difficulty of finding a single site meeting *all* criteria perfectly for the Anthropocene.
  *   **The "Decision":** I depicted the process (committee, vote, golden spike) as more singular and decisive than the often protracted, iterative, and consensus-seeking reality of the International Commission on Stratigraphy (ICS). The 2024 rejection by the ICS was indeed a specific vote against the proposed mid-20th Century marker, not a blanket denial of human impact, which I aimed to reflect in the final stanzas.
  *   **The "Settling":** The poem commits to the view that the *formal geological designation* as an Epoch is distinct from the *reality* of profound, synchronous human alteration of Earth systems. The 2024 vote "settles" the formal geological question of *this specific boundary proposal* for an Epoch, but fundamentally unsettles nothing about the observable, undeniable planetary shift – hence the persistent refrain and the unresolved ending.

  **Contested Ground & Alternative Forms:**

  *   **If the Dispute is Verbal:** If I came to view the core dispute as largely semantic (e.g., "Epoch" vs. "Event" vs. simply acknowledging change), the poem might abandon the specific refrain mechanics. Instead, it could explore the slippery nature of language itself, perhaps using shifting definitions or fragmented phrases as the recurring element, highlighting the struggle to name the unnameable scale of change.
  *   **If a Single Boundary is Flawed:** Should I be convinced that seeking a single global synchronous boundary is fundamentally the wrong approach for the complex, diachronous Anthropocene, the form would fracture. The refrain might splinter into multiple voices stating different dates simultaneously, or stanzas could represent different regions/processes with their own unique "start dates," abandoning the singular, insistent "The line is drawn at..." altogether. The structure itself would argue against a unified beginning point. The current form, with its rigid yet shifting refrain, embodies the tension *inherent* in the quest for that single line – the geological desire for clarity against the messy, multi-threaded reality.
