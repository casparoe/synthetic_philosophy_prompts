  - Closest precedent is **Case 4** (sympatry, RI via sterility, no GD).  

  **To settle between Rule 1 and Rule 2**, you need a case:  
  > Sympatric populations with fixed differences and reciprocal monophyly but free interbreeding (no RI).  

  - Rule 1: Lump (no RI in sympatry).  
  - Rule 2: Split (GD present).  

