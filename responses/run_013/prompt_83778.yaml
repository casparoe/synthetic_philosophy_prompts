  I considered rules that combine reproductive isolation (RI), genetic distinctness (GD: fixed differences + reciprocal monophyly), and geography. Here's how top candidates score (✓ = fit, ✗ = misfit):

  1. **"RI or GD in Allopatry" Rule**:  
     Split if:  
     - RI is present (any barrier: prezygotic, postzygotic, or extrinsic), OR  
     - Populations are allopatric and show GD.  
     - **Fit**: ✓ All cases (Case 1: GD + allopatry; Case 2: RI (hybrid zone) + parapatry; Case 3: No RI, sympatry → lump; Case 4: RI (sterility), sympatry; Case 5: RI (no mating); Case 6: Allopatry but no GD → lump).

  2. **"RI or GD Unrestricted" Rule**:  
     Split if:  
     - RI is present, OR  
     - GD is present (regardless of geography).  
     - **Fit**: ✓ All cases (Case 1: GD; Case 2: GD; Case 3: No GD/RI → lump; Case 4: RI; Case 5: GD/RI; Case 6: No GD/RI → lump).

  3. **"RI-Only" Rule**:  
     Split only if RI is demonstrated.  
     - **Misfit**: ✗ Case 1 (allopatry, no RI test, but split) and Case 6 (allopatry, no RI test, lumped—consistent but doesn't explain splitting without RI).

  4. **"GD-Only" Rule**:  
     Split only if GD is present.  
     - **Misfit**: ✗ Case 4 (no GD, but split due to RI) and Case 5 (fits, but RI is also present).

  5. **"Genotypic Clustering" Rule**:  
     Split if distinct genetic clusters with limited admixture.  
     - **Misfit**: ✗ Case 4 (no distinct clusters, but split) and Case 3 (Fst=0.30 but lumped due to interbreeding).

  **Ruled-Out Rules**:  
  - Strict BSC (RI-only): Ruled out by Case 1 (split without RI test).  
