  Below is my decomposed credence assessment for the claim that self-masking dispositions are possible and that their possibility shows the fink/mask distinction must be drawn by the mechanism of interference (removal vs. blocking) rather than by internal/external location. My final credence is **0.70**, with sensitivity to **(c)**. I explain this after the decomposition.

