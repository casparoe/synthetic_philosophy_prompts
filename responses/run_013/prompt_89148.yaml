prompt: |-
  Ok so here's a view I've talked myself into and I want to know how exposed it actually is. The view: the preference for simpler theories isn't just a pragmatic heuristic or a psychological habit — it has a real formal justification. The argument I find compelling is roughly the Solomonoff one. Take prediction seriously, put a prior over programs (or over computable data-generating processes) that goes down with description length, and you get a predictor that (a) is guaranteed to converge on any computable environment and (b) never does much worse than the best hypothesis in the class, up to constants and log factors. So the "there are fewer simple hypotheses" argument for Occams razor isn't hand-waving, it's a theorem. And the standard complaint — that Kolmogorov complexity is only defined relative to a machine, so the whole thing is arbitary — I've been treating as a technicality, since the invariance theorem says the choice of machine only shifts things by an additive constant.

  So: what would count against this? Against the interesting version of it, I mean, not the watered-down one where "simpler" just means "better confirmed so far."

  Things I've already wondered about, and I'd like you to tell me which are real and which are cope:

  - The additive constant. It's finite, sure, but it can be enormous and it depends on the reference machine, and the ranking of two particular hypotheses can flip if you switch machines. Is "asymptotically irrelevant" doing any work in the finite cases where anyone actually uses Occam's razor?

  - A machine built on purpose. Suppose I define a universal machine whose instruction set has a primitive for epicycles, or for "and then a miracle happens in exactly this way." Epicyclic astronomy is now the short description. Does that refute the claim that the prior tracks real simplicity, or does it just show I'm cheating — and if it's cheating, what's the non-circular rule that makes it cheating?

  - Compressibility vs. ontology. This is a prior over predictors, not over theories. Two theories could have nearly identical description length while one posits way more stuff, or the same stuff arranged more baroquely. If so, it doesn't underwrite what scientists actually mean when they invoke simplicity against a rival, and the convergence result is about predicting bits rather than getting the world right. Does that split the position into two halves, and does either half survive on its own?

  - What happens if the world isn't computable, or the true measure isn't? Is that a live possibility or a philosopher's hypothetical?

  - I once heard someone say the convergence theorem is a claim about the limit while Occam's razor is a claim about now. Someone else suggested penalizing programs for how long they run, not just how long they are. Do either of those change the verdict, and in which direction?

  What I want: the defeaters ranked, from "the position is dead" to "awkward but survivable." Say which ones the defenders of this view themselves concede are problems and which they'd say I've misunderstood. Tell me honestly if the position turns out to be unfalsifiable or trivially true once it's stated carefully — and if it is, whether that's fatal for a claim of this kind or just what you'd expect from a formal result. A concrete case where the simpler theory lost and the complex one won, or where the complexity ranking is just language-dependent, would move me more than a general worry.

  Also, say what would change your mind: what would have to be true, or what argument would have to go through, for you to end up saying the formal justification is real rather than a fancy redescription of a heuristic. If your own reasoning is shaky somewhere, tell me where.

  American English, please.
reasoning: |-
  Okay, let's tackle this user's query step by step. They've presented a view that simplicity in theories isn't just pragmatic but has formal justification via Solomonoff induction, and they want to know the main weaknesses. 

  First, I need to recall the core of Solomonoff induction: a prior over programs that favors shorter descriptions, with convergence guarantees. The user mentions the invariance theorem (additive constant) and potential issues like reference machine dependence, non-computability, and the gap between prediction and ontology.

  The user lists specific concerns: the additive constant problem, maliciously designed machines, compressibility vs. ontology, non-computable worlds, and the difference between asymptotic convergence and practical use. They want these ranked from fatal to survivable, with real-world examples and what could change my mind.

  Starting with the additive constant: Yeah, it's a big deal. In real-world cases, that constant isn't just a minor bump—it can flip which hypothesis is simpler depending on the machine. Like in the programming language example: Python vs. assembly for the same algorithm. That's not just theoretical; it affects actual choices. The user needs to know this isn't a trivial issue—it undermines the objectivity of "simplicity" in practice. But defenders might say it's survivable because asymptotically it doesn't matter. Still, for finite cases, it's awkward.

  Next, malicious machines. If someone designs a UTM with a built-in "miracle" opcode, then miracles get short codes. That feels like cheating, but is there a non-circular way to ban it? Solomonoff doesn't specify which UTM to use, so this is a real hole. It shows simplicity isn't inherent but machine-dependent. But maybe one could argue for "natural" UTMs? That's fuzzy, though. This is a serious problem, maybe second only to the ontology issue.

  Ah, compressibility vs. ontology—this might be the killer. Solomonoff cares about predictive efficiency, not ontological simplicity. Two theories can have similar code lengths but vastly different ontologies (like epicycles vs. ellipses). Scientists care about what's real, not just prediction. So Solomonoff doesn't justify preferring fewer entities or simpler mechanisms. This splits the position: the predictive half works, but the explanatory half doesn't. And since the user cares about what scientists mean by simplicity, this is a major weakness. Real-world example: Newton vs. epicycles—same predictions back then, but Newton was ontologically simpler. Solomonoff wouldn't have favored it initially if the math was longer. That's damning.

  Non-computable worlds: If the universe isn't computable, Solomonoff falls apart. But is that plausible? Quantum mechanics suggests it might be, but we don't know. Still, it's a live possibility, making this a survivable but real issue. Philosophers worry; physicists might shrug. 

  Convergence vs. now: Penalizing runtime helps with practical use, but it's an ad hoc fix. Without it, Solomonoff converges eventually but might suck in the short term. That's a gap between theory and practice. But defenders might say it's still the best formalization we have.

  Ranking these: Ontology gap is the top defeater—it directly attacks the user's desire to justify scientific simplicity. Then malicious machines and additive constants undermine objectivity. Non-computability is speculative but serious. Convergence delay is manageable.

  What would change my mind? If someone could define "ontological simplicity" formally and link it to Kolmogorov complexity, that'd help. Or show that in practice, predictive simplicity correlates with ontological truth. But that's not proven. Also, finding a canonical UTM would solve many issues, but that's impossible per invariance theorem.

  User's deeper need: They want a rigorous foundation for Occam's razor in science, not just prediction. Solomonoff doesn't provide that. They might be disappointed but should know where it holds (prediction) and where it doesn't (explanation).
answer: |-
  Here's a ranked assessment of the defeaters for your position, from most damaging to least, based on the core tension between Solomonoff induction's formal elegance and its ability to underwrite "real" ontological simplicity in scientific practice. The position isn't *dead*, but it's severely constrained and doesn't fully justify scientific intuition about simplicity.

  ### **Ranked Defeaters (Fatal to Survivable)**

  1.  **The Ontology Gap (Compressibility vs. Ontology):**
      *   **Problem:** Solomonoff prioritizes *predictive efficiency*, not *ontological parsimony*. Two hypotheses can have nearly identical Kolmogorov complexity (K) while positing wildly different underlying realities (e.g., a compact code simulating a complex, baroque world vs. a slightly longer code describing a genuinely sparse world). The prior doesn't care about "stuff," only about the output bits.
      *   **Why it's Fatal to the Core Claim:** This directly attacks your goal of justifying what scientists *mean* by simplicity (fewer entities, fewer types, simpler laws). A Solomonoff-inspired agent might predict perfectly while believing in a needlessly complex reality. **Real-world example:** Newtonian gravity (inverse square law + masses) vs. a complex epicycle-like model *of gravity itself* that predicts planetary orbits identically within observational error for centuries. If the epicycle-code is shorter under the reference machine, Solomonoff prefers it, despite scientists intuitively knowing Newton is ontologically simpler. The convergence theorem guarantees it finds the *predictively optimal* code, not the *ontologically true* one.
      *   **Defender Response:** Concede this is a major limitation. Argue that predictive success is the *only* accessible goal, and ontological simplicity is either ill-defined or secondary. The "surviving half" is the powerful convergence guarantee for prediction.
      *   **Verdict:** **Position Severely Wounded (Ontologically Dead).** It fatally undermines the claim that K-complexity justifies *scientific* ontological simplicity. The predictive half survives robustly.

  2.  **Malicious Machines (Purpose-Built Reference Machines):**
      *   **Problem:** You can define a Universal Turing Machine (UTM) with a built-in "epicycle" or "miracle" instruction. Under this UTM, hypotheses heavily using that instruction become very short, dominating the prior. This feels like cheating, but the invariance theorem technically allows it – the additive constant just absorbs the "cheat cost" of making the *simulator* complex. There's no formal, non-circular principle (like "natural UTMs") to rule this out within the framework.
      *   **Why it's Very Damaging:** It highlights the relativity of "simplicity." What counts as simple depends entirely on the arbitrary choice of reference machine. An "epicyclist" using their custom UTM has a formal justification just as strong as a Copernican using a different UTM. **Concrete Example:** Imagine UTMs U1 (standard) and U2. U2 has a single instruction `EPICYCLE(n, center, radius, speed)` which outputs n data points of a perfect epicycle. Under U2, Ptolemaic astronomy has tiny K. Under U1, it has huge K. Neither UTM is "wrong" formally.
      *   **Defender Response:** Argue that "natural" UTMs exist (e.g., based on standard programming languages or physical realizability) and malicious ones are unnatural artifacts. This relies on intuition *outside* the formalism. The invariance theorem still guarantees predictive convergence *eventually* regardless of UTM choice.
      *   **Verdict:** **Major Wound (Survivable but Awkward).** It exposes the deep relativity of "description length" and makes justifying a *specific* simplicity ranking language-dependent in practice, though prediction still converges asymptotically.

  3.  **The Additive Constant Problem:**
      *   **Problem:** The invariance constant isn't just theoretical; it can be astronomically large and *matters* for finite problems. Hypothesis rankings *can* flip between UTMs for specific, finite hypotheses crucial in real science. "Asymptotically irrelevant" is cold comfort when making actual choices *now*.
      *   **Why it's Damaging:** It undermines the objectivity of simplicity rankings in practical, finite settings. **Concrete Example:** Consider two hypotheses H1 and H2. Under UTM A, K(H1) = 1000, K(H2) = 1005. Under UTM B (with a different instruction set), K(H1) = 10,000,005, K(H2) = 10,000,000. UTM A prefers H1, UTM B prefers H2. Which UTM should a scientist use? The theorem doesn't say.
      *   **Defender Response:** Concede it's a practical issue, but argue:
          1.  For *sufficiently* complex hypotheses or *long enough* data streams, the flip becomes less likely/impactful relative to the dominant term.
          2.  Choosing a "reasonable" UTM (e.g., based on a standard programming language) minimizes the problem in practice.
      *   **Verdict:** **Significant Wound (Awkward but Survivable).** It highlights the practical limitations of the formal guarantee but doesn't destroy the asymptotic convergence or the core intuition that shorter descriptions *in a reasonable language* are generally better.

  4.  **The Gap Between Asymptopia and Now:**
      *   **Problem:** Convergence is guaranteed *in the limit* with infinite data. But science happens *now* with finite data. A very complex true hypothesis might have terrible short-term prediction performance (high regret) before its predictions dominate. Penalizing runtime (Levin search) helps practically but makes the description "program + runtime resources," complicating the pure simplicity story.
      *   **Why it's a Problem:** Occam's razor is used *now* to choose between theories with *current* evidence. The theorem doesn't guarantee the simple (short K) hypothesis is best *now*, only that the prior will *eventually* learn the truth.
      *   **Defender Response:** This is widely acknowledged. Adding runtime penalties (Levin complexity) or using approximations (Minimum Description Length - MDL) is the standard, practical fix. This prioritizes hypotheses that are *both* short *and* quick to compute predictions. It trades some formal purity for practicality.
      *   **Verdict:** **Manageable Injury (Survivable).** It shows the basic Solomonoff prior isn't directly usable for real-time prediction, but the core idea (penalizing complexity) adapts well with practical modifications like MDL or runtime penalties. The justification shifts slightly but remains formal.

  5.  **Non-Computability:**
      *   **Problem:** If the true data-generating process is uncomputable (e.g., involves true randomness, hypercomputation), Solomonoff induction has no convergence guarantee. Its prior is over computable hypotheses only.
      *   **Why it's Less Damaging (but Real):** It limits the scope of the claim. **Is it a live possibility?** Many physicists believe quantum mechanics is fundamentally probabilistic (suggesting randomness), but whether this requires *uncomputability* is debated. It's more a philosopher's worry *for now*, but not absurd.
      *   **Defender Response:** Concede the limitation. Argue that computable approximations are the best we can ever hope to use or verify empirically. The framework is justified for the vast domain of computable (or effectively computable) phenomena.
      *   **Verdict:** **Minor Bruise (Easily Survivable).** It restricts the domain of applicability but doesn't invalidate the justification within that domain. Most scientific theories *are* computable models.

  ### **Overall Verdict on Your Position**

  *   **"The preference for simpler theories has a real formal justification via Solomonoff induction."**
      *   **Half True:** It has a *superb* formal justification for **predictive efficiency** and **asymptotic convergence to the truth** *within the class of computable hypotheses*. This is a monumental, non-trivial result.
      *   **Half False:** It does **not** provide a formal justification for **ontological simplicity** as understood in science (fewer entities, simpler mechanisms). This is the core defeater. The "simplicity" it rewards is purely syntactic (description length) relative to an arbitrary UTM, aimed solely at compression/prediction. The invariance theorem and additive constant issue further weaken the claim to objectivity in practice.

  **Is it unfalsifiable or trivially true?** The *predictive convergence result* is a non-trivial, falsifiable mathematical theorem (it could have been false!). However, its *interpretation* as justifying *scientific* ontological simplicity *is* unfalsifiable because it decouples prediction from ontology. You can always say the predictor converged to the predictively optimal code, regardless of what ontology that code implies.

  **What Would Change My Mind About Ontological Simplicity?**

  For me to accept that Solomonoff induction *formally justifies ontological simplicity*, I would need to see:

  1.  A formal, non-arbitrary link between low Kolmogorov complexity *of a predictor* and a sparse or simple *ontology*. This might involve:
      *   A demonstration that for broad classes of "reasonable" worlds, the predictively optimal program *also* tends to be ontologically simple (e.g., uses few state variables, simple update rules).
      *   A formal measure of "ontological complexity" that can be shown to correlate with or be bounded by K-complexity under specific, non-ad-hoc assumptions about the reference machine and the world.
  2.  A resolution to the reference machine relativity that doesn't rely on "naturalness" intuitions. Perhaps a principle for selecting a *canonical* UTM based on physical realizability or minimal simulation overhead.

  **My Own Reasoning's Shaky Point:** The line between a "malicious" UTM and a "natural" one is fuzzy. I rely on intuition that standard programming languages or physically efficient implementations are "natural." While I think this is reasonable, it *is* an extra-formal assumption. A determined skeptic could argue this undermines the objectivity claim.

  **In Summary:** Your position is **half-right and incredibly powerful for prediction**, but **fatally flawed for ontology**. Solomonoff induction provides a profound formal basis for preferring *predictively efficient* hypotheses, guaranteeing eventual success. However, it does not formally justify why scientists should prefer theories with fewer types of entities or simpler causal mechanisms *for reasons beyond pure prediction*. The defeaters related to ontology and reference machine relativity are the most serious. The position survives best as a justification for *predictive simplicity*, not *explanatory simplicity*.
