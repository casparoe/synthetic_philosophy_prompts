  I've been going down a rabit hole on Fitch's paradox of knowability and I want to check I've got it right before I embarrass myself somewhere. The way I understand it, the proof shows there are facts about the world that nobody could ever know, not now and not ever, no matter how good our science gets. The one I keep thinking about is how many grains of sand were sitting on a particular beach on a particular day in the year 1000. Surely that's one of the unknowable facts.

  So my questions: how do you tell which facts are the unknowable ones? Are they all the big cosmic ones, like what happened before the big bang, or can a boring everyday fact be one too? And does this mean science should give up on ever having a complete picture of reality, because there'll always be a permanent blind spot? And is there anything I can do about it — if I wanted to do a research degree, how would I avoid picking a question that turns out to be unknowable in principle?

  Honestly part of me thinks the whole thing is a word game, because the fact in the proof seems to be about somebody not knowing something, which feels like it's rigging the deck. Is it a real result or does it fall apart when you poke it? A mate of mine reckons it also proves that no being could know everything, which sounds wrong to me but I dont really know why. Sorry if I've mangled this, I never studied philosophy, I've just read the wikipedia page a few times.
