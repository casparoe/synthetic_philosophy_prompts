answer: |-
  Below is a comprehensive exam question, model answer, and marking scheme designed to meet your specifications. The question forces students to engage deeply with the Humean/Anti-Humean dialectic while maintaining rigorous symmetry.

  ---

  ### **Essay Question**  
  **"The Globality of Laws: A Double-Edged Sword for Humeans and Anti-Humeans"**  
  Critically evaluate the challenge posed to the Humean "Best System Account" (BSA) of laws of nature by the following scenario:  
  > *A world physically identical to ours except for one extra pair of causally isolated particles in a distant region, arranged such that a different set of axioms now optimizes the balance of simplicity, strength, and fit against the totality of non-nomic facts. On the BSA, the laws (and thus which generalizations are nomic) differ from ours—despite no local changes to our cosmic neighborhood.*  

  Your essay must:  
  1. **Precisely articulate** the Humean BSA’s criteria (simplicity, strength, fit) and explain **why it entails that lawhood depends on globally distributed facts**, including causally isolated events.  
  2. **Defend the Humean response**: Explain what the Humean must concede about the scenario (e.g., the non-locality of lawhood), and how they can still maintain that laws support counterfactuals (e.g., "If I dropped this cup, it would fall") and explanations (e.g., why the cup fell) in practice.  
  3. **Press the Anti-Humean**: Argue that a rival *governing* or *necessitation* view (e.g., Armstrong, Maudlin), which treats laws as local intrinsic features, faces a *mirror-image problem*: How can a local necessitating relation secure (a) the *global scope* of laws (e.g., governing distant galaxies) and (b) the truth of *uninstantiated laws* (e.g., "If mass were 10^30 kg, gravity would behave thus")? Does "necessitation" add explanatory value beyond the regularity itself?  
  4. **Diagnose the dispute**: What deeper metaphysical or explanatory commitments divide these views? What would constitute progress in resolving this debate?  

  ---

  ### **Model Answer (≈800 words)**  
  #### **I. The BSA’s Global Dependence**  
  The Humean Best System Account (BSA) defines laws as axioms in the deductive system that optimally balances *simplicity* (logical economy), *strength* (informational breadth), and *fit* (accuracy to actual events). Crucially, "optimal balance" is assessed against the *entire Humean mosaic*—the complete distribution of non-nomic facts across spacetime. This makes lawhood *global*: adding even two causally isolated particles alters the mosaic, potentially tipping the balance toward a new "best" system. For instance, the new particles might resolve a previous tie between candidate systems, or slightly improve fit for a complex system that now outweighs a simpler rival. Thus, whether "F=ma" is a law depends on the cosmic whole—including events arbitrarily distant.  

  #### **II. Humean Concessions and Defenses**  
  The Humean must concede that laws supervene on the global mosaic and lack locality. In the scenario, *our* local counterfactuals (e.g., "This cup would fall if dropped") remain true *in practice* because the local mosaic is unchanged. The BSA treats laws as summaries of patterns; since local patterns are identical, the *inferential and predictive utility* of laws is preserved locally. Explanations (e.g., "The cup fell because of gravity") are upheld pragmatically: they cite locally stable patterns embedded in the global system. However, the Humean cannot claim that laws *govern* or *enforce* outcomes—they describe, not prescribe. The concession is that laws are metaphysically "cheap" but epistemically functional.  

  #### **III. The Anti-Humean’s Mirror-Image Problem**  
  Anti-Humeans (e.g., Armstrong) posit laws as irreducible, local necessitation relations between universals. Yet this faces two challenges:  
  - **Global Scope**: If laws are local relations (e.g., between mass and spacetime curvature *here*), how do they bind causally disconnected regions? Positing identical necessitation relations everywhere (e.g., "N(F,G)" for all spacetime) invokes a *cosmological coincidence*—begging the question of why necessitation is uniform. The Humean explains uniformity via the mosaic’s patterns; the Anti-Humean must either accept brute uniformity or add meta-laws (risking regress).  
  - **Uninstantiated Laws**: Laws often cover non-actual scenarios (e.g., Newtonian gravity for superluminal masses). For Anti-Humeans, uninstantiated laws cannot be necessitation relations (no relata!), forcing abstracta or powers. Yet this divorces laws from their "world-making" role. Worse, necessitation adds no explanatory value: saying "N(F,G) *makes* Fs follow Gs" is circular—it merely labels the regularity. The Humean regularity alone suffices for prediction.  

  #### **IV. Diagnosis: What the Dispute is Really About**  
  The core conflict concerns **ontological parsimony vs. explanatory ambition**. Humeans prioritize a sparse ontology (only the mosaic) and view laws as epistemological tools. Anti-Humeans demand laws that *ground* regularities metaphysically. Progress requires resolving two questions:  
  1. **Meta-Laws**: Can either view explain *why* laws are stable across time/space without circularity?  
  2. **Explanation**: Does citing a "necessitating relation" (vs. a pattern) answer *why*-questions more deeply?  
  Until these are settled, the debate hinges on whether we value ontological economy (Humeanism) or intuitive "oomph" (Anti-Humeanism). The disagreement is substantive—not verbal—as it alters what counts as a complete explanation of nature.  

  ---

  ### **Marking Scheme (20 marks total)**  
  **Must-hit points (4 marks each):**  
  1. **BSA’s globality derived**  
     *Explanation:* Correctly identifies simplicity/strength/fit as criteria and shows how optimization *requires* global supervenience (e.g., distant events alter fit/balance).  
     *Common failure:* Asserts globality without deriving it from optimization logic.  

  2. **Humean concession + defense**  
     *Explanation:* Concedes non-locality of lawhood but defends local explanatory utility via pattern stability.  
     *Common failure:* Claims Humeans can ignore distant events or overstates their explanatory loss.  

  3. **Anti-Humean global scope challenge**  
     *Explanation:* Presses how local necessitation fails to secure uniform application across space without brute uniformity/meta-laws.  
     *Common failure:* Only targets uninstantiated laws or conflates scope with epistemology.  

  4. **Anti-Humean explanation challenge**  
     *Explanation:* Argues that "necessitation" is circular/explanatorily idle for regularities and unhelpful for uninstantiated cases.  
     *Common failure:* Asserts Anti-Humeanism "obviously" explains more without argument.  

  5. **Diagnosis of dispute + progress**  
     *Explanation:* Identifies ontological vs. explanatory priorities and proposes non-circular accounts of stability or meta-laws as progress.  
     *Common failure:* Calls dispute "verbal" without argument or offers no concrete path forward.  

  #### **Grading Standard**  
  - **A (16–20 marks)**: Derives BSA’s globality (not asserts it); symmetrically pressures both views; concludes with a defensible, argued diagnosis of the dispute’s core and conditions for progress.  
  - **B (12–15 marks)**: Correctly names positions and central objections but may assert globality, treat one side as obviously correct, miss symmetry, or conclude superficially (e.g., "disagreement is verbal").  
  - **C (8–11 marks)**: Incomplete/confused BSA explanation; imbalanced critique; diagnosis absent or unargued.  
  - **D/F (0–7 marks)**: Major errors (e.g., misdefining BSA), minimal engagement with the scenario, or missing >2 key points.  

  ---  
  This structure forces students to inhabit both perspectives rigorously while highlighting the trade-offs intrinsic to metaphysical theorizing. The marking scheme rewards depth, symmetry, and metacognitive reflection—precisely the skills an upper-level seminar should cultivate.
