prompt: |-
  I've been reading Pascal's Pensées in a reading group -- we've got to the fragments on justice and force, where he keeps circling the thought that justice without force is impotent and force without justice is tyrannical, and that since nobody could make either one complete on its own, people have settled for pairing them and calling the result legitimate. What I can't get out of my head is a pattern I keep meeting everywhere else, which I suspect is the same thing in a different dress, and I want to know whether it already has a name before I go inventing one. It goes like this: an institution is defending some rule, and it has two props, one of force and one of justice, and it never leans on both at once -- it alternates. Ask "why should anyone obey this?" and you get the justice prop: because the rule is fair, it treats everyone alike, it protects the vulnerable. Push back that the fairness is contested -- that reasonable people read the same facts the other way -- and the justice prop is quietly set down and the force prop picked up: well, it is the rule, it has been settled, and it will be enforced. Push on that -- settled by whom, enforced on what authority -- and you're handed back the justice prop again. The two are never on the table together, and each one only ever appears once the other has been knocked away. I can see the family resemblance to circular reasoning and to the is/ought gap, and I know legal theorists have spilled a great deal of ink on whether validity rests on enactment or on merit, but neither of those seems to be quite what I'm pointing at, because the thing I'm after is not that the justification is bad -- it's the specific choreography, the taking-turns, the fact that each prop is brought out precisely to cover the absence of the other and is then put away before it can be examined. Is there an established name for this move, or for the structure it presupposes -- that legitimacy is whatever holds when neither justice nor force will bear the weight alone? If there is one, I'd like to know how it is distinguished from mere circularity, from the positivist/natural-law dispute, and from the general observation that power dresses itself up as right; if there isn't, I'd like a term coined and defined, with the boundaries marked out -- what would count as the same move in a case where only one prop is ever in play, and what would count as a case that looks similar but isn't. Please don't stop at a label: what I actually want is the carving, the precise statement of what this thing is, what it is not, and where its edges lie. Write it in British English, and end the answer with a single line beginning "Verdict:" that gives the name or the coined term, followed by no more than fifteen words.
reasoning: |-
  Hmm, the user is grappling with a fascinating insight from Pascal's Pensées about justice and force being interdependent. They've noticed a pattern in institutional behavior where justifications alternate between appeals to fairness and assertions of authority whenever challenged. 

  This feels like a sophisticated observation about the mechanics of legitimacy. The user isn't satisfied with existing frameworks like circular reasoning or the natural law/positivism debate—they're zeroing in on the choreography of the switch itself. 

  Key distinctions to make: it's not just that institutions use both arguments, but that they deploy them sequentially as fail-safes. When justice claims face scrutiny, institutions pivot to force ("it's the law"), and when force is questioned, they revert to justice ("it's fair"). The props are never examined simultaneously. 

  This reminds me of legal pluralism theories and Cover's concept of "jurisgenesis," but more fluid. Also echoes Goffman's frame analysis in how institutions shift rhetorical registers. The closest established concept might be "legitimation switching," though I haven't seen it precisely defined this way. 

  For coining: "Dialectical Shielding" captures the adversarial toggling, while "Legitimacy Alternation" is more descriptive. "Fail-Safe Justification" emphasizes the backup function. 

  Boundaries matter: It's not hypocrisy (which implies deception) nor pluralism (which acknowledges coexistence). The core is the defensive substitution when one foundation cracks. Cases with only one prop (pure authoritarianism or idealistic movements) wouldn't qualify. 

  Verdict requires British English and a punchy summation. "Legitimacy Alternation" seems most precise for the pattern, with the definition emphasizing the tactical substitution.
answer: |-
  Your observation captures a specific, sophisticated mechanism of institutional justification—one that sits at the intersection of political philosophy, legal theory, and rhetoric. While echoes exist in several concepts, the precise **choreography of alternating justifications** lacks a universally established name. It is distinct from related ideas:

  1.  **Distinct from Circular Reasoning:** Circularity (e.g., "The rule is just because it's the rule") directly assumes what it proves. Your pattern involves *sequential substitution*, not circular dependency. Each prop offers a *different* type of justification, deployed only when the other is undermined.
  2.  **Distinct from the Positivist/Natural Law Debate:** This is a substantive dispute about the *source* of validity (enactment vs. morality). Your pattern is a *rhetorical/pragmatic strategy* employed *regardless* of the underlying theory. An institution can use this tactic whether it leans positivist or naturalist internally.
  3.  **Distinct from Mere Hypocrisy/Machtpolitik:** While power often cloaks itself in right, your pattern highlights the *structured, defensive alternation* between the cloak and the club when challenged, a specific dance beyond simple disguise.
  4.  **Distinct from Pluralist Justification:** This occurs when multiple justifications are offered *simultaneously* to bolster legitimacy ("It's fair *and* legal *and* efficient"). Your pattern is defined by the *mutual exclusivity* and *reactive substitution* of the props.

  **The Coined Term & Definition:**

  **Legitimacy Alternation** (n.): The institutional rhetorical strategy wherein claims to legitimacy defensively alternate between appeals to inherent justice/morality ("justice-prop") and appeals to settled authority/coercive power ("force-prop"), such that each prop is invoked *only* to counter challenges to the other, and never simultaneously subjected to scrutiny together. This creates a fail-safe justificatory loop resistant to critique by isolating the grounds of defense.

  **Boundaries & Demarcation:**

  *   **What it IS:**
      *   A *dynamic, sequential* process triggered by challenge.
      *   Characterised by the *exclusive deployment* of one prop when the other is under attack ("knocked away").
      *   Reliant on the props being *conceptually distinct types* of justification (moral vs. authoritative/coercive).
      *   Aimed at preserving institutional legitimacy by *shifting the justificatory ground*.
  *   **What it is NOT:**
      *   **A Single Prop Justification:** If an institution *only* ever uses force ("Obey or else!") or *only* ever uses justice ("It's simply right, regardless of enforcement") without switching when challenged on those grounds, it is not Legitimacy Alternation.
      *   **Simultaneous Pluralism:** Offering both justifications concurrently ("It's fair *and* it's the law we enforce") is a different strategy, even if vulnerable to separate critiques.
      *   **Circularity:** "The rule is just because it is the rule" is logically circular. Legitimacy Alternation is pragmatically evasive.
      *   **Simple Evolution:** Developing a *new* justification in response to critique isn't the same as toggling between two pre-existing, conceptually distinct props.
      *   **Internal Consistency:** The pattern doesn't require the institution itself to believe in either prop; it's about the external justification offered to subjects/critics.
  *   **Similar but Distinct:**
      *   **"Because I said so" Parent:** Uses only the force-prop (authority) when challenged on the justice-prop ("Why?"). Lacks the switch *back* to justice if authority is questioned. Not full Alternation.
      *   **Revolutionary Movement:** May start with pure justice-prop ("The regime is unjust!") but upon gaining power *might* adopt Alternation ("Our laws are just... and we enforce them"). The initial phase lacks the alternating dynamic.
      *   **Legal Formalism (Extreme Positivism):** Relies solely on the force-prop (enacted validity/enforcement) and dismisses justice challenges as irrelevant. No alternation occurs.

  **Verdict:** Legitimacy Alternation: the defensive, sequential substitution of justice and force claims to preserve institutional authority.
