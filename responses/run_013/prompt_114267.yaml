prompt: |-
  I retired two years ago after forty years of protein crystallography, and since I'm not running a lab anymore I've been sitting in on the philosophy department's evening seminars, which is how I got into a week-long argument with a grad student about tipping. She gave me this and I've been chewing on it ever since. I've cleaned it up into steps because she insisted.

  (1) A convention, in the standard philosophical sense, is just a regularity that a group follows, expects everyone else to follow, and prefers to follow given that the others do. Queuing in Britain, twenty percent in an American restaurant, standing on the right of the escalator, not walking into an empty street against the light.
  (2) Nothing in that description says the convention has to be a good idea, or fair, or efficient. It's just what everyone does and what everyone expects.
  (3) When I break one as a visitor — I don't tip, I cut the queue, I cross against the light on an empty street — I impose a foreseeable cost on the locals. The server is out money, the queue gets less predictable, people have to watch me to guess what I'll do next.
  (4) Imposing a foreseeable cost on people who aren't doing anything to me, for no reason beyond my own convenience, is wrong.
  (5) So when I'm in Rome I do as the Romans do, not because the Roman practice is better, but because the expectation is there and stepping on it costs somebody something.
  (6) But nothing in (3) or (4) cares about the border. If expectations are what generate the obligation, they generate it at home too. The guy who doesn't tip at his own diner, my neighbor who jaywalks on his own street — same costs, same kinds of people.
  (7) And it goes further. If the expectation does the work, then any convention enough people hold is binding, including ones I'd call rotten — a town where everyone expects to hand the building inspector an envelope, an office where everyone expects the women to make the coffee. And nobody could ever reform anything from the inside, since the reformer is by definition the one who breaks the expectation. Every reformer is a queue-jumper.
  (8) So either conventions aren't obligations at all, or visitors are bound and locals aren't, or every convention binds everyone, bad ones included.

  I can't accept (8). I'd most like to keep (4) — stiffing a waitress who's making two dollars an hour plus tips seems to me plainly wrong, and I don't want a theory that says it's fine as long as it's a Tuesday and I'm home. So which step do I give up, and what does giving it up cost me?

  What I actually want out of this: what does the visitor owe that the local doesn't, if anything? Does the answer come out different for the queue than for the tip? My econ colleague says the queue is a coordination problem and the tip is a price, and that they aren't the same animal at all — if that's the move, spell it out, because I don't see how coordination problem does any moral work by itself. A seminar-mate mumbled something about fair play, that you're bound once you've taken the benefits of a cooperative scheme, and then said the whole thing collapses because nobody asked for the benefits. Is that a real distinction or a restatement of the problem? And I keep feeling there's a word doing quiet work in (3) and (4) that I haven't pinned down — tell me if that's the flaw or just what obligation is.
reasoning: |-
  Okay, let's tackle this step by step. The user is a retired protein crystallographer who's now engaging with philosophy seminars. They've been presented with an argument about conventions and moral obligations, specifically around tipping and queuing, and they're struggling with the implications. 

  First, I need to understand the core tension in their query. They want to reject the conclusion (point 8) that either conventions aren't obligations, or visitors are bound but locals aren't, or all conventions bind everyone—including bad ones. They especially want to uphold the wrongness of stiffing a waitress (point 4) but see how that leads to problematic conclusions when applied universally. 

  Hmm... The grad student's argument is clever in how it exposes the slippery slope of convention-based obligations. The key pressure points seem to be:
  - The "expectation does all the work" premise (point 7) that would condemn reformers
  - The lack of distinction between visitor/local in the cost-imposition logic (point 6)
  - Their intuition that some conventions (like tipping underpaid workers) feel morally different from others (like bribes or sexist norms)

  The user's specific requests are sharp:
  1. What does a visitor owe that a local doesn't? 
  2. Is queuing fundamentally different from tipping? 
  3. Is "fair play" a viable solution? 
  4. Is there a hidden word in points 3/4 doing heavy lifting?

  Let me unpack the econ colleague's point first. Calling queuing a "coordination problem" and tipping a "price" is technically accurate but incomplete. Coordination problems (like escalator sides) rely entirely on mutual expectation—there's no intrinsic moral value to standing left vs. right. But tipping in the US context isn't just coordination; it's a wage subsidy. The moral weight comes from the worker's dependency, not the convention itself. That distinction matters. 

  The "fair play" objection (benefits received without consent) is real but fixable. If you voluntarily enter a system (e.g., dining at a sit-down restaurant), you arguably accept its rules—implied consent. But queuing? You don't "opt in" to public sidewalks. And corrupt systems? Participation might be coerced. So consent and voluntariness could be key filters.

  Ah—and the user's hunch about a "quiet word" in points 3/4 is brilliant. "Foreseeable cost" is doing enormous work. But not all costs are equal! The waitress loses actual livelihood; the queue suffers minor inconvenience; the jaywalker causes momentary alarm. The grad student's argument flattens these into "costs" indiscriminately. 

  My proposed solution would be:
  - Keep point 4's core (don't harm others for convenience) but add nuance: weigh the cost's severity and the system's justice.
  - Distinguish conventions by their moral substance. Tipping binds because of worker vulnerability; queuing binds weakly as social lubricant; bribes shouldn't bind at all.
  - Visitors might have stronger duty when ignorance isn't plausible (you can't pretend not to know US tipping) but locals can challenge corrupt norms from within.

  The user's protein crystallography background makes me think they'll appreciate structural reasoning: conventions as crystallized social structures, where breaking them causes friction. But not all crystals are equally stable—or ethical. Some deserve dissolution. 

  I should also validate their unease about "obligation" being too blunt. Moral philosophy often struggles with context collapse. The answer might be: visitors owe compliance when the cost of confusion is high and the norm is benign; locals owe reform when the norm is harmful. But that needs careful scaffolding...
answer: |-
  You've hit on a profound tension in moral philosophy—how social conventions generate obligations without collapsing into moral relativism or paralyzing reform. The grad student's argument is clever but overreaches. Here's how to dismantle it while preserving your intuition about tipping:

  ### The Core Flaw: Equating All "Costs"
  The quiet workhorse in (3) and (4) is **"foreseeable cost."** The argument treats all costs as morally equivalent, but they aren't. We must distinguish:
  - **Material deprivation** (server losing wages they rely on)
  - **Trivial inconvenience** (queue disruption)
  - **Moral complicity** (upholding bribes/sexism)
  - **Psychological discomfort** (people "watching you" jaywalk)

  **Tipping in the US** involves *material harm to vulnerable individuals* due to an unjust system. **Queue-jumping** causes mild coordination inefficiency. **Bribes/sexist norms** perpetuate systemic injustice. Grading these costs is essential.

  ### Where to Break the Argument
  **Reject premise (4) as stated.** It's too broad. Instead:
  > *"Imposing a* ***substantial, unjustified cost*** *on others for mere convenience is wrong."*

  **Why this saves your intuition:**
  - Stiffing a server causes *substantial material harm* within a system where tips are de facto wages.
  - Cutting a queue causes minor inefficiency, not substantial harm.
  - Refusing a bribe (or sexist task) may impose *psychological* "costs" on corrupt actors but avoids *complicity in injustice*.

  **What it costs you:** You must articulate why some costs matter more than others. This isn't ad hoc—it draws on:
  - **Vulnerability**: Workers depend on tips; bureaucrats don't depend on bribes.
  - **Baseline fairness**: Tips offset employer exploitation; bribes exploit citizens.
  - **Exit options**: You can avoid restaurants (voluntary participation) but not public sidewalks.

  ---

  ### Visitor vs. Local Obligations
  | **Convention Type** | **Visitor Obligation**                     | **Local Obligation**                       |
  |---------------------|-------------------------------------------|-------------------------------------------|
  | **Tipping (US)**    | Strong: Ignorance is no excuse; harm is immediate. | Strong, **plus** duty to advocate for systemic change. |
  | **Queuing**         | Moderate: Avoid disruption; low-stakes coordination. | Weak: Jaywalking when empty imposes negligible cost. |
  | **Bribes/Sexism**   | None: Compliance perpetuates harm.        | Negative: Duty to *break* the convention. |

  **Why the difference?**  
  - Visitors owe **procedural deference** to avoid chaos/harm but lack **civic responsibility** for reform.
  - Locals have **democratic agency**: They can challenge norms *because* they share in the collective responsibility for maintaining them.

  ---

  ### Coordination vs. Price: Your Econ Colleague's Point
  They're half-right, but it needs moral scaffolding:
  - **Queuing is pure coordination**: No *inherent* moral value. Efficiency is the sole good. Your jaywalking imposes trivial transaction costs.
  - **Tipping is a hybrid institution**: It's a *de facto price* (substituting for wages) *disguised as coordination*. Breaking it isn't just inefficient—it's **exploitation** because the worker bears the cost.

  **Why this matters morally**:  
  - In coordination problems, obligations dissolve when coordination is unnecessary (empty street).  
  - In price systems, obligations bind because real resources change hands. Tipping isn't *just* convention—it's a **voluntary transfer system** you enter by using the service.

  ---

  ### "Fair Play" and the Benefits Problem
  The seminar-mate's "fair play" theory (you benefit, so you comply) *can* work if refined:  
  1. **Tipping**: By dining in, you **voluntarily accept the service**, knowing the tip is the server's wage. Benefit (meal) + vulnerability (worker) = obligation.  
  2. **Queuing**: Benefit (public order) is non-excludable. You haven't *voluntarily* accepted anything, so obligation is weaker.  
  3. **Bribes**: The "benefit" (permits) is corrupt. No obligation to participate.  

  **This avoids collapse**: Voluntariness and justice filter which "benefits" generate obligations.

  ---

  ### The Reform Dilemma: Solved
  Breaking harmful conventions isn't "queue-jumping" because:  
  - **Intent**: Reformers aim to *replace* the norm, not exploit it.  
  - **Cost-bearing**: True reformers accept backlash (e.g., fines for jaywalking to prove point) rather than imposing costs *on victims*.  
  - **Scale**: One person violating a bribe system doesn't collapse social coordination—it challenges corruption.

  ---

  ### Your Practical Resolution
  1. **Tipping (US)**: Always tip. The harm to workers is direct and material. Your obligation as visitor *or* local is identical here.  
  2. **Queuing**: Follow as visitor to avoid confusion; as local, jaywalking on empty streets is morally neutral.  
  3. **Bribes/Sexism**: Neither visitor nor local is obligated. In fact, complying is wrong.  

  **Philosophical payoff**: Social conventions *can* create obligations, but only when:  
  - They prevent harm/vulnerability  
  - They're reasonably just  
  - Your participation is voluntary  

  The grad student's error was reducing all conventions to *coordination*. But conventions embed **power, vulnerability, and history**—and morality lives there.

  *Final thought: Your protein crystallography instinct to find structure in complexity serves you well. This isn't just about tipping—it's about how norms crystallize into obligations under pressure of human need.*
