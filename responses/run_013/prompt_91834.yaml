prompt: |-
  Ok so some context: I'm a philosophy prof (metaethics, mostly) and for the last few years I've also sat on the clinical ethics committee at the teaching hospital attached to our med school. We get maybe four or five consults a month — someone on the team pages us, we get 45 minutes in a room with the chart and whoever bothered to show up, and we have to hand the chair something in writing that he signs off on. Our current method is embarassing: it's basically the four principles everyone memorized in med school (autonomy, beneficence, non-maleficence, justice) plus a lot of throat-clearing, and then we all vote. Meanwhile I've been teaching the particularist line in my grad seminar — Dancy and co., the idea that there are no defensible moral principles at all, that what a feature counts for depends on the whole case it's embedded in — and it's kind of wrecked me, because a good chunk of our consults are exactly the cases where the principles point one way and the situation, looked at properly, seems to point another. A colleague floated something at a workshop that I keep chewing on: she says the way to have your cake and eat it is to treat principles as reminders rather than rulers — they don't decide anything, they just make you notice a feature you'd otherwise have walked past. I want to know if that can actually be turned into something my committee can run, or if it's just a nice slogan.

  So: write me a decision procedure for the committee, grounded in whatever the particularism/generalism literature actually establishes (not the cartoon version where particularists are just people who hate rules), but usable by clinicians who have never read any of it and have 45 minutes and an incomplete chart. The questions to ask, in order; what counts as a sufficient answer to each; which steps are just there to make us slow down; and — this part matters — the points where the procedure has to stop and hand the decision to a person, because the thing left over is a values call and not a fact we could look up. It should survive the cases where we can't get the patient's story (unconscious patient, no family, no advance directive) and the cases where the patient's stated wish and their actual situation pull apart. Then run it on three consults: (1) a competent adult refusing a standard, effective treatment on religious grounds, with the team pushing hard to override; (2) a family asking us to withhold the diagnosis from the patient, which is normal where they're from; (3) a patient who's been verbally abusive to the nursing staff and wants to refuse something, where I'll be honest that my gut is not neutral about him and I want the procedure to catch me doing that, even if what it tells me is something I won't like. Be straight with me about where this thing will misfire and what it simply can't do — I'd rather have a procedure with a visible hole in it than one that pretends to cover everything.

  Format it like this, with these section headings in this order: start with a section called Bottom line, three sentences max, saying whether the reminders-not-rulers thing survives contact with an actual committee and what the biggest caveat is. Then The tension, about 150 words, on what the particularist is actually claiming and what a procedure would have to give up to be particularist-compatible. Then The procedure, numbered steps, roughly 600 words, each step with what counts as a sufficient answer and a flag on whether it's doing work or just slowing us down. Then Stops and hand-offs, about 200 words, on the places the procedure must end in a human decision. Then the three worked cases, about 200 words each, each ending with what the procedure says and whether that's a verdict or a hand-off. Then What this can't do, about 150 words. And at the very end, a Cheat sheet I could laminate — the whole thing in under ten lines, phrased for a surgeon who's already annoyed at me.
reasoning: |-
  Okay, let me start by really understanding what this philosophy professor needs. They're a metaethics expert working on a clinical ethics committee, and they're frustrated with the current four-principles approach. They've been teaching moral particularism—Dancy's idea that moral decisions depend entirely on context, with no fixed principles—and now find it clashes with their committee work. Their colleague suggested treating principles as "reminders not rulers," and they want to know if this can be turned into a practical decision procedure for their committee.

  The user’s scenario involves real-world constraints: 45-minute consults, incomplete charts, clinicians with no philosophy background. They need a step-by-step process that handles tough cases like treatment refusals, family requests for nondisclosure, and biased reactions to difficult patients. The procedure must explicitly flag where decisions revert to human judgment and admit its limitations.

  Key challenges to address:
  - **Particularism Compatibility**: The procedure must avoid treating principles as decisive rules while still using them to highlight relevant features. Need to draw from Dancy’s core arguments holism and reasons atomism.
  - **Usability**: Steps should be clear, sequential, and jargon-free. Include "slowing down" steps to counter snap judgments.
  - **Handling Gaps**: Must work with missing patient narratives (e.g., unconscious patients) and value conflicts.
  - **Bias Mitigation**: Explicit mechanisms to catch gut reactions, like in the abusive patient case.
  - **Transparency**: Clearly labeled "hand-off" points where values choices are unavoidable.

  For **The Procedure** section, I’ll structure it as numbered steps with:
  1. **Focus**: What the step aims to uncover.
  2. **Sufficient Answer**: Clear criteria for moving forward.
  3. **Work/Slow Down**: Whether it generates insights or creates deliberation space.

  **Hand-off Points** will highlight irreducibly normative choices:
  - When competing features can’t be objectively weighted.
  - When cultural/religious values conflict with institutional norms.
  - Where harm thresholds involve value judgments.

  For the **Worked Cases**:
  1. **Treatment Refusal**: Autonomy reminder triggers, but procedure forces scrutiny of team’s "beneficence" urgency. Hand-off on harm threshold.
  2. **Nondisclosure Request**: Justice/autonomy reminders highlight cultural tension. Hand-off on whether to prioritize family norms.
  3. **Abusive Patient**: Slow-down steps expose bias; non-maleficence reminder checks punitive impulses. Verdict may still favor refusal if competent.

  **Limitations** to stress:
  - Can’t resolve deep value conflicts (e.g., sanctity vs. quality of life).
  - Useless if stakeholders lie or key facts are missing.
  - Requires committee’s diverse composition to function.

  The **Cheat Sheet** will distill this into surgeon-friendly bullets: ask specific questions, note conflicts, admit when it’s a judgment call. Phrases like "Argue it out here" keep it practical.

  Biggest caveat in **Bottom Line**: This framework prevents hasty principle-matching but can’t eliminate value judgments—it just makes them visible.
answer: |-
  ### Bottom Line
  Yes, "reminders not rulers" survives committee use: it forces engagement with concrete details while using principles to flag *what* to scrutinize, not *how* to decide. The biggest caveat is that it cannot resolve deep value conflicts—it only structures debate until a human judgment is unavoidable. Expect friction when clinicians want algorithmic answers.

  ### The Tension (150 words)
  Particularism (e.g., Jonathan Dancy) contends moral reasons are *holistic*: a feature (e.g., "lying") that counts against an act in one context might count for it in another ("deceiving a murderer"). Principles like autonomy aren't false but are defeasible—they highlight potentially salient features without dictating outcomes. A procedure must therefore: (1) *delay* principle application until context is mapped, (2) treat principles as *heuristic prompts* to identify features, not verdicts, and (3) accept that no rule can fully prescribe how features interact. This sacrifices the illusion of principled "vote-ready" outputs but counters misapplying abstract rules to complex cases. It demands committee members articulate *why* a feature matters *here*, not just that it exists.

  ### The Procedure (600 words)  
  *Steps 1–4 gather context. Steps 5–7 use principles as reminders. Steps 8–9 integrate/synthesize. "Sufficient answer" means moving to next step.*  

  1. **State the clinical question**: "What exactly are we being asked to decide?"  
     *Sufficient answer*: A specific, action-oriented question (e.g., "Should we override Mr. X’s refusal of transfusion?").  
     *Work/Slow down?*: Work. Prevents vague queries.  

  2. **Map the facts**: "What do we know? What’s unknown? What’s disputed?"  
     *Sufficient answer*: Listed key facts (clinical, social, procedural), unknowns, and disagreements. Exclude interpretations (e.g., "Patient is irrational").  
     *Work/Slow down?*: Work. Forces grounding in evidence.  

  3. **Identify stakeholders**: "Who is affected? Who speaks for the patient? What are their core interests?"  
     *Sufficient answer*: Named parties (patient, family, team, institution), their stakes, and legitimacy of surrogates.  
     *Work/Slow down?*: Work. Clarifies who matters and why.  

  4. **Restate the dilemma**: "Why is this hard? What values feel like they’re clashing?"  
     *Sufficient answer*: A concise tension statement (e.g., "Family’s cultural norm vs. patient’s possible right to know"). No principles yet.  
     *Work/Slow down?*: Slow down. Builds shared understanding.  

  5. **Apply reminder prompts (Principles as heuristics)**:  
     *Rotate through principles as checklists—not to resolve, but to ask:*  
     - **Autonomy**: "What does the patient want? Are there barriers to their choice (coercion, comprehension, capacity)?"  
     - **Beneficence/Non-maleficence**: "What harms are imminent? What benefits are possible? To whom?"  
     - **Justice**: "Are burdens/benefits distributed fairly? Are procedural rules (e.g., visitation) applied consistently?"  
     *Sufficient answer*: For each, list *features* the principle highlights (e.g., "Autonomy reminds us: patient refused clearly; Beneficence: death risk without treatment").  
     *Work/Slow down?*: Work. Forces attention to overlooked features.  

  6. **Contextualize features**: "Does this feature’s moral weight change here? Why?"  
     *Sufficient answer*: Brief rationale for why a feature matters more/less in this case (e.g., "Harm is high *because* alternatives exist" or "Autonomy is weaker *because* refusal stems from misinformation").  
     *Work/Slow down?*: Work. Embeds particularism—evaluates valence in context.  

  7. **Spot biases**: "Are we reacting to irrelevant factors? (e.g., dislike of patient, team pressure)".  
     *Sufficient answer*: Named potential biases and their likely influence.  
     *Work/Slow down?*: Slow down. Counters gut reactions.  

  8. **Synthesize**: "What reasons *for* and *against* each option survive steps 5–7? Which are strongest here?"  
     *Sufficient answer*: Ranked reasons (e.g., "Top reason for overriding: high harm. Top against: refusal is competent").  
     *Work/Slow down?*: Work. Integrates analysis.  

  9. **Propose options**: "What can we actually do? (e.g., wait, negotiate, escalate)".  
     *Sufficient answer*: 2–3 actionable paths with pros/cons.  
     *Work/Slow down?*: Work. Focuses on feasibility.  

  ### Stops and Hand-offs (200 words)  
  The procedure **must stop and hand to human judgment** when:  
  1. **Feature weighting**: No fact or rule dictates *how much* one reason (e.g., autonomy) outweighs another (e.g., harm prevention) in this context. *Example*: A competent refusal of life-saving care forces a value choice about harm tolerance.  
  2. **Cultural/religious validity**: When local norms (e.g., family-centered decisions) clash with institutional defaults (e.g., individual autonomy), no test confirms which "should" prevail—only deliberation can bridge this.  
  3. **Harm threshold**: Whether a risk is "too high" to permit refusal or "acceptable" to honor autonomy hinges on subjective valuations of life/risk.  
  4. **Unresolvable uncertainty**: Key facts (e.g., "Would patient consent if aware?") remain unknowable, requiring a best-guess based on values.  
  At hand-offs, the committee debates openly ("Given X, we prioritize Y because...") and votes. The written output must flag *where* judgment was inserted.

  ---

  ### Worked Cases (200 words each)  
  **Case 1: Competent adult refusing treatment (e.g., transfusion) on religious grounds; team wants override.**  
  *Procedure path*: Step 1 clarifies the override request. Step 2 confirms capacity, refusal clarity, and clinical stakes. Step 3 notes team’s beneficence concern. Step 4 frames tension: "Clear refusal vs. preventable death." Step 5 flags autonomy (refusal is informed/voluntary) and beneficence (death risk). Step 6 contextualizes: autonomy is strong (grounded in core beliefs); harm is objective but *morally* secondary per patient’s values. Step 7 checks for bias (e.g., team’s frustration). Step 8 ranks: autonomy dominates. Step 9 options: honor refusal or negotiate alternatives.  
  *Output*: Honor refusal. Autonomy’s weight here outweighs preventable harm. *Verdict or hand-off?* **Hand-off** at Step 6—assigning weight to religious autonomy vs. physical harm is irreducibly values-based.  

  **Case 2: Family requests withholding diagnosis (e.g., advanced cancer); cultural norm, patient unaware.**  
  *Procedure path*: Step 1: "Disclose diagnosis against family’s will?" Step 2: Notes patient’s unknown preference, family’s cultural claim. Step 3: Patient’s interest in truth vs. family’s relational autonomy. Step 4: "Family’s protective intent vs. patient’s possible right to know." Step 5: Justice (fairness in access to information) and autonomy (patient’s potential self-determination) flagged. Step 6: Justice weak if disclosure causes isolation; autonomy weak if truth causes severe distress. Step 7: Checks "paternalism vs. cultural respect" bias. Step 8: Neither reason clearly stronger. Step 9: Options: disclose, withhold, or probe patient’s values indirectly.  
  *Output*: Withhold diagnosis *if* harm from disclosure is likely and severe. *Verdict or hand-off?* **Hand-off** at Step 8—balancing cultural respect against default truth-telling requires judgment.  

  **Case 3: Verbally abusive patient refusing care; clinician bias suspected.**  
  *Procedure path*: Step 1: "Honor refusal of wound care?" Step 2: Confirms refusal, notes abuse history, clinical consequence (e.g., infection risk). Step 3: Team’s resentment vs. patient’s rights. Step 4: "Refusal validity vs. staff well-being." Step 5: Autonomy (refusal) and non-maleficence (staff harm) flagged. Step 6: Abuse doesn’t void competence; staff harm is real but indirect (vs. direct clinical harm). Step 7: Explicitly names bias ("Dislike may make us minimize autonomy"). Step 8: Autonomy stronger *unless* refusal is retaliation. Step 9: Options: honor refusal with behavior contract or involve security.  
  *Output*: Honor refusal if competent; address abuse separately. *Verdict or hand-off?* **Verdict** (if competence confirmed). Bias is caught at Step 7, and abuse doesn’t alter refusal’s validity.  

  ---

  ### What This Can’t Do (150 words)  
  This procedure **fails** when:  
  - **Values are incommensurable**: It structures debate but can’t reconcile clashes like "sanctity of life" vs. "quality of life" without arbitrary choice.  
  - **Critical facts are inaccessible**: If patient preferences and surrogate legitimacy are truly unknowable (e.g., undocumented lone immigrant), guesses dominate.  
  - **Bad-faith engagement**: Clinicians lying about facts or committee members refusing introspection evade safeguards.  
  - **Systemic injustices**: It addresses single cases but can’t fix biases baked into institutional policies (e.g., discriminatory triage).  
  - **Emotional overload**: In crises, 45 minutes may be insufficient for rigorous contextualizing.  
  It *mitigates* but doesn’t *eliminate* subjectivity—hand-offs ensure this is explicit, not hidden.  

  ---

  ### Cheat Sheet (For the Annoyed Surgeon)  
  1. **What’s the actual question?** (Be specific)  
  2. **List facts/unknowns**. (No interpretation)  
  3. **Who’s affected?** (Patient, family, you)  
  4. **Why is this messy?** (No jargon)  
  5. **Scan: Autonomy? Harm? Fairness?** (Just *flag* issues)  
  6. **Why do flagged issues matter *here*?** (Context is king)  
  7. **Check your biases**. (Say them aloud)  
  8. **Weigh reasons**. (Rank 1–2 key ones)  
  9. **Pick actionable options**.  
  **STOP & ARGUE** when:  
  - Weighing harms/rights (e.g., "How much risk is too much?")  
  - Culture clashes with policy.  
  **No math, no magic—just less blind spots.**
