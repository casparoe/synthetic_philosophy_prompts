prompt: |-
  I'm taking a seminar on punishment and informal social control, and we have moved from the state's penal apparatus to the decentralized end of the subject: boycotts, disinvitations, dismissals for off-duty speech, uncoordinated pile-ons, and the quieter cases in which a publisher drops an author or a fellowship committee withdraws an offer without anyone having organized anything. Before I write the term paper I want the specification rather than a survey of positions. Write the desiderata a theory of social sanction has to meet: which cases it must get right, which distinctions it cannot collapse, and which of the usual markers of punishment — a violated rule, an authority with standing to respond, an intentional imposition of a burden, imposed because of the violation — it must treat as genuinely necessary rather than as artifacts of theorizing about states.

  The cases I care about most are these: the organized campaign against a named individual; the leaderless drift in which thousands of strangers each do something small; the refusal that is plausibly self-protection rather than punishment, as when a venue declines to book a controversial act; the sanction imposed for violating a norm the theory's own author would reject; the sanction that follows a criminal conviction, so that the person is burdened twice for one act; and the algorithmic case, in which a recommender quietly reduces a creator's reach and no one intends anything at all. Among the distinctions I would not want collapsed: sanction versus consequence, disapproval versus punishment, the standing of the sanctioner versus the merit of the complaint, and the severity of the burden versus the authority to impose it. I suspect a theory cannot at once treat these episodes as punishment — thereby earning the demands of proportion and of a chance to answer — and treat them as nothing more than exercises of rights of speech and association, which need no license. If you find such a collision, make it the payoff.

  Give exactly five numbered items and nothing else, with no introduction and no conclusion. Each item should be one or two sentences: state one requirement, name the case that forces it, say whether people who work on this would all accept the requirement or whether it is genuinely contested among them — do not present a contested requirement as the consensus — and note the collision if it cannot be held together with another.
reasoning: |-
  Hmm, the user is asking for a structured set of desiderata for a theory of social sanction. They're in a seminar on punishment and informal social control, moving from state penal systems to decentralized forms like boycotts, disinvitations, and online pile-ons. They need this for their term paper and want specific requirements rather than a survey of positions.

  The user lists several key cases they care about: organized campaigns against individuals, leaderless collective actions like online pile-ons, refusals framed as self-protection (e.g., venues declining controversial acts), sanctions for violating norms the theorist themselves would reject, sanctions after criminal convictions (double punishment), and algorithmic reductions of reach without human intent.

  They also specify important distinctions that shouldn't be collapsed: sanction vs consequence, disapproval vs punishment, the standing of the sanctioner vs merit of complaint, and severity of burden vs authority to impose it. Crucially, they suspect a tension between treating these as "punishment" (requiring proportionality and due process) versus seeing them as mere exercises of speech/association rights that need no justification.

  I need to craft five numbered items that each state: one requirement, name the case forcing it, indicate whether it's contested among scholars, and note any collisions. The items should be concise - one or two sentences each - with no introduction or conclusion.

  For the first item, I'll address the "leaderless drift" case to establish that punishment doesn't require centralized intent. This is contested since some scholars insist on intentionality.

  Second, for "self-protection refusals," I'll distinguish punishment from consequence. There's consensus that this distinction matters.

  Third, regarding sanctions for norms the theorist rejects, I'll highlight that theories must account for norm relativity without endorsing the norms. This is widely accepted.

  Fourth, for "double punishment" cases, I'll require theories to explain cumulative burdens from different sources. This is contested regarding whether informal sanctions should mirror state proportionality.

  Finally, for algorithmic sanctions, I'll tackle the absence of human intent. This is highly contested and creates collision with rights-based defenses, which is exactly the payoff the user wants regarding the tension between punishment frameworks and free association arguments.

  Each point must be precise and directly address the user's specified cases and distinctions while flagging scholarly disagreements where they exist. The algorithmic case particularly embodies their suspected collision between punishment logic and rights exercise.
answer: |-
  1.  **Must account for decentralized imposition without central authority or collective intent:** The "leaderless drift" case (e.g., spontaneous mass pile-ons) forces the theory to explain punishment absent a coordinating body or shared punitive goal. This requirement is **contested**, as some scholars insist punishment requires an identifiable punisher or collective punitive intent.
  2.  **Must distinguish punishment from mere consequence or self-protection:** The "refusal as self-protection" case (e.g., venue declining a controversial act) forces the theory to differentiate burdens imposed *as censure* for a norm violation from burdens arising incidentally from risk-avoidance or association rights. This distinction is **widely accepted** as crucial.
  3.  **Must explain the imposition of burdens based on norms the sanctioner (or theorist) rejects:** Sanctions imposed for violating a norm the *theory's author* would reject (e.g., dismissal for violating a religious doctrine the author finds unjust) force the theory to explain punishment's norm-relativity without endorsing the specific norm. Describing such cases as punishment is **generally accepted**, though their justification is contested.
  4.  **Must address cumulative burdens from distinct sanctioning sources without presuming proportionality linkage:** The "double burden" case (post-criminal conviction sanctions) forces the theory to explain burdens imposed independently by state and social actors for one act, without collapsing them or demanding overall proportionality between sources. The need to acknowledge distinct sources is **accepted**, but whether informal sanctions *should* consider prior state punishment is **contested**.
  5.  **Must resolve the collision between characterizing burdens as punishment (implying justification demands) versus mere exercises of rights (implying no justification needed), particularly without intent:** The "algorithmic case" (reach reduction without human intent) forces the theory to grapple with burdens arising from system design/rights-exercise, lacking punitive intent yet causing sanction-like effects. This requirement highlights the **fundamentally contested collision** central to the payoff: treating such acts as "punishment" demands justification (proportionality, answerability) inherently at odds with defending them as simple exercises of speech/association rights needing no license.
