answer: |-
  Here is a specification of desiderata for a theory of "what matters in survival," designed to confront key pressure points and force critical distinctions. Each entry includes motivating cases, negotiation status, and flagged incompatibilities.

  ---

  ### **Desiderata for What Matters in Survival (WMS)**

  1.  **Psychological Continuity Requirement:**
      *   **Motivation:** Cases of radical amnesia or profound psychological discontinuity (e.g., "wiped" personality replaced by another). If the future being has none of my memories, intentions, character traits, or cognitive dispositions, my anticipation/concern for *them* seems unjustified. The "wretched but continuous" case reinforces this – I anticipate *their* suffering *as mine*, despite its negativity.
      *   **Status:** Non-negotiable core for most psychological continuity theories. Bodily theorists often reject its *sufficiency* but accept its *typical* importance as a sign of identity.
      *   **Incompatibility Flags:** Tensions with Strong Bodily Requirement (#2) if bodily continuity alone defines WMS. Conflict with Epistemic Constraint (#10) under certain interpretations.

  2.  **Strong Bodily Requirement / Biological Continuity:**
      *   **Motivation:** The "gradual replacement" case (e.g., Ship of Theseus brain). If *all* my original neurons are replaced one-by-one with functionally identical substitutes, is the final being *me*? Intuitions often say no, suggesting the persistence of the original biological organism matters. Brain transplant cases (brain in new body) often feel like *I* am in the new body, highlighting the brain/body as the biological substrate.
      *   **Status:** Non-negotiable for animalist/somatic theories. Psychological theorists reject its *necessity* (e.g., teletransportation).
      *   **Incompatibility Flags:** Directly conflicts with Psychological Continuity (#1) as sufficient. Challenges Teletransportation Acceptance (#3). Severely challenged by Epistemic Constraint (#10).

  3.  **Teletransportation Acceptance:**
      *   **Motivation:** The standard teletransporter case (destruction of original, reconstruction of perfect copy elsewhere). Many find it intuitive that *they* would step into the teletransporter, anticipating the copy's future as their own. Suggests psychological continuity (+ causal connection) suffices for WMS, overriding bodily discontinuity.
      *   **Status:** Non-negotiable for pure psychological continuity theories. Rejected by bodily theories and non-branching psychological theories (#4).
      *   **Incompatibility Flags:** Directly conflicts with Strong Bodily Requirement (#2). Creates tension with Non-Branching (#4).

  4.  **Non-Branching Requirement:**
      *   **Motivation:** Fission cases (e.g., brain hemisphere transplant into two bodies, both psychologically continuous with the original). Intuition: I cannot anticipate *both* futures as fully *mine*; the relation seems diluted or altered when branching occurs. WMS seems to require a unique future path.
      *   **Status:** Crucial addition for many (e.g., Parfitian Reductionists, Perry) to handle fission. Rejected by theories advocating "co-personality" or degree-based approaches (#7) without uniqueness.
      *   **Incompatibility Flags:** Conflicts with Transitivity (#8). Challenges Symmetry (#9). Creates tension with Teletransportation Acceptance (#3) if branching is possible. Undermined by the Delayed Transmission Consent variant (#6).

  5.  **Anticipatory Self-Concern Justification:**
      *   **Motivation:** The "wretched but continuous" future being. If WMS holds, I *should* feel self-interested concern for their suffering, even if I wish it weren't so. Conversely, a future being who is happy but utterly discontinuous with me psychologically *and* biologically doesn't seem to warrant *my* self-concern.
      *   **Status:** Non-negotiable core function of WMS for all camps. Defines the explanandum.
      *   **Incompatibility Flags:** Challenges theories that divorce WMS from anticipation (rare). Tests whether Degree (#7) adequately captures the specialness of self-concern.

  6.  **Delayed Transmission Constraints:**
      *   **Motivation:** *Case A (Delay):* Transmission creates blueprint; original lives for years; *then* replica is built. Original anticipates replica's future? Replica cares about original's past? *Case B (Destruction Consent):* Replica only built *if* original consents to destruction upon replica's arrival. Does consenting make the replica "me" in a way refusing wouldn't? Tests simultaneity, causal dependence, and the role of intention/destruction.
      *   **Status:** Non-negotiable test cases introduced by the seminar. Reveals deep tensions.
      *   **Incompatibility Flags:** *Case A* challenges theories requiring simultaneity or immediate causal connection for WMS. Creates conflict between Original and Replica's perspectives. *Case B* directly challenges Non-Branching (#4) and potentially Psychological Continuity (#1) – if consent is crucial, WMS seems partly conventional/constitutive, not purely descriptive. Also challenges Epistemic Constraint (#10) for the replica.

  7.  **Admission of Degrees:**
      *   **Motivation:** Gradual replacement cases, partial amnesia, slow personality drift. Intuition: WMS might weaken gradually, not vanish abruptly. Fission suggests WMS is less than full survival for *each* branch. The wretched case might involve *some* WMS even if diminished.
      *   **Status:** Preference of Reductionist/Causal Dependence camps (e.g., Parfit). Often rejected by Non-Reductionist/Simple View/Animalist camps insisting survival is all-or-nothing.
      *   **Incompatibility Flags:** Conflicts with theories requiring an all-or-nothing relation (often linked to identity). Challenges Non-Branching (#4) – is branching a matter of *degree* of survival? Complicates Transitivity (#8).

  8.  **Transitivity:**
      *   **Motigation:** Chain Cases (A at t1 psychologically continuous with B at t2; B at t2 continuous with C at t3. Is A continuous with C?). If WMS is transitive, A should have self-concern for C. Fission chains (A splits into B & C; B later splits into D & E) create severe pressure – must A care about D and E?
      *   **Status:** Often assumed implicitly. Explicitly rejected by theories incorporating Non-Branching (#4) or Degree (#7).
      *   **Incompatibility Flags:** Directly conflicts with Non-Branching Requirement (#4). Challenged by Degree (#7) – if WMS weakens over chains.

  9.  **Symmetry (One-Many Relations):**
      *   **Motivation:** Fission cases. Can two contemporaries (B & C) *both* stand in the full WMS relation to a single past individual (A)? If WMS grounds anticipation, can A anticipate *both* B and C equally?
      *   **Status:** Rejected by theories requiring Non-Branching (#4) or uniqueness. Accepted by theories embracing "co-personality" or Degree (#7) applied symmetrically.
      *   **Incompatibility Flags:** Fundamental conflict with Non-Branching Requirement (#4). Challenges the core notion of *self*-concern if multiple futures are equally "mine".

  ### **External Constraints on the Theory**

  10. **Epistemic Constraint:**
      *   **Motivation:** WMS cannot turn on facts unknowable in principle to the agent (e.g., precise microphysical continuity, hidden historical facts unrelated to psychology/biology). An agent must be able to form rational self-concern based on accessible evidence (e.g., apparent psychological connections, bodily integrity).
      *   **Status:** Non-negotiable practical constraint. Theories violating this are pragmatically inert for guiding concern.
      *   **Incompatibility Flags:** Severely challenges Strong Bodily Requirement (#2) – how to *know* precise biological continuity? Also problematic for theories requiring specific types of causal connection unknowable to the agent.

  11. **Coherence Constraint:**
      *   **Motivation:** The theory cannot demand attitudes (e.g., total indifference between fission descendants) that a conceptually coherent agent *cannot* adopt. It must be psychologically plausible as a guide for self-concern. Fission cases are the ultimate test – can the theory tell me how to *feel* about B and C?
      *   **Status:** Non-negotiable constraint on the theory's adequacy as an explanation of *concern*.
      * **Incompatibility Flags:** Challenges theories relying solely on Non-Branching (#4) – indifference *feels* impossible. Challenges Degree (#7) – how does partial survival *feel*? Challenges Symmetry (#9) – is symmetric concern psychologically possible?

  12. **Normative Grounding Constraint:**
      *   **Motivation:** The theory must explain *why* WMS *should* matter to the agent, not just describe what it is. Why care about psychological continuity or biological persistence? The answer cannot simply be "because that's what identity/survival is" if WMS is supposed to be the ground of the normativity.
      *   **Status:** Deep philosophical challenge. Often only partially addressed. Non-Negotiable for a complete justification.
      *   **Incompatibility Flags:** Challenges any theory that takes WMS as primitive or fails to connect it to deeper values (e.g., connected experience, agency, biological function). Psychological theories often ground it in connected mental life/agency; biological theories in the persistence of the entity whose interests are at stake. The constraint forces this justification.

  ---

  ### **Key Incompatibility Clusters**

  1.  **Fission Trilemma:** Psychological Continuity (#1) + Teletransportation Acceptance (#3) + Symmetry (#9) **conflicts with** Non-Branching (#4) and Transitivity (#8). You cannot have all five simultaneously. Fission forces a choice: abandon uniqueness (accept symmetry + degree?), abandon transitivity (accept non-branching?), or abandon psychological continuity as sufficient for full WMS in branching cases.
  2.  **Body vs. Mind:** Strong Bodily Requirement (#2) **directly conflicts** with Teletransportation Acceptance (#3) and is severely strained by the Epistemic Constraint (#10).
  3.  **Non-Branching's Cost:** Non-Branching (#4) **conflicts with** Transitivity (#8), challenges Symmetry (#9), creates tension with Teletransportation Acceptance (#3), and is undermined by Delayed Transmission Consent (#6B). It struggles with the Coherence Constraint (#11).
  4.  **The All-or-Nothing vs. Degrees Divide:** Admitting Degrees (#7) **conflicts with** theories demanding WMS be all-or-nothing, complicates Transitivity (#8), and makes Non-Branching (#4) harder to define. It faces the Coherence Constraint (#11) challenge of explaining partial self-concern.
  5.  **Delayed Transmission Challenges:** Both variants (#6A & #6B) challenge assumptions about simultaneity, uniqueness, and the role of destruction/consent, creating conflicts with Psychological Continuity (#1), Non-Branching (#4), and Epistemic Constraint (#10) for the replica.

  ---

  ### **The Most Excluding Requirement**

  **The Non-Branching Requirement (#4) does the most to exclude current theories** because it is essential for handling fission intuitively but inherently conflicts with transitivity, challenges symmetry, appears ad hoc to its critics, struggles with coherence, and is uniquely vulnerable to the Delayed Transmission Consent case (#6B), forcing theories into complex and often counterintuitive positions to accommodate it.
