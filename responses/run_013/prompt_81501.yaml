prompt: |-
  Write a section of an employee handbook for a company that has adopted a formal policy of hemispheric personhood. Following a colleague's callosotomy, the company now counts each cerebral hemisphere as a separate person: two payroll entries for one body, two ballots in workplace elections, two leave balances, two consenting parties for anything that touches the shared body. Write it in flat, deadpan corporate prose — numbered clauses, definitions, a grievance procedure — and never wink at the reader. The comedy has to come from getting the science and the philosophy right: each hemisphere can perceive, learn, and respond on its own; in most patients only the left hemisphere speaks, while the right can answer only by pointing or choosing; the speaking hemisphere will confidently explain actions it did not initiate; the two hands can work at cross purposes; and patients typically report that they feel like one person and do not experience the conflicts at all. Let the clauses draw out what follows — that a non-speaking person needs a different ballot, that an explanation is not evidence of the intention behind it, that consent from one co-occupant is not consent from the other, that an employee's own testimony of being single is a preference rather than a finding — without ever settling whether there is one subject here or two. The policy should be applied consistently rather than as a strawman: someone who knows the split-brain literature should find it recognizable and fair. About 800 words. Legible to a reader who knows nothing about the research, uncomfortable for one who does.

  After the excerpt, give a JSON object with these fields: "target" (the position or practice satirized, one sentence); "clauses" (an array with one entry per clause, each entry having "clause", "finding_exploited" naming the real empirical finding or argument the joke rests on, and "commitment_presupposed" naming the philosophical thesis the clause quietly assumes); "unresolved" (the question the piece deliberately leaves open).
reasoning: |-
  We are writing a section of an employee handbook for a company that has adopted hemispheric personhood. The key is to write in flat, deadpan corporate prose, with numbered clauses, definitions, and a grievance procedure. We must never wink at the reader; the comedy comes from taking the science and philosophy seriously.

  Key scientific points to incorporate (based on split-brain research):
  - Each hemisphere can perceive, learn, and respond independently.
  - Typically, only the left hemisphere speaks (it's the "interpreter"), while the right hemisphere can only communicate non-verbally (pointing, choosing from options).
  - The speaking (left) hemisphere will often confabulate explanations for actions initiated by the right hemisphere.
  - The two hands (controlled by opposite hemispheres) can act at cross purposes.
  - Patients report feeling like one person and do not experience internal conflict.

  Philosophical points to leave unresolved:
  - Whether there is one person or two in a single body.

  The policy counts each hemisphere as a separate person, so:
  - Two payroll entries for one body.
  - Two ballots in workplace elections (but the right hemisphere can't speak, so it needs a different ballot method).
  - Two leave balances.
  - For anything touching the shared body, both must consent.

  We'll structure the handbook section with:
  1. Definitions (to clarify terms).
  2. Policy clauses (numbered, covering employment status, compensation, workplace rights, consent, etc.).
  3. Grievance procedure.

  We must draw out implications without settling the one-or-two question. For example:
  - The non-speaking person (right hemisphere) needs a different ballot (e.g., pointing to options).
  - An explanation by the speaking hemisphere is not evidence of the intention of the other hemisphere.
  - Consent from one is not consent from the other.
  - An employee's testimony of being a single person is a preference, not a finding.

  Let's outline the clauses:

  1. **Definitions**: 
     - "Employee" means each cerebral hemisphere of a split-brain individual.
     - "Body" means the shared physical body.
     - "Speaking Employee" and "Non-Speaking Employee" (with the understanding that the left is typically speaking, but leave room for exceptions).

  2. **Employment Status**:
     - Each hemisphere is a separate employee. They share one body but are distinct for all employment purposes.

  3. **Compensation and Payroll**:
     - Each employee receives separate compensation. The company will issue two payroll entries per body.

  4. **Workplace Elections and Voting**:
     - Each employee is entitled to one vote. The non-speaking employee must be provided with a means to vote non-verbally (e.g., pointing, selecting from options). The speaking employee may not vote on behalf of the non-speaking employee.

  5. **Leave and Benefits**:
     - Each employee has a separate leave balance. If one employee takes leave, the other may continue working if the body is present and capable. However, if the body is absent (e.g., on vacation), both are considered on leave.

  6. **Consent for Shared Body**:
     - Any action that involves the shared body (e.g., medical procedures, ergonomic adjustments, tattoo) requires explicit consent from both employees. Consent must be obtained independently: the speaking employee by verbal or written means, the non-speaking employee by non-verbal means (e.g., pointing to "yes" or "no").

  7. **Representation and Communication**:
     - The speaking employee may communicate on behalf of both only when explicitly authorized by the non-speaking employee (via non-verbal consent). Otherwise, the speaking employee's statements are only binding for themselves.

  8. **Performance and Conduct**:
     - Each employee is responsible for their own actions. If the hands act at cross purposes (e.g., one hand tries to work while the other disrupts), each hemisphere is accountable for the actions under their control. However, if an action is initiated by one hemisphere without the other's knowledge, the non-initiating hemisphere is not held responsible.

  9. **Dispute Between Employees Sharing a Body**:
     - If the two employees sharing a body have a dispute (e.g., one wants to work on a task and the other does not), they must attempt to resolve it internally. If unresolved, the company may require mediation. The company will not take sides in such disputes unless there is a violation of policy.

  10. **Grievance Procedure**:
      - Any grievance must be filed by the affected employee. If the non-speaking employee has a grievance, they may file by non-verbal means (with an interpreter). The company will investigate without assuming the speaking employee's account represents both.

  11. **Self-Identification**:
      - If an employee (either hemisphere) asserts that they are a single person, this will be recorded as a personal preference but does not alter the company's policy of recognizing two persons.

  We also need a grievance procedure that respects the two-employee structure.

  Let's write the handbook section accordingly, aiming for about 800 words.

