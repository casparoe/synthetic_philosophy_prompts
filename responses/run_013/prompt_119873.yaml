  Biggest referee red flags: First, claiming "nothing has been rolled back" about conditionality might be overstatement - some systems have relaxed sanctions. Second, not engaging with feminist critiques of conditionality's gendered burdens could draw fire. And third, the fraud argument needs to acknowledge that for marginalized claimants, sanctions aren't just symbolic but materially devastating.

  The verdict feels clear: this is a real distinction with empirical teeth. But claim (ii) needs armor-plating with cases, and §4's phrasing requires surgery to avoid normative dismissal. The fraud point is elegant but expendable if space is tight.

