  Hmm, the draft presents three main sections: critiquing existing theories (§1), proposing the signaling model (§2), and extending it to fraud (§3). The student raises sharp questions about originality, normative slippage, claim weighting, and falsifiability. This shows they're thinking like a theorist - they've anticipated counterarguments and want to pressure-test their framework.

  First, the "relabeling" concern needs serious attention. The signaling model does feel distinct from standard legitimacy stories because it centers on contributor psychology rather than claimant behavior or abstract norms. But I should acknowledge how close it is to "assurance game" frameworks in political economy - though since they can't check new references, naming that might not help. The key differentiator is the specific mechanism: conditionality as costly performance that maintains contributor trust.

