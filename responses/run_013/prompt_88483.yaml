     We know from history that the panel's refusals were almost never reversed. But note: under the old rule, a refusal required 6 votes for refusal (so 4 or fewer for approval). So the false negative rate under the old rule was P(Y<=4) for Binomial(10, p'). 

     Under the new rule, we refuse if Y<7, i.e., Y<=6. So the false negative rate increases. For example, if p'=0.8, then under the old rule: P(Y<=4)= binomcdf(10,0.8,4)≈0.006. Under the new rule: P(Y<=6)= binomcdf(10,0.8,6)≈0.12. 

     This is a significant increase. But note: the cost of a false refusal is lower than a false approval. And the historical reversal rate for refusals is almost zero, which suggests that the panel rarely refuses a substance that should be approved? Or that the substances they refuse are indeed unsafe. We don't know p'. 

     We can set p' to be the same as p? But they might differ. We don't have data. We accept the trade-off: we reduce false approvals at the cost of increasing false refusals, and we believe that is acceptable given the asymmetry in costs.

     The legal office might accept this because we can show that the false positive rate is reduced and that is the more costly error.

  We hope this procedure meets your needs.
