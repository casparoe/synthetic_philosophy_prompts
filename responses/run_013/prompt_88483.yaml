  ### Decision Procedure for Expert Advisory Panel Votes

  Below is a step-by-step decision procedure grounded in Condorcet's jury theorem (CJT) and its extensions, designed for binary questions with asymmetric risks. The procedure addresses deviations from CJT's ideal conditions (binary fact-based questions, competence >0.5, independent judgments) through sequential tests. It prioritizes defensibility, asymmetric error costs, and real-world constraints (1 hour/question, no statistician). Arithmetic is limited to spreadsheet-compatible calculations.

  ---

  ### **Procedure Workflow**
  **Key Inputs**:  
  - Panel size (\(n = 10\))  
  - Historical error rates (false positives: ~12.5%, false negatives: ~0%)  
  - Asymmetric costs: Wrongful approval (\(C_I\)) > Wrongful refusal (\(C_{II}\))  
  - Threshold for sub-group delegation (pre-defined by policy).

  **Output**: Recommendation (approve/refuse) or escalation to human judgment.

  #### **Step 1: Determine Question Type**  
  - **Test**: Is this a **fact-based question** (defensible ground truth) or a **value-based question** (acceptable risk)?  
    - *Fact-based*: Evidence determines a "correct" answer (e.g., "Does substance X exceed toxicity threshold Y?").  
    - *Value-based*: No objective truth (e.g., "Is risk Z acceptable?").  
  - **Procedure**:  
    - Secretariat classifies based on question framing. If value-based → **Majority vote (6/10) suffices. Stop.**  
    - If fact-based → Proceed to Step 2.  
  - **Human Judgment Required**: Secretariat must decide question type. *Cannot handle ambiguous hybrids*.

  #### **Step 2: Assess Competence**  
  - **Test**: Are panelists better than random (>50% accuracy)?  
  - **Procedure**:  
    - Use historical data:  
      - Let \(\alpha = \text{false positive rate} = 0.125\) (reversed approvals).  
      - Let \(\beta = \text{false negative rate} \approx 0\) (reversed refusals).  
    - Estimate average individual competence (\(p\)):  
      - Under CJT, \(\alpha \approx \text{probability that majority is wrong when truth = refuse}\).  
      - Solve \(P(\text{majority wrong}) = \sum_{k=\lceil n/2 \rceil}^n \binom{n}{k} (1-p)^k p^{n-k}\) for \(p\).  
      - For \(n=10\), \(\lceil n/2 \rceil = 6\):  
        \[
        \alpha = \sum_{k=6}^{10} \binom{10}{k} (1-p)^k p^{10-k} \approx 0.125
        \]  
      - Approximate \(p\) using spreadsheet solver: **\(p \approx 0.65\)** (see Table 1).  
    - If \(p > 0.5\) → **Proceed to Step 3.**  
    - If \(p \leq 0.5\) → **Delegate to sub-group or halt.** CJT fails; majority may be *less* reliable than a coin flip.  
  - **Human Judgment Required**: None beyond historical data input.  
  - **Limitations**: Assumes historical errors reflect average \(p\); cannot detect individual incompetence.

  **Table 1: False Positive Rate vs. Competence (\(n=10\))**  
  | \(p\) | 0.55 | 0.60 | 0.65 | 0.70 |  
  |-------|------|------|------|------|  
  | \(\alpha\) | 0.27 | 0.17 | 0.09 | 0.04 |  

  *(\(\alpha = 0.125\) at \(p \approx 0.62\), but conservatively use \(p=0.65\) for safety)*

  #### **Step 3: Sub-group vs. Full Panel**  
  - **Test**: Is the question below the pre-defined size threshold for sub-groups?  
  - **Procedure**:  
    - If **below threshold** → Delegate to 3-member sub-group.  
      - Sub-group votes: Approve only if **unanimous (3/3)** (CJT weak for small \(n\)).  
    - If **above threshold** → Use full panel. Proceed to Step 4.  
  - **Human Judgment Required**: Secretariat applies size threshold (pre-defined by policy).

  #### **Step 4: Mitigate Dependence**  
  - **Test**: Are judgments independent? (Dependence from shared dossiers/training inflates errors).  
  - **Procedure**:  
    - **Pre-discussion secret ballot**: Members submit initial votes *in writing* before discussion.  
      - Reduces deference to seniors/dominant voices.  
    - **Record dependence factor (\(d\))**:  
      - \(d = \text{number of shared bias sources}\). Examples:  
        - All read same dossier → \(d_{+1}\).  
        - \(\geq 5\) members from same lab → \(d_{+1}\).  
        - \(\geq 1\) member with conflict of interest → \(d_{+1}\) (e.g., co-published with applicant).  
      - Max \(d = 3\) (cap for tractability).  
    - **Adjust voting threshold**:  
      - Base threshold: Majority (6/10) for low-stakes symmetry.  
      - Asymmetric adjustment:  
        \[
        \text{Approve threshold} = \lceil 5 + 1.5 \times d \rceil \quad \text{(rounded up)}
        \]  
      - Refuse threshold remains at 6/10 (lower cost of error).  
  - **Example**:  
    - Shared dossier (\(d=1\)) + 6 members from same lab (\(d=2\)) → \(d=3\).  
    - Approve threshold = \(\lceil 5 + 1.5 \times 3 \rceil = \lceil 9.5 \rceil = 10/10\).  
  - **Human Judgment Required**: Secretariat assigns \(d\) (0–3) based on dossier/training/conflicts.

  #### **Step 5: Elicit Independent Judgments**  
  - **Procedure**:  
    - **Structured discussion**:  
      - Junior members speak first; seniors last.  
      - Secretariat enforces equal speaking time.  
    - **Final vote**: After discussion, recorded with names.  
    - **Use initial (pre-discussion) vote for decision**: Less corrupted by social influence.  
  - **Human Judgment Required**: Secretariat moderates discussion.

  #### **Step 6: Asymmetric Threshold Adjustment**  
  - **Test**: How do costs \(C_I\) (wrongful approval) and \(C_{II}\) (wrongful refusal) affect the threshold?  
  - **Procedure**:  
    - Compute cost-adjusted threshold:  
      \[
      \text{Threshold} = \begin{cases} 
        \lceil n/2 \rceil + \Delta & \text{for approval} \\
        \lceil n/2 \rceil & \text{for refusal}
      \end{cases}
      \]  
      where \(\Delta = \lfloor \log_2(C_I / C_{II}) \rfloor\) (log-scale for simplicity).  
    - **Estimate \(C_I / C_{II}\)**:  
      - Legal office provides \(C_I / C_{II}\) (e.g., \(C_I = 10 \times C_{II}\) → \(\Delta = \lfloor \log_2(10) \rfloor = 3\)).  
      - Default: Historical \(\alpha / \beta \approx 12.5\) → \(\Delta = \lfloor \log_2(12.5) \rfloor = 3\).  
    - **Final approval threshold**: \(\max(6, \lceil 5 + 1.5d \rceil) + \Delta\) (capped at 10).  
  - **Example**:  
    - \(d=1\), \(C_I / C_{II} = 12.5\) → \(\Delta = 3\) → Approve threshold = \(\lceil 5 + 1.5 \times 1 \rceil + 3 = 7 + 3 = 10/10\).  
  - **Human Judgment Required**: Legal office provides \(C_I / C_{II}\) ratio.

  #### **Step 7: Handle Marginal Votes**  
  - **Test**: Is the initial vote within 1 vote of the threshold? (e.g., 5-5, 6-4 when threshold=7).  
  - **Procedure**:  
    - If vote is marginal → **Reopen discussion focusing on dissenters' reasoning**, then revote.  
    - If still marginal → **Refuse by default** (avoids high-cost \(C_I\) errors).  
  - **Human Judgment Required**: None.

  #### **Step 8: Resolve Logical Inconsistencies**  
  - **Test**: Do premises (A, B) pass but conclusion (C) fail? (e.g., "Reliable study" + "Adverse effect" →¬"Unsafe").  
  - **Procedure**:  
    - If majority accepts all premises → **Override conclusion to "approve" if C = refuse, or vice versa**.  
    - Else → **Accept conclusion vote**.  
  - **Rationale**: Premises logically entail conclusion; dissent likely from strategic defection.  
  - **Human Judgment Required**: Secretariat identifies premise-conclusion logic.

  ---

  ### **Summary of Human Decision Points**  
  1. Classify question type (Step 1).  
  2. Assign dependence factor \(d\) (Step 4).  
  3. Moderate discussion (Step 5).  
  4. Provide \(C_I / C_{II}\) ratio (Step 6).  

  ### **What the Procedure Cannot Do**  
  - **Correct for systematic biases** (e.g., lab training blind spots).  
  - **Handle non-binary questions**.  
  - **Replace deliberation** when new evidence emerges post-vote.  
  - **Rescue a panel** with net incompetence (\(p \leq 0.5\)).  

  ---

  ### **Case Applications**
  #### **Case 1: Split-Premises Inconsistency**  
  - **Scenario**: Majority accepts "study reliable" (7-3) and "effect adverse" (6-4), but rejects "substance unsafe" (5-5).  
  - **Procedure**:  
    1. Question is fact-based → Proceed.  
    2. \(p \approx 0.65 > 0.5\) → Full panel.  
    3. \(d = 2\) (shared dossier + shared lab training).  
    4. Initial vote: 5 approve, 5 refuse.  
    5. \(C_I / C_{II} = 12.5\) → \(\Delta = 3\) → Approve threshold = \(\lceil 5 + 1.5 \times 2 \rceil + 3 = 8 + 3 = 11\) → **Capped at 10**.  
    6. Threshold = 10/10 → **Vote fails to approve** (5 < 10).  
    7. **But**: Premises pass → **Override to refuse (unsafe)**.  
  - **Result**: Refuse approval.  

  #### **Case 2: 6-4 Approval with Skewed Dissent**  
  - **Scenario**: Initial vote 6-4 approve. Dissenters: 2 seniors + 2 substance experts.  
  - **Procedure**:  
    1. Fact-based → Proceed.  
    2. \(p > 0.5\) → Full panel.  
    3. \(d = 2\) (shared dossier + 6+ from same lab).  
    4. \(C_I / C_{II} = 12.5\) → \(\Delta = 3\) → Approve threshold = \(\lceil 5 + 1.5 \times 2 \rceil + 3 = 11\) → **Capped at 10**.  
    5. Vote = 6/10 < 10 → **Refuse approval**.  
    6. Marginal? → **No** (not within 1 vote of 10).  
  - **Result**: Refuse approval despite majority.  

  #### **Case 3: Procedure vs. Secretariat's Preference (Unpopular Outcome)**  
  - **Scenario**: Initial vote 7-3 approve. Secretariat prefers approval (majority).  
    - \(d = 0\) (no dossier/training issues; no conflicts).  
    - \(C_I / C_{II} = 5\) → \(\Delta = \lfloor \log_2(5) \rfloor = 2\).  
  - **Procedure**:  
    1. Fact-based → Proceed.  
    2. Approve threshold = \(\lceil 5 + 1.5 \times 0 \rceil + 2 = 5 + 2 = 7\).  
    3. Vote = 7/10 → **Approve**.  
  - **Now alter**: Shared dossier (\(d=1\)) → Approve threshold = \(\lceil 5 + 1.5 \times 1 \rceil + 2 = 7 + 2 = 9\).  
    - Vote = 7 < 9 → **Refuse approval**.  
  - **Result**: Secretariat dislikes refusal despite a 70% majority.  
  - **Why?** Dependence (\(d=1\)) and high \(C_I\) require supermajority. Procedure prioritizes error avoidance over efficiency.  

  ---

  ### **Final Recommendation**  
  Implement this procedure with a spreadsheet template automating calculations (thresholds, \(\Delta\), \(d\)). Legal office defends it via:  
  - Explicit adjustment for dependence (\(d\)) and cost asymmetry (\(\Delta\)).  
  - Historical \(p\) estimation.  
  - Premise-override rule for logical integrity.  
  The procedure reduces high-cost errors but accepts higher refusal rates—aligning with your risk asymmetry.
