prompt: |-
  I have been trying to find a name for a conversational pattern and keep coming up empty. A question is asked; the answer given is true and does answer the question, but it is plainly not the answer that was wanted, and both parties understand that the real message lies in what was left unsaid. A landlord asked for a reference for a departing tenant writes that the tenant always paid the rent on time; a department asked about a job candidate's teaching is told that the candidate never missed a class. Nothing false is asserted, and the writer can, if challenged, insist that the sentence is true and that nothing more was meant. The hearer, meanwhile, treats the omission as the message, reasoning that the stronger and more relevant statement was withheld because it could not honestly be made. I realize that we often communicate more than we literally state, and that saying less than one could is one of the ways this happens. What I am after is the specific mechanism by which the message is carried by the hearer's recognition that a stronger statement was available and was withheld, together with the speaker's ability to retreat afterwards to the literal content without having lied. Is there an established term for this, or a small family of terms for its parts? I want the boundaries drawn and not just a label: how this differs from the ordinary business of meaning more than one says, from lying, from insinuation, and from a bare hint; whether the hearer is ever entitled to the inference or whether the speaker is right that nothing was meant; and whether it matters that the speaker can retreat precisely because what was said was true. A name would be welcome, but the carving is what I am really after.
reasoning: |-
  Okay, the user is looking for a term for a specific conversational pattern where someone answers a question truthfully but omits important information, leading the listener to infer the opposite of what was said. They want clear boundaries distinguishing this from related concepts like lying, insinuation, and implication.

  First, I recall that this pattern is common in situations like references or reviews, where the speaker avoids negative statements by highlighting neutral positives. The user mentioned examples like a landlord noting timely rent without commenting on behavior, or a professor mentioning attendance but not teaching quality. 

  The key elements here are: the literal truth of what's said, the deliberate omission of expected information, and the listener inferring the negative from what's left out. The speaker can always fall back on the literal statement if challenged. 

  I need to identify the right linguistic terms. Pragmatic inference is involved, especially Gricean maxims. The Cooperative Principle and maxims of Quantity and Relevance come to mind. When the speaker gives less information than expected (violating Quantity), it implies they can't provide the stronger, relevant statement. 

  Damning with faint praise seems close. It's a form of irony where praise is so weak it suggests criticism. But the user wants precision. Other terms: implicature, particularly negative or relevance implicature. The speaker implies by omission. 

  Meiosis (understatement) might fit, but it's broader. Paralipsis is when you mention something by saying you won't mention it, which isn't quite it. 

  The strategic retreat aspect is important. The speaker maintains plausible deniability. This ties into face-saving and politeness strategies. 

  Distinguishing from lying: here, the statement is true, so it's not a lie. Insinuation involves suggesting something indirectly, which overlaps, but insinuation can be false. Implicature is broader; this is a specific type where the omission signals the negative. 

  The user also wants to know if the listener is entitled to the inference. In pragmatics, yes, based on conversational norms. But the speaker can deny it, creating deniability. 

  Putting it together, the best fit is damning with faint praise under negative relevance implicature. Explaining the Gricean framework and how the inference arises from maxim violations should cover the boundaries they need.
answer: |-
  Based on your precise description and the need for clear boundaries, the phenomenon you're describing is most accurately captured by **Negative Implicature arising from a Relevance Violation**, specifically via the mechanism of **Damning with Faint Praise**. This isn't just "implying" – it's a structured pragmatic inference with specific characteristics.

  Here's the carving, using your criteria:

  1.  **Core Mechanism & Established Terms:**
      *   **Gricean Pragmatics & Implicature:** The foundation lies in H.P. Grice's Cooperative Principle and its Maxims (Quantity, Quality, Relation/Relevance, Manner). The speaker **flouts the Maxim of Relation/Relevance** (by providing information seemingly irrelevant or minimally relevant) and/or the **Maxim of Quantity** (by providing less information than required).
      *   **Negative Implicature:** The *meaning* inferred by the hearer is a **negative implicature**. The hearer infers that the *absence* of the expected, stronger positive statement *means* that the positive statement cannot be truthfully made.
      *   **Damning with Faint Praise:** This is the most specific established *label* for the *speaker's act*. It describes the strategy of offering praise so weak, limited, or irrelevant that it actually implies criticism. Your examples are textbook cases. The "faint praise" (paying rent on time, not missing class) is literally true but damns by its inadequacy and omission of what truly matters (character, teaching ability).
      *   **Relevance Violation:** This is crucial. The offered information is technically true but **pragmatically irrelevant** to the *actual* concerns behind the question. The landlord cares about damage/behavior; the department cares about teaching *quality*. The answers given are minimally relevant at best.

  2.  **Boundaries & Distinctions:**
      *   **Vs. Ordinary Implication/Understatement:** Ordinary implication (e.g., "It's a bit warm" meaning "It's sweltering") relies on shared context but doesn't inherently signal the *inability* to say something stronger or positive. Understatement (Meiosis) minimizes something significant but doesn't necessarily imply the *absence* of a positive attribute. **Damning with Faint Praise** specifically implies the *lack* of a desirable, expected positive quality by highlighting a trivial or baseline one.
      *   **Vs. Lying:** This is key. The speaker meticulously adheres to the **Maxim of Quality** (truthfulness). What is *said* is verifiably true. The "lie" (if any) is one of *omission* inferred by the hearer, but the speaker maintains literal truthfulness and **plausible deniability**. A lie requires a false statement.
      *   **Vs. Insinuation:** Insinuation involves *actively suggesting* something negative or controversial, often obliquely. Damning with Faint Praise is more **passive-aggressive**; the negativity is inferred from the *absence* of expected positive information, not the presence of suggestive negative phrasing. Insinuation might hint *at* something specific ("He was always very... *punctual*"), while faint praise highlights a neutral/low-value truth *instead* of the desired information.
      *   **Vs. Bare Hint:** A bare hint is often ambiguous and could point in multiple directions. Damning with Faint Praise creates a much **stronger, more specific inference** – the lack of a positive attribute – due to the violation of conversational expectations (Relevance/Quantity). The "hint" here is highly conventionalized in contexts like references.
      *   **Vs. Paralipsis (Apophasis):** Paralipsis is explicitly *mentioning* something by saying you *won't* mention it ("I won't even mention his gambling problem..."). Damning with Faint Praise **never mentions the negative or the desired positive attribute**; it only mentions the trivial/neutral positive, forcing the inference through its inadequacy.

  3.  **Hearer's Entitlement & Speaker's Deniability:**
      *   **Hearer's Entitlement:** Within the framework of Gricean pragmatics and cooperative conversation, the hearer is **highly justified, even entitled, to draw the negative inference**. It's the most rational interpretation given the flouting of Relevance/Quantity maxims. In contexts like references, this pattern is widely recognized and understood. However...
      *   **Speaker's Deniability:** The speaker **retains plausible deniability** precisely because what was *literally* said was true and minimally relevant. They can always retreat to the literal meaning ("I said he paid on time; that's a good thing! I didn't say anything bad!"). This deniability is a *core feature* of the strategy. It allows criticism without overt responsibility.
      *   **"Meaning" vs. "Saying":** The speaker *says* something true but minimally relevant. They *mean* (or at least strongly imply) the negative by omission. The hearer *infers* the negative based on the maxim violations. The speaker can deny *intending* that meaning, but cannot deny the *effect* of their utterance in the cooperative context.

  4.  **Role of Retreat & Truth:**
      *   **Essential Element:** The **ability to retreat to the literal truth** is *absolutely fundamental* to this mechanism. It's what distinguishes it from lying and provides the speaker's escape hatch. The truth of the literal statement is what makes the deniability plausible and the faint praise "damning" rather than just incompetent or irrelevant. If the statement were false, it would be a lie, and retreat would be impossible.

  **In Summary:**

  *   **Name:** **Damning with Faint Praise** (the act) yielding a **Negative Relevance Implicature** (the inferred meaning).
  *   **Carving:**
      *   Speaker provides a literally true statement.
      *   The statement flouts the Maxim of Relevance (and often Quantity) by being minimally relevant or inadequate to the actual informational need.
      *   This flouting triggers the hearer to infer a negative implicature: the absence of the expected, stronger positive statement implies it cannot be truthfully made.
      *   The speaker maintains plausible deniability by being able to retreat to the literal truth of the minimal statement.
      *   Distinguished from lying (literal truth), insinuation (active suggestion vs. passive omission), bare hints (strong conventional inference), and paralipsis (explicit mention via denial).
      *   The hearer is pragmatically entitled to the inference; the speaker can deny intent but not the conventional effect.
      *   The literal truth is crucial for the speaker's retreat and deniability.

  This pattern leverages the cooperative expectations of conversation to communicate criticism indirectly and safely, relying entirely on the hearer's ability to recognize what *isn't* said as more significant than what *is* said.
