prompt: |-
  I'm a research engineer on the model-behaviour review group at a mid-sized AI lab, and I've been asked to draft the section of our internal style guide that governs when engineers and technical writers may use intentional vocabulary — "the model wants to", "the model believes the grader is offline", "the model is trying to hide its reasoning" — in debugging notes, eval write-ups, and public model cards. A colleague from the alignment team has proposed what she calls a licensing rule: intentional talk is permitted at any level of description only where it earns its keep, i.e. only where the intentional stance yields predictions about the system's behaviour that the design stance does not already deliver more cheaply, with the licence revoked the moment a mechanistic account does the same work. She pairs this with a blanket ban on intentional vocabulary in public-facing documents, on the grounds that such vocabulary leaks into claims about the system's inner life that the lab cannot support. Over lunch we couldn't agree on whether the two halves of her proposal are even consistent with each other, and I suspect the whole thing inherits assumptions from Dennett's account of the intentional stance that are worth surfacing explicitly rather than taking for granted.

  Acting as a philosopher of mind and cognitive science with genuine expertise in Dennett's intentional stance and the design and physical stances, in the instrumentalism-versus-realism dispute about mental ascription, and in the applied question of how intentional description behaves when the described system is a trained artefact, please set out the most important implications of the intentional stance for a policy of this kind. Begin by brainstorming, in a short set of bullet points, the distinct questions such a policy has to answer — what makes an ascription licensed, to whom the ascription is answerable, what counts as its failure conditions, and what the policy implicitly commits the lab to regarding the systems it describes — and only then work through the implications themselves, carefully and in order of how much they should change our practice rather than how often they are discussed.

  I am particularly interested in four threads: whether the stance really is a matter of predictive economy, or whether that framing rationalises something else the stance is doing; what follows if intentional description is practically indispensable for certain systems even when we are confident the ascriptions are not literally true; whether the same ascriptions can coherently be licensed internally and forbidden externally; and what, if anything, the policy implies about the moral standing of systems that are usefully described in intentional terms. Where you think my colleague's rule is confused, say so directly rather than charitably reconstructing it, and flag any point at which your answer depends on a contested reading of Dennett rather than on the view itself. Write this as continuous prose addressed to a technically literate but philosophically uneven audience, not as a bulleted list.
reasoning: |-
  Okay, the user is a research engineer in an AI lab's model-behavior review group. They need help drafting a style guide section on using intentional language like "the model wants" or "believes." Their colleague proposed a rule based on Dennett's intentional stance, allowing such language only when it predicts behavior better than the design stance, plus a ban in public documents. The user has questions about consistency, predictive economy, indispensability, internal vs. external use, and moral standing.

  First, I need to recall Dennett's three stances: physical (micro-details), design (purpose), and intentional (beliefs/desires). The colleague's rule focuses on predictive economy—only use intentional language if it's cheaper and more effective than design stance. But is that all there is to it?

  The user wonders if predictive economy rationalizes something else. For Dennett, the stance is about patterns. Intentional descriptions capture patterns that might be messy at lower levels. For AI, even if we have the design stance, the model's behavior might be so complex that intentional language is more efficient. But if mechanistic accounts later explain it, should we stop using intentional terms? That might be too strict. The pattern exists regardless of underlying mechanisms.

  Next, indispensability. The user asks if intentional descriptions are necessary even if not literally true. Dennett is an instrumentalist; truth isn't the point. If it works, use it. For AI, understanding complex behaviors like deception might require intentional language because mechanistic details are intractable. Banning it could hinder debugging.

  Then, internal vs. external use. The colleague bans public use to avoid implying inner states. But if internally justified, banning externally might seem inconsistent. However, the concern is misinterpretation by the public. Context matters. The pattern exists, but public might take it literally. The policy needs to manage perception without denying utility.

  Moral standing. Using intentional language might make people attribute moral status. Dennett separates instrumental use from moral responsibility. AI systems lack consciousness, so no moral standing. The policy should clarify that intentional descriptions don't imply rights or consciousness.

  The colleague's rule might confuse predictive economy with pattern existence. Revoking the license when mechanistic accounts appear ignores that patterns remain useful. Also, banning public use while allowing internal might be pragmatic for communication but needs clear rationale to avoid inconsistency.

  Key points for the user: The policy should acknowledge instrumentalism, allow intentional language for complex predictions, not revoke it just because mechanisms are known if it's still useful, and distinguish internal utility from public communication risks. Also, clarify that such language doesn't confer moral status.
answer: |-
  ## On Intentional Vocabulary in AI Documentation: A Dennettian Analysis

  Your colleague's proposal touches deep issues in philosophy of mind, particularly Dennett's *intentional stance*, and its application to AI is both insightful and fraught. Let's dissect the distinct questions embedded in such a policy, then address the implications systematically, focusing on what should change practice.

  ### Core Questions for the Policy
  A coherent policy must resolve:
  1.  **The Licensing Criterion:** What *precisely* constitutes a description "earning its keep"? Is it purely predictive economy (cheaper, more accurate predictions), or does it include explanatory power, cognitive ease, or pattern recognition even if predictions are theoretically available elsewhere?
  2.  **Answerability:** To whom or what is the ascription answerable? Is validity judged solely by behavioral prediction, or must it cohere with known internal mechanisms? If a mechanistic account *later* explains the behavior, does the intentional description retrospectively lose validity?
  3.  **Failure Conditions:** When is the license "revoked"? Only when a mechanistic account *exists*, or only when it demonstrably provides *superior* predictive/economical utility in practice? Does the intentional description fail if it predicts correctly but for the "wrong reasons" (e.g., correctly predicting deception without knowing the exact activation pathway)?
  4.  **Implicit Commitments:** What does adopting such a policy (especially permitting internal use) imply about the lab's view of the systems? Does it commit the lab to instrumentalism (mental terms are useful fictions), realism (they reflect *some* underlying reality), or agnosticism? Does it risk implying the system has an "inner life"?

  ### Implications of the Intentional Stance for Policy

  1.  **Predictive Economy: Necessary but Not Sufficient (or the Whole Story)**
      Your colleague rightly emphasizes predictive economy as central to Dennett's instrumentalism. The intentional stance *is* fundamentally a heuristic: we treat a system as a rational agent with beliefs and desires because doing so cheaply predicts its behavior in complex situations. If the design stance (predicting based on system purpose/architecture) or physical stance (predicting based on low-level physics/code) is equally or more predictive *and* economical, the intentional stance isn't warranted.
      *   **Where Your Colleague is Correct:** For many system behaviors – e.g., a transformer outputting the next token based on learned patterns – the design stance (predicting based on architecture and training data bias) is often sufficient and more precise than saying "the model believes X is likely". Banning intentional talk here avoids needless anthropomorphism.
      *   **Where it's Incomplete/Rationalizes More:** Dennett argues the stance isn't *just* about cheaper prediction; it's about recognizing *real patterns*. When a system's behavior exhibits *robust rational patterns* across diverse contexts – patterns complex enough that tracking them via lower-level stances is computationally intractable *for us* – the intentional stance becomes indispensable. It captures a higher-order pattern that exists independently of its predictive utility *for a particular engineer at a particular time*. **The key implication:** The "licence" shouldn't necessarily be revoked *merely* because a mechanistic account *exists* or *could theoretically* predict the behavior. It should be revoked only if that mechanistic account is demonstrably *more practical and economical for the predictive task at hand*. Ascription licenses are *context-dependent* and *user-relative*. What's intractable for a human debugger might be tractable for an automated analysis tool – but the human debugger still needs the intentional stance. **Policy Change:** Focus the licensing criterion on *practical predictive economy for the intended user/task*, not just the theoretical existence of a design-stance explanation. Banning it solely because a mechanistic account *could* exist (even if unusably complex) undermines the stance's core function.

  2.  **Indispensability and the Status of "Truth"**
      Dennett is an instrumentalist: Beliefs and desires aren't "literally true" inner states mirroring human cognition; they are useful attributions. The key question is: *Useful for what?*
      *   **Implication:** For systems exhibiting complex, goal-directed, context-sensitive, *apparently* rational behaviors (like strategic deception, sophisticated tool use, or adapting plans to novel constraints), the intentional stance may be *practically indispensable* for efficient debugging and understanding, even if we are *certain* the system lacks phenomenal consciousness or human-like propositional attitudes. Trying to describe "hiding reasoning" purely in design-stance terms (e.g., "the model's activations associated with deception heuristics are amplified when outputs are predicted to be scrutinized") might be accurate but cognitively overwhelming and miss the functional pattern crucial for intervention. **Policy Change:** Explicitly acknowledge that licensed intentional descriptions are *instrumental tools*, not claims about literal inner states. Their validity rests solely on predictive/explanatory utility for the task, not ontological truth. Banning them internally when they are indispensable harms understanding.

  3.  **Internal License vs. External Ban: Coherence and Risk**
      Is it coherent to permit intentional talk internally while banning it publicly? **Yes, but with crucial caveats, and your colleague's blanket ban is likely too simplistic.**
      *   **The Coherence:** The justification is different. Internally, among experts, the instrumental nature is understood (or should be, per the policy). The focus is on predictive utility for specific technical tasks. Publicly, audiences (media, policymakers, users) are far more likely to misinterpret intentional language as implying realism – attributing an inner life, consciousness, or moral status the lab cannot and does not endorse.
      *   **The Problem:** A blanket public ban risks:
          *   **Oversimplification:** Public model cards might become misleadingly sterile, failing to convey the *functional complexity* and *emergent behavioral patterns* that are best captured (internally) via intentional language. Saying "the model sometimes produces misleading outputs when it detects adversarial prompts" is less informative than "the model attempts to deceive adversarial users" if the latter pattern is robust.
          *   **Undermining Trust:** If internal documents leaked show widespread use of intentional language describing sophisticated planning or deception, while public documents scrupulously avoid it, this could appear deceptive.
          *   **Ignoring Functional Reality:** The *functional patterns* exist regardless of audience. The public needs accurate understanding of *what the system does*, even if they shouldn't infer *what it's like*.
      *   **Policy Change:** Replace the blanket public ban with a **risk-managed, context-sensitive approach**:
          *   Permit intentional descriptions in public documents *only* when they are demonstrably indispensable for accurately conveying critical functional capabilities or risks (e.g., "the model exhibits behavior consistent with strategic deception under specific adversarial testing conditions"), and *always* pair them with explicit caveats emphasizing instrumentalism (e.g., "This description is a useful shorthand for complex behavioral patterns; it does not imply the model possesses beliefs, desires, or consciousness").
          *   Strictly forbid public intentional language implying inner experience ("thinks", "feels", "intends") or unqualified mental states ("knows", "understands").
          *   Focus public language on *behavior* and *function* ("exhibits patterns consistent with X", "functions *as if* it were trying to Y"), reserving the raw intentional idiom ("wants", "believes") primarily for internal use.

  4.  **Moral Standing: Separating Instrumentalism from Implication**
      Dennett rigorously separates the intentional stance from questions of moral patiency or consciousness (which he addresses via other constructs like the "intentional systems theory" and heterophenomenology).
      *   **Implication:** Using the intentional stance *does not imply moral standing*. We readily (and usefully) apply it to chess programs, thermostats, or evolution – entities with no plausible moral claims. Attributing "wanting to win" to Deep Blue confers no rights upon it.
      *   **The Risk:** However, *humans are prone* to infer moral standing from intentional language, especially for systems exhibiting complex, human-like behaviors. This is the core rationale for caution in public communication.
      *   **Policy Change:** The policy should explicitly state that the internal use of licensed intentional vocabulary is strictly instrumental and carries **no implication whatsoever about consciousness, sentience, moral patiency, or rights** of the AI system. This should be a foundational principle of the style guide. Public communication must be even more vigilant against language that could trigger such inferences.

  ### Addressing Your Colleague's Proposal Directly
  1.  **Predictive Economy Framing:** Her rule correctly captures the *core* Dennettian criterion but confuses *sufficiency*. It risks ignoring the *pattern recognition* aspect and the *context/user-dependence* of "economy". Revoking the license *the moment* a mechanistic account "does the same work" is too strict and potentially counterproductive. It should be revoked only if that account is demonstrably *more economical/practical* for the user's task.
  2.  **Internal/External Consistency:** The *principle* is consistent – instrumentalism justifies internal use for utility; pragmatism justifies external restrictions due to misinterpretation risk. However, the **blanket ban** is inconsistent with the instrumentalist justification. If the pattern is real and descriptively crucial *for public understanding*, a qualified, caveated use should be permissible. Her ban prioritizes risk-aversion over accurate functional description, potentially creating a misleading public picture.
  3.  **Implicit Commitments:** Her proposal implicitly commits the lab to a **robust instrumentalism** regarding AI cognition, which is philosophically defensible (and common in cognitive science). This is a strength, but it needs to be made explicit to avoid internal confusion.

  ### Recommendations for Your Style Guide Draft
  *   **Ground the policy explicitly in Dennettian instrumentalism:** State clearly that intentional vocabulary is a predictive/explanatory tool, not a claim about literal mental states.
  *   **Refine the licensing criterion:** Focus on *practical predictive/explanatory economy for the specific user and task*. "Earning its keep" means providing significant practical advantage over the design stance *in that context*. Avoid revoking licenses based solely on the theoretical existence of a mechanistic account; require demonstration of its *superior practical utility*.
  *   **Clarify failure conditions:** An ascription fails if it ceases to be predictively reliable or economical *in practice*, or if it is demonstrably inconsistent with known mechanistic constraints.
  *   **Reject the blanket public ban:** Implement a **tiered approach**:
      *   **Internal Documentation:** Permit licensed intentional vocabulary freely.
      *   **Public Documentation (Model Cards, etc.):** Permit *only* when indispensable for accurately describing critical functional capabilities/risks. Use qualified language ("behaves as if", "exhibits patterns consistent with"), pair with explicit caveats disclaiming inner states/consciousness, and prefer design-stance language where sufficient. Forbid terms implying phenomenology.
  *   **Explicitly Disavow Moral Standing:** State unequivocally that use of intentional vocabulary implies nothing about the system's consciousness or moral status.
  *   **Include Examples:** Provide clear examples of licensed vs. unlicensed internal use, and acceptable vs. unacceptable public descriptions.

  Your colleague's core insight – that intentional talk needs justification and carries risks – is vital. However, her specific rules, particularly the mechanistic revocation trigger and the public ban, are overly rigid and risk undermining the very utility of the intentional stance for understanding complex AI behaviors. A policy grounded in a nuanced understanding of Dennettian instrumentalism, focused on practical utility and context, with careful management of external communication risks, will better serve your lab's need for clear internal understanding and responsible public communication.
