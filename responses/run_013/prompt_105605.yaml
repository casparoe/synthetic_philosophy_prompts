  ### Take-Home Final Essay Question: Sen's Liberal Paradox and a Proposed Repair

  **Question (Total: 25 marks)**  
  This question has two parts. Answer both parts concisely, adhering to the word budget. Use the "book choice" example: two individuals, A and B, each choosing to read *Lady Chatterley’s Lover* (L) or *Ulysses* (U). The four possible social states are:  
  - **ALBL**: A reads L, B reads L  
  - **ALBU**: A reads L, B reads U  
  - **AUBL**: A reads U, B reads L  
  - **AUBU**: A reads U, B reads U  

  Part (i) (10 marks, max 300 words):  
  Explain in your own words what Sen’s liberal paradox establishes. Focus on:  
  - Which condition the contradiction most directly challenges,  
  - Why the weakness of the Pareto principle amplifies the result’s significance, and  
  - Why rejecting Pareto entirely is an inadequate solution.  

  Part (ii) (15 marks, max 500 words):  
  Test the following proposed repair to the paradox:  
  - Retain **minimal liberalism** exactly as Sen defines it: at least two individuals are decisive over at least one pair in their personal sphere (here, A is decisive over pairs differing only in A’s book choice, e.g., {ALBL, AUBL}; B is decisive over pairs differing only in B’s choice, e.g., {ALBL, ALBU}).  
  - Restrict the **Pareto principle**: It applies only to pairs differing in *one* person’s private dimension (e.g., Pareto may resolve {ALBL, AUBL} but not {ALBL, ALBU}, as the latter differs in both dimensions).  
  - Maintain **unrestricted domain** (preferences can be meddlesome) and require a **complete, transitive social ordering**.  

  Either:  
  (a) Construct a counterexample showing this repair fails (define preferences and derive a social intransitivity using *only* liberty conditions), or  
  (b) Prove no counterexample exists.  
  If (a), identify which feature of minimal liberalism enables the intransitivity and suggest a plausible refinement to block it.  

  ---

  ### Model Answer (Total: 800 words)  
  **Part (i) (300 words)**  
  Sen’s liberal paradox demonstrates that no social decision rule can simultaneously satisfy minimal liberalism, weak Pareto, and unrestricted domain while generating a transitive social ordering. The contradiction lands most decisively on minimal liberalism because it reveals an inherent conflict between individual rights and collective rationality. Liberalism grants individuals control over personal spheres, but this very control—when combined with weak Pareto and unrestricted preferences—forces intransitive social rankings.  

  The Pareto principle’s weakness intensifies the paradox. Pareto requires unanimity only when all individuals strictly prefer one alternative over another, a condition easily met and seemingly uncontroversial. Yet in Sen’s framework, this minimal demand interacts catastrophically with liberty: even mild social agreement on "private" choices (e.g., both prefer AUBL over ALBL in the book example) can override individual rights, creating cycles. This makes the result a profound limitation, not a technical curiosity, as it strikes at liberalism’s core promise of protecting personal autonomy.  

  Rejecting Pareto entirely is too quick because it ignores the paradox’s deeper cause: unrestricted domain. Individuals may hold meddlesome preferences (e.g., caring intensely about others’ private choices), and liberalism alone—without Pareto—can still produce intransitivity. Abandoning Pareto merely masks this instability without resolving the fundamental tension between rights and collective rationality.  

  **Part (ii) (500 words)**  
  The repair fails: liberty conditions alone can generate intransitivity under unrestricted domain. Consider the following preferences:  
  - **A’s ranking**: AUBU > ALBL > AUBL > ALBU  
    (A prefers both reading U, then both reading L, then A reading U/B reading L, least A reading L/B reading U)  
  - **B’s ranking**: ALBU > AUBL > ALBL > AUBU  
    (B prefers A reading L/B reading U, then A reading U/B reading L, then both L, least both U)  

  Minimal liberalism assigns decisiveness:  
  - A is decisive over {ALBL, AUBL} and {ALBU, AUBU} (pairs differing only in A’s book).  
  - B is decisive over {ALBL, ALBU} and {AUBL, AUBU} (pairs differing only in B’s book).  

  Applying decisiveness:  
  1. A on {ALBL, AUBL}: A prefers ALBL > AUBL → **ALBL > AUBL** socially.  
  2. A on {ALBU, AUBU}: A prefers AUBU > ALBU → **AUBU > ALBU** socially.  
  3. B on {ALBL, ALBU}: B prefers ALBU > ALBL → **ALBU > ALBL** socially.  
  4. B on {AUBL, AUBU}: B prefers AUBL > AUBU → **AUBL > AUBU** socially.  

  Now, chain the social preferences:  
  - From (3): **ALBU > ALBL**  
  - From (1): **ALBL > AUBL**  
  - Thus, **ALBU > ALBL > AUBL** (transitivity).  
  - From (4): **AUBL > AUBU**  
  - From (2): **AUBU > ALBU**  
  - Thus, **AUBL > AUBU > ALBU** (transitivity).  

  Combining: **ALBU > ALBL > AUBL** and **AUBL > AUBU > ALBU**. This implies:  
  - **ALBU > AUBL** (from ALBU > ALBL > AUBL)  
  - **AUBL > ALBU** (from AUBL > AUBU > ALBU)  

  Contradiction: **ALBU > AUBL** and **AUBL > ALBU** violate asymmetry. The social ordering is intransitive (e.g., ALBU > AUBL > ALBU).  

  The intransitivity arises because minimal liberalism allows decisiveness over *context-dependent* pairs without restricting preferences. Here, A and B’s meddlesome preferences (each cares about the other’s choice) create opposing rankings on overlapping pairs (e.g., ALBU appears in both A’s and B’s decisive sets). The repair’s Pareto restriction is irrelevant—no Pareto step was used.  

  To block this, we could require **self-regarding preferences**: individuals only care about their own private dimension (e.g., A’s ranking depends solely on A’s book). This eliminates meddlesomeness, breaking the cycle. However, this may be implausible in social contexts where individuals inherently care about others’ choices.  

