answer: |-
  This is a fascinating impasse, rooted in fundamentally different conceptions of democratic legitimacy, amplified by ambiguity about institutional design. Your suspicion is astute and forms the core of the diagnosis.

  **Diagnosing the Stalemate:**

  1.  **Not Primarily a Verbal Quarrel (though semantics play a role):** While both sides use "democratic," their disagreement isn't *just* about the word. They agree on political equality as a core value. The clash is over *how that value translates into legitimate authority* within a democratic system. Both conceptions are coherent within broader democratic traditions.
  2.  **A Substantive Disagreement About Legitimacy (the Core Issue):** This is the heart of the matter, precisely as you intuited:
      *   **Camp 1 (Sortition as Peak Democracy):** Legitimacy stems primarily from **procedural fairness and equal opportunity for political power**. Sortition embodies political equality by giving every citizen an equal chance to serve and deliberate. Authority comes from the *representativeness* and *impartiality* of the process itself – the "fairness of selection" you mention. This view sees elections as inherently *illegitimate* for distributing power because they systematically favor the organized, wealthy, and rhetorically skilled ("office as something owed").
      *   **Camp 2 (Election as Mandate & Accountability):** Legitimacy stems primarily from **authorization and accountability**. Elections are the mechanism by which the sovereign people *authorize* representatives to act on their behalf and *hold them accountable* for their actions through re-election or removal. Sortition, lacking this explicit authorization and subsequent accountability mechanism, is seen as lacking democratic legitimacy, regardless of its fairness or outcomes ("office as something entrusted"). An allotted body is seen as a collection of individuals, not authorized agents.
  3.  **Two Questions Under One Name:** The single label "democratic" masks two distinct questions:
      *   **Question 1:** Does this institution embody the principle of *political equality* in its formation? (Sortition clearly wins here).
      *   **Question 2:** Does this institution derive its authority from and remain responsive to the *ongoing will* of the governed? (Elections are designed to answer this affirmatively; sortition appears passive and unresponsive post-selection).
  4.  **A Hidden Empirical Disagreement (Fueled by Ambiguity):** Your point about advisory bodies is crucial. The disagreement is exacerbated because:
      *   **Camp 1** often envisions a powerful allotted *legislative* chamber, assuming its representativeness and deliberation *are* sufficient legitimacy and that capture/accountability can be managed (e.g., through short terms, rotation, oversight mechanisms, public deliberation transparency).
      *   **Camp 2** fixates on the lack of mandate and the potential for capture, ineptitude, or detachment in a body with *real power*, pointing to the advisory nature of most historical examples as evidence it can't/shouldn't wield decisive authority. They see elections as the only practical safeguard against these risks.
      *   **The Ambiguity:** Without specifying the *powers* and *safeguards* of the proposed allotted body, each side projects its worst fears or best hopes onto the concept. Is it advisory? Co-legislative? Sovereign? How are conflicts with elected bodies resolved? What prevents capture? The lack of a concrete, shared model allows the legitimacy disagreement to fester.

  **Does Your Suspicion Hold?**

  **Yes, emphatically.** Your insight from randomized trials hits the nail on the head. The core conflict is precisely about whether the *fairness of the selection procedure* (randomization) is sufficient to confer *legitimacy of the decision/authority*. Camp 1 says "Yes, fairness *is* legitimacy in this context." Camp 2 says "No, legitimacy requires authorization and accountability *beyond* fair selection." Your distinction between "office as owed" (inherent right via fair chance) and "office as entrusted" (delegated authority with strings attached) perfectly encapsulates the opposing legitimacy principles.

  **What is Really Doing the Work?**

  The fundamental driver is the **clash between two paradigms of democratic authority**:

  1.  **The Athenian/Participatory/Deliberative Ideal:** Legitimacy flows from equal *participation* and reasoned *deliberation* among a microcosm of the citizenry. Fair access *is* the core democratic act.
  2.  **The Liberal/Representative/Mandate Ideal:** Legitimacy flows from popular *authorization* (elections) and the threat of *sanction* (accountability). The link between the people's will and the ruler's action must be explicit and revisable.

  **What Would Count as Progress?**

  Breaking this stalemate requires shifting the ground:

  1.  **Reframe the Question:** Stop asking "Is sortition democratic?" (which triggers the legitimacy clash). Instead, ask:
      *   "What *specific functions* within a democratic system could an allotted body perform *better* than elected bodies, given its strengths (representativeness, reduced partisan bias, deliberation) and weaknesses (lack of mandate, potential accountability gaps)?"
      *   "How can we *combine* sortition and election to leverage the strengths of both legitimacy models (fair access *and* authorization/accountability) within a mixed constitution?" (e.g., allotted chamber proposes, elected chamber disposes; allotted juries on specific ethics/complex policy panels; allotted bodies setting agendas for referenda).
  2.  **Concretize the Institution:** Move beyond the abstract "allotted chamber." Design a *specific model* with defined powers, term lengths, selection pools, oversight mechanisms, deliberative procedures, and relationship to elected bodies/institutions. Debate *that specific model's* legitimacy, effectiveness, and risks. This forces engagement with practical accountability questions beyond the theoretical binary.
  3.  **Empirical Focus (Beyond Past Performance):** While agreeing past advisory bodies worked, probe the *empirical assumptions* underlying the fears:
      *   **For Camp 2:** What specific evidence suggests allotted bodies *with appropriate safeguards* (short terms, large pools, transparency, limited scope) would be more prone to capture or make worse decisions than elected bodies demonstrably captured by specific interests? Can we test accountability mechanisms *other* than re-election (e.g., public justification requirements, sunset clauses, oversight by other bodies)?
      *   **For Camp 1:** What evidence suggests that the perceived legitimacy deficit of an unelected body wielding power wouldn't undermine public acceptance and stability, even if its decisions were "good"? How can responsiveness to shifting public opinion be institutionally embedded?
  4.  **Philosophical Distinction:** Explicitly separate the sources of legitimacy:
      *   **Input Legitimacy:** Derived from the fairness and inclusivity of the selection process (sortition's strength).
      *   **Throughput Legitimacy:** Derived from the quality and transparency of the decision-making *process* (deliberation - where sortition can aim high).
      *   **Output Legitimacy:** Derived from the effectiveness and perceived benefit of the *outcomes*.
      *   **Authorization Legitimacy:** Derived from prior explicit consent (election).
      *   **Accountability Legitimacy:** Derived from mechanisms to sanction poor performance (elections, recall, etc.).
      Acknowledge that sortition scores high on input and potentially throughput, but low on authorization and traditional accountability. The debate then becomes: *Which combination* of these legitimacy sources is necessary and sufficient for different types of political authority? Is authorization *always* required, or can other forms compensate?

  **Why Progress Might Be Difficult (But Not Impossible):**

  The disagreement touches on deep, almost axiomatic, beliefs about the nature of political authority and popular sovereignty. Camp 1 sees elections as a corrupted mechanism violating core equality; Camp 2 sees sortition as bypassing the essential authorization link. These are foundational differences.

  **However, progress *is* possible by:**

  *   **Moving from abstraction to concrete institutional design.**
  *   **Shifting from "either/or" to "how can we combine/use appropriately?"**
  *   **Focusing on specific functions and empirical risks/safeguards.**
  *   **Acknowledging that complex systems can derive legitimacy from multiple, complementary sources.**

  Your group's decade-long discussion, while stalled on this point, demonstrates deep engagement. Leveraging your scientific perspective to push for concrete models and testable assumptions, while respecting the profound philosophical divide, offers the best path forward. The goal isn't necessarily full agreement, but a more nuanced understanding of the trade-offs and potential applications of sortition within a complex democratic system.
