prompt: |-
  I chair the disciplinary panel of a state professional licensing board. We hear twenty-five to forty cases a month involving nurses, pharmacists, contractors, financial advisers, and similar licensees. Our statute tells us to protect the public and to impose sanctions proportionate to the seriousness of the conduct and the harm caused, but it does not tell us how to treat the fact that two licensees can engage in equally poor conduct and only one of them happens to cause a catastrophe. Complainants, the public, and sometimes our own members treat the outcome as the measure of the wrongdoing. I want a decision procedure the panel can actually run, grounded in the moral luck literature, that preserves the real distinctions while being usable by seven board members who are not philosophers and who have about thirty minutes per case plus a written-reasons requirement. Our sanction schedule has five bands, from reprimand to revocation. Legal counsel signs off on the final order.

  We have adopted an internal principle, which I will call the conduct-first rule: before the panel considers the actual outcome, it must assess the quality of the licensee’s conduct and decision-making using only what the licensee knew or should have known at the time. The actual outcome may then adjust the sanction, but only through a procedure that says when and how much. Your task is to turn that principle into an operational procedure.

  Please give me the following.

  1. A set of questions to ask in order, with what counts as a sufficient answer to each, and where the procedure stops and produces a sanction band or a recommendation.

  2. A way to separate at least four kinds of luck that can affect a licensing case: outcome luck, where the same conduct causes different harm; circumstantial luck, where the licensee happened to face a situation others did not; constitutive luck, where the licensee’s temperament, training, or background is at issue; and epistemic luck, concerning what was knowable at the time. Say which of these the panel can legitimately adjust for, which it should record but not adjust for, and why.

  3. A treatment of tracing: when a later bad outcome can be traced back to an earlier culpable decision, and when the chain is too loose for the board to treat the outcome as part of the licensee’s fault.

  4. A rule for hindsight bias: how the panel should keep the fact that harm occurred from inflating its judgment of how risky the conduct was ex ante. Include a concrete debiasing step, not just a warning.

  5. A small number of tests the panel can run in order, with a scoring or ranking rule if you can make one that is honest, and a clear statement of the points where the procedure cannot decide and the panel must vote on values. Mark those points explicitly.

  6. Worked applications to three cases: two pharmacists make the same dispensing error, one is caught by a nurse and one kills a patient; two commercial drivers drive the same number of hours fatigued, one hits a child and one arrives without incident; and a surgeon who follows the standard of care but has a rare-anatomy catastrophe, compared with a surgeon who cuts a corner and whose patient recovers. For each, show the procedure’s recommended adjustment to the sanction and the written rationale.

  7. At least one case where the procedure gives an answer the public or the complainant will not like, and say how the panel should explain that answer without sounding indifferent to harm.

  8. A short section on what the procedure cannot do. In particular, say where the board is really deciding a policy question about how much outcome should matter, not applying a philosophical result, and say what would need to change in the statute or the evidence for the procedure to give a different answer.

  Do not give me a reading list, citations, or a survey of the moral luck debate. I need the procedure, the hard cases it must handle, and the places where judgment cannot be eliminated. You may invent intermediate concepts if they help, but label them as your inventions and keep them simple enough for a board member to apply under time pressure.
reasoning: |-
  Okay, the user chairs a disciplinary panel for a state licensing board and needs an operational procedure to handle cases involving moral luck. They deal with 25-40 cases monthly across various professions. The key challenge is assessing conduct fairly when outcomes differ despite similar initial actions. 

  First, I need to understand their existing "conduct-first rule" - they already separate conduct assessment from outcome consideration. That's smart. Now they need concrete steps to implement this. The user mentioned seven non-philosopher board members with only 30 minutes per case plus written reasons, so simplicity is crucial.

  Hmm... the core tension is between public perception (which focuses on outcomes) and ethical fairness (which should focus on controllable factors). The user wants to preserve real distinctions while making it administratively feasible. 

  Breaking this down:
  1. Need a clear sequence of questions that forces the panel to evaluate conduct before considering harm. Should include "stopping points" where they can decide sanctions early if conduct is clearly bad or good.
  2. Must categorize four types of luck: outcome, circumstantial, constitutive, epistemic. Only outcome luck should potentially adjust sanctions - the others are either irrelevant or already baked into conduct assessment.
  3. Tracing problems require a "reasonable foreseeability" test. Can't hold licensees responsible for butterfly-effect consequences.
  4. Hindsight bias is dangerous. A concrete debiasing trick: make them articulate the worst plausible outcome at decision-time, not actual outcome.
  5. Should provide a scoring system? Maybe a 3-step test with severity thresholds. But need to flag where value judgments are unavoidable.
  6. Example cases are critical - especially the pharmacist and driver comparisons where outcomes differ. Also need the "unpopular case" where bad outcome gets leniency to demonstrate consistency.
  7. The "cannot do" section is vital - must clarify this framework doesn't eliminate judgment, just structures it. Statute changes would be needed for different outcomes.

  For the procedure itself... 
  - Start with conduct severity independent of outcome (using the "reasonable licensee" standard)
  - Then check for "foreseeability anchors" - were there clear warning signs?
  - Only then allow outcome-based adjustments, capped at one sanction band
  - Always require explicit separation in written reasons: "We find X about conduct, Y about outcome effect"

  The pharmacist case pair will be telling: same error, different outcomes. Procedure should give same base sanction with outcome adjustment only for the death case. For the corner-cutting surgeon who got lucky? That's where public might riot - but we must punish the misconduct, not the lack of harm.

  Biggest risk is panel members reverting to outcome-driven thinking. The "articulate worst plausible outcome" step is my favorite debiaser - it forces them to reconstruct the decision context. Also considering adding a "luck ledger" in written reasons to explicitly name which luck types affected the case and why they don't control the decision.

  ...Time to structure this into an actual flow. The five sanction bands help - can use them as adjustment boundaries. Might invent a "severity anchor" concept for step one, with clear examples of low/high risk conduct. And a "foreseeability threshold" test for tracing.
answer: |-
  Here is an operational decision procedure, designed for efficiency and philosophical grounding, with concrete tools to combat bias:

  ---

  ### **1. Decision Procedure: The Four-Step Protocol**
  *(Run sequentially; stop if sanction is determined at Steps 1-3)*

  | Step | Question | Sufficient Answer | Output/Stop Point |
  |------|----------|-------------------|-------------------|
  | **1. Conduct Severity** | "Ignoring actual outcomes, how severely did the licensee's conduct deviate from what a **reasonable licensee** would have done/know at that time?" | Consensus on **risk level**:<br>- **Low**: Minor lapse, no significant foreseeable risk<br>- **Moderate**: Clear deviation, foreseeable minor harm<br>- **High**: Gross deviation, foreseeable serious harm | If **Low**: Reprimand/warning (Band 1-2). STOP.<br>If **High**: Proceed to Step 4; likely revocation (Band 5) regardless of outcome. |
  | **2. Foreseeability Anchor** | "Was there a **specific, known warning sign** (e.g., near-miss, protocol violation, patient complaint) that made the risk objectively obvious?" | Yes/No with evidence.<br>*Example:* Pharmacist ignoring allergy alert vs. misfiling look-alike drug with no prior errors. | If **No**: Outcome adjustment **capped** at +1 band.<br>If **Yes**: Proceed to Step 4; full outcome adjustment possible. |
  | **3. Epistemic Fairness** | "Could a reasonable licensee have known the **key facts** creating the risk, given their training/resources?" | Identify gaps:<br>- **Knowable**: Facts accessible via due diligence<br>- **Unknowable**: Rare anatomy, hidden defect, sabotage | If **Unknowable**: Outcome adjustment **barred**. Sanction based on conduct only. STOP.<br>If **Knowable**: Proceed. |
  | **4. Outcome Adjustment** | "Did the outcome **materialize the worst foreseeable harm** from the conduct?" | Compare actual harm to **Step 1 risk level**:<br>- **Within bounds**: Expected harm severity<br>- **Exceeds bounds**: Fluke catastrophe<br>- **Less than bounds**: Near-miss | Adjust base sanction (from Step 1):<br>- **Within bounds**: +1 band<br>- **Exceeds bounds**: +0 bands (blame-barred)<br>- **Less than bounds**: +0 to +1 bands<sup>*</sup> |

  **<sup>*</sup> Adjustment Rules**:
  - Max adjustment: **+1 sanction band** (e.g., Band 2 → Band 3).
  - **No adjustment downward** for good luck.
  - **Base sanction** from Step 1 sets the floor.

  ---

  ### **2. Treatment of Luck Types**
  | Type | Adjust Sanction? | Record? | Why |
  |------|------------------|---------|-----|
  | **Outcome Luck** (e.g., patient dies vs. recovers) | **Yes, limited** | **Yes** | Outcome may reflect foreseeable risk severity (adjust +1 band max) but not moral culpability. |
  | **Circumstantial Luck** (e.g., happened to be on duty during crisis) | **No** | **Yes** | Licensee is judged on how they handled their circumstances, not that they faced them. |
  | **Constitutive Luck** (e.g., short temper, slow reflexes) | **No** | **Yes** | Already reflected in conduct assessment (e.g., "should have sought anger management"). |
  | **Epistemic Luck** (e.g., unknowable patient allergy) | **Yes** | **Critical** | If facts were **unknowable**, outcome is irrelevant (Step 3). |

  ---

  ### **3. Tracing Rule**
  - **Trace allowed only if**: 
    - The outcome was the **direct, probable consequence** of the initial misconduct, AND 
    - There were **no significant intervening causes** (e.g., another licensee's error, natural disaster).
  - **Example**: 
    - ✅ *Pharmacist dispenses wrong drug* → Nurse fails to check → Patient dies. **Tracing allowed** (nurse check is standard backup). 
    - ❌ *Contractor uses approved material* → Material has hidden defect → Roof collapses. **Tracing barred** (defect unknowable).

  ---

  ### **4. Hindsight Bias Fix: The "Plausible Worst Outcome" Test**
  - **After Step 1** (assessing conduct), **before learning actual outcome**:
    - Panel votes: "What was the **objectively plausible worst outcome** at the time, based **only** on what the licensee knew/should have known?"
    - **Record this outcome** in deliberations.
  - **During Step 4**: Compare actual outcome to this *plausible worst outcome*, not to the catastrophe.

  ---

  ### **5. Summary Test & Judgment Points**
  **Test Sequence**:  
  1. Conduct Severity (Step 1 → Band 1-2 or 5?)  
  2. Foreseeability Anchor (Step 2 → Cap adjustment?)  
  3. Epistemic Fairness (Step 3 → Bar adjustment?)  
  4. Outcome Adjustment (Step 4 → +0 or +1 band?)  

  **Value Judgments Required** (Marked for vote):  
  - ⚖️ **Step 1**: "What is a *reasonable licensee*?" (Use expert testimony)  
  - ⚖️ **Step 2**: "Was this warning sign *specific and obvious*?" (Use protocols)  
  - ⚖️ **Step 4**: "Did outcome *materialize* foreseeable harm?" (Use "Plausible Worst Outcome")  

  **Scoring**: No numeric score—binary thresholds (e.g., "High risk? Yes/No").

  ---

  ### **6. Worked Applications**

  #### **Case A: Pharmacist Dispensing Error**
  - **Facts**: Identical error (wrong drug). Pharmacist 1: Nurse catches. Pharmacist 2: Patient dies.
  - **Procedure**:  
    1. **Step 1**: *High risk* (dispensing errors foreseeably fatal). Base sanction: Band 4-5.  
    2. **Step 2**: No prior near-miss → **Adjustment capped at +1 band**.  
    3. **Step 3**: Error knowable → Proceed.  
    4. **Step 4**:  
       - *Plausible Worst Outcome*: Death.  
       - **Pharmacist 1**: Outcome = *Less than bounds* → **+0 bands** (sanction: Band 4).  
       - **Pharmacist 2**: Outcome = *Within bounds* → **+1 band** (sanction: Band 5).  
  - **Rationale**: "Both engaged in equally reckless conduct with foreseeable fatal potential. Outcome luck does not change culpability, but reflects realized harm. Adjustment capped as no prior warning."

  #### **Case B: Fatigued Commercial Drivers**
  - **Facts**: Same hours, same fatigue. Driver 1 hits child. Driver 2 uneventful trip.
  - **Procedure**:  
    1. **Step 1**: *High risk* (fatigue foreseeably causes crashes). Base: Band 4-5.  
    2. **Step 2**: Prior fatigue incident? If **no** → **Cap +1 band**.  
    3. **Step 4**:  
       - *Plausible Worst Outcome*: Serious injury/death.  
       - **Driver 1**: *Within bounds* → **+1 band** (Band 5: revocation).  
       - **Driver 2**: *Less than bounds* → **+0 bands** (Band 4: suspension).  
  - **Rationale**: "Driving fatigued creates high, foreseeable risk of harm. Outcome adjustment reflects realization of that risk; cap applies absent prior incidents."

  #### **Case C: Surgeons**
  - **Surgeon 1**: Followed standard of care → rare anatomy → patient dies.  
    - **Step 1**: *Low risk* (no deviation). → **Band 1 (reprimand). STOP.**  
    - **Rationale**: "No conduct deviation; harm due to unforeseeable anomaly (epistemic luck)."  
  - **Surgeon 2**: Cut corner → patient recovers.  
    - **Step 1**: *Moderate risk* (deviation foreseeably harmful). Base: Band 3.  
    - **Step 4**: Outcome *less than bounds* → **+0 bands** (sanction: Band 3).  
    - **Rationale**: "Deviation created foreseeable harm risk. Good outcome luck does not reduce culpability."  

  ---

  ### **7. Unpopular Case & Communication**
  - **Case**: *Daycare worker leaves child unattended for 5 minutes to answer phone. Child climbs fence, runs into street, hit by car.*  
  - **Procedure**:  
    - **Step 1**: *Moderate risk* (foreseeable minor injury, not death).  
    - **Step 4**: Outcome *exceeds bounds* (death not plausible worst outcome) → **+0 bands**.  
    - **Sanction**: Band 3 (suspension), not Band 4-5.  
  - **Communication**:  
    - "This board recognizes the devastating outcome. However, the worker’s misconduct—while unacceptable—created a foreseeable risk of minor injury, not death. Holding professionals accountable for unforeseeable flukes would punish bad luck, not bad judgment. Our mandate requires proportionality: we sanction the **choices made**, not the **lottery of results**."  

  ---

  ### **8. What the Procedure Cannot Do**
  - **Policy Choices Required**:  
    - How much outcome *should* matter? (Here: max +1 band).  
    - What is "foreseeable"? (Here: anchored to *reasonable licensee* standard).  
  - **Limitations**:  
    - **Cannot eliminate discretion**: "Reasonable licensee" and "plausible worst outcome" require judgment.  
    - **Cannot override statute**: If law *requires* revocation for death (e.g., DUI fatalities), procedure adapts (Step 1 base becomes Band 5).  
    - **Cannot handle novelties**: Unknown risks (e.g., new technology) rely on expert testimony.  
  - **Changes Needed**:  
    - **Statute change** to cap outcome adjustments or define foreseeability.  
    - **Evidence standards** requiring "prior warnings" for full outcome adjustment.  

  ---

  **Procedure Summary**: Deliberately sparse—takes <15 minutes after case review. Written reasons use template:  
  > *"Conduct: [Step 1 finding]. Foreseeability: [Step 2/3]. Outcome Role: [Step 4 logic]. Sanction: [Band]."*  
  Legal counsel verifies alignment with statute and precedent.
