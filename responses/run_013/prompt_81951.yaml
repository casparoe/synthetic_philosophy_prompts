answer: |-
  ### 1. Essay Question  
  **"Consequentialism demands we 'maximise the good', but cluelessness suggests we cannot know an act's actual consequences (input cluelessness), nor even whether consequences *have* a determinate value (output cluelessness). Does distinguishing these problems show consequentialism remains action-guiding? Answer with reference to a case where both forms of cluelessness are total (e.g., buying a cup of tea). If 'maximise expected good' resolves input cluelessness but not output cluelessness, can consequentialism still meaningfully evaluate such an act?"**

  ---

  ### 2. Model Answer (First-Class, ~600 words)  

  Consequentialism’s core criterion—maximising the good—appears paralysed by cluelessness. The input/output distinction refines this challenge but ultimately exposes a deeper problem: without objective value composability, even idealised consequentialism loses normative force.  

  **Input cluelessness** stems from epistemic limits: we cannot trace causal chains to their endpoints (e.g., my tea purchase inadvertently funds a future innovation or catastrophe). This *is* mitigated by maximising *expected* good. By weighting outcomes by probability, we salvage guidance: buying tea might have a 0.1 expected utility if we predict modest local benefits outweighing negligible risks. Expected value calculations rescue action-guidance where causes are uncertain but values are clear.  

  **Output cluelessness** is more corrosive. Here, we hypothetically know all causal facts (e.g., every downstream effect of my tea purchase) yet cannot aggregate them into a verdict. Some effects are incomparably good (a child’s smile) and bad (a butterfly’s death); others involve moral uncertainty (was that smile exploitative?). If values don’t "add up" coherently, there’s no fact about whether the act maximised good. Crucially, *expected* good presupposes that possible outcomes *have* definite values to weight. If outputs resist valuation, expectations dissolve.  

  The Cup of Tea case makes this vivid. With both cluelessnesses total, consequentialism faces a dilemma. *Option 1*: insist that objective value exists independently of our capacity to measure it. But this renders the criterion inert—if we can’t access or compute value, "maximise good" is an empty imperative. *Option 2*: reduce "good" to what we can model (e.g., expected local effects). Yet this abandons objective consequentialism for a subject-relative shadow. When I buy tea, I might predict a slight pleasure boost. But if the unseen global cascade lacks evaluative coherence, grounding duty in *expectations* feels like dressing up guesswork as optimisation.  

  Does the input/output distinction save consequentialism? It reframes but doesn’t resolve. Input cluelessness is technical—a hurdle for agents. Output cluelessness is metaphysical—a challenge to the theory’s coherence. Consequentialism survives only by retreating: it can demand we *intend* to maximise expected good based on available evidence. But this concedes that the original criterion is non-operational. Worse, in total cluelessness, "available evidence" is trivial or arbitrary. My tea purchase’s expected good collapses to crude heuristics (e.g., "tea usually pleases buyers"), severing the link to actual consequences.  

  Ultimately, output cluelessness suggests consequentialism’s work is illusory in principle. If consequences lack objective totals, the theory cannot ground duties in outcomes alone. It must either incorporate non-consequentialist elements (e.g., constraints against risking incoherent harms) or admit that its criterion is aspirational—a regulative ideal with no practical traction in clueless contexts. The Cup of Tea thus becomes a quiet permission slip: act as you wish, so long as you hope for the best.  

  ---

  ### 3. Marking Scheme (Total: 20 marks)  
  **Must-hit moves:**  

  1. **Distinguish input/output cluelessness precisely** (4 marks).  
     *Common error:* Conflating epistemic (input) and metaphysical (output) problems.  
  2. **Explain how expected value addresses input cluelessness** (3 marks).  
     *Common error:* Claiming expected value solves cluelessness generally.  
  3. **Argue expected value *presupposes* solvable output cluelessness** (5 marks).  
     *A-grade essential:* Shows output cluelessness undermines expected value’s coherence.  
  4. **Apply distinction to Cup of Tea case** (4 marks).  
     *Common error:* Treating the case as purely about input ignorance.  
  5. **Confront whether "maximise expected good" is substantive or vacuous** (3 marks).  
     *A-grade essential:* Diagnoses vacuity if values are incomposable.  
  6. **Verdict on whether distinction rescues consequentialism** (1 mark).  

  **Grade boundaries:**  
  - **B (10–13/20):** Hits moves 1, 2, 4, and 6. May fudge move 3 (e.g., "expected value still works practically") or omit move 5’s depth.  
  - **A (14+):** *Must* hit move 3 (output undermines expectations) and move 5 (vacuity risk). Distinction refines but doesn’t resolve the objection.  

  **A-grade threshold:** Answers scoring 3+ on move 3 *and* 3 on move 5 (i.e., engaging metaphysics of value aggregation).  

  ---

  ### Key Design Notes  
  - **Crux:** Forces students to see that expected utility *assumes* value composability. Output cluelessness attacks this assumption, making expectations arbitrary where values are indeterminate.  
  - **Anti-recitation:** The Cup of Tea’s total cluelessness blocks rote replies about "doing our best". Students must confront whether "expected good" is meaningful absent objective good.  
  - **Asymmetry:** Input cluelessness is agential; output cluelessness is theoretical. The latter exposes consequentialism’s dependence on value realism.  
  - **British English:** "Whilst", "aggregate", "metaphysical challenge", "traction", "regulative ideal".
