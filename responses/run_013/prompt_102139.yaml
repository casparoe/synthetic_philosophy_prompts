answer: |-
  ### Philosophy of History Mock Examination  
  **Time Allowed:** 45 minutes  
  **Word Limit:** 800–1000 words  

  **QUESTION:**  
  Analyse the two explanations below for the collapse of a school debating society in 2019.  
  - **Explanation A**: "Whenever a voluntary society depends on a single organiser and that organiser leaves without a successor, the society collapses. The organiser left without a successor. Therefore, the society collapsed."  
  - **Explanation B**: "The organiser had been the society’s centre for a decade. The two members most likely to succeed her had fallen out. The school’s new timetable moved the society’s slot to a lunch hour clashing with orchestra. A single autumn recruitment drive failed by two members (three would have saved it). Had that drive succeeded by one more member, the society would have survived."  

  Address the following:  
  1. What *kind* of explanatory work does each explanation attempt?  
  2. Does Explanation B offer an explanation that Explanation A *lacks*? If so, what?  
  3. What *fundamental disagreement* about the nature of historical explanation must exist for these to be seen as rival explanations (rather than complementary answers to different questions)?  

  Focus on how each explanation handles *why the collapse occurred rather than survival*. Do not rehearse general debates about covering laws or narratives.  

  ---

  ### Model Answer (600 words)  

  **1. Explanatory Aims**  
  Explanation A adopts a *covering-law* structure. It identifies a general regularity (societies collapse without successor organisers) and applies it to a specific case (our debating society). Its goal is to show the collapse was *necessary* given the conditions. It answers: "Why did this event occur?" by demonstrating it was predictable under a law-like pattern. This treats explanation as eliminating surprise—if we accept the law, the outcome *had* to happen.  

  Explanation B constructs a *narrative*. It traces a sequence of contingent events (the fallout, timetable change, recruitment failure) to show why survival became impossible *in this unique case*. Crucially, it closes with a counterfactual: "Had recruitment succeeded by one, survival would have occurred." This shifts the question from "Why collapse?" to "Why collapse *rather than survival*?" It highlights *contingency*—the outcome depended on fragile, specific conditions.  

  **2. What Explanation B Adds**  
  Explanation B provides an account of *causal fragility* that A lacks. While A shows collapse was necessary *given* no successor, B explains why *no successor emerged* despite initial plausibility. It identifies:  
  - **Causal interference**: The timetable clash and recruitment failure *actively undermined* potential successors.  
  - **Threshold effects**: The narrow miss (falling short by two members) shows survival was *possible but unrealised* due to identifiable contingencies.  
  - **Alternative possibilities**: The counterfactual makes explicit that survival was a live option until the recruitment failed.  

  Explanation A cannot address this. Its law ("no successor → collapse") treats the *absence of a successor* as an unanalysed given. B, however, explains *why that absence occurred* by revealing how contextual factors closed off paths to succession. For philosophers like William Dray, this is "how-possibly" explanation—it shows *how survival became impossible* through a chain of disruptions.  

  **3. The Core Disagreement**  
  For A and B to conflict (rather than complement), their advocates must disagree on this: **Must historical explanation show why an outcome *had* to happen, or can it show why it happened *despite alternatives being possible*?**  

  - **The Necessity View (implied by A)**: To explain an event is to show it was *inevitable* under initial conditions and laws. Contingency (e.g., "it almost survived") is irrelevant—only what *did* happen needs explaining. If B’s details don’t alter the law (A still holds), they are mere description, not explanation.  
  - **The Contingency View (implied by B)**: Explanation requires showing *why the actual prevailed over the possible*. Historians like Paul Veyne argue that narratives explain by revealing "the crossroads where things could have been different" and why one path was taken. Here, B’s value lies in pinpointing *where and why survival failed*—a question A ignores.  

  This is unresolved in philosophy of history. Proponents of narrative (e.g., Arthur Danto) see contingency-tracing as essential; covering-law defenders (following Hempel) dismiss it as "merely psychological." The dispute is genuine because it stems from deeper aims: Is explanation about *causal determination* (A) or *causal discrimination* (B)—i.e., why *this* result, not *that* one?  

  **Conclusion**  
  Explanation A and B are rivals only if we see historical explanation as having a single goal. If explanation must show necessity, A suffices and B is ornamental. If explanation must account for contingency, B is essential and A is incomplete. Their incompatibility hinges on whether we demand answers to "Why necessarily?" or "Why actually, given other possibilities?"—a debate still active in philosophy.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  | **Criterion**                                                                 | **Marks** | **Common Pitfalls**                                                                 | **A vs. B Boundary**                                                                 |
  |-------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **1. Identifies distinct explanatory goals** (Necessity vs. Contingency)      | 5         | Merges aims; misreads A as "general" and B as "specific" without deeper purpose.    | **A (4-5)**: Explicitly contrasts "why happened" (A) vs. "why not alternative" (B). **B (3)**: Describes but doesn’t contrast aims. |
  | **2. Analyses what B adds** (Causal fragility/thresholds)                    | 5         | Lists B’s details without linking to *why A misses this* or threshold dynamics.    | **A (4-5)**: Argues B explains *why no successor emerged*; notes counterfactual’s role. **B (3)**: Notes details but not their explanatory function. |
  | **3. Articulates core disagreement** (Necessity vs. Contingency as aims)      | 5         | Cites "laws vs. narratives" generally; misses *why* aims conflict.                 | **A (4-5)**: Locates dispute in *what question explanation must answer*. **B (3)**: Identifies disagreement but not its root. |
  | **4. Engages philosophy** (References debates without oversimplifying)        | 3         | Name-drops (e.g., "Hempel vs. Dray") without connection; presents one view as consensus. | **A (3)**: Notes unresolved tension; avoids resolution. **B (2)**: Superficial/philosophy-free. |
  | **5. Structure & Clarity** (Logical flow; precise language)                  | 2         | Unfocused; conflates explanations; ignores word limit.                             | **A (2)**: Concise, answers all sub-questions. **B (1)**: Disorganised or incomplete. |

  **Key for A vs. B Answers**:  
  - **A (17–20)**: Explicitly frames the necessity/contingency tension; rigorously dissects how B addresses what A omits; roots disagreement in explanatory aims.  
  - **B (13–16)**: Correctly describes explanations and debate but lacks depth on *why* they conflict; may retreat to "laws vs. narratives" summary.  

  **Explicit Side-Taking in Model**: The conclusion presents the necessity/contingency divide as *a* defensible stance—not *the* answer—and notes the ongoing debate. Use **bold** in marking to show evaluative neutrality.
