      - Thus, no elimination occurs, and all strategies survive: row A, B, C and column L, R.  

  - **Rule 2: Iterative Strict Dominance Allowing Mixed Strategies (MixedDom)**  
    - **Description**: Mixed strategies can be used to dominate pure strategies. A strategy is eliminated if it is strictly dominated by some pure or mixed strategy, and elimination proceeds iteratively to a fixed point.  
    - **Fit with Games 1 and 2**:  
