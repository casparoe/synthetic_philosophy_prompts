answer: |-
  Fair challenge. The brake's permanence *does* risk entrapment for shifting majorities – that's the genuine cost of wielding a veto power against elite momentum. But recognize: entrapment is inherent in *any* binding decision procedure; legislatures enact durable laws too, often against shifting public sentiment. The unique value here is asymmetrical: the referendum empowers citizens to *refuse* unwanted impositions *at the moment of proposal*. That "No" is non-negotiable for elites; it forces them back to the drawing board. Yes, a subsequent majority may be stuck with an earlier "Yes" – but that's the ordinary friction of collective choice, not unique to referendums. The brake prevents the *initial imposition without consent*, which is the core harm the veto thesis guards against. The cost? We trade the risk of elite-driven imposition for the risk of policy rigidity under shifting preferences. I accept that cost because the former involves disempowerment, while the latter involves democratic regret – a lesser evil when safeguarding agency.
