prompt: |-
  So I've been reading this blog post about Aumann's agreement theorem and it's kind of doing a lot of work in my head right now, which makes me nervous, because I don't know enough to tell if the guy is giving me the real thing or a cartoon. His version goes something like this:

  "Aumann proved that two perfectly rational agents who start out sharing the same information can never end up disagreeing about anything, even in principle. If you and I look at the same evidence and reach different conclusions about, say, whether a coin will come up heads, then by Bayes' theorem at least one of us must have reasoned badly. The theorem's punchline is that persistent disagreement -- between economists, between doctors, between you and your uncle at Thanksgiving -- is proof that somebody is being irrational, and the only cure is to keep announcing your credences until the math forces you together. That's basically why prediction markets are so efficient and why real experts always converge."

  Something feels off but I can't put my finger on it. Can you go through it claim by claim? Which bits would someone who actually works on this stuff accept as fine, which are the standard simplifications that are forgivable in a blog post, and which are just false? And separately: does the punchline actually follow -- does the theorem really license "if we still disagree, somebody's being irrational," or is that smuggled in from somewhere else? I want to be able to tell when people are using this result as a cudgel versus when they're using it correctly.
