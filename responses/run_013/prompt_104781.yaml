answer: |-
  Here is the poem in the requested scholastic disputed question form, adhering strictly to Aquinas's principles on your specified case:

  **1. It seems a private hand may strike the blow,**
  For though the crown sits lawful on his brow,
  The tyrant gnaws the realm with vicious sway,
  And secret Senate, stripped of power today,
  Commits this act, their last command to heed.

  **2. On the contrary,** stands the ancient creed:
  No private man may judge the highest seat,
  Nor wield the sword that justice must complete;
  Only true public power can depose,
  Lest chaos reign where due authority goes.

  **3. I answer that** distinction must be made:
  The throne he holds by title, justly laid.
  But rule turned tyrant, crushing common grace,
  Forfeits the claim of subjects to obey his base
  Command. *Yet still*, to *lift* that burden dire
  Requires the hand invested with public fire.

  **4. Reply to Objection 1:** The tyrant's vice,
  Though deep and deadly, paid a fearful price
  To common weal, grants no license to the knife
  Held by a soul devoid of public life.
  Wrong suffered grants not right to judge and kill;
  That power resides beyond the private will.

  **5. Reply to Objection 2:** The Senate's plea,
  Though secret, sworn, holds no validity.
  Deposed, their public voice and charge are gone;
  They cannot grant what they no longer own –
  The sacred right to charge, to judge, to send
  The private fist where public powers end.

  ---

  **Key Aquinas Paraphrases in the Poem:**
  *   **Section 1:** Presents the arguments *for* tyrannicide based on the ruler's tyranny and the secret commission (the "strongest case").
  *   **Section 2:** States Aquinas's core principle (*sed contra*) that only public authority can judge and depose a ruler.
  *   **Section 3:** Makes the crucial distinction between the tyrant *by practice* (forfeiting obedience) and the tyrant *by title* (requiring *public* authority for removal). The "public fire" signifies legitimate authority.
  *   **Section 4:** Replies that suffering under tyranny, however grievous, does not itself confer the *judicial* authority to kill on a private individual.
  *   **Section 5:** Argues that the deposed Senate, having lost its *public* authority ("public voice and charge are gone"), cannot validly delegate the *public* act of tyrannicide ("cannot grant what they no longer own"). The "sacred right" refers to the jurisdictional authority Aquinas reserves for functioning public bodies.
