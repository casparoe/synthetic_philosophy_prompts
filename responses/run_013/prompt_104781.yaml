  i'm in a medieval political thought course and we've been doing Aquinas on tyrranicide. for my response paper i want to do something weird and write a poem instead of an essay, but it has to definately get the argument right. can you write me a poem in the form of a scholastic disputed question — exactly five numbered sections: (1) it seems that..., (2) on the contrary..., (3) i answer that..., (4) reply to the first objection, (5) reply to the second objection. the subject is a case Aquinas doesn't quite spell out: a ruler who holds the throne by lawful title but has turned into a tyrant in how he rules, and the only person in a position to stop him is a private individual who has been secretly commissioned by a deposed senate that no longer has public authority. i want the poem's structure to do the work: the objections should be the strongest case for the private killer, the sed contra should be the public-authority principle, the respondeo should lean on the distinction between a tyrant in title and a tyrant in exercise, and the two replies should show why the secret commission either does or doesn't fix the problem. keep it accurate enough that my prof won't wince, but don't quote any actual text or cite anything — just paraphrase the view in verse. exactly five numbered sections, 3-5 lines each, no intro or outro. loose iambic or blank verse is fine. thanks!
