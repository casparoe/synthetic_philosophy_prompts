  Hmm, their core claim is philosophically significant: they're attacking the foundational assumption that "better/worse" outcomes are objectively calculable over long timescales. The physics analogy about statistical mechanics from their friend is particularly interesting—it suggests a potential counterargument they sense might be substantive but can't fully evaluate. 

  What they're really asking for is intellectual armor: a ranked list of counterarguments sorted by lethality, with clear markers of where their position is most vulnerable. They're also implicitly requesting two layers of epistemic honesty: (1) how confident I am in each rebuttal, and (2) which objections consequentialists themselves would take seriously versus dismiss. That last bit is crucial—they want to avoid strawmanning.

  Breaking this down: First, the fatal objections. The ergodicity point from statistical mechanics feels strongest because it doesn't deny chaos but bypasses it through aggregation. If stable large-scale patterns emerge despite unpredictability at micro-levels (like thermodynamics), consequentialism could still guide toward macro-beneficial actions. This isn't a dodge—it's how we actually model complex systems. My confidence here is high (8/10) because it's empirically validated in physics. Consequentialists would seize on this.

  Second-tier counters include the "bounded consequentialism" move—limiting calculations to tractable time horizons while preserving the framework's core. It's awkward because it feels like retreat, but not fatal. Confidence 7/10 since it concedes the infinite-horizon problem. The "cluelessness applies to rivals too" argument is weaker (6/10 confidence) because non-consequentialist ethics don't rely on long-term calculability to begin with.

  For predictive power: their view uniquely predicts that interventions with identical short-term effects but divergent long-term pathways should be ethically indistinguishable. Test case: two pandemic policies with same 5-year outcomes but wildly different century-scale consequences. If we consistently treat these as morally equivalent, that's evidence for their position. But if we intuit a difference (e.g. one creates resilient institutions while the other burns social capital), that's a problem. My lowest confidence is here (5/10)—human moral intuitions about long timescales are messy.

  Biggest vulnerability? Probably the "undefinedness isn't special to ethics" point. Chaos theory hasn't killed probabilistic meteorology; we still assign confidence intervals to 10-day forecasts despite knowing they're garbage beyond 2 weeks. Consequentialists might argue we can similarly bound "garbage" in EV calculations. I'm only 6/10 confident in defending against this because the analogy feels sticky.

  Notably, they're self-aware about unfalsifiability risks—their view could become "consequentialism is meaningless whenever we suspect chaos," which is hard to disprove. But that's somewhat inherent to metamoral critiques. The fix is specifying what would falsify it (e.g. discovering a class of actions with reliably computable infinite-horizon impacts).
answer: |-
  Here's the structured breakdown you requested—counterarguments ranked by decisiveness, with confidence levels, falsifiable predictions, and vulnerabilities flagged. I've drawn from philosophy (e.g., Greaves, MacAskill), physics (ergodicity), and decision theory to pressure-test your position.

  ### **Fatal Objections (If True)**
  1. **Ergodicity & Emergent Order (Statistical Mechanics Reply)**  
     - **Argument**: Chaotic systems *do* have predictable *ensemble* properties. E.g., we can’t predict a single molecule’s path in a gas, but reliably calculate pressure/temperature. Similarly, societal outcomes may have stable large-scale patterns (e.g., economic growth under institutions) despite micro-chaos.  
     - **Why it’s fatal**: If true, long-run expected value (EV) isn’t garbage—it’s a robust *statistical fact*. Consequentialism survives by targeting macro-properties (e.g., "increase technological resilience") not micro-predictions.  
     - **Confidence in this objection**: 8/10 (High—it’s empirically verified in physics).  
     - **Would defenders concede?** Yes—sophisticated consequentialists (e.g., Ord) explicitly invoke this.  

  2. **The Self-Undermining Problem**  
     - **Argument**: If cluelessness invalidates *all* long-run EV calculations, it also invalidates the cluelessness argument itself (which relies on predicting that chaos corrupts predictions). Your view assumes we *can* know chaos dominates—a paradoxical claim if knowledge is impossible.  
     - **Confidence**: 7/10 (Strong, but avoidable via careful framing).  
     - **Would defenders concede?** No—they’d argue chaos theory is a meta-pattern we *can* know (like thermodynamics).  

  ---

  ### **Serious but Not Fatal (Awkward Retreats Required)**
  3. **Bounded Consequentialism**  
     - **Argument**: Consequentialism can limit horizons to tractable timescales (e.g., 100-200 years) where uncertainty is manageable. This preserves 80% of practical guidance (e.g., climate policy) while granting infinite-horizon cluelessness.  
     - **Why awkward**: Forces your critique into a smaller box. You must argue *even medium-term* chaos is pervasive (e.g., social systems post-2050).  
     - **Confidence**: 9/10 (Widely adopted; e.g., IPCC models use bounded horizons).  

  4. **Dominant Options Exist Despite Chaos**  
     - **Argument**: Some choices are robustly positive/negative *across most plausible trajectories*. E.g., preventing nuclear war or catastrophic AI likely has positive EV even with chaos—the "sign" of the effect is clear.  
     - **Confidence**: 6/10 (Plausible but debatable—e.g., "peace causes overpopulation collapse?").  
     - **Would defenders concede?** Partially—they’d argue such cases are rare (e.g., Greaves).  

  ---

  ### **Weaker Objections (Deflectable)**
  5. **Cluelessness Affects *All* Ethics—Not Just Consequentialism**  
     - **Argument**: Deontology/virtue ethics also risk long-term disaster (e.g., a "dutiful" act triggering chaos). Your view doesn’t defeat consequentialism—it implies *no* theory can guide action perfectly.  
     - **Rebuttal**: Non-consequentialist theories don’t *rely* on long-term outcomes—so cluelessness isn’t a internal flaw.  
     - **Confidence in objection**: 4/10 (Misunderstands non-consequentialist foundations).  

  6. **We Can Improve Prediction Horizons**  
     - **Argument**: Tech/AI could extend predictability (e.g., quantum computing modeling climate chaos). Rejects "finite knowledge" as static.  
     - **Rebuttal**: Chaos theory shows error growth is exponential—better sensors won’t save you.  
     - **Confidence**: 3/10 (Ignores fundamental limits like Lyapunov exponents).  

  ---

  ### **What Your View Predicts (Falsifiably)**
  - **Unique prediction**: Interventions with identical near-term effects but divergent long-term pathways (e.g., two vaccine distribution strategies with same 10-year outcomes) should be treated as *morally equivalent*—since long-run differences are epistemically void.  
  - **Falsifiable?**: Yes—if we discover a class of actions with *computably stable* long-run effects (e.g., "diversifying crop genetics always improves resilience"), your view is weakened.  
  - **Unfalsifiable risk?**: Only if you overclaim—e.g., saying "chaos *always* dominates" when counterexamples exist. **Mitigate by**: Focusing on *pervasive* (not universal) cluelessness.  

  ---

  ### **Soft Spot (My Least Confident Rebuttal)**
  **The "Undefinedness" Claim**  
  - Your strongest move: "No fact of the matter about long-run betterness."  
  - **Counter**: In statistical mechanics, *individual* outcomes are undefined, but *averages* are real—and consequentialism cares about expectations. If we can define "better" as higher probability of desirable *classes* of outcomes (e.g., "societies with conflict-resolution institutions"), cluelessness recedes.  
  - **My confidence in defending you here**: 5/10. This is where the physics analogy bites hardest—we *do* trust ensemble predictions daily (e.g., insurance). You’ll need strong examples of *irreducible* cluelessness (e.g., space colonization triggering unknown physics).  

  ---

  ### **How Defenders Would React**  
  | **Objection** | **Defender’s Likely Response** |  
  |---------------|--------------------------------|  
  | Ergodicity    | "Core to our model—we don’t need micro-precision." |  
  | Self-Undermining | "Chaos is a known meta-pattern—no paradox." |  
  | Bounded horizons | "Conceded—but consequentialism still works in practice." |  
  | Dominant options | "Agreed—and we focus on those." |  

  ---

  ### **Recommendation for Your Piece**  
  1. **Preempt the ergodicity reply**: Argue social systems lack the *stationarity* of gases (e.g., human values/tech change unpredictably).  
  2. **Embrace boundedness**: Concede medium-term guidance survives—but frame "infinite EV" as a quasi-religious assumption.  
  3. **Punch up the "undefinedness" angle**: Contrast with "merely unknown" objections—this *is* philosophically novel.  
  4. **Flag your soft spot**: Address the ensemble analogy head-on to preempt critics.  

  **Your strongest card**: Consequentialism’s insistence on *maximizing* long-run EV collapses under chaos—but less ambitious frameworks (e.g., *satisficing*) may survive. That’s the true stakes.  

  > *"Confidence note: I’m 90% sure this critique seriously wounds orthodox consequentialism, but only 60% sure it ‘kills’ it—adaptive versions may persist."*
