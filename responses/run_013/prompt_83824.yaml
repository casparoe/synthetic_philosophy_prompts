  Okay, let me approach this systematically. The user wants a clear set of desiderata for evaluating theories of Moore's paradox, with specific cases covered and constraints identified. 

  First, I need to map the core phenomena: omissive ("p but I don't believe p"), commissive ("I believe p but not-p"), plus all the variants mentioned - mental states, past tense, third-person, other attitudes, and those tricky additional cases about credences and collectives. Each case reveals something distinct about the absurdity.

  For desiderata, I'm considering several key requirements:
  1) The assertion requirement - the absurdity only surfaces in acts of assertion, not mere thought. Contrast cases like silently thinking the Moorean proposition show this is crucial. 
  2) Synchronicity constraint - past-tense versions ("p but I didn't believe p") aren't absurd because the belief disavowal isn't concurrent with the assertion. This kills theories that ignore temporal alignment.
  3) First-person immunity - third-person reports ("p but she doesn't believe p") lack absurdity because the speaker isn't implicated. Any theory must explain why indexicals matter.
  4) Attitude generalization - the phenomenon extends to other attitudes like knowledge ("p but I don't know p") or intention ("I'll do A but I don't intend to"), but with attitude-specific variations. Knowledge generates stronger absurdity than belief.

  The graded belief case ("likely p but my credence is low") is particularly interesting. It feels like the same core phenomenon but exposes that the issue isn't binary belief - theories must handle degrees. The collective cases are even trickier, especially the unified collective mind variant - if a committee chair says "we believe p but I don't," is that Moorean? Only if the "I" is speaking as the collective's voice.

  Now the hard part: identifying which desiderata are non-negotiable constraints versus theory-dependent. The assertion requirement and first-person constraint seem universal; any theory must account for them. But whether the attitude generalization requirement is binding depends on whether you see Moore's paradox as belief-specific or applying to a class of attitudes.

  The biggest challenge is the synchronicity constraint - many popular theories (like simple self-falsification accounts) fail because past-tense variants aren't absurd. And the attitude generalization requirement rules out narrow belief-focused accounts.

  For conflicts, the trickiest tension is between the assertion requirement and the commissive variant's consistency: "I believe p but not-p" is logically possible but absurd to assert. Pure pragmatic accounts struggle with this, while semantic accounts stumble on the third-person cases. 

  Ultimately, the synchronicity constraint does the most heavy lifting in ruling out inadequate theories. If an account can't explain why "p but I didn't believe p" isn't absurd, it's fundamentally flawed. The graded belief and collective cases add dimensionality but don't alter the core requirements - they just test the theory's flexibility.
answer: |-
  Here is a systematic specification of desiderata for any adequate account of Moorean absurdity, grounded in paradigmatic cases and contrasts. The requirements are distilled from the phenomena themselves, not pre-theoretic commitments.

  ### Core Desiderata (Non-Negotiable Constraints)
  1.  **The Assertion Requirement**
      *   **Case:** Omissive ("p, but I don't believe p") and commissive ("I believe p, but ~p") forms are absurd *when asserted*. The same content entertained as a thought ("Hmm, p is true but I don't believe it yet") or believed (e.g., during recovery from aphasia) lacks absurdity.
      *   **Motivation:** The absurdity is inherently tied to the *speech act* of assertion. A theory must explain why *saying* it is defective, while merely thinking or holding the belief is not inherently defective.
      *   **Forfeiture:** Failure reduces the paradox to a logical contradiction, ignoring its pragmatic essence. Any account not centered on assertion misses the core phenomenon.

  2.  **The Synchronicity Constraint**
      *   **Case:** Past-tensed variants ("The meeting *was* at three, but I *didn't believe* it was") or belief reports about past selves ("p, but back then I didn't believe p") are not absurd. The absurdity drains away.
      *   **Motivation:** The tension requires the disavowed belief-state (omissive) or the incompatible asserted state (commissive) to be *concurrent* with the act of assertion. Temporal separation resolves the conflict.
      *   **Forfeiture:** Failure renders the account unable to explain the crucial difference between present and past self-ascription, conflating distinct phenomena.

  3.  **First-Person/Indexical Immunity**
      *   **Case:** Third-person variants ("The meeting is at three, but Alice doesn't believe it is") are coherent and non-absurd. They are ordinary (and often true) belief reports.
      *   **Motivation:** The absurdity is uniquely tied to the first-person present indicative. The speaker cannot coherently distance themselves from their *own current* belief state while simultaneously making an assertion.
      *   **Forfeiture:** Failure conflates the speaker's privileged access to their own current commitment (via assertion) with their descriptive access to others' minds, ignoring the essential role of the indexical 'I' and present tense.

  4.  **The Commissive Consistency**
      *   **Case:** The commissive form ("I believe p, but ~p") is logically consistent (it describes a state of error) yet absurd to assert.
      *   **Motivation:** An adequate theory must explain why asserting a *logically possible* state (being mistaken) is absurd *in this specific form of self-ascription*. The absurdity cannot stem from logical falsity alone.
      *   **Forfeiture:** Failure leaves the commissive paradox unexplained (or misdiagnosed as contradiction) and cannot account for the asymmetry with merely *thinking* one is mistaken.

  ### Generalization Desiderata (Revealing Depth, Potentially Theory-Dependent)
  5.  **Attitude Generalization**
      *   **Cases:**
          *   *Knowledge:* "p, but I don't know p" (absurd - assertion implies knowledge claim). "I know p, but ~p" (absurd - implies infallibility).
          *   *Intention:* "I will φ, but I don't intend to φ" (absurd). "I intend to φ, but I won't φ" (less clearly absurd? But "I promise to φ, but I won't φ" is paradigmatically absurd).
          *   *Desire:* "It's raining, but I don't want it to be raining" (not absurd - assertion doesn't express desire). "I want it to rain, but it isn't raining" (not absurd - desire doesn't entail truth).
          *   *Memory:* "p happened, but I don't remember p happening" (often odd, but not *Mooreanly* absurd - akin to past-tense). "I remember p happening, but ~p" (absurd - implies memory is factive).
      *   **Motivation:** Reveals the link between the absurdity and the nature of the attitude and its relationship to assertion. Assertion inherently expresses (or purports) *doxastic commitment* (belief/knowledge) or *practical commitment* (intention/promise). Attitudes like desire lack this constitutive link.
      *   **Forfeiture:** Failure suggests an overly narrow focus on belief, missing deeper connections to speech acts and the commitments they entail. An optimal theory explains *which* attitudes generate Moorean absurdity and *why* (e.g., factivity, expression-commitment link).

  6.  **Graded Attitude Constraint (Crucial for Your Case)**
      *   **Case:** "It is very likely to rain, but my credence that it will rain is low."
      *   **Motivation:** This *is* Moorean absurdity, distinct from contradiction. Asserting "very likely p" expresses a high degree of confidence. Simultaneously disavowing high confidence ("my credence is low") creates the same pragmatic clash: the assertion *expresses* a cognitive state (high confidence) that the speaker explicitly denies holding. The oddity stems from the same source: expressive commitment vs. explicit denial.
      *   **Forfeiture:** Failure to accommodate this conflates Moorean absurdity with logical contradiction. A theory must explain the clash in terms of the *expressive commitment* of assertion regarding the speaker's *attitudinal state*, not just binary belief. This rules out overly simplistic accounts tied only to binary truth-commitment.

  7.  **Collective Agent Requirement (Crucial for Your Case)**
      *   **Cases:**
          *   *Aggregate Collective (Committee):* "The committee thinks the deadline is Friday, but I (the chair) don't think it is Friday." **Not Mooreanly absurd.** The 'I' speaks as an individual member, not *as* the committee. The assertion reports the group belief, not the chair's individual belief. No clash for the chair as speaker.
          *   *Unified Collective Mind (Hypothetical):* "We (as a single agent) believe p, but we do not believe p" or "p, but we (as a single agent) do not believe p" **would be Mooreanly absurd** *if asserted by an agent authorized to speak *as* that collective agent.*
      *   **Motivation:** Reinforces the **First-Person/Indexical Immunity (D3)** and the **Assertion Requirement (D1)**. The absurdity arises only when the speaking agent (whether individual or collective) uses the first-person indexical *to refer to itself as the agent making the assertion* and concurrently disavows the cognitive state expressed by that assertion. For aggregates, the speaking individual typically isn't asserting *as* the collective agent unless specifically authorized to voice *its* view. The harder unified collective case shows the key is the *identity of the asserting agent* and its self-ascription, not metaphysical composition.
      *   **Forfeiture:** Failure risks mislocating the absurdity in the content alone or the speaker's biological individuality, rather than in the self-referential commitment of the *asserting agent*. A theory must tie absurdity to the agent whose commitment is expressed by the assertion.

  ### Critical Tensions & Ruling-Out Power
  *   **The Irreconcilable Tension:** Satisfying **D1 (Assertion Requirement)** and **D3 (First-Person Immunity)** fully while also satisfying **D4 (Commissive Consistency)** is the primary battleground. Pure semantic accounts (focusing only on truth-conditions/entailments of the *proposition* asserted) struggle mightily with D4 (commissive is consistent) and D3 (third-person is fine). Pure pragmatic accounts (focusing only on conversational norms/Gricean maxims) struggle to explain the *unique, inescapable* nature of the absurdity and its resistance to contextual cancellation in a way that distinguishes it from mere pragmatic infelicity. Hybrid accounts are almost inevitable.
  *   **The Most Damaging Requirement:** **D2 (Synchronicity Constraint)** does the most to rule out popular accounts. Many simplistic explanations (e.g., "You can't assert p while denying you believe it because asserting p just *is* expressing belief!") fail spectacularly here. If asserting p *just is* expressing belief *now*, then past-tensed "p but I didn't believe it then" should *still* be absurd (because the speaker *now* is expressing belief *now* while reporting past disbelief). But it isn't absurd. Any account that cannot explain why the absurdity vanishes when the disavowed belief is shifted to the past is fundamentally inadequate. This sinks many intuitive but underdeveloped "expression" accounts.

  **Conclusion:** An adequate theory must center on the act of assertion by an agent and its inherent expression of that agent's concurrent cognitive commitment (D1, D2, D3). It must explain why explicitly denying that very commitment creates an inescapable pragmatic contradiction, even when the *propositional content* is consistent (D4). It must generalize to attitudes where assertion inherently expresses that attitude (D5), including graded versions (D6). It must apply to any asserting agent capable of self-reference, individual or collective (D7). Failure on D2 (Synchronicity) is the most common fatal flaw, while the tension between D1/D3 and D4 defines the core theoretical challenge between pragmatic and semantic commitments. The graded (D6) and collective (D7) cases reinforce that the core is the agent's *self-ascription of the state expressed by their own assertion* at the time of speaking.
