  The heap-test oracle scenario is brilliant. User's nailed the core metaphysical rift: Is vagueness in the world (epistemicism) or in our concepts (supervaluationism)? Supervaluationists would say the question itself is malformed for borderlines - like asking "is blarf a verb?" when "blarf" isn't a word. But epistemicists think it's a legit question with a secret answer. 

