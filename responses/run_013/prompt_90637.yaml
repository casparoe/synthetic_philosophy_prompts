answer: |-
  You're drilling into the exact nerve points where these theories genuinely clash. Forget textbook summaries – here's the raw, substantive friction:

  ### 1. Are they just notational variants? (Spoiler: No)
  Your friend is wrong. The core disagreement is **metaphysical**, not linguistic. Consider this scenario:
  - **Epistemicism:** There exists a *specific grain* such that removing it turns Heap N into Not-Heap N-1. This is a fact, but unknowable.
  - **Supervaluationism:** No such *specific grain* exists. Any precisification draws *a* line, but which line it draws depends on the precisification chosen. The world itself lacks a privileged cutoff.

  **Sharp Disagreement: The "Cutoff Grain" Question**  
  Ask: *"Is there a specific grain G such that Pile X with G is a heap, but Pile X without G is not?"*  
  - **Epistemicism:** **YES.** One specific grain *is* the unknowable cutoff point.  
  - **Supervaluationism:** **NO.** Different precisifications place the cutoff at different grains. No *single grain* G has that status across all admissible precisifications.  

  *Observable Difference?* Not directly, because both agree we can't *find* G. But the disagreement is about the *structure of reality*: does a precise fact exist (even if hidden), or is precision a fiction we impose? This isn't dressing – it's a chasm.

  ### 2. The Oracle Test: Where the Rubber Meets the Road
  - **Epistemicism:** The oracle **gives a definite "Yes" or "No".** It knows the hidden fact. The borderline case is *objectively* a heap or not, even if we're ignorant. The question has a bivalent answer.
  - **Supervaluationism:** The oracle **cannot answer "Yes" or "No".** The question "Is this borderline pile a heap?" **lacks a truth value.** It's not that the oracle is "stumped" by a hard question; the question itself *has no answer* in reality. The oracle might say "That question has no determinate truth value" or remain silent. It might even list admissible precisifications where it's "Yes" and others where it's "No".

  **Why this matters:** This shows the **fundamental divide on bivalence**. Epistemicism preserves bivalence (every declarative sentence is true or false) for vague predicates, even if we can't access it. Supervaluationism *rejects* bivalence for borderline cases. The oracle scenario forces this ontological commitment into the open.

  ### 3. Higher-Order Vagueness: Supervaluationism's Achilles' Heel?
  - **Epistemicism:** **"Shrugs" (Elegantly).** "Definitely P" just means P is true (on the epistemic view). "Definitely definitely P" is redundant; it just means P is true. Higher-order vagueness is just *more ignorance* about the locations of the (still sharp) boundaries defining "definitely". No collapse, just nested unknowability.
  - **Supervaluationism:** **Genuine Problem.** Defining "Definitely P" as "True on all admissible precisifications" creates trouble. What makes a precisification "admissible"? There's usually vagueness *there too* (e.g., how similar must precisifications be?). The standard semantics often **collapses higher orders** or requires infinitely many precisifications to model indefinite definiteness. Some fixes exist (e.g., "penumbral connections"), but they're complex and arguably ad hoc. Critics argue it fails to capture the intuitive *smoothness* of higher-order vagueness.

  **Scorecard:** Epistemicism handles this **far more cleanly**. Its "ignorance all the way down" is ontologically simpler, even if metaphysically jarring. Supervaluationism's attempt to model definiteness *within* its framework creates significant technical and philosophical hurdles.

  ### 4. The Core Disagreement & Which is More Defensible?
  **The Real Fight:** You nailed it. The core disagreement **isn't primarily about solving the Sorites** (both reject the tolerance premise). It's about **the nature of reality and truth in borderline cases**:
  - **Epistemicism:** Vagueness is **ignorance**. Reality is precise. Logic is classical, bivalence reigns. Borderline cases *do* have a fact of the matter.
  - **Supervaluationism:** Vagueness is **semantic indecision**. Reality (or our conceptual scheme) is *inherently* indeterminate for borderline cases. Bivalence fails, replaced by super-truth (truth-on-all-ways-of-making-precise).

  **Where Epistemicism is (Arguably) Defensible & Supervaluationism Falters:**
  1.  **Simplicity & Classical Logic:** Epistemicism preserves classical logic and bivalence without modification. Supervaluationism needs a whole new truth concept (super-truth) and loses the law of excluded middle for borderline claims (e.g., "This is a heap or not a heap" isn't *super-true* if it's borderline).
  2.  **Higher-Order Vagueness:** As above, epistemicism avoids the technical quagmire supervaluationism faces.
  3.  **Intuition about Cutoffs:** While sharp cutoffs seem *counterintuitive*, epistemicism argues this intuition stems from *ignorance*, not metaphysical indeterminacy. We *expect* boundaries to be fuzzy because we can't know where they are.
  4.  **The Oracle:** Epistemicism gives a clear account of what the oracle does. Supervaluationism's account feels less satisfying – the oracle can't answer a seemingly meaningful question.

  **Where Epistemicism is (Arguably) Wrong & Supervaluationism Excels:**
  1.  **The Abhorrence of Sharp Cutoffs:** The idea that *one grain* makes the categorical difference between heap and non-heap seems deeply implausible and arbitrary. Supervaluationism captures the intuitive *lack* of a privileged, precise boundary. Epistemicism dismisses this intuition as mere ignorance.
  2.  **Meaning & Use:** Supervaluationism better reflects how vague predicates *work*. We don't *use* "heap" as if there's a hidden sharp boundary; we accept that borderline cases resist bivalent classification. Our linguistic practice suggests truth-value gaps, not hidden facts.
  3.  **Penumbral Connections:** Supervaluationism naturally handles truths like "If pile A has more grains than pile B and A is not a heap, then B is not a heap" – these come out *super-true* without needing to know any cutoffs. Epistemicism struggles to explain why such conditionals seem necessarily true *without* referencing the hidden boundary.

  **The Bottom Line (My Take):**
  *   **Epistemicism's** strength is its **logical austerity** and **ontological simplicity** (reality is precise). Its fatal flaw is the **metaphysically repugnant sharp cutoff** – it demands we accept that reality draws infinitely precise lines where none seem plausible.
  *   **Supervaluationism's** strength is its **respect for linguistic intuition** – it models the genuine indeterminacy we experience with vague terms. Its fatal flaw is the **technical nightmare of higher-order vagueness** and the need for a non-classical concept of truth.

  **Which is more defensible?** It depends on what you value most:
  *   If preserving **classical logic and bivalence at all costs** is paramount, epistemicism wins (though it feels counterintuitive).
  *   If capturing the **phenomenology of vagueness and avoiding sharp cutoffs** is paramount, supervaluationism wins (though it gets messy technically).

  **Neither wins cleanly.** The debate persists because both grapple with deep tensions: between logic and intuition, precision and indeterminacy. Your focus on the "oracle" and "cutoff grain" questions gets to the heart of it – these force the underlying metaphysical commitments into the open, showing they are **not just verbal disagreements**. The disagreement is about whether borderline cases represent a *gap in our knowledge* or a *gap in the world (or our concepts)*. That's as fundamental as it gets.
