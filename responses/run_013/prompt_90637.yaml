  Personal take? User wants blood, so I'll give it: Supervaluationism's higher-order problems feel fatal, but epistemicism's sharp cutoffs are revolting. Neither wins clean. Maybe suggest field's moving toward contextualism or degree theories? But they asked for this duel, so... epistemicism's consistency with classical logic might edge it out, even if it feels wrong.

