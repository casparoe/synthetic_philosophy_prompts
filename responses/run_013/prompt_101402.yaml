  ### Scoring Key  
  Tally your answers, then match the letter pattern to your result below:  

  | Answer Pattern (a/b/c counts) | Result                                                                                              |  
  |-------------------------------|-----------------------------------------------------------------------------------------------------|  
  | Mostly **b** (Q1,2,3,5,7,8)  | **Pleasures share one core feeling or dimension.** <br> They all tap into the same "good" vibe (like different flavors of sweetness), even if details differ. |  
  | Mostly **a** (Q1,3,4,6,8,9)  | **Pleasure is an attitude—being *pleased about* something.** <br> It’s not a feeling; it’s your response to things (e.g., satisfaction with water, amusement at a joke). |  
  | Mostly **c** (Q4,5,6,7,9)    | **Pleasure is whatever makes you *want more*.** <br> It’s defined by motivation: scratching, spicy food, or warm baths keep you coming back. |  
  | Mostly **a/b/c mix** (no clear majority) | **Pleasures share no single thing—only family resemblances.** <br> Like "games," they overlap in loose ways (e.g., relief, joy, satisfaction), but there’s no core thread. |  

  #### Notes on Results  
  - **What the quiz *can’t* tell apart:**  
    - *"Core feeling" (b) vs. "One dimension" (not listed).* Both agree pleasures feel "good" in a unified way. The quiz groups them because cases like thirsty water (Q1b) and laughing (Q2a) treat "good" as a common anchor.  
    - *"Family resemblance" (mix) vs. "Deflationary" (not listed).* Both reject a common core. The quiz doesn’t split them because nobody naturally insists on the subtle difference (e.g., "scratching an itch isn’t *like* laughing, but I don’t care why").  
  - **"Incoherent" views the quiz ignores:**  
    - *"Pleasure is a core feeling **and** just a motivation."* These contradict (feelings ≠ drives).  
    - *"Pleasure is an attitude **and** a core feeling."* Attitudes aren’t sensations.  
    *(These combos are rare—people intuitively avoid them.)*  

  ---

  ### How to Use  
  1. Have friends take the quiz.  
  2. Share results using the scoring key.  
  3. Debate! (e.g., *"You think sore muscles are about wanting more? But what about when it hurts?"*)  

  No philosophy jargon needed—just real cases!
