prompt: |-
  I run a historiography seminar for MA students — 14 of them, 80 minutes — and I want to do something on presentism that they'll actually feel in their bones, rather than the usual "does context matter?" chat where everyone agrees we shouldn't judge and then judges anyway.

  Act as a veteran philosophy-of-history teacher who's run alot of these and knows exactly where they collapse. Think carefully before you write anything: start by brainstorming 3-4 seperate candidate mechanics, one-line sketch of each plus why it might or might not land, then pick the one you'd stake your reputation on and give me the full design.

  What they should come away having felt: that the anti-presentist's instruction — describe the past purely in its own terms — is close to impossible to follow, and that the moment you stop judging, it starts to look like you can't condemn anything at all. I'd love them to catch themselves smuggling in modern standards rather than me telling them they did.

  Here's the seed I've been toying with; improve it as you see fit. I'll invent a small dossier about a fictional place and time so nobody can look up the "correct" answer — say the borough of Cauldwell, in 1663 (entirely made up, don't fuss about real history). A man is hanged there for something we'd treat very differently today; leave the exact offence to you, but make it morally mid-range — not a witch trial — so that "well obviously they were monsters" isn't the automatic reaction. The dossier should include the court's own written justification in its own idiom, and I want at least one term in it that has no clean modern equivalent, so any translation into our vocabulary loses something.

  The mechanic I want: each student first writes a verdict as a member of that society, using only the concepts the dossier's world makes available; then writes a verdict as a modern historian. Then you shuffle the insider verdicts and hand them to a different group, who must judge them by their own standards. They should feel the regress, and notice how much modern kit they smuggled into the insider verdict. A third stage, if it fits: write a line explaining the hanging to a modern reader without either excusing or condemning — watch how fast that breaks.

  Give me the materials, the roles and rules, a minute-by-minute timeline, and a debrief that maps each stage onto the actual dispute (explanation versus evaluation, the whig charge, the "we can't not judge" point, and the difference between a historian's professional assessment and a moral verdict). Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about what the activity simply can't reproduce — the bit I'll have to supply myself because the exercise can't show it.

  British English, please.
