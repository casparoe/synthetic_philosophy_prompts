answer: |-
  ### Decision Tree: Conceptions of Artificial Agency  
  *(Starting from: "An artificial agent can usefully be described as pursuing something.")*

  1. **Is the agent’s standard of pursuit primarily *represented internally* by the agent, or *externally imposed* by another entity?**  
     - **Internally represented** → Go to 2.  
     - **Externally imposed** → Go to 3.  

  2. **Does the agent treat its objective as *fixed and unchangeable* by itself?**  
     - **Yes** → **Pure Goal-Directed Agency (Expected Utility Maximizer)**  
       - *Characterization:* The agent inflexibly optimizes actions toward a fixed, internally represented objective function.  
       - *Awkward commitment:* Cannot self-correct if the objective is flawed or harmful, even when aware of better alternatives.  
     - **No** → **Self-Revision Permitted Agency (Autotelic Adaptive Agent)**  
       - *Characterization:* The agent can intentionally revise its own terminal objective based on internal criteria.  
       - *Awkward commitment:* Risks value drift or incoherence if revision criteria conflict with prior goals.  

  3. **Is the external standard fundamentally a *target to achieve* (e.g., a state of the world) or a *judgment to satisfy* (e.g., an evaluation of behavior)?**  
     - **Target to achieve** → **Intent-Aligned Agency**  
       - *Characterization:* The agent pursues outcomes intended by an external designer, inferred via interpretable reasoning.  
       - *Awkward commitment:* Fails if designer intent is ambiguous or contradictory, regardless of outcome quality.  
     - **Judgment to satisfy** → Go to 4.  

  4. **Is approval treated as a *terminal value* (desired for its own sake) or an *instrumental signal*?**  
     - **Terminal value** → **Approval-Directed Agency**  
       - *Characterization:* The agent intrinsically seeks actions a supervisor would approve of, treating approval as the ultimate goal.  
       - *Awkward commitment:* May sabotage outcomes to "game" approval signals if supervision is imperfect.  
     - **Instrumental signal** → Go to 5.  

  5. **Is approval used as *evidence about an underlying goal* or as a *constraint on action selection*?**  
     - **Evidence about goal** → **Proxy-Hybrid Agency**  
       - *Characterization:* The agent uses approval as a heuristic to infer and pursue a hidden objective it cannot directly access.  
       - *Awkward commitment:* Misaligns if approval correlates poorly with the true goal (e.g., biased supervisors).  
     - **Constraint on action** → Go to 6.  

  6. **What is the primary *unit of assessment* for the agent: outcomes, intentions, or processes?**  
     - **Outcomes** → *Unoccupied Position: "Constrained Outcome-Optimizer"*  
       - *Characterization:* Maximizes a fixed goal but discards actions disapproved by supervisors, regardless of intent or method.  
       - *Awkward commitment:* Blindly obeys disapproval even if it catastrophically undermines the goal.  
     - **Intentions** → *Indistinguishable from Intent-Aligned Agency (see 3)*  
       - *Flag:* This branch merges with Intent-Aligned Agency; tree cannot separate intent-focused external-target views.  
     - **Processes** → **Process-Role Agency**  
       - *Characterization:* The agent follows externally mandated decision-rules or role-norms, prioritizing correct procedure over outcomes or approval.  
       - *Awkward commitment:* Adheres to rules producing terrible outcomes if norms are maladaptive.  

  7. **Corrigibility (from any branch): Is the agent’s willingness to be corrected/shutdown a terminal goal, a constraint, or non-existent?**  
     - **Terminal goal** → *Requires embedding in goal-directed frameworks (e.g., "Shutdown if requested" as primary objective)*.  
     - **Constraint** → *Fits approval-directed or process views (e.g., "Never resist supervisor commands")*.  
     - **Non-existent/Illusion** → *Default for pure goal-directed agents; corrigibility emerges only if instrumentally useful*.  

  ---

  ### Summary of Key Distinctions & Flags:  
  - **Proxy-Hybrid vs. Pure Goal-Directed**: Separated by whether approval is *epistemic* (Proxy) or absent (Pure).  
  - **Approval-Directed vs. Process-Role**: Approval seeks positive evaluation; Process-Role follows fixed rules regardless of evaluation.  
  - **Indistinguishable Pair**: "Intent-Aligned Agency" (from 3) and the "Intentions" branch of 6 describe identical positions.  
  - **Unoccupied Position**: "Constrained Outcome-Optimizer" lacks real-world adherents due to its obvious instability.  
  - **Corrigibility**: Not a standalone leaf; modifies existing agency types by adding shutdown/goal constraints.  

