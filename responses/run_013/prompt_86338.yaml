prompt: |-
  Ok, longtime reader of the rationalist blogs here (I was lurking back when every other post was about decision theory), and I've got a puzzle plus a writeup of it that I want to sanity-check. I know this stuff well enough to smell when something's off, but not well enough to say exactly where.

  The puzzle, as I have it: you're driving home and there are two intersections on the route, and at each one you can either turn off or keep going. Turning off at the first one gets you 0. If you keep going you reach the second, where turning off gets you 4, while continuing past it leaves you stuck in a bad neighborhood for 1. The gimmick is that you're "absent-minded": when you arrive at an intersection you can't tell whether it's the first or the second, they're indistinguishable to you, so whatever you do at one you'd do at the other.

  A blogger I read summarized it like this, and I want to know how much of it to trust:

  "This is the absent-minded driver problem. The surprising answer is that the driver should randomize: he continues with probability 2/3 and turns off with probability 1/3, which earns him an expected 4/3, better than always continuing (1) or always turning off (0). Since he turns off with probability 1/3, he makes it to the good outcome about a third of the time. The puzzle is meant to be deep, but really it's just about a guy who's forgotten where he is — a real driver would leave himself a note or check his phone and the whole thing dissolves. What's actually interesting is the inconsistency. If you reason act by act, at the first intersection you should obviously continue (turning off gets you 0) and at the second you should obviously turn off (4 beats 1), and if you did that you'd earn 4, better than any plan you can actually execute. So expected utility maximization gives contradictory advice here, which is why it's a classic argument that you have to stop evaluating acts and start choosing a policy, and why people say this is really just Newcomb's problem in disguise and that what you need is something like UDT. He'd do even better if he could commit to a plan in advance, which is the general lesson: don't ask what to do, ask what kind of agent to be."

  So, claim by claim: what would a decision theorist sign off on, what would they wince at, and what's just wrong? And does the "expected utility maximization gives contradictory advice" conclusion actually follow from the parts of the summary that are true? I'm definately suspicious of the note thing and even more suspicious of the jump to UDT, but I can't articulate why, so I'd rather you show me where the actual joints are. I've thought about it alot and keep going in circles. No need for citations or reading lists — I just want the reasoning laid out.
reasoning: |-
  We are given the absent-minded driver problem. The driver faces two identical intersections. The payoffs are:
  - Turn off at the first intersection: 0.
  - Turn off at the second intersection: 4.
  - Continue past both: 1 (stuck in a bad neighborhood).

  The driver cannot distinguish the intersections and must use the same strategy at both. The strategy is a probability p of continuing (so 1-p is the probability of turning off).

  We can model the outcomes:

  - With probability 1/2, the driver is at the first intersection (if we assume each intersection is equally likely to be encountered first? Actually, note: the driver starts at the first and then, if continues, goes to the second. So the events are sequential, but the driver does not know which one he is at. However, the driver's strategy is fixed and applied at both.

  Let's compute the expected utility:

  There are two intersections. The driver starts at the first. If he turns off at the first (with probability 1-p), he gets 0 and the trip ends. If he continues (with probability p), he then arrives at the second intersection. At the second intersection, again he will turn off with probability 1-p (getting 4) or continue with probability p (getting 1).

  So the expected utility is:

  EU = (1-p) * 0   +   p * [ (1-p)*4 + p*1 ]

  Simplify:

  EU = 0 + p * [4(1-p) + p]
     = p * [4 - 4p + p]
     = p * (4 - 3p)
     = 4p - 3p²

  We want to maximize EU with respect to p in [0,1]. This is a quadratic function in p: f(p) = -3p² + 4p.

  Taking the derivative: f'(p) = -6p + 4.
  Setting to zero: -6p + 4 = 0 => p = 4/6 = 2/3.

  Second derivative is -6 (negative) so it's a maximum.

  At p=2/3, EU = 4*(2/3) - 3*(2/3)^2 = 8/3 - 3*(4/9) = 8/3 - 12/9 = 8/3 - 4/3 = 4/3.

  Now, let's check the alternatives:

  - Always turn off (p=0): EU = 0.
  - Always continue (p=1): EU = 4*1 - 3*1² = 4-3=1.
  - The randomized strategy with p=2/3 gives 4/3 ≈ 1.333, which is better.

  So the blogger's summary of the optimal strategy and its expected payoff is correct.

  Now, let's consider the "inconsistency" part. The blogger says:

  "If you reason act by act, at the first intersection you should obviously continue (turning off gets you 0) and at the second you should obviously turn off (4 beats 1), and if you did that you'd earn 4, better than any plan you can actually execute."

  But note: the driver cannot distinguish the intersections. So if he were at the first intersection and knew it was the first, then indeed he would continue. And if he were at the second and knew it was the second, he would turn off. But the problem is that he doesn't know which one he is at. So he cannot condition on that.

  The blogger claims that expected utility maximization gives contradictory advice. However, note that the standard expected utility maximization at a node requires knowing the state (i.e., which intersection you are at). Since the driver doesn't know, he cannot condition on the state. Therefore, the "act by act" reasoning is not available to him. Instead, he must choose a policy (a single probability p) in advance.

  So the apparent contradiction arises because if the driver could condition on the state, he would get 4, but he cannot. Therefore, the maximization must be done over policies, not acts at each node.

  Now, what about the blogger's conclusions?

  - "Expected utility maximization gives contradictory advice here": This is a bit misleading. In the standard sense of expected utility theory (with perfect information), there is no contradiction because the driver doesn't have the necessary information to condition on. The theory doesn't break; it just requires a different approach when information is imperfect. We use a policy that maximizes expected utility given the information constraints.

  - "which is why it's a classic argument that you have to stop evaluating acts and start choosing a policy": This is a valid point. In situations of imperfect recall or imperfect information, we must choose a strategy (a policy) that tells us what to do in each situation we might face (even if we don't know which situation we are in) and then maximize the expected utility over the entire decision tree.

  - "and why people say this is really just Newcomb's problem in disguise": There is a connection to Newcomb's problem in the sense that in Newcomb's problem, the agent is also choosing a policy (whether to one-box or two-box) and the outcome depends on a prediction of that policy. In the absent-minded driver, the outcome at the first intersection affects the second (in the sense that if you turn off at the first, you never get to the second) and the same policy is applied at both. However, the problems are distinct. Newcomb's problem involves a predictor and dominance reasoning, while this problem involves imperfect recall. But both can be seen as arguments for policy-based decision making.

  - "and that what you need is something like UDT": UDT (Updateless Decision Theory) is a decision theory that chooses policies without updating on information that might be correlated with the state of the world in a way that could lead to suboptimal decisions. The absent-minded driver problem is often discussed in the context of UDT because UDT recommends choosing a policy without updating on the current state (since the driver cannot distinguish the states). However, note that even without UDT, we can solve this problem by maximizing the expected utility of a policy (as we did above) without requiring a full-blown UDT. But the problem does highlight the need for a policy-based approach.

  - "He'd do even better if he could commit to a plan in advance, which is the general lesson: don't ask what to do, ask what kind of agent to be.": This is true. If the driver could commit to a plan that conditions on the intersections (i.e., turn off at the second but not at the first), he would get 4. But he cannot because he doesn't know which intersection he is at. So without that ability, the best he can do is 4/3. The lesson is that sometimes we must commit to a policy in advance to achieve the best outcome when we cannot rely on conditional reasoning at the time of the decision.

  Now, the blogger's comment about leaving a note or checking the phone: that would break the problem. If the driver could leave a note at the first intersection (so that when he arrives at the second, he sees the note and knows he is at the second) then he could condition his action on the intersection. Then he could get 4. But the problem states that the intersections are indistinguishable and the driver is absent-minded, meaning he doesn't have that ability. So the note solution is not allowed by the problem setup.

  In summary:

  - The optimal strategy (p=2/3) and expected payoff (4/3) are correct.
  - The explanation that without the ability to distinguish, the driver must choose a policy is correct.
  - The inconsistency in conditional reasoning (if we imagine knowing which intersection we are at) is real, but it does not imply that expected utility theory is broken. It just shows that the information constraint forces us to a policy that is not as good as the conditional strategy would be if we had the information.
  - The jump to UDT is perhaps a bit strong. We don't necessarily need UDT to solve this problem; we can solve it with standard expected utility maximization over policies. However, the problem does illustrate the kind of situation that motivated UDT.
  - The note/phone solution is correct in the sense that if the driver could break the indistinguishability, he would do better, but the problem does not allow that.

  So the parts that are correct: the numbers, the optimal strategy, the fact that a randomized strategy is better than the deterministic ones, the problem of inconsistency in conditional reasoning without the information, and the need for a policy.

  The parts that might be a bit overstated: the claim that expected utility maximization gives contradictory advice (it doesn't if we properly account for the information constraint) and the immediate jump to UDT (though it is relevant).

  The note part is just a way to break the problem, but it's not a flaw in the problem itself.

  Therefore, the blogger's summary is mostly correct, but with some nuances in the interpretation of the inconsistency and the necessity of UDT.
answer: |-
  ### Sanity-Check of the Absent-Minded Driver Puzzle Summary

  Let's break down the puzzle and the blogger's claims step by step. I'll highlight what's correct, what's misleading, and what's outright wrong, focusing on decision-theoretic principles. The core puzzle is well-established, but the interpretation and conclusions need careful handling.

  #### **1. The Puzzle Setup and Optimal Strategy**
  - **Puzzle recap**: You face two identical intersections. Payoffs:
    - Turn off at first intersection: 0.
    - Turn off at second intersection: 4.
    - Continue past both: 1 (bad neighborhood).
  - You cannot distinguish the intersections, so you must use the same strategy (same probability of continuing/turning) at both.
  - **Blogger's claim**: Randomize with **continue probability = 2/3**, turn off probability = 1/3. Expected payoff = 4/3, better than always continuing (payoff = 1) or always turning off (payoff = 0).

  **Verdict**: **Correct**.  
  - Calculation:  
    - Expected payoff = (Probability of being at first) × [Payoff if turn off + Payoff if continue] + (Probability of being at second) × [Payoff if turn off + Payoff if continue].  
    - Since intersections are indistinguishable, we model it as:  
      - At any intersection, turn off with prob \( p \), continue with prob \( 1-p \).  
      - Expected payoff: \( p \times 0 + (1-p) \times [p \times 4 + (1-p) \times 1] = (1-p)(4p + 1 - p) = (1-p)(1 + 3p) \).  
      - Simplify: \( 1 + 3p - p - 3p^2 = 1 + 2p - 3p^2 \).  
      - Maximize w.r.t \( p \): derivative \( 2 - 6p = 0 \) → \( p = 1/3 \) (turn off prob), so continue prob \( = 2/3 \).  
      - Payoff: \( 1 + 2(2/3) - 3(2/3)^2 = 1 + 4/3 - 4/3 = 4/3 \).  
  - This beats deterministic strategies (always continue: payoff = 1, always turn off: payoff = 0).

  #### **2. The "Inconsistency" in Act-by-Act Reasoning**
  - **Blogger's claim**:  
    - "At the first intersection, you should continue (0 vs future payoff). At the second, you should turn off (4 > 1). If you could do this, you'd get 4. But expected utility maximization gives contradictory advice."  
  - **Verdict**: **Misleading / Misses the point**.  
    - The "contradiction" arises from **ignoring the information constraint**. Act-by-act reasoning requires knowing which intersection you're at. But you *can't* know (by assumption), so conditioning on "being at intersection 1" or "intersection 2" is invalid.  
    - Expected utility theory (EUT) doesn't break here—it still works, but you must maximize over **policies** (strategies for all possible states) because you lack state-specific information.  
    - The blogger is correct that **policy-based reasoning is necessary**, but framing this as a "contradiction in EUT" overstates it. EUT handles this by shifting to strategies (mixed policies) when information is imperfect.  
    - Key nuance: The hypothetical "get 4" strategy isn't feasible under the problem constraints. It's like wishing for perfect information.

  #### **3. "This is Newcomb's Problem in Disguise" and "You Need UDT"**
  - **Blogger's claim**:  
    - The problem is "just Newcomb's problem in disguise," and you need "something like UDT" (Updateless Decision Theory).  
  - **Verdict**: **Partially correct, but overstated**.  
    - **Similarity to Newcomb's**: Both involve a conflict between:  
      - **Conditional reasoning** (what to do now, given your current state).  
      - **Policy-based reasoning** (what strategy to commit to in advance).  
      - In Newcomb's, you choose between one-boxing (policy: commit to one box for high payoff) or two-boxing (act-by-act: take both). Here, committing to a randomized policy beats naive conditionals.  
    - **UDT connection**: UDT is a decision theory that **chooses policies without updating on context** (e.g., "which intersection am I at?"). It directly handles this problem.  
      - Why it fits: UDT would evaluate the entire decision tree (both intersections) and pick the best policy (2/3 continue prob), ignoring "which intersection" because it can't condition on it.  
      - **But**: You don't *need* UDT to solve this. Standard **maximization of expected utility over mixed strategies** (as done above) works fine. UDT is one framework that systematizes this.  
    - **Overstatement**: Calling this "just Newcomb's in disguise" is reductive. Newcomb's relies on a predictor's knowledge of your policy, while this relies on indistinguishability of states. The *structural similarity* (policy vs. acts) is valid, but they aren't identical.

  #### **4. "Commit to a Plan in Advance" and "Don't Ask What to Do, Ask What Kind of Agent to Be"**
  - **Blogger's claim**:  
    - The driver would do better (get 4) if he could commit to "turn off only at the second intersection." The lesson is "commit to a plan" and "choose what kind of agent to be."  
  - **Verdict**: **Correct and insightful**.  
    - If you could bind yourself to a state-dependent policy (e.g., "continue at first, turn off at second"), you'd get 4. But without distinguishable states, you can't.  
    - This highlights a core idea in decision theory: When actions are interdependent or information is limited, **pre-commitment to a strategy** dominates naive myopic choices.  
    - The "what kind of agent" phrasing aligns with **functional decision theories** (e.g., UDT, FDT), where the focus is on the agent's entire decision-outputting mechanism, not isolated acts.

  #### **5. The "Note or Phone" Comment**
  - **Blogger's claim**:  
    - "A real driver would leave a note or check his phone, and the whole thing dissolves."  
  - **Verdict**: **True but trivializes the puzzle**.  
    - Yes, breaking the indistinguishability (e.g., leaving a note at the first intersection) allows the optimal state-dependent strategy (get 4).  
    - But the puzzle's purpose is to explore **decision-making under imperfect information**, not to be a practical driving guide. Dismissing it as "just forgetfulness" misses the theoretical insight: how to handle **identical decision nodes** in formal models.

  ---

  ### **Overall Assessment**
  - **What's solid**:  
    - The optimal strategy (2/3 continue prob → 4/3 payoff).  
    - The need for policy-based reasoning over act-by-act conditioning.  
    - The value of pre-commitment.  
  - **What's shaky**:  
    - Calling EUT "contradictory." It's not—EUT adapts by using strategies. The flaw is in misapplying EUT (conditioning on unavailable information).  
    - Overemphasizing UDT/Newcomb's. While related, this problem doesn't *require* them; it's a standard imperfect-information game.  
  - **What's wrong**:  
    - The "note/phone" solution ignores the puzzle's intent (it's a thought experiment, not real-world advice).  
    - The "inconsistency" is mischaracterized as a failure of EUT rather than a constraint of the problem.

  ### **The Big Picture: Why This Matters**
  The puzzle exposes a key principle: **When you lack information to distinguish decision nodes, maximize over policies, not actions.** This isn't a paradox—it's how decision theory handles ambiguity. The "contradiction" only arises if you (illegitimately) assume knowledge of your state. In practice, this reinforces ideas like:
  - **Pre-commitment** (e.g., via contracts or algorithms) to avoid time-inconsistency.  
  - **Mixed strategies** as optimal under symmetry.  
  - **UDT/FDT** as frameworks for "updateless" problems, though they aren't mandatory here.  

  The blogger's summary is **mostly correct on mechanics** (payoffs, optimal strategy) but **overreaches on implications** (EUT contradiction, UDT necessity). The core insight—**choose policies, not just acts**—stands. If you've internalized that, you've got the juice.
