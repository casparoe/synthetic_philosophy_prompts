answer: |-
  Here are the desiderata for a theory of convention and norm evolution, addressing your specified points:

  1.  **Non-circularity:**
      *   **Requirement:** The account must define convention/norm using only non-normative and non-semantic resources (e.g., preferences, beliefs, actions, regularities, information, computational limits). It cannot presuppose concepts like agreement, promise, obligation, meaning, or shared normative force.
      *   **Motivation:** To provide a reductive explanation of meaning and social normativity, avoiding explanatory circularity. Essential for grounding semantics in convention.

  2.  **Common Knowledge:**
      *   **Requirement:** The account must explain the characteristic mutual responsiveness and predictability of conventions without requiring infinite, explicit, or perfectly articulated belief hierarchies. It must functionally replicate the *effects* of common knowledge (coordinated expectations) using plausible cognitive mechanisms (e.g., bounded hierarchies, correlated signals, robust mutual predictability based on limited information and learning).
      *   **Motivation:** Real agents lack the cognitive capacity for true common knowledge, yet conventions function robustly. The account must distinguish convention from mere coincidence or independent habit by capturing the interdependence of expectations and actions.

  3.  **The Vanishing Population:**
      *   **Requirement:** The account must classify the last speaker's behavior as *not* a convention (though perhaps a degenerate or vestigial case rooted in past convention). It must identify convention as essentially requiring *mutual responsiveness* within a *population*.
      *   **Motivation:** Convention is inherently social and interdependent. The last speaker acts out of habit or personal commitment, lacking the dynamic of mutual adjustment and expectation that defines a convention. This reveals that mutual responsiveness, not just regularity, is core.

  4.  **Arbitrariness Against Near-Inevitability:**
      *   **Requirement:** The account must recognize conventions even when one option is overwhelmingly salient or advantageous *ex post*, provided that *ex ante*, functionally equivalent alternatives *were* conceivable or available *within the relevant cognitive and informational constraints of the agents* at the point of emergence or potential change. Strong symmetry is not required.
      *   **Motivation:** Many stable conventions (like QWERTY) are path-dependent and lack good alternatives *now*, but emerged when alternatives existed. The account must capture the sense that "we could have done otherwise" at a relevant historical juncture, without requiring perfect symmetry or current availability.

  5.  **Asymmetric and Exploitative Conventions:**
      *   **Requirement:** The account must encompass regularities where the benefits are asymmetric and conformity is sustained by power imbalance, lack of alternatives, or coercion, labeling these as conventions (or a specific sub-type like "oppressive conventions").
      *   **Motivation:** Ordinary language applies "convention" to such cases (e.g., feudal obligations, exploitative market practices). Excluding them based solely on mutual benefit or coordination equilibrium ideals misrepresents social reality and limits explanatory scope. This necessitates moving beyond pure coordination games.

  6.  **Normativity:**
      *   **Requirement:** The account must generate a *pro tanto*, context-dependent, non-moral "ought" for an unmotivated agent: a reason stemming *solely* from the convention's existence and others' expectations (e.g., avoiding predictable sanctions, confusion, or coordination failure). It must distinguish this conventional "ought" from moral obligation and legal requirement, while explaining their potential interaction.
      *   **Motivation:** Conventions feel binding; we cite "that's the convention" as a reason. The account must explain this normative force without collapsing it into morality or presupposing it.

  7.  **Emergence Without a Coordinator:**
      *   **Requirement:** The account must explain how conventions can emerge spontaneously through decentralized interaction (e.g., learning, imitation, reinforcement, focal points based on *roughly* shared perceptions, precedent, analogy) without explicit agreement or a central designer. It must explain the persistence of "bad" conventions (Pareto-inferior or exploitative) despite collective dispreference, often via inertia, high switching costs, or lack of a salient, coordinated escape path.
      *   **Motivation:** Most conventions arise organically. The "bad convention" case is crucial for distinguishing stability from efficiency and showing the power of path dependence and coordination dilemmas.

  8.  **Stability and Change:**
      *   **Requirement:** The account must explain stability (resistance to small deviations via positive feedback, punishment, expectations) *and* abrupt change (tipping points reached through cumulative small shifts, external shocks, generational replacement exploiting plasticity, or coordinated mass action exploiting common knowledge/salience). Stability must be separable from efficiency; inefficient conventions can be highly stable.
      *   **Motivation:** Conventions exhibit both robustness and punctuated change. Explaining only stability or only change is insufficient. Separating stability from efficiency is vital for analyzing suboptimal norms.

  **Conflicting Requirements:**

  *   **Non-circularity & Normativity:** Generating a genuine (albeit conventional) "ought" *solely* from descriptive facts (regularities, expectations, preferences of others) is the central challenge. Non-circularity forbids presupposing normativity; normativity demands its emergence. Reconciling these is likely the hardest task.
  *   **Arbitrariness & Emergence without Coordinator:** Requiring genuine *ex ante* availability of alternatives (Arbitrariness) can conflict with explaining emergence when one option is overwhelmingly salient *ex ante* (e.g., a unique focal point). The account must show how coordination can occur even when alternatives exist *in principle* but are not salient or perceived as viable by bounded agents.

  **Most Exclusionary Requirement:**

  **Non-circularity** does the most to exclude otherwise attractive accounts, as it rigorously prohibits common intuitive shortcuts involving normativity or semantics.
