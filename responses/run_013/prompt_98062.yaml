prompt: |-
  I'm a software engineer with no formal training in philosophy, and I host a small interview podcast about ideas that sit between my field and other disciplines. Next week's guest is a researcher who defends a view he calls moral trade, and I want to interview him properly rather than let him give the standard pitch. His claim, as I understand it, is this: two people can disagree completely about which cause matters most and still make a trade that each of them, judged by his own moral rankings, regards as an improvement. I care most about cause A and almost nothing about cause B; you care most about B and almost nothing about A; so I give to B and you give to A, and we are both better off than if each of us had given to his own top cause. He also runs a small matching service that pairs donors on this basis, and he insists the matching should be designed so that nobody has an incentive to lie about how he ranks the causes.

  Please draft eight to ten interview questions. I'd like at least one question each on the following, and for each question a follow-up keyed to the answer he is most likely to give:

  - whether the trade really leaves both parties better off when one of them regards the other's cause as not merely low-priority but actively harmful;
  - what "better off" can mean when the two parties' moral rankings may not be comparable at all, and whether the trade works only because it never asks either party to compare across the two scales;
  - the integrity worry: that someone who donates to a cause she thinks is unimportant in order to get donations to her own may be betraying her own commitment, or treating her convictions as a bargaining chip;
  - the mechanism design question: whether a matching rule can be strategy-proof in the relevant sense, and whether the usual impossibility results about truthful reporting in social-choice mechanisms apply here;
  - a version of his proposal in which neither party is certain of his own ranking — say each thinks his own cause is more important with probability around seventy percent — and whether trading under that uncertainty is still trade or has quietly become ordinary expected-value reasoning;
  - the broker's own position: can the matchmaker be morally neutral, or does running the service amount to taking a stand about which trades are acceptable;
  - whether moral trade is merely permitted or sometimes required, and what he would say to someone who finds the whole practice repellent but cannot articulate why;
  - whether trading replaces arguing, and whether a world of smooth moral trades would lose the pressure that disagreement puts on us to work out who is right;
  - what evidence would make him abandon the practice, and where he draws the line between a trade and a bribe or a threat.

  A few things about the format. Write the questions in my voice: plain, specific, and free of unexplained jargon, but not watered down — if a question needs a technical term, introduce it inside the question. For each question, don't just list a follow-up: commit to what you think he will actually say, then give the follow-up that makes that answer hardest to retreat from; where the argument is genuinely divided, say which way you would bet and why. Please don't give me citations, reading lists, or references to who has said what — I have no way to check them and I don't need them; if a question depends on an idea, spell the idea out instead of naming it.
reasoning: |-
  Okay, the user is a software engineer hosting a podcast about interdisciplinary ideas. They're interviewing a researcher on "moral trade," where people donate to each other's causes to mutually benefit based on their own moral rankings. The user wants sharp, non-generic questions targeting specific philosophical and technical tensions.

  Hmm, the core challenge here is balancing accessibility with precision. The interviewee's framework sits at the intersection of ethics, game theory, and mechanism design—but the podcast audience likely lacks formal training. Need to avoid jargon while preserving conceptual sharpness. Interesting how the user explicitly rejects citations; this is about live debate, not academic showmanship.

  Let me unpack the request structure: eight required angles, each needing a primary question + pre-anticipated follow-up. The follow-ups must pressure the interviewee's likely answers. This requires modeling his probable defenses while identifying soft spots. For example...

  On the "harmful cause" issue: He'll probably distinguish between active harm and mere indifference. Good—the follow-up should force him to confront whether this collapses into requiring shared meta-ethics. If a neo-Nazi and anti-racist trade, is that "mutual benefit" or moral catastrophe?

  For mechanism design: He'll claim strategy-proofness via some clever matching rule. But impossibility theorems (like Gibbard-Satterthwaite) suggest he must sacrifice either truthfulness or efficiency. Should press on whether his system secretly relies on participants being artificially constrained or altruistic.

  The integrity worry is especially thorny. His likely "trading helps more" rebuttal ignores expressive value of giving. Follow-up could challenge whether reducing morality to measurable impact denies something fundamental about ethical commitment.

  Noticing the user cares about genuine dialectic. They don't want let-them-explain softball questions. Each follow-up should act like a chess move boxing him into corners where he must either defend counterintuitive claims or reveal hidden assumptions. The "broker neutrality" question exemplifies this—running the service unavoidably judges which trades are permissible.

  ...Wait, the probability-based trading question might be the sleeper hit. If he admits uncertainty turns it into expected value, that undermines the whole "incommensurable values" premise. But if he denies it, he's claiming you can trade without comparing scales—which feels mystical. Either way, tension emerges.

  User's rejection of citations is wise. Naming Rawls/Nozick would alienate listeners. Instead, embed concepts like "expressive altruism" or "strategy-proofness" through examples. E.g., for mechanism design: "If I pretend to hate puppies to get more donations for my ocean-cleanup cause, can your system detect that?"

  Final thought: The "what evidence would change your mind" closer is perfect. Forces him out of theorizing into falsifiability. And the bribe/threat line probes the most visceral objection—that this feels corrupt. Might even frame it as: "When a lobbyist donates to your opponent's campaign in exchange for their donor backing your bill, is that moral trade or corruption?"
answer: |-
  Here are eight focused interview questions with pre-anticipated responses and aggressive follow-ups, designed in your voice:

  ### 1. **On Actively Harmful Causes**  
  *Question:* "If I see your top cause as not just low-priority but *actively harmful*—say, donating to a political campaign I view as destructive—how can trading with you leave me morally better off? Doesn’t my ‘gain’ for my cause get outweighed by enabling harm?"  
  *Likely Answer:* He’ll argue trades only occur when both parties are *indifferent* to the other’s cause, not hostile, or that harm is subjective.  
  *Follow-Up:* "But what if I’m *not* indifferent? Suppose I think Cause B spreads hate speech, and you think Cause A suppresses free expression. If we trade, haven’t we each funded something we see as evil? Isn’t that a net moral loss for both?"

  ### 2. **On Incomparable "Better Off"**  
  *Question:* "Since our moral scales may be totally disconnected—like comparing ‘reducing suffering’ to ‘glorifying God’—what does ‘better off’ even mean here? Is the trade just both of us getting more of what we want, without ever bridging the gap?"  
  *Likely Answer:* He’ll say trade sidesteps comparison by operating within each person’s value system.  
  *Follow-Up:* "But if I trade, I’m *implicitly* valuing your cause by accepting it as currency for mine. Doesn’t that force me to compare? Or are you saying morality is just preference satisfaction?"

  ### 3. **On Betraying Convictions**  
  *Question:* "If I donate to a cause I think is trivial to ‘buy’ donations for my urgent cause, doesn’t that turn my ethics into a transaction? Am I not saying my principles are negotiable?"  
  *Likely Answer:* He’ll counter that this *serves* your principles better by maximizing impact for your cause.  
  *Follow-Up:* "But what if integrity requires *refusing* to endorse causes I deem unworthy? Isn’t there expressive value in giving directly—even if it’s less efficient—that trade destroys?"

  ### 4. **On Strategy-Proof Matching**  
  *Question:* "You say your matching service prevents lying. But if I pretend to care less about my cause, could I trick the system into getting more donations for it? Or is there a design flaw that makes honesty the best strategy?"  
  *Likely Answer:* He’ll claim his mechanism (likely a modified Vickrey auction or pairwise matching) incentivizes truth-telling.  
  *Follow-Up:* "Social choice theory says you can’t have truthfulness, efficiency, *and* flexibility in preferences. If your system avoids lying, what did you sacrifice? Does it only work for simple cases?"

  ### 5. **On Trading Under Uncertainty**  
  *Question:* "Suppose I’m only 70% sure my cause is most important. If I trade, am I still doing ‘moral trade’—or is this just me calculating expected value, collapsing into standard utilitarianism?"  
  *Likely Answer:* He’ll insist uncertainty doesn’t change the structure; trade remains distinct from aggregation.  
  *Follow-Up:* "But if I’m weighing probabilities, I’m *already* comparing causes on a single scale. Doesn’t that undermine the whole idea of incommensurable values?"

  ### 6. **On the Broker’s Neutrality**  
  *Question:* "As the matchmaker, you decide which causes are tradable. Doesn’t hosting neo-Nazis trading with anti-fascists make you complicit? Or do you filter ‘acceptable’ causes, taking a moral stand?"  
  *Likely Answer:* He’ll say he only enforces mutual consent, without judging causes.  
  *Follow-Up:* "But by creating a platform where hate groups trade efficiently, aren’t you *enabling* them? If neutrality is impossible, where’s your red line?"

  ### 7. **On Whether Trade Is Required**  
  *Question:* "Is moral trade just permissible, or do we have a *duty* to do it? What would you say to someone who calls it ‘moral money laundering’ and finds it viscerally wrong?"  
  *Likely Answer:* He’ll argue it’s rationally obligatory for maximizing good.  
  *Follow-Up:* "If it feels repugnant, might that signal something important? Like commodifying ethics erodes moral character? Or is that just bias?"

  ### 8. **On Trade vs. Truth-Seeking**  
  *Question:* "If we all just trade instead of arguing, do we lose the friction that pushes us to find better moral answers? Could this entrench disagreement?"  
  *Likely Answer:* He’ll say trade solves practical problems; debate continues separately.  
  *Follow-Up:* "But if trading makes disagreement *costless*, why would anyone bother challenging their views? Isn’t moral progress born of discomfort?"

  ### Closing Challenge:  
  *Question:* "What evidence would make you abandon this? Where’s the line between a moral trade and a bribe—say, donating to a corrupt official’s charity in exchange for contracts?"  
  *Likely Answer:* He’ll distinguish voluntary trade from coercion/exploitation.  
  *Follow-Up:* "But if the official *genuinely* values his charity, and I *genuinely* want the contract, isn’t that a ‘moral trade’ by your definition? Why isn’t this just laundering corruption?"

  ---

  **Key Tactics Used:**  
  - **Concrete Examples:** Harmful causes, hate groups, bribes force real-world engagement.  
  - **Pre-emptive Strikes:** Follow-ups target predictable defenses (e.g., "indifference," "impact," "neutrality").  
  - **Pressure Points:** Highlight contradictions (e.g., "incommensurable values" vs. probabilistic trade) or moral hazards (e.g., enabling extremists).  
  - **Plain Language:** Terms like "social choice theory" or "strategy-proof" are explained contextually.  
  - **Betting on Answers:** Based on standard defenses in mechanism design/effective altruism circles—e.g., assuming he’ll invoke indifference for harmful causes or Vickrey for truthfulness.  

  These questions avoid letting him rehearse talking points by anchoring abstract claims to uncomfortable specifics. Good luck!
