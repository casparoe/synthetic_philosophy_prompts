prompt: |-
  Me and a few friends run a small philosophy reading group and we've spent three weeks going around in circles about promising, mostly because we keep sliding between different questions without noticing. I want a handout that actually sorts us. So please build me a decision tree for "which theory of promissory obligation do you actually hold?"

  Rules for the tree: every internal node should be a question someone can answer without already knowing which view it leads to, so no "do you think promissory obligation is sui generis?" — that's just asking for the label. Make each split a concrete case or a plain yes/no claim. Some splits I definitely want somewhere on the tree (add your own as well): does keeping the promise matter because of what it does to the promisee — their expectations, their reliance, or their standing to demand — or because of what it does to you, like your integrity or your ability to bind your future self, or because of the social practice the promise is an instance of? Does the promise create a brand-new reason, or just change what the pre-existing reasons already imply? Does the promisee need to accept, or even know about, the promise? Can the promisee release you? Is breaking it the sort of thing the promisee can hold you to, or just a reason you've outweighed? And is a promise to yourself a promise at all?

  Push the tree through at least these cases: a promise to a dying person who dies before you can keep it; a promise made to a mugger under threat; a promise you genuinely don't remember making; an implicit promise (you agree to meet someone at 8 and just don't show); a promise to a six-year-old; a promise whose point has evaporated by the time you could keep it; and a promise whose fulfillment you later learn will do real harm.

  Each leaf should carry the name of the position — or "unnamed" if nobody actually defends it — plus one sentence on that view's most awkward commitment. I want at least: the practice/convention view, the expectation-or-reliance view, the "the promisee gets authority over you" view, the self-binding/integrity view, the second-personal/accountability view, a consequentialist reduction (say whether the act and rule versions land in different places), the virtue-of-fidelity view, and the flat deflationary view that there is no special promissory obligation at all.

  Two extras. Flag any pair of leaves your tree can't really seperate instead of papering over it with a branch. And note which combinations of answers nobody occupies, and say whether that's because the view is incoherent, unattractive, or just unexplored.

  American English, casual tone. Don't bother with citations or a reading list — I can't check them and I want the ideas.
reasoning: |-
  Okay, the user runs a small philosophy reading group focused on promising and is struggling with confusion between different questions. They want a decision tree handout to clarify which theory of promissory obligation each member holds. 

  Hmm, the user seems frustrated after three weeks of circular discussions - probably because philosophical concepts like "promissory obligation" easily blend together. The key challenge is designing a tree where every branch point is concrete enough to avoid abstract jargon. 

  First, I need to identify the core philosophical splits they requested: 
  - Why promises matter (promisee-focused vs promisor-focused vs social practice)
  - Nature of obligation (new reason vs repackaged reasons)
  - Role of promisee awareness/acceptance
  - Revocability by promisee
  - Self-promises

  The test cases are clever - each exposes different theoretical weaknesses. For example, the "dying promise" case will trap views that overemphasize the promisee's experience, while the "forgotten promise" challenges internalist views. 

  I should structure the tree to force confrontations with these cases early. Start broad with "WHY DOES KEEPING THIS PROMISE MATTER?" because that's the deepest split in the literature. Then drill down: 
  - If someone says "because of what it does TO THE PROMISEE", immediately hit them with the dead promisee case to weed out pure expectation/reliance views. 
  - If they say "because of MY INTEGRITY", spring the self-promise case. 

  Important to flag where theories collapse into each other despite different foundations (e.g., Scanlon's expectation view vs Darwall's authority view both fail the dead promisee test similarly). Also note logical dead zones - like any view claiming promises create new reasons BUT don't require promisee awareness is probably incoherent. 

  For leaf labels, I'll use standard taxonomy but clarify unpopular positions (e.g., "Unnamed: Promise-As-Virtue-Only" for views rejecting obligation entirely). The "awkward commitment" summaries must be brutally honest - if a theory implies you owe a mugger fidelity, say so plainly. 

  User's casual tone request means no citations, but I'll subtly tag theories for their nerds (e.g., "Shiffrin-style" for self-binding). The "unexplored combinations" footnote might spark their next discussion - always leave philosophers something to argue about.
answer: |-
  Here’s a decision tree to sort your group’s intuitions about promissory obligation. Each branch forces a concrete choice, and test cases reveal tensions. **Bold** = question, *Italics* = case example.

  ---

  ### START: You’ve made a promise. Why *must* you (generally) keep it?  
  1. **Because breaking it would harm or disappoint the promisee (their feelings, plans, or trust)?** → Go to Q2  
  2. **Because breaking it makes *you* worse (a liar, inconsistent, or out of integrity)?** → Go to Q6  
  3. **Because promises only work if everyone follows the "rules of the game" (like a social handshake)?** → Go to Q9  

  ---

  #### Q2: *You promise to visit your dying friend next Tuesday. They die Monday. Do you still have to "keep the promise" (e.g., visit the grave)?*  
  - **Yes** → Go to Q3  
  - **No** → *Expectation/Reliance View*  
    - **Awkward commitment:** You owe nothing if the promisee never expected anything (e.g., you promise insincerely and they don’t believe you).  

  #### Q3: **Can the promisee *release* you from the promise (say, "don’t worry about it")?**  
  - **Yes** → *Authority Transfer View* (e.g., Owens, Darwall-esque)  
    - **Awkward commitment:** You might owe duties to someone who *never cared* (e.g., a promise to donate to a stranger’s hobby, which they ignore).  
  - **No** → *Sacred Vow View (Uncommon)*  
    - **Awkward commitment:** Breaking a deathbed promise to donate $5 to a scammer is as bad as breaking any promise.  

  ---

  #### Q6: *You promise yourself you’ll quit smoking. Is this a "real" promise?*  
  - **Yes** → *Self-Binding/Integrity View* (e.g., Shiffrin)  
    - **Awkward commitment:** Breaking a trivial promise to yourself (e.g., "I’ll eat pizza Tuesday") is a moral failure.  
  - **No** → Go to Q7  

  #### Q7: *You promise a mugger $1,000 to not stab you. Must you pay?*  
  - **Yes** → *Consequentialism (Act)*  
    - **Awkward commitment:** You must keep *every* promise where breaking it has worse net effects (e.g., pay the mugger if he’ll beat someone else otherwise).  
  - **No** → *Consequentialism (Rule)* OR *Virtue of Fidelity* → Go to Q8  

  #### Q8: **Is breaking a promise bad only because it makes you a *dishonest person*?**  
  - **Yes** → *Virtue of Fidelity View*  
    - **Awkward commitment:** No obligation to keep a promise if you’re *already* a liar (virtue won’t worsen).  
  - **No** → *Consequentialism (Rule)*  
    - **Awkward commitment:** You must keep a promise that causes disaster if *most* promise-keeping prevents chaos.  

  ---

  #### Q9: *You vaguely agree to meet at 8, but never show. Was there a promise?*  
  - **Yes** → *Practice/Convention View* (e.g., Rawls, Hume)  
    - **Awkward commitment:** You owe promises in corrupt systems (e.g., "I promise to bribe the official").  
  - **No** → Go to Q10  

  #### Q10: *You promise to give your nephew a rare toy, but later learn he’ll use it to bully kids. Must you give it?*  
  - **Yes** → *Practice/Convention View* (strict version)  
  - **No** → *Deflationary View*  
    - **Awkward commitment:** "Promises" are just polite noises. Obligation comes from *other* reasons (don’t hurt feelings, be reliable, etc.).  

  ---

  ### Test Case Outcomes by View:
  | Case | Expectation/Reliance | Authority Transfer | Self-Binding | Practice View | Consequentialism | Deflationary |
  |------|------------------------|---------------------|--------------|--------------|------------------|--------------|
  | **Dying promise** | No obligation | Obligation lingers? (Split) | Obligation (to self) | Obligation | Depends on effects | No obligation |
  | **Mugger’s promise** | No obligation (no trust) | No obligation (invalid transfer) | Obligation (to self) | Obligation (if rule) | Act: Pay; Rule: Don’t pay | No obligation |
  | **Forgotten promise** | No obligation (no reliance) | Obligation (they had authority) | Obligation (integrity) | Obligation | Depends | No obligation |
  | **Implicit promise** | Maybe (if expectation) | Maybe (if "agreement") | No | Yes | Depends | No |
  | **Promise to 6yo** | Full obligation | Full obligation | Full obligation | Full obligation | Depends | Depends (e.g., don’t disappoint kids) |
  | **Pointless promise** | No obligation | Obligation | Obligation | Obligation | No obligation | No obligation |
  | **Harmful fulfillment** | Don’t keep | Don’t keep? (Split) | Keep (integrity) | Keep | Don’t keep | Don’t keep |

  ---

  ### Unseparated Pairs & Unoccupied Branches:
  - **Can’t Separate:**  
    - *Rule Consequentialism* vs. *Virtue of Fidelity* (both often agree on cases; split is theoretical).  
    - *Authority Transfer* vs. *Self-Binding* on "release" (both allow release but for different reasons).  
  - **Unoccupied Branches:**  
    - **"Sacred Vow" (no release, ever)**: Unattractive (why can’t a promisee forgive?).  
    - **"Yes to self-promises + No to mugger promises"**: Rare. Self-binding theorists usually *also* bind to others.  
    - **"Practice View + Ignore pointless promises"**: Incoherent. If practice defines obligation, "pointlessness" isn’t in the rules.  

  ---

  ### Handout Notes:
  - **Casual cheat sheet**:  
    - Worry about **hurting others’ feelings?** → Expectation/Reliance.  
    - Think promises **hand control to the promisee?** → Authority Transfer.  
    - Feel **dirty breaking your word?** → Self-Binding/Integrity.  
    - See promises like **traffic rules**? → Practice View.  
    - Break promises when **outcomes suck**? → Consequentialism.  
    - Think "promise" is **just a word**? → Deflationary.  
  - **Tree Truths**: If your answers land you in different branches on different cases, you’re probably mixing theories. That’s why you’ve been circling!  

  Print this, argue with it, and watch the clarity unfold.
