answer: |-
  Here's a joke crafted to your specifications, playing on the ensemble-vs-individual paradox and the counterintuitive nature of ruin under overbetting:

  **The Perpetual Growth & Guaranteed Ruin Club**

  Arthur, a new inductee to the prestigious "Perpetual Growth & Guaranteed Ruin Club," stood nervously before the stern President, Beatrice. The club's sole activity: each evening, every member *must* bet on a single, favourable coin flip (p=0.6 heads, pays even money) using any fraction of their current capital, from 0% to 100%.

  "Welcome, Arthur," Beatrice intoned. "Our rule is simple: Bet nightly. Choose your fraction wisely. The game is *objectively* favourable; the expected value of any non-zero bet is positive. Yet, choose poorly, and ruin is not just possible, but *assured*."

  Arthur, an eager convert to expected value maximization, scoffed. "Assured? Nonsense! With such an edge, the rational play is obvious: bet the maximum! 100%! Every night! The expected capital growth is phenomenal! Why, the ensemble average wealth will skyrocket!"

  Beatrice nodded slowly, a flicker of pity in her eyes. "Indeed, Arthur. The *ensemble average* will climb gloriously. The *collective* wealth of the club will paint a picture of unparalleled success. A triumph of positive expectation! We publish those figures annually; they look magnificent in the prospectus."

  Arthur beamed. "Exactly! So I'll bet 100%! Maximum growth!"

  "Of course you will," Beatrice sighed, gesturing towards a magnificent, leather-bound ledger labelled "Ensemble Averages." "Your contribution to *this* will be stellar. Truly. Your name will be etched alongside legends of growth."

  She paused, then produced a much smaller, worn notebook, its cover slightly charred. "And this," she said, tapping it gently, "is the 'Membership Register'. It lists every member who has ever joined. We update it... regularly. Would you like to see where you'll be entered?"

  Arthur, confused but still confident, peered at the open page. It was almost entirely filled with names, each neatly crossed out in red ink. Below the last crossed-out name was a single, fresh, blank line.

  "Right there," Beatrice said softly, pointing to the blank line. "We'll pencil you in now. Saves time later. You see, Arthur, the thing about maximizing the ensemble average... is that it requires an *ever-increasing ensemble*. The club's total wealth grows marvelously. The *typical member*... well, they tend to leave rather abruptly. Usually about 2 months in, statistically speaking. Welcome aboard! Your first bet is at sundown. Don't forget to initial beside your name."

  *(The joke turns on the stark divergence between the growth of average wealth across an ensemble of identical over-betting agents and the almost-sure ruin of each individual agent within that ensemble, a core, counterintuitive consequence of staking more than the Kelly fraction.)*

  **Why this fits your spec:**

  1.  **Earns the Laugh via Theory:** The humor comes directly from the devastatingly counterintuitive consequence: maximizing the thing everyone *thinks* matters (expected wealth, the ensemble average) leads directly to individual ruin, while the club thrives *because* members keep vanishing and being replaced. It highlights the difference between average growth and survival probability.
  2.  **Accessible to Non-Gamblers:** The setting is a quirky club with rules. The core concept – betting too much of your money repeatedly leads to losing it all, even if each bet is good *on average* – is understandable without gambling expertise. The terms "ensemble average" and "typical member" are explained contextually.
  3.  **Avoids Barred Tropes:** No fallacies, no "house wins," no economists finding money. It's specifically about the Kelly paradox, not gambling clichés.
  4.  **Shape:** It's a short narrative ("shaggy-dog" in essence with the ledger punchline) structured as a two-hander where Beatrice's final lines ("pencil you in now," "ever-increasing ensemble," "typical member... leave abruptly," the crossed-out register) deliver the devastating theoretical point.
  5.  **Uses Provided Ground:** Explicitly uses the favourable game, mandatory repeated betting, any stake allowed (0%-100%), the ensemble average growing, the individual ruined almost surely by overbetting (stating >2x Kelly implicitly via the timeframe and the 100% stake on p=0.6), and the aversion to ruin (Beatrice's pity implies it's the worst outcome, Arthur ignores it).
  6.  **Turns on Key Feature:** The punchline *is* the theoretical point: the divergence between ensemble average wealth and individual survival probability under fractional Kelly betting, especially overbetting. This is core reading for the seminar.

  This should land well with an informed audience, deliver the theoretical gut-punch humorously, and still be followable by the non-betting colleague through the narrative. Good luck with the seminar!
