  ### Decision Procedure for Handling Simpson's Paradox in Hospital Comparisons

  **Procedure Overview**:  
  This 6-step procedure resolves Simpson's paradox reversals in hospital comparisons. It prioritizes causal logic, data availability, and measure selection. Steps 2 (confounder assessment) and 5 (measure choice) are judgment-heavy and may require hand-offs. Designed for 20-minute execution without software.

  **Step-by-Step Procedure**:

  | Step | Question | What Counts as an Answer | If Not Met | Action | Hand-Off To | Judgment (Not Fact) |
  |------|----------|--------------------------|------------|--------|------------|---------------------|
  | 1 | Is there a reversal (aggregate vs. strata show opposite directions) OR >20% effect size change? | - **Reversal**: Pooled and stratum-specific comparisons disagree on which hospital is better.<br>- **Effect size change**: Stratum-specific measure (e.g., OR/RD) differs by >20% from pooled. | No reversal/small change: Proceed to Step 3 if known confounders exist. Else, report pooled. | Continue | – | False |
  | 2 | Is the stratifying variable a **confounder** (pre-exposure, affects outcome) or **intermediate** (caused by exposure, affects outcome)? | - **Confounder**: E.g., patient severity at admission.<br>- **Intermediate**: E.g., ICU transfer timing caused by hospital protocol.<br>- **Judgment**: Temporal order (before/after admission) determines type. | Confounder → Step 4. Intermediate → Step 3. | Hand-off if unclear | Medical director or biostatistician | True |
  | 3 | Are data available for **other confounders** (e.g., age, comorbidities)? | List required confounders. Check if data exist for **all** hospitals. Missing data for ≥1 hospital = "unavailable". | Available → Step 4. Unavailable → Hand-off. Cannot adjust. | Hand-off | Biostatistician | True |
  | 4 | Can you adjust with ≤2 confounders? | Use **direct standardization**:<br>1. Pool all strata to create standard population.<br>2. For each hospital: (Stratum rate × standard pop. size) summed across strata.<br>3. Divide by total standard pop. for adjusted rate. | Success → Adjusted rate. >2 confounders or small strata → Hand-off. | Hand-off if complex | Biostatistician | False |
  | 5 | Is the discrepancy due to the **measure**? | Compute **risk difference (RD)** and **odds ratio (OR)** in strata and pooled:<br>- If RD stable but OR changes → Non-collapsibility.<br>- If OR stable but RD changes → Rare; check data. | RD stable → Report RD. OR stable → Report OR. Conflict → Hand-off for values decision. | Hand-off if conflict | Commissioner or medical director | True |
  | 6 | Final reportable number? | - Adjusted rate (Step 4).<br>- Stable measure (Step 5).<br>- Aggregate if no confounders (Step 3). | No defensible number → Stop. | Stop or hand-off | – | False |

  ---

  ### Worked Examples

  **Case 1: Severity Confounder (Hospital A vs. B)**  
  - **Data**:  
    - A: 100 low-severity (5 deaths), 300 high-severity (75 deaths). Pooled: 80/400 = 20%.  
    - B: 400 low-severity (40 deaths), 100 high-severity (30 deaths). Pooled: 70/500 = 14%.  
    - **Reversal**: Pooled favors B (14% < 20%), strata favor A (low: 5% < 10%; high: 25% < 30%).  
  - **Verdict**: Adjust for severity (confounder).  
  - **Report this number**: Adjusted rate (A: 13.9%, B: 18.9% — A better).  
  - **What the procedure rules out**: Pooled rate (misleading without adjustment).  
  - **Confidence**: 0.95  

  **Case 2: Sepsis Protocol (Intermediate Variable)**  
  - **Data**:  
    - **Protocol Hospital (A)**: 500 early ICU (25 deaths), 500 late ICU (150 deaths). Pooled: 175/1000 = 17.5%.  
    - **Non-Protocol (B)**: 200 early ICU (10 deaths), 800 late ICU (80 deaths). Pooled: 90/1000 = 9%.  
    - **Reversal**: Pooled favors B (9% < 17.5%), early ICU favors A (5% < 5%? *Tie in this example*), late ICU favors B (30% > 10%).  
    - **Causal path**: Protocol → early ICU → lower mortality.  
  - **Verdict**: **Do not adjust for ICU timing** (intermediate). Aggregate stands (B better) but confounded.  
  - **Report this number**: Pooled (B: 9%) with caveat: "Unadjusted for severity; may reflect patient mix."  
  - **What the procedure rules out**: Stratum-specific comparison (adjusting for ICU timing biases results).  
  - **Confidence**: 0.75 (requires assuming no unmeasured confounders)  

  **Case 3: Measure Dependence (Odds Ratio vs. Risk Difference)**  
  - **Data**:  
    - Subgroups: OR ≈ 2.0 (consistent harm), RD ≈ 8% (stable).  
    - Pooled: OR = 1.3 (attenuated), RD ≈ 8% (stable).  
  - **Verdict**: **Report risk difference** (stable and collapsible).  
  - **Report this number**: RD = 8% (absolute increase).  
  - **What the procedure rules out**: Pooled OR (misleading due to non-collapsibility).  
  - **Confidence**: 0.90  

  ---

  ### Critical Notes
  **Where It Hands Off**:  
  - Step 2: Confounder vs. intermediate ambiguity (common in care-pathway variables).  
  - Step 3: Missing confounder data (e.g., no severity measure for one hospital).  
  - Step 5: Commissioner insists on relative measures (OR/RR) when RD is stable.  

  **Where It Misfires**:  
  - Unmeasured confounders (e.g., socioeconomic status not in data).  
  - Non-linear causal pathways (e.g., ICU timing affects outcome differently per hospital).  
  - Small strata causing unstable estimates.  

  **Least Confident Step**:  
  - **Step 2** (Confounder vs. Intermediate).  
  - **Why**: Requires untestable causal assumptions. Misclassification leads to over-adjustment (hiding protocol effects) or under-adjustment (ignoring case-mix).  

  **Overall Confidence**: 0.85  
  - Strong for math/mechanics (Steps 1, 4, 5).  
  - Weak for causal judgments (Steps 2, 3).  

