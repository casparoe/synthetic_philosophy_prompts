  2. When the stratifying variable is an intermediate (like early ICU transfer caused by the protocol) and adjusting would be inappropriate.
  3. When the choice of measure (risk difference vs. odds ratio) matters.
  4. Aggregation level (comparing counties vs. people).

  The decision procedure will be a step-by-step guide.

