  But then we must have an accompanying text that explains the context.

  In the opinion, we will:
  - Acknowledge the legal definition and the friend's argument.
  - Argue that the historical evidence meets the criteria of genocide under both the legal and broader historical conceptions (especially given the cultural destruction and the fact that the group is religiously defined).
  - Note that the inclusion of political motives does not preclude genocidal intent (as multiple intents can coexist).
  - Emphasize the museum's role as a historical institution that must use the term when the evidence supports it, without waiting for a legal verdict (which may never come).

  Structure of the opinion:
  1. Introduction: The case and the question.
  2. The legal definition and the caution (friend's argument).
  3. The historical evidence and why it meets the threshold of genocide (including the broader Lemkin concept and the fact that the Maren are a religious group).
  4. Addressing the counterargument: Why we can use the term without a court ruling and without diluting it.
  5. Practical considerations (survivors, foreign ministry) and why historical integrity must prevail.
  6. Recommendation.

  Draft Opinion:

  Subject: Advisory Opinion on Labeling the Vaskian Atrocities against the Maren

  Dear Colleagues,

  The upcoming permanent gallery on the mass-atrocity campaign in Vaskia (1971-1974) presents a critical labeling decision: whether to describe the systematic destruction of the Maren community as a genocide. After careful review, I recommend using the term "genocide" in the main wall text, accompanied by a brief explanatory note that acknowledges the legal complexity and the absence of a court verdict.

  **The Case and the Question**
  Between 1971 and 1974, the government of Vaskia killed approximately 180,000 Maren, a religious minority with a distinct language and liturgy. The campaign included the burning of villages and churches, the closure of schools, the deportation of clergy, the forced transfer of thousands of children, and the renaming of the region. The central question is whether these acts, which clearly constitute crimes against humanity, also rise to the level of genocide.

  **The Legal Caution**
  A compelling argument, which we must take seriously, holds that "genocide" is a term of art defined by the 1948 Genocide Convention. The Convention requires proof of intent to destroy, in whole or in part, a national, ethnic, racial, or religious group as such. Political groups are explicitly excluded. The argument contends that because the Maren were targeted in part for their role as the core of the political opposition, and because perpetrator documents often framed the campaign as a public order measure, the required genocidal intent may be obscured. Moreover, no court has ruled on these events. Thus, labeling it genocide without a legal verdict risks overstepping our role as a museum and diluting a term that must remain narrow to retain its force against denialism.

  **The Historical Evidence and Genocidal Intent**
  Despite this caution, the preponderance of historical evidence supports the use of the term. The Maren are a religious group, which is a protected category under the Convention. The systematic destruction of their religious institutions (churches, clergy), cultural foundations (language, schools), and demographic continuity (via child transfers) reflects an intent to destroy the group's existence as such. Perpetrator documents that speak of "destroying the Maren's capacity to act" must be read in the context of the totality of actions, which targeted the very fabric of Maren identity. The presence of political motives does not negate genocidal intent; history shows that regimes often mask genocidal projects with security justifications. Raphael Lemkin's original conception of genocide—which emphasized the destruction of a group's "way of life," including its institutions and culture—captures this campaign more fully than the narrower legal definition. As a historical institution, we have a duty to apply this broader understanding when the evidence warrants.

  **Addressing the Counterargument**
  The strongest counterargument is that we are not a court and should avoid pronouncing on a legally contested term. However, museums are forums for historical judgment based on evidence, not legal verdicts. The absence of a court ruling (due to political obstacles, not lack of evidence) does not preclude our responsible use of the term. Moreover, using "genocide" here does not dilute the term; it applies it to a case that meets both the legal criteria (when considering the religious identity and the totality of actions) and the historical one. Avoiding the term would, in effect, side with the perpetrators' narrative of a mere security operation.

  **Practical Considerations**
  We are mindful of the Maren survivors' association, which has indicated it will withdraw artifacts if we soften the label. Their lived experience must inform our interpretation. Conversely, the foreign ministry's request to avoid "genocide" for diplomatic reasons, while understandable, must not override our commitment to historical truth. Trade negotiations should not silence the memory of victims.

  **Recommendation**
  I propose the following wall text label: "Genocide against the Maren People (1971-1974)". This should be accompanied by a 50-75 word explanatory panel that states:
  *"The term 'genocide' is used here based on historical evidence of the Vaskian government's intent to destroy the Maren as a religious and cultural group, in whole or in part, through killings, cultural eradication, and the transfer of children. While no international court has ruled on these events, the pattern of atrocities meets the definition set by the 1948 Genocide Convention and reflects Raphael Lemkin's broader conception of genocide as the destruction of a group's way of life."*

  This approach is historically grounded, legally literate, and ethically responsible. It honors the victims while inviting visitors to engage with the complexity.

  We must act by Thursday's meeting to finalize the text.

