  ### Advisory Opinion: Labeling the Vaskian Atrocities Against the Maren  

  **Introduction**  
  The proposed gallery on Vaskia’s 1971–1974 campaign against the Maren demands precise terminology that balances historical accuracy, legal rigor, and ethical responsibility. After thorough review, I recommend using the term **genocide** in the main wall text, qualified by a concise contextual explanation. This approach honors the evidence, the museum’s educational mandate, and the gravity of the events, while directly engaging counterarguments about the term’s legal and moral weight.  

  **The Case for "Genocide"**  
  The campaign meets the threshold for genocide under both the 1948 Genocide Convention and Raphael Lemkin’s foundational concept. The Convention defines genocide as acts "committed with intent to destroy, in whole or in part, a national, ethnic, racial, or religious group." The Maren—a religious minority with distinct language, liturgy, and institutions—are a protected group under this framework. Evidence shows systematic efforts to eradicate their identity: destruction of churches (religious sites), forced transfers of children (biological severance), bans on language and education (cultural erasure), and mass killings. Perpetrator documents explicitly cite the goal of eliminating the Maren’s capacity to exist as a collective, with phrases like "settling the Maren question" indicating intent beyond mere political suppression. While political motives were present, they coexisted with—and facilitated—genocidal aims, as seen in the targeting of identity-based structures (e.g., clergy, schools). Legal scholar William Schabas notes that genocidal intent can emerge from overlapping motives, and the Convention does not require exclusivity of purpose.  

  **Engaging the Counterargument**  
  The strongest objection, which merits serious consideration, is that "genocide" is a legal verdict requiring judicial adjudication. The 1948 Convention excludes political groups, and Vaskia’s framing of the campaign as a "public order" measure could suggest it falls outside this definition. Using the term without a court ruling risks overstepping the museum’s authority, politicizing historical interpretation, and diluting a term whose potency relies on narrow application. This view emphasizes that museums must avoid prejudging unresolved legal questions.  

  **Reply to Counterargument**  
  This caution is valid but ultimately outweighed by three factors:  
  1. **Historical Evidence Over Legal Vacuum**: The absence of a court ruling stems from political impediments, not evidentiary gaps. Museums, as institutions of historical reckoning, must interpret facts where courts cannot act. The Genocide Convention explicitly encourages "competent organs of the United Nations" (including educational bodies) to address genocide, affirming non-judicial entities’ role in identification.  
  2. **Intent Demonstrated by Actions**: Political pretexts do not negate genocidal intent when the methods—such as child transfers and religious persecution—target the group’s fundamental existence. As the International Criminal Tribunal for Rwanda established, intent is inferred from systematic patterns, not solely perpetrator proclamations.  
  3. **Lemkin’s Broader Mandate**: Lemkin conceived genocide as the "destruction of a group’s way of life," encompassing culture and institutions. This aligns with the museum’s mission to document erasure. Avoiding "genocide" based on legal technicalities risks obscuring the campaign’s totality.  

  **Practical Imperatives**  
  - **Survivor Voices**: The Maren survivors’ association’s stance is pivotal. Dismissing their lived experience by softening terminology would compound historical harm and undermine trust.  
  - **Diplomatic Pressure**: While the foreign ministry’s request is noted, subordinating historical truth to trade negotiations sets a dangerous precedent. The museum must prioritize its educational integrity.  

  **Recommendation**  
  **Wall Text Label**:  
  > **Genocide against the Maren (1971–1974)**  
  > *Vaskia’s campaign to destroy the Maren as a religious and cultural group included mass killings, forced child transfers, and erasure of their language and institutions. While some perpetrator records cite political motives, the systematic targeting of the Maren’s identity reflects genocidal intent under international law. No court has ruled on these events.*  

  **Implementation Timeline**:  
  - **Thursday’s meeting**: Approve label and qualified text.  
  - **Friday**: Share final wording with the Maren association for consultation.  
  - **Next Monday**: Lock text for production.  

  This label is historically grounded (per the charter), legally literate (qualifying the legal status), and ethically defensible. It acknowledges complexity without retreating from moral clarity.  

