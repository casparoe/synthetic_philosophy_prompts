  We are drafting an opinion for a museum's historical advisory board regarding the labeling of a mass-atrocity campaign against the Maren community in Vaskia (1971-1974). The key challenge is whether to use the term "genocide" given legal, historical, and political considerations.

  Key facts:
  - Approximately 180,000 Maren (a religious minority with distinct language and liturgy) were killed.
  - Actions included burning villages and churches, closing schools, deporting clergy, transferring children to state homes, and renaming the region.
  - Motive is complex: perpetrator documents sometimes frame it as destroying political opposition (the Maren were the core of the opposition) and as a public order issue, but other documents suggest intent to destroy the group as such.
  - No court has ruled on the campaign.
  - Museum charter requires labels to be historically grounded and legally literate.
  - Friend's argument: Genocide is a legal term (per the 1948 Convention) requiring intent to destroy a protected group (national, ethnic, racial, religious) as such. Political groups are excluded. Using "genocide" without a legal verdict preempts authority and dilutes the term.
  - Counterpoints: Raphael Lemkin's original concept of genocide was broader (including destruction of culture, institutions, language, religion). Museums are historical institutions, not courts.
  - Practical pressures: Maren survivors' association will withdraw artifacts if the label is softened. Foreign ministry asks to avoid "genocide" due to ongoing trade negotiations.

  We must recommend a concrete course of action for the gallery label, addressing the friend's argument strongly.

  Proposed approach:
  We cannot ignore the legal definition, but we also have a historical responsibility. We might use the term but with careful qualification, or use an alternative term that still conveys the gravity.

  Option 1: Use "genocide" with an explanatory note that addresses the legal and historical debate.
  Option 2: Use a term like "atrocity crimes" or "crimes against humanity" and explain the genocidal aspects without using the legal term.

  However, the survivors' association's position is critical. Also, the museum's role is to educate and reflect historical truth, not to avoid political discomfort.

  Recommendation:
  Use the term "genocide" in the wall text but accompany it with a brief qualification that explains the complexity. This respects the historical evidence (including the cultural destruction and the mixed perpetrator intent) and the survivors' perspective, while being transparent about the lack of a legal verdict and the ongoing debate.

