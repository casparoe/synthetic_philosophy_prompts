answer: |-
  Your diagnosis is razor-sharp: **the core deadlock stems from conflating sign-cluelessness and size-cluelessness.** This isn't *just* a verbal confusion; it's a conceptual split masquerading as one debate, leading to fundamentally different evaluations of consequentialism's viability. Here's the breakdown and resolution:

  1.  **The Crux: Sign vs. Size Matter Profoundly:**
      *   **Size-Cluelessness:** Knowing an action *probably has a positive net effect* but being wildly uncertain about *how much* is a major practical headache. It makes prioritization hard. However, it's **not fatal** for consequentialism *as a theory*. You can still make rough comparisons ("Option A seems likely *much* better than Option B"), use satisficing heuristics ("aim for reliably positive outcomes"), or focus on near-term proxies. The "rough comparisons" defender is primarily battling size-cluelessness.
      *   **Sign-Cluelessness:** Genuinely not knowing whether the *net long-run effect* of an action is positive or negative *is potentially devastating* for consequentialism as a guide to action. If you can't even assign a probable direction to the net effect, the core consequentialist directive – "choose the action with the best expected consequences" – becomes impossible to apply. The "devastating" argument is haunted by sign-cluelessness. The "it afflicts everyone" defender underestimates its unique bite for consequentialism.

  2.  **Why the Conflation Happens & Why it Matters:**
      *   **The Tail Possibilities Argument (e.g., donating money):** This *looks* like size-cluelessness ("It could be astronomically good or just okay!"). But **it's actually smuggling in sign-cluelessness.** Proponents argue the *possibility* of massive positive tails outweighs the certainty of modest local good (volunteering). Opponents counter that there are equally plausible massive *negative* tails (funding research enabling dystopia, disrupting beneficial systems). If both positive *and* negative extreme tails are plausible and incalculable, **sign-cluelessness is the result.** You cannot confidently say the *net expected effect* is positive. The debate hinges on whether we can reasonably assume/impute a positive sign to long-run effects despite chaos.

  3.  **Taking a Position: Sign-Cluelessness is the Real Threat (and it's significant)**
      *   **Thesis:** Cluelessness poses a fundamental, unsolved problem for consequentialism primarily when it manifests as sign-cluelessness for actions significantly impacting complex, long-term causal chains. This undermines consequentialism *as a decision procedure* for a wide range of important real-world choices. The "devastating" camp is mostly right about *this specific problem*.
      *   **Defense Against Strongest Counterarguments:**
          *   **Counter: "Rough comparisons are enough! We don't need precision."**
              *   **Rebuttal:** Rough comparisons *presuppose* a shared sign. If I'm sign-clueless about donating but confident volunteering is positive, I *cannot* compare them consequentially. "Rough comparisons" work for size-cluelessness ("A is clearly better than B, magnitude fuzzy") but collapse under sign-cluelessness ("Is A even *good* compared to B?").
          *   **Counter: "All moral theories face long-term unpredictability! Deontology can't predict if rule-following has bad effects either."**
              *   **Rebuttal:** True, but the *stakes are different*. Deontology (or virtue ethics) defines rightness *independently* of long-run consequences (e.g., "Keep promises," "Be courageous"). Unpredictable long-run effects are an *external* problem ("Did doing the right thing backfire?"), not an *internal* failure of the theory's criterion. Consequentialism *defines* rightness *by* those consequences. Sign-cluelessness strikes at its core definition when applied as a decision procedure. It's uniquely self-undermining.
          *   **Counter: "It's only a problem for the decision procedure, not the criterion of rightness."**
              *   **Rebuttal:** While technically correct, this is a significant retreat. If consequentialism *as a decision procedure* is perpetually undermined by sign-cluelessness for crucial choices, its practical relevance diminishes drastically. It risks becoming an abstract, unknowable truth ("The *truly* right action is whatever has the best consequences... we just can't know what that is"). This is unsatisfying for a theory meant to guide action. The "criterion vs. procedure" distinction acknowledges the problem but doesn't solve it for agents wanting to *do* consequentialism.
          *   **Counter: "We can use best available evidence/models to assign probable sign."**
              *   **Rebuttal:** For highly complex, chaotic, path-dependent long-run effects, our best models often have massive error bars encompassing *both* positive and negative net outcomes. Think climate policy, gene drives, or large-scale social reforms. Assigning a confident probabilistic sign often relies on questionable assumptions or ignores deep uncertainty (Knightian uncertainty). Your donation case embodies this – plausible models exist for both massive good and massive harm stemming from the same act.

  4.  **Moving the Debate Forward: Diagnosis and Prescription**
      *   **Acknowledge the Split:** Explicitly separate sign-cluelessness and size-cluelessness. Agree that size-cluelessness is a serious practical challenge but not necessarily a theoretical deal-breaker. Focus the core disagreement on the prevalence and implications of *sign-cluelessness*.
      *   **Test Case: "The Neutralizer":** Propose a hypothetical action where the *best available evidence* suggests an *exactly equal probability* that its long-run net effect is massively positive or massively negative (with no "do nothing" alternative). Ask:
          1.  Can consequentialism, *as a decision procedure*, guide an agent here? (Sign-cluelessness paralyzes it).
          2.  Does this differ from choosing between two actions where both have clearly positive expected signs but wildly uncertain magnitudes? (Size-cluelessness allows comparison).
      *   **Empirical/Formal Focus:** Shift to the *nature of the unpredictability*:
          *   Is the unpredictability due to chaotic dynamics making long-term prediction *in-principle* impossible beyond a horizon? (Favors sign-cluelessness worry).
          *   Or is it merely *in-practice* complexity, potentially soluble with better data/models? (Favors size-cluelessness view).
          *   **Formal Insight:** Explore arguments like the "fanatical conclusion" in infinite ethics or results showing that under extreme uncertainty (e.g., fat-tailed distributions where moments are infinite), expected utility maximization breaks down. This formalizes the sign-cluelessness danger for tail-driven reasoning.
      *   **The Bedrock Question:** Force clarity on the purpose of moral theory:
          *   **Side A (Devastated):** Believes a usable decision procedure for real agents is a *necessary* requirement for a viable moral theory. Consequentialism fails this due to sign-cluelessness.
          *   **Side B (Shrugs/Procedure-Criterion Split):** Believes providing a criterion of rightness (even if unknowable) is the primary function of a moral theory; decision procedures can be separate (e.g., rule/indirect consequentialism, heuristics). Sign-cluelessness is an epistemological problem, not a flaw in the theory itself.
          *   **Resolution?** This is fundamental. Progress requires acknowledging this underlying meta-ethical/meta-normative disagreement. Perhaps agree that *if* a usable decision procedure is essential, sign-cluelessness is a major problem consequentialism must address. *If* not, then the focus shifts to how to live with an unknowable criterion.

  **Conclusion:** Your group *is* talking past each other, but the conflation of sign and size cluelessness points to a **deep, substantive disagreement** about the nature of unpredictability (in-principle sign uncertainty vs. in-practice size uncertainty) and the fundamental requirements of a moral theory (must it be usable?). **Sign-cluelessness is the real corrosive problem for consequentialism as a guide to action.** The volunteering/donation case splits the group precisely because it forces the sign question: Can we justifiably assume/impute a positive expected sign to the donation's long-run effects compared to the volunteering, given the chaos? Those saying "no, that reasoning is worthless" are correctly identifying the specter of sign-cluelessness. To move forward, dissect the sign question explicitly and confront the bedrock meta-ethical divide about what a moral theory must provide.
