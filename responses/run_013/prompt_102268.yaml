  Key distinctions to nail: 
  - Against hypocrisy: Here the critic isn't actively perpetuating harm, just benefiting from systems they didn't create. 
  - Against ad hominem: The attack isn't about general character but specific complicity. 
  - Against tu quoque: Not "you do it too" but "your existence is entangled with it." 

