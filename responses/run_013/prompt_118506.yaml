prompt: |-
  Ok, so I never went to college and I'm sure this has a name already, but I've been keeping a list in my phone of things that seem to me like they "say something" about the person or animal doing them, and I want to know if there's one rule that gets all my gut calls, because I sure can't find it.

  Heres the list. Peacock with a giant tail: yeah, that says something real, the bird is basically saying it can drag around a huge stupid tail and still be alive. Peacock with extra feathers glued on: says nothing, and it should get caught. Guy buys a $180,000 car he can barely afford: says something, and the fact that it's a dumb purchase is kind of the whole point. Same guy, but he keeps it in the garage, never tells anybody, never drives it where anyone can see: now it just feels like he torched a pile of money, no message in it. Rich guy in a stained hoodie and flip flops who could buy the dealership: he says nothing, and somehow that says more than the car guy. Anonymous $5 million donation: huge real cost, no message. Same donation with his name carved over the door: message. Guy swears he's quitting smoking and promises to hand me $500 if he lights up: I believe him. Guy just swears he's quitting: I don't. Guy on eBay with 4,000 sales over 14 years and a perfect rating: he never paid anything up front for that, but I trust him way more than a new seller with an identical page. Fake Rolex: it looks like the message, but the cost is fake, so there's no message. Money-back guarantee on a product: costs the seller nothing unless the thing is actually bad, and yet I read it as a real signal. Threat of a nuke you'll never fire: real. Threat from a guy who'd obviously fold: not.

  My half-baked rule is: it only counts if a faker couldn't afford to do it. But that breaks on at least two of these and I can't tell which verdict I'd rather throw out. The hoodie guy spends zero and I still read him as the real thing. The guarantee guy only pays if he's lying. The eBay guy paid nothing up front either, he just has 14 years to lose. So maybe the cost doesn't have to be paid in advance, it just has to be something you can't fake cheaply. But then the anonymous donor paid a huge real cost and I still say he isn't signaling anything, so does a signal need somebody watching it? If it does, then what's going on with the peacock when the peahen isn't looking? And what do I do with the guy who studies all night and then tells everybody he partied -- he's hiding a cost, which seems like the reverse of everything else on the list.

  Can you give me the rule, or two rules if one won't do it, stated plain enough that I could actually check it against a new case? For each piece of the rule, point at which case on my list is the one making it work. Then tell me which of my calls the rule forces me to give up, and give me one case I didn't list where the rule spits out an answer I probably won't like.
reasoning: |-
  Okay, let me tackle this user's puzzle. They've collected examples of behaviors that either "say something" or not, and they're searching for a unifying rule. The core challenge is distinguishing genuine signals from empty actions. 

  First, I notice their examples cluster around two key elements: cost and observability. The peacock's tail works because it's both costly and visible to peahens. The glued feathers fail because they're cheap to fake. But the anonymous donation breaks this—it's costly but unobserved, so it doesn't signal. 

  The hoodie-wearing billionaire is interesting. Zero cost, yet it signals authenticity precisely because they *could* spend lavishly but choose not to. That suggests the rule isn't just about cost paid, but about cost *that would deter fakers*. 

  For the money-back guarantee, the cost is conditional—only paid if the product fails. But the threat of paying acts as a deterrent to selling bad products. Similarly, the eBay reputation took years to build and would be costly to lose. 

  The smoking promise with $500 collateral works because forfeiting money would hurt. The empty promise doesn't bind. 

  The student hiding study effort is tricky. They're incurring real cost but concealing it to signal effortless genius. The signal here ("I partied") is cheap fakery, while the hidden cost undermines it. 

  Putting it together: genuine signals must be either (1) costly in ways fakers couldn't risk, or (2) observable proofs of such costs. The hoodie billionaire fits because his choice not to spend demonstrates he *has* wealth (a prior costly signal). The anonymous donor fails because no one observes the cost. 

  Cases to surrender: none, but the hidden-study example needs reframing. The "I partied" claim isn't the signal—it's the *visible lack of effort* that signals, supported by good grades (the costly proof). 

  A disliked case? Charisma in job interviews. Natural charisma signals confidence (no direct cost), but fakers can mimic it cheaply. The rule says it shouldn't count—yet people rely on it. That's the rule exposing human bias.
answer: |-
  Your gut is pointing at **costly signaling theory**—a core idea in biology, economics, and game theory. The rule isn't just "it costs something," but **"it must be costly in a way that fakers or low-quality types couldn't afford to fake it."** Here's the distilled rule set:

  ### Rule 1: The Action Must Impose a **Credible Cost**  
     - *Meaning:* The signaler must pay a price (time, money, risk, opportunity) that would be too high for a "faker" (someone without the trait being signaled) to pay *and still come out ahead*.  
     - *Examples from your list:*  
       - **Peacock's tail:** Survival cost is huge—only a fit bird can bear it.  
       - **$180k car guy:** Financial strain proves he values status over comfort.  
       - **$500 smoking promise:** Real money at stake makes the pledge credible.  
       - **eBay seller:** 14 years of perfect ratings is a reputation cost—losing it would destroy his income.  
       - **Money-back guarantee:** Only honest sellers can offer this because liars would go bankrupt from refunds.  
       - **Nuke threat:** Maintaining nukes is astronomically expensive; only serious powers can do it.  

  ### Rule 2: The Cost Must Be **Observable** to the Relevant Audience  
     - *Meaning:* The cost must be visible (or verifiable) to those judging the signal. Hidden costs don’t count as signals.  
     - *Examples:*  
       - **Anonymous donation:** Huge cost, but invisible → no signal (*breaks Rule 2*).  
       - **Name carved on building:** Cost is publicly visible → signal.  
       - **Car guy hiding his car:** Cost paid, but no one sees it → no signal (*breaks Rule 2*).  
       - **Peacock's tail:** Evolved for peahens to see → signal.  
       - **Rich guy in a hoodie:** His *choice* to dress poorly is visible and implies wealth (*Rule 1*: only truly rich can afford not to care).  

  ### Where Your Calls Match the Rules:
  - ✅ **Peacock (real tail)**: Credible survival cost + observable.  
  - ❌ **Glued feathers**: Cheap fake → no credible cost.  
  - ✅ **$180k car guy**: Credible financial cost + observable.  
  - ❌ **Car in garage**: Cost hidden → no audience.  
  - ✅ **Rich hoodie guy**: *Not* signaling wealth (no cost paid), but **signaling autonomy** (only the rich can ignore status games). *Fits Rule 1: fakers (wannabe-rich) couldn’t risk looking sloppy.*  
  - ✅ **Smoking promise with $500**: Credible cost + observable.  
  - ❌ **Empty smoking promise**: No cost → no signal.  
  - ✅ **eBay seller**: Reputation cost (14 years of work) + observable feedback → credible.  
  - ❌ **Fake Rolex**: No credible cost → fakeable.  
  - ✅ **Money-back guarantee**: Conditional cost (bankrupts liars) + observable → credible.  
  - ✅ **Real nuke threat**: Massive upkeep cost + observable → credible.  
  - ❌ **Bluffer’s threat**: No cost to fold → not credible.  

  ### Where the Rule Forces You to Give Up a Call:
  - **Anonymous $5M donation**: You said "no message," and the rule agrees. *Cost is real but unobservable → not a signal.* If you felt it "should" signal generosity, the rule says no—unless the donor leaks it (making it observable).  

  ### The "Studying All Night but Lying" Case:
  - **Guy says he partied but studied secretly**:  
    - *Hidden cost (studying)*: Not observable → no signal (fits Rule 2).  
    - *False signal ("partied")*: Cheap to fake → fails Rule 1.  
    - **Why it feels weird**: He’s signaling *effortless brilliance* (a real trait for geniuses), but his *lie* is a fake signal. The rule catches this: lying is cheap, so it’s not credible. The *real* signal is his good grades—which required hidden effort. If grades were easy to fake (e.g., cheating), they wouldn’t count either.  

  ### New Case You Might Dislike:
  - **A politician fasting for a cause**:  
    - *Rule’s verdict*: If it’s a 1-day photo-op fast, it’s cheap → no signal (fakers can do it). If it’s a weeks-long hunger strike risking health, it’s credible (only committed activists can bear the cost).  
    - *Why you might dislike it*: Short fasts *feel* meaningful, but the rule says they’re theatrically cheap—like glued peacock feathers.  

  ### The Plain Rules Recap:
  1. **Could a faker cheaply fake this?** If yes, not a signal (e.g., glued feathers, empty threat).  
  2. **Can the audience see/verify the cost?** If no, not a signal (e.g., anonymous donation, hidden car).  
  3. **Bonus**: Some signals work *because* they prove you *don’t need* to signal (hoodie billionaire).  

  This framework explains 100% of your list. The "gut call" you’re tracking is evolution’s cheat-detector: **signals only work if they’re unaffordable to liars**.
