  The stress test case is particularly interesting—it challenges the assumption that subgroups are pre-treatment constants when interventions can alter group composition. This directly undermines standard causal inference approaches that treat conditioning variables as fixed. The user clearly wants this case to serve as a litmus test for proposed frameworks.

  For the agenda, I need to identify foundational bottlenecks. The subgroup ontology question (whether groups exist independently of interventions) seems upstream because if groups are mutable, most existing formalisms become inadequate. This requires philosophical ontology work paired with causal modeling extensions, which is tractable with current tools but underexplored.

  Next, the "act on what" question must address cases where epistemic and practical rationality diverge due to compositional shifts. This can't be resolved until we have ontological clarity. Formal decision theory can handle this, but requires input from the first question.

  The intervention type question follows logically—once we know groups are mutable, we need to classify interventions by how they reshape populations. This involves extending causal modeling to dynamic groups, which Pearl-style frameworks can potentially handle with modifications.

  Tier 2 questions include unification (which needs solutions to the prior problems), moral mathematics (neglected but crucial for policy), and paradox avoidance (less urgent but useful for diagnostics). 

  The moral mathematics angle is deliberately included as the unfashionable pick—it's often dismissed as "applied" but becomes fundamental when aggregate harm emerges from individually beneficial acts. A formal impossibility result linking group ontology to value aggregation could force the field to engage it.

  Throughout, the stress test exposes gaps: standard methods fail because they assume fixed subgroups, can't handle endogenous composition changes, and lack tools to weigh conflicting rationalities. Pushing these issues forces progress on ontology and decision theory first. 

  Progress markers would be formal models of mutable subgroups within 18 months, followed by decision frameworks incorporating them. If the stress test proves unresolvable with current math, that would elevate the need for new formalism development—but I suspect extensions are possible.
answer: |-
  Here is a defended research agenda prioritizing open, foundational questions on aggregation paradoxes, sequenced by conceptual dependency, tractability, and responsiveness to your stress test. The ranking reflects what *must* be settled first to avoid wasted effort later, leveraging existing philosophical/formal tools while highlighting neglected avenues.

  ### Core Agenda (Tier 1: Foundational Prerequisites)

  1.  **Question 1: What is the ontological status of subgroups for causal aggregation?**
      *   **Why Upstream?** Without clarifying *what subgroups fundamentally are* (natural kinds, pragmatic conveniences, observer-dependent constructs, or dynamic entities shaped by interventions), all subsequent claims about "right" levels of analysis or resolvability are ambiguous. Your stress test (intervention reshaping subgroups) makes this unavoidable. If subgroups aren't fixed pre-treatment categories, conditioning on them *post*-treatment invokes time-travel paradoxes or mediator bias. Later work on "which level to believe/act on" (Question 2) or "resolvability conditions" (Question 3) *depends* on this ontological grounding.
      *   **Tractability:** Highly tractable with current tools. Combines philosophy of science (natural kinds, variables vs. events, reference classes) with formal causal modeling (extending frameworks to handle *mutable* or *defined-by-treatment* groupings). Requires conceptual analysis, not new math.
      *   **Movement:** **UP** if early work shows standard subgroup definitions lead to contradictions in dynamic cases (like your stress test). **DOWN** if a robust, consensual account of "intervention-invariant subgroups" emerges quickly, making the problem less acute (unlikely given your case).
      *   **Stress Test Link:** Directly challenged. If the intervention *constitutes* the subgroups it's "tested" within, the paradox isn't resolvable by standard causal adjustment. This forces a reconceptualization of what subgroups *are* in causal reasoning.

  2.  **Question 2: Under what conditions do epistemic (what to believe) and practical (what to do) rationality diverge when levels conflict, particularly when subgroups are mutable?**
      *   **Why Upstream?** Before prescribing action ("act on aggregate/subgroup"), we need to know if knowing the "truth" (epistemic goal) even implies knowing the "best action" (practical goal). Your stress test creates a stark divergence: believing "treatment helps every subgroup" (epistemic) might coexist with knowing "implementing it widely harms the population" (practical) due to compositional shifts. Later work on "which level to act on" (a subset of this) and policy recommendations is blocked without understanding this potential split. Resolvability (Question 3) also depends on clarifying the goal (truth vs. outcome).
      *   **Tractability:** Tractability: Leverages decision theory, causal counterfactuals (e.g., "implementability" criteria), and game theory (if uptake is strategic). Philosophers excel at disentangling epistemic/normative concepts. Formal tools exist but need adaptation to dynamic compositions.
      *   **Movement:** **UP** if analysis shows divergence is common/non-trivial (especially in stress test), forcing a rethink of "rationality". **DOWN** if divergence is shown to be rare or easily bridged (e.g., always act on the level reflecting overall expected utility).
      *   **Stress Test Link:** Exemplifies the divergence. Epistemically, evidence *within* subgroups supports treatment. Practically, aggregate harm (via composition change) dictates non-treatment. Which "ought" prevails? Resolving this requires Question 1's ontology.

  3.  **Question 3: What are necessary and sufficient conditions for the resolvability of aggregation paradoxes, specifically when conditioning variables are treatment-dependent?**
      *   **Why Upstream?** Knowing *if/when* a paradox *can* be resolved (and what resolution means - a single answer? context-dependent guidance?) is essential before designing methods *for* resolution or prescribing actions. Your stress test defines a hard case: resolvability seems impossible if subgroups are defined *by* the intervention. Later work on unification frameworks (Tier 2) or specific resolution techniques depends on knowing the boundaries of possibility defined here.
      *   **Tractability:** Combines formal causality (graphical criteria, do-calculus extensions for dynamic variables), logic (possibility/impossibility proofs), and philosophy (definitions of "resolution"). Requires extending existing formalisms to handle mutability, not inventing entirely new math.
      *   **Movement:** **UP** if stress test-like cases are shown to be unresolvable without fundamentally new concepts (e.g., redefining "cause"). **DOWN** if existing causal frameworks (e.g., with careful handling of dynamic groups) are quickly shown to suffice.
      *   **Stress Test Link:** Directly targets resolvability in the hardest scenario. If resolvability requires subgroups to be pre-treatment confounders (which they aren't in this case), then the paradox might be *irreducible*, fundamentally changing its significance.

  ### Tier 2: Building on Foundations

  4.  **Question 4: Can a unified conceptual framework reconcile diverse aggregation paradoxes (Simpson's, Lord's, Berkeley admissions, your stress test) under a single account of "level disagreement"?**
      *   **Why Here?** Requires answers to Q1-3. Attempting unification *before* understanding the ontology of subgroups (Q1), the epistemic/practical split (Q2), and resolvability limits (Q3) risks forcing diverse phenomena into a Procrustean bed. Unification is valuable but parasitic on foundational clarity.
      *   **Tractability:** Philosophical synthesis and formal modeling (probabilistic, causal, logical). Demands deep engagement with case studies. Very tractable *if* foundations are solid.
      *   **Movement:** **UP** if foundational work reveals deep commonalities. **DOWN** if cases remain stubbornly heterogeneous.

  5.  **Question 5 (Neglected): What are the "moral mathematics" of acting under level disagreement, especially when individual benefit + compositional shift = aggregate harm?**
      *   **Why Neglected?** Formal ethics often focuses on fixed populations or individual actions. The core tension in your stress test (individually beneficial, collectively harmful via composition) mirrors classic problems in population ethics (e.g., Parfit's Mere Addition Paradox) and collective action, but is rarely integrated with *causal* aggregation paradoxes. It's seen as "applied" or belonging to ethics, not foundations of causality/statistics.
      *   **Why Deserve Attention?** Your program explicitly links causal reasoning to policymaking. This question *directly* addresses the "ought to act on" dilemma when levels disagree, forcing engagement with value aggregation (utilitarian? prioritarian? rights-based?) alongside causal aggregation. It's crucial for the practical side of your remit.
      *   **What Would Change Its Status?** A formal proof showing that certain causal aggregation structures *inevitably* create conflicts between individual and collective rationality/utility under plausible ethical frameworks, *especially* in composition-shift scenarios. This would force causal theorists to engage ethics.
      *   **Tractability:** Combines decision theory, social choice theory, population ethics, and causal modeling. Tools exist but their integration is novel. Philosophers are well-equipped.
      *   **Placement:** After Q1-Q3 & Q4, as it builds on the nature of subgroups, resolvability, and a unified view, then layers ethical normativity. Requires knowing *what* is being aggregated causally before asking *how* to value it.

  6.  **Question 6: Can formal criteria be developed to guide when *not* to seek disaggregation (to avoid paradoxes) and when it is essential?**
      *   **Why Here?** This is a diagnostic/prescriptive tool based on understanding the *causes* of paradox (Q1-Q4). Attempting it prematurely risks circularity or ad-hoc rules. Less conceptually fundamental than Q1-Q5, but vital for practical guidance.
      *   **Tractability:** Formal (algorithmic complexity, stability analysis under partitioning) and conceptual (defining "essential" disaggregation). Highly tractable with established methods.
      *   **Movement:** **UP** if foundational work reveals clear "paradox-prone" structures. **DOWN** if resolvability (Q3) is usually achievable.

  ### Why This Order & Response to Constraints

  *   **Upstream Order:** Q1 (Subgroup Ontology) -> Q2 (Epistemic/Practical Split) -> Q3 (Resolvability Conditions) are strictly sequential. You *cannot* coherently discuss what to believe/do (Q2) or whether disagreement can be resolved (Q3) without knowing what the subgroups *are* (Q1). Q4 (Unification) requires Q1-Q3. Q5 (Moral Mathematics) and Q6 (Avoidance Guidance) build on all prior work. Leaving Q1 unsettled risks building formal castles on sand, especially given your stress test.
  *   **Beyond Standard Causal Inference:** The agenda explicitly targets limitations exposed by your stress test (treatment-dependent subgroups), epistemic/practical splits, resolvability boundaries, and ethical dimensions – all areas where standard do-calculus/rCT approaches are silent, incomplete, or need significant reinterpretation.
  *   **Epistemic vs. Practical:** Q2 directly and explicitly addresses their potential divergence, making it a core Tier 1 question. Q5 further explores the practical "ought" in light of this.
  *   **Stress Test as Driver:** The stress test isn't just an example; it's an *anomaly* that destabilizes standard approaches. It directly forces Q1 (subgroups aren't fixed), creates the core dilemma for Q2 (believe subgroup benefit, see aggregate harm), defines the hard case for Q3 (is this resolvable?), and exemplifies the ethical tension in Q5 (individual good vs. collective bad).
  *   **Neglected Question:** Q5 (Moral Mathematics) is identified as fundamentally neglected despite being central to the policy implications your program cares about. Its elevation requires demonstrating formal *inevitability* of value conflict in specific causal structures.

  This agenda provides a clear, defended path for foundational inquiry, prioritizing the deep conceptual puzzles that must be solved first to make progress on the practical and unifying goals of the program, all while rigorously engaging your critical stress test case.
