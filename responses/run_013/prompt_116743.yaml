  The user provided specific elements they want covered: rescue cases (standard and extreme), theory-vs-world distinction, special obligations, moral sainthood/alienation, arbitrariness problem, and partial compliance. They also emphasized a key distinction between compliance cost (doing the action) and uptake cost (living with the commitment), plus that burnout case with two colleagues.

  Hmm, this is complex but exciting. The user is clearly an experienced ethics professor - they've identified common student pitfalls (conflating demanding theories with demanding worlds) and want to prevent sloppy thinking. The burnout case suggests they care about real-world applicability beyond abstract theory. 

  Let me start brainstorming cases/considerations. For rescue cases: Singer's pond (non-negotiable), then "ugly cousins" like burning building where costs are extreme. Special obligations need cases like birthday gifts vs. donations. For alienation, Bernard Williams' integrity objection is crucial. Arbitrariness needs threshold examples (why 10%? why not 90%?). Partial compliance requires "free rider" scenarios. 

  The compliance/uptake distinction is brilliant - I'll use terms like "compliance cost" (resources expended) vs "uptake cost" (psychological/social burden). For the burnout case: Anna (high compliance/high uptake short-term) vs Ben (lower compliance/lower uptake sustained). Theories might split here - maximizing impact vs preserving agency.

  Now structuring the desiderata list. Non-negotiables should include: 
  1. Permitting partiality (Williams-style integrity)
  2. Avoiding catastrophic sacrifice (extreme rescue cases)
  3. Theory/world distinction 
  Camp-specific preferences might include things like scalar approaches to arbitrariness.

  For conflicts: Partiality vs rescue cases create tension - how much can morality demand before overriding personal projects? Also, avoiding arbitrariness clashes with needing clear thresholds. 

  The most exclusionary requirement? Probably "permitting substantial partiality" - it immediately rules out maximizers like classical utilitarianism.

  Finally, the quick theory assessments: 
  - Act-consequentialism fails most non-negotiables spectacularly 
  - Rule-consequentialism tries to compromise but struggles with partial compliance 
  - Scalar views dodge arbitrariness but risk vagueness

  The user wants this for grad students, so I'll define terms explicitly and flag where I'm uncertain (like whether uptake cost is truly non-negotiable). Better to be precise than exhaustive.
answer: |-
  Here is a comprehensive set of desiderata for a theory of moral demandingness, designed for your graduate seminar. I've structured it as requested, followed by analysis and comparative highlights of major theories.

  **Scratch Brainstorming: Cases & Considerations**
  *   **Cases:** Singer's Pond (low cost rescue), Burning Building Sacrifice (high cost rescue), Birthday Gift vs. Donation (special obligations), Moral Saint (wholly consumed by duty), Williams' "Integrity" case (projects/attachments), Giving 10% vs. 90% (arbitrariness), Free Rider Society (partial compliance), Burnout Colleague vs. Sustained Giver (compliance/uptake costs), "Only Moral Person in Department" (uptake cost isolation).
  *   **Considerations:** Distinction between *what morality requires* and *what the world requires of morally motivated agents*. Distinction between *cost of action* (compliance) and *cost of commitment* (uptake). Role of personal projects/relationships in a meaningful life. Need for non-arbitrary grounding of limits. Impact of non-compliance by others. Sustainability of moral motivation. Avoidance of alienation (morality shouldn't require abandoning core identity). Avoidance of maximalism without collapse into minimalism.

  ---

  **Desiderata for a Theory of Moral Demandingness**

  1.  **Permit Substantial Partiality (Non-Negotiable)**
      *   *Case/Consideration:* Must allow significant resources (time, money, emotional energy) to be directed towards loved ones and personal projects without condemning it as morally deficient indulgence (e.g., buying a meaningful birthday gift for a child instead of donating the money to an effective charity).
      *   *Why Non-Negotiable?* Failure destroys the space for essential elements of a recognizably human, flourishing life (integrity, deep relationships, personal meaning).

  2.  **Prohibit Catastrophic Sacrifice (Non-Negotiable)**
      *   *Case/Consideration:* Must not require an agent to sacrifice their life, fundamental well-being, or core moral agency *solely* to produce a net gain in impersonal good (e.g., jumping into a burning building with near-certain death to save one stranger). Morality cannot demand self-annihilation.
      *   *Why Non-Negotiable?* Preserves the moral agent as an entity capable of acting morally. Grounds morality in the value of agents, not just outcomes.

  3.  **Rescue Imperative (Non-Negotiable)**
      *   *Case/Consideration:* Must require agents to bear *significant* cost to prevent severe harm or death to others when the cost is not catastrophic (e.g., wading into a shallow pond to save a drowning child at the cost of ruining clothes). Demands must exceed minimalism.
      *   *Why Non-Negotiable?* Failure implies morality is indifferent to easily preventable severe suffering/death, undermining its core purpose.

  4.  **Distinguish Demanding Theory from Demanding World (Non-Negotiable)**
      *   *Case/Consideration:* Must provide tools to analyze whether an intuitively excessive burden stems from the *moral theory itself* (e.g., requiring constant maximal donation) or from the *tragic circumstances of the world* (e.g., massive unmet need despite widespread non-compliance). Students must separate the theory's requirements from the context it applies to.
      *   *Why Non-Negotiable?* Essential for accurately diagnosing the source of demandingness objections and evaluating theories fairly.

  5.  **Mitigate Alienation (Non-Negotiable)**
      *   *Case/Consideration:* Must not require agents to abandon their deeply held personal projects, commitments, and relationships that constitute their core identity (integrity) to become a "moral saint" solely focused on impersonal duty. Morality shouldn't demand ceasing to be a *particular person*.
      *   *Why Non-Negotiable?* Alienation renders moral motivation psychologically unsustainable and severs morality from the lived experience and reasons of actual agents.

  6.  **Address the Arbitrariness Dilemma (Preference - Scalar/Contextualist Camps)**
      *   *Case/Consideration:* Must offer a principled, non-arbitrary account of why demandingness stops *here* rather than being either maximalist (requiring everything short of catastrophe) or minimalist (requiring only easy rescues). Why is giving 20% required but 21% supererogatory? Thresholds seem arbitrary; but no threshold seems maximalist.
      *   *Why Preference?* Some theories (e.g., scalar consequentialism) reject deontic thresholds entirely, while others (e.g., contractualism, hybrid views) seek principled grounds (e.g., reasonable rejectability, agent-relative permissions). What counts as "non-arbitrary" depends on foundational commitments.

  7.  **Account for Partial Compliance (Preference - Rule-Consequentialist/Contractualist Camps)**
      *   *Case/Consideration:* Must explain how an agent's obligations change (or don't) when others fail to do their fair share (e.g., in a "Free Rider Society," is one's duty to give *more* to compensate, or does the baseline duty itself adjust?).
      *   *Why Preference?* Act-consequentialists see duties as independent of others' compliance (duty might increase). Rule-based or fairness-focused views might see the baseline duty as defined by ideal cooperation (duty might be lower in non-ideal conditions). This reflects different conceptions of duty's source.

  8.  **Acknowledge & Weigh Uptake Cost (Preference - Virtue Ethics/Pragmatic Camps)**
      *   *Case/Consideration:* Must recognize that the psychological, social, and motivational burdens of *holding and internalizing* a moral commitment (**uptake cost**) are distinct from the resource cost of *acting* on it (**compliance cost**). (e.g., Being the "only moral person in the department" creates isolation/strain beyond the cost of giving itself).
      *   *Why Preference?* While significant, giving uptake cost *decisive* weight might excuse backsliding. Some theories prioritize objective duty over subjective burden, others see sustainable motivation as integral to duty.

  9.  **Promote Sustainability (Preference - Virtue Ethics/Rule-Consequentialist Camps)**
      *   *Case/Consideration:* Should provide guidance that is psychologically sustainable for agents over the long term, avoiding requirements that predictably lead to burnout or resentment. (e.g., Anna burns out at 34 giving intensely; Ben gives moderately for 40 years. A theory should ideally explain why Ben's path might be *better* or *permissible*, or justify Anna's).
      *   *Why Preference?* Strict act-based views might prioritize total impact (potentially favoring Anna's short burst). Views emphasizing character, rules, or long-term expectations might favor Ben's sustainability. This reflects priorities between total good and agent flourishing/motivation.

  ---

  **Analysis**

  **(a) Potential Conflicts Between Desiderata:**
  *   **Rescue Imperative (3) vs. Permitting Partiality (1) & Mitigating Alienation (5):** How much rescue *can* be demanded before it starts significantly encroaching on the resources needed for partiality and non-alienated living? Demanding constant moderate sacrifices for distant others (effective altruism) might satisfy (3) but threaten (1) and (5). A theory must delineate the boundary without collapsing into minimalism.
  *   **Rescue Imperative (3) vs. Prohibiting Catastrophe (2) & Addressing Arbitrariness (6):** Defining "significant but not catastrophic" cost is the core challenge of arbitrariness. Where precisely does the "bear significant cost" requirement stop short of catastrophe? Any specific line risks seeming arbitrary.
  *   **Promoting Sustainability (9) vs. Rescue Imperative (3) & Partial Compliance (7):** In a world of massive need and widespread non-compliance (7), promoting sustainability (9) might seem to license giving *less* than what the Rescue Imperative (3) would demand in ideal conditions. Is sustainability a constraint on duty, or a separate virtue?
  *   **The Burnout Case (Anna vs. Ben):** Desiderata pull in different directions. (3) & potentially (7) might favor Anna's total impact if it's higher. (5), (8), and (9) strongly favor Ben's approach. (1) is likely compatible with both, depending on how they managed partiality. A theory *must* take a stand here; it reveals its priorities.

  **(b) Most Exclusionary Requirement:**
  **Permitting Substantial Partiality (1)** does the most work excluding candidates. It immediately rules out **classical Act Utilitarianism (AU)** and other strict maximizing impartial views. If morality *must* permit significant investment in personal relationships/projects simply because they are *mine* or *meaningful to me*, then any theory that defines right action solely by maximizing impersonal good (or minimizing impersonal bad) fails. This requirement forces the theory to incorporate agent-relative reasons or permissions at a fundamental level.

  ---

  **Highlights on Major Theories Using the Desiderata**

  *   **Act-Consequentialism (e.g., AU):** Fails decisively on **Permitting Partiality (1)** and **Mitigating Alienation (5)** by requiring maximization. Struggles profoundly with **Arbitrariness (6)** (maximalism is the only non-arbitrary point?). Excels on **Rescue Imperative (3)** and **Distinguishing Theory/World (4)**. Handles **Partial Compliance (7)** by potentially demanding *more* of compliant agents. Ignores **Uptake Cost (8)** and often undermines **Sustainability (9)**. **Prohibiting Catastrophe (2)** is its only likely non-negotiable pass, assuming "catastrophe" includes inability to act further.
  *   **Rule-Consequentialism (RC):** Aims to pass **Permitting Partiality (1)** and **Mitigating Alienation (5)** by selecting rules whose *general acceptance* allows space for personal life, fostering stability. Tries to handle **Arbitrariness (6)** via rule content grounded in expected acceptance value. Strong on **Sustainability (9)** and **Distinguishing Theory/World (4)**. Can struggle with **Rescue Imperative (3)** (does the "rescue" rule demand enough?) and **Partial Compliance (7)** (do rules adjust in non-ideal conditions, or does duty remain fixed by ideal rules?). **Uptake Cost (8)** is not directly addressed.
  *   **Scalar / Gradualist Consequentialism:** Dodges **Arbitrariness (6)** by rejecting deontic thresholds; rightness/wrongness come in degrees based on consequences. Focuses on **Rescue Imperative (3)** by emphasizing *better/worse* actions. Clearly **Distinguishes Theory/World (4)**. Fails **Permitting Partiality (1)** and **Mitigating Alienation (5)** if scalar *evaluation* implies scalar *demandingness* (should always do the *best*?). May struggle to define **Prohibiting Catastrophe (2)** without thresholds. **Partial Compliance (7)** and **Uptake Cost (8)** are complex within a scalar framework. **Sustainability (9)** is not a core concern.
