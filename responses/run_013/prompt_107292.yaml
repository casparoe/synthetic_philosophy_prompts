prompt: |-
  I'm writing a column about how everyone misuses the "outside view" — you know, the planning-fallacy move where you're supposed to stop reasoning about your particular case and look at the base rate for cases like it. Half the time I see it invoked it just means "remember base rates exist," the other half it means "be less sure of yourself," and I dont think either one is actually the concept. So explain the conceptual issue to me properly. I want to get: (1) why the outside view is supposed to be a different *kind* of reasoning and not just a wider prior or a lower credence; (2) why "epistemic modesty" as usually preached — just dial your confidence down — is not the same thing as what the outside view is meant to do, and where they come apart; and (3) the real complaint that you can construct an outside view of basically anything, so "take the outside view" by itself never tells you what to do or how much to move. Here's the part I actually care about, and I think it's the crux: a researcher I spoke to put it as — the outside view is really a model of your *model*, a claim about how your reasoning process is biased, not a claim about the world. If that's right, there's a nasty reflexivity problem, because taking the outside view of your own habit of taking the outside view either can't be done or spirals. Walk me through whats actually going on, with one small concrete case worked all the way through — not the clichéd book-writing example, maybe a doctor sizing up a single patient's prognosis — and tell me which of the three complaints above is the serious one and which two are just confusion. Keep it self-contained; don't cite papers at me, I can't look anything up right now anyway. End with a final line starting "Bottom line:" that gives me the one sentence I could actually put in the column.
reasoning: |-
  We are discussing the concept of the "outside view" as opposed to the inside view. The outside view is meant to be a form of reference class forecasting, where you step back from the details of the specific case and instead look at the base rates of similar cases. However, your complaints are that it is often misused as merely a reminder about base rates or a call for modesty, and that it can be constructed arbitrarily. Moreover, the researcher's point that it is a model of your model introduces a reflexivity issue.

  Let me break down the three points you want:

  1. Why the outside view is a different kind of reasoning, not just a wider prior or lower credence.
  2. Why "epistemic modesty" (just dialing down confidence) is not the same as the outside view, and where they come apart.
  3. The complaint that you can construct an outside view for anything, so the advice alone is insufficient.

  And then we have the crux: the outside view is a model of your model (i.e., it's about the bias in your reasoning process, not directly about the world) and the reflexivity problem.

  I'll use a concrete case: a doctor assessing the prognosis of a single patient with a particular set of symptoms and medical history.

  **Case Setup:**  
  Dr. Smith is treating a 55-year-old male patient, John, who has been diagnosed with moderate heart disease. John has some risk factors: he is a smoker, has high blood pressure, and a family history of heart disease. However, he has been responding well to medication and lifestyle changes in the past 6 months. Dr. Smith has been closely monitoring John and feels optimistic about his prognosis, thinking that the patient has a 90% chance of avoiding a major cardiac event in the next 5 years.

  Now, the inside view: Dr. Smith is focusing on John's specific characteristics and recent progress. The outside view would involve looking at the base rate for patients with similar risk profiles (age, smoking, hypertension, family history) and seeing what fraction of such patients avoid a major cardiac event in 5 years.

  Suppose the base rate from large studies is that only 70% of such patients avoid a major event in 5 years.

  ### 1. Why the outside view is a different kind of reasoning
  The outside view is not just about having a wider prior or being less confident. It's about shifting the level of analysis. The inside view builds up an estimate from the details of the case (like a bottom-up approach), while the outside view uses a top-down approach by categorizing the case into a reference class and using the statistics of that class.

  In our example:
  - Inside view: Dr. Smith considers John's individual response to treatment, his adherence, and recent improvements. This leads to 90%.
  - Outside view: Dr. Smith ignores the individual details and uses the base rate (70%) for the reference class of "55-year-old male smokers with high blood pressure and family history of heart disease".

  It's not that the base rate is a wider prior that we update with the inside view. The outside view is a separate method that bypasses the inside view details. It's a different way of generating an estimate.

  ### 2. Why "epistemic modesty" is not the same
  Epistemic modesty would say: "Don't be so sure; maybe you're overconfident. So instead of 90%, say 80%." This is just a downward adjustment without a specific reason. It doesn't tie to any data or reference class.

  The outside view, by contrast, gives a specific alternative estimate (70%) based on a reference class. It might lead to a similar number, but it's grounded in data. Moreover, the outside view might actually suggest a different number than a simple downward adjustment. For example, if the base rate were 95%, the outside view might suggest being more optimistic than the inside view! (Though that's less common in planning fallacy contexts.)

  In our case, if Dr. Smith applies epistemic modesty, he might lower his 90% to 85% or 80%. But the outside view gives a concrete 70%. They come apart when the base rate is known and differs from the inside view estimate. Also, the outside view can sometimes be higher, which modesty wouldn't do.

  ### 3. The complaint about arbitrary construction
  The problem is: how do you choose the reference class? For John, we could choose:
  - All people with heart disease? (very broad, maybe 60% avoid major events)
  - All 55-year-old male smokers with high blood pressure and family history? (70%)
  - But what if we add "and who have shown improvement in the last 6 months"? Then we might get a different base rate, say 80%.

  The outside view requires choosing a reference class, and that choice is arbitrary without guidance. The advice "take the outside view" doesn't tell you which reference class to use. So the doctor has to use judgment to pick a relevant reference class, which might reintroduce the same biases the outside view is meant to avoid.

  ### The Reflexivity Problem
  The researcher's point: the outside view is a model of your model. It's saying that your inside-view model is likely biased (e.g., by overemphasizing unique factors and underemphasizing general ones). But then, how do you choose the reference class for the outside view? That choice is itself an inside-view judgment. So we have a problem:

  - To apply the outside view to your initial estimate, you need to pick a reference class. But picking the reference class is done from the inside view (you decide what counts as similar). Then, you might worry that your reference class choice is biased. So you take the outside view of your reference class choice? How? You might look at base rates of how well different reference classes have performed? But that's a meta-problem.

  In the doctor example:
  - Dr. Smith picks a reference class (e.g., the one with 70%).
  - But how did he pick that class? He might have chosen it because it fits his initial inside-view model? Or he might have chosen a different one.
  - Now, if he wants to be cautious, he might consider multiple reference classes and average them? But that's another inside-view move.

  The reflexivity problem is that the outside view is supposed to correct for biases in the inside view, but the application of the outside view itself requires inside-view judgments (about what reference class to use). This can lead to infinite regress or circularity.

  ### Which complaint is serious?
  The third complaint (arbitrariness of reference class) is the serious one because it exposes the fundamental difficulty in applying the outside view without judgment. The other two are more about confusion:

  1. The first complaint (about it being a different kind of reasoning) is often misunderstood because people conflate it with Bayesian updating (which it isn't) or with simply using base rates as a prior (which is a related but distinct practice).
  2. The second complaint (about epistemic modesty) is a confusion because modesty is a general virtue while the outside view is a specific technique. They are different tools.

  But the third complaint points to a genuine limitation: the outside view doesn't tell you how to choose the reference class, so it doesn't provide an automatic correction. It requires judgment, which may be biased.

  ### Bottom line for the column
  Now, the final line:

  **Bottom line:** The outside view is a corrective for biased inside-view reasoning, but it falters when the choice of reference class becomes an exercise of the very judgment it seeks to override.
answer: |-
  ### The Outside View: A Misunderstood Corrective  
  Let's cut through the fog. The "outside view" is often mangled into a vague platitude about base rates or humility, but it's a specific maneuver to counter the *inside view*—the detailed, case-specific reasoning that breeds overconfidence. To grasp it, consider a doctor evaluating a patient's prognosis, not the tired book-writing example.

  **The Case:** Dr. Lee has a 60-year-old patient, Maria, with type 2 diabetes, hypertension, and obesity. Maria has diligently followed her treatment for a year: she exercises, takes meds, and her blood sugar is stable. Dr. Lee’s inside view, built from Maria’s progress, suggests an 85% chance she avoids major complications (e.g., heart attack or kidney failure) in 5 years.  

  **1. Why the outside view is a different *kind* of reasoning**  
  The outside view isn’t about widening your prior or lowering confidence arbitrarily. It’s a shift in *how* you reason:  
  - **Inside view**: Bottom-up. Dr. Lee starts with Maria’s specifics (adherence, stability) and constructs a story.  
  - **Outside view**: Top-down. Ignore Maria’s story. Ask: "What’s the base rate for patients *like Maria*?" Suppose studies show only 60% of similar patients (age 60+, diabetes, hypertension, obesity) avoid complications in 5 years. That 60% is the outside-view estimate.  

  This isn’t Bayesian updating (where you’d treat the 60% as a prior and adjust with Maria’s details). It’s a *replacement* of case-building with class statistics. The outside view bypasses narrative entirely—it’s not "add base rates to your model," but "scrap your model and use the average."  

  **2. Why "epistemic modesty" isn’t the outside view**  
  "Epistemic modesty" preaches: "Be less sure—dial that 85% down to 75%." But this is vague calibration, not the outside view. They come apart sharply:  
  - Modesty might make Dr. Lee adjust to 75% based on gut doubt.  
  - The outside view forces a concrete 60% from data, *regardless* of modesty.  
  Crucially, the outside view can *increase* confidence if base rates are higher (e.g., if studies showed 90%). Modesty only pulls downward. The outside view is about *substituting* reasoning, not damping it.  

  **3. The real problem: Arbitrary reference classes**  
  Here’s the killer: You can construct an outside view for anything, making the advice useless alone. For Maria:  
  - Reference class 1: "Diabetic, hypertensive, obese 60-year-olds." Base rate: 60%.  
  - Reference class 2: "Patients who improved with treatment like Maria." Base rate: 80%.  
  - Reference class 3: "All diabetics." Base rate: 50%.  

  Which to choose? "Take the outside view" doesn’t say. Dr. Lee must use judgment to pick the "right" class—but that judgment is itself an *inside-view* move, vulnerable to bias (e.g., selecting Class 2 to justify optimism). This isn’t a minor hiccup; it’s why the outside view often fails in practice.  

  **The reflexivity trap**  
  Your researcher nailed it: The outside view is a model *of your model*. It claims, "Your inside-view reasoning is biased by unique details; ignore them and use the base rate." But choosing the reference class requires inside-view reasoning about what "similar" means. So:  
  - Step 1: Dr. Lee’s inside view says Maria is 85% safe.  
  - Step 2: Outside view challenges this: "Your model is biased; use a base rate."  
  - Step 3: But to pick a base rate, Dr. Lee must judge which reference class fits Maria—which is *more inside-view reasoning*.  

  This creates a loop:  
  - Take the outside view of Step 1 → Get base rate from Class A.  
  - Worry Class A was chosen biasedly → Take outside view of *that choice* → Need a base rate for reference-class selection (meta!).  
  It either collapses (you stop at an arbitrary class) or spirals. The outside view can’t validate itself without bootstrapping.  

  **Which complaint matters?**  
  The third—arbitrary reference classes—is the serious flaw. The others are confusions:  
  - Complaints 1 and 2 (it’s not just wider priors or modesty) stem from misdefining the outside view. Clear explanations fix that.  
  - But Complaint 3 exposes a fatal weakness: The outside view is only as good as the reference class, and choosing one requires the bias-prone judgment it aims to correct.  

  **Bottom line:** The outside view is a corrective for biased inside-view reasoning, but it falters when the choice of reference class becomes an exercise of the very judgment it seeks to override.
