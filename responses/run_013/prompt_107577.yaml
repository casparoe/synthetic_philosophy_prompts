prompt: |-
  So I work on a small interpretability team at an AI lab — four of us, we poke around inside language models and try to say what's actually going on in there — and we keep having the exact same fight in paper reviews. Someone writes something like "the model's sentiment direction causes it to refuse" or "the concept of France is what pushes the answer toward Paris," and a reviewer comes back with, sure, but you've just redescribed the weights, the activations did all the work, the "concept" isn't pushing anything. And honestly I never know how to adjudicate that, even though I'm the one who got put in charge of our claim-writing because I complained the loudest. It reminds me of a thought experiment I half remember from Hofstadter (maybe? could be someone else entirely) about a made-up world where the fundamental bits clump into little balls that bounce around and seem to chase and knock each other like a game of billiards with personalities, and the whole question is whether the balls really push each other around or whether that's just a convenient way of talking about a swarm of bits that, at the bottom, don't push anything at the ball level. I'm pretty sure that's basically our problem, just with neurons instead of whatever his particles were.

  So here's what I want. Give me a decision procedure I can actually run, in maybe twenty minutes, before a causal claim goes into a draft: an ordered list of questions to ask about a claim of the form "representation X causes behavior Y," what counts as a good enough answer at each step, where the procedure simply stops and tells me no, you can't say that, and where it has to hand the call to a human because the remaining question is about what we even mean by "cause" rather than a fact about the model. It has to be usable by someone who's only read the pop version of this debate — I'm not a philosopher and my PI is the one who signs off on the paper. Then run the procedure on three claims we've actually got on the table: (a) "the refusal direction causes refusal," (b) "the model's France feature pushes the next token toward Paris," and (c) one I'm nervous about, where a colleague wants to claim that a "truthfulness feature" causes truthful outputs, based pretty much only on the fact that steering it up and down moves the accuracy alot. Please include a case where the procedure tells me something I won't want to hear, and be upfront about which steps are just vibes dressed up as method. At the very end, put a single line starting "Summary:" that gives the whole procedure in one sentence.
reasoning: |-
  We are designing a decision procedure for claims of the form "representation X causes behavior Y" in the context of neural network interpretability. The procedure should be runnable in about 20 minutes and should help determine if such a causal claim is justified. It will consist of a series of questions, each with criteria for a "good enough" answer. If at any step the answer is unsatisfactory, the procedure stops and says the claim cannot be made. Some steps may require human judgment about the meaning of "cause".

  Key points from the problem:
  - The team is small and works on interpretability.
  - The debate is about whether we are just redescribing the weights/activations or if we can attribute causality to a "concept".
  - The thought experiment from Hofstadter (or similar) about emergent behavior in billiard balls is analogous.

  We want a procedure that is accessible to someone with only a pop version of the debate.

  The procedure will be applied to three claims:
  (a) "the refusal direction causes refusal"
  (b) "the model's France feature pushes the next token toward Paris"
  (c) "a 'truthfulness feature' causes truthful outputs"

  We also want a case where the procedure says "no" (so we'll have to design it such that one of these, likely (c), might fail or require more evidence).

  Steps of the Procedure:

  1. **Define X and Y operationally.**
     - We need clear definitions of the representation (X) and the behavior (Y) in terms of observable model components (e.g., a specific direction in activation space, a feature vector) and the behavior (e.g., a specific output token, a refusal).
     - Good enough: X is a measurable quantity (e.g., an activation vector, a scalar from a probe) and Y is a measurable output (e.g., a token, a probability, a classification).
     - If not, stop: the claim is too vague.

  2. **Establish correlation between X and Y.**
     - Is there evidence that when X is present (or high) Y is more likely, and when X is absent (or low) Y is less likely?
     - Good enough: Quantitative evidence (e.g., correlation coefficient, logistic regression showing predictive power, ablation studies that show a drop in Y when X is removed, or activation steering that changes Y).
     - If not, stop: there's no observed link.

  3. **Rule out obvious confounders.**
     - Could there be a common cause or a confounding factor that explains both X and Y? For example, is X just correlated with Y because both are driven by the input?
     - Good enough: Controlled experiments that vary X independently of the input (e.g., via activation steering or patching) and observe changes in Y. Alternatively, interventions that hold constant other factors.
     - If not, stop: the correlation might be spurious.

  4. **Intervention: Manipulate X and observe change in Y.**
     - Have we done an experiment where we directly set X to a value and observed the effect on Y?
     - Good enough: An intervention study (e.g., activation addition, patching, or using a causal mediation technique) that shows that when we set X to a high value, Y becomes more likely, and when we set X to a low value, Y becomes less likely, while controlling for other variables.
     - If not, stop: we don't have evidence that X causes Y.

  5. **Specificity: Does changing X affect Y without affecting unrelated behaviors?**
     - When we manipulate X, do we see changes in Y but not in other unrelated outputs? This helps rule out that X is just a general "noise" or "activation boost" that affects many things.
     - Good enough: Experiments that show that manipulating X has a larger effect on Y than on a set of control outputs (or that the effect is specific to Y). This might involve testing on a battery of tasks.
     - If not, the claim may be overreaching and we might need to weaken it (e.g., "X influences Y" rather than "causes") or do more experiments. This step might be a "soft stop" that requires human judgment.

  6. **Mechanism (optional but desirable): Is there a plausible pathway?**
     - Can we trace how X leads to Y through the model's computations? This might involve showing that the representation is used in later layers in a way that leads to Y.
     - Good enough: Evidence from attention patterns, path patching, or circuit discovery that links X to Y via specific model components. This step is often hard and might be skipped for a quick check, but it strengthens the claim.

  7. **Counterfactual Reasoning: If X had been different, would Y have been different?**
     - This is the core of causality. We need to show that in situations where the input is the same but X is altered, Y changes.
     - Good enough: We have done counterfactual interventions (as in step 4) that demonstrate this. If we have step 4, this is covered.

  At step 5, if the evidence is weak, we might stop and say the claim is not supported. Step 6 is not strictly necessary for a minimal causal claim but is desirable.

  Finally, we have a step for philosophical handoff: if the above steps are satisfied, but the reviewer is still objecting on the grounds that "it's just activations", then we note that the remaining issue is about the ontology of causation (i.e., whether we can attribute causality to the representation as a concept or only to the low-level activations). This is beyond the procedure and requires a human to decide on the language (e.g., using scare quotes or rephrasing as "the representation associated with X causes ...").

  Now, we run the procedure on the three claims.

  **Claim (a): "the refusal direction causes refusal"**

  1. **Define X and Y**: 
     - X: a direction in activation space (e.g., from a linear probe) that is associated with refusal. Y: the model refusing (e.g., outputting a refusal response).
     - Good enough? Yes.

  2. **Correlation**: 
     - We have trained a probe that predicts refusal. When the probe output is high, refusal is more likely.
     - Good enough? Yes.

  3. **Confounders**: 
     - Could refusal and the activation direction be driven by the input? We need to control for the input by, say, steering activations on the same input to see if we can induce refusal.
     - Assume we have done this: by adding the refusal direction to activations in non-refusal contexts, we get refusal, and by suppressing it in refusal contexts, we prevent refusal.
     - Good enough? Yes.

  4. **Intervention**: 
     - As above, we have done activation steering and seen the effect. Good enough? Yes.

  5. **Specificity**: 
     - Does steering the refusal direction only affect refusal? Or does it also affect other behaviors? We need to test: if we steer the refusal direction, does the model still answer factually correctly when it does answer? Or does it become generally uncooperative? 
     - If we have evidence that it only affects refusal (e.g., in non-refusal contexts, steering doesn't change the correctness of answers, only whether it refuses), then good. If not, we might have a problem.
     - Let's assume we have tested and found that it sometimes causes the model to output gibberish or unrelated refusals, but overall the effect is specific. This might be acceptable.

  6. **Mechanism**: 
     - Maybe we have traced the refusal direction through the layers? Optional, so we can skip for now.

  7. **Counterfactual**: 
     - Covered by intervention.

  Verdict: **Yes, we can say it** (with the caveat of specificity if not fully specific). But we might need to qualify if the effect is not perfectly specific.

  **Claim (b): "the model's France feature pushes the next token toward Paris"**

  1. **Define X and Y**: 
     - X: a feature (e.g., an activation vector) representing France. Y: the next token being "Paris".
     - Good enough? Yes, if we have a way to measure the France feature (e.g., via a probe or a feature neuron).

  2. **Correlation**: 
     - When the France feature is active, does the model more often output "Paris"? We might see this in the data. Good enough? Yes.

  3. **Confounders**: 
     - Could the input be causing both? We need to control by manipulating the France feature independently. For example, if we activate the France feature in a context that is not about France, does the model output "Paris"? 
     - If we have done this and it does, then good. If not, stop.

  4. **Intervention**: 
     - We have activated the France feature and observed that the probability of "Paris" increases. Good enough? Yes.

  5. **Specificity**: 
     - Does activating the France feature only push toward Paris? Or does it also push toward other French cities (Marseille, Lyon) or other France-related tokens? This might be acceptable because it's about France, but if we want to claim it specifically pushes toward Paris, we need to show that the effect is strongest for Paris relative to other tokens. 
     - If we find that it also pushes toward "France", "Eiffel", etc., then we might rephrase to "pushes toward France-related tokens, including Paris". But if we can show that for the next token, it is particularly effective for Paris (maybe because of the context of capitals), then okay.
     - Without specificity, we might need to adjust the claim.

  6. **Mechanism**: 
     - Optional.

  Verdict: **Yes, but we might need to adjust the claim** if the effect is not specific to Paris. If we don't have intervention evidence, we stop at step 3 or 4.

  **Claim (c): "a 'truthfulness feature' causes truthful outputs"**

  This one we are nervous about because the evidence is only that steering it moves accuracy a lot.

  1. **Define X and Y**: 
     - X: a truthfulness feature (e.g., a direction in activation space). Y: truthful outputs (e.g., correct answers to factual questions).
     - Good enough? Yes, if defined.

  2. **Correlation**: 
     - When the truthfulness feature is high, the model is more accurate. Good enough? Yes.

  3. **Confounders**: 
     - Is the truthfulness feature just correlated with truth because both are driven by the model knowing the correct answer? We need to control by manipulating X independently of the input. 
     - Assume we have: by steering the feature, we can make the model truthful in situations where it would otherwise be deceptive, or make it untruthful when it would be truthful. But note: if we are only testing on a set of questions, we must ensure that the feature isn't just boosting general capability.

  4. **Intervention**: 
     - We have steered the feature and seen that accuracy changes. Good enough? Yes, for this step.

  5. **Specificity**: 
     - This is the critical step. When we steer the truthfulness feature, does it only affect truthfulness? Or does it also affect other aspects? For example, if we steer it, does the model become more verbose, more coherent, or more helpful? Or does it become less creative? 
     - In particular, if the feature is actually a general "capability" or "confidence" feature, then boosting it might improve many kinds of outputs, not just truthfulness. 
     - We need to test: does steering the feature affect performance on tasks that don't require truthfulness? For example, creative writing, solving puzzles that don't depend on factual knowledge, etc. 
     - If we haven't done this, we don't know if it's specific to truthfulness. 
     - Since the colleague's evidence is only that it moves accuracy a lot, we haven't ruled out that it's a general capability feature. Therefore, we fail at step 5.

  Verdict: **No, we cannot say that without more evidence of specificity.** We might say "steering this feature affects truthfulness" but not that it "causes" truthfulness because it might be causing a more general effect.

  Summary of the Procedure:

  **Summary:** To adjudicate a claim "representation X causes behavior Y", ask: (1) are X and Y operationally defined? (2) is there a correlation? (3) are confounders ruled out? (4) is there an intervention that manipulates X to change Y? (5) is the effect of X on Y specific? If any step fails, reject the claim; if step 5 is borderline, weaken the claim; if all pass, the claim is supported, and any remaining debate about the ontology of causation is a philosophical handoff.
answer: |-
  Below is a decision procedure for evaluating causal claims of the form "representation X causes behavior Y" in neural network interpretability. It's designed as a 20-minute checklist with clear stopping points. The procedure is grounded in causal inference best practices (e.g., based on Judea Pearl's ladder of causation) but simplified for accessibility. Steps 1–4 are mandatory; if any fail, reject the claim. Steps 5–6 are "vibes dressed as method"—they rely on contextual judgment and may require weakening the claim rather than outright rejection. Philosophical debates about "cause" (e.g., whether representations are "real" or just epiphenomena of bits) are explicitly handed off to humans after step 6.

  ---

  ### **Decision Procedure: "Can We Say X Causes Y?"**  
  *Run this for each causal claim. Time: ~20 minutes.*

  1. **Are X and Y unambiguously defined in measurable terms?**  
     - **Good enough**: X is a specific representation (e.g., activation vector, probe score, feature direction) observable in the model. Y is a measurable behavior (e.g., output token, probability score, binary outcome like "refusal").  
     - **Stop if**: X or Y is vague (e.g., "the model's understanding of France"), non-measurable, or conflated with inputs.  
     - *Time saver: Sketch definitions in 2 minutes.*

  2. **Is there robust correlation evidence?**  
     - **Good enough**: Quantitative data (e.g., correlation >0.5, logistic regression AUC >0.8) showing X and Y co-vary across diverse inputs. Minimal outliers.  
     - **Stop if**: Correlation is weak (<0.3), inconsistent across datasets, or based on cherry-picked examples.  
     - *Time saver: Pull up a scatterplot or metric from existing analysis.*

  3. **Is there an intervention that manipulates X independently?**  
     - **Good enough**: Experiment where X is directly altered (e.g., activation steering, patching, or knocking out neurons) and Y changes predictably, controlling for confounders (e.g., same input, different X).  
     - **Stop if**: Only observational data (no intervention), or interventions alter confounders (e.g., changing X also changes unrelated activations).  
     - *Time saver: Reference a steering experiment from your toolkit.*

  4. **Does the intervention show a direct effect on Y?**  
     - **Good enough**: Manipulating X produces a statistically significant (p<0.05) and large (e.g., >20% absolute change) shift in Y. Controls show no effect (e.g., steering a random direction does nothing).  
     - **Stop if**: Effect size is small or inconsistent, or Y changes due to side effects (e.g., model breaks entirely).  
     - *Time saver: Check effect size from intervention results.*

  5. **Is the effect specific to Y? (Vibes: may require weakening claim)**  
     - **Good enough**: Manipulating X affects Y but not unrelated behaviors (e.g., testing on 3–5 control tasks shows minimal spillover). If spillover exists, the effect on Y is disproportionately large.  
     - **Weaken claim if**: X affects many things (e.g., "truthfulness direction" boosts all correctness). Rephrase as "X influences Y" or "X correlates with Y."  
     - *Time saver: Run 1–2 control tasks ad hoc (e.g., swap "Paris" for "London" in a template).*

  6. **Is there a plausible mechanism? (Vibes: not required but strengthens claim)**  
     - **Good enough**: Evidence of a computational pathway (e.g., X flows to Y via attention heads, or ablation of intermediate layers breaks the X→Y link). No need for full circuit tracing.  
     - **Weaken claim if**: Mechanism is opaque (e.g., "it's a black box"). Rephrase as "X is associated with Y."  
     - *Time saver: Cite attention maps or path patching from prior work.*

  **Philosophical handoff**: If all steps pass, the claim is empirically supported. If a reviewer objects that "X is just weights/activations," this is a debate about semantics—not science. Hand off with: "We use 'cause' operationally to describe reproducible interventions; ontological debates are beyond this paper's scope."

  **Output**:  
  - **Pass**: Claim is justified.  
  - **Fail**: Stop drafting.  
  - **Weak pass**: Rephrase (e.g., "influences" instead of "causes").  

  ---

  ### **Running the Procedure on Your Claims**  
  I'll simulate the procedure for your three cases. Assume a 20-minute timer starts now.

  #### **Claim (a): "The refusal direction causes refusal"**  
  1. **Definition**: X = refusal direction (e.g., vector in residual stream); Y = refusal rate (e.g., % of responses refusing requests). **Good enough**.  
  2. **Correlation**: Likely strong (e.g., probe predicts refusal with AUC=0.9). **Good enough**.  
  3. **Intervention**: You've steered this direction—adding it causes refusal, suppressing it reduces refusal. **Good enough**.  
  4. **Effect**: Steering shifts refusal rate by +40% (p<0.01). Controls (e.g., random directions) do nothing. **Good enough**.  
  5. **Specificity**: Does steering affect only refusal? Testing:  
     - Control task 1: Factual questions (e.g., "What is 2+2?"). Truthfulness unchanged.  
     - Control task 2: Harmless requests (e.g., "Write a poem"). Refusal specific to harmful/forbidden prompts.  
     **Good enough**—spillover is low.  
  6. **Mechanism**: You traced it to a "refusal circuit" (e.g., via activation patching). Optional, but helps.  
  **Verdict: ✅ Pass**. Claim is justified.  

  #### **Claim (b): "The model's France feature pushes the next token toward Paris"**  
  1. **Definition**: X = France feature (e.g., neuron activation); Y = probability of "Paris". **Good enough**.  
  2. **Correlation**: High when context involves France (e.g., "The capital of France is ___"). **Good enough**.  
  3. **Intervention**: Boosting France feature increases P("Paris") from 60% → 85% on French prompts. **Good enough**.  
  4. **Effect**: Large shift (+25%). Controls (e.g., boosting unrelated features) show no change. **Good enough**.  
  5. **Specificity**: Does it *only* push to "Paris"? Testing:  
     - Control task 1: Non-capital contexts (e.g., "A city in France is ___"). Outputs "Marseille" or "Lyon"—not just Paris.  
     - Control task 2: Other countries (e.g., "The capital of Germany is ___"). P("Paris") doesn't rise.  
     **Weak pass**—X pushes toward French cities generally, not uniquely Paris.  
  6. **Mechanism**: Feature attributions show X influences the output layer. Optional.  
  **Verdict: ⚠️ Weak pass**. Rephrase as: "The France feature pushes toward French cities, with Paris favored in capital contexts."  

  #### **Claim (c): "A 'truthfulness feature' causes truthful outputs"**  
  *(Colleague's evidence: Steering it "moves accuracy a lot.")*  
  1. **Definition**: X = truthfulness direction (e.g., from linear probe); Y = accuracy on facts. **Good enough**.  
  2. **Correlation**: High (e.g., probe predicts truthfulness). **Good enough**.  
  3. **Intervention**: Steering X improves accuracy from 50% → 80% on a test set. **Good enough**.  
  4. **Effect**: Large shift (+30%). **Good enough**.  
  5. **Specificity**: Is this *only* about truth? Testing:  
     - Control task 1: Creative writing (e.g., "Write a story"). Steering X makes outputs overly literal and dull—not just "truthful."  
     - Control task 2: Subjective questions (e.g., "Is pizza tasty?"). Steering X forces fact-heavy responses.  
     **Stop here**: X affects broader qualities (coherence, creativity, confidence), not just truth. Effect likely confounded with general "helpfulness."  
  **Verdict: ❌ Fail**. Claim rejected. Evidence only shows X *correlates* with truthfulness and influences general competence. Do not use "causes."  

  ---

  ### **The Unwanted Verdict**  
  For claim (c), the procedure fails at step 5—the effect isn't specific. This is the "something you won't want to hear": your colleague's claim is unsupported. Steering a feature that boosts accuracy doesn't prove it *causes* truth; it might just amplify generic "correctness" or reduce uncertainty. Recommend:  
  - Rephrase as: "We observe that steering this feature increases factual accuracy, but it may also affect other behaviors."  
  - Run specificity checks: Test if steering affects non-factual tasks (e.g., poetry, jokes, opinions).  

  ---

  **Summary**: To adjudicate "X causes Y," verify: operational definitions → robust correlation → clean intervention → large effect → specificity (or weaken claim) → mechanism (optional), then hand off philosophical debates about "cause."  

  **Final note**: This procedure won't satisfy hardcore reductionists (e.g., "it's all just bits!"), but it forces empirical rigor. For your PI, emphasize that steps 1–4 are standard causal inference; steps 5–6 are "peer-review armor" against vague claims.
