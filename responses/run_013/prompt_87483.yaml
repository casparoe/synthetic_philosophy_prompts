prompt: |-
  I teach an upper-level phil of language seminar — 16 students, one 75-minute block — and I want them to feel why semantic externalism is tempting, and then why it's strange, instead of me just narrating Twin Earth at them. No lecture up front, and they shouldn't hear the word "externalism" until the debrief. Seed idea, please fix it and flesh it into something I can actually run: split the class into two teams in separate rooms, each cataloging a green stone they've both been calling by the same word. Use jade, where one team's sample is nephrite and the other's is jadeite, or a comparable one-word-two-natures case if you have a better one. Each team gets a private profile of its own sample and fills out a meaning card for the word: a definition, how you'd recognize the stuff, and what would show you were wrong. Then reunite and compare the cards — they'll match, since both teams only had surface properties to go on — reveal the two profiles, and make them trade: each team needs a shipment of the other's stone to do a specified job, and the two minerals perform differently, so the trade quietly fails even though both teams' cards said same stuff. Give me rules, materials, a minute-by-minute timeline, and a debrief that maps each beat onto narrow vs. wide content, the meanings-aren't-in-the-head intuition, and the question of whether the teams meant the same thing all along or were just ignorant. Tell me what will predictably go wrong the first time (someone will insist both teams are simply wrong about the extension, someone else will want to make it all about definitions) and how to turn those into the discussion. And be honest about which feature of the idea the activity can't reproduce and I'll have to supply myself.
reasoning: |-
  Okay, let me tackle this philosophy of language activity request. The professor wants students to experience semantic externalism through a hands-on Twin Earth-like scenario, avoiding upfront lecturing. 

  First, considering the core objective: making students feel both the temptation and strangeness of externalism. The jade/nephrite idea is solid - it's a real-world example where surface properties match but underlying nature differs. But I wonder if we should address potential confusion points upfront. For instance, students might fixate on dictionary definitions or claim both teams were simply wrong.

  Hmm... the timeline needs careful structuring. The separation phase is crucial - teams must truly believe they're examining the same substance. Maybe we should provide identical surface property cards to both teams, withholding the chemical composition until the reveal. The "meaning cards" should have specific prompts about definition, recognition criteria, and falsification conditions.

  For the failure moment: the trade scenario needs concrete tasks where jadeite and nephrite behave differently - like heat resistance or carving properties. This creates that "aha" moment when semantic intuitions clash with physical reality.

  Anticipating discussion pitfalls: some students will argue the word "jade" was always ambiguous. That's actually productive! We can pivot to whether meaning depends on external factors even when speakers are ignorant. Others might claim both teams meant the same because they'd correct their definitions upon learning - that's perfect for introducing the rigidity of natural kind terms.

  The debrief should map each activity beat to philosophical concepts: initial agreement (narrow content), physical reveal (wide content), failed trade (extension beyond verification). Crucially, we must acknowledge what the simulation can't capture: the metaphysical weight of Putnam's "meanings just ain't in the head" intuition. The activity shows the phenomenon, but the why requires teacher narration.

  Materials list should be practical: laminated property cards, meaning worksheets, roleplay shipment requests. And timing... 75 minutes is tight. 15m setup, 20m team work, 15m comparison, 20m reveal/failure, 10m trade discussion, leaving 30m for debrief. Might need to trim where possible.

  The unresolved tension we can't simulate: why externalism feels strange. The activity forces the recognition that meaning outruns knowledge, but the philosophical unease comes from realizing our mental states don't fix reference. That needs explicit framing during debrief.
answer: |-
  Here’s a polished, classroom-ready simulation designed to induce the "aha" moment for externalism. It leans into the *ignorance-to-revelation* arc while prepping you for predictable debates.

  **Core Fixes & Enhancements:**
  - **Jade is PERFECT** (nephrite vs. jadeite): Common name, identical appearance, divergent physical properties.
  - **Clarified "Meaning Cards"**: Forces focus on *operational criteria*, not definitions.
  - **Controlled Reveal**: Teams see *only surface properties* initially, hiding chemical composition/location.
  - **Engineered Failure**: Concrete task mismatch (carving durability) makes the semantic divergence undeniable.
  - **Debrief Mapping**: Explicitly links each beat to key concepts.

  ---

  ### **Activity: The Jade Exchange**
  **Prep Time**: 15 min  
  **Materials**:  
  - 2 × **"Sample Profile" Packets** (laminated cards in envelopes):  
    - **Team A (Nephrite)**:  
      - *Card 1 (Surface)*: "Color: Emerald to pale green. Texture: Smooth, waxy luster. Hardness: Scratches glass. Density: Feels heavy for size."  
      - *Card 2 (Hidden/Reveal)*: "Chemical: Calcium magnesium silicate. Source: New Zealand riverbeds. **Property: Brittle under rapid carving tools; fractures easily.**"  
    - **Team B (Jadeite)**:  
      - *Card 1 (Surface)*: Identical wording to Team A’s Card 1.  
      - *Card 2 (Hidden/Reveal)*: "Chemical: Sodium aluminum silicate. Source: Burmese mines. **Property: Extremely tough; withstands high-speed carving.**"  
  - 2 × **Meaning Worksheets** (identical for both teams):  
    - *Define 'Jade'*: "A hard, green stone used in jewelry and carvings."  
    - *How to recognize it*: [Blank]  
    - *What would prove something isn’t jade?*: [Blank]  
  - **Shipment Request Cards** (post-reveal):  
    - Team A: "Urgently need jade for high-speed CNC carving of intricate figurines."  
    - Team B: "Urgently need jade for hand-chiseling ceremonial masks (using impact tools)."  

  ---

  ### **Timeline (75 Min Total)**
  1. **Setup (5 min)**:  
     - Split class: Team A (nephrite) to hallway/adjacent room, Team B (jadeite) stays.  
     - Hand each team their **Sample Profile Packet (Card 1 ONLY)** and **Meaning Worksheet**.  
     - *Instructions*: "You’re mineralogists for ‘GemCo’. Catalog this stone your company calls ‘jade’. Fill out the meaning card **based solely on your expertise and this sample**. Be precise—this defines quality control."  

  2. **Team Work (20 min)**:  
     - Teams describe recognition criteria/proof of non-jade **using ONLY surface properties** (e.g., "Scratches glass, waxy green," "Fails if too soft/not green").  
     - *Critical*: Circulate to ensure no metaphysical speculation. Redirect: "What tests would a new hire run at the warehouse?"  

  3. **Reunion & Comparison (15 min)**:  
     - Teams share worksheets. Project responses side-by-side. They’ll match nearly verbatim.  
     - *Instructor*: "Consensus! Both teams have identical criteria for ‘jade’. Seems like you’re referring to the same stone."  

  4. **The Reveal & Trade (15 min)**:  
     - **Step 1**: Give each team their **Card 2** (hidden properties). Let them process.  
     - **Step 2**: Hand out **Shipment Request Cards**.  
     - *Instructor*: "GemCo needs a stone exchange. Team A: Send jade to Team B for their task. Team B: Send jade to Team A for theirs. *Based on your sample and meaning card, is this trade viable?*"  
     - **Result**: Team A (nephrite) realizes their stone will shatter in Team B’s CNC machine. Team B (jadeite) knows their stone will blunt Team A’s chisels. Trade fails despite identical meaning cards.  

  5. **Initial Reaction (5 min)**:  
     - Let frustration simmer. Ask: *"What just happened? Did both teams mean the same thing by 'jade'?"*  

  ---

  ### **Predictable Objections & How to Leverage Them**
  1. **"Both teams were just WRONG about what jade is!"**  
     - *Pivot*: "Were they? What *should* they have put on their meaning cards? Could they have known?" → Highlights **ignorance vs. error**. Push: "If they couldn’t possibly have known the difference, does that mean they meant the same thing *until* they learned?"

  2. **"This is about definitions! We need better science!"**  
     - *Pivot*: "Suppose GemCo updates the definition to include chemistry. Did the *old* meaning cards refer to nephrite/jadeite all along? Or did the word ‘jade’ change meaning?" → Tees up **rigidity of natural kind terms** vs. descriptivism.

  3. **"They meant the same *concept*, but it applies to two things"**  
     - *Pivot*: "What *is* the concept? ‘Green carvable stone’? But that concept fits both. So when Team A said ‘jade’, did they *intend* to refer to nephrite? How?" → Forces **causal-historical theories of reference**.

  ---

  ### **Structured Debrief (20 min)**  
  Map each beat to philosophy while writing terms on the board:  
  | **Activity Beat**          | **Philosophical Concept**                          | **Externalism Lesson**                                  |  
  |----------------------------|---------------------------------------------------|--------------------------------------------------------|  
  | Teams catalog surface properties | **Narrow content** (intrinsic mental state)     | Meanings *seem* identical because brains are identical. |  
  | Meaning cards match        | **Shared descriptive criteria**                   | Temptation of internalism: meaning = verificationist checklist. |  
  | Hidden properties revealed | **Wide content** (environmental dependence)      | Meaning depends on external facts (chemistry/location). |  
  | Trade fails                | **Extension divergence**                          | Identical narrow content → different referents. Meanings aren’t in the head! |  
  | "Were they wrong?" debate  | **Ignorance vs. error / Linguistic division of labor** | Experts fix reference; speakers defer to hidden structures. |  
  | "Same all along?" tension  | **Temporal externalism**                          | Team A *always* referred to nephrite, even when ignorant of its nature. |  

  **Crucial Wrap-Up Qs**:  
  - "When Team A said ‘jade’ *before* the reveal, did that word pick out jadeite across the world? Why/why not?"  
  - "If meanings aren’t in the head, *where* are they? What fixes reference?" (Hint: causal chains, microstructure)  

  ---

  ### **What the Activity CAN’T Simulate (Requires Your Narration)**
  **The Metaphysical Shock**: Students will grasp *that* meaning depends on the external world, but the profound strangeness of "My thoughts alone don’t determine what I’m thinking *about*" needs your emphasis. Hammer:  
  > *"Externalism isn’t just about ignorance—it means two molecule-for-molecule identical brains on Earth and Twin Earth are thinking different thoughts when they say ‘water’. Nothing in their heads fixes reference. That’s why Putnam said: ‘‘Cut the pie any way you like, meanings just ain’t in the head!’’"*

  **Run it tight, let the failure sting, and they’ll feel the pull of externalism before they know its name.** Good luck!
