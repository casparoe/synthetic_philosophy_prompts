prompt: |-
  I'm finishing a philosophy degree and writing a paper on the ethics of promising — basically on whether promises are their own kind of reason at all, or whether "I promised" is just a dressed-up way of saying "I've given you grounds to expect something." My supervisor keeps telling me to stop reading and start from cases, so here's where I've got to. I'd like you to take the role of someone who's spent a career on normative ethics and the philosophy of promising, think carefully, and help me find the principle (or principles) behind my gut verdicts:

  (i) I promised my friend Dana I'd help her move on Saturday. Friday night my kid spikes a fever. I think I'm allowed to bail — but not just to bail; I have to tell her the second I know, and I'd still owe her something (I'd offer to pay for half the movers). (ii) I promised my brother I'd co-sign a loan, then found out he'd lied to me about his debts. I don't think I'm merely *permitted* to back out — the promise is gone, void rather than outweighed. (iii) I promised a coworker I'd keep his job hunt quiet, then found out he's interviewing at a firm mid-merger with ours. I think I can tell our manager, and it's not a close call. (iv) I promised a friend I'd go to her one-woman show, then got a much better invitation for the same night. I think I have to go to the show. (v) Here's the one that bugs me: I promised a colleague I'd put his name forward for a fellowship. Nobody knows I made the promise, and he'd never find out if I didn't do it. I still think I have to. (vi) At a charity gala the host asks me to promise I'll come next year and I say "yes, absolutely." I don't think that binds me in the slightest. (vii) My father, dying, asked me to promise to visit my mother every Sunday. I think I'm bound by that, and bound *more* tightly than if my mother had asked me herself in a good mood — though I also think it was a bit unfair of him to ask. (viii) I promised myself I'd quit drinking for a month; breaking it feels like a failure of willpower, not like wronging anybody. (ix) I promised my grandmother I'd keep going to church. She has since died. I still feel bound, but I honestly can't say to whom. (x) I got drunk and promised a guy at the bar I'd lend him my car. I don't think that one counts.

  The pair I can't reconcile is (v) and (vi): in both, nobody is relying on anything and nobody would ever know, and I get opposite verdicts. And (vii) vs. (ix)/(viii) cuts the other way: if promises bind because you've given someone grounds to expect something, my father's request should bind *less* — he's gone and my mother never even heard it — but it binds more. My tentative principle, which I'd like you to test and repair rather than just admire: breaking a promise is wrong because you've invited someone to plan around you, made yourself a fixed point in their deliberation, and breaking it betrays that. Does any version of this keep (v) and (ix) while giving up (vi)? And is my void/outweighed talk in (i)–(iii) a real distinction or am I just dressing up different degrees of weight? Please don't give me citations, a reading list, or names to look up — I won't chase them down, I just want the argument.

  Format it like this, with these section headings in this order: **Brainstorm** (roughly 200 words — the distinctions that look like they're doing real work here, before you commit to anything); **Candidate principles** (two or three, each stated as precisely as you can in about 100 words, with the case that motivates each clause); **Case-by-case** (one line per case, i through x, saying what each principle delivers and where they split); **Cases I didn't give you** (three or four new ones you invent, with their verdicts and the reasoning, especially any that separate your surviving principles); **What I have to give up** (which of my ten verdicts each principle can't accommodate, and what you'd tell me about them); and **Bottom line** (one paragraph — which principle you'd actually endorse, and the single strongest reason to doubt it).
reasoning: |-
  Hmm, the user is finishing a philosophy degree and writing a paper on the ethics of promising. They're stuck on reconciling their intuitive judgments about different promise cases, particularly cases (v) and (vi) which seem contradictory. Their supervisor advised them to start from cases rather than reading more, so they've listed ten scenarios with their gut verdicts.

  Looking at their cases, several patterns emerge: 
  - The reliance view alone can't explain why some promises bind without reliance (v, ix) or why some don't bind despite potential reliance (vi). 
  - Intentionality matters - the charity gala promise (vi) feels hollow while the private fellowship promise (v) feels binding. 
  - Relationships give weight - the father's deathbed promise (vii) binds more than if the mother asked directly. 
  - Voiding vs overriding appears distinct - in case (ii) with the lying brother, the promise seems void rather than just outweighed. 

  Their proposed principle about "inviting someone to plan around you" is insightful but needs refinement. The key might be distinguishing when we genuinely transfer deliberative authority versus when we're just making performative utterances. 

  For the charity gala (vi), everyone understands such promises aren't serious commitments. Whereas for the fellowship (v), the colleague genuinely entrusted their professional interest to the promisor's judgment. This explains why (v) binds despite no reliance - the promisor has taken on responsibility as an agent. 

  The deathbed promise (vii) works similarly - the father transferred stewardship of the mother's wellbeing. Self-promises (viii) and drunk promises (x) fail because there's no second party to whom authority is transferred. 

  I'll develop three candidate principles: 
  1) A refined version of their "deliberative authority" view 
  2) A "relationship-role" view focusing on normative positions 
  3) A standard "expectation-creation" view 

  The deliberative authority view handles most cases best, though it struggles slightly with the posthumous church promise (ix). For that, we might need to acknowledge that some promises create ongoing identity-constituting commitments. 

  The void/outweighed distinction in (i)-(iii) is real and maps well to whether the promise was properly constituted from the start. When fundamental conditions are violated (like the brother's deception), there's no promise to override.
answer: |-
  **Brainstorm**  
  Your cases reveal at least four distinctions: (1) *Intentionality*: Promises made in contexts where commitment is clearly not intended (vi) vs. earnest contexts (v). (2) *Normative transfer*: Promises that transfer deliberative authority to the promisee (v, vii) vs. those that don’t (vi, viii, x). (3) *Relationship roles*: Promises invoking special responsibilities (e.g., filial in vii) bind more tightly than general ones. (4) *Constitutive conditions*: Some promises are void if based on deception (ii) or impossibility (iii), not merely overridden. The "grounds for expectation" view struggles with (v), (ix), and (vii), where bindingness persists despite negligible reliance. Conversely, (vi) and (x) suggest that not all utterances labeled "promises" create obligations, implying a performative or contextual element.  

  **Candidate Principles**  
  1. **Deliberative Authority Transfer (DAT)**: *When you sincerely promise, you transfer to the promisee a limited authority to shape your practical reasoning, making their stake a non-negotiable part of your deliberations. Breaking it wrongs them by usurping this authority.* Motivated by (v): Your colleague entrusted his interest to you; violating this betrays your role as his agent. Addresses (vii): Your father delegated oversight of your mother’s wellbeing, making it your duty.  

  2. **Relational Normative Position (RNP)**: *Promises create obligations by altering normative positions within relationships. They bind when they activate role-based duties (e.g., filial piety in vii) or create a fiduciary dynamic (e.g., confidentiality in iii).* Motivated by (ii) vs. (i): Lying voids your brother’s claim by violating relationship norms; your child’s illness doesn’t void filial duty but recontextualizes it.  

  3. **Expectation-Responsibility (ER)**: *Promises bind only if they induce reasonable, detrimental reliance. Breaking them wrongs the promisee by exploiting their vulnerability.* Motivated by (i): Bailing harms Dana’s plans; offering movers mitigates harm. Explains (vi): No reliance at a gala, so no obligation.  

  **Case-by-Case**  
  | Case | DAT | RNP | ER |  
  |------|-----|-----|----|  
  | i    | Bail permitted but must inform/compensate (betrayal minimized) | Bail permitted (parental duty overrides) | Bail permitted (if illness prevents reliance) |  
  | ii   | Promise void (authority granted under false pretenses) | Promise void (relationship norm violated) | Permitted to back out (no reliance if lie exposed) |  
  | iii  | Can tell (authority void; conflict with higher duty) | Can tell (loyalty to firm overrides) | Can tell (preventing harm > promise) |  
  | iv   | Must go (granted authority binds) | Must go (friendship duty) | Must go (reliance likely) |  
  | v    | Must nominate (authority transferred privately) | Must nominate (collegiate duty) | No obligation (no reliance) :x: |  
  | vi   | No obligation (no intent to transfer authority) | No obligation (no relationship role invoked) | No obligation (no reliance) |  
  | vii  | Bound tightly (delegated stewardship) | Bound tightly (filial role + deathbed weight) | Weak/No obligation (mother unaware) :x: |  
  | viii | Not wronging (no other party granted authority) | Not wronging (self-relation exempt) | Not wronging (no other reliant) |  
  | ix   | Bound (authority persists posthumously) | Bound (role as granddaughter endures) | No obligation (no reliance) :x: |  
  | x    | No promise (no capacity to transfer authority) | No promise (drunkenness voids intent) | No promise (unreasonable reliance) |  

  **Cases I Didn’t Give You**  
  1. *Promise to a stranger to water plants while they’re abroad; they die mid-trip.* **Verdict**: Still obligated. DAT: Authority was transferred; death doesn’t revoke it. RNP: Duty to honor commitments to the deceased. ER: No reliance, so no obligation → rejects.  
  2. *Promise to donate anonymously to a charity; you later lose wealth.* **Verdict**: Permitted to skip. DAT: Charity isn’t a "party" granted authority. RNP: No specific relationship. ER: No individualized reliance.  
  3. *Promise under gunpoint to return stolen goods to owner.* **Verdict**: Not binding. DAT: Coercion voids authority transfer. RNP: Coercion negates voluntary duty. ER: Reliance unreasonable.  
  4. *Promise to attend a rival’s event to spy, discovered pre-event.* **Verdict**: Permitted to skip. DAT: Authority voided by deception. RNP: Promise violates norms of sincerity. ER: Reliance induced by fraud.  

  **What I Have to Give Up**  
  - **DAT**: Must soften (viii): Self-promises involve self-authority but feel different. Accept that "wronging" requires interpersonal structure.  
  - **RNP**: Struggles with (v): Collegial relationships are weaker than filial; might need ad hoc weighting. May overextend "roles."  
  - **ER**: Must abandon (v), (vii), (ix): These lack reliance but bind. You’d need to deny your intuitions here or reinterpret "reliance" as hypothetical.  
  - **Void/Outweighed Distinction**: DAT and RNP preserve it: (ii) is void (invalid transfer/norm violation); (i) is overridden (competing duty). ER blurs them.  

  **Bottom Line**  
  **Endorse Deliberative Authority Transfer (DAT)**, refined: *A promise is a voluntary transfer of limited practical authority to the promisee, creating a fiduciary-like obligation to uphold their stake in your reasoning. Bindingness depends on contextual sincerity and capacity.* It best explains (v) vs. (vi) (sincere transfer vs. performative speech), (vii) (delegated stewardship), and (ix) (authority outlives the promisee). The strongest doubt: Why does authority *persist* posthumously (ix) or without the promisee’s awareness (v)? This risks mysticism; the answer must be that the promisor’s *own agential identity* is reconstituted by accepting the role (e.g., "keeper of grandmother’s wish"), making betrayal self-disintegration. But this edges into moral psychology, not pure normativity.
