  - Equating ancient and modern practices anachronistically  
  - Oversimplifying Herodotus/Thucydides' complex methods  
  - Questioning Thucydides' truthfulness about eyewitnessing  

  For media scholars, the pitfalls are different:  
  - They might push back on treating journalism as monolithic  
  - Or question whether newsroom rules are truly "folk" degenerations  

  Top objections should include:  
  1. **Anachronism accusation** (high likelihood/high damage): Classicists hate projecting modern concepts onto antiquity. They'll argue "source independence" didn't exist as a conscious criterion then.  
  2. **Thucydides' eyewitness claim dismissal** (very likely/high damage): Attacking his famous 1.22 statement is heresy. Scholars will defend it as sincere methodology.  
