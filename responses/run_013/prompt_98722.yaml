  4. **Transmission-tree practicality** (medium likelihood/high damage): Ancient historians will say reconstructing transmission trees is impossible with fragmentary evidence.  
  5. **Criterion of embarrassment false equivalence** (medium likelihood/medium damage): Media scholars might argue journalists rarely use this systematically.  

  The "hoped nobody asks" question is the Achilles' heel: **"If both traditions fail similarly, what's your alternative?"** This exposes the lack of a positive methodology in the thesis.  

  Replies need academic rigor but stay within 2 minutes. Soft spots to flag:  
