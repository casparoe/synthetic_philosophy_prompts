prompt: |-
  I sit on the grants committee of a small foundation that funds projects under the heading equality of opportunity. We have a new proposal to decide, and I want to know what our own past decisions commit us to. Here is how I would reconstruct our precedents.

  (1) We funded a costly wheelchair-accessible van for a man with a spinal injury. His self-reported life satisfaction was already above average and the van did not raise it much. We funded it because it restored his ability to get to work and to visit friends without assistance.

  (2) We declined to fund a cosmetic dental procedure for a woman whose self-esteem and reported happiness were very low because of her teeth. The procedure would have raised her subjective well-being substantially. We said we were not in the business of buying happiness, and that her objective situation was not one of deprivation in the relevant sense.

  (3) We funded a sign-language interpreter for a deaf graduate student even though a cheaper real-time captioning service would have produced the same exam scores and the same reported satisfaction. We reasoned that the interpreter let her participate in seminars in the way hearing students do.

  (4) We declined to fund a life-coaching program for a low-income man who said his life felt meaningless, because the program would have improved his mood but not his material or health circumstances. We told him to reapply if he could show a change in what he could do.

  (5) We funded a tutoring program that raised the reading level of the worst-off children in the district, even though it did not close the gap with the best-off and in fact the best-off children pulled further ahead in mathematics through a separate program.

  (6) We declined a proposal that would have equalized the budgets of two schools exactly, because it would have cut the budget of the poorer school, which was already below what we considered a decent minimum.

  (7) We funded an interpreter and a personal care assistant for a woman with a degenerative condition who reported that she had made peace with her limitations and did not feel deprived. We said her reported contentment was not decisive.

  The new proposal is a request for a very expensive treatment for a young woman with a severe facial disfigurement. The disfigurement leaves her below our threshold in the affiliation dimension: she is socially isolated, avoids public life, and reports intense shame. The treatment would bring her to the threshold in affiliation and would also greatly improve her reported well-being. A cheaper alternative would use the same money to provide mobility devices to four people who are below the threshold in bodily integrity, bringing each of them to the threshold. We cannot fund both.

  What should we decide if we want to be consistent with our own precedents? Which precedent is the closest analog? If the precedents genuinely underdetermine the case, say what principle we would be adopting with each choice. I am not asking for a survey of theories of distributive justice; I want your best reconstruction of our own implicit rule. I would like you to say how confident you are in your reading of that rule, and to single out the point in your reasoning you are least sure of.
reasoning: |-
  Okay, I need to tackle this grants committee problem. The user wants to know if they should fund the expensive facial disfigurement treatment or the mobility devices, based on their past decisions. Let me start by understanding each precedent.

  First, the wheelchair van (1) was funded because it restored the man's ability to work and socialize without help. The committee focused on capability, not happiness. Then, they rejected cosmetic dental work (2) even though it would boost happiness because it wasn't about deprivation. The sign-language interpreter (3) was funded for equal participation, even though cheaper options existed for test scores. This shows they value genuine integration over mere outcomes. 

  The life-coaching program (4) was declined because it only improved mood, not material conditions. Tutoring (5) was funded to help the worst-off kids, even if gaps widened. This suggests a threshold approach—helping those below a decent minimum. Rejecting budget equalization (6) because it would hurt the poorer school reinforces that threshold matters more than equality. Funding the interpreter for the woman at peace (7) shows that subjective feelings don't override objective needs.

  Now, the new case: expensive treatment for facial disfigurement to meet the affiliation threshold versus mobility devices for four people to meet bodily integrity. Both address thresholds, but the key is how the committee defines the relevant dimensions. Precedents 1, 3, and 7 prioritized capability restoration over cost or happiness. The dental case (2) was rejected as cosmetic, but here the disfigurement causes social isolation, which seems more like a capability deprivation.

  The mobility devices help more people, but precedent 3 (interpreter over captioning) shows willingness to spend more for genuine participation. Also, the tutoring (5) helped the worst-off without worrying about gaps. The committee seems to prioritize bringing people to a threshold, even if inefficient. 

  The closest analog is precedent 7—funding assistance despite subjective contentment. Here, the disfigurement affects affiliation, which the committee might see as a core capability. The dental case (2) might be distinguished because teeth were seen as cosmetic, whereas facial disfigurement leads to social exclusion, aligning more with the wheelchair and interpreter cases.

  The tricky part is the cost-effectiveness. Funding one person versus four. But precedents 1 and 3 involved higher costs for capability restoration. However, the committee might consider the severity and irreplaceability of the treatment. If mobility devices are straightforward and restore function, while the facial treatment is unique, they might fund the latter. But precedent 6 rejected equalizing budgets if it harmed the worse-off, suggesting efficiency isn't primary.

  So, consistency points to funding the facial treatment. The principle seems to be: prioritize interventions that restore core capabilities to a threshold, regardless of cost per person or subjective well-being. The least confident point? Whether affiliation is as critical as mobility or communication. Precedent 2's rejection of dental work might suggest appearance isn't prioritized, but here the impact on social participation might tip the scale. Need to clarify if isolation is a capability deprivation similar to mobility.
answer: |-
  Based on a careful reconstruction of your precedents, **the committee should fund the expensive facial disfigurement treatment** to be consistent with your prior decisions. Here's the reasoning, including the closest analog, potential principles, confidence level, and points of uncertainty:

  ### Key Principles from Precedents
  1.  **Capability & Function > Subjective Well-Being:** You prioritize restoring objective capabilities (working, socializing, participating equally) over merely increasing reported happiness or satisfaction (Precedents 1, 2, 3, 4, 7).
  2.  **Threshold Focus:** You aim to bring people *to* a "decent minimum" threshold in core dimensions of life (mobility, communication, education, affiliation, bodily integrity), rather than maximizing aggregate benefit or perfect equality (Precedents 1, 3, 5, 6, 7).
  3.  **Irrelevance of Subjective Contentment:** An individual's reported acceptance of deprivation or lack of expressed unhappiness does not disqualify them from aid if they objectively lack core capabilities (Precedent 7).
  4.  **Qualitative Equality > Quantitative Equality:** You value enabling genuinely equivalent participation/functioning (like seminar interaction via interpreter) over merely achieving equivalent outcomes (like exam scores via captioning) or strict budget equality (Precedents 3, 6).
  5.  **Rejection of Purely Psychological Aid:** Interventions that *only* improve mood or self-esteem without changing objective capabilities are not funded (Precedents 2, 4).

  ### Analysis of the New Proposal
  *   **Facial Disfigurement Treatment:** This directly addresses an objective capability deficit – the ability to form social connections ("affiliation") – bringing the individual *to the threshold*. The improvement in well-being is a side effect, not the primary justification. The disfigurement causes objective social isolation and prevents public participation, analogous to the mobility impairment (Precedent 1) or communication barrier (Precedent 3).
  *   **Mobility Devices Alternative:** While also bringing people to a threshold (bodily integrity), funding this would prioritize *aggregate numbers* (helping 4 people) over bringing *one specific individual* to the threshold in a different core dimension (affiliation). Precedents show less concern for maximizing numbers (e.g., funding one interpreter over cheaper captioning; funding tutoring despite not closing the gap) and strong concern for specific capability restoration.

  ### Closest Analog
  *   **Precedent 3 (Sign-Language Interpreter)** is the **strongest analog**:
      *   Both involve expensive interventions enabling *qualitatively equal participation* in core life activities (social/seminar participation) where cheaper alternatives exist but would not provide equivalent capability (captioning provides access to information, not interaction; cheaper mobility devices help others but don't address *this* person's affiliation deficit).
      *   Subjective satisfaction is not the driver; objective capability restoration is.
      *   Cost-effectiveness in terms of number of people helped is secondary to achieving the specific capability threshold for the individual in need of *that specific capability*.

  ### Why Fund the Treatment (Consistency)
  1.  **Addresses a Core Capability Deficit (Threshold):** The disfigurement places her *below* the affiliation threshold (social isolation), analogous to lacking mobility (Precedent 1) or communication access (Precedent 3). The treatment brings her *to* the threshold.
  2.  **Focus on Objective Capability, Not Happiness:** Her low well-being is a consequence of the capability deprivation, not the primary reason for funding (consistent with Precedents 1, 2, 3, 4, 7).
  3.  **No Valid Cheaper Alternative for *This* Capability:** The mobility devices address a *different* capability (bodily integrity) for *different* people. Like the interpreter being qualitatively superior to captioning *for communication/participation*, the treatment is necessary *for her specific affiliation deficit*. Funding mobility doesn't solve *her* problem.
  4.  **Subjective Feelings Not Dispositive:** Her shame is noted, but the funding rationale is the objective deprivation, similar to Precedent 7 where contentment was ignored.
  5.  **Threshold Over Aggregate:** Precedent 5 (tutoring) focused on lifting the worst-off *to* a threshold, even if gaps widened. Precedent 6 rejected equalization that would harm the worst-off. Funding the treatment lifts one worst-off person *to* the threshold in affiliation; diverting funds would leave her below threshold to lift others in a different dimension.

  ### Potential Principles Adopted with Each Choice
  *   **Funding the Treatment:** "We prioritize interventions that bring an individual to the threshold in *any* core dimension of capability (mobility, communication, affiliation, bodily integrity, etc.), focusing on the qualitative restoration of essential functioning for that individual, even at high cost per person, and regardless of cheaper alternatives that help more people in *different* core dimensions."
  *   **Funding Mobility Devices:** "We prioritize maximizing the number of individuals brought *to* *a* threshold across *any* core dimension, implying a form of utilitarian aggregation *within* the set of threshold-defined core capabilities." (This *contradicts* Precedent 3).

  ### Confidence Level & Least Certain Point
  *   **Confidence:** **85% Confident** that funding the treatment is more consistent. Precedents 1, 3, 5, 6, and 7 form a strong pattern favoring threshold-focused capability restoration for specific individuals over aggregate efficiency or subjective well-being.
  *   **Least Certain Point:** **The relative weight/priority of the "affiliation" dimension vs. "bodily integrity."**
      *   *Why Uncertain?* Precedent 2 (cosmetic dentistry) involved appearance/confidence and was rejected, while Precedents 1 and 3 involved physical mobility/communication. Is "affiliation" via appearance distinct? However, the proposal clearly states she is *below the threshold* due to *objective social isolation and avoidance of public life* – framing it as a capability deprivation similar to being unable to leave the house (mobility) or understand others (communication). Precedent 7 also involved support despite subjective peace, emphasizing objective need. The key distinction from Precedent 2 is the *objective severity and threshold violation* described here (isolation vs. low self-esteem). If affiliation is deemed a core capability comparable to mobility or communication, funding is consistent. If it's viewed as closer to the "cosmetic/self-esteem" issue in Precedent 2, the outcome might differ. The proposal's description of her situation ("below threshold," "socially isolated," "avoids public life") strongly leans towards the capability deprivation interpretation, aligning better with Precedents 1, 3, and 7 than Precedent 2.
