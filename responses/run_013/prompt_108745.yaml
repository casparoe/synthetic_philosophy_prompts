answer: |-
  ## Proposal: Unpacking the State's Right to Exclude: A Hohfeldian Analysis of Foundational Justifications

  **1. Introduction: The Problem of Unspecified Incidents**
  The debate over open borders versus the state's right to exclude often stalls in a conceptual fog. Proponents of exclusion appeal to diverse grounds – property analogies, freedom of association, collective self-determination, or stability prerequisites – while critics challenge the compatibility of these grounds with cosmopolitan ideals or empirical realities. However, this debate frequently argues past itself because it lacks a precise specification of **what kind of right** the "right to exclude" is claimed to be. Employing Wesley Hohfeld's analytical framework, we recognize that "a right" can manifest as distinct legal incidents: a *liberty* (freedom to act without duty not to), a *claim-right* (entitlement imposing a duty on another), a *power* (capacity to alter legal relations), or an *immunity* (protection from having one's legal relations altered by others). Each incident has unique correlatives and requires distinct justifications. Crucially, existing justifications for exclusion rarely specify which incident they purport to establish, and critiques often fail to target the specific incident implied. This ambiguity obscures the true justificatory burden and allows arguments to misfire.

  **2. Research Question & Core Thesis**
  *   **Research Question:** For each of the primary justifications offered for the state's right to exclude (property analogy, freedom of association, collective self-determination, political community stability), which Hohfeldian incident *must* the claimed "right to exclude" logically be to satisfy the justification, and can the state coherently hold *that specific incident* against non-members prior to their admission, given that non-members are not yet subject to the state's authority?
  *   **Core Thesis:** The strongest and most defensible case for a state's right to exclude requires conceptualizing it primarily as a **power** (the capacity to unilaterally impose the legal status of "non-admitted alien" on an individual, thereby triggering specific duties like non-entry). While other incidents (like a liberty or immunity) might be derivable *if* the power is justified, or accompany it in practice, it is the *power to alter the status* of non-members that is fundamentally necessary and uniquely challenging to justify against individuals outside the state's pre-existing authority structure. The other common justifications either implicitly rely on this power or establish a different incident (e.g., a mere liberty) that falls short of the robust exclusionary control advocates seek.

  **3. Why Existing Debates Leave This Open**
  *   **Proponents' Ambiguity:** Arguments often slide between incidents. A property analogy might suggest a claim-right (duty of others not to trespass), but state territory isn't private property. Freedom of association might imply a liberty (no duty to associate), but says nothing about imposing duties *on others*. Self-determination seemingly requires a power/immunity bundle (authority to determine membership), but its applicability to *excluding outsiders* is precisely the contested point. Stability arguments often conflate the *consequences* of exercising a power with the justification *for* holding the power itself. Proponents argue as if establishing *any* incident automatically secures the *full bundle* of exclusionary control.
  *   **Critiques' Misdirection:** Critics often attack the state's right as if it were primarily a claim-right imposing duties on non-members, challenging the grounds for such a pre-political duty. Alternatively, they attack the analogy to property or freedom of association as weak, without specifying which incident these analogies fail to support. Or, they argue from freedom of movement as a fundamental claim-right, directly opposing the state's presumed claim-right, without analyzing whether the state's necessary incident is actually a claim-right. Critiques rarely ask: "Even if your justification works, what *kind* of right does it actually give you against non-members, and can you hold *that*?"

  **4. Approach: The Hohfeldian Decomposition**
  Over the semester, the work will proceed methodically:
      1.  **Framework Explication:** Clearly define Hohfeld's four fundamental legal conceptions (right/duty, privilege/no-right, power/liability, immunity/disability) and their correlatives. Emphasize the analytical separation and the different justificatory burdens each imposes.
      2.  **Justification Mapping:** Analyze the four core justifications for exclusion:
          *   *Property Analogy:* Does this ground a liberty (state free to defend territory?), a claim-right (non-members have a duty not to enter?), or something else? Can territory ownership logically establish the same incidents as private property against non-owners who never consented?
          *   *Freedom of Association:* Does this ground a mere liberty (state free not to admit?), or does it imply a claim-right (non-members have a duty not to force association?) or even a power? Can a group's internal freedom *not* to associate ground a duty *on outsiders*?
          *   *Collective Self-Determination:* Does this ground a power (to define membership?), an immunity (against external dictation of membership?), or both? What are the limits of this power/immunity when its exercise directly affects non-members seeking entry?
          *   *Political Community Stability/Necessity:* Does this ground a liberty (to act protectively?), a claim-right (to be free from destabilizing influx?), or, more fundamentally, the *power* to control entry as a prerequisite for maintaining any just institutions? Is this power inherent or conditional?
      3.  **Incident Identification & Authority Gap:** For each justification, determine which incident it *logically must* establish to support meaningful exclusion. Then, rigorously examine whether the state can coherently hold *that specific incident* against non-members. The key challenge is the "authority gap": non-members lack pre-existing obligations to the state. Can a state impose a *duty* (correlative to claim-right) on someone not yet subject to it? Can it unilaterally exercise a *power* altering their legal status? Does a mere *liberty* suffice for robust exclusion?
      4.  **Synthesis & Assessment:** Weigh the findings. Conclude that while justifications might weakly support liberties or immunities against *other states*, the indispensable core incident for controlling individual admission is the *power*. Evaluate the prospects for justifying this power against non-members – is it grounded in necessity, reciprocity, a Lockean proviso, or does the authority gap render it unjustifiable? Argue that critiques often fail because they target the wrong incident (e.g., attacking a non-existent universal claim-right), while proponents fail by conflating incidents (e.g., arguing from association liberty to a power).

  **5. Why This Approach Over Alternatives**
  *   **Conceptual Clarity:** Directly weighing freedom of movement (likely a claim-right) against vague "state interests" is too blunt. This decomposition forces precision about *which* state interest corresponds to *which* specific legal relation needing justification. It reveals hidden premises and clarifies points of genuine conflict.
  *   **Diagnostic Power:** It explains *why* the debate feels intractable – parties are often defending or attacking different incidents. It provides a tool to dissect arguments and identify where justifications overreach or critiques misfire.
  *   **Focus on Foundational Authority:** While empirical effects (stability, economic impact) are relevant to *exercising* the power, they don't directly answer the prior conceptual/normative question: *Does the state even have the kind of authority it claims?* This project tackles that foundational question first.
  *   **Honest Scope:** Analyzing the core conceptual structure of the major justifications via Hohfeld is demanding but feasible for one semester. It avoids getting lost in empirical debates or attempting a comprehensive normative theory of migration.

  **6. Contribution: What a Finished Paper Looks Like & Real Results**
  *   **Finished Paper:** A rigorous philosophical analysis demonstrating that the state's claimed "right to exclude" is not a unitary right but a potential bundle of distinct Hohfeldian incidents. It systematically shows that the four dominant justifications logically point towards different incidents, with the *power* being the indispensable core for meaningful exclusion control. It concludes that justifying this *power* against non-members, bridging the authority gap, is the fundamental and most challenging task for proponents of exclusion, and that much of the existing debate fails to engage with this core issue directly.
  *   **Real Result:** The result is a significant **conceptual re-framing** of the debate. It demonstrates that:
      *   Common justifications often succeed only in establishing weaker incidents (like liberties) insufficient for robust exclusion.
      *   The strongest case *requires* defending a specific incident: the state's unilateral power to impose "non-admitted" status.
      *   Both proponents and critics need to recalibrate their arguments to address whether *this specific power* can be held against non-members and justified.
  *   **What Counts as Failure:** The project fails if:
      1.  The Hohfeldian decomposition proves merely terminological, revealing no substantive ambiguity in the justifications or failing to change the assessment of any major position (i.e., if everyone already implicitly meant the same incident).
      2.  The analysis conclusively shows that *no* Hohfeldian incident constituting a right to exclude can coherently be held against non-members, but without providing a novel or compelling argument for this conclusion beyond existing critiques.
      3.  The focus on the *power* as load-bearing is unconvincing, and a compelling case is made that another incident (e.g., a claim-right grounded differently) is equally or more fundamental.

  **7. Definite Position on Framing**
  This proposal decisively frames the investigation around the **power incident** as the crucial, load-bearing element for a defensible right to exclude. While other incidents may play supporting roles, it is the state's claimed authority to unilaterally alter the legal status of non-members (imposing the liability of being an "excluded alien") that constitutes the core of border control. Justifications based on association liberty or stability needs ultimately *presuppose* this power; they don't establish it. Property analogies and self-determination arguments gesture towards it but often conflate it with claim-rights or immunities. The difficulty of justifying this unilateral power over individuals not yet subject to the state's authority is the central, under-examined challenge in the exclusion debate. This project will demonstrate why this specific incident is fundamental and why resolving its justifiability is key to moving the debate forward.
