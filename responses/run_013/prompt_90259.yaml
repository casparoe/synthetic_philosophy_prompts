  ### Decision Tree: Non-Cognitivist Solutions to the Frege-Geach Problem  
  **Root Commitment**: When someone sincerely utters "lying is wrong," they are not describing a fact but expressing a practical attitude. The tree sorts positions by how they handle the *embedding profile* of moral predicates (i.e., how moral sentences function in syntactic embeddings like negation, conditionals, disjunctions, etc.). Test cases:  
  - (i) "If lying is wrong, then getting your sister to lie is wrong" (uttered by someone indifferent to lying).  
  - (ii) *Moralish community*: Uses moral terms only in embeddings (conditionals/negations), never in flat assertions.  
  - (iii) *Machine*: Prints "murder is wrong" without forming any attitude.  
  - (iv) "Sally believes that lying is wrong" (Sally is a committed liar).  

  **Instructions**: Start at **Q1**. Answer each diagnostic question based on theoretical commitments (not labels). Leaves are labeled positions with their "most awkward commitment." Empty branches indicate untenable or unexplored views.  

  ---

  #### **Q1: In embedded contexts (e.g., conditionals, negations), does the moral sentence express the *same practical attitude* as in unembedded assertions?**  
  - **No** (attitude not expressed in embeddings) → **Q2**  
  - **Yes** (attitude expressed identically) → **Q3**  

  #### **Q2 (from Q1-No): What is the function of the embedded moral clause?**  
  - It expresses a *truth-conditional proposition* (content that can be true/false) → **Q4**  
  - It is *merely mentioned* (e.g., as a linguistic object) or has a non-propositional role → **Leaf: Fictionalism**  
    - **Awkward commitment**: Moral discourse is a useful pretense, but this struggles to explain the seriousness of moral disagreement (e.g., in test case (iv), Sally's belief is an empty "script").  

  #### **Q3 (from Q1-Yes): How do logical operators (e.g., "not," "if") function in embeddings like test case (i)?**  
  - They are *force-operators* (e.g., "if" modifies the *expression* of attitudes) → **Leaf: Expressivist accounts of logic**  
    - **Awkward commitment**: Difficulty extending to complex embeddings (e.g., quantifiers or test case (iv)) without ad-hoc adjustments.  
  - They are *truth-functional* (e.g., "if" operates on truth values) → *Empty branch*  
    - **Diagnosis**: Incoherent. If attitudes are always expressed, truth-functionality requires attitudes to be "on/off" in embeddings—but test case (i) shows speakers lack the attitude.  

  #### **Q4 (from Q2-truth-conditional): How are the truth conditions of moral sentences grounded?**  
  - In *robust descriptive facts* (e.g., mind-independent properties) → **Q5**  
  - In *minimal/deflationary facts* (e.g., truth is not "substantive") → **Q6**  

  #### **Q5 (from Q4-robust): Can moral sentences be true?**  
  - **No** (all are false) → **Leaf: Error theory**  
    - **Awkward commitment**: Moral discourse is systematically mistaken (e.g., test case (iii) shows the machine prints a falsehood, but we treat it as meaningful).  
  - **Yes** (some are true) → **Q7**  

  #### **Q6 (from Q4-minimal): Is the minimal truth of moral sentences *earned from expressive practices* (e.g., attitudes)?**  
  - **Yes** → **Leaf: Quasi-realism**  
    - **Awkward commitment**: Must "earn" the right to moral truths/facts without descriptive content (e.g., test case (ii) risks making Moralish speakers non-moral).  
  - **No** (truth is *only* a device of endorsement) → **Leaf: Minimalism**  
    - **Awkward commitment**: Collapses into cognitivism; struggles to preserve non-cognitivist "oomph" (e.g., in test case (iv), Sally's belief is just endorsement).  

  #### **Q7 (from Q5-Yes): Is the core function of moral utterances *still expressive* in unembedded contexts?**  
  - **Yes** → **Leaf: Hybrid expressivism**  
    - **Awkward commitment**: Complex interaction of descriptive/expressive content in embeddings (e.g., test case (iv) forces Sally to "disagree" with herself).  
  - **No** → **Leaf: Plain cognitivism**  
    - **Awkward commitment**: Cannot explain the practical "oomph" of moral judgments (e.g., why "lying is wrong" motivates action).  

  #### **Q8 (from Q1-No, alternative path): Can logic be explained *without truth* (e.g., via inference rules)?**  
  - **Yes** → **Leaf: Inferentialism**  
    - **Awkward commitment**: Requires non-standard logic (e.g., classical rules may not preserve "commitment" in test case (i)).  
  - **No** → **Leaf: Pseudo-problem view**  
    - **Awkward commitment**: Rejects Frege-Geach as misguided, but must deny compositionality (e.g., test case (ii) is inexplicable).  

  ---

  ### **Empty Branches and Unoccupied Combinations**  
  - **Q3-Yes truth-functional**: Empty (incoherent; see diagnosis above).  
  - **Q1-No + attitude expressed**: *Empty*. **Diagnosis**: Unattractive. If embedded clauses don’t express attitudes, but unembedded do, test case (i) forces insincerity.  
  - **Q4-minimal + robust grounding**: *Empty*. **Diagnosis**: Unexplored. Minimal truth deflates "robustness," making this unstable.  

  ### **Leaf Summary**  
  | **Position** | **Most Awkward Commitment** |  
  |--------------|----------------------------|  
  | **Quasi-realism** | Earning moral truths without descriptive content risks losing expressivism. |  
  | **Minimalism** | Collapses into cognitivism; moral attitudes become redundant. |  
  | **Hybrid expressivism** | Clunky interaction of descriptive/expressive content in embeddings. |  
  | **Inferentialism** | Non-standard logic may not align with classical validity. |  
  | **Expressivist accounts of logic** | Poor scalability to complex embeddings (e.g., belief reports). |  
  | **Fictionalism** | Pretense undermines moral seriousness (e.g., disagreement is "playacting"). |  
  | **Error theory** | Moral discourse is systematically false, yet indispensable. |  
  | **Plain cognitivism** | No explanation for moral motivation/practicality. |  
  | **Pseudo-problem view** | Denies compositionality, making language-learning mysterious. |  

  ### **Indistinguishable Leaves**  
  - **Quasi-realism vs. Minimalism**: The tree separates them at **Q6** (truth *earned from expressivism* vs. *mere endorsement*), but in practice, quasi-realism often incorporates minimalism about truth. They blur on whether "attitudes ground truth" (quasi-realism) or "truth is inert" (minimalism).  
  - **Inferentialism vs. Expressivist logic**: Inferentialism focuses on rules, expressivist logic on force-operators; the tree separates them via **Q1** (attitudes in embeddings) but both struggle with test case (iv).  

  ### **Notes for TAs**  
  - **Test cases anchor debates**: E.g., Moralish (ii) challenges whether minimal truth requires assertion; the machine (iii) tests if attitudes are essential to meaning.  
  - **Key distinctions**: Truth-aptness (Q1), operator function (Q3), and truth minimalism (Q6) drive the taxonomy.  
  - **Empty branches**: Highlight where theories "give up" non-cognitivism or face fatal flaws.  
  - Students often conflate quasi-realism and hybrid expressivism—stress that the former *earns* truth, the latter *adds* descriptive content.
