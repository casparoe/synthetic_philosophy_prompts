answer: |-
  Here's a spec-checklist for futarchy as a serious governance proposal, structured around your requirements. Constraints are marked **(C)**, aesthetic/ideological preferences **(A)**, and irreconcilable conflicts are flagged. The knockout requirement is identified at the end.

  ---

  ### **I. Failure Cases & Robustness (Must Handle These Scenarios)**
  1.  **The Whale Attack (Market Manipulation):**  
      *   *Requirement:* Prevent a wealthy actor from buying market positions *and* directly influencing policy implementation to profit, regardless of societal outcome.  
      *   *Source:* Basic market vulnerability + political corruption.  
      *   *Constraint:* **(C)** - Fundamental to market integrity. Mitigation (e.g., position limits, policy firewall) is mandatory, not optional.  
  2.  **Goodhart's Law (Metric Gaming):**  
      *   *Requirement:* Ensure the chosen metric (e.g., GDP, wellbeing index) cannot be easily gamed or improved in ways that contradict the *intent* of the metric, once it becomes the target.  
      *   *Source:* Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure").  
      *   *Constraint:* **(C)** - Inherent tension between quantification and complex societal goals. *The core tension with requirement II.3.*  
  3.  **Unresolved Conditionals (Counterfactual Problem):**  
      *   *Requirement:* Resolve conditional prediction markets ("If Policy X passes, will Metric Y improve?") fairly and credibly *even if the policy doesn't pass*, or handle non-passage in a way that doesn't destroy market incentives.  
      *   *Source:* Practical market operation (need for settlement).  
      *   *Constraint:* **(C)** - Undermines market liquidity and truth-telling incentives if unresolved. Requires a robust, incorruptible oracle mechanism.  
  4.  **Long-Term Horizons (Time Discounting):**  
      *   *Requirement:* Ensure markets accurately price policies with costs/benefits extending beyond the trading horizon of current participants (decades+).  
      *   *Source:* Discounted future utility in markets vs. societal intergenerational responsibility.  
      *   *Constraint:* **(C)** - Structural limit of markets relying on current capital/traders. Perpetual markets or intergenerational agents are complex solutions.  
  5.  **Scale Variance (Company/City vs. Nation/Globe):**  
      *   *Requirement:* Function effectively and legitimately across scales (small org -> large nation). Address differences in trust, information asymmetry, homogeneity, and enforcement capability.  
      *   *Source:* Scalability of governance mechanisms.  
      *   *Constraint:* **(C)** - Mechanisms viable for a startup (shared goals, trust) likely fail for a diverse nation (conflicting values, low trust).  

  ### **II. Formal Constraints & Results (Must Cohere With or Overcome These)**
  6.  **No-Trade Theorem (Common Knowledge):**  
      *   *Requirement:* Provide sufficient persistent *genuine* disagreement or private information among traders to generate meaningful liquidity and price discovery.  
      *   *Source:* Milgrom & Stokey (No-Trade Theorem: Rational agents with common priors and common knowledge won't trade).  
      *   *Constraint:* **(C)** - Markets for complex policies *require* diverse beliefs/info. Pure common knowledge kills them.  
  7.  **Preference Aggregation (Arrow's Impossibility):**  
      *   *Requirement:* Translate heterogeneous voter *values/preferences* (expressed in the "vote on the metric") into a *single, non-dictatorial, consistent* metric for the market to target.  
      *   *Source:* Arrow's Impossibility Theorem (Voting systems struggle to aggregate preferences perfectly).  
      *   *Constraint:**(C)** - Choosing the metric *is* a preference aggregation problem futarchy doesn't magically solve.  
  8.  **Capital ≠ Votes (Legitimacy Gap):**  
      *   *Requirement:* Reconcile policy selection via capital-weighted bets with normative expectations of political equality ("one person, one vote").  
      *   *Source:* Democratic theory vs. market mechanics.  
      *   *Constraint/Aesthetic:* **(C/A)** - Primarily a **Legitimacy Constraint (C)** in democratic contexts. Futarchists **(A)** often dismiss this; critics **(A)** consider it fatal. *Irrreconcilable with democratic equality.*  

  ### **III. Critical Distinctions (Must Maintain These Separations)**
  9.  **Prediction vs. Decision (Epistemic vs. Authority):**  
      *   *Requirement:* Clearly delineate the *epistemic* role (predicting best metric outcome) from the *authoritative* role (enacting the predicted-best policy). Maintain the separation.  
      *   *Source:* Philosophy of decision-making under uncertainty.  
      *   *Constraint:* **(C)** - Blurring leads to market manipulation/self-fulfillment prophecies (see III.14).  
  10. **Values vs. Beliefs (Hume's Guillotine):**  
      *   *Requirement:* Acknowledge markets only address *beliefs* (what policy *will* achieve metric Y). The choice of metric Y embodies *values* and must be set *externally* (e.g., by vote).  
      *   *Source:* Hume (You can't derive an "ought" from an "is").  
      *   *Constraint:* **(C)** - Foundational limitation. Markets don't set values.  
  11. **Metric vs. Welfare (The Proxy Gap):**  
      *   *Requirement:* Recognize that *any* metric is a proxy for complex societal welfare. Ensure the mechanism is robust to the inevitable gap between the proxy and true welfare.  
      *   *Source:* Philosophy of measurement, welfare economics.  
      *   *Constraint:* **(C)** - Inherent limitation. *Core tension with II.2 (Goodhart).*  
  12. **Accuracy vs. Legitimacy (Right vs. Authority):**  
      *   *Requirement:* Establish why accurate predictions *confer the right to govern*, distinct from just being good advice. Address the source of legitimacy.  
      *   *Source:* Political philosophy (legitimacy of authority).  
      *   *Constraint:* **(C)** - Purely epistemic mechanisms lack inherent normative authority.  

  ### **IV. Mechanism Design Traps (Must Solve These)**
  13. **The Oracle Problem (Resolution Authority):**  
      *   *Requirement:* Design an incorruptible, competent, timely mechanism to *resolve* prediction markets (determine the outcome/metric value).  
      *   *Source:* Blockchain/crypto oracles, trusted third parties. Vulnerability is intrinsic.  
      *   *Constraint:* **(C)** - A single point of failure/corruption. "Who watches the watchers?"  
  14. **Agenda Control (Which Policies?):**  
      *   *Requirement:* Define a legitimate, non-manipulable process for determining *which policies* are proposed to the prediction markets.  
      *   *Source:* Social choice theory (Riker's "Heresthetics").  
      *   *Constraint:* **(C)** - Dictates possible outcomes. Easily subverted.  
  15. **Conditional Market Sabotage/Self-Fulfillment:**  
      *   *Requirement:* Prevent actors from profiting by sabotaging a policy they bet against *in the conditional market*, or by ensuring a policy they bet *for* passes *specifically because* their bet signals it's good.  
      *   *Source:* Market feedback loops, strategic behavior.  
      *   *Constraint:* **(C)** - Undermines the conditional market's claim to predict *counterfactuals*. Requires strong separation (III.9) and robust mechanisms.  

  ---

  ### **Key Conflicts & The Knockout Requirement**

  *   **Irreconcilable Conflict 1: II.2 (Goodhart) vs. II.3 (Metric Captures Welfare)**  
      *   **Tension:** A perfectly defined, objectively resolvable metric (II.3) is inherently gameable once targeted (II.2). A metric capturing true, complex welfare (II.3) is inherently ambiguous and hard to define/resolve objectively. *You cannot maximize both definability/resolvability and true welfare capture.* This is the core measurement paradox of futarchy.
  *   **Irreconcilable Conflict 2: II.8 (Capital ≠ Votes) vs. Legitimacy**  
      *   **Tension:** Capital-weighted decision-making fundamentally conflicts with the principle of political equality central to democratic legitimacy. Futarchy cannot satisfy both efficient capital-based prediction *and* democratic legitimacy norms without radical societal value shifts.
  *   **The Single Knockout Requirement:**  
      **II.8: Capital ≠ Votes (Legitimacy Gap) & II.12: Accuracy vs. Legitimacy.**  
      *   **Why:** Even if futarchy *could* solve every technical hurdle (whales, metrics, oracles, conditionals, time horizons), it fails at the most fundamental level for governance in a society valuing political equality: **it lacks a compelling source of normative legitimacy.** Why should policy be determined by the weighted opinions of those with capital to bet, rather than citizens or their representatives? Accuracy ("being right") does not inherently confer *the right to rule*. This requirement exposes futarchy's deepest challenge: bridging the gap between *knowledge* and *authority* in a way society accepts as legitimate. This is primarily a political/philosophical constraint, not purely a technical one, making it exceptionally hard to overcome.

  This checklist defines the minefield any serious futarchy proposal must navigate. The unresolved tensions, especially around legitimacy and measurement, highlight why it remains a provocative thought experiment rather than a practical blueprint.
