answer: |-
  You raise a significant objection, worthy of close examination. Let me clarify: when I say right is coextensive with power, I mean that the foundation of political authority *is* the collective power of the multitude itself. This power exists whether concentrated in one, few, or many. In a monarchy, the sovereign’s power is *alienated* from the multitude; it confronts them as an external force. Command, indeed, cannot make men free inwardly, but democracy, by locating sovereignty in the assembled multitude, minimizes this alienation. The sovereign power *is* their own collective power directed by common agreement, however passionate its origins. While the multitude is primarily guided by passion, a democracy’s laws and institutions, forged from the need for mutual security and advantage, channel and moderate these passions towards more rational ends – namely, peace and the *freedom* to pursue individual utility within the bounds of collective safety. A monarchy, by contrast, depends on the singular, potentially capricious, passion of one, whose interest may diverge sharply from the multitude's, requiring greater suppression to maintain unity. Democracy is thus the most natural state because sovereignty resides where the power fundamentally lies – in the people collectively – and the most free because it requires the least suppression of individual judgment for the sake of concord. It is no mere flourish; it follows from the nature of power and human association. Does this resolve your difficulty, or do you press the point?

