  ### Analysis of Dana's Rule
  Dana's rulings suggest a distinction between objects with intrinsic, non-arbitrary unity and those that are mere collections, conventions, or temporary configurations. Two distinct rules fit all given examples:

  1. **The Strong Bonding Rule**:  
     An object exists if its parts are held together by strong, intrinsic physical bonds (e.g., covalent, ionic, hydrogen, or metallic bonds) that create a cohesive, stable structure. This rule emphasizes static, persistent connectivity at the molecular or atomic level.  
     - **Examples that fit**:  
       - Human, dog, oak tree, gut bacterium (cellular bonds via membranes/tissues).  
       - Water molecule (covalent/hydrogen bonds), salt crystal (ionic bonds), diamond (covalent bonds), rock (mineral bonds), snowflake (hydrogen bonds in ice).  
     - **Exclusions**:  
       - Pile of sand, heap of gravel (grains held by gravity/friction, not strong bonds).  
       - Bag of groceries, chess set (no bonds between items).  
       - Cloud, river (no fixed bonds; held by weak forces/gravity).  
       - Queue, corporation, bee colony, species, traffic jam (social/statistical constructs with no physical bonds).

  2. **The Self-Maintaining System (SMS) Rule**:  
     An object exists if it is either:  
     - A **static structure** held together by strong bonds (as above), or  
     - A **self-maintaining dissipative structure** that actively sustains its form through continuous energy/matter exchange with its environment, maintaining far-from-equilibrium stability.  
     - **Examples that fit**:  
       - Static: Water molecule, salt crystal, diamond, rock, snowflake.  
       - Self-maintaining: Human, dog, oak tree, gut bacterium (living organisms actively maintain via metabolism).  
     - **Exclusions**:  
       - Pile of sand, heap of gravel, bag of groceries, chess set (no self-maintenance or strong bonds).  
       - Cloud, river (passively sustained, not actively self-maintaining).  
       - Queue, corporation, traffic jam (no physical basis).  
       - Bee colony (bees are independent agents; the colony isn't a unified self-maintaining entity).  
       - Species (statistical/evolutionary, not a concrete self-maintaining system).

  Both rules fit all given rulings but diverge on dynamic non-living systems like flames or hurricanes, which are self-maintaining but lack strong bonds.

