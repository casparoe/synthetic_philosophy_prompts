     - When you got stuck, you jumped out to the meta-level to reason about the system and found an invariant.
     - Then for System B, you tried to jump out again and found a different invariant. This shows that each system requires its own meta-reasoning.
     - Then we saw that we can take the result of a jump (the proven fact) and add it back into the system as a new rule. But then the new system might have new questions that require a new jump.

