  2. Groups get frustrated in System B and can't find the invariant.
     - Solution: After 10 minutes of struggle, give a hint: "Consider the difference between the number of a's and the number of b's. Then consider modulo 3." Then let them work with that.

  3. In the last beat (adding the proven fact), students might not see the point because it doesn't change the set of strings.
     - Emphasize: it changes how we reason. We now have a new tool (the invariant) that we can use to answer new questions without doing the symbol pushing.

  4. Time management: 
     - Keep strict time limits. Use a timer. If a phase is taking too long, cut it short and move on. The debrief is crucial.

  This plan should give them the experience of jumping out and the challenges involved.
answer: |-
  ### Runnable Plan: "Jumping Out of the System" Session (75 minutes)  
  **Goal:** Students experience meta-reasoning by failing to solve unreachable problems, discovering invariants, and grappling with the bespoke nature of "jumping out."  

  ---

  #### **Materials**  
  - **System A Rule Cards** (3 sets, 1 per group of 6 students):  
    > **START:** `a`  
    > **RULES:**  
    > 1. Add `b` to the right end of any string.  
    > 2. Double the entire string (write it twice in a row).  
    > 3. Swap any adjacent `ab` to `ba`.  
    > **TARGET:** `aaa`  

  - **System B Rule Cards** (3 sets):  
    > **START:** `a`  
    > **RULES:**  
    > 1. Wrap: Add `a` to the front and `b` to the back.  
    > 2. Double the entire string.  
    > 3. Reverse-wrap: Add `b` to the front and `a` to the back.  
    > **TARGET:** `ab`  

  - **Nudge Card** (1 per group, for Phase 2):  
    > "Look for something that *never changes* when you apply the rules."  

  - **Board:** Write targets (`aaa` for A, `ab` for B).  

  ---

  #### **Timeline & Instructions**  
  **Group Structure:**  
  - 3 groups of 6 students.  
  - **Roles per group:**  
    - **Scribe:** Records strings attempted.  
    - **Rule Enforcer:** Checks rule applications.  
    - **Strategist:** Proposes next moves.  
    - Rotate roles every 10 minutes to avoid disengagement.  

  ---

  ##### **Phase 1: Flailing in System A** (20 min)  
  **Goal:** Let them fail to reach `aaa`; build frustration.  
  - **0–5 min:** Introduce activity.  
    - *Say:* "Here’s System A. Start from `a`. Use these rules to reach `aaa`. Work in groups—compete to solve it first! *Do not* overthink; just push symbols by the rules."  
  - **5–20 min:** Groups work.  
    - **Instructor:** Circulate silently. **Do not hint.** Observe:  
      - *Predictable issue:* Fast groups may brute-force strings like `a → aa → aab → aba → ...` but hit dead ends. If a group "solves" it (e.g., by misapplying Rule 3), gently point out the error.  
      - *If a group finds the invariant early:* Give a **distractor task:** "Now, can you reach `ba`? Prove whether it’s possible." This keeps them busy (since `ba` *is* reachable: `a → ab → ba`).  

  ---

  ##### **Phase 2: Jumping Out with Invariants** (15 min)  
  **Goal:** Shift from symbol-pushing to meta-reasoning; discover the power-of-two invariant.  
  - **20–25 min:** Pause groups. Ask:  
    - *Say:* "Seems impossible? *Prove* it. You can’t just try forever—how might you show `aaa` is unreachable?"  
    - Hand out **nudge cards**. *Say:* "Use this hint. Find a property that *all* reachable strings share."  
  - **25–35 min:** Groups work.  
    - **Instructor:** If stuck, ask: *"What happens to the number of `a`’s when you apply Rule 2? What about Rules 1 and 3?"*  
    - **Goal:** They notice:  
      - Start: 1 `a`.  
      - Rule 1/3: Preserve `a`-count.  
      - Rule 2: Doubles `a`-count → `a`-count is always 1, 2, 4, 8... (power of two).  
      - Target `aaa` has 3 `a`’s → impossible.  
  - **35 min:** Debrief.  
    - *Say:* "You jumped *out* of the system—from pushing symbols to *reasoning about rules*. What did you discover?"  
    - **Map to meta-reasoning:** "Inside the system, you see symbols. Outside, you see *patterns* (like invariants)."  

  ---

  ##### **Phase 3: Bespoke Jumps & Absorbing the Meta** (30 min)  
  **Goal:** Show that invariants are system-specific; adding a meta-rule requires a new jump.  
  - **35–40 min:** Introduce System B.  
    - *Say:* "New system, same goal: reach `ab`. Use your invariant intuition!"  
  - **40–55 min:** Groups work on System B.  
    - **Predictable issue:** Groups reuse the "count `a`’s" invariant, but it fails (start: 1 `a`, target: 1 `a`).  
    - **Instructor:** If groups spiral, hint: *"Track both `a`’s and `b`’s. What about their difference?"*  
      - *Key invariant:* Let δ = (#`a` - #`b`). Start: δ = 1.  
        - Rule 1: New `a` and `b` → δ unchanged.  
        - Rule 2: δ becomes 2δ.  
        - Rule 3: New `a` and `b` → δ unchanged.  
        - Thus δ ≡ 1 (mod 3) always. Target `ab` has δ = 0 → impossible.  
  - **55–60 min:** Add meta-rule to System A.  
    - *Say:* "Suppose we add your discovery—'`aaa` is impossible'—as **Rule 4** to System A. How does reasoning change? What if you now target `aaaaa`?"  
    - Groups discuss. *Guide them:*  
      - With Rule 4, they avoid dead ends, but `aaaaa` is unreachable (5 ≠ power of two).  
      - *Say:* "You used an *old* jump to rule out `aaaaa`—but what if you target `aabba`? You’d need a *new* jump (e.g., count `b`’s)!"  
  - **60–65 min:** Debrief the jump.  
    - *Say:* "Adding Rule 4 absorbs your meta-reasoning into the system. But to see *new* limits, you need a fresh jump. Every escape is temporary!"  

  ---

  #### **Final Debrief** (10 min)  
  **Map moments to "jumping out":**  
  | **Phase** | **Student Action** | **Meta-Lesson** |  
  |-----------|--------------------|-----------------|  
  | 1 (Flailing) | Pushing symbols | Trapped *inside*: rules are mechanical. |  
  | 2 (Invariant) | Proving impossibility | First *jump out*: reasoning about rules. |  
  | 3 (System B) | Struggling with new invariant | Jumps are *bespoke*—no universal trick. |  
  | 3 (New rule) | Enlarging System A | Absorbing the meta; needing *another* jump. |  

  **What the activity CAN’T do:**  
  1. **Incompleteness depth:** It shows one jump, but not that the *meta-system* has limits (à la Gödel).  
     - *Slot in:* "In real logic, we can formalize meta-reasoning—but Gödel proved *that* system also has unprovable truths. Today was a first step."  
  2. **Meaning/syntax divide:** Strings are treated as syntax; meaning isn’t discussed.  
     - *Slot in:* During intro/debrief: "We treated strings as pure symbols—no semantics. But in phil of mind, does thought require *meaning*? We’ll debate that next week."  

  **Predictable Issues & Fixes:**  
  - **Issue:** One group solves too fast.  
    - **Fix:** Distractor tasks (e.g., "Can you reach `ba`?" in System A; "What about `aa`?" in System B).  
  - **Issue:** Groups stuck in System B.  
    - **Fix:** After 10 min, hint: *"Compute (#`a` - #`b`) mod 3 for start/target."*  
  - **Issue:** Phase 3 feels rushed.  
    - **Fix:** Shorten Phase 1 if groups stall early; extend Phase 3 debrief.  

  **Why this works:**  
  - **Failure-driven:** Flailing makes the jump *necessary*.  
  - **Contrast:** System A vs. B shows invariants aren’t portable.  
  - **Meta-absorption:** Adding Rule 4 makes the jump feel "real" but temporary.  

  By the end, students will have *felt* the jump—from rules to meta-reasoning—and seen why it’s both powerful and perishable.
