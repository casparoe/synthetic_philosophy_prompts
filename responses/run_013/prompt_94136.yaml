  ## The Undigested Pudding: Keynes, Leisure, and the Mess We've Made of Plenty

  Good evening. It’s genuinely lovely to be back amongst the dreaming spires, though the brief was rather specific: Keynes, the good life, and the eightieth anniversary of his leaving us. Now, speaking *after* dinner about economics is risky. Talk GDP during pudding, and you risk inducing a different kind of slump. And Keynes on the ‘good life’? Well, that’s less a neatly plated dessert, more a rather rich, slightly unsettling *pâté*.

  We all know Keynes the titan – the man who reshaped economies, battled orthodoxy, probably still haunts certain Treasury corridors. But tonight, I want the *other* Keynes. The one peering beyond the balance sheets, wrestling not just with how we *get* wealth, but with what the devil we’re meant to *do* with it once we’ve got it. The one profoundly worried we might be rather bad at being rich.

  Cast your minds back nearly a century. In 1930, gazing at the grinding machinery of the Depression, Keynes did something extraordinary. He looked past the immediate misery and predicted… abundance. He reckoned that within a hundred years – so, frighteningly soon, folks – we’d have essentially *solved* the basic economic problem. Scarcity? Conquered. The struggle for survival? Done. We’d be working, he suggested, perhaps fifteen hours a week. Fifteen!

  His grandchild, he mused, would inherit a world where the pressing question wasn’t “How shall I afford to live?” but “How shall I *live*?” How shall I fill the vast, yawning expanse of leisure? And here’s where he got truly nervous. Nervous for *us*. Because, Keynes warned, we are a species trained for millennia in the exhausting, relentless *striving*. Trained to value the chase, the accumulation, the sheer *busyness*. What happens, he fretted, when the chase ends? Do we even know *how* to enjoy peace? How to cultivate beauty, nurture relationships, pursue knowledge… for its own sake? Or will we, like addicts cut off, invent new forms of pointless toil, new anxieties to fill the void? Will we, in short, make an absolute hash of paradise?

  Now, this is where it gets deliciously awkward for the man himself. Because the young Keynes, the brilliant Apostle, had subscribed to a rather pure, almost ethereal philosophy. Inspired by Moore, he believed the *only* things intrinsically good were certain states of mind – love, beauty, the contemplation of truth. Everything else – money, action, politics, the whole grubby business of *doing* – was merely instrumental, a means to achieve those sublime mental states. Clean. Elegant. Bloodless.

  But the *older* Keynes, the one who’d wrestled with the Great Depression, who’d seen the terrifying power of irrational forces in markets and men, looked back on his younger self with a kind of wry impatience. In a later memoir, he essentially admitted he’d got it spectacularly wrong. He hadn’t just underestimated the irrational and the visceral, he’d airbrushed out the entire messy, complicated, *human* dimension of life. The passions, the commitments, the sheer bloody-minded *doing* of things – even imperfectly – that gives life texture and meaning. He realised he’d left out the engine room while admiring the view from the deck.

  So here we are, perched somewhere near Keynes’s predicted century mark. Have we solved the economic problem? For some, obscenely yes. For others, devastatingly no – a grotesque failure of distribution Keynes would surely rage against. But for many in this room, and certainly for the societies we’ve built, material abundance *is* our reality. And Keynes’s fifteen-hour week? For the salaried professionals, the strivers, the economists… it feels like a cruel joke. We work harder, longer, glorifying ‘busy’ as a badge of honour. We’ve monetised leisure, turned hobbies into hustles, and invented infinite digital distractions to fill the gaps we’re too exhausted to truly fill meaningfully.

  This is the tension we inherit. Keynes offered us a vision: abundance leading to leisure leading to the cultivation of the truly good life. But he also warned we might be psychologically unequipped for it. And then, crucially, he realised that the ‘good life’ isn’t just passive contemplation on a chaise longue. It’s entangled in the irrational, the practical, the commitments we make, the messy actions we take in the world.

  So, eighty years on, let’s ask the uncomfortable question Keynes forces upon us: Have we, in our relentless worship of striving, of GDP, of the instrumental value of *everything*, made a complete disaster of the ‘good life’ he dared to imagine? Have we solved the economic problem only to find ourselves impoverished in the things that truly matter? Are we, as he feared, a generation brilliantly trained to sail the storm but utterly lost in the calm?

  Food for thought. Perhaps more unsettling than the cheese board. Thank you.
