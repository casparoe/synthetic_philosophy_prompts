answer: |-
  Here’s the essay question, model answer, marking scheme, and common pitfalls tailored to your requirements:

  **Essay Question (90 minutes):**  
  *"Confucian role ethics claims that persons are constituted by their 'load-bearing' roles. Using this framework, analyze how the theory might address:  
  (a) The ethical status of a person stripped of all social roles (e.g., through exile, bereavement, disgrace),  
  (b) The possibility of condemning an unjust social role (e.g., hereditary servitude).  
  In your analysis, critically evaluate whether the ‘load-bearing’ vs. ‘merely decorative’ role distinction can resolve both problems without either:  
  (i) Collapsing into the idea of a role-independent self, or  
  (ii) Rendering the self ethically inert in the face of role loss or role injustice.  
  What does this reveal about the stability of role ethics’ core claim?"*

  ---

  **Model Answer (Strong Student, ~650 words):**  

  Confucian role ethics faces a tension: if the self *is* its load-bearing roles (like son, ruler, friend), then losing all roles (prong a) seems to erase the self, while condemning a role (prong b) seems to require standing outside roles. The "load-bearing/decorative" distinction tries to fix this—but I’ll argue it struggles under pressure.  

  Start with the roleless person. If roles constitute identity, total role-loss threatens annihilation. A load-bearing role ethicist might say: *true* role-loss is impossible because core roles persist. Even an exiled, bereaved official might retain the role of *human* (ren 仁-bearer) or *former son* bound by residual filial piety. These aren’t "decorative" (like "club member"); they’re identity-defining obligations. Virtue here isn’t role-*less* but role-*residual*—mourning ancestors or upholding dignity *as* a ruined scholar. But this feels slippery. If we stretch "load-bearing" to cover any persistent duty, haven’t we made the self *always* role-bound by definitional fiat? And is "human" even a *Confucian* role? It risks smuggling in a universalism that denies roles are concretely relational.  

  Now the bad role (prong b). Condemning hereditary servitude seems to need a standard beyond roles. The distinction offers this: unjust roles are "merely decorative" impositions, not truly constitutive. A servant might *occupy* the role but their *real* self lies in load-bearing roles (e.g., parent, community member) that conflict with servitude. The critique comes from tension *between* constitutive roles. Analects 13.18’s "correcting names" isn’t about rejecting roles but harmonizing them—so decrying servitude arises when it violates deeper role-obligations (like familial care). But here’s the rub: if the servant’s "true" roles condemn servitude, doesn’t that imply a self *prior* to the unjust role? And who decides which roles are "load-bearing"? If it’s social consensus, then caste systems might be validated. If it’s an inner standard, we’ve abandoned role ethics.  

  **Testing the Distinction:**  
  - **Against role-loss (a):** Insisting residual roles are "load-bearing" avoids the abyss but risks circularity. If any enduring duty counts, the distinction loses bite—it can’t explain *why* mourning feels different from a decorative hobby.  
  - **Against bad roles (b):** Framing critique as inter-role conflict dodges individualism but can’t root out systemic injustice. If all roles are socially embedded, condemning servitude might just mean privileging *other* roles (e.g., patriarchy over caste), not ethics itself.  

  **The Instability:** Role ethics needs the load-bearing/decorative split to avoid both collapse into individualism (*you’re nothing without roles!*) and normative impotence (*you can’t judge roles!*). But the split wobbles. To solve (a), it must make constitutive roles *expansive* (so no one is truly roleless). To solve (b), it must make them *contestable* (so some roles aren’t truly constitutive). This strains coherence: how can roles be both inescapably self-defining *and* rejectable?  

  Ultimately, the distinction exposes role ethics’ vulnerability: it works best in stable, humane societies. In extremity, it either silently borrows from universal ethics or admits its limits. A consistent role ethicist might bite the bullet: the roleless *are* ethically dissolved (though still pitied), and critiquing roles is only possible from within alternative role-traditions (e.g., Confucians condemning Legalist roles). But this feels alien to our moral intuitions—suggesting the theory’s core claim is stable only when society is.

  ---

  **Marking Scheme (Out of 20):**  
  **A (18-20):**  
  - Explicitly engages **both prongs (a & b)** through the lens of the **load-bearing/decorative distinction**.  
  - Identifies how the distinction **attempts to resolve each tension** (e.g., residual roles for (a), inter-role conflict for (b)).  
  - **Critically tests** the distinction against both problems, showing how solutions for one **undermine solutions for the other** (e.g., expansive constitutive roles for (a) vs. narrow/contestable ones for (b)).  
  - Concludes with a clear stance on the **stability of the core claim** (e.g., "stable only in ideal conditions," "inherently unstable," "requires revision").  
  - Avoids rote recital of basic tenets; analysis is **problem-driven**.  

  **B (15-17):**  
  - Covers both prongs and uses the distinction, but **doesn’t fully connect them**.  
  - Explains how the distinction *applies* to (a) and (b) but **lacks depth in testing its limits** (e.g., notes circularity in (a) OR social validation in (b), but not both tensions).  
  - **Descriptive rather than critical**: Explains the theory’s response without probing contradictions.  
  - Conclusion states a position but **lacks nuance** (e.g., "The distinction solves it" or "It’s impossible").  

  **C (12-14):**  
  - **Treats (a) and (b) separately** without linking to the distinction’s dual function.  
  - **Defaults to basic tenets** ("roles constitute selves," "contrasts with individualism") without applying them to the cases.  
  - **Ignores the distinction** or misapplies it (e.g., calls all roles "load-bearing" or conflates decorative with optional).  
  - Conclusion missing or superficial.  

  **D/F (≤11):**  
  - **Significant omissions** (e.g., ignores one prong, misunderstands role ethics).  
  - **Rote repetition** of seminar slogans without engagement.  
  - Unstructured or irrelevant content.  

  ---

  **Common Pitfalls (Point to These!):**  
  ➠ **"The Three Paragraphs" Recital:** *"Role ethics says selves are made by roles, unlike the West, as seen in Analects 4.15..."* (No engagement with prongs/distinction).  
  ➠ **Prong Collapse:** Treating (a) and (b) as the *same* problem (e.g., "Losing roles is like having a bad role").  
  ➠ **Smuggling Individualism:** Solving (b) by appealing to "inherent dignity" or solving (a) with "inner autonomy."  
  ➠ **Distinction Dilution:** Calling *all* roles "load-bearing" (making (b) unsolvable) OR *all* criticizable roles "decorative" (making (a) catastrophic).  
  ➠ **The Bypass:** Using Mengzi’s "sprouts" or Xunzi’s ritualism to avoid the tension (not focusing on *role-constitution*).  
  ➠ **The Bullet-Biter’s Dodge:** Asserting "Confucianism doesn’t care about these edge cases" without argument.  

  This question forces students beyond recitation by:  
  1. **Anchoring in concrete dilemmas** (role-loss/injustice),  
  2. **Leveraging their familiarity with your key distinction**,  
  3. **Demanding meta-reflection** on the theory’s coherence.  
  The model answer demonstrates wrestling with the tension without lecturer-ly jargon, while the pitfalls help you swiftly identify unoriginal responses. Good luck with the grading!
