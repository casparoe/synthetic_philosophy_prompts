  The marking scheme must differentiate between students who actually engage the instability (A-grade) versus those who just describe the distinction (B-grade) or retreat to rote answers (C or below). Common pitfalls to flag include: conflating the two problems, defaulting to individualism, or treating "decorative" roles as trivial rather than ethically significant.

