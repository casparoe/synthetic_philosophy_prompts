prompt: |-
  I write about science and ideas for a general-interest magazine, which means I spend a lot of time at the edges of philosophy without ever having been trained in it, and lately I have been circling a puzzle I cannot get to sit still. It began as a reporting thread on prizes for being right — forecasting tournaments, prediction markets, cash awards for people who publicly change their minds — and turned into a question about whether a reward for having an attitude can ever be a reason for the attitude itself. In the toy case where someone offers me money to admire a mediocre novel, I can see that the money gives me a reason to want to admire it, and even a reason to do what I can to bring the admiration about. What I cannot see is whether it gives me any reason at all in favour of the novel, or whether it merely gives me a reason of another kind that has wandered into the wrong room. The distinction sounds crisp when I say it aloud and goes soft the moment I try to specify what makes a reason the right kind rather than the wrong one; I can produce three candidate criteria and then a counterexample to each, which I take to be roughly the state of the art and not merely my own incompetence.

  I have been asked to run a ninety-minute session at a small interdisciplinary summer institute — about eighteen participants, a mix of philosophy graduate students, two working scientists, and a couple of journalists like me — and I want the session to be an activity rather than a talk, partly because I am the least qualified person in the room to lecture and partly because I think this puzzle is far easier to feel than to state. So design me a runnable game or structured deliberation that puts the group in the position of having a stake in their own attitudes. I want participants to be offered something they genuinely want — small but real, chocolate or a share of a pot or the right to leave early, nothing needing a budget or an ethics review — in exchange for coming to admire, approve of, or hold some specified pro-attitude toward an object I will supply, and I want the machinery of the offer to make certain questions first-personal rather than abstract: did the offer give you a reason, and a reason for what — to want the attitude, to cultivate it, or a reason bearing on the object? If you succeeded in admiring, did the object improve, and did you? I would like the rules to force the group to keep two ledgers, one for considerations that speak in favour of the object and one for considerations that speak only in favour of having the attitude, and then to have to place each new consideration case by case, with some cases deliberately built to resist placement. Build in at least one inverted case, where the prize is offered for disadmiring something plainly good; one case where the pressure is a threatened loss rather than a gain; and one control case where the attitude in question is a belief rather than a liking, so that the payoff is transparently not evidence. What I want the group to come away seeing is that a consideration can be perfectly good as a reason to want an attitude and yet no reason whatsoever in favour of the object, and that the criterion separating the two is much harder to state than to feel — ideally they should end the session having drafted such a criterion themselves and having found it leaking.

  Give me the full kit: materials, roles, the exact sequence with timings, the payoff scheme and how it is enforced without real money, a set of facilitator lines or a light script so that my own framing does the minimum possible work, and a debrief that walks back through what happened and maps each moment onto the pieces of the problem — the picture on which value is being a fitting object of a pro-attitude, the two-ledger distinction, the difference between a reason for an attitude and a reason for the state of having it, and the point at which the whole construction leans on a restriction nobody has managed to explain. Assume the participants have read nothing and that I will not be citing anyone; if the debrief needs a term of art, put it on a one-page handout in plain English. Tell me what will predictably go wrong the first time — my own bets are a room full of people who simply lie for the chocolate, and a group that dismisses the prize as irrelevant far too quickly — and how to handle each failure without converting the session into a lecture. Finally, be straight with me about what the activity cannot reproduce. I suspect it cannot manufacture the real thing (a durable change in what someone actually admires), cannot settle the philosophical dispute, and cannot make artificial stakes bite as hard as a genuine threat; tell me what else is missing, and what I will have to supply myself.
reasoning: |-
  We are designing a 90-minute session for a small group (18 participants) that explores the puzzle of whether rewards for attitudes can be reasons for the attitude itself or only reasons for wanting to have that attitude. The session should be interactive, with participants having a stake in their own attitudes. We'll use small, real incentives (like chocolate) and avoid complex logistics or ethical issues.

  Key elements:
  1. **The Puzzle**: Can a reward for having an attitude (e.g., admiration) be a reason for the attitude itself (i.e., a reason in favor of the object) or only a reason to want to have the attitude?
  2. **Structure**: The activity will have participants rate objects (like a mediocre novel) and then be offered a reward for changing their attitude (e.g., to admiration). We'll have two ledgers: one for reasons that bear on the object and one for reasons that bear on having the attitude.
  3. **Cases**:
     - **Base case**: Reward for admiring a mediocre object.
     - **Inverted case**: Reward for disadmiring (e.g., disliking) a plainly good object.
     - **Threat case**: Threatened loss for not having an attitude (e.g., pay to avoid losing chocolate).
     - **Control case**: Reward for believing something (to highlight that the reward is not evidence).

  **Session Design**

  **Materials**:
  - A set of objects (for which attitudes are to be formed). These can be:
    - A short, mediocre poem (printed on a card).
    - A plain, unremarkable rock.
    - A short, beautiful poem (for the inverted case).
    - A statement of fact (for the control case) that is clearly false, e.g., "The capital of France is London."
  - Two large posters or whiteboards with two columns each (one for each ledger):
    - Ledger 1: "Reasons about the Object" (Reasons that make the object better or worse)
    - Ledger 2: "Reasons about Having the Attitude" (Reasons that make having the attitude desirable, but not about the object)
  - Sticky notes and pens for participants.
  - Incentives: Chocolate bars (or similar small treats). Alternatively, a "token" system that can be exchanged for a treat at the end (to avoid handing out chocolate during the activity). We can use a tally system on a board for each participant.
  - A timer.

  **Roles**:
  - Facilitator (you) to guide the activity.
  - Participants (18) who will engage in the tasks and discussions.

  **Session Sequence (90 minutes total)**:

  1. **Introduction (10 minutes)**:
     - Frame the session: "We are going to explore a puzzle about reasons and attitudes. Sometimes we are offered rewards for having certain feelings or beliefs. We'll be doing a series of short exercises where you might be offered a small reward (like chocolate) for having a particular attitude toward something. The goal is to examine what kinds of reasons these rewards give us."
     - Explain the two ledgers: 
       - Ledger 1: Reasons that speak to the quality of the object (e.g., reasons that make the novel good or bad).
       - Ledger 2: Reasons that speak to the benefits or costs of having an attitude (e.g., reasons that make it good for you to admire the novel, without making the novel any better).
     - Clarify that we are not asking anyone to lie. We are interested in whether the reward can actually change your attitude, and if so, how. But even if it doesn't change your attitude, we want to know what reasons the reward provides.

  2. **Activity 1: Base Case (Reward for Admiring a Mediocre Object) (20 minutes)**
     - **Step 1 (5 min)**: Present the mediocre poem. Ask participants to read it and rate their admiration on a scale of 1 (not at all) to 5 (very much). Collect initial ratings (by show of hands or by writing on a sticky note and putting it on a board).
     - **Step 2 (5 min)**: Offer a reward: "Everyone who, in 2 minutes, can honestly say they admire this poem (rating 4 or 5) will get a piece of chocolate. You have 2 minutes to think about the poem and try to bring about admiration if you can."
     - **Step 3 (5 min)**: After 2 minutes, re-rate. Ask: "How many changed their rating? Why? Did the reward give you a reason to admire the poem? Or a reason to want to admire it? Or both?"
     - **Step 4 (5 min)**: Open discussion. Facilitator writes on the ledgers based on participants' comments. Ask: "Where does the reward go? In which ledger? Is it a reason about the poem or about having the attitude?" Also, ask: "Did the poem become better because of the reward? Did you become a better judge?" 

  3. **Activity 2: Inverted Case (Reward for Disadmiring a Good Object) (15 minutes)**
     - **Step 1 (5 min)**: Present the beautiful poem. Ask for initial admiration rating.
     - **Step 2 (5 min)**: Offer a reward for disadmiring (rating 1 or 2): "Everyone who, in 2 minutes, can honestly say they disadmire (dislike) this poem will get chocolate."
     - **Step 3 (5 min)**: Re-rate and discuss. Ask: "Did the reward give you a reason against the poem? Or just a reason to want to disadmire it? Where does this go in the ledgers?"

  4. **Activity 3: Threat Case (Threatened Loss for Not Admiring) (15 minutes)**
     - **Step 1 (5 min)**: Present the rock (a plain, unremarkable object). Ask for initial admiration rating.
     - **Step 2 (5 min)**: Threaten a loss: "Everyone who does not admire this rock (rating 1,2, or 3) will lose one chocolate (if they have any). But if you admire it (rating 4 or 5), you keep your chocolate and get an extra one." (Note: We must ensure everyone has at least one chocolate by this point. So in Activity 1 and 2, we can give chocolate to those who meet the condition, and then in Activity 3, we can give one chocolate to everyone at the start of this activity to avoid real loss. Alternatively, use tokens that can be taken away. But to avoid ethical issues, we can have a token system: at the start of the session, everyone gets 3 tokens. Then rewards are tokens, and losses are tokens taken away. At the end, tokens are exchanged for chocolate: 1 token = 1 piece.)
     - **Step 3 (5 min)**: Re-rate and discuss. Focus on: "Was this different? Did the threat give you a reason to admire the rock? Or just a reason to want to avoid losing chocolate? Where does the threat go in the ledgers?"

  5. **Activity 4: Control Case (Reward for Belief) (15 minutes)**
     - **Step 1 (5 min)**: Present the false statement: "The capital of France is London." Ask for belief rating: 1 (disbelieve) to 5 (strongly believe).
     - **Step 2 (5 min)**: Offer a reward for belief (rating 4 or 5): "Everyone who, in 2 minutes, can honestly say they believe this will get chocolate (or tokens)."
     - **Step 3 (5 min)**: Re-rate and discuss. Ask: "Can the reward change your belief? Why or why not? Is the reward evidence? Where does it go in the ledgers?" (This case should highlight that for belief, we typically think that only evidence goes in the object ledger. The reward is a reason for wanting to believe, but not a reason for the belief itself.)

  6. **Debrief and Synthesis (15 minutes)**:
     - Review the ledgers: What patterns do we see? The reward and threat always go in Ledger 2 (reasons about having the attitude) and never in Ledger 1 (reasons about the object). But why?
     - Facilitator script: "We started with a puzzle: can a reward for having an attitude be a reason for the attitude itself? In our activities, we saw that the reward gave us a reason to want the attitude, and maybe even to try to bring it about. But did it give us a reason that made the object better? Did the mediocre poem become better because we were paid to admire it? In the inverted case, did the beautiful poem become worse because we were paid to dislike it? In the control case, did the reward make the false statement true? Clearly not. So the reward is a reason of the wrong kind for the attitude itself? But then what is the right kind? And why can't the reward be a reason in the object ledger?"
     - Introduce the term "Wrong Kind of Reason" (WKR) and "Right Kind of Reason" (RKR). Handout: 
          - **Right Kind of Reason (RKR)**: A reason that speaks to the qualities of the object that make the attitude fitting. (Example: The beautiful poem has rhyme and imagery that make admiration fitting.)
          - **Wrong Kind of Reason (WKR)**: A reason that speaks to the benefits or costs of having the attitude but doesn't make the attitude fitting. (Example: Being paid to admire a poem doesn't make the poem any better, but it makes it good for you to admire it.)
     - Point out the leak: "But what about cases where the reward is so big that it feels like it should count? Or cases where the attitude is about the reward itself? We haven't solved the puzzle, but we've felt it. The criterion we drafted (the two ledgers) seems to work until we push it. That's the state of the art."
     - Final reflection: "What did we learn? The distinction between reasons for the attitude and reasons for wanting the attitude is real, but hard to define. And the reward doesn't make the object better, but it might make us better off for having the attitude."

  **Handling Predictable Problems**:

  1. **Participants lying for the chocolate**: 
     - Emphasize honesty: "We are interested in whether the reward can actually change your attitude. If it doesn't, that's fine. We are not testing you; we are exploring the puzzle. Please try to be honest with yourself and with us."
     - Reassure: "Even if you don't change your attitude, you are contributing by showing that the reward doesn't always work. And you can still participate in the discussion about what reasons the reward provided."

  2. **Group dismisses the prize as irrelevant too quickly**:
     - Challenge: "If the prize is irrelevant, then why did some people change their rating? Or, if no one did, why not? What if the prize were a million dollars? Would that change your attitude? Or would it just make you want to have the attitude? Let's put that in the ledger."
     - Use the threat case: The threat of loss might make the stakes feel more real.

  **What the Activity Cannot Reproduce**:
  - **Durable attitude change**: The activity is too short to cause real, lasting admiration. We are only simulating the initial pressure.
  - **Settling the dispute**: The goal is to experience the puzzle, not solve it.
  - **Real stakes**: The chocolate is trivial. It won't mimic the pressure of a life-changing reward. You'll have to highlight this gap and ask participants to imagine higher stakes.
  - **Complex attitudes**: We use simple objects (poem, rock) but real-life cases (like political beliefs) are more complex.
  - **Missing nuance**: The ledgers might not capture all reasons (e.g., if the reward becomes part of the object). You'll have to note that in the debrief.

  **Facilitator's Role**: 
  - Stay neutral. Ask questions. 
  - Use the script to frame without lecturing. 
  - Write on the ledgers based on what participants say. 
  - In the debrief, connect the activity to the puzzle.

  **Final Note**: This activity is about creating an experience. The goal is to make the abstract puzzle tangible and to show that the distinction between RKR and WKR is intuitive even if hard to define. The group should leave with a shared experience of the puzzle and an appreciation for its difficulty.
answer: |-
  ### Structured Session: "The Attitude Auction"  
  **Objective:** To create a lived experience of the puzzle around rewards for attitudes, forcing participants to confront the distinction between reasons *for an attitude* (bearing on the object) and reasons *for wanting to have an attitude* (bearing on the holder). Participants will draft their own "criterion" for separating these reasons and watch it fail.  

  **Materials:**  
  - **Objects for evaluation:**  
    - Mediocre poem (printed on cards): *"The sky is gray / The birds fly away / I sip my tea / Alone, you see."*  
    - Plain rock (one per table).  
    - Beautiful poem (printed on cards): Mary Oliver’s *"Wild Geese"* (excerpt: *"You do not have to be good..."*).  
    - False statement (on screen): *"Water boils at 70°C at sea level."*  
  - **Incentives:** Chocolate bars (30+ pieces, e.g., mini bars). Use a token system: 1 token = 1 chocolate piece. Participants start with 0 tokens.  
  - **Ledgers:** Two large whiteboards:  
    - **Ledger 1 (Green):** "Reasons about the OBJECT (What makes it admirable/good?)"  
    - **Ledger 2 (Red):** "Reasons about HAVING the attitude (What makes it good *for you* to admire it?)"  
  - Sticky notes (green for Ledger 1, red for Ledger 2), markers, timers.  
  - Handout (debrief only): Plain-English glossary (e.g., "Pro-attitude: Liking, admiring, approving of something").  

  **Participants:** 18 people, seated in three groups of 6. Assign a "ledger keeper" per group (rotates each activity).  

  **Total Time:** 90 minutes.  
  **Key Mechanics:**  
  - Incentives are enforced via self-reporting (honor system stressed). Tokens are convertible to chocolate at the end.  
  - Participants must verbally justify attitude shifts to their group before claiming rewards.  
  - Ledger keepers place sticky notes (with reasons) on the shared whiteboards during discussions.  

  ---

  ### Session Sequence  

  #### **1. Introduction: Framing the Puzzle (10 min)**  
  **Facilitator Script:**  
  *"Today, we’re playing a game about ‘reasons.’ You’ll be offered tokens (for chocolate) to try to change how you feel about things. Your job: pay attention to* why *you might change your attitude. We’ll track reasons in two ledgers:  
  - **GREEN LEDGER:** Reasons that speak to the object itself (e.g., ‘This poem is beautiful because of its rhythm’).  
  - **RED LEDGER:** Reasons that speak to the benefits of having the attitude (e.g., ‘I get chocolate if I admire this poem’).  
  We’ll vote, debate, and draft a rule to split these reasons. Be honest—we care about your internal experience, not performance."*  

  **Setup:** Distribute objects. Show ledgers.  

  ---

  #### **2. Activity 1: Base Case (Reward for Admiring Mediocrity) (20 min)**  
  **Goal:** Experience rewards for admiring a mediocre object.  
  **Steps:**  
  1. **Initial Rating (3 min):** Read mediocre poem. Rate admiration privately (1–5 scale; 1=not at all, 5=very). Show of hands for distribution.  
  2. **Offer (2 min):** *"If you rate your admiration at 4–5 in 5 minutes, you get 1 token. You must explain to your group why your rating changed (or didn’t)."*  
  3. **Deliberation (5 min):** Groups discuss: *"Can you ‘make yourself’ admire it? What reasons are at play?"* Ledger keepers note reasons on stickies.  
  4. **Final Rating & Payout (5 min):** Re-rate. Participants who claim 4–5 justify briefly to their group (e.g., *"I focused on the simplicity"*). Award tokens.  
  5. **Group Discussion (5 min):** *"Where does the token offer go? GREEN (it improved the poem?) or RED (it’s about the reward?)?"* Force a vote per group. Place stickies.  

  **Predictable Problem:** Some lie for chocolate.  
  **Mitigation:** Stress honesty: *"If you didn’t change your attitude, say so—that’s data! You still get to debate the ledgers."* If lying dominates, ask: *"Did the chocolate make the poem better? Or just make you want to admire it?"*  

  ---

  #### **3. Activity 2: Inverted Case (Reward for Disadmiring Excellence) (15 min)**  
  **Goal:** Test rewards for *disliking* something good.  
  **Steps:**  
  1. **Initial Rating (3 min):** Read Mary Oliver’s poem. Rate admiration (1–5).  
  2. **Offer (2 min):** *"If you rate admiration at 1–2 in 5 minutes, get 1 token. Justify changes."*  
  3. **Deliberation (5 min):** Groups discuss: *"Can you ‘undo’ admiration? Is the reward a reason against the poem?"* Ledger keepers update stickies.  
  4. **Final Rating & Payout (5 min):** Re-rate. Claimants justify. Award tokens.  

  **Discussion Prompt:** *"If you disadmired it, did the poem get worse? Or did you just want the token?"*  

  ---

  #### **4. Activity 3: Threat Case (Threatened Loss for Not Admiring) (15 min)**  
  **Goal:** Contrast rewards with punishments.  
  **Steps:**  
  1. **Initial Rating (3 min):** Examine the rock. Rate admiration (1–5).  
  2. **Threat (2 min):** *"You now have 1 ‘bonus’ token. If your admiration is NOT 4–5 in 5 minutes, you lose it. If it is 4–5, keep it and get +1 token."*  
  3. **Deliberation (5 min):** Groups discuss: *"Does losing something feel different? Where does this threat go?"*  
  4. **Final Rating & Enforcement (5 min):** Re-rate. Participants below 4–5 lose bonus token (if claimed).  

  **Discussion Prompt:** *"Did the threat give you a reason to admire the rock? Or just to avoid losing chocolate?"*  

  ---

  #### **5. Activity 4: Control Case (Reward for False Belief) (15 min)**  
  **Goal:** Highlight belief vs. liking.  
  **Steps:**  
  1. **Initial Belief (3 min):** See false statement (*"Water boils at 70°C"*). Rate belief (1–5; 1=disbelieve, 5=strongly believe).  
  2. **Offer (2 min):** *"If you rate belief at 4–5 in 5 minutes, get 1 token. Justify."*  
  3. **Deliberation (5 min):** Groups discuss: *"Can you ‘make yourself’ believe this? Is the token evidence?"*  
  4. **Final Rating & Payout (5 min):** Re-rate. Award tokens if claimed.  

  **Key Question:** *"Why is belief different from admiration? Where does the token go?"*  

  ---

  #### **6. Debrief: Drafting the Criterion and Watching It Leak (15 min)**  
  **Facilitator Script:**  
  *"Let’s map what happened:  
  - In Activities 1–3, rewards/threats gave you reasons to WANT an attitude (RED LEDGER), but did they improve the object (GREEN LEDGER)?  
  - In Activity 4, the reward couldn’t change belief because belief demands evidence—it’s ‘evidence-sensitive.’ Admiration isn’t.  
  - Now, draft a criterion: ‘A reason belongs in the GREEN LEDGER only if...’"*  

  **Group Task (7 min):**  
  - Groups draft a 1-sentence criterion to split GREEN/RED reasons.  
  - Share criteria. Write them down.  

  **Testing the Criteria (5 min):**  
  Pose counterexamples:  
  - *"What if I offer $1 million to admire the rock? Is that still RED?"*  
  - *"What if admiring the rock gets you social approval? GREEN or RED?"*  
  - *"What if the object IS the reward (e.g., admiring money itself)?"*  

  **Final Handout (3 min):**  
  Distribute glossary with terms:  
  - **Pro-attitude:** Liking, admiring, or approving of something.  
  - **Right Kind of Reason (RKR):** A reason that speaks to the object’s properties (e.g., *"The poem is vivid"* → GREEN).  
  - **Wrong Kind of Reason (WKR):** A reason that speaks to the benefits/costs of having the attitude (e.g., *"I get chocolate"* → RED).  
  - **Leaky Criterion:** No one agrees on how to perfectly split RKR/WKR (e.g., does "fittingness" help?).  

  **Closing:** *"You’ve felt the gap: rewards can be reasons to WANT an attitude without being reasons for the attitude itself. But drawing the line? That’s the puzzle that humbles philosophers."*  

  ---

  ### What Predictably Goes Wrong (and Fixes)  
  1. **"Everyone lies for chocolate":**  
     - **Fix:** Normalize no-shift ("Didn’t change? Tell us why!"). Focus discussions on ledger placement, not behavior.  
  2. **"Dismissing incentives as irrelevant":**  
     - **Fix:** Use the threat case (loss aversion bites harder). Ask: *"What if it was $10,000? Would that *feel* like a reason for the object?"*  
  3. **"Over-intellectualizing too fast":**  
     - **Fix:** Keep activities visceral. Use timers. Ask: *"What did you *feel* when the offer was made?"*  

  ### What the Activity Cannot Reproduce  
  1. **Durable attitude change:** The session won’t create lasting admiration—only momentary pressure. You’ll need to say: *"Real-world cases (e.g., prizes for changing political views) involve time and identity—we’re simulating the first spark."*  
  2. **High-stakes motivation:** Chocolate ≠ life-altering rewards. Mitigate by asking: *"Imagine the token was a job offer. Would that blur the ledgers?"*  
  3. **Belief-attitude equivalence:** Beliefs (Activity 4) highlight evidence-sensitivity, but pro-attitudes are messier. The activity exposes this but can’t resolve it.  
  4. **Social/cultural pressures:** The game isolates individual rationality, ignoring peer influence. Note this gap: *"In reality, attitudes are social—rewards might work differently there."*  
  5. **Philosophical resolution:** The criterion will leak, and that’s the point. You must frame this: *"We’re left with the same puzzle—but now you’ve lived it."*  

  ### What You Supply  
  - **Vulnerability:** Share your own struggle ("I can’t make this criterion stick either").  
  - **Neutrality:** Don’t lecture; use questions to expose tensions.  
  - **Context:** At the start, briefly link to your work: *"This is why forecasting prizes fascinate me—do they reward truth or just agreement?"*  

  This design makes the abstract visceral, forces ledger distinctions, and ends with participants drafting—and doubting—their own solution. The leak is the lesson.
