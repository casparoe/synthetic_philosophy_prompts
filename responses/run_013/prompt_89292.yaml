prompt: |-
  I'm assembling the questions for a long-form interview with a game theorist in the epistemic tradition — the program that reads a solution concept as a claim about what players know and believe rather than as a claim about what they choose. Her position is that equilibrium play follows from common knowledge of rationality together with common knowledge of the players' conjectures about one another, and that common knowledge itself is a limiting idealization that can be approached but never attained. I want questions that force her to do work rather than restate the program, so please press where the technical literature presses, and build in the follow-up to the reply she is most likely to give.

  Write eight to ten questions, each followed by one follow-up. The set must include at least one question on each of the following:

  - why common knowledge of rationality is supposed to be insufficient on its own for equilibrium play, and whether the extra assumption she adds — that the players' conjectures about one another, and not merely their rationality, are common knowledge — does substantive work or merely restates equilibrium in epistemic vocabulary;
  - whether a finite agent can literally hold the infinite hierarchy of beliefs that common knowledge of an event requires, and whether redescribing those beliefs as finitely specifiable rules that generate the hierarchy answers the objection or relabels it;
  - two agents who are both rational, mutually informed, and who know one another's posterior probabilities, yet go on disagreeing; and then the variant in which they share a prior but the common knowledge stops short of their posteriors. Ask which assumption she would rather give up;
  - the finitely repeated prisoner's dilemma in which each player assigns a small probability to the other being the sort who cooperates until defected upon. Ask whether the cooperation that results vindicates the epistemic program or shows that common knowledge of the payoffs, rather than of rationality, was carrying the result.

  Two further requirements: one question must press on whether the program is descriptive or normative — what it says about real players whose reasoning visibly stops after two or three steps — and the final question must ask what result or observation would lead her to abandon the program.

  Format the response as: 'Framing', no more than three sentences, stating the guest's position as I will introduce it; 'Questions', numbered, each with its follow-up directly beneath it; and 'Where to press hardest', a short closing paragraph naming the two questions most likely to force a concession and saying what that concession would be.
reasoning: |-
  We are interviewing a game theorist in the epistemic tradition. Her position: 
  - Equilibrium play arises from common knowledge of rationality (CKR) and common knowledge of the players' conjectures about each other.
  - Common knowledge is a limiting idealization, approachable but never attained.

  We need 8-10 questions with one follow-up each, covering:
  1. Why CKR alone is insufficient for equilibrium, and whether adding common knowledge of conjectures does substantive work or just restates equilibrium.
  2. Whether a finite agent can hold an infinite hierarchy of beliefs, and if finitely specifiable rules answer the objection.
  3. Two agents who are rational, mutually informed, know each other's posteriors, yet disagree; then the variant with shared prior but common knowledge stops short of posteriors. Ask which assumption she would give up.
  4. Finitely repeated prisoner's dilemma with small probability of tit-for-tat type: does cooperation vindicate the program or show that common knowledge of payoffs was key?

  Also:
  - One question on descriptive vs. normative: what about real players who stop reasoning after 2-3 steps?
  - Final question: what would make her abandon the program?

  Structure:
  - Framing (3 sentences max)
  - Questions (numbered, each with follow-up directly beneath)
  - Where to press hardest (paragraph naming two questions that force concession and what concession)

  Let's design the questions accordingly.

  Framing:
  "Dr. [Name] champions the epistemic program in game theory, which interprets solution concepts as claims about players' knowledge and beliefs. She argues that equilibrium play follows from common knowledge of rationality and common knowledge of the players' conjectures about one another. Moreover, she holds that common knowledge is an unattainable ideal, approached in the limit but never fully realized."

  Questions:

  1. On insufficiency of CKR and the role of conjectures:
  Question: "It's often claimed that common knowledge of rationality (CKR) alone cannot imply equilibrium because, for instance, in coordination games, rational players might fail to coordinate without common knowledge of their beliefs. How does adding common knowledge of conjectures fill this gap? And doesn't this just restate that the conjectures form an equilibrium, rather than explaining why they do?"
  Follow-up: "If the extra assumption is that the conjectures are common knowledge and they form an equilibrium, how is this not circular? What independent force does the assumption of common knowledge of conjectures have?"

  2. On the infinite hierarchy of beliefs:
  Question: "Common knowledge of an event requires an infinite hierarchy of beliefs: I believe that you believe that I believe... and so on. How can a finite agent actually hold such an infinite structure? Doesn't this imply that common knowledge is impossible for any real cognitive system?"
  Follow-up: "Some argue that we can represent common knowledge with finitely specifiable rules (like 'we both know the rules of the game and we are both rational'). Does this solve the problem, or does it just relabel the infinite regress as a finite rule that implicitly generates it?"

  3. On disagreement with common knowledge of posteriors:
  Question: "Consider two rational agents with common priors and mutual knowledge of each other's posteriors after receiving private signals. Aumann's agreement theorem suggests they must agree. But what if they still disagree? Must we then give up rationality, common priors, or mutual knowledge of posteriors?"
  Follow-up: "In the variant where they share a prior but lack common knowledge of each other's posteriors, disagreement is possible. But if we require common knowledge of the posteriors and they still disagree, which assumption would you rather abandon: their rationality, the common prior, or the mutual knowledge of posteriors?"

  4. On the repeated prisoner's dilemma (with tit-for-tat types):
  Question: "In the finitely repeated prisoner's dilemma, if each player assigns a small probability to the other being a tit-for-tat type, then cooperation can emerge in equilibrium. Does this support the epistemic program by showing that common knowledge of rationality and conjectures explains cooperation? Or does it reveal that the result actually hinges on common knowledge of the payoffs being violated (since the players are unsure about the other's type, hence about the payoffs)?"
  Follow-up: "If we insist that the players have common knowledge of the payoffs and rationality, then the backward induction argument would force defection. But the cooperation arises because we've relaxed common knowledge of payoffs. Doesn't this suggest that the classic backward induction result is fragile and that the epistemic conditions are doing the heavy lifting only when we relax common knowledge?"

  5. On descriptive vs. normative:
  Question: "Your program treats common knowledge as a limiting idealization. But in practice, human players in games often stop reasoning after two or three steps, and they sometimes do not reach equilibrium. Is the epistemic program meant to be descriptive of actual behavior, or is it purely normative? And if normative, how should we model bounded rationality within your framework?"
  Follow-up: "If we model bounded rationality by truncating the hierarchy of beliefs (e.g., level-k thinking), how does that fit with the idea of common knowledge as a limit? Does the epistemic program then become a family of level-bounded models, and if so, how do we choose the level?"

  6. On the possibility of non-equilibrium play with common knowledge:
  Question: "Is there an example where we have common knowledge of rationality and common knowledge of the players' conjectures, but the conjectures are not in equilibrium? If not, does that mean that the two conditions together are equivalent to equilibrium, or is there a deeper reason why they must coincide?"
  Follow-up: "If the two conditions (CKR and common knowledge of conjectures) imply equilibrium, then what is the independent content of the rationality assumption? Could we have common knowledge of conjectures without rationality and still get equilibrium?"

  7. On the role of the solution concept:
  Question: "In the epistemic program, solution concepts like Nash equilibrium are derived from epistemic conditions. But how do we choose which solution concept to derive? For instance, in games with incomplete information, we might target Bayesian Nash equilibrium. How do the epistemic conditions vary across solution concepts?"
  Follow-up: "Does this mean that the epistemic conditions are tailored to the solution concept, and if so, doesn't that make the program ad hoc? Or is there a unified set of conditions that generate the appropriate solution concept for each game?"

  8. On the unattainability of common knowledge:
  Question: "You say common knowledge is a limiting idealization. How do we interpret a model that uses an unattainable ideal? And what does it mean to 'approach' it? For example, in a sequence of games with increasing depth of mutual knowledge, when do we say we are close enough?"
  Follow-up: "In practical terms, how would we measure the 'distance' to common knowledge? And if we can't attain it, why should we expect real agents to behave as if they had it?"

  9. On abandoning the program (final question):
  Question: "What empirical result or theoretical development would lead you to abandon the epistemic program? For instance, if we found a game where common knowledge of rationality and conjectures held but play was not in equilibrium, would that refute it? Or is the program insulated by the unattainability of common knowledge?"
  Follow-up: "If common knowledge is unattainable, then we can always attribute any deviation to not having reached the limit. Doesn't that make the program unfalsifiable? And if so, is that a weakness?"

  Where to press hardest:
  We should press hardest on the infinite hierarchy of beliefs (question 2) and on the descriptive/normative divide (question 5). For the hierarchy, the concession might be that common knowledge is indeed impossible for finite agents and that we must work with approximations, which then raises the question of how to choose the level of approximation. For the descriptive/normative question, the concession might be that the program is primarily normative and that bounded rationality models are complementary but not directly part of the epistemic program, which leaves open the gap between theory and practice.

  Let me now write the full set with 9 questions (covering all requirements) and format accordingly.
answer: |-
  **Framing**  
  Dr. [Name] advocates an epistemic approach to game theory, interpreting solution concepts as claims about players' knowledge rather than choices. She argues that equilibrium play stems from common knowledge of rationality *and* common knowledge of players' conjectures about one another, viewing common knowledge as an unattainable ideal approached only in the limit. Her work challenges mechanistic views of equilibrium by emphasizing the role of beliefs and higher-order reasoning.

  **Questions**  
  1. **On CKR’s insufficiency and conjectures' role**:  
     Common knowledge of rationality (CKR) alone fails to guarantee equilibrium—e.g., in coordination games, rational players may miscoordinate absent shared beliefs. Why does adding common knowledge of conjectures resolve this, and how does it avoid circularly restating equilibrium rather than explaining it?  
     *Follow-up*: If conjectures are common knowledge and consistent with equilibrium, is the "extra assumption" just repackaging the definition of equilibrium epistemically, or does it provide new behavioral content (e.g., pinning down *which* equilibria emerge)?  

  2. **On finite agents and infinite hierarchies**:  
     Common knowledge requires an infinite hierarchy of beliefs ("I believe you believe I believe..."). Can a finite cognitive system literally hold such a structure, or does this undermine the realism of the model?  
     *Follow-up*: You might argue these hierarchies are compressed into finitely specifiable rules (e.g., "we follow public rules"). But doesn’t this merely *relabel* the regress—since the rule implicitly generates infinite beliefs—without solving the cognitive implausibility?  

  3. **On disagreement with shared priors and known posteriors**:  
     Suppose two rational agents share a prior, observe private signals, and mutually know each other’s posteriors—yet still disagree. Aumann’s theorem forbids this, so which assumption must break: rationality, common priors, or mutual knowledge of posteriors?  
     *Follow-up*: In a variant where priors are common knowledge but posteriors are *not*, disagreement is allowed. If disagreement persists *with* common knowledge of posteriors, would you discard rationality or the common prior—and why?  

  4. **On disagreement without shared priors**:  
     Consider two rational agents with mutual knowledge of their posteriors but *no* shared prior. They disagree despite knowing each other’s views. Does this reveal a flaw in common knowledge as a tool for alignment, or is it a feature?  
     *Follow-up*: If common knowledge of posteriors fails to ensure agreement without shared priors, does this limit the program’s explanatory power for real-world disputes (e.g., polarized politics)?  

  5. **On the repeated Prisoner’s Dilemma**:  
     In the finitely repeated PD, if players assign small probability to tit-for-tat types, cooperation emerges. Does this support your program—showing CKR + common beliefs explain cooperation—or prove that *relaxing* common knowledge of payoffs (via uncertainty) enables it, while CKR alone implies defection?  
     *Follow-up*: Backward induction fails here only because payoffs aren’t common knowledge. If your program emphasizes common knowledge of conjectures, not payoffs, does this admit that *which* knowledge is "common" determines outcomes more than rationality?  

  6. **On descriptive vs. normative claims**:  
     Players in experiments (e.g., beauty contests) often reason only 2–3 steps deep, contradicting infinite common knowledge. Is your program descriptive (predicting real behavior) or normative (prescribing ideal play)? If the latter, how does it address bounded rationality?  
     *Follow-up*: When bounded players fail equilibrium, do you attribute this to "insufficiently approximated" common knowledge? If so, how is this falsifiable, given it’s always "approachable but unattainable"?  

  7. **On the necessity of common knowledge of conjectures**:  
     In some games (e.g., Nash demand game), CKR alone can yield equilibrium if players have aligned "focal points." When does common knowledge of conjectures add *essential* leverage beyond CKR?  
     *Follow-up*: If conjectures must be correct in equilibrium, is assuming their common knowledge equivalent to assuming equilibrium—making your account tautological?  

  8. **On refining solution concepts**:  
     How do your epistemic conditions distinguish between solution concepts (e.g., Nash vs. correlated equilibrium)? Does common knowledge of conjectures imply more than mutual knowledge, and if so, how?  
     *Follow-up*: Correlated equilibrium relies on common priors over signals. If your framework requires common knowledge of conjectures *instead*, does it subsumes correlated equilibrium or compete with it?  

  9. **On abandoning the program**:  
     What empirical result or theoretical proof would lead you to discard the epistemic program? For instance, if players achieved common knowledge (via an oracle) but still deviated from equilibrium, would that refute it?  
     *Follow-up*: Since common knowledge is idealised, any deviation can be blamed on "imperfect approximation." Does this make the program unfalsifiable—and if so, is that defensible for science?  

  **Where to press hardest**  
  Press hardest on **Question 2 (finite agents)** and **Question 6 (descriptive/normative)**. For Question 2, the likeliest concession is that common knowledge *is* cognitively impossible, reducing it to finite-order beliefs (e.g., "k-level thinking")—undermining the "limiting idealization" as a unique benchmark. For Question 6, expect a retreat to normativity, conceding that real behavior requires auxiliary (non-epistemic) models of bounded rationality, thus limiting the program’s scope. Both force admissions about the gap between theory and reality.
