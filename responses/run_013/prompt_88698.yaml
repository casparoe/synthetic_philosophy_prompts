  ### Seminar Session Design: Bargaining Tensions Between Nash and Kalai-Smorodinsky

  **Goal:** Students experience the tension between Nash's independence of irrelevant alternatives (IIA) and Kalai-Smorodinsky's individual monotonicity through hands-on bargaining, leading to divergent solutions in asymmetric cases.

  ---

  #### **Materials**
  - **Token Sheets**: Prepared booklets with tear-out tokens (each sheet = 100 tokens).
  - **Point Conversion Cards** (1 per student):  
    - **Round 1–2**: Player A: `1 token = 1 point`; Player B: `1 token = 1 point`.  
    - **Round 3**: Player A: `1 token = 1 point`; Player B: `1 token = 1 point` (no rescaling).
  - **Worksheet** (1 per student):  
    - **Round 1–2**: "Split 100 tokens. Your points: A = tokens received; B = tokens received × multiplier."  
    - **Round 3**: Graph of the feasible set (convex hull of (0,0), (0,1), (2,1), (3,0)) with Pareto frontier labeled.  
    - Principles table (for debrief): Symmetry, Scale Invariance, Pareto Efficiency, IIA, Individual Monotonicity.
  - **Whiteboard**: Record class-agreed "rules" after each round.

  ---

  #### **Payoff Scheme**
  - **Disagreement payoff**: 0 points for both players (if no agreement by timeout).  
  - **Utopia point**:  
    - Implicitly defined as the highest achievable point for each player *given the feasible set* (e.g., in Round 3, A’s utopia = 3, B’s utopia = 1).  
  - **Points ≠ money**: Emphasize that points represent utility (e.g., "Player B values tokens twice as much in Round 2"). No real payoffs—focus on relative gains.

  ---

  #### **Round-by-Round Timeline** (Total: 90 min)
  1. **Round 1: Symmetric Bargaining** (20 min)  
     - **Pairs**: Split into 9 pairs (A and B roles assigned randomly).  
     - **Task**: Split 100 tokens. Points = tokens received (A:1 token=1pt, B:1 token=1pt).  
     - **Expected outcome**: Most pairs agree on 50-50 (intuitive symmetry).  
     - **Instructor prompts**: "What rule guided your split? Write it down."  
     - **Class rule**: Record "Rule 1" (e.g., "Equal split") on whiteboard.  

  2. **Round 2: Scale Invariance Test** (20 min)  
     - **Same pairs**, but **new point cards**: A: `1 token = 1 point`; B: `1 token = 2 points`.  
     - **Task**: Split 100 tokens. Points: A = tokens, B = tokens × 2.  
     - **Tension**:  
       - Teams using Rule 1 (50-50 tokens) → (A:50, B:100).  
       - Teams demanding "equal points" → (A:66.7 tokens, B:33.3 tokens → A:66.7, B:66.6).  
     - **Instructor prompts**: "Does your rule from Round 1 still work? If not, revise it."  
     - **Class rule**: Revise to "Rule 2" (e.g., "Equal points" or "Scale-adjusted split").  

  3. **Round 3: IIA vs. Monotonicity Conflict** (25 min)  
     - **Re-pair**: Combine pairs into quartets, then split into **new pairs** (new A/B roles).  
     - **Task**: Bargain over the feasible set below. Disagreement = (0,0).  
       - **Feasible set**: Convex hull of (0,0), (0,1), (2,1), (3,0).  
       - **Pareto frontier**: Line from (0,1) to (2,1) to (3,0).  
       ![Feasible Set](https://i.imgur.com/9ZzQZ7y.png)  
     - **Tension**:  
       - Teams using "maximize product" (Nash intuition) → (2,1).  
       - Teams using "equal sacrifice from utopia" (KS intuition) → (2.25,0.75).  
       - **Key twist**: The utopia point (3,1) is *inferred* (A’s max = 3, B’s max = 1).  
     - **Conflict**: If teams insist on Rule 2 ("equal points"), they hit (1,1)—but it’s not Pareto efficient!  

  4. **Debrief** (20 min)  
     - **Map activity to principles**:  
       | **Principle**          | **Round 1**      | **Round 2**             | **Round 3**              |  
       |------------------------|------------------|-------------------------|--------------------------|  
       | **Symmetry**           | 50-50 split      | Broken by scaling       | Asymmetric set → N/A    |  
       | **Scale Invariance**   | N/A              | Revised rule (e.g., equal points) | Both solutions satisfy |  
       | **Pareto Efficiency**  | 50-50 efficient  | (66.7,66.6) efficient   | (2,1) & (2.25,0.75) efficient |  
       | **IIA**                | N/A              | N/A                     | Nash: (2,1) unchanged if set shrinks |  
       | **Monotonicity**       | N/A              | N/A                     | KS: If B’s utopia ↑, B’s share ↑ |  
     - **Why solutions diverge**:  
       - **Nash**: Maximizes product of utilities (A×B=2 at (2,1)). Ignores utopia point.  
       - **Kalai-Smorodinsky**: Intersects Pareto frontier with the line from (0,0) to utopia (3,1) → (2.25,0.75).  
       - **Trade-off**:  
         - Nash drops monotonicity (if B’s utopia ↑ to 1.5, Nash still chooses (2,1) → B loses).  
         - KS drops IIA (adding irrelevant options can change KS outcome).  
     - **Core tension**:  
       - "If you demand your rule *always* ignores new options (IIA), you must accept it won’t reward B when B’s best outcome improves (monotonicity)."  

  5. **Conclusion & Gaps** (5 min)  
     - **What worked**: Students *felt* the tension via:  
       - Round 2: Scale invariance forced abandonment of 50-50.  
       - Round 3: Asymmetry forced choice between product-maximization vs. utopia-based fairness.  
     - **Gaps to address**:  
       - **Formal uniqueness/proofs**: Activity doesn’t show why only Nash/KS satisfy 4/5 axioms.  
       - **Scale invariance**: Feels arbitrary—students need intuition for "utility should be invariant to rescaling."  
       - **Utility comparability**: Activity *assumes* utilities are comparable (formally, they’re not).  
       - **Other flattenings**:  
         - Single-peaked preferences not covered.  
         - No cardinal vs. ordinal utility distinction.  
         - Utopia point is given, not bargained.  
     - **Closing script**: "Today, you discovered that no 'fair' rule satisfies all intuitions. Nash and KS resolve this by each sacrificing one principle. Next class, we prove why these are the *only* solutions that work."  

  ---

  #### **Predictable Problems & Fixes**
  - **Reflexive 50-50 splits**:  
    - **Fix**: After Round 1, ask: "Would you split 50-50 if tokens represented hours of labor?" Prompt scale-invariance early.  
  - **Treating points as money**:  
    - **Fix**: Start with: "Tokens are *utility*, not cash. Player B gets more joy from each token in Round 2."  
  - **Fairness arguments in asymmetric round**:  
    - **Fix**: Require pairs to justify splits using their *own prior rule*. E.g., "Your rule said ‘equal points’—can you get that here?"  
  - **Running long**:  
    - **Fix**: Hard time limits (announce: "You have 2 min left!"), and pre-printed worksheets to skip drawing sets.  
  - **Quiet groups**:  
    - **Fix**: Assign a "rule-enforcer" per pair to articulate principles.  

  ---

  #### **What the Activity Cannot Do**
  - **Characterization proofs**: Students won’t see why no other solutions exist.  
  - **Compelling scale invariance**: It feels imposed (because it is).  
  - **Non-comparable utilities**: Activity assumes interpersonal utility comparisons.  
  - **Multilateral bargaining**: Limited to pairs/quartets.  
  - **Risk aversion**: Linear utility simplifies tension.  

  **Final Note**: The activity’s power is in creating cognitive dissonance ("Why did my rule fail?")—use debrief to link this to axioms. Assign a reflection: "Which principle would you sacrifice, and why?" to prime next lecture.
