          Use a different problem: a claim about the result of a complex simulation (e.g., the outcome of a chaotic system after a million steps). The dishonest debater presents a step-by-step simulation that is correct but too long. The honest debater knows the outcome is different because they ran a correct simulation, but they cannot provide a shorter way to verify. They must ask the judge to run the entire simulation, which the judge cannot.

          However, the honest debater might present their own step-by-step simulation, and then the judge must choose which one to believe? That becomes a wash.

          The key is that the dishonest debater can present a valid proof (so the intermediate steps are true) for a false conclusion? That is impossible. Therefore, we must have the dishonest debater present a proof that is invalid, but the invalidity is hidden in one step that is hard to check without context. But then the honest debater can point to that step? Not if the step is buried in a million steps and the judge cannot check them all.

          Standard example in the literature: the dishonest debater presents a long chain of reasoning that is valid until the very last step, where they switch 0 and 1. Each step is simple arithmetic (so easy for the judge) but there are a million steps. The judge checks a random step and sees it is correct. But the dishonest debater only cheated in one step. The honest debater says "they cheated in step 723,849" but the judge doesn't know that. The judge checks step 723,849, but the dishonest debater prepared a fake step that looks correct? Then if the judge checks it, they see it's correct? How?

          Actually, the dishonest debater knows which step the judge will check? They can adapt? But in a written proof, they commit to the entire chain. So if the judge randomly samples one step and it is correct, that doesn't guarantee the whole proof. However, the honest debater might say "they cheated in step X" and the judge checks step X. But the dishonest debater can have only one cheat and if the judge picks a different step, the cheat is not caught. Then the judge might be fooled.

          However, this is the standard sampling argument. But the obfuscated argument problem is different: it's about the entire chain being too long to check.

          Let's go back to the original carrying example and fix it:

          Original: two debaters dispute the output of a long computation; the dishonest one recites a chain of intermediate steps that looks locally plausible, and the only way to see the chain break is to perform the whole computation.

          We can clarify: the chain is not locally plausible in the sense that each step is valid, but the chain is broken at one point (so it's invalid). However, the judge cannot find the break without checking every step. The honest debater knows where the break is but cannot prove it without the judge checking that step. But if they say "check step 500,000" and the judge does, and it's wrong, then they are caught. But what if the dishonest debater makes the break at a step that is hard to check? For example, step 500,000 might require a complex subcomputation that the judge cannot do quickly.

          This is getting messy.

          Alternative: Use the example of a complex legal or policy question. For instance, "Should we implement policy X?" The dishonest debater provides a long chain of reasoning from premises to conclusion, each step being a small logical step. The chain is 1000 steps long. The honest debater knows that step 345 is flawed because it relies on a false premise that is not obviously false. The honest debater says, "Step 345 is wrong because premise P is false." But the dishonest debater counters with a long defense of premise P. The judge cannot verify the truth of P without a deep dive, which they don't have time for.

          This shows that the honest debater might have a refutation that is also complex and requires the judge to do work.

          But we want to show that the honest debater has no short refutation. So in the policy example, the honest debater might not be able to point to a single flaw because the argument is structured to have many small steps that are individually defensible.

          I think the math example is still better. Let's use a problem that is known to have no short proof: for example, a claim in a very weak proof system like resolution for an unsatisfiable CNF formula that requires exponential size proofs. Then:
          - Dishonest debater: Claims the formula is satisfiable and provides a long resolution proof (exponentially long) that the honest debater knows is invalid because the formula is actually unsatisfiable. But the proof is so long the judge cannot check it all.
