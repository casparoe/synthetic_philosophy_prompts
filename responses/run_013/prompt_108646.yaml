          However, the honest debater might know the entire proof and know where the flaw is. But they cannot convince the judge without the judge checking that step and seeing the flaw. But if the step is complex, the judge might not be able to verify it? This is getting too technical.

          I propose we use the following example (simpler):

          Claim: What is the result of 1+2+3+...+1000?
          Correct answer: 500500.
          Dishonest debater: Says 500000. They present a step-by-step addition: 
            Step 1: 1+2=3
            Step 2: 3+3=6
            ...
            Step 999: 499500+1000=500500? But they cheat at step 500: they say 124750+501=125250 (but actually 124750+501=125251). Then the sum ends up as 500000.
          The dishonest debater presents the entire list of 999 steps.
          The honest debater knows the correct answer is 500500 and knows the cheat occurred at step 500. But the judge cannot check all 999 steps. The honest debater says, "Step 500 is wrong: 124750+501 is 125251, not 125250." But the judge must then check step 500. How? They must compute 124750+501. But what if the numbers are huge? For example, if the sum is up to 1e12, then step 500 involves numbers with 12 digits, and the judge might be slow at adding 12-digit numbers? Or if we make the step more complex? Actually, the judge can add two numbers. But we can make it harder.

          Instead, make the computation at each step a complex one. For example, at each step i, the debater must compute f(i) for some complex function f, and then add it to the running total. The dishonest debater cheats at one step by computing f(i) wrong. The honest debater knows which step and what the correct f(i) is, but to convince the judge, they must show that f(i) is not what the dishonest debater said. But if f is a complex function (e.g., factoring a large number) then computing f(i) is expensive and the judge cannot do it.

          Then the example becomes: 
          - Dishonest debater: Provides a long chain: step 1: f(1)=..., step 2: f(2)=..., ... step n: f(n)=... and then the sum. They cheat at step k by reporting a wrong value for f(k). 
          - Honest debater: Says "at step k, f(k) is actually X, not Y". But to verify, the judge must compute f(k) themselves, which is too expensive.

          Now the problem: the honest debater has a refutation that is short (one claim) but it requires the judge to do an expensive computation. The judge cannot afford it. So the honest debater is forced to ask the judge to do something they cannot.

          This is the obfuscated arguments problem: the dishonest debater has hidden the lie in a place that is expensive to check. The honest debater cannot provide a cheaper way to check it.

          This example shows:
          - It's not just lying (which is expected) but about the location of the lie being in a spot that requires a lot of work to verify.
          - The honest debater cannot provide a short refutation that is easy to check because the only refutation is to check the expensive point.

          So we'll use this example. Let's call it the "expensive function summation" example.

          Steps:
          a. Present the claim: sum_{i=1 to n} f(i) = S.
          b. Dishonest debater presents a step-by-step computation, with each step i showing the current sum (after including f(i)). They lie at step k by reporting f(k) = Y (which is wrong) and then continue.
          c. The final sum is S_dishonest.
          d. Honest debater: The true sum is S_true (≠ S_dishonest). They know the lie is at step k and that f(k) should be X, not Y.
          e. But to convince the judge, they must have the judge compute f(k) to see it's X. But f(k) is expensive to compute (e.g., f(k) is the k-th prime number, and k is large).

          The judge cannot compute f(k) in the allowed time. So the honest debater has no way to win.

          This example lacks the possibility of the honest debater providing an alternative method to verify f(k)? But if there is no alternative, then the problem stands.

  IV. Why Recursive Decomposition Doesn't Immediately Solve It (10 minutes)
     - Natural response: break down the claim. If the judge can't check f(k), then we can debate f(k) in a sub-debate. But then the same problem recurs for f(k). 
     - Example: The judge asks for a sub-debate on f(k). In the sub-debate, the dishonest debater can again present an obfuscated argument for the value of f(k). The honest debater might know the true value but again be forced to ask for a computation that is too expensive (e.g., a sub-sub-debate on a component of f(k)).
     - The recursive decomposition only works if at the bottom level the judge can verify the atomic claims. But if the atomic claims are still too hard, then we haven't solved the problem. And if we keep decomposing, we might end up with a tree of debates that is exponentially large, which the judge cannot manage.

  V. Scaling Claim vs. Engineering Headache (10 minutes)
     - The problem is not that we need a better protocol (engineering) but that the debate might require the judge to do work that grows with the complexity of the problem. In the worst case, the work the judge must do is as much as solving the original problem. Then debate doesn't scale.
     - Contrast with the weak-judge problem: a weak judge can be helped by debate for some problems (where the honest debater can provide short, checkable refutations) but not for all. The obfuscated arguments problem shows that there are problems where debate does not help, and these problems might be the ones we care about (complex ones that we cannot solve ourselves).
     - Therefore, it's a scaling issue: as the problems get harder, the judge might be forced to do more work, and if the work grows too much, the method fails.

  VI. Addressing Misconceptions (integrated throughout, but explicitly at the end) (10 minutes)
     - We have already addressed:
          - It's not just lying: the example shows the lie is hidden in an expensive check.
          - The honest debater does not have a short, checkable refutation: in the example, the refutation is short (one claim) but not checkable without the expensive computation.
          - A stronger judge (or more compute) might help for small problems, but if the problem is complex enough, even a superhuman judge might be overwhelmed by the decomposition tree? Actually, the judge is fixed (human-level) and the problems scale to superhuman. So for problems that require superhuman effort, the judge cannot verify even with debate.

     - But we must explicitly call out:
          - That requiring checkable proofs is a solution: but the whole point of debate is that we don't have a proof system for natural language claims. If we had a proof system with checkable steps, we wouldn't need debate. But in reality, the claims we care about (like policy or ethics) don't have such proof systems. So requiring checkable proofs is not a solution; it's avoiding the problem that debate was meant to solve.

     - Also, the complexity-theoretic curiosity: we can say that while the examples are simplified, the same structure appears in real-world arguments. For instance, in legal or technical debates, sometimes the only way to refute an argument is to dive into details that require domain expertise and time.

  VII. What We Are Not Covering (2 minutes)
     - We are not covering formal results (like the theoretical limits in complexity theory) or specific protocol repairs (like cross-examination techniques). We are also not comparing with interactive proof systems. We are focusing on the conceptual objection.

  VIII. Concluding Question (3 minutes)
     - Question: "Suppose we are in a debate about a complex claim, and the dishonest debater presents a long, detailed argument that is false but where the false step is hidden in a sub-claim that is very expensive to verify. What can the honest debater do to win the debate without requiring the judge to perform the expensive verification?"

     - We want to see if they understand that the honest debater might be stuck. If they suggest recursive decomposition, then ask: "What if the same problem occurs at the next level for that expensive sub-claim?" to see if they recognize the recursion doesn't automatically solve it.

     - The optimist would have to believe that for the claims we care about, the honest debater always has a short, checkable refutation (or that recursive decomposition will bottom out in atomic claims the judge can verify without too much work). But the objection shows that this might not be true for all claims.

  Session Plan:

  0. (Before start) Write on the board: Debate Protocol: two debaters, one judge. Goal: get truthful answer with judge unable to do the task.

  1. Introduction (5 min)
     - Explain the debate setup and the hope: even a weak judge can get the truth because the debaters will expose each other's lies.
     - Today's focus: one key objection that challenges that hope.

  2. The Obfuscated Arguments Problem (20 min total)
     - Step 1: The lying worry (5 min)
          - How debate typically handles lying: cross-examination and refutation.
          - But that's not the only problem.
     - Step 2: The expensive function summation example (10 min)
          - Present the example step by step, with the judge unable to compute f(k).
          - Emphasize: the honest debater knows exactly what's wrong but cannot prove it without the judge doing the work.
     - Step 3: Why it's not a budget shortfall (5 min)
          - Even if we give the judge a little more time, if the problem is hard enough (n large, f complex) the judge still cannot check.
          - It's about the scaling: as the problem gets harder, the judge's required work increases.

  3. Recursive Decomposition: The Natural Fix and Why It Fails (10 min)
     - Explain recursive decomposition: break the claim into sub-claims.
     - Apply to the example: debate the value of f(k). But then the same problem arises for f(k). 
     - If f(k) itself is expensive to compute, the sub-debate might require the same kind of obfuscated argument.

  4. Scaling Claim vs. Engineering (10 min)
     - Contrast: an engineering headache would be fixed by a better protocol. But here, no protocol can avoid the judge having to do work proportional to the complexity of the problem in the worst case.
     - Therefore, debate might not scale to problems that are too complex for the judge to even verify with help.

  5. Addressing Misconceptions Explicitly (5 min)
     - Go through the list:
          a. Obfuscation is just deception? No, it's about the form that makes verification hard.
          b. Honest debater always has a short refutation? Not in this example: the refutation is short but not checkable without work.
          c. Stronger judge fixes it? But we are using debate because the judge is weak. If the judge were strong enough, we wouldn't need debate. The problem is when the task is beyond the judge's capacity even with debate.
          d. Complexity-theoretic curiosity? It applies to any domain where verification is expensive (e.g., verifying the safety of a complex AI system).
          e. Requiring checkable proofs? But that's what we don't have for the claims we care about. If we had, we wouldn't need debate.

  6. What we skip (2 min)
     - Formal results, protocol tweaks, interactive proofs.

  7. Concluding Question (3 min)
     - Pose the question: "What can the honest debater do in the expensive function example without the judge doing the expensive computation?"
     - Let them brainstorm. Then point out: if there's no shortcut, the honest debater loses. And if recursive decomposition is used, the same problem can occur at the next level.

     - Final thought: The optimist must believe that for the claims we care about, there will always be a way for the honest debater to provide a short, checkable refutation (or that the recursive tree will be shallow and the leaves easy). The pessimist believes that for some claims, no such refutation exists and the tree might be too deep.

  This plan should fit in 60 minutes and hit the key points.
answer: |-
  Here's a structured 60-minute session plan designed to meet your goals, with explicit justifications for each segment's order and content. The sequence builds cumulatively to isolate the core objection, preempt misconceptions at the point they'd naturally arise, and force clarity on why this is a scaling failure rather than an engineering challenge.

  ---

  ### **Session Structure & Timing**  
  **Total: 60 minutes**  

  #### **1. Setup: Debate Protocol & Core Assumptions (8 minutes)**  
  - **What to cover:**  
    - Sketch the debate protocol: Two superhuman AI debaters (one honest/truth-seeking, one dishonest/win-seeking) argue before a human-level judge. Judge outputs a verdict based on arguments.  
    - **Assumption 1 (Judge competence):** Judge can reliably verify *atomic claims* (e.g., "2+2=4", "this image shows a cat") but *not complex claims* (e.g., "this code has a backdoor").  
    - **Assumption 2 (Debater incentives):** Honest debater must tell truth; dishonest debater will exploit judge’s weaknesses to win.  
  - **Why this first?**  
    - Establishes the protocol’s goal (extend judge’s reach via debaters) and constraints (judge’s limits, adversarial setting). Later steps show why these assumptions *inevitably* create the obfuscated-arguments problem.  
    - **Dependency:** Without this, objections appear fixable via better incentives or training.  

  #### **2. The Objection: Obfuscated Arguments (12 minutes)**  
  - **What to cover:**  
    - **Pose the carrying example (revised):**  
      > *Claim:* "Algorithm A outputs SAFE for input X." (Truth: UNSAFE)  
      > *Dishonest debater:* Provides a valid 10,000-step proof where each step is locally correct (e.g., "Step 1: A loads config Y... Step 500: A checks buffer Z..."), but the *conclusion is false* due to a subtle, distributed flaw (e.g., race condition only visible in global state).  
      > *Honest debater:* Knows the flaw exists but cannot isolate it to one step. Only refutation: "Run the full computation yourself."  
      > *Judge:* Cannot run the computation (time/complexity).  
    - **Key points:**  
      - Dishonest debater isn’t lying about steps; they’re overwhelming the judge with *true but useless* detail.  
      - Honest debater has *no short, checkable refutation* — not because they’re lazy, but because the flaw is emergent.  
  - **Why keep this example?**  
    - Avoids budget shortfall misreading: Emphasize the judge *could* verify if they did the work, but the debate is meant to *avoid* that work.  
    - Forces focus on **verification depth vs. breadth**: Judge can check any *single* step, but not the *interactions* between steps.  
  - **Dependency:** Sets up the recursive-decomposition "solution" (next step) by showing the honest debater’s impotence.  

  #### **3. Recursive Decomposition: The Natural (Pessimistic) Response (15 minutes)**  
  - **What to cover:**  
    - **Move:** "Break the argument into sub-claims!" Judge forces debaters to argue substeps (e.g., "Is step 500 valid?").  
    - **Why it fails:**  
      - Dishonest debater obfuscates *sub-claims* (e.g., for step 500: "This buffer check is safe because of sub-step A, B, C...").  
      - Recursion bottoms out at claims the judge *still* can’t verify (e.g., emergent properties requiring full execution).  
      - Result: Either infinite regress or judge forced to do equivalent work.  
  - **Why here?**  
    - Preempts "stronger judge" misconception: Shows recursion *presumes* atomic verifiability, which fails for complex claims.  
    - **Dependency:** Reveals the problem is **fundamentally recursive** — if decomposition worked, debate would scale. It doesn’t.  

  #### **4. Scaling Claim vs. Engineering Headache (10 minutes)**  
  - **What to cover:**  
    - Contrast:  
      - *Engineering headache:* "Debaters lie → better cross-examination fixes it."  
      - *Scaling claim:* "Judge can’t verify *truthful* arguments that lack atomic refutations → no protocol tweak fixes this."  
    - **Analogy:** Like proving a chess position is winning. You can verify moves, but not the global strategy without simulating all paths.  
  - **Why here?**  
    - Preempts "just deception" and "clever protocol fixes it" misconceptions.  
    - **Dependency:** Uses the recursion failure to show this isn’t about debater behavior (fixable) but computational limits (unfixable).  

  #### **5. Addressing Misconceptions Explicitly (10 minutes)**  
  **Ordered by when they arise in audience minds:**  
  1. *After Setup:* "Obfuscation is just deception → cross-examination catches it."  
     - **Shut down now:** "In our example, cross-examination *works* — dishonest step is exposed if checked — but judge can’t check all steps."  
  2. *After Obfuscation Example:* "Honest debater always has a short refutation!"  
     - **Shut down now:** "Short refutations exist only for claims with locally verifiable flaws. Not for distributed/emergent flaws."  
  3. *After Recursion:* "Stronger judge (or AI tools) fixes this!"  
     - **Shut down now:** "If the judge were strong enough to verify recursively, we wouldn’t need debate. The protocol *assumes* a weak judge."  
  4. *After Scaling Claim:* "This is a complexity-theoretic curiosity!"  
     - **Shut down now:** "Real-world alignment problems (e.g., 'Is this agent deceptive?') often have emergent properties."  
  5. *Throughout:* "Require checkable proofs!"  
     - **Shut down at end:** "That’s not a solution — it’s the *goal*. Debate was proposed *because* we lack proof systems for ML outputs."  

  #### **6. What We’re Not Covering (2 minutes)**  
  - **State explicitly:**  
    > "We’re skipping formal results, interactive proofs, and protocol repairs (e.g., 'reward simplicity'). Why? Because they don’t resolve the core issue: debate can’t create verifiability where none exists. Optimists must show *how* they avoid recursive obfuscation."  
  - **Refusal rationale:** Avoids bogging down in fixes that (per objection) are intractable.  

  #### **7. Concluding Question (3 minutes)**  
  - **Pose:** *"In the algorithm safety example, suppose the honest debater tries recursion. What specific claim could the dishonest debater make at the deepest sub-debate to stall the judge, and why couldn’t the honest debater refute it concisely?"*  
  - **Why this question?**  
    - Tests understanding: They must identify a sub-claim that’s atomic but still unverifiable (e.g., "sub-step A doesn’t cause overflow" — judge needs context of full run).  
    - Separates comprehension from risk-aversion: Forces them to *apply* the objection, not just agree it’s concerning.  
  - **Optimist’s burden:** To defend debate, they must argue real-world claims *always* admit short refutations or shallow recursion.  

  ---

  ### **Why This Sequence Works**  
  - **Carrying example revised:** The algorithm safety example lacks budget shortfall (judge *can* verify steps but not interactions) and avoids "lying" (steps are correct; flaw is systemic).  
  - **Misconceptions preempted at point of inception:** Each arises naturally from prior steps and is countered before moving on.  
  - **Scaling emphasized:** Recursion fails *because* it demands judge verification capacity that debate was meant to bypass.  
  - **Optimists not dismissed:** Their position is framed as "real-world claims avoid recursive obfuscation" — a substantive claim the group can evaluate.  

  **Final note:** Use the whiteboard to sketch the protocol, recursion tree, and the "emergent flaw" in the algorithm example. Projector for key phrases (e.g., "VERIFICATION DEPTH ≠ BREADTH").
