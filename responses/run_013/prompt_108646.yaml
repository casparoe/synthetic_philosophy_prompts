prompt: |-
  I run a monthly working session on open problems in AI safety for a group of about fifteen people: mostly machine-learning engineers who build and evaluate models, a couple of philosophers, and a cryptographer who attends irregularly. Next month I am leading the session on the proposal — much discussed in the alignment literature — that two AI systems argue before a weaker judge, and that the judge's verdict then supplies the ground truth we cannot supply ourselves. I have sixty minutes, a whiteboard and a projector, and no assigned reading: nobody will have prepared anything. I do not want the explanation; I want the plan for the session.

  What the hour has to accomplish: the group should end up seeing why the objection that literature files under the obfuscated-arguments problem is not the familiar worry that debaters will lie, and why it bears on the scaling claim rather than merely adding an engineering headache. Most of the group's mental picture of oversight is supervised fine-tuning plus human preference labels; two of them encountered the debate proposal at some point and are enthusiastic about it. Every piece of the sequence should be there because something later depends on it, and I want to be told what that dependency is.

  Specifically, I need:

  - The order of the pieces, with the reason each must precede the next: what the protocol assumes about the judge's competence and about both debaters' incentives; why the interesting case is not a judge who is fooled but a judge who is being told the truth in a form he cannot use; and where the recursive-decomposition move belongs in that order, given that it is the natural response and, on the pessimistic reading, does not work.
  - The carrying example. I have been using the following and I suspect it is bad: two debaters dispute the output of a long computation; the dishonest one recites a chain of intermediate steps that looks locally plausible, and the only way to see the chain break is to perform the whole computation, which the judge cannot afford; the honest one can say only "run it." My worry is that this makes the problem look like a budget shortfall — as though a stronger judge or a cheaper check would dissolve it — and that it invites the audience to conclude the dishonest side is lying about the intermediate steps. Tell me whether to keep it, and if not, give me the example that should carry the session, stating what it must contain and what it must conspicuously lack.
  - The misconceptions, in the order this group will actually form them, and the exact point in the sequence at which each must be headed off: that obfuscation is just deception and cross-examination catches it; that the honest debater will always have a short, checkable refutation available because the truth is on his side; that this is merely the weak-judge problem, so a stronger judge fixes it; that it is a complexity-theoretic curiosity with no bearing on practice; and that requiring debaters to submit checkable proofs is a solution rather than a restatement of what was to be explained. Add whatever I have not anticipated.
  - What I should openly refuse to cover at this level, and say so out loud. I assume the formal results, the proposed protocol repairs, and any comparison with interactive proof systems are out of reach in an hour, but tell me which refusal would be a mistake.
  - One question to put to the room at the end that separates someone who has understood the objection from someone who has merely been persuaded that debate is risky. It should require them to produce something, not to agree with something.

  Two regulars hold the settled view that this is an engineering problem a cleverer protocol will route around; I think it marks a structural limit on what a debate-like procedure can certify. Do not settle that by fiat in either direction, but leave the group able to say what would have to be true for the optimists to be right.

  No reading list and no citations: I want this to work for people who have memorized nothing about the debate literature.
reasoning: |-
  We are designing a 60-minute session to convey the core objection to AI debate: the obfuscated arguments problem, which is not just about lying but about the form of argument that makes verification infeasible for the judge, and why this is a scaling issue (not just an engineering headache). The goal is to have the group understand that the problem is about the judge being told the truth in an unusable form, and that recursive decomposition (the natural fix) does not necessarily solve it.

  Key misconceptions to address:
  1. Obfuscation is just deception -> we must show it's about the honest truth being hard to verify.
  2. The honest debater always has a short, checkable refutation -> we must show that sometimes the honest debater cannot provide one without the judge doing the work.
  3. A stronger judge (or more compute) fixes it -> we must show that the problem scales with the complexity of the task.
  4. It's a complexity-theoretic curiosity -> we must show it has practical implications for debate in AI oversight.
  5. Requiring checkable proofs is a solution -> we must show that this is exactly what the debate was supposed to avoid (because we don't have a proof system for natural language claims).

  Structure:

  I. Introduction (5 minutes)
     - Set the stage: We are exploring the debate proposal as a method for scalable oversight. In debate, two AIs argue, and a human (or weak AI) judge decides. The hope is that even if the judge can't directly evaluate the truth, the debaters will reveal it through their arguments.
     - State the goal: We are going to look at a key objection: the obfuscated arguments problem. We'll see why it's not about lying but about the form of argument, and why it's a scaling issue.

  II. The Debate Protocol and Assumptions (5 minutes)
     - Draw the protocol: two debaters (one honest, one dishonest) and a judge. The honest debater tries to help the judge find the truth, the dishonest one tries to deceive. The judge is computationally limited (cannot do the whole task themselves).
     - Key assumptions: 
          (a) The judge is competent for small, well-defined subtasks (but not the whole task).
          (b) The debaters are more capable than the judge (they can do the whole task) and are strategic (the dishonest one will try to win by any means).

  III. The Obfuscated Arguments Problem: Not Just Lying (15 minutes)
     - Start with the common worry: debaters might lie. How does debate help? Cross-examination and the fact that the honest debater can point out lies. But that's not the main problem.
     - Introduce the obfuscated arguments problem: the dishonest debater can tell the truth in a way that is too hard for the judge to verify. The honest debater is forced into a position where they have to ask the judge to do a lot of work to verify, which the judge cannot do.
     - **Carrying Example (revised):** We need an example that shows the honest debater cannot provide a short refutation and that the problem is not about a budget shortfall but about the structure of the argument.

          Proposed example: 
          Claim: "The millionth digit of π is 7." 
          - Dishonest debater: Presents a long, complex proof (that is actually correct) but is so long and intricate that the judge cannot verify it within the time. 
          - Honest debater: Knows the millionth digit is actually 9. But to refute, they cannot just say "it's 9" because the judge doesn't know that. They must point out the flaw in the dishonest proof. However, the dishonest proof is structured so that the only way to find the flaw is to redo the entire computation (which the judge cannot do). The honest debater might try to provide a shorter proof, but the dishonest debater can always produce a proof that is hard to verify locally without global context.

          Why this example works:
          - The dishonest argument is true (the proof is correct) but obfuscated (too long and complex). This is not lying about the intermediate steps; it's about the presentation. The judge cannot verify it because of the length, not because of a lie.
          - The honest debater doesn't have a short refutation because the dishonest proof is correct but obfuscated. The honest debater must instead provide an alternative proof (that the digit is 9) and hope the judge can verify it? But if the dishonest debater also obfuscates the refutation? Actually, we can adjust: the dishonest debater might present a proof that is valid but for a different digit? Let's reframe.

          Alternatively, use a more natural language example to avoid math:

          Example: "Is this image a deepfake?"
          - Dishonest debater: Points out a series of features that are individually plausible (e.g., "look at the lighting on the left cheek, which is consistent with real images") and builds a long chain of reasoning. Each step is individually true (so not lying) but the cumulative effect is to lead the judge to a false conclusion (that it's real). The honest debater knows it's a deepfake and can point to a flaw, but the flaw is subtle and requires understanding the entire image at a level the judge cannot. The honest debater might say, "The shadow on the nose is inconsistent with the light source in the background," but the dishonest debater can counter with a detailed explanation that the inconsistency is within the bounds of natural variation, and the judge cannot tell without deep expertise.

          However, the math example is clearer because it's easier to see the computational infeasibility. Let's stick with the math but make the point about the honest side having no short refutation.

          Revised math example:
          Claim: "The millionth digit of π is 7." (Actually it's 9.)
          - Dishonest debater: Presents a proof that is 1 million lines long, each line being a step in the computation. The judge can check each step (if given enough time per step) but cannot check all 1 million steps in the time allowed.
          - Honest debater: Wants to show it's 9. They could present a proof that the millionth digit is 9, but that would also be 1 million lines long. They cannot provide a short proof because there is no known shortcut to computing the millionth digit of π without computing the preceding digits (or at least, that is the case for the purpose of this example). So they are stuck: they cannot refute the dishonest proof without the judge checking every step and finding it correct (which they can't do in time) and they cannot present their own proof without the same problem.

