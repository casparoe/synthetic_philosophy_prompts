  For each item: First will address the memorial dilemma (highest cost: sacrificing either truth or genre expectations). Second will handle the authority paradox (rejecting authority while learning from particulars). Third will resolve the imitation tension (admiring the unimitable). Fourth will consider the thinness of extracted lessons. Fifth will tackle the moral learning method conflict.

