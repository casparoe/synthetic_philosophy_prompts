  The convictions present several tensions: (1) Particulars over rules in moral learning conflicts with (6) rejecting authority-based ethics; (2) Truthful portrayal with flaws conflicts with (3) memorial genre's idealizing nature; (4) Imitation of exemplars conflicts with (5) admiring un-imitable lives. The immediate practical conflict is between conviction 2 (truth-telling) and conviction 3 (genre conventions).

