  Hmm, this is a fascinating and nuanced request from a philosophy professor teaching a high-level seminar on consent. The user describes a recurring debate in their class between two major perspectives: the "mental-state" view (consent as an internal attitude) and the "communicative act" view (consent as interpersonal transaction). They want me to craft a joint statement that would emerge from an adversarial collaboration between these camps.

  The user is clearly deeply familiar with this philosophical debate and wants pedagogical tools that won't oversimplify but will help students engage productively with the tension. Key things I notice: they emphasize honesty about where disagreements are substantive versus verbal, they want the actual state of the field represented (not false consensus), and they specifically mention five hypothetical cases that should inform the analysis.

  This requires careful balancing. I need to:
  - First extract the deepest possible agreements between the camps (even if "shallow" as the user says)
  - Then articulate the core disagreements in each side's own terms
  - Structure the "cruxes" as testable sub-questions with opposing predictions
  - Map the five test cases onto these cruxes
  - Flag where disagreements might be terminological rather than substantive
  - Maintain academic rigor while keeping it seminar-ready

  The professor's frustration with repetitive debates suggests they want to move students toward meta-understanding - seeing why the disagreement persists and what would actually resolve it. The adversarial collaboration framework is perfect for this.

  I should probably structure the response in three parts as requested: agreements, disagreements, and cruxes with cases. For the agreements section, I'll focus on shared foundations like consent's moral function (enabling permissible actions that would otherwise violate autonomy) and minimal validity conditions (lack of coercion/deception). For disagreements, I'll use each camp's distinctive phrasing - e.g. mental-state side emphasizing "normative force comes from will" versus communicative side stressing "relational repair requires uptake."

  The cruxes section is most pedagogically valuable. For each test case:
  - Silent but willing partner tests whether communication is constitutive
  - Enthusiastic "yes" with inner reluctance probes if performative acts can create obligations
  - Deception cases examine the role of informational context
  - Coercion-induced willingness challenges whether authenticity overrides voluntariness
  - Intoxication interrogates competence conditions

  Where I see verbal disputes (e.g. over "what consent IS"), I'll explicitly note that. The table format for cruxes will help students see the predictive differences clearly. Throughout, I'll maintain the professor's requested tone: no false resolutions, honoring the "live disagreement" in the literature. This approach should give students tools to understand why this debate persists and how to engage it more productively.
answer: |-
  Below is a draft joint statement for your seminar, structured as requested. It reflects a rigorous "adversarial collaboration" between the mental-state (MS) and communicative-act (CA) camps, with explicit markers for shallow agreements, core disagreements phrased neutrally, testable cruxes, and applications to your seed cases. It preserves live controversies while scaffolding productive engagement.

  ---

  ### **Joint Statement: Foundations of Agreement**  
  *(Shallow agreements noted; both camps endorse these at minimum)*  
  1. **Moral Function**: Consent transforms impermissible acts into permissible ones by altering normative relations between individuals (e.g., trespass to welcome entry).  
  2. **Necessary Conditions for Validity**: Consent is invalid if:  
     - Obtained through coercion (threats of wrongful harm),  
     - Exploiting severe deception (misrepresentation of core identity/act),  
     - Given by agents lacking minimal competence (e.g., severe cognitive impairment, unconsciousness).  
  3. **Evidentiary Role**: Observable behavior (words, gestures) is typically the *best evidence* for inferring inner states in practice.  
  4. **Relational Harm**: Non-consensual acts inflict distinctive moral harm by violating autonomy-as-relation, not just autonomy-as-will.  
  *Shallow Agreement Note*: Both sides accept these points but interpret their *moral grounding* differently (MS: will as primary; CA: communication as primary).  

  ---

  ### **Core Points of Irreconcilable Disagreement**  
  *(Phrased in each camp’s preferred terms; neither caricatured)*  
  1. **Mental-State Camp (MS)**:  
     > "Consent’s *normative power* derives solely from the consenter’s actual mental state of willingness. Communication matters only as a reliable indicator (or occasional constitutive trigger) of that state. A hidden 'yes' in the heart morally permits; a fraudulent 'yes' on the lips does not."  
  2. **Communicative-Act Camp (CA)**:  
     > "Consent is fundamentally a *relational practice* that repairs the moral standing of another’s act. It requires successful uptake: a communicated attitude received by the relevant agent. A private willingness does nothing interpersonally; a clear 'yes' can obligate, even with imperfect inner alignment, because it publicly authorizes action."  

  ---

  ### **Cruxes: Testable Disagreements with Predictions & Cases**  
  *(Settling any crux would resolve a key branch of the debate; predictions show divergence)*  

  | Crux Question                                                                 | MS Prediction                                                                 | CA Prediction                                                                 | Relevant Seed Case(s)                                     | Field Consensus?               |  
  |-------------------------------------------------------------------------------|-------------------------------------------------------------------------------|-------------------------------------------------------------------------------|----------------------------------------------------------|--------------------------------|  
  | **1. Can unexpressed willingness *alone* make an act permissible?**           | **Yes**: Morally transforms the act (e.g., silent but willing partner isn’t wronged). | **No**: No moral transformation occurs without communication (act remains violation). | (a) Silent but willing partner                          | **Contested**                  |  
  | **2. Can a clear, voluntary 'yes' *obligate* when inner willingness is absent?** | **No**: The speaker may be blameless, but the act is impermissible (moral wrong occurs). | **Yes**: Recipient is permitted (and may be obligated) to proceed; inner lack is a separate harm. | (b) Enthusiastic "yes" with inner reluctance             | **Contested**                  |  
  | **3. Does validity require accurate understanding of *context* (not just act/agent)?** | **No**: Willingness is key; deception invalidates only if it vitiates the will itself. | **Yes**: Consent is context-embedded; deception about dealbreakers voids validity (no "informed" consent). | (c) Deception about a dealbreaker                      | **Settled: CA View Dominates**<sup>†</sup> |  
  | **4. Can coercion produce *valid* consent if genuine willingness results?**   | **Yes**: If will is truly transformed (e.g., Stockholm Syndrome), consent is valid. | **No**: Coercion voids consent structurally; "willingness" under threat is adaptive, not autonomous. | (d) Hostage who "comes to want it"                     | **Settled: MS View Rejected**<sup>‡</sup> |  
  | **5. Does intoxication *inherently* negate competence?**                      | **No**: Validity depends on *actual* willingness and understanding, not intoxication per se. | **Cautious No**: Competence is scalar; intoxication risks undermining communication *and* will. | (e) Intoxicated but factually willing person           | **Contested (but CA leans pragmatic)** |  

  <sup>†</sup> *Field Note*: Most theorists (including some MS) agree deception about fundamental features of the act/agent invalidates consent (e.g., Dougherty, O’Neill). Rejection of "will-only" view here.  
  <sup>‡</sup> *Field Note*: Coercion is widely seen as negating consent *regardless* of resulting mental state (e.g., Wertheimer, Hurd). "Coerced consent" is an oxymoron in law/philosophy.  

  ---

  ### **Diagnosing Verbal vs. Substantive Disagreements**  
  1. **"What consent IS"**:  
     - Potentially verbal. MS defines consent as a *mental state*; CA as a *communicative act*. This is a metaphysical disagreement with practical implications.  
     - **Why it matters**: If consent is *defined* as communication, unexpressed willingness isn’t "consent" (CA wins by stipulation). MS rejects this framing as question-begging.  
  2. **"Moral Magic Source"**:  
     - **Substantive**. MS locates power in the individual’s will; CA in the interpersonal exchange. This shapes all applied disagreements (e.g., Case b).  
  3. **"Scope of Invalidating Conditions"**:  
     - **Substantive but narrowing**. Both agree coercion/deception/incompetence invalidate, but MS restricts this to will-subversion, while CA includes communicative defects (e.g., misunderstanding).  

  ---

  ### **How to Use This in Seminar**  
  1. **Start with agreements**: Ground debate in shared goals (protecting autonomy, enabling intimacy/cooperation).  
  2. **Map disputes to cruxes**: Have students articulate positions using the table (e.g., "On Crux 1, I’m MS because...").  
  3. **Test with cases**: Apply seed cases to specific cruxes (e.g., Case (b) tests Crux 2; Case (d) tests Crux 4).  
  4. **Identify shallow consensus**: Note where agreement masks deeper splits (e.g., "We all say coercion voids consent, but *why*?").  
  5. **Flag settled issues**: Stress that deception (Crux 3) and coercion (Crux 4) have field-wide norms to prevent moral hazard.  

  This framework avoids false harmony by naming irreconcilable premises ("Is consent in the heart or the handshake?") while making disagreements tractable through testable cruxes. It honors the professor’s directive: the messiness is preserved, but now it’s navigable.  

  For next steps: Consider assigning teams to draft "amicus briefs" for each camp on one crux using a seed case, then have them design an experiment/thought experiment that could resolve it. This forces engagement beyond rhetoric.
