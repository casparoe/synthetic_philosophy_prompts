  ### Position B: Arrangements of this kind can be genuine chance setups, so the Principal Principle as usually stated is false or incomplete.

  #### Statement of the Principal Principle
  I will state the Principal Principle in my own terms to ensure clarity before applying it to the cases. The Principal Principle (PP) is a normative guideline for rational credences (degrees of belief) in light of objective chances. Objective chances are physical probabilities that describe the tendency of events to occur, independent of an agent's knowledge, except where specified by the setup.

  - **Unconditional form**: If a rational agent's total evidence, consisting entirely of matters of fact up to the present, entails that the objective chance of event E is p, then the agent's credence in E should be p. This form assumes that the evidence fully determines the chance, and the agent has no other relevant information about E.
    
  - **Conditional form**: For a rational agent, the conditional credence in E, given that the objective chance of E is p and no other inadmissible evidence, should be p. This form allows the agent to condition on the chance proposition itself, even if other evidence is present.

  In both forms, "inadmissible evidence" typically refers to information about future outcomes that bypasses the chance, but in this case, the setup itself is common knowledge and part of the present evidence, so it is admissible.

  #### Analysis of the First Version (Continuous f: f(x) = 0.5 + x/2)
  In this version, the function f is continuous, mapping credence x to 0.5 + x/2. The device scans A's brain, reads her credence x as a physical state, and sets the chance of E to f(x). A knows the entire setup, including f and her own credence, so she knows the chance is f(x). Applying the unconditional PP, A should set her credence x equal to the chance, leading to the equation x = f(x) = 0.5 + x/2.

  Solving this equation:
  - x = 0.5 + x/2
  - x - x/2 = 0.5
  - x/2 = 0.5
  - x = 1

  At x = 1, f(1) = 0.5 + 0.5 = 1, so the chance is 1. A's credence of 1 equals the chance, satisfying PP. The conditional PP also holds: if A conditions on the chance being 1, her credence in E should be 1, which matches her credence given the evidence.

  This is a consistent fixed point. A can rationally have credence 1, and the setup is coherent. Here, the chance setup is genuine because it produces a well-defined, self-consistent outcome under PP. The continuous function allows for a solution, and PP emerges intact for this case without issue.

  #### Analysis of the Second Version (Discontinuous f: f(x) = 1 if x < 1, f(x) = 0 if x = 1)
  In this version, f is discontinuous: it returns 1 for credences strictly below 1 and 0 for a credence of exactly 1. A knows the setup and her credence x, so she knows the chance is f(x). Applying the unconditional PP, A should set her credence x equal to the chance, leading to x = f(x).

  However, no credence x satisfies this equation:
  - If A has credence x < 1, then f(x) = 1, so PP requires x = 1. But x < 1 contradicts x = 1.
  - If A has credence x = 1, then f(x) = 0, so PP requires x = 0. But x = 1 contradicts x = 0.

  Thus, there is no consistent credence. The conditional PP also fails. For example:
  - If A conditions on the chance being 1, this implies x < 1 (from f), so her conditional credence in E given chance=1 should be 1. But if she sets credence to 1, the chance becomes 0 (since x=1 implies f(x)=0), undermining the condition.
  - If she conditions on chance=0, this requires x=1, and her credence in E should be 0. But if she sets credence to 0 (x<1), the chance becomes 1, again causing contradiction.

  No coherent credence assignment satisfies PP, showing that PP cannot be followed. Nevertheless, the chance setup is genuine: the device physically reads A's brain state and sets a chance based on it, which is a matter of fact in the world. On a Humean best-system view, this could be part of the laws if it simplifies and informs the mosaic, even if it leads to epistemic inconsistency.

  #### Why Position B? Addressing the Genuine Nature of Chance and the Failure of PP
  I argue that such setups can be genuine chance setups because the chance is a physical property set by the device, based on a physical brain state scan, and this arrangement is part of the common-knowledge physical mosaic. On a Humean best-system account of chance, laws and chances supervene on the total physical state, including agents' brain states (as part of the mosaic). There is no barrier to f being a lawlike function in the best system if it provides a compact description of events, even if it references credences. For instance, in the first version, it works smoothly; in the second, it might still be a simple, strong law (e.g., "chance is 1 unless credence is exactly 1, then 0").

  However, PP fails in the second version because it demands a consistency that is impossible when no fixed point exists. PP assumes that chances can always guide rational credences without self-reference issues, but here the chance directly depends on the very credence it aims to guide. This shows that PP, as usually stated, is incomplete: it does not account for cases where the chance is a function of the agent's credence in a self-referential loop with no consistent equilibrium.

  **Restriction to repair PP**: The Principal Principle should be restricted to cases where the objective chance does not depend functionally on the agent's current credence about the same event in a way that precludes a fixed point. Formally, PP applies only if the chance-setting process allows for a credence x such that x = f(x), or more broadly, if the chance is "exogenous" to the agent's credence (e.g., based solely on non-doxastic facts).

  - **What this costs**: This restriction reduces the universality of PP. It admits that in some genuine chance setups (like the discontinuous case), rationality might be unattainable because no credence satisfies PP. This is counterintuitive, as we expect chances to always be guidable. It also introduces complexity: agents must assess whether the chance setup permits consistency before applying PP, which may not always be feasible. Furthermore, the conditional form of PP is not a full solution, as it also fails under self-reference (as shown). The restriction salvages PP for cases with fixed points (like the continuous version) but at the cost of limiting its scope.

  #### Addressing Position A (the Rejected Position)
  Position A holds that no such arrangement is a genuine chance setup, so PP remains untouched. The strongest version of Position A argues that genuine chances must be independent of the credences of the agents subject to them, serving as an "objective guide" that is not polluted by self-reference. This might be defended by claiming that chances should supervene on non-doxastic physical facts (e.g., initial conditions and laws not involving beliefs) to fulfill their role in guiding rational belief.

  However, this is challenged by the Humean best-system reply: on a metaphysical view where chances are defined by the best system summarizing the mosaic, agents' credences (as physical brain states) are part of that mosaic and can legitimately figure in the laws. Excluding them a priori is unmotivated and ad hoc. In the continuous case, the setup works with PP, suggesting it could be genuine. Position A might respond that circular dependence undermines the "objectivity" of chance, but the Humean can retort that objectivity is derived from the mosaic, not from being belief-independent. Position A must explain why a physical state (the credence reading) cannot contribute to chance, and I find no compelling reason beyond preserving PP, which is question-begging. The continuous case shows that self-referential chances can be consistent, so Position A overgeneralizes by rejecting all such setups.

  #### Claim About Credences and Load-Bearing Work
  Credences are both normative and physical states, and this dual nature is crucial here. Normatively, a credence is what an agent ought to believe given their evidence; it is a prescription for rational degrees of belief. Physically, it is realized as a brain state that can be measured (e.g., via neural activity patterns). The device reads the physical state, which is assumed to perfectly correlate with the normative state under idealizations. This physical reading then sets the chance.

  The load-bearing claim is that **credences are physical states that can directly influence the world (e.g., through the chance mirror), but they are also normative targets that must respond to evidence, including chances.** In consistent setups (continuous f), the physical and normative align at a fixed point. In inconsistent setups (discontinuous f), the normative demand (set credence to chance) conflicts with the physical state (which determines the chance), creating an inescapable loop. The failure in the discontinuous case arises because the fixed-point requirement for normative consistency is not met, not because the setup is metaphysically impossible. This distinction allows the chance to be genuine (physical) while PP fails (normative).

  #### Dependence on Idealizations
  The puzzle depends on several idealizations:
  - **Exact self-knowledge of credence**: A knows her credence x precisely.
  - **Perfectly reliable scanner**: The device reads the physical state exactly, with no error.
  - **Chance fixed at the same instant as the credence**: The scan and chance-setting are simultaneous, with no time for credence adjustment.

  If these are relaxed, the argument largely survives but becomes less sharp:
  - **With imperfect self-knowledge**: A might have a credence range. In the continuous case, she could converge to x=1 through updating. In the discontinuous case, beliefs might oscillate (e.g., credence near 1 leads to high chance, pulling credence up, but at exactly 1, chance drops, pulling it down), preventing stability but avoiding strict contradiction.
  - **With scanner error**: Noise could introduce randomness, making the chance less dependent on exact credence. In the continuous case, consistency might be approximate; in discontinuous, contradictions may be rare or resolvable.
  - **With time delay**: If chance is set after a delay, A could update her credence based on the new chance, potentially reaching equilibrium in continuous case or chaos in discontinuous.

  The conceptual core—that self-referential chances can challenge PP—remains, as the ideal case reveals a boundary where rationality breaks. Relaxations show that real-world imprecisions might mask the issue, but the normative problem persists for idealized rationality.

  #### Hardest Objection and Response
  **Hardest objection to Position B**: "If such setups are genuine chances, but PP cannot be satisfied in some cases (like the discontinuous one), this implies that rationality is impossible in those worlds. But rationality should be possible in any world; a theory that allows rational agents to be 'trapped' by self-reference is flawed. Moreover, on Humean grounds, if the best system includes this chance law, it must be usable for guidance, yet PP fails, contradicting the motivation for Humean chance."

  **Response**: This objection highlights a real cost: PP's restriction admits worlds where rational agency is infeasible due to self-reference. However, this is not a flaw in Position B but a feature of reality—some physical setups may be epistemically hostile. Rationality requires consistency, and if the world imposes inconsistency, rationality cannot be achieved. For Humeanism, the best system might include such laws if they are simple and informative, but "usability" for belief guidance is not a requirement for being a chance; it is a separate normative ideal. In cases with no fixed point, the chance is still genuine, but agents cannot align their credences with it. The reply is that metaphysics (what chance is) and epistemology (how to be rational) can come apart, and PP is only a normative tool when the world cooperates. To fully resolve this, we need a theory of "rationality under self-reference" that might abandon PP or adopt weaker norms, but that is beyond the current scope. Here, the restriction to PP is the best repair.
