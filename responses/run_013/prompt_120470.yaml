  For each objection, the user needs a concise two-minute response. For the psychophysicist, concede that matching experiments are valid but argue they answer a different question—one about ability rather than presupposition. The soft spot here is admitting that their methods work for the sub-questions, which might make the original critique seem less impactful.

  For the developmental researcher, acknowledge the cleverness of infant studies but highlight the assumption that infants have pre-existing cross-modal abilities. The soft spot is not having a direct refutation, just pointing out the assumption.

  The Kantian response should clarify that the critique is about empirical testability, not the nature of space itself. The soft spot is sidestepping the deeper philosophical debate.

