  First, I need to anticipate the main objections. The psychophysicists will likely argue that their cross-modal matching experiments already answer the question. The developmental researchers might point to infant studies as evidence that the answer is obviously testable. Philosophers, especially the empiricist and Kantian, will have deeper theoretical objections. The empiricist might say the user is overcomplicating a straightforward issue, while the Kantian could dismiss the critique as irrelevant since space is a priori.

