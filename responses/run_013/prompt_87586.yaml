  First, I need to recall Leibniz's argument in the Monadology. The key point is that for Leibniz, each monad is unique because it contains the entire universe from its perspective. That internal difference comes from its perceptions and appetitions. So, even if two things look identical externally, their internal states must differ. 

  The user is confused about why this is necessary. Leibniz ties it to God's creation process. God doesn't act arbitrarily; everything has a sufficient reason. Creating two identical things would be without reason, which violates the Principle of Sufficient Reason (PSR). So, the necessity stems from PSR, not just how things turned out.

  Now, the intrinsic denomination part. Leibniz uses this to handle relational properties. If relations are grounded in intrinsic properties, then relational differences imply intrinsic ones. For example, the spheres' positions might be relational, but those relations must be based on something intrinsic. 

  Looking at Black's spheres. The user mentions they're identical in all intrinsic properties, symmetrically arranged. Black claims they're indiscernible. But Leibniz might argue that their relational properties (like distance from each other) are rooted in intrinsic denominations. Each sphere's relation to the other is part of its identity. 

  But if the spheres are truly identical and symmetric, do they have any intrinsic differences? Here's the challenge. If their only properties are relational, like distance, but those relations don't supervene on intrinsic properties, Leibniz might say that's impossible. Relations must be founded on intrinsic denominations. So, the spheres must have some intrinsic difference that grounds their relational positions.

  Wait, but in Black's setup, the spheres are symmetric. So their relations are mutual. That's where the problem arises. Leibniz could respond by denying that such symmetry is possible without intrinsic differences. Or he might say that each monad's perspective makes them unique, but Black's spheres aren't monads; they're material objects. So maybe Leibniz's metaphysics applies differently to monads vs. composites.

  The user also asks if falling back on relational differences changes the subject. Leibniz might argue that relational properties are still part of an entity's identity if grounded intrinsically. But Black would counter that relations without intrinsic grounding don't individuate. 

  Self-critique: I might be overemphasizing PSR. Is Leibniz's necessity solely from PSR? Also, monads are simple, but Black's spheres are composite. If Leibniz's PII applies to substances (monads), maybe composites can be indiscernible. But Leibniz could extend it to composites via their constituent monads. 

  Evidence that could change my mind: If Leibniz explicitly allows for symmetric universes or admits that relations without intrinsic bases can individuate, but he doesn't. His rejection of external relations suggests he'd deny Black's scenario. 

  In conclusion, Leibniz's necessity comes from PSR and the nature of substances. Against Black, he'd likely argue that relational differences imply intrinsic foundations or that symmetric indiscernibles violate PSR. But if Black's scenario is coherent, Leibniz might need to concede for composites, though not for monads.
answer: |-
  Let's crack Leibniz open. Here’s the passage (Monadology §9):  
  *"It is not true that two substances may be exactly alike and differ only numerically, solo numero, and that what St. Thomas says on this point regarding angels and intelligences (quod ibi omne individuum sit species infima) is true of all substances, provided that the specific difference is understood as geometers understand it in the case of figures."*  
  And §8 clarifies: *"Monads must have some qualities, otherwise they would not even be beings."*  

  **Step 1: Parsing Leibniz’s Claim**  
  Leibniz asserts: **No two distinct substances (monads) can be qualitatively identical.** If two things *exist*, there *must* be some qualitative difference between them—not just numerical distinctness ("this one" vs. "that one"). The difference must be:  
  - **Internal**: Rooted in their intrinsic properties (e.g., perceptions, appetitions for monads).  
  - **OR founded on an intrinsic denomination**: Grounded in non-relational properties, even if it manifests as a relational difference (e.g., "being the sphere 3 meters from *this* point" depends on intrinsic spatial properties).  

  **The Argument: Why is this Necessary?**  
  Leibniz’s necessity stems from his core principles:  
  1. **Principle of Sufficient Reason (PSR)**: Nothing happens without a reason why it is *so* and not otherwise.  
  2. **Identity of Indiscernibles (PII)**: If two things share *all* properties, they are identical (not two).  
  3. **Nature of Substances**: Monads are simple, soul-like entities whose essence is perception. Each reflects the entire universe from its unique perspective.  

  Here’s the metaphysical engine:  
  - **God’s Creation Choice**: God could create any possible world, but chooses the *best* (most harmonious) one.  
  - **The Problem of Indistinguishables**: If two substances were identical, God would have *no reason* to place one here and the other there. Why put *this* indiscernible sphere *left* and *that* one *right*? PSR forbids arbitrary acts.  
  - **Intrinsic Denominations Save the Day**: Relations (like position) aren’t brute facts. They *supervene* on intrinsic properties. If Sphere A is left of Sphere B, it’s because A has the intrinsic property *"being at position (0,0,0)"* and B has *"being at (0,0,1)"*. The relational fact "A is left of B" is *founded* on these intrinsic coordinates.  

  **Why Not Contingent?**  
  Because PSR is a *metaphysical law*. God *couldn’t* create two identical things without violating PSR—there’d be no sufficient reason for their distinctness. Individuation isn’t an accident; it’s built into existence.  

  ---

  **Step 2: Black’s Spheres vs. Leibniz**  
  Black’s universe: Two iron spheres, identical in *all* intrinsic properties (mass, shape, composition, etc.), symmetrically orbiting a midpoint. No external observer. Black argues:  
  - They are numerically distinct (two spheres) but qualitatively identical.  
  - Thus, PII is false—indiscernibles *can* exist.  

  **Leibniz’s Potential Replies**:  
  1. **The Relational Gambit**:  
     - *Objection*: The spheres differ relationally! Sphere A is "6 meters from Sphere B," and Sphere B is "6 meters from Sphere A."  
     - *Leibniz*: Yes, but relations require intrinsic foundations. "Being 6m from B" is a relational property of A—but it’s *founded on* A’s intrinsic spatial location. If A and B have *different* locations (even symmetrically), they have *different intrinsic denominations* (e.g., *occupying point P1* vs. *occupying point P2*).  
     - *Black’s Counter*: But in a symmetric universe, the locations are purely relational! "Point P1" has no independent identity—swap the spheres, and the state of the universe is identical. There’s no intrinsic "here-ness" or "there-ness."  

  2. **The PSR Nuclear Option**:  
     - *Leibniz*: Why is Sphere A *here* and Sphere B *there*? If they’re truly identical, God has *no reason* to assign A to P1 and B to P2 rather than vice versa. This violates PSR.  
     - *Black*: But in a symmetric universe, "here" and "there" aren’t metaphysically distinct. Assigning identities to points is arbitrary—no reason is *needed*.  
     - *Leibniz*: Then the spheres don’t truly occupy distinct points! If P1 and P2 are indistinguishable, they’re the *same* point. Space isn’t a container; it’s a system of relations grounded in substances.  

  3. **Monads vs. Material Objects**:  
     - *Hidden Asymmetry*: Leibniz’s PII applies to *substances* (monads). Black’s spheres are *material composites*—aggregates of monads. Leibniz *might* concede that composites *could* be indiscernible if their parts are identically arranged, but monads themselves cannot be.  
     - *Problem*: Leibniz often extends PII to all entities. Even composites must differ via their constituent monads’ perspectives.  

  **Does Leibniz "Change the Subject"?**  
  If Leibniz relies on relational differences, is this cheating? Not for him:  
  - Relations are *reducible* to intrinsic properties of substances.  
  - If A and B have different relational properties, it *must* be because they have different intrinsic foundations (e.g., different spatial locations).  
  - But Black’s universe *denies* intrinsic spatial identities—points are defined only by relations. Leibniz would call this incoherent: relations require relata with intrinsic natures.  

  ---

  **Where My Reading Could Be Wrong & What Would Change It**  
  1. **Overplaying PSR?**  
     - *Risk*: I assume PSR is Leibniz’s primary driver. But maybe he thinks PII is independently obvious from the nature of substances.  
     - *Evidence to Change My Mind*: If Leibniz explicitly says God *could* create indiscernibles but chooses not to (making PII contingent), my reading collapses. He never does—PSR binds God.  

  2. **Misjudging "Intrinsic Denominations"**:  
     - *Risk*: I interpret "founded on intrinsic denominations" as supervenience. But Leibniz might mean *only* non-relational properties count.  
     - *Evidence to Change My Mind*: If Leibniz admits purely relational differences *without* intrinsic foundations (e.g., "being to the left of B" in a symmetric space), Black wins. He doesn’t—space must be grounded.  

  3. **Black’s Universe as a Counterexample**:  
     - *Concession*: If space is absolute (Newtonian), Black’s spheres *do* have intrinsic positions. Leibniz loses.  
     - *But*: Leibniz rejects absolute space! For him, space is relational. In a purely relational space, symmetric points aren’t distinct—so the spheres *coincide* or are *one*.  
     - *Smoking Gun*: If relational spacetime (à la modern physics) permits symmetric yet distinct states, Black’s scenario is metaphysically possible. Leibniz’s PII *would* fall.  

  **Verdict**:  
  Leibniz’s argument *can* survive Black—but only if:  
  - Space/time are not absolute,  
  - Relations require intrinsic foundations, and  
  - PSR forbids symmetric individuation.  

  If you grant Leibniz his metaphysics (anti-absolutism, PSR), Black’s spheres aren’t indiscernible—their relational differences imply intrinsic ones. If you reject Leibniz’s framework, Black’s objection holds. **Your post-Fregean eyes aren’t deceiving you; the stalemate hinges on whether you accept Leibniz’s grounding project.** Teach the tension: Leibniz demands a "thick" metaphysics where relations are derivative; Black thrives in a "thin" world where symmetries are fundamental.
