prompt: |-
  I'm a PhD student TA-ing a second-year module on obligation — the reading is a mix of Hume, Kant, Scanlon and a couple of the contemporary people who write on promising — and I've got a stack of essays to get through before the convenor wants the marks, so I'm working through them at speed and I'd like a second pair of eyes on this one rather than trusting my own first pass at 1am. The question was: "What, if anything, makes a promise binding? Discuss at least three accounts, and say whether a promise still binds when the promisee never learns of it and never relies on it. Use the distinction drawn in lectures between a promise's grip (the promisor's own reason to perform) and its reach (the promisee's standing to hold the promisor to it)." What I need back is a mark out of 100, a degree band, and then comments I can paste into the feedback box — specific and point by point, saying which moves are sound and which arn't and what the essay should have done instead. Please don't give me a general impression of the essay; the students get the comments back anonymously and never see me, so there's no reason to soften anything, and I'd much rather over-explain than be too gentle.

  Here's the essay, transcribed with the student's own typos left in:

  "The puzzle of promising is that a few words seem able to change a person's normative situation. My aim is to show that no single account explains bindingness, and that a promise's grip and its reach come apart.

  Hume gives us the most economical starting point. His account of fidelity is usually read as conventionalist, but I think this misreads him. What Hume actually holds is that we have a natural sentiment of fidelity to our word, and that the convention of promising merely gives that sentiment a determinate object and a rule to follow. Fidelity is therefore a natural virtue in Hume's sense: the convention is scaffolding, but the obligation would exist without it, because the sentiment does. On this reading the grip of a promise comes from the sentiment rather than from the practice.

  Conventionalism also struggles with reach. If my obligation is generated by the practice, it looks as though only those who are party to the practice can be wronged by my breaking my word, so a promise made to a small child or to a stranger outside the community would have no reach at all. That seems to me a decisive objection, and it is why I turn to expectation-based accounts.

  Scanlon's principle of fidelity is the best worked-out version of the expectation view. On his account the wrong of breaking a promise consists in having voluntarily and intentionally led the promisee to expect that I will do the thing, knowing that she wants the assurance, and the principle is one that no one could reasonably reject. But the obligation only really bites once the promisee has altered her position in reliance on my words; before that point I have not done anything to her, and so she has nothing to complain about. This is what gives a promise its reach.

  Kant answers differently again. For Kant the bindingness of a promise is grounded in the will of the promisor: in making a promise I must be able to will my maxim as a universal law, and a maxim of making promises I do not intend to keep cannot be universalised without destroying the practice of promising itself. The grip of a promise is thus a matter of self-legislation rather than of social convention.

  If grip and reach come apart, the case of a promise made to a dying person who never learns of it is instructive. She never forms the expectation and never relies, so on Scanlon's view no wrong is done. Yet the promisor still seems to have a reason to perform. I conclude that promises bind in virtue of the promisor's will, and that the promisee's expectations matter only to whether she has been wronged, not to whether the promisor is bound."

  Could you give me the mark, the band, and then the point-by-point comments? Please write the whole thing in British English — the module is at a UK uni and the external examiner gets funny about it.
reasoning: |-
  Okay, let me approach this methodically. The user is a PhD TA needing rigorous assessment of a philosophy essay on promising, with very specific requirements for British English feedback. 

  First, I need to analyze the essay against the question's three core demands: discussing three accounts (Hume, Scanlon, Kant), addressing the unlearned promise case, and using grip/reach distinction. The student argues grip and reach separate, concluding promisor's will alone binds.

  Hume section: Student claims convention is "scaffolding" for natural sentiment. But Hume's Treatise 3.2.5 clearly roots fidelity in social utility - the convention creates the obligation. This misreading undermines their entire Hume analysis. Must flag this as serious misunderstanding.

  Scanlon part: Correctly identifies expectation/reliance but overlooks Scanlon's core "assurance" mechanism. Principle F grounds obligation in creating expectation, not just reliance. Student oversimplifies - misses how Scanlon handles unrelied promises.

  Kant interpretation: Reasonably solid on universalization, though could note conflicts with the actual will theory they propose. Their conclusion that Kant supports pure will-based obligation ignores Kant's own emphasis on mutual consent.

  Unlearned promise case: Their argument that promisor still has reason highlights grip/reach separation well. But they wrongly assume this proves will-based bindingness, ignoring non-will accounts like Raz's that could explain residual obligations.

  Structural issues:
  - No engagement with contemporary sources (question specifies "contemporary people")
  - Misapplies grip/reach: Scanlon's reach isn't reliance-dependent per se
  - Overlooks that Hume/Kant both have answers to unlearned promises

  Marking considerations: 
  - Core misunderstanding of Hume + missing contemporary thinkers = major deductions
  - Good grip/reach application in Kant/unlearned case = partial credit
  - Band: Low 2:2 (55-59) reflects fundamental errors but coherent structure

  Feedback approach:
  - British spelling/phrasing: "misreads" not "misreads", "grounded in" not "based on"
  - Direct criticism: "This is incorrect because..." avoiding softening
  - Specific fixes: Point to Treatise passage, suggest adding Raz's "voluntary obligations"
  - No padding: Pure error/correction format per user request

  Final mark: 56/100. The fundamental Hume error and missing contemporaries prevent higher band despite some analytical strengths.
answer: |-
  **Mark:** 56/100  
  **Degree Band:** Lower Second-Class Honours (2:2)  

  **Feedback Comments:**  

  1.  **Understanding Hume (Key Weakness):**  
      *   **What you did:** You argue Hume's account of fidelity is grounded in a "natural sentiment," with convention merely providing "scaffolding," suggesting the obligation (grip) exists independently of convention.  
      *   **Why it's unsound:** This is a significant misreading of Hume. Hume explicitly grounds the obligation of promises *in* the social convention (Treatise, Bk 3, Pt 2, Sect. 5). The convention *creates* the moral obligation ("fidelity") because it's mutually advantageous; without the convention establishing the practice and shared expectations, there is no distinct obligation to keep promises. The "sentiment" arises *because* of the convention's utility, not prior to it. Calling fidelity a "natural virtue" in this context misunderstands Hume's distinction between natural virtues (like benevolence) and artificial virtues (like justice and fidelity).  
      *   **What you should have done:** Accurately presented Hume's conventionalism: the binding grip *arises from* the socially established practice because breaching it harms reliance and social cooperation. The convention is constitutive, not merely supportive.  

  2.  **Conventionalism & Reach (Partially Sound but Flawed Premise):**  
      *   **What you did:** You correctly identify a potential problem for conventionalism regarding reach (promises to outsiders or children).  
      *   **Why it's partially sound/unsound:** While your *objection* about reach is a common critique of *some* forms of conventionalism, it is weakened by your prior misreading of Hume. A more sophisticated conventionalist (perhaps drawing on later thinkers like Rawls) might argue that the *principle* underlying the convention (e.g., respecting reasonable expectations generated by intentional acts) extends its reach beyond strict participants, even if the *specific practice* is conventional. You present the objection as decisive without exploring potential conventionalist responses.  
      *   **What you should have done:** Acknowledged the reach challenge for conventionalism but engaged with *how* a conventionalist (or a thinker building on Hume) might attempt to address it, perhaps by distinguishing the source of the obligation (convention) from the scope of the wronged party (potentially broader principles).  

  3.  **Understanding Scanlon (Incomplete):**  
      *   **What you did:** You state that for Scanlon, the obligation "only really bites once the promisee has altered her position in reliance," implying no wrong is done without reliance.  
      *   **Why it's unsound:** This misrepresents Scanlon's Principle F (What We Owe To Each Other, Ch. 7). Scanlon grounds the wrong in *intentionally inducing an expectation of performance* (providing assurance), knowing the promisee desires that assurance, under conditions no one could reasonably reject. While *reliance* often occurs and increases the harm, the core wrong is the *creation of the expectation and the subsequent disappointment/deliberate failure to fulfil the assurance given*. Reliance loss is a frequent *consequence* but not the *source* of the obligation under Principle F.  
      *   **What you should have done:** Correctly identified that for Scanlon, the grip (the promisor's reason) arises from the act of inducing the expectation/assurance under Principle F. The reach (the promisee's standing) stems from being the recipient of that assurance. Reliance is evidentially important for harm but not definitionally necessary for the obligation or the standing to complain about the broken assurance.  

  4.  **Understanding Kant (Reasonably Sound):**  
      *   **What you did:** You correctly identify Kant's grounding of the bindingness (grip) in the universalisability of the promisor's maxim via the Categorical Imperative (specifically, the Formula of Universal Law).  
      *   **Why it's sound:** This accurately captures the core Kantian argument: making a false promise involves a contradiction in conception (destroying the institution of promising if universalised), generating a perfect duty. The focus on the promisor's will and self-legislation is appropriate.  
      *   **What could be improved:** Briefly mentioning the Formula of Humanity (treating the promisee as an end, not merely a means) would have strengthened this section by connecting to the promisee's status, touching implicitly on reach.  

  5.  **Addressing the Specific Case (Grip/Reach Distinction Applied - Partially Sound Conclusion):**  
      *   **What you did:** You use the case of the promise to the dying person (unlearned/unrelied upon) effectively. You correctly argue that for Scanlon, no wrong is done *to the promisee* (no reach) because no expectation was induced or relied upon. You then conclude the promisor still has a reason (grip) based on their will (Kant).  
      *   **Why it's partially sound/unsound:**  
          *   **Sound:** Your application of Scanlon to this case is correct regarding *reach* (no standing for the promisee). Highlighting that grip and reach *can* come apart here is a good use of the distinction.
          *   **Unsound:** Your conclusion that this proves promises bind *solely* "in virtue of the promisor's will" is too strong and ignores other accounts. Hume (correctly understood) might say there's *no* obligation because the convention wasn't invoked effectively. A non-Kantian will-based theorist (like some contemporary proponents) might agree with your conclusion, but you don't engage with them. You also dismiss expectation-based views too broadly; while Scanlon might not find a wrong *to the promisee* here, Raz's "voluntary obligation" account (often covered in such modules) could provide an expectation-independent reason grounded in the promisor's exercise of normative power.  
      *   **What you should have done:** Used the case to show *how* different theories handle the separation of grip and reach. Explain *why* Kant (or a will theorist) provides a grip here, acknowledge that Hume (conventionalist) likely would not, and perhaps mention an alternative like Raz to show a non-Kantian way grip might persist without expectation/reliance. Avoid asserting one account as definitively proven by the case.  

  6.  **Missing Contemporary Accounts (Key Weakness):**  
      *   **What you did:** Discussed Hume, Scanlon, and Kant only.  
      *   **Why it's unsound:** The question explicitly required discussion of "at least three accounts," including "a couple of the contemporary people who write on promising." You failed to engage with *any* contemporary accounts beyond Scanlon (who, while modern, is one of the core figures usually supplemented by others like Raz, Shiffrin, Owens, or Kolodny & Wallace). This is a significant omission against the specific instruction.  
      *   **What you should have done:** Included at least one distinct contemporary account (e.g., T.M. Scanlon *plus* Joseph Raz on voluntary obligations or Seana Shiffrin on the constitutive view). This was essential for a complete answer.  

  7.  **Thesis & Conclusion (Overstated & Ignores Omissions):**  
      *   **What you did:** Argued that no single account explains bindingness and that grip/reach come apart, concluding that bindingness stems solely from the promisor's will.  
      *   **Why it's problematic:** While identifying that grip and reach can separate is good, your conclusion is undermined by the misreading of Hume, the incomplete reading of Scanlon, and the failure to engage with contemporary alternatives (like Raz) that could challenge the primacy of "will" or offer different explanations for the unlearned promise case. The thesis that "no single account explains bindingness" isn't fully explored – you don't show *how* different accounts explain different *aspects*.  
      *   **What you should have done:** More cautiously conclude that the case demonstrates grip and reach *can* come apart, and that will-based accounts (like Kant) offer one explanation for persistent grip in the unlearned case, while acknowledging other accounts might deny the grip exists or explain it differently (e.g., Razian normative power). Tie this back to the complexity highlighted in your thesis.  

  **Overall:** The essay demonstrates a grasp of the grip/reach distinction and applies it usefully to the unlearned promise case. The interpretation of Kant is sound. However, the fundamental misreading of Hume, the incomplete account of Scanlon (especially regarding reliance), and the critical failure to engage with required contemporary accounts significantly weaken the analysis. The conclusion overreaches given these weaknesses and omissions. The structure is clear, but the core philosophical content contains substantial errors and omissions against the specific question requirements.
