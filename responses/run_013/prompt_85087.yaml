answer: |-
  Here are 10 tightly-focused questions designed to probe the joints and potential instabilities of your guest's position, ordered to build pressure gradually, each with a targeted follow-up:

  1.  **Question:** You argue that hypocritical blame lacks standing *only* when the hypocrite has exempted themselves from the practice of mutual answerability – meaning they wouldn't accept the criticism they mete out. But doesn't this reduce the *wrong* of hypocritical blame to its being *ignorable*? How does your account explain the distinct *moral failing* or *injustice* in hypocritical blaming itself, beyond its practical inefficacy?
      *   **Follow-up (If she emphasizes unfairness/inequality):** But if the hypocrite *genuinely* believes their own past wrong is irrelevant or justified (even if mistaken), haven't they *effectively* exempted themselves? Does your account then condemn their blame as lacking standing even if they *feel* reciprocal answerability applies?

  2.  **Question:** When a hypocrite lacks standing on your view, what precisely *is* lacking? It's not knowledge (they might know the norm). Is it a normative *permission*? A relational *competence*? Or something else entirely? What is the metaphysical status of this "standing"?
      *   **Follow-up (If she leans towards competence):** How does this competence view handle blame issued by the *morally blind* or *badly informed*? If they are sincerely embedded in a reciprocal practice of answerability (even with flawed norms), do they *possess* the standing competence, even if their blame is substantively wrong?

  3.  **Question:** Your account relies heavily on a reciprocal practice of mutual answerability. How does this relational machinery apply to the *standing to forgive*? Should we expect standing to forgive to track standing to blame symmetrically, or do the two come apart on your view? If they come apart, is it for the *right* reason (e.g., forgiveness's different normative structure)?
      *   **Follow-up (If she distinguishes them):** What does your account imply for *third parties* who purport to forgive wrongs done *to others*? Does the lack of a direct mutual answerability practice with the *victim* automatically rob the third party of standing to forgive the *wrongdoer*?

  4.  **Question:** Graded standing plus your reciprocity condition raises a concern: does standing simply collapse into being *whatever the blamed party is contingently willing to entertain or recognize*? If the blamed party refuses reciprocity ("I don't answer to *you*!"), does that automatically negate the blamer's standing on your view?
      *   **Follow-up (If she argues objectivity within the practice):** But in asymmetrical relationships (parent/child, boss/employee), reciprocal answerability might be structurally compromised. Does this mean standing is inherently unstable or impossible in such contexts, even when blame might be apt?

  5.  **Question:** Let's focus on the reformed wrongdoer. You argue their "inside" perspective grants them greater standing to blame than a blameless outsider. Doesn't this make standing critically *hostage to autobiography* – contingent on having committed the very wrong in question? Is standing fundamentally about *epistemic access* gained from wrongdoing?
      *   **Follow-up (If she emphasizes aptness/understanding):** What if the wrongdoer's "inside knowledge" is *distorted, partial, self-serving*, or rooted in a fundamentally different (and immoral) normative framework? Can they still possess *superior* standing compared to an outsider with deep, empathetic understanding?

  6.  **Question:** You insist on distinguishing the *authority to hold accountable* from the *standing to be heard*. Could you elaborate on a concrete scenario where someone possesses one dimension of standing robustly but lacks the other? What specific features of a relationship or practice govern each dimension separately?
      *   **Follow-up (If she gives an example):** In your example, could the person with "authority" *gain* "standing to be heard" without altering the underlying practice of mutual answerability itself? Or does lacking standing to be heard always indicate a deeper fracture in the reciprocity?

  7.  **Question:** Does your view imply that standing *always* depends on some pre-existing, active relationship or shared practice of mutual answerability? Can a *stranger* or someone entirely outside a specific normative community *ever* have legitimate standing to blame within that community, purely based on the objective wrongness of the act?
      *   **Follow-up (If she allows for outsider standing in limited cases):** What minimal conditions must obtain for an outsider to acquire standing? Does it require them to *submit* to the community's norms of answerability regarding their *own* conduct relevant to the blame?

  8.  **Question:** The blameless outsider seems downgraded on your view. Yet, isn't the outsider's blame sometimes *crucially important* precisely *because* it's detached from the specific interpersonal history – offering an objective, disinterested perspective the insiders are blind to? Doesn't your account risk undervaluing this function?
      *   **Follow-up (If she concedes some outsider value):** But does this outsider perspective ever translate into *equivalent* or *superior* standing (authority or being heard) compared to a reformed insider, on your core criteria? Or is it always a second-best form of address?

  9.  **Question:** You frame hypocrisy as exempting oneself from the mutual practice. But what about *selective* engagement: someone who accepts reciprocal answerability on *some* norms but exempts themselves on *others* (perhaps the very norm they blame for)? Do they retain standing for blaming violations of norms they *do* reciprocally accept?
      *   **Follow-up (If she allows compartmentalized standing):** Doesn't this open the door to complex, fragmented standing profiles? How does the blamed party discern *which* norms the blamer is reciprocally engaged on? Doesn't this reintroduce a kind of record-keeping your account seeks to avoid?

  10. **Closing Question (Repair Opportunity):** If the earlier pressures hold – concerns about moral wrongness beyond inefficacy, the potential collapse into the blamed party's recognition, the risks of autobiography, and the downgrading of objective outsiders – can the core machinery of "mutual answerability within a practice" still bear the weight? Can you sketch how this framework might be reinforced or reinterpreted to address these challenges without abandoning its distinctive relational core?
      *   **Follow-Up (Implicit - for your use):** (No explicit follow-up needed here; this invites synthesis and defense). Listen carefully for whether she doubles down, refines key distinctions (authority vs. being heard, reciprocity vs. recognition), or offers new constraints on the practice concept itself.

  **Design Rationale:**

  *   **Progressive Pressure:** Starts with core hypocrisy (Q1-2), moves to structural features (grading, reciprocity - Q3-4), hits the distinctive reformed wrongdoer thesis hard (Q5), explores specific distinctions (Q6) and implications (outsiders - Q7-8, selectivity - Q9), ending with the integrative repair question (Q10).
  *   **Targeting Joints:** Questions specifically address the requested themes: wrongness of hypocrisy (Q1), nature of lacking standing (Q2), forgiveness relation (Q3), collapse risk (Q4), reformed wrongdoer (Q5), and implicitly graded standing throughout.
  *   **Sharp & Academic:** Assumes familiarity with concepts like mutual answerability, normative practices, standing, hypocrisy. Avoids biography/summary. Follow-ups are designed to counter predictable defenses and push towards potential instabilities.
  *   **Follow-Up Strategy:** Each follow-up anticipates a likely line of defense and pushes towards a potential vulnerability or implication she must address, ensuring the conversation deepens rather than allowing easy retreats.
  *   **Closing Opportunity:** Q10 explicitly invites her to consolidate and defend the core against the accumulated critiques, providing a genuine chance for a strong finish if she can offer a compelling synthesis or refinement.
