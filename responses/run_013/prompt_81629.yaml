  Hmm... Gradation is perfect because expressivism traditionally deals with binary attitudes (approval/disapproval), but comparisons require ranking intensities. A phrase like "Not as bad as" forces consideration of scalar moral properties. For example: "Cheating is wrong, but not as bad as assault." This feels authentic—people actually say things like this when weighing offenses.

  For the diagnosis: Realists instantly explain this via objective moral scales (wrongness degrees exist independently). Expressivists, though, must stretch their theory. They'd need to argue that "not as bad as" reflects comparative disapproval strength—we disapprove of cheating less intensely than assault. But this demands they formalize attitude intensities (beyond simple pro/con), perhaps mapping them to a quasi-logical ranking system. 

  The key question is whether this gives real logic or just surface polish. The expressivist move here feels decorative—it mimics logic by assigning weights to attitudes, but doesn't ground truth conditions. Unlike realists, they can't say comparisons track mind-independent facts; it's just calibrated expressions of feeling. So it's elegant scaffolding, not deeper foundations. 

  This should lay bare why predicates in all contexts matter: realist grammar naturally extends, while expressivism requires ad hoc patches for each new construction. The example's simplicity avoids textbook fatigue, and gradation pressures the attitude story exactly where it's thinnest.
answer: |-
  Here's the example:

  **Exchange:**  
  *Alex:* "I know stealing is wrong, but it's **not as bad as** assault, right?"  
  *Sam:* "No, stealing is definitely **less wrong** if it's just food for survival."

  ### Diagnosis:
  1. **Expressivist addition needed:** They must explain how gradations ("less wrong," "not as bad as") map onto non-cognitive attitudes. This requires building a *comparative structure* into attitudes—e.g., disapproval of stealing is *weaker* than disapproval of assault. They need a formal system to rank attitude strengths (e.g., "Boo-stealing < Boo-assault").  

  2. **Realist advantage:** Realists treat moral predicates as denoting objective properties with inherent scales (like "weight" or "height"). Comparisons directly reflect degrees of wrongness in reality, requiring no special machinery.  

  3. **Does it buy logical standing?** Only superficially. Expressivists can *mimic* comparative logic ("If A is worse than B, and B is worse than C, then A is worse than C") by stipulating rules for attitude rankings. But this structure is imposed *on* attitudes, not derived *from* their expressive nature. It lacks truth-conditional grounding—unlike realism, where "less wrong" tracks a mind-independent moral scale. The logic remains a useful fiction, not a discovery of normative relations.  

  **Why this cuts deeper:**  
  Gradations force expressivists to reconstruct scalar properties from raw attitudes—a job predicates handle effortlessly. Students see that the problem isn’t just conditionals, but *any* construction requiring predicates to behave like measurable properties. Realism’s semantic simplicity becomes stark here.
