  2. **Maze of Achievements**: Attempt a puzzle. If you attempt, take 1 craving token (because you are striving). If you solve it within 3 minutes, get 1 achievement token. If you fail, take 1 suffering token. (So it's risky: you might get an achievement but at the cost of craving and possibly suffering.)

