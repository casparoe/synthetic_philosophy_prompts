prompt: |-
  I want you to treat a specific position in decision theory as the object of scrutiny and give me a map of its exposure: what would have to be true, or what would we have to observe, for the position to be false.

  The position is this. When an agent chooses under risk, with known probabilities over outcomes, the standard expected-utility prescription misdescribes what rationality permits. Instead of weighting each outcome by its probability alone, a rational agent weights outcomes by a transformed function of their cumulative probability. Concretely, she ranks the outcomes of a lottery from worst to best and evaluates it by taking the worst outcome's utility and then adding, for each step up to a better outcome, the utility increment contributed by that outcome multiplied by a risk function applied to the probability of doing at least that well. The risk function is a fixed, agent-specific, increasing map from the unit interval to itself, sending 0 to 0 and 1 to 1, and its curvature encodes the agent's attitude toward risk, with a convex function yielding risk aversion over gains and a concave one risk seeking. On this view the classic violations of the independence axiom are not mistakes but the signatures of a coherent, rank-dependent preference structure, and ordinary expected utility is just the special case in which the risk function is the identity.

  Assume the position in its permissive form: rationality does not dictate any single risk function, but it does require that an agent's risky choices be representable by one and the same fixed risk function, applied uniformly across all of them, with the risk function and the utility function separately identifiable from her preferences.

  Now tell me what would count against it. I want the defeaters sorted from decisive to merely awkward: the choice patterns or experiments that would falsify it outright, the formal results that would show it collapses into a rival or into vacuity, the intuitions it is committed to that turn out unacceptable, and the structural facts about its own machinery that its friends should worry about. In particular, I want you to address the identification of the risk function against the utility function, whether a single risk function can be calibrated to fit behavior across stakes of very different sizes, what the position owes on dynamic or sequential choice and whether it can survive the diachronic arguments that sink other non-expected-utility theories, how it relates to the more general rank-dependent and capacity-based frameworks it may be a special case of, and whether confining the view to known probabilities leaves the ambiguity cases as a defect or a legitimate boundary. Then tell me which of these a committed defender would themselves concede and which they would dismiss as question-begging, which single consideration does the most work, what the position predicts that its rivals do not, and whether it has been qualified into unfalsifiability — and if it has, whether that is a real problem for a view of this kind or simply the price of a permissive theory.
reasoning: |-
  Hmm, the user wants me to critically examine a specific position in decision theory - rank-dependent expected utility (RDEU) with known probabilities. They've provided a detailed description of this theory and want me to map out what would count against it, sorted from decisive counterarguments to merely awkward challenges.

  The position argues that rationality permits transforming cumulative probabilities when evaluating risky choices, rather than using standard expected utility. The risk function captures risk attitudes, with convexity indicating risk aversion and concavity risk-seeking behavior. The key claim is that rationality requires this structure with a fixed risk function across all choices, separable from utility.

  I need to systematically identify what would falsify or challenge this position. Let me organize the defeaters starting with the most decisive:

  First, formal violations of necessary conditions for RDEU representation. If we observe violations of stochastic dominance where one lottery is always better than another but the agent prefers the dominated option, that would directly falsify RDEU since it preserves stochastic dominance. Similarly, violations of comonotonic independence would be problematic since RDEU satisfies comonotonic independence - if preferences flip when adding a common outcome to comonotonic lotteries, that contradicts RDEU.

  Second, identification problems pose serious challenges. If we find that a single risk function can't explain choices across different stake sizes without utility function distortion, that threatens the theory. For example, if risk attitude scaling changes dramatically with wealth levels, it might force us to contort utility functions to maintain a fixed risk weighting. Also, if we observe preference patterns that require different risk functions for different choice domains, that violates the requirement for a single fixed risk function.

  Third, dynamic choice issues could undermine RDEU. The theory might struggle with sequential choices where plans made in advance conflict with choices made in the moment. If RDEU leads to dynamic inconsistency - where agents regret or reverse their choices as uncertainty resolves - that creates problems. While defenders might argue this is just a planning challenge rather than irrationality, it remains awkward.

  Other challenges include problems with the position's relationship to more general models, limitations to known probabilities, and potential unfalsifiability concerns. While the theory can accommodate many choice patterns through flexible utility and risk functions, this flexibility could make it difficult to falsify - though defenders might argue this is acceptable for a permissive theory of rationality.

  The most damaging counterargument is probably violations of stochastic dominance, as this directly contradicts a core property of RDEU. For committed defenders, they would likely concede identification challenges as genuine issues but argue that violations of independence axioms are question-begging since RDEU was designed to accommodate them.

  RDEU uniquely predicts rank-dependent violations of independence while preserving stochastic dominance, which distinguishes it from some alternatives. While the theory has significant explanatory power, its flexibility and potential identification problems remain concerns that proponents must address.
answer: |-
  Here is a map of the exposure for the described Rank-Dependent Expected Utility (RDEU) position, sorted by severity of the defeater, with analysis of key challenges and defenses:

  ### Decisive Falsifiers (Would Refute the Core Representation)
  1.  **Violations of Stochastic Dominance:** If an agent systematically prefers a lottery *A* to lottery *B* where *B* stochastically dominates *A* (i.e., for every possible utility level, *B* gives at least as high a probability of achieving at least that utility, and strictly higher for some), this is **incompatible** with RDEU. RDEU preserves first-order stochastic dominance. Observing such a violation would falsify the claim that preferences are representable by *any* RDEU model.
  2.  **Violations of Comonotonic Independence:** RDEU satisfies *Comonotonic Independence*: If lotteries *A*, *B*, and *C* are pairwise comonotonic (their outcomes are rank-ordered identically across states), and *A* is preferred to *B*, then the mixture *αA + (1-α)C* is preferred to *αB + (1-α)C* for any *α* in (0,1). Finding systematic violations *specifically among comonotonic lotteries* would falsify RDEU representation. (Ordinary independence violations *outside* comonotonic sets are expected and accommodated).

  ### Formal Collapses & Vacuity Threats
  3.  **Identification Failure (Non-Separability):** The core claim relies on the *separate identifiability* of utility *u(.)* and probability weighting *w(.)*. Formal results show this identification is fragile:
      *   **Stake-Scale Dependence:** If the *same* risk function *w(p)* cannot be held constant while *u(.)* adapts to explain choices across vastly different stake magnitudes (e.g., choices involving cents vs. life savings), the separability claim collapses. Behavior might be better explained by context-dependent weighting or utility functions distorted by scale, rendering the "fixed *w(p)*" vacuous or merely a reparametrization of a complex utility function.
      *   **Trade-off Dependence:** If the implied *w(p)* derived from preferences changes systematically depending on the *range* of outcomes involved in the choices used to elicit it (holding probabilities constant), this suggests *w(p)* isn't a fixed property of probability perception/weighting but is confounded with utility scaling. This blurs the line between RDEU and complex state-dependent or reference-dependent utility models.
      *   **Collapse into State-Dependence:** In the extreme, if *w(p)* effectively absorbs all the non-linearity, leaving *u(.)* nearly linear, or vice-versa, the model becomes indistinguishable from an EU model with highly specific, perhaps implausible, state-dependent utility. The "separate identifiability" requires strong, potentially unrealistic, assumptions about the structure of preferences across diverse lotteries.

  ### Structural & Dynamic Challenges
  4.  **Dynamic Inconsistency (Naiveté or Sophistication Problems):** RDEU models often exhibit **dynamic inconsistency** in sequential choice. A plan made at an early stage (using the RDEU criterion) may no longer be optimal when a later decision node is reached (using the same RDEU criterion on the subproblem). This creates a dilemma:
      *   **Naive Agents:** Will deviate from their plans, potentially leading to dominated outcomes or money pumps.
      *   **Sophisticated Agents:** Must pre-commit or use complex contingent planning, which seems descriptively inaccurate and normatively burdensome.
      *   *Defender Response:* Concede inconsistency but argue it's a feature, not a bug, reflecting genuine time/state-dependent risk attitude shifts captured by the weighting function. Normatively, they might advocate sophistication/pre-commitment as rational. *Critique:* This mirrors problems that sank early prospect theory and is normatively awkward compared to EU's dynamic consistency.
  5.  **Limitation to Known Probabilities (The Ambiguity Boundary):** Confining RDEU to "known probabilities" leaves ambiguity aversion (Ellsberg paradox) as a distinct phenomenon needing separate explanation. While the position *claims* this is a legitimate boundary, it exposes a weakness:
      *   *Awkwardness:* Human risk/uncertainty attitudes might form a spectrum. A unified theory explaining both risk (known prob) and ambiguity (unknown prob) might be normatively preferable. RDEU's silence on ambiguity feels like an *ad hoc* restriction if ambiguity attitudes exhibit structures similar to RDEU patterns (e.g., pessimism resembling convex weighting).
      *   *Defender Strength:* They can correctly argue that RDEU *explicitly* doesn't address ambiguity. Its success in the risk domain isn't invalidated by this limitation; ambiguity requires separate principles (e.g., maxmin EU, smooth ambiguity).

  ### Awkwardnesses & Tensions
  6.  **Relationship to More General Models (Cumulative Prospect Theory - CPT):** RDEU is a special case of CPT (Tversky & Kahneman, 1992), differing primarily by:
      *   **Loss Aversion & Sign Dependence:** CPT uses separate weighting functions and potentially different utility curvatures for gains and losses, plus loss aversion. RDEU lacks these.
      *   *Awkwardness:* The immense descriptive success of CPT (capturing loss aversion, reflection effect) suggests RDEU is *too restrictive* as a *general* descriptive model. While the position focuses on rationality *permitting* RDEU, CPT's empirical dominance makes RDEU seem like an incomplete picture of actual (and arguably rationalizable) behavior, especially regarding mixed gambles and loss domains. Defenders might counter that their focus is purely on the gain domain under risk.
  7.  **Interpretation of the Weighting Function:** The normative status of non-linear weighting is debated. Is it rational to overweight small probabilities of extreme outcomes? Defenders argue it's a legitimate expression of risk attitude. Critics see it as a cognitive error (misperception of probability) that rationality should correct. This clash of intuitions is persistent.
  8.  **Potential Unfalsifiability?** The combination of flexible *u(.)* and flexible *w(.)* makes RDEU remarkably adaptable to a wide range of choice data *within the bounds of stochastic dominance and comonotonic independence*. This raises concerns:
      *   **Threat:** Could almost any coherent set of preferences satisfying dominance and comonotonic independence be rationalized *ex post* by some *u(.)* and *w(.)*? If so, is the theory too permissive to be falsifiable?
      *   **Defender Response (Plausible):** This adaptability is the *price and virtue* of a *permissive* theory of rationality. It doesn't dictate a single rational choice but identifies a coherent *class* of rational preference structures broader than EU. Falsifiability lies in violations of dominance or comonotonic independence. The identification challenges (#3) also constrain it empirically/normatively.
      *   **Real Problem?** For a descriptive theory, near-unfalsifiability is fatal. For a *normative, permissive* theory, it's less so, provided the boundaries (dominance, comonotonic independence) are clear and normatively defensible. The real issue is whether the required separability (#3) holds normatively.

  ### Summary: Key Battlegrounds & Defender Stance

  *   **Most Damaging:** **Violations of Stochastic Dominance (1)** are truly fatal. **Fundamental Identification Failure (3)**, especially across stakes, is the most potent threat to the core machinery, potentially collapsing it into vacuity or a rival model.
  *   **Conceded by Defenders (as features):** Violations of standard Independence Axiom (expected and accommodated), Dynamic Inconsistency (#4 - seen as manageable via sophistication), Limitation to Known Probabilities (#5 - seen as a boundary).
  *   **Dismissed as Question-Begging:** Arguments that non-linear weighting (#7) is *inherently* irrational (defenders see it as a core aspect of rational risk attitude). Criticisms based solely on EU axioms being "rational" (the position rejects this premise).
  *   **Key Differentiating Prediction:** RDEU uniquely predicts **rank-dependent violations of independence** while **preserving stochastic dominance**. For example, it predicts the Allais Paradox while avoiding dominance violations that Prospect Theory (without cumulative weighting) initially exhibited.
  *   **The Core Vulnerability:** **Identification (#3)**. Demonstrating that the *same* `w(p)` cannot plausibly explain choices across diverse stakes or outcome ranges, without rendering `u(.)` normatively dubious or context-dependent, strikes at the heart of RDEU's claim to offer a coherent, separable account of risk attitudes distinct from utility. This is where the most significant empirical and normative challenges lie.
  *   **Unfalsifiability?** It's **qualified but not destroyed**. While flexible within its boundaries, the theory *is* falsified by dominance or comonotonic independence violations. The permissiveness is intentional as a normative stance. However, the identification problem (#3) acts as a crucial constraint; if separability fails empirically/normatively, the theory loses its explanatory power and risks becoming a merely descriptive curve-fitting tool without clear normative justification for its distinct components. This permissiveness is arguably a necessary feature, not a fatal flaw, *if* the boundaries hold and identification succeeds.
