prompt: |-
  I serve on the ethics and grants advisory council of a mid-sized human-rights foundation, and I have to circulate the written opinion that will frame Thursday's vote.

  The request before us is this. In a country where a military commander annulled an election eighteen months ago and has since dissolved the courts and the legislature, detained several thousand people, and presided over a famine in the north, a coalition of civic associations and surviving members of the deposed government has asked us to fund and publicly endorse an operation to remove him. The operation would in all likelihood kill him and four or five senior officers; the planners themselves concede a serious risk of a violent succession struggle, of reprisals against the communities that have sheltered the opposition, and of a hardline faction emerging from the officer corps stronger than the man it replaces. The coalition's political wing is a government-in-exile that no one elected and that is dominated by one regional faction. Our money is not decisive, but our endorsement is: two European donors have said they will follow our lead.

  Our charter requires that any endorsement of removing a ruler satisfy four conditions, which it takes over from the medieval discussion of tyrannicide, and from Aquinas in particular. First, the ruler's defect must be one of title rather than merely of exercise: he must hold power without right, as a usurper does, rather than hold it rightly and use it badly. Second, no lawful authority must remain that can depose or try him. Third, the killing must be the act of the community's public authority rather than of private initiative, since private killing invites faction, private vengeance, and the settling of old scores under cover of public justice. Fourth, the removal must be expected to leave the community no worse off than the tyranny it ends, which the charter glosses as requiring that the successor not be worse, that reprisals and civil conflict be contained, and that the act not discredit the cause it serves. The charter adds a proviso that has not come up before: a ruler who seized power without right may in time acquire title through the community's acquiescence, and the council is to say whether eighteen months of uncontested control, with no rival authority able to displace him, has begun to do so.

  Please draft the opinion. It should recommend one concrete course of action — endorse, decline, or endorse on stated conditions — with a time frame and with the conditions spelled out precisely enough for the board to vote on them item by item. Work through each of the four conditions against the facts above, saying plainly which are met, which are doubtful, and what further evidence would settle the doubtful ones. Two of my colleagues will press hard, and the opinion has to answer them rather than talk past them. One holds that because the commander is a usurper and not a lawful ruler governing badly, the third condition is relaxed, and any private party with the means may act. The other holds that the fourth condition can never be satisfied in advance, since we cannot know the successor, and that a test no case can pass is a prohibition in disguise. Give each of them the strongest version of their case before you say whether you accept it, and be candid about what the foundation would be risking if the majority follows you.
reasoning: |-
  Okay, let me approach this systematically. The user needs a legally rigorous opinion applying medieval tyrannicide principles to a modern human rights crisis - quite the intellectual challenge. 

  First, I'll need to unpack the four Thomistic conditions from their charter. The distinction between defect of title (usurpation) versus defect of exercise (misgovernance) is crucial here. The military commander clearly seized power illegally, satisfying the first condition. 

  The second condition about no lawful authority remaining seems problematic. While courts and legislature were dissolved, the government-in-exile's legitimacy is questionable since they "are dominated by one regional faction" and "no one elected" them. That's a red flag.

  For the third condition - public authority versus private action - my colleague's argument about relaxed standards for usurpers feels dangerous. Aquinas was quite explicit about avoiding private vengeance cycles. The opposition coalition's composition makes this especially risky given their factional dominance.

  The fourth condition's practical assessment gives me pause. The planners themselves admit risks of succession violence and reprisals. That famine in the north suggests any instability could worsen humanitarian catastrophe. My other colleague's skepticism about predictability is valid - but the charter demands we try.

  That eighteen-month acquiescence proviso is fascinating. Has the lack of effective resistance legitimized the usurper? Probably not yet given ongoing detentions and famine, but it's uncomfortably close.

  For structure, I'll:
  - Open with clear recommendation (conditional endorsement)
  - Methodically address each condition with "met/not met" determinations
  - Engage colleagues' counterarguments head-on
  - Specify exact conditions and timeframes
  - Quantify risks honestly

  The conditional endorsement should require:
  1) Broadening the government-in-exile's base
  2) Securing military faction commitments
  3) Creating civilian protection plans
  With strict 60-day deadlines before reassessment.

  Must emphasize that even with conditions, we're gambling with civilian lives. The north's famine makes stability paramount. Better spell out what "no worse off" concretely means in this context - body counts, famine mortality rates, displacement figures.

  This will anger both colleagues - one will say we're imposing impossible standards, the other that we're reckless. But charter interpretation requires walking this razor's edge.
answer: |-
  ## Advisory Opinion: Request for Endorsement of Military Commander Removal

  **Recommended Action:** Decline endorsement at this time, pending fulfillment of specific conditions within 60 days. Should conditions not be met by [Date: 60 days from Thursday], the endorsement must be formally declined.

  **Conditions for Potential Future Endorsement:**  
  1.  **Broadened Political Mandate:** The government-in-exile must demonstrate tangible progress towards incorporating significant representation from *all* major regions and civic groups (including those currently underrepresented or excluded), verified by independent auditors acceptable to the Foundation. Mere token inclusion is insufficient.  
  2.  **Succession & Restraint Guarantees:** Written, verifiable agreements must be secured from key factions within the military (beyond the initial targets) and the political coalition, committing to:  
      *   A clear, agreed-upon interim authority structure post-removal.  
      *   An immediate ceasefire and prohibition of reprisals against communities or political rivals.  
      *   A swift transition plan towards inclusive elections within 12 months.  
      *   Adherence to international humanitarian law.  
  3.  **Civilian Protection Plan:** A detailed, funded, and actionable plan must be presented, developed in consultation with international humanitarian organizations, specifically addressing:  
      *   Mitigation of risks to communities in the north (famine exacerbation) and those sheltering the opposition (reprisals).  
      *   Continuity of essential services (food, water, medical) during potential instability.  
  4.  **European Donor Coordination:** Written confirmation from the two European donors that their conditional funding is explicitly contingent *only* on the Foundation's endorsement *and* that they accept the above conditions as prerequisites for their own support.

  **Analysis Against Charter Conditions:**

  1.  **Defect of Title (Met):** The military commander seized power by annulling an election and dissolving state institutions. He is a usurper, lacking any initial legitimate claim. His defect is one of *title*, not merely exercise, satisfying Condition 1. *The 18-month proviso:* While 18 months of uncontested control exists *de facto*, the context – dissolution of institutions, mass detentions, ongoing famine (implying oppression, not acceptance) – strongly indicates this is enforced dominance, not community acquiescence conferring legitimacy. Title remains defective.

  2.  **No Lawful Authority Remains (Met):** The courts and legislature are dissolved. The existing government is the usurper's regime. While a government-in-exile exists, it lacks electoral mandate or constitutional basis for lawful authority *within the country*. No domestic lawful authority capable of deposing or trying the commander remains, satisfying Condition 2.

  3.  **Act of Public Authority (Not Met - Conditionally Addressable):** The acting coalition is a mix of civic groups and unelected members of a deposed government, dominated by one faction. This falls far short of representing the "community's public authority." It currently resembles private initiative, carrying high risks of factionalism, vengeance, and score-settling.  
      *   *Colleague's Argument (Relaxed Standard for Usurpers):* The strongest case is that Aquinas's primary concern was preventing private citizens from killing *legitimate but wicked* rulers, as this destroys the very fabric of ordered society. Against a *usurper* who *has* destroyed lawful order, the barrier to private action acting *for the common good* might be lower, as there is no lawful public authority left to act.  
      *   *Response:* While the usurper's lack of legitimacy reduces the barrier compared to killing a legitimate tyrant, Condition 3 remains crucial. Endorsing a factional "private" initiative, even against a usurper, inherently risks replacing one tyranny with another or triggering chaotic violence. The goal is *restoration of public order and justice*, not merely removal. The current coalition's lack of broad legitimacy makes it incapable of representing the "public authority." **This condition can only be met if Condition 1 (Broadened Mandate) is fulfilled, transforming the coalition into a more credible embodiment of the public will.**

  4.  **Community No Worse Off (Not Met - Conditionally Addressable):** The planners concede serious risks: violent succession struggle, reprisals, emergence of a worse hardline faction, exacerbation of the northern famine. The current government-in-exile's factional dominance undermines confidence in a stable, just successor. There is no credible plan to contain the admitted risks. The likelihood of the community being worse off is unacceptably high.  
      *   *Colleague's Argument (Impossible Prediction):* The strongest case is that predicting complex political outcomes, especially successors and factional dynamics after a violent removal, is inherently speculative. Demanding certainty creates a *de facto* prohibition, as no such operation can *guarantee* a better outcome, potentially trapping people under tyranny indefinitely. The test should be reasonable expectation based on available evidence, not certainty.  
      *   *Response:* Condition 4 does not demand certainty, but a *reasonable expectation* based on evidence and plans. The charter explicitly requires assessing the *probability* of successors being worse, conflict being contained, and the cause not being discredited. Currently, the *admitted* risks by the planners, the lack of broad political backing, and the absence of concrete restraint mechanisms create a *reasonable expectation* that the outcome could be worse, especially for vulnerable populations. The risks are tangible and unmitigated. **This condition can only be met if Conditions 2 (Succession Guarantees) and 3 (Civilian Protection Plan) are fulfilled, providing concrete evidence to form a reasonable expectation of containment and stability.**

  **Risks of Conditional Recommendation:**

  1.  **Paralysis:** Setting conditions may delay action, prolonging suffering under the current regime, especially the famine. The 60-day deadline mitigates but doesn't eliminate this.
  2.  **Unfulfillable Conditions:** The conditions, particularly broadening the coalition and securing military guarantees, may be politically impossible within the timeframe, effectively forcing a decline.
  3.  **False Hope/Reputational Risk:** Setting conditions implies potential future endorsement. If the conditions are met superficially (e.g., token inclusion) and the operation still leads to disaster, the Foundation's endorsement could be seen as enabling catastrophe, severely damaging its credibility and moral authority.
  4.  **Undermining Opposition:** Declining immediate endorsement might demoralize the opposition and signal a lack of international support, potentially strengthening the usurper.
  5.  **Missed Opportunity:** The unique leverage of our endorsement (influencing European donors) might be lost if the window for effective action closes.

  **Conclusion:** The request satisfies Conditions 1 (Defect of Title) and 2 (No Lawful Authority) but critically fails Conditions 3 (Public Authority) and 4 (No Worse Off) based on the current information and plans. The potential for catastrophic reprisals, factional violence, a worse successor, and famine exacerbation is unacceptably high. However, a path exists for the coalition to potentially satisfy the unmet conditions. Therefore, we **decline endorsement now** but will **reconsider if the specified conditions are demonstrably met within 60 days**. This balances the imperative to resist tyranny with the fundamental duty to prevent greater harm and ensure action aligns with the restoration of legitimate public authority and the common good, as required by our charter and the principles of Aquinas. The board must vote on each specified condition individually should a revised request be submitted.
