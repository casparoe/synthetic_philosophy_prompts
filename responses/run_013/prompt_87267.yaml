  Unified process? Developments were interconnected but not monolithic. Cross-pollination happened, but not all fields moved together. Maybe 0.6.

  Contemporary awareness? Figures like Bacon and Descartes saw themselves as innovators, but not all did. Partial recognition, so 0.7.

  Scope of science? Astronomy and mechanics are clear, but chemistry and biology lagged. Including all fields lowers unity. Probability 0.5 for broader scope.

  Periodization validity? All labels are constructs, but some reflect real shifts. Scientific Revolution has stronger evidence than most. So 0.8.

