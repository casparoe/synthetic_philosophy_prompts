  ### The Choice Game: An Activity on the Axiom of Choice

  #### **Overview**
  This activity is designed to help students intuitively grasp the axiom of choice (AC) by experiencing both its apparent obviousness and its non-constructive nature. Through a team-based game, students will confront scenarios where selecting one element from each set in a family feels trivial (e.g., finite sets with structure) and others where it becomes impossible to specify or share a consistent choice (e.g., symmetric sets without canonical elements). The debrief connects this to AC, finite vs. infinite families, and the philosophical divide over AC's acceptability.

  #### **Learning Objectives**
  - Feel the intuitive pull of AC: "Of course, you can choose one element from each set!"
  - Experience the frustration of AC's non-constructivity: "No one can actually describe or share the choice."
  - Understand that AC is independent of human describability and that some selections are "provably not measurable."
  - Spark debate on why AC is indispensable to some (e.g., for foundational proofs) and monstrous to others (e.g., it licenses counterintuitive sets).

  #### **Materials**
  - **Index cards** for set descriptions (prepared in advance).
  - **Paper and pens** for teams to write rules or choices.
  - **Whiteboard** for scoring, writing rules, and debrief.
  - **Timer** for rounds.
  - **Two envelopes** labeled "Team A" and "Team B" containing identical sets of cards for each round.

  **Card Design (Key to avoid smuggling canonical elements):**
  - **No explicit element names.** Sets are described by properties, not listed elements. Elements are anonymized to prevent trivial selections (e.g., no "pick the first one").
  - **Finite vs. "arbitrary" families:** Use finite sets initially, then progress to sets requiring arbitrary choices.
  - **Example cards:**
    - **Round 1 (Shoes):** "Set 1: A pair of shoes, one left and one right." (Canonical choice exists.)
    - **Round 2 (Socks):** "Set 1: A pair of identical socks. The socks are indistinguishable." (No canonical choice; symmetric.)
    - **Round 3 (Functions):** "Set 1: The set of all bijections from {1, 2, 3} to {A, B, C}." (No unique canonical element; hard to describe a choice.)
  - **Critical:** Cards for symmetric sets (like socks) use only qualitative descriptions. No ordering, labels, or visual cues are implied.

  #### **Game Rules**
  - **Teams:** Split the class into Team A and Team B. Teams cannot communicate during rounds.
  - **Goal:** For each set in a family, select one element. Teams win a round if their selections match for all sets (i.e., they make the same choices independently).
  - **Procedure per round:**
    1. **Distribute cards:** Give each team an envelope with identical cards describing the family of sets.
    2. **Write rules/selections:** Teams have 5 minutes to write a **rule** (a general instruction for selecting an element from **any** such set) or **selections** (specific choices for each set). 
       - In Rounds 1–2, teams write specific selections (e.g., "For Set 1, pick the left shoe").
       - In Round 3, teams write a general rule (e.g., "Pick the bijection that maps 1 to A").
    3. **Reveal and compare:** Teams reveal their selections/rules. The facilitator checks if:
       - Selections match for all sets (Rounds 1–2).
       - The rule works for a new set constructed to defeat it (Round 3).
    4. **Scoring:** Teams earn 1 point if they match (Rounds 1–2) or if their rule works (Round 3). An extra point if both teams have identical rules/selections.

  #### **Timeline (75 Minutes)**
  | **Segment**      | **Time** | **Description**                                                                                                                                                               |
  |-------------------|----------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Introduction**  | 5 min    | Explain the game: "Select one element from each set. Win if both teams make the same choices without communicating. We’ll explore when this is easy, hard, or impossible."     |
  | **Round 1: Shoes**| 10 min   | **Family:** 3 pairs of shoes (left/right distinguished).<br>**Cards:** "Set 1: Pair of shoes (left and right)," etc.<br>**Teams write:** Specific selections (e.g., "left shoe for Set 1").<br>**Outcome:** Teams match and win. Point(s) awarded. |
  | **Round 2: Socks**| 15 min   | **Family:** 3 pairs of identical socks.<br>**Cards:** "Set 1: Pair of indistinguishable socks," etc.<br>**Teams write:** Specific selections (e.g., "the first sock for Set 1"—but they’ll interpret "first" differently).<br>**Outcome:** Teams rarely match. No points. Discuss why. |
  | **Round 3: Functions**| 20 min | **Family:** 1 set of bijections (e.g., all bijections from {1,2,3} to {A,B,C}).<br>**Cards:** "Set 1: All bijections from {1,2,3} to {A,B,C}."<br>**Teams write:** A general rule (e.g., "Pick the bijection where 1→A, 2→B, 3→C").<br>**Facilitator’s twist:** Introduce a new set (e.g., bijections from {X,Y,Z} to {1,2,3}) and show the rule fails (e.g., "1→A" is undefined).<br>**Outcome:** Rules fail. No points. |
  | **Debrief**       | 25 min   | Discuss the experience, connect to AC, finite vs. infinite, and philosophical implications. Use whiteboard for notes.                                                        |

  ---

  ### **Round-by-Round Execution**
  **Round 1: Shoes (Finite, Structured Sets)**  
  - **Why it works:** Canonical choices exist (left/right). Teams will match by selecting "left" for all sets.  
  - **Predictable issue:** Teams might overthink and not match (e.g., one picks "left," the other "right").  
    - **Handling:** If mismatch occurs, emphasize: "You *could* have agreed on a rule (e.g., always pick left), but you didn’t communicate. With structure, rules are easy."

  **Round 2: Socks (Finite, Symmetric Sets)**  
  - **Why it works:** No canonical element. Teams must invent labels (e.g., "first sock"), but since cards avoid ordering cues, interpretations differ.  
    - **Example mismatch:** Team A selects "the sock described first" for Set 1; Team B selects "the sock described second."  
  - **Predictable issue:** Teams might force a match by consistently picking "left" (if cards are read left-to-right).  
    - **Handling:** Admit this is a limitation of physical cards, but stress: "In reality, socks have no 'left.' If sets are truly symmetric, no rule ensures agreement without arbitrary labeling. For infinite families, you can’t list choices."

  **Round 3: Functions (Arbitrary Choice Required)**  
  - **Why it works:** Bijections have no natural "smallest" or "simplest" element. Any rule (e.g., "pick the bijection with 1→A") is arbitrary and fails when the domain/range changes.  
    - **Facilitator’s defense:** After teams submit rules, construct a new set (e.g., bijections from {X,Y,Z} to {1,2,3}) and show the rule breaks (e.g., "1→A" is undefined here). Students verify the failure.  
  - **Predictable issue:** Teams propose ambiguous rules (e.g., "pick any bijection").  
    - **Handling:** Require rules to specify a **unique** element. Reject ambiguous rules. If needed, provide an example rule to clarify.

  ---

  ### **Debrief (25 Minutes)**
  **Connect Activity to AC**  
  1. **The axiom of choice (AC):**  
     - AC says: "For any family of non-empty sets, there exists a function (a choice function) that selects one element from each set."  
     - **Round 1 (Shoes):** AC isn’t needed—choices are constructible (e.g., "always pick left").  
     - **Round 2 (Socks):** For finite families, you can select elements by brute force (e.g., list choices), but you can’t ensure consistency across people. AC guarantees a function exists, but it might not be "shareable."  
     - **Round 3 (Functions):** For complex families, no describable rule works, but AC asserts a function exists "in the abstract."  

  2. **Finite vs. Arbitrary Families:**  
     - **Finite families (Socks):** You can select elements without AC by listing choices. But if sets lack structure, selections are arbitrary and unshareable.  
     - **Arbitrary families (Functions):** When families are large or unstructured, you can’t list choices. AC provides a "licensure" for a function without requiring a description.  

  3. **Why AC is Indispensable and Monstrous:**  
     - **Indispensable:** AC is needed for foundational results (e.g., "every vector space has a basis"). In the game, we felt we *should* be able to choose—AC makes this intuition rigorous.  
     - **Monstrous:** AC leads to counterintuitive "monsters," like the Vitali set (a non-measurable set). In the game, Rounds 2–3 showed that:  
       - Choices can be arbitrary and unshareable (socks).  
       - Some sets (like equivalence classes) have **provably non-constructible** choices.  
         - **Example:** Binary sequences under eventual agreement.  
           - Each set (equivalence class) contains sequences that agree past some point.  
           - Any rule for selecting a "canonical" sequence (e.g., "pick the one with fewest 1s") fails (non-unique or undefined).  
           - Worse, any AC-based selection is **provably not Lebesgue measurable**—it can’t be assigned a "size" consistently.  
           - *Whiteboard sketch:* Show equivalence classes as "branches" of a tree. No rule picks a unique branch without arbitrariness.  

  4. **Philosophical Tension:**  
     - **Pro-AC:** "Choosing is mundane—like taking one item from each box. AC just formalizes this." (Your friend’s view.)  
     - **Anti-AC:** "AC licenses selections we can’t describe, verify, or use in computation. It’s a ‘black box’ that spawns paradoxes." (Your view.)  
     - **Student reflection:** "When did selection feel obvious? When did it feel impossible? Why?"

  **What the Activity Can’t Fully Replicate**  
  - **Non-measurability proof:** The activity illustrates undescribability but not the formal proof that equivalence-class selections are non-measurable. You’ll need to:  
    - Briefly define measurability (e.g., "Can we assign a consistent length/area to the set?").  
    - State that AC-based choices in equivalence classes (e.g., Vitali sets) break measure theory.  
    - Emphasize: "This isn’t about cleverness—math *proves* no measurable choice function exists."  
  - **Infinite families:** Physical constraints limit us to finite sets. Verbally explain how AC’s controversy amplifies for infinite families (e.g., selecting one sock from each pair in an infinite wardrobe).

  **Predicted Issues and Solutions**  
  - **Issue:** Round 2 (Socks) devolves into teams always picking "left" (due to card layout).  
    - **Solution:** If teams match, say: "In reality, socks have no ‘left.’ If we reshuffled labels, your choices wouldn’t match. AC gives a function, but not one you can communicate."  
  - **Issue:** Students struggle with equivalence classes in Round 3.  
    - **Solution:** Use simple analogies (e.g., "Two sequences are ‘equivalent’ if they become twins after some point"). Focus on the takeaway: "No rule picks a ‘distinguished’ sequence everyone agrees on."  
  - **Issue:** Rules in Round 3 are too vague.  
    - **Solution:** Require specificity (e.g., "Your rule must output one element for any set of bijections"). Reject rules like "pick any."

  ---

  **Final Notes**  
  This activity makes AC tactile: students experience the tension between "of course we can choose" and "but we can’t agree or describe it." The debrief elevates this to why AC splits mathematicians—some see it as bedrock, others as a tool for chaos. By ending with non-measurability, you underscore that AC’s consequences are profound and inescapable. Run the game as a dialogue, and let students sit with the discomfort of undefinable choices.
