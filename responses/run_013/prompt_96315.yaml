  - 0-10 min: Introduction. Assign roles. Explain that the goal is to compute the percentage of cases eligible for D. The facilitator is the root and will request each case evaluator to determine eligibility for D for their case. Each case evaluator will then work with the rule experts to compute it. Rule experts will work by the rules and may ask the case evaluator for attribute values. Everyone must communicate by passing sticky notes. Include your ID and the case ID in every request.

  - 10-50 min: Work period. The facilitator starts by sending requests to the 5 case evaluators.

  - 50-70 min: Facilitator collects the 5 results, computes the percentage, and writes it on the board.

  - 70-90 min: Debrief.

  Debrief questions:

  - What was the computed percentage? (Facilitator reveals the correct answer.)
  - How many communications happened? (Estimate.)
  - Were there any errors? If so, what caused them?
  - How did it feel to be a rule expert? A case evaluator?
  - In the ideal version, you could have as many copies as you want. How would that help? (You could have one expert per rule per case, eliminating the bottleneck. But then you have 4*5=20 experts, which we didn't have.)
  - What about recombination? Was it straightforward to combine the answers? (For the overall percentage, yes, once you had the eligibility for each case. But within a case, the recombination of rule results was done by the rule experts.)
  - What does this say about the claim that any question can be chopped up and then recombined without loss? (We were able to chop, but the process was messy and error-prone. In theory, with infinite copies, you could assign one copy to each sub-problem and avoid bottlenecks. But in practice, with bounded resources, it's hard. Also, the decomposition might not be obvious, and dependencies might be missed.)

  This activity should give the group a feel for the process and its pitfalls.
answer: |-
  ### Activity Design: Recursive Problem-Solving Simulation  
  **Goal:** Experience the "infinite copies of myself" thought experiment to test the claim that any hard problem can be losslessly decomposed into solvable sub-parts and perfectly recombined.  

  **Core Mechanics:**  
  - Participants solve a complex problem by recursively breaking it into smaller sub-problems.  
  - Roles are fixed (no acting), communication is via written notes.  
  - The problem has a verifiable answer to compare results afterward.  
  - **Problem:** *Calculate the total cost of a "space mission" using a predefined rulebook.* The rules involve interdependent conditions (e.g., launch costs, crew salaries, penalties) that require decomposition.  

  **Why This Problem?**  
  - **Checkable answer:** Pre-calculated by you (the facilitator) for comparison.  
  - **Decomposable:** Breaks into sub-tasks (e.g., "calculate launch cost" → "calculate fuel cost" + "rocket cost").  
  - **Recombination risk:** Rules have hidden dependencies (e.g., discounts that apply only if multiple conditions are met), which may be lost during decomposition.  

  ---  
  ### Materials (Cheap & Simple)  
  1. **Rulebook Sheets (1 per participant):** A 4-page booklet defining cost-calculation rules (e.g., "Crew cost = base salary × crew size", "Discount: 10% if crew size ≥ 5 and mission days > 30").  
  2. **Mission Parameters Card (1 per participant):** A card with mission specs (e.g., crew size=6, mission days=45, rocket type="A").  
  3. **Sticky Notes (3 pads per participant):** For passing queries/answers.  
  4. **Pens (1 per participant).**  
  5. **Whiteboard/Poster:** To track the recombination progress.  
  6. **Timer:** For strict phase transitions.  

  ---  
  ### Rules of Engagement  
  1. **No talking.** All communication via sticky notes.  
  2. **Recursive decomposition only:**  
     - If a question is too hard, you *must* split it into 2–3 sub-questions.  
     - Write each sub-question on a sticky note and pass it to another participant.  
     - Recombine answers by synthesizing the sticky-note responses.  
  3. **Role constraints:**  
     - Everyone must solve *exactly one* question at a time.  
     - If you receive a question you can’t answer immediately, you *must* decompose it.  
  4. **Final output:** The group must produce a single total cost (in dollars).  

  ---  
  ### Timeline (90 Minutes Total)  
  #### **Phase 1: Setup (10 min)**  
  - Assign roles: 12 participants are "solvers," 1 is "synthesizer" (you, the facilitator), 1 is "recorder" (writes progress on the whiteboard).  
  - Distribute materials:  
    - All get rulebooks, mission cards, pens, and sticky notes.  
    - Mission cards are identical (same mission parameters for everyone).  
  - Explain rules and emphasize: *"If a question feels complex, decompose it. No shortcuts."*  

  #### **Phase 2: Decomposition & Solving (50 min)**  
  - **Start:** You (synthesizer) write the top-level question on a sticky note and pass it to a participant:  
    > *"What is the total cost of the mission? Use rules on pages 1–4."*  
  - **Process:**  
    - Participants decompose questions recursively (e.g., "Total cost" → "Launch cost" + "Crew cost" + "Penalties").  
    - Answers must be written on sticky notes and passed back to the sender.  
    - Recorder maps the query tree on the whiteboard (e.g., "Participant 3 asked Participant 7 for 'Launch cost'").  
  - **Your role:**  
    - Enforce decomposition (e.g., interrupt if someone tries to answer without splitting).  
    - Announce time checks every 10 min.  

  #### **Phase 3: Recombination (15 min)**  
  - Participants pass their answers back up the tree.  
  - Synthesizer (you) combines all answers into a final total cost.  
  - Recorder writes the final number on the whiteboard.  

  #### **Phase 4: Debrief (15 min)**  
  - Reveal the pre-calculated correct answer.  
  - Discuss:  
    1. *"How close was our final answer to the correct one?"*  
    2. *"Where did we lose information? Check the whiteboard for bottlenecks."*  
    3. *"Did decomposition feel natural? What frustrated you?"*  
    4. *"Map this to the ‘infinite copies’ idea: What broke and why?"*  

  ---  
  ### What Will Go Wrong (And How to Salvage It)  
  1. **Bottlenecks in recombination:**  
     - **Prediction:** Solvers will focus on easy sub-tasks (e.g., "crew cost"), ignoring hard ones (e.g., "discount rules"). The synthesizer gets overloaded with incomplete answers.  
     - **Salvage:** At 30 min, force solvers to balance the tree (e.g., "3 of you switch to discount-calculation sub-tasks").  

  2. **Hidden dependencies lost:**  
     - **Prediction:** Groups will miss rule interactions (e.g., a discount that requires *both* crew size and mission days). Answers will be ~15% too high.  
     - **Salvage:** In debrief, show the specific rule and ask: *"Why was this overlooked? How does this challenge ‘lossless’ recombination?"*  

  3. **Time crunch:**  
     - **Prediction:** Only 60% of sub-tasks will finish. The final answer will be a rough estimate.  
     - **Salvage:** End Phase 2 early (at 40 min) and use partial answers. Focus debrief on *why* time failed (e.g., communication overhead).  

  ---  
  ### What the Activity Can’t Reproduce (Requires Explanation)  
  - **The "infinite patience" idealization:** Real humans get tired, bored, or rushed; copies in the thought experiment do not. Highlight this in debrief: *"We saw errors from time pressure and fatigue—what if we had infinite time?"*  
  - **Perfect recombination assumption:** The activity will expose how dependencies get lost in decomposition. Explain: *"The thought experiment assumes no context is lost when splitting/recombining—but we saw this isn’t automatic."*  

  ---  
  ### Debrief Mapping to the Concept  
  1. **"Infinite copies" yardstick:**  
     - *"We simulated recursion, but our bounded time/copies caused errors. The ‘ideal you’ avoids this."*  
  2. **Decomposition claim:**  
     - *"We broke the problem into small pieces (each solvable), but recombination failed for multi-rule conditions. This challenges the claim that chopping loses nothing."*  
  3. **Suspicion of the second claim:**  
     - *"We felt the breakage: Decomposing works, but recombination requires global context (e.g., discounts). Real-world problems have hidden links that copies might miss."*  

  **Final Note:** This creates visceral frustration—use it! Point to the whiteboard: *"Our tree looked logical, but we lost the ‘magic’ of seeing the whole picture. That’s the gap between theory and reality."*
