  Then, the reverse analysis: what does this case say about the concepts? The competitiveness constraint might be a narrative to justify choices rather than an external force. The alignment tax becomes a distributional issue—who pays? In this case, passengers and airlines paid, not Boeing initially. The existence of regulators in aviation makes this a stronger test because it shows even with oversight, market pressures can undermine safety.

  For AI governance, the analogy holds in competitive markets pressuring speed over safety, and costs being shifted. But differences include lack of clear standards in AI and less regulatory accountability. The concepts are useful but need refinement. Competitiveness constraint isn't just external; internal pressures matter. Alignment tax involves distributional questions. A defender would argue that without competition, Boeing might have acted differently, but the case shows multiple pressures at play.

