       - B) One problem: the symptoms are interconnected and the division is artificial. (Alternative Structure)
       - C) The labels are tools; use whichever helps the patient. (Pragmatic)

  9. **Recovery from depression**:
     - Background: A person was diagnosed with major depression, received treatment, and has been symptom-free for five years.
