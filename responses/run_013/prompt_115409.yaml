  ### **Scoring Key**  
  Tally your answers, then match patterns to outcomes below. **Multiple outcomes are possible** if your answers point to several views. If your combination fits no position, see "Uncharted Territory."  

  #### **Answer-to-Position Mapping**  
  - **Biological Dysfunction (BD)**: 1B, 2A, 3B, 4B, 5B, 6A, 7B, 8A, 10A  
  - **Social Construction (SC)**: 1A, 2B, 3A, 4A, 5C, 6B, 8B  
  - **Pragmatic Tool (PT)**: 1C, 4C, 5A, 6C, 7A, 8C, 10C  
  - **Community Authority (CA)**: 1C, 4A, 5A, 9A  
  - **Interactive Loop (IL)**: 2B, 4C, 5C, 9C  
  - **Alternative Structure (AS)**: 6B, 7C, 8B, 9A, 10B  
  - **Institutional Economics (IE)**: 3C, 4C, 7A, 9C  

  #### **Outcomes**  
  Based on your **most frequent** positions:  
  - **>4 matches in one position**: Strong alignment.  
  - **3–4 matches across 2–3 positions**: Mixed alignment (list all).  
  - **No majority**: See "Uncharted Territory."  

  **Biological Dysfunction (BD)**  
  > *You believe disorders are real dysfunctions in biological systems. Culture can obscure or reveal them, but they exist independently. This commits you to seeking biomarkers and discrete treatments. Strongest objection: It underestimates how categories (e.g., homosexuality) change without new biology.*  

  **Social Construction (SC)**  
  > *You see categories as social products that create new realities (e.g., post-*Sybil* DID). Diagnoses don’t just name pre-existing things—they shape behavior and identity. This commits you to skepticism about "natural" boundaries. Strongest objection: It risks denying biological bases of suffering (e.g., starvation in anorexia).*  

  **Interactive Loop (IL)**  
  > *You think real dysfunctions exist, but categories and people interact dynamically: labels change symptoms, which redefine labels (e.g., autism→neurodiversity). This commits you to seeing diagnosis as co-created. Strongest objection: It’s philosophically messy and hard to test.*  

  **Pragmatic Tool (PT)**  
  > *You view diagnoses as tools: if a category helps (e.g., accessing therapy), use it; if it harms (e.g., stigma), avoid it. Truth matters less than utility. This commits you to context-dependent diagnoses. Strongest objection: It may justify inaccurate labels that have long-term consequences.*  

  **Community Authority (CA)**  
  > *You argue the classified group (e.g., autistic people) should define their category, not clinicians. Lived experience trumps professional authority. This commits you to patient-led revisions of manuals. Strongest objection: Not all groups are organized (e.g., psychosis), and some reject treatment.*  

  **Alternative Structure (AS)**  
  > *You feel categories are the wrong shape—real phenomena are dimensions (e.g., grief/depression) or networks (e.g., insomnia→anxiety). This commits you to overhauling diagnostic systems. Strongest objection: Categories aid communication; dimensions may be less clinically useful.*  

  **Institutional Economics (IE)**  
  > *You believe diagnoses track power and money—what insurers pay for (e.g., subthreshold anxiety), schools accommodate, or societies exclude (e.g., drapetomania). This commits you to seeing psychiatry as political. Strongest objection: It downplays genuine efforts to align categories with reality.*  

  #### **Uncharted Territory**  
  If your answers don’t align (e.g., **strong BD + strong SC**):  
  > *This suggests a tension—e.g., you see disorders as biologically real* and *socially constructed, without a looping mechanism (IL) to bridge them. This may be an unexplored middle ground, though some find it incoherent. Alternatively, answers like 3A (SC) + 3B (BD) are contradictory (drapetomania can’t be both pure oppression and pure error).*  

