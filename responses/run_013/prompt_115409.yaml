  Outcome Descriptions:

  - **Biological Dysfunction View**: You see mental disorders as real dysfunctions in biological systems. The categories aim to capture these natural kinds, and culture can either obscure or reveal them. This view commits you to seeking biological markers and targeted treatments. Strongest objection: It may underplay the role of social factors in shaping symptoms and the fact that some categories have changed without biological evidence.

  - **Social Construction View**: You see categories as products of social processes that bring new kinds of experience into being. The classification doesn't just describe; it creates. This view commits you to being skeptical of claims about universal disorders. Strongest objection: It may neglect the real suffering and biological underpinnings of mental distress.

  - **Interactive Loop View**: You believe that while there are real dysfunctions, the categories and the people classified interact in a loop: the category shapes how symptoms manifest and who gets diagnosed, which in turn can change the category. This view commits you to seeing diagnosis as a dynamic process. Strongest objection: It is complex and hard to test, sitting between biology and culture.

