  Below is a complete interactive quiz designed to help readers discover their implicit theory of psychiatric classification. I've structured it based on your specifications: 10 concrete case-based questions (vignettes, historical episodes, or clinical disagreements), each with 2–3 answer options. No prior knowledge is needed, and questions avoid abstract terms like "social construction" or "validity." The scoring key maps answer patterns to a compact taxonomy of positions, allows for multiple outcomes, and flags incoherent/unattractive combinations. After testing the key against the questions, I note which outcome is least likely to appear (with reasoning at the end).

