  1. **Homosexuality in DSM**:
     - Background: In 1973, the American Psychiatric Association removed homosexuality from the DSM after a vote. There was no new biological discovery that showed it wasn't a disorder; it was a decision based on changing social attitudes and ethical considerations.
     - Question: What does this episode suggest about psychiatric categories?
       - A) It shows that categories must be based on biology; without such a basis, they should be removed. (Biological Dysfunction)
