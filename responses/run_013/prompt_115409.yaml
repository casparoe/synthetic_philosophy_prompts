  Required cases to include (as per the user's request):
  1. A category that was officially struck from the manual by vote without new biological discovery.
  2. A dissociative condition that rose in prevalence after a best-selling book and film, and then declined.
  3. A 19th-century American physician's category that pathologized flight from slavery.
  4. A condition where the diagnosed population now insists it is a minority identity, not a defect.
  5. Two clinicians agreeing on symptoms but disagreeing about writing the diagnosis due to the patient's welfare.
  6. A hypothetical clinic in a country where the diagnosis is rare, showing weight loss but no body-image fear (for an eating disorder).

  Other cases can be designed to cover the spectrum of positions.

  Positions to map to (taxonomy of outcomes):
  A. Biological Dysfunction View: Disorders are real dysfunctions of biological systems; culture obscures or reveals them.
  B. Social Construction View: Categories are social products that bring their subject matter into being.
  C. Interactive Loop View: A real dysfunction exists, but the loop between category and classified shapes boundaries, symptoms, and who ends up inside.
  D. Pragmatic Tool View: A category is a tool; the only question is whether it helps.
  E. Community Authority View: The classified community, not the profession, has standing to say what the category means.
  F. Alternative Structure View: Categories are the wrong shape; real phenomena are dimensions or symptom networks.
  G. Institutional Economics View: Diagnoses track what someone is willing to pay for, insure, or exclude.

  We'll design questions such that answer patterns map to these positions. The scoring key should allow for multiple outcomes if a reader's answers point to more than one, and note combinations that don't fit any existing position.

