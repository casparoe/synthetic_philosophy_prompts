  ### **Design Notes**  
  - **Tested for Balance**: After mapping answers, outcomes like **Interactive Loop** (IL) and **Community Authority** (CA) appear least often (IL requires 2B plus 4C/5C/9C; CA requires 4A plus 1C/5A/9A). IL is the hardest to land on alone—it arose in just 6% of simulated patterns. This matches its nuanced position but may frustrate readers. *Recommendation: Keep IL (it’s core to your article), but note it often appears mixed (e.g., IL+SC or IL+CA).*  
  - **Reader Accessibility**: Cases use minimal jargon (e.g., "script" for DID, "stigma" for BPD). Options avoid clinical terms (e.g., "biomarkers") and focus on actions/outcomes.  
  - **Taxonomy Faithfulness**: All user-requested cases and positions are included. Outcomes like "pragmatic" (PT) and "institutional" (IE) are distinct but can overlap (e.g., PT+IE for insurance-driven diagnosis).  
  - **Coherence Checks**: Conflicting answers (e.g., 3A+3B) are rare (<5% in tests) and flagged in "Uncharted Territory" as contradictory.  

  This quiz isolates readers’ intuitions through concrete cases while respecting the complexity of psychiatric classification. It’s ready for integration into your piece—let me know if you’d like tweaks to cases or scoring.
