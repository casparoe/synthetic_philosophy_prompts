  - Epistemology: How do we know? (Biological markers, social consensus, patient experience)
  - Ethics/Politics: Who decides? (Profession, patients, institutions)
  - Dynamics: How do categories and people interact? (Static vs. looping effects)

  Cases that can tease apart these dimensions:

  1. **Removal of a category without biological discovery**: E.g., homosexuality removed from DSM by vote. This challenges the idea that categories are solely about biological reality.

  2. **Dissociative condition after media exposure**: E.g., Dissociative Identity Disorder (DID) after "Sybil" book/film. Prevalence rose and then fell. This shows cultural influence on symptom expression and diagnosis.

  3. **19th-century pathologization of resistance**: Dr. Samuel Cartwright's "drapetomania" (running away from slavery). Highlights how categories can enforce social norms.

  4. **Community reclamation**: E.g., autism or ADHD as neurodivergent identities. The community rejects the defect model.

  5. **Clinician disagreement on diagnosis for patient's welfare**: E.g., a patient with symptoms of borderline personality disorder. Clinician A says diagnosis might lead to stigma and worse care; Clinician B says it might open up needed services.

  6. **Cultural variation in symptom expression**: E.g., anorexia in a non-Western setting where weight loss occurs without the fear of fatness (as in some Asian countries). This questions the universality of diagnostic criteria.

  Additional cases to cover other aspects:

  7. **Influence of insurance on diagnosis**: E.g., a patient with subthreshold symptoms might be given a diagnosis to get insurance coverage for therapy.

  8. **Dimensional vs. categorical**: Present a case with overlapping symptoms (e.g., anxiety and depression) and ask whether it's better to see them as two distinct disorders or as points on a spectrum.

  9. **Recovery and the role of diagnosis**: A patient who was diagnosed with a disorder and then recovered. Does the diagnosis still apply? Or was it a temporary state?

  10. **Symptom network vs. latent disease**: Present a case where symptoms seem to feed each other (e.g., insomnia leading to anxiety, leading to more insomnia) and ask whether the underlying cause is a disease or a cycle.

