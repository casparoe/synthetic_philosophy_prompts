  ### **Quiz: What’s Your Theory of Psychiatric Classification?**  
  *For each question, pick the answer closest to your view. Answer based on your gut reaction.*

  1. **The Vanishing Diagnosis**  
     In 1973, psychiatry’s official manual removed "homosexuality" as a disorder after a vote. No new biological evidence emerged—the decision reflected shifting social attitudes. What does this suggest?  
     - A) Categories should change when they cause harm, even without new science.  
     - B) The vote corrected an error; categories must align with biology, not culture.  
     - C) The profession alone shouldn’t decide—affected communities should lead.  

  2. **The DID Boom**  
     After the book/film *Sybil* (1970s), diagnoses of "Multiple Personality Disorder" (now Dissociative Identity Disorder) surged. By the 2000s, clinics reported far fewer cases. What best explains this?  
     - A) Media attention made clinicians better at spotting a rare, real disorder.  
     - B) The media created a "script" for distress, changing how people experienced it.  
     - C) It was overdiagnosis; the core disorder is real but was applied too broadly.  

  3. **Pathologizing Freedom**  
     In 1851, a U.S. physician labeled enslaved people who fled captivity as having "drapetomania," a mental illness. What does this reveal?  
     - A) Psychiatry can enforce oppression by medicalizing normal behavior.  
     - B) It was a scientific mistake; modern biology prevents such errors.  
     - C) Diagnoses reflect who holds power, not just medical facts.  

  4. **Autism as Identity**  
     Many diagnosed with autism reject the "disorder" label, framing it as a natural neurodivergent identity. How should psychiatry respond?  
     - A) Accept the community’s view: remove it from the manual or redefine it as identity.  
     - B) Retain the category; it describes real impairment, regardless of identity.  
     - C) Keep the diagnosis to secure services, but integrate community input.  

  5. **To Diagnose or Not?**  
     Two clinicians agree a patient’s symptoms fit "Borderline Personality Disorder." Clinician A avoids the diagnosis, fearing stigma. Clinician B uses it to access therapy. Who is right?  
     - A) Clinician A: Labels can harm, so avoid if risky.  
     - B) Clinician B: Accurate diagnosis enables care.  
     - C) Neither: The category itself is flawed—it turns suffering into a "disorder."  

  6. **Culture-Bound Symptoms**  
     In a country where anorexia is rare, patients show extreme weight loss but no body-image fear (e.g., they cite stomach pain). Clinicians can’t use the manual’s criteria. What should they do?  
     - A) Diagnose anorexia anyway—the core behavior (starvation) is what matters.  
     - B) Don’t diagnose; the missing fear proves anorexia is culture-specific.  
     - C) Use a different label if it gets patients help.  

  7. **Insurance Mandate**  
     A patient has moderate anxiety but doesn’t meet full criteria for a disorder. To get insurance coverage, a therapist considers assigning a diagnosis. Is this okay?  
     - A) Yes—systems demand diagnoses to fund care; it’s pragmatic.  
     - B) No—diagnoses should reflect truth, not bureaucracy.  
     - C) It reveals a flaw: we need categories for subthreshold suffering.  

  8. **Depression or Grief?**  
     A widow has deep sadness, insomnia, and fatigue for 9 months. The manual calls this "depression" if symptoms persist beyond "normal grief" (2–6 months). Is this valid?  
     - A) Yes—biology distinguishes disordered from normal grief.  
     - B) No—suffering exists on a spectrum; timelines are arbitrary.  
     - C) Use the label if it helps her access therapy.  

  9. **ADHD and Identity Politics**  
     People diagnosed with ADHD increasingly lobby against calling it a disorder, arguing it’s a cognitive difference. Who gets to define it?  
     - A) The diagnosed community—they live it.  
     - B) Clinicians—expertise trumps identity.  
     - C) Both—science and experience should interact.  

  10. **The Symptom Spiral**  
      A patient’s insomnia worsens anxiety, which worsens insomnia. Clinicians debate if this is one disorder, two, or neither. What’s the best approach?  
      - A) Find the "core" disorder (e.g., anxiety) causing the rest.  
      - B) Map the symptom network—no single disorder exists.  
      - C) Pick whichever label best reduces suffering.  

