prompt: |-
  I am assembling a specification that I can hold candidate theories to before reading any of them, and I want you to write the desiderata for a theory of market epistemology: an account of what a price tells you, and of how a market can function as a device for aggregating information that no single participant possesses. Assume the theory has to cover two pictures at once, since these are the two by which any such theory will be judged — the price as a summary of dispersed information, and the price as the reward that pays participants for gathering information in the first place. My purpose is a standard I can apply in an advanced seminar on the economics of information, not a survey of the literature.

  Give me the requirements list. Order it so that the requirements you regard as non-negotiable come first, and mark each of the remaining ones as a preference of one camp rather than a genuine condition of adequacy. For every requirement, give one or two lines on the consideration that forces it — the case, puzzle, or formal result behind it. The list should cover at least the following ground:

  - What a price must be evidence about, and for whom. Say what it tells a participant who has no other source, and whether the theory owes different answers to a specialist and to someone who merely reads the tape.
  - The no-trade results, which say that when traders share a prior, when rationality and the information structure are common knowledge, and when the starting allocation already leaves no unexploited gains, private information by itself will not generate trade. A theory that permits speculative trade must say which of these assumptions it gives up, and whether giving it up is principled or merely convenient.
  - The circularity that a price informative enough to be worth reading is a price that pays nobody to inform it. The theory must say what the equilibrium looks like once information acquisition is costly and endogenous, and whether the resulting equilibrium is stable.
  - The distinction between information about fundamentals and information about other participants' beliefs, including the higher-order case in which the price is read as a forecast of what other readers of the price will do.
  - Whether persistent disagreement is a datum the theory must explain or a premise it may assume. If a theory accounts for trade by differences in priors, say what stops it from explaining everything and therefore nothing.
  - Reflexivity: publishing a price changes what the price is a price of. Say whether this destabilizes the theory's object and how the theory accommodates it.
  - Empirical content: what observation would count as a refutation of the claim that prices aggregate information, and what the theory predicts that a rival does not.
  - Distinctions it must not collapse: informative versus accurate; aggregation of information versus agreement among participants; trade for hedging or risk-sharing versus trade for speculation; a fully revealing equilibrium versus an efficient one.

  Then the part I care about most. Say which requirements cannot be jointly satisfied, and distinguish a genuine impossibility from a difficulty that merely calls for more modeling. My own suspicion is that the informativeness requirement and the incentive requirement are in direct conflict once information is costly, and that any theory retaining common priors, common knowledge of rationality, and no unexploited gains has to get its trade from outside the model entirely. Tell me whether either suspicion survives scrutiny. End by naming the single requirement that does the most to eliminate candidate theories.

  Cap the whole response at 800 words: numbered list plus a closing paragraph, no table, and the impossibility verdict at the end rather than buried in the list.
reasoning: |-
  Hmm, this is a sophisticated request about market epistemology. The user wants a set of criteria to evaluate theories explaining how prices aggregate information and incentivize information acquisition. They're clearly preparing for advanced academic discussion, likely teaching or researching information economics.

  The core tension they're wrestling with - between price informativeness and incentives for information gathering - is fundamental. I recall Grossman-Stiglitz paradox shows this conflict sharply: if prices perfectly reveal information, no one pays to acquire it, but if no one acquires information, prices can't reveal it. That's probably the central impossibility they're hinting at.

  For the desiderata list, I'll start with absolute must-haves:
  - Price must reflect fundamentals (even if imperfectly) to count as information aggregation
  - Must explain why trading occurs (so must violate no-trade theorem assumptions)
  - Needs to handle costly information acquisition endogenously

  Then I'll mark contentious points clearly:
  - Differences in priors vs information as trade drivers (key debate)
  - Reflexivity challenges (often sidestepped in standard models)
  - Empirical testability (surprisingly tricky for this literature)

  The closing should spotlight the incentive-informativeness conflict as the main filter. Their suspicion about this tension is correct - it's why most models relax common priors or common knowledge. That impossibility does survive scrutiny as the major theoretical hurdle.

  I'll keep it dense but precise, hitting all their bullet points while staying under 800 words. The tone should match their academic level - no dumbing down, but clarifying deep trade-offs in the literature.
answer: |-
  Here are the desiderata for a market epistemology theory, ordered by necessity and marked for contentiousness:

  1.  **Must Explain How Price Reflects Fundamentals:** The theory must specify how the price relates to underlying asset value ("fundamentals"), even imperfectly. *Rationale:* Without this anchor, "information" is meaningless. (Grossman-Stiglitz Paradox highlights the tension, but the *need* for this link is absolute).

  2.  **Must Violate No-Trade Theorem Conditions Principledly:** The theory must explicitly reject one assumption of the No-Trade Theorem (common priors, common knowledge of rationality, Pareto optimal initial allocation) as descriptively false or normatively irrelevant for *speculative* trade, and justify this rejection. *Rationale:* Speculative trade exists; the theorem proves it requires violating its assumptions.

  3.  **Must Endogenize Costly Information Acquisition:** The theory must model how costly information gathering is sustained in equilibrium when prices reveal information. It must show the equilibrium (even if noisy or partial) exists and is stable under its assumptions. *Rationale:* Information is costly; a theory ignoring this is incomplete (Grossman-Stiglitz Paradox forces this).

  4.  **Must Distinguish Fundamental from Belief Information:** The theory must clarify how price conveys information about (a) fundamentals and (b) others' beliefs/actions (including higher-order beliefs). It must address how participants interpret these signals. *Rationale:* Prices reflect both realities and expectations about others' expectations (Keynes' beauty contest).

  5.  **Must Specify Price's Epistemic Role for Different Agents:** The theory must state what a price reveals to an uninformed outsider vs. an informed insider, and how specialists differ from tape-readers. *Rationale:* Prices serve different informational functions for different participants (Hayek's dispersed knowledge).

  6.  **Must Not Collapse Crucial Distinctions:** The theory must preserve distinctions between: informative vs. accurate prices; aggregation (pooling diverse signals) vs. agreement (shared belief); hedging/risk-sharing vs. speculative trade; fully revealing vs. efficient prices. *Rationale:* These are conceptually and empirically distinct phenomena central to markets.

  7.  **Must Account for or Assume Persistent Disagreement:** *[Preference: Often "Differences in Priors" Camp]* The theory must either explain persistent disagreement endogenously or justify assuming heterogeneous priors as a driver of trade, while specifying limits to avoid "anything goes" explanations. *Rationale:* Persistent disagreement is observed; heterogeneous priors explain trade but risk unfalsifiability if unconstrained.

  8.  **Must Accommodate Reflexivity:** The theory must address how the act of publishing a price based on beliefs can alter the fundamentals (e.g., via investment, policy, or confidence) and how this feedback loop affects information aggregation. *Rationale:* Prices can influence the value they purport to measure (Soros' Alchemy).

  9.  **Must Have Empirical Content and Discriminatory Power:** The theory must specify observable implications distinguishing it from rivals (e.g., patterns of volatility, volume, forecast errors) and state what evidence would falsify its core claim of information aggregation (e.g., systematic predictable deviations uncorrelated with plausible fundamentals). *Rationale:* A scientific theory must be testable and falsifiable.

  **Impossibility & The Key Filter:**

  Your suspicion is largely correct. Under strict **common priors, common knowledge of rationality, and no unexploited gains from trade (Pareto optimality)**, the No-Trade Theorem *is* a genuine impossibility result for speculative trade driven solely by private information. Relaxing one of these assumptions is *necessary*. However, relaxing Pareto optimality via **endogenous costly information acquisition** (requirement #3) is the most principled and widely accepted path, as it directly models the *source* of the information generating trade. This creates a noisy partial equilibrium (Grossman-Stiglitz), satisfying requirement #1 imperfectly. Relaxing common priors (#7) is common but risks explanatory vacuity; relaxing common knowledge of rationality is harder to model rigorously.

  The **most fundamental conflict** is indeed between the **informativeness of price** (requirement #1) and the **incentive to acquire costly information** (embedded in requirement #3). This is the core of the Grossman-Stiglitz Paradox: a perfectly informative price destroys the incentive to gather the information that makes it informative. This is a *genuine impossibility* under perfect competition and costless observation of price. **Every viable theory must sacrifice perfect informativeness** to sustain incentives, leading to noisy, partially revealing equilibria. This conflict is the **single most eliminating requirement**: any theory claiming prices are perfectly informative while information is costly fails immediately. The necessity of Requirement #3 (endogenous costly information) and its tension with the ideal of Requirement #1 (perfect reflection of fundamentals) is the primary filter for candidate theories.
