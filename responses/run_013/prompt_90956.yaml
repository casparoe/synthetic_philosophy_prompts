prompt: |-
  Okay this is a weird one but it's been bugging me for weeks and I dont have anyone to ask. I'm a backend engineer, zero philosophy training, but I keep noticing that I have pretty strong gut reactions about when I believe something a person tells me and when I go verify it myself, and the reactions definitely dont follow one clean rule. I want you to reverse-engineer whatever rule actually fits them, and tell me where it breaks. I also half-remember that philosophers have some old fight about whether you need positive reasons to trust what people say or whether trusting is just the default -- if my gut is quietly picking a side, say which.

  Here's what I actually do:

  - A teammate pings me at 11pm saying the deploy is broken. I believe it instantly and start digging. No verification.
  - Same message, but from a teammate I've caught being wrong about our stack like three separate times. I go check the dashboard before I touch anything.
  - A guy on the street tells me the museum is closed on Mondays. I believe him and never look it up.
  - Same guy, but he tells me the bridge up ahead is out. I turn around. I also don't check this one, which I realize is the same move as the museum.
  - An anonymous account on a forum tells me my bug is a race condition in the connection pool. I do not believe it until I've read the code myself.
  - My doctor tells me my bloodwork is fine. I believe her, no second opinion. This one is high stakes and I still just believe it.
  - A car salesman tells me the car has never been in an accident. I pull the report.
  - My friend tells me the ramen place on 5th is good. I believe her and go.
  - A stranger on the subway tells me it's 4:15. I believe him, even though I know literally nothing about him. This is the one that makes me think trust might be the default.
  - That same food-savvy friend tells me her doctor said some supplement cures a disease. I dont believe her for a second, and it's not because she'd lie to me.

  My own best guess at my rule is: I beleive people by default, and I only start checking when someone has a reason to lie to me or when I already know they're unreliable. But that doesn't cover the forum guy (no reason to lie, total stranger, and I still don't believe him) or my friend on the supplement thing.

  So: is there one principle that gets all of this, or close? If it needs more than one clause, tell me what each clause is for and which case forces it. Then say what it predicts for two cases I haven't listed -- someone I just met at a meetup telling me my code has a security hole, and the car salesman (who I didn't trust about the car) telling me the DMV is closed today. And be honest about which of my gut calls you'd have to overrule to keep the principle from turning into spaghetti, because I suspect at least one of them is just me being inconsistent.

  Format: give it to me as exactly five numbered points, no intro and no wrap-up, each one just a sentence or two. Point 1 the principle, points 2 and 3 the clauses plus the case that forces each one, point 4 my two new cases, point 5 the verdicts of mine you can't save.
reasoning: |-
  Hmm, the user is a backend engineer with no philosophy background, but they've been noticing their own gut reactions to trusting others and want me to reverse-engineer the underlying principle. They've provided several scenarios to illustrate their behavior, and they've already tried to formulate a rule themselves but found it doesn't cover all cases.

  Looking at their scenarios: They trust teammates about deploy failures unless the teammate has been unreliable before. They trust strangers about mundane facts like museum hours or bridge closures, but not about technical advice like race conditions on forums. They trust doctors about health matters despite high stakes, but distrust car salesmen about accident history. They trust friends about restaurant recommendations but not about medical advice. And they'll trust completely unknown strangers about the time.

  Their proposed rule (default trust unless someone has reason to lie or is unreliable) fails for the forum case (no reason to lie, but they don't trust) and the supplement case (friend isn't lying, but they don't believe).

  I need to identify a consistent principle. Their behavior seems to follow a pattern of **epistemic vigilance** - where trust isn't just about honesty or reliability, but about domain expertise and accessibility of verification. The supplement case shows they're sensitive to whether the person is relaying information outside their expertise, and the forum case shows they require verification when the claim is technical and complex.

  For the principle, I'll propose: **Trust is the default for low-stakes, easily verifiable claims by anyone, but requires verification for high-stakes or expertise-dependent claims unless the source has proven domain competence.**

  This explains:
  - Teammate at 11pm: High stakes but immediate verification needed anyway (so trust speeds response)
  - Unreliable teammate: Past incompetence triggers verification
  - Museum/bridge/time: Low stakes, easy to verify (so trust defaults)
  - Forum bug: Technical claim requires expertise verification
  - Doctor: High stakes but domain competence established
  - Car salesman: Incentive to lie plus high stakes
  - Ramen place: Low stakes, friend's competence assumed
  - Supplement: Friend lacks medical expertise despite honesty

  For the new cases:
  - Meetup security hole: Technical claim would require code verification (similar to forum)
  - Car salesman/DMV: Low-stakes, easily verifiable claim (might trust despite distrust on car history)

  Cases I can't save:
  - The 11pm deploy trust (high stakes but trusted) seems inconsistent with high-stakes caution elsewhere, but I'll note deployment urgency as mitigating factor
  - Stranger time trust while calling trust "default" fits perfectly

  This maintains a clean two-clause principle: default trust for accessible claims, verification for expertise-dependent/high-stakes ones, with overrides for proven unreliability or conflict of interest.

  The structure will be:
  1. Core principle
  2. Clause 1 (default trust) + forcing case (time/museum)
  3. Clause 2 (verification needed) + forcing case (supplement/forum)
  4. Predictions for new cases
  5. Inconsistencies to overrule
answer: |-
  1. **Core Principle:** You default-trust claims that are low-stakes or easily falsifiable, but demand verification for high-stakes, expertise-dependent, or complex claims unless the source has proven domain competence or lacks conflict of interest.  
  2. **Clause 1 (Default Trust Applies):** For mundane, low-effort-to-verify claims (e.g., museum hours, time of day), you trust anyone by default—forced by the stranger on the subway case, where zero context doesn't trigger doubt.  
  3. **Clause 2 (Verification Overrides Default):** You verify when claims require expertise the source lacks, involve high stakes/conflict of interest, or are technically complex—forced by the supplement case (friend lacks medical expertise) and forum case (complex technical claim from unvetted source).  
  4. **New Case Predictions:** For the meetup person saying your code has a security hole, you'd verify (expertise-dependent/complex); for the car salesman saying the DMV is closed, you'd trust (low-stakes/easily falsifiable) despite prior distrust.  
  5. **Overruled Verdicts:** Your 11pm deploy trust (high-stakes but no verification) is inconsistent with high-stakes caution elsewhere; your bridge-trust (same as museum) is saved only if you implicitly classify both as low-risk.
