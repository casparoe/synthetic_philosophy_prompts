answer: |-
  Your analysis of the felony murder rule (FMR) is astute, and the tension you identify with *mens rea* principles is central to enduring critiques. The FMR's philosophical underpinnings are complex and often contested, but we can reconstruct its implicit theory by examining its function and justifications. Below is a breakdown of its presuppositions, tensions, and alternatives.

  ### Philosophical Commitments Presupposed by the FMR
  1.  **Risk-Based Retributivism (Primary Commitment):**
      *   **Presupposition:** Culpability attaches to the *conscious decision to engage in a highly dangerous felony*, not directly to the death itself. The felon demonstrates "recklessness per se" by choosing to commit an act statutorily deemed inherently dangerous to human life.
      *   **Rationale:** The actor who intentionally commits a dangerous felony (e.g., armed robbery, arson, burglary) is morally blameworthy *for creating a foreseeable zone of lethal risk*. The resulting death, even if unintended or unforeseeable in its precise mechanism, is deemed a direct consequence of this morally culpable choice. Punishment is deserved for unleashing that risk upon society.
      *   **Strictly Required:** This view *presupposes* that moral desert can flow from the creation of an unjustifiable, high-risk situation, and that proximate results within that risk zone can be imputed without further *mens rea* as to death.

  2.  **Consequentialism/Deterrence (Strong Compatibility):**
      *   **Fit:** The FMR fits comfortably with consequentialism. It aims to deter dangerous felonies by dramatically increasing the penalty (murder liability) if death occurs. It incentivizes felons to abandon plans, exercise extreme caution, or choose less dangerous crimes. It also incentivizes groups to control co-felons.
      *   **Merely Compatible?** While a powerful justification *for* the rule, consequentialism isn't strictly *presupposed*. A jurisdiction could adopt the FMR purely based on retributive desert for risk-creation, even if it had no measurable deterrent effect. However, historical and modern defenses often lean heavily on this rationale.

  3.  **Enterprise Liability / Agency Theory (Alternative Hybrid):**
      *   **Presupposition/Fit:** This view treats the felony as a "common enterprise" or "criminal undertaking." All participants are responsible for the foreseeable risks and outcomes flowing from that enterprise. The death is attributed to the enterprise itself, and liability is distributed among participants based on their role in initiating it.
      *   **Relation:** This blends retributive (blame for joining the dangerous venture) and consequentialist (holding all responsible for group dynamics) elements. It *presupposes* collective responsibility for outcomes within the scope of a joint criminal venture.

  ### Philosophical Underdetermination: Rival Theories That Could License the FMR
  The FMR is *not* exclusively tied to one theory. Rival positions could support it, revealing philosophical underdetermination:
  *   **Strict Consequentialism:** Focuses solely on deterrence value, regardless of individual desert for the specific death.
  *   **Moral Luck (Retributive):** Argues that the fortuity of death occurring doesn't negate the actor's initial culpability; the bad outcome justly increases punishment severity.
  *   **"Proximate Cause" Retributivism:** Views the death as the direct, legal consequence of the felon's culpable act (the felony), making them morally responsible for it irrespective of foresight.
  *   **Status-Based Theories (Less Common):** Sees commission of a dangerous felony as placing the actor in a status of "enemy of public safety," justifying harsher treatment for any resulting harm.

  ### Tension with *Mens Rea* and Nature of the Inconsistency
  *   **The Tension:** Core criminal law doctrine generally requires culpability (*mens rea*) *for each material element of the offense* (e.g., for murder, intent/knowledge/recklessness regarding death). The FMR explicitly dispenses with this for the death element – liability hinges solely on the intent to commit the underlying felony and causation.
  *   **Is it Inconsistent?**
      *   **Superficially Consistent:** Proponents argue there *is* culpability – transferred from the felony to the death, or inherent in the dangerousness of the felony. The felony's *mens rea* satisfies the requirement *for the homicide* via imputation.
      *   **Deeply Inconsistent (Substantive):** Critics argue this is a legal fiction masking a true inconsistency. The *mens rea* for burglary (intent to commit a felony within a dwelling) is fundamentally different in kind and object from the *mens rea* for murder (intent/knowledge/recklessness regarding causing death). Imputing one to the other violates the principle that culpability must be personal and specific to the harm punished. It punishes intent to steal as equivalent to intent to kill if death accidentally occurs.
      *   **Manifest Inconsistency:** The tension is *real and substantive*, not merely superficial. While jurisdictions maintain rhetoric about *mens rea*, the FMR carves out a significant exception where the "guilty mind" for the core element (death) is constructively presumed or entirely bypassed based on conduct related to a different crime. This creates a doctrinal schism.

  ### Replacing FMR with Strict Death-Culpability Retributivism: Necessary Changes
  A strict retributivist system demanding culpability *for the death itself* would necessitate dismantling or fundamentally altering the FMR:

  1.  **Doctrinal Change:** Abolish the FMR presumption. Liability for murder would *always* require proof of intent, knowledge, or recklessness (depraved heart) *regarding the death*. Deaths occurring during felonies would be analyzed under standard homicide doctrines:
      *   **Intentional Killings:** Murder as usual.
      *   **Unintended Deaths:** Could be:
          *   **Manslaughter (Reckless/Depraved Heart):** If the manner of felony commission showed extreme recklessness *towards human life in general* (e.g., wildly firing a gun during a robbery).
          *   **Manslaughter (Criminally Negligent):** If the death resulted from negligence rising to criminality during the felony.
          *   **No Homicide Liability:** If the death was a truly unforeseeable accident or solely caused by a third party/victim without the felon's reckless contribution (e.g., victim dies of a heart attack upon seeing burglar, officer's bullet misses felon and kills bystander).

  2.  **Sentencing Change:** Even without FMR, the underlying felony remains a serious crime meriting significant punishment. The *aggravation* of a death occurring could be handled at sentencing:
      *   **Sentencing Enhancement:** The sentencing guidelines/framework for the underlying felony could include substantial enhancements if a death results (akin to enhancements for use of a weapon or causing serious injury).
      *   **Consecutive Sentencing:** Mandatory consecutive sentences for the felony and any applicable homicide conviction (e.g., manslaughter).

  3.  **Descriptive Change:** Prosecutors and courts would need to describe liability accurately: "The defendant is convicted of Robbery and of Involuntary Manslaughter for causing death through criminal negligence/recklessness during the commission of that robbery," rather than "Felony Murder."

  ### Conclusion
  The felony murder rule presupposes a **risk-based retributivism** where culpability for creating a zone of lethal danger justifies imputing proximate fatal outcomes, coupled with strong consequentialist aims of deterrence. It is philosophically underdetermined, as consequentialism alone or alternative retributive theories (moral luck, proximate cause) could also support it. Its tension with the *mens rea* principle is substantive and deep, representing a significant exception within jurisdictions that otherwise emphasize subjective culpability. Replacing it with a strict death-culpability retributivism would abolish the rule itself, require proving *mens rea* for homicide under standard doctrines for deaths during felonies, and shift the aggravation of a resulting death to sentencing enhancements for the underlying felony or separate manslaughter convictions. Your understanding of the rule's operation is accurate for common law and many U.S. jurisdictions.
