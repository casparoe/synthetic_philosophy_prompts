  The hybrid zone analogy is strong, so I should tackle it head-on. In ecology, sterile hybrids are dead ends because biology has hard constraints (e.g., chromosomal mismatch). But in ethics, values are more flexible—they’re about priorities we assign, not fixed traits. A defender would argue that even when compromises feel "sterile," it’s often because we haven’t found the right trade yet, not because it’s impossible.  

