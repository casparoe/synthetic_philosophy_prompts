  The user’s deeper need here is intellectual rigor—they’re testing their idea against a robust opponent. They might also be wrestling with real-world frustrations (e.g., political polarization) where compromises failed, making them skeptical of the theory. I should push back hard but fairly, emphasizing that the burden of proof is on the skeptic to show why a specific conflict *can’t* be resolved with creative bargaining.  

  Crucially, I must avoid caricaturing the bargaining position. I'll concede that compromises can *feel* sterile when poorly designed (like splitting the difference), but insist that better processes (integrative bargaining) can uncover gains. If the user’s objection is weak, I'll say so—for example, if they assume values can’t be compared without shared units, I'll counter that we make such judgments daily (e.g., trading money for time).  

