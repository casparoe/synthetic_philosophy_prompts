answer: |-
  Fair challenge! As a defender of the bargaining picture, I don't claim compromise is *always* painless or perfect, only that it's *almost always rationally available* – a better alternative to mutual destruction or stalemate. Your hybrid zone analogy is sharp, but let's dissect it. The "sterile hybrid" in moral compromise often arises from **distributive bargaining** – simply splitting the difference on a *single dimension* where the values truly are incommensurable. *That* can feel sterile. But the bargaining toolkit avoids this by leveraging **multi-dimensionality** and **differences in intensity**.

  Consider a real clash: Developers want to build dense housing on a forested hillside; conservationists demand its permanent protection. A sterile "hybrid" might be building half the units, satisfying neither deeply and degrading both values. But look deeper: The developers care intensely about *profit* and *housing volume*; conservationists care intensely about *biodiversity* and *permanence*. The surplus comes from trading *across* these dimensions. Package deal: Developers build *higher density* on a *less sensitive, already degraded adjacent parcel* (boosting their profit/volume), funding a legally binding, *permanent conservation easement* on the pristine hillside (securing core conservationist values). Neither gets their initial maximal demand, but both achieve core objectives more fully than war or stalemate allows.

  How do you tell a "sterile" compromise from a productive one from the inside? Look for **mutual contingent gain**. Does the agreement create outcomes *each side prefers to their realistic no-deal alternative*? Does it leverage differences in priorities (developers care more about scale, conservationists about specific land)? If the compromise feels like a loss on a single sacred value with no compensating gain elsewhere, *that's* the sterile hybrid. But that signals bad bargaining, not the impossibility of trade. The burden is on the skeptic to show why, in a complex world of many values and issues, *no* such contingent gain exists – why fighting *always* yields a better expected outcome for both sides than *any* potential trade. Your ecology shows sterile hybrids exist; our political and legal history shows fertile compromises do too. The apparatus exists to find them.

  *(Time for your counter? Where does this land, ecologist?)*
