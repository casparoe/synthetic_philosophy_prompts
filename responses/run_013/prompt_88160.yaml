answer: |-
  ## Joint Statement on Theological Voluntarism and Non-Voluntarism Regarding the Euthyphro Dilemma

  After sustained and good-faith dialogue concerning the relationship between divine will and morality, we, a theological voluntarist and a non-voluntarist, affirm the following points of agreement regarding the Euthyphro dilemma and its implications, while acknowledging a fundamental residual disagreement.

  **I. Agreed Claims Concerning the Euthyphro Dilemma**

  1.  **Logical Form:** The dilemma presents a forced choice between two mutually exclusive and exhaustive horns: (A) Actions are morally good/obligatory *because* God commands/wills them. (B) God commands/wills actions *because* they are morally good/obligatory.
  2.  **What it Establishes:** The dilemma successfully demonstrates that the relationship between divine will and moral status cannot be one of simple identity or mutual entailment without generating problematic consequences on either horn. It forces clarification on the nature of dependence and explanation.
  3.  **What it Does Not Establish:** The dilemma itself does not *prove* the falsity of either theological voluntarism or non-voluntarism. It highlights the conceptual costs and commitments inherent in each position but does not constitute a decisive refutation of either in isolation.
  4.  **Senses of Key Terms:**
      *   **Arbitrariness (Problematic):** Refers to the potential implication (on Horn A) that moral truths lack any intrinsic rationale and could have been otherwise solely based on divine fiat, rendering them potentially capricious or lacking necessary connection to value.
      *   **Independence:** Can signify (a) *causal independence* (moral truths are not brought into existence by divine acts) or (b) *explanatory/constitutive independence* (the nature or truth-maker of moral facts is not God's will).
      *   **Explanatory Priority:** Concerns which fact (divine command or moral status) provides the fundamental *reason why* the other obtains. The dilemma questions which fact grounds the other.
  5.  **Causal Source vs. Constitutive Ground:** We distinguish:
      *   **Causal Source:** God's command can be the event or act that *brings about* knowledge of, or human obligation to, a moral fact in time (e.g., promulgating a law).
      *   **Constitutive Ground:** God's command can be proposed as *what makes it the case* that the moral fact *is* a fact – it is the ontological foundation or truth-maker.
      The Euthyphro dilemma primarily targets the claim that divine will is the *constitutive ground* of moral facts (Horn A).
  6.  **Engaging vs. Evading the Dilemma:** Replies that genuinely engage the dilemma must address the question of *constitutive grounding* and *explanatory priority*. Replies that change the subject include:
      *   Focusing solely on God's *causal* role in revealing or enforcing morality.
      *   Appealing solely to God's goodness or wisdom without specifying how this relates to the grounding of moral facts themselves.
      *   Claiming the dilemma misunderstands "command" without offering an alternative account of grounding.
      *   Asserting divine simplicity as a solution without explaining how it resolves the grounding question.

  **II. Precise Statement of Residual Disagreement**

  | Position          | Core Commitment                                                                                                                               | Core Rejection                                                                                                                               |
  | :---------------- | :-------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Voluntarist:**  | The constitutive ground of all moral properties (e.g., obligatory, good, forbidden) is ultimately the divine will (command, decree, or disposition). God's commanding X *makes* X obligatory. | Moral properties have their truth-makers in principles or facts that are explanatorily prior to and independent of any divine will or attitude. |
  | **Non-Voluntarist:** | Moral properties have truth-makers (e.g., necessary truths about value, flourishing, or reasons) that are explanatorily prior to and independent of any divine will. God commands X *because* X possesses the independent property of being good/obligatory. | The divine will is the constitutive ground of moral properties.                                                                              |

  **III. Cruxes of the Disagreement & Proposed Tests**

  1.  **The "Nature" Gambit: Escape or Relocation?**
      *   **Voluntarist Assessment:** Grounding morality in God's *nature* (rather than contingent will) relocates but does not escape the dilemma. The question becomes: "Is God's nature good because it is God's nature, or is God's nature good because it conforms to an independent standard of goodness?" If the latter, independence is conceded. If the former, the nature itself becomes arbitrary in the constitutive sense.
      *   **Non-Voluntarist Assessment:** Grounding in God's *necessary* nature potentially escapes the arbitrariness horn (the nature isn't chosen) but may still succumb to the independence horn if God's nature *must* conform to an independent standard. If God's nature *defines* goodness necessarily, this might be coherent but collapses into a unique form of voluntarism where the divine nature, not command, is the ground. The dilemma persists in modified form.
      *   **Shared Assessment:** This move shifts the locus of debate but does not definitively dissolve the core dilemma regarding grounding and independence. Its success depends on one's view of necessity and the relationship between essence and value.
      *   **Further Crux:** Can God's nature *necessarily* ground moral truths without implying those truths are independent of God? What is the modal status of moral truths grounded in a necessary divine nature?

  2.  **The Modal Version: Fair Test or Trick?**
      *   **The Test:** "Could moral truths (e.g., 'torturing innocents for fun is wrong') have been different had God's will (or nature) been different? If yes, doesn't this imply voluntarism? If no, doesn't this imply the truths are necessary and independent?"
      *   **Voluntarist View:** The test is fair. If moral truths *could not* be different even had God's will/nature been different, this demonstrates their independence from the divine will. Voluntarists typically hold moral truths *are* contingent upon God's actual will/nature and *could* have been otherwise.
      *   **Non-Voluntarist View:** The test is valid and crucial. It reveals that necessary moral truths (which non-voluntarists typically affirm) *must* hold regardless of any hypothetical changes to divine will or nature, demonstrating their independence. They see the inability to conceive coherently of such truths changing as evidence for their necessity and independence.
      *   **Shared Assessment:** The modal test is a legitimate and powerful probe into the modal dependence of morality on the divine. Agreement on the *results* of the thought experiment (whether moral truths are necessary or contingent) is unlikely, but both sides agree the test bears directly on the core question of grounding and dependence.

  3.  **Additional Crux: Moral Epistemology & Divine Freedom**
      *   **The Questions:** How do we *know* fundamental moral truths? If non-voluntarism is true, can humans access these independent truths independently of divine revelation? If voluntarism is true, does God have any *reason* for commanding as God does, and if so, is that reason itself grounded in something prior (potentially conceding independence)? Can God command *anything* without contradiction (e.g., self-contradictory commands, commands against God's own nature)?

  **IV. Test Cases & Predictions**

  1.  **Case A: The Monstrous Command (e.g., "Torture this innocent child gratuitously for fun")**
      *   **Shared Test:** Does this command *create* a moral obligation, or is it inherently incapable of doing so?
      *   **Voluntarist Prediction:** If genuinely commanded by God, this act *would become* morally obligatory, however counterintuitive. God's command is the constitutive ground of obligation. (The voluntarist may add that God's nature makes such a command impossible, but this is a separate claim).
      *   **Non-Voluntarist Prediction:** Such a command *could not* create a genuine moral obligation because the act possesses the independent property of being intrinsically, necessarily wrong. Any purported command of this nature either cannot come from God or does not generate obligation.
      *   **Bearing on Cruxes:** Directly tests the constitutive grounding claim (Voluntarism) vs. independent moral facts (Non-Voluntarism). Deeply connected to the modal test.

  2.  **Case B: The Morally Indifferent Command (e.g., "Step on the cracks in the pavement today")**
      *   **Shared Test:** Does this command *create* a genuine moral obligation where none existed before?
      *   **Voluntarist Prediction:** Yes. God's command constitutes the obligation. The act transitions from morally indifferent to obligatory solely by divine fiat.
      *   **Non-Voluntarist Prediction:** No. While one might have a *prudential* or *religious* reason to obey (e.g., respecting authority), no distinct *moral* obligation is created. The act remains morally indifferent in itself. Obedience might be morally good *if* it stems from a virtuous motive (e.g., piety), but the *content* of the act remains non-moral.
      *   **Bearing on Cruxes:** Tests the scope of divine command in grounding obligation (Voluntarism) and the independence of the moral domain (Non-Voluntarism). Highlights differing views on what constitutes a "moral" property.

  **V. Verbal vs. Substantive Disagreement**

  We agree that **some potential confusion stems from differing uses of key terms:**

  *   **"Grounding":** May sometimes be conflated with *causal explanation* or *epistemic justification* rather than strictly *ontological constitution* or *truth-making*. Clarifying that we mean *constitutive grounding* mitigates this.
  *   **"Dependence":** Can blur *causal*, *epistemic*, and *ontological/metaphysical* dependence. Our agreement on distinguishing causal source from constitutive ground (I.5) addresses this significantly.
  *   **"Explanatory Priority":** Can refer to the order of *human discovery* or *temporal enactment* vs. the order of *metaphysical fundamentality*. Our focus is on the latter.

  **However, we conclude that the core disagreement is substantive, not merely verbal:**

  1.  **Fundamental Ontology:** We disagree on the *most fundamental layer of reality* concerning moral properties. Is it an act of divine will, or is it a domain of truths (perhaps necessary truths about reasons, value, or flourishing) that even God relates to?
  2.  **Modal Status:** We disagree on whether core moral truths are *contingent* upon the divine will/nature (Voluntarism) or *necessary* and thus *invariant* regardless of divine will/nature (Non-Voluntarism), as highlighted by the modal test.
  3.  **Source of Normativity:** We disagree on the ultimate source of moral *obligation*. Does it flow *from* the divine command, or is the divine command an expression *of* an obligation grounded elsewhere?

  While careful definition minimizes verbal confusion, the dispute over what *constitutively grounds* moral facts and properties reflects a deep and genuine divergence in metaphysical and theological commitments.

