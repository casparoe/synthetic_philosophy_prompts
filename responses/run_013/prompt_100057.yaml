prompt: |-
  Write the deadpan official instructions for Form DS-1, the petition by which a field of inquiry is certified as science or reclassified as pseudoscience, for a fictional national standards bureau. The piece should read like a real government form drafted by a mid-level civil servant -- numbered sections, tick-box criteria, a field where the petitioner lists the theory's testable predictions, and a notes area for the reviewing officer -- roughly 600 words, with the comedy coming entirely from the substantive criteria and never from jokes about bureaucracy or winks to the reader. Let the form's questions quietly enact the actual demarcation debate, so that a philosopher of science recognises a bureau that has absorbed the literature and still cannot complete its own paperwork: the falsifiability criterion, together with the twin embarrassments that a horoscope issues checkable predictions while an untestable mathematical theory of everything is still physics; the progressiveness or degeneracy of a research programme; the difference between abandoning a refuted theory and rescuing it with an ad hoc patch; and what, if anything, a community's consensus adds to a claim's status. State none of the objections outright. Let the reviewing officer's marginal notes on four sample petitions carry the reductio: an astrologer, a group defending Fomenko's New Chronology (the claim that the conventional ancient and medieval timeline is largely fabricated and internally duplicated), a cosmologist defending an untestable multiverse, and a folklorist petitioning to have Atlantis formally demoted.
reasoning: |-
  Okay, the user wants me to create a fictional government form called Form DS-1 that certifies fields of inquiry as science or pseudoscience. They want it to feel like a real bureaucratic document drafted by a mid-level civil servant, with numbered sections and check-box criteria. The comedy should come from the substantive criteria themselves, not from jokes about bureaucracy.

  The form needs to include:
  - Numbered sections
  - Tick-box criteria
  - A field for listing testable predictions
  - A notes area for reviewing officers

  The humor should emerge from how the form handles the actual demarcation problems in philosophy of science. I need to subtly incorporate concepts like:
  - Falsifiability criterion (with the astrologer vs. untestable physics paradox)
  - Progressive vs. degenerative research programs
  - Ad hoc hypothesis distinction
  - The role of consensus

  Then I'll need to create marginal notes from a reviewing officer on four sample petitions:
  1. An astrologer
  2. Defenders of Fomenko's New Chronology (which claims conventional history is fabricated)
  3. A cosmologist defending an untestable multiverse theory
  4. A folklorist seeking to demote Atlantis

  The challenge is to make the form look completely serious while the criteria reveal the absurdities in trying to bureaucratize scientific demarcation. The reviewing officer's notes should carry the reductio ad absurdum without explicit commentary.

  I'll structure the form with standard bureaucratic sections:
  - Purpose statement
  - Petitioner information
  - Core criteria (with checkboxes)
  - Predictions section
  - Supporting evidence
  - Reclassification requests
  - Certification section
  - Instructions for reviewers

  For the criteria, I'll create checkboxes that force petitioners into philosophical traps:
  - About testable predictions (with options for "none" and "ongoing refinement")
  - How abandoned predictions were handled
  - Novel predictions vs. reinterpretations
  - Consensus claims
  - Mathematical elegance as evidence

  The reviewing officer's notes will show:
  - For astrology: acknowledging testable predictions but noting degenerative adjustments
  - For New Chronology: pointing to ad hoc patches to rejected evidence
  - For multiverse: struggling with untestable mathematical elegance
  - For Atlantis: noting complete lack of testable predictions

  I'll keep the language dry and bureaucratic throughout, avoiding any winking at the reader. The comedy comes entirely from the substance of what's being asked and how the criteria expose the contradictions in demarcation debates. Word count around 600 words.
answer: |-
  **Form DS-1: Petition for Scientific Status Certification/Reclassification**
  **Issued By:** National Standards Bureau (NSB), Office of Epistemic Integrity
  **NSB Form Control No.:** OEID-1023-Rev7
  **Effective Date:** [Current Date]
  **OMB Approval No.:** 1910-XXXX | **Expires:** XX/XX/XXXX
  **Penalty for Knowingly Submitting False Information:** Fine not exceeding $10,000 or imprisonment not exceeding 5 years, or both. (18 U.S.C. § 1001)

  **SECTION 1: PURPOSE**
  This form constitutes the sole mechanism for petitioning the NSB to formally certify a defined Field of Inquiry (FoI) as Science or to petition for the reclassification of a currently recognized Scientific FoI to Pseudoscience. Certification/Reclassification determines eligibility for certain federal research funding streams (refer to NSB Directive 451.7c) and standardized educational classification (refer to NSB Circular ED-88).

  **SECTION 2: PETITIONER INFORMATION (Complete for Lead Petitioner)**
  2.1. Full Legal Name: _______________________________________________________
  2.2. Affiliation (Institution/Organization/Independent): _________________________
  2.3. Role/Title within the FoI: ______________________________________________
  2.4. Contact Information (Address/Phone/Email): _______________________________
  2.5. FoI Designation (Proposed or Subject of Reclassification): ___________________
  *(e.g., "Neo-Tychonic Gravitational Dynamics," "Applied Aqueous Mnemotherapy," "Atlantean Topology")*

  **SECTION 3: CORE CERTIFICATION CRITERIA (Check ALL that apply to the FoI)**
  The FoI demonstrates:
  *   **[ ] 3.1.a** A primary reliance on empirical observation and/or experimentation as the ultimate arbiter of claims.
  *   **[ ] 3.1.b** A foundational dependence on non-empirical, axiomatic principles (e.g., mathematical elegance, logical necessity). *(If checked, proceed to 3.1.b.1)*
      *   *3.1.b.1* Describe how these principles interface with empirical validation: _________________________________________________________
  *   **[ ] 3.2** A consistent history of generating novel, empirically testable predictions distinct from post-hoc explanation.
  *   **[ ] 3.3** Mechanisms for the systematic identification and retirement of core tenets demonstrated to be incompatible with observation/experiment, without resorting solely to auxiliary modifications preserving the core.
  *   **[ ] 3.4** A documented pattern of successfully assimilating unexpected empirical findings into its theoretical structure, leading to novel predictive capacity (e.g., novel phenomena predicted).
  *   **[ ] 3.5** A documented pattern of auxiliary modifications made primarily to preserve core tenets from empirical challenge, without generating significant novel predictive capacity.
  *   **[ ] 3.6** Explicit criteria defining what potential future evidence would necessitate abandonment or fundamental revision of its core tenets.
  *   **[ ] 3.7** Widespread acceptance of its core tenets as provisionally valid by the community of specialists engaged in empirical investigation directly relevant to the FoI.

  **SECTION 4: PREDICTIVE CAPACITY**
  4.1. List up to FIVE (5) specific, empirically testable predictions generated by the FoI within the last decade. Specify the predicted phenomenon, the method of test, and the approximate timeframe for potential falsification/confirmation:
      *   Prediction 1: _________________________________________________________ Method: _______________ Timeframe: ______ Status: [ ] Pending [ ] Confirmed [ ] Falsified
      *   Prediction 2: _________________________________________________________ Method: _______________ Timeframe: ______ Status: [ ] Pending [ ] Confirmed [ ] Falsified
      *(Continue as needed)*
  4.2. For any prediction listed in 4.1 marked "Falsified," describe the FoI's response (e.g., theory abandoned, core tenet modified, auxiliary hypothesis added, experimental error claimed): _________________________________________________________
  _________________________________________________________________________
  4.3. Does the FoI generate predictions fundamentally untestable in principle with current or foreseeable technology/physics? **[ ] Yes** **[ ] No** *(If Yes, explain necessity and relationship to testable elements):* _________________________________________________________

  **SECTION 5: SUPPORTING EVIDENCE (Attach separate sheets if necessary)**
  5.1. Summary of key empirical findings supporting the FoI's core tenets (Cite major studies/meta-analyses): _________________________________________________________
  _________________________________________________________________________
  5.2. Summary of key empirical findings challenging the FoI's core tenets (Cite major studies/meta-analyses and FoI response): _________________________________________________________
  _________________________________________________________________________
  5.3. Evidence of novel explanatory/predictive power gained through theoretical development in the last 20 years: _________________________________________________________
  _________________________________________________________________________

  **SECTION 6: REQUEST FOR RECLASSIFICATION (ONLY complete if petitioning to downgrade an existing Scientific FoI to Pseudoscience)**
  6.1. Name of FoI to be reclassified: ___________________________________________
  6.2. Cite specific criteria from Section 3 that the FoI demonstrably fails to meet: _________
  _________________________________________________________________________
  6.3. Provide documented evidence of persistent reliance on auxiliary modifications protecting core tenets from falsification (Section 3.5), lack of novel predictions (Section 3.2/3.4), or absence of falsifiability criteria (Section 3.6): _________________________________________________________
  _________________________________________________________________________

  **SECTION 7: PETITIONER CERTIFICATION**
  I certify under penalty of law that the information provided on this form is true and correct to the best of my knowledge and belief. I understand that the NSB's determination rests solely on the criteria outlined herein and established NSB procedures.

  Signature of Lead Petitioner: _________________________ Date: ____________
  Printed Name: _______________________________________

  **FOR NSB OFFICIAL USE ONLY - REVIEWING OFFICER (RO)**
  **RO Assignment:** _______________
  **Initial Receipt Date:** ___________
  **Review Completion Date:** ________
  **Determination:** [ ] Certified as Science [ ] Certified as Pseudoscience [ ] Insufficient Data - Deferred [ ] Petition Invalid (Specify): ___________________
  **Determination Code:** ___________ (Refer NSB Internal Code Manual OEID-1023-A)

  **RO NOTES & ANALYSIS (Required for all petitions. Justify determination citing specific Sections/Responses. Include relevant marginalia.)**
  _________________________________________________________________________
  _________________________________________________________________________
  _________________________________________________________________________
  _________________________________________________________________________
  _________________________________________________________________________
  _________________________________________________________________________
  _________________________________________________________________________
  _________________________________________________________________________

  **(RO NOTES ON SAMPLE PETITIONS)**

  *   **Petition: Astral Influence Dynamics (Astrology)**
      *(RO Marginalia Sec 3.1.a: Checked - cites birth chart/event correlations. Sec 4.1: Lists 5 predictions re: personality traits & event likelihoods w/ stats methods. Status: 2 Confirmed (weak effect sizes), 3 Falsified)*
      *(Sec 4.2 RO Note: Falsified predictions attributed to "insufficiently nuanced chart reading" or "external mitigating factors" - auxiliary modifications noted. Sec 3.4 RO Note: Pattern noted: failed predictions lead to rule refinement, not novel *predictions*. Novelty confined to interpretive techniques. Sec 3.5 Box checked by RO. Consensus (3.7) claimed but disputed within cited specialist community. Predictive capacity exists but trajectory suggests degeneracy per 3.5.)*

  *   **Petition: Historical Temporal Reckoning (Fomenko New Chronology)**
      *(Sec 3.1.a Checked - cites astronomical calc., carbon dating re-analysis. Sec 4.1: Predictions re: document forgery detection methods, archaeological layer duplication. Status: Pending/Falsified)*
      *(Sec 4.2 RO Note: Falsified carbon dates attributed to "contamination/calibration error" or "deliberate falsification of samples". Sec 3.3 RO Note: Core tenet (fabricated timeline) remains unchanged despite multiple falsified predictions re: expected evidence. Abandonment criteria (3.6) vague: "failure of all dating methods" - but failures attributed to methods/actors, not core. Sec 3.5 strongly indicated.)*

  *   **Petition: Eternal Inflationary Multiverse Cosmology**
      *(Sec 3.1.b Checked. 3.1.b.1 RO Note: Cites mathematical consistency w/ inflation & string theory as primary validation; empirical validation indirect via implications for fundamental constants. Sec 4.3: Yes. Lists predictions contingent on highly specific, untestable bubble collision signatures or observationally inaccessible domains.)*
      *(Sec 3.2 RO Note: Novel predictions cited are largely untestable per 4.3. Predictive capacity for *our* universe is limited/indirect. Sec 3.6 RO Note: Abandonment criteria hinge on failure of underlying inflation/string theory, not directly on multiverse non-detection. Sec 3.7 Box checked - specialist consensus strong on mathematical validity, divided on empirical relevance. Core challenge: Untestable in principle.)*

  *   **Petition: Reclassification of Atlantean Studies (to Pseudoscience)**
      *(Sec 6.1: Atlantean Studies. Sec 6.2: Fails 3.1.a (primary reliance), 3.2 (novel testable predictions), 3.6 (falsifiability criteria), 3.7 (specialist consensus). Sec 6.3: Cites persistent core tenet (existence c. 9600 BC) despite lack of evidence, auxiliary modifications (varying locations, cataclysms) to explain absence.)*
      *(Sec 4.1 RO Note: Petitioner (Reclassifier) correctly notes target FoI lists no specific, testable predictions beyond generic "future archaeological find." Sec 3.1.a RO Note: Primary reliance on textual interpretation/myth comparison, not empiricism. Sec 3.6 RO Note: Core tenet abandonment typically contingent only on *proof* of non-existence - unfalsifiable standard. Reclassification petition demonstrates failure of criteria.)*
