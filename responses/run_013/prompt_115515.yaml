prompt: |-
  I'm a fifth-year PhD student in sociology — I study how research labs organize credit and authorship — and I need an outside read on an argument I keep having with my labmate, because I'm fairly sure I'm right and also fairly sure thats the whole problem.

  Here's the setup. Our lab has undergrads who do the coding and data entry. On the project I run, the undergrad who's done most of the coding gets an acknowledgment line, not authorship. That's how the project was set up before I inherited it, and I haven't changed it.

  Priya, my labmate, has started coming at me about this. In lab meeting, in Slack, over coffee. Her line is that I'm exploiting the undergrads and that I should push for them to be authors, and that she isn't sure she can stay on the project if I don't.

  Four things are eating at me.

  1. Two years ago Priya ran a study where an undergrad did all the coding and got a thank-you in the appendix. When I brought this up she said — and I believe her, which is the infuriating part — that she was wrong then, she changed her mind after a seminar, and that's exactly why she's saying something now. So she isn't doing the thing she's on my case about. She did it, stopped, and now she's coming after me for it.

  2. She's a co-author on my project. She'll be on the paper the undergrad's coding makes possible. So she's benifiting from the arrangement she's complaining about. That seems like it should matter, but I can't tell which direction it cuts — either she's implicated so she should pipe down, or she's implicated so she's the only one with any business saying it, since she's not pretending to be clean.

  3. She says she isn't going to do anything. Not going to the advisor, not emailing the undergrad, not filing anything. She just thinks less of me now and wants me to know it. There's no demand I can actually comply with. Does that change the picture, or is that just a detail?

  4. Our advisor does exactly this to all of us — one of her papers has a former student who coded for a year and got an acknowledgment — and Priya has never said a word to her about it. That's the one I keep coming back to when I'm mad.

  My girlfriend, who's in the philosophy department, so grain of salt, said something about Priya not being "in a position" to hold this against me, and I honestly can't tell whether that's a real distinction or a fancy way of saying "she started it." There's a name for what's bugging me here and I can't find it.

  So: which of these four actually lands, and which is just me being defensive? I want the honest answer, not the one that lets me off the hook — if the answer is "she's right, change the policy," say that and say why. And what do I actually say to her at lab meeting next week? Please don't give me "communicate openly and use I-statements"; I want to know what's morally doing the work in this situation. End with one line in this format — \answer{...} — with a short phrase saying whether I owe her a response, a change, or nothing, like \answer{reply but no change}.
reasoning: |-
  Okay, let me unpack this sociology PhD student's lab authorship dilemma. The core tension revolves around whether undergrad coders deserve authorship or just acknowledgment, with labmate Priya now challenging the status quo after having followed the same practice herself two years prior. 

  Hmm... four main friction points here. First, Priya's past inconsistency - she did the exact thing she's criticizing now but claims she's evolved. Interesting how she frames it as moral growth rather than hypocrisy. Second, her co-authorship creates this weird dynamic where she benefits from the system she condemns. Third, she's making it personal rather than procedural - no demands, just judgment. And fourth, the advisor's identical practice goes unchallenged.

  *scratches head* The philosophy girlfriend's "position" comment feels key. Priya's criticism lands differently because she's: a) currently benefiting from the arrangement, b) not applying the standard upward to their advisor, and c) making it about personal virtue rather than systemic change. That's not hypocrisy per se, but it's... performative? Selective?

  What's eating the user most is point #3 probably - the fact Priya won't act but still judges. That turns it from an ethics debate into a character indictment. Meanwhile the user's stuck maintaining existing policy while feeling attacked.

  *flips through imaginary ethics handbook* Academically speaking... authorship standards technically require intellectual contribution, not just labor. But the real issue here is power dynamics - the user inheriting a system, Priya's selective activism, the advisor's unexamined authority. 

  *steeples fingers* The resolution needs to address both the structural issue (should lab policy change?) and the interpersonal mess (how to engage Priya). Structurally: the undergrad probably should be co-author if their coding involved substantive decisions. Interpersonally: Priya's stance feels morally compromised by her silence toward the advisor.

  Final thought: The user's anger at point #4 reveals what's really grating - the power imbalance where junior researchers enforce standards on peers that they won't challenge upward. That's the unnamed dynamic. The advisor's policy creates the conditions for this conflict between trainees.
answer: |-
  Here's the ethical breakdown of your four points and the core issue:

  1.  **Priya's Past Action:** This *doesn't* invalidate her current stance. People genuinely changing their views based on new understanding is intellectually honest. Her past mistake actually strengthens her argument *if* she's consistent *now*. The problem lies in her *current* inconsistency (Point 4).
  2.  **Priya as Co-Author:** This cuts both ways but leans toward **making her stance weaker**. She is materially benefiting from the system she condemns *without* taking concrete action to change it (beyond criticizing you). This creates **moral licensing** (the feeling that criticizing others offsets her own complicity) and **hypocrisy**. If it's exploitation, she's participating in it. Her position would be stronger if she refused co-authorship under these conditions.
  3.  **Priya's Lack of Action:** This is **crucial and damaging to her position**. Criticizing you personally without demanding change, escalating, or refusing to benefit makes it seem like **virtue signaling** rather than a sincere ethical stand. It turns the issue into a personal judgment of *your* character ("I think less of you") rather than a fight for the undergrad's rights. It absolves her of the harder work of systemic change.
  4.  **The Advisor's Practice & Priya's Silence:** This is **the core inconsistency** and points to the unnamed dynamic. Priya is challenging a peer (you) over a practice she accepts unquestioningly from a figure with power over her career (the advisor). This is **selective enforcement** driven by power dynamics, not pure principle. It suggests her activism has limits defined by self-preservation, undermining the moral high ground she claims. The term you might be groping for is **moral cowardice** or **complicity through selective outrage**.

  **The Moral Core:**

  *   **The Undergrad:** Is the current policy fair? **Likely not.** If the undergrad made significant intellectual contributions beyond simple data entry (e.g., designing coding schemes, solving complex categorization problems, contributing to analysis decisions), authorship *is* ethically warranted under most disciplinary standards (ICMJE/CRediT). Simple execution of well-defined coding tasks typically warrants acknowledgment. **Re-evaluate the *actual* contribution.**
  *   **Priya's Position:** Her critique *of the policy* might be ethically sound, but her *approach* and *inconsistency* are ethically problematic. She is:
      *   Benefiting from the system.
      *   Judging you personally without demanding actionable change.
      *   Failing to challenge the power structure (the advisor) perpetuating the same practice.
      *   This creates a dynamic of **performative allyship** – expressing moral outrage without bearing the costs of changing the system. Her position lacks **moral courage**.

  **What to Do & Say:**

  1.  **Re-evaluate the Undergrad's Contribution:** Honestly assess: Did their coding involve significant intellectual judgment, problem-solving, or conceptual input beyond mechanical execution? If yes, **push for authorship**. This is the ethically correct action, regardless of Priya. If it was truly mechanical, acknowledgment *is* standard.
  2.  **Address Priya Directly & Structurally (Not Personally):** At lab meeting or privately:
      *   *Acknowledge the Policy Issue:* "Priya, you've raised concerns about authorship for our undergrad coders. It's a valid point about lab policy and standards."
      *   *Shift Focus to Systemic Change:* "This seems like a broader lab issue, not just about this specific project. Dr. [Advisor]'s projects follow the same standard you've rightly questioned. If we believe this policy needs changing, we should discuss it as a lab and propose clear authorship guidelines to Dr. [Advisor] for all projects going forward. Are you willing to co-draft a proposal with me to present to her?"
      *   *Call Out the Inconsistency (Carefully):* "I have to be honest, Priya. It's difficult to reconcile your strong personal stance on this with your silence on the identical practice by Dr. [Advisor] and your continued co-authorship on this project under the current policy. If this is exploitation, we're both implicated. Meaningful change requires addressing it at the source, consistently, and being willing to potentially sacrifice our own positions on papers if necessary. Are you prepared to push for that broader change and apply the standard uniformly?"

  **Why this approach?**

  *   It moves beyond personal attack/defense to the actual ethical issue (undergrad contribution).
  *   It exposes the power dynamic and Priya's selective enforcement by demanding systemic action involving the advisor.
  *   It shifts the burden: If Priya refuses to push for lab-wide change or challenge the advisor, her critique of *you* is revealed as personal, not principled.
  *   It focuses on solutions (policy change) rather than personal judgment.

  **Conclusion:**

  Priya's critique of the *policy* might be valid, but her inconsistency, personal judgment without action, and failure to challenge the power structure undermine her moral authority in this conflict. You should reassess the undergrad's contribution independently and, if warranted, advocate for authorship. Your core obligation is to the undergrad contributor and ethical research practice, not to appease Priya's performative stance. Engage her on the systemic level to expose the true dynamic.

  \answer{Change policy if warranted; challenge her on systemic change}
