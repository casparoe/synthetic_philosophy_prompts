answer: |-
  ### Essay Question  
  **"The concept of 'democratic backsliding' relies on three contested premises: a baseline of prior democracy, a measurable standard of democratic health, and a legitimate authority to judge decline. Using *only* the hypothetical cases below, critically evaluate how each premise is challenged:  
  (A) *Case Alpha*: A government wins power in a free and fair election. It uses its legislative majority to weaken judicial independence, restrict media pluralism, and bias electoral administration. After one term, the opposition wins a narrow victory despite these changes. The new government immediately uses similar tactics, claiming it must 'restore democratic integrity' by countering institutional sabotage.  
  (B) *Case Beta*: A state has functioned for decades with dominant single-party rule, limited electoral competition, and constrained civil liberties—but without overt violence or election theft. Recent constitutional reforms further centralise executive power, though core procedures remain unchanged.  
  Argue whether these cases:  
  (i) Reveal 'backsliding' as an inherently partisan label,  
  (ii) Demand clearer thresholds for what constitutes a 'democratic baseline', or  
  (iii) Suggest the term itself is flawed and should be replaced (propose an alternative and justify it).  
  Finally, assess whether framing backsliding as an 'essentially contested concept' resolves these issues or merely obscures them."**

  ---

  ### Model Answer (approx. 700 words)  
  The term "democratic backsliding" implies a measurable retreat from an established democratic standard. Cases Alpha and Beta, however, expose fractures in this concept’s foundations—its baseline, measurement, and adjudication—suggesting it risks becoming a partisan narrative unless rigorously rethought.

  **Case Alpha destabilises the baseline and the judge.** It begins with a clean election, establishing a plausible democratic starting point. Yet the first government’s actions—curbing courts, media, and electoral fairness—clearly degrade institutional checks. This *looks* like classic backsliding. The crisis emerges when the opposition wins *despite* these biases and then replicates the tactics, justifying them as "restoration." This creates a hall of mirrors: both sides claim democratic legitimacy while undermining its substance. The baseline (the initial clean election) becomes irrelevant once both actors weaponise procedural changes. Crucially, *who judges* "decline" is fatally compromised: each side labels the other’s identical actions as backsliding while framing their own as democratic correction. Here, partisanship infects not just the *application* of the label (the judge), but the very *definition* of the baseline and measurement. Is the baseline the initial election, or some idealised institutional balance? When both sides alter rules, measuring "decline" becomes a contest over whose democratic vision prevails.

  **Case Beta attacks the premise of a meaningful baseline.** This state never achieved liberal democracy; it was always a competitive authoritarian system with limited pluralism. Its recent reforms further erode constraints, but calling this "backsliding" is incoherent—you cannot slide *back* from a height never reached. This exposes "backsliding" as a concept dependent on a prior democratic threshold Beta never met. Applying the term here would stretch it to cover any authoritarian consolidation, however incremental, blurring qualitative distinctions. Beta suggests we need a clear *threshold* for what constitutes a democracy robust enough to "slide back" from. Without this, "backsliding" risks becoming an all-purpose label for democratic failure, applied inconsistently.

  These cases collectively challenge whether "backsliding" is salvageable. Case Alpha shows it can be co-opted by partisans to tar opponents and justify self-serving actions, corrupting all three premises (baseline, measure, judge). Case Beta reveals its inapplicability to states without a democratic peak. This implies the term is not merely *sometimes* partisan but *structurally susceptible* to politicisation and conceptual overreach. Replacing it with **“democratic degradation”** offers advantages. "Degradation" focuses on observable institutional decay (e.g., court subordination, media capture) without requiring a specific prior baseline. It accommodates Beta’s slow erosion and Alpha’s reciprocal sabotage, as both involve degrading institutional quality. Crucially, it avoids the backward-glancing implication of "backsliding," which Beta renders nonsensical. Shifting terminology refocuses analysis on *present institutional harm* rather than contested historical benchmarks.

  Framing backsliding as an "essentially contested concept" (ECC)—where disagreement is inherent to its meaning—feels like evasion here. ECC theory suggests debates enrich understanding, but Alpha and Beta show contestation paralyzing judgement. In Alpha, mutual accusations of backsliding create deadlock, masking shared anti-democratic behaviour. In Beta, contestation over the baseline prevents coherent application. Calling it an ECC doesn’t resolve this; it normalises ambiguity while powerful actors exploit it. It becomes a "shrug in a nicer jumper," failing to provide tools to distinguish democratic defence from democratic destruction.

  Ultimately, Cases Alpha and Beta reveal "backsliding" as a concept too reliant on unstable historical and normative anchors. While partisanship most blatantly corrupts the "judge," Alpha proves it can poison the baseline and measure too. Beta underscores the need for a clear democratic threshold, but setting this is itself contested. "Democratic degradation," centred on institutional integrity, offers a more neutral lens—especially vital in polarized or hybrid contexts where "backsliding" becomes just another weapon.

  ---

  ### Marking Scheme (20 marks total)  
  1.  **Deconstructs the three core premises (Baseline, Measure, Judge) using the cases (6 marks).**  
      *Botch:* Vaguely mentions "problems" without systematically linking each premise to specific case challenges (e.g., ignores Beta’s baseline problem).  
  2.  **Analyses Case Alpha’s challenge to partisanship beyond just the "judge" (4 marks).**  
      *Botch:* Only notes that both sides accuse each other without explaining how this corrupts baseline/measurement definitions.  
  3.  **Analyses Case Beta’s implications for the baseline/threshold (4 marks).**  
      *Botch:* Calls Beta "not a democracy" without exploring why this makes "backsliding" inapplicable or the threshold issue explicit.  
  4.  **Evaluates "partisan label" charge & proposes/justifies alternative term (or defends backsliding) (4 marks).**  
      *Botch:* Suggests a vague alternative (e.g., "decline") without explaining *how* it solves the specific problems identified.  
  5.  **Critically assesses "essentially contested concept" as solution (2 marks).**  
      *Botch:* Simply defines ECC or asserts it "shows complexity" without arguing its utility/failure in resolving the cases’ challenges.  

  ---

  ### Don't Reward This (Zero Marks)  
  *   **Naming real countries/regimes:** "Like in Hungary..." / "Similar to Poland..." / "As in hybrid regimes..."  
  *   **Citing indices/data:** Mentioning "V-Dem," "Freedom House," "Polity score," or any specific numerical rating/ranking.  
  *   **Asserting labels without argument:** "Case Beta is clearly competitive authoritarianism." (No analysis of *why* this affects the concept).  
  *   **Generic definitions:** Quoting Levitsky & Way or other theorists on "competitive authoritarianism" without applying it critically to the *conceptual* problem.  
  *   **Ignoring the cases:** Discussing only abstract theory or real-world examples.  

  **Bottom line:** Top answers use the cases as *tools* to dissect the concept’s anatomy, rather than just illustrations of its symptoms.
