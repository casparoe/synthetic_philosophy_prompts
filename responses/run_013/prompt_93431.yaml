  For the disagreements: Dave's "author knows best" view probably sees author's stated intent as definitive, while the user's "text speaks for itself" stance likely prioritizes reader interpretation. The key tension is whether meaning is fixed at creation or evolves through reading.

  The user's specific sticking points are revealing. Unconscious patterns in writing challenge Dave's view - if the author denies it, does that override textual evidence? Authorial retcons raise questions about authority over meaning. Collaborative texts like laws or wikis complicate "whose intent matters." And AI-generated texts force us to consider if meaning requires human consciousness.

