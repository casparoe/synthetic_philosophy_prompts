  The deeper issue might be purpose-driven: Dave may care about historical accuracy ("what Shakespeare meant"), while the user cares about present-day resonance ("what Hamlet means now"). If so, they're debating different questions - origin vs. current use. Naming that could reframe their whole discussion.

