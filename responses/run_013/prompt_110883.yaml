  Okay, the user is designing a constitutional convention simulation for their upper-level seminar on religion and the state. They want students to experience three key insights through an interactive activity rather than a lecture. Let me unpack their requirements.

  The core challenge is translating abstract constitutional principles into tangible experiences within 90 minutes. The user specifically wants to avoid lecturing about establishment, laïcité or church tax until debrief. That means the design must make these concepts emerge organically from case studies.

  Looking at the provided material - Vantor's setting is rich with constitutional tensions. The 1978 Compromise creates a perfect starting point with its registered system and 38% unregistered population. The three real models (German, Italian, French) offer clean policy alternatives without labeling them. 

  The docket cases are brilliantly chosen to expose systemic flaws:
  - Ethical Fellowship tests boundaries of "religion"
  - Muslim congregations highlight representation problems
  - Pentecostal mission challenges institutional requirements
  - Orthodox split forces state into doctrinal arbitration
  - Hospices demonstrate entanglement
  - Passive members reveal inertia effects

  For implementation, I need to ensure:
  1) Role cards create authentic tensions (e.g., hospice administrator vs. tax assessor)
  2) Court mechanism prevents abstract solutions
  3) Strict timing forces concrete drafting
  4) Case applications expose unintended consequences

  The doubling solution for 12-20 students is practical - pairing on bloc roles while keeping individual constituencies maintains engagement. Holding back the Anabaptist exemption case until the end is crucial - it perfectly sets up the privilege vs. accommodation discussion.

  In debrief, I'll need to explicitly connect each "aha" moment to the target concepts:
  - Court vetoes = recognition dilemma
  - Register rules = state defining membership
  - Non-chooser allocation = de facto establishment
  - Hospice dependency = entanglement
  - Exemptions = selective privilege

  The user's notes about what the simulation can't achieve are insightful. I'll emphasize in debrief that real systems evolve through accretion, not design - and that revenue agencies make poor theologians. This frames the activity as a thought experiment with intentional limitations.

  For printables, the key is minimalism: just role cards, bloc worksheets, and case dockets with no explanatory text that might prime responses. The power comes from students discovering contradictions through application.
answer: |-
  Here’s a streamlined design for your 90-minute constitutional convention activity, optimized for experiential learning and built exactly from your specifications. Materials to print are listed at the end.

  **Activity Title: The Vantor Confessional Levy Convention**  
  *Goal: Replace the Levy with a "neutral" funding/recognition system.*

  ---

  ### **Phase 1: Setup (0-8 min)**  
  **Materials Distributed:**  
  1. **Setting Brief** (Vantor background + current Levy system).  
  2. **Palette Card** (German, Italian, French models – *descriptions only, no labels*).  
  3. **Constituency Cards** (1 per student, doubled roles marked *):  
     - Hospice Administrator (Catholic-run hospice)  
     - Unrecognised Mosque Imam*  
     - Tax Assessor*  
     - Terminal Patient (relies on Catholic hospice)  
     - District Registrar*  
     - Recent Levy Leaver (left register)  
     - Old Rite Orthodox Faction A Leader*  
     - Old Rite Orthodox Faction B Leader*  
     - Ethical Fellowship Leader  
     - Pentecostal Mission Member*  
     - Parent (child in Catholic school)  
     - Atheist Activist (no register)  
     - Jewish Community Representative  
     - Lutheran Pastor*  
     - Police Counter-Extremism Officer*  
     - Social Worker (works with unhoused)  

  **Instructions:**  
  - *"Silently read your materials. You are delegates drafting a new system for state-religion relations in Vantor. Argue for your constituency’s interests, but clauses must be *neutral* – no naming specific religions. Begin drafting in blocs."*  

  ---

  ### **Phase 2: Bloc Drafting (8-35 min)**  
  - Split class into **2 blocs** (8-10 students each).  
  - **Task:** Draft 4 clauses using the Palette models (combine/modify freely):  
    1. **FUNDING:** How is money collected/distributed?  
    2. **RECOGNITION:** How do groups qualify for state benefits?  
    3. **MEMBERSHIP:** How do individuals associate/disassociate?  
    4. **SERVICES:** What non-financial support exists (e.g., chaplaincies)?  
  - **Constraints:**  
    - Appoint 1 **Constitutional Court Justice** per bloc (can veto clauses implying doctrinal judgments).  
    - Clauses must apply generically (e.g., "recognised religious bodies," not "churches").  

  ---

  ### **Phase 3: Stress Test (35-50 min)**  
  **Reveal Docket Cases:**  
  1. Ethical Fellowship (secular group wants funding)  
  2. Unrecognised Muslim congregations (no legal rep, some under surveillance)  
  3. Pentecostal mission (funds in founder’s name)  
  4. Old Rite Orthodox schism (who inherits register?)  
  5. Catholic hospice closure (if Levy ends)  
  6. 1.4M passive register members (never practised).  

  **Process:**  
  - Apply each bloc’s clauses **mechanically** to all 6 cases.  
  - *Read clauses verbatim* – no interpretation. Example:  
    - *"Clause 2: 'Funding requires centralised leadership.' Pentecostals fail. No funds."*  
    - *"Clause 4: 'State funds critical social services.' Catholic hospices funded; others?"*  
  - Note outcomes on board: **✅ Eligible / ❌ Excluded / ⚠️ Ambiguous**.  

  ---

  ### **Phase 4: Repair Round (50-65 min)**  
  - Each bloc gets **3 amendment tokens** (1 token = change 1 clause).  
  - **Court Challenge:** Opposing bloc or Justice can veto changes requiring doctrinal judgments (e.g., "groups must have a coherent theology").  
  - Blocs negotiate/trade tokens.  

  ---

  ### **Phase 5: Final Cases (65-72 min)**  
  Reveal held-back cases:  
  7. New charismatic movement (applies for recognition).  
  8. Anabaptists (seek exemption from child photo registry).  
  Apply final clauses. Observe:  
  - Does the new movement qualify? *(Tests recognition barriers)*  
  - Can Anabaptists get exemption? *(Tests accommodation vs. rule of law)*  

  ---

  ### **Phase 6: Debrief (72-90 min)**  
  **Guide Reflection:**  
  1. **"Which clause broke during stress-testing? *Why*?"**  
     → *Map to: Recognition forcing state into theology (Muslims/Pentecostals), entanglement (hospices), inertia (passive members).*  
  2. **"Who *decides* if the Ethical Fellowship is ‘religious’?"**  
     → *State’s theological judgment favors organized groups.*  
  3. **"Where did ‘neutrality’ fail?"**  
     → *e.g., Non-choosers’ funds following popular choice (Italian model) = de facto establishment.*  
  4. **Read a "Constituency Letter"** (e.g., Unrecognised Imam: *"Your ‘neutral’ criteria require property deeds we lack…"*).  

  **Now Name Concepts:**  
  - *"What you called ‘remitting funds to registered bodies’ is Germany’s **church tax**. ‘No recognition but chaplaincies’ is **laïcité**. The hospice dilemma? **Establishment entanglement.**"*  

  **Clarify Limits:**  
  - *"Real settlements evolve through laws/court rulings, not design. Tax agencies can’t judge theology. And we couldn’t simulate how funding alters religious vitality long-term."*  

  ---

  ### **Materials to Print**  
  1. **Setting Brief** (1 pg): Vantor’s history, current Levy, registers, Court ruling.  
  2. **Palette Card** (1 pg):  
     - **Model A:** State collects surcharge for taxpayer’s registered body; exit requires civil act.  
     - **Model B:** Taxpayers assign 0.8% of tax to recognised body/state fund; unassigned funds follow popular choice.  
     - **Model C:** No funding/subsidies; chaplaincies permitted in institutions.  
  3. **Constituency Cards** (16 unique, mark * for duplicates if >16 students).  
  4. **Docket Cases** (1 pg, cases 1-6 for stress test; 7-8 separate for final).  
  5. **Bloc Worksheets** (2 sheets with 4 boxes: Funding/Recognition/Membership/Services).  

  ---

  ### **Why This Works**  
  - **Specificity prevents abstraction:** Vantor’s hospice crisis or Orthodox schism forces concrete trade-offs.  
  - **Palette models as tools** (not labels) avoid preconceptions.  
  - **Court veto + neutral clauses** exposes state’s theological overreach.  
  - **Repair tokens** simulate political cost of fixing flaws.  
  - **Debrief ties pain points to theory** without lecturing.  

  **Timing Tip:** Use a visible timer. Cut bloc drafting at **35 min sharp** – the stress test reveals more than perfect clauses would. The docket cases *are* the teacher.
