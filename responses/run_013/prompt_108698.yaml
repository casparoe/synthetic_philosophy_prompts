prompt: |-
  I'm the research lead for a national commission on historical redress. Petitions come in most months asking the state to apologise, to rename a street or pull down a statue, to put up a plaque, or to pay something out of general funds for things done a long time ago, and nearly every one of them makes some claim about who is guilty of what. We're not a court, we don't do new history (we take the record as given), and our findings get read out on television, so we can't just say everyone was a bit guilty and move on.

  What I want is a decision procedure my analysts can actually run, built on Jaspers' four kinds of guilt but taking seriously that he was writing about one country in one year, and that our cases involve descendants, institutions that still exist, and people who actively resisted at the time. The questions in order; what counts as an answer to each; where the thing stops with a flat no; and where it has to stop because whats left is a values question that belongs to the legislature and not to us.

  Then run it on three petitions: (a) an apology and payment for a mass expulsion 150 years ago, where the state is the same legal entity but a large share of today's citizens descend from people who arrived afterwards, and the descendants of those expelled live somewhere else now; (b) a firm still trading under almost its old name that was the main beneficiary of a forced labour programme, and says the current owners and workers aren't the people who did it; (c) a request from descendants of families who sheltered victims that we formally declare their community not guilty, which I take it Jaspers would refuse — tell me if I've got him wrong.

  Format: 'What we're allowed to say' — the short list of verdicts the procedure can return and what each commits us to, ~150 words. 'The procedure' — numbered, in the order an analyst would ask them, ~700 words. 'Three petitions' — ~500 words, and I want at least one where the procedure gives an answer I won't like. 'Where it will misfire' — ~200 words, the cases it can't settle and the ones where it'll look like its doing philosophy instead of justice.
reasoning: |-
  Hmm, this is a fascinating and complex request about historical redress. The user is a research lead for a national commission dealing with petitions for apologies, reparations, and symbolic acts related to historical injustices. They need a practical decision procedure based on Karl Jaspers' four kinds of guilt (criminal, political, moral, metaphysical) but adapted for modern contexts involving descendants, institutions, and resistance figures.

  The user has outlined specific requirements: a clear set of permissible verdicts, a step-by-step procedure analysts can follow, application to three test cases (including one that should produce an "unpleasant" outcome), and limitations of the approach. The cases involve a 150-year-old mass expulsion, a modern firm benefiting from forced labor, and a community seeking exoneration.

  Key constraints from the user: The commission isn't a court, doesn't conduct new historical research, makes public pronouncements, and can't resort to vague moral relativism. They need something actionable that distinguishes factual analysis from value judgments requiring legislative action.

  For the verdicts, I consider four possible outcomes that map to Jaspers' framework while respecting the commission's mandate: No Liability, Political Liability, Moral Liability, and Unresolved Liability. Each carries specific commitments - from rejecting the petition to recommending concrete redress measures.

  The procedure needs to be analytical and sequential. I'm thinking of a 7-step process that examines: (1) criminal guilt (direct perpetrators), (2) political liability (state/institutional responsibility), (3) moral liability (collective beneficiaries/complicity), and (4) metaphysical guilt (existential questions). Each step has clear thresholds for proceeding or terminating the analysis. Steps 5-7 handle the practical implications.

  For the test cases:
  - Case A (expulsion): Should likely result in Political Liability given state continuity, but Moral Liability might be limited due to demographic changes.
  - Case B (firm): Political Liability seems clear if the institution is continuous, though Moral Liability for current beneficiaries is trickier.
  - Case C (resisters): This should yield a "flat no" per Jaspers - which might be the unpleasant outcome the user wants, as the commission can't issue declarations of innocence.

  The limitations section should address when the procedure breaks down - like when historical records are too ambiguous, or when claims involve intergenerational trauma that exceeds the analytical framework. There's also the risk of the commission overstepping into legislative territory when recommending material reparations.

  Throughout this, I need to maintain Jaspers' core distinction between factual liabilities and unanswerable metaphysical questions, while making it operational for modern redress claims involving temporal distance and shifted demographics. The challenge is balancing philosophical rigor with bureaucratic practicality.
answer: |-
  ## Decision Procedure for Historical Redress Petitions (Jaspers-Informed)

  **What We're Allowed to Say (Verdicts & Commitments):**

  1.  **No Liability Found:** The petition's claims, based on the established record, do not meet the thresholds for Criminal, Political, or Moral liability as defined. *Commitment:* Reject the petition; state reasons clearly based on the analysis.
  2.  **Political Liability Established:** The State (or its clear legal predecessor) is politically liable for actions/inactions causing the harm. *Commitment:* Recommend formal State apology; recommend symbolic acts (e.g., plaques, renaming, memorials); potentially recommend *further investigation* by legislature into material redress *if* significant Moral liability also strongly indicated but quantification is beyond our scope.
  3.  **Moral Liability Established (Community/Institution):** A specific, identifiable community or institution bears moral liability for benefiting from, enabling, or failing sufficiently to resist the harm, distinct from State political liability. *Commitment:* Name the liable entity; recommend specific non-material redress (e.g., apology *from that entity*, educational initiatives, commemorative acts); *cannot* recommend material payments from state funds solely based on this.
  4.  **Unresolved Liability / Legislative Question:** The harm is established, and liability (Political or Moral) is strongly indicated, but key questions essential for redress (e.g., quantification of material harm, precise identification of beneficiaries for material redress, complex intergenerational equity) exceed our fact-finding mandate and involve significant value judgments. *Commitment:* Acknowledge the harm and the indication of liability; formally refer the question of material redress and complex equity to the legislature for determination; recommend symbolic acts *if* Political/Moral liability is clear.

  ---

  **The Procedure (Analyst Workflow):**

  1.  **Establish the Harm & Perpetrator:** Based *only* on the undisputed or officially accepted historical record provided with the petition or within our archives:
      *   Was a specific, significant harm inflicted (expulsion, killing, enslavement, dispossession, etc.)?
      *   Is the direct perpetrator (individual, specific group, specific institution) clearly identifiable from the record?
      *   *Stop if NO:* If no specific harm is established per the record, or no identifiable direct perpetrator exists (e.g., vague societal prejudice without concrete acts), return **No Liability Found**. (Addresses Criminal Guilt baseline - must exist *somewhere*).

  2.  **Assess State (Political) Liability:**
      *   Was the harm inflicted or *enabled* by the *State* (or its unambiguous legal predecessor) through action (law, policy, military order) or culpable inaction (failure to protect where duty existed)?
      *   Does the *current State* represent a clear institutional and legal continuity with the State entity responsible at the time? (e.g., same constitution, core institutions, legal personality).
      *   *Stop if Political Liability Established:* If YES to both, proceed to Step 3, but Political Liability is already established. The State, as a continuous entity, bears responsibility for its past actions/omissions regardless of current population makeup. Focus here is on the *institution*.
      *   *Stop if NO:* If the State had no role (e.g., purely private actors, foreign state action), or current State lacks *clear legal/institutional continuity* with the perpetrating entity, return **No Liability Found** for *State* liability. Proceed to Step 3 only if another entity (institution/community) is implicated.

  3.  **Assess Moral Liability (Community/Institution):** *Focus: Collective benefit, complicity, or failure to resist where resistance was feasible.*
      *   **Identify the Entity:** Is there a specific, identifiable *non-State* community (e.g., a town, a professional group, an ethnic group within the society) or institution (e.g., a company, church, university) that *significantly and directly benefited* from the harm *or* whose *broad complicity/acquiescence* (beyond mere existence) was a necessary enabler per the record?
      *   **Assess Complicity/Resistance:** Does the record show this entity *actively participated* beyond passive benefit, *or* failed to resist *when resistance was a plausible option* for that group (considering their relative power/safety)? Mere existence within the guilty society is *not* sufficient. Were there internal dissenters/resisters *within* this group whose efforts were suppressed or ignored by the group's leadership/mainstream?
      *   **Continuity:** Does this specific community/institution (or a clear legal/moral successor bearing its name, legacy, or assets) *still exist* today in a recognizable form?
      *   *Establish Moral Liability:* If YES to all three (Identifiable Entity, Significant Benefit/Complicity beyond passivity, Continuity), Moral Liability for that specific entity is established. Proceed to Step 5.
      *   *Stop if NO:* If no such specific, identifiable, continuous entity meeting the benefit/complicity threshold exists, Moral Liability **cannot** be established. Proceed to Step 4 only if Political Liability was established in Step 2.

  4.  **Metaphysical Guilt - Acknowledgment, Not Liability:** Jaspers' "metaphysical guilt" (shared human responsibility for evil occurring around us) is *not* a basis for assigning legal, political, or moral liability in this procedure. It speaks to a *universal human condition*, not specific redress. Our procedure *cannot* declare groups "not guilty" of this – it's inherent and unalterable. *However:*
      *   If Political or Moral Liability is established, acknowledging the *human suffering* and the *breach of shared humanity* inherent in the harm is appropriate within redress recommendations (apology wording, memorials).
      *   If no Political or Moral Liability is found, but the harm itself is established, a simple factual acknowledgment *of the harm* may be made, without assigning liability. Declaring innocence is outside our scope and philosophically void per Jaspers.

  5.  **Scope of Redress (Political Liability):** If Political Liability is established (Step 2):
      *   State Apology and Symbolic Acts are *recommended* as appropriate.
      *   *Material Redress:* Does the record allow a *clear, quantifiable* estimate of *direct, material loss* (e.g., confiscated property with documented value, unpaid wages) attributable *specifically* to State action? Are the direct victims or their *immediate, identifiable heirs* traceable?
          *   If YES, recommend State apology, symbolic acts, *and* recommend the legislature determine and provide material redress (as it involves state funds/value judgments).
          *   If NO (losses diffuse, unquantifiable, victims/heirs untraceable), recommend State apology and symbolic acts only. *Do not* recommend state-funded material payments to distant descendants or general groups solely based on Political Liability.

  6.  **Scope of Redress (Moral Liability):** If Moral Liability is established for an Institution/Community (Step 3):
      *   Recommend *that specific entity* issue a formal apology and undertake appropriate commemorative/educational acts.
      *   *Material Redress:* **Crucially, we CANNOT recommend state funds be used for redress based solely on Moral Liability of a non-state entity.** If quantifiable material loss *directly traceable* to the actions/benefits of *that specific entity* exists, note this in the referral to the legislature. Our recommendation is solely for *non-material* acts *by the liable entity itself*.

  7.  **Final Determination & Referral:**
      *   Combine findings: If Political and/or Moral Liability established, formulate recommendations accordingly (Apology - State or Entity, Symbolic Acts).
      *   **Unresolved for Legislature:** If material redress is indicated but involves complex quantification, beneficiary identification beyond immediate heirs, intergenerational equity, or significant value judgments (even if liability is clear), return **Unresolved Liability / Legislative Question**. Clearly state the established liability (Political/Moral), the nature of the harm, and specify the precise questions (e.g., "quantification of community-wide economic damage," "appropriateness of payments to 4th generation descendants") needing legislative resolution. Recommend symbolic acts if liability is clear.
      *   If no liability established and harm unproven/not state/entity related, **No Liability Found**.

  ---

  **Three Petitions Analysed:**

  1.  **Petition A (Mass Expulsion 150 Years Ago):**
      *   **Harm:** Established (mass expulsion by state forces, per record).
      *   **Criminal Guilt:** Direct perpetrators (state agents) identifiable historically.
      *   **Political Liability:** YES. State entity has clear legal continuity. Its agents perpetrated the expulsion.
      *   **Moral Liability (Community):** Unlikely. Broad societal benefit/complicity difficult to attribute to a *specific, continuous* community today beyond the state itself. Descendant makeup irrelevant to *State* political liability.
      *   **Redress Scope:** Political Liability Established. Recommend State apology and symbolic acts (memorial, plaque at relevant site). *Material Redress?* Losses (property, livelihood) are clear but victims/heirs likely untraceable after 150 years; quantification complex. **Verdict: Political Liability Established.** *Recommend:* State apology, symbolic acts. Refer question of *potential* material redress fund for legislature *if* petitioners provide compelling evidence of traceable heirs/specific quantifiable losses (unlikely, so effectively symbolic only via us).

  2.  **Petition B (Firm Benefiting from Forced Labour):**
      *   **Harm:** Established (forced labour programme).
      *   **Criminal Guilt:** Direct perpetrators (those running programme) identifiable.
      *   **Political Liability:** Possibly (if state mandated/endorsed programme), but focus is on the firm.
      *   **Moral Liability (Institution):** **YES.**
          *   *Entity:* The specific firm is identified as the *main beneficiary*.
          *   *Benefit/Complicity:* Actively used forced labour, significantly profited. Complicity is direct.
          *   *Continuity:* Firm trades under "almost its old name" – likely sufficient legal/moral continuity if core business/assets/identity persist.
      *   **Redress Scope:** Moral Liability Established (for the firm). **Verdict: Moral Liability Established (Firm).** *Recommend:* The firm should issue a formal apology, fund educational initiatives about its history, and contribute to a relevant memorial. *Cannot* recommend state payment. If State Political Liability also exists (e.g., state ran/endorsed programme), add that verdict and State apology recommendation. Firm's argument ("not the same people") irrelevant to *institutional* Moral Liability based on benefit/continuity.

  3.  **Petition C (Declare Resisters' Community "Not Guilty"):**
      *   **Harm:** Established (underlying persecution occurred).
      *   **Criminal Guilt:** Perpetrators exist (state/other groups).
      *   **Political Liability:** Not applicable to this community (they resisted).
      *   **Moral Liability (Community):** **NO.**
          *   The record shows *active resistance* by specific families within the community.
          *   While the broader community existed within the guilty society, there is no evidence of *this specific community's* significant complicity or benefit *beyond passive existence*, especially given documented resistance. They failed the "complicity/beyond passivity" test.
      *   **Metaphysical Guilt:** As per procedure (Step 4), we *cannot* declare any group "not guilty" of metaphysical guilt. It's inherent. Declaring innocence is impossible and outside our scope.
      *   **Verdict: No Liability Found** (for this specific community regarding Moral Liability for the harm). *However:* We can *acknowledge the factual record*: "The historical record documents that members of [Community X] actively resisted [the harm] and sheltered victims." We *cannot* issue a formal declaration of "not guilty." This might be unsatisfying (**the answer you won't like**), but Jaspers argues we are all metaphysically guilty, and our procedure only assigns specific Political/Moral liability. We can only state the positive facts of resistance, not a negative declaration of innocence.

  ---

  **Where It Will Misfire:**

  1.  **Ambiguous Records/Continuity:** Cases where the historical record is fragmentary or hotly contested *on key liability points* (e.g., exact state role, scale of specific community complicity, continuity of an institution). The procedure relies on an "established record," which may be insufficient, forcing an uncomfortable "No Liability" or "Unresolved" verdict despite strong moral claims.
  2.  **Diffuse Societal Harm/Benefit:** Harms like pervasive discrimination or slavery where benefit was widespread across society, but no *specific, identifiable non-state community/institution* (beyond the state itself) meets the Moral Liability threshold. The procedure may find only Political Liability, leaving societal moral responsibility unaddressed except abstractly, frustrating petitioners.
  3.  **Complex Intergenerational Equity:** Cases demanding material redress for descendants many generations removed, involving complex calculations of compounded harm/benefit. The procedure will almost always kick this to the legislature ("Unresolved Liability"), appearing to dodge the core demand. Quantifying historical injustice across centuries involves profound value judgments beyond fact-finding.
  4.  **Philosophy vs. Justice Perception:** Applying Jaspers' distinctions, especially denying declarations of innocence (Metaphysical Guilt) or rejecting liability based on descendant demographics, will often *feel* like cold philosophy ignoring lived injustice or the desire for moral cleansing. The procedure may produce technically correct but existentially unsatisfying outcomes, particularly for communities seeking exoneration (like Petition C) or facing the "passive benefit" barrier. It prioritizes clear, actionable liability assignments over broader moral reckoning, which can seem inadequate.
