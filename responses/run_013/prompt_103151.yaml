  Here’s a toast that sneaks in the "convention" idea through warmth, humor, and inclusivity, ending with the sacred line while gently loosening its grip:

  **(Clink glass gently, warm smile)**

  "Hi everyone. For those who don’t know me, I’m [Your Name], the proud, slightly panicked big brother of our amazing bride, [Sister's Name]. First, [Fiance's Name], welcome *officially* to the family! We’re thrilled you found my sister… and brave enough to join us. And to the whole [Fiance's Last Name] family – thank you for being here. Get ready, because you’re about to witness something… special.

  **(Look around the table, affectionate but slightly bemused)**

  "You see, in our family, we have this little pre-dinner ritual. Goes way back. Before anyone can even *look* longingly at the rolls… the youngest person here has to stand up and say… well, *something*. Anything, really! Could be profound, could be the weather report. But it *must* end with five very specific words. Words passed down like a sacred heirloom from my Grandpa: **‘Green ones are for guests.’**

  **(Pause for the inevitable ripple of knowing chuckles from your family)**

  "Now, for those of you who just thought, *‘What on earth does that mean?’*… Congratulations! You’ve just achieved the same level of understanding as the rest of us have after decades! Seriously. We have theories. Maybe it was about peas? Lawn furniture? Alien produce? Grandpa was a character, loved a good inside joke. And this one… well, it stuck. Hard. Like glitter. Or that one weird casserole Aunt Carol brings.

  **(Turn slightly towards Grandma, warm and sincere)**

  "And Grandma, we know how much it means to you. It’s a little piece of Grandpa, a little beat in the rhythm of our family dinners. It’s the signal that the chaos – I mean, the *feasting* – can begin. We love that it connects us to him and to all those dinners past.

  **(Shift tone, more inclusive, towards the in-laws)**

  "But honestly? To our wonderful new family members joining the table today… it probably just seems like we’re a little nuts. Like maybe you accidentally joined a dinner theater troupe performing a cryptic one-act play before the salad course. And you’d be… not entirely wrong!

  **(Leans in conspiratorially, smiling)**

  "Here’s the thing about family traditions, especially the wonderfully weird ones: They start somewhere small. Maybe with a grandpa’s silly joke one Tuesday night. And then… because everyone expects it to happen *next* time… it just *keeps* happening. It becomes the rule. The signal. The ‘green ones’ moment. It doesn’t have to be deep. It doesn’t have to make sense to outsiders. It just *is*. It’s our little shared nod, our family handshake before we dig in.

  **(Raise glass towards the couple)**

  "And that’s kind of beautiful, isn’t it? Because today, [Sister's Name] and [Fiance's Name], you’re starting your *own* family rhythm. You’ll build your own traditions. Some might be profound. Some might be simple routines. And maybe, just maybe, one day, decades from now, your grandkids will be utterly baffled by why they *have* to do something like… I don’t know… tap the salt shaker twice before passing it, or announce that ‘the hedgehogs are hibernating’ before dessert. And they’ll do it because *you* started it, and it became *their* signal, *their* little piece of your love story.

  **(Turn to the whole table, including in-laws)**

  "So, to our [Fiance's Last Name] family – welcome to the table! Welcome to the chaos, the love, and yes, the occasional weird pre-dinner performance art. Consider yourselves officially let in on the ‘green ones’ secret… such as it is. The rules are simple: Say something, end with the magic words, and then… eat! Feel free to adopt it, adapt it, or just enjoy the spectacle. We’re just glad you’re here to share it with us.

  **(Turn to the youngest cousin/relative, maybe give a subtle, encouraging nod or wink if appropriate)**

  "And so, upholding a tradition that persists purely because we all kinda think everyone else expects it… [Youngest Person's Name], the floor is yours. Remember the sacred finale!"

  **(Wait for the youngest to stand, say their piece, and end with:)**

  **"Green ones are for guests!"**

  **(As the table erupts in applause/laughter/relief and starts reaching for food, you add with a final warm smile and maybe a subtle shrug or wink towards the in-laws):**

  "See? Tradition! Now, please… eat!"

  **Why this works:**

  1.  **Acknowledges the Weirdness:** Directly addresses the elephant in the room for the in-laws ("seems nuts," "cryptic one-act play").
  2.  **Honors Grandpa & Grandma:** Clearly states the ritual's origin and Grandma's feelings, framing it as a connection to Grandpa's character and love.
  3.  **Explains the "Convention" Without Jargon:** Uses accessible language: "started small," "everyone expects it," "keeps happening," "shared nod," "signal," "family handshake," "rules are simple." It perfectly captures Lewis's idea without ever naming it.
  4.  **Gently Loosens the Grip:**
      *   "Doesn’t have to be deep... doesn’t have to make sense."
      *   "Purely because we all kinda think everyone else expects it." (This is the key line that plants the seed of collective realization).
      *   Telling the in-laws they can "adopt it, adapt it, or just enjoy the spectacle" implicitly gives *everyone* permission.
      *   The wink/shrug after the line signals its inherent absurdity playfully.
  5.  **Includes the In-Laws:** Welcomes them explicitly into the fold ("let in on the secret," "welcome to the chaos," "share it with us"), framing the ritual as an endearing quirk, not a cult requirement.
  6.  **Focuses on the Couple:** Connects the tradition idea beautifully to the couple starting their own family and traditions.
  7.  **Warm and Funny:** Uses self-deprecation ("panicked," "chaos"), gentle teasing ("Aunt Carol's casserole"), and relatable humor.
  8.  **Ends with the Line:** Grandma is happy. Ritual fulfilled.
  9.  **The Sneaky Shift:** By openly stating the ritual persists due to *mutual expectation* ("we all kinda think everyone else expects it") in a warm, humorous toast *as the ritual is happening*, you create that shared moment of realization. People *get* it simultaneously, without confrontation. The permission given to the in-laws extends to everyone.

  **Delivery Tips:**

  *   Keep it light, warm, and conversational. Don't rush.
  *   Make genuine eye contact: with Grandma when honoring Grandpa, with the in-laws when welcoming them, with the couple when toasting them.
  *   That little shrug or wink after the line is crucial for signaling the arbitrariness without disrespect.
  *   Breathe! You've got this. Your sister asked you because she trusts you and loves you. This toast comes from a place of love and humor, which is exactly what the moment needs.
