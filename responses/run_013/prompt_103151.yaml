  The user researched David Lewis's conventions theory. They realize the tradition persists because everyone expects it. They want to retire it subtly without offending Grandma or confusing the in-laws. The challenge: make the whole table realize it's optional through the toast itself, not by announcing it. Grandma must feel loved, and in-laws should feel included, not weirded out.

  Key points: The toast must be warm, funny, 4-5 minutes. No philosophy jargon. End with the line. In-laws need to feel let in on the joke, not like they joined a cult. 

  Hmm. The toast should model the very idea of conventions. Start by acknowledging the ritual naturally. Then, highlight how traditions start small and stick. Use humor to show it's arbitrary—Grandpa's inside joke that became "sacred." 

  For the in-laws, frame them as "fresh eyes" to help the family see the ritual anew. Suggest passing the torch to them, making them insiders. Grandma's concern: tie the ritual to Grandpa's humor and love, not the words themselves. End by saying the line, then winking to signal its arbitrariness. 

  Structure: Welcome, roast the ritual lightly, praise the couple, invite in-laws to join future traditions, end with the line and a wink. The wink is crucial—it's the nudge that the rule is optional. Grandma gets the tribute, cousins get the signal, in-laws get the humor. 

  Risks: Grandma might miss the wink. Solution: emphasize Grandpa's playful spirit earlier. In-laws might still be confused. Solution: explicitly welcome them to the "game." Keep tone affectionate, not mocking. 

  This should work. The toast becomes the catalyst for collective realization without confrontation. Everyone laughs together, the ritual's grip loosens, and the line gets said. Perfect.
