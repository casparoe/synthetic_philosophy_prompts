prompt: |-
  I'm an undergraduate in an archaeology program, currently taking a course on archaeological method and theory, and I've run into a tension in the way we're being trained that I'd like help thinking through properly. I'd like you to act as an expert on the philosophy of the human sciences -- someone at home both in archaeological inference and in the philosophy of belief, meaning, and intention -- and to think carefully and deliberately before answering. It may help to begin by brainstorming the various implicit commitments one could attribute to a practice like the one I describe, then narrow to the ones the practice actually seems to need, before you commit to a verdict. The practice I have in mind is the routine classification of archaeological features and deposits into categories like subsistence, domestic, and ritual, along with the associated habit of reading mental states off material remains -- treating grave goods as evidence of a belief in an afterlife, a deliberately broken or buried object as evidence of an intention to consecrate or desecrate, an assemblage of figurines as evidence of a cult. Our field manual even formalizes this: every feature is supposed to be assigned to one of those categories, with indeterminate offered as a fallback, though the published reports we read almost never actually use it -- ambiguous features tend to get filed under ritual, as if the category were a place to put things we cannot explain rather than a claim we can defend. At the same time, the same instructors who happily write ritual in their site reports will insist, when pressed in seminar, that we cannot possibly know what past people thought, that we can only describe what we find, and that any talk of belief is projection. When I ask which is it, I get told that the categories are just heuristic, but they don't seem to function that way in practice -- they do real interpretive work and carry real evidential weight, and nobody treats a subsistence classification and a ritual classification as equally provisional.

  What I want from you is this. First, reconstruct the theory of inference that this practice presupposes: what view must one hold about the relationship between material remains and past mental states, about whether beliefs and intentions leave detectable traces, and about what it is to explain a deposit, for these classifications to be more than arbitrary labels. Second, tell me which rival views the practice quietly rules out -- for instance, whether it is compatible with a thoroughgoing behaviorism that refuses to posit inner states at all, or with a view on which meaning is radically underdetermined by the physical record. Third, and this is where I most need help, tell me whether the practice is internally consistent: can the humility professed in seminar coexist with the confident ritual labels in the reports, or is one of them doing all the real work while the other is mere ceremony? Fourth, distinguish what the practice strictly presupposes from what it merely fits comfortably with, so that I can see where it is philosophically underdetermined and several different theories of belief and meaning would license the very same fieldwork. Finally, tell me what would actually have to change -- in method, in reporting conventions, in what counts as a defensible inference -- if we replaced the presupposed theory with one of the rivals you identified. I'd be especially grateful if you could point to the specific moments in ordinary archaeological reasoning where the commitment is doing invisible work, since those are the places I suspect I'm being trained to stop noticing.

  Please answer in continuous prose only, without headings, bullet points, bold text, tables, or numbered lists -- write it the way you'd explain it to me in a long, considered email.
