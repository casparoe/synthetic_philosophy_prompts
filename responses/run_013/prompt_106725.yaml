  My friend and I have been going back and forth about Galen Strawson's Basic Argument: to be genuinely morally responsible for anything you do, you'd have to be the ultimate cause of your own character, and since causing your character requires already having the character that does the causing, you can never be that cause -- so nobody is ever really responsible. He thinks it's airtight and that anyone who squirms is just refusing to follow it out. I'm not convinced, but I can't say why. Write me an essay that states the arguement in its strongest form, works through the main escape routes (maybe responsibility only needs you to be responsive to reasons, or for the act to flow from your own deepest values, or maybe the regress just shows the demand was unreasonable to begin with), and then actually takes a side and defends it.

  Here's the thing I really want you to chew on though. Take a case where someone is self-made in Strawson's strong sense, via a causal loop: a woman is raised from infancy by a stranger, who turns out to be her own future self, and who raises her to have exactly the traits she in fact ends up with. So her character was literally caused by her -- just by a later her who already had it. Does that (i) show self-causation is possible after all and so give us the thing Strawson says we'd need, or (ii) show that even the best case of self-causation is circular and so confirm his conclusion? Say clearly why the loop does or doesnt make a difference compared with an ordinary upbringing, and dont cop out with "it depends how you read him."

  Keep it readable for someone who's never read any of this -- explain the jargon as you go.

  Last line, exactly this form: Verdict: <one sentence>
