prompt: |-
  I sit on the collections ethics committee of a mid-sized museum, and before the next round of cases I want the specification rather than the theory: what must any adequate theory of the value of originals deliver? By that I mean an account of why an authentic object should be worth more, or worth something different in kind, than a perfect copy of it. Give me the requirements list.

  For each requirement, give the case or consideration that generates it, and say whether it is a genuine constraint on any view or merely a preference of one camp. Two things matter most to me. First, flag any subset of the requirements you suspect cannot be jointly satisfied; if some pair pulls in opposite directions, that is itself the result I need to report, so do not smooth it over. Second, name the single requirement that does the most to eliminate candidate families.

  The purpose fixes the standard of adequacy. I have to advise on acquisition and deaccession, on whether to insure an original above a replica, on restoration and on the display of replicas, on whether and how to label a copy, and on restitution claims. A view that settles the metaphysics and leaves the registrar with nothing to do is not adequate for me; a view that buys crisp verdicts by collapsing the distinctions listed below is worse.

  The list should cover at least these cases:

  - A duplicate of a painting identical in every respect any instrument can detect, including the isotope ratios that normally date canvas and pigment. Stipulate a replicator, not a forger: nothing about the object betrays it.
  - A forgery that is not merely as good as the original but better — a finer composition, executed with more skill, in the same period, from the same materials.
  - A print pulled from a plate the artist reworked a decade after the first impressions were taken, and an authorized posthumous cast made from a mold the artist left behind.
  - A Roman marble copy of a lost Greek bronze: it fails as the work it copies and succeeds as an original in its own right.
  - An artist's own late replica of an early work of hers, lost and known to her only from photographs.
  - A work that exists only as a file, with no privileged token: every copy is a copy, and none is the original.
  - An original now reduced to a ruin, exhibited beside a copy that shows what it once looked like; and a restored original that is by now half reconstruction.
  - A fabricated natural-history specimen, and a cast taken from a genuine fossil.
  - An object whose provenance includes both the artist's hand and a documented wartime looting.

  I expect these to force positions on at least the following: whether the value attaches to the object or to its history; whether it is intrinsic or relational; whether authenticity admits of degrees; whether it is the same kind of value as aesthetic value or a different kind altogether; whether the market premium is evidence for the value or a debunking of it; and whether a history of wrongdoing is value-bearing in the way a history of authorship is.

  Two constraints I will not budge on. The theory must be consistent with the fact that replication is now effectively free and perceptually perfect for most media while originals keep their premiums. And it must be consistent with the fact that people report the same experience of a work after learning that it is a copy while their valuation of it collapses; whatever the theory says the value is, it cannot treat that gap as mere error.

  Distinctions I do not want collapsed: between the value of a work and the value of a token of it; between deception of a buyer and the wrong done to an artist, an audience, or a practice; between a copy and a restoration; between authenticity as a property of an object and authenticity as a relation to a community.

  End with one line each on how the causal-history view, the experiential view, and the debunking view that treats the premium as pure positional signalling fare against the list, naming for each the requirement that does it in. Keep the weight on the requirements and their cases; I will run the scorecard myself.
reasoning: |-
  Hmm, this is a fascinating and highly specific request about the value of original artifacts in museums. The user sits on a collections ethics committee and needs a practical framework to guide decisions about acquisition, deaccession, insurance, restoration, and restitution. They're clearly frustrated with theoretical approaches that don't deliver actionable distinctions.

  The user wants a requirements list for any adequate theory of original value, grounded in concrete cases they've provided. Key demands: each requirement must trace to a specific case, indicate whether it's a universal constraint or camp preference, flag irreconcilable tensions, and identify the requirement that best filters out inadequate theories. They also want to preserve certain distinctions (value vs valuation, deception vs ethical wrong, etc.) and respect two non-negotiable constraints: the persistence of value despite perfect replicas, and the experiential/valuational gap.

  Looking at their cases - from perfect replicas to forged "improvements" to digital files without originals - these seem designed to probe every major fault line in authenticity debates. The Roman copy case particularly interests me as it challenges binary original/copy thinking. Their listed philosophical pressure points (object vs history, intrinsic vs relational value etc.) map neatly to the cases.

  Notable constraints: They insist theories must account for why originals retain value even when indistinguishable from perfect copies, and why valuation collapses upon discovering something is a copy even if the experience doesn't change. This experiential/valuational gap is crucial - it suggests the value isn't perceptual but something else.

  For the requirements derivation: Each case generates a specific demand. For example, the perfect replica case forces Requirement 1 (non-perceptual value), while the superior forgery case generates Requirement 2 (value independent of quality). The digital file case (Requirement 6) is particularly nasty as it denies any privileged token.

  Major tensions I see: Requirement 1 (value beyond perceptibles) clashes with Requirement 9 (value must affect display decisions) because if value isn't perceptual, why display originals? Also Requirement 7 (ethical weight) and Requirement 8 (market independence) often conflict in practice. The killer requirement seems to be R1 - it immediately eliminates theories that reduce value to aesthetic experience.

  For the quick theory assessments: Causal-history views fail spectacularly at the artist's late replica case (R5), experiential views can't handle the valuation/experience gap (R10), and debunking views implode on the restoration case (R9). The Roman copy case (R4) trips up most theories.

  This user is sophisticated and time-pressed - they need distilled insights, not literature surveys. The response should mirror their precision: bullet-point requirements with clear case origins, tension flags, and that R1 filter. The closing theory assessments should be brutally concise.
answer: |-
  Here is the requirements list derived from your cases, structured as requested. Each requirement is generated by specific cases/considerations, tagged as [Universal Constraint] or [Camp Preference], with noted tensions and the primary filter requirement identified.

  ### Requirements List for Any Adequate Theory of Original Value

  1. **Non-Perceptual Value**  
     *Case*: Perfect replicator duplicate (indistinguishable even via isotope analysis).  
     *Requirement*: Must explain why the original has value beyond any perceptible or measurable property.  
     *Constraint*: Universal (stipulates a replicator, so no deception).  

  2. **Value Independent of Quality**  
     *Case*: Superior forgery (better composition/skill, same materials/period).  
     *Requirement*: Value cannot derive solely from aesthetic merit or craftsmanship.  
     *Constraint*: Universal (if quality alone sufficed, the forgery would be more valuable).  

  3. **Distinction Between Authentic Creation and Authorized Reproduction**  
     *Case*: Posthumous cast & reworked print (same mold/plate, different temporal context).  
     *Requirement*: Must differentiate value of tokens produced under the artist’s direct creative control vs. later authorized reproductions.  
     *Constraint*: Universal (ethics committees must adjudicate such cases).  

  4. **Ambiguity in "Original" Status**  
     *Case*: Roman copy of Greek bronze (failed as copy, valued as Roman original).  
     *Requirement*: Must accommodate objects that simultaneously fail as copies and succeed as originals in a new context.  
     *Constraint*: Universal (ubiquitous in antiquities).  

  5. **Artist’s Replication vs. Third-Party Replication**  
     *Case*: Artist’s late replica of lost early work (based on photos).  
     *Requirement*: Must assign distinct value to an artist’s own replication vs. a copy by others, even if materially identical.  
     *Constraint*: Universal (affects acquisition/deaccession).  

  6. **Non-Token-Bound Works**  
     *Case*: Digital file with no privileged token (e.g., NFTs or open-edition digital art).  
     *Requirement*: Must explain value when no "original" material object exists.  
     *Constraint*: Universal (increasingly relevant for contemporary collections).  

  7. **Ethical Weight of Provenance**  
     *Case*: Object with documented wartime looting.  
     *Requirement*: Must integrate historical wrongdoing (e.g., theft, colonialism) as value-affecting, not just authorship.  
     *Constraint*: Universal (core to restitution ethics).  

  8. **Resistance to Market Reductionism**  
     *Case*: All cases where market premiums persist despite perfect copies.  
     *Requirement*: Cannot treat market value as merely positional or irrational; must explain why institutions *should* care beyond market signals.  
     *Constraint*: Universal (your non-budge constraint).  

  9. **Operational Guidance for Conservation/Display**  
     *Case*: Ruin + replica display vs. half-restored original.  
     *Requirement*: Must guide when to display a copy vs. degraded original, and when restoration alters authenticity.  
     *Constraint*: Universal (practical necessity for registrars).  

  10. **Valuation-Experience Gap**  
      *Case*: Visitors devalue a work upon learning it’s a copy, despite unchanged aesthetic experience.  
      *Requirement*: Must account for the collapse in valuation without a change in experience.  
      *Constraint*: Universal (your non-budge constraint).  

  11. **Differentiation of "Authenticity Types"**  
      *Case*: Fabricated specimen vs. fossil cast (natural history context).  
      *Requirement*: Must distinguish between authenticity-as-historical-witness (specimen) and authenticity-as-artistic-process (cast).  
      *Constraint*: Universal (affects labeling/insurance).  

  ---

  ### Key Tensions (Irreconcilable Pulls)
  - **R1 (Non-Perceptual Value) vs. R9 (Operational Guidance)**: If value is non-perceptual, why display originals when replicas offer identical experiences? Theories prioritizing historical continuity (e.g., causal-chain views) favor originals; experientialist views cannot justify this.  
  - **R7 (Provenance Ethics) vs. R8 (Market Resistance)**: Wartime-looted objects may have high market value *because* of their notorious history, but institutions must reject this as legitimate value.  
  - **R4 (Ambiguity) vs. R5 (Artist’s Replication)**: An artist’s replica may be an "original" (R5) while a Roman copy is ambiguously both copy/original (R4)—theories struggle to unify these.  
  - **R6 (Non-Token Works) vs. R1/R2**: Digital works challenge theories grounded in material history (R1) or artist’s touch (R2).  

  ---

  ### The Primary Filter Requirement
  **R1 (Non-Perceptual Value)** eliminates the most candidate families. Theories reducing value to aesthetic properties (experientialism), material composition, or perceptual indistinguishability fail immediately against the replicator case. Only theories embracing historical/relational properties survive.

  ---

  ### One-Line Assessments of Major Theories
  - **Causal-History View** (Value = chain of causation from artist):  
    *Fails at R5*: Cannot explain why the artist’s late replica (new causal history) has value approaching the lost original.  
  - **Experiential View** (Value = aesthetic experience):  
    *Fails at R10*: Cannot explain the valuation collapse upon learning an object is a copy if experience is unchanged.  
  - **Debunking View** (Value = positional signaling):  
    *Fails at R9*: Provides no guidance for displaying ruins vs. replicas, as market signals don’t map to conservation ethics.  

  ---

  This framework ensures distinctions remain sharp while exposing fault lines. R1 is the litmus test; R7 and R9 are the heaviest lifts for operational use. Report tensions between R1/R9 and R7/R8 as critical for committee deliberation—they reveal where philosophy meets institutional practice.
