  Desiderata for such a theory must include: genuine de re modality (claims directly about the individual), determinacy (clear answers to identity questions), necessity of origin (same individual requires same origins), and avoiding bare particulars without resorting to counterpart relations. The tension lies between satisfying de re claims and avoiding haecceities. 

  The user suspects that "de re claims are about the individual" and "no bare particulars" can't coexist. That seems accurate—Lewis sacrifices the first for the second, while haecceitists do the opposite. The third option might be moderate essentialism, but it still leans towards haecceities. 

  Key distinctions: counterpart theory handles similarity and avoids haecceities but at the cost of direct de re claims. Haecceity-based theories preserve direct reference but require non-qualitative properties. The necessity of origin is a point where both might agree, but for different reasons. 

