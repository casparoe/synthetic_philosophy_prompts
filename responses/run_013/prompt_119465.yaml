prompt: |-
  I just got back from a four hour argument with an old flatmate who did a year of metaphysics at some point and now talks like David Lewis is his personal friend, and before I read anything else about it I want the spec written down, because I kept losing track of what we were actually disagreeing about. His line: when I say I could have been a baker instead of whatever I actually am, there doesn't have to be any world containing me. There's a world containing someone very like me who is a baker, and thats enough, because the alternative is positing a bare thisness inside me that gets carried from world to world, and that's just a word for not knowing. My line: then the sentence isn't about me. If the baker over there is a different person who merely resembles me, then "I could have been a baker" is either false or it's about him, and you've changed the subject to save the theory. We went round that for hours and I got nowhere.

  So give me the desiderata for a theory of how one and the same individual turns up in more than one possible world. What does any account of this have to deliver before I should take it seriously. The cases it has to get right, the distinctions it can't collapse, the things it can't leave hanging. Some candidates, so you can tell me if I'm begging a question. First, a world just like ours except that the person with my exact history does something different at three on Tuesday: is that me or not, and does the theory actually answer, or does it say it depends how similar, which is no answer. Second, the near-duplicate: a world where the person exactly like me in every respect has one extra atom at the tip of his nose. Same question. Third, can I count people across worlds at all, or does each world get its own population and "how many people are there" turn into nonsense. Fourth, is there a world where I don't exist, and what is that claim even about if identity is necessary. Fifth, the argument that I couldn't have come from different parents, where the whole force seems to be that it's the very same person we're talking about. I'm not asking you to settle whether other worlds are concrete or abstract, I don't care about that part, I want to know what any theory has to deliver on pain of not being a theory of the thing at all.

  What I most want is the pairs that can't be had together. My suspicion is that "de re claims are about the individual itself" and "no bare particulars" can't both be met, and that the whole debate is a choice about which one to give up, so tell me if that's right and if there's a third one I've missed. Also flag which items are genuine requirements and which are just one camp's prejudice in a requirement's clothing, like "de re modal claims have a determinate truth value" (his side says that's a demand for a fantasy) or "there must be no haecceities" (my side says that's a demand for a world with no individuals in it). And say which single requirement does the most work, the one that knocks out the most candidates. Then in a couple of sentences at the end, which of the two pictures is left standing.

  Don't give me a reading list, I'm not going to read any of it. And write it as continuous prose, no headings, no bullet points, no bold, no tables, just the way you'd explain it to someone in an email, since I'll be reading it on my phone on the train.
