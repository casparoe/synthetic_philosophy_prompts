answer: |-
  Here’s what any theory of transworld identity must deliver to count as a genuine account of the same individual appearing across possible worlds, stripped down to the non-negotiable demands and tensions:

  First, it must **secure genuine *de re* modality**. If I say "I could have been a baker," this claim must be *about me*—the actual individual uttering the sentence—and assert a possibility *for me*. If the theory redirects the claim to be about a merely similar counterpart, it collapses *de re* (about the thing) into *de dicto* (about the description) or shifts the subject entirely. Your intuition that "then the sentence isn’t about me" targets this core. A theory failing here isn’t explaining *my* possibility; it’s explaining it away. This is a requirement, not prejudice—without it, we lose the subject of modal discourse.

  Second, it must **provide determinate answers in paradigm cases**, or explain why determinacy is impossible. For your "exact history but different choice at 3 PM Tuesday" scenario: is it you? The theory must say *yes* (it’s you acting differently) or *no* (it violates essential properties), or justify indeterminacy (e.g., vague identity). Saying "it depends on similarity" without a clear threshold (like your flatmate’s view) often begs the question by smuggling in undeclared criteria. The "near-duplicate with one extra atom" case tests the theory’s tolerance for qualitative difference versus numerical identity. A theory must confront whether identity requires qualitative identity or transcends it. Avoiding an answer here risks vacuity.

  Third, it must **account for transworld counting and nonexistence**. If we ask "how many people exist across all worlds?" the theory must clarify if this sums distinct world-bound individuals (each world has its own set) or counts one individual persisting through worlds. More crucially: it must handle *my nonexistence in some worlds*. If identity is necessary (I exist in all worlds where I *could* exist), this becomes trivial. If not, the theory must explain what "I do not exist in world W" means—is it that W lacks *me*, or lacks anyone satisfying my description? This ties directly to the "could I have had different parents?" case. The necessity of origin argument hinges on the claim that *this very person* requires *these actual origins*—a demand that presupposes strict transworld identity. A theory rejecting this must still explain why the intuition feels compelling.

  The central tension you suspect is correct: **"Genuine *de re* modality" and "No bare particulars/haecceities" cannot both be fully satisfied**. 
  - **Your flatmate’s view (Lewis-style counterpart theory)** sacrifices genuine *de re* modality to avoid haecceities. "I could have been a baker" is true iff a *counterpart* (a similar entity) in another world is a baker. It’s not *you* in that world, so the claim isn’t fundamentally *de re* about you—it’s about counterpart relations under a similarity metric. This avoids mysterious "bare thisness" but at the cost of making modal claims indirectly descriptive.
  - **Your view (requiring strict identity)** demands haecceities. If the same individual *literally* exists in multiple worlds with different properties (like being a baker), then what makes it *her* across worlds isn’t just qualitative similarity (since duplicates might exist)—it must be a non-qualitative, primitive "thisness" (haecceity). This secures genuine *de re* claims but posits an entity critics call obscure or ad hoc.
  - **A "third way"?** Moderate essentialism (e.g., Kripke) tries: you exist in other worlds only if your essential properties (like origin) are preserved. This rejects bare thisness—identity depends on "substantial" qualitative facts (e.g., same sperm/egg). But it still needs *something* to be the bearer of these essential properties across worlds, leaning toward haecceities. It also struggles with worlds where you make one tiny different choice—is *that* still you? If yes, haecceity creeps in; if no, essentialism becomes implausibly strict.

  **The most powerful desideratum is genuine *de re* modality**. It’s the whole reason we inquire about transworld identity—to understand possibilities *for us*. Theories failing here (like strict counterpart theory) don’t solve the problem but dissolve it. **The necessity of origin** also does heavy lifting: if a theory implies you could have sprung from different parents, it strains the intuition that *you* are tied to your actual causal history, pushing toward haecceities.

  **What’s left?** Neither picture fully delivers. Counterpart theory avoids metaphysical commitments to haecceities but sacrifices the self-directedness of modal claims. Haecceity-based theories preserve the "about me" intuition but invoke a primitive identity factor. Your argument exposed this trade-off: you prioritize the subject of modal discourse; your flatmate prioritizes ontological parsimony. The stalemate persists because no theory satisfies all desiderata without cost—you must choose which constraint to relax.
