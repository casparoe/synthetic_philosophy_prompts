  Then there's executing the innocent. The argument calls it the "worst injustice." Is this independent or tied to proportionality? It seems more consequentialist—irreversible harm—but also touches on rights. The user might be probing if this is a standalone point or part of a larger ethical framework.

  Assessing strengths: the risk of executing innocents is a strong point today, especially with DNA evidence exonerations. The brutality of executions leading to desensitization is also compelling. Weaknesses include the lack of engagement with retribution and the assumption that imprisonment deters equally. Historical context matters here—18th-century prisons were brutal, but maybe not seen as equivalent to death then.

