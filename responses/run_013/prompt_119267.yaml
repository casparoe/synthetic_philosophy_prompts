prompt: |-
  I run the ethics desk at a small church network — we fund and support partner congregations in countries run by strongmen — and every few months a field staffer forwards me a message from a local pastor asking whether it's ok for them to back a plan to get rid of the president. Sometimes it's nonviolent, sometimes not, and once in a while someone is preaching that killing him would be a righteous act. I don't have a canonist or a lawyer on call, and the pastor usually recieves the reply in a week, not a treatise. Aquinas is the framework everyone in this network nominally shares, so I want a procedure field staff can sit down and run with a pastor in one afternoon, without a theology degree.

  So: turn Aquinas on tyrants and tyrannicide into a checklist. Questions in order, what a real answer to each looks like as opposed to a wish, where the procedure just stops with a no, and where it has to hand off to a human because the question is about values or about facts nobody in the room can know. Two things I want kept, because they're the whole point and I think they're the parts people always drop: the distinction between a ruler who grabbed power illegitimately and one who holds power lawfully but uses it badly, and the test that says disturbing a bad government isn't itself wrong unless the cure leaves the people worse off than the disease did. There's also the point that the man who stirs up the multitude against the common good is the real troublemaker — I'd like that to show up as a question in the procedure, not as a slogan.

  Then run it on three cases: (a) a general who took power in a coup eighteen months ago, no independent court, monarch, or parliament left to appeal to, food shortages, and a network of pastors asking whether to join the resistance; (b) a hereditary monarch, thirty years in, corrupt and brutal in a low-level way, country basically stable, and a group of junior officers is planning to kill him and wants our partner church's blessing; (c) a congregation that wants to fund a general strike and a boycott, no violence at all. Be honest about which of these the procedure actually answers and which it can't, and say so plainly if it tells me to do something my donors and my own staff will hate.

  One more thing: a colleague of mine keeps saying this is just triage, you cut off the gangrenous limb to save the body. Tell me whether that's actually what Aquinas is doing or whether it smuggles in something he doesn't say. And flag where the procedure will misfire in a modern state that has no legitimate authority to appeal to at all.

  Don't give me a reading list, I can't get the books where we work.
reasoning: |-
  Okay, the user runs an ethics desk for a church network that supports congregations in countries under authoritarian regimes. They need a practical, Aquinas-based checklist to evaluate whether supporting the removal of a leader is permissible. The key points are distinguishing between usurpers and lawful-but-bad rulers, ensuring the cure isn't worse than the disease, and addressing who the real troublemaker is. 

  First, I recall Aquinas' key texts: "De Regno" for tyranny types and "Summa Theologica" for resistance principles. The usurper vs. lawful tyrant distinction is crucial—it changes the ethical calculus. Also, the "cure vs. disease" test (ST II-II Q42 A2) must be operationalized into clear questions. The troublemaker point (ST II-II Q42 A2) needs to be a concrete checkpoint, not just rhetoric. 

  The user explicitly rejects theoretical treatises—they need a field-ready tool. So I'll avoid academic jargon and structure it as a binary flowchart: answer "no" and stop, "yes/conditional" and proceed, or "uncertain" requiring human judgment. The three cases (coup leader, hereditary monarch, nonviolent protest) will test the checklist's real-world applicability. 

  For the colleague's "triage" analogy: Aquinas isn't endorsing utilitarian sacrifice but setting thresholds for when removing a limb (tyrant) preserves the body politic's common good. I'll note where this breaks down in modern stateless contexts—like when no legitimate authority exists to appeal to. 

  Now structuring the checklist: Start with "who can judge the tyrant?" since that's Aquinas' gatekeeper question. Then verify usurpation vs. lawful abuse, assess proportionality, and finally the troublemaker test. Each question must have unambiguous criteria for "stop/no," "proceed," or "handoff." 

  Case A (coup leader): Usurper confirmed, but "cure worse than disease?" depends on resistance's viability—likely a handoff. Case B (hereditary monarch): Lawful ruler means automatic "no" to killing; nonviolent options might pass. Case C (general strike): Lawful protest if proportional, but requires fact-specific handoff on consequences. 

  Biggest risks: The checklist might greenlight violence against usurpers if conditions seem met, which could alienate donors. Also, modern statelessness makes the "appeal to authority" question unanswerable—that's a built-in flaw Aquinas didn't foresee. I'll flag both honestly. 

  Final touch: Phrase the troublemaker test as "Is this resistance more damaging than the tyranny?" to avoid partisan sloganeering. And kill any caveats about "consulting experts"—the user forbids that.
answer: |-
  Here's a **Tyrant Evaluation Procedure (TEP)** based on Aquinas, designed for field use. It's a flowchart of key questions, with clear stop/go/handoff points. Aquinas' core principles you specified are embedded as operational questions.

  **Core Aquinas Principles Embedded:**
  1.  **Usurper vs. Tyrant:** Explicitly Question 2.
  2.  **Cure vs. Disease:** Explicitly Question 5 (Proportionality).
  3.  **The Real Troublemaker:** Explicitly Question 6.

  ---

  **THE TYRANT EVALUATION PROCEDURE (TEP)**

  **Instructions:** Work through these questions **in order** with the pastor/local leader. Stop at any "NO" or "HANDOFF". Answer based on *observable facts and shared moral principles*, not wishes. Be brutally honest.

  1.  **IS THERE A LEGITIMATE SUPERIOR AUTHORITY?**
      *   *What it asks:* Is there a recognized, functioning authority *above* the ruler (e.g., parliament, courts, council of nobles, constitutional monarch, regional body) that could legally remove him or hold him accountable *without* resorting to popular uprising or assassination?
      *   *Real "YES":* "Yes, Authority X exists, has the power defined in law/tradition, is not fully controlled by the ruler, and could act."
      *   *Real "NO":* "No, all such bodies are abolished, powerless, or fully controlled by the ruler." OR "They exist but are clearly unwilling/unable to act despite grave evils."
      *   *HANDOFF?* If unclear if an authority is *truly* legitimate/functional.
      *   **Action:**
          *   **YES:** **Proceed to Q2.**
          *   **NO:** **Proceed to Q2.** (This is critical - Aquinas allows action *only* when no appeal is possible).
          *   **HANDOFF:** **STOP. Escalate.** (Clarify the nature of remaining institutions).

  2.  **DID THE RULER SEIZE POWER ILLEGITIMATELY? (USURPER)**
      *   *What it asks:* Did this ruler gain power through force/coup, fraud, or clear violation of established law/constitution/tradition? (Aquinas: *"He who grabs power by violence does not become a true ruler"*).
      *   *Real "YES":* "Yes, he overthrew the previous government by force/fraud, ignored constitutional succession, or blatantly rigged an election beyond normal fraud."
      *   *Real "NO":* "No, he gained power through lawful succession (birth/election) or initially legitimate means, even if he now rules badly." OR "The means were questionable, but broadly accepted as legal at the time."
      *   *HANDOFF?* If legitimacy at accession is genuinely ambiguous or contested by strong arguments.
      *   **Action:**
          *   **YES (Usurper):** **Proceed to Q4.** (Action *may* be permissible sooner).
          *   **NO (Lawful but Bad):** **Proceed to Q3.** (Much higher bar for action).
          *   **HANDOFF:** **STOP. Escalate.** (Clarify historical facts of accession).

  3.  **HAS THE LAWFUL RULER BECOME A TYRANT TO AN *INTOLERABLE* DEGREE?**
      *   *What it asks:* Does the ruler's *ongoing* governance consistently, severely, and directly attack the *common good* (not just your group)? Is it *objectively* destructive (mass killing, famine by design, systematic destruction of justice/faith, enslaving populace), not merely harsh, corrupt, or favoring cronies? (Aquinas sets a very high bar for lawful rulers).
      *   *Real "YES":* "Yes, his actions are causing widespread, severe, *active* destruction of life, faith, or fundamental justice *for the whole people*, not just opposition."
      *   *Real "NO":* "No, it's bad (corrupt, unfair, brutal to opponents) but not actively destroying the foundations of society for everyone. People endure, systems limp on."
      *   *HANDOFF?* Severity is disputed. Is corruption/stability "intolerable"? Judgment call on common good impact.
      *   **Action:**
          *   **YES:** **Proceed to Q4.**
          *   **NO:** **STOP. Action NOT Permitted (Aquinas).** Endure, pray, reform within system.
          *   **HANDOFF:** **STOP. Escalate.** (Requires deeper ethical/theological discernment on severity).

  4.  **IS THE PROPOSED ACTION THE *LEAST HARMFUL/EXTREME* MEANS AVAILABLE?**
      *   *What it asks:* Have all truly viable non-violent or less extreme options been exhausted or proven utterly futile? Does the plan start with the mildest reasonable action (e.g., protest, strike) before escalating? (Aquinas: Prefer milder remedies).
      *   *Real "YES":* "Yes, peaceful appeals, protests, legal challenges are impossible, crushed, or demonstrably useless. The plan uses minimal necessary force/starts non-violent."
      *   *Real "NO":* "No, significant non-violent avenues haven't been seriously tried, or the plan jumps straight to violence/assassination when milder options exist."
      *   *HANDOFF?* Dispute over viability of alternatives or "minimal necessary" nature of the plan.
      *   **Action:**
          *   **YES:** **Proceed to Q5.**
          *   **NO:** **STOP. Action NOT Permitted (Aquinas).** Explore/exhaust milder means first.
          *   **HANDOFF:** **STOP. Escalate.** (Assess viability of alternatives).

  5.  **IS THE "CURE" LIKELY TO BE *LESS BAD* THAN THE "DISEASE"? (PROPORTIONALITY)**
      *   *What it asks:* Is the *probable outcome* of the action (success *or* failure) likely to leave the people *better off*, or at least *no worse off*, than enduring the tyranny? Consider chaos, civil war, vengeful successor, foreign exploitation, collapse of order. (Aquinas: *"...the remedy is worse than the disease"*).
      *   *Real "YES":* "Yes, success brings clear, sustainable improvement. Failure risks harm we judge *less severe* or comparable to current suffering. We have a credible plan for stability after."
      *   *Real "NO":* "No, failure means massacres/genocide. Success likely leads to worse chaos/warlords. No viable successor/plan exists."
      *   *HANDOFF?* Outcome is highly uncertain. Reasonable people disagree on probabilities. Depends on unverifiable intel.
      *   **Action:**
          *   **YES:** **Proceed to Q6.**
          *   **NO:** **STOP. Action NOT Permitted (Aquinis).** Endure the lesser evil.
          *   **HANDOFF:** **STOP. Escalate.** (Critical strategic/political risk assessment needed).

  6.  **IS THE RESISTANCE *TRULY* FOR THE COMMON GOOD, OR PRIMARILY SELF-INTEREST/REVENGE? (THE REAL TROUBLEMAKER TEST)**
      *   *What it asks:* Are the leaders and core participants demonstrably motivated by restoring justice, peace, and the good of *all* the people? Or is this driven by personal grievance, factional advantage, ambition, or ideology imposing *its own* tyranny? (Aquinas: *"He who... seduces the multitude... is the real troublemaker"*).
      *   *Real "YES":* "Yes, leaders have broad support, inclusive vision, track record of service, clear commitment to lawful/just rule after, reject personal vengeance."
      *   *Real "NO":* "No, leaders are known extremists, seek personal power, promote hatred/division, plan reprisals, or their ideology threatens fundamental freedoms/faith."
      *   *HANDOFF?* Motivations are mixed or unclear. Leaders are ambiguous.
      *   **Action:**
          *   **YES:** **Proceed to Q7 (Final Check).**
          *   **NO:** **STOP. Action NOT Permitted (Aquinas).** This resistance is part of the disease.
          *   **HANDOFF:** **STOP. Escalate.** (Requires deep discernment of character/motives).

  7.  **FINAL CHECK: IS CHURCH BLESSING/SUPPORT *NECESSARY* AND *PROPORTIONATE* TO THE CHURCH'S ROLE?**
      *   *What it asks:* Is formal Church endorsement/public support *essential* for the plan's success or moral legitimacy? Would providing it expose the Church/faithful to disproportionate retaliation? Can support be given quietly? (Prudence & Protecting the Flock).
      *   *Real "YES":* "Yes, our specific blessing is crucial for legitimacy/mobilization, and the risk is proportionate to the evil confronted."
      *   *Real "NO":* "No, the action can proceed without our *public* stance, or the risk of devastating retaliation is too high."
      *   *HANDOFF?* Balancing necessity against risk.
      *   **Action:**
          *   **YES:** **Action MAY BE Permitted (Aquinas).** **HANDOFF for Final Authorization.** (Ultimate prudential judgment by leadership).
          *   **NO:** **DO NOT give *formal/public* Church support.** (Private moral support *may* be possible, but avoid institutional endorsement).

  ---

  **APPLYING THE TEP TO YOUR CASES:**

  *   **Case A (Coup Leader 18mo ago, No Courts, Food Shortages, Join Resistance?):**
      *   Q1: **NO** (No legitimate authority left). Proceed.
      *   Q2: **YES** (Usurper via coup). Proceed to Q4.
      *   Q4: **HANDOFF** (Is joining *this* resistance the *least harmful* means? Depends on resistance methods/alternatives). **STOP. Escalate.** Need info on resistance's nature & alternatives. TEP *doesn't* auto-approve joining.
      *   *TEP Outcome:* **Inconclusive (Handoff at Q4).** It identifies the usurper but requires risky judgment on means/proportionality. *Potential for approval exists*, but depends on resistance specifics. Your donors/staff may hate supporting *any* resistance.

  *   **Case B (Hereditary Monarch 30yrs, Brutal/Corrupt but Stable, Bless Assassination?):**
      *   Q1: **NO/HANDOFF?** (Possibly no functional superior authority? Depends on constitution/tradition). Assume **NO** for argument. Proceed.
      *   Q2: **NO** (Lawful ruler by succession). Proceed to Q3.
      *   Q3: **NO** ("Brutal in a low-level way", "basically stable" ≠ *intolerable* destruction of the common good). **STOP. Action NOT Permitted.**
      *   *TEP Outcome:* **NO.** Aquinas forbids killing lawful rulers unless tyranny is *intolerable*. Stability rules it out. Assassination attempt likely destabilizing (fails Q5 too). Your staff/donors would likely *support* this "No". Blessing assassination here is unjustifiable per Aquinas.

  *   **Case C (Congregation Fund General Strike & Boycott, Nonviolent):**
      *   Q1: **HANDOFF/YES?** (Is there a superior authority? Maybe, but likely ineffective. Complex). Assume **NO** for argument. Proceed.
      *   Q2: **HANDOFF/NO?** (Is the ruler lawful? Hereditary/elected? Crucial for bar). Assume **NO** (Usurper) or **Proceed** if lawful (Q3 likely **YES** for intolerable tyranny needed for nonviolent action? Debatable). **Proceed to Q4.**
      *   Q4: **YES** (Non-violent protest/strike *is* the least extreme means). Proceed.
      *   Q5: **HANDOFF** (Will the strike cause more suffering than it alleviates? Depends on severity, duration, regime response). **STOP. Escalate.** Critical risk assessment needed.
      *   *TEP Outcome:* **Inconclusive (Handoff likely at Q2 or Q5).** Non-violence passes Q4 easily, but Q2 (ruler status) sets the bar, and Q5 (proportionality) is highly fact-specific. Funding is material support, so Q7 also applies (Is *church funding* necessary/proportionate?). *Likely Permissible* if tyranny is severe (Q3 passed) and proportionality holds, but **not automatic.** Donors might dislike funding civil disobedience.

  ---

  **On Your Colleague's "Triage" Analogy:**

  *   **It's Partly Right, But Smuggles In Utilitarianism:** Aquinas *does* use the limb/body analogy (ST II-II, Q64, A2, regarding executing criminals). Applying it to tyranny, he *is* saying a "gangrenous" tyrant (usurper or intolerable lawful one) can be "amputated" to save the "body politic" **BUT ONLY** after satisfying strict conditions (legitimacy to act, last resort, proportionality, right intent). The analogy focuses on the *object* (tyrant as diseased limb) and *goal* (saving the whole).
  *   **What it Smuggles In:** Pure triage is coldly utilitarian: sacrifice the part for the greater good of the whole. Aquinas injects crucial **deontological constraints**: Who has the *right* to cut? Is it *truly* the last resort? Is the *method* just? Is the *intent* pure? The analogy risks making it seem *only* about outcomes (cure>disease), downplaying the intrinsic wrongs of certain means (like murdering a lawful ruler) unless *all* conditions are met. It can justify shortcuts Aquinas forbids.

  **Where the Procedure Misfires in Modern Statelessness:**

  The Achilles' heel is **Q1 (Legitimate Superior Authority)**. Aquinas assumed *some* legitimate structure existed (Emperor, Pope, Nobles, Law). In many modern states:
  1.  **No Obvious Legitimacy:** Who is "legitimate"? A dead constitution? A powerless UN? A corrupt judiciary? This makes Q1 perpetually a **HANDOFF** or forces a **NO**, lowering the bar prematurely.
  2.  **Who Judges "Intolerable" (Q3)?** Without a legitimate authority, who defines the threshold? This becomes a dangerous popular/pastoral judgment call.
  3.  **Who Has Authority to Act (Implied)?** Aquinas assumed *public authority* (nobles/people representing the community) could act. Modern "resistance" is often fragmented factions. Does "the people" exist as a coherent actor? This frays the legitimacy of *any* resistance group's claim to act for the common good (Q6).

  **The procedure struggles most with identifying *who*, if anyone, has the *right* to initiate action when all formal structures of legitimacy have collapsed.** It risks legitimizing vigilantism or factional power struggles disguised as the common good. This is the core modern challenge Aquinas didn't fully foresee. The TEP flags this by making Q1 a critical, often ambiguous, starting gate and Q6 a vital final check, but the inherent uncertainty remains.
