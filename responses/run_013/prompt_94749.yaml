  Below is a decision tree designed to help students identify their position on the norm of assertion through concrete cases. The tree starts with the fundamental question of whether assertion has a constitutive norm at all, then branches into finer distinctions. Each branch is phrased as a question answerable without technical jargon, using real-world cases to guide decisions. The tree yields **13 leaves** (named positions), each with a brief note on its "awkward commitment" (the case it handles least comfortably). Finally, I address which views the tree struggles to distinguish and which combinations are unattractive or unoccupied.

  ---

  ### **Decision Tree: What’s Your View on the Norm of Assertion?**  
  *Start at question 1 and follow the branches based on your answers to concrete cases.*

  #### **Question 1: Actor Case**  
  *An actor on stage says, "I arrest you!" during a play. Is this a genuine assertion?*  
  - **Yes** → Assertion does **not** require a special rule to "count" as assertion (go to Question 2).  
  - **No** → Assertion **has a constitutive norm** (go to Question 3).  

  ---

  ### **Subtree 1: No Constitutive Norm (from Q1 "Yes")**
  #### **Question 2: Lottery Case**  
  *You say, "My lottery ticket will lose" (odds: 1 in a million). Do you need special authority/standing to say this?*  
  - **No** → Leaf 1: **Gricean Pragmatist**  
    - *Awkward commitment:* Explains everything with general conversational rules (e.g., "be truthful"), but struggles with why we treat assertions as uniquely "commitment-heavy" vs. other speech acts.  
  - **Yes** → Leaf 2: **Assertion-Is-a-Family View**  
    - *Awkward commitment:* Denies a unified rule for assertion (e.g., courtroom vs. chat), making it hard to define what all assertions share.  

  ---

  ### **Subtree 2: Constitutive Norm Exists (from Q1 "No")**
  #### **Question 3: Moorean Paradox Case**  
  *Is it proper to assert, "It’s raining but I don’t believe it"?*  
  - **Yes** → The norm **does not require belief** (go to Question 4).  
  - **No** → The norm **requires belief** (go to Question 5).  

  #### **Question 4: Lucky Guess Case**  
  *You blindly guess a coin flip is heads and assert it. It lands heads, but you had no evidence. Was your assertion proper?*  
  - **Yes** → Leaf 3: **Truth Norm**  
    - *Awkward commitment:* Allows assertions of truths even with zero evidence (e.g., "The president is in Ecuador!" guessed correctly).  
  - **No** → Leaf 4: **Justification Norm (No Belief Required)**  
    - *Awkward commitment:* Permits insincere assertions if justified (e.g., asserting climate science while secretly denying it, but having evidence).  

  #### **Question 5: False Belief Case**  
  *You believe and assert, "It’s raining," but it’s dry. Was your assertion proper?*  
  - **Yes** → Leaf 5: **Belief Norm**  
    - *Awkward commitment:* Allows assertions of lottery propositions or conspiracy theories if sincerely believed (no evidence needed).  
  - **No** → The norm **requires truth** (go to Question 6).  

  #### **Question 6: Lucky Guess + Belief Case**  
  *You believe and assert, "The coin landed heads" (guessing blindly). It does. Was your assertion proper?*  
  - **Yes** → Leaf 6: **Truth + Belief Norm**  
    - *Awkward commitment:* Allows lucky guesses with belief (e.g., asserting "Your flight is safe!" based on a hunch that happens to be true).  
  - **No** → The norm **requires knowledge-level justification** (go to Question 7).  

  #### **Question 7: Lottery Case (for Knowledge)**  
  *You assert, "My lottery ticket will lose" (odds: 1 in a million). Was this proper?*  
  - **Yes** → Leaf 7: **Justification Norm (Belief Required)**  
    - *Awkward commitment:* Permits lottery assertions (you have evidence but don’t "know").  
  - **No** → Leaf 8: **Knowledge Norm**  
    - *Awkward commitment:* Forbids lottery assertions, though they seem rationally reasonable.  

  #### **Question 8: Second-Order Knowledge Case**  
  *You know your partner is home (you saw them), but you doubt your eyesight. Can you properly assert, "They’re home"?*  
  - **Yes** → Leaf 8: **Knowledge Norm** (reaffirmed).  
  - **No** → Leaf 9: **Iterated Knowledge Norm**  
    - *Awkward commitment:* Requires certainty about your knowledge, invalidating most everyday assertions.  

  ---

  ### **Unavoidable Overlaps and Empty Leaves**  
  1. **Indistinguishable pairs** (same answers to all cases):  
     - **Truth Norm vs. Gricean Pragmatism**: Both treat truth as central but differ on *why* (constitutive rule vs. conversational maxim). The tree separates them via the **Actor Case** (Q1), as Griceans accept stage utterances as assertions.  
     - **Knowledge Norm vs. Truth + Belief Norm**: Distinguished by the **Lucky Guess Case** (Q6)—only the latter accepts lucky true beliefs.  

  2. **Empty/Unattractive Leaves**:  
     - **Standing/Authority Norm**: Not included as a leaf—no major theorist defends a pure version (without truth/knowledge). Hybrids (e.g., "knowledge + authority") collapse into other leaves.  
     - **Minimal Norm**: A "no requirements" view is incoherent (assertion would permit anything).  
     - **Context-Sensitive Norm**: Not a leaf—contextualism (e.g., varying standards with stakes) is a *modifier* for other norms (e.g., contextualist knowledge).  

  3. **Awkward but Occupied**:  
     - **Truth + Belief Norm** (Leaf 6) and **Justification Norm (No Belief)** (Leaf 4) are theoretically possible but rarely defended due to obvious flaws (allowing luck/insincerity).  

  ---

  ### **Tree Summary**  
  | **Leaf #** | **Position**                          | **Path**                              |  
  |------------|---------------------------------------|---------------------------------------|  
  | 1          | Gricean Pragmatist                    | Q1: Yes → Q2: No                      |  
  | 2          | Assertion-Is-a-Family View            | Q1: Yes → Q2: Yes                     |  
  | 3          | Truth Norm                            | Q1: No → Q3: Yes → Q4: Yes            |  
  | 4          | Justification Norm (No Belief)        | Q1: No → Q3: Yes → Q4: No             |  
  | 5          | Belief Norm                           | Q1: No → Q3: No → Q5: Yes             |  
  | 6          | Truth + Belief Norm                   | Q1: No → Q3: No → Q5: No → Q6: Yes    |  
  | 7          | Justification Norm (Belief Required)  | Q1: No → Q3: No → Q5: No → Q6: No → Q7: Yes |  
  | 8          | Knowledge Norm                        | Q1: No → Q3: No → Q5: No → Q6: No → Q7: No → Q8: Yes |  
  | 9          | Iterated Knowledge Norm               | Q1: No → Q3: No → Q5: No → Q6: No → Q7: No → Q8: No |  

