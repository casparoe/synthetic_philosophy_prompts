  Step 4: Idempotency keys and CRDTs
  - Idempotency keys: Ensure that even if an event is replayed, the effect is the same. This might relate to how we remember events or how we interpret actions in a consistent way (like a cognitive idempotency). But it's a stretch.
  - CRDTs: They converge to the same state despite concurrent updates. This might be analogous to how our self-narrative converges from multiple sources (memories, others' accounts) but it's not a perfect fit.

  Step 5: The residue report
  We must separate into three piles.

