     Verdict: The gap is in the vocabulary. The user should consider a materialized view that is not just for querying but is part of the processing of new events. Then the narrative (the view) is used to interpret new events and generate actions. This is a feedback loop that doesn't require an external observer.

  B. Identity by convention:
     In the user's world, service identity is settled by convention and downstream systems (like billing). Dennett would say the same for persons: identity is settled by social and practical conventions. The question is whether this is a real fact or just paperwork. In the user's world, the service identity is real in the sense that it has causal consequences: if the billing system charges the wrong service, that's a real problem. Similarly, for Dennett, the person is real because it has causal power in the world (e.g., held responsible for actions). So it's not just paperwork; it's a fact about the system's operation. The gap: the user worries that convention makes it less real. But in both cases, the convention is part of the system's operation and thus real.

  Predictions:

