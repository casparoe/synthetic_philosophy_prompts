  Additionally, we must address two specific points of confusion:
  A. The distributed trace analogy: Traces are assembled by an outside observer (collector) for a purpose, but Dennett's narrative center seems to require no narrator or audience. Does the analogy break, or does the view need a reader?
  B. Identity by convention: In the user's world, identity is settled by convention and downstream systems (billing, etc.). Is this a real fact about the service or just paperwork? And how does that relate to Dennett?

  Finally, we are to provide a couple of predictions for edge cases, such as a corrupted log or an autoscaling service that uses its own traces.

  Let's brainstorm candidate mappings step by step.

