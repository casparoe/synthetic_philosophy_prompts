  Hmm, their opening move is quite sharp - they're comparing the Flying Man to thinking about the number twelve without considering its divisibility by three. They're saying the argument commits a fallacy by inferring that because bodily awareness isn't present in self-awareness, the body isn't essential to the self. That's a sophisticated objection drawing on essential properties.

