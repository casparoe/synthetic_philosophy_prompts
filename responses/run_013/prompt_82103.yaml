  First, I need to absorb their constraints: limited rehearsal time, non-reading singers, loyal audience expecting familiarity, and a decisive director. Their core request is a checklist that identifies which song elements can be varied ("knobs") versus which are fundamental ("welded shut"), with clear tests to avoid overcomplication. 

