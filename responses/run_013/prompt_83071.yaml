     - Stones are always advantageous: Adding a stone never harms a player's position (it only helps or is neutral in connecting their sides), so the first player's extra stone is beneficial.
     - The board symmetry is preserved: After any opening move, the board can be reflected or rotated to restore symmetry, allowing the strategy to be mirrored seamlessly.
