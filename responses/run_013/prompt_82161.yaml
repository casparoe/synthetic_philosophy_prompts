prompt: |-
  I'm putting together a handout for a small reading group I run — half stats grad students, half philosophy grad students, which is why I keep getting talked past on this — and instead of the usual list of names I want the handout to be a decision tree of the positions on the reference class problem. The thing I mean by it is the general one: you have statistics about a class (smokers, radium atoms, balanced coins run through a particular flipping machine) and you want to say something about a single member, but the individual belongs to indefinitely many classes that hand you different answers, so which one is the right one? It's struck me that people saying "the reference class problem" mean at least three different problems, and I want the tree to force that out early: (a) the semantic one, which class a single-case probability statement even refers to; (b) the epistemic one, given my total evidence which class I should conditionalize on; (c) the pragmatic one, which class an insurer or a doctor or a court should actually use when they have to act. So the first branch should be which of those you think the real problem is, and everything else hangs off that.

  Please make every node a question somebody could answer without already knowing which position it leads to, and build the tree out of the logical space first — the questions and which combinations of answers they allow — and only then hang names on the leaves. I want no more than eight leaves, and these need to come out somewhere: strict frequentism (single cases have no probability at all), propensity views, subjective Bayesianism where the worry dissolves because there's no unique correct class, objective Bayesianism with something like a maximal-specificity or max-entropy rule for choosing the class, the causal-relevance line where the class is fixed by what's causally relevant to the outcome rather than by what happens to be statistically associated, the view that the class is fixed by the decision you're facing, and the deflationary view that there's no fact of the matter but the problem is still real for anyone who wants direct inference to count as a valid form of inference. If two of those definately collapse into each other, merge them and say why rather than faking a seperate distinction.

  Cases I want used somewhere on the tree, because they're the ones that actually pull the positions apart: a coin you've verified is balanced but that's run through a machine you've seen come up heads 60% of the time on other balanced coins; a radium atom in a sample; a patient whose mortality-table class and genetic class disagree; Sleeping Beauty, where the fight is exactly over which class the awakening belongs to; the Doomsday argument; and an actuary pricing one policy, where the class gets chosen by regulation and practice rather than by truth. Don't bother with citations or a reading list, I just want the instrument. Give it to me in this order: "The opening questions" (about a paragraph, three or four questions max, each with the answers that split the tree); "The tree" (a nested outline, branch label at every node, as deep as it needs to go, keep it under a page); "The leaves" (one line on the position's central claim, one line on its most awkward commitment); "Empty branches" (the answer combinations nobody occupies, each with a one-line diagnosis of whether that's because the view is incoherent, unattractive, or just unexplored); and "What the tree can't separate" (pairs of positions that come out the same on every case I listed, and what extra case would be needed to pull them apart).
reasoning: |-
  Okay, the user is creating a decision tree handout about the reference class problem for a reading group with stats and philosophy grad students. They want to clarify three distinct aspects: semantic (what probability refers to), epistemic (which class to use given evidence), and pragmatic (which class to use in practice). 

  First, I need to design the tree's structure. The opening questions must split the tree based on which problem they consider primary. The first question should be: "What's the core problem?" with options: semantic (what probability statements mean), epistemic (how to choose with evidence), pragmatic (how to act without truth). 

  Next, for the semantic branch, the key question is whether single-case probabilities exist. If no, it leads to strict frequentism. If yes, we ask whether the reference class is fixed by causal factors or something else. This separates propensity views from others. 

  For the epistemic branch, after establishing that probabilities exist, we ask if there's a uniquely rational class. If no, subjective Bayesianism; if yes, then whether it's maximal specificity or causal relevance. 

  The pragmatic branch skips existence questions since practitioners act as if probabilities exist. Here, the split is whether the class is chosen by decision context or institutional rules. 

  The cases provided will help differentiate positions. For example, the balanced coin in a biased machine tests causal vs. statistical relevance. The patient with conflicting mortality/genetic data challenges maximal specificity. Sleeping Beauty highlights indexical vs. objective classes. 

  I need to ensure no more than eight leaves. Checking: strict frequentism, propensity, subjective Bayesianism, objective Bayesianism (max-spec), objective Bayesianism (causal), decision-relative, institutional pragmatism, deflationism. That's eight. 

  Deflationism is tricky—it denies a fact of the matter but treats the problem as real for direct inference. It should be a leaf under the semantic branch after affirming existence but denying class fixity. 

  Empty branches might include: affirming single-case probabilities exist but denying any selection method (incoherent), or pragmatic views that require truth but ignore institutional constraints (unattractive). 

  Undifferentiated pairs: max-spec and causal relevance might collapse on cases without causal ambiguity (e.g., radium atom). To split them, we'd need a case with non-causal correlations, like a patient with a statistically predictive but causally irrelevant trait. 

  The user wants minimal jargon. I'll phrase questions plainly: "Must the reference class directly cause the outcome?" instead of "Is causality necessary?" 

  Sleeping Beauty is key for subjective vs. objective Bayesian splits—subjective Bayesians allow indexical classes, objective ones demand observer-independent facts. 

  Actuary case isolates institutional pragmatism—here, regulation overrides truth. 

  Final check: all target positions are covered, cases are integrated, branches are logically sound. The tree should force clarity without presupposing expertise.
answer: |-
  Here's a decision tree structured to force out the distinctions in the reference class problem, using your cases and target positions, kept within the constraints.

  **The Opening Questions**
  Start by identifying which core aspect of the reference class problem is seen as fundamental. This splits the logical space:
  1.  **What is the core problem preventing a solution?**
      *   **(A) Semantics:** The meaning of a single-case probability statement itself is unclear or undefined.
      *   **(B) Epistemology:** Given total evidence, there's no unique rational way to select *which* reference class probability to use.
      *   **(C) Pragmatics:** In real-world action, the "right" class isn't determined by truth but by context, even if semantics/epistemology *were* resolved.

  **The Tree**

  *   **Q1: What is the core problem preventing a solution?** (A, B, or C)
      *   **If (A) Semantics:** (Meaning undefined)
          *   **Q1A: Can genuine single-case probability statements be made at all?** (e.g., "Pr(this coin lands heads) = ?", "Pr(this patient dies) = ?")
              *   **No:** Proceed to Leaf 1: **Strict Frequentism**.
              *   **Yes:** Proceed to Q1A2.
          *   **Q1A2: Is the reference class for a single case fixed by facts about the world (independent of our evidence/choices)?**
              *   **Yes:** Proceed to Q1A2a.
              *   **No:** Proceed to Leaf 8: **Deflationism**.
          *   **Q1A2a: Must the reference class directly involve the *causal mechanisms* producing the outcome?**
              *   **Yes:** Proceed to Leaf 2: **Propensity (Causal Relevance)**.
              *   **No:** (Fixed by world, but not necessarily causal) *[EMPTY BRANCH - Unattractive/Unstable]*.
      *   **If (B) Epistemology:** (Choosing rationally given evidence)
          *   **Q1B: Do single-case probabilities exist/are they meaningful?** (Implied by pursuing epistemic choice)
              *   **Yes:** Proceed to Q1B2. *(Assumed for this branch)*
          *   **Q1B2: Is there a uniquely rational reference class for direct inference, given *total* evidence?**
              *   **No:** Proceed to Leaf 3: **Subjective Bayesianism**.
              *   **Yes:** Proceed to Q1B2a.
          *   **Q1B2a: Is the uniquely rational class defined by being the *most causally relevant*?**
              *   **Yes:** Proceed to Leaf 5: **Objective Bayesianism (Causal Relevance)**.
              *   **No:** Proceed to Leaf 4: **Objective Bayesianism (Maximal Specificity)**.
      *   **If (C) Pragmatics:** (Acting under constraints)
          *   **Q1C: Should the reference class be chosen based primarily on...?**
              *   **...the specific *decision context* and its stakes?** (e.g., insurer vs. doctor vs. court) Proceed to Leaf 6: **Decision-Relative**.
              *   **...established *institutional rules/practices*?** (e.g., actuarial tables, regulatory standards) Proceed to Leaf 7: **Institutional Pragmatism**.

  **The Leaves**

  1.  **Strict Frequentism:** *Claim:* Probability is *only* a property of a long-run sequence; "Pr(single event)" is meaningless. *Awkward:* Can't assign probabilities to genuinely unique events (Radium atom, Doomsday) or justify single bets.
  2.  **Propensity (Causal Relevance):** *Claim:* The "true" Pr(single event) is fixed by the most specific class capturing *causal factors* relevant to the outcome. *Awkward:* Defining "causal factors" non-circularly; handling cases where non-causal stats are known (Patient's mortality table vs. genetics).
  3.  **Subjective Bayesianism:** *Claim:* Probability is degree of belief; any consistent prior is valid. The "problem" dissolves - you condition on *all* evidence, weighting classes implicitly. *Awkward:* Allows radically different, equally "rational" probabilities for the same case (Coin/Machine ambiguity).
  4.  **Objective Bayesianism (Maximal Specificity):** *Claim:* Pr(single event) is given by the *narrowest* relevant reference class specified by total evidence. *Awkward:* Ambiguity in defining "relevant" & "specified"; instability with conflicting narrow classes (Patient case).
  5.  **Objective Bayesianism (Causal Relevance):** *Claim:* Pr(single event) is given by the reference class defined by factors *causally relevant* to the outcome, identified by evidence. *Awkward:* Requires knowing/assuming causal structure; may conflict with strong non-causal stats (Balanced coin in biased machine).
  6.  **Decision-Relative:** *Claim:* The "right" class depends on the *decision's context*, costs, and available actions. *Awkward:* Truth/accuracy may be secondary to utility; hard to formalize "context".
  7.  **Institutional Pragmatism:** *Claim:* The "right" class is fixed by standard practices, regulations, or conventions within the relevant institution. *Awkward:* Defers epistemic/semantic questions; practices can be arbitrary or unjust.
  8.  **Deflationism:** *Claim:* There's no fact about the "true" class/probability, but the problem remains real for *direct inference* (moving from stats to single case). *Awkward:* Makes direct inference seem metaphysically shaky or purely instrumental.

  **Empty Branches**

  *   **Semantic 'Yes' -> World-Fixed -> Not Causal:** Claiming single-case probabilities exist *and* have a world-fixed reference class, but it's *not* causal. *Diagnosis:* Unattractive/Unstable. What *else* fixes it? Pure statistics? This seems to collapse into either Propensity (if it's something *like* causal structure) or lead straight into the Epistemic problem.
  *   **Epistemic 'Uniquely Rational' -> Not Causal & Not Max-Spec:** Claiming there's a unique rational class given evidence, but it's defined by something other than causality or maximal specificity. *Diagnosis:* Unexplored/Undefined. It's unclear what principle would ground uniqueness besides these two major contenders.

  **What the Tree Can't Separate (with your cases)**

  1.  **Subjective Bayesianism (Leaf 3) vs. Deflationism (Leaf 8):**
      *   **Why:** Both deny a unique "correct" probability/class. Subjective Bayesians see probability as belief, Deflationists see no fact of the matter but acknowledge the inference problem. Your cases (like Coin/Machine, Patient, Sleeping Beauty) show ambiguity handled similarly by both (use your prior / there's no unique answer).
      *   **Case to Separate:** **The Doomsday Argument.** A Subjective Bayesian would assign a prior to the Doomsday hypothesis and update based on birth rank, seeing it as a valid (if controversial) Bayesian argument. A Deflationist would argue there *is no fact* about which reference class (all humans? observers in this universe-state?) is "correct" for the birth-rank likelihood, making the argument fundamentally ill-posed for direct inference, not just sensitive to priors. They deny the *meaningfulness* of the inference structure in a way the Subjective Bayesian accepts.

  2.  **Objective Bayesianism Max-Spec (Leaf 4) vs. Causal (Leaf 5):**
      *   **Why:** In many cases (Radium atom - most specific *is* causal decay propensity; Actuary - regulations often *use* causal-ish classes like age/smoking; Sleeping Beauty - both might use "awakenings in experiment X"), the maximally specific class *known* and the causally relevant class *coincide*. The Balanced Coin case *aims* to separate them (causal=balanced coin physics? statistical=coin+machine history?), but proponents of each view will interpret the "total evidence" to favor their class.
      *   **Case to Separate:** **Patient with Predictive but Non-Causal Marker.** Imagine a patient: Mortality Table based on Age/Sex/Disease (causal) = 10% 5yr mortality. Genetic Test reveals Marker Y (highly statistically correlated with mortality, but causally inert - maybe it's linked to a causal gene not directly tested, or it's a fluke). Max-Spec (Leaf 4) says use Marker Y if known (e.g., 40% mortality). Causal (Leaf 5) says ignore Marker Y; use the causally relevant class (10%). This forces the distinction based on whether non-causal predictive power trumps causal structure when known.
