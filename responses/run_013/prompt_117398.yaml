prompt: |-
  I'm in an aesthetics seminar and next week it's my turn to run the session on forgeries, so I want to hand out a decision tree that starts from "yeah, a perfect copy of a painting is usually worth less than the original" and ends in a position about *why* that's so, so people find out which one they actually hold rather than which one they'd say they hold. Every branch node should be a concrete case: a molecule-for-molecule duplicate made by a machine; a 1930s forgery in Vermeer's style that's honestly a better painting than a mediocre real Vermeer; a bronze cast where the artist's original plaster is destroyed; a perfect transcription of a manuscript you'd still pay money to touch; a robot executing a program the artist wrote. Our prof's handout seperated "origin value" into evidential value (the original is evidence about the artist's history), achievement value (it records somebody actually solving a problem) and contact value (it's the thing the hand touched), and I want the tree built on that split, plus the further question of whether a forgery fails to be the same work or only the same object, and whether two things that look identical can still differ in aesthetic properties. Leaves should be the positions, one line each on the case that's most awkward for it, and flag any two the tree can't seperate. No citations needed. Also I keep calling the first position "formalist" — is that the right word or am I mixing it up with something else?
