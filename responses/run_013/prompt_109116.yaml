  ## The Sound of One Hand Not Booing

  The morning circle at Meadowlark Commune smelled of damp wool and oat porridge. Twelve adults sat cross-legged, passing around a chipped mug of nettle tea. Eli, bearded and earnest, laid out the day’s tasks. “Chopping wood?” he offered. A chorus of soft “Cheers!” rippled through the circle. “Not cleaning the outhouse?” he added. Louder, overlapping “Boos!” filled the air, followed by good-natured groans. This was their language: pure expression. Moral talk wasn't about stating facts about the world, Eli had argued years ago, echoing the thinkers they admired; it was about *attitude*, pure and simple. To say "X is wrong" was just a sophisticated "Boo!" To say "X is right" was a "Cheers!" Propositions were out. Expression was in.

  It worked, mostly. Disagreements were visceral exchanges of feeling: “Boo! Leaving tools out in the rain!” met with “Cheer! Efficient workflow!” Negotiation was noisy. Until it wasn't.

  The trouble started with Maya’s son, Jonah. Five years old, boundless energy, prone to snatching. Yesterday, he’d grabbed Lenore’s prized hand-carved wooden owl right off her windowsill. Lenore, usually serene, had frozen, then let out a raw, guttural “**BOO!**” so intense Jonah had burst into tears. Maya scooped him up, throwing a defensive “Cheer! Childhood curiosity!” back at Lenore before retreating to their cabin. The air crackled.

  This morning, the circle felt tense. Eli cleared his throat. “About Jonah and the owl…” He paused, seeking the right expression. “We all felt the… *sound* yesterday. Lenore?”

  Lenore, eyes still shadowed, took a breath. “Cheer… for respecting others’ things?” Her voice was flat, unconvinced. It wasn’t a cheer; it was a question, a plea for agreement. Weak, scattered “Cheers” responded.

  Maya jumped in. “Cheer! For understanding developmental stages! Boo! For harshness!” She glared at Lenore.

  Danny, usually quiet, leaned forward. He’d been trying to mediate. “Okay, okay. Look. Lenore felt a strong… *expression* about Jonah taking the owl. Jonah felt a strong… *expression* back. Maya feels a strong… *expression* about Lenore’s… *expression*.” He stumbled, the linguistic knots tightening. “But here’s the thing, maybe…” He hesitated, searching for words their rules allowed. “Maybe what Jonah did… **wasn’t something we should boo.**”

  Silence. Thick, awkward silence. Faces wrinkled in confusion.

  “Wasn’t… something we should boo?” Eli repeated slowly. “Danny, what does that *express*? Are you… *cheering* Jonah taking the owl?”

  “No! Boo! Definitely not cheering!” Danny said quickly, flustered. “I’m *not* booing it either! I’m saying… it doesn’t deserve a boo. Not like stealing food, or… or hurting someone. It was just grabbing. Wrong place, wrong time, maybe, but… not *boo-worthy*.”

  The commune stared. Danny’s words hung in the air, refusing to resolve into their binary language. He wasn’t booing. He wasn’t cheering. He was trying to carve out a space *between* or *outside* their established expressions. He was trying to say: **not wrong.**

  Lenore seized on the ambiguity. “Not boo-worthy?” Her voice rose. “So, you *cheer* it? You cheer my owl being snatched?”

  “No!” Danny insisted, frustrated. “I *don’t* cheer it! But I also *don’t* think it deserves the big, scary BOO Lenore gave it! It was… minor. Annoying, maybe. A ‘hmm, not great’. But not a full BOO!” He mimed a small, hesitant gesture, utterly foreign to their expressive vocabulary – something like a shrug mixed with a weak thumbs-down. It looked ridiculous.

  Maya saw an opening. “See? Danny gets it! What Jonah did… **wasn’t wrong.**” She stated it clearly, definitively.

  The silence returned, heavier this time. Maya hadn’t cheered or booed. She’d *asserted* something about Jonah’s action: that it lacked the property that demanded a boo. She’d made a claim. A proposition. Eli visibly flinched.

  “Maya,” he said carefully, “our agreement… we express our attitudes. We don’t… state truths about wrongness.”

  “But Danny *just did* the same thing, only messier!” Maya countered. “He tried to say it wasn’t boo-worthy, which is just saying it wasn’t wrong! And now I need to tell Jonah something. Do I tell him ‘Boo!’? But I don’t feel a big boo. Do I tell him ‘Cheer!’? That feels crazy. I need to tell him… it wasn’t *quite* bad. It wasn’t *wrong*, but it wasn’t okay either. What *sound* does that make?”

  Later, the final wrench. Jonah, tear-streaked, tugged at Maya’s sleeve. “Is Lenore mad at me *forever*?” he sniffled. “Did I do a real bad thing?”

  Maya knelt. “Oh, sweetie. Lenore felt… very strongly about her owl. She expressed a big feeling.” She paused, struggling. “What you did… made her feel very sad.” It was descriptive, psychological – a retreat from the moral entirely.

  Jonah looked unconvinced. “But *was* it bad? Was it wrong?”

  Maya opened her mouth. Nothing came out. Not cheer. Not boo. Just the silent, grinding gears of a language that couldn’t cope with the simple word "**not**".

  ---

  **The Patch & The Cost**

  1.  **Gibbard's Norm-Acceptance:** Saying "murder is wrong" expresses *acceptance of a norm* prohibiting murder. Negation ("It wasn't wrong") could express *non-acceptance* of the norm condemning the act. This buys back logic (non-acceptance isn't acceptance of the opposite norm), but it intellectualizes attitudes into quasi-cognitive states about norms – a significant retreat from pure boo/cheer expressivism. The commune could *try* replacing boos/cheers with "I accept the norm against X"/"I reject the norm against X", but it feels formal and loses the visceral immediacy they prized.
  2.  **Blackburn's Higher-Order Attitudes:** Negating "X is wrong" expresses disapproval (*boo!*) towards *others* approving of X. "It wasn't wrong" becomes "Boo to anyone who would boo Jonah!" This preserves non-cognitivism but feels convoluted and struggles with embedding in complex beliefs (e.g., "Maya thinks it wasn't wrong" becomes a baffling nesting of attitudes about attitudes). The commune *could* adopt this, but their conversations would become tortuously meta.
  3.  **Minimalism/Quasi-Realism:** Blackburn's later move. Grant that moral sentences *do* express propositions and *can* be true/false in a minimal sense ("true" just means we'd assert it), while insisting the *underlying state* expressed is still non-cognitive. This saves the logic seamlessly but risks collapsing expressivism into realism-lite. The commune's core insight – that moral talk isn't descriptive – gets severely diluted.

  **Sidestepping?** A purely imperative practice ("Don't murder!") might avoid *some* embeddings but crumbles with negation ("Don't... not murder?" is nonsense) and questions. Any practice rich enough to mimic ordinary moral discourse likely reintroduces the embedding problem. The commune's fundamental challenge was trying to replicate propositional logic's power with purely expressive tools; the mismatch was probably inevitable.
