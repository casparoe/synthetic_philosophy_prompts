prompt: |-
  I spent most of last night arguing with a friend about explanation, and I came away realising that I don't actually know what my own position is exposed to. Here is what I hold. Explanations in biology and psychology come in two kinds. Either the thing is assembled from parts and processes that are themselves already understood — selection, iteration, mechanism, structure accumulated step by step — or it is simply stipulated: a primitive is planted at the bottom of the story and permitted to do work it has not earned. The second move is never legitimate. Where it appears to succeed, it is either the first kind not yet understood or a failure of nerve. I also hold that the charge of greedy reductionism names a real error rather than a matter of taste: there is a difference between decomposing a system into parts that preserve the phenomenon and decomposing it so finely that the phenomenon quietly disappears, and the latter is a mistake, not a preference.

  My friend made three moves against this, and I want to know which of them I should feel.

  First, he said the dichotomy is not exhaustive. Some explanations in biology and cognition cite neither an assembly history nor a stipulated primitive but the form of a system — constraints, symmetries, self-organising dynamics — so that the correct answer to "why this pattern?" is "because this is what such systems do". If that is a genuine third kind, my dichotomy is a false dilemma.

  Second, he said my notion of the greedy is circular: I call a reduction greedy only once it has failed to explain something, so no possible result could show the category to be empty, and a distinction applied only after the verdict is doing no work.

  Third, he said that if I cannot describe what a genuine non-crane would look like — what could conceivably make me say that a stipulated primitive is doing real explanatory work here — then I am not stating a claim about the world but a rule about what I will accept as a claim.

  Give me a map of my exposure rather than a defence. Which challenges bite, which should I simply absorb, and which defeaters has he missed — especially ones available from inside the naturalist camp, since those are the only ones I really have to answer? For each serious candidate, say what would have to be true for it to count, whether it would be decisive or merely awkward, and whether I could absorb it without changing the substance of the view. Say what my position forbids that its rivals permit; if the only difference is which explanations I am willing to accept after the fact, say that plainly. Tell me what its most sophisticated defenders would concede as counting against them, rather than what its critics say. And if the view turns out to be unfalsifiable as stated, say so, then say whether that is a defect or simply what it is to hold a methodological commitment rather than an empirical claim — and whether that distinction is itself a dodge. What would move me most is a case in which the vocabulary forces me to call something unexplained when it is in fact well explained.
reasoning: |-
  Okay, let's start by unpacking the user's query. They had a debate about explanations in biology and psychology and are now questioning their own stance. Their position has two main pillars: explanations must either break things down into understood parts/processes or avoid stipulating unearned primitives. They also believe "greedy reductionism" is a real error where decomposition destroys the phenomenon.

  First, I need to address the friend's three challenges. The first challenge introduces a third kind of explanation—system-level dynamics like constraints or self-organization. The user worries if this breaks their dichotomy. I recall examples in biology, like protein folding or flocking behavior, where the explanation isn't about parts or history but system properties. If such cases are valid, the user’s dichotomy might indeed be incomplete. 

  Next is the circularity charge. The friend claims "greedy reductionism" is only labeled after the fact. The user needs to clarify if they have criteria to identify greediness beforehand. Without predictive markers, the term might just describe failures post-hoc, which weakens its validity.

  The third point is about stipulating primitives. If the user can't imagine a scenario where a primitive legitimately explains, their stance might be a methodological rule rather than a factual claim. This touches on the philosophy of science—distinguishing empirical claims from methodological commitments.

  Looking deeper, the user might be seeking validation of their naturalist framework. They mention only needing answers from within naturalism, so defenses must align with that. Their anxiety about unfalsifiability suggests they want their position to be robust, not dogmatic. The unspoken need could be a desire for a coherent, defensible worldview that doesn't rely on unexamined assumptions.

  I should also consider if there are defeaters the friend missed. For example, emergent phenomena in complex systems that aren't reducible but aren't stipulated either. Or cases where primitives are unavoidable temporarily, like in neuroscience with consciousness. Highlighting these could show where the user's view might need adjustment.

  Each challenge requires assessing bite: the first is serious (dichotomy may be false), the second is moderate (circularity can be mitigated), the third is critical (threatens to reduce the stance to mere preference). Offering absorption strategies, like refining definitions or accepting methodological status, could help without abandoning core principles. 

  Finally, the user wants a case where their vocabulary mislabels a well-explained phenomenon. Citing something like consciousness explained by neural dynamics might force them to confront if their criteria are too rigid. This would test the flexibility of their framework and its ability to adapt to genuine scientific progress.
answer: |-
  Here’s a map of your exposure, structured around your friend’s challenges and additional defeaters from within naturalism. Your core commitments are:  
  **(1)** The *Assembly-vs-Stipulation* dichotomy exhausts explanation;  
  **(2)** Stipulation is never legitimate;  
  **(3)** Greedy reductionism is a *real error* (not taste).  

  ---

  ### **Challenge 1: The Dichotomy Isn’t Exhaustive**  
  **The Bite**: Serious. If constraints/self-organization/symmetries explain phenomena *without* referencing assembly history *or* stipulating primitives, your dichotomy collapses.  
  **What Would Make It True**: A phenomenon (e.g., protein folding, flocking behavior, neural synchrony) is robustly explained by system-level dynamics alone. For example:  
  > *"Why do cells form hexagonal honeycomb patterns?"* → *"Minimizing surface energy in close-packing – a thermodynamic inevitability given physics, not assembled parts or a new primitive."*  
  **Decisive?**: Yes, if such explanations are irreducible to part-level assembly *and* don’t smuggle in stipulation (e.g., "energy minimization" isn’t a primitive if derived from established physics).  
  **Can You Absorb It?**: Partially. Redefine "assembly" to include *dynamic self-assembly* (e.g., "processes" in your view). But if self-organization *replaces* mechanistic decomposition, the substance of your view shifts.  
  **What Your View Forbids**: Treating "system-level constraints" as explanatory bedrock *without* showing how they emerge from lower-level interactions. Rivals permit this.  
  **Sophisticated Defender’s Concession**: *"Some patterns (e.g., fractal branching) are best explained by mathematical constraints – but these constraints supervene on physical laws, which *are* assembled from understood primitives."*  

  ---

  ### **Challenge 2: Circularity of "Greedy Reductionism"**  
  **The Bite**: Moderate. If you only label a reduction "greedy" *after* it fails, the concept lacks predictive power.  
  **What Would Make It True**: No independent criteria for greediness (e.g., "reducing to components smaller than X" or "ignoring emergent properties Y").  
  **Decisive?**: No – but it weakens your claim that greediness is a *real error* rather than hindsight.  
  **Can You Absorb It?**: Yes. Specify pre-failure markers:  
  > - *Component neglect*: Omitting parts necessary for the phenomenon (e.g., reducing consciousness to neurons but ignoring glial cells).  
  > - *Scale mismatch*: Decomposing to a level where the phenomenon *cannot* manifest (e.g., explaining "trust" via quarks).  
  **What Your View Forbids**: Calling a reduction "greedy" *before* it fails. Rivals say greediness is context-dependent.  
  **Sophisticated Defender’s Concession**: *"We can’t define greediness a priori for all cases – but we know it when a reduction *loses* explanatory power. This is no more circular than identifying bad theories by their predictive failures."*  

  ---

  ### **Challenge 3: No Test for Legitimate Primitives**  
  **The Bite**: Critical. If you can’t conceive of a scenario where stipulation *succeeds*, your stance is a methodological rule, not a claim about the world.  
  **What Would Make It True**: You reject *all* proposed primitives (e.g., "qualia," "free will") as unearned, even if they resolve otherwise-unsolvable problems.  
  **Decisive?**: Yes. If your position is unfalsifiable by design, it’s not empirical.  
  **Can You Absorb It?**: Only by reframing. Concede it’s *methodological naturalism*: "I provisionally reject stipulation because history shows primitives either get reduced or hinder progress." This preserves substance but admits it’s a rule.  
  **What Your View Forbids**: Ever accepting a primitive. Rivals permit it if a primitive is empirically indispensable (e.g., "dark energy" in cosmology).  
  **Sophisticated Defender’s Concession**: *"No *current* primitive is legitimate – but if we found a phenomenon with no assembly path *and* no system-dynamic explanation, *and* it predicted novel findings, we’d have to consider it. That hasn’t happened."*  

  ---

  ### **Defeaters Your Friend Missed (From Naturalism)**  
  1. **Temporarily Useful Stipulation**:  
     - **Case**: "Genes" were once primitives (Mendel’s factors). Later reduced to DNA.  
     - **Bite**: If stipulation is a *heuristic* that advances science, is it "illegitimate"? Your view forbids this; rivals allow productive stipulation as scaffolding.  
     - **Absorption**: Accept it as "crane in progress" – but then your "never legitimate" softens.  

  2. **Eliminativism as Greedy?**:  
     - **Case**: Explaining "belief" by eliminating folk psychology and reducing to neural states. You call this greedy if "belief" disappears. But what if *there are no beliefs*?  
     - **Bite**: Your charge of greediness assumes the phenomenon *exists*. If eliminativism is true, the "error" is misplaced.  
     - **Absorption**: Double down: "If reduction eliminates a *real* pattern (e.g., predictive power lost), it’s greedy." Requires defining "real pattern."  

  3. **Non-Causal Explanations**:  
     - **Case**: Mathematics explaining biological form (e.g., Fibonacci sequences in sunflowers). No "assembly" or "primitive" – just structure.  
     - **Bite**: Forces you to expand "processes" to include formal causes – or deny these are explanations.  

  ---

  ### **Does Your Vocabulary Mislabel Explained Phenomena?**  
  **The Test Case**: *Consciousness via Global Workspace Theory (GWT)*.  
  - **Explanation**: Consciousness arises from information integration in neural networks. No "primitive" – but not reducible to single neurons.  
  - **Your Vocabulary**: If you insist on "assembly from understood parts," GWT may seem non-greedy. But if you demand *further* reduction to physics, it becomes greedy.  
  - **Result**: You might call it "unexplained" if unsatisfied by dynamics alone – but GWT is empirically productive. **This bites**.  

  ---

  ### **Is Your Position Unfalsifiable?**  
  - **Yes**, if you define "understood parts" and "earned" post hoc.  
  - **Is This a Defect?**: Only if you claim it’s empirical. As a *methodological stance* ("Always seek assembly histories"), it’s defensible but not truth-apt.  
  - **Dodge?**: Only if you deny the distinction. Naturalists like Dennett (a crane advocate) admit this is *philosophy*, not science.  

  ---

  ### **Synthesis: What Holds?**  
  | **Challenge**         | **Bite Severity** | **Absorbable?**          | **Substance Change?** |  
  |------------------------|-------------------|--------------------------|----------------------|  
  | Non-exhaustive dichotomy | High              | Only by expanding "assembly" | Yes (softens dogma)  |  
  | Circular greediness     | Medium            | Yes (add criteria)       | No                   |  
  | Untestable stipulation  | Critical          | Yes (reframe as method)  | Yes (admits non-empirical core) |  
  | **Overall Vulnerability**: High. Your view is most exposed as **methodological dogma** when faced with powerful systems-dynamic explanations or eliminativist successes. To survive, concede it’s a *heuristic* – but then your "never legitimate" loses force.  

  **What Would Move You**: A phenomenon explained *only* by stipulation that predicts novel findings (e.g., a cognitive module with no neural correlate). None exist today – but if one did, your view breaks. Until then, it’s a wager on the reducibility of nature.
