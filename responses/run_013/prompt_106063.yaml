  Okay, let me start by unpacking this user's query. They've been diving deep into rationalist blogs and Strawson's ideas on moral responsibility. Their main points are laid out, but they're worried about consistency, especially with two specific cases: the cult-raised adult and the emotionally impaired teenager. 

  First, I need to understand each of their five claims. Point 1 says moral responsibility is just the practice of reactive attitudes—no deeper metaphysical truth. Point 2 argues determinism doesn't affect this since reactive attitudes aren't about causation. Point 3 distinguishes personal resentment from impersonal indignation, linking the latter to moral responsibility. Point 4 notes that the objective attitude is appropriate for some (like kids) but not for adults. Point 5 emphasizes that reactive attitudes are inescapable; there's no external standpoint to judge them.

  The user's conflict arises when applying these to the cult member and the teenager. They feel indignation is appropriate for the cult member but not for the teenager, even though both seem to lack the capacity for normal relationships. Why the inconsistency?

  Looking at point 4, the user says the objective attitude is right for those who can't engage in normal relationships. But the cult member, despite their upbringing, is still an adult. The teenager, however, has reactive-attitude deficits. So the user might be conflating chronological adulthood with the capacity for relationships. 

  The cult member's inability to form normal relationships due to indoctrination should logically place them in the same category as the impaired teenager. But the user resists this, possibly because the cult member is an adult. Here's the tension: point 4's grounding in capacity versus the instinct to hold adults responsible regardless.

  The user might be over-relying on age as a proxy for capacity. The cult member never developed the capacity, much like the teenager. So why treat them differently? The core issue is whether the criterion for appropriateness (point 4) is based on capacity or something else, like societal norms. 

  Strawson's framework requires assessing an agent's capacity for relationships. Both the cult member and teenager lack this, yet the user applies indignation to one but not the other. That inconsistency stems from not fully applying their own principle. The fix is to adjust point 4 to focus strictly on capacity, regardless of age. This means the cult member shouldn't be a target of indignation either, which might feel counterintuitive but aligns with their other points.

  Alternatively, they could redefine what constitutes "normal relationships," but that's messy. The cheapest fix is to align their judgment with capacity, even if it means revising their verdict on the cult case. It costs them the intuition that adults are always responsible, but preserves internal consistency.
answer: |-
  Alright, let's unpack this. You've got a solid grasp of the Strawsonian core – the reactive attitudes *are* the practice, determinism is irrelevant to their validity, the objective attitude has its limited place, and there's no external tribunal for the whole shebang. The friction you're feeling, particularly with the cult member vs. the impaired teenager, exposes a tension *within* your own framework, specifically between points (3), (4), and how you're applying them in borderline cases. Nothing here is fundamentally contradictory, but the application needs tightening.

  Here’s the rub: Your discomfort stems from an implicit conflict between the *source* of the incapacity triggering the objective attitude (point 4) and the *impersonal nature* of indignation/moral disapproval (point 3), especially when that incapacity is severe and pervasive but stems from a particular kind of history.

  **Breaking down the tension:**

  1.  **Point (4) is Your Grounding for Exemption:** You clearly state there's a "fact of the matter" about when the objective attitude is appropriate. This hinges on the agent's *capacity* to participate in "ordinary adult interpersonal relationships" *as understood within the practice itself*. Little kids lack the cognitive/emotional maturity. Severe mental illness can profoundly disrupt the ability to understand norms, reasons, or the impact of actions on others. We manage them because relating to them *as* responsible agents in the full sense breaks down.
  2.  **Point (3) Defines Moral Responsibility:** You rightly separate personal resentment ("you wronged *me*") from impersonal indignation/moral disapproval ("that act/agent is morally objectionable"). The latter is what makes responsibility truly *moral* – it invokes the shared standards of the moral community.
  3.  **The Cult Member Case:** You grant he "never had a real shot at becoming someone who could take part in normal relationships." This is crucial. If he truly lacks the *capacity* for the kind of reciprocal understanding and responsiveness that underpins the reactive attitudes – the very capacity point (4) says is necessary to be a proper target – then by *your own criterion in (4)*, he *should* fall into the category where the objective attitude is appropriate. His incapacity isn't temporary like drunkenness, nor is it localized; it's fundamental, stemming from his life-long indoctrination preventing the development of the requisite moral psychology. If the teenager's "reactive-attitude deficits" exempt him because they impair this capacity, the cult member's arguably more profound and ingrained deficits (preventing the capacity from ever forming) should logically exempt him too.
  4.  **Your Intuition vs. Your Principle:** Your intuition that indignation is *still* appropriate for the cult member pulls against your stated principle in (4). Why the difference? It might be because:
      *   **Chronological Age Proxy:** You're intuitively leaning on chronological adulthood as a proxy for "should have capacity," even when you intellectually acknowledge the capacity was never developed. The cult member is an *adult*, the teenager is not. But point (4) is about *capacity*, not age. A severely intellectually disabled 30-year-old isn't a proper target either.
      *   **The "Full Stop" of Impersonal Attitudes:** Point (3) emphasizes that indignation is about the act/agent "full stop." This feels impersonal, universal. The *awfulness* of the act screams for condemnation, seemingly independent of the agent's history. This impersonal force makes it harder to apply the exemption you grant based on capacity when the act is heinous. The gravity of the wrong tempts you to override the capacity criterion *for the impersonal attitude specifically*.
      *   **Source of Incapacity:** There might be a subconscious distinction between incapacity caused by internal pathology (teenager's deficits, mental illness) vs. incapacity caused by extreme external manipulation (the cult). We might feel the cult member *should* have known better *despite* the indoctrination, or that the cult leader bears the responsibility, not the member. But if the member genuinely, through no fault or choice of his own, lacks the capacity to grasp the moral significance of his actions *at all* (like a child, or someone with profound psychosis), then the source becomes less relevant to *his* current status as an appropriate target for indignation *within the practice*. The practice exempts based on current incapacity, not the cause (unless the cause itself implies retained capacity, like negligence).

  **Diagnosis & The Cheapest Fix:**

  The core tension is **between the strict application of the *capacity* criterion for exemption (point 4) and the strong pull of the impersonal reactive attitudes (point 3) in cases of severe moral wrongs committed by agents whose incapacity stems from non-standard developmental histories.**

  *   **Points (1), (2), and (5) are solid and not causing the problem.** They establish the framework.
  *   **Point (3) is correct** in distinguishing the attitudes but highlights why the cult case feels sticky – the impersonal attitude *feels* like it should apply universally.
  *   **Point (4) is your key principle for exemption**, but you're inconsistently applying it between the teenager and the cult member.

  **The Cheapest Fix: Recalibrate Point (4)'s Application to the Cult Case.**

  *   **The Cost:** You have to bite the bullet and accept that the profoundly indoctrinated cult member, *if truly incapable of grasping the moral significance of his actions or responding to the demands of relationships in a normal way*, is *not* a proper target for indignation or moral disapproval. He might be a target for fear, horror, pity, or a need for containment (objective attitude), but not the full reactive suite. This feels counterintuitive because the act is awful and he's chronologically adult.
  *   **The Justification:** This is the most consistent with your core Strawsonian view. The practice of holding responsible *requires* participants capable of understanding and being moved by the reactive attitudes. If the cult member lacks that capacity as fundamentally as the impaired teenager, the practice logically cannot engage with him *as a moral agent*. The "full stop" of point (3) applies *within* the community of agents; he stands outside it. To hold him responsible in the moral sense would be as incoherent as resenting a tornado. You can lament the *state of affairs*, condemn the *cult system*, but indignation *at him* misfires.
  *   **Why it's Cheaper than Alternatives:** Altering point (3) (blurring personal/impersonal) undermines the core of moral responsibility. Abandoning point (4)'s "fact of the matter" opens the door to pure relativism about exemptions, which you rightly reject. Denying point (1) or (2) blows up the whole framework. Accepting that the capacity criterion sometimes leads to uncomfortable conclusions with deeply wrong acts committed by profoundly broken agents is the price of internal consistency here.
  *   **Mitigating the Cost:** You can emphasize:
      *   This doesn't absolve the *cult* or its leaders.
      *   It doesn't mean *no* response is warranted – containment, therapy, societal protection are crucial, but they belong to the objective stance.
      *   The line can be fuzzy, and many cult members may retain *some* glimmers of capacity, making them partial participants. But the limiting case of *profound, life-long indoctrination* resulting in the *complete absence* of normal moral psychology warrants exemption.
      *   This exemption is *rare* and doesn't apply to most people with bad upbringings who still develop minimal capacity for reciprocity.

  **If You Absolutely *Must* Sacrifice One Point (But Try Not To):**

  The one that *could* be weakened with the least damage to the overall structure, *if you insist on retaining indignation for the cult member*, would be to **fuzzify the "fact of the matter" in point (4)**. You could argue that the criteria for exemption based on capacity are intrinsically somewhat fluid, context-dependent, and influenced by the gravity of the wrong. The practice itself might *stretch* to include the cult member as a target precisely *because* the act demands the full force of impersonal condemnation, even if his capacity is severely compromised. However, this is messy. It risks making exemptions arbitrary or overly emotion-driven. It significantly weakens the objective grounding you want for point (4) and blurs the line you drew in point (3) by making the impersonal attitude less strictly tied to agent-capacity within the practice. It's the "cheaper" fix only in the sense of preserving your initial intuition about the cult member; it costs you theoretical clarity and consistency.

  **Conclusion:**

  Your framework is coherent. The inconsistency lies in the application of your capacity-based exemption criterion (point 4) to the cult member case. The cheapest and most consistent fix is to extend that exemption to the profoundly indoctrinated cult member, accepting that the pull of the impersonal attitude (point 3) doesn't override the requirement for minimal capacity to participate in the moral community. It feels wrong because the act *is* wrong, but holding *him* morally responsible misfires if he lacks the capacity that makes responsibility meaningful within the practice. Stick to your guns on capacity as the key, even when it leads to conclusions that grate against the desire for moral condemnation. That’s the Strawsonian move. Good luck with the reading group – expect pushback on the cult case, but your core is sound.
