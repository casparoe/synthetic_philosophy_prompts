answer: |-
  Here’s a structured analysis of live, upstream questions about the "location" of meaning, tailored to your student’s constraints. I’ve ranked them by **upstream status** (how foundational they are to other debates), **tractability** for a logician in one year, and **freshness**, while flagging settled/overrated areas. The metaphor critique is integrated throughout.

  ---

  ### **The Metaphor & Frame Vocabulary: Is "Location" Useful?**
  - **"Location" is misleading but productive**: It implies spatial containment, but meaning is *relational* and *dynamic*. Better metaphors: **"ecology"** (interdependent layers) or **"resonance"** (activation across cognitive/social systems).  
  - **Frame vocabulary does real work**: It transcends older sender-receiver models (e.g., Shannon-Weaver) by emphasizing **meta-communication** (Bateson: "a frame *is* a message about how to interpret another message"). Unlike traditional semantics/pragmatics splits, it forces attention to **recursive contextualization**.  
  - **The regress isn’t a bug—it’s the engine**: Frames *are* messages "all the way down," but recursion halts pragmatically when:  
    - Agents achieve **sufficient coordination** (Lewisian convention).  
    - A **shared practice** absorbs the regress (Wittgensteinian "bedrock").  
    - **Cognitive/computational limits** kick in (e.g., predictive processing hierarchies).  
    *This regress is why the problem is fertile ground.*

  ---

  ### **Ranked Open Questions (Upstream → Downstream)**
  #### **1. What *Principled* Stops the Frame Regress?**  
     - **Why upstream?** If frames infinitely regress, stable meaning is impossible. This underlies debates about context-dependence (e.g., contextualism vs. minimalism), semantic normativity, and the metaphysics of content.  
     - **Tractability**: High. A logician can model this as:  
       - A **fixed-point theorem** in dynamic semantics (e.g., where a frame F satisfies *F(message) = content*).  
       - **Game-theoretic equilibria** (e.g., frames as common knowledge in signaling games).  
       - **Proof-theoretic boundaries** (e.g., "frame hierarchies" collapsing at unprovable assumptions).  
     - **Live debates**:  
       - **Anti-foundationalist view**: Regress halts at *pragmatic skills*, not representations (e.g., Brandom’s *inferentialism*).  
       - **Cognitive view**: Predictive coding models treat frames as *hyperpriors*—regress stops at evolutionarily encoded priors (Clark 2016).  
       - **Overrated/settled**: Formal semantics’ "indexicals" (Kaplan) or "context parameters" (Stalnaker) merely *describe* stops; they don’t *explain* them.  

  #### **2. Are Framing Norms Semantic or Pre-Semantic?**  
     - **Why upstream?** Meaning depends on norms (e.g., correctness of interpretation), but are these norms *part of* meaning (semantic) or conditions *enabling* it (meta-semantic)? This shapes theories of intentionality and conceptual engineering.  
     - **Tractability**: High. Use logic to analyze:  
       - **Normative paradoxes**: E.g., Kripke’s rule-following puzzle applied to framing rules ("What norm governs the application of *this* frame?").  
       - **Deontic logics** for framing obligations (e.g., "You *ought* to interpret 'X' as ironic in context C").  
     - **Live debates**:  
       - **Semantic anarchism**: Norms emerge *ad hoc* in communication (Mallon 2019)—no "meta-frame" governs them.  
       - **Constitutivism**: Framing norms are built into linguistic practices (e.g., Millikan’s *proper functions*).  
       - **Overrated**: Gricean intentions. Debates about "speaker meaning vs. sentence meaning" now concede these interpenetrate (see Borg 2020).  

  #### **3. How Does Meta-Semantic Awareness Emerge?**  
     - **Why upstream?** To grasp "frame F conveys message M," agents need awareness of framing *as framing*. This scaffolds reflexivity (e.g., irony, metaphor) and underlies language evolution/learning.  
     - **Tractability**: Medium. Logical approaches:  
       - **Modal logics of awareness** (e.g., distinguishing *object-level* content from *meta-level* framing).  
       - **Type theories** separating data from interpretative procedures (e.g., frames as functions of type `(Context → Content) → Content`).  
     - **Live debates**:  
       - **Cognitive emergence**: Does meta-awareness require Theory of Mind (Baron-Cohen 1995) or is it scaffolded by public symbols (Tomasello 2014)?  
       - **Formal emergence**: Can a system with no semantics (e.g., neural net) implement frame-sensitivity? (Lit.: Buckner 2024 on "semantic emergence").  
       - **Settled**: Inner/outer distinction isn’t Cartesian; it’s ecological (Chemero 2009). Rehashing this is low-value.  

  #### **4. What is the *Unit* of Framing?**  
     - **Why less upstream?** Assumes frames exist; debates here refine but don’t refound the field.  
     - **Tractability**: Medium. Formalize frames as:  
       - **Grammar operators** (e.g., Potts’ *conventional implicatures*).  
       - **Topological boundaries** in meaning spaces (Gärdenfors’ *conceptual spaces*).  
     - **Live debates**:  
       - **Micro-frames**: Are framing signals atomic (e.g., a *tone*) or holistic (e.g., a *genre*)?  
       - **Overrated**: "What is context?" catalogs (e.g., physical vs. epistemic)—now seen as descriptive, not explanatory.  

  ---

  ### **What Would Change the Rankings?**
  - **↑ Upstream shift**: New models of **dynamic normativity** (e.g., via AI alignment failures) could elevate Q2. Evidence of **non-linguistic framing** in animals (e.g., metacommunication in primates) could reframe Q3.  
  - **↓ Downstream shift**: If predictive coding fully explains frame hierarchies (Q1), it becomes cognitive science—less philosophical.  
  - **Tractability ↑**: Cross-pollination with **computer science** (e.g., "frame semantics" in NLP) offers formal tools. **Category theory** can model regress (e.g., frames as natural transformations).  

  ---

  ### **Recommendation for Your Student**  
  **Focus on Q1 (frame regress)**, using logic to model **stopping conditions**. This is maximally upstream, tractable, and underexplored. Concrete project:  
  - *Formalize* frame regress in a dialogical logic (e.g., Lorenzen-style games).  
  - *Defend* a stopping principle (e.g., "Regress halts when further framing doesn’t alter payoffs").  
  - *Apply* to a live problem (e.g., deepfakes—where does "authenticity" framing stop?).  

  This avoids empirical work while cutting to the core: **Meaning "lives" in the dynamic stability of framing practices, not in static containers.** The regress is a feature—it’s how agents bootstrap shared worlds.  

  *Sources to start:*  
  - Bateson, *Steps to an Ecology of Mind* (1972) — framing as meta-communication.  
  - Lewis, *Convention* (1969) — game-theoretic foundations.  
  - Brandom, *Making It Explicit* (1994) — normativity and regress.  
  - Clark, *Surfing Uncertainty* (2016) — predictive processing.
