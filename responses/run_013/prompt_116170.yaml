prompt: |-
  I'm a novelist and I've got a book where the gimmick is a town that's quietly started putting a price on everything, so I keep pitching my friend Rosa — she teaches moral philosophy and reads all my drafts — little markets and asking if they're kosher. Her verdicts are weirdly consistant: cash for a kidney, even between two happy consenting adults, no; doubling the price of bottled water in the week after a flood, fine; selling your vote for money even when it wouldn't change the result, no; selling your old trophies on eBay, fine; a paid surrogate pregnancy, no; scalping concert tickets at five times face value, fine.

  The chapter I'm stuck on needs a case she hasn't ruled on yet: a company where you pay a monthly fee and get a stranger who calls you every week, remembers your birthday, checks in when you're sick — does the stuff a close friend does. Everything's disclosed, the staff aren't desperate, they like the job, nobody's lied to.

  Which way does she jump? More usefully, what rule is she actually running? I can see at least two that fit every verdict above — one about markets corrupting the meaning of certain goods, one about who gets hurt or pushed into it — and I don't think they agree on this one, so say what each predicts, which you'd bet on and why, and what other case I should sneak into the next draft to find out which rule she's really got.
reasoning: |-
  Okay, the user is a novelist working on a book about a town that commercializes everything. They've been pitching different market scenarios to their friend Rosa, who teaches moral philosophy, and her verdicts seem inconsistent at first glance. The user needs a new case for their chapter that Rosa hasn't ruled on yet: a friendship subscription service where people pay for someone to act like a close friend (calls, remembers birthdays, checks in when sick). Everything is disclosed, staff aren't desperate, and they like the job. The user wants to know which way Rosa would rule and what underlying moral principle she's using.

  First, I need to recall Rosa's previous verdicts. She rejected cash for kidneys, selling votes, and paid surrogacy but approved price gouging during floods, selling trophies on eBay, and ticket scalping. There's a pattern here. The rejected cases involve deeply personal or intrinsic values—body parts, democratic participation, reproductive labor. The approved ones are more about ordinary market transactions where supply and demand can naturally fluctuate without harming core values.

  Now, the friendship service is tricky. On one hand, it's a service like any other, with consent and transparency. On the other, friendship is typically seen as a non-market good, based on genuine care, not payment. If Rosa's rule is about commodification corrupting the meaning of certain goods, she'd likely reject this because it turns friendship into a transaction. If her rule is about harm or exploitation, she might approve since no one is being exploited here—staff are willing, clients know what they're getting.

  The user is likely trying to deepen the philosophical conflict in their story. They need clarity on Rosa's principle to maintain consistency. Also, they might want to explore themes of what happens when markets infiltrate personal relationships, which is central to their book's premise. The deeper need is understanding how commodification affects social bonds, which ties into real-world debates about emotional labor and capitalism.

  To test Rosa's rule, the user should introduce a case that separates the two principles. For example, paying a friend to be the best man at a wedding. If the payment is for the role, not the friendship, but it's still a personal relationship task. If Rosa rejects it, she's likely against commodification of personal roles. If she accepts, exploitation might be her main concern.

  Another test case could be a community time-bank where people exchange services like babysitting or repairs without money. If Rosa approves, it suggests she's okay with non-monetary reciprocity but not market intrusion. If she rejects it, her principle might be broader against formalizing personal exchanges.

  I think Rosa would reject the friendship service based on corruption of meaning. Friendship's value lies in its authenticity and lack of transactional nature. Turning it into a paid service undermines that essence. The exploitation rule doesn't apply here since no one is coerced. So, the corruption argument fits her pattern better. For the next draft, the best man payment case would clearly distinguish between the two rules.
answer: |-
  Based on Rosa's consistent pattern, her underlying rule is almost certainly **the "Commodification Corrupts Meaning" (CCM) principle**, not primarily a "Harm/Exploitation" principle. Here's the breakdown for your friendship subscription service:

  1.  **Commodification Corrupts Meaning (CCM) Prediction:** **NO**
      *   **Reasoning:** Friendship is fundamentally defined by *disinterested* care, mutual affection, reciprocity, and authenticity. It's a relationship built on intrinsic value, not extrinsic payment. Paying someone to *simulate* the *actions* of a friend fundamentally corrupts the meaning of "friendship" itself. The service turns genuine care and personal connection into a purchased performance. It instrumentalizes a deeply personal good, reducing authentic human connection to a fungible service contract. This aligns perfectly with her "no" votes on kidneys (intrinsic bodily integrity/life), votes (intrinsic civic duty), and surrogacy (intrinsic meaning of pregnancy/kinship). The disclosed nature doesn't fix this; it just makes the corruption explicit.
      *   **Bet:** High confidence Rosa jumps **NO** based on her pattern.

  2.  **Harm/Exploitation Prediction:** **POTENTIALLY FINE (with caveats)**
      *   **Reasoning:** As described, the harm/exploitation hurdle is cleared:
          *   **Staff:** Not desperate, like the job, fully informed. No exploitation.
          *   **Clients:** Fully informed, paying for a service they value (companionship, routine). No obvious *direct* harm; they might feel less lonely.
          *   **Third Parties:** No clear negative externalities mentioned.
      *   **Potential Caveats:** A strict harm theorist *might* worry about subtle harms: Does this service discourage clients from seeking *real* friendships? Does it create an unhealthy dependence on paid simulation? Does it subtly devalue *actual* unpaid friendship labor in society? Does the *performance* aspect harm the staff's own capacity for authentic connection over time? However, without strong evidence of these harms, the harm/exploitation principle would likely lean towards **FINE**, similar to price gouging (supply/demand, no *new* harm caused) or ticket scalping (voluntary transaction, allocates scarce good).

  **Verdict & Bet:** Rosa unequivocally says **NO** to the friendship subscription service. Her pattern screams CCM. The harm principle is a red herring in her specific rulings – she approved cases (price gouging, scalping) with *clear potential for harm* (exploiting desperation, excluding less wealthy fans) but rejected cases (kidneys, votes) where *harm/exploitation was explicitly mitigated* (happy, consenting adults; vote wouldn't change the result). This inconsistency rules out harm/exploitation as her primary driver. CCM perfectly explains every verdict: she objects when markets invade spheres defined by intrinsic, non-fungible meanings (body, citizenship, family bonds, civic duty) but allows them where the good is primarily fungible or where the market mechanism *is* the primary meaning (water allocation post-disaster, memorabilia value, ticket access).

  **The Perfect Test Case for the Next Draft: Paying a Friend to be Your Best Man/Maid of Honor**

  *   **Scenario:** Alex offers their long-time, close friend Sam $2000 to be their Best Man/Maid of Honor. Alex emphasizes they *want* Sam specifically because of their genuine friendship and importance. The duties are standard (speech, organizing stag/hen, support). Sam is financially comfortable, not desperate, and genuinely happy for Alex. Sam accepts the money willingly. Is this kosher?
  *   **How it Tests the Rules:**
      *   **CCM Prediction: NO.** This directly commodifies a core ritual of *friendship*. The role of Best Man/MoH is intrinsically tied to the unique bond and honor bestowed by friendship. Paying for it, even between genuine friends, corrupts that meaning, turning an honorific duty into a paid gig. It instrumentalizes the friendship role itself.
      *   **Harm/Exploitation Prediction: POTENTIALLY FINE.** No desperation, full consent between friends, no obvious direct harm. Arguably, it's just compensating Sam for expenses/time. A harm theorist might worry it subtly alters the dynamic or sets a bad precedent, but without clear harm/exploitation, it should be acceptable.
  *   **Why it Works:** This case sits right on the fault line. It involves a *specific role within a genuine friendship*, making the commodification question acute. Unlike the stranger-subscription (easily dismissed as fake), this involves real friendship but adds payment to a sacred friendship *ritual*. If Rosa is CCM, she'll recoil ("You can't *pay* your best friend for that honor! It ruins the gesture!"). If she's harm-focused, she might shrug ("Sam's happy, Alex is happy, no one's hurt. Seems fine.").

  **Conclusion for Your Chapter:** Rosa hears about the "Friend Subscription" service, likely sighs deeply, and delivers a firm **"No. Absolutely not."** Her explanation would center on how this turns the profound, intrinsically valuable good of human friendship and care into a simulacrum, a purchased performance that hollows out the very meaning it attempts to replicate. It's the ultimate corruption of a non-market good by market logic. The test case with the paid Best Man will be your key to definitively confirming CCM is her core principle in the next draft.
