answer: |-
  ## Research Proposal: Reframing the Reference Class Problem through Exchangeability

  **Project Title:** Exchangeability First: The Normative Reference Class as Epistemic Groundwork

  **Central Research Question:** Does the epistemic work in direct inference derive primarily from the identification of a descriptive reference class (a set sharing features), or is it fundamentally grounded in a prior normative judgment of exchangeability (treating cases as informationally equivalent), with the reference class serving merely as its representation? Furthermore, does recasting the reference class problem as a potential misalignment or inadequately specified exchangeability judgment dissolve its apparent underdetermination?

  **The Core Dissatisfaction and Proposed Reframing:** The standard articulation of the reference class problem frames it as an objective or epistemic selection problem: given an event belonging to many descriptive classes (e.g., "this coin toss," "coin tosses by Alice," "fair coin tosses," "Tuesday coin tosses"), which class provides the *correct* probability? Existing treatments often seek privileged classes or rules for selection. This project contends this framework is backwards.

  My hypothesis is that **the primary epistemic input is a *judgment of exchangeability*** concerning a set of cases relative to the target proposition. We judge that certain cases (past coin tosses by Alice, past defendants with similar evidence, similar economic indicators) are relevantly similar – exchangeable – for predicting *this* coin toss, *this* defendant's guilt, *this* economic event. The "reference class" is then *constructed* or *invoked* as a descriptor *representing* this set of cases judged exchangeable. It is a bookkeeping label, not the ontological or epistemic foundation. The perceived problem of "too many reference classes" arises not from underdetermination *in the world*, but from:
  1.  **Unacknowledged Variation:** Agents may hold different exchangeability judgments for the same descriptive class (e.g., "Do *all* 'fair coin tosses' include tosses by magicians?").
  2.  **Descriptive Ambiguity:** A single descriptive label ("smokers," "similar lawsuits") may ambiguously represent different underlying exchangeability judgments.
  3.  **Inadequate Specification:** The initial exchangeability judgment itself might be vague or incomplete for the task.

  **Key Distinction:**
  *   **Descriptive Reference Class (DRC):** The set of actual or possible cases sharing certain observable or definable features (e.g., "coin tosses with this coin," "males aged 40-50," "patients with symptom S").
  *   **Normative Reference Class (NRC):** The set of cases the agent is *epistemically licensed (based on background knowledge, purpose, and context)* to treat as exchangeable for the specific inferential purpose at hand regarding the target event. The NRC is constituted by the exchangeability judgment.

  **Why Existing Treatments Leave the Question Open:** Current approaches treat the DRC as the *starting point* and the locus of the problem (selection/underdetermination). They often implicitly assume that identifying the "right" DRC *constitutes* establishing exchangeability or justifies the probability assignment. This leaves the *source* of the exchangeability judgment itself unexamined and obscures the possibility that the core epistemic act is the exchangeability judgment itself, which *precedes* and *motivates* the choice/description of a class. The "problem" persists because it addresses the symptom (multiple DRCs) rather than the cause (variability in the underlying exchangeability judgments those DRCs imperfectly represent).

  **What Constitutes a Result & Success Criteria:**

  1.  **Successful Defense of the Distinction:**
      *   **Conceptual Clarity:** A rigorous articulation of the DRC/NRC distinction and its grounding in exchangeability.
      *   **Dissolution of Puzzles:** Demonstrating how classic reference class puzzles (e.g., the taxi problem, single-case probabilities) are more perspicuously described as conflicts between potential NRCs (conflicting exchangeability judgments) or inadequacies in specifying the NRC, rather than underdetermined choices between DRCs.
      *   **Explanatory Power:** Showing that focusing on NRCs clarifies the role of agent-relative factors (purpose, background knowledge, context) in direct inference without collapsing into pure subjectivity. The *license* for exchangeability is normative.
      *   **Formal Coherence:** Ensuring the framework integrates consistently with standard Bayesian/probabilistic formalisms treating exchangeability as primitive.

  2.  **Collapse Back to Standard View:** The project fails if:
      *   The NRC cannot be defined independently of simply *being* the "correctly selected" DRC.
      *   The exchangeability judgment is shown to *necessarily depend* on prior identification of a DRC, rather than being prior or co-emergent.
      *   The framework offers no new insights or resolutions for puzzle cases compared to existing selection rules.

  3.  **Necessary Work:**
      *   **Conceptual:** Precise definition of NRC and its relation to DRC, exchangeability, and licensing conditions. Analysis of how context/purpose shapes the NRC.
      *   **Analytical:** Re-description of key puzzle cases through the NRC/DRC lens.
      *   **(Light) Formal:** Sketching how NRC-based reasoning integrates into Bayesian updating and direct inference schemata, emphasizing exchangeability as input. *Not* developing a new calculus or decision procedure.

  **Illustrative Core (Conceptual Focus):**

  *   **Coin Toss:** Assigning Pr(Heads) to *this* toss. The DRC might be "tosses with this coin." The *crucial* input is the judgment: *which* past tosses (only Alice's? all tosses observed? only under similar wind conditions?) are exchangeable with *this* one for predicting heads? The NRC is *defined by* this judgment. The descriptive label "tosses with this coin" is ambiguous until the exchangeability scope is fixed.
  *   **Guilt Probability:** Assigning Pr(Guilty) to *this* defendant based on evidence E. The DRC might be "defendants with E." The NRC depends on the exchangeability judgment: *Which* past cases with E are relevantly similar? (Similar circumstances? Same jurisdiction? All cases handled by this lab?) The ambiguity lies in the scope of exchangeability, not just the descriptive features.

  **Realistic Six-Month Plan:**

  *   **Month 1:** **Foundational Refinement.** Sharply define the DRC/NRC distinction, the core hypothesis (exchangeability first), and the licensing conditions for NRCs. Outline core argument against the "selection problem" framing.
  *   **Month 2:** **Puzzle Case Re-Description.** Apply the DRC/NRC framework to 3-4 canonical reference class puzzles (e.g., single case, conjunctions, base rates). Demonstrate how they manifest as NRC specification issues.
  *   **Month 3:** **Formal & Normative Grounding.** Sketch the integration with Bayesian probability (exchangeability as primitive). Develop the normative account of "licensed exchangeability" (linking to epistemic norms like total evidence, purpose-relativity).
  *   **Month 4:** **Addressing Collapse & Scope.** Critically analyze potential weaknesses: Is NRC just a renamed "correct" DRC? Can NRC be specified without descriptive features? Define clear boundaries for the project's claims.
  *   **Month 5:** **Drafting & Synthesis.** Write a comprehensive draft paper synthesizing the conceptual argument, case analyses, formal sketches, and normative framework. Focus on clarity and the core reframing.
  *   **Month 6:** **Refinement & Deliverable.** Revise draft based on internal scrutiny, ensure argument flows logically, sharpen distinctions, solidify conclusions. Finalize paper draft for submission.

  **Deliverable:** A complete, submission-ready draft of a journal article (approx. 8,000-10,000 words) presenting the DRC/NRC distinction, the "exchangeability first" thesis, the re-description of the reference class problem, and its philosophical implications.

  **Honest Assessment of Scope and Risks:**

  *   **Manageable Scope (Focus):** This project is feasible in six months because it focuses on a *conceptual reframing and distinction*. It does not aim to:
      *   Solve all reference class puzzles definitively.
      *   Develop a complete formal theory of NRC selection (beyond sketching its basis in exchangeability).
      *   Provide a universal decision procedure for exchangeability judgments.
      *   Conduct a comprehensive historical literature review (author will add targeted refs).
  *   **Key Risk - Speculation:** The core risk is that the proposed distinction (DRC vs. NRC) might be deemed merely terminological or not sufficiently distinct from sophisticated existing accounts that already emphasize exchangeability or agent-relative factors. Mitigation: Rigorously demonstrate the *explanatory inversion* – showing how focusing on exchangeability as primary dissolves the problem differently than selecting a DRC. Ground the "license" in concrete epistemic norms.
  *   **Key Risk - Overextension:** Getting bogged down in formalizing NRCs beyond what's necessary for the conceptual argument, or attempting to resolve every possible edge case of exchangeability licensing. Mitigation: Strict adherence to the plan's focus on conceptual clarity and illustrative analysis. Deeper formalization is flagged as *future work*.
  *   **Success Condition:** A successful project will establish the DRC/NRC distinction as a compelling and useful reframing of the reference class problem, demonstrating that the locus of difficulty lies in specifying and justifying exchangeability judgments, not in selecting a descriptive class. It will show that this perspective dissolves the illusion of objective underdetermination and clarifies the normative structure of direct inference.
