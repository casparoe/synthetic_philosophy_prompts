  First, Kolmogorov complexity comes to mind—it measures the shortest description length. But the user's second axis involves computational resources needed to generate the object from that description. That's time complexity or computational depth. Computational depth fits here, especially logical depth as defined by Charles Bennett. It quantifies the runtime of the shortest program, capturing the "history" aspect the user mentions for genomes.

  The user mentioned genomes and pi—both have short descriptions but require lengthy processes. A shuffled deck, despite its history, has a short description (just the seed and shuffle algorithm) and quick generation, so it's shallow. This aligns with logical depth: minimal runtime of the minimal program. 

  The user's concerns about machine-dependence and uncomputability are valid. Logical depth depends on the programming model, though resource-bounded versions might help. It's uncomputable like Kolmogorov complexity, but approximations exist using specific models or heuristics. 

  I should clarify that logical depth isn't about the process that created the object but the runtime of the generative program. This explains why a shuffled deck is shallow—its generation is fast once described. The user might confuse it with thermodynamic depth or causal complexity, but those are different. 

  In summary, logical depth is the established concept here. Addressing the user's deeper need: they seek a rigorous framework to classify complexity types, especially for biological systems where history matters. Highlighting the boundaries and limitations will help them apply it correctly in their course.
answer: |-
  The established name for your "second axis" is **logical depth**, primarily attributed to Charles Bennett.

  Here's the reasoning addressing your specific points:

  1.  **Name, Definition, and Context:**
      *   **Logical Depth:** Measures the minimum *computational time* required by the shortest program (or near-shortest programs) generating the object from its minimal description. It quantifies the "necessary irreducible history" or "amount of computation" separating the concise description from the object itself.
      *   **What it measures:** The inherent "computational effort" needed to produce the object from its minimal specification. High logical depth implies that even knowing *how* to make it is insufficient; you must *execute* a lengthy process.
      *   **Context:** You likely encountered it in algorithmic information theory (AIT) or theoretical computer science, often alongside Kolmogorov complexity (K). The key difference is that Kolmogorov complexity (K(x)) focuses solely on the *length* of the shortest description (program), while logical depth (D(x)) focuses on the *runtime* of that shortest program (or programs close to minimal length). K measures descriptive complexity; D measures generative complexity or "crypticity".

  2.  **Coining a Name (Not Needed - Established exists):** Logical depth is the established term. Define it as: D(x) = min_{p: U(p)=x} {Time(p)} where U is the reference universal Turing machine, and p is among the shortest programs (or within a constant additve term of K(x)) producing x. Hedges: This definition uses the *shortest* program's runtime. Sometimes "depth" considers *typical* programs of near-minimal length. Objects fall on sides:
      *   **Shallow (Low D):** Crystals (short program, instant runtime), Shuffled Deck (short program describing seed & shuffle algorithm, fast runtime), Noise (no short program, but generation is "instant" by reading the noise source - though D is technically undefined/infinite if we insist on a program generating *that specific* string, or very shallow if we consider the noise source itself as the 'program').
      *   **Deep (High D):** Genomes (short description via evolution/DNA code, but enormous runtime to simulate evolution/development), Pi Digits (short program, long runtime for deep digits), PRNG Output (short seed, runtime proportional to output length). Hedging applies to objects where the *shortest* program isn't the *fastest* way to generate it (there might be a slightly longer but much faster program), or objects where minimal programs have vastly different runtimes. Biological systems often involve complex interactions, making simulation runtime potentially much larger than logical depth estimates based on pure computation.

  3.  **Machine Dependence:**
      *   **Yes, it slides.** Logical depth is *more* machine-dependent than Kolmogorov complexity. While K(x) is invariant up to an additive constant *c* (depending on the UTM/language), the runtime Time(p) is highly dependent on the specific computational model (UTM instruction set, clock speed metaphorically). A program that runs slowly on UTM A might run fast on UTM B optimized for its instructions. The additive constant *c* in K's invariance theorem *does not* bound the difference in runtime between minimal programs on different UTMs. There is *no* formulation that is machine-independent in the strong sense K is. However, *resource-bounded* logical depth (e.g., minimum time for a program of length <= K(x) + c) can offer more robust comparisons within a *fixed* computational model.

  4.  **Uncomputability and Usability:**
      *   **Yes, Uncomputable:** Like K(x), logical depth D(x) is uncomputable. There's no algorithm to compute the minimal program or its runtime for arbitrary x. The situation is arguably "worse" than for K, as even approximating runtime for unknown minimal programs is harder than approximating length.
      *   **Usable Survivals:** Despite uncomputability, *restricted comparisons* and *approximations* are used:
          *   **Resource-Bounded Depth:** Define depth as min_{p: |p| <= K(x)+c} Time(p), often with explicit time/resource bounds (e.g., min time for programs of length <= L generating x within T steps). This is computable for fixed L, T, c but loses the pure "inherent history" notion.
          *   **Specific Models:** Fix a reasonable reference programming language/model (like a specific UTM or a high-level language interpreter) and calculate depth within that model. This is practical for comparing specific objects (like different genomes or outputs).
          *   **Heuristics & Proxies:** For complex systems like biology, runtime of plausible *generative models* (e.g., sophisticated simulations of development) serves as a practical, albeit imperfect, proxy for logical depth. Known failure modes include missing a much shorter/faster program or the model itself being inefficient.
          *   **Relative Depth:** Statements like "Object X is *deeper* than Object Y" can sometimes be proven within a fixed model, even if absolute depth is unknown.

  **Addressing Your Specific Cases & Concerns:**

  *   **Shuffled Deck vs. Genome:** The deck is shallow because its minimal description (e.g., seed + shuffle algorithm) has a very short runtime (a few steps to initialize the PRNG and apply the shuffle). Its *causal* history (human shuffling) is long, but its *logical* history (runtime of the minimal generative program) is short. The genome's minimal description (DNA sequence + known replication/transcription/translation rules) implies an enormously long runtime to simulate the developmental process from zygote to organism. Logical depth captures the computational effort, not the real-world time or energy.
  *   **Work Definition:** The "work" is the *runtime of the minimal program* on the reference UTM. It's purely computational – steps executed. It does *not* inherently represent physical work, energy, thermodynamic cost, or the length of the real-world causal history (though it often correlates with the latter). A faster UTM does less "work" in this sense for the same logical steps.
  *   **Collapse into First Axis?** No. K and D are distinct axes. K is about description size, D is about generation time from that description. A shuffled deck has moderate K (log2(52!) bits) but very low D. Pi has low K but high D for deep digits. Noise has very high K and undefined or very low D (if we consider reading the source as the 'program'). A genome has moderate K (it compresses) but very high D.
  *   **Neighboring Measures & Confusions:**
      *   **Kolmogorov Complexity (K):** Confused if you only think about description length. K is low for both crystals and genomes, but D distinguishes them.
      *   **Algorithmic Probability / Solomonoff Probability:** Measures the probability a random program generates x. Favors shallow objects (shorter/faster programs have higher probability). Related but distinct.
      *   **Sophistication / Meaningful Information:** Attempts to separate the "meaningful" program length from random bits within the minimal description. Related to separating "structure" (low K) from "contingency" (high D), but distinct.
      *   **Thermodynamic Depth / Causal Complexity:** Measures the minimal entropy production or length of the *physical* causal history. This is closer to the intuition about the shuffled deck's history. Logical depth is computational; thermodynamic depth is physical. They often align but are distinct concepts (e.g., simulating a deep object on a reversible computer might have low thermodynamic cost).
  *   **Boundary - What Counts as Work?** Only the runtime steps of the minimal (or near-minimal Kolmogorov) program on the reference UTM. Physical time/energy, the process that *created* the object (like evolution or shuffling), or the runtime of non-minimal programs are *not* directly measured. The shuffled deck is shallow because the minimal program describing *its current state* (seed + algorithm) runs quickly, regardless of how it was physically created.
