  Tie-breaker view (3) only uses numbers when claims are equal. So aggregation (a) is low, 0.1, because it rarely applies. Faithfulness (b) is high, 0.8, because it doesn't let numbers override stronger claims. But the problem is that ties are rare, so this doesn't handle most real cases where claims differ in strength.

  Ex ante view (4) shifts to evaluating risks before knowing outcomes. Aggregation (a) is higher, 0.6, because it aggregates risks. But faithfulness (b) is lower, 0.5, because actual burdens aren’t considered, which might violate contractualism's focus on actual rejections. The tension is between hypothetical consent and real-world outcomes.

  Weighted-claims (5) allows aggregation with severity weighting. Aggregation (a) is higher, 0.7, approaching utilitarianism but with weights. Faithfulness (b) is moderate, 0.6, because it still considers individual claims but might dilute rejection rights. The challenge is quantifying severity, which could be complex and subjective.

  Now, ranking them. Weighted-claims seems most balanced (1st), then ex ante (2nd), threshold (3rd), tie-breaker (4th), strict anti-aggregation (5th). The user's case study: one person's permanent hearing loss vs. N people's moderate pain for a week. 

  For each strategy, I need to find when it switches to saving the many. Strict anti-aggregation never switches. Threshold might switch if pain is below threshold, but permanent hearing loss is above, so probably never. Tie-breaker only if claims are equal—pain vs. hearing loss aren't, so never. Ex ante would calculate the expected burden—permanent loss is a high risk, so N might need to be large. Weighted-claims would weigh the hearing loss heavily, so N would need to be very large to outweigh.

