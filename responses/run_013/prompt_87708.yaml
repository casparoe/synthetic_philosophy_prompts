answer: |-
  **MEMORANDUM**  
  **TO:** Practice-Standards Council  
  **FROM:** Council Chair  
  **SUBJECT:** Recommendation on Panel Size and Decision Threshold  
  **DATE:** October 26, 2023  

  ---

  ### RECOMMENDATION  
  **Retain the current nine-member panel structure but require a supermajority (≥7 votes) for adoption of any practice standard.** Pair this with mandatory procedural safeguards: anonymized preliminary voting, explicit documentation of dissent, and diversification of panel recruitment. Reject the proposal to enlarge panels to fifteen members under simple majority rule.

  ---

  ### REASONING  

  #### I. The Condorcet Jury Theorem: Promise vs. Reality  
  Your proposal relies on the Condorcet jury theorem, which states:  
  *If each voter has an independent probability >50% of being correct, then majority decisions become more reliable as the group size increases.*  

  While mathematically sound, **this theorem assumes two critical conditions**:  
  1. **Independence**: Voters’ judgments are not influenced by each other.  
  2. **Individual Competence**: Each voter is more likely correct than not (>50% accuracy).  

  **Our panels violate both assumptions:**  
  - **Independence is absent**: Panelists train similarly, consume identical literature, and defer to seniority (evidenced by "falling in behind" senior members). Votes are correlated, not independent.  
  - **Competence is unverified**: We lack evidence that panelists consistently exceed 50% accuracy. Audit data showing reversals on appeal suggests material error rates.  

  ---

  #### II. Why Larger Panels Fail Under Current Conditions  
  ##### A. The Problem of Correlated Votes ("Noise" with Dependence)  
  When votes are correlated (e.g., deference to hierarchy or groupthink), larger panels **amplify systemic errors** instead of canceling random ones.  
  - *Example*: If 60% of panelists initially lean wrong due to shared biases, a 15-member panel (requiring 8 votes) is *more* likely to cement that error than a 9-member panel (requiring 5 votes). The Condorcet theorem’s "error reduction" only works when mistakes are random and independent. Ours are not.  

  ##### B. The Risk of Systematic Bias  
  If panels are systematically biased (e.g., toward traditional techniques or senior opinions), larger panels **magnify this bias**:  
  - Last year’s 5-4 standard (now contested and audited) reveals fragility in narrow-margin outcomes. A 15-member panel using simple majority (8 votes) could still produce similarly contested standards (8-7) while increasing resistance to course-correction.  
  - Appeals data indicates bias toward overconfidence in initial findings. Larger panels risk entrenching this.  

  ---

  #### III. Why Supermajority Safeguards Outperform Size Increases  
  A **supermajority threshold (≥7/9 votes)** directly targets our core weakness: marginal decisions with high reversal risk.  
  - **Statistical rigor**: Requiring ≥77% agreement (vs. 55% for 5/9) ensures broader consensus, making it less likely that groupthink or seniority deference alone drives outcomes.  
  - **Practical accountability**: A 7-2 vote signals robust alignment, whereas a 5-4 (or 8-7 in 15 panels) reflects division and elevates audit/reversal risk.  
  - **Efficiency**: Smaller panels reduce coordination costs and streamline recruitment without diluting expertise.  

  ---

  #### IV. Necessary Procedural Safeguards  
  To make supermajority effective, we add:  
  1. **Anonymized Preliminary Voting**: Members vote blindly on initial drafts to curb seniority bias.  
  2. **Documented Dissent**: Minority opinions must be appended to standards, aiding audits and appeals.  
  3. **Recruitment Diversification**: Panels must include:  
     - ≥2 members trained outside dominant programs,  
     - ≥3 members with <10 years’ experience,  
     - Rotating senior chairs to prevent fixed hierarchies.  

  ---

  #### V. The Strongest Case for Enlargement (and Why It Fails Here)  
  Your proposal’s strength lies in *idealized conditions*: **if** votes were independent and panelists consistently >50% accurate, a 15-member panel would reduce errors. However, audit data, appeals reversals, and observed deference patterns prove these conditions do not hold. We optimize for reality, not conjecture.  

  ---

  #### VI. What Evidence Would Change This Recommendation  
  We would support larger panels **only if** both conditions below are met:  
  1. **Proven Independence**: Randomized control trials (e.g., splitting panels into blinded subgroups) show no correlation in votes on identical cases.  
  2. **Measured Competence**: Audit data confirms ≥75% of panelists’ individual assessments survive appeal unchallenged for 3 consecutive years.  

  Absent this, enlargement risks institutionalizing error.  

  ---

  ### CONCLUSION  
  Larger panels under simple majority rule offer theoretical benefits but practical peril under our current dynamics. By retaining nine-member panels with a supermajority safeguard and enforcing anti-bias procedures, we target actual failure points—marginal votes and groupthink—while preserving agility. This approach aligns with our duty to issue credible, durable standards.  

  **VOTE:** Retain 9-member panels; require ≥7 votes for adoption; implement safeguards 1–3 immediately.  

  ---  
  **END MEMO**
