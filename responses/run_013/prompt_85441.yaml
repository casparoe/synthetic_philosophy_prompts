prompt: |-
  ok so every year I do a dumb little bit at my department's end-of-year party and this year I want to do moral foundations theory — the Haidt thing where there are supposedly five gut-level moral intuitions (care, fairness, loyalty, authority, sanctity) and everyone has all five, it's just that liberals and conservatives weight them differently. My angle is that I've been trying to get a sixth foundation recognized: queueing, i.e. the deep conviction that the guy who cuts in line isn't just rude but bad, bad as a person, cosmically. But I want the jokes to actually be built out of the theory, not just say the words "moral foundations" and hope the audience fills in the rest. So they should turn on the real content: that everyone has all five and the fight is only ever about weighting, that the loyalty/authority/sanctity cluster is the one that predicts being right-wing, that the whole framework is supposed to be descriptive so it can't tell you which side is actually right, that some people split fairness into equality vs. proportionality (which already makes the list look negotiable), and that researchers keep floating extra foundations — isn't there one about not being pushed around? — so the list is a moving target. If a joke only works for someone who's never opened a psych textbook, it's a miss.

  Give it to me as exactly five numbered items, one or two sentences each, no intro and no sign-off, and make them five seperate jokes rather than five drafts of the same one. And no "so my therapist said" bits, that's definately been done.
