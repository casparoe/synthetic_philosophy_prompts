answer: |-
  Here are five distinct jokes addressing your requested elements:

  1.  Liberals and conservatives both have all five moral foundations, just different weightings—which explains why at the airport, my conservative colleague raged "How dare he skip security!" while I, a liberal, just thought "How dare he skip security?"

  2.  Researchers say Fairness might actually be *two* foundations—Equality versus Proportionality. But honestly, if someone gets served before me at the coffee cart after I queued properly, I instantly know *both* forms of fairness—and Care, Loyalty, Authority, and Sanctity—have all catastrophically failed.

  3.  They say Sanctity is the foundation conservatives weight highest... which tracks, because the only time I see liberals truly invoke it is when someone violates the sacred ritual of the office coffee pot queue. Profane!

  4.  Moral Foundations Theory is descriptive, not prescriptive—it can't tell you who's *morally right*. Unless we're talking about queue-cutters. Then it definitively proves their cosmic badness justifies adding Foundation Six.

  5.  Researchers keep proposing new foundations—Liberty/Oppression, Honesty? But queueing is the *real* missing one. My deep conviction that line-cutters are evil feels fundamentally different than respecting Authority... unless the Authority figure *is* the person enforcing the queue, which proves my point.
