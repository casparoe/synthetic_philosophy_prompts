  2. **Evidential Decision Theory (EDT)**  
     - **Core idea**: Choose actions that provide the best evidence for desirable outcomes (e.g., "If I do X, what does that indicate?").  
     - **Prediction for new case**: Defect.  
       - Reasoning: With different inputs, her action doesn't provide evidence about the other agent's move (their output depends on unknown data). Defection is safest.  
     - **Inconsistencies**:  
       - Fails Parfit's hitchhiker: Once in town, paying provides evidence of being "irrational" (since it costs money with no causal benefit), but she pays.  
       - Fails the guilt verdict: EDT could endorse guilt as "rational" evidence (e.g., "guilt signals I'm cooperative"), but she rejects this.

  3. **Superrationality (Hofstadter)**  
     - **Core idea**: Cooperate if the other agent is identical and will reach the same conclusion via symmetry.  
     - **Prediction for new case**: Defect.  
       - Reasoning: The symmetry is broken—different payoffs/facts mean the outputs may diverge. No guarantee of mutual cooperation.  
     - **Inconsistencies**:  
       - Fails the randomizer verdict (superrationality might still cooperate; she defects).  
       - Fails the stranger PD (superrationality requires identity; she defects).

  4. **Functional Decision Theory (FDT)**  
     - **Core idea**: Choose actions by considering what your decision function outputs in all relevant situations (e.g., "What does my algorithm dictate here?").  
     - **Prediction for new case**: Defect.  
       - Reasoning:  
         - The other agent runs the same function but with different inputs → outputs may differ.  
         - She can't control/predict the other's output (due to unknown inputs), so her function must default to the dominant strategy: defect.  
         - FDT seeks coordinated outcomes only when inputs/outputs are symmetric (like same-input PD). Here, asymmetry breaks coordination.  
     - **Consistency with her verdicts**:  
       - Same-algorithm PD (same inputs): Cooperates (FDT coordinates mutual cooperation).  
       - Stranger PD: Defects (no logical link to the other's algorithm).  
       - Newcomb: One-boxes (FDT correlates with the predictor).  
       - Parfit: Pays (FDT commits to paying to "signal" cooperation to the predictor-like driver).  
       - Randomizer: Defects (no decision function to correlate with).  
       - Guilt verdict: Rejects guilt as irrational (FDT relies on logical correlations, not emotions).

  ### Bet on FDT and Why
  - **Bet**: She defects in the new case.  
  - **Why FDT fits best**:  
    - It uniquely explains all her verdicts without contradiction.  
    - Parfit's hitchhiker is the clearest differentiator: FDT pays (timeless commitment to cooperation), while EDT and CDT would not. Her paying aligns with FDT.  
    - Her rejection of guilt-based cooperation fits FDT's focus on algorithm outputs over psychological states.  
  - **Why defect?**  
    FDT agents cooperate only when their decision function's outputs are logically linked (e.g., identical inputs). Here, input differences break the link, forcing defection as the dominant strategy.

  ### Cleanest Further Case to Split Theories
  - **Case**: **Transparent Newcomb's Problem**  
    - **Setup**: The opaque box is transparent—you see $1M inside before choosing. The predictor is known to be 99% accurate.  
    - **Predictions**:  
      - **FDT**: One-box. Seeing $1M doesn't change the logical correlation—the predictor put it there because it anticipated one-boxing.  
      - **CDT/EDT**: Two-box. CDT sees taking both as causal dominance. EDT sees the $1M as evidence that one-boxing "worked," but now taking both yields $1,001,000.  
      - **Superrationality**: Irrelevant (no symmetric agent).  
    - **Splits**: FDT vs. CDT/EDT. Her original Newcomb verdict (one-box) suggests she'd one-box here, confirming FDT. If she two-boxes, it would support CDT/EDT.

