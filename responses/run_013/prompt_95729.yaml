prompt: |-
  I sit on the comittee that decides who gets to vote in our city's referendums, and there's one coming up that I can't get straight in my head. Our track record so far: for the council tax rise we let everyone on the local register vote — non-citizens, 16 and 17 year olds, the lot — but not the people who own flats here and live abroad. For the incinerator on the eastern edge we wouldn't let the neighbours over the border vote, even though the smoke was going to land on them. Now there's a referendum on a levy on wages earned in the city, which would fall on the people who work here but live in the suburbs; they're in the city five days a week, but they've never had to obey our bylaws and they don't pay us anything at the moment. Should we let them vote? Tell me what rule we've actually been running, what the other rules that fit our record just as well would predict here, which of our past calls is the closest analog, which call you'd make and why, and what next case would pin down which rule we're really on. British English please, and finish with a last line starting 'Verdict:' in the form yes/no — the rule it rests on.
reasoning: |-
  Okay, the user is part of a committee deciding voter eligibility for city referendums and wants clarity on their inconsistent past decisions. Let me unpack their examples. The council tax rise included all local registrants—non-citizens, teens—but excluded non-resident property owners. The incinerator vote excluded neighboring residents affected by pollution. Now a wage levy targets suburban commuters who work in-city but don’t live/pay taxes there.  

  Hmm, their core struggle is identifying an implicit rule behind these seemingly arbitrary choices. The council tax decision prioritizes "local presence" (register = residency), ignoring citizenship/age but also excluding absentee owners—suggesting "affected residency" matters. Yet the incinerator paradox: physically affected neighbors were excluded because they’re outside jurisdiction. Contradiction? Not quite. The incinerator call reveals a "formal obligation" bias—only those bound by the city’s laws get a say, even when external parties bear consequences.  

  For the wage levy, commuters are affected (they’d pay) but lack formal ties (no bylaws/taxes). Past analogies point opposite ways: council tax included affected residents, incinerator excluded affected non-residents. The levy’s unique twist: commuters are daily economic participants without civic obligations. Closest analog is actually the incinerator—non-residents excluded despite impact—because the committee consistently privileges *legal subjugation* over sheer impact.  

  But there’s tension. If they include commuters now, it’d align with council tax’s "affected" logic but break the incinerator’s jurisdictional boundary. Excluding them upholds the incinerator precedent but clashes with council tax’s inclusivity. The wage levy’s "no current payment" detail echoes absentee owners (excluded), strengthening "obligation" as the hidden rule.  

  Next test case? A referendum affecting tourists or homeless populations—groups with physical presence but no legal/fiscal ties—would force the committee to choose between "presence" and "obligation" once and for all.  

  Verdict hinges on recognizing their pattern: not "who is affected," but "who is formally accountable to the city." Commuters aren’t, so exclusion follows.
answer: |-
  Right, let's dissect this voting eligibility puzzle. Your committee's past decisions reveal a clear, albeit unstated, principle. Here's the breakdown:

  1.  **The Rule You've Actually Been Running:**
      *   **Formal Obligation & Subjection to Local Authority.** Your committee consistently grants voting rights to individuals **formally subject to the city's governing authority and its direct impositions**, regardless of traditional markers like citizenship or age (as seen in the council tax vote). Conversely, you exclude those **not formally subject** to that authority, even if they are significantly *affected* by the outcome (non-resident owners, neighbours over the border).

  2.  **Other Rules That Fit Your Record (But Aren't What You're Using):**
      *   **"Affected Interest" Alone:** This would argue *for* including non-resident owners (tax rise), neighbours (incinerator), *and* commuters (levy). But you excluded owners and neighbours, so this isn't your rule.
      *   **"Residency on Electoral Register" Alone:** This would argue *against* including 16/17-year-olds and non-citizens if they weren't *automatically* on the local register. Since you included them *because* they were on the register, it fits the council tax vote. However, it doesn't explain the *exclusion* of non-resident owners – they likely *aren't* on the local register precisely because they don't live there, reinforcing that your rule is deeper than just the register *list*; it’s about the *status* the register *signifies* (formal subjection).
      *   **"Payment of Local Taxes/Dues":** This fits excluding non-resident owners (they pay council tax but aren't subject to the *vote* on *raising* it) and could argue *for* including commuters (they *would* pay the levy). But it doesn't fit excluding the neighbours affected by the incinerator – they might pay taxes elsewhere, but the impact is direct. Your rule seems more about *subjection to authority* than payment *per se*.

  3.  **Closest Analog to the Wage Levy Referendum:**
      *   **The Non-Resident Flat Owners (Council Tax Vote)** is the closest analog. Both cases involve individuals with a significant *financial* stake linked to the city (property ownership / employment income) but who are **not resident** and therefore **not formally subject to the city's day-to-day governing authority or bylaws**. They are affected, but outside the formal jurisdiction for electoral participation on city matters. The neighbours over the border (incinerator) are a weaker analog because their link was environmental impact, not a direct financial imposition *by* the city *on* them.

  4.  **The Call I'd Make & Why:**
      *   **Exclude the commuters living in the suburbs.** Applying your established principle of **Formal Obligation & Subjection to Local Authority**:
          *   Commuters work in the city but **live elsewhere**.
          *   They are **not subject to the city's bylaws** (as you state they "never had to obey our bylaws").
          *   They **do not currently pay local taxes/levies directly to the city** (Council Tax is paid at their residence; the levy itself doesn't exist yet).
          *   While the levy *would* affect them financially, this mirrors the non-resident owners who *were* affected by the council tax rise decision but were excluded. Their presence is economic, not civic. Granting them a vote would break your precedent of requiring formal subjection to the city's governing authority as a prerequisite.

  5.  **The Next Case to Pin Down the Rule:**
      *   **A referendum on a major infrastructure project *solely funded* by a new city income tax, directly impacting traffic, noise, or air quality *only* in a specific suburb just over the city border.** This pits the principles directly:
          *   **Formal Obligation:** The suburb's residents aren't subject to city bylaws or taxes (except potentially the new income tax if they work in the city). Do they get a vote?
          *   **"Affected Interest":** They are heavily impacted by the negative externalities.
          *   **"Payment":** They might pay the new tax funding the project *if* they work in the city.
      *   **Your decision here reveals the hierarchy:**
          *   If you **exclude** them, your core rule is **strict Formal Obligation/Subjection** (they lack residency/subjection to bylaws).
          *   If you **include** them, your rule has a significant **"Direct Payment + Significant Impact"** component overriding pure formal obligation/subjection, or you've shifted your principle.

  **Verdict:** No – Formal Obligation & Subjection to Local Authority.
