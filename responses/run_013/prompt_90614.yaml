  Hmm, the professor's frustration is palpable - they mention students can "recite" but not "think," and want to avoid "name-dropping." This suggests past exams may have rewarded textual familiarity over critical application. The proposed coin acceptor case is clever: it preserves the two-bitser's functional structure while removing human design stability, creating a genuine puzzle about meaning emergence.

  The borrowed vs. built aboutness distinction seems central. I notice it maps loosely to: borrowed = Searle-derived (mind-dependent), built = Dennett-ish (selection-dependent). But the professor wants students to test if this actually resolves anything or just repackages old disputes. That's sophisticated - they're demanding meta-philosophical awareness.

  Key constraints: 90-minute limit means the question can't be too broad. Unsearchable case prevents regurgitation. Must require stating a personal criterion - that's the hinge. And the model answer must commit to a position, not just summarize.

  For the marking scheme, those 5 must-hit points need to cover: criterion definition, three case applications, implication of indeterminacy, and argumentative movement. The "consistently apply" mark is crucial - that's where weak students will falter by treating cases in isolation.

  Wait, the frog case is tricky. Is its detector "built" (evolutionary selection) or "borrowed" (our interpretation)? Students might conflate biological design with engineering. The model answer should model disentangling that.

  Biggest risk is students getting lost in the new terminology. The question phrasing must scaffold analysis: "state your criterion" first, then apply stepwise. The model answer's criterion (stable causal sensitivity + unowned optimization history) is clean because it excludes both human minds (Searle) and pure interpretation (Dennett).

  The closing challenge ("what evidence would move you?") is brutal but excellent. It forces intellectual honesty. I'll make the model answer admit the drift case pressures Searle more - since meaning emerges sans mind - but note Dennettians could absorb it as "stance-relative."

  Marking scheme traps to flag: students might a) define criterion vaguely, b) apply it inconsistently across cases, c) miss that indeterminacy critiques both theories, d) treat "borrowed/built" as solution not test case, e) skip the "what moves you" metacognition.

  A-grade differentiator: seeing that if the criterion fails on drift, it reveals intentionality might not be binary (original/derived) but graded. That's the gold insight.
answer: |-
  Here’s your exam package, designed to force original analysis of the intentionality debate using the novel "drift-tuned acceptor" case:

  ---

  ### (1) Exam Question  
  **Instruction:** Answer the following in 90 minutes. Do not recite standard positions uncritically. Engage the novel case thoughtfully.  

  **Question:**  
  A coin acceptor uses firmware that retunes nightly via a "bandit algorithm" maximizing revenue. Over time, it drifts to accept arcade tokens, bottle caps, and washers. Its designer cannot say which coin any state "detects," and no one intended it to accept these objects. Structurally, it mirrors the classic "two-bitser" vending machine’s functional state.  

  Evaluate whether this device has **original** or **derived intentionality** by:  
  (a) Stating a clear criterion distinguishing original/derived intentionality.  
  (b) Applying your criterion to **three cases**:  
     (i) The classic two-bitser (fixed programming),  
     (ii) A frog’s visual fly-detector,  
     (iii) The drift-tuned acceptor.  
  (c) If your criterion *cannot decide* the drift case, explain why this is problematic for **both** Searle’s and Dennett’s frameworks (e.g., regarding minds, stances, or selection histories).  
  (d) Conclude: What evidence or argument could change your view?  

  ---

  ### (2) Model Answer (697 words)  
  **(a) Criterion:** Original intentionality arises when a state’s *aboutness* is fixed by *stable causal sensitivity* to specific features *plus* an *unowned selection history* (e.g., evolution or blind optimization). Derived intentionality requires interpretation by an external mind assigning meaning.  

  **(b) Application to Cases:**  
  *(i) Classic Two-Bitser:* **Derived.** Its "detection" state depends wholly on human intent. Engineers designed it to recognize quarters; the state’s meaning is borrowed from their goals. If repurposed to detect washers, its aboutness changes via reinterpretation. The causal link is fixed by human assignment, not selection pressure.  

  *(ii) Frog’s Fly-Detector:* **Original.** The frog’s neural state triggers tongue-flicks to small, dark moving objects. Its sensitivity evolved via natural selection optimizing for fly-catching. No external mind assigns meaning; selection "intends" it to detect flies (even if it misfires on BBs). The state’s counterfactual profile (e.g., *not* firing for stationary objects) is "tuned" by fitness consequences, not human interpretation.  

  *(iii) Drift-Tuned Acceptor:* **Original.** Like the frog, its states acquired sensitivity via unowned optimization. The bandit algorithm reshaped its thresholds to maximize revenue, creating causal links to bottle caps/washers through environmental feedback. Crucially:  
  - Its "detection" isn’t borrowed: no mind assigned meaning to these states.  
  - Its history involves *built aboutness*: selection pressure (revenue maximization) fixed what its states "detect," aligning with my criterion. Though artificial, the *process* mirrors evolution: blind variation/selection replaces design.  

  **Borrowed vs. Built Aboutness Distinction:** This holds if "borrowed" requires *active* interpretation (e.g., engineers defining the two-bitser’s state) and "built" requires *history-dependent* sensitivity (frog/acceptor). But it collapses if "borrowed" is stretched to include *any* selective history (e.g., claiming evolution "interprets"). My criterion avoids this by requiring *mind-independent* selection.  

  **(c) Indeterminacy Problem:** If the criterion *cannot* decide the drift case, it undermines both frameworks:  
  - **Searle:** He insists original intentionality needs intrinsic mental states. But the acceptor’s meaning emerges sans minds—contradicting his derived-intentionality-only claim for artifacts. If selection alone suffices, his "joint in nature" is artificial.  
  - **Dennett:** His stance-relativity risks making meaning *too* unconstrained. Calling the acceptor’s states "bottle-cap detectors" only makes sense if we ignore its history. If intent-free selection fixes aboutness, the stance matters less than he claims.  
  This suggests the dispute is partly verbal: "original" may denote *selection-based* (frog/acceptor) vs. *human-assigned* (two-bitser) intentionality, not a metaphysical divide.  

  **(d) Evidence to Change My View:** If shown that the acceptor’s "optimization history" requires *implicit* human goals (e.g., revenue is proxy for designer intent), I’d revert to calling it derived. Conversely, if the frog’s detector relies on *our* evolutionary interpretations (not "nature’s intent"), I’d group it with the two-bitser. The decisive test is whether meaning persists without any observer.  

  **Conclusion:** The acceptor has original intentionality. Its unowned selection history distinguishes it from the two-bitser and aligns it with the frog. This reframes the debate: the line isn’t organic/digital, but whether aboutness is *assigned by minds* or *forged by feedback*.  

  ---

  ### (3) Marking Scheme (Total: 20 marks)  
  **Must-hit points (3 marks each):**  
  1. **Clear criterion for original/derived distinction.**  
     *Common error:* Vague or circular definitions (e.g., "original is intrinsic").  
  2. **Correctly classifies the classic two-bitser with justification.**  
     *Common error:* Misapplying criterion (e.g., calling it original due to "fixed function").  
  3. **Correctly classifies the frog’s detector with justification.**  
     *Common error:* Overemphasizing misfires or conflating evolution with design.  
  4. **Sustained analysis of the drift-tuned acceptor case.**  
     *Common error:* Assuming "algorithm = designer intent" without engaging selection history.  
  5. **Insightful discussion of indeterminacy’s implications for Searle/Dennett.**  
     *Common error:* Only critiquing one theorist or missing the verbal-dispute angle.  

  **Consistency & Application (5 marks):**  
  - Applies the *same* criterion rigorously to all three cases.  
  - Integrates the borrowed/built distinction meaningfully.  
  - **A-grade differentiator:** Explicitly explains *why* the acceptor’s "unowned" history matters (e.g., breaks Searle’s mind-dependency OR challenges Dennett’s stance-relativity).  

  **A vs. B Separation:**  
  - **A (17–20):** Lucid criterion; consistent, nuanced case analyses; frames indeterminacy as revealing core theoretical tensions.  
  - **B (13–16):** Functional criterion; mostly consistent applications; identifies problems for Searle/Dennett but lacks depth on implications.  

  ---

  ### Why This Works  
  - **Novel Case Focus:** Forces engagement by making the drift-tuned acceptor the linchpin.  
  - **Criterion Demand:** Prevents slogan-recycling (e.g., "as-if intentionality").  
  - **Borrowed/Built Tension:** Tests if students see this as a *new tool* or a *disguised relapse*.  
  - **Meta-Philosophical Nudge:** The "what would move you?" query combats dogmatism.  

  The model answer lands decisively by treating blind selection as meaning-conferring—providing a concrete target for critique. Adjust the criterion in the answer if you prefer a different emphasis; this version prioritizes historical embeddedness over current function.
