prompt: |-
  Ok so I'm putting together the final exam for my upper-level seminar on intentionality, and I need one essay question plus a model answer and a marking scheme. I've been arguing about this with my office mate for two weeks now, so you're getting the whole backstory. The course has spent a month on the two-bitser, the frog's fly detector, and the Chinese room, and at this point every student can recite that Searle thinks the vending machine's coin detector has only derived intentionality while Dennett thinks the original/derived line is something we draw by taking a stance rather than a real joint in nature. What they can't do is think about it. So the question has to be built around a case they haven't seen and can't look up. Here's the case I want them to chew on: a company makes a coin acceptor that gets installed in machines worldwide; the firmware re-tunes its acceptance thresholds every night with a bandit algorithm that just maximizes revenue, and over a year it drifts into happily accepting arcade tokens, bottle caps, and one particular brand of washer. The engineer who wrote it can no longer say which coin any given internal state is "detecting", and nobody ever intended it to take bottle caps. Structurally the state is doing exactly what the old two-bitser's state did — it's a functional state in a control loop — except now the tuning is blind and the design history is a reward signal rather than anybody's intention. I also want them to evaluate a distinction my office mate cooked up over beers: *borrowed aboutness* (a state means whatever some mind's intentions or interpretations make it mean) versus *built aboutness* (a state's meaning is fixed by its own counterfactual sensitivity plus an unowned selection-or-optimization history). Is that distinction stable, or does it just collapse back into the Dennett/Searle fight? And if it is stable, does it put the frog's detector and the drift-tuned acceptor on the same side of the original/derived line, or not?

  The question should be doable in 90 minutes and unanswerable by reciting the standard positions. It needs to force them to state a criterion for the original/derived distinction — something that actually decides cases rather than a slogan — and then apply that criterion to all three cases: the classic two-bitser, the frog, and the drift-tuned acceptor. I also want them to say what follows if the criterion *can't* decide the drift case: is that a problem for Searle's taxonomy, since blind selection seems to give you aboutness with no mind around to derive it from, or for Dennett's, since interest-relativity threatens to make what a state means hostage to whoever happens to be asking, or does it show that part of the dispute was verbal all along? And one closing line on what evidence or argument would actually move them. So please give me: (1) the question as it would appear on the exam sheet; (2) a model answer of roughly 700 words that does all of the above without name-dropping any citations, because my students can't look anything up and I don't want them guessing at titles or years; and (3) a marking scheme totalling 20 marks, built from five must-hit points worth 3 each plus 5 for stating and consistently applying the criterion, with a one-line note for each point on how students typically blow it, and a sentence at the end on what separates an A from a B. Don't have the model answer just survey the debate — I want it to actually take the drift case seriously and land somewhere.
