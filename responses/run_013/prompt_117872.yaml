  ### Diagnostic Instrument: Epistemology of Testimony

  This decision tree begins with a specific case: a hearer with *zero evidence* about a speaker's reliability (no track record, no information about competence or honesty, no background on community trustworthiness) is told that p and believes it. The tree guides you from this starting point to a position on whether the hearer is justified and what explains that justification. Each branch node poses a question about a concrete case, and your answers lead to a leaf position. The vocabulary is fixed as follows:

  - **Zero-evidence hearer**: As described above.
  - **Thin-evidence hearer**: Has grounds to assess the speaker, but those grounds come solely from earlier testimony (e.g., she was told the speaker is reliable).
  - **Transmissive justification**: The hearer's justification is the speaker's own justification (like receiving a package with its contents intact).
  - **Generative justification**: The hearer's belief is justified regardless of whether the speaker had justification to transmit (like generating new justification from the act of testifying).
  - **Occasion-bound**: The hearer must have grounds available at the moment of accepting the testimony (e.g., actively considering evidence).
  - **Background**: A general standing basis suffices (e.g., a default trust in testimony).

  ---

  #### Logical Space: Branch Nodes and Permitted Answers
  The tree has seven branch nodes (questions). Answer each based on concrete cases without inferring which position it leads to.

  1. **Distinctness**: Is testimony a distinct epistemic kind (e.g., unlike physical evidence), requiring special norms?  
     - **Yes** → Go to Q2  
     - **No** → Leaf F  

  2. **Zero-evidence justification**: In the zero-evidence case, is the hearer justified in believing p?  
     - **Yes** → Go to Q3  
     - **No** → Go to Q4  

  3. **Speaker’s justification dependence**: In the zero-evidence case, if the speaker had *no justification* for p, would the hearer *still* be justified?  
     - **Yes** → Go to Q5  
     - **No** → Go to Q6  

  4. **Thin-evidence justification**: In the thin-evidence case, is the hearer justified?  
     - **Yes** → Leaf R  
     - **No** → Go to Q7  

  5. **Basis of justification**: Is the hearer’s justification grounded in testimony being a reliable or virtuous practice?  
     - **Yes** → Leaf E  
     - **No** → Go to Q6  

  6. **Responsibility-based**: Is the hearer’s justification rooted in the speaker assuming responsibility for truth?  
     - **Yes** → Leaf D  
     - **No** → Leaf H  

  7. **Occasion-bound requirement**: Must the hearer have evidence available at the moment of acceptance?  
     - **Yes** → Go to Q8  
     - **No** → Leaf B  

  8. **Tracking requirement**: A hearer systematically discounts speakers based on irrelevant features (e.g., accent) but avoids false beliefs by luck. Is this discounting an *epistemic* failure?  
     - **Yes** → Leaf A-Y  
     - **No** → Leaf A-N  

  ---

  #### Leaf Positions (9–12 Leaves)
  Each leaf answers whether the zero-evidence hearer is justified and why. The "embarrassing commitment" highlights a counterintuitive consequence.

  - **Leaf F (Testimony as evidence)**: Testimony is not a distinct epistemic category; it is assessed like any other evidence (e.g., a note found at a crime scene).  
    - *Embarrassing commitment*: A jury must treat an eyewitness’s testimony identically to a fingerprint found at the scene.  
  - **Leaf R (Reductionism with testimonial evidence)**: The hearer must reconstruct the speaker’s reliability from evidence (which can be testimonial), with the requirement imposed anew on every occasion.  
    - *Embarrassing commitment*: A student who trusts a professor based solely on hearsay about their reliability is justified, even if that hearsay is unverified.  
  - **Leaf B (Background reductionism)**: The hearer must reconstruct reliability, but a general background of experience discharges this requirement (non-testimonial evidence only).  
    - *Embarrassing commitment*: A hermit raised by wolves is justified in trusting the first human he meets because his background (lacking deceptive experiences) discharges the requirement.  
  - **Leaf A-Y (Occasion-bound reductionism + tracking)**: The hearer must reconstruct reliability from non-testimonial evidence available at every occasion, and her assessment must track relevant features (e.g., competence, not accent).  
    - *Embarrassing commitment*: A detective with a "gut feeling" (irrelevant feature) about a witness’s honesty is not justified, even if the feeling is accurate.  
  - **Leaf A-N (Occasion-bound reductionism, no tracking)**: The hearer must reconstruct reliability from non-testimonial evidence at every occasion, but her assessment need not track relevant features.  
    - *Embarrassing commitment*: A racist who discounts speakers based on race (irrelevant feature) is epistemically justified if she has evidence of reliability, even if that evidence is biased.  
  - **Leaf E (Reliable practice)**: The hearer’s belief is justified because accepting testimony is a reliable or virtuous practice, regardless of what she can articulate.  
    - *Embarrassing commitment*: A brain in a vat is justified in testimony-based beliefs if the simulated practice is reliable, even if all speakers are digital constructs.  
  - **Leaf D (Interpersonal responsibility)**: The hearer is justified because the speaker assumes responsibility for truth, making the relation interpersonal, not evidential.  
    - *Embarrassing commitment*: A scam victim is justified in believing a liar who says, "I promise this is true," because the liar assumed responsibility.  
  - **Leaf H (Default transmissivism)**: The hearer is justified only if the speaker is justified, and she has a default entitlement to assume this in the zero-evidence case.  
    - *Embarrassing commitment*: A hearer is justified in believing a speaker who is randomly guessing, as long as she defaults to assuming the speaker is justified.  
  - **Leaf C-Y (Generative entitlement + tracking)**: The hearer has a standing entitlement to accept testimony, and this requires tracking relevant features.  
    - *Embarrassing commitment*: A toddler who trusts parents but not strangers (based on familiarity, not reliability) commits an epistemic error.  
  - **Leaf C-N (Generative entitlement, no tracking)**: The hearer has a standing entitlement to accept testimony, and it does not require tracking relevant features.  
    - *Embarrassing commitment*: A cult member who trusts only the leader (based on charisma, not reliability) is epistemically justified.  

  ---

  #### Unoccupied Combinations and Unseparated Leaves
  - **Unoccupied combinations** (marked ⚠ in the tree):  
    - *Q3 → Yes → Q6 → No*: Leads to Leaf H, but "No" at Q6 is occupied. The combination *Q3 → Yes → Q5 → No → Q6 → No* is incoherent—it requires generative justification (Q3: Yes) but denies both practice-based (Q5: No) and responsibility-based (Q6: No) accounts, leaving no coherent generative option.  
    - *Q4 → No → Q7 → No*: Leads to Leaf B. The combination *Q4 → No → Q7 → Yes* is undefended—no prominent view requires occasion-bound evidence but allows thin evidence to satisfy it.  
  - **Unseparated leaves**:  
    - Leaf A-Y and Leaf C-Y both require tracking relevant features but differ on whether evidence is needed. They would be separated by: *"Must the hearer have evidence for the speaker’s reliability?"* (Yes → A-Y; No → C-Y).  
    - Leaf A-N and Leaf C-N both reject tracking but differ on evidence. Same separating question applies.

  ---

  #### How to Use  
  Start at Q1. Answer based on your intuition about the cases. Proceed until you reach a leaf. The leaf describes your position on testimony. The "embarrassing commitment" helps identify vulnerabilities for discussion.  
  *No proper names, citations, or readings are used—this instrument is self-contained.*
