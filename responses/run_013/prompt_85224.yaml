answer: |-
  Here's a breakdown of "Vote on Values, Bet on Beliefs" as a political philosopher and mechanism designer would dissect it. I've ordered the theses from least to most contentious, precisely defined their elements, classified them, and then addressed your specific questions.

  **The Menu of Theses:**

  1.  **Separation of Concerns (Trivial)**
      *   **Vote On:** Collective preferences about desired outcomes (values/welfare). *Who:* The polity (citizens, representatives acting as proxies).
      *   **Bet On:** Probabilistic forecasts about the causal effects of specific policies on achieving the valued outcome. *Who:* Market participants (anyone willing to stake money).
      *   **Market Price as Belief:** The price reflects the market's *aggregate probability estimate* that a specific policy will cause the valued outcome.
      *   **Classification:** Trivial. This simply defines the *roles* assigned to votes and bets within the futarchy *framework*. It doesn't claim superiority, just separation. It holds by definition within the futarchy proposal.
      *   **Burden Shifting?** No. This just describes the futarchy process; it doesn't justify why one *should* use it or why it resolves confusion.

  2.  **Division of Labor (Substantive but Defensible)**
      *   **Vote On:** High-level, stable, normative goals ("We value affordable housing" or "We value maximizing GDP-per-capita"). *Who:* The polity.
      *   **Bet On:** Contingent, empirical predictions about *how* actions lead to outcomes ("Policy X will raise median income by Y% *if* we value GDP-per-capita"). *Who:* Market participants.
      *   **Market Price as Belief:** The price reflects the aggregate *epistemic judgment* (belief) under the specified value constraint. It's a forecast conditioned on the voted-upon value metric.
      *   **Classification:** Substantive but Defensible. It argues democratic processes are *better suited* for resolving fundamental normative conflicts ("what is good?") due to legitimacy concerns, while markets are *better suited* for aggregating dispersed information about causal relationships ("what works?") due to incentive compatibility. Holds *if* you accept: (a) Markets aggregate factual information more efficiently/accurately than deliberation under uncertainty; (b) Democratic legitimacy is primarily tied to defining ends, not means.
      *   **Burden Shifting?** Weakly, *if* the debate is purely about empirical causation *under an agreed-upon value*. The slogan suggests that *if* values are settled, the burden of proof on *how* to achieve them shifts to empirical demonstration via markets.

  3.  **Epistemic Superiority of Markets (Contentious)**
      *   **Vote On:** Only the *metric* of welfare (e.g., "Hedonic Happiness Index"). *Who:* The polity.
      *   **Bet On:** *All* judgments about policy effectiveness, *including* complex trade-offs, second-order effects, and interpretations of the metric. *Who:* Market participants.
      *   **Market Price as Belief:** The price reflects the market's *optimal policy decision* given the metric. It aggregates not just raw causal beliefs, but *evaluative judgments* about how complex outcomes map onto the voted metric. Belief here encompasses sophisticated forecasting *and* implicit valuation within the metric's constraints.
      *   **Classification:** Contentious (False under common interpretations). This claims markets are superior *decision-makers* once a metric exists, outperforming any deliberative or representative body *even on complex normative trade-offs inherent in applying the metric*. Holds *only if*: (a) The welfare metric is perfectly specified, objective, and unambiguous; (b) Markets perfectly internalize all externalities and long-term effects; (c) Market participants possess all relevant knowledge *and* accurately price complex interactions; (d) Wealth effects don't distort market outcomes. These conditions are empirically and theoretically contested.
      *   **Burden Shifting?** Strongly. It implies that *any* debate about the *best policy* under the metric is resolvable and should be resolved by markets, placing the burden on anyone arguing *against* the market outcome to prove the market failed.

  4.  **Markets Replace Deliberative Judgment (Strongly Contentious)**
      *   **Vote On:** A single, quantifiable welfare metric. *Who:* The polity.
      *   **Bet On:** *All* empirical and normative judgments *except* the definition of the ultimate metric. This includes defining intermediate goals, interpreting the metric's meaning in context, and weighing competing considerations *within* the metric. *Who:* Market participants.
      *   **Market Price as Belief:** The price is treated as *synonymous* with the *correct* policy choice. Belief encompasses virtually all reasoning *except* the foundational value axiom.
      *   **Classification:** Strongly Contentious (Mostly False). This collapses the distinction between "belief" (factual prediction) and complex normative *judgment* about applying values to messy reality. It assumes markets can seamlessly transform a single metric into optimal policy without needing deliberative interpretation. Holds *only if* you accept a radical positivism where all value-laden judgment is reducible to probabilistic forecasts under a single metric – a view challenged by moral philosophy and theories of practical reasoning.
      *   **Burden Shifting?** Radically. It dismisses *all* non-market policy deliberation as mere confused "belief" that should be settled by betting. The burden shifts entirely to proving why a market *shouldn't* decide.

  5.  **Metaphysical Distinction (Trivial or Contentious depending on interpretation)**
      *   **Vote On:** "Values" as inherently subjective, emotional, or irreducible preferences. *Who:* The polity.
      *   **Bet On:** "Beliefs" as objective, empirical propositions about the world. *Who:* Market participants.
      *   **Market Price as Belief:** The price reflects the objective probability of factual events.
      *   **Classification:** Trivial if seen as a definition; Contentious/False if seen as descriptive. While a common philosophical distinction, it's porous in practice. Policy debates often involve "thick" concepts mixing fact and value. Treating "beliefs" as purely objective and separable is an idealization markets don't perfectly achieve. Holds only under a strict fact/value dichotomy many philosophers reject.
      *   **Burden Shifting?** Indirectly. It frames policy opposition as based on "values" (subjective, less debatable?) or confused "beliefs" (objective, suitable for market correction). Can be used rhetorically to dismiss value-based critiques of market outcomes.

  **Shifting the Burden in the Housing Debate:**
  The slogan likely shifted the burden by implicitly invoking **Thesis 3 (Epistemic Superiority)** or sliding towards **Thesis 4 (Markets Replace Judgment)**.

  *   **Licensing the Move:** The arguer claimed the debate was "confused," implying disagreement stemmed from factual errors ("beliefs") about the policy's effects *under an assumed shared value* (e.g., "affordable housing" or "economic growth"). Thesis 3 asserts markets are the *proper* mechanism to settle such empirical disputes, placing the burden on dissenters to prove why the market *shouldn't* decide or why their empirical claim is superior *within the market framework*. Thesis 4 would go further, dismissing much of the debate itself as illegitimate deliberation that markets supersede.
  *   **Weak to Strong Slippage:** The slide often happens from **Thesis 1/2** (Separation/Division of Labor - defensible) to **Thesis 3** (Epistemic Superiority - contentious). People start by agreeing values and beliefs *can* be separated conceptually and assigned to different mechanisms (weak), then slide into claiming markets are *uniquely superior* at handling the "belief" part, *especially* complex causal and evaluative judgments under the metric (strong). The slide smuggles in strong assumptions about market efficiency, metric objectivity, and the reducibility of policy judgment to forecasting.

  **The Single Crucial Distinction: Preferences vs. Judgments**

  The most important distinction for arguing about this slogan is: **Aggregating Preferences vs. Aggregating Judgments.**

  *   **Why it Matters:** Voting is fundamentally a mechanism for aggregating *preferences* (what people want). Prediction markets are fundamentally mechanisms for aggregating *judgments* (what people *think* is true or will happen).
  *   **The Core Problem:** Futarchy, via "bet on beliefs," attempts to use markets (judgment aggregators) to make *policy choices* based on a voted metric (preference aggregator). The critical leap is assuming that once you fix the preference (the metric), the optimal policy choice is *purely a matter of factual judgment* that markets excel at. This leap ignores:
      *   **Interpretation:** How is the abstract metric (e.g., "welfare") interpreted and measured in specific contexts? This involves judgment, not pure preference.
      *   **Trade-offs:** Most policies involve complex trade-offs *within* the metric (short-term vs. long-term, distributional effects). Evaluating these requires judgment about weights and priorities.
      *   **Unforeseen Consequences:** Judgment is needed to assess risks and uncertainties beyond simple forecasts.
      *   **"Thick" Concepts:** Many valued outcomes (e.g., "affordable housing," "community character") inherently blend facts and values, making pure separation impossible. Defining and measuring them *is* a judgment call.
  *   **Impact on the Slogan:** Blurring this distinction allows the slogan to mask the profound shift from aggregating *what we want* (votes) to outsourcing the complex judgment of *how best to achieve it under uncertainty and complexity* (bets). Recognizing "beliefs" in this context often involve deep, value-laden *judgments*, not just neutral predictions, exposes the contentious core of the strongest futarchy claims and why shifting the burden based on the slogan is often illegitimate. It forces the question: "Is this disagreement *really* just about a factual prediction, or is it about interpreting the goal, weighing consequences, or even challenging the metric itself?"
