  For each interpretation, I'll need to specify what's being voted on, what's being bet on, who does each action, how market prices represent beliefs, and whether the claim is trivial, defensible, or false. I'll also note what conditions would make each interpretation hold.

  Then I'll analyze which interpretations would actually justify shifting the burden of proof in a policy debate like the housing example. The stronger interpretations (3 and 4) would justify this move, while weaker ones wouldn't. I'll also point out how people often slide from weaker to stronger interpretations without realizing it.

  Finally, I'll identify the most crucial distinction for this debate - the one between aggregating preferences versus aggregating judgments. This distinction matters because conflating them is what allows the slogan to do more rhetorical work than it substantively can. Preferences are about what we want, while judgments are about what we think is true - and prediction markets only address the latter.

