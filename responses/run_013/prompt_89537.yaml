  - Free Kelly Fraction Calculators at all kiosks.  
  - Real-time bankroll tracking via our app (with growth-rate projections).  
  - Dr. Finch’s *Meditations on Geometric Rationality* (available in the lobby).  

  Remember: **Growth isn’t accidental. It’s engineered.**  

