   What can go wrong:

     - Ties: We've tried to avoid ties by adjusting the numbers, but if there is a tie we break by alphabet.

     - Students might not understand the voting rule: explain clearly at the beginning of each round.

     - In the red-team round, a committee might propose a rule that is dictatorial. Then the gremlin cannot break it? But then we point out that it's dictatorial and that's an escape hatch but at what cost? And then we move on.

