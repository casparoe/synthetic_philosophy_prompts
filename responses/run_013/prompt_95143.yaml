answer: |-
  ### Voting Game Plan: Experiencing Strategic Voting  
  **Objective:** Students discover the Gibbard-Satterthwaite theorem through hands-on manipulation of voting systems. No materials needed beyond printed preference cards and a board.  

  ---

  ### **Setup**  
  - **Room:** Chairs arranged in a circle for open discussion.  
  - **Stakes:** Non-monetary (e.g., bragging rights, candy).  
  - **Tie-breaking rule:** Alphabetical order (e.g., Candidate A wins over B).  

  ---

  ### **Round 1: Plurality Voting**  
  **Goal:** Show a voter can swing the election by voting for their *second* choice.  
  **Options:** Candidates **A, B, C, D**  
  **Preference Profile (16 voters):**  
  - **Voter X (1 card):** A > C > B > D  
  - **Group 1 (3 cards):** A > B > C > D  
  - **Group 2 (5 cards):** B > A > C > D  
  - **Group 3 (5 cards):** C > B > A > D  
  - **Group 4 (2 cards):** D > A > B > C  

  **Instructions to Students (on cards):**  
  *"Rank these candidates from best (1) to worst (4). For plurality voting, you will vote for your top choice. Keep your card secret!"*  

  **Process (10 min):**  
  1. **Vote:** Students submit their top choice secretly.  
  2. **Tally:**  
     - Sincere outcome: A=4, B=5, C=5, D=2 → **Tie (B and C)** → Tie-break: **B wins** (alphabetical order).  
  3. **Reveal:** Flip cards face up. Write full preference profile on board.  
  4. **Analyze (5 min):**  
     - *"B won. Who preferred A or C over B? Look at Voter X (A>B). What if they voted for C instead?"*  
     - Manipulated outcome: A=3, B=5, C=6, D=2 → **C wins**.  
     - *Key insight:* Voter X gets C (preferred over B) by lying.  

  ---

  ### **Round 2: Runoff Voting**  
  **Goal:** Show manipulation in two stages—changing who advances to the runoff.  
  **Options:** Same **A, B, C, D**.  
  **Preference Profile (16 voters):**  
  - **Voter Y (1 card):** A > C > B > D  
  - **Group 1 (7 cards):** B > A > C > D  
  - **Group 2 (4 cards):** C > B > A > D  
  - **Group 3 (4 cards):** A > C > B > D  

  **Instructions:**  
  *"Rank candidates. In Round 1, vote for your top choice. Top two advance. In Round 2, vote for your preferred finalist."*  

  **Process (10 min):**  
  1. **Round 1 vote:**  
     - Sincere: A=5 (Voter Y + Group 3), B=7, C=4 → **Top two: B and A**.  
  2. **Runoff vote:**  
     - Preferences: Group 1 (B>A), Group 2 (B>A), Group 3 (A>B), Voter Y (A>B) → **B wins 11-5**.  
  3. **Reveal:** Show preferences.  
  4. **Analyze (5 min):**  
     - *"Voter Y (A>B) got B. What if they voted for C in Round 1?"*  
     - Manipulated Round 1: A=4, B=7, C=5 → **Top two: B and C**.  
     - Runoff: Group 1 (B>C), Group 2 (C>B), Group 3 (C>B), Voter Y (C>B) → **C wins 9-7**.  
     - *Key insight:* Voter Y gets C (preferred over B) by lying in Round 1.  

  ---

  ### **Round 3: Borda Count**  
  **Goal:** Show manipulation by reordering *lower* choices.  
  **Options:** Same **A, B, C, D**.  
  **Preference Profile (16 voters):**  
  - **Group 1 (7 cards):** A > B > C > D  
  - **Group 2 (6 cards):** B > C > A > D  
  - **Group 3 (3 cards):** C > A > B > D  

  **Instructions:**  
  *"Rank all candidates. Points: 3 pts (best), 2 pts (2nd), 1 pt (3rd), 0 pts (worst)."*  

  **Process (10 min):**  
  1. **Tally sincere votes:**  
     - A: (7×3) + (6×1) + (3×2) = 21 + 6 + 6 = **33**  
     - B: (7×2) + (6×3) + (3×1) = 14 + 18 + 3 = **35** → **B wins**.  
  2. **Reveal preferences.**  
  3. **Analyze (5 min):**  
     - *"A voter in Group 1 (A>B) got B. What if they insincerely rank A>C>D>B?"*  
     - Manipulated ballot (for 1 voter): A=3, C=2, D=1, B=0.  
     - New tally:  
       - A: 33 (unchanged)  
       - B: 35 - 2 (lost 2 pts) = **33** → **Tie (A and B)** → Tie-break: **A wins**.  
     - *Key insight:* Voter gets A (preferred over B) by burying B.  

  ---

  ### **Red-Team Round (20 min)**  
  **Goal:** Students invent rules; gremlin tries to break them.  
  **Process:**  
  1. **Form committees** of 4 students. Each designs a voting rule (e.g., "Rank candidates; the most last-place votes loses").  
  2. **Rules written on board.**  
  3. **Gremlin script (you or a student):**  
     - *"Describe your rule clearly. How are ballots cast? How is the winner decided?"*  
     - *"I’ll propose a scenario where voters have these preferences [use a simple 3-voter profile from earlier rounds]. Now, one voter lies to get a better outcome."*  
     - **Example attack:** If committee proposes approval voting:  
       - Voters 1–2: Prefer A>B, approve both. Voter 3: Prefers B>A, approves only B.  
       - Sincere: A=2, B=3 → B wins.  
       - Manipulation: Voter 1 (A>B) approves only A → A=1, B=2 → Tie → A wins alphabetically.  
  4. **Debrief if rule survives:** Throw a harder profile (e.g., 4 candidates, 5 voters).  

  ---

  ### **Debrief (15 min)**  
  **Map the game to the theorem:**  
  1. **Plurality, Runoff, Borda:** Each round showed a voter gaining by lying.  
  2. **Red-team:** No matter the rule, manipulation exists—it just *migrates*.  

  **Escape Hatches & Costs:**  
  1. **Dictatorship (assign one voter as decider):**  
     - *Works?* Yes, no manipulation.  
     - *Cost:* Unfair; negates democracy.  
  2. **Single-Dimension Preferences (e.g., candidates on a left-right spectrum):**  
     - *Works?* Yes, majority rule becomes safe.  
     - *Cost:* Unrealistic—real preferences are multidimensional.  
  3. **Cardinal Ballots (rate candidates 0–10):**  
     - *Works?* Gibbard-Satterthwaite doesn’t apply (it’s for rankings).  
     - *Cost:* New vulnerabilities (e.g., exaggerating ratings), and harder to implement.  

  **What the Game Can’t Show:**  
  - We only proved manipulation for *specific* rules. The theorem’s power is its **universality**—it holds for *every* non-dictatorial rule with ≥3 options. The *proof* (not this game) guarantees no rule escapes.  
  - **Coalitional manipulation:** We focused on one liar; groups can collude (theorem extends to this).  

  **Predictable Issues & Fixes:**  
  - **Ties:** Used alphabet tie-breaker (announce upfront).  
  - **"Why not hand-raising?"** = Plurality. We saw it’s manipulable.  
  - **Confusion:** Keep language simple (e.g., "rank these 4 options").  

