     We only showed that specific rules (plurality, runoff, Borda) are manipulable. The theorem is much stronger: it says that every non-dictatorial voting rule with at least three outcomes is manipulable. The proof of the theorem (which is beyond the scope of this game) uses advanced mathematics to show that such a situation must exist for any rule. The game serves to illustrate the concept, but the universality is provided by the proof.

     Also, note that the game uses a fixed set of voters and candidates. The theorem holds for any number of voters and candidates (as long as there are at least three candidates and two voters).

