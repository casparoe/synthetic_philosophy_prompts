  - **0:00–0:10:** Intro + Round 1 (Plurality).  
  - **0:10–0:25:** Reveal Round 1 + Round 2 (Runoff).  
  - **0:25–0:35:** Reveal Round 2 + Round 3 (Borda).  
  - **0:35–0:45:** Reveal Round 3 + Split into red teams.  
  - **0:45–1:05:** Red-team round (rule creation + gremlin attacks).  
  - **1:05–1:20:** Debrief (theorem, escapes, costs).  
  - **1:20–1:30:** Q&A + conclusion.  

  ### **Why This Works**  
  - **Tripping over the theorem:** Students *feel* manipulation before labeling it.  
  - **Red-team:** Forces engagement with rule design’s futility.  
  - **Low stakes:** Focus on insight, not winning.  

  Print the profiles, hide the math, and let the game reveal the truth: **No voting system is strategy-proof.** Your colleagues’ horror is about to turn into awe.
