  I notice they emphasized fairness—the satire should make deterrence professionals wince in recognition, not cringe from inaccuracy. That means every joke must be anatomically precise. The "threats worth buying are threats you don’t want to carry out" paradox? That’s the credibility problem in a nutshell. Randomness as resolve-substitute? That’s the essence of Schelling’s "rationality of irrationality." 

