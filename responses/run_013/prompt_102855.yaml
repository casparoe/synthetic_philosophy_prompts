prompt: |-
  Draft the joint statement of an adversarial collaboration between a defender of compatriot partiality and a cosmopolitan impartialist, both of whom accept an institutionalist premise: whatever special claims compatriots have must arise from institutions that actually distribute benefits and burdens, not from shared ancestry or culture alone. Structure it as (1) a numbered list of agreed claims about the moral status of borders, the distinction between states and nations, and the relation between special obligations and global distributive justice; (2) a disagreements table giving each side's position in wording its own side would accept; (3) the cruxes, including whether national institutions are morally special in kind or only in scale compared with firms, clubs, and municipalities, and whether cosmopolitanism requires open borders or only global redistribution; and (4) for each crux, a case or argument both sides agree bears on it, such as a wealthy liberal state facing a refugee crisis or a global tax scheme, with each side's prediction about that case recorded in advance. Do not include citations, bibliographies, or reading lists, and say explicitly if any part of the dispute turns out to be merely verbal.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between two positions: a defender of compatriot partiality (DCP) and a cosmopolitan impartialist (CI). Both accept the institutionalist premise: special claims among compatriots arise only from institutions that distribute benefits and burdens, not from shared ancestry or culture alone.

  The structure is:
  1. A numbered list of agreed claims.
  2. A disagreements table.
  3. The cruxes (key points of disagreement) with each having an agreed-upon case and each side's prediction.
  4. Explicitly note if any part is merely verbal.

  Let's begin.

  1. **Agreed Claims**:
     We both agree on the following:

     1. The moral significance of borders is derived from the institutions that operate within them and the distributive schemes they create, not from pre-political identities or cultural heritage.
     2. States and nations are distinct: a state is a set of institutions that govern a territory and its population, while a nation is a group of people with shared identity (which may or may not coincide with state boundaries). Our focus is on states as institutional actors.
     3. Special obligations to compatriots, if they exist, are generated by the joint participation in state institutions that create reciprocal benefits and burdens. These obligations do not extend to non-compatriots who do not participate in these institutions.
     4. Global distributive justice requires that institutions, both domestic and international, be arranged to avoid creating or perpetuating unjust inequalities. Both domestic and global institutions must be assessed for their fairness.
     5. The institutionalist premise implies that if a set of institutions (whether at the state level or beyond) creates a scheme of cooperation that generates benefits and burdens, then claims of justice arise among the participants in that scheme.
     6. We agree that the current global order, with its system of sovereign states, creates significant inequalities and that there are obligations to address these. However, we disagree on the extent and nature of these obligations and whether they override or constrain special obligations to compatriots.

  2. **Disagreements Table**:

     | Issue | Defender of Compatriot Partiality (DCP) | Cosmopolitan Impartialist (CI) |
     |-------|----------------------------------------|--------------------------------|
     | **The scope of special obligations** | The obligations arising from state institutions are of such magnitude and moral importance that they create a strong presumption in favor of prioritizing the interests of compatriots over non-compatriots, especially in matters of distributive justice. | While state institutions generate obligations among participants, these obligations are not inherently more important than obligations to non-participants. The moral claims of all individuals, regardless of institutional ties, must be given equal consideration, and state-based obligations must be balanced against global duties. |
     | **The moral status of national institutions** | State institutions are morally special in kind because they are the primary sites of democratic self-determination, the creation and enforcement of law, and the provision of public goods that are foundational to human flourishing. | State institutions are not morally special in kind; they are one form of institutional cooperation among many (like firms, clubs, and municipalities). What makes them significant is their scale and the fact that they currently wield enormous power, but they are not inherently unique in moral kind. |
     | **Open borders vs. global redistribution** | Cosmopolitanism does not require open borders; it requires that the global institutional order, including the system of states, be arranged to ensure that all persons have access to sufficient resources and opportunities. This can be achieved without open borders through global redistribution and fair terms of international cooperation. | Open borders are a necessary component of a just cosmopolitan order because they ensure that individuals are not arbitrarily disadvantaged by the circumstances of their birth. However, even without open borders, a robust system of global redistribution is required to address existing inequalities. The CI position here may be interpreted in two ways: one that requires open borders and one that does not. We will focus on the version that does not necessarily require open borders but emphasizes global redistribution. (Note: We'll clarify that the CI in this collaboration holds that open borders are not strictly required but that global redistribution is.) |

     Note: We have adjusted the CI position on open borders to reflect that the collaboration is between a DCP and a CI who does not necessarily advocate for open borders. The CI here holds that global redistribution is the primary requirement, but open borders may be one way to address injustice, but not the only one.

  3. **Cruxes**:

     Crux 1: **Are state institutions morally special in kind?**
     - DCP: Yes, because they are the primary institutions for the realization of collective self-determination and the provision of basic public goods (like security, legal order, and social welfare) that are essential for individual autonomy and well-being. They are uniquely placed to create and sustain the conditions for justice.
     - CI: No, they are special only in scale and impact. Other institutions (like multinational corporations, international organizations, or even global market structures) also create significant benefits and burdens and thus generate obligations of justice. The state is not a unique moral category.

     **Agreed Case for Crux 1**: Consider a wealthy liberal state that faces a refugee crisis. The state has the capacity to admit a large number of refugees without undermining its own institutions. However, doing so would require diverting resources from domestic social programs (e.g., education, healthcare) to support the refugees.

     - DCP prediction: The state has a stronger obligation to its own citizens and should prioritize maintaining the domestic social programs. The state may have a duty to help refugees, but only after ensuring that its own citizens are not unduly burdened. Thus, the state might limit the number of refugees admitted to avoid straining domestic institutions.
     - CI prediction: The obligations to refugees (who are in dire need) are just as pressing as obligations to citizens. The state must balance the needs of both, and if the refugees' needs are more urgent, they should be prioritized. The state should admit the refugees and adjust its domestic spending accordingly, perhaps by raising taxes or reallocating funds, to meet both sets of obligations.

     Crux 2: **Does cosmopolitanism require open borders?**
     - DCP: No, cosmopolitanism can be satisfied by global redistribution without open borders. Borders are necessary for the functioning of state institutions, which are vital for self-determination and the provision of public goods. Open borders would undermine these institutions by overwhelming them and making them unworkable.
     - CI: Cosmopolitanism does not strictly require open borders, but it does require that the global institutional order be arranged so that one's place of birth does not determine one's life chances. This can be achieved through a combination of global redistribution and the right to migrate when necessary to escape poverty or persecution. However, the CI in this collaboration holds that open borders are not the only way, but if global redistribution fails to address the inequalities, then open borders become necessary. The primary focus is on global redistribution.

     **Agreed Case for Crux 2**: Consider a global tax scheme (such as a global wealth tax or a reformed international taxation system) that redistributes resources from wealthy states to poor ones to ensure that all persons have access to basic goods (like education, healthcare, and a clean environment). The scheme is designed to be effective without requiring the free movement of people.

     - DCP prediction: Such a scheme is compatible with and even required by the institutionalist approach. It allows states to maintain control over their borders while fulfilling global obligations. The DCP would support this as a way to meet cosmopolitan demands without undermining state institutions.
     - CI prediction: This scheme is a step in the right direction, but it may not be sufficient. If, after implementing the tax scheme, there are still significant disparities that lead to forced migration (e.g., due to climate change or political instability), then the right to migrate must be recognized. The CI would argue that the tax scheme must be designed to be robust enough to prevent such situations, but if it fails, open borders become necessary.

  4. **Note on Verbal Disagreements**:
     After discussion, we find that part of our disagreement on the moral status of state institutions (Crux 1) may be partly verbal. The DCP emphasizes the unique functions that state institutions currently play in providing public goods and enabling self-determination, while the CI acknowledges these functions but argues that they are not inherently unique to states and can be replicated or replaced by other institutional forms. However, we both agree that institutions matter and that the current state institutions are the most powerful and widespread. The substantive disagreement remains about whether the state's role is indispensable and thus warrants special moral consideration beyond scale.

     On Crux 2, we agree that global redistribution is necessary and that open borders are not strictly required if redistribution is effective. The disagreement is about the sufficiency of redistribution without open borders and the conditions under which open borders become necessary.

  This joint statement reflects our adversarial collaboration. We have identified points of agreement and disagreement, clarified the cruxes, and tested them with cases. We commit to revisiting these predictions as empirical evidence unfolds.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Compatriot Partiality and Cosmopolitan Impartiality  
  *Based on Shared Institutionalist Premise: Special claims among compatriots arise solely from institutions distributing benefits/burdens, not from shared ancestry or culture.*  

  #### (1) Agreed Claims  
  We jointly affirm:  
  1. **Moral Status of Borders**: Political borders derive moral significance only from the institutions they demarcate, not from inherent ethical value. Borders are legitimate insofar as they facilitate fair institutional schemes.  
  2. **State vs. Nation Distinction**: States are territorially bounded entities enforcing institutional rules; nations are cultural/identity groups. Claims of justice apply to *state institutions* (e.g., legal systems, welfare programs), not nations per se.  
  3. **Special Obligations**: Shared participation in state institutions generates special obligations among compatriots (e.g., tax compliance, voting). These obligations are *relational*, not innate, and emerge from reciprocal benefits/burdens (e.g., infrastructure access in exchange for taxation).  
  4. **Global Distributive Justice**: All persons possess equal moral worth. Global institutions (e.g., trade agreements, climate treaties) create duties to alleviate unjust inequalities, irrespective of borders.  
  5. **Institutional Scalability**: Obligations can arise at any institutional level (local to global), but their content depends on the scheme’s scope and enforceability.  
  6. **Non-Exploitation Principle**: No institutional scheme should coercively disadvantage outsiders (e.g., trade policies exacerbating global poverty).  

  #### (2) Disagreements Table  
  | Issue | Defender of Compatriot Partiality (DCP) | Cosmopolitan Impartialist (CI) |  
  |-------|----------------------------------------|-------------------------------|  
  | **Strength of Compatriot Claims** | Compatriot obligations are *presumptively weightier* than global duties. States, as primary sites of democratic self-determination, may prioritize citizens when institutional resources are scarce. | All obligations—local or global—are *equally justiciable*. Institutional participation does not inherently license partiality; fairness must be assessed impartially. |  
  | **Institutional Moral Specialness** | State institutions are *qualitatively unique*: they alone provide collective self-rule, guarantee fundamental rights, and sustain large-scale social trust. | State institutions differ only in *scale and power*, not moral kind. Firms, NGOs, or global bodies can similarly ground obligations if they distribute significant benefits/burdens. |  
  | **Open Borders Requirement** | Borders may be restricted to preserve institutional integrity (e.g., welfare states). Cosmopolitanism permits controlled migration alongside redistribution. | While not strictly requiring open borders, cosmopolitan justice *demands radically expanded migration access* if redistribution fails to rectify birthplace-based disadvantages. |  

  #### (3) Cruxes and Case Analyses  
  **Crux 1: Are state institutions morally special in kind?**  
  - **DCP**: States are unique in enabling democratic agency and securing basic rights—functions no sub-/supranational institution replicates.  
  - **CI**: States are concentration points of power, but their moral relevance stems from impact, not essence. A multinational firm enforcing labor rules or a city providing universal healthcare can generate comparable claims.  

  **Agreed Case**: *A municipality and a state both institute universal healthcare. The state program covers 50 million people; the municipality covers 500,000. Both are funded by participant taxes.*  
  - **DCP Prediction**: The state’s scheme imposes weightier obligations because its collapse would cause catastrophic rights violations and social instability, unlike the municipality’s.  
  - **CI Prediction**: Both schemes create identical obligations per participant (e.g., funding fairness). The state’s scale magnifies responsibility but does not alter its moral nature.  

  **Crux 2: Does cosmopolitanism require open borders?**  
  - **DCP**: No. Cosmopolitan duties can be fulfilled via wealth redistribution (e.g., global taxes) without open borders.  
  - **CI**: Open borders are *conditionally necessary*: if global redistribution fails to neutralize birth-based arbitrariness after reasonable effort, migration must be liberalized.  

  **Agreed Case**: *Wealthy State A enacts a 0.1% global wealth tax, redistributing $50B/year to poor nations. Poverty-driven migration pressure persists.*  
  - **DCP Prediction**: Tax schemes satisfy cosmopolitan duties; State A may restrict immigration to protect its institutions, provided redistribution continues.  
  - **CI Prediction**: If poverty persists despite redistribution, birthplace remains a morally arbitrary barrier to opportunity. State A must expand immigration quotas proportionally to unmet need.  

  #### (4) Verbal Disagreements  
  - **"Moral Specialness" (Crux 1)**: Partly verbal. DCP uses "special in kind" to denote states’ *functional necessity* for rights protection; CI interprets "kind" as *categorical distinction*. We agree states are *practically indispensable* under current conditions but disagree on whether this implies unique moral properties.  
  - **"Requires Open Borders" (Crux 2)**: Substantive. Disagreement hinges on the sufficiency of non-migratory remedies to birthplace injustice.  

  ---  
  **Commitment**: We will revisit these predictions upon observing real-world analogs to the cases (e.g., post-tax migration patterns). Our goal is empirical testing of whether institutional partiality can be defended without violating impartialist foundations.
