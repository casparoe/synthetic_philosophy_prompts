answer: |-
  You raise two serious points. First, that disciplined parties have historically won material gains for the oppressed. I have seen this myself, in strikes and campaigns. I do not deny that parties can deliver bread, sometimes. But they deliver it poisoned. The mechanism is the demand for loyalty, the suspension of individual conscience for the sake of the collective will. Winning becomes the ultimate good, making truth and justice contingent on the party's success. The gains are real, but the cost is the soul’s capitulation.

  Second, you ask what mechanism prevents the alternative – the assemblies, the councils, the functional groups I imagine – from becoming just another idol. The difference is in structure and purpose. A party exists *to perpetuate itself and gain power*. Its survival requires manufacturing consent, simplifying thought into slogans, demanding allegiance. The mechanisms I propose would be decentralized, focused on *specific tasks or inquiries* – establishing facts about housing, deliberating on a local ordinance, managing a cooperative. They would be *ad hoc*, dissolving when the task is done, rotating delegates, forbidden from building permanent bureaucracies or demanding ideological purity. Loyalty is to the task and the truth sought, not to the group itself. The group serves the function, it is not an end. Power is distributed, not accumulated.

  My position is most exposed on the practical transition. How do we dismantle existing party structures without unleashing chaos or allowing worse forces to fill the void? What prevents these functional assemblies from being crushed by the state or capital *before* they can prove their viability? If you could show me a stable, large-scale society achieving durable justice for the poor *without* falling into some form of party-like idolatry in its organizing structures, I would have to reconsider my abolitionism. I have not seen it. Yet. The mechanisms I describe are fragile, easily corrupted. That is their point – they should be, to prevent the ossification of power. But fragility may be their fatal flaw against ruthless opponents.
