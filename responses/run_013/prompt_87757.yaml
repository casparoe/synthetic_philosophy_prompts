prompt: |-
  I'm a senior engineer at a ~60 person startup and I've somehow ended up owning our docs and commit-message conventions, which is a weird amount of power over what people are allowed to say. I did a CS degree, never took a philosophy class, so forgive me if I get terms wrong.

  The thing that keeps biting us: someone writes in a README "safe to call from multiple threads", or a postmortem says "the outage was caused by the cache eviction change", or a commit says "fixes the duplicate-charge bug" — and it turns out nobody actually knew that, they believed it or thought it was probably true. I've read enough philosophy-adjacent stuff to know there's a real debate about what you're allowed to assert: only what you know, or is truth enough, or is having good evidence the bar. I think that debate is exactly our problem, but every version I've seen is written for philosophers and I need something my team will use in a code review.

  So turn that into a decision procedure I can put in our docs. The questions a reviewer or author runs through in order: what kind of claim is this, what would have to be true for it to be assertable, what evidence moves it between buckets, when do we downgrade to "we believe" or "we've seen no evidence of", and where does the procedure just stop and say this is a judgment call, escalate. Ten minutes in a code review is my budget, and I'm the one who has to sign off on the doc.

  Two wrinkles I want handled because they're the ones that actually come up: (1) a lot of what we "know" is team knowledge — no single person knows the cache change caused the outage, but the team's evidence together does, so does a knowledge bar even make sense at the level of one author; and (2) we constantly imply claims we never state — a README that lists "handles retries" gets read as asserting retries work under load even if nobody wrote that down.

  Then run it on three cases: the thread-safety line in the README, the causal claim in the postmortem, and the commit claiming a fix for a bug that hasn't reproduced since. At least one of those should come out with an answer I won't like, and tell me straight which steps are just vibes dressed up as rules.
reasoning: |-
  We are creating a decision procedure for making assertions in technical documentation, commit messages, and postmortems. The goal is to balance truthfulness, evidence, and practicality within a 10-minute code review budget. The procedure must handle team knowledge and implied claims.

  Core Principles:
  1. **Assertions must be backed by evidence** appropriate to the context and stakes.
  2. **Clarity over certainty**: When evidence is weak, use hedging language (e.g., "we believe", "appears to").
  3. **Team knowledge is valid** if it is the consensus of the relevant experts on the team and is documented or easily verifiable.
  4. **Implications must be made explicit** if they are critical and not obviously true.

  Decision Procedure Steps:

  1. **Identify the claim type** (categorize to set the evidence bar):
     - **Factual**: Statements about how the code behaves (e.g., "safe to call from multiple threads").
     - **Causal**: Statements about cause and effect (e.g., "the outage was caused by X").
     - **Corrective**: Statements about fixes (e.g., "fixes bug Y").
     - **Implicit**: Unstated but inferred claims (e.g., a README saying "handles retries" implies it works under load).

  2. **Set the evidence bar** (what must be true to assert?):
     - **Factual**: Requires direct evidence (e.g., tests, code inspection, logs) or team consensus from past verification.
     - **Causal**: Requires rigorous analysis (e.g., root cause investigation, reproducible steps, elimination of alternatives).
     - **Corrective**: Requires verification that the fix addresses the root cause and that the issue is resolved (e.g., tests, monitoring, no recurrence).
     - **Implicit**: If the implication is critical (e.g., retries under load are essential), then it must be explicitly stated and verified.

  3. **Gather evidence** (what moves it between buckets?):
     - **Direct evidence**: Tests, logs, reproducible steps, monitoring data.
     - **Indirect evidence**: Code inspection, expert consensus, historical data.
     - **Lack of evidence**: Absence of counterexamples is weak evidence and requires hedging.

  4. **Decide assertion level** (based on evidence):
     - **Assert with confidence**: When evidence is direct and unambiguous (e.g., "Safe to call from multiple threads (tested with 100 concurrent threads)").
     - **Hedge**: When evidence is indirect or incomplete (e.g., "Appears safe to call from multiple threads based on code inspection; stress tests pending").
     - **Downgrade**: When evidence is weak or absent (e.g., "We believe it is safe to call from multiple threads, but this has not been tested").
     - **Escalate**: If the stakes are high (e.g., security, data loss) and evidence is weak, escalate for more investigation.

  5. **Handle team knowledge**:
     - If the claim relies on team knowledge, verify that:
       - There is consensus among the relevant experts.
       - The knowledge is documented (e.g., in past postmortems, design docs) or can be easily reconstructed (e.g., from commit history, tests).
       - If not, downgrade to a hedged statement and document the gap.

  6. **Implicit claims**:
     - For any critical implication (e.g., retries under load), ask: "Is this obvious and uncontroversial?"
       - If yes, no action.
       - If no, make the claim explicit and apply the above procedure.

  7. **Stopping point**:
     - After 10 minutes, if the evidence is unclear or conflicting, downgrade to a hedged statement and create a ticket for further verification. If the issue is critical (e.g., production outage cause), escalate.

  Now apply to the three cases:

  **Case 1: Thread-safety in README**
  - **Claim type**: Factual (with implicit claim about concurrency safety).
  - **Evidence bar**: Direct evidence (tests under load) or code inspection by experts.
  - **Gather evidence**: What do we have? Code inspection? Tests? If there are tests, we can assert. If only code inspection, hedge.
  - **Team knowledge**: If multiple engineers have reviewed and agree, that's team knowledge and can be asserted if documented. Otherwise, hedge.
  - **Implicit claims**: The statement might imply safety under high concurrency. If that's not tested, we must qualify: "Safe for concurrent access under low load; high concurrency not tested."
  - **Decision**: 
    - If tested: "Safe to call from multiple threads (verified by stress test in PR #123)."
    - If not: "Code inspection suggests it is safe to call from multiple threads, but this has not been stress-tested. Use caution under high load."

  **Case 2: Postmortem causal claim**
  - **Claim type**: Causal.
  - **Evidence bar**: Rigorous analysis (e.g., timeline correlation, log evidence, elimination of other causes).
  - **Gather evidence**: Do we have logs showing the cache eviction caused errors? Did we rule out other factors? If we have strong evidence, assert. If circumstantial, hedge.
  - **Team knowledge**: If the team analyzed and reached consensus, that's valid. But if no single person knows, but the evidence is documented, we can assert: "Based on team analysis, the outage was caused by..."
  - **Decision**:
    - If strong evidence: "The outage was caused by the cache eviction change (see logs from 2023-01-01 showing errors starting immediately after deployment)."
    - If weak: "The outage appears to have been caused by the cache eviction change, though other factors may have contributed (investigation ongoing)."

  **Case 3: Commit claiming a fix for a bug that hasn't reproduced**
  - **Claim type**: Corrective.
  - **Evidence bar**: Verification that the fix addresses the root cause and the issue is resolved (reproducible before, not after).
  - **Gather evidence**: Can we reproduce the bug before the fix? After the fix, has it been tested? If the bug is intermittent, we need monitoring to confirm it doesn't recur.
  - **Decision**:
    - If we have a test that reproduces the bug and the fix passes: "Fixes the duplicate-charge bug (reproduced in test X, now fixed)."
    - If we cannot reproduce but the fix addresses a likely cause: "Attempts to fix the duplicate-charge bug by addressing [specific cause]. Monitoring for recurrence." Then, after a period without recurrence, we can update to "Fixed".

  **Which one won't you like?** 
  The commit message case. Sometimes we cannot reproduce a bug, but we make a fix that we believe addresses it. The procedure forces us to hedge: "Attempts to fix" or "Addresses a potential cause". This might feel unsatisfying because we want to close the issue, but it's honest. After a waiting period (e.g., 1 week) without recurrence, we can update the commit message (or the linked ticket) to confirm the fix.

  **Vibes dressed as rules?**
  - Step 4 (Decide assertion level) and Step 7 (Stopping point) involve judgment. The evidence bar isn't always clear. The rule is: when in doubt, hedge and create a ticket. This is a vibe because the threshold for "direct" vs. "indirect" evidence is contextual.
  - Handling implicit claims (Step 6) is also vibe-heavy: what is "critical" and "obvious"? We rely on the reviewer's experience. The rule is: when critical, make it explicit. But what is critical? That's a judgment call.

  Final Procedure for Documentation:

  ```
  # Assertion Guidelines

  When writing documentation, commit messages, or postmortems, follow this procedure:

  1. **Identify the claim**: What are you asserting? (fact, cause, fix, etc.)
  2. **Check for implications**: What might readers infer? If it's critical and not obvious, make it explicit.
  3. **Gather evidence**: What do you have to support the claim? (tests, logs, consensus, etc.)
  4. **Set the assertion level**:
     - **High confidence** (direct evidence): State clearly and cite evidence.
     - **Medium confidence** (indirect evidence): Use "appears", "suggests", or "we believe".
     - **Low confidence** (weak evidence): Use "may" or "might", and document gaps.
  5. **Team knowledge**: If relying on team knowledge, ensure it is documented or there is consensus. If not, hedge and document.
  6. **Timebox**: Spend no more than 10 minutes in review. If uncertain:
     - Downgrade the assertion (hedge).
     - Create a ticket for further verification.
     - Escalate if the stakes are high (e.g., production stability).

  Examples:
  - README (thread-safety): 
    - Good: "Safe for concurrent access (verified by stress test in `test_concurrency.py`)."
    - Hedged: "Code inspection suggests thread-safety; stress testing pending. See #TICKET."
  - Postmortem (causal claim):
    - Good: "The outage was caused by the cache eviction change (log analysis shows errors starting at deployment, and reverting resolved it)."
    - Hedged: "The cache eviction change appears to have caused the outage, though other factors may have contributed. Investigation in #TICKET."
  - Commit (fix for intermittent bug):
    - Good: "Fixes duplicate-charge bug by validating idempotency keys (reproduced in test, now fixed)."
    - Hedged: "Addresses a potential cause of the duplicate-charge bug by validating idempotency keys. Monitoring for recurrence. See #TICKET."

  Remember: When in doubt, hedge and follow up.
  ```

  This should fit within a 10-minute review and handle the wrinkles.
answer: |-
  Here's a pragmatic decision procedure designed for engineers, with philosophical concepts translated into code-review-friendly checks. It handles your wrinkles and stays within a 10-minute review budget:

  ### **Assertion Validation Procedure**  
  *(For READMEs, commit messages, postmortems)*

  1. **Categorize the Claim Type** (1 min)  
     - ✅ **Code Fact**: Observable system behavior (e.g., "thread-safe")  
     - ⚠️ **Causal Claim**: Attribution of cause/effect (e.g., "caused by cache change")  
     - 🔧 **Fix Claim**: Resolution of an issue (e.g., "fixes duplicate-charge bug")  
     - 🔥 **Implied Claim**: Critical interpretation of unstated behavior (e.g., README says "handles retries" → implies "under load")  

  2. **Evidence Triage** (3 min)  
     | Claim Type       | Minimum Assertable Evidence                          | "Believe" Threshold              |  
     |------------------|------------------------------------------------------|----------------------------------|  
     | **Code Fact**    | Tests/logs in CI *or* team-verified design doc       | Code review consensus            |  
     | **Causal Claim** | Correlation + elimination of alternatives *or* repro | Root-cause analysis meeting notes|  
     | **Fix Claim**    | Reproducible test *or* monitored resolution in prod  | Fix deployed + no immediate errors |  
     | **Implied Claim**| Explicit tests for critical interpretations          | N/A (always make explicit)       |  

  3. **Team Knowledge Protocol** (2 min)  
     - ✔️ **Valid Team Claim** IF:  
       - Evidence exists in shared systems (logs, CI, monitoring)  
       - ≥2 relevant engineers confirm during review  
       - *Else* → Downgrade to "we believe"  
     - ✖️ **Invalid Team Claim** IF:  
       - Relies on oral tradition or outdated docs  
       - Single engineer's extrapolation  

  4. **Escalate/Downgrade Triggers** (2 min)  
     - **Downgrade to "we believe"** when:  
       - Evidence is circumstantial (e.g., "bug stopped after deploy")  
       - High-risk domain (billing, security, etc.)  
     - **Escalate immediately** when:  
       - Legal/compliance implications  
       - Blame assignment in postmortems  
       - >50% of reviewers disagree  

  5. **Implication Defuser** (2 min)  
     For any claim that *could* be misinterpreted:  
     ```markdown  
     BAD: "Handles retries"  
     GOOD: "Handles retries [under normal load; <100 QPS. For high volume, see #ticket-123]"  
     ```  
     - **Rule**: If the implied behavior could cause an outage if false, make it explicit + caveated.

  ---

  ### **Applied to Your Cases**  
  **Case 1: README "safe to call from multiple threads"**  
  - **Type**: Code Fact + *Implied Claim* (safe under all conditions?)  
  - **Evidence Check**:  
    - ✅ If stress-tested in CI with race-condition checks → **assertable**  
    - ❌ If only code review consensus → **downgrade to**: "Code review suggests thread safety; verify under load via STRESS_TEST_README"  
  - **Implication Defuser**: Add caveat: "Safe for ≤16 threads; for scaling, see thread_benchmarks.md"  

  **Case 2: Postmortem "caused by cache eviction change"**  
  - **Type**: Causal Claim  
  - **Evidence Check**:  
    - ✅ If logs show errors spiked post-deploy *and* revert fixed it → **assertable**  
    - ❌ If correlation only → **downgrade to**: "Evidence suggests cache eviction change contributed; root cause analysis ongoing in #ticket-X"  
  - **Team Knowledge**: Valid only if postmortem attendees confirmed evidence during blameless meeting.  

  **Case 3: Commit "fixes duplicate-charge bug" (not reproduced)**  
  - **Answer you won't like**: **This is never assertable**  
    - **Type**: Fix Claim  
    - **Evidence Check**: ❌ No repro → no proof of fix.  
    - **Procedure Mandate**:  
      ```  
      BAD: "fixes duplicate-charge bug"  
      GOOD: "attempts to fix duplicate-charge by [mechanism]. Monitor via [dashboard] for recurrence."  
      ```  
    - **Why**: Unreproduced bugs lack baseline evidence. Claiming a fix creates false certainty.  

  ---

  ### **Where "Vibes Dressed as Rules" Live**  
  1. **Team Consensus Threshold**:  
     - "≥2 engineers" is a heuristic. Escalate if consensus feels forced.  
  2. **Implied Claim Severity**:  
     Judgment call: Ask "Could misinterpretation cause a SEV-2+ outage?" If yes, defuse.  
  3. **Causal Claim Downgrades**:  
     "Evidence suggests" vs. "caused by" depends on reviewer risk tolerance. Default to caution.  

  ### **Procedure Cheatsheet for Your Docs**  
  ```markdown  
  ## Assertion Rules  
  1. **Code Facts**: Require tests/CI proof. No proof? → "Appears to [behavior]"  
  2. **Causation**: Require correlation + elimination of alternatives. Else → "Evidence suggests"  
  3. **Fixes**: Require reproduction + resolution. Else → "Attempts to fix by [mechanism]"  
  4. **Team Knowledge**: Document evidence or downgrade. Never trust oral history.  
  5. **Implications**: Add explicit caveats for high-risk interpretations.  

  When in doubt:  
  - Downgrade → "We believe", "Appears to", "Evidence suggests"  
  - Escalate → Legal issues, blame, or team disputes  
  ```  

  This forces honesty while respecting time constraints. The commit-message case is intentionally strict—unverified "fixes" create technical debt. For postmortems, the "downgrade unless proven" rule prevents speculative root causes. Thread safety gets explicit because implications are systemic risks.
