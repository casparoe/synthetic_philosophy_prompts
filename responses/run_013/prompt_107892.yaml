prompt: |-
  I'm a fourth-year PhD student in philosophy writing on collective responsibility, and I've hit a snag in my own thinking that I'd like help with. In seminar I'm perfectly comfortable saying that the inefficacy objection is too quick — that individual contributions to climate change, to factory farming, and to elections can be wrong even when they make no difference at all. But when I interrogate my gut verdicts on particular cases, they don't line up the way my seminar self insists they should. Here they are, as honestly as I can state them. Driving my aging gasoline car to campus every day for a year: mildly wrong, and I do feel a small amount of guilt, though not enough to reorganize my life. Flying once a year across an ocean to see my parents: not wrong at all, and I would resent being criticized for it. Flying the same distance in a private jet I happened to be offered: clearly wrong, and the wrongness doesn't seem to scale merely with the carbon. Buying and eating a beef burger in a crowded restaurant: wrong, but weakly — the sort of thing I'd defend a friend for doing. Buying the last beef burger of the evening at an almost empty restaurant, where the kitchen would otherwise have thrown the patty out: nearly innocent, even though the animal was raised and killed for it all the same. Voting in a national election where my single vote is one in tens of millions: I feel straightforwardly obligated, and I would think less of a well-informed friend who skipped it, even in a safe state. Adding one drop of dye to a swimming pool when a thousand others are each adding one: I cannot get myself to call it wrong. Being the one whose drop tips the pool past the threshold and turns it visibly green: wrong, and categorically worse than the previous case, not merely a bit worse. Boycotting a company that will never notice my absence: feels meaningful and worth doing, though I can't claim it changes anything. Taking the one empty seat on a repositioning flight that the airline would have flown anyway: I feel nothing at all about this. And declining meat when I am the only vegetarian at a table where the meat has already been ordered: no obligation whatsoever, though the animal is no less dead.

  My tentative principle was this: an individual act is wrong only if it is the marginal cause of a harm — that is, only if the harm would not have occurred without it — and otherwise it is at best a matter of character, integrity, or solidarity. That principle seems to get the private jet, the threshold-tipping drop, the leftover patty, and the empty seat, but it also licenses the daily driving, the safe-state abstention, and a general shrug at the crowded restaurant, which I can't accept. A friend of mine puts the point by saying that by the time I act the harm is already overdetermined; another replies that this is just the fallacy of division run backwards, and I can't tell which of them is right. So what I want from you is the principle, or small set of principles, that actually captures the verdicts above. I'm interested in whether a single account can do it — perhaps one that distinguishes acts which trigger a harm from acts which sustain a harmful practice, or that weights each participant's contribution by the share of the harm they are individually answerable for — and if no single account works, which of my verdicts I should give up and why. Please also say what your preferred principle implies about two cases I haven't listed: buying a single cheap item I know was made in a sweatshop, and going vegetarian in a country where, for demographic reasons, my abstention would genuinely reduce production by one animal's worth. I don't need a literature survey or citations; I want the principle stated precisely, with the case that motivates each clause, its verdicts on the cases above, and an honest statement of which of my verdicts it cannot accommodate.
reasoning: |-
  Okay, the user is a PhD student in philosophy focusing on collective responsibility, specifically struggling with the inefficacy objection regarding individual contributions to collective harms like climate change or unethical consumption. They've hit a snag where their theoretical stance in seminars (rejecting the inefficacy objection) clashes with their intuitive judgments on specific cases. They listed several scenarios where their gut feelings about moral wrongness don't align with their academic position, and they're seeking a coherent principle that explains these intuitions without inconsistency.

  First, I need to unpack their core tension: They accept in theory that individual acts can be wrong even without causal difference (e.g., voting, boycotts), but their instincts rebel in cases like negligible pollution (the dye drop) or inconsequential consumption (the leftover burger). Their proposed marginal-cause principle fails because it condemns threshold cases (tipping the pool green) but excuses most real-world acts (daily driving), which they find unsatisfying. Their deeper need seems to be reconciling moral responsibility with overdetermined harms—wanting a framework that doesn't reduce ethics to pure consequentialism but also avoids "moral magic" (e.g., treating identical acts differently based on arbitrary factors).

  Looking at their cases, I notice patterns:  
  - **Symbolic weight**: Flying commercial vs. private jet isn't just about carbon; the latter feels ostentatious.  
  - **Salience of waste**: The leftover burger feels innocent because refusing it "does nothing," but the animal's suffering is identical.  
  - **Threshold effects**: Tipping the pool green feels categorically worse, even if earlier drops were identical.  
  - **Social context**: Boycotts feel meaningful despite inefficacy; skipping voting feels blameworthy even in safe states.  

  This suggests their intuitions aren't just about consequences but also about **complicity in unjust systems** (e.g., participating in factory farming) and **expressive meaning** (e.g., private jets as flaunting excess). The challenge is systematizing this without ad hoc explanations.  

  I consider three approaches:  
  1. **Complicity-based**: Wrongness stems from willingly benefiting from/enabling harmful systems. This handles driving (routine participation) and sweatshops (direct consumer link) but struggles with the repositioning flight (no marginal harm) or the dye drop (no system).  
  2. **Expressive harm**: Acts are wrong if they express disrespect or endorse harm. This captures the private jet (symbolic excess) but may overcondemn benign acts (e.g., eating meat culturally).  
  3. **Hybrid view**: Maybe combine complicity for systemic harms (climate, farming) with marginal harm for threshold cases (dye pool).  

  The hybrid framework seems promising. Let's build it:  
  - **Clause 1 (Systemic Participation)**: An act is pro tanto wrong if it constitutes participation in an unjust collective harm, proportional to the act's contribution to normalizing/sustaining the practice.  
    *Motivation*: Explains daily driving (sustains fossil fuels), beef in a crowded restaurant (supports factory farming), and sweatshop purchases.  
    *Verdicts*: Condemns driving, routine flying, crowded-restaurant beef. Excuses the repositioning flight (no participation in demand) and the leftover burger (no demand signal).  
  - **Clause 2 (Marginal Harm)**: An act is wrong if it actually causes harm that wouldn't otherwise occur.  
    *Motivation*: Handles threshold cases (tipping the pool) and the private jet (directly orders high-pollution travel).  
    *Verdicts*: Condemns threshold drop, private jet. Excuses non-threshold drops.  
  - **Clause 3 (Expressive Wrongness)**: An act is wrong if it expresses contempt for victims or flouts solidarity, independent of consequences.  
    *Motivation*: Captures the private jet's "obscene" feel and condemns skipping voting (betrays civic duty).  
    *Verdicts*: Condemns private jet, abstaining from voting. Excuses flying to see parents (expression of care).  

  Now, test against their cases:  
  - **Daily driving**: Wrong via Clause 1 (systemic participation). ✅ Matches their mild guilt.  
  - **Transoceanic flight**: Not wrong via Clause 3 (expression of care outweighs systemic harm? Or permissible as non-excessive participation). ✅ Matches no resentment.  
  - **Private jet**: Wrong via all three clauses (marginal harm, expressive excess, systemic reinforcement). ✅  
  - **Beef burger (crowded)**: Wrong via Clause 1. ✅  
  - **Leftover burger**: Not wrong via Clause 1 (no demand signal). ✅  
  - **Voting**: Obligatory via Clause 3 (expressive duty). ✅  
  - **Non-threshold dye drop**: Not wrong (no Clause 1 system? Or negligible participation). ✅  
  - **Threshold dye drop**: Wrong via Clause 2. ✅  
  - **Boycotting**: Meaningful via Clause 1 (symbolic participation withdrawal) or Clause 3 (solidarity). ✅  
  - **Repositioning flight**: Neutral via Clause 1 (no participation in demand). ✅  
  - **Declining meat (already ordered)**: Neutral via Clause 1 (no demand impact). ✅  

  **Unresolved tensions**:  
  - Their guilt about daily driving clashes with permissibility of transoceanic flight. The framework allows this by distinguishing routine consumption (easily avoidable) from meaningful travel (harder to avoid, expressive value). They might need to bite the bullet here or add a "reasonable alternatives" condition.  
  - Sweatshop purchase: Wrong via Clause 1, even if negligible. Forces consistency—they can't excuse it if they condemn crowded-restaurant beef.  
  - Vegetarian in impactful country: Strongly obligatory via Clause 1 + 2 (direct reduction).  

  **Refinement**: Add "reasonable expected impact" to Clause 1 to address flying vs. driving? But risks collapsing into consequentialism. Instead, emphasize **fairness**: It's unfair to free-ride on others' restraint (e.g., daily driving while expecting climate action). This could strengthen their voting intuition too.  

  **Conclusion**: The hybrid framework preserves most intuitions by separating systemic complicity, marginal harm, and expressive duties. They must either accept condemning sweatshop purchases (consistent with beef burger verdict) or soften that intuition. The real work is justifying why some participation (flying to parents) is excused—perhaps appeal to reciprocity (if all flew rarely, emissions would be sustainable) or essential needs. That’s where the dissertation gold lies.
answer: |-
  Here's a principled framework that systematizes your intuitions while exposing one core tension. It combines three distinct moral dimensions, rejecting a single "unified field theory" of collective harm. The key is distinguishing **participation in unjust systems**, **direct marginal harm**, and **expressive meaning**:

  ### The Hybrid Principle
  1. **Systemic Participation**: An act is *pro tanto* wrong if it constitutes participation in an unjust collective harm, proportional to:  
     - (a) The act’s *quantifiable contribution* to the harm (scaled by its marginal impact),  
     - (b) Its *causal role* in sustaining the harmful practice (e.g., signaling demand, normalizing behavior),  
     - (c) The *remediability* of the harm (could the system function justly?).  
     *Motivation*: Explains guilt over daily driving (sustains fossil fuel dependence) and crowded-restaurant beef (supports factory farming), while excusing the leftover burger (no demand signal) and the empty flight seat (no participation in incentivizing harm).

  2. **Marginal Harm**: An act is wrong if it *directly causes* a harm that would not otherwise occur.  
     *Motivation*: Captures the threshold-tipping dye drop (causally necessary for the visible harm) and the private jet (directly orders a high-pollution flight that wouldn’t happen without you).

  3. **Expressive Wrongness**: An act is wrong if it *expressively disrespects* victims or *flouts solidarity* in a way that undermines shared moral commitments, independent of consequences.  
     *Motivation*: Explains the private jet’s categorical wrongness (symbolic excess), the obligation to vote (civic duty), and resentment over criticism of visiting parents (expression of care outweighs systemic participation).

  ---

  ### Verdicts on Your Cases
  | Case                          | Systemic Participation | Marginal Harm | Expressive Wrongness | Overall Verdict | Matches Your Intuition? |
  |-------------------------------|------------------------|---------------|----------------------|-----------------|-------------------------|
  | Daily gasoline car commute    | Wrong (a,b,c)          | Neutral       | Neutral              | **Mildly wrong** | ✅                      |
  | Commercial flight to parents  | Permissible (c: low remediability) | Neutral | **Permissible** (care) | **Not wrong** | ✅ |
  | Private jet flight            | Wrong (a,b,c)          | **Wrong**     | **Wrong** (excess)   | **Clearly wrong** | ✅ |
  | Beef burger (crowded restaurant) | **Wrong** (b: demand signal) | Neutral | Neutral | **Weakly wrong** | ✅ |
  | Last beef burger (avoiding waste) | Permissible (no b) | Neutral | Neutral | **Nearly innocent** | ✅ |
  | Voting in national election   | Neutral                | Neutral       | **Wrong to skip** (duty) | **Obligatory** | ✅ |
  | One dye drop (no threshold)   | Neutral (no system)    | Neutral       | Neutral              | **Not wrong**   | ✅ |
  | Threshold-tipping dye drop    | Neutral                | **Wrong**     | Neutral              | **Wrong**       | ✅ |
  | Boycotting unnoticed company  | **Permissible** (withdrawal) | Neutral | **Permissible** (solidarity) | **Meaningful** | ✅ |
  | Empty seat on repositioning flight | Permissible (no b,c) | Neutral | Neutral | **Neutral** | ✅ |
  | Declining already-ordered meat | Permissible (no b)     | Neutral       | Neutral              | **No obligation** | ✅ |

  ---

  ### Tension and the One Verdict to Reconsider
  Your intuition about **flying to see parents** is the outlier. The framework *partially* condemns it via Systemic Participation (it sustains aviation emissions). Yet you (and the principle’s Expressive clause) excuse it. To resolve this:  
  - **Give up the "no guilt" verdict for transoceanic flights**. If daily driving is wrong (same clause: sustaining fossil fuels), consistency demands seeing annual flights as *mildly* wrong. The Expressive clause mitigates but doesn’t erase this – it renders the act *all-things-considered permissible* due to care for parents, but still systemically problematic.  
  - **Why?** The harm (climate change) is severe and remediable (we could decarbonize aviation). Your participation, while emotionally justified, still signals demand for high-emissions travel. This doesn’t mean you *shouldn’t* fly, but it acknowledges a pro tanto wrong.

  ---

  ### New Cases
  1. **Buying a sweatshop item**:  
     - **Systemic Participation (a,b,c)**: Strongly wrong. You directly signal demand for exploitative labor (b), incentivize harm (a), and the system is remediable (c).  
     - *Verdict*: **Wrong** (analogous to the crowded-restaurant burger).  

  2. **Going vegetarian in an impactful country**:  
     - **Systemic Participation (a)**: Quantifiably reduces harm (marginal impact exists).  
     - **Marginal Harm**: Directly prevents one animal’s suffering.  
     - *Verdict*: **Strongly obligatory** (like voting – your act has clear causal efficacy).

  ---

  ### Why This Works (and Where It Bites)
  - **Strengths**: Explains why the leftover burger feels innocent (no systemic participation) while the private jet feels egregious (all three clauses condemn it). Resolves the "overdetermination" confusion: acts can be wrong *as participation* even if harm is overdetermined (daily driving), but not if they lack causal roles in sustaining the system (repositioning flight).
  - **Cost**: You must accept that **transoceanic flights are pro tanto wrong** (though overridden by expressive goods). If this feels too demanding, weaken Systemic Participation’s (c) condition: if a practice is deeply embedded (like aviation) and alternatives are inaccessible, participation may be excused. But this risks excusing too much (e.g., "everyone drives, so why feel guilty?").
  - **Honest Limitation**: The Expressive clause is subjective. Why is flying privately "disrespectful" but flying commercial isn’t? This relies on social context – a weakness if seeking objective wrongness. However, it captures your resolute intuitions about symbolic meaning.

  **Final Recommendation**: Use this to refine your dissertation. Argue that collective responsibility requires a *pluralistic* account: individual acts can be wrong via complicity (Systemic Participation), direct causation (Marginal Harm), or symbolic betrayal (Expressive Wrongness). Abandoning the "no guilt" flight verdict strengthens your case against inefficacy – even meaningful acts can carry moral residue when they perpetuate injustice.
