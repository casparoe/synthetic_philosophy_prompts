prompt: |-
  I teach philosophy, and for the past two years I have sat with a colleague on our university's committee for algorithmic decision tools. Her votes are now numerous enough that I believe her position can be read off her record. She voted to reject a campus risk-scoring instrument that was well calibrated within each racial group but whose false-positive rate for one group was twice its rate for the other; the instrument drew on a variable that is widely regarded as a proxy for race. She voted to approve a scholarship screen whose false-positive and false-negative rates were identical across groups, even though a given score meant different things in each group, and which used no protected attribute and no plausible proxy. She voted to reject an instrument that flagged the same share of applicants from each group but whose error rates diverged sharply, and which used a protected attribute outright. And she voted to approve an instrument that made no errors at all in a population whose groups had different base rates, and which used no protected attribute. Next week we take up a tutoring-fund allocator whose false-positive and false-negative rates differ across groups, where the gap is a by-product of the groups' differing base rates rather than of anything the instrument does with group membership, which uses no protected attribute and no plausible proxy, which is calibrated within each group, and which is more accurate than any alternative we have examined. What will she vote, and why? I am less interested in the vote itself than in the rule she has been running: which rules fit her record equally well, what each predicts here, which one you would bet on and on what grounds, and which further proposal would most cleanly separate the survivors.
reasoning: |-
  Okay, let me start by trying to understand the user's problem. They teach philosophy and serve on a committee for algorithmic decision tools with a colleague. They've observed her voting pattern on several proposals and want to predict her vote on an upcoming one. But more importantly, they want to uncover the underlying rule guiding her decisions.

  First, I need to parse each of her past votes. There are four cases mentioned:

  1. Rejected a risk-scoring tool that was well-calibrated within groups but had double the false-positive rate for one racial group. It used a race proxy variable.  
  2. Approved a scholarship screen with equal false-positive and false-negative rates across groups, even though scores meant different things per group. No protected attributes or proxies used.  
  3. Rejected an instrument that flagged the same share of applicants per group but had divergent error rates, and used a protected attribute outright.  
  4. Approved a tool with no errors despite different base rates, no protected attributes used.  

  Now, the upcoming proposal is a tutoring-fund allocator with different error rates across groups due to base rates, no protected attributes or proxies, well-calibrated within groups, and more accurate than alternatives.  

  The user wants to know her vote and the principle behind her decisions. They also want to know which rules fit her record, which one is most probable, and how to test it further.  

  Looking at the votes, I notice she rejects tools that either use protected attributes/proxies (cases 1 and 3) or have unequal error rates (cases 1 and 3). She approves when there are no protected attributes/proxies (cases 2 and 4) even if the outcomes differ due to base rates. The unequal error rates in case 1 were likely due to the proxy, not base rates. In case 4, no errors despite different base rates—so outcome differences without discrimination.  

  The key seems to be whether the tool introduces unfairness through design (using protected attributes/proxies) vs. reflecting existing disparities (base rates). She might prioritize procedural fairness over outcome equality. So, the tutoring allocator has different error rates due to base rates, not design, and no proxies—similar to case 2 where she approved despite scores meaning different things per group.  

  Alternative rules could be focusing on error rate parity, but she approved case 2 which had equal error rates but different score interpretations. Or avoiding disparate impact, but she approved case 4 which had perfect accuracy with different base rates.  

  The strongest hypothesis is that she opposes tools using protected attributes/proxies but accepts those reflecting base rate differences without such usage. The tutoring allocator fits this, so she'd likely approve. To test, propose a tool with base rate differences but uses a proxy—she should reject. Or one with equal error rates but uses a protected attribute—reject.  

  The user might also be interested in the philosophical implications of her rule, like equality of opportunity vs. outcome. They teach philosophy, so connecting this to ethical frameworks could add depth, though the user focuses on prediction and testing.
answer: |-
  Based on your colleague's voting record, her consistent principle appears to be **Procedural Anti-Classification with Calibration**, focused on *how* the tool uses group information rather than solely on outcome disparities. Here's the breakdown:

  ### Core Rule Hypothesis
  She votes to **reject** any tool that:
  1.  **Uses protected attributes or plausible proxies** in its design or operation, **OR**
  2.  **Fails to be well-calibrated within groups** (indicating the score meaning differs systematically by group).

  She votes to **approve** tools that:
  1.  **Avoid protected attributes & proxies entirely**, **AND**
  2.  **Are well-calibrated within groups** (a score means the same thing probabilistically regardless of group), **EVEN IF**
      *   Error rates differ due to base rates (Case 4: Perfect tool, different base rates).
      *   The *implication* of a score differs across groups due to base rates (Case 2: Equal error rates, different score meanings implied by base rates).

  ### Analysis of Record
  1.  **Reject Campus Risk-Scorer:**
      *   Violated Rule 1: Used a race proxy.
      *   *Outcome:* Different FPR, but calibration OK. Rejection driven by proxy use.
  2.  **Approve Scholarship Screen:**
      *   Satisfied Rule 1: No protected attribute/proxy.
      *   Satisfied Rule 2: Calibrated within groups (implied by equal FPR/FNR & your description). Different implications due to base rates were acceptable.
  3.  **Reject Flagging Instrument:**
      *   Violated Rule 1: Used protected attribute outright.
      *   *Outcome:* Equal selection rate but divergent error rates. Rejection driven by attribute use (outcome reinforced it).
  4.  **Approve Perfect Instrument:**
      *   Satisfied Rule 1: No protected attribute/proxy.
      *   Satisfied Rule 2: Perfectly calibrated (trivially). Different base rates leading to different outcomes were acceptable.

  ### Prediction for Tutoring-Fund Allocator
  *   **Satisfies Rule 1:** "Uses no protected attribute and no plausible proxy."
  *   **Satisfies Rule 2:** "Calibrated within each group."
  *   **Error Rate Difference:** Explicitly stated as "a by-product of the groups' differing base rates rather than of anything the instrument does with group membership." This mirrors the acceptable scenarios in Cases 2 & 4.
  *   **Accuracy:** Being "more accurate than any alternative" reinforces that the disparity isn't due to poor design relative to options.

  **Verdict: She will vote to APPROVE.**

  ### Competing Rules & How They Fail
  1.  **"Requires Equal Error Rates (Parity)":**
      *   *Fits:* Rejected Case 1 (different FPR). Rejected Case 3 (divergent error rates).
      *   **Fails:** Approved Case 2 (equal error rates) **BUT ALSO** Approved Case 4 (different base rates inherently lead to different error rates for *any* perfect tool! FNR/FPR depend on prevalence. Her approval shows she accepts this).
      *   *Predicts here:* REJECT (different error rates).
  2.  **"Avoids Disparate Impact (Outcome Test)":**
      *   *Fits:* Rejected Case 1 (different FPR = disparate impact). Rejected Case 3 (divergent error rates = disparate impact).
      *   **Fails:** Approved Case 2 (equal error rates = no disparate impact) **BUT ALSO** Approved Case 4 (perfect tool inherently has disparate *outcomes* due to base rates! She approved it).
      *   *Predicts here:* REJECT (different error rates = disparate impact).
  3.  **"Prohibits Protected Attribute/Proxy Use Only":**
      *   *Fits:* Approved Case 2 (no proxy). Approved Case 4 (no proxy). Rejected Case 1 (proxy). Rejected Case 3 (attribute).
      *   **Fails:** Doesn't explain the emphasis on calibration or why she would approve Case 2 despite the "given score meant different things" (which implies a *lack* of calibration). Her approval suggests calibration *is* required.
      *   *Predicts here:* APPROVE (no proxy). (Correct prediction, but misses nuance).
  4.  **"Requires Calibration Only":**
      *   *Fits:* Approved Case 2 (calibrated? Implied by equal FPR/FNR). Approved Case 4 (calibrated). Rejected Case 1 (calibrated? You said it was! **Fails here**).
      *   **Fails:** She rejected Case 1 *despite* calibration because it used a proxy. Calibration alone isn't sufficient for her.
      *   *Predicts here:* APPROVE (calibrated). (Correct prediction, but misses why Case 1 was rejected).

  ### Betting & Rationale
  *   **I would bet STRONGLY on "Procedural Anti-Classification with Calibration" (Approval).**
  *   **Grounds:**
      1.  **Parsimony:** It cleanly explains all 4 votes without contradiction.
      2.  **Coherence:** It distinguishes between disparity *caused by the tool's design* (using group info) vs. disparity *reflecting underlying reality* (base rates), which aligns with core fairness concepts like "anti-classification" and "calibration."
      3.  **Specificity:** It captures the nuance of rejecting Case 1 (proxy use) despite calibration and approving Case 2 (calibration) despite different score implications due to base rates.
      4.  **Direct Match:** The tutoring allocator perfectly fits the pattern of her approvals (Cases 2 & 4).

  ### Discriminating Proposal (Separating Survivors)
  To definitively test "Procedural Anti-Classification with Calibration" vs. the close contender "Prohibits Protected Attribute/Proxy Use Only" (which also predicts approval here but misses the calibration requirement), propose a tool with these characteristics:

  *   **Avoids Protected Attribute/Proxy:** Uses no protected attribute or plausible proxy.
  *   **NOT Calibrated Within Groups:** A given score implies a significantly different probability of the outcome for Group A vs. Group B (e.g., a score of 70 means a 60% chance for Group A but only a 40% chance for Group B).
  *   **Equal Error Rates (or Other Parity):** Achieves equal FPR/FNR across groups *despite* the lack of calibration (likely through complex threshold tuning or group-specific adjustments made *without* using group membership in the model itself, perhaps via separate post-processing).

  **Prediction:**
  *   **"Procedural Anti-Classification with Calibration":** REJECT. Violates Rule 2 (Not Calibrated).
  *   **"Prohibits Protected Attribute/Proxy Use Only":** APPROVE. Only Rule 1 is satisfied (No proxy), lack of calibration isn't a dealbreaker.

  This proposal cleanly separates the two most plausible rules by isolating the calibration requirement from the proxy/attribute prohibition. Her rejection would confirm the centrality of calibration within her procedural framework. Her approval would indicate the prohibition on proxies/attributes is her *only* binding constraint.
