  Also, the user wants the poem accessible. Those unfamiliar with the argument should sense something off about naming private feelings. Avoiding heavy jargon is key. The pain's description needs to be visceral yet ambiguous, emphasizing the isolation of personal experience.

  Rhymes shouldn't be too neat to reflect the lack of public rules. Maybe use slant rhymes or near-rhymes. Keeping around five stanzas, each building the argument. The last stanza closing the loop with the opening lines reinforces the cyclical, unverifiable nature of her diary.

