  First, the pantoum structure is crucial. It requires lines 2 and 4 of each stanza to repeat as lines 1 and 3 in the next. This repetition should mirror the girl's attempt to recognize the same sensation, highlighting the unreliability of her memory. The challenge is to make the repetition feel like a recurring pain but subtly show that each recurrence isn't verifiable.

