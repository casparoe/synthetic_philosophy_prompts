prompt: |-
  ok so for my schools philosophy club i have to write a poem about wittgensteins private language argument and i want it to actually do the argument instead of just saying his name. could you write me a pantoum, the repeating form where lines 2 and 4 of each stanza come back as lines 1 and 3 of the next, and the last stanza closes the loop with the opening lines? the speaker is a girl who gets a weird pain behind her left eye and keeps a private voice memo diary of it. every time it happens she tries to name the feeling with the same word, and she also rates it on a little 1 to 10 scale she made up, thinking the scale makes it objective. i want the pantoum repeats to be the problem: every time a line comes back it should feel like shes recognizing the same sensation, but the poem should make it obvious that the only thing connecting the repeats is her own memory, which is exactly what she cant check. maybe the turn is when she realizes she could replace her word with any other word and nothing in her private diary or her scale would tell her shes wrong, because theres no outside rule for what counts as the same feeling. you can bring in the beetle in a box thing somewhere but dont let it take over. someone who knows the private language argument should see the moves, and someone who doesnt should still feel that something is off about naming a feeling only you can have. keep it around 5 stanzas and dont make the rhymes too neat, since the whole point is that theres no public rule keeping it in line. no citations or anything needed.
