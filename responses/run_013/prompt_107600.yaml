prompt: |-
  I am a software engineer with no formal training in philosophy, and I need to settle a design question before my team commits to an implementation.

  We are building a decision-support tool that recommends an action when our models disagree about the relevant probabilities. In practice we never have a single probability distribution to feed into an expected-value calculation. We have a handful of competing models, from different training runs or different assumptions, and no defensible way to weight them. The advice I keep receiving is to choose one distribution, or to average the candidates with a weighting nobody can justify, and then compute expected value as usual. I am uneasy about this, and the unease has a standard illustration attached to it: two urns of 100 balls each, the first with a known even split of red and black, the second with an unknown split, and a prize for drawing red. People prefer to bet on the first urn, and prefer it again when the prize is for drawing black. As I understand it, that pair of preferences cannot be represented by any single probability assignment, because the first preference pushes the subjective probability of red in the second urn below one half, the second pushes the probability of black below one half, and those two numbers must sum to one.

  Before I evaluate any candidate formalism, I want the specification: what an adequate theory of rational choice under this kind of uncertainty has to deliver. Write me the requirements list, each requirement with the case or consideration behind it, and mark which are genuine requirements and which are merely the taste of one camp. Include the distinctions the theory must not collapse, for instance between not knowing the odds and not knowing what the outcomes are.

  The cases I will judge candidates on are these:

  - The two urns above. Whatever the theory says, it has to say something principled about that pair of preferences rather than declaring it a mistake by fiat.
  - The same unknown urn, but with the black balls subdivided into two shades whose proportions are equally unknown, and a bet available on one shade. Does the verdict change merely because the description has become finer? I want to know whether insensitivity to that kind of re-description is a requirement, and whether it can be held together with the ambiguity aversion the first case seems to demand.
  - An urn described only as containing 100 balls of various colors, with no list of the colors supplied, and a prize for red. Can the theory represent this at all, or does it presuppose that the set of possible outcomes is fixed in advance?
  - An offer to look: a free peek at one ball drawn from the unknown urn, or the option to pay a small amount to sample it before betting. What must the theory say about the worth of that information, and can it be averse to ambiguity without treating costless information as worthless or even harmful?
  - A sequential version, in which the same bet is offered twice with an opportunity to revise in between, and in which a counterparty can string small bets together. What must the theory guarantee so that following its advice one step at a time cannot leave me reliably worse off than committing in advance?
  - An engineering constraint: the inputs are a finite set of competing models handed to me by an ensemble, with no distribution over them that anyone can defend. The theory has to produce a recommendation from exactly that, must not become unstable when the model outputs shift slightly, and must reduce to ordinary expected value when the models agree.

  For each requirement, give me the case that motivates it, and tell me which single requirement does the most to exclude candidates. The part I most want is the incompatibility report: which subsets of these requirements cannot be jointly satisfied, and what the cheapest way out is. If the list itself settles something, say so plainly rather than hedging.

  Close with a short pass over how the obvious formal options fare against the list: maximizing the worst case over the set of models, averaging the models with an extra layer of caution, and plain expected value with one chosen distribution. No citations, no reading list, no page numbers, no titles of papers. I cannot check them and will not use them.
reasoning: |-
  Okay, the user is a software engineer dealing with a design problem where multiple models give conflicting probabilities, and they need a rational way to make decisions without arbitrary weightings. They're referencing the two-urn paradox to highlight the issue with standard expected value approaches. 

  First, I need to unpack their core unease: they recognize that ambiguity aversion (preferring known probabilities) can't be captured by any single probability distribution. Their examples test how a theory handles uncertainty when probabilities are undefined or outcomes aren't fully specified. 

  The engineering constraints are crucial here: the solution must work with finite model outputs, be stable under small changes, and default to expected value when models agree. No defensible weighting over models means we can't just average them. 

  Looking at their test cases: the two-urn problem is the cornerstone—any theory must validate the preference for the known urn without self-contradiction. The subdivided urn case tests if the theory is sensitive to how outcomes are labeled (it shouldn't be). The unspecified colors urn probes whether the framework can handle open-world uncertainty. The free peek case checks if information can have value even under ambiguity aversion. The sequential betting scenario is about consistency—avoiding exploitability. 

  The biggest tension is between ambiguity aversion (requirement 1) and dynamic consistency (requirement 7). If you're ambiguity-averse, you might pay to avoid betting on the unknown urn now, but if offered the same bet twice with a chance to update, dynamically consistent preferences wouldn't let you be exploited. Maxmin (robust optimization) handles 1,2,3,6 but fails 4 and 7—it might see free information as worthless or harmful. Model averaging fails 1 and 2 because it forces a single probability. 

  The cheapest fix might be to use maxmin but add a stability constraint (requirement 9) to prevent overreaction to tiny model changes, though it still struggles with information value. Alternatively, embrace that some requirements conflict and choose based on which trade-offs matter most for their use case. 

  For their engineering context, maxmin is likely the most implementable—it directly uses the model set, handles disagreement, and satisfies key cases like the two-urn problem. The stability requirement can be tacked on via epsilon tolerances. But they'd have to accept that free information might not be valued "correctly" and that sequential decisions could be exploitable. 

  The unresolved pain point: no candidate cleanly satisfies all requirements. They'll need to prioritize either ambiguity aversion (choosing maxmin) or dynamic consistency (which might force weaker aversion). Given their examples emphasize the two-urn paradox, maxmin is probably the pragmatic choice.
answer: |-
  Here's a requirements list derived from your cases and constraints, prioritizing operational clarity and exposing incompatibilities. Requirements marked **[R]** are non-negotiable for capturing the core problem; others reflect desirable properties or specific applications.

  ### Core Requirements (Motivated by Your Cases)

  1.  **Ambiguity Aversion Permitted (R):** *Case: Two Urns.* The theory must allow consistent preferences where Option A (bet on red in known 50/50 urn) is strictly preferred to Option B (bet on red in unknown urn), *and simultaneously*, Option C (bet on black in known 50/50 urn) is strictly preferred to Option D (bet on black in unknown urn). *Rationale:* This is the defining phenomenon your standard expected utility (EU) fails. Declaring it irrational by fiat invalidates the core motivation. **Exclusion Power: High.** Rules out any theory requiring a single additive probability measure.

  2.  **Outcome Description Invariance (Coarsening/Refinement) (R):** *Case: Subdivided Black Balls.* The theory's recommendation for betting on a specific shade of black (in the unknown urn with subdivided blacks) must be identical to its recommendation for betting on "black" (in the original unknown urn), assuming the payoffs are equivalent relative to the descriptions. *Rationale:* Rational choice shouldn't depend *merely* on how finely we label outcomes if the underlying uncertainty and payoff structures are equivalent. Prevents arbitrary instability. **Exclusion Power: Medium-High.** Challenges theories where ambiguity aversion is tied to specific outcome partitions.

  3.  **Open-World Uncertainty Representation (R):** *Case: Unspecified Colors Urn.* The theory must be able to represent uncertainty and deliver a recommendation when the set of possible outcomes is not fully specified in advance (e.g., urn contains "various colors", no list given). *Rationale:* Real-world problems often involve unknown unknowns. Presupposing a fixed, exhaustive state space is unrealistic. **Exclusion Power: Medium.** Rules out standard probability spaces requiring predefined sigma-algebras.

  4.  **Value of Information (Non-Negative & Positive Possible) (R):** *Case: Free Peek.* The theory must assign non-negative value to costless information (e.g., free peek at one ball). Further, it must allow scenarios where such information has strictly positive value. *Rationale:* Costless information revealing true states cannot rationally make an agent worse off. Aversion to ambiguity shouldn't imply aversion to costless resolution of ambiguity. **Exclusion Power: Medium.** Challenges maxmin-type approaches under some interpretations.

  5.  **Sequential Consistency / Non-Exploitability (Desirable):** *Case: Sequential Bets & Counterparties.* When facing a sequence of related decisions (like the same bet offered twice with revision), following the theory's advice step-by-step should not leave the agent reliably worse off than if they could commit to a strategy in advance, especially against an adversarial counterparty exploiting the update rule. *Rationale:* Protects against dynamic inconsistency and being "money-pumped". **Exclusion Power: High.** Often conflicts directly with strong ambiguity aversion.

  ### Engineering Constraints (Operational Necessities)

  6.  **Finite Model Set Input (R):** Operates on a finite set of candidate probability distributions/models {P1, P2, ..., Pn} as the sole input representing the uncertainty. No prior weighting over models is required or assumed defensible. *Rationale:* Matches your actual input (ensemble outputs). **Exclusion Power: Low.** Most candidates handle this.

  7.  **Robustness / Stability (R):** Small perturbations in the candidate models' probability outputs (e.g., P_i(red) changes by epsilon) must lead to only small changes in the recommended action or its valuation. *Rationale:* Essential for practical implementation; prevents erratic behavior from numerical instability or minor model tweaks. **Exclusion Power: Medium.** Rules out overly sensitive criteria.

  8.  **Reduction to Expected Value (R):** When all candidate models agree on the probability for every relevant event (P1(A) = P2(A) = ... = Pn(A) for all A in the decision problem), the theory must recommend the action maximizing standard expected value under that single agreed probability. *Rationale:* Ensures compatibility with rational choice under risk (known probabilities). **Exclusion Power: Low.** Most candidates satisfy this.

  ### The Central Incompatibility Report

  *   **The Irreconcilable Trio:** Requirements **1 (Ambiguity Aversion)**, **5 (Sequential Consistency)**, and **4 (Strictly Positive Value of Costless Info)** are **fundamentally incompatible** in their strongest forms within a single, coherent decision theory for all possible choice scenarios.
      *   *Why:* Strong ambiguity aversion (Req 1) often requires hedging against the worst-case model. Sequential consistency (Req 5) demands that plans made in advance remain optimal when executed step-by-step, considering future updates. Costless information resolving ambiguity (Req 4) changes the worst-case scenario. Combining these leads to contradictions: hedging against the worst case initially might make you reject costless info (violating Req 4), or lead to dynamically inconsistent plans where you regret your initial hedging later (violating Req 5), making you exploitable.
  *   **Cheapest Way Out (For Engineering):** **Sacrifice strong Sequential Consistency (Req 5)**. Acknowledge that following the theory step-by-step *might* leave you exploitable in highly adversarial, multi-stage scenarios *specifically designed* to exploit ambiguity aversion. For most practical decision-support, this might be an acceptable risk compared to abandoning ambiguity aversion (Req 1) or making costless info worthless (weakening Req 4). Focus on robustness (Req 7) and stability.

  ### How Candidates Fare Against Key Requirements

  1.  **Maximize Worst-Case (Maximin Expected Utility - Wald):**
      *   *Meets:* 1 (Strongly), 2 (Usually), 3 (Possible, needs care), 6 (Yes), 7 (Often, but sensitive if min jumps), 8 (Yes).
      *   *Fails:* 4 (Assigns ZERO value to costless info *if it doesn't change the worst-case model*; can assign negative value if revealing bad news makes a *new* worst case worse than the previous worst case - violates Req 4). 5 (Prone to dynamic inconsistency/exploitability).

  2.  **Average Models + Caution (Smooth Ambiguity Aversion / alpha-MEU):**
      *   *Meets:* 1 (Weakly/Moderately, depending on parameters), 4 (Usually Yes), 5 (More likely than Maxmin), 6 (Yes), 7 (Usually Yes), 8 (Yes).
      *   *Fails:* 1 (Strictly fails the *strong* aversion in the two-urn case unless weighting is degenerate). 2 (Sensitive to partition if weights depend on outcome granularity). 3 (Hard to define average without known outcomes). Requires a weighting over models (violates "no defensible weighting" constraint).

  3.  **Choose One Distribution / Average Models (Standard EU):**
      *   *Meets:* 2 (Yes), 4 (Yes), 5 (Yes), 6 (Choose one: Yes; Average: Needs weights), 7 (Average: Yes; Choose one: Maybe), 8 (Yes).
      *   *Fails:* **1 (Catastrophically - declares the preferences irrational)**. 3 (Choose one: Hard; Average: Hard without known outcomes).

  ### Conclusion & Recommendation

  *   **The List Settles:** The two-urn preferences (Req 1) are legitimate and rule out single probability distributions or simple averaging. Open-world uncertainty (Req 3) is a distinct requirement. The core conflict is between ambiguity aversion and dynamic consistency/value of information.
  *   **Strongest Excluder:** **Requirement 1 (Ambiguity Aversion)** does the most to exclude mainstream candidates (Standard EU, Simple Averaging).
  *   **For Your Context: Maximin (Robust Optimization)** is the strongest candidate:
      *   It directly satisfies the core motivation (Req 1, Two Urns) and handles the input constraint (Req 6).
      *   It respects outcome description invariance (Req 2) with careful implementation.
      *   It reduces to EU under agreement (Req 8).
      *   Stability (Req 7) can be addressed (e.g., epsilon-contamination, using a confidence region instead of strict min).
      *   Its failures (Req 4 - Value of Info, Req 5 - Sequential Consistency) are the "cheapest" sacrifices pragmatically. You can mitigate Req 4 failure by explicitly checking if information changes the worst-case model before devaluing it. Sacrificing strong Req 5 is necessary.
  *   **Implementation:** Define the set of plausible distributions `C` from your ensemble (e.g., convex hull, epsilon-ball around models). For each action `a`, calculate its minimum expected utility over `C`: `min_{P in C} EU_P(a)`. Recommend the action `a*` that maximizes this minimum value: `a* = argmax_a [ min_{P in C} EU_P(a) ]`. Add a stability parameter (e.g., use the 5th percentile instead of strict min if models are close) to satisfy Req 7 robustly.
