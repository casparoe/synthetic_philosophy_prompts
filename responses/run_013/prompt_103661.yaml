prompt: |-
  Alright, I need a bit of satire for a philosophy blog I write for. The target is the way consequentialists — the EA-adjacent kind — keep trying to do rigorous impact accounting even though they basically can't know what their actions will cause. Format: a mock internal grant-review scoring sheet from a made-up foundation, the kind of rubric reviewers fill out, except the whole thing has quietly gone off the rails because they've taken cluelessness completely seriously. Roughly 600 words, deadpan bureaucratic voice, numbered criteria with point values.

  The jokes have to come from getting the philosophy right, so that someone who actually works on cluelessness nods along instead of wincing: the gap between not knowing the probabilities and not even knowing what the possible outcomes are; why tiny perturbations in the causal chain swamp whatever the grant actually does; why an intervention can look incredible ex ante and turn out worthless ex post; why 'just maximize expected value' stops meaning anything once the expectation is undefined or dominated by effects billions of years out. Give them a made-up metric like a 'Sign Stability Index' that nobody can really compute, and let the rubric reward flashy high-variance bets while docking the boring interventions that are actually robust to cluelessness — that inversion is the whole point. Maybe a footnote from an in-house economist who thinks the exercise is unfalsifiable. Dont strawman anyone; the absurdity should follow from the logic, not from making the reviewers dumb.
reasoning: |-
  Okay, the user wants a satirical piece for their philosophy blog targeting consequentialists, especially those in the Effective Altruism (EA) sphere. They're frustrated with how these groups attempt rigorous impact accounting despite inherent uncertainties—what's called the "cluelessness" problem in philosophy. 

  Hmm, the key challenge is balancing genuine philosophical rigor with humor. The satire must resonate with academics familiar with the cluelessness literature (like Greaves, Ord, or MacAskill), so the jokes can’t rely on misrepresentations. The user explicitly said: "Don’t strawman anyone; the absurdity should follow from the logic." That’s crucial. 

  Breaking down their requests:  
  - **Format**: A mock grant-review rubric from a fictional foundation ("Epistemic Horizons Foundation"), with deadpan bureaucratic language.  
  - **Core absurdity**: The rubric should *invert* sensible priorities—rewarding high-variance, speculative interventions while penalizing robust ones, precisely *because* the reviewers take cluelessness to its logical extreme.  
  - **Philosophical touchpoints** to weave in:  
    - Unknown unknowns (outcome spaces undefined) vs. uncertain probabilities.  
    - Chaotic sensitivity to tiny perturbations (butterfly effect overwhelming direct impact).  
    - Ex ante vs. ex post evaluation divergence.  
    - Undefined expected value due to hyper-long-term effects.  
  - **Gags**: A fake metric ("Sign Stability Index") that’s impossible to compute, and a footnote from an exasperated economist calling the exercise unfalsifiable.  

  The user’s tone suggests they’re well-versed in this debate—likely an academic or serious blogger. Their frustration feels targeted but not malicious; they want the piece to *land* with insiders. I should avoid cheap shots and focus on structural irony: a system that’s hyper-rational on the surface but collapses under its own premises.  

  For the rubric, I’ll invent categories that sound legit but spiral into nonsense:  
  1. **Direct Causal Pathway Clarity (0-15 pts)**: Dock points for *any* claimed certainty, since cluelessness means we can’t trace causality.  
  2. **Long-Term Sign Stability Index (SSI) (0-25 pts)**: The centerpiece gag. Reward proposals with wild, galaxy-brain outcomes (positive *or* negative) because "modest certainty" is penalized. The SSI is "computed" via impossible methods.  
  3. **Expected Value Robustness (0-20 pts)**: Punish interventions with defined short-term EV—since *true* EV is dominated by infinite futures.  
  4. **Chaos Resilience (0-15 pts)**: Here’s the inversion: *reward* interventions vulnerable to butterfly effects, as they "honestly embrace cluelessness."  
  5. **Ex Ante/Ex Post Asymmetry (0-25 pts)**: Favor proposals where pre/post evaluation could wildly diverge—bonus points if the intervention might *cause* the problem it solves.  

  The economist’s footnote will undercut the whole thing, muttering about "Knightian uncertainties" and "unfalsifiable metrics." That’s the mic drop.  

  Word count target is ~600. I’ll keep sentences dry and bureaucratic, letting the absurdity simmer. The title should sound like a real foundation doc—maybe "Epistemic Horizons Foundation Grant Evaluation Rubric (v.3.7)."  

  Final check: Does this make a cluelessness researcher chuckle *and* nod? If the humor stems from real philosophical tensions (e.g., "maximize EV" collapsing under undefined expectations), then yes. No strawmen—just logic pushed to self-defeating extremes.
answer: |-
  ## Epistemic Horizons Foundation Grant Evaluation Rubric (v.3.7)
  **Purpose:** To objectively quantify the expected value (EV) of proposed interventions for maximal long-term impact, prioritizing allocative efficiency under profound causal uncertainty. Scores determine funding tier (Tier 1: 85-100 pts; Tier 2: 70-84 pts; Tier 3: <70 pts).

  **Reviewer Guidance:** Prioritize interventions demonstrating rigorous engagement with the true depth of our causal ignorance. Reward ambition calibrated to the vastness of the future. Penalize false precision and myopic robustness.

  ---

  1.  **Direct Causal Pathway Clarity (0-15 pts):**
      *   **15 pts:** Proposal explicitly acknowledges the *complete absence* of a mappable causal chain between intervention and primary outcomes within the next 50 years. Outcome space is described as fundamentally undefined ("unknown unknowns" dominate). Robust citation of chaos theory/complex systems literature required.
      *   **10 pts:** Pathway is partially mapped but identifies >5 major, plausible exogenous perturbation points (e.g., butterfly effects, unforeseen technological discontinuities, geopolitical shocks) likely to invert outcome sign within the century.
      *   **5 pts:** Pathway is clear for >5 years but admits uncertainty beyond. Standard probability distributions assigned to known unknowns.
      *   **0 pts:** Proposal claims a high-confidence, stable causal pathway to intended outcomes within a decadal timeframe. Suggests dangerous epistemic hubris. *Deduct 5 pts if pathway involves direct, observable, near-term welfare gains (e.g., distributing bednets).*

  2.  **Long-Term Sign Stability Index (SSI) Calculation & Ambition (0-25 pts):**
      *   **20-25 pts:** Proposal calculates an SSI < 0.2 OR > 0.8 (see *SSI Definition & Protocol* below). Central outcome projection involves existential risk mitigation/creation, galaxy-scale engineering, or profound phylogenetic restructuring (>1,000 years out). Explicitly models dominance by effects in the 10^9+ year future light cone. EV calculation relies heavily on incomparable infinities.
      *   **10-15 pts:** SSI between 0.3-0.7. Outcomes focused on multi-century civilizational trajectories or pan-species welfare. EV incorporates significant (>50%) weightings on speculative futurology (>10,000 years).
      *   **5 pts:** SSI near 0.5, but primary outcomes are constrained to the next 100-200 years. EV dominated by tractable near/mid-term effects.
      *   **0 pts:** No SSI provided, or SSI calculation relies on stable probabilities over known outcome spaces within 100 years. Proposal focuses on preventing acute suffering or improving welfare within living generations. *Bonus 5 pts if the intervention plausibly creates a novel, unpredictable existential risk vector.*

  3.  **Expected Value Robustness to Cluelessness (0-20 pts):**
      *   **15-20 pts:** EV calculation is explicitly acknowledged as *undefined* or *infinitesimally sensitive* to initial model assumptions due to SSI volatility or unknown outcome spaces. Proposal justifies action via non-EV frameworks (e.g., virtue ethics, precautionary principle) *despite* EHF's EV mandate, demonstrating sophisticated meta-uncertainty.
      *   **10 pts:** EV is presented but with wide, asymmetric confidence intervals spanning orders of magnitude and crossing sign-flip thresholds. Major sensitivity analyses show EV sign reversal under minor, plausible perturbations.
      *   **5 pts:** EV is stable under tested sensitivity analyses within the defined outcome space. Confidence intervals are tight and do not cross zero.
      *   **0 pts:** Proposal presents a single, "most likely" EV point estimate or uses stable, well-defined probabilities. Demonstrates failure to internalize the problem of cluelessness. *Deduct 10 pts if EV is dominated by short-term (<50 yr), measurable welfare metrics.*

  4.  **Chaos Resilience (AKA: Honesty about Butterfly Effects) (0-15 pts):**
      *   **15 pts:** Proposal demonstrates that micro-level implementation details (e.g., specific vendor chosen, exact timing of rollout by +/- 3 days) could cascade through chaotic systems to completely determine the macro-level outcome sign (e.g., prevent vs. cause an existential catastrophe) within 200 years. Quantifies this sensitivity.
      *   **10 pts:** Identifies plausible macro-level perturbations (e.g., unrelated policy change, natural disaster) likely to swamp the intervention's intended effect within 100 years.
      *   **5 pts:** Acknowledges potential for external factors to diminish effect size, but core outcome directionality is assumed stable.
      *   **0 pts:** Asserts intervention effect is robust to minor environmental fluctuations or implementation variance. Suggests a naive linear causal model.

  5.  **Ex Ante / Ex Post Asymmetry Potential (0-25 pts):**
      *   **20-25 pts:** Proposal details a highly plausible mechanism whereby the intervention, while appearing net-positive ex ante (under any feasible model), could *actually* be revealed ex post (e.g., via unforeseen counterfactuals or perverse incentives) to have been net-negative or even catastrophic. Or vice-versa. Bonus if this asymmetry arises *specifically because* of the intervention's scale/novelty.
      *   **10-15 pts:** Moderate risk of significant ex ante/ex post divergence due to cluelessness, but core value proposition likely retains consistent sign.
      *   **5 pts:** Low risk of major sign-flip divergence; primary outcomes expected to be evaluable within decades with reasonable confidence.
      *   **0 pts:** Assumes ex ante assessment reliably predicts ex post reality. Proposes clear metrics for near-term evaluation of core goals. *Automatic Tier 3 if the proposal includes a feasible plan for rigorous RCT evaluation of primary long-term outcomes.*

  ---

  ### Sign Stability Index (SSI) Definition & Protocol
  *   **Purpose:** Quantify the stability of the predicted *sign* (net positive/negative) of an intervention's aggregate long-term (>200 yr) impact across plausible models of the future.
  *   **Calculation (Theoretical):** `SSI = | (P(Positive) - P(Negative)) | / (P(Positive) + P(Negative) + P(Undefinable))` where:
      *   `P(Positive)`: Aggregate credence from all models where the intervention's *net* effect is positive.
      *   `P(Negative)`: Aggregate credence from all models where the *net* effect is negative.
      *   `P(Undefinable)`: Credence assigned to models where the outcome space, counterfactuals, or aggregation metrics are fundamentally undefined or incomparable (e.g., creating/destroying potential for entirely new modes of value).
  *   **Reviewer Guidance:** Proposals must compute SSI using at least three distinct, peer-reviewed futurological models incorporating deep time (>10,000 years) and macrohistorical contingency. Models must assign non-zero probability to sign-flip events triggered by minor perturbations. **Note:** Precise calculation is acknowledged as impossible; scoring rewards the *ambition and methodology* of the attempt to grapple with radical sign uncertainty. An SSI near 0.5 indicates maximal sign uncertainty. Scores near 0 or 1 indicate (spuriously) high confidence.

  ---
  **Footnote (Dr. A. Lysander, Chief Economist):** While the rubric represents our most sophisticated operationalization of the Cluelessness Problem to date, I must note its core metrics (especially SSI & long-term EV) remain inherently *unfalsifiable*. We cannot validate predictions on relevant timescales, nor can we reliably compare the severity of divergent model outcomes spanning eons. This renders the entire scoring system potentially vacuous under strict falsificationist criteria – a profound irony given our commitment to rigor. Nevertheless, we proceed, as the alternative (inaction or reliance on crude heuristics) is deemed epistemically less virtuous. Recommend continued funding for the development of Novel Uncertainty Metrics (NUME-7 Project).^(1)

  ^(1) *NUME-7 aims to quantify the meta-uncertainty surrounding our estimates of P(Undefinable) in SSI calculations. Initial results suggest the meta-uncertainty is itself Undefinable.*
