  ## Mutual Assurance Collective of Riverford (MACOR)  
  Internal Fairness Adjustment Manual (v.4.1)  
  *"Equity Through Imagined Uncertainty"*

  1.  **Foundational Doctrine:** All contested claims adjustments, benefit allocations, premium calibrations, and dispute resolutions shall be determined exclusively through application of the Harsanyi Rational Impartial Observer Protocol (HRIOP). Fairness is defined as the outcome a Member would select if they believed themselves equally likely to occupy the social position (i.e., endowment, risk profile, and preference structure) of any current Member of the Cooperative, and acted rationally to maximize their *expected* well-being under this belief. (Ref: MACOR Charter, Art. III: "The Veil & The Calculator").

  2.  **Operationalization of Rationality:** For HRIOP computations, "rationality" requires Member preference orderings over uncertain prospects to satisfy the axioms of Expected Utility (EU) Theory. Preferences manifesting internal inconsistencies under conditions of risk (e.g., violations of Independence, non-linearity in probabilities) are deemed **computational errors** within the HRIOP framework. Affected Members must submit to Preference Rectification Counseling (PRC Form 7B) until coherence is achieved or until their preferences can be reliably approximated by an EU function for payout determination purposes. Non-rectifiable incoherence may result in provisional payout assignments based on actuarial means, pending review.

  3.  **The Paretian Imperative & The Sum:** It is an uncontestable theorem of rational choice (see Appendix A: "Selected Obvious Truths") that the only HRIOP-consistent social ordering satisfying the Weak Pareto Principle (if all Members prefer Prospect A to Prospect B, Society prefers A to B) is one representable by a weighted sum of Member utilities. The Cooperative hereby adopts **Social Welfare = Σ (Member Weight * Member Utility)** as its sole distributive metric. (Note: Concerns regarding the apparent logical leap from Pareto to additive aggregation are dismissed as semantic misunderstandings. The derivation is airtight and requires no further elaboration at the operational level.)

  4.  **Equal Probability, Equal Weight: The Engine of Equity:** The fundamental equity mechanism within HRIOP is the stipulation of **equal probability** (1/N, where N = current Membership) of becoming any specific Member. This probabilistic symmetry is the sole and sufficient justification for assigning **equal weights** (1/N) in the Social Welfare sum (Clause 3). Alternative weighting schemes (e.g., based on contribution history, perceived virtue, or loudness of complaint) violate the core symmetry principle of the Veil and are strictly prohibited. The equal probability assumption is axiomatic; its ethical justification lies in its computational convenience and logical inevitability within the model.

  5.  **Utility: Objective Interpersonal Comparability Assured:** Successful application of HRIOP and computation of the Social Welfare sum **inherently require** fully comparable, cardinal utility functions across Members. The Cooperative asserts that such comparisons are objectively meaningful and achievable through careful elicitation of preferences over suitably defined risky prospects (see Forms EU-COMP 1-12). Members expressing skepticism regarding interpersonal comparability are directed to review Appendix A ("Selected Obvious Truths") and are reminded that operational necessity overrides philosophical quibbles. Utility scales shall be normalized per Cooperative Standard NORM-UTIL-2023.

  6.  **Accommodating Altruism & Schadenfreude (Other-Regarding Preference Syndrome - ORPS):** The Cooperative recognizes that some Members may exhibit preferences where the welfare state of *other Members* directly impacts their own utility (e.g., valuing another's gain or loss intrinsically). This is **permissible**, provided preferences remain EU-coherent (Clause 2). Within HRIOP, such preferences are fully incorporated: a Member behind the Veil, considering the possibility of being the altruist *or* the beneficiary (or the subject of schadenfreude), will account for these interdependencies when maximizing expected utility. ORPS does not alter the fundamental Σ(Weight * Utility) structure; it simply makes utility functions more complex. Members exhibiting strong ORPS must file disclosure Form ORPS-D1 annually.

  7.  **Handling Outcome Interdependencies (The Externality Audit):** Where a Member's utility demonstrably depends on the *specific outcomes* of other Members (e.g., envy arising only if Member X's payout exceeds their own by 10%, unrelated to intrinsic concern for X), an Externality Audit (Form EXT-AUD) must be initiated. The Audit quantifies the dependency for inclusion within the affected Member's utility function specification during HRIOP computation. Failure to accurately declare outcome interdependencies may constitute misrepresentation under Bylaw 8.4.

  8.  **Actuarial Realization of the Veil (The Premium Schedule):** The HRIOP is not merely hypothetical. Annually, the Cooperative shall calculate the socially optimal premium structure by simulating the Veil: a rational observer, facing equal probability of assuming any Member's risk profile and preferences *under the proposed premium schedule*, will endorse the schedule maximizing their expected utility across all possible identities. This computed schedule, implementing the Σ(1/N * U_i) maximization, shall be binding for the following fiscal year. Premium notices will include the standard disclaimer: *"Your contribution reflects the collective optimal under impersonal uncertainty. Complaints imply subjective certainty of identity, a logical absurdity."*

  ---

  **Word Count:** 598

  **Satire Targets Hit:**
  1.  **EU Axioms as Compliance:** Preferences violating EU are "errors" needing "rectification," pathologizing non-EU behavior.
  2.  **Pareto-to-Sum Leap:** Dismisses the gap ("semantic misunderstandings," "Selected Obvious Truths").
  3.  **Equal Probability = Equal Weight:** Explicitly states equal probability is the *only* justification for equal weights, highlighting its arbitrariness within the model.
  4.  **Interpersonal Comparability:** Declares it "objectively meaningful" and achievable via forms, mocking the hand-waving ("operational necessity overrides philosophical quibbles").
  5.  **Accommodating Any Preferences:** ORPS and Externality Audits show the model swallows *any* coherent preferences (selfish/altruistic/envious), making social welfare a sum of *whatever* people value, however bizarre.
  6.  **Veil as Actuarial Tool:** Reduces the profound philosophical device to an annual premium calculation with a smug disclaimer.
  7.  **Tone:** The flat, bureaucratic, self-assured language ("uncontestable theorem," "logical inevitability," "computational errors") mirrors how the theorem is often presented as costless and obvious.
