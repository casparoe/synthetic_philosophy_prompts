  The key elements are producer-side vs consumer-side approaches to content determination in teleosemantics. The producer-side determines content based on what the mechanism was selected to respond to, while the consumer-side looks at what the mechanism was selected to do with the state. They want these to come apart due to differing selection pressures.

  The user has strict constraints: no sci-fi scenarios, only ordinary biology; the state must be representational on both accounts; both approaches must assign different contents; a third informational account must give yet another content; everything else held fixed except one isolable fact. The twist is that function must be fixed by learning/imitation rather than genetic selection.

  Hmm... I need an organism where learning creates a mismatch. Small organisms... maybe birds? Songbirds learn songs culturally. But alarm calls are often cited in literature - need to avoid that. Perhaps a different signaling behavior. 

  What about food signals? Like a bird species where juveniles learn foraging signals from adults. But how to create the producer-consumer mismatch? 

  Ah! Suppose the signal is produced in response to a particular food type (say worms), but due to environmental change, the consumers now use it for a different purpose (say avoiding toxic look-alikes). But the learning history differs: producers learned to signal worms, consumers learned to avoid look-alikes. 

  Yes! That fits. The isolable fact is the difference in what each generation learned: the signal's production was reinforced for worms, but its consumption was reinforced for avoiding toxic mimics. 

  Now for the third account: the actual information carried might be "edible grub-like organism present" which is distinct from both "worm" (producer) and "non-toxic grub" (consumer). 

  For the analysis: deleting the learning difference makes both sides agree. The case damages consumer-side more because it struggles with cultural transmission. I think this is a counterexample showing indeterminacy, not just illustration. The generalization is when there's asymmetric cultural drift in producer vs consumer reinforcement histories. 

  Need to ensure no stock examples and meet all constraints. Also clarify why consumer-side is more damaged - because it has to stretch to explain why cultural selection isn't "real" selection, which costs theoretical parsimony. 

  This should satisfy all the user's complex requirements while staying biologically plausible.
answer: |-
  Here is a thought experiment satisfying all specifications:

  **Background:** Consider a small songbird species where fledglings learn a specific chirp sequence ("Chirp-Chirp-Warbler" or CCW) from adult tutors during a critical period. CCW production is initially triggered by encountering a specific, highly nutritious caterpillar (Type-A). Adults consume CCW signals and respond by flying to the signaler's location to forage. Crucially, Type-A caterpillars have a toxic mimic (Type-B), identical in appearance to juveniles but distinguishable by adults via subtle chemical cues. Type-B is fatal if eaten. Juveniles cannot distinguish A from B. During the learning period in the current generation, tutors only encountered Type-A caterpillars near fledglings (due to a local population fluctuation of Type-B). Thus, fledglings learned to produce CCW *only* in response to visual detection of the caterpillar's appearance (shared by A & B). However, adults teaching the response to CCW learned *their* consumption response under conditions where both A & B were present. They were only rewarded (successful foraging) for responding to CCW when it was ultimately correlated with safe Type-A, as they could abort approach if detecting Type-B's chemical signature mid-flight. The isolable fact is: **The learning history of the producers (fledglings) involved reinforcement only for responding to the visual appearance of caterpillars (A-or-B), while the learning history of the consumers (adults) involved reinforcement only for acting (flying to forage) when the CCW ultimately correlated with the presence of safe Type-A.**

  **The Case:**
  A juvenile bird sees a Type-B caterpillar and tokens a CCW signal. Producers (juveniles) were selected by learning to produce CCW in response to caterpillar-appearance (A-or-B), so producer-side content is: **"Caterpillar-appearance present here."** Consumers (adults) were selected by learning to consume (fly towards) CCW only when doing so led to safe foraging opportunities (ultimately Type-A), so consumer-side content is: **"Safe foraging opportunity (Type-A) present here."** An informational theory (no selection history) notes that CCW is reliably caused by caterpillar-appearance (A-or-B), so its content is: **"Caterpillar-appearance (A-or-B) present here."** (Distinct from producer-side "Caterpillar-appearance" which is grounded in learning history, not current covariance, and consumer-side "Safe Type-A").

  **Learning vs. Genetics:** Neither account inherently treats cultural transmission differently. Both producer-side and consumer-side teleosemantics define function via selection history, whether the selection is genetic or behavioral/cultural (reinforcement). The theories apply the *same* logic to both. There is no principled distinction made; cultural learning is simply another mechanism generating selection history defining function.

  **Checks:**

  **(a) Delete the isolable fact:** Suppose the learning histories were symmetric: both fledglings *and* adults learned CCW production/consumption solely in environments with only Type-A present. Producer-side content becomes "Type-A present here" (learned response to A). Consumer-side content also becomes "Type-A present here" (learned response to A). The informational content remains "Caterpillar-appearance present here" (as CCW is still caused by appearance). Producer and Consumer accounts *converge* on the same content ("Type-A present here"). The case collapses into agreement between the teleosemantic accounts, though the informational account remains distinct. The specific puzzle about divergence disappears.

  **(b) Damage and Reply:** The case most damages the **consumer-side account**. The strongest reply is to argue that the *real* consumer function is fixed by the ultimate effect that reinforced the consuming mechanism *during learning*, which is successful foraging on Type-A. Therefore, the content *is* "Safe Type-A present", even if the producer mechanism learned something broader. This is accurate to the theory. However, this costs the defender **parsimony and predictive power**. It forces the content ("Safe Type-A") to be wildly inaccurate *as a representation guiding the adult consumer's immediate action*: the adult flies towards the call based *only* on the signal, long before it can detect the chemical signature confirming Type-A. The content doesn't match what the consumer uses the signal *for* in its immediate behavioral sequence. This highlights a tension within consumer-side theories between "selected *for*" (learning history) and "used *as*" (current mechanism input).

  **(c) Counterexample or Indeterminacy?** This is a **counterexample** to the claim that teleosemantics (either variant) yields fully determinate content. The divergence isn't merely theoretical underdetermination; it arises directly from applying the core principles of each account to a biologically plausible scenario. Both accounts are internally consistent and generate specific, distinct contents based on their definitions of function and selection history (here, learning history). The existence of a single state type consistently assigned two different contents by the two major strands of teleosemantics, plus a third by an alternative theory, demonstrates that the theories themselves, applied rigorously, *produce* indeterminacy relative to each other. The indeterminacy is generated *by* the theories, not prior to them.

  **(d) Generalization:** Producer-side and consumer-side selection pressures must come apart when: **The reinforcement history shaping the mechanism *producing* the state correlates the state's production with Condition X, while the reinforcement history shaping the mechanism *consuming* the state correlates the state's consumption (and subsequent action) with the successful achievement of Outcome Y, and Condition X is neither necessary nor sufficient for Outcome Y, though the two are contingently linked in the learning environment.** Further cases can be generated by varying the organism, state, Condition X, Outcome Y, and the nature of the contingent link (e.g., spatial proximity, temporal sequence, shared cause).
