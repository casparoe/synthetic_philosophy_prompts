          - We are simulating the global workspace as a social workspace, but in an individual mind, the global workspace is within one brain. The silent modules in the activity are like modules in the brain that have information that doesn't get broadcast to the whole brain.

      - What might go wrong:
          - The students might break the rule and talk about their private cards. We need to enforce strictly.
          - The task might be too easy or too hard. We need to choose a sentence that is long enough and not too obvious.
          - The memory test might not show enough forgetting. We can make the filler task more disruptive or the stimuli more complex.

      - What the activity cannot do: 
          - It cannot simulate the subjective feeling of phenomenal consciousness. We are only simulating the information processing and reportability. The feeling of "what it's like" is not captured. We have to tell them that the activity is about the functional and informational aspects, and that the hard problem remains.

