  We are going to design an activity that makes students experience the distinction between access and phenomenal consciousness, the idea of global workspace, and the overflow debate. The key pedagogical goal is to have them feel the "pinch" of the problem, particularly the sense that there might be more to experience than can be reported (the overflow), and then to challenge that intuition by showing how it might be an artifact of memory or cueing.

   The core idea: 
   - We create a "global workspace" in the form of a whiteboard at the center of the room.
   - Each student has a private card with a stimulus (e.g., a word, a simple image, a number).
   - Some students are designated as "reporters" who can write their card's content on the board. Others are "silent modules" who cannot write to the board but can see their own card.
   - Rule: broadcast-or-nothing. Only what is on the board exists for the group discussion and the final answer.

   We want to create a situation where:
    1. The group must solve a problem that requires information from multiple cards, but only the reporters can put information on the board.
    2. The silent modules have information that is necessary (or at least helpful) but cannot be broadcast because they are not reporters. This should create the feeling that there is more information present in the room (in the minds of the silent modules) than is being broadcast.
    3. Then, we disrupt that feeling by showing that the silent modules' private information is not robust and might be misremembered or reconstructed.

   Steps to achieve this:

    Phase 1: Setup and Initial Task (20 minutes)
      - Assign roles: a few reporters (say 4 out of 14) and the rest as silent modules.
      - Distribute cards. Each card has a unique stimulus (e.g., a word from a sentence, a number from a sequence, a part of a pattern). The stimuli should be such that when combined, they form a coherent whole (e.g., a sentence, a math problem, a picture description). But the task should require only a subset of the information to be solved? Or maybe it requires all, but the reporters don't have all the necessary information? We need to design the task so that the silent modules have critical information that is missing from the board.

      Example task: 
        - The group must reconstruct a sentence. The sentence is broken into words, and each student (both reporters and silent modules) gets one word. But the reporters are only a subset, so they don't have all the words. The group must write the full sentence on the board, but only reporters can write. So the silent modules must try to get the reporters to write their words? But by the rule, they cannot.

      Alternatively: 
        - The task is to answer a question that depends on the combination of all the stimuli. For instance, the stimuli are numbers, and the group must compute the sum. But the reporters have only some of the numbers. The silent modules have the others. The group can only use the numbers on the board.

      We need a task that is challenging enough to highlight the limitation.

      How about: 
        - Each card has a word. The words form a sentence that is a famous quote, but it's broken into 14 words (or 14 including some punctuation). The group's goal is to write the entire sentence on the board in the correct order.

      But: only reporters can write. So if there are 4 reporters, only 4 words can be written. The group must then try to arrange those 4 words? But that won't form the full sentence. This will create frustration.

      We want the group to feel that the full sentence is "in the room" but not on the board. Then, after the task, we test the silent modules on their own words and show that they might not remember them correctly.

    Phase 2: The Task and Frustration (20 minutes)
      - The group works to solve the problem (reconstruct the sentence) using only what is on the board. They will likely fail because they don't have enough words.

      - We allow the reporters to write their words at any time (but only once, and they can write only the word on their card). The silent modules cannot speak or write. They can only observe.

      - The rule: no talking about the content of the cards that are not on the board. The group must ignore the existence of the silent modules' cards until they are broadcast.

      - The instructor enforces the rule: if a student tries to refer to a silent module's card, they are reminded that it doesn't exist for the group.

    Phase 3: The Reveal and Memory Test (15 minutes)
      - After the group fails to reconstruct the full sentence (or they do a partial job), we stop the task.

      - We then ask each silent module to write down their word on a piece of paper (without showing it to anyone) and hand it in. Also, we ask them to write down one other word that they think was in the room (from another silent module) and one word from a reporter (which is on the board, so they can check).

      - Then, we reveal the full sentence (which we have prepared) and compare.

      - We also test the reporters: they write their word (which is already on the board, so they should get it right) and then we ask them to write down one word from a silent module and one from another reporter.

    Phase 4: The Deflation (10 minutes)
      - We collect the memory tests and show that:
          - Reporters are very accurate about their own word (it was broadcast) and about other broadcast words? But they are poor at silent module words.
          - Silent modules are accurate about their own word? But we will see that some might not be.

      - We then reveal a twist: we tell the class that we actually gave some of the silent modules a card with a word and others a card with a word and then, after a delay, we had them do a filler task (like counting backward by 3s for 30 seconds) before they wrote down their word. This filler task is done immediately after the group task and before the memory test. This is to disrupt their memory.

      - We can do this without a filler task? Or we can have a short filler task for half the silent modules? We need to show that the memory of the private stimulus is fragile.

      Alternatively, we can have two types of silent modules:
          - Group A: no filler task, they write their word immediately after the task.
          - Group B: they do a 30-second filler task (like counting backward from 100 by 7s) and then write their word.

      Then we compare the accuracy between Group A and Group B.

      This shows that the private information (which was never broadcast) is vulnerable to interference and might not be as stable as the broadcast information.

    Phase 5: Debrief (15 minutes)
      - Map the activity to the concepts:
          - The whiteboard = global workspace (access consciousness: what is broadcast and available for reporting and reasoning).
          - The private cards = phenomenal consciousness? But note: the silent modules had a stimulus that they were aware of (we assume) but it was not broadcast. This corresponds to the idea of phenomenal consciousness without access (overflow).
          - The memory test: shows that the private stimulus might be in phenomenal consciousness but without access, it is fragile and can be lost. This supports the deflationary view: what feels like rich phenomenal consciousness might be an illusion because when you try to report it later, it's gone or degraded.

      - The bind: the only way to know about the content of the private cards is by report, but at the moment of report, it requires access. So we cannot have direct evidence of unreportable experience at the time it was occurring.

      - The no-report paradigms in neuroscience: they try to avoid the need for report by using indirect measures (like neural correlates). But in our activity, we are using a report after the fact to check the private experience, which is exactly the problem. We can explain that in the real experiments, they use things like forced-choice tasks or priming, but these still involve some form of access.

