      - What the activity cannot do:

          - It cannot make students feel what it is like to have unreportable phenomenal consciousness. We are only simulating the information processing. We have to explain that the activity is a metaphor for the global workspace in the brain, but the subjective aspect is not captured.

      Final note: Be prepared to adjust timing. If the group task finishes early, move on. If the memory test takes longer, shorten the debrief and then explain the points quickly.

    Let's write the memory slip:

      Memory Slip:

      Please answer the following without discussing with others.

      Your role: [ ] Reporter   [ ] Silent module

      1. What was the number on your own card? __________
      2. What was one number that was written on the board? __________

      (Optional, if time) 
      3. How many other numbers (that were never broadcast) do you think were in the room? (from silent modules) __________

    We don't expect them to know the exact number for question 3, but we can see if they know it's around 10.

    We might skip question 3 to save time.

    We'll run the activity and then debrief.

    Let's hope it works!
answer: |-
  ### **Consciousness & Cognition Seminar Activity: The Broadcast Bottleneck**  
  **Goal:** Make students viscerally experience the access/phenomenal distinction, the global workspace "broadcast" metaphor, the overflow intuition, and its deflation.  

  ---

  ### **Core Mechanics**  
  - **Global Workspace = Whiteboard**: The only "conscious" content (accessible to the group).  
  - **Private Stimuli = Cards**: Held by students, representing "phenomenal" content (subjective, unreportable without broadcast).  
  - **Broadcast-or-Nothing Rule**: Unbroadcasted content *does not exist* for group tasks/discussion.  
  - **Key Twist**: Post-task memory test with interference to challenge the "richness" of unreportable experience.  

  **Roles & Materials**  
  - **14 Cards**: 10 "Silent Modules" (cannot broadcast), 4 "Reporters" (can write on the board).  
  - **Stimuli**: Sentences fragmented into words/phrases (e.g., "The red fox jumps over the lazy dog" → 9 words; duplicate 5 common words for ambiguity).  
  - **Whiteboard & Markers**: Central workspace.  
  - **Memory Test Slips**: Half with filler task (count backward from 100 by 3s), half without.  
  - **Timer**: For strict phases.  

  **Assign Roles**  
  - **Reporters (4)**: Randomly assigned. Can write their card’s content *once* on the board.  
  - **Silent Modules (10)**: Hold cards but *cannot speak, write, or gesture* about their content. Must keep cards visible *to themselves*.  
  - **Rule Enforcement**: Use a "Broadcast Token" (e.g., a pen). Only Reporters hold tokens; no token, no broadcast.  

  ---

  ### **Timeline (80 Minutes Total)**  
  #### **Phase 1: Setup (5 min)**  
  - **0–2 min**: Assign roles (Reporters get tokens), explain rules:  
    > "Only what’s on the board *exists* for our discussion. If it’s not broadcasted, the group *cannot* acknowledge it—no hints, no allusions."  
  - **3–5 min**: Distribute cards face-down. Students view privately. Example stimuli:  
    - Reporters: "The", "fox", "lazy", "dog"  
    - Silent Modules: "red", "jumps", "over", "the" (×2), "a", "quick", "brown", "sleeping"  

  #### **Phase 2: Group Task (20 min)**  
  - **Task**: Reconstruct the full sentence *using only the board*.  
  - **Rules**:  
    - Reporters can write their word on the board *once* (no edits).  
    - Silent Modules *cannot* communicate their word (not even via eye contact).  
    - Group must ignore unbroadcasted words (instructor intervenes: "That doesn’t exist for us!").  
  - **Process**:  
    - Reporters initiate writing. Group collaborates to order words (e.g., "The fox lazy dog" → clearly incomplete).  
    - **Pinch Point**: Students see gaps (e.g., missing "jumps"), but cannot use unbroadcasted words. Frustration builds.  

  #### **Phase 3: Memory Interference & Test (15 min)**  
  - **6–8 min**: Wipe the board. Distribute memory slips:  
    > "Write:  
    > 1. Your card’s word.  
    > 2. One word NOT on the board *but you think another student held*."  
  - **9–11 min**: **Filler Task**: Half the class (randomly selected) counts backward from 100 by 3s for 60 seconds (disrupts rehearsal).  
  - **12–15 min**: Collect slips.  

  #### **Phase 4: Reveal & Deflation (10 min)**  
  - Reveal true sentence: "The quick brown fox jumps over the lazy sleeping dog."  
  - Contrast:  
    - Board had "The", "fox", "lazy", "dog" (incomplete).  
    - Silent Modules held critical words ("quick", "brown", "jumps", etc.).  
  - **Deflation**: Share memory test results:  
    - Silent Modules with *no filler task*: High recall of *own* word (e.g., 80% accuracy).  
    - Silent Modules with *filler task*: Poor recall (e.g., 40% accuracy; confusions like "brown" → "black").  
    - **Key Insight**: "Unreportable" content degrades quickly—suggesting it’s fragile, not rich.  

  ---

  ### **Debrief (30 min)**  
  **Map Activity to Concepts**  
  1. **Global Workspace (Access Consciousness)**:  
     - "The board was our shared workspace. Only broadcasted words were *accessible* for report, reasoning, and group decisions. Like GWT: consciousness *is* global availability."  
     - *Activity Link*: Reporters’ words were the only ones used.  

  2. **Phenomenal Consciousness & Overflow**:  
     - "Silent Modules *saw* their words—this mirrors the intuition of ‘phenomenal overflow’: there’s ‘more than’ what’s accessed."  
     - *Activity Link*: The group’s incomplete sentence felt "wrong" because unbroadcasted words existed privately.  

  3. **Deflationary Challenge**:  
     - "But was that ‘more’ stable? After 60 seconds of counting, many forgot their word. The feeling of overflow might be a *memory illusion*—a fleeting trace, not enduring experience."  
     - *Activity Link*: Filler task caused high error rates. "Can we trust post-hoc reports of unreportable content?"  

  4. **No-Report Paradigms & the Bind**:  
     - "Neuroscientists use ‘no-report’ tasks (e.g., neural correlates) to avoid report biases. But in *this* room, the only evidence for unreportable content was... a *report* after the fact. Even no-report data must be *accessed* to become evidence."  
     - **The Bind**: "All evidence for consciousness requires access. We can’t prove unreportable phenomenality without reporting it—so is overflow a dead end?"  

  **Final Pedagogical Hook**  
  > "You felt the gap between what seemed present (your card) and what was accessible (the board). But when we tested it, that ‘presence’ crumbled. The debate isn’t just philosophy—it’s about whether introspection is a reliable tool. Next week: can neuroscience break this bind?"  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **Students cheat**: Silent Modules whisper words.  
     - **Fix**: Assign "Broadcast Police" (2 Reporters monitor peers; forfeit token if rule broken). Use strict timing to limit opportunities.  

  2. **Task too easy/hard**: Sentence reconstructed fast or never.  
     - **Fix**: Use ambiguous words (e.g., "bank" river/finance) or longer phrases. Have backup stimuli.  

  3. **Memory test flops**: All recall perfectly.  
     - **Fix**: Use semantically similar words (e.g., "fast"/"quick", "leap"/"jump") to induce errors. Lengthen filler task if needed.  

  4. **Debrief runs short**: Students don’t see the philosophy link.  
     - **Fix**: Pre-write debate points on index cards (e.g., "Block: Overflow Is Real"; "Cohen: Memory Artifact") to distribute during deflation phase.  

  ---

  ### **What the Activity Can’t Simulate (Requires Lecture)**  
  - **Qualitative Phenomenality**: The activity shows *cognitive* inaccessibility, not *what it’s like*. You must clarify:  
    > "This simulates *information* overflow, not the redness of red. The ‘hard problem’ remains untouched—why does any of this feel like anything?"  
  - **Neural Implementation**: GWT’s brain basis (e.g., prefrontal cortex as "broadcast hub") needs brief explanation post-activity.  

  ---

  ### **Why This Works**  
  - **Embodied Pinch**: Students *feel* the frustration of inaccessible content, then see it crumble under scrutiny.  
  - **Mechanical Enforcement**: Tokens/filler task make rules concrete, not abstract.  
  - **Dual Reveal**: Overflow intuition (during task) + deflation (memory test) mirrors real debates.  
  - **Essay Prep**: Students leave with a concrete scaffold: "We did X, which maps to Block’s overflow; then Y, which supports Dennett’s critique."  

  Run this tight, and those essays will finally move beyond "access = report, phenomenal = feels." Good luck!
