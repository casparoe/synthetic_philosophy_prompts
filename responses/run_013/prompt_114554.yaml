  **Final Timeline:**

  - **0:00-0:10:** Introduction and build Model A (4x4 grid with connections and assign numbers to tokens). Record in ledger.
  - **0:10-0:25:** Answer commitment questions in the ledger and publicly declare.
  - **0:25-0:30:** Exchange ledgers between groups.
  - **0:30-0:50:** Each group builds Model A from the received ledger. Then they choose a hole (a 2x2 region) and a permutation of the 4 tokens in the hole. They compute and build Model B by reassigning the numbers in the hole (leave connections and tokens in place). 
  - **0:50-1:00:** Each group judges whether Model B is the same world as Model A, according to the criterion in the ledger. They must rule and justify. The facilitator challenges them. They use counters for contradictions to the ledger.
  - **1:00-1:20:** Debrief: map to the hole argument, explain the horns of the dilemma, and discuss resolutions.

  **Commitment Questions (in the ledger):**
  1. If two constructions have the same tokens, the same connections, and the same number assigned to each token, do they represent the same world? (Yes)
  2. If two constructions have the same tokens and the same connections, but different numbers assigned to at least one token, do they represent different worlds? (Yes)
  3. Is there a fact of the matter about which token is which, even though they look identical? (Yes)

  Then later, when they see Model B, which has the same tokens and connections but different numbers in the hole, by Q2 they should say it is a different world. But note: Model B is isomorphic to Model A by the permutation φ. So if they believe that isomorphic models represent the same world, then they should say same. But they haven't been asked about isomorphic models. So we need to add:

  4. If two constructions have the same pattern of connections and the same multiset of numbers, but assigned to different tokens, are they necessarily the same world? (No, because the assignment to tokens matters.)

  Then when they see Model B, it has the same multiset of numbers (because we permuted them within the hole) but assigned to different tokens. And the connections are the same. So by their commitment, they should say different.

  But then the facilitator can point out that if we were to relabel the tokens by the permutation φ, then Model B would become identical to Model A. So they are isomorphic.

  In the debrief, we explain that in the continuous case, the diffeomorphism is the relabeling.

  This should work.
answer: |-
  Below is a detailed session plan for a 90-minute activity designed to lead participants into the hole argument through experiential learning. The plan adheres to your specifications: a physical toy world built by participants, explicit commitments to haecceitism, a trap forcing a choice with no costless exits, and a structured debrief mapping the activity to the philosophical argument. I have used British English throughout and included predictions for pitfalls and limitations.

  ### **Session Overview**
  - **Goal**: Participants construct a toy world, commit to a haecceitist criterion of identity, then confront an analogue of the hole argument that forces a choice between indeterminism and abandoning substantivalism.
  - **Format**: Three small groups (4 participants each), working in parallel. Materials are simple and cheap.
  - **Core Mechanism**: Groups build a discrete spacetime analogue (tokens + relations), record commitments in a ledger, then face a region-specific rearrangement that tests their criterion. Counters enforce accountability.
  - **Output**: Participants manufacture the problem themselves, leading to an "aha!" moment in the debrief.

  ---

  ### **Materials Needed (Per Group)**
  1. **Physical modelling kit**:
     - 16 identical tokens (e.g., plain wooden cubes, 1cm³; all visually indistinguishable).
     - 24 short pieces of string (approx. 10cm each; represent spatial relations).
     - A 30cm × 30cm cardboard base (pre-printed with a faint 4×4 grid to guide placement; grid lines are not part of the "world").
  2. **Ledger**: A bound notebook with pre-printed sections:
     - *World Construction*: Blank pages for diagrams and lists.
     - *Commitment Questions*: Yes/No questions with signature lines (detailed below).
     - *Ruling Section*: For recording judgements during the trap.
  3. **Counters**: 10 poker chips (or similar) to enforce consistency.
  4. **Shared timer** visible to all.

  ---

  ### **Timeline (90 Minutes Total)**

  #### **0:00–0:15 (15 min): Build the Toy World**  
  - **Facilitator Instruction**:  
    "In your groups, construct a 'world' on your base. Use the tokens as fundamental objects—treat them as numerically distinct individuals, even though they look identical. Connect tokens with strings to represent spatial relations. Your world must be a lattice: each token connected to its neighbours (up/down/left/right), forming a 4×4 grid. Once built, document everything in your ledger: draw the grid, label tokens (e.g., T1 to T16), and list all connections (e.g., 'T1–T2', 'T1–T5'). No two groups should have identical connections—be creative within the lattice rule."  
  - **Why**: Participants create a Leibnizian-style relational spacetime. The stipulation of numerical distinctness primes haecceitism. The grid’s discreteness simplifies the later rearrangement.  
  - **Facilitator Role**: Circulate to ensure (1) tokens are treated as distinct individuals, (2) connections match the lattice, and (3) ledgers are detailed. Example: "Which token is T1? Point to it. If I moved T1, would it still be T1?"

  #### **0:15–0:30 (15 min): Commit Publicly to the Criterion of Identity**  
  - **Facilitator Instruction**:  
    "Now, agree as a group on what makes two constructions describe the *same world*. Answer these questions in your ledger. Sign to confirm your consensus. I’ll record your answers publicly."  
    Ledger questions:  
    1. *"If two constructions have identical tokens and identical connections, do they represent the same world?"* (Expect: Yes)  
    2. *"If a token is moved but all connections remain identical, is it the same world?"* (Expect: No)  
    3. *"Is there a fact of the matter about which token is which? (e.g., Could T1 in your world be uniquely identified, even if moved?)"* (Expect: Yes)  
    4. *"Suppose you observe a region of the world (e.g., four tokens) at two different times. If connections and token identities match perfectly, must it be the same state of affairs?"* (Expect: Yes)  
  - **Public Recording**: Write each group’s answers on a whiteboard. Highlight any "No" to Q2 or "Yes" to Q3 as they arise—this embeds haecceitism.  
  - **Why**: Questions 2–3 force commitment to token-level haecceitism; Q4 sets up determinism. The ledger now contains observable claims (e.g., "T1 is at position (1,1)") that assume distinct identities.  
  - **Facilitator Role**: Press for clarity: "So, if I secretly swapped two tokens, would your ledger be wrong? Even if no one noticed?"

  #### **0:30–0:35 (5 min): Exchange Ledgers**  
  - Groups swap ledgers with another group. Each now has a rival’s world and commitments.

  #### **0:35–0:55 (20 min): The Trap—Rearrangement and Forced Choice**  
  - **Facilitator Instruction**:  
    "Using the ledger you inherited, rebuild the world *exactly* as described (Model A). Then, choose a 'hole'—a simply connected region of four central tokens (e.g., tokens T6,T7,T10,T11). Rearrange *only* the tokens in the hole: swap them (e.g., T6↔T7, T10↔T11) but preserve all connections. This creates Model B. Document Model B in the ledger. Now, rule: Is Model B the *same world* as Model A? Use the original group’s criterion. You must justify your ruling with explicit reference to the ledger, under penalty of forfeiting counters for contradictions."  
  - **Why**: The hole is small and central to ensure connections outside it remain unchanged (emulating a diffeomorphism that is identity outside the hole). Rivals select rearrangements to exploit commitments.  
  - **Facilitator Role**: Enforce rules strictly:  
    - Tokens outside the hole cannot move; connections must be preserved.  
    - Groups lose one counter per ledger contradiction (e.g., ignoring Q2).  
    - Probe publicly during rulings: "Point to where the ledger settles this."

  #### **0:55–1:10 (15 min): The Forced Choice—Confronting the Horns**  
  - **Ruling Process**:  
    Each group announces its ruling ("same" or "different") and justifies it using the ledger. The facilitator then forces a choice:  
    - **If "same world"**:  
      "Your ledger says token identities matter (Q3). If the worlds are the same despite token swaps, you must strike out Q3. Why is numerical distinctness irrelevant?"  
      *Pain point*: Abandoning haecceitism invalidates ledger claims (e.g., "T1 was handled earlier").  
    - **If "different world"**:  
      "The state outside the hole was complete (Q4). What fact about the outside *failed* to determine the hole’s state? Name it or forfeit a counter."  
      *Pain point*: No observable fact was missing—indeterminism arises despite identical data.  
  - **Key Challenge**:  
    "Could a difference that *no possible observation* could detect still be a real difference? Is that the same as your ruling? Explain."  
    (This separates empirical equivalence from metaphysical difference.)  
  - **Why**: The choice pits haecceitism (leading to indeterminism) against anti-haecceitism (requiring ledger revisions). Counters make contradictions costly.

  #### **1:10–1:30 (20 min): Debrief—Mapping to the Hole Argument**  
  - **Facilitator Script**:  
    "Today’s activity was an analogue of the hole argument in spacetime physics. Let’s map your experience:  
    - **Your world**: Tokens represent spacetime points; strings represent fixed topological relations.  
    - **The rearrangement**: Analogous to a diffeomorphism that shifts points within a hole but is identity outside.  
    - **Your ledger commitments**: Q2–Q3 commit to *substantivalism* (points exist independently) and *haecceitism* (points have primitive identities).  
    - **The trap**: Your two models (A and B) represent mathematically distinct spacetimes with identical observable structures.  
    - **Your ruling**:  
      - Saying 'same world' implies **Leibniz equivalence** (diffeomorphic models describe the same physical reality).  
      - Saying 'different world' implies **substantivalism + haecceitism**, but forces **indeterminism**: complete data outside the hole fail to fix the hole’s state.  
    - **Indeterminism vs. underdetermination**: This isn’t mere underdetermination (multiple futures fitting the data). It’s indeterminism because the hole’s state is *unfixed by the entire past*—a threat to predictability in physics.  
    - **Resolutions**:  
      - To retain substantivalism *without* indeterminism, reject haecceitism: treat points as distinct only if they differ qualitatively (e.g., via metric properties). This requires accepting that diffeomorphic models are physically equivalent.  
      - Alternatively, embrace relationism: discard points as fundamental; only relations (e.g., the metric) are real.  
    - **What you gave up**: In the activity, groups struck out Q3 or admitted indeterminism. In physics, giving up haecceitism avoids the hole argument’s threat."  
  - **No names/texts**: Avoid citing Earman, Norton, or Einstein. Example phrasing: "One response in the literature is to..."

  ---

  ### **Predictable Pitfalls and Mitigations**  
  1. **Escape Route 1: "We can distinguish tokens by their history"**  
     - **Problem**: Participants may claim tokens can be tracked via ledger records (e.g., "T1 was touched first"), violating the "no distinguishing features" stipulation.  
     - **Mitigation**: Pre-empt this during construction: "Tokens have no intrinsic properties—your ledger claims are metaphysical, not empirical." Enforce via counters if ledger appeals to history.  

  2. **Escape Route 2: "The rearrangement changes connections"**  
     - **Problem**: Groups may "accidentally" alter connections during the swap, invalidating the trap.  
     - **Mitigation**: Use the pre-printed grid to fix positions. Require groups to photograph Model A. If connections change, force a rebuild with counter forfeits.  

  3. **Escape Route 3: "The hole isn't isolated"**  
     - **Problem**: Participants may argue the hole’s state affects outside relations (e.g., "T5 connects to T6, so swapping T6 changes T5’s relations").  
     - **Mitigation**: Use a 4×4 grid; the central four tokens connect only to each other and the perimeter. Swaps preserve relations if perimeter tokens stay fixed. Pre-test the grid topology.  

  4. **Timing Collapse: Delays in rebuilding models**  
     - **Risk**: Groups take >15 minutes to rebuild Model A from a rival’s ledger.  
     - **Mitigation**: Provide tokens pre-labelled T1–T16. During construction, require groups to list connections unambiguously (e.g., "T1: connected to T2, T5").  

  5. **Objection: "This feels like cheating!"**  
     - **Context**: When forced to choose, groups may protest that the trap is artificial.  
     - **Response**: "The 'cheat' is in your ledger. You committed to distinct identities *and* determinism. Physics faces the same dilemma with spacetime points."  

  ---

  ### **What the Toy Cannot Replicate**  
  - **Discreteness vs. Continuity**: The grid’s discreteness flatters the "different world" horn. In continuous spacetime, the absence of a fixed metric before the diffeomorphism is more intuitive. *State this explicitly*: "In GR, manifolds lack an intrinsic metric—our toy’s connections are fixed to simplify the analogue."  
  - **Dynamics**: The toy lacks equations of motion (e.g., Einstein’s field equations). *State*: "Indeterminism arises in GR because the hole’s metric isn’t fixed by initial data."  
  - **Underdetermination to Indeterminism**: The toy’s indeterminism is obvious; in GR, it arises from general covariance. *State*: "The hole argument shows indeterminism is unavoidable if you accept substantivalism—it’s not merely underdetermination."  

  ---

  ### **Final Notes**  
  - **Session Flow**: The timeline is tight; prioritise enforcing rules over perfect completion. Groups may not resolve the forced choice—use their tension in the debrief.  
  - **Outcome**: Participants will experience the hole argument as a manufactured paradox, making the philosophical stakes visceral. The debrief links this to GR’s core issues without requiring texts.  
  - **Your Role**: Be strictly neutral until the debrief. Use Socratic questioning to expose contradictions ("What in your ledger justifies that?").  

  This design meets your requirements: haecceitism is embedded via public commitments, the trap uses physical rearrangement, and the debrief maps cleanly to GR while avoiding namedropping. Run it as a workshop, not a lecture, and the "aha!" moment will resonate.
