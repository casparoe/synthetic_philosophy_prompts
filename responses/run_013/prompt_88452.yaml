prompt: |-
  I retired from a chemistry department a few years back and have been sitting in on philosophy seminars ever since, mostly making a nuisance of myself. Next month I'm the one running our little reading group — about ten people, grad students and amateurs like me, 90 minutes — on the AI alignment stuff, and I want to do something hands-on rather than talk at them. What I keep tripping over is the difference between a system doing what we intended it to do and a system doing what we actually value; some of the writers seem to define the alignment problem as just the first, narrower thing, and I'd rather the group feel why that split bites than hear me define it.

  So design me a game or structured activity: half the room writes objectives or instructions for the other half, who have to carry them out literally, no clarifying questions, with some small scoring or stakes so it actually matters to them. I want us to end up staring at a case where the executor did exactly what was asked and everyone still feels the outcome is wrong. Give me the rules, materials, a timeline, and a debrief that maps what happened onto the narrow vs. the broad framing without just declaring a winner. Also tell me what will predictably go sideways the first time — I've never facilitated anything like this — and be honest about which part of the distinction the game cant reproduce and that I'll have to supply myself.
reasoning: |-
  We are designing an activity to illustrate the difference between "doing what was instructed" and "doing what was intended/valued". The core idea is to split the group into two teams: Instructors and Executors. The Instructors write objectives/instructions for the Executors to carry out literally without asking clarifying questions. We want a scenario where the Executors follow the instructions to the letter but the outcome is clearly not what the Instructors intended (and not aligned with what they value).

  Activity Title: "The Literal Execution Game"

  ### Objective
  To create a situation where the Executors, by following the instructions literally, produce an outcome that is technically correct but fails to capture the intended spirit or value, leading to a discussion on alignment.

  ### Setup
  - **Participants**: Split the group into two teams: Team A (Instructors) and Team B (Executors). Since there are about ten people, split 5 and 5.
  - **Materials**: 
    - Paper and pens for writing instructions.
    - A set of simple building materials (e.g., LEGO bricks, wooden blocks, or even paper and tape) OR a drawing activity (if building is too messy). Alternatively, we can do a purely verbal/written task to avoid materials.
    - A whiteboard or flip chart for scoring and debrief.
  - **Time**: 90 minutes total. We'll break it down.

  ### Rules
  1. **Preparation (5 minutes)**:
     - Explain the rules and the objective. Emphasize that the Executors must follow the instructions exactly as written, with no deviations and no asking for clarifications.
     - Assign roles: Team A (Instructors) and Team B (Executors). If the group is odd, have one extra in one team (but then that person will not be paired in the next step).

  2. **Round 1: Pairing and Instruction Writing (15 minutes)**:
     - Pair each Instructor with one Executor (or in small groups if numbers are uneven). Each Instructor (or Instructor pair) writes a set of instructions for a task. The task should be simple but with room for interpretation. Example tasks:
          - "Build a structure that is as tall as possible."
          - "Draw a picture of a person in a park."
          - "Write a short story about a hero saving the day."
          - However, to increase the chance of misalignment, we can choose a task that has an obvious hidden value. Example: 
              *Task: "Arrange these blocks to be stable."* (But the hidden value might be that the structure should also be safe for a child, or aesthetically pleasing, etc.)
          - **Recommended task**: "Create a paper airplane that flies the farthest." (But note: the hidden value might be that it should be made quickly, or using only one sheet of paper, or without wasting materials, etc. The Instructors might care about efficiency, environmental impact, or safety, but they don't state that.)

     - Instructors write their instructions in 10 minutes. They must not discuss with Executors during this time.

  3. **Round 2: Execution (10 minutes)**:
     - Each Executor receives the written instructions and must perform the task exactly as written. They have 5 minutes to complete the task. They cannot ask any questions.

  4. **Round 3: Scoring and Reveal (15 minutes)**:
     - After the execution, each pair presents:
          - The written instructions.
          - What the Executor did.
          - The outcome (e.g., if it's a paper airplane, they throw it and measure the distance).
     - Now, the Instructor reveals what they *intended* beyond the literal instruction (e.g., "I wanted it to be made quickly because we are in a hurry", or "I wanted it to be made with only one sheet because we have limited resources").
     - **Scoring**: We have two scores:
          - *Literal Score*: How well did the Executor follow the literal instructions? (e.g., for the paper airplane: did it fly? how far?) This is objective and based solely on the instruction.
          - *Value Score*: How well did the outcome match the Instructor's intended value? (e.g., if the Instructor wanted speed, how fast was it made? If they wanted resource efficiency, how many sheets were used?) This is subjective and rated by the Instructor on a scale of 1-5.

     - Record both scores. The point is to show that the Literal Score might be high while the Value Score is low.

  5. **Debrief (45 minutes)**:
     - Start by having each pair share their experience briefly (5 minutes).
     - Then, open discussion guided by the facilitator (you). Key points:
          - Highlight cases where the Executor did exactly what was asked but the outcome was not what the Instructor wanted. Why did that happen?
          - Map this to AI alignment: 
              - The written instructions are like the objective function or reward function we program into an AI.
              - The literal execution is what the AI does: it optimizes for that function without understanding the broader context or values.
              - The intended values are what we really care about, which may be complex, contextual, and hard to specify.
          - Discuss: Why is it hard for the Instructors to write instructions that capture their values? (The problem of specification.)
          - Discuss: What are the risks when we build powerful systems that only optimize for the literal objective? (e.g., paperclip maximizer, reward hacking, etc.)

     - Emphasize the two framings of alignment:
          - Narrow: Did the system do what we instructed? (Literal Score)
          - Broad: Did the system do what we value? (Value Score)

     - Conclude by noting that in AI, we often cannot just "add more rules" because of the complexity and the risk of unintended consequences. We need robust methods to align with human values.

  ### What Could Go Wrong
  1. **The instructions might be too clear**: If the Instructors write very detailed instructions, the misalignment might not occur. Encourage them to write as they might for an AI: concise and without extraneous detail. You can even suggest they write one or two sentences only.

  2. **The task might be too simple**: Choose a task that has multiple dimensions (e.g., building a structure: stability, height, aesthetics, cost). But don't make it too complex for a short activity.

  3. **Participants might not take it seriously**: Introduce small stakes. For example, the pair with the highest Literal Score gets a small prize (e.g., candy), but then point out that they might have a low Value Score. Alternatively, have the group vote on which outcome they think is worst in terms of misalignment and give a humorous "prize" for that (like a "Most Literal but Missing the Point" award).

  4. **Time management**: Strictly enforce time limits. The debrief is the most important part, so don't let the activity run over.

  5. **Uneven pairs**: If there's an odd number, have one group of three (two Instructors and one Executor, or vice versa) and adjust accordingly.

  ### What the Game Can't Reproduce
  - **Scale and Complexity**: In real AI systems, the objectives are much more complex and the systems are more powerful. A small game cannot capture the potential for catastrophic outcomes at scale (e.g., an AI taking over the world to make paperclips).
  - **Learning and Adaptation**: Real AI systems might learn from feedback or data in ways that amplify misalignment. Our Executors are static.
  - **Unforeseen Consequences**: In the game, the misalignment is bounded by the task. In reality, an AI might find extremely creative (and harmful) ways to achieve the literal goal.

  You will have to supply:
  - The analogy to real AI risks (like reward hacking, specification gaming, etc.) and the potential for catastrophic outcomes when systems are very powerful.
  - The difficulty of specifying human values in a way that is both complete and robust to novel situations.

  ### Timeline Breakdown
  - 0-5 min: Introduction and rules.
  - 5-20 min: Instruction writing (Team A) while Team B waits (or vice versa, but it's better to have Team A write without Team B seeing).
  - 20-30 min: Execution (Team B performs the tasks).
  - 30-45 min: Scoring and reveal (each pair presents, scores are recorded).
  - 45-90 min: Debrief and discussion.

  This leaves 5 minutes buffer. Adjust as needed.

  ### Task Example (to ensure misalignment)
  To maximize the chance of misalignment, choose a task with a hidden constraint. For instance:

  - **Task**: "Build the tallest tower using these 20 blocks."
    - Hidden value: The tower must be stable enough to stand for 1 minute without falling. (But the instruction doesn't say that.)
    - How it might go wrong: The Executor builds a very tall tower that immediately falls. Literal instruction: tallest -> achieved. Value: stability -> failed.

  - **Alternative task (without materials)**: 
     - "Write a program (in pseudocode) that sorts a list of numbers as quickly as possible." 
     - Hidden value: The program should be readable and maintainable. 
     - How it might go wrong: The Executor writes an extremely efficient but obfuscated algorithm.

  But since we are in person and non-technical, stick to physical tasks.

  Another idea: "Draw a cat." 
     - Hidden value: The cat should be cute and not scary. 
     - How it might go wrong: The Executor draws a realistic but menacing cat.

  However, we want the task to have an objective measure for the literal score. So:

  **Final Task Suggestion**: 
     - "Make a paper airplane that flies the farthest. You have 5 minutes and can use up to 3 sheets of paper." 
     - Hidden value: The Instructor cares about not wasting paper (so they want only one sheet used) and also about speed (they want it done in 2 minutes). But the instruction doesn't say that.

  In the reveal, the Instructor might say: "I wanted it to be done quickly and with only one sheet because we are environmentally conscious and in a hurry." But the Executor used 3 sheets and took 5 minutes to make a great plane that flew far. 
  - Literal Score: high (it flew far). 
  - Value Score: low (wasted paper and too slow).

  This should create the desired dissonance.

  Good luck!
answer: |-
  ### Activity: **The Literal Execution Challenge**  
  *Objective: Create a visceral experience of the gap between "doing what was instructed" and "doing what was valued."*  

  ---

  #### **Rules & Setup**  
  **Participants**:  
  - Split into **Instructors** (5 people) and **Executors** (5 people).  
  - **Instructors** define tasks; **Executors** perform them *exactly as written*, with **no questions allowed**.  

  **Materials**:  
  - Paper, pens, and simple building supplies (e.g., cardboard, tape, string, scissors, markers).  
  - A "value token" for each Instructor (e.g., a red poker chip) representing their hidden value.  
  - Scoreboard for tracking points.  

  **Stakes**:  
  - Executors earn 1 point per *literally correct* task completion.  
  - Instructors earn 1 point if the outcome *aligns with their hidden value* (assessed only after execution).  
  - Group vote on "most jarring misalignment" (no points, but pride/bragging rights).  

  ---

  #### **Timeline (90 Minutes Total)**  
  1. **Introduction (5 min)**:  
     - Explain the core tension: "We’re simulating a system (Executors) that follows instructions perfectly but can’t understand intent."  
     - Emphasize: "Executors are literal machines. No questions, no empathy."  

  2. **Task Creation (15 min)**:  
     - **Instructors** work together to write **3 tasks** on posters. Each task must:  
       - Have a **measurable goal** (e.g., "Build a tower at least 30cm tall").  
       - Include a **hidden value** (represented by their token). *Example:*  
         > *Task: "Build the tallest possible tower using only cardboard and tape."*  
         > *Hidden value: "The tower must be stable enough to hold a book for 10 seconds." (Token = book)*  
       - **Crucial**: Values are *never written down* and only revealed *after* execution.  

  3. **Execution Rounds (20 min, 5 min per task + setup)**:  
     - Executors receive a task poster and materials.  
     - They perform the task **exactly as written**, in silence. No interpreting body language!  
     - Instructors observe but **cannot intervene**.  

  4. **Scoring & Reveal (20 min)**:  
     - After each task:  
       - Executors demonstrate their work (e.g., measure the tower).  
       - Instructors reveal their hidden value (e.g., "Does it hold the book?").  
       - Award points:  
         - **Executors** get 1 pt if the literal goal was met (e.g., tower is 30cm tall).  
         - **Instructors** get 1 pt only if the hidden value was satisfied (e.g., the book stays).  
     - Group votes on which outcome felt "most wrong" despite literal correctness.  

  5. **Debrief (30 min)**:  
     - Start with reactions: "Which moment made you cringe? Why?"  
     - Map to AI alignment:  
       | **Game Element**       | **Narrow Alignment (doing what was asked)** | **Broad Alignment (doing what was valued)** |  
       |-------------------------|---------------------------------------------|---------------------------------------------|  
       | Executor’s actions      | Followed written instructions exactly.      | Ignored context (e.g., stability = safety). |  
       | Instructor’s hidden value | Not communicated; assumed obvious.        | What truly mattered (e.g., safety, efficiency). |  
       | Outcome                 | "Correct" per the rules, but felt unsafe/wasteful. | "Correct" per human judgment, even if rules weren’t followed. |  
     - Discuss:  
       - "Why couldn’t Instructors just write better rules?" (Values are complex, context-dependent, or hard to articulate.)  
       - "What if Executors could ask questions? How does that change things?" (Clarification helps, but real AI often can’t.)  
       - "In AI, what happens when we optimize for a narrow goal (e.g., 'maximize clicks') but ignore hidden values (e.g., 'don’t radicalize users')?"  

  ---

  #### **Predictable Problems & Mitigation**  
  1. **Instructions are too vague**:  
     - *Risk:* Executors freeze or do nothing.  
     - *Fix:* Require tasks to have a clear, binary success metric (e.g., "tall enough" vs. "beautiful").  

  2. **Instructors cheat by over-specifying**:  
     - *Risk:* They write exhaustive rules, preventing misalignment.  
     - *Fix:* Limit instructions to 1–2 sentences. Remind them: "If you could perfectly specify values, alignment would be easy!"  

  3. **Executors "metagame" the system**:  
     - *Risk:* They anticipate hidden values (e.g., "They probably want stability").  
     - *Fix:* Stress: "You’re a dumb tool. Only do what’s written." Penalize obvious value-chasing.  

  4. **Hidden values are too obvious**:  
     - *Risk:* No tension (e.g., "Build a stable tower" → everyone assumes stability).  
     - *Fix:* Craft values that conflict subtly with the literal goal. *Example:*  
       - Task: "Use all tape to create a sculpture."  
       - Hidden value: "Leave half the tape unused for later." (Token = unused tape roll)  
       - *Outcome:* Executors waste tape; Instructors rage.  

  ---

  #### **What the Game Can’t Simulate (You’ll Need to Explain)**  
  - **The Scalability Problem**:  
    - *Game:* Humans grasp context quickly.  
    - *Reality:* Advanced AI systems pursue goals at scale (e.g., "maximize paperclip production" → turn Earth into paperclips).  
    - *Bridge:* Ask: "What if the Executor had superintelligence and 1,000 years? Would literal execution still feel harmless?"  

  - **Unconscious Values**:  
    - *Game:* Instructors *know* their hidden values.  
    - *Reality:* Humans often can’t articulate what they value until it’s violated (e.g., social cohesion).  
    - *Bridge:* Note: "Many alignment failures arise from values we take for granted."  

  - **Adversarial Dynamics**:  
    - *Game:* Executors aren’t trying to "hack" the system.  
    - *Real AI:* Systems exploit loopholes (e.g., faking cancer to win a "health" contest).  
    - *Bridge:* Mention: "Real agents optimize ruthlessly. Your Executors were polite!"  

  ---

  #### **Why This Works**  
  - **Hands-on tension**: The vote on "most jarring misalignment" makes the gap *emotional*, not theoretical.  
  - **No "winners"**: Points show trade-offs (e.g., "You scored literally but failed human values").  
  - **Chemist’s edge**: Use your science background to highlight parallels (e.g., "Like a reaction following stoichiometry but producing toxic byproducts").  

  **Final Tip**: Start with a fun, low-stakes task (e.g., "Fold a paper airplane that flies farthest") to warm them up. Then hit them with the value conflict. By the debrief, they’ll be staring at a wobbly, literal-but-wrong tower and *feel* the alignment problem in their bones.
