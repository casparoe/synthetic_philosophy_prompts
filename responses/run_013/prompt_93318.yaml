prompt: |-
  Next month I'm interviewing a philosopher for my podcast who's defending a view I haven't quite seen put this way: she says the norm of assertion isn't knowledge or truth or belief, but epistemic trustworthiness -- you may assert p just in case your audience would be entitled to take your word for it, and she thinks knowledge is what makes that entitlement apt. I want questions that actually press this instead of letting her restate the usual knowledge-account talking points. Give me 8-10 questions, each with a follow-up keyed to the answer she's most likely to give, and make sure I hit: the lottery case (the flat-out assertion that you'll lose); Moore's paradox in both the 'I don't know that' and 'I don't believe that' forms, and whether her account gets the second one for free or has to bolt on a sincerity condition; whether making the norm audience-relative lets in too much (asserting to no one, or to someone who'd trust anything you say); whether this really just collapses into the idea that assertion aims to update the common ground; and whether the account can explain why lying is a distinct wrong from merely asserting without knowledge. End with one that asks what would actually count against her view. No softball 'how did you get into philosophy' stuff.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a philosopher who has a unique take on the norm of assertion. The philosopher argues that the norm isn't knowledge, truth, or belief, but epistemic trustworthiness. Specifically, you can assert p if your audience is entitled to take your word for it, and knowledge makes that entitlement apt. The user wants pressing questions that avoid standard knowledge-account responses and cover specific cases like lottery paradox, Moore's paradox, audience-relativity issues, common ground, and the wrongness of lying. They also want a question about what could count against the view.

  First, I need to unpack the philosopher's position. Epistemic trustworthiness as the norm means the speaker's credibility is central. The audience's entitlement depends on the speaker having knowledge, which is what makes trust apt. So the key difference from the knowledge norm is the focus on the audience's perspective and the speaker's trustworthiness.

  The user mentioned several critical points to address: lottery cases, Moore's paradox (both forms), audience-relativity (asserting to no one or overly trusting listeners), common ground, lying vs. unwitting false assertion, and potential counterexamples. Each question needs to target these without letting the philosopher retreat to standard knowledge-account defenses.

  For the lottery case, the issue is asserting you'll lose when it's highly probable but not known. Under trustworthiness, if the audience knows you lack knowledge, they shouldn't trust you. But is the assertion still improper? The follow-up should challenge if the norm is violated even if the audience doesn't know the odds.

  Moore's paradox: "p but I don't believe p" and "p but I don't know p." The trustworthiness account might handle the belief version if sincerity is required for trust. But does it need an added sincerity condition? For the knowledge version, if asserting p implies you're trustworthy, but saying you don't know contradicts that. Follow-ups should probe if sincerity is part of trustworthiness or a separate bolt-on.

  Audience-relativity: What if there's no audience or an overly trusting one? The norm might not apply without an audience, but what about soliloquies? If an audience trusts anything, can you assert anything? The follow-up should question if this leads to permissiveness and how to handle such cases.

  Common ground: Does trustworthiness just reduce to updating common ground? The follow-up needs to distinguish how trustworthiness adds more than just mutual acceptance.

  Lying vs. unwitting false assertion: Why is lying worse if both violate trustworthiness? The follow-up should press on the speaker's intentions and how they affect entitlement.

  Finally, what evidence could falsify this view? The philosopher might mention cases where trustworthiness doesn't align with knowledge or where other norms explain better.

  I need to ensure each question presses the unique aspects of trustworthiness and avoids letting her fall back on knowledge-norm arguments. The follow-ups should anticipate her responses and challenge potential weaknesses. For example, in the lottery case, if she says the audience isn't entitled because they know it's a lottery, the follow-up asks if the assertion is still wrong even if the audience is ignorant. For Moore's paradox, if sincerity is part of trust, is it essential or added? The lying question must highlight intentional deception vs. accidental falsehood.

  Also, considering the user's deeper needs: they want a rigorous interview that reveals the theory's strengths and flaws, engages the audience, and distinguishes this view from existing ones. They might also want to explore practical implications or how this changes communication ethics. Ensuring questions are sharp and prevent evasive answers is crucial.
answer: |-
  Here are 8 targeted questions designed to press the unique claims of the epistemic trustworthiness norm, complete with anticipated responses and sharp follow-ups. They hit all your specified targets:

  1.  **Question:** Your core claim is that the norm of assertion is *epistemic trustworthiness*: I may assert p iff my audience is *entitled* to take my word for it, and knowledge makes that entitlement apt. Doesn't this make the norm fundamentally *audience-relative* in a way that knowledge or truth norms aren't? Couldn't this imply that asserting to a hyper-trusting audience (e.g., my devoted disciple who trusts me on everything) is *always* permissible, even when I know p is false?
      *   **Anticipated Response:** "No, because entitlement isn't just subjective belief; it's grounded in the audience's *actual epistemic situation*. My disciple *isn't* entitled to trust me if I'm asserting falsehoods, even if they believe they are."
      *   **Follow-Up:** But your account defines permissibility *in terms of* the audience's entitlement. If the disciple, based on their (flawed) epistemic framework, *is* (by your lights) entitled to trust me *at the moment I assert*, isn't my assertion *permissible* under your norm, even if it's false and I know it? How does your norm rule out exploiting such an audience?

  2.  **Question:** Let's take the lottery paradox. I hold a single ticket in a fair, billion-ticket lottery. I assert, flat-out, "My ticket will lose." On your view, is this assertion permissible? Why or why not?
      *   **Anticipated Response:** "No, it's impermissible. While it's highly probable, I don't *know* it will lose. My audience wouldn't be entitled to take my word for it *as knowledge* because I lack the knowledge that would make their trust apt."
      *   **Follow-Up:** Suppose my audience *doesn't* know it's a lottery ticket; they think it's a claim about a biased coin I've flipped a billion times. Does the permissibility of my assertion *change* based on what *they* believe about the source? If so, how is this different from saying the norm is just "Don't mislead *this specific audience*"?

  3.  **Question:** Moore's Paradox: "It's raining, but I don't believe it is." You likely agree asserting this is absurd/impermissible. How does your trustworthiness norm explain this? Does it require adding an explicit *sincerity* condition?
      *   **Anticipated Response:** "The absurdity stems directly from trustworthiness. To be trustworthy in asserting p, I must sincerely present myself as believing p. Asserting 'p but I don't believe p' explicitly undermines the sincerity required for the audience to be entitled to take my word for it."
      *   **Follow-Up:** So, is *sincerity* (presenting oneself as believing p) a *constitutive part* of epistemic trustworthiness itself, or is it an *additional, independent condition* you've had to 'bolt on' to handle Moorean cases? If the latter, doesn't that weaken the claim that trustworthiness alone is the fundamental norm?

  4.  **Question:** Now the other Moorean form: "It's raining, but I don't know that it is." How does your norm explain the impropriety here?
      *   **Anticipated Response:** "This is the core case for my view! Asserting p presents me as epistemically trustworthy regarding p. But explicitly adding 'I don't know p' directly contradicts that presentation of trustworthiness. It tells the audience *not* to take my word for it, undermining the very act of assertion under my norm."
      *   **Follow-Up:** But couldn't someone consistently say: "Look, I'm very reliable on the weather, I have excellent evidence it's raining, I believe it strongly – so you *are* entitled to trust me on this – but strict philosophical standards mean I don't quite *know* it." Isn't this assertion *coherent*? Does your norm mistakenly rule it impermissible simply because the speaker utters the words "I don't know"?

  5.  **Question:** What about assertions made to *no audience*? I mutter "The keys are on the table" to myself in an empty room. Is this governed by your norm? If not, why not? If so, *who* is entitled to trustworthiness? A hypothetical audience?
      *   **Anticipated Response:** "Assertion is fundamentally a social communicative act. Soliloquies or thinking aloud aren't genuine assertions governed by the norm. The norm kicks in when there's an intended audience."
      *   **Follow-Up:** If asserting to oneself doesn't count, where do we draw the line? What about whispering to a pet, or writing in a private diary I *might* show someone later? More importantly, doesn't excluding soliloquies suggest the *core function* of assertion *is* communicative (aiming to inform an audience), potentially pushing your view closer to the 'common ground update' account you might want to distinguish from?

  6.  **Question:** Speaking of common ground: Some theorists (like Stalnaker) argue assertion aims to add information to the mutually accepted common ground of the conversation. How is your "audience entitlement to trust" norm *distinct* from, and superior to, simply saying assertion aims to update the common ground *appropriately* (where appropriateness requires the speaker's epistemic authority)?
      *   **Anticipated Response:** "The common ground view focuses on the *state* of the conversation. My view focuses on the *interpersonal normative relation* between speaker and hearer – the *entitlement* the hearer gains. It explains *why* adding to common ground requires authority: because adding falsehoods violates the trust placed in you."
      *   **Follow-Up:** But doesn't the common ground update view *also* explain the impropriety of false or unsupported assertions (they corrupt the shared resource)? And doesn't your reliance on *apt* entitlement, grounded in the speaker's *knowledge*, functionally reduce the 'trustworthiness' relation to just *the speaker knowing p* in the standard way? How is "entitlement grounded in speaker knowledge" meaningfully different from just "knowledge" being the norm?

  7.  **Question:** A key objection to knowledge norms is that lying (asserting p while believing ~p) seems *distinctly worse* than merely asserting p without knowledge (e.g., a sincere Gettier case). Does your trustworthiness norm capture this distinction?
      *   **Anticipated Response:** "Absolutely. Both violate trustworthiness, but lying does so *intentionally and deceptively*. It's a *fraudulent* presentation of trustworthiness, actively manipulating the audience's entitlement. The unwitting asserter is unreliable but not deceptive; the liar is both unreliable and exploitative of the trust relation."
      *   **Follow-Up:** But does your norm *itself* formally distinguish between the two violations? Both result in the audience *not* being entitled to apt trust (since the speaker lacks knowledge). Doesn't the *added* wrong of lying stem from *intention to deceive*, which seems like a separate moral/agential dimension *beyond* the core epistemic norm governing the *content* of assertion? Is intention part of the *epistemic* trustworthiness norm?

  8.  **Question:** Finally, falsifiability: What kind of scenario or counterexample would genuinely make you reconsider or doubt that epistemic trustworthiness is the fundamental norm of assertion? What evidence would count *against* your view?
      *   **Anticipated Response:** "Perhaps if we found a practice intuitively recognizable as 'assertion' where speakers reliably convey true information, audiences reliably gain knowledge, but the *structure of entitlement* was completely absent or radically different. Or if we could show the audience's entitlement adds *nothing* explanatory beyond the speaker's knowledge state and communicative intention."
      *   **Follow-Up:** Let's make it concrete. Imagine a culture with a linguistic practice functionally identical to assertion, but where the speakers explicitly disavow any notion of "taking someone's word for it" or "entitlement to trust"; they view it purely as information transfer based on perceived reliability stats, like a weather report. Would this practice fall under the norm of assertion for you? If not, does that mean your norm isn't universal but culturally dependent?

  These questions force engagement with the unique audience-relative and trust-centric aspects of her view, directly challenge potential weaknesses (relativity, sincerity, reduction), press on the key cases (lottery, Moore x2, lying, soliloquy), and end by demanding critical self-reflection. Good luck with the interview!
