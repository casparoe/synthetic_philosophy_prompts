prompt: |-
  Write a mock application form, in the deadpan register of a government licensing office, for a fictional Bureau of Scientific Status that decides what counts as a science by asking whether a theory forbids anything. Include numbered fields with an applicant's answers and the reviewing officer's marginal notes; aim for 550-650 words, with no more than two applicants. The humour has to come from the philosophy rather than from jokes about paperwork, and the form should keep colliding with the real difficulties: a theory can be eminently falsifiable and worthless; a refuted theory can be kept alive indefinitely by adjusting some auxiliary assumption, so that no observation ever kills anything; the theories everyone agrees are science — the historical and biological ones — can rarely name the single observation that would refute them; and some of the things everyone agrees are not science can name one quite easily. Give the bureau a clause for theories that are already refuted (an applicant wants the refutation counted in its favour), a clause requiring the applicant to specify which member of a conjunction of hypotheses a failed prediction actually refuted, an annex for requesting an ad hoc rescue, a rubric scoring how severe the theory's tests have been, and a closing note in which the officer observes that in the bureau's history the rubric has never rejected a physics application and never approved a psychoanalytic one for reasons that had anything to do with the rubric. Keep it legible to a reader who has never heard of the demarcation problem, and never let the form state the objections outright; someone who has heard of it should find the satire fair and wince only where the argument really is weak.
reasoning: |-
  Okay, the user wants me to create a mock government form application for a fictional Bureau of Scientific Status. This bureau determines what qualifies as science based on whether a theory forbids anything - essentially about falsifiability. 

  I need to craft this in the deadpan style of bureaucratic paperwork, avoiding overt jokes about forms themselves. The humor should emerge from the philosophical contradictions around falsificationism. Key challenges to address include: falsifiable theories being worthless, unfalsifiable theories being adjustable to avoid refutation, established sciences like history/biology struggling to name single falsifying observations, and non-sciences easily naming falsifying tests.

  The form must include specific elements:
  - Numbered fields for applicant responses and officer marginalia
  - A clause for already-refuted theories 
  - Requirement to specify which conjunctive hypothesis a failed prediction refutes
  - Annex for ad hoc rescue requests
  - Rubric scoring test severity
  - Closing note about physics always passing and psychoanalysis always failing regardless of rubric

  I'll structure this as a standard government form with sections for applicant information, theory description, falsification criteria, testing history, and officer review. The satire should be subtle - legible to laypeople but painfully accurate to philosophers of science. 

  For applicants, I'll create two contrasting cases: "Universal Acausal Resonance" (clearly pseudoscience) and "Phylogenetic Niche Theory" (legitimate biology). This lets me explore how both can struggle with falsification criteria. The officer's marginal notes will reveal the absurdities without explicit statements.

  The closing observation about physics always passing and psychoanalysis always failing regardless of merit will underscore how institutional biases shape what counts as science more than philosophical criteria. The form itself becomes the joke - a bureaucratic attempt to solve an unsolvable demarcation problem.
