  Then there's (a)'s subjectivism versus (d)'s social construction - actual spectators vary wildly, so how does internalization produce consistency? And (e)'s harmony ideal might conflict with (c)'s partiality if our natural sentiments pull in different directions.

  For fixes... prioritizing solutions: The partial/impartial clash needs substantive work, maybe by reframing the spectator as "sufficiently" rather than "fully" impartial. Other issues might resolve with clarifications about degrees of idealization or distinguishing between psychological origins and normative standards.

