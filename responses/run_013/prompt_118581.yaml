prompt: |-
  Ok so here's roughly where I've landed on moral philosophy, and I want to know whether it hangs together before I try to write it up: (a) moral approval is nothing over and above sympathy — there are no mind-independent moral facts, only facts about what a suitably placed human spectator would feel; (b) the standard of correctness in morals is the impartial spectator, i.e. what a spectator would feel if he were fully informed and free of self-love; (c) our sympathy is irreducibly partial — we feel much more for the near and dear and, embarassingly, for the rich and powerful — and that partiality isn't a bug, since a creature that cared equally about everyone would never get off the couch; (d) the impartial spectator is nothing mysterious, it's just the internalized standpoint of the spectator we carry around inside us, built up out of how the actual people around us respond to us; (e) the point of moral life is a mutual harmony of sentiments — we bring our feelings into line with one another and with the ideal spectator, and virtue just is that attunement.

  Which of these actually pull against each other, which pairs only look like they do, and for each real clash what's the cheapest fix and what does it cost? Rank them by how bad they are — I don't want everything flagged as equally serious, and I don't want to be told to throw out the whole package. If one of them has to go, say which. Give me exactly five numbered points, a sentence or two each, no preamble and no wrap-up at the end.
