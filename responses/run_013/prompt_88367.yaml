     - Each group presents their causal story. We expect:
          Group 1: Aging effect (people become more trusting with age)
          Group 2: Period effect (a general decline due to events, and we're seeing the young at each time are the same as the old but at a younger age, just in a lower period)
          Group 3: Cohort effect (each new generation is less trusting than the one before)
          Group 4 (if exists): Might mix or come up with something else, but we hope the three main ones are covered.
     - The group with the special prompt might raise the reference class issue.

  4. Challenge: Designing a Study to Separate Effects (20 minutes):
     - Now, point out that all stories fit. How can we design a study to tell them apart?
     - In groups again (same or mixed), ask: "Design a study that could distinguish between aging, period, and cohort effects. What data would you collect? How would you analyze it?"
