  But note: the cohort effect story is actually the same as the period effect in this model? Because the cohort effect is confounded with period. However, without additional information, we cannot tell if it's a cohort effect or a period effect.

  But wait, we also have the aging effect. The problem is that we have three variables (age, period, cohort) that are linearly dependent: cohort = period - age. So we cannot include all three in a regression.

  Therefore, the dataset is consistent with all three stories.

  We'll use this table for the activity.

  Now, for the session:

  1. Introduction (5 minutes):
     - Briefly state the topic: Are generations real kinds?
     - Explain the activity: Groups will analyze a fictional dataset from Harbury and propose a causal story for why the young are less trusting.

  2. Group Activity (25 minutes):
     - Divide into 3-4 groups (about 4 groups for 14 students).
     - Hand out the dataset (the table above) and ask: "Why are the younger age bands less trusting in every wave? Propose a causal story and be ready to present it."
