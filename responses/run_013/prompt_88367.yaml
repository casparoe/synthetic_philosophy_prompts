  Now, we can also see that the 20-29 group in 2010 (born 1981-1990) has a lower starting point (7.85) than the previous cohort at the same age (8.05). This could be interpreted as a cohort effect (the later cohort is less trusting) but actually it's the period effect.

  So the table:

  Trust in Institutions:

  Wave | 20-29 | 30-39 | 40-49 | 50-59
  ------------------------------------
  2000 | 8.05  | 8.55  | 9.05  | 9.55
