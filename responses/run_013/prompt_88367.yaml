  Now, a cohort that was 20-29 in 2000 will be 30-39 in 2010 and 40-49 in 2020.

  True model: Trust = 8 + 0.05*(age - 20) - 0.2*(wave number)   [with wave1=2000, wave2=2010, wave3=2020]

  But note: period effect is per wave, and each wave is 10 years, so we want a period effect of -0.4 per 10 years? (since previously -0.2 per 5 years -> -0.4 per 10 years). However, we also have the age effect: per year 0.05, so per 10 years 0.5.

  So for a cohort that ages 10 years between waves, we expect an increase of 0.5 from age, but a decrease of 0.4 from period, so net change of +0.1.

  But we want the pattern that in every wave, the younger bands are lower. And also that over time, each band is declining? Let's compute.

  Wave 1 (2000):
  20-29: average age 25 -> 8 + 0.05*(25-20) - 0.2*1 = 8 + 0.25 - 0.2 = 8.05
  30-39: average 35 -> 8 + 0.05*(35-20) - 0.2 = 8 + 0.75 - 0.2 = 8.55
  40-49: average 45 -> 8 + 1.25 - 0.2 = 9.05
  50-59: average 55 -> 8 + 1.75 - 0.2 = 9.55

  Wave 2 (2010):
