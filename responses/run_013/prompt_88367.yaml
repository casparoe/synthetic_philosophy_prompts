  Dataset Design:
  We need the same table to be interpretable as:
  - Aging effect: Within a cohort, as they age, they become more trusting.
  - Period effect: A historical event (e.g., a scandal in 2008) causes a drop in trust for everyone at that time, regardless of age.
  - Cohort effect: Each birth cohort has a fixed level of trust (e.g., those born in 1980-1984 are inherently less trusting).

  How to achieve this?
  We'll create a dataset where the pattern is: in every wave, younger age bands have lower trust than older ones.

  Let:
  - Age effect: Trust increases by 0.5 per 10 years of age.
  - Period effect: There is a linear decline in trust over time of 0.2 per wave (so per 5 years, 0.2 decline).
  - Cohort effect: We'll assign each cohort a base level of trust, but to make the three stories equally plausible, we won't have a cohort effect in the true model. Instead, we'll set the true model as having both age and period effects, but no cohort effect. However, the data will be consistent with a cohort effect because we cannot separate them.

  True model for trust in institutions for an individual:
     Trust = 8 - 0.2 * (wave number) + 0.05 * (age in years - 18)

  But we are aggregating by age bands and waves. We'll precompute the mean for each age band in each wave.

  Example calculation for wave 1 (2000):
  - Age band 18-24: mean age 21 -> Trust = 8 - 0.2*1 + 0.05*(21-18) = 8 - 0.2 + 0.15 = 7.95
