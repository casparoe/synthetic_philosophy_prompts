prompt: |-
  I'm a novelist — three years into a book set on a made-up island city-state that is obviously a stand-in for Singapore, which is how I've ended up reading a stupid ammount of political science and journalism for a novel that has maybe nine pages of politics in it. Anyway, this has left me with a question I can't shake.

  Here's the pattern. When you ask people in a place like that to defend the arrangement — not the ones on the payroll, just ordinary educated people who've done fine under it — they almost never say "it's just." They say "look at what we've got." Which is fair enough. But when you push, "look what we've got" splits into two versions that are doing very different work. One is comparative: look where we were in 1965, look at the neighbours, look at what everyone else did with their independence. The other is about the slope: it keeps getting better, each generation does better than the last, the trains go further every year, and the same thing shows up in the China arguments where "we lifted hundreds of millions out of poverty" is meant to close the conversation.

  The second version is the one I keep chewing on, because it seems to have a built-in flaw. If what justifies the whole setup is that it keeps improving things, then it can never arrive. Arriving is the same as failing. A plateau at a very high standard of living would read as a crisis — and it would read as a crisis even if nobody's life actually got worse, purely because the line went flat. I've noticed the same shape in how companies talk about themselves, and, honestly, in my own marriage.

  Is there a name for this? I know people say "performance legitimacy," and I've seen "output legitimacy" used in contrast to something else (input?), but as far as I can tell those are about where a justification comes from, not about this treadmill quality — that the justification requires the improvement to continue and so can't be satisfied by any level of performance. Am I wrong? And is the treadmill just the same as that thing I half-remember about people getting angrier as things get better? That feels like a different animal — that's about what people feel, and I'm asking about the logic of the claim itself.

  Don't give me a menu. I can get a list of candidate terms from anywhere and I'm not going to read a reading list either. Tell me which one you actually think fits, what it fails to cover, and if nothing covers it, name the leftover yourself and give me the definition and where the edges are. If you think I've got it wrong and this is just ordinary politics — every incumbent anywhere gets judged on the trend, nothing special about these regimes — then say that and tell me what would show I'm wrong. A definite answer I can argue with beats a survey.
reasoning: |-
  Okay, the user is a novelist working on a book set in a fictional Singapore-like city-state. They've noticed that when ordinary, educated people defend the system, they don't claim it's "just," but instead say "look at what we've got." This splits into two arguments: comparative (we're better than others) and slope (things keep improving). The user is particularly interested in the slope argument because it seems flawed—it requires perpetual improvement, meaning success can never be stable; a plateau becomes a crisis even if no one's life worsens.

  The user mentions terms like "performance legitimacy" but feels they don't capture this treadmill aspect. They want a specific term that addresses the inherent instability of justifying a system solely on continuous improvement. They’re not looking for a list of terms but a precise fit, its limitations, or a new definition if nothing exists. They also question if this is just ordinary politics or something unique to such regimes.

  First, I need to recall relevant concepts. Performance legitimacy is about system justification based on results. But the user is right—it doesn’t inherently include the necessity of constant growth. Other terms like "developmental authoritarianism" or "pragmatic legitimacy" might be related but miss the treadmill element. The "revolution of rising expectations" is about changing perceptions, not the structural flaw in the justification.

  The core issue is the moving target: improvement must be endless. This resembles a "ratchet effect" in sociology, where each gain raises the baseline, making stability feel like failure. But ratchet effect usually applies to norms or policies, not systemic legitimacy. "Progress trap" deals with unsustainable advancements, not legitimacy. 

  Perhaps coining a new term is necessary. "Improvement Imperative" captures the compulsion for constant growth as a legitimizing force. It highlights the inherent instability—plateau as crisis. The edges: it applies best to regimes prioritizing measurable outputs (GDP, infrastructure) over input legitimacy (democratic processes). It wouldn’t fit where legitimacy is based on ideology or tradition.

  The user might also be exploring themes of unsustainable systems in their novel. The treadmill concept mirrors capitalist growth models and personal relationships, which they mention. They need a precise term to articulate this dynamic in their work. Their deeper need could be understanding the psychological and structural pressures that make such systems fragile, even when successful. Naming it helps crystallize the theme for their narrative.
answer: |-
  You're absolutely right about the core tension, and "performance legitimacy" alone doesn't capture the specific, unstable *imperative for perpetual improvement* you've identified. You've hit on a distinct and critical nuance.

  Here's the breakdown:

  1.  **"Performance Legitimacy" (and "Output Legitimacy") Falls Short:** You're correct. These terms describe legitimacy derived from *results* (economic growth, stability, infrastructure, poverty reduction) rather than *process* (democratic participation, rule of law as input). They describe the *source* of justification ("look what we've got"), not the *temporal requirement* you've spotted ("it must *keep* getting better").
  2.  **"Revolution of Rising Expectations" is Different:** This describes the phenomenon where *improvements fuel greater demands* (people get angrier as things get better because their baseline shifts). It's about the *public's reaction* and changing demands *in response* to improvement, not the *structural requirement of the regime's justification logic itself*. It's the populace's side of the coin, not the regime's foundational claim.
  3.  **"Developmental Authoritarianism/Pragmatism" is Broader:** These describe the *type* of regime that prioritizes development and performance over liberal democracy. They set the stage but don't capture the specific *treadmill logic* of justification.

  **Your Core Insight Has a Name (Sort Of): The Ratchet Effect of Performance Legitimacy**

  *   **The Term:** While not a single, universally agreed-upon term, the dynamic you describe is most precisely captured by the concept of a **"Ratchet Effect" applied to performance legitimacy.**
  *   **Why "Ratchet Effect" Fits:**
      *   A ratchet only allows movement in one direction (improvement).
      *   Each successful improvement *raises the baseline* for what constitutes acceptable performance in the future.
      *   Stagnation, *even at a high level*, represents a failure relative to the *expectation of continuous forward motion* established by the regime's own justification narrative. The ratchet cannot turn backwards, but it also cannot *stop* turning forwards without the mechanism failing.
      *   The "slope" argument ("it keeps getting better") explicitly sets up this ratchet. Success isn't defined by reaching a point, but by the *rate of change*. A plateau breaks the mechanism.
  *   **What It Captures:** The inherent instability and built-in obsolescence of a legitimacy model *predicated solely on continuous, measurable improvement*. It turns governance into a perpetual growth machine where stability equals crisis.
  *   **Where the Edges Are / What It Fails to Cover Perfectly:**
      *   **Scope:** It specifically describes the *temporal dynamic* within performance-based legitimacy systems. It doesn't replace "performance legitimacy"; it refines it for cases where *continuous growth* is the core promise.
      *   **Subjectivity:** It focuses on the *logic of the regime's claim*, not necessarily the public's perception (though they are linked). The public might accept a plateau *if* other values (stability, security, cultural identity) are strong enough – but the *regime's own narrative* based on the "slope" becomes immediately vulnerable.
      *   **Non-Quantifiable Improvements:** It works best with tangible, measurable outputs (GDP, HDI, miles of track, poverty stats). It's harder to apply directly to less quantifiable improvements like social cohesion or cultural vibrancy, though regimes often try to frame these narratively as part of the "slope."
      *   **The "Arriving is Failing" Paradox:** This is the *core consequence* of the ratchet effect. The system cannot declare "mission accomplished" on development without undermining its foundational legitimacy claim. Victory is always provisional, contingent on the *next* improvement.

  **Is This Just Ordinary Politics? (And What Would Show You're Wrong)**

  *   **Partly, But Amplified:** All incumbents face pressure to deliver improvement. Voters often reward growth and punish recession. *However*, the dynamic you describe is qualitatively different and more intense in systems like your fictional Singapore analogue or China because:
      *   **Exclusivity of Legitimacy:** In liberal democracies, legitimacy has multiple sources: process (elections, rule of law), ideology, tradition, *and* performance. A growth slowdown hurts, but doesn't automatically create a *legitimacy crisis* because other pillars exist. In pure performance-based regimes, stagnation directly attacks the *primary or sole* pillar of legitimacy. There's no fallback.
      *   **The Narrative is Central:** The regime actively promotes the "slope" narrative as its *raison d'être*. It's not just an electoral advantage; it's the bedrock justification for bypassing other forms of accountability. "Look how far we've come *and keep coming*" is the explicit or implicit social contract.
      *   **The Plateau = Crisis Threshold:** In a democracy, a period of high-level stability might be acceptable, even if not ideal. In a ratcheted performance legitimacy system, it's perceived as systemic failure *by the logic the system itself created*.
  *   **What Would Show You're Wrong?** Evidence that such regimes can successfully transition to a stable "high plateau" *without* experiencing a legitimacy crisis or significant political upheaval *while maintaining the same political structure*. If Singapore or China experienced a decade of zero real per-capita GDP growth but maintained high living standards, stability, *and* the same level of public acceptance of the ruling party/elite *without* resorting to repression or major narrative shifts (e.g., suddenly emphasizing nationalism or external threats more heavily than growth), it would suggest the ratchet effect isn't as fundamental as it appears. Historical examples of such stable plateaus under single-party developmentalist regimes are hard to find – stagnation usually triggers significant pressure for change or increased repression.

  **In summary:** You've identified the **Ratchet Effect inherent in performance-based legitimacy systems**. This is the specific flaw where justification relies on continuous improvement, making any plateau a form of failure. It's a refinement of "performance legitimacy," highlighting its inherent temporal instability. While all governments face performance pressures, this dynamic is particularly acute and dangerous in regimes where performance is the *primary* or *exclusive* source of legitimacy. It's the logic that traps them on a treadmill where stopping means falling off.
