prompt: |-
  I am trying to find out whether there is an established name for a certain move in problem-solving, and if there is not, what it ought to be called. The move shows up in puzzles of this shape: one is given a starting string of symbols, a handful of rules for rewriting any string, and a target string, and one is asked to get from the first to the second. After a long stretch of fruitless derivation, one stops deriving and instead asks what the rules, taken together, do to some feature of a string; one finds a feature that every rule leaves untouched and that the target lacks, and concludes that the target cannot be reached at all. What has been produced is not a derivation but a claim about the whole system, and it was available only from outside it. A second case, which I suspect is the same move in different dress: a proof that is intractable in one notation becomes immediate in another, where the second notation was not one the original rules permitted. I know about thinking outside the box and about stepping back to audit one's own reasoning, and this seems to be neither: the point is not to drop an assumption, and not merely to check one's inferences, but to stop treating the rules as instruments to be followed and start treating them as objects to be described. I also want to know what separates it from the counterfeit, where someone merely bolts another rule onto the system and calls that a step outside. Is there a name for this? I want the nearest established concepts, how what I have described differs from each of them, and, if nothing quite fits, a term with a definition and boundary cases; a bare label will not help me. Answer as a numbered list of exactly five items, one or two sentences each, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is asking about a specific problem-solving move that involves shifting from operating within a system to analyzing it from outside. They've described two scenarios: one where you identify an invariant in a string rewriting puzzle to prove a target is unreachable, and another where switching notations makes a proof trivial. They want to know if there's an established name for this, or what it should be called.

  I need to recall concepts that fit this description. The invariant-finding part sounds like discovering an invariant property, which is common in mathematics and computer science, especially in fields like abstract algebra or formal languages. The second case, changing notations, reminds me of representation changes or abstraction in problem-solving.

  The user mentioned differences from "thinking outside the box" and "auditing reasoning." Thinking outside the box usually involves challenging assumptions, but here it's more about stepping back to observe the system's properties, not necessarily dropping an assumption. Auditing is about checking steps, whereas this is about discovering global properties.

  They also brought up the counterfeit move, where someone adds a rule and calls it "stepping outside." That's different because it's still operating within the system by extending it, whereas the genuine move is about analysis without modification.

  Now, for established names: Invariant Analysis seems spot-on for the first case. Meta-reasoning or Metatheoretic Reasoning covers the shift to a higher level. Representation Shift fits the notation change. Abstraction could be a broader term, but it might not fully capture the move. As for the counterfeit, it's a System Extension, which isn't the same.

  Putting this together, I should provide exactly five items as requested. I'll define each concept, how it relates to the user's description, and how it differs. For the counterfeit, I'll explain why it's not genuine. This should give the user a clear, structured answer without fluff.
answer: |-
  1.  **Invariant Analysis:** This directly names the core move of identifying a property preserved by all rules (an invariant) that distinguishes the start and target states, proving unreachability; it is the formal mathematical concept underlying your first case.
  2.  **Metatheoretic Reasoning / Meta-reasoning:** This describes the act of stepping outside the object-level system (the rules and derivations) to reason *about* its properties (like finding invariants); it captures the shift from following rules to describing them as objects.
  3.  **Representation Shift / Change of Representation:** This names the second case, where adopting a different, external notation or perspective reveals properties (like an invariant) that make the solution trivial; it's a specific technique enabled by meta-reasoning.
  4.  **Abstraction (for Analysis):** This is the process of extracting a higher-level feature (like string length parity or symbol count) from the concrete system; while crucial for finding invariants, it's the *means* (identifying the feature) rather than the full *move* (using it externally for proof).
  5.  **System Extension (Counterfeit):** This differs fundamentally as it merely adds new object-level rules within the system's framework, rather than analyzing the *given* system's properties from outside; it continues internal derivation instead of providing an external proof about impossibility.
