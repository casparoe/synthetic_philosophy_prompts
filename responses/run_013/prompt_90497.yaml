answer: |-
  Here's the translation you requested, built stepwise from the ground up. I'll strictly adhere to public health surveillance vocabulary, flagging where legal concepts strain the analogy, and conclude with a residue analysis.

  **1. Deconstructing Genocide (Legal/Moral Category):**
      *   **Enumerated Acts:** Specific harmful events codified in law (killing, serious bodily/mental harm, deliberate life conditions, birth prevention, forced child transfer).
      *   **Intent Requirement (Dolus Specialis):** Requires proof beyond reasonable doubt that the *primary aim* of the acts was the *destruction* (in whole or part) of a specific group. Motive is irrelevant; the *intended outcome* is key.
      *   **Protected Groups:** Defined by nationality, ethnicity, race, or religion (per the Genocide Convention). Political/social groups are excluded.
      *   **Individual Liability:** Focuses on *individual perpetrators'* criminal responsibility for specific acts committed with genocidal intent, not states or abstract entities.
      *   **Label Conferral:** "Genocide" is a formal *diagnosis* applied retrospectively by courts (international or national) or states, following rigorous investigation and adjudication. It's not an observational term.

  **2. Deconstructing Public Health Case Definitions (Surveillance Tool):**
      *   **Authorship:** Crafted by expert committees (e.g., CDC, WHO) based on available science, resource constraints, and surveillance goals.
      *   **Function:** A standardized algorithm (symptoms + signs + lab results + epidemiologic links) to classify individuals as "confirmed," "probable," or "suspected" cases. Its core purpose is *consistent identification for counting and response*.
      *   **Trade-Off (Specificity vs. Sensitivity):** Prioritizes high *specificity* (minimizing false positives) over high *sensitivity* (catching all possible cases), especially early in an outbreak or for severe outcomes. This means intentionally excluding borderline or atypical presentations.
      *   **Excluded Cases:** Individuals falling outside the definition are not counted in official surveillance tallies. They exist as "not a case" or "undetermined" within the system, potentially captured elsewhere (e.g., morbidity data) but not triggering the specific response protocol.
      *   **Surveillance System Limits:** Records *what the case definition captures*. It doesn't inherently capture underlying causes, perpetrator intent, the full spectrum of suffering, or events occurring outside the defined parameters. It's a tool for *pattern detection and response initiation*, not comprehensive documentation.

  **3. Translation: Genocide through the Lens of Surveillance**

  *   **"Genocide" as a Case Definition:** Think of the Genocide Convention as the **Master Protocol** drafted by an international committee (states). The enumerated acts are the **core diagnostic criteria**.
  *   **Protected Groups:** These are the **pre-defined, high-risk subpopulations under surveillance**. The "risk factor" isn't biological susceptibility, but being identified (by perpetrators *and* the definition) as belonging to a specific national, ethnic, racial, or religious group. Other vulnerable groups (political, social) are *excluded from this specific surveillance system*.
  *   **Enumerated Acts:** These are the **reportable events** triggering potential classification: killing (fatal case), serious harm (severe morbidity case), deliberate life conditions (intentional exposure leading to predictable excess mortality/morbidity), birth prevention/forced transfer (demographic sabotage events).
  *   **Intent Requirement (Dolus Specialis):** This is the **causal attribution threshold**. It's not enough to observe a *correlation* between harmful events and group membership (which could be discrimination, hate crimes, or even coincidence). Surveillance must detect a pattern where the *primary, intended outcome* of the acts is the *destruction of the group itself*, evidenced by perpetrator statements, planning documents, scale/pattern of acts, and context. This is the **etiologic certainty level** required – akin to needing Koch's postulates fulfilled for causation, not just epidemiologic association. (*Stretch Note: Surveillance systems aren't designed to assess *intent*. This requires integrating intelligence/evidence of purpose far beyond typical epi data.*)
  *   **Individual Liability:** The surveillance system focuses on **identifying specific pathogen sources (perpetrators)** responsible for *transmitting* the harm (committing the acts), not just the overall outbreak conditions.
  *   **Label Conferral:** Declaring "genocide" is the official **outbreak confirmation** by an authoritative body (court/state). It follows a prolonged **outbreak investigation** using evidence gathered *outside* routine surveillance (forensic, documentary, testimonial). It's the point where the signal surpasses background noise with the required etiologic certainty. Like declaring a pandemic, it triggers specific **international response protocols**.
  *   **The Politics of the Label:** Applying or withholding "genocide" is the **political/public health fight over outbreak declaration**. States/parties may:
      *   **Argue the case definition isn't met:** Dispute the scale ("not part of the whole group"), the intent ("collateral damage, not destruction"), or the group definition ("they're criminals, not an ethnicity").
      *   **Blame misclassification:** Claim deaths/harm are due to "underlying conditions" (civil war, famine not *deliberately* imposed) or random violence ("criminal gangs"), not systematic destruction.
      *   **Suppress case ascertainment:** Block investigators, hide victims, destroy evidence (like suppressing lab testing or case reporting).
      *   **Invoke competing priorities:** Argue declaring "genocide" (outbreak) is counterproductive, escalatory, or distracts from other crises.
      *   **Demand lower thresholds:** Advocacy groups push for declaring based on "probable cases" (patterns of harm) before full "etiologic certainty" (intent proof) is established by courts, arguing the death toll demands immediate maximal response.

  **4. The Residue Report: What Carries Over, What Distorts, What's Missing**

  *   **Carries Over Without Significant Loss:**
      *   **Core Function of Definition:** Both are tools for *classification* to enable a *response*. The genocide definition classifies events/acts as meeting a threshold; the case definition classifies individuals.
      *   **Specificity/Sensitivity Trade-Off:** The genocide definition prioritizes high *specificity* (avoiding false accusations) over sensitivity, mirroring case definitions prioritizing confirmed cases early on. This inevitably misses cases falling just outside the criteria.
      *   **Importance of Standardization:** Consistent application of the definition (legal or epi) is crucial for credibility and comparability.
      *   **Role of Investigation:** Both require rigorous investigation (outbreak investigation / criminal investigation) beyond passive surveillance to confirm the diagnosis/declaration.
      *   **Trigger for Action:** Both declarations ("genocide" / "outbreak/pandemic") are designed to trigger specific, escalated international responses.

  *   **Carries Over in Distorted Form:**
      *   **Protected Groups:** Translating them as "high-risk subpopulations" captures the *epidemiologic reality* of targeting but loses the *inherent moral and legal significance* of why *these specific groups* are protected under the convention. The "risk factor" analogy flattens the historical and normative basis. (*Sign of legal category doing specific work*).
      *   **Intent (Dolus Specialis):** Framing it as "etiologic certainty level" captures the *threshold* aspect but fundamentally distorts the *nature of the evidence*. Proving *intent to destroy* requires analyzing human agency, motives, and plans – qualitatively different from proving microbial causation or even environmental toxin exposure. Surveillance systems aren't equipped for this. (*Significant stretch; highlights a core limitation of the surveillance framework for this concept*).
      *   **Individual Liability:** Focusing on "pathogen sources" captures the perpetrator aspect but reduces complex leadership structures and systems of violence to the simplicity of identifying an infectious agent. The legal concept involves chains of command, modes of liability (ordering, aiding, conspiracy), and gradations of responsibility lost in the analogy. (*Distortion inherent in the simplification*).

  *   **No Counterpart / Residue:**
      *   **The Irreducible Moral Weight of the Label:** "Genocide" carries unparalleled historical, moral, and symbolic weight as the "crime of crimes." Declaring an "outbreak" carries operational weight, but not this profound condemnation and call for absolute opposition. Surveillance vocabulary is inherently neutral and operational; "genocide" is inherently normative and condemnatory. (*Residue sits with the legal/moral category - it is doing essential work the surveillance framework cannot replicate. This is not a defect of surveillance; it's its purpose.*)
      *   **The *Inherent* Value of the Protected Groups:** The Convention protects groups based on their *stable, constitutive characteristics* fundamental to human identity. Surveillance defines risk groups based on *exposure or susceptibility*. Treating groups as inherently valuable *because* of their identity has no true parallel in epidemiologic thinking, which focuses on harm prevention regardless of identity. (*Residue sits with the legal/moral category - reflects a core ethical principle.*)
      *   **The Requirement of a "Pattern" vs. Individual Acts:** While individual liability is key, genocide law requires proof of acts committed *as part of a pattern* demonstrating the intent to destroy the group. Surveillance counts individual cases to *identify* a pattern, but the legal concept *demands* that the pattern be proven as part of the *definition itself*. (*Residue sits in between. Surveillance detects patterns; the genocide label *requires* the pattern as proof of intent for the diagnosis. This reflects the higher burden of proof in law.*)
      *   **The Necessity of Political/Judicial Will:** A surveillance system *can* detect an outbreak pattern algorithmically. Declaring genocide *always* requires a political or judicial act of will by specific powerful actors (states, UNSC, courts). The threshold isn't just statistical; it's deeply embedded in power structures and diplomacy. (*Residue highlights that the genocide label isn't just an epidemiologic observation; its application is fundamentally a political process, which is both a defect in its objectivity and a reflection of its nature as a tool for international action.*)

  **Conclusion:** The surveillance framework powerfully illuminates the *structural logic* of genocide as a defined category requiring specific criteria, thresholds, investigation, and conferral to trigger action. It effectively translates the trade-offs, exclusionary nature, and political battles surrounding the label. However, significant residue remains: the irreducible moral condemnation, the unique basis for protecting specific groups, and the qualitatively different nature of proving genocidal *intent*. This residue isn't a failure of the translation; it highlights that "genocide" is fundamentally a *legal and moral judgment* applied to catastrophic human actions, not merely an epidemiologic pattern of harm. The translation shows how the *system* of declaring genocide functions like surveillance, but also reveals the profound *ethical and intentional core* that surveillance vocabulary cannot fully encapsulate. The residue signifies the unique and essential work done by the legal/moral category beyond mere pattern recognition.
