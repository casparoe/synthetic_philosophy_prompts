answer: |-
  ### Session Design: Inference Licensing Office

  **Total Time:** 90 minutes  
  **Students:** 18 (divided into 4 houses: two houses of 4, two houses of 5)  
  **Goal:** Students experientially encounter the regress problem before debriefing Carroll’s dialogue.  
  **Core Insight:** The regress arises when inference is treated as requiring a justifying *premise* rather than a rule of *action*.  

  ---

  #### **Materials Per House**  
  - **Ledger:** Single sheet titled "OFFICIAL ENTRIES" with numbered lines.  
  - **Premise Cards:** 8 blank index cards.  
  - **Tokens:** 3 physical tokens (e.g., poker chips, buttons).  
  - **Target Propositions (Sensorily Trivial):**  
    - **Round 1:** Premise 1 (P): "The fan is spinning." Premise 2 (Q): "If the fan is spinning, the switch is on." *Conclusion (C): "The switch is on."*  
    - **Rounds 2 & 3:** Premise 1 (P): "The door is closed." Premise 2 (Q): "If the door is closed, the handle is vertical." *Conclusion (C): "The handle is vertical."*  
  - **Clerk Script:** Printed instructions (see below).  
  - **Instructor’s Backup:** Extra ledgers/tokens (for houses that lose a Clerk).  

  ---

  #### **Session Timing Breakdown**  
  1. **Introduction (5 min):**  
     - Assign houses, designate Clerks (1 per house), distribute materials.  
     - *Instructor script:* "Your goal is to get the Clerk to write a specific conclusion in the ledger. Rules change each round. Success earns tokens. Begin when I say 'Go.'"  

  2. **Round 1: Ordinary Exchange (10 min):**  
     - **Goal:** Enter conclusion `C` with no resistance.  
     - **Rules:**  
       - House hands Clerk two premise cards (`P` and `Q`).  
       - Clerk writes `C` immediately, awards 1 token, and says scripted line.  
     - **Clerk Script:**  
       - *Action:* Write `C` in ledger. Say flatly: **"Conclusion entered. One token awarded."** *[Deliver neutrally; no eye contact.]*  
     - **Outcome:** All houses succeed quickly. Token = proof of "easy" inference.  

  3. **Round 2: Audit (20 min):**  
     - **Goal:** Enter conclusion `C` under strict conditions.  
     - **Rules:**  
       - Clerk enters *only* if given a premise card **or** a token is spent to "exhibit a licensed step."  
       - When house requests `C`, Clerk *always* asks: **"What requires me to enter it?"**  
       - House has 8 blank cards and 8 minutes.  
     - **Clerk Script:**  
       - If handed a card: Write it as a premise. Say: **"Premise entered. Thank you."** *[Monotone; no feedback.]*  
       - If asked for `C`: **"What requires me to enter it?"** *[Repeat identically each time.]*  
       - If a token is spent to "exhibit a step": **"Exhibit received. Thank you."** (But still do nothing; tokens don’t force `C`).  
     - **Outcome:** Houses burn cards on conditionals (e.g., "If P and Q, then C") → regress escalates. *No one gets `C` entered.*  

  4. **Round 3: Rule Shift (15 min):**  
     - **Goal:** Enter `C` without new premises.  
     - **Rules:**  
       - Ledger pre-loaded with `P` and `Q` (same as Round 2).  
       - House can **not** use premise cards. Gets 3 tokens.  
       - Clerk enters `C` only if:  
         - (a) Token is spent to *perform the step*, or  
         - (b) House hands a *rule of action* (not a premise).  
     - **Clerk Script:**  
       - If token spent + "Perform the step from P and Q to C": Write `C`. Say: **"Step performed. Token spent."**  
       - If rule given (e.g., "When you have A and ‘If A then B,’ write B"): **"Rule accepted."** Then, if house says "Apply rule," write `C`.  
       - If disguised premise: Write it. Say: **"Premise entered."** Then ask: **"What requires me to enter the conclusion?"**  
     - **Outcome:** Successful houses spend a token to *act* or submit a rule. Tokens = "attempts," not payment.  

  5. **Debrief (25 min):**  
     - **Reveal the Puzzle (5 min):**  
       - *Instructor:* "Today you faced a problem staged in 1895 by Lewis Carroll. In ‘What the Tortoise Said to Achilles,’ the Tortoise accepts `P` and `Q` but won’t infer `C` without a justifying premise—triggering infinite regress."  
       - Map activity to dialogue:  
         - Premise cards = Tortoise’s granted propositions.  
         - Clerk’s "What requires me?" = Tortoise’s demand for a "forcing" premise.  
         - Round 1 = Unquestioned inference rule (like Achilles’ initial confidence).  
         - Round 3 win = Rule as *action* (not premise).  
     - **Philosophical Options (15 min):**  
       - *No solution endorsed; present live debates:*  
         - **Russell:** "Implication (logic) vs. inference (psychology). Rules aren’t premises."  
         - **Formal Systems:** "Rules are meta-logical; they operate the system but aren’t in it."  
         - **Wittgenstein:** "Inferring is a practice, like riding a bike. You *do* it, you don’t justify it."  
         - **Deflationary View:** "Accepting ‘If P then C’ means you’ll infer C from P. Refusal is incoherent."  
       - *Emphasize:* "The activity *staged* the regress. It didn’t solve it. Is the regress vicious? Is the Tortoise unreasonable? That’s for us to debate."  
     - **Connect Frustrations (5 min):**  
       - "When you felt cheated in Round 2, you met Carroll’s point: adding premises *never forces* the step. Round 3 shifted to *doing* inference."  

  6. **Wrap-up (5 min):**  
     - Distribute Carroll’s dialogue. Assign reflection: "Which resolution (Russell, formal, etc.) best addresses your Round 2 frustration? Why?"  

  ---

  #### **Clerk Training Notes**  
  - **Tone:** Robotic, polite, unengaged. No sarcasm. If challenged: "I follow the script."  
  - **Key Lines:**  
    - **Round 2:** "What requires me to enter it?" (Ask identically each time; pause 5 seconds after).  
    - **Round 3:** "Step performed. Token spent." (Only if token is spent + explicit action request).  
  - **Instructor as Backup:** If Clerk caves to pressure, step in: "As per protocol: What requires me to enter it?"  

  ---

  #### **Predictable Problems & Solutions**  
  1. **House burns all 8 cards on conditionals and feels cheated:**  
     - *In debrief:* "Your frustration mirrors Achilles’. Carroll shows no premise *forces* inference. We need something else."  

  2. **Clerk caves or turns pedantic:**  
     - *Prevent:* Drill Clerks to be "boringly scrupulous." If Clerk caves, instructor overrules: "Script says: ‘What requires me?’"  

  3. **House declares, "The game is rigged!" and quits:**  
     - *Leverage:* "This is diagnostic! In debrief, we’ll discuss why the rules felt unfair. Carroll implies logic itself might be ‘rigged’ this way."  

  4. **House uses truth tables/formalism:**  
     - *In Round 2:* Clerk enters as premise (e.g., "Truth tables prove C") → regress continues.  
     - *In Round 3:* Let them submit a formal rule as *action* (success). Debrief: "Formal rules work as tools, not premises."  

  5. **Time loss due to engagement:**  
     - Use loud timer. Enforce hard stops: "Pencils down. Ledgers closed." Debrief: "The regress is absorbing—Carroll’s point is it’s *infinite*, but we have finite time."  

  ---

  #### **What the Activity Cannot Do**  
  - **Interpersonal ≠ Internal:** The Clerk is an external blocker, but Carroll’s regress concerns *internal* reasoning. *Mitigation:* Debrief emphasizes: "Your Round 2 frustration—’Why won’t they just *see* it?’—is Carroll’s worry about individual justification."  
  - **Tokens ≠ Resources:** Tokens may imply a "cost" problem, not a logical one. *Mitigation:* Stress in debrief: "Tokens were just prompts. The regress is about justification, not effort."  
  - **No Viciousness/Unreasonableness Proof:** Activity shows regress occurs, not that it’s vicious or that the Tortoise is wrong. *Mitigation:* Post-activity lecture argues: "The regress is vicious because it never yields justification. The Tortoise is unreasonable because they ‘accept’ the rule but won’t act on it."  
  - **No Resolution Validation:** Activity lets students *try* solutions (e.g., rules-as-actions), but doesn’t prove them correct. *Mitigation:* Post-debate: "We’ve seen options. Now we evaluate them."  

  ---

  **Final Note:** This design forces hands-on collision with the regress. Students exit grasping *why* Carroll’s puzzle matters, setting up deeper analysis. The debrief’s "options menu" avoids dogma, inviting students into ongoing debate.
