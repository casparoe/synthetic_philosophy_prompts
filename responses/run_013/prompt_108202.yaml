prompt: |-
  Hey, I could use some help diagnosing a disagreement rather than settling it, so please don't just tell me which side is right. I'm in a political theory reading group (mostly grad students, plus one retired judge who keeps us honest) and we've been circling the same fight about the Condorcet jury theorem for what feels like months. Roughly the split is this: one camp treats the theorem as the formal backbone of the case for democracy — if each voter is even a bit more likely than not to get a binary question right, and their votes are independent, then a majority is far more likely to be right than any single voter, so majority rule is a truth-tracking device and that's a point in its favour. The other camp says that's a bait and switch, because the very same theorem cuts the other way the moment average competence dips below one half, or the votes stop being independent, or the question isn't binary — and since none of those conditions really hold in a live electorate, the theorem tells you nothing about actual democracies. Both sides know the math cold; nobody is confused about what the theorem states; and yet we go round the same loop every week and nobody's position moves an inch. I want you to act like a philosopher of social science and give me a diagnosis, not a verdict. Is this a substantive disagreement, a verbal one about what "supports democracy" is supposed to mean, or two groups answering two different questions — one about the epistemic properties of a decision rule, one about the justification of a political system — that happen to share a single label?

  My own hunch, and I'd rather you test it than just agree with it, is that the fight is really about what the theorem is even a theory *of*: a description of how votes aggregate, versus a normative premise about why aggregating them that way is legitimate — and that once you pry those apart the apparent contradiction dissolves. So please start by laying out the actual moving parts of the theorem and its known failure modes in your own words (the competence and independence assumptions, what happens under correlation or strategic voting, the binary-choice restriction, the below-one-half reversal), then say which type of disagreement best fits and why, drawing on what each side would actually say rather than a caricature. Then tell me what, if anything, would count as progress here — a distinction, a formal result, a reinterpretation of what's being claimed, a change of question — or whether this is one of those disputes where the honest answer is that no amount of cleverness will move it and we should stop expecting it to. And no reading list, please; we've all read the usual stuff, I'm after your diagnosis. Take your time and reason it through step by step before you commit to an answer.
reasoning: |-
  Alright, let me unpack this user's query. They're part of a political theory reading group stuck in a loop debating the Condorcet jury theorem. Both sides understand the math but can't move past their positions. One sees it as a backbone for democracy's truth-tracking; the other dismisses it as inapplicable to real conditions. The user wants a diagnosis, not a solution.

  First, I need to recall the theorem's core: binary choices, voter competence above 0.5, independence. The magic happens when majority decisions amplify correctness. But the criticisms are valid—real elections have correlated votes, competence below 0.5, non-binary issues. 

  The user's hunch is that the disagreement is about what the theorem is a theory *of*. That makes sense. The pro camp might be focusing on the ideal epistemic properties, while the con camp stresses empirical applicability. It's not that either is wrong; they're emphasizing different aspects.

  I should map out the moving parts of the theorem and its failure modes clearly. Competence thresholds and independence are key. When competence drops below 0.5, majorities are more likely to be wrong—that's crucial. Correlation and strategic voting break independence, which the critics highlight. 

  The substantive disagreement seems to be about the purpose of formal models. Is the theorem a normative justification or a descriptive tool? The pro side might argue that it shows democracy's potential under ideal conditions, justifying its structure. The con side counters that if those conditions don't hold, the justification collapses. 

  Verbal disagreements might lurk in terms like "supports democracy." Does it mean ideal justification or practical advice? Also, different questions: one about decision rules' properties, the other about real-world systems. 

  Progress could involve distinguishing between ideal justifications and applicability. Maybe introducing concepts like robustness or empirical checks. But if the groups value different things—principles vs. practicality—common ground might be tough. The user should guide the group to articulate their underlying commitments. 

  The user’s role as a philosopher of social science is to dissect these layers without taking sides. Highlighting the divergence in what each camp expects from the theorem could clarify why the debate persists. The real issue might be unspoken assumptions about how theory relates to practice.
answer: |-
  Here’s a step-by-step diagnosis of your reading group's deadlock, structured to test your hunch without imposing a verdict. I’ll break it into core components:

  ### 1. **The Theorem’s Moving Parts (Neutral Recap)**  
     - **Binary Choice**: The theorem applies *only* to yes/no questions (e.g., "Is Policy X just?").  
     - **Competence (p > 0.5)**: Each voter must be independently more likely correct than incorrect.  
     - **Independence**: Voters’ judgments aren’t influenced by others or common biases.  
     - **The Upshot**: When these hold, majority accuracy → 1 as voters increase.  
     - **Failure Modes**:  
       - **p < 0.5**: Majority accuracy → 0 (worse than individuals).  
       - **Correlation**: Shared biases (e.g., media, ideology) erode the "wisdom of crowds" effect.  
       - **Non-Binary Choices**: No Condorcet winner may exist (cycling preferences).  
       - **Strategic Voting**: Voters misrepresent beliefs, breaking independence.  

  ### 2. **Diagnosing the Disagreement Type**  
  Your hunch is correct: **the core clash is about the theorem's *role*—descriptive model vs. normative foundation**. But it manifests in three intertwined layers:  

  #### **A. Substantive Disagreement: What Does the Theorem *Explain*?**  
     - **Pro-Camp Focus**: The theorem isolates democracy’s *unique epistemic mechanism*. Even if idealized, it reveals why majority rule *can* amplify truth under specific conditions—and thus why designing institutions to *approximate* those conditions (e.g., secret ballots, deliberation) is normatively compelling.  
     - **Con-Camp Focus**: The theorem’s fragility shows it cannot ground real-world legitimacy. If p<0.5 is common (e.g., complex issues) or correlation is inevitable (e.g., polarization), the theorem’s "proof" of superiority vanishes. It’s not just idealized—it’s *misleading* when applied naïvely.  
     - **Diagnosis**: Both agree on math but disagree on **whether the theorem’s *ideal case* illuminates or obscures democracy’s justificatory core**.  

  #### **B. Verbal Disagreement: What Does "Supports Democracy" Mean?**  
     - **Pro-Camp**: "Supports" = reveals an *epistemic virtue unique to majority rule*. Even if imperfectly realized, this virtue distinguishes democracy from dictatorship or oligarchy.  
     - **Con-Camp**: "Supports" = provides a *practically applicable justification*. If the theorem’s assumptions fail in practice, it cannot defend real democracies.  
     - **Diagnosis**: **"Support" equivocates between *theoretical insight* and *institutional justification***. The pro-camp sees a "point in favour" as a conceptual strength; the con-camp demands empirical relevance.  

  #### **C. Divergent Questions: Epistemology vs. Legitimacy**  
     - **Pro-Camp Question**: "Can majority rule, *in principle*, produce better decisions than individuals?" (Answer: Yes, under strict conditions.)  
     - **Con-Camp Question**: "Does this theorem justify *actual democratic systems*?" (Answer: No, due to unmet assumptions.)  
     - **Diagnosis**: **These are different questions**. The first is about decision rules abstractly; the second about political legitimacy historically/sociologically.  

  ### 3. **Why the Loop Persists**  
     - **Pro-Camp’s Unspoken Premise**: Normative theories *require* idealization (e.g., "veil of ignorance" in Rawls). The theorem shows democracy’s *potential*, guiding institutional design.  
     - **Con-Camp’s Unspoken Premise**: Political legitimacy requires *actual* truth-tracking. If voters are misinformed/polarized, the theorem’s reversal (p<0.5) indicts democracy.  
     - **Stalemate Engine**: Each side negates the other’s frame. Pro: "You dismiss the core insight!" Con: "You ignore reality!"  

  ### 4. **Pathways to Progress (Without Resolution)**  
     - **Reframe the Question**: Shift from "Does the theorem support democracy?" to **"What does this theorem teach us about democracy’s *strengths and vulnerabilities*?"** Example:  
       - It *does* show why combating misinformation (p>0.5) and filter bubbles (independence) is institutionally urgent.  
       - It *doesn’t* prove democracies will outperform experts on climate science (non-binary, low p).  
     - **Introduce Robustness Analysis**: Discuss formal work showing *how much* correlation/competence can deviate before majority gains vanish. This forces engagement with **degrees** (not binaries) of applicability.  
     - **Separate Justification Layers**: Distinguish:  
       - *Epistemic justification*: Does majority rule have truth-tracking properties?  
       - *Procedural justification*: Is it fair/stable?  
       - *Empirical justification*: Do real democracies out-perform alternatives?  
       The theorem speaks *only* to the first—and only conditionally.  
     - **Concede Ground**: Pro-camp could acknowledge that the theorem’s reversal (p<0.5) is a major threat (e.g., in polarized societies). Con-camp could concede that the theorem explains why democracies *invest in education/secrecy* (to uphold p>0.5/independence).  

  ### 5. **Will This Move the Needle?**  
     - **Optimistic Case**: If both sides accept they’re debating **what counts as a "foundation" for legitimacy** (ideal vs. actual), they might map where the theorem *does* and *doesn’t* apply.  
     - **Pessimistic Case**: If the pro-camp seeks an inviolable normative pillar and the con-camp demands empirical vindication, **no progress is possible**. The gap is about what justifies political authority—not Condorcet.  
     - **Your Role**: As facilitator, *force explicit statements of unspoken premises*. Ask:  
       - *"What would falsify your view of the theorem’s importance?"*  
       - *"Is any idealization permissible in justifying democracy?"*  

  **In Sum**: Your hunch holds. The deadlock isn’t about Condorcet—it’s about **whether normative political theory is allowed to idealize**. The theorem is a Rorschach test for deeper commitments: one side sees a beacon of democracy’s possible wisdom; the other, a distraction from its actual dysfunctions. Progress requires unpacking *those* commitments—or agreeing to disagree on first principles.
