prompt: |-
  I am a journalist who covers social policy and the ideas that underpin it, and I am writing a long read on how the benefits appeals system reasons at its margins — the cases where the medical evidence is thin and something else is doing the work. To that end I have spent three months sitting in on the hearings of an independent panel that hears appeals against decisions on a disability benefit payable only on proof of incapacity for work. The panel issues short reasoned decisions, so I have a usable track record. Over the past year it has:

  - allowed the appeal of a 38-year-old woman with severe anxiety and agoraphobia who leaves home only in her sister's company, but who volunteers two mornings a week in a charity shop with that sister beside her;
  - allowed the appeal of a 61-year-old man in the early stages of dementia, still able to perform long-familiar routine tasks but unable to learn a new till or rota system;
  - allowed the appeal of a 29-year-old man whose migraine incapacitates him for roughly eight days in twenty-eight, and who has twice been dismissed for sickness absence, on the ground that no employer in the real labour market would keep him on;
  - dismissed the appeal of a 54-year-old former roofer whose knees no longer permit kneeling or climbing but who can sit at a desk for an hour at a stretch, on the ground that desk work exists;
  - dismissed the appeal of a 45-year-old man with chronic low back pain, an unremarkable scan, a GP note that describes pain behaviour rather than demonstrable pathology, and two abandoned courses of physiotherapy;
  - dismissed the appeal of a 33-year-old woman with well-controlled type 1 diabetes and no complications, on the ground that a managed condition is not an incapacity.

  Next month the panel hears a 47-year-old man with a long history of alcohol dependence, now abstinent for fourteen months and attending a weekly mutual-aid group; mild alcohol-related changes in the liver, but no cirrhosis; no qualifications and six years out of paid work; and some fifteen hours a week spent caring for his mother, who has advanced Parkinson's disease. His GP supports the claim. He says he could not hold down a job and do the caring.

  I do not need the statute or the case law, and I am not asking you to reconstruct the law. What I want is the panel's own logic. Predict how it will decide; set out the two or three rules that fit its existing decisions equally well and say what each of those rules predicts about this case; give me your best guess and the reason for preferring it; and name the case I should watch for in the coming year that would tell those rules apart. If you think the existing decisions genuinely underdetermine the outcome, say so, and tell me what principle the panel would be committing itself to on either reading. Please write in British English.
reasoning: |-
  Okay, the user is a journalist covering social policy, specifically the appeals system for disability benefits. They've observed several cases and need help predicting the outcome of an upcoming case involving a 47-year-old man with a history of alcohol dependence now caring for his mother with Parkinson's. The key is to infer the panel's logic from past decisions without referencing statutes or case law.

  Looking at the cases provided, patterns emerge. The panel seems to prioritize functional impairment over diagnoses. For instance, they granted appeals where claimants had clear barriers to employment: severe anxiety limiting outings alone, dementia preventing new learning, migraines causing frequent absences. Conversely, they dismissed cases where residual capacity existed, like the roofer who could do desk work or the diabetic with controlled symptoms.

  The upcoming case has several factors: 14 months' sobriety, mild liver changes, caregiving responsibilities, and no recent work history. The GP supports the claim, but the panel typically looks for concrete evidence of incapacity. The caregiving hours might demonstrate capability, possibly undermining his claim. 

  The user wants rules that fit past decisions. Rule 1: "incapacity requires evidence of functional barriers to employment." Rule 2: "caregiving activities can indicate work capacity." Both rules are consistent with past outcomes. For the new case, Rule 1 might lead to dismissal due to lack of evidence, while Rule 2 would dismiss based on caregiving. 

  The journalist should watch for cases where caregiving is present but distinct from work capacity, testing if the panel separates these domains. My best guess is dismissal, as caregiving likely signals residual capacity, aligning with the roofer and back pain cases. The key is whether caregiving translates to employability in the panel's view.
answer: |-
  Based on the pattern of decisions observed, the panel's logic appears to focus on **concrete, functional barriers to sustained employment in the real labour market**, rather than diagnoses or GP support alone. Here's the breakdown:

  **Inferred Core Logic from Past Decisions:**
  1.  **Functional Impact Trumps Diagnosis:** The panel looks beyond the medical label to the *actual effect* on work capability. Thin medical evidence or managed conditions (diabetes, unremarkable back scan) aren't sufficient without proof of functional impairment preventing work. Conversely, significant functional barriers (agoraphobia preventing solo travel/attendance, dementia preventing new learning, unpredictable migraines causing dismissals) justify allowance.
  2.  **The "Real Labour Market" Test:** Incapacity isn't abstract; it's judged against what employers would realistically tolerate. This is explicit in the migraine case (dismissals prove unemployability) and implicit elsewhere (employers won't accommodate a worker needing constant supervision like the agoraphobic, or unable to learn basic systems like the dementia patient). Conversely, if *some* suitable work theoretically exists (desk work for roofer), the appeal fails.
  3.  **Activity as Evidence of Capacity:** Demonstrated ability to perform regular, structured activities (volunteering 2 mornings/week, 15 hours caring/week) can be strong evidence *against* incapacity for *some* form of work, unless the activity is demonstrably incompatible with employment (e.g., needing constant supervision, or being entirely home-based while caring).

  **Rules Fitting Existing Decisions Equally Well:**
  *   **Rule A (Stricter Functional Barrier):** An appeal is allowed *only* if the claimant demonstrates a specific, insurmountable functional barrier (e.g., inability to learn, unpredictable/unmanageable absences, need for constant supervision) that *no employer in the real labour market* could reasonably accommodate, irrespective of other activities like volunteering or caring. Medical evidence helps substantiate this barrier but isn't decisive alone.
      *   *Prediction for New Case (Rule A):* **Dismiss.** While abstinent, his mild liver changes don't create a clear functional barrier. Caring for 15 hours/week demonstrates significant structure, responsibility, and physical/cognitive capacity. "Could not hold down a job and do the caring" isn't seen as a *specific functional barrier to work itself*, but rather a time commitment/scheduling issue, which employers might potentially accommodate (e.g., part-time, flexible hours). GP support lacks concrete functional evidence. The lack of recent work/qualifications is a labour market issue, not proof of *incapacity*.
  *   **Rule B (Activity as Proxy for Work Capacity):** Regular, sustained, structured non-work activity (like volunteering or significant caring) is treated as prima facie evidence of *potential* capacity for some form of paid work, unless the activity is demonstrably only possible due to unique conditions (e.g., sister's supervision) that couldn't exist in employment. The burden shifts to the claimant to prove why this capacity doesn't translate to *any* job.
      *   *Prediction for New Case (Rule B):* **Dismiss.** Caring for 15 hours/week is substantial, regular, and requires responsibility, planning, and likely physical/emotional effort. This strongly suggests an underlying capacity for structured activity incompatible with a claim of total work incapacity. The panel would likely argue that if he can manage complex care needs for 15 hours, he likely has the residual capacity for *some* form of part-time or flexible work. His reasons for not working (caring commitment, lack of recent work/quals) are not accepted as proof of *incapacity*.

  **Best Guess & Reason for Preference:**
  *   **Prediction:** **Dismiss the appeal.**
  *   **Reason for Preference:** The case most closely resembles the **dismissed appeals**, particularly the roofer and the back pain claimant.
      *   Like the roofer (who retained sitting capacity), the carer demonstrates significant functional capacity through his caring role. The panel is likely to see 15 hours/week of demanding care as evidence he *can* perform sustained, responsible activity.
      *   Like the back pain claimant (thin medical evidence, abandoned treatment), the medical evidence here is mild (liver changes) and the primary barrier claimed (caring commitment) isn't a recognised *functional incapacity* preventing work tasks; it's a competing demand. The GP support likely lacks the concrete functional evidence the panel requires.
      *   The panel consistently requires proof of a barrier *intrinsic* to the claimant that prevents work performance in the real world. His caring commitment, while commendable and potentially a practical barrier to *finding* work, is extrinsic. His history (alcohol, lack of quals) speaks to employability hurdles, not medical incapacity.
      *   The "real labour market" test cuts against him: the panel will likely reason that employers *do* offer part-time, flexible, or less skilled roles that could potentially accommodate his caring schedule *if* he had the functional capacity, which his caring suggests he does.

  **The Case to Watch (To Tell Rules A & B Apart):**
  Watch for a case involving a claimant engaged in **significant, regular voluntary work (15+ hours/week) that is highly structured and demanding (e.g., charity shop supervisor, community transport driver), but who claims specific, severe functional barriers directly preventing *paid* employment that aren't accommodated in their voluntary role.**

  *   **Scenario:** A claimant volunteers 20 hours/week as a receptionist at a community centre (requiring attendance, customer interaction, basic admin). They claim severe anxiety triggered specifically by performance pressure, financial responsibility, or formal supervision inherent in *paid* employment, which is absent or mitigated in their voluntary role. They have strong medical/psychological evidence detailing this specific trigger and its disabling effect *only* in a paid work context.
  *   **How it Tells Rules Apart:**
      *   Under **Rule A (Stricter Functional Barrier):** If the specific barrier to paid work (e.g., crippling anxiety triggered by pay/supervision pressure) is well-evidenced and deemed insurmountable in the real labour market, the appeal might be **allowed**, *despite* the volunteering. The volunteering demonstrates capacity *only* under unique, low-pressure conditions not replicable in paid work.
      *   Under **Rule B (Activity as Proxy):** The significant volunteering in a role resembling paid work would be seen as overwhelming evidence of general work capacity. The claim of a barrier *only* applying to paid work might be viewed sceptically as a distinction without a functional difference, leading to **dismissal**. The panel might argue the anxiety, if real, should also prevent the volunteering.

  **Conclusion on Determination:**
  The existing decisions strongly point towards dismissal in the upcoming case. The panel prioritises tangible evidence of functional incapacity preventing *any* realistic employment. The claimant's substantial caring responsibilities provide compelling evidence of residual capacity for structured activity, outweighing the mild medical evidence and GP support. The core issue – the time commitment of caring – is viewed as a practical or employability problem, not proof of *medical* incapacity for work. The case to watch involves complex volunteering that tests whether the panel accepts barriers uniquely disabling in the *paid* work environment.
