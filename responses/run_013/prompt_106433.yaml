answer: |-
  This is a **metalinguistic negotiation** or, more precisely, a case of **foundational conceptual prioritization**.

  *   **Definition:** A dispute where parties agree on all non-normative/empirical facts and acknowledge the semantic ambiguity of a key term (e.g., "could have done otherwise," "free will"), but disagree fundamentally about *which concept* (or semantic reading) is the relevant, important, or correct one to apply in the given philosophical/contextual framework. The disagreement is about which concept *ought to be the focus* of the debate.
  *   **How it differs:**
      *   **From Equivocation:** Equivocation involves *unintentionally* switching between meanings of an ambiguous term, leading to faulty reasoning. Here, both sides explicitly recognize the ambiguity and *intentionally* focus on their preferred meaning. The dispute is transparent.
      *   **From Merely Verbal Disputes:** A merely verbal dispute is resolved *entirely* by clarifying definitions – once meanings are aligned, agreement follows. Here, clarifying definitions *reveals* the deeper disagreement: even after agreeing on facts and meanings, they still disagree about *which definition captures the philosophically significant concept*. Resolving the ambiguity doesn't resolve the core normative disagreement about conceptual relevance.
  *   **The Core Conflict:** The fight isn't *just* about word meanings; it's about which underlying *concept* (e.g., alternative possibilities absent determinism vs. reasons-responsiveness within determinism) is essential to the phenomenon in question (free will, moral responsibility). It's a clash over philosophical priorities and the nature of the phenomenon itself.
  *   **Examples Outside Free Will:**
      *   **"What is Art?":** Parties agree on an object's physical properties and history but disagree whether "art" requires intentional creation, aesthetic value, or institutional acceptance. The fight is over which criterion *matters* for "art."
      *   **"Is Pluto a Planet?":** Parties agree on Pluto's size, orbit, and composition. The disagreement is over *which defining characteristics* (e.g., clearing its orbit) are essential for the concept "planet."
      *   **"Is this action just?":** Agreement on the action's consequences and context, but disagreement over whether "justice" requires equality of outcome, equality of opportunity, or procedural fairness.

  **In essence:** It's a meta-disagreement about *which concept* should ground the first-order discussion, arising precisely *because* the key term is ambiguous and the parties hold different views on which concept the term *should* pick out in the relevant philosophical context. The free will debate often crystallizes around this foundational prioritization of concepts underlying "could have done otherwise" and "free will."
