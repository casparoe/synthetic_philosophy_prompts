prompt: |-
  I'm in a formal epistemology seminar and we just did van Fraassen's reflection principle — the claim that your current credence in A should equal your expected future credence in A. I have to write a paper that picks out which open questions about it are actually worth working on, not a lit review (assume I can't go read anything). The thing that bugs me: if I know that tomorrow I'll read some slick but misleading argument and my credence in something drops to 0.3, reflection seems to say I should already be at 0.3 now, which cant be right. Is that the real crack in the principle or just a side case? And what happens when the future me is predictably worse off — drugged, sleep-deprived, or amnesiac?

  So which open questions about the reflection principle matter most, and which two or three should someone with one semester and decent bayesian machinery actually prioritize? Rank them and defend the ranking — which ones other questions hang on, which are tractable, which are basically settled or dead ends. I care way more about the reasoning than the list.
reasoning: |-
