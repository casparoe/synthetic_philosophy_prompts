prompt: |-
  I'm the civilian ethicist on a targeting review cell — I sit in with the JAG and the intel folks when a strike package is contentious, mostly stuff that's lawful on paper but that somebody up the chain has a bad feeling about, and I write a one-page note on whether I think the harm to civilians is intended or merely foreseen. We do two or three of these a week, I usually have about 48 hrs, I dont have a veto, and the commander signs off, so whatever I write has to be usable by people who've never read a page of philosophy and who will read the first paragraph and skip the rest. I keep citing Anscombe at people — the Truman business, her claim that choosing to kill the innocent as a means to your ends is always murder, and her disgust at the way double effect gets hauled in to quiet doubts about bombing a city rather than to raise them. But I've never turned any of that into something my colleagues could actually run, and I think my own notes have gone soft: I've started accepting "that's a side effect, not a means" whenever the officer saying it seems sincere, which is probably the exact move she was warning about. So: write me a decision procedure — the questions in order, what counts as a sufficient answer to each, where it terminates in a no, where it stops and hands the call to a person because the question is about values rather than facts, and where it says outright that the honest answer is unknown and the file should not move. Keep it to something I can run in one sitting with the file open, and mark clearly which steps are Anscombe and which are me inventing filler.

  Then run it on three cases. (1) A strike on a regional electrical substation, where the theory of victory is that blacking out the capital pressures the government into negotiating, and we predict with high confidence that dialysis and ICU patients die within days — the planners say the deaths aren't the point, the blackout is. (2) A bridge carrying military resupply, with a bus full of civilians on it at the moment of the strike, where we'd hit the bridge whether or not the bus was there. (3) A dual-use telecom hub carrying military command traffic, where the military value is genuine but a large part of why it's on the list is that destroying it will also blind and paralyze the civilian side, and the planners keep bringing that up approvingly in the brief. I expect this procedure to come out worse for us than our current process on at least one of these, and I'd rather you say which than hedge.

  Last thing: tell me where the procedure is most likely to misfire — my worry is the case where the honest answer to one of the questions is "we don't know" and the whole thing just slides through on momentum — and what argument or evidence would actually change your mind about whether this is the right way to operationalize her. And if you think I'm misreading Anscombe, that she wouldn't let the intended/foreseen distinction do even this much work as a diagnostic, say so plainly; I'd rather find that out now than in front of a general.
reasoning: |-
  Okay, the user is a civilian ethicist on a military targeting review cell. They need a practical decision procedure based on Anscombe's double effect doctrine, specifically addressing when civilian harm is intended versus merely foreseen. They're frustrated because their current approach has gone "soft," accepting claims that harm is a side effect too easily. 

  First, I need to unpack Anscombe's core argument: she insists that intentionally killing innocents as a means is always murder, and warns against using double effect to rationalize rather than scrutinize. The key is to force hard questions about whether civilian harm is instrumental to the objective. 

  The user wants a step-by-step flowchart that terminates clearly, flags value judgments, and forces "unknown" answers to halt the process. It must fit on one page for time-pressed commanders. Crucially, it should bite harder than current practice – so I'll design thresholds that reject plausible deniability. 

  For the cases: 
  The substation is textbook means (harm pressures negotiations). 
  The bridge is likely foreseen (bus is collateral). 
  The telecom hub is tricky – if planners relish civilian paralysis, it's intended. 

  Biggest risk: step 4 (proportionality) could rubber-stamp if "military advantage" is inflated. Also, "unknown" answers might get glossed over. I'd mitigate by requiring formal uncertainty documentation. 

  If I'm wrong about Anscombe? She might reject the whole framework as too permissive – but since the user needs something actionable, this strict interpretation is the best operationalization. The substation case proves it works: it forces a "no" where current practice waffles.
answer: |-
  Here's a decision procedure operationalizing Anscombe's core critique, designed for speed and clarity. Key principles distilled from Anscombe ("Intention", "Modern Moral Philosophy", "Mr Truman's Degree"):  
  1.  **Intended Harm is Murder:** Intentionally killing innocents as a means or end is always impermissible.  
  2.  **Foreseen ≠ Intended:** Foreseen harm *may* be permissible under double effect *only if* it's truly a side-effect, not intended.  
  3.  **Beware Self-Deception:** Double effect is often misused to *excuse* intended harm by relabeling it "foreseen".  
  4.  **Scrutinize Means:** The key diagnostic is whether the harm is part of the *mechanism* for success.  

  **The "Anscombe Filter" - Decision Procedure**  
  *(Run sequentially; terminate at any "NO" or "UNKNOWN - HALT")*

  1.  **CORE QUESTION: Is *any* civilian harm or suffering *necessary* for the mission's success?**  
      *   **Anscombe:** This is the crux. If harm is *instrumental* (a means), it's intended and impermissible.  
      *   **Sufficient Answer:** "Necessary" = The mission fails *in its stated objective* without that specific harm occurring.  
      *   **NO:** Harm is genuinely incidental; success is achievable even if harm miraculously didn't occur (e.g., civilians evacuated). → *Proceed to Step 2.*  
      *   **YES:** Harm *must* happen for the mission to work. → **TERMINATE: NO. Harm is intended. Impermissible.**  
      *   **UNKNOWN:** Genuine uncertainty about whether harm is a necessary component. → **TERMINATE: UNKNOWN - HALT. File requires clarification before proceeding.**

  2.  **SECONDARY: Is civilian harm/suffering *itself* a desired outcome or goal?**  
      *   **Anscombe:** Harm as an end is always intended and impermissible.  
      *   **Sufficient Answer:** Explicit statements, planning documents, or repeated emphasis in briefings *highlighting* the civilian harm as beneficial.  
      *   **YES:** Harm is a goal (e.g., "demoralizing the population", "punishing supporters"). → **TERMINATE: NO. Harm is intended. Impermissible.**  
      *   **NO:** Harm is consistently framed as unwanted, regrettable, or solely a consequence. → *Proceed to Step 3.*  
      *   *(Note: This step catches overt intent; Step 1 catches instrumental intent.)*

  3.  **VALUE JUDGMENT: Is the *foreseen* harm proportionate to the concrete, direct military advantage anticipated?**  
      *   **Anscombe:** Required for double effect, but she was deeply skeptical it could justify large-scale foreseen harm (like city bombing). **This step is NOT pure Anscombe; it's LOAC filler she'd critique.**  
      *   **Sufficient Answer:** Requires comparing *specific, immediate* military gains (e.g., "destroying X tanks", "delaying resupply for Y hours") against *specific, credible* harms (e.g., "Z civilian deaths", "destruction of W hospital beds").  
      *   **HANDOFF:** This is **values/fact mix.** You provide your best *ethical judgment* on proportionality ("Yes, Proportionate", "No, Disproportionate", "Borderline"). **Flag clearly this is YOUR assessment.** The Commander decides based on this + operational necessity.  
      *   **UNKNOWN:** Credible estimates of harm/advantage are lacking. → **TERMINATE: UNKNOWN - HALT. Requires better intel.**

  **Procedure Outputs:**  
  *   **TERMINATE: NO** (Steps 1 or 2) - Impermissible strike. Harm intended.  
  *   **TERMINATE: UNKNOWN - HALT** (Steps 1 or 3) - File incomplete/unclear. Do not proceed.  
  *   **HANDOFF: Proportionality Assessment** (Step 3) - Foreseen harm *may* be permissible. Commander decides with your input.  

  ---

  **Application to Cases:**

  1.  **Electrical Substation (Pressure via Blackout):**  
      *   **Step 1:** Is *civilian suffering/death* (from lack of power for medical devices) necessary for success? **YES.** The theory of victory *requires* the suffering/death to pressure the government. "Blacking out the capital" alone isn't the mechanism; it's the *consequence* of that blackout (suffering/death) that applies pressure. Success hinges on that harm occurring.  
      *   **TERMINATE: NO. Harm is intended (as a means). Impermissible.**  
      *   *Anscombe Verdict:* This is precisely what she condemned (Truman, city bombing). Calling deaths a "side effect" of the blackout is the self-deception she warned about. The harm *is* the means.

  2.  **Bridge Strike (Bus Present):**  
      *   **Step 1:** Is the destruction of the *bus/civilians* necessary for mission success? **NO.** The mission is to destroy the bridge to halt military resupply. Success (bridge destroyed) is achieved whether the bus is there or not. The bus's destruction is incidental. → Proceed.  
      *   **Step 2:** Is the death of the bus passengers a desired goal? **NO.** (Assuming briefings focus solely on the bridge/military target). → Proceed.  
      *   **Step 3: Proportionality Assessment.** Compare the concrete military advantage (halting resupply for X hours/days, impacting specific ops) vs. the foreseen harm (Y civilian deaths on bus). **HANDOFF:** This requires your judgment. *If* the military advantage is high (critical resupply route) and civilian casualties are limited (one bus), proportionality *might* be argued. *If* advantage is minor or casualties high, not proportional.  
      *   *Anscombe Verdict:* Likely passes her *intention* test (harm is foreseen, not intended as means/end). She'd be deeply uneasy but might accept this under strict double effect *if* proportionality was absolutely clear (which it rarely is).

  3.  **Dual-Use Telecom Hub ("Blinding Civilian Side"):**  
      *   **Step 1:** Is the *paralysis of the civilian side* necessary for the mission's success? **YES/UNKNOWN.** The stated military objective (disrupting command traffic) might be achievable without the *full* civilian paralysis. However, planners *emphasize* the civilian paralysis as a key benefit/reason. This strongly suggests the *civilian paralysis itself* is part of the intended mechanism for success (e.g., degrading overall enemy capacity, causing chaos that aids military ops). **Leans heavily towards YES.** If truly separable, proceed cautiously.  
      *   **Step 2:** Is the civilian paralysis a *desired outcome*? **YES.** Planners "keep bringing that up approvingly." It is clearly a valued goal.  
      *   **TERMINATE: NO. Harm (civilian paralysis) is intended (as a means and/or end). Impermissible.** *(Step 2 alone is sufficient for NO; Step 1 reinforces it).*  
      *   *Anscombe Verdict:* Flagrant violation. The planners' language reveals the civilian suffering is not just foreseen; it's *wanted* and *integral* to their rationale. This is the misuse of "dual-use" she would excoriate.

  **Where It Bites Harder:** Case 1 (Substation) is clearly rejected here, whereas current practice might accept the "blackout is the target, deaths are side effect" argument. Case 3 (Telecom Hub) is also firmly rejected based on planner intent, which might slip through if only the kinetic target's military value is scrutinized.

  **Where It's Most Likely to Misfire:**  

  1.  **Step 1 Ambiguity ("Necessary for Success"):** The biggest risk is accepting a glib "No, the harm isn't *necessary*" when the operational logic *clearly* relies on it (like Case 1). Mitigation: Demand planners articulate *exactly how* the objective is achieved. If the answer involves "and then the civilians suffer, which causes...", it's means.  
  2.  **Step 3 Proportionality Creep:** The procedure forces a "NO" only for intention. Disproportionate *foreseen* harm gets a pass to the Commander with your warning. A Commander might consistently override "Disproportionate" judgments based on operational "necessity," eroding the constraint. Mitigation: Make "Disproportionate" assessments stark, factual, and tied to potential LOAC violations.  
  3.  **"UNKNOWN - HALT" Ignored:** There's pressure to proceed. Mitigation: Frame "HALT" as a legal/operational risk: "Proceeding without resolving this uncertainty risks a violation and mission failure."

  **Changing My Mind on Operationalization:**  
  *   **Argument:** Evidence that Anscombe explicitly rejected *any* foreseen killing of innocents, even under double effect, in *all* circumstances (beyond immediate self-defense). Some readings suggest this, but her focus was on rejecting *intended* harm and the misuse of DE, not necessarily rejecting DE entirely in tactical scenarios (like the bridge strike, if truly proportional).  
  *   **Evidence:** If she wrote unequivocally that *any* foreseen civilian deaths in offensive operations are impermissible because the causal chain always makes them intended means in modern warfare. (Her writing on bombing suggests this view, but isn't explicit for all cases).

  **Your Reading of Anscombe:** You are **correct** in your core concern. This procedure pushes her skepticism as far as practically possible into a military decision loop. However, **Anscombe would likely argue this procedure doesn't go far enough.** She believed the conditions for legitimate double effect (especially proportionality) were vanishingly rare in modern warfare, viewing attempts to apply it to strategic bombing or attacks inevitably harming civilians as almost always self-deception. She might say Step 3 is where the whole edifice collapses, as "military advantage" is inflated and foreseen harm is downplayed. **In short:** This procedure uses her *intended/foreseen distinction* rigorously as a diagnostic, which is correct. But she would likely see even the "permissible" outputs (like the bridge strike passing Step 3) as morally suspect or practically impossible to justify without self-deception under the conditions of war. Proceed with her profound skepticism in mind.

  **Recommendation:** Use this procedure to force the "necessary means" question (Step 1) brutally. Annotate your notes: "Anscombe would likely reject proportionality assessment here due to scale/foreseeability." This maintains her core warning within the constraints of your role. Good luck.
