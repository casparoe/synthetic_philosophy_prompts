prompt: |-
  I do the records for a small maritime heritage trust — we own one old sailing vessel, a couple of sheds, and about four hundred feet of spare timber, and I'm the one who has to write the paperwork whenever a question comes up about whether the thing we've got is still the same boat. I never went to university, but I've been reading around the old Theseus puzzle for a few years now and I've got a feeling its not just a puzzle, it's basically my job, and I keep getting it wrong.

  The decisions come up maybe six times a year and they all seem to want different answers. The insurer wants to know if a rebuilt hull counts as the same vessel so the policy carries over. The heritage listing people want to know if it's still the listed ship or a new one. The donors want to know if their grandfather's plank is still in it. If we ever sold her or broke her up, someone would ask whether we're selling the ship or just a pile of timber shaped like a ship. And there's a rival group down the coast who built a replica off the original lines and are now going round saying they've got the real continuation of her, which makes me want to hit someone.

  Could you write me a procedure I can actually run: a list of questions in the order I should ask them, what counts as a good enough answer to each, where the procedure just stops and says no, and where I should stop pretending it's a factual question and take it to the trustees as a decision about what we want the ship to mean. I think the one thing I've half worked out for myself is that "the same ship" isn't one question, it's several — same for the insurance, same for the listing, same for the visitors — so the procedure has to be able to come out differently for different purposes without me looking like I'm just making it up as I go. I'd also like it to cope with the fact that a ship is a bit like a company or a club: it outlives every plank and every member and somehow carries on, and I don't know if that's a real thing or just a way of talking. Please explain any jargon in plain words, I don't know what sortal means and I looked it up once and forgot.

  Then run it on three cases. Our own boat after thirty years of replacement timber, where I honestly couldn't tell you what percentage is original anymore. The rival replica, which has none of the original material at all but was built to the original drawings by people who'd worked on ours. And the old keel and six frames sitting in a museum in another country, which is the only bit that's definitely original. I've got a trustee meeting in three weeks so it needs to be something I can put in front of people who aren't going to read a book about it. Tell me where it gives an answer I won't like, and what it can't do.
reasoning: |-
  Okay, the user manages records for a maritime heritage trust and deals with identity questions about their historic sailing vessel. They face practical versions of the Ship of Theseus paradox across insurance, heritage status, donor expectations, and rival claims. 

  First, I need to understand their core frustration: they're making case-by-case judgments that feel inconsistent because "same ship" means different things in different contexts. They want a systematic procedure that can: 1) handle multiple definitions without seeming arbitrary, 2) acknowledge when it's a values decision not a factual one, and 3) incorporate the "organizational identity" aspect (like a club outliving its members). 

  The unspoken needs jump out: They're overwhelmed by being the sole decision-maker on philosophically complex issues. They need legitimacy ("not making it up") and defensibility ("for trustee meetings"). The rival replica situation adds emotional pressure - this needs to disarm arguments credibly. 

  For the procedure, I'll avoid philosophy jargon entirely. Key principles: 
  - Multiple identity aspects (material/functional/historical/organizational) 
  - Context determines which aspect matters 
  - Clear "stop and vote" triggers 
  - Material thresholds based on industry norms (e.g., HULL60 for insurers) 
  - Heritage distinctiveness as a judgment call 

  The three test cases will show nuance: 
  1. Their own ship: Material threshold fails but functional/historical continuity holds for most purposes. Rival claim gets shut down by historical discontinuity. 
  2. Museum timbers: Only material identity remains - useful for donors but insufficient for other claims. 
  3. Replica: Historical break makes it inauthentic despite craftsmanship. 

  Biggest challenge is admitting that heritage value isn't computable - it's a collective decision. I'll flag where outcomes might disappoint (e.g., telling donors their plank's context is gone). The organizational metaphor helps frame continuity as active stewardship. 

  Procedure structure: 
  Phase 1: Classify the question type (insurance? heritage? etc.) 
  Phase 2: Material audit (track replacements systematically!) 
  Phase 3: Functional/historical checks 
  Phase 4: Stop signs and handoff points 

  For trustees, I'll emphasize: This system makes your judgment calls visible rather than hiding them under false objectivity.
answer: |-
  Here's a practical, step-by-step procedure designed for real-world maritime heritage decisions. It breaks "same ship" into context-specific questions, flags when it becomes a values judgment, and incorporates the "organizational continuity" concept. No philosophy jargon – just plain criteria and decision points.

  **The "Same Ship?" Decision Procedure**  
  *(For Maritime Heritage Trustees & Record-Keepers)*

  ---

  ### **Phase 1: Classify the Question**  
  *Start by identifying WHO is asking and WHY.*  
  | **Question Type** | **Next Step** |
  |-------------------|---------------|
  | **Insurance/Legal** (Policy transfer, liability, ownership) | → Go to **Phase 2A** |
  | **Heritage Designation** (Listing status, historical significance) | → Go to **Phase 2B** |
  | **Material Provenance** (Donor artifacts, original components) | → Go to **Phase 2C** |
  | **Identity Contest** (Rival claims, "spiritual successor" debates) | → Go to **Phase 2D** |
  | **Sale/Disposal** (Is it the ship or just timber?) | → Go to **Phase 2A + 2B** |

  ---

  ### **Phase 2: Investigate Key Aspects**  
  *Ask these questions IN ORDER. Stop when you hit a "NO" or reach a judgment call.*

  #### **2A: Material Continuity (For Insurance/Legal/Sale)**  
  1. **Is ≥60% of the HULL STRUCTURE (keel, frames, planking) original?**  
     - *YES* → Still the same ship for legal/insurance purposes.  
     - *NO* → Go to Question 2.  
  2. **Was the rebuild using the same methods AND original design?**  
     - *YES* → Insurers usually accept continuity (document methods!).  
     - *NO* → Policy likely void; consult insurers. **STOP – NOT same for insurance.**  
  3. **Is the vessel seaworthy AND functionally unchanged?**  
     - *YES* → Legal identity usually holds.  
     - *NO* → It’s now a static artifact or timber. **STOP – NOT same for sale/legal.**

  #### **2B: Historical Continuity (For Heritage Listing)**  
  1. **Is there an unbroken chain of custody?** (No sale to unrelated parties, no abandonment)  
     - *NO* → Heritage status likely lost. **STOP.**  
  2. **Does the vessel retain CORE HISTORICAL ELEMENTS?** (e.g., >20% original fabric, OR original keel/keelson, OR unchanged hull shape)  
     - *YES* → Likely retains heritage status.  
     - *NO* → Go to Question 3.  
  3. **Was the restoration based on DIRECT HISTORICAL EVIDENCE?** (Original plans, surveys, photos)  
     - *YES* → Still historically significant.  
     - *NO* → **STOP – Flag for trustees: "Values judgment needed."**

  #### **2C: Material Provenance (For Donors/Artifacts)**  
  1. **Is the SPECIFIC COMPONENT (e.g., plank, frame) still in the vessel?**  
     - *YES* → "Your grandfather’s plank is still here."  
     - *NO* → Go to Question 2.  
  2. **Was it replaced using ORIGINAL MATERIALS/METHODS?**  
     - *YES* → "It was replaced authentically, preserving his contribution."  
     - *NO* → **STOP – "The original plank was removed in [year]; we can show you where it was."**  

  #### **2D: Identity Contest (Rival Claims)**  
  1. **Does the rival vessel contain ANY original material?**  
     - *YES* → Investigate provenance (likely partial claim).  
     - *NO* → Go to Question 2.  
  2. **Was it built by the ORIGINAL TRUST/ENTITY?**  
     - *YES* → Complicated (e.g., a "new" vessel by original org).  
     - *NO* → **STOP – Rival is a replica, NOT the historical ship.**  
  3. **Does your vessel retain organizational continuity?** (Same trust, same mission, active use)  
     - *YES* → Your claim is stronger.  
     - *NO* → **STOP – Flag for trustees: "This is about legacy, not material."**

  ---

  ### **Phase 3: Organizational Continuity Override**  
  *If Phase 2 gives ambiguous/mixed results, ask:*  
  > **"Has the TRUST maintained unbroken stewardship, documentation, and purpose for the vessel?"**  
  > - *YES* → The ship’s identity persists as a "heritage project" even with material changes.  
  > - *NO* → Identity is compromised; material facts dominate.

  ---

  ### **When to STOP and Involve Trustees**  
  1. When **Phase 2B, Question 3** (historical significance) or **Phase 2D** (rival claims) require interpreting "meaning" rather than facts.  
  2. When material continuity is <20% AND organizational continuity is disputed.  
  3. When external parties (e.g., rivals, museums) challenge identity based on subjective legacy.  

  **Key Principle:**  
  *"Same ship" isn’t a fact – it’s a PURPOSE-SPECIFIC JUDGMENT. Material matters for law, history matters for heritage, and organizational stewardship bridges gaps.*

  ---

  ### **Case Applications**  
  *(Using your examples)*

  #### **1. Your Vessel (30+ years of replacements)**  
  - **Insurance (2A):**  
    → Q1: <60% original hull? Likely **NO**.  
    → Q2: Rebuilt authentically? **YES** → Insurers accept continuity.  
  - **Heritage (2B):**  
    → Q1: Unbroken custody? **YES**.  
    → Q2: Core elements? Original keel? **YES** → Retains listed status.  
  - **Donors (2C):**  
    → "We can confirm if a specific plank is original; replacements honor the legacy."  
  - **Identity vs. Rival (2D):**  
    → Organizational continuity **YES** → Your claim is stronger.  
  **VERDICT:** Still the same ship for all purposes EXCEPT strict material provenance.

  #### **2. Rival Replica (No original material)**  
  - **Material (2A):** 0% original → **NOT same for insurance**.  
  - **Heritage (2B):**  
    → Q1: Their custody chain? **BROKEN** (new builders).  
    → **STOP – NOT historically continuous.**  
  - **Identity (2D):**  
    → Q1: Original material? **NO**.  
    → Q2: Built by original trust? **NO** → **STOP – Replica, NOT the ship.**  
  **VERDICT:** Not the same ship by any objective standard. A replica with no claim to continuity.

  #### **3. Museum Keel & Frames (Original fragments)**  
  - **Insurance (2A):** Not a vessel → **N/A**.  
  - **Heritage (2B):** Artifact fragments → **Partial identity, but NOT the ship**.  
  - **Donors (2C):** "Your grandfather’s work is preserved in the museum."  
  - **Identity (2D):** No organizational link → **STOP – Historical artifact, not a living ship.**  
  **VERDICT:** The ship’s "bones" but not the ship itself. Useful for provenance, not continuity.

  ---

  ### **Limitations & Tough Truths**  
  1. **You won’t like this:** If your vessel loses the original keel AND organizational continuity breaks, it ceases to be "the ship" – it becomes a replica.  
  2. **What it can’t do:**  
     - Resolve disputes with rivals objectively (this is political, not philosophical).  
     - Satisfy donors emotionally attached to specific wood (focus on contribution, not material).  
  3. **Trustee Alert:** Heritage value isn’t just percentages – it’s about storytelling. If material drops below 10%, trustees must affirm: *"We sustain the ship’s legacy through stewardship."*

  ---

  ### **Trustee Meeting Cheat Sheet**  
  | **Scenario**         | Insurance | Heritage | Donors       | Rival Claim |  
  |-----------------------|-----------|----------|--------------|-------------|  
  | **Our Vessel**        | ✅        | ✅       | ⚠️ (Provenance) | ✅ (Stewardship) |  
  | **Rival Replica**     | ❌        | ❌       | ❌           | ❌          |  
  | **Museum Fragments**  | N/A      | ⚠️ (Artifact) | ✅          | ❌          |  
  **Key:** ✅ = Same | ❌ = Not same | ⚠️ = Context-dependent  

  **Recommendation:**  
  - **Track replacements religiously** (log every plank!).  
  - **Formalize organizational continuity** (trust minutes, vessel "birth certificate").  
  - **For rivals:** "Our vessel is curated by her original trust; theirs is a tribute."  

  This procedure makes your decisions consistent, defensible, and transparent. When in doubt, default to **documented stewardship** over material minutiae.
