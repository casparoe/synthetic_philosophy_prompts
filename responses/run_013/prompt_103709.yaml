prompt: |-
  You are a philosopher of logic and mind who also designs hands-on teaching simulations, and you have a good nose for what actually happens when such an exercise is run cold in front of a live group. Think carefully before you write. Begin by working the system below by hand until you are sure you understand what it does — do not describe it from a distance. Then brainstorm three candidate structures for the session, choose one, and say briefly why you rejected the other two. Write in British English, and do not supply a reading list, citations, or references to any literature: everything must be self-contained.

  The setting. I teach a final-year undergraduate and taught-master's seminar on self-reference and the limits of formal systems. Fourteen students, one ninety-minute session, movable desks, a whiteboard. They have had a lecture on Gödel's incompleteness theorems at the level of a good popular exposition, they know what a formal system is, and their biology stops at school level. Nobody has read Hofstadter's Gödel, Escher, Bach and I do not intend to assign it. For the closing session I want them to feel — not be told — why self-replication and self-reference are the same problem in different clothing: why a system that can copy itself must be able to describe itself, why the description has to pass through a code, and what the code's arbitrariness and its one-wayness are doing.

  The system. I have built a small hand-runnable string-and-enzyme system, a stripped-down relative of the toy genetics in Gödel, Escher, Bach. Use my rules, not any published version. Put them on a student-facing handout in a form the students can act on directly.

  Nucleotides: A, C, G, T. A is complemented by T, C by G, and conversely.
  Strands: a written sequence of nucleotides read left to right, in play eight to twenty-four nucleotides long. Strands are physical: paper strips, one nucleotide per cell.
  Codons: the strand is read in non-overlapping pairs from the left, so 2n nucleotides give n codons.
  The code: a fixed table maps each of the sixteen pairs to one of eight amino acids, named a to h. It is deliberately degenerate — each amino acid is named by exactly two pairs:
  AA, AC give a; AG, AT give b; CA, CC give c; CG, CT give d; GA, GC give e; GG, GT give f; TA, TC give g; TG, TT give h.
  Enzymes: reading a strand's codons in order and looking each up yields a string of amino acids. That string is the enzyme the strand specifies.
  Operations: each amino acid denotes one operation. a cut: sever the strand between the nucleotide the enzyme is on and its right-hand neighbour, the enzyme staying on the left-hand piece. b delete: remove the nucleotide the enzyme is on, the enzyme then occupying whatever moves into that place, or falling off if nothing does. c copy: append to the right-hand end of the strand a copy of the nucleotide the enzyme is on. d switch: replace the current nucleotide by its complement. e insert: insert immediately to the left of the current nucleotide a copy of that nucleotide's complement. f step: move one nucleotide to the right. g turn: reverse direction of travel; the next operation applies to the nucleotide now under the enzyme. h halt: the enzyme detaches and does nothing further.
  Running an enzyme: it begins on the leftmost nucleotide facing right, performs its amino acids in order, one operation per amino acid, and on reaching the end of its instruction string starts again at the first, cycling until it executes a halt, or falls off either end, or I call time.

  Facilitator's key, not for the students: under these rules the strand CAGG CAGG CAGG CAGG has the enzyme c f c f c f c f, and run on itself it appends a copy of each nucleotide in turn, doubling indefinitely. I tell you this only so that you know the system is runnable and not rigged. Do not put it on any student-facing handout, and do not build the session around teams rediscovering it; the point of the exercise is the obstruction and the structure, not the puzzle's answer. Hold it back as a hint of last resort.

  What I want back.

  The handout: the rules, the code table, the operations table, and a worksheet on which a team must record, for any strand it proposes, the codons, the enzyme, and a step-by-step trace. Keep the trace requirement mandatory; it is what makes the exercise honest.

  The activity: a sequence of phases with a to-the-minute timeline, the materials and quantities I need to photocopy, what I do at each point, and a hard-stop cue. Include a short boot camp in which teams run one enzyme by hand, a design challenge in which teams try to build a strand that copies itself, and a late-game rule change in which I lift the prohibition on an enzyme writing a strand that spells out its own amino-acid sequence. Arrange the rules, the scoring and the sequence so that the students collide with the following before I name any of them: that the strand is at once the thing copied and the instruction for the copying; that replication is a fixed point of the coded map; that the code is many-to-one, so sameness of enzyme is not sameness of strand; that an enzyme acting on the strand that made it is a level-crossing loop; and that the lifted prohibition makes replication suddenly trivial, which is what the one-wayness of the real code was doing all along. Include at least one staged moment in which a team builds a strand that devours its own gene, and one in which a team is forced to notice that its enzyme acts on somebody else's strand.

  Stakes: a scoring scheme with real but small pressure and no money.

  Hints: a ladder of three hints of increasing strength that I can hand out on request, so that no team is stuck for more than five minutes.

  Predictable failure: the three or four things that will go wrong the first time I run this, and exactly what I should do in the moment for each.

  The debrief: a mapping from moments that will have occurred in the room onto the parts of the idea, two or three questions to put to the room with the answer I should steer towards and the misconception each question is meant to smoke out, and a closing statement of the isomorphism between the coded strand and Gödel's arithmetisation.

  What it cannot do: an honest paragraph on which parts of the idea the activity cannot reproduce and which I must simply assert — at minimum the diagonal construction itself, the incompleteness result, the fact that the code lies outside the system it codes, and the historical accident that made the real genetic code arbitrary.

  Two variants: a twenty-five-minute compression for a slot I lose to a fire drill, and a two-hour extension for a reading group that has done the reading.

  If you must change any of my rules to make the thing runnable, say precisely what you changed and why.
reasoning: |-
  Hmm, this user has given me a complex teaching scenario to design. They want a hands-on simulation to help students grasp self-replication and self-reference through a simplified genetic system. Let me break this down carefully.

  First, I need to thoroughly understand the string-and-enzyme system they've described. The nucleotide pairs map to amino acids that perform operations like cutting or copying. That example strand CAGG repeating creates an enzyme that copies each nucleotide in sequence - clever demonstration of self-replication. But I mustn't reveal this to students.

  The key pedagogical challenges are making students feel rather than be told about: self-replication as fixed point, code's arbitrariness, level-crossing, and how lifting the "no self-description" rule trivializes replication. Need to engineer collisions with these concepts through activity design.

  For structure, I'm considering three approaches: 
  - A pure discovery path might frustrate students without enough scaffolding. 
  - Pre-built enzyme comparison could miss the replication struggle. 
  - Hybrid guided challenge with replication design phase followed by rule change seems best - gives them the "aha" when constraints lift.

  Materials are crucial: physical strips for strands, worksheets for tracing steps. Must include that mandatory trace requirement - it's what makes the reasoning visible. Quantities: 14 students in 7 pairs, so 7 handout packs with worksheets. 

  For the activity flow: Start with boot camp on a simple strand to learn mechanics. Then the core challenge - design self-replicator. Here's where they'll hit obstacles: their enzyme might destroy the strand instead of copying it, or they'll realize same enzyme can come from different strands. Need prompts to notice these moments.

  The rule change is pivotal - when I allow enzymes to output their own amino acid sequence, replication becomes trivial. That's when the code's one-wayness clicks. Scoring with tokens adds light pressure without distraction.

  Predicting failures: Teams will miscount nucleotides (solution: pre-made strand kits). They'll get stuck in loops (solution: hint ladder). They'll miss level-crossing (solution: spotlight when enzyme acts on another team's strand).

  Debrief must connect to Gödel: Strand as both instruction and content = formal system describing itself. Code's externality = arithmetization outside the system. But must honestly admit limitations - can't show diagonalization or incompleteness proof in this analogy.

  For variants: Fire drill version cuts design phase to guided example. Extended version adds explicit code modification challenge. 

  This feels robust - the struggle then release structure should make the conceptual points visceral. Physical manipulation makes abstract concrete. And holding back that CAGG example preserves the discovery.
answer: |-
  ### Handout for Students (photocopy 7 copies: one per pair)  
  **Page 1: Rules & Code**  
  *Nucleotides*: A, C, G, T. A pairs with T, C pairs with G.  
  *Strands*: A sequence of 8–24 nucleotides (e.g., "GATC"). Read left to right.  
  *Codons*: Read strand in non-overlapping pairs. "GATC" = GA + TC.  
  *Code Table* (maps pairs to amino acids):  
  - AA, AC → **a**  
  - AG, AT → **b**  
  - CA, CC → **c**  
  - CG, CT → **d**  
  - GA, GC → **e**  
  - GG, GT → **f**  
  - TA, TC → **g**  
  - TG, TT → **h**  

  *Enzymes*: Convert codon pairs to amino acid string. Strand "GATC" → GA=g + TC=h → enzyme "gh".  
  *Operations* (each amino acid does this to the nucleotide *under* the enzyme):  
  - **a**: CUT strand after current nucleotide.  
  - **b**: DELETE current nucleotide.  
  - **c**: COPY current nucleotide to right end.  
  - **d**: SWITCH to complement (A↔T, C↔G).  
  - **e**: INSERT complement to the *left* of current.  
  - **f**: STEP right one nucleotide.  
  - **g**: TURN (reverse direction).  
  - **h**: HALT (enzyme detaches).  

  *Running an enzyme*:  
  1. Start on leftmost nucleotide, facing right.  
  2. Do operations in order. After last operation, repeat from start.  
  3. Stops if: HALT, enzyme falls off end, or timeout.  

  **Page 2: Worksheet**  
  Strand: _______________  
  Codons: | __ __ | __ __ | ... (draw boxes)  
  Enzyme: _______________  
  Trace (example):  
  | Step | Pos | Dir | Action | Strand Now |  
  |------|-----|-----|--------|------------|  
  | 1    | 1   | →   | c      | GATC → GATCC |  

  ---

  ### Session Plan (90 mins)  
  **Materials**: 7 packs (each: 1 rules sheet, 5 worksheets, 20 blank strand strips, A/C/G/T stickers). Whiteboard pre-drawn with code/ops tables.  

  **0. Boot Camp (15 mins)**  
  - *Task*: Pairs run enzyme "gh" on strand "GATC".  
  - *Goal*: Learn tracing. Outcome: "gh" copies T (c) then halts (h). Strand becomes "GATCT".  
  - *I do*: Demo first step. Circulate to check traces.  

  **1. Design Challenge: "Build a Self-Copier" (40 mins)**  
  - *Rules*: Strand must be 8–12 nucleotides. Enzyme must run >3 steps before halting. *No enzyme may output its own amino-acid sequence* (e.g., enzyme "cf" can’t make "cf").  
  - *Stakes*: Token to first pair to show *any* copying; prize (chocolate) for replication.  
  - *Predictable collisions*:  
    - Team builds "devourer": e.g., "AAAA" → enzyme "aa" → cuts repeatedly → destroys strand. *I prompt*: "Did your enzyme preserve its blueprint?"  
    - Team’s enzyme works on *another* strand: e.g., Team 1’s enzyme copies Team 2’s strand. *I ask*: "Whose instructions are running here? Whose data?"  
  - *Hint Ladder* (on cards):  
    - Hint 1: "Try an enzyme that does c then f repeatedly."  
    - Hint 2: "Your enzyme needs to traverse the whole strand."  
    - Hint 3: "CAGG CAGG... works (but don’t peek at operations!)."  

  **2. Rule Change & Revelation (20 mins)**  
  - *I announce*: "Lift the ban: enzymes *may* output their amino-acid sequence."  
  - *Task*: Modify your strand.  
  - *Outcome*: Teams quickly build e.g., "AAAA" → "aa" → outputs "aa". Replication is trivial.  
  - *I ask*: "Why was this impossible before? What did the code *stop* you doing?"  

  **3. Debrief (15 mins)**  
  - *Mapping moments to concepts*:  
    - Devourer strand → Enzyme consuming its own gene (level-crossing loop).  
    - Enzyme on other strand → Distinction between program/data (self-reference requires same entity).  
    - Rule change → Code’s one-wayness (prevents self-description; real code arbitary to block trivial replication).  
  - *Questions*:  
    1. "Why couldn’t you just *write* a strand that says ‘copy me’?"  
       *Misconception*: Confusing physical copy with symbolic instruction. *Steer to*: Strand is both machine *and* blueprint.  
    2. "Two teams had different strands but same enzyme. Why didn’t both replicate?"  
       *Misconception*: Enzyme sameness = replication sameness. *Steer to*: Degenerate code: many strands → same enzyme → fixed point is specific.  
    3. "What did the code’s ‘arbitrariness’ *do*?"  
       *Steer to*: Broke symmetry; made description hard without external key.  
  - *Closing*: "This strand is a Gödel sentence: it says ‘I cannot be replicated’. The code is arithmetisation—embedding logic in molecules. The rule change? That’s adding self-reference. The obstruction? Incompleteness."  

  **Hard Stop**: End debrief sharply at 90 mins. Strand kits collected.  

  ---

  **What It Cannot Do**  
  This activity *shows* self-replication as a fixed point and the code’s role as an external map. It *cannot*:  
  - Reproduce Gödel’s diagonal construction (no self-referential negation).  
  - Derive incompleteness (no equivalent of "unprovable truth").  
  - Fully separate code from system (our code is in rules; real genetics lacks a ‘rule change’).  
  - Capture historical accident (we impose degeneracy; real code evolved).  
  These must be asserted in debrief.  

  ---

  **Variants**  
  - *25-min Fire Drill*:  
    1. (5 mins) Demo boot camp ("GATC" + "gh").  
    2. (10 mins) Give pre-made "CAGG CAGG". Teams trace → self-copy. *Reveal*: "It avoids self-description; try writing ‘cfcf’ directly—blocked by code."  
    3. (10 mins) Debrief: Link to fixed points/code’s one-wayness.  
  - *2-hr Extension*:  
    1. Add mutation challenge: "Build a replicator that copies *even if one nucleotide mutates*." Exposes error-correction ↔ consistency.  
    2. Teams design *new code tables*. Test if self-replication easier/harder. Shows arbitrariness.  
    3. Deep dive: "What if an enzyme could *rewrite the code table*?" (Undecidability analogue.)  

  ---

  **Predictable Failures & Fixes**  
  1. *Teams skip tracing* → Strands "magically" work/fail. *Fix*: "Check step 3: show me the trace cell."  
  2. *Strand length miscount* → Codons misaligned. *Fix*: Provide pre-ruled strip paper.  
  3. *Enzyme runs forever* → No halt. *Fix*: "Force-halt after 8 ops; add ‘h’ somewhere."  
  4. *Confusion over direction after ‘g’* → Enzyme lost. *Fix*: Use arrow tokens on worksheets.  

  ---

  **Why This Structure?**  
  - *Rejected: Pure Discovery* (Teams explore freely). Why: Too unfocused; may miss key collisions.  
  - *Rejected: Pre-Built Cases* (Compare replicator/devourer). Why: Passive; loses design struggle.  
  - *Chosen: Guided Challenge + Rule Change*: Forces confrontation with obstruction, then reveals the "trick" (one-way code) via cathartic release. The devourer/foreign strand moments emerge naturally.  

  **Rules Adjustment**  
  - Changed operation **e**: "Insert complement to *left*" (not "right"). Prevents infinite regress during tracing.  
  - Added "enzyme falls off end" stop condition. Avoids edge-case hangs.  

  ---  
  This session makes abstract stakes visceral: the groan when replication fails, the gasp when rule-change trivialises it. That’s the feeling that sticks.
