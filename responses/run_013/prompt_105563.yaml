  Okay, I need to tackle this user's query step by step. The user is a philosopher of biology and cognitive scientist, deeply familiar with cultural evolution literature, and they're frustrated with the stagnant debate between two camps: one viewing cultural change as genuinely Darwinian, and the other as reconstruction driven by cognitive biases. They suspect the impasse isn't empirical but might involve differing definitions of "Darwinian," explanatory targets, or model explanatory power. My task is to brainstorm diagnoses, pick the best one, and suggest paths for progress.

  First, I'll brainstorm candidate diagnoses. The user already hinted at possibilities: verbal disagreement over "Darwinian," different explanatory targets (population vs. individual), differing views on what makes models explanatory, or unresolved factual questions about fidelity. I should add more based on the literature. For instance, ontological commitments—whether cultural variants are discrete or continuous—could be key. Also, methodological priorities: one camp might favor formal modeling, the other cognitive mechanisms. 

  To discriminate between these, I need evidence from each camp's commitments. For the verbal disagreement, look at how they define "Darwinian." If the selectionist camp uses it broadly (any system with VSI) while the reconstructionist sees it narrowly (requiring replication), that's telling. For explanatory targets, check if they engage with each other's levels. If reconstructionists ignore population dynamics, or selectionists downplay cognitive biases, that indicates divergent questions. Regarding model explanatory value, see if reconstructionists dismiss population models as mere redescription without mechanism. For the fidelity question, examine if they interpret the same empirical data differently—e.g., transmission chain experiments showing both fidelity and transformation.

  Now, committing to the best diagnosis. I think the core issue is differing explanatory targets. The selectionist camp focuses on macro-level patterns (why some traits spread), using population models as explanatory even without detailed mechanisms. The reconstructionist camp cares about micro-level cognitive processes (how individuals generate cultural forms), seeing biases as primary. They can't grant each other's points because they value different kinds of explanations. For selectionists, admitting cognitive biases might feel like reducing their models to epiphenomena. Reconstructionists might see population models as missing the real cognitive action. This isn't just verbal; it's about what constitutes a satisfying explanation.

  Is it substantive or different questions? Both. They share the broad question of cultural change but address different sub-questions. This makes the debate persistent because neither side's answer resolves the other's concerns.

  For progress, I propose a multi-level framework integrating both perspectives. Require formal models to specify cognitive mechanisms (e.g., adding bias parameters to population models) and ground biases in evolutionary origins. Shift focus to when each approach is most explanatory—e.g., reconstruction for emergent traits, selection for trait spread. Crucially, redefine explanatory success to include cross-level integration. Progress isn't about declaring a winner but building bridges through models that incorporate both selection and reconstruction, showing how they interact in specific cases.

  The user might need this to move beyond the stalemate in their work. As an expert, they probably want actionable solutions, not just analysis. So emphasizing concrete steps like integrated modeling or redefining questions could be valuable. Also, addressing their deeper need for conceptual clarity to advance research, possibly guiding future studies or collaborations.
answer: |-
  Here’s a diagnosis grounded in the commitments of each camp, followed by a prescription for progress:

  **Brainstormed Diagnoses & Discriminating Evidence:**  
  1. **Verbal Dispute Over "Darwinian"**  
     - *Evidence*: Selectionists define "Darwinian" minimally (heritable variation + differential fitness → adaptation). Reconstructionists require high-fidelity replication (e.g., genes).  
     - *Discriminator*: If selectionists concede cultural variants aren’t replicated *like genes* but insist the *population dynamics* are Darwinian, the label is contested.  

  2. **Divergent Explanatory Targets**  
     - *Evidence*: Selectionists model population-level outcomes (e.g., trait distributions). Reconstructionists target cognitive mechanisms (e.g., why certain biases exist).  
     - *Discriminator*: Reconstructionists rarely deny population dynamics occur but argue they *reduce to* cognitive processes. Selectionists dismiss cognitive biases as "noise" in aggregate models.  

  3. **Model Explanatory Value**  
     - *Evidence*: Selectionists treat formal models (e.g., Price equation) as *explanatory*. Reconstructionists see them as mere statistical summaries lacking mechanistic insight.  
     - *Discriminator*: If selectionists reject *any* non-population-genetic explanation of adaptation (e.g., developmental biases), they prioritize modeling framework over ontology.  

  4. **Hidden Factual Disagreement**  
     - *Evidence*: Both cite transmission chain experiments. Selectionists focus on cumulative change despite noise; reconstructionists emphasize transformation.  
     - *Discriminator*: If reconstructionists accept that *some* cultural traits (e.g., ritual phrases) show high fidelity, the dispute narrows to domain-specificity.  

  5. **Ontological Commitment**  
     - *Evidence*: Selectionists treat cultural variants as discrete units ("memes"). Reconstructionists see them as fuzzy constructions.  
     - *Discriminator*: Reconstructionists' appeal to "attractors" implies variant discreteness is emergent, not fundamental.  

  ---

  **Committed Diagnosis: Divergent Explanatory Targets + Model Explanatory Value**  
  The core disagreement is **substantive but driven by distinct explanatory priorities**, not empirical facts.  

  - **What Selectionists Are Committed To**:  
    Cultural change *must* be explainable by population-level processes (variation, selection, inheritance) to count as "adaptation." Their models are explanatory *because* they show how population dynamics generate macro-patterns (e.g., cumulative complexity) *regardless* of underlying mechanisms. Granting reconstructionist premises (e.g., strong biases) feels like conceding that cultural adaptation is illusory or reducible to psychology.  

  - **What Reconstructionists Are Committed To**:  
    Explanation *must* reference cognitive mechanisms (e.g., domain-specific biases) to avoid "description without insight." Population models are mere bookkeeping; true causality lies in how minds *transform* input. Granting selectionism feels like mistaking mathematical abstraction for causal reality.  

  - **Why They Can’t Grant Each Other’s Points**:  
    - Selectionists *cannot concede* that cognitive biases are the primary drivers because it collapses cultural evolution into developmental psychology, denying the autonomy of population-level dynamics.  
    - Reconstructionists *cannot accept* population genetics as explanatory because it ignores the cognitive "work" generating variants, rendering models ontologically empty.  

  **Nature of Disagreement**:  
  - **Substantive**: They disagree on what constitutes an adequate explanation of cultural adaptation.  
  - **Different Questions**:  
    - Selectionists ask: *"How do population-level patterns emerge?"*  
    - Reconstructionists ask: *"How do individual-level processes generate cultural forms?"*  
    The shared label "Darwinian" obscures this divide.  

  ---

  **Path to Progress**  
  Resolution requires **redefining explanatory success** and **developing cross-cutting tools**:  

  1. **Formalize Bias-incorporating Population Models**  
     - Integrate cognitive biases (e.g., content biases) as parameters in selection models (e.g., modified Price equation). *Progress*: Show when biases dominate vs. when selection dominates outcomes.  

  2. **Shift to "When/Where" Questions**  
     - Abandon "Is it Darwinian?" for: *"Under what conditions is cultural change driven primarily by (a) selective transmission, (b) reconstructive biases, or (c) their interaction?"*  
     - *Progress*: Case studies (e.g., technological vs. myth transmission) mapping mechanisms to domains.  

  3. **Demand Dual Explanatory Adequacy**  
     - Require models to:  
       (a) Fit population-level data,  
       (b) Specify cognitively plausible transmission mechanisms.  
     - *Progress*: Models that fail (e.g., high-fidelity assumptions unsupported by psychology) are rejected.  

  4. **Decisive Experiment: Transmission Under Cognitive Load**  
     - If reconstruction is correct, increasing cognitive load during transmission should amplify biases and attractor effects. If selection dominates, load should increase drift but not distort directional trends.  

  5. **Redefine "Darwinian" as a Dynamical Regime**  
     - Adopt a continuum: Systems are "Darwinian" to the degree that *population-level selection* explains outcomes *relative to* reconstructive biases.  
     - *Progress*: Mathematical criteria for "bias-dominated" vs. "selection-dominated" dynamics.  

  **Why Progress Is Possible**:  
  The camps agree on data but lack a shared framework for integrating explanations. Formal models that incorporate cognitive constraints (e.g., Bayesian learners in evolutionary models) can bridge the gap by showing *how population dynamics emerge from biased reconstruction*. The impasse persists because neither side’s tools can fully capture the other’s insights—synthesis requires new mathematics, not new ethnography.
